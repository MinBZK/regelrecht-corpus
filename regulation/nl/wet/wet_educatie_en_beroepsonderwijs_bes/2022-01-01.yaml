        artikel: '4'
        hoofdstuk: '4'
  - number: 4.2.2.4
    text: |-
      Het bevoegd gezag kan voor een periode van ten hoogste twee jaar afwijken van de eisen, bedoeld in het eerste
      lid, onder b tot en met d. Het bevoegd gezag kan deze periode met ten hoogste de helft verlengen indien bijzondere
      omstandigheden daartoe naar zijn oordeel aanleiding geven. Het bevoegd gezag beschikt over geordende gegevens met
      betrekking tot de toepassing van de tweede volzin.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel4.2.2
  - number: 4.2.3.1
    text: Bij algemene maatregel van bestuur worden bekwaamheidseisen vastgesteld voor de uitoefening van het docentschap.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel4.2.3
  - number: 4.2.3.2
    text: |-
      Bij algemene maatregel van bestuur kunnen bekwaamheidseisen worden vastgesteld voor bij die maatregel aan te wijzen
      onderwijsondersteunende werkzaamheden die rechtstreeks verband houden met het onderwijsleerproces.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel4.2.3
  - number: 4.2.3.3
    text: |-
      De in het eerste lid bedoelde bekwaamheidseisen zijn gericht op het handelen in het onderwijsleerproces, het
      algemeen professioneel handelen en het werken binnen een onderwijsorganisatie. Zij omvatten in elk geval eisen ten
      aanzien van:
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel4.2.3
  - number: 4.2.3.3.a
    text: pedagogisch-didactische kennis, inzicht en vaardigheden, en
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel4.2.3
  - number: 4.2.3.3.b
    text: vakbekwaamheid.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel4.2.3
  - number: 4.3.1
    text: |-
      Tot lid van het personeel, anders dan bedoeld in de [artikelen 4.2.1][ref1] en [4.2.2][ref2], kan slechts
      worden benoemd degene die in het bezit is van een verklaring omtrent het gedrag, afgegeven volgens de
      [Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag BES][ref3], die op het tijdstip van
      overlegging aan het bevoegd gezag niet ouder is dan 6 maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0028258
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel4.3.1
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '4'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0028258
  - number: 5.1.1
    text: |-
      Het bevoegd gezag stelt een representatief te achten vertegenwoordiging van ouders, studenten, vavo-studenten en
      personeel ten minste twee maal per jaar in de gelegenheid de algemene gang van zaken in de instelling met hem te
      bespreken.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel5.1
  - number: 5.1.2
    text: |-
      Het bevoegd gezag en de vertegenwoordigers van ouders, studenten, vavo-studenten en personeel komen bijeen indien
      daarom onder opgave van redenen door het bevoegd gezag, de vertegenwoordigers van ouders of de vertegenwoordigers
      van personeel wordt verzocht. De besprekingen kunnen namens het bevoegd gezag worden gevoerd.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel5.1
  - number: 5.1.3
    text: |-
      Indien een beroepsopleiding wordt verzorgd aan een scholengemeenschap als bedoeld in
      [artikel 123 van de Wet voortgezet onderwijs BES][ref1], is [artikel 57 van die wet][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel123
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel57
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '123'
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '57'
  - number: 6.1.1.1
    text: |-
      Het Centraal register is een systematisch geordende verzameling gegevens met betrekking tot de erkende
      beroepsopleidingen. Onze Minister is belast met de aanleg, het beheer en de bekendmaking van het register en met
      het verstrekken van informatie uit het register. De bekendmaking en het verstrekken van informatie kunnen digitaal
      plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel6.1.1
  - number: 6.1.1.2
    text: 'Het Centraal register bevat de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel6.1.1
  - number: 6.1.1.2.a
    text: de naam en de code van de beroepsopleidingen,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel6.1.1
  - number: 6.1.1.2.b
    text: |-
      de naam van de instelling die de beroepsopleiding verzorgt, alsmede in welke leerweg of leerwegen de opleiding
      wordt verzorgd,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel6.1.1
  - number: 6.1.1.2.c
    text: of het een bekostigde beroepsopleiding betreft,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel6.1.1
  - number: 6.1.1.2.d
    text: de studieduur,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel6.1.1
  - number: 6.1.1.2.e
    text: |-
      de naam van de beroepsopleiding ten aanzien waarvan bij een instelling het recht op examinering is ontnomen en de
      ingangsdatum daarvan,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel6.1.1
  - number: 6.1.1.2.f
    text: |-
      de namen van de exameninstellingen, die het recht hebben op examinering van de betreffende beroepsopleiding,
      voorzover het recht op examinering niet is ontnomen.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel6.1.1
  - number: 6.2.1.1
    text: |-
      De erkenning van een beroepsopleiding vervalt indien een instelling blijk geeft de erkende beroepsopleiding niet
      meer te verzorgen of indien een instelling gedurende vier jaar een erkende opleiding niet heeft verzorgd.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel6.2.1
  - number: 6.2.1.2
    text: |-
      Onze Minister kan, ten aanzien van een beroepsopleiding die de instelling verzorgt, de in [artikel 1.4.1][ref1]
      bedoelde erkenning intrekken, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel1
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel6.2.1
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '1'
        hoofdstuk: '1'
  - number: 6.2.1.2.a
    text: gebleken is dat de kwaliteit van die opleiding onvoldoende is, of
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel6.2.1
  - number: 6.2.1.2.b
    text: |-
      niet of niet meer wordt voldaan aan de voorwaarden, bedoeld in [artikel 1.4.1, eerste lid][ref1], of aan
      [artikel 1.4.3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel1
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel6.2.1
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '1'
        hoofdstuk: '1'
  - number: 6.2.1.3
    text: 'Een beschikking op grond van het tweede lid houdt in dat ten aanzien van het desbetreffende onderwijs:'
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel6.2.1
  - number: 6.2.1.3.a
    text: |-
      de aanspraak op bekostiging, bedoeld in [artikel 2.1.1][ref1], voor zover van toepassing, vervalt,


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel2
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel6.2.1
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '2'
        hoofdstuk: '2'
  - number: 6.2.1.3.b
    text: |-
      aan de examens of onderdelen daarvan geen diploma of certificaat als bedoeld in [artikel 7.4.8][ref1] meer is
      verbonden, en


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel6.2.1
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 6.2.1.3.c
    text: de registratie in het Centraal register wordt beëindigd.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel6.2.1
  - number: 6.2.1.4
    text: Onze Minister maakt de ontneming van rechten, bedoeld in dit artikel, openbaar.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel6.2.1
  - number: 6.2.2.1
    text: |-
      De erkenning van een opleiding educatie vervalt indien een instelling blijk geeft de erkende opleiding educatie
      niet meer te verzorgen of indien een instelling gedurende vier jaar een erkende opleiding niet heeft verzorgd.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel6.2.2
  - number: 6.2.2.2
    text: |-
      Onze Minister kan, ten aanzien van een opleiding educatie die de instelling verzorgt, de in [artikel 1.4.2][ref1]
      bedoelde erkenning intrekken, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel1
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel6.2.2
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '1'
        hoofdstuk: '1'
  - number: 6.2.2.2.a
    text: gebleken is dat de kwaliteit van die opleiding onvoldoende is, of
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel6.2.2
  - number: 6.2.2.2.b
    text: |-
      niet of niet meer wordt voldaan aan de voorwaarden, bedoeld in [artikel 1.4.2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel1
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel6.2.2
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '1'
        hoofdstuk: '1'
  - number: 6.2.2.3
    text: |-
      Een beschikking op grond van het tweede lid houdt in dat ten aanzien van het desbetreffende onderwijs aan de
      examens of onderdelen daarvan geen diploma of certificaat als bedoeld in [artikel 7.4.8][ref1] meer is verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel6.2.2
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 6.2.2.4
    text: Onze Minister maakt de ontneming van rechten, bedoeld in dit artikel, openbaar.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel6.2.2
  - number: 6.2.2a.1
    text: |-
      Onze Minister kan aan een instelling het recht op examinering van een opleiding educatie als bedoeld in
      [artikel 7.3.1, eerste lid, onderdeel a][ref1], ontnemen, indien


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel6.2.2a
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
  - number: 6.2.2a.1.a
    text: de kwaliteit van de examens van die opleiding langer dan één jaar onvoldoende is geweest, of
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel6.2.2a
  - number: 6.2.2a.1.b
    text: niet of niet meer wordt voldaan aan hetgeen bij of krachtens deze wet is bepaald ten aanzien van de examens.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel6.2.2a
  - number: 6.2.2a.2
    text: |-
      Bij de ontneming van het recht, bedoeld in het eerste lid, wordt bepaald met ingang van welk tijdstip dit
      geschiedt. Onze Minister maakt de ontneming van het recht, bedoeld in het eerste lid, openbaar.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel6.2.2a
  - number: 6.2.2a.3
    text: |-
      Voordat Onze Minister een besluit als bedoeld in het eerste lid neemt, geeft hij het bevoegd gezag een waarschuwing
      op grond van zijn bevindingen over de kwaliteit van de examinering, onder bepaling van de termijn waarbinnen aan
      die waarschuwing gevolg moet zijn gegeven. Onze Minister maakt de waarschuwing openbaar.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel6.2.2a
  - number: 6.2.2a.4
    text: |-
      Het bevoegd gezag kan niet eerder dan na verloop van drie studiejaren na het besluit tot ontneming, bedoeld in het
      eerste lid, het recht op examinering opnieuw verkrijgen. [Artikel 1.4.2][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel1
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel6.2.2a
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '1'
        hoofdstuk: '1'
  - number: 6.2.3.1
    text: |-
      Voordat Onze Minister een beschikking treft op grond van [artikel 6.2.1, tweede lid, onderdeel a][ref1],
      respectievelijk [6.2.2, tweede lid, onderdeel a][ref2], geeft hij aan het bevoegd gezag een waarschuwing op grond
      van zijn bevindingen ten aanzien van de kwaliteit van de opleiding. Onze Minister geeft eerst toepassing aan
      artikel 6.2.1, tweede lid, onderdeel a, respectievelijk 6.2.2, tweede lid, onderdeel a, nadat:


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel6
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel6.2.3
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.2.3.1.a
    text: de waarschuwing ten minste een jaar verstreken is, en
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel6.2.3
  - number: 6.2.3.1.b
    text: |-
      Onze Minister aan de hand van een nader onderzoek tot het oordeel is gekomen dat niet of niet in voldoende mate
      gevolg is gegeven aan de waarschuwing.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel6.2.3
  - number: 6.2.3.2
    text: |-
      Voordat Onze Minister een beschikking neemt op grond van [artikel 6.2.1, tweede, onderdeel b][ref1],
      respectievelijk [6.2.2, tweede lid, onderdeel b][ref2], geeft hij aan het bevoegd gezag een waarschuwing, onder
      bepaling van een termijn waarbinnen aan die waarschuwing gevolg moet zijn gegeven en desgewenst overleg met hem
      dienaangaande plaats kan vinden. De termijn waarbinnen aan de waarschuwing gevolg moet zijn gegeven, bedraagt ten
      minste drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel6
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel6.2.3
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.2.3.3
    text: Onze Minister maakt de waarschuwingen, bedoeld in dit artikel, openbaar.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel6.2.3
  - number: 6.2.4.1
    text: |-
      Onze Minister kan aan een instelling het recht op examinering van een beroepsopleiding ontnemen, indien de
      kwaliteit van de examens van die opleiding niet voldoet aan de standaarden, bedoeld in [artikel 7.4.5][ref1]. Bij
      de ontneming van het recht wordt bepaald met ingang van welk tijdstip dit geschiedt. De ontneming wordt in het
      Centraal register bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel6.2.4
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 6.2.4.2
    text: |-
      Voordat Onze Minister een besluit als bedoeld in het eerste lid neemt, geeft hij het bevoegd gezag een waarschuwing
      op grond van zijn bevindingen over de kwaliteit van de examinering onder bepaling van de termijn waarbinnen aan die
      waarschuwing gevolg moet zijn gegeven. Onze Minister maakt de waarschuwing openbaar.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel6.2.4
  - number: 6.2.4.3
    text: |-
      Het bevoegd gezag kan niet eerder dan na verloop van drie studiejaren na de ontneming, bedoeld in het eerste lid,
      het recht opnieuw verkrijgen. [Artikel 1.6.1][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel1
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel6.2.4
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '1'
        hoofdstuk: '1'
  - number: 6.2.5.1
    text: |-
      In de gevallen, bedoeld in [artikel 6.2.1, tweede lid, onder a en b][ref1],
      [artikel 6.2.2, tweede lid, onderdeel a en b][ref2], en [artikel 6.2.4, eerste lid][ref3] kan Onze Minister op
      verzoek van het bevoegd gezag of uit eigen beweging in overeenstemming met het bevoegd gezag maatregelen treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0028395#Artikel6
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel6.2.5
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '6'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0028395
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.2.5.2
    text: |-
      Tot de maatregelen, bedoeld in het eerste lid, behoort de mogelijkheid het bestuur van de instelling te laten
      bijstaan door een extern deskundige, niet zijnde de deskundige als bedoeld in [artikel 1.1.1][ref1]. Ook kunnen
      onder voorwaarden extra financiële middelen aan de instelling ter beschikking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel1
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel6.2.5
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '1'
        hoofdstuk: '1'
  - number: 6.2.5.3
    text: |-
      Onze Minister stelt nadere regels omtrent de toekenning van en verantwoording voor maatregelen, voor zover deze het
      verstrekken van financiële middelen betreffen.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel6.2.5
  - number: 6.3.1
    text: |-
      [Artikel 6.2.4][ref1] en [6.2.5][ref2] zijn van overeenkomstige toepassing op exameninstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel6
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel6.3.1
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '6'
        hoofdstuk: '6'
  - number: 7.1.1.1
    text: Het onderwijs wordt gegeven en de examens worden afgenomen in het Nederlands.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.1.1
  - number: 7.1.1.2
    text: |-
      In afwijking van het eerste lid wordt het onderwijs gegeven en worden de examens afgenomen voor zover het betreft
      de assistentopleiding en de basisberoepsopleiding op Bonaire, ter keuze van het bevoegd gezag in het Nederlands of
      in het Papiaments en voor zover het betreft de assistentopleiding en de basisberoepsopleiding op Sint Eustatius en
      Saba, ter keuze van het bevoegd gezag, in het Nederlands of in het Engels. Bij het bepalen van zijn keuze betrekt
      het bevoegd gezag ten minste in zijn overwegingen:
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.1.1
  - number: 7.1.1.2.a
    text: de dominante taal op een eilandgebied,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.1.1
  - number: 7.1.1.2.b
    text: de gehanteerde instructietaal in de vooropleiding,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.1.1
  - number: 7.1.1.2.c
    text: |-
      de aard van de doelgroep en de mate aan kennis van de dominante taal of van de geëigende instructietaal op een
      eilandgebied bij deze doelgroep,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.1.1
  - number: 7.1.1.2.d
    text: de instructietaal van vervolgopleidingen, en
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.1.1
  - number: 7.1.1.2.e
    text: de beschikbaarheid van lesmateriaal in de desbetreffende instructietaal.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.1.1
  - number: 7.1.2.1
    text: |-
      De instelling biedt het onderwijs aan in de vorm van beroepsopleidingen of opleidingen educatie. Een
      beroepsopleiding wordt door de instelling in het maatschappelijk verkeer aangeduid met de naam van de kwalificatie
      waarop zij is gericht of voorzover het gaat om studenten die ingeschreven zijn of zullen worden voor een
      opleidingsdomein BES of een kwalificatiedossier, de naam van dat opleidingsdomein BES of dat kwalificatiedossier.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.1.2
  - number: 7.1.2.2
    text: |-
      Een beroepsopleiding is een onderwijstraject dat voor een student is ingericht overeenkomstig de eisen van
      [hoofdstuk 7, titel 2][ref1], en dat is gericht op het behalen van een kwalificatie in het beroepsonderwijs, ten
      bewijze waarvan een diploma wordt uitgereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.1.2
    references:
      - id: ref1
        bwb_id: BWBR0028395
        hoofdstuk: '7'
  - number: 7.1.2.3
    text: |-
      Een opleiding educatie is een samenhangend geheel van onderwijseenheden, gericht op de verwezenlijking
      van eindtermen of het behalen van een diploma, gelijkwaardig aan een diploma van scholen, bedoeld in de
      [artikelen 13 tot en met 15 van de Wet op het voortgezet onderwijs BES][ref1], of onderdelen van een dergelijk
      diploma.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel13
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.1.2
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '13'
  - number: 7.1.2.4
    text: Beroepsopleidingen worden afgesloten met een examen. Opleidingen educatie kunnen worden afgesloten met een examen.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.1.2
  - number: 7.1.3
    text: |-
      Een kwalificatie is het geheel van bekwaamheden die een afgestudeerde van een beroepsopleiding kwalificeren voor
      het functioneren in een beroep of een groep van samenhangende beroepen, in het vervolgonderwijs en als burger en
      dat is beschreven binnen een kwalificatiedossier.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.1.3
  - number: 7.2.1
    text: Deze titel is van toepassing op beroepsopleidingen.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.2.1
  - number: 7.2.2.1
    text: 'De volgende soorten beroepsopleidingen worden onderscheiden:'
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.2.2
  - number: 7.2.2.1.a
    text: de assistentopleiding,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.2.2
  - number: 7.2.2.1.b
    text: de basisberoepsopleiding,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.2.2
  - number: 7.2.2.1.c
    text: de vakopleiding,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.2.2
  - number: 7.2.2.1.d
    text: de middenkaderopleiding, en
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.2.2
  - number: 7.2.2.1.e
    text: de specialistenopleiding.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.2.2
  - number: 7.2.2.2
    text: 'De in het eerste lid bedoelde opleidingen bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.2.2
  - number: 7.2.2.2.a
    text: |-
      een beroepsopleidende leerweg, omvattend een praktijkdeel van ten minste 20% en minder dan 60% van de studieduur,
      of
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.2.2
  - number: 7.2.2.2.b
    text: een beroepsbegeleidende leerweg, omvattend een praktijkdeel van 60% of meer van de studieduur.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.2.2
  - number: 7.2.2.3
    text: |-
      De assistentopleidingen richten zich op de kwalificatie voor het eerste niveau van beroepsuitoefening of voor
      de entree op de arbeidsmarkt. De basisberoepsopleidingen richten zich op de kwalificatie voor het tweede, de
      vakopleidingen op de kwalificatie voor het derde en de middenkader en specialistenopleidingen op de kwalificatie
      voor het vierde en hoogste niveau van beroepsuitoefening.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.2.2
  - number: 7.2.2.4
    text: |-
      Aan de in het eerste lid bedoelde opleidingen kunnen ten behoeve van individuele studenten voorbereidende
      en ondersteunende activiteiten worden toegevoegd ter bevordering van het kunnen instromen in en met gunstig
      gevolg voltooien van de opleiding. Deze activiteiten maken geen deel uit van de opleiding. Voorbereidende en
      ondersteunende activiteiten zijn bestemd voor studenten wier vooropleiding naar het oordeel van het bevoegd gezag
      onvoldoende uitzicht biedt op het binnen een redelijke tijd behalen van de kwalificatie waarvoor de student en de
      instelling een onderwijsovereenkomst hebben gesloten.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.2.2
  - number: 7.2.3.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat aan onderdelen van een kwalificatie of
      kwalificaties een certificaat is verbonden.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.2.3
  - number: 7.2.3.2
    text: |-
      [Artikel 7.4.8][ref1] is van overeenkomstige toepassing op certificaten.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.2.3
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.2.4.1
    text: |-
      Bij ministeriële regeling wordt vastgesteld voor welke kwalificaties uit de kwalificatiedossiers, bedoeld in
      [artikel 7.2.4, tweede lid, onder a, van de Wet educatie en beroepsonderwijs][ref1], beroepsopleidingen verzorgd
      kunnen worden.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.2.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 7.2.4.2
    text: Bij ministeriële regeling worden op voorstel van de instellingen opleidingsdomeinen BES vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.2.4
  - number: 7.2.5
    text: |-
      Indien voor een beroep bij of krachtens een wet, verdrag of bindend besluit van een volkenrechtelijke organisatie,
      vereisten zijn vastgesteld over de kwaliteiten op het gebied van kennis, inzicht, vaardigheden of beroepshoudingen
      waarover degenen die een opleiding gericht op dat beroep voltooien, moeten beschikken, of over de examinering bij
      de desbetreffende beroepsopleiding:
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.2.5
  - number: 7.2.5.a
    text: |-
      neemt Onze Minister deze vereisten in acht bij de vaststelling van de standaarden, bedoeld in
      [artikel 7.4.5][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.2.5
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.2.5.b
    text: |-
      draagt de instelling er bij het aanbieden van een beroepsopleiding zorg voor dat degenen die deze opleiding volgen,
      ten minste in de gelegenheid zijn aan die vereisten te voldoen, en dat bij de examinering, zo nodig in afwijking
      van [titel 4][ref1] van dit hoofdstuk, aan die vereisten wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.2.5
    references:
      - id: ref1
        bwb_id: BWBR0028395
        hoofdstuk: '7'
  - number: 7.2.6.1
    text: |-
      Het bevoegd gezag draagt er zorg voor dat beroepsopleidingen zodanig zijn ingericht dat studenten, ongeacht of zij
      eerst worden ingeschreven voor een opleidingsdomein BES of voor een kwalificatiedossier, de kwalificatie binnen de
      vastgestelde studieduur kunnen bereiken.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.2.6
  - number: 7.2.6.2
    text: Beroepsopleidingen zijn voltijds of deeltijds dan wel zowel voltijds als deeltijds ingericht.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.2.6
  - number: 7.2.6.3
    text: |-
      Voltijdse beroepsopleidingen zijn opleidingen in de beroepsopleidende leerweg waarvan elk volledig studiejaar
      een studielast van 1 600 uren of meer heeft, en waarvoor het bevoegd gezag voor de student in instellingstijd
      een onderwijsprogramma verzorgt dat ten minste 850 uren per volledig studiejaar omvat. Indien de door Onze
      Minister vastgestelde studielast ertoe leidt dat in het laatste studiejaar de duur van de opleiding gerekend vanaf
      1 september en naar boven afgerond op hele maanden minder is dan 10 maanden, dan wordt de norm van 850 uren in dat
      jaar evenredig verlaagd.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.2.6
  - number: 7.2.6.4
    text: 'Het in instellingstijd verzorgde onderwijsprogramma, bedoeld in het derde lid, omvat:'
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.2.6
  - number: 7.2.6.4.a
    text: |-
      alle onderwijsactiviteiten, gericht op het bereiken van de onderwijs- en vormingsdoelen van de opleiding, waaraan
      door de student wordt deelgenomen onder verantwoordelijkheid en toezicht van het bevoegd gezag, of
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.2.6
  - number: 7.2.6.4.b
    text: |-
      alle onderwijsactiviteiten, gericht op het bereiken van de onderwijs- en vormingsdoelen van de doorlopende
      leerroute vmbo-mbo en de geïntegreerde route vmbo-basisberoepsopleiding.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.2.6
  - number: 7.2.6.5
    text: Beroepsopleidingen die niet zijn ingericht volgens het derde lid, zijn deeltijdse beroepsopleidingen.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.2.6
  - number: 7.2.7.1
    text: |-
      Van elke opleiding maakt onderricht in de praktijk van het beroep deel uit. De beroepspraktijkvorming kan voor
      een deel plaatsvinden in de periode waarin de student is ingeschreven voor een opleidingsdomein BES of een
      kwalificatiedossier.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.2.7
  - number: 7.2.7.2
    text: |-
      De beroepspraktijkvorming wordt verzorgd op grondslag van een overeenkomst inzake de beroepspraktijkvorming,
      gesloten door de in [artikel 7.2.8][ref1] genoemde partijen. De overeenkomst regelt de rechten en verplichtingen
      van partijen en omvat met inachtneming van het dienaangaande bij of krachtens deze wet bepaalde, ten minste
      bepalingen over:


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.2.7
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.7.2.a
    text: de aanvangsdatum en einddatum van de beroepspraktijkvorming, alsmede het aantal te volgen praktijkuren per jaar,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.2.7
  - number: 7.2.7.2.b
    text: de begeleiding van de student,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.2.7
  - number: 7.2.7.2.c
    text: |-
      dat deel van de kwalificatie dat de student tijdens de beroepspraktijkvorming dient te behalen en de beoordeling
      daarvan, en
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.2.7
  - number: 7.2.7.2.d
    text: de gevallen waarin en de wijze waarop de overeenkomst voortijdig kan worden ontbonden.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.2.7
  - number: 7.2.7.3
    text: |-
      Het bedrijf dat of de organisatie die de beroepspraktijkvorming verzorgt, draagt zorg voor de begeleiding van
      de studenten binnen het bedrijf. Het bevoegd gezag beoordeelt of de student het in het tweede lid, onderdeel c,
      bedoelde deel van de kwalificatie heeft behaald. Het bevoegd gezag betrekt bij die beoordeling het oordeel van het
      bedrijf onderscheidenlijk de organisatie, met inachtneming van de desbetreffende in de onderwijs- en examenregeling
      op te nemen regels.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.2.7
  - number: 7.2.8.1
    text: |-
      Het bevoegd gezag draagt zorg voor de totstandkoming van de in [artikel 7.2.7][ref1] bedoelde overeenkomst.
      De overeenkomst wordt gesloten door de instelling, de student en het bedrijf dat of de organisatie die de
      beroepspraktijkvorming verzorgt. De overeenkomst wordt voor zover het de beroepsbegeleidende leerweg betreft, mede
      ondertekend door de raad, die daarmee verklaart:


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.2.8
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.8.1.a
    text: |-
      dat het een bedrijf of organisatie betreft met een gunstige beoordeling als bedoeld in [artikel 7.2.9][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.2.8
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.8.1.b
    text: dat de gronden voor deze gunstige beoordeling nog steeds aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.2.8
  - number: 7.2.8.2
    text: |-
      Indien het bevoegd gezag en de raad na het sluiten van de in [artikel 7.2.7][ref1] bedoelde overeenkomst
      vaststellen dat de praktijkplaats niet of niet volledig beschikbaar is, de begeleiding tekortschiet of ontbreekt,
      het bedrijf of de organisatie niet langer beschikt over een gunstige beoordeling als bedoeld in het eerste lid,
      of sprake is van andere omstandigheden die maken dat de beroepspraktijkvorming niet naar behoren zal kunnen
      plaatsvinden, bevordert het bevoegd gezag, na overleg met de raad, dat een toereikende vervangende voorziening
      beschikbaar wordt gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.2.8
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.9.1
    text: |-
      De raad richt een stelsel van kwaliteitszorg voor de beroepspraktijkvorming in en zorgt ervoor dat bedrijven en
      organisaties die de beroepspraktijkvorming verzorgen eenmaal per vier jaar worden beoordeeld aan de hand van de
      in dit stelsel ontwikkelde criteria. Indien daartoe door bijzondere omstandigheden aanleiding bestaat kan controle
      frequenter plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.2.9
  - number: 7.2.9.2
    text: |-
      De raad maakt de in het eerste lid bedoelde criteria bekend. Van deze bekendmaking wordt mededeling gedaan in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.2.9
  - number: 7.2.9.3
    text: |-
      De raad draagt zorg voor openbaarmaking van een overzicht van bedrijven en organisaties met een gunstige
      beoordeling op grond van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.2.9
  - number: 7.2.9.4
    text: |-
      Tot het verzorgen van de beroepspraktijkvorming voor een opleiding of groep van opleidingen zijn uitsluitend
      bevoegd de bedrijven en organisaties met een gunstige beoordeling op grond van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.2.9
  - number: 7.3.1.1
    text: 'De volgende opleidingen educatie worden onderscheiden:'
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.3.1
  - number: 7.3.1.1.a
    text: |-
      opleidingen voortgezet algemeen volwassenenonderwijs, gericht op het behalen van een diploma, bedoeld in de
      [artikelen 13 tot en met 15 van de Wet voortgezet onderwijs BES][ref1], of onderdelen van dat diploma,


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel13
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.3.1
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '13'
  - number: 7.3.1.1.b
    text: opleidingen gericht op breed maatschappelijk functioneren,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.3.1
  - number: 7.3.1.1.c
    text: opleidingen Nederlands als vreemde taal, en
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.3.1
  - number: 7.3.1.1.d
    text: opleidingen gericht op sociale redzaamheid.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.3.1
  - number: 7.3.1.2
    text: |-
      De opleidingen, bedoeld in het eerste lid, onder b, sluiten aan bij de basisberoepsopleiding, bedoeld in
      [artikel 7.2.2, eerste lid, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.3.1
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.3.1.3
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de opleidingen, bedoeld in het
      eerste lid, onder c.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.3.1
  - number: 7.3.2.1
    text: |-
      Bij ministeriële regeling kan worden bepaald welke opleidingen in elk geval behoren tot de opleidingen, bedoeld in
      [artikel 7.3.1, eerste lid, onder b, c en d][ref1], en kunnen daarvoor eindtermen worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.3.2
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.3.2.2
    text: |-
      Het bevoegd gezag stelt eindtermen vast voor de overige opleidingen educatie, met uitzondering van de opleidingen,
      bedoeld in [artikel 7.3.1, eerste lid onder a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.3.2
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.3.3.1
    text: |-
      Opleidingen voortgezet algemeen volwassenenonderwijs omvatten het onderwijs dat noodzakelijk is voor het behalen
      van het diploma voorbereidend wetenschappelijk onderwijs, het diploma hoger algemeen voortgezet onderwijs of het
      diploma middelbaar algemeen voortgezet onderwijs, dan wel voor het behalen van onderdelen van het diploma.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.3.3
  - number: 7.3.3.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden vastgesteld omtrent de voor het behalen
      van elk der in het eerste lid genoemde diploma's of onderdelen daarvan noodzakelijke vakken en andere programma-
      onderdelen, en omtrent de cursusduur.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.3.3
  - number: 7.3.3.3
    text: |-
      Wanneer de herkomst van de vavo-studenten daartoe noodzaakt, kan onderwijs worden gegeven in de taal van het land
      van oorsprong van die vavo-studenten.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.3.3
  - number: 7.3.3.4
    text: |-
      Ten behoeve van de bijzondere inrichting van het onderwijs kan Onze Minister toestaan dat wordt afgeweken van het
      bepaalde bij of krachtens dit artikel. Onze Minister besluit binnen zes maanden na ontvangst van een aanvraag.
      Indien de beschikking niet binnen zes maanden kan worden gegeven, stelt Onze Minister de aanvrager daarvan in
      kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.3.3
  - number: 7.4.1
    text: |-
      Deze paragraaf is van toepassing op beroepsopleidingen en opleidingen educatie, met uitzondering van opleidingen
      voortgezet algemeen volwassenenonderwijs en opleidingen Nederlands als vreemde taal.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.1
  - number: 7.4.2.1
    text: Het bevoegd gezag geeft de studenten en deelnemers de gelegenheid een examen af te leggen.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.2
  - number: 7.4.2.2
    text: |-
      Het examen omvat een onderzoek naar de kennis, het inzicht, de vaardigheden en, in voorkomende gevallen, de
      beroepshoudingen die de examinandus zich bij voltooiing van de opleiding moet hebben eigen gemaakt, alsmede de
      beoordeling van de uitkomsten van dat onderzoek aan de hand van de eindtermen of de kwalificatie-eisen in het
      kwalificatiedossier.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.2
  - number: 7.4.2.3
    text: |-
      Het examen bestaat uit afzonderlijke onderdelen. Het examen van een beroepsopleiding is met gunstig gevolg afgelegd
      indien alle toetsen van die opleiding met gunstig gevolg zijn afgelegd, onverminderd [artikel 7.4.3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.2
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.4.3
    text: |-
      Het examen van een beroepsopleiding is eerst dan met goed gevolg afgesloten wanneer zowel de beroepspraktijkvorming
      als het overige deel van de beroepsopleiding met goed gevolg is afgesloten.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.3
  - number: 7.4.4
    text: |-
      Bij algemene maatregel van bestuur kunnen onderdelen van een beroepsopleiding worden aangewezen waarvan de
      examinering geschiedt volgens bij of krachtens die algemene maatregel van bestuur te geven voorschriften.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.4
  - number: 7.4.5
    text: |-
      Bij ministeriële regeling worden standaarden voor de kwaliteit van de examens van de beroepsopleidingen vastgesteld
      die betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.5
  - number: 7.4.5.a
    text: |-
      de inhoud en het niveau van de examens, in relatie tot de kwalificatie-eisen in het kwalificatie-dossier, bedoeld
      in [artikel 7.2.4][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.5
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.4.5.b
    text: de procedures rond de examens en de voorwaarden waaronder examens worden afgenomen.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.5
  - number: 7.4.6.1
    text: |-
      Het bevoegd gezag kan de examinering van een beroepsopleiding overdragen aan een andere instelling of aan
      een exameninstelling als bedoeld in [artikel 1.6.1][ref1], voor zover deze het recht op examinering van die
      beroepsopleiding hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel1
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.6
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '1'
        hoofdstuk: '1'
  - number: 7.4.6.2
    text: |-
      Indien ten aanzien van een beroepsopleiding toepassing is gegeven aan [artikel 6.2.4, eerste lid][ref1], dan wel
      [6.2.5, eerste lid][ref2], is het bevoegd gezag voor die beroepsopleiding gehouden toepassing te geven aan het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel6
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.6
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '6'
        hoofdstuk: '6'
  - number: 7.4.6.3
    text: |-
      Het bevoegd gezag kan de examinering van extraneï die op grond van een samenwerkingsovereenkomst als bedoeld in
      [artikel 8.4.2][ref1] een assistentopleiding volgen, onder zijn verantwoordelijkheid laten uitvoeren door het
      bevoegd gezag van een school voor voortgezet onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel8
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.6
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '8'
        hoofdstuk: '8'
  - number: 7.4.7.1
    text: |-
      Het bevoegd gezag van een instelling of exameninstelling stelt, al dan niet in samenwerking met een of meer
      bevoegde gezagsorganen van andere instellingen, een examencommissie in ten behoeve van de organisatie en het
      afnemen van de examens voor elke door de instelling verzorgde opleiding of voor groepen van opleidingen.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.7
  - number: 7.4.7.2
    text: Het bevoegd gezag benoemt de leden van de examencommissie.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.7
  - number: 7.4.8.1
    text: Ten bewijze dat een examen met goed gevolg is afgelegd, reikt de examencommissie een diploma uit.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.8
  - number: 7.4.8.2
    text: |-
      Bij ministeriële regeling worden modellen en technische veiligheidseisen voor het diploma en de resultatenlijst van
      een beroepsopleiding vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.8
  - number: 7.4.8a.1
    text: |-
      Een student aan wie geen diploma of certificaat als bedoeld in [artikel 7.4.8][ref1] kan worden uitgereikt, maar
      die wel ten minste één waardering voor een onderdeel of voor een deel daarvan van de opleiding heeft behaald,
      ontvangt op zijn verzoek een door de examencommissie af te geven verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.8a
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.4.8a.2
    text: |-
      In afwijking van het eerste lid ontvangt de student, ook zonder een daartoe strekkend verzoek, een verklaring van
      de desbetreffende examencommissie, indien de student:
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.8a
  - number: 7.4.8a.2.a
    text: niet meer aan een instelling is ingeschreven,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.8a
  - number: 7.4.8a.2.b
    text: de leeftijd van drieëntwintig jaar nog niet heeft bereikt, en
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.8a
  - number: 7.4.8a.2.c
    text: |-
      niet in het bezit is van een diploma van een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen b tot en met e][ref1], dan wel een diploma voorbereidend wetenschappelijk
      onderwijs of hoger algemeen voortgezet onderwijs als bedoeld in [artikel 13][ref2] onderscheidenlijk
      [artikel 14 van de Wet voortgezet onderwijs BES][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel14
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.8a
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '13'
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '14'
  - number: 7.4.8a.3
    text: |-
      Op de verklaring zijn in ieder geval opgenomen de onderdelen of de delen daarvan waarvoor op de datum van
      beëindiging van de opleiding door de student een waardering is behaald en de overige bij ministeriële regeling te
      bepalen gegevens die per categorie van studenten kunnen verschillen.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.8a
  - number: 7.4.8a.4
    text: |-
      Bij ministeriële regeling wordt voor de verklaring een model vastgesteld, dat voor verschillende categorieën van
      studenten kan verschillen en kunnen voor de verklaring technische veiligheidseisen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.8a
  - number: 7.4.9.1
    text: |-
      Het bevoegd gezag stelt voor elke door de instelling verzorgde opleiding of opleiding educatie een onderwijs- en
      examenregeling vast. De onderwijs- en examenregeling wordt vastgesteld vóór 1 mei voorafgaand aan het studiejaar en
      omvat, voor zover van toepassing, ten minste:
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.9
  - number: 7.4.9.1.a
    text: de onderwijs- en vormingsdoelen, daaronder begrepen de eindtermen,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.9
  - number: 7.4.9.1.b
    text: de onderwijseenheden die deel uitmaken van de opleiding,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.9
  - number: 7.4.9.1.c
    text: |-
      de inhoud en inrichting van de opleiding, daaronder begrepen de onderscheiding van de opleiding in leerwegen als
      bedoeld in [artikel 7.2.2, tweede lid][ref1], en de inhoud en inrichting van de beroepspraktijkvorming,


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.9
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.4.9.1.d
    text: de inhoud en, in voorkomende gevallen, de indeling in onderdelen van het examen,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.9
  - number: 7.4.9.1.e
    text: de studieduur van de opleiding en van de daarvan deel uitmakende onderwijseenheden en deelkwalificaties,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.9
  - number: 7.4.9.1.f
    text: |-
      in voorkomende gevallen de volgorde waarin, de tijdvakken waarbinnen en het aantal malen per studiejaar dat
      gelegenheid wordt geboden tot het afleggen van de toetsen, het examen of onderdelen daarvan,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.9
  - number: 7.4.9.1.g
    text: de wijze waarop de toetsen en het examen of onderdelen daarvan worden afgenomen,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.9
  - number: 7.4.9.1.h
    text: |-
      de wijze waarop het bevoegd gezag zijn aandeel in het eilandelijk zorgplan, bedoeld in [artikel 3.3][ref1], vorm
      geeft,


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel3
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.9
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '3'
        hoofdstuk: '3'
  - number: 7.4.9.1.i
    text: |-
      waar nodig, dat het met goed gevolg afleggen van een of meer toetsen of examenonderdelen voorwaarde is voor het
      afleggen van andere toetsen of onderdelen,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.9
  - number: 7.4.9.1.j
    text: de wijze waarop en de termijn waarbinnen de student inzage verkrijgt in zijn beoordeelde schriftelijk werk,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.9
  - number: 7.4.9.1.k
    text: de termijn waarbinnen de uitslag van een toets, examenonderdeel en examen bekend wordt gemaakt, en
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.9
  - number: 7.4.9.1.l
    text: de van toepassing zijnde instructietaal.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.9
  - number: 7.4.9.2
    text: |-
      De examencommissie stelt, met inachtneming van de onderwijs- en examenregeling, regels vast met betrekking
      tot de goede gang van zaken tijdens het afnemen van de toetsen, het examen of de examenonderdelen. Zij kan
      aan examinatoren richtlijnen en aanwijzingen geven met betrekking tot de beoordeling en met betrekking tot de
      vaststelling van de uitslag.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.9
  - number: 7.4.10a.1
    text: |-
      Ouders dan wel studenten of deelnemers, en personeelsleden kunnen bij de klachtencommissie, bedoeld in het tweede
      lid, onderdeel a, een klacht indienen over gedragingen en beslissingen van het bevoegd gezag of het personeel,
      waaronder discriminatie, dan wel het nalaten van gedragingen en het niet nemen van beslissingen door het bevoegd
      gezag of het personeel.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.10a
  - number: 7.4.10a.2
    text: 'Het bevoegd gezag treft een regeling voor de behandeling van klachten. Deze regeling vermeldt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.10a
  - number: 7.4.10a.2.a
    text: de instelling van een klachtencommissie, die klachten behandelt,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.10a
  - number: 7.4.10a.2.b
    text: de wijze waarop de klachtencommissie haar werkzaamheden verricht,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.10a
  - number: 7.4.10a.2.c
    text: de termijn waarbinnen de klager een klacht kan indienen en
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.10a
  - number: 7.4.10a.2.d
    text: |-
      de termijn waarbinnen mededeling plaatsvindt van het oordeel, bedoeld in het zesde lid, en hoe bij noodzakelijke
      afwijking van deze termijn wordt gehandeld.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.10a
  - number: 7.4.10a.3
    text: |-
      Deze regeling strekt ter vervanging van klachtenregelingen op grond van andere voorschriften dan dit artikel en
      strekt niet ter vervanging van een andere voorziening die op grond van een wettelijke regeling, niet zijnde een
      klachtenregeling, voor de klager openstaat of heeft opengestaan.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.10a
  - number: 7.4.10a.4
    text: Deze regeling
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.10a
  - number: 7.4.10a.4.a
    text: |-
      voorziet erin dat de klachten worden behandeld door een klachtencommissie die bestaat uit ten minste drie leden,
      waaronder een voorzitter die geen deel uitmaakt van het bevoegd gezag en niet werkzaam is voor of bij het bevoegd
      gezag, en
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.10a
  - number: 7.4.10a.4.b
    text: |-
      waarborgt dat aan de behandeling van een klacht niet wordt deelgenomen door een persoon op wiens gedraging de
      klacht rechtstreeks betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.10a
  - number: 7.4.10a.5
    text: 'De klager en degene over wie is geklaagd krijgen de gelegenheid:'
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.10a
  - number: 7.4.10a.5.a
    text: hun zienswijze mondeling of schriftelijk toe te lichten en
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.10a
  - number: 7.4.10a.5.b
    text: zich bij de behandeling van de klacht te laten bijstaan.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.10a
  - number: 7.4.10a.6
    text: |-
      De klachtencommissie vormt zich een oordeel over de gegrondheid van de klacht en deelt dit oordeel, al dan niet
      vergezeld van aanbevelingen, schriftelijk mede aan de klager, degene over wie is geklaagd en het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.10a
  - number: 7.4.10a.7
    text: |-
      Het bevoegd gezag deelt de klager en de klachtencommissie, bedoeld in het tweede lid, onderdeel a, binnen 4 weken
      na ontvangst van het in het zesde lid bedoelde oordeel van de klachtencommissie schriftelijk mede of hij het
      oordeel over de gegrondheid van de klacht deelt en of hij naar aanleiding van dat oordeel maatregelen zal nemen en
      zo ja welke. Bij afwijking van de in de eerste volzin bedoelde termijn, doet het bevoegd gezag daarvan met redenen
      omkleed mededeling aan de klager en de klachtencommissie onder vermelding van de termijn waarbinnen het bevoegd
      gezag zijn standpunt bekend zal maken.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.10a
  - number: 7.4.10a.8
    text: |-
      Degene die betrokken is bij de uitvoering van dit artikel en daarbij de beschikking krijgt over gegevens waarvan
      hij het vertrouwelijke karakter kent of redelijkerwijze moet vermoeden, is verplicht tot geheimhouding daarvan,
      behoudens voor zover enig wettelijk voorschrift hem tot mededeling verplicht of uit zijn taak de noodzaak tot
      mededeling voortvloeit.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.10a
  - number: 7.4.10a.9
    text: |-
      Gegevens die betrekking hebben op een klacht worden bewaard op een plaats die uitsluitend toegankelijk is voor de
      leden van de klachtencommissie en het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.10a
  - number: 7.4.11
    text: |-
      Het bevoegd gezag maakt voor de aanvang van het studiejaar een studiegids openbaar. De studiegids maakt het
      de aanstaande student mogelijk, zich een goed beeld te vormen van de inhoud en inrichting van het onderwijs
      en de examens aan de instelling en omvat in elk geval de onderwijs- en examenregeling van de onderscheiden
      beroepsopleidingen en opleidingen educatie.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.11
  - number: 7.4.12
    text: |-
      Deze paragraaf is van toepassing op opleidingen voortgezet algemeen volwassenenonderwijs en de opleidingen
      Nederlands als vreemde taal.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.12
  - number: 7.4.13.1
    text: Aan de vavo-studenten en deelnemers wordt gelegenheid gegeven een examen af te leggen.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.13
  - number: 7.4.13.2
    text: |-
      [Artikel 7.4.7][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.13
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.4.13.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden vastgesteld omtrent de examens
      van de opleidingen voortgezet algemeen volwassenenonderwijs en Nederlands als vreemde taal, bedoeld in
      [artikel 7.3.1, eerste lid, onder c][ref1]. Bij deze algemene maatregel van bestuur kunnen tevens voorschriften
      worden gegeven omtrent de examenprogramma's en de verdeling daarvan in onderdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.13
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.4.13.4
    text: |-
      Ten behoeve van de bijzondere inrichting van het onderwijs aan een instelling kan Onze Minister toestaan dat wordt
      afgeweken van het bepaalde bij of krachtens het tweede en derde lid. Onze Minister besluit binnen zes maanden na
      ontvangst van een aanvraag. Indien de beschikking niet binnen zes maanden kan worden gegeven, stelt Onze Minister
      de aanvrager daarvan in kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden
      gezien.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.13
  - number: 7.4.13.5
    text: |-
      [Artikel 7.4.8][ref1] is van toepassing, met dien verstande dat degene die een onderdeel van het examen Nederlands
      als vreemde taal met goed gevolg heeft afgelegd een certificaat ontvangt. Bij of krachtens algemene maatregel van
      bestuur wordt bepaald onder welke voorwaarden het bezit van certificaten aanspraak geeft op een diploma.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.13
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.4.13.6
    text: |-
      [Artikel 7.4.10a][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.4.13
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.5.1.1
    text: |-
      Het bevoegd gezag van een instelling of exameninstelling stelt, al dan niet in samenwerking met een of meer andere
      bevoegde gezagsorganen van andere instellingen of exameninstellingen een commissie van beroep voor de examens in
      dan wel sluit zich bij een dergelijke commissie aan. Beslissingen van de examencommissie of van de examinatoren
      kunnen worden onderworpen aan het oordeel van een commissie van beroep voor de examens.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.5.1
  - number: 7.5.1.2
    text: |-
      De leden van de beroepscommissie maken geen deel uit van het bevoegd gezag, van de inspectie of van de
      examencommissie noch mogen zij examinator zijn.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.5.1
  - number: 7.5.1.3
    text: De commissie van beroep voor de examens oordeelt over beslissingen van de examencommissie of van de examinatoren.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.5.1
  - number: 7.5.1.4
    text: |-
      De commissie stelt een onderzoek in alvorens te beslissen. Zij stelt bij haar beslissing zo nodig vast op welke
      wijze de kandidaat alsnog in de gelegenheid zal worden gesteld het examen geheel of gedeeltelijk af te leggen.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.5.1
  - number: 7.5.1.5
    text: |-
      De commissie maakt haar beslissing bekend aan de kandidaat, aan de ouders, voogden of verzorgers van de
      kandidaat indien deze minderjarig is, aan het bevoegd gezag, aan het bedrijf dat of de organisatie die de
      beroepspraktijkvorming verzorgt, en aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.5.1
  - number: 7.5.1.6
    text: |-
      Indien de commissie het beroep gegrond acht, vernietigt zij de beslissing geheel of gedeeltelijk. De commissie is
      niet bevoegd in de plaats van de geheel of gedeeltelijk vernietigde beslissing een nieuwe beslissing te nemen. De
      examencommissie of de examinator van wie de beslissing is vernietigd, voorziet voor zover nodig opnieuw in de zaak
      met inachtneming van de uitspraak van de commissie van beroep voor de examens. De commissie kan daarvoor in haar
      uitspraak een termijn stellen.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.5.1
  - number: 7.5.2
    text: |-
      De leden van de examencommissie en de examinatoren verstrekken aan de commissie van beroep voor de examens de
      inlichtingen die zij voor de uitvoering van haar taak nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.5.2
  - number: 7.6.1.1
    text: |-
      Het bevoegd gezag is verplicht, ho-studenten die zijn ingeschreven voor een opleiding voor het beroep van leraar
      waarop de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] betrekking heeft, of die anderszins
      studeren voor een bewijs van voldoende pedagogische bekwaamheid, en die in opleiding zijn voor een functie in
      het onderwijs, gelegenheid te bieden de als onderdeel van hun opleiding vereiste ervaring in de instelling te
      verkrijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.6.1
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 7.6.1.2
    text: |-
      De in het eerste lid bedoelde verplichting omvat 5% van het in het desbetreffende studiejaar door de instelling in
      totaal te verzorgen beroepsonderwijs en educatie. Het bevoegd gezag kan een hoger percentage vaststellen mits dat
      in overeenstemming is met de goede gang van zaken binnen de instelling.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.6.1
  - number: 7.6.1.3
    text: |-
      Onze Minister kan het bevoegd gezag op grond van bijzondere omstandigheden gehele of gedeeltelijke ontheffing van
      de in het eerste lid bedoelde verplichting verlenen. De ontheffing geldt voor een studiejaar.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel7.6.1
  - number: 8.1.1.1
    text: |-
      Een ieder die gebruik wenst te maken van onderwijsvoorzieningen en examenvoorzieningen, dient zich door het bevoegd
      gezag als student of vavo-student te laten inschrijven. Een ieder die uitsluitend wenst te worden toegelaten tot
      examenvoorzieningen, dient zich door het bevoegd gezag als extraneus te laten inschrijven. Voor de inschrijving
      als extraneus is aan het bevoegd gezag een door dat gezag te bepalen vergoeding verschuldigd. Indien het een
      meerderjarige extraneus betreft die het examengeld niet zelf voldoet, wordt niet overgegaan tot inschrijving dan
      nadat de extraneus schriftelijk heeft verklaard dat hij ermee instemt dat een in die verklaring vermelde derde
      namens hem het examengeld voldoet.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.1
  - number: 8.1.1.2
    text: |-
      De inschrijving voor een opleiding of een onderdeel van een opleiding staat uitsluitend open voor degene waarvan
      de ouders, voogden of verzorgers aantonen, dan wel, indien hij meerderjarig en handelingsbekwaam is, degene die
      aantoont dat hij:
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.1
  - number: 8.1.1.2.a
    text: de Nederlandse nationaliteit bezit of op grond van een wettelijke bepaling als Nederlander wordt behandeld,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.1
  - number: 8.1.1.2.b
    text: |-
      vreemdeling is en jonger is dan 18 jaar op de eerste dag waarop de opleiding of het onderdeel van de opleiding
      begint waarvoor voor de eerste maal inschrijving wordt gewenst,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.1
  - number: 8.1.1.2.c
    text: |-
      vreemdeling is, 18 jaar of ouder is op de eerste dag waarop de opleiding of het onderdeel van de opleiding begint
      waarvoor voor de eerste maal inschrijving wordt gewenst en op die dag rechtmatig verblijft houdt in de zin van de
      [artikelen 3][ref1], [5a][ref2] of [6 van de Wet toelating en uitzetting BES][ref3], of


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028571#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0028571#Artikel6
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.1
    references:
      - id: ref1
        bwb_id: BWBR0028571
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0028571
        artikel: 5a
      - id: ref3
        bwb_id: BWBR0028571
        artikel: '6'
  - number: 8.1.1.2.d
    text: |-
      vreemdeling is, niet meer voldoet aan een van de voorwaarden genoemd onder b of c, en eerder in overeenstemming
      met een van die onderdelen is ingeschreven voor een opleiding of het onderdeel van de opleiding van een instelling,
      welke opleiding of welk onderdeel van de opleiding nog steeds wordt gevolgd en nog niet is voltooid.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.1
  - number: 8.1.1.3
    text: |-
      Indien na de inschrijving voor de opleiding of een onderdeel van de opleiding blijkt dat deze op welke grond dan
      ook niet in overeenstemming met het tweede lid heeft plaatsgevonden, wordt de onderwijsovereenkomst, bedoeld in
      [artikel 8.1.5][ref1], met onmiddellijke ingang ontbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel8
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.1
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.1.1.4
    text: |-
      De inschrijving geschiedt voor een opleiding of een onderdeel daarvan. In geval van een beroepsopleiding
      geschiedt de inschrijving voor een opleidingsdomein BES, een kwalificatiedossier, voor zover de daarin opgenomen
      kwalificaties zijn vermeld in de ministeriële regeling, bedoeld in [artikel 7.2.4, eerste lid][ref1], of een
      kwalificatie. Bij de inschrijving voor een beroepsopleiding worden alle gegevens vermeld die het bevoegd gezag
      nodig heeft om te kunnen voldoen aan de verplichting, bedoeld in [artikel 2.3.4, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel2
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.1
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '2'
        hoofdstuk: '2'
  - number: 8.1.1.5
    text: |-
      De inschrijving staat uitsluitend open voor degenen ten aanzien van wie het bevoegd gezag beslist dat zij tot de
      instelling worden toegelaten, onverminderd het tweede lid. Het bevoegd gezag kan het nemen van de beslissing over
      de toelating opdragen aan een door hem in te stellen toelatingscommissie. Het bevoegd gezag regelt de bevoegdheden
      en de werkzaamheden van de toelatingscommissie.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.1
  - number: 8.1.1.6
    text: |-
      De toelating tot beroepsopleidingen staat voor zover het de beroepsbegeleidende leerweg betreft, uitsluitend open
      voor degenen voor wie de leerplicht, bedoeld in [paragraaf 2 van de Leerplichtwet BES](onbekend), is geëindigd.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.1
  - number: 8.1.1.7
    text: |-
      In afwijking van het vijfde lid en met inachtneming van [artikel 8.2.1][ref1] en het krachtens
      [artikel 8.2.2][ref2] bepaalde doch onverminderd het tweede lid staat de inschrijving voor een assistentopleiding
      of basisberoepsopleiding als bedoeld in [artikel 7.2.2, eerste lid][ref3] open voor een ieder, met dien verstande
      dat het bevoegd gezag van een bijzondere instelling kan aangeven dat degenen die wensen te worden ingeschreven,
      geacht worden de grondslag en de doelstellingen van de instelling te respecteren. De inschrijving kan worden
      geweigerd dan wel ingetrokken indien de betrokkene de grondslag en de doelstellingen van de instelling niet
      respecteert. De inschrijving aan een bijzondere instelling kan eveneens worden geweigerd dan wel ingetrokken indien
      gegronde vrees bestaat dat de betrokkene van die inschrijving en de daaraan verbonden rechten misbruik zal maken
      door in ernstige mate afbreuk te doen aan de eigen aard van die instelling, dan wel indien is gebleken dat de
      betrokkene van die inschrijving en de daaraan verbonden rechten een dergelijk misbruik heeft gemaakt. De weigering
      dan wel intrekking van de inschrijving geschiedt schriftelijk en is met redenen omkleed. De inschrijving kan niet
      worden ingetrokken op grond van de tweede volzin indien voor betrokkene geen gelegenheid bestaat de opleiding aan
      een andere instelling te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.1
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '8'
        hoofdstuk: '8'
      - id: ref3
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 8.1.1.8
    text: De toelating tot opleidingen educatie staat uitsluitend open voor volwassenen.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.1
  - number: 8.1.1.9
    text: |-
      De inschrijving voor een opleidingsdomein BES kan uitsluitend geschieden voor een beroepsopleiding in de
      beroepsopleidende leerweg op het tweede, derde of vierde niveau, bedoeld in [artikel 7.2.2, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.1
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 8.1.1.10
    text: |-
      Bij ministeriële regeling kan een maximum worden vastgesteld voor het percentage van de studenten in het
      beroepsonderwijs dat in een jaar kan worden ingeschreven voor een opleidingsdomein BES.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.1
  - number: 8.1.2.1
    text: |-
      Het bevoegd gezag kan in afwijking van [artikel 8.1.1][ref1], in gevallen als geregeld in en met inachtneming van
      [artikel 62 van de Wet voortgezet onderwijs BES][ref2] ook tot onderwijs- en examenvoorzieningen van de instelling
      toelaten zij die niet als student, vavo-student of extraneus aan de instelling worden ingeschreven maar zijn
      ingeschreven als leerling aan een school voor voortgezet onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel62
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.2
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '62'
  - number: 8.1.2.2
    text: |-
      Bij algemene maatregel van bestuur kunnen voorschriften worden vastgesteld over de verantwoording van de bedragen
      die het bevoegd gezag met toepassing van [artikel 172, zevende lid, van de Wet voortgezet onderwijs BES][ref1]
      heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel172
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.2
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '172'
  - number: 8.1.2.3
    text: |-
      Indien het bevoegd gezag van een school voor voortgezet onderwijs ter uitvoering van
      [artikel 62, eerste en tweede lid, van de Wet voortgezet onderwijs BES][ref1] leerlingen in het kader van het
      onderwijs waarvoor zij aan die school zijn ingeschreven, ook onderwijs wil kunnen laten volgen dat een instelling
      van datzelfde bevoegd gezag verzorgt, regelt het bevoegd gezag op overeenkomstige wijze de onderwerpen van het
      derde lid, aanhef en onder a tot en met e, van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel62
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.2
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '62'
  - number: 8.1.2a.1
    text: |-
      Het bevoegd gezag van een instelling die een opleiding voortgezet algemeen volwassenenonderwijs als bedoeld
      in [artikel 7.3.1, eerste lid, onder a][ref1], verzorgt die is erkend op grond van [artikel 1.4.2][ref2],
      kan, ten aanzien van genoemde opleiding, in afwijking van [artikel 8.1.1, achtste lid][ref3],
      in gevallen als geregeld in en met inachtneming van de voorschriften gegeven bij of krachtens
      [artikel 114a van de Wet voortgezet onderwijs BES][ref4] tot onderwijs- en examenvoorzieningen van de instelling
      toelaten zij die niet als vavo-student of extraneus aan de instelling worden ingeschreven maar zijn ingeschreven
      als leerling aan een ingevolge [artikel 112 van de Wet voorgezet onderwijs BES][ref5] aangewezen school.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0028395#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0030284#Artikel114a
      [ref5]: https://wetten.overheid.nl/BWBR0030284#Artikel112
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.2a
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '1'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0028395
        artikel: '8'
        hoofdstuk: '8'
      - id: ref4
        bwb_id: BWBR0030284
        artikel: 114a
      - id: ref5
        bwb_id: BWBR0030284
        artikel: '112'
  - number: 8.1.2a.2
    text: |-
      Indien het bevoegd gezag van een ingevolge [artikel 112 van de Wet voorgezet onderwijs BES][ref1] aangewezen school
      ter uitvoering van [artikel 114a, eerste en tweede lid, van de Wet voortgezet onderwijs BES][ref2] leerlingen
      in het kader van het onderwijs waarvoor zij aan die school zijn ingeschreven, onderwijs wil kunnen laten volgen
      dat een instelling van datzelfde bevoegd gezag verzorgt, regelt het bevoegd gezag op overeenkomstige wijze de
      onderwerpen, bedoeld in artikel 114a, derde lid, aanhef en onder a tot en met d, van de Wet voortgezet onderwijs
      BES.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel112
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel114a
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.2a
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '112'
      - id: ref2
        bwb_id: BWBR0030284
        artikel: 114a
  - number: 8.1.3.1
    text: |-
      De inschrijving bij een instelling, bedoeld in [artikel 8.1.1][ref1], vindt slechts plaats nadat door de student
      of vavo-student of, indien deze minderjarig is, door de ouders, voogden of verzorgers de gegevens betreffende de
      geslachtsnaam, de voorletters, de geboortedatum, het geslacht en het persoonsgebonden nummer BES van de student
      of vavo-student zijn overgelegd. Indien door de student of vavo-student of, indien deze minderjarig is, door de
      ouders, voogden of verzorgers aannemelijk wordt gemaakt dat geen persoonsgebonden nummer BES van de student of
      vavo-student kan worden overgelegd, vindt de inschrijving plaats met inachtneming van het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel8
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.3
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.1.3.2
    text: |-
      De in het eerste lid bedoelde gegevens worden overgelegd door middel van een van overheidswege verstrekt
      document dan wel een door een andere school of een school of instelling voor ander onderwijs verstrekt bewijs van
      uitschrijving, waarin de desbetreffende gegevens zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.3
  - number: 8.1.3.3
    text: |-
      Indien door de student of vavo-student of, indien deze minderjarig is, door de ouders, voogden of verzorgers
      aannemelijk wordt gemaakt dat geen persoonsgebonden nummer BES van de student of vavo-student kan worden
      overgelegd, meldt het bevoegd gezag binnen twee weken na het besluit tot inschrijving aan Onze Minister de
      beschikbare gegevens van de student of vavo-student, bedoeld in het eerste lid, alsmede zijn adres en woonplaats.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.3
  - number: 8.1.3.4
    text: |-
      Onze Minister verstrekt binnen acht weken na ontvangst van de melding, bedoeld in het derde lid, aan het bevoegd
      gezag het persoonsgebonden nummer BES, dan wel, indien is gebleken dat hem een dergelijk nummer niet is verstrekt,
      het onderwijsnummer van de student of vavo-student. Het onderwijsnummer is een door Onze Minister uitgegeven en aan
      de student of vavo-student toegekend persoonsgebonden nummer BES.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.3
  - number: 8.1.3.5
    text: Het bevoegd gezag neemt de in het eerste en vierde lid bedoelde gegevens op in de administratie van de instelling.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.3
  - number: 8.1.3.6
    text: |-
      Indien aan een student of vavo-student een onderwijsnummer is toegekend en het bevoegd gezag daarna de beschikking
      krijgt over het administratienummer van de student of vavo-student, neemt het bevoegd gezag dit administratienummer
      terstond als persoonsgebonden nummer BES op in de administratie van de instelling in de plaats van het
      onderwijsnummer. Het bevoegd gezag meldt deze wijziging binnen twee weken aan Onze Minister onder opgave van het
      persoonsgebonden nummer BES en het onderwijsnummer van de student of vavo-student.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.3
  - number: 8.1.4.1
    text: |-
      Indien binnen redelijke afstand van de woning van de student of vavo-student niet de gelegenheid bestaat tot het
      volgen van het onderwijs aan een openbare instelling, mag aan deze student of vavo-student de toelating tot een
      bijzondere instelling niet worden geweigerd op grond van godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.4
  - number: 8.1.4.2
    text: |-
      Openbare instellingen zijn toegankelijk voor studenten en vavo-studenten zonder onderscheid naar godsdienst of
      levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.4
  - number: 8.1.5.1
    text: Aan de inschrijving ligt een overeenkomst tussen het bevoegd gezag en de student of vavo-student ten grondslag.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.5
  - number: 8.1.5.2
    text: |-
      De overeenkomst wordt, overeenkomstig een door het bevoegd gezag vastgesteld model, schriftelijk aangegaan. De
      overeenkomst wordt gesloten voor de duur van de beroepsopleiding of een deel daarvan, de opleiding educatie of het
      deel van de opleiding educatie waarop de inschrijving betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.5
  - number: 8.1.5.3
    text: |-
      De overeenkomst regelt de rechten en verplichtingen van partijen, daaronder begrepen die, welke voortvloeien uit de
      wet, en omvat ten minste bepalingen over:
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.5
  - number: 8.1.5.3.a
    text: |-
      de inhoud en inrichting van een opleiding, waaronder voor een beroepsopleiding begrepen het voltijdse of deeltijdse
      karakter, de leerweg, de examenvoorzieningen en de kwalificatie, of, bij inschrijving voor een opleidingsdomein
      BES of een kwalificatiedossier, dat opleidingsdomein BES of dat kwalificatiedossier en het beoogde niveau van de te
      behalen kwalificatie,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.5
  - number: 8.1.5.3.b
    text: de tijdvakken waarbinnen en, voor zover mogelijk, de locaties waar het onderwijs verzorgd wordt,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.5
  - number: 8.1.5.3.c
    text: de wijze waarop partijen uit de overeenkomst voortkomende prestaties gestalte zullen geven, en
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.5
  - number: 8.1.5.3.d
    text: de rechten en plichten ten aanzien van zwangerschap en bevalling.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.5
  - number: 8.1.5.4
    text: |-
      Indien tot een bijzondere instelling andere studenten en vavo-studenten worden toegelaten dan voor wie de
      instelling in verband met de richting in stand wordt gehouden, kunnen deze studenten en vavo-studenten niet worden
      verplicht tot het volgen van onderwijs dat in verband met die richting door de instelling wordt verzorgd.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.5
  - number: 8.1.5.5
    text: |-
      Definitieve verwijdering van een student of vavo-student waarop de [Leerplichtwet BES][ref1] van toepassing is,
      vindt niet plaats dan nadat het bevoegd gezag ervoor heeft zorggedragen dat een andere instelling, bereid is de
      student of vavo-student toe te laten.


      [ref1]: https://wetten.overheid.nl/BWBR0030281
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.5
    references:
      - id: ref1
        bwb_id: BWBR0030281
  - number: 8.1.6
    text: De inschrijving wordt niet afhankelijk gesteld van geldelijke bijdrage.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.6
  - number: 8.1.6a.1
    text: |-
      Het bevoegd gezag treft voorzieningen voor de financiële ondersteuning van een bij die instelling ingeschreven
      student.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.6a
  - number: 8.1.6a.2
    text: 'Ondersteuning wordt verstrekt aan de volgende categorieën van studenten:'
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.6a
  - number: 8.1.6a.2.a
    text: |-
      studenten die deelnemen aan de vertegenwoordiging, bedoeld in [artikel 5.1][ref1], aan een andere door het bevoegd
      gezag ingestelde medezeggenschapsstructuur of lid zijn van het bestuur van een studentenorganisatie van enige
      omvang met volledige rechtsbevoegdheid,


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel5
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.6a
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '5'
        hoofdstuk: '5'
  - number: 8.1.6a.2.b
    text: |-
      studenten die activiteiten verrichten op bestuurlijk of maatschappelijk gebied die naar het oordeel van het bevoegd
      gezag mede in het belang zijn van de instelling of van het onderwijs dat de student volgt,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.6a
  - number: 8.1.6a.2.c
    text: |-
      studenten, of diens wettelijk vertegenwoordiger, die aantoonbaar onvoldoende financiële middelen hebben voor de
      aanschaf van onderwijsbenodigdheden waarover de student geacht wordt zelf te beschikken, en
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.6a
  - number: 8.1.6a.2.d
    text: studenten die in verband met de aanwezigheid van een bijzondere omstandigheid studievertraging hebben opgelopen.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.6a
  - number: 8.1.6a.3
    text: 'De bijzondere omstandigheden, bedoeld in onderdeel c zijn:'
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.6a
  - number: 8.1.6a.3.a
    text: ziekte,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.6a
  - number: 8.1.6a.3.b
    text: zwangerschap en bevalling,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.6a
  - number: 8.1.6a.3.c
    text: een handicap of chronische ziekte,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.6a
  - number: 8.1.6a.3.d
    text: bijzondere familieomstandigheden,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.6a
  - number: 8.1.6a.3.e
    text: een onvoldoende studeerbare opleiding,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.6a
  - number: 8.1.6a.3.f
    text: overige door het bevoegd gezag vastgestelde bijzondere omstandigheden.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.6a
  - number: 8.1.6b.1
    text: |-
      De ondersteuning bestaat uit financiële ondersteuning indien ondersteuning als bedoeld in
      [artikel 8.1.6a, tweede lid, onderdelen a, b of d,][ref1] wordt verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel8
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.6b
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.1.6b.2
    text: |-
      Een student komt uitsluitend in aanmerking voor ondersteuning als bedoeld in
      [artikel 8.1.6a, tweede lid, onderdeel c][ref1], tot en met de maand waarin hij de leeftijd van 18 jaar heeft
      bereikt en indien de student een beroepsopleidende leerweg volgt.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel8
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.6b
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.1.6b.3
    text: |-
      Een student komt uitsluitend in aanmerking voor ondersteuning bij een bijzondere omstandigheid als bedoeld
      in[ artikel 8.1.6a, derde lid, onderdelen a tot en met e][ref1], indien de student een beroepsopleidende leerweg
      volgt en geen aanspraak heeft op studiefinanciering BES in de vorm van prestatiebeurs of gift op grond van de
      [Wet studiefinanciering BES][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0028393
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.6b
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0028393
  - number: 8.1.6c
    text: |-
      Het bevoegd gezag kan indien sprake is van een onbillijkheid van overwegende aard ondersteuning verstrekken voor
      andere bijzondere omstandigheden dan genoemd in [artikel 8.1.6a, derde lid, onderdelen a tot en met f][ref1], of de
      voorwaarden bedoeld in [artikel 8.1.6b, tweede en derde lid][ref2], buiten toepassing laten.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel8
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.6c
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.1.6d.1
    text: |-
      Indien op grond van de [artikelen 8.1.6a][ref1] of [8.1.6c][ref2] financiële ondersteuning wordt toegekend aan
      een student die een beroepsopleidende leerweg volgt, is het bedrag daarvan niet hoger dan de som van de bedragen,
      genoemd in de kolommen III en IV voor het beroepsonderwijs op het eigen openbaar lichaam of ander openbaar lichaam,
      bedoeld in [artikel 2.2, eerste lid, van de Wet studiefinanciering BES][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0028393#Artikel2
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.6d
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '8'
        hoofdstuk: '8'
      - id: ref3
        bwb_id: BWBR0028393
        artikel: '2'
  - number: 8.1.6d.2
    text: |-
      Onverminderd het eerste lid, kan bij algemene maatregel van bestuur worden bepaald dat een lid van de
      vertegenwoordiging als bedoeld in [artikel 8.1.6a, tweede lid, onderdeel a][ref1], een financiële ondersteuning
      ontvangt ter hoogte van een bij algemene maatregel van bestuur te bepalen minimumbedrag. De voordracht voor deze
      algemene maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide Kamers der
      Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel8
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.6d
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.1.6e
    text: |-
      In aanvulling op de voorziening, bedoeld in de [artikelen 8.1.6a][ref1] of [8.1.6c][ref2], kan een voorziening
      voor financiële ondersteuning worden getroffen, die hoger is dan de som van de bedragen, genoemd in de kolommen
      III en IV voor het beroepsonderwijs op het eigen openbaar lichaam of ander openbaar lichaam, bedoeld in
      [artikel 2.2, eerste lid, van de Wet studiefinanciering BES][ref3]. Deze aanvulling wordt verstrekt onder de
      benaming: voorziening voor aanvullende ondersteuning.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0028393#Artikel2
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.6e
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '8'
        hoofdstuk: '8'
      - id: ref3
        bwb_id: BWBR0028393
        artikel: '2'
  - number: 8.1.6f.1
    text: |-
      Het bevoegd gezag stelt regels van procedurele aard vast met betrekking tot de toepassing van de
      [artikelen 8.1.6a][ref1] of [8.1.6c][ref2], waartoe in ieder geval behoren regels over de aanvraag, de aanvang en
      de duur van de ondersteuning en indien het financiële ondersteuning betreft tevens de hoogte van het bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel8
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.6f
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.1.6f.2
    text: |-
      Het bevoegd gezag kan aan de toekenning van ondersteuning de verplichting verbinden dat de student feitelijk
      studerend is.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.6f
  - number: 8.1.6g.1
    text: |-
      Het bevoegd gezag stelt de student schriftelijk of elektronisch op de hoogte van de ondersteuning, bedoeld in
      de [artikelen 8.1.6a][ref1] of [8.1.6c][ref2], en vermeldt daarbij afzonderlijk het bedrag van de aanvullende
      voorziening indien de ondersteuning in de vorm van een financiële tegemoetkoming wordt verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel8
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.6g
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.1.6g.2
    text: |-
      Voorts legt het bevoegd gezag de aan de student verstrekte ondersteuning vast in de administratie van de
      instelling, onder vermelding van het persoonsgebonden nummer van de student en indien het financiële ondersteuning
      betreft de hoogte van het toegekende bedrag.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.6g
  - number: 8.1.6h
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld over vergoeding door het bevoegd gezag van
      kosten die studenten hebben gemaakt voor de aanschaf van onderwijsbenodigdheden die door het bevoegd gezag zijn
      voorgeschreven, maar waarvan gezien het onderwijsprogramma door de studenten geen gebruik is gemaakt. De voordracht
      voor deze algemene maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide Kamers
      der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.6h
  - number: 8.1.7.1
    text: |-
      Het bevoegd gezag stelt van iedere aan de instelling ingeschreven student die valt onder de werking van de
      [Wet studiefinanciering BES][ref1] vast, of deze student gedurende een aaneengesloten periode van ten minste 5
      weken zonder geldige reden niet aan het onderwijs heeft deelgenomen. In afwijking van de vorige volzin kan Onze
      Minister bepalen dat voor soorten van onderwijs als bedoeld in deze wet, de in die volzin bedoelde vaststelling
      wordt gedaan indien een ingeschreven student in een of meer vakken niet aan het onderwijs heeft deelgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028393
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.7
    references:
      - id: ref1
        bwb_id: BWBR0028393
  - number: 8.1.7.2
    text: |-
      Het bevoegd gezag meldt uiterlijk op de derde werkdag na afloop van een periode van afwezigheid van 5 weken aan de
      student dat daarvan in de administratie van de instelling aantekening is gemaakt en verzoekt de student om opgaaf
      van de reden van de afwezigheid.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.7
  - number: 8.1.7.3
    text: 'Uiterlijk op de vijfde werkdag na de periode van 8 weken stelt het bevoegd gezag vast:'
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.7
  - number: 8.1.7.3.a
    text: |-
      of de reden die de student binnen 8 weken na de aanvang van de periode van 5 weken gaf voor zijn afwezigheid, een
      geldige is, of
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.7
  - number: 8.1.7.3.b
    text: |-
      dat de student binnen 8 weken na de aanvang van de periode van 5 weken geen reden heeft opgegeven voor zijn
      afwezigheid.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.7
  - number: 8.1.7.4
    text: |-
      Het bevoegd gezag stelt tevens uiterlijk op de vijfde werkdag na afloop van de periode van 8 weken vast of de
      student voor het einde van die periode weer aan het onderwijs is gaan deelnemen.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.7
  - number: 8.1.7.5
    text: |-
      Het bevoegd gezag meldt uiterlijk de vijfde werkdag na afloop van een periode van 8 weken aan Onze Minister de
      student die gedurende een aaneengesloten periode van ten minste 5 weken zonder opgave van geldige reden niet aan
      het onderwijs heeft deelgenomen. Tevens meldt het indien die student voor het einde van de periode van 8 weken weer
      aan het onderwijs is gaan deelnemen de datum ervan.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.7
  - number: 8.1.7.6
    text: |-
      De periode van 5 weken en de periode van 8 weken worden verlengd met de weken waarin vanwege vakantie geen
      onderwijs werd verzorgd. Zij wordt geacht niet te zijn onderbroken door deze vakantieweken.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.7
  - number: 8.1.7.7
    text: |-
      Het bevoegd gezag stuurt gelijktijdig met de mededelingen, bedoeld in het vijfde lid, een afschrift van de gegevens
      die over de betrokken student aan Onze Minister zijn verstrekt aan deze betrokkene. Het bevoegd gezag geeft daarbij
      tevens aan dat afwezigheid als bedoeld in het eerste lid, gevolgen heeft voor de studiefinanciering van betrokkene
      op grond van de [Wet studiefinanciering BES][ref1], alsmede welke beroepsgang voor betrokkene tegen de mededeling,
      bedoeld in het vijfde lid, open staat.


      [ref1]: https://wetten.overheid.nl/BWBR0028393
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.7
    references:
      - id: ref1
        bwb_id: BWBR0028393
  - number: 8.1.7.8
    text: |-
      Indien het bevoegd gezag aan Onze Minister de in het vijfde lid bedoelde mededeling heeft gedaan, kan de student
      binnen 6 weken na ontvangst van de gegevens, bedoeld in het zevende lid, bij het bevoegd gezag schriftelijk
      bedenkingen uiten tegen die mededeling.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.7
  - number: 8.1.7.9
    text: 'Onder afwezigheid met een geldige reden als bedoeld in het eerste lid wordt verstaan afwezigheid wegens:'
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.7
  - number: 8.1.7.9.a
    text: |-
      ziekte van de student, welke ziekte uitsluitend kan worden aangetoond door middel van een gedagtekende verklaring
      van een arts,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.7
  - number: 8.1.7.9.b
    text: |-
      zwangerschap of bevalling van de student, welke uitsluitend kan worden aangetoond door middel van een schriftelijke
      verklaring van een arts of verloskundige, gedurende een periode van 16 weken die, indien de student dat wenst,
      6 weken voor de dag na de vermoedelijke datum van bevalling ingaat of gedurende een periode van 20 weken die,
      indien de student dat wenst, 10 weken voor de dag na de vermoedelijke datum van bevalling ingaat indien het een
      zwangerschap van meer dan één kind betreft, of
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.7
  - number: 8.1.7.9.c
    text: bijzondere familieomstandigheden.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.7
  - number: 8.1.7.10
    text: |-
      Het bevoegd gezag kan bepalen dat de periode, bedoeld in het negende lid, onderdeel b, wordt verlengd als dit naar
      zijn oordeel passend is.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.7
  - number: 8.1.7.11
    text: |-
      Onder «student» als bedoeld in het vijfde en zevende lid wordt verstaan de student die een assistentopleiding of
      een basisberoepsopleiding volgt als bedoeld in [artikel 7.2.2, eerste lid, onderdelen a of b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.7
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 8.1.8.1
    text: |-
      Het bevoegd gezag doet onverwijld opgave aan het bestuurscollege van het openbaar lichaam waar de betrokkene woon-
      of verblijfplaats heeft van de gegevens van degene:
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.8
  - number: 8.1.8.1.a
    text: |-
      op wie de [Leerplichtwet BES][ref1] niet meer van toepassing is en die de leeftijd van 25 jaren nog niet heeft
      bereikt,


      [ref1]: https://wetten.overheid.nl/BWBR0030281
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.8
    references:
      - id: ref1
        bwb_id: BWBR0030281
  - number: 8.1.8.1.b
    text: |-
      die niet in het bezit is van een diploma van een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen b tot en met e][ref1], dan wel een diploma voorbereidend wetenschappelijk
      onderwijs of hoger algemeen voortgezet onderwijs als bedoeld in [artikel 13][ref2] onderscheidenlijk
      [14 van de Wet voortgezet onderwijs BES][ref3], en


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel14
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.8
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '13'
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '14'
  - number: 8.1.8.1.c
    text: 'die:'
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.8
  - number: 8.1.8.1.c.1
    text: |-
      het onderwijs aan de instelling gedurende een aaneengesloten periode van ten minste een maand of een door het
      bevoegd gezag te bepalen kortere periode zonder geldige reden, waaronder in ieder geval de redenen, bedoeld in
      artikel 8.1.7, negende lid, worden verstaan, niet meer volgt, of
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.8
  - number: 8.1.8.1.c.2
    text: bij de instelling wordt in- of uitgeschreven of van de instelling wordt verwijderd.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.8
  - number: 8.1.8.2
    text: Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.8
  - number: 8.1.8.3
    text: |-
      Bij de verwerking van gegevens, bedoeld in dit artikel, wordt het persoonsgebonden nummer BES van de betrokkene
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.8
  - number: 8.1.8.4
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de wijze van de verstrekking van
      gegevens op grond van het eerste lid en wordt een nadere specificatie gegeven van de gegevens die op grond van het
      eerste lid worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.8
  - number: 8.1.8.5
    text: |-
      De gegevens die worden verstrekt op grond van het eerste lid kunnen persoonsgegevens als bedoeld in
      [artikel 16 van de Wet bescherming persoonsgegevens BES][ref1] omvatten, met uitzondering van gegevens over ras,
      politieke gezindheid, seksueel leven of het lidmaatschap van een vakvereniging, voor zover deze persoonsgegevens
      noodzakelijk zijn met het oog op de informatieverstrekking over de achtergronden van het verzuim.


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel16
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.1.8
    references:
      - id: ref1
        bwb_id: BWBR0028067
        artikel: '16'
  - number: 8.2.1.1
    text: |-
      Vereiste voor inschrijving voor een vakopleiding en een middenkaderopleiding als bedoeld in
      [artikel 7.2.2, eerste lid][ref1], is met inachtneming van het bepaalde krachtens [artikel 8.2.2][ref2] het bezit
      van:


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel8
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.2.1
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.2.1.1.a
    text: |-
      een diploma lager beroepsonderwijs, een diploma voorbereidend beroepsonderwijs, of een diploma voorbereidend
      middelbaar beroepsonderwijs voor zover het betreft de kaderberoepsgerichte leerweg,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.2.1
  - number: 8.2.1.1.b
    text: |-
      een diploma middelbaar algemeen voortgezet onderwijs, of een diploma voorbereidend middelbaar beroepsonderwijs voor
      zover het betreft de theoretische leerweg,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.2.1
  - number: 8.2.1.1.c
    text: |-
      een diploma mavo-vbo, of een diploma voorbereidend middelbaar beroepsonderwijs voor zover het betreft de gemengde
      leerweg,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.2.1
  - number: 8.2.1.1.d
    text: |-
      een bewijs dat de eerste drie leerjaren van een school voor hoger algemeen voortgezet onderwijs of van een school
      voor voorbereidend wetenschappelijk onderwijs met gunstig gevolg zijn doorlopen, of
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.2.1
  - number: 8.2.1.1.e
    text: een ander bij ministeriële regeling aangewezen diploma of bewijsstuk.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.2.1
  - number: 8.2.1.2
    text: |-
      Vereiste voor inschrijving voor een specialistenopleiding als bedoeld in [artikel 7.2.2, eerste lid][ref1], is het
      bezit van een diploma vakopleiding voor eenzelfde beroep of beroepencategorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.2.1
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 8.2.1.3
    text: |-
      Indien een assistentopleiding en een basisberoepsopleiding voorbereiden op eenzelfde beroep of beroepencategorie,
      is, met inachtneming van het bepaalde krachtens [artikel 8.2.2][ref1], voor de inschrijving voor de
      basisberoepsopleiding vereist het bezit van:


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel8
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.2.1
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.2.1.3.a
    text: |-
      een diploma lager beroepsonderwijs, een diploma voorbereidend beroepsonderwijs, of een diploma voorbereidend
      middelbaar beroepsonderwijs voor zover het betreft de basisberoepsgerichte leerweg of de kaderberoepsgerichte
      leerweg,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.2.1
  - number: 8.2.1.3.b
    text: |-
      een diploma middelbaar algemeen voortgezet onderwijs, of een diploma voorbereidend middelbaar beroepsonderwijs voor
      zover het betreft de theoretische leerweg,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.2.1
  - number: 8.2.1.3.c
    text: |-
      een diploma mavo-vbo, of een diploma voorbereidend middelbaar beroepsonderwijs voor zover het betreft de gemengde
      leerweg,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.2.1
  - number: 8.2.1.3.d
    text: |-
      een bewijs dat de eerste drie leerjaren van een school voor hoger algemeen voortgezet onderwijs of van een school
      voor voorbereidend wetenschappelijk onderwijs met gunstig gevolg zijn doorlopen, of
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.2.1
  - number: 8.2.1.3.e
    text: een ander bij ministeriële regeling aangewezen diploma of bewijsstuk.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.2.1
  - number: 8.2.1.4
    text: |-
      Voor de inschrijving voor een assistentopleiding als bedoeld in [artikel 7.2.2, eerste lid][ref1], en voor de
      inschrijving voor een opleiding educatie, gelden geen vooropleidingseisen.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.2.1
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 8.2.1.5
    text: |-
      Het bevoegd gezag kan in bijzondere gevallen afwijken van het eerste tot en met derde lid, indien de student naar
      verwachting het onderwijs in de desbetreffende beroepsopleiding met voldoende resultaat zal kunnen volgen.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.2.1
  - number: 8.2.2.1
    text: 'In dit artikel en de daarop gebaseerde regelgeving wordt onder «diploma» verstaan:'
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.2.2
  - number: 8.2.2.1.a
    text: het diploma middelbaar algemeen voortgezet onderwijs,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.2.2
  - number: 8.2.2.1.b
    text: het diploma voorbereidend beroepsonderwijs,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.2.2
  - number: 8.2.2.1.c
    text: het diploma middelbaar algemeen voortgezet onderwijs – voorbereidend beroepsonderwijs, of
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.2.2
  - number: 8.2.2.1.d
    text: de diploma's voorbereidend middelbaar beroepsonderwijs.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.2.2
  - number: 8.2.2.2
    text: |-
      Onverminderd [artikel 8.2.1][ref1] kan een instelling voor de toelating tot een beroepsopleiding als bedoeld
      in [artikel 7.2.2, eerste lid, onderdelen b tot en met e][ref2], nadere vooropleidingseisen stellen, inhoudende
      dat het diploma van de student voldoet aan de profielen, bedoeld in de [artikelen 16][ref3], [18][ref4] en
      [29 van de Wet voortgezet onderwijs BES][ref5], alsmede dat vakken en andere programmaonderdelen die deel hebben
      uitgemaakt van het examen ter verkrijging van een diploma.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0030284#Artikel18
      [ref5]: https://wetten.overheid.nl/BWBR0030284#Artikel29
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.2.2
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '16'
      - id: ref4
        bwb_id: BWBR0030284
        artikel: '18'
      - id: ref5
        bwb_id: BWBR0030284
        artikel: '29'
  - number: 8.2.2.3
    text: |-
      Indien een instelling gebruikt maakt van de bevoegdheid bedoeld in het tweede lid kunnen uitsluitend nadere
      vooropleidingseisen worden gesteld die bij ministeriële regeling kunnen worden aangewezen, waarbij onderscheid kan
      worden gemaakt naar categorieën van studenten, dan wel kan worden bepaald dat de nadere vooropleidingseisen niet
      van toepassing zijn op categorieën van studenten.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.2.2
  - number: 8.2.2.4
    text: |-
      Het aanwijzen van de in het derde lid bedoelde nadere vooropleidingseisen vindt plaats op voorstel van organisaties
      in het voortgezet onderwijs, vertegenwoordigers van de instellingen en de raad.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.2.2
  - number: 8.4.1.1
    text: |-
      Leer-werktrajecten als bedoeld in [artikel 19 van de Wet voortgezet onderwijs BES][ref1] worden verzorgd op
      grondslag van een samenwerkingsovereenkomst tussen het bevoegd gezag van een instelling en het bevoegd gezag van
      een school voor voortgezet onderwijs als bedoeld in de [Wet voortgezet onderwijs BES][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0030284
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.4.1
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0030284
  - number: 8.4.1.2
    text: |-
      Een samenwerkingsovereenkomst als bedoeld in het eerste lid, voldoet aan
      [artikel 25 van de Wet voortgezet onderwijs BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel25
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.4.1
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '25'
  - number: 8.4.2.1
    text: |-
      De assistentopleiding, bedoeld in [artikel 26 van de Wet voortgezet onderwijs BES][ref1], wordt verzorgd op
      grondslag van een samenwerkingsovereenkomst tussen het bevoegd gezag van een instelling en het bevoegd gezag van
      een school voor voortgezet onderwijs als bedoeld in de [Wet voortgezet onderwijs BES][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0030284
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.4.2
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0030284
  - number: 8.4.2.2
    text: |-
      Een samenwerkingsovereenkomst als bedoeld in het eerste lid, voldoet aan
      [artikel 27 van de Wet voortgezet onderwijs BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel27
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.4.2
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '27'
  - number: 8.4.3.1
    text: |-
      De geïntegreerde route vmbo-basisberoepsopleiding, bedoeld in
      [artikel 27l van de Wet voortgezet onderwijs BES][ref1], wordt verzorgd op grond van een samenwerkingsovereenkomst
      tussen het bevoegd gezag van een instelling en het bevoegd gezag van een school voor voorbereidend beroepsonderwijs
      als bedoeld in [artikel 17 van de Wet voortgezet onderwijs BES][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel27l
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel17
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.4.3
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: 27l
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '17'
  - number: 8.4.3.2
    text: |-
      Een samenwerkingsovereenkomst als bedoeld in het eerste lid, voldoet aan [artikel 27l][ref1] in samenhang met
      [artikel 27b van de Wet voortgezet onderwijs BES][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel27l
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel27b
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.4.3
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: 27l
      - id: ref2
        bwb_id: BWBR0030284
        artikel: 27b
  - number: 8.4.3.3
    text: |-
      [Titel 8.4a][ref1] van overeenkomstige toepassing op een geïntegreerde route vmbo-basisberoepsopleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.4.3
    references:
      - id: ref1
        bwb_id: BWBR0028395
        hoofdstuk: '8'
  - number: 8.4a.1
    text: |-
      In deze titel wordt verstaan onder: - *school:* school voor middelbaar algemeen voortgezet onderwijs als bedoeld in
      [artikel 15 van de Wet voortgezet onderwijs BES][ref1] of school voor voorbereidend beroepsonderwijs als bedoeld in
      [artikel 17 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel17
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.4a.1
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '17'
  - number: 8.4a.2.1
    text: |-
      Het bevoegd gezag van een instelling kan een beroepsopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdeel b, c en d][ref1], aanbieden in een doorlopende leerroute vmbo-mbo.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.4a.2
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 8.4a.2.2
    text: |-
      Een doorlopende leerroute vmbo-mbo is een onderwijsprogramma vanaf het derde leerjaar aan een
      school, dat opleidt tot zowel een diploma voorbereidend middelbaar beroepsonderwijs als bedoeld in
      [artikel 72, derde lid, van de Wet voortgezet onderwijs BES][ref1] als het diploma van een basisberoepsopleiding,
      vakopleiding of middenkaderopleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel72
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.4a.2
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '72'
  - number: 8.4a.2.3
    text: 'In een doorlopende leerroute vmbo-mbo worden tot één onderwijsprogramma geïntegreerd:'
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.4a.2
  - number: 8.4a.2.3.a
    text: |-
      de basisberoepsgerichte leerweg en een basisberoepsopleiding in een aanverwant opleidingsdomein BES of een
      aanverwante kwalificatie;
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.4a.2
  - number: 8.4a.2.3.b
    text: |-
      de kaderberoepsgerichte leerweg en een vakopleiding in een aanverwant opleidingsdomein BES of een aanverwante
      kwalificatie;
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.4a.2
  - number: 8.4a.2.3.c
    text: |-
      de kaderberoepsgerichte, gemengde of theoretische leerweg en een middenkaderopleiding in een aanverwant
      opleidingsdomein BES of een aanverwante kwalificatie.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.4a.2
  - number: 8.4a.3.1
    text: |-
      Een doorlopende leerroute vmbo-mbo wordt verzorgd door het bevoegd gezag van een instelling en het bevoegd gezag
      van een school gezamenlijk op grond van een samenwerkingsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.4a.3
  - number: 8.4a.3.2
    text: |-
      Een samenwerkingsovereenkomst als bedoeld in het eerste lid voldoet aan
      [artikel 27b, tweede lid, van de Wet voortgezet onderwijs BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel27b
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.4a.3
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: 27b
  - number: 8.4a.3.3
    text: |-
      Indien het bevoegd gezag zowel de instelling als de school in stand houdt,
      regelt het bevoegd gezag op overeenkomstige wijze de onderwerpen, genoemd in
      [artikel 27b, tweede lid, van de Wet voortgezet onderwijs BES][ref1], met uitzondering van de onderdelen h en i van
      dat lid.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel27b
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.4a.3
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: 27b
  - number: 8.4a.4
    text: |-
      Het bevoegd gezag van een instelling en het bevoegd gezag van een school melden gezamenlijk aan Onze Minister dat
      zij een doorlopende leerroute vmbo-mbo aanbieden.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.4a.4
  - number: 8.4a.5.1
    text: |-
      Aan een leerling van een school kunnen delen van het onderwijsprogramma van de doorlopende leerroute vmbo-mbo en
      examens worden aangeboden die behoren tot de beroepsopleiding die deel uitmaakt van die doorlopende leerroute,
      zonder inschrijving als bedoeld in [artikel 8.1.1, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel8
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.4a.5
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.4a.5.2
    text: |-
      Een student in de doorlopende leerroute vmbo-mbo kan in de gelegenheid worden gesteld om delen van het
      onderwijsprogramma te volgen en examens af te leggen die behoren tot het voortgezet onderwijs dat deel uitmaakt van
      die doorlopende leerroute.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.4a.5
  - number: 8.4a.6
    text: |-
      Voordat een leerling van een school in een doorlopende leerroute voor de eerste keer een deel van het
      onderwijsprogramma volgt dat behoort tot de beroepsopleiding die deel uitmaakt van die doorlopende
      leerroute, sluiten het bevoegd gezag van de instelling en de leerling een overeenkomst waarop
      [artikel 8.1.5, tweede en derde lid][ref1], van overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel8
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.4a.6
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.4a.7
    text: |-
      De leerling van een school die een doorlopende leerroute vmbo-mbo volgt wordt met ingang van het derde studiejaar
      van die doorlopende leerroute vmbo-mbo ingeschreven als student aan de instelling die het beroepsonderwijs binnen
      de doorlopende leerroute vmbo-mbo verzorgt. De overeenkomst, bedoeld in [artikel 8.4a.6][ref1], wordt gezien als
      overeenkomst, bedoeld in [artikel 8.1.5][ref2]. In afwijking van [artikel 8.1.3, eerste lid][ref3], eerste volzin,
      overlegt de school de gegevens, bedoeld in die volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0028395#Artikel8
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.4a.7
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '8'
        hoofdstuk: '8'
      - id: ref3
        bwb_id: BWBR0028395
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.4a.8.1
    text: 'Het bevoegd gezag van de instelling draagt de gehele studieduur van de doorlopende leerroute vmbo-mbo zorg voor:'
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.4a.8
  - number: 8.4a.8.1.a
    text: |-
      de uitvoering van delen van het onderwijsprogramma die behoren tot de beroepsopleiding die deel uitmaakt van de
      doorlopende leerroute vmbo-mbo, met inbegrip van de beroepspraktijkvorming;
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.4a.8
  - number: 8.4a.8.1.b
    text: |-
      de examinering en diplomering betreffende de beroepsopleiding die deel uitmaakt van de doorlopende leerroute vmbo-
      mbo.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.4a.8
  - number: 8.4a.8.2
    text: |-
      Ten aanzien van de onderdelen van een doorlopende leerroute vmbo-mbo, bedoeld in het eerste lid, die in het
      eerste of tweede studiejaar van die route plaatsvinden, is van overeenkomstige toepassing hetgeen is bepaald
      bij of krachtens de [artikelen 2.3.3][ref1] en [2.3.4, eerste, vierde en achtste tot en met twaalfde lid][ref2],
      alsmede het bepaalde bij of krachtens de [artikelen 10][ref3], [12][ref4], [14][ref5], [15][ref6] en
      [25 van de Wet register onderwijsdeelnemers][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0042012#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0042012#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0042012#Artikel14
      [ref6]: https://wetten.overheid.nl/BWBR0042012#Artikel15
      [ref7]: https://wetten.overheid.nl/BWBR0042012#Artikel25
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.4a.8
    references:
