  - number: 1.4.2.5
    text: Onze Minister beslist binnen 3 maanden na de aanvraag.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel1.4.2
  - number: 1.4.2.6
    text: Het bevoegd gezag verstrekt Onze Minister op diens verzoek de nodige inlichtingen omtrent de instelling.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel1.4.2
  - number: 1.4.3.1
    text: |-
      Het bevoegd gezag kan een beroepsopleiding ten aanzien waarvan een erkenning is verkregen op grond van
      [artikel 1.4.1][ref1] een doorlopende leerroute vmbo-mbo of de geïntegreerde route vmbo-basisberoepsopleiding als
      bedoeld in [artikel 27l van de Wet voortgezet onderwijs BES][ref2] aanbieden.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel27l
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel1.4.3
    references:
