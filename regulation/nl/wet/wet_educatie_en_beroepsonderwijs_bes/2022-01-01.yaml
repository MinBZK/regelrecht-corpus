  - number: 11.6d
    text: |-
      De artikelen die niet bij Besluit van 3 februari 2011, houdende vaststelling van het tijdstip van inwerkingtreding
      van een aantal onderdelen van de Aanpassingswet openbare lichamen Bonaire, Sint Eustatius en Saba (Stb. 2011, 34)
      in werking zijn getreden, treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan, verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel11.6d
  - number: 11.6f
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van de Wet van 29 november 2017 tot wijziging
      van diverse onderwijswetten in verband met het pseudonimiseren van het persoonsgebonden nummer van een
      onderwijsdeelnemer ten behoeve van het bieden van voorzieningen in het kader van het onderwijs en de begeleiding
      van onderwijsdeelnemers (Stb. 508) aan de Staten-Generaal een verslag over de doeltreffendheid en effecten van
      [artikel 2.3.4, negende tot en met twaalfde lid][ref1], in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel2
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel11.6f
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '2'
        hoofdstuk: '2'
  - number: 11.6g
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van de Wet van 28 oktober 2020 tot wijziging van onder
      meer de Wet op het voortgezet onderwijs en de Wet voortgezet onderwijs BES in verband met vereenvoudiging van
      de grondslagen van de bekostiging voor personeels- en exploitatiekosten van de scholen voor voortgezet onderwijs
      (vereenvoudiging grondslagen bekostiging vo-scholen; Stb. 2020, 437), en vervolgens telkens na vier jaar, aan de
      Staten-Generaal verslag over de doeltreffendheid en de effecten van de wijzigingen in [hoofdstuk 2, titel 2][ref1]
      de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel11.6g
    references:
      - id: ref1
        bwb_id: BWBR0028395
        hoofdstuk: '2'
  - number: '11.7'
    text: 'Deze wet wordt aangehaald als: Wet educatie en beroepsonderwijs BES.'
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel11.7
