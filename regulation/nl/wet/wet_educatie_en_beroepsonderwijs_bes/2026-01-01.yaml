  - number: '11.5'
    text: |-
      Een beslissing als bedoeld in [artikel 7.6.1, derde lid][ref1], van een bevoegd gezag van een openbare school geldt
      als een beschikking als bedoeld in [artikel 3 van de Wet administratieve rechtspraak BES][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7.6.1
      [ref2]: https://wetten.overheid.nl/BWBR0028455#Artikel3
