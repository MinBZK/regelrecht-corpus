  - number: 8.1.6c
    text: |-
      Het bevoegd gezag kan indien sprake is van een onbillijkheid van overwegende aard ondersteuning verstrekken voor
      andere bijzondere omstandigheden dan genoemd in [artikel 8.1.6a, derde lid, onderdelen a tot en met f][ref1], of de
      voorwaarden bedoeld in [artikel 8.1.6b, tweede en derde lid][ref2], buiten toepassing laten.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel8.1.6a
