  - number: '3.7'
    text: |-
      1 Onze Minister is bevoegd tot het treffen van noodzakelijke voorzieningen indien het expertisecentrum
      onderwijszorg naar het oordeel van Onze Minister zijn taken ernstig verwaarloost.

      2 De voorzieningen, bedoeld in het eerste lid, worden niet eerder getroffen dan nadat het expertisecentrum
      onderwijszorg in de gelegenheid is gesteld om binnen een door Onze Minister te stellen redelijke termijn alsnog
      zijn taken naar behoren uit te voeren.
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel3.7
  - number: 4.1.1
    text: |-
      1 De onderwijsgevenden aan een instelling dragen de titel van docent.

      2 Aan een instelling zijn één of meer directeuren verbonden.

      3 Het bevoegd gezag benoemt één of meer van de docenten om een directeur bij te staan en bij afwezigheid te
      vervangen. Deze dragen de titel van adjunct-directeur.

      4 Het bevoegd gezag kan overig personeel aanwijzen, dat tot taak

      heeft, het onderwijs te ondersteunen.
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel4.1.1
  - number: 4.1.2
    text: |-
      Het bevoegd gezag benoemt, schorst en ontslaat de directeuren, de adjunct- directeuren, de docenten en het overige
      personeel.
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel4.1.2
  - number: 4.1.3
    text: |-
      Het bevoegd gezag stelt jaarlijks het beleid vast met betrekking tot de formatie van het personeel van de
      instelling. Zoveel mogelijk tegelijk met die vaststelling bepaalt het bevoegd gezag functies en taken van het
      personeel van de instelling, met inachtneming van de daaromtrent bij eilandsbesluit, houdende algemene maatregelen,
      te geven nadere voorschriften.
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel4.1.3
  - number: 4.1.4
    text: |-
      1 De [Ambtenarenwet BES][ref1] en de daarop berustende regelingen zijn voor het personeel van een instelling voor
      bijzonder onderwijs van overeenkomstige toepassing.

      2 Voor de salarissen en toelagen van het personeel wordt een regeling vastgesteld bij eilandsbesluit.

      3 Het bestuurscollege stelt de regeling, bedoeld in het tweede lid, dan wel een wijziging daarvan niet vast
      dan nadat daarover op overeenstemming gericht overleg is gevoerd met de bevoegde gezagsorganen en met de
      onderwijsvakbonden of, bij het ontbreken daarvan, met een representatief te achten vertegenwoordiging van het
      personeel. [Artikel 101 van de Ambtenarenwet BES][ref2] is niet van toepassing op de vaststelling dan wel wijziging
      van de regeling, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028215
      [ref2]: https://wetten.overheid.nl/BWBR0028215#Artikel101
