  - number: 7.5.1
    text: |-
      1 In deze titel wordt onder «betrokkene» verstaan:

      a. student, vavo-student en extraneus;

      b. aanstaande student, aanstaande vavo-student en aanstaande extraneus;

      c. voormalige student, voormalige vavo-student en voormalige extraneus.

      2 Het bevoegd gezag richt een toegankelijke en eenduidige faciliteit in. Het bevoegd gezag stelt een nadere
      regeling vast met betrekking tot deze paragraaf en paragraaf 2, die een onderdeel vormt van het bestuursreglement.
      Deze regeling vermeldt in ieder geval:

      a. de instelling van een klachtencommissie, die klachten behandelt,

      b. de wijze waarop de klachtencommissie haar werkzaamheden verricht,

      c. de termijn waarbinnen de klager een klacht kan indienen, en

      d. de termijn waarbinnen mededeling plaatsvindt van het oordeel, bedoeld in het zesde lid, en hoe bij noodzakelijke
      afwijking van deze termijn wordt gehandeld.

      3 Een betrokkene dient een klacht als bedoeld in [artikel 7.5.2][ref1] dan wel beroep of bezwaar als bedoeld
      in paragraaf 2 van deze titel en [artikel 8.1.7a, vijfde lid][ref2], vanwege een schriftelijke beslissing
      van een orgaan van een instelling inhoudende een rechtshandeling op grond van deze wet en daarop gebaseerde
      regelingen, vanwege het ontbreken van een dergelijke beslissing dan wel vanwege een geschil met betrekking
      tot het maken, wijzigen of uitvoeren van afspraken als bedoeld in [artikel 8.1.5a, tweede lid][ref3], in bij
      de faciliteit. Indien het een beroep of bezwaar van een betrokkene aan een openbare instelling betreft, is
      [artikel 55 van de Wet administratieve rechtspraak BES][ref4] niet van toepassing.

      4 De termijn voor het schriftelijk indienen van een bezwaar als bedoeld in paragraaf 2 bedraagt
      zes weken. De termijn voor het schriftelijk indienen van een beroep als bedoeld in paragraaf 2 en
      [artikel 8.1.7a, vijfde lid][ref5], bedraagt twee weken.

      5 De faciliteit bevestigt de ontvangst van een binnengekomen klacht, beroep of bezwaar schriftelijk
      aan de betrokkene en zendt deze, nadat daarop de datum van ontvangst is aangetekend, zo
      spoedig mogelijk door aan het bevoegde orgaan. Indien het een openbare instelling betreft, is
      [artikel 59, tweede lid, van de Wet administratieve rechtspraak BES][ref6] niet van toepassing.

      6 De datum van ontvangst, bedoeld in het vijfde lid, is bepalend voor de vraag of een
      klacht, beroep of bezwaar tijdig is ingediend. Indien het een openbare instelling betreft, is
      [artikel 59, tweede lid, van de Wet administratieve rechtspraak BES][ref7] niet van toepassing.

      7 Indien de faciliteit een klacht, beroep of bezwaar aan een onbevoegd orgaan heeft gezonden, zendt dit orgaan
      het desbetreffende stuk zo spoedig mogelijk terug naar de faciliteit. Het bevoegde orgaan behandelt een klacht,
      beroep of bezwaar dat door een betrokkene rechtstreeks is ingediend bij dit orgaan slechts na tussenkomst van de
      faciliteit.


