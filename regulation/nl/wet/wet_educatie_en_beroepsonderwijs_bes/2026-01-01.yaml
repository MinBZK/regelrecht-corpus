  - number: 7.5.2
    text: |-
      1 Ouders dan wel studenten of deelnemers, en personeelsleden kunnen bij de klachtencommissie, bedoeld in het tweede
      lid, onderdeel a, een klacht indienen over gedragingen en beslissingen van het bevoegd gezag of het personeel,
      waaronder discriminatie, dan wel het nalaten van gedragingen en het niet nemen van beslissingen door het bevoegd
      gezag of het personeel.

      2 Deze regeling strekt ter vervanging van klachtenregelingen op grond van andere voorschriften dan dit artikel en
      strekt niet ter vervanging van een andere voorziening die op grond van een wettelijke regeling, niet zijnde een
      klachtenregeling, voor de klager openstaat of heeft opengestaan.

      3 Deze regeling

      a. voorziet erin dat de klachten worden behandeld door een klachtencommissie die bestaat uit ten minste drie leden,
      waaronder een voorzitter die geen deel uitmaakt van het bevoegd gezag en niet werkzaam is voor of bij het bevoegd
      gezag, en

      b. waarborgt dat aan de behandeling van een klacht niet wordt deelgenomen door een persoon op wiens gedraging de
      klacht rechtstreeks betrekking heeft.

      4 De klager en degene over wie is geklaagd krijgen de gelegenheid:

      a. hun zienswijze mondeling of schriftelijk toe te lichten en

      b. zich bij de behandeling van de klacht te laten bijstaan.

      5 De klachtencommissie vormt zich een oordeel over de gegrondheid van de klacht en deelt dit oordeel, al dan niet
      vergezeld van aanbevelingen, schriftelijk mede aan de klager, degene over wie is geklaagd en het bevoegd gezag.

      6 Het bevoegd gezag deelt de klager en de klachtencommissie, bedoeld in het tweede lid, onderdeel a, binnen 4
      weken na ontvangst van het in het zesde lid bedoelde oordeel van de klachtencommissie schriftelijk mede of hij het
      oordeel over de gegrondheid van de klacht deelt en of hij naar aanleiding van dat oordeel maatregelen zal nemen en
      zo ja welke. Bij afwijking van de in de eerste volzin bedoelde termijn, doet het bevoegd gezag daarvan met redenen
      omkleed mededeling aan de klager en de klachtencommissie onder vermelding van de termijn waarbinnen het bevoegd
      gezag zijn standpunt bekend zal maken.

      7 Degene die betrokken is bij de uitvoering van dit artikel en daarbij de beschikking krijgt over gegevens waarvan
      hij het vertrouwelijke karakter kent of redelijkerwijze moet vermoeden, is verplicht tot geheimhouding daarvan,
      behoudens voor zover enig wettelijk voorschrift hem tot mededeling verplicht of uit zijn taak de noodzaak tot
      mededeling voortvloeit.

      8 Gegevens die betrekking hebben op een klacht worden bewaard op een plaats die uitsluitend toegankelijk is voor de
      leden van de klachtencommissie en het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel7.5.2
  - number: 7.5.3
    text: |-
      1 Het bevoegd gezag van een instelling of exameninstelling stelt, al dan niet in samenwerking met een of meer
      andere bevoegde gezagsorganen van andere instellingen of exameninstellingen een commissie van beroep voor de
      examens in dan wel sluit zich bij een dergelijke commissie aan. Beslissingen van de examencommissie of van de
      examinatoren kunnen worden onderworpen aan het oordeel van een commissie van beroep voor de examens.

      2 De leden van de beroepscommissie maken geen deel uit van het bevoegd gezag, van de inspectie of van de
      examencommissie noch mogen zij examinator zijn.

      3 De commissie van beroep voor de examens oordeelt over beslissingen van de examencommissie of van de examinatoren.

      4 De commissie stelt een onderzoek in alvorens te beslissen. Zij stelt bij haar beslissing zo nodig vast op welke
      wijze de kandidaat alsnog in de gelegenheid zal worden gesteld het examen geheel of gedeeltelijk af te leggen.

      5 De commissie maakt haar beslissing bekend aan de kandidaat, aan de ouders, voogden of verzorgers van de
      kandidaat indien deze minderjarig is, aan het bevoegd gezag, aan het bedrijf dat of de organisatie die de
      beroepspraktijkvorming verzorgt, en aan de inspectie.

      6 Indien de commissie het beroep gegrond acht, vernietigt zij de beslissing geheel of gedeeltelijk. De commissie is
      niet bevoegd in de plaats van de geheel of gedeeltelijk vernietigde beslissing een nieuwe beslissing te nemen. De
      examencommissie of de examinator van wie de beslissing is vernietigd, voorziet voor zover nodig opnieuw in de zaak
      met inachtneming van de uitspraak van de commissie van beroep voor de examens. De commissie kan daarvoor in haar
      uitspraak een termijn stellen.
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel7.5.3
  - number: 7.5.4
    text: |-
      De leden van de examencommissie en de examinatoren verstrekken aan de commissie van beroep voor de examens de
      inlichtingen die zij voor de uitvoering van haar taak nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel7.5.4
  - number: 7.5.5
    text: |-
      1 Het bevoegd gezag stelt, al dan niet in samenwerking met een of meer bevoegde gezagsorganen van andere
      instellingen, een geschillenadviescommissie in of sluit zich bij een dergelijke commissie aan. Op een
      geschillenadviescommissie zijn [artikelen 70 tot en met 74 van de Wet administratieve rechtspraak BES][ref1] van
      overeenkomstige toepassing. De leden van de geschillenadviescommissie zijn functioneel onafhankelijk.

      2 De geschillenadviescommissie brengt aan het bevoegd gezag advies uit over bezwaren met betrekking tot
      schriftelijke beslissingen van organen van een instelling inhoudende een rechtshandeling op grond van deze wet
      en daarop gebaseerde regelingen dan wel met betrekking tot het ontbreken van een dergelijke beslissing. De vorige
      volzin is niet van toepassing op beslissingen als bedoeld in [artikel 7.5.3][ref2].

      3 De geschillenadviescommissie neemt tevens kennis van geschillen tussen studenten of vavo-studenten en het
      bevoegd gezag van een instelling met betrekking tot het maken, wijzigen en uitvoeren van de afspraken, bedoeld in
      [artikel 8.1.5a, tweede lid][ref3].

      4 De geschillenadviescommissie gaat na of een minnelijke schikking tussen partijen mogelijk is.

      5 Indien sprake is van onverwijlde spoed kan de voorzitter van de geschillenadviescommissie desgevraagd bepalen
      dat de geschillenadviescommissie zo spoedig mogelijk advies uitbrengt aan het bevoegd gezag. De voorzitter bepaalt
      binnen een week na ontvangst van het bezwaar of sprake is van onverwijlde spoed en brengt de betrokkene en het
      bevoegd gezag hiervan zo spoedig mogelijk op de hoogte. Het bevoegd gezag neemt dan, wat de openbare instellingen
      betreft in afwijking van [artikel 69 van de Wet administratieve rechtspraak BES][ref4], binnen vier weken na
      ontvangst van het bezwaar door de faciliteit een beslissing.

      6 Het bevoegd gezag kan een commissie belasten met de behandeling van en advisering over zowel bezwaren als bedoeld
      in het tweede lid als klachten als bedoeld in [artikel 7.5.2][ref5], onverminderd het bepaalde bij of krachtens dit
      artikel en de artikelen 7.5.2 en [7.5.6][ref6].


