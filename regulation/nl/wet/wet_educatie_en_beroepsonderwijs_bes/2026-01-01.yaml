  - number: 6.2.3
    text: |-
      1 Voordat Onze Minister een besluit neemt op grond van [artikel 6.2.1, tweede lid, onderdeel a][ref1], geeft hij
      aan het bevoegd gezag een waarschuwing op grond van zijn bevindingen ten aanzien van de kwaliteit van de opleiding,
      onder bepaling van een termijn waarbinnen aan die waarschuwing gevolg moet zijn gegeven. De termijn waarbinnen aan
      de waarschuwing gevolg moet zijn gegeven bedraagt ten minste drie maanden. Onze Minister geeft pas toepassing aan
      artikel 6.2.1, tweede lid, onderdeel a, nadat:

      a. de termijn, bedoeld in de aanhef, is verstreken, en

      b. Onze Minister aan de hand van een nader onderzoek tot het oordeel is gekomen dat niet of niet in voldoende mate
      gevolg is gegeven aan de waarschuwing.

      2 Voordat Onze Minister een beschikking neemt op grond van [artikel 6.2.1, tweede lid, onderdeel b][ref2], geeft
      hij aan het bevoegd gezag een waarschuwing, onder bepaling van een termijn waarbinnen aan die waarschuwing gevolg
      moet zijn gegeven en desgewenst overleg met hem dienaangaande plaats kan vinden. De termijn waarbinnen aan de
      waarschuwing gevolg moet zijn gegeven, bedraagt ten minste drie maanden.

      3 Onze Minister maakt de waarschuwingen, bedoeld in dit artikel, openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel6.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel6.2.1
