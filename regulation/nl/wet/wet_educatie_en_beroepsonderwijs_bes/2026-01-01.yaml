      1 Het bevoegd gezag beslist na ontvangst van het bezwaar binnen tien weken, onverminderd
      de beslissingen op grond van de procedure, bedoeld in [artikel 7.5.5, vijfde lid][ref1].
      Wat de openbare instellingen betreft beslist het bevoegd gezag in afwijking van
      [artikel 69, eerste lid, tweede volzin, van de Wet administratieve rechtspraak BES][ref2].

      2 Wat bijzondere instellingen betreft worden de [artikelen 68][ref3], [69][ref4] en
      [70, derde en vierde lid, van de Wet administratieve rechtspraak BES][ref5] overeenkomstig toegepast.


