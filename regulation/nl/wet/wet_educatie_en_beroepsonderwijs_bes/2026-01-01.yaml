  - number: 2.3.11
    text: |-
      1 Indien de vaststelling van de rijksbegroting daartoe noopt, kan Onze Minister tot acht weken na die vaststelling
      correcties aanbrengen op de rijksbijdrage. Onze Minister maakt het bevoegd gezag binnen acht weken na de
      vaststelling van de rijksbegroting een correctie als bedoeld in de eerste volzin bekend. Onze Minister verrekent de
      correctie met de rijksbijdrage voor het desbetreffende jaar of betaalt uit in dat jaar.

      2 Indien uit de jaarrekening, uit de verklaring van de deskundige, bedoeld in [artikel 2.3.1, vierde lid][ref1],
      uit de resultaten van het onderzoek, bedoeld in [artikel 2.3.8][ref2], blijkt dat de rijksbijdrage op onjuiste
      gronden is vastgesteld dan wel de besteding daarvan niet rechtmatig of niet doelmatig was, kan Onze Minister
      binnen een jaar na ontvangst van de jaarrekening correcties aanbrengen op de rijksbijdrage. Onze Minister maakt
      het bevoegd gezag binnen een jaar na ontvangst van de jaarrekening een correctie als bedoeld in de eerste volzin
      bekend. Onze Minister verrekent de correctie met de rijksbijdrage voor het eerstvolgende jaar of betaalt uit in
      dat jaar.

      3 Onverminderd het eerste en tweede lid is Onze Minister bevoegd tot verrekening van vorderingen krachtens deze wet
      van of op het bevoegd gezag met vorderingen krachtens een andere wet.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel2.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel2.3.8
