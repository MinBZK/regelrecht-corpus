  - number: 2.5.1
    text: |-
      1 Bij de opheffing van een openbare instelling en bij de beëindiging van de bekostiging van een bijzondere
      instelling draagt het bevoegd gezag zo spoedig mogelijk na de opheffing dan wel na de beëindiging van de
      bekostiging, zorg voor de vaststelling van een eindafrekening. De eindafrekening wordt aan Onze Minister gezonden
      en gaat vergezeld van een verklaring omtrent de getrouwheid van een door het bevoegd gezag aangewezen deskundige.

      2 Tenzij met Onze Minister een andere regeling wordt getroffen, is het bevoegd gezag aan het Rijk een bedrag
      verschuldigd, indien de eindafrekening een batig saldo bevat. Het bedrag wordt door Onze Minister vastgesteld en
      mag niet hoger zijn dan het saldo van de eindafrekening. Bij de vaststelling van het bedrag wordt rekening gehouden
      met door het bevoegd gezag uit de eigen middelen aan investeringen bestede gelden.

      3 Indien de in het eerste lid bedoelde opheffing dan wel beëindiging van de bekostiging zich voordoet, maakt
      het bevoegd gezag zo spoedig mogelijk aan Onze Minister bekend welke maatregelen het heeft genomen teneinde
      te waarborgen dat de aan die instelling ingeschreven studenten en vavo-studenten het onderwijs aan een andere
      instelling kunnen voltooien.
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel2.5.1
  - number: 2.5.2
    text: |-
      Het bevoegd gezag beheert de middelen van de instelling op zodanige wijze dat een behoorlijke exploitatie en het
      voortbestaan van de instelling zijn verzekerd.
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel2.5.2
  - number: '3.1'
    text: |-
      1 Het bevoegd gezag van een instelling waar een student of vavo-student met een specifieke onderwijsbehoefte is
      ingeschreven, stelt voor deze student of vavo-student elk studiejaar een handelingsplan op.

      2 Het handelingsplan wordt opgesteld in overeenstemming met de student of vavo-student of indien de student of
      vavo-student minderjarig is tevens met diens ouders, voogden of verzorgers.

      3 Indien de inschrijving van de in het eerste lid bedoelde student of vavo-student plaatsvindt op of na 1 augustus
      wordt het handelingsplan zo spoedig mogelijk maar uiterlijk een maand na die inschrijving opgesteld.

      4 Het bevoegd gezag evalueert jaarlijks het handelingsplan met de student of vavo-student of indien de student of
      vavo-student minderjarig is tevens met diens ouders, voogden of verzorgers.
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel3.1
  - number: '3.2'
    text: |-
      1 Het bevoegd gezag is voor elk van zijn instellingen aangesloten bij een samenwerkingsverband met, voor zover
      aanwezig in het openbaar lichaam:

      a. een of meer instellingen,

      b. een of meer scholen voor primair onderwijs,

      c. een of meer scholen voor voortgezet onderwijs,

      d. de uitvoeringsinstantie, bedoeld in [artikel 5, tweede lid, van de Wet sociale kanstrajecten jongeren BES][ref1],
      en

      e. een expertisecentrum onderwijszorg.

      2 In afwijking van het eerste lid kan een samenwerkingsverband bestaan uit de betrokkene, bedoeld in de onderdelen
      a, b, c of d die gezamenlijk een expertisecentrum onderwijszorg in stand houden.

      3 Het samenwerkingsverband stelt zich ten doel een samenhangend geheel van zorgvoorzieningen binnen en tussen
      instellingen en in samenwerking met de betrokkenen, bedoeld in het eerste lid, onderdelen b tot en met e,
      te realiseren en wel zodanig dat zoveel mogelijk studenten, vavo-studenten en leerlingen een ononderbroken
      ontwikkelingsproces kunnen doormaken.

      4 Per openbaar lichaam is er één samenwerkingsverband.

      5 Indien een bevoegd gezag wenst deel te nemen aan het samenwerkingsverband, wordt deze deelname door de bevoegde
      gezagsorganen van het samenwerkingsverband niet geweigerd.

      6 Bij of krachtens ministeriële regeling worden regels gesteld over de wijze waarop een geschil tussen de
      organisaties, bedoeld in het eerste lid, over aangelegenheden die het samenwerkingsverband aangaan, wordt beslecht.


      [ref1]: https://wetten.overheid.nl/BWBR0028506#Artikel5
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0028506
        artikel: '5'
  - number: '3.3'
    text: |-
      1 Het bevoegd gezag stelt samen met de bevoegde gezagsorganen die samenwerken in een samenwerkingsverband en met
      het expertisecentrum onderwijszorg indien [artikel 3.2 eerste lid][ref1], van toepassing is, jaarlijks voor 1 mei
      een gezamenlijk eilandelijk zorgplan vast voor het daaropvolgende studiejaar.

      2 Het eilandelijk zorgplan bevat in elk geval een beschrijving van:

      a. de wijze waarop wordt voldaan aan [artikel 3.2, eerste en derde lid][ref2],

      b. de wijze, waarop de bekostiging voor de zorgvoorzieningen, bedoeld in
      [artikel 2.2.1, vierde lid, onderdelen j en k][ref3] wordt ingezet,

      c. de wijze waarop de subsidie voor de taken, bedoeld in [artikel 3.4, eerste lid][ref4], en voor zover van
      toepassing het zevende lid van dat artikel, wordt ingezet,

      d. de beoogde en bereikte kwalitatieve en kwantitatieve resultaten ten aanzien van de onderwijskundige opvang van
      studenten, vavo-studenten en leerlingen met een specifieke onderwijsbehoefte,

      e. de procedures voor de handelingsgerichte diagnose van studenten, vavo-studenten en leerlingen, en

      f. de wijze waarop aan de ouders informatie wordt verstrekt over de zorgvoorzieningen.

      3 Het eilandelijk zorgplan wordt voor 15 mei voorafgaand aan het studiejaar waarop het betrekking heeft,
      toegezonden aan de inspectie.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel3.2
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel3.2
      [ref3]: https://wetten.overheid.nl/BWBR0028395#Artikel2.2.1
      [ref4]: https://wetten.overheid.nl/BWBR0028395#Artikel3.4
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel3.3
