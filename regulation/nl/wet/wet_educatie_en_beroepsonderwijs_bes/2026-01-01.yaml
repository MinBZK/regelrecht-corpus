  - number: 1.4.1
    text: |-
      1 Onze Minister kan op aanvraag van het bevoegd gezag een beroepsopleiding in de beroepsopleidende leerweg of een
      beroepsopleiding in de beroepsbegeleidende leerweg erkennen indien de kwalificatie waarop de beroepsopleiding is
      gebaseerd, is opgenomen in de ministeriële regeling, bedoeld in [artikel 7.2.4, eerste lid][ref1].

      2 Erkenning houdt in dat aan de met goed gevolg afgelegde examens of onderdelen van examens van die opleiding een
      diploma als bedoeld in artikel 7.4.8 of certificaat als bedoeld in [artikel 7.2.3][ref2] is verbonden.

      3 Voorwaarde voor erkenning is dat de desbetreffende instelling voor die opleiding in acht neemt hetgeen bij of
      krachtens deze wet is bepaald ten aanzien van:

      a. de kwaliteitszorg, bedoeld in [artikel 1.3.2][ref3],

      b. het onderwijs, de examens en de verklaring, bedoeld in [hoofdstuk 7][ref4] met uitzondering van
      [artikel 7.1.4][ref5], met uitzondering van [artikel 7.2.4a, derde lid][ref6], mits het aantal begeleide
      onderwijsuren en het aantal uren beroepspraktijkvorming op grond van de studieduur, naar evenredigheid ten minste
      gelijk is aan het aantal uren, bedoeld in [artikel 7.2.6, tweede tot en met vierde lid][ref7],

      c. de commissie van beroep voor de examens, bedoeld in [artikel 7.5.3][ref8],

      d.

      e. de vooropleidingseisen, bedoeld in [artikel 8.2.1][ref9],

      f. de eisen, bedoeld in de [artikelen 4.2.1 tot en met 4.2.4][ref10], en

      g. het toezicht door de inspectie.

      4 De aanvraag om erkenning gaat in elk geval vergezeld van een beschrijving van het stelsel van kwaliteitszorg,
      bedoeld in [artikel 1.3.2, tweede lid][ref11] alsmede het ontwerp van de in [artikel 7.4.9][ref12] bedoelde
      onderwijs- en examenregeling van de opleiding.

      5 De aanvraag om erkenning wordt ingediend bij Onze Minister. Indien de gegevens bij de aanvraag onjuist of niet
      volledig zijn, stelt Onze Minister binnen twee weken na indiening van de aanvraag de aanvrager in de gelegenheid om
      binnen een door Onze Minister te bepalen termijn alsnog te voorzien in de vereiste gegevens.

      6 Onze Minister beslist binnen zes maanden na de aanvraag om erkenning. Indien de beschikking niet binnen zes
      maanden kan worden gegeven, stelt Onze Minister de aanvrager daarvan in kennis en noemt hij daarbij een termijn
      waarbinnen de beschikking wel tegemoet kan worden gezien.

      7 Het bevoegd gezag verstrekt Onze Minister op diens verzoek de nodige inlichtingen omtrent de instelling. Het
      bevoegd gezag doet Onze Minister en, indien het betreft op grond van [artikel 2.1.1][ref13] bekostigde opleidingen,
      de desbetreffende eilandsraad jaarlijks vóór 1 februari een verslag toekomen omtrent de werkzaamheden van de
      instelling voor zover betrekking hebbend op opleidingen. Het verslag bevat tevens het aantal studenten per
      opleiding en het aantal uitgereikte diploma’s en certificaten, bedoeld in [artikel 7.4.8][ref14] respectievelijk
      [7.2.3][ref15].

      8 Een aanvraag om erkenning geldt mede als aanmelding voor registratie in de Registratie instellingen en
      opleidingen.

      9 Het eerste tot en met achtste lid zijn van overeenkomstige toepassing op een beroepsopleiding in andere dan in
      het eerste lid genoemde leerwegen, met dien verstande dat voor die opleiding [artikel 7.2.2, tweede lid][ref16],
      niet van toepassing is en ten aanzien van het onderwijs [artikel 7.2.6, eerste lid][ref17], niet in acht
      behoeft te worden genomen voor wat betreft de eisen met betrekking tot voldoende begeleide onderwijsuren en uren
      beroepspraktijkvorming en artikel 7.2.6, tweede tot en met achtste lid, niet in acht behoeft te worden genomen.


