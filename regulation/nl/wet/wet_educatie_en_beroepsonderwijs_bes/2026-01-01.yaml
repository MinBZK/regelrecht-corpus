  - number: '9.1'
    text: |-
      1 In afwijking van [artikel 7, eerste lid, van de Wet administratieve rechtspraak BES][ref1] kan een belanghebbende
      beroep instellen bij het Gemeenschappelijke Hof van Justitie van Aruba, Curaçao, Sint Maarten en van Bonaire, Sint
      Eustatius en Saba tegen een besluit van Onze Minister jegens een bepaalde instelling op grond van de in het tweede
      lid genoemde artikelen. De [artikelen 54][ref2] en [55 van de Wet administratieve rechtspraak BES][ref3] zijn van
      overeenkomstige toepassing.

      2 Het eerste lid heeft betrekking op de artikelen:

