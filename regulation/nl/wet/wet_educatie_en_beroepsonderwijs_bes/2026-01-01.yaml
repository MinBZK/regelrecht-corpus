  - number: '11.1'
    text: |-
      1 De opleidingen die in het schooljaar 2008–2009 werden erkend en bekostigd als secundair beroepsonderwijs in
      de zin van de Landsverordening secundair beroepsonderwijs en educatie, worden met ingang van het tijdstip van
      inwerkingtreding van dit artikel, aangemerkt als erkende en bekostigde opleidingen voor beroepsonderwijs.

      2 De niet bekostigde opleidingen die op de dag voorafgaand aan het tijdstip van de inwerkingtreding van dit
      artikel, op grond van artikel 3 van de Landsverordening secundair beroepsonderwijs en educatie, of de Wet educatie
      en beroepsonderwijs BES zoals die wet op 10 oktober 2010 is komen te luiden, zijn aangewezen als beroepsonderwijs,
      worden aangemerkt als erkende niet bekostigde opleidingen voor beroepsonderwijs.
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel11.1
  - number: 11.1a
    text: |-
      Tot een bij koninklijk besluit te bepalen tijdstip kan bij of krachtens algemene maatregel van bestuur worden
      afgeweken van [artikel 2.2.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel2.2.2
