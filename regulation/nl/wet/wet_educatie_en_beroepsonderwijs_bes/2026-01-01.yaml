  - number: 2.2.5a
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van de besteding van de
      rijksbijdrage aan private activiteiten ten behoeve van het onderwijs.
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel2.2.5a
  - number: 2.2.6
    text: |-
      De eilandsraad of het bestuurscollege draagt overeenkomstig
      [hoofdstuk 11, paragraaf 6, van de Wet voortgezet onderwijs 2020][ref1] zorg voor de voorzieningen in de
      huisvesting van instellingen op het grondgebied van het openbaar lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Paragraaf6
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel2.2.6
    references:
      - id: ref1
        bwb_id: BWBR0044212
        paragraaf: '6'
  - number: 2.3.1
    text: |-
      1 Het bevoegd gezag van een instelling voor beroepsonderwijs stelt jaarlijks een jaarrekening vast over het
      afgelopen jaar.

      2 In de jaarrekening legt het bevoegd gezag verantwoording af over het financiële beheer van de instelling voor
      zover het betreft de ingevolge deze wet uit 's Rijks kas ontvangen middelen. Uit de jaarrekening dient te blijken
      dat sprake is van een rechtmatige en doelmatige aanwending van de rijksbijdrage. Van niet doelmatige aanwending van
      de rijksbijdrage is in ieder geval sprake voor zover bedragen daaruit worden aangewend voor het op enigerlei wijze
      compenseren van de extraneï voor examengeld. Bij ministeriële regeling kunnen met het oog op de verantwoording van
      de rechtmatigheid en doelmatigheid van de aanwending van de rijksbijdrage nadere voorschriften worden gegeven voor
      de inrichting van de jaarrekening.

      3 Het resultaat van het jaar waarop de jaarrekening betrekking heeft wordt verrekend met de algemene reserve van
      de instelling.

      4 Het bevoegd gezag dient de jaarrekening voor 1 juli van het jaar volgend op het boekjaar
      bij Onze Minister in. De jaarrekening gaat vergezeld van de overige gegevens, bedoeld in
      [artikel 392 van Boek 2 van het Burgerlijk Wetboek][ref1] en een verklaring omtrent de getrouwheid, afgegeven door
      een door het bevoegd gezag aangewezen deskundige.

      5 Het bevoegd gezag maakt de jaarrekening, vergezeld van de overige gegevens en de verklaring, bedoeld in het
      vierde lid, openbaar. Bij ministeriële regeling kunnen nadere voorschriften worden gegeven over de wijze en het
      tijdstip waarop openbaarmaking plaatsvindt.

      6 Het bevoegd gezag draagt er zorg voor dat het ten behoeve van Onze Minister beschikt over een overzichtelijke
      informatieverzameling van de financiële gegevens die op enigerlei wijze van belang zijn voor de berekeningswijze,
      bedoeld in [artikel 2.2.2][ref2].

      7 Het bevoegd gezag houdt per begrotingsjaar nauwkeurig boek van baten en lasten en draagt er zorg voor dat de
      baten en lasten nauwkeurig en herkenbaar zijn verwerkt in de in het zesde lid bedoelde informatieverzameling.

      8 Het bevoegd gezag bewaart de informatieverzameling en de desbetreffende boeken en bescheiden, bedoeld in het
      zesde en zevende lid, gedurende een periode van zeven jaren.

      9 Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden vastgesteld omtrent de wijze van
      beschikbaarstelling van de gegevens en de wijze van ordening daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel392
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel2.2.2
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel2.3.1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '392'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: 2.2.2
        hoofdstuk: '2'
  - number: 2.3.2
    text: |-
      1 Het bevoegd gezag stelt jaarlijks een jaarverslag over het afgelopen jaar vast en maakt het openbaar. Het
      jaarverslag bevat ten minste het verslag, bedoeld in [artikel 1.3.2, derde lid][ref1], voor zover dat in het
      desbetreffende jaar is uitgebracht, dan wel de hoofdpunten van laatstgenoemd verslag, alsmede de hoofdpunten van
      de bevindingen van de inspectie met betrekking tot de examens en informatie over schorsing en verwijdering van
      studenten, vavo-studenten en deelnemers in het afgelopen jaar.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld over de inrichting en de wijze en het tijdstip van
      openbaarmaking van het jaarverslag.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel1.3.2
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel2.3.2
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: 1.3.2
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 2.3.3
    text: |-
      1 De instellingen dragen er zorg voor dat zij beschikken over geordende gegevens ten behoeve van het door Onze
      Minister te voeren beleid met betrekking tot het beroepsonderwijs en verlenen desgevraagd medewerking aan door of
      namens Onze Minister uit te voeren onderzoek dat geheel of mede op deze gegevens is gebaseerd.

      2 Bij of krachtens algemene maatregel van bestuur worden voorschriften vastgesteld omtrent de wijze van
      beschikbaarstelling van de in het eerste lid bedoelde gegevens.

      3 Bij de in het tweede lid bedoelde algemene maatregel van bestuur worden tevens voorschriften vastgesteld over de
      wijze van ordening van de informatie en over de kengetallen waarover informatie beschikbaar is of wordt verstrekt,
      en kan worden bepaald dat Onze Minister een bijdrage in de kosten voor het verzamelen of verstrekken van deze
      gegevens is verschuldigd. Bij of krachtens de in het tweede lid bedoelde algemene maatregel van bestuur kan deze
      bijdrage worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel2.3.3
  - number: 2.3.4
    text: |-
      1 Het bevoegd gezag kan het persoonsgebonden nummer BES van een deelnemer aan een beroepsopleiding gebruiken in het
      verkeer met de deelnemer op wie het nummer betrekking heeft, of, indien de deelnemer minderjarig is, met de ouders,
      voogden of verzorgers van deze deelnemer.

      2 Het bevoegd gezag verstrekt het persoonsgebonden nummer BES van iedere deelnemer aan een beroepsopleiding aan
      Onze Minister, tezamen met de volgende gegevens van de deelnemer:

      a. geslacht, geboortedatum en postcode van de woonplaats,

      b. de datum van inschrijving of einde inschrijving,

      c. de kwalificatie,

      d. de leerweg,

      e. het al dan niet hebben van een handicap of chronische ziekte die extra ondersteuning vraagt van de instelling,

      f. de hoogste vooropleiding,

      g. het uitstroomniveau of het behaalde diploma en de datum waarop het diploma is behaald,

      h. de omvang van beroepspraktijkvorming, de datum van begin en einde daarvan, de afsluitdatum van de
      beroepspraktijkvormingsovereenkomst en het betrokken bedrijf dat of de betrokken organisatie die de
      beroepspraktijkvorming verzorgt,

      i. het registratienummer van de instelling,

      j. het volgen van de opleiding in voltijd of deeltijd,

      k. indien van toepassing het zijn van examendeelnemer,

      l. het al dan niet voor bekostiging in aanmerking komen van de deelnemer, en

      m. indien van toepassing de reden van uitstroom.

      3 Bij ministeriële regeling kan een nadere specificatie worden gegeven van de gegevens, bedoeld in het tweede
      en zevende lid, en kan worden bepaald welke van de gegevens, bedoeld in het tweede en zevende lid, niet langer
      behoeven te worden verstrekt. Bij ministeriële regeling kunnen voorts regels worden gesteld omtrent de tijdstippen
      en de wijze van verstrekking van de gegevens, bedoeld in het tweede en zevende lid.

      4 Het bevoegd gezag kan het persoonsgebonden nummer BES van een deelnemer aan een beroepsopleiding, al dan niet
      tezamen met een of meer van de gegevens, bedoeld in het tweede en zevende lid, gebruiken in het verkeer met Onze
      Minister ten behoeve van de vaststelling van de bekostiging van de instelling.

      5 Het bevoegd gezag en het hoofd, bedoeld in [artikel 1, onder d, van de Leerplichtwet BES][ref1], gebruiken het
      persoonsgebonden nummer BES van een deelnemer aan een beroepsopleiding in contacten met een openbaar lichaam in
      het kader van de [Leerplichtwet BES][ref2], tezamen met de gegevens die noodzakelijk zijn voor het toezicht op de
      naleving van die wet door het openbaar lichaam.

      6 Het bevoegd gezag gebruikt bij de opgave aan het bestuurscollege, bedoeld in [artikel 8.1.8, eerste lid][ref3],
      het persoonsgebonden nummer BES van de betrokkene.

      7 Indien de gegevens over de nationaliteit van de leerling niet zijn opgenomen in de basisadministratie bedoeld in
      [artikel 1 van de Wet basisadministraties persoonsgegevens BES][ref4] worden deze gegevens door het bevoegd gezag
      verstrekt aan Onze Minister.

      8 Het bevoegd gezag gebruikt het persoonsgebonden nummer BES van een deelnemer in het contact met een andere school
      of een school of instelling voor ander onderwijs ten behoeve van de in- en uitschrijving van die deelnemer of ten
      behoeve van het volgen een doorlopende leerroute vmbo-mbo of de geïntegreerde route vmbo-basisberoepsopleiding,
      bedoeld in [artikel 2.107l van de Wet voortgezet onderwijs 2020](onbekend). Onder dit contact wordt mede begrepen
      de uitwisseling van leergegevens en direct met het leren samenhangende begeleidingsgegevens. Bij algemene
      maatregel van bestuur worden de gegevens, bedoeld in de vorige volzin, gespecificeerd. Het bevoegd gezag bewaart
      in de administratie van de school een verklaring van instemming van de ouders dan wel de leerling, indien deze de
      leeftijd van 16 jaar heeft bereikt, met de uitwisseling van de gegevens.

      9 Het bevoegd gezag kan het persoonsgebonden nummer BES van een deelnemer eenmalig gebruiken ten behoeve van het
      genereren van een pseudoniem voor deze deelnemer met het oog op het bieden van voorzieningen in het kader van het
      onderwijs en de begeleiding van deelnemers. Het bevoegd gezag draagt er zorg voor dat het pseudoniem wordt bewaard
      in de systemen waarin de deelnemers zijn geregistreerd.

      10 Het bevoegd gezag kan het pseudoniem, bedoeld in het negende lid, gebruiken voor het genereren van een ander
      pseudoniem voor een deelnemer in het kader van de toegang tot en het gebruik van digitale leermiddelen of het
      digitaal afnemen van toetsen en examens, waarbij het bevoegd gezag er zorg voor draagt dat dit andere pseudoniem
      wordt bewaard in de systemen waarin de deelnemers zijn geregistreerd. Dit andere pseudoniem wordt uitsluitend
      verstrekt aan een leverancier die een digitaal product of een digitale dienst aanbiedt bestaande uit leerstof of
      toetsen en de daarmee samenhangende digitale diensten.

      11 Bij algemene maatregel van bestuur kunnen andere gevallen worden aangewezen dan het geval, bedoeld in het tiende
      lid, waarvoor het bevoegd gezag op basis van het pseudoniem, bedoeld in het negende lid, een ander pseudoniem kan
      genereren.

      Daarbij worden in ieder geval de categorieën van ontvangers van dit andere pseudoniem aangewezen.

      12 Bij ministeriële regeling worden regels gesteld over de voorwaarden waaronder de pseudoniemen, bedoeld in het
      negende tot en met het elfde lid, kunnen worden gegenereerd en gebruikt. Deze voorwaarden betreffen in ieder geval
      de duur en de beveiliging, waaronder de gescheiden opslag van de pseudoniemen.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel1
