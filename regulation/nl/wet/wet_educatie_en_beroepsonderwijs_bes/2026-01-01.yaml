    text: |-
      1 Onze Minister kan het bevoegd gezag een aanwijzing tot het nemen van een of meer maatregelen geven, indien sprake
      is van wanbeheer.

      2 Onze Minister is bevoegd de aanwijzing te geven tot en met een bij koninklijk besluit te bepalen tijdstip.

      3 Onder wanbeheer wordt verstaan:

      a. financieel wanbeleid;

      b. het in ernstige mate of langdurig nalaten om, in ieder geval in strijd met [artikel 1.3.2][ref1], maatregelen
      te treffen die noodzakelijk zijn voor het waarborgen van de kwaliteit en de goede voortgang van het onderwijs,
      waaronder de deugdelijke afsluiting daarvan;

      c. het door een bestuurder of toezichthouder ongerechtvaardigd verrijken van het bevoegd gezag, zichzelf of een
      derde;

      d. het in de hoedanigheid van bestuurder of toezichthouder handelen in strijd met wettelijke bepalingen waarmee
      financieel voordeel wordt behaald ten gunste van het bevoegd gezag, zichzelf of een derde.

      4 Onze Minister motiveert in de aanwijzing waarom het doel van de aanwijzing niet met een minder zwaar middel kan
      worden bereikt.

      5 De aanwijzing vermeldt de termijn waarbinnen zij moet worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel1.3.2
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel10.1
