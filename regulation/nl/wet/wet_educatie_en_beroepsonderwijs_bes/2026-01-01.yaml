    text: |-
      1 Het bevoegd gezag van een instelling kan een beroepsopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdeel b, c en d][ref1], aanbieden in een doorlopende leerroute vmbo-mbo.

      2 Een doorlopende leerroute vmbo-mbo is een onderwijsprogramma vanaf het derde leerjaar aan een school, dat opleidt
      tot zowel een diploma vmbo als bedoeld in [artikel 2.58, tweede lid, van de Wet voortgezet onderwijs 2020][ref2]
      als het diploma van een basisberoepsopleiding, vakopleiding of middenkaderopleiding.

      3 In een doorlopende leerroute vmbo-mbo worden tot één onderwijsprogramma geïntegreerd:

      a. de basisberoepsgerichte leerweg en een basisberoepsopleiding in een aanverwant opleidingsdomein BES of een
      aanverwante kwalificatie;

      b. de kaderberoepsgerichte leerweg en een vakopleiding in een aanverwant opleidingsdomein BES of een aanverwante
      kwalificatie;

      c. de kaderberoepsgerichte, gemengde of theoretische leerweg en een middenkaderopleiding in een aanverwant
      opleidingsdomein BES of een aanverwante kwalificatie.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2.58
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel8.4a.2
