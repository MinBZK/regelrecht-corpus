  - number: 7.1.3
    text: |-
      Een kwalificatie is het geheel van bekwaamheden die een afgestudeerde van een beroepsopleiding kwalificeren voor
      het functioneren in een beroep of een groep van samenhangende beroepen, in het vervolgonderwijs en als burger en
      dat is beschreven binnen een kwalificatiedossier.
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel7.1.3
  - number: 7.1.4
    text: |-
      Het bevoegd gezag rapporteert over de vorderingen van de studenten aan hun ouders, voogden of verzorgers, dan wel
      aan de studenten zelf indien zij meerderjarig en handelingsbekwaam zijn.
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel7.1.4
  - number: 7.2.1
    text: Deze titel is van toepassing op beroepsopleidingen.
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel7.2.1
  - number: 7.2.1a
    text: |-
      1 Het bevoegd gezag verstrekt zodanige informatie aan aanstaande deelnemers van beroepsopleidingen over:

      a. de instelling,

      b. het aanbod van beroepsopleidingen,

      c. het arbeidsmarktperspectief na beëindiging van de desbetreffende beroepsopleiding,

      d. de vooropleidingseisen voor de verschillende beroepsopleidingen, en

      e. de kwaliteit van de verschillende beroepsopleidingen waaronder het oordeel van de inspectie ter zake,

      dat de aanstaande deelnemers in staat zijn de opleidingsmogelijkheden te vergelijken en een passende opleiding
      te kiezen.

      2 Bij ministeriële regeling kunnen nadere specificaties worden gegeven over de inhoud en vorm van de informatie die
      nodig is voor het vergelijken van opleidingen en het kiezen van een passende opleiding.
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel7.2.1a
  - number: 7.2.2
    text: |-
      1 De volgende soorten beroepsopleidingen worden onderscheiden:

      a. de entreeopleiding,

      b. de basisberoepsopleiding,

      c. de vakopleiding,

      d. de middenkaderopleiding, en

      e. de specialistenopleiding.

      2 De in het eerste lid bedoelde opleidingen kunnen worden verzorgd in de beroepsopleidende leerweg en de
      beroepsbegeleidende leerweg.

      3 De entreeopleidingen richten zich op de kwalificatie voor het eerste niveau van beroepsuitoefening of voor
      de entree op de arbeidsmarkt. De basisberoepsopleidingen richten zich op de kwalificatie voor het tweede, de
      vakopleidingen op de kwalificatie voor het derde en de middenkader en specialistenopleidingen op de kwalificatie
      voor het vierde en hoogste niveau van beroepsuitoefening.
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel7.2.2
  - number: 7.2.3
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat aan onderdelen van een kwalificatie of
      kwalificaties een certificaat is verbonden.

      2 [Artikel 7.4.8][ref1] is van overeenkomstige toepassing op certificaten.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7.4.8
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel7.2.3
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: 7.4.8
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.2.4
    text: |-
      1 Bij ministeriële regeling wordt vastgesteld voor welke kwalificaties uit de kwalificatiedossiers, bedoeld in
      [artikel 7.2.4, tweede lid, onder a, van de Wet educatie en beroepsonderwijs][ref1], beroepsopleidingen verzorgd
      kunnen worden.

      2 Bij ministeriële regeling worden op voorstel van de instellingen opleidingsdomeinen BES vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.4
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel7.2.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 7.2.4
  - number: 7.2.4a
    text: |-
      1 Het bevoegd gezag stelt de studieduur van de opleiding vast met inachtneming van de bij of krachtens het tweede
      en derde lid gestelde regels.

      2 De studieduur van de opleiding wordt uitgedrukt in volledige studiejaren of gedeelten daarvan. Eén volledig
      studiejaar heeft een studielast van ten minste 1600 klokuren.

      3 De studieduur bedraagt:

      a. één volledig studiejaar voor de entreeopleiding;

      b. ten minste één en ten hoogste twee volledige studiejaren voor de basisberoepsopleiding;

      c. ten minste twee en ten hoogste drie volledige studiejaren voor de vakopleiding;

      d. drie volledige studiejaren voor de middenkaderopleiding;

      e. één volledig studiejaar voor de specialistenopleiding.

      4 Indien dit in verband met de aard van de opleiding noodzakelijk is, kan Onze Minister bij ministeriële regeling
      bepalen dat voor de middenkaderopleiding een langere studieduur kan worden vastgesteld. Onze Minister geeft daarbij
      de betreffende opleiding aan en het aantal volledige studiejaren of gedeelten daarvan die de studieduur van die
      opleiding ten hoogste mag bedragen.
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel7.2.4a
  - number: 7.2.5
    text: |-
      Indien voor een beroep bij of krachtens een wet, verdrag of bindend besluit van een volkenrechtelijke organisatie,
      vereisten zijn vastgesteld over de kwaliteiten op het gebied van kennis, inzicht, vaardigheden of beroepshoudingen
      waarover degenen die een opleiding gericht op dat beroep voltooien, moeten beschikken, of over de examinering bij
      de desbetreffende beroepsopleiding:

      a. neemt Onze Minister deze vereisten in acht bij de vaststelling van de standaarden, bedoeld in
      [artikel 7.4.5][ref1], en

      b. draagt de instelling er bij het aanbieden van een beroepsopleiding zorg voor dat degenen die deze opleiding
      volgen, ten minste in de gelegenheid zijn aan die vereisten te voldoen, en dat bij de examinering, zo nodig in
      afwijking van [titel 4][ref2] van dit hoofdstuk, aan die vereisten wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7.4.5
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel7.2.5
