  - number: 8.1.8
    text: |-
      1 Het bevoegd gezag doet onverwijld opgave aan het bestuurscollege van het openbaar lichaam waar de betrokkene
      woon- of verblijfplaats heeft van de gegevens van degene:

      a. op wie de [Leerplichtwet BES][ref1] niet meer van toepassing is en die de leeftijd van 25 jaren nog niet heeft
      bereikt,

      b. die niet in het bezit is van een diploma van een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen b tot en met e][ref2], dan wel een diploma voorbereidend wetenschappelijk
      onderwijs of hoger algemeen voortgezet onderwijs als bedoeld in [artikel 2.4][ref3] onderscheidenlijk
      [artikel 2.5 van de Wet voortgezet onderwijs 2020][ref4], en

      c. die:

      1° het onderwijs aan de instelling gedurende een aaneengesloten periode van ten minste een maand of een door het
      bevoegd gezag te bepalen kortere periode zonder geldige reden, waaronder in ieder geval de redenen, bedoeld in
      [artikel 8.1.7, negende lid][ref5], worden verstaan, niet meer volgt, of

      2° bij de instelling wordt in- of uitgeschreven of van de instelling wordt verwijderd.

      2 Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent de toepassing van het eerste lid.

      3 Bij de verwerking van gegevens, bedoeld in dit artikel, wordt het persoonsgebonden nummer BES van de betrokkene
      gebruikt.

      4 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de wijze van de verstrekking van
      gegevens op grond van het eerste lid en wordt een nadere specificatie gegeven van de gegevens die op grond van het
      eerste lid worden verstrekt.

      5 De gegevens die worden verstrekt op grond van het eerste lid kunnen persoonsgegevens als bedoeld in
      [artikel 16 van de Wet bescherming persoonsgegevens BES][ref6] omvatten, met uitzondering van gegevens over ras,
      politieke gezindheid, seksueel leven of het lidmaatschap van een vakvereniging, voor zover deze persoonsgegevens
      noodzakelijk zijn met het oog op de informatieverstrekking over de achtergronden van het verzuim.


