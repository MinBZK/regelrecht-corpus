  - number: 6.2.1
    text: |-
      1 De erkenning van een beroepsopleiding vervalt indien een instelling blijk geeft de erkende beroepsopleiding niet
      meer te verzorgen of indien een instelling gedurende vier jaar een erkende opleiding niet heeft verzorgd.

      2 Onze Minister kan, ten aanzien van een beroepsopleiding in de beroepsopleidende of beroepsbegeleidende leerweg
      die de instelling verzorgt, de in [artikel 1.4.1][ref1] bedoelde erkenning intrekken, indien:

      a. gebleken is dat de kwaliteit van die opleiding ten minste drie maanden onvoldoende is geweest,

      b. niet of niet meer wordt voldaan aan de voorwaarden, bedoeld in [artikel 1.4.1, derde lid][ref2], of aan
      [artikel 1.4.3][ref3].

      3 Een beschikking op grond van het tweede lid houdt in dat ten aanzien van het desbetreffende onderwijs:

      a. de aanspraak op bekostiging, bedoeld in [artikel 2.1.1][ref4], voor zover van toepassing, vervalt,

      b. aan de examens of onderdelen daarvan geen diploma als bedoeld in [artikel 7.4.8][ref5] of certificaat als
      bedoeld in [artikel 7.2.3][ref6] meer is verbonden, en

      c. de registratie in de Registratie instellingen en opleidingen wordt beëindigd.

      4 Onze Minister maakt de ontneming van rechten, bedoeld in dit artikel, openbaar.

      5 Het eerste tot en met vierde lid zijn van overeenkomstige toepassing op een beroepsopleiding in een andere
      leerweg als bedoeld in [artikel 1.4.1, negende lid][ref7].


