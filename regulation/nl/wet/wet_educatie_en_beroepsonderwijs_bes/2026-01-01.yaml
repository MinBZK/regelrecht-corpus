  - number: 1.4.2
    text: |-
      1 Onze Minister kan op aanvraag van het bevoegd gezag een opleiding educatie erkennen.

      2 Erkenning houdt in dat de met goed gevolg afgelegde examens of onderdelen van examens van die opleiding een
      diploma als bedoeld in [artikel 7.4.8][ref1] of certificaat als bedoeld in [artikel 7.2.3][ref2] is verbonden.

      3 Voorwaarde voor erkenning is dat de instelling voor die opleiding in acht neemt [artikel 8.1.1c][ref3],
      [artikel 8.1.2a][ref4] en hetgeen bij of krachtens deze wet is bepaald ten aanzien van:

      a. de kwaliteitszorg, bedoeld in [artikel 1.3.2][ref5],

      b. het onderwijs en de examens, bedoeld in [hoofdstuk 7][ref6], met uitzondering van de [artikelen 7.1.4][ref7]
      en [7.4.7, achtste lid][ref8],

      c. de rechtsbescherming van de deelnemers, bedoeld in [hoofdstuk 7, titel 5][ref9], met uitzondering van de
      [artikelen 7.5.1][ref10], [7.5.5][ref11] en [7.5.6][ref12],

      d. de onderwijsovereenkomst, bedoeld in [artikel 8.1.5, eerste tot en met derde lid][ref13], en

      e. het toezicht door de inspectie.

      4 De aanvraag om erkenning gaat in elk geval vergezeld van een beschrijving van het stelsel van kwaliteitszorg,
      bedoeld in [artikel 1.3.2, tweede lid][ref14] alsmede het ontwerp van de in [artikel 7.4.9][ref15] bedoelde
      onderwijs- en examenregeling van de opleiding.

      5 Onze Minister beslist binnen 3 maanden na de aanvraag.

      6 Het bevoegd gezag verstrekt Onze Minister op diens verzoek de nodige inlichtingen omtrent de instelling.


