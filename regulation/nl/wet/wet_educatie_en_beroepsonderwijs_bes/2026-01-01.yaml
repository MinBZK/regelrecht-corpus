  - number: 4.1.8
    text: |-
      De Rijksvertegenwoordiger voor de openbare lichamen Bonaire, Sint Eustatius en Saba is, in afwijking van
      [artikel 4.1.2, eerste lid][ref1], bevoegd de disciplinaire straf of de schorsing op te leggen dan wel het ontslag
      te verlenen, indien het een directeur, een adjunct-directeur, of een ander lid van het onderwijzend personeel van
      een openbare instelling betreft en deze tevens lid is van de eilandsraad van het openbaar lichaam die de school in
      stand houdt.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel4.1.2
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel4.1.8
