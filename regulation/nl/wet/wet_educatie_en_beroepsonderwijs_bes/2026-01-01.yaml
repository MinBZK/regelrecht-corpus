  - number: 8.1.6b
    text: |-
      1 De ondersteuning bestaat uit financiële ondersteuning indien ondersteuning als bedoeld in
      [artikel 8.1.6a, tweede lid, onderdelen a, b of d,][ref1] wordt verstrekt.

      2 Een student komt uitsluitend in aanmerking voor ondersteuning als bedoeld in
      [artikel 8.1.6a, tweede lid, onderdeel c][ref2], tot en met de maand waarin hij de leeftijd van 18 jaar heeft
      bereikt en indien de student een beroepsopleidende leerweg volgt.

      3 Een student komt uitsluitend in aanmerking voor ondersteuning bij een bijzondere omstandigheid als bedoeld
      in[ artikel 8.1.6a, derde lid, onderdelen a tot en met e][ref3], indien de student een beroepsopleidende leerweg
      volgt en geen aanspraak heeft op studiefinanciering BES in de vorm van prestatiebeurs of gift op grond van de
      [Wet studiefinanciering BES][ref4].


