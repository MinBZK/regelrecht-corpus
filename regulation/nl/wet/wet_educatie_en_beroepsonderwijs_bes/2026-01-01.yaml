  - number: 7.2.7
    text: |-
      1 Van elke opleiding maakt onderricht in de praktijk van het beroep deel uit. De beroepspraktijkvorming kan
      voor een deel plaatsvinden in de periode waarin de student is ingeschreven voor een opleidingsdomein BES of een
      kwalificatiedossier.

      2 De beroepspraktijkvorming wordt verzorgd op grondslag van een overeenkomst inzake de beroepspraktijkvorming,
      gesloten door de in [artikel 7.2.8][ref1] genoemde partijen. De overeenkomst regelt de rechten en verplichtingen
      van partijen en omvat met inachtneming van het dienaangaande bij of krachtens deze wet bepaalde, ten minste
      bepalingen over:

      a. de aanvangsdatum en einddatum van de beroepspraktijkvorming, alsmede het totale aantal te volgen praktijkuren en
      de verdeling daarvan over de studiejaren,

      b. de begeleiding van de student,

      c. dat deel van de kwalificatie dat de student tijdens de beroepspraktijkvorming dient te behalen en de beoordeling
      daarvan, en

      d. de gevallen waarin en de wijze waarop de overeenkomst voortijdig kan worden ontbonden.

      3 Het bedrijf dat of de organisatie die de beroepspraktijkvorming verzorgt, draagt zorg voor de begeleiding van
      de studenten binnen het bedrijf. Het bevoegd gezag beoordeelt of de student het in het tweede lid, onderdeel c,
      bedoelde deel van de kwalificatie heeft behaald. Het bevoegd gezag betrekt bij die beoordeling het oordeel van het
      bedrijf onderscheidenlijk de organisatie, met inachtneming van de desbetreffende in de onderwijs- en examenregeling
      op te nemen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7.2.8
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel7.2.7
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: 7.2.8
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.8
    text: |-
      1 Het bevoegd gezag draagt zorg voor de totstandkoming van de in [artikel 7.2.7][ref1] bedoelde overeenkomst.
      De overeenkomst wordt gesloten door de instelling, de student en het bedrijf dat of de organisatie die de
      beroepspraktijkvorming verzorgt. De overeenkomst wordt voor zover het de beroepsbegeleidende leerweg betreft, mede
      ondertekend door de raad, die daarmee verklaart:

      a. dat het een bedrijf of organisatie betreft met een gunstige beoordeling als bedoeld in [artikel 7.2.9][ref2], en

      b. dat de gronden voor deze gunstige beoordeling nog steeds aanwezig zijn.

      2 Indien het bevoegd gezag en de raad na het sluiten van de in [artikel 7.2.7][ref3] bedoelde overeenkomst
      vaststellen dat de praktijkplaats niet of niet volledig beschikbaar is, de begeleiding tekortschiet of ontbreekt,
      het bedrijf of de organisatie niet langer beschikt over een gunstige beoordeling als bedoeld in het eerste lid,
      of sprake is van andere omstandigheden die maken dat de beroepspraktijkvorming niet naar behoren zal kunnen
      plaatsvinden, bevordert het bevoegd gezag, na overleg met de raad, dat een toereikende vervangende voorziening
      beschikbaar wordt gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7.2.7
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel7.2.9
      [ref3]: https://wetten.overheid.nl/BWBR0028395#Artikel7.2.7
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel7.2.8
    references:
