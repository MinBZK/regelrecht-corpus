        artikel: 1.1.1
        hoofdstuk: '1'
  - number: 1.3.2a
    text: |-
      Het bevoegd gezag draagt zorg voor het personeelsbeleid, voor zover het betreft de duurzame borging van de
      kwaliteit van het onderwijspersoneel.
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel1.3.2a
  - number: 1.3.3
    text: |-
      1 Het openbaar onderwijs draagt bij aan de ontwikkeling van de studenten en vavo-studenten met aandacht voor de
      godsdienstige, levensbeschouwelijke en maatschappelijke waarden zoals die leven in de Nederlandse samenleving en de
      Caribische regio en met onderkenning van de betekenis van de verscheidenheid van die waarden.

      2 Openbaar onderwijs wordt gegeven met eerbiediging van ieders godsdienst of levensovertuiging.
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel1.3.3
  - number: 1.3.4
    text: |-
      1 Een instelling kan in stand gehouden worden door:

      a. een natuurlijke persoon, of

      b. een rechtspersoon met volledige rechtsbevoegdheid.

      2 Een rechtspersoon die een instelling in stand kan houden kan zijn:

      a. een openbaar lichaam of een door een openbaar lichaam ingestelde openbare rechtspersoon, dan wel

      b. een privaatrechtelijke rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel1.3.4
  - number: 1.3.5
    text: |-
      1 Indien het bevoegd gezag op enigerlei wijze bekend is geworden dat een ten behoeve van zijn instelling met
      taken belast persoon zich mogelijk schuldig maakt of heeft gemaakt aan een misdrijf tegen de zeden als bedoeld in
      het [Tweede Boek, titel XIV, van het Wetboek van Strafrecht BES][ref1] jegens een minderjarige student of vavo-
      student van de instelling, treedt het bevoegd gezag onverwijld in overleg met de vertrouwensinspecteur, bedoeld in
      [artikel 6 van de Wet op het onderwijstoezicht][ref2].

      2 Indien uit het overleg, bedoeld in het eerste lid, moet worden geconcludeerd dat er sprake is van een redelijk
      vermoeden dat de desbetreffende persoon zich schuldig heeft gemaakt aan een misdrijf als bedoeld in het eerste
      lid jegens een minderjarige student of vavo-student van de instelling, doet het bevoegd gezag onverwijld aangifte
      bij een opsporingsambtenaar als bedoeld in [artikel 1 van het Wetboek van Strafvordering BES][ref3], en stelt het
      bevoegd gezag de vertrouwensinspecteur daarvan onverwijld in kennis. Voordat het bevoegd gezag overgaat tot het
      doen van aangifte, stelt het de ouders van de betrokken student of vavo-student, onderscheidenlijk de betreffende
      ten behoeve van de instelling met taken belaste persoon, hiervan op de hoogte.

      3 Indien een personeelslid bekend is geworden dat een ten behoeve van de instelling met taken belast persoon zich
      mogelijk schuldig maakt of heeft gemaakt aan een misdrijf als bedoeld in het eerste lid jegens een minderjarige
      student of vavo-student van de instelling, stelt het personeelslid het bevoegd gezag daarvan onverwijld in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0028570
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel1
