    text: |-
      Onverminderd het overigens bij of krachtens de wet bepaalde omtrent het gebruik van het persoonsgebonden nummer BES
      door het openbaar lichaam, gebruikt het openbaar lichaam het persoonsgebonden nummer BES van een leerplichtige en
      kwalificatieplichtige deelnemer of een persoon als bedoeld in [artikel 8.1.8, eerste lid][ref1], uitsluitend ten
      behoeve van:

      a. het toezicht op de naleving van de [Leerplichtwet BES][ref2];

      b. de uitvoering van de [Wet sociale kanstrajecten jongeren BES][ref3];

      c. de verwerking van de gegevens, bedoeld in [artikel 21, eerste en derde lid, van de Wet register
      onderwijsdeelnemers](onbekend).


