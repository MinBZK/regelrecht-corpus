  - number: 8.1.7
    text: |-
      1 Het bevoegd gezag stelt van iedere aan de instelling ingeschreven student die valt onder de werking van de
      [Wet studiefinanciering BES][ref1] vast, of deze student gedurende een aaneengesloten periode van ten minste 5
      weken zonder geldige reden niet aan het onderwijs heeft deelgenomen. In afwijking van de vorige volzin kan Onze
      Minister bepalen dat voor soorten van onderwijs als bedoeld in deze wet, de in die volzin bedoelde vaststelling
      wordt gedaan indien een ingeschreven student in een of meer vakken niet aan het onderwijs heeft deelgenomen.

      2 Het bevoegd gezag meldt uiterlijk op de derde werkdag na afloop van een periode van afwezigheid van 5 weken
      aan de student dat daarvan in de administratie van de instelling aantekening is gemaakt en verzoekt de student om
      opgaaf van de reden van de afwezigheid.

      3 Uiterlijk op de vijfde werkdag na de periode van 8 weken stelt het bevoegd gezag vast:

      a. of de reden die de student binnen 8 weken na de aanvang van de periode van 5 weken gaf voor zijn afwezigheid,
      een geldige is, of

      b. dat de student binnen 8 weken na de aanvang van de periode van 5 weken geen reden heeft opgegeven voor zijn
      afwezigheid.

      4 Het bevoegd gezag stelt tevens uiterlijk op de vijfde werkdag na afloop van de periode van 8 weken vast of de
      student voor het einde van die periode weer aan het onderwijs is gaan deelnemen.

      5 Het bevoegd gezag meldt uiterlijk de vijfde werkdag na afloop van een periode van 8 weken aan Onze Minister de
      student die gedurende een aaneengesloten periode van ten minste 5 weken zonder opgave van geldige reden niet aan
      het onderwijs heeft deelgenomen. Tevens meldt het indien die student voor het einde van de periode van 8 weken weer
      aan het onderwijs is gaan deelnemen de datum ervan.

      6 De periode van 5 weken en de periode van 8 weken worden verlengd met de weken waarin vanwege vakantie geen
      onderwijs werd verzorgd. Zij wordt geacht niet te zijn onderbroken door deze vakantieweken.

      7 Het bevoegd gezag stuurt gelijktijdig met de mededelingen, bedoeld in het vijfde lid, een afschrift van de
      gegevens die over de betrokken student aan Onze Minister zijn verstrekt aan deze betrokkene. Het bevoegd gezag
      geeft daarbij tevens aan dat afwezigheid als bedoeld in het eerste lid, gevolgen heeft voor de studiefinanciering
      van betrokkene op grond van de [Wet studiefinanciering BES][ref2], alsmede welke beroepsgang voor betrokkene tegen
      de mededeling, bedoeld in het vijfde lid, open staat.

      8 Indien het bevoegd gezag aan Onze Minister de in het vijfde lid bedoelde mededeling heeft gedaan, kan de student
      binnen 6 weken na ontvangst van de gegevens, bedoeld in het zevende lid, bij het bevoegd gezag schriftelijk
      bedenkingen uiten tegen die mededeling.

      9 Onder afwezigheid met een geldige reden als bedoeld in het eerste lid wordt verstaan afwezigheid wegens:

      a. ziekte van de student, welke ziekte uitsluitend kan worden aangetoond door middel van een gedagtekende
      verklaring van een arts,

      b. zwangerschap of bevalling van de student, welke uitsluitend kan worden aangetoond door middel van een
      schriftelijke verklaring van een arts of verloskundige, gedurende een periode van 16 weken die, indien de student
      dat wenst, 6 weken voor de dag na de vermoedelijke datum van bevalling ingaat of gedurende een periode van 20 weken
      die, indien de student dat wenst, 10 weken voor de dag na de vermoedelijke datum van bevalling ingaat indien het
      een zwangerschap van meer dan één kind betreft, of

      c. bijzondere familieomstandigheden.

      10 Het bevoegd gezag kan bepalen dat de periode, bedoeld in het negende lid, onderdeel b, wordt verlengd als dit
      naar zijn oordeel passend is.

      11 Onder «student» als bedoeld in het vijfde en zevende lid wordt verstaan de student die een assistentopleiding of
      een basisberoepsopleiding volgt als bedoeld in [artikel 7.2.2, eerste lid, onderdelen a of b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028393
      [ref2]: https://wetten.overheid.nl/BWBR0028393
      [ref3]: https://wetten.overheid.nl/BWBR0028395#Artikel7.2.2
