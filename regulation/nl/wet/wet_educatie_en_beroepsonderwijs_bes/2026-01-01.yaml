  - number: 4.2.2
    text: |-
      1 Onderwijsondersteunende werkzaamheden waarvoor op grond van [artikel 4.2.3, tweede lid][ref1], bekwaamheidseisen
      zijn vastgesteld, mogen slechts worden verricht door degene die:

      a. in het bezit is van een verklaring omtrent het gedrag, afgegeven ingevolge de
      [Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag BES][ref2], die op het tijdstip van
      overlegging aan het bevoegd gezag niet ouder is dan 6 maanden, en

      b. in het bezit is van een bij ministeriële regeling aangewezen getuigschrift waaruit blijkt dat wordt voldaan aan
      de in [artikel 4.2.3, tweede lid][ref3], bedoelde bekwaamheidseisen, voor zover vastgesteld, of

      c. in het bezit is van een ten aanzien van de door hem te verrichten werkzaamheden, al dan niet bedoeld
      in [artikel 4.2.3, tweede lid][ref4] artikel, verleende erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref5], of

      d. volgens bij algemene maatregel van bestuur te geven regels zijn bekwaamheid heeft aangetoond, en

      e. niet krachtens rechterlijke uitspraak is uitgesloten van het verrichten van die werkzaamheden.

      2 Het eerste lid is niet van toepassing op een onderwijsondersteunende functionaris voor zover deze is belast met
      werkzaamheden in verband met contractactiviteiten.

      3 Ten aanzien van ho-studenten aan een opleiding als bedoeld in
      [artikel 7.7, tweede lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref6] en studenten aan
      de beroepsbegeleidende leerweg van een opleiding als bedoeld in [artikel 7.2.2][ref7] die in het kader van die
      opleiding onderwijsondersteunende werkzaamheden verrichten waarvoor op grond van [artikel 4.2.3, tweede lid][ref8],
      bekwaamheidseisen zijn vastgesteld, kan voor de duur van die werkzaamheden worden afgeweken van het eerste lid,
      onder b tot en met d.

      4 Het bevoegd gezag kan voor een periode van ten hoogste twee jaar afwijken van de eisen, bedoeld in het eerste
      lid, onder b tot en met d. Het bevoegd gezag kan deze periode met ten hoogste de helft verlengen indien bijzondere
      omstandigheden daartoe naar zijn oordeel aanleiding geven. Het bevoegd gezag beschikt over geordende gegevens met
      betrekking tot de toepassing van de tweede volzin.


