  - number: 8.0.1
    text: |-
      1 Uiterlijk op 1 april voorafgaand aan een studiejaar meldt degene die zich als deelnemer wenst in te inschrijven
      voor een beroepsopleiding die start bij de aanvang van dat studiejaar, zich aan bij de desbetreffende instelling.
      Na de aanmelding kan de betrokkene zijn aanmelding nog wijzigen.

      2 Bij ministeriële regeling kan een maximum aantal beroepsopleidingen worden vastgesteld waarvoor de betrokkene
      zich kan aanmelden.

      3 Dit artikel is niet van toepassing op een deelnemer die zich aanmeldt bij een andere beroepsopleiding dan die
      waar hij oorspronkelijk was ingeschreven maar kan aantonen dat de aanmelding het gevolg is van een beëindiging
      van de inschrijving op grond van [artikel 8.1.7a][ref1], op een zodanig tijdstip dat hij zich niet kon aanmelden
      uiterlijk 1 april voorafgaand aan het studiejaar waarvoor hij zich wenst in te schrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel8.1.7a
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel8.0.1
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: 8.1.7a
        hoofdstuk: '8'
  - number: 8.0.2
    text: |-
      1 Bij de aanmelding, bedoeld in [artikel 8.0.1][ref1], legt de betrokkene of, indien deze minderjarig is,
      zijn ouders, voogden of verzorgers, zijn persoonsgebonden nummer BES over onder vermelding van, voor zover van
      toepassing, de school of instelling waar betrokkene op het moment van aanmelding staat ingeschreven.

      2 Het persoonsgebonden nummer BES wordt overgelegd door middel van een van overheidswege verstrekt document, waarop
      tevens de gegevens over de geslachtsnaam, voorletters, geboortedatum en het geslacht van betrokkene zijn vermeld.

      3 Indien aannemelijk kan worden gemaakt dat geen persoonsgebonden nummer BES kan worden overgelegd, worden in
      plaats daarvan de geslachtsnaam, de voorletters, de geboortedatum en het geslacht van betrokkene vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel8.0.1
