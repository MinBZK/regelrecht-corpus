  - number: 8.6.1
    text: |-
      Een samenwerkingscollege wordt gevormd op grondslag van een schriftelijke overeenkomst tussen de bevoegde
      gezagsorganen van de samenwerkende instellingen, waarbij in ieder geval afspraken zijn gemaakt over:

      a. de beroepsopleidingen, waaronder de soorten leerwegen, dan wel de opleidingen voortgezet algemeen
      volwassenenonderwijs die in het samenwerkingscollege worden verzorgd, het onderwijsprogramma en de examinering van
      de desbetreffende opleidingen;

      b. de leiding van het samenwerkingscollege, waaronder de samenstelling, de wijze van benoeming en de taken en
      bevoegdheden die namens de deelnemende instellingen zijn opgedragen aan die leiding;

      c. de wijze waarop de leiding van het samenwerkingscollege inlichtingen verstrekt en verantwoording aflegt aan de
      bevoegde gezagsorganen van de deelnemende instellingen;

      d. de organisatorische en onderwijskundige inrichting van het samenwerkingscollege, waaronder de inzet van
      personeel en het gebruik van faciliteiten van de deelnemende instellingen;

      e. de toerekening van baten en lasten;

      f. de wijze van geschillenbeslechting tussen de deelnemende instellingen over de uitvoering van de overeenkomst, en

      g. de voorwaarden waaronder een andere instelling partij kan worden bij de samenwerkingsovereenkomst, de
      overeenkomst kan worden opgezegd of ontbonden alsmede de wijze waarop de overeenkomst overigens kan worden
      gewijzigd, telkens met oog voor het zoveel mogelijk beperken van de gevolgen voor de deelnemers.
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel8.6.1
  - number: 8.6.2
    text: |-
      1 Een instelling kan een of meer beroepsopleidingen of opleidingen voortgezet algemeen volwassenenonderwijs
      verzorgen binnen een samenwerkingscollege, zolang niet meer dan 40% van haar ingeschreven deelnemers onderwijs
      volgt in zo’n college.

      2 Een instelling die de grens nadert, bedoeld in het eerste lid, doet daarvan onverwijld schriftelijk melding aan
      Onze Minister.

      3 De verplichting, bedoeld in het tweede lid, is ook van toepassing op een instelling die voornemens is de
      samenwerking op te zeggen.
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel8.6.2
  - number: 8.6.3
    text: |-
      1 De onderwijs- en examenregeling, bedoeld in [artikel 7.4.9][ref1], is gelijkluidend voor iedere deelnemer die een
      beroepsopleiding of opleiding voortgezet algemeen volwassenenonderwijs volgt aan een samenwerkingscollege, ongeacht
      de instelling waar hij is ingeschreven.

      2 De bevoegde gezagsorganen van de deelnemende instellingen wijzen één examencommissie als bedoeld in
      [artikel 7.4.7][ref2] aan of stellen gezamenlijk een examencommissie in voor de examinering van opleidingen die in
      een samenwerkingscollege worden verzorgd.

      3 Er is slechts een commissie van beroep voor de examens als bedoeld in [artikel 7.5.1][ref3] bevoegd voor de
      beoordeling van examenbeslissingen omtrent deelnemers aan een samenwerkingscollege.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7.4.9
