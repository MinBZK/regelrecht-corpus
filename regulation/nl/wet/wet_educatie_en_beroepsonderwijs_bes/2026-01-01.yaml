  - number: 1.2.1
    text: |-
      1 Educatie is gericht op de bevordering van de persoonlijke ontplooiing ten dienste van het maatschappelijk
      functioneren van volwassenen door de ontwikkeling van kennis, inzicht, vaardigheden en houdingen op een wijze die
      aansluit bij hun behoeften, mogelijkheden en ervaringen alsmede bij maatschappelijke behoeften. Waar mogelijk sluit
      de educatie aan op het ingangsniveau van het beroepsonderwijs. Educatie omvat niet activiteiten op het niveau van
      het hoger onderwijs.

      2 Beroepsonderwijs is gericht op de theoretische en praktische voorbereiding voor de uitoefening van beroepen
      waarvoor een beroepskwalificerende opleiding is vereist of dienstig kan zijn. Het beroepsonderwijs bevordert
      tevens de algemene vorming en de persoonlijke ontplooiing van de studenten en draagt bij tot het maatschappelijk
      functioneren. Beroepsonderwijs sluit aan op het voorbereidend beroepsonderwijs en het algemeen voortgezet
      onderwijs. Beroepsonderwijs omvat niet het hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel1.2.1
  - number: 1.3.1
    text: |-
      Bij de uitvoering van hun taak dragen de instellingen, onverminderd het bij of krachtens deze wet bepaalde, mede
      zorg voor:

      a. de toegankelijkheid van het onderwijs, in het bijzonder voor kansarme groepen,

      b. het aanbieden van doelmatige leerwegen, in het bijzonder door het zorg dragen voor een zorgvuldige afstemming
      tussen opleidingen educatie en beroepsopleidingen,

      c. het bieden van mogelijkheden voor loopbaanoriëntatie,

      d. het bieden van mogelijkheden voor loopbaanbegeleiding gedurende de inschrijving en na diplomering,

      e. de afstemming op de ontwikkelingen in de samenleving op nationaal en internationaal gebied in het algemeen en
      ten aanzien van de arbeidsmarkt in het bijzonder.
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel1.3.1
  - number: 1.3.2
    text: |-
      1 Het bevoegd gezag draagt er zorg voor dat het onderwijs van voldoende kwaliteit is. Een instelling verricht geen
      nevenwerkzaamheden die de beroepsopleiding of de opleiding educatie schaden.

      2 Het bevoegd gezag richt een stelsel van kwaliteitszorg voor de instelling in en draagt er in dat verband zorg
      voor dat, zo veel mogelijk in samenwerking met andere instellingen, wordt voorzien in een regelmatige beoordeling
      van de kwaliteit van het onderwijs, waaronder maatregelen en instrumenten om te waarborgen dat het personeel zijn
      bekwaamheid onderhoudt. Het bevoegd gezag draagt er zorg voor dat de in de eerste volzin van dit lid bedoelde
      beoordeling geschiedt met betrokkenheid van onafhankelijke belanghebbenden en deskundigen, niet zijnde de
      deskundigen, bedoeld in [artikel 1.1.1][ref1]. De uitkomsten van de beoordeling zijn openbaar.

      3 Het bevoegd gezag maakt regelmatig, en voor zover het de examens betreft jaarlijks, een verslag openbaar omtrent:

      a. de beoordeling, bedoeld in het tweede lid,

      b. de uitkomsten van die beoordeling, en

      c. het voorgenomen beleid in het licht van die uitkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel1.1.1
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel1.3.2
    references:
