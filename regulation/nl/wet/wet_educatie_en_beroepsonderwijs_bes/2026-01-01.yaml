  - number: 7.4.9
    text: |-
      1 Het bevoegd gezag stelt voor elke door de instelling verzorgde opleiding of opleiding educatie een onderwijs- en
      examenregeling vast. De onderwijs- en examenregeling wordt vastgesteld vóór 1 mei voorafgaand aan het studiejaar en
      omvat, voor zover van toepassing, ten minste:

      a. de onderwijs- en vormingsdoelen, daaronder begrepen de eindtermen,

      b. de onderwijseenheden die deel uitmaken van de opleiding,

      c. de inhoud en inrichting van een opleiding, waaronder voor een beroepsopleiding begrepen:

      1°. de leerweg,

      2°. de kwalificatie, of, bij inschrijving voor een opleidingsdomein of een kwalificatiedossier, dat
      opleidingsdomein of dat kwalificatiedossier,

      3°. het beoogde niveau van de te behalen kwalificatie, en

      4°. de studieduur van de opleiding en van de daarvan deel uitmakende onderwijseenheden en deelkwalificaties,

      d. de inhoud en, in voorkomende gevallen, de indeling in onderdelen van het examen,

      e. de studieduur van de opleiding en van de daarvan deel uitmakende onderwijseenheden en deelkwalificaties,

      f. in voorkomende gevallen de volgorde waarin, de tijdvakken waarbinnen en het aantal malen per studiejaar dat
      gelegenheid wordt geboden tot het afleggen van de toetsen, het examen of onderdelen daarvan,

      g. de wijze waarop de toetsen en het examen of onderdelen daarvan worden afgenomen,

      h. de wijze waarop het bevoegd gezag zijn aandeel in het eilandelijk zorgplan, bedoeld in [artikel 3.3][ref1],
      vorm geeft,

      i. waar nodig, dat het met goed gevolg afleggen van een of meer toetsen of examenonderdelen voorwaarde is voor het
      afleggen van andere toetsen of onderdelen,

      j. de wijze waarop en de termijn waarbinnen de student inzage verkrijgt in zijn beoordeelde schriftelijk werk,

      k. de termijn waarbinnen de uitslag van een toets, examenonderdeel en examen bekend wordt gemaakt,

      l. de van toepassing zijnde instructietaal, en

      m. de gronden waarop de examencommissie vrijstelling kan verlenen van een instellingsexamen of een centraal examen.

      2 De examencommissie stelt, met inachtneming van de onderwijs- en examenregeling, regels vast met betrekking
      tot de goede gang van zaken tijdens het afnemen van de toetsen, het examen of de examenonderdelen. Zij kan
      aan examinatoren richtlijnen en aanwijzingen geven met betrekking tot de beoordeling en met betrekking tot de
      vaststelling van de uitslag.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel3.3
