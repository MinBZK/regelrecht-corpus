  - number: 1.5.1
    text: |-
      1 Onze Minister stelt voor een openbaar lichaam of voor een combinatie van openbare lichamen een Raad onderwijs
      arbeidsmarkt in.

      2 De raad is een rechtspersoon met volledige rechtsbevoegdheid.

      3 De raad heeft een bestuur bestaande uit vertegenwoordigers van werkgeversorganisaties, uit vertegenwoordigers van
      werknemersorganisaties en uit vertegenwoordigers van de instellingen.

      4 Onze Minister kan de raad subsidiëren voor de uitoefening van zijn taken.

      5 Voor zover het vierde lid van toepassing is, zijn [titel 4.1][ref1]
      en [4.2 van de Algemene wet bestuursrecht][ref2] en de
      [artikelen 4 tot en met 19 van de Wet overige OCW-subsidies][ref3] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537
      [ref3]: https://wetten.overheid.nl/BWBR0009458#Artikel4
