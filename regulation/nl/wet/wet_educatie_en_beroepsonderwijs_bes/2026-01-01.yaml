    text: |-
      1 Het bevoegd gezag kan een beroepsopleiding ten aanzien waarvan een erkenning is verkregen op grond van
      [artikel 1.4.1][ref1] een doorlopende leerroute vmbo-mbo of de geïntegreerde route vmbo-basisberoepsopleiding als
      bedoeld in [artikel 2.107l van de Wet voortgezet onderwijs 2020](onbekend) aanbieden.

      2 Toepassing van het eerste lid berust op een samenwerkingsovereenkomst, gesloten tussen
      het bevoegd gezag, bedoeld in het eerste lid, en het bevoegd gezag van een ingevolgde
      [artikel 2.66 van de Wet voortgezet onderwijs 2020][ref2] aangewezen school.

      3 De [artikelen 8.4.3][ref3], [8.4a.2][ref4], [8.4a.3, met uitzondering van het tweede lid][ref5]
      wat betreft [artikel 2.107b, tweede lid, onderdeel e, van de Wet voortgezet onderwijs 2020]
      (onbekend), [8.4a.4 tot en met 8.4a.7][ref6], [8.4a.8, eerste en tweede lid][ref7], [8.4a.9][ref8],
      [8.4a.11][ref9], [8.4a.12][ref10], [8.4a.14][ref11] en [8.4a.16][ref12] zijn van overeenkomstige
      toepassing, met dien verstande dat voor «school» telkens wordt gelezen «school aangewezen ingevolge
      [artikel 2.66 van de Wet voortgezet onderwijs 2020][ref13]».


