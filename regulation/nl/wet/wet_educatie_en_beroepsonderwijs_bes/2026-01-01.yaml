  - number: '10.2'
    text: |-
      1 Indien het bevoegd gezag in strijd handelt met het bepaalde bij of krachtens deze wet of een aanwijzing als
      bedoeld in [artikel 10.1][ref1] of een spoedaanwijzing als bedoeld in [artikel 10.1a][ref2] niet opvolgt, kan Onze
      Minister de rijksbijdrage, voorschotten daaronder begrepen, geheel of gedeeltelijk inhouden dan wel opschorten.

      2 Het eerste lid is van overeenkomstige toepassing, indien het bevoegd gezag of het personeel van een school
      de inspectie bij de uitoefening van zijn bevoegdheden niet alle medewerking heeft verleend die de inspectie
      redelijkerwijs kan vorderen binnen een door hem gestelde redelijke termijn. Zij die uit hoofde van ambt, beroep of
      wettelijk voorschrift verplicht zijn tot geheimhouding, kunnen het verlenen van medewerking weigeren, voor zover
      dit uit hun geheimhoudingsplicht voorvloeit.

      3 Onze Minister kan de rijksbijdrage wederom toekennen, indien blijkt dat de reden voor de toepassing van het
      eerste of tweede lid is vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel10.1
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel10.1a
