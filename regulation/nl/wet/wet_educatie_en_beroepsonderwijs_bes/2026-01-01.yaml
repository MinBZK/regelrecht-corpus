      [artikel 6.2.2, tweede lid, onderdeel a en b][ref2], en [artikel 6.2.4, eerste lid][ref3] kan Onze Minister op
      verzoek van het bevoegd gezag of uit eigen beweging in overeenstemming met het bevoegd gezag maatregelen treffen.

      2 Tot de maatregelen, bedoeld in het eerste lid, behoort de mogelijkheid het bestuur van de instelling te laten
