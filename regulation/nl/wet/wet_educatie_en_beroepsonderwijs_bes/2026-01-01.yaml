        artikel: '1.1'
  - number: 2.2.3
    text: |-
      1 Onze Minister kan aan de rijksbijdrage, berekend op grond van [artikel 2.2.2][ref1], een bedrag toevoegen in
      verband met:

      a. bijzondere omstandigheden die in redelijkheid niet door de instelling binnen de rijksbijdrage voor het
      betreffende bekostigingsjaar of binnen de normale bedrijfsvoering kunnen worden opgevangen; of

      b. de ontwikkelingen van het bestel van het beroepsonderwijs op de onderscheiden openbare lichamen.

      2 Het bedrag bedoeld in het eerste lid, onderdeel a, kan op de rijksbijdrage van een later jaar geheel of
      gedeeltelijk in mindering worden gebracht. Indien dat het geval is wordt dit vermeld in de beschikking en wordt in
      die beschikking tevens de hoogte vermeld van het bedrag dat in mindering zal worden gebracht of de criteria voor de
      bepaling van dat bedrag.

      3 Bij ministeriële regeling kunnen voorschriften worden gegeven voor de verstrekking bedoeld in het eerste lid,
      onderdeel b.

      4 Onze Minister kan een bekostigingsplafond instellen. In dat geval worden bij ministeriële regeling regels omtrent
      de verdeling vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel2.2.2
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: 2.2.2
        hoofdstuk: '2'
  - number: 2.2.3a
    text: |-
      Bij het bepalen van de hoogte van de bekostiging, bedoeld in [artikel 2.2.2][ref1], gaat Onze Minister volgens
      daarover bij of krachtens algemene maatregel van bestuur gestelde regels, uit van het aantal studenten op 1 oktober
      van het jaar voorafgaand aan het jaar waarop de bekostiging betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel2.2.2
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel2.2.3a
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: 2.2.2
        hoofdstuk: '2'
  - number: 2.2.4
    text: |-
      1 Op de rijksbijdrage, bedoeld in [artikel 2.2.1][ref1] kan volgens bij of krachtens algemene maatregel van bestuur
      te stellen regels een bedrag in mindering worden gebracht in verband met de kosten waarop aanspraak wordt gemaakt
      door personeel dat is benoemd met voorbijgaan van:

      a. personeel dat een gelijksoortige functie uitoefent aan een instelling van het bevoegd gezag, of

      b. personeel dat een gelijksoortige functie heeft uitgeoefend aan een instelling van het bevoegd gezag, en

      1°. in het genot is van wachtgeld, of

      2°. van een andere ontslaguitkering en direct aan die ontslaguitkering voorafgaand langer dan een jaar onafgebroken
      in dienst is geweest van het bevoegd gezag.

      2 Voor de toepassing van het eerste lid wordt, indien het betreft openbaar onderwijs, onder «instelling van het
      bevoegd gezag» verstaan elke binnen het desbetreffende openbaar lichaam gelegen instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel2.2.1
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel2.2.4
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: 2.2.1
        hoofdstuk: '2'
  - number: 2.2.5
    text: |-
      1 Onze Minister maakt aan elke instelling jaarlijks in december bekend welke rijksbijdrage voor het daarop volgende
      kalenderjaar wordt verstrekt. Hij deelt daarbij mee op welke wijze de rijksbijdrage is berekend en vermeldt daarbij
      afzonderlijk het bedrag voor de entreeopleiding, bedoeld in [artikel 7.2.2, eerste lid, onder a][ref1].

      2 De rijksbijdrage wordt betaald volgens een door Onze Minister te bepalen kasritme.

      3 Zolang de rijksbijdrage niet is vastgesteld of nader vastgesteld, wordt daarop door Onze Minister een voorschot
      betaald. Het tweede lid is van overeenkomstige toepassing.

      4 Bij of krachtens algemene maatregel van bestuur worden nadere voorschriften gegeven met betrekking tot de
      uitvoering van deze paragraaf. Deze voorschriften hebben in elk geval betrekking op aard, inrichting en wijze van
      verstrekking van gegevens met betrekking tot de studenten.

      5 De in het vierde lid bedoelde gegevens die op enigerlei wijze een rol spelen in de berekeningswijze, bedoeld
      in [artikel 2.2.2][ref2], gaan vergezeld van een verklaring omtrent de getrouwheid, afgegeven door een door
      het bevoegd gezag aangewezen deskundige. Deze gegevens en de verklaring worden ingediend voor een bij algemene
      maatregel van bestuur te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel2.2.2
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel2.2.5
