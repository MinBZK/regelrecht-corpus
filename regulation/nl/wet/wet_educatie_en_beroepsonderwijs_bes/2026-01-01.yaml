  - number: 6.2.2
    text: |-
      1 De erkenning van een opleiding educatie vervalt indien een instelling blijk geeft de erkende opleiding educatie
      niet meer te verzorgen of indien een instelling gedurende vier jaar een erkende opleiding niet heeft verzorgd.

      2 Onze Minister kan, ten aanzien van een opleiding educatie die de instelling verzorgt, de in [artikel 1.4.2][ref1]
      bedoelde erkenning intrekken, indien:

      a. gebleken is dat de kwaliteit van die opleiding onvoldoende is, of

      b. niet of niet meer wordt voldaan aan de voorwaarden, bedoeld in [artikel 1.4.2, derde lid][ref2].

      3 Een beschikking op grond van het tweede lid houdt in dat ten aanzien van het desbetreffende onderwijs aan de
      examens of onderdelen daarvan geen diploma als bedoeld in [artikel 7.4.8][ref3] of certificaat als bedoeld in
      [artikel 7.2.3][ref4] meer is verbonden.

      4 Voordat Onze Minister een besluit neemt op grond van het tweede lid, onderdeel a, geeft hij aan het bevoegd gezag
      een waarschuwing op grond van zijn bevindingen ten aanzien van de kwaliteit van de opleiding. Onze Minister geeft
      pas toepassing aan het tweede lid, onderdeel a, nadat:

      a. de waarschuwing ten minste een jaar verstreken is, en

      b. Onze Minister aan de hand van een nader onderzoek tot het oordeel is gekomen dat niet of niet in voldoende mate
      gevolg is gegeven aan de waarschuwing.

      5 Voordat Onze Minister een besluit neemt op grond van het tweede lid, onderdeel b, geeft hij aan het bevoegd
      gezag een waarschuwing, onder bepaling van een termijn waarbinnen aan die waarschuwing gevolg moet zijn gegeven en
      desgewenst overleg met hem dienaangaande plaats kan vinden. De termijn waarbinnen aan de waarschuwing gevolg moet
      zijn gegeven, bedraagt ten minste drie maanden.

      6 Onze Minister maakt de ontneming van rechten en de waarschuwing openbaar.


