  - number: 11.6c
    text: |-
      De student die in het studiejaar voorafgaand aan het tijdstip van inwerkingtreding van dit artikel stond
      ingeschreven voor een beroepsopleiding wordt door het bevoegd gezag in de gelegenheid gesteld deze opleiding
      te voltooien uiterlijk in het studiejaar volgend op het studiejaar waarin de voor hem geldende studieduur is
      verstreken. Hierop zijn de [artikelen 7.2.2, eerste tot en met derde lid][ref1], en [7.2.6][ref2] van toepassing
      zoals die artikelen luidden vóór dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel7.2.6
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel11.6c
