  - number: 7.4.11
    text: |-
      Het bevoegd gezag maakt voor de aanvang van het studiejaar een studiegids openbaar. De studiegids maakt het
      de aanstaande student mogelijk, zich een goed beeld te vormen van de inhoud en inrichting van het onderwijs
      en de examens aan de instelling en omvat in elk geval de onderwijs- en examenregeling van de onderscheiden
      beroepsopleidingen en opleidingen educatie.
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel7.4.11
  - number: 7.4.12
    text: |-
      Deze paragraaf is van toepassing op opleidingen voortgezet algemeen volwassenenonderwijs en de opleidingen
      Nederlands als vreemde taal.
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel7.4.12
  - number: 7.4.13
    text: |-
      1 Aan de vavo-studenten en deelnemers wordt gelegenheid gegeven een examen af te leggen.

      2 [Artikel 7.4.7][ref1] is van overeenkomstige toepassing.

      3 Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden vastgesteld omtrent de examens
      van de opleidingen voortgezet algemeen volwassenenonderwijs en Nederlands als vreemde taal, bedoeld in
      [artikel 7.3.1, eerste lid, onder c][ref2]. Bij deze algemene maatregel van bestuur kunnen tevens voorschriften
      worden gegeven omtrent de examenprogramma's en de verdeling daarvan in onderdelen.

      4 Ten behoeve van de bijzondere inrichting van het onderwijs aan een instelling kan Onze Minister toestaan dat
      wordt afgeweken van het bepaalde bij of krachtens het tweede en derde lid. Onze Minister besluit binnen zes
      maanden na ontvangst van een aanvraag. Indien de beschikking niet binnen zes maanden kan worden gegeven, stelt Onze
      Minister de aanvrager daarvan in kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan
      worden gezien.

      5 [Artikel 7.4.8][ref3] is van toepassing, met dien verstande dat degene die een onderdeel van het examen
      Nederlands als vreemde taal met goed gevolg heeft afgelegd een certificaat ontvangt. Bij of krachtens algemene
      maatregel van bestuur wordt bepaald onder welke voorwaarden het bezit van certificaten aanspraak geeft op een
      diploma.

      6 [Artikelen 7.4.9][ref4] en [7.5.2][ref5] is van overeenkomstige toepassing.

      7 [Hoofdstuk 2, paragraaf 5, van de Wet voortgezet onderwijs 2020][ref6], met uitzondering van de
      [artikelen 2.59][ref7], [2.62][ref8] en [2.63][ref9], is van overeenkomstige toepassing op de examens van
      opleidingen voortgezet algemeen volwassenenonderwijs, met dien verstande dat daarbij onder «bevoegd gezag» wordt
      verstaan hetgeen daaronder in deze wet wordt verstaan en dat het eindexamen of deeleindexamen wordt afgenomen door
      de examencommissie, bedoeld in [artikel 7.4.7][ref10].

      7 [Hoofdstuk 2, paragraaf 5, van de Wet voortgezet onderwijs 2020][ref11] is van toepassing op de examens van
      opleidingen voortgezet algemeen volwassenenonderwijs:

      a. met uitzondering van de [artikelen 2.51, eerste tot en met vijfde lid][ref12], 2.51a, [2.59][ref13],
      [2.60, eerste lid, onder d, tweede tot en met vierde lid][ref14], 2.60b, eerste tot en met derde lid, 2.60c, tweede
      en derde lid, 2.60d, [2.62 tot en met 2.64][ref15];

      b. met dien verstande dat:

      1°. «de rector of directeur» en «het bevoegd gezag» worden gelezen als «de examencommissie», behalve in de
      [artikelen 2.52][ref16], [2.53][ref17], [2.54][ref18] en [2.55, eerste lid][ref19];

      2°. de examencommissie de uitslag van het eindexamen vaststelt;

      3°. de examencommissie de cijferlijsten, diploma’s, getuigschriften en certificaten tekent;

      4°. de examencommissie een examenreglement vaststelt alsmede jaarlijks een programma van toetsing en afsluiting
      vaststelt;

      5°. de examencommissie de vaststelling van een wijziging van het programma van toetsing en afsluiting na 1 oktober
      aan de kandidaten en inspectie zendt.


