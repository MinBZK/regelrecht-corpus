  - number: 1.5.2
    text: |-
      1 De raad adviseert Onze Minister over de doelmatigheid van de beroepsopleidingen die de instellingen voornemens
      zijn te verzorgen of reeds verzorgen, gelet op de arbeidsmarktrelevantie van die opleidingen.

      2 De raad draagt bij aan een doelmatige en doelgerichte inzet van overheidsmiddelen door het doen van voorstellen,
      welke beroepsopleidingen voor bekostiging uit ’s Rijks kas in aanmerking komen.

      3 De raad doet in voorkomende gevallen voorstellen aan Onze Minister inzake het ontwikkelen van beroepsopleidingen
      dan wel delen van beroepsopleidingen die relevant zijn voor de regionale arbeidsmarkt.

      4 De raad draagt bij aan de bevordering van de kwaliteit van de plaatsen waar de beroepspraktijkvorming wordt
      verzorgd.

      5 De raad draagt er zoveel mogelijk zorg voor dat er een toereikend aantal bedrijven en organisaties van voldoende
      kwaliteit beschikbaar zijn die de beroepspraktijkvorming voor de opleidingen verzorgen. De raad is voorts belast
      met een regelmatige beoordeling van die bedrijven en organisaties.
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel1.5.2
  - number: 1.6.1
    text: |-
      1 Onze Minister besluit op aanvraag van het bevoegd gezag van een exameninstelling, dat de exameninstelling het
      recht heeft tot examinering van een beroepsopleiding in opdracht van een instelling, indien die exameninstelling in
      acht neemt hetgeen bij of krachtens deze wet is bepaald over:

      a. de kwaliteitszorg, bedoeld in [artikel 1.3.2][ref1] voor zover het betreft de examinering,

      b. de examens, en

      c. de rechtsbescherming, bedoeld in [hoofdstuk 7, titel 5][ref2].

      2 Onze Minister besluit binnen drie maanden na ontvangst van een aanvraag als bedoeld in het eerste lid. Indien
      de beschikking niet binnen drie maanden kan worden gegeven, stelt Onze Minister de aanvrager daarvan in kennis en
      noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden gezien.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel1.3.2
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Hoofdstuk7
