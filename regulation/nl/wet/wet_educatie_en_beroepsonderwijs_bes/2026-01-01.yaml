        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.9
    text: |-
      1 De raad richt een stelsel van kwaliteitszorg voor de beroepspraktijkvorming in en zorgt ervoor dat bedrijven en
      organisaties die de beroepspraktijkvorming verzorgen eenmaal per vier jaar worden beoordeeld aan de hand van de
      in dit stelsel ontwikkelde criteria. Indien daartoe door bijzondere omstandigheden aanleiding bestaat kan controle
      frequenter plaatsvinden.

      2 De raad maakt de in het eerste lid bedoelde criteria bekend. Van deze bekendmaking wordt mededeling gedaan in
      de Staatscourant.

      3 De raad draagt zorg voor openbaarmaking van een overzicht van bedrijven en organisaties met een gunstige
      beoordeling op grond van het eerste lid.

      4 Tot het verzorgen van de beroepspraktijkvorming voor een opleiding of groep van opleidingen zijn uitsluitend
      bevoegd de bedrijven en organisaties met een gunstige beoordeling op grond van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel7.2.9
  - number: 7.3.1
    text: |-
      1 De volgende opleidingen educatie worden onderscheiden:

      a. opleidingen voortgezet algemeen volwassenenonderwijs, gericht op het behalen van een diploma, bedoeld in de
      [artikelen 2.4 tot en met 2.6 van de Wet voortgezet onderwijs 2020][ref1], of onderdelen van dat diploma,

      b. opleidingen gericht op breed maatschappelijk functioneren,

      c. opleidingen Nederlands als vreemde taal, en

      d. opleidingen gericht op sociale redzaamheid.

      2 De opleidingen, bedoeld in het eerste lid, onder b, sluiten aan bij de basisberoepsopleiding, bedoeld in
      [artikel 7.2.2, eerste lid, onder b][ref2].

      3 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de opleidingen, bedoeld in het
      eerste lid, onder c.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.4
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel7.2.2
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel7.3.1
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2.4'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: 7.2.2
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.3.2
    text: |-
      1 Bij ministeriële regeling kan worden bepaald welke opleidingen in elk geval behoren tot de opleidingen, bedoeld
      in [artikel 7.3.1, eerste lid, onder b, c en d][ref1], en kunnen daarvoor eindtermen worden vastgesteld.

      2 Het bevoegd gezag stelt eindtermen vast voor de overige opleidingen educatie, met uitzondering van de
      opleidingen, bedoeld in [artikel 7.3.1, eerste lid onder a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel7.3.1
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel7.3.2
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: 7.3.1
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: 7.3.1
        hoofdstuk: '7'
  - number: 7.3.3
    text: |-
      1 Opleidingen voortgezet algemeen volwassenenonderwijs omvatten het onderwijs dat noodzakelijk is voor het behalen
      van het diploma voorbereidend wetenschappelijk onderwijs, het diploma hoger algemeen voortgezet onderwijs of het
      diploma middelbaar algemeen voortgezet onderwijs, dan wel voor het behalen van onderdelen van het diploma.

      2 Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden vastgesteld omtrent de voor het
      behalen van elk der in het eerste lid genoemde diploma's of onderdelen daarvan noodzakelijke vakken en andere
      programma-onderdelen, en omtrent de cursusduur.

      3 Wanneer de herkomst van de vavo-studenten daartoe noodzaakt, kan onderwijs worden gegeven in de taal van het land
      van oorsprong van die vavo-studenten.

      4 Ten behoeve van de bijzondere inrichting van het onderwijs kan Onze Minister toestaan dat wordt afgeweken van
      het bepaalde bij of krachtens dit artikel. Onze Minister besluit binnen zes maanden na ontvangst van een aanvraag.
      Indien de beschikking niet binnen zes maanden kan worden gegeven, stelt Onze Minister de aanvrager daarvan in
      kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel7.3.3
  - number: 7.4.1
    text: |-
      Deze paragraaf is van toepassing op beroepsopleidingen en opleidingen educatie, met uitzondering van opleidingen
      voortgezet algemeen volwassenenonderwijs en opleidingen Nederlands als vreemde taal.
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel7.4.1
  - number: 7.4.2
    text: |-
      1 Het bevoegd gezag geeft de studenten en deelnemers de gelegenheid een examen af te leggen.

      2 Het examen omvat een onderzoek naar de kennis, het inzicht, de vaardigheden en, in voorkomende gevallen, de
      beroepshoudingen die de examinandus zich bij voltooiing van de opleiding moet hebben eigen gemaakt, alsmede de
      beoordeling van de uitkomsten van dat onderzoek aan de hand van de eindtermen of de kwalificatie-eisen in het
      kwalificatiedossier.

      3 Het examen bestaat uit afzonderlijke onderdelen. Het examen van een beroepsopleiding is met gunstig
      gevolg afgelegd indien alle toetsen van die opleiding met gunstig gevolg zijn afgelegd, onverminderd
      [artikel 7.4.3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7.4.3
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel7.4.2
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: 7.4.3
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.4.3
    text: |-
      Het examen van een beroepsopleiding is eerst dan met goed gevolg afgesloten wanneer zowel de beroepspraktijkvorming
      als het overige deel van de beroepsopleiding met goed gevolg is afgesloten.
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel7.4.3
  - number: 7.4.4
    text: |-
      Bij algemene maatregel van bestuur kunnen onderdelen van een beroepsopleiding worden aangewezen waarvan de
      examinering geschiedt volgens bij of krachtens die algemene maatregel van bestuur te geven voorschriften.
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel7.4.4
  - number: 7.4.5
    text: |-
      Bij ministeriële regeling worden standaarden voor de kwaliteit van de examens van de beroepsopleidingen vastgesteld
      die betrekking hebben op:

      a. de inhoud en het niveau van de examens, in relatie tot de kwalificatie-eisen in het kwalificatie-dossier,
      bedoeld in [artikel 7.2.4][ref1], en

      b. de procedures rond de examens en de voorwaarden waaronder examens worden afgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7.2.4
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel7.4.5
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: 7.2.4
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.4.6
    text: |-
      1 Het bevoegd gezag kan de gehele examinering van een beroepsopleiding overdragen aan een andere instelling of
      aan een exameninstelling als bedoeld in [artikel 1.6.1][ref1], voor zover deze het recht op examinering van die
      beroepsopleiding hebben.

      2 Indien ten aanzien van een beroepsopleiding toepassing is gegeven aan [artikel 6.2.4, eerste lid][ref2],
      [6.2.5, eerste lid][ref3], dan wel [6.2.6, eerste lid][ref4], is het bevoegd gezag voor die beroepsopleiding
      gehouden toepassing te geven aan het eerste lid. Voor zover er bij toepassing van artikel 6.2.6, eerste lid, sprake
      is van een schorsing van een deel van het recht op examinering, bedoeld in artikel 6.2.6, tweede lid, onder a, of
      een schorsing als bedoeld in artikel 6.2.6, tweede lid, onder b, c of d, is het bevoegd gezag in afwijking van het
      eerste lid slechts gehouden dit deel over te dragen.

      3 Het bevoegd gezag kan de examinering van extraneï die op grond van een samenwerkingsovereenkomst als bedoeld in
      [artikel 8.4.2][ref5] een entreeopleiding volgen, onder zijn verantwoordelijkheid laten uitvoeren door het bevoegd
      gezag van een school voor voortgezet onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel1.6.1
