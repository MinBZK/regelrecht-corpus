        hoofdstuk: '4'
  - number: 4.2.1
    text: |-
      1 Docenten worden door het bevoegd gezag benoemd dan wel tewerkgesteld zonder benoeming.

      2 Tot docent aan een instelling kan slechts worden benoemd of tewerkgesteld zonder benoeming degene die:

      a. in het bezit is van een verklaring omtrent het gedrag, afgegeven volgens de
      [Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag BES][ref1], die op het tijdstip van
      overlegging aan het bevoegd gezag niet ouder is dan 6 maanden, en

      b. voldoet aan de bekwaamheidseisen, bedoeld in [artikel 4.2.3, eerste lid][ref2], blijkend uit het bezit van:

      1°. een getuigschrift als bedoeld in
      [artikel 7.11, eerste lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref3] van een met goed
      gevolg afgelegd afsluitend examen van een aan een hogeschool verbonden opleiding gericht op het beroep van leraar
      in het voortgezet onderwijs,

      2°. een getuigschrift als bedoeld in artikel 175 van de Wet op het hoger beroepsonderwijs van een met goed gevolg
      afgelegd staatsexamen, voor zover overeenkomend met een getuigschrift als bedoeld onder 1°,

      3°. een getuigschrift als bedoeld in
      [artikel 7.11, eerste lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref4] van een met goed
      gevolg afgelegd afsluitend examen van een universitaire lerarenopleiding,

      4°. een getuigschrift of diploma van een opleiding die vóór 1 augustus 1991 was gericht op het beroep van leraar in
      het voortgezet onderwijs,

      5°. een ten aanzien van het door hem te geven onderwijs verleende erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref5],

      6°. een gelijkwaardig buitenlands getuigschrift of diploma, behaald in een land dat niet behoort tot de Lid-Staten
      van de EU, dan wel een gelijkwaardig diploma of getuigschrift behaald in Aruba, Curaçao, Sint Maarten, Bonaire,
      Sint Eustatius of Saba, of

      c. in het bezit is van een door het bevoegd gezag afgegeven geschiktheidsverklaring als bedoeld in
      [artikel 4.2.5][ref6], en

      d. niet krachtens rechterlijke uitspraak is uitgesloten van het geven van onderwijs.

      3 In geval van een geschiktheidsverklaring als bedoeld in [artikel 4.2.5][ref7] vindt de benoeming of
      tewerkstelling zonder benoeming voor zover betrokkene niet in het bezit is van een getuigschrift als bedoeld in
      [artikel 7a.4 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref8] plaats voor een periode van
      ten hoogste twee aaneengesloten studiejaren. Het bevoegd gezag kan deze benoemingsperiode, al dan niet onder door
      dat gezag te stellen voorwaarden, verlengen met ten hoogste twee jaren indien het bevoegd gezag daarvoor redenen
      aanwezig acht. Het bevoegd gezag beschikt over geordende gegevens met betrekking tot de toepassing van de tweede
      volzin.

      4 Het bevoegd gezag kan ten aanzien van een docent voor een periode van ten hoogste twee jaar afwijken van de
      eisen, bedoeld in het tweede lid, onder b en c. Het bevoegd gezag kan de in de eerste volzin bedoelde termijn
      verlengen met ten hoogste twee jaren indien het bevoegd gezag dat noodzakelijk oordeelt vanwege de kwaliteit en de
      voortgang van het onderwijs aan de school. In dat geval verklaren het bevoegd gezag en de betrokkene in ieder geval
      schriftelijk dat betrokkene verplicht is zich in te spannen om binnen de verlengingsperiode alsnog te voldoen aan
      de eisen, bedoeld in het tweede lid, onder b. Het bevoegd gezag beschikt over geordende gegevens met betrekking tot
      de toepassing van de tweede volzin.

      5 Het bevoegd gezag kan afwijken van het tweede lid, onder b en c, ten aanzien van degene die gelet op specifieke
      kennis en bekwaamheden, samenhangend met ervaringen en werkzaamheden in andere sectoren van de samenleving en
      het bedrijfsleven, naar het oordeel van het bevoegd gezag voldoende bekwaam is om onder verantwoordelijkheid van
      een daartoe door het bevoegd gezag aan te wijzen docent voor een beperkte betrekkingsomvang te worden belast met
      het uitsluitend verzorgen van onderwijsonderdelen waar die specifieke kennis en bekwaamheden in het bijzonder
      betrekking op hebben. De betrekkingsomvang is voor het totaal van de in de eerste volzin bedoelde te verzorgen
      onderwijsonderdelen ten hoogste een aantal van gemiddeld 6 klokuren per week op jaarbasis.


      [ref1]: https://wetten.overheid.nl/BWBR0028258
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel4.2.3
