  - number: '5.1'
    text: |-
      1 Het bevoegd gezag stelt een representatief te achten vertegenwoordiging van ouders, studenten, vavo-studenten
      en personeel ten minste twee maal per jaar in de gelegenheid de algemene gang van zaken in de instelling met hem
      te bespreken.

      2 Het bevoegd gezag en de vertegenwoordigers van ouders, studenten, vavo-studenten en personeel komen bijeen indien
      daarom onder opgave van redenen door het bevoegd gezag, de vertegenwoordigers van ouders of de vertegenwoordigers
      van personeel wordt verzocht. De besprekingen kunnen namens het bevoegd gezag worden gevoerd.

      3 Indien een beroepsopleiding wordt verzorgd aan een scholengemeenschap als
      bedoeld in [artikel 1.1 van de Wet voortgezet onderwijs 2020][ref1], zijn de
      [artikelen 11.33 tot en met 11.35 van die wet][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel11.33
