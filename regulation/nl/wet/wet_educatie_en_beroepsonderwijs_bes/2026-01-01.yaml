  - number: 7.1.1
    text: |-
      1 Het onderwijs wordt gegeven en de examens worden afgenomen in het Nederlands.

      2 In afwijking van het eerste lid wordt het onderwijs gegeven en worden de examens afgenomen voor zover het betreft
      een beroepsopleiding op Bonaire, ter keuze van het bevoegd gezag in het Nederlands of in het Papiaments en voor
      zover het betreft een entreeopleiding of basisberoepsopleiding op Sint Eustatius en Saba, ter keuze van het bevoegd
      gezag, in het Nederlands of in het Engels. Bij het bepalen van zijn keuze betrekt het bevoegd gezag ten minste in
      zijn overwegingen:

      a. de dominante taal op een eilandgebied,

      b. de gehanteerde instructietaal in de vooropleiding,

      c. de aard van de doelgroep en de mate aan kennis van de dominante taal of van de geëigende instructietaal op een
      eilandgebied bij deze doelgroep,

      d. de instructietaal van vervolgopleidingen, en

      e. de beschikbaarheid van lesmateriaal in de desbetreffende instructietaal.
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel7.1.1
  - number: 7.1.2
    text: |-
      1 De instelling biedt het onderwijs aan in de vorm van beroepsopleidingen of opleidingen educatie. Een
      beroepsopleiding wordt door de instelling in het maatschappelijk verkeer aangeduid met de naam van de kwalificatie
      waarop zij is gericht of voorzover het gaat om studenten die ingeschreven zijn of zullen worden voor een
      opleidingsdomein BES of een kwalificatiedossier, de naam van dat opleidingsdomein BES of dat kwalificatiedossier.

      2 Een beroepsopleiding is een onderwijstraject dat voor een student is ingericht overeenkomstig de eisen van
      [hoofdstuk 7, titel 2][ref1], onverminderd [artikel 1.4.1, negende lid][ref2], en dat is gericht op het behalen van
      een kwalificatie in het beroepsonderwijs, ten bewijze waarvan een diploma wordt uitgereikt.

      3 Een opleiding educatie is een samenhangend geheel van onderwijseenheden, gericht op de verwezenlijking
      van eindtermen of het behalen van een diploma, gelijkwaardig aan een diploma van scholen, bedoeld in de
      [artikelen 13 tot en met 15 van de Wet op het voortgezet onderwijs BES][ref3], of onderdelen van een dergelijk
      diploma.

      4 Beroepsopleidingen worden afgesloten met een examen. Opleidingen educatie kunnen worden afgesloten met een
      examen.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel1.4.1
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel13
