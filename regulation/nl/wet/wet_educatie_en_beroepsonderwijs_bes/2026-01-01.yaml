  - number: 6.2.4
    text: |-
      1 Onze Minister kan aan een instelling het recht op examinering van een beroepsopleiding ontnemen, indien de
      kwaliteit van de examens van die opleiding niet voldoet aan de standaarden, bedoeld in [artikel 7.4.5][ref1].
      Bij de ontneming van het recht wordt bepaald met ingang van welk tijdstip dit geschiedt. De ontneming wordt in de
      Registratie instellingen en opleidingen bekendgemaakt.

      2 Voordat Onze Minister een besluit als bedoeld in het eerste lid neemt, geeft hij het bevoegd gezag een
      waarschuwing op grond van zijn bevindingen over de kwaliteit van de examinering onder bepaling van de termijn
      waarbinnen aan die waarschuwing gevolg moet zijn gegeven. Onze Minister maakt de waarschuwing openbaar.

      3 Het bevoegd gezag kan niet eerder dan na verloop van drie studiejaren na de ontneming, bedoeld in het eerste lid,
      het recht opnieuw verkrijgen. [Artikel 1.6.1][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7.4.5
