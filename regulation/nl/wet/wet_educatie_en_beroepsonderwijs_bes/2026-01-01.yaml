  - number: 8.4a.11
    text: |-
      1 In afwijking van [artikel 2.38, derde en vierde lid, van de Wet voortgezet onderwijs 2020][ref1] en
      [artikel 7.2.6, derde lid, onderdelen b, c en d, en achtste lid][ref2], omvat het gehele onderwijsprogramma van een
      doorlopende leerroute vmbo-mbo waarvan een beroepsopleiding in de beroepsopleidende leerweg deel uitmaakt:

      a. bij een studieduur van twee volledige studiejaren ten minste 2.000 klokuren, waarvan ten minste 1.400 begeleide
      onderwijsuren en ten minste 250 klokuren aan beroepspraktijkvorming;

      b. bij een studieduur van drie volledige studiejaren ten minste 3.000 klokuren, waarvan ten minste 2.400 begeleide
      onderwijsuren en ten minste 250 klokuren aan beroepspraktijkvorming;

      c. bij een studieduur van vier volledige studiejaren ten minste 4.000 klokuren, waarvan ten minste 2.950 begeleide
      onderwijsuren en ten minste 450 klokuren aan beroepspraktijkvorming;

      d. bij een studieduur van vijf volledige studiejaren ten minste 5.000 klokuren, waarvan ten minste 3.500 begeleide
      onderwijsuren en ten minste 900 klokuren aan beroepspraktijkvorming;

      e. bij een studieduur van zes volledige studiejaren ten minste 6.000 klokuren, waarvan ten minste 4.050 begeleide
      onderwijsuren en ten minste 1.350 klokuren aan beroepspraktijkvorming.

      2 Het bevoegd gezag van de instelling en het bevoegd gezag van de school kunnen gezamenlijk een onderwijsprogramma
      verzorgen dat minder uren omvat dan de in het eerste lid, onderdelen a tot en met e, genoemde aantallen mits de
      opleiding aantoonbaar van voldoende kwaliteit is. In het geval het onderwijsprogramma minder uren omvat, legt
      het bevoegd gezag hierover verantwoording af in het jaarverslag, bedoeld in [artikel 2.3.2][ref3], dan wel, bij
      toepassing van [artikel 1.4.1, eerste lid][ref4], in het verslag, bedoeld in artikel 1.4.1, zevende lid.

      3 Ten aanzien van het derde studiejaar van een doorlopende leerroute vmbo-mbo wordt onder begeleide onderwijsuren
      mede verstaan: onderwijstijd als bedoeld in [artikel 2.38 van de Wet voortgezet onderwijs 2020][ref5].


