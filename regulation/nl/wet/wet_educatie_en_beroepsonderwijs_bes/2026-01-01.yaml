        artikel: 8.1.1
        hoofdstuk: '8'
  - number: 8.4a.7
    text: |-
      1 De leerling van een school die een doorlopende leerroute vmbo-mbo volgt wordt met ingang van het derde studiejaar
      van die doorlopende leerroute vmbo-mbo ingeschreven als student aan de instelling die het beroepsonderwijs binnen
      de doorlopende leerroute vmbo-mbo verzorgt. In afwijking van [artikel 8.1.3, eerste lid][ref1], eerste volzin,
      overlegt de school de gegevens, bedoeld in die volzin.

      2 Voor de inschrijving, bedoeld in het eerste lid, is het studentenstatuut, bedoeld in [artikel 7.4.10][ref2],
      reeds van toepassing op een leerling van een school die een doorlopende leerroute vmbo-mbo volgt.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel8.1.3
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel7.4.10
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel8.4a.7
