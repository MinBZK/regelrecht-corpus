  - number: 7.6.1
    text: |-
      1 Het bevoegd gezag is verplicht, ho-studenten die zijn ingeschreven voor een opleiding voor het beroep van leraar
      waarop de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] betrekking heeft, of die anderszins
      studeren voor een bewijs van voldoende pedagogische bekwaamheid, en die in opleiding zijn voor een functie in
      het onderwijs, gelegenheid te bieden de als onderdeel van hun opleiding vereiste ervaring in de instelling te
      verkrijgen.

      2 De in het eerste lid bedoelde verplichting omvat 5% van het in het desbetreffende studiejaar door de instelling
      in totaal te verzorgen beroepsonderwijs en educatie. Het bevoegd gezag kan een hoger percentage vaststellen mits
      dat in overeenstemming is met de goede gang van zaken binnen de instelling.

      3 Onze Minister kan het bevoegd gezag op grond van bijzondere omstandigheden gehele of gedeeltelijke ontheffing van
      de in het eerste lid bedoelde verplichting verlenen. De ontheffing geldt voor een studiejaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
