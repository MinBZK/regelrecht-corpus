  - number: 11.6d
    text: |-
      De artikelen die niet bij Besluit van 3 februari 2011, houdende vaststelling van het tijdstip van inwerkingtreding
      van een aantal onderdelen van de Aanpassingswet openbare lichamen Bonaire, Sint Eustatius en Saba (Stb. 2011, 34)
      in werking zijn getreden, treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan, verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel11.6d
  - number: 11.6e
    text: |-
      De leden van de examencommissie, bedoeld in [artikel 7.4.7][ref1] zoals
      die bepaling luidde op de dag voorafgaand aan de inwerkingtreding van
      __REF001___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      ________________________________ (Stb. 2017, 43), worden aangemerkt als leden van de examencommissie, bedoeld in
      artikel 7.4.7 zoals luidend na inwerkingtreding van artikel II, onderdeel B, van voornoemde wet.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7.4.7
