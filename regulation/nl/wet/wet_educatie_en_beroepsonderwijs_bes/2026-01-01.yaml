  - number: 8.2.2
    text: |-
      1 In dit artikel en de daarop gebaseerde regelgeving wordt onder «diploma» verstaan:

      a. het diploma middelbaar algemeen voortgezet onderwijs,

      b. het diploma voorbereidend beroepsonderwijs,

      c. het diploma middelbaar algemeen voortgezet onderwijs – voorbereidend beroepsonderwijs, of

      d. de diploma's voorbereidend middelbaar beroepsonderwijs.

      2 Onverminderd [artikel 8.2.1][ref1] kan een instelling voor de toelating tot een beroepsopleiding als bedoeld
      in [artikel 7.2.2, eerste lid, onderdelen b tot en met e][ref2], nadere vooropleidingseisen stellen, inhoudende
      dat het diploma van de student voldoet aan de profielen, bedoeld in de [artikelen 2.25][ref3], [2.26][ref4] en
      [2.27 van de Wet voortgezet onderwijs 2020][ref5], alsmede dat vakken en andere programmaonderdelen die deel hebben
      uitgemaakt van het examen ter verkrijging van een diploma.

      3 Indien een instelling gebruikt maakt van de bevoegdheid bedoeld in het tweede lid kunnen uitsluitend nadere
      vooropleidingseisen worden gesteld die bij ministeriële regeling kunnen worden aangewezen, waarbij onderscheid kan
      worden gemaakt naar categorieën van studenten, dan wel kan worden bepaald dat de nadere vooropleidingseisen niet
      van toepassing zijn op categorieën van studenten.

      4 Het aanwijzen van de in het derde lid bedoelde nadere vooropleidingseisen vindt plaats op voorstel van
      organisaties in het voortgezet onderwijs, vertegenwoordigers van de instellingen en de raad.


