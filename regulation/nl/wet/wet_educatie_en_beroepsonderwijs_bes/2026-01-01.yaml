  - number: 4.1.7
    text: |-
      1 In afwijking van [artikel 8 van het Rechtspositiebesluit ambtenaren BES][ref1] is ieder personeelslid van een
      bijzondere instelling in het bezit van een door het bevoegd gezag en hemzelf getekende akte van benoeming.

      2 De akte van benoeming bevat ten minste bepalingen van gelijke inhoud als de bepalingen die zijn vastgesteld in
      [artikel 8 van het Rechtspositiebesluit ambtenaren BES][ref2].


