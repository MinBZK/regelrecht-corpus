  - number: 7.4.7
    text: |-
      1 Het bevoegd gezag van een instelling of exameninstelling stelt, al dan niet in samenwerking met een of meer
      bevoegde gezagsorganen van andere instellingen, een examencommissie in ten behoeve van de organisatie en het
      afnemen van de examens voor elke door de instelling verzorgde opleiding of voor groepen van opleidingen.

      2 Het bevoegd gezag benoemt de leden van de examencommissie.
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel7.4.7
  - number: 7.4.8
    text: |-
      1 Ten bewijze dat een examen met goed gevolg is afgelegd, reikt de examencommissie een diploma uit.

      2 Bij ministeriële regeling worden modellen en technische veiligheidseisen voor het diploma en de resultatenlijst
      van een beroepsopleiding vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel7.4.8
  - number: 7.4.8a
    text: |-
      1 Een student aan wie geen diploma of certificaat als bedoeld in [artikel 7.4.8][ref1] kan worden uitgereikt,
      maar die wel ten minste één waardering voor een onderdeel of voor een deel daarvan van de opleiding heeft behaald,
      ontvangt op zijn verzoek een door de examencommissie af te geven verklaring.

      2 In afwijking van het eerste lid ontvangt de student, ook zonder een daartoe strekkend verzoek, een verklaring van
      de desbetreffende examencommissie, indien de student:

      a. niet meer aan een instelling is ingeschreven,

      b. de leeftijd van drieëntwintig jaar nog niet heeft bereikt, en

      c. niet in het bezit is van een diploma van een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen b tot en met e][ref2], dan wel een diploma voorbereidend wetenschappelijk
      onderwijs of hoger algemeen voortgezet onderwijs als bedoeld in [artikel 13][ref3] onderscheidenlijk
      [artikel 14 van de Wet voortgezet onderwijs BES][ref4].

      3 Op de verklaring zijn in ieder geval opgenomen de onderdelen of de delen daarvan waarvoor op de datum van
      beëindiging van de opleiding door de student een waardering is behaald en de overige bij ministeriële regeling te
      bepalen gegevens die per categorie van studenten kunnen verschillen.

      4 Bij ministeriële regeling wordt voor de verklaring een model vastgesteld, dat voor verschillende categorieën van
      studenten kan verschillen en kunnen voor de verklaring technische veiligheidseisen worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7.4.8
