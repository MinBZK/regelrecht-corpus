  - number: 8.4a.8
    text: |-
      1 Het bevoegd gezag van de instelling draagt de gehele studieduur van de doorlopende leerroute vmbo-mbo zorg voor:

      a. de uitvoering van delen van het onderwijsprogramma die behoren tot de beroepsopleiding die deel uitmaakt van de
      doorlopende leerroute vmbo-mbo, met inbegrip van de beroepspraktijkvorming;

      b. de examinering en diplomering betreffende de beroepsopleiding die deel uitmaakt van de doorlopende leerroute
      vmbo-mbo.

      2 Ten aanzien van de onderdelen van een doorlopende leerroute vmbo-mbo, bedoeld in het eerste lid, die in het
      eerste of tweede studiejaar van die route plaatsvinden, is van overeenkomstige toepassing hetgeen is bepaald
      bij of krachtens de [artikelen 2.3.3][ref1] en [2.3.4, eerste, vierde en achtste tot en met twaalfde lid][ref2],
      alsmede het bepaalde bij of krachtens de [artikelen 10][ref3], [12][ref4], [14][ref5], [15][ref6] en
      [25 van de Wet register onderwijsdeelnemers][ref7].

      3 Artikel 7.4.10a is van overeenkomstige toepassing op klachten over met de doorlopende leerroute vmbo-mbo verband
      houdende gedragingen en beslissingen van het bevoegd gezag van de school waarmee een samenwerkingsovereenkomst als
      bedoeld in [artikel is 8.4a.3][ref8] is gesloten, of van het personeel van dat bevoegd gezag. Onverminderd artikel
      7.4.10a, vierde lid, onderdeel a, maakt de voorzitter van de klachtencommissie geen deel uit van dat bevoegd gezag
      en is hij niet werkzaam voor of bij dat bevoegd gezag.


