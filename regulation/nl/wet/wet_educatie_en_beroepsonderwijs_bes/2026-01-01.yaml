  - number: 8.1.6f
    text: |-
      1 Het bevoegd gezag stelt regels van procedurele aard vast met betrekking tot de toepassing van de
      [artikelen 8.1.6a][ref1] of [8.1.6c][ref2], waartoe in ieder geval behoren regels over de aanvraag, de aanvang en
      de duur van de ondersteuning en indien het financiële ondersteuning betreft tevens de hoogte van het bedrag.

      2 Het bevoegd gezag kan aan de toekenning van ondersteuning de verplichting verbinden dat de student feitelijk
      studerend is.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel8.1.6a
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel8.1.6c
