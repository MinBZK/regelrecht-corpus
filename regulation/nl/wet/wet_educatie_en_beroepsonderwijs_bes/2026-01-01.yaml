  - number: '3.4'
    text: |-
      1 Onze Minister kan op verzoek een rechtspersoon aanwijzen die naar zijn oordeel in staat is deskundige
      ondersteuning te bieden aan studenten en vavo-studenten met een specifieke onderwijsbehoefte waarin de instelling
      redelijkerwijs niet kan voorzien en waaronder in elk geval de volgende taken worden verstaan:

      a. het verzorgen van onderwijsondersteunende activiteiten aan studenten en vavo-studenten met een lichamelijke,
      verstandelijke, zintuiglijke, geestelijke of meervoudige handicap of stoornis,

      b. het verzorgen van ambulante begeleiding ten behoeve van studenten en vavo-studenten met een lichamelijke,
      verstandelijke, zintuiglijke, geestelijke of meervoudige handicap of stoornis,

      c. het verrichten van handelingsgerichte diagnostiek ten behoeve van de studenten en vavo-studenten op verzoek van
      het bevoegd gezag, het samenwerkingsverband of de ouders, of

      d. het op verzoek van een bevoegd gezag, het samenwerkingsverband of de ouders van studenten en vavo-studenten
      adviseren en collegiaal consulteren.

      2 De rechtspersoon, bedoeld in het eerste lid, wordt voor de toepassing van deze wet aangeduid als een
      expertisecentrum onderwijszorg.

      3 Een student of vavo-student die binnen een locatie van het expertisecentrum onderwijszorg wordt begeleid, blijft
      ingeschreven bij de instelling. Het bevoegd gezag van deze instelling blijft verantwoordelijk voor de student of
      vavo-student tijdens het verblijf binnen het expertisecentrum onderwijszorg. Onder deze verantwoordelijkheid valt
      in elk geval de zorg voor het geven van adequaat onderwijs door een docent die daartoe bevoegd is op grond van
      [artikel 4.2.1][ref1].

      4 Het bevoegd gezag vergoedt voor het begeleiden van zijn student of vavo-student, bedoeld in het derde lid, naar
      redelijkheid en indien dit naar oordeel van het samenwerkingsverband, bedoeld in [artikel 3.2][ref2], nodig is, de
      kosten die worden gemaakt door:

      a. het expertisecentrum onderwijszorg, en

      b. een ander bevoegd gezag van een instelling of school als bedoeld in de [Wet primair onderwijs BES][ref3] of de
      [Wet voortgezet onderwijs 2020][ref4].

      5 Per openbaar lichaam is er één expertisecentrum onderwijszorg.

      6 Het expertisecentrum onderwijszorg treft een regeling voor de behandeling van klachten over gedragingen en
      beslissingen van het bestuur van dit centrum of het personeel, waaronder discriminatie, dan wel het nalaten van
      gedragingen en het niet nemen van beslissingen door het bestuur of het personeel voor zover het betreft zijn
      onderscheidenlijk hun werkzaamheden in het kader van het onderwijsproces of de deskundige ondersteuning, bedoeld
      in het eerste lid. De [artikelen 3.35][ref5] en [3.36 van de Wet voortgezet onderwijs 2020][ref6] zijn op deze
      regeling van overeenkomstige toepassing.

      7 Bij ministeriële regeling kunnen voorschriften worden gegeven over de taken van het expertisecentrum
      onderwijszorg.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel4.2.1
