  - number: 1.1.1
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      **beroepsonderwijs**: onderwijs als bedoeld in [artikel 1.2.1, tweede lid][ref1];

      **beroepsopleiding**: een opleiding als bedoeld in [artikel 7.2.2, eerste lid][ref2];

      **beroepsopleiding in de beroepsbegeleidende leerweg:** beroepsopleiding als bedoeld in
      [artikel 7.2.6, vierde lid][ref3];

      **beroepsopleiding in de beroepsopleidende leerweg:** beroepsopleiding als bedoeld in
      [artikel 7.2.6, derde lid][ref4];

      **beroepspraktijkvorming**: het onderricht in de praktijk van het beroep, bedoeld in
      [artikel 7.2.7, eerste lid][ref5];

      **bevoegd gezag**:

      a. van een openbare instelling: bestuurscollege, voor zover de eilandsraad niet anders bepaalt, en, indien de
      eilandsraad dit wenselijk oordeelt, met inachtneming van door hem te stellen regelen, dan wel het krachtens de
      desbetreffende gemeenschappelijke regeling bevoegde orgaan;

      b. van een bijzondere instelling: natuurlijke persoon of rechtspersoon die de instelling in stand houdt als bedoeld
      in [artikel 1.3.4, eerste lid][ref6];

      c. van een exameninstelling als bedoeld in [artikel 1.6.1][ref7]: rechtspersoon die de exameninstelling in stand
      houdt;

      **bijzondere instelling**: een instelling in stand gehouden door een natuurlijke persoon of een privaatrechtelijke
      rechtspersoon;

      **deelnemer**: degene die een opleiding educatie volgt, met uitzondering van een opleiding voortgezet algemeen
      volwassenenonderwijs;

      **deskundige**: een deskundige als bedoeld in
      [artikel 121, zesde lid, van Boek 2, van het Burgerlijk Wetboek BES][ref8];

      **doorlopende leerroute vmbo-mbo**: route als bedoeld in [artikel 8.4a.2, tweede lid][ref9];

      **educatie**: onderwijs als bedoeld in [artikel 1.2.1, eerste lid][ref10];

      **eindtermen**: de eindtermen, bedoeld in [artikel 7.3.2][ref11];

      **exameninstelling**: een instelling als bedoeld in [artikel 1.6.1][ref12];

      **examinering**: het nemen van beslissingen over inhoud en niveau van examens van een beroepsopleiding in relatie
      tot de eindtermen, procedures en voorwaarden waaronder examens worden afgenomen, alsmede het vaststellen van de
      uitslag van examens;

      **expertisecentrum onderwijszorg**: de rechtspersoon, bedoeld in [artikel 3.4, eerste lid][ref13];

      **ho-student**: degene die hoger onderwijs volgt, als bedoeld in artikel 1.1, onderdeel b, van de Wet op het hoger
      onderwijs en wetenschappelijk onderzoek;

      **inspectie**: de inspectie, bedoeld in de [Wet op het onderwijstoezicht][ref14];

      **instelling**: een organisatorische eenheid die opleidingen educatie of opleidingen beroepsonderwijs verzorgt;

      **kwalificatie:** de kwalificatie, bedoeld in [artikel 7.1.3][ref15];

      **kwalificatiedossier:** een document waarin een of meer kwalificaties zijn beschreven;

      **leerlingen**: leerlingen als bedoeld in de [WPO BES][ref16] en [WVO BES][ref17];

      **leerweg**: een leerweg als bedoeld in [artikel 7.2.2, tweede lid][ref18];

      **onderwijs**: educatie en beroepsonderwijs;

      **Onze Minister**: Onze Minister van Onderwijs, Cultuur en Wetenschap;

      **openbaar lichaam**: het openbaar lichaam Bonaire, Sint Eustatius of Saba;

      **openbare instelling**: een instelling in stand gehouden door een openbaar lichaam;

      **opleiding educatie**: een opleiding als bedoeld in [artikel 7.3.1, eerste lid][ref19];

      **opleidingsdomein BES:** een samenhangend geheel van kwalificaties die zijn gericht op en van belang zijn voor
      eenzelfde bedrijfstak of groep van bedrijfstakken;

      **persoonsgebonden nummer BES**: het administratienummer van de deelnemer, vavo-student of student, dan wel het
      door Onze Minister uitgegeven onderwijsnummer, bedoeld in [artikel 8.1.3, vierde lid][ref20];

      **raad**: Raad onderwijs arbeidsmarkt als bedoeld in [artikel 1.5.1, eerste lid][ref21];

      **Registratie instellingen en opleidingen**: Registratie instellingen en opleidingen, bedoeld in
      [artikel 6.1.1, eerste lid][ref22];

      **student**: degene die beroepsonderwijs volgt;

      **studiejaar**: het tijdvak dat aanvangt op 1 augustus en eindigt op 31 juli van het daarop volgend jaar;

      **vavo-student**: degene die een opleiding voortgezet algemeen volwassenenonderwijs volgt;

      **volwassene**: een in Nederland woonachtige van 18 jaren of ouder.


