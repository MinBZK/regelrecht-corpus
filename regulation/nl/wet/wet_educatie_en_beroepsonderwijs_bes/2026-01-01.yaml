  - number: 8.1.7b
    text: |-
      1 Het bevoegd gezag kan in bijzondere gevallen na advies van de examencommissie en na zorgvuldige afweging van de
      betrokken belangen beslissen de student niet in te schrijven of de inschrijving te beëindigen, als die deelnemer
      door zijn gedragingen of uitlatingen blijk heeft gegeven van ongeschiktheid voor de uitoefening van een of meer
      beroepen waartoe de door hem gevolgde opleiding hem opleidt, dan wel voor de praktische voorbereiding op de
      beroepsuitoefening.

      2 Het bevoegd gezag dan wel het bevoegd gezag van een andere instelling die een zelfde of verwante opleiding
      verzorgt, kan besluiten de deelnemer niet opnieuw of niet voor die opleiding in te schrijven.
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel8.1.7b
  - number: 8.1.7c
    text: |-
      1 Het bevoegd gezag kan een student of vavo-student voor ten hoogste twee weken schorsen.

      2 Het bevoegd gezag maakt de beslissing tot schorsing schriftelijk en voorzien van een deugdelijke motivering aan
      de student of vavo-student bekend. Indien de student of vavo-student jonger dan 18 jaar is, maakt het bevoegd gezag
      de beslissing ook aan de ouders, voogden of verzorgers schriftelijk bekend.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over het schorsen van
      studenten en vavo-studenten.
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel8.1.7c
  - number: 8.1.7d
    text: |-
      1 Het bevoegd gezag kan een student of vavo-student van de instelling verwijderen.

      2 Het bevoegd gezag verwijdert een student of vavo-student op wie de Leerplichtwet BES van toepassing is pas
      definitief van de instelling nadat het bevoegd gezag ervoor heeft gezorgd dat het bevoegd gezag van een andere
      instelling of een instelling als bedoeld in [artikel 1, onder c, van de Leerplichtwet BES][ref1] bereid is de
      student of vavo-student toe te laten. Indien aantoonbaar gedurende acht weken zonder succes is gezocht naar een
      zodanige instelling of school waarnaar kan worden verwezen, kan in afwijking van de eerste volzin tot definitieve
      verwijdering worden overgegaan.

      3 Het bevoegd gezag maakt de beslissing tot verwijdering van een student of vavo-student schriftelijk en
      voorzien van een deugdelijke motivering aan hem bekend. Indien de student of vavo-student jonger dan 18
      jaar is, maakt het bevoegd gezag de beslissing ook aan de ouders, voogden of verzorgers schriftelijk bekend.
      Voorafgaand daaraan kan de student of vavo-student worden geschorst. Deze schorsing kan de duur, bedoeld in
      [artikel 8.1.7c, eerste lid][ref2], overschrijden. Het bevoegd gezag gaat in geval van schorsing na op welke andere
      manier de betrokken student of vavo-student onderwijs kan blijven volgen.

      4 Op een bezwaarschrift tegen een beslissing over verwijdering van een student of vavo-student
      beslist het bevoegd gezag, voor zover het een openbare instelling betreft in afwijking van
      [artikel 69 van de Wet administratieve rechtspraak BES][ref3], binnen vier weken na ontvangst van het
      bezwaarschrift. Voorafgaand daaraan wordt de student of vavo-student in de gelegenheid gesteld te worden gehoord en
      kennis te nemen van de adviezen en rapporten over die beslissing. Is de student of vavo-student jonger dan 18 jaar,
      dan komen deze rechten ook toe aan diens ouders, voogden of verzorgers.

      5 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over het verwijderen van
      studenten en vavo-studenten.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel8.1.7c
      [ref3]: https://wetten.overheid.nl/BWBR0028455#Artikel69
