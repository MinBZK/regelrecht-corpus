  - number: 8.1.1
    text: |-
      1 Een ieder die gebruik wenst te maken van onderwijsvoorzieningen en examenvoorzieningen, dient zich door
      het bevoegd gezag als student of vavo-student te laten inschrijven. Een ieder die uitsluitend wenst te worden
      toegelaten tot examenvoorzieningen, dient zich door het bevoegd gezag als extraneus te laten inschrijven. Voor
      de inschrijving als extraneus is aan het bevoegd gezag een door dat gezag te bepalen vergoeding verschuldigd.
      Indien het een meerderjarige extraneus betreft die het examengeld niet zelf voldoet, wordt niet overgegaan tot
      inschrijving dan nadat de extraneus schriftelijk heeft verklaard dat hij ermee instemt dat een in die verklaring
      vermelde derde namens hem het examengeld voldoet.

      2 De inschrijving voor een opleiding of een onderdeel van een opleiding staat uitsluitend open voor degene waarvan
      de ouders, voogden of verzorgers aantonen, dan wel, indien hij meerderjarig en handelingsbekwaam is, degene die
      aantoont dat hij:

      a. de Nederlandse nationaliteit bezit of op grond van een wettelijke bepaling als Nederlander wordt behandeld,

      b. vreemdeling is en jonger is dan 18 jaar op de eerste dag waarop de opleiding of het onderdeel van de opleiding
      begint waarvoor voor de eerste maal inschrijving wordt gewenst,

      c. vreemdeling is, 18 jaar of ouder is op de eerste dag waarop de opleiding of het onderdeel van de opleiding
      begint waarvoor voor de eerste maal inschrijving wordt gewenst en op die dag rechtmatig verblijft houdt in de zin
      van de [artikelen 3][ref1], [5a][ref2] of [6 van de Wet toelating en uitzetting BES][ref3], of

      d. vreemdeling is, niet meer voldoet aan een van de voorwaarden genoemd onder b of c, en eerder in overeenstemming
      met een van die onderdelen is ingeschreven voor een opleiding of het onderdeel van de opleiding van een instelling,
      welke opleiding of welk onderdeel van de opleiding nog steeds wordt gevolgd en nog niet is voltooid.

      3 Indien na de inschrijving voor de opleiding of een onderdeel van de opleiding blijkt dat deze op welke grond dan
      ook niet in overeenstemming met het tweede lid heeft plaatsgevonden, wordt de inschrijving met onmiddellijke ingang
      beëindigd.

      3a Het bevoegd gezag van een bijzondere instelling maakt de beslissing over inschrijving schriftelijk en voorzien
      van een deugdelijke motivering bekend aan de student of vavo-student. Indien de student of vavo-student jonger dan
      18 jaar is, maakt het bevoegd gezag de beslissing ook aan de ouders, voogden of verzorgers schriftelijk bekend.

      4 De inschrijving geschiedt voor een opleiding educatie of een onderdeel daarvan of voor een beroepsopleiding.
      Indien het verzoek om inschrijving betrekking heeft op een beroepsopleiding, wordt daarbij aangegeven op welke
      leerweg het verzoek van toepassing is.

      5 De toelating tot beroepsopleidingen staat voor zover het de beroepsbegeleidende leerweg betreft, uitsluitend open
      voor degenen voor wie de leerplicht, bedoeld in [paragraaf 2 van de Leerplichtwet BES][ref4], is geëindigd.

      6 Het bevoegd gezag van een bijzondere instelling kan aangeven dat degenen die wensen te worden ingeschreven,
      geacht worden de grondslag en de doelstellingen van de instelling te respecteren. De inschrijving kan worden
      geweigerd dan wel beëindigd indien de betrokkene de grondslag en de doelstellingen van de instelling niet
      respecteert. De inschrijving aan een bijzondere instelling kan eveneens worden geweigerd dan wel beëindigd indien
      gegronde vrees bestaat dat de betrokkene van die inschrijving en de daaraan verbonden rechten misbruik zal maken
      door in ernstige mate afbreuk te doen aan de eigen aard van die instelling, dan wel indien is gebleken dat de
      betrokkene van die inschrijving en de daaraan verbonden rechten een dergelijk misbruik heeft gemaakt. De weigering
      dan wel beëindiging van de inschrijving geschiedt schriftelijk en is met redenen omkleed. De inschrijving kan niet
      worden beëindigd op grond van de tweede volzin indien voor betrokkene geen gelegenheid bestaat de opleiding aan een
      andere instelling te volgen.

      7 De inschrijving voor een opleidingsdomein BES kan uitsluitend geschieden voor een beroepsopleiding in de
      beroepsopleidende leerweg op het tweede, derde of vierde niveau, bedoeld in [artikel 7.2.2, derde lid][ref5].

      8 Bij ministeriële regeling kan een maximum worden vastgesteld voor het percentage van de studenten in het
      beroepsonderwijs dat in een jaar kan worden ingeschreven voor een opleidingsdomein BES.


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028571#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0028571#Artikel6
