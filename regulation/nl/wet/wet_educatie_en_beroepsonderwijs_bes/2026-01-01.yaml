  - number: 6.1.1
    text: |-
      1 De Registratie instellingen en opleidingen omvat een systematisch geordende verzameling gegevens met betrekking
      tot de erkende beroepsopleidingen en de instellingen die deze verzorgen. Onze Minister is belast met de aanleg, het
      beheer en de bekendmaking van het register en met het verstrekken van informatie uit het register. De bekendmaking
      en het verstrekken van informatie kunnen digitaal plaatsvinden.

      2 De Registratie instellingen en opleidingen bevat de volgende gegevens:

      a. de naam van de beroepsopleiding en de opleidingscode, alsmede het NLQF-niveau dat bij of krachtens de
      [Wet NLQF][ref1] voor de beroepsopleiding is vastgesteld en het daarmee corresponderende EQF-niveau,

      b. de naam van de instelling die de beroepsopleiding verzorgt, alsmede in welke leerweg of leerwegen de opleiding
      wordt verzorgd,

      c. of het een bekostigde beroepsopleiding betreft,

      d. de studieduur,

      e. de naam van de beroepsopleiding ten aanzien waarvan bij een instelling het recht op examinering is ontnomen en
      de ingangsdatum daarvan,

      f. de namen van de exameninstellingen, die het recht hebben op examinering van de betreffende beroepsopleiding,
      voorzover het recht op examinering niet is ontnomen.


      [ref1]: https://wetten.overheid.nl/BWBR0050058
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel6.1.1
    references:
