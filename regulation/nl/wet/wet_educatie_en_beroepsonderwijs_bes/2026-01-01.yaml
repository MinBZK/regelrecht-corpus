  - number: 8.1.6d
    text: |-
      1 Indien op grond van de [artikelen 8.1.6a][ref1] of [8.1.6c][ref2] financiële ondersteuning wordt toegekend aan
      een student die een beroepsopleidende leerweg volgt, is het bedrag daarvan niet hoger dan de som van de bedragen,
      genoemd in de kolommen III en IV voor het beroepsonderwijs op het eigen openbaar lichaam of ander openbaar lichaam,
      bedoeld in [artikel 2.2, eerste lid, van de Wet studiefinanciering BES][ref3].

      2 Onverminderd het eerste lid, kan bij algemene maatregel van bestuur worden bepaald dat een lid van de
      vertegenwoordiging als bedoeld in [artikel 8.1.6a, tweede lid, onderdeel a][ref4], een financiële ondersteuning
      ontvangt ter hoogte van een bij algemene maatregel van bestuur te bepalen minimumbedrag. De voordracht voor deze
      algemene maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide Kamers der
      Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel8.1.6a
