  - number: 8.2.2a
    text: |-
      1 Indien de uitoefening van het beroep of de beroepen waarop een opleiding voorbereidt, dan wel de organisatie en
      de inrichting van het onderwijs, specifieke eisen stellen ten aanzien van kennis of vaardigheden die niet of niet
      in voldoende mate onderdeel zijn van het voortgezet onderwijs, bedoeld in de [Wet voortgezet onderwijs 2020][ref1],
      respectievelijk specifieke eisen stellen ten aanzien van de eigenschappen van de deelnemer, kunnen bij ministeriële
      regeling opleidingen worden aangewezen die op daarbij aangegeven gronden eisen kunnen stellen in aanvulling op de
      eisen, bedoeld in de [artikelen 8.2.1][ref2] en [8.2.2][ref3].

      2 Het bevoegd gezag stelt een regeling vast voor de selectiecriteria en de selectieprocedure en stelt deze
      uiterlijk 1 februari voorafgaand aan het studiejaar waar deze voor geldt, voor een ieder beschikbaar. De
      selectiecriteria kunnen uitsluitend eisen bevatten die direct verband houden met de gronden, bedoeld in het eerste
      lid.

      3 Bij de ministeriële regeling, bedoeld in het eerste lid, kunnen tevens voorschriften van procedurele aard worden
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0044212
