  - number: 7.4.10
    text: |-
      Het bevoegd gezag zorgt ervoor dat de instelling beschikt over een toegankelijk en begrijpelijk studentenstatuut
      waarin de rechten en plichten van de studenten zijn opgenomen, en stelt de actuele versie van het studentenstatuut
      voor de studenten beschikbaar. Het bevoegd gezag bevordert voorts de kennis van het studentenstatuut. Het
      studentenstatuut bevat in elk geval:

      a. een beschrijving van de procedures voor de behandeling van klachten en geschillen, bedoeld in [titel 5][ref1],
      daaronder begrepen de inrichting van de toegankelijke faciliteit, bedoeld in [artikel 7.5.1][ref2];

      b. een beschrijving van de procedures voor de behandeling van geschillen inzake medezeggenschap;

      c. een beschrijving van de beroepsrechten die kunnen worden ontleend aan deze wet en andere wettelijke regelingen;

      d. een beschrijving van aanvullende procedures ter bescherming van de rechten van studenten die door het bevoegd
      gezag worden getroffen;

      e. de nadere regels over het bindend studieadvies, bedoeld in [artikel 8.1.7a, vierde lid][ref3];

      f. het beleid met betrekking tot het beperkt en beheersbaar houden van de middelen die van de studenten worden
      gevraagd voor schoolkosten die door het bevoegd gezag noodzakelijk worden bevonden;

      g. in voorkomend geval, bepalingen over de terugbetaling van voorschotten, verstrekt door het bevoegd gezag, ter
      voldoening van een bij of krachtens de wet geregelde geldelijke bijdrage als bedoeld in [artikel 8.1.6][ref4];

      h. bepalingen over de terugbetaling van cursusgeld in andere gevallen dan bedoeld in
      [artikel 14, tweede lid, onderdeel a tot en met d, van het Uitvoeringsbesluit Les- en cursusgeldwet 2000][ref5];

      i. het beleid van het bevoegd gezag met betrekking tot toelating, verzuim, schorsing en verwijdering van studenten;

      j. de rechten en plichten ten aanzien van zwangerschap en bevalling; en

      k. de instellingsregels over het mbo-studentenfonds, bedoeld in [artikel 8.1.6f][ref6].


