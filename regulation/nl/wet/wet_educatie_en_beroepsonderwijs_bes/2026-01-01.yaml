  - number: 2.1.1
    text: |-
      1 Onze Minister kan, de eilandsraad gehoord, op aanvraag van het bevoegd gezag besluiten dat een beroepsopleiding
      in de beroepsopleidende leerweg of een beroepsopleiding in de beroepsbegeleidende leerweg ten aanzien waarvan het
      bevoegd gezag een erkenning heeft verkregen op grond van [artikel 1.4.1][ref1], voor bekostiging in aanmerking
      komt. Bij inwilliging van de aanvraag ontstaat de aanspraak op bekostiging met ingang van het kalenderjaar
      daaropvolgend.

      2 Bekostiging van een beroepsopleiding vindt slechts plaats indien:

      a. de beroepsopleiding wordt aangeboden door een instelling in stand gehouden door een rechtspersoon met volledige
      rechtsbevoegdheid die niet het maken van winst tot oogmerk heeft,

      b. er maatschappelijke behoefte aan de beroepsopleiding bestaat,

      c. er arbeidsmarktperspectieven zijn voor afgestudeerden,

      d. de inhoud van de beroepsopleiding bijdraagt aan een duurzame en brede beroepskwalificatie, alsmede

      e. de beroepsopleiding bijdraagt aan het tot stand komen van een samenhangend aanbod met het voorbereidend
      middelbaar beroepsonderwijs dat wordt bekostigd op grond van de [Wet voortgezet onderwijs 2020][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel1.4.1
      [ref2]: https://wetten.overheid.nl/BWBR0044212
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel2.1.1
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: 1.4.1
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0044212
  - number: 2.1.2
    text: |-
      1 De aanspraak op bekostiging voor een beroepsopleiding eindigt van rechtswege met ingang van het tijdstip waarop
      de erkenning ten aanzien van die opleiding is ingetrokken.

      2 Onze Minister kan, de eilandsraad gehoord, besluiten dat een beroepsopleiding, verzorgd door een instelling, niet
      meer voor bekostiging in aanmerking komt, indien mede gezien de arbeidsmarktomstandigheden niet langer sprake is
      van voldoende behoefte aan die opleiding.

      3 Bij een besluit als bedoeld in het eerste lid bepaalt Onze Minister het tijdstip waarop de aanspraak
      op bekostiging voor een bepaalde beroepsopleiding ontnomen wordt zodanig dat de ingeschreven studenten de
      beroepsopleiding waarvoor zij zijn ingeschreven, aan dezelfde of aan een andere instelling binnen een redelijke
      tijd kunnen voltooien.
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel2.1.2
  - number: 2.2.1
    text: |-
      1 De rijksbijdrage voor beroepsopleidingen waarop de in [artikel 2.1.1, eerste lid][ref1], bedoelde aanspraak
      betrekking heeft, wordt per instelling berekend en bestaat uit een bedrag per student, waarbij onderscheid kan
      worden gemaakt naar leerweg.

      2 De rijksbijdrage is bestemd voor kosten voor personeel en exploitatie van een instelling. De bekostiging
      wordt per instelling berekend aan de hand van een bij of krachtens algemene maatregel van bestuur vastgestelde
      berekeningswijze.

      3 De rijksbijdrage wordt verstrekt voor:

      a. personeel wegens voorschriften die zijn gegeven bij of krachtens de [Ambtenarenwet BES][ref2],

      b. onderhoud en vervanging van inventaris,

      c. onderhoud van gebouwen en terreinen,

      d. energie,

      e. administratie, beheer en bestuur,

      f. schoonmaken,

      g. heffingen

      h. inkoop van diensten,

      i. loopbaanoriëntatie en -begeleiding,

      j. studenten met een handicap of chronische ziekte, alsmede

      k. zorg voor studenten met specifieke onderwijsbehoefte te verlenen door de instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel2.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0028215
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: 2.1.1
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0028215
  - number: 2.2.2
    text: |-
      1 De in [artikel 2.2.1][ref1] bedoelde berekeningswijze bevat voor elke instelling en elke beroepsopleiding een
      gelijkelijk geldende maatstaf.

      2 De maatstaf voorziet in bekostiging aan de hand van de instroom van studenten.

      3 Bij ministeriële regeling worden jaarlijks voor 1 oktober de bedragen, bedoeld in
      [artikel 2.2.1, eerste lid][ref2], vastgesteld, die per leerweg kunnen verschillen en worden nadere regels gesteld
      over de wijze waarop de hoogte van de bekostiging wordt berekend.

      4 Voor de toepassing van de maatstaf, bedoeld in het tweede lid, geldt inschrijving van een student voor twee of
      meer voltijdse dan wel twee of meer deeltijdse beroepsopleidingen in enig studiejaar als inschrijving voor één
      voltijdse respectievelijk één deeltijdse beroepsopleiding. Inschrijving van een student voor zowel voltijdse als
      deeltijdse beroepsopleidingen in enig studiejaar geldt voor de toepassing van die maatstaf als inschrijving voor
      een voltijdse opleiding.

      5 Bij de toepassing van de maatstaf, bedoeld in het tweede lid, blijven buiten beschouwing studenten aan een
      deeltijdse opleiding waarvoor het bevoegd gezag een in instellingstijd verzorgd onderwijsprogramma, met inbegrip
      van de beroepspraktijkvorming, heeft ingericht dat minder dan 300 uren per volledig studiejaar omvat.

      6 In de maatstaf, bedoeld in het tweede lid, kan onderscheid worden gemaakt naar groepen van studenten
      en naar opleidingen. De maatstaf, bedoeld in het tweede lid, kan verschillend worden vastgesteld voor
      opleidingen die worden verzorgd door een instelling die deel uitmaakt van een scholengemeenschap als bedoeld in
      [artikel 1.1 van de Wet voortgezet onderwijs 2020][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel2.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel2.2.1
      [ref3]: https://wetten.overheid.nl/BWBR0044212#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0028395/2026-01-01#Artikel2.2.2
    references:
