  - number: 8.0.3
    text: |-
      1 Een betrokkene die uiterlijk 1 april is aangemeld in overeenstemming met [artikel 8.0.1, eerste lid][ref1],
      heeft desgevraagd recht op een studiekeuzeadvies.

      Dit recht geldt alleen als betrokkene deelneemt aan de intakeactiviteiten die het bevoegd gezag met het oog op dit
      studiekeuzeadvies organiseert.

      2 Bij ministeriële regeling kan een maximum aantal studiekeuzeadviezen worden vastgesteld waarop de betrokkene
      recht heeft.

      3 Het bevoegd gezag kan intakeactiviteiten organiseren en aan de hand daarvan een studiekeuzeadvies uitbrengen ten
      behoeve van andere dan de in het eerste lid bedoelde betrokkenen.

      4 De studiekeuzeadviezen, bedoeld in het eerste en tweede lid, zijn niet bindend.

      5 Het bevoegd gezag stelt ter uitvoering van dit artikel nadere regels vast die in elk geval betrekking hebben op
      de intakeactiviteiten die door de instelling, al dan niet per opleiding worden georganiseerd, de aard en inhoud van
      de intakeactiviteiten, de termijn waarbinnen de intakeactiviteiten plaatsvinden en de gevallen waarin, de termijn
      waarbinnen en de wijze waarop studiekeuzeadviezen wordt uitgebracht.

      6 Het bevoegd gezag van een instelling op Bonaire, Sint Eustatius en Saba treft voor inwoners van een land dat
      behoort tot het Koninkrijk der Nederlanden, die zich als deelnemer hebben aangemeld maar niet woonachtig zijn op
      het desbetreffende eiland, zodanige voorzieningen dat zij kunnen deelnemen aan de intakeactiviteiten zonder dat hun
      fysieke aanwezigheid op de instelling vereist is. Deze voorzieningen maken deel uit van de nadere regels, bedoeld
      in het vijfde lid.

      7 Het bevoegd gezag stelt de in het vijfde lid bedoelde informatie voor een ieder beschikbaar uiterlijk 1 februari
      voorafgaand aan het studiejaar waarvoor deze geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel8.0.1
