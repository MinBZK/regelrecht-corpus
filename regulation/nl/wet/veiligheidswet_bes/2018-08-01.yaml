  - number: '2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur op voordracht van Onze Ministers worden nadere regels gesteld
      over de inrichting en organisatie van het politiekorps, waarbij in ieder geval wordt voorzien in de taakgebieden,
      genoemd in [artikel 7, tweede lid, onder a tot en met d, van de rijkswet][ref1], alsmede in een meldkamerfunctie
      ten behoeve van de politietaak.


      [ref1]: https://wetten.overheid.nl/BWBR0028079#Artikel7
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028079
        artikel: '7'
  - number: '3'
    text: |-
      Zij die op grond van [artikel 185 van het Wetboek van Strafvordering BES][ref1] en de buitengewone agenten van
      politie die tot opsporing van strafbare feiten bevoegd zijn, werken samen met de politie.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel185
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '185'
  - number: '4'
    text: |-
      Bij algemene maatregel van bestuur op voordracht van Onze Ministers worden regels gesteld over de taken die kunnen
      worden uitgevoerd door ambtenaren als bedoeld in [artikel 3, onder c, van de rijkswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028079#Artikel3
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028079
        artikel: '3'
  - number: '5.1'
    text: |-
      Aan de Koninklijke marechaussee zijn, onverminderd het bepaalde bij of krachtens andere wetten, de volgende
      politietaken opgedragen:
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel5
  - number: 5.1.a
    text: |-
      het waken voor de veiligheid van de leden van het Koninklijk Huis, in samenwerking met andere daartoe aangewezen
      organen;
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel5
  - number: 5.1.b
    text: |-
      de uitvoering van de politietaak ten behoeve van de Nederlandse en andere strijdkrachten en ten aanzien van tot die
      strijdkrachten behorende personen;
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel5
  - number: 5.1.c
    text: |-
      de uitvoering van de politietaak op de door Onze Ministers en Onze Minister van Defensie aangewezen luchthavens op
      Bonaire, Sint Eustatius en Saba alsmede de beveiliging van de burgerluchtvaart;
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel5
  - number: 5.1.d
    text: |-
      de verlening van bijstand alsmede de samenwerking met de politie krachtens deze wet, daaronder begrepen de
      assistentieverlening aan de politie bij de bestrijding van grensoverschrijdende criminaliteit;
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel5
  - number: 5.1.e
    text: |-
      de uitvoering van de politietaak op plaatsen onder beheer van Onze Minister van Defensie en op verboden plaatsen
      die krachtens de [Wet bescherming staatsgeheimen][ref1] ten behoeve van de landsverdediging zijn aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0002074
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002074
  - number: 5.1.f
    text: |-
      de uitvoering van de bij of krachtens de [Wet toelating en uitzetting BES][ref1] opgedragen taken, waaronder
      begrepen de bediening van de daartoe door Onze Minister van Justitie aangewezen doorlaatposten en het, voor zover
      in dat verband noodzakelijk, uitvoeren van de politietaak op en nabij deze doorlaatposten, alsmede het verlenen van
      medewerking bij de aanhouding of voorgeleiding van een verdachte of veroordeelde;


      [ref1]: https://wetten.overheid.nl/BWBR0028571
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028571
  - number: 5.1.g
    text: de bestrijding van mensensmokkel en van fraude met reis- en identiteitsdocumenten;
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel5
  - number: 5.1.h
    text: |-
      het in opdracht van Onze Ministers van Justitie en van Defensie ten behoeve van De Nederlandse Bank N.V. verrichten
      van beveiligingswerkzaamheden;
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel5
  - number: 5.1.i
    text: de uitvoering van de politietaak in Sint Eustatius en Saba onverminderd de politietaken van het politiekorps.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel5
  - number: '5.2'
    text: |-
      Onder personen die behoren tot de andere strijdkrachten, bedoeld in het eerste lid, onder b, worden mede begrepen
      personen, aangewezen bij algemene maatregel van bestuur op voordracht van Onze Minister van Defensie.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel5
  - number: '5.3'
    text: |-
      Onze Minister van Justitie kan de commandant van de Koninklijke marechaussee de nodige algemene en bijzondere
      aanwijzingen geven, voor zover het betreft:
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel5
  - number: 5.3.a
    text: de uitoefening van de taken, bedoeld in het eerste lid, onder a en h;
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel5
  - number: 5.3.b
    text: |-
      het waken voor de veiligheid van door Onze Minister van Justitie aangewezen personen als bedoeld in het eerste lid,
      onder b;
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel5
  - number: 5.3.c
    text: |-
      de uitoefening van de taak, bedoeld in het eerste lid, onder c, ten behoeve van de strafrechtelijke handhaving van
      de rechtsorde en de beveiliging van de burgerluchtvaart.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel5
  - number: '5.4'
    text: |-
      De politietaak, bedoeld in het eerste lid, onder i, wordt uitgevoerd onder verantwoordelijkheid van de korpschef.
      Hij bepaalt, na overleg met de commandant van de Koninklijke marechaussee, de inzet van de militairen van de
      Koninklijke marechaussee.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel5
  - number: '5.5'
    text: |-
      De Koninklijke marechaussee is tevens belast met de informatievoorziening ten behoeve van de
      opsporing van misdrijven door de Kustwacht voor Aruba, Curaçao en Sint Maarten alsmede voor de
      openbare lichamen Bonaire, Sint Eustatius en Saba, voor zover het betreft misdrijven als bedoeld in
      [artikel 10, eerste lid, onder a, van de Wet politiegegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel10
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '10'
  - number: '6.1'
    text: |-
      Behoeft de gezaghebber bij de handhaving van de openbare orde bijstand van een onderdeel van de krijgsmacht, dan
      richt hij een verzoek daartoe aan de Rijksvertegenwoordiger. De Rijksvertegenwoordiger richt zich met het verzoek
      tot Onze Minister van Defensie.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel6
  - number: '6.2'
    text: |-
      Onze Minister van Defensie verleent, na overleg met Onze Minister en, indien het mede betrekking heeft op de
      strafrechtelijke handhaving van de rechtsorde dan wel de taken ten dienste van de justitie, met Onze Minister van
      Justitie, bijstand door de Koninklijke marechaussee, tenzij dringende reden zich daartegen verzetten.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel6
  - number: '6.3'
    text: |-
      In bijzondere gevallen verleent Onze Minister van Defensie, na overleg met Onze Minister en, indien het mede
      betrekking heeft op de strafrechtelijke handhaving van de rechtsorde dan wel de taken ten dienste van de justitie,
      met Onze Minister van Justitie, bijstand door andere onderdelen van de krijgsmacht.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel6
  - number: '6.4'
    text: |-
      De gezaghebber bepaalt, in overeenstemming met Onze Minister van Defensie, de wijze waarop de bijstand wordt
      verleend.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel6
  - number: '7.1'
    text: |-
      Behoeft de procureur-generaal voor de strafrechtelijke handhaving van de rechtsorde dan wel voor het verrichten van
      taken ten dienste van de justitie bijstand van een onderdeel van de krijgsmacht, dan richt hij door tussenkomst van
      de Rijksvertegenwoordiger een verzoek daartoe aan Onze Minister van Defensie.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel7
  - number: '7.2'
    text: |-
      Onze Minister van Defensie verleent, na overleg met Onze Minister van Justitie en, indien het mede betrekking
      heeft op de handhaving van de openbare orde, met Onze Minister, bijstand door de Koninklijke marechaussee, tenzij
      dringende reden zich daartegen verzetten.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel7
  - number: '7.3'
    text: |-
      In bijzondere gevallen verleent Onze Minister van Defensie, na overleg met Onze Minister van Justitie en, indien
      het mede betrekking heeft op de handhaving van de openbare orde, met Onze Minister, bijstand door andere onderdelen
      van de krijgsmacht.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel7
  - number: '7.4'
    text: |-
      De procureur-generaal bepaalt, in overeenstemming met Onze Minister van Defensie, op welke wijze bijstand wordt
      verleend.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel7
  - number: '7.5'
    text: |-
      Behoeft de procureur-generaal bijstand door een bijstandseenheid als bedoeld in
      [artikel 59, eerste lid, van de Politiewet 2012][ref1], dan richt hij door tussenkomst van de
      Rijksvertegenwoordiger een verzoek daartoe aan Onze Minister van Justitie. Artikel 59, derde, vierde en vijfde lid,
      van de Politiewet 2012 is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel59
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '59'
  - number: '8.1'
    text: |-
      Voor zover de Koninklijke marechaussee optreedt ter handhaving van de openbare orde staat zij onder gezag van de
      gezaghebber. Voor zover de Koninklijke marechaussee optreedt ter strafrechtelijke handhaving van de rechtsorde dan
      wel taken verricht ten dienste van de justitie, staat zij onder gezag van de procureur-generaal, tenzij in enige
      wet anders is bepaald. Het hoofd van het onderdeel van de Koninklijke marechaussee neemt deel aan het overleg,
      bedoeld in [artikel 19 van de rijkswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028079#Artikel19
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028079
        artikel: '19'
  - number: '8.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de militair van enige ander onderdeel van de krijgsmacht,
      indien hij bijstand verleent aan de politie.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel8
  - number: '9.1'
    text: |-
      In bijzondere gevallen kan door het politiekorps bijstand worden verleend aan de Koninklijke marechaussee met
      inachtneming van het tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel9
  - number: '9.2'
    text: |-
      Behoeft de Koninklijke marechaussee bijstand van het politiekorps voor de handhaving van de openbare orde, dan
      richt Onze Minister van Defensie op aanvraag van de gezaghebber een verzoek daartoe door tussenkomst van de
      Rijksvertegenwoordiger aan Onze Minister. Onze Minister treft de nodige voorzieningen en stelt Onze Ministers van
      Defensie en van Justitie hiervan in kennis.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel9
  - number: '9.3'
    text: |-
      Behoeft de Koninklijke marechaussee bijstand van het politiekorps voor de strafrechtelijke handhaving van de
      rechtsorde dan wel voor het verrichten van taken ten dienste van de justitie, dan richt Onze Minister van Defensie
      op aanvraag van de hoofdofficier van justitie een verzoek daartoe aan de procureur-generaal. De procureur-generaal
      brengt de aanvraag ter kennis van Onze Minister, die de nodige voorzieningen treft en Onze Ministers van Defensie
      en van Justitie daarvan in kennis stelt.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel9
  - number: '10.1'
    text: |-
      Onze Ministers gezamenlijk kunnen objecten en diensten aanwijzen waarvan bewaking en beveiliging door de
      politie noodzakelijk is in het belang van de veiligheid van de Staat of de betrekkingen van Nederland met andere
      mogendheden, dan wel met het oog op zwaarwegende belangen van de samenleving.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel10
  - number: '10.2'
    text: |-
      De gezaghebber draagt zorg voor de uitvoering van een besluit als bedoeld in het eerste lid voor zover dat
      geschiedt ter handhaving van de openbare orde.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel10
  - number: '10.3'
    text: |-
      De procureur-generaal draagt zorg voor de uitvoering van een besluit als bedoeld in het eerste lid voor zover dat
      geschiedt ter strafrechtelijke handhaving van de rechtsorde.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel10
  - number: '11.1'
    text: |-
      De ambtenaren die door Onze Minister van Justitie zijn aangewezen voor het vervoer van rechtens van hun vrijheid
      beroofde personen, kunnen de bevoegdheden, bedoeld in [artikel 13, eerste en vierde lid, van de rijkswet][ref1],
      uitoefenen dan wel de maatregelen treffen die worden genoemd in de algemene maatregel van bestuur, bedoeld in
      [artikel 14, derde lid, van de rijkswet][ref2], voor zover dit noodzakelijk is met het oog op de voorkoming van
      het zich onttrekken van de te vervoeren persoon aan het op hem uitgeoefende toezicht. De eerste volzin is van
      toepassing voor zover de rechtens van hun vrijheid beroofde personen zijn ondergebracht bij de politie of de
      Koninklijke marechaussee.


      [ref1]: https://wetten.overheid.nl/BWBR0028079#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0028079#Artikel14
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028079
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0028079
        artikel: '14'
  - number: '11.2'
    text: |-
      De algemene maatregel van bestuur, bedoeld in [artikel 14, derde lid, van de rijkswet][ref1], is van
      overeenkomstige toepassing op personen die ten behoeve van de hulpverlening aan hen zijn ondergebracht bij de
      politie of de Koninklijke marechaussee.


      [ref1]: https://wetten.overheid.nl/BWBR0028079#Artikel14
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028079
        artikel: '14'
  - number: '12'
    text: |-
      De Rijksvertegenwoordiger geeft, indien een ordeverstoring van boveneilandelijke betekenis dan wel ernstige vrees
      voor het ontstaan daarvan zulks noodzakelijk maakt, de gezaghebber, zoveel mogelijk na overleg met hem, de nodige
      aanwijzingen met betrekking tot het door hem ter handhaving van de openbare orde te voeren beleid. De aanwijzingen
      worden zo enigszins mogelijk schriftelijk gegeven.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel12
  - number: '13.1'
    text: |-
      Ten behoeve van de toepassing van de [artikelen 10, tweede lid][ref1], en [12][ref2] verstrekken de gezaghebbers,
      de Rijksvertegenwoordiger en Onze Minister elkaar de gewenste inlichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0028586#Artikel12
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028586
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '13.2'
    text: Onze Minister kan regels geven ter uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel13
  - number: '14.1'
    text: |-
      Het politiekorps registreert gegevens voor door Onze Ministers te bepalen doeleinden en door hen te bepalen
      categorieën dan wel in door hen aan te wijzen wettelijk geregelde registers en verstrekt deze gegevens aan door hen
      aan te wijzen personen en instanties, onverminderd het bepaalde bij of krachtens de [Wet politiegegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022463
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0022463
  - number: '14.2'
    text: |-
      Onze Ministers kunnen bepalen dat in door hen aan te wijzen registers geen andere dan de in het eerste lid bedoelde
      gegevens worden geregistreerd en dat door hen aan te wijzen categorieën van gegevens in geen andere dan door hen
      aan te wijzen registers worden geregistreerd.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel14
  - number: '14.3'
    text: |-
      Bij algemene maatregel van bestuur op voordracht van Onze Ministers worden met inachtneming van de onderlinge
      regeling, bedoeld in [artikel 39, tweede lid, van de rijkswet][ref1], regels gesteld over de wijze waarop gegevens,
      bedoeld in het eerste lid, worden verwerkt en op welke wijze bestandsvergelijking met die gegevens plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0028079#Artikel39
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0028079
        artikel: '39'
  - number: '15'
    text: Bij regeling van Onze Minister worden regels gesteld over de kleding van de politie.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel15
  - number: '16.1'
    text: |-
      Bij regeling van Onze Minister worden nadere regels gesteld over de behandeling van klachten over gedragingen van
      ambtenaren van politie.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel16
  - number: '16.2'
    text: 'In de regels, bedoeld in het eerste lid, wordt voorzien in:'
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel16
  - number: 16.2.a
    text: |-
      de instelling van een commissie, bestaande uit onafhankelijke leden, die op de wijze in de regeling te bepalen is
      belast met de behandeling van en advisering over in de regeling aangewezen categorieën van klachten, waarbij zo
      nodig aandacht wordt geschonken aan de in onderdeel c genoemde aspecten;
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel16
  - number: 16.2.b
    text: |-
      de registratie van de mondeling en schriftelijk ingediende klachten en, indien beschikbaar, de daarop genomen
      beslissingen, alsmede
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel16
  - number: 16.2.c
    text: |-
      een jaarlijkse publicatie van de geregistreerde klachten en beslissingen, waarin wordt aangegeven in hoeverre
      klachten wijzen op structurele tekortkomingen in het functioneren van de politie en waarin, zo nodig, aandacht
      wordt geschonken aan de middelen om deze tekortkomingen op te heffen.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel16
  - number: '16.3'
    text: |-
      [Afdeling 9.1.3 van de Algemene wet bestuursrecht][ref1] is van toepassing op de behandeling van klachten als
      bedoeld in het tweede lid, onder a. Indien een commissie over de klacht zal adviseren, deelt de korpschef dit,
      in afwijking van [artikel 9:15, eerste lid, van de Algemene wet bestuursrecht][ref2], zo spoedig mogelijk aan de
      indiener van de klacht mede.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling9.1.3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel9
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 9.1.3
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '9'
  - number: '17.1'
    text: |-
      Bij regeling van Onze Ministers worden nadere regels gesteld ten aanzien van de behandeling van klachten over
      gedragingen van buitengewone agenten van politie.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel17
  - number: '17.2'
    text: |-
      Bij regeling van Onze Minister van Defensie worden nadere regels gesteld ten aanzien van de behandeling van
      klachten over gedragingen van militairen van de Koninklijke marechaussee dan wel van enig ander onderdeel van de
      krijgsmacht bij de uitvoering van hun in deze wet omschreven taken.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel17
  - number: '17.3'
    text: |-
      [Artikel 16, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel16
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '18.1'
    text: |-
      De korpsbeheerder politie draagt zorg voor de behandeling van een klacht die is ingediend over een gedraging van de
      ambtenaar van politie, aangesteld bij het politiekorps.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel18
  - number: '18.2'
    text: |-
      Onze Minister, in overeenstemming met Onze Minister van Justitie, draagt zorg voor de behandeling van een klacht
      die is ingediend over een gedraging van een buitengewoon agent van politie.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel18
  - number: '18.3'
    text: |-
      Onze Minister van Defensie draagt zorg voor de behandeling van een klacht die is ingediend over een gedraging van
      een militair van de Koninklijke marechaussee dan wel van enig ander onderdeel van de krijgsmacht bij de uitvoering
      van zijn in deze wet omschreven taken.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel18
  - number: '19.1'
    text: |-
      Een klacht over een gedraging van een ambtenaar van politie, een buitengewoon agent van politie of van een militair
      van de Koninklijke marechaussee dan wel van enig ander onderdeel van de krijgsmacht bij de uitvoering van zijn in
      deze wet omschreven taken, wordt ingediend bij de korpsbeheerder politie.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel19
  - number: '19.2'
    text: |-
      Een klacht over een gedraging van een buitengewoon agent van politie kan ook worden ingediend bij Onze Minister
      van Justitie.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel19
  - number: '19.3'
    text: |-
      Een klacht over een gedraging van een militair van de Koninklijke marechaussee dan wel enig ander onderdeel van
      de krijgsmacht bij de uitvoering van zijn in deze wet omschreven taken, kan ook worden ingediend bij Onze Minister
      van Defensie.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel19
  - number: '19.4'
    text: |-
      De korpsbeheerder politie draagt zorg voor een onverwijlde doorzending van een klacht als bedoeld in het tweede en
      derde lid aan Onze Minister van Justitie respectievelijk Onze Minister van Defensie.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel19
  - number: '19.5'
    text: |-
      Na ontvangst van de klacht wordt een afschrift ervan gezonden aan de gezaghebber van het openbaar lichaam waar de
      gedraging waarover wordt geklaagd, heeft plaatsgevonden, alsmede aan de hoofdofficier van justitie. De gezaghebber
      en de hoofdofficier van justitie worden in de gelegenheid gesteld over de klacht advies uit te brengen.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel19
  - number: '20'
    text: |-
      In afwijking van [artikel 9:11, eerste lid, van de Algemene wet bestuursrecht][ref1] wordt de klacht afgehandeld
      binnen tien weken of, indien een commissie als bedoeld in [artikel 16, tweede lid, onder a][ref2], is belast met de
      behandeling van en advisering over de klacht, binnen veertien weken na de ontvangst van de klacht.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0028586#Artikel16
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0028586
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '21.1'
    text: |-
      Onze Minister is belast met het aanstellen, bevorderen, schorsen en ontslaan van ambtenaren van politie, met
      dien verstande dat plaatsing van ambtenaren van politie die uitsluitend of in hoofdzaak belast zijn met de
      strafrechtelijke handhaving van de rechtsorde dan wel het verrichten van taken ten dienste van de justitie, niet
      geschiedt dan na overleg met de procureur-generaal. Indien de taakvervulling van een zodanige ambtenaar van politie
      dit naar het oordeel van de procureur-generaal noodzakelijk maakt, draagt de korpsbeheerder politie voor vervanging
      zorg.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel21
  - number: '21.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur op voordracht van Onze Minister worden voor de politie regels
      gesteld over:
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel21
  - number: 21.2.a
    text: de rechtspositie van de ambtenaren van politie;
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel21
  - number: 21.2.b
    text: de keuring en de controle op de lichamelijke en geestelijke geschiktheid van ambtenaren van politie.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel21
  - number: '22.1'
    text: |-
      Het lid van de leiding van het politiekorps dat in het bijzonder verantwoordelijk is voor de recherchefunctie,
      wordt benoemd, geschorst en ontslagen bij koninklijk besluit op voordracht van Onze Minister, in overeenstemming
      met Onze Minister van Justitie, gehoord de procureur-generaal.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel22
  - number: '22.2'
    text: |-
      Bij algemene maatregel van bestuur op voordracht van Onze Minister wordt bepaald welke andere ambtenaren van
      politie die deel uitmaken van de leiding van het politiekorps, worden benoemd, geschorst en ontslagen bij
      koninklijk besluit op voordracht van Onze Minister, in overeenstemming met Onze Minister van Justitie, gehoord de
      procureur-generaal.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel22
  - number: '22.3'
    text: |-
      Bij algemene maatregel van bestuur op voordracht van Onze Minister kan worden bepaald welke andere ambtenaren van
      politie dan die bedoeld in het eerste en tweede lid, worden benoemd, geschorst en ontslagen bij koninklijk besluit.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel22
  - number: '23.1'
    text: |-
      De korpschef stelt na overleg met de hoofdofficier van justitie en de gezaghebbers, in overeenstemming met de
      procureur-generaal en met inachtneming van [artikel 24, vierde lid][ref1], ten minste eenmaal in de vier jaar
      het ontwerp van het beheersplan voor het politiekorps op. Voorafgaand aan het opstellen van het ontwerp van het
      beheersplan worden de eilandsraden gehoord over de lokale prioriteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel24
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '24'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '23.2'
    text: |-
      De korpschef zendt het ontwerp van het beheersplan ter vaststelling aan de korpsbeheerder politie. De korpschef
      zendt de stukken ter kennisneming aan de eilandsraden, de Rijksvertegenwoordiger, de procureur-generaal en de
      hoofdofficier van justitie.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel23
  - number: '23.3'
    text: |-
      Indien de in het eerste lid vereiste overeenstemming niet kan worden bereikt, legt de korpschef de verschillen
      in zienswijze schriftelijk vast. Onze Minister beslist daarop, in overeenstemming met Onze Minister van Justitie,
      gehoord de procureur-generaal. De korpschef brengt de stukken in overeenstemming met de beslissing van Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel23
  - number: '23.4'
    text: De korpsbeheerder politie stelt, in overeenstemming met Onze Minister van Justitie, het beheersplan vast.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel23
  - number: '23.5'
    text: |-
      Zodra het beheersplan is vastgesteld, zendt de korpschef dit aan de eilandsraden, de Rijksvertegenwoordiger, de
      procureur-generaal en de hoofdofficier van justitie.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel23
  - number: '23.6'
    text: |-
      De korpsbeheerder politie nodigt de hoofdofficier van justitie en de gezaghebbers uit deel te nemen aan het overleg
      over het beheer van de politie, bedoeld in [artikel 48, vijfde lid, van de rijkswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028079#Artikel48
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0028079
        artikel: '48'
  - number: '24.1'
    text: |-
      Onze Ministers stellen ten minste eenmaal in de vier jaar de hoofdlijnen vast met betrekking tot het te voeren
      beleid ten aanzien van de taakuitvoering van de politie en het te voeren beheer van de politie voor de eerstkomende
      vier jaar.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel24
  - number: '24.2'
    text: |-
      Zodra de hoofdlijnen, bedoeld in het eerste lid, zijn vastgesteld, doen Onze Ministers hiervan mededeling door
      overlegging ervan aan de Staten-Generaal en door toezending ervan aan de korpsbeheerder politie, de procureur-
      generaal, de hoofdofficier van justitie en de korpschef.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel24
  - number: '24.3'
    text: |-
      Op basis en binnen het kader van de hoofdlijnen, bedoeld in het eerste lid, stellen Onze Ministers ten minste
      eenmaal in de vier jaar doelstellingen vast ter verwezenlijking van voornoemde hoofdlijnen. Voor zover het de
      strafrechtelijke handhaving van de rechtsorde betreft dan wel de vervulling van taken ten dienste van de justitie,
      wint Onze Minister van Justitie voorafgaand het advies in van de procureur-generaal.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel24
  - number: '24.4'
    text: |-
      In het beheersplan, bedoeld in [artikel 23][ref1], wordt aangegeven op welke wijze wordt beoogd de doelstellingen
      te verwezenlijken.


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel23
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '24.5'
    text: |-
      De resultaten die in het voorafgaande jaar zijn behaald met de verwezenlijking van de doelstellingen, maken deel
      uit van het jaarplan, bedoeld in [artikel 48 van de rijkswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028079#Artikel48
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0028079
        artikel: '48'
  - number: '24.6'
    text: |-
      Bij regeling van Onze Minister, in overeenstemming met Onze Minister van Justitie, kunnen regels worden gesteld
      over de uitvoering van het derde, vierde en vijfde lid.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel24
  - number: '26'
    text: De korpsbeheerder politie hanteert voor het politiekorps een kwaliteitszorgsysteem.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel26
  - number: '27.1'
    text: |-
      Er is een brandweerkorps voor de openbare lichamen. Het brandweerkorps heeft vestigingen in elk van de openbare
      lichamen.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel27
  - number: '27.2'
    text: 'Het brandweerkorps heeft in elk van de openbare lichamen in ieder geval tot taak:'
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel27
  - number: 27.2.a
    text: |-
      het voorkomen, beperken en bestrijden van brand, het beperken van brandgevaar, het voorkomen en beperken van
      ongevallen bij brand en al hetgeen daarmee verband houdt;
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel27
  - number: 27.2.b
    text: het beperken en bestrijden van gevaar voor mensen en dieren bij ongevallen anders dan bij brand;
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel27
  - number: 27.2.c
    text: het verkennen van gevaarlijke stoffen en het verrichten van ontsmetting;
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel27
  - number: 27.2.d
    text: |-
      het adviseren van het bevoegd gezag op het gebied van brandpreventie, brandbestrijding en het voorkomen, beperken
      en bestrijden van ongevallen met gevaarlijke stoffen.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel27
  - number: '27.3'
    text: |-
      Het brandweerkorps voert tevens taken uit bij rampen en crises in het kader van rampenbestrijding en
      crisisbeheersing.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel27
  - number: '27.4'
    text: Het beheer over het brandweerkorps berust bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel27
  - number: '27.5'
    text: |-
      Aan het hoofd van het brandweerkorps staat een algemeen commandant, die belast is met de dagelijkse leiding van
      het korps.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel27
  - number: '27.6'
    text: |-
      Aan het hoofd van elke vestiging staat een lokaal commandant die belast is met de dagelijkse leiding van die
      vestiging. De lokaal commandant staat onder het gezag van de algemeen commandant.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel27
  - number: '27.7'
    text: |-
      De korpsbeheerder brandweer stelt in een instructie nadere regels met betrekking tot de taken en bevoegdheden van
      de algemeen commandant en de lokaal commandanten.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel27
  - number: '27.8'
    text: |-
      Door de korpsbeheerder brandweer wordt een meldkamer ten behoeve van de brandweertaak ingesteld en in stand
      gehouden.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel27
  - number: '27.9'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de inrichting en organisatie van het
      brandweerkorps.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel27
  - number: '28.1'
    text: |-
      Het brandweerkorps verricht in elk van de openbare lichamen de taken, bedoeld in
      [artikel 27, tweede lid, onder a tot en met d][ref1], tevens op de luchthaven.


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel27
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '27'
        hoofdstuk: '3'
  - number: '28.2'
    text: |-
      Het brandweerkorps brengt de kosten voor de brandweer op en rond de luchthaven in rekening bij de exploitant van
      het luchthaventerrein.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel28
  - number: '28.3'
    text: Bij regeling van Onze Minister worden regels gesteld over de berekening van de kosten, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel28
  - number: '29.1'
    text: |-
      De algemeen commandant stelt na overleg met de lokaal commandanten ten minste eenmaal in de vier jaar het ontwerp-
      beheersplan en jaarlijks het ontwerp-jaarplan met een daarbij behorende begroting op. Voorafgaand aan het opstellen
      van de plannen worden de bestuurscolleges gehoord.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel29
  - number: '29.2'
    text: |-
      De algemeen commandant zendt de stukken ter vaststelling toe aan de korpsbeheerder brandweer. De algemeen
      commandant zendt de stukken voorts ter kennisneming toe aan de bestuurscolleges en de Rijksvertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel29
  - number: '29.3'
    text: |-
      Zodra de stukken, bedoeld in het tweede lid, zijn vastgesteld, zendt de algemeen commandant deze toe aan de
      bestuurscolleges en Rijksvertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel29
  - number: '30.1'
    text: |-
      De algemeen commandant overlegt ten minste vier maal per jaar met elk van de bestuurscolleges en de lokaal
      commandant.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel30
  - number: '30.2'
    text: 'Het in het eerste lid bedoelde overleg vindt in elk geval plaats over:'
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel30
  - number: 30.2.a
    text: het ontwerp-jaarplan en de daarbij behorende begroting en het ontwerp-beheersplan;
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel30
  - number: 30.2.b
    text: |-
      de uitvoering van het beheersplan en de verwezenlijking van de doelstellingen, bedoeld in [artikel 41][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel41
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '41'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '31.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld betreffende de veiligheid,
      deugdelijkheid, normalisatie en standaardisatie van het brandweer- en reddingsmaterieel dat met het oog op gebruik
      in de openbare lichamen wordt vervaardigd, ingevoerd of in de handel gebracht.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel31
  - number: '31.2'
    text: |-
      Voor keuringen die krachtens een algemene maatregel van bestuur als bedoeld in het eerste lid worden verricht,
      kunnen overeenkomstig daarbij te stellen regels vergoedingen in rekening worden gebracht. Deze vergoedingen worden
      niet in rekening gebracht aan publiekrechtelijke lichamen.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel31
  - number: '32'
    text: De korpsbeheerder brandweer hanteert voor het brandweerkorps een kwaliteitszorgsysteem.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel32
  - number: '33.1'
    text: |-
      Onze Minister is belast met het aanstellen, bevorderen, schorsen en ontslaan van het personeel van het
      brandweerkorps.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel33
  - number: '33.2'
    text: 'Het personeel van het brandweerkorps bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel33
  - number: 33.2.a
    text: ambtenaren, aangesteld om bij wijze van beroep werkzaamheden bij het brandweerkorps te verrichten;
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel33
  - number: 33.2.b
    text: vrijwillige ambtenaren, aangesteld om werkzaamheden bij het brandweerkorps te verrichten.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel33
  - number: '33.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor het personeel van het brandweerkorps regels worden
      gesteld over:
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel33
  - number: 33.3.a
    text: de functies en rangen;
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel33
  - number: 33.3.b
    text: de eisen van aanstelling en bevordering;
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel33
  - number: 33.3.c
    text: de eisen met betrekking tot de keuring en de controle op lichamelijke en geestelijke geschiktheid;
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel33
  - number: 33.3.d
    text: de kleding en de uitrusting.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel33
  - number: '33.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voor het personeel, bedoeld in het eerste lid, regels
      gesteld over opleiden, examineren, bijscholen en oefenen.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel33
  - number: '33.5'
    text: |-
      Bij algemene maatregel van bestuur wordt gesteld welke brandweeropleidingen worden afgesloten met een Caribisch
      examen. Het algemeen bestuur van het Instituut Fysieke Veiligheid geeft het diploma af.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel33
  - number: '34.1'
    text: |-
      Bij regeling van Onze Minister worden nadere regels gesteld ten aanzien van de behandeling van klachten over
      gedragingen van het personeel van het brandweerkorps.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel34
  - number: '34.2'
    text: |-
      [Artikel 16, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel16
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '34.3'
    text: |-
      De korpsbeheerder brandweer draagt zorg voor de behandeling van een klacht die is ingediend over een gedraging van
      een personeelslid van het brandweerkorps. [Artikel 20][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel20
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '35.1'
    text: |-
      De [artikelen 68, eerste lid, onder a, b, c, d, e en f][ref1], en [70 van de Wet veiligheidsregio’s][ref2] zijn
      van toepassing in de openbare lichamen, met dien verstande dat in artikel 68, eerste lid, onder a en b, van die
      wet voor «een examen als bedoeld in artikel 18, vierde lid» wordt gelezen: een Caribisch examen als bedoeld in
      [artikel 33, vierde lid][ref3], van de Veiligheidswet BES.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0027466#Artikel70
      [ref3]: https://wetten.overheid.nl/BWBR0028586#Artikel33
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '68'
      - id: ref2
        bwb_id: BWBR0027466
        artikel: '70'
      - id: ref3
        bwb_id: BWBR0028586
        artikel: '33'
        hoofdstuk: '3'
  - number: '35.2'
    text: |-
      De vaststelling van de producten- en dienstencatalogus, bedoeld in
      [artikel 73, tweede lid, van de Wet veiligheidsregio’s][ref1], geschiedt in overeenstemming met de korpsbeheerder
      brandweer, voor zover daarbij ten aanzien van de in [artikel 68, eerste lid, onder a, van die wet][ref2] bedoelde
      opleidingen die worden afgesloten met een Caribisch examen, prijzen worden vastgesteld die afwijken van de prijzen
      in het Europese deel van Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0027466#Artikel68
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '73'
      - id: ref2
        bwb_id: BWBR0027466
        artikel: '68'
  - number: '35.3'
    text: |-
      [Artikel 73, vijfde tot en met zevende lid, van de Wet veiligheidsregio’s][ref1] is van toepassing, met dien
      verstande dat in die bepalingen in plaats van «besturen van de veiligheidsregio’s» wordt gelezen: bestuurscolleges
      van de openbare lichamen en de korpsbeheerder brandweer.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel73
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '73'
  - number: '37.1'
    text: 'Het bestuurscollege is belast met de organisatie van:'
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel37
  - number: 37.1.a
    text: de rampenbestrijding en de crisisbeheersing;
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel37
  - number: 37.1.b
    text: de geneeskundige hulpverlening.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel37
  - number: '37.2'
    text: Het bestuurscollege is belast met de brandweerzorg en bedient zich daarbij van het brandweerkorps.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel37
  - number: '37.3'
    text: 'Tot de brandweerzorg behoort:'
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel37
  - number: 37.3.a
    text: |-
      het voorkomen, beperken en bestrijden van brand, het beperken van brandgevaar, het voorkomen en beperken van
      ongevallen bij brand en al hetgeen daarmee verband houdt;
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel37
  - number: 37.3.b
    text: het beperken en bestrijden van gevaar voor mensen en dieren bij ongevallen anders dan bij brand.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel37
  - number: '37.4'
    text: |-
      Het bestuurscollege kan, in overeenstemming met de korpsbeheerder brandweer, een vestiging van het brandweerkorps
      belasten met andere taken dan bedoeld in [artikel 27, tweede en derde lid][ref1]. Deze taak wordt uitgevoerd onder
      verantwoordelijkheid van het bestuurscollege.


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel27
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '27'
        hoofdstuk: '3'
  - number: '38'
    text: |-
      De gezaghebber kan degene die verantwoordelijk is voor het vervoer van zieken en gewonden, aanwijzingen geven
      indien dat naar zijn oordeel noodzakelijk is uit een oogpunt van openbare orde.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel38
  - number: '39.1'
    text: |-
      De eilandsraad stelt voor het openbaar lichaam in een brandbeveiligingsverordening regels over het voorkomen,
      beperken en bestrijden van brand, het beperken van brandgevaar, het voorkomen en beperken van ongevallen bij brand
      en al hetgeen daarmee verband houdt. Voorafgaand aan het vaststellen van de brandbeveiligingsverordening wordt de
      algemeen commandant van het brandweerkorps gehoord.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel39
  - number: '39.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen met het oog op uniformiteit regels worden gesteld over de inhoud van de
      brandbeveiligingsverordening.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel39
  - number: '40.1'
    text: |-
      Het bestuurscollege kan een inrichting die in geval van een brand of ongeval bijzonder gevaar kan opleveren voor de
      openbare veiligheid aanwijzen als bedrijfsbrandweerplichtig.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel40
  - number: '40.2'
    text: |-
      In afwijking van het eerste lid vindt de aanwijzing plaats door Onze Minister indien het een inrichting betreft
      die is gelegen op of deel uitmaakt van een terrein dat bij de krijgsmacht in gebruik is, voor zover er gegevens
      in het geding zijn waarvan de geheimhouding door het belang van de veiligheid van de Staat is geboden. Voordat een
      aanwijzing plaatsvindt, hoort Onze Minister het hoofd of de bestuurder van de inrichting.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel40
  - number: '40.3'
    text: |-
      Het hoofd of de bestuurder van een aangewezen inrichting draagt er zorg voor dat in een inrichting kan worden
      beschikt over een bedrijfsbrandweer, die voldoet aan de bij de aanwijzing gestelde eisen inzake personeel en
      materieel.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel40
  - number: '40.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt bepaald welke categorieën inrichtingen kunnen worden
      aangewezen en op welke wijze tot de aanwijzing kan worden besloten, en kan worden bepaald aan welke eisen het
      personeel en het materiaal moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel40
  - number: '40.5'
    text: |-
      Het hoofd of de bestuurder van een inrichting als bedoeld in het derde lid verstrekt aan het bestuurscollege
      onderscheidenlijk Onze Minister:
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel40
  - number: 40.5.a
    text: de nodige inlichtingen ten behoeve van de uitoefening van de in dit artikel bedoelde bevoegdheid tot aanwijzing;
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel40
  - number: 40.5.b
    text: |-
      vóór 1 februari van ieder jaar een overzicht van de werkelijke sterkte van de bedrijfsbrandweer op 1 januari van
      dat jaar.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel40
  - number: '40.6'
    text: |-
      Het hoofd of de bestuurder van een aangewezen inrichting draagt er zorg voor dat de bedrijfsbrandweer ter zake
      van het optreden dat noodzakelijk is ter bestrijding van brand of van gevaar anderszins binnen de inrichting,
      de aanwijzingen opvolgt van degene die op grond van een wettelijk voorschrift met de feitelijke leiding van die
      bestrijding is belast.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel40
  - number: '41.1'
    text: Onze Minister kan doelstellingen vaststellen ten aanzien van de rampenbestrijding en de crisisbeheersing.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel41
  - number: '41.2'
    text: |-
      Onze Minister zendt het besluit waarbij hij de doelstellingen heeft vastgesteld toe aan de bestuurscolleges alsmede
      aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel41
  - number: '41.3'
    text: |-
      Onze Minister voert, mede met het oog op eventueel vast te stellen doelstellingen als bedoeld in het eerste lid
      periodiek overleg met de gezaghebbers.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel41
  - number: '42.1'
    text: |-
      Het bestuurscollege stelt, na overleg met de algemeen commandant, ten minste eenmaal in de vier jaar een
      beleidsplan vast, waarin het beleid is vastgelegd ten aanzien van de brandweerzorg, de rampenbestrijding en de
      crisisbeheersing.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel42
  - number: '42.2'
    text: 'Het beleidsplan omvat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel42
  - number: 42.2.a
    text: |-
      een beschrijving van de beoogde operationele prestaties van de diensten en organisaties van het openbaar lichaam,
      van het brandweerkorps en van de politie in het kader van de rampenbestrijding en de crisisbeheersing;
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel42
  - number: 42.2.b
    text: |-
      een uitwerking van door Onze Minister vastgestelde doelstellingen als bedoeld in [artikel 41, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel41
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '41'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 42.2.c
    text: |-
      een informatieparagraaf waarin een beschrijving wordt gegeven van de informatievoorziening binnen en tussen de
      onder a bedoelde diensten en organisaties;
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel42
  - number: 42.2.d
    text: een oefenbeleidsplan;
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel42
  - number: 42.2.e
    text: |-
      een beschrijving van de niet-wettelijke adviesfunctie van de eilandelijke rampencoördinator, bedoeld in
      [artikel 48, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel48
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '48'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 42.2.f
    text: |-
      een beschrijving van de voorzieningen en maatregelen, noodzakelijk voor de brandweer om te voldoen aan de gestelde
      opkomsttijden.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel42
  - number: '42.3'
    text: Het beleidsplan wordt tussentijds geactualiseerd, indien gewijzigde omstandigheden daartoe aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel42
  - number: '42.4'
    text: |-
      Het beleidsplan is afgestemd met het beheersplan van het politiekorps, bedoeld in [artikel 23][ref1], en
      het beheersplan van het brandweerkorps, als bedoeld in [artikel 29][ref2], en zo mogelijk afgestemd met een
      vergelijkbaar plan van omringende eilanden.


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0028586#Artikel29
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0028586
        artikel: '29'
        hoofdstuk: '3'
  - number: '42.5'
    text: |-
      Het bestuurscollege zendt het beleidsplan en de wijzigingen daarop binnen een maand na vaststelling ter
      toetsing toe aan de Rijksvertegenwoordiger en ter kennisneming aan Onze Minister, de algemeen commandant, en de
      bestuurscolleges van de andere openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel42
  - number: '42.6'
    text: Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de inhoud van het beleidsplan.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel42
  - number: '43.1'
    text: |-
      Het beleidsplan, bedoeld in [artikel 42][ref1], is mede gebaseerd op een door het bestuurscollege vastgesteld
      risicoprofiel.


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel42
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '43.2'
    text: 'Het risicoprofiel bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel43
  - number: 43.2.a
    text: |-
      een overzicht van de risicovolle situaties binnen het openbaar lichaam die tot een brand, ramp of crisis kunnen
      leiden;
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel43
  - number: 43.2.b
    text: een overzicht van de soorten branden, rampen en crises die zich in het openbaar lichaam kunnen voordoen; en
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel43
  - number: 43.2.c
    text: |-
      een analyse waarin de weging en inschatting van de gevolgen van de soorten branden, rampen en crises zijn
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel43
  - number: '43.3'
    text: |-
      Het bestuurscollege nodigt voor de vaststelling van het risicoprofiel in ieder geval de lokaal commandant, de
      hoofdofficier van justitie en de door Onze andere Ministers daartoe aangewezen functionarissen uit hun zienswijze
      ter zake kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel43
  - number: '43.4'
    text: |-
      De bestuurscolleges gezamenlijk nodigen ten minste eenmaal per jaar de bij mogelijke rampen en crises in de
      openbare lichamen betrokken partijen uit voor een gezamenlijk overleg over de risico’s in de openbare lichamen. Een
      betrokken partij kan een verzoek richten aan de bestuurscolleges tot het houden van een gezamenlijk overleg.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel43
  - number: '44.1'
    text: |-
      Het bestuurscollege stelt na overleg met de algemeen commandant ten minste eenmaal per vier jaar een rampen- en
      crisisplan vast. Het plan omvat in ieder geval een beschrijving van de organisatie, de verantwoordelijkheden, de
      taken en de bevoegdheden in het kader van de rampenbestrijding en de crisisbeheersing alsmede de afspraken die zijn
      gemaakt met andere bij mogelijke rampen en crisis betrokken partijen.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel44
  - number: '44.2'
    text: |-
      Ten aanzien van de organisatie, verantwoordelijkheden, taken en bevoegdheden in het kader van de rampenbestrijding
      en de crisisbeheersing bevat het plan in ieder geval:
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel44
  - number: 44.2.a
    text: |-
      een overzicht van degene die bij de bestrijding van rampen en crisis kunnen worden betrokken alsmede de afspraken
      over de personele en materiële inzet;
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel44
  - number: 44.2.b
    text: een schema met betrekking tot de leiding over en de gecoördineerde inzet bij de bestrijding van rampen en crisis;
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel44
  - number: 44.2.c
    text: |-
      een plan met betrekking tot de wijze waarop de informatie, bedoeld in de
      [artikelen 50, eerste en tweede lid][ref1], [52][ref2] en [54, eerste en tweede lid][ref3], wordt verschaft,
      alsmede een plan met betrekking tot de waarschuwing van de bevolking;


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0028586#Artikel52
      [ref3]: https://wetten.overheid.nl/BWBR0028586#Artikel54
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '50'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0028586
        artikel: '52'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0028586
        artikel: '54'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: 44.2.d
    text: een plan met betrekking tot de opvang, de verzorging en de nazorg van slachtoffers.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel44
  - number: '44.3'
    text: |-
      Het rampen- en crisisplan wordt tussentijds geactualiseerd, indien gewijzigde omstandigheden daartoe aanleiding
      geven.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel44
  - number: '44.4'
    text: Het plan is zo mogelijk afgestemd met een vergelijkbaar plan van omringende eilanden.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel44
  - number: '44.5'
    text: |-
      Het bestuurscollege zendt het rampen- en crisisplan en wijzigingen daarop binnen een maand na vaststelling ter
      toetsing toe aan de Rijksvertegenwoordiger en ter kennisneming aan Onze Minister, de algemeen commandant en de
      hoofdofficier van justitie alsmede de bestuurscolleges van de andere openbare lichamen en het bevoegd gezag dat in
      Aruba, Curaçao en Sint Maarten belast is met het vaststellen van een vergelijkbaar plan.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel44
  - number: '44.6'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de inhoud van het rampen- en
      crisisplan.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel44
  - number: '45.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen categorieën inrichtingen, categorieën rampen en luchtvaartterreinen
      worden aangewezen waarvoor de gezaghebber een rampbestrijdingsplan vaststelt.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel45
  - number: '45.2'
    text: 'Bij of krachtens algemene maatregel van bestuur, bedoeld in het eerste lid, worden nadere regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel45
  - number: 45.2.a
    text: de inhoud van het plan;
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel45
  - number: 45.2.b
    text: het raadplegen van de bevolking bij het opstellen van het plan en van belangrijke wijzigingen van dat plan;
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel45
  - number: 45.2.c
    text: het periodiek beproeven en actualiseren van het plan;
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel45
  - number: 45.2.d
    text: de bekendmaking van een besluit als bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel45
  - number: '45.3'
    text: |-
      De gezaghebber zendt het rampbestrijdingsplan en de wijzigingen daarop binnen een maand na vaststelling ter
      toetsing toe aan de Rijksvertegenwoordiger en ter kennisneming aan Onze Minister, de algemeen commandant en de
      hoofdofficier van justitie, alsmede de gezaghebbers van de andere openbare lichamen en het bevoegd gezag dat in
      Aruba, Curaçao en Sint Maarten belast is met het vaststellen van een vergelijkbaar plan.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel45
  - number: '45.4'
    text: |-
      De gezaghebber, gehoord de algemeen commandant, kan op grond van de ingevolge [artikel 51, eerste lid][ref1],
      verschafte informatie besluiten dat voor een krachtens het eerste lid aangewezen inrichting geen
      rampbestrijdingsplan behoeft te worden vastgesteld. De gezaghebber meldt dit aan de Rijksvertegenwoordiger en
      verschaft hem daartoe de nodige informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel51
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '51'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '46.1'
    text: |-
      Indien het bevoegde bestuursorgaan verzuimt een rampen- en crisisplan, een rampbestrijdingsplan of beleidsplan
      vast te stellen, nodigt de Rijksvertegenwoordiger dat bestuursorgaan uit om het plan binnen drie maanden vast te
      stellen.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel46
  - number: '46.2'
    text: |-
      Indien de Rijksvertegenwoordiger van oordeel is dat het rampen- en crisisplan, het rampbestrijdingsplan of het
      beleidsplan niet aan de wettelijke eisen voldoet, nodigt hij het tot vaststellen bevoegde bestuursorgaan binnen
      drie maanden nadat het plan is ontvangen uit het plan binnen door hem vast te stellen termijn te wijzigen.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel46
  - number: '46.3'
    text: |-
      Indien de Rijksvertegenwoordiger van oordeel is dat het rampen- en crisisplan, het rampbestrijdingsplan of
      beleidsplan niet meer actueel is, nodigt hij het tot vaststellen bevoegde bestuursorgaan uit het plan binnen een
      door hem vast te stellen termijn te wijzigen.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel46
  - number: '46.4'
    text: |-
      Indien het bestuursorgaan geen gevolg geeft aan een uitnodiging op grond van het eerste, tweede of derde lid, stelt
      de Rijksvertegenwoordiger het plan onderscheidenlijk de wijziging daarvan binnen zes maanden op kosten van het
      openbaar lichaam vast.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel46
  - number: '46.5'
    text: |-
      Alvorens de bevoegdheden, bedoeld in het eerste tot en met vierde lid, toe te passen, treedt de
      Rijksvertegenwoordiger in overleg met het tot vaststellen bevoegde bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel46
  - number: '47.1'
    text: |-
      De Rijksvertegenwoordiger stelt na overleg met de gezaghebbers ten minste eenmaal in de vier jaar een
      coördinatieplan vast, waarin in ieder geval is opgenomen:
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel47
  - number: 47.1.a
    text: |-
      een schema met betrekking tot de leiding over en de gecoördineerde inzet van diensten en organisaties bij de
      bestrijding van een ramp of een crisis van boveneilandelijke betekenis;
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel47
  - number: 47.1.b
    text: de afstemming van de rampenbestrijding en de crisisbeheersing met andere landen;
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel47
  - number: 47.1.c
    text: |-
      gegevens over het verzoeken en verlenen van bijstand, als bedoeld in [artikel 58][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel58
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: '47.2'
    text: |-
      Het plan, bedoeld in het eerste lid wordt tussentijds geactualiseerd, indien gewijzigde omstandigheden daartoe
      aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel47
  - number: '47.3'
    text: |-
      Het plan worden uiterlijk een maand na vaststelling ter kennisneming aan de korpsbeheerder brandweer, aan de
      gezaghebbers alsmede aan de procureur-generaal gezonden.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel47
  - number: '48.1'
    text: In elk van de openbare lichamen vervult de eilandsecretaris de functie van eilandelijk rampencoördinator.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel48
  - number: '48.2'
    text: 'De eilandelijk rampencoördinator is in elk geval belast met:'
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel48
  - number: 48.2.a
    text: |-
      de coördinatie van de maatregelen en voorzieningen die het openbaar lichaam treft met het oog op een ramp of
      crisis;
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel48
  - number: 48.2.b
    text: |-
      het adviseren van het bevoegd gezag over risico’s van rampen en crises in de bij of krachtens de wet aangewezen
      gevallen alsmede in de gevallen die in het beleidsplan zijn bepaald.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel48
  - number: '48.3'
    text: |-
      Het bestuurscollege kan de eilandelijk rampencoördinator belasten met andere taken die verband houden met de taak,
      bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel48
  - number: '49'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel49
  - number: 49.a
    text: de organisatie van de rampenbestrijding en de crisisbeheersing;
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel49
  - number: 49.b
    text: de organisatie van de geneeskundige hulpverlening;
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel49
  - number: 49.c
    text: de bevolkingszorg in het kader van de rampenbestrijding en de crisisbeheersing;
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel49
  - number: 49.d
    text: de organisatie van de brandweerzorg.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel49
  - number: '50.1'
    text: |-
      Het bestuurscollege draagt er zorg voor dat Onze Minister, de Rijksvertegenwoordiger, de algemeen commandant en de
      hoofdofficier van justitie informatie wordt verschaft over de rampen en de crises die het openbaar lichaam kunnen
      treffen, en over de maatregelen die zijn getroffen ter voorkoming en bestrijding of beheersing hiervan.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel50
  - number: '50.2'
    text: |-
      Het bestuurscollege draagt er zorg voor dat de bevolking informatie wordt verschaft over de rampen en de crises
      die het openbaar lichaam kunnen treffen, over de maatregelen die zijn getroffen ter voorkoming en bestrijding of
      beheersing daarvan en over de daarbij te volgen gedragslijn.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel50
  - number: '50.3'
    text: |-
      Het bestuurscollege draagt er zorg voor dat de bij de rampenbestrijding en de crisisbeheersing in het openbaar
      lichaam betrokken personen informatie wordt verschaft over de rampen en crises die het openbaar lichaam kunnen
      treffen, de risico’s die hun inzet kan hebben voor hun gezondheid en de voorzorgsmaatregelen die in verband daarmee
      zijn of zullen worden getroffen.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel50
  - number: '50.4'
    text: |-
      Het bestuurscollege stemt zijn informatievoorziening, bedoeld in het eerste tot en met derde lid, af met de
      informatievoorziening door of onder verantwoordelijkheid van Onze bij rampen en crises betrokken Ministers.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel50
  - number: '51.1'
    text: |-
      Eenieder die beschikt over relevante veiligheidstechnische gegevens verschaft het bestuurscollege de informatie die
      nodig is voor een adequate voorbereiding van de rampenbestrijding en de crisisbeheersing. Dit geldt niet voor zover
      deze informatie reeds op grond van andere voorschriften is verschaft of kan worden verkregen.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel51
  - number: '51.2'
    text: |-
      Het bestuurscollege kan bevelen dat een inrichting die behoort tot een krachtens [artikel 45, eerste lid][ref1],
      aangewezen categorie niet in werking gesteld of gehouden wordt, indien degene die de inrichting in werking zal
      hebben of heeft, niet aan de in het eerste lid bedoelde verplichting tot informatieverschaffing voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel45
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '45'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '51.3'
    text: |-
      Degene die een inrichting drijft die behoort tot een krachtens [artikel 45, eerste lid][ref1], aangewezen
      categorie, is verplicht:


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel45
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '45'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 51.3.a
    text: |-
      aan het bestuurscollege een actueel bijgehouden document te verschaffen waarin het door hem gevoerde beleid ter
      voorkoming van zware ongevallen, rekening houdend met de aanwezigheid en de omvang van de risico’s, is vastgelegd;
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel51
  - number: 51.3.b
    text: een voor eenieder te raadplegen lijst van in de inrichting aanwezige gevaarlijke stoffen bij te houden.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel51
  - number: '51.4'
    text: |-
      Indien voor gegevens als bedoeld in het eerste lid of een deel daarvan geheimhouding door het belang van de
      veiligheid van de Staat geboden is, verstrekt degene die daarover beschikt op aanwijzing van Onze betrokken
      Minister deze gegevens tezamen met de gegevens waarvoor geheimhouding niet is geboden, aan Onze betrokken Minister.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel51
  - number: '51.5'
    text: |-
      Indien degene die beschikt over gegevens als bedoeld in het eerste lid van mening is dat deze gegevens of een deel
      daarvan niet kunnen worden verstrekt omdat geheimhouding daarvan door het belang van de veiligheid van de Staat
      is geboden, verstrekt hij deze gegevens tezamen met de gegevens waarvoor naar zijn mening geheimhouding niet is
      geboden, aan Onze betrokken Minister.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel51
  - number: '51.6'
    text: |-
      Onze betrokken Minister verstrekt de informatie op basis van de gegevens, bedoeld in het vierde en vijfde lid, aan
      het bestuurscollege nadat hij deze in overleg met Onze Minister zodanig heeft bewerkt, dat de gegevens waarvoor
      geheimhouding geboden is, daarin niet voorkomen of daaruit niet kunnen worden afgeleid.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel51
  - number: '52.1'
    text: |-
      Het bestuurscollege maakt de gegevens openbaar die het krachtens [artikel 51][ref1] heeft ontvangen ten behoeve
      van de vaststelling van rampbestrijdingsplannen voor de krachtens [artikel 45][ref2] aangewezen categorieën
      inrichtingen en luchtvaartterreinen.


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0028586#Artikel45
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '51'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0028586
        artikel: '45'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '52.2'
    text: |-
      In afwijking van [artikel 11, tweede lid, van de Wet openbaarheid van bestuur BES][ref1] blijft het verstrekken
      van informatie op basis van de gegevens, bedoeld in het eerste lid, achterwege voor zover het belang daarvan niet
      opweegt tegen de volgende belangen:


      [ref1]: https://wetten.overheid.nl/BWBR0028154#Artikel11
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0028154
        artikel: '11'
  - number: 52.2.a
    text: de eerbiediging van de persoonlijke levenssfeer;
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel52
  - number: 52.2.b
    text: het voorkomen van sabotage.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel52
  - number: '52.3'
    text: |-
      Indien een verzoek tot het verstrekken van informatie over de overige gegevens die zijn
      ontvangen krachtens [artikel 51, eerste lid][ref1], of over de gegevens die zijn ontvangen
      krachtens [artikel 56, eerste en tweede lid][ref2], betrekking heeft op inrichtingen,
      aangewezen op grond van [artikel 45][ref3] van deze wet, kan verstrekking op grond van
      [artikel 11, tweede lid, aanhef en onder a, van de Wet openbaarheid van bestuur][ref4] slechts achterwege blijven
      voor zover die gegevens een vertrouwelijk karakter hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0028586#Artikel56
      [ref3]: https://wetten.overheid.nl/BWBR0028586#Artikel45
      [ref4]: https://wetten.overheid.nl/BWBR0005252#Artikel11
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '51'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0028586
        artikel: '56'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0028586
        artikel: '45'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0005252
        artikel: '11'
  - number: '52.4'
    text: |-
      [Artikel 11, tweede lid, aanhef en onder e, van de Wet openbaarheid van bestuur BES][ref1] is op het op verzoek
      verstrekken van informatie over gegevens als bedoeld in het derde lid uitsluitend van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028154#Artikel11
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0028154
        artikel: '11'
  - number: '52.5'
    text: |-
      [Artikel 11, tweede lid, aanhef en onder f, van de Wet openbaarheid van bestuur BES][ref1] is op het op verzoek
      verstrekken van informatie over gegevens als bedoeld in het derde lid uitsluitend van toepassing, voor zover het
      gegevens betreft die afbreuk kunnen doen aan de mogelijkheid van het voorkomen van sabotage.


      [ref1]: https://wetten.overheid.nl/BWBR0028154#Artikel11
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0028154
        artikel: '11'
  - number: '53.1'
    text: |-
      De gezaghebber heeft het opperbevel in geval van een ramp of van ernstige vrees voor het ontstaan daarvan. Degenen
      die aan de bestrijding van een ramp deelnemen, staan onder zijn bevel.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel53
  - number: '53.2'
    text: |-
      De gezaghebber roept een eilandelijk beleidsteam bijeen, dat in ieder geval bestaat uit de gezaghebber alsmede
      leidinggevenden van de politie, de brandweer, de geneeskundige hulpverlening en de eilandelijk rampencoördinator.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel53
  - number: '53.3'
    text: |-
      De gezaghebber nodigt voorts de functionarissen wier aanwezigheid in verband met de omstandigheden van belang zijn,
      uit deel te nemen aan de vergaderingen van het eilandelijk beleidsteam.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel53
  - number: '54.1'
    text: |-
      De gezaghebber draagt er zorg voor dat de bevolking, de hoofdofficier van justitie, de algemeen commandant, de
      Rijksvertegenwoordiger en Onze Minister informatie wordt verschaft over de oorsprong, de omvang en de gevolgen van
      een ramp die het openbaar lichaam bedreigt of treft, alsmede over de daarbij te volgen gedragslijn.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel54
  - number: '54.2'
    text: |-
      De gezaghebber draagt er zorg voor dat aan de personen die in zijn openbaar lichaam zijn betrokken bij de
      rampenbestrijding informatie wordt verschaft over die ramp, de risico’s die hun inzet daarbij heeft voor hun
      gezondheid en de voorzorgsmaatregelen die in verband daarmee zijn of zullen worden getroffen.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel54
  - number: '54.3'
    text: |-
      De gezaghebber stemt zijn informatievoorziening, bedoeld in het eerste en tweede lid, af met de
      informatievoorziening door of onder verantwoordelijkheid van Onze bij rampen en crises betrokken Ministers.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel54
  - number: '55.1'
    text: |-
      Onze Minister draagt er zorg voor dat alle staten die door een ramp of crisis in de openbare lichamen kunnen worden
      getroffen, ter zake worden geïnformeerd, voor zover dit niet reeds op grond van andere voorschriften geschiedt.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel55
  - number: '55.2'
    text: |-
      Onze Minister draagt er zorg voor dat alle staten die door een ramp of crisis in de openbare lichamen worden
      bedreigd of getroffen, de informatie over de oorsprong, de omvang en de gevolgen van die ramp of crisis wordt
      verschaft, voor zover dit niet op grond van andere voorschriften geschiedt.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel55
  - number: '56.1'
    text: |-
      In geval van een ramp stelt eenieder die daarvan kennis draagt, de gezaghebber zo spoedig mogelijk daarvan op de
      hoogte.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel56
  - number: '56.2'
    text: |-
      In geval van een ramp verschaft eenieder die over relevante veiligheidstechnische gegevens beschikt,
      de gezaghebber de informatie die nodig is voor een adequate uitvoering van diens taken, bedoeld in
      [artikel 54, eerste en tweede lid][ref1]. Dit geldt niet voor zover deze informatie reeds op grond
      van andere voorschriften is verschaft of kan worden verkregen, dan wel indien de gegevens op grond van
      [artikel 51, vierde of vijfde lid][ref2], reeds zijn verstrekt aan Onze betrokken Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0028586#Artikel51
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '54'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0028586
        artikel: '51'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '57'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de informatieverschaffing,
      bedoeld in de [artikelen 50, eerste, tweede en derde lid][ref1], [51, eerste en derde lid][ref2],
      [52, eerste lid][ref3], [54, eerste en tweede lid][ref4], [55, eerste en tweede lid][ref5], en
      [56, tweede lid][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0028586#Artikel51
      [ref3]: https://wetten.overheid.nl/BWBR0028586#Artikel52
      [ref4]: https://wetten.overheid.nl/BWBR0028586#Artikel54
      [ref5]: https://wetten.overheid.nl/BWBR0028586#Artikel55
      [ref6]: https://wetten.overheid.nl/BWBR0028586#Artikel56
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '50'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0028586
        artikel: '51'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0028586
        artikel: '52'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0028586
        artikel: '54'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0028586
        artikel: '55'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref6
        bwb_id: BWBR0028586
        artikel: '56'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: '58.1'
    text: |-
      Behoeft de gezaghebber in geval van een brand, ramp of crisis of van ernstige vrees voor het ontstaan daarvan
      bijstand, anders dan voor de handhaving van de openbare orde, dan richt hij een verzoek daartoe aan de
      Rijksvertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel58
  - number: '58.2'
    text: |-
      De Rijksvertegenwoordiger richt zich met een verzoek om bijstand tot de gezaghebbers van de andere openbare
      lichamen of tot Onze betrokken Minister dan wel, indien bijstand van een onderdeel van de krijgsmacht gewenst
      is, tot Onze Minister van Defensie, die de nodige voorzieningen treffen, tenzij dringende redenen zich daartegen
      verzetten.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel58
  - number: '59'
    text: |-
      De Rijksvertegenwoordiger kan in geval van een ramp of een crisis van boveneilandelijke betekenis of van ernstige
      vrees voor het ontstaan daarvan de gezaghebber, zo mogelijk na overleg met hem, aanwijzingen geven over het inzake
      de rampenbestrijding of de crisisbeheersing te voeren beleid. Hij kan alsdan ten aanzien van een openbaar lichaam
      een functionaris aanwijzen die in de operationele leiding van de rampenbestrijding of de crisisbeheersing voorziet.
      Hij kan zich doen bijstaan door een door hem samengestelde rampenstaf.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel59
  - number: '60'
    text: |-
      De gezaghebbers, de Rijksvertegenwoordiger en Onze Minister verstrekken elkaar de nodige inlichtingen ten behoeve
      van hun rol bij de toepassing van [artikel 59][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel59
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '59'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: '61.1'
    text: |-
      Indien bij of krachtens de wet aan een van Onze andere Ministers de bevoegdheid is gegeven bij een ramp regels te
      stellen of maatregelen te treffen, maakt hij van deze bevoegdheid geen gebruik dan na overleg met Onze Minister,
      tenzij de vereiste spoed zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel61
  - number: '61.2'
    text: |-
      Indien bij of krachtens de wet een van Onze andere Ministers de bevoegdheid is gegeven bij een crisis regels te
      stellen of maatregelen te treffen, informeert hij terstond Onze Minister indien hij van deze bevoegdheid gebruik
      maakt.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel61
  - number: '62.1'
    text: |-
      Onverminderd de [artikelen 7, eerste lid][ref1], en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2], kunnen indien buitengewone omstandigheden
      dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze Minister-President, de [artikelen 63][ref3]
      en [64][ref4] in werking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0028586#Artikel63
      [ref4]: https://wetten.overheid.nl/BWBR0028586#Artikel64
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0028586
        artikel: '63'
        hoofdstuk: '4'
        paragraaf: '5'
      - id: ref4
        bwb_id: BWBR0028586
        artikel: '64'
        hoofdstuk: '4'
        paragraaf: '5'
  - number: '62.2'
    text: |-
      Wanneer het in het eerste lid bedoelde besluit is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepalingen.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel62
  - number: '62.3'
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan worden bij koninklijk besluit, op voordracht
      van Onze Minister-President, de bepalingen die ingevolge het eerste lid in werking zijn gesteld, onverwijld buiten
      werking gesteld.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel62
  - number: '62.4'
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, worden bepalingen die ingevolge het eerste lid
      in werking zijn gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel62
  - number: '62.5'
    text: |-
      Een besluit als bedoeld in het eerste, derde en vierde lid wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel62
  - number: '62.6'
    text: Een besluit als bedoeld in het eerste, derde en vierde lid wordt in ieder geval geplaatst in het Staatsblad.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel62
  - number: '63.1'
    text: |-
      De Rijksvertegenwoordiger kan de gezaghebber in een concreet geval de nodige aanwijzingen geven inzake de
      rampenbestrijding en de crisisbeheersing.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel63
  - number: '63.2'
    text: |-
      Onze Minister kan de Rijksvertegenwoordiger opdragen aan de gezaghebber in een concreet geval de nodige
      aanwijzingen te geven inzake de rampenbestrijding en de crisisbeheersing.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel63
  - number: '64'
    text: |-
      Onze Minister kan, indien het algemeen belang zulks dringend eist, bevoegdheden van de gezaghebber en de
      Rijksvertegenwoordiger op grond van deze wet geheel of gedeeltelijk aan zich trekken dan wel een andere autoriteit
      daarmee geheel of ten dele belasten.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel64
  - number: '65.1'
    text: |-
      De bestuurscolleges, de korpsbeheerder politie en de korpsbeheerder brandweer, sluiten een convenant met het oog
      op de samenwerking bij de handhaving van de openbare orde en bij branden, rampen en crises. Het convenant wordt
      gesloten met Onze Minister van Defensie indien het betrekking heeft op onderdelen van de krijgsmacht.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel65
  - number: '65.2'
    text: |-
      Het convenant heeft in ieder geval betrekking op de meldkamerfunctie, op de informatievoorziening en informatie-
      uitwisseling, het multidisciplinair oefenen en de operationele prestaties van het brandweerkorps en de politie en,
      indien van toepassing, de onderdelen van de krijgsmacht bij rampen en crises.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel65
  - number: '65.3'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld over het convenant. Deze regeling wordt in
      overeenstemming met Onze Minister van Defensie gegeven indien het voorschriften bevat die mede de onderdelen van
      de krijgsmacht betreffen, en door Onze Minister en Onze Minister van Justitie gezamenlijk indien het voorschriften
      bevat ten behoeve van de strafrechtelijke handhaving van de rechtsorde dan wel de vervulling van taken ten dienste
      van de justitie.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel65
  - number: '66.1'
    text: |-
      Het convenant, bedoeld in [artikel 65][ref1], heeft betrekking op een gemeenschappelijke meldkamer ten behoeve van
      de politietaak, de brandweerzorg, de geneeskundige hulpverlening en het ambulancevervoer.


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel65
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '65'
        hoofdstuk: '5'
  - number: '66.2'
    text: |-
      Het convenant bevat met betrekking tot de meldkamerfunctie in ieder geval afspraken over de samenwerking in de
      meldkamer.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel66
  - number: '67'
    text: |-
      Bij of krachtens algemene maatregel van bestuur op voordracht van Onze Minister kunnen met het oog op de
      rampenbestrijding en de crisisbeheersing ten aanzien van de brandweer, de politie, de geneeskundige hulpverlening
      en de meldkamer regels worden gesteld over:
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel67
  - number: 67.a
    text: prestaties waaraan de taakuitvoering ten minste voldoet;
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel67
  - number: 67.b
    text: onderlinge samenwerking.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel67
  - number: '68.1'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld over de samenwerking tussen de bestuurscolleges, het
      politiekorps en het brandweerkorps alsmede de Koninklijke marechaussee indien het betreft de uitoefening van de
      politietaken, daaronder begrepen de taak, bedoeld in [artikel 5, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel5
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '68.2'
    text: |-
      De regeling, bedoeld in het eerste lid, wordt in overeenstemming met Onze Minister van Defensie gegeven indien
      zij voorschriften bevat die mede de Koninklijke marechaussee betreffen, en door Onze Ministers gezamenlijk indien
      zij voorschriften bevat ten behoeve van de strafrechtelijke handhaving van de rechtsorde dan wel de vervulling van
      taken ten dienste van de justitie.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel68
  - number: '69.1'
    text: |-
      Bij regeling van Onze Ministers kunnen regels worden gesteld over de informatie- en communicatievoorzieningen
      van en het gebruik daarvan door de politie, het brandweerkorps en de diensten van de openbare lichamen die zijn
      betrokken bij de in [artikel 27, tweede lid, onder a en b][ref1], en [artikel 37, eerste en tweede lid][ref2],
      genoemde taken, alsmede over de informatiebeveiliging. Voor zover deze regels van belang zijn voor de uitvoering
      van de politietaken, bedoeld in [artikel 5][ref3], kunnen zij, in overeenstemming met Onze Minister van Defensie,
      mede worden gegeven ten aanzien van de Koninklijke marechaussee.


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0028586#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0028586#Artikel5
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '27'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0028586
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0028586
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '69.2'
    text: |-
      Bij regeling van Onze Minister kunnen aan het politiekorps, het brandweerkorps en de openbare lichamen
      frequenties worden toewijzen voor de overdracht van gegevens door middel van daartoe aangewezen informatie- en
      communicatievoorzieningen.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel69
  - number: '70.1'
    text: |-
      In de kosten die voor een openbaar lichaam voortvloeien uit de uitoefening van zijn taken ingevolge
      [artikel 37, eerste en tweede lid][ref1], verlenen Onze Minister en Onze Minister van Volksgezondheid, Welzijn
      en Sport, voor zover het betreft de geneeskundige hulpverlening, een bijdrage. De bijdrage kan onder voorwaarden
      worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel37
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '70.2'
    text: |-
      In de kosten die voor een openbaar lichaam voortvloeien uit de daadwerkelijke bestrijding van een ramp en uit de
      gevolgen van die bestrijding, kan Onze Minister een bijdrage verlenen.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel70
  - number: '70.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de uitvoering van het eerste en tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel70
  - number: '71.1'
    text: 'De Inspectie Openbare Orde en Veiligheid is belast met:'
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel71
  - number: 71.1.a
    text: |-
      het toetsen van de wijze waarop het brandweerkorps, een bestuurscollege van een openbaar lichaam of een
      samenwerkingslichaam als bedoeld in [artikel 125 van de Wet gemeenschappelijke regelingen][ref1] of het bestuur
      van het Instituut Fysieke Veiligheid, uitvoering geeft aan de taken, met betrekking tot de brandweerzorg, de
      rampenbestrijding of crisisbeheersing;


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel125
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '125'
  - number: 71.1.b
    text: |-
      het, in overeenstemming met Onze Ministers van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, van
      Volksgezondheid, Welzijn en Sport, van Verkeer en Waterstaat en van Sociale Zaken en Werkgelegenheid, periodiek
      toetsen van de voorbereiding op de rampenbestrijding en de crisisbeheersing door het brandweerkorps en de
      bestuursorganen, bedoeld onder a;
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel71
  - number: 71.1.c
    text: |-
      het verrichten van onderzoek naar aanleiding van een brand, ramp of crisis, tenzij de Onderzoeksraad voor
      veiligheid, bedoeld in [artikel 2 van de Rijkswet Onderzoeksraad voor veiligheid][ref1], een onderzoek instelt.


      [ref1]: https://wetten.overheid.nl/BWBR0017613#Artikel2
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0017613
        artikel: '2'
  - number: '71.2'
    text: |-
      De inspectie is met het oog op de uitoefening van de bevoegdheden van de Raad voor de rechtshandhaving, bedoeld
      in [artikel 18, tweede lid, van de Rijkswet Raad voor de rechtshandhaving][ref1], belast met het toezicht op de
      effectiviteit, de kwaliteit van de taakuitvoering en het beheer van de politie en de opleiding van de politie.


      [ref1]: https://wetten.overheid.nl/BWBR0028075#Artikel18
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0028075
        artikel: '18'
  - number: '71.3'
    text: |-
      De inspectie is voorts met het oog op [artikel 21, tweede lid, van de Rijkswet Raad voor de rechtshandhaving][ref1]
      belast met het gevraagd en ongevraagd adviseren van Onze Minister en, voor zover het betreft de taakuitvoering door
      de politie in het kader van de strafrechtelijke handhaving van de rechtsorde dan wel de taken ten dienste van de
      justitie, Onze Minister van Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0028075#Artikel21
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0028075
        artikel: '21'
  - number: '71.4'
    text: |-
      Voor zover de taak, bedoeld in het eerste lid, betrekking heeft op de brandweerzorg op een luchtvaartterrein, voert
      de Inspectie Verkeer en Waterstaat deze uit en stemt hierbij af met de inspectie.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel71
  - number: '71.5'
    text: |-
      Voor zover de taak, bedoeld in het eerste lid, betrekking heeft op de geneeskundige hulpverlening, voert de
      inspectie deze uit in overeenstemming met de Inspectie gezondheidszorg en jeugd.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel71
  - number: '72.1'
    text: |-
      De inspectie staat onder gezag van Onze Minister, voor zover zij is belast met de werkzaamheden, bedoeld in
      [artikel 71, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel71
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '71'
        hoofdstuk: '7'
  - number: '72.2'
    text: |-
      Indien ten aanzien van de inspectie een aanwijzing is gegeven als bedoeld in
      [artikel 29 van de Rijkswet Raad voor de rechtshandhaving][ref1], staat de inspectie onder gezag van de Raad voor
      de rechtshandhaving.


      [ref1]: https://wetten.overheid.nl/BWBR0028075#Artikel29
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0028075
        artikel: '29'
  - number: '73.1'
    text: |-
      Het brandweerkorps en een orgaan als bedoeld in [artikel 71, eerste lid, onder a][ref1], verstrekken de door Onze
      Minister aangewezen ambtenaren desgevraagd de inlichtingen die zij redelijkerwijs nodig hebben in verband met de
      uitvoering van toetsen als bedoeld in artikel 71, eerste lid, onder a en b.


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel71
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '71'
        hoofdstuk: '7'
  - number: '73.2'
    text: |-
      Het brandweerkorps, een orgaan van het openbaar lichaam, van een samenwerkingslichaam of van het Rijk dan
      wel een ieder die werkzaam is bij een organisatie, een instelling, een inrichting die of een bedrijf dat
      betrokken is bij een brand, ramp of crisis, verstrekt de door Onze Minister aangewezen ambtenaren desgevraagd de
      inlichtingen die zij redelijkerwijs nodig hebben in verband met het verrichten van een onderzoek als bedoeld in
      [artikel 71, eerste lid, onder c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel71
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '71'
        hoofdstuk: '7'
  - number: '74.1'
    text: |-
      De werkzaamheden die in het kader van [artikel 71, eerste lid][ref1], worden uitgevoerd, worden jaarlijks door Onze
      Minister vastgesteld, gehoord de Rijksvertegenwoordiger.


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel71
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '71'
        hoofdstuk: '7'
  - number: '74.2'
    text: |-
      Over de werkzaamheden, bedoeld in [artikel 71, eerste lid][ref1], rapporteert de inspectie, gevraagd en ongevraagd,
      rechtstreeks aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel71
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '71'
        hoofdstuk: '7'
  - number: '74.3'
    text: De inspectie rapporteert tevens aan de Rijksvertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel74
  - number: '74.4'
    text: |-
      Onze Minister brengt in een multidisciplinair rapport aan de Staten-Generaal verslag uit van de bevindingen van de
      inspectie bij de toetsing, bedoeld in [artikel 71, eerste lid, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel71
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '71'
        hoofdstuk: '7'
  - number: '74.5'
    text: |-
      Onze Minister zendt, onverminderd het vierde lid, de Staten-Generaal jaarlijks een door de inspectie opgesteld
      verslag van de werkzaamheden die in het kader van [artikel 71, eerste lid][ref1], zijn uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel71
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '71'
        hoofdstuk: '7'
  - number: '75.1'
    text: |-
      De Rijksvertegenwoordiger kan een bestuursorgaan van het openbaar lichaam of van een samenwerkingslichaam
      een aanwijzing geven indien de taakuitvoering op grond van de [hoofdstukken 4][ref1] en [5][ref2] in het
      desbetreffende openbaar lichaam tekortschiet.


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0028586#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0028586
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0028586
        hoofdstuk: '5'
  - number: '75.2'
    text: |-
      Tot het geven van een aanwijzing gaat de Rijksvertegenwoordiger niet over dan nadat hij over de voorgenomen
      aanwijzing het bestuurscollege heeft gehoord.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel75
  - number: '75.3'
    text: |-
      De organen van het openbaar lichaam en een samenwerkingslichaam geven de Rijksvertegenwoordiger alle inlichtingen
      die hij voor de uitoefening van het toezicht nodig heeft.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel75
  - number: '76.1'
    text: |-
      Onverminderd [artikel 71, eerste lid][ref1], zijn de ambtenaren die bij besluit van het bestuurscollege zijn
      aangewezen, belast met toezicht op de naleving van:


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel71
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '71'
        hoofdstuk: '7'
  - number: 76.1.a
    text: |-
      het gestelde bij of krachtens [artikel 40][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel40
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '40'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 76.1.b
    text: |-
      het gestelde bij of krachtens [artikel 51][ref1] ten aanzien van de krachtens [artikel 45][ref2] aangewezen
      inrichtingen; en


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0028586#Artikel45
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '51'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0028586
        artikel: '45'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 76.1.c
    text: |-
      de verordening, bedoeld in [artikel 39][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel39
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '39'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '76.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over het toezicht, bedoeld in het eerste lid,
      onder b.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel76
  - number: '77.1'
    text: |-
      De gezaghebber, de Rijksvertegenwoordiger, de algemeen commandant en het door hem aangewezen ter plaatste
      dienstdoende personeel van de brandweer alsmede de door Onze Minister aangewezen ambtenaren, bedoeld in
      [artikel 73, eerste en tweede lid][ref1], zijn bevoegd elke plaats te betreden, voor zover dat redelijkerwijs voor
      de vervulling van hun taak nodig is. Zo nodig verschaffen zij zich de toegang met behulp van de sterke arm. Zij
      kunnen zich bij het binnentreden doen vergezellen van door hen aangewezen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel73
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '73'
        hoofdstuk: '7'
  - number: '77.2'
    text: |-
      De [titels X][ref1] en [XI van het Wetboek van Strafvordering BES][ref2] zijn van overeenkomstige toepassing met
      dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0028681
      [ref2]: https://wetten.overheid.nl/BWBR0028681
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0028681
      - id: ref2
        bwb_id: BWBR0028681
  - number: 77.2.a
    text: |-
      de machtiging, bedoeld in [artikel 155 van het Wetboek van Strafvordering BES][ref1], wordt verleend door de
      gezaghebber;


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel155
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '155'
  - number: 77.2.b
    text: |-
      het legitimatiebewijs, bedoeld in [artikel 162 van het Wetboek van Strafvordering BES][ref1], wordt uitgegeven door
      de gezaghebber;


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel162
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '162'
  - number: 77.2.c
    text: |-
      het schriftelijk verslag omtrent het binnentreden, bedoeld in
      [artikel 163 van het Wetboek van Strafvordering BES][ref1], wordt toegezonden aan de gezaghebber.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel163
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '163'
  - number: '77.3'
    text: |-
      De gezaghebber, de lokaal commandant van de brandweer en het door hem aangewezen ter plaatse
      dienstdoende personeel van de brandweer alsmede de door Onze Minister aangewezen ambtenaren, bedoeld in
      [artikel 73, eerste en tweede lid][ref1], zijn bevoegd alle benodigde uitrustingsstukken en hulpmiddelen op de
      plaats, bedoeld in het eerste lid, mee te nemen en daarvan op zodanige wijze gebruik te maken als zij voor een
      goede vervulling van hun taak noodzakelijk achten.


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel73
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '73'
        hoofdstuk: '7'
  - number: '78.1'
    text: |-
      Overtreding van de regels van de verordening, bedoeld in [artikel 39][ref1] en van het bij of krachtens de
      [artikelen 31][ref2] en [40, derde, vijfde en zesde lid][ref3], bepaalde wordt bestraft met hechtenis van ten
      hoogste een jaar of een geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0028586#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0028586#Artikel40
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '39'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028586
        artikel: '31'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0028586
        artikel: '40'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '78.2'
    text: |-
      In geval van overtreding van [artikel 40, derde lid][ref1], kan als bijkomende straf worden opgelegd gehele of
      gedeeltelijke stillegging van de inrichting voor een tijd van ten hoogste een jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel40
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '40'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '78.3'
    text: |-
      Het niet naleven van [artikel 51, derde lid][ref1], is een strafbaar feit en wordt gestraft met gevangenisstraf
      van ten hoogste zes jaar of een geldboete van de vijfde categorie, indien het feit opzettelijk is begaan, en
      gestraft met een hechtenis van ten hoogste een jaar of een geldboete van de vierde categorie, indien het feit niet
      opzettelijk is begaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel51
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '51'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '78.4'
    text: |-
      Het niet naleven van [artikel 56, tweede lid][ref1], door degene die een inrichting die behoort tot een krachtens
      [artikel 45, eerste lid][ref2], aangewezen categorie drijft, is een strafbaar feit en wordt gestraft met
      gevangenisstraf van ten hoogste zes jaar of een geldboete van de vijfde categorie, indien het feit opzettelijk is
      begaan, en gestraft met een hechtenis van ten hoogste een jaar of een geldboete van de vierde categorie, indien het
      feit niet opzettelijk is begaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0028586#Artikel45
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '56'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0028586
        artikel: '45'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '78.5'
    text: De in het eerste en tweede lid strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel78
  - number: '78.6'
    text: |-
      De in het derde en vierde lid strafbaar gestelde feiten zijn misdrijven, voor zover zij opzettelijk zijn begaan.
      Voor zover zij geen misdrijven zijn, zijn zij overtredingen.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel78
  - number: '79.1'
    text: |-
      Met de opsporing van de bij [artikel 78][ref1] strafbaar gestelde feiten zijn, onverminderd
      [artikel 184 van het Wetboek van Strafvordering BES][ref2], belast de ambtenaren, aangewezen bij besluit van Onze
      Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel184
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '78'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '184'
  - number: '79.2'
    text: |-
      Als opsporingsambtenaar kan slechts worden aangewezen degene die voldoet aan de door Onze Minister te stellen
      regels over de eisen van bekwaamheid.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel79
  - number: '79.3'
    text: |-
      De opsporingsambtenaren zijn bevoegd tot inbeslagneming van daarvoor vatbare voorwerpen. Zij kunnen daartoe hun
      uitlevering vorderen.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel79
  - number: '80.1'
    text: 'Ten aanzien van de in deze wet opgenomen verplichtingen geldt dat:'
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel80
  - number: 80.1.a
    text: |-
      het beheersplan, bedoeld in de [artikelen 23][ref1] en [29][ref2], uiterlijk acht maanden na inwerkingtreding van
      deze wet voor het eerst wordt vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0028586#Artikel29
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0028586
        artikel: '29'
        hoofdstuk: '3'
  - number: 80.1.b
    text: |-
      de brandbeveiligingsverordening, bedoeld in [artikel 39, eerste lid][ref1], uiterlijk binnen zes maanden na
      inwerkingtreding van deze wet voor het eerst wordt vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel39
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '39'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 80.1.c
    text: |-
      het beleidsplan, bedoeld in [artikel 42][ref1], uiterlijk negen maanden na inwerkingtreding van deze wet voor het
      eerst wordt vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel42
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 80.1.d
    text: |-
      het risicoprofiel, bedoeld in [artikel 43, tweede lid][ref1], uiterlijk zes maanden na inwerkingtreding van deze
      wet voor het eerst wordt vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel43
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '43'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 80.1.e
    text: |-
      het rampen- en crisisplan, bedoeld in [artikel 44][ref1], uiterlijk twaalf maanden na inwerkingtreding van deze wet
      voor het eerst wordt vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel44
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '44'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 80.1.f
    text: |-
      de rampbestrijdingsplannen, bedoeld in [artikel 45][ref1], uiterlijk twaalf maanden na inwerkingtreding van de
      algemene maatregel van bestuur, bedoeld in [artikel 45, eerste lid][ref2], voor het eerst worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0028586#Artikel45
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '45'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0028586
        artikel: '45'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '80.2'
    text: |-
      Het krachtens wettelijk voorschrift vastgestelde rampenplan van een eilandgebied Bonaire, Sint Eustatius of Saba
      blijft van kracht totdat het rampen- en crisisplan, bedoeld in [artikel 44][ref1], is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel44
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '44'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '80.3'
    text: |-
      De krachtens wettelijk voorschrift vastgestelde rampbestrijdingsplannen van een eilandgebied Bonaire, Sint
      Eustatius of Saba blijven van kracht totdat de rampbestrijdingsplannen, bedoeld in [artikel 45][ref1], zijn
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel45
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '45'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '80.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over gelijkstelling van diploma’s van
      ambtenaren van politie en het personeel van de brandweer.
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel80
  - number: '81.1'
    text: |-
      In afwijking van [artikel 11, eerste lid, van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref1],
      treedt de Staat ten aanzien van de rechten en verplichtingen naar burgerlijk recht van de voormalige eilandgebieden
      Bonaire, Sint Eustatius en Saba, voor zover het betreft de taken die op het tijdstip van inwerkingtreding van deze
      wet bij het brandweerkorps, bedoeld in [artikel 27][ref2], berusten, met ingang van inwerkingtreding van deze wet
      voor de voormalige eilandgebieden in de plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0028586#Artikel27
    url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#Artikel81
    references:
