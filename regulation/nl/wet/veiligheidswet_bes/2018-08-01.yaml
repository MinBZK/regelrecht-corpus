preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om regels te stellen met betrekking tot de politie
    alsmede de brandweerzorg, de rampenbestrijding en de crisisbeheersing en over de voorbereiding daarop op Bonaire,
    Sint Eustatius en Saba;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0028586/2018-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *algemeen commandant:* degene die op grond
      van [artikel 27, vijfde lid][ref1], belast is met de dagelijkse leiding over het brandweerkorps;
        - *ambtenaar van politie:* ambtenaar van politie als bedoeld in [artikel 3 van de rijkswet][ref2];
        - *brandweerkorps:* brandweerkorps als bedoeld in [artikel 27, eerste lid][ref3];
        - *buitengewoon agent van politie:* buitengewoon agent van politie als bedoeld in
      [artikel 10 van de rijkswet][ref4];
        - *crisis:* een situatie waarin een vitaal belang van de samenleving is aangetast of dreigt te worden aangetast;
        - *crisisbeheersing:* het geheel van maatregelen en voorzieningen, met inbegrip van de voorbereiding daarvan, dat
      het eilandsbestuur in een crisis treft ter handhaving van de openbare orde, indien van toepassing in samenhang met
      de maatregelen en voorzieningen die de overheid treft op basis van een bij of krachtens enige andere wet toegekende
      bevoegdheid ter zake van een crisis;
        - *geneeskundige hulpverlening:* geneeskundige hulpverlening in het kader van de rampenbestrijding en de
      crisisbeheersing door daartoe aangesteld personeel, als onderdeel van een gecoördineerde inzet van diensten en
      organisaties van verschillende disciplines, door tussenkomst van een meldkamer;
        - *hoofdofficier van justitie:* de hoofdofficier van justitie, bedoeld in
      __REF004___________________________________________________________________________________________________________
      ______________________;
        - *korpsbeheerder brandweer:* degene bij wie op grond van [artikel 27, vierde lid][ref6], het beheer van het
      brandweerkorps berust;
        - *korpsbeheerder politie:* degene bij wie op grond van [artikel 47, derde lid, van de rijkswet][ref7] het beheer
      van het politiekorps berust;
        - *korpschef:* de korpschef, bedoeld in [artikel 6 van de rijkswet][ref8];
        - *lokaal commandant:* degene die op grond van [artikel 27, zesde lid][ref9], onder het gezag van de algemeen
      commandant belast is met de dagelijkse leiding over een vestiging van het brandweerkorps;
        - *Onze Minister:* Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;
        - *Onze Ministers:* Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties en Onze Minister van Justitie;
        - *openbaar lichaam:* openbaar lichaam Bonaire, Sint Eustatius of Saba;
        - *politiekorps:* het politiekorps voor Bonaire, Sint Eustatius en Saba, bedoeld in
      [artikel 4 van de rijkswet][ref10];
        - *politietaak:* de taken, bedoeld in [artikel 5 van de rijkswet][ref11];
        - *procureur-generaal:* de procureur-generaal, bedoeld in
      __REF011___________________________________________________________________________________________________________
      _______________________;
        - *ramp:* een zwaar ongeval of een andere gebeurtenis waarbij het leven en de gezondheid van veel personen, het
      milieu of grote materiële belangen in ernstige mate zijn geschaad of worden bedreigd en waarbij een gecoördineerde
      inzet van diensten of organisaties van verschillende disciplines is vereist om de dreiging weg te nemen of de
      schadelijke gevolgen te beperken;
        - *rampenbestrijding:* het geheel van maatregelen en voorzieningen, met inbegrip van de voorbereiding daarop, dat
      het eilandsbestuur treft met het oog op een ramp, het voorkomen van een ramp en het beperken van de gevolgen van
      een ramp;
        - *Rijksvertegenwoordiger:* Rijksvertegenwoordiger voor de openbare lichamen Bonaire, Sint Eustatius en Saba als
      bedoeld in [artikel 187, eerste lid, van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref13];
        - *Rijkswet:* de [Rijkswet politie van Curaçao, van Sint Maarten en van Bonaire, Sint Eustatius en Saba][ref14];
        - *taken ten dienste van de justitie:* de taken, bedoeld in [artikel 1, onder n, van de rijkswet][ref15].


