  - number: '81.2'
    text: |-
      In afwijking van
      [artikel 11, tweede lid, van de Invoeringswet openbare lichamen Bonaire, Sint Eustatius en Saba][ref1], treedt
      in wettelijke procedure en rechtsgedingen waarbij de dienst brandweer van het voormalige eilandgebied Bonaire, de
      dienst luchthaven van het voormalige eilandgebied Sint Eustatius en de dienst lucht- en zeehaven van het voormalige
      eilandgebied Saba voor wat betreft taken die na inwerkingtreding van deze wet door het brandweerkorps, bedoeld in
      [artikel 27][ref2], van deze wet, worden uitgevoerd, is betrokken, de Staat dan wel Onze Minister in de plaats van
      het eilandgebied dan wel het bestuurscollege.


