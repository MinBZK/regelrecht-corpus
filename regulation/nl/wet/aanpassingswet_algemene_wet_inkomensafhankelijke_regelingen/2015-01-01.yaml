      Alle vóór de inwerkingtreding van deze wet door Onze Minister van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer aangewezen onzelfstandige woonruimten als bedoeld in
      [artikel 11, tweede lid, van de Huursubsidiewet][ref1], zoals dat laatstelijk luidde vóór de inwerkingtreding van
      deze wet, zijn aangewezen krachtens dat artikellid, zoals dat komt te luiden nadat deze wet in werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel11
