      [artikel 26f, derde lid, eerste volzin][ref1], als volgt gelezen: Burgemeester en wethouders declareren de in een
      tijdvak dat loopt van 1 juli 2005 tot en met 31 december 2005 of daaraan voorafgaande tijdvakken gemaakte kosten
      uiterlijk 30 september volgend op hetzij dat tijdvak, hetzij het jaar waarin de beschikking tot het verstrekken
      van een bijzondere bijdrage in de huurlasten, bedoeld in [artikel 26b, eerste lid, van de Huursubsidiewet][ref2],
      over dat tijdvak of die tijdvakken onherroepelijk is geworden, hetzij het jaar waarin na een herziening
      van de beschikking tot het verstrekken van een bijzondere bijdrage in de huurlasten, bedoeld in
      [artikel 26b, eerste lid, van de Huursubsidiewet][ref3], de daarop volgende beschikking onherroepelijk is geworden,
      doch uiterlijk tot vijf jaar na het betrokken tijdvak;


