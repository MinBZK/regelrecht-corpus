  - number: I.6
    text: |-
      Indien de huurder uiterlijk op 30 november 2005 een aanvraag tot toekenning van huursubsidie als
      bedoeld in [artikel 28, eerste lid, van de Huursubsidiewet][ref1], of een verzoek als bedoeld in
      [artikel 26, eerste lid, van die wet][ref2], zoals die bepalingen laatstelijk luidden vóór de inwerkingtreding
      van deze wet, heeft ingediend en die aanvraag respectievelijk dat verzoek betrekking heeft op het tijdvak dat
      loopt van 1 juli 2005 tot en met 31 december 2005 of een daaraan voorafgaand subsidietijdvak, wordt die aanvraag
      respectievelijk dat verzoek afgedaan overeenkomstig die [wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0008659
