      Indien burgemeester en wethouders een aanvraag als bedoeld in
      [artikel 26f, tweede lid, van de Huursubsidiewet][ref1], zoals die laatstelijk luidde vóór de inwerkingtreding van
      deze wet, hebben ingediend die betrekking heeft op het tijdvak dat loopt van 1 juli 2005 tot en met 31 december
      2005 of een daaraan voorafgaand subsidietijdvak, wordt die aanvraag afgedaan overeenkomstig die [wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel26f
