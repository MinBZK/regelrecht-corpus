      subsidiejaar dat loopt van 1 juli 2005 tot en met 30 juni 2006 slechts voorschotten als bedoeld in
      [artikel 26f, tweede lid, van de Huursubsidiewet][ref1] over een tijdvak dat uiterlijk loopt tot en met 31 december
      2005.


