  - number: II
    text: |-
      1 Voor het tegemoetkomingsjaar 2005 geldt de [Wet kinderopvang][ref1], zoals deze laatstelijk luidde vóór de
      inwerkingtreding van deze wet.

      2 De op grond van de vaststelling of herziening van de tegemoetkoming van het Rijk voor het
      tegemoetkomingsjaar 2005 terug te betalen bedragen kunnen door de Belastingdienst/Toeslagen op voet van
      [artikel 30 van de Algemene wet inkomensafhankelijke regelingen][ref2] worden verrekend.


