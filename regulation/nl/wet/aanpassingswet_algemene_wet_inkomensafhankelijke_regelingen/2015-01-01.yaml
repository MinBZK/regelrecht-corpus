  - number: IV
    text: |-
      1 Deze wet treedt in werking op 1 september 2005 en geldt wat betreft de wijzigingen ingevolge
      [hoofdstuk 1, afdeling A][ref1], [afdeling B][ref2], [afdeling C, artikel I][ref3] en [artikel IV][ref4], en
      [afdeling D][ref5], en [hoofdstuk 2, artikel I, vierde tot en met elfde lid][ref6], en [artikel II][ref7], voor
      berekeningsjaren als bedoeld in de [Algemene wet inkomensafhankelijke regelingen][ref8], die aanvangen op of na 1
      januari 2006.

      2 In afwijking van het eerste lid treedt [artikel I, eerste tot en met derde lid, van hoofdstuk 2][ref9] in werking
      met ingang van 1 juli 2005.

      3 In afwijking van het eerste lid treden de [artikelen II][ref10] en [V van afdeling C van hoofdstuk 1][ref11] en
      [artikel III van hoofdstuk 2][ref12] in werking met ingang van 1 januari 2007.

      4 In afwijking van het eerste lid treden de [artikelen III][ref13] en [VI van afdeling C van hoofdstuk 1][ref14] in
      werking met ingang van 1 januari 2008.


