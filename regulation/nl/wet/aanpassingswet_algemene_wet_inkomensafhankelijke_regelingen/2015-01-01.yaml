  - number: I.9
    text: |-
      Door Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer teruggevorderde
      huursubsidie over het subsidietijdvak dat loopt van 1 juli 2005 tot en met 31 december 2005
      of daaraan voorafgaande subsidietijdvakken kan door de Belastingdienst/Toeslagen, bedoeld in
      [artikel 11 van de Algemene wet inkomensafhankelijke regelingen][ref1], op voet van [artikel 30 van die wet][ref2]
      worden verrekend.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0018472#Artikel30
    url: https://wetten.overheid.nl/BWBR0018471/2015-01-01#ArtikelI
