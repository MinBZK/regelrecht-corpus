        bwb_id: BWBR0018472
        artikel: '30'
  - number: I.10
    text: |-
      Alle vóór de inwerkingtreding van deze wet in het kader van de uitvoering van de [Huursubsidiewet][ref1] aan
      Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer verstrekte informatie alsmede alle
      vóór de inwerkingtreding van deze wet gedane verklaringen van medebewoners tot instemming met het inwinnen van
      inlichtingen bij, en informatieverschaffing aan de huurder, worden tevens geacht aan de Belastingdienst/Toeslagen
      verstrekte informatie ten behoeve van de uitvoering van de [Huursubsidiewet][ref2] te zijn onderscheidenlijk aan de
      Belastingdienst/Toeslagen gedane verklaringen tot instemming te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0008659
      [ref2]: https://wetten.overheid.nl/BWBR0008659
    url: https://wetten.overheid.nl/BWBR0018471/2015-01-01#ArtikelI
    references:
      - id: ref1
        bwb_id: BWBR0008659
      - id: ref2
        bwb_id: BWBR0008659
  - number: I.11
    text: |-
      Ten aanzien van de huurder die jonger is dan 65 jaar, aan wie over het subsidiejaar dat loopt van 1 juli 2005 tot
      en met 30 juni 2006 huursubsidie is verstrekt en die in het daarvoor geldende peiljaar een rekenvermogen heeft van
      meer dan € 20 300,–, wordt, indien hij in een berekeningsjaar voorafgaand aan het berekeningsjaar 2015 recht heeft
      op de alleenstaande-ouderkorting, bedoeld in [artikel 8.15 van de Wet inkomstenbelasting 2001][ref1] zoals dat
      luidde op 31 december 2014, of in een berekeningsjaar vanaf het berekeningsjaar 2015 recht heeft op de verhoging
      van het kindgebonden budget, bedoeld in [artikel 2, zesde lid, van de Wet op het kindgebonden budget][ref2],
      [artikel 7, derde lid, van de Algemene wet inkomensafhankelijke regelingen][ref3] toegepast alsof hij in dat jaar
      recht zou hebben op tweemaal het heffingvrije vermogen als bedoeld in [artikel 5.5, eerste lid, van die wet][ref4].
      De vorige volzin is niet van toepassing in berekeningsjaren die volgen op een berekeningsjaar
      waarin met inachtneming van het in die volzin bepaalde, als gevolg van de toepassing van
      [artikel 7, derde lid, van de Algemene wet inkomensafhankelijke regelingen][ref5] geen huurtoeslag is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0022751#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0018472#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0018472#Artikel7
    url: https://wetten.overheid.nl/BWBR0018471/2015-01-01#ArtikelI
