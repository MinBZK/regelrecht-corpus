preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om in verband met de toepassing van de Algemene wet
    inkomensafhankelijke regelingen voor kalenderjaren vanaf 2006 enige wetten aan te passen alsmede het overgangsrecht
    te regelen voor de uitvoering van enkele op 31 december 2005 bestaande inkomensafhankelijke regelingen;

    Zo is het dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0018471/2015-01-01#ArtikelAanhef
articles:
  - number: I.1
    text: |-
      Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, respectievelijk burgemeester en
      wethouders, kennen voor het subsidiejaar dat loopt van 1 juli 2005 tot en met 30 juni 2006 slechts huursubsidie
      als bedoeld in [artikel 7, eerste lid, van de Huursubsidiewet][ref1], respectievelijk een bijzondere bijdrage in
      de huurlasten als bedoeld in [artikel 26b, eerste lid, van die wet][ref2], dan wel voorschotten daarop krachtens
      [artikel 31, derde lid][ref3], respectievelijk [artikel 26c, vijfde lid, van die wet][ref4] toe over een tijdvak
      dat uiterlijk loopt tot en met 31 december 2005.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel7
