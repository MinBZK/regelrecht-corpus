url: https://wetten.overheid.nl/BWBR0018471/2015-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om in verband met de toepassing van de Algemene wet
    inkomensafhankelijke regelingen voor kalenderjaren vanaf 2006 enige wetten aan te passen alsmede het overgangsrecht
    te regelen voor de uitvoering van enkele op 31 december 2005 bestaande inkomensafhankelijke regelingen;

    Zo is het dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0018471/2015-01-01#ArtikelAanhef
articles:
  - number: I
    text: |-
      1 Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, respectievelijk burgemeester en
      wethouders, kennen voor het subsidiejaar dat loopt van 1 juli 2005 tot en met 30 juni 2006 slechts huursubsidie
      als bedoeld in [artikel 7, eerste lid, van de Huursubsidiewet][ref1], respectievelijk een bijzondere bijdrage in
      de huurlasten als bedoeld in [artikel 26b, eerste lid, van die wet][ref2], dan wel voorschotten daarop krachtens
      [artikel 31, derde lid][ref3], respectievelijk [artikel 26c, vijfde lid, van die wet][ref4] toe over een tijdvak
      dat uiterlijk loopt tot en met 31 december 2005.

      2 Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer verstrekt voor het
      subsidiejaar dat loopt van 1 juli 2005 tot en met 30 juni 2006 slechts voorschotten als bedoeld in
      [artikel 26f, tweede lid, van de Huursubsidiewet][ref5] over een tijdvak dat uiterlijk loopt tot en met 31 december
      2005.

      3 Voorzover een aanvraag als bedoeld in [artikel 28, eerste lid, van de Huursubsidiewet][ref6], of een beperkt
      huursubsidiebericht of een huursubsidiebericht als bedoeld in [artikel 30a, eerste lid, van die wet][ref7]
      dan wel een aanvraag tot toekenning van een bijzondere bijdrage in de huurlasten als bedoeld in
      [artikel 26b, eerste lid, van die wet][ref8] betrekking heeft op het tijdvak dat loopt van 1 juli 2005 tot en met
      31 december 2005, wordt voor de toepassing van die [wet][ref9]:

      a. in [artikel 1, onderdeel l][ref10], voor «het subsidiejaar» gelezen: het tijdvak dat loopt van 1 juli 2005 tot
      en met 31 december 2005;

      b. [artikel 1, onderdeel o][ref11], als volgt gelezen:

      o. subsidietijdvak:

      1º. het tijdvak dat loopt van 1 juli 2005 tot en met 31 december 2005, als de huurder in het daaraan voorafgaande
      subsidiejaar huursubsidie heeft ontvangen dan wel in de maand juni voorafgaand aan dat tijdvak een aanvraag als
      bedoeld in [artikel 28, eerste lid][ref12], heeft ingediend;

      2º. de resterende volle kalendermaanden van het tijdvak dat loopt van 1 juli 2005 tot en met 31 december
      2005, als de huurder in het tijdvak 1 juli 2005 tot en met 30 november 2005 een aanvraag als bedoeld in
      [artikel 28, eerste lid][ref13], heeft ingediend;

      c. in [artikel 15, eerste lid][ref14], voor «de laatste dag van het subsidiejaar» telkens gelezen: 30 juni 2006;

      d. in [artikel 24, eerste lid, onderdeel b][ref15], en [artikel 26d, vierde lid][ref16], voor «subsidiejaar»
      gelezen: tijdvak dat loopt van 1 juli 2005 tot en met 31 december 2005;

      e. in [artikel 26c, vierde lid][ref17], voor «30 juni» gelezen: 31 december 2005;

      f. [artikel 26f, derde lid, eerste volzin][ref18], als volgt gelezen: Burgemeester en wethouders
      declareren de in een tijdvak dat loopt van 1 juli 2005 tot en met 31 december 2005 of daaraan voorafgaande
      tijdvakken gemaakte kosten uiterlijk 30 september volgend op hetzij dat tijdvak, hetzij het jaar
      waarin de beschikking tot het verstrekken van een bijzondere bijdrage in de huurlasten, bedoeld in
      [artikel 26b, eerste lid, van de Huursubsidiewet][ref19], over dat tijdvak of die tijdvakken onherroepelijk is
      geworden, hetzij het jaar waarin na een herziening van de beschikking tot het verstrekken van een bijzondere
      bijdrage in de huurlasten, bedoeld in [artikel 26b, eerste lid, van de Huursubsidiewet][ref20], de daarop volgende
      beschikking onherroepelijk is geworden, doch uiterlijk tot vijf jaar na het betrokken tijdvak;

      g. in [artikel 30a, eerste lid, onderdeel b][ref21], voor «1 juli van elk jaar» gelezen: 1 juli 2005.

      4 Alle vóór de inwerkingtreding van deze wet door Onze Minister van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer aangewezen onzelfstandige woonruimten als bedoeld in
      [artikel 11, tweede lid, van de Huursubsidiewet][ref22], zoals dat laatstelijk luidde vóór de inwerkingtreding van
      deze wet, zijn aangewezen krachtens dat artikellid, zoals dat komt te luiden nadat deze wet in werking is getreden.

      5 Bij regeling van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer
      wordt, na overleg met Onze Minister van Sociale Zaken en Werkgelegenheid, in afwijking van
      [artikel 27, vierde en zesde lid, van de Huursubsidiewet][ref23], de hoogte vastgesteld van de bedragen, bedoeld in
      [artikel 14, eerste lid][ref24], onderscheidenlijk [artikel 18, eerste lid, van die wet][ref25], die met ingang van
      1 januari 2006 krachtens die [wet][ref26] gelden.

      6 Indien de huurder uiterlijk op 30 november 2005 een aanvraag tot toekenning van huursubsidie als
      bedoeld in [artikel 28, eerste lid, van de Huursubsidiewet][ref27], of een verzoek als bedoeld in
      [artikel 26, eerste lid, van die wet][ref28], zoals die bepalingen laatstelijk luidden vóór de inwerkingtreding
      van deze wet, heeft ingediend en die aanvraag respectievelijk dat verzoek betrekking heeft op het tijdvak dat
      loopt van 1 juli 2005 tot en met 31 december 2005 of een daaraan voorafgaand subsidietijdvak, wordt die aanvraag
      respectievelijk dat verzoek afgedaan overeenkomstig die [wet][ref29].

      7 Indien de huurder uiterlijk op 28 februari 2006 een aanvraag tot toekenning van een bijzondere bijdrage in de
      huurlasten als bedoeld in [artikel 26b, eerste lid, van de Huursubsidiewet][ref30], of een verzoek als bedoeld in
      [artikel 26g, eerste lid, van die wet][ref31], zoals die bepalingen laatstelijk luidden vóór de inwerkingtreding
      van deze wet, heeft ingediend en die aanvraag respectievelijk dat verzoek betrekking heeft op het tijdvak dat
      loopt van 1 juli 2005 tot en met 31 december 2005 of een daaraan voorafgaand subsidietijdvak, wordt die aanvraag
      respectievelijk dat verzoek afgedaan overeenkomstig die [wet][ref32].

      8 Indien burgemeester en wethouders een aanvraag als bedoeld in
      [artikel 26f, tweede lid, van de Huursubsidiewet][ref33], zoals die laatstelijk luidde vóór de inwerkingtreding
      van deze wet, hebben ingediend die betrekking heeft op het tijdvak dat loopt van 1 juli 2005 tot en met 31 december
      2005 of een daaraan voorafgaand subsidietijdvak, wordt die aanvraag afgedaan overeenkomstig die [wet][ref34].

      9 Door Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer teruggevorderde
      huursubsidie over het subsidietijdvak dat loopt van 1 juli 2005 tot en met 31 december 2005
      of daaraan voorafgaande subsidietijdvakken kan door de Belastingdienst/Toeslagen, bedoeld
      in [artikel 11 van de Algemene wet inkomensafhankelijke regelingen][ref35], op voet van
      [artikel 30 van die wet][ref36] worden verrekend.

      10 Alle vóór de inwerkingtreding van deze wet in het kader van de uitvoering van de [Huursubsidiewet][ref37]
      aan Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer verstrekte informatie alsmede alle
      vóór de inwerkingtreding van deze wet gedane verklaringen van medebewoners tot instemming met het inwinnen van
      inlichtingen bij, en informatieverschaffing aan de huurder, worden tevens geacht aan de Belastingdienst/Toeslagen
      verstrekte informatie ten behoeve van de uitvoering van de [Huursubsidiewet][ref38] te zijn onderscheidenlijk aan
      de Belastingdienst/Toeslagen gedane verklaringen tot instemming te zijn.

      11 Ten aanzien van de huurder die jonger is dan 65 jaar, aan wie over het subsidiejaar dat loopt van 1 juli 2005
      tot en met 30 juni 2006 huursubsidie is verstrekt en die in het daarvoor geldende peiljaar een rekenvermogen heeft
      van meer dan € 20 300,–, wordt, indien hij in een berekeningsjaar voorafgaand aan het berekeningsjaar 2015 recht
      heeft op de alleenstaande-ouderkorting, bedoeld in [artikel 8.15 van de Wet inkomstenbelasting 2001][ref39] zoals
      dat luidde op 31 december 2014, of in een berekeningsjaar vanaf het berekeningsjaar 2015 recht heeft op de verhoging
      van het kindgebonden budget, bedoeld in [artikel 2, zesde lid, van de Wet op het kindgebonden budget][ref40],
      [artikel 7, derde lid, van de Algemene wet inkomensafhankelijke regelingen][ref41] toegepast
      alsof hij in dat jaar recht zou hebben op tweemaal het heffingvrije vermogen als bedoeld in
      [artikel 5.5, eerste lid, van die wet][ref42]. De vorige volzin is niet van toepassing in berekeningsjaren die
      volgen op een berekeningsjaar waarin met inachtneming van het in die volzin bepaalde, als gevolg van de toepassing
      van [artikel 7, derde lid, van de Algemene wet inkomensafhankelijke regelingen][ref43] geen huurtoeslag is
      toegekend.


