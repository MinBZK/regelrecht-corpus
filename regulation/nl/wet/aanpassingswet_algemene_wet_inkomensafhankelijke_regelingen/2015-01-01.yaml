    text: |-
      Bij regeling van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer
      wordt, na overleg met Onze Minister van Sociale Zaken en Werkgelegenheid, in afwijking van
      [artikel 27, vierde en zesde lid, van de Huursubsidiewet][ref1], de hoogte vastgesteld van de bedragen, bedoeld in
      [artikel 14, eerste lid][ref2], onderscheidenlijk [artikel 18, eerste lid, van die wet][ref3], die met ingang van 1
      januari 2006 krachtens die [wet][ref4] gelden.


