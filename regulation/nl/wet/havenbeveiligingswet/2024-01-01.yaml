---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: havenbeveiligingswet
regulatory_layer: WET
publication_date: '2023-01-11'
valid_from: '2024-01-01'
bwb_id: BWBR0016991
url: https://wetten.overheid.nl/BWBR0016991/2024-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het nodig is uitvoering te geven aan Verordening (EG) nr. 725/2004
    van het Europees Parlement en de Raad van de Europese Unie van 31 maart 2004 betreffende de verbetering van de
    beveiliging van schepen en havenfaciliteiten (PbEU L 129), alsmede dat het gewenst is een wettelijke basis vast
    te stellen voor de uitvoering van verdragen of van besluiten van een of meer instellingen van de Europese Unie, al
    dan niet gezamenlijk, die betrekking hebben op de beveiliging van havenfaciliteiten of die betrekking hebben op de
    beveiliging van havens;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel1
  - number: 1.a
    text: |-
      Verordening: [Verordening (EG) nr. 725/2004](32004R0725) van het Europees Parlement en de Raad van de Europese Unie
      van 31 maart 2004 betreffende de verbetering van de beveiliging van schepen en havenfaciliteiten (PbEU 129);
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel1
  - number: 1.b
    text: 'richtlijn: de bij regeling van Onze Minister aangewezen richtlijn;'
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel1
  - number: 1.c
    text: |-
      havenfaciliteit: havenfaciliteit als bedoeld in artikel 2, elfde lid, van de Verordening en artikel 3, derde lid,
      van de richtlijn;
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel1
  - number: 1.d
    text: 'beheerder van een havenfaciliteit: natuurlijke persoon of rechtspersoon die een havenfaciliteit in beheer heeft;'
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel1
  - number: 1.e
    text: |-
      havenbeveiligingscertificaat: certificaat als bedoeld in [artikel 7, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016991#Artikel7
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0016991
        artikel: '7'
        paragraaf: '3'
  - number: 1.f
    text: |-
      haven: elk uit land en water bestaand gebied, met werken en voorzieningen ten behoeve van het commercieel vervoer
      over zee, aangewezen krachtens [artikel 1a, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016991#Artikel1a
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0016991
        artikel: 1a
        paragraaf: 1a
  - number: 1.g
    text: |-
      havengerelateerd gebied: in de directe omgeving van een haven gelegen gebied of object, waarvan verstoring van
      directe invloed is of kan zijn op de veiligheid van een werk of voorziening ten behoeve van het commercieel vervoer
      over zee, aangewezen krachtens [artikel 1a, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016991#Artikel1a
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0016991
        artikel: 1a
        paragraaf: 1a
  - number: 1.h
    text: 'veiligheidsniveau: een van de veiligheidsniveaus, bedoeld in artikel 8, tweede lid, van de richtlijn;'
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel1
  - number: 1.i
    text: |-
      havenveiligheidsbeoordeling: een havenveiligheidsbeoordeling als bedoeld in artikel 6, eerste lid, van de
      richtlijn;
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel1
  - number: 1.j
    text: 'havenveiligheidsplan: een havenveiligheidsplan als bedoeld in artikel 7, eerste lid, van de richtlijn;'
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel1
  - number: 1.k
    text: 'Onze Minister: Onze Minister van Infrastructuur en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel1
  - number: 1.l
    text: |-
      verwerken van persoonsgegevens, onderscheidenlijk verwerkingsverantwoordelijke: hetgeen daaronder wordt verstaan in
      artikel 4 van de Algemene verordening gegevensbescherming.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel1
  - number: 1a.1
    text: 'Deze wet is van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel1a
  - number: 1a.1.a
    text: een haven waarin zich een havenfaciliteit bevindt, en
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel1a
  - number: 1a.1.b
    text: havengerelateerd gebied,
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel1a
  - number: 1a.2
    text: Onze Minister wijst bij besluit havens aan.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel1a
  - number: 1a.3
    text: Onze Minister kan bij besluit havengerelateerd gebied aanwijzen.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel1a
  - number: 1a.4
    text: |-
      Onze Minister houdt bij de aanwijzing van een haven en havengerelateerd gebied rekening met de resultaten van de
      havenveiligheidsbeoordeling.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel1a
  - number: 1a.5
    text: |-
      Een besluit als bedoeld in het tweede of derde lid wordt door Onze Minister toegezonden aan de desbetreffende
      autoriteit voor havenveiligheid.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel1a
  - number: '2.1'
    text: |-
      Als bevoegde autoriteiten voor de maritieme beveiliging, bedoeld in artikel 2, zevende lid, van de Verordening
      worden aangewezen:
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel2
  - number: 2.1.a
    text: |-
      de burgemeester voor de taken, bedoeld in de [artikelen 4][ref1], [5 tot en met 10][ref2] en
      [17, tweede lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0016991#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0016991#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0016991#Artikel17
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0016991
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0016991
        artikel: '5'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0016991
        artikel: '17'
        paragraaf: '6'
  - number: 2.1.b
    text: |-
      Onze Minister van Justitie voor de taak, genoemd in [artikel 12][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0016991#Artikel12
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0016991
        artikel: '12'
        paragraaf: '4'
  - number: 2.1.c
    text: Onze Minister voor de overige taken.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel2
  - number: '2.2'
    text: |-
      De bevoegde autoriteiten, bedoeld in het eerste lid, dragen zorg voor de uitvoering van de taken, onderscheidenlijk
      de nakoming van de verplichtingen die ingevolge de Verordening op Nederland rusten, ieder voor zoveel deze hem
      zijn opgedragen.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel2
  - number: '4.1'
    text: |-
      In de gemeenten met een of meer havenfaciliteiten is de burgemeester het bevoegd gezag voor de uitvoering,
      respectievelijk de toepassing van artikel 7, eerste, derde en vijfde lid, van de Verordening en voorschrift 10,
      tweede en derde lid, van Bijlage I, de onderdelen 5.4, onder 2, 15 en 16 van Bijlage II en de onderdelen 1.16, 4.1,
      4.2, 4.14, 4.15, 4.16, 4.18, 15.3, 15.4, 15.6, 16.3, 16.8, 17.1, 18.5 en 18.6 van Bijlage III van de Verordening,
      voorzover deze betrekking hebben op havenfaciliteiten.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel4
  - number: '4.2'
    text: |-
      Ingeval een havenfaciliteit op het grondgebied van meer dan één gemeente is gelegen, wordt de functie van bevoegde
      autoriteit voor de havenbeveiliging vervuld door de burgemeester van de gemeente waarin het grootste deel van de
      oppervlakte van die havenfaciliteit is gelegen.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel4
  - number: 4a
    text: Onze Minister is de instantie voor havenbeveiliging, bedoeld in artikel 3, vierde lid, van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel4a
  - number: 4b.1
    text: |-
      De burgemeester van een gemeente waarin een haven of havengerelateerd gebied is gelegen, is de autoriteit voor
      havenveiligheid, bedoeld in artikel 5, eerste lid, van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel4b
  - number: 4b.2
    text: |-
      Indien een haven of een havengerelateerd gebied zich over meerdere gemeenten uitstrekt, kunnen de desbetreffende
      autoriteiten voor havenveiligheid gezamenlijk een van hen als autoriteit voor havenveiligheid voor de
      desbetreffende havens en havengerelateerde gebieden aanwijzen.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel4b
  - number: 4b.3
    text: |-
      Van een aanwijzing als bedoeld in het tweede lid wordt door de aangewezen autoriteit voor havenveiligheid
      mededeling gedaan in het door het bestuur van de gemeente waarvan die autoriteit burgemeester is uitgegeven
      gemeenteblad, waarbij wordt aangegeven voor welke gemeenten die aanwijzing van toepassing is.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel4b
  - number: 4c.1
    text: |-
      Een autoriteit voor havenveiligheid wijst een havenveiligheidsfunctionaris aan als bedoeld in artikel 9, eerste
      lid, van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel4c
  - number: 4c.2
    text: |-
      Indien een haven of een havengerelateerd gebied zich over meerdere gemeenten uitstrekt, kunnen de desbetreffende
      autoriteiten voor havenveiligheid gezamenlijk een havenveiligheidsfunctionaris voor de desbetreffende havens en
      havengerelateerde gebieden aanwijzen.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel4c
  - number: 4c.3
    text: |-
      Van een aanwijzing als bedoeld in het tweede lid wordt door een van de autoriteiten voor havenveiligheid mededeling
      gedaan in het door het bestuur van de gemeente waarvan die autoriteit burgemeester is uitgegeven gemeenteblad,
      waarbij wordt aangegeven voor welke gemeenten die aanwijzing van toepassing is.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel4c
  - number: 4c.4
    text: |-
      Indien een havenveiligheidsfunctionaris niet tevens de havenbeveiligingsbeambte van een havenfaciliteit als bedoeld
      in Bijlage II, deel A, onderdeel 2.1, onder 8, van de Verordening is, werken deze bij de uitvoering van hun taken
      nauw samen.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel4c
  - number: 4d
    text: |-
      Een autoriteit voor havenveiligheid draagt zorg voor de coördinatie van de havenveiligheidsmaatregelen die uit de
      Verordening voortvloeien en de maatregelen die uit de richtlijn voortvloeien.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel4d
  - number: 4e.1
    text: |-
      Onze Minister kan veiligheidsorganisaties aanwijzen waaraan het uitvoeren van een havenveiligheidsbeoordeling of
      het opstellen of het wijzigen van een havenveiligheidsplan kan worden opgedragen.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel4e
  - number: 4e.2
    text: |-
      Een veiligheidsorganisatie als bedoeld in het eerste lid voldoet aan de voorwaarden van Bijlage IV van de
      richtlijn.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel4e
  - number: 4e.3
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel4e
  - number: 4f
    text: Onze Minister is de instantie voor havenveiligheidsaspecten bedoeld in artikel 12 van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel4f
  - number: '5.1'
    text: |-
      Bij de vervulling van zijn taken ingevolge deze wet neemt de burgemeester, en in een situatie als bedoeld
      in [artikel 12, derde en vierde lid][ref1], de voorzitter van de veiligheidsregio, de algemene en bijzondere
      aanwijzingen van Onze Minister in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0016991#Artikel12
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0016991
        artikel: '12'
        paragraaf: '4'
  - number: '5.2'
    text: |-
      De burgemeester, de voorzitter van de veiligheidsregio in een situatie als bedoeld in
      [artikel 12, derde en vierde lid][ref1], en Onze Minister verschaffen elkaar de inlichtingen die ieder van hen
      nodig heeft voor een goede vervulling van zijn taken ingevolge deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0016991#Artikel12
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0016991
        artikel: '12'
        paragraaf: '4'
  - number: '6.1'
    text: |-
      Op aanvraag van de beheerder van een havenfaciliteit beslist de burgemeester omtrent het verlenen van instemming,
      bedoeld in voorschrift 10, tweede lid, onderdeel 2 van Bijlage I van de Verordening, met het beveiligingsplan van
      die havenfaciliteit.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel6
  - number: '6.2'
    text: Bij de beslissing op de aanvraag wordt de meest recente veiligheidsbeoordeling van de havenfaciliteit betrokken.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel6
  - number: '7.1'
    text: |-
      Als bewijs van instemming, bedoeld in [artikel 6, eerste lid][ref1], geeft de burgemeester een
      havenbeveiligingscertificaat af.


      [ref1]: https://wetten.overheid.nl/BWBR0016991#Artikel6
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0016991
        artikel: '6'
        paragraaf: '3'
  - number: '7.2'
    text: Een havenbeveiligingscertificaat is ten hoogste vijf jaar geldig.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel7
  - number: '7.3'
    text: |-
      Van elk door hem afgegeven havenbeveiligingscertificaat doet de burgemeester onverwijld schriftelijk mededeling aan
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel7
  - number: '8.1'
    text: |-
      De [artikelen 6][ref1] en [7, derde lid][ref2], zijn mede van toepassing op aanvragen die betrekking hebben op een
      wijziging van de inhoud van een veiligheidsbeoordeling, onderscheidenlijk van de inhoud van een beveiligingsplan
      van een havenfaciliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0016991#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0016991#Artikel7
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0016991
        artikel: '6'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0016991
        artikel: '7'
        paragraaf: '3'
  - number: '8.2'
    text: |-
      Ingeval met de wijziging van een beveiligingsplan wordt ingestemd en het certificaat, afgegeven ingevolge
      [artikel 7, eerste lid][ref1], nog geldig is, wordt de instemming verleend voor de resterende looptijd van het
      certificaat en als bewijs hiervan een aanhangsel bij dat certificaat afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0016991#Artikel7
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0016991
        artikel: '7'
        paragraaf: '3'
  - number: '9.1'
    text: |-
      De burgemeester trekt een door hem gegeven instemming en het bijbehorende havenbeveiligingscertificaat in, indien
      hem is gebleken dat de beheerder van de havenfaciliteit bij de aanvraag onjuiste of onvolledige gegevens heeft
      verstrekt en de verstrekking van juiste of volledige gegevens tot een ander besluit op diens aanvraag zou hebben
      geleid.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel9
  - number: '9.2'
    text: |-
      De burgemeester kan een door hem gegeven instemming en het bijbehorende havenbeveiligingscertificaat intrekken,
      indien de beheerder van de havenfaciliteit heeft gehandeld in strijd met het beveiligingsplan of heeft nagelaten te
      handelen in overeenstemming met dit plan.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel9
  - number: '9.3'
    text: |-
      [Artikel 7, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016991#Artikel7
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0016991
        artikel: '7'
        paragraaf: '3'
  - number: '10.1'
    text: |-
      De burgemeester kan de beheerder van een havenfaciliteit ontheffing verlenen van de eis om in het bezit te
      zijn van een beveiligingsplan waarmee hij heeft ingestemd, mits de beheerder beschikt over een gelijkwaardige
      beveiligingsregeling, waarmee de burgemeester heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel10
  - number: '10.2'
    text: |-
      Goederen worden alleen overgeslagen van een schip in een ankerplaats of een redegebied, gelegen binnen het gebied
      van een gemeente, indien de burgemeester heeft ingestemd met een gelijkwaardige beveiligingsregeling.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel10
  - number: '10.3'
    text: Het tweede lid is van overeenkomstige toepassing op het aan of van boord doen gaan van passagiers.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel10
  - number: '10.4'
    text: |-
      Onder een gelijkwaardige beveiligingsregeling wordt in dit artikel verstaan een gelijkwaardige regeling als bedoeld
      in voorschrift 12, tweede lid, van Bijlage I van de Verordening.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel10
  - number: '10.5'
    text: |-
      Het tweede en het derde lid zijn niet van toepassing ingeval de overslag van goederen, onderscheidenlijk het
      overbrengen van passagiers plaatsvindt tussen twee schepen die elk een schip zijn als bedoeld in artikel 3 van
      de Verordening.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel10
  - number: '11'
    text: |-
      Het is de beheerder van een havenfaciliteit niet toegestaan een activiteit als bedoeld in artikel 2, twaalfde
      lid, van de Verordening in zijn havenfaciliteit te verrichten of toe te laten dat deze wordt verricht, indien
      de beheerder niet in het bezit is van een geldig havenbeveiligingscertificaat of een ontheffing als bedoeld in
      [artikel 10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016991#Artikel10
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0016991
        artikel: '10'
        paragraaf: '3'
  - number: 11a.1
    text: |-
      Een autoriteit voor havenveiligheid voert ten minste elke vijf jaar een havenveiligheidsbeoordeling uit voor de
      desbetreffende haven en het desbetreffende havengerelateerde gebied.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel11a
  - number: 11a.2
    text: |-
      Indien een haven of een havengerelateerd gebied zich over meerdere gemeenten uitstrekt, kunnen de autoriteiten
      voor havenveiligheid gezamenlijk een havenveiligheidsbeoordeling voor de desbetreffende havens en havengerelateerde
      gebieden uitvoeren.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel11a
  - number: 11a.3
    text: Een havenveiligheidsbeoordeling wordt uitgevoerd overeenkomstig artikel 6, eerste en tweede lid, van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel11a
  - number: 11a.4
    text: |-
      Een autoriteit voor havenveiligheid kan het uitvoeren van een havenveiligheidsbeoordeling opdragen aan een op grond
      van [artikel 4e][ref1] aangewezen veiligheidsorganisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0016991#Artikel4e
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0016991
        artikel: 4e
        paragraaf: '2'
  - number: 11a.5
    text: |-
      Een autoriteit voor havenveiligheid of een veiligheidsorganisatie waaraan het uitvoeren van een
      havenveiligheidsbeoordeling is opgedragen, is ten behoeve van een havenveiligheidsbeoordeling bevoegd aan een
      ieder die in de desbetreffende haven zeggenschap heeft over een werk of een voorziening ten behoeve van het
      commercieel vervoer over zee, of die zeggenschap heeft over havengerelateerd gebied, met betrekking tot dat werk,
      die voorziening of dat havengerelateerd gebied de inlichtingen te vragen die betrekking hebben op de in Bijlage
      I van de richtlijn bedoelde elementen van een havenveiligheidsbeoordeling, voor zover die van belang zijn voor de
      veiligheid van de werken en voorzieningen ten behoeve van het commercieel vervoer over zee.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel11a
  - number: 11a.6
    text: |-
      Een ieder aan wie op grond van het vijfde lid inlichtingen worden gevraagd, is verplicht die inlichtingen te
      verstrekken.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel11a
  - number: 11a.7
    text: Het resultaat van een havenveiligheidsbeoordeling behoeft de instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel11a
  - number: 11a.8
    text: |-
      Na de instemming, bedoeld in het zevende lid, wordt de havenveiligheidsbeoordeling ter kennisgeving gezonden aan
      het bestuur van de veiligheidsregio.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel11a
  - number: 11b.1
    text: |-
      Een autoriteit voor havenveiligheid stelt voor de desbetreffende haven en voor het desbetreffende havengerelateerde
      gebied een havenveiligheidsplan op, indien de uitkomsten van een havenveiligheidsbeoordeling daar naar het oordeel
      van de autoriteit voor havenveiligheid aanleiding toe geven.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel11b
  - number: 11b.2
    text: |-
      Indien een haven of een havengerelateerd gebied zich over meerdere gemeenten uitstrekt, kunnen de autoriteiten voor
      havenveiligheid gezamenlijk een havenveiligheidsplan voor de desbetreffende haven en het havengerelateerde gebied
      opstellen.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel11b
  - number: 11b.3
    text: |-
      Een havenveiligheidsplan wordt opgesteld met inachtneming van artikel 7, eerste, tweede en derde lid, van de
      richtlijn.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel11b
  - number: 11b.4
    text: |-
      Een autoriteit voor havenveiligheid kan het opstellen van een havenveiligheidsplan opdragen aan een overeenkomstig
      [artikel 4e][ref1] aangewezen veiligheidsorganisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0016991#Artikel4e
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0016991
        artikel: 4e
        paragraaf: '2'
  - number: 11b.5
    text: |-
      Het bestuur van de veiligheidsregio wordt in de gelegenheid gesteld zijn zienswijze te geven over een ontwerp van
      het havenveiligheidsplan of een wijziging van dat plan, voor zover dat van belang is in verband met het crisisplan,
      bedoeld in [artikel 16 van de Wet veiligheidsregio’s][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel16
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '16'
  - number: 11b.6
    text: Een havenveiligheidsplan of een wijziging daarvan behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel11b
  - number: 11b.7
    text: |-
      Een autoriteit voor havenveiligheid draagt er zorg voor dat de in een havenveiligheidsplan opgenomen
      veiligheidsmaatregelen in de desbetreffende haven en in het desbetreffende havengerelateerde gebied worden
      uitgevoerd en dat er ten minste eenmaal per kalenderjaar, met tussenpozen van niet meer dan 18 maanden, oefeningen
      worden gehouden als bedoeld in artikel 7, zevende lid, van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel11b
  - number: 11b.8
    text: |-
      Een ieder met zeggenschap als bedoeld in [artikel 11a, vijfde lid][ref1], voert de in een havenveiligheidsplan
      opgenomen maatregelen uit die op een werk, voorziening of havengerelateerd gebied als bedoeld in dat lid,
      betrekking hebben, op de wijze en binnen de periode als in het havenveiligheidsplan is aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0016991#Artikel11a
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0016991
        artikel: 11a
        paragraaf: 3a
  - number: '12.1'
    text: Wanneer de veiligheidsniveaus 2 of 3 niet van toepassing zijn, geldt veiligheidsniveau 1.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel12
  - number: '12.2'
    text: |-
      Wijziging van het veiligheidsniveau geschiedt door Onze Minister van Justitie na overleg met Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties. Overleg met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      is niet vereist indien de spoed, gelet op een acute dreiging, zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel12
  - number: '12.3'
    text: |-
      Een autoriteit voor havenveiligheid, dan wel wanneer een wijziging van het veiligheidsniveau en een situatie als
      bedoeld in [artikel 39 van de Wet veiligheidsregio’s][ref1] samenvallen, de voorzitter van de veiligheidsregio,
      kan in overeenstemming met Onze Minister van Justitie, een gedeelte van de desbetreffende haven of het
      desbetreffende havengerelateerde gebied aanwijzen, waar de bij het desbetreffende veiligheidsniveau behorende
      veiligheidsmaatregelen niet hoeven te worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel39
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '39'
  - number: '12.4'
    text: |-
      Een autoriteit voor havenveiligheid, dan wel wanneer er sprake is van een situatie als bedoeld in
      [artikel 39 van de Wet veiligheidsregio’s][ref1], de voorzitter van de veiligheidsregio, kan, indien dit gezien
      de omstandigheden of blijkens hem ter kennis gekomen feiten noodzakelijk is, bepalen dat in de desbetreffende
      haven of in het desbetreffende havengerelateerde gebied, of in een gedeelte daarvan, veiligheidsmaatregelen worden
      genomen die horen bij een hoger veiligheidsniveau dan het veiligheidsniveau dat op dat moment van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel39
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '39'
  - number: '13.1'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld ter uitvoering van voorschrift 10, derde lid, van
      Bijlage I van de Verordening.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel13
  - number: '13.2'
    text: |-
      Bij regeling van Onze Minister kunnen, voorzover nodig voor een goede toepassing van de Verordening, nadere
      regels worden gesteld omtrent de onderwerpen, genoemd in artikel 3, derde lid, van de Verordening, alsmede in
      de onderdelen 3.2, 5.6, 14.3, 15.3, 15.6, 16.6, 16.7 en 17 van Bijlage II van de Verordening, voorzover deze
      betrekking hebben op havenfaciliteiten.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel13
  - number: '14.1'
    text: |-
      Onverminderd [artikel 7 van de Wet particuliere beveiligingsorganisaties en recherchebureaus][ref1]
      zijn personen die bij havenfaciliteiten beveiligingswerkzaamheden verrichten als bedoeld in
      [artikel 1, onderdeel c, van die wet][ref2], in het bezit van een op naam gesteld en geldig certificaat
      Havenbeveiliger als bewijs dat zij met goed gevolg het examen Havenbeveiliger hebben afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0008973#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008973#Artikel1
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008973
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0008973
        artikel: '1'
  - number: '14.2'
    text: |-
      Bij een aanvraag om toestemming als bedoeld in
      [artikel 7, tweede lid, van de Wet particuliere beveiligingsorganisaties en recherchebureaus][ref1], voor een
      persoon als bedoeld in het eerste lid, wordt een afschrift van het certificaat overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0008973#Artikel7
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008973
        artikel: '7'
  - number: '14.3'
    text: |-
      Op aanvraag kan Onze Minister een certificaat erkennen dat is afgegeven in een andere lidstaat van de Europese
      Unie, dan wel een Staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij een daartoe strekkend of
      mede daartoe strekkend Verdrag dat Nederland bindt, en dat een beroepsniveau waarborgt dat ten minste gelijkwaardig
      is aan het niveau dat met het certificaat, bedoeld in eerste lid, wordt nagestreefd.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel14
  - number: '14.4'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld betreffende het in het eerste lid bedoelde examen
      Havenbeveiliger, de geldigheidsduur van het certificaat Havenbeveiliger en de in het derde lid bedoelde erkenning
      van het certificaat.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel14
  - number: '14.5'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld betreffende de voorwaarden voor registratie van bestaande
      certificaten en de geldigheidsduur van deze registratie.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel14
  - number: 14a.1
    text: |-
      Bij ministeriële regeling wordt bepaald in welke van de in onderdeel 18.1 van Bijlage III bij de Verordening
      genoemde onderdelen een veiligheidsbeambte van een havenfaciliteit moet worden opgeleid.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel14a
  - number: 14a.2
    text: |-
      Bij regeling van Onze Minister worden regels gesteld over de wijze waarop wordt aangetoond dat de
      veiligheidsbeambte van een havenfaciliteit een opleiding met goed gevolg heeft afgerond en voldoet aan de
      onderdelen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel14a
  - number: '15.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter uitvoering van verdragen of van besluiten van
      instellingen van de EU alleen of gezamenlijk, regels worden gesteld omtrent:
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel15
  - number: 15.1.a
    text: de in deze wet geregelde onderwerpen;
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel15
  - number: 15.1.b
    text: |-
      de beveiliging van havens, voorzover het betreft het vergroten van de veiligheid van havens, het uitvoeren van
      veiligheidsbeoordelingen voor havens, het opstellen van beveiligingsplannen voor havens, het vaststellen van
      veiligheidsniveaus voor havens, alsmede de opleiding en training van personen die belast zijn met taken in het
      kader van de veiligheid van havens.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel15
  - number: '15.2'
    text: |-
      Bij de regels, bedoeld in het eerste lid, kunnen taken worden opgedragen en bevoegdheden worden verleend aan de
      burgemeester.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel15
  - number: '15.3'
    text: |-
      Ten behoeve van de nakoming van de regels, bedoeld in het eerste lid, en het toezicht hierop kunnen
      persoonsgegevens worden verwerkt. Deze gegevensverwerking heeft tot doel de verbetering van de beveiliging van
      schepen en havenfaciliteiten te ondersteunen. Onze Minister of de bij of krachtens algemene maatregel van bestuur
      aangewezen bevoegde autoriteit is verwerkingsverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel15
  - number: '16.1'
    text: |-
      De verplichtingen ingevolge de Verordening en deze wet zijn met ingang van 1 juli 2005 mede van toepassing op de
      voor binnenlandse reizen gebruikte passagiersschepen die behoren tot Klasse A als bedoeld in de bij regeling van
      Onze Minister aangewezen richtlijn inzake veiligheidsvoorschriften en -normen voor passagiersschepen.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel16
  - number: '16.2'
    text: |-
      Een wijziging van de in het eerste lid bedoelde richtlijn, gaat voor de toepassing van de verplichtingen ingevolge
      de Verordening en deze wet op de voor binnenlandse reizen gebruikte passagiersschepen die behoren tot Klasse A als
      bedoeld in die richtlijn, gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet
      zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel16
  - number: 16a
    text: |-
      Een autoriteit voor havenveiligheid verstrekt op verzoek van Onze Minister aan hem, binnen de bij dat verzoek
      aangegeven periode, alle inlichtingen met betrekking tot de uitvoering van het havenveiligheidsplan in de
      desbetreffende haven of in het desbetreffende havengerelateerde gebied.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel16a
  - number: 16b
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld over de uitvoering van voorschrift 9, Bijlage I
      bij de Verordening, waaronder over de bevoegdheid om op te treden.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel16b
  - number: '17.1'
    text: |-
      Met het toezicht op de naleving van de Verordening en het bepaalde bij of krachtens deze wet zijn belast de bij
      besluit van Onze Minister aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel17
  - number: '17.2'
    text: |-
      Met het toezicht op de naleving van de Verordening, voorzover het de bepalingen betreft die zijn genoemd in
      [artikel 4, eerste lid][ref1], en het bepaalde bij of krachtens deze wet zijn eveneens belast de bij besluit van
      burgemeester en wethouders aangewezen personen, voorzover het havenfaciliteiten betreft waarvoor de burgemeester
      ingevolge deze wet het bevoegd gezag is en voor zover het binnen de haven gelegen overige werken of voorzieningen
      ten behoeve van het commercieel vervoer over zee of voor zover het havengerelateerd gebied betreft waarvoor hij
      ingevolge deze wet de autoriteit voor havenveiligheid is.


      [ref1]: https://wetten.overheid.nl/BWBR0016991#Artikel4
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0016991
        artikel: '4'
        paragraaf: '2'
  - number: '17.3'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel17
  - number: '18.1'
    text: |-
      Onze Minister is, als bevoegd gezag ingevolge deze wet of ingevolge een algemene maatregel van bestuur als bedoeld
      in [artikel 15, eerste lid][ref1], bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van de bij
      of krachtens deze wet gestelde verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0016991#Artikel15
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0016991
        artikel: '15'
        paragraaf: '5'
  - number: '18.2'
    text: |-
      De bevoegdheid tot oplegging van een last onder bestuursdwang, bedoeld in het eerste lid, komt mede toe aan de bij
      besluit van Onze Minister aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel18
  - number: 18a
    text: |-
      Voor zover noodzakelijk om te voldoen aan de vereisten van artikel 16, tweede lid, van de richtlijn, wijst Onze
      Minister, in overeenstemming met [artikel 3, eerste lid, van de Wet veiligheidsonderzoeken][ref1], functies als
      vertrouwensfuncties aan.


      [ref1]: https://wetten.overheid.nl/BWBR0008277#Artikel3
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0008277
        artikel: '3'
  - number: 19a
    text: |-
      Een wijziging van de richtlijn bedoeld in [artikel 1, onderdeel b][ref1], gaat voor de toepassing van deze wet
      gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0016991#Artikel1
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0016991
        artikel: '1'
        paragraaf: '1'
  - number: '20'
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst, met dien verstande dat indien de datum van uitgifte op 29 juni 2004 of een eerder tijdstip is gelegen,
      [artikel 11][ref1] met ingang van 1 juli 2004 in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0016991#Artikel11
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0016991
        artikel: '11'
        paragraaf: '3'
  - number: '21'
    text: 'Deze wet wordt aangehaald als: Havenbeveiligingswet.'
    url: https://wetten.overheid.nl/BWBR0016991/2024-01-01#Artikel21
