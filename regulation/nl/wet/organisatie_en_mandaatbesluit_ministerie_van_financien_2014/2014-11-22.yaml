  - number: '4'
    text: |-
      De DG’s zijn verantwoordelijk voor de beleidsterreinen van de onder hen ressorterende directies, genoemd in
      [artikel 7 onder c tot en met f][ref1], voor de samenhang tussen die beleidsterreinen en voor de bijbehorende
      bedrijfsvoering. De DG’s hebben een plaatsvervanger, die hen bij afwezigheid vervangt. De DG’s geven op collegiale
      wijze leiding aan de onder hen ressorterende directeuren en voorzien daartoe in de nodige ondermandaten van die
      directeuren.


      [ref1]: https://wetten.overheid.nl/BWBR0035769#Artikel7
