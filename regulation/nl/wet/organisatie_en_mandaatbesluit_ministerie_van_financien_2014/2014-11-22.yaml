  - number: '21'
    text: |-
      De SG en de DG’s leggen, aan het eind van het verslagjaar en tussentijds, gestructureerd verantwoording af over de
      uitvoering van aan hen opgelegde taken en het gebruik van daarbij verleende bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0035769/2014-11-22#Artikel21
  - number: '22'
    text: |-
      1 De SG stelt ieder jaar een jaarplan op. De DG’s stellen ieder jaar een jaarplan op en bespreken dit met de SG.
      In het jaarplan worden beleidsdoelstellingen opgenomen, alsmede een risicoanalyse, voorgenomen activiteiten en
      budgetten.

      2 De SG stelt gedurende het jaar twee uitvoeringsrapportages op. De DG’s stellen gedurende het jaar twee
      uitvoeringsrapportages op en bespreken deze met de SG. In de uitvoeringsrapportages wordt gerapporteerd over het
      realiseren van beleidsdoelstellingen en activiteiten, over de uitputting van budgetten en over bijzonderheden in
      de bedrijfsvoering.

      3 Op basis van de uitvoeringsrapportages van de SG en de DG's stelt de directeur Financieel-Economische Zaken
      tweemaal per jaar een concernrapportage op die wordt besproken in de bestuursraad.

      4 De SG stelt na afloop van ieder jaar een jaarrapportage en een managementverklaring op. De DG’s stellen na
      afloop van ieder jaar een jaarrapportage en een managementverklaring op en bespreken deze met de SG. In de
      managementverklaring wordt verslag gedaan van afwijkingen in de bedrijfsvoering en over de risicobeheersing
      daarbij. Voorts bevat de managementverklaring een oordeel over de rechtmatigheid van de gedane uitgaven.

      5 De SG stelt na afloop van ieder jaar een samenvattende managementverklaring op en brengt deze ter kennis van
      de minister.
    url: https://wetten.overheid.nl/BWBR0035769/2014-11-22#Artikel22
  - number: '23'
    text: |-
      1 De directeur Financieel-Economische Zaken (FEZ) ondersteunt in de vorm van toezicht en advies de SG en de DG’s
      bij hun overkoepelende verantwoordelijkheid voor beleidsterreinen en bijbehorende bedrijfsvoering.

      2 De directeur FEZ vervult de rol van concerncontroller – vanuit de in wet- en regelgeving, waaronder
      de [Comptabiliteitswet 2001][ref1], vastgelegde taken – bij de totstandkoming van solide begrotingen en
      verantwoordingen in het kader van de planning- en controlcyclus, en bij de beoordeling van voorstellen met
      financiële gevolgen.

      3 De verantwoordelijkheden en bevoegdheden van de directeur FEZ zijn vastgelegd in het [Besluit taak FEZ][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013891
      [ref2]: https://wetten.overheid.nl/BWBR0005333
    url: https://wetten.overheid.nl/BWBR0035769/2014-11-22#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0013891
      - id: ref2
        bwb_id: BWBR0005333
  - number: '24'
    text: |-
      1 De directeur Auditdienst Rijk (ADR), respectievelijk de certificerend accountant van de ministeries, verschaft
      zekerheid over de rechtmatigheid van verplichtingen, de uitgaven en de ontvangsten van de aangesloten ministeries.
      Hij voert de accountantscontrole uit op de jaarverslagen van deze ministeries. Hij informeert de algemene leiding,
      de bewindspersonen en het Audit Committee over de uitkomsten van deze werkzaamheden.

      2 In opdracht van de algemene leiding of van de directeuren onderzoekt de directeur ADR, respectievelijk de
      certificerend accountant van de ministeries, de beleids- en bedrijfsvoering en rapporteert daarover aan de
      opdrachtgever en aan het Audit Committee.

      3 De verantwoordelijkheden en bevoegdheden van de directeur ADR zijn vastgelegd in het [Besluit taak DAD][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007535
    url: https://wetten.overheid.nl/BWBR0035769/2014-11-22#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0007535
  - number: '25'
    text: |-
      1 Er is een Audit Committee.

      2 Het Audit Committee is samengesteld uit drie externe leden en twee leden van de bestuursraad. Eén van de externe
      leden is de voorzitter van het Audit Committee.

      3 De externe leden van het Audit Committee kunnen hun bevindingen separaat aan de minister kenbaar maken.
    url: https://wetten.overheid.nl/BWBR0035769/2014-11-22#Artikel25
  - number: '26'
    text: |-
      De volgende regeling wordt ingetrokken: [Organisatie- en mandaatbesluit Ministerie van Financiën][ref1], zoals
      laatstelijk gewijzigd bij besluit van 20 februari 2013.


      [ref1]: https://wetten.overheid.nl/BWBR0018723
    url: https://wetten.overheid.nl/BWBR0035769/2014-11-22#Artikel26
