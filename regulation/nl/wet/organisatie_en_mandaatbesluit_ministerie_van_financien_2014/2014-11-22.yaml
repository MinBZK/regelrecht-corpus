      1 De SG kan, met inachtneming van de taken genoemd in [artikel 8][ref1] en passend binnen de in [artikel 7][ref2]
      genoemde hoofdstructuur van de rechtstreeks onder hem ressorterende dienstonderdelen, tijdelijke directies of
