      2 De SG kan de DG’s toestemming verlenen om, met inachtneming van de taken genoemd in [artikel 7][ref3] en passend
      binnen de in [artikel 8][ref4] genoemde hoofdstructuur van hun directoraat-generaal, tijdelijke directies of
      projectdirecties in te stellen.


