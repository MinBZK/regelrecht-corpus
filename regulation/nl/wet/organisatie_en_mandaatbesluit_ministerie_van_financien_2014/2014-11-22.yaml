  - number: '5'
    text: |-
      1 Er is een bestuursraad. De volgende functionarissen voeren in de bestuursraad regelmatig collegiaal overleg over
      de hoofdlijnen van beleidsontwikkeling en -uitvoering, over de hoofdlijnen van de departementale bedrijfsvoering en
      over al het andere dat nodig is voor een goed functioneren van het ministerie:

      a. de SG;

      b. de directeur-generaal Belastingdienst;

      c. de directeur-generaal voor Fiscale Zaken;

      d. de directeur-generaal van de Rijksbegroting;

      e. de thesaurier-generaal.

      2 De bestuursraad staat onder voorzitterschap van de SG en elk van de functionarissen neemt daaraan deel met
      volledig behoud van de eigen verantwoordelijkheden en bevoegdheden. De directie Bestuurlijke en Juridische Zaken
      verzorgt het secretariaat van de bestuursraad.

      3 Er is een bedrijfsvoeringsberaad. De volgende functionarissen voeren in het bedrijfsvoeringsberaad regelmatig
      collegiaal overleg over beleidsvoorstellen met betrekking tot de departementale bedrijfsvoering:

      a. een lid van het Management team van het directoraat-generaal Belastingdienst;

      b. de plaatsvervangend directeur-generaal voor Fiscale Zaken;

      c. de plaatsvervangend directeur-generaal van de Rijksbegroting;

      d. een directeur van de Generale Thesaurie;

      e. de directeur Financieel-Economische Zaken;

      f. de directeur Bedrijfsvoering;

      g. een directeur van het SG-cluster.

      4 Het bedrijfsvoeringsberaad kent een roulerend voorzitterschap en elk van de functionarissen neemt deel aan het
      beraad met volledig behoud van de eigen verantwoordelijkheden en bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0035769/2014-11-22#Artikel5
  - number: '6'
    text: |-
      Over vraagstukken die van politiek gevoelige of anderszins zwaarwegende aard zijn, treedt de algemene leiding in
      contact met de bewindspersoon die het aangaat, voordat van bevoegdheden gebruik wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0035769/2014-11-22#Artikel6
  - number: '7'
    text: |-
      Het ministerie bestaat uit de volgende organisatieonderdelen:

      a. de hierna genoemde ministeriebrede organisatieonderdelen van het SG-cluster die rechtstreeks ressorteren onder
      de SG:

      1°. de directie Algemene Financiële en Economische Politiek;

      2°. de directie Bedrijfsvoering;

      3°. de directie Bestuurlijke en Juridische Zaken;

      4°. de directie Communicatie;

      5°. de directie Financieel-Economische Zaken.

      b. de hierna genoemde Rijksbrede organisatieonderdelen van het SG-cluster die rechtstreeks ressorteren onder de SG:

      1°. de Auditdienst Rijk;

      2°. de dienst Domeinen Roerende Zaken.

      c. de Belastingdienst, die rechtstreeks ressorteert onder de directeur-generaal Belastingdienst en waarvan
      het directoraat-generaal Belastingdienst de concernstaf vormt. De directeur-generaal Belastingdienst richt de
      organisatie van de Belastingdienst in overeenstemming met de staatssecretaris in vanuit diens verantwoordelijkheid
      voor de Belastingdienst. Het directoraat-generaal Belastingdienst bestaat uit de volgende onderdelen:

      1°. Cluster Uitvoeringsbeleid;

      2°. Cluster Fiscaliteit;

      3°. Cluster Bedrijf;

      4°. Cluster Informatie Voorzieningen-beleid.

      d. de hierna genoemde organisatieonderdelen van het directoraat-generaal voor Fiscale Zaken, die rechtstreeks
      ressorteren onder de directeur-generaal voor Fiscale Zaken:

      1°. de directie Algemene Fiscale Politiek;

      2°. de directie Internationale Zaken en Verbruiksbelastingen;

      3°. de directie Directe Belastingen;

      e. de hierna genoemde organisatieonderdelen van het directoraat-generaal van de Rijksbegroting, die rechtstreeks
      ressorteren onder de directeur-generaal van de Rijksbegroting:

      1°. de directie Begrotingszaken;

      2°. de Inspectie der Rijksfinanciën;

      f. de hierna genoemde organisatieonderdelen van de Generale Thesaurie, die rechtstreeks ressorteren onder de
      thesaurier-generaal;

      1°. de directie Buitenlandse Financiële Betrekkingen;

      2°. de directie Financiële Markten;

      3°. de directie Financieringen;

      4°. het Agentschap van de Generale Thesaurie.
    url: https://wetten.overheid.nl/BWBR0035769/2014-11-22#Artikel7
  - number: '8'
    text: |-
      1 De organisatieonderdelen van het SG-cluster als genoemd in [artikel 7, onder a][ref1]:

      a. ondersteunen de organisatieonderdelen van het ministerie op het gebied van organisatie, personeel, financiën,
      salaris, communicatie, documentaire informatievoorziening, archiefbeheer, facilitaire dienstverlening en ICT;

      b. behartigen, specifieke ministeriebrede functies inzake:

      1°. algemeen juridische en Europeesrechtelijke advisering;

      2°. politiek-bestuurlijke advisering van algemene aard;

      3°. ondersteunende werkzaamheden voor de algemene leiding;

      4°. communicatiebeleid en begeleiding van communicatie-uitingen van de bewindslieden en het ministerie;

      5°. de controlfunctie voor het ministerie;

      6°. het integriteitsbeleid;

      7°. De advisering over en onderzoek naar het te voeren financieel-economisch beleid.

      2 De organisatieonderdelen van het SG-cluster als genoemd in [artikel 7, onder b][ref2], behartigen ministerie- en
      Rijksbrede functies inzake:

      a. de auditfunctie voor het ministerie en in opdracht van andere ministers de auditfunctie voor andere ministeries;

      b. het beheer en verkoop van overtollige en door overheidsinstanties in beslag genomen roerende zaken.

      3 Het directoraat-generaal Belastingdienst:

      a. adviseert de bewindslieden en de algemene leiding over alle aangelegenheden inzake de Belastingdienst;

      b. toetst voorgenomen wetgeving op uitvoeringsaspecten voor de Belastingdienst;

      c. adviseert over het uitvoeringsbeleid van fiscale, douane-, en invorderingswetgeving;

      d. adviseert over het dienstverlenings-, toezichts- en opsporingsbeleid van de Belastingdienst;

      e. adviseert over het uitvoeringsbeleid van internationale gegevensuitwisseling op het gebied van belastingen;

      f. heeft een strategie- en onderzoeksfunctie op zijn beleidsterrein;

      g. voert de
      [Wet op de verlening van bijstand aan de Europese Commissie bij controles en verificaties ter plaatse][ref3] uit.

      4 Het directoraat-generaal voor Fiscale Zaken:

      a. adviseert over het te voeren fiscaal beleid en bereidt de belastingwetgeving voor;

      b. adviseert over het internationale beleid op het gebied van fiscaliteit en douane;

      c. bereidt wetgeving en internationale regelingen voor op het gebied van de directe belastingen, de
      verbruiksbelastingen en wat daarmee verband houdt en adviseert over het hiermee samenhangende beleid;

      d. adviseert over het beleid en bereidt wetgeving voor op het gebeid van de uitvoering van toeslagen door de
      Belastingdienst.

      e. heeft een strategie- en onderzoeksfunctie op zijn beleidsterrein.

      5 Het directoraat-generaal van de Rijksbegroting:

      a. adviseert met betrekking tot de beheersing van de collectieve uitgaven van het Rijk;

      b. bewaakt namens de minister als toezichthouder de doelmatigheid, doeltreffendheid en rechtmatigheid van de
      collectieve uitgaven;

      c. doet voorstellen voor effectieve begrotingsregels en infrastructuur van de begroting;

      d. voorziet in transparantie over de budgettaire besluitvorming;

      e. heeft een strategie- en onderzoeksfunctie op zijn beleidsterrein.

      6 De Generale Thesaurie:

      a. adviseert over het beleid ten aanzien van de financiële markten en het toezicht daarop en bereidt de daartoe
      benodigde wetgeving voor;

      b. vervult namens de bewindspersoon het aandeelhouderschap in de staatsdeelnemingen;

      c. adviseert over publiek-private samenwerking;

      d. adviseert over buitenlands financiële betrekkingen;

      e. voorziet in de uitgifte en het beheer van de Nederlandse staatsschuld;

      f. heeft een strategie- en onderzoeksfunctie op zijn beleidsterrein.


