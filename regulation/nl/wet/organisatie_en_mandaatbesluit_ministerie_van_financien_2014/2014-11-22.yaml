  - number: '27'
    text: |-
      Deze regeling treedt in werking met ingang van de dag na de dagtekening van de Staatscourant waarin zij wordt
      geplaatst en werkt terug tot 1 mei 2014.
    url: https://wetten.overheid.nl/BWBR0035769/2014-11-22#Artikel27
