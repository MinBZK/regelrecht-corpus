        artikel: '11'
        hoofdstuk: '4'
  - number: '13'
    text: |-
      1 De SG en DG’s hebben binnen het kader van de jaarplannen en binnen eventueel door de minister of namens de
      minister door de SG gegeven richtlijnen mandaat ten aanzien van het nemen van besluiten en afdoen van stukken
      betreffende alle aangelegenheden die behoren tot hun werkterrein tenzij bij wet anders is bepaald of de aard van de
      bevoegdheid zich daartegen verzet. De SG en DG’s oefenen die bevoegdheden uit met inachtneming van de bevoegdheden
      van de op hun dienstonderdeel ingestelde ondernemingsraden.

      2 De ondertekening van uitgaande stukken zal luiden als volgt:

      De Minister van Financiën, resp. De Staatssecretaris van Financiën,

      namens deze,

      gevolgd door de aanduiding van de (onder)gemandateerde functionaris.
    url: https://wetten.overheid.nl/BWBR0035769/2014-11-22#Artikel13
  - number: '14'
    text: |-
      1 De SG en de DG’s kunnen ieder voor hun werkterrein ondermandaat verlenen.

      2 Directeuren kunnen het aan hen verleende ondermandaat doormandateren. Voor ondermandaat door een directeur is de
      goedkeuring door de SG of de DG vereist.

      3 In een ondermandaat wordt de omvang ervan aangegeven.

      4 De directeur Bestuurlijke en Juridische Zaken draagt zorg voor openbare terinzagelegging op het ministerie
      en bekendmaking op het intranet en de internetsite van het ministerie van de krachtens deze regeling verleende
      ondermandaten.
    url: https://wetten.overheid.nl/BWBR0035769/2014-11-22#Artikel14
  - number: '15'
    text: |-
      Onderdeel van deze regeling vormt een mandaatregister dat is opgenomen in [bijlage 2][ref1]. Het mandaatregister
      bevat handtekeningen en parafen van de in dit besluit gemandateerde functionarissen.


      [ref1]: https://wetten.overheid.nl/BWBR0035769
    url: https://wetten.overheid.nl/BWBR0035769/2014-11-22#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0035769
  - number: '16'
    text: |-
      Bij het nemen van besluiten, afdoen van stukken en ondertekenen van uitgaande brieven met betrekking tot alle
      personeelsaangelegenheden betreffende het kernministerie als bedoeld in de [bijlage][ref1] bij deze regeling is
      advies van de directeur Bedrijfsvoering vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0035769
    url: https://wetten.overheid.nl/BWBR0035769/2014-11-22#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0035769
  - number: '17'
    text: |-
      Voor zover voorgenomen besluiten met financiële consequenties niet passen binnen de door de SG vastgestelde
      budgetten, is instemming van de directeur Financieel-Economische Zaken vereist.
    url: https://wetten.overheid.nl/BWBR0035769/2014-11-22#Artikel17
  - number: '18'
    text: |-
      Voor de toepassing van deze regeling en de daarop berustende bepalingen wordt met de verlening van mandaat
      gelijkgesteld de verlening van:

      a. volmacht,

      en

      b. machtiging om in naam van een bewindspersoon handelingen te verrichten die noch een besluit, noch een
      privaatrechtelijke rechtshandeling zijn.
    url: https://wetten.overheid.nl/BWBR0035769/2014-11-22#Artikel18
  - number: '19'
    text: |-
      Aan de bewindspersonen is voorbehouden het afdoen en ondertekenen van stukken:

      a. gericht aan de Koningin;

      b. gericht aan de Raad van State;

      c. gericht aan de ministerraad (van het Koninkrijk);

      d. gericht aan de Eerste of Tweede Kamer der Staten-Generaal;

      e. gericht aan de president van de Algemene Rekenkamer;

      f. gericht aan autoriteiten in binnen- en buitenland, gelijk of hoger in rang dan een minister of staatssecretaris;

      g. zijnde Ministeriële regelingen houdende algemeen verbindende voorschriften.
    url: https://wetten.overheid.nl/BWBR0035769/2014-11-22#Artikel19
  - number: '20'
    text: |-
      Aan de SG is voorbehouden het afdoen en ondertekenen van stukken:

      a. betreffende voorstellen omtrent de vaststelling van de hoofdstructuur van het ministerie, tot en met het niveau
      van directies;

      b. betreffende de vaststelling van de formatie van schaal 15 en hoger;

      c. betreffende de benoeming van ambtenaren in functies van schaal 15 tot en met 18;

      d. betreffende de besluiten tot bezoldiging conform [artikel 8][ref1] en tot bijzondere beloning conform
      [artikel 22a BBRA][ref2] van functionarissen in schaal 15 tot en met 18, met uitzondering van de toekenning van
      de incidentele beloningen op grond van artikel 22a BBRA die gedurende het jaar worden toegekend voor incidentele,
      bijzondere prestaties. De bevoegdheid tot het nemen van deze besluiten berust bij de DG’s en de SG.


      [ref1]: https://wetten.overheid.nl/BWBR0035769#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003630#Artikel22a
