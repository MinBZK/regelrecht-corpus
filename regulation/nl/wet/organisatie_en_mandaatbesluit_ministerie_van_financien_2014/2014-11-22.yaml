  - number: '10'
    text: |-
      1 De SG stelt een organisatie- en mandaatbesluit vast voor de rechtstreeks onder hem ressorterende
      dienstonderdelen.

      2 De DG’s stellen, in overeenstemming met de SG, een organisatie- en mandaatbesluit voor hun directoraat-generaal
      vast.
    url: https://wetten.overheid.nl/BWBR0035769/2014-11-22#Artikel10
  - number: '11'
    text: |-
      1 De SG en DG’s zijn hoofdbudgethouder voor wat betreft hun taken en zijn uit dien hoofde bevoegd verplichtingen –
      met financiële consequenties – aan te gaan en uitgaven goed te keuren binnen hun budgetten.

      2 De SG stelt, na advies van de directeur FEZ, de hoogte vast van de budgetten bedoeld in het eerste lid.

      3 De hoofdbudgethouders zijn verantwoordelijk voor een adequaat financieel beheer.
    url: https://wetten.overheid.nl/BWBR0035769/2014-11-22#Artikel11
  - number: '12'
    text: |-
      1 De SG en de DG’s kunnen voor de in [artikel 11][ref1] genoemde bevoegdheden ondermandaat verlenen aan
      budgethouders.

      2 In een ondermandaat wordt de omvang ervan aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0035769#Artikel11
    url: https://wetten.overheid.nl/BWBR0035769/2014-11-22#Artikel12
