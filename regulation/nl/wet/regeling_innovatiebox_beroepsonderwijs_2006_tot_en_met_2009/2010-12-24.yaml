preamble:
  text: |-
    Mede namens de Minister van Landbouw, Natuur en Voedselkwaliteit;

    Overwegende dat het wenselijk is om verschillende innovatiebudgetten te bundelen en dat voor het jaar 2006 op grond
    van artikel 3 van de Wet Fonds economische structuurversterking middelen zijn toegevoegd aan de begroting van het
    Ministerie van Onderwijs, Cultuur en Wetenschap voor ICES projecten op het terrein van kennisinfrastructuur;

    Gelet op de artikelen 2.2.3, derde lid, 2.4.3, 12.3.8, tweede lid en 12.3.9, tweede lid, van de Wet educatie en
    beroepsonderwijs;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0019905/2010-12-24#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. WEB: de [Wet educatie en beroepsonderwijs][ref1];

      b. instelling: een instelling als bedoeld in [artikel 1.1.1, onder b][ref2], een instituut als bedoeld in
      [artikel 12.3.8][ref3], dan wel een hogeschool als bedoeld in [artikel 12.3.9 van de WEB][ref4] dan wel door
      rechtsopvolgers voor wat betreft de beroepsopleidende leerweg;

      c. AOC: een agrarisch opleidingscentrum als bedoeld in [artikel 1.3.3 van de WEB][ref5];

      d. Minister: de Minister van Onderwijs, Cultuur en Wetenschap en, voor zover het betreft het beroepsonderwijs op
      het gebied van de landbouw en de natuurlijke omgeving, de Minister van Landbouw, Natuur en Voedselkwaliteit;

      e. FES-middelen: middelen op de begroting van het Ministerie voor Onderwijs, Cultuur en Wetenschap die beschikbaar
      zijn gesteld op grond van [artikel 3 van de Wet Fonds economische structuurversterking][ref6];

      f. Groene kenniscoöperatie: het samenwerkingsverband van de agrarische onderwijscentra, de instellingen voor hoger
      beroepsonderwijs in het domein Landbouw en natuurlijke omgeving en Wageningen universiteit;

      g. Aequor: het kenniscentrum op het gebied van de landbouw en de natuurlijke omgeving.


