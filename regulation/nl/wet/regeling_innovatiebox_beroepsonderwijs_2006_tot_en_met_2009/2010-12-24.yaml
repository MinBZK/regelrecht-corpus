  - number: '4'
    text: |-
      Voor het jaar 2011 is voor het verstrekken van een aanvullende vergoeding op grond van deze regeling beschikbaar:

      a. voor instellingen, uitgezonderd AOC’s: € 42.978.000;

      b. voor AOC’s: € 4.845.000.
    url: https://wetten.overheid.nl/BWBR0019905/2010-12-24#Artikel4
  - number: 4a
    text: |-
      Een instelling kan de FES-middelen die in 2007 en 2008 zijn ontvangen, slechts besteden indien minimaal 35% van
      de kosten die zijn verbonden aan een doel, bedoeld in [artikel 2, vierde lid][ref1], aan cofinanciering wordt
      gerealiseerd.


