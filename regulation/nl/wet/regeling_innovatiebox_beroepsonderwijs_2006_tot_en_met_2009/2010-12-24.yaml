    text: |-
      Voor een AOC bedraagt de aanvullende vergoeding een evenredig gedeelte van het voor het desbetreffende kalenderjaar
      voor de agrarische onderwijscentra beschikbare budget welk gedeelte wordt berekend:

      a. voor wat betreft de FES-middelen naar rato van de omvang van de rijksbijdrage berekend
      op grond van de [artikelen 2.2.2, eerste lid][ref1], [2.4.1, eerste lid][ref2], en
      [6.1.3, tweede lid, van het Uitvoeringsbesluit WEB][ref3] die het AOC in het desbetreffende jaar ontvangt;

      b. voor wat betreft de overige middelen: naar rato van de omvang van de rijksbijdrage berekend op grond van
      de [artikelen 2.2.2, eerste lid][ref4], [2.3.2, eerste lid][ref5], [2.4.1, eerste en derde lid][ref6], en
      [6.1.3, tweede lid, van het Uitvoeringsbesluit WEB][ref7] die het AOC in het desbetreffende jaar ontvangt.


