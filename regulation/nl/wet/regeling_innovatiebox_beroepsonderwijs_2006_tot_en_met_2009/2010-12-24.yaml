  - number: '10'
    text: |-
      Instellingen leggen jaarlijks in ieder geval via het jaarverslag aan de partijen in de regio verantwoording af over
      de samenwerking, de inzet van de aanvullende vergoeding en de behaalde resultaten in relatie tot de afspraken en
      doelen, bedoeld in [artikel 3][ref1]. De agrarische onderwijscentra en Aequor leggen het jaarverslag tevens over
      aan de partners in de Groene kenniscoöperatie.


