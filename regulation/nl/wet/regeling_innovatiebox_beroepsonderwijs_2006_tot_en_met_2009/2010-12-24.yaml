  - number: '5'
    text: |-
      1 Voor de instellingen, uitgezonderd de agrarische onderwijscentra, bedraagt de aanvullende vergoeding een
      evenredig gedeelte van het voor het desbetreffende kalenderjaar voor die instellingen beschikbare budget, welk
      gedeelte met inachtneming van het tweede lid wordt berekend:

      a. voor een instelling als bedoeld in [artikel 1.1.1, onder b, 1° tot en met 3°, van de WEB][ref1], naar rato van
      de omvang van de rijksbijdrage berekend op grond van [artikel 2.2.2, eerste lid][ref2], [2.4.1, eerste lid][ref3]
      en [6.1.3, eerste lid, van het Uitvoeringsbesluit WEB][ref4] die de instelling in het desbetreffende jaar ontvangt;
      en

      b. voor een instituut als bedoeld in [artikel 12.3.8][ref5] en een hogeschool als bedoeld in
      [artikel 12.3.9 van de WEB][ref6], naar rato van de omvang van de rijksbijdrage berekend op grond van
      [artikel 2.1.1][ref7] respectievelijk [artikel 2.2.1 van de Uitvoeringsregeling WEB][ref8] die de instelling in het
      desbetreffende jaar ontvangt.

      2 De aanvullende vergoeding bedraagt ten minste € 11.470.


