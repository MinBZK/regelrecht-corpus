    text: |-
      1 Een instelling, uitgezonderd een AOC, maakt met relevante partijen in de regio afspraken over de concrete
      doelen en vormgeving van de innovatie en de uit te voeren activiteiten en richt zich daarbij op de thema’s van de
      innovatieagenda, bedoeld in [artikel 2][ref1], onderscheidenlijk de doelen beoogd met de FES-middelen.

      2 Een AOC maakt met relevante partijen in de regio en met de organisaties die samenwerken in de Groene
      Kenniscoöperatie de in het eerste lid bedoelde afspraken.

      3 Een instelling besteedt de aanvullende vergoeding aan innovatie in overeenstemming met de afspraken, bedoeld in
      het eerste en tweede lid.

      4 De FES-middelen die zijn verstrekt in 2007, worden uiterlijk in 2008 besteed. De FES-middelen die zijn verstrekt
      in 2008, worden uiterlijk in 2009 besteed. De aanvullende vergoeding, niet zijnde FES-middelen, wordt uiterlijk in
      2012 besteed.

      5 Een AOC besteedt het innovatiebudget dat voortvloeit uit de FES-middelen alleen voor het beroepsonderwijs.
      Het AOC mag het overige deel van het innovatiebudget bestemmen voor het beroepsonderwijs en het voorbereidende
      beroepsonderwijs binnen het AOC.


      [ref1]: https://wetten.overheid.nl/BWBR0019905#Artikel2
