  - number: '8'
    text: |-
      1 De betaling van de aanvullende vergoeding voor het jaar 2008 vindt plaats in oktober van dat jaar.

      2 De betaling van de aanvullende vergoeding voor het jaar 2009 vindt plaats in het tweede kwartaal van dat jaar.

      3 De betaling van de aanvullende vergoeding voor het jaar 2010 vindt plaats uiterlijk in het derde kwartaal van
      dat jaar.

      4 De betaling van de aanvullende vergoeding voor het jaar 2011 vindt plaats uiterlijk in het tweede kwartaal van
      dat jaar.
    url: https://wetten.overheid.nl/BWBR0019905/2010-12-24#Artikel8
  - number: '9'
    text: |-
      1 De aanvullende vergoeding en de FES-middelen worden uitsluitend aangewend voor de doelen waarvoor zij zijn
      verstrekt.

      2 De aanvullende vergoeding, niet zijnde FES-middelen, die op 1 januari 2013 niet is besteed wordt teruggevorderd.

      3 De FES-middelen die in 2007 zijn uitgekeerd en op 1 januari 2009 niet zijn besteed worden teruggevorderd. De FES-
      middelen die in 2008 zijn uitgekeerd en op 1 januari 2010 niet zijn besteed worden teruggevorderd.

      4 De verantwoording van de subsidie geschiedt in de jaarverslaggeving, bedoeld in de Regeling jaarverslaggeving
      onderwijs, met model G, behorende bij de Richtlijn RJ 660, alinea 212, zoals vastgesteld door de Raad voor de
      Jaarverslaggeving. De verwerking van niet-bestede middelen geschiedt in de jaarrekening van het laatste jaar van
      besteding.

      5 Aan de jaarrekening en het jaarverslag van de instelling wordt door het bevoegd gezag de informatie opgenomen,
      bedoeld in bijlage I bij deze regeling.

      6 De verklaring van de accountant bij de jaarrekening omvat tevens een oordeel over de rechtmatige besteding van de
      aanvullende vergoeding en de FES-middelen.

      7 De instellingsaccountant controleert aan de hand van de administratie van de instelling of is voldaan aan de eis
      van [artikel 4a][ref1].

      8 Indien niet is voldaan aan de eis van [artikel 4a][ref2], wordt een bedrag teruggevorderd dat gelijk is aan het
      verschil tussen de daadwerkelijk bestede FES-middelen en de FES-middelen die op grond van [artikel 4a][ref3] voor
      besteding zijn toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0019905#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0019905#Artikel4a
      [ref3]: https://wetten.overheid.nl/BWBR0019905#Artikel4a
