    text: |-
      1 Het doel van deze regeling:

      a. Het verstrekken van een aanvullende vergoeding op grond van [artikel 2.2.3., derde lid, van de WEB][ref1] aan
      de instellingen om in samenwerking met relevante partijen uit de regio innovatiedoelstellingen te verwezenlijken,
      gericht op de kwaliteitsverbetering van het beroepsonderwijs en passend binnen de thema’s van de innovatieagenda,
      bedoeld in het tweede lid;

      b. de verdeling van de FES-middelen die voor het jaar 2008 aan de begroting van het Ministerie van Onderwijs,
      Cultuur en Wetenschap zijn toegevoegd, gericht op de doelen genoemd in het vierde lid;

      c. het verstrekken van een aanvullende vergoeding aan kenniscentra voor de volgende doelen:

      1. het versterken van de beroepspraktijkvorming;

      2. het versterken van de competentiegerichte kwalificatiestructuur en;

      3. het oplossen van knelpunten in de aansluiting binnen de beroepskolom vanuit de kwalificatiestructuur
      beroepsonderwijs.

      2 De Minister stelt na overleg met Het Platform Beroepsonderwijs en de Stichting van de Arbeid een innovatieagenda
      vast waarin opgenomen de thema’s die richtinggevend zijn voor de innovatie van het beroepsonderwijs. De eerste
      innovatieagenda omvat de volgende thema’s:

      a. het bevorderen van competentiegericht beroepsonderwijs, met als subthema’s:

      1. het versterken van de beroepspraktijkvorming;

      2. het optimaliseren en flexibiliseren van de schoolorganisatie; en

      3. het verbeteren van de begeleiding van de deelnemer tijdens zijn binnen- en buitenschoolse leertrajecten;

      b. het verbeteren van de programmatische aansluiting tussen het voorbereidend middelbaar beroepsonderwijs, het
      beroepsonderwijs en het hoger beroepsonderwijs en de doorstroom van leerlingen in de beroepskolom;

      c. het optimaliseren van vernieuwing in het beroepsonderwijs met behulp van het bedrijfsleven en van vernieuwing in
      het bedrijfsleven, in het bijzonder het midden- en kleinbedrijf, met behulp van het beroepsonderwijs; en

      d. het bevorderen van ondernemerschap.

      3 Bij de invulling van de vier thema’s van de innovatieagenda, bedoeld in het tweede lid, richten de agrarische
      onderwijscentra zich mede op een aantoonbare bijdrage aan de ontwikkeling van en benutting van kennis in sectoren
      waarvoor het beleid van het Ministerie van Landbouw, Natuur en Voedselkwaliteit relevant is.

      4 Het innovatiebudget dat voortvloeit uit de FES-middelen wordt door een instelling besteed dat elk van de volgende
      doelen daarbij aan de orde komt:

      a. het ontwikkelen van lesmateriaal en examenmateriaal voor competentiegericht beroepsonderwijs;

      b. het investeren in kennis van docenten over het bedrijfsleven door middel van docentstages en

      c. het aanjagen van instroom vanuit zwakkere groepen uit de beroepsbevolking tot 23 jaar in maatwerktrajecten die
      vooral of geheel in de praktijk worden uitgevoerd.


