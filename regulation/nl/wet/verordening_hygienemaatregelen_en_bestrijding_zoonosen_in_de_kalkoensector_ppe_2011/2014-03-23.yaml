  - number: '14'
    text: |-
      1 Het bestuur stelt bij besluit nadere regels vast ten aanzien van de wijze waarop, het tijdstip waarop en de
      frequentie waarmee het hygiënogram als bedoeld in de [artikelen 3][ref1] en [9][ref2] en het hygiëneonderzoek
      als bedoeld [artikel 6][ref3] worden uitgevoerd alsmede ten aanzien van de vervolgmaatregelen die de ondernemer op
      basis van de uitslag van het hygiënogram of het hygiëneonderzoek neemt.

      2 Het bestuur stelt bij besluit nadere regels vast ten aanzien van de wijze, het tijdstip en de frequentie van
      de monsterneming, de detectie en de serotypering als bedoeld in de [artikelen 4][ref4], [7][ref5], [10][ref6] en
      [12][ref7] alsmede ten aanzien van het verificatieonderzoek als bedoeld in de artikelen 4, 7 en 12.

      3 Het bestuur stelt bij besluit nadere regels vast ten aanzien van het ruimen, het verwerken of vernietigen van de
      broedeieren, het reinigen en ontsmetten en het stalonderzoek als bedoeld in [artikel 5][ref8], ten aanzien van de
      maatregelen als bedoeld in [artikel 8][ref9], alsmede ten aanzien van het afvoeren van het stalkoppel uit de stal,
      het reinigen en ontsmetten, het stalonderzoek en de maatregelen als bedoeld in [artikel 11][ref10].


