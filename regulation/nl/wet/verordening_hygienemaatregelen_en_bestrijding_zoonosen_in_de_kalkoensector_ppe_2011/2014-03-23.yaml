  - number: '3'
    text: |-
      De ondernemer die een fokbedrijf, opfokbedrijf of vermeerderingsbedrijf uitoefent mag een stalkoppel pas in de
      stal plaatsen nadat hij de stal heeft gereinigd en ontsmet. Hij is verplicht om één maal per kalenderjaar na het
      reinigen en ontsmetten van de stal een hygiënogram in de stal te laten uitvoeren en de vervolgmaatregelen te nemen
      die op basis van de uitslag van het hygiënogram zijn voorgeschreven, voordat hij een stalkoppel in de stal plaatst.
    url: https://wetten.overheid.nl/BWBR0030628/2014-03-23#Artikel3
  - number: '4'
    text: |-
      1 De ondernemer die een fokbedrijf, opfokbedrijf of vermeerderingsbedrijf uitoefent draagt er zorg voor dat een
      onderzoek naar de aanwezigheid van Salmonella van alle op zijn bedrijf aanwezige stalkoppels plaatsvindt door
      middel van het nemen van monsters, detectie en, in geval van Salmonella, serotypering.

      2 Indien het voor detectie van Salmonella erkende laboratorium de aanwezigheid van Salmonella in de in het
      eerste lid bedoelde monsters heeft gedetecteerd, laat de ondernemer die een fokbedrijf, opfokbedrijf of
      vermeerderingsbedrijf uitoefent deze monsters onverwijld na de detectie serotyperen door een voor serotypering
      erkend laboratorium.

      3 Indien het voor serotypering erkende laboratorium het serotype Salmonella Enteritidis of Salmonella Typhimurium
      dan wel enig ander door het bestuur bij besluit vast te stellen serotype Salmonella in de in het eerste lid
      bedoelde monsters heeft bepaald, draagt de ondernemer die een fokbedrijf, opfokbedrijf of vermeerderingsbedrijf
      uitoefent er zorg voor dat dit binnen één werkdag nadat de uitslag van de serotypering bij hem bekend is, aan de
      voorzitter en aan GD is gemeld.

      4 Na de melding als bedoeld in het derde lid kan de voorzitter door GD een verificatieonderzoek laten uitvoeren van
      het bemonsterde stalkoppel.

      5 In het geval de voorzitter het in het vierde lid bedoelde verificatieonderzoek laat uitvoeren, is het de
      ondernemer die een fokbedrijf, opfokbedrijf of vermeerderingsbedrijf uitoefent niet toegestaan de aanwezige
      kalkoenen en broedeieren van het bedrijf af te voeren totdat de voorzitter hiervoor toestemming geeft.
    url: https://wetten.overheid.nl/BWBR0030628/2014-03-23#Artikel4
  - number: '5'
    text: |-
      1 De ondernemer die een fokbedrijf, opfokbedrijf of vermeerderingsbedrijf uitoefent, handelt in overeenstemming met
      het in artikel 2 van Verordening (EG) nr. 1177/2006 neergelegde verbod op het gebruik van antimicrobiële stoffen.

      2 De voorzitter stelt op grond van de uitslag van de serotypering als bedoeld in [artikel 4, tweede lid][ref1],
      dan wel van het verificatieonderzoek als bedoeld in artikel 4, vierde lid, een besmetting met een bepaald serotype
      Salmonella vast bij een stalkoppel fokkalkoenen of vermeerderingskalkoenen, en meldt deze vaststelling schriftelijk
      aan de ondernemer die een fokbedrijf, opfokbedrijf of vermeerderingsbedrijf uitoefent.

      3 De ondernemer die een fokbedrijf, opfokbedrijf of vermeerderingsbedrijf uitoefent laat een met het serotype
      Salmonella Enteritidis of Salmonella Typhimurium besmet stalkoppel ruimen en de broedeieren van dit stalkoppel
      verwerken of vernietigen, nadat hij een daartoe strekkende last van de voorzitter heeft gekregen.

      4 De ondernemer die een fokbedrijf, opfokbedrijf of vermeerderingsbedrijf uitoefent is gehouden om de in het derde
      lid bedoelde last onverwijld op te volgen.

      5 In het geval de voorzitter een besmetting met Salmonella bij een stalkoppel heeft vastgesteld, reinigt en ontsmet
      de ondernemer die een fokbedrijf, opfokbedrijf of vermeerderingsbedrijf uitoefent onverwijld de stal na het laten
      ruimen van het stalkoppel dan wel na het afvoeren van het stalkoppel uit de stal.

      6 De ondernemer die een fokbedrijf, opfokbedrijf of vermeerderingsbedrijf uitoefent laat na het reinigen en
      ontsmetten als bedoeld in het vijfde lid onverwijld een stalonderzoek uitvoeren.

      7 Indien op grond van het stalonderzoek als bedoeld in het zesde lid, Salmonella in de stal is aangetoond, herhaalt
      de ondernemer die een fokbedrijf, opfokbedrijf of vermeerderingsbedrijf uitoefent de in het vijfde lid bedoelde
      reiniging en ontsmetting, totdat geen Salmonella meer in de stal wordt aangetoond.

      8 Na de herhaalde reiniging en ontsmetting als bedoeld in het zevende lid, laat de ondernemer die een fokbedrijf,
      opfokbedrijf of vermeerderingsbedrijf opnieuw een stalonderzoek uitvoeren, totdat geen Salmonella meer in de stal
      wordt aangetoond.

      9 Slechts indien op grond van het stalonderzoek als bedoeld in het zesde of achtste lid bedoelde onderzoek
      geen Salmonella meer in de stal wordt aangetoond, mag de ondernemer die een fokbedrijf, opfokbedrijf of
      vermeerderingsbedrijf uitoefent, een stalkoppel in de stal plaatsen.


