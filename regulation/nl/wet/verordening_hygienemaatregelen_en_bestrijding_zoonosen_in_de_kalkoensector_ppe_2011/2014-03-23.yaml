  - number: '17'
    text: |-
      1 De ondernemer die een kalkoenbedrijf uitoefent laat zich ten minste één maal per kalenderjaar op eigen kosten
      door een erkende controle-instantie controleren op de naleving van het bepaalde bij of krachtens deze verordening.

      2 De ondernemer die een kalkoenkuikenbroederij uitoefent laat zich iedere zes maanden op eigen kosten door een
      erkende controle-instantie controleren op de naleving van het bepaalde bij of krachtens deze verordening.

      3 De in het eerste en tweede lid bedoelde controle-instantie kan op aanvraag worden erkend door de voorzitter
      indien zij voldoet aan door het bestuur bij besluit vastgestelde erkenningsvoorwaarden welke strekken tot waarborg
      van de onafhankelijkheid en expertise van de controle-instantie.

      4 De voorzitter kan aan een erkenning nadere voorschriften en voorwaarden verbinden. De voorzitter kan de erkenning
      intrekken indien is vastgesteld dat niet langer aan de erkenningsvoorwaarden of de aan de erkenning verbonden
      nadere voorschriften en voorwaarden wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0030628/2014-03-23#Artikel17
  - number: '18'
    text: |-
      1 Met uitzondering van het bij of krachtens [artikel 5, eerste, vierde, vijfde en zevende lid][ref1],
      [artikel 8, derde lid][ref2] en [artikel 11, eerste en tweede lid][ref3], bepaalde, wordt het toezicht op de
      naleving van het bij of krachtens de verordening bepaalde namens het productschap uitgeoefend door toezichthouders
      die hiervoor door het bestuur bij besluit zijn aangewezen.

      2 De ondernemer is verplicht:

      a. aan de door het bestuur aangewezen toezichthouders al die gegevens te verstrekken of te doen verstrekken, die
      nodig zijn voor de vervulling van hun taak;

      b. aan de door het bestuur aangewezen toezichthouders inzage te geven of te doen geven van die boeken en
      bescheiden, die nodig zijn voor de vervulling van hun taak;

      c. aan de door het bestuur aangewezen toezichthouders te allen tijde toegang te geven of te doen geven tot de
      bedrijfsruimten en tot die plaatsen of vervoermiddelen, waar of waarin voorraden, tot het bedrijf van de ondernemer
      behorende, zijn opgeslagen of worden vervoerd;

      d. te gedogen dat de door het bestuur aangewezen toezichthouders monsters nemen uit de voorraden, waaronder
      begrepen verpakkingsmateriaal, van het bedrijf van de ondernemer, ongeacht de plaats waar of waarin zich die
      voorraden bevinden en alsdan de van hem gevorderde medewerking verlenen overeenkomstig de aanwijzingen en het
      toezicht van die toezichthouders;

      e. voor het overige alle medewerking te verlenen ter vervulling van de aan de toezichthouders opgedragen taak.

      3 De in het eerste lid bedoelde toezichthouders zijn bevoegd om berechtingsrapporten op te maken ten behoeve van
      tuchtrechtelijke afhandeling van overtredingen van het bij of krachtens deze verordening bepaalde, met uitzondering
      van het bij of krachtens [artikel 5, eerste, vierde, vijfde en zevende lid][ref4], [artikel 8, derde lid][ref5] en
      [artikel 11, eerste en tweede lid][ref6], bepaalde.


