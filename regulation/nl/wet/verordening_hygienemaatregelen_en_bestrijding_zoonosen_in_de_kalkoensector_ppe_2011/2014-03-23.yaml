  - number: '9'
    text: |-
      De ondernemer die een vleeskalkoenbedrijf uitoefent mag een stalkoppel vleeskalkoenen pas in de stal plaatsen nadat
      hij de stal heeft gereinigd en ontsmet. Hij is verplicht om één maal per kalenderjaar na het reinigen en ontsmetten
      van de stal waarin kalkoenen jonger dan 72 uur worden geplaatst, een hygiënogram in de stal te laten uitvoeren en
      de vervolgmaatregelen te nemen die op basis van de uitslag van het hygiënogram zijn voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0030628/2014-03-23#Artikel9
  - number: '10'
    text: |-
      1 De ondernemer die een vleeskalkoenbedrijf uitoefent draagt er zorg voor dat een onderzoek naar de aanwezigheid
      van Salmonella van alle op zijn bedrijf aanwezige stalkoppels vleeskalkoenen plaatsvindt door middel van het nemen
      van monsters, detectie en, in geval van Salmonella, serotypering.

      2 Indien het voor detectie van Salmonella erkende laboratorium de aanwezigheid van Salmonella in de in het eerste
      lid bedoelde monsters heeft gedetecteerd, laat de ondernemer die een vleeskalkoenbedrijf uitoefent deze monsters
      onverwijld na de detectie serotyperen door een voor serotypering erkend laboratorium.

      3

      4 Indien het voor serotypering erkende laboratorium het serotype Salmonella in de in het eerste lid bedoelde
      monsters heeft bepaald draagt de ondernemer die een vleeskalkoenbedrijf uitoefent er zorg voor dat deze uitslagen
      binnen een door het bestuur bij besluit te bepalen termijn aan de voorzitter zijn gemeld.
    url: https://wetten.overheid.nl/BWBR0030628/2014-03-23#Artikel10
  - number: '11'
    text: |-
      1 De ondernemer die een vleeskalkoenbedrijf uitoefent handelt in overeenstemming met het in artikel 2 van
      Verordening (EG) nr. 1177/2006 neergelegde verbod op het gebruik van antimicrobiële stoffen.

      2 Nadat de ondernemer die een vleeskalkoenbedrijf uitoefent door het erkende laboratorium op grond van de uitslag
      van de serotypering in kennis is gesteld van een besmetting met Salmonella, reinigt en ontsmet hij de betreffende
      stal onverwijld na het afvoeren van het stalkoppel vleeskalkoenen uit deze stal.

      3 Na het reinigen en ontsmetten als bedoeld in het tweede lid laat de ondernemer die een vleeskalkoenbedrijf
      uitoefent onverwijld een stalonderzoek uitvoeren.

      4 Nadat in het kader van het stalonderzoek als bedoeld in het derde lid monsters zijn genomen, mag de ondernemer
      die een vleeskalkoenbedrijf uitoefent een stalkoppel vleeskalkoenen in de stal plaatsen in afwachting van de
      uitslag van het stalonderzoek. Indien uit de uitslag van het stalonderzoek blijkt dat Salmonella in de stal is
      aangetoond, laat de ondernemer die een vleeskalkoenbedrijf uitoefent de stal, na het afvoeren van dit stalkoppel
      vleeskalkoenen, ontsmetten door een ontsmettingsbedrijf.

      5 Indien de ondernemer die een vleeskalkoenbedrijf uitoefent door het erkende laboratorium op grond van de uitslag
      van de serotypering in kennis is gesteld van een besmetting met Salmonella, neemt deze ondernemer de door het
      bestuur bij besluit vastgestelde maatregelen ten aanzien van het vangen en afvoeren van de vleeskalkoenen van het
      bedrijf alsmede ten aanzien van het graan dat hij aan het stalkoppel vleeskalkoenen voert.
    url: https://wetten.overheid.nl/BWBR0030628/2014-03-23#Artikel11
  - number: '12'
    text: |-
      1 De voorzitter laat bij de ondernemer die een fokbedrijf, vermeerderingsbedrijf of vleeskalkoenbedrijf uitoefent
      in door het bestuur bij besluit genoemde gevallen een onderzoek verrichten naar de aanwezigheid van Salmonella
      van op zijn bedrijf aanwezige stalkoppels, door middel van het nemen van monsters, detectie, serotypering en een
      verificatieonderzoek.

      2 De ondernemer die een fokbedrijf, vermeerderingsbedrijf of vleeskalkoenbedrijf uitoefent is verplicht om mee te
      werken aan het in het eerste lid bedoelde onderzoek.
    url: https://wetten.overheid.nl/BWBR0030628/2014-03-23#Artikel12
  - number: '13'
    text: |-
      1 De detectie van Salmonella als bedoeld in de [artikelen 4][ref1], [7][ref2], [10][ref3] en [12][ref4] wordt
      uitgevoerd door een voor detectie van Salmonella erkend laboratorium. De serotypering als bedoeld in de artikelen
      4, 7, 10 en 12 wordt uitgevoerd door een voor serotypering van Salmonella erkend laboratorium.

      2 De voorzitter is belast met de erkenning van laboratoria als bedoeld in deze verordening. Het bestuur stelt bij
      besluit nadere regels vast ten aanzien van de erkenningsvoorwaarden van laboratoria.

      3 De voorzitter is belast met de erkenning van HOSOWO-instanties, ontsmettingsbedrijven en
      ongediertebestrijdingsbedrijven als bedoeld in deze verordening. Het bestuur stelt bij besluit nadere
      regels vast ten aanzien van de erkenningsvoorwaarden van HOSOWO-instanties, ontsmettingsbedrijven en
      ongediertebestrijdingsbedrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0030628#Artikel4
