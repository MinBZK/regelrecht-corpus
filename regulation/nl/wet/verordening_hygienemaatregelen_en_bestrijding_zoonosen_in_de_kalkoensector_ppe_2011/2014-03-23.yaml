  - number: '6'
    text: |-
      1 De ondernemer die een kalkoenkuikenbroederij uitoefent mag pas broedeieren inleggen nadat hij de gebruikte
      lokalen en broedkasten heeft gereinigd en ontsmet.

      2 De ondernemer die een kalkoenkuikenbroederij uitoefent is verplicht om zes keer per kalenderjaar na het reinigen
      en ontsmetten een hygiëneonderzoek in de kuikenbroederij te laten uitvoeren door GD.

      3 De ondernemer die een kalkoenkuikenbroederij uitoefent mag een deel van het in het tweede lid bedoelde
      hygiëneonderzoek zelf uitvoeren.
    url: https://wetten.overheid.nl/BWBR0030628/2014-03-23#Artikel6
  - number: '7'
    text: |-
      1 De ondernemer die een kalkoenkuikenbroederij uitoefent draagt er zorg voor dat een onderzoek naar de aanwezigheid
      van Salmonella plaatsvindt door middel van het nemen van monsters, detectie en, in geval van Salmonella,
      serotypering.

      2 Indien het voor detectie van Salmonella erkende laboratorium de aanwezigheid van Salmonella in de in het eerste
      lid bedoelde monsters heeft gedetecteerd, laat de ondernemer die een kalkoenkuikenbroederij uitoefent deze monsters
      onverwijld na de detectie serotyperen door een voor serotypering erkend laboratorium.

      3 Indien het voor serotypering erkende laboratorium het serotype Salmonella Enteritidis of Salmonella Typhimurium
      dan wel enig ander door het bestuur bij besluit vast te stellen serotype Salmonella in de in het eerste lid
      bedoelde monsters heeft bepaald, draagt de ondernemer die een kalkoenkuikenbroederij uitoefent er zorg voor dat dit
      serotype Salmonella binnen één werkdag nadat de uitslag van de serotypering bij hem bekend is aan de voorzitter en
      aan GD is gemeld.

      4 Na de melding als bedoeld in het derde lid kan de voorzitter door GD een verificatieonderzoek laten uitvoeren bij
      het stalkoppel fokkalkoenen of vermeerderingskalkoenen dat de broedeieren heeft geproduceerd waarvan de monsters
      afkomstig zijn.
    url: https://wetten.overheid.nl/BWBR0030628/2014-03-23#Artikel7
  - number: '8'
    text: |-
      1 De voorzitter stelt op grond van de uitslag van de serotypering als bedoeld in [artikel 4, tweede lid][ref1],
      of [artikel 7, tweede lid][ref2], dan wel van het verificatieonderzoek als bedoeld in artikel 4, vierde lid, of
      artikel 7, vierde lid, een besmetting met een bepaald serotype Salmonella vast bij het stalkoppel fokkalkoenen
      of vermeerderingskalkoenen dat de broedeieren heeft geproduceerd waarvan de monsters als bedoeld in artikel 7
      afkomstig zijn, en meldt deze vaststelling schriftelijk aan de ondernemer die een kalkoenkuikenbroederij uitoefent.

      2 De ondernemer die een kalkoenkuikenbroederij uitoefent neemt de volgende maatregelen indien het in het eerste lid
      bedoelde stalkoppel fokkalkoenen of vermeerderingskalkoenen is besmet met het serotype Salmonella Enteritidis of
      Salmonella Typhimurium, nadat hij een daartoe strekkende last van de voorzitter heeft gekregen:

      a. alle broedeieren die door het besmette stalkoppel fokkalkoenen of vermeerderingskalkoenen zijn geproduceerd en
      die reeds in de kalkoenkuikenbroederij zijn ingelegd, te laten behandelen als categorie 2-materiaal in de zin van
      Verordening (EG) nr. 1069/2009;

      b. alle broedeieren die door het besmette stalkoppel fokkalkoenen of vermeerderingskalkoenen zijn geproduceerd
      en die in de kalkoenkuikenbroederij aanwezig zijn maar nog niet zijn ingelegd, een zodanige behandeling te laten
      ondergaan dat de uitschakeling van Salmonella gewaarborgd is;

      c. alle broedeieren die door het besmette stalkoppel fokkalkoenen of vermeerderingskalkoenen zijn geproduceerd en
      die in de kalkoenkuikenbroederij aanwezig zijn, te laten vernietigen;

      d. de in de kalkoenkuikenbroederij aanwezige kalkoenen die afkomstig zijn uit broedeieren die door het besmette
      stalkoppel fokkalkoenen of vermeerderingskalkoenen zijn geproduceerd, te ruimen.

      3 De ondernemer die een kalkoenkuikenbroederij uitoefent is gehouden de in het tweede lid bedoelde last onverwijld
      op te volgen.


