    text: |-
      1 De ondernemer draagt zorg voor het volgende of neemt het volgende in acht:

      a. de aanwezigheid van andere dieren dan kalkoenen binnen de bedrijfsgebouwen is verboden;

      b. indien een huisdier, landbouwhuisdier of ander pluimvee, sier- of nutsgevogelte wordt gehouden op het perceel
      waar het kalkoenbedrijf of de kalkoenkuikenbroederij wordt uitgeoefend, wordt dit dier zodanig gehouden en verzorgd
      dat het niet in het bedrijfsgebouw kan komen en het strikt gescheiden blijft van de kalkoenen en de broedeieren;

      c. het bedrijfsgebouw is zodanig ingericht dat vogels het bedrijfsgebouw niet kunnen binnenkomen;

      d. nadat de kalkoenen uit de stal zijn afgevoerd verwijdert de ondernemer onverwijld de in de stal aanwezige mest
      en het strooisel en reinigt en ontsmet hij vervolgens onverwijld de stal.

      e. na afvoer van kalkoenen reinigt en ontsmet de ondernemer die een kalkoenkuikenbroederij uitoefent onverwijld de
      gebruikte lokalen en broedkasten.

      f. de ondernemer zorgt voor een adequate bestrijding van ongedierte.

      g. de ondernemer zorgt er voor dat een ongediertebestrijdingsplan op het bedrijf aanwezig is en dat dit wordt
      uitgevoerd. In het geval een ongediertebestrijdingsbedrijf is ingeschakeld moet dit ten minste één maal per twee
      maanden op het bedrijf ongedierte komen bestrijden;

      h. de resultaten van acties met betrekking tot wering, signalering en bestrijding van ongedierte worden vastgelegd;

      i. het ongediertebestrijdingsplan bevat maatregelen die moeten worden genomen als de resultaten, bedoeld in h.,
      hiertoe aanleiding geven;

      j. de ondernemer laat de kwaliteit van het drinkwater bestemd voor het pluimvee onderzoeken overeenkomstig een door
      het bestuur vast te stellen besluit;

      k. de inrichting van een stal is zodanig dat deze eenvoudig kan worden gereinigd;

      l. het perceel waarop het bedrijfsgebouw staat, is zodanig ingericht dat de perceelgrenzen herkenbaar zijn en dat
      voor bezoekers duidelijk is waar zij zich moeten melden;

      m. het bedrijfsgebouw, de inventaris en de directe omgeving van het bedrijfsgebouw zijn schoon, zodanig dat geen
      ongedierte wordt aangetrokken;

      n. het bedrijfsgebouw is zodanig ingericht dat ongehinderde toegang door derden niet mogelijk is;

      o. in het bedrijfsgebouw is een voorruimte aanwezig die volledig is afgescheiden van de stal waarin de kalkoenen
      worden gehouden;

      p. tussen de voorruimte en de stal is een fysieke scheiding aangebracht in een bufferdeel en een deel waarin de
      kalkoenen worden gehouden;

      q. in het schone deel van het bedrijfsgebouw is voldoende visueel schoon schoeisel aanwezig;

      r. indien op een kalkoenbedrijf meerdere leeftijdsgroepen kalkoenen aanwezig zijn, is per leeftijdsgroep in de
      fysieke scheiding in het bedrijfsgebouw visueel schone bedrijfskleding aanwezig en wordt er op toegezien dat
      personen het schone deel van het bedrijfsgebouw slechts betreden indien zij visueel schone bedrijfskleding hebben
      aangetrokken die hoort bij de betreffende leeftijdsgroep;

      s. de loop- of rijroutes van en naar het bedrijfsgebouw zijn zodanig verhard dat deze deugdelijk gereinigd kunnen
      worden;

      t. op het perceel is een functionerende afwatering ten opzichte van het bedrijfsgebouw aanwezig;

      u. de voedersilo is aan de buitenkant visueel schoon, is geplaatst op een verharde ondergrond en wordt van buiten
      de stal gevuld; indien meerdere voedersilo's op het bedrijf aanwezig zijn, is iedere voedersilo voorzien van een
      bedrijfsuniek nummer;

      v. bij het lossen van het voeder wordt gebruik gemaakt van een bedrijfseigen of eenmalig te gebruiken
      stofopvangmiddel;

      w. voeder, bodem- en neststrooisel en verpakkingsmateriaal worden zodanig opgeslagen dat deze schoon, droog en
      schimmelvrij blijven;

      x. voeder dat na het afvoeren van de kalkoenen uit de stal nog aanwezig is in het voedersysteem van de stal, wordt
      afgevoerd, voor het plaatsen van een nieuw stalkoppel kalkoenen.

      2 Het bestuur kan bij besluit nadere regels vaststellen over het in het eerste lid bepaalde.
