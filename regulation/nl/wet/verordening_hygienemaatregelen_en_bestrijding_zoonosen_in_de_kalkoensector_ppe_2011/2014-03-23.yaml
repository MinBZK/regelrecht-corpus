  - number: '15'
    text: |-
      1 De ondernemer houdt een deugdelijke administratie bij inzake de monsters die hij heeft genomen, inzake de
      uitslagen van het hygiënogram, het hygiëneonderzoek, het drinkwateronderzoek, de detectie, de serotypering en
      het verificatieonderzoek, en inzake facturen, als gevolg van verplichtingen vastgelegd bij of krachtens deze
      verordening.

      2 De in het eerste lid bedoelde administratie is zodanig ingericht dat deze te allen tijde aan een door het bestuur
      aangewezen toezichthouder het benodigde inzicht kan verschaffen over de naleving van de bij of krachtens deze
      verordening vastgelegde voorschriften en verplichtingen.

      3 De ondernemer bewaart de uitslagen van het hygiënogram, het hygiëneonderzoek, het drinkwateronderzoek, de
      detectie, de serotypering en het verificatieonderzoek gedurende ten minste twee jaren na ontvangst.

      4 Het bestuur stelt bij besluit nadere regels vast ten aanzien van het bepaalde in het eerste, tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0030628/2014-03-23#Artikel15
  - number: '16'
    text: |-
      1 De ondernemer verstrekt tijdig de monsters als bedoeld in de [artikelen 4][ref1], [7][ref2] en [10][ref3] aan
      het voor detectie van Salmonella erkende laboratorium aan het voor serotypering erkende laboratorium.

      2 De ondernemer meldt tijdig de uitslagen van de detectie en de serotypering als bedoeld in de [artikelen 4][ref4],
      [7][ref5] en [10][ref6] en van het verificatieonderzoek als bedoeld in de artikelen 4 en 7 schriftelijk aan de
      ondernemer die de betrokken kalkoenen of broedeieren aan hem heeft geleverd en aan de ondernemer die de betrokken
      kalkoenen of broedeieren van hem heeft ontvangen. Indien de leverancier of de afnemer niet de juiste uitslagen
      heeft ontvangen, kan de voorzitter de leverancier of afnemer hierop wijzen.

      3 De ondernemer meldt tijdig de uitslagen van de detectie en de serotypering als bedoeld in de [artikelen 4][ref7],
      [7][ref8] en [10][ref9] aan de voorzitter en de uitslagen van de detectie en de serotypering als bedoeld in de
      artikelen 4 en 7 tevens aan GD.

      4 Het bestuur stelt bij besluit nadere regels vast ten aanzien van de wijze waarop, het tijdstip waarop en de
      frequentie waarmee de ondernemer de in het eerste lid bedoelde monsters verstrekt en de in het tweede en derde lid
      bedoelde uitslagen meldt alsmede ten aanzien van de hoedanigheid van de leverancier en de afnemer als bedoeld in
      het tweede lid.


