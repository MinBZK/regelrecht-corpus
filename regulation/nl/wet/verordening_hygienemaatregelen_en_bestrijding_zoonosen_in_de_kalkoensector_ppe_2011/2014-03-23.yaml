preamble:
  text: |-
    Gelet op de artikelen 3 en 3a van het Besluit bescherming tegen bepaalde zoönosen en bestrijding besmettelijke
    dierziekten en de artikelen 95 en 96 van de Regeling preventie, bestrijding en monitoring van besmettelijke
    dierziekten en zoönosen en TSE's;

    Gelet op de artikelen 93, eerste lid, 95, 102 en 104 van de Wet op de bedrijfsorganisatie, en de artikelen 6 en 7
    van het Instellingsbesluit Productschap Pluimvee en Eieren;

    Gezien Richtlijn 2003/99/EG van het Europees Parlement en de Raad van 17 november 2003 inzake de bewaking van
    zoönoses en zoönoseverwekkers en houdende wijziging van Beschikking 90/424/EEG van de Raad en intrekking van
    Richtlijn 92/117/EEG van de Raad (PbEU L 325), Verordening (EG) nr. 2160/2003 van het Europees Parlement en de
    Raad van 17 november 2003 inzake de bestrijding van Salmonella en andere specifieke door voedsel overgedragen
    zoönoseverwekkers (PbEU L 325) en;

    Gezien de Wet tuchtrechtspraak bedrijfsorganisatie 2004;

