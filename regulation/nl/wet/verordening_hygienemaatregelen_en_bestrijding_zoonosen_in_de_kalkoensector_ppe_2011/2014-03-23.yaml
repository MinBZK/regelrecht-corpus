  - number: '20'
    text: |-
      1 De voorzitter kan, binnen het kader van door het bestuur bij besluit vastgestelde richtlijnen en voor zover
      het belang van de bewaking en bestrijding van Salmonella zich daartegen niet verzet, op schriftelijk verzoek
      van de ondernemer ontheffing aan de ondernemer verlenen van het bepaalde in [artikel 2, eerste lid][ref1],
      [artikel 3][ref2], [artikel 6][ref3], [artikel 9][ref4], [artikel 11, vijfde lid][ref5], en
      [artikel 17, eerste en tweede lid][ref6], en aan zodanige ontheffing voorschriften en beperkingen verbinden.

      2 Het bestuur kan bij besluit vrijstelling aan ondernemers dan wel aan een groep van te onderscheiden categorieën
      ondernemers verlenen van het bepaalde in [artikel 2, eerste lid][ref7], [artikel 3][ref8], [artikel 6][ref9],
      [artikel 9][ref10], [artikel 11, vijfde lid][ref11], en [artikel 17, eerste en tweede lid][ref12], en aan een
      zodanige vrijstelling voorschriften en beperkingen verbinden.

      3 Een verleende ontheffing kan te allen tijde door de voorzitter worden ingetrokken en een verleende vrijstelling
      kan te allen tijde door het bestuur worden ingetrokken.


