articles:
  - number: '1'
    text: |-
      In deze Verordening en de daarop berustende besluiten wordt verstaan onder:










                  1


                  kalkoenen


                  :


                  pluimvee van de soort *meleagris gallopavo*, dat wordt opgefokt of gehouden voor de productie van
      broedeieren of vlees;




                  2


                  vermeerderingskalkoenen


                  :


                  kalkoenen van 72 uur en ouder bestemd voor de productie van broedeieren die zijn bestemd voor de
      productie van vleeskalkoenen;




                  3


                  fokkalkoenen


                  :


                  kalkoenen van 72 uur en ouder bestemd voor de productie van broedeieren die zijn bestemd voor de
      productie van fokkalkoenen of vermeerderingskalkoenen;




                  4


                  vleeskalkoenen


                  :


                  kalkoenen van 72 uur en ouder die worden gehouden voor de productie van vlees;




                  5


                  broedeieren


                  :


                  eieren afkomstig van kalkoenen, bestemd om te worden bebroed;




                  6


                  stalkoppel


                  :


                  alle kalkoenen met dezelfde gezondheidsstatus die in dezelfde stal of binnen dezelfde uitloopruimte
      worden geplaatst of gehouden en die een epidemiologische eenheid vormen;















                  7


                  kalkoenbedrijf


                  :


                  inrichting die wordt gebruikt voor het opfokken, fokken of houden van fokkalkoenen of vleeskalkoenen;




                  8


                  fokbedrijf


                  :


                  kalkoenbedrijf dat zich toelegt op de productie van broedeieren, bestemd voor de productie van
      fokkalkoenen of vermeerderingskalkoenen;




                  9


                  vermeerderingsbedrijf


                  :


                  kalkoenbedrijf dat zich toelegt op de productie van broedeieren, bestemd voor de productie van
      vleeskalkoenen;




                  10


                  opfokbedrijf


                  :


                  kalkoenbedrijf dat zich toelegt op het opfokken van fokkalkoenen of vermeerderingskalkoenen tot het
      voortplantingsstadium;




                  11


                  vleeskalkoenbedrijf


                  :


                  kalkoenbedrijf dat zich toelegt op het houden van vleeskalkoenen;




                  12


                  kalkoenkuikenbroederij


                  :


                  inrichting die wordt gebruikt voor het inleggen en uitbroeden van broedeieren onderscheidenlijk
      inrichting waarin één of meerdere vorengenoemde handelingen worden verricht;















                  13


                  ondernemer


                  :


                  een natuurlijk persoon of rechtspersoon die een kalkoenbedrijf of een kalkoenkuikenbroederij uitoefent;




                  14


                  bedrijfsgebouw


                  :


                  het gebouw waarin kalkoenen worden gehouden of broedeieren zijn ingelegd en de tot het gebouw behorende
      voorruimte, stallen en lokalen en, in voorkomend geval, de vrije uitloopruimte;




                  15


                  stal


                  :


                  een afgesloten ruimte met eigen ventilatievoorziening bedoeld om kalkoenen te houden; Voor
      kalkoenbedrijven met vrije uitloop zijn openingen noodzakelijk voor de vrije uitloop toegestaan;




                  16


                  hygiëneonderzoek


                  :


                  een onderzoek uitgevoerd door GD of de ondernemer die een kalkoenkuikenbroederij uitoefent naar de
      hygiënestatus van een kalkoenkuikenbroederij nadat deze is gereinigd en ontsmet;




                  17


                  ruimen


                  :


                  het op last van de voorzitter verwijderen van kalkoenen van het kalkoenbedrijf of de
      kalkoenkuikenbroederij en het vervolgens laten doden en vernietigen dan wel verwerken van kalkoenen(vlees);




                  18


                  verwerken


                  :


                  het zodanig behandelen van broedeieren van een met Salmonella besmet stalkoppel dat de uitschakeling
      van Salmonella is gewaarborgd overeenkomstig de communautaire wetgeving inzake levensmiddelenhygiëne.






