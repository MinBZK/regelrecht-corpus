articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

        - *hulp:* jeugdhulp, de advisering en verwerking van meldingen inzake huiselijk geweld en kindermishandeling of de
      uitvoering van kinderbeschermings-maatregelen of jeugdreclassering;
        - *jeugdhulp:* jeugdhulp als bedoeld in [artikel 1.1 van de Jeugdwet][ref1];
        - *kinderbeschermingsmaatregelen:* kinderbeschermingsmaatregelen als bedoeld in
      [artikel 1.1 van de Jeugdwet][ref2];
        - *jeugdreclassering:* jeugdreclassering als bedoeld in [artikel 1.1 van de Jeugdwet][ref3];
        - *Ministers:* Minister van Volksgezondheid, Welzijn en Sport en Minister van Veiligheid en Justitie;
        - *organisatie:* aanbieder van jeugdhulp, organisatie voor advisering en verwerking van meldingen inzake huiselijk
      geweld of kindermishandeling of uitvoerder van kinderbeschermingsmaatregelen of jeugdreclassering.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1.1
