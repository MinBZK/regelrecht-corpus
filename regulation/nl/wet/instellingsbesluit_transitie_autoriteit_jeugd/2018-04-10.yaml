  - number: '2'
    text: Er is een Transitie Autoriteit Jeugd.
    url: https://wetten.overheid.nl/BWBR0035002/2018-04-10#Artikel2
  - number: '3'
    text: |-
      1 De Transitie Autoriteit Jeugd heeft tot taak ervoor te zorgen dat organisaties en gemeenten voldoende gelegenheid
      krijgen om tot inkoopafspraken te komen die de continuïteit van de hulp verzekeren en voorkomen dat functies van
      hulp die niet gemist kunnen worden, verdwijnen bij de overdracht van deze functies naar het gemeentelijk niveau.
      Naar aanleiding van verzoeken van organisaties:

        - onderzoekt zij of en welke nadere ondersteuning noodzakelijk is;
        - bemiddelt zij tussen organisaties en gemeenten;
        - adviseert zij gemeenten bij de inkoop van die functies van hulp waarvan de continuïteit mogelijk onder druk komt
      te staan;
        - adviseert zij organisaties bij het doorvoeren van een noodzakelijke sanering;
        - adviseert zij de Ministers en de Minister van Binnenlandse Zaken en Koninkrijksrelaties over het nemen van
      bestuurlijke maatregelen jegens gemeenten;
        - adviseert zij de Ministers over het bieden van ondersteuning bij frictiekosten of acute liquiditeitsproblemen van
      instellingen in bijzondere gevallen en de daaraan te verbinden voorwaarden.

      2 De Transitie Autoriteit Jeugd neemt bij de vervulling van haar taak, bedoeld in het eerste lid, de instructies
      van de Ministers in acht.
    url: https://wetten.overheid.nl/BWBR0035002/2018-04-10#Artikel3
  - number: '4'
    text: |-
      1 De Transitie Autoriteit Jeugd bestaat uit een voorzitter en tenminste twee

      andere leden.

      2 De voorzitter en de andere leden worden door de Ministers benoemd.

      3 De voorzitter en de andere leden worden voor één jaar benoemd. De benoeming kan jaarlijks worden verlengd.

      4 De voorzitter en andere leden kunnen worden geschorst en ontslagen door de Ministers.
    url: https://wetten.overheid.nl/BWBR0035002/2018-04-10#Artikel4
  - number: '5'
    text: De Transitie Autoriteit Jeugd wordt ingesteld met ingang van 1 april 2014 en wordt opgeheven per 1 januari 2019.
    url: https://wetten.overheid.nl/BWBR0035002/2018-04-10#Artikel5
  - number: '6'
    text: |-
      Met ingang van 1 april 2014 wordt tot voorzitter van de Transitie Autoriteit Jeugd benoemd drs. M. Sint, te
      Amsterdam.
    url: https://wetten.overheid.nl/BWBR0035002/2018-04-10#Artikel6
  - number: '7'
    text: |-
      1 De Transitie Autoriteit Jeugd wordt ondersteund door een secretariaat.

      2 Het secretariaat is voor de inhoudelijke uitvoering van zijn taak uitsluitend verantwoording schuldig aan de
      voorzitter van de Transitie Autoriteit Jeugd.

      3 In het secretariaat wordt voorzien door de Minister van Volksgezondheid, Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0035002/2018-04-10#Artikel7
  - number: '8'
    text: |-
      1 De Transitie Autoriteit Jeugd stelt haar eigen werkwijze vast.

      2 De Transitie Autoriteit Jeugd neemt met het oog op de vervulling van haar taak, bedoeld in
      [artikel 3, eerste lid][ref1], in haar werkwijze criteria op op basis waarvan zij afweegt welke organisaties en
      specifieke hulpvormen in het bijzonder in aanmerking komen voor advies en ondersteuning van de Transitie Autoriteit
      Jeugd. Dit omvat tevens criteria op basis waarvan zij prioriteiten stelt.

      3 De Transitie Autoriteit Jeugd maakt de vastgestelde werkwijze als bedoeld in het eerste lid en de vastgestelde
      criteria als bedoeld in het tweede lid openbaar.

      4 De Transitie Autoriteit Jeugd kan zich door andere personen doen bijstaan voor zover dat voor de vervulling van
      haar taak nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0035002#Artikel3
    url: https://wetten.overheid.nl/BWBR0035002/2018-04-10#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0035002
        artikel: '3'
  - number: '9'
    text: |-
      1 De Transitie Autoriteit Jeugd verstrekt aan de Ministers desgevraagd de door hen gewenste inlichtingen. De
      Ministers kunnen inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de vervulling van hun
      taak redelijkerwijs nodig is.

      2 De voorzitter van de Transitie Autoriteit Jeugd informeert de Ministers regelmatig over de voortgang van de
      werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0035002/2018-04-10#Artikel9
  - number: '10'
    text: De Transitie Autoriteit Jeugd brengt bij de afsluiting van haar werkzaamheden een verslag uit aan de Ministers.
    url: https://wetten.overheid.nl/BWBR0035002/2018-04-10#Artikel10
  - number: '11'
    text: |-
      1 De kosten van de Transitie Autoriteit Jeugd komen voor rekening van de Minister van Volksgezondheid, Welzijn en
      Sport. Onder kosten worden in ieder geval verstaan:

      a. de kosten voor de faciliteiten van vergaderingen en voor secretariële ondersteuning;

      b. de kosten voor het inschakelen van externe deskundigheid en het laten verrichten van onderzoek, en

      c. de kosten voor publicatie van rapportages.

      2 De Transitie Autoriteit Jeugd biedt zo spoedig mogelijk na haar instelling ter goedkeuring een begroting en een
      plan van aanpak aan de Ministers aan.
    url: https://wetten.overheid.nl/BWBR0035002/2018-04-10#Artikel11
  - number: '12'
    text: |-
      De archiefbescheiden van de Transitie Autoriteit Jeugd worden zo spoedig mogelijk na beëindiging van haar
      werkzaamheden of, zo de omstandigheden daartoe aanleiding geven, zoveel eerder als dat het geval is, overgedragen
      aan het archief van het Ministerie van Volksgezondheid, Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0035002/2018-04-10#Artikel12
  - number: '13'
    text: |-
      1 Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin het
      wordt geplaatst. Indien dit besluit wordt gepubliceerd na 31 maart 2014, werkt het terug tot en met 1 april 2014.

      2 Dit besluit vervalt met ingang van 1 januari 2019.
    url: https://wetten.overheid.nl/BWBR0035002/2018-04-10#Artikel13
