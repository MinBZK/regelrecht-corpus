$id: wet_subsidiering_politieke_partijen
regulatory_layer: WET
publication_date: '2013-03-15'
valid_from: '2013-01-01'
bwb_id: BWBR0010465
url: https://wetten.overheid.nl/BWBR0010465/2013-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is wettelijke regels te stellen inzake de subsidiëring van
    politieke partijen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;'
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel1
  - number: 1.b
    text: |-
      politieke partij: een vereniging waarvan de aanduiding op grond van[ artikel G 1 van de Kieswet][ref1] is
      geregistreerd in het register van aanduidingen voor de verkiezing van leden van de Tweede Kamer;


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: 1.c
    text: |-
      leden van een politieke partij: leden met vergader- en stemrechten in de vereniging, die jaarlijks elk € 12,– of
      meer aan contributie betalen;
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel1
  - number: 1.d
    text: |-
      politiek-wetenschappelijk instituut: een politiek-wetenschappelijk instituut als bedoeld in [artikel 3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010465#Artikel3
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010465
        artikel: '3'
        paragraaf: '1'
  - number: 1.e
    text: |-
      politieke jongerenorganisatie: een politieke jongerenorganisatie als bedoeld in [artikel 3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010465#Artikel3
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010465
        artikel: '3'
        paragraaf: '1'
  - number: 1.f
    text: |-
      leden van een politieke jongerenorganisatie: leden die niet jonger dan 14 jaar en niet ouder dan 27 jaar zijn en
      die jaarlijks € 5,– of meer aan contributie betalen;
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel1
  - number: 1.g
    text: |-
      kamerzetel: een zetel in de Tweede Kamer der Staten-Generaal, dan wel in de Eerste Kamer der Staten-Generaal,
      indien aan de lijst van een politieke partij op grond van de [Kieswet][ref1] geen zetels in de Tweede Kamer der
      Staten-Generaal zijn toegewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: 1.h
    text: 'peildatum: de eerste dag van het kalenderjaar;'
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel1
  - number: 1.i
    text: |-
      instelling voor buitenlandse activiteiten: een instelling als bedoeld in [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010465#Artikel3
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010465
        artikel: '3'
        paragraaf: '1'
  - number: '2.1'
    text: |-
      Onze Minister verstrekt subsidie aan een politieke partij die aan de laatst gehouden verkiezingen voor de Tweede
      Kamer of Eerste Kamer der Staten-Generaal heeft deelgenomen met haar aanduiding boven de kandidatenlijst en aan de
      lijst waarvan daarbij een of meer zetels zijn toegekend.
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel2
  - number: '2.2'
    text: De subsidie wordt per kalenderjaar verstrekt.
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel2
  - number: '2.3'
    text: |-
      Geen subsidie wordt verstrekt aan een politieke partij die op de peildatum niet beschikt over ten minste 1.000
      leden.
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel2
  - number: '3.1'
    text: |-
      Een politieke partij kan voor de toepassing van deze wet één politieke jongerenorganisatie aanduiden en met deze
      jongerenorganisatie een schriftelijke overeenkomst tot subsidieverlening sluiten. Een politieke jongerenorganisatie
      kan slechts door één politieke partij worden aangeduid.
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel3
  - number: '3.2'
    text: 'Om als politieke jongerenorganisatie aangeduid te kunnen worden, is vereist dat:'
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel3
  - number: 3.2.a
    text: |-
      de organisatie een vereniging is die uitsluitend of in hoofdzaak activiteiten verricht ter bevordering van de
      politieke participatie van jongeren, en
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel3
  - number: 3.2.b
    text: |-
      van het ledental ten minste tweederde deel, bestaande uit in ieder geval honderd leden, niet jonger dan 14 jaar en
      niet ouder dan 27 jaar is.
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel3
  - number: '3.3'
    text: |-
      Een politieke partij kan voor de toepassing van deze wet één politiek-wetenschappelijk instituut aanduiden en met
      dit instituut een schriftelijke overeenkomst tot subsidieverlening sluiten. Een politiek-wetenschappelijk instituut
      kan slechts door één politieke partij worden aangeduid.
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel3
  - number: '3.4'
    text: |-
      Om als politiek-wetenschappelijk instituut aangeduid te kunnen worden, is vereist dat het instituut een
      rechtspersoon is die uitsluitend of in hoofdzaak politiek-wetenschappelijke activiteiten verricht.
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel3
  - number: '3.5'
    text: |-
      Een politieke partij kan voor de toepassing van deze wet één instelling voor buitenlandse activiteiten aanduiden en
      met deze instelling een schriftelijke overeenkomst tot subsidieverlening sluiten. Een instelling voor buitenlandse
      activiteiten kan slechts door één politieke partij worden aangeduid.
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel3
  - number: '3.6'
    text: |-
      Om als instelling voor buitenlandse activiteiten aangeduid te kunnen worden is vereist dat de instelling een
      rechtspersoon is die uitsluitend of in hoofdzaak activiteiten verricht ter ondersteuning van zusterpartijen en –
      organisaties buiten Nederland bij vormings- en scholingsactiviteiten.
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel3
  - number: '3.7'
    text: |-
      Aan de schriftelijke overeenkomsten tot subsidieverlening of aan het sluiten van deze overeenkomsten, kunnen door
      de politieke partij geen andere voorwaarden worden verbonden, dan die welke voortvloeien uit de toepassing van
      deze wet.
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel3
  - number: '4.1'
    text: |-
      Het lidmaatschap van een politieke partij en van een politieke jongerenorganisatie dient te blijken uit een
      uitdrukkelijke wilsverklaring van betrokkene.
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel4
  - number: '4.2'
    text: |-
      Indien van een politieke partij een andere politieke groepering lid is en die politieke groepering op grond
      van de [Kieswet][ref1] haar aanduiding heeft laten registreren, kunnen de leden van deze politieke groepering
      worden aangemerkt als leden van de politieke partij als bedoeld in [artikel 2, derde lid][ref2], tenzij de
      politieke groepering op grond van deze wet voor subsidie in aanmerking komt. Op het lidmaatschap van de leden
      van de politieke groepering is het eerste lid van overeenkomstige toepassing en deze leden dienen ermee te hebben
      ingestemd dat zij tevens als lid van de politieke partij worden aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
      [ref2]: https://wetten.overheid.nl/BWBR0010465#Artikel2
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004627
      - id: ref2
        bwb_id: BWBR0010465
        artikel: '2'
        paragraaf: '1'
  - number: '5'
    text: 'De subsidie wordt slechts verstrekt voor uitgaven die direct samenhangen met de volgende activiteiten:'
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel5
  - number: 5.a
    text: politieke vormings- en scholingsactiviteiten;
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel5
  - number: 5.b
    text: informatievoorziening;
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel5
  - number: 5.c
    text: het onderhouden van contacten met zusterpartijen buiten Nederland;
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel5
  - number: 5.d
    text: |-
      het ondersteunen van vormings- en scholingsactiviteiten ten behoeve van het kader van zusterpartijen buiten
      Nederland;
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel5
  - number: 5.e
    text: politiek-wetenschappelijke activiteiten;
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel5
  - number: 5.f
    text: activiteiten ter bevordering van de politieke participatie van jongeren;
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel5
  - number: 5.g
    text: het werven van leden;
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel5
  - number: 5.h
    text: het betrekken van niet-leden bij subsidiabele activiteiten van de politieke partij;
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel5
  - number: 5.i
    text: werving, selectie en begeleiding van politieke ambtsdragers;
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel5
  - number: 5.j
    text: activiteiten in het kader van verkiezingscampagnes.
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel5
  - number: '6.1'
    text: 'De subsidie bedraagt ten hoogste de som van de volgende bedragen:'
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel6
  - number: 6.1.a
    text: |-
      een basisbedrag van € 169.539 en per kamerzetel van de politieke partij, een bedrag van € 49.175 en per lid van de
      politieke partij een bedrag dat gelijk is aan € 1.856.360 gedeeld door het aantal leden van alle politieke partijen
      gezamenlijk; en
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel6
  - number: 6.1.b
    text: |-
      indien de politieke partij op de peildatum een politiek-wetenschappelijk instituut heeft aangeduid, een basisbedrag
      van € 119.076 en per kamerzetel van de politieke partij een bedrag van € 12.238; en
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel6
  - number: 6.1.c
    text: |-
      indien de politieke partij op de peildatum een jongerenorganisatie heeft aangeduid, een bedrag per kamerzetel van
      de politieke partij en een bedrag per lid van de politieke jongerenorganisatie berekend overeenkomstig het tweede
      lid;
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel6
  - number: 6.1.d
    text: |-
      indien de politieke partij op de peildatum een instelling voor buitenlandse activiteiten heeft aangeduid, een
      basisbedrag en een bedrag per kamerzetel van de politieke partij, berekend overeenkomstig het derde lid.
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel6
  - number: '6.2'
    text: |-
      Het bedrag per kamerzetel, bedoeld in het eerste lid, onder c, wordt berekend door, uitgaande van de situatie
      op 1 januari, € 477.322 te delen door het aantal kamerzetels van alle politieke partijen die een politieke
      jongerenorganisatie hebben aangeduid. Het bedrag per lid van de politieke jongerenorganisatie wordt berekend door €
      477.322 te delen door het aantal leden van alle aangeduide politieke jongerenorganisaties op 1 januari.
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel6
  - number: '6.3'
    text: |-
      Het basisbedrag, bedoeld in het eerste lid, onder d, wordt berekend door, uitgaande van de situatie op 1 januari,
      € 615 000 te delen door het totale aantal politieke partijen dat een instelling voor buitenlandse activiteiten
      heeft aangeduid. Het bedrag per kamerzetel, bedoeld in het eerste lid, onder d, wordt berekend door, uitgaande
      van de situatie op 1 januari, € 885 000 te delen door het aantal kamerzetels van alle politieke partijen die een
      instelling voor buitenlandse activiteiten hebben aangeduid.
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel6
  - number: '6.4'
    text: |-
      Voor de toepassing van het eerste lid wordt voor de vaststelling van het aantal kamerzetels van een politieke
      partij, het aantal leden van een politieke partij en het aantal leden van een politieke jongerenorganisatie
      uitgegaan van de peildatum.
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel6
  - number: '6.5'
    text: |-
      Indien politieke partijen bij de in [artikel 2, eerste lid][ref1], bedoelde verkiezingen een samenvoeging van hun
      geregistreerde aanduidingen of afkortingen daarvan boven de kandidatenlijst hebben geplaatst, gelden in afwijking
      van het eerste lid, de in dat lid genoemde basisbedragen voor deze partijen gezamenlijk en worden deze bedragen
      verdeeld naar evenredigheid van hun kamerzetels. Voor de vaststelling van het aantal kamerzetels van de betrokken
      politieke partijen, wordt uitgegaan van een daartoe strekkende verklaring van de voorzitter van de Tweede Kamer
      respectievelijk de Eerste Kamer.


      [ref1]: https://wetten.overheid.nl/BWBR0010465#Artikel2
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0010465
        artikel: '2'
        paragraaf: '1'
  - number: '6.6'
    text: |-
      De verdeling op grond van het vijfde lid van het basisbedrag, bedoeld in het eerste lid, onder b, geldt slechts
      voor zover de politieke partijen een politiek-wetenschappelijk instituut hebben aangewezen. De verdeling op grond
      van het vijfde lid van het basisbedrag, bedoeld in het eerste lid, onder d, geldt slechts voor zover de politieke
      partijen een instelling voor buitenlandse activiteiten hebben aangewezen.
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel6
  - number: '6.7'
    text: |-
      De bedragen, genoemd in het eerste, tweede en derde lid, worden jaarlijks bij ministeriële regeling gewijzigd
      overeenkomstig de voor de rijksbegroting gehanteerde loon- en prijsbijstelling.
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel6
  - number: 6a
    text: |-
      Ten behoeve van de kalenderjaren 2010 tot en met 2015 worden de bedragen, genoemd in
      [artikel 6, eerste lid, onderdelen a, b en c, en tweede lid][ref1], na toepassing van artikel 6, zesde lid, nader
      gewijzigd door het resultaat van de berekening:


      [ref1]: https://wetten.overheid.nl/BWBR0010465#Artikel6
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0010465
        artikel: '6'
        paragraaf: '2'
  - number: 6a.a
    text: per 1 januari 2010 te verlagen met 5,11%;
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel6a
  - number: 6a.b
    text: per 1 januari 2011 te verlagen met 1,39%;
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel6a
  - number: 6a.c
    text: per 1 januari 2012 te verlagen met 1,5%;
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel6a
  - number: 6a.d
    text: per 1 januari 2013 te verlagen met 1,5%;
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel6a
  - number: 6a.e
    text: per 1 januari 2014 te verlagen met 1,5%, en
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel6a
  - number: 6a.f
    text: per 1 januari 2015 te verlagen met 1,5%.
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel6a
  - number: '7.1'
    text: |-
      Het bedrag, bedoeld in [artikel 6, eerste lid, onder b][ref1], wordt slechts verstrekt voorzover de uitgaven
      van het aangeduide politiek-wetenschappelijk instituut voor subsidie in aanmerking komen. Aan de subsidie is de
      verplichting verbonden dat in de overeenkomst, bedoeld in [artikel 3, derde lid][ref2], is vastgelegd dat ten
      minste het ten behoeve van het politiek-wetenschappelijk instituut verstrekte bedrag, door de politieke partij aan
      het politiek-wetenschappelijke instituut wordt betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0010465#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0010465#Artikel3
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0010465
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0010465
        artikel: '3'
        paragraaf: '1'
  - number: '7.2'
    text: |-
      Het bedrag, bedoeld in [artikel 6, eerste lid, onder c][ref1], wordt slechts verstrekt voorzover de uitgaven van
      de aangeduide politieke jongerenorganisatie voor subsidie in aanmerking komen. Aan de subsidie is de verplichting
      verbonden dat in de overeenkomst, bedoeld in [artikel 3, eerste lid][ref2], is vastgelegd dat ten minste het
      ten behoeve van de politieke jongerenorganisatie verstrekte bedrag, door de politieke partij aan de politieke
      jongerenorganisatie wordt betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0010465#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0010465#Artikel3
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0010465
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0010465
        artikel: '3'
        paragraaf: '1'
  - number: '7.3'
    text: |-
      Het bedrag, bedoeld in [artikel 6, eerste lid, onder d][ref1], wordt slechts verstrekt voor zover de uitgaven van
      de aangeduide instelling voor buitenlandse activiteiten voor subsidie in aanmerking komen. Aan de subsidie is de
      verplichting verbonden dat in de overeenkomst, bedoeld in [artikel 3, vijfde lid][ref2], is vastgelegd dat ten
      minste het ten behoeve van de instelling voor buitenlandse activiteiten verstrekte bedrag, door de politieke partij
      aan de instelling voor buitenlandse activiteiten wordt betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0010465#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0010465#Artikel3
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0010465
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0010465
        artikel: '3'
        paragraaf: '1'
  - number: '8.1'
    text: De aanvraag van de subsidie voor een kalenderjaar wordt uiterlijk 1 november van het voorafgaande jaar ingediend.
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel8
  - number: '8.2'
    text: |-
      De aanvraag van de subsidie gaat vergezeld van een activiteitenplan, een begroting, een opgave van de ledentallen
      op de peildatum van de politieke partij en, indien van toepassing, van de aangeduide politieke jongerenorganisatie.
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel8
  - number: '8.3'
    text: |-
      Bij regeling van Onze Minister kunnen eisen worden gesteld aan de inrichting van het activiteitenplan, de begroting
      en de opgave van de ledentallen van de politieke partij en van de aangeduide politieke jongerenorganisatie
      voorzover van belang voor de verlening van de subsidie.
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel8
  - number: '9.1'
    text: |-
      Aan de subsidie is de verplichting verbonden dat de politieke partij een zodanig ingerichte administratie voert,
      dat daaruit te allen tijde de voor de vaststelling van de subsidie van belang zijnde rechten en verplichtingen
      alsmede de betalingen en ontvangsten kunnen worden nagegaan.
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel9
  - number: '9.2'
    text: De administratie en de daartoe behorende bescheiden worden gedurende tien jaren bewaard.
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel9
  - number: '10.1'
    text: De aanvraag tot vaststelling van de subsidie wordt ingediend binnen zes maanden na afloop van het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel10
  - number: '10.2'
    text: De aanvraag tot vaststelling van de subsidie gaat vergezeld van een financieel verslag en een activiteitenverslag.
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel10
  - number: '10.3'
    text: |-
      Het financieel verslag omvat tevens volgens de normen die in het maatschappelijk verkeer als aanvaardbaar worden
      beschouwd en uitgaande van het baten-lastenstelsel, een rekening van kosten en opbrengsten met de bijbehorende
      toelichting van belang zijnde voor de vaststelling van de subsidie.
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel10
  - number: '10.4'
    text: |-
      Het financieel verslag omvat tevens een opgave van de voor de vaststelling van de subsidie van belang zijnde
      gegevens omtrent het ledental van de politieke partij, en indien van toepassing van de aangeduide politieke
      jongerenorganisatie.
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel10
  - number: '10.5'
    text: |-
      Bij regeling van Onze Minister kunnen eisen worden gesteld aan de inrichting van het financieel verslag, het
      activiteitenverslag en de opgave van de ledentallen van de politieke partij en van de aangeduide politieke
      jongerenorganisatie voorzover van belang voor de vaststelling van de subsidie.
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel10
  - number: '11.1'
    text: |-
      De politieke partij geeft opdracht tot onderzoek van het financiële verslag aan een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '11.2'
    text: |-
      De accountant onderzoekt of het financiële verslag voldoet aan de bij of krachtens de wet gestelde voorschriften
      en of het activiteitenverslag, voorzover hij dat verslag kan beoordelen, met het financiële verslag verenigbaar
      is. De accountant onderzoekt tevens de naleving van de aan de subsidie verbonden verplichtingen en de juistheid
      van opgegeven ledentallen van de politieke partij en, indien van toepassing, van de aangeduide politieke
      jongerenorganisatie voorzover van belang voor de vaststelling van de subsidie.
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel11
  - number: '11.3'
    text: |-
      Bij regeling van Onze Minister kan een aanwijzing over de reikwijdte en de intensiteit van het onderzoek worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel11
  - number: '11.4'
    text: |-
      De accountant geeft de uitslag van zijn onderzoek weer in een schriftelijke verklaring omtrent de getrouwheid van
      het financiële verslag en de naleving van de aan de subsidie verbonden verplichtingen. De aanvraag tot vaststelling
      van de subsidie gaat vergezeld van de verklaring.
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel11
  - number: '11.5'
    text: |-
      De politieke partij draagt er zorg voor dat de accountant meewerkt aan door of namens de accountantsdienst van het
      Ministerie van Binnenlandse Zaken in te stellen onderzoeken naar de door de accountant verrichte werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel11
  - number: '12'
    text: |-
      Onze Minister stelt de subsidie vast binnen vier maanden na ontvangst van de aanvraag tot vaststelling van de
      subsidie.
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel12
  - number: '13'
    text: |-
      Onze Minister kan op de subsidie voorschotten verlenen. De voorschotten bedragen ten hoogste 80% van de subsidie
      die naar redelijke verwachting aan de politieke partij zal worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel13
  - number: '14.1'
    text: |-
      Indien een verkiezing voor de leden van de Tweede Kamer of de Eerste Kamer der Staten-Generaal leidt tot wijziging
      van het aantal kamerzetels van een politieke partij, vindt aanpassing van het bedrag aan subsidie, dat op grond
      van [artikel 6][ref1] ten hoogste aan de politieke partij kan worden verstrekt, plaats met ingang van de eerste
      dag van de vijfde kalendermaand, volgend op die waarin de verkiezingen plaatsvonden. Deze dag geldt tevens als de
      peildatum, bedoeld in [artikel 6, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010465#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0010465#Artikel6
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0010465
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0010465
        artikel: '6'
        paragraaf: '2'
  - number: '14.2'
    text: |-
      Indien een verkiezing er toe leidt dat in de Staten-Generaal aan de lijst van een politieke partij op grond van
      de [Kieswet][ref1] zetels worden toegewezen aan de lijst waarvan bij de voorgaande verkiezingen geen zetels waren
      toegewezen, komt deze partij voor subsidie in aanmerking met ingang van de eerste dag van de kalendermaand volgend
      op die waarin de verkiezing plaatsvond. Voor de politieke partij geldt deze dag als de eerste peildatum en de
      aanvraag van de subsidie, bedoeld in [artikel 8][ref2], wordt zo spoedig mogelijk en uiterlijk binnen 3 maanden na
      deze datum ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
      [ref2]: https://wetten.overheid.nl/BWBR0010465#Artikel8
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004627
      - id: ref2
        bwb_id: BWBR0010465
        artikel: '8'
        paragraaf: '3'
  - number: '14.3'
    text: |-
      Indien na verkiezingen aan de lijst van een politieke partij aan de lijst waarvan op grond van de [Kieswet][ref1]
      bij de voorgaande verkiezingen een of meer zetels waren toegewezen, geen zetels worden toegewezen, wordt
      de subsidie in afwijking van [artikel 2, eerste lid][ref2], nog verstrekt tot de eerste dag van de vijfde
      kalendermaand, volgend op die waarin de verkiezing plaatsvond.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
      [ref2]: https://wetten.overheid.nl/BWBR0010465#Artikel2
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004627
      - id: ref2
        bwb_id: BWBR0010465
        artikel: '2'
        paragraaf: '1'
  - number: '15.1'
    text: |-
      Indien een fractie van een politieke partij in de Tweede Kamer der Staten-Generaal wordt gesplitst duidt elke
      nieuwe fractie die als gevolg hiervan is ontstaan een politieke partij aan die, in afwijking van [artikel 2][ref1],
      met ingang van het volgende kalenderjaar voor subsidie in aanmerking komt, met dien verstande dat met ingang van
      dat kalenderjaar het basisbedrag, bedoeld in [artikel 6, eerste lid][ref2], van de partij op de lijst waarvan de
      leden van de nieuwe fractie in de Tweede Kamer zijn verkozen, verdeeld wordt naar evenredigheid van de kamerzetels
      van de betrokken politieke partijen. Voor de vaststelling van het aantal kamerzetels van de betrokken politieke
      partijen, wordt uitgegaan van een daartoe strekkende verklaring van de voorzitter van de Tweede Kamer.


      [ref1]: https://wetten.overheid.nl/BWBR0010465#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010465#Artikel6
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0010465
        artikel: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0010465
        artikel: '6'
        paragraaf: '2'
  - number: '15.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing in geval van een splitsing van de fractie van een politieke partij
      in de Eerste Kamer der Staten-Generaal indien aan deze politieke partij subsidie wordt verstrekt op basis van
      kamerzetels in de Eerste Kamer.
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel15
  - number: '15.3'
    text: |-
      Indien twee of meer politieke partijen die op grond van deze wet subsidie ontvangen worden samengevoegd tot een
      nieuwe politieke partij, komt deze nieuwe politieke partij, in afwijking van [artikel 2][ref1], met ingang van het
      volgende kalenderjaar voor subsidie in aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0010465#Artikel2
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0010465
        artikel: '2'
        paragraaf: '1'
  - number: '16.1'
    text: |-
      Indien een politieke partij op grond van de [artikelen 137c, d, e, f, of g][ref1], of
      [artikel 429 quater van het Wetboek van Strafrecht][ref2], is veroordeeld tot een onvoorwaardelijke geldboete,
      vervalt van rechtswege de aanspraak op subsidie gedurende een periode die ingaat op de dag waarop de veroordeling
      onherroepelijk is geworden. Deze periode is:


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel137c
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel429
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 137c
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '429'
  - number: 16.1.a
    text: één jaar, bij een geldboete van minder dan € 1 125;
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel16
  - number: 16.1.b
    text: twee jaar, bij een geldboete van € 1 125 of meer, maar minder dan € 2 250;
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel16
  - number: 16.1.c
    text: drie jaar, bij een geldboete van € 2 250 of meer, maar minder dan € 3 375; en
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel16
  - number: 16.1.d
    text: vier jaar, bij een geldboete van € 3 375 of meer.
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel16
  - number: '16.2'
    text: |-
      Indien aan de lijst van een politieke partij aan de lijst waarvan op de dag waarop de veroordeling onherroepelijk
      wordt, op grond van de [Kieswet][ref1] geen zetels zijn toegewezen, op grond van een verkiezing die plaatsvindt
      binnen een periode van twee jaar na die dag één of meer zetels worden toegewezen, gaat de periode gedurende welke
      geen aanspraak op subsidie bestaat, in op de dag waarop de verkiezing heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: '17'
    text: |-
      Onze Minister zendt ieder jaar aan de Staten-Generaal een overzicht van de subsidies die aan de politieke partijen
      zijn verstrekt. Een verslag als bedoeld in [artikel 4:24 van de Algemene wet bestuursrecht][ref1] kan achterwege
      blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '18.1'
    text: |-
      Een gift aan een politieke partij van € 4 537,80 of meer, afkomstig anders dan van een natuurlijke persoon, wordt
      door de partij openbaar gemaakt. De openbaarmaking van de gift geschiedt in ieder geval door vermelding in het
      financieel verslag van de politieke partij. Giften van een gever met een gezamenlijk bedrag van € 4 537,80 of meer
      per jaar worden voor de toepassing van dit lid beschouwd als één gift.
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel18
  - number: '18.2'
    text: |-
      Bij de openbaarmaking wordt de hoogte van het bedrag, de datum waarop de gift is gedaan en de naam van de gever
      vermeld. Indien de gever bezwaar heeft gemaakt tegen vermelding van zijn naam, kan deze achterwege blijven, met
      dien verstande dat in dat geval een omschrijving wordt gegeven van de categorie van instellingen of organisaties
      waartoe de gever behoort.
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel18
  - number: '18.3'
    text: |-
      Het financieel verslag van een politieke partij vermeldt het totaal aan giften anders dan de contributies van de
      leden van de partij.
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel18
  - number: '21.1'
    text: |-
      [Dit artikel][ref1] is van toepassing op het jaar waarin deze wet in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0010465#Artikel21
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0010465
        artikel: '21'
        paragraaf: '7'
  - number: '21.2'
    text: |-
      De aanvraag van de subsidie, bedoeld in [artikel 8][ref1], wordt zo spoedig mogelijk en uiterlijk binnen drie
      maanden na de aanvang van het kalenderjaar ingediend. Aanvragen voor subsidie op grond van de Subsidieregeling voor
      politiekwetenschappelijke instituten 1995, de subsidieregeling voor politieke vormings- en scholingsactiviteiten
      1995 en de Tijdelijke subsidieregeling politieke jongerenorganisaties kunnen door Onze Minister worden aangemerkt
      als een aanvraag tot subsidie op grond van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0010465#Artikel8
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0010465
        artikel: '8'
        paragraaf: '3'
  - number: '21.3'
    text: |-
      Indien deze wet in werking treedt op een andere datum dan 1 januari, dan vangt voor de toepassing van de wet
      het kalenderjaar aan op de datum van inwerkingtreding. In dat geval geschiedt de verstrekking van subsidie naar
      evenredigheid met dien verstande dat een politieke partij voor dat kalenderjaar niet minder subsidie ontvangt dan
      deze partij ontvangen zou hebben op grond van de regelingen, genoemd in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel21
  - number: '22'
    text: |-
      [Artikel 16][ref1] en [afdeling 6.1.1 van de Mediawet 2008][ref2] zijn niet van toepassing ten aanzien van de
      veroordeling voor een strafbaar feit dat voor de datum van inwerkingtreding van deze wet is gepleegd.


      [ref1]: https://wetten.overheid.nl/BWBR0010465#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Afdeling6.1.1
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0010465
        artikel: '16'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0025028
        afdeling: 6.1.1
  - number: '23'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel23
  - number: '24'
    text: 'Deze wet wordt aangehaald als: Wet subsidiëring politieke partijen.'
    url: https://wetten.overheid.nl/BWBR0010465/2013-01-01#Artikel24
