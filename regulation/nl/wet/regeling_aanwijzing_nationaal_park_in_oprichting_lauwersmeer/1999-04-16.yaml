preamble:
  text: |-
    Gezien het advies van de Voorlopige Commissie Nationale Parken van 23 december 1997;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0010405/1999-04-16#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
             minister:

              Minister van Landbouw, Natuurbeheer en Visserij;



            b
             overlegorgaan:

              overlegorgaan als bedoeld in [artikel 3][ref1];



            c
             nationaal park:

              gebied zoals omschreven in het Structuurschema Groene Ruimte (kamerstukken II 1992/93, 22880, nr. 5, blz.
      9).


      [ref1]: https://wetten.overheid.nl/BWBR0010405#Artikel3
    url: https://wetten.overheid.nl/BWBR0010405/1999-04-16#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010405
        artikel: '3'
  - number: '2'
    text: |-
      Als nationaal park in oprichting wordt aangewezen het natuurgebied Lauwersmeer, zoals aangegeven op de als bijlage
      bij deze regeling behorende kaart.
    url: https://wetten.overheid.nl/BWBR0010405/1999-04-16#Artikel2
  - number: '3'
    text: Er is een overlegorgaan nationaal park in oprichting Lauwersmeer.
    url: https://wetten.overheid.nl/BWBR0010405/1999-04-16#Artikel3
  - number: '4'
    text: |-
      1 Het overlegorgaan heeft tot taak, vooruitlopend op de aanwijzing van het natuurgebied Lauwersmeer, bedoeld
      in [artikel 2][ref1], als nationaal park, de inrichting, het beheer en functioneren van het nationaal park in
      oprichting Lauwersmeer overeenkomstig de doelstellingen van een nationaal park te bevorderen.

      2 Tot die taak behoort onder meer:

      a. het opstellen van een beheers- en inrichtingsplan, dat als basis kan dienen om het natuurgebied Lauwersmeer aan
      te wijzen als nationaal park;

      b. de onderlinge afstemming van alle voor de inrichting en beheer van belang zijnde activiteiten;

      c. het doen van voorstellen aan de minister voor de besteding en toekenning van de voor het nationaal park in
      oprichting Lauwersmeer beschikbare middelen, onder meer in de vorm van een voortschrijdend meerjarenprogramma en
      een jaarlijks in te dienen bestedingenplan;

      d. bevordering en coördinatie van voorlichting en educatie met betrekking tot het nationaal park in oprichting
      Lauwersmeer.


      [ref1]: https://wetten.overheid.nl/BWBR0010405#Artikel2
    url: https://wetten.overheid.nl/BWBR0010405/1999-04-16#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0010405
        artikel: '2'
  - number: '5'
    text: |-
      Het overlegorgaan neemt bij de uitvoering van zijn taak als uitgangspunt het advies van de Voorlopige Commissie
      Nationale Parken van 23 december 1997 als ook de brief van 4 juni 1998 met kenmerk DNO. 98.923 inhoudende het
      beleidsstandpunt van de Minister van Landbouw, Natuurbeheer en Visserij daaromtrent.
    url: https://wetten.overheid.nl/BWBR0010405/1999-04-16#Artikel5
  - number: '6'
    text: |-
      In het overlegorgaan hebben zitting:

      a. een door de minister te benoemen lid, tevens voorzitter;

      b. door de minister te benoemen leden, als vertegenwoordiger en op voordracht van respectievelijk:

      1. het wetterskip Lauwerswâlden

      2. de provincie Groningen;

      3. de gemeente De Marne;

      4. het wetterskip De Waadkant;

      5. het recreatieschap ’De Marrekrite’;

      6. Staatsbosbeheer;

      7. het waterschap Noorderzijlvest;

      8. de gemeente Kollumerland c.a.;

      9. de gemeente Dongeradeel;

      10. de provincie Fryslân;

      11. het waterschap Friesland;

      12. de gemeente Zuidhorn;

      c. de Directeur van de Directie LNV Noord van het Ministerie van Landbouw, Natuurbeheer en Visserij.
    url: https://wetten.overheid.nl/BWBR0010405/1999-04-16#Artikel6
  - number: '7'
    text: |-
      1 Het secretariaat van het overlegorgaan berust bij een door de provincie Groningen te benoemen ambtenaar in dienst
      bij deze provincie.

      2 Het overlegorgaan regelt de openbaarheid en de plaats van zijn vergadering, alsmede de overige aspecten van zijn
      inrichting en werkwijze.

      3 Het overlegorgaan brengt jaarlijks van zijn werkzaamheden en de daarmee samenhangende ontwikkelingen in het
      nationale park Lauwersmeer verslag uit aan de minister.
    url: https://wetten.overheid.nl/BWBR0010405/1999-04-16#Artikel7
  - number: '8'
    text: |-
      Indien in het overlegorgaan belangrijke verschillen van inzicht blijken te bestaan, doet de voorzitter van het
      overlegorgaan daarvan mededeling aan de minister, die daarop de naar zijn oordeel nodige stappen onderneemt.
    url: https://wetten.overheid.nl/BWBR0010405/1999-04-16#Artikel8
  - number: '9'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      geplaatst is en werkt terug tot en met 7 april 1999.
    url: https://wetten.overheid.nl/BWBR0010405/1999-04-16#Artikel9
  - number: '10'
    text: 'Deze regeling wordt aangehaald als: Regeling aanwijzing nationaal park in oprichting Lauwersmeer.'
    url: https://wetten.overheid.nl/BWBR0010405/1999-04-16#Artikel10
