---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: reglement_nwo_2002
regulatory_layer: WET
publication_date: '2017-02-28'
valid_from: '2017-02-02'
bwb_id: BWBR0014548
url: https://wetten.overheid.nl/BWBR0014548/2017-02-02
articles:
  - number: 1.1.1
    text: 'In dit reglement wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel1.1
  - number: 1.1.1.a
    text: |-
      *de wet* de [Wet op de Nederlandse organisatie voor wetenschappelijk onderzoek][ref1] (Stb. 1987, nr. 369);


      [ref1]: https://wetten.overheid.nl/BWBR0004191
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0004191
  - number: 1.1.1.b
    text: |-
      *de organisatie* de Nederlandse organisatie voor wetenschappelijk onderzoek als genoemd in
      [artikel 2 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004191#Artikel2
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0004191
        artikel: '2'
  - number: 1.1.1.c
    text: |-
      *onderzoeksorganisatie* een organisatie als bedoeld in [artikel 15 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004191#Artikel15
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0004191
        artikel: '15'
  - number: 1.1.1.d
    text: '*de minister* de Minister van Onderwijs, Cultuur en Wetenschappen;'
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel1.1
  - number: 1.1.1.e
    text: |-
      *gebiedsbestuur* een gebiedsbestuur als genoemd in [artikel 9 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004191#Artikel9
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0004191
        artikel: '9'
  - number: 1.1.1.f
    text: '*gebied* een wetenschapsgebied waarvoor een gebiedsbestuur is ingesteld;'
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel1.1
  - number: 1.1.1.g
    text: |-
      *de algemeen directeur* de algemeen directeur zoals genoemd in [artikel 8 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004191#Artikel8
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0004191
        artikel: '8'
  - number: '1.2'
    text: |-
      De organisatie bestaat uit het Algemeen Bestuur, de gebiedsbesturen, aansturingsorganen voor bepaalde tijd, de
      onderzoeksorganisaties, de adviesraden, de commissies en de algemeen directeur.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel1.2
  - number: 2.1.1
    text: |-
      Het Algemeen Bestuur draagt bij de opstelling van het instellingsplan als genoemd in [artikel 18 van de wet][ref1]
      zorg voor betrokkenheid van de gebiedsbesturen. Het Algemeen Bestuur stelt de gebiedsbesturen in de gelegenheid
      hiervoor voorstellen in te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0004191#Artikel18
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0004191
        artikel: '18'
  - number: 2.1.2
    text: |-
      Het Algemeen Bestuur evalueert in samenspraak met de gebiedsbesturen periodiek de verschillende subsidie-
      instrumenten en de verschillende onderdelen van de organisatie en verwerkt de resultaten hiervan in het beleid.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel2.1
  - number: 2.1.3
    text: |-
      Het Algemeen Bestuur treft voorzieningen ter uitvoering van de besluiten van gebiedsbesturen omtrent toewijzing
      van middelen.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel2.1
  - number: 2.1.4
    text: |-
      Het Algemeen Bestuur kan besluiten dat het toewijzen van bepaalde middelen gebeurt door hemzelf of, namens hem,
      door een door hem in te stellen commissie, orgaan, onderzoeksorganisatie of aangestelde functionaris.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel2.1
  - number: 2.1.5
    text: |-
      Het Algemeen Bestuur geeft, gehoord de betrokken gebiedsbesturen, algemene richtlijnen voor de wijze van
      beoordeling van subsidieaanvragen.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel2.1
  - number: 2.1.6
    text: |-
      Het Algemeen Bestuur geeft, gehoord de betrokken gebiedsbesturen, richtlijnen voor de inrichting van de
      organisatie, het personeelsbeleid, de informatievoorziening met inbegrip van de administratieve organisatie, de
      financieel economische bedrijfsvoering en de huisvesting.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel2.1
  - number: 2.1.7
    text: |-
      In de gevallen waarin de [wet][ref1] en dit reglement of de op grond hiervan gestelde regels niet voorzien, beslist
      het Algemeen Bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0004191
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0004191
  - number: 2.2.1
    text: |-
      Het Algemeen Bestuur vergadert zo dikwijls de voorzitter of twee leden dit wenselijk achten, doch ten minste tien
      maal per jaar. De voorzitter stelt na overleg met de algemeen directeur de concept-agenda vast.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel2.2
  - number: 2.2.2
    text: |-
      Het Algemeen Bestuur kan slechts besluiten nemen wanneer ten minste de helft van het aantal leden aanwezig is.
      Wanneer het vereiste aantal leden niet aanwezig is, wordt een nieuwe vergadering uitgeschreven waarin ongeacht het
      aantal aanwezige leden besluiten kunnen worden genomen.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel2.2
  - number: 2.2.3
    text: |-
      Indien het nodig is bij stemming te besluiten, wordt een besluit bij gewone meerderheid van uitgebrachte stemmen
      genomen. Bij staking van stemmen wordt de besluitvorming opgeschort, tenzij dit naar het oordeel van de voorzitter
      niet in het belang van de organisatie is. In dat geval is de stem van de voorzitter doorslaggevend.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel2.2
  - number: 2.2.4
    text: |-
      In spoedeisende gevallen kan de voorzitter of zijn plaatsvervanger met inachtneming van eventuele voorwaarden van
      het Algemeen Bestuur, buiten de vergaderingen besluiten nemen namens het Algemeen Bestuur. Dergelijke besluiten
      worden zo spoedig mogelijk ter kennis gebracht van het Algemeen Bestuur.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel2.2
  - number: 2.3.1
    text: |-
      Naast de taken van de algemeen directeur als genoemd in [artikel 8 van de wet][ref1], is de algemeen directeur
      secretaris van het Algemeen Bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0004191#Artikel8
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0004191
        artikel: '8'
  - number: 2.3.2
    text: |-
      De algemeen directeur is belast met de voorbereiding van de vergaderingen van het Algemeen Bestuur, waaronder
      begrepen het zenden van een oproepingsbrief, de conceptagenda en de bijbehorende vergaderstukken.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel2.3
  - number: 2.3.3
    text: |-
      De algemeen directeur is verantwoordelijk voor de bekendmaking en de uitvoering van de besluiten van het Algemeen
      Bestuur, voorzover het Algemeen Bestuur een en ander zichzelf niet heeft voorbehouden.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel2.3
  - number: 2.3.4
    text: De algemeen directeur woont de vergaderingen van het Algemeen Bestuur met raadgevende stem bij.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel2.3
  - number: 3.1.1
    text: 'Er zijn gebiedsbesturen voor:'
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel3.1
  - number: 3.1.1.a
    text: |-
      Exacte en Natuurwetenschappen – ENW (voor de wetenschapsgebieden: Aard- en Levenswetenschappen, Chemische
      Wetenschappen, Exacte Wetenschappen en Natuurkunde);
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel3.1
  - number: 3.1.1.b
    text: |-
      Sociale en Geesteswetenschappen – SGW (voor de wetenschapsgebieden: Geesteswetenschappen en Maatschappij- en
      Gedragswetenschappen);
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel3.1
  - number: 3.1.1.c
    text: 'Toegepaste en Technische Wetenschappen – TTW (voor het wetenschapsgebied: Technische Wetenschappen);'
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel3.1
  - number: 3.1.1.d
    text: 'Zorgonderzoek en Medische Wetenschappen – ZonMw (voor het wetenschapsgebied: Medische Wetenschappen).'
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel3.1
  - number: 3.1.2
    text: |-
      Het Algemeen Bestuur bepaalt zo nodig tot welk gebied bepaalde onderdelen van wetenschapsbeoefening dienen te
      worden gerekend.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel3.1
  - number: 3.1.3
    text: |-
      Het gebiedsbestuur voor de Toegepaste en Technische Wetenschappen vormt een personele unie met het bestuur van de
      Technologiestichting STW.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel3.1
  - number: 3.2.1
    text: De gebiedsbesturen stellen voor hun gebied beleid vast.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel3.2
  - number: 3.2.2
    text: |-
      De gebiedsbesturen nemen bij de vaststelling van hun beleid en de toewijzing van middelen het door het Algemeen
      Bestuur vastgestelde algemene beleid en de voor het desbetreffende gebied goedgekeurde begroting in acht.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel3.2
  - number: 3.2.3
    text: |-
      Een gebiedsbestuur let op het aspect van coördinatie binnen zijn gebied en bevordert deze waar nodig. Het Algemeen
      Bestuur kan, na overleg met de betrokken gebiedsbesturen, één of meer gebiedsbesturen belasten met de coördinatie
      van het beleid ten aanzien van een onderdeel van wetenschapsbeoefening dat zich uitstrekt tot meer dan één gebied.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel3.2
  - number: 3.2.4
    text: |-
      Een gebiedsbestuur besteedt bijzondere aandacht aan onderdelen van zijn gebied die zodanige raakvlakken
      vertonen met onderdelen van andere gebieden dat speciale aandacht voor coördinatie of bevordering van inter-
      of multidisciplinaire aspecten nodig is. Een gebiedsbestuur doet zo nodig voorstellen terzake aan het Algemeen
      Bestuur.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel3.2
  - number: 3.2.5
    text: Een gebiedsbestuur treft voorzieningen welke de maatschappelijke oriëntatie van zijn beleid waarborgen.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel3.2
  - number: 3.2.6
    text: Een gebiedsbestuur is niet bevoegd de besluitvorming over subsidies te delegeren.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel3.2
  - number: 3.2.7
    text: Een gebiedsbestuur draagt zorg voor een periodieke beoordeling van de werkzaamheden op zijn gebied.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel3.2
  - number: 3.2.8
    text: |-
      Een gebiedsbestuur bevordert de overdracht van kennis van de resultaten van door hem geïnitieerd en gestimuleerd
      onderzoek.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel3.2
  - number: 3.2.9
    text: Een gebiedsbestuur verleent desgevraagd medewerking aan de uitvoering van de taken van het Algemeen Bestuur.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel3.2
  - number: 3.3.1
    text: |-
      Een gebiedsbestuur is in het kader van zijn taakuitvoering en binnen de grenzen van de goedgekeurde begroting
      bevoegd namens de organisatie rechtshandelingen naar burgerlijk recht te verrichten.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel3.3
  - number: 3.3.2
    text: |-
      Van de in het voorgaande lid gegeven bevoegdheid zijn, behoudens bijzondere volmacht, uitgezonderd overeenkomsten
      en andere rechtshandelingen:
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel3.3
  - number: 3.3.2.a
    text: die betrekking hebben op registergoederen;
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel3.3
  - number: 3.3.2.b
    text: in het kader van personeelsbeheer in de ruimste zin van het woord;
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel3.3
  - number: 3.3.2.c
    text: |-
      tot het doen van transacties op de geld- en kapitaalmarkt en het waarborgen van geldelijke verplichtingen van
      derden;
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel3.3
  - number: 3.3.2.d
    text: |-
      waarvoor geldt dat de opdracht tot levering, uitvoering van werk of dienstverlening ingevolge Europese verdragen
      of richtlijnen wordt aanbesteed via de openbare of de niet-openbare procedure of waarvoor anderszins bijzondere
      aanbestedingsvoorschriften zijn gegeven;
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel3.3
  - number: 3.3.2.e
    text: die strekken tot het oprichten, ontbinden of besturen van of deelnemen aan andere rechtspersonen;
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel3.3
  - number: 3.3.2.f
    text: tot het verwerven van goederen die centraal door de organisatie worden ingekocht.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel3.3
  - number: 3.3.3
    text: |-
      Indien de organisatie voor (bepaalde) transacties algemene voorwaarden vaststelt, worden deze door het
      gebiedsbestuur gehanteerd.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel3.3
  - number: 3.4.1
    text: |-
      Het Algemeen Bestuur draagt bij de benoeming van leden van een gebiedsbestuur zorg voor spreiding naar de
      onderdelen van het betreffende gebied.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel3.4
  - number: 3.4.2
    text: |-
      Een gebiedsbestuur stelt een intern gebiedsreglement vast, waarin zijn werkzaamheden alsmede de wijze waarop deze
      werkzaamheden binnen zijn gebied worden uitgevoerd worden vastgelegd. Het gebiedsreglement dient in overeenstemming
      te zijn met de [wet][ref1] en dit reglement.


      [ref1]: https://wetten.overheid.nl/BWBR0004191
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0004191
  - number: 3.4.3
    text: |-
      Een lid van het algemeen bestuur woont een vergadering van een gebiedsbestuur, als genoemd in artikel 2 van dit
      wijzigingsreglement, als toehoorder bij en heeft tijdens de vergadering van een gebiedsbestuur een adviserende
      danwel raadgevende stem.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel3.4
  - number: 3.4.4
    text: |-
      De algemeen directeur voorziet in het secretariaat van de gebiedsbesturen. De algemeen directeur of zijn vervanger
      kan de vergaderingen van de gebiedsbesturen bijwonen en ontvangt de vergaderstukken.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel3.4
  - number: 3A.1.1
    text: |-
      Het Algemeen Bestuur kan, al dan niet in het kader van samenwerking met derden, aansturingsorganen voor bepaalde
      tijd instellen.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel3A.1
  - number: 3A.1.2
    text: |-
      Een besluit tot instelling van een dergelijk orgaan regelt de samenstelling en taak van het orgaan, zijn
      bevoegdheden en de verantwoording daarvan, de advisering ten aanzien van zijn besluitvorming, de instellingsduur
      alsmede de evaluatie voorzover regeling van deze zaken niet reeds op andere wijze tot stand is gekomen. Voorzover
      dit het geval mocht zijn, bevat het instellingsbesluit in plaats van een regeling een verwijzing naar de
      desbetreffende stukken.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel3A.1
  - number: 3A.1.3
    text: |-
      Het Algemeen Bestuur kan hangende de instellingsduur tot opheffing van het orgaan besluiten. Indien de instelling
      heeft plaatsgevonden op ministeriële instigatie, kan pas tot opheffing worden besloten na overleg met de
      coördinerend Minister. Het besluit tot opheffing noemt de resterende termijn, waarbinnen de lopende werkzaamheden
      van het orgaan worden afgehandeld, de datum waarop de afvloeiing van het personeel van het orgaan plaatsvindt
      alsmede de datum waarop de eindafrekening en het eindverslag van het orgaan bij het Algemeen Bestuur worden
      verwacht.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel3A.1
  - number: 3A.1.4
    text: |-
      Middels de goedkeuring van de eindafrekening en het eindverslag heft het Algemeen Bestuur het orgaan op onder
      eventuele overheveling van dan nog resterende zaken naar een ander onderdeel van NWO.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel3A.1
  - number: 3A.2.1
    text: Het aansturingsorgaan opereert zoals bij nadere regeling is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel3A.2
  - number: 3A.2.2
    text: |-
      De [artikelen 3.2][ref1] en [3.3][ref2] (met regels betreffende de gebiedsbesturen), [7.1][ref3] (betreffende de
      begroting) en [8.1][ref4] (betreffende het jaarverslag en de jaarrekening) en [artikel 9.2][ref5] (betreffende de
      communicatie binnen NWO zijn, voor zover mogelijk, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014548#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0014548#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0014548#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0014548#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0014548#Artikel9
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel3A.2
    references:
      - id: ref1
        bwb_id: BWBR0014548
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0014548
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0014548
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0014548
        artikel: '8'
      - id: ref5
        bwb_id: BWBR0014548
        artikel: '9'
  - number: 4.1.1
    text: 'Onderzoeksorganisaties kunnen zijn:'
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel4.1
  - number: 4.1.1.a
    text: |-
      aan de organisatie verbonden (verzamelingen van) instituten waar wetenschappelijk onderzoek wordt verricht of waar
      grootschalige onderzoeksfaciliteiten worden beheerd (onderzoeksinstituten);
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel4.1
  - number: 4.1.1.b
    text: |-
      permanente niet aan een wetenschapsgebied verbonden organen met als taak het namens het Algemeen Bestuur toekennen
      van middelen voor wetenschappelijk onderzoek (subsidie-organisaties).
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel4.1
  - number: 4.1.2
    text: |-
      Een onderzoeksorganisatie kan niet zowel de functie van onderzoeksinstituut als die van subsidie-organisatie
      hebben.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel4.1
  - number: 4.1.3
    text: Onderzoeksorganisaties rapporteren rechtstreeks aan het Algemeen Bestuur.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel4.1
  - number: 4.1.4
    text: Onderzoeksorganisaties kunnen, indien dit noodzakelijk is voor hun taakuitoefening, rechtspersoonlijkheid bezitten.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel4.1
  - number: 4.1.5
    text: |-
      De [artikelen 3.2][ref1] en [3.3][ref2] en paragraaf 10 zijn van overeenkomstige toepassing op de
      onderzoeksorganisaties.


      [ref1]: https://wetten.overheid.nl/BWBR0014548#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0014548#Artikel3
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0014548
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0014548
        artikel: '3'
  - number: 4.2.1
    text: |-
      Het Algemeen Bestuur stelt vast welke onderzoeksorganisaties als bedoeld in [artikel 4.1][ref1] er zijn en regelt
      hierbij tevens de taakstelling, het bestuur en het beheer van deze organisaties.


      [ref1]: https://wetten.overheid.nl/BWBR0014548#Artikel4
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0014548
        artikel: '4'
  - number: 4.2.2
    text: |-
      Waar in de [artikelen 2.1][ref1], [7.1][ref2], [8.1][ref3] en [9.2][ref4] wordt gesproken van
      gebiedsbesturen, is dit van overeenkomstige toepassing voor de onderzoeksorganisaties als bedoeld in
      [artikel 4.1, eerste lid, onder b][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0014548#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0014548#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0014548#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0014548#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0014548#Artikel4
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0014548
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0014548
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0014548
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0014548
        artikel: '9'
      - id: ref5
        bwb_id: BWBR0014548
        artikel: '4'
  - number: 5.1.1
    text: |-
      Er is een Stichting voor de Technische Wetenschappen (STW) waarvan de statuten bij wijziging van 1989 door het
      Algemeen Bestuur van NWO zijn goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel5.1
  - number: 5.1.2
    text: |-
      De keuze en situering van het bureau van de STW alsmede de inrichting daarvan kunnen slechts met instemming van het
      bestuur en de bestuursraad van de STW worden bepaald respectievelijk gewijzigd.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel5.1
  - number: 5.1.3
    text: |-
      NWO heeft slechts zeggenschap over het STW beleid en werkwijze alsmede over het beheer van haar financiën voor
      zover geregeld in de STW-Statuten, bij of krachtens de [NWO-instellingswet](onbekend) en/of het NWO-Reglement.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel5.1
  - number: 5.1.4
    text: |-
      Ten aanzien van algemene richtlijnen van het AB-NWO, die raken aan het STW beleid en/of haar werkwijze, plegen NWO
      en de STW vooraf overleg.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel5.1
  - number: 5.3.1
    text: |-
      De directeur wordt benoemd door het STW bestuur conform de Statuten, dwz met instemming van de algemeen directeur
      van NWO.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel5.3
  - number: 5.3.2
    text: |-
      De directeur van de STW legt verantwoording af aan het bestuur en de bestuursraad van de STW en voert het door hen
      vastgestelde beleid uit.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel5.3
  - number: 6.1.1
    text: |-
      Het Algemeen Bestuur, de onderzoeksorganisaties en de gebiedsbesturen kunnen commissies instellen. Voor onderwerpen
      van gemeenschappelijk belang kunnen bij gezamenlijk besluit gemeenschappelijke commissies worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel6.1
  - number: 6.1.2
    text: |-
      Een besluit tot instelling van een commissie, regelt de samenstelling en taak van de commissie en voorts de tijd
      waarvoor de commissie is ingesteld.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel6.1
  - number: 6.2.1
    text: |-
      Met inachtneming van het bepaalde in [artikel 3.2, zesde lid][ref1], kan aan een commissie beslissingsbevoegdheid
      worden toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0014548#Artikel3
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0014548
        artikel: '3'
  - number: 6.2.2
    text: |-
      In geval een commissie beslissingsbevoegdheid krijgt toegekend, regelt het instellende orgaan de werkwijze van de
      commissie, het toezicht op de uitoefening van bevoegdheden door de commissie, alsmede de verantwoording, een en
      ander voor zover zulks in verband met de aard en de omvang van de toegekende bevoegdheden nodig is.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel6.2
  - number: 7.1.1
    text: |-
      Elk gebiedsbestuur dient jaarlijks, voor een door het Algemeen Bestuur te bepalen tijdstip, een ontwerp-
      gebiedsbegroting in bij het Algemeen Bestuur.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel7.1
  - number: 7.1.2
    text: Het Algemeen Bestuur pleegt overleg met een gebiedsbestuur over diens ontwerp-gebiedsbegroting.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel7.1
  - number: 7.1.3
    text: |-
      Een gebiedsbestuur zendt de gebiedsbegroting voor een door het Algemeen Bestuur te bepalen tijdstip aan het
      Algemeen Bestuur.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel7.1
  - number: 7.1.4
    text: |-
      De gebiedsbegroting behoeft de goedkeuring van het Algemeen Bestuur. Indien de goedkeuring wordt onthouden, dient
      het gebiedsbestuur een herziene begroting in volgens aanwijzingen van het Algemeen Bestuur op een door het Algemeen
      Bestuur te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel7.1
  - number: 7.1.5
    text: |-
      Goedkeuring van de gebiedsbegroting vindt plaats onder voorbehoud van goedkeuring van de NWO-begroting door de
      Minister als bedoeld in [artikel 22 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004191#Artikel22
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0004191
        artikel: '22'
  - number: 7.1.6
    text: |-
      Wijziging van de gebiedsbegroting behoeft de goedkeuring van het Algemeen Bestuur. Het Algemeen Bestuur kan
      hiervoor een algemene of bijzondere machtiging verstrekken.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel7.1
  - number: 7.2.1
    text: |-
      Het bestuur van een onderzoeksorganisatie als bedoeld in [artikel 4.1, eerste lid, onder a][ref1]., dient, in
      overeenstemming met de aan de onderzoeksorganisatie vooraf kenbaar gemaakte subsidievoorwaarden, bij het Algemeen
      Bestuur voor een door het Algemeen Bestuur te bepalen tijdstip een (ontwerp)-begroting in.


      [ref1]: https://wetten.overheid.nl/BWBR0014548#Artikel4
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0014548
        artikel: '4'
  - number: 7.2.2
    text: |-
      Aan de hand van de gestelde subsidievoorwaarden en de ingediende begroting besluit het Algemeen Bestuur over de
      toekenning van de subsidie aan de in het eerste lid bedoelde organisatie en de daarbij te stellen voorwaarden.
      Toekenning van de subsidie vindt plaats onder voorbehoud van goedkeuring van de NWO-begroting door de Minister als
      bedoeld in [artikel 22 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004191#Artikel22
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0004191
        artikel: '22'
  - number: 7.2.3
    text: |-
      De begroting van de onderzoeksorganisatie alsmede wijziging hiervan behoeft de goedkeuring van het Algemeen
      Bestuur. Het Algemeen Bestuur kan voor het wijzigen van de begroting een algemene of bijzondere machtiging
      verstrekken.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel7.2
  - number: 7.3.1
    text: |-
      Op basis van de (ontwerp-)deelbegrotingen, waaronder begrepen die van de gebiedsbesturen en de
      onderzoeksorganisaties, stelt de algemeen directeur de ontwerp-geconsolideerde NWO-begroting op.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel7.3
  - number: 7.3.2
    text: De geconsolideerde NWO-begroting wordt na eventuele aanpassingen vastgesteld door het Algemeen Bestuur.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel7.3
  - number: 8.1.1
    text: |-
      Een gebiedsbestuur brengt aan het Algemeen Bestuur voor een door het Algemeen Bestuur te bepalen tijdstip verslag
      uit van de werkzaamheden en voegt daarbij de jaarrekening van het gebiedsbestuur.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel8.1
  - number: 8.1.2
    text: |-
      Binnen een nader door het Algemeen Bestuur te bepalen termijn beslist het Algemeen Bestuur of het de jaarrekening
      goedkeurt of de goedkeuring daaraan geheel of gedeeltelijk onthoudt. Indien de goedkeuring wordt onthouden, dient
      het gebiedsbestuur een herziene jaarrekening in volgens aanwijzingen van het Algemeen Bestuur op een door het
      Algemeen Bestuur te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel8.1
  - number: 8.1.3
    text: |-
      De goedkeuring van de jaarrekening vindt plaats onder voorbehoud van goedkeuring van de geconsolideerde
      jaarrekening door de Minister als bedoeld in [artikel 25 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004191#Artikel25
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0004191
        artikel: '25'
  - number: 8.2.1
    text: |-
      Het bestuur van een onderzoeksorganisatie als bedoeld in [artikel 4.1, eerste lid, onder a][ref1], brengt, in
      overeenstemming met de gestelde subsidievoorwaarden, aan het Algemeen Bestuur voor een door het Algemeen Bestuur te
      bepalen tijdstip verslag uit van de werkzaamheden en voegt daarbij de jaarrekening van de onderzoeksorganisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0014548#Artikel4
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0014548
        artikel: '4'
  - number: 8.2.2
    text: |-
      Binnen een nader door het Algemeen Bestuur te bepalen termijn beslist het Algemeen Bestuur of het de ingediende
      jaarrekening goedkeurt dan wel de goedkeuring daaraan geheel of gedeeltelijk onthoudt en stelt daarbij tevens de
      hoogte van de subsidie vast. Indien de goedkeuring wordt onthouden, dient het bestuur van de onderzoeksorganisatie
      een herziene jaarrekening in volgens aanwijzingen van het Algemeen Bestuur op een door het Algemeen Bestuur te
      bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel8.2
  - number: 8.2.3
    text: |-
      De goedkeuring van de jaarrekening vindt plaats onder voorbehoud van goedkeuring van de geconsolideerde
      jaarrekening door de Minister als bedoeld in [artikel 25 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004191#Artikel25
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0004191
        artikel: '25'
  - number: 8.3.1
    text: |-
      Op basis van de (ontwerp-)deeljaarrekeningen en met gebruikmaking van de deeljaarverslagen, waaronder begrepen
      de deeljaarrekeningen en deeljaarverslagen van de gebiedsbesturen en de onderzoeksorganisaties, stelt de algemeen
      directeur een ontwerpgeconsolideerd NWO-jaarverslag en een ontwerp-geconsolideerde jaarrekening op.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel8.3
  - number: 8.3.2
    text: |-
      Het geconsolideerde NWO-jaarverslag en de geconsolideerde jaarrekening worden na eventuele aanpassingen vastgesteld
      door het Algemeen Bestuur.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel8.3
  - number: 9.1.1
    text: |-
      Het Algemeen Bestuur bevordert de communicatie en het overleg binnen de organisatie alsmede van de organisatie met
      haar omgeving.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel9.1
  - number: 9.2.1
    text: |-
      Het Algemeen Bestuur voert, naast het overleg genoemd in [artikel 7.1][ref1], ten minste eenmaal per jaar overleg
      met de gebiedsbesturen, gezamenlijk dan wel afzonderlijk.


      [ref1]: https://wetten.overheid.nl/BWBR0014548#Artikel7
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0014548
        artikel: '7'
  - number: 9.2.2
    text: |-
      De gebiedsbesturen kunnen agendapunten voorstellen voor het overleg als bedoeld in het vorige lid. De agenda wordt,
      na overleg met de voorzitter van het betrokken gebiedsbestuur dan wel van de betrokken gebiedsbesturen, vastgesteld
      door het Algemeen Bestuur.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel9.2
  - number: 10.1.1
    text: |-
      Het Algemeen Bestuur stelt ter nadere regeling van het bepaalde in de [Algemene wet bestuursrecht][ref1]
      procedurevoorschriften op voor bezwaar en administratief beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel10.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 11.1.1
    text: |-
      De vergaderingen van het Algemeen Bestuur, de gebiedsbesturen en de commissies zijn niet openbaar, tenzij het
      betrokken orgaan anders besluit.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel11.1
  - number: 11.1.2
    text: |-
      Over het besprokene in de vergaderingen, als bedoeld in het vorige lid, wordt geen informatie verstrekt indien en
      voorzover deze betrekking heeft op de besluitvorming over het verstrekken van concrete subsidies.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel11.1
  - number: 12.1.1
    text: Het Reglement NWO 1998 wordt ingetrokken op het tijdstip van inwerkingtreding van het Reglement NWO 2002.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel12.1
  - number: 12.2.1
    text: |-
      In geval bevoegdheden van bestaande NWO-organen worden gemandateerd aan een orgaan, dat niet past binnen de
      opsomming van [artikel 2.1][ref1] van dit reglement, maar wél gedeeltelijk past binnen de NWO-organisatie, vermeldt
      het tweede artikellid: - de namen van de betrokken organen;
        - waar van toepassing, de naam van de organisatie waarvan de mandans deel uitmaakt;
        - het document, dat het mandaat bevat.


      [ref1]: https://wetten.overheid.nl/BWBR0014548#Artikel2
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel12.2
    references:
      - id: ref1
        bwb_id: BWBR0014548
        artikel: '2'
  - number: 12.2.2
    text: |-
      Een orgaan als bedoeld in het eerste lid, is: De organisatie ZonMw, voortgekomen uit een integratie tussen het
      onder de Minister van Volksgezondheid, Welzijn en Sport ressorterende zelfstandige bestuursorgaan ZON en het
      Gebiedsbestuur Medische Wetenschappen van NWO, tesamen vormend het bestuursorgaan ZonMw. Het desbetreffend mandaat
      is opgenomen in de Samenwerkingsovereenkomst tussen ZON en NWO van mei 2001.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel12.2
  - number: 12.3.1
    text: |-
      Het Algemeen Bestuur voert met het oog op een goede uitvoering van het reglement en de totstandkoming van een
      doelmatige organisatiestructuur overleg met de daarvoor in aanmerking komende organen en instanties. Onverminderd
      hetgeen overigens bij de [wet][ref1] of dit reglement is bepaald, maakt het Algemeen Bestuur waar nodig afspraken
      met betrekking tot het vorenstaande.


      [ref1]: https://wetten.overheid.nl/BWBR0004191
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel12.3
    references:
      - id: ref1
        bwb_id: BWBR0004191
  - number: 12.3.2
    text: |-
      Gemaakte afspraken als bedoeld in het eerste lid worden, per orgaan/instantie, aan dit reglement toegevoegd, echter
      zonder dat deze afspraken daarvan deel uitmaken.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel12.3
  - number: 12.4.1
    text: |-
      Op het moment van inwerkingtreding van dit reglement zijn onderzoeksorganisaties als bedoeld in
      [artikel 4.1, eerste lid, onder a][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0014548#Artikel4
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel12.4
    references:
      - id: ref1
        bwb_id: BWBR0014548
        artikel: '4'
  - number: 12.4.1.a
    text: |-
      de Stichting Nederlandse Wetenschappelijke Onderzoek Instituten (NWO-I), statutair gevestigd te Utrecht met de
      daaronder ressorterende onderzoeksinstituten AMOLF, NIKHEF en Rijnhuizen;
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel12.4
  - number: 12.4.1.b
    text: |-
      de Stichting Centrum voor Wiskunde en Informatica (CWI), statutair gevestigd te Amsterdam met het daaronder
      ressorterende onderzoeksinstituut van gelijke naam;
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel12.4
  - number: 12.4.1.c
    text: |-
      de Stichting Astronomisch Onderzoek in Nederland (ASTRON), statutair gevestigd te Dwingeloo met het daaronder
      ressorterende onderzoeksinstituut van gelijke naam;
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel12.4
  - number: 12.4.1.d
    text: |-
      de Stichting Ruimteonderzoek Nederland (SRON), statutair gevestigd te 's-Gravenhage met het daaronder ressorterende
      onderzoeksinstituut van gelijke naam;
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel12.4
  - number: 12.4.1.e
    text: |-
      de Stichting Studiecentrum Criminaliteit en Rechtshandhaving (NSCR), statutair gevestigd te 's-Gravenhage met het
      daaronder ressorterende onderzoeksinstituut van gelijke naam;
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel12.4
  - number: 12.4.1.f
    text: |-
      de stichting Koninklijk Nederlands Instituut voor Onderzoek der Zee (NIOZ), statutair gevestigd te Texel met het
      daaronder ressorterende onderzoeksinstituut van gelijke naam.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel12.4
  - number: 12.5.1
    text: |-
      Dit reglement kan worden aangehaald als Reglement NWO 2002 en treedt in werking op de eerste dag na publikatie in
      de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0014548/2017-02-02#Artikel12.5
