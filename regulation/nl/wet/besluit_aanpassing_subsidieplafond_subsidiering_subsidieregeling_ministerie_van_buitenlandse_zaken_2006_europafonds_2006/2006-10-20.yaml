articles:
  - number: I
    text: |-
      Subsidieverlening op grond van het [Subsidiebesluit Ministerie van Buitenlandse Zaken][ref1] en de
      [artikelen 9.3][ref2] en [9.4 van de Subsidieregeling Ministerie van Buitenlandse Zaken 2006][ref3]
      in het kader van het Europafonds geschiedt tot en met 31 december 2006 met inachtneming van het
      __REF003___________________________________________________________________________________________________________
      ____________________________________________, zoals luidend voor inwerkingtreding van de
      [Subsidieregeling Ministerie van Buitenlandse Zaken 2006][ref5], en het [Besluit van 9 maart 2006][ref6], nr. DVL
      0305/2006, met dien verstande dat:

      a. in [artikel 4, eerste volzin][ref7], in plaats van het vermelde bedrag geldt: € 1.145.666,03;

      b. in [artikel 5, eerste volzin][ref8], in plaats van het vermelde bedrag geldt: € 1.354.333,97.


