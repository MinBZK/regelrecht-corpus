      1 In afwijking van [artikel 227 lid 3][ref1] kan het bestuur bepalen dat aandeelhouders geen fysieke toegang hebben
      tot de algemene vergadering, onder de volgende voorwaarden:

      a. de algemene vergadering is langs elektronische weg voor aandeelhouders te volgen; en

      b. de aandeelhouders zijn tot uiterlijk 72 uur voorafgaande aan de vergadering in de gelegenheid gesteld om
      schriftelijk of elektronisch vragen te stellen over de onderwerpen die bij de oproeping zijn vermeld. Wordt een
      besluit in de zin van [artikel 17 lid 2][ref2] van deze wet genomen binnen vijf dagen voorafgaand aan de datum van
      de vergadering, dan is de hiervoor bedoelde termijn 36 uur.

      2 De in lid 1 onder b bedoelde vragen worden uiterlijk tijdens de vergadering, al dan niet thematisch, beantwoord
      en deze antwoorden worden op de website van de vennootschap geplaatst of via een elektronisch communicatiemiddel
      toegankelijk gemaakt voor de aandeelhouders.

      3 Het bestuur spant zich ervoor in dat tijdens de vergadering langs elektronische weg of anderszins nadere vragen
      kunnen worden gesteld, tenzij dit in het licht van de omstandigheden van dat moment in redelijkheid niet kan
      worden gevergd. De voorzitter van de vergadering kan een en ander nader bepalen in het belang van de orde van de
      vergadering.

      4 Enige afwijking van hetgeen is bepaald in de leden 2 en 3 heeft geen gevolgen voor de rechtsgeldigheid van de
      besluitvorming die in de vergadering heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel227
      [ref2]: https://wetten.overheid.nl/BWBR0043413#Artikel17
    url: https://wetten.overheid.nl/BWBR0043413/2020-12-17#Artikel18
