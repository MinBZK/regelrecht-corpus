        afdeling: '3.4'
  - number: '2'
    text: |-
      1 Indien in verband met de uitbraak van COVID-19 in burgerlijke en bestuursrechtelijke gerechtelijke procedures
      het houden van een fysieke zitting niet mogelijk is, kan de mondelinge behandeling plaatsvinden door middel van een
      tweezijdig elektronisch communicatiemiddel.

      2 In afwijking van [artikel 82, tweede lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1] kunnen gedaagden
      uiterlijk op de eerste roldatum uitsluitend schriftelijk of door middel van een elektronisch communicatiemiddel
      kenbaar maken dat zij mondeling of schriftelijk een conclusie van antwoord willen nemen.

      3 In afwijking van [artikel 111, tweede lid, onder g, van het Wetboek van Burgerlijke Rechtsvordering][ref2], wordt
      de in het tweede lid genoemde wijze van antwoorden niet vermeld in het exploot van dagvaarding, maar in een brief,
      die bij het exploot van dagvaarding is gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel111
