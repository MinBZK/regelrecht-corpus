  - number: '19'
    text: |-
      Voor zover de statuten zulks niet bepalen, kan, in afwijking van [artikel 227a lid 1][ref1], het bestuur bepalen
      dat iedere aandeelhouder bevoegd is om, in persoon of bij een schriftelijk gevolmachtigde, langs elektronische weg
      aan de algemene vergadering deel te nemen, daarin het woord te voeren en het stemrecht uit te oefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel227a
    url: https://wetten.overheid.nl/BWBR0043413/2020-12-17#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 227a
  - number: '20'
    text: |-
      Voor zover de statuten zulks niet bepalen, kan, in afwijking van [artikel 227b][ref1], het bestuur bepalen dat
      stemmen die voorafgaand aan de algemene vergadering langs elektronische weg worden uitgebracht, doch niet eerder
      dan op de dertigste dag voor die van de vergadering, gelijk worden gesteld met stemmen die ten tijde van de
      vergadering worden uitgebracht. Dit wordt bij de oproeping vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel227b
    url: https://wetten.overheid.nl/BWBR0043413/2020-12-17#Artikel20
    references:
