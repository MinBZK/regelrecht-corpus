preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in verband met de uitbraak van COVID-19 wenselijk is enkele
    spoedeisende tijdelijke voorzieningen te treffen op het terrein van het Ministerie van Justitie en Veiligheid;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0043413/2020-12-17#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Indien terstond intredende onaanvaardbare gevolgen in verband met de uitbraak van COVID-19 noodzaken tot de
      vaststelling van een algemene maatregel van bestuur of ministeriële regeling, blijven ten aanzien van die algemene
      maatregel van bestuur of ministeriële regeling wettelijke voorschriften buiten toepassing die ertoe strekken dat:

      a. over het ontwerp daarvan of het voornemen tot het treffen daarvan advies moet worden gevraagd of extern overleg
      moet worden gevoerd;

      b. van het ontwerp daarvan kennis moet worden gegeven;

      c. zij niet eerder in werking kunnen treden dan nadat sedert hun vaststelling of bekendmaking een bepaalde termijn
      is verstreken; of

      d. op de voorbereiding [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing is.

      2 Het eerste lid, aanhef en onderdeel a, is niet van toepassing op het horen van de Afdeling advisering van de Raad
      van State.

      3 Het eerste lid is niet van toepassing voor zover de toepassing daarvan strijdig is met enige
      internationaalrechtelijke verplichting.

      4 Indien toepassing wordt gegeven aan het eerste lid, doet Onze Minister die het aangaat daarvan zo spoedig
      mogelijk gemotiveerd mededeling aan beide Kamers van de Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0043413/2020-12-17#Artikel1
    references:
