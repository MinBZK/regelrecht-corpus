    text: |-
      1 Onze Minister voor Rechtsbescherming kan de termijnen bepaald in [artikel 6:3:1, eerste lid][ref1], en
      [artikel 6:3:8 van het Wetboek van Strafvordering][ref2] verlengen met een periode van ten hoogste twaalf maanden.

      2 Onze Minister voor Rechtsbescherming kan een termijn, gesteld krachtens
      [artikel 6:6:23, tweede lid, van het Wetboek van Strafvordering][ref3] of
      [artikel 22f, derde lid, (oud) van het Wetboek van Strafrecht][ref4], verlengen met een periode van ten hoogste
      twaalf maanden, voor zover de rechter die termijn heeft gesteld vóór 16 maart 2020.

      3 Onze Minister voor Rechtsbescherming stelt de betrokkene zo spoedig mogelijk op de hoogte van een beslissing tot
      verlenging van de termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel631
