        bwb_id: BWBR0003045
  - number: '6'
    text: |-
      1 In afwijking van [artikel 38 lid 1][ref1] kan het bestuur bepalen dat leden geen fysieke toegang hebben tot de
      algemene vergadering, onder de volgende voorwaarden:

      a. de algemene vergadering is langs elektronisch weg voor leden te volgen; en

      b. de leden zijn tot uiterlijk 72 uur voorafgaand aan de vergadering in de gelegenheid gesteld om schriftelijk of
      elektronisch vragen te stellen over de onderwerpen die bij de oproeping zijn vermeld.

      2 De in lid 1 onder b bedoelde vragen worden uiterlijk tijdens de vergadering, al dan niet thematisch, beantwoord
      en deze antwoorden worden op de website van de vereniging geplaatst of via een elektronisch communicatiemiddel
      toegankelijk gemaakt voor de leden.

      3 Het bestuur spant zich ervoor in dat tijdens de vergadering langs elektronische weg of anderszins nadere vragen
      kunnen worden gesteld, tenzij dit in het licht van de omstandigheden van dat moment in redelijkheid niet kan
      worden gevergd. De voorzitter van de vergadering kan een en ander nader bepalen in het belang van de orde van de
      vergadering.

      4 Enige afwijking van de leden 2 en 3 heeft geen gevolgen voor de rechtsgeldigheid van de besluitvorming die in de
      vergadering heeft plaatsgevonden.

      5 Voor zover de statuten zulks niet bepalen, kan, in aanvulling op [artikel 38 lid 6][ref2], het bestuur bepalen
      dat het stemrecht slechts kan worden uitgeoefend door middel van een elektronisch communicatiemiddel.

      6 Voor zover de statuten zulks niet bepalen, kan, in aanvulling op [artikel 38 lid 8][ref3], het bestuur bepalen
      dat stemmen die voorafgaand aan de algemene vergadering door middel van een elektronisch communicatiemiddel worden
      uitgebracht gelijk worden gesteld met stemmen die ten tijde van de vergadering worden uitgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel38
