      1 In aanvulling op [artikel 78a van het Wetboek van Strafrecht][ref1] en
      [artikel 131a van het Wetboek van Strafvordering][ref2] kan, indien dit noodzakelijk is in verband met de uitbraak
      van COVID-19, voor het horen, verhoren of ondervragen van personen in plaats van videoconferentie waarbij een
      directe beeld- en geluidsverbinding tot stand komt, gebruik worden gemaakt van een ander tweezijdig elektronisch
      communicatiemiddel.

      2 Tenzij sprake is van uiterste noodzaak, is het eerste lid niet van toepassing:

      a. ten aanzien van de verdachte die wordt voorgeleid voor de rechter-commissaris in verband met de
      inbewaringstelling;

      b. ten aanzien van de verdachte die wordt gehoord bij de behandeling van een vordering van het openbaar ministerie
      tot gevangenhouding of gevangenneming of tot de verlenging daarvan.

      3 In geval in verband met de uitbraak van COVID-19 gebruik wordt gemaakt van een tweezijdig elektronisch
      communicatiemiddel blijft [hoofdstuk II van het Besluit videoconferentie][ref3] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel78a
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel131a
      [ref3]: https://wetten.overheid.nl/BWBR0019836#HoofdstukII
