      1 Indien partijen bij een akte en eventuele andere personen niet in persoon bij de notaris kunnen
      verschijnen en voor het verlijden van de akte een onderhandse volmacht niet volstaat, kan de notaris,
      in afwijking van [artikel 102 van Boek 4 van het Burgerlijk Wetboek][ref1], voor de toepassing van
      [artikel 43, vierde lid, van de Wet op het notarisambt][ref2], de akte verlijden met gebruikmaking van tweezijdige
      audiovisuele communicatiemiddelen. Hiervan maakt de notaris melding in de akte.

      2 Een audiovisueel communicatiemiddel als bedoeld in het eerste lid voldoet aan de eis dat het de notaris in staat
      stelt de identiteit van partijen bij de akte of door hen gevolmachtigde personen en eventueel andere personen vast
      te stellen, en dat deze personen via dat communicatiemiddel direct met de notaris kunnen communiceren.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel102
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel43
