    text: |-
      1 In afwijking van [artikel 116][ref1] kan het bestuur bepalen dat een algemene vergadering wordt gehouden die
      uitsluitend toegankelijk is langs elektronische weg, onder de voorwaarden bedoeld in [artikel 11][ref2] van deze
      wet. Dit wordt bij de oproeping, bedoeld in [artikel 113][ref3], vermeld.

      2 Indien de oproeping reeds is uitgegaan, kan het bestuur tot uiterlijk 48 uur voor het tijdstip van de algemene
      vergadering, de wijze van vergaderen wijzigen in een vergadering als bedoeld in het eerste lid dan wel de plaats
      van de vergadering kan wijzigen. Dit wordt aan de aandeelhouders kenbaar gemaakt op de wijze zoals voorgeschreven
      in [artikel 113][ref4].


