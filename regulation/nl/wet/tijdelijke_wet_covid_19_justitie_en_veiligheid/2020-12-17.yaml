  - number: 2a
    text: |-
      Indien in verband met de uitbraak van COVID-19 in penitentiaire beklag- en beroepsprocedures
      het houden van een fysieke zitting niet mogelijk is, kan het horen van de klager en de
      directeur als bedoeld in de in de [artikelen 64, eerste lid][ref1], [69, vijfde lid][ref2],
      [73, vierde lid van de Penitentiaire beginselenwet][ref3], de [artikelen 61, eerste lid][ref4],
      [67, vijfde lid][ref5], [69, vierde lid van de Beginselenwet verpleging ter beschikking gestelden][ref6]
      en de [artikelen 69, eerste lid][ref7], [74, vijfde lid][ref8], en
      [78, vierde lid, van de Beginselenwet justitiële jeugdinrichtingen][ref9] plaatsvinden door middel van een
      tweezijdig elektronisch communicatiemiddel.


