  - number: '5'
    text: |-
      1 Met het oog op de gevolgen van het houden van fysieke bijeenkomsten in verband met de uitbraak van
      COVID-19, kan op de aangegeven wijze worden afgeweken van de in deze paragraaf genoemde bepalingen in
      [Boek 2 van het Burgerlijk Wetboek][ref1].

      2 De artikelen in deze paragraaf verwijzen naar [Boek 2 van het Burgerlijk Wetboek][ref2], tenzij anders vermeld.

      3 Waar in deze paragraaf wordt afgeweken ten behoeve van leden of aandeelhouders, worden daaronder ook andere
      vergadergerechtigden begrepen.

      4 Waar in deze paragraaf wordt afgeweken van bepalingen in [Boek 2 van het Burgerlijk Wetboek][ref3], worden
      daaronder ook statutaire bepalingen met dezelfde inhoud begrepen. Statutaire bepalingen aangaande het fysiek
      bijeenkomen van het bestuur, de raad van commissarissen en de algemene vergadering en statutaire bepalingen die de
      uitoefening van in deze paragraaf aan het bestuur toegekende bevoegdheden beperken of aan de goedkeuring van een
      ander orgaan of een derde onderwerpen, zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045
      [ref3]: https://wetten.overheid.nl/BWBR0003045
