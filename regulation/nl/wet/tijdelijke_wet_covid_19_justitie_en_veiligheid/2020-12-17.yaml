      1 Indien in strafzaken het houden van een fysieke zitting in verband met de uitbraak van COVID-19 niet mogelijk is,
      kan de mondelinge behandeling plaatsvinden door middel van een tweezijdig elektronisch communicatiemiddel.

      2 Het eerste lid is niet van toepassing op een zitting indien het betreft:

      a. de behandeling van een vordering van het openbaar ministerie tot gevangenhouding of gevangenneming of tot de
      verlenging daarvan; of

      b. de inhoudelijke behandeling van de strafzaak ter terechtzitting.
    url: https://wetten.overheid.nl/BWBR0043413/2020-12-17#Artikel28
