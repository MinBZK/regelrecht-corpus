        bwb_id: BWBR0003045
        artikel: 227b
  - number: '21'
    text: |-
      In aanvulling op [artikel 228 lid 1][ref1] kan het bestuur bepalen dat het stemrecht slechts kan worden uitgeoefend
      langs elektronische weg. Dit wordt bij de oproeping of bij de wijziging van de wijze van vergaderen vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel228
