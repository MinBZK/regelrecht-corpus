      bestuur worden verlengd met ten hoogste vier maanden. In dat geval heeft het volgens de statuten bevoegde orgaan,
      voor zover dat een ander orgaan dan het bestuur is, geen bevoegdheid tot verlenging.

      2 In aanvulling op [artikel 300][ref2] is [artikel 6][ref3] van deze wet, alsmede [artikel 38 lid 7][ref4], van
      overeenkomstige toepassing op een vergadering van het orgaan, bedoeld in artikel 300 lid 3.


