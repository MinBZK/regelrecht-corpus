      1 Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de verschillende
      paragrafen, artikelen of onderdelen daarvan verschillend kan worden vastgesteld,

      2 In het koninklijk besluit kan worden bepaald dat paragrafen, artikelen of onderdelen van deze wet, met
      uitzondering van de [paragrafen 1][ref1], [6][ref2], [10][ref3] en [11][ref4] alsmede de [artikelen 15][ref5] en
      [22][ref6], terugwerken tot en met 16 maart 2020.

      3 Deze wet vervalt op 1 september 2020. Het tijdstip waarop deze wet vervalt kan bij koninklijk besluit worden
      bepaald op een ander tijdstip, met dien verstande dat dit tijdstip steeds ten hoogste twee maanden na het tijdstip
      ligt waarop de wet zou vervallen.

      4 De voordracht voor een krachtens het derde lid vast te stellen koninklijk besluit wordt niet eerder gedaan dan
      een week nadat het ontwerp aan beide Kamers van de Staten-Generaal is overgelegd.

      5 Bij koninklijk besluit kan voor de verschillende paragrafen, artikelen of onderdelen van deze wet een tijdstip
      worden aangewezen waarop deze paragrafen, artikelen of onderdelen vervallen, dat ligt vóór het tijdstip bedoeld in
      het derde lid.

      6 In afwijking van het derde lid:

      a. vervallen de [artikelen 15][ref7] en [22][ref8] met ingang van 1 september 2023;

      b. vervallen de [artikelen 33][ref9] en [34][ref10] met ingang van de eerste dag van de derde kalendermaand na
      inwerkingtreding van de Wet tot wijziging van de Tijdelijke wet COVID-19 Justitie en Veiligheid in verband met het
      verlengen van de geldingsduur van de voorzieningen in de artikelen 33 en 34. Het tijdstip waarop deze artikelen
      vervallen kan bij koninklijk besluit worden bepaald op een ander tijdstip, met dien verstande dat dit tijdstip
      steeds ten hoogste twee maanden na het tijdstip ligt waarop deze artikelen zouden vervallen. Het vierde lid is van
      overeenkomstige toepassing op dit koninklijk besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0043413#Paragraaf1
      [ref2]: https://wetten.overheid.nl/BWBR0043413#Paragraaf6
      [ref3]: https://wetten.overheid.nl/BWBR0043413#Paragraaf10
      [ref4]: https://wetten.overheid.nl/BWBR0043413#Paragraaf11
