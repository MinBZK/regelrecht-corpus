      1 Alvorens de Afdeling bestuursrechtspraak van de Raad van State overgaat tot het niet-ontvankelijk verklaren van
      het hoger beroep op grond van [artikel 85, derde lid, van de Vreemdelingenwet 2000][ref1], stelt zij de indiener
      in de gelegenheid het verzuim te herstellen binnen een door haar te stellen termijn, indien niet is voldaan aan
      artikel 85, eerste lid of tweede lid, van de Vreemdelingenwet 2000.

      2 Het eerste lid is niet van toepassing indien het hoger beroep is ingesteld door Onze Minister van Justitie en
      Veiligheid.


