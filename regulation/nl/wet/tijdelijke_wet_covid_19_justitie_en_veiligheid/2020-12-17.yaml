      De voorzitter van het college van afgevaardigden, bedoeld in [artikel 19 van de Advocatenwet][ref1],
      of de voorzitter van de jaarlijkse vergadering van de orde van advocaten, bedoeld in
      [artikel 22 van de Advocatenwet][ref2], kan bepalen dat leden en anderen geen toegang hebben tot vergaderingen
      van het college van afgevaardigden of de jaarlijkse vergadering van de orde van advocaten. In dat geval draagt
      de voorzitter er zorg voor dat de leden van het college van afgevaardigden dan wel de leden van de jaarlijkse
      vergadering van de orde van advocaten door middel van een tweezijdig elektronisch communicatiemiddel aan de
      opgeroepen vergadering kunnen deelnemen, daarin het woord kunnen voeren en het stemrecht kunnen uitoefenen. Daartoe
      is vereist dat de leden via het elektronisch communicatiemiddel kunnen worden geïdentificeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel22
