  - number: '3'
    text: |-
      Beschikkingen in zaken van verlenging van een ondertoezichtstelling en van verlenging van de machtiging van
      de gecertificeerde instelling, bedoeld in [artikel 1.1 van de Jeugdwet][ref1], om een minderjarige uit huis te
      plaatsen niet zijnde een machtiging als bedoeld in [hoofdstuk 6 van de Jeugdwet][ref2], kunnen aanstonds worden
      gegeven indien mondelinge behandeling ook met toepassing van een tweezijdig elektronisch communicatiemiddel
      onmogelijk blijkt. Een verlenging is in dat geval mogelijk voor de duur van maximaal drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Hoofdstuk6
