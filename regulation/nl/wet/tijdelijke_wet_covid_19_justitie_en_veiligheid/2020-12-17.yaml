      1 Het bestuur van de Nederlandse beroepsorganisatie van accountants kan bepalen dat leden geen toegang hebben tot
      de ledenvergadering, bedoeld in [paragraaf 2.2 van de Wet op het accountantsberoep][ref1]. In dat geval draagt het
      bestuur er zorg voor dat de leden door middel van een tweezijdig elektronisch communicatiemiddel aan de opgeroepen
      ledenvergadering kunnen deelnemen, daarin het woord kunnen voeren en het stemrecht kunnen uitoefenen. Daartoe is
      vereist dat de leden via het elektronisch communicatiemiddel kunnen worden geïdentificeerd.

      2 In een geval als bedoeld in het eerste lid:

      a. wordt in [artikel 7, tweede lid, van de Wet op het accountantsberoep][ref2] voor «aanwezige leden» gelezen «aan
      de vergadering deelnemende leden» en wordt in artikel 7, derde lid, van de Wet op het accountantsberoep voor «een
      besloten vergadering bijwonen» gelezen «aan een besloten vergadering deelnemen»;

      b. wordt in [artikel 9, eerste lid, van de Wet op het accountantsberoep][ref3] voor «de ter vergadering
      aanwezige of vertegenwoordigde stemgerechtigden» gelezen «de aan de vergadering deelnemende of in de vergadering
      vertegenwoordigde stemgerechtigden»;

      c. kan de volmachtverlening, bedoeld in [artikel 10, tweede lid, van de Wet op het accountantsberoep][ref4],
      plaatsvinden op elektronische wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Paragraaf2.2
      [ref2]: https://wetten.overheid.nl/BWBR0032573#Artikel7
