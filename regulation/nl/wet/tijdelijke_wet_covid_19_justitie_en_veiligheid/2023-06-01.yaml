    text: |-
      In afwijking van [artikel 138 lid 2][ref1] wordt een verzuim van de verplichting uit [artikel 394][ref2] tot
      openbaarmaking van de jaarrekening die betrekking heeft op het meest recente afgesloten boekjaar niet in aanmerking
      genomen, indien dat te wijten is aan de gevolgen van de uitbraak van COVID-19.


