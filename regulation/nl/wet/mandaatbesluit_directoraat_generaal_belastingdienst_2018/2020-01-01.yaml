  - number: '9'
    text: |-
      1 Categoriemanagement: De Belastingdienst is belast met het inkopen van categorieën Rijksbreed. Het eigenaarschap
      van categorieën is belegd bij de DG. De DG is bevoegd te beslissen op het aangaan van financiële verplichtingen
      hieruit voortvloeiend.

      2 Raamovereenkomsten/overige verplichtingen: de budgethouder is bevoegd tot het aangaan van raamovereenkomsten
      zoals bedoeld in [artikel 1.1 van de Aanbestedingswet 2012][ref1], alsmede tot het aangaan van andere financiële
      verplichtingen volgend uit de aanbestedingsprocedures zoals bedoeld in de [Aanbestedingswet 2012][ref2]. Het
      gunningsbesluit wordt door de budgethouder vastgesteld waarbij tevens machtiging wordt verleend aan de functionaris
      van SSO Centrum voor Facilitaire Dienstverlening conform de bevoegdheden genoemd in het derde, vierde en vijfde
      lid.

      3 Overeenkomsten voortkomend uit een Europese aanbesteding (ongeacht het bedrag) worden ondertekend door directeur
      SSO Centrum voor Facilitaire Dienstverlening, met uitzondering van diegenen die voortkomen uit Categoriemanagement.
      Het gunningsbesluit wordt door de budgethouder vastgesteld waarbij tevens machtiging wordt verleend aan de
      functionaris van SSO Centrum voor Facilitaire Dienstverlening.

      4 Overeenkomsten uit onderhandse aanbestedingen, mini-competities en contractmutaties worden ondertekend door het
      afdelingshoofd of de teammanager Inkoopuitvoeringscentrum (IUC) na akkoord van de budgethouder. Een teammanager
      is bevoegd te ondertekenen tot het bedrag van een Europese aanbesteding. Overeenkomsten uit onderhandse
      aanbestedingen, mini-competities en contractmutaties met een bedrag hoger dan het bedrag van de Europese
      aanbesteding worden ondertekent door het afdelingshoofd IUC.

      5 Procesgerelateerde stukken worden door het afdelingshoofd of de teammanager IUC getekend.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0032203
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '1.1'
      - id: ref2
        bwb_id: BWBR0032203
  - number: '10'
    text: |-
      Het aangaan van verplichtingen tot het leveren van dienstverlening door het DGBD onder de 1.000.000 euro –
      materieel – aan derden zijn voorbehouden aan de algemeen directeur directie Informatievoorziening en directeur
      SSO Facilitaire Dienstverlening, na goedkeuring van de controller van de concerndirectie Control & Financiën.
      Het aangaan van verplichtingen tot het leveren van dienstverlening door het DGBD boven de 1.000.000 euro, is
      voorbehouden aan de algemene leiding van het DGBD.
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel10
  - number: '11'
    text: |-
      Aan de DG is voorbehouden te beslissen over aanbestedingsprocedures, indien een andere dan de procedures als
      bedoeld in de [hoofdstukken 1.2][ref1] en [2.1 van de Aanbestedingswet 2012][ref2] wordt gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk1.2
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk2.1
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel11
