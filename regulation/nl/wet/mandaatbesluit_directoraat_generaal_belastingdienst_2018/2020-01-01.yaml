  - number: '15'
    text: |-
      Met inachtneming van hetgeen bepaald in voorgaande artikelen en in
      [hoofdstuk 5 van het Organisatie- en mandaatbesluit Ministerie van Financiën 2015][ref1] is de pDG bevoegd om
      ten aanzien van de directies als bedoeld in [artikel 7 lid 1][ref2] van dit besluit namens de Staatssecretaris de
      navolgende rechtspositionele handelingen en besluiten te verrichten of te nemen:

      1. Te beslissen op bezwaren, voor zover die betrekking hebben op handelingen of besluiten waarbij een ambtenaar als
      bedoeld in [artikel 1 van de Ambtenarenwet][ref3] als zodanig belanghebbende is;

      2. Het beslissen tot groepsgewijze werving en selectie voor (groeps)functies;

      3. Het vaststellen van de organisatie op afdelings- en teamniveau, en hiermee samenhangend het besluiten tot
      reorganisaties van deze onderdelen. Het vaststellen van de organisatie en hiermee samenhangende besluiten tot
      reorganisatie op het niveau van afdelingen vindt plaats na instemming van de DG.


      [ref1]: https://wetten.overheid.nl/BWBR0037135#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0041669#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0001947#Artikel1
