    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel19
  - number: '19.16'
    text: Het aanwijzen van bedrijfshulpverleners;
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel19
  - number: '19.17'
    text: Het vaststellen van de personeelsbeoordeling als beoordelingsautoriteit;
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel19
  - number: '19.18'
    text: |-
      Het optreden als beoordelingsautoriteit voor zover dit betrekking heeft op het afwegen van ingediende bedenkingen,
      het wijzigen van de beoordeling na bedenkingen, en het vaststellen van de beoordeling;
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel19
