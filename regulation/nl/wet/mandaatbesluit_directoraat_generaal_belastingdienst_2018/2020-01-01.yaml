preamble:
  text: |-
    Gelet op artikel 10:3 van de Algemene wet bestuursrecht;

    Gelet op artikel 4, 10, 11, 12 en 14, 19, 20, 20a, 20c en 20d van het Organisatie- en mandaatbesluit Ministerie van
    Financiën 2015; en In overeenstemming met de secretaris-generaal;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling en de daarop berustende bepalingen wordt verstaan onder:

      a. *het DGBD:* het directoraat-generaal Belastingdienst;

      b. *de directeur-generaal Belastingdienst:* de DG;

      c. *de plaatsvervangend directeur-generaal Belastingdienst:* de pDG;

      d. *algemene leiding DGBD:* de DG en de plaatsvervangend directeur-generaal (pDG); en

      e. *directeuren van de topstructuur DGBD:* algemeen directeur, (hoofd)directeur van concerndirecties, shared
      service organisaties (SSO) of corporate diensten.
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel1
  - number: '2'
    text: |-
      Voor de toepassing van dit besluit en de daarop berustende bepalingen wordt met de verlening van mandaat
      gelijkgesteld de verlening van:

      a) *volmacht:* de bevoegdheid om namens de Minister voor de Staat privaatrechtelijke rechtshandelingen te
      verrichten; en

      b) *machtiging:* de bevoegdheid om namens de Minister handelingen te verrichten die noch een besluit noch een
      privaatrechtelijke rechtshandeling zijn.
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel2
  - number: '3'
    text: |-
      1 Bij tijdelijke afwezigheid of verhindering van de gemandateerde worden diens taken volledig uitgeoefend door een
      aangewezen plaatsvervanger. De aanwijzing van een plaatsvervanger geschiedt door de mandaatgever met inachtneming
      van het [Organisatiebesluit directoraat-generaal Belastingdienst 2018][ref1] en in overeenstemming met de algemene
      leiding DGBD ten aanzien van de directeuren van de topstructuur DGBD.

      De aanwijzing van een plaatsvervanger anders dan plaatsvervanger voor de directeuren van de topstructuur DGBD,
      geschiedt door de directeur van de topstructuur DGBD van het betreffende organisatieonderdeel met inachtneming van
      het [Organisatiebesluit directoraat-generaal Belastingdienst 2018][ref2].

      2 Bij gelijktijdige tijdelijke afwezigheid of verhindering van de gemandateerde en diens plaatsvervanger worden de
      taken volledig uitgeoefend door de naasthogere leidinggevende functionaris.


      [ref1]: https://wetten.overheid.nl/BWBR0041673
      [ref2]: https://wetten.overheid.nl/BWBR0041673
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0041673
      - id: ref2
        bwb_id: BWBR0041673
  - number: '4'
    text: |-
      Indien beslissingsbevoegde functionarissen zoals bedoeld in dit besluit, in een onderdeel niet voorkomen behoren de
      bevoegdheden toe aan de naast hogere leidinggevende functionaris.
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel4
  - number: '5'
    text: |-
      Over vraagstukken die van politiek gevoelige of anderszins zwaarwegende aard zijn, treden mandaathouders in overleg
      met de algemene leiding van het DGBD, voordat van bevoegdheden gebruik wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel5
  - number: '6'
    text: |-
      De ondertekening van uitgaande stukken zal luiden als volgt:

      DE MINISTER VAN FINANCIËN, resp. DE STAATSSECRETARIS VAN FINANCIËN,

      namens deze,

      (handtekening)

      gevolgd door naam en functie van de (onder)gemandateerde functionaris.
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel6
  - number: '7'
    text: |-
      1 De pDG is (beheersmatig) verantwoordelijk voor de directies, genoemd in het organisatiebesluit
      opgenomen bijlagen A en K tot en met X, voor de samenhang tussen die directies en – met
      inachtneming van de hetgeen bepaald in de [artikelen 20][ref1], [20a][ref2], [20c][ref3] en
      [20d van het mandaatbesluit van het Ministerie van Financiën][ref4] – voor de bijbehorende bedrijfsvoering.

      2 De directeuren van de topstructuur DGBD hebben binnen het kader van de jaarcontracten en binnen eventueel door de
      Staatssecretaris of namens de Staatssecretaris door de algemene leiding van het ministerie of de algemene leiding
      van het DGBD gegeven richtlijnen mandaat ten aanzien van het nemen van besluiten en afdoen van stukken betreffende
      alle aangelegenheden die behoren tot hun werkterrein tenzij bij wet anders is bepaald of de aard van de bevoegdheid
      zich daartegen verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0037135#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0037135#Artikel20a
      [ref3]: https://wetten.overheid.nl/BWBR0037135#Artikel20c
      [ref4]: https://wetten.overheid.nl/BWBR0037135#Artikel20d
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel7
