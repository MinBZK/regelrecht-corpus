---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: mandaatbesluit_directoraat_generaal_belastingdienst_2018
regulatory_layer: WET
publication_date: '2020-05-12'
valid_from: '2020-01-01'
bwb_id: BWBR0041669
url: https://wetten.overheid.nl/BWBR0041669/2020-01-01
preamble:
  text: |-
    Gelet op artikel 10:3 van de Algemene wet bestuursrecht;

    Gelet op artikel 4, 10, 11, 12 en 14, 19, 20, 20a, 20c en 20d van het Organisatie- en mandaatbesluit Ministerie van
    Financiën 2015; en In overeenstemming met de secretaris-generaal;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel1
  - number: 1.a
    text: '*het DGBD:* het directoraat-generaal Belastingdienst;'
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel1
  - number: 1.b
    text: '*de directeur-generaal Belastingdienst:* de DG;'
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel1
  - number: 1.c
    text: '*de plaatsvervangend directeur-generaal Belastingdienst:* de pDG;'
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel1
  - number: 1.d
    text: '*algemene leiding DGBD:* de DG en de plaatsvervangend directeur-generaal (pDG); en'
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel1
  - number: 1.e
    text: |-
      *directeuren van de topstructuur DGBD:* algemeen directeur, (hoofd)directeur van concerndirecties, shared service
      organisaties (SSO) of corporate diensten.
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel1
  - number: '2'
    text: |-
      Voor de toepassing van dit besluit en de daarop berustende bepalingen wordt met de verlening van mandaat
      gelijkgesteld de verlening van:
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel2
  - number: 2.a)
    text: |-
      *volmacht:* de bevoegdheid om namens de Minister voor de Staat privaatrechtelijke rechtshandelingen te verrichten;
      en
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel2
  - number: 2.b)
    text: |-
      *machtiging:* de bevoegdheid om namens de Minister handelingen te verrichten die noch een besluit noch een
      privaatrechtelijke rechtshandeling zijn.
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel2
  - number: '3.1'
    text: |-
      Bij tijdelijke afwezigheid of verhindering van de gemandateerde worden diens taken volledig uitgeoefend door
      een aangewezen plaatsvervanger. De aanwijzing van een plaatsvervanger geschiedt door de mandaatgever met
      inachtneming van het [Organisatiebesluit directoraat-generaal Belastingdienst 2018][ref1] en in overeenstemming
      met de algemene leiding DGBD ten aanzien van de directeuren van de topstructuur DGBD. De aanwijzing van
      een plaatsvervanger anders dan plaatsvervanger voor de directeuren van de topstructuur DGBD, geschiedt door
      de directeur van de topstructuur DGBD van het betreffende organisatieonderdeel met inachtneming van het
      [Organisatiebesluit directoraat-generaal Belastingdienst 2018][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0041673
      [ref2]: https://wetten.overheid.nl/BWBR0041673
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0041673
      - id: ref2
        bwb_id: BWBR0041673
  - number: '3.2'
    text: |-
      Bij gelijktijdige tijdelijke afwezigheid of verhindering van de gemandateerde en diens plaatsvervanger worden de
      taken volledig uitgeoefend door de naasthogere leidinggevende functionaris.
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel3
  - number: '4'
    text: |-
      Indien beslissingsbevoegde functionarissen zoals bedoeld in dit besluit, in een onderdeel niet voorkomen behoren de
      bevoegdheden toe aan de naast hogere leidinggevende functionaris.
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel4
  - number: '5'
    text: |-
      Over vraagstukken die van politiek gevoelige of anderszins zwaarwegende aard zijn, treden mandaathouders in overleg
      met de algemene leiding van het DGBD, voordat van bevoegdheden gebruik wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel5
  - number: '6'
    text: |-
      De ondertekening van uitgaande stukken zal luiden als volgt: DE MINISTER VAN FINANCIËN, resp. DE STAATSSECRETARIS
      VAN FINANCIËN, namens deze, (handtekening) gevolgd door naam en functie van de (onder)gemandateerde functionaris.
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel6
  - number: '7.1'
    text: |-
      De pDG is (beheersmatig) verantwoordelijk voor de directies, genoemd in het organisatiebesluit
      opgenomen bijlagen A en K tot en met X, voor de samenhang tussen die directies en – met
      inachtneming van de hetgeen bepaald in de [artikelen 20][ref1], [20a][ref2], [20c][ref3] en
      [20d van het mandaatbesluit van het Ministerie van Financiën][ref4] – voor de bijbehorende bedrijfsvoering.


      [ref1]: https://wetten.overheid.nl/BWBR0037135#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0037135#Artikel20a
      [ref3]: https://wetten.overheid.nl/BWBR0037135#Artikel20c
      [ref4]: https://wetten.overheid.nl/BWBR0037135#Artikel20d
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0037135
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0037135
        artikel: 20a
      - id: ref3
        bwb_id: BWBR0037135
        artikel: 20c
      - id: ref4
        bwb_id: BWBR0037135
        artikel: 20d
  - number: '7.2'
    text: |-
      De directeuren van de topstructuur DGBD hebben binnen het kader van de jaarcontracten en binnen eventueel door de
      Staatssecretaris of namens de Staatssecretaris door de algemene leiding van het ministerie of de algemene leiding
      van het DGBD gegeven richtlijnen mandaat ten aanzien van het nemen van besluiten en afdoen van stukken betreffende
      alle aangelegenheden die behoren tot hun werkterrein tenzij bij wet anders is bepaald of de aard van de bevoegdheid
      zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel7
  - number: '8.1'
    text: |-
      Conform het [Organisatie- en mandaatbesluit Ministerie van Financiën 2015][ref1], verleent de DG voor de
      in [artikel 11][ref2] en [12 van het voornoemde organisatie- en mandaatbesluit][ref3] genoemde bevoegdheden
      ondermandaat aan budgethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0037135
      [ref2]: https://wetten.overheid.nl/BWBR0037135#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0037135#Artikel12
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0037135
      - id: ref2
        bwb_id: BWBR0037135
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0037135
        artikel: '12'
  - number: '8.2'
    text: |-
      De directeuren van de topstructuur DGBD zoals genoemd in [artikel 7 lid 2][ref1] worden gemandateerd door de DG om
      financiële verplichtingen aan te gaan. In een ondermandaat wordt de omvang ervan aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0041669#Artikel7
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0041669
        artikel: '7'
        hoofdstuk: '2'
  - number: '8.3'
    text: |-
      De leidinggevende functionarissen, zoals genoemd in [bijlage 1][ref1], die ressorteren onder de directeuren
      behorende tot de topstructuur DGBD, worden gemandateerd, voor zover het binnen het eigen werkterrein betreft,
      financiële verplichtingen aan te gaan. Deze verplichtingen zijn beperkt tot de maximumbedragen als genoemd in
      bijlage 1. Daarnaast geldt de restrictie dat een budgethouder niet meer mag verplichten dan het beschikbare budget.


      [ref1]: https://wetten.overheid.nl/BWBR0041669
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0041669
  - number: '8.4'
    text: |-
      Verplichtingen van of boven de € 50.000,– exclusief BTW worden alleen aangegaan mits er goedkeuring is van de
      controller van de concerndirectie Control & Financiën.
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel8
  - number: '9.1'
    text: |-
      Categoriemanagement: De Belastingdienst is belast met het inkopen van categorieën Rijksbreed. Het eigenaarschap van
      categorieën is belegd bij de DG. De DG is bevoegd te beslissen op het aangaan van financiële verplichtingen hieruit
      voortvloeiend.
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel9
  - number: '9.2'
    text: |-
      Raamovereenkomsten/overige verplichtingen: de budgethouder is bevoegd tot het aangaan van raamovereenkomsten
      zoals bedoeld in [artikel 1.1 van de Aanbestedingswet 2012][ref1], alsmede tot het aangaan van andere financiële
      verplichtingen volgend uit de aanbestedingsprocedures zoals bedoeld in de [Aanbestedingswet 2012][ref2]. Het
      gunningsbesluit wordt door de budgethouder vastgesteld waarbij tevens machtiging wordt verleend aan de functionaris
      van SSO Centrum voor Facilitaire Dienstverlening conform de bevoegdheden genoemd in het derde, vierde en vijfde
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0032203
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0032203
  - number: '9.3'
    text: |-
      Overeenkomsten voortkomend uit een Europese aanbesteding (ongeacht het bedrag) worden ondertekend door directeur
      SSO Centrum voor Facilitaire Dienstverlening, met uitzondering van diegenen die voortkomen uit Categoriemanagement.
      Het gunningsbesluit wordt door de budgethouder vastgesteld waarbij tevens machtiging wordt verleend aan de
      functionaris van SSO Centrum voor Facilitaire Dienstverlening.
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel9
  - number: '9.4'
    text: |-
      Overeenkomsten uit onderhandse aanbestedingen, mini-competities en contractmutaties worden ondertekend door het
      afdelingshoofd of de teammanager Inkoopuitvoeringscentrum (IUC) na akkoord van de budgethouder. Een teammanager
      is bevoegd te ondertekenen tot het bedrag van een Europese aanbesteding. Overeenkomsten uit onderhandse
      aanbestedingen, mini-competities en contractmutaties met een bedrag hoger dan het bedrag van de Europese
      aanbesteding worden ondertekent door het afdelingshoofd IUC.
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel9
  - number: '9.5'
    text: Procesgerelateerde stukken worden door het afdelingshoofd of de teammanager IUC getekend.
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel9
  - number: '10'
    text: |-
      Het aangaan van verplichtingen tot het leveren van dienstverlening door het DGBD onder de 1.000.000 euro –
      materieel – aan derden zijn voorbehouden aan de algemeen directeur directie Informatievoorziening en directeur
      SSO Facilitaire Dienstverlening, na goedkeuring van de controller van de concerndirectie Control & Financiën.
      Het aangaan van verplichtingen tot het leveren van dienstverlening door het DGBD boven de 1.000.000 euro, is
      voorbehouden aan de algemene leiding van het DGBD.
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel10
  - number: '11'
    text: |-
      Aan de DG is voorbehouden te beslissen over aanbestedingsprocedures, indien een andere dan de procedures als
      bedoeld in de [hoofdstukken 1.2][ref1] en [2.1 van de Aanbestedingswet 2012][ref2] wordt gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk1.2
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk2.1
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0032203
        hoofdstuk: '1.2'
      - id: ref2
        bwb_id: BWBR0032203
        hoofdstuk: '2.1'
  - number: '12.1'
    text: |-
      Bij het nemen van besluiten, afdoen van stukken en ondertekenen van uitgaande brieven met betrekking tot de in
      [bijlage 2][ref1] opgenomen personeelsaangelegenheden is voorafgaand advies van de directeur SSO Organisatie &
      Personeel (O&P) of een door de directeur SSO O&P aan te wijzen afdelingshoofd, vereist, of is voorafgaand advies
      van de directeur DLSO vereist indien het de Douane betreft, of is voorafgaand advies van de directeur FIOD vereist
      indien het de FIOD betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0041669
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0041669
  - number: '12.2'
    text: |-
      Bij het nemen van beslissingen op bezwaar met betrekking tot personeelsaangelegenheden is voorafgaande goedkeuring
      door de directeur concerndirectie Organisatie & Personeel vereist.
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel12
  - number: '12.3'
    text: |-
      De functionaris die bevoegd is tot het aanstellen, benoemen en plaatsen in een bepaalde functie is ook bevoegd tot
      het verlenen van ontslag aan de in die functie aangestelde ambtenaar, tenzij deze bevoegdheid vanwege de grond voor
      het ontslag elders ligt.
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel12
  - number: '13'
    text: |-
      Onderdeel van deze regeling vormt een mandaatregister dat wordt gepubliceerd. Het mandaatregister bevat
      handtekeningen en parafen van de gemandateerde functionarissen zoals bedoeld in de [hoofdstukken 2][ref1] en
      [3][ref2] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0041669#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0041669#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0041669
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0041669
        hoofdstuk: '3'
  - number: '14'
    text: |-
      Met inachtneming van de [artikelen 19][ref1], [20][ref2], [20a][ref3], [20c][ref4] en
      [20d van het Organisatie- en mandaatbesluit Ministerie van Financiën 2015][ref5] is de algemene leiding van het
      DGBD bevoegd namens de Staatssecretaris ten aanzien van het personeel van het DGBD de navolgende rechtspositionele
      handelingen en besluiten te verrichten of te nemen:


      [ref1]: https://wetten.overheid.nl/BWBR0037135#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0037135#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0037135#Artikel20a
      [ref4]: https://wetten.overheid.nl/BWBR0037135#Artikel20c
      [ref5]: https://wetten.overheid.nl/BWBR0037135#Artikel20d
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0037135
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0037135
        artikel: '20'
      - id: ref3
        bwb_id: BWBR0037135
        artikel: 20a
      - id: ref4
        bwb_id: BWBR0037135
        artikel: 20c
      - id: ref5
        bwb_id: BWBR0037135
        artikel: 20d
  - number: '14.1'
    text: |-
      Tot het aanstellen, benoemen en plaatsen van ambtenaren met een bezoldiging van schaal 15 of hoger in functies met
      een lagere schaal dan de voor de ambtenaar tot dan toe geldende schaal;
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel14
  - number: '14.2'
    text: |-
      Het voordragen van functies die ten behoeve van het instellen van een veiligheidsonderzoek voor aanwijzing als
      vertrouwensfuncties in aanmerking komen;
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel14
  - number: '14.3'
    text: Het voeren van formele correspondentie met Hoge Colleges van Staat;
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel14
  - number: '14.4'
    text: Het beslissen tot directie overstijgende groepsgewijze werving en selectie voor (groeps)functies;
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel14
  - number: '14.5'
    text: Het afkondigen van een vacaturestop;
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel14
  - number: '14.6'
    text: Het aanwijzen van vertrouwenspersonen integriteit;
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel14
  - number: '14.7'
    text: |-
      Het beslissen over de toekenning van een stimuleringspremie op grond van [artikel 49tt ARAR][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49tt
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49tt
  - number: '14.8'
    text: |-
      Het beslissen over de afwijkingen bij de toepassing van het sociaal flankerend beleid op grond van
      [artikel 49aaa ARAR][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49aaa
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49aaa
  - number: '14.9'
    text: |-
      Het beslissen over het maken van een buitenlandse dienstreis, uitgezonderd de buitenlandse dienstreizen vanuit de
      directies Douane en FIOD;
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel14
  - number: '14.10'
    text: Het beslissen over privéverlenging van een buitenlandse dienstreis;
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel14
  - number: '14.11'
    text: Het nemen van besluiten ten aanzien van de vergoeding van representatiekosten;
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel14
  - number: '14.12'
    text: Het aanwijzen van brugdagen voor het DGBD; en
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel14
  - number: '14.13'
    text: |-
      Het beslissen ten aanzien van schadeloosstelling op grond van [artikel 69 ARAR][ref1] (vanaf € 5.000), inclusief
      besluitvorming over schadevergoeding die voortvloeit uit door de rechter vernietigde besluiten;


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel69
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '69'
  - number: '14.14'
    text: 'Het nemen van besluiten ten aanzien van ontslag:'
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel14
  - number: 14.14.a
    text: |-
      bij benoeming tot Minister of Staatssecretaris ([artikel 96c ARAR][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel96c
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 96c
  - number: 14.14.b
    text: |-
      van een herplaatste ambtenaar die wachtgeld genoot ([artikel 98a ARAR][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel98a
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 98a
  - number: 14.14.c
    text: |-
      van een ambtenaar voor wie, nadat hij een functie in een publiekrechtelijk college waarin hij is benoemd of
      verkozen dan wel de functie van substituut-ombudsman heeft vervuld en tijdelijk was ontheven van de waarneming van
      zijn ambt, geen passende functie in de dienst meer is te vinden ([artikel 96b, eerste en derde lid, ARAR][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel96b
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 96b
  - number: 14.14.d
    text: |-
      uit een vertrouwensfunctie om speciale redenen ([artikel 125e, tweede lid, AW][ref1]); en


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel125e
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: 125e
  - number: 14.14.e
    text: |-
      in verband met een veroordeling tot vrijheidsstraf wegens misdrijf ([artikel 98, eerste lid, letter e, ARAR][ref1]).


