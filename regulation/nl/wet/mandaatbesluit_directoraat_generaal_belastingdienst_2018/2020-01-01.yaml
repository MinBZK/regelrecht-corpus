      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0003860
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel20
