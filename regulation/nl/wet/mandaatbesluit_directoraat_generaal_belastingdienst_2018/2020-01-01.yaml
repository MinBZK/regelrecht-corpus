      Met inachtneming van hetgeen bepaald in voorgaande artikelen en in
      [hoofdstuk 5 van het Organisatie- en mandaatbesluit Ministerie van Financiën 2015][ref1] zijn de algemeen
      directeuren bevoegd de navolgende rechtspositionele handelingen en besluiten te verrichten of te nemen:

      1. Het vaststellen van de organisatie op afdelings- en teamniveau, en hiermee samenhangend het besluiten tot
      reorganisaties van deze onderdelen binnen de eigen directie. Het vaststellen van de organisatie en hiermee
      samenhangende besluiten tot reorganisatie op het niveau van afdelingen vindt plaats na instemming van de DG.

      2. Het beslissen tot groepsgewijze werving en selectie voor (groeps)functies;


