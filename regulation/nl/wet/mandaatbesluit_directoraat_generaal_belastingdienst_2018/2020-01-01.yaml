    text: |-
      ‘Het [Organisatie- en mandaatbesluit directoraat-generaal Belastingdienst 2016][ref1]’ wordt ingetrokken. De
      besluiten die op grond van ‘Het Organisatie- en mandaatbesluit directoraat-generaal Belastingdienst 2016’ het
      verlenen van ondermandaat regelen worden eveneens ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0038862
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0038862
