  - number: '8'
    text: |-
      1 Conform het [Organisatie- en mandaatbesluit Ministerie van Financiën 2015][ref1], verleent de DG voor de
      in [artikel 11][ref2] en [12 van het voornoemde organisatie- en mandaatbesluit][ref3] genoemde bevoegdheden
      ondermandaat aan budgethouders.

      2 De directeuren van de topstructuur DGBD zoals genoemd in [artikel 7 lid 2][ref4] worden gemandateerd door de DG
      om financiële verplichtingen aan te gaan. In een ondermandaat wordt de omvang ervan aangegeven.

      3 De leidinggevende functionarissen, zoals genoemd in [bijlage 1][ref5], die ressorteren onder de directeuren
      behorende tot de topstructuur DGBD, worden gemandateerd, voor zover het binnen het eigen werkterrein betreft,
      financiële verplichtingen aan te gaan. Deze verplichtingen zijn beperkt tot de maximumbedragen als genoemd in
      bijlage 1. Daarnaast geldt de restrictie dat een budgethouder niet meer mag verplichten dan het beschikbare budget.

      4 Verplichtingen van of boven de € 50.000,– exclusief BTW worden alleen aangegaan mits er goedkeuring is van de
      controller van de concerndirectie Control & Financiën.


      [ref1]: https://wetten.overheid.nl/BWBR0037135
      [ref2]: https://wetten.overheid.nl/BWBR0037135#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0037135#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0041669#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0041669
