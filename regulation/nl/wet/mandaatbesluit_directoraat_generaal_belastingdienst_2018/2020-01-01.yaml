  - number: '21'
    text: |-
      Met inachtneming van hetgeen bepaald is voorgaande artikelen en in
      [hoofdstuk 5 van het Organisatie en mandaatbesluit van het Ministerie van Financiën][ref1] zijn de teamleiders
      of daarmee vergelijkbare leidinggevende functionarissen bevoegd om ten aanzien van het tot hun team behorende
      personeel namens de Staatssecretaris de volgende rechtspositionele handelingen en besluiten te verrichten of te
      nemen:

      1. Ten aanzien van de toekenning aan ambtenaren van individuele keuzemogelijkheden in het arbeidsvoorwaardenpakket;

      2. Toekennen aanvraag aanpassing van de werktijdregeling in het kader van de regeling Partiële Arbeidsparticipatie
      Senioren (PAS);

      3. Ten aanzien van vakantie en verlof als bedoeld in [hoofdstuk V van het ARAR][ref2];

      4. Over het toekennen van studiefaciliteiten als bedoeld in [artikel 59 ARAR][ref3] ten aanzien van ambtenaren tot
      en met schaal 14 [BBRA 1984][ref4], tot een bedrag van € 5.000,–;

      5. Goedkeuring dan wel afwijzing van verzoeken tot vergoeding van verhuiskosten en -verlof, declaraties woon-werk-
      verkeer, binnenlandse dienstreizen en de bijbehorende reis- en verblijfskosten;

      6. Het met ambtenaren voeren van voortgang dan wel personeelsgesprekken zoals bedoeld in [artikel 71 ARAR][ref5];
      en

      7. Het uitvoeren van de verplichtingen van de werkgever met betrekking tot de bedrijfsgeneeskundige begeleiding van
      de ambtenaar bij ziekte en arbeidsongeschiktheid als bedoeld in [artikel 36 ARAR][ref6].


