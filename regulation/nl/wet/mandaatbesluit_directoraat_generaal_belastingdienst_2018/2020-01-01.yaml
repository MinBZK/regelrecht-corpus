  - number: '19.23'
    text: |-
      Handelingen en besluiten met betrekking tot het treffen van ordemaatregelen (al dan niet tijdelijke verplaatsing
      naar een andere functie, ontzeggen van de toegang tot de dienstgebouwen, schorsing, onderzoek aan kleding en
      eigendommen van ambtenaren, verval van aanspraak op bezoldiging en verhaal van schade op de ambtenaar);
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel19
