      - id: ref1
        bwb_id: BWBR0001950
        artikel: 4a
      - id: ref2
        bwb_id: BWBR0003860
  - number: '20.3'
    text: |-
      Bij openstelling van een vacature is het afdelingshoofd ten aanzien van het eigen organisatieonderdeel waar de
      vacature bestaat bevoegd met betrekking tot het besluit tot aanstelling dan wel plaatsing van de kandidaat die voor
      de functie in aanmerking komt en het besluit tot afwijzing van de overige kandidaten, uitgezonderd de teamleiders
      of vergelijkbare leidinggevende functionarissen.
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel20
  - number: '20.4'
    text: |-
      Het stellen van voorwaarden voor aanstelling zoals bedoeld in [artikelen 9][ref1], [9a][ref2], [10][ref3] en
      [11 ARAR][ref4] en het vaststellen van het arbeidspatroon;


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel9a
      [ref3]: https://wetten.overheid.nl/BWBR0001950#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0001950#Artikel11
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: 9a
      - id: ref3
        bwb_id: BWBR0001950
        artikel: '10'
      - id: ref4
        bwb_id: BWBR0001950
        artikel: '11'
