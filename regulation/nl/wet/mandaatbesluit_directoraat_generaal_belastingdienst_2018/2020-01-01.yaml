  - number: '19'
    text: |-
      Met inachtneming van hetgeen bepaald in voorgaande artikelen en in
      [hoofdstuk 5 van het Organisatie- en mandaatbesluit Ministerie van Financiën 2015][ref1] zijn de overige
      directeuren bevoegd om ten aanzien van het tot het eigen organisatieonderdeel behorende personeel namens de
      Staatssecretaris de volgende rechtspositionele handelingen en besluiten te verrichten of te nemen:

      1. Ten aanzien van de onder de directeur ressorterende teamleiders of vergelijkbare leidinggevende functionarissen:

      a. Het vaststellen van een vacante functie zoals bedoeld in het [besluit werving en selectie][ref2] (AB85/U1833);

      b. Het openstellen van een vacature op grond van [artikel 4a ARAR][ref3] en het
      [besluit Werving en Selectie][ref4];

      c. Bij openstelling van een vacature is de directeur ten aanzien van het eigen organisatieonderdeel waar de
      vacature bestaat bevoegd met betrekking tot het besluit tot aanstelling dan wel plaatsing van de kandidaat die voor
      de functie in aanmerking komt en het besluit tot afwijzing van de overige kandidaten; en

      d. Het stellen van voorwaarden voor aanstelling zoals bedoeld in [artikelen 9][ref5], [9a][ref6], [10][ref7] en
      [11 ARAR][ref8].

      2. Het bepalen van de inhoud en het waarderingsniveau van de feitelijk opgedragen functie binnen de kaders van het
      functiegebouw Rijk dan wel op grond van de systematiek voor groepsfuncties;

      3. Het benoemen niet op verzoek of op speciale gronden op grond van de [artikelen 57][ref9] en [58 ARAR][ref10];

      4. Het met personeel direct ressorterend onder de directeur en het personeel van schaal 15 [BBRA ’84][ref11] en
      hoger voeren van voortgang dan wel personeelsgesprekken zoals bedoeld [artikel 71 ARAR][ref12];

      5. Het opmaken en bespreken van de personeelsbeoordeling en het indien wenselijk aanwijzen van informanten
      en adviseurs op grond van [artikel 71a ARAR][ref13] ten aanzien van de direct onder de directeur ressorterend
      personeel;

      6. Het beslissen ten aanzien van schadeloosstelling op grond van [artikel 69 ARAR][ref14] tot € 5.000,–, inclusief
      besluitvorming over schadevergoeding die voortvloeit uit door de rechter vernietigde besluiten;

      7. Het toekennen van maatregelen van sociaal flankerend beleid, uitgezonderd de toekenning van een
      stimuleringspremie op grond van [artikel 49tt ARAR][ref15];

      8. Verzoeken tot uitbreiding tot en met 36 uur per week dan wel vermindering van de arbeidsduur;

      9. Afwijzing van de aanvraag betreffende Partiële Arbeidsparticipatie Senioren (PAS);

      10. Het inhouden van bezoldiging op grond van [artikel 14 ARAR][ref16];

      11. Ten aanzien van bezoldiging aan de ambtenaar die als militair of als vrijwillig ambtenaar van politie, in
      werkelijke dienst is als bedoeld in [artikel 17 e.v. ARAR][ref17];

      12. Ten aanzien van bezoldiging op grond van [artikel 102 ARAR][ref18] in geval van overlijden van de ambtenaar;

      13. Ten aanzien van de bezoldiging op grond van [artikel 104a ARAR][ref19] bij vermissing van een ambtenaar;

      14. Ten aanzien van het geen aanspraak hebben op bezoldiging dan wel het vervallen van aanspraken op grond van
      [artikel 40][ref20] of [40a ARAR][ref21];

      15. Het uitbetalen van niet genoten vakantie na ontslag;

      16. Het aanwijzen van bedrijfshulpverleners;

      17. Het vaststellen van de personeelsbeoordeling als beoordelingsautoriteit;

      18. Het optreden als beoordelingsautoriteit voor zover dit betrekking heeft op het afwegen van ingediende
      bedenkingen, het wijzigen van de beoordeling na bedenkingen, en het vaststellen van de beoordeling;

      19. Het toekennen van een diensttijd of ambtsjubileumgratificatie;

      20. Het toekennen van toeslagen op grond van [artikel 7][ref22], [22a][ref23], [22c][ref24] en
      [22e van het BBRA 1984][ref25];

      21. Het toekennen van vergoedingen op grond van [artikel 23 BBRA 1984][ref26];

      22. Ontslag op grond van ongeschiktheid tot het verrichten van arbeid wegens ziekte;

      23. Handelingen en besluiten met betrekking tot het treffen van ordemaatregelen (al dan niet tijdelijke
      verplaatsing naar een andere functie, ontzeggen van de toegang tot de dienstgebouwen, schorsing, onderzoek aan
      kleding en eigendommen van ambtenaren, verval van aanspraak op bezoldiging en verhaal van schade op de ambtenaar);

      24. Vertegenwoordiging van de Minister van Financiën bij de behandeling van een beroep bij de rechtbank, sector
      bestuursrecht, dan wel bij de Centrale Raad van Beroep; en

      25. De bevoegdheden opgenomen in [artikelen 20][ref27] en [21][ref28] worden uitgeoefend door de overige
      directeuren voor zover het rechtspositionele handelingen en besluiten betreft aangaande de direct onder hen
      ressorterende leidinggevenden.


