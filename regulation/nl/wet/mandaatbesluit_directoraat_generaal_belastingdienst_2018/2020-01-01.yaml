    text: |-
      Met inachtneming van hetgeen bepaald in voorgaande artikelen en in
      [hoofdstuk 5 van het Organisatie- en mandaatbesluit Ministerie van Financiën 2015][ref1] zijn de afdelingshoofden
      of daarmee vergelijkbare leidinggevende functionarissen bevoegd om ten aanzien van het tot hun afdeling behorende
      personeel namens de Staatssecretaris de volgende rechtspositionele handelingen en besluiten te verrichten of te
      nemen:

      1. Het vaststellen van een vacante functie zoals bedoeld in het [besluit werving en selectie][ref2] (AB85/U1833);

      2. Het openstellen van een vacature op grond van [artikel 4a ARAR][ref3] en het
      [besluit Werving en Selectie][ref4];

      3. Bij openstelling van een vacature is het afdelingshoofd ten aanzien van het eigen organisatieonderdeel waar de
      vacature bestaat bevoegd met betrekking tot het besluit tot aanstelling dan wel plaatsing van de kandidaat die voor
      de functie in aanmerking komt en het besluit tot afwijzing van de overige kandidaten, uitgezonderd de teamleiders
      of vergelijkbare leidinggevende functionarissen.

      4. Het stellen van voorwaarden voor aanstelling zoals bedoeld in [artikelen 9][ref5], [9a][ref6], [10][ref7] en
      [11 ARAR][ref8] en het vaststellen van het arbeidspatroon;

      5. Het toekennen van buitengewoon verlof op grond van [artikel 33e ARAR][ref9].

      6. Het toekennen van toelagen op grond van [hoofdstuk III BBRA 1984][ref10];

      7. Ten aanzien van de goedkeuring van bijzondere beloningsregelingen zoals de vergoeding voor Bedrijfshulpverlening
      en stagevergoeding;

      8. Het met personeel direct ressorterend onder het afdelingshoofd voeren van voortgang dan wel personeelsgesprekken
      zoals bedoeld [artikel 71 ARAR][ref11];

      9. Het opmaken en bespreken van de personeelsbeoordeling en het indien wenselijk aanwijzen van informanten en
      adviseurs op grond van [artikel 71a ARAR][ref12];

      10. Goedkeuring dan wel afwijzing van verzoeken tot vergoeding buitenlandse dienstreizen binnen Europa en de
      bijbehorende reis en verblijfskosten;

      11. Ontslag wegens onbekwaamheid of ongeschiktheid anders dan wegens ziels- of lichaamsgebreken;

      12. Het toekennen van bezoldiging bij ziekte;

      13. Het uitvoeren van de verplichtingen van de werkgever met betrekking tot de bedrijfsgeneeskundige begeleiding
      van de ambtenaar bij ziekte en arbeidsongeschiktheid als bedoeld in [artikel 36a][ref13] en [36d ARAR][ref14]; en

      14. De bevoegdheden opgenomen in [artikel 21][ref15] worden uitgeoefend door de afdelingshoofden voor zover het
      rechtspositionele handelingen en besluiten betreft aangaande de direct onder hen ressorterende leidinggevenden.


