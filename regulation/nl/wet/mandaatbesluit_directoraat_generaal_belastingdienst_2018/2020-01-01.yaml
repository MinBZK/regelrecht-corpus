  - number: '16'
    text: |-
      Met inachtneming van hetgeen is bepaald in voorgaande artikelen en in
      [hoofdstuk 5 van het Organisatie- en mandaatbesluit Ministerie van Financiën 2015][ref1] zijn de directeuren van
      de topstructuur DGBD bevoegd om ten aanzien van het tot het eigen organisatieonderdeel behorende personeel namens
      de Staatssecretaris de in het eerste tot en met achtste onderdeel en tiende tot en met dertiende onderdeel genoemde
      rechtspositionele handelingen en besluiten te verrichten of te nemen en ten aanzien van het tot het Directoraat-
      Generaal Belastingdienst behorende personeel namens de Staatssecretaris de in het negende onderdeel genoemde
      rechtspositionele handeling te verrichten:

      1. Het openstellen van een vacature op grond van [artikel 4a ARAR][ref2] en het
      [besluit Werving en Selectie][ref3];

      2. Het wijzigen van een salarisschaal zonder wijziging van de functie op grond van [artikel 5 BBRA][ref4];

      3. Het besluiten tot disciplinaire maatregelen ([hoofdstuk 8 ARAR][ref5]) aan functionarissen tot en met schaal 14
      voor zover het geen leidinggevende functionarissen betreft;

      4. Toekennen van buitengewoon verlof van lange duur op grond van de [artikelen 32b][ref6] of
      [34 tot en met 34g ARAR][ref7];

      5. Het opmaken en bespreken van de personeelsbeoordeling en het indien wenselijk aanwijzen van informanten
      en adviseurs op grond van [artikel 71a ARAR][ref8] ten aanzien van de direct onder de directeur ressorterend
      personeel;

      6. Het toekennen van een beloning dan wel non-activiteitswedde in verband met het vervullen van een openbare
      functie op grond van [art 15][ref9] of [16 ARAR][ref10];

      7. Tijdelijke ontheffing uit de functie in verband met het bekleden van een functie in een publiekrechtelijk
      college op grond van [art 125c AW][ref11];

      8. Het toestaan van de door de ambtenaar opgegeven nevenwerkzaamheden op grond van [artikel 61 ARAR][ref12];

      9. Het afnemen van de eed of de belofte voor medewerkers van het Directoraat-Generaal Belastingdienst;

      10. Over het toekennen van studiefaciliteiten als bedoeld in [artikel 59 ARAR][ref13] ten aanzien van ambtenaren
      met schaal 15 of hoger [BBRA 1984][ref14], of vanaf een bedrag van € 5.000,–;

      11. Uitvoering geven aan een sociale dan wel medische indicatie op grond van [artikel 40b ARAR][ref15];

      12. Beslissing tot ontslag op grond van [artikel 49z ARAR][ref16];

      13. Het beslissen op bezwaren, voor zover die betrekking hebben op handelingen of besluiten waarbij een ambtenaar
      als bedoeld in [artikel 1 van de Ambtenarenwet][ref17] als zodanig belanghebbende is; en

      14. De bevoegdheden opgenomen in [artikelen 19][ref18], [20][ref19] en [21][ref20] worden uitgeoefend door de
      directeuren van de topstructuur DGBD voor zover het rechtspositionele handelingen en besluiten betreft aangaande de
      direct onder hen ressorterende leidinggevenden.


