        hoofdstuk: '1.2'
      - id: ref2
        bwb_id: BWBR0032203
        hoofdstuk: '2.1'
  - number: '12'
    text: |-
      1 Bij het nemen van besluiten, afdoen van stukken en ondertekenen van uitgaande brieven met betrekking tot de in
      [bijlage 2][ref1] opgenomen personeelsaangelegenheden is voorafgaand advies van de directeur SSO Organisatie &
      Personeel (O&P) of een door de directeur SSO O&P aan te wijzen afdelingshoofd, vereist, of is voorafgaand advies
      van de directeur DLSO vereist indien het de Douane betreft, of is voorafgaand advies van de directeur FIOD vereist
      indien het de FIOD betreft.

      2 Bij het nemen van beslissingen op bezwaar met betrekking tot personeelsaangelegenheden is voorafgaande
      goedkeuring door de directeur concerndirectie Organisatie & Personeel vereist.

      3 De functionaris die bevoegd is tot het aanstellen, benoemen en plaatsen in een bepaalde functie is ook bevoegd
      tot het verlenen van ontslag aan de in die functie aangestelde ambtenaar, tenzij deze bevoegdheid vanwege de grond
      voor het ontslag elders ligt.


      [ref1]: https://wetten.overheid.nl/BWBR0041669
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0041669
  - number: '13'
    text: |-
      Onderdeel van deze regeling vormt een mandaatregister dat wordt gepubliceerd. Het mandaatregister bevat
      handtekeningen en parafen van de gemandateerde functionarissen zoals bedoeld in de [hoofdstukken 2][ref1] en
      [3][ref2] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0041669#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0041669#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel13
