      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0041669/2020-01-01#Artikel23
  - number: '24'
    text: 'Dit besluit wordt aangehaald als: Mandaatbesluit Directoraat-Generaal Belastingdienst 2018.'
