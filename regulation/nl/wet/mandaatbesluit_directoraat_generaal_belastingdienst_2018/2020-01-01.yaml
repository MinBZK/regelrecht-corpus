    text: |-
      De bevoegdheden opgenomen in [artikelen 20][ref1] en [21][ref2] worden uitgeoefend door de overige directeuren
      voor zover het rechtspositionele handelingen en besluiten betreft aangaande de direct onder hen ressorterende
      leidinggevenden.


      [ref1]: https://wetten.overheid.nl/BWBR0041669#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0041669#Artikel21
