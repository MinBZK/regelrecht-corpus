        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0041669
        hoofdstuk: '3'
  - number: '14'
    text: |-
      Met inachtneming van de [artikelen 19][ref1], [20][ref2], [20a][ref3], [20c][ref4] en
      [20d van het Organisatie- en mandaatbesluit Ministerie van Financiën 2015][ref5] is de algemene leiding van het
      DGBD bevoegd namens de Staatssecretaris ten aanzien van het personeel van het DGBD de navolgende rechtspositionele
      handelingen en besluiten te verrichten of te nemen:

      1. Tot het aanstellen, benoemen en plaatsen van ambtenaren met een bezoldiging van schaal 15 of hoger in functies
      met een lagere schaal dan de voor de ambtenaar tot dan toe geldende schaal;

      2. Het voordragen van functies die ten behoeve van het instellen van een veiligheidsonderzoek voor aanwijzing als
      vertrouwensfuncties in aanmerking komen;

      3. Het voeren van formele correspondentie met Hoge Colleges van Staat;

      4. Het beslissen tot directie overstijgende groepsgewijze werving en selectie voor (groeps)functies;

      5. Het afkondigen van een vacaturestop;

      6. Het aanwijzen van vertrouwenspersonen integriteit;

      7. Het beslissen over de toekenning van een stimuleringspremie op grond van [artikel 49tt ARAR][ref6];

      8. Het beslissen over de afwijkingen bij de toepassing van het sociaal flankerend beleid op grond van
      [artikel 49aaa ARAR][ref7];

      9. Het beslissen over het maken van een buitenlandse dienstreis, uitgezonderd de buitenlandse dienstreizen vanuit
      de directies Douane en FIOD;

      10. Het beslissen over privéverlenging van een buitenlandse dienstreis;

      11. Het nemen van besluiten ten aanzien van de vergoeding van representatiekosten;

      12. Het aanwijzen van brugdagen voor het DGBD; en

      13. Het beslissen ten aanzien van schadeloosstelling op grond van [artikel 69 ARAR][ref8] (vanaf € 5.000),
      inclusief besluitvorming over schadevergoeding die voortvloeit uit door de rechter vernietigde besluiten;

      14. Het nemen van besluiten ten aanzien van ontslag:

      a. bij benoeming tot Minister of Staatssecretaris ([artikel 96c ARAR][ref9]);

      b. van een herplaatste ambtenaar die wachtgeld genoot ([artikel 98a ARAR][ref10]);

      c. van een ambtenaar voor wie, nadat hij een functie in een publiekrechtelijk college waarin hij is benoemd of
      verkozen dan wel de functie van substituut-ombudsman heeft vervuld en tijdelijk was ontheven van de waarneming van
      zijn ambt, geen passende functie in de dienst meer is te vinden ([artikel 96b, eerste en derde lid, ARAR][ref11]);

      d. uit een vertrouwensfunctie om speciale redenen ([artikel 125e, tweede lid, AW][ref12]); en

      e. in verband met een veroordeling tot vrijheidsstraf wegens misdrijf
      ([artikel 98, eerste lid, letter e, ARAR][ref13]).

      15. Het aanwijzen van de voorzitter, plaatsvervangend voorzitter(s), leden en plaatsvervangend leden, de secretaris
      en plaatsvervangend secretarissen van de Centrale Adviescommissie Bezwaren Personeel Belastingdienst (CABP);

      16. Het aanwijzen van de voorzitter, de plaatsvervangend voorzitter, de leden en de plaatsvervangend leden, de
      secretaris en de plaatsvervangend secretaris van de Klachtencommissie ongewenste omgangsvormen;

      17. Handelingen en besluiten verband houdende met de klachtenregeling seksuele intimidatie;

      18. Handelingen en besluiten verband houdende met een adviesaanvraag bij de Commissie gelijke behandeling;

      19. Met inachtneming van de [artikelen 20][ref14], [20a][ref15], [20c][ref16] en
      [20d van het Organisatie- en mandaatbesluit Ministerie van Financiën 2015][ref17] worden de bevoegdheden opgenomen
      in [artikelen 16][ref18], [19][ref19], [20][ref20] en [21][ref21] uitgeoefend door de algemene leiding voor zover
      het rechtspositionele handelingen en besluiten betreft aangaande directeuren van de topstructuur DGBD; en

      20. Het verrichten van handelingen en nemen van besluiten voor zover dit besluit daarin niet voorziet.


