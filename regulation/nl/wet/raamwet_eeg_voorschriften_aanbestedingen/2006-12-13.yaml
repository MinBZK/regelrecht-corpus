regulatory_layer: WET
publication_date: '2012-11-08'
valid_from: '2006-12-13'
bwb_id: BWBR0005937
url: https://wetten.overheid.nl/BWBR0005937/2006-12-13
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het ter wille van een snellere uitvoering van maatregelen als bedoeld
    in artikel 189 van het Verdrag tot oprichting van de Europese Economische Gemeenschap (Trb. 1957, 91) betreffende
    opdrachten van de overheid en daarmee gelijkgestelde bedrijven en instellingen tot levering van produkten,
    uitvoering van werken en het verrichten van diensten, alsmede uit een oogpunt van doelmatigheid en doorzichtigheid
    van regelgeving, wenselijk is één nationaal wettelijk kader tot stand te brengen op grond waarvan die maatregelen
    uitgevoerd kunnen worden;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005937/2006-12-13#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en in de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005937/2006-12-13#Artikel1
  - number: 1.a
    text: |-
      aanbestedingsrichtlijn of -verordening: richtlijn, onderscheidenlijk verordening als bedoeld in artikel 249 van het
      EG-Verdrag die geheel of gedeeltelijk berust op de artikelen 47, 55 en 95 van het EG-Verdrag en betrekking heeft op
      het verstrekken door overheidsdiensten of daarmee gelijkgestelde bedrijven en instellingen van opdrachten voor de
      levering van goederen, voor de uitvoering van werken of voor het verrichten van diensten;
    url: https://wetten.overheid.nl/BWBR0005937/2006-12-13#Artikel1
  - number: 1.b
    text: |-
      gedelegeerde richtlijn, verordening of beschikking: richtlijn, verordening, of beschikking, van de Commissie van de
      Europese Gemeenschappen die berust op een aanbestedingsrichtlijn of -verordening.
    url: https://wetten.overheid.nl/BWBR0005937/2006-12-13#Artikel1
  - number: '2.1'
    text: 'Bij algemene maatregel van bestuur kunnen regels worden gesteld ter implementatie van:'
    url: https://wetten.overheid.nl/BWBR0005937/2006-12-13#Artikel2
  - number: 2.1.a
    text: een aanbestedingsrichtlijn of -verordening;
    url: https://wetten.overheid.nl/BWBR0005937/2006-12-13#Artikel2
  - number: 2.1.b
    text: een gedelegeerde richtlijn, verordening of beschikking;
    url: https://wetten.overheid.nl/BWBR0005937/2006-12-13#Artikel2
  - number: 2.1.c
    text: bijlage XVI van de Overeenkomst betreffende de Europese Economische Ruimte;
    url: https://wetten.overheid.nl/BWBR0005937/2006-12-13#Artikel2
  - number: 2.1.d
    text: |-
      een bindende overeenkomst tussen de Europese Unie en een derde land of een internationale organisatie die
      betrekking heeft op een onderwerp dat wordt bestreken door een aanbestedingsrichtlijn of -verordening of een
      gedelegeerde richtlijn, verordening of beschikking.
    url: https://wetten.overheid.nl/BWBR0005937/2006-12-13#Artikel2
  - number: '2.2'
    text: |-
      De voordracht tot vaststelling, wijziging of intrekking van een algemene maatregel van bestuur als bedoeld in het
      eerste lid wordt gedaan door Onze Minister van Economische Zaken in overeenstemming met Onze Ministers wie het
      mede aangaat.
    url: https://wetten.overheid.nl/BWBR0005937/2006-12-13#Artikel2
  - number: '3.1'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld ten aanzien van het verstrekken van informatie door
      de in een aanbestedingsrichtlijn of -verordening of gedelegeerde richtlijn, verordening of beschikking bedoelde
      overheidsdiensten en daarmee gelijkgestelde bedrijven en instellingen aan Onze Minister van Economische Zaken
      en aan de Europese Commissie, voorzover dat noodzakelijk is ingevolge een in die aanbestedingsrichtlijn of
      -verordening of gedelegeerde richtlijn, verordening of beschikking opgenomen verplichting.
    url: https://wetten.overheid.nl/BWBR0005937/2006-12-13#Artikel3
  - number: '3.2'
    text: |-
      Onze Minister van Economische Zaken kan nadere voorschriften geven ten behoeve van de toepassing van een in het
      eerste lid bedoelde algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0005937/2006-12-13#Artikel3
  - number: '3.3'
    text: |-
      De in het eerste lid bedoelde diensten, bedrijven en instellingen zijn verplicht de op grond van dit artikel
      gevraagde informatie te verstrekken.
    url: https://wetten.overheid.nl/BWBR0005937/2006-12-13#Artikel3
  - number: '4.2'
    text: De Wet overheidsopdrachten voor leveringen van produkten (*Stb.* 1979, 334) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005937/2006-12-13#Artikel4
  - number: '4.3'
    text: De Wet aanbesteding van werken lagere publiekrechtelijke lichamen (*Stb.* 1977, 669) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005937/2006-12-13#Artikel4
  - number: '5'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005937/2006-12-13#Artikel5
  - number: '6'
    text: 'Deze wet kan worden aangehaald als: Raamwet EEG-voorschriften aanbestedingen.'
    url: https://wetten.overheid.nl/BWBR0005937/2006-12-13#Artikel6
