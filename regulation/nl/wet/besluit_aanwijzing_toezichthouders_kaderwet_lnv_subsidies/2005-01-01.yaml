preamble:
  text: |-
    Gelet op artikel 7 van de Kaderwet LNV-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0011970/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Als ambtenaren, belast met het toezicht op de naleving van het bij of krachtens de [Kaderwet LNV-subsidies][ref1]
      bepaalde worden aangewezen:

      a. de ambtenaren van Dienst Regelingen van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;

      b. de ambtenaren van de dienst Landelijk Gebied van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;

      c. de ambtenaren van de Algemene Inspectiedienst van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;

      d. de ambtenaren van de Auditdienst van het Ministerie van Landbouw, Natuur en Voedselkwaliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0009194
    url: https://wetten.overheid.nl/BWBR0011970/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009194
  - number: '2'
    text: |-
      Het besluit van de Minister van Landbouw, Natuurbeheer en Visserij van 3 april 1998 (Stcrt. 1998, nr. 66), nr. J.
      982827, houdende de aanwijzing van toezichthouders voor de Subsidieregeling nieuwe agrarische schadeverzekeringen,
      wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011970/2005-01-01#Artikel2
  - number: '3'
    text: |-
      Het besluit van de Minister van Landbouw, Natuurbeheer en Visserij van 28 juli 1998 (Stcrt. 1998, nr. 144),
      nr. J986943, houdende de aanwijzing van toezichthouders voor de Tijdelijke regeling capaciteitsvermindering
      IJsselmeervisserij, wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011970/2005-01-01#Artikel3
  - number: '4'
    text: |-
      Het besluit van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 12 november 1998 (Stcrt. 1998,
      nr. 218), nr. TRCJZ/1998/969, houdende de aanwijzing van toezichthouders voor de Tijdelijke regeling particulier
      natuurbeheer, wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011970/2005-01-01#Artikel4
  - number: '5'
    text: |-
      Het besluit van de Minister van Landbouw, Natuurbeheer en Visserij van 18 november 1997 (Stcrt. 1997, nr. 227), nr.
      J9711459, houdende de aanwijzing van toezichthouders voor het Stimuleringskader, wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011970/2005-01-01#Artikel5
  - number: '6'
    text: |-
      Het besluit van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 28 juli 2000
      (Stcrt. 2000, nr. 144), nr. TRCJZ/2000/9847, houdende de aanwijzing van toezichthouders voor de
      [Tijdelijke regeling capaciteitsvermindering IJsselmeervisserij 2000][ref1], wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0011535
    url: https://wetten.overheid.nl/BWBR0011970/2005-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011535
  - number: '7'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na dagtekening van de Staatscourant waarin het wordt
      bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0011970/2005-01-01#Artikel7
  - number: '8'
    text: 'De besluit wordt aangehaald als: Besluit aanwijzing toezichthouders Kaderwet LNV-subsidies.'
    url: https://wetten.overheid.nl/BWBR0011970/2005-01-01#Artikel8
