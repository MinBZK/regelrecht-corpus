preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is meer eenheid en duidelijkheid aan te brengen in
    de manier waarop mensen, die nu met toepassing van de Wet werk en bijstand, de Wet sociale werkvoorziening
    dan wel de Wet werk en arbeidsondersteuning jonggehandicapten een inkomensvoorziening ontvangen of met een re-
    integratievoorziening werkzaamheden verrichten, dat het evenzo wenselijk is om mensen die nu nog aan de kant staan
    meer kansen te bieden op regulier werk of op andere vormen van arbeidsbevorderende participatie en om gemeenten
    hiervoor meer instrumenten te geven;

    Zo is het dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-Generaal,
    hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0035333/2018-01-01#ArtikelAanhef
