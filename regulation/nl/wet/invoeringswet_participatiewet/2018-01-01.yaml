  - number: LIIc
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid zendt binnen vijf jaar na de inwerkingtreding van deze wet aan
      de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0035333/2018-01-01#ArtikelLIIc
  - number: LIII
    text: |-
      1 Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld, en artikelen of onderdelen daarvan kunnen terugwerken
      tot en met een in dat besluit te bepalen tijdstip.

      2 In afwijking van het eerste lid, treedt [artikel I, onderdeel Cc][ref1], drie jaar na het tijdstip van de
      inwerkingtreding van artikel I, onderdeel Cb, in werking.

      3 In afwijking van het eerste lid, treedt [artikel LIIBa, onderdeel B][ref2], drie jaar na het tijdstip van de
      inwerkingtreding van [artikel 2.8 van de Jeugdwet][ref3] in werking.


