---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_op_het_kindgebonden_budget
regulatory_layer: WET
publication_date: '2026-02-03'
valid_from: '2024-01-01'
bwb_id: BWBR0022751
url: https://wetten.overheid.nl/BWBR0022751/2024-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is dat personen voor wie de kosten van kinderen in
    verhouding tot hun inkomen een te zware last vormen, een financiële bijdrage in die kosten ontvangen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel1
  - number: 1.1.b
    text: 'kindgebonden budget: een financiële bijdrage van het Rijk in de kosten voor kinderen;'
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel1
  - number: 1.1.c
    text: |-
      ouder: de verzekerde in de zin van de [Algemene Kinderbijslagwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002368
  - number: 1.1.d
    text: |-
      drempelinkomen: 108% van het twaalfvoud van het voor de maand januari van het berekeningsjaar geldende in
      [artikel 8, eerste lid, onderdeel b, van de Wet minimumloon en minimumvakantiebijslag][ref1] bedoelde bedrag per
      maand.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
  - number: '1.2'
    text: De hoogte van het kindgebonden budget is afhankelijk van de draagkracht op basis van het inkomen en het vermogen.
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel1
  - number: '1.3'
    text: |-
      [Artikel 4 van de Algemene wet inkomensafhankelijke regelingen][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel4
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '4'
  - number: '1.4'
    text: |-
      In afwijking van [artikel 7, derde lid, van de Algemene wet inkomensafhankelijke regelingen][ref1],
      bestaat geen aanspraak op kindgebonden budget indien de rendementsgrondslag, bedoeld in
      [artikel 5.3 van de Wet inkomstenbelasting 2001][ref2], van de ouder aan het begin van het berekeningsjaar
      meer bedraagt dan € 140.213 of, indien de ouder het gehele berekeningsjaar dezelfde partner heeft, de
      gezamenlijke rendementsgrondslag, bedoeld in artikel 5.3 van de Wet inkomstenbelasting 2001, van de ouder
      en zijn partner aan het begin van het berekeningsjaar meer bedraagt dan € 177.301. Bij de bepaling van de
      rendementsgrondslag, bedoeld in de vorige zin, wordt geen rekening gehouden met de vrijstelling, bedoeld in
      [artikel 5.13 van de Wet inkomstenbelasting 2001][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '5'
  - number: '1.5'
    text: |-
      In afwijking van [artikel 9, tweede lid, van de Algemene wet inkomensafhankelijke regelingen][ref1], bestaat er wel
      aanspraak op kindgebonden budget voor een kind dat geen vreemdeling is of dat rechtmatig verblijf houdt in de zin
      van [artikel 8 van de Vreemdelingenwet 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '2.1'
    text: |-
      Aanspraak op een kindgebonden budget heeft de ouder voor een kind voor wie aan die ouder op grond van
      [artikel 18 van de Algemene Kinderbijslagwet][ref1] kinderbijslag wordt betaald of zou worden betaald indien
      [artikel 7, tweede lid van die wet][ref2] niet van toepassing zou zijn, met dien verstande dat de aanspraak op een
      kindgebonden budget bestaat met ingang van de kalendermaand na de maand waarin het kind is geboren dan wel tot het
      huishouden is gaan behoren tot en met de kalendermaand waarin het kind de leeftijd van 18 jaar bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel7
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '7'
  - number: '2.2'
    text: 'Het kindgebonden budget bedraagt voor een berekeningsjaar:'
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel2
  - number: 2.2.a
    text: 'indien de ouder aanspraak heeft voor een kind: € 2.436;'
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel2
  - number: 2.2.b
    text: 'indien de ouder aanspraak heeft voor twee of meer kinderen: € 2.436 per kind voor het tweede of volgende kind.'
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel2
  - number: '2.3'
    text: |-
      Een ouder heeft aanspraak op een verhoging van het kindgebonden budget in een berekeningsjaar voor een kind met
      ingang van de kalendermaand na de maand waarin dat kind de leeftijd van 12 jaar heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel2
  - number: '2.4'
    text: |-
      Voor een kind dat 12 jaar of ouder is, maar jonger is dan 16 jaar bedraagt de verhoging van het kindgebonden budget
      € 694,00.
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel2
  - number: '2.5'
    text: |-
      Voor een kind dat 16 of 17 jaar is, bedraagt de verhoging van het kindgebonden budget met ingang van de
      kalendermaand na de maand waarin het kind de leeftijd van 16 jaar heeft bereikt € 924,00.
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel2
  - number: '2.6'
    text: De ouder die geen partner heeft, heeft aanspraak op een verhoging van het kindgebonden budget van € 3.480.
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel2
  - number: '2.7'
    text: |-
      Bij een toetsingsinkomen van de ouder die geen partner heeft, van meer dan het drempelinkomen wordt de som van de
      bedragen waarop recht bestaat op grond van het tweede, vierde, vijfde en zesde lid verminderd met 6,75% van het
      verschil tussen het toetsingsinkomen en het drempelinkomen.
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel2
  - number: '2.8'
    text: |-
      Bij een gezamenlijk toetsingsinkomen van de ouder en zijn partner van meer dan het met € 9.030,00 verhoogde
      drempelinkomen wordt de som van de bedragen waarop recht bestaat op grond van het tweede, vierde en vijfde lid
      verminderd met 6,75% van het verschil tussen het gezamenlijk toetsingsinkomen en het met € 9.030,00 verhoogde
      drempelinkomen.
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel2
  - number: '2.9'
    text: |-
      Een ouder als bedoeld in het eerste en derde lid en zijn partner die tevens ouder is als bedoeld in het eerste lid
      worden voor de toepassing van deze wet geacht gezamenlijk één aanspraak te hebben.
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel2
  - number: '2.10'
    text: |-
      Indien aan twee ouders kinderbijslag wordt uitbetaald op basis van het recht op kinderbijslag van één van die
      ouders, heeft alleen de ouder, wiens recht op kinderbijslag wordt uitbetaald aanspraak op een kindgebonden budget.
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel2
  - number: '2.11'
    text: De aanspraak op een kindgebonden budget wordt voor iedere kalendermaand afzonderlijk bepaald.
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel2
  - number: '2.12'
    text: 'Indien de ouder:'
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel2
  - number: 2.12.a
    text: aanspraak heeft op kindgebonden budget voor een kind, en
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel2
  - number: 2.12.b
    text: |-
      voor dat kind voor de toepassing van de [Algemene Kinderbijslagwet][ref1] een ander land dan Nederland, een van de
      andere lidstaten van de Europese Unie, een andere staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte en Zwitserland als woonland in aanmerking wordt genomen,


      [ref1]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002368
  - number: '2.13'
    text: 'Indien de ouder:'
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel2
  - number: 2.13.a
    text: aanspraak heeft op kindgebonden budget voor meer dan een kind, en
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel2
  - number: 2.13.b
    text: |-
      voor een of meer van die kinderen voor de toepassing van de [Algemene Kinderbijslagwet][ref1] een ander land dan
      Nederland, een van de andere lidstaten van de Europese Unie, een andere staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte en Zwitserland als woonland in aanmerking wordt genomen,


      [ref1]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002368
  - number: '2.14'
    text: |-
      Het twaalfde en dertiende lid zijn niet van toepassing indien het een kind betreft dat op de eerste dag van een
      kalenderkwartaal niet in Nederland woont doch langer dan drie maanden onafgebroken in Nederland verblijft.
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel2
  - number: '3.1'
    text: |-
      De bedragen, genoemd in de [artikelen 1, vierde lid][ref1],
      [2, tweede, vierde tot en met zesde en achtste lid][ref2], en [3, zesde lid][ref3], worden met ingang
      van 1 januari van elk kalenderjaar gewijzigd overeenkomstig de tabelcorrectiefactor, bedoeld in
      [artikel 10.2 van de Wet inkomstenbelasting 2001][ref4]. De gewijzigde bedragen worden door of namens Onze
      Minister medegedeeld in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0022751#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0022751#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0022751#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel10
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0022751
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0022751
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0022751
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '10'
  - number: '3.2'
    text: |-
      Indien er aanleiding is om de bedragen, bedoeld in het eerste lid, te verhogen op een andere wijze dan op grond van
      het eerste lid, worden de bedragen vastgesteld bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel3
  - number: '3.3'
    text: |-
      De overeenkomstig het eerste en tweede lid aangepaste bedragen treden in de plaats van de bedragen, genoemd in de
      [artikelen 1, vierde lid][ref1], en [2, tweede, vierde tot en met zesde, en achtste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022751#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0022751#Artikel2
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0022751
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0022751
        artikel: '2'
  - number: '3.4'
    text: |-
      Indien een verhoging als bedoeld in het tweede lid wordt toegepast, vindt deze verhoging plaats nadat het eerste
      lid toepassing heeft gevonden.
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel3
  - number: '3.5'
    text: |-
      Het eerste lid vindt met ingang van 1 januari 2024 eenmalig geen toepassing voor de bedragen, bedoeld in
      [artikel 2, tweede, vierde tot en met zesde en achtste lid,][ref1] en [artikel 3, zesde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022751#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022751#Artikel3
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0022751
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0022751
        artikel: '3'
  - number: '3.6'
    text: |-
      Met ingang van de hieronder genoemde data worden de bedragen, bedoeld in [artikel 2, tweede en zesde lid][ref1],
      telkens als volgt verlaagd, waarbij de gewijzigde bedragen in de plaats treden van die bedragen en die gewijzigde
      bedragen door of namens Onze Minister worden medegedeeld in de Staatscourant:


      [ref1]: https://wetten.overheid.nl/BWBR0022751#Artikel2
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0022751
        artikel: '2'
  - number: 3.6.a
    text: met ingang van 1 januari 2025 met € 119;
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel3
  - number: 3.6.b
    text: met ingang van 1 januari 2026 met € 62;
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel3
  - number: 3.6.c
    text: met ingang van 1 januari 2028 met € 17.
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel3
  - number: '3.7'
    text: |-
      De verlaging, bedoeld in het zesde lid, vindt plaats nadat het eerste lid toepassing heeft gevonden, onverminderd
      het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel3
  - number: '4'
    text: |-
      Het kindgebonden budget blijft buiten beschouwing bij de verlening van andere op het inkomen of vermogen afgestemde
      publiekrechtelijke uitkeringen en verstrekkingen.
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel4
  - number: '5.1'
    text: De Dienst Toeslagen is belast met de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel5
  - number: '5.2'
    text: De ouder die
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel5
  - number: 5.2.a
    text: over het berekeningsjaar aanspraak heeft op een kindgebonden budget, en
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel5
  - number: 5.2.b
    text: |-
      over het berekeningsjaar reeds in aanmerking komt voor een andere tegemoetkoming waarvan de uitvoering is
      opgedragen aan de Dienst Toeslagen,
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel5
  - number: '5.3'
    text: |-
      Voor de toepassing van [artikel 16, eerste en tweede lid, van de Algemene wet inkomensafhankelijke regelingen][ref1]
      wordt in het geval, bedoeld in het tweede lid, de aanvraag geacht te zijn gedaan op het moment waarop de Dienst
      Toeslagen bekend is geworden dat de ouder aanspraak heeft op een kindgebonden budget.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel16
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '16'
  - number: '11.1'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel11
  - number: '11.2'
    text: Deze wet geldt voor berekeningsjaren die aanvangen op of na 1 januari 2008.
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel11
  - number: '12'
    text: 'Deze wet wordt aangehaald als: Wet op het kindgebonden budget.'
    url: https://wetten.overheid.nl/BWBR0022751/2024-01-01#Artikel12
