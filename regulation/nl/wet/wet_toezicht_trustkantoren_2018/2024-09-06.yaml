  - number: '6.1'
    text: |-
      De Nederlandsche Bank verleent op aanvraag een vergunning als bedoeld in [artikel 3, eerste en tweede lid][ref1],
      of [artikel 4, eerste lid, onderdeel c][ref2], indien de aanvrager aantoont dat zal worden voldaan aan de bij of
      krachtens de [artikelen 10, eerste, tweede, derde en vierde lid][ref3] en [11 tot en met 14][ref4] gestelde regels.


