  - number: '6.2'
    text: De aanvraag van de vergunning geschiedt onder opgave van bij ministeriële regeling te bepalen gegevens.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel6
  - number: '6.3'
    text: Aan een vergunning kunnen voorschriften worden verbonden en beperkingen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel6
  - number: '6.4'
    text: De Nederlandsche Bank beslist binnen dertien weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel6
  - number: '7.1'
    text: |-
      De Nederlandsche Bank kan een door haar verleende vergunning wijzigen, geheel of gedeeltelijk intrekken of
      beperken, dan wel daaraan nadere voorschriften verbinden, indien:
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel7
  - number: 7.1.a
    text: de vergunninghouder daartoe een aanvraag heeft ingediend;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel7
  - number: 7.1.b
    text: |-
      is gebleken dat de vergunninghouder bij de aanvraag van de vergunning onjuiste of onvolledige gegevens heeft
      verstrekt, en kennis omtrent de juiste en volledige gegevens tot een andere beslissing zou hebben geleid;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel7
  - number: 7.1.c
    text: |-
      de vergunninghouder omstandigheden of feiten heeft verzwegen op grond waarvan, zo zij voor het tijdstip waarop de
      vergunning werd verleend zich hadden voorgedaan of bekend waren geweest, de vergunning zou zijn geweigerd;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel7
  - number: 7.1.d
    text: |-
      de vergunninghouder niet voldoet aan de bij of krachtens deze wet gestelde regels dan wel niet meer voldoet aan de
      aan de vergunning verbonden voorschriften of de gestelde beperkingen niet naleeft;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel7
  - number: 7.1.e
    text: |-
      de vergunninghouder niet voldoet aan de verplichting tot betaling van een bedrag op grond van de
      [Wet bekostiging financieel toezicht 2019][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0041548
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0041548
  - number: 7.1.f
    text: |-
      de vergunninghouder geen gebruik van de vergunning heeft gemaakt binnen een termijn van zes maanden na
      vergunningverlening;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel7
  - number: 7.1.g
    text: |-
      de vergunninghouder de vergunningplichtige activiteit heeft beëindigd, dan wel gedurende meer dan zes maanden het
      verlenen van trustdiensten, waarvoor hij een vergunning heeft, heeft gestaakt;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel7
  - number: 7.1.h
    text: |-
      de vergunninghouder de onderneming ten behoeve waarvan de vergunning is verleend, geheel of gedeeltelijk
      overdraagt;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel7
  - number: 7.1.i
    text: de vergunninghouder in staat van faillissement is komen te verkeren;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel7
  - number: 7.1.j
    text: |-
      in geval de vergunninghouder niet voldoet aan de bij of krachtens de
      [Wet ter voorkoming van witwassen en financieren van terrorisme][ref1] gestelde regels;


      [ref1]: https://wetten.overheid.nl/BWBR0024282
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0024282
  - number: 7.1.k
    text: |-
      in geval de vergunninghouder niet voldoet aan de bij of krachtens de [Sanctiewet 1977][ref1] gestelde regels; of


      [ref1]: https://wetten.overheid.nl/BWBR0003296
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003296
  - number: 7.1.l
    text: |-
      doorhaling of beëindiging heeft plaatsgevonden van de inschrijving van de vergunninghouder in het handelsregister
      bedoeld in [artikel 1, eerste lid, onderdeel h van de Handelsregisterwet 2007][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel1
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '1'
  - number: '7.2'
    text: De vergunning vervalt van rechtswege indien de vergunninghouder opgehouden is te bestaan.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel7
  - number: '7.3'
    text: |-
      De Nederlandsche Bank kan bij het besluit tot intrekking van een vergunning tevens bepalen dat het trustkantoor
      binnen een door de Nederlandsche Bank te stellen termijn het bedrijf geheel of gedeeltelijk afwikkelt. Bij een
      afwikkeling, al dan niet bepaald door de Nederlandsche Bank, wordt het trustkantoor of de curator in faillissement
      van het trustkantoor aangemerkt als vergunninghoudende onderneming.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel7
  - number: '8.1'
    text: 'Een trustkantoor meldt schriftelijk aan de Nederlandsche Bank een voornemen tot wijziging van:'
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel8
  - number: 8.1.a
    text: de identiteit van de bestuurders en commissarissen van het trustkantoor;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel8
  - number: 8.1.b
    text: de identiteit van degenen die het beleid van het trustkantoor bepalen of mede bepalen;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel8
  - number: 8.1.c
    text: |-
      de identiteit van degenen die al dan niet middelijk een gekwalificeerde deelneming houden in het trustkantoor of
      een wijziging van de omvang van de desbetreffende gekwalificeerde deelneming;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel8
  - number: 8.1.d
    text: de identiteit van de uiteindelijk belanghebbende van het trustkantoor;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel8
  - number: 8.1.e
    text: de formele en feitelijke zeggenschapsstructuur van de groep waartoe het trustkantoor behoort.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel8
  - number: '8.2'
    text: |-
      Een wijziging als bedoeld in het eerste lid wordt niet doorgevoerd dan nadat de Nederlandsche Bank hiervoor
      toestemming heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel8
  - number: '8.3'
    text: 'Een trustkantoor meldt onverwijld schriftelijk aan de Nederlandsche Bank een wijziging van:'
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel8
  - number: 8.3.a
    text: de antecedenten van de bestuurders en commissarissen van het trustkantoor;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel8
  - number: 8.3.b
    text: de antecedenten van degenen die het beleid van het trustkantoor bepalen of mede bepalen;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel8
  - number: 8.3.c
    text: |-
      de antecedenten van degenen die een gekwalificeerde deelneming houden in het trustkantoor, alsmede de omvang van de
      desbetreffende gekwalificeerde deelneming;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel8
  - number: 8.3.d
    text: de antecedenten van de uiteindelijk belanghebbende van het trustkantoor;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel8
  - number: 8.3.e
    text: |-
      de naam, het adres en de statutaire zetel van het trustkantoor en, indien van toepassing, de naam en het adres van
      zijn bijkantoren;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel8
  - number: 8.3.f
    text: de formele en feitelijke zeggenschapstructuur of de bedrijfsvoering van het trustkantoor;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel8
  - number: 8.3.g
    text: overige bij ministeriële regeling te bepalen gegevens.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel8
  - number: '8.4'
    text: |-
      De houder van een gekwalificeerde deelneming en de uiteindelijk belanghebbende verschaffen het trustkantoor alle
      informatie die noodzakelijk is om te voldoen aan dit artikel.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel8
  - number: '8.5'
    text: |-
      In dit artikel wordt verstaan onder uiteindelijk belanghebbende: uiteindelijk belanghebbende als bedoeld in
      [artikel 10a, eerste lid, van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel10a
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 10a
  - number: '9.1'
    text: |-
      Er is een openbaar register van trustkantoren met een vergunning als bedoeld in de [artikelen 3][ref1] en
      [4][ref2] of een ontheffing als bedoeld in [artikel 5][ref3]. Het register wordt gehouden door de Nederlandsche
      Bank en wordt in ieder geval gepubliceerd op een daartoe geschikte website.


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0041583#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0041583#Artikel5
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0041583
        artikel: '4'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0041583
        artikel: '5'
        hoofdstuk: '2'
  - number: '9.2'
    text: |-
      De Nederlandsche Bank verricht de inschrijving en doorhaling in het register op zodanige wijze dat uit het register
      is op te maken vanaf welk tijdstip, welke trustdiensten een ingeschreven trustkantoor mag verrichten.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel9
  - number: '9.3'
    text: 'In het register worden ten aanzien van een trustkantoor de volgende gegevens opgenomen:'
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel9
  - number: 9.3.a
    text: |-
      de naam, het adres en de statutaire zetel van het trustkantoor en, indien van toepassing, de naam en het adres van
      zijn bijkantoren;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel9
  - number: 9.3.b
    text: de datum van inschrijving van het trustkantoor in het register;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel9
  - number: 9.3.c
    text: het nummer van inschrijving van het trustkantoor bij de Kamer van Koophandel;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel9
  - number: 9.3.d
    text: |-
      de aan de vergunning of de ontheffing verbonden voorschriften en gestelde beperkingen, tenzij de bescherming van de
      persoonlijke levenssfeer of van gerechtvaardigde bedrijfsbelangen zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel9
  - number: '9.4'
    text: |-
      De Nederlandsche Bank draagt onverwijld zorg voor de inschrijving van trustkantoren die beschikken over een
      vergunning of ontheffing.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel9
  - number: '9.5'
    text: |-
      Indien van toepassing vermeldt de Nederlandsche Bank bij doorhaling dat het desbetreffende besluit nog niet
      onherroepelijk is.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel9
  - number: '9.6'
    text: |-
      De Nederlandsche Bank verstrekt aan een ieder desgevraagd, tegen betaling van de kostprijs, afschriften uit het
      register.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel9
  - number: '10.1'
    text: |-
      Het beleid van een trustkantoor met zetel in Nederland wordt bepaald of mede bepaald door personen die geschikt
      zijn in verband met de uitoefening van het bedrijf van trustkantoor. Indien binnen het trustkantoor een orgaan is
      belast met toezicht op het beleid en de algemene gang van zaken van het trustkantoor, wordt dit toezicht gehouden
      door personen die geschikt zijn voor de uitoefening van dit toezicht.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel10
  - number: '10.2'
    text: |-
      Het beleid van een trustkantoor met zetel in Nederland wordt bepaald of mede bepaald door personen wier
      betrouwbaarheid buiten twijfel staat. Indien binnen het trustkantoor een orgaan is belast met toezicht op
      het beleid en de algemene gang van zaken van het trustkantoor, wordt dit toezicht gehouden door personen wier
      betrouwbaarheid buiten twijfel staat.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel10
  - number: '10.3'
    text: |-
      Indien sprake is van een gekwalificeerde deelneming wordt die gehouden door natuurlijke personen wier
      betrouwbaarheid buiten twijfel staat of, in geval van een rechtspersoon, de betrouwbaarheid van de bestuurders van
      die rechtspersoon buiten twijfel staat.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel10
  - number: '10.4'
    text: |-
      De uiteindelijk belanghebbende van een trustkantoor met zetel in Nederland is, gelet op
      zijn reputatie, geschikt en zijn betrouwbaarheid staat buiten twijfel. In dit lid wordt
      verstaan onder uiteindelijk belanghebbende: uiteindelijk belanghebbende als bedoeld in
      [artikel 10a, eerste lid, van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel10a
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 10a
  - number: '10.5'
    text: |-
      De betrouwbaarheid van een persoon staat buiten twijfel wanneer dat eenmaal door de Nederlandsche Bank of de
      Stichting Autoriteit Financiële Markten voor de toepassing van deze wet, de [Wet op het financieel toezicht][ref1],
      of de [Wet ter voorkoming van witwassen en financieren van terrorisme][ref2] is vastgesteld, zolang niet een
      wijziging in de relevante feiten of omstandigheden een redelijke aanleiding geeft tot een nieuwe beoordeling.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
      [ref2]: https://wetten.overheid.nl/BWBR0024282
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0020368
      - id: ref2
        bwb_id: BWBR0024282
  - number: '10.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de wijze waarop
      wordt vastgesteld of de betrouwbaarheid van een persoon buiten twijfel staat en welke feiten en omstandigheden
      daarbij in aanmerking worden genomen, alsmede regels met betrekking tot de misdrijven die, indien begaan door
      die persoon, met het oog op de belangen die de wet beoogt te beschermen, tot de vaststelling leiden dat de
      betrouwbaarheid van die persoon niet buiten twijfel staat.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel10
  - number: '11.1'
    text: Ten minste twee natuurlijke personen bepalen het dagelijks beleid van een trustkantoor met zetel in Nederland.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel11
  - number: '11.2'
    text: |-
      De personen die het dagelijks beleid van een trustkantoor met zetel in Nederland bepalen, verrichten hun
      werkzaamheden in verband daarmee vanuit Nederland.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel11
  - number: '11.3'
    text: |-
      De Nederlandsche Bank kan op aanvraag geheel of gedeeltelijk, al dan niet voor bepaalde tijd, ontheffing verlenen
      van dit artikel, voor zover de aanvrager aantoont dat daaraan redelijkerwijs niet kan worden voldaan en dat de
      belangen die dit artikel beoogt te beschermen voldoende worden gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel11
  - number: '12.1'
    text: |-
      Een trustkantoor met zetel in Nederland is niet met personen verbonden in een formele of feitelijke
      zeggenschapsstructuur die in zodanige mate ondoorzichtig is dat deze een belemmering vormt of kan vormen voor het
      adequaat uitoefenen van toezicht op het trustkantoor.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel12
  - number: '12.2'
    text: |-
      Een trustkantoor met zetel in Nederland is niet met personen verbonden in een formele of feitelijke
      zeggenschapsstructuur indien het recht van een staat, dat op die personen van toepassing is, een belemmering vormt
      of kan vormen voor het adequaat uitoefenen van toezicht op het trustkantoor.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel12
  - number: '13.1'
    text: |-
      Een trustkantoor met zetel in Nederland heeft de rechtsvorm van een naamloze vennootschap, een besloten
      vennootschap met beperkte aansprakelijkheid of een Europese naamloze vennootschap.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel13
  - number: '13.2'
    text: |-
      Een trustkantoor met zetel in een lidstaat of in een aangewezen staat als bedoeld in [artikel 4, eerste lid][ref1],
      dat trustdiensten verleent naar Nederland, dan wel vanuit een in Nederland gelegen bijkantoor trustdiensten
      verleent, beschikt naar het recht van de staat van zijn zetel over rechtspersoonlijkheid.


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel4
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '4'
        hoofdstuk: '2'
  - number: '14.1'
    text: |-
      Een trustkantoor met zetel in Nederland voert een adequaat beleid dat een integere en beheerste uitoefening van het
      bedrijf waarborgt, met inachtneming van de [hoofdstukken 4][ref1] en [5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0041583#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0041583
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0041583
        hoofdstuk: '5'
  - number: '14.2'
    text: |-
      Een trustkantoor met zetel in Nederland richt de bedrijfsvoering zodanig in dat deze een beheerste en integere
      uitoefening van haar bedrijf waarborgt, met inachtneming van de [hoofdstukken 4][ref1] en [5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0041583#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0041583
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0041583
        hoofdstuk: '5'
  - number: '14.3'
    text: |-
      Ten behoeve van een integere en beheerste uitoefening van het bedrijf maakt een trustkantoor met zetel in Nederland
      periodiek een analyse van de risico’s voor de integere bedrijfsvoering. Het trustkantoor met zetel in Nederland
      heeft procedures, processen en maatregelen waarmee de geïdentificeerde risico’s gemitigeerd worden.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel14
  - number: '14.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de
      verplichtingen in dit artikel. Deze regels kunnen betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel14
  - number: 14.4.a
    text: 'een integere bedrijfsuitoefening, waaronder wordt verstaan het tegengaan van:'
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel14
  - number: 14.4.a.1°
    text: belangenverstrengeling;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel14
  - number: 14.4.a.2°
    text: |-
      strafbare feiten of andere wetsovertredingen door het trustkantoor of zijn werknemers, die het vertrouwen in het
      trustkantoor of in de financiële markten kunnen schaden;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel14
  - number: 14.4.a.3°
    text: relaties met cliënten of derden, die het vertrouwen in het trustkantoor of in de financiële markten kunnen schaden;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel14
  - number: 14.4.a.4°
    text: |-
      andere handelingen door het trustkantoor of zijn werknemers, die op een dusdanige wijze ingaan tegen hetgeen
      volgens het ongeschreven recht in het maatschappelijk verkeer betaamt, dat hierdoor het vertrouwen in de
      onderneming of in de financiële markten ernstig kan worden geschaad;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel14
  - number: 14.4.b
    text: het beheersen van bedrijfsprocessen en bedrijfsrisico’s.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel14
  - number: '14.5'
    text: |-
      De Nederlandsche Bank kan op aanvraag geheel of gedeeltelijk, al dan niet voor bepaalde tijd, ontheffing verlenen
      van het derde lid indien de aanvrager aantoont dat daaraan redelijkerwijs niet kan worden voldaan en dat de
      belangen die dit artikel beoogt te beschermen voldoende worden gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel14
  - number: '15.1'
    text: |-
      Een trustkantoor met zetel in Nederland beschikt over een onafhankelijke en effectieve compliancefunctie. De
      compliancefunctie is gericht op het controleren van de naleving door het trustkantoor van wettelijke voorschriften
      en interne regels van het trustkantoor zelf.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel15
  - number: '15.2'
    text: |-
      Een trustkantoor met zetel in Nederland draagt er zorg voor dat op onafhankelijke wijze een auditfunctie wordt
      uitgeoefend ten aanzien van zijn werkzaamheden. De auditfunctie controleert de naleving door een trustkantoor
      van de bij of krachtens deze wet, de [Wet ter voorkoming van witwassen en financieren van terrorisme][ref1] en de
      [Sanctiewet 1977][ref2] gestelde regels en de uitoefening van de compliancefunctie.


      [ref1]: https://wetten.overheid.nl/BWBR0024282
      [ref2]: https://wetten.overheid.nl/BWBR0003296
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0024282
      - id: ref2
        bwb_id: BWBR0003296
  - number: '15.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de
      uitoefening van de compliancefunctie en auditfunctie.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel15
  - number: '16.1'
    text: |-
      Indien een trustkantoor met zetel in Nederland werkzaamheden uitbesteedt aan een derde in het kader van een
      uitbestedings- of agentuurovereenkomst, draagt het trustkantoor er zorg voor dat deze derde de ingevolge deze wet
      met betrekking tot die werkzaamheden op het trustkantoor van toepassing zijnde regels naleeft.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel16
  - number: '16.2'
    text: Een trustkantoor met zetel in Nederland besteedt de uitoefening van de compliancefunctie niet uit.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel16
  - number: '16.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen andere werkzaamheden worden aangewezen die een trustkantoor met zetel in
      Nederland niet uitbesteedt.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel16
  - number: '16.4'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel16
  - number: 16.4.a
    text: het uitbesteden van werkzaamheden, in verband met het toezicht op de naleving van het ingevolge deze wet bepaalde;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel16
  - number: 16.4.b
    text: de beheersing van risico’s die verband houden met het uitbesteden van werkzaamheden door trustkantoren;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel16
  - number: 16.4.c
    text: de tussen een trustkantoor en de derde te sluiten overeenkomst over het uitbesteden van werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel16
  - number: '17'
    text: |-
      Het is een trustkantoor met zetel in Nederland verboden om trustdiensten te verlenen aan een cliënt die uitvoering
      geven aan belastingadvies dat aan deze cliënt is verstrekt door het trustkantoor of door een natuurlijke persoon,
      rechtspersoon of vennootschap die deel uitmaakt van dezelfde groep als het trustkantoor.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel17
  - number: '18.1'
    text: |-
      Een trustkantoor met zetel in Nederland verstrekt jaarlijks, of zoveel vaker als nodig voor het toezicht op
      de naleving van het bij of krachtens deze wet bepaalde, een rapportage omtrent zijn bedrijfsvoering aan de
      Nederlandsche Bank.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel18
  - number: '18.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de inhoud van de door
      trustkantoren in te dienen rapportages en de termijn waarbinnen de rapportages dienen te worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel18
  - number: '19'
    text: |-
      Een trustkantoor met zetel in Nederland treft met betrekking tot gelden of geldswaarden van doelvennootschappen of
      derden die door het trustkantoor worden beheerd, maatregelen om de rechten van die doelvennootschappen of derden
      te beschermen.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel19
  - number: '20.1'
    text: Een trustkantoor met zetel in Nederland informeert de Nederlandsche Bank onverwijld omtrent incidenten.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel20
  - number: '20.2'
    text: |-
      Een trustkantoor met zetel in Nederland neemt naar aanleiding van een incident passende maatregelen die zijn
      gericht op het beheersen van de opgetreden risico’s en het voorkomen van herhaling.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel20
  - number: '20.3'
    text: |-
      Een trustkantoor met zetel in Nederland draagt zorg voor de administratieve vastlegging van incidenten en de naar
      aanleiding daarvan genomen maatregelen.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel20
  - number: '20.4'
    text: |-
      *Onder incident wordt in dit artikel verstaan:* gedraging of gebeurtenis die een ernstig gevaar vormt voor de
      integere uitoefening van het bedrijf van het trustkantoor.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel20
  - number: '20.5'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de informatie die een trustkantoor verstrekt aan de
      Nederlandsche Bank bij een melding van een incident.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel20
  - number: '21.1'
    text: |-
      De [artikelen 10][ref1], [11, eerste lid][ref2], [12][ref3] en [14 tot en met 19][ref4] zijn van overeenkomstige
      toepassing op trustkantoren met zetel in een andere lidstaat of in een aangewezen staat die trustdiensten verlenen
      naar Nederland, dan wel die via een in Nederland gelegen bijkantoor trustdiensten verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0041583#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0041583#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0041583#Artikel14
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '10'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0041583
        artikel: '11'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0041583
        artikel: '12'
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0041583
        artikel: '14'
        hoofdstuk: '3'
  - number: '21.2'
    text: |-
      De [artikelen 12][ref1] en [14 tot en met 19][ref2] zijn van overeenkomstige toepassing op in Nederland gelegen
      bijkantoren van trustkantoren met zetel in een andere lidstaat of in een aangewezen staat.


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0041583#Artikel14
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '12'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0041583
        artikel: '14'
        hoofdstuk: '3'
  - number: '22'
    text: |-
      Een trustkantoor verricht ter beheersing van integriteitrisico’s onderzoek zoals voorgeschreven in dit hoofdstuk
      indien:
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel22
  - number: 22.a
    text: het trustkantoor een zakelijke relatie aangaat;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel22
  - number: 22.b
    text: het trustkantoor een trustdienst verleent;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel22
  - number: 22.c
    text: er indicaties zijn dat de cliënt betrokken is bij witwassen of financieren van terrorisme;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel22
  - number: 22.d
    text: het trustkantoor twijfelt aan de juistheid of volledigheid van eerder verkregen gegevens;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel22
  - number: 22.e
    text: |-
      het risico van betrokkenheid van een bestaande cliënt bij witwassen of financieren van terrorisme daartoe
      aanleiding geeft;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel22
  - number: 22.f
    text: |-
      er, gelet op de staat waarin een cliënt of doelvennootschap woonachtig of gevestigd is, een verhoogd risico op
      witwassen of financieren van terrorisme bestaat.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel22
  - number: '23.1'
    text: 'Het is een trustkantoor verboden een zakelijke relatie aan te gaan of een trustdienst te verlenen, tenzij:'
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel23
  - number: 23.1.a
    text: |-
      het trustkantoor of een introducerende instelling cliëntenonderzoek heeft verricht en dit cliëntenonderzoek
      heeft geleid tot het in de [artikelen 27 tot en met 30a][ref1], [33][ref2] en [34][ref3] bedoelde resultaat en er
      redelijkerwijs geen twijfel kan bestaan over de juistheid of volledigheid van dit resultaat;


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0041583#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0041583#Artikel34
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '27'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0041583
        artikel: '33'
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref3
        bwb_id: BWBR0041583
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 23.1.b
    text: |-
      het trustkantoor of een introducerende instelling voldoet aan [artikel 37, eerste en tweede lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel37
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '37'
        hoofdstuk: '5'
  - number: 23.1.c
    text: |-
      voor zover het cliëntenonderzoek is verricht door een introducerende instelling, het trustkantoor beschikt over de
      informatie, bedoeld in [artikel 37, eerste en tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel37
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '37'
        hoofdstuk: '5'
  - number: '23.2'
    text: |-
      Voor zover in [paragraaf 4.2][ref1] is voorgeschreven dat een trustkantoor in het kader van het cliëntenonderzoek
      een voortdurende controle op de zakelijke relatie uitoefent, ten einde te verzekeren dat deze overeenkomt met het
      integriteitrisicoprofiel van de cliënt of doelvennootschap, verzekert een trustkantoor zich er voorafgaand aan
      het aangaan van een zakelijke relatie van dat het trustkantoor hiertoe in staat zal zijn gedurende de zakelijke
      relatie.


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0041583
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '23.3'
    text: |-
      Indien een trustkantoor met betrekking tot een zakelijke relatie niet in staat is te voldoen aan de voorschriften
      in dit hoofdstuk, beëindigt het trustkantoor de zakelijke relatie.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel23
  - number: 23a.1
    text: |-
      Het is een trustkantoor verboden een trustdienst te verlenen indien cliënten, doelvennootschappen, uiteindelijk
      belanghebbenden van cliënten en uiteindelijk belanghebbenden van doelvennootschappen woonachtig of gevestigd zijn
      of hun zetel hebben in:
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel23a
  - number: 23a.1.a
    text: de Russische Federatie;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel23a
  - number: 23a.1.b
    text: de Republiek Belarus;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel23a
  - number: 23a.1.c
    text: |-
      staten die op grond van artikel 9 van de vierde anti-witwasrichtlijn, in gedelegeerde handelingen van de Europese
      Commissie, zijn aangewezen als staten met een hoger risico op witwassen of financieren van terrorisme; of
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel23a
  - number: 23a.1.d
    text: |-
      staten die door de Raad van de Europese Unie, op grond van de Conclusies van de Raad over de criteria en het
      proces voor de opstelling van de EU-lijst van niet-coöperatieve rechtsgebieden voor belastingdoeleinden (PbEU 2016,
      C 461), zijn aangewezen als jurisdicties die niet-coöperatief zijn op belastinggebied.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel23a
  - number: 23a.2
    text: |-
      Het eerste lid is niet van toepassing voor zover de identiteit van een cliënt, doelvennootschap, uiteindelijk
      belanghebbende van de cliënt of uiteindelijk belanghebbende van doelvennootschap overeenkomt met een rechtspersoon
      of natuurlijk persoon als bedoeld in de [Sanctiewet 1977][ref1] en de op grond van de Sanctiewet 1977 vastgestelde
      regelingen en besluiten met betrekking tot het financieel verkeer. Na beëindiging van de omstandigheid, bedoeld in
      de eerste volzin, voldoet een trustkantoor binnen drie maanden aan het eerste lid, gerekend vanaf de datum dat de
      omstandigheid is beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0003296
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0003296
  - number: 23a.3
    text: |-
      Het eerste lid is niet van toepassing indien de cliënt of uiteindelijk belanghebbende, bedoeld in het eerste lid,
      een natuurlijk persoon is die de nationaliteit bezit van een lidstaat van de Europese Unie, van een andere staat
      die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of van Zwitserland, of die in het
      bezit is van een verblijfsvergunning voor een van deze staten.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel23a
  - number: 23a.4
    text: |-
      Een trustkantoor voldoet binnen drie maanden aan het eerste lid, gerekend vanaf het moment waarop een land is
      toegevoegd aan een lijst als bedoeld in het eerste lid, onderdeel c of d.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel23a
  - number: '24.1'
    text: |-
      In het kader van het cliëntenonderzoek wordt onder het verifiëren van de identiteit verstaan het vaststellen dat de
      opgegeven identiteit overeenkomt met de werkelijke identiteit van een persoon.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel24
  - number: '24.2'
    text: |-
      [Artikel 11 van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref1] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel11
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '11'
  - number: '25'
    text: |-
      Het op grond van dit hoofdstuk vaststellen van een uiteindelijk belanghebbende houdt in ieder geval in dat een
      trustkantoor:
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel25
  - number: 25.a
    text: zoveel mogelijk met zekerheid alle uiteindelijk belanghebbenden identificeert;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel25
  - number: 25.b
    text: de identiteit van de uiteindelijk belanghebbenden verifieert; en
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel25
  - number: 25.c
    text: de aard en omvang van het uiteindelijk belang van de uiteindelijk belanghebbende verifieert.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel25
  - number: '26.1'
    text: |-
      Een trustkantoor heeft kennis van het doel van hetgeen de cliënt beoogt met de trustdienstverlening en
      onderzoekt, mede aan de hand van de uitkomst van het in dit hoofdstuk voorgeschreven cliëntenonderzoek, of aan die
      dienstverlening integriteitrisico’s zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel26
  - number: '26.2'
    text: |-
      Naar gelang de uitkomst van het onderzoek vergewist een trustkantoor zich ervan dat integriteitrisico’s verbonden
      aan zijn dienstverlening adequaat zijn ondervangen.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel26
  - number: '26.3'
    text: |-
      Een trustkantoor beschikt voor iedere cliënt over een acceptatiememorandum waarin de uitkomst van het
      cliëntenonderzoek, het onderzoek naar de verbonden integriteitsrisico’s en de mate waarin deze worden ondervangen
      in samenhang tot elkaar zijn beschreven, en waarin de aanvaarding van de cliënt tot uitdrukking is gebracht.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel26
  - number: '27.1'
    text: |-
      Een trustkantoor verricht voor het aangaan van een zakelijke relatie gericht op het verlenen van de trustdiensten,
      bedoeld in de onderdelen a en b van de begripsomschrijving van trustdienst, alsmede bij het verlenen van die
      trustdiensten, onderzoek naar de cliënt en de doelvennootschap.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel27
  - number: '27.2'
    text: 'Het onderzoek stelt het trustkantoor in staat om met betrekking tot de doelvennootschap:'
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel27
  - number: 27.2.a
    text: het integriteitrisicoprofiel van de doelvennootschap vast te stellen;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel27
  - number: 27.2.b
    text: het transactieprofiel van de doelvennootschap vast te stellen;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel27
  - number: 27.2.c
    text: de herkomst van het vermogen van de doelvennootschap vast te stellen;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel27
  - number: 27.2.d
    text: |-
      de vermogenspositie van de uiteindelijk belanghebbende van de doelvennootschap zoveel mogelijk met zekerheid vast
      te stellen;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel27
  - number: 27.2.e
    text: |-
      zoveel mogelijk met zekerheid te bepalen dat het vermogen als bedoeld in onderdeel c en het aan de vermogenspositie
      verbonden vermogen als bedoeld in onderdeel d uit legitieme bron afkomstig zijn;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel27
  - number: 27.2.f
    text: |-
      vast te stellen dat voldaan is aan verplichtingen tot inschrijving van de doelvennootschap, alsmede de relevante
      delen van de structuur van de groep waartoe de doelvennootschap behoort, in het handelsregister, bedoeld in
      [artikel 2 van de Handelsregisterwet 2007][ref1], of een daarmee vergelijkbaar register in een ander land, en dat
      voldaan is aan verplichtingen tot het registreren van de uiteindelijk belanghebbenden van die entiteiten;


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel2
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '2'
  - number: 27.2.g
    text: |-
      de eigendomsstructuur en de formele zeggenschapsstructuur van de doelvennootschap, alsmede de relevante delen van
      de structuur van de groep waartoe de doelvennootschap behoort vast te stellen;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel27
  - number: 27.2.h
    text: |-
      inzicht te verwerven in de feitelijke zeggenschapsstructuur van de doelvennootschap en deze zoveel mogelijk met
      zekerheid vast te stellen;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel27
  - number: 27.2.i
    text: de strekking waarmee de structuur van de groep waartoe de doelvennootschap behoort is opgezet vast te stellen;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel27
  - number: 27.2.j
    text: de herkomst en bestemming van de middelen van de doelvennootschap vast te stellen; en
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel27
  - number: 27.2.k
    text: |-
      een voortdurende controle op de zakelijke relatie en de verrichte transacties uit te oefenen, teneinde zoveel
      mogelijk met zekerheid vast te stellen dat deze overeenkomen met de kennis die het trustkantoor heeft van de
      doelvennootschap, het integriteitrisicoprofiel en het transactieprofiel van de doelvennootschap.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel27
  - number: '27.3'
    text: 'Het onderzoek stelt het trustkantoor in staat om met betrekking tot de cliënt:'
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel27
  - number: 27.3.a
    text: de cliënt te identificeren en diens identiteit te verifiëren;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel27
  - number: 27.3.b
    text: de uiteindelijk belanghebbende van de cliënt vast te stellen;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel27
  - number: 27.3.c
    text: het doel en de beoogde aard van de zakelijke relatie vast te stellen;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel27
  - number: 27.3.d
    text: |-
      een voortdurende controle op de zakelijke relatie en de verrichte transacties uit te oefenen teneinde zoveel
      mogelijk met zekerheid vast te stellen dat deze overeenkomen met het integriteitrisicoprofiel van de cliënt met zo
      nodig een onderzoek naar de bron van de middelen die bij de zakelijke relatie of de trustdienst worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel27
  - number: 27.3.e
    text: vast te stellen of de natuurlijke persoon die de cliënt vertegenwoordigt daartoe bevoegd is;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel27
  - number: 27.3.f
    text: |-
      zoveel mogelijk met zekerheid vast te stellen of de cliënt ten behoeve van zichzelf optreedt, dan wel ten behoeve
      van een derde; en
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel27
  - number: 27.3.g
    text: |-
      in voorkomend geval, de natuurlijke persoon, bedoeld in onderdeel e, alsmede de derde, bedoeld in onderdeel f, te
      identificeren en diens identiteit te verifiëren.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel27
  - number: '27.4'
    text: |-
      Indien de cliënt niet de doelvennootschap of de uiteindelijk belanghebbende van de doelvennootschap is, verricht
      het trustkantoor aanvullend onderzoek dat hem in staat stelt om:
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel27
  - number: 27.4.a
    text: het integriteitrisicoprofiel van de cliënt vast te stellen;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel27
  - number: 27.4.b
    text: 'indien de cliënt een rechtspersoon is:'
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel27
  - number: 27.4.b.1°
    text: de eigendomsstructuur en de formele zeggenschapstructuur van de cliënt vast te stellen;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel27
  - number: 27.4.b.2°
    text: |-
      inzicht te verwerven in de feitelijke zeggenschapsstructuur van de cliënt en deze zoveel als redelijkerwijs
      mogelijk is met zekerheid vast te stellen; en
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel27
  - number: 27.4.c
    text: de uiteindelijk belanghebbende van de doelvennootschap vast te stellen.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel27
  - number: '28.1'
    text: |-
      Een trustkantoor verricht voor het aangaan van een zakelijke relatie gericht op het verlenen van de trustdienst,
      bedoeld in onderdeel c van de begripsomschrijving van trustdienst, alsmede bij het verlenen van die trustdienst
      onderzoek naar de cliënt en voor zover van toepassing de koper en de verkoper.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel28
  - number: '28.2'
    text: 'Het onderzoek stelt het trustkantoor in staat om met betrekking tot de cliënt:'
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel28
  - number: 28.2.a
    text: het integriteitrisicoprofiel van de cliënt vast te stellen;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel28
  - number: 28.2.b
    text: het doel en de beoogde aard van de zakelijke relatie vast te stellen;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel28
  - number: 28.2.c
    text: |-
      een voortdurende controle op de zakelijke relatie en de tijdens de duur van deze relatie verrichte transacties
      uit te oefenen, teneinde zoveel mogelijk met zekerheid vast te stellen dat deze overeenkomen met de kennis die het
      trustkantoor heeft van de cliënt en het risicoprofiel van de cliënt, met zo nodig een onderzoek naar de bron van de
      middelen die bij de zakelijke relatie of de trustdienst worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel28
  - number: 28.2.d
    text: de cliënt te identificeren en diens identiteit te verifiëren;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel28
  - number: 28.2.e
    text: de uiteindelijk belanghebbende van de cliënt vast te stellen;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel28
  - number: 28.2.f
    text: 'indien de cliënt een rechtspersoon is:'
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel28
  - number: 28.2.f.1°
    text: de eigendomsstructuur en de formele zeggenschapsstructuur van de cliënt vast te stellen;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel28
  - number: 28.2.f.2°
    text: |-
      inzicht te verwerven in de feitelijke zeggenschapsstructuur van de cliënt en deze zoveel mogelijk met zekerheid
      vast te stellen;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel28
  - number: 28.2.g
    text: vast te stellen of de natuurlijke persoon die de cliënt vertegenwoordigt daartoe bevoegd is;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel28
  - number: 28.2.h
    text: |-
      zoveel mogelijk met zekerheid vast te stellen of de cliënt ten behoeve van zichzelf optreedt dan wel ten behoeve
      van een derde; en
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel28
  - number: 28.2.i
    text: |-
      in voorkomend geval, de natuurlijke persoon, bedoeld in onderdeel g, alsmede de derde, bedoeld in onderdeel h, te
      identificeren en diens identiteit te verifiëren.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel28
  - number: '28.3'
    text: 'Het onderzoek stelt het trustkantoor in staat om met betrekking tot de koper of verkoper:'
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel28
  - number: 28.3.a
    text: het integriteitrisicoprofiel van de koper of verkoper vast te stellen;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel28
  - number: 28.3.b
    text: de koper of verkoper te identificeren en diens identiteit te verifiëren;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel28
  - number: 28.3.c
    text: de uiteindelijk belanghebbende van de koper of verkoper vast te stellen;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel28
  - number: 28.3.d
    text: de vermogenspositie van de uiteindelijk belanghebbende van de koper zoveel mogelijk met zekerheid vast te stellen;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel28
  - number: 28.3.e
    text: |-
      zoveel mogelijk met zekerheid te bepalen dat het aan de vermogenspositie, bedoeld in onderdeel d, verbonden
      vermogen uit legitieme bron afkomstig is; en
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel28
  - number: 28.3.f
    text: de herkomst van het vermogen van de koper vast te stellen.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel28
  - number: '29.1'
    text: |-
      Een trustkantoor verricht voor het aangaan van een zakelijke relatie gericht op het verlenen van de trustdienst,
      bedoeld in onderdeel d van de begripsomschrijving van trustdienst, alsmede bij het verlenen van die trustdienst
      onderzoek naar de cliënt en de trust.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel29
  - number: '29.2'
    text: 'Het onderzoek stelt het trustkantoor in staat om met betrekking tot de cliënt:'
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel29
  - number: 29.2.a
    text: het integriteitrisicoprofiel van de cliënt vast te stellen;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel29
  - number: 29.2.b
    text: het doel en de beoogde aard van de zakelijke relatie vast te stellen;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel29
  - number: 29.2.c
    text: |-
      een voortdurende controle op de zakelijke relatie en de tijdens de duur van deze relatie verrichte transacties
      uit te oefenen, teneinde zoveel mogelijk met zekerheid vast te stellen dat deze overeenkomen met de kennis die het
      trustkantoor heeft van de cliënt en het risicoprofiel van de cliënt, met zo nodig een onderzoek naar de bron van de
      middelen die bij de zakelijke relatie of de trustdienst worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel29
  - number: 29.2.d
    text: de cliënt te identificeren en diens identiteit te verifiëren;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel29
  - number: 29.2.e
    text: de uiteindelijk belanghebbende van de cliënt vast te stellen;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel29
  - number: 29.2.f
    text: 'indien de cliënt een rechtspersoon is:'
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel29
  - number: 29.2.f.1°
    text: de eigendomsstructuur en de formele zeggenschapsstructuur van de cliënt vast te stellen;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel29
  - number: 29.2.f.2°
    text: |-
      inzicht te verwerven in de feitelijke zeggenschapsstructuur van de cliënt en deze zoveel mogelijk met zekerheid
      vast te stellen;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel29
  - number: 29.2.g
    text: vast te stellen of de natuurlijke persoon die de cliënt vertegenwoordigt daartoe bevoegd is;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel29
  - number: 29.2.h
    text: |-
      zoveel mogelijk met zekerheid vast te stellen of de cliënt ten behoeve van zichzelf optreedt dan wel ten behoeve
      van een derde; en
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel29
  - number: 29.2.i
    text: |-
      in voorkomend geval, de natuurlijke persoon, bedoeld in onderdeel g, alsmede de derde, bedoeld in onderdeel h, te
      identificeren en diens identiteit te verifiëren.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel29
  - number: '29.3'
    text: 'Het onderzoek stelt het trustkantoor in staat om met betrekking tot de trust:'
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel29
  - number: 29.3.a
    text: de uiteindelijk belanghebbende van de trust vast te stellen;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel29
  - number: 29.3.b
    text: het transactieprofiel van de trust vast te stellen;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel29
  - number: 29.3.c
    text: de vermogenspositie van de insteller van de trust zoveel mogelijk met zekerheid vast te stellen;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel29
  - number: 29.3.d
    text: |-
      zoveel mogelijk met zekerheid vast te stellen dat het aan de vermogenspositie als bedoeld in onderdeel c verbonden
      vermogen uit legitieme bron afkomstig is;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel29
  - number: 29.3.e
    text: de herkomst van het vermogen van de trust vast te stellen; en
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel29
  - number: 29.3.f
    text: de herkomst en bestemming van middelen van de trust vast te stellen.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel29
  - number: '30'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld over het cliëntenonderzoek voor het verrichten van
      een andere dienst als bedoeld in onderdeel e van de begripsomschrijving van trustdienst.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel30
  - number: '31.1'
    text: |-
      Indien een cliënt handelt als trustee van een trust of ten behoeve van een andere juridische constructie
      strekt het cliëntenonderzoek zich tevens uit tot de trust of de juridische constructie, waarbij overeenkomstige
      toepassing wordt gegeven aan de [artikelen 27, derde lid][ref1], [28, derde lid][ref2], [29, tweede lid][ref3],
      [30, tweede lid][ref4], en [34][ref5]. Het cliëntenonderzoek stelt het trustkantoor in dat geval eveneens in staat
      om:


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0041583#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0041583#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0041583#Artikel30
      [ref5]: https://wetten.overheid.nl/BWBR0041583#Artikel34
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '27'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0041583
        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref3
        bwb_id: BWBR0041583
        artikel: '29'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref4
        bwb_id: BWBR0041583
        artikel: '30'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref5
        bwb_id: BWBR0041583
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 31.1.a
    text: de vermogenspositie van de insteller van de trust of andere juridische constructie vast te stellen;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel31
  - number: 31.1.b
    text: |-
      zoveel als redelijkerwijs mogelijk is met zekerheid te bepalen dat het aan de vermogenspositie, bedoeld in
      onderdeel a, verbonden vermogen uit legitieme bron afkomstig is;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel31
  - number: 31.1.c
    text: |-
      vast te stellen of de cliënt bevoegd is te handelen als trustee van een trust of ten behoeve van een andere
      juridische constructie; en
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel31
  - number: 31.1.d
    text: vast te stellen door welk recht de trust of andere juridische constructie wordt beheerst.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel31
  - number: '31.2'
    text: |-
      Indien een trustkantoor ingevolge [paragraaf 4.2][ref1] bij het onderzoek naar de uiteindelijk belanghebbende
      informatie vergaart over een trust of soortgelijke juridische constructie:


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0041583
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 31.2.a
    text: |-
      is het een trustkantoor in afwijking van [artikel 23][ref1] toegestaan om de identiteit van de begunstigde van
      een trust of van een soortgelijke juridische constructie pas vast te stellen voorafgaand aan uitbetaling of aan
      het tijdstip waarop de begunstigde zijn definitieve rechten uitoefent, mits de begunstigde voor het aangaan van
      de zakelijke relatie of het verlenen van een trustdienst aan de hand van specifieke kenmerken of naar categorie
      is omschreven en het trustkantoor dan al zodanige informatie inwint dat het in staat is de identiteit van de
      begunstigde vast te stellen voorafgaand aan het tijdstip van uitbetaling of aan het tijdstip waarop de begunstigde
      zijn definitieve rechten uitoefent;


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel23
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 31.2.b
    text: |-
      stelt het trustkantoor vast dat hij gedurende de zakelijke relatie accuraat en ten minste 30 dagen voorafgaand
      wordt geïnformeerd over enige wijziging van de begunstigden van de trust of de soortgelijke juridische constructie.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel31
  - number: '32'
    text: |-
      Indien een cliënt optreedt als vennoot van een personenvennootschap strekt het cliëntenonderzoek
      zich tevens uit tot de personenvennootschap, waarbij overeenkomstige toepassing wordt gegeven aan de
      [artikelen 27, derde lid][ref1], [28, derde lid][ref2], [29, tweede lid][ref3], [30, tweede lid][ref4], en
      [34][ref5]. Het cliëntenonderzoek stelt het trustkantoor in dat geval eveneens in staat om vast te stellen of
      de natuurlijke persoon die de vennoten in de personenvennootschap vertegenwoordigt daartoe bevoegd is en, in
      voorkomend geval, om die persoon te identificeren en diens identiteit te verifiëren.


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0041583#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0041583#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0041583#Artikel30
      [ref5]: https://wetten.overheid.nl/BWBR0041583#Artikel34
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '27'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0041583
        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref3
        bwb_id: BWBR0041583
        artikel: '29'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref4
        bwb_id: BWBR0041583
        artikel: '30'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref5
        bwb_id: BWBR0041583
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: '33.1'
    text: |-
      Een trustkantoor verricht in aanvulling op [paragraaf 4.2][ref1] verscherpt cliëntenonderzoek indien de zakelijke
      relatie of trustdienst naar zijn aard een hoger risico op witwassen of financieren van terrorisme met zich brengt.


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0041583
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '33.2'
    text: |-
      Een trustkantoor houdt ten minste rekening met de risicofactoren, bedoeld in bijlage III behorende bij de vierde
      anti-witwasrichtlijn, om vast te stellen of het eerste lid, onderdeel a, van toepassing is.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel33
  - number: '34.1'
    text: |-
      Een trustkantoor beschikt over passende risicobeheersystemen, waaronder op risico gebaseerde procedures, om
      te bepalen of de cliënt, de uiteindelijk belanghebbende van de cliënt of de uiteindelijk belanghebbende van de
      doelvennootschap:
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel34
  - number: 34.1.a
    text: een politiek prominente persoon is;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel34
  - number: 34.1.b
    text: een familielid van een politiek prominente persoon is; of
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel34
  - number: 34.1.c
    text: een persoon bekend als naaste geassocieerde van een politiek prominente persoon is.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel34
  - number: '34.2'
    text: |-
      Onverminderd [artikel 33, eerste lid][ref1], past een trustkantoor de volgende maatregelen toe bij het aangaan
      of voortzetten van een zakelijke relatie of het verlenen van een trustdienst waarbij de cliënt, de uiteindelijk
      belanghebbende van de cliënt of de uiteindelijk belanghebbende van de doelvennootschap een persoon is als bedoeld
      in de onderdelen a tot en met c van het eerste lid:


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel33
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '33'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 34.2.a
    text: |-
      voor het aangaan of voortzetten van deze zakelijke relatie of het verlenen van deze trustdienst, is de toestemming
      vereist van een persoon die het dagelijks beleid van het trustkantoor bepaalt; en
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel34
  - number: 34.2.b
    text: de zakelijke relatie wordt doorlopend aan verscherpte controle onderworpen.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel34
  - number: '34.3'
    text: |-
      Indien een cliënt, een uiteindelijk belanghebbende van een cliënt of een uiteindelijk belanghebbende van een
      doelvennootschap niet langer een politiek prominente publieke functie bekleedt, past het trustkantoor passende
      risicogebaseerde maatregelen ten minste gedurende 12 maanden toe, of zoveel langer als nodig totdat deze persoon
      niet langer het hoger risico met zich brengt dat hoort bij politiek prominente personen.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel34
  - number: '34.4'
    text: |-
      Indien een cliënt, een uiteindelijk belanghebbende van een cliënt of een uiteindelijk belanghebbende van een
      doelvennootschap gedurende de zakelijke relatie een persoon als bedoeld in het eerste lid wordt of blijkt te zijn,
      voldoet het trustkantoor onverwijld nadat hiervan is gebleken aan [artikel 33][ref1] en aan het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel33
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '33'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: '35'
    text: |-
      Een trustkantoor neemt redelijke maatregelen om alle complexe en ongebruikelijk grote transacties en alle
      ongebruikelijke transactiepatronen die geen duidelijk economisch of rechtmatig doel hebben te onderzoeken en
      onderwerpt de gehele zakelijke relatie met de cliënt in dat geval aan een verscherpte controle.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel35
  - number: '37.1'
    text: |-
      Een trustkantoor dat of een introducerende instelling die uitvoering heeft gegeven aan de voorschriften in
      [hoofdstuk 4][ref1] legt de daartoe gebruikte gegevens vast.


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0041583
        hoofdstuk: '4'
  - number: '37.2'
    text: |-
      Een trustkantoor dat op grond van deze wet een persoon heeft geïdentificeerd en zijn
      identiteit heeft geverifieerd, of bij wie een cliënt is geïntroduceerd door een introducerende
      instelling met inachtneming van [artikel 23][ref1], legt op opvraagbare wijze de in
      [artikel 33 van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref2] bedoelde gegevens vast.


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel33
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '33'
  - number: '37.3'
    text: |-
      Een trustkantoor neemt redelijke maatregelen om ervoor te zorgen dat de in het eerste en tweede lid bedoelde
      gegevens actueel gehouden worden.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel37
  - number: '37.4'
    text: |-
      Een trustkantoor bewaart de in het eerste en tweede lid bedoelde gegevens op toegankelijke wijze gedurende
      vijf jaar na het tijdstip van het beëindigen van de zakelijke relatie of tot vijf jaar na het verlenen van de
      desbetreffende trustdienst.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel37
  - number: '38'
    text: |-
      Een trustkantoor houdt de volgende gegevens met betrekking tot de eigen organisatie actueel en op een
      overzichtelijke wijze te allen tijde beschikbaar:
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel38
  - number: 38.a
    text: |-
      een uittreksel van de inschrijving van het trustkantoor in het handelsregister, bedoeld in
      [artikel 2 van de Handelsregisterwet 2007][ref1], en een actueel overzicht van de personen die het beleid van het
      trustkantoor bepalen of mede bepalen, met vermelding van volledige naam, adres en woonplaats;


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel2
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '2'
  - number: 38.b
    text: |-
      een overzicht van houders van een gekwalificeerde deelneming in het trustkantoor, met vermelding van volledige
      naam, adres, woonplaats en omvang van de gehouden deelneming;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel38
  - number: 38.c
    text: een afschrift van de statuten van het trustkantoor;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel38
  - number: 38.d
    text: |-
      een overzicht van de formele en feitelijke zeggenschapsstructuur en zeggenschapsverhoudingen van het trustkantoor
      en van de groep waartoe het trustkantoor behoort;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel38
  - number: 38.e
    text: een structuuroverzicht van de groep waartoe het trustkantoor behoort;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel38
  - number: 38.f
    text: |-
      de vastgestelde jaarrekeningen over de afgelopen drie boekjaren dan wel de voorlopige jaarcijfers indien een
      jaarrekening nog niet is vastgesteld;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel38
  - number: 38.g
    text: |-
      het beleid, bedoeld in [artikel 14][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel14
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '14'
        hoofdstuk: '3'
  - number: 38.h
    text: |-
      de overeenkomsten, bedoeld in [artikel 16][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel16
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '16'
        hoofdstuk: '3'
  - number: 38.i
    text: |-
      de vastlegging van incidenten, bedoeld in [artikel 20, derde lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel20
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '20'
        hoofdstuk: '3'
  - number: 38.j
    text: |-
      de bescheiden, bedoeld in [artikel 39, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel39
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '39'
        hoofdstuk: '5'
  - number: '39.1'
    text: |-
      Een trustkantoor beschikt over een dienstverleningsdossier voor iedere cliënt. Het dienstverleningsdossier omvat
      informatie over de cliënt, de doelvennootschappen, de trustdiensten die worden verleend en, in voorkomend geval, de
      trust waarvoor het trustkantoor als trustee optreedt.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel39
  - number: '39.2'
    text: 'Een dienstverleningsdossier bevat ten minste de volgende bescheiden:'
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel39
  - number: 39.2.a
    text: |-
      de schriftelijke overeenkomsten tussen het trustkantoor en de cliënt en, indien van toepassing, de doelvennootschap
      en andere overeenkomsten die het trustkantoor heeft gesloten ter zake van de door het trustkantoor geleverde
      trustdiensten;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel39
  - number: 39.2.b
    text: |-
      het acceptatiememorandum, bedoeld in [artikel 26, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel26
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '26'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 39.2.c
    text: een overzicht van de door het trustkantoor geleverde trustdiensten;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel39
  - number: 39.2.d
    text: |-
      de gegevens, bedoeld in [artikel 37][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel37
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '37'
        hoofdstuk: '5'
  - number: 39.2.e
    text: |-
      de vastlegging van incidenten en maatregelen, bedoeld in [artikel 20][ref1], voor zover gerelateerd aan de
      desbetreffende doelvennootschap, cliënt of trustdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel20
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '20'
        hoofdstuk: '3'
  - number: '39.3'
    text: |-
      Een trustkantoor neemt redelijke maatregelen om ervoor te zorgen dat het dienstverleningsdossier voldoende actueel
      gehouden wordt.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel39
  - number: '39.4'
    text: |-
      Het trustkantoor bewaart een dienstverleningsdossier gedurende vijf jaar na het tijdstip van het beëindigen van de
      zakelijke relatie of na het verlenen van de desbetreffende trustdienst.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel39
  - number: '40.1'
    text: |-
      Persoonsgegevens, verzameld op grond van deze wet, worden door een trustkantoor alleen verwerkt met het oog op het
      beheersen van integriteitrisico’s en worden niet verder verwerkt voor commerciële doeleinden of andere doeleinden
      die niet verenigbaar zijn met dat doel.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel40
  - number: '40.2'
    text: |-
      Een trustkantoor verstrekt, alvorens een zakelijke relatie aan te gaan of een incidentele transactie te verrichten,
      informatie aan een cliënt over de krachtens deze wet geldende verplichtingen ter zake van de verwerking van
      persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel40
  - number: '40.3'
    text: |-
      Een trustkantoor vernietigt de persoonsgegevens die het uit hoofde van deze wet heeft verkregen onmiddellijk na het
      verstrijken van de termijn, bedoeld in de [artikelen 37, vierde lid][ref1], en [39, vierde lid][ref2], tenzij bij
      wettelijk voorschrift anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0041583#Artikel39
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '37'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0041583
        artikel: '39'
        hoofdstuk: '5'
  - number: '41.1'
    text: |-
      De Nederlandsche Bank is belast met de bestuursrechtelijke handhaving van de bij of krachtens deze wet gestelde
      regels.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel41
  - number: '41.2'
    text: |-
      De Nederlandsche Bank oefent haar taken op grond van deze wet uit op een risicogebaseerde en effectieve wijze, met
      inachtneming van artikel 48, zesde tot en met achtste lid, van de vierde anti-witwasrichtlijn.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel41
  - number: '41.3'
    text: |-
      De Nederlandsche Bank stelt beleidsregels over de wijze waarop zij in het toezicht op de naleving beoordeelt
      in hoeverre trustkantoren het risico voorkomen op betrokkenheid van het trustkantoor of zijn medewerkers bij
      handelingen die op een dusdanige wijze ingaan tegen hetgeen volgens het ongeschreven recht in het maatschappelijk
      verkeer betaamt, dat hierdoor het vertrouwen in het trustkantoor of in de financiële markten ernstig kan worden
      geschaad.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel41
  - number: '41.4'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de taakuitoefening van de
      Nederlandsche Bank.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel41
  - number: '42.1'
    text: |-
      Met het toezicht op de naleving van de bij of krachtens deze wet gestelde regels zijn belast de bij besluit van de
      Nederlandsche Bank aangewezen personen. Van dat besluit wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel42
  - number: '42.2'
    text: |-
      De personen, bedoeld in het eerste lid, beschikken niet over de bevoegdheden, genoemd in de [artikelen 5:18][ref1]
      en [5:19 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '43.1'
    text: |-
      De Nederlandsche Bank kan voor de vervulling van haar taken op grond van deze wet van een ieder inlichtingen
      vorderen.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel43
  - number: '43.2'
    text: |-
      De [artikelen 5:13][ref1] en [5:20, eerste en tweede lid, van de Algemene wet bestuursrecht][ref2] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '43.3'
    text: |-
      De Nederlandsche Bank is bevoegd tot overeenkomstige toepassing van
      [artikel 5:20, derde lid, van de Algemene wet bestuursrecht][ref1] ten aanzien van de in het eerste lid bedoelde
      inlichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '44'
    text: |-
      Indien de personen, bedoeld in [artikel 42, eerste lid][ref1], bij de uitoefening van hun taak feiten ontdekken die
      kunnen duiden op witwassen of financieren van terrorisme, licht de Nederlandsche Bank de Financiële inlichtingen
      eenheid in, voor zover de gegevens of inlichtingen dienstig zijn voor de uitoefening van de wettelijke taken van de
      Financiële inlichtingen eenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel42
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '42'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '45.1'
    text: |-
      De Nederlandsche Bank kan inlichtingen vragen aan of een onderzoek instellen of doen instellen bij ieder
      ingeschreven trustkantoor dat ingevolge deze wet onder haar toezicht valt, indien:
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel45
  - number: 45.1.a
    text: |-
      dit dient ter uitvoering van verdragen tot uitwisseling van gegevens of inlichtingen, dan wel ter uitvoering van
      bindende besluiten van volkenrechtelijke organisaties met betrekking tot het toezicht op financiële markten of op
      natuurlijke personen, rechtspersonen en vennootschappen die op die markten werkzaam zijn; en
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel45
  - number: 45.1.b
    text: |-
      de inlichtingen worden ingewonnen of het onderzoek wordt ingesteld ten behoeve van een instantie die werkzaam is in
      een staat die met Nederland partij is bij een verdrag of die met Nederland valt onder eenzelfde bindend besluit van
      een volkenrechtelijke organisatie en die in die staat is belast met de uitvoering van wettelijke regelingen inzake
      het toezicht op de financiële markten.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel45
  - number: '45.2'
    text: |-
      Een verzoek om inlichtingen of een onderzoek kan zich tevens richten tot een ieder waarvan redelijkerwijs kan
      worden vermoed dat hij over gegevens of inlichtingen beschikt die van belang kunnen zijn voor de uitvoering van een
      verdrag of besluit als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel45
  - number: '45.3'
    text: |-
      De [artikelen 5:13][ref1] en [5:20, eerste en tweede lid, van de Algemene wet bestuursrecht][ref2] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '45.4'
    text: |-
      De Nederlandsche Bank is bevoegd tot overeenkomstige toepassing van
      [artikel 5:20, derde lid, van de Algemene wet bestuursrecht][ref1] ten aanzien van de in het eerste lid bedoelde
      inlichtingen en onderzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '46'
    text: |-
      De Nederlandsche Bank werkt samen met de toezichthoudende instanties van andere lidstaten, voor zover dat voor de
      vervulling van haar taak op grond van deze wet of de vervulling van de taken van die instanties nodig is.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel46
  - number: '47'
    text: |-
      De Nederlandsche Bank kan een ieder die niet voldoet aan een ingevolge deze wet op hem rustende verplichting
      een aanwijzing geven om binnen een door de Nederlandsche Bank gestelde redelijke termijn ten aanzien van in de
      aanwijzingsbeschikking aan te geven onderwerpen een bepaalde gedragslijn te volgen.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel47
  - number: '48.1'
    text: 'De Nederlandsche Bank kan een last onder dwangsom opleggen ter zake van:'
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel48
  - number: 48.1.a
    text: |-
      overtreding van bij of krachtens de [hoofdstukken 2 tot en met 5][ref1] en [8][ref2] gestelde regels;


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0041583#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0041583
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0041583
        hoofdstuk: '8'
  - number: 48.1.b
    text: |-
      het geen dan wel niet tijdig of onvolledig gevolg geven aan een krachtens [artikel 47][ref1] gegeven aanwijzing.


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel47
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '47'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '48.2'
    text: 'De Nederlandsche Bank kan een bestuurlijke boete opleggen ter zake van:'
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel48
  - number: 48.2.a
    text: |-
      overtreding van bij of krachtens de [hoofdstukken 2 tot en met 5][ref1] en [8][ref2] gestelde regels;


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0041583#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0041583
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0041583
        hoofdstuk: '8'
  - number: 48.2.b
    text: |-
      overtreding van [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 48.2.c
    text: |-
      het geen dan wel niet tijdig of onvolledig gevolg geven aan een krachtens [artikel 47][ref1] gegeven aanwijzing.


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel47
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '47'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '49.1'
    text: |-
      Bij algemene maatregel van bestuur worden voor de verschillende overtredingen de bedragen van de op te leggen
      bestuurlijke boete vastgesteld, met dien verstande dat de bestuurlijke boete voor een afzonderlijke overtreding ten
      hoogste € 5.000.000, of in gevallen bedoeld in het derde lid, ten hoogste € 10.000.000 bedraagt.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel49
  - number: '49.2'
    text: |-
      De overtredingen worden gerangschikt in categorieën naar zwaarte van de overtreding met de daarbij behorende
      basisbedragen, minimumbedragen en maximumbedragen. Daarbij wordt de volgende indeling gebruikt:








                    Categorie


                    Basisbedrag


                    Minimumbedrag


                    Maximumbedrag






                    1


                    € 10.000,–


                    € 0,–


                    € 10.000,–




                    2


                    € 500.000,–


                    € 0,–


                    € 1.000.000,–




                    3


                    € 2.500.000,–


                    € 0,–


                    € 5.000.000,–
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel49
  - number: '49.3'
    text: |-
      Indien ten tijde van het plegen van de overtreding nog geen vijf jaren zijn verstreken sinds het opleggen van een
      bestuurlijke boete aan de overtreder ter zake van eenzelfde overtreding, bedraagt de bestuurlijke boete voor een
      afzonderlijke overtreding ten hoogste € 10.000.000.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel49
  - number: '50.1'
    text: |-
      In afwijking van [artikel 49][ref1] bedraagt de bestuurlijke boete voor een afzonderlijke overtreding van een
      voorschrift gerangschikt in de derde categorie ten hoogste 20% van de netto-omzet van de overtreder in het boekjaar
      voorafgaande aan de beschikking waarmee de bestuurlijke boete wordt opgelegd, indien dit meer is dan € 10.000.000.


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel49
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '49'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '50.2'
    text: |-
      Indien de bestuurlijke boete wordt opgelegd aan een onderneming die opgenomen is in een groep met een
      geconsolideerde jaarrekening, worden bij de berekening van de netto-omzet de totaalbedragen gehanteerd uit de
      geconsolideerde jaarrekening van de uiteindelijke moederonderneming.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel50
  - number: '51'
    text: |-
      De Nederlandsche Bank kan in afwijking van [artikel 49][ref1] of [50][ref2] een bestuurlijke boete opleggen van ten
      hoogste tweemaal het bedrag van het voordeel dat de overtreder door de overtreding heeft verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0041583#Artikel50
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '49'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0041583
        artikel: '50'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '52.1'
    text: |-
      Indien tegen een besluit tot het opleggen van een bestuurlijke boete bezwaar, beroep of hoger beroep wordt
      aangetekend, schorst dit de verplichting tot betaling van de bestuurlijke boete totdat de beroepstermijn is
      verstreken of, indien beroep of hoger beroep is ingesteld, op het beroep of hoger beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel52
  - number: '52.2'
    text: De schorsing van de verplichting tot betaling schorst niet de berekening van de wettelijke rente.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel52
  - number: '53.1'
    text: |-
      Bij een overtreding die beboetbaar is met een boete gerangschikt in de tweede of derde boetecategorie, bedoeld in
      [artikel 49, tweede lid][ref1], kan de Nederlandsche Bank de overtreder, dan wel, indien de overtreding is begaan
      door een rechtspersoon, de natuurlijke personen die tot de betrokken gedraging opdracht hebben gegeven of daar
      feitelijk leiding aan hebben gegeven, de bevoegdheid ontzeggen om bij een trustkantoor of een andere instelling als
      bedoeld in de [Wet ter voorkoming van witwassen en financieren van terrorisme][ref2] beleidsbepalende functies uit
      te oefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0024282
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '49'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0024282
  - number: '53.2'
    text: |-
      Een ontzegging als bedoeld in het eerste lid kan worden opgelegd voor de duur van ten hoogste een jaar en eenmaal
      met ten hoogste een jaar worden verlengd. Ingeval van zwaarwegende omstandigheden kan van de termijnen, genoemd in
      de eerste zin, worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel53
  - number: '54.1'
    text: |-
      De Nederlandsche Bank kan één of meer personen benoemen als curator ten aanzien van alle of bepaalde organen of
      vertegenwoordigers van een trustkantoor indien dat trustkantoor niet voldoet aan hetgeen ingevolge deze wet is
      bepaald.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel54
  - number: '54.2'
    text: 'Het benoemingsbesluit wordt slechts genomen:'
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel54
  - number: 54.2.a
    text: |-
      nadat door het trustkantoor niet of niet volledig binnen de gestelde termijn aan een aanwijzing als bedoeld in
      [artikel 47][ref1] gevolg is gegeven; of


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel47
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '47'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 54.2.b
    text: |-
      indien een overtreding ingevolge deze wet een adequate functionering van het trustkantoor ernstig in gevaar
      brengt en dat trustkantoor voorafgaand in de gelegenheid is gesteld zijn zienswijze naar voren te brengen over het
      voorgenomen besluit.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel54
  - number: '54.3'
    text: |-
      Het benoemingsbesluit bevat in ieder geval een beschrijving van de belangen waardoor de curator zich dient te
      laten leiden. De Nederlandsche Bank benoemt de curator voor ten hoogste twee jaren, met de mogelijkheid om deze
      termijn telkens voor ten hoogste een jaar te verlengen. De verlenging wordt terstond van kracht. Met ingang
      van het tijdstip waarop het besluit tot benoeming van de curator aan het trustkantoor is bekendgemaakt mogen de
      desbetreffende organen of vertegenwoordigers hun bevoegdheden slechts uitoefenen na goedkeuring door de curator en
      met inachtneming van de opdrachten van de curator.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel54
  - number: '54.4'
    text: 'Na de benoeming van een curator:'
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel54
  - number: 54.4.a
    text: verlenen de organen en de vertegenwoordigers van het trustkantoor de curator alle medewerking;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel54
  - number: 54.4.b
    text: |-
      kan de Nederlandsche Bank de betrokken organen of vertegenwoordigers van het trustkantoor toestaan bepaalde
      rechtshandelingen zonder goedkeuring te verrichten;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel54
  - number: 54.4.c
    text: kan de Nederlandsche Bank te allen tijde de door hem aangewezen curator vervangen;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel54
  - number: 54.4.d
    text: |-
      is voor schade ten gevolge van handelingen, die zijn verricht in strijd met een besluit als bedoeld in het eerste
      lid, elke persoon die deel uitmaakt van het orgaan van het trustkantoor dat deze handelingen verrichtte, hoofdelijk
      aansprakelijk tegenover het trustkantoor, tenzij het verrichten van deze handelingen niet aan hem is te verwijten
      en hij niet nalatig is geweest in het treffen van maatregelen om de gevolgen daarvan af te wenden;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel54
  - number: 54.4.e
    text: |-
      zijn de handelingen, bedoeld in onderdeel d, voor zover deze rechtshandelingen zijn, vernietigbaar, indien de
      wederpartij wist of behoorde te weten dat de vereiste goedkeuring ontbrak.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel54
  - number: '54.5'
    text: |-
      Zodra de omstandigheid, bedoeld in het eerste lid, niet langer aanwezig is, trekt de Nederlandsche Bank het besluit
      tot benoeming van de curator in. De Nederlandsche Bank maakt het besluit tot intrekking onverwijld bekend aan het
      trustkantoor.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel54
  - number: '54.6'
    text: De kosten van de in het eerste lid bedoelde maatregel komen voor rekening van het betrokken trustkantoor.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel54
  - number: '54.7'
    text: |-
      De curator is niet aansprakelijk voor schade veroorzaakt door een handelen of nalaten in de uitoefening van de taak
      op grond van dit artikel, tenzij deze schade in belangrijke mate het gevolg is van een opzettelijk onbehoorlijke
      taakuitoefening of een opzettelijk onbehoorlijke uitoefening van bevoegdheden of in belangrijke mate te wijten is
      aan grove schuld.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel54
  - number: '55.1'
    text: |-
      Het is een ieder die uit hoofde van de toepassing van deze wet of van ingevolge deze wet genomen besluiten enige
      taak vervult of heeft vervuld, verboden van vertrouwelijke gegevens of inlichtingen die ingevolge deze wet dan wel
      ingevolge [titel 5.2 van de Algemene wet bestuursrecht][ref1] zijn verstrekt of verkregen of van een persoon of
      instantie als bedoeld in [artikel 56][ref2] zijn ontvangen, verder of anders gebruik te maken of daaraan verder of
      anders bekendheid te geven dan voor de uitvoering van zijn taak noodzakelijk is of tenzij deze wet anders bepaalt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0041583#Artikel56
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0041583
        artikel: '56'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '55.2'
    text: |-
      De Nederlandsche Bank kan met gebruikmaking van vertrouwelijke gegevens of inlichtingen verkregen bij de uitvoering
      van zijn taak op grond van deze wet, mededelingen doen, indien deze niet kunnen worden herleid tot afzonderlijke
      personen.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel55
  - number: '55.3'
    text: |-
      Het eerste en tweede lid laten ten aanzien van degene op wie het tweede lid van toepassing is, onverlet de
      toepasselijkheid van de bepalingen van het [Wetboek van Strafvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: '56.1'
    text: |-
      De Nederlandsche Bank kan gegevens of inlichtingen, verkregen bij de vervulling van de haar ingevolge deze wet
      opgedragen taak, verstrekken aan Nederlandse of buitenlandse overheidsinstanties, alsmede aan Nederlandse of
      buitenlandse van overheidswege aangewezen instanties die zijn belast met het toezicht op trustkantoren, financiële
      markten of op natuurlijke personen, rechtspersonen, of vennootschappen die op die markten werkzaam zijn, tenzij:
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel56
  - number: 56.1.a
    text: |-
      de verstrekking van gegevens of inlichtingen in internationaal verband niet kan plaatsvinden op basis van
      wederkerigheid;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel56
  - number: 56.1.b
    text: |-
      de gegevens betrekking hebben op een natuurlijke persoon, rechtspersoon of vennootschap waaraan of aan
      wie het trustkantoor diensten verleent, onverlet de toepasselijkheid van de [Sanctiewet 1977][ref1], de
      [Wet ter voorkoming van witwassen en financieren van terrorisme][ref2], de Nederlandse belastingwetgeving,
      de bilaterale belastingverdragen en verdragen tot uitwisseling van gegevens of inlichtingen dan wel de
      toepasselijkheid van bindende besluiten van volkenrechtelijke organisaties met betrekking tot het toezicht op de
      financiële markten of op natuurlijke personen en rechtspersonen die op die markten werkzaam zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0003296
      [ref2]: https://wetten.overheid.nl/BWBR0024282
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0003296
      - id: ref2
        bwb_id: BWBR0024282
  - number: 56.1.c
    text: het doel waarvoor de gegevens of inlichtingen zullen worden gebruikt onvoldoende is bepaald;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel56
  - number: 56.1.d
    text: |-
      het beoogde gebruik van de gegevens of inlichtingen niet past in het kader van het toezicht op trustkantoren,
      financiële markten of op natuurlijke personen, rechtspersonen en vennootschappen die op die markten werkzaam zijn;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel56
  - number: 56.1.e
    text: de verstrekking van de gegevens of inlichtingen zich niet zou verdragen met de Nederlandse wet of de openbare orde;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel56
  - number: 56.1.f
    text: de geheimhouding van de gegevens of inlichtingen niet in voldoende mate is gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel56
  - number: 56.1.g
    text: |-
      de verstrekking van de gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen komen met de belangen die
      deze wet beoogt te beschermen; of
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel56
  - number: 56.1.h
    text: |-
      onvoldoende is gewaarborgd dat de gegevens of inlichtingen niet zullen worden gebruikt voor een ander doel dan
      waarvoor deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel56
  - number: '56.2'
    text: |-
      Voor zover de gegevens of inlichtingen, bedoeld in het eerste lid, zijn verkregen van een buitenlandse
      overheidsinstantie dan wel van een buitenlandse van overheidswege aangewezen instantie, die is belast met het
      toezicht op financiële markten of op natuurlijke personen, rechtspersonen en vennootschappen die op die markten
      werkzaam zijn, verstrekt de Nederlandsche Bank deze niet aan een Nederlandse of buitenlandse instantie als
      bedoeld in het eerste lid, tenzij de buitenlandse instantie waarvan de gegevens of inlichtingen zijn verkregen
      uitdrukkelijk heeft ingestemd met de verstrekking van de gegevens of inlichtingen en in voorkomend geval heeft
      ingestemd met het gebruik voor een ander doel dan waarvoor de gegevens of inlichtingen zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel56
  - number: '56.3'
    text: |-
      Indien een buitenlandse instantie als bedoeld in het eerste of tweede lid aan de Nederlandsche Bank verzoekt om
      de gegevens of inlichtingen die op grond van dat lid zijn verstrekt te mogen gebruiken voor een ander doel dan
      waarvoor zij zijn verstrekt, wordt dat verzoek slechts ingewilligd indien:
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel56
  - number: 56.3.a
    text: het beoogde gebruik niet in strijd is met het eerste lid; en
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel56
  - number: 56.3.b
    text: |-
      die buitenlandse instantie niet op een andere wijze dan in deze wet voorzien vanuit Nederland met inachtneming van
      de daarvoor geldende procedures voor dat andere doel de beschikking over die gegevens of inlichtingen zou kunnen
      verkrijgen.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel56
  - number: '56.4'
    text: |-
      Indien het in het derde lid bedoelde verzoek betrekking heeft op een onderzoek naar strafbare feiten, wordt dit
      niet ingewilligd dan na toestemming van Onze Minister van Veiligheid en Justitie.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel56
  - number: '57.1'
    text: |-
      De Nederlandsche Bank kan gegevens of inlichtingen verkregen bij de vervulling van de haar ingevolge deze wet
      opgedragen taak, verstrekken aan de instantie die is belast met de uitvoering van ingevolge een sanctiebesluit of
      sanctieregeling in de zin van [artikel 1, onderdelen a en b, van de Sanctiewet 1977][ref1] vastgestelde regels,
      voor zover de gegevens of inlichtingen dienstig zijn voor de uitvoering van die regels.


      [ref1]: https://wetten.overheid.nl/BWBR0003296#Artikel1
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0003296
        artikel: '1'
  - number: '57.2'
    text: |-
      De Nederlandsche Bank verstrekt geen gegevens of inlichtingen die zijn verkregen van de Europese Centrale Bank
      of een toezichthoudende instantie, indien deze niet uitdrukkelijk instemt met het verstrekken van de gegevens of
      inlichtingen.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel57
  - number: '58.1'
    text: |-
      De Nederlandsche Bank verstrekt aan de Stichting Autoriteit Financiële Markten de gegevens of inlichtingen die
      zij heeft verkregen bij de vervulling van de haar ingevolge deze wet opgedragen taak en die betrekking hebben op
      de betrouwbaarheid van de personen, bedoeld in [artikel 10, tweede lid][ref1], voor zover deze naar het oordeel
      van de Nederlandsche Bank van belang zijn of zouden kunnen zijn voor het toezicht dat door de Stichting Autoriteit
      Financiële Markten wordt uitgeoefend op grond van de [Wet op het financieel toezicht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '10'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0020368
  - number: '58.2'
    text: |-
      De Nederlandsche Bank verstrekt geen gegevens of inlichtingen als bedoeld in het eerste lid, indien deze zijn
      verkregen van een buitenlandse overheidsinstantie of van een buitenlandse van overheidswege aangewezen instantie
      als bedoeld in [artikel 56][ref1], tenzij die buitenlandse instantie waarvan de gegevens of inlichtingen zijn
      verkregen uitdrukkelijk heeft ingestemd met de verstrekking van de gegevens of inlichtingen en in voorkomend geval
      heeft ingestemd met het gebruik voor een ander doel dan waarvoor de gegevens of inlichtingen zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel56
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '56'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 58a.1
    text: |-
      De Nederlandsche Bank kan gegevens of inlichtingen, verkregen bij de vervulling van de haar ingevolge deze wet
      opgedragen taak, verstrekken aan:
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel58a
  - number: 58a.1.a
    text: |-
      de Belastingdienst, de Fiscale Inlichtingen- en Opsporingsdienst, de Nationale Politie, de Financiële Inlichtingen
      Eenheid of het Openbaar Ministerie, voor zover de gegevens of inlichtingen dienstig zijn voor de uitoefening van
      hun wettelijke taken;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel58a
  - number: 58a.1.b
    text: |-
      een tijdelijke enquêtecommissie van het Europees Parlement, bedoeld in artikel 226 van het Verdrag betreffende de
      werking van de Europese Unie;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel58a
  - number: 58a.1.c
    text: |-
      een commissie, als bedoeld in [artikel 2, tweede lid, van de Wet op de parlementaire enquête 2008][ref1], voor
      zover de gegevens of inlichtingen naar het oordeel van die commissie noodzakelijk zijn voor de vervulling van haar
      taak;


      [ref1]: https://wetten.overheid.nl/BWBR0023825#Artikel2
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0023825
        artikel: '2'
  - number: 58a.1.d
    text: |-
      de Algemene Rekenkamer, voor zover de gegevens of inlichtingen naar het oordeel van de
      Algemene Rekenkamer noodzakelijk zijn voor de uitoefening van haar wettelijke taak op grond van
      [artikel 7.24 van de Comptabiliteitswet 2016][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel7
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '7'
  - number: 58a.2
    text: |-
      [Artikel 56, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel56
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '56'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 58a.3
    text: |-
      De partijen bedoeld in het eerste lid, onderdeel b tot en met d, zijn verplicht tot geheimhouding van de op grond
      van het eerste lid ontvangen vertrouwelijke gegevens of inlichtingen en maken die slechts openbaar indien deze niet
      herleid kunnen worden tot afzonderlijke personen.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel58a
  - number: '59.1'
    text: |-
      De Nederlandsche Bank kan met een verklaring een overtreding van de bij of krachtens deze wet gestelde regels, die
      met de tweede of derde boetecategorie, bedoeld in [artikel 49, tweede lid][ref1], beboetbaar is gesteld en de naam
      van de overtreder openbaar maken.


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel49
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '49'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '59.2'
    text: |-
      De Nederlandsche Bank kan met een waarschuwing een overtreding van de bij of krachtens deze wet gestelde regels
      en de naam van de overtreder openbaar maken, indien het naar het oordeel van de Nederlandsche Bank nodig is om het
      publiek snel en effectief te informeren teneinde schade te voorkomen of te beperken.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel59
  - number: '60'
    text: |-
      De Nederlandsche Bank maakt op grond van [artikel 59][ref1] geen gegevens openbaar, voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel59
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '59'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 60.a
    text: |-
      die gegevens herleidbaar zijn tot een natuurlijk persoon en bekendmaking van zijn persoonsgegevens onevenredig
      zou zijn;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel60
  - number: 60.b
    text: betrokken partijen in onevenredige mate schade zou worden berokkend;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel60
  - number: 60.c
    text: |-
      een lopend strafrechtelijk onderzoek of een lopend onderzoek door de Nederlandsche Bank naar mogelijke
      overtredingen zou worden ondermijnd;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel60
  - number: 60.d
    text: de stabiliteit van het financiële stelsel in gevaar zou worden gebracht; of
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel60
  - number: 60.e
    text: openbaarmaking in strijd is of zou kunnen komen met de belangen die deze wet beoogt te beschermen.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel60
  - number: '61.1'
    text: |-
      De Nederlandsche Bank maakt een besluit tot het opleggen van een bestuurlijke sanctie ingevolge deze wet of
      [artikel 5:20, derde lid, van de Algemene wet bestuursrecht][ref1] openbaar. De openbaarmaking geschiedt zodra het
      besluit onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '61.2'
    text: |-
      Indien tegen een besluit als bedoeld in het eerste lid bezwaar, beroep of hoger beroep is ingesteld, wordt de
      uitkomst daarvan tezamen met het besluit openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel61
  - number: '61.3'
    text: |-
      In aanvulling op [artikel 5:2, eerste lid, onderdeel a, van de Algemene wet bestuursrecht][ref1] wordt onder
      bestuurlijke sanctie mede verstaan: het door de Nederlandsche Bank wegens een overtreding intrekken of beperken van
      een vergunning alsmede het opleggen van een verbod als bedoeld in [artikel 53][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0041583#Artikel53
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0041583
        artikel: '53'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '61.4'
    text: |-
      In afwijking van het eerste lid maakt de Nederlandsche Bank een besluit tot het opleggen van een bestuurlijke
      boete zo spoedig mogelijk openbaar, indien het een bestuurlijke boete betreft ter zake van een overtreding van een
      voorschrift dat op grond van [artikel 49, tweede lid][ref1], is gerangschikt in de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel49
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '49'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '61.5'
    text: |-
      De Nederlandsche Bank maakt in afwijking van het eerste lid een besluit tot het opleggen
      van een last onder dwangsom ingevolge deze wet of [artikel 5:20, derde lid][ref1], juncto
      [artikel 5:32, eerste lid, van de Algemene wet bestuursrecht][ref2] zo spoedig mogelijk openbaar, indien een
      dwangsom wordt verbeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '61.6'
    text: |-
      De Nederlandsche Bank maakt de indiening van een bezwaar of de instelling van een beroep of hoger beroep tegen een
      besluit als bedoeld in het vierde of vijfde lid, alsmede de beslissing op bezwaar en de uitkomst van dat beroep
      of hoger beroep, zo spoedig mogelijk openbaar, tenzij het besluit op grond van [artikel 62][ref1] niet openbaar
      is gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel62
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '62'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: '61.7'
    text: |-
      Een besluit dat ingevolge het eerste, vierde of vijfde lid openbaar is gemaakt, blijft gedurende een periode
      van vijf jaar na bekendmaking beschikbaar op de website van de Nederlandsche Bank, met uitzondering van de
      persoonsgegevens die deel uitmaken van het besluit voor zover enig wettelijk voorschrift aan de openbaarmaking van
      de persoonsgegevens in de weg staat.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel61
  - number: '62.1'
    text: |-
      Openbaarmaking op grond van [artikel 61][ref1] wordt uitgesteld of geschiedt in zodanige vorm dat de openbaar te
      maken gegevens niet herleidbaar zijn tot afzonderlijke personen, voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel61
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '61'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 62.1.a
    text: |-
      die gegevens herleidbaar zijn tot een natuurlijke persoon en bekendmaking van zijn persoonsgegevens onevenredig
      zou zijn;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel62
  - number: 62.1.b
    text: betrokken partijen in onevenredige mate schade zou worden berokkend;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel62
  - number: 62.1.c
    text: |-
      een lopend strafrechtelijk onderzoek of een lopend onderzoek door de Nederlandsche Bank naar mogelijke
      overtredingen zou worden ondermijnd;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel62
  - number: 62.1.d
    text: de stabiliteit van het financiële stelsel in gevaar zou worden gebracht.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel62
  - number: '62.2'
    text: |-
      Openbaarmaking op grond van [artikel 61][ref1] blijft achterwege, indien openbaarmaking overeenkomstig het eerste
      lid:


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel61
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '61'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 62.2.a
    text: |-
      onevenredig zou zijn gezien de geringe ernst van de overtreding, tenzij het een besluit tot het opleggen van een
      bestuurlijke boete betreft;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel62
  - number: 62.2.b
    text: |-
      niet in overeenstemming is met het doel van de opgelegde bestuurlijke sanctie, tenzij het een besluit tot het
      opleggen van een bestuurlijke boete betreft; of
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel62
  - number: 62.2.c
    text: de stabiliteit van het financiële stelsel in gevaar zou brengen.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel62
  - number: '63.1'
    text: |-
      Alvorens over te gaan tot openbaarmaking van gegevens die tot afzonderlijke personen herleidbaar zijn op grond van
      deze paragraaf, neemt de Nederlandsche bank een besluit tot openbaarmaking. Dit besluit bevat de openbaar te maken
      gegevens en de wijze en termijn waarop de openbaarmaking zal plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel63
  - number: '63.2'
    text: |-
      Onverminderd [artikel 4:11 van de Algemene wet bestuursrecht][ref1] kan de Nederlandsche Bank bij het nemen van
      een besluit op grond van [artikel 59][ref2] de toepassing van [artikel 4:8 van de Algemene wet bestuursrecht][ref3]
      achterwege laten, indien van de belanghebbende geen adres bekend is en het adres ook niet met een redelijke
      inspanning kan worden verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0041583#Artikel59
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0041583
        artikel: '59'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '64.1'
    text: |-
      De Nederlandsche Bank gaat pas over tot openbaarmaking op grond van deze afdeling, nadat vijf werkdagen zijn
      verstreken na de dag waarop het besluit tot openbaarmaking aan de belanghebbende is bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel64
  - number: '64.2'
    text: |-
      In afwijking van het eerste lid gaat de Nederlandsche Bank pas over tot openbaarmaking op grond van
      [artikel 59, eerste lid][ref1], nadat het besluit tot openbaarmaking onherroepelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel59
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '59'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: '64.3'
    text: |-
      Indien wordt verzocht om een voorlopige voorziening als bedoeld in
      [artikel 8:81 van de Algemene wet bestuursrecht][ref1] om openbaarmaking op grond van deze afdeling te voorkomen,
      gaat de toezichthouder niet over tot openbaarmaking totdat de voorzieningenrechter uitspraak heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '64.4'
    text: |-
      De toezichthouder beëindigt het openbaar beschikbaar houden van gegevens die tot afzonderlijke personen herleidbaar
      zijn op grond van deze paragraaf onverwijld indien en voor zover:
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel64
  - number: 64.4.a
    text: het besluit tot openbaarmaking wordt ingetrokken; of
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel64
  - number: 64.4.b
    text: het besluit tot openbaarmaking door de bestuursrechter onherroepelijk is vernietigd.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel64
  - number: '64.5'
    text: |-
      In de gevallen, bedoeld in het vierde lid, biedt de toezichthouder de belanghebbende aan de intrekking of de
      vernietiging openbaar te maken.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel64
  - number: '64.6'
    text: |-
      In afwijking van [artikel 61, zesde en zevende lid][ref1], zijn het vierde en vijfde lid van overeenkomstige
      toepassing op een besluit tot openbaarmaking op grond van artikel 61, vierde of vijfde lid, voor zover de
      openbaarmaking in strijd met [artikel 62][ref2] heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0041583#Artikel62
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '61'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref2
        bwb_id: BWBR0041583
        artikel: '62'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: '65.1'
    text: |-
      In afwijking van [artikel 64, eerste lid][ref1], kan de Nederlandsche Bank op een kortere termijn en zo nodig
      onverwijld overgaan tot openbaarmaking op grond van deze paragraaf, voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel64
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '64'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 65.1.a
    text: bescherming van de belangen die deze wet beoogt te beschermen, geen verder uitstel toelaat; of
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel65
  - number: 65.1.b
    text: |-
      de overtreder zelf informatie openbaar heeft gemaakt over de overtreding of het besluit tot het opleggen van een
      bestuurlijke sanctie waarop de openbaarmaking betrekking heeft, en versnelde openbaarmaking in het belang van het
      publiek noodzakelijk is ter bescherming van het vertrouwen in het toezicht op de integriteit van het financiële
      stelsel.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel65
  - number: '65.2'
    text: |-
      In de gevallen bedoeld in het eerste lid kan de Nederlandsche Bank tevens besluiten dat
      [artikel 64, tweede lid][ref1], buiten toepassing blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel64
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '64'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: '65.3'
    text: |-
      De Nederlandsche Bank verricht een redelijke inspanning om de betrokkene voorafgaand aan de openbaarmaking in
      kennis te stellen van de voorgenomen openbaarmaking.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel65
  - number: '65.4'
    text: |-
      Bij openbaarmaking van een besluit tot het opleggen van een bestuurlijke sanctie is [artikel 61, zesde lid][ref1],
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel61
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '61'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: '66.1'
    text: |-
      Indien wordt verzocht om een voorlopige voorziening als bedoeld in
      [artikel 8:81 van de Algemene wet bestuursrecht][ref1] om openbaarmaking op grond van deze paragraaf te voorkomen,
      vindt het onderzoek ter zitting plaats met gesloten deuren.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '66.2'
    text: |-
      Indien de voorzieningenrechter openbaarmaking op grond van deze paragraaf heeft verboden, of indien op grond van
      [artikel 62][ref1] nog geen tot personen herleidbare openbaarmaking heeft plaatsgevonden, vindt het horen van
      belanghebbenden ter zake van het bezwaar tegen het besluit tot openbaarmaking of het besluit tot het opleggen van
      de bestuurlijke sanctie niet in het openbaar plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel62
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '62'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: '66.3'
    text: |-
      Indien de voorzieningenrechter openbaarmaking op grond van deze paragraaf heeft verboden, of indien op grond van
      [artikel 62][ref1] nog geen tot afzonderlijke personen herleidbare openbaarmaking heeft plaatsgevonden, en beroep
      of hoger beroep wordt ingesteld tegen de beslissing op het bezwaar tegen het besluit tot openbaarmaking of het
      besluit tot het opleggen van de bestuurlijke sanctie, vindt het onderzoek ter zitting plaats met gesloten deuren.


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel62
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '62'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: '67.1'
    text: |-
      Een trustkantoor draagt er zorg voor dat alle personen die werkzaamheden voor het trustkantoor verrichten, voor
      zover relevant voor de uitoefening van hun taken en rekening houdend met de risico’s, aard en omvang van het
      trustkantoor, bekend zijn met de bij of krachtens deze wet gestelde regels en periodiek opleidingen genieten die
      hen in staat stellen de verplichtingen ingevolge deze wet volledig uit te voeren.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel67
  - number: '67.2'
    text: |-
      Een trustkantoor stelt ieder kalenderjaar voor de in het eerste lid bedoelde personen een opleidingsprogramma samen
      en legt dit vast.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel67
  - number: '68.1'
    text: |-
      Een trustkantoor onderzoekt of een ander trustkantoor diensten verleent of heeft verleend aan de cliënt of de
      doelvennootschap.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel68
  - number: '68.2'
    text: |-
      Indien een ander trustkantoor diensten verleent of heeft verleend aan de cliënt of de doelvennootschap, doet het
      trustkantoor bij dat andere trustkantoor navraag naar gebleken integriteitrisico’s.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel68
  - number: '68.3'
    text: |-
      Een trustkantoor dat een verzoek ontvangt als bedoeld in het tweede lid, informeert het verzoekende trustkantoor
      onverwijld. Voor zover noodzakelijk om te voldoen aan het verzoek, verstrekt een trustkantoor persoonsgegevens van
      strafrechtelijke aard als bedoeld in de [Uitvoeringswet Algemene verordening gegevensbescherming][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0040940
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0040940
  - number: '68.4'
    text: |-
      Een trustkantoor verstrekt, alvorens een zakelijke relatie aan te gaan of een trustdienst te verlenen, informatie
      aan een cliënt over de krachtens dit artikel op het trustkantoor rustende verplichtingen met betrekking tot het
      verstrekken van informatie aan een ander trustkantoor.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel68
  - number: '68.5'
    text: |-
      Een trustkantoor verstrekt op grond van dit artikel geen informatie over integriteitrisico’s die voor
      inwerkingtreding van deze wet zijn gebleken.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel68
  - number: '69'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel69
  - number: '70.1'
    text: |-
      Een vergunning voor het werkzaam zijn als trustkantoor, verleend op grond van
      [artikel 4 van de Wet toezicht trustkantoren][ref1], wordt na de inwerkingtreding van deze wet gelijkgesteld met
      een vergunning als bedoeld in [artikel 6, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0041583#Artikel6
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0041583
        artikel: '6'
        hoofdstuk: '2'
  - number: '70.2'
    text: |-
      Op aanvragen om een vergunning op grond van [artikel 4 van de Wet toezicht trustkantoren][ref1] waarop op het
      tijdstip van inwerkingtreding van deze wet nog niet is beslist, wordt met toepassing van deze wet beslist. De
      beslistermijn, bedoeld in [artikel 6, vierde lid][ref2], vangt aan op het tijdstip van inwerkingtreding van deze
      wet.


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0041583#Artikel6
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0041583
        artikel: '6'
        hoofdstuk: '2'
  - number: '71.1'
    text: |-
      Een ontheffing, verleend op grond van [artikel 2a, tweede lid, van de Wet toezicht trustkantoren][ref1], wordt na
      de inwerkingtreding van deze wet gelijkgesteld aan een ontheffing als bedoeld in [artikel 5, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0041583#Artikel5
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: 2a
      - id: ref2
        bwb_id: BWBR0041583
        artikel: '5'
        hoofdstuk: '2'
  - number: '71.2'
    text: |-
      Op een aanvraag om een ontheffing als bedoeld in [artikel 2a, tweede lid, van de Wet toezicht trustkantoren][ref1]
      waarop op het tijdstip van inwerkingtreding van deze wet nog niet is beslist, wordt met toepassing van deze wet
      beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel2a
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: 2a
  - number: '72.1'
    text: |-
      Indien de Nederlandsche Bank op grond van [artikel 4, onderdeel a, van de Wet toezicht trustkantoren][ref1]
      de betrouwbaarheid heeft vastgesteld van een persoon als bedoeld in [artikel 10, tweede lid][ref2], staat de
      betrouwbaarheid van die persoon voor de toepassing van artikel 10, tweede lid, van deze wet buiten twijfel,
      zolang niet een wijziging in de relevante feiten of omstandigheden een redelijke aanleiding geeft tot een nieuwe
      beoordeling.


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0041583#Artikel10
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0041583
        artikel: '10'
        hoofdstuk: '3'
  - number: '72.2'
    text: |-
      Indien een persoon als bedoeld in [artikel 10, eerste lid][ref1], op grond van
      [artikel 4, onderdeel b, van de Wet toezicht trustkantoren][ref2] geschikt is bevonden, wordt hij voor de
      toepassing van artikel 10, eerste lid, van deze wet eveneens geschikt geacht, zolang niet een wijziging in de
      relevante feiten of omstandigheden een redelijke aanleiding geeft tot een nieuwe beoordeling.


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0016189#Artikel4
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '10'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0016189
        artikel: '4'
  - number: '73'
    text: |-
      Trustkantoren met zetel in Nederland, die over een vergunning als bedoeld in [artikel 70, eerste lid][ref1],
      beschikken, voldoen binnen zes maanden na het tijdstip van inwerkingtreding van deze wet aan [artikel 13][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0041583#Artikel13
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '70'
        hoofdstuk: '9'
        paragraaf: '9.1'
      - id: ref2
        bwb_id: BWBR0041583
        artikel: '13'
        hoofdstuk: '3'
  - number: '74'
    text: |-
      Ten aanzien van cliënten waarnaar reeds cliëntenonderzoek is verricht op grond van de
      [Wet toezicht trustkantoren][ref1], verricht een trustkantoor het cliëntenonderzoek, bedoeld in
      [hoofdstuk 4][ref2], op het eerste moment dat door de cliënt contact wordt opgenomen met het trustkantoor of zoveel
      eerder als het trustkantoor, met inachtneming van de aan het type cliënt, doelvennootschap, zakelijke relatie, of
      trustdienst verbonden integriteitrisico, aanleiding vindt om het cliëntenonderzoek te doen plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0016189
      [ref2]: https://wetten.overheid.nl/BWBR0041583#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0016189
      - id: ref2
        bwb_id: BWBR0041583
        hoofdstuk: '4'
  - number: '75'
    text: |-
      Op overtredingen die hebben plaatsgevonden en zijn beëindigd voor het tijdstip van inwerkingtreding van deze wet,
      blijven de [hoofdstukken 7][ref1], [7a][ref2] en [8 van de Wet toezicht trustkantoren][ref3] van toepassing zoals
      die luidden onmiddellijk voor het in werking treden van deze wet. [Paragraaf 7.2][ref4] van deze wet is niet van
      toepassing op die overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0016189#Hoofdstuk7a
      [ref3]: https://wetten.overheid.nl/BWBR0016189#Hoofdstuk8
      [ref4]: https://wetten.overheid.nl/BWBR0041583#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0016189
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0016189
        hoofdstuk: 7a
      - id: ref3
        bwb_id: BWBR0016189
        hoofdstuk: '8'
      - id: ref4
        bwb_id: BWBR0041583
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: '76'
    text: |-
      Een wijziging van de vierde anti-witwasrichtlijn gaat voor de toepassing van deze wet gelden met ingang van de dag
      waarop aan de betrokken wijziging uitvoering moet zijn gegeven, tenzij bij besluit van Onze Minister van Financiën,
      dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel76
  - number: '82'
    text: |-
      De [Wet toezicht trustkantoren][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0016189
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0016189
  - number: '83'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de verschillende artikelen of
      onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel83
  - number: '84'
    text: 'Deze wet wordt aangehaald als: Wet toezicht trustkantoren 2018.'
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel84
