  - number: '1.2'
    text: |-
      In deze wet en de daarop rustende bepalingen wordt onder de begrippen «trust», «trustee» en «insteller» verstaan
      hetgeen daaronder in het Verdrag inzake het recht dat toepasselijk is op trusts en inzake de erkenning van trusts
      (Trb. 1985, 141) wordt verstaan.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel1
  - number: '2'
    text: Vergunningen en ontheffingen, verleend ingevolge deze wet, zijn persoonlijk en niet overdraagbaar.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel2
  - number: '3.1'
    text: |-
      Het is een ieder met zetel in Nederland verboden zonder een daartoe door de Nederlandsche Bank verleende vergunning
      beroeps- of bedrijfsmatig trustdiensten te verlenen.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel3
  - number: '3.2'
    text: |-
      Het is een ieder met zetel in een andere lidstaat verboden zonder een daartoe door de Nederlandsche Bank verleende
      vergunning beroeps- of bedrijfsmatig trustdiensten te verlenen naar Nederland, dan wel vanuit een in Nederland
      gelegen bijkantoor beroeps- of bedrijfsmatig trustdiensten te verlenen.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel3
  - number: '3.3'
    text: |-
      Het is een ieder met zetel in een staat die geen lidstaat is verboden beroeps- of bedrijfsmatig naar Nederland
      trustdiensten te verlenen, dan wel vanuit een in Nederland gelegen bijkantoor beroeps- of bedrijfsmatig
      trustdiensten te verlenen.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel3
  - number: '3.4'
    text: 'Het is een ieder verboden:'
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel3
  - number: 3.4.a
    text: |-
      werkzaamheden te verrichten gericht op activiteiten die in strijd zijn met de verboden in het eerste tot en met
      derde lid; of
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel3
  - number: 3.4.b
    text: |-
      zonder vergunning op grond van deze wet werkzaamheden te verrichten gericht op zowel het ter beschikking stellen
      van een postadres of bezoekadres als bedoeld in onderdeel b van de begripsomschrijving van trustdienst, als het
      verrichten van aanvullende werkzaamheden als bedoeld in dat onderdeel, ten behoeve van een en dezelfde natuurlijke
      persoon, rechtspersoon of vennootschap of ten behoeve van een tot dezelfde groep als die rechtspersoon of
      vennootschap behorende, natuurlijke persoon, rechtspersoon of vennootschap.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel3
  - number: '3.5'
    text: 'Het eerste tot en met vierde lid zijn niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel3
  - number: 3.5.a
    text: de Nederlandsche Bank;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel3
  - number: 3.5.b
    text: een lichaam dat krachtens publiekrecht rechtspersoonlijkheid bezit;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel3
  - number: 3.5.c
    text: |-
      een natuurlijke persoon, rechtspersoon of vennootschap die beroeps- of bedrijfsmatig opdrachten van tijdelijke
      aard die betrekking hebben op management- en organisatievraagstukken, met daarbij behorende verantwoordelijkheden
      en bevoegdheden, uitvoert of doet uitvoeren, voor zover deze de diensten, bedoeld in onderdeel a van de
      begripsomschrijving van trustdienst, verleent.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel3
  - number: '3.6'
    text: |-
      Het tweede lid is niet van toepassing op trustkantoren, zonder bijkantoor in Nederland, die beschikken over
      een vergelijkbare vergunning in een andere lidstaat en waarop toezicht wordt uitgeoefend dat in voldoende mate
      waarborgen biedt ten aanzien van de belangen die deze wet beoogt te beschermen.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel3
  - number: 3a.1
    text: |-
      Het is eenieder met zetel in Nederland verboden om beroeps- of bedrijfsmatig gebruik te maken van
      doorstroomvennootschappen ten behoeve van een cliënt.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel3a
  - number: 3a.2
    text: |-
      Onder doorstroomvennootschap wordt verstaan een rechtspersoon of vennootschap die tot dezelfde groep behoort als
      degene die gebruik maakt van deze rechtspersoon of vennootschap ten behoeve van een cliënt.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel3a
  - number: '4.1'
    text: |-
      [Artikel 3, derde lid][ref1], is niet van toepassing op een trustkantoor dat:


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel3
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '3'
        hoofdstuk: '2'
  - number: 4.1.a
    text: zijn zetel heeft in een bij ministeriële regeling aangewezen staat;
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel4
  - number: 4.1.b
    text: in die staat bevoegd is als trustkantoor werkzaam te zijn; en
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel4
  - number: 4.1.c
    text: |-
      beschikt over een vergunning van de Nederlandsche Bank voor het verlenen van trustdiensten naar Nederland, dan wel
      vanuit een in Nederland gelegen bijkantoor.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel4
  - number: '4.2'
    text: |-
      Op grond van het eerste lid, onderdeel a, worden slechts staten aangewezen waar toezicht op het verlenen van
      trustdiensten wordt uitgeoefend dat in voldoende mate waarborgen biedt ten aanzien van de belangen die deze wet
      beoogt te beschermen.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel4
  - number: '4.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het aanwijzen van staten
      als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel4
  - number: '5.1'
    text: |-
      Bij ministeriële regeling kan geheel of gedeeltelijk vrijstelling worden verleend van
      [artikel 3, eerste tot en met derde lid][ref1], [artikel 3a, eerste lid][ref2], en
      [artikel 4, eerste lid, onderdeel c][ref3]. Aan deze vrijstelling kunnen voorschriften worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0041583#Artikel3a
      [ref3]: https://wetten.overheid.nl/BWBR0041583#Artikel4
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0041583
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
