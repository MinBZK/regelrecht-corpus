preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de regels met betrekking tot het toezicht op
    trustkantoren te herzien, door een uitbreiding van de normen inzake de integere en beheerste bedrijfsvoering van
    trustkantoren, een aanscherping van de verplichtingen inzake het verrichten van cliëntenonderzoek en het uitbreiden
    van het instrumentarium voor toezicht en handhaving, en daartoe de Wet toezicht trustkantoren te vervangen, ten
    einde de integriteit van het financiële stelsel in Nederland te bevorderen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *algemene verordening gegevensbescherming:*
      verordening (EU) 2016/679 van het Europees Parlement en de Raad van 27 april 2016 betreffende de bescherming van
      natuurlijke personen in verband met de verwerking van persoonsgegevens en betreffende het vrije verkeer van die
      gegevens en tot intrekking van [Richtlijn 95/46/EG](31995L0046) (algemene verordening gegevensbescherming) (PbEU
      2016, 119);
        - *belastingadvies:* adviseren over de opzet, inrichting of werking van structuren van rechtspersonen en
      vennootschappen gericht op de toepassing van internationaal en nationaal belastingrecht;
        - *bijkantoor:* duurzaam in een andere staat dan de staat van de zetel aanwezig onderdeel zonder
      rechtspersoonlijkheid van een trustkantoor;
        - *cliënt:* natuurlijke persoon, rechtspersoon of vennootschap met wie een zakelijke relatie wordt aangegaan of die
      een trustdienst laat verrichten;
        - *de Nederlandsche Bank:* De Nederlandsche Bank N.V.;
        - *doelvennootschap:* rechtspersoon of vennootschap waaraan de trustdiensten, bedoeld in de onderdelen a en b van
      de begripsomschrijving van trustdienst, worden verleend;
        - *familielid van een politiek prominente persoon:* familielid van een politiek prominente persoon als bedoeld in
      de [Wet ter voorkoming van witwassen en financieren van terrorisme][ref1];
        - *financieren van terrorisme:* gedraging strafbaar gesteld in
      [artikel 421, eerste lid, van het Wetboek van Strafrecht][ref2];
        - *Financiële inlichtingen eenheid:* Financiële inlichtingen eenheid, bedoeld in
      [artikel 12, eerste lid, van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref3];
        - *gekwalificeerde deelneming:* rechtstreeks of middellijk belang van ten minste tien procent van het geplaatste
      aandelenkapitaal of een daarmee vergelijkbaar belang, of het rechtstreeks of middellijk kunnen uitoefenen van ten
      minste tien procent van de stemrechten of een daarmee vergelijkbare zeggenschap;
        - *groep:* economische eenheid waarin natuurlijke personen, rechtspersonen, en vennootschappen organisatorisch
      zijn verbonden;
        - *identificeren:* opgave van de identiteit laten doen;
        - *integriteitrisico:* a. risico van ontoereikende naleving van hetgeen bij of krachtens enig wettelijk voorschrift
      is bepaald; b. risico van betrokkenheid van het trustkantoor of zijn medewerkers bij handelingen die op een
      dusdanige wijze ingaan tegen hetgeen volgens het ongeschreven recht in het maatschappelijk verkeer betaamt, dat
      hierdoor het vertrouwen in het trustkantoor of in de financiële markten ernstig kan worden geschaad;
        - *introducerende instelling:* instelling als bedoeld in
      __REF003___________________________________________________________________________________________________________
      ________________ die behoort tot dezelfde groep als het trustkantoor;
        - *lidstaat:* lidstaat van de Europese Unie of een andere staat die partij is bij de Overeenkomst betreffende de
      Europese Economische Ruimte;
        - *moederonderneming:* moederonderneming als bedoeld in artikel 2, negende lid, van [richtlijn 2013/34]
      (32013L0034)/EU van het Europees Parlement en de Raad van 26 juni 2013 betreffende de jaarlijkse financiële
      overzichten, geconsolideerde financiële overzichten en aanverwante verslagen van bepaalde ondernemingsvormen,
      tot wijziging van [Richtlijn 2006/43/EG](32006L0043) van het Europees Parlement en de Raad en tot intrekking van
      [Richtlijnen 78/660/EEG](31978L0660) en [83/349/EEG](31983L0349) van de Raad (PbEU 2013, L 182);
        - *Onze Minister:* Onze Minister van Financiën;
        - *personenvennootschap:* een maatschap als bedoeld in [artikel 1655 van Boek 7A van het Burgerlijk Wetboek][ref5],
      een vennootschap onder firma als bedoeld in [artikel 16 van het Wetboek van Koophandel][ref6] en een commanditaire
      vennootschap als bedoeld in [artikel 19 van het Wetboek van Koophandel][ref7], alsmede een maatschap of
      vennootschap naar buitenlands recht die met deze rechtsvormen vergelijkbaar is;
        - *persoon bekend als naaste geassocieerde van een politiek prominente persoon:* persoon
      bekend als naaste geassocieerde van een politiek prominente persoon als bedoeld in de
      [Wet ter voorkoming van witwassen en financieren van terrorisme][ref8];
        - *persoonsgegeven:* persoonsgegeven als bedoeld in artikel 4, eerste lid, van de algemene verordening
      gegevensbescherming;
        - *politiek prominente persoon:* politiek prominente persoon als bedoeld in de
      [Wet ter voorkoming van witwassen en financieren van terrorisme][ref9];
        - *trustdienst:* a. het zijn van bestuurder van een rechtspersoon of vennoot van een vennootschap
      in opdracht van een natuurlijke persoon, rechtspersoon, of vennootschap die niet tot dezelfde
      groep behoort als degene die bestuurder of vennoot is; b. het in opdracht van een niet tot dezelfde
      groep behorende natuurlijke persoon, rechtspersoon of vennootschap, ter beschikking stellen van
      een postadres of bezoekadres als bedoeld in de [artikelen 11, eerste lid, onderdeel c][ref10], en
      [14, eerste lid, onderdeel c, van de Handelsregisterwet 2007][ref11], aan een andere rechtspersoon of vennootschap,
      indien ten minste één van de volgende aanvullende werkzaamheden wordt verricht ten behoeve van die rechtspersoon
      of vennootschap of ten behoeve van een tot dezelfde groep als die rechtspersoon of vennootschap behorende,
      natuurlijke persoon, rechtspersoon of vennootschap: 1°. het geven van juridisch advies of het verlenen van
      bijstand, met uitzondering van het verrichten van receptiewerkzaamheden; 2°. het verzorgen van belastingaangiften
      en daarmee verband houdende werkzaamheden; 3°. het verrichten van werkzaamheden in verband met het opstellen,
      beoordelen of controleren van de jaarrekening of het voeren van administratie; 4°. het werven van een bestuurder
      voor een rechtspersoon of vennootschap; 5°. andere bij algemene maatregel van bestuur aan te wijzen aanvullende
      werkzaamheden; c. het verkopen van of bemiddelen bij de verkoop van rechtspersonen; d. het zijn van een trustee in
      opdracht van een niet tot dezelfde groep behorende natuurlijke persoon, rechtspersoon of vennootschap; e. andere
      bij algemene maatregel van bestuur aan te wijzen diensten;
        - *trustkantoor:* degene die, al dan niet tezamen met andere natuurlijke personen, rechtspersonen of
      vennootschappen, beroeps- of bedrijfsmatig een of meer trustdiensten verleent;
        - *uiteindelijk belanghebbende:* uiteindelijk belanghebbende als bedoeld in
      [artikel 1 van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref12];
        - *vierde anti-witwasrichtlijn:* [richtlijn 2015/849](32015L0849) van het Europees Parlement en de Raad van
      20 mei 2015 inzake de voorkoming van het gebruik van het financiële stelsel voor het witwassen van geld of
      terrorismefinanciering, tot wijziging van Verordening (EU) nr. 648/2012 van het Europees Parlement en de Raad en
      tot intrekking van [Richtlijn 2005/60](32005L0060) van het Europees Parlement en de Raad en [Richtlijn 2006/70/EG]
      (32006L0070) van de Commissie (PbEU 2015, L 141);
        - *witwassen:* gedragingen strafbaar gesteld in de [artikelen 420bis][ref13], [420bis.1][ref14], [420ter][ref15],
      [420quater][ref16] en [420quater.1 van het Wetboek van Strafrecht][ref17];
        - *zakelijke relatie:* zakelijke, professionele of commerciële relatie tussen een trustkantoor en een natuurlijke
      persoon, een rechtspersoon of een vennootschap, die verband houdt met trustdiensten verleend door het trustkantoor
      en waarvan op het tijdstip dat het contact wordt gelegd, wordt aangenomen dat deze enige tijd zal duren;
        - *zetel:* plaats waar een trustkantoor volgens haar statuten of reglementen is gevestigd of, indien het
      trustkantoor geen rechtspersoon is, de plaats waar het trustkantoor zijn hoofdvestiging heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0024282
