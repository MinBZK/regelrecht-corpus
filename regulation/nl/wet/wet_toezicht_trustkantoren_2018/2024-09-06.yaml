  - number: '5.2'
    text: |-
      De Nederlandsche Bank kan op aanvraag een ontheffing verlenen van [artikel 3, eerste tot en met derde lid][ref1],
      en [artikel 4, eerste lid, onderdeel c][ref2], indien de aanvrager aantoont dat de specifieke situatie van een
      trustkantoor dat rechtvaardigt en dat de belangen die deze wet beoogt te beschermen voldoende worden gewaarborgd.
      Aan een ontheffing kunnen voorschriften worden verbonden en beperkingen worden gesteld. De [artikelen 7][ref3] en
      [8][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0041583#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0041583#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0041583#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0041583#Artikel8
    url: https://wetten.overheid.nl/BWBR0041583/2024-09-06#Artikel5
