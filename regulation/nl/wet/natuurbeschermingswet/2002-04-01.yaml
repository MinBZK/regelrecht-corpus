---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: natuurbeschermingswet
regulatory_layer: WET
publication_date: '1998-07-14'
valid_from: '2002-04-01'
bwb_id: BWBR0002611
url: https://wetten.overheid.nl/BWBR0002611/2002-04-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is bepalingen vast te stellen inzake de natuurbescherming;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Deze wet verstaat onder:'
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Cultuur, Recreatie en Maatschappelijk Werk;'
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel1
  - number: 1.b
    text: |-
      natuurmonumenten: terreinen en wateren, welke van algemeen belang zijn uit een oogpunt van natuurschoon of om hun
      natuurwetenschappelijke betekenis;
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel1
  - number: 1.c
    text: |-
      eigenaar: degene, die in de kadastrale registratie als eigenaar staat vermeld, met dien verstande dat indien op een
      onroerende zaak een eeuwigdurend recht van erfpacht of een recht van beklemming rust, daaronder wordt verstaan de
      erfpachter of de beklemde meier, en dat bij onroerende zaken die aan een niet eeuwigdurend recht van erfpacht, een
      recht van vruchtgebruik of een recht van opstal zijn onderworpen, daaronder mede zijn begrepen degenen, die in de
      kadastrale registratie als erfpachter, vruchtgebruiker of opstalhouder staan vermeld, een en ander voor zover niet
      de rechtstoestand is gebleken een andere te zijn dan de kadastrale registratie aangeeft;
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel1
  - number: 1.d
    text: |-
      gebruiker: degene, die uit hoofde van een andere rechtsverhouding dan onder *c* genoemd een onroerende zaak in
      gebruik heeft.
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel1
  - number: '7.1'
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister, belast met de zorg voor de ruimtelijke ordening, een
      natuurmonument, waarvan de bescherming niet reeds op andere wijze door of krachtens de wet is verzekerd, bij
      beschikking, waarin de kadastrale aanduiding van de desbetreffende onroerende zaken staat vermeld, aanwijzen als
      beschermd natuurmonument.
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel7
  - number: '7.2'
    text: |-
      Een aanwijzing als bedoeld in het eerste lid vindt niet plaats met betrekking tot een natuurmonument, dat eigendom
      is van de Staat.
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel7
  - number: '8.1'
    text: |-
      Alvorens tot aanwijzing over te gaan besluit Onze Minister bij beschikking, waarin de kadastrale aanduiding van de
      desbetreffende onroerende zaken staat vermeld, dat deze aanwijzing in overweging is.
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel8
  - number: '8.2'
    text: |-
      Onze Minister kan in geval van dringende noodzaak bij zijn in het eerste lid bedoelde beschikking dan wel bij
      nadere beschikking bepalen, dat onverwijld alle of de in de beschikking genoemde rechtsgevolgen intreden, welke de
      wet aan de aanwijzing als beschermd natuurmonument verbindt. Met betrekking tot een nadere beschikking als in de
      vorige zin bedoeld is [artikel 9, eerste lid][ref1], voor zoveel nodig van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002611#Artikel9
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002611
        artikel: '9'
        hoofdstuk: III
        afdeling: '1'
  - number: '8.3'
    text: |-
      Deze rechtsgevolgen houden op te gelden, zodra en voor zover Onze Minister bij beschikking besluit niet tot
      aanwijzing over te gaan, doch in ieder geval na verloop van een jaar na het nemen van de in het eerste lid bedoelde
      beschikking.
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel8
  - number: '9.1'
    text: |-
      Onze Minister zendt onverwijld een afschrift van zijn in [artikel 8, eerste lid][ref1], bedoelde beschikking met
      een kaart, waarop het natuurmonument is aangegeven, aan de eigenaren, de ingeschreven hypothecaire schuldeisers,
      burgemeester en wethouders der gemeente, het dagelijks bestuur van het waterschap en gedeputeerde staten der
      provincie, waarin het natuurmonument is gelegen en de Rijksplanologische Commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0002611#Artikel8
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002611
        artikel: '8'
        hoofdstuk: III
        afdeling: '1'
  - number: '9.2'
    text: |-
      Binnen een week na ontvangst van de in het eerste lid bedoelde stukken doen burgemeester en wethouders deze
      ter secretarie gedurende vier weken ter kosteloze inzage voor een ieder nederleggen. De burgemeester maakt die
      nederlegging op de gebruikelijke wijze aan de ingezetenen bekend.
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel9
  - number: '9.3'
    text: |-
      Binnen twee weken na verloop van de termijn van nederlegging kunnen de eigenaren, de ingeschreven hypothecaire
      schuldeisers, burgemeester en wethouders, het dagelijks bestuur van het waterschap en overige belanghebbenden hun
      gevoelen omtrent de in overweging zijnde aanwijzing schriftelijk kenbaar maken aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel9
  - number: '9.4'
    text: |-
      Binnen vier maanden na ontvangst van de in het eerste lid bedoelde stukken zenden gedeputeerde staten alle bij hen
      ingekomen schrifturen, vergezeld van hun beschouwingen, aan Onze Minister, die een en ander onverwijld ter kennis
      brengt van de Rijksplanologische Commissie.
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel9
  - number: '9.5'
    text: |-
      In bijzondere gevallen kan Onze Minister de in het vierde lid genoemde termijn op verzoek van gedeputeerde staten
      met twee maanden verlengen.
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel9
  - number: '9.6'
    text: |-
      Binnen zes of, indien het vijfde lid is toegepast, binnen acht maanden na ontvangst van de in het eerste lid
      bedoelde stukken brengen de Rijksplanologische Commissie omtrent de in overweging zijnde aanwijzing advies uit aan
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel9
  - number: '9.7'
    text: |-
      Binnen een jaar na het nemen van de in [artikel 8, eerste lid][ref1], bedoelde beschikking gaat Onze Minister al
      dan niet tot aanwijzing over, doch niet alvorens hij het in het vorige lid bedoelde advies heeft ontvangen dan wel
      de krachtens dat lid geldende termijn is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0002611#Artikel8
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002611
        artikel: '8'
        hoofdstuk: III
        afdeling: '1'
  - number: '10.1'
    text: |-
      De bekendmaking van de beschikking tot aanwijzing als beschermd natuurmonument, met een kaart waarop het
      natuurmonument is aangegeven, geschiedt door toezending aan de eigenaren. Tegelijkertijd wordt van de beschikking
      op dezelfde wijze mededeling gedaan aan:
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel10
  - number: 10.1.a
    text: de ingeschreven hypothecaire schuldeisers,
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel10
  - number: 10.1.b
    text: burgemeester en wethouders,
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel10
  - number: 10.1.c
    text: het dagelijks bestuur van het waterschap,
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel10
  - number: 10.1.d
    text: gedeputeerde staten,
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel10
  - number: 10.1.e
    text: |-
      overige belanghebbenden die ingevolge [artikel 9, derde lid][ref1], hun gevoelen schriftelijk kenbaar hebben
      gemaakt aan gedeputeerde staten en


      [ref1]: https://wetten.overheid.nl/BWBR0002611#Artikel9
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002611
        artikel: '9'
        hoofdstuk: III
        afdeling: '1'
  - number: 10.1.f
    text: de Rijksplanologische Commissie.
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel10
  - number: '10.2'
    text: |-
      Binnen acht dagen na ontvangst van de in het eerste lid bedoelde stukken doen burgemeester en wethouders deze
      ter secretarie ter kosteloze inzage voor een ieder nederleggen. De burgemeester maakt die nederlegging op de
      gebruikelijke wijze aan de ingezetenen bekend.
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel10
  - number: '10.3'
    text: |-
      Het bij het eerste en tweede lid bepaalde is van overeenkomstige toepassing indien en voor zover Onze Minister niet
      tot aanwijzing overgaat.
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel10
  - number: '11.1'
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister, belast met de zorg voor de ruimtelijke ordening,
      ambtshalve of op verzoek van belanghebbenden een aanwijzing als beschermd natuurmonument bij beschikking, waarin de
      kadastrale aanduiding van de desbetreffende onroerende zaken staat vermeld, geheel of gedeeltelijk intrekken.
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel11
  - number: '11.2'
    text: |-
      Het bepaalde bij de [artikelen 8, eerste lid][ref1], [9][ref2] en [10][ref3] is alsdan van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002611#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002611#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0002611#Artikel10
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002611
        artikel: '8'
        hoofdstuk: III
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002611
        artikel: '9'
        hoofdstuk: III
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002611
        artikel: '10'
        hoofdstuk: III
        afdeling: '1'
  - number: '12.1'
    text: |-
      Het is verboden zonder vergunning van Onze Minister of in strijd met bij zodanige vergunning gestelde voorwaarden
      handelingen te verrichten, te doen verrichten of te gedogen, die schadelijk zijn voor het natuurschoon of voor de
      natuurwetenschappelijke betekenis van een beschermd natuurmonument of die een beschermd natuurmonument ontsieren.
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel12
  - number: '12.2'
    text: |-
      Als schadelijk voor het natuurschoon of voor de natuurwetenschappelijke betekenis van een beschermd natuurmonument
      worden in ieder geval aangemerkt handelingen, die de in de beschikking tot aanwijzing genoemde wezenlijke kenmerken
      van een beschermd natuurmonument aantasten.
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel12
  - number: '12.3'
    text: |-
      Geen vergunning is vereist voor handelingen, welke zijn voorzien in een beheersplan als bedoeld in
      [artikel 14][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002611#Artikel14
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002611
        artikel: '14'
        hoofdstuk: III
        afdeling: '2'
  - number: '13.1'
    text: |-
      Onze Minister bevestigt onverwijld, met vermelding van de datum, de ontvangst van het verzoek om een vergunning.
      Hij zendt gelijktijdig een afschrift van het verzoek en van de ontvangstbevestiging aan gedeputeerde staten en
      burgemeester en wethouders, die binnen twee maanden na de op de ontvangstbevestiging vermelde datum van hun oordeel
      kunnen doen blijken.
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel13
  - number: '13.2'
    text: |-
      Onze Minister beslist op het verzoek binnen drie maanden na de datum van ontvangst. Onze Minister kan de termijn
      met drie maanden verlengen; hij geeft de verzoeker daarvan kennis vóór het verstrijken van de termijn. Onze
      Minister geeft van deze verlenging mede kennis aan gedeputeerde staten en burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel13
  - number: '13.3'
    text: |-
      Indien Onze Minister van oordeel is, dat weigering van een gevraagde vergunning een ander algemeen belang zou
      schaden, weigert hij deze niet alvorens de Rijksplanologische Commissie te hebben gehoord. In zodanig geval kan
      Onze Minister de termijn, binnen welke hij op het verzoek moet beslissen, andermaal met drie maanden verlengen; hij
      geeft de verzoeker daarvan kennis vóór het verstrijken van de eenmaal verlengde termijn. Onze Minister geeft van
      deze verlenging mede kennis aan gedeputeerde staten en burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel13
  - number: '13.4'
    text: |-
      Indien Onze Minister zijn beschikking niet binnen de krachtens het tweede of het derde lid geldende termijn ter
      kennis van de verzoeker heeft gebracht, wordt de vergunning geacht te zijn verleend.
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel13
  - number: '14.1'
    text: |-
      Onze Minister kan in overeenstemming met de eigenaar en de gebruiker, telkens voor een periode van ten hoogste
      drie jaren voor een beschermd natuurmonument of een deel daarvan een beheersplan vaststellen, dat het behoud of
      het herstel van het natuurschoon of van de natuurwetenschappelijke betekenis ten doel heeft. Bij de vaststelling
      van een beheersplan, waaraan voor de betrokkene kosten of lasten zijn verbonden, die redelijkerwijze niet of niet
      geheel te zijnen laste behoren te komen, kent Onze Minister hem op zijn verzoek een uitkering toe.
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel14
  - number: '14.2'
    text: |-
      Onze Minister doet de eigenaar en de gebruiker bij aangetekende brief mededeling van het vastgestelde beheersplan.
      Hij brengt het mede ter kennis van gedeputeerde staten en burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel14
  - number: '14.3'
    text: |-
      De eigenaar en de gebruiker dragen zorg voor de naleving van het beheersplan, ieder voor zover zulks uit de aard
      van zijn recht voortvloeit.
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel14
  - number: '15'
    text: |-
      De eigenaar en de gebruiker zijn verplicht te gedogen, dat een beschermd natuurmonument vanwege Onze Minister door
      de nodige kentekenen als zodanig wordt aangeduid.
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel15
  - number: '16.1'
    text: |-
      Het is verboden een beschermd natuurmonument te verontreinigen, daarin planten, bloemen of takken uit te steken, te
      plukken, af te snijden of te vervoeren, dieren te verontrusten, te vangen of te doden of zulks te pogen of in het
      algemeen daarin schade aan de natuur toe te brengen.
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel16
  - number: '16.2'
    text: 'Dit verbod geldt niet:'
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel16
  - number: 16.2.a
    text: |-
      voor de eigenaar en de gebruiker en hun huisgenoten, onverminderd het bij de [artikelen 12][ref1] en
      [14, derde lid][ref2], bepaalde;


      [ref1]: https://wetten.overheid.nl/BWBR0002611#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0002611#Artikel14
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002611
        artikel: '12'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002611
        artikel: '14'
        hoofdstuk: III
        afdeling: '2'
  - number: 16.2.b
    text: |-
      voor derden, voor zover zij handelingen verrichten, die het gevolg zijn van de uitvoering van een overeenkomst,
      welke de eigenaar of de gebruiker met hen heeft aangegaan vóór de aanwijzing als beschermd natuurmonument dan
      wel na de aanwijzing met inachtneming van de uit de [artikelen 12][ref1] en [14][ref2] voor hem voortvloeiende
      verplichtingen;


      [ref1]: https://wetten.overheid.nl/BWBR0002611#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0002611#Artikel14
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002611
        artikel: '12'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002611
        artikel: '14'
        hoofdstuk: III
        afdeling: '2'
  - number: 16.2.c
    text: voor derden, voor zover zij handelingen verrichten, waarvoor Onze Minister ontheffing heeft verleend.
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel16
  - number: '17'
    text: |-
      Het is verboden, zonder daartoe gerechtigd te zijn, zich te bevinden in of op een water, dat deel uitmaakt van
      een beschermd natuurmonument, indien op duidelijk zichtbare wijze is kenbaar gemaakt, dat de toegang tot dit water
      verboden is.
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel17
  - number: '18.1'
    text: |-
      Indien en voor zover blijkt, dat een belanghebbende ten gevolge van de aanwijzing als beschermd natuurmonument dan
      wel een beschikking als bedoeld in [artikel 8, tweede lid][ref1], of doordat een vergunning is geweigerd dan wel
      aan een vergunning voorwaarden zijn verbonden schade lijdt of zal lijden, welke redelijkerwijze niet of niet geheel
      te zijnen laste behoort te blijven en waarvan de vergoeding niet of niet voldoende door aankoop, onteigening of
      anderszins is verzekerd, kent Onze Minister hem op zijn verzoek een naar billijkheid te bepalen schadevergoeding
      toe. De schadevergoeding kan worden bepaald in geld of op andere wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0002611#Artikel8
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002611
        artikel: '8'
        hoofdstuk: III
        afdeling: '1'
  - number: '18.2'
    text: |-
      Indien ten gevolge van de aanwijzing als beschermd natuurmonument schadevergoeding is toegekend en door de
      verlening van een vergunning de schade geheel of ten dele wordt weggenomen, kan worden bepaald, dat de verleende
      schadevergoeding geheel of ten dele moet worden teruggegeven.
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel18
  - number: '19.1'
    text: |-
      Tegen een besluit op grond van deze wet kan een belanghebbende beroep instellen bij de Afdeling bestuursrechtspraak
      van de Raad van State.
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel19
  - number: '19.2'
    text: |-
      De werking van het besluit, bedoeld in de [artikelen 11, eerste lid][ref1], en [13][ref2], alsmede van een besluit
      tot verlening van een vergunning voor het verrichten van handelingen in een staatsnatuurmonument wordt opgeschort
      totdat de beroepstermijn is verstreken of, indien beroep is ingesteld, op het beroep is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0002611#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002611#Artikel13
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002611
        artikel: '11'
        hoofdstuk: III
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002611
        artikel: '13'
        hoofdstuk: III
        afdeling: '2'
  - number: '20.1'
    text: |-
      Onze Minister doet een beschikking tot aanwijzing als beschermd natuurmonument onverwijld inschrijven in
      de openbare registers, bedoeld in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref1],
      indien de beroepstermijn is verstreken of, indien beroep is ingesteld, op het beroep is beslist.
      [Artikel 24, eerste lid, van Boek 3 van het Burgerlijk Wetboek][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel24
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '24'
  - number: '20.2'
    text: Onze Minister doet dan tevens mededeling van een zodanige beschikking in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel20
  - number: '20.3'
    text: |-
      Indien een zodanige beschikking in beroep is gewijzigd, zijn het eerste en tweede lid van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel20
  - number: '20.4'
    text: 'Onze Minister doet onverwijld mededeling in de *Staatscourant* van een beschikking, waarbij hij besluit:'
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel20
  - number: 20.4.a
    text: dat een aanwijzing in overweging is;
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel20
  - number: 20.4.b
    text: dat de intrekking van een aanwijzing in overweging is;
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel20
  - number: 20.4.c
    text: niet tot aanwijzing over te gaan;
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel20
  - number: 20.4.d
    text: niet tot intrekking van een aanwijzing over te gaan.
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel20
  - number: '20.5'
    text: |-
      Onze Minister doet insgelijks onverwijld mededeling in de *Staatscourant* van een nadere beschikking als bedoeld in
      [artikel 8, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002611#Artikel8
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002611
        artikel: '8'
        hoofdstuk: III
        afdeling: '1'
  - number: '21.1'
    text: |-
      Onze Minister kan, burgemeester en wethouders der gemeente en gedeputeerde staten der provincie gehoord, bij
      beschikking een natuurmonument, dat eigendom is van de Staat, aanwijzen als staatsnatuurmonument en een zodanige
      aanwijzing geheel of gedeeltelijk intrekken.
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel21
  - number: '21.2'
    text: |-
      Indien over een natuurmonument, dat eigendom is van de Staat, zich de bemoeienis uitstrekt van een ander
      departement van algemeen bestuur dan waarvan Onze Minister het hoofd is, neemt deze een beschikking als bedoeld in
      het eerste lid in overeenstemming met Onze Minister, hoofd van dat andere departement.
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel21
  - number: '21.3'
    text: |-
      Het beheer van een staatsnatuurmonument is gericht op het behoud of het herstel van het natuurschoon of van de
      natuurwetenschappelijke betekenis.
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel21
  - number: '21.4'
    text: |-
      Ten aanzien van een staatsnatuurmonument is het bepaalde bij [artikel 16, eerste lid en tweede lid, onder ][ref1],
      en [artikel 17][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002611#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0002611#Artikel17
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002611
        artikel: '16'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002611
        artikel: '17'
        hoofdstuk: III
        afdeling: '2'
  - number: '21.5'
    text: Onze Minister doet van een beschikking als bedoeld in het eerste lid mededeling in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel21
  - number: 25a.1
    text: |-
      Onze Minister verleent vergoedingen voor het richten of mederichten van de bedrijfsvoering van landbouwbedrijven,
      binnen daartoe aangewezen gebieden, op het beheer van natuur en landschap.
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel25a
  - number: 25a.2
    text: Onze Minister kan ter uitvoering van het in het eerste lid gestelde nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel25a
  - number: '28.1'
    text: |-
      Met de opsporing van overtredingen van de bij of krachtens deze wet gestelde voorschriften zijn, behalve de in
      [artikel 141 van het Wetboek van Strafvordering][ref1] aangewezen personen, belast zij die daartoe door Onze
      Minister zijn aangewezen, alsmede de ambtenaren van de rijksbelastingdienst, bevoegd inzake douane.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '28.2'
    text: |-
      Bij het opsporen van een bij deze wet strafbaar gesteld feit hebben de in het eerste lid bedoelde personen toegang
      tot elke plaats, voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is.
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel28
  - number: '29'
    text: |-
      Onze Minister is bevoegd tot toepassing van bestuursdwang ter handhaving van de bij of krachtens deze wet gestelde
      verplichtingen.
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel29
  - number: '30'
    text: |-
      Onze Minister kan ambtenaren aanwijzen, aan wie de in [artikel 5][ref1] beschreven bevoegdheid mede toekomt.


      [ref1]: https://wetten.overheid.nl/BWBR0002611#Artikel5
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002611
        artikel: '5'
        hoofdstuk: II
  - number: '31.1'
    text: |-
      Bij het bestaan van een voornemen tot onteigening in het belang der natuurbescherming krachtens
      [titel VIII der onteigeningswet][ref1] kan Onze Minister met name genoemde handelingen verbieden, die schadelijk
      zijn voor het natuurschoon of voor de natuurwetenschappelijke betekenis van de bij de voorgenomen onteigening
      betrokken onroerende zaak.


      [ref1]: https://wetten.overheid.nl/BWBR0001842
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0001842
  - number: '31.2'
    text: |-
      Het verbod vervalt door de overgang van de eigendom van de zaak op de onteigenende partij alsmede indien het niet
      binnen twee jaar is gevolgd door een zodanige eigendomsovergang, tenzij alsdan een geding aanhangig is als bedoeld
      in [hoofdstuk III van titel I der onteigeningswet][ref1]. Die termijn kunnen Wij bij een in de *Staatscourant* te
      plaatsen besluit met ten hoogste een jaar verlengen.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0001842
        hoofdstuk: III
  - number: '31.3'
    text: |-
      Onze Minister is te allen tijde bevoegd het verbod geheel of gedeeltelijk in te trekken dan wel daarvan ontheffing
      te verlenen.
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel31
  - number: '31.4'
    text: Onze Minister doet van het verbod mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel31
  - number: '32'
    text: |-
      Het Koninklijk besluit van 17 mei 1946, nr. 5, houdende instelling van de Voorlopige Natuurbeschermingsraad, wordt
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel32
  - number: '33'
    text: |-
      In afwijking van het bepaalde bij de [artikelen 119 van de Provinciewet][ref1] en [122 van de Gemeentewet][ref2]
      (*Stb.* 1992, 96) heeft de inwerkingtreding van deze wet slechts ten aanzien van de gevallen, waarin strijd met
      de bij of krachtens haar gestelde voorschriften zou ontstaan, tot gevolg, dat de bepalingen van verordeningen van
      de provinciale staten en van de gemeenteraden betreffende de onderwerpen, waarin deze wet voorziet, van rechtswege
      ophouden te gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel119
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel122
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '119'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '122'
  - number: 33a.1
    text: |-
      Bij algemene maatregel van bestuur kunnen ter uitvoering van krachtens het Verdrag tot oprichting van de Europese
      Economische Gemeenschap vastgestelde verplichtingen inzake onderwerpen waarop deze wet van toepassing is, regels
      worden gesteld. Bij deze regels kan de opsomming van handelingen in de [artikelen 23, eerste lid][ref1], [24][ref2]
      en [24][ref3] worden aangevuld. Voorts kan bij deze regels het gebruik en het bezit van en de handel in daarbij
      aangewezen vangmiddelen geschikt voor het vangen van dieren behorende tot beschermde diersoorten worden verboden of
      aan beperkingen worden onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0002611#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0002611#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0002611#Artikel24a
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0002611
        artikel: '23'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0002611
        artikel: '24'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0002611
        artikel: 24a
        hoofdstuk: V
  - number: 33a.2
    text: |-
      Bij deze regels kan voorts worden afgeweken van het bepaalde in [artikel 22, eerste lid, onder ][ref1], in
      zoverre dat ook andere plante- en diersoorten dan in dat artikel bedoeld, als beschermde plante- onderscheidenlijk
      diersoort kunnen worden aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0002611#Artikel22
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0002611
        artikel: '22'
        hoofdstuk: V
  - number: '34'
    text: Deze wet kan worden aangehaald als "Natuurbeschermingswet".
    url: https://wetten.overheid.nl/BWBR0002611/2002-04-01#Artikel34
