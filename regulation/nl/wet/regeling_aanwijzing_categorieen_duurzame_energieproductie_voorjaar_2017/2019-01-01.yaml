      productie-installatie met een nominaal thermisch vermogen groter dan of gelijk aan 0,5 MW voor de productie van
      warmte door middel van verbranding van vloeibare biomassa als bedoeld in de nummers 500, 550 tot en met 573, 587,
      592, 594, 596 en 802 van de NTA 8003: 2008 in een ketel.

