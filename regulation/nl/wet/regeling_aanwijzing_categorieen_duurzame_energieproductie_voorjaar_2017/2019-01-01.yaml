  - number: '34'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare warmte geproduceerd door:

      a. een productie-installatie, bestaande uit één of meer doubletten, waarmee hernieuwbare warmte wordt geproduceerd
      uitsluitend door middel van één of meer geothermische bronnen met een diepte van ten minste 500 meter;

      b. een productie-installatie, bestaande uit één of meer doubletten waarmee uitsluitend door middel van één of meer
      geothermische bronnen hernieuwbare warmte wordt geproduceerd, gebruikmakend van ten minste één olie- of gasput met
      een diepte van ten minste 500 meter;

      c. een productie-installatie als bedoeld in de onderdelen a, of b, waarvoor op het moment van aanvragen reeds een
      subsidie is verleend op grond van het [besluit][ref1] die wordt uitgebreid met ten minste één aanvullende put met
      een diepte van ten minste 500 meter, of

      d. een productie-installatie, bestaande uit één of meer doubletten, waarmee hernieuwbare warmte wordt geproduceerd
      uitsluitend door middel van één of meer geothermische bronnen met een diepte van ten minste 3.500 meter.


      [ref1]: https://wetten.overheid.nl/BWBR0022735
    url: https://wetten.overheid.nl/BWBR0039165/2019-01-01#Artikel34
