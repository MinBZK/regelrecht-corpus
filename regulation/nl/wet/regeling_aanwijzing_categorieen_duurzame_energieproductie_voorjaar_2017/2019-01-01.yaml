      1 De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare elektriciteit en hernieuwbare
      warmte, of hernieuwbare elektriciteit, geproduceerd door een bestaande productie-installatie waarvoor op grond van
      de MEP of OV-MEP subsidie van meer dan € 0,– is ontvangen en waarvoor op het moment van aanvraag de subsidieperiode
      op grond van de MEP of OV-MEP ten minste 7 jaar daarvoor is aangevangen:

      a. waarmee hernieuwbare elektriciteit en hernieuwbare warmte wordt geproduceerd uitsluitend door middel van
      allesvergisting en waarbij het nominaal elektrisch rendement ten minste 20% bedraagt, of

      b. waarmee hernieuwbare elektriciteit en hernieuwbare warmte wordt geproduceerd uitsluitend door middel van
      vergisting en co-vergisting van dierlijke mest en waarbij het nominaal elektrisch rendement ten minste 20%
      bedraagt.

      2 Indien de aanvrager in aanvulling op de subsidie op grond van de MEP of OV-MEP, subsidie heeft ontvangen op
      grond van [artikel 116, eerste lid, van de Regeling aanwijzing categorieën duurzame energieproductie 2012][ref1],
      [artikel 72, eerste lid, van de Regeling aanwijzing categorieën duurzame energieproductie 2013][ref2],
      [artikel 72, eerste lid, van de Regeling aanwijzing categorieën duurzame energieproductie 2014][ref3], of
      [artikel 44, eerste lid, van de Regeling aanwijzing categorieën duurzame energieproductie 2015][ref4] eindigt de
      subsidieperiode van deze subsidie in ieder geval op het moment dat de subsidieperiode van de subsidie verstrekt op
      grond van het eerste lid aanvangt.


