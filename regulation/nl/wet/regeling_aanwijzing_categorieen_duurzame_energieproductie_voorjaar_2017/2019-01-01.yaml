      1 De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare warmte geproduceerd door een
      productie-installatie voor de productie van warmte door middel van verbranding van vaste of vloeibare biomassa als
      bedoeld in de NTA 8003: 2008, met uitzondering van biomassa als bedoeld in de nummers 100, 150, 170 tot en met 179
      van de NTA 8003: 2008 in een ketel:

      a. met een nominaal thermisch vermogen groter dan of gelijk aan 0,5 MW en kleiner dan 5 MW, of

      b. met een nominaal thermisch vermogen groter dan of gelijk aan 5 MW.

      2 Een producent aan wie subsidie is verstrekt op grond van het eerste lid draagt er zorg voor dat ten minste 95%
      van de energetische waarde van de jaarlijks in de productie-installatie gebruikte brandstof biogeen is.

      3 Een producent aan wie subsidie is verstrekt op grond van het eerste lid draagt er zorg voor dat wordt aangetoond
      dat de gebruikte vloeibare biomassa voldoet aan de duurzaamheidscriteria, bedoeld in artikel 17, eerste lid, van de
      richtlijn hernieuwbare energie.
    url: https://wetten.overheid.nl/BWBR0039165/2019-01-01#Artikel28
