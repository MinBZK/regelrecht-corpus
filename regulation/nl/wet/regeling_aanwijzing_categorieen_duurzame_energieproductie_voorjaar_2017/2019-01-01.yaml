      1 Productie-installaties als bedoeld in de [artikelen 24, eerste lid][ref1], [32, eerste lid, onderdeel a][ref2],
      [42, eerste lid][ref3], [44, eerste lid][ref4], en [46, eerste lid][ref5], worden aangewezen als productie-
      installaties als bedoeld in [artikel 3, eerste lid, onderdeel a, van het besluit][ref6].

      2 Productie-installaties als bedoeld in [artikel 4, onderdeel b][ref7], worden aangewezen als productie-
      installaties als bedoeld in [artikel 3, eerste lid, onderdeel c, en derde lid, onderdeel c, van het besluit][ref8].

      3 Productie-installaties als bedoeld in de [artikelen 24, eerste lid][ref9], [42, eerste lid][ref10],
      [44, eerste lid][ref11], en [46, eerste lid][ref12], worden, indien subsidie is verstrekt op grond van
      [artikel 116, eerste lid, van de Regeling aanwijzing categorieën duurzame energieproductie 2012][ref13],
      [artikel 72, eerste lid, van de Regeling aanwijzing categorieën duurzame energieproductie 2013][ref14],
      [artikel 72, eerste lid, van de Regeling aanwijzing categorieën duurzame energieproductie 2014][ref15] of
      [artikel 44, eerste lid, van de Regeling aanwijzing categorieën duurzame energieproductie 2015][ref16], aangewezen
      als productie-installaties als bedoeld in [artikel 3, tweede lid, onderdeel a, van het besluit][ref17].

      4 Productie-installaties als bedoeld in de [artikelen 32, eerste lid][ref18], en [36, eerste lid][ref19], worden
      aangewezen als productie-installaties als bedoeld in [artikel 3, tweede lid, onderdeel a, van het besluit][ref20].

      5 Productie-installaties als bedoeld in [artikel 34, onderdeel c][ref21], worden aangewezen als productie-
      installaties als bedoeld in [artikel 3, tweede lid, onderdeel b, van het besluit][ref22].

      6 Productie-installaties als bedoeld in de [artikelen 4, onderdeel b][ref23], [6][ref24], [20][ref25], [22][ref26],
      [24, eerste lid][ref27], [32, eerste lid][ref28], [34, onderdelen b en c][ref29], [36, eerste lid][ref30],
      [42, eerste lid][ref31], [44, eerste lid][ref32], [46, eerste lid][ref33], [48][ref34] en [50][ref35], worden
      aangewezen als productie-installaties als bedoeld in [artikel 3, vierde lid, van het besluit][ref36].

      7 Productie-installaties als bedoeld in de [artikelen 4][ref37], [6][ref38], [8, eerste lid][ref39],
      [10, eerste lid][ref40], [12, eerste lid][ref41], [14][ref42], [16][ref43] en [18][ref44] worden aangewezen
      als productie-installaties als bedoeld in [artikel 15, derde, vierde en zesde lid, van het besluit][ref45] met
      dien verstande dat het verschil in kWh dat bij het aantal geproduceerde kWh van het volgende jaar kan worden
      opgeteld, bedoeld in artikel 15, vierde lid, van het besluit, wordt gemaximeerd op 25% van het aantal kWh dat het
      desbetreffende jaar voor subsidie in aanmerking komt.

      8 Productie-installaties als bedoeld in de [artikelen 20][ref46], [22][ref47], [24, eerste lid][ref48],
      en [26, eerste lid][ref49], worden aangewezen als productie-installaties als bedoeld in
      [artikel 32, derde en vierde lid, van het besluit][ref50] met dien verstande dat het verschil in kWh dat bij het
      aantal geproduceerde kWh van het volgende jaar kan worden opgeteld, bedoeld in artikel 32, vierde lid, van het
      besluit, wordt gemaximeerd op 25% van het aantal kWh dat het desbetreffende jaar voor subsidie in aanmerking komt.

      9 Productie-installaties als bedoeld in de [artikelen 20][ref51] en [24, eerste lid][ref52], worden aangewezen als
      productie-installaties als bedoeld in [artikel 32, zesde lid, van het besluit][ref53].

      10 Productie-installaties als bedoeld in [artikel 48][ref54] worden aangewezen als productie-installaties als
      bedoeld in [artikel 32, zevende lid van het besluit][ref55].

      11 Productie-installaties als bedoeld in de [artikelen 28, eerste lid][ref56], [30, eerste lid][ref57],
      [34][ref58], [36, eerste lid][ref59], [38, eerste lid][ref60], [40, eerste lid][ref61], [42, eerste lid][ref62],
      [44, eerste lid][ref63], [46, eerste lid][ref64], [48][ref65] en [50][ref66] worden aangewezen als productie-
      installaties als bedoeld in [artikel 48, derde en vierde lid, van het besluit][ref67] met dien verstande dat het
      verschil in kWh dat bij het aantal geproduceerde kWh van het volgende jaar kan worden opgeteld, bedoeld in artikel
      48, vierde lid, van het besluit, wordt gemaximeerd op 25% van het aantal kWh dat het desbetreffende jaar voor
      subsidie in aanmerking komt.

      12 Productie-installaties als bedoeld in [artikel 32, eerste lid][ref68], worden aangewezen als productie-
      installaties als bedoeld in [artikel 48, derde lid, van het besluit][ref69] met dien verstande dat het verschil
      in kWh dat bij het aantal kWh dat het volgende jaar voor subsidie in aanmerking komt kan worden opgeteld, bedoeld
      in artikel 48, derde lid, van het besluit, wordt gemaximeerd op 25% van het aantal kWh dat het desbetreffende jaar
      voor subsidie in aanmerking komt zonder het daarbij opgetelde verschil in kWh vanwege minder geproduceerde kWh in
      voorgaande jaren. Het verschil in kWh dat bij het aantal kWh dat het volgende jaar voor subsidie in aanmerking komt
      kan worden opgeteld, kan alleen in dit volgende jaar worden benut en kan pas worden benut als het aantal kWh dat
      het desbetreffende jaar voor subsidie in aanmerking komt volledig is benut.

      13 Productie-installaties als bedoeld in de [artikelen 32, eerste lid][ref70], [38, eerste lid][ref71],
      [42, eerste lid][ref72], [44, eerste lid][ref73], [48][ref74], en [50][ref75] worden aangewezen als productie-
      installaties als bedoeld in [artikel 48, zevende lid van het besluit][ref76].

      14 Productie-installaties als bedoeld in de [artikelen 8, eerste lid][ref77], [10, eerste lid][ref78],
      [12, eerste lid][ref79], [20][ref80], [24, eerste lid][ref81], [42, eerste lid][ref82],
      [46, eerste lid][ref83], en [48][ref84] worden aangewezen als productie-installaties als bedoeld in
      [artikel 56, eerste lid, tweede volzin, van het besluit][ref85].


