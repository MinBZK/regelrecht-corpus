    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbaar gas geproduceerd door een
      bestaande productie-installatie waarvoor op grond van de MEP of OV-MEP subsidie van meer dan € 0,– is ontvangen
      en waarvoor op het moment van aanvraag de subsidieperiode op grond van de MEP of OV-MEP ten minste 7 jaar daarvoor
      is aangevangen:

      a. waarmee hernieuwbaar gas wordt geproduceerd uitsluitend door middel van allesvergisting, of

      b. waarmee hernieuwbaar gas wordt geproduceerd uitsluitend door middel van vergisting en co-vergisting van
      dierlijke mest.

      2 Indien de aanvrager, in aanvulling op de subsidie, bedoeld in het eerste
      lid, op grond van de MEP of OV-MEP, subsidie heeft ontvangen op grond van
      [artikel 116 van de Regeling aanwijzing categorieën duurzame energieproductie 2012][ref1],
      [artikel 72 van de Regeling aanwijzing categorieën duurzame energieproductie 2013][ref2],
      [artikel 72 van de Regeling aanwijzing categorieën duurzame energieproductie 2014][ref3] of
      [artikel 44 van de Regeling aanwijzing categorieën duurzame energieproductie 2015][ref4] eindigt de
      subsidieperiode van deze subsidie in ieder geval op het moment dat de subsidieperiode van de subsidie verstrekt op
      grond van het eerste lid aanvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0031291#Artikel116
      [ref2]: https://wetten.overheid.nl/BWBR0032881#Artikel72
      [ref3]: https://wetten.overheid.nl/BWBR0034817#Artikel72
      [ref4]: https://wetten.overheid.nl/BWBR0036245#Artikel44
