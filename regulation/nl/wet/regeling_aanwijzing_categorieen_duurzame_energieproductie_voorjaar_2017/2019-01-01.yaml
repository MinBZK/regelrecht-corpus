  - number: '10'
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare elektriciteit geproduceerd
      door een productie-installatie voor de productie van hernieuwbare elektriciteit met behulp van windenergie
      die is opgericht binnen de beschermingszones van een verbindende waterkering als bedoeld in paragraaf 2.7 van
      [bijlage I van de Regeling veiligheid primaire waterkeringen][ref1] dan wel binnen de kernzone of binnen de
      beschermingszone aan de waterkant van een primaire waterkering grenzend aan de Noordzee, de Westerschelde, de
      Oosterschelde, de Waddenzee, de Dollard of de Eems die wordt gerealiseerd op een locatie die overeenkomstig de
      lijst van gemeenten, bedoeld in [bijlage 2][ref2], een windsnelheid heeft van:

      a. ≥ 8,0 m/s;

      b. ≥ 7,5 en < 8,0 m/s;

      c. ≥ 7,0 en < 7,5 m/s, of

      d. < 7,0 m/s.

      2 Indien de productie-installatie voor de productie van hernieuwbare elektriciteit, bedoeld in het eerste lid,
      wordt opgericht op een locatie waar op het moment van aanvragen één of meer windturbines staan of hebben gestaan,
      verstrekt de minister de subsidie, bedoeld in het eerste lid, uitsluitend indien:

      a. het nominaal en te realiseren vermogen per windturbine ten opzichte van de te vervangen windturbine ten minste 1
      MW toeneemt, of

      b. de te vervangen windturbine op het moment van vervanging 15 jaar op de desbetreffende locatie in gebruik is
      geweest en op het moment van aanvragen ten minste 13 jaar voordien in gebruik is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0022491
      [ref2]: https://wetten.overheid.nl/BWBR0039165
