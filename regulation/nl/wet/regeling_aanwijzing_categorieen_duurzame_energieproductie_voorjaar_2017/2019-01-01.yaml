    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare warmte geproduceerd door een
      productie-installatie voor de productie van industriële stoom door middel van verbranding van houtpellets, in een
      ketel met een nominaal thermisch vermogen groter dan of gelijk aan 5 MW waarin:

      a. houtpellets geproduceerd uit biomassa als bedoeld in de nummers 110 tot en met 132 van de NTA 8003: 2008 worden
      verbrand, en

      b. houtpellets geproduceerd uit biomassa als bedoeld in de nummers 160 tot en met 169 van de NTA 8003: 2008 worden
      verbrand, voor ten hoogste vijftien vijfentachtigste deel van het aantal kWh dat in een kalenderjaar voor subsidie
      in aanmerking komt, geproduceerd met biomassa als bedoeld onder a.

      2 Een producent aan wie subsidie is verstrekt op grond van het eerste lid draagt er zorg voor dat ten minste 95%
      van de energetische waarde van de jaarlijks in de productie-installatie gebruikte brandstof biogeen is.

      3 Een producent aan wie subsidie is verstrekt op grond van het eerste lid draagt er zorg
      voor dat in voldoende aannemelijk wordt gemaakt dat de gebruikte biomassa voldoet aan
      [artikel 7 van de algemene uitvoeringsregeling][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023563#Artikel7
