  - number: '20'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbaar gas geproduceerd door:

      a. een productie-installatie waarmee hernieuwbaar gas wordt geproduceerd uitsluitend door middel van
      allesvergisting, waarbij ten minste de vergister nieuw is;

      b. een productie-installatie waarmee hernieuwbaar gas wordt geproduceerd uitsluitend door middel van vergisting en
      co-vergisting van dierlijke mest, waarbij ten minste de vergister nieuw is, of

      c. een productie-installatie waarmee hernieuwbaar gas wordt geproduceerd uitsluitend door middel van vergisting
      van meer dan 95% dierlijke mest, met een vermogen kleiner dan of gelijk aan 400 kW, waarbij ten minste de vergister
      nieuw is.
    url: https://wetten.overheid.nl/BWBR0039165/2019-01-01#Artikel20
