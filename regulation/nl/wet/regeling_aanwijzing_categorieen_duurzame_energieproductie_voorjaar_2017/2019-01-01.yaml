  - number: '32'
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare elektriciteit of
      hernieuwbare elektriciteit en hernieuwbare warmte uit biomassa geproduceerd door een productie-
      installatie met een nominaal vermogen groter dan of gelijk aan 100 MW voor de productie van
      elektriciteit door middel van kolen en die voldoet aan het netto elektrische rendement, bedoeld in
      [artikel 5.12a, derde lid, van het Activiteitenbesluit milieubeheer][ref1],

      a. waarbij gebruik wordt gemaakt van een bestaande installatie waarvoor op grond van de MEP subsidie van meer dan €
      0,– is ontvangen, waarin:

      1°. biomassa als bedoeld in de nummers 110 tot en met 132 van de NTA 8003: 2008 wordt meegestookt of biomassa als
      bedoeld in de nummers 110 tot en met 132 en 170 tot en met 179 van de NTA 8003: 2008 wordt vergast, en

      2°. biomassa als bedoeld in NTA 8003: 2008, met uitzondering van de nummers 100, 101, 150, 170 tot en met 179,
      wordt meegestookt of vergast voor ten hoogste vijftien vijfentachtigste deel van het aantal kWh dat in een
      kalenderjaar voor subsidie in aanmerking komt, geproduceerd met biomassa als bedoeld onder 1°;

      b. waarbij de delen van de productie-installatie die uitsluitend gebruikt worden voor de meestook van biomassa
      nieuw zijn waarin:

      1°. biomassa als bedoeld in de nummers 110 tot en met 132 van de NTA 8003: 2008 wordt meegestookt, en

      2°. biomassa als bedoeld in NTA 8003: 2008, met uitzondering van de nummers 100, 101, 150, 170 tot en met 179,
      wordt meegestookt voor ten hoogste vijftien vijfentachtigste deel van het aantal kWh dat in een kalenderjaar voor
      subsidie in aanmerking komt, geproduceerd met biomassa als bedoeld onder 1°.

      2 Een producent aan wie subsidie is verstrekt op grond van het eerste lid draagt er zorg voor dat wordt aangetoond
      dat de gebruikte vloeibare biomassa voldoet aan de duurzaamheidscriteria, bedoeld in artikel 17, eerste lid, van de
      richtlijn hernieuwbare energie.

      3 Een producent aan wie subsidie is verstrekt op grond van het eerste lid draagt er zorg voor dat
      voldoende aannemelijk wordt gemaakt dat de gebruikte biomassa, niet zijnde vloeibare biomassa, voldoet aan
      [artikel 7 van de algemene uitvoeringsregeling][ref2].

      4 Indien sprake is van productie van hernieuwbare elektriciteit en hernieuwbare warmte verstrekt de minister
      subsidie voor de geproduceerde hernieuwbare elektriciteit en 15% van de geproduceerde en nuttig aangewende
      hernieuwbare warmte.

      5 De maximale productie, bedoeld in [artikel 2, vijfde lid, van het besluit][ref3], voor de productie van
      hernieuwbare elektriciteit, of hernieuwbare elektriciteit en hernieuwbare warmte op grond van het eerste lid,
      bedraagt 347.653.251 kWh.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel5.12a
      [ref2]: https://wetten.overheid.nl/BWBR0023563#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0022735#Artikel2
    url: https://wetten.overheid.nl/BWBR0039165/2019-01-01#Artikel32
    references:
