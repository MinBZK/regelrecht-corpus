    text: |-
      1 Het subsidieplafond voor het verlenen van subsidie voor de productie van hernieuwbare elektriciteit,
      hernieuwbaar gas en hernieuwbare warmte op grond van de [artikelen 4][ref1], [6][ref2], [8, eerste lid][ref3],
      [10, eerste lid][ref4], [12, eerste lid][ref5], [14][ref6], [16][ref7], [18][ref8], [20][ref9], [22][ref10],
      [24, eerste lid][ref11], [26, eerste lid][ref12], [28, eerste lid][ref13], [30, eerste lid][ref14],
      [32, eerste lid][ref15], [34][ref16], [36, eerste lid][ref17], [38, eerste lid][ref18], [40, eerste lid][ref19],
      [42, eerste lid][ref20], [44, eerste lid][ref21], [46, eerste lid][ref22], [48][ref23], en [50][ref24], die is
      aangevraagd in de periode van 7 maart 2017, 09:00 uur, tot 30 maart 2017, 17:00 uur, bedraagt € 6.000.000.000.

      2 De minister verdeelt het bedrag, genoemd in het eerste lid, op volgorde van binnenkomst van de aanvragen.

      3 Per categorie productie-installaties kan in de periode, genoemd in het eerste lid, per adres waarop een
      productie-installatie wordt geplaatst maximaal één aanvraag worden ingediend.

      4 De minister beslist afwijzend op een aanvraag als bedoeld in het eerste lid indien geen toestemming van de
      eigenaar van de beoogde locatie is verkregen voor het plaatsen van de productie-installatie.

      5 Een subsidie als bedoeld in het eerste lid van meer dan € 400.000.000,– wordt verleend onder de opschortende
      voorwaarde dat binnen twee weken na afgifte van deze beschikking een uitvoeringsovereenkomst overeenkomstig de
      overeenkomst opgenomen in [bijlage 1][ref25] tot stand is gekomen tussen de Staat en de subsidieontvanger en
      onder de opschortende voorwaarde dat de subsidieontvanger binnen vier weken na afgifte van de beschikking heeft
      aangetoond dat een bankgarantie als bedoeld in artikel 2, eerste lid, van de uitvoeringsovereenkomst is afgegeven.

      6 Het vijfde lid is niet van toepassing op een productie-installatie als bedoeld in
      [artikel 9b, eerste lid, onderdeel a, van de Elektriciteitswet 1998][ref26] en op een productie-installatie als
      bedoeld in [artikel 32, eerste lid][ref27].

      7 Indien voor dezelfde periode, of gedeeltelijk voor dezelfde periode, meer beschikkingen zijn afgegeven voor
      dezelfde productie-installatie en dezelfde soort hernieuwbare energie, worden voor de toepassing van het vijfde
      lid de subsidies die de subsidieontvanger ontvangt, bedoeld in [artikel 15][ref28] of [48 van het besluit][ref29],
      van de beschikkingen waarvan de periode waarover subsidie wordt verstrekt nog niet zijn aangevangen bij elkaar
      opgeteld.


