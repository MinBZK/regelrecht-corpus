    text: |-
      1 Subsidie als bedoeld in [artikel 8, eerste lid][ref1], wordt voor een periode van 15 jaar verstrekt.

      2 De subsidieontvanger neemt de productie-installatie, bedoeld in [artikel 8, eerste lid][ref2], binnen 4 jaar na
      de datum van inwerkingtreding van de beschikking tot subsidieverlening in gebruik.


