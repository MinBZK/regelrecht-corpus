    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare elektriciteit geproduceerd door een
      productie-installatie voor de productie van hernieuwbare elektriciteit met behulp van windenergie, en waarvan de
      fundering volledig in het water van een meer van minimaal één vierkante kilometer staat, waarbij het hart van de
      fundering op een afstand van ten minste 25 meter van de waterkant staat.

