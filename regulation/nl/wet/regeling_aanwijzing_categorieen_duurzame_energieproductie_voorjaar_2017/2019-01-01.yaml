      [artikel 14, eerste lid, onderdeel a, van het besluit][ref3], het in de zesde kolom van onderstaande tabel genoemde
      bedrag, en

      2°. voor wat betreft de correcties, bedoeld in [artikel 14, eerste lid, onderdelen b en c, van het besluit][ref4]
      op € 0 per kWh.












