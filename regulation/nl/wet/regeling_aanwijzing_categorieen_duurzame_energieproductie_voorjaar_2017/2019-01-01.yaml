        artikel: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0039165
        artikel: '4'
        paragraaf: '3'
  - number: '6'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare elektriciteit geproduceerd door
      een productie-installatie waarmee hernieuwbare elektriciteit wordt geproduceerd uit gas dat vrijkomt ten gevolge
      van biologische afbraakreacties bij de zuivering van huishoudelijk afvalwater, bedrijfsafvalwater en afvloeiend
      hemelwater, gebruik makende van thermische drukhydrolyse, waarbij ten minste het deel van de productie-installatie,
      dat bedoeld is voor thermische drukhydrolyse nieuw is.
    url: https://wetten.overheid.nl/BWBR0039165/2019-01-01#Artikel6
  - number: '7'
    text: |-
      1 Subsidie als bedoeld in [artikel 6][ref1] wordt voor een periode van 12 jaar verstrekt.

      2 De subsidieontvanger neemt de productie-installatie, bedoeld in [artikel 6][ref2], binnen 4 jaar na de datum van
      inwerkingtreding van de beschikking tot subsidieverlening in gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0039165#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0039165#Artikel6
    url: https://wetten.overheid.nl/BWBR0039165/2019-01-01#Artikel7
