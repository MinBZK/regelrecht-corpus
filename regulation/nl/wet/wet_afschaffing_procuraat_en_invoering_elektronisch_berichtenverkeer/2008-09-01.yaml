preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het wenselijk is het procuraat in burgerlijke zaken af te schaffen
    alsmede elektronisch berichtenverkeer in te voeren en in verband hiermede wijzigingen aan te brengen in de
    Advocatenwet, het Wetboek van Burgerlijke Rechtsvordering en andere wetten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0023725/2008-09-01#ArtikelAanhef
articles:
  - number: LVII
    text: |-
      Van ten tijde van de inwerkingtreding van deze wet bestaande inschrijvingen van advocaten op het tableau van een
      rechtbank wordt door de griffier aan de secretaris van de algemene raad kennisgegeven met het oog op de verwerking
      op het in [artikel I, onderdeel A][ref1], bedoelde tableau van de Nederlandse orde van advocaten.


      [ref1]: https://wetten.overheid.nl/BWBR0023725#ArtikelI
    url: https://wetten.overheid.nl/BWBR0023725/2008-09-01#ArtikelLVII
    references:
      - id: ref1
        bwb_id: BWBR0023725
        artikel: I
  - number: LVIII
    text: |-
      1 De ten tijde van de inwerkingtreding van deze wet in een zaak voor een partij gestelde procureur wordt beschouwd
      als de in deze zaak voor die partij gestelde advocaat.

      2 [Artikel 63, eerste lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1] zoals dit luidde voor de
      inwerkingtreding van deze wet blijft van toepassing op uitspraken voor de inwerkingtreding van deze wet gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel63
    url: https://wetten.overheid.nl/BWBR0023725/2008-09-01#ArtikelLVIII
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '63'
  - number: LIX
    text: |-
      Ten aanzien van de vergoedingen voor handelingen verricht door procureurs voor inwerkingtreding van deze wet blijft
      het recht zoals het gold voor inwerkingtreding van deze wet van toepassing.
    url: https://wetten.overheid.nl/BWBR0023725/2008-09-01#ArtikelLIX
  - number: LX
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0023725/2008-09-01#ArtikelLX
  - number: LXI
    text: 'Deze wet wordt aangehaald als: Wet afschaffing procuraat en invoering elektronisch berichtenverkeer.'
    url: https://wetten.overheid.nl/BWBR0023725/2008-09-01#ArtikelLXI
