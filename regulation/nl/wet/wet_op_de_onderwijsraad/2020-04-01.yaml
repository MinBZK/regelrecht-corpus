preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een vast college van advies van het Rijk in te stellen
    op het terrein van het onderwijs en dat het in verband met artikel 79 van de Grondwet noodzakelijk is daartoe
    wettelijke bepalingen vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008683/2020-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Er is een Onderwijsraad, hierna te noemen de raad.

      2 De raad bestaat uit ten minste acht en, in afwijking van [artikel 10 van de Kaderwet adviescolleges][ref1], ten
      hoogste negentien leden.


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel10
    url: https://wetten.overheid.nl/BWBR0008683/2020-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008159
        artikel: '10'
  - number: '2'
    text: |-
      1 De raad heeft tot taak:

      a. de regering en de beide kamers der Staten-Generaal te adviseren over hoofdlijnen van het beleid en de wetgeving
      op het terrein van het onderwijs in Nederland;

      b. Onze Minister van Onderwijs, Cultuur en Wetenschap desgevraagd te adviseren over de toepassing van wetten,
      algemene maatregelen van bestuur en ministeriële regelingen op het terrein van het onderwijs.

      2 De raad heeft tevens tot taak gemeenteraden en colleges van burgemeester en wethouders in bij de wet genoemde
      gevallen te adviseren over aangelegenheden die het gemeentelijk onderwijsbeleid betreffen.

      3 De raad heeft voorts tot taak eilandsraden en bestuurcolleges van de openbare lichamen Bonaire, Sint Eustatius
      en Saba in bij de wet genoemde gevallen te adviseren over aangelegenheden die het onderwijsbeleid van die openbare
      lichamen betreffen.
    url: https://wetten.overheid.nl/BWBR0008683/2020-04-01#Artikel2
  - number: '18'
    text: |-
      De Wet van 21 februari 1919, houdende instelling van eenen Onderwijsraad (*Stb*. 49), alsmede de in de artikelen 1,
      vierde lid, en 6 van die wet bedoelde uitvoeringsregelingen, worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008683/2020-04-01#Artikel18
  - number: '19'
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin zij wordt
      geplaatst, en werkt wat betreft [hoofdstuk I][ref1] terug tot en met 1 januari 1997.


      [ref1]: https://wetten.overheid.nl/BWBR0008683#HoofdstukI
    url: https://wetten.overheid.nl/BWBR0008683/2020-04-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0008683
        hoofdstuk: I
  - number: '20'
    text: 'Deze wet wordt aangehaald als: Wet op de Onderwijsraad.'
    url: https://wetten.overheid.nl/BWBR0008683/2020-04-01#Artikel20
