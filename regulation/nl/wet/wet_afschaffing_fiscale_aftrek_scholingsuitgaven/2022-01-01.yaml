preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat afschaffing van de fiscale aftrek van scholingsuitgaven en omzetting
    hiervan in een niet-fiscale uitgavenregeling een effectievere en doelmatigere inzet van budgettaire middelen
    mogelijk maakt;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0043046/2022-01-01#ArtikelAanhef
articles:
  - number: III
    text: |-
      1 Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip. De voordracht voor het koninklijk
      besluit wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is
      overgelegd. Indien binnen deze termijn door of namens een van de Kamers of door ten minste een vijfde van het
      grondwettelijk aantal leden van een van de Kamers de wens te kennen wordt gegeven dat de inwerkingtreding van deze
      wet bij wet wordt geregeld, wordt geen voordracht gedaan.

      2 In afwijking van het eerste lid treedt [artikel I, onderdeel D][ref1], in werking met ingang van 1 januari 2031.


      [ref1]: https://wetten.overheid.nl/BWBR0043046#ArtikelI
