articles:
  - number: '1'
    text: |-
      Deze regeling verstaat onder:



            ‘wet’:

              [Boswet][ref1] (Stb. 1961, 256);



            ‘minister’:

              Minister van Landbouw, Natuurbeheer en Visserij


      [ref1]: https://wetten.overheid.nl/BWBR0002357
    url: https://wetten.overheid.nl/BWBR0003518/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002357
  - number: '2'
    text: |-
      Voor bos dat na inwerkingtreding van deze regeling is aangelegd, wordt vrijstelling van het bepaalde bij of
      krachtens de [artikelen 2][ref1] en [3 van de wet][ref2] verleend indien

        - het bos met ter voldoening aan de verplichting tot herbeplanting als bedoeld in [artikel 3 van de wet][ref3]
      is aangelegd;
        - voldaan is aan het bepaalde in de [artikelen 3, eerste lid][ref4], en [4][ref5] van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002357#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002357#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002357#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0003518#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0003518#Artikel4
    url: https://wetten.overheid.nl/BWBR0003518/2015-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002357
        artikel: '2'
      - id: ref2
