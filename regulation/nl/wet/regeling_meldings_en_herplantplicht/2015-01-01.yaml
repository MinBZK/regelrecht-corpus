        bwb_id: BWBR0003518
        artikel: '4'
  - number: '3'
    text: |-
      1 Voordat tot aanleg van het bos wordt overgegaan, dient het tijdstip en de plaats van aanleg middels een formulier
      te worden aangemeld bij de minister en dient de mededeling als bedoeld in het derde lid, te zijn ontvangen.

      2 De minister stelt het model-formulier voor de aanmelding vast. Het model-formulier voorziet onder meer in een
      kadastrale omschrijving van de percelen waar tot aanleg van het bos wordt overgegaan.

      3 Binnen een termijn van twee maanden na ontvangst van het formulier doet de minister mededeling omtrent de
      vrijstelling.
    url: https://wetten.overheid.nl/BWBR0003518/2015-01-01#Artikel3
  - number: '4'
    text: |-
      Het bos dient binnen een periode van 40 jaar na het op het formulier vermelde tijdstip van aanleg in zijn geheel te
      zijn geveld.
    url: https://wetten.overheid.nl/BWBR0003518/2015-01-01#Artikel4
  - number: '5'
    text: De minister bericht de gemeente, waarin de te bebossen grond gelegen is, omtrent de vrijstelling.
    url: https://wetten.overheid.nl/BWBR0003518/2015-01-01#Artikel5
  - number: '6'
    text: |-
      Bos dat valt onder de vrijstelling als omschreven in deze regeling wordt met betrokken bij de bepaling of een
      gevelde houtopstand deel uitmaakt van een boskern als bedoeld in artikel 2, tweede lid, onder d, van het besluit,
      houdende regelen ten aanzien van de verplichting tot herbeplanting, bedoeld in [artikel 3 van de Boswet][ref1]
      (Stb. 1962, 220).


      [ref1]: https://wetten.overheid.nl/BWBR0002357#Artikel3
    url: https://wetten.overheid.nl/BWBR0003518/2015-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002357
        artikel: '3'
  - number: '7'
    text: |-
      1 Deze regeling kan worden aangehaald als: Regeling meldings- en herplantplicht.

      2 Zij treedt in werking met ingang van de dag van haar bekendmaking in de Nederlandse Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003518/2015-01-01#Artikel7
