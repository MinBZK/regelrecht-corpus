preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is met het oog op de nieuwe rechtsorde zekere waarborgen
    van het Rijk jegens bepaalde groepen militairen en gewezen militairen van het voormalige K.N.I.L., alsmede hun
    nagelaten betrekkingen bij de wet vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#ArtikelAanhef
articles:
  - number: '1'
    text: 'Deze wet verstaat onder:'
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel1
  - number: 1.I
    text: '"Militairen":'
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel1
  - number: 1.I.a
    text: |-
      personen, die - voor April 1942 in militaire dienst getreden bij het voormalige Koninklijk Nederlands Indonesisch
      Leger - op 27 December 1949 nog in militaire dienst waren bij dat Leger, voor zover zij Nederlander zijn en zolang
      zij deze status behouden, tenzij [artikel 7][ref1] op hen van toepassing is, dan wel dispensatie is verleend als
      bedoeld in [artikel 4][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002077#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0002077#Artikel4
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002077
        artikel: 7a
      - id: ref2
        bwb_id: BWBR0002077
        artikel: '4'
  - number: 1.I.b
    text: |-
      personen, die - na Maart 1942 in militaire dienst getreden bij het voormalige Koninklijk Nederlands Indonesisch
      Leger - op 27 December 1949 nog in militaire dienst waren bij dat Leger, voor zover zij Nederlander zijn en zolang
      zij deze status behouden, tenzij [artikel 7][ref1] op hen van toepassing is, dan wel dispensatie is verleend als
      bedoeld in [artikel 4][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002077#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0002077#Artikel4
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002077
        artikel: 7a
      - id: ref2
        bwb_id: BWBR0002077
        artikel: '4'
  - number: 1.I.c
    text: |-
      overige personen, die op 27 December 1949 in militaire dienst waren bij het voormalige Koninklijk Nederlands
      Indonesisch Leger.
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel1
  - number: 1.II
    text: |-
      "Beroepsmilitairen": personen, die op 27 December 1949 in vaste militaire dienst waren bij het voormalige
      Koninklijk Nederlands Indonesisch Leger, voor zover zij Nederlander zijn en zolang zij deze status behouden, tenzij
      [artikel 7][ref1] op hen van toepassing is, dan wel dispensatie is verleend als bedoeld in [artikel 4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002077#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0002077#Artikel4
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002077
        artikel: 7a
      - id: ref2
        bwb_id: BWBR0002077
        artikel: '4'
  - number: 1.III
    text: |-
      "Gewezen militairen": personen, die na 9 Mei 1940 en vóór 1 September 1945 uit de militaire dienst bij het
      voormalige Koninklijk Nederlands Indonesisch Leger zijn ontslagen wegens bij bevolen dienstverrichtingen bekomen
      letsel, dan wel in Maart 1942 in militaire dienst waren of na 1 Maart 1942 in militaire dienst zijn getreden bij
      het voormalige Koninklijk Nederlands Indonesisch Leger, na Augustus 1945 in overheidsdienst aan de wederopbouw
      van Indonesië daadwerkelijk hebben medegewerkt dan wel ter beslissing van de commissie daartoe wel bereid
      zijnde, buiten eigen schuld of toedoen daartoe verhinderd zijn geweest en na Augustus 1945 doch vóór 27 December
      1949 uit de dienst zijn ontslagen, voor zover zij Nederlander zijn en zolang zij deze status behouden, tenzij
      [artikel 7][ref1] op hen van toepassing is, dan wel dispensatie is verleend als bedoeld in [artikel 4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002077#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0002077#Artikel4
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002077
        artikel: 7a
      - id: ref2
        bwb_id: BWBR0002077
        artikel: '4'
  - number: 1.IV
    text: |-
      "Nagelaten betrekkingen": betrekkingen van een overleden militair als bedoeld onder I*a*, een overleden
      beroepsmilitair, een overleden gewezen militair, zomede van een Nederlander, wiens overlijden valt of geacht wordt
      te vallen na Maart 1942, dan wel tussen 9 Mei 1940 en April 1942 het gevolg was van bevolen dienstverrichtingen
      en die op het tijdstip van overlijden in militaire dienst was bij het voormalige Koninklijk Nederlands Indonesisch
      Leger, een en ander voor zover zij op grond van dat overlijden gerechtigd zijn tot een uitkering van overheidswege
      en voor zover zij Nederlander zijn en zolang zij deze status behouden, tenzij [artikel 7][ref1] op hen van
      toepassing is, dan wel dispensatie is verleend als bedoeld in [artikel 4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002077#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0002077#Artikel4
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002077
        artikel: 7a
      - id: ref2
        bwb_id: BWBR0002077
        artikel: '4'
  - number: 1.V
    text: |-
      "De commissie": de bevoegde commissie als bedoeld in [artikel 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002077#Artikel7
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002077
        artikel: '7'
  - number: 1.VI
    text: '"Onze Minister": Onze Minister, belast met de uitvoering van de Garantiewet Militairen K.N.I.L.'
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel1
  - number: 1.VII
    text: |-
      "Onze Ministers": Onze Minister, belast met de uitvoering van de Garantiewet Militairen K.N.I.L. en Onze Minister
      van Financiën.
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel1
  - number: 1.VIII
    text: |-
      "Pensioenstichting": Stichting tot verzorging en afwikkeling van pensioensaangelegenheden betreffende gewezen
      overheidspersoneel van Indonesië en hun nagelaten betrekkingen.
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel1
  - number: '2.1'
    text: 'Met inachtneming van hetgeen hierna in deze wet is bepaald garandeert het Rijk:'
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel2
  - number: 2.1.a
    text: |-
      aan de militairen: de voldoening van alle rechten en aanspraken, welke hun uit hoofde van de door hen na 26
      December 1949 bij het voormalige Koninklijk Nederlands Indonesisch Leger verrichte dienst toekwamen volgens de op
      die datum geldende regelingen;
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel2
  - number: 2.1.b
    text: |-
      aan de militairen, behorende tot de in [artikel 1, onder I, sub a][ref1], bedoelde groep: bij ontslag
      overeenkomstig artikel 38 van de "Regelingen betreffende militaire aangelegenheden", II, Hoofdstuk V, gehecht aan
      de Overgangsovereenkomst, behorende bij de Mantelresolutie der Ronde Tafel Conferentie, de voldoening van alle
      rechten en aanspraken, welke zijn vervat in genoemd Hoofdstuk V;


      [ref1]: https://wetten.overheid.nl/BWBR0002077#Artikel1
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002077
        artikel: '1'
  - number: 2.1.c
    text: |-
      aan de gewezen militairen: de voldoening van alle rechten en aanspraken, welke hun op grond van het hun verleende
      ontslag uit de dienst bij het voormalige Koninklijk Nederlands Indonesisch Leger volgens de ten tijde van dat
      ontslag van kracht zijnde regelingen toekomen.
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel2
  - number: '2.2'
    text: |-
      Onverminderd de verplichting tot toekenning en voldoening van weduwenpensioenen, wezenonderstanden en daarmede
      in aard overeenkomende uitkeringen, waartoe het Rijk uit anderen hoofde rechtstreeks gehouden is, garandeert het
      Rijk aan de nagelaten betrekkingen, behoudens en met inachtneming van het bepaalde in de volgende artikelen, de
      voldoening van alle rechten en aanspraken, welke hun volgens de ten tijde van het overlijden van kracht zijnde
      regelingen toekomen, met dien verstande, dat de garantie voor de nagelaten betrekkingen van hem, die na 26 December
      1949 is of zal zijn overleden, de voldoening van alle rechten en aanspraken omvat, welke hun bij toepassing van de
      terzake op 26 December 1949 van kracht zijnde regelingen toekomen.
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel2
  - number: '2.3'
    text: |-
      Aan de beroepsmilitairen, die op de in het eerste lid, onder *b*, bedoelde wijze zijn ontslagen zonder recht op
      pensioen, alsmede aan hun gezinsleden, garandeert het Rijk vrij vervoer naar Nederland op redelijke voorwaarden,
      indien zij op het tijdstip van dat ontslag voldeden aan de voorwaarden, welke voor aanspraak op verlof in
      Europa zijn omschreven in artikel 2, onder *a* en *b* en artikel 3, onder *a* en *b*, van het Buitenlandsch
      verlofreglement voor officieren en onderofficieren, met dien verstande, dat beslissingen over de aanwezigheid
      van bijzondere belangen in Europa worden genomen door de commissie. Onder gezinsleden worden voor de toepassing
      van dit lid verstaan de leden van een gezin, omschreven in artikel 2 van het Koninklijk besluit van 22 Juni 1916
      (*Indisch Stb.* 605), zoals dit luidde op 26 December 1949. In bijzondere gevallen kunnen door Onze Minister in
      overeenstemming met Onze Minister van Financiën ook andere personen als gezinsleden worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel2
  - number: '2.4'
    text: |-
      Op verzoek van betrokkene kan Onze Minister beslissen, dat in de gevallen, waarin recht bestaat op vrije overtocht
      naar Nederland ten laste van het Rijk, in plaats van die vrije overtocht ten laste van het Rijk een geldelijke
      uitkering aan betrokkene wordt toegekend.
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel2
  - number: '3.1'
    text: |-
      De beroepsmilitairen, die niet geplaatst kunnen of konden worden bij de Koninklijke Landmacht en dientengevolge
      voor of op 25 Juli 1950 wegens reorganisatie bij het voormalige Koninklijk Nederlands Indonesisch Leger werden
      ontslagen, kunnen - mits dit ontslag eervol is geweest - desverlangd in aanmerking komen voor toepassing van
      afvloeiingsvoorwaarden, gelijkluidend aan de afvloeiingsvoorwaarden voor overheidsdienaren in vaste dienst,
      opgenomen onder A in de bijlage bij de Overeenkomst inzake de positie van de Burgerlijke Overheidsdienaren in
      verband met de souvereiniteitsoverdracht, echter met aftrek van de inkomsten, welke zij genieten ingevolge de
      sociale voorzieningen als bedoeld in de regelingen, genoemd in [artikel 2, lid 1, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002077#Artikel2
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002077
        artikel: '2'
  - number: '3.2'
    text: |-
      Bij toepassing van de in het vorige lid genoemde afvloeiingsvoorwaarden op beroepsmilitairen, die niet voor
      een diensttijdpensioen in aanmerking komen, worden zij in het genot gesteld van het volgens de betrekkelijke
      rangspensioenreglementen toe te kennen pensioen bij ontslag wegens ziels- of lichaamsgebreken, niet ontstaan in
      en door de dienst, vermeerderd met 1/9 gedeelte van het in die reglementen voor de betrokken rang gestelde normale
      pensioenbedrag, met dien verstande, dat hierdoor het maximum rangspensioen voor de betrokken rang niet wordt
      overschreden.
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel3
  - number: '3.3'
    text: |-
      Het Rijk garandeert aan de beroepsmilitairen, die niet geplaatst kunnen worden bij de Koninklijke Landmacht,
      voorzover zij in het genot van wachtgeld worden gesteld, een minimum wachtgeld volgens door Ons, op voordracht
      van Onze Ministers voor Uniezaken en Overzeese Rijksdelen en van Financiën vast te stellen regelen. Binnen drie
      maanden na de vaststelling van deze regelen wordt door Ons een voorstel van wet aan de Staten-Generaal gedaan tot
      bevestiging van die regelen. De bevestiging geschiedt in de vorm van vaststelling van de betreffende regelen, al
      dan niet gewijzigd, bij de wet.
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel3
  - number: 3a.1
    text: |-
      De beroepsmilitairen, die tengevolge van ontslag overeenkomstig artikel 38 van de "Regelingen betreffende militaire
      aangelegenheden", II, Hoofdstuk V, gehecht aan de Overgangsovereenkomst, behorende bij de Mantelresolutie der Ronde
      Tafel Conferentie, het deelgenootschap in het voormalige "Weduwen- en Wezenfonds der Europese Officieren van het
      Nederlandsch-Indische Leger" dan wel het voormalige "Weduwen- en Wezenfonds van Europese militairen beneden de
      rang van Officier bij de Koloniale Troepen" hebben verloren, kunnen, onder voorwaarde dat zij binnen zes maanden
      na de inwerkingtreding van deze wet bij de Pensioenstichting de wens daartoe schriftelijk te kennen geven, voor hun
      weduwen en wezen het recht herkrijgen op pensioen, onderscheidenlijk onderstand, ten laste van de Pensioenstichting
      op de voet van de rechten en verplichtingen, welke waren verbonden aan het verplichte deelgenootschap in die
      fondsen, zulks gerekend van de datum van de beëindiging van de dienst bij het voormalige Koninklijk Nederlands
      Indonesisch Leger, met dien verstande, dat in de gevallen, bedoeld in het vijfde lid van artikel 41 van genoemde
      regelingen, de verschuldigde bijdragen zullen worden berekend over het wachtgeld, waarvoor de eenmalige uitkering
      in de plaats is getreden.
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel3a
  - number: 3a.2
    text: |-
      Vanaf het tijdstip, waarop de door de in het vorige lid bedoelde beroepsmilitairen terzake van de dienstbeëindiging
      genoten inkomsten blijvend ophouden dan wel - in de gevallen dat daarvoor een eenmalige uitkering in de plaats
      is getreden - zouden zijn opgehouden, worden de door hen verschuldigde bijdragen, behoudens het bepaalde in de
      volgende leden, berekend over veertig procent van de bezoldiging, welke ingevolge het bepaalde in het derde en
      vierde lid van artikel 41 van de in het voorgaande lid bedoelde regelingen aan het wachtgeld ten grondslag heeft
      gelegen dan wel zou hebben gelegen.
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel3a
  - number: 3a.3
    text: |-
      In het geval bedoeld in de vorige leden zijn de bepalingen inzake het voldoen van de bijdragen, het bepalen van
      de bijdrage naar de grondslag van een fictief pensioen, het ophouden of de opzegging van het deelgenootschap,
      zoals die golden voor het vrijwillig deelgenootschap in de voormalige in het eerste lid genoemde fondsen, van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel3a
  - number: 3a.4
    text: |-
      De vaststelling van het bedrag van de ingevolge dit artikel verschuldigde bijdragen, van de wijze van voldoening
      daarvan en hetgeen overigens ter uitvoering van het bepaalde in dit artikel nodig is, geschiedt door de Raad
      van Beheer van de Pensioenstichting. Over bijdragen, welke ingevolge het in werking treden van deze wet alsnog
      verschuldigd zijn, is geen rente verschuldigd.
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel3a
  - number: 3a.5
    text: |-
      In de gevallen, waarin in de regelingen op het gebied van weduwen- en wezenuitkeringen bevoegdheden tot afwijking
      van die regelingen of tot het treffen van een afzonderlijke voorziening waren voorbehouden aan de Kroon of aan
      de Gouverneur-Generaal, worden deze bevoegdheden met betrekking tot de buiten het grondgebied van de Republiek
      Indonesië gevestigde weduwen en wezen uitgeoefend door de Raad van Beheer van de Pensioenstichting na voorafgaande
      goedkeuring van Onze Ministers van Binnenlandse Zaken en van Financiën.
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel3a
  - number: 3b
    text: |-
      In de gevallen, waarin in de op 26 December 1949 van kracht zijnde regelingen aan de Kroon of aan de Gouverneur-
      Generaal de bevoegdheid was voorbehouden om ter aanvulling of in afwijking van die regelingen beslissingen te nemen
      of bijzondere voorzieningen te treffen, worden deze bevoegdheden, behoudens het bepaalde in [artikel 3][ref1], voor
      de toepassing van deze wet uitgeoefend door Onze Minister in overeenstemming met Onze Minister van Financiën.


      [ref1]: https://wetten.overheid.nl/BWBR0002077#Artikel3a
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0002077
        artikel: 3a
  - number: 3c
    text: |-
      Op pensioen of onderstand bij wijze van pensioen wordt, indien bij de vaststelling van de grondslagen daarvan
      rekening is gehouden met bezoldigingen, welke zijn toegekend op grond van na 31 December 1948 geldende
      bezoldigingsregelingen, buiten Indonesië geen duurtetoeslag en kindertoelage toegekend, tenzij het bedrag van
      dat pensioen of die onderstand minder bedraagt dan het bedrag aan pensioen of onderstand bij wijze van pensioen,
      dat zou zijn genoten, indien voor de vaststelling van de grondslag uitsluitend rekening zou zijn gehouden met
      bezoldigingen, toegekend op basis van de vóór 1 Januari 1949 bestaande bezoldigingsregelingen, vermeerderd met de
      toekomende duurtetoeslag en kindertoelage, in welk geval het verschil tussen beide bedoelde bedragen in de vorm van
      een duurtetoeslag wordt toegekend.
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel3c
  - number: 3d.1
    text: |-
      De uitkeringen, waartoe het Rijk uit hoofde van of krachtens deze wet gehouden is, worden, voor zover niet op
      andere wijze bij de wet geregeld en behoudens het bepaalde in het derde lid, vastgesteld en toegekend door Onze
      Minister en naar boven afgerond tot het naastbijliggende veelvoud van één euro of één rupiah.
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel3d
  - number: 3d.2
    text: |-
      Met inachtneming van het in [artikel 3][ref1] bepaalde, zijn op de voet van de op 26 December 1949 van kracht
      zijnde regelingen over de in het eerste lid bedoelde uitkeringen bijdragen verschuldigd voor weduwenpensioenen en
      wezenonderstanden, indien de tot de uitkering gerechtigde voor zijn weduwe en wezen daarop recht heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002077#Artikel3a
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel3d
    references:
      - id: ref1
        bwb_id: BWBR0002077
        artikel: 3a
  - number: 3d.3
    text: |-
      De periodieke uitkeringen aan buiten het grondgebied van de Republiek Indonesië gevestigde weduwen en wezen, uit
      hoofde van of krachtens de in [artikel 2, tweede lid][ref1], van deze wet gegeven garantie, worden met inachtneming
      voor zover nodig van de door Onze Minister te geven aanwijzingen toegekend door de Raad van Beheer van de
      Pensioenstichting ten laste van die stichting.


      [ref1]: https://wetten.overheid.nl/BWBR0002077#Artikel2
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel3d
    references:
      - id: ref1
        bwb_id: BWBR0002077
        artikel: '2'
  - number: 3e.1
    text: |-
      Indien een militair of gewezen militair op grond van de dienstbeëindiging rechten of aanspraken heeft op
      uitkeringen ten laste van de Republiek Indonesië, kan hij door Onze Minister worden verplicht het nodige te
      verrichten teneinde deze rechten en aanspraken geldend te maken.
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel3e
  - number: 3e.2
    text: |-
      Bij niet-nakoming van de in het vorige lid bedoelde verplichting, zomede indien door of vanwege de Republiek
      Indonesië op grond van de dienstbeëindiging uitkeringen zijn of worden toegekend, zullen de garanties volgens door
      Onze Minister te stellen regelen slechts worden verwezenlijkt, voor zover en voor zolang de vanwege de Republiek
      Indonesië toekomende dan wel toegekende uitkeringen minder bedragen dan de uitkeringen, waarop uit hoofde van of
      krachtens deze wet recht of aanspraak bestaat.
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel3e
  - number: '4'
    text: |-
      Door Onze Minister kan in overeenstemming met Onze Ministers van Financiën en van Sociale Zaken en Volksgezondheid
      in bijzondere gevallen worden bepaald, dat de garanties uit hoofde van of krachtens deze wet blijven gelden bij
      verandering van nationaliteit.
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel4
  - number: '5.1'
    text: |-
      Het nominale bedrag van de periodieke uitkeringen, waartoe het Rijk uit hoofde van of krachtens deze wet is
      gehouden, wordt betaalbaar gesteld:
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel5
  - number: 5.1.a
    text: in euro's over het tijdvak, dat de rechthebbende is gevestigd buiten het grondgebied van de Republiek Indonesië;
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel5
  - number: 5.1.b
    text: |-
      in Indonesisch courant over het tijdvak, dat de rechthebbende is gevestigd binnen het grondgebied van de Republiek
      Indonesië.
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel5
  - number: '5.2'
    text: |-
      De betaalbaarstelling van de duurtetoeslagen en kindertoelagen, welke op de in het vorige lid bedoelde uitkeringen
      zijn toegekend, geschiedt in dezelfde munteenheid als waarin die uitkeringen betaalbaar worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel5
  - number: '5.3'
    text: |-
      Het nominale bedrag van de krachtens een kortverband verschuldigde kortverbandtoelage en bonus, waartoe het Rijk
      uit hoofde van of krachtens deze wet is gehouden, wordt uitbetaald: hetzij in Indonesisch courant, hetzij, indien
      de rechthebbende zich binnen een jaar na beëindiging van het kortverband heeft gevestigd buiten het grondgebied van
      de Republiek Indonesië, in euro's.
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel5
  - number: '5.4'
    text: |-
      Terugbetaling van overtochts- en vervoerskosten, waartoe het Rijk uit hoofde van of krachtens deze wet is gehouden,
      vindt plaats in Nederland tot de tegenwaarde in euro's.
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel5
  - number: '5.5'
    text: |-
      Indien de betrokkene buiten Nederland en buiten het grondgebied van de Republiek Indonesië is gevestigd, geschiedt
      de bij dit artikel bedoelde betaalbaarstelling dan wel uitbetaling aan een door hem daartoe aan te wijzen
      gemachtigde in Nederland.
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel5
  - number: '5.6'
    text: |-
      In bijzondere gevallen kan van het bepaalde in dit artikel door Onze Minister in overeenstemming met Onze Minister
      van Financiën ten gunste van belanghebbende worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel5
  - number: '6.1'
    text: |-
      Een militair of gewezen militair, die uit hoofde van of krachtens deze wet ten laste van het Rijk een periodieke
      uitkering geniet of zou kunnen genieten, is, zolang hij de voor pensioen voorgeschreven leeftijd nog niet heeft
      bereikt, verplicht:
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel6
  - number: 6.1.1°
    text: |-
      indien hij in de gelegenheid komt om in het land, waarin hij is gevestigd, op een wijze, welke in verband met zijn
      persoonlijkheid en omstandigheden voor hem passend kan worden geacht, inkomsten uit arbeid te verkrijgen, van die
      gelegenheid gebruik te maken;
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel6
  - number: 6.1.2°
    text: |-
      een hem aangeboden ambt of betrekking in het land, waarin hij is gevestigd, welke hem in verband met zijn
      persoonlijkheid en omstandigheden redelijkerwijze kan worden opgedragen, te aanvaarden, met dien verstande, dat
      deze verplichting niet omvat het treden in vreemde overheidsdienst;
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel6
  - number: 6.1.3°
    text: |-
      van het ter hand nemen van enige betaalde arbeid of van enig bedrijf onverwijld mededeling te doen aan Onze
      Minister;
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel6
  - number: 6.1.4°
    text: van de verworven inkomsten en van de eventuele wijzigingen daarin tijdig opgave te doen aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel6
  - number: '6.2'
    text: |-
      Wanneer de in het vorige lid bedoelde persoon inkomsten uit arbeid geniet, wordt, zolang hij de in het vorige lid
      bedoelde voor pensioen voorgeschreven leeftijd nog niet heeft bereikt, op de in dat lid bedoelde uitkering, na
      aftrek van de maandelijks verschuldigde pensioenbijdragen, een korting toegepast ten bedrage van een percentage van
      de opbrengst van arbeid, gelijk aan het percentage, dat de periodieke uitkering uitmaakt van de grondslag, waarover
      die uitkering is berekend, wordende voor de toepassing van dit artikel als opbrengst van arbeid niet in aanmerking
      genomen:
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel6
  - number: 6.2.a
    text: voor ongehuwden een bedrag van € 22,69 's maands,
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel6
  - number: 6.2.b
    text: voor gehuwden een bedrag van € 45,38 's maands,
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel6
  - number: '6.3'
    text: |-
      Indien tengevolge van de in het vorige lid omschreven wijze van korting de som van het inkomen uit arbeid en van
      het wachtgeld, pensioen of onderstand per maand minder zou bedragen dan € 95,29 wordt het kortingsbedrag berekend
      door de som van het inkomen uit arbeid en van het wachtgeld, pensioen of de onderstand te verminderen met een
      bedrag van € 95,29 terwijl, indien deze som per maand € 95,29 of minder bedraagt, geen korting wordt toegepast.
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel6
  - number: '6.4'
    text: |-
      Onze Minister kan het bepaalde in artikel 6, eerste en tweede lid, buiten toepassing laten, of daarvan afwijken,
      zo nodig onder het stellen van voorwaarden, voor zover toepassing ervan zal leiden tot een onbillijkheid van
      overwegende aard, gelet op het belang van het bieden van waarborgen van het Rijk ten gunste van de betrokken
      militairen, beroepsmilitairen, gewezen militairen en hun nagelaten betrekkingen.
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel6
  - number: '6.5'
    text: |-
      Bij niet- of niet behoorlijke nakoming van de in het eerste lid bedoelde verplichtingen, alsmede indien de
      inkomsten zonder voldoende reden vrijwillig worden prijsgegeven of door eigen schuld verloren gaan, kan de
      commissie op daartoe van of vanwege Onze Minister ontvangen verzoek beslissen, dat de uitkering gerekend van
      een door haar te bepalen tijdstip geheel of gedeeltelijk, voor een bepaalde tijdsduur, dan wel blijvend, wordt
      gestaakt.
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel6
  - number: '6.6'
    text: |-
      In de gevallen, als bedoeld in het vijfde lid, kan Onze Minister bepalen, dat in afwachting van de beslissing van
      de commissie de uitkering geheel of gedeeltelijk wordt opgeschort.
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel6
  - number: '6.7'
    text: |-
      Ter uitvoering van dit artikel kunnen door Onze Minister nadere voorschriften en aanwijzingen hetzij in
      het algemeen hetzij voor enig bijzonder geval worden gegeven. Bij niet- of niet behoorlijke naleving door
      de belanghebbende van deze voorschriften of aanwijzingen, is het bepaalde in het vijfde en zesde lid van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel6
  - number: 6a.1
    text: |-
      Indien een beroepsmilitair of gewezen militair een periodieke uitkering ten laste van de Republiek Indonesië
      geniet, is hij bevoegd zich voor de toepassing van deze wet tot de commissie te wenden met het verzoek om te
      beslissen:
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel6a
  - number: 6a.1.a
    text: |-
      of hij een hem aangeboden ambt of betrekking mag weigeren - dan wel al dan niet terecht heeft geweigerd - te
      aanvaarden;
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel6a
  - number: 6a.1.b
    text: |-
      of hij al dan niet terecht geen gebruik heeft gemaakt van een gelegenheid om in het land, waarin hij is gevestigd,
      passende arbeid te verkrijgen;
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel6a
  - number: 6a.1.c
    text: |-
      of door hem verworven inkomsten uit arbeid al dan niet zonder voldoende reden zijn of kunnen worden prijsgegeven,
      dan wel al dan niet door eigen schuld verloren zijn gegaan.
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel6a
  - number: 6a.2
    text: Ambten of betrekkingen buiten het land, waarin betrokkene is gevestigd, behoeven niet te worden aanvaard.
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel6a
  - number: 6a.3
    text: |-
      Het bepaalde in [artikel 6, tweede, derde en vierde lid][ref1], is op een militair of gewezen militair bedoeld in
      het eerste lid, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002077#Artikel6
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0002077
        artikel: '6'
  - number: '7.1'
    text: |-
      Wij stellen een of meer commissies in, die - behalve de andere bevoegdheden en werkzaamheden, welke haar bij of
      krachtens deze wet zijn of zullen worden verleend of opgedragen - tot taak hebben voor de toepassing van deze wet,
      nadat door Onze Minister terzake haar oordeel is gevraagd, te beslissen:
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel7
  - number: 7.1.a
    text: |-
      dat de garanties uit hoofde van of krachtens deze wet tijdelijk of blijvend en geheel of gedeeltelijk vervallen,
      indien zij van oordeel is, dat een militair, gewezen militair of nagelaten betrekking onjuiste of onvolledige
      gegevens heeft verstrekt voor de beoordeling van de aanspraak op de garanties uit hoofde van of krachtens deze wet
      dan wel voor de toekenning en vaststelling van de uitkeringen uit hoofde van of krachtens deze wet;
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel7
  - number: 7.1.b
    text: |-
      dat de uitkeringen, waarop ingevolge deze wet aanspraak bestaat, niet of slechts ten dele zullen worden genoten
      in de gevallen, waarin de betrokken militairen, gewezen militairen of nagelaten betrekkingen reeds een uitkering
      ontvangen ingevolge de [Garantiewet Burgerlijk Overheidspersoneel Indonesië][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002060
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002060
  - number: '7.2'
    text: Aan de beslissingen van de commissie kunnen door haar voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel7
  - number: '7.3'
    text: |-
      De samenstelling, standplaats, werkwijze en, voorzoveel nodig, de onderlinge verdeling van bevoegdheden van
      commissies worden geregeld bij algemene maatregel van bestuur. Daarbij kunnen binnen het kader van de doelstelling
      van deze wet de taak en bevoegdheden der commissie worden uitgebreid.
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel7
  - number: '7.4'
    text: |-
      Bij algemene maatregel van bestuur wordt tevens voorzien in de mogelijkheid tot instelling van beroep tegen
      beslissingen van de commissie.
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel7
  - number: 7a.1
    text: |-
      Voor de toepassing van deze wet zullen Indonesische staatsburgers gewezen Nederlanders worden geacht hun
      Nederlanderschap te hebben behouden, met dien verstande, dat de [artikelen 3][ref1] en [3][ref2] voor hen niet
      van toepassing zijn en dat de garanties zich te hunnen aanzien niet uitstrekken tot het recht op vrije overtocht
      naar Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0002077#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0002077#Artikel3b
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0002077
        artikel: 3a
      - id: ref2
        bwb_id: BWBR0002077
        artikel: 3b
  - number: 7a.2
    text: |-
      Aan de weduwen en wezen van een overleden Indonesisch staatsburger gewezen Nederlander garandeert het Rijk
      de voldoening van alle rechten en aanspraken, welke hun op grond van dat overlijden ingevolge het bepaalde in
      het [tweede lid van artikel 2][ref1] zouden toekomen, indien de overledene Nederlander zou zijn gebleven, met
      uitzondering van het recht op vrije overtocht naar Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0002077#Artikel2
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0002077
        artikel: '2'
  - number: 7a.3
    text: |-
      In bijzondere gevallen kan, ter beslissing van de commissie, aan de in het vorige lid bedoelde personen, die, waren
      zij Nederlanders gebleven, uit hoofde van of krachtens deze wet recht op vrije overtocht naar Nederland zouden
      hebben, vrij vervoer naar Nederland op redelijke voorwaarden worden verleend.
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel7a
  - number: 7b
    text: |-
      Voor gevallen, waarin deze wet, Hoofdstuk V van de in het eerste lid van [artikel 2, onder b][ref1], bedoelde
      regelingen dan wel de in [artikel 3][ref2] bedoelde afvloeiingsvoorwaarden niet of niet naar billijkheid voorzien,
      kunnen door Ons op voordracht van Onze Ministers ten behoeve van de militairen, gewezen militairen en nagelaten
      betrekkingen aanvullende garanties van het Rijk worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002077#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002077#Artikel3
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0002077
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002077
        artikel: '3'
  - number: 7c
    text: |-
      De garanties strekken zich niet uit over het recht op kindertoelage voor kinderen, voor wie aanspraak bestaat
      op kinderbijslag ingevolge de [Algemene Kinderbijslagwet][ref1], de Kinderbijslagwet voor loontrekkenden, of de
      algemene maatregel van bestuur bedoeld in artikel 10 van laatstgenoemde wet, terwijl de kindertoelage voor die
      kinderen voor de berekening van de in het [tweede lid van artikel 3][ref2] bedoelde duurtetoeslag buiten aanmerking
      wordt gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002368
      [ref2]: https://wetten.overheid.nl/BWBR0002077#Artikel3c
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0002368
      - id: ref2
        bwb_id: BWBR0002077
        artikel: 3c
  - number: '8.1'
    text: |-
      Door Ons kunnen op voordracht van Onze Ministers overeenkomstige garanties als bij de voorgaande artikelen
      van deze wet zijn verleend, worden vastgesteld ten behoeve van andere Nederlanders, dan genoemd in
      [artikel 1, onder I of III][ref1], zomede in bijzondere gevallen ten behoeve van niet-Nederlanders, voor zover
      betrokkenen hebben gediend bij het voormalige Koninklijk Nederlands Indonesisch Leger.


      [ref1]: https://wetten.overheid.nl/BWBR0002077#Artikel1
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002077
        artikel: '1'
  - number: '8.2'
    text: Aan de vaststelling van de in het vorige lid bedoelde garanties kunnen door Ons voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel8
  - number: '9'
    text: |-
      Deze wet treedt in werking met ingang van de dag, volgende op die van haar afkondiging. Zij kan worden aangehaald
      als "Garantiewet Militairen K.N.I.L.".
    url: https://wetten.overheid.nl/BWBR0002077/2011-02-23#Artikel9
