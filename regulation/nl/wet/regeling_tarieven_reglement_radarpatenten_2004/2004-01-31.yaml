      [bedoeld in artikel 3.04, eerste lid, van het Reglement radarpatenten][ref1] is een vergoeding verschuldigd van
      € 60.

      2 Voor het bijschrijven van het radarpatent op de schipperspatentkaart, bedoeld in
      [artikel 3.04, tweede lid, van het Reglement radarpatenten][ref2] is een vergoeding verschuldigd van € 50.


