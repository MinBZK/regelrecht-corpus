      1 Voor het afnemen van een examen als bedoeld in [artikel 3.03, eerste lid, van het Reglement radarpatenten][ref1]
      is een tarief verschuldigd van € 197.

      2 Voor het afnemen van een theorieherexamen als bedoeld in
      [artikel 3.03, vierde lid, van het Reglement radarpatenten][ref2] is een tarief verschuldigd van € 73.

      3 Voor het afnemen van een praktijkexamen als bedoeld in
      [artikel 3.03, vierde lid, van het Reglement radarpatenten][ref3] is een tarief verschuldigd van € 197.


