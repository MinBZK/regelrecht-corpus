$id: regeling_minimum_vlieghoogte_spuitvluchten
regulatory_layer: WET
publication_date: '2014-12-11'
valid_from: '1993-10-20'
bwb_id: BWBR0006177
url: https://wetten.overheid.nl/BWBR0006177/1993-10-20
preamble:
  text: |-
    Handelend in overeenstemming met de Minister van Defensie;

    Gelet op artikel 45, tweede lid van het Luchtverkeersreglement;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0006177/1993-10-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Bij het uitvoeren van de in [artikel 45, tweede lid, onder b, van het Luchtverkeersreglement][ref1] genoemde
      vluchten worden de volgende regels in acht genomen:


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel45
    url: https://wetten.overheid.nl/BWBR0006177/1993-10-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '45'
  - number: 1.a
    text: vluchten zijn niet toegestaan boven wegen, tram-, spoor- en waterwegen, voor zover er verkeer is op deze wegen;
    url: https://wetten.overheid.nl/BWBR0006177/1993-10-20#Artikel1
  - number: 1.b
    text: |-
      vluchten zijn niet toegestaan boven terreinen grenzend aan de onder a. genoemde wegen, voor zover er verkeer is
      op deze wegen en de koers van het luchtvaartuig de rijrichting van het verkeer kruist of wanneer door de heersende
      windrichting de in [artikel 45, tweede lid, onder b][ref1], genoemde stoffen in de richting van het verkeer worden
      verplaatst;


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel45
    url: https://wetten.overheid.nl/BWBR0006177/1993-10-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '45'
  - number: 1.c
    text: |-
      vluchten zijn niet toegestaan boven en onder hoogspanningslijnen en binnen het gebied van vijftien meter ter
      weerszijde van deze hoogspanningslijnen.
    url: https://wetten.overheid.nl/BWBR0006177/1993-10-20#Artikel1
  - number: '2'
    text: |-
      Het besluit van de Directeur-generaal van de Rijksluchtvaartdienst van 1 september 1982/nr. LVB/L24157/
      Rijksluchtvaartdienst wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006177/1993-10-20#Artikel2
  - number: '3'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0006177/1993-10-20#Artikel3
  - number: '4'
    text: 'Deze regeling wordt aangehaald als: Regeling minimum vlieghoogte spuitvluchten.'
    url: https://wetten.overheid.nl/BWBR0006177/1993-10-20#Artikel4
