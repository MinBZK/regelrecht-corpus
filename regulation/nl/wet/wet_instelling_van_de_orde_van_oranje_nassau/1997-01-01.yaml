$id: wet_instelling_van_de_orde_van_oranje_nassau
regulatory_layer: WET
publication_date: '1996-10-29'
valid_from: '1997-01-01'
bwb_id: BWBR0001859
url: https://wetten.overheid.nl/BWBR0001859/1997-01-01
preamble:
  text: |-
    In naam van Hare Majesteit WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau,
    enz., enz., enz. Wij EMMA, Koningin-Weduwe, Regentes van het Koninkrijk,

    Allen, die deze zullen zien of hooren lezen, saluut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het wenschelijk is door het instellen van eene nieuwe Ridderorde de
    gelegenheid te vermeerderen tot het verleenen van vereerende onderscheidingen;

    Gelet op artikel 66 der Grondwet;

    Zoo is het, dat Wij, den Raad van State gehoord en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001859/1997-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Er wordt een Orde ingesteld, strekkende tot vererende onderscheiding van Onze onderdanen of vreemdelingen, die zich
      jegens Ons en de staat of jegens de maatschappij op bijzondere wijze hebben verdienstelijk gemaakt.
    url: https://wetten.overheid.nl/BWBR0001859/1997-01-01#Artikel1
  - number: '2'
    text: Deze Orde draagt de naam van "de Orde van Oranje-Nassau".
    url: https://wetten.overheid.nl/BWBR0001859/1997-01-01#Artikel2
  - number: '3'
    text: Het Grootmeesterschap van deze Orde is onafscheidelijk aan de Kroon der Nederlanden verbonden.
    url: https://wetten.overheid.nl/BWBR0001859/1997-01-01#Artikel3
  - number: '4'
    text: Deze Orde bestaat uit zes graden.
    url: https://wetten.overheid.nl/BWBR0001859/1997-01-01#Artikel4
  - number: '5'
    text: Alle benoemingen in deze Orde geschieden bij koninklijk besluit.
    url: https://wetten.overheid.nl/BWBR0001859/1997-01-01#Artikel5
  - number: '6'
    text: |-
      De Ridders van de eerste graad van deze Orde dragen de naam van Ridder Grootkruis.

      De Ridders van de tweede graad van deze Orde dragen de naam van Grootofficier.

      De Ridders van de derde graad van deze Orde dragen de naam van Commandeur.

      De Ridders van de vierde graad van deze Orde dragen de naam van Officier.

      De Ridders van de vijfde graad van deze Orde dragen de naam van Ridder.

      De Ridders van de zesde graad van deze Orde dragen de naam van Lid.
    url: https://wetten.overheid.nl/BWBR0001859/1997-01-01#Artikel6
  - number: '7'
    text: |-
      1 Het versiersel dezer Orde bestaat in een kruis met acht geparelde punten en een doorlopende laurierkrans tussen
      de armen en gedekt met een koninklijke kroon, alles van goud voor de eerste vier graden en van zilver voor de
      vijfde graad; de armen van het kruis zijn wit geëmailleerd met blauw geëmailleerd hart; in het midden van het
      kruis bevindt zich een blauw geëmailleerd rond schild, omgeven door een wit geëmailleerde rand, beide met goud
      omlijst, aan de ene zijde op het ronde schild de Leeuw, zoals hij in het wapen van het Rijk voorkomt, en op de
      rand in gouden letters de woorden "Je maintiendrai", en aan de tegenzijde op het ronde schild een met een gouden
      koninklijke kroon gedekte gouden W en op de rand in gouden letters de woorden "God zij met ons".

      2 Voor militairen worden, instede van den laurierkrans, aan het versiersel aangebracht twee zilveren zwaarden met
      gouden gevest, schuin gekruist achter het ronde schild.

      3 Het lint is oranje tussen twee strepen van Nassaus blauw, de kleuren gescheiden door een smalle witte streep.
    url: https://wetten.overheid.nl/BWBR0001859/1997-01-01#Artikel7
  - number: '10'
    text: Tot goedmaking der onkosten der Orde wordt jaarlijks een som op de staatsbegroting gebracht.
    url: https://wetten.overheid.nl/BWBR0001859/1997-01-01#Artikel10
  - number: '11'
    text: |-
      1 Degene aan wie een onderscheiding in deze Orde is verleend, is indien hij ingevolge rechterlijke veroordeling
      rechtens van zijn vrijheid is beroofd, onbevoegd de tekenen van deze onderscheiding te dragen.

      2 Een onderscheiding in deze Orde vervalt, indien degene aan wie de onderscheiding is verleend, onherroepelijk is
      veroordeeld tot een gevangenisstraf van ten minste een jaar.
    url: https://wetten.overheid.nl/BWBR0001859/1997-01-01#Artikel11
  - number: '12'
    text: De Kanselier van de Orde van de Nederlandse Leeuw is tevens Kanselier dezer Orde.
    url: https://wetten.overheid.nl/BWBR0001859/1997-01-01#Artikel12
  - number: '13'
    text: |-
      1 Bij algemene maatregel van bestuur wordt een reglement op deze Orde vastgesteld, waarin nadere regels worden
      gesteld met betrekking tot het verlenen van een onderscheiding in deze Orde en de bij de onderscheiding behorende
      tekenen.

      2 Een krachtens het eerste lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan twee
      maanden na de datum van uitgifte van het *Staatsblad* waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0001859/1997-01-01#Artikel13
