$id: wet_op_de_omzetbelasting_1968
regulatory_layer: WET
publication_date: '2014-12-29'
valid_from: '2010-01-01'
bwb_id: BWBR0002629
url: https://wetten.overheid.nl/BWBR0002629/2010-01-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de richtlijnen van de Raad van de Europese Economische Gemeenschap
    betreffende de harmonisatie van de wetgevingen van de Lid-Staten inzake omzetbelasting (Publikatieblad van de
    Europese Gemeenschappen van 14 april 1967) aanleiding zijn de bestaande omzetbelasting volgens het cumulatieve
    cascadestelsel te vervangen door een omzetbelasting volgens het stelsel van heffing over de toegevoegde waarde;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Onder de naam ''omzetbelasting'' wordt een belasting geheven ter zake van:'
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel1
  - number: 1.a
    text: |-
      leveringen van goederen en diensten, welke in Nederland door een als zodanig handelende ondernemer onder bezwarende
      titel worden verricht;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel1
  - number: 1.b
    text: |-
      intracommunautaire verwervingen van goederen onder bezwarende titel in Nederland door een als zodanig handelende
      ondernemer en door rechtspersonen, andere dan ondernemers;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel1
  - number: 1.c
    text: |-
      intracommunautaire verwervingen onder bezwarende titel, anders dan in de zin van onderdeel *b*, van nieuwe
      vervoermiddelen in Nederland;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel1
  - number: 1.d
    text: invoer van goederen.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel1
  - number: 1a.1
    text: |-
      [Artikel 1, aanhef en onderdeel b][ref1], is niet van toepassing wanneer het verworven goed:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel1
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '1'
        hoofdstuk: I
  - number: 1a.1.a
    text: |-
      is geleverd door een ondernemer op wie de in de artikelen 282 tot en met 292 van de BTW-richtlijn 2006 bedoelde
      vrijstellingsregeling van toepassing is;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel1a
  - number: 1a.1.b
    text: |-
      is geleverd in de zin van [artikel 3, eerste lid, onderdeel f][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel3
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '3'
        hoofdstuk: II
        afdeling: '1'
  - number: 1a.1.c
    text: |-
      is geleverd met toepassing van [artikel 5a, eerste lid][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel5a
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 5a
        hoofdstuk: II
        afdeling: 1a
  - number: 1a.1.d
    text: |-
      is geleverd met toepassing van een van de in de artikelen 312 tot en met 325 en 333 tot en met 340 van de BTW-
      richtlijn 2006 bedoelde bijzondere regelingen.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel1a
  - number: 1a.2
    text: |-
      [Artikel 1, aanhef en onderdeel b][ref1], is voorts niet van toepassing op intracommunautaire verwervingen van
      goederen, andere dan nieuwe vervoermiddelen en accijnsgoederen, door:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel1
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '1'
        hoofdstuk: I
  - number: 1a.2.a
    text: |-
      ondernemers die op grond van [artikel 27, eerste lid][ref1], geen omzetbelasting verschuldigd zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel27
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '27'
        hoofdstuk: V
        afdeling: '3'
  - number: 1a.2.b
    text: |-
      ondernemers die uitsluitend leveringen van goederen of diensten verrichten waarvoor geen recht op aftrek van
      belasting bestaat; en
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel1a
  - number: 1a.2.c
    text: rechtspersonen, andere dan ondernemers;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel1a
  - number: 1a.3
    text: |-
      De in het tweede lid bedoelde ondernemers en rechtspersonen kunnen aan de inspecteur verzoeken om dat lid
      op hen niet van toepassing te doen zijn. Bij inwilliging van het verzoek geldt zulks tot wederopzegging door
      belanghebbende doch ten minste voor twee kalenderjaren. De inspecteur beslist op het verzoek bij voor bezwaar
      vatbare beschikking. Bij ministeriële regeling kunnen regels worden gesteld inzake de toepassing van dit lid.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel1a
  - number: '2'
    text: |-
      Op de belasting, verschuldigd ter zake van leveringen van goederen en diensten, wordt in aftrek gebracht de
      belasting ter zake van de aan de ondernemer verrichte leveringen van goederen en verleende diensten, ter zake van
      de door hem verrichte intracommunautaire verwervingen van goederen en ter zake van invoer van voor hem bestemde
      goederen.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel2
  - number: 2a.1
    text: 'In deze wet en in de daarop gebaseerde bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel2a
  - number: 2a.1.a
    text: |-
      BTW-richtlijn 2006: richtlijn nr. 2006/112/EG van de Raad van de Europese Unie van 28 november 2006 betreffende het
      gemeenschappelijke stelsel van belasting over de toegevoegde waarde (PbEU L 347);
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel2a
  - number: 2a.1.b
    text: 'lid-staat: een lid-staat van de Europese Gemeenschap;'
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel2a
  - number: 2a.1.c
    text: |-
      Gemeenschap: het geheel van de grondgebieden van de lid-staten zoals die gebieden zijn omschreven in artikel 5,
      onder 2, van de BTW-richtlijn 2006, met dien verstande dat ook het Vorstendom Monaco en het eiland Man worden
      behandeld als gebied van de Franse Republiek respectievelijk het Verenigd Koninkrijk van Groot-Brittannië en
      Noord-Ierland en dat ook de zones Akrotiri en Dhekelia van Cyprus, die onder de soevereiniteit van het Verenigd
      Koninkrijk van Groot-Brittannië en Noord-Ierland vallen, worden behandeld als gebied van de Republiek Cyprus;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel2a
  - number: 2a.1.d
    text: 'derde-land: elk ander grondgebied dan dat van de Gemeenschap;'
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel2a
  - number: 2a.1.e
    text: |-
      accijnsgoederen: bier, wijn, tussenprodukten, overige alcoholhoudende produkten, minerale oliën
      en tabaksprodukten als bedoeld in [artikel 1 van de Wet op de accijns][ref1], kolen als bedoeld in
      [artikel 32, onderdeel a, van de Wet belastingen op milieugrondslag][ref2], alsmede aardgas als bedoeld
      in [artikel 47, eerste lid, onderdeel m, van de Wet belastingen op milieugrondslag][ref3] in verbinding
      met [artikel 48, tweede lid, van die wet][ref4], maar met uitzondering van gas dat wordt geleverd via het
      aardgasdistributiesysteem;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0007168#Artikel47
      [ref4]: https://wetten.overheid.nl/BWBR0007168#Artikel48
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007168
        artikel: '32'
      - id: ref3
        bwb_id: BWBR0007168
        artikel: '47'
      - id: ref4
        bwb_id: BWBR0007168
        artikel: '48'
  - number: 2a.1.f
    text: |-
      nieuwe vervoermiddelen: voor het personen- of goederenvervoer bestemde schepen met een lengte van meer dan 7,5 m,
      luchtvaartuigen met een totaal opstijggewicht van meer dan 1550 kg en landvoertuigen die zijn uitgerust met een
      motor van meer dan 48 cc cilinderinhoud of met een vermogen van meer dan 7,2 kW, met uitzondering van zeeschepen en
      luchtvaartuigen als bedoeld in de bij deze wet behorende tabel II, onderdeel *a*, post 3, wanneer op het tijdstip
      van de levering:
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel2a
  - number: 2a.1.f.1°
    text: |-
      na het tijdstip van eerste ingebruikneming van het landvoertuig niet meer dan zes maanden, dan wel van het schip of
      luchtvaartuig niet meer dan drie maanden, zijn verstreken; of
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel2a
  - number: 2a.1.f.2°
    text: |-
      het vervoermiddel, als het een landvoertuig betreft ten hoogste 6000 km heeft afgelegd, als het een schip betreft
      ten hoogste 100 uren heeft gevaren, dan wel als het een luchtvaartuig betreft ten hoogste 40 uren heeft gevlogen;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel2a
  - number: 2a.1.g
    text: |-
      btw-identificatienummer: het nummer dat ingevolge artikel 214 van de BTW-richtlijn 2006 door een lid-staat aan een
      ondernemer of aan een rechtspersoon, andere dan ondernemer, is toegekend;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel2a
  - number: 2a.1.h
    text: |-
      intracommunautair goederenvervoer: het vervoer van goederen waarvan de plaats van vertrek en de plaats van aankomst
      op het grondgebied van twee verschillende lidstaten zijn gelegen;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel2a
  - number: 2a.1.i
    text: |-
      plaats van vertrek: de plaats waar het goederenvervoer daadwerkelijk aanvangt, zonder rekening te houden met de
      trajecten die worden afgelegd om zich naar de plaats te begeven waar de goederen zich bevinden;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel2a
  - number: 2a.1.j
    text: 'plaats van aankomst: de plaats waar het goederenvervoer daadwerkelijk eindigt;'
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel2a
  - number: 2a.1.k
    text: |-
      wederverkoper: de ondernemer wiens activiteiten geheel of ten dele bestaan uit de wederverkoop van gebruikte
      goederen, kunstvoorwerpen, voorwerpen voor verzamelingen of antiquiteiten;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel2a
  - number: 2a.1.l
    text: |-
      gebruikte goederen: alle roerende lichamelijke zaken die, in de staat waarin zij verkeren of na herstelling
      daarvan, opnieuw kunnen worden gebruikt, andere dan nieuwe vervoermiddelen die worden verzonden of vervoerd van
      een lid-staat naar een andere lid-staat, en andere dan bij ministeriële regeling aan te wijzen edele metalen en
      edelstenen;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel2a
  - number: 2a.1.m
    text: |-
      kunstvoorwerpen, voorwerpen voor verzamelingen en antiquiteiten: de bij ministeriële regeling aan te wijzen
      goederen;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel2a
  - number: 2a.1.n
    text: |-
      gedeelte van een binnen de Gemeenschap verricht passagiersvervoer: het gedeelte van een vervoer dat, zonder
      tussenstop buiten de Gemeenschap, plaatsvindt tussen de plaats van vertrek en de plaats van aankomst van het
      vervoer van passagiers; in geval het een heen- en terugreis betreft, wordt de terugreis als een afzonderlijk
      vervoer beschouwd;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel2a
  - number: 2a.1.o
    text: |-
      plaats van vertrek van een vervoer van passagiers: het eerste punt in de Gemeenschap waar passagiers aan boord
      kunnen komen, eventueel na een tussenstop buiten de Gemeenschap;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel2a
  - number: 2a.1.p
    text: |-
      plaats van aankomst van een vervoer van passagiers: het laatste punt in de Gemeenschap waar passagiers die binnen
      de Gemeenschap aan boord zijn gekomen van boord kunnen gaan, eventueel vóór een tussenstop buiten de gemeenschap;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel2a
  - number: 2a.1.q
    text: |-
      elektronische diensten: langs elektronische weg verrichte diensten, met name de in bijlage II van de BTW-richtlijn
      2006 beschreven diensten;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel2a
  - number: 2a.1.r
    text: 'normale waarde:'
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel2a
  - number: 2a.1.r.1°
    text: |-
      het volledige bedrag, de omzetbelasting niet daaronder begrepen, dat de afnemer van goederen of diensten, om de
      desbetreffende goederen of diensten op dat tijdstip te verkrijgen, in dezelfde handelsfase als waarin de goederen
      worden geleverd of de diensten worden verricht, op het tijdstip van die levering of van die verrichting en bij
      vrije mededinging daarvoor zou moeten betalen aan een zelfstandige leverancier of dienstverrichter in Nederland;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel2a
  - number: 2a.1.r.2°
    text: |-
      indien geen vergelijkbare levering of verrichting als bedoeld onder 1° voorhanden is: - met betrekking tot
      goederen: een waarde die niet lager is dan de aankoopprijs van de goederen of van soortgelijke goederen of, indien
      er geen aankoopprijs is, dan de kostprijs, berekend op het tijdstip waarop de levering wordt verricht;
        - met betrekking tot diensten: een waarde die niet lager is dan de door de ondernemer voor het verrichten van de
      dienst gemaakte uitgaven.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel2a
  - number: 2a.2
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de wijze waarop moet worden aangetoond of een vervoermiddel
      als nieuw aangemerkt dient te worden.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel2a
  - number: '3.1'
    text: 'Leveringen van goederen zijn:'
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel3
  - number: 3.1.a
    text: de overdracht of overgang van de macht om als eigenaar over een goed te beschikken;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel3
  - number: 3.1.b
    text: de afgifte van goederen ingevolge een overeenkomst van huurkoop;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel3
  - number: 3.1.c
    text: |-
      de oplevering van onroerende zaken door degene die de zaken heeft vervaardigd, met uitzondering van andere
      onbebouwde terreinen dan bouwterreinen als bedoeld in [artikel 11, vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel11
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '11'
        hoofdstuk: II
        afdeling: '3'
  - number: 3.1.d
    text: |-
      de rechtsovergang van goederen tegen betaling van een vergoeding ingevolge een vordering door of namens de
      overheid;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel3
  - number: 3.1.f
    text: |-
      de rechtsovergang van goederen welke het onderwerp uitmaken van een overeenkomst tot het aanbrengen van die
      goederen aan een ander goed.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel3
  - number: '3.2'
    text: |-
      Als levering van goederen wordt mede aangemerkt de vestiging, overdracht, wijziging, afstand en opzegging van
      rechten waaraan onroerende zaken zijn onderworpen, met uitzondering van hypotheek en grondrente, tenzij de
      vergoeding, vermeerderd met de omzetbelasting, minder bedraagt dan de waarde in het economische verkeer van die
      rechten. De waarde in het economische verkeer bedraagt ten minste de kostprijs, met inbegrip van de omzetbelasting,
      van de onroerende zaak waarop het recht betrekking heeft, zoals die zou ontstaan bij de voortbrenging door een
      onafhankelijke derde op het tijdstip van de handeling.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel3
  - number: '3.3'
    text: |-
      Met een levering onder bezwarende titel als bedoeld in [artikel 1, onderdeel a][ref1], worden gelijkgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel1
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '1'
        hoofdstuk: I
  - number: 3.3.a
    text: |-
      het door een ondernemer aan zijn bedrijf onttrekken van een goed dat hij voor eigen privé-doeleinden of voor privé-
      doeleinden van zijn personeel bestemt, dat hij om niet verstrekt of, meer in het algemeen, dat hij voor andere dan
      bedrijfsdoeleinden bestemt, ingeval met betrekking tot dat goed of de bestanddelen daarvan recht op volledige of
      gedeeltelijke aftrek van de belasting is ontstaan;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel3
  - number: 3.3.b
    text: |-
      het door een ondernemer voor bedrijfsdoeleinden bestemmen van in het eigen bedrijf vervaardigde goederen in
      de gevallen waarin, indien de goederen van een ondernemer zouden zijn betrokken, hij geen recht zou hebben op
      volledige aftrek van de op die goederen drukkende belasting;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel3
  - number: 3.3.c
    text: |-
      het onder zich hebben van goederen door een ondernemer of zijn rechthebbenden wanneer hij de uitoefening van zijn
      bedrijf beëindigt, ingeval bij de aanschaffing van die goederen of bij de bestemming ervan overeenkomstig het
      bepaalde in onderdeel b, recht op volledige of gedeeltelijke aftrek van de belasting is ontstaan.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel3
  - number: '3.4'
    text: |-
      Indien door meer dan één persoon overeenkomsten worden gesloten met een verplichting tot levering van een zelfde
      goed dat vervolgens door de eerste persoon rechtstreeks aan de laatste afnemer wordt afgeleverd, wordt dat goed
      geacht door ieder van die personen te zijn geleverd.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel3
  - number: '3.5'
    text: |-
      Goederen welke over een veiling worden verhandeld, worden geacht aan en vervolgens door de houder van de veiling te
      zijn geleverd.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel3
  - number: '3.6'
    text: |-
      Goederen welke worden geleverd door tussenkomst van een commissionair of dergelijke ondernemer die overeenkomsten
      sluit op eigen naam maar op order en voor rekening van een ander, worden geacht aan en vervolgens door die
      ondernemer te zijn geleverd.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel3
  - number: '3.7'
    text: |-
      Goederen zijn alle voor menselijke beheersing vatbare stoffelijke objecten, alsmede electriciteit, gas, warmte,
      koude en dergelijke.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel3
  - number: '3.8'
    text: |-
      Voor de toepassing van het derde lid, onderdeel a, worden onttrekkingen van goederen om voor bedrijfsdoeleinden te
      dienen als geschenken van geringe waarde of als monster, niet als een levering onder bezwarende titel beschouwd.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel3
  - number: '3.9'
    text: |-
      Voor de toepassing van het derde lid, onderdeel b, worden met in het eigen bedrijf vervaardigde goederen
      gelijkgesteld goederen welke in opdracht zijn vervaardigd onder terbeschikkingstelling van stoffen, waaronder grond
      is begrepen. Van de toepassing van het derde lid, onderdeel b, worden uitgezonderd andere onbebouwde terreinen dan
      bouwterreinen als bedoeld in [artikel 11, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel11
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '11'
        hoofdstuk: II
        afdeling: '3'
  - number: 3a.1
    text: |-
      Met een levering van een goed onder bezwarende titel als bedoeld in [artikel 1, onderdeel a][ref1], wordt
      gelijkgesteld de overbrenging door een ondernemer van een eigen goed van zijn bedrijf naar een andere lid-staat.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel1
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '1'
        hoofdstuk: I
  - number: 3a.2
    text: |-
      Overbrenging van een goed naar een andere lid-staat is het verzenden of vervoeren van het goed voor
      bedrijfsdoeleinden, door of voor rekening van de ondernemer, voor zover het goed niet:
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel3a
  - number: 3a.2.a
    text: |-
      door de ondernemer wordt geleverd in de zin van [artikel 3, eerste lid, onderdeel f][ref1], of wordt geleverd met
      toepassing van [artikel 5a, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel5a
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '3'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 5a
        hoofdstuk: II
        afdeling: 1a
  - number: 3a.2.b
    text: |-
      door de ondernemer wordt geleverd met toepassing van [artikel 5, eerste lid, onderdeel c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel5
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '5'
        hoofdstuk: II
        afdeling: 1a
  - number: 3a.2.c
    text: |-
      door de ondernemer wordt geleverd met toepassing van [artikel 9, tweede lid, onderdeel b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel9
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '9'
        hoofdstuk: II
        afdeling: '2'
  - number: 3a.2.e
    text: |-
      wordt gebruikt ten behoeve van een aan de ondernemer verleende dienst, bestaande in werkzaamheden met betrekking
      tot dat goed, die feitelijk plaatsvinden in de lid-staat van aankomst van de verzending of het vervoer, mits dat
      goed na de werkzaamheden wordt verzonden naar de ondernemer in de lid-staat waarvandaan het oorspronkelijk is
      verzonden of vervoerd;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel3a
  - number: 3a.2.f
    text: |-
      tijdelijk wordt gebruikt in de lid-staat van aankomst van de verzending of het vervoer ten behoeve van een door de
      ondernemer verrichte dienst;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel3a
  - number: 3a.2.g
    text: |-
      voor een periode van ten hoogste 24 maanden wordt gebruikt in de lid-staat van aankomst van de verzending of het
      vervoer, wanneer de invoer van hetzelfde goed uit een derde-land met het oog op tijdelijk gebruik in aanmerking zou
      komen voor de regeling voor tijdelijke invoer met volledige vrijstelling van rechten bij invoer; of
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel3a
  - number: 3a.2.h
    text: |-
      bestaat in gas dat via het aardgasdistributiesysteem wordt geleverd onder de voorwaarden van [artikel 5b][ref1] dan
      wel in elektriciteit die wordt geleverd onder die voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel5b
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 5b
        hoofdstuk: II
        afdeling: 1a
  - number: 3a.3
    text: |-
      In geval ten aanzien van een goed als bedoeld in het tweede lid, aanhef, en onderdelen *a* tot en met *h*, op enig
      tijdstip niet meer wordt voldaan aan de in het van toepassing zijnde onderdeel gestelde voorwaarden, wordt het goed
      geacht op dat tijdstip te zijn overgebracht naar een andere lid-staat.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel3a
  - number: '4.1'
    text: |-
      Diensten zijn alle prestaties, niet zijnde leveringen van goederen in de zin van [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel3
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '3'
        hoofdstuk: II
        afdeling: '1'
  - number: '4.2'
    text: |-
      Met een dienst verricht onder bezwarende titel als bedoeld in [artikel 1, onderdeel a][ref1], worden gelijkgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel1
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '1'
        hoofdstuk: I
  - number: 4.2.a
    text: |-
      het gebruiken van een tot het bedrijf behorend goed voor privé-doeleinden van de ondernemer of van zijn personeel,
      of, meer in het algemeen, voor andere dan bedrijfsdoeleinden, wanneer voor dit goed recht op volledige of
      gedeeltelijke aftrek van de belasting is ontstaan;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel4
  - number: 4.2.b
    text: |-
      het om niet verrichten van diensten door de ondernemer voor eigen privé-doeleinden of voor privé-doeleinden van
      zijn personeel, of, meer in het algemeen, voor andere dan bedrijfsdoeleinden.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel4
  - number: '4.3'
    text: |-
      Ter voorkoming van ernstige verstoring van concurrentieverhoudingen worden voorts met een dienst verricht onder
      bezwarende titel als bedoeld in [artikel 1, onderdeel a][ref1], gelijkgesteld de bij ministeriële regeling aan
      te wijzen verrichtingen door ondernemers binnen hun bedrijf, in gevallen waarin die ondernemers, indien zij die
      verrichtingen door andere ondernemers zouden laten doen, de belasting niet of niet geheel in aftrek zouden kunnen
      brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel1
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '1'
        hoofdstuk: I
  - number: '4.4'
    text: |-
      Diensten welke worden verleend door tussenkomst van een commissionair of dergelijke ondernemer die overeenkomsten
      sluit op eigen naam maar op order en voor rekening van een ander, worden geacht aan en vervolgens door die
      ondernemer te zijn verleend.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel4
  - number: '5.1'
    text: 'De plaats waar een levering wordt verricht, is:'
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel5
  - number: 5.1.a
    text: |-
      ingeval het goed in verband met de levering, anders dan in de zin van [artikel 3, eerste lid, onderdeel f][ref1],
      wordt verzonden of vervoerd, de plaats waar de verzending of het vervoer aanvangt;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel3
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '3'
        hoofdstuk: II
        afdeling: '1'
  - number: 5.1.b
    text: in andere gevallen de plaats waar het goed zich bevindt op het tijdstip van de levering;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel5
  - number: 5.1.c
    text: |-
      in afwijking van onderdeel *b*, in geval van een levering van goederen aan boord van een schip, vliegtuig of trein
      en tijdens het gedeelte van een binnen de Gemeenschap verricht passagiersvervoer, de plaats van vertrek van het
      vervoer van passagiers.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel5
  - number: '5.2'
    text: |-
      In afwijking van het eerste lid, onderdeel *a*, worden, in de gevallen waarin de plaats van vertrek van de
      verzending of het vervoer van de goederen in een derde-land ligt, de plaats waar de levering wordt verricht alsmede
      de plaats waar eventuele volgende leveringen worden verricht, geacht in de lid-staat van invoer van de goederen te
      liggen, voor zover de goederen door de leverancier of in diens opdracht worden ingevoerd.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel5
  - number: 5a.1
    text: |-
      In afwijking van [artikel 5, eerste lid, onderdeel a][ref1], wordt de levering van goederen, andere dan nieuwe
      vervoermiddelen en andere dan goederen die worden geleverd met toepassing van een van de in de artikelen 312 tot
      en met 325 en 333 tot en met 340 van de BTW-richtlijn 2006 bedoelde bijzondere regelingen, die, direct of indirect,
      door of voor rekening van de ondernemer die de levering verricht worden verzonden of vervoerd uit een andere lid-
      staat dan die van aankomst van de verzending of het vervoer, verricht op de plaats van aankomst van de verzending
      of het vervoer.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel5
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '5'
        hoofdstuk: II
        afdeling: 1a
  - number: 5a.2
    text: |-
      Het eerste lid is alleen van toepassing op de levering van goederen aan afnemers als bedoeld in artikel 33, lid 1,
      onder a, van de BTW-richtlijn 2006.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel5a
  - number: 5a.3
    text: |-
      Indien de in het eerste lid bedoelde goederen worden verzonden of vervoerd uit een derde-land en door de
      ondernemer die de levering verricht worden ingevoerd in een andere lid-staat dan die van aankomst van de verzending
      of het vervoer, worden deze goederen geacht te zijn verzonden of vervoerd vanuit de lid-staat van invoer.
      [Artikel 5, tweede lid][ref1], is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel5
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '5'
        hoofdstuk: II
        afdeling: 1a
  - number: 5a.4
    text: |-
      Het eerste lid is niet van toepassing op leveringen van goederen, andere dan accijnsgoederen, die worden verzonden
      of vervoerd naar eenzelfde lid-staat, voor zover het totaal van de vergoedingen ter zake van deze leveringen in het
      lopende kalenderjaar niet meer beloopt dan het bedrag dat hiervoor bij ministeriële regeling voor die lid-staat is
      aangewezen, mits het totaal van de vergoedingen ter zake van dergelijke leveringen in het voorafgaande kalenderjaar
      niet meer heeft belopen dan dit bedrag. Voor goederen die worden verzonden of vervoerd naar Nederland geldt een
      drempelbedrag van € 100 000.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel5a
  - number: 5a.5
    text: |-
      Ondernemers die leveringen verrichten als bedoeld in het vierde lid kunnen aan de inspecteur verzoeken om dat
      lid op hen niet van toepassing te doen zijn. Bij inwilliging van het verzoek geldt zulks tot wederopzegging door
      belanghebbende doch ten minste voor twee kalenderjaren. De inspecteur beslist op het verzoek bij voor bezwaar
      vatbare beschikking. Bij ministeriële regeling kunnen regels worden gesteld inzake de toepassing van dit lid.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel5a
  - number: 5b.1
    text: |-
      Ingeval de levering van gas via het aardgasdistributiesysteem of van elektriciteit wordt verricht aan een
      ondernemer die wederverkoper is, wordt die levering, in afwijking van [artikel 5][ref1], verricht op de plaats waar
      deze ondernemer is gevestigd of een vaste inrichting heeft waarvoor de goederen worden geleverd, dan wel, bij het
      ontbreken hiervan, op de plaats waar zijn woonplaats of zijn gebruikelijke verblijfplaats is.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel5
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '5'
        hoofdstuk: II
        afdeling: 1a
  - number: 5b.2
    text: |-
      Voor de toepassing van het eerste lid wordt, in afwijking van [artikel 2a, eerste lid, onderdeel k][ref1],
      onder een wederverkoper verstaan een ondernemer wiens hoofdactiviteit op het gebied van de aankoop van gas
      of elektriciteit bestaat in het opnieuw verkopen van die producten en wiens eigen verbruik van die producten
      verwaarloosbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel2a
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 2a
        hoofdstuk: I
  - number: 5b.3
    text: |-
      In afwijking van [artikel 5][ref1] wordt de levering van gas via het aardgasdistributiesysteem of van elektriciteit
      in andere gevallen dan bedoeld in het eerste lid verricht op de plaats waar de afnemer het werkelijke gebruik en
      verbruik van de goederen heeft. Indien alle goederen of een deel ervan in werkelijkheid niet door deze afnemer
      worden gebruikt, worden deze niet-gebruikte goederen geacht te zijn gebruikt en verbruikt op de plaats waar deze
      afnemer is gevestigd of een vaste inrichting heeft waarvoor de goederen worden geleverd. Bij het ontbreken hiervan
      wordt deze afnemer geacht de goederen te hebben gebruikt en verbruikt in zijn woonplaats of zijn gebruikelijke
      verblijfplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel5
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '5'
        hoofdstuk: II
        afdeling: 1a
  - number: '6.1'
    text: |-
      De plaats van een dienst, verricht voor een als zodanig handelende ondernemer, is de plaats waar die ondernemer de
      zetel van zijn bedrijfsuitoefening heeft gevestigd. Worden deze diensten evenwel verricht voor een vaste inrichting
      van de ondernemer op een andere plaats dan die waar hij de zetel van zijn bedrijfsuitoefening heeft gevestigd, dan
      geldt als plaats van dienst de plaats waar deze vaste inrichting zich bevindt. Bij gebreke van een dergelijke zetel
      of vaste inrichting, geldt als plaats van de dienst de woonplaats of gebruikelijke verblijfplaats van de ondernemer
      die deze diensten afneemt.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel6
  - number: '6.2'
    text: |-
      De plaats van een dienst, verricht voor een andere dan ondernemer, is de plaats waar de dienstverrichter de zetel
      van zijn bedrijfsuitoefening heeft gevestigd. Worden deze diensten evenwel verricht vanuit een vaste inrichting van
      de dienstverrichter, op een andere plaats dan die waar hij de zetel van zijn bedrijfsuitoefening heeft gevestigd,
      dan geldt als plaats van dienst de plaats waar deze vaste inrichting zich bevindt. Bij gebreke van een dergelijke
      zetel of vaste inrichting, geldt als plaats van de diensten de woonplaats of de gebruikelijke verblijfplaats van
      de dienstverrichter.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel6
  - number: 6a
    text: |-
      De plaats van een dienst die voor andere dan ondernemers wordt verricht door een tussenpersoon die in naam en voor
      rekening van derden handelt, is de plaats waar de onderliggende handeling overeenkomstig de bepalingen van deze wet
      wordt verricht.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel6a
  - number: 6b
    text: |-
      De plaats van een dienst die betrekking heeft op een onroerende zaak, met inbegrip van diensten van experts
      en makelaars in onroerende zaken, het verstrekken van accommodatie in het hotelbedrijf of in sectoren met een
      soortgelijke functie, zoals vakantiekampen of locaties die zijn ontwikkeld voor gebruik als kampeerterreinen, het
      verlenen van gebruiksrechten op een onroerende zaak, alsmede van diensten die erop gericht zijn de uitvoering van
      bouwwerken voor te bereiden of te coördineren, zoals de diensten verricht door architecten en door bureaus die
      toezicht houden op de uitvoering van het werk, is de plaats waar de onroerende zaak is gelegen.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel6b
  - number: 6c.1
    text: |-
      De plaats van personenvervoerdiensten is de plaats waar het vervoer plaatsvindt, zulks naar verhouding van de
      afgelegde afstanden.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel6c
  - number: 6c.2
    text: |-
      De plaats van andere goederenvervoerdiensten voor andere dan ondernemers dan het intracommunautaire
      goederenvervoer, is de plaats waar het vervoer plaatsvindt, zulks naar verhouding van de afgelegde afstanden.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel6c
  - number: 6c.3
    text: De plaats van intracommunautaire goederenvervoerdiensten voor andere dan ondernemers, is de plaats van vertrek.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel6c
  - number: 6d
    text: |-
      De plaats van een dienst en van daarmee samenhangende diensten, in verband met culturele, artistieke, sportieve,
      wetenschappelijke, educatieve, vermakelijkheids- of soortgelijke activiteiten, zoals beurzen en tentoonstellingen,
      inclusief de diensten van de organisatoren van dergelijke activiteiten, is de plaats waar die activiteiten
      daadwerkelijk plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel6d
  - number: 6e
    text: |-
      De plaats van de volgende diensten die voor andere dan ondernemers worden verricht, is de plaats waar die diensten
      daadwerkelijk worden verricht:
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel6e
  - number: 6e.a
    text: activiteiten die met vervoer samenhangen, zoals laden, lossen, intern vervoer en soortgelijke activiteiten;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel6e
  - number: 6e.b
    text: deskundigenonderzoeken en werkzaamheden met betrekking tot roerende lichamelijke zaken.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel6e
  - number: 6f.1
    text: De plaats van restaurant- en cateringdiensten is de plaats waar die diensten materieel worden verricht.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel6f
  - number: 6f.2
    text: |-
      De plaats van restaurant- en cateringdiensten die materieel worden verricht aan boord van een schip, vliegtuig
      of trein tijdens het in de Gemeenschap verrichte gedeelte van een passagiersvervoer, is de plaats van vertrek van
      het passagiersvervoer.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel6f
  - number: 6g.1
    text: |-
      De plaats van dienst van kortdurende verhuur van een vervoermiddel is de plaats waar dat vervoermiddel
      daadwerkelijk ter beschikking van de afnemer wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel6g
  - number: 6g.2
    text: |-
      Voor de toepassing van het eerste lid wordt onder «kortdurende verhuur» verstaan: het ononderbroken bezit of
      gebruik van het vervoermiddel gedurende een periode van ten hoogste dertig dagen, en voor schepen ten hoogste
      negentig dagen.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel6g
  - number: 6h.1
    text: |-
      De plaats van elektronische diensten, die worden verricht voor een andere dan ondernemer die in een lidstaat
      gevestigd is of daar zijn woonplaats of gebruikelijke verblijfplaats heeft, door een ondernemer die de zetel van
      zijn bedrijfsuitoefening buiten de Gemeenschap heeft gevestigd of daar over een vaste inrichting beschikt van
      waaruit de dienst wordt verricht, of, bij gebreke van een dergelijke zetel of vaste inrichting, zijn woonplaats of
      gebruikelijke verblijfplaats buiten de Gemeenschap heeft, is de plaats waar de andere dan ondernemer gevestigd is
      of zijn woonplaats of gebruikelijke verblijfplaats heeft.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel6h
  - number: 6h.2
    text: |-
      Het feit dat de dienstverrichter en de afnemer langs elektronische weg berichten uitwisselen, betekent op zich niet
      dat de verrichte dienst een elektronische dienst is.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel6h
  - number: 6i.1
    text: |-
      De plaats van de volgende diensten, verricht voor een andere dan ondernemer die buiten de Gemeenschap gevestigd
      is of aldaar zijn woonplaats of gebruikelijke verblijfplaats heeft, is de plaats waar deze persoon gevestigd is of
      zijn woonplaats of gebruikelijke verblijfplaats heeft:
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel6i
  - number: 6i.1.a
    text: |-
      de overdracht en het verlenen van auteursrechten, octrooien, licentierechten, handelsmerken en soortgelijke
      rechten;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel6i
  - number: 6i.1.b
    text: diensten op het gebied van de reclame;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel6i
  - number: 6i.1.c
    text: |-
      diensten verricht door raadgevende personen, ingenieurs, adviesbureaus, advocaten, accountants en andere
      soortgelijke diensten, alsmede gegevensverwerking en informatieverschaffing;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel6i
  - number: 6i.1.d
    text: |-
      de verplichting om een beroepsactiviteit of een in dit artikel vermeld recht geheel of gedeeltelijk niet uit te
      oefenen;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel6i
  - number: 6i.1.e
    text: |-
      bank-, financiële en verzekeringsverrichtingen met inbegrip van herverzekeringsverrichtingen en met uitzondering
      van de verhuur van safeloketten;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel6i
  - number: 6i.1.f
    text: het beschikbaar stellen van personeel;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel6i
  - number: 6i.1.g
    text: de verhuur van roerende lichamelijke zaken, met uitzondering van alle vervoermiddelen;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel6i
  - number: 6i.1.h
    text: |-
      het bieden van toegang tot aardgas- en elektriciteitsdistributiesystemen alsmede het verrichten van transport- en
      transmissiediensten via deze systemen en het verrichten van andere daarmee rechtstreeks verbonden diensten;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel6i
  - number: 6i.1.i
    text: telecommunicatiediensten;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel6i
  - number: 6i.1.j
    text: radio- en televisieomroepdiensten;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel6i
  - number: 6i.1.k
    text: elektronische diensten.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel6i
  - number: 6i.2
    text: |-
      Het feit dat de dienstverrichter en de afnemer langs elektronische weg berichten uitwisselen, betekent op zich niet
      dat de verrichte dienst een elektronische dienst is.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel6i
  - number: 6j
    text: |-
      De hierna genoemde diensten die worden verricht door ondernemers die buiten de Gemeenschap wonen of zijn gevestigd
      dan wel aldaar een vaste inrichting hebben van waaruit de dienst wordt verricht, of die, bij gebreke van een
      dergelijke zetel of vaste inrichting, hun woonplaats of gebruikelijke verblijfplaats buiten de Gemeenschap hebben,
      en de plaats van die diensten buiten de Gemeenschap is gelegen worden aangemerkt als worden zij in Nederland
      verricht, wanneer het werkelijke gebruik en de werkelijke exploitatie in Nederland plaatsvinden:
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel6j
  - number: 6j.a
    text: |-
      diensten, bestaande in de verhuur van vervoermiddelen, die worden verricht voor andere dan ondernemers die in
      Nederland wonen of zijn gevestigd dan wel aldaar een vaste inrichting hebben waarvoor de diensten worden verricht;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel6j
  - number: 6j.b
    text: |-
      diensten als bedoeld in [artikel 6i, eerste lid, onderdelen a tot en met g][ref1], die worden verricht voor in
      Nederland gevestigde lichamen in de zin van de Algemene wet inzake rijksbelastingen, andere dan ondernemers;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel6i
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel6j
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 6i
        hoofdstuk: II
        paragraaf: '2'
        afdeling: 1b
  - number: 6j.c
    text: |-
      diensten als bedoeld in [artikel 6i, eerste lid, onderdelen i en j][ref1], die worden verricht voor andere dan
      ondernemers die in Nederland gevestigd zijn of er hun woonplaats of gebruikelijke verblijfplaats hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel6i
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel6j
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 6i
        hoofdstuk: II
        paragraaf: '2'
        afdeling: 1b
  - number: '7.1'
    text: Ondernemer is ieder die een bedrijf zelfstandig uitoefent.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel7
  - number: '7.2'
    text: 'Waar in deze wet wordt gesproken van bedrijf, wordt daaronder mede verstaan:'
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel7
  - number: 7.2.a
    text: beroep;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel7
  - number: 7.2.b
    text: exploitatie van een vermogensbestanddeel om er duurzaam opbrengst uit te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel7
  - number: '7.3'
    text: |-
      Bij ministeriële regeling kan worden bepaald, dat publiekrechtelijke lichamen die, anders dan als ondernemer,
      prestaties verrichten welke uit hun aard ook door ondernemers kunnen worden verricht, met betrekking tot die
      prestaties als ondernemer worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel7
  - number: '7.4'
    text: |-
      Natuurlijke personen en lichamen in de zin van de [Algemene wet inzake rijksbelastingen][ref1], die op grond van
      het bepaalde in dit artikel ondernemer zijn en die in Nederland wonen of zijn gevestigd dan wel aldaar een vaste
      inrichting hebben en die in financieel, organisatorisch en economisch opzicht zodanig zijn verweven, dat zij een
      eenheid vormen, worden, al dan niet op verzoek van één of meer van deze natuurlijke personen of lichamen, bij voor
      bezwaar vatbare beschikking van de inspecteur als één ondernemer aangemerkt en wel met ingang van de eerste dag van
      de maand, volgende op die waarin de inspecteur die beschikking heeft afgegeven. Bij ministeriële regeling kunnen
      nadere regels worden gesteld ter zake van de vorming, wijziging en beëindiging van de fiscale eenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: '7.5'
    text: |-
      Onder bij ministeriële regeling te stellen voorwaarden kunnen lichamen in de zin van de
      [Algemene wet inzake rijksbelastingen][ref1] die, anders dan als ondernemer, prestaties verrichten ten behoeve van
      ondernemers, die krachtens [artikel 15][ref2] ter zake belasting in aftrek zouden hebben kunnen brengen, indien
      die prestaties ten behoeve van hen door een ondernemer zouden zijn verricht, met betrekking tot die prestaties als
      ondernemer worden aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '15'
        hoofdstuk: II
        afdeling: '4'
  - number: '7.6'
    text: |-
      Degene die, anders dan als ondernemer, een nieuw vervoermiddel levert welk vervoermiddel wordt verzonden of
      vervoerd naar een andere lid-staat, wordt met betrekking tot die levering als ondernemer aangemerkt.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel7
  - number: '7.7'
    text: |-
      Voor de toepassing van de regels betreffende de plaats van dienst in deze wet en in de daarop gebaseerde bepalingen
      wordt:
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel7
  - number: 7.7.a
    text: |-
      een ondernemer die ook werkzaamheden of handelingen verricht die niet als belastbare goederenleveringen of diensten
      in de zin van artikel 2, lid 1, van BTW-richtlijn 2006 worden beschouwd, met betrekking tot alle voor hem verrichte
      diensten als ondernemer aangemerkt;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel7
  - number: 7.7.b
    text: een rechtspersoon, andere dan ondernemer, die voor btw-doeleinden is geïdentificeerd, als ondernemer aangemerkt.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel7
  - number: '8.1'
    text: De belasting wordt berekend over de vergoeding.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel8
  - number: '8.2'
    text: |-
      De vergoeding is het totale bedrag dat - of voor zover de tegenprestatie niet in een geldsom bestaat, de totale
      waarde van de tegenprestatie welke - ter zake van de levering of de dienst in rekening wordt gebracht, de
      omzetbelasting niet daaronder begrepen. Ingeval ter zake van de levering of de dienst meer wordt voldaan dan
      hetgeen in rekening is gebracht, komt in plaats daarvan in aanmerking hetgeen is voldaan.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel8
  - number: '8.3'
    text: |-
      Ten aanzien van de handelingen, bedoeld in [artikel 3, derde lid][ref1], en [artikel 3a, eerste lid][ref2],
      wordt de vergoeding gesteld op de aankoopprijs van de goederen of van soortgelijke goederen of, indien er geen
      aankoopprijs is, de kostprijs, berekend op het tijdstip waarop deze handelingen worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel3a
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '3'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 3a
        hoofdstuk: II
        afdeling: '1'
  - number: '8.4'
    text: |-
      Ten aanzien van de handelingen, bedoeld in [artikel 4, derde lid][ref1], wordt de vergoeding gesteld op de normale
      waarde van de dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel4
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '4'
        hoofdstuk: II
        afdeling: '1'
  - number: '8.5'
    text: 'Bij algemene maatregel van bestuur kan worden bepaald in hoever:'
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel8
  - number: 8.5.a
    text: |-
      de korting voor contante betaling, de kosten van verpakking, de vracht- en assurantiekosten, de uitschotten van
      belasting en andere met doorlopende posten gelijk te stellen bedragen niet tot de vergoeding behoren;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel8
  - number: 8.5.b
    text: |-
      bij met grondrente bezwaarde eigendom, rechten van erfpacht, opstal, erfdienstbaarheid of beklemming,
      appartementen, lidmaatschapsrechten en dergelijke, de daaraan verbonden lasten tot de vergoeding behoren;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel8
  - number: 8.5.c
    text: |-
      bij eigendom, bezwaard met een recht van erfpacht, opstal, erfdienstbaarheid of beklemming, de vergoeding wordt
      verminderd met de aan die rechten verbonden lasten;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel8
  - number: 8.5.d
    text: |-
      bij levering anders dan met toepassing van [artikel 28b][ref1] of [28d][ref2], van
      gebruikte personenauto's, gebruikte motorrijwielen en gebruikte bestelauto's in de zin van
      [artikel 10 van de Wet op de belasting van personenauto’s en motorrijwielen 1992][ref3], de vergoeding
      wordt verminderd met de op de voet van die wet geheven belasting. Voor het vaststellen van het bedrag van die
      vermindering worden regels gesteld met inachtneming van de bepalingen van of ingevolge [die wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28b
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel28d
      [ref3]: https://wetten.overheid.nl/BWBR0005806#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0005806
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28b
        hoofdstuk: V
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 28d
        hoofdstuk: V
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0005806
        artikel: '10'
      - id: ref4
        bwb_id: BWBR0005806
  - number: '8.6'
    text: |-
      Indien gegevens voor het bepalen van de vergoeding zijn uitgedrukt in een andere munteenheid dan de euro, wordt
      de wisselkoers vastgesteld overeenkomstig de laatst genoteerde verkoopkoers op het tijdstip waarop de belasting
      verschuldigd wordt.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel8
  - number: '8.7'
    text: |-
      Ten aanzien van de handelingen, bedoeld in [artikel 4, tweede lid][ref1], wordt de vergoeding gesteld op de door
      de ondernemer voor het verrichten van de diensten gemaakte uitgaven. Bij ministeriële regeling kunnen nadere regels
      worden gesteld met betrekking tot de door de ondernemer voor het verrichten van deze diensten gemaakte uitgaven.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel4
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '4'
        hoofdstuk: II
        afdeling: '1'
  - number: '9.1'
    text: De belasting bedraagt 19 percent.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel9
  - number: '9.2'
    text: 'In afwijking van het eerste lid bedraagt de belasting:'
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel9
  - number: 9.2.a
    text: 6 percent voor leveringen van goederen en diensten, genoemd in de bij deze wet behorende tabel I;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel9
  - number: 9.2.b
    text: |-
      nihil voor leveringen van goederen en diensten, genoemd in de bij deze wet behorende tabel II, mits is voldaan aan
      bij algemene maatregel van bestuur vast te stellen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel9
  - number: '11.1'
    text: 'Onder bij algemene maatregel van bestuur vast te stellen voorwaarden zijn van de belasting vrijgesteld:'
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.1.a
    text: 'de levering van onroerende zaken en van rechten waaraan deze zijn onderworpen, met uitzondering van:'
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.1.a.1°
    text: |-
      de levering van een gebouw of een gedeelte van een gebouw en het erbij behorend terrein vóór, op of uiterlijk twee
      jaren na het tijdstip van eerste ingebruikneming, alsmede de levering van een bouwterrein;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.1.a.2°
    text: |-
      leveringen, andere dan die bedoeld onder 1°, aan personen die de onroerende zaak gebruiken voor doeleinden waarvoor
      een volledig of nagenoeg volledig recht op aftrek van belasting op de voet van [artikel 15][ref1] bestaat, mits
      de ondernemer die de levering verricht en degene aan wie wordt geleverd, blijkens de notariële akte van levering
      daarvoor hebben gekozen of in andere gevallen gezamenlijk een verzoek daartoe aan de inspecteur hebben gedaan en
      overigens voldoen aan bij ministeriële regeling te stellen voorwaarden;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '15'
        hoofdstuk: II
        afdeling: '4'
  - number: 11.1.b
    text: 'de verhuur (de verpachting daaronder begrepen) van onroerende zaken, met uitzondering van:'
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.1.b.1°
    text: de verhuur van blijvend geïnstalleerde werktuigen en machines;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.1.b.2°
    text: |-
      de verhuur binnen het kader van het hotel-, pension-, kamp- en vakantiebestedingsbedrijf aan personen, die daar
      slechts voor een korte periode verblijf houden;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.1.b.3°
    text: de verhuur van parkeerruimte voor voertuigen en de verhuur van lig- en bergplaatsen voor vaartuigen;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.1.b.4°
    text: de verhuur van safeloketten;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.1.b.5°
    text: |-
      de verhuur van onroerende zaken, andere dan gebouwen en gedeelten daarvan welke als woning worden gebruikt, aan
      personen die de onroerende zaak gebruiken voor doeleinden waarvoor een volledig of nagenoeg volledig recht op
      aftrek van de belasting op de voet van [artikel 15][ref1] bestaat mits de verhuurder en de huurder blijkens de
      schriftelijke huurovereenkomst daarvoor hebben gekozen of in andere gevallen gezamenlijk een verzoek daartoe aan de
      inspecteur hebben gedaan en overigens voldoen aan bij ministeriële regeling te stellen voorwaarden;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '15'
        hoofdstuk: II
        afdeling: '4'
  - number: 11.1.c
    text: |-
      het verzorgen en het verplegen van in een inrichting opgenomen personen, alsmede de handelingen die daarmee nauw
      samenhangen, waaronder begrepen het verstrekken van spijzen en dranken, geneesmiddelen en verbandmiddelen aan die
      personen;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.1.d
    text: |-
      de diensten aan de jeugd en de jeugdleiders door organisaties voor het algemene jeugdwerk die door de overheid als
      zodanig zijn erkend;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.1.e
    text: |-
      de diensten door organisaties die zich de beoefening van sport of de bevordering daarvan ten doel stellen, aan hun
      leden, met uitzondering van:
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.1.e.1°
    text: het verlenen van toegang tot wedstrijden, demonstraties en dergelijke;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.1.e.2°
    text: |-
      de diensten door watersportorganisaties die voor hun dienstverlening gebruik maken van één of meer personen die in
      dienstbetrekking werkzaam zijn ten behoeve van de organisatie, voor zover deze diensten bestaan in het met behulp
      van deze personen verrichten van werkzaamheden met betrekking tot vaartuigen dan wel in het ter beschikking stellen
      van lig- en bergplaatsen voor vaartuigen;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.1.f
    text: |-
      de bij algemene maatregel van bestuur aan te wijzen leveringen en diensten van sociale of culturele aard, mits de
      ondernemer geen winst beoogt en niet een ernstige verstoring van concurrentieverhoudingen optreedt ten opzichte van
      ondernemers die winst beogen;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.1.g.1°
    text: 'de volgende leveringen en diensten:'
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.1.g.1°.a
    text: |-
      gezondheidskundige verzorging van de mens door beoefenaren van een medisch of paramedisch beroep die
      een op dit beroep gerichte opleiding hebben voltooid waarvoor regels zijn gesteld bij of krachtens de
      [Wet op de beroepen in de individuele gezondheidszorg][ref1] of gezondheidskundige verzorging van de mens door
      beoefenaren van een medisch of paramedisch beroep waarvoor regels, met inbegrip van kwaliteitseisen betreffende
      opleiding en beroepsuitoefening, zijn vastgesteld door de minister van Volksgezondheid, Welzijn en Sport en welk
      beroep is vermeld in een door deze minister bij te houden register, voor zover de gezondheidskundige verzorging tot
      het gebied van deskundigheid van dit beroep behoort en onderdeel vormt van de bedoelde opleiding;


      [ref1]: https://wetten.overheid.nl/BWBR0006251
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006251
  - number: 11.1.g.1°.b
    text: |-
      diensten die door tandtechnici als zodanig worden verricht; de leveringen van tandprothesen door tandartsen en
      tandtechnici; het vervoer van zieken of gewonden met ambulance-automobielen;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.1.g.2°
    text: |-
      de diensten, bedoeld in
      [artikel 2, eerste lid, onderdelen a tot en met e, en h, van het Besluit zorgaanspraken AWBZ][ref1], verleend aan
      personen ten behoeve van wie in een indicatiebesluit op grond van de [Algemene Wet Bijzondere Ziektekosten][ref2]
      is vastgelegd dat ze op de in die onderdelen bedoelde zorg zijn aangewezen, alsmede huishoudelijke verzorging,
      bedoeld in de [Wet maatschappelijke ondersteuning][ref3], verleend aan personen ten behoeve van wie ingevolge
      [die wet][ref4] vaststaat dat ze op die verzorging zijn aangewezen. Tot de in de vorige volzin bedoelde
      diensten behoren niet de bij ministeriële regeling in verband met het voorkomen van een ernstige verstoring van
      concurrentieverhoudingen aan te wijzen diensten;


      [ref1]: https://wetten.overheid.nl/BWBR0014149#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002614
      [ref3]: https://wetten.overheid.nl/BWBR0020031
      [ref4]: https://wetten.overheid.nl/BWBR0020031
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0014149
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002614
      - id: ref3
        bwb_id: BWBR0020031
      - id: ref4
        bwb_id: BWBR0020031
  - number: 11.1.g.3°
    text: |-
      de diensten door landbouwers, veehouders, tuinbouwers en bosbouwers bestaande in het verlenen van dagbesteding,
      arbeidstraining of dagopvang aan:
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.1.g.3°.a
    text: |-
      personen voor wie zij daartoe een schriftelijke overeenkomst hebben gesloten met een instelling als bedoeld in
      [artikel 1, eerste lid, onderdeel d, van de Algemene Wet Bijzondere Ziektekosten][ref1] of met een instelling die
      werkzaam is op het terrein van sociaal en maatschappelijk werk;


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel1
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '1'
  - number: 11.1.g.3°.b
    text: |-
      personen met wie zij daartoe een schriftelijke overeenkomst hebben gesloten en die beschikken over een
      persoonsgebonden budget met het oog op het geldend maken van hun aanspraken ingevolge de onder a genoemde wet;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.1.h
    text: de diensten door lijkbezorgers;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.1.i
    text: 'de volgende leveringen en diensten:'
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.1.i.1°
    text: |-
      de handelingen, bemiddeling daaronder begrepen, betreffende deviezen, bankbiljetten en munten, welke in enig land
      de hoedanigheid van wettig betaalmiddel bezitten, met uitzondering van bankbiljetten en munten, welke gewoonlijk
      niet als wettig betaalmiddel worden gebruikt of welke een verzamelwaarde hebben;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.1.i.2°
    text: |-
      de handelingen, bemiddeling daaronder begrepen doch uitgezonderd bewaring en beheer, inzake effecten en andere
      waardepapieren met uitzondering van documenten welke goederen vertegenwoordigen;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.1.i.3°
    text: |-
      het beheer van door beleggingsfondsen en beleggingsmaatschappijen ter collectieve belegging bijeengebrachte
      vermogens;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.1.j
    text: 'de volgende diensten:'
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.1.j.1°
    text: het verlenen van en de bemiddeling inzake krediet;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.1.j.2°
    text: |-
      de handelingen, bemiddeling daaronder begrepen, betreffende giro- en rekeningcourantverkeer, deposito's,
      betalingen, overmakingen, schuldvorderingen, cheques en andere handelspapieren, met uitzondering van de invordering
      van schuldvorderingen;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.1.j.3°
    text: het aangaan van en het bemiddelen bij borgtochten en andere zekerheids- en garantieverbintenissen;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.1.k
    text: |-
      handelingen ter zake van verzekering en herverzekering met inbegrip van daarmee samenhangende diensten, verricht
      door assurantiemakelaars en verzekeringstussenpersonen;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.1.l
    text: |-
      de kansspelen in de zin van [artikel 2, eerste lid, van de Wet op de kansspelbelasting][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002359#Artikel2
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002359
        artikel: '2'
  - number: 11.1.m
    text: |-
      de diensten, en de daarmee gepaard gaande leveringen, bedoeld in [artikel 14 van de Postwet 2009][ref1], die worden
      verricht door een verlener van de universele postdienst, bedoeld in [die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0025572
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0025572
  - number: 11.1.n
    text: de niet-commerciële activiteiten van openbare radio- en televisieorganisaties;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.1.o
    text: 'het verstrekken van:'
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.1.o.1°
    text: |-
      onderwijs, met inbegrip van de diensten en leveringen die daarmee nauw samenhangen, door daartoe bestemde
      inrichtingen, als is omschreven bij of krachtens de wetten tot regeling van het onderwijs dat krachtens wettelijk
      voorschrift is onderworpen aan het Rijksschooltoezicht of aan een ander toezicht door de minister die met de zorg
      voor het desbetreffende onderwijs is belast;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.1.o.2°
    text: |-
      bij algemene maatregel van bestuur aan te wijzen onderwijs, met inbegrip van de diensten en leveringen die
      daarmee nauw samenhangen, waarbij kan worden bepaald, dat de vrijstelling slechts toepassing vindt ten aanzien van
      ondernemers die met dat onderwijs geen winst beogen;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.1.p
    text: |-
      de voordrachten en dergelijke diensten in bij ministeriële regeling aan te wijzen gevallen, mits tegen een
      vergoeding die in hoofdzaak strekt tot dekking van kosten;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.1.q
    text: de diensten door componisten, schrijvers en journalisten;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.1.r
    text: |-
      de levering van een roerende zaak die in het bedrijf van de ondernemer uitsluitend is gebruikt ten behoeve
      van vrijgestelde prestaties of voor doeleinden als zijn bedoeld in [artikel 16][ref1], ingeval ter zake van de
      voorafgaande levering van die zaak geen belasting in aftrek is gebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel16
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '16'
        hoofdstuk: II
        afdeling: '4'
  - number: 11.1.s
    text: de levering van menselijke organen, menselijk bloed en moedermelk;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.1.t
    text: |-
      de diensten en daarmee nauw samenhangende leveringen door werkgevers- en werknemersorganisaties, alsmede door
      organisaties van politieke, godsdienstige, vaderlandslievende, levensbeschouwelijke of liefdadige aard aan
      hun leden tegen een statutair vastgestelde contributie; bij algemene maatregel van bestuur kan de vrijstelling
      buiten toepassing worden verklaard in gevallen waarin zij zou leiden tot een ernstige verstoring van
      concurrentieverhoudingen;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.1.u
    text: |-
      bij algemene maatregel van bestuur aan te wijzen diensten welke door zelfstandige groeperingen van personen of
      lichamen in de zin van de [Algemene wet inzake rijksbelastingen][ref1], die prestaties verrichten welke zijn
      vrijgesteld of waarvoor zij geen ondernemer zijn, worden verleend aan hun leden en welke rechtstreeks nodig zijn
      voor het verrichten van voornoemde prestaties, mits die groeperingen van hun leden slechts terugbetaling vorderen
      van hun aandeel in de gezamenlijke uitgaven en geen ernstige verstoring van concurrentieverhoudingen optreedt;


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: 11.1.v
    text: |-
      leveringen en diensten van bijkomstige aard door organisaties waarvan de prestaties overigens op grond van
      onderdeel *c*, *d*, *e*, *f*, *o*, 1°, of *t* zijn vrijgesteld, voor zover die leveringen en diensten voortvloeien
      uit activiteiten ter verkrijging van financiële steun voor deze organisaties, mits de ontvangsten ter zake van
      leveringen niet meer bedragen dan € 68 067 per jaar en ter zake van diensten niet meer dan € 22 689 per jaar, met
      dien verstande dat voor organisaties als bedoeld in onderdeel *e*, laatstgenoemd bedrag € 31 765 bedraagt. Tot
      de in dit onderdeel bedoelde leveringen en diensten behoren niet de bij ministeriële regeling in verband met het
      voorkomen van een ernstige verstoring van de concurrentieverhoudingen aan te wijzen leveringen of diensten;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.1.w
    text: |-
      opvang van kinderen als bedoeld in [artikel 1, eerste lid, onderdelen b en c, van de Wet kinderopvang][ref1],
      indien het betreft kinderopvang in een overeenkomstig [die wet][ref2] geregistreerd kindercentrum of
      gastouderopvang door tussenkomst van een overeenkomstig [die wet][ref3] geregistreerd gastouderbureau
      en overigens wordt voldaan aan de in voormelde wet gestelde eisen, opvang van kinderen als bedoeld in
      [artikel 1, tweede lid, onderdelen a en b, van die wet][ref4], alsmede nader bij algemene maatregel van bestuur aan
      te wijzen vormen van kinderopvang.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017017
      [ref3]: https://wetten.overheid.nl/BWBR0017017
      [ref4]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0017017
      - id: ref3
        bwb_id: BWBR0017017
      - id: ref4
        bwb_id: BWBR0017017
        artikel: '1'
  - number: '11.2'
    text: |-
      De vrijstellingen, bedoeld in het eerste lid, onderdelen *c*, *e* en *t*, zijn slechts van toepassing, indien
      met de aldaar bedoelde prestaties geen winst wordt beoogd. Onder het beogen van winst wordt mede verstaan het
      behalen van exploitatieoverschotten, tenzij deze niet worden uitgekeerd, doch worden aangewend ten dienste van de
      bedoelde prestaties. De nauw samenhangende leveringen van goederen en diensten, bedoeld in het eerste lid, aanhef,
      onderdelen c, o, onder 1° en 2°, en t, zijn van de vrijstelling uitgesloten:
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.2.a
    text: wanneer zij niet onontbeerlijk zijn voor het verrichten van de vrijgestelde handelingen;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.2.b
    text: |-
      wanneer zij in hoofdzaak ertoe strekken aan de instelling extra opbrengsten te verschaffen door de uitvoering
      van handelingen welke worden verricht in rechtstreekse mededinging met aan de heffing van belasting onderworpen
      handelingen van commerciële ondernemingen.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: '11.3'
    text: 'Voor de toepassing van het eerste lid, onderdeel *a*, onder 1°:'
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.3.a
    text: wordt als gebouw beschouwd ieder bouwwerk dat vast met de grond is verbonden;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.3.b
    text: |-
      wordt na de verbouwing van een gebouw de ingebruikneming als eerste ingebruikneming aangemerkt, indien door die
      verbouwing een vervaardigd goed is voortgebracht;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.3.c
    text: |-
      wordt als erbij behorend terrein beschouwd ieder terrein dat naar maatschappelijke opvattingen behoort bij dan wel
      dienstbaar is aan het gebouw.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: '11.4'
    text: 'Voor de toepassing van het eerste lid, onderdeel *a*, onder 1°, wordt als bouwterrein beschouwd onbebouwde grond:'
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.4.a
    text: waaraan bewerkingen plaatsvinden of hebben plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.4.b
    text: ten aanzien waarvan voorzieningen worden of zijn getroffen die uitsluitend dienstbaar zijn aan de grond;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.4.c
    text: in de omgeving waarvan voorzieningen worden of zijn getroffen; of
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: 11.4.d
    text: ter zake waarvan een bouwvergunning is verleend;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
  - number: '11.5'
    text: |-
      Voor de toepassing van het eerste lid, onderdelen a, onder 2°, en b, onder 5°, worden onder het gebruiken
      voor doeleinden waarvoor een volledig of nagenoeg volledig recht op aftrek van belasting op de voet van
      [artikel 15][ref1] bestaat, niet begrepen de handelingen, bedoeld in de [artikelen 3, derde lid][ref2], en
      [4, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel4
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '15'
        hoofdstuk: II
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '3'
        hoofdstuk: II
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002629
        artikel: '4'
        hoofdstuk: II
        afdeling: '1'
  - number: '12.1'
    text: De belasting wordt geheven van de ondernemer die de levering of de dienst verricht.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel12
  - number: '12.2'
    text: |-
      Ingeval de ondernemer die een levering als bedoeld in [artikel 5b][ref1] of een dienst als bedoeld in
      [artikel 6, eerste lid][ref2], verricht, niet in Nederland woont of is gevestigd en aldaar geen vaste inrichting
      heeft van waaruit de levering wordt verricht of de dienst wordt verleend, en aan degene aan wie de levering wordt
      verricht of de dienst wordt verleend een btw-identificatienummer in Nederland is toegekend, wordt de belasting
      geheven van degene aan wie de levering wordt verricht of de dienst wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel5b
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel6
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 5b
        hoofdstuk: II
        afdeling: 1a
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: 1b
  - number: '12.3'
    text: |-
      Ingeval de ondernemer die de levering, niet zijnde een levering waarop de bij deze wet behorende tabel II,
      onderdeel *a*, post 6, van toepassing is, of een dienst, andere dan bedoeld in het tweede lid, verricht, niet in
      Nederland woont of is gevestigd en aldaar geen vaste inrichting heeft van waaruit de levering of de dienst wordt
      verricht, en degene aan wie de levering wordt verricht of de dienst wordt verleend, een ondernemer is die in
      Nederland woont of is gevestigd dan wel aldaar een vaste inrichting heeft, of een in Nederland gevestigd lichaam
      in de zin van de [Algemene wet inzake rijksbelastingen][ref1] is, wordt de belasting geheven van degene aan wie de
      levering wordt verricht of de dienst wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: '12.4'
    text: |-
      Voor de toepassing van dit artikel wordt een ondernemer die een vaste inrichting heeft in Nederland, geacht een
      niet in Nederland gevestigde ondernemer te zijn wanneer aan de volgende voorwaarden is voldaan:
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel12
  - number: 12.4.a
    text: hij verricht in Nederland een belastbare goederenlevering of een dienst;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel12
  - number: 12.4.b
    text: bij het verrichten van die goederenlevering of die dienst is de vaste inrichting in Nederland niet betrokken.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel12
  - number: '12.5'
    text: |-
      In bij algemene maatregel van bestuur aan te wijzen gevallen wordt onder bij of krachtens deze maatregel te stellen
      regelen de belasting, ten einde voor de inning daarvan meer waarborgen te scheppen, geheven van degene aan wie de
      levering wordt verricht of de dienst wordt verleend.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel12
  - number: 12a
    text: |-
      Indien ten onrechte gebruik is gemaakt van de uitzondering van [artikel 11, eerste lid, onderdeel ][ref1], omdat
      degene aan wie de levering is verricht de onroerende zaak niet gebruikt voor doeleinden waarvoor een volledig of
      nagenoeg volledig recht op aftrek van belasting op de voet van [artikel 15][ref2] bestaat, wordt de belasting die
      in verband met die levering door degene die de levering heeft verricht op de voet van [artikel 15][ref3] in aftrek
      is gebracht, nageheven van degene aan wie de levering is verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '11'
        hoofdstuk: II
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '15'
        hoofdstuk: II
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0002629
        artikel: '15'
        hoofdstuk: II
        afdeling: '4'
  - number: '13.1'
    text: 'De belasting wordt verschuldigd:'
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel13
  - number: 13.1.a
    text: |-
      in gevallen waarin ingevolge [artikel 35][ref1] een factuur moet worden uitgereikt, op het tijdstip van de
      uitreiking of, indien deze niet tijdig plaatsvindt, het tijdstip waarop zij uiterlijk had moeten geschieden tenzij
      sprake is van een dienst waarover de belasting op grond van [artikel 12, tweede lid][ref2], verschuldigd is door
      de afnemer van deze dienst, in welk geval de belasting verschuldigd wordt op het tijdstip waarop de dienst wordt
      verricht;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel12
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '35'
        hoofdstuk: VI
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '12'
        hoofdstuk: II
        afdeling: '4'
  - number: 13.1.b
    text: in andere gevallen op het tijdstip waarop de levering of de dienst wordt verricht.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel13
  - number: '13.2'
    text: |-
      In afwijking in zover van het eerste lid wordt de belasting of het desbetreffende gedeelte daarvan uiterlijk
      verschuldigd op het tijdstip waarop de vergoeding geheel of gedeeltelijk wordt ontvangen.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel13
  - number: '13.3'
    text: |-
      Bij levering van goederen met toepassing van de bij deze wet behorende tabel II, onderdeel *a*, post 6, wordt de
      belasting, in afwijking in zover van het eerste en tweede lid, verschuldigd op de vijftiende dag na de maand waarin
      de levering is verricht. Ingeval vóór dit tijdstip een factuur wordt uitgereikt, wordt de belasting verschuldigd op
      het tijdstip van uitreiking van deze factuur.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel13
  - number: '13.4'
    text: |-
      In afwijking in zoverre van het eerste lid, onderdeel b, wordt de belasting ter zake van diensten als bedoeld
      in [artikel 4, tweede lid][ref1], verschuldigd op de laatste dag van het kalenderjaar waarin die diensten worden
      verricht. Diensten die op die dag nog niet zijn voltooid, worden geacht op die dag te zijn voltooid voorzover zij
      betrekking hebben op dat kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel4
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '4'
        hoofdstuk: II
        afdeling: '1'
  - number: '13.5'
    text: |-
      Voor de toepassing van het eerste lid, onderdeel b, worden de diensten waarvan de belasting op grond van
      [artikel 12, tweede lid][ref1], verschuldigd is door de afnemer van deze diensten en die doorlopend worden verricht
      gedurende een periode langer dan één jaar geacht bij de afloop van elk kalenderjaar te zijn voltooid zolang de
      dienstverrichting doorloopt en die geen aanleiding geven tot afrekeningen of betalingen in die periode.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel12
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '12'
        hoofdstuk: II
        afdeling: '4'
  - number: '14.1'
    text: De in een tijdvak verschuldigd geworden belasting moet op aangifte worden voldaan.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel14
  - number: '14.2'
    text: |-
      In afwijking in zover van het eerste lid wordt de belasting die verschuldigd is geworden door ondernemers als
      bedoeld in [artikel 7, zesde lid][ref1], niet voldaan over een tijdvak.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel7
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '7'
        hoofdstuk: II
        afdeling: 1c
  - number: '15.1'
    text: |-
      De in [artikel 2][ref1] bedoelde belasting welke de ondernemer in aftrek brengt, is:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel2
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '2'
        hoofdstuk: I
  - number: 15.1.a
    text: |-
      de belasting welke in het tijdvak van aangifte door andere ondernemers ter zake van door hen aan de ondernemer
      verrichte leveringen en verleende diensten in rekening is gebracht op een op de voorgeschreven wijze opgemaakte
      factuur;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel15
  - number: 15.1.b
    text: |-
      de belasting welke in het tijdvak van aangifte is verschuldigd geworden ter zake van door de ondernemer verrichte
      intracommunautaire verwervingen als bedoeld in [artikel 17a, eerste lid][ref1], mits de ondernemer in het bezit is
      van een op de voorgeschreven wijze opgemaakte factuur;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel17a
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 17a
        hoofdstuk: IIA
        afdeling: '1'
  - number: 15.1.c
    text: 'de belasting welke in het tijdvak van aangifte is verschuldigd geworden:'
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel15
  - number: 15.1.c.1°
    text: |-
      ter zake van invoer van voor de ondernemer bestemde goederen, mits is voldaan aan bij ministeriële regeling te
      stellen voorwaarden;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel15
  - number: 15.1.c.2°
    text: |-
      op grond van [artikel 12, tweede, derde en vierde lid][ref1], ter zake van aan de ondernemer verrichte leveringen
      en verleende diensten;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel12
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '12'
        hoofdstuk: II
        afdeling: '4'
  - number: 15.1.c.3°
    text: ter zake van het door de ondernemer bestemmen van goederen voor bedrijfsdoeleinden;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel15
  - number: 15.1.c.4°
    text: |-
      ter zake van verrichtingen als bedoeld in [artikel 4, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel4
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '4'
        hoofdstuk: II
        afdeling: '1'
  - number: 15.1.c.5°
    text: |-
      ter zake van handelingen en situaties als bedoeld in [artikel 17a, derde en vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel17a
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 17a
        hoofdstuk: IIA
        afdeling: '1'
  - number: 15.1.d
    text: |-
      de belasting die is begrepen in de aankoopprijs van een nieuw vervoermiddel dat met toepassing van onderdeel *a*,
      post 6, van de bij deze wet behorende tabel II, wordt geleverd door:
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel15
  - number: 15.1.d.1°
    text: |-
      een in [artikel 7, zesde lid][ref1], bedoelde ondernemer; of


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel7
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '7'
        hoofdstuk: II
        afdeling: 1c
  - number: 15.1.d.2°
    text: een wederverkoper;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel15
  - number: '15.2'
    text: |-
      De ondernemer brengt eveneens in aftrek de belasting, bedoeld in het eerste lid, voorzover de goederen en diensten
      door de ondernemer worden gebruikt voor:
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel15
  - number: 15.2.a
    text: |-
      handelingen door de als zodanig handelende ondernemer buiten Nederland verricht, waarvoor recht op aftrek zou
      ontstaan wanneer zij binnen Nederland zouden plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel15
  - number: 15.2.b
    text: |-
      handelingen die overeenkomstig de artikelen 143, onder f, g, h en i, 144 en 146 tot en met 153 van de BTW-richtlijn
      2006 zijn vrijgesteld;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel15
  - number: 15.2.c
    text: |-
      handelingen als bedoeld in de [artikelen 11, eerste lid, onderdelen i, j en k][ref1], mits de ontvanger buiten de
      Gemeenschap gevestigd is of wanneer de handelingen rechtstreeks samenhangen met goederen die bestemd zijn om te
      worden uitgevoerd uit de Gemeenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel11
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '11'
        hoofdstuk: II
        afdeling: '3'
  - number: '15.3'
    text: |-
      In afwijking in zoverre van het eerste lid wordt bij levering van een nieuw vervoermiddel door een in het eerste
      lid, onderdeel d, bedoelde ondernemer de in het eerste lid bedoelde aftrek beperkt tot de belasting die in de
      aankoopprijs is begrepen of die verschuldigd is geworden ter zake van de intracommunautaire verwerving of de
      invoer van het vervoermiddel. De aftrek bedraagt ten hoogste het bedrag van de belasting dat verschuldigd zou
      zijn indien op die levering het tarief van nihil niet van toepassing zou zijn. Het recht op aftrek ontstaat op het
      tijdstip waarop het vervoermiddel wordt geleverd. Bij ministeriële regeling worden nadere regels gesteld inzake de
      toepassing van dit lid en van het eerste lid, onderdeel d.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel15
  - number: '15.4'
    text: |-
      De aftrek van belasting vindt plaats overeenkomstig de bestemming van de goederen en diensten op het tijdstip
      waarop de belasting aan de ondernemer in rekening wordt gebracht dan wel op het tijdstip waarop de belasting wordt
      verschuldigd. Indien op het tijdstip waarop de ondernemer goederen en diensten gaat gebruiken, blijkt, dat de
      belasting ter zake voor een groter of kleiner gedeelte in aftrek is gebracht dan waartoe de ondernemer op grond van
      het gebruik is gerechtigd, wordt hij de te veel afgetrokken belasting op dat tijdstip verschuldigd. De verschuldigd
      geworden belasting wordt op de voet van [artikel 14][ref1] voldaan. De te weinig afgetrokken belasting wordt aan
      hem op zijn verzoek teruggegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel14
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '14'
        hoofdstuk: II
        afdeling: '4'
  - number: '15.5'
    text: |-
      Geen aftrek vindt plaats van belasting welke in rekening is gebracht ter zake van het verstrekken van spijzen
      en dranken voor gebruik ter plaatse binnen het kader van het hotel-, café-, restaurant-, pension- en aanverwant
      bedrijf aan personen die daar slechts voor een korte periode verblijf houden.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel15
  - number: '15.6'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld omtrent de aftrek van belasting, ingeval goederen en
      diensten door de ondernemer mede worden gebruikt anders dan voor belaste handelingen of anders dan voor de
      handelingen, bedoeld in het tweede lid. Bij ministeriële regeling worden nadere regels gesteld omtrent de aftrek
      van belasting, ingeval een auto door de ondernemer mede wordt gebruikt voor eigen privé-doeleinden. Daarbij kan
      worden bepaald dat het afstoten van goederen welke de ondernemer in zijn bedrijf heeft gebruikt, buiten aanmerking
      wordt gelaten.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel15
  - number: '15.7'
    text: 'Een herziening van de aftrek vindt niet plaats:'
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel15
  - number: 15.7.a
    text: in geval van naar behoren bewezen en aangetoonde vernietiging, verlies of diefstal van goederen;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel15
  - number: 15.7.b
    text: |-
      in geval van onttrekkingen van goederen voor het verstrekken van geschenken van geringe waarde en van monsters, als
      bedoeld in [artikel 3, achtste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel3
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '3'
        hoofdstuk: II
        afdeling: '1'
  - number: '16.1'
    text: |-
      Bij koninklijk besluit kan de in [artikel 15, eerste lid][ref1], bedoelde aftrek in bepaalde gevallen geheel of
      gedeeltelijk worden uitgesloten, zulks ten einde te voorkomen, dat op goederen en diensten, welke worden gebruikt
      voor het voeren van een zekere staat, voor het bevredigen van behoeften van anderen dan ondernemers of ten behoeve
      van prestaties als zijn bedoeld in [artikel 11][ref2], de belasting geheel of gedeeltelijk niet drukt.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel11
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '15'
        hoofdstuk: II
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '11'
        hoofdstuk: II
        afdeling: '3'
  - number: '16.2'
    text: |-
      Na het tot stand komen van een besluit, door Ons krachtens het eerste lid genomen, wordt onverwijld een voorstel
      van wet tot goedkeuring van dat besluit aan de Tweede Kamer der Staten-Generaal gezonden.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel16
  - number: '16.3'
    text: |-
      Indien het voorstel wordt ingetrokken of indien een der Kamers der Staten-Generaal tot het niet-aannemen van het
      voorstel besluit, wordt Ons besluit onverwijld ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel16
  - number: 16a
    text: |-
      Ter zake van prestaties als bedoeld in [artikel 3, derde lid, onderdelen a en c][ref1], en
      [artikel 4, tweede lid][ref2], wordt de belasting niet verschuldigd indien het gebruik betreft als bedoeld in de op
      [artikel 15, zesde lid, tweede volzin][ref3], gebaseerde ministeriële regeling of indien het prestaties betreft als
      bedoeld in het op [artikel 16, eerste lid][ref4], gebaseerde koninklijk besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0002629#Artikel16
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '3'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '4'
        hoofdstuk: II
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002629
        artikel: '15'
        hoofdstuk: II
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0002629
        artikel: '16'
        hoofdstuk: II
        afdeling: '4'
  - number: '17'
    text: |-
      Ingeval de voor aftrek in aanmerking komende belasting meer bedraagt dan de in het tijdvak verschuldigd geworden
      belasting, wordt het verschil aan de ondernemer op zijn verzoek terugbetaald.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel17
  - number: 17a.1
    text: |-
      Intracommunautaire verwerving van goederen is de verwerving van goederen ingevolge een levering van deze goederen
      door een als zodanig handelende ondernemer, welke goederen worden verzonden of vervoerd van een lid-staat naar een
      andere lid-staat.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel17a
  - number: 17a.2
    text: |-
      Wanneer door rechtspersonen, andere dan ondernemers, verworven goederen worden verzonden of vervoerd uit een derde-
      land en door deze rechtspersonen worden ingevoerd in een andere lid-staat dan die van aankomst van de verzending
      of het vervoer, worden deze goederen geacht te zijn verzonden of vervoerd vanuit de lid-staat van invoer van de
      goederen.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel17a
  - number: 17a.3
    text: |-
      Met een intracommunautaire verwerving van goederen onder bezwarende titel als bedoeld in
      [artikel 1, onderdeel b][ref1], wordt gelijkgesteld het beschikken voor bedrijfsdoeleinden over een goed dat
      door of voor rekening van de ondernemer wordt verzonden of vervoerd uit een andere lid-staat waar het goed is
      vervaardigd, gewonnen, bewerkt, gekocht, onderworpen aan heffing van belasting ter zake van intracommunautaire
      verwerving, of door hem is ingevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel1
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '1'
        hoofdstuk: I
  - number: 17a.4
    text: |-
      Met een intracommunautaire verwerving van goederen onder bezwarende titel als bedoeld in
      [artikel 1, onderdeel b][ref1], wordt mede gelijkgesteld het komen binnen Nederland van goederen die zijn verzonden
      of vervoerd vanuit een andere lid-staat, waar zij ter beschikking hebben gestaan zonder dat over deze goederen
      aldaar belasting is geheven of voldaan in verband met het gebruik ervan in het kader van het Verdrag van Londen
      van 19 juni 1951 tussen de Staten, die partij zijn bij het Noord-Atlantisch Verdrag, nopens de rechtspositie van
      hun krijgsmachten (Trb. 1951, 114 en Trb. 1953, 10, Stb. 1953, 438), indien de invoer van die goederen niet zou
      zijn vrijgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel1
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '1'
        hoofdstuk: I
  - number: 17b.1
    text: |-
      De plaats waar een intracommunautaire verwerving wordt verricht, is de plaats van aankomst van de verzending of
      het vervoer.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel17b
  - number: 17b.2
    text: |-
      Onverminderd het bepaalde in het eerste lid wordt een intracommunautaire verwerving verricht in de lid-staat die
      aan de afnemer het btw-identificatienummer heeft toegekend waaronder de verwerving wordt verricht, voor zover de
      afnemer niet aantoont dat de belasting is geheven met toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel17b
  - number: 17c.1
    text: De belasting wordt berekend over de vergoeding.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel17c
  - number: 17c.2
    text: |-
      Met betrekking tot intracommunautaire verwervingen waarbij de ondernemer die de goederen levert verplicht is
      ter zake van die levering een factuur uit te reiken is [artikel 8, tweede, vijfde en zesde lid][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel8
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
  - number: 17c.3
    text: |-
      Met betrekking tot hetgeen op de voet van [artikel 17a, derde en vierde lid][ref1], wordt gelijkgesteld met een
      intracommunautaire verwerving van goederen onder bezwarende titel als bedoeld in [artikel 1, onderdeel b][ref2], is
      [artikel 8, derde en zesde lid][ref3], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel17a
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel8
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 17a
        hoofdstuk: IIA
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '1'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0002629
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
  - number: 17c.4
    text: |-
      In afwijking van het eerste lid wordt met betrekking tot de intracommunautaire verwervingen van accijnsgoederen,
      andere dan tabaksprodukten, waarbij de voor die goederen in Nederland verschuldigde of voldane accijns niet in de
      vergoeding is begrepen, de belasting berekend over de vergoeding vermeerderd met die voor de goederen verschuldigde
      of voldane accijns.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel17c
  - number: 17c.5
    text: |-
      Het vierde lid is van overeenkomstige toepassing met betrekking tot de
      intracommunautaire verwervingen van alcoholvrije dranken als bedoeld in
      [artikel 6 van de Wet op de verbruiksbelastingen van alcoholvrije dranken en van enkele andere produkten][ref1],
      waarbij de voor die goederen in Nederland op de voet van die wet verschuldigde of voldane belasting niet in de
      vergoeding is begrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0005802#Artikel6
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0005802
        artikel: '6'
  - number: 17d
    text: |-
      [Artikel 9][ref1] is van overeenkomstige toepassing, met dien verstande dat het tarief van nihil alleen toepassing
      kan vinden ten aanzien van intracommunautaire verwervingen van goederen, genoemd in de bij deze wet behorende tabel
      II, onderdeel *a*, posten 1, 3, 4 en 5.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel9
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel17d
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '9'
        hoofdstuk: II
        afdeling: '2'
  - number: 17e
    text: |-
      Bij ministeriële regeling wordt, onder daarbij te stellen voorwaarden en beperkingen, vrijstelling van belasting
      verleend voor de intracommunautaire verwervingen van goederen waarvoor:
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel17e
  - number: 17e.a
    text: de levering in Nederland in elk geval is vrijgesteld;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel17e
  - number: 17e.b
    text: bij invoer in elk geval een vrijstelling van toepassing zou zijn;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel17e
  - number: 17e.c
    text: in elk geval recht zou bestaan op volledige teruggaaf daarvan.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel17e
  - number: 17f
    text: De belasting wordt geheven van degene die de intracommunautaire verwerving verricht.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel17f
  - number: 17g.1
    text: |-
      De belasting wordt verschuldigd op de vijftiende dag na de maand waarin de intracommunautaire verwerving is
      verricht.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel17g
  - number: 17g.2
    text: |-
      Een intracommunautaire verwerving van een goed wordt verricht op het tijdstip waarop de aan de verwerving ten
      grondslag liggende levering van dat goed wordt verricht.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel17g
  - number: 17g.3
    text: |-
      Ingeval vóór het in het eerste lid bedoelde tijdstip een factuur wordt uitgereikt aan degene die de verwerving
      verricht, wordt de belasting, in afwijking in zoverre van het eerste lid, verschuldigd op het tijdstip waarop de
      factuur wordt uitgereikt.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel17g
  - number: 17h.1
    text: De in een tijdvak verschuldigd geworden belasting moet op aangifte worden voldaan.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel17h
  - number: 17h.2
    text: |-
      In afwijking in zover van het eerste lid wordt de belasting die verschuldigd is geworden ter zake van
      intracommunautaire verwervingen van nieuwe vervoermiddelen door natuurlijke personen en rechtspersonen aan wie geen
      btw-identificatienummer is toegekend, niet voldaan over een tijdvak.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel17h
  - number: 17h.3
    text: |-
      Ingeval naast de belasting die verschuldigd is ter zake van de in het tweede lid bedoelde intracommunautaire
      verwerving van een nieuw vervoermiddel, tevens belasting verschuldigd is geworden op de voet van de
      [Wet op de belasting van personenauto’s en motorrijwielen 1992][ref1], is, in afwijking van het
      [eerste en het tweede lid, artikel 6 van die wet][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005806
      [ref2]: https://wetten.overheid.nl/BWBR0005806#Artikel6
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel17h
    references:
      - id: ref1
        bwb_id: BWBR0005806
      - id: ref2
        bwb_id: BWBR0005806
        artikel: '6'
  - number: '18.1'
    text: 'Invoer van goederen is:'
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel18
  - number: 18.1.a
    text: |-
      het brengen in Nederland van goederen die niet voldoen aan de voorwaarden van de artikelen 23 en 24 van het Verdrag
      tot oprichting van de Europese Gemeenschap;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel18
  - number: 18.1.b
    text: het brengen in Nederland vanuit een derde-land van andere dan de in onderdeel a bedoelde goederen;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel18
  - number: 18.1.c
    text: het in Nederland beëindigen van, dan wel het in Nederland onttrekken van goederen aan een douaneregime;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel18
  - number: 18.1.d
    text: de bevoorrading in Nederland van vervoermiddelen met goederen welke niet in het vrije verkeer zijn.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel18
  - number: '18.2'
    text: 'Voor de toepassing van dit artikel wordt verstaan onder douaneregime:'
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel18
  - number: 18.2.a
    text: tijdelijke opslag als bedoeld in artikel 50 van het Communautair douanewetboek;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel18
  - number: 18.2.b
    text: de douanebestemmingen, bedoeld in artikel 4, onderdeel 15, onder b, c en d, van het Communautair douanewetboek;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel18
  - number: 18.2.c
    text: |-
      de douaneregelingen, bedoeld in artikel 4, onderdeel 16, onder b, c, d, e en, voor zover het betreft een volledige
      vrijstelling van rechten bij invoer, f, van het Communautair douanewetboek.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel18
  - number: '18.3'
    text: |-
      Als invoer wordt niet aangemerkt het in Nederland brengen van goederen als bedoeld in het eerste lid, onderdelen
      a en b, waarop een douaneregime van toepassing is dan wel waarop aansluitend aan het in Nederland brengen een
      douaneregime van toepassing wordt. Evenmin wordt als invoer aangemerkt het in Nederland beëindigen van een
      douaneregime voor zover dit regime wordt opgevolgd door een douaneregime.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel18
  - number: '18.4'
    text: |-
      Als invoer wordt voorts niet aangemerkt het in Nederland beëindigen van, dan wel het in Nederland onttrekken van
      goederen aan de douaneregeling intern communautair douanevervoer als bedoeld in de artikelen 163 tot en met 165 van
      het Communautair douanewetboek, indien het vervoer aanvangt en eindigt in de Gemeenschap.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel18
  - number: '18.5'
    text: Bij ministeriële regeling kunnen regels worden gesteld inzake de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel18
  - number: '19.1'
    text: De belasting wordt berekend over de douanewaarde.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel19
  - number: '19.2'
    text: 'In de douanewaarde zijn begrepen:'
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel19
  - number: 19.2.a
    text: |-
      de rechten bij invoer, belastingen en heffingen, met uitzondering van de ter zake van de invoer in Nederland
      verschuldigde omzetbelasting;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel19
  - number: 19.2.b
    text: de bijkomende kosten, zoals kosten van commissie, verpakking, vervoer en verzekering tot de plaats van bestemming.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel19
  - number: '20.1'
    text: De belasting bedraagt 19 percent.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel20
  - number: '20.2'
    text: 'In afwijking van het eerste lid bedraagt de belasting:'
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel20
  - number: 20.2.a
    text: 6 percent voor de invoer van goederen, genoemd in de bij deze wet behorende tabel I, onderdeel *a*;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel20
  - number: 20.2.b
    text: |-
      nihil voor de invoer van goederen, genoemd in de bij deze wet behorende tabel II, onderdeel *a*, posten 3, 4 en 5,
      mits is voldaan aan bij algemene maatregel van bestuur vast te stellen voorwaarden;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel20
  - number: 20.2.c
    text: |-
      nihil voor de invoer van gas via het aardgasdistributiesysteem en de invoer van elektriciteit, mits de
      toepasselijkheid van dat tarief uit boeken en bescheiden blijkt.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel20
  - number: '21'
    text: |-
      Bij ministeriële regeling wordt, onder daarbij te stellen voorwaarden en beperkingen, vrijstelling van belasting
      verleend voor:
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel21
  - number: 21.a
    text: de invoer van goederen waarvoor aanspraak op vrijstelling van douanerechten bestaat;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel21
  - number: 21.b
    text: |-
      de invoer van goederen in de zin van [artikel 18, eerste lid, onderdeel b][ref1], indien aanspraak op
      vrijstelling van rechten bij invoer zou bestaan indien de goederen zouden zijn ingevoerd in de zin van
      [artikel 18, eerste lid, onderdeel a][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel18
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '18'
        hoofdstuk: III
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '18'
        hoofdstuk: III
        afdeling: '1'
  - number: 21.c
    text: de invoer van goederen waarvan de levering in Nederland in elk geval is vrijgesteld;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel21
  - number: 21.d
    text: |-
      de invoer van goederen die worden verzonden of vervoerd naar een andere lid-staat wanneer degene die de goederen
      heeft ingevoerd deze levert met toepassing van de bij deze wet behorende tabel II, onderdeel a, post 6.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel21
  - number: 21a
    text: |-
      Voor de toepassing van [artikel 21b][ref1] wordt verstaan onder:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel21b
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 21b
        hoofdstuk: III
        afdeling: '3'
  - number: 21a.a
    text: |-
      persoonlijke bagage van reizigers: bagage die de reiziger kan aangeven bij de douaneautoriteiten, alsmede de
      bagage die hij later aangeeft, mits hij aannemelijk kan maken dat deze bij zijn vertrek als begeleide bagage is
      ingeschreven bij de maatschappij die zijn vervoer heeft verzorgd, met dien verstande dat brandstof, andere dan die
      zich in het normale reservoir van een voertuig bevindt of andere dan een maximale hoeveelheid van tien liter per
      voertuig in een draagbaar reservoir, geen persoonlijke bagage is;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel21a
  - number: 21a.b
    text: |-
      invoer die geen handelskarakter heeft: invoer die een incidenteel karakter heeft, waaraan blijkens de aard of de
      hoeveelheid van de goederen geen commerciële overwegingen ten grondslag liggen en die uitsluitend betrekking heeft
      op goederen, bestemd voor persoonlijk gebruik van de reizigers dan wel voor het gebruik door hun gezinsleden of
      bestemd om als geschenk te worden aangeboden;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel21a
  - number: 21a.c
    text: 'cigarillo’s: sigaren die per stuk niet meer wegen dan drie gram;'
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel21a
  - number: 21a.d
    text: |-
      particuliere plezierluchtvaart of plezierzeevaart: het gebruik van een luchtvaartuig of een zeewaardig vaartuig
      door de eigenaar daarvan of door de natuurlijke persoon of rechtspersoon die het gebruiksrecht daarvan geniet
      door huur of anderszins, voor andere dan commerciële doeleinden en met name voor andere doeleinden dan voor het
      vervoer van personen of goederen of voor het verrichten van diensten onder bezwarende titel, dan wel ten behoeve
      van overheidsinstanties.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel21a
  - number: 21b.1
    text: |-
      Voor de invoer van goederen wordt vrijstelling verleend indien deze invoer geen handelskarakter heeft en deze
      goederen deel uitmaken van de persoonlijke bagage van reizigers komende uit derde-landen. De vrijstelling wordt
      verleend voor:
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel21b
  - number: 21b.1.a
    text: |-
      goederen, niet zijnde goederen bedoeld in de onderdelen b tot en met e, waarvan de totale waarde niet meer dan
      € 430 per reiziger bedraagt. Voor de toepassing van dit onderdeel wordt de waarde van een afzonderlijk goed niet
      gesplitst;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel21b
  - number: 21b.1.b
    text: |-
      de volgende tabaksproducten per reiziger tot een maximum van: - 200 sigaretten;
        - 100 cigarillo’s;
        - 50 sigaren;
        - 250 gram rooktabak; of
        - een proportioneel assortiment van deze producten;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel21b
  - number: 21b.1.c
    text: |-
      alcohol en alcoholhoudende dranken, niet zijnde niet-mousserende wijnen en bier, per reiziger tot een maximum van:
        - 1 liter alcohol en alcoholhoudende dranken met een alcoholgehalte van meer dan 22% vol. of niet gedenatureerde
      ethylalcohol van 80% vol. en hoger;
        - 2 liter alcohol en alcoholhoudende dranken met een alcoholgehalte van maximaal 22% vol.; of een proportioneel
      assortiment van deze producten;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel21b
  - number: 21b.1.d
    text: een maximale hoeveelheid van 4 liter niet-mousserende wijn en 16 liter bier per reiziger;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel21b
  - number: 21b.1.e
    text: |-
      brandstof die zich in het normale reservoir van een voertuig bevindt, alsmede per voertuig een maximale hoeveelheid
      van tien liter brandstof in een draagbaar reservoir.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel21b
  - number: 21b.2
    text: |-
      Het maximumbedrag, bedoeld in het eerste lid, onderdeel a, wordt voor reizigers in de particuliere
      plezierluchtvaart of plezierzeevaart beperkt tot € 300.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel21b
  - number: 21b.3
    text: |-
      De vrijstelling, bedoeld in het eerste lid, onderdelen b, c en d, geldt niet voor reizigers jonger dan zeventien
      jaar.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel21b
  - number: 21b.4
    text: |-
      De maximale hoeveelheden, bedoeld in het eerste lid, onderdelen b, c en d, worden voor personeel van
      vervoermiddelen die worden gebruikt in het verkeer tussen de Gemeenschap en derde-landen beperkt tot de volgende
      hoeveelheden:
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel21b
  - number: 21b.4.a
    text: |-
      voor de toepassing van het eerste lid, onderdeel b: - 40 sigaretten;
        - 20 cigarillo’s;
        - 10 sigaren;
        - 50 gram rooktabak;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel21b
  - number: 21b.4.b
    text: |-
      voor de toepassing van het eerste lid, onderdeel c: - 1 liter alcohol en alcoholhoudende dranken met een
      alcoholgehalte van meer dan 22% vol. of niet gedenatureerde ethylalcohol van 80% vol. en hoger;
        - 1 liter alcohol en alcoholhoudende dranken met een alcoholgehalte van maximaal 22% vol.;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel21b
  - number: 21b.4.c
    text: 'voor de toepassing van het eerste lid, onderdeel d: 2 liter niet-mousserende wijn en 8 liter bier.'
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel21b
  - number: '22.1'
    text: |-
      Ter zake van de belasting bij invoer zijn de wettelijke bepalingen, bedoeld in
      [artikel 1:1, eerste en tweede lid, van de Algemene douanewet][ref1], met uitzondering van het bepaalde in artikel
      868 van de toepassingsverordening Communautair douanewetboek, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
  - number: '22.2'
    text: |-
      Bij ministeriële regeling kan, onder daarbij te stellen voorwaarden en beperkingen, kwijtschelding of teruggaaf
      van bij invoer verschuldigde belasting worden verleend in de gevallen waarin aanspraak op kwijtschelding of
      terugbetaling van rechten bij invoer bestaat of zou bestaan indien de goederen in het douanegebied van de
      Gemeenschap, bedoeld in artikel 3 van het Communautair douanewetboek zouden zijn ingevoerd of, in andere gevallen,
      om redenen van billijkheid.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel22
  - number: '22.3'
    text: |-
      Belasting waarvan krachtens het tweede lid kwijtschelding of teruggaaf wordt verleend, komt niet voor aftrek op
      de voet van [artikel 15][ref1] in aanmerking. Heeft de aftrek reeds plaatsgevonden, dan wordt de ondernemer die de
      aftrek heeft genoten het in aftrek gebrachte bedrag als belasting verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '15'
        hoofdstuk: II
        afdeling: '4'
  - number: 22a.1
    text: |-
      Op goederen als bedoeld in [artikel 18, eerste lid, onderdeel b][ref1] , die Nederland binnenkomen uit een
      derde-land dat deel uitmaakt van het douanegebied van de Gemeenschap, bedoeld in artikel 3 van het Communautair
      douanewetboek zijn de volgende bepalingen van toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel18
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '18'
        hoofdstuk: III
        afdeling: '1'
  - number: 22a.1.a
    text: |-
      de formaliteiten betreffende het in Nederland brengen zijn dezelfde als zijn voorzien in de wettelijke bepalingen,
      bedoeld in [artikel 1:1, eerste en tweede lid, van de Algemene douanewet][ref1], ten aanzien van goederen die in
      het vrije verkeer worden gebracht in de zin van die wettelijke bepalingen;


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
  - number: 22a.1.b
    text: |-
      indien de plaats van aankomst van de verzending of het vervoer van de goederen zich buiten de lid-staat van
      binnenkomen in de Gemeenschap bevindt, zijn de goederen binnen de Gemeenschap in het verkeer onder de regeling
      voor intern communautair douanevervoer als bedoeld in [artikel 18, vierde lid][ref1], indien de goederen bij het
      binnenkomen in de Gemeenschap onder die regeling zijn gebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel18
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '18'
        hoofdstuk: III
        afdeling: '1'
  - number: 22a.1.c
    text: |-
      indien op de goederen op het tijdstip van binnenkomen in de Gemeenschap een van de douaneregimes als bedoeld
      in [artikel 18, tweede lid][ref1], zou kunnen worden toegepast indien zij zouden zijn ingevoerd in de zin van
      [artikel 18, eerste lid, onderdeel a][ref2], kan dit douaneregime ook op deze goederen worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel18
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '18'
        hoofdstuk: III
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '18'
        hoofdstuk: III
        afdeling: '1'
  - number: 22a.2
    text: |-
      Op goederen, andere dan bedoeld in [artikel 18, eerste lid, onderdeel a][ref1] , die worden verzonden of vervoerd
      uit de Gemeenschap naar een derde-land dat deel uitmaakt van het douanegebied van de Gemeenschap als bedoeld in het
      eerste lid, aanhef, zijn de volgende bepalingen van toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel18
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '18'
        hoofdstuk: III
        afdeling: '1'
  - number: 22a.2.a
    text: |-
      de formaliteiten betreffende de verzending of het vervoer naar een derde-land zijn dezelfde als zijn voorzien in de
      wettelijke bepalingen, bedoeld in [artikel 1:1, eerste en tweede lid, van de Algemene douanewet][ref1], ten aanzien
      van goederen die worden uitgevoerd in de zin van die wettelijke bepalingen;


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
  - number: 22a.2.b
    text: |-
      op goederen die tijdelijk zijn uitgevoerd uit de Gemeenschap met het oog op hun wederinvoer zijn de wettelijke
      bepalingen, bedoeld in [artikel 1:1, eerste en tweede lid, van de Algemene douanewet][ref1], ter zake van de
      uitvoer van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
  - number: '23.1'
    text: |-
      In afwijking van [artikel 22][ref1] wordt de belasting ter zake van de invoer van goederen, bestemd voor aangewezen
      ondernemers en lichamen in de zin van de [Algemene wet inzake rijksbelastingen][ref2], andere dan ondernemers,
      geheven van die ondernemers en lichamen. Bij ministeriële regeling worden onder daarbij te stellen voorwaarden
      regels gesteld omtrent de aanwijzing. Daarbij kan worden bepaald dat op verzoek een aanwijzing kan geschieden door
      de inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '22'
        hoofdstuk: III
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0002320
  - number: '23.2'
    text: De belasting wordt verschuldigd op het tijdstip waarop de goederen worden ingevoerd.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel23
  - number: '23.3'
    text: De in een tijdvak verschuldigd geworden belasting moet op aangifte worden voldaan.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel23
  - number: '24.1'
    text: |-
      Aan lichamen in de zin van de [Algemene wet inzake rijksbelastingen][ref1], andere dan ondernemers, die goederen
      in ongebruikte staat uitvoeren uit de Gemeenschap of brengen onder het stelsel van douane-entrepots op basis van
      artikel 98, lid 1, onder *b*, van het Communautair douanewetboek in het kader van hun menslievende, liefdadige of
      opvoedkundige werk buiten de Gemeenschap, wordt op verzoek teruggaaf verleend van de voor die goederen betaalde
      belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: '24.2'
    text: |-
      Ten behoeve van natuurlijke personen die, anders dan als ondernemer, goederen uitvoeren uit de Gemeenschap, kan op
      bij ministeriële regeling te bepalen wijze en onder daarbij te stellen voorwaarden en beperkingen ontheffing worden
      verleend van de belasting die is verschuldigd ter zake van de levering van die goederen.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel24
  - number: '25.1'
    text: |-
      Indien een ondernemer een natuurlijk persoon is die in Nederland woont of is gevestigd dan wel aldaar een
      vaste inrichting heeft en de door hem in een kalenderjaar verschuldigde belasting na toepassing van de in
      [artikel 15][ref1] bedoelde aftrek niet hoger is dan € 1883, wordt het bedrag van de belasting verminderd met een
      bedrag, gelijk aan 2,5 maal het verschil tussen € 1883 en het bedrag van die belasting. De vermindering bedraagt
      ten hoogste het bedrag van de belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '15'
        hoofdstuk: II
        afdeling: '4'
  - number: '25.2'
    text: |-
      Bij ministeriële regeling worden regels gesteld inzake de toerekening van de in het eerste lid bedoelde
      vermindering aan de tijdvakken in het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel25
  - number: '25.3'
    text: |-
      Bij ministeriële regeling worden regels gesteld volgens welke een ondernemer die op grond van het eerste lid geen
      belasting behoeft te voldoen, op zijn verzoek kan worden ontheven van verplichtingen, opgelegd bij of krachtens
      de [artikelen 34][ref1] en [35][ref2]. De ondernemer mag alsdan op een factuur op generlei wijze melding maken van
      omzetbelasting; teruggaaf op de voet van [artikel 17][ref3] wordt aan hem niet verleend. De ontheffing geldt niet
      met betrekking tot intracommunautaire verwervingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel17
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '34'
        hoofdstuk: VI
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '35'
        hoofdstuk: VI
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0002629
        artikel: '17'
        hoofdstuk: II
        afdeling: '4'
  - number: '25.4'
    text: |-
      De in het eerste lid bedoelde vermindering wordt niet toegepast, indien de ondernemer in het desbetreffende
      kalenderjaar niet voldoet aan hetgeen bij of krachtens [artikel 34][ref1], [artikel 35][ref2] of het derde lid
      is voorgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel35
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '34'
        hoofdstuk: VI
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '35'
        hoofdstuk: VI
        afdeling: '4'
  - number: '25.5'
    text: |-
      De vorige leden zijn niet van toepassing op leveringen van nieuwe vervoermiddelen met toepassing van de bij deze
      wet behorende tabel II, onderdeel *a*, post 6.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel25
  - number: '25.6'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld inzake de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel25
  - number: '26'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld volgens welke daarbij aangewezen ondernemers die niet aan
      ondernemers plegen te leveren of diensten plegen te bewijzen, de belasting ter zake van leveringen en diensten
      worden verschuldigd op het tijdstip waarop de vergoeding wordt voldaan; alsdan wordt de belasting berekend over de
      voldane vergoeding.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel26
  - number: '27.1'
    text: |-
      Landbouwers, veehouders, tuinbouwers en bosbouwers zijn geen omzetbelasting verschuldigd, voor zover hun prestaties
      bestaan uit:
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel27
  - number: 27.1.a
    text: |-
      leveringen van goederen, vermeld in tabel I, onderdeel *a*, welke zij in hun vermelde hoedanigheid hebben
      voortgebracht of geteeld;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel27
  - number: 27.1.b
    text: |-
      diensten welke naar hun aard bijdragen tot de agrarische produktie en welke zij met gebruikmaking van hun normale
      uitrusting en personeel verrichten;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel27
  - number: 27.1.c
    text: leveringen van gebruikte bedrijfsmiddelen en andere in het bedrijf gebruikte goederen.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel27
  - number: '27.2'
    text: |-
      De in het eerste lid bedoelde ondernemers zijn met betrekking tot de aldaar bedoelde prestaties ontheven van de
      verplichtingen, opgelegd bij of krachtens de [artikelen 34][ref1] en [35][ref2]. Zij hebben met betrekking tot die
      prestaties geen aanspraak op aftrek op de voet van [artikel 15][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '34'
        hoofdstuk: VI
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '35'
        hoofdstuk: VI
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0002629
        artikel: '15'
        hoofdstuk: II
        afdeling: '4'
  - number: '27.3'
    text: |-
      Aan de in het eerste lid bedoelde ondernemers die goederen als aldaar bedoeld in onderdeel *a* leveren met
      toepassing van [artikel 5][ref1], wordt op verzoek teruggaaf van belasting verleend, ingeval de levering leidt tot
      verschuldigdheid van belasting in de lid-staat van aankomst van het vervoer. De teruggaaf bedraagt 5,1 percent van
      het door de ondernemer in rekening gebrachte bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel5a
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 5a
        hoofdstuk: II
        afdeling: 1a
  - number: '27.4'
    text: |-
      Ondernemers aan wie de in het eerste lid bedoelde ondernemers goederen als aldaar zijn bedoeld in onderdeel *a*,
      leveren, of diensten als aldaar zijn bedoeld in onderdeel *b*, verlenen, kunnen 5,1 percent van het aan hen in
      rekening gebrachte bedrag op de voet van [artikel 15][ref1] in aftrek brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '15'
        hoofdstuk: II
        afdeling: '4'
  - number: '27.5'
    text: |-
      Aan de in [artikel 1][ref1], bedoelde ondernemers en rechtspersonen, andere dan ondernemers, die zijn gevestigd in
      een andere lid-staat, aan wie de in het eerste lid bedoelde ondernemers goederen als aldaar bedoeld in onderdeel
      *a* leveren, wordt op verzoek teruggaaf van belasting verleend, voor zover deze goederen in die andere lid-
      staat zijn onderworpen aan heffing van belasting ter zake van intracommunautaire verwerving van die goederen. De
      teruggaaf bedraagt 5,1 percent van het door de leverancier in rekening gebrachte bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel1a
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 1a
        hoofdstuk: I
  - number: '27.6'
    text: |-
      De in het eerste lid bedoelde ondernemers kunnen aan de inspecteur verzoeken om het eerste en het tweede lid
      op hen niet van toepassing te doen zijn. Bij inwilliging van het verzoek geldt zulks tot wederopzegging door
      belanghebbende doch ten minste voor vijf jaren; alsdan zijn ook het derde, vierde en vijfde lid niet van
      toepassing. Een hernieuwd verzoek kan eerst vijf jaren na die wederopzegging worden ingewilligd. De inspecteur
      beslist op het verzoek bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel27
  - number: '27.7'
    text: |-
      [Artikel 25][ref1] is niet van toepassing op landbouwers, veehouders, tuinbouwers en bosbouwers, die prestaties
      verrichten als zijn bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel25
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '25'
        hoofdstuk: V
        afdeling: '1'
  - number: '27.8'
    text: |-
      De voorgaande leden blijven buiten toepassing ten aanzien van veehouders, voor zover hun bedrijfsuitoefening niet
      samenhangt met de exploitatie van de bodem.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel27
  - number: '27.9'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld inzake de toepassing van [dit artikel][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel27
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '27'
        hoofdstuk: V
        afdeling: '3'
  - number: '28'
    text: |-
      De heffing van de belasting ter zake van de levering, de intracommunautaire verwerving en
      de invoer van tabaksprodukten als bedoeld in [artikel 29 van de Wet op de accijns][ref1]
      alsmede van pruimtabak en snuiftabak als bedoeld in de [artikelen 11][ref2] en
      [12 van de Wet op de verbruiksbelastingen van alcoholvrije dranken en van enkele andere produkten][ref3]
      geschiedt met overeenkomstige toepassing van de voor die accijns of die verbruiksbelasting geldende regelen,
      met dien verstande dat het tarief 19/119 deel bedraagt van de voor de berekening van de accijns of van die
      verbruiksbelasting in aanmerking komende kleinhandelsprijs. Die belasting komt niet voor aftrek als is bedoeld in
      [artikel 15][ref4] in aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0005802#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0005802#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0005802
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0005802
        artikel: '12'
      - id: ref4
        bwb_id: BWBR0002629
        artikel: '15'
        hoofdstuk: II
        afdeling: '4'
  - number: 28a
    text: |-
      De heffing van omzetbelasting ter zake van de intracommunautaire verwerving van accijnsgoederen, andere dan
      tabaksprodukten, geschiedt met overeenkomstige toepassing van de voor de accijns geldende regels, indien de
      verwerving wordt verricht door ondernemers of rechtspersonen, andere dan ondernemers, waarvoor [artikel 1][ref1],
      toepassing vindt ter zake van intracommunautaire verwervingen van goederen, andere dan nieuwe vervoermiddelen en
      accijnsgoederen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel1a
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 1a
        hoofdstuk: I
  - number: 28b.1
    text: |-
      Ingeval een wederverkoper gebruikte goederen, kunstvoorwerpen, voorwerpen voor verzamelingen of antiquiteiten
      levert, wordt, in afwijking van [artikel 8, eerste lid][ref1], de belasting berekend over de winstmarge. De
      winstmarge is het verschil tussen de vergoeding en hetgeen ter zake van de levering van een dergelijk goed aan de
      wederverkoper door hem is of moet worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel8
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
  - number: 28b.2
    text: 'Het eerste lid is slechts van toepassing indien het goed aan de wederverkoper is geleverd door:'
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel28b
  - number: 28b.2.a
    text: een ander dan een ondernemer;
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel28b
  - number: 28b.2.b
    text: |-
      een ondernemer, met toepassing van [artikel 11, eerste lid, onderdeel r][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel11
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '11'
        hoofdstuk: II
        afdeling: '3'
  - number: 28b.2.c
    text: |-
      een ondernemer die ingevolge [artikel 25, derde lid][ref1], is ontheven van de verplichtingen, opgelegd bij of
      krachtens de [artikelen 34][ref2] en [35][ref3], mits het een in zijn bedrijf gebruikt bedrijfsmiddel betreft;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel35
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '25'
        hoofdstuk: V
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '34'
        hoofdstuk: VI
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0002629
        artikel: '35'
        hoofdstuk: VI
        afdeling: '4'
  - number: 28b.2.d
    text: een andere wederverkoper, met toepassing van het eerste lid; of
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel28b
  - number: 28b.2.e
    text: |-
      een ondernemer of een wederverkoper uit een andere lid-staat, mits het een levering is als bedoeld in artikel 314,
      onder b, c of d, van de BTW-richtlijn 2006.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel28b
  - number: 28c.1
    text: |-
      Op verzoek van de wederverkoper is [artikel 28][ref1], van overeenkomstige toepassing op de leveringen van:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28b
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel28c
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28b
        hoofdstuk: V
        afdeling: '5'
  - number: 28c.1.a
    text: |-
      kunstvoorwerpen die hem zijn geleverd met toepassing van onderdeel *a*, post 29, onderdeel *b*, van de bij deze wet
      behorende tabel I; en
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel28c
  - number: 28c.1.b
    text: |-
      kunstvoorwerpen, voorwerpen voor verzamelingen en antiquiteiten die hij zelf heeft ingevoerd, met dien verstande
      dat alsdan de winstmarge het verschil is tussen de vergoeding en de douanewaarde vermeerderd met de ter zake van de
      invoer in Nederland verschuldigde omzetbelasting.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel28c
  - number: 28c.2
    text: |-
      De inspecteur beslist op het verzoek bij voor bezwaar vatbare beschikking. Bij inwilliging van het verzoek geldt
      zulks tot wederopzegging door belanghebbende doch ten minste voor twee kalenderjaren. Een hernieuwd verzoek kan
      eerst twee jaren na die wederopzegging worden ingewilligd.
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel28c
  - number: 28d
    text: |-
      In bij ministeriële regeling aan te wijzen gevallen wordt, in afwijking in zoverre van de [artikelen 28b][ref1] en
      [28c][ref2], ter zake van leveringen van goederen waarop een zelfde tarief wordt toegepast, de belasting berekend
      over de winstmarge per tijdvak van aangifte. Deze winstmarge is het verschil tussen de som van de vergoedingen ter
      zake van die leveringen in dat tijdvak en de som van hetgeen in dat tijdvak door de wederverkoper is of moet worden
      voldaan ter zake van in [artikel 28b, tweede lid][ref3], en [28c, eerste lid][ref4], bedoelde leveringen of invoer
      van dergelijke goederen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28b
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel28c
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel28b
      [ref4]: https://wetten.overheid.nl/BWBR0002629#Artikel28c
    url: https://wetten.overheid.nl/BWBR0002629/2010-01-01#Artikel28d
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28b
        hoofdstuk: V
        afdeling: '5'
      - id: ref2
