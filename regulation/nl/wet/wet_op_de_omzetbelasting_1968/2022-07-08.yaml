preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de richtlijnen van de Raad van de Europese Economische Gemeenschap
    betreffende de harmonisatie van de wetgevingen van de Lid-Staten inzake omzetbelasting (Publikatieblad van de
    Europese Gemeenschappen van 14 april 1967) aanleiding zijn de bestaande omzetbelasting volgens het cumulatieve
    cascadestelsel te vervangen door een omzetbelasting volgens het stelsel van heffing over de toegevoegde waarde;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#ArtikelAanhef
articles:
  - number: '1'
    text: 'Onder de naam ''omzetbelasting'' wordt een belasting geheven ter zake van:'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel1
  - number: 1.a
    text: |-
      leveringen van goederen en diensten, welke in Nederland door een als zodanig handelende ondernemer onder bezwarende
      titel worden verricht;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel1
  - number: 1.b
    text: |-
      intracommunautaire verwervingen van goederen onder bezwarende titel in Nederland door een als zodanig handelende
      ondernemer en door rechtspersonen, andere dan ondernemers;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel1
  - number: 1.c
    text: |-
      intracommunautaire verwervingen onder bezwarende titel, anders dan in de zin van onderdeel *b*, van nieuwe
      vervoermiddelen in Nederland;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel1
  - number: 1.d
    text: invoer van goederen.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel1
  - number: 1a.1
    text: |-
      [Artikel 1, aanhef en onderdeel b][ref1], is niet van toepassing wanneer het verworven goed:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel1
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '1'
        hoofdstuk: I
  - number: 1a.1.a
    text: |-
      is geleverd door een ondernemer op wie de in de artikelen 282 tot en met 292 van de BTW-richtlijn 2006 bedoelde
      vrijstellingsregeling van toepassing is;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel1a
  - number: 1a.1.b
    text: |-
      is geleverd in de zin van [artikel 3, eerste lid, onderdeel f][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel3
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '3'
        hoofdstuk: II
        afdeling: '1'
  - number: 1a.1.c
    text: |-
      is geleverd met toepassing van [artikel 5a, eerste lid][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel5a
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 5a
        hoofdstuk: II
        afdeling: 1a
  - number: 1a.1.d
    text: |-
      is geleverd met toepassing van een van de in de artikelen 312 tot en met 325 en 333 tot en met 340 van de BTW-
      richtlijn 2006 bedoelde bijzondere regelingen.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel1a
  - number: 1a.2
    text: |-
      [Artikel 1, aanhef en onderdeel b][ref1], is voorts niet van toepassing op intracommunautaire verwervingen van
      goederen, andere dan nieuwe vervoermiddelen en accijnsgoederen, door:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel1
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '1'
        hoofdstuk: I
  - number: 1a.2.a
    text: |-
      ondernemers die uitsluitend leveringen van goederen of diensten verrichten waarvoor geen recht op aftrek van
      belasting bestaat; en
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel1a
  - number: 1a.2.b
    text: rechtspersonen, andere dan ondernemers;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel1a
  - number: 1a.3
    text: |-
      De in het tweede lid bedoelde ondernemers en rechtspersonen kunnen aan de inspecteur verzoeken om dat lid
      op hen niet van toepassing te doen zijn. Bij inwilliging van het verzoek geldt zulks tot wederopzegging door
      belanghebbende doch ten minste voor twee kalenderjaren. De inspecteur beslist op het verzoek bij voor bezwaar
      vatbare beschikking. Bij ministeriële regeling kunnen regels worden gesteld inzake de toepassing van dit lid.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel1a
  - number: '2'
    text: |-
      Op de belasting, verschuldigd ter zake van leveringen van goederen en diensten, wordt in aftrek gebracht de
      belasting ter zake van de aan de ondernemer verrichte leveringen van goederen en verleende diensten, ter zake van
      de door hem verrichte intracommunautaire verwervingen van goederen en ter zake van invoer van voor hem bestemde
      goederen.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel2
  - number: 2a.1
    text: 'In deze wet en in de daarop gebaseerde bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel2a
  - number: 2a.1.a
    text: |-
      BTW-richtlijn 2006: Richtlijn 2006/112/EG van de Raad van 28 november 2006 betreffende het gemeenschappelijke
      stelsel van belasting over de toegevoegde waarde (PbEU 2006, L 347);
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel2a
  - number: 2a.1.b
    text: 'lidstaat: een lidstaat van de Europese Unie;'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel2a
  - number: 2a.1.c
    text: |-
      Unie: het geheel van de grondgebieden van de lidstaten zoals die gebieden zijn omschreven in artikel 5, onder 2,
      van de BTW-richtlijn 2006, met dien verstande dat ook het Vorstendom Monaco en het eiland Man worden behandeld als
      gebied van de Franse Republiek respectievelijk het Verenigd Koninkrijk van Groot-Brittannië en Noord-Ierland en dat
      ook de zones Akrotiri en Dhekelia van Cyprus, die onder de soevereiniteit van het Verenigd Koninkrijk van Groot-
      Brittannië en Noord-Ierland vallen, worden behandeld als gebied van de Republiek Cyprus;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel2a
  - number: 2a.1.d.1°
    text: |-
      *derde-land:* elke staat of elk grondgebied waarop het Verdrag betreffende de werking van de Europese Unie niet van
      toepassing is met uitzondering van het land en de gebieden, genoemd in onderdeel c;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel2a
  - number: 2a.1.d.2°
    text: '*derdelandsgebieden:* de gebieden, genoemd in artikel 6 van BTW-richtlijn 2006.'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel2a
  - number: 2a.1.e
    text: |-
      accijnsgoederen: bier, wijn, tussenprodukten, overige alcoholhoudende produkten, minerale oliën
      en tabaksprodukten als bedoeld in [artikel 1 van de Wet op de accijns][ref1], kolen als bedoeld in
      [artikel 32, onderdeel a, van de Wet belastingen op milieugrondslag][ref2], alsmede aardgas als bedoeld in
      [artikel 47, eerste lid, onderdeel m, van de Wet belastingen op milieugrondslag][ref3] in verbinding met
      [artikel 48, tweede lid, van die wet][ref4], maar met uitzondering van gas dat wordt geleverd via een op het
      grondgebied van de Unie gesitueerd aardgassysteem of een op een dergelijk systeem aangesloten net;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0007168#Artikel47
      [ref4]: https://wetten.overheid.nl/BWBR0007168#Artikel48
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007168
        artikel: '32'
      - id: ref3
        bwb_id: BWBR0007168
        artikel: '47'
      - id: ref4
        bwb_id: BWBR0007168
        artikel: '48'
  - number: 2a.1.f
    text: |-
      nieuwe vervoermiddelen: voor het personen- of goederenvervoer bestemde schepen met een lengte van meer dan 7,5
      m, luchtvaartuigen met een totaal opstijggewicht van meer dan 1550 kg en landvoertuigen die zijn uitgerust met
      een motor van meer dan 48 cc cilinderinhoud of met een vermogen van meer dan 7,2 kW, met uitzondering van schepen
      en luchtvaartuigen als bedoeld in de bij deze wet behorende [tabel II][ref1], onderdeel a, post 3, onder a,
      onderscheidenlijk e, wanneer op het tijdstip van de levering:


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: 2a.1.f.1°
    text: |-
      na het tijdstip van eerste ingebruikneming van het landvoertuig niet meer dan zes maanden, dan wel van het schip of
      luchtvaartuig niet meer dan drie maanden, zijn verstreken; of
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel2a
  - number: 2a.1.f.2°
    text: |-
      het vervoermiddel, als het een landvoertuig betreft ten hoogste 6000 km heeft afgelegd, als het een schip betreft
      ten hoogste 100 uren heeft gevaren, dan wel als het een luchtvaartuig betreft ten hoogste 40 uren heeft gevlogen;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel2a
  - number: 2a.1.g
    text: |-
      btw-identificatienummer: het nummer dat ingevolge artikel 214 van de BTW-richtlijn 2006 door een lidstaat aan een
      ondernemer of aan een rechtspersoon, andere dan ondernemer, is toegekend;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel2a
  - number: 2a.1.h
    text: |-
      intracommunautair goederenvervoer: het vervoer van goederen waarvan de plaats van vertrek en de plaats van aankomst
      op het grondgebied van twee verschillende lidstaten zijn gelegen;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel2a
  - number: 2a.1.i
    text: |-
      plaats van vertrek: de plaats waar het goederenvervoer daadwerkelijk aanvangt, zonder rekening te houden met de
      trajecten die worden afgelegd om zich naar de plaats te begeven waar de goederen zich bevinden;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel2a
  - number: 2a.1.j
    text: 'plaats van aankomst: de plaats waar het goederenvervoer daadwerkelijk eindigt;'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel2a
  - number: 2a.1.k
    text: |-
      wederverkoper: de ondernemer wiens activiteiten geheel of ten dele bestaan uit de wederverkoop van gebruikte
      goederen, kunstvoorwerpen, voorwerpen voor verzamelingen of antiquiteiten;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel2a
  - number: 2a.1.l
    text: |-
      gebruikte goederen: alle roerende lichamelijke zaken die, in de staat waarin zij verkeren of na herstelling
      daarvan, opnieuw kunnen worden gebruikt, andere dan nieuwe vervoermiddelen die worden verzonden of vervoerd van
      een lidstaat naar een andere lidstaat, en andere dan bij ministeriële regeling aan te wijzen edele metalen en
      edelstenen;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel2a
  - number: 2a.1.m
    text: |-
      kunstvoorwerpen, voorwerpen voor verzamelingen en antiquiteiten: de bij ministeriële regeling aan te wijzen
      goederen;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel2a
  - number: 2a.1.n
    text: |-
      gedeelte van een binnen de Unie verricht passagiersvervoer: het gedeelte van een vervoer dat, zonder tussenstop
      buiten de Unie, plaatsvindt tussen de plaats van vertrek en de plaats van aankomst van het vervoer van passagiers;
      in geval het een heen- en terugreis betreft, wordt de terugreis als een afzonderlijk vervoer beschouwd;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel2a
  - number: 2a.1.o
    text: |-
      plaats van vertrek van een vervoer van passagiers: het eerste punt in de Unie waar passagiers aan boord kunnen
      komen, eventueel na een tussenstop buiten de Unie;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel2a
  - number: 2a.1.p
    text: |-
      plaats van aankomst van een vervoer van passagiers: het laatste punt in de Unie waar passagiers die binnen de Unie
      aan boord zijn gekomen van boord kunnen gaan, eventueel vóór een tussenstop buiten de Unie;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel2a
  - number: 2a.1.q
    text: |-
      elektronische diensten: langs elektronische weg verrichte diensten, met name de in bijlage II van de BTW-richtlijn
      2006 beschreven diensten;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel2a
  - number: 2a.1.r
    text: |-
      telecommunicatiediensten: diensten waarmee de transmissie, uitzending of ontvangst van signalen, geschriften,
      beelden en geluiden of informatie van allerlei aard per draad, via radiofrequente straling, langs optische weg of
      met behulp van andere elektromagnetische middelen mogelijk wordt gemaakt, met inbegrip van de daarmee samenhangende
      overdracht en verlening van rechten op het gebruik van infrastructuur voor de transmissie, uitzending of ontvangst,
      waaronder het bieden van toegang tot wereldwijde informatienetten;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel2a
  - number: 2a.1.s
    text: 'normale waarde:'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel2a
  - number: 2a.1.s.1°
    text: |-
      het volledige bedrag, de omzetbelasting niet daaronder begrepen, dat de afnemer van goederen of diensten, om de
      desbetreffende goederen of diensten op dat tijdstip te verkrijgen, in dezelfde handelsfase als waarin de goederen
      worden geleverd of de diensten worden verricht, op het tijdstip van die levering of van die verrichting en bij
      vrije mededinging daarvoor zou moeten betalen aan een zelfstandige leverancier of dienstverrichter in Nederland;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel2a
  - number: 2a.1.s.2°
    text: |-
      indien geen vergelijkbare levering of verrichting als bedoeld onder 1° voorhanden is: - met betrekking tot
      goederen: een waarde die niet lager is dan de aankoopprijs van de goederen of van soortgelijke goederen of, indien
      er geen aankoopprijs is, dan de kostprijs, berekend op het tijdstip waarop de levering wordt verricht;
        - met betrekking tot diensten: een waarde die niet lager is dan de door de ondernemer voor het verrichten van de
      dienst gemaakte uitgaven;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel2a
  - number: 2a.1.t
    text: |-
      *voucher:* een instrument ten aanzien waarvan de verplichting bestaat dat instrument als tegenprestatie of
      gedeeltelijke tegenprestatie voor goederenleveringen of diensten te aanvaarden en waarbij de te verrichten
      goederenleveringen of diensten, of de identiteit van de potentiële verrichters ervan, vermeld staan op het
      instrument zelf of in de bijbehorende documentatie, inclusief de voorwaarden voor het gebruik van het instrument;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel2a
  - number: 2a.1.u
    text: |-
      *voucher voor enkelvoudig gebruik:* een voucher waarbij de plaats van de goederenlevering of dienstverrichting
      waarop de voucher betrekking heeft, alsmede het bedrag van de over die goederen of diensten verschuldigde
      belasting, bekend zijn op het tijdstip van uitgifte van de voucher;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel2a
  - number: 2a.1.v
    text: '*voucher voor meervoudig gebruik:* alle vouchers, uitgezonderd vouchers voor enkelvoudig gebruik;'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel2a
  - number: 2a.1.w
    text: |-
      *intracommunautaire afstandsverkopen van goederen:* de leveringen van goederen die worden verzonden of vervoerd
      door of voor rekening van de leverancier, ook wanneer de leverancier indirect tussenkomt bij het vervoer of de
      verzending van de goederen, vanuit een andere lidstaat dan die van aankomst van de verzending of het vervoer van de
      goederen naar de afnemer, indien aan de volgende voorwaarden is voldaan:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel2a
  - number: 2a.1.w.1°
    text: |-
      de levering van goederen wordt verricht aan een ondernemer of aan een rechtspersoon, andere dan ondernemer, van wie
      de intracommunautaire verwervingen van goederen krachtens [artikel 1a, tweede lid][ref1], niet aan de belasting
      zijn onderworpen, of aan enige andere niet-ondernemer;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel1a
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 1a
        hoofdstuk: I
  - number: 2a.1.w.2°
    text: |-
      de geleverde goederen zijn geen nieuwe vervoermiddelen, noch goederen, geleverd na montage of installatie, door of
      voor rekening van de leverancier, met of zonder beproeven van de geïnstalleerde of gemonteerde goederen;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel2a
  - number: 2a.1.x
    text: |-
      *afstandsverkopen van uit een derdelandsgebied of een derde-land ingevoerde goederen:* de leveringen van goederen
      die worden verzonden of vervoerd door of voor rekening van de leverancier, met inbegrip van gevallen waarin de
      leverancier indirect tussenkomt bij het vervoer of de verzending van de goederen, vanuit een derdelandsgebied of
      een derde-land naar een afnemer in een lidstaat, indien aan de volgende voorwaarden is voldaan:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel2a
  - number: 2a.1.x.1°
    text: |-
      de levering van goederen wordt verricht aan een ondernemer of aan een rechtspersoon, andere dan ondernemer, van wie
      de intracommunautaire verwervingen van goederen krachtens [artikel 1a, tweede lid][ref1], niet aan de belasting
      zijn onderworpen, of aan enige andere niet-ondernemer;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel1a
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 1a
        hoofdstuk: I
  - number: 2a.1.x.2°
    text: |-
      de geleverde goederen zijn geen nieuwe vervoermiddelen, noch goederen, geleverd na montage of installatie, door of
      voor rekening van de leverancier, met of zonder beproeven van de geïnstalleerde of gemonteerde goederen.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel2a
  - number: 2a.2
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de wijze waarop moet worden aangetoond of een vervoermiddel
      als nieuw aangemerkt dient te worden.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel2a
  - number: '3.1'
    text: 'Leveringen van goederen zijn:'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3
  - number: 3.1.a
    text: de overdracht of overgang van de macht om als eigenaar over een goed te beschikken;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3
  - number: 3.1.b
    text: de afgifte van goederen ingevolge een overeenkomst van huurkoop;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3
  - number: 3.1.c
    text: |-
      de oplevering van onroerende zaken door degene die de zaken heeft vervaardigd, met uitzondering van andere
      onbebouwde terreinen dan bouwterreinen als bedoeld in [artikel 11, zesde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel11
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '11'
        hoofdstuk: II
        afdeling: '3'
  - number: 3.1.d
    text: |-
      de rechtsovergang van goederen tegen betaling van een vergoeding ingevolge een vordering door of namens de
      overheid;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3
  - number: 3.1.f
    text: |-
      de rechtsovergang van goederen welke het onderwerp uitmaken van een overeenkomst tot het aanbrengen van die
      goederen aan een ander goed.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3
  - number: '3.2'
    text: |-
      Als levering van goederen wordt mede aangemerkt de vestiging, overdracht, wijziging, afstand en opzegging van
      rechten waaraan onroerende zaken zijn onderworpen, met uitzondering van hypotheek en grondrente, tenzij de
      vergoeding, vermeerderd met de omzetbelasting, minder bedraagt dan de waarde in het economische verkeer van die
      rechten. De waarde in het economische verkeer bedraagt ten minste de kostprijs, met inbegrip van de omzetbelasting,
      van de onroerende zaak waarop het recht betrekking heeft, zoals die zou ontstaan bij de voortbrenging door een
      onafhankelijke derde op het tijdstip van de handeling.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3
  - number: '3.3'
    text: |-
      Met een levering onder bezwarende titel als bedoeld in [artikel 1, onderdeel a][ref1], worden gelijkgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel1
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '1'
        hoofdstuk: I
  - number: 3.3.a
    text: |-
      het door een ondernemer aan zijn bedrijf onttrekken van een goed dat hij voor eigen privé-doeleinden of voor privé-
      doeleinden van zijn personeel bestemt, dat hij om niet verstrekt of, meer in het algemeen, dat hij voor andere dan
      bedrijfsdoeleinden bestemt, ingeval met betrekking tot dat goed of de bestanddelen daarvan recht op volledige of
      gedeeltelijke aftrek van de belasting is ontstaan;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3
  - number: 3.3.c
    text: |-
      het onder zich hebben van goederen door een ondernemer of zijn rechthebbenden wanneer hij de uitoefening van zijn
      bedrijf beëindigt, ingeval bij de aanschaffing van die goederen of bij de bestemming ervan overeenkomstig het
      bepaalde in onderdeel b, zoals dat luidde op 31 december 2013, recht op volledige of gedeeltelijke aftrek van de
      belasting is ontstaan.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3
  - number: '3.4'
    text: |-
      Indien door meer dan één persoon overeenkomsten worden gesloten met een verplichting tot levering van een zelfde
      goed dat vervolgens door de eerste persoon rechtstreeks aan de laatste afnemer wordt afgeleverd, wordt dat goed
      geacht door ieder van die personen te zijn geleverd.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3
  - number: '3.5'
    text: |-
      Goederen welke over een veiling worden verhandeld, worden geacht aan en vervolgens door de houder van de veiling te
      zijn geleverd.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3
  - number: '3.6'
    text: |-
      Goederen welke worden geleverd door tussenkomst van een commissionair of dergelijke ondernemer die overeenkomsten
      sluit op eigen naam maar op order en voor rekening van een ander, worden geacht aan en vervolgens door die
      ondernemer te zijn geleverd.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3
  - number: '3.7'
    text: |-
      Goederen zijn alle voor menselijke beheersing vatbare stoffelijke objecten, alsmede electriciteit, gas, warmte of
      koude en dergelijke.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3
  - number: '3.8'
    text: |-
      Voor de toepassing van het derde lid, onderdeel a, worden onttrekkingen van goederen om voor bedrijfsdoeleinden te
      dienen als geschenken van geringe waarde of als monster, niet als een levering onder bezwarende titel beschouwd.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3
  - number: 3a.1
    text: |-
      Met een levering van een goed onder bezwarende titel als bedoeld in [artikel 1, onderdeel a][ref1], wordt
      gelijkgesteld de overbrenging door een ondernemer van een eigen goed van zijn bedrijf naar een andere lidstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel1
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '1'
        hoofdstuk: I
  - number: 3a.2
    text: |-
      Overbrenging van een goed naar een andere lidstaat is het verzenden of vervoeren van het goed voor
      bedrijfsdoeleinden, door of voor rekening van de ondernemer, voor zover het goed niet:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3a
  - number: 3a.2.a
    text: |-
      door de ondernemer wordt geleverd in de zin van [artikel 3, eerste lid, onderdeel f][ref1], of wordt geleverd met
      toepassing van [artikel 5a, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel5a
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '3'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 5a
        hoofdstuk: II
        afdeling: 1a
  - number: 3a.2.b
    text: |-
      door de ondernemer wordt geleverd met toepassing van [artikel 5, eerste lid, onderdeel c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel5
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '5'
        hoofdstuk: II
        afdeling: 1a
  - number: 3a.2.c
    text: |-
      door de ondernemer wordt geleverd met toepassing van [artikel 9, tweede lid, onderdeel b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel9
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '9'
        hoofdstuk: II
        afdeling: '2'
  - number: 3a.2.e
    text: |-
      wordt gebruikt ten behoeve van een aan de ondernemer verleende dienst, bestaande in deskundigenonderzoeken of
      werkzaamheden met betrekking tot dat goed, die feitelijk plaatsvinden in de lidstaat van aankomst van de verzending
      of het vervoer, mits dat goed na de deskundigenonderzoeken of werkzaamheden wordt verzonden naar de ondernemer in
      de lidstaat waarvandaan het oorspronkelijk is verzonden of vervoerd;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3a
  - number: 3a.2.f
    text: |-
      tijdelijk wordt gebruikt in de lidstaat van aankomst van de verzending of het vervoer ten behoeve van een door de
      ondernemer verrichte dienst;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3a
  - number: 3a.2.g
    text: |-
      voor een periode van ten hoogste 24 maanden wordt gebruikt in de lidstaat van aankomst van de verzending of het
      vervoer, wanneer de invoer van hetzelfde goed uit een derde-land met het oog op tijdelijk gebruik in aanmerking zou
      komen voor de regeling voor tijdelijke invoer met volledige vrijstelling van rechten bij invoer; of
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3a
  - number: 3a.2.h
    text: |-
      bestaat in gas dat via een op het grondgebied van de Unie gesitueerd aardgassysteem of een op een dergelijk systeem
      aangesloten net wordt geleverd onder de voorwaarden van [artikel 5b][ref1], in warmte of koude dat via warmte- of
      koudenetten onder die voorwaarden wordt geleverd dan wel in elektriciteit die wordt geleverd onder die voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel5b
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 5b
        hoofdstuk: II
        afdeling: 1a
  - number: 3a.3
    text: |-
      In geval ten aanzien van een goed als bedoeld in het tweede lid, aanhef, en onderdelen a tot en met h, op enig
      tijdstip niet meer wordt voldaan aan de in het van toepassing zijnde onderdeel gestelde voorwaarden, wordt het goed
      geacht op dat tijdstip te zijn overgebracht naar een andere lidstaat.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3a
  - number: 3b.1
    text: |-
      In afwijking van [artikel 3a, eerste lid][ref1], wordt de overbrenging door een ondernemer van goederen die deel
      uitmaken van zijn bedrijfsvermogen naar een andere lidstaat in het kader van de regeling inzake voorraad op afroep
      niet gelijkgesteld met een levering van goederen onder bezwarende titel.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel3a
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 3a
        hoofdstuk: II
        afdeling: '1'
  - number: 3b.2
    text: |-
      Voor de toepassing van dit artikel en de daarop berustende bepalingen wordt geacht sprake te zijn van de regeling
      inzake voorraad op afroep wanneer:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3b
  - number: 3b.2.a
    text: |-
      de goederen door een ondernemer zelf worden verzonden of vervoerd of voor zijn rekening door een derde partij
      worden verzonden of vervoerd naar een andere lidstaat om die goederen daar, in een later stadium en na aankomst,
      aan een andere ondernemer te leveren doordat die de macht krijgt overgedragen om over deze goederen als eigenaar te
      beschikken krachtens een bestaande overeenkomst tussen de beide ondernemers;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3b
  - number: 3b.2.b
    text: |-
      de ondernemer die de goederen verzendt of vervoert, zijn bedrijf niet heeft gevestigd of geen vaste inrichting
      heeft in de lidstaat waarnaar de goederen worden verzonden of vervoerd;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3b
  - number: 3b.2.c
    text: |-
      de ondernemer voor wie de te leveren goederen zijn bestemd, voor btw-doeleinden is geïdentificeerd in de lidstaat
      waarnaar de goederen worden verzonden of vervoerd, en zowel zijn identiteit als het btw-identificatienummer dat
      door die lidstaat aan hem is toegekend, bij de ondernemer, bedoeld in onderdeel b, bekend zijn op het tijdstip
      waarop de verzending of het vervoer aanvangt; en
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3b
  - number: 3b.2.d
    text: |-
      de ondernemer die de goederen verzendt of vervoert of dit voor zijn rekening door een derde laat doen, het
      vervoer van de goederen opneemt in het register, bedoeld in [artikel 34, tweede lid, onderdeel c][ref1], en,
      overeenkomstig [artikel 37a, eerste lid, onderdeel d][ref2], in de lijst de identiteit vermeldt van de ondernemer
      die de goederen afneemt, evenals het btw-identificatienummer dat aan deze is toegekend door de lidstaat waarnaar de
      goederen worden verzonden of vervoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel37a
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '34'
        hoofdstuk: VI
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 37a
        hoofdstuk: VI
        afdeling: '4'
  - number: 3b.3
    text: |-
      Wanneer aan de voorwaarden, bedoeld in het tweede lid, en de periode, genoemd in het vierde lid, is voldaan, zijn
      op het tijdstip van overdracht van de macht aan de ondernemer, bedoeld in het tweede lid, onderdeel c, om als
      eigenaar over de goederen te beschikken, de volgende regels van toepassing:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3b
  - number: 3b.3.a
    text: |-
      een levering van goederen als bedoeld in tabel II, onderdeel a, post 6, wordt geacht te zijn verricht door de
      ondernemer die de goederen zelf heeft verzonden of vervoerd of voor zijn rekening door een derde heeft laten
      verzenden of vervoeren in de lidstaat vanwaar de goederen zijn verzonden of vervoerd;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3b
  - number: 3b.3.b
    text: |-
      een intracommunautaire verwerving van goederen wordt geacht te zijn verricht door de ondernemer aan wie deze
      goederen worden geleverd in de lidstaat waarnaar de goederen werden verzonden of vervoerd.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3b
  - number: 3b.4
    text: |-
      Indien de goederen niet binnen twaalf maanden na aankomst in de lidstaat waarnaar zij zijn verzonden of
      vervoerd, zijn geleverd aan de ondernemer, bedoeld in het tweede lid, onderdeel c, of het zesde lid, en geen
      van de situaties, genoemd in het zevende lid, zich heeft voorgedaan, wordt een overbrenging als bedoeld in
      [artikel 3a][ref1] geacht te zijn verricht op de dag na het verstrijken van de periode van twaalf maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel3a
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 3a
        hoofdstuk: II
        afdeling: '1'
  - number: 3b.5
    text: |-
      In afwijking van het vierde lid wordt geen overbrenging als bedoeld in [artikel 3a][ref1] geacht te zijn verricht
      indien:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel3a
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 3a
        hoofdstuk: II
        afdeling: '1'
  - number: 3b.5.a
    text: |-
      de macht om als eigenaar te beschikken over de goederen niet is overgedragen en die goederen worden teruggezonden
      naar de lidstaat vanwaar zij zijn verzonden of vervoerd binnen de periode, genoemd in het vierde lid; en
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3b
  - number: 3b.5.b
    text: |-
      de ondernemer die de goederen heeft verzonden of vervoerd, de retour ontvangen goederen opneemt in het register,
      bedoeld in [artikel 34, tweede lid, onderdeel c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel34
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '34'
        hoofdstuk: VI
        afdeling: '4'
  - number: 3b.6
    text: |-
      Indien de ondernemer, bedoeld in het tweede lid, onderdeel c, binnen de periode, genoemd in het vierde lid, wordt
      vervangen door een andere ondernemer, wordt op het tijdstip van de vervanging geen overbrenging als bedoeld in
      [artikel 3a][ref1] geacht te zijn verricht, op voorwaarde dat:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel3a
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 3a
        hoofdstuk: II
        afdeling: '1'
  - number: 3b.6.a
    text: alle andere voorwaarden, bedoeld in het tweede lid, zijn vervuld; en
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3b
  - number: 3b.6.b
    text: |-
      de ondernemer, bedoeld in het tweede lid, onderdeel b, de vervanging opneemt in het register, bedoeld in
      [artikel 34, tweede lid, onderdeel c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel34
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '34'
        hoofdstuk: VI
        afdeling: '4'
  - number: 3b.7
    text: |-
      Indien ten minste één van de voorwaarden, bedoeld in het tweede of zesde lid, binnen de periode, genoemd in het
      vierde lid, niet langer is vervuld, wordt een overbrenging van goederen in de zin van [artikel 3a][ref1] geacht te
      zijn verricht op het tijdstip dat de desbetreffende voorwaarde niet langer is vervuld. Dit tijdstip is, afhankelijk
      van de niet-vervulde voorwaarden, bepaald op de volgende momenten:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel3a
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 3a
        hoofdstuk: II
        afdeling: '1'
  - number: 3b.7.a
    text: |-
      indien de goederen worden geleverd aan een andere persoon dan de ondernemer, bedoeld in het tweede lid,
      onderdeel c, of in het zesde lid: onmiddellijk vóór een dergelijke levering;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3b
  - number: 3b.7.b
    text: |-
      indien de goederen na aankomst in de lidstaat van bestemming worden verzonden of vervoerd naar een ander land
      dan de lidstaat vanwaar zij oorspronkelijk werden verplaatst: onmiddellijk vóór de aanvang van een dergelijke
      verzending of een dergelijk vervoer; of
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3b
  - number: 3b.7.c
    text: |-
      indien de goederen worden vernietigd of gestolen of verloren zijn gegaan: op de datum waarop de goederen
      daadwerkelijk werden vernietigd of gestolen of verloren zijn gegaan, of indien het onmogelijk is om deze datum te
      bepalen, op de datum waarop werd vastgesteld dat de goederen waren vernietigd of gestolen of verloren zijn gegaan.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3b
  - number: 3c.1
    text: |-
      Indien een ondernemer via het gebruik van een elektronische interface, zoals een marktplaats, platform, portaal
      of soortgelijk middel, afstandsverkopen van uit een derdelandsgebied of een derde-land ingevoerde goederen in
      zendingen met een intrinsieke waarde van niet meer dan € 150, faciliteert, wordt die ondernemer geacht die goederen
      zelf te hebben ontvangen en geleverd.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3c
  - number: 3c.2
    text: |-
      Indien een ondernemer via het gebruik van een elektronische interface, zoals een marktplaats, platform, portaal of
      soortgelijk middel, de levering van goederen binnen de Unie door een niet in de Unie gevestigde ondernemer aan een
      andere dan ondernemer, faciliteert, wordt de ondernemer die de levering faciliteert geacht die goederen zelf te
      hebben ontvangen en geleverd.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel3c
  - number: '4.1'
    text: |-
      Diensten zijn alle prestaties, niet zijnde leveringen van goederen in de zin van [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel3
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '3'
        hoofdstuk: II
        afdeling: '1'
  - number: '4.2'
    text: |-
      Met een dienst verricht onder bezwarende titel als bedoeld in [artikel 1, onderdeel a][ref1], worden gelijkgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel1
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '1'
        hoofdstuk: I
  - number: 4.2.a
    text: |-
      het gebruiken van een tot het bedrijf behorend goed voor privé-doeleinden van de ondernemer of van zijn personeel,
      of, meer in het algemeen, voor andere dan bedrijfsdoeleinden, wanneer voor dit goed recht op volledige of
      gedeeltelijke aftrek van de belasting is ontstaan;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel4
  - number: 4.2.b
    text: |-
      het om niet verrichten van diensten door de ondernemer voor eigen privé-doeleinden of voor privé-doeleinden van
      zijn personeel, of, meer in het algemeen, voor andere dan bedrijfsdoeleinden.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel4
  - number: '4.3'
    text: |-
      Ter voorkoming van ernstige verstoring van concurrentieverhoudingen worden voorts met een dienst verricht onder
      bezwarende titel als bedoeld in [artikel 1, onderdeel a][ref1], gelijkgesteld de bij ministeriële regeling aan
      te wijzen verrichtingen door ondernemers binnen hun bedrijf, in gevallen waarin die ondernemers, indien zij die
      verrichtingen door andere ondernemers zouden laten doen, de belasting niet of niet geheel in aftrek zouden kunnen
      brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel1
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '1'
        hoofdstuk: I
  - number: '4.4'
    text: |-
      Diensten welke worden verleend door tussenkomst van een commissionair of dergelijke ondernemer die overeenkomsten
      sluit op eigen naam maar op order en voor rekening van een ander, worden geacht aan en vervolgens door die
      ondernemer te zijn verleend.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel4
  - number: '5.1'
    text: 'De plaats waar een levering wordt verricht, is:'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel5
  - number: 5.1.a
    text: |-
      ingeval het goed in verband met de levering, anders dan in de zin van [artikel 3, eerste lid, onderdeel f][ref1],
      wordt verzonden of vervoerd, de plaats waar de verzending of het vervoer aanvangt;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel3
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '3'
        hoofdstuk: II
        afdeling: '1'
  - number: 5.1.b
    text: in andere gevallen de plaats waar het goed zich bevindt op het tijdstip van de levering;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel5
  - number: 5.1.c
    text: |-
      in afwijking van onderdeel *b*, in geval van een levering van goederen aan boord van een schip, vliegtuig of trein
      en tijdens het gedeelte van een binnen de Unie verricht passagiersvervoer, de plaats van vertrek van het vervoer
      van passagiers.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel5
  - number: '5.2'
    text: |-
      In afwijking van het eerste lid, onderdeel *a*, worden, in de gevallen waarin de plaats van vertrek van de
      verzending of het vervoer van de goederen in een derdelandsgebied of derde-land ligt, de plaats waar de levering
      wordt verricht alsmede de plaats waar eventuele volgende leveringen worden verricht, geacht in de lidstaat van
      invoer van de goederen te liggen, voor zover de goederen door de leverancier of in diens opdracht worden ingevoerd.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel5
  - number: 5a.1
    text: |-
      In afwijking van [artikel 5, eerste lid, onderdeel a, en tweede lid][ref1], wordt de plaats van levering:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel5
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '5'
        hoofdstuk: II
        afdeling: 1a
  - number: 5a.1.a
    text: |-
      van intracommunautaire afstandsverkopen van goederen geacht de plaats te zijn waar de goederen zich bevinden op het
      tijdstip van aankomst van de verzending of het vervoer van de goederen naar de afnemer;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel5a
  - number: 5a.1.b
    text: |-
      van afstandsverkopen van uit een derdelandsgebied of een derde-land ingevoerde goederen geacht de plaats te zijn
      waar de goederen zich bevinden op het tijdstip van aankomst van de verzending of het vervoer naar de afnemer,
      indien de invoer plaatsvindt in een andere lidstaat dan die van aankomst van de verzending of het vervoer naar
      de afnemer;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel5a
  - number: 5a.1.c
    text: |-
      van afstandsverkopen van uit een derdelandsgebied of een derde-land ingevoerde goederen geacht zich in de lidstaat
      van aankomst van de verzending of het vervoer van de goederen naar de afnemer in die lidstaat te bevinden, indien
      de invoer in die lidstaat plaatsvindt, mits de belasting op deze goederen moet worden aangegeven in het kader van
      de invoerregeling, bedoeld in [hoofdstuk V, afdeling 7, paragraaf 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        hoofdstuk: V
        paragraaf: '4'
        afdeling: '7'
  - number: 5a.2
    text: |-
      Het eerste lid is niet van toepassing op de leveringen van gebruikte goederen, kunstvoorwerpen, voorwerpen
      voor verzamelingen en antiquiteiten die aan de btw zijn onderworpen overeenkomstig de toepasselijke bijzondere
      regelingen van BTW-richtlijn 2006.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel5a
  - number: 5b.1
    text: |-
      Ingeval de levering van gas via een op het grondgebied van de Unie gesitueerd aardgassysteem of een op een
      dergelijk systeem aangesloten net, van warmte of koude via warmte- of koudenetten of van elektriciteit wordt
      verricht aan een ondernemer die wederverkoper is, wordt die levering, in afwijking van [artikel 5][ref1], verricht
      op de plaats waar deze ondernemer is gevestigd of een vaste inrichting heeft waarvoor de goederen worden geleverd,
      dan wel, bij het ontbreken hiervan, op de plaats waar zijn woonplaats of zijn gebruikelijke verblijfplaats is.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel5
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '5'
        hoofdstuk: II
        afdeling: 1a
  - number: 5b.2
    text: |-
      Voor de toepassing van het eerste lid wordt, in afwijking van [artikel 2a, eerste lid, onderdeel k][ref1], onder
      een wederverkoper verstaan een ondernemer wiens hoofdactiviteit op het gebied van de aankoop van gas, warmte of
      koude of elektriciteit bestaat in het opnieuw verkopen van die producten en wiens eigen verbruik van die producten
      verwaarloosbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel2a
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 2a
        hoofdstuk: I
  - number: 5b.3
    text: |-
      In afwijking van [artikel 5][ref1] wordt de levering van gas via een op het grondgebied van de Unie gesitueerd
      aardgassysteem of een op een dergelijk systeem aangesloten net, van warmte of koude via warmte- of koudenetten
      of van elektriciteit in andere gevallen dan bedoeld in het eerste lid verricht op de plaats waar de afnemer het
      werkelijke gebruik en verbruik van de goederen heeft. Ingeval het gas, de warmte, de koude of de elektriciteit
      geheel of ten dele niet daadwerkelijk door de afnemer wordt verbruikt, worden deze niet-verbruikte goederen
      geacht te zijn gebruikt en verbruikt op de plaats waar hij de zetel van zijn bedrijfsuitoefening of een vaste
      inrichting heeft gevestigd waarvoor de goederen worden geleverd. Bij gebreke van een dergelijke zetel of vaste
      inrichting wordt de afnemer geacht de goederen te hebben gebruikt en verbruikt in zijn woonplaats of gebruikelijke
      verblijfplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel5
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '5'
        hoofdstuk: II
        afdeling: 1a
  - number: 5c.1
    text: |-
      Indien dezelfde goederen het voorwerp van opeenvolgende leveringen uitmaken en die goederen van een lidstaat naar
      een andere lidstaat rechtstreeks van de eerste leverancier naar de laatste afnemer in de keten worden verzonden
      of vervoerd, wordt de verzending of het vervoer uitsluitend toegeschreven aan de levering aan de tussenhandelaar,
      bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel5c
  - number: 5c.2
    text: |-
      In afwijking van het eerste lid wordt de verzending of het vervoer uitsluitend aan de levering van goederen door
      die tussenhandelaar toegeschreven indien de tussenhandelaar aan zijn leverancier het btw-identificatienummer heeft
      meegedeeld dat de lidstaat vanwaar de goederen worden verzonden of vervoerd, aan hem heeft toegekend.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel5c
  - number: 5c.3
    text: |-
      Voor de toepassing van dit artikel wordt onder tussenhandelaar verstaan de leverancier in de keten die de goederen
      ofwel zelf verzendt of vervoert ofwel voor zijn rekening door een derde laat verzenden of vervoeren. De hier
      bedoelde tussenhandelaar kan niet de eerste leverancier in de keten zijn.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel5c
  - number: 5d
    text: |-
      Indien een ondernemer geacht wordt goederen te hebben ontvangen en geleverd als bedoeld in [artikel 3c][ref1]
      wordt de verzending of het vervoer van de goederen toegerekend aan de levering die door die ondernemer is verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel3c
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel5d
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 3c
        hoofdstuk: II
        afdeling: '1'
  - number: '6.1'
    text: |-
      De plaats van een dienst, verricht voor een als zodanig handelende ondernemer, is de plaats waar die ondernemer de
      zetel van zijn bedrijfsuitoefening heeft gevestigd. Worden deze diensten evenwel verricht voor een vaste inrichting
      van de ondernemer op een andere plaats dan die waar hij de zetel van zijn bedrijfsuitoefening heeft gevestigd, dan
      geldt als plaats van dienst de plaats waar deze vaste inrichting zich bevindt. Bij gebreke van een dergelijke zetel
      of vaste inrichting, geldt als plaats van de dienst de woonplaats of gebruikelijke verblijfplaats van de ondernemer
      die deze diensten afneemt.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel6
  - number: '6.2'
    text: |-
      De plaats van een dienst, verricht voor een andere dan ondernemer, is de plaats waar de dienstverrichter de zetel
      van zijn bedrijfsuitoefening heeft gevestigd. Worden deze diensten evenwel verricht vanuit een vaste inrichting van
      de dienstverrichter, op een andere plaats dan die waar hij de zetel van zijn bedrijfsuitoefening heeft gevestigd,
      dan geldt als plaats van dienst de plaats waar deze vaste inrichting zich bevindt. Bij gebreke van een dergelijke
      zetel of vaste inrichting, geldt als plaats van de diensten de woonplaats of de gebruikelijke verblijfplaats van
      de dienstverrichter.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel6
  - number: 6a
    text: |-
      De plaats van een dienst die voor andere dan ondernemers wordt verricht door een tussenpersoon die in naam en voor
      rekening van derden handelt, is de plaats waar de onderliggende handeling overeenkomstig de bepalingen van deze wet
      wordt verricht.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel6a
  - number: 6b
    text: |-
      De plaats van een dienst die betrekking heeft op een onroerende zaak, met inbegrip van diensten van experts
      en makelaars in onroerende zaken, het verstrekken van accommodatie in het hotelbedrijf of in sectoren met een
      soortgelijke functie, zoals vakantiekampen of locaties die zijn ontwikkeld voor gebruik als kampeerterreinen, het
      verlenen van gebruiksrechten op een onroerende zaak, alsmede van diensten die erop gericht zijn de uitvoering van
      bouwwerken voor te bereiden of te coördineren, zoals de diensten verricht door architecten en door bureaus die
      toezicht houden op de uitvoering van het werk, is de plaats waar de onroerende zaak is gelegen.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel6b
  - number: 6c.1
    text: |-
      De plaats van personenvervoerdiensten is de plaats waar het vervoer plaatsvindt, zulks naar verhouding van de
      afgelegde afstanden.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel6c
  - number: 6c.2
    text: |-
      De plaats van andere goederenvervoerdiensten voor andere dan ondernemers dan het intracommunautaire
      goederenvervoer, is de plaats waar het vervoer plaatsvindt, zulks naar verhouding van de afgelegde afstanden.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel6c
  - number: 6c.3
    text: De plaats van intracommunautaire goederenvervoerdiensten voor andere dan ondernemers, is de plaats van vertrek.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel6c
  - number: 6d
    text: |-
      De plaats van een voor een ondernemer verrichte dienst bestaande in het verlenen van toegang tot culturele,
      artistieke, sportieve, wetenschappelijke, educatieve, vermakelijkheids- of soortgelijke evenementen, zoals beurzen
      en tentoonstellingen, en met de toegangverlening samenhangende diensten, is de plaats waar deze evenementen
      daadwerkelijk plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel6d
  - number: 6e.1
    text: |-
      De plaats van voor een andere dan ondernemer verrichte diensten en van daarmee samenhangende diensten, in
      verband met culturele, artistieke, sportieve, wetenschappelijke, educatieve, vermakelijkheids- of soortgelijke
      activiteiten, zoals beurzen en tentoonstellingen, inclusief de dienstverrichtingen van de organisatoren van
      dergelijke activiteiten, is de plaats waar die activiteiten daadwerkelijk plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel6e
  - number: 6e.2
    text: |-
      De plaats van de volgende diensten die voor andere dan ondernemers worden verricht, is de plaats waar die diensten
      daadwerkelijk worden verricht:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel6e
  - number: 6e.2.a
    text: activiteiten die met vervoer samenhangen, zoals laden, lossen, intern vervoer en soortgelijke activiteiten;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel6e
  - number: 6e.2.b
    text: deskundigenonderzoeken en werkzaamheden met betrekking tot roerende lichamelijke zaken.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel6e
  - number: 6f.1
    text: De plaats van restaurant- en cateringdiensten is de plaats waar die diensten materieel worden verricht.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel6f
  - number: 6f.2
    text: |-
      De plaats van restaurant- en cateringdiensten die materieel worden verricht aan boord van een schip, vliegtuig
      of trein tijdens het in de Unie verrichte gedeelte van een passagiersvervoer, is de plaats van vertrek van het
      passagiersvervoer.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel6f
  - number: 6g.1
    text: |-
      De plaats van dienst van kortdurende verhuur van een vervoermiddel is de plaats waar dat vervoermiddel
      daadwerkelijk ter beschikking van de afnemer wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel6g
  - number: 6g.2
    text: |-
      De plaats van andere dan kortdurende verhuur van een vervoermiddel aan een andere dan ondernemer is de plaats waar
      de afnemer gevestigd is of zijn woonplaats of gebruikelijke verblijfplaats heeft.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel6g
  - number: 6g.3
    text: |-
      In afwijking van het tweede lid is de plaats van andere dan kortdurende verhuur van een pleziervaartuig aan
      een andere dan ondernemer de plaats waar het pleziervaartuig effectief ter beschikking van de afnemer wordt
      gesteld, indien deze dienst daadwerkelijk door de dienstverrichter wordt verricht vanuit de zetel van zijn
      bedrijfsuitoefening of een vaste inrichting aldaar.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel6g
  - number: 6g.4
    text: |-
      Voor de toepassing van dit artikel wordt onder «kortdurende verhuur» verstaan: het ononderbroken bezit of gebruik
      van het vervoermiddel gedurende een periode van ten hoogste dertig dagen, en voor schepen ten hoogste negentig
      dagen.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel6g
  - number: 6h.1
    text: |-
      De plaats van dienst van de volgende diensten, die worden verricht voor een andere dan ondernemer, is de plaats
      waar deze persoon gevestigd is of zijn woonplaats of gebruikelijke verblijfplaats heeft:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel6h
  - number: 6h.1.a
    text: telecommunicatiediensten;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel6h
  - number: 6h.1.b
    text: radio- en televisieomroepdiensten;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel6h
  - number: 6h.1.c
    text: elektronische diensten.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel6h
  - number: 6h.2
    text: |-
      Het feit dat de dienstverrichter en de afnemer langs elektronische weg berichten uitwisselen, betekent op zich niet
      dat de verrichte dienst een elektronische dienst is.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel6h
  - number: 6i
    text: |-
      De plaats van de volgende diensten, verricht voor een andere dan ondernemer die buiten de Unie gevestigd is of
      aldaar zijn woonplaats of gebruikelijke verblijfplaats heeft, is de plaats waar deze persoon gevestigd is of zijn
      woonplaats of gebruikelijke verblijfplaats heeft:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel6i
  - number: 6i.a
    text: |-
      de overdracht en het verlenen van auteursrechten, octrooien, licentierechten, handelsmerken en soortgelijke
      rechten;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel6i
  - number: 6i.b
    text: diensten op het gebied van de reclame;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel6i
  - number: 6i.c
    text: |-
      diensten verricht door raadgevende personen, ingenieurs, adviesbureaus, advocaten, accountants en andere
      soortgelijke diensten, alsmede gegevensverwerking en informatieverschaffing;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel6i
  - number: 6i.d
    text: |-
      de verplichting om een beroepsactiviteit of een in dit artikel vermeld recht geheel of gedeeltelijk niet uit te
      oefenen;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel6i
  - number: 6i.e
    text: |-
      bank-, financiële en verzekeringsverrichtingen met inbegrip van herverzekeringsverrichtingen en met uitzondering
      van de verhuur van safeloketten;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel6i
  - number: 6i.f
    text: het beschikbaar stellen van personeel;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel6i
  - number: 6i.g
    text: de verhuur van roerende lichamelijke zaken, met uitzondering van alle vervoermiddelen;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel6i
  - number: 6i.h
    text: |-
      het bieden van toegang tot een op het grondgebied van de Unie gesitueerd aardgassysteem of een op een dergelijk
      systeem aangesloten net, tot warmte- of koudenetten of tot het elektriciteitssysteem, alsmede het verrichten van
      transmissie- of distributiediensten via deze systemen of netten en het verrichten van andere daarmee rechtstreeks
      verbonden diensten.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel6i
  - number: 6j
    text: |-
      De hierna genoemde diensten die worden verricht door ondernemers die buiten de Unie wonen of zijn gevestigd dan
      wel aldaar een vaste inrichting hebben van waaruit de dienst wordt verricht, of die, bij gebreke van een dergelijke
      zetel of vaste inrichting, hun woonplaats of gebruikelijke verblijfplaats buiten de Unie hebben, en de plaats
      van die diensten buiten de Unie is gelegen worden aangemerkt als worden zij in Nederland verricht, wanneer het
      werkelijke gebruik en de werkelijke exploitatie in Nederland plaatsvinden:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel6j
  - number: 6j.a
    text: |-
      diensten, bestaande in de verhuur van vervoermiddelen, die worden verricht voor andere dan ondernemers die in
      Nederland wonen of zijn gevestigd dan wel aldaar een vaste inrichting hebben waarvoor de diensten worden verricht;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel6j
  - number: 6j.b
    text: |-
      diensten als bedoeld in [artikel 6i, onderdelen a tot en met g][ref1], die worden verricht voor in Nederland
      gevestigde lichamen in de zin van de [Algemene wet inzake rijksbelastingen][ref2], andere dan ondernemers.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel6i
      [ref2]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel6j
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 6i
        hoofdstuk: II
        paragraaf: '2'
        afdeling: 1b
      - id: ref2
        bwb_id: BWBR0002320
  - number: 6k.1
    text: |-
      [Artikel 5a, eerste lid, onderdeel a][ref1], en [artikel 6h, eerste lid][ref2], zijn niet van toepassing wanneer
      aan de volgende voorwaarden is voldaan:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel6h
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel6k
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 5a
        hoofdstuk: II
        afdeling: 1a
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 6h
        hoofdstuk: II
        paragraaf: '2'
        afdeling: 1b
  - number: 6k.1.a
    text: |-
      de leverancier of dienstverrichter is gevestigd of, bij gebreke van een vestiging, heeft zijn woonplaats of
      gebruikelijke verblijfplaats in slechts één lidstaat;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel6k
  - number: 6k.1.b
    text: |-
      de diensten worden verleend aan andere dan ondernemers die gevestigd zijn, hun woonplaats of gebruikelijke
      verblijfplaats hebben in een andere dan de lidstaat, bedoeld in onderdeel a, of de goederen worden verzonden of
      vervoerd naar een andere dan de lidstaat bedoeld in onderdeel a; en
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel6k
  - number: 6k.1.c
    text: |-
      het totale bedrag van de leveringen van diensten of goederen, bedoeld in onderdeel b, de belasting niet inbegrepen,
      is in het lopende kalenderjaar niet hoger dan € 10 000 of de tegenwaarde daarvan in de nationale munteenheid, en
      heeft dit bedrag ook niet overschreden in de loop van het voorafgaande kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel6k
  - number: 6k.2
    text: |-
      Wanneer de drempel, genoemd in het eerste lid, onderdeel c, in de loop van een kalenderjaar wordt overschreden,
      zijn [artikel 5a, eerste lid, onderdeel a][ref1], en [artikel 6h][ref2] vanaf die datum van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel6h
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel6k
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 5a
        hoofdstuk: II
        afdeling: 1a
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 6h
        hoofdstuk: II
        paragraaf: '2'
        afdeling: 1b
  - number: 6k.3
    text: |-
      In afwijking van het eerste lid, zijn [artikel 5a, eerste lid, onderdeel a][ref1], en [artikel 6h][ref2] van
      toepassing wanneer de leverancier of dienstverrichter, bedoeld in het eerste lid, in de lidstaat op het grondgebied
      waarvan hij is gevestigd of, bij gebreke van een vestiging zijn woonplaats of gebruikelijke verblijfplaats heeft,
      daarvoor kiest overeenkomstig de in die lidstaat geldende regels.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel6h
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel6k
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 5a
        hoofdstuk: II
        afdeling: 1a
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 6h
        hoofdstuk: II
        paragraaf: '2'
        afdeling: 1b
  - number: 6k.4
    text: |-
      Wanneer de lidstaat, bedoeld in het derde lid, Nederland is, meldt de leverancier of dienstverrichter die
      [artikel 5a, eerste lid, onderdeel a][ref1], en [artikel 6h][ref2] wil toepassen dit bij de inspecteur. Deze
      melding geldt tot wederopzegging door die ondernemer doch ten minste voor twee kalenderjaren. De melding wordt
      gedaan op een door de inspecteur vast te stellen wijze. Bij ministeriële regeling worden nadere regels gesteld met
      betrekking tot de melding.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel6h
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel6k
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 5a
        hoofdstuk: II
        afdeling: 1a
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 6h
        hoofdstuk: II
        paragraaf: '2'
        afdeling: 1b
  - number: 6k.5
    text: |-
      De tegenwaarde in de nationale munteenheid van het bedrag, genoemd in het eerste lid, onderdeel c, wordt berekend
      volgens de wisselkoers die op 5 december 2017 door de Europese Centrale Bank bekend is gemaakt.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel6k
  - number: '7.1'
    text: Ondernemer is ieder die een bedrijf zelfstandig uitoefent.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel7
  - number: '7.2'
    text: 'Waar in deze wet wordt gesproken van bedrijf, wordt daaronder mede verstaan:'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel7
  - number: 7.2.a
    text: beroep;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel7
  - number: 7.2.b
    text: exploitatie van een vermogensbestanddeel om er duurzaam opbrengst uit te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel7
  - number: '7.3'
    text: |-
      Bij ministeriële regeling kan worden bepaald, dat publiekrechtelijke lichamen die, anders dan als ondernemer,
      prestaties verrichten welke uit hun aard ook door ondernemers kunnen worden verricht, met betrekking tot die
      prestaties als ondernemer worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel7
  - number: '7.4'
    text: |-
      Natuurlijke personen en lichamen in de zin van de [Algemene wet inzake rijksbelastingen][ref1], die op grond van
      het bepaalde in dit artikel ondernemer zijn en die in Nederland wonen of zijn gevestigd dan wel aldaar een vaste
      inrichting hebben en die in financieel, organisatorisch en economisch opzicht zodanig zijn verweven, dat zij een
      eenheid vormen, worden, al dan niet op verzoek van één of meer van deze natuurlijke personen of lichamen, bij voor
      bezwaar vatbare beschikking van de inspecteur als één ondernemer aangemerkt en wel met ingang van de eerste dag van
      de maand, volgende op die waarin de inspecteur die beschikking heeft afgegeven. Bij ministeriële regeling kunnen
      nadere regels worden gesteld ter zake van de vorming, wijziging en beëindiging van de fiscale eenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: '7.5'
    text: |-
      Onder bij ministeriële regeling te stellen voorwaarden kunnen lichamen in de zin van de
      [Algemene wet inzake rijksbelastingen][ref1] die, anders dan als ondernemer, prestaties verrichten ten behoeve van
      ondernemers, die krachtens [artikel 15][ref2] ter zake belasting in aftrek zouden hebben kunnen brengen, indien
      die prestaties ten behoeve van hen door een ondernemer zouden zijn verricht, met betrekking tot die prestaties als
      ondernemer worden aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '15'
        hoofdstuk: II
        afdeling: '4'
  - number: '7.6'
    text: |-
      Degene die, anders dan als ondernemer, een nieuw vervoermiddel levert welk vervoermiddel wordt verzonden of
      vervoerd naar een andere lidstaat, wordt met betrekking tot die levering als ondernemer aangemerkt.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel7
  - number: '7.7'
    text: |-
      Voor de toepassing van de regels betreffende de plaats van dienst in deze wet en in de daarop gebaseerde bepalingen
      wordt:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel7
  - number: 7.7.a
    text: |-
      een ondernemer die ook werkzaamheden of handelingen verricht die niet als belastbare goederenleveringen of diensten
      in de zin van artikel 2, lid 1, van BTW-richtlijn 2006 worden beschouwd, met betrekking tot alle voor hem verrichte
      diensten als ondernemer aangemerkt;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel7
  - number: 7.7.b
    text: een rechtspersoon, andere dan ondernemer, die voor btw-doeleinden is geïdentificeerd, als ondernemer aangemerkt.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel7
  - number: '8.1'
    text: De belasting wordt berekend over de vergoeding.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel8
  - number: '8.2'
    text: |-
      De vergoeding is het totale bedrag dat - of voor zover de tegenprestatie niet in een geldsom bestaat, de totale
      waarde van de tegenprestatie welke - ter zake van de levering of de dienst in rekening wordt gebracht, de
      omzetbelasting niet daaronder begrepen. Ingeval ter zake van de levering of de dienst meer wordt voldaan dan
      hetgeen in rekening is gebracht, komt in plaats daarvan in aanmerking hetgeen is voldaan.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel8
  - number: '8.3'
    text: |-
      Ten aanzien van de handelingen, bedoeld in [artikel 3, derde lid][ref1], en [artikel 3a, eerste lid][ref2],
      wordt de vergoeding gesteld op de aankoopprijs van de goederen of van soortgelijke goederen of, indien er geen
      aankoopprijs is, de kostprijs, berekend op het tijdstip waarop deze handelingen worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel3a
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '3'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 3a
        hoofdstuk: II
        afdeling: '1'
  - number: '8.4'
    text: 'De vergoeding wordt gesteld op de normale waarde van de dienst indien:'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel8
  - number: 8.4.a
    text: |-
      een auto tegen een lagere vergoeding dan de normale waarde voor andere dan bedrijfsdoeleinden in gebruik wordt
      gegeven aan een verbonden afnemer die geen volledig recht op aftrek heeft uit hoofde van [artikel 15][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '15'
        hoofdstuk: II
        afdeling: '4'
  - number: 8.4.b
    text: |-
      het gaat om handelingen als bedoeld in [artikel 4, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel4
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '4'
        hoofdstuk: II
        afdeling: '1'
  - number: '8.5'
    text: 'Bij of krachtens algemene maatregel van bestuur kan worden bepaald in hoever:'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel8
  - number: 8.5.a
    text: |-
      de korting voor contante betaling, de kosten van verpakking, de vracht- en assurantiekosten, de uitschotten van
      belasting en andere met doorlopende posten gelijk te stellen bedragen niet tot de vergoeding behoren;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel8
  - number: 8.5.b
    text: |-
      bij met grondrente bezwaarde eigendom, rechten van erfpacht, opstal, erfdienstbaarheid of beklemming,
      appartementen, lidmaatschapsrechten en dergelijke, de daaraan verbonden lasten tot de vergoeding behoren;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel8
  - number: 8.5.c
    text: |-
      bij eigendom, bezwaard met een recht van erfpacht, opstal, erfdienstbaarheid of beklemming, de vergoeding wordt
      verminderd met de aan die rechten verbonden lasten;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel8
  - number: 8.5.d
    text: |-
      bij levering anders dan met toepassing van [artikel 28b][ref1] of [28d][ref2], van
      gebruikte personenauto's, gebruikte motorrijwielen en gebruikte bestelauto's in de zin van
      [artikel 10 van de Wet op de belasting van personenauto’s en motorrijwielen 1992][ref3], de vergoeding
      wordt verminderd met de op de voet van die wet geheven belasting. Voor het vaststellen van het bedrag van die
      vermindering worden regels gesteld met inachtneming van de bepalingen van of ingevolge [die wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28b
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel28d
      [ref3]: https://wetten.overheid.nl/BWBR0005806#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0005806
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28b
        hoofdstuk: V
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 28d
        hoofdstuk: V
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0005806
        artikel: '10'
      - id: ref4
        bwb_id: BWBR0005806
  - number: '8.6'
    text: |-
      Indien gegevens voor het bepalen van de vergoeding zijn uitgedrukt in een andere munteenheid dan de euro, wordt
      de wisselkoers vastgesteld overeenkomstig de laatst genoteerde verkoopkoers op het tijdstip waarop de belasting
      verschuldigd wordt. In plaats van het hiervoor bedoelde wisselkoersmechanisme mag ook gebruik gemaakt worden van de
      wisselkoers die, op het tijdstip waarop de belasting verschuldigd wordt, door de Europese Centrale Bank laatstelijk
      was bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel8
  - number: '8.7'
    text: |-
      Ten aanzien van de handelingen, bedoeld in [artikel 4, tweede lid][ref1], wordt de vergoeding gesteld op de door
      de ondernemer voor het verrichten van de diensten gemaakte uitgaven. Bij ministeriële regeling kunnen nadere regels
      worden gesteld met betrekking tot de door de ondernemer voor het verrichten van deze diensten gemaakte uitgaven.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel4
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '4'
        hoofdstuk: II
        afdeling: '1'
  - number: '9.1'
    text: De belasting bedraagt 21 percent.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel9
  - number: '9.2'
    text: 'In afwijking van het eerste lid bedraagt de belasting:'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel9
  - number: 9.2.a
    text: |-
      9 percent voor leveringen van goederen en diensten, genoemd in de bij deze wet behorende [tabel I][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: 9.2.b
    text: |-
      nihil voor leveringen van goederen en diensten, genoemd in de bij deze wet behorende [tabel II][ref1], mits is
      voldaan aan bij algemene maatregel van bestuur vast te stellen voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: '11.1'
    text: 'Onder bij algemene maatregel van bestuur vast te stellen voorwaarden zijn van de belasting vrijgesteld:'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: 11.1.a
    text: 'de levering van onroerende zaken en van rechten waaraan deze zijn onderworpen, met uitzondering van:'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: 11.1.a.1°
    text: |-
      de levering van een gebouw of een gedeelte van een gebouw en het erbij behorend terrein vóór, op of uiterlijk twee
      jaren na het tijdstip van eerste ingebruikneming, alsmede de levering van een bouwterrein;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: 11.1.a.2°
    text: |-
      leveringen, andere dan die bedoeld onder 1°, aan personen die de onroerende zaak gebruiken voor doeleinden waarvoor
      een volledig of nagenoeg volledig recht op aftrek van belasting op de voet van [artikel 15][ref1] bestaat, mits
      de ondernemer die de levering verricht en degene aan wie wordt geleverd, blijkens de notariële akte van levering
      daarvoor hebben gekozen of in andere gevallen gezamenlijk een verzoek daartoe aan de inspecteur hebben gedaan en
      overigens voldoen aan bij ministeriële regeling te stellen voorwaarden;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '15'
        hoofdstuk: II
        afdeling: '4'
  - number: 11.1.b
    text: 'de verhuur (de verpachting daaronder begrepen) van onroerende zaken, met uitzondering van:'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: 11.1.b.1°
    text: de verhuur van blijvend geïnstalleerde werktuigen en machines;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: 11.1.b.2°
    text: |-
      de verhuur binnen het kader van het hotel-, pension-, kamp- en vakantiebestedingsbedrijf aan personen, die daar
      slechts voor een korte periode verblijf houden;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: 11.1.b.3°
    text: de verhuur van parkeerruimte voor voertuigen en de verhuur van lig- en bergplaatsen voor vaartuigen;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: 11.1.b.4°
    text: de verhuur van safeloketten;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: 11.1.b.5°
    text: |-
      de verhuur van onroerende zaken, andere dan gebouwen en gedeelten daarvan welke als woning worden gebruikt, door
      een verhuurder, die niet de vrijstelling, bedoeld in [artikel 25, eerste lid][ref1], toepast, aan personen die
      de onroerende zaak gebruiken voor doeleinden waarvoor een volledig of nagenoeg volledig recht op aftrek van de
      belasting op de voet van [artikel 15][ref2] bestaat mits de verhuurder en de huurder blijkens de schriftelijke
      huurovereenkomst daarvoor hebben gekozen of in andere gevallen gezamenlijk een verzoek daartoe aan de inspecteur
      hebben gedaan en overigens voldoen aan bij ministeriële regeling te stellen voorwaarden;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '25'
        hoofdstuk: V
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '15'
        hoofdstuk: II
        afdeling: '4'
  - number: 11.1.c
    text: |-
      het verzorgen en het verplegen van in een inrichting opgenomen personen, alsmede de handelingen die daarmee nauw
      samenhangen, waaronder begrepen het verstrekken van spijzen en dranken, geneesmiddelen en verbandmiddelen aan die
      personen;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: 11.1.d
    text: |-
      de diensten aan de jeugd en de jeugdleiders door organisaties voor het algemene jeugdwerk die door de overheid als
      zodanig zijn erkend;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: 11.1.e
    text: |-
      diensten die nauw samenhangen met de beoefening van sport of met lichamelijke opvoeding en die door instellingen
      worden verricht voor personen die aan sport of lichamelijke opvoeding doen, met uitzondering van:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: 11.1.e.1
    text: het verlenen van toegang tot wedstrijden, demonstraties en dergelijke;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: 11.1.e.2
    text: |-
      het ter beschikking stellen van lig- en bergplaatsen voor vaartuigen die op grond van objectieve kenmerken niet
      geschikt zijn voor sportbeoefening;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: 11.1.f
    text: |-
      de bij algemene maatregel van bestuur aan te wijzen leveringen en diensten van sociale of culturele aard, mits
      de ondernemer geen winst beoogt en niet een verstoring van concurrentieverhoudingen optreedt ten opzichte van
      ondernemers die winst beogen;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: 11.1.g.1°
    text: 'de volgende leveringen en diensten:'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: 11.1.g.1°.a
    text: |-
      de diensten op het vlak van de gezondheidskundige verzorging van de mens door beoefenaren van een medisch of
      paramedisch beroep die een op dit beroep gerichte opleiding hebben voltooid waarvoor regels zijn gesteld bij of
      krachtens de [Wet op de beroepen in de individuele gezondheidszorg][ref1], voor zover deze diensten tot het gebied
      van deskundigheid van dit beroep behoren en onderdeel vormen van bedoelde opleiding;


      [ref1]: https://wetten.overheid.nl/BWBR0006251
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006251
  - number: 11.1.g.1°.b
    text: |-
      diensten die door tandtechnici als zodanig worden verricht; de leveringen van tandprothesen door tandartsen en
      tandtechnici; het vervoer van zieken of gewonden met ambulance-automobielen;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: 11.1.g.2°
    text: |-
      de verblijfszorg, bedoeld in [artikel 3.1.1, eerste lid, onder a][ref1], en de zorg, bedoeld in artikel 3.1.1,
      eerste lid, onder b en c, van de Wet langdurige zorg, alsmede huishoudelijke hulp, voor zover die zorg niet
      gepaard gaat met verblijf in een instelling en plaatsvindt aan personen ten behoeve van wie in een indicatiebesluit
      op grond van de [Wet langdurige zorg][ref2] is vastgesteld dat ze op de in die onderdelen bedoelde zorg zijn
      aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0035917
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0035917
  - number: 11.1.g.3°
    text: |-
      de bij algemene maatregel van bestuur aan te wijzen diensten die deel uitmaken van een voorziening ter
      ondersteuning van de zelfredzaamheid en participatie van personen met een beperking of met chronische psychische
      of psychosociale problemen als bedoeld in de [Wet maatschappelijke ondersteuning 2015][ref1], verleend aan personen
      van wie vaststaat dat zij ingevolge die wet op die diensten zijn aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0035362
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0035362
  - number: 11.1.g.4°
    text: 'de diensten door ondernemers bestaande in het verlenen van dagbesteding, arbeidstraining of dagopvang aan:'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: 11.1.g.4°.a
    text: |-
      personen voor wie zij daartoe een schriftelijke overeenkomst hebben gesloten met een instelling als
      bedoeld in [artikel 1.1.1 van de Wet langdurige zorg][ref1] of met een aanbieder als bedoeld in
      [artikel 1.1.1 van de Wet maatschappelijke ondersteuning 2015][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0035362#Artikel1
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0035917
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0035362
        artikel: '1'
  - number: 11.1.g.4°.b
    text: |-
      personen met wie zij daartoe een schriftelijke overeenkomst hebben gesloten en die beschikken over een
      persoonsgebonden budget met het oog op het geldend maken van hun aanspraken ingevolge de onder a genoemde wetten;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: 11.1.h
    text: de diensten door lijkbezorgers;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: 11.1.i
    text: 'de volgende leveringen en diensten:'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: 11.1.i.1°
    text: |-
      de handelingen, bemiddeling daaronder begrepen, betreffende deviezen, bankbiljetten en munten, welke in enig land
      de hoedanigheid van wettig betaalmiddel bezitten, met uitzondering van bankbiljetten en munten, welke gewoonlijk
      niet als wettig betaalmiddel worden gebruikt of welke een verzamelwaarde hebben;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: 11.1.i.2°
    text: |-
      de handelingen, bemiddeling daaronder begrepen doch uitgezonderd bewaring en beheer, inzake effecten en andere
      waardepapieren met uitzondering van documenten welke goederen vertegenwoordigen;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: 11.1.i.3°
    text: |-
      het beheer van door beleggingsfondsen en beleggingsmaatschappijen ter collectieve belegging bijeengebrachte
      vermogens;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: 11.1.j
    text: 'de volgende diensten:'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: 11.1.j.1°
    text: het verlenen van en de bemiddeling inzake krediet;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: 11.1.j.2°
    text: |-
      de handelingen, bemiddeling daaronder begrepen, betreffende giro- en rekeningcourantverkeer, deposito's,
      betalingen, overmakingen, schuldvorderingen, cheques en andere handelspapieren, met uitzondering van de invordering
      van schuldvorderingen;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: 11.1.j.3°
    text: het aangaan van en het bemiddelen bij borgtochten en andere zekerheids- en garantieverbintenissen;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: 11.1.k
    text: |-
      handelingen ter zake van verzekering en herverzekering met inbegrip van daarmee samenhangende diensten, verricht
      door assurantiemakelaars en verzekeringstussenpersonen;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: 11.1.l
    text: |-
      de kansspelen in de zin van [artikel 2, eerste lid, van de Wet op de kansspelbelasting][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002359#Artikel2
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002359
        artikel: '2'
  - number: 11.1.m
    text: |-
      de diensten, en de daarmee gepaard gaande leveringen, bedoeld in [artikel 16 van de Postwet 2009][ref1], die worden
      verricht door een verlener van de universele postdienst, bedoeld in [die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0025572
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0025572
  - number: 11.1.n
    text: de niet-commerciële activiteiten van openbare radio- en televisieorganisaties;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: 11.1.o
    text: 'het verzorgen van:'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: 11.1.o.1°
    text: |-
      onderwijs, met inbegrip van de diensten en leveringen die daarmee nauw samenhangen, door daartoe bestemde scholen
      en instellingen, als is omschreven bij of krachtens de wetten tot regeling van het onderwijs dat krachtens
      wettelijk voorschrift is onderworpen aan het toezicht door de Inspectie van het onderwijs of aan een ander toezicht
      door de minister die met de zorg voor het desbetreffende onderwijs is belast;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: 11.1.o.2°
    text: |-
      bij algemene maatregel van bestuur aan te wijzen onderwijs, met inbegrip van de diensten en leveringen die
      daarmee nauw samenhangen, waarbij kan worden bepaald, dat de vrijstelling slechts toepassing vindt ten aanzien van
      ondernemers die met dat onderwijs geen winst beogen;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: 11.1.p
    text: |-
      de voordrachten en dergelijke diensten in bij ministeriële regeling aan te wijzen gevallen, mits tegen een
      vergoeding die in hoofdzaak strekt tot dekking van kosten;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: 11.1.q
    text: de diensten door componisten, schrijvers en journalisten;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: 11.1.r
    text: |-
      de levering van een roerende zaak die in het bedrijf van de ondernemer uitsluitend is gebruikt ten behoeve
      van vrijgestelde prestaties of voor doeleinden als zijn bedoeld in [artikel 16][ref1], ingeval ter zake van de
      voorafgaande levering van die zaak geen belasting in aftrek is gebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel16
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '16'
        hoofdstuk: II
        afdeling: '4'
  - number: 11.1.s
    text: de levering van menselijke organen, menselijk bloed en moedermelk;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: 11.1.t
    text: |-
      de diensten en daarmee nauw samenhangende leveringen door werkgevers- en werknemersorganisaties, alsmede door
      organisaties van politieke, godsdienstige, vaderlandslievende, levensbeschouwelijke of liefdadige aard aan hun
      leden tegen een statutair vastgestelde contributie;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: 11.1.u
    text: |-
      bij algemene maatregel van bestuur aan te wijzen diensten welke door zelfstandige groeperingen van personen of
      lichamen in de zin van de [Algemene wet inzake rijksbelastingen][ref1], die prestaties verrichten welke zijn
      vrijgesteld of waarvoor zij geen ondernemer zijn, worden verleend aan hun leden en welke rechtstreeks nodig zijn
      voor het verrichten van voornoemde prestaties, mits die groeperingen van hun leden slechts terugbetaling vorderen
      van hun aandeel in de gezamenlijke uitgaven en geen verstoring van concurrentieverhoudingen optreedt;


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: 11.1.v
    text: |-
      leveringen en diensten van bijkomstige aard door organisaties waarvan de prestaties overigens op grond van
      onderdeel c, d, e, f, o, onder 1°, of t zijn vrijgesteld, voor zover die leveringen en diensten voortvloeien
      uit activiteiten ter verkrijging van financiële steun voor deze organisaties, mits de ontvangsten ter zake van
      leveringen niet meer bedragen dan € 68 067 per jaar en ter zake van diensten niet meer dan € 22 689 per jaar, met
      dien verstande dat voor organisaties als bedoeld in onderdeel *e*, laatstgenoemd bedrag € 50 000 bedraagt;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: 11.1.w
    text: |-
      opvang van kinderen in kinderopvang of gastouderopvang als bedoeld in [artikel 1.1 van de Wet kinderopvang][ref1],
      indien het betreft kinderopvang in een overeenkomstig die wet geregistreerd kindercentrum of gastouderopvang door
      tussenkomst van een overeenkomstig die wet geregistreerd gastouderbureau en overigens wordt voldaan aan de in
      voormelde wet gestelde eisen, opvang van kinderen als bedoeld in artikel 1.1, tweede lid, onderdeel a, van die wet,
      alsmede nader bij algemene maatregel van bestuur aan te wijzen vormen van kinderopvang.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
  - number: '11.2'
    text: |-
      De nauw samenhangende leveringen en diensten, bedoeld in het eerste lid, aanhef en onderdelen c, e, o en t, zijn
      van de vrijstelling uitgesloten wanneer zij:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: 11.2.a
    text: niet onontbeerlijk zijn voor het verrichten van de vrijgestelde handelingen; of
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: 11.2.b
    text: |-
      in hoofdzaak ertoe strekken aan de instelling extra opbrengsten te verschaffen door de uitvoering van handelingen
      welke worden verricht in rechtstreekse mededinging met aan de heffing van belasting onderworpen handelingen van
      commerciële ondernemingen.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: '11.3'
    text: |-
      De vrijstellingen, bedoeld in het eerste lid, aanhef en onderdelen c, e en t, zijn slechts van toepassing,
      indien de ondernemer geen winst beoogt. Onder het beogen van winst wordt mede verstaan het behalen van
      exploitatieoverschotten, tenzij deze worden aangewend voor de instandhouding of verbetering van de diensten die
      worden verricht.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: '11.4'
    text: 'Voor toepassing van het eerste lid, onderdeel e, is geen sprake van een instelling die winst beoogt, indien:'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: 11.4.a
    text: |-
      de instelling direct of indirect bijdragen ontvangt die geen vergoeding vormen of een vergoeding vormen hoger dan
      de normale waarde voor een prestatie en de instelling zonder die bijdragen geen overschot zou behalen; of
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: 11.4.b
    text: |-
      aan de instelling direct of indirect een sportaccommodatie of een gedeelte daarvan ter beschikking wordt gesteld
      door een publiekrechtelijk lichaam dat ter zake van die terbeschikkingstelling niet ten minste de aan die
      accommodatie of het gedeelte daarvan toerekenbare integrale kosten aan zijn afnemer in rekening brengt.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: '11.5'
    text: 'Voor de toepassing van het eerste lid, onderdeel *a*, onder 1°:'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: 11.5.a
    text: wordt als gebouw beschouwd ieder bouwwerk dat vast met de grond is verbonden;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: 11.5.b
    text: |-
      wordt na de verbouwing van een gebouw de ingebruikneming als eerste ingebruikneming aangemerkt, indien door die
      verbouwing een vervaardigd goed is voortgebracht;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: 11.5.c
    text: |-
      wordt als erbij behorend terrein beschouwd ieder terrein dat naar maatschappelijke opvattingen behoort bij dan wel
      dienstbaar is aan het gebouw.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: '11.6'
    text: |-
      Onder een bouwterrein als bedoeld in het eerste lid, onderdeel a, onder 1°, wordt verstaan onbebouwde grond die
      kennelijk bestemd is om te worden bebouwd met een of meer gebouwen.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: '11.7'
    text: |-
      Voor de toepassing van het eerste lid, onderdelen a, onder 2°, en b, onder 5°, worden onder het gebruiken
      voor doeleinden waarvoor een volledig of nagenoeg volledig recht op aftrek van belasting op de voet van
      [artikel 15][ref1] bestaat, niet begrepen de handelingen, bedoeld in de [artikelen 3, derde lid][ref2], en
      [4, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel4
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '15'
        hoofdstuk: II
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '3'
        hoofdstuk: II
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002629
        artikel: '4'
        hoofdstuk: II
        afdeling: '1'
  - number: '11.8'
    text: |-
      Tot de leveringen of diensten, bedoeld in het eerste lid, onderdelen f, g, onder 2° en onder 3°, t, u of v, behoren
      niet de bij ministeriële regeling, in verband met het voorkomen van een verstoring van concurrentieverhoudingen,
      aan te wijzen leveringen of diensten.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel11
  - number: '12.1'
    text: De belasting wordt geheven van de ondernemer die de levering of de dienst verricht.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel12
  - number: '12.2'
    text: |-
      Ingeval de ondernemer die een levering als bedoeld in [artikel 5b][ref1] of een dienst als bedoeld in
      [artikel 6, eerste lid][ref2], verricht, niet in Nederland woont of is gevestigd en aldaar geen vaste inrichting
      heeft van waaruit de levering wordt verricht of de dienst wordt verleend, en aan degene aan wie de levering wordt
      verricht of de dienst wordt verleend een btw-identificatienummer in Nederland is toegekend, wordt de belasting
      geheven van degene aan wie de levering wordt verricht of de dienst wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel5b
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel6
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 5b
        hoofdstuk: II
        afdeling: 1a
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: 1b
  - number: '12.3'
    text: |-
      Ingeval de ondernemer die de levering, niet zijnde een levering waarop de bij deze wet behorende tabel II,
      onderdeel *a*, post 6, van toepassing is, of een dienst, andere dan bedoeld in het tweede lid, verricht, niet in
      Nederland woont of is gevestigd en aldaar geen vaste inrichting heeft van waaruit de levering of de dienst wordt
      verricht, en degene aan wie de levering wordt verricht of de dienst wordt verleend, een ondernemer is die in
      Nederland woont of is gevestigd dan wel aldaar een vaste inrichting heeft, of een in Nederland gevestigd lichaam
      in de zin van de [Algemene wet inzake rijksbelastingen][ref1] is, wordt de belasting geheven van degene aan wie de
      levering wordt verricht of de dienst wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: '12.4'
    text: |-
      Voor de toepassing van dit artikel wordt een ondernemer die een vaste inrichting heeft in Nederland, geacht een
      niet in Nederland gevestigde ondernemer te zijn wanneer aan de volgende voorwaarden is voldaan:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel12
  - number: 12.4.a
    text: hij verricht in Nederland een belastbare goederenlevering of een dienst;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel12
  - number: 12.4.b
    text: bij het verrichten van die goederenlevering of die dienst is de vaste inrichting in Nederland niet betrokken.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel12
  - number: '12.5'
    text: |-
      In bij algemene maatregel van bestuur aan te wijzen gevallen wordt onder bij of krachtens deze maatregel te stellen
      regelen de belasting, ten einde voor de inning daarvan meer waarborgen te scheppen, geheven van degene aan wie de
      levering wordt verricht of de dienst wordt verleend.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel12
  - number: '13.1'
    text: 'De belasting wordt verschuldigd:'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel13
  - number: 13.1.a
    text: |-
      in gevallen waarin ingevolge de [artikelen 34b tot en met 35][ref1] een factuur moet worden uitgereikt, op het
      tijdstip van de uitreiking of, indien deze niet tijdig plaatsvindt, het tijdstip waarop zij uiterlijk had moeten
      geschieden tenzij sprake is van een dienst waarover de belasting op grond van [artikel 12, tweede lid][ref2],
      verschuldigd is door de afnemer van deze dienst, in welk geval de belasting verschuldigd wordt op het tijdstip
      waarop de dienst wordt verricht;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel12
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '35'
        hoofdstuk: VI
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '12'
        hoofdstuk: II
        afdeling: '4'
  - number: 13.1.b
    text: in andere gevallen op het tijdstip waarop de levering of de dienst wordt verricht.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel13
  - number: '13.2'
    text: |-
      In afwijking in zover van het eerste lid wordt de belasting of het desbetreffende gedeelte daarvan uiterlijk
      verschuldigd op het tijdstip waarop de vergoeding geheel of gedeeltelijk wordt ontvangen.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel13
  - number: '13.3'
    text: |-
      Bij een levering of overbrenging voor bedrijfsdoeleinden van goederen met toepassing van de bij deze wet
      behorende [tabel II, onderdeel a, post 6][ref1], wordt de belasting, in afwijking van het eerste en tweede lid,
      verschuldigd op het tijdstip van uitreiking van de factuur, of op het tijdstip van het verstrijken van de in
      [artikel 34g, eerste volzin][ref2], bedoelde termijn indien er vóór die datum geen factuur is uitgereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002629
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel34g
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002629
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 34g
        hoofdstuk: VI
        afdeling: '4'
  - number: '13.4'
    text: |-
      In afwijking in zoverre van het eerste lid, onderdeel b, wordt de belasting ter zake van diensten als bedoeld in
      [artikel 4, tweede lid][ref1], verschuldigd op de laatste dag van het boekjaar waarin die diensten worden verricht.
      Diensten die op die dag nog niet zijn voltooid, worden geacht op die dag te zijn voltooid voorzover zij betrekking
      hebben op dat boekjaar. Indien het boekjaar langer is dan een jaar wordt de belasting verschuldigd op de laatste
      dag van het kalenderjaar waarin de diensten worden verricht met overeenkomstige toepassing van de tweede volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel4
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '4'
        hoofdstuk: II
        afdeling: '1'
  - number: '13.5'
    text: |-
      Voor de toepassing van het eerste lid worden de diensten waarvan de belasting op grond van
      [artikel 12, tweede lid][ref1], verschuldigd is door de afnemer van deze diensten en die doorlopend worden verricht
      gedurende een periode langer dan één jaar geacht bij de afloop van elk kalenderjaar te zijn voltooid zolang de
      dienstverrichting doorloopt en die geen aanleiding geven tot afrekeningen of betalingen in die periode.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel12
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '12'
        hoofdstuk: II
        afdeling: '4'
  - number: '13.6'
    text: |-
      De goederenleveringen die doorlopend worden verricht gedurende een periode langer dan een kalendermaand, waarbij
      de goederen onder de voorwaarden van de bij deze wet behorende [tabel II, onderdeel a, post 6][ref1], worden
      vervoerd naar een andere lidstaat, worden geacht bij de afloop van elke kalendermaand te zijn voltooid zolang de
      goederenlevering doorloopt.


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: '13.7'
    text: |-
      Goederenleveringen en diensten, andere dan die bedoeld in het vierde, vijfde en zesde lid, die gedurende een zekere
      periode doorlopend worden verricht, worden geacht ten minste eenmaal per jaar te zijn voltooid.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel13
  - number: 13a
    text: |-
      In afwijking in zoverre van [artikel 13][ref1] vindt het belastbare feit van de levering van goederen door een
      ondernemer die geacht wordt die goederen te hebben ontvangen en geleverd overeenkomstig [artikel 3c][ref2] en van
      de levering van goederen aan die ondernemer, plaats, en wordt de belasting verschuldigd, op het tijdstip waarop de
      betaling is aanvaard.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel3c
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '13'
        hoofdstuk: II
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 3c
        hoofdstuk: II
        afdeling: '1'
  - number: '14.1'
    text: De in een tijdvak verschuldigd geworden belasting moet op aangifte worden voldaan.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel14
  - number: '14.2'
    text: |-
      In afwijking in zover van het eerste lid wordt de belasting die verschuldigd is geworden door ondernemers als
      bedoeld in [artikel 7, zesde lid][ref1], niet voldaan over een tijdvak.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel7
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '7'
        hoofdstuk: II
        afdeling: 1c
  - number: '15.1'
    text: |-
      De in [artikel 2][ref1] bedoelde belasting welke de ondernemer in aftrek brengt, is:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel2
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '2'
        hoofdstuk: I
  - number: 15.1.a
    text: |-
      de belasting welke in het tijdvak van aangifte door andere ondernemers ter zake van door hen aan de ondernemer
      verrichte leveringen en verleende diensten in rekening is gebracht op een op de voorgeschreven wijze opgemaakte
      factuur;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel15
  - number: 15.1.b
    text: |-
      de belasting welke in het tijdvak van aangifte is verschuldigd geworden ter zake van door de ondernemer verrichte
      intracommunautaire verwervingen als bedoeld in [artikel 17a, eerste lid][ref1], mits de ondernemer in het bezit is
      van een op de voorgeschreven wijze opgemaakte factuur;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel17a
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 17a
        hoofdstuk: IIA
        afdeling: '1'
  - number: 15.1.c
    text: 'de belasting welke in het tijdvak van aangifte is verschuldigd geworden:'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel15
  - number: 15.1.c.1°
    text: |-
      ter zake van invoer van voor de ondernemer bestemde goederen, mits is voldaan aan bij ministeriële regeling te
      stellen voorwaarden;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel15
  - number: 15.1.c.2°
    text: |-
      op grond van [artikel 12, tweede tot en met vijfde lid][ref1], ter zake van aan de ondernemer verrichte leveringen
      en verleende diensten;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel12
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '12'
        hoofdstuk: II
        afdeling: '4'
  - number: 15.1.c.3°
    text: |-
      ter zake van verrichtingen als bedoeld in [artikel 4, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel4
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '4'
        hoofdstuk: II
        afdeling: '1'
  - number: 15.1.c.4°
    text: |-
      ter zake van handelingen en situaties als bedoeld in [artikel 17a, derde en vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel17a
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 17a
        hoofdstuk: IIA
        afdeling: '1'
  - number: 15.1.d
    text: |-
      de belasting die is begrepen in de aankoopprijs van een nieuw vervoermiddel dat met toepassing van onderdeel *a*,
      post 6, van de bij deze wet behorende tabel II, wordt geleverd door:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel15
  - number: 15.1.d.1°
    text: |-
      een in [artikel 7, zesde lid][ref1], bedoelde ondernemer; of


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel7
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '7'
        hoofdstuk: II
        afdeling: 1c
  - number: 15.1.d.2°
    text: een wederverkoper;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel15
  - number: '15.2'
    text: |-
      De ondernemer brengt eveneens in aftrek de belasting, bedoeld in het eerste lid, voorzover de goederen en diensten
      door de ondernemer worden gebruikt voor:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel15
  - number: 15.2.a
    text: |-
      handelingen door de als zodanig handelende ondernemer buiten Nederland verricht, waarvoor recht op aftrek zou
      ontstaan wanneer zij binnen Nederland zouden plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel15
  - number: 15.2.b
    text: |-
      handelingen die overeenkomstig de artikelen 143, onder f, g, g bis, h of i, 144 en 146 tot en met 153 van de BTW-
      richtlijn 2006 zijn vrijgesteld;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel15
  - number: 15.2.c
    text: |-
      handelingen als bedoeld in de [artikelen 11, eerste lid, onderdelen i, j en k][ref1], mits de ontvanger buiten de
      Unie gevestigd is of wanneer de handelingen rechtstreeks samenhangen met goederen die bestemd zijn om te worden
      uitgevoerd uit de Unie.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel11
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '11'
        hoofdstuk: II
        afdeling: '3'
  - number: '15.3'
    text: |-
      In afwijking in zoverre van het eerste lid wordt bij levering van een nieuw vervoermiddel door een in het eerste
      lid, onderdeel d, bedoelde ondernemer de in het eerste lid bedoelde aftrek beperkt tot de belasting die in de
      aankoopprijs is begrepen of die verschuldigd is geworden ter zake van de intracommunautaire verwerving of de
      invoer van het vervoermiddel. De aftrek bedraagt ten hoogste het bedrag van de belasting dat verschuldigd zou
      zijn indien op die levering het tarief van nihil niet van toepassing zou zijn. Het recht op aftrek ontstaat op het
      tijdstip waarop het vervoermiddel wordt geleverd. Bij ministeriële regeling worden nadere regels gesteld inzake de
      toepassing van dit lid en van het eerste lid, onderdeel d.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel15
  - number: '15.4'
    text: |-
      De aftrek van belasting vindt plaats overeenkomstig de bestemming van de goederen en diensten op het tijdstip
      waarop de belasting aan de ondernemer in rekening wordt gebracht dan wel op het tijdstip waarop de belasting wordt
      verschuldigd. Indien op het tijdstip waarop de ondernemer goederen en diensten gaat gebruiken, blijkt, dat de
      belasting ter zake voor een groter of kleiner gedeelte in aftrek is gebracht dan waartoe de ondernemer op grond van
      het gebruik is gerechtigd, wordt hij de te veel afgetrokken belasting op dat tijdstip verschuldigd. De verschuldigd
      geworden belasting wordt op de voet van [artikel 14][ref1] voldaan. De te weinig afgetrokken belasting wordt aan
      hem op zijn verzoek teruggegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel14
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '14'
        hoofdstuk: II
        afdeling: '4'
  - number: '15.5'
    text: |-
      Geen aftrek vindt plaats van belasting welke in rekening is gebracht ter zake van het verstrekken van spijzen
      en dranken voor gebruik ter plaatse binnen het kader van het hotel-, café-, restaurant-, pension- en aanverwant
      bedrijf aan personen die daar slechts voor een korte periode verblijf houden.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel15
  - number: '15.6'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld omtrent de aftrek van belasting, ingeval goederen en
      diensten door de ondernemer mede worden gebruikt anders dan voor belaste handelingen of anders dan voor de
      handelingen, bedoeld in het tweede lid. Daarbij wordt tevens rekening gehouden met wijzigingen in het gebruik van
      onroerende zaken, bedoeld in het eerste lid, laatste alinea. Voorts kan daarbij worden bepaald dat het afstoten van
      goederen welke de ondernemer in zijn bedrijf heeft gebruikt, buiten aanmerking wordt gelaten.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel15
  - number: '15.7'
    text: 'Een herziening van de aftrek vindt niet plaats:'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel15
  - number: 15.7.a
    text: in geval van naar behoren bewezen en aangetoonde vernietiging, verlies of diefstal van goederen;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel15
  - number: 15.7.b
    text: |-
      in geval van onttrekkingen van goederen voor het verstrekken van geschenken van geringe waarde en van monsters, als
      bedoeld in [artikel 3, achtste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel3
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '3'
        hoofdstuk: II
        afdeling: '1'
  - number: '16.1'
    text: |-
      Bij koninklijk besluit kan de in [artikel 15, eerste lid][ref1], bedoelde aftrek in bepaalde gevallen geheel of
      gedeeltelijk worden uitgesloten, zulks ten einde te voorkomen, dat op goederen en diensten, welke worden gebruikt
      voor het voeren van een zekere staat, voor het bevredigen van behoeften van anderen dan ondernemers of ten behoeve
      van prestaties als zijn bedoeld in [artikel 11][ref2], de belasting geheel of gedeeltelijk niet drukt.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel11
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '15'
        hoofdstuk: II
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '11'
        hoofdstuk: II
        afdeling: '3'
  - number: '16.2'
    text: |-
      Na het tot stand komen van een besluit, door Ons krachtens het eerste lid genomen, wordt onverwijld een voorstel
      van wet tot goedkeuring van dat besluit aan de Tweede Kamer der Staten-Generaal gezonden.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel16
  - number: '16.3'
    text: |-
      Indien het voorstel wordt ingetrokken of indien een der Kamers der Staten-Generaal tot het niet-aannemen van het
      voorstel besluit, wordt Ons besluit onverwijld ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel16
  - number: 16a
    text: |-
      Ter zake van prestaties als bedoeld in [artikel 3, derde lid, onderdelen a en c][ref1], en
      [artikel 4, tweede lid][ref2], wordt de belasting niet verschuldigd indien het prestaties betreft als bedoeld in
      het op [artikel 16, eerste lid][ref3], gebaseerde koninklijk besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel16
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '3'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '4'
        hoofdstuk: II
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002629
        artikel: '16'
        hoofdstuk: II
        afdeling: '4'
  - number: '17'
    text: |-
      Ingeval de voor aftrek in aanmerking komende belasting meer bedraagt dan de in het tijdvak verschuldigd geworden
      belasting, wordt het verschil aan de ondernemer op zijn verzoek terugbetaald.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel17
  - number: 17a.1
    text: |-
      Intracommunautaire verwerving van goederen is de verwerving van goederen ingevolge een levering van deze goederen
      door een als zodanig handelende ondernemer, welke goederen worden verzonden of vervoerd van een lidstaat naar een
      andere lidstaat.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel17a
  - number: 17a.2
    text: |-
      Wanneer door rechtspersonen, andere dan ondernemers, verworven goederen worden verzonden of vervoerd uit een
      derdelandsgebied of derde-land en door deze rechtspersonen worden ingevoerd in een andere lidstaat dan die van
      aankomst van de verzending of het vervoer, worden deze goederen geacht te zijn verzonden of vervoerd vanuit de
      lidstaat van invoer van de goederen.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel17a
  - number: 17a.3
    text: |-
      Met een intracommunautaire verwerving van goederen onder bezwarende titel als bedoeld in
      [artikel 1, onderdeel b][ref1], wordt gelijkgesteld het beschikken voor bedrijfsdoeleinden over een goed dat
      door of voor rekening van de ondernemer wordt verzonden of vervoerd uit een andere lidstaat waar het goed is
      vervaardigd, gewonnen, bewerkt, gekocht, onderworpen aan heffing van belasting ter zake van intracommunautaire
      verwerving, of door hem is ingevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel1
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '1'
        hoofdstuk: I
  - number: 17a.4
    text: |-
      Met een intracommunautaire verwerving van goederen onder bezwarende titel als bedoeld in
      [artikel 1, onderdeel b][ref1], wordt gelijkgesteld het komen binnen Nederland van goederen die zijn verzonden of
      vervoerd vanuit een andere lidstaat, zonder dat deze goederen aldaar onderworpen waren aan heffing van belasting,
      omdat zij aldaar ter beschikking hebben gestaan voor het gebruik in het kader van:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel1
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '1'
        hoofdstuk: I
  - number: 17a.4.a
    text: |-
      een defensie-inspanning ter uitvoering van een Unieoptreden in het kader van het gemeenschappelijk veiligheids- en
      defensiebeleid, bedoeld titel V, hoofdstuk 2, afdeling 2, van het Verdrag betreffende de Europese Unie;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel17a
  - number: 17a.4.b
    text: |-
      het Verdrag van Londen van 19 juni 1951 tussen de Staten, die partij zijn bij het Noord-Atlantisch Verdrag, nopens
      de rechtspositie van hun krijgsmachten (Trb. 1951, 114 en Trb. 1953, 10, Stb. 1953, 438);
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel17a
  - number: 17b.1
    text: |-
      De plaats waar een intracommunautaire verwerving wordt verricht, is de plaats van aankomst van de verzending of
      het vervoer.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel17b
  - number: 17b.2
    text: |-
      Onverminderd het bepaalde in het eerste lid wordt een intracommunautaire verwerving verricht in de lidstaat die
      aan de afnemer het btw-identificatienummer heeft toegekend waaronder de verwerving wordt verricht, voor zover de
      afnemer niet aantoont dat de belasting is geheven met toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel17b
  - number: 17b.3
    text: |-
      Het tweede lid is niet van toepassing en de intracommunautaire verwerving van goederen wordt geacht overeenkomstig
      het eerste lid aan de heffing te zijn onderworpen indien:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel17b
  - number: 17b.3.a
    text: |-
      de afnemer aantoont de verwerving te hebben verricht met het oog op een daaropvolgende levering binnen het
      grondgebied van de overeenkomstig het eerste lid bepaalde lidstaat, waarvoor degene voor wie deze levering bestemd
      is, overeenkomstig artikel 197 van BTW-richtlijn 2006 is aangewezen als de tot voldoening van de belasting gehouden
      persoon; en
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel17b
  - number: 17b.3.b
    text: |-
      de afnemer heeft voldaan aan het bepaalde in [artikel 37a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel37a
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 37a
        hoofdstuk: VI
        afdeling: '4'
  - number: 17c.1
    text: De belasting wordt berekend over de vergoeding.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel17c
  - number: 17c.2
    text: |-
      Met betrekking tot intracommunautaire verwervingen waarbij de ondernemer die de goederen levert verplicht is
      ter zake van die levering een factuur uit te reiken is [artikel 8, tweede, vijfde en zesde lid][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel8
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
  - number: 17c.3
    text: |-
      Met betrekking tot hetgeen op de voet van [artikel 17a, derde en vierde lid][ref1], wordt gelijkgesteld met een
      intracommunautaire verwerving van goederen onder bezwarende titel als bedoeld in [artikel 1, onderdeel b][ref2], is
      [artikel 8, derde en zesde lid][ref3], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel17a
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel8
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 17a
        hoofdstuk: IIA
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '1'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0002629
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
  - number: 17c.4
    text: |-
      In afwijking van het eerste lid wordt met betrekking tot de intracommunautaire verwervingen van accijnsgoederen
      waarbij de voor die goederen in Nederland verschuldigde of voldane accijns niet in de vergoeding is begrepen, de
      belasting berekend over de vergoeding vermeerderd met die voor de goederen verschuldigde of voldane accijns.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel17c
  - number: 17c.5
    text: |-
      Het vierde lid is van overeenkomstige toepassing met betrekking tot de intracommunautaire verwervingen van
      alcoholvrije dranken als bedoeld in [artikel 6 van de Wet op de verbruiksbelasting van alcoholvrije dranken][ref1],
      waarbij de voor die goederen in Nederland op de voet van die wet verschuldigde of voldane belasting niet in de
      vergoeding is begrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0005802#Artikel6
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0005802
        artikel: '6'
  - number: 17d
    text: |-
      [Artikel 9][ref1] is van overeenkomstige toepassing, met dien verstande dat het tarief van nihil alleen toepassing
      kan vinden ten aanzien van intracommunautaire verwervingen van goederen, genoemd in de bij deze wet behorende tabel
      II, onderdeel *a*, posten 1, 3, 4 en 5.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel9
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel17d
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '9'
        hoofdstuk: II
        afdeling: '2'
  - number: 17e
    text: |-
      Onder bij ministeriële regeling te stellen voorwaarden en beperkingen wordt vrijstelling van belasting verleend
      voor de intracommunautaire verwervingen van goederen waarvoor:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel17e
  - number: 17e.a
    text: de levering in Nederland in elk geval is vrijgesteld;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel17e
  - number: 17e.b
    text: bij invoer in elk geval een vrijstelling van toepassing zou zijn;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel17e
  - number: 17e.c
    text: in elk geval recht zou bestaan op volledige teruggaaf daarvan.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel17e
  - number: 17f
    text: De belasting wordt geheven van degene die de intracommunautaire verwerving verricht.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel17f
  - number: 17g.1
    text: |-
      De belasting wordt verschuldigd op het tijdstip van uitreiking van de factuur, of bij het verstrijken van de in
      [artikel 34g, eerste volzin][ref1], bedoelde termijn indien er vóór die datum geen factuur is uitgereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel34g
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel17g
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 34g
        hoofdstuk: VI
        afdeling: '4'
  - number: 17g.2
    text: |-
      Een intracommunautaire verwerving van een goed wordt verricht op het tijdstip waarop de aan de verwerving ten
      grondslag liggende levering van dat goed wordt verricht.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel17g
  - number: 17h.1
    text: De in een tijdvak verschuldigd geworden belasting moet op aangifte worden voldaan.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel17h
  - number: 17h.2
    text: |-
      In afwijking in zover van het eerste lid wordt de belasting die verschuldigd is geworden ter zake van
      intracommunautaire verwervingen van nieuwe vervoermiddelen door natuurlijke personen en rechtspersonen aan wie geen
      btw-identificatienummer is toegekend, niet voldaan over een tijdvak.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel17h
  - number: 17h.3
    text: |-
      Ingeval naast de belasting die verschuldigd is ter zake van de in het tweede lid bedoelde intracommunautaire
      verwerving van een nieuw vervoermiddel, tevens belasting verschuldigd is geworden op de voet van de
      [Wet op de belasting van personenauto’s en motorrijwielen 1992][ref1], is, in afwijking van het
      [eerste en het tweede lid, artikel 6 van die wet][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005806
      [ref2]: https://wetten.overheid.nl/BWBR0005806#Artikel6
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel17h
    references:
      - id: ref1
        bwb_id: BWBR0005806
      - id: ref2
        bwb_id: BWBR0005806
        artikel: '6'
  - number: '18.1'
    text: 'Invoer van goederen is:'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel18
  - number: 18.1.a
    text: |-
      het brengen in Nederland van goederen die niet voldoen aan de voorwaarden van de artikelen 28 en 29 van het Verdrag
      betreffende de werking van de Europese Unie;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel18
  - number: 18.1.b
    text: het brengen in Nederland vanuit een derdelandsgebied van andere dan de in onderdeel a bedoelde goederen;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel18
  - number: 18.1.c
    text: het in Nederland beëindigen van, dan wel het in Nederland onttrekken van goederen aan een douaneregime;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel18
  - number: 18.1.d
    text: de bevoorrading in Nederland van vervoermiddelen met goederen welke niet in het vrije verkeer zijn.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel18
  - number: '18.2'
    text: 'Voor de toepassing van dit artikel wordt verstaan onder douaneregime:'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel18
  - number: 18.2.a
    text: tijdelijke opslag als bedoeld in artikel 5, onderdeel 17, van het Douanewetboek van de Unie;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel18
  - number: 18.2.b
    text: douanevervoer als bedoeld in de artikelen 226 en 234 van het Douanewetboek van de Unie;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel18
  - number: 18.2.c
    text: douane-entrepot als bedoeld in artikel 240 van het Douanewetboek van de Unie;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel18
  - number: 18.2.d
    text: |-
      tijdelijke invoer als bedoeld in artikel 250 van het Douanewetboek van de Unie, voor zover het betreft een
      volledige vrijstelling van rechten bij invoer;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel18
  - number: 18.2.e
    text: actieve veredeling als bedoeld in artikel 256 van het Douanewetboek van de Unie; en
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel18
  - number: 18.2.f
    text: wederuitvoer als bedoeld in artikel 270 van het Douanewetboek van de Unie.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel18
  - number: '18.3'
    text: |-
      Als invoer wordt niet aangemerkt het in Nederland brengen van goederen als bedoeld in het eerste lid, onderdelen
      a en b, waarop een douaneregime van toepassing is dan wel waarop aansluitend aan het in Nederland brengen een
      douaneregime van toepassing wordt. Evenmin wordt als invoer aangemerkt het in Nederland beëindigen van een
      douaneregime voor zover dit regime wordt opgevolgd door een douaneregime.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel18
  - number: '18.4'
    text: |-
      Als invoer wordt voorts niet aangemerkt het in Nederland beëindigen van, dan wel het in Nederland onttrekken van
      goederen aan de regeling intern douanevervoer, bedoeld in artikel 227 van het Douanewetboek van de Unie, indien het
      vervoer aanvangt en eindigt in de Unie.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel18
  - number: '18.5'
    text: Bij ministeriële regeling kunnen regels worden gesteld inzake de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel18
  - number: '19.1'
    text: De belasting wordt berekend over de douanewaarde.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel19
  - number: '19.2'
    text: 'In de douanewaarde zijn begrepen:'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel19
  - number: 19.2.a
    text: |-
      de rechten bij invoer, belastingen en heffingen, met uitzondering van de ter zake van de invoer in Nederland
      verschuldigde omzetbelasting;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel19
  - number: 19.2.b
    text: de bijkomende kosten, zoals kosten van commissie, verpakking, vervoer en verzekering tot de plaats van bestemming.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel19
  - number: '20.1'
    text: De belasting bedraagt 21 percent.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel20
  - number: '20.2'
    text: 'In afwijking van het eerste lid bedraagt de belasting:'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel20
  - number: 20.2.a
    text: |-
      9 percent voor de invoer van goederen, genoemd in de bij deze wet behorende [tabel I][ref1], onderdeel *a*;


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: 20.2.b
    text: |-
      nihil voor de invoer van goederen, genoemd in de bij deze wet behorende [tabel II][ref1], onderdeel *a*, posten 3,
      4 en 5, mits is voldaan aan bij algemene maatregel van bestuur vast te stellen voorwaarden;


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: 20.2.c
    text: |-
      nihil voor de invoer van gas via een aardgassysteem of een op een dergelijk systeem aangesloten net, van gas dat
      van een gastransportschip in een aardgassysteem of een upstreampijpleidingnet wordt ingebracht, van warmte of koude
      via warmte- of koudenetten of van elektriciteit, mits de toepasselijkheid van dat tarief uit boeken en bescheiden
      blijkt.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel20
  - number: '21'
    text: |-
      Bij ministeriële regeling wordt, onder daarbij te stellen voorwaarden en beperkingen, vrijstelling van belasting
      verleend voor:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel21
  - number: 21.a
    text: |-
      de invoer van goederen waarvoor aanspraak op vrijstelling van douanerechten bestaat, met uitzondering van goederen
      die worden aangemerkt als afstandsverkopen van uit een derdelandsgebied of een derde-land ingevoerde goederen;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel21
  - number: 21.b
    text: |-
      de invoer van goederen in de zin van [artikel 18, eerste lid, onderdeel b][ref1], indien aanspraak op
      vrijstelling van rechten bij invoer zou bestaan indien de goederen zouden zijn ingevoerd in de zin van
      [artikel 18, eerste lid, onderdeel a][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel18
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '18'
        hoofdstuk: III
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '18'
        hoofdstuk: III
        afdeling: '1'
  - number: 21.c
    text: de invoer van goederen waarvan de levering in Nederland in elk geval is vrijgesteld;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel21
  - number: 21.d
    text: |-
      de invoer van goederen die worden verzonden of vervoerd naar een andere lidstaat wanneer degene die de goederen
      heeft ingevoerd deze levert met toepassing van de bij deze wet behorende [tabel II, onderdeel a, post 6][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: 21.e
    text: |-
      de invoer van goederen wanneer de btw moet worden aangegeven in het kader van de bijzondere regeling, bedoeld
      in [hoofdstuk V, afdeling 7, paragraaf 4][ref1], en wanneer uiterlijk bij de indiening van de invoeraangifte
      het individuele btw-identificatienummer, bedoeld in [artikel 28tf][ref2], aan het bevoegde douanekantoor in de
      lidstaat van invoer is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#HoofdstukV
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel28tf
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002629
        hoofdstuk: V
        paragraaf: '4'
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 28tf
        hoofdstuk: V
        paragraaf: '4'
        afdeling: '7'
  - number: 21a
    text: |-
      Voor de toepassing van [artikel 21b][ref1] wordt verstaan onder:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel21b
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 21b
        hoofdstuk: III
        afdeling: '3'
  - number: 21a.a
    text: |-
      persoonlijke bagage van reizigers: bagage die de reiziger kan aangeven bij de douaneautoriteiten, alsmede de
      bagage die hij later aangeeft, mits hij aannemelijk kan maken dat deze bij zijn vertrek als begeleide bagage is
      ingeschreven bij de maatschappij die zijn vervoer heeft verzorgd, met dien verstande dat brandstof, andere dan die
      zich in het normale reservoir van een voertuig bevindt of andere dan een maximale hoeveelheid van tien liter per
      voertuig in een draagbaar reservoir, geen persoonlijke bagage is;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel21a
  - number: 21a.b
    text: |-
      invoer die geen handelskarakter heeft: invoer die een incidenteel karakter heeft, waaraan blijkens de aard of de
      hoeveelheid van de goederen geen commerciële overwegingen ten grondslag liggen en die uitsluitend betrekking heeft
      op goederen, bestemd voor persoonlijk gebruik van de reizigers dan wel voor het gebruik door hun gezinsleden of
      bestemd om als geschenk te worden aangeboden;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel21a
  - number: 21a.c
    text: 'cigarillo’s: sigaren die per stuk niet meer wegen dan drie gram;'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel21a
  - number: 21a.d
    text: |-
      particuliere plezierluchtvaart of plezierzeevaart: het gebruik van een luchtvaartuig of een zeewaardig vaartuig
      door de eigenaar daarvan of door de natuurlijke persoon of rechtspersoon die het gebruiksrecht daarvan geniet
      door huur of anderszins, voor andere dan commerciële doeleinden en met name voor andere doeleinden dan voor het
      vervoer van personen of goederen of voor het verrichten van diensten onder bezwarende titel, dan wel ten behoeve
      van overheidsinstanties.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel21a
  - number: 21b.1
    text: |-
      Voor de invoer van goederen wordt vrijstelling verleend indien deze invoer geen handelskarakter heeft en deze
      goederen deel uitmaken van de persoonlijke bagage van reizigers komende uit derdelandsgebieden of derde-landen. De
      vrijstelling wordt verleend voor:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel21b
  - number: 21b.1.a
    text: |-
      goederen, niet zijnde goederen bedoeld in de onderdelen b tot en met e, waarvan de totale waarde niet meer dan
      € 430 per reiziger bedraagt. Voor de toepassing van dit onderdeel wordt de waarde van een afzonderlijk goed niet
      gesplitst;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel21b
  - number: 21b.1.b
    text: |-
      de volgende tabaksproducten per reiziger tot een maximum van: - 200 sigaretten;
        - 100 cigarillo’s;
        - 50 sigaren;
        - 250 gram rooktabak; of
        - een proportioneel assortiment van deze producten;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel21b
  - number: 21b.1.c
    text: |-
      alcohol en alcoholhoudende dranken, niet zijnde niet-mousserende wijnen en bier, per reiziger tot een maximum van:
        - 1 liter alcohol en alcoholhoudende dranken met een alcoholgehalte van meer dan 22% vol. of niet gedenatureerde
      ethylalcohol van 80% vol. en hoger;
        - 2 liter alcohol en alcoholhoudende dranken met een alcoholgehalte van maximaal 22% vol.; of een proportioneel
      assortiment van deze producten;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel21b
  - number: 21b.1.d
    text: een maximale hoeveelheid van 4 liter niet-mousserende wijn en 16 liter bier per reiziger;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel21b
  - number: 21b.1.e
    text: |-
      brandstof die zich in het normale reservoir van een voertuig bevindt, alsmede per voertuig een maximale hoeveelheid
      van tien liter brandstof in een draagbaar reservoir.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel21b
  - number: 21b.2
    text: |-
      Het maximumbedrag, bedoeld in het eerste lid, onderdeel a, wordt voor reizigers in de particuliere
      plezierluchtvaart of plezierzeevaart beperkt tot € 300.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel21b
  - number: 21b.3
    text: |-
      De vrijstelling, bedoeld in het eerste lid, onderdelen b, c en d, geldt niet voor reizigers jonger dan zeventien
      jaar.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel21b
  - number: 21b.4
    text: |-
      De maximale hoeveelheden, bedoeld in het eerste lid, onderdelen b, c en d, worden voor personeel van
      vervoermiddelen die worden gebruikt in het verkeer tussen de Unie en derdelandsgebieden of derde-landen beperkt tot
      de volgende hoeveelheden:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel21b
  - number: 21b.4.a
    text: |-
      voor de toepassing van het eerste lid, onderdeel b: - 40 sigaretten;
        - 20 cigarillo’s;
        - 10 sigaren;
        - 50 gram rooktabak;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel21b
  - number: 21b.4.b
    text: |-
      voor de toepassing van het eerste lid, onderdeel c: - 1 liter alcohol en alcoholhoudende dranken met een
      alcoholgehalte van meer dan 22% vol. of niet gedenatureerde ethylalcohol van 80% vol. en hoger;
        - 1 liter alcohol en alcoholhoudende dranken met een alcoholgehalte van maximaal 22% vol.;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel21b
  - number: 21b.4.c
    text: 'voor de toepassing van het eerste lid, onderdeel d: 2 liter niet-mousserende wijn en 8 liter bier.'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel21b
  - number: '22.1'
    text: |-
      Ter zake van de belasting bij invoer zijn de wettelijke bepalingen, bedoeld in
      [artikel 1:1, eerste en tweede lid, van de Algemene douanewet][ref1], met uitzondering van het bepaalde in artikel
      88 van de Gedelegeerde Verordening Douanewetboek van de Unie, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
  - number: '22.2'
    text: |-
      Bij ministeriële regeling kan, onder daarbij te stellen voorwaarden en beperkingen, kwijtschelding of teruggaaf
      van bij invoer verschuldigde belasting worden verleend in de gevallen waarin aanspraak op kwijtschelding of
      terugbetaling van rechten bij invoer bestaat of zou bestaan indien de goederen in het douanegebied van de Unie,
      bedoeld in artikel 4 van het Douanewetboek van de Unie zouden zijn ingevoerd of, in andere gevallen, om redenen
      van billijkheid.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel22
  - number: '22.3'
    text: |-
      Belasting waarvan krachtens het tweede lid kwijtschelding of teruggaaf wordt verleend, komt niet voor aftrek op
      de voet van [artikel 15][ref1] in aanmerking. Heeft de aftrek reeds plaatsgevonden, dan wordt de ondernemer die de
      aftrek heeft genoten het in aftrek gebrachte bedrag als belasting verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '15'
        hoofdstuk: II
        afdeling: '4'
  - number: 22a.1
    text: |-
      Op goederen als bedoeld in [artikel 18, eerste lid, onderdeel b][ref1] , die Nederland binnenkomen uit een
      derdelandsgebied dat deel uitmaakt van het douanegebied van de Unie, bedoeld in artikel 4 van het Douanewetboek van
      de Unie zijn de volgende bepalingen van toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel18
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '18'
        hoofdstuk: III
        afdeling: '1'
  - number: 22a.1.a
    text: |-
      de formaliteiten betreffende het in Nederland brengen zijn dezelfde als zijn voorzien in de wettelijke bepalingen,
      bedoeld in [artikel 1:1, eerste en tweede lid, van de Algemene douanewet][ref1], ten aanzien van goederen die in
      het vrije verkeer worden gebracht in de zin van die wettelijke bepalingen;


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
  - number: 22a.1.b
    text: |-
      indien de plaats van aankomst van de verzending of het vervoer van de goederen zich buiten de lidstaat van
      binnenkomen in de Unie bevindt, zijn de goederen binnen de Unie in het verkeer onder de regeling intern
      douanevervoer als bedoeld in [artikel 18, vierde lid][ref1], indien de goederen bij het binnenkomen in de Unie
      onder die regeling zijn gebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel18
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '18'
        hoofdstuk: III
        afdeling: '1'
  - number: 22a.1.c
    text: |-
      indien op de goederen op het tijdstip van binnenkomen in de Unie een van de douaneregimes als bedoeld in
      [artikel 18, tweede lid][ref1], zou kunnen worden toegepast indien zij zouden zijn ingevoerd in de zin van
      [artikel 18, eerste lid, onderdeel a][ref2], kan dit douaneregime ook op deze goederen worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel18
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '18'
        hoofdstuk: III
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '18'
        hoofdstuk: III
        afdeling: '1'
  - number: 22a.2
    text: |-
      Op goederen, andere dan bedoeld in [artikel 18, eerste lid, onderdeel a][ref1] , die worden verzonden of vervoerd
      uit de Unie naar een derdelandsgebied dat deel uitmaakt van het douanegebied van de Unie als bedoeld in het eerste
      lid, aanhef, zijn de volgende bepalingen van toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel18
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '18'
        hoofdstuk: III
        afdeling: '1'
  - number: 22a.2.a
    text: |-
      de formaliteiten betreffende de verzending of het vervoer naar een derdelandsgebied zijn dezelfde als zijn voorzien
      in de wettelijke bepalingen, bedoeld in [artikel 1:1, eerste en tweede lid, van de Algemene douanewet][ref1], ten
      aanzien van goederen die worden uitgevoerd in de zin van die wettelijke bepalingen;


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
  - number: 22a.2.b
    text: |-
      op goederen die tijdelijk zijn uitgevoerd uit de Unie met het oog op hun wederinvoer zijn de wettelijke bepalingen,
      bedoeld in [artikel 1:1, eerste en tweede lid, van de Algemene douanewet][ref1], ter zake van de uitvoer van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
  - number: '23.1'
    text: |-
      In afwijking van [artikel 22][ref1] wordt de belasting ter zake van de invoer van goederen, bestemd voor aangewezen
      ondernemers en lichamen in de zin van de [Algemene wet inzake rijksbelastingen][ref2], andere dan ondernemers,
      geheven van die ondernemers en lichamen. Bij ministeriële regeling worden onder daarbij te stellen voorwaarden
      regels gesteld omtrent de aanwijzing. Daarbij kan worden bepaald dat op verzoek een aanwijzing kan geschieden door
      de inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '22'
        hoofdstuk: III
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0002320
  - number: '23.2'
    text: De belasting wordt verschuldigd op het tijdstip waarop de goederen worden ingevoerd.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel23
  - number: '23.3'
    text: De in een tijdvak verschuldigd geworden belasting moet op aangifte worden voldaan.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel23
  - number: '23.4'
    text: |-
      [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] is van toepassing op verzoeken tot aanwijzing op grond
      van bepalingen krachtens het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '23.5'
    text: |-
      Dit artikel is niet van toepassing voor ondernemers die de vrijstelling van belasting bedoeld in
      [artikel 25, eerste lid][ref1], toepassen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel25
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '25'
        hoofdstuk: V
        afdeling: '1'
  - number: '24.1'
    text: |-
      Aan lichamen in de zin van de [Algemene wet inzake rijksbelastingen][ref1], andere dan ondernemers, die goederen
      in ongebruikte staat uitvoeren uit de Unie of plaatsen onder de regeling douane-entrepot op basis van artikel 237,
      tweede lid, van het Douanewetboek van de Unie in het kader van hun menslievende, liefdadige of opvoedkundige werk
      buiten de Unie, wordt op verzoek teruggaaf verleend van de voor die goederen betaalde belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: '24.2'
    text: |-
      Ten behoeve van natuurlijke personen die, anders dan als ondernemer, goederen uitvoeren uit de Unie, kan op bij
      ministeriële regeling te bepalen wijze en onder daarbij te stellen voorwaarden en beperkingen ontheffing worden
      verleend van de belasting die is verschuldigd ter zake van de levering van die goederen.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel24
  - number: '25.1'
    text: |-
      Een ondernemer die in Nederland is gevestigd of aldaar een vaste inrichting heeft en van wie de omzet in een
      kalenderjaar in Nederland niet meer bedraagt dan € 20.000 kan kiezen voor toepassing van vrijstelling van
      belasting ter zake van door hem in dat en volgende kalenderjaren verrichte leveringen van goederen en diensten.
      De vrijstelling is niet van toepassing op leveringen van nieuwe vervoermiddelen die door of voor rekening van
      de verkoper of afnemer worden verzonden of vervoerd naar een plaats in een andere lidstaat en op de levering van
      onroerende zaken en rechten waaraan deze zijn onderworpen die de ondernemer in zijn bedrijf heeft gebruikt.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel25
  - number: '25.2'
    text: |-
      De omzet, bedoeld in het eerste lid, wordt gevormd door de som van de vergoedingen voor de door de ondernemer
      verrichte leveringen van goederen en diensten:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel25
  - number: 25.2.a
    text: voor zover deze zonder toepassing van het eerste lid belast zouden zijn in Nederland;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel25
  - number: 25.2.b
    text: |-
      die in Nederland zijn vrijgesteld bij of krachtens [artikel 11, eerste lid, onderdelen a, b, i en j][ref1],
      en verzekeringsdiensten, tenzij die leveringen van goederen en diensten met andere handelingen samenhangende
      handelingen zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel11
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '11'
        hoofdstuk: II
        afdeling: '3'
  - number: 25.2.c
    text: |-
      waarvoor aan de afnemer teruggaaf of ontheffing wordt verleend op de voet van
      [artikel 24, eerste of tweede lid][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel24
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '24'
        hoofdstuk: IV
  - number: 25.2.d
    text: |-
      waarvoor bij of krachtens [artikel 39 van de Algemene wet inzake rijksbelastingen][ref1] aan de afnemer
      vrijstelling van omzetbelasting wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel39
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '39'
  - number: '25.3'
    text: |-
      In afwijking van het tweede lid wordt bij de vaststelling van de omzet niet in aanmerking genomen de vergoeding
      voor de levering van door de ondernemer in zijn bedrijf gebruikte:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel25
  - number: 25.3.a
    text: onroerende zaken en rechten waaraan deze zijn onderworpen;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel25
  - number: 25.3.b
    text: |-
      roerende zaken waarop de ondernemer voor de inkomstenbelasting of de vennootschapsbelasting afschrijft of waarop
      hij zou kunnen afschrijven indien hij aan een zodanige belasting zou zijn onderworpen.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel25
  - number: '25.4'
    text: |-
      De ondernemer die de vrijstelling, bedoeld in het eerste lid, toepast, heeft geen recht op aftrek van belasting als
      bedoeld in [artikel 2][ref1] en mag op de factuur op geen enkele wijze melding maken van omzetbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel2
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '2'
        hoofdstuk: I
  - number: '25.5'
    text: |-
      De ondernemer die de vrijstelling, bedoeld in het eerste lid, toepast, is ontheven van verplichtingen, opgelegd
      bij of krachtens de [artikelen 34][ref1], [34c tot en met 35b][ref2] en [37a][ref3]. De ontheffing geldt niet met
      betrekking tot de aan deze ondernemer verrichte leveringen van goederen en diensten, bedoeld in:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel37a
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '34'
        hoofdstuk: VI
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '35'
        hoofdstuk: VI
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0002629
        artikel: 37a
        hoofdstuk: VI
        afdeling: '4'
  - number: 25.5.a
    text: |-
      [artikel 12, tweede, derde en vijfde lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel12
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '12'
        hoofdstuk: II
        afdeling: '4'
  - number: 25.5.b
    text: |-
      [artikel 17f][ref1], tenzij het een verworven goed betreft als bedoeld in
      [artikel 1a, eerste lid, onderdeel a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel17f
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel1a
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 17f
        hoofdstuk: IIA
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 1a
        hoofdstuk: I
  - number: '25.6'
    text: |-
      Indien de ondernemer kiest voor de toepassing van de vrijstelling, bedoeld in het eerste lid, dient deze ondernemer
      hiervan melding te doen uiterlijk vier weken voorafgaand aan het belastingtijdvak waarin de vrijstelling toepassing
      vindt op een door de inspecteur voorgeschreven wijze. De inspecteur kan bij voor bezwaar vatbare beschikking
      beslissen dat de ondernemer niet in aanmerking komt voor toepassing van de vrijstelling, indien aannemelijk is dat
      niet zal worden voldaan aan de gestelde voorwaarden voor de toepassing van de vrijstelling.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel25
  - number: '25.7'
    text: |-
      De toepassing van de vrijstelling, bedoeld in het eerste lid, geldt tot wederopzegging door de ondernemer doch ten
      minste voor drie jaren na aanvang van de toepassing van de vrijstelling. De ondernemer kan pas drie jaren na die
      wederopzegging opnieuw kiezen voor de toepassing van de vrijstelling.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel25
  - number: '25.8'
    text: |-
      Bij overschrijding van de omzetdrempel, genoemd in het eerste lid, gedurende een kalenderjaar is de vrijstelling
      niet van toepassing op de levering van het goed of de dienst waardoor die overschrijding tot stand komt en op alle
      daaropvolgende leveringen van goederen en diensten. De ondernemer kan pas drie jaren na die overschrijding van de
      omzetdrempel opnieuw kiezen voor de toepassing van de vrijstelling.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel25
  - number: '25.9'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld inzake de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel25
  - number: '26'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld volgens welke daarbij aangewezen ondernemers die niet aan
      ondernemers plegen te leveren of diensten plegen te bewijzen, de belasting ter zake van leveringen en diensten
      worden verschuldigd op het tijdstip waarop de vergoeding wordt voldaan; alsdan wordt de belasting berekend over de
      voldane vergoeding.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel26
  - number: 28a
    text: |-
      De heffing van omzetbelasting ter zake van de intracommunautaire verwerving van accijnsgoederen, andere dan
      tabaksprodukten, geschiedt met overeenkomstige toepassing van de voor de accijns geldende regels, indien de
      verwerving wordt verricht door ondernemers of rechtspersonen, andere dan ondernemers, waarvoor [artikel 1][ref1],
      toepassing vindt ter zake van intracommunautaire verwervingen van goederen, andere dan nieuwe vervoermiddelen en
      accijnsgoederen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel1a
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 1a
        hoofdstuk: I
  - number: 28b.1
    text: |-
      Ingeval een wederverkoper gebruikte goederen, kunstvoorwerpen, voorwerpen voor verzamelingen of antiquiteiten
      levert, wordt, in afwijking van [artikel 8, eerste lid][ref1], de belasting berekend over de winstmarge. De
      winstmarge is het verschil tussen de vergoeding en hetgeen ter zake van de levering van een dergelijk goed aan de
      wederverkoper door hem is of moet worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel8
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
  - number: 28b.2
    text: 'Het eerste lid is slechts van toepassing indien het goed aan de wederverkoper is geleverd door:'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28b
  - number: 28b.2.a
    text: een ander dan een ondernemer;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28b
  - number: 28b.2.b
    text: |-
      een ondernemer, met toepassing van [artikel 11, eerste lid, onderdeel r][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel11
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '11'
        hoofdstuk: II
        afdeling: '3'
  - number: 28b.2.c
    text: |-
      een ondernemer die de vrijstelling, bedoeld in [artikel 25, eerste lid][ref1], toepast, mits het een
      in zijn bedrijf gebruikte roerende zaak betreft waarop de ondernemer voor de inkomstenbelasting of de
      vennootschapsbelasting afschrijft of waarop hij zou kunnen afschrijven indien hij aan een zodanige belasting zou
      zijn onderworpen;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel25
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '25'
        hoofdstuk: V
        afdeling: '1'
  - number: 28b.2.d
    text: een andere wederverkoper, met toepassing van het eerste lid; of
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28b
  - number: 28b.2.e
    text: |-
      een ondernemer of een wederverkoper uit een andere lidstaat, mits het een levering is als bedoeld in artikel 314,
      onder b, c of d, van de BTW-richtlijn 2006.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28b
  - number: 28c.1
    text: |-
      Op verzoek van de wederverkoper is [artikel 28b, eerste lid][ref1], van overeenkomstige toepassing op de leveringen
      van:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28b
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28c
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28b
        hoofdstuk: V
        afdeling: '5'
  - number: 28c.1.a
    text: |-
      kunstvoorwerpen die hem zijn geleverd met toepassing van de bij deze wet behorende [tabel I][ref1], onderdeel *a*,
      post 29, onderdeel b;


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28c
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: 28c.1.b
    text: |-
      kunstvoorwerpen, voorwerpen voor verzamelingen en antiquiteiten die hij zelf heeft ingevoerd, met dien verstande
      dat alsdan de winstmarge het verschil is tussen de vergoeding en de douanewaarde vermeerderd met de ter zake van de
      invoer in Nederland verschuldigde omzetbelasting.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28c
  - number: 28c.2
    text: |-
      De inspecteur beslist op het verzoek bij voor bezwaar vatbare beschikking. Bij inwilliging van het verzoek geldt
      zulks tot wederopzegging door belanghebbende doch ten minste voor twee kalenderjaren. Een hernieuwd verzoek kan
      eerst twee jaren na die wederopzegging worden ingewilligd.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28c
  - number: 28d.1
    text: |-
      In bij ministeriële regeling aan te wijzen gevallen wordt, in afwijking in zoverre van de [artikelen 28b][ref1] en
      [28c][ref2], ter zake van leveringen van goederen waarop een zelfde tarief wordt toegepast, de belasting berekend
      over de winstmarge per tijdvak van aangifte. Deze winstmarge is het verschil tussen de som van de vergoedingen ter
      zake van die leveringen in dat tijdvak en de som van hetgeen in dat tijdvak door de wederverkoper is of moet worden
      voldaan ter zake van in [artikel 28b, tweede lid][ref3], en [28c, eerste lid][ref4], bedoelde leveringen of invoer
      van dergelijke goederen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28b
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel28c
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel28b
      [ref4]: https://wetten.overheid.nl/BWBR0002629#Artikel28c
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28d
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28b
        hoofdstuk: V
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 28c
        hoofdstuk: V
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0002629
        artikel: 28b
        hoofdstuk: V
        afdeling: '5'
      - id: ref4
        bwb_id: BWBR0002629
        artikel: 28c
        hoofdstuk: V
        afdeling: '5'
  - number: 28d.2
    text: |-
      [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] is van toepassing op verzoeken op grond van bepalingen
      krachtens het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28d
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 28e
    text: |-
      In afwijking van [artikel 15][ref1] vindt geen aftrek plaats:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28e
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '15'
        hoofdstuk: II
        afdeling: '4'
  - number: 28e.a
    text: |-
      ingeval de [artikelen 28b][ref1], [28c][ref2] of [28d][ref3] toepassing vinden, van de belasting welke begrepen is
      in het door de wederverkoper in rekening gebrachte bedrag; en


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28b
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel28c
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel28d
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28e
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28b
        hoofdstuk: V
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 28c
        hoofdstuk: V
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0002629
        artikel: 28d
        hoofdstuk: V
        afdeling: '5'
  - number: 28e.b
    text: |-
      ingeval [artikel 28c][ref1] toepassing vindt, van de belasting welke aan de wederverkoper in rekening is gebracht
      ter zake van de aan hem verrichte levering als bedoeld in het eerste lid, onderdeel *a*, van dat artikel, of van
      de belasting welke de wederverkoper verschuldigd is geworden ter zake van de invoer als bedoeld in het eerste lid,
      onderdeel *b*, van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28c
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28e
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28c
        hoofdstuk: V
        afdeling: '5'
  - number: 28f.1
    text: |-
      In afwijking van de [artikelen 28b][ref1] en [28c][ref2] is de wederverkoper ter zake van elk van zijn leveringen
      die voor toepassing van die artikelen in aanmerking komen, gerechtigd de belasting te berekenen overeenkomstig
      [artikel 8, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28b
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel28c
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel8
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28f
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28b
        hoofdstuk: V
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 28c
        hoofdstuk: V
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0002629
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
  - number: 28f.2
    text: |-
      Ingeval het eerste lid toepassing vindt, vindt aftrek plaats van de belasting die ingevolge
      [artikel 28e, onderdeel b][ref1], niet in aftrek is gebracht. Het recht op aftrek ontstaat op het tijdstip waarop
      de belasting verschuldigd wordt ter zake van de levering door de wederverkoper.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28e
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28f
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28e
        hoofdstuk: V
        afdeling: '5'
  - number: 28g
    text: |-
      [Artikel 12, derde lid][ref1], is niet van toepassing ten aanzien van een wederverkoper die niet in Nederland woont
      of is gevestigd en aldaar geen vaste inrichting heeft, die goederen levert met toepassing van [artikel 28b][ref2],
      [28c][ref3] of [28d][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel28b
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel28c
      [ref4]: https://wetten.overheid.nl/BWBR0002629#Artikel28d
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28g
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '12'
        hoofdstuk: II
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 28b
        hoofdstuk: V
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0002629
        artikel: 28c
        hoofdstuk: V
        afdeling: '5'
      - id: ref4
        bwb_id: BWBR0002629
        artikel: 28d
        hoofdstuk: V
        afdeling: '5'
  - number: 28h.1
    text: |-
      Ingeval de wederverkoper goederen levert met toepassing van [artikel 28b][ref1], [28c][ref2] of [28d][ref3],
      wordt voor de toepassing van [artikel 35a, eerste lid, onderdeel h][ref4] , de omzetbelasting begrepen onder de
      vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28b
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel28c
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel28d
      [ref4]: https://wetten.overheid.nl/BWBR0002629#Artikel35a
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28h
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28b
        hoofdstuk: V
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 28c
        hoofdstuk: V
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0002629
        artikel: 28d
        hoofdstuk: V
        afdeling: '5'
      - id: ref4
        bwb_id: BWBR0002629
        artikel: 35a
        hoofdstuk: VI
        afdeling: '4'
  - number: 28h.2
    text: |-
      Het is de wederverkoper die goederen levert met toepassing van [artikel 28b][ref1], [28c][ref2] of [28d][ref3] niet
      toegestaan om de belasting afzonderlijk te vermelden op de ter zake van die levering uit te reiken factuur.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28b
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel28c
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel28d
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28h
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28b
        hoofdstuk: V
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 28c
        hoofdstuk: V
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0002629
        artikel: 28d
        hoofdstuk: V
        afdeling: '5'
  - number: 28h.3
    text: |-
      [Artikel 35a, eerste lid, onderdeel j][ref1] , is niet van toepassing ter zake van leveringen door wederverkopers
      met toepassing van [de artikelen 28b][ref2], [28c][ref3] of [28d][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel35a
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel28b
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel28c
      [ref4]: https://wetten.overheid.nl/BWBR0002629#Artikel28d
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28h
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 35a
        hoofdstuk: VI
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 28b
        hoofdstuk: V
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0002629
        artikel: 28c
        hoofdstuk: V
        afdeling: '5'
      - id: ref4
        bwb_id: BWBR0002629
        artikel: 28d
        hoofdstuk: V
        afdeling: '5'
  - number: 28i
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld inzake de toepassing van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28i
  - number: 28j.1
    text: 'In deze wet en in de daarop berustende bepalingen wordt onder beleggingsgoud verstaan:'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28j
  - number: 28j.1.a
    text: |-
      goud, in de vorm van staven of plaatjes met een door de goudmarkten aanvaard gewicht, met een zuiverheid van ten
      minste 995/1000, al dan niet belichaamd in effecten, doch met uitzondering van bij ministeriële regeling aan te
      wijzen kleine staven of plaatjes met een gewicht van ten hoogste 1 gram;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28j
  - number: 28j.1.b
    text: 'gouden munten die:'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28j
  - number: 28j.1.b.1°
    text: een zuiverheid van ten minste 900/1000 hebben;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28j
  - number: 28j.1.b.2°
    text: na 1800 zijn geslagen;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28j
  - number: 28j.1.b.3°
    text: in het land van oorsprong als wettig betaalmiddel fungeren of hebben gefungeerd;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28j
  - number: 28j.1.b.4°
    text: |-
      normaliter verkocht worden voor een prijs die de openmarktwaarde van het in de munten vervatte goud niet met meer
      dan 80% overschrijdt;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28j
  - number: 28j.1.c
    text: |-
      gouden munten die zijn opgenomen in de lijst die de Europese Commissie elk jaar publiceert in de C-serie van
      het Publicatieblad van de Europese Unie en die daarmee worden geacht aan de in onderdeel b opgenomen criteria te
      voldoen gedurende het hele jaar waarvoor de lijst wordt gepubliceerd.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28j
  - number: 28j.2
    text: |-
      De in het eerste lid, onderdelen b en c, bedoelde gouden munten worden, voor de toepassing van deze wet en de
      daarop berustende bepalingen, geacht niet wegens hun numismatische belang te worden verkocht.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28j
  - number: 28k
    text: 'Van de belasting zijn vrijgesteld:'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28k
  - number: 28k.a
    text: |-
      de levering, de intracommunautaire verwerving en de invoer van beleggingsgoud, waaronder begrepen
      beleggingsgoud dat belichaamd is in certificaten voor toegewezen of niet-toegewezen goud of dat verhandeld
      wordt op goudrekeningen, en waaronder begrepen, in het bijzonder, goudleningen en swaps, die een eigendoms- of
      vorderingsrecht op beleggingsgoud belichamen, evenals de handelingen betreffende beleggingsgoud bestaande in
      future- en termijncontracten die leiden tot de overdracht van een eigendoms- of vorderingsrecht met betrekking
      tot beleggingsgoud;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28k
  - number: 28k.b
    text: |-
      de diensten door tussenpersonen die handelen in naam en voor rekening van een ander wanneer zij betrokken zijn bij
      de levering van beleggingsgoud voor hun principaal.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28k
  - number: 28l.1
    text: |-
      De ondernemer die beleggingsgoud produceert of goud omzet in beleggingsgoud kan ervoor kiezen
      [artikel 28k, onderdeel a][ref1], op hem niet van toepassing te doen zijn met betrekking tot leveringen van
      beleggingsgoud aan een andere ondernemer.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28k
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28l
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28k
        hoofdstuk: V
        afdeling: '6'
  - number: 28l.2
    text: |-
      De ondernemer die in het kader van zijn onderneming normaliter goud levert voor industriële doeleinden, kan ervoor
      kiezen [artikel 28k, onderdeel a][ref1], op hem niet van toepassing te doen zijn met betrekking tot leveringen van
      beleggingsgoud als bedoeld in [artikel 28j, eerste lid, onderdeel a][ref2], aan een andere ondernemer.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28k
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel28j
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28l
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28k
        hoofdstuk: V
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 28j
        hoofdstuk: V
        afdeling: '6'
  - number: 28l.3
    text: |-
      Indien de leverancier het recht om overeenkomstig het eerste of het tweede lid voor belastingheffing te kiezen
      heeft uitgeoefend, kan de tussenpersoon ervoor kiezen [artikel 28k, onderdeel b][ref1], op hem niet van toepassing
      te doen zijn met betrekking tot de in dat onderdeel vermelde diensten.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28k
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28l
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28k
        hoofdstuk: V
        afdeling: '6'
  - number: 28m.1
    text: |-
      In afwijking in zoverre van [artikel 15][ref1] heeft de ondernemer een recht op aftrek van de belasting die in
      rekening is gebracht of verschuldigd is geworden met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28m
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '15'
        hoofdstuk: II
        afdeling: '4'
  - number: 28m.1.a
    text: |-
      beleggingsgoud dat hem is geleverd door een ondernemer die een in [artikel 28l][ref1] bedoeld keuzerecht heeft
      uitgeoefend;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28l
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28m
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28l
        hoofdstuk: V
        afdeling: '6'
  - number: 28m.1.b
    text: |-
      de levering aan hem of de intracommunautaire verwerving of de invoer door hem van ander goud dan beleggingsgoud dat
      vervolgens door hem of namens hem wordt omgezet in beleggingsgoud;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28m
  - number: 28m.1.c
    text: |-
      aan hem verleende diensten bestaande in een wijziging van de vorm, het gewicht of de zuiverheid van goud met
      inbegrip van beleggingsgoud;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28m
  - number: 28m.2
    text: |-
      In afwijking in zoverre van [artikel 15][ref1] heeft de ondernemer die beleggingsgoud produceert of goud in
      beleggingsgoud omzet een recht op aftrek van de belasting die hem in rekening is gebracht of door hem verschuldigd
      is geworden met betrekking tot de levering dan wel de intracommunautaire verwerving of de invoer van goederen of
      diensten die met de productie of de omzetting van dat goud verband houden alsof de latere levering door hem van het
      ingevolge deze afdeling vrijgestelde goud aan de heffing van belasting was onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28m
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '15'
        hoofdstuk: II
        afdeling: '4'
  - number: 28n
    text: |-
      De ondernemer die handelt in beleggingsgoud dient, met overeenkomstige toepassing van [artikel 34][ref1],
      aantekening te houden van alle handelingen betreffende beleggingsgoud waarvoor de vergoeding meer dan € 10 000
      bedraagt en de documenten te bewaren aan de hand waarvan de identiteit van de cliënt bij dergelijke handelingen kan
      worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel34
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28n
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '34'
        hoofdstuk: VI
        afdeling: '4'
  - number: 28o
    text: |-
      In geval een ondernemer een levering of een dienst verricht die een verwerking omvat van aan een ander toebehorend
      beleggingsgoud, waardoor het goud niet langer als beleggingsgoud is aan te merken, wordt, in afwijking in zoverre
      van [artikel 8][ref1], de belasting berekend over het door de ondernemer voor die levering of dienst in rekening
      gebrachte bedrag – de omzetbelasting niet daaronder begrepen – vermeerderd met de normale waarde van het goud dat
      in het tot stand gekomen goed voorkomt.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel8
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28o
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
  - number: 28p
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld inzake de toepassing van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28p
  - number: 28q
    text: |-
      Voor de toepassing van deze afdeling en de daarop gebaseerde bepalingen wordt onder btw-melding verstaan de melding
      waarin alle gegevens staan die nodig zijn om het bedrag van de in elke lidstaat verschuldigde btw vast te stellen.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28q
  - number: 28r
    text: |-
      Voor de toepassing van deze paragraaf en de daarop gebaseerde bepalingen wordt verstaan onder: - *niet in de Unie
      gevestigde ondernemer:* een ondernemer die de zetel van zijn bedrijfsuitoefening niet op het grondgebied van de
      Unie heeft gevestigd noch daar over een vaste inrichting beschikt;
        - *lidstaat van identificatie:* de lidstaat waar de niet in de Unie gevestigde ondernemer verkiest opgave te doen
      van het begin van zijn activiteit als ondernemer op het grondgebied van de Unie overeenkomstig deze paragraaf;
        - *lidstaat van verbruik:* de lidstaat waar de dienst overeenkomstig [hoofdstuk II, afdeling 1b][ref1], wordt
      geacht te zijn verricht;
        - *niet-Unieregeling:* de bijzondere regeling, bedoeld in deze paragraaf.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28r
    references:
      - id: ref1
        bwb_id: BWBR0002629
        hoofdstuk: II
        afdeling: 1b
  - number: 28ra
    text: |-
      Een niet in de Unie gevestigde ondernemer die diensten verricht voor een andere dan ondernemer die in een lidstaat
      gevestigd is of er zijn woonplaats of zijn gebruikelijke verblijfplaats heeft, kan gebruik maken van de niet-
      Unieregeling. Deze niet-Unieregeling is van toepassing op alle aldus in de Unie verrichte diensten.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28ra
  - number: 28rb.1
    text: |-
      De niet in de Unie gevestigde ondernemer doet aan de lidstaat van identificatie opgave van het begin en de
      beëindiging van zijn activiteit als ondernemer, alsook van wijziging ervan in die mate dat hij niet langer aan de
      voorwaarden voldoet om van de niet-Unieregeling gebruik te mogen maken. Deze opgave gebeurt langs elektronische
      weg.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28rb
  - number: 28rb.2
    text: |-
      De ondernemer die kiest voor Nederland als lidstaat van identificatie, doet de opgave, bedoeld in het eerste lid,
      bij de inspecteur.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28rb
  - number: 28rc.1
    text: |-
      De mededeling die de niet in de Unie gevestigde ondernemer aan de lidstaat van identificatie doet wanneer zijn
      belastbare activiteiten beginnen, bevat de volgende bijzonderheden:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28rc
  - number: 28rc.1.a
    text: de naam;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28rc
  - number: 28rc.1.b
    text: het postadres;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28rc
  - number: 28rc.1.c
    text: de elektronische adressen, met inbegrip van websites;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28rc
  - number: 28rc.1.d
    text: in voorkomend geval, het nationale belastingnummer; en
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28rc
  - number: 28rc.1.e
    text: |-
      een verklaring dat de ondernemer de zetel van zijn bedrijfsuitoefening niet op het grondgebied van de Unie heeft
      gevestigd noch daar over een vaste inrichting beschikt.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28rc
  - number: 28rc.2
    text: |-
      De niet in de Unie gevestigde ondernemer doet de lidstaat van identificatie mededeling van alle wijzigingen in de
      verstrekte informatie.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28rc
  - number: 28rc.3
    text: |-
      De ondernemer die kiest voor Nederland als lidstaat van identificatie, doet de mededelingen, bedoeld in het eerste
      en tweede lid, aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28rc
  - number: 28rc.4
    text: De ondernemer, bedoeld in het derde lid, wordt opgenomen in het identificatieregister niet-Unieregeling.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28rc
  - number: 28rc.5
    text: |-
      Indien degene die heeft gekozen voor Nederland als lidstaat van identificatie niet of niet langer voldoet aan de
      voorwaarden voor identificatie, wordt de identificatie door de inspecteur geweigerd respectievelijk beëindigd. De
      weigering of beëindiging geschiedt bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28rc
  - number: 28rd.1
    text: |-
      Voor de toepassing van de niet-Unieregeling wordt door de lidstaat van identificatie aan de ondernemer een
      individueel btw-identificatienummer toegekend dat hem langs elektronische weg wordt meegedeeld.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28rd
  - number: 28rd.2
    text: |-
      De ondernemer die kiest voor Nederland als lidstaat van identificatie verkrijgt het individueel btw-
      identificatienummer, bedoeld in het eerste lid, van de inspecteur.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28rd
  - number: 28re.1
    text: |-
      De niet in de Unie gevestigde ondernemer wordt door de lidstaat van identificatie verwijderd uit het
      identificatieregister in de volgende gevallen:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28re
  - number: 28re.1.a
    text: indien hij meldt dat hij niet langer diensten verricht die onder de niet-Unieregeling vallen;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28re
  - number: 28re.1.b
    text: |-
      indien anderszins kan worden aangenomen dat zijn aan de niet-Unieregeling onderworpen belastbare activiteiten
      beëindigd zijn;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28re
  - number: 28re.1.c
    text: hij vervult niet langer de voorwaarden om van de niet-Unieregeling gebruik te mogen maken;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28re
  - number: 28re.1.d
    text: hij voldoet bij voortduring niet aan de voorschriften van de niet-Unieregeling.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28re
  - number: 28re.2
    text: |-
      De verwijdering, bedoeld in het eerste lid, geschiedt ingeval Nederland de lidstaat van identificatie is, bij voor
      bezwaar vatbare beschikking van de inspecteur.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28re
  - number: 28rf.1
    text: |-
      De niet in de Unie gevestigde ondernemer die van de niet-Unieregeling gebruikmaakt, dient langs elektronische
      weg bij de lidstaat van identificatie een btw-melding in voor elk kalenderkwartaal, ongeacht of al dan niet onder
      de niet-Unieregeling vallende diensten zijn verricht. De btw-melding wordt uiterlijk voor het einde van de maand
      volgend op het verstrijken van het belastingtijdvak waarop de melding betrekking heeft, ingediend.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28rf
  - number: 28rf.2
    text: |-
      De ondernemer die voor Nederland heeft gekozen als lidstaat van identificatie dient de in het eerste lid bedoelde
      btw-melding in bij de inspecteur.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28rf
  - number: 28rg.1
    text: |-
      De btw-melding bevat het individueel btw-identificatienummer voor de toepassing van de niet-Unieregeling en,
      voor elke lidstaat van verbruik waar de btw verschuldigd is, het totale bedrag, de btw niet inbegrepen, van de
      gedurende het belastingtijdvak verrichte diensten die onder de niet-Unieregeling vallen, en het totale bedrag van
      de belasting daarover, uitgesplitst naar belastingtarieven. De geldende btw-tarieven en de totale verschuldigde
      belasting worden eveneens op de btw-melding vermeld.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28rg
  - number: 28rg.2
    text: |-
      Indien een reeds ingediende btw-melding naderhand moet worden gewijzigd, worden deze wijzigingen in een volgende
      btw-melding opgenomen, uiterlijk drie jaren na de datum waarop de oorspronkelijke btw-melding moest worden
      ingediend overeenkomstig [artikel 28rf][ref1]. In die volgende btw-melding staan de betrokken lidstaat van
      verbruik, het belastingtijdvak en het btw-bedrag waarvoor wijzigingen nodig zijn, vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28rf
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28rg
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28rf
        hoofdstuk: V
        paragraaf: '2'
        afdeling: '7'
  - number: 28rg.3
    text: |-
      Met betrekking tot de in Nederland ingediende btw-melding is
      [Hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref1] van overeenkomstige toepassing als ware de
      betaalde belasting op aangifte voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28rg
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: V
  - number: 28rh.1
    text: De btw-melding wordt in euro verricht.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28rh
  - number: 28rh.2
    text: |-
      Indien de vergoeding voor diensten is uitgedrukt in een andere munteenheid dan de euro hanteert de niet in de
      Unie gevestigde ondernemer, in afwijking van [artikel 8, zesde lid][ref1], bij de invulling van de btw-melding de
      wisselkoers die gold op de laatste dag van het belastingtijdvak. De omwisseling geschiedt volgens de wisselkoersen
      die de Europese Centrale Bank voor die dag bekend heeft gemaakt of, wanneer die dag geen bekendmaking heeft
      plaatsgevonden, op de eerstvolgende dag van bekendmaking.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel8
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28rh
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
  - number: 28ri.1
    text: |-
      De niet in de Unie gevestigde ondernemer voldoet de btw onder verwijzing naar de betreffende btw-melding, zulks
      op het moment dat de btw-melding wordt ingediend, doch uiterlijk bij het verstrijken van de termijn waarbinnen
      de btw-melding moet worden ingediend. De belasting wordt overgemaakt naar een door de lidstaat van identificatie
      opgegeven bankrekening in euro, dan wel naar een bankrekening in hun eigen valuta van lidstaten die de euro niet
      als munteenheid hebben aangenomen, indien die lidstaten dat eisen.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28ri
  - number: 28ri.2
    text: De ondernemer die voor Nederland heeft gekozen als lidstaat van identificatie voldoet de btw bij de ontvanger.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28ri
  - number: 28rj
    text: |-
      De niet in de Unie gevestigde ondernemer die van de niet-Unieregeling gebruikmaakt, past geen aftrek van belasting
      toe als bedoeld in artikel 168 van BTW-richtlijn 2006. In afwijking van artikel 1, eerste lid, van de Dertiende
      [Richtlijn 86/560/EEG](31986L0560) van de Raad van 17 november 1986 betreffende de harmonisatie van de wetgevingen
      der Lid-Staten inzake omzetbelasting – Regeling voor de teruggaaf van de belasting over de toegevoegde waarde
      aan niet op het grondgebied van de Gemeenschap gevestigde belastingplichtigen (PbEG 1986, L 326) wordt deze
      ondernemer teruggaaf verleend overeenkomstig die richtlijn. Artikel 2, tweede en derde lid, en artikel 4, tweede
      lid, van die richtlijn zijn niet van toepassing op de teruggaaf die verband houdt met onder de niet-Unieregeling
      vallende diensten. Indien de ondernemer die van de niet-Unieregeling gebruikmaakt, in een lidstaat moet worden
      geïdentificeerd voor activiteiten die niet onder de niet-Unieregeling vallen, brengt hij de in die lidstaat
      betaalde voorbelasting die verband houdt met zijn aan de niet-Unieregeling onderworpen belastbare activiteiten, in
      aftrek op de overeenkomstig artikel 250 van BTW-richtlijn 2006 in te dienen aangifte.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28rj
  - number: 28rk.1
    text: |-
      Indien de belasting die verschuldigd is over in Nederland verrichte diensten, ongeacht de keuze van
      lidstaat van identificatie, geheel of gedeeltelijk niet is betaald, kan de inspecteur met toepassing van
      [artikel 20 van de Algemene wet inzake rijksbelastingen][ref1] de te weinig geheven belasting naheffen. De
      [artikelen 30h][ref2], [30ha][ref3], [67c][ref4] en [67f van die wet][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel30h
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel30ha
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel67c
      [ref5]: https://wetten.overheid.nl/BWBR0002320#Artikel67f
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28rk
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 30h
      - id: ref3
        bwb_id: BWBR0002320
        artikel: 30ha
      - id: ref4
        bwb_id: BWBR0002320
        artikel: 67c
      - id: ref5
        bwb_id: BWBR0002320
        artikel: 67f
  - number: 28rk.2
    text: |-
      Indien het totaal van de belasting op de btw-melding voor Nederland over een belastingtijdvak negatief is, wordt de
      btw-melding voor dat totaal aangemerkt als een verzoek om teruggaaf van belasting.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28rk
  - number: 28rk.3
    text: De inspecteur beslist op het verzoek om teruggaaf bij voor bezwaar vatbare beschikking
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28rk
  - number: 28rk.4
    text: |-
      Op de verzoeken om teruggaaf van belasting is [afdeling 4.1.3 van de Algemene wet bestuursrecht][ref1] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.3
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28rk
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.3
  - number: 28rl.1
    text: |-
      De niet in de Unie gevestigde ondernemer voert van alle handelingen waarop de niet-Unieregeling van toepassing is,
      een boekhouding. Deze boekhouding moet voldoende gegevens bevatten om de belastingautoriteiten van de lidstaat van
      verbruik in staat te stellen de juistheid van de btw-melding te bepalen.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28rl
  - number: 28rl.2
    text: |-
      Desgevraagd moet de in het eerste lid bedoelde boekhouding langs elektronische weg aan de lidstaat van
      identificatie en aan de lidstaat van verbruik beschikbaar worden gesteld. De boekhouding wordt bewaard gedurende
      tien jaar na afloop van het jaar waarin de handeling is verricht.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28rl
  - number: 28s
    text: |-
      Voor de toepassing van deze paragraaf en de daarop gebaseerde bepalingen wordt verstaan onder: - *niet in de
      lidstaat van verbruik gevestigde ondernemer:* een ondernemer die de zetel van zijn bedrijfsuitoefening of een vaste
      inrichting op het grondgebied van de Unie heeft gevestigd, maar in de lidstaat van verbruik noch de zetel van zijn
      bedrijfsuitoefening, noch een vaste inrichting heeft;
        - *lidstaat van identificatie:* 1°. in het geval de ondernemer de zetel van zijn bedrijfsuitoefening in de Unie
      heeft gevestigd: de lidstaat waar die zetel zich bevindt; of 2°. in het geval de ondernemer de zetel van zijn
      bedrijfsuitoefening niet in de Unie heeft gevestigd: de lidstaat waar hij een vaste inrichting heeft; of 3°.
      in het geval de ondernemer niet in de Unie is gevestigd, maar daarin meer dan één vaste inrichting heeft: de
      lidstaat waar zich een vaste inrichting bevindt, waarin de ondernemer meldt dat hij van de Unieregeling gebruik
      maakt. De ondernemer is gedurende het betreffende kalenderjaar en de twee daaropvolgende kalenderjaren aan deze
      keuze gebonden; of 4°. in het geval de ondernemer de zetel van zijn bedrijfsuitoefening niet in de Unie heeft
      gevestigd en aldaar geen vaste inrichting heeft: de lidstaat waar de verzending of het vervoer van de goederen
      aanvangt. Indien er meer dan één lidstaat is waar de verzending of het vervoer van de goederen aanvangt, vermeldt
      de ondernemer welke van deze lidstaten de lidstaat van identificatie is. De ondernemer is gedurende het betreffende
      kalenderjaar en de twee daaropvolgende kalenderjaren aan deze keuze gebonden;
        - *lidstaat van verbruik:* 1°. in het geval van de verrichting van een dienst: de lidstaat waar de dienst
      overeenkomstig [hoofdstuk II, afdeling 1b][ref1], wordt geacht te zijn verricht; of 2°. in het geval van een
      intracommunautaire afstandsverkoop van goederen: de lidstaat van aankomst van de verzending of het vervoer van de
      goederen naar de afnemer; of 3°. in het geval van de levering van goederen door een ondernemer die deze levering
      faciliteert overeenkomstig [artikel 3c, tweede lid][ref2], indien de verzending of het vervoer van de geleverde
      goederen in dezelfde lidstaat begint en eindigt: deze lidstaat;
        - *Unieregeling:* de bijzondere regeling, bedoeld in deze paragraaf.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel3c
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28s
    references:
      - id: ref1
        bwb_id: BWBR0002629
        hoofdstuk: II
        afdeling: 1b
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 3c
        hoofdstuk: II
        afdeling: '1'
  - number: 28sa.1
    text: 'Van de Unieregeling kan worden gebruik gemaakt door:'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28sa
  - number: 28sa.1.a
    text: een ondernemer die intracommunautaire afstandsverkopen van goederen verricht;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28sa
  - number: 28sa.1.b
    text: |-
      een ondernemer die de levering van goederen faciliteert overeenkomstig [artikel 3c, tweede lid][ref1], indien het
      vervoer van de geleverde goederen in dezelfde lidstaat begint en eindigt;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel3c
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28sa
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 3c
        hoofdstuk: II
        afdeling: '1'
  - number: 28sa.1.c
    text: een niet in de lidstaat van verbruik gevestigde ondernemer die diensten verricht voor andere dan ondernemers.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28sa
  - number: 28sa.2
    text: |-
      De Unieregeling is van toepassing op alle door de betrokken ondernemer in de Unie geleverde goederen of verrichte
      diensten, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28sa
  - number: 28sb.1
    text: |-
      Een ondernemer doet aan de lidstaat van identificatie opgave van het begin en de beëindiging van zijn onder de
      Unieregeling vallende activiteiten, alsmede van de wijzigingen ervan waardoor hij niet langer voldoet aan de
      voorwaarden om van de Unieregeling gebruik te mogen maken. Deze opgave wordt langs elektronische weg verstrekt.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28sb
  - number: 28sb.2
    text: |-
      De ondernemer die kiest voor Nederland als lidstaat van identificatie doet de in het eerste lid bedoelde opgave bij
      de inspecteur.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28sb
  - number: 28sb.3
    text: |-
      De ondernemer wordt bij opgave van het begin van zijn onder de Unieregeling vallende activiteiten opgenomen in het
      identificatieregister Unieregeling.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28sb
  - number: 28sb.4
    text: |-
      Indien degene die heeft gekozen voor Nederland als lidstaat van identificatie niet of niet langer voldoet aan de
      voorwaarden voor identificatie, wordt de identificatie door de inspecteur geweigerd respectievelijk beëindigd. De
      weigering of beëindiging geschiedt bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28sb
  - number: 28sc.1
    text: |-
      De niet in de lidstaat van verbruik gevestigde ondernemer wordt door de lidstaat van identificatie uitgesloten van
      de Unieregeling en verwijderd uit het identificatieregister in elk van de volgende gevallen:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28sc
  - number: 28sc.1.a
    text: indien hij meldt dat hij niet langer leveringen van goederen of diensten verricht die onder de Unieregeling vallen;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28sc
  - number: 28sc.1.b
    text: |-
      indien anderszins kan worden aangenomen dat zijn aan de Unieregeling onderworpen belastbare activiteiten beëindigd
      zijn;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28sc
  - number: 28sc.1.c
    text: hij vervult niet langer de voorwaarden om van de Unieregeling gebruik te mogen maken;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28sc
  - number: 28sc.1.d
    text: hij voldoet bij voortduring niet aan de voorschriften van de Unieregeling.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28sc
  - number: 28sc.2
    text: |-
      De uitsluiting bedoeld in het eerste lid geschiedt ingeval Nederland de lidstaat van identificatie is, bij voor
      bezwaar vatbare beschikking van de inspecteur.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28sc
  - number: 28sd.1
    text: |-
      De ondernemer die van de Unieregeling gebruikmaakt, dient voor elk kalenderkwartaal langs elektronische weg een
      btw-melding in bij de lidstaat van identificatie, ongeacht of al dan niet leveringen van goederen of diensten
      zijn verricht die onder de Unieregeling vallen. De btw-melding wordt vóór het einde van de maand volgend op het
      verstrijken van het kalenderkwartaal waarop de aangifte betrekking heeft, ingediend.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28sd
  - number: 28sd.2
    text: |-
      De ondernemer die voor Nederland heeft gekozen als lidstaat van identificatie dient de in het eerste lid bedoelde
      btw-melding in bij de inspecteur.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28sd
  - number: 28se.1
    text: |-
      De btw-melding bevat het aan de ondernemer toegekende btw-identificatienummer en, voor elke lidstaat van verbruik
      waar de btw verschuldigd is, het totale bedrag exclusief btw, de toepasselijke btw-tarieven, het totale bedrag van
      de overeenkomstige belasting, uitgesplitst naar belastingtarieven, en de totale verschuldigde belasting over de
      volgende gedurende het kalenderkwartaal verrichte leveringen die onder de Unieregeling vallen:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28se
  - number: 28se.1.a
    text: intracommunautaire afstandsverkopen van goederen;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28se
  - number: 28se.1.b
    text: |-
      goederenleveringen overeenkomstig [artikel 3c, tweede lid][ref1], indien de verzending of het vervoer van die
      goederen in dezelfde lidstaat begint en eindigt;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel3c
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28se
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 3c
        hoofdstuk: II
        afdeling: '1'
  - number: 28se.1.c
    text: diensten.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28se
  - number: 28se.2
    text: |-
      De btw-melding bevat ook de wijzigingen met betrekking tot voorgaande belastingtijdvakken, bedoeld in het achtste
      lid.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28se
  - number: 28se.3
    text: |-
      Wanneer goederen worden verzonden of vervoerd vanuit een andere lidstaat dan de lidstaat van identificatie, bevat
      de btw-melding ook:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28se
  - number: 28se.3.a
    text: het totale bedrag exclusief btw;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28se
  - number: 28se.3.b
    text: de toepasselijke btw-tarieven;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28se
  - number: 28se.3.c
    text: het totale bedrag van de overeenkomstige belasting, uitgesplitst naar belastingtarieven; en
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28se
  - number: 28se.3.d
    text: |-
      de totale verschuldigde belasting over de volgende leveringen die onder de Unieregeling vallen, voor elke lidstaat
      waaruit die goederen zijn verzonden of vervoerd:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28se
  - number: 28se.3.d.i
    text: |-
      intracommunautaire afstandsverkopen van goederen die niet via een ondernemer verlopen overeenkomstig
      [artikel 3c, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel3c
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28se
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 3c
        hoofdstuk: II
        afdeling: '1'
  - number: 28se.3.d.ii
    text: |-
      intracommunautaire afstandsverkopen van goederen en goederenleveringen door een ondernemer overeenkomstig
      [artikel 3c, tweede lid][ref1], indien de verzending of het vervoer van de goederen in dezelfde lidstaat begint
      en eindigt.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel3c
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28se
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 3c
        hoofdstuk: II
        afdeling: '1'
  - number: 28se.4
    text: |-
      Met betrekking tot de leveringen, bedoeld in het derde lid, onderdeel d, onder i, bevat de btw-melding ook het
      individuele btw-identificatienummer of het fiscale registratienummer dat door elk van de desbetreffende lidstaten
      is toegekend.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28se
  - number: 28se.5
    text: |-
      Met betrekking tot de leveringen, bedoeld in het derde lid, onderdeel d, onder ii, bevat de btw-melding ook het
      individuele btw-identificatienummer of het fiscale registratienummer dat door elk van de desbetreffende lidstaten
      is toegekend, indien beschikbaar.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28se
  - number: 28se.6
    text: |-
      De btw-melding bevat de informatie, bedoeld in het derde, vierde en vijfde lid, uitgesplitst naar lidstaat van
      verbruik.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28se
  - number: 28se.7
    text: |-
      Indien de ondernemer die onder de Unieregeling vallende diensten verricht, behalve in de lidstaat van identificatie
      in een of meer andere lidstaten één of meer vaste inrichtingen heeft van waaruit de diensten worden verricht,
      bevat de btw-melding, per lidstaat waar hij een vaste inrichting heeft gevestigd en uitgesplitst naar lidstaat
      van verbruik:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28se
  - number: 28se.7.a
    text: het totale bedrag exclusief btw;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28se
  - number: 28se.7.b
    text: de toepasselijke btw-tarieven;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28se
  - number: 28se.7.c
    text: het totale bedrag van de overeenkomstige belasting en de totale verschuldigde belasting over die leveringen; en
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28se
  - number: 28se.7.d
    text: het individueel btw-identificatienummer of het fiscaal registratienummer van de inrichting.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28se
  - number: 28se.8
    text: |-
      Indien een reeds ingediende btw-melding naderhand moet worden gewijzigd, worden deze wijzigingen in een volgende
      btw-melding opgenomen uiterlijk drie jaar na de datum waarop de oorspronkelijke melding moest worden ingediend
      overeenkomstig [artikel 28sd][ref1]. In die volgende btw-melding staan de betrokken lidstaat van verbruik, het
      kalenderkwartaal en het btw-bedrag waarvoor de wijzigingen nodig zijn, vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28sd
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28se
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28sd
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '7'
  - number: 28se.9
    text: |-
      Met betrekking tot de in Nederland ingediende btw-melding is
      [Hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref1] van overeenkomstige toepassing als ware de
      betaalde belasting op aangifte voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28se
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: V
  - number: 28sf.1
    text: De btw-melding wordt in euro verricht.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28sf
  - number: 28sf.2
    text: |-
      Indien de goederenleveringen en diensten in een andere munteenheid luiden, hanteert de ondernemer die van de
      Unieregeling gebruikmaakt, bij het invullen van de btw-melding de wisselkoers die gold op de laatste dag van
      het belastingtijdvak. De omwisseling geschiedt volgens de wisselkoersen die de Europese Centrale Bank voor die
      dag bekend heeft gemaakt of, wanneer die dag geen bekendmaking heeft plaatsgevonden, op de eerstvolgende dag van
      bekendmaking.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28sf
  - number: 28sg.1
    text: |-
      De ondernemer die gebruikmaakt van de Unieregeling, betaalt de btw, onder verwijzing naar de betreffende btw-
      melding, uiterlijk bij het verstrijken van de termijn waarbinnen de btw-melding moet worden ingediend. De btw
      wordt overgemaakt naar een door de lidstaat van identificatie opgegeven bankrekening in euro, dan wel naar een
      bankrekening in hun eigen valuta van lidstaten die de euro niet als munteenheid hebben aangenomen, indien die
      lidstaten dat eisen.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28sg
  - number: 28sg.2
    text: De ondernemer die voor Nederland heeft gekozen als lidstaat van identificatie betaalt de btw bij de ontvanger.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28sg
  - number: 28sh
    text: |-
      De ondernemer die van de Unieregeling gebruikmaakt, past met betrekking tot zijn aan de Unieregeling onderworpen
      belastbare activiteiten, geen aftrek toe als bedoeld in artikel 168 van BTW-richtlijn 2006 voor de betaalde
      voorbelasting. In afwijking van artikel 2, eerste lid, artikel 3 en artikel 8, eerste lid, onderdeel e, van
      [Richtlijn 2008/9/EG](32008L0009) van de Raad van 12 februari 2008 tot vaststelling van nadere voorschriften
      voor de in [Richtlijn 2006/112/EG](32006L0112) vastgestelde teruggaaf van de belasting over de toegevoegde waarde
      aan belastingplichtigen die niet in de lidstaat van teruggaaf maar in een andere lidstaat gevestigd zijn (PbEU
      2008, L 44) wordt deze ondernemer teruggaaf verleend overeenkomstig die richtlijn. Indien de ondernemer die
      van de Unieregeling gebruikmaakt, in een lidstaat moet worden geïdentificeerd voor activiteiten die niet onder
      de Unieregeling vallen, brengt hij de in die lidstaat betaalde voorbelasting die verband houdt met zijn aan de
      Unieregeling onderworpen belastbare activiteiten, in aftrek op de overeenkomstig artikel 250 van BTW-richtlijn 2006
      in te dienen aangifte.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28sh
  - number: 28si.1
    text: |-
      Indien de belasting die verschuldigd is over in Nederland verrichte handelingen als bedoeld in deze paragraaf,
      ongeacht de keuze van de lidstaat van identificatie, geheel of gedeeltelijk niet is betaald, kan de inspecteur
      met toepassing van [artikel 20 van de Algemene wet inzake rijksbelastingen][ref1] de te weinig geheven belasting
      naheffen. De [artikelen 30h][ref2], [30ha][ref3], [67c][ref4] en [67f van die wet][ref5] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel30h
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel30ha
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel67c
      [ref5]: https://wetten.overheid.nl/BWBR0002320#Artikel67f
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28si
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 30h
      - id: ref3
        bwb_id: BWBR0002320
        artikel: 30ha
      - id: ref4
        bwb_id: BWBR0002320
        artikel: 67c
      - id: ref5
        bwb_id: BWBR0002320
        artikel: 67f
  - number: 28si.2
    text: |-
      Indien het totaal van de belasting op de btw-melding voor Nederland over een belastingtijdvak negatief is, wordt de
      btw-melding voor dat totaal aangemerkt als een verzoek om teruggaaf van belasting.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28si
  - number: 28si.3
    text: De inspecteur beslist op het verzoek om teruggaaf bij voor bezwaar vatbare beschikking
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28si
  - number: 28si.4
    text: |-
      Op de verzoeken om teruggaaf van belasting is [afdeling 4.1.3 van de Algemene wet bestuursrecht][ref1] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.3
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28si
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.3
  - number: 28sj.1
    text: |-
      De ondernemer die van de Unieregeling gebruikmaakt, voert van alle onder de Unieregeling vallende handelingen een
      boekhouding. Deze boekhouding moet voldoende gegevens bevatten om de belastingautoriteiten van de lidstaat van
      verbruik in staat te stellen de juistheid van de btw-melding te bepalen.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28sj
  - number: 28sj.2
    text: |-
      Desgevraagd moet de in het eerste lid bedoelde boekhouding langs elektronische weg aan de lidstaat van verbruik en
      aan de lidstaat van identificatie beschikbaar worden gesteld. De boekhouding wordt bewaard gedurende tien jaar na
      afloop van het jaar waarin de handeling is verricht.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28sj
  - number: 28t
    text: |-
      Voor de toepassing van deze paragraaf en de daarop gebaseerde bepalingen hebben afstandsverkopen van uit
      derdelandsgebieden of derde-landen ingevoerde goederen uitsluitend betrekking op goederen, met uitzondering van
      accijnsgoederen, in zendingen met een intrinsieke waarde van niet meer dan € 150.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28t
  - number: 28ta.1
    text: |-
      Voor de toepassing van deze paragraaf en de daarop gebaseerde bepalingen wordt verstaan onder: - *niet in de Unie
      gevestigde ondernemer:* een ondernemer die de zetel van zijn bedrijfsuitoefening niet op het grondgebied van de
      Unie heeft gevestigd noch daar over een vaste inrichting beschikt;
        - *tussenpersoon:* een in de Unie gevestigde persoon die door de ondernemer die afstandsverkopen van uit
      derdelandsgebieden of derde-landen ingevoerde goederen verricht, is aangewezen als de persoon die gehouden is
      tot voldoening van de btw en die in naam en voor rekening van de ondernemer de in de invoerregeling vastgestelde
      verplichtingen moet nakomen;
        - *lidstaat van identificatie:* 1°. wanneer de ondernemer niet in de Unie is gevestigd, de lidstaat waar hij
      verkiest zich te registreren; 2°. wanneer de ondernemer de zetel van zijn bedrijfsuitoefening niet in de Unie
      heeft gevestigd maar daar wel één of meer vaste inrichtingen heeft, de lidstaat met een vaste inrichting waar
      de ondernemer meldt dat hij van de invoerregeling gebruik zal maken; 3°. wanneer de ondernemer de zetel van zijn
      bedrijfsuitoefening in een lidstaat heeft gevestigd, deze lidstaat; 4°. wanneer de tussenpersoon de zetel van
      zijn bedrijfsuitoefening in een lidstaat heeft gevestigd, deze lidstaat; 5°. wanneer de tussenpersoon de zetel van
      zijn bedrijfsuitoefening niet in de Unie heeft gevestigd, maar daar wel één of meer vaste inrichtingen heeft, de
      lidstaat met een vaste inrichting waar de tussenpersoon meldt dat hij van de invoerregeling gebruik zal maken;
        - *lidstaat van verbruik:* de lidstaat van aankomst van de verzending of het vervoer van de goederen naar de
      afnemer;
        - *invoerregeling:* de bijzondere regeling, bedoeld in deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28ta
  - number: 28ta.2
    text: |-
      Voor de toepassing van het eerste lid, onderdeel c, onder 2° en 5°, is de ondernemer of tussenpersoon wanneer hij
      meer dan één vaste inrichting in de Unie heeft, gebonden door zijn beslissing betreffende de aanwijzing van de
      lidstaat van vestiging gedurende het betreffende kalenderjaar en de twee daaropvolgende jaren.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28ta
  - number: 28tb.1
    text: |-
      De volgende ondernemers die afstandsverkopen van uit derdelandsgebieden of derde-landen ingevoerde goederen
      verrichten kunnen gebruik maken van de invoerregeling:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28tb
  - number: 28tb.1.a
    text: |-
      elke in de Unie gevestigde ondernemer die afstandsverkopen van uit derdelandsgebieden of derde-landen ingevoerde
      goederen verricht;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28tb
  - number: 28tb.1.b
    text: |-
      elke al dan niet in de Unie gevestigde ondernemer die afstandsverkopen van uit derdelandsgebieden of derde-landen
      ingevoerde goederen verricht, en die door een in de Unie gevestigde tussenpersoon is vertegenwoordigd;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28tb
  - number: 28tb.1.c
    text: |-
      elke ondernemer die gevestigd is in een derde-land waarmee de Unie een overeenkomst betreffende wederzijds bijstand
      heeft gesloten waarvan het toepassingsgebied vergelijkbaar is met [Richtlijn 2010/24](32010L0024)/EU van de Raad
      van 16 maart 2010 betreffende de wederzijdse bijstand inzake de invordering van schuldvorderingen die voortvloeien
      uit belastingen, rechten en andere maatregelen (PbEU 2010, L 84) en Verordening (EU) nr. 904/2010 van de Raad
      van 7 oktober 2010 betreffende de administratieve samenwerking en de bestrijding van fraude op het gebied van de
      belasting over de toegevoegde waarde (PbEU 2010, L 268), en die afstandsverkopen van goederen vanuit dat derde-
      land verricht.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28tb
  - number: 28tb.2
    text: |-
      De ondernemers passen de invoerregeling toe op al hun afstandsverkopen van uit derdelandsgebieden of derde-landen
      ingevoerde goederen.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28tb
  - number: 28tb.3
    text: |-
      Voor de toepassing van het eerste lid, onderdeel b, kan een ondernemer slechts één tussenpersoon tegelijk
      aanwijzen.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28tb
  - number: 28tb.4
    text: |-
      Bij algemene maatregel van bestuur kunnen, ter verzekering van de heffing en de invordering, regels worden gesteld
      met betrekking tot de tussenpersoon.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28tb
  - number: 28tc.1
    text: |-
      Voor afstandsverkopen van uit derdelandsgebieden of derde-landen ingevoerde goederen waarvan de btw-melding wordt
      gedaan in het kader van de invoerregeling, vindt het belastbare feit plaats en wordt de belasting verschuldigd op
      het tijdstip van levering.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28tc
  - number: 28tc.2
    text: De goederen worden geacht te zijn geleverd op het tijdstip waarop de betaling is aanvaard.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28tc
  - number: 28td.1
    text: |-
      De ondernemer die van de invoerregeling gebruik maakt, of een voor zijn rekening handelende tussenpersoon, doet
      aan de lidstaat van identificatie opgave van het begin en de beëindiging van zijn activiteit in het kader van de
      invoerregeling, alsmede van de wijzigingen ervan waardoor hij niet langer voldoet aan de voorwaarden om van de
      invoerregeling gebruik te mogen maken. Deze informatie wordt langs elektronische weg verstrekt.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28td
  - number: 28td.2
    text: |-
      Wanneer de ondernemer kiest voor Nederland als lidstaat van identificatie doet hij of zijn tussenpersoon de in het
      eerste lid bedoelde opgave bij de inspecteur.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28td
  - number: 28td.3
    text: |-
      De ondernemer en de tussenpersoon bedoeld in het tweede lid worden opgenomen in het identificatieregister
      invoerregeling.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28td
  - number: 28te.1
    text: |-
      De mededeling die de ondernemer die geen beroep doet op een tussenpersoon, aan de lidstaat van identificatie doet
      voordat hij van de invoerregeling gebruik begint te maken, bevat de volgende bijzonderheden:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28te
  - number: 28te.1.a
    text: de naam;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28te
  - number: 28te.1.b
    text: het postadres;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28te
  - number: 28te.1.c
    text: het elektronisch adres, met inbegrip van websites;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28te
  - number: 28te.1.d
    text: het btw-identificatienummer of nationaal belastingnummer.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28te
  - number: 28te.2
    text: |-
      De mededeling die de tussenpersoon aan de lidstaat van identificatie doet voordat hij van de invoerregeling gebruik
      begint te maken voor rekening van een ondernemer, bevat de volgende bijzonderheden:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28te
  - number: 28te.2.a
    text: de naam;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28te
  - number: 28te.2.b
    text: het postadres;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28te
  - number: 28te.2.c
    text: het elektronisch adres;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28te
  - number: 28te.2.d
    text: het btw-identificatienummer.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28te
  - number: 28te.3
    text: |-
      De informatie die de tussenpersoon moet verstrekken aan de lidstaat van identificatie voor elke ondernemer die hij
      vertegenwoordigt voordat die ondernemer van de invoerregeling gebruik begint te maken, dient de volgende gegevens
      te bevatten:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28te
  - number: 28te.3.a
    text: de naam;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28te
  - number: 28te.3.b
    text: het postadres;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28te
  - number: 28te.3.c
    text: het elektronisch adres, met inbegrip van websites;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28te
  - number: 28te.3.d
    text: het btw-identificatienummer of nationaal belastingnummer;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28te
  - number: 28te.3.e
    text: |-
      het individuele identificatienummer, bedoeld in [artikel 28tf, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28tf
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28te
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28tf
        hoofdstuk: V
        paragraaf: '4'
        afdeling: '7'
  - number: 28te.4
    text: |-
      Een ondernemer die van de invoerregeling gebruikmaakt of, in voorkomend geval, zijn tussenpersoon doet de lidstaat
      van identificatie mededeling van alle wijzigingen in de verstrekte informatie. Voor Nederland als lidstaat van
      identificatie wordt deze mededeling gedaan aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28te
  - number: 28tf.1
    text: |-
      De ondernemer die gebruikmaakt van de invoerregeling wordt voor de toepassing van de invoerregeling een individueel
      btw-identificatienummer toegekend door de lidstaat van identificatie die hem dit nummer langs elektronische weg
      meedeelt.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28tf
  - number: 28tf.2
    text: |-
      Een tussenpersoon wordt door de lidstaat van identificatie een individueel identificatienummer toegekend dat hem
      door die lidstaat langs elektronische weg wordt meegedeeld.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28tf
  - number: 28tf.3
    text: |-
      De tussenpersoon wordt door de lidstaat van identificatie een individueel btw-identificatienummer toegekend voor de
      toepassing van de invoerregeling ten aanzien van iedere ondernemer waarvoor hij is aangesteld.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28tf
  - number: 28tf.4
    text: |-
      Het btw-identificatienummer, bedoeld in het eerste, tweede en derde lid, wordt uitsluitend gebruikt voor de
      toepassing van de invoerregeling.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28tf
  - number: 28tf.5
    text: |-
      De ondernemer of tussenpersoon die kiest voor Nederland als lidstaat van identificatie verkrijgt de btw-
      identificatienummers, bedoeld in het eerste, tweede en derde lid, van de inspecteur.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28tf
  - number: 28tf.6
    text: |-
      Indien degene die heeft gekozen voor Nederland als lidstaat van identificatie niet of niet langer voldoet aan de
      voorwaarden voor identificatie, wordt de identificatie door de inspecteur geweigerd respectievelijk beëindigd. De
      weigering of beëindiging geschiedt bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28tf
  - number: 28tg.1
    text: |-
      De niet van een tussenpersoon gebruikmakende ondernemer wordt door de lidstaat van identificatie uit het
      identificatieregister invoerregeling verwijderd in de volgende gevallen:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28tg
  - number: 28tg.1.a
    text: |-
      de ondernemer deelt de lidstaat van identificatie mee dat hij niet langer afstandsverkopen van uit
      derdelandsgebieden of derde-landen ingevoerde goederen verricht;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28tg
  - number: 28tg.1.b
    text: |-
      er kan anderszins worden aangenomen dat zijn belastbare activiteiten betreffende afstandsverkopen van uit
      derdelandsgebieden of derde-landen ingevoerde goederen, beëindigd zijn;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28tg
  - number: 28tg.1.c
    text: hij vervult niet langer de voorwaarden om van de invoerregeling gebruik te mogen maken;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28tg
  - number: 28tg.1.d
    text: hij voldoet bij voortduring niet aan de voorschriften van de invoerregeling.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28tg
  - number: 28tg.2
    text: |-
      De tussenpersoon wordt door de lidstaat van identificatie verwijderd uit het identificatieregister invoerregeling
      in de volgende gevallen:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28tg
  - number: 28tg.2.a
    text: |-
      hij heeft gedurende twee opeenvolgende kalenderkwartalen niet gehandeld als tussenpersoon voor rekening van een
      ondernemer die van de invoerregeling gebruikmaakt;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28tg
  - number: 28tg.2.b
    text: hij vervult niet langer de andere voorwaarden om als tussenpersoon te kunnen optreden;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28tg
  - number: 28tg.2.c
    text: hij voldoet bij voortduring niet aan de voorschriften van de invoerregeling.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28tg
  - number: 28tg.3
    text: |-
      De door een tussenpersoon vertegenwoordigde ondernemer wordt door de lidstaat van identificatie verwijderd uit het
      identificatieregister invoerregeling in de volgende gevallen:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28tg
  - number: 28tg.3.a
    text: |-
      de tussenpersoon deelt de lidstaat van identificatie mee dat deze ondernemer niet langer afstandsverkopen van uit
      derdelandsgebieden of derde-landen ingevoerde goederen verricht;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28tg
  - number: 28tg.3.b
    text: |-
      er kan anderszins worden aangenomen dat de belastbare activiteiten van deze ondernemer betreffende afstandsverkopen
      van uit derdelandsgebieden of derde-landen ingevoerde goederen, beëindigd zijn;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28tg
  - number: 28tg.3.c
    text: de ondernemer vervult niet langer de voorwaarden om van de invoerregeling gebruik te mogen maken;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28tg
  - number: 28tg.3.d
    text: de ondernemer voldoet bij voortduring niet aan de voorschriften van de invoerregeling;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28tg
  - number: 28tg.3.e
    text: de tussenpersoon deelt de lidstaat van identificatie mee dat hij deze ondernemer niet langer vertegenwoordigt.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28tg
  - number: 28tg.4
    text: |-
      De verwijdering bedoeld in de voorgaande leden geschiedt ingeval Nederland de lidstaat van identificatie is bij
      voor bezwaar vatbare beschikking van de inspecteur.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28tg
  - number: 28th.1
    text: |-
      De ondernemer die van de invoerregeling gebruik maakt, of zijn tussenpersoon dient langs elektronische weg bij de
      lidstaat van identificatie een btw-melding in voor elke kalendermaand, ongeacht of al dan niet afstandsverkopen
      van uit derdelandsgebieden of derde-landen ingevoerde goederen zijn verricht. De btw-melding wordt uiterlijk
      ingediend voor het einde van de kalendermaand volgend op het verstrijken van het belastingtijdvak waarop de melding
      betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28th
  - number: 28th.2
    text: |-
      Wanneer de ondernemer voor Nederland als lidstaat van identificatie heeft gekozen dient hij of zijn tussenpersoon
      de in het eerste lid bedoelde btw-melding in bij de inspecteur.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28th
  - number: 28ti.1
    text: |-
      De btw-melding bevat het btw-identificatienummer, bedoeld in [artikel 28tf][ref1], van de ondernemer en in
      voorkomend geval van zijn tussenpersoon en, voor elke lidstaat van verbruik waar de btw verschuldigd is:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28tf
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28ti
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28tf
        hoofdstuk: V
        paragraaf: '4'
        afdeling: '7'
  - number: 28ti.1.a
    text: |-
      het totale bedrag, de btw niet inbegrepen, van de afstandsverkopen van uit derdelandsgebieden of derde-landen
      ingevoerde goederen waarvoor de btw gedurende het belastingtijdvak verschuldigd is geworden;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28ti
  - number: 28ti.1.b
    text: het totale bedrag van de btw daarover, uitgesplitst naar belastingtarieven; en
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28ti
  - number: 28ti.1.c
    text: de geldende btw-tarieven en de totale verschuldigde belasting.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28ti
  - number: 28ti.2
    text: |-
      Indien een reeds ingediende btw-melding naderhand moet worden gewijzigd, worden deze wijzigingen uiterlijk drie
      jaren na de datum waarop de oorspronkelijke btw-melding overeenkomstig [artikel 28th][ref1] moest worden ingediend
      in een volgende btw-melding opgenomen. In die volgende btw-melding staan de betrokken lidstaat van verbruik, het
      belastingtijdvak en het btw-bedrag waarvoor wijzigingen nodig zijn, vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28th
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28ti
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28th
        hoofdstuk: V
        paragraaf: '4'
        afdeling: '7'
  - number: 28ti.3
    text: |-
      Met betrekking tot de in Nederland ingediende btw-melding is
      [Hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref1] van overeenkomstige toepassing als ware de
      betaalde belasting op aangifte voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28ti
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: V
  - number: 28tj.1
    text: De btw-melding wordt in euro verricht.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28tj
  - number: 28tj.2
    text: |-
      Indien de leveringen in een andere munteenheid luiden, hanteert de ondernemer die van de invoerregeling
      gebruikmaakt, of zijn tussenpersoon, bij het invullen van de btw-melding de wisselkoers die gold op de laatste
      dag van de desbetreffende kalendermaand. De omwisseling geschiedt volgens de wisselkoersen die de Europese
      Centrale Bank voor die dag bekend heeft gemaakt of, wanneer die dag geen bekendmaking heeft plaatsgevonden, op de
      eerstvolgende dag van bekendmaking.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28tj
  - number: 28tk.1
    text: |-
      De ondernemer die van de invoerregeling gebruikmaakt, of zijn tussenpersoon, voldoet de btw onder verwijzing
      naar de betreffende btw-melding, uiterlijk bij het verstrijken van het moment waarop de btw-melding moet worden
      ingediend. De belasting wordt overgemaakt naar een door de lidstaat van identificatie opgegeven bankrekening in
      euro, dan wel naar een bankrekening in hun eigen valuta van lidstaten die de euro niet als munteenheid hebben
      aangenomen, indien die lidstaten dat eisen.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28tk
  - number: 28tk.2
    text: De ondernemer die voor Nederland heeft gekozen als lidstaat van identificatie voldoet de btw bij de ontvanger.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28tk
  - number: 28tl.1
    text: |-
      De ondernemer die van de invoerregeling gebruik maakt, past met betrekking tot de voorbelasting die verband houdt
      met zijn aan de invoerregeling onderworpen belastbare activiteiten geen btw-aftrek toe in de lidstaten van verbruik
      overeenkomstig artikel 168 van BTW-richtlijn 2006. In afwijking van artikel 1, onderdeel 1, van de Dertiende
      [Richtlijn 86/560/EEG](31986L0560) van de Raad van 17 november 1986 betreffende de harmonisatie van de wetgevingen
      der Lid-Staten inzake omzetbelasting – Regeling voor de teruggaaf van de belasting over de toegevoegde waarde
      aan niet op het grondgebied van de Gemeenschap gevestigde belastingplichtigen (PbEG 1986, L 326) en artikel 2,
      eerste lid, en artikel 3 van [Richtlijn 2008/9/EG](32008L0009) van de Raad van 12 februari 2008 tot vaststelling
      van nadere voorschriften voor de in [Richtlijn 2006/112/EG](32006L0112) vastgestelde teruggaaf van de belasting
      over de toegevoegde waarde aan belastingplichtigen die niet in de lidstaat van teruggaaf maar in een andere
      lidstaat gevestigd zijn (PbEU 2008, L 44) wordt deze ondernemer teruggaaf verleend overeenkomstig die richtlijnen.
      Artikel 2, tweede en derde lid, en artikel 4, tweede lid, van genoemde [Richtlijn 86/560/EEG](31986L0560) zijn niet
      van toepassing op de teruggaaf die verband houdt met onder de invoerregeling vallende goederen.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28tl
  - number: 28tl.2
    text: |-
      Indien de ondernemer die van de invoerregeling gebruikmaakt, in een lidstaat moet worden geïdentificeerd voor
      activiteiten die niet onder de invoerregeling vallen, brengt hij de in die lidstaat betaalde voorbelasting die
      verband houdt met zijn aan de invoerregeling onderworpen belastbare activiteiten, in aftrek op de overeenkomstig
      artikel 250 van BTW-richtlijn 2006 in te dienen aangifte.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28tl
  - number: 28tm.1
    text: |-
      Indien de belasting die verschuldigd is over in Nederland geleverde goederen als bedoeld in deze paragraaf,
      ongeacht de keuze van de lidstaat van identificatie, geheel of gedeeltelijk niet is betaald, kan de inspecteur
      met toepassing van [artikel 20 van de Algemene wet inzake rijksbelastingen][ref1] de te weinig geheven belasting
      naheffen. De [artikelen 30h][ref2], [30ha][ref3], [67c][ref4] en [67f][ref5] van die wet zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel30h
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel30ha
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel67c
      [ref5]: https://wetten.overheid.nl/BWBR0002320#Artikel67f
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28tm
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 30h
      - id: ref3
        bwb_id: BWBR0002320
        artikel: 30ha
      - id: ref4
        bwb_id: BWBR0002320
        artikel: 67c
      - id: ref5
        bwb_id: BWBR0002320
        artikel: 67f
  - number: 28tm.2
    text: |-
      Indien het totaal van de belasting op de btw-melding voor Nederland over een belastingtijdvak negatief is, wordt de
      btw-melding voor dat totaal aangemerkt als een verzoek om teruggaaf van belasting.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28tm
  - number: 28tm.3
    text: De inspecteur beslist op het verzoek om teruggaaf bij voor bezwaar vatbare beschikking
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28tm
  - number: 28tm.4
    text: |-
      Op de verzoeken om teruggaaf van belasting is [afdeling 4.1.3 van de Algemene wet bestuursrecht][ref1] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.3
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28tm
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.3
  - number: 28tn.1
    text: |-
      De ondernemer die van de invoerregeling gebruikmaakt, voert van alle onder de invoerregeling vallende handelingen
      een boekhouding. Een tussenpersoon voert voor alle door hem vertegenwoordigde ondernemers een boekhouding. Deze
      boekhouding moet voldoende gegevens bevatten om de belastingautoriteiten van de lidstaat van verbruik in staat te
      stellen de juistheid van de aangifte te bepalen.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28tn
  - number: 28tn.2
    text: |-
      Desgevraagd moet de boekhouding, bedoeld in het eerste lid, langs elektronische weg aan de lidstaat van verbruik en
      aan de lidstaat van identificatie beschikbaar worden gesteld. De boekhouding wordt bewaard gedurende tien jaren na
      afloop van het jaar waarin de handeling is verricht.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28tn
  - number: 28u
    text: |-
      Indien voor de invoer van goederen, met uitzondering van accijnsgoederen, in zendingen met een
      intrinsieke waarde van niet meer dan € 150 geen gebruik wordt gemaakt van de invoerregeling, bedoeld in
      [afdeling 7, paragraaf 4][ref1], kan de persoon die voor de goederen voor het plaatsen onder de regeling in
      het vrije verkeer brengen in Nederland een douaneaangifte doet voor rekening van de persoon voor wie de goederen
      bestemd zijn, gebruikmaken van de regeling post- en koeriersdiensten met betrekking tot goederen waarvan de
      verzending of het vervoer in Nederland wordt beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28u
    references:
      - id: ref1
        bwb_id: BWBR0002629
        hoofdstuk: V
        paragraaf: '4'
        afdeling: '7'
  - number: 28v.1
    text: |-
      Voor de toepassing van de regeling post- en koeriersdiensten wordt de belasting bij invoer overeenkomstig
      [artikel 22, eerste lid][ref1], geheven van de persoon die de douaneaangifte doet voor het plaatsen van de
      goederen onder de regeling in het vrije verkeer brengen in Nederland, met dien verstande dat voor de toepassing
      van deze regeling geen zekerheid behoeft te worden gesteld voor de verschuldigde omzetbelasting wanneer uitstel van
      betaling als bedoeld in artikel 110 van het Douanewetboek van de Unie wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel22
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28v
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '22'
        hoofdstuk: III
        afdeling: '4'
  - number: 28v.2
    text: |-
      De persoon voor wie de goederen bestemd zijn, is gehouden tot betaling van de omzetbelasting die de persoon,
      bedoeld in het eerste lid, bij hem in rekening brengt, voor zover deze belasting door die laatste is verschuldigd
      ingevolge dat eerste lid. Deze persoon neemt passende maatregelen om te garanderen dat het juiste bedrag aan
      belastingen wordt betaald.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28v
  - number: 28w.1
    text: |-
      De personen die gebruikmaken van de regeling post- en koeriersdiensten houden van alle onder de regeling post- en
      koeriersdiensten vallende handelingen een boekhouding bij. Deze boekhouding moet voldoende gegevens bevatten voor
      de inspecteur om de juistheid van de aangegeven belasting te beoordelen.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28w
  - number: 28w.2
    text: |-
      Desgevraagd moet de boekhouding, bedoeld in het eerste lid, langs elektronische weg aan de inspecteur beschikbaar
      worden gesteld. De boekhouding wordt bewaard gedurende tien jaren na afloop van het kalenderjaar waarin de
      aangiften zijn gedaan.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28w
  - number: 28y
    text: |-
      De belasting, verschuldigd ter zake van de invoer en de levering aan veilingen van vis, schaal-, schelp- en
      weekdieren die worden aangebracht per schip dat terugkeert van de visvangst, of per ventjager, bedraagt nihil.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28y
  - number: 28z.1
    text: |-
      Deze afdeling en de daarop berustende bepalingen zijn van toepassing op de handelingen van reisbureaus, voor
      zover de reisbureaus op eigen naam tegenover de reiziger handelen en zij voor de totstandbrenging van de reizen
      gebruikmaken van de leveringen van goederen en diensten van andere ondernemers.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28z
  - number: 28z.2
    text: |-
      Voor de toepassing van deze afdeling en de daarop berustende bepalingen worden reisorganisatoren (touroperators)
      als reisbureaus beschouwd.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28z
  - number: 28za
    text: |-
      De onder de voorwaarden van [artikel 28z][ref1] verrichte handelingen van het reisbureau met het oog op de
      totstandkoming van de reis, worden beschouwd als één enkele dienst die het reisbureau voor de reiziger verricht
      (reisdienst). De plaats van deze dienst is de plaats waar het reisbureau de zetel van zijn bedrijfsuitoefening of
      een vaste inrichting heeft gevestigd van waaruit het de dienst heeft verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28z
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28za
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28z
        hoofdstuk: V
        afdeling: '10'
  - number: 28zb.1
    text: 'Ter zake van reisdiensten wordt de belasting naar keuze van het reisbureau berekend over:'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28zb
  - number: 28zb.1.a
    text: de winstmarge per tijdvak van aangifte, de omzetbelasting niet daaronder begrepen, of
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28zb
  - number: 28zb.1.b
    text: de winstmarge per reis, de omzetbelasting niet daaronder begrepen.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28zb
  - number: 28zb.2
    text: |-
      De winstmarge per tijdvak van aangifte is het verschil tussen de som van de vergoedingen, de omzetbelasting
      daaronder begrepen, in dat tijdvak ter zake van reisdiensten en de som van de in dat tijdvak werkelijk door het
      reisbureau gedragen kosten voor goederen en diensten van andere ondernemers, mits deze goederen en diensten de
      reiziger rechtstreeks ten goede komen.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28zb
  - number: 28zb.3
    text: |-
      De winstmarge per reis is het verschil tussen de vergoeding, de omzetbelasting daaronder begrepen, ter zake van de
      reisdienst en de werkelijk door het reisbureau gedragen kosten voor goederen en diensten van andere ondernemers,
      mits deze goederen en diensten de reiziger rechtstreeks ten goede komen.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28zb
  - number: 28zb.4
    text: |-
      Bij ministeriële regeling kunnen nadere regels ten aanzien van de in het eerste lid bedoelde keuze en
      overgangsregels ten aanzien van het wijzigen van deze keuze worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28zb
  - number: 28zc
    text: |-
      Indien de handelingen waarvoor het reisbureau een beroep doet op andere ondernemers, door laatstgenoemden buiten
      de Unie worden verricht, wordt de dienst van het reisbureau gelijkgesteld met de in de bij deze wet behorende
      [tabel II, onderdeel b, post 4][ref1], genoemde handeling van een tussenpersoon. Indien de in de eerste volzin
      bedoelde handelingen zowel binnen als buiten de Unie worden verricht, mag alleen het gedeelte van de dienst van het
      reisbureau betreffende de buiten de Unie verrichte handelingen als zodanig gelijkgesteld worden beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28zc
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: 28zd.1
    text: |-
      Ingeval in een tijdvak van aangifte in een kalenderjaar, het laatste tijdvak van aangifte in een
      kalenderjaar uitgezonderd, de winstmarge per tijdvak van aangifte, de omzetbelasting niet daaronder
      begrepen, (tijdvakwinstmarge) negatief is, wordt deze negatieve tijdvakwinstmarge verrekend met een positieve
      tijdvakwinstmarge, of opgeteld bij een negatieve tijdvakwinstmarge, die in het volgende belastingtijdvak wordt
      gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28zd
  - number: 28zd.2
    text: |-
      Na afloop van een kalenderjaar wordt voor dat kalenderjaar de tijdvakwinstmarge op jaarbasis vastgesteld
      (jaarsaldo). Ingeval het jaarsaldo negatief is, wordt dit negatieve jaarsaldo opgeteld bij de ten behoeve van
      de vaststelling van het jaarsaldo van het daaropvolgende kalenderjaar op jaarbasis herrekende som. Ingeval de
      belasting over dat aldus berekende jaarsaldo minder bedraagt dan het bedrag aan belasting dat over het kalenderjaar
      is of moet worden voldaan ter zake van reisdiensten wordt het verschil op verzoek aan het reisbureau teruggegeven.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28zd
  - number: 28zd.3
    text: |-
      Het vaststellen van het bedrag van de teruggaaf, bedoeld in het tweede lid, geschiedt bij voor bezwaar vatbare
      beschikking. Het verzoek wordt gedaan binnen zes maanden na afloop van het kalenderjaar waarop het verzoek
      betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28zd
  - number: 28ze
    text: |-
      De belasting die aan het reisbureau in rekening wordt gebracht door andere ondernemers voor de in
      [artikel 28z][ref1], eerste lid, bedoelde handelingen welke de reiziger rechtstreeks ten goede komen, komt niet
      voor aftrek of teruggaaf in aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28z
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28ze
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28z
        hoofdstuk: V
        afdeling: '10'
  - number: 28zf.1
    text: |-
      Ter zake van de reisdiensten wordt voor de toepassing van [artikel 35a, eerste lid, onderdeel h][ref1], de
      omzetbelasting begrepen onder de vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel35a
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28zf
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 35a
        hoofdstuk: VI
        afdeling: '4'
  - number: 28zf.2
    text: |-
      Het is het reisbureau niet toegestaan om de belasting afzonderlijk te vermelden op de ter zake van de reisdienst
      uit te reiken factuur.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28zf
  - number: 28zf.3
    text: |-
      [Artikel 35a, eerste lid, onderdeel j][ref1], is niet van toepassing ter zake van reisdiensten.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel35a
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28zf
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 35a
        hoofdstuk: VI
        afdeling: '4'
  - number: 28zg
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld inzake de toepassing van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28zg
  - number: 28zh.1
    text: |-
      Iedere overdracht van een voucher voor enkelvoudig gebruik door een ondernemer die in eigen naam handelt, wordt
      beschouwd als een levering van de goederen onderscheidenlijk de verrichting van diensten waarop de voucher
      betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28zh
  - number: 28zh.2
    text: |-
      De feitelijke overhandiging van de goederen of de feitelijke dienstverrichting, in ruil voor een door de verrichter
      van de goederenlevering of dienst als volledige of gedeeltelijke tegenprestatie aanvaarde voucher voor enkelvoudig
      gebruik, wordt niet als een zelfstandige handeling beschouwd.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28zh
  - number: 28zh.3
    text: |-
      Indien de overdracht van een voucher voor enkelvoudig gebruik wordt verricht door een ondernemer die in naam van
      een andere ondernemer handelt, wordt die overdracht beschouwd als de levering van de goederen onderscheidenlijk
      de verrichting van de diensten waarop de voucher betrekking heeft door de andere ondernemer in wiens naam de
      ondernemer handelt.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28zh
  - number: 28zh.4
    text: |-
      Indien de verrichter van de goederenlevering of dienst niet de ondernemer is die, handelend in eigen naam, de
      voucher voor enkelvoudig gebruik heeft uitgegeven, wordt die verrichter met betrekking tot die voucher evenwel
      geacht de goederenlevering aan of dienst ten behoeve van die ondernemer te hebben verricht.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28zh
  - number: 28zi.1
    text: |-
      De feitelijke overhandiging van de goederen of de feitelijke verrichting van de diensten in ruil voor een door de
      verrichter van de goederenlevering of dienst als volledige of gedeeltelijke tegenprestatie aanvaarde voucher voor
      meervoudig gebruik, is aan de belasting onderworpen, terwijl iedere voorafgaande overdracht van deze voucher voor
      meervoudig gebruik niet aan belasting is onderworpen.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28zi
  - number: 28zi.2
    text: |-
      Indien de voucher voor meervoudig gebruik wordt overgedragen door een ondernemer die niet de ondernemer
      is die overeenkomstig het vorige lid de aan belasting onderworpen handeling verricht, zijn alle vormen van
      dienstverrichting, zoals distributie- of promotiediensten, onderworpen aan belasting.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28zi
  - number: 28zj
    text: |-
      Onverminderd het bepaalde in [artikel 8, eerste en tweede lid][ref1], is de maatstaf van heffing voor de
      met betrekking tot een voucher voor meervoudig gebruik verrichte goederenlevering of dienst gelijk aan de
      tegenprestatie die betaald is voor de voucher of, bij ontstentenis van informatie over die tegenprestatie, de op de
      voucher voor meervoudig gebruik zelf of in de bijbehorende documentatie vermelde monetaire waarde, verminderd met
      het belastingbedrag over de geleverde goederen of de verrichte diensten.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel8
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel28zj
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
  - number: '29.1'
    text: |-
      In geval van annulering, verbreking, ontbinding of gehele of gedeeltelijke niet-betaling, of in geval van
      prijsvermindering nadat de goederenlevering of dienst is verricht, wordt de maatstaf van heffing dienovereenkomstig
      verlaagd en ontstaat voor de ondernemer in zoverre recht op teruggaaf van de door hem voldane belasting.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel29
  - number: '29.2'
    text: |-
      Het recht op teruggaaf ontstaat op het tijdstip waarop de annulering, verbreking, ontbinding, gehele of
      gedeeltelijke niet-betaling of de prijsvermindering komen vast te staan, met dien verstande dat in geval van gehele
      of gedeeltelijke niet-betaling van de in rekening gebrachte vergoeding het recht op teruggaaf geacht wordt te zijn
      ontstaan uiterlijk één jaar na het tijdstip waarop de vergoeding opeisbaar is geworden.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel29
  - number: '29.3'
    text: |-
      In afwijking van het eerste lid ontstaat bij annulering, verbreking of ontbinding van de overeenkomst tot
      goederenlevering of dienstverrichting en bij prijsvermindering nadat de goederenlevering of dienst is verricht
      geen recht op teruggaaf voor de ondernemer voor zover aan de afnemer of diens rechtverkrijgende terugbetaling wordt
      verricht door een ander dan de ondernemer.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel29
  - number: '29.4'
    text: |-
      Het bedrag van de teruggaaf wordt in mindering gebracht in de aangifte voor het tijdvak waarin het recht op
      teruggaaf is ontstaan.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel29
  - number: '29.5'
    text: |-
      Voor zover de vergoeding in de gevallen, bedoeld in het tweede lid, alsnog geheel of gedeeltelijk wordt ontvangen
      nadat het recht op teruggaaf is ontstaan, wordt de ondernemer de belasting ter zake van de alsnog ontvangen
      vergoeding verschuldigd op het tijdstip waarop die vergoeding wordt ontvangen. [Artikel 14, eerste lid][ref1], is
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel14
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '14'
        hoofdstuk: II
        afdeling: '4'
  - number: '29.6'
    text: |-
      Ingeval een ondernemer zijn vordering ter zake van de levering van goederen of diensten geheel of gedeeltelijk
      overdraagt aan een andere ondernemer, treedt deze andere ondernemer met betrekking tot die vordering of het
      overgedragen gedeelte daarvan voor de toepassing van het eerste, tweede, en derde lid op het tijdstip van die
      overdracht in de plaats van de ondernemer die de vordering overdraagt. Wanneer de andere ondernemer ter zake van
      de overgenomen vordering een recht op teruggaaf verkrijgt, wordt de teruggaaf in afwijking van het vierde lid op
      verzoek verleend. Het vijfde lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel29
  - number: '29.7'
    text: |-
      De ondernemer die ingevolge [artikel 15][ref1] belasting in aftrek heeft gebracht ter zake van aan hem verrichte
      leveringen van goederen en diensten, wordt het afgetrokken bedrag naar evenredigheid als belasting verschuldigd
      op het tijdstip waarop komt vast te staan dat hij de vergoeding waarop dat bedrag betrekking heeft, niet of
      niet geheel zal betalen dan wel geheel of gedeeltelijk heeft terugontvangen. De belasting wordt in ieder geval
      verschuldigd één jaar na het opeisbaar worden van de vergoeding voor zover deze op dat tijdstip nog niet is
      betaald. [Artikel 14, eerste lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel14
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '15'
        hoofdstuk: II
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '14'
        hoofdstuk: II
        afdeling: '4'
  - number: '29.8'
    text: |-
      Ingeval de ondernemer, bedoeld in het zevende lid, nadat hij de belasting, bedoeld in dat lid, heeft voldaan alsnog
      de vergoeding geheel of gedeeltelijk betaalt, ontstaat voor hem op dat tijdstip opnieuw recht op aftrek van de
      ter zake alsnog voldane belasting als ware het belasting bedoeld in [artikel 15, eerste lid, onderdeel a][ref1].
      Artikel 15 is van overeenkomstige toepassing, waarbij voor de toepassing van artikel 15, vierde lid, eerste volzin,
      de aftrek plaatsvindt overeenkomstig de bestemming van de goederen en diensten op het tijdstip waarop de belasting
      ter zake van de levering daarvan in rekening is gebracht. Een eventuele herziening van de aftrek ter zake van de
      belastingtijdvakken tussen het tijdstip waarop het recht op aftrek aanvankelijk en het tijdstip waarop dat opnieuw
      ontstond, geschiedt in het tijdvak waarin het recht op aftrek opnieuw ontstaat. De toepassing van de tweede en
      derde volzin geschiedt overeenkomstig de in de desbetreffende tijdvakken geldende wettelijke bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '15'
        hoofdstuk: II
        afdeling: '4'
  - number: '29.9'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld waarin het eerste tot en met het vijfde, zevende en
      achtste lid niet van toepassing worden verklaard op bedragen die niet zijn ontvangen onderscheidenlijk betaald ten
      gevolge van een korting voor contante betaling.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel29
  - number: '29.10'
    text: |-
      Het verzoek om teruggaaf, bedoeld in het zesde lid, wordt, in afwijking van
      [artikel 31, eerste en tweede lid][ref1], ter zake van elke vordering afzonderlijk ingediend bij de inspecteur. Bij
      ministeriële regeling worden nadere regels gesteld over de vorm en de inhoud van het verzoek en de wijze waarop het
      verzoek wordt ingediend. Artikel 31, achtste en negende lid, zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel31
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '31'
        hoofdstuk: VI
        afdeling: '1'
  - number: 29a.1
    text: |-
      Op verzoek wordt teruggaaf verleend van de belasting ter zake van intracommunautaire verwerving van goederen, voor
      zover de vergoeding wordt terugbetaald omdat een vermindering van de vergoeding is verleend of omdat de goederen
      in ongebruikte staat zijn teruggezonden. De teruggaaf wordt slechts verleend voor zover de ondernemer de belasting
      niet in aftrek heeft gebracht.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel29a
  - number: 29a.2
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld waarin het eerste lid niet van toepassing wordt
      verklaard op bedragen welke niet zijn betaald ten gevolge van een korting voor contante betaling.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel29a
  - number: '30.1'
    text: |-
      Op verzoek wordt teruggaaf verleend van de belasting ter zake van intracommunautaire verwerving van goederen in de
      gevallen waarin de belasting is geheven met toepassing van [artikel 17b, tweede lid][ref1], en door belanghebbende
      wordt aangetoond dat ter zake van dezelfde verwerving belasting is geheven in de lidstaat van aankomst van de
      verzending of het vervoer.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel17b
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 17b
        hoofdstuk: IIA
        afdeling: '1'
  - number: '30.2'
    text: |-
      Op verzoek wordt naar evenredigheid teruggaaf verleend van de belasting ter zake van intracommunautaire
      verwerving van accijnsgoederen in de gevallen waarin na het tijdstip waarop die intracommunautaire verwerving van
      accijnsgoederen is verricht de in de lidstaat van vertrek van de verzending of het vervoer van die goederen voldane
      accijns door de afnemer is terugontvangen.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel30
  - number: '30.3'
    text: |-
      Op verzoek wordt teruggaaf verleend van de belasting ter zake van invoer van goederen door een rechtspersoon,
      andere dan ondernemer, welke goederen zijn verzonden of vervoerd uit een derdelandsgebied of derde-land met
      als bestemming een andere lidstaat, indien belanghebbende aantoont dat in die andere lidstaat ter zake van
      intracommunautaire verwerving van die goederen belasting is geheven.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel30
  - number: '31.1'
    text: |-
      Een verzoek om teruggaaf van belasting geschiedt bij de aangifte over het tijdvak waarin het recht op teruggaaf
      is ontstaan.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel31
  - number: '31.2'
    text: |-
      In gevallen waarin geen aangifte op de voet van [artikel 14][ref1] moet worden ingediend, geschiedt een verzoek om
      teruggaaf door het doen van aangifte.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel14
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '14'
        hoofdstuk: II
        afdeling: '4'
  - number: '31.3'
    text: |-
      Indien een verzoek om teruggaaf als bedoeld in het tweede lid, wordt gedaan door een ondernemer die niet in
      Nederland woont of is gevestigd en aldaar geen vaste inrichting heeft van waaruit zakelijke handelingen worden
      verricht, maar die is gevestigd in een andere lidstaat, is het bepaalde in [afdeling 2, paragrafen 1][ref1] en
      [2][ref2] mede van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#HoofdstukVI
      [ref2]: https://wetten.overheid.nl/BWBR0002629#HoofdstukVI
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002629
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002629
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '2'
  - number: '31.4'
    text: |-
      Indien een verzoek om teruggaaf als bedoeld in het tweede lid, wordt ingediend door een ondernemer die niet
      in Nederland en niet in de Unie woont of is gevestigd en aldaar geen vaste inrichting heeft, dient het verzoek
      betrekking te hebben op belasting waarvoor het recht op teruggaaf is ontstaan in een tijdvak van ten minste drie
      maanden en ten hoogste een kalenderjaar. Het tijdvak mag evenwel korter zijn dan drie maanden indien deze periode
      het resterende deel van een kalenderjaar betreft. De verzoeken kunnen mede belasting betreffen waarvoor het recht
      op teruggaaf is ontstaan in een ander tijdvak van hetzelfde kalenderjaar, maar waarvoor eerder geen verzoek om
      teruggaaf werd ingediend. Het verzoek moet worden ingediend binnen zes maanden na afloop van het kalenderjaar
      waarin het recht op teruggaaf is ontstaan.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel31
  - number: '31.5'
    text: |-
      Indien een verzoek om teruggaaf als bedoeld in het tweede lid, wordt ingediend door een ander dan een ondernemer
      genoemd in het derde lid of vierde lid, dient het verzoek betrekking te hebben op belasting waarvoor het recht op
      teruggaaf is ontstaan in een kwartaal en moet het verzoek worden ingediend binnen drie maanden na afloop van dat
      kwartaal.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel31
  - number: '31.6'
    text: |-
      In gevallen als bedoeld in het vierde lid, wordt in afwijking van [artikel 17][ref1] geen teruggaaf verleend indien
      het verzoek betrekking heeft op een bedrag aan belasting van minder dan € 400. Betreft een verzoek om teruggaaf als
      is bedoeld in het vierde lid evenwel een kalenderjaar of het resterende gedeelte daarvan, dan moet het bedrag aan
      belasting waarop het verzoek betrekking heeft ten minste € 50 belopen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel17
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '17'
        hoofdstuk: II
        afdeling: '4'
  - number: '31.7'
    text: |-
      Een ondernemer die niet in de Unie woont of is gevestigd en in Nederland geen vaste inrichting heeft, behoeft bij
      een verzoek om teruggaaf, in afwijking van [artikel 57 van de Algemene wet inzake rijksbelastingen][ref1], geen
      domicilie in Nederland te kiezen. Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de wijze
      waarop deze ondernemers moeten aantonen, dat zij ondernemer zijn in de zin van [artikel 7][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel7
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '57'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '7'
        hoofdstuk: II
        afdeling: 1c
  - number: '31.8'
    text: De inspecteur beslist op het verzoek om teruggaaf bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel31
  - number: '31.9'
    text: |-
      Op de verzoeken om teruggaaf van belasting, bedoeld in het eerste en tweede lid, is
      [afdeling 4.1.3 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.3
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.3
  - number: '32'
    text: 'Voor de toepassing van deze afdeling en de daarop gebaseerde bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32
  - number: 32.a
    text: |-
      niet in de lidstaat van teruggaaf gevestigde ondernemer: iedere ondernemer in de zin van
      [artikel 7, eerste en tweede lid][ref1], die niet in de lidstaat van teruggaaf, maar in een andere lidstaat
      gevestigd is;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel7
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '7'
        hoofdstuk: II
        afdeling: 1c
  - number: 32.b
    text: |-
      lidstaat van teruggaaf: de lidstaat waar de belasting aan de niet in de lidstaat van teruggaaf gevestigde
      ondernemer in rekening werd gebracht ter zake van de voor genoemde ondernemer door andere ondernemers in deze
      lidstaat verrichte diensten of goederenleveringen, dan wel ter zake van de invoer van goederen in deze lidstaat;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32
  - number: 32.c
    text: 'teruggaaftijdvak: het tijdvak waarop het teruggaafverzoek betrekking heeft;'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32
  - number: 32.d
    text: |-
      teruggaafverzoek: het verzoek om teruggaaf van de aan de niet in de lidstaat van teruggaaf gevestigde ondernemer
      in rekening gebrachte belasting ter zake van de voor genoemde ondernemer door andere ondernemers in deze lidstaat
      verrichte diensten of goederenleveringen, of ter zake van de invoer van goederen in deze lidstaat;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32
  - number: 32.e
    text: 'aanvrager: de niet in de lidstaat van teruggaaf gevestigde ondernemer die het teruggaafverzoek doet.'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32
  - number: 32a.1
    text: |-
      Betreft het teruggaafverzoek een teruggaaftijdvak van minder dan één kalenderjaar, doch van ten minste drie
      maanden, dan moet het belastingbedrag waarop het teruggaafverzoek betrekking heeft ten minste 400 euro of de
      tegenwaarde daarvan in de nationale munteenheid belopen.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32a
  - number: 32a.2
    text: |-
      Betreft het teruggaafverzoek een teruggaaftijdvak van een kalenderjaar of het resterende gedeelte van een
      kalenderjaar, dan moet het belastingbedrag ten minste 50 euro of de tegenwaarde daarvan in de nationale munteenheid
      belopen.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32a
  - number: 32b
    text: |-
      Een niet in Nederland gevestigde ondernemer kan een teruggaafverzoek doen voor in Nederland in rekening gebrachte
      belasting ter zake van aan hem door andere ondernemers in Nederland verrichte diensten of goederenleveringen dan
      wel ter zake van de invoer, indien hij aan de volgende voorwaarden voldoet:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32b
  - number: 32b.a
    text: |-
      tijdens het tijdvak van teruggaaf heeft hij in Nederland noch de zetel van zijn bedrijfsuitoefening gehad, noch een
      vaste inrichting van waaruit zakelijke handelingen werden verricht, noch, bij gebreke van een dergelijke zetel of
      vaste inrichting, zijn woonplaats of zijn gebruikelijke verblijfplaats;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32b
  - number: 32b.b
    text: |-
      tijdens het tijdvak van teruggaaf heeft hij geen goederenleveringen of diensten verricht waarvan de plaats geacht
      wordt in Nederland te zijn gelegen, met uitzondering van de volgende handelingen:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32b
  - number: 32b.b.1°
    text: |-
      vervoerdiensten en daarmee samenhangende diensten die vrijgesteld zijn krachtens
      [artikel 39 van de Algemene wet inzake rijksbelastingen][ref1] dan wel vallen onder het tarief van nihil krachtens
      [artikel 9, tweede lid, onderdeel b][ref2], en de bij deze wet behorende [tabel II][ref3], onderdeel b, post 1, 2,
      4 of 5;


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32b
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '39'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '9'
        hoofdstuk: II
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002629
  - number: 32b.b.2°
    text: |-
      goederenleveringen of dienstverrichtingen waarvan de afnemer krachtens
      [artikel 12, tweede, derde of vijfde lid][ref1], de belasting verschuldigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel12
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '12'
        hoofdstuk: II
        afdeling: '4'
  - number: 32c
    text: 'Deze paragraaf is niet van toepassing ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32c
  - number: 32c.a
    text: ingevolge deze wet incorrect gefactureerde belastingbedragen;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32c
  - number: 32c.b
    text: |-
      gefactureerde belastingbedragen voor goederenleveringen die krachtens [artikel 9, tweede lid, onderdeel b][ref1],
      en de bij deze wet behorende [tabel II][ref2], onderdeel a, post 6, onder het tarief van nihil vallen;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32c
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '9'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002629
  - number: 32c.c
    text: |-
      gefactureerde belastingbedragen voor leveringen van goederen die door of voor rekening van een niet in Nederland
      gevestigde afnemer worden verzonden of vervoerd naar een plaats buiten de Unie, welke leveringen krachtens
      [artikel 9, tweede lid, onderdeel b][ref1], en de bij deze wet behorende [bijlage II][ref2], onderdeel a, post 2,
      onder het tarief van nihil vallen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32c
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '9'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002629
  - number: 32d.1
    text: |-
      De niet in Nederland gevestigde ondernemer wordt op verzoek teruggaaf verleend van de belasting die werd geheven
      ter zake van de aan hem door andere ondernemers in Nederland verrichte goederenleveringen of diensten, of ter zake
      van de invoer van goederen in Nederland, voor zover deze goederen of diensten worden gebruikt voor de volgende
      handelingen:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32d
  - number: 32d.1.a
    text: |-
      de handelingen bedoeld in [artikel 15, tweede lid, onderdelen a en b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32d
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '15'
        hoofdstuk: II
        afdeling: '4'
  - number: 32d.1.b
    text: |-
      handelingen, waarvan de afnemer overeenkomstig [artikel 12, tweede tot en met vijfde lid][ref1], tot voldoening van
      de belasting is gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel12
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32d
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '12'
        hoofdstuk: II
        afdeling: '4'
  - number: 32d.2
    text: |-
      Onverminderd het bepaalde in [artikel 32e][ref1] wordt voor de toepassing van deze afdeling het recht op teruggaaf
      van voorbelasting bepaald overeenkomstig de daarvoor geldende bepalingen van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel32e
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32d
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 32e
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '2'
  - number: 32e.1
    text: |-
      Om in Nederland recht te hebben op teruggaaf verricht een niet in Nederland gevestigde ondernemer handelingen die
      in de lidstaat van vestiging een recht op aftrek doen ontstaan.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32e
  - number: 32e.2
    text: |-
      Wanneer een niet in Nederland gevestigde ondernemer in de lidstaat waar hij gevestigd is, zowel handelingen
      verricht die in die lidstaat een recht op aftrek doen ontstaan, als handelingen die in die lidstaat geen recht
      op aftrek doen ontstaan, kan van het overeenkomstig [artikel 32d][ref1] voor teruggaaf in aanmerking komende
      bedrag slechts dat gedeelte van de belasting door Nederland worden teruggegeven dat overeenkomstig artikel 173
      van BTW-richtlijn 2006, zoals toegepast door de lidstaat van vestiging, aan eerstgenoemde handelingen kan worden
      toegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel32d
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32e
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 32d
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '2'
  - number: 32f.1
    text: |-
      Een niet in Nederland gevestigde ondernemer die in Nederland teruggaaf van de belasting wenst te verkrijgen, richt
      langs elektronische weg een teruggaafverzoek tot Nederland, dat hij indient bij zijn lidstaat van vestiging, via de
      door deze lidstaat ingestelde portaalsite.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32f
  - number: 32f.2
    text: |-
      Het verzoek bevat alle informatie die daartoe bij ministeriële regeling is voorgeschreven overeenkomstig het
      bepaalde in de artikelen 8 en 9, lid 1, van Richtlijn 2008/9/EG van de Raad van 12 februari 2008 tot vaststelling
      van nadere voorschriften voor de in Richtlijn 2006/112/EG vastgestelde teruggaaf van de belasting over de
      toegevoegde waarde aan belastingplichtigen die niet in de lidstaat van teruggaaf maar in een andere lidstaat
      gevestigd zijn (PbEU 2008, L 44).
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32f
  - number: 32f.3
    text: |-
      Bij ministeriële regeling kan worden bepaald dat de aanvrager langs elektronische weg aanvullende gegevens
      verstrekt met betrekking tot iedere in artikel 9, lid 1, van Richtlijn 2008/9/EG, genoemd in het tweede lid,
      vermelde code, voor zover die gegevens noodzakelijk zijn wegens in Nederland geldende beperkingen van het recht op
      aftrek of voor de toepassing van een krachtens artikel 395 of 396 van BTW-richtlijn 2006 aan Nederland verleende,
      voor dit geval relevante afwijking.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32f
  - number: 32f.4
    text: |-
      [Artikel 57 van de Algemene wet inzake rijksbelastingen][ref1] is niet van toepassing met betrekking tot
      ondernemers die een verzoek doen als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel57
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32f
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '57'
  - number: 32g
    text: |-
      Bij ministeriële regeling kan worden bepaald dat de aanvrager, onverminderd de krachtens [artikel 32n][ref1]
      verlangde gegevens, tezamen met het teruggaafverzoek langs elektronische weg een afschrift van de factuur of het
      invoerdocument overlegt, wanneer de maatstaf van heffing op de factuur of het invoerdocument 1000 euro of meer
      beloopt. Indien de factuur betrekking heeft op brandstof, is dit drempelbedrag 250 euro.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel32n
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32g
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 32n
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '2'
  - number: 32h
    text: |-
      Bij ministeriële regeling kan worden bepaald dat de aanvrager tezamen met het teruggaafverzoek zijn
      beroepsactiviteit omschrijft aan de hand van de geharmoniseerde codes die worden bepaald volgens artikel 34
      bis, lid 3, tweede alinea, van Verordening (EG) nr. 1798/2003 van de Raad van 7 oktober 2003 betreffende de
      administratieve samenwerking op het gebied van de belasting over de toegevoegde waarde en tot intrekking van
      Verordening (EEG) nr. 218/92 (PbEU 2003, L 264).
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32h
  - number: 32i
    text: |-
      Bij ministeriële regeling wordt bepaald welke taal of talen de aanvrager kan gebruiken voor het verstrekken van de
      gegevens in het teruggaafverzoek of van mogelijke andere aanvullende gegevens die moeten worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32i
  - number: 32j.1
    text: |-
      Indien het vermelde pro rata voor de toepassing van de aftrek overeenkomstig artikel 175 van BTW-richtlijn 2006 na
      de indiening van het teruggaafverzoek wordt aangepast, corrigeert de aanvrager het bedrag dat wordt teruggevraagd
      of dat reeds is teruggegeven.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32j
  - number: 32j.2
    text: |-
      De correctie vindt plaats in een teruggaafverzoek dat gedaan wordt binnen het kalenderjaar volgend op het
      desbetreffende teruggaaftijdvak. Mocht de aanvrager in dat kalenderjaar geen volgend teruggaafverzoek indienen dan
      vindt de correctie plaats door toezending van een afzonderlijke verklaring via de door de lidstaat van vestiging
      ingestelde portaalsite.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32j
  - number: 32k.1
    text: 'Het teruggaafverzoek heeft betrekking op:'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32k
  - number: 32k.1.a
    text: |-
      verwervingen van goederen of afnames van diensten die gedurende het teruggaaftijdvak gefactureerd zijn, mits de
      belasting vóór of op het tijdstip van facturatie verschuldigd geworden is, of ten aanzien waarvan de belasting
      gedurende het teruggaaftijdvak verschuldigd geworden is, mits de verwervingen of afnames gefactureerd zijn voordat
      de belasting verschuldigd is geworden;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32k
  - number: 32k.1.b
    text: de invoer van goederen die gedurende het teruggaaftijdvak heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32k
  - number: 32k.2
    text: |-
      Naast de in het eerste lid bedoelde transacties kan het teruggaafverzoek ook betrekking hebben op facturen of
      invoerdocumenten die niet door eerdere teruggaafverzoeken werden bestreken en die betrekking hebben op handelingen
      die tijdens het kalenderjaar in kwestie werden verricht.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32k
  - number: 32l
    text: |-
      Het teruggaafverzoek moet uiterlijk 30 september van het kalenderjaar volgend op het teruggaaftijdvak bij de
      lidstaat van vestiging worden ingediend.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32l
  - number: 32m.1
    text: |-
      De inspecteur stelt de aanvrager onverwijld langs elektronische weg in kennis van de datum van ontvangst van het
      verzoek.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32m
  - number: 32m.2
    text: |-
      De inspecteur deelt zijn beslissing om het teruggaafverzoek in te willigen of af te wijzen binnen vier maanden na
      ontvangst van het verzoek aan de aanvrager mee bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32m
  - number: 32n.1
    text: |-
      Ingeval de inspecteur meent niet alle dienstige informatie te hebben ontvangen om met betrekking tot
      het geheel of een deel van het teruggaafverzoek een beschikking te kunnen nemen, kan hij binnen de in
      [artikel 32m, tweede lid][ref1], genoemde termijn van vier maanden, langs elektronische weg in het bijzonder de
      aanvrager of de lidstaat van vestiging om aanvullende gegevens verzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel32m
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32n
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 32m
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '2'
  - number: 32n.2
    text: |-
      Indien de aanvullende gegevens worden opgevraagd bij een andere persoon dan de aanvrager of de bevoegde
      autoriteiten van een lidstaat kan de inspecteur alleen langs elektronische weg om gegevens verzoeken indien de
      bestemmeling van het verzoek over de desbetreffende apparatuur beschikt.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32n
  - number: 32n.3
    text: Zo nodig kan de inspecteur om verdere aanvullende gegevens verzoeken.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32n
  - number: 32n.4
    text: |-
      De overeenkomstig de eerste tot en met vierde lid verlangde gegevens kunnen het overleggen van het origineel of een
      afschrift van de factuur of het invoerdocument omvatten wanneer de inspecteur op goede gronden het bestaan van een
      bepaalde vordering betwijfelt. In dat geval zijn de drempelnormen van [artikel 32g][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel32g
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32n
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 32g
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '2'
  - number: 32n.5
    text: |-
      De krachtens de vorige leden gevraagde gegevens moeten binnen een maand na ontvangst van het verzoek om informatie
      door de bestemmeling van het verzoek aan de inspecteur worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32n
  - number: 32o.1
    text: |-
      Indien de inspecteur om aanvullende gegevens heeft verzocht, deelt hij zijn beslissing om het teruggaafverzoek
      in te willigen of af te wijzen bij voor bezwaar vatbare beschikking mee aan de aanvrager binnen twee maanden na
      ontvangst van de gevraagde gegevens of, indien niet op zijn verzoek gereageerd is, binnen twee maanden na het
      verstrijken van de in [artikel 32n, vijfde lid][ref1], genoemde termijn. De termijn waarover de inspecteur vanaf
      de ontvangst van het teruggaafverzoek beschikt om over een volledige of gedeeltelijke teruggaaf een beslissing te
      nemen, beloopt in ieder geval ten minste zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel32n
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32o
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 32n
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '2'
  - number: 32o.2
    text: |-
      Wanneer de inspecteur verdere aanvullende gegevens verlangt, stelt hij binnen acht maanden nadat het
      teruggaafverzoek door hem is ontvangen, de aanvrager bij voor bezwaar vatbare beschikking in kennis van zijn
      beslissing over een gehele of gedeeltelijke teruggaaf.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32o
  - number: 32p.1
    text: |-
      Indien de inspecteur het teruggaafverzoek inwilligt, wordt het goedgekeurde teruggaafbedrag betaald uiterlijk
      binnen tien werkdagen na het verstrijken van de in [artikel 32m, tweede lid][ref1], genoemde termijn, of, indien
      om aanvullende of verdere aanvullende gegevens is verzocht, na het verstrijken van de overeenkomstige termijnen
      in [artikel 32o][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel32m
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel32o
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32p
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 32m
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 32o
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '2'
  - number: 32p.2
    text: |-
      De betaling vindt plaats in Nederland, of, indien de aanvrager daarom verzoekt, in een andere lidstaat. In het
      laatste geval worden de bankkosten voor het overmaken in mindering gebracht op het aan de aanvrager te betalen
      bedrag.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32p
  - number: 32q.1
    text: |-
      Indien de correctie, bedoeld in [artikel 32j, tweede lid, eerste volzin][ref1], na verrekening in het aldaar
      bedoelde nieuwe teruggaafverzoek leidt tot:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel32j
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32q
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 32j
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '2'
  - number: 32q.1.a
    text: een bedrag van nihil of een teruggaaf, beslist de inspecteur bij een voor bezwaar vatbare beschikking;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32q
  - number: 32q.1.b
    text: een te betalen bedrag, legt de inspecteur hiervoor een naheffingsaanslag op.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32q
  - number: 32q.2
    text: |-
      Indien de correctie, bedoeld in [artikel 32j, tweede lid, tweede volzin][ref1], leidt tot:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel32j
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32q
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 32j
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '2'
  - number: 32q.2.a
    text: een teruggaaf, beslist de inspecteur bij een voor bezwaar vatbare beschikking;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32q
  - number: 32q.2.b
    text: een te betalen bedrag, legt de inspecteur hiervoor een naheffingsaanslag op.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32q
  - number: 32r.1
    text: |-
      Indien de betaling plaatsvindt na de laatste datum van betaling overeenkomstig [artikel 32p, eerste lid][ref1],
      wordt aan de aanvrager rente betaald over het aan de aanvrager terug te geven bedrag. De bepalingen van de
      [artikelen 29][ref2] en [30 van de Invorderingswet 1990][ref3] zijn ter zake van overeenkomstige toepassing als
      ware de rente invorderingsrente.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel32p
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel30
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32r
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 32p
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '29'
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '30'
  - number: 32r.2
    text: |-
      Het eerste lid, eerste volzin, is niet van toepassing indien de aanvrager de gevraagde aanvullende of verdere
      aanvullende gegevens niet binnen de voorgeschreven termijn aan de inspecteur heeft verstrekt. Het eerste lid,
      eerste volzin, is evenmin van toepassing zolang de inspecteur de krachtens [artikel 32g][ref1] langs elektronische
      weg toe te zenden documenten niet heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel32g
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32r
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 32g
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '2'
  - number: 32s
    text: |-
      De rente wordt berekend vanaf de dag volgende op de laatste dag waarop de teruggaaf volgens
      [artikel 32p, eerste lid][ref1], uiterlijk had moeten plaatsvinden tot de dag waarop de teruggaaf daadwerkelijk
      plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel32p
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel32s
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 32p
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '2'
  - number: '33'
    text: |-
      Een in Nederland gevestigde ondernemer kan een teruggaafverzoek doen aan een lidstaat van teruggaaf indien hij aan
      de volgende voorwaarden voldoet:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33
  - number: 33.a
    text: |-
      tijdens het tijdvak van teruggaaf heeft hij in de lidstaat van teruggaaf noch de zetel van zijn bedrijfsuitoefening
      gehad, noch een vaste inrichting van waaruit zakelijke handelingen werden verricht, noch, bij gebreke van een
      dergelijke zetel of vaste inrichting, zijn woonplaats of zijn gebruikelijke verblijfplaats;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33
  - number: 33.b
    text: |-
      tijdens het tijdvak van teruggaaf heeft hij geen goederenleveringen of diensten verricht waarvan de plaats geacht
      wordt in de lidstaat van teruggaaf te zijn gelegen, met uitzondering van de volgende handelingen:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33
  - number: 33.b.1°
    text: |-
      vervoerdiensten en daarmee samenhangende diensten die in die lidstaat vrijgesteld zijn krachtens de artikelen 144,
      146, 148, 149, 151, 153, 159 of 160 van BTW-richtlijn 2006;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33
  - number: 33.b.2°
    text: |-
      goederenleveringen of dienstverrichtingen waarvan de afnemer krachtens de artikelen 194 tot en met 197 en artikel
      199 van BTW-richtlijn 2006 in die lidstaat de belasting verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33
  - number: 33a
    text: |-
      Het teruggaafverzoek heeft betrekking op de belasting die werd geheven ter zake van de voor de ondernemer door
      andere ondernemers in de lidstaat van teruggaaf verrichte goederenleveringen of diensten, of ter zake van de invoer
      van goederen in deze lidstaat voor zover deze goederen of diensten worden gebruikt voor de volgende handelingen:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33a
  - number: 33a.a
    text: de handelingen bedoeld in artikel 169, punten a) en b), van BTW-richtlijn 2006;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33a
  - number: 33a.b
    text: |-
      handelingen, waarvan de afnemer overeenkomstig de artikelen 194 tot en met 197 en artikel 199 van BTW-richtlijn
      2006, als toegepast in de lidstaat van teruggaaf, tot voldoening van de belasting is gehouden.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33a
  - number: 33b.1
    text: |-
      Om in de lidstaat van teruggaaf recht te hebben op teruggaaf verricht de in Nederland gevestigde ondernemer
      handelingen die in Nederland een recht op aftrek doen ontstaan.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33b
  - number: 33b.2
    text: |-
      Wanneer de niet in de lidstaat van teruggaaf gevestigde ondernemer in Nederland gevestigd is, en zowel handelingen
      verricht die in Nederland een recht op aftrek doen ontstaan, als handelingen die in Nederland geen recht op aftrek
      doen ontstaan, kan van het overeenkomstig [artikel 33a][ref1] voor teruggaaf in aanmerking komende bedrag slechts
      dat gedeelte van de belasting door de lidstaat van teruggaaf in aanmerking worden genomen dat overeenkomstig
      artikel 173 van BTW-richtlijn 2006, zoals toegepast door Nederland, aan eerstgenoemde handelingen kan worden
      toegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 33a
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '2'
  - number: 33c.1
    text: |-
      De in Nederland gevestigde ondernemer die in de lidstaat van teruggaaf de belasting terug wil verkrijgen, richt
      langs elektronische weg een teruggaafverzoek tot die lidstaat, dat hij indient bij de inspecteur via een daartoe
      ingestelde portaalsite.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33c
  - number: 33c.2
    text: 'Het teruggaafverzoek bevat de volgende informatie:'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33c
  - number: 33c.2.a
    text: de naam en het volledige adres van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33c
  - number: 33c.2.b
    text: een elektronisch adres;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33c
  - number: 33c.2.c
    text: een omschrijving van de beroepsactiviteit van de aanvrager waarvoor de goederen of diensten worden afgenomen;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33c
  - number: 33c.2.d
    text: het teruggaaftijdvak waarop het verzoek betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33c
  - number: 33c.2.e
    text: |-
      een verklaring van de aanvrager dat hij gedurende het teruggaaftijdvak geen goederenleveringen of diensten heeft
      verricht waarvan de plaats geacht wordt in de lidstaat van teruggaaf te zijn gelegen, met uitzondering van de
      handelingen bedoeld in [artikel 33, onderdeel b, onder 1° en 2°][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel33
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33c
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '33'
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '2'
  - number: 33c.2.f
    text: het btw-identificatienummer of het fiscaal registratienummer van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33c
  - number: 33c.2.g
    text: zijn bankgegevens (inclusief IBAN en BIC).
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33c
  - number: 33c.3
    text: |-
      Naast de in het tweede lid bedoelde gegevens worden in het teruggaafverzoek voor iedere lidstaat van teruggaaf en
      voor iedere factuur en ieder invoerdocument de volgende gegevens vermeld:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33c
  - number: 33c.3.a
    text: de naam en het volledige adres van de leverancier of dienstverrichter;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33c
  - number: 33c.3.b
    text: |-
      behalve in het geval van invoer, het btw-identificatienummer van de leverancier of dienstverrichter of zijn fiscaal
      registratienummer, toegekend door de lidstaat van teruggaaf overeenkomstig artikel 239 en 240 van BTW-richtlijn
      2006;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33c
  - number: 33c.3.c
    text: |-
      behalve in het geval van invoer, het landencodenummer van de lidstaat van teruggaaf overeenkomstig artikel 215 van
      BTW-richtlijn 2006;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33c
  - number: 33c.3.d
    text: de datum en het nummer van de factuur of het invoerdocument;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33c
  - number: 33c.3.e
    text: de maatstaf van heffing en het bedrag aan btw, uitgedrukt in de munteenheid van de lidstaat van teruggaaf;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33c
  - number: 33c.3.f
    text: |-
      het overeenkomstig [artikel 33a][ref1] en [artikel 33b, tweede alinea][ref2], berekende bedrag van de aftrekbare
      belasting, uitgedrukt in de munteenheid van de lidstaat van teruggaaf;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel33a
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel33b
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33c
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 33a
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 33b
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '2'
  - number: 33c.3.g
    text: |-
      indien van toepassing, het overeenkomstig [artikel 33b][ref1] berekende pro rata, uitgedrukt in procenten;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel33b
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33c
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 33b
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '2'
  - number: 33c.3.h
    text: |-
      de aard van de afgenomen goederen en diensten, aangegeven door middel van de codes als bepaald in
      [artikel 33d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel33d
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33c
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 33d
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '2'
  - number: 33d.1
    text: |-
      In het teruggaafverzoek moet de aard van de afgenomen goederen en diensten door middel van de volgende codes worden
      aangegeven:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33d
  - number: 33d.1.1
    text: '= brandstof;'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33d
  - number: 33d.1.2
    text: '= verhuur van vervoermiddelen;'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33d
  - number: 33d.1.3
    text: |-
      = uitgaven in verband met vervoermiddelen, andere dan die voor de goederen en diensten waarnaar wordt verwezen met
      de codes 1 en 2;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33d
  - number: 33d.1.4
    text: '= wegentol en andere heffingen met betrekking tot het gebruik van de weginfrastructuur;'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33d
  - number: 33d.1.5
    text: '= reiskosten, zoals taxikosten, kosten van het openbaar vervoer;'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33d
  - number: 33d.1.6
    text: '= logies;'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33d
  - number: 33d.1.7
    text: '= spijzen, drank en restauratie;'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33d
  - number: 33d.1.8
    text: '= toegang tot beurzen en tentoonstellingen;'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33d
  - number: 33d.1.9
    text: '= weelde-uitgaven, en uitgaven voor ontspanning en representatie;'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33d
  - number: 33d.1.10
    text: '= andere.'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33d
  - number: 33d.2
    text: |-
      Op daartoe strekkend verzoek van de lidstaat van teruggaaf verstrekt de aanvrager bij het verzoek langs
      elektronische weg aanvullende gegevens met betrekking tot iedere in het eerste lid vermelde code, voor zover die
      gegevens voor die lidstaat noodzakelijk zijn wegens beperkingen van het recht op aftrek krachtens BTW-richtlijn
      2006, als toegepast in die lidstaat, of voor de toepassing van een krachtens artikel 395 of 396 van die richtlijn
      aan de lidstaat van teruggaaf verleende, voor dit geval relevante afwijking.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33d
  - number: 33d.3
    text: |-
      Op daartoe strekkend verzoek van de lidstaat van teruggaaf omschrijft de aanvrager voorts bij het verzoek zijn
      beroepsactiviteit aan de hand van de geharmoniseerde codes die worden bepaald volgens artikel 34bis, lid 3,
      tweede alinea, van Verordening (EG) nr. 1798/2003 van de Raad van 7 oktober 2003 betreffende de administratieve
      samenwerking op het gebied van de belasting over de toegevoegde waarde en tot intrekking van Verordening (EEG) nr.
      218/92 (PbEU 2003, L 264).
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33d
  - number: 33e.1
    text: |-
      Het teruggaafverzoek moet uiterlijk 30 september van het kalenderjaar volgend op het teruggaaftijdvak bij de door
      de inspecteur ingestelde portaalsite worden ingediend. Het teruggaafverzoek geldt alleen als ingediend indien de
      aanvrager alle in de [artikelen 33c][ref1] en [33d][ref2] verlangde gegevens verstrekt heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel33c
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel33d
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33e
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 33c
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 33d
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '2'
  - number: 33e.2
    text: De inspecteur stuurt de aanvrager onverwijld langs elektronische weg een bevestiging van ontvangst.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33e
  - number: 33f.1
    text: |-
      De inspecteur stuurt het verzoek niet door aan de lidstaat van teruggaaf wanneer de aanvrager in Nederland
      gedurende het teruggaaftijdvak:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33f
  - number: 33f.1.a
    text: niet aan belasting onderworpen is;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33f
  - number: 33f.1.b
    text: |-
      slechts goederenleveringen of diensten verricht die uit hoofde van [artikel 11][ref1] van belasting vrijgesteld
      zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel11
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33f
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '11'
        hoofdstuk: II
        afdeling: '3'
  - number: 33f.1.c
    text: |-
      valt onder de in [artikel 25][ref1] opgenomen regeling voor kleine ondernemers.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel25
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33f
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '25'
        hoofdstuk: V
        afdeling: '1'
  - number: 33f.2
    text: |-
      De inspecteur stelt de aanvrager langs elektronische weg in kennis van zijn beslissing uit hoofde van het eerste
      lid bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33f
  - number: 33g.1
    text: |-
      De ondernemer die niet in Nederland woont of is gevestigd en aldaar geen vaste inrichting heeft, kan in Nederland
      een fiscaal vertegenwoordiger aanstellen ter zake van zijn leveringen en diensten waarvoor hij de belasting
      verschuldigd is en ter zake van zijn intracommunautaire verwervingen en invoer. De fiscaal vertegenwoordiger treedt
      op namens de ondernemer en treedt in zijn plaats met betrekking tot alle rechten en verplichtingen die hij heeft
      inzake de aangifte en de betaling van de belasting, alsmede de verplichtingen bedoeld in [artikel 37a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel37a
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33g
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 37a
        hoofdstuk: VI
        afdeling: '4'
  - number: 33g.2
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald in welke gevallen een ondernemer als bedoeld in het eerste
      lid verplicht is een fiscaal vertegenwoordiger aan te stellen.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33g
  - number: 33g.3
    text: De fiscaal vertegenwoordiger dient in het bezit te zijn van een daartoe verstrekte vergunning van de inspecteur.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33g
  - number: 33g.4
    text: |-
      Degene die een vergunning als fiscaal vertegenwoordiger wil verkrijgen, dient daartoe een verzoek in bij de
      inspecteur. Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de gegevens
      die het verzoek moet bevatten.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33g
  - number: 33g.5
    text: |-
      Bij het verzoek dient een verklaring van de in het eerste lid bedoelde ondernemer te worden overgelegd waaruit
      blijkt dat degene die het verzoek indient door de ondernemer is gemachtigd namens hem op te treden als fiscaal
      vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33g
  - number: 33g.6
    text: |-
      Bij algemene maatregel van bestuur kunnen, ter verzekering van de heffing en de invordering, regels worden gesteld
      met betrekking tot de voorwaarden waaronder de vergunning wordt verleend, gewijzigd en ingetrokken. Het verlenen,
      het wijzigen en het intrekken van de vergunning geschiedt bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel33g
  - number: '34.1'
    text: |-
      De ondernemer is gehouden, met inachtneming van bij ministeriële regeling te stellen regels, aantekening te houden
      van de door hem en aan hem verrichte leveringen van goederen en verleende diensten, van de door hem verrichte
      intracommunautaire verwervingen van goederen, van de invoer van goederen in en de uitvoer van goederen uit de Unie,
      alsmede van andere gegevens die van belang zijn met betrekking tot de heffing van de belasting in Nederland en in
      andere lidstaten.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel34
  - number: '34.2'
    text: 'De ondernemer is tevens, met inachtneming van bij ministeriële regeling te stellen regels, gehouden:'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel34
  - number: 34.2.a
    text: |-
      een register bij te houden van de goederen die door hem of voor zijn rekening zijn verzonden of vervoerd naar
      een andere lidstaat om aldaar te worden gebruikt voor de in [artikel 3a, tweede lid, onderdelen e, f en g][ref1],
      bedoelde doeleinden;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel3a
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 3a
        hoofdstuk: II
        afdeling: '1'
  - number: 34.2.b
    text: |-
      afzonderlijk aantekening te houden van de goederen die vanuit een andere lidstaat naar hem zijn verzonden of
      vervoerd door of voor rekening van een ondernemer aan wie een btw-identificatienummer is toegekend in een andere
      lidstaat, ten behoeve van een dienst als bedoeld in [artikel 6e, tweede lid, onderdeel b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel6e
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 6e
        hoofdstuk: II
        paragraaf: '2'
        afdeling: 1b
  - number: 34.2.c
    text: |-
      een register bij te houden van de goederen die hij in het kader van de regeling inzake voorraad op afroep, bedoeld
      in [artikel 3b][ref1], al dan niet door een derde partij verzendt of vervoert, en welk register de inspecteur in
      staat stelt de correcte toepassing van dat artikel te controleren;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel3b
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 3b
        hoofdstuk: II
        afdeling: '1'
  - number: 34.2.d
    text: |-
      een register bij te houden van de goederen die aan hem in het kader van de regeling inzake voorraad op afroep,
      bedoeld in [artikel 3b][ref1], zijn geleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel3b
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 3b
        hoofdstuk: II
        afdeling: '1'
  - number: '34.3'
    text: |-
      De rechtspersoon, andere dan ondernemer, is gehouden, met inachtneming van bij ministeriële regeling te stellen
      regels, aantekening te houden van de door hem verrichte intracommunautaire verwervingen van goederen.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel34
  - number: '34.4'
    text: |-
      De ondernemer die goederen levert met toepassing van [artikel 28b][ref1], [28c][ref2] of [28d][ref3], is tevens
      gehouden, met inachtneming van bij ministeriële regeling te stellen regels, afzonderlijk aantekening te houden van
      de met toepassing van de onderscheiden artikelen geleverde goederen, alsmede van de invoer en van de leveringen
      daarvan aan hem.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28b
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel28c
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel28d
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28b
        hoofdstuk: V
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 28c
        hoofdstuk: V
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0002629
        artikel: 28d
        hoofdstuk: V
        afdeling: '5'
  - number: '34.5'
    text: |-
      Indien een ondernemer, via het gebruik van een elektronische interface, zoals een marktplaats, platform,
      portaal of soortgelijk middel, de levering van goederen of diensten aan een andere dan ondernemer binnen de
      Unie, overeenkomstig de bepalingen van [hoofdstuk II, afdelingen 1a][ref1] en [1b][ref2], faciliteert, wordt
      de ondernemer die de levering faciliteert, verplicht een boekhouding van die leveringen bij te houden. Deze
      boekhouding bevat voldoende gegevens om de belastingautoriteiten van de lidstaat waarin deze goederenleveringen of
      diensten belastbaar zijn, in staat te stellen de juistheid van de aangifte te bepalen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0002629#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002629
        hoofdstuk: II
        afdeling: 1a
      - id: ref2
        bwb_id: BWBR0002629
        hoofdstuk: II
        afdeling: 1b
  - number: '34.6'
    text: |-
      Op verzoek moet de boekhouding, bedoeld in het vijfde lid, langs elektronische weg aan de betrokken lidstaten
      beschikbaar worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel34
  - number: '34.7'
    text: |-
      De boekhouding, bedoeld in het vijfde lid, wordt bewaard gedurende tien jaren na afloop van het jaar waarin de
      handeling is verricht.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel34
  - number: 34a
    text: |-
      De ondernemer is verplicht boeken, bescheiden en andere gegevensdragers of de inhoud daarvan – zulks ter keuze
      van de inspecteur – betreffende onroerende zaken en rechten waaraan deze zijn onderworpen gedurende negen jaren,
      volgende op het jaar waarin hij het goed is gaan gebruiken, te bewaren.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel34a
  - number: 34b.1
    text: |-
      Voor facturering gelden de regels die van toepassing zijn in de lidstaat waar de goederenlevering of de dienst
      geacht wordt te zijn verricht, zoals deze plaats van verrichting is vastgesteld overeenkomstig het bepaalde in
      [hoofdstuk II][ref1] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel34b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        hoofdstuk: II
  - number: 34b.2
    text: 'In afwijking van het eerste lid gelden voor facturering:'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel34b
  - number: 34b.2.a
    text: |-
      de regels die van toepassing zijn in de lidstaat waar de leverancier of dienstverrichter de zetel van zijn
      bedrijfsuitoefening of een vaste inrichting heeft gevestigd van waaruit hij de goederenlevering of de dienst
      verricht, of, bij gebreke van een dergelijke zetel of vaste inrichting, in de lidstaat waar hij zijn woonplaats of
      gebruikelijke verblijfplaats heeft, wanneer:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel34b
  - number: 34b.2.a.1°
    text: |-
      de leverancier of dienstverrichter die niet gevestigd is in de lidstaat waar de goederenlevering of de dienst
      overeenkomstig het bepaalde in [hoofdstuk II][ref1] van deze wet geacht wordt te zijn verricht, of zijn inrichting
      in die lidstaat niet betrokken is bij het verrichten van de goederenlevering of de dienst in de zin van artikel
      192bis, onder b, van de BTW-richtlijn 2006, en de tot voldoening van de belasting gehouden persoon degene is voor
      wie de goederenlevering of de dienst wordt verricht, tenzij de afnemer zelf de factuur uitreikt («self-billing»);


      [ref1]: https://wetten.overheid.nl/BWBR0002629#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel34b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        hoofdstuk: II
  - number: 34b.2.a.2°
    text: |-
      de goederenlevering of de dienst overeenkomstig het bepaalde in [hoofdstuk II][ref1] van deze wet, niet geacht
      wordt in de Unie te zijn verricht; of


      [ref1]: https://wetten.overheid.nl/BWBR0002629#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel34b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        hoofdstuk: II
  - number: 34b.2.b
    text: |-
      de regels die van toepassing zijn in de lidstaat waar de leverancier of de dienstverrichter die gebruikmaakt van
      een van de regelingen, bedoeld in [hoofdstuk V, afdeling 7][ref1], is geïdentificeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel34b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        hoofdstuk: V
        afdeling: '7'
  - number: 34b.3
    text: |-
      Het eerste en het tweede lid zijn van toepassing onverminderd het bepaalde in
      [artikel 52 van de Algemene wet inzake rijksbelastingen][ref1] en [artikel 35c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel35c
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel34b
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '52'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 35c
        hoofdstuk: VI
        afdeling: '4'
  - number: 34c.1
    text: |-
      Iedere ondernemer zorgt ervoor dat door hemzelf dan wel, in zijn naam en voor zijn rekening, door zijn afnemer of
      een derde, in de volgende gevallen een factuur wordt uitgereikt ter zake van:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel34c
  - number: 34c.1.a
    text: |-
      de goederenleveringen of diensten die hij heeft verricht voor een andere ondernemer of een rechtspersoon, andere
      dan ondernemer;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel34c
  - number: 34c.1.b
    text: |-
      de goederenleveringen, bedoeld in [artikel 5a, eerste lid, onderdeel a][ref1], behalve wanneer een ondernemer
      gebruik maakt van de Unieregeling, bedoeld in [hoofdstuk V, afdeling 7, paragraaf 3][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0002629#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel34c
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 5a
        hoofdstuk: II
        afdeling: 1a
      - id: ref2
        bwb_id: BWBR0002629
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '7'
  - number: 34c.1.c
    text: |-
      de goederenleveringen, bedoeld in de bij deze wet behorende [tabel II, onderdeel a, post 6][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel34c
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: 34c.1.d
    text: |-
      de vooruitbetalingen die aan hem worden gedaan voordat een van de in de onderdelen a en b bedoelde
      goederenleveringen is verricht;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel34c
  - number: 34c.1.e
    text: |-
      de vooruitbetalingen die door een andere ondernemer of een rechtspersoon, andere dan ondernemer, aan hem worden
      gedaan voordat de dienst is verricht.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel34c
  - number: 34c.2
    text: |-
      Onder bij ministeriële regeling te stellen voorwaarden en beperkingen zijn ondernemers die uitsluitend
      vrijgestelde prestaties verrichten, ontheven van de verplichting ingevolge het eerste lid. De vorige volzin is
      van overeenkomstige toepassing op de vrijgestelde prestaties van ondernemers die zowel vrijgestelde als belaste
      prestaties verrichten.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel34c
  - number: 34d.1
    text: 'In de volgende gevallen kan worden volstaan met een vereenvoudigde factuur:'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel34d
  - number: 34d.1.a
    text: wanneer het bedrag van de factuur niet hoger is dan € 100;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel34d
  - number: 34d.1.b
    text: |-
      wanneer de uitgereikte factuur een document of bericht is dat overeenkomstig [artikel 34f][ref1] als factuur
      geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel34f
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel34d
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 34f
        hoofdstuk: VI
        afdeling: '4'
  - number: 34d.2
    text: |-
      Een vereenvoudigde factuur wordt niet uitgereikt indien de factuur moet worden uitgereikt overeenkomstig
      [artikel 34c, eerste lid, onderdelen b en c][ref1], of indien de belastbare goederenlevering of de belastbare
      dienst wordt verricht door een ondernemer die niet is gevestigd in de lidstaat waar de belasting verschuldigd is of
      van wie geen inrichting op het grondgebied van die lidstaat bij het verrichten van de goederenlevering of de dienst
      is betrokken in de zin van artikel 192bis van de BTW-richtlijn 2006, en de tot de voldoening van de belasting
      gehouden persoon degene is voor wie de goederenlevering of dienst wordt verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel34c
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel34d
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 34c
        hoofdstuk: VI
        afdeling: '4'
  - number: 34e
    text: |-
      In afwijking van [artikel 34c, eerste lid][ref1], draagt een ondernemer die doorgaans levert aan andere
      ondernemers, er zorg voor dat een factuur wordt uitgereikt ter zake van al zijn leveringen. De vorige volzin is
      alleen van toepassing ten aanzien van ondernemers of groepen van ondernemers die daartoe bij ministeriële regeling
      zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel34c
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel34e
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 34c
        hoofdstuk: VI
        afdeling: '4'
  - number: 34f
    text: |-
      Ieder document of bericht dat wijzigingen aanbrengt in, en specifiek en ondubbelzinnig verwijst naar de
      oorspronkelijke factuur, geldt als factuur.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel34f
  - number: 34g
    text: |-
      De factuur wordt uitgereikt uiterlijk op de vijftiende dag van de maand volgende op die waarin
      de goederenlevering of de dienst is verricht. In geval van vooruitbetalingen als bedoeld in
      [artikel 34c, eerste lid, onderdelen d en e][ref1], moet de factuur telkens worden uitgereikt vóór het tijdstip van
      de opeisbaarheid daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel34c
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel34g
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 34c
        hoofdstuk: VI
        afdeling: '4'
  - number: '35.1'
    text: |-
      Voor verscheidene afzonderlijke leveringen of diensten kan een periodieke factuur worden opgemaakt, mits de periode
      waarop de factuur betrekking heeft niet langer is dan een kalendermaand.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel35
  - number: '35.2'
    text: |-
      Facturen mogen door de afnemer worden opgemaakt voor goederenleveringen of diensten die door een ondernemer voor
      hem worden verricht, indien beide partijen dat vooraf onderling zijn overeengekomen en op voorwaarde dat iedere
      factuur het voorwerp uitmaakt van een procedure van aanvaarding door de ondernemer die de goederenleveringen of de
      diensten verricht.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel35
  - number: 35a.1
    text: 'Op de factuur zijn de volgende vermeldingen verplicht:'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel35a
  - number: 35a.1.a
    text: de datum van uitreiking van de factuur;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel35a
  - number: 35a.1.b
    text: een opeenvolgend nummer, met één of meer reeksen, waardoor de factuur eenduidig wordt geïdentificeerd;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel35a
  - number: 35a.1.c
    text: het btw-identificatienummer waaronder de ondernemer de goederenleveringen of de diensten heeft verricht;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel35a
  - number: 35a.1.d
    text: |-
      het btw-identificatienummer van de afnemer waaronder hij een goederenlevering of een dienst heeft afgenomen
      waarvoor hij tot voldoening van de belasting is gehouden of waaronder hij een goederenlevering als bedoeld in de
      bij deze wet behorende [tabel II, onderdeel a, post 6][ref1], heeft afgenomen;


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: 35a.1.e
    text: de volledige naam en het volledige adres van de ondernemer en zijn afnemer;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel35a
  - number: 35a.1.f
    text: de hoeveelheid en de aard van de geleverde goederen of de omvang en de aard van de verrichte diensten;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel35a
  - number: 35a.1.g
    text: |-
      de datum waarop de goederenlevering of de dienst heeft plaatsgevonden of voltooid is of de datum waarop de in
      [artikel 34c, eerste lid, onderdelen d en e][ref1], bedoelde vooruitbetaling is gedaan, voor zover die datum
      vastgesteld is en verschilt van de uitreikingsdatum van de factuur;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel34c
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 34c
        hoofdstuk: VI
        afdeling: '4'
  - number: 35a.1.h
    text: |-
      de vergoeding voor elk tarief of elke vrijstelling, de eenheidsprijs, belasting niet inbegrepen, evenals de
      eventuele vooruitbetalingskortingen, prijskortingen en -rabatten indien die niet in de eenheidsprijs zijn begrepen;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel35a
  - number: 35a.1.i
    text: het toegepast tarief van de belasting;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel35a
  - number: 35a.1.j
    text: |-
      het te betalen bedrag van de belasting, tenzij er een bijzondere regeling van toepassing is waarvoor deze wet die
      vermelding uitsluit;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel35a
  - number: 35a.1.k
    text: |-
      wanneer de afnemer die een prestatie afneemt de factuur uitreikt in plaats van degene die de prestatie verricht, de
      vermelding «factuur uitgereikt door afnemer»;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel35a
  - number: 35a.1.l
    text: |-
      in geval van een vrijstelling of van leveringen met toepassing van de bij deze wet behorende tabel II, onderdeel a,
      post 6, enige aanduiding daarvan;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel35a
  - number: 35a.1.m
    text: wanneer de afnemer tot voldoening van de belasting is gehouden, de vermelding «btw verlegd»;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel35a
  - number: 35a.1.n
    text: |-
      in geval van levering van een nieuw vervoermiddel onder de in tabel II, onderdeel a, post 6, bedoelde voorwaarden,
      de gegevens die nodig zijn om te bepalen of een vervoermiddel een nieuw vervoermiddel is;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel35a
  - number: 35a.1.o
    text: wanneer de bijzondere regeling voor reisbureaus wordt gehanteerd, de vermelding «bijzondere regeling reisbureaus»;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel35a
  - number: 35a.1.p
    text: |-
      wanneer een van de bijzondere regelingen voor gebruikte goederen, kunstvoorwerpen, voorwerpen voor verzamelingen
      of antiquiteiten wordt gehanteerd, de vermelding «bijzondere regeling – gebruikte goederen», «bijzondere regeling –
      kunstvoorwerpen», respectievelijk «bijzondere regeling – voorwerpen voor verzamelingen of antiquiteiten»;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel35a
  - number: 35a.1.q
    text: |-
      wanneer de belasting wordt voldaan door een fiscaal vertegenwoordiger als bedoeld in artikel 33g, het btw-
      identificatienummer van deze fiscaal vertegenwoordiger, samen met zijn volledige naam en adres.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel35a
  - number: 35a.2
    text: 'Op een vereenvoudigde factuur zijn de volgende vermeldingen verplicht:'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel35a
  - number: 35a.2.a
    text: de datum van uitreiking van de factuur;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel35a
  - number: 35a.2.b
    text: de identiteit van de ondernemer die de goederenlevering of de dienst verricht;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel35a
  - number: 35a.2.c
    text: de aard van de geleverde goederen of de verrichte diensten;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel35a
  - number: 35a.2.d
    text: het te betalen bedrag van de belasting of de gegevens aan de hand waarvan dat bedrag kan worden berekend;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel35a
  - number: 35a.2.e
    text: |-
      wanneer de uitgereikte factuur een document of bericht is dat overeenkomstig [artikel 34f][ref1] als factuur
      geldt, een specifieke en ondubbelzinnige verwijzing naar de oorspronkelijke factuur, met specifieke vermelding van
      de aangebrachte wijzigingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel34f
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 34f
        hoofdstuk: VI
        afdeling: '4'
  - number: 35a.3
    text: |-
      Wanneer de factuur wordt uitgereikt door een ondernemer die niet gevestigd is in de lidstaat waar de belasting
      verschuldigd is of van wie geen inrichting in die lidstaat bij het verrichten van de goederenlevering of de
      dienst is betrokken in de zin van artikel 192bis van BTW-richtlijn 2006 en die goederenleveringen of diensten
      verricht voor een afnemer die tot voldoening van de belasting is gehouden, kan de ondernemer de in het eerste
      lid, onderdelen h, i en j, bedoelde vermeldingen weglaten en in plaats daarvan, door de hoeveelheid of de omvang
      alsook de aard van de geleverde goederen of verrichte diensten te specificeren, de vergoeding voor die goederen of
      diensten vermelden.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel35a
  - number: 35a.4
    text: |-
      Op een factuur kunnen bedragen in willekeurig welke munteenheid voorkomen, mits het te betalen of te herziene
      bedrag van de belasting is uitgedrukt in euro’s en daarbij gebruik wordt gemaakt van het in artikel 91 van de BTW-
      richtlijn 2006 bedoelde wisselkoersmechanisme.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel35a
  - number: 35a.5
    text: |-
      Wanneer zulks uit een oogpunt van controle nodig is, kan de inspecteur een vertaling in het Nederlands eisen van
      facturen betreffende in Nederland verrichte prestaties, alsmede van facturen die worden ontvangen door in Nederland
      gevestigde ondernemers.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel35a
  - number: 35a.6
    text: |-
      Bij ministeriële regeling kan voor bepaalde ondernemers of groepen van ondernemers ontheffing worden verleend van
      bepaalde verplichtingen die zijn opgelegd bij dit artikel wanneer de handels- of administratieve praktijken van
      de betrokken bedrijfssector of de technische voorwaarden waaronder die facturen worden uitgereikt, de naleving in
      sterke mate bemoeilijken van alle verplichtingen die zijn opgelegd bij dit artikel.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel35a
  - number: 35b.1
    text: Elektronische facturering wordt toegepast behoudens aanvaarding door de afnemer.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel35b
  - number: 35b.2
    text: |-
      De authenticiteit van de herkomst, de integriteit van de inhoud, en de leesbaarheid van de factuur, op papier
      of in elektronisch formaat, worden vanaf het tijdstip waarop de factuur wordt uitgereikt tot het einde van de
      bewaartermijn gewaarborgd. De ondernemer bepaalt zelf hoe de authenticiteit van de herkomst, de integriteit van
      de inhoud, en de leesbaarheid van de factuur worden gewaarborgd. Hiertoe kan gebruik worden gemaakt van elke
      bedrijfscontrole die een betrouwbaar controlespoor tussen een factuur en een verrichte prestatie oplevert.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel35b
  - number: 35b.3
    text: |-
      Voor de toepassing van deze afdeling en de daarop gebaseerde bepalingen wordt verstaan onder: - *authenticiteit
      van de herkomst:* de gewaarborgde identiteit van degene die de goederenlevering of de dienst heeft verricht of van
      degene die de factuur heeft uitgereikt;
        - *integriteit van de inhoud:* de krachtens deze wet voorgeschreven inhoud van de factuur die geen wijzigingen
      heeft ondergaan.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel35b
  - number: 35b.4
    text: |-
      De authenticiteit van de herkomst en de integriteit van de inhoud van een elektronische factuur kunnen, behalve
      door middel van de in het tweede lid bedoelde bedrijfscontroles, bijvoorbeeld ook met de volgende technologieën
      worden gewaarborgd:
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel35b
  - number: 35b.4.a
    text: |-
      een gekwalificeerde handtekening als bedoeld in artikel 3, onderdeel 12, van verordening (EU) nr. 910/2014 van het
      Europees Parlement en de Raad van 23 juli 2014 betreffende elektronische identificatie en vertrouwensdiensten voor
      elektronische transacties in de interne markt en tot intrekking van richtlijn 1999/93/EG (PbEU 2014, L 257);
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel35b
  - number: 35b.4.b
    text: |-
      elektronische uitwisseling van gegevens (Electronic Data Interchange – EDI), zoals gedefinieerd in artikel 2 van
      bijlage 1 bij Aanbeveling 1994/820/EG van de Commissie van 19 oktober 1994 betreffende de juridische aspecten
      van de elektronische uitwisseling van gegevens, indien het akkoord betreffende deze uitwisseling voorziet in het
      gebruik van procedures die de authenticiteit van de herkomst en de integriteit van de gegevens waarborgen.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel35b
  - number: 35b.5
    text: |-
      Bij een reeks elektronische facturen die aan dezelfde afnemer worden verzonden of ter beschikking worden gesteld,
      hoeven de voor de verschillende facturen gelijke vermeldingen slechts één keer te worden opgenomen, voorzover voor
      elke factuur alle informatie toegankelijk is.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel35b
  - number: 35c.1
    text: |-
      De ondernemer bewaart kopieën van de door hemzelf dan wel, in zijn naam en voor zijn rekening, door zijn afnemer of
      een derde uitgereikte facturen, en alle door hemzelf ontvangen facturen in zijn administratie.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel35c
  - number: 35c.2
    text: |-
      Wanneer een ondernemer de door hem verzonden of ontvangen facturen elektronisch bewaart, waarbij een online toegang
      tot de gegevens wordt gewaarborgd, heeft de inspecteur met het oog op de toepassing van deze wet het recht de
      facturen ter controle in te zien, te downloaden en te gebruiken, indien de ondernemer is gevestigd in Nederland,
      dan wel de ondernemer de belasting in Nederland verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel35c
  - number: 35c.3
    text: |-
      Ingeval facturen elektronisch worden opgeslagen, worden de gegevens die de authenticiteit van de herkomst en de
      integriteit van de inhoud waarborgen, eveneens opgeslagen.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel35c
  - number: 35d
    text: |-
      In deze wet wordt verstaan onder «elektronische factuur», een factuur die de bij of krachtens deze wet
      voorgeschreven gegevens bevat, welke in elektronisch formaat is verstrekt en ontvangen.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel35d
  - number: '36'
    text: |-
      De [artikelen 25, derde lid][ref1], en [27e, van de Algemene wet inzake rijksbelastingen][ref2] vinden
      overeenkomstige toepassing, ingeval niet volledig is voldaan aan de verplichtingen welke zijn opgelegd bij of
      krachtens de [artikelen 28n][ref3], [34 tot en met 35c][ref4] en [39][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel28n
      [ref4]: https://wetten.overheid.nl/BWBR0002629#Artikel34
      [ref5]: https://wetten.overheid.nl/BWBR0002629#Artikel39
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '27'
      - id: ref3
        bwb_id: BWBR0002629
        artikel: 28n
        hoofdstuk: V
        afdeling: '6'
      - id: ref4
        bwb_id: BWBR0002629
        artikel: '34'
        hoofdstuk: VI
        afdeling: '4'
      - id: ref5
        bwb_id: BWBR0002629
        artikel: '39'
        hoofdstuk: VI
        afdeling: '5'
  - number: '37'
    text: |-
      Hij die op een factuur op enigerlei wijze melding maakt van omzetbelasting welke hij, anders dan op grond van dit
      artikel, niet verschuldigd is geworden, wordt die belasting verschuldigd op het tijdstip waarop hij die factuur
      heeft uitgereikt; hij is gehouden deze belasting op de voet van [artikel 14][ref1] te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel14
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '14'
        hoofdstuk: II
        afdeling: '4'
  - number: 37a.1
    text: |-
      De ondernemer, uitgezonderd die bedoeld in [artikel 7, zesde lid][ref1], of [artikel 25][ref2], is verplicht
      uiterlijk de laatste dag van de maand volgend op een kalendermaand bij de inspecteur op de daartoe opengestelde
      wijze een formulier langs elektronische weg in te dienen met een lijst voor dat tijdvak waarop zijn vermeld de
      afnemers:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel25
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '7'
        hoofdstuk: II
        afdeling: 1c
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '25'
        hoofdstuk: V
        afdeling: '1'
  - number: 37a.1.a
    text: |-
      aan wie goederen zijn geleverd met toepassing van de bij deze wet behorende [Tabel II][ref1], onderdeel a, post 6;


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: 37a.1.b
    text: |-
      aan wie in een andere lidstaat goederen zijn geleverd in aansluiting op de ingevolge
      [artikel 17b, derde lid][ref1], in die lidstaat door de ondernemer verrichte intracommunautaire verwervingen;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel17b
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 17b
        hoofdstuk: IIA
        afdeling: '1'
  - number: 37a.1.c
    text: |-
      voor wie hij diensten heeft verricht die met toepassing van artikel 6, eerste lid, niet belastbaar zijn in
      Nederland en waarover de belasting ingevolge artikel 196 van BTW-richtlijn 2006 in de lidstaat van de afnemer wordt
      geheven van de afnemer, tenzij het verrichten van die dienst in die lidstaat is vrijgesteld;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel37a
  - number: 37a.1.d
    text: |-
      voor wie, met inbegrip van diens btw-identificatienummer, de goederen zijn bestemd die in het kader van de regeling
      inzake voorraad op afroep, bedoeld in [artikel 3b][ref1], worden verzonden of vervoerd en geeft hij kennis van
      iedere wijziging in de ingediende informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel3b
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 3b
        hoofdstuk: II
        afdeling: '1'
  - number: 37a.2
    text: In de lijst wordt opgave verlangd van de gegevens, bedoeld in de artikelen 264 en 265 van de BTW-richtlijn 2006.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel37a
  - number: 37a.3
    text: |-
      In afwijking in zoverre van het eerste lid geldt als tijdvak in plaats van een kalendermaand naar keus van de
      ondernemer een kalenderkwartaal indien het totaalbedrag van de in het eerste lid, onderdelen a en b genoemde
      leveringen noch voor het desbetreffende kalenderkwartaal, noch in één van de vier daaraan voorafgaande
      kalenderkwartalen, hoger is dan het daartoe bij ministeriële regeling vastgestelde bedrag. Deze afwijking geldt
      niet meer vanaf het einde van de maand waarin dit bedrag wordt overschreden, in welk geval uiterlijk de volgende
      maand een lijst moet worden opgesteld en ingediend voor alle maanden die sinds de aanvang van dat kwartaal zijn
      verlopen. In afwijking van het eerste lid geldt voor de informatie, bedoeld in onderdeel d, hetzelfde tijdvak als
      bepaald voor leveringen als bedoeld in de onderdelen a en b
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel37a
  - number: 37a.4
    text: |-
      In afwijking in zoverre van het eerste lid geldt naar keus van de ondernemer als tijdvak een kalenderkwartaal
      indien de ondernemer de onder het eerste lid onderdeel c genoemde diensten verricht.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel37a
  - number: 37a.5
    text: |-
      Indien voor het doen van aangifte voor de omzetbelasting ontheffing is verleend van de verplichting aangifte langs
      elektronische weg te doen, geldt deze ontheffing mede ten aanzien van de verplichting de lijst langs elektronische
      weg in te dienen. In dit geval wordt de lijst ingediend bij de inspecteur door middel van het uitgereikte of
      toegezonden formulier.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel37a
  - number: 37a.6
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld inzake het indienen van de in dit artikel bedoelde
      gegevens.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel37a
  - number: 37b
    text: |-
      Degene die ter zake van de intracommunautaire verwerving van goederen valt onder de toepassing van
      [artikel 1a, tweede lid][ref1], wordt niettemin de belasting verschuldigd ter zake van die intracommunautaire
      verwerving wanneer in de lidstaat waar de goederen worden geleverd, belastingheffing plaatsvindt alsof
      [artikel 1, aanhef en onderdeel b][ref2], van toepassing zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel1
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel37b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 1a
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '1'
        hoofdstuk: I
  - number: 37c
    text: |-
      In afwijking van [artikel 1, aanhef en onderdelen b en c][ref1], wordt ter zake van intracommunautaire verwervingen
      van goederen die op grond van [artikel 17b, eerste lid][ref2], in Nederland worden verricht geen belasting geheven,
      voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel17b
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel37c
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 17b
        hoofdstuk: IIA
        afdeling: '1'
  - number: 37c.a
    text: |-
      de goederen zijn verworven door een ondernemer die niet in Nederland woont of is gevestigd en aldaar geen vaste
      inrichting heeft en aan wie een btw-identificatienummer is toegekend in een andere lidstaat;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel37c
  - number: 37c.b
    text: |-
      de goederen door deze ondernemer in Nederland worden geleverd aan een ondernemer die in Nederland woont of is
      gevestigd dan wel aldaar een vaste inrichting heeft, of aan een in Nederland gevestigd lichaam in de zin van de
      [Algemene wet inzake rijksbelastingen][ref1], en aan welke afnemer in Nederland een btw-identificatienummer is
      toegekend; en


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel37c
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: 37c.c
    text: |-
      de goederen rechtstreeks naar de in onderdeel *b* bedoelde afnemer worden verzonden of vervoerd vanuit een lidstaat
      die niet een btw-identificatienummer heeft toegekend aan de in onderdeel *a* bedoelde ondernemer.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel37c
  - number: 37d
    text: |-
      Bij overgang van het geheel of een gedeelte van een algemeenheid van goederen, al dan niet tegen vergoeding of
      in de vorm van een inbreng in een vennootschap, wordt geacht dat geen leveringen of diensten plaatsvinden en
      treedt, tenzij bij ministeriële regeling anders is bepaald, degene op wie de goederen overgaan in de plaats van
      de overdrager.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel37d
  - number: 37e
    text: |-
      De ondernemer die in Nederland woont of is gevestigd, wordt geacht zijn leveringen en diensten in Nederland
      te verrichten, voor zover hij niet aan de hand van boeken, bescheiden of andere gegevensdragers het tegendeel
      aantoont. Deze bepaling is eveneens van toepassing op de ondernemer die in Nederland een vaste inrichting heeft,
      voor zover de leveringen en diensten vanuit die inrichting worden verricht.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel37e
  - number: '38'
    text: |-
      Het is de ondernemer verboden aan anderen dan ondernemers en publiekrechtelijke lichamen goederen en diensten aan
      te bieden tegen prijzen met zodanige aanduidingen dat de omzetbelasting niet in de prijzen zou zijn begrepen.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel38
  - number: '39'
    text: 'Bij algemene maatregel van bestuur kunnen:'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel39
  - number: 39.a
    text: nadere regels worden gesteld welke tot vergemakkelijking van de heffing van belasting kunnen leiden;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel39
  - number: 39.b
    text: |-
      andere in het kader van de wet passende nadere regels worden gesteld ter aanvulling van in de wet geregelde
      onderwerpen.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel39
  - number: '40.1'
    text: |-
      Indien de ondernemer een btw-melding als bedoeld in [artikel 28q][ref1] die hij in Nederland moet doen of de
      lijst, bedoeld in [artikel 37a][ref2], niet of niet tijdig heeft ingediend, dan wel een onvolledige of onjuiste
      btw-melding of lijst heeft ingediend, vormt dat een verzuim ter zake waarvan de inspecteur hem een bestuurlijke
      boete van ten hoogste € 5.514 kan opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28q
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel37a
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28q
        hoofdstuk: V
        paragraaf: '1'
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 37a
        hoofdstuk: VI
        afdeling: '4'
  - number: '40.2'
    text: |-
      De bevoegdheid tot het opleggen van de in het eerste lid bedoelde boete vervalt, in afwijking van
      [artikel 5:45, tweede lid, van de Algemene wet bestuursrecht][ref1], door het verloop van vijf jaren na het einde
      van het kalenderjaar waarin de in [artikel 28q][ref2] of [artikel 37a, eerste lid][ref3], genoemde verplichting
      is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel28q
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel37a
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 28q
        hoofdstuk: V
        paragraaf: '1'
        afdeling: '7'
      - id: ref3
        bwb_id: BWBR0002629
        artikel: 37a
        hoofdstuk: VI
        afdeling: '4'
  - number: '40.3'
    text: |-
      [Artikel 67cb van de Algemene wet inzake rijksbelastingen][ref1] is van overeenkomstige toepassing op het bedrag
      van de boete, genoemd in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67cb
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 67cb
  - number: '42'
    text: |-
      Hij die het in [artikel 38][ref1] vervatte verbod overtreedt, wordt gestraft met een geldboete van de derde
      categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel38
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '38'
        hoofdstuk: VI
        afdeling: '5'
  - number: '43.1'
    text: |-
      Aan een ondernemer die bij de aanvang van 1 januari 1969 goederen, anders dan als bedrijfsmiddel, in ongebruikte
      staat hier te lande in voorraad heeft, wordt teruggaaf verleend van de omzetbelasting - andere dan bedoeld in
      artikel I, eerste lid, van de wet van 13 december 1967 (*Stb*. 614) - voldaan voor die goederen en voor de bij de
      voortbrenging van die goederen verbruikte grondstoffen en hulpstoffen. De teruggaaf omvat mede de omzetbelasting
      voldaan voor de bij de voortbrenging van de in voorraad zijnde goederen gebezigde bedrijfsmiddelen en diensten,
      indien de ondernemer de goederen, ongebruikt en in de staat waarin zij zich bij de aanvang van 1 januari 1969
      bevinden, in dat jaar uitvoert. Het recht op teruggaaf dient te kunnen worden aangetoond aan de hand van boeken
      en bescheiden.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel43
  - number: '43.2'
    text: |-
      Onze Minister geeft omtrent de teruggaaf nadere regelen, waarbij zij naar algemene maatstaven kan worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel43
  - number: '43.3'
    text: |-
      De teruggaaf wordt slechts verleend, voor zover de ondernemer bij levering aan hem van de goederen na 31 december
      1968 de ter zake in rekening gebrachte belasting op de voet van [artikel 15][ref1] in aftrek zou kunnen brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '15'
        hoofdstuk: II
        afdeling: '4'
  - number: '43.4'
    text: 'De aanspraak op teruggaaf ontstaat:'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel43
  - number: 43.4.a
    text: |-
      ingeval de gehele teruggaaf niet meer bedraagt dan f 1500, telkens voor een vierde gedeelte aan het einde van het
      tweede, derde en vierde kwartaal van het jaar 1969 en het eerste kwartaal van het jaar 1970;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel43
  - number: 43.4.b
    text: |-
      ingeval de gehele teruggaaf meer bedraagt dan f 1500, telkens voor een vierde gedeelte aan het einde van het
      tweede, derde en vierde kwartaal van het jaar 1969 en het vierde kwartaal van het jaar 1970.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel43
  - number: '43.5'
    text: |-
      De aanspraak op teruggaaf ter zake van de uitvoer van de goederen ontstaat echter aan het einde van het kwartaal
      waarin de uitvoer plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel43
  - number: '43.6'
    text: |-
      De omzetbelasting, waarvan de teruggaaf op grond van het vierde lid, letter *b*, plaatsvindt na het einde van het
      vierde kwartaal van het jaar 1970, wordt met 6 percent verhoogd als vergoeding voor renteverlies.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel43
  - number: '43.7'
    text: |-
      Tegen een ingevolge [artikel 25 van de Algemene wet inzake rijksbelastingen][ref1] gedane uitspraak
      van de inspecteur betreffende de toepassing van de vorige leden staat, in afwijking in zoverre van
      [artikel 26, eerste lid][ref2], van genoemde wet, uitsluitend beroep open bij de Tariefcommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel26
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '26'
        hoofdstuk: V
        afdeling: '2'
  - number: '44.1'
    text: |-
      Ter zake van de invoer in 1969 van vóór 1 januari 1969 in Nederland gebrachte goederen, wordt een bijzondere
      verbruiksbelasting geheven tot het bedrag, dat bij invoer in 1968 verschuldigd zou zijn geweest uit hoofde van
      artikel I, eerste lid, van de wet van 13 december 1967 (*Stb*. 614).
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel44
  - number: '44.2'
    text: |-
      De Algemene wet inzake de douane en de accijnzen is van toepassing als ware de in het eerste lid bedoelde belasting
      invoerrecht.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel44
  - number: '45.1'
    text: |-
      Met afwijking in zoverre van de [artikelen 2][ref1] en [15][ref2] is, met betrekking tot goederen welke zijn
      bestemd om door de ondernemer als bedrijfsmiddel te worden gebruikt, aftrek slechts toegestaan van:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '15'
        hoofdstuk: II
        afdeling: '4'
  - number: 45.1.a
    text: 30 percent van de belasting, ingeval de levering of de invoer plaatsvindt in 1969 of 1970;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel45
  - number: 45.1.b
    text: 60 percent van de belasting, ingeval de levering of de invoer plaatsvindt in 1971;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel45
  - number: 45.1.c
    text: 67 percent van de belasting, ingeval de levering of de invoer plaatsvindt in 1972.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel45
  - number: '45.2'
    text: 'Het eerste lid vindt geen toepassing ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel45
  - number: 45.2.a
    text: schepen, met uitzondering van woonschepen en van pleziervaartuigen;
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel45
  - number: 45.2.b
    text: |-
      machines en toestellen voor het vervaardigen en in het fabricageproces bewerken of afwerken van produkten in de
      textielindustrie (met uitzondering van machines en toestellen voor het spinnen van synthetische of kunstmatige
      textielstoffen en met uitzondering van spindoppen) en de voor of bij deze machines en toestellen gebezigde meet-,
      controle-, regel- en andere hulpapparatuur, alsmede de gebouwen waarin die goederen worden gebezigd.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel45
  - number: '45.3'
    text: |-
      In gevallen waarin het eerste lid ten aanzien van een bedrijfsmiddel toepassing heeft gevonden en de ondernemer
      dat bedrijfsmiddel vervolgens levert, wordt onder door Onze Minister te stellen voorwaarden aan die ondernemer
      teruggaaf verleend van 70, onderscheidenlijk 40 of 33 percent van de ter zake van die levering verschuldigde
      belasting naar gelang deze plaatsvindt in de jaren 1969 of 1970, dan wel 1971 of 1972.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel45
  - number: '45.4'
    text: |-
      Onze Minister kan de in het eerste lid genoemde percentages, met ingang van een door hem te bepalen tijdstip, in
      het algemeen of voor bepaalde groepen van bedrijfsmiddelen verhogen en de in het derde lid genoemde percentages
      daarbij aanpassen.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel45
  - number: '45.5'
    text: |-
      Na het tot stand komen van een ministeriële regeling, door Onze Minister krachtens het vierde lid genomen, wordt
      zo spoedig mogelijk, doch uiterlijk binnen twee maanden, een voorstel van wet tot goedkeuring van die ministeriële
      regeling aan de Tweede Kamer der Staten-Generaal gezonden. Indien het voorstel wordt ingetrokken of indien een
      van de Kamers der Staten-Generaal tot het niet-aannemen van het voorstel besluit, wordt de ministeriële regeling
      onverwijld ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel45
  - number: '45.6'
    text: |-
      Onze Minister kan met ingang van een door hem te bepalen tijdstip het eerste lid buiten toepassing verklaren ten
      aanzien van machines en toestellen voor het vervaardigen van schoeisel en voor of bij deze machines en toestellen
      gebezigde meet-, controle-, regel- en andere hulpapparatuur, alsmede gebouwen waarin die goederen worden gebezigd.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel45
  - number: '46'
    text: |-
      Gedurende de jaren 1969 tot en met 1979 bedraagt de belasting ter zake van leveringen en invoer van dagbladen en
      nieuwsbladen (niet dagelijks verschijnende kranten), krachtens abonnement, in afwijking van de [artikelen 9][ref1]
      en [20][ref2], nihil.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel20
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '9'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '20'
        hoofdstuk: III
        afdeling: '2'
  - number: '47'
    text: |-
      Met betrekking tot de in [artikel 4, tweede lid, onderdeel a][ref1], bedoelde handelingen blijft de heffing van
      belasting achterwege indien, met het oog op die handelingen, de voorbelasting ter zake van het in dat onderdeel
      bedoelde goed vóór de inwerkingtreding van die bepaling niet in aftrek is gebracht ingevolge het bepaalde in
      [artikel 15][ref2] dan wel geheel of gedeeltelijk is uitgesloten ingevolge het bepaalde in [artikel 16][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel16
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '4'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '15'
        hoofdstuk: II
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0002629
        artikel: '16'
        hoofdstuk: II
        afdeling: '4'
  - number: '52'
    text: |-
      Hij die ingevolge een vóór de inwerkingtreding van een wijziging in de wetgeving inzake omzetbelasting gesloten
      overeenkomst verplicht is goederen te leveren of een dienst te verlenen, is bevoegd hetgeen met betrekking tot die
      goederen of die dienst wegens omzetbelasting meer is gevorderd dan vóór de inwerkingtreding van die wijziging had
      kunnen geschieden, terug te vorderen van degene aan wie hij de goederen moet leveren of de dienst moet verlenen.
      Hiermede strijdige bedingen zijn nietig.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel52
  - number: '53'
    text: |-
      Hij aan wie ingevolge een vóór de inwerkingtreding van een wijziging in de wetgeving inzake omzetbelasting gesloten
      overeenkomst goederen worden geleverd of een dienst wordt verleend, is bevoegd van hem die verplicht is de goederen
      te leveren of de dienst te verlenen, terug te vorderen hetgeen met betrekking tot die goederen of dienst wegens
      omzetbelasting minder is gevorderd dan vóór de inwerkingtreding van die wijziging had kunnen geschieden. Hiermede
      strijdige bedingen zijn nietig.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel53
  - number: '54.1'
    text: |-
      De Wet op de Omzetbelasting 1954 en de wet van 29 december 1966 (*Stb*. 592) vervallen, behalve ten aanzien van
      reeds verrichte leveringen en diensten en begane strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel54
  - number: '54.2'
    text: Onze Minister is bevoegd nadere bepalingen ter zake van de overgang vast te stellen.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel54
  - number: '55.1'
    text: Deze wet treedt in werking met ingang van 1 januari 1969.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel55
  - number: '55.2'
    text: Zij kan worden aangehaald als 'Wet op de omzetbelasting 1968'.
    url: https://wetten.overheid.nl/BWBR0002629/2022-07-08#Artikel55
