        afdeling: '5'
  - number: 28i
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld inzake de toepassing van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28i
  - number: 28j.1
    text: 'In deze wet en in de daarop berustende bepalingen wordt onder beleggingsgoud verstaan:'
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28j
  - number: 28j.1.a
    text: |-
      goud, in de vorm van staven of plaatjes met een door de goudmarkten aanvaard gewicht, met een zuiverheid van ten
      minste 995/1000, al dan niet belichaamd in effecten, doch met uitzondering van bij ministeriële regeling aan te
      wijzen kleine staven of plaatjes met een gewicht van ten hoogste 1 gram;
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28j
  - number: 28j.1.b
    text: 'gouden munten die:'
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28j
  - number: 28j.1.b.1°
    text: een zuiverheid van ten minste 900/1000 hebben;
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28j
  - number: 28j.1.b.2°
    text: na 1800 zijn geslagen;
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28j
  - number: 28j.1.b.3°
    text: in het land van oorsprong als wettig betaalmiddel fungeren of hebben gefungeerd;
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28j
  - number: 28j.1.b.4°
    text: |-
      normaliter verkocht worden voor een prijs die de openmarktwaarde van het in de munten vervatte goud niet met meer
      dan 80% overschrijdt;
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28j
  - number: 28j.1.c
    text: |-
      gouden munten die zijn opgenomen in de lijst die de Europese Commissie elk jaar publiceert in de C-serie van het
      Publicatieblad van de Europese Gemeenschappen en die daarmee worden geacht aan de in onderdeel b opgenomen criteria
      te voldoen gedurende het hele jaar waarvoor de lijst wordt gepubliceerd.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28j
  - number: 28j.2
    text: |-
      De in het eerste lid, onderdelen b en c, bedoelde gouden munten worden, voor de toepassing van deze wet en de
      daarop berustende bepalingen, geacht niet wegens hun numismatische belang te worden verkocht.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28j
  - number: 28k
    text: 'Van de belasting zijn vrijgesteld:'
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28k
  - number: 28k.a
    text: |-
      de levering, de intracommunautaire verwerving en de invoer van beleggingsgoud, waaronder begrepen
      beleggingsgoud dat belichaamd is in certificaten voor toegewezen of niet-toegewezen goud of dat verhandeld
      wordt op goudrekeningen, en waaronder begrepen, in het bijzonder, goudleningen en swaps, die een eigendoms- of
      vorderingsrecht op beleggingsgoud belichamen, evenals de handelingen betreffende beleggingsgoud bestaande in
      future- en termijncontracten die leiden tot de overdracht van een eigendoms- of vorderingsrecht met betrekking
      tot beleggingsgoud;
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28k
  - number: 28k.b
    text: |-
      de diensten door tussenpersonen die handelen in naam en voor rekening van een ander wanneer zij betrokken zijn bij
      de levering van beleggingsgoud voor hun principaal.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28k
  - number: 28l.1
    text: |-
      De ondernemer die beleggingsgoud produceert of goud omzet in beleggingsgoud kan ervoor kiezen
      [artikel 28k, onderdeel a][ref1], op hem niet van toepassing te doen zijn met betrekking tot leveringen van
      beleggingsgoud aan een andere ondernemer.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28k
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28l
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28k
        hoofdstuk: V
        afdeling: '6'
  - number: 28l.2
    text: |-
      De ondernemer die in het kader van zijn onderneming normaliter goud levert voor industriële doeleinden, kan ervoor
      kiezen [artikel 28k, onderdeel a][ref1], op hem niet van toepassing te doen zijn met betrekking tot leveringen van
      beleggingsgoud als bedoeld in [artikel 28j, eerste lid, onderdeel a][ref2], aan een andere ondernemer.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28k
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel28j
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28l
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28k
        hoofdstuk: V
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 28j
        hoofdstuk: V
        afdeling: '6'
  - number: 28l.3
    text: |-
      Indien de leverancier het recht om overeenkomstig het eerste of het tweede lid voor belastingheffing te kiezen
      heeft uitgeoefend, kan de tussenpersoon ervoor kiezen [artikel 28k, onderdeel b][ref1], op hem niet van toepassing
      te doen zijn met betrekking tot de in dat onderdeel vermelde diensten.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28k
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28l
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28k
        hoofdstuk: V
        afdeling: '6'
  - number: 28m.1
    text: |-
      In afwijking in zoverre van [artikel 15][ref1] heeft de ondernemer een recht op aftrek van de belasting die in
      rekening is gebracht of verschuldigd is geworden met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28m
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '15'
        hoofdstuk: II
        afdeling: '4'
  - number: 28m.1.a
    text: |-
      beleggingsgoud dat hem is geleverd door een ondernemer die een in [artikel 28l][ref1] bedoeld keuzerecht heeft
      uitgeoefend;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28l
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28m
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28l
        hoofdstuk: V
        afdeling: '6'
  - number: 28m.1.b
    text: |-
      de levering aan hem of de intracommunautaire verwerving of de invoer door hem van ander goud dan beleggingsgoud dat
      vervolgens door hem of namens hem wordt omgezet in beleggingsgoud;
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28m
  - number: 28m.1.c
    text: |-
      aan hem verleende diensten bestaande in een wijziging van de vorm, het gewicht of de zuiverheid van goud met
      inbegrip van beleggingsgoud;
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28m
  - number: 28m.2
    text: |-
      In afwijking in zoverre van [artikel 15][ref1] heeft de ondernemer die beleggingsgoud produceert of goud in
      beleggingsgoud omzet een recht op aftrek van de belasting die hem in rekening is gebracht of door hem verschuldigd
      is geworden met betrekking tot de levering dan wel de intracommunautaire verwerving of de invoer van goederen of
      diensten die met de productie of de omzetting van dat goud verband houden alsof de latere levering door hem van het
      ingevolge deze afdeling vrijgestelde goud aan de heffing van belasting was onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28m
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '15'
        hoofdstuk: II
        afdeling: '4'
  - number: 28n
    text: |-
      De ondernemer die handelt in beleggingsgoud dient, met overeenkomstige toepassing van [artikel 34][ref1],
      aantekening te houden van alle handelingen betreffende beleggingsgoud waarvoor de vergoeding meer dan € 10 000
      bedraagt en de documenten te bewaren aan de hand waarvan de identiteit van de cliënt bij dergelijke handelingen kan
      worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel34
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28n
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '34'
        hoofdstuk: VI
  - number: 28o
    text: |-
      In geval een ondernemer een levering of een dienst verricht die een verwerking omvat van aan een ander toebehorend
      beleggingsgoud, waardoor het goud niet langer als beleggingsgoud is aan te merken, wordt, in afwijking in zoverre
      van [artikel 8][ref1], de belasting berekend over het door de ondernemer voor die levering of dienst in rekening
      gebrachte bedrag – de omzetbelasting niet daaronder begrepen – vermeerderd met de waarde van het goud dat in het
      tot stand gekomen goed voorkomt.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel8
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28o
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
  - number: 28p
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld inzake de toepassing van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28p
  - number: 28q
    text: 'In deze afdeling en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28q
  - number: 28q.a
    text: |-
      niet in de Gemeenschap gevestigde ondernemers: ondernemers die niet in de Gemeenschap wonen of zijn gevestigd noch
      aldaar een vaste inrichting hebben, en ook niet anderszins voor omzetbelastingdoeleinden in de Gemeenschap zijn
      geïdentificeerd;
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28q
  - number: 28q.b
    text: |-
      lid-staat van identificatie: de lid-staat waar de niet in de Gemeenschap gevestigde ondernemer zich identificeert
      teneinde een nummer van registratie te verkrijgen vanwege het begin van zijn activiteit als ondernemer op het
      grondgebied van de Gemeenschap overeenkomstig deze afdeling;
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28q
  - number: 28q.c
    text: |-
      lid-staat van verbruik: de lid-staat waar overeenkomstig [artikel 6, tweede lid, onderdeel f][ref1], elektronische
      diensten worden verricht;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel6
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28q
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '6'
        hoofdstuk: II
        afdeling: '1'
  - number: 28q.d
    text: |-
      melding elektronische diensten: het elektronische bericht waarin alle gegevens staan die nodig zijn om het bedrag
      te bepalen van de in elke lid-staat van verbruik verschuldigde belasting ter zake van elektronische diensten welke
      zijn verricht aan anderen dan ondernemers die in de Gemeenschap wonen of zijn gevestigd.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28q
  - number: 28r.1
    text: |-
      Een niet in de Gemeenschap gevestigde ondernemer die elektronische diensten verricht aan anderen dan ondernemers
      die in de Gemeenschap wonen of zijn gevestigd, kan ten aanzien van de heffing van belasting kiezen voor Nederland
      als lid-staat van identificatie.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28r
  - number: 28r.2
    text: |-
      Ingeval de niet in de Gemeenschap gevestigde ondernemer kiest voor Nederland als lid-staat van identificatie, dient
      hij onverwijld opgave te doen van het begin of de beëindiging van het verrichten van elektronische diensten, alsook
      van wijziging van deze activiteit in die zin dat de in deze afdeling opgenomen regeling niet langer van toepassing
      is.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28r
  - number: 28r.3
    text: |-
      De in het tweede lid bedoelde opgave vindt langs elektronische weg bij de inspecteur plaats en bevat de volgende
      gegevens:
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28r
  - number: 28r.3.a
    text: naam, postadres en elektronische adressen, met inbegrip van websites, van de ondernemer;
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28r
  - number: 28r.3.b
    text: het eventuele belastingnummer dat aan de ondernemer is verstrekt door zijn nationale belastingautoriteit;
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28r
  - number: 28r.3.c
    text: |-
      een verklaring dat de ondernemer niet reeds in de Gemeenschap is geïdentificeerd voor belastingheffing op grond van
      de Zesde Richtlijn.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28r
  - number: 28r.4
    text: |-
      Indien degene die heeft gekozen voor Nederland als lid-staat van identificatie niet of niet langer voldoet aan de
      voorwaarden voor identificatie, wordt de identificatie door de inspecteur geweigerd respectievelijk beëindigd. De
      weigering of beëindiging geschiedt bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28r
  - number: 28s.1
    text: |-
      In afwijking van [artikel 14][ref1] is de niet in de Gemeenschap gevestigde ondernemer die met toepassing van
      [artikel 28r][ref2] voor Nederland heeft gekozen als lid-staat van identificatie, gehouden met betrekking tot de
      in een tijdvak verschuldigd geworden belasting een melding elektronische diensten bij de inspecteur in te dienen,
      onder vermelding van het hem toegekende nummer van registratie en onder gelijktijdige betaling in euro van de
      verschuldigde belasting aan de ontvanger, overeenkomstig de bepalingen van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel28r
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28s
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '14'
        hoofdstuk: II
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 28r
        hoofdstuk: V
        afdeling: '7'
  - number: 28s.2
    text: |-
      Het in het eerste lid bedoelde tijdvak is een kalenderkwartaal. De melding elektronische diensten dient ook te
      worden ingediend indien in een tijdvak geen elektronische diensten zijn verricht.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28s
  - number: 28s.3
    text: |-
      De in het eerste lid bedoelde melding elektronische diensten vindt plaats langs elektronische weg en bevat
      ten aanzien van elke lid-staat van verbruik waar belasting is verschuldigd, het totale bedrag dat ter zake
      van de elektronische diensten in rekening is gebracht, de omzetbelasting niet daaronder begrepen, alsmede het
      totale bedrag van de daarover verschuldigde belasting. Voorts worden de in de desbetreffende lidstaten geldende
      belastingtarieven en het totale verschuldigde bedrag aan belasting vermeld.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28s
  - number: 28s.4
    text: |-
      De in het eerste lid bedoelde melding elektronische diensten wordt gedaan uiterlijk 20 dagen na het einde van het
      tijdvak waarop die melding betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28s
  - number: 28s.5
    text: |-
      Indien de belasting die verschuldigd is over in Nederland verrichte elektronische diensten, ongeacht de keuze
      van lid-staat van identificatie, geheel of gedeeltelijk niet is betaald, kan de inspecteur met overeenkomstige
      toepassing van [artikel 20 van de Algemene wet inzake rijksbelastingen][ref1] de te weinig geheven belasting
      naheffen. De artikelen [30f][ref2], [67c][ref3] en [67f van de Algemene wet inzake rijksbelastingen][ref4] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel30f
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel67c
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel67f
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28s
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 30f
      - id: ref3
        bwb_id: BWBR0002320
        artikel: 67c
      - id: ref4
        bwb_id: BWBR0002320
        artikel: 67f
  - number: 28s.6
    text: |-
      In afwijking van [artikel 2][ref1] vindt geen aftrek van belasting plaats, maar wordt teruggaaf van belasting
      verleend overeenkomstig de dertiende Richtlijn van de Raad van de Europese Gemeenschappen van 17 november 1986
      betreffende de harmonisatie van de wetgevingen der Lid-Staten inzake omzetbelasting (nr. 86/560/EEG, PbEG L
      326). Artikel 2, tweede en derde lid, en artikel 4, tweede lid, van deze Richtlijn zijn niet van toepassing op
      een verzoek om teruggaaf van belasting dat verband houdt met elektronische diensten waarop de in deze afdeling
      opgenomen regeling van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel2
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28s
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '2'
        hoofdstuk: I
  - number: 28s.7
    text: |-
      De bedragen in de melding elektronische diensten worden uitgedrukt in eurobedragen. Indien de vergoeding
      voor elektronische diensten is uitgedrukt in een andere munteenheid dan de euro wordt, in afwijking van
      [artikel 8, zesde lid][ref1], voor de bepaling van de in het derde lid genoemde bedragen de wisselkoers gehanteerd
      die gold op de laatste dag van de periode waarop de melding elektronische diensten betrekking heeft. De omrekening
      vindt plaats volgens de wisselkoersen die de Europese Centrale Bank voor de desbetreffende dag bekend heeft
      gemaakt of, als er op de desbetreffende dag geen bekendmaking heeft plaatsgevonden, volgens de wisselkoersen op de
      eerstvolgende dag van bekendmaking.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel8
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28s
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
  - number: 28s.8
    text: |-
      [Hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref1] is van overeenkomstige toepassing als ware de
      betaalde belasting op aangifte voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28s
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: V
  - number: 28t.1
    text: |-
      In afwijking van [artikel 52 van de Algemene wet inzake rijksbelastingen][ref1] is een niet in de Gemeenschap
      gevestigde ondernemer die elektronische diensten verricht aan anderen dan ondernemers die in de Gemeenschap wonen
      of zijn gevestigd, gehouden aantekening te houden van alle handelingen die betrekking hebben op elektronische
      diensten en waarvan de raadpleging van belang kan zijn voor de vaststelling van feiten welke van invloed kunnen
      zijn op de heffing van belasting in Nederland en in andere lid-staten van verbruik.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel52
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28t
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '52'
  - number: 28t.2
    text: |-
      De in het eerste lid bedoelde ondernemer is verplicht boeken, bescheiden en andere gegevensdragers of de inhoud
      daarvan – zulks ter keuze van de inspecteur – betreffende elektronische diensten te bewaren gedurende tien jaren na
      afloop van het jaar waarin de dienst is verricht.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28t
  - number: 28t.3
    text: |-
      Desgevraagd dienen de boeken, bescheiden en andere gegevensdragers of de inhoud daarvan langs elektronische weg
      ter beschikking te worden gesteld aan de inspecteur, aan de ontvanger, of aan de belastingautoriteit van een andere
      lid-staat van verbruik.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28t
  - number: '29.1'
    text: 'Op verzoek wordt teruggaaf verleend van de belasting ter zake van leveringen en diensten, voor zover de vergoeding:'
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel29
  - number: 29.1.a
    text: niet is en niet zal worden ontvangen;
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel29
  - number: 29.1.b
    text: |-
      wordt terugbetaald omdat een vermindering van de vergoeding is verleend of omdat de goederen in ongebruikte staat
      zijn teruggenomen.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel29
  - number: '29.2'
    text: |-
      De ondernemer die ingevolge [artikel 15][ref1] belasting in aftrek heeft gebracht ter zake van aan hem verrichte
      leveringen van goederen en diensten, wordt het afgetrokken bedrag naar evenredigheid als belasting verschuldigd
      op het tijdstip waarop en voor zover redelijkerwijs moet worden aangenomen dat hij de vergoeding waarop dat bedrag
      betrekking heeft, niet of niet geheel zal betalen dan wel heeft terugontvangen. De belasting wordt in ieder geval
      verschuldigd twee jaren na de opeisbaarheid van de vergoeding, voor zover deze op dat tijdstip nog niet is betaald.
      De verschuldigd geworden belasting wordt op de voet van [artikel 14][ref2] voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel14
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '15'
        hoofdstuk: II
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '14'
        hoofdstuk: II
        afdeling: '4'
  - number: '29.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld waarin het eerste en tweede lid niet van toepassing
      worden verklaard op bedragen welke niet zijn ontvangen onderscheidenlijk betaald ten gevolge van een korting voor
      contante betaling.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel29
  - number: 29a.1
    text: |-
      Op verzoek wordt teruggaaf verleend van de belasting ter zake van intracommunautaire verwerving van goederen, voor
      zover de vergoeding wordt terugbetaald omdat een vermindering van de vergoeding is verleend of omdat de goederen
      in ongebruikte staat zijn teruggezonden. De teruggaaf wordt slechts verleend voor zover de ondernemer de belasting
      niet in aftrek heeft gebracht.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel29a
  - number: 29a.2
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld waarin het eerste lid niet van toepassing wordt
      verklaard op bedragen welke niet zijn betaald ten gevolge van een korting voor contante betaling.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel29a
  - number: '30.1'
    text: |-
      Op verzoek wordt teruggaaf verleend van de belasting ter zake van intracommunautaire verwerving van goederen in de
      gevallen waarin de belasting is geheven met toepassing van [artikel 17b, tweede lid][ref1], en door belanghebbende
      wordt aangetoond dat ter zake van dezelfde verwerving belasting is geheven in de lid-staat van aankomst van de
      verzending of het vervoer.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel17b
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 17b
        hoofdstuk: IIA
        afdeling: '1'
  - number: '30.2'
    text: |-
      Op verzoek wordt mede teruggaaf verleend van de belasting ter zake van intracommunautaire verwerving van goederen
      in de gevallen waarin de belasting is geheven met toepassing van [artikel 17b, tweede lid][ref1], en door de
      ondernemer wordt aangetoond dat de goederen door hem in de lid-staat van aankomst van de verzending of het vervoer
      worden geleverd aan ondernemers of aan rechtspersonen, andere dan ondernemers, en de goederen rechtstreeks naar die
      afnemers worden verzonden of vervoerd. De teruggaaf wordt alleen verleend indien de ondernemer heeft voldaan aan
      het bepaalde in [artikel 37a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel17b
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel37a
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 17b
        hoofdstuk: IIA
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 37a
        hoofdstuk: VI
  - number: '30.3'
    text: |-
      Op verzoek wordt voorts naar evenredigheid teruggaaf verleend van de belasting ter zake van intracommunautaire
      verwerving van accijnsgoederen in de gevallen waarin na het tijdstip waarop die intracommunautaire verwerving
      van accijnsgoederen is verricht de in de lid-staat van vertrek van de verzending of het vervoer van die goederen
      voldane accijns door de afnemer is terugontvangen.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel30
  - number: '30.4'
    text: |-
      Op verzoek wordt teruggaaf verleend van de belasting ter zake van invoer van goederen door een rechtspersoon,
      andere dan ondernemer, welke goederen zijn verzonden of vervoerd uit een derde-land met als bestemming een andere
      lid-staat, indien belanghebbende aantoont dat in die andere lid-staat ter zake van intracommunautaire verwerving
      van die goederen belasting is geheven.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel30
  - number: 30a
    text: |-
      In afwijking van [artikel 1, aanhef en onderdelen b en c][ref1], wordt ter zake van intracommunautaire verwervingen
      van goederen die op grond van [artikel 17b, eerste lid][ref2], in Nederland worden verricht geen belasting geheven,
      voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel17b
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 17b
        hoofdstuk: IIA
        afdeling: '1'
  - number: 30a.a
    text: |-
      de goederen zijn verworven door een ondernemer die niet in Nederland woont of is gevestigd en aldaar geen vaste
      inrichting heeft en aan wie een btw-identificatienummer is toegekend in een andere lid-staat;
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel30a
  - number: 30a.b
    text: |-
      de goederen door deze ondernemer in Nederland worden geleverd aan een ondernemer die in Nederland woont of is
      gevestigd dan wel aldaar een vaste inrichting heeft, of aan een in Nederland gevestigd lichaam in de zin van de
      [Algemene wet inzake rijksbelastingen][ref1], en aan welke afnemer in Nederland een btw-identificatienummer is
      toegekend; en


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: 30a.c
    text: |-
      de goederen rechtstreeks naar de in onderdeel *b* bedoelde afnemer worden verzonden of vervoerd vanuit een lid-
      staat die niet een btw-identificatienummer heeft toegekend aan de in onderdeel *a* bedoelde ondernemer.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel30a
  - number: '31'
    text: |-
      Bij overgang van het geheel of een gedeelte van een algemeenheid van goederen, al dan niet tegen vergoeding of
      in de vorm van een inbreng in een vennootschap, wordt geacht dat geen leveringen of diensten plaatsvinden en
      treedt, tenzij bij ministeriële regeling anders is bepaald, degene op wie de goederen overgaan in de plaats van
      de overdrager.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel31
  - number: '32'
    text: |-
      De ondernemer die in Nederland woont of is gevestigd, wordt geacht zijn leveringen en diensten in Nederland
      te verrichten, voor zover hij niet aan de hand van boeken, bescheiden of andere gegevensdragers het tegendeel
      aantoont. Deze bepaling is eveneens van toepassing op de ondernemer die in Nederland een vaste inrichting heeft,
      voor zover de leveringen en diensten vanuit die inrichting worden verricht.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel32
  - number: '33.1'
    text: |-
      Een verzoek om teruggaaf van belasting geschiedt bij de aangifte over het tijdvak waarin het recht op teruggaaf
      is ontstaan.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel33
  - number: '33.2'
    text: |-
      In gevallen waarin geen aangifte op de voet van [artikel 14][ref1] moet worden ingediend, geschiedt een verzoek om
      teruggaaf door het doen van aangifte.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel14
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '14'
        hoofdstuk: II
        afdeling: '4'
  - number: '33.3'
    text: |-
      Indien een verzoek om teruggaaf als is bedoeld in het tweede lid wordt ingediend door een ondernemer die niet in
      Nederland woont of is gevestigd en aldaar geen vaste inrichting heeft, dient het verzoek betrekking te hebben op
      belasting waarvoor het recht op teruggaaf is ontstaan in een tijdvak van ten minste drie maanden en ten hoogste een
      kalenderjaar. Het tijdvak mag evenwel korter zijn dan drie maanden indien deze periode het resterende gedeelte van
      een kalenderjaar betreft. De verzoeken kunnen mede belasting betreffen waarvoor het recht op teruggaaf is ontstaan
      in een ander tijdvak van hetzelfde kalenderjaar, maar waarvoor eerder geen verzoek om teruggaaf werd ingediend.
      Het verzoek moet worden ingediend binnen zes maanden na afloop van het kalenderjaar waarin het recht op teruggaaf
      is ontstaan.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel33
  - number: '33.4'
    text: |-
      Indien een verzoek om teruggaaf als is bedoeld in het tweede lid wordt ingediend door een ander dan een ondernemer
      genoemd in het derde lid, dient het verzoek betrekking te hebben op belasting waarvoor het recht op teruggaaf is
      ontstaan in een kwartaal en moet het verzoek worden ingediend binnen drie maanden na afloop van dat kwartaal.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel33
  - number: '33.5'
    text: |-
      In gevallen als zijn bedoeld in het derde lid wordt in afwijking van [artikel 17][ref1] geen teruggaaf verleend
      indien het verzoek betrekking heeft op een bedrag aan belasting van minder dan € 200. Betreft een verzoek om
      teruggaaf als is bedoeld in het derde lid evenwel een kalenderjaar of het resterende gedeelte daarvan, dan moet het
      bedrag aan belasting waarop het verzoek betrekking heeft ten minste € 25 belopen. Ter voldoening aan het bepaalde
      in artikel 7, leden 1 en 2, van de achtste Richtlijn van de Raad van de Europese Gemeenschappen betreffende de
      harmonisatie van de wetgevingen der Lid-Staten inzake omzetbelasting (nr. 79/1072/EEG, *PbEG* L 331), kunnen bij
      ministeriële regeling de beide vorenvermelde bedragen worden vervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel17
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '17'
        hoofdstuk: II
        afdeling: '4'
  - number: '33.6'
    text: |-
      Een ondernemer die niet in Nederland woont of is gevestigd en aldaar geen vaste inrichting heeft, behoeft bij
      een verzoek om teruggaaf, in afwijking van [artikel 57 van de Algemene wet inzake rijksbelastingen][ref1], geen
      domicilie in Nederland te kiezen. Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de wijze
      waarop deze ondernemers moeten aantonen, dat zij ondernemer zijn in de zin van [artikel 7][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel7
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '57'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '7'
        hoofdstuk: II
        afdeling: '1'
  - number: '33.7'
    text: De inspecteur beslist op het verzoek om teruggaaf bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel33
  - number: 33a.1
    text: |-
      De ondernemer die niet in Nederland woont of is gevestigd en aldaar geen vaste inrichting heeft, kan in Nederland
      een fiscaal vertegenwoordiger aanstellen ter zake van zijn leveringen en diensten waarvoor hij de belasting
      verschuldigd is en ter zake van zijn intracommunautaire verwervingen en invoer. De fiscaal vertegenwoordiger treedt
      op namens de ondernemer en treedt in zijn plaats met betrekking tot alle rechten en verplichtingen die hij heeft
      inzake de aangifte en de betaling van de belasting, alsmede de verplichtingen bedoeld in [artikel 37a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel37a
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 37a
        hoofdstuk: VI
  - number: 33a.2
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald in welke gevallen een ondernemer als bedoeld in het eerste
      lid verplicht is een fiscaal vertegenwoordiger aan te stellen.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel33a
  - number: 33a.3
    text: De fiscaal vertegenwoordiger dient in het bezit te zijn van een daartoe verstrekte vergunning van de inspecteur.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel33a
  - number: 33a.4
    text: |-
      Degene die een vergunning als fiscaal vertegenwoordiger wil verkrijgen, dient daartoe een verzoek in bij de
      inspecteur. Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de gegevens
      die het verzoek moet bevatten.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel33a
  - number: 33a.5
    text: |-
      Bij het verzoek dient een verklaring van de in het eerste lid bedoelde ondernemer te worden overgelegd waaruit
      blijkt dat degene die het verzoek indient door de ondernemer is gemachtigd namens hem op te treden als fiscaal
      vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel33a
  - number: 33a.6
    text: |-
      Bij algemene maatregel van bestuur kunnen, ter verzekering van de heffing en de invordering, regels worden gesteld
      met betrekking tot de voorwaarden waaronder de vergunning wordt verleend, gewijzigd en ingetrokken. Het verlenen,
      het wijzigen en het intrekken van de vergunning geschiedt bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel33a
  - number: '34.1'
    text: |-
      De ondernemer is gehouden, met inachtneming van bij ministeriële regeling te stellen regels, aantekening te houden
      van de door hem en aan hem verrichte leveringen van goederen en verleende diensten, van de door hem verrichte
      intracommunautaire verwervingen van goederen, van de invoer van goederen in en de uitvoer van goederen uit de
      Gemeenschap, alsmede van andere gegevens die van belang zijn met betrekking tot de heffing van de belasting in
      Nederland en in andere lid-staten.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel34
  - number: '34.2'
    text: 'De ondernemer is tevens, met inachtneming van bij ministeriële regeling te stellen regels, gehouden:'
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel34
  - number: 34.2.a
    text: |-
      een register bij te houden van de goederen die door hem of voor zijn rekening zijn verzonden of vervoerd naar een
      andere lid-staat om aldaar te worden gebruikt voor de in [artikel 3a, tweede lid, onderdelen e, f en g][ref1],
      bedoelde doeleinden;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel3a
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 3a
        hoofdstuk: II
        afdeling: '1'
  - number: 34.2.b
    text: |-
      afzonderlijk aantekening te houden van de goederen die vanuit een andere lid-staat naar hem zijn verzonden of
      vervoerd door of voor rekening van een ondernemer aan wie een btw-identificatienummer is toegekend in een andere
      lid-staat, ten behoeve van een dienst als bedoeld in [artikel 6, tweede lid, onderdeel c, onder 3°][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel6
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '6'
        hoofdstuk: II
        afdeling: '1'
  - number: '34.3'
    text: |-
      De rechtspersoon, andere dan ondernemer, is gehouden, met inachtneming van bij ministeriële regeling te stellen
      regels, aantekening te houden van de door hem verrichte intracommunautaire verwervingen van goederen.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel34
  - number: '34.4'
    text: |-
      De ondernemer die goederen levert met toepassing van [artikel 28b][ref1], [28c][ref2] of [28d](onbekend), is tevens
      gehouden, met inachtneming van bij ministeriële regeling te stellen regels, afzonderlijk aantekening te houden van
      de met toepassing van de onderscheiden artikelen geleverde goederen, alsmede van de invoer en van de leveringen
      daarvan aan hem.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28b
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel28c
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28b
        hoofdstuk: V
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 28c
        hoofdstuk: V
        afdeling: '5'
  - number: 34a
    text: |-
      De ondernemer is verplicht boeken, bescheiden en andere gegevensdragers of de inhoud daarvan – zulks ter keuze
      van de inspecteur – betreffende onroerende zaken en rechten waaraan deze zijn onderworpen gedurende negen jaren,
      volgende op het jaar waarin hij het goed is gaan bezigen, te bewaren.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel34a
  - number: '35.1'
    text: |-
      Iedere ondernemer draagt er zorg voor dat door hemzelf dan wel, in zijn naam en voor zijn rekening, door zijn
      afnemer of een derde, een factuur wordt uitgereikt:
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel35
  - number: 35.1.a
    text: |-
      ter zake van zijn leveringen of diensten die hij heeft verricht aan een andere ondernemer of aan een rechtspersoon,
      andere dan ondernemer;
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel35
  - number: 35.1.b
    text: |-
      ter zake van zijn leveringen met toepassing van [artikel 5a, eerste lid][ref1], dan wel van de bij deze wet
      behorende tabel II, onderdeel a, post 6, aan anderen dan de in onderdeel a bedoelde ondernemers en rechtspersonen;
      en


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel5a
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 5a
        hoofdstuk: II
        afdeling: '1'
  - number: 35.1.c
    text: |-
      ter zake van vooruitbetalingen die door een andere ondernemer of een rechtspersoon, andere dan ondernemer, aan hem
      worden gedaan voordat de levering of de dienst is verricht.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel35
  - number: '35.2'
    text: |-
      In afwijking in zoverre van het eerste lid draagt een ondernemer die doorgaans levert aan andere ondernemers,
      er zorg voor dat een factuur wordt uitgereikt ter zake van al zijn leveringen. De vorige volzin is alleen van
      toepassing ten aanzien van ondernemers of groepen van ondernemers die daartoe bij ministeriële regeling zijn
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel35
  - number: '35.3'
    text: |-
      Onder bij ministeriële regeling te stellen voorwaarden en beperkingen zijn ondernemers die uitsluitend
      vrijgestelde prestaties verrichten, ontheven van de verplichting ingevolge het eerste lid. De vorige volzin is
      van overeenkomstige toepassing op de vrijgestelde prestaties van ondernemers die zowel vrijgestelde als belaste
      prestaties verrichten.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel35
  - number: '35.4'
    text: |-
      Ieder document of bericht dat wijzigingen aanbrengt in, en specifiek en ondubbelzinnig verwijst naar de
      oorspronkelijke factuur, geldt als factuur.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel35
  - number: '35.5'
    text: |-
      De factuur moet worden uitgereikt vóór de vijftiende dag na de maand waarin de levering of de dienst is verricht.
      In geval van vooruitbetalingen als bedoeld in het eerste lid, onderdeel c, moet de factuur telkens worden
      uitgereikt vóór het tijdstip van de opeisbaarheid daarvan.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel35
  - number: '35.6'
    text: |-
      Voor verscheidene afzonderlijke leveringen of diensten kan een periodieke factuur worden opgemaakt, mits deze
      leveringen of diensten gelijksoortig zijn en de periode waarop de factuur betrekking heeft niet langer is dan een
      maand.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel35
  - number: '35.7'
    text: |-
      Ingeval de afnemer de factuur opmaakt voor de ondernemer die aan hem goederen levert of diensten verricht, wordt
      dat vooraf overeengekomen in een akkoord tussen beide partijen en maakt iedere factuur deel uit van een procedure
      van aanvaarding door de ondernemer die de leveringen of diensten verricht.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel35
  - number: 35a.1
    text: 'Op de factuur zijn de volgende vermeldingen verplicht:'
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel35a
  - number: 35a.1.a
    text: de datum van uitreiking;
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel35a
  - number: 35a.1.b
    text: een opeenvolgend nummer, met één of meer reeksen, waardoor de factuur eenduidig wordt geïdentificeerd;
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel35a
  - number: 35a.1.c
    text: het btw-identificatienummer waaronder de ondernemer de levering of de dienst heeft verricht;
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel35a
  - number: 35a.1.d
    text: |-
      het btw-identificatienummer van de afnemer aan wie de levering of de dienst is verricht en van wie de belasting
      wordt geheven of aan wie is geleverd met toepassing van de bij deze wet behorende tabel II, onderdeel a, post 6;
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel35a
  - number: 35a.1.e
    text: de naam en het adres van de ondernemer en zijn afnemer;
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel35a
  - number: 35a.1.f
    text: de hoeveelheid en de aard van de geleverde goederen of de omvang en de aard van de verrichte diensten;
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel35a
  - number: 35a.1.g
    text: |-
      de datum waarop de levering of de dienst heeft plaatsgevonden of is voltooid of de datum waarop de in
      [artikel 35, eerste lid, onderdeel c][ref1], bedoelde vooruitbetaling is gedaan, voorzover die datum kan worden
      vastgesteld en verschilt van de uitreikingsdatum van de factuur;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel35
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '35'
        hoofdstuk: VI
  - number: 35a.1.h
    text: |-
      de vergoeding met betrekking tot elk tarief of elke vrijstelling, de eenheidsprijs exclusief belasting, evenals de
      eventuele vooruitbetalingskortingen en andere kortingen indien die niet in de eenheidsprijs zijn begrepen;
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel35a
  - number: 35a.1.i
    text: het toegepaste tarief;
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel35a
  - number: 35a.1.j
    text: het te betalen bedrag van de belasting;
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel35a
  - number: 35a.1.k
    text: |-
      in geval van een vrijstelling of van leveringen met toepassing van de bij deze wet behorende tabel II, onderdeel a,
      post 6, of wanneer de belasting wordt geheven van de afnemer, enige aanduiding daarvan;
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel35a
  - number: 35a.1.l
    text: de gegevens die nodig zijn om te bepalen of een vervoermiddel een nieuw vervoermiddel is;
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel35a
  - number: 35a.1.m
    text: |-
      ingeval een wederverkoper goederen levert met toepassing van [artikel 28b][ref1], [28c][ref2] of [28d][ref3], enige
      aanduiding daarvan;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28b
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel28c
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel28d
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28b
        hoofdstuk: V
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 28c
        hoofdstuk: V
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0002629
        artikel: 28d
        hoofdstuk: V
        afdeling: '5'
  - number: 35a.1.n
    text: |-
      ingeval de belasting wordt voldaan door een fiscaal vertegenwoordiger als bedoeld in [artikel 33a][ref1], het btw-
      identificatienummer van deze fiscaal vertegenwoordiger, alsmede zijn naam en adres.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 33a
        hoofdstuk: VI
  - number: 35a.2
    text: |-
      Op een factuur kunnen bedragen in willekeurig welke munteenheid voorkomen, mits het te betalen bedrag van de
      belasting is uitgedrukt in euro's en daarbij gebruik wordt gemaakt van het wisselkoersmechanisme, bedoeld in
      [artikel 11, onderdeel C, punt 2, van de Zesde Richtlijn](onbekend).
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel35a
  - number: 35a.3
    text: |-
      Wanneer zulks uit een oogpunt van controle nodig is, kan de inspecteur een vertaling in het Nederlands eisen van
      facturen betreffende in Nederland verrichte prestaties, alsmede van facturen die worden ontvangen door in Nederland
      gevestigde ondernemers.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel35a
  - number: 35a.4
    text: |-
      Bij ministeriële regeling kan voor bepaalde ondernemers of groepen van ondernemers ontheffing worden verleend van
      bepaalde verplichtingen welke zijn opgelegd bij dit artikel, wanneer het bedrag van de factuur onbeduidend is of
      wanneer de handels- of administratieve praktijken van de betrokken bedrijfssector of de technische voorwaarden
      waaronder die facturen worden uitgereikt, de naleving bemoeilijken van alle verplichtingen die zijn opgelegd bij
      dit artikel.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel35a
  - number: 35b.1
    text: |-
      Facturen mogen zowel op papier worden uitgereikt als, onder voorbehoud van aanvaarding door de afnemer,
      elektronisch worden verzonden.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel35b
  - number: 35b.2
    text: |-
      Elektronisch verzonden facturen worden door de inspecteur aanvaard, mits de authenticiteit van de herkomst en de
      integriteit van de inhoud ervan worden gewaarborgd door middel van:
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel35b
  - number: 35b.2.a
    text: |-
      een geavanceerde elektronische handtekening in de zin van artikel 2, lid 2, van [richtlijn nr. 1999/93/EG]
      (31999L0093) van het Europees Parlement en de Raad van de Europese Unie van 13 december 1999 betreffende een
      gemeenschappelijk kader voor elektronische handtekeningen (PbEG 2000, L 13);
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel35b
  - number: 35b.2.b
    text: |-
      een elektronische uitwisseling van gegevens (EDI), zoals gedefinieerd in artikel 2 van aanbeveling nr. 1994/820/EG
      van de Europese Commissie van 19 oktober 1994 betreffende de juridische aspecten van de elektronische uitwisseling
      van gegevens (PbEG L 338), wanneer het akkoord betreffende deze uitwisseling voorziet in het gebruik van procedures
      die de authenticiteit van de herkomst en de integriteit van de gegevens waarborgen, aangevuld met een papieren
      afstemmingoverzicht; of
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel35b
  - number: 35b.2.c
    text: een andere methode, mits deze methode aan de inspecteur is gemeld.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel35b
  - number: 35b.3
    text: |-
      Bij een reeks facturen die langs elektronische weg naar dezelfde afnemer worden verzonden, hoeven de voor de
      verschillende facturen gelijke vermeldingen slechts één keer te worden opgenomen, voorzover voor elke factuur alle
      informatie toegankelijk is.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel35b
  - number: 35c.1
    text: |-
      De ondernemer bewaart kopieën van de door hemzelf dan wel, in zijn naam en voor zijn rekening, door zijn afnemer of
      een derde uitgereikte facturen, en alle door hemzelf ontvangen facturen in zijn administratie.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel35c
  - number: 35c.2
    text: |-
      Wanneer een ondernemer de facturen die hij langs elektronische weg verzendt of ontvangt, opslaat, waarbij een on
      line toegang tot de gegevens wordt gewaarborgd, en wanneer de plaats van opslag is gesitueerd in een andere lid-
      staat, heeft de inspecteur met het oog op de toepassing van deze wet een recht van toegang tot en van downloading
      en gebruikmaking langs elektronische weg van deze facturen, voorzover hij deze nodig heeft voor controledoeleinden.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel35c
  - number: 35c.3
    text: |-
      De authenticiteit van de herkomst en de integriteit van de inhoud van de facturen, alsmede de leesbaarheid ervan,
      moeten gedurende de gehele opslagperiode worden gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel35c
  - number: 35c.4
    text: |-
      Ingeval facturen elektronisch worden opgeslagen, worden de gegevens die de authenticiteit van de herkomst en de
      integriteit van de inhoud waarborgen, eveneens opgeslagen.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel35c
  - number: 35d
    text: |-
      Voor de toepassing van de [artikelen 35b][ref1] en [35c][ref2] wordt verstaan onder het elektronisch verzenden en
      opslaan van een factuur de verzending of terbeschikkingstelling aan de ontvanger en de opslag via elektronische
      apparatuur voor de verwerking, met inbegrip van digitale compressie, en de opslag van gegevens, waarbij gebruik
      wordt gemaakt van draden, radio, optische middelen of andere elektromagnetische middelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel35b
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel35c
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel35d
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 35b
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 35c
        hoofdstuk: VI
  - number: '36'
    text: |-
      De [artikelen 25, zesde lid][ref1], en [27e, van de Algemene wet inzake rijksbelastingen][ref2] vinden
      overeenkomstige toepassing, ingeval niet volledig is voldaan aan de verplichtingen welke zijn opgelegd bij of
      krachtens de [artikelen 28n][ref3], [34][ref4], [34a][ref5], [35][ref6], [35a][ref7], [35b][ref8], [35c][ref9]
      en [39][ref10].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel28n
      [ref4]: https://wetten.overheid.nl/BWBR0002629#Artikel34
      [ref5]: https://wetten.overheid.nl/BWBR0002629#Artikel34a
      [ref6]: https://wetten.overheid.nl/BWBR0002629#Artikel35
      [ref7]: https://wetten.overheid.nl/BWBR0002629#Artikel35a
      [ref8]: https://wetten.overheid.nl/BWBR0002629#Artikel35b
      [ref9]: https://wetten.overheid.nl/BWBR0002629#Artikel35c
      [ref10]: https://wetten.overheid.nl/BWBR0002629#Artikel39
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '27'
      - id: ref3
        bwb_id: BWBR0002629
        artikel: 28n
        hoofdstuk: V
        afdeling: '6'
      - id: ref4
        bwb_id: BWBR0002629
        artikel: '34'
        hoofdstuk: VI
      - id: ref5
        bwb_id: BWBR0002629
        artikel: 34a
        hoofdstuk: VI
      - id: ref6
        bwb_id: BWBR0002629
        artikel: '35'
        hoofdstuk: VI
      - id: ref7
        bwb_id: BWBR0002629
        artikel: 35a
        hoofdstuk: VI
      - id: ref8
        bwb_id: BWBR0002629
        artikel: 35b
        hoofdstuk: VI
      - id: ref9
        bwb_id: BWBR0002629
        artikel: 35c
        hoofdstuk: VI
      - id: ref10
        bwb_id: BWBR0002629
        artikel: '39'
        hoofdstuk: VI
  - number: '37'
    text: |-
      Hij die op een factuur op enigerlei wijze melding maakt van omzetbelasting welke hij, anders dan op grond van dit
      artikel, niet verschuldigd is geworden, wordt die belasting verschuldigd op het tijdstip waarop hij die factuur
      heeft uitgereikt; hij is gehouden deze belasting op de voet van [artikel 14][ref1] te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel14
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '14'
        hoofdstuk: II
        afdeling: '4'
  - number: 37a.1
    text: |-
      De ondernemer, uitgezonderd die bedoeld in [artikel 7, zesde lid][ref1], is verplicht uiterlijk de laatste dag van
      de maand volgend op een kalenderkwartaal bij de inspecteur door middel van het uitgereikte of toegezonden formulier
      een lijst in te dienen waarop zijn vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel7
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '7'
        hoofdstuk: II
        afdeling: '1'
  - number: 37a.1.a
    text: |-
      de afnemers aan wie goederen zijn geleverd met toepassing van de bij deze wet behorende tabel II, onderdeel *a*,
      post 6;
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel37a
  - number: 37a.1.b
    text: |-
      de afnemers aan wie in een andere lid-staat goederen zijn geleverd in aansluiting op in die lid-staat door de
      ondernemer verrichte intracommunautaire verwervingen waarvoor tevens belasting is geheven met toepassing van
      [artikel 17][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel17b
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 17b
        hoofdstuk: IIA
        afdeling: '1'
  - number: 37a.2
    text: |-
      In de lijst wordt opgave verlangd van de gegevens als bedoeld in [artikel 22, lid 6, onder ](onbekend), waarvan
      de kennisneming van belang kan zijn voor de heffing van belasting ter zake van intracommunautaire verwervingen van
      goederen in andere lid-staten en die noodzakelijk zijn met het oog op de naleving van de bepalingen betreffende
      administratieve samenwerking op het gebied van de indirecte belastingen als bedoeld in dezelfde bepaling.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel37a
  - number: 37a.3
    text: |-
      In afwijking in zoverre van het eerste en tweede lid staat de inspecteur toe dat elektronische middelen worden
      gebruikt om de aldaar bedoelde gegevens in te dienen. De inspecteur kan tevens toestaan dat deze gegevens op andere
      wijze worden ingediend.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel37a
  - number: 37a.4
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld inzake het indienen van de in dit artikel bedoelde
      gegevens met behulp van elektronische middelen.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel37a
  - number: 37b
    text: |-
      Degene die ter zake van de intracommunautaire verwerving van goederen valt onder de toepassing van
      [artikel 1a, tweede lid][ref1], wordt niettemin de belasting verschuldigd ter zake van die intracommunautaire
      verwerving wanneer in de lid-staat waar de goederen worden geleverd, belastingheffing plaatsvindt alsof
      [artikel 1, aanhef en onderdeel b][ref2], van toepassing zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel1
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel37b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 1a
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '1'
        hoofdstuk: I
  - number: '38'
    text: |-
      Het is de ondernemer verboden aan anderen dan ondernemers en publiekrechtelijke lichamen goederen en diensten aan
      te bieden tegen prijzen met zodanige aanduidingen dat de omzetbelasting niet in de prijzen zou zijn begrepen.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel38
  - number: '39'
    text: 'Bij algemene maatregel van bestuur kunnen:'
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel39
  - number: 39.a
    text: |-
      nadere, zo nodig van de bepalingen van deze wet afwijkende, regels worden gesteld welke tot vergemakkelijking van
      de heffing van belasting kunnen leiden;
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel39
  - number: 39.b
    text: |-
      andere in het kader van de wet passende nadere regels worden gesteld ter aanvulling van in de wet geregelde
      onderwerpen.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel39
  - number: '40.1'
    text: |-
      Indien de ondernemer de in [artikel 28s, eerste lid][ref1], bedoelde melding elektronische diensten of de in
      [artikel 37a][ref2] bedoelde lijst niet of niet tijdig heeft ingediend, dan wel een onvolledige of een onjuiste
      lijst of melding elektronische diensten heeft ingediend, vormt dat een verzuim ter zake waarvan de inspecteur hem
      een boete van ten hoogste € 4537 kan opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28s
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel37a
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28s
        hoofdstuk: V
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 37a
        hoofdstuk: VI
  - number: '40.2'
    text: |-
      De bevoegdheid tot het opleggen van de in het eerste lid bedoelde boete vervalt door het verloop van vijf jaren na
      het einde van het kalenderjaar waarin de in [artikel 28s, eerste lid][ref1], of [artikel 37a, eerste lid][ref2],
      genoemde verplichting is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28s
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel37a
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28s
        hoofdstuk: V
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 37a
        hoofdstuk: VI
  - number: '42'
    text: |-
      Hij die het in [artikel 38][ref1] vervatte verbod overtreedt, wordt gestraft met een geldboete van de derde
      categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel38
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '38'
        hoofdstuk: VI
  - number: '43.1'
    text: |-
      Aan een ondernemer die bij de aanvang van 1 januari 1969 goederen, anders dan als bedrijfsmiddel, in ongebruikte
      staat hier te lande in voorraad heeft, wordt teruggaaf verleend van de omzetbelasting - andere dan bedoeld in
      artikel I, eerste lid, van de wet van 13 december 1967 (*Stb*. 614) - voldaan voor die goederen en voor de bij de
      voortbrenging van die goederen verbruikte grondstoffen en hulpstoffen. De teruggaaf omvat mede de omzetbelasting
      voldaan voor de bij de voortbrenging van de in voorraad zijnde goederen gebezigde bedrijfsmiddelen en diensten,
      indien de ondernemer de goederen, ongebruikt en in de staat waarin zij zich bij de aanvang van 1 januari 1969
      bevinden, in dat jaar uitvoert. Het recht op teruggaaf dient te kunnen worden aangetoond aan de hand van boeken
      en bescheiden.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel43
  - number: '43.2'
    text: |-
      Onze Minister geeft omtrent de teruggaaf nadere regelen, waarbij zij naar algemene maatstaven kan worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel43
  - number: '43.3'
    text: |-
      De teruggaaf wordt slechts verleend, voor zover de ondernemer bij levering aan hem van de goederen na 31 december
      1968 de ter zake in rekening gebrachte belasting op de voet van [artikel 15][ref1] in aftrek zou kunnen brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '15'
        hoofdstuk: II
        afdeling: '4'
  - number: '43.4'
    text: 'De aanspraak op teruggaaf ontstaat:'
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel43
  - number: 43.4.a
    text: |-
      ingeval de gehele teruggaaf niet meer bedraagt dan f 1500, telkens voor een vierde gedeelte aan het einde van het
      tweede, derde en vierde kwartaal van het jaar 1969 en het eerste kwartaal van het jaar 1970;
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel43
  - number: 43.4.b
    text: |-
      ingeval de gehele teruggaaf meer bedraagt dan f 1500, telkens voor een vierde gedeelte aan het einde van het
      tweede, derde en vierde kwartaal van het jaar 1969 en het vierde kwartaal van het jaar 1970.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel43
  - number: '43.5'
    text: |-
      De aanspraak op teruggaaf ter zake van de uitvoer van de goederen ontstaat echter aan het einde van het kwartaal
      waarin de uitvoer plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel43
  - number: '43.6'
    text: |-
      De omzetbelasting, waarvan de teruggaaf op grond van het vierde lid, letter *b*, plaatsvindt na het einde van het
      vierde kwartaal van het jaar 1970, wordt met 6 percent verhoogd als vergoeding voor renteverlies.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel43
  - number: '43.7'
    text: |-
      Tegen een ingevolge [artikel 25 van de Algemene wet inzake rijksbelastingen][ref1] gedane uitspraak
      van de inspecteur betreffende de toepassing van de vorige leden staat, in afwijking in zoverre van
      [artikel 26, eerste lid][ref2], van genoemde wet, uitsluitend beroep open bij de Tariefcommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel26
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '26'
        hoofdstuk: V
        afdeling: '2'
  - number: '44.1'
    text: |-
      Ter zake van de invoer in 1969 van vóór 1 januari 1969 in Nederland gebrachte goederen, wordt een bijzondere
      verbruiksbelasting geheven tot het bedrag, dat bij invoer in 1968 verschuldigd zou zijn geweest uit hoofde van
      artikel I, eerste lid, van de wet van 13 december 1967 (*Stb*. 614).
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel44
  - number: '44.2'
    text: |-
      De Algemene wet inzake de douane en de accijnzen is van toepassing als ware de in het eerste lid bedoelde belasting
      invoerrecht.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel44
  - number: '45.1'
    text: |-
      Met afwijking in zoverre van de [artikelen 2][ref1] en [15][ref2] is, met betrekking tot goederen welke zijn
      bestemd om door de ondernemer als bedrijfsmiddel te worden gebruikt, aftrek slechts toegestaan van:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '15'
        hoofdstuk: II
        afdeling: '4'
  - number: 45.1.a
    text: 30 percent van de belasting, ingeval de levering of de invoer plaatsvindt in 1969 of 1970;
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel45
  - number: 45.1.b
    text: 60 percent van de belasting, ingeval de levering of de invoer plaatsvindt in 1971;
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel45
  - number: 45.1.c
    text: 67 percent van de belasting, ingeval de levering of de invoer plaatsvindt in 1972.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel45
  - number: '45.2'
    text: 'Het eerste lid vindt geen toepassing ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel45
  - number: 45.2.a
    text: schepen, met uitzondering van woonschepen en van pleziervaartuigen;
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel45
  - number: 45.2.b
    text: |-
      machines en toestellen voor het vervaardigen en in het fabricageproces bewerken of afwerken van produkten in de
      textielindustrie (met uitzondering van machines en toestellen voor het spinnen van synthetische of kunstmatige
      textielstoffen en met uitzondering van spindoppen) en de voor of bij deze machines en toestellen gebezigde meet-,
      controle-, regel- en andere hulpapparatuur, alsmede de gebouwen waarin die goederen worden gebezigd.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel45
  - number: '45.3'
    text: |-
      In gevallen waarin het eerste lid ten aanzien van een bedrijfsmiddel toepassing heeft gevonden en de ondernemer
      dat bedrijfsmiddel vervolgens levert, wordt onder door Onze Minister te stellen voorwaarden aan die ondernemer
      teruggaaf verleend van 70, onderscheidenlijk 40 of 33 percent van de ter zake van die levering verschuldigde
      belasting naar gelang deze plaatsvindt in de jaren 1969 of 1970, dan wel 1971 of 1972.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel45
  - number: '45.4'
    text: |-
      Onze Minister kan de in het eerste lid genoemde percentages, met ingang van een door hem te bepalen tijdstip, in
      het algemeen of voor bepaalde groepen van bedrijfsmiddelen verhogen en de in het derde lid genoemde percentages
      daarbij aanpassen.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel45
  - number: '45.5'
    text: |-
      Na het tot stand komen van een ministeriële regeling, door Onze Minister krachtens het vierde lid genomen, wordt
      zo spoedig mogelijk, doch uiterlijk binnen twee maanden, een voorstel van wet tot goedkeuring van die ministeriële
      regeling aan de Tweede Kamer der Staten-Generaal gezonden. Indien het voorstel wordt ingetrokken of indien een
      van de Kamers der Staten-Generaal tot het niet-aannemen van het voorstel besluit, wordt de ministeriële regeling
      onverwijld ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel45
  - number: '45.6'
    text: |-
      Onze Minister kan met ingang van een door hem te bepalen tijdstip het eerste lid buiten toepassing verklaren ten
      aanzien van machines en toestellen voor het vervaardigen van schoeisel en voor of bij deze machines en toestellen
      gebezigde meet-, controle-, regel- en andere hulpapparatuur, alsmede gebouwen waarin die goederen worden gebezigd.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel45
  - number: '46'
    text: |-
      Gedurende de jaren 1969 tot en met 1979 bedraagt de belasting ter zake van leveringen en invoer van dagbladen en
      nieuwsbladen (niet dagelijks verschijnende kranten), krachtens abonnement, in afwijking van de [artikelen 9][ref1]
      en [20][ref2], nihil.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel20
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '9'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '20'
        hoofdstuk: III
        afdeling: '2'
  - number: '52'
    text: |-
      Hij die ingevolge een vóór de inwerkingtreding van een wijziging in de wetgeving inzake omzetbelasting gesloten
      overeenkomst verplicht is goederen te leveren of een dienst te verlenen, is bevoegd hetgeen met betrekking tot die
      goederen of die dienst wegens omzetbelasting meer is gevorderd dan vóór de inwerkingtreding van die wijziging had
      kunnen geschieden, terug te vorderen van degene aan wie hij de goederen moet leveren of de dienst moet verlenen.
      Hiermede strijdige bedingen zijn nietig.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel52
  - number: '53'
    text: |-
      Hij aan wie ingevolge een vóór de inwerkingtreding van een wijziging in de wetgeving inzake omzetbelasting gesloten
      overeenkomst goederen worden geleverd of een dienst wordt verleend, is bevoegd van hem die verplicht is de goederen
      te leveren of de dienst te verlenen, terug te vorderen hetgeen met betrekking tot die goederen of dienst wegens
      omzetbelasting minder is gevorderd dan vóór de inwerkingtreding van die wijziging had kunnen geschieden. Hiermede
      strijdige bedingen zijn nietig.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel53
  - number: '54.1'
    text: |-
      De Wet op de Omzetbelasting 1954 en de wet van 29 december 1966 (*Stb*. 592) vervallen, behalve ten aanzien van
      reeds verrichte leveringen en diensten en begane strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel54
  - number: '54.2'
    text: Onze Minister is bevoegd nadere bepalingen ter zake van de overgang vast te stellen.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel54
  - number: '55.1'
    text: Deze wet treedt in werking met ingang van 1 januari 1969.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel55
  - number: '55.2'
    text: Zij kan worden aangehaald als 'Wet op de omzetbelasting 1968'.
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel55
