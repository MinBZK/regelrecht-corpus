        hoofdstuk: V
        afdeling: '5'
  - number: 28e.b
    text: |-
      ingeval [artikel 28c][ref1] toepassing vindt, van de belasting welke aan de wederverkoper in rekening is gebracht
      ter zake van de aan hem verrichte levering als bedoeld in het eerste lid, onderdeel *a*, van dat artikel, of van
      de belasting welke de wederverkoper verschuldigd is geworden ter zake van de invoer als bedoeld in het eerste lid,
      onderdeel *b*, van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28c
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28e
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28c
        hoofdstuk: V
        afdeling: '5'
  - number: 28f.1
    text: |-
      In afwijking van de [artikelen 28b][ref1] en [28c][ref2] is de wederverkoper ter zake van elk van zijn leveringen
      die voor toepassing van die artikelen in aanmerking komen, gerechtigd de belasting te berekenen overeenkomstig
      [artikel 8, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28b
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel28c
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel8
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28f
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28b
        hoofdstuk: V
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 28c
        hoofdstuk: V
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0002629
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
  - number: 28f.2
    text: |-
      Ingeval het eerste lid toepassing vindt, vindt aftrek plaats van de belasting die ingevolge
      [artikel 28e, onderdeel b][ref1], niet in aftrek is gebracht. Het recht op aftrek ontstaat op het tijdstip waarop
      de belasting verschuldigd wordt ter zake van de levering door de wederverkoper.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28e
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28f
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28e
        hoofdstuk: V
        afdeling: '5'
  - number: 28g
    text: |-
      [Artikel 12, derde lid][ref1], is niet van toepassing ten aanzien van een wederverkoper die niet in Nederland woont
      of is gevestigd en aldaar geen vaste inrichting heeft, die goederen levert met toepassing van [artikel 28b][ref2],
      [28c][ref3] of [28d][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel28b
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel28c
      [ref4]: https://wetten.overheid.nl/BWBR0002629#Artikel28d
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28g
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '12'
        hoofdstuk: II
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 28b
        hoofdstuk: V
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0002629
        artikel: 28c
        hoofdstuk: V
        afdeling: '5'
      - id: ref4
        bwb_id: BWBR0002629
        artikel: 28d
        hoofdstuk: V
        afdeling: '5'
  - number: 28h.1
    text: |-
      Ingeval de wederverkoper goederen levert met toepassing van [artikel 28b][ref1], [28c][ref2] of [28d][ref3],
      wordt voor de toepassing van [artikel 35a, eerste lid, onderdeel h][ref4] , de omzetbelasting begrepen onder de
      vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28b
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel28c
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel28d
      [ref4]: https://wetten.overheid.nl/BWBR0002629#Artikel35a
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28h
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28b
        hoofdstuk: V
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 28c
        hoofdstuk: V
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0002629
        artikel: 28d
        hoofdstuk: V
        afdeling: '5'
      - id: ref4
        bwb_id: BWBR0002629
        artikel: 35a
        hoofdstuk: VI
  - number: 28h.2
    text: |-
      Het is de wederverkoper die goederen levert met toepassing van [artikel 28b][ref1], [28c][ref2] of [28d][ref3] niet
      toegestaan om de belasting afzonderlijk te vermelden op de ter zake van die levering uit te reiken factuur.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28b
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel28c
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel28d
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28h
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28b
        hoofdstuk: V
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 28c
        hoofdstuk: V
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0002629
        artikel: 28d
        hoofdstuk: V
        afdeling: '5'
  - number: 28h.3
    text: |-
      [Artikel 35a, eerste lid, onderdeel j][ref1] , is niet van toepassing ter zake van leveringen door wederverkopers
      met toepassing van [de artikelen 28b][ref2], [28c][ref3] of [28d][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel35a
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel28b
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel28c
      [ref4]: https://wetten.overheid.nl/BWBR0002629#Artikel28d
    url: https://wetten.overheid.nl/BWBR0002629/2004-01-01#Artikel28h
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 35a
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 28b
        hoofdstuk: V
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0002629
        artikel: 28c
        hoofdstuk: V
