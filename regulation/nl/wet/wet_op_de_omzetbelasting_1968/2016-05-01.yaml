  - number: 28i
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld inzake de toepassing van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28i
  - number: 28j.1
    text: 'In deze wet en in de daarop berustende bepalingen wordt onder beleggingsgoud verstaan:'
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28j
  - number: 28j.1.a
    text: |-
      goud, in de vorm van staven of plaatjes met een door de goudmarkten aanvaard gewicht, met een zuiverheid van ten
      minste 995/1000, al dan niet belichaamd in effecten, doch met uitzondering van bij ministeriële regeling aan te
      wijzen kleine staven of plaatjes met een gewicht van ten hoogste 1 gram;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28j
  - number: 28j.1.b
    text: 'gouden munten die:'
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28j
  - number: 28j.1.b.1°
    text: een zuiverheid van ten minste 900/1000 hebben;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28j
  - number: 28j.1.b.2°
    text: na 1800 zijn geslagen;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28j
  - number: 28j.1.b.3°
    text: in het land van oorsprong als wettig betaalmiddel fungeren of hebben gefungeerd;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28j
  - number: 28j.1.b.4°
    text: |-
      normaliter verkocht worden voor een prijs die de openmarktwaarde van het in de munten vervatte goud niet met meer
      dan 80% overschrijdt;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28j
  - number: 28j.1.c
    text: |-
      gouden munten die zijn opgenomen in de lijst die de Europese Commissie elk jaar publiceert in de C-serie van
      het Publicatieblad van de Europese Unie en die daarmee worden geacht aan de in onderdeel b opgenomen criteria te
      voldoen gedurende het hele jaar waarvoor de lijst wordt gepubliceerd.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28j
  - number: 28j.2
    text: |-
      De in het eerste lid, onderdelen b en c, bedoelde gouden munten worden, voor de toepassing van deze wet en de
      daarop berustende bepalingen, geacht niet wegens hun numismatische belang te worden verkocht.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28j
  - number: 28k
    text: 'Van de belasting zijn vrijgesteld:'
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28k
  - number: 28k.a
    text: |-
      de levering, de intracommunautaire verwerving en de invoer van beleggingsgoud, waaronder begrepen
      beleggingsgoud dat belichaamd is in certificaten voor toegewezen of niet-toegewezen goud of dat verhandeld
      wordt op goudrekeningen, en waaronder begrepen, in het bijzonder, goudleningen en swaps, die een eigendoms- of
      vorderingsrecht op beleggingsgoud belichamen, evenals de handelingen betreffende beleggingsgoud bestaande in
      future- en termijncontracten die leiden tot de overdracht van een eigendoms- of vorderingsrecht met betrekking
      tot beleggingsgoud;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28k
  - number: 28k.b
    text: |-
      de diensten door tussenpersonen die handelen in naam en voor rekening van een ander wanneer zij betrokken zijn bij
      de levering van beleggingsgoud voor hun principaal.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28k
  - number: 28l.1
    text: |-
      De ondernemer die beleggingsgoud produceert of goud omzet in beleggingsgoud kan ervoor kiezen
      [artikel 28k, onderdeel a][ref1], op hem niet van toepassing te doen zijn met betrekking tot leveringen van
      beleggingsgoud aan een andere ondernemer.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28k
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28l
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28k
        hoofdstuk: V
        afdeling: '6'
  - number: 28l.2
    text: |-
      De ondernemer die in het kader van zijn onderneming normaliter goud levert voor industriële doeleinden, kan ervoor
      kiezen [artikel 28k, onderdeel a][ref1], op hem niet van toepassing te doen zijn met betrekking tot leveringen van
      beleggingsgoud als bedoeld in [artikel 28j, eerste lid, onderdeel a][ref2], aan een andere ondernemer.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28k
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel28j
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28l
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28k
        hoofdstuk: V
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 28j
        hoofdstuk: V
        afdeling: '6'
  - number: 28l.3
    text: |-
      Indien de leverancier het recht om overeenkomstig het eerste of het tweede lid voor belastingheffing te kiezen
      heeft uitgeoefend, kan de tussenpersoon ervoor kiezen [artikel 28k, onderdeel b][ref1], op hem niet van toepassing
      te doen zijn met betrekking tot de in dat onderdeel vermelde diensten.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28k
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28l
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28k
        hoofdstuk: V
        afdeling: '6'
  - number: 28m.1
    text: |-
      In afwijking in zoverre van [artikel 15][ref1] heeft de ondernemer een recht op aftrek van de belasting die in
      rekening is gebracht of verschuldigd is geworden met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28m
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '15'
        hoofdstuk: II
        afdeling: '4'
  - number: 28m.1.a
    text: |-
      beleggingsgoud dat hem is geleverd door een ondernemer die een in [artikel 28l][ref1] bedoeld keuzerecht heeft
      uitgeoefend;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28l
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28m
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28l
        hoofdstuk: V
        afdeling: '6'
  - number: 28m.1.b
    text: |-
      de levering aan hem of de intracommunautaire verwerving of de invoer door hem van ander goud dan beleggingsgoud dat
      vervolgens door hem of namens hem wordt omgezet in beleggingsgoud;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28m
  - number: 28m.1.c
    text: |-
      aan hem verleende diensten bestaande in een wijziging van de vorm, het gewicht of de zuiverheid van goud met
      inbegrip van beleggingsgoud;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28m
  - number: 28m.2
    text: |-
      In afwijking in zoverre van [artikel 15][ref1] heeft de ondernemer die beleggingsgoud produceert of goud in
      beleggingsgoud omzet een recht op aftrek van de belasting die hem in rekening is gebracht of door hem verschuldigd
      is geworden met betrekking tot de levering dan wel de intracommunautaire verwerving of de invoer van goederen of
      diensten die met de productie of de omzetting van dat goud verband houden alsof de latere levering door hem van het
      ingevolge deze afdeling vrijgestelde goud aan de heffing van belasting was onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28m
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '15'
        hoofdstuk: II
        afdeling: '4'
  - number: 28n
    text: |-
      De ondernemer die handelt in beleggingsgoud dient, met overeenkomstige toepassing van [artikel 34][ref1],
      aantekening te houden van alle handelingen betreffende beleggingsgoud waarvoor de vergoeding meer dan € 10 000
      bedraagt en de documenten te bewaren aan de hand waarvan de identiteit van de cliënt bij dergelijke handelingen kan
      worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel34
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28n
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '34'
        hoofdstuk: VI
        afdeling: '4'
  - number: 28o
    text: |-
      In geval een ondernemer een levering of een dienst verricht die een verwerking omvat van aan een ander toebehorend
      beleggingsgoud, waardoor het goud niet langer als beleggingsgoud is aan te merken, wordt, in afwijking in zoverre
      van [artikel 8][ref1], de belasting berekend over het door de ondernemer voor die levering of dienst in rekening
      gebrachte bedrag – de omzetbelasting niet daaronder begrepen – vermeerderd met de normale waarde van het goud dat
      in het tot stand gekomen goed voorkomt.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel8
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28o
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
  - number: 28p
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld inzake de toepassing van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28p
  - number: 28q
    text: 'In deze afdeling en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28q
  - number: 28q.a
    text: |-
      niet in de Unie gevestigde ondernemers: ondernemers die niet in de Unie wonen of zijn gevestigd noch aldaar een
      vaste inrichting hebben, en ook niet anderszins voor omzetbelastingdoeleinden in de Unie zijn geïdentificeerd;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28q
  - number: 28q.b
    text: |-
      lidstaat van identificatie: de lidstaat waar de niet in de Unie gevestigde ondernemer zich identificeert teneinde
      een nummer van registratie te verkrijgen vanwege het begin van zijn activiteit als ondernemer op het grondgebied
      van de Unie overeenkomstig deze afdeling;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28q
  - number: 28q.c
    text: |-
      lidstaat van verbruik: de lidstaat waar overeenkomstig [artikel 6h][ref1] telecommunicatiediensten, omroepdiensten
      of elektronische diensten worden verricht;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel6h
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28q
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 6h
        hoofdstuk: II
        paragraaf: '2'
        afdeling: 1b
  - number: 28q.d
    text: |-
      melding telecommunicatiediensten, omroepdiensten of elektronische diensten: het elektronische bericht waarin alle
      gegevens staan die nodig zijn om het bedrag te bepalen van de in elke lidstaat van verbruik verschuldigde belasting
      ter zake van telecommunicatiediensten, omroepdiensten of elektronische diensten die zijn verricht aan andere dan
      ondernemers die in de Unie wonen of zijn gevestigd alsmede het bedrag van die belasting.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28q
  - number: 28r.1
    text: |-
      Een niet in de Unie gevestigde ondernemer die telecommunicatiediensten, omroepdiensten of elektronische diensten
      verricht aan anderen dan ondernemers die in de Unie wonen of zijn gevestigd, kan ten aanzien van de heffing van
      belasting kiezen voor Nederland als lidstaat van identificatie.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28r
  - number: 28r.2
    text: |-
      Ingeval de niet in de Unie gevestigde ondernemer kiest voor Nederland als lidstaat van identificatie, dient
      hij onverwijld opgave te doen van het begin of de beëindiging van het verrichten van telecommunicatiediensten,
      omroepdiensten of elektronische diensten, alsook van wijziging van deze activiteit in die zin dat de in deze
      afdeling opgenomen regeling niet langer van toepassing is.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28r
  - number: 28r.3
    text: |-
      De in het tweede lid bedoelde opgave vindt langs elektronische weg bij de inspecteur plaats en bevat de volgende
      gegevens:
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28r
  - number: 28r.3.a
    text: naam, postadres en elektronische adressen, met inbegrip van websites, van de ondernemer;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28r
  - number: 28r.3.b
    text: het eventuele belastingnummer dat aan de ondernemer is verstrekt door zijn nationale belastingautoriteit;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28r
  - number: 28r.3.c
    text: |-
      een verklaring dat de ondernemer niet reeds in de Unie is geïdentificeerd voor belastingheffing op grond van de
      BTW-richtlijn 2006.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28r
  - number: 28r.4
    text: |-
      Indien degene die heeft gekozen voor Nederland als lidstaat van identificatie niet of niet langer voldoet aan de
      voorwaarden voor identificatie, wordt de identificatie door de inspecteur geweigerd respectievelijk beëindigd. De
      weigering of beëindiging geschiedt bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28r
  - number: 28s.1
    text: |-
      In afwijking van [artikel 14][ref1] is de niet in de Unie gevestigde ondernemer die met toepassing van
      [artikel 28r][ref2] voor Nederland heeft gekozen als lidstaat van identificatie, gehouden met betrekking tot de in
      een tijdvak verschuldigd geworden belasting een melding telecommunicatiediensten, omroepdiensten of elektronische
      diensten bij de inspecteur in te dienen, onder vermelding van het hem toegekende nummer van registratie.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel28r
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28s
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '14'
        hoofdstuk: II
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 28r
        hoofdstuk: V
        afdeling: '7'
  - number: 28s.2
    text: |-
      Het in het eerste lid bedoelde tijdvak is een kalenderkwartaal. De melding telecommunicatiediensten, omroepdiensten
      of elektronische diensten dient ook te worden ingediend indien in een tijdvak geen telecommunicatiediensten,
      omroepdiensten of elektronische diensten zijn verricht.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28s
  - number: 28s.3
    text: |-
      De in het eerste lid bedoelde melding telecommunicatiediensten, omroepdiensten of elektronische diensten vindt
      plaats langs elektronische weg en bevat ten aanzien van elke lidstaat van verbruik waar belasting is verschuldigd,
      het totale bedrag dat ter zake van de telecommunicatiediensten, omroepdiensten of elektronische diensten in
      rekening is gebracht, de omzetbelasting niet daaronder begrepen, alsmede het totale bedrag van de daarover
      verschuldigde belasting. Voorts worden de in de desbetreffende lidstaten geldende belastingtarieven en het totale
      verschuldigde bedrag aan belasting vermeld.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28s
  - number: 28s.4
    text: |-
      De in het eerste lid bedoelde melding telecommunicatiediensten, omroepdiensten of elektronische diensten wordt
      gedaan uiterlijk 20 dagen na het einde van het tijdvak waarop die melding betrekking heeft. De ingevolge de melding
      verschuldigde belasting wordt uiterlijk 20 dagen na het einde van het tijdvak waarop de melding betrekking heeft in
      euro betaald aan de ontvanger.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28s
  - number: 28s.5
    text: |-
      Indien de belasting die verschuldigd is over in Nederland verrichte telecommunicatiediensten, omroepdiensten of
      elektronische diensten, ongeacht de keuze van lidstaat van identificatie, geheel of gedeeltelijk niet is betaald,
      kan de inspecteur met overeenkomstige toepassing van [artikel 20 van de Algemene wet inzake rijksbelastingen][ref1]
      de te weinig geheven belasting naheffen. De [artikelen 30h][ref2], [30ha][ref3], [67c][ref4] en
      [67f van de Algemene wet inzake rijksbelastingen][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel30h
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel30ha
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel67c
      [ref5]: https://wetten.overheid.nl/BWBR0002320#Artikel67f
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28s
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 30h
      - id: ref3
        bwb_id: BWBR0002320
        artikel: 30ha
      - id: ref4
        bwb_id: BWBR0002320
        artikel: 67c
      - id: ref5
        bwb_id: BWBR0002320
        artikel: 67f
  - number: 28s.6
    text: |-
      In afwijking van [artikel 2][ref1] vindt geen aftrek van belasting plaats, maar wordt teruggaaf van belasting
      verleend overeenkomstig de Dertiende Richtlijn 86/560/EEG van de Raad van 17 november 1986 betreffende de
      harmonisatie van de wetgevingen der Lid-Staten inzake omzetbelasting – Regeling voor de teruggaaf van de belasting
      over de toegevoegde waarde aan niet op het grondgebied van de Gemeenschap gevestigde belastingplichtigen (PbEG
      1986, L 326). Artikel 2, tweede en derde lid, en artikel 4, tweede lid, van deze Richtlijn zijn niet van toepassing
      op een verzoek om teruggaaf van belasting dat verband houdt met telecommunicatiediensten, omroepdiensten of
      elektronische diensten waarop de in deze afdeling opgenomen regeling van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel2
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28s
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '2'
        hoofdstuk: I
  - number: 28s.7
    text: |-
      De bedragen in de melding telecommunicatiediensten, omroepdiensten of elektronische diensten worden uitgedrukt
      in eurobedragen. Indien de vergoeding voor telecommunicatiediensten, omroepdiensten of elektronische diensten is
      uitgedrukt in een andere munteenheid dan de euro wordt, in afwijking van [artikel 8, zesde lid][ref1], voor de
      bepaling van de in het derde lid genoemde bedragen de wisselkoers gehanteerd die gold op de laatste dag van de
      periode waarop de melding betrekking heeft. De omrekening vindt plaats volgens de wisselkoersen die de Europese
      Centrale Bank voor de desbetreffende dag bekend heeft gemaakt of, als er op de desbetreffende dag geen bekendmaking
      heeft plaatsgevonden, volgens de wisselkoersen op de eerstvolgende dag van bekendmaking.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel8
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28s
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
  - number: 28s.8
    text: |-
      [Hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref1] is van overeenkomstige toepassing als ware de
      betaalde belasting op aangifte voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28s
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: V
  - number: 28t.1
    text: |-
      In afwijking van [artikel 52 van de Algemene wet inzake rijksbelastingen][ref1] is een niet in de Unie gevestigde
      ondernemer die telecommunicatiediensten, omroepdiensten of elektronische diensten verricht aan anderen dan
      ondernemers die in de Unie wonen of zijn gevestigd, gehouden aantekening te houden van alle handelingen die
      betrekking hebben op elektronische diensten en waarvan de raadpleging van belang kan zijn voor de vaststelling van
      feiten welke van invloed kunnen zijn op de heffing van belasting in Nederland en in andere lidstaten van verbruik.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel52
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28t
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '52'
  - number: 28t.2
    text: |-
      De in het eerste lid bedoelde ondernemer is verplicht boeken, bescheiden en andere gegevensdragers of de inhoud
      daarvan – zulks ter keuze van de inspecteur – betreffende telecommunicatiediensten, omroepdiensten of elektronische
      diensten te bewaren gedurende tien jaren na afloop van het jaar waarin de dienst is verricht.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28t
  - number: 28t.3
    text: |-
      Desgevraagd dienen de boeken, bescheiden en andere gegevensdragers of de inhoud daarvan langs elektronische weg
      ter beschikking te worden gesteld aan de inspecteur, aan de ontvanger, of aan de belastingautoriteit van een andere
      lidstaat van verbruik.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28t
  - number: 28u.1
    text: 'In deze afdeling en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28u
  - number: 28u.1.a
    text: |-
      lidstaat van verbruik: de lidstaat waar overeenkomstig artikel 6h telecommunicatiediensten, omroepdiensten of
      elektronische diensten worden verricht;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28u
  - number: 28u.1.b
    text: |-
      niet in de lidstaat van verbruik gevestigde ondernemers: ondernemers die de zetel van hun bedrijfsuitoefening of
      een vaste inrichting op het grondgebied van de Unie hebben gevestigd, maar in de lidstaat van verbruik noch de
      zetel van hun bedrijfsuitoefening, noch een vaste inrichting hebben;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28u
  - number: 28u.1.c
    text: |-
      lidstaat van identificatie: de lidstaat waar de ondernemer de zetel van zijn bedrijfsuitoefening heeft gevestigd,
      of, indien hij de zetel van zijn bedrijfsuitoefening niet in de Unie heeft gevestigd, de lidstaat waar hij een
      vaste inrichting heeft;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28u
  - number: 28u.1.d
    text: |-
      btw-melding telecommunicatiediensten, omroepdiensten of elektronische diensten: het elektronische bericht waarin
      alle gegevens staan die nodig zijn om het bedrag te bepalen van de in elke lidstaat van verbruik verschuldigde
      belasting ter zake van telecommunicatiediensten, omroepdiensten of elektronische diensten die door niet in de
      lidstaat van verbruik gevestigde ondernemers zijn verricht aan andere dan ondernemers die in de Unie wonen of zijn
      gevestigd.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28u
  - number: 28u.2
    text: |-
      Indien de ondernemer niet in de Unie is gevestigd, maar daarin meer dan één vaste inrichting heeft, dan is de
      lidstaat van identificatie de lidstaat waar zich een vaste inrichting bevindt, waarin die ondernemer meldt dat hij
      van deze regeling gebruik maakt. De ondernemer is gedurende het betreffende kalenderjaar en de twee daaropvolgende
      kalenderjaren aan deze keuze gebonden.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28u
  - number: 28v.1
    text: |-
      Een niet in de lidstaat van verbruik maar in Nederland gevestigde ondernemer die telecommunicatiediensten,
      omroepdiensten of elektronische diensten verricht aan andere dan ondernemers die in een lidstaat gevestigd zijn of
      er hun woonplaats of gebruikelijke verblijfplaats hebben, kan gebruik maken van deze regeling. Deze regeling is van
      toepassing op alle aldus in de Unie verrichte diensten.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28v
  - number: 28v.2
    text: |-
      Ingeval de niet in de lidstaat van verbruik maar in Nederland gevestigde ondernemer kiest voor deze regeling, dient
      hij onverwijld opgave te doen van het begin of de beëindiging van het verrichten van telecommunicatiediensten,
      omroepdiensten of elektronische diensten, alsook van wijziging ervan in die mate dat hij niet langer aan de
      voorwaarden voldoet om van deze regeling gebruik te mogen maken.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28v
  - number: 28v.3
    text: De in het tweede lid bedoelde opgave vindt langs elektronische weg bij de inspecteur plaats.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28v
  - number: 28v.4
    text: |-
      De niet in de lidstaat van verbruik maar in Nederland gevestigde ondernemer wordt van deze regeling uitgesloten in
      elk van de volgende gevallen:
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28v
  - number: 28v.4.a
    text: hij meldt dat hij niet langer telecommunicatiediensten, omroepdiensten of elektronische diensten verricht;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28v
  - number: 28v.4.b
    text: anderszins kan worden aangenomen dat zijn aan deze regeling onderworpen belastbare activiteiten beëindigd zijn;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28v
  - number: 28v.4.c
    text: hij vervult niet langer de voorwaarden om van de regeling gebruik te mogen maken;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28v
  - number: 28v.4.d
    text: hij voldoet bij voortduring niet aan de voorschriften van de bijzondere regeling.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28v
  - number: 28v.5
    text: De in het vierde lid bedoelde uitsluiting van deze regeling geschiedt bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28v
  - number: 28w.1
    text: |-
      In afwijking van [artikel 14][ref1] is de niet in de lidstaat van verbruik maar in Nederland gevestigde
      ondernemer, die met toepassing van [artikel 28v][ref2] heeft gekozen voor deze regeling, gehouden een btw-melding
      telecommunicatiediensten, omroepdiensten of elektronische diensten bij de inspecteur in te dienen, onder vermelding
      van het hem toegekende btw-identificatienummer.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel28v
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28w
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '14'
        hoofdstuk: II
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 28v
        hoofdstuk: V
        afdeling: '8'
  - number: 28w.2
    text: |-
      Het in het eerste lid bedoelde tijdvak is een kalenderkwartaal. De btw-melding telecommunicatiediensten,
      omroepdiensten of elektronische diensten dient ook te worden ingediend indien in een tijdvak geen
      telecommunicatiediensten, omroepdiensten of elektronische diensten zijn verricht.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28w
  - number: 28w.3
    text: |-
      De in het eerste lid bedoelde btw-melding telecommunicatiediensten, omroepdiensten of elektronische diensten vindt
      plaats langs elektronische weg en bevat ten aanzien van elke lidstaat van verbruik waar belasting is verschuldigd,
      het totale bedrag dat ter zake van telecommunicatiediensten, omroepdiensten of elektronische diensten in rekening
      is gebracht, de omzetbelasting niet daaronder begrepen, alsmede het totale bedrag van de daarover verschuldigde
      belasting. Voorts worden de in de desbetreffende lidstaten geldende belastingtarieven en het totale verschuldigde
      bedrag aan belasting vermeld.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28w
  - number: 28w.4
    text: |-
      Indien de niet in de lidstaat van verbruik maar in Nederland gevestigde ondernemer behalve in Nederland in een
      andere lidstaat een of meer vaste inrichtingen heeft van waaruit de diensten worden verricht, bevat de btw-melding
      telecommunicatiediensten, omroepdiensten of elektronische diensten, per lidstaat waar hij een vaste inrichting
      heeft gevestigd en uitgesplitst naar lidstaat van verbruik, naast de in het derde lid bedoelde gegevens, tevens
      het totale bedrag van de gedurende het belastingtijdvak verrichte telecommunicatiediensten, omroepdiensten of
      elektronische diensten die onder deze regeling vallen, alsmede het hem toegekende btw-identificatienummer of het
      fiscaal registratienummer van de vaste inrichting.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28w
  - number: 28w.5
    text: |-
      De in het eerste lid bedoelde btw-melding telecommunicatiediensten, omroepdiensten of elektronische diensten wordt
      gedaan uiterlijk 20 dagen na het einde van het tijdvak waarop die melding betrekking heeft. De ingevolge de btw-
      melding verschuldigde belasting wordt uiterlijk 20 dagen na het einde van het tijdvak waarop de melding betrekking
      heeft in euro betaald aan de ontvanger.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28w
  - number: 28w.6
    text: |-
      Indien de belasting die verschuldigd is over in Nederland verrichte telecommunicatiediensten, omroepdiensten of
      elektronische diensten, ongeacht de keuze van lidstaat van identificatie, geheel of gedeeltelijk niet is betaald,
      kan de inspecteur met overeenkomstige toepassing van [artikel 20 van de Algemene wet inzake rijksbelastingen][ref1]
      de te weinig geheven belasting naheffen. De [artikelen 30h][ref2], [30ha][ref3], [67c][ref4] en
      [67f van de Algemene wet inzake rijksbelastingen][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel30h
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel30ha
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel67c
      [ref5]: https://wetten.overheid.nl/BWBR0002320#Artikel67f
