  - number: 28w.7
    text: |-
      De niet in de lidstaat van verbruik maar in Nederland gevestigde ondernemer die van deze regeling gebruik maakt,
      past met betrekking tot de voorbelasting die verband houdt met aan deze regeling onderworpen activiteiten geen
      aftrek van belasting uit hoofde van [artikel 2][ref1] toe. Niettegenstaande artikel 2, lid 1, en artikel 3 van
      Richtlijn 2008/9/EG van de Raad van 12 februari 2008 tot vaststelling van nadere voorschriften voor de in Richtlijn
      2006/112/EG vastgestelde teruggaaf van de belasting over de toegevoegde waarde aan belastingplichtigen die niet
      in de lidstaat van teruggaaf maar in een andere lidstaat gevestigd zijn (PbEU 2008, L 44) kan deze ondernemer
      daarvoor teruggaaf worden verleend overeenkomstig die richtlijn. Indien de niet in de lidstaat van verbruik
      gevestigde ondernemer die van deze bijzondere regeling gebruik maakt, in de lidstaat van verbruik ook niet aan deze
      regeling onderworpen activiteiten verricht waarvoor hij voor btw-doeleinden geïdentificeerd moet zijn, kan hij de
      voorbelasting die verband houdt met de aan deze bijzondere regeling onderworpen activiteiten bij de indiening van
      de in [artikel 14][ref2] bedoelde aangifte in aftrek brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel14
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28w
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '14'
        hoofdstuk: II
        afdeling: '4'
  - number: 28w.8
    text: |-
      De bedragen in de btw-melding telecommunicatiediensten, omroepdiensten of elektronische diensten worden uitgedrukt
      in eurobedragen. Indien de vergoeding voor telecommunicatiediensten, omroepdiensten of elektronische diensten is
      uitgedrukt in een andere munteenheid dan de euro wordt, in afwijking van [artikel 8, zesde lid][ref1], voor de
      bepaling van de in het derde lid en vierde lid genoemde bedragen de wisselkoers gehanteerd die gold op de laatste
      dag van de periode waarop de btw-melding telecommunicatiediensten, omroepdiensten of elektronische diensten
      betrekking heeft. De omrekening vindt plaats volgens de wisselkoersen die de Europese Centrale Bank voor de
      desbetreffende dag bekend heeft gemaakt of, als er op de desbetreffende dag geen bekendmaking heeft plaatsgevonden,
      volgens de wisselkoersen op de eerstvolgende dag van bekendmaking.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel8
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28w
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
  - number: 28w.9
    text: |-
      [Hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref1] is van overeenkomstige toepassing als ware de
      betaalde belasting op aangifte voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28w
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: V
  - number: 28x.1
    text: |-
      Een niet in de lidstaat van verbruik gevestigde ondernemer die telecommunicatiediensten, omroepdiensten of
      elektronische diensten verricht aan anderen dan ondernemers die in de Unie wonen of zijn gevestigd, is gehouden
      aantekening te houden van alle handelingen die betrekking hebben op telecommunicatiediensten, omroepdiensten
      of elektronische diensten en waarvan de raadpleging van belang kan zijn voor de vaststelling van feiten die van
      invloed kunnen zijn op de heffing van belasting in Nederland en in andere lidstaten van verbruik.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28x
  - number: 28x.2
    text: |-
      De in het eerste lid bedoelde ondernemer is verplicht boeken, bescheiden en andere gegevensdragers of de inhoud
      daarvan – zulks ter keuze van de inspecteur – betreffende telecommunicatiediensten, omroepdiensten of elektronische
      diensten te bewaren gedurende tien jaren na afloop van het jaar waarin de dienst is verricht.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28x
  - number: 28x.3
    text: |-
      Desgevraagd dienen de boeken, bescheiden en andere gegevensdragers of de inhoud daarvan langs elektronische weg
      ter beschikking te worden gesteld aan de inspecteur, aan de ontvanger, of aan de belastingautoriteit van een andere
      lidstaat van verbruik.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28x
  - number: 28y
    text: |-
      De belasting, verschuldigd ter zake van de invoer en de levering aan veilingen van vis, schaal-, schelp- en
      weekdieren die worden aangebracht per schip dat terugkeert van de visvangst, of per ventjager, bedraagt nihil.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28y
  - number: 28z.1
    text: |-
      Deze afdeling en de daarop berustende bepalingen zijn van toepassing op de handelingen van reisbureaus, voor
      zover de reisbureaus op eigen naam tegenover de reiziger handelen en zij voor de totstandbrenging van de reizen
      gebruikmaken van de leveringen van goederen en diensten van andere ondernemers.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28z
  - number: 28z.2
    text: |-
      Voor de toepassing van deze afdeling en de daarop berustende bepalingen worden reisorganisatoren (touroperators)
      als reisbureaus beschouwd.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28z
  - number: 28za
    text: |-
      De onder de voorwaarden van [artikel 28z][ref1] verrichte handelingen van het reisbureau met het oog op de
      totstandkoming van de reis, worden beschouwd als één enkele dienst die het reisbureau voor de reiziger verricht
      (reisdienst). De plaats van deze dienst is de plaats waar het reisbureau de zetel van zijn bedrijfsuitoefening of
      een vaste inrichting heeft gevestigd van waaruit het de dienst heeft verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28z
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28za
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28z
        hoofdstuk: V
        afdeling: '10'
  - number: 28zb.1
    text: 'Ter zake van reisdiensten wordt de belasting naar keuze van het reisbureau berekend over:'
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28zb
  - number: 28zb.1.a
    text: de winstmarge per tijdvak van aangifte, de omzetbelasting niet daaronder begrepen, of
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28zb
  - number: 28zb.1.b
    text: de winstmarge per reis, de omzetbelasting niet daaronder begrepen.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28zb
  - number: 28zb.2
    text: |-
      De winstmarge per tijdvak van aangifte is het verschil tussen de som van de vergoedingen, de omzetbelasting
      daaronder begrepen, in dat tijdvak ter zake van reisdiensten en de som van de in dat tijdvak werkelijk door het
      reisbureau gedragen kosten voor goederen en diensten van andere ondernemers, mits deze goederen en diensten de
      reiziger rechtstreeks ten goede komen.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28zb
  - number: 28zb.3
    text: |-
      De winstmarge per reis is het verschil tussen de vergoeding, de omzetbelasting daaronder begrepen, ter zake van de
      reisdienst en de werkelijk door het reisbureau gedragen kosten voor goederen en diensten van andere ondernemers,
      mits deze goederen en diensten de reiziger rechtstreeks ten goede komen.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28zb
  - number: 28zb.4
    text: |-
      Bij ministeriële regeling kunnen nadere regels ten aanzien van de in het eerste lid bedoelde keuze en
      overgangsregels ten aanzien van het wijzigen van deze keuze worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28zb
  - number: 28zc
    text: |-
      Indien de handelingen waarvoor het reisbureau een beroep doet op andere ondernemers, door laatstgenoemden buiten
      de Unie worden verricht, wordt de dienst van het reisbureau gelijkgesteld met de in de bij deze wet behorende
      [tabel II, onderdeel b, post 4][ref1], genoemde handeling van een tussenpersoon. Indien de in de eerste volzin
      bedoelde handelingen zowel binnen als buiten de Unie worden verricht, mag alleen het gedeelte van de dienst van het
      reisbureau betreffende de buiten de Unie verrichte handelingen als zodanig gelijkgesteld worden beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28zc
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: 28zd.1
    text: |-
      Ingeval in een tijdvak van aangifte in een kalenderjaar, het laatste tijdvak van aangifte in een
      kalenderjaar uitgezonderd, de winstmarge per tijdvak van aangifte, de omzetbelasting niet daaronder
      begrepen, (tijdvakwinstmarge) negatief is, wordt deze negatieve tijdvakwinstmarge verrekend met een positieve
      tijdvakwinstmarge, of opgeteld bij een negatieve tijdvakwinstmarge, die in het volgende belastingtijdvak wordt
      gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28zd
  - number: 28zd.2
    text: |-
      Na afloop van een kalenderjaar wordt voor dat kalenderjaar de tijdvakwinstmarge op jaarbasis vastgesteld
      (jaarsaldo). Ingeval het jaarsaldo negatief is, wordt dit negatieve jaarsaldo opgeteld bij de ten behoeve van
      de vaststelling van het jaarsaldo van het daaropvolgende kalenderjaar op jaarbasis herrekende som. Ingeval de
      belasting over dat aldus berekende jaarsaldo minder bedraagt dan het bedrag aan belasting dat over het kalenderjaar
      is of moet worden voldaan ter zake van reisdiensten wordt het verschil op verzoek aan het reisbureau teruggegeven.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28zd
  - number: 28zd.3
    text: |-
      Het vaststellen van het bedrag van de teruggaaf, bedoeld in het tweede lid, geschiedt bij voor bezwaar vatbare
      beschikking. Het verzoek wordt gedaan binnen zes maanden na afloop van het kalenderjaar waarop het verzoek
      betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28zd
  - number: 28ze
    text: |-
      De belasting die aan het reisbureau in rekening wordt gebracht door andere ondernemers voor de in
      [artikel 28z][ref1], eerste lid, bedoelde handelingen welke de reiziger rechtstreeks ten goede komen, komt niet
      voor aftrek of teruggaaf in aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28z
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28ze
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28z
        hoofdstuk: V
        afdeling: '10'
  - number: 28zf.1
    text: |-
      Ter zake van de reisdiensten wordt voor de toepassing van [artikel 35a, eerste lid, onderdeel h][ref1], de
      omzetbelasting begrepen onder de vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel35a
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28zf
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 35a
        hoofdstuk: VI
        afdeling: '4'
  - number: 28zf.2
    text: |-
      Het is het reisbureau niet toegestaan om de belasting afzonderlijk te vermelden op de ter zake van de reisdienst
      uit te reiken factuur.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28zf
  - number: 28zf.3
    text: |-
      [Artikel 35a, eerste lid, onderdeel j][ref1], is niet van toepassing ter zake van reisdiensten.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel35a
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28zf
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 35a
        hoofdstuk: VI
        afdeling: '4'
  - number: 28zg
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld inzake de toepassing van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel28zg
  - number: '29.1'
    text: 'Op verzoek wordt teruggaaf verleend van de belasting ter zake van leveringen en diensten, voor zover de vergoeding:'
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel29
  - number: 29.1.a
    text: niet is en niet zal worden ontvangen;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel29
  - number: 29.1.b
    text: |-
      wordt terugbetaald omdat een vermindering van de vergoeding is verleend of omdat de goederen in ongebruikte staat
      zijn teruggenomen.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel29
  - number: '29.2'
    text: |-
      De ondernemer die ingevolge [artikel 15][ref1] belasting in aftrek heeft gebracht ter zake van aan hem verrichte
      leveringen van goederen en diensten, wordt het afgetrokken bedrag naar evenredigheid als belasting verschuldigd
      op het tijdstip waarop en voor zover redelijkerwijs moet worden aangenomen dat hij de vergoeding waarop dat bedrag
      betrekking heeft, niet of niet geheel zal betalen dan wel heeft terugontvangen. De belasting wordt in ieder geval
      verschuldigd twee jaren na de opeisbaarheid van de vergoeding, voor zover deze op dat tijdstip nog niet is betaald.
      De verschuldigd geworden belasting wordt op de voet van [artikel 14][ref2] voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel14
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '15'
        hoofdstuk: II
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '14'
        hoofdstuk: II
        afdeling: '4'
  - number: '29.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld waarin het eerste en tweede lid niet van toepassing
      worden verklaard op bedragen welke niet zijn ontvangen onderscheidenlijk betaald ten gevolge van een korting voor
      contante betaling.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel29
  - number: 29a.1
    text: |-
      Op verzoek wordt teruggaaf verleend van de belasting ter zake van intracommunautaire verwerving van goederen, voor
      zover de vergoeding wordt terugbetaald omdat een vermindering van de vergoeding is verleend of omdat de goederen
      in ongebruikte staat zijn teruggezonden. De teruggaaf wordt slechts verleend voor zover de ondernemer de belasting
      niet in aftrek heeft gebracht.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel29a
  - number: 29a.2
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld waarin het eerste lid niet van toepassing wordt
      verklaard op bedragen welke niet zijn betaald ten gevolge van een korting voor contante betaling.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel29a
  - number: '30.1'
    text: |-
      Op verzoek wordt teruggaaf verleend van de belasting ter zake van intracommunautaire verwerving van goederen in de
      gevallen waarin de belasting is geheven met toepassing van [artikel 17b, tweede lid][ref1], en door belanghebbende
      wordt aangetoond dat ter zake van dezelfde verwerving belasting is geheven in de lidstaat van aankomst van de
      verzending of het vervoer.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel17b
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 17b
        hoofdstuk: IIA
        afdeling: '1'
  - number: '30.2'
    text: |-
      Op verzoek wordt naar evenredigheid teruggaaf verleend van de belasting ter zake van intracommunautaire
      verwerving van accijnsgoederen in de gevallen waarin na het tijdstip waarop die intracommunautaire verwerving van
      accijnsgoederen is verricht de in de lidstaat van vertrek van de verzending of het vervoer van die goederen voldane
      accijns door de afnemer is terugontvangen.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel30
  - number: '30.3'
    text: |-
      Op verzoek wordt teruggaaf verleend van de belasting ter zake van invoer van goederen door een rechtspersoon,
      andere dan ondernemer, welke goederen zijn verzonden of vervoerd uit een derde-land met als bestemming een andere
      lidstaat, indien belanghebbende aantoont dat in die andere lidstaat ter zake van intracommunautaire verwerving van
      die goederen belasting is geheven.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel30
  - number: '31.1'
    text: |-
      Een verzoek om teruggaaf van belasting geschiedt bij de aangifte over het tijdvak waarin het recht op teruggaaf
      is ontstaan.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel31
  - number: '31.2'
    text: |-
      In gevallen waarin geen aangifte op de voet van [artikel 14][ref1] moet worden ingediend, geschiedt een verzoek om
      teruggaaf door het doen van aangifte.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel14
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '14'
        hoofdstuk: II
        afdeling: '4'
  - number: '31.3'
    text: |-
      Indien een verzoek om teruggaaf als bedoeld in het tweede lid, wordt gedaan door een ondernemer die niet in
      Nederland woont of is gevestigd en aldaar geen vaste inrichting heeft van waaruit zakelijke handelingen worden
      verricht, maar die is gevestigd in een andere lidstaat, is het bepaalde in [afdeling 2, paragrafen 1][ref1] en
      [2][ref2] mede van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#HoofdstukVI
      [ref2]: https://wetten.overheid.nl/BWBR0002629#HoofdstukVI
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002629
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002629
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '2'
  - number: '31.4'
    text: |-
      Indien een verzoek om teruggaaf als bedoeld in het tweede lid, wordt ingediend door een ondernemer die niet
      in Nederland en niet in de Unie woont of is gevestigd en aldaar geen vaste inrichting heeft, dient het verzoek
      betrekking te hebben op belasting waarvoor het recht op teruggaaf is ontstaan in een tijdvak van ten minste drie
      maanden en ten hoogste een kalenderjaar. Het tijdvak mag evenwel korter zijn dan drie maanden indien deze periode
      het resterende deel van een kalenderjaar betreft. De verzoeken kunnen mede belasting betreffen waarvoor het recht
      op teruggaaf is ontstaan in een ander tijdvak van hetzelfde kalenderjaar, maar waarvoor eerder geen verzoek om
      teruggaaf werd ingediend. Het verzoek moet worden ingediend binnen zes maanden na afloop van het kalenderjaar
      waarin het recht op teruggaaf is ontstaan.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel31
  - number: '31.5'
    text: |-
      Indien een verzoek om teruggaaf als bedoeld in het tweede lid, wordt ingediend door een ander dan een ondernemer
      genoemd in het derde lid of vierde lid, dient het verzoek betrekking te hebben op belasting waarvoor het recht op
      teruggaaf is ontstaan in een kwartaal en moet het verzoek worden ingediend binnen drie maanden na afloop van dat
      kwartaal.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel31
  - number: '31.6'
    text: |-
      In gevallen als bedoeld in het vierde lid, wordt in afwijking van [artikel 17][ref1] geen teruggaaf verleend indien
      het verzoek betrekking heeft op een bedrag aan belasting van minder dan € 400. Betreft een verzoek om teruggaaf als
      is bedoeld in het vierde lid evenwel een kalenderjaar of het resterende gedeelte daarvan, dan moet het bedrag aan
      belasting waarop het verzoek betrekking heeft ten minste € 50 belopen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel17
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '17'
        hoofdstuk: II
        afdeling: '4'
  - number: '31.7'
    text: |-
      Een ondernemer die niet in de Unie woont of is gevestigd en in Nederland geen vaste inrichting heeft, behoeft bij
      een verzoek om teruggaaf, in afwijking van [artikel 57 van de Algemene wet inzake rijksbelastingen][ref1], geen
      domicilie in Nederland te kiezen. Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de wijze
      waarop deze ondernemers moeten aantonen, dat zij ondernemer zijn in de zin van [artikel 7][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel7
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '57'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '7'
        hoofdstuk: II
        afdeling: 1c
  - number: '31.8'
    text: De inspecteur beslist op het verzoek om teruggaaf bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel31
  - number: '31.9'
    text: |-
      Op de verzoeken om teruggaaf van belasting, bedoeld in het eerste en tweede lid, is
      [afdeling 4.1.3 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.3
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.3
  - number: '32'
    text: 'Voor de toepassing van deze afdeling en de daarop gebaseerde bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32
  - number: 32.a
    text: |-
      niet in de lidstaat van teruggaaf gevestigde ondernemer: iedere ondernemer in de zin van
      [artikel 7, eerste en tweede lid][ref1], die niet in de lidstaat van teruggaaf, maar in een andere lidstaat
      gevestigd is;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel7
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '7'
        hoofdstuk: II
        afdeling: 1c
  - number: 32.b
    text: |-
      lidstaat van teruggaaf: de lidstaat waar de belasting aan de niet in de lidstaat van teruggaaf gevestigde
      ondernemer in rekening werd gebracht ter zake van de voor genoemde ondernemer door andere ondernemers in deze
      lidstaat verrichte diensten of goederenleveringen, dan wel ter zake van de invoer van goederen in deze lidstaat;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32
  - number: 32.c
    text: 'teruggaaftijdvak: het tijdvak waarop het teruggaafverzoek betrekking heeft;'
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32
  - number: 32.d
    text: |-
      teruggaafverzoek: het verzoek om teruggaaf van de aan de niet in de lidstaat van teruggaaf gevestigde ondernemer
      in rekening gebrachte belasting ter zake van de voor genoemde ondernemer door andere ondernemers in deze lidstaat
      verrichte diensten of goederenleveringen, of ter zake van de invoer van goederen in deze lidstaat;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32
  - number: 32.e
    text: 'aanvrager: de niet in de lidstaat van teruggaaf gevestigde ondernemer die het teruggaafverzoek doet.'
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32
  - number: 32a.1
    text: |-
      Betreft het teruggaafverzoek een teruggaaftijdvak van minder dan één kalenderjaar, doch van ten minste drie
      maanden, dan moet het belastingbedrag waarop het teruggaafverzoek betrekking heeft ten minste 400 euro of de
      tegenwaarde daarvan in de nationale munteenheid belopen.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32a
  - number: 32a.2
    text: |-
      Betreft het teruggaafverzoek een teruggaaftijdvak van een kalenderjaar of het resterende gedeelte van een
      kalenderjaar, dan moet het belastingbedrag ten minste 50 euro of de tegenwaarde daarvan in de nationale munteenheid
      belopen.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32a
  - number: 32b
    text: |-
      Een niet in Nederland gevestigde ondernemer kan een teruggaafverzoek doen voor in Nederland in rekening gebrachte
      belasting ter zake van aan hem door andere ondernemers in Nederland verrichte diensten of goederenleveringen dan
      wel ter zake van de invoer, indien hij aan de volgende voorwaarden voldoet:
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32b
  - number: 32b.a
    text: |-
      tijdens het tijdvak van teruggaaf heeft hij in Nederland noch de zetel van zijn bedrijfsuitoefening gehad, noch een
      vaste inrichting van waaruit zakelijke handelingen werden verricht, noch, bij gebreke van een dergelijke zetel of
      vaste inrichting, zijn woonplaats of zijn gebruikelijke verblijfplaats;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32b
  - number: 32b.b
    text: |-
      tijdens het tijdvak van teruggaaf heeft hij geen goederenleveringen of diensten verricht waarvan de plaats geacht
      wordt in Nederland te zijn gelegen, met uitzondering van de volgende handelingen:
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32b
  - number: 32b.b.1°
    text: |-
      vervoerdiensten en daarmee samenhangende diensten die vrijgesteld zijn krachtens
      [artikel 39 van de Algemene wet inzake rijksbelastingen][ref1] dan wel vallen onder het tarief van nihil krachtens
      [artikel 9, tweede lid, onderdeel b][ref2], en de bij deze wet behorende [tabel II][ref3], onderdeel b, post 1, 2,
      4 of 5;


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32b
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '39'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '9'
        hoofdstuk: II
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002629
  - number: 32b.b.2°
    text: |-
      goederenleveringen of dienstverrichtingen waarvan de afnemer krachtens
      [artikel 12, tweede, derde of vijfde lid][ref1], de belasting verschuldigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel12
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '12'
        hoofdstuk: II
        afdeling: '4'
  - number: 32c
    text: 'Deze paragraaf is niet van toepassing ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32c
  - number: 32c.a
    text: ingevolge deze wet incorrect gefactureerde belastingbedragen;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32c
  - number: 32c.b
    text: |-
      gefactureerde belastingbedragen voor goederenleveringen die krachtens [artikel 9, tweede lid, onderdeel b][ref1],
      en de bij deze wet behorende [tabel II][ref2], onderdeel a, post 6, onder het tarief van nihil vallen;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32c
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '9'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002629
  - number: 32c.c
    text: |-
      gefactureerde belastingbedragen voor leveringen van goederen die door of voor rekening van een niet in Nederland
      gevestigde afnemer worden verzonden of vervoerd naar een plaats buiten de Unie, welke leveringen krachtens
      [artikel 9, tweede lid, onderdeel b][ref1], en de bij deze wet behorende [bijlage II][ref2], onderdeel a, post 2,
      onder het tarief van nihil vallen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32c
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '9'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002629
  - number: 32d.1
    text: |-
      De niet in Nederland gevestigde ondernemer wordt op verzoek teruggaaf verleend van de belasting die werd geheven
      ter zake van de aan hem door andere ondernemers in Nederland verrichte goederenleveringen of diensten, of ter zake
      van de invoer van goederen in Nederland, voor zover deze goederen of diensten worden gebruikt voor de volgende
      handelingen:
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32d
  - number: 32d.1.a
    text: |-
      de handelingen bedoeld in [artikel 15, tweede lid, onderdelen a en b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32d
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '15'
        hoofdstuk: II
        afdeling: '4'
  - number: 32d.1.b
    text: |-
      handelingen, waarvan de afnemer overeenkomstig [artikel 12, tweede tot en met vijfde lid][ref1], tot voldoening van
      de belasting is gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel12
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32d
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '12'
        hoofdstuk: II
        afdeling: '4'
  - number: 32d.2
    text: |-
      Onverminderd het bepaalde in [artikel 32e][ref1] wordt voor de toepassing van deze afdeling het recht op teruggaaf
      van voorbelasting bepaald overeenkomstig de daarvoor geldende bepalingen van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel32e
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32d
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 32e
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '2'
  - number: 32e.1
    text: |-
      Om in Nederland recht te hebben op teruggaaf verricht een niet in Nederland gevestigde ondernemer handelingen die
      in de lidstaat van vestiging een recht op aftrek doen ontstaan.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32e
  - number: 32e.2
    text: |-
      Wanneer een niet in Nederland gevestigde ondernemer in de lidstaat waar hij gevestigd is, zowel handelingen
      verricht die in die lidstaat een recht op aftrek doen ontstaan, als handelingen die in die lidstaat geen recht
      op aftrek doen ontstaan, kan van het overeenkomstig [artikel 32d][ref1] voor teruggaaf in aanmerking komende
      bedrag slechts dat gedeelte van de belasting door Nederland worden teruggegeven dat overeenkomstig artikel 173
      van BTW-richtlijn 2006, zoals toegepast door de lidstaat van vestiging, aan eerstgenoemde handelingen kan worden
      toegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel32d
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32e
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 32d
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '2'
  - number: 32f.1
    text: |-
      Een niet in Nederland gevestigde ondernemer die in Nederland teruggaaf van de belasting wenst te verkrijgen, richt
      langs elektronische weg een teruggaafverzoek tot Nederland, dat hij indient bij zijn lidstaat van vestiging, via de
      door deze lidstaat ingestelde portaalsite.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32f
  - number: 32f.2
    text: |-
      Het verzoek bevat alle informatie die daartoe bij ministeriële regeling is voorgeschreven overeenkomstig het
      bepaalde in de artikelen 8 en 9, lid 1, van Richtlijn 2008/9/EG van de Raad van 12 februari 2008 tot vaststelling
      van nadere voorschriften voor de in Richtlijn 2006/112/EG vastgestelde teruggaaf van de belasting over de
      toegevoegde waarde aan belastingplichtigen die niet in de lidstaat van teruggaaf maar in een andere lidstaat
      gevestigd zijn (PbEU 2008, L 44).
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32f
  - number: 32f.3
    text: |-
      Bij ministeriële regeling kan worden bepaald dat de aanvrager langs elektronische weg aanvullende gegevens
      verstrekt met betrekking tot iedere in artikel 9, lid 1, van Richtlijn 2008/9/EG, genoemd in het tweede lid,
      vermelde code, voor zover die gegevens noodzakelijk zijn wegens in Nederland geldende beperkingen van het recht op
      aftrek of voor de toepassing van een krachtens artikel 395 of 396 van BTW-richtlijn 2006 aan Nederland verleende,
      voor dit geval relevante afwijking.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32f
  - number: 32f.4
    text: |-
      [Artikel 57 van de Algemene wet inzake rijksbelastingen][ref1] is niet van toepassing met betrekking tot
      ondernemers die een verzoek doen als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel57
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32f
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '57'
  - number: 32g
    text: |-
      Bij ministeriële regeling kan worden bepaald dat de aanvrager, onverminderd de krachtens [artikel 32n][ref1]
      verlangde gegevens, tezamen met het teruggaafverzoek langs elektronische weg een afschrift van de factuur of het
      invoerdocument overlegt, wanneer de maatstaf van heffing op de factuur of het invoerdocument 1000 euro of meer
      beloopt. Indien de factuur betrekking heeft op brandstof, is dit drempelbedrag 250 euro.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel32n
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32g
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 32n
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '2'
  - number: 32h
    text: |-
      Bij ministeriële regeling kan worden bepaald dat de aanvrager tezamen met het teruggaafverzoek zijn
      beroepsactiviteit omschrijft aan de hand van de geharmoniseerde codes die worden bepaald volgens artikel 34
      bis, lid 3, tweede alinea, van Verordening (EG) nr. 1798/2003 van de Raad van 7 oktober 2003 betreffende de
      administratieve samenwerking op het gebied van de belasting over de toegevoegde waarde en tot intrekking van
      Verordening (EEG) nr. 218/92 (PbEU 2003, L 264).
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32h
  - number: 32i
    text: |-
      Bij ministeriële regeling wordt bepaald welke taal of talen de aanvrager kan gebruiken voor het verstrekken van de
      gegevens in het teruggaafverzoek of van mogelijke andere aanvullende gegevens die moeten worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32i
  - number: 32j.1
    text: |-
      Indien het vermelde pro rata voor de toepassing van de aftrek overeenkomstig artikel 175 van BTW-richtlijn 2006 na
      de indiening van het teruggaafverzoek wordt aangepast, corrigeert de aanvrager het bedrag dat wordt teruggevraagd
      of dat reeds is teruggegeven.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32j
  - number: 32j.2
    text: |-
      De correctie vindt plaats in een teruggaafverzoek dat gedaan wordt binnen het kalenderjaar volgend op het
      desbetreffende teruggaaftijdvak. Mocht de aanvrager in dat kalenderjaar geen volgend teruggaafverzoek indienen dan
      vindt de correctie plaats door toezending van een afzonderlijke verklaring via de door de lidstaat van vestiging
      ingestelde portaalsite.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32j
  - number: 32k.1
    text: 'Het teruggaafverzoek heeft betrekking op:'
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32k
  - number: 32k.1.a
    text: |-
      verwervingen van goederen of afnames van diensten die gedurende het teruggaaftijdvak gefactureerd zijn, mits de
      belasting vóór of op het tijdstip van facturatie verschuldigd geworden is, of ten aanzien waarvan de belasting
      gedurende het teruggaaftijdvak verschuldigd geworden is, mits de verwervingen of afnames gefactureerd zijn voordat
      de belasting verschuldigd is geworden;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32k
  - number: 32k.1.b
    text: de invoer van goederen die gedurende het teruggaaftijdvak heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32k
  - number: 32k.2
    text: |-
      Naast de in het eerste lid bedoelde transacties kan het teruggaafverzoek ook betrekking hebben op facturen of
      invoerdocumenten die niet door eerdere teruggaafverzoeken werden bestreken en die betrekking hebben op handelingen
      die tijdens het kalenderjaar in kwestie werden verricht.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32k
  - number: 32l
    text: |-
      Het teruggaafverzoek moet uiterlijk 30 september van het kalenderjaar volgend op het teruggaaftijdvak bij de
      lidstaat van vestiging worden ingediend.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32l
  - number: 32m.1
    text: |-
      De inspecteur stelt de aanvrager onverwijld langs elektronische weg in kennis van de datum van ontvangst van het
      verzoek.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32m
  - number: 32m.2
    text: |-
      De inspecteur deelt zijn beslissing om het teruggaafverzoek in te willigen of af te wijzen binnen vier maanden na
      ontvangst van het verzoek aan de aanvrager mee bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32m
  - number: 32n.1
    text: |-
      Ingeval de inspecteur meent niet alle dienstige informatie te hebben ontvangen om met betrekking tot
      het geheel of een deel van het teruggaafverzoek een beschikking te kunnen nemen, kan hij binnen de in
      [artikel 32m, tweede lid][ref1], genoemde termijn van vier maanden, langs elektronische weg in het bijzonder de
      aanvrager of de lidstaat van vestiging om aanvullende gegevens verzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel32m
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32n
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 32m
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '2'
  - number: 32n.2
    text: |-
      Indien de aanvullende gegevens worden opgevraagd bij een andere persoon dan de aanvrager of de bevoegde
      autoriteiten van een lidstaat kan de inspecteur alleen langs elektronische weg om gegevens verzoeken indien de
      bestemmeling van het verzoek over de desbetreffende apparatuur beschikt.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32n
  - number: 32n.3
    text: Zo nodig kan de inspecteur om verdere aanvullende gegevens verzoeken.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32n
  - number: 32n.4
    text: |-
      De overeenkomstig de eerste tot en met vierde lid verlangde gegevens kunnen het overleggen van het origineel of een
      afschrift van de factuur of het invoerdocument omvatten wanneer de inspecteur op goede gronden het bestaan van een
      bepaalde vordering betwijfelt. In dat geval zijn de drempelnormen van [artikel 32g][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel32g
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32n
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 32g
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '2'
  - number: 32n.5
    text: |-
      De krachtens de vorige leden gevraagde gegevens moeten binnen een maand na ontvangst van het verzoek om informatie
      door de bestemmeling van het verzoek aan de inspecteur worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32n
  - number: 32o.1
    text: |-
      Indien de inspecteur om aanvullende gegevens heeft verzocht, deelt hij zijn beslissing om het teruggaafverzoek
      in te willigen of af te wijzen bij voor bezwaar vatbare beschikking mee aan de aanvrager binnen twee maanden na
      ontvangst van de gevraagde gegevens of, indien niet op zijn verzoek gereageerd is, binnen twee maanden na het
      verstrijken van de in [artikel 32n, vijfde lid][ref1], genoemde termijn. De termijn waarover de inspecteur vanaf
      de ontvangst van het teruggaafverzoek beschikt om over een volledige of gedeeltelijke teruggaaf een beslissing te
      nemen, beloopt in ieder geval ten minste zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel32n
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32o
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 32n
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '2'
  - number: 32o.2
    text: |-
      Wanneer de inspecteur verdere aanvullende gegevens verlangt, stelt hij binnen acht maanden nadat het
      teruggaafverzoek door hem is ontvangen, de aanvrager bij voor bezwaar vatbare beschikking in kennis van zijn
      beslissing over een gehele of gedeeltelijke teruggaaf.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32o
  - number: 32p.1
    text: |-
      Indien de inspecteur het teruggaafverzoek inwilligt, wordt het goedgekeurde teruggaafbedrag betaald uiterlijk
      binnen tien werkdagen na het verstrijken van de in [artikel 32m, tweede lid][ref1], genoemde termijn, of, indien
      om aanvullende of verdere aanvullende gegevens is verzocht, na het verstrijken van de overeenkomstige termijnen
      in [artikel 32o][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel32m
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel32o
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32p
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 32m
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 32o
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '2'
  - number: 32p.2
    text: |-
      De betaling vindt plaats in Nederland, of, indien de aanvrager daarom verzoekt, in een andere lidstaat. In het
      laatste geval worden de bankkosten voor het overmaken in mindering gebracht op het aan de aanvrager te betalen
      bedrag.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32p
  - number: 32q.1
    text: |-
      Indien de correctie, bedoeld in [artikel 32j, tweede lid, eerste volzin][ref1], na verrekening in het aldaar
      bedoelde nieuwe teruggaafverzoek leidt tot:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel32j
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32q
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 32j
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '2'
  - number: 32q.1.a
    text: een bedrag van nihil of een teruggaaf, beslist de inspecteur bij een voor bezwaar vatbare beschikking;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32q
  - number: 32q.1.b
    text: een te betalen bedrag, legt de inspecteur hiervoor een naheffingsaanslag op.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32q
  - number: 32q.2
    text: |-
      Indien de correctie, bedoeld in [artikel 32j, tweede lid, tweede volzin][ref1], leidt tot:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel32j
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32q
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 32j
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '2'
  - number: 32q.2.a
    text: een teruggaaf, beslist de inspecteur bij een voor bezwaar vatbare beschikking;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32q
  - number: 32q.2.b
    text: een te betalen bedrag, legt de inspecteur hiervoor een naheffingsaanslag op.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32q
  - number: 32r.1
    text: |-
      Indien de betaling plaatsvindt na de laatste datum van betaling overeenkomstig [artikel 32p, eerste lid][ref1],
      wordt aan de aanvrager rente betaald over het aan de aanvrager terug te geven bedrag. De bepalingen van de
      [artikelen 29][ref2] en [30 van de Invorderingswet 1990][ref3] zijn ter zake van overeenkomstige toepassing als
      ware de rente invorderingsrente.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel32p
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel30
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32r
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 32p
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '29'
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '30'
  - number: 32r.2
    text: |-
      Het eerste lid, eerste volzin, is niet van toepassing indien de aanvrager de gevraagde aanvullende of verdere
      aanvullende gegevens niet binnen de voorgeschreven termijn aan de inspecteur heeft verstrekt. Het eerste lid,
      eerste volzin, is evenmin van toepassing zolang de inspecteur de krachtens [artikel 32g][ref1] langs elektronische
      weg toe te zenden documenten niet heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel32g
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32r
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 32g
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '2'
  - number: 32s
    text: |-
      De rente wordt berekend vanaf de dag volgende op de laatste dag waarop de teruggaaf volgens
      [artikel 32p, eerste lid][ref1], uiterlijk had moeten plaatsvinden tot de dag waarop de teruggaaf daadwerkelijk
      plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel32p
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel32s
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 32p
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '2'
  - number: '33'
    text: |-
      Een in Nederland gevestigde ondernemer kan een teruggaafverzoek doen aan een lidstaat van teruggaaf indien hij aan
      de volgende voorwaarden voldoet:
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33
  - number: 33.a
    text: |-
      tijdens het tijdvak van teruggaaf heeft hij in de lidstaat van teruggaaf noch de zetel van zijn bedrijfsuitoefening
      gehad, noch een vaste inrichting van waaruit zakelijke handelingen werden verricht, noch, bij gebreke van een
      dergelijke zetel of vaste inrichting, zijn woonplaats of zijn gebruikelijke verblijfplaats;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33
  - number: 33.b
    text: |-
      tijdens het tijdvak van teruggaaf heeft hij geen goederenleveringen of diensten verricht waarvan de plaats geacht
      wordt in de lidstaat van teruggaaf te zijn gelegen, met uitzondering van de volgende handelingen:
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33
  - number: 33.b.1°
    text: |-
      vervoerdiensten en daarmee samenhangende diensten die in die lidstaat vrijgesteld zijn krachtens de artikelen 144,
      146, 148, 149, 151, 153, 159 of 160 van BTW-richtlijn 2006;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33
  - number: 33.b.2°
    text: |-
      goederenleveringen of dienstverrichtingen waarvan de afnemer krachtens de artikelen 194 tot en met 197 en artikel
      199 van BTW-richtlijn 2006 in die lidstaat de belasting verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33
  - number: 33a
    text: |-
      Het teruggaafverzoek heeft betrekking op de belasting die werd geheven ter zake van de voor de ondernemer door
      andere ondernemers in de lidstaat van teruggaaf verrichte goederenleveringen of diensten, of ter zake van de invoer
      van goederen in deze lidstaat voor zover deze goederen of diensten worden gebruikt voor de volgende handelingen:
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33a
  - number: 33a.a
    text: de handelingen bedoeld in artikel 169, punten a) en b), van BTW-richtlijn 2006;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33a
  - number: 33a.b
    text: |-
      handelingen, waarvan de afnemer overeenkomstig de artikelen 194 tot en met 197 en artikel 199 van BTW-richtlijn
      2006, als toegepast in de lidstaat van teruggaaf, tot voldoening van de belasting is gehouden.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33a
  - number: 33b.1
    text: |-
      Om in de lidstaat van teruggaaf recht te hebben op teruggaaf verricht de in Nederland gevestigde ondernemer
      handelingen die in Nederland een recht op aftrek doen ontstaan.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33b
  - number: 33b.2
    text: |-
      Wanneer de niet in de lidstaat van teruggaaf gevestigde ondernemer in Nederland gevestigd is, en zowel handelingen
      verricht die in Nederland een recht op aftrek doen ontstaan, als handelingen die in Nederland geen recht op aftrek
      doen ontstaan, kan van het overeenkomstig [artikel 33a][ref1] voor teruggaaf in aanmerking komende bedrag slechts
      dat gedeelte van de belasting door de lidstaat van teruggaaf in aanmerking worden genomen dat overeenkomstig
      artikel 173 van BTW-richtlijn 2006, zoals toegepast door Nederland, aan eerstgenoemde handelingen kan worden
      toegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 33a
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '2'
  - number: 33c.1
    text: |-
      De in Nederland gevestigde ondernemer die in de lidstaat van teruggaaf de belasting terug wil verkrijgen, richt
      langs elektronische weg een teruggaafverzoek tot die lidstaat, dat hij indient bij de inspecteur via een daartoe
      ingestelde portaalsite.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33c
  - number: 33c.2
    text: 'Het teruggaafverzoek bevat de volgende informatie:'
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33c
  - number: 33c.2.a
    text: de naam en het volledige adres van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33c
  - number: 33c.2.b
    text: een elektronisch adres;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33c
  - number: 33c.2.c
    text: een omschrijving van de beroepsactiviteit van de aanvrager waarvoor de goederen of diensten worden afgenomen;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33c
  - number: 33c.2.d
    text: het teruggaaftijdvak waarop het verzoek betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33c
  - number: 33c.2.e
    text: |-
      een verklaring van de aanvrager dat hij gedurende het teruggaaftijdvak geen goederenleveringen of diensten heeft
      verricht waarvan de plaats geacht wordt in de lidstaat van teruggaaf te zijn gelegen, met uitzondering van de
      handelingen bedoeld in [artikel 33, onderdeel b, onder 1° en 2°][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel33
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33c
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '33'
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '2'
  - number: 33c.2.f
    text: het btw-identificatienummer of het fiscaal registratienummer van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33c
  - number: 33c.2.g
    text: zijn bankgegevens (inclusief IBAN en BIC).
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33c
  - number: 33c.3
    text: |-
      Naast de in het tweede lid bedoelde gegevens worden in het teruggaafverzoek voor iedere lidstaat van teruggaaf en
      voor iedere factuur en ieder invoerdocument de volgende gegevens vermeld:
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33c
  - number: 33c.3.a
    text: de naam en het volledige adres van de leverancier of dienstverrichter;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33c
  - number: 33c.3.b
    text: |-
      behalve in het geval van invoer, het btw-identificatienummer van de leverancier of dienstverrichter of zijn fiscaal
      registratienummer, toegekend door de lidstaat van teruggaaf overeenkomstig artikel 239 en 240 van BTW-richtlijn
      2006;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33c
  - number: 33c.3.c
    text: |-
      behalve in het geval van invoer, het landencodenummer van de lidstaat van teruggaaf overeenkomstig artikel 215 van
      BTW-richtlijn 2006;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33c
  - number: 33c.3.d
    text: de datum en het nummer van de factuur of het invoerdocument;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33c
  - number: 33c.3.e
    text: de maatstaf van heffing en het bedrag aan btw, uitgedrukt in de munteenheid van de lidstaat van teruggaaf;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33c
  - number: 33c.3.f
    text: |-
      het overeenkomstig [artikel 33a][ref1] en [artikel 33b, tweede alinea][ref2], berekende bedrag van de aftrekbare
      belasting, uitgedrukt in de munteenheid van de lidstaat van teruggaaf;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel33a
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel33b
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33c
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 33a
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 33b
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '2'
  - number: 33c.3.g
    text: |-
      indien van toepassing, het overeenkomstig [artikel 33b][ref1] berekende pro rata, uitgedrukt in procenten;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel33b
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33c
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 33b
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '2'
  - number: 33c.3.h
    text: |-
      de aard van de afgenomen goederen en diensten, aangegeven door middel van de codes als bepaald in
      [artikel 33d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel33d
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33c
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 33d
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '2'
  - number: 33d.1
    text: |-
      In het teruggaafverzoek moet de aard van de afgenomen goederen en diensten door middel van de volgende codes worden
      aangegeven:
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33d
  - number: 33d.1.1
    text: '= brandstof;'
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33d
  - number: 33d.1.2
    text: '= verhuur van vervoermiddelen;'
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33d
  - number: 33d.1.3
    text: |-
      = uitgaven in verband met vervoermiddelen, andere dan die voor de goederen en diensten waarnaar wordt verwezen met
      de codes 1 en 2;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33d
  - number: 33d.1.4
    text: '= wegentol en andere heffingen met betrekking tot het gebruik van de weginfrastructuur;'
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33d
  - number: 33d.1.5
    text: '= reiskosten, zoals taxikosten, kosten van het openbaar vervoer;'
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33d
  - number: 33d.1.6
    text: '= logies;'
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33d
  - number: 33d.1.7
    text: '= spijzen, drank en restauratie;'
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33d
  - number: 33d.1.8
    text: '= toegang tot beurzen en tentoonstellingen;'
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33d
  - number: 33d.1.9
    text: '= weelde-uitgaven, en uitgaven voor ontspanning en representatie;'
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33d
  - number: 33d.1.10
    text: '= andere.'
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33d
  - number: 33d.2
    text: |-
      Op daartoe strekkend verzoek van de lidstaat van teruggaaf verstrekt de aanvrager bij het verzoek langs
      elektronische weg aanvullende gegevens met betrekking tot iedere in het eerste lid vermelde code, voor zover die
      gegevens voor die lidstaat noodzakelijk zijn wegens beperkingen van het recht op aftrek krachtens BTW-richtlijn
      2006, als toegepast in die lidstaat, of voor de toepassing van een krachtens artikel 395 of 396 van die richtlijn
      aan de lidstaat van teruggaaf verleende, voor dit geval relevante afwijking.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33d
  - number: 33d.3
    text: |-
      Op daartoe strekkend verzoek van de lidstaat van teruggaaf omschrijft de aanvrager voorts bij het verzoek zijn
      beroepsactiviteit aan de hand van de geharmoniseerde codes die worden bepaald volgens artikel 34bis, lid 3,
      tweede alinea, van Verordening (EG) nr. 1798/2003 van de Raad van 7 oktober 2003 betreffende de administratieve
      samenwerking op het gebied van de belasting over de toegevoegde waarde en tot intrekking van Verordening (EEG) nr.
      218/92 (PbEU 2003, L 264).
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33d
  - number: 33e.1
    text: |-
      Het teruggaafverzoek moet uiterlijk 30 september van het kalenderjaar volgend op het teruggaaftijdvak bij de door
      de inspecteur ingestelde portaalsite worden ingediend. Het teruggaafverzoek geldt alleen als ingediend indien de
      aanvrager alle in de [artikelen 33c][ref1] en [33d][ref2] verlangde gegevens verstrekt heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel33c
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel33d
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33e
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 33c
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 33d
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '2'
  - number: 33e.2
    text: De inspecteur stuurt de aanvrager onverwijld langs elektronische weg een bevestiging van ontvangst.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33e
  - number: 33f.1
    text: |-
      De inspecteur stuurt het verzoek niet door aan de lidstaat van teruggaaf wanneer de aanvrager in Nederland
      gedurende het teruggaaftijdvak:
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33f
  - number: 33f.1.a
    text: niet aan belasting onderworpen is;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33f
  - number: 33f.1.b
    text: |-
      slechts goederenleveringen of diensten verricht die uit hoofde van [artikel 11][ref1] van belasting vrijgesteld
      zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel11
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33f
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '11'
        hoofdstuk: II
        afdeling: '3'
  - number: 33f.1.c
    text: |-
      valt onder de in [artikel 25][ref1] opgenomen regeling voor kleine ondernemers;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel25
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33f
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '25'
        hoofdstuk: V
        afdeling: '1'
  - number: 33f.1.d
    text: |-
      valt onder de in [artikel 27, eerste en tweede lid][ref1], bedoelde landbouwregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel27
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33f
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '27'
        hoofdstuk: V
        afdeling: '3'
  - number: 33f.2
    text: |-
      De inspecteur stelt de aanvrager langs elektronische weg in kennis van zijn beslissing uit hoofde van het eerste
      lid bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33f
  - number: 33g.1
    text: |-
      De ondernemer die niet in Nederland woont of is gevestigd en aldaar geen vaste inrichting heeft, kan in Nederland
      een fiscaal vertegenwoordiger aanstellen ter zake van zijn leveringen en diensten waarvoor hij de belasting
      verschuldigd is en ter zake van zijn intracommunautaire verwervingen en invoer. De fiscaal vertegenwoordiger treedt
      op namens de ondernemer en treedt in zijn plaats met betrekking tot alle rechten en verplichtingen die hij heeft
      inzake de aangifte en de betaling van de belasting, alsmede de verplichtingen bedoeld in [artikel 37a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel37a
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33g
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 37a
        hoofdstuk: VI
        afdeling: '4'
  - number: 33g.2
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald in welke gevallen een ondernemer als bedoeld in het eerste
      lid verplicht is een fiscaal vertegenwoordiger aan te stellen.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33g
  - number: 33g.3
    text: De fiscaal vertegenwoordiger dient in het bezit te zijn van een daartoe verstrekte vergunning van de inspecteur.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33g
  - number: 33g.4
    text: |-
      Degene die een vergunning als fiscaal vertegenwoordiger wil verkrijgen, dient daartoe een verzoek in bij de
      inspecteur. Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de gegevens
      die het verzoek moet bevatten.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33g
  - number: 33g.5
    text: |-
      Bij het verzoek dient een verklaring van de in het eerste lid bedoelde ondernemer te worden overgelegd waaruit
      blijkt dat degene die het verzoek indient door de ondernemer is gemachtigd namens hem op te treden als fiscaal
      vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33g
  - number: 33g.6
    text: |-
      Bij algemene maatregel van bestuur kunnen, ter verzekering van de heffing en de invordering, regels worden gesteld
      met betrekking tot de voorwaarden waaronder de vergunning wordt verleend, gewijzigd en ingetrokken. Het verlenen,
      het wijzigen en het intrekken van de vergunning geschiedt bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel33g
  - number: '34.1'
    text: |-
      De ondernemer is gehouden, met inachtneming van bij ministeriële regeling te stellen regels, aantekening te houden
      van de door hem en aan hem verrichte leveringen van goederen en verleende diensten, van de door hem verrichte
      intracommunautaire verwervingen van goederen, van de invoer van goederen in en de uitvoer van goederen uit de Unie,
      alsmede van andere gegevens die van belang zijn met betrekking tot de heffing van de belasting in Nederland en in
      andere lidstaten.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel34
  - number: '34.2'
    text: 'De ondernemer is tevens, met inachtneming van bij ministeriële regeling te stellen regels, gehouden:'
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel34
  - number: 34.2.a
    text: |-
      een register bij te houden van de goederen die door hem of voor zijn rekening zijn verzonden of vervoerd naar
      een andere lidstaat om aldaar te worden gebruikt voor de in [artikel 3a, tweede lid, onderdelen e, f en g][ref1],
      bedoelde doeleinden;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel3a
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 3a
        hoofdstuk: II
        afdeling: '1'
  - number: 34.2.b
    text: |-
      afzonderlijk aantekening te houden van de goederen die vanuit een andere lidstaat naar hem zijn verzonden of
      vervoerd door of voor rekening van een ondernemer aan wie een btw-identificatienummer is toegekend in een andere
      lidstaat, ten behoeve van een dienst als bedoeld in [artikel 6e, tweede lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel6e
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 6e
        hoofdstuk: II
        paragraaf: '2'
        afdeling: 1b
  - number: '34.3'
    text: |-
      De rechtspersoon, andere dan ondernemer, is gehouden, met inachtneming van bij ministeriële regeling te stellen
      regels, aantekening te houden van de door hem verrichte intracommunautaire verwervingen van goederen.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel34
  - number: '34.4'
    text: |-
      De ondernemer die goederen levert met toepassing van [artikel 28b][ref1], [28c][ref2] of [28d][ref3], is tevens
      gehouden, met inachtneming van bij ministeriële regeling te stellen regels, afzonderlijk aantekening te houden van
      de met toepassing van de onderscheiden artikelen geleverde goederen, alsmede van de invoer en van de leveringen
      daarvan aan hem.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28b
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel28c
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel28d
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28b
        hoofdstuk: V
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 28c
        hoofdstuk: V
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0002629
        artikel: 28d
        hoofdstuk: V
        afdeling: '5'
  - number: 34a
    text: |-
      De ondernemer is verplicht boeken, bescheiden en andere gegevensdragers of de inhoud daarvan – zulks ter keuze
      van de inspecteur – betreffende onroerende zaken en rechten waaraan deze zijn onderworpen gedurende negen jaren,
      volgende op het jaar waarin hij het goed is gaan gebruiken, te bewaren.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel34a
  - number: 34b
    text: |-
      Onverminderd het bepaalde in [artikel 52 van de Algemene wet inzake rijksbelastingen][ref1] en [artikel 35c][ref2]
      is het volgende van toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel35c
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel34b
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '52'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 35c
        hoofdstuk: VI
        afdeling: '4'
  - number: 34b.a
    text: |-
      voor facturering gelden de regels die van toepassing zijn in de lidstaat waar de goederenlevering of de dienst
      geacht wordt te zijn verricht, overeenkomstig het bepaalde in [hoofdstuk II][ref1] van deze wet;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel34b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        hoofdstuk: II
  - number: 34b.b
    text: |-
      in afwijking van het bepaalde in onderdeel a gelden voor facturering de regels die van toepassing zijn in de
      lidstaat waar degene die de goederenlevering of de dienst verricht de zetel van zijn bedrijfsuitoefening of een
      vaste inrichting heeft gevestigd van waaruit hij de prestatie verricht, of, bij gebreke van een dergelijke zetel
      of vaste inrichting, de lidstaat waar de leverancier of dienstverrichter zijn woonplaats of zijn gebruikelijke
      verblijfplaats heeft, wanneer:
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel34b
  - number: 34b.b.1°
    text: |-
      degene die de belastbare goederenlevering of de dienst verricht, niet gevestigd is in de lidstaat waar de
      goederenlevering of de dienst overeenkomstig het bepaalde in hoofdstuk II van deze wet geacht wordt te zijn
      verricht, of zijn inrichting in die lidstaat niet betrokken is bij het verrichten van de goederenlevering of de
      dienst in de zin van artikel 192bis van de BTW-richtlijn 2006, en de tot voldoening van de belasting gehouden
      persoon degene is voor wie de goederenlevering of de dienst wordt verricht. Indien de afnemer de factuur uitreikt
      («self-billing») is het bepaalde in onderdeel a van toepassing;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel34b
  - number: 34b.b.2°
    text: |-
      de goederenlevering of de dienst overeenkomstig het bepaalde in [hoofdstuk II][ref1] van deze wet niet geacht wordt
      in de Unie te zijn verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel34b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        hoofdstuk: II
  - number: 34c.1
    text: |-
      Iedere ondernemer zorgt ervoor dat door hemzelf dan wel, in zijn naam en voor zijn rekening, door zijn afnemer of
      een derde, in de volgende gevallen een factuur wordt uitgereikt ter zake van:
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel34c
  - number: 34c.1.a
    text: |-
      de goederenleveringen of diensten die hij heeft verricht voor een andere ondernemer of een rechtspersoon, andere
      dan ondernemer;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel34c
  - number: 34c.1.b
    text: |-
      de goederenleveringen, bedoeld in [artikel 5a, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel5a
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel34c
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 5a
        hoofdstuk: II
        afdeling: 1a
  - number: 34c.1.c
    text: |-
      de goederenleveringen, bedoeld in de bij deze wet behorende [tabel II, onderdeel a, post 6][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel34c
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: 34c.1.d
    text: |-
      de vooruitbetalingen die aan hem worden gedaan voordat een van de in de onderdelen a en b bedoelde
      goederenleveringen is verricht;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel34c
  - number: 34c.1.e
    text: |-
      de vooruitbetalingen die door een andere ondernemer of een rechtspersoon, andere dan ondernemer, aan hem worden
      gedaan voordat de dienst is verricht.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel34c
  - number: 34c.2
    text: |-
      Onder bij ministeriële regeling te stellen voorwaarden en beperkingen zijn ondernemers die uitsluitend
      vrijgestelde prestaties verrichten, ontheven van de verplichting ingevolge het eerste lid. De vorige volzin is
      van overeenkomstige toepassing op de vrijgestelde prestaties van ondernemers die zowel vrijgestelde als belaste
      prestaties verrichten.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel34c
  - number: 34d.1
    text: 'In de volgende gevallen kan worden volstaan met een vereenvoudigde factuur:'
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel34d
  - number: 34d.1.a
    text: wanneer het bedrag van de factuur niet hoger is dan € 100;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel34d
  - number: 34d.1.b
    text: |-
      wanneer de uitgereikte factuur een document of bericht is dat overeenkomstig [artikel 34f][ref1] als factuur
      geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel34f
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel34d
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 34f
        hoofdstuk: VI
        afdeling: '4'
  - number: 34d.2
    text: |-
      Een vereenvoudigde factuur wordt niet uitgereikt indien de factuur moet worden uitgereikt overeenkomstig
      [artikel 34c, eerste lid, onderdelen b en c][ref1], of indien de belastbare goederenlevering of de belastbare
      dienst wordt verricht door een ondernemer die niet is gevestigd in de lidstaat waar de belasting verschuldigd is of
      van wie geen inrichting op het grondgebied van die lidstaat bij het verrichten van de goederenlevering of de dienst
      is betrokken in de zin van artikel 192bis van de BTW-richtlijn 2006, en de tot de voldoening van de belasting
      gehouden persoon degene is voor wie de goederenlevering of dienst wordt verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel34c
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel34d
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 34c
        hoofdstuk: VI
        afdeling: '4'
  - number: 34e
    text: |-
      In afwijking van [artikel 34c, eerste lid][ref1], draagt een ondernemer die doorgaans levert aan andere
      ondernemers, er zorg voor dat een factuur wordt uitgereikt ter zake van al zijn leveringen. De vorige volzin is
      alleen van toepassing ten aanzien van ondernemers of groepen van ondernemers die daartoe bij ministeriële regeling
      zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel34c
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel34e
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 34c
        hoofdstuk: VI
        afdeling: '4'
  - number: 34f
    text: |-
      Ieder document of bericht dat wijzigingen aanbrengt in, en specifiek en ondubbelzinnig verwijst naar de
      oorspronkelijke factuur, geldt als factuur.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel34f
  - number: 34g
    text: |-
      De factuur wordt uitgereikt uiterlijk op de vijftiende dag van de maand volgende op die waarin
      de goederenlevering of de dienst is verricht. In geval van vooruitbetalingen als bedoeld in
      [artikel 34c, eerste lid, onderdelen d en e][ref1], moet de factuur telkens worden uitgereikt vóór het tijdstip van
      de opeisbaarheid daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel34c
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel34g
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 34c
        hoofdstuk: VI
        afdeling: '4'
  - number: '35.1'
    text: |-
      Voor verscheidene afzonderlijke leveringen of diensten kan een periodieke factuur worden opgemaakt, mits de periode
      waarop de factuur betrekking heeft niet langer is dan een kalendermaand.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel35
  - number: '35.2'
    text: |-
      Facturen mogen door de afnemer worden opgemaakt voor goederenleveringen of diensten die door een ondernemer voor
      hem worden verricht, indien beide partijen dat vooraf onderling zijn overeengekomen en op voorwaarde dat iedere
      factuur het voorwerp uitmaakt van een procedure van aanvaarding door de ondernemer die de goederenleveringen of de
      diensten verricht.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel35
  - number: 35a.1
    text: 'Op de factuur zijn de volgende vermeldingen verplicht:'
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel35a
  - number: 35a.1.a
    text: de datum van uitreiking van de factuur;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel35a
  - number: 35a.1.b
    text: een opeenvolgend nummer, met één of meer reeksen, waardoor de factuur eenduidig wordt geïdentificeerd;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel35a
  - number: 35a.1.c
    text: het btw-identificatienummer waaronder de ondernemer de goederenleveringen of de diensten heeft verricht;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel35a
  - number: 35a.1.d
    text: |-
      het btw-identificatienummer van de afnemer waaronder hij een goederenlevering of een dienst heeft afgenomen
      waarvoor hij tot voldoening van de belasting is gehouden of waaronder hij een goederenlevering als bedoeld in de
      bij deze wet behorende [tabel II, onderdeel a, post 6][ref1], heeft afgenomen;


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: 35a.1.e
    text: de volledige naam en het volledige adres van de ondernemer en zijn afnemer;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel35a
  - number: 35a.1.f
    text: de hoeveelheid en de aard van de geleverde goederen of de omvang en de aard van de verrichte diensten;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel35a
  - number: 35a.1.g
    text: |-
      de datum waarop de goederenlevering of de dienst heeft plaatsgevonden of voltooid is of de datum waarop de in
      [artikel 34c, eerste lid, onderdelen d en e][ref1], bedoelde vooruitbetaling is gedaan, voor zover die datum
      vastgesteld is en verschilt van de uitreikingsdatum van de factuur;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel34c
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 34c
        hoofdstuk: VI
        afdeling: '4'
  - number: 35a.1.h
    text: |-
      de vergoeding voor elk tarief of elke vrijstelling, de eenheidsprijs, belasting niet inbegrepen, evenals de
      eventuele vooruitbetalingskortingen, prijskortingen en -rabatten indien die niet in de eenheidsprijs zijn begrepen;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel35a
  - number: 35a.1.i
    text: het toegepast tarief van de belasting;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel35a
  - number: 35a.1.j
    text: |-
      het te betalen bedrag van de belasting, tenzij er een bijzondere regeling van toepassing is waarvoor deze wet die
      vermelding uitsluit;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel35a
  - number: 35a.1.k
    text: |-
      wanneer de afnemer die een prestatie afneemt de factuur uitreikt in plaats van degene die de prestatie verricht, de
      vermelding «factuur uitgereikt door afnemer»;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel35a
  - number: 35a.1.l
    text: |-
      in geval van een vrijstelling of van leveringen met toepassing van de bij deze wet behorende tabel II, onderdeel a,
      post 6, enige aanduiding daarvan;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel35a
  - number: 35a.1.m
    text: wanneer de afnemer tot voldoening van de belasting is gehouden, de vermelding «btw verlegd»;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel35a
  - number: 35a.1.n
    text: |-
      in geval van levering van een nieuw vervoermiddel onder de in tabel II, onderdeel a, post 6, bedoelde voorwaarden,
      de gegevens die nodig zijn om te bepalen of een vervoermiddel een nieuw vervoermiddel is;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel35a
  - number: 35a.1.o
    text: wanneer de bijzondere regeling voor reisbureaus wordt gehanteerd, de vermelding «bijzondere regeling reisbureaus»;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel35a
  - number: 35a.1.p
    text: |-
      wanneer een van de bijzondere regelingen voor gebruikte goederen, kunstvoorwerpen, voorwerpen voor verzamelingen
      of antiquiteiten wordt gehanteerd, de vermelding «bijzondere regeling – gebruikte goederen», «bijzondere regeling –
      kunstvoorwerpen», respectievelijk «bijzondere regeling – voorwerpen voor verzamelingen of antiquiteiten»;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel35a
  - number: 35a.1.q
    text: |-
      wanneer de belasting wordt voldaan door een fiscaal vertegenwoordiger als bedoeld in artikel 33g, het btw-
      identificatienummer van deze fiscaal vertegenwoordiger, samen met zijn volledige naam en adres.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel35a
  - number: 35a.2
    text: 'Op een vereenvoudigde factuur zijn de volgende vermeldingen verplicht:'
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel35a
  - number: 35a.2.a
    text: de datum van uitreiking van de factuur;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel35a
  - number: 35a.2.b
    text: de identiteit van de ondernemer die de goederenlevering of de dienst verricht;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel35a
  - number: 35a.2.c
    text: de aard van de geleverde goederen of de verrichte diensten;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel35a
  - number: 35a.2.d
    text: het te betalen bedrag van de belasting of de gegevens aan de hand waarvan dat bedrag kan worden berekend;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel35a
  - number: 35a.2.e
    text: |-
      wanneer de uitgereikte factuur een document of bericht is dat overeenkomstig [artikel 34f][ref1] als factuur
      geldt, een specifieke en ondubbelzinnige verwijzing naar de oorspronkelijke factuur, met specifieke vermelding van
      de aangebrachte wijzigingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel34f
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 34f
        hoofdstuk: VI
        afdeling: '4'
  - number: 35a.3
    text: |-
      Wanneer de factuur wordt uitgereikt door een ondernemer die niet gevestigd is in de lidstaat waar de belasting
      verschuldigd is of van wie geen inrichting in die lidstaat bij het verrichten van de goederenlevering of de
      dienst is betrokken in de zin van artikel 192bis van BTW-richtlijn 2006 en die goederenleveringen of diensten
      verricht voor een afnemer die tot voldoening van de belasting is gehouden, kan de ondernemer de in het eerste
      lid, onderdelen h, i en j, bedoelde vermeldingen weglaten en in plaats daarvan, door de hoeveelheid of de omvang
      alsook de aard van de geleverde goederen of verrichte diensten te specificeren, de vergoeding voor die goederen of
      diensten vermelden.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel35a
  - number: 35a.4
    text: |-
      Op een factuur kunnen bedragen in willekeurig welke munteenheid voorkomen, mits het te betalen of te herziene
      bedrag van de belasting is uitgedrukt in euro’s en daarbij gebruik wordt gemaakt van het in artikel 91 van de BTW-
      richtlijn 2006 bedoelde wisselkoersmechanisme.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel35a
  - number: 35a.5
    text: |-
      Wanneer zulks uit een oogpunt van controle nodig is, kan de inspecteur een vertaling in het Nederlands eisen van
      facturen betreffende in Nederland verrichte prestaties, alsmede van facturen die worden ontvangen door in Nederland
      gevestigde ondernemers.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel35a
  - number: 35a.6
    text: |-
      Bij ministeriële regeling kan voor bepaalde ondernemers of groepen van ondernemers ontheffing worden verleend van
      bepaalde verplichtingen die zijn opgelegd bij dit artikel wanneer de handels- of administratieve praktijken van
      de betrokken bedrijfssector of de technische voorwaarden waaronder die facturen worden uitgereikt, de naleving in
      sterke mate bemoeilijken van alle verplichtingen die zijn opgelegd bij dit artikel.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel35a
  - number: 35b.1
    text: Elektronische facturering wordt toegepast behoudens aanvaarding door de afnemer.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel35b
  - number: 35b.2
    text: |-
      De authenticiteit van de herkomst, de integriteit van de inhoud, en de leesbaarheid van de factuur, op papier
      of in elektronisch formaat, worden vanaf het tijdstip waarop de factuur wordt uitgereikt tot het einde van de
      bewaartermijn gewaarborgd. De ondernemer bepaalt zelf hoe de authenticiteit van de herkomst, de integriteit van
      de inhoud, en de leesbaarheid van de factuur worden gewaarborgd. Hiertoe kan gebruik worden gemaakt van elke
      bedrijfscontrole die een betrouwbaar controlespoor tussen een factuur en een verrichte prestatie oplevert.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel35b
  - number: 35b.3
    text: |-
      Voor de toepassing van deze afdeling en de daarop gebaseerde bepalingen wordt verstaan onder: - *authenticiteit
      van de herkomst:* de gewaarborgde identiteit van degene die de goederenlevering of de dienst heeft verricht of van
      degene die de factuur heeft uitgereikt;
        - *integriteit van de inhoud:* de krachtens deze wet voorgeschreven inhoud van de factuur die geen wijzigingen
      heeft ondergaan.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel35b
  - number: 35b.4
    text: |-
      De authenticiteit van de herkomst en de integriteit van de inhoud van een elektronische factuur kunnen, behalve
      door middel van de in het tweede lid bedoelde bedrijfscontroles, bijvoorbeeld ook met de volgende technologieën
      worden gewaarborgd:
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel35b
  - number: 35b.4.a
    text: |-
      een geavanceerde elektronische handtekening in de zin van artikel 2, lid 2, van Richtlijn 1999/93/EG van het
      Europees Parlement en de Raad van 13 december 1999 betreffende een gemeenschappelijk kader voor elektronische
      handtekeningen, welke gebaseerd is op een gekwalificeerd certificaat in de zin van artikel 2, lid 10, van Richtlijn
      1999/93/EG en gecreëerd wordt met een veilig middel voor het aanmaken van handtekeningen in de zin van artikel 2,
      leden 6 en 10, van Richtlijn 1999/93/EG;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel35b
  - number: 35b.4.b
    text: |-
      elektronische uitwisseling van gegevens (Electronic Data Interchange – EDI), zoals gedefinieerd in artikel 2 van
      bijlage 1 bij Aanbeveling 1994/820/EG van de Commissie van 19 oktober 1994 betreffende de juridische aspecten
      van de elektronische uitwisseling van gegevens, indien het akkoord betreffende deze uitwisseling voorziet in het
      gebruik van procedures die de authenticiteit van de herkomst en de integriteit van de gegevens waarborgen.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel35b
  - number: 35b.5
    text: |-
      Bij een reeks elektronische facturen die aan dezelfde afnemer worden verzonden of ter beschikking worden gesteld,
      hoeven de voor de verschillende facturen gelijke vermeldingen slechts één keer te worden opgenomen, voorzover voor
      elke factuur alle informatie toegankelijk is.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel35b
  - number: 35c.1
    text: |-
      De ondernemer bewaart kopieën van de door hemzelf dan wel, in zijn naam en voor zijn rekening, door zijn afnemer of
      een derde uitgereikte facturen, en alle door hemzelf ontvangen facturen in zijn administratie.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel35c
  - number: 35c.2
    text: |-
      Wanneer een ondernemer de door hem verzonden of ontvangen facturen elektronisch bewaart, waarbij een online toegang
      tot de gegevens wordt gewaarborgd, heeft de inspecteur met het oog op de toepassing van deze wet het recht de
      facturen ter controle in te zien, te downloaden en te gebruiken, indien de ondernemer is gevestigd in Nederland,
      dan wel de ondernemer de belasting in Nederland verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel35c
  - number: 35c.3
    text: |-
      Ingeval facturen elektronisch worden opgeslagen, worden de gegevens die de authenticiteit van de herkomst en de
      integriteit van de inhoud waarborgen, eveneens opgeslagen.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel35c
  - number: 35d
    text: |-
      In deze wet wordt verstaan onder «elektronische factuur», een factuur die de bij of krachtens deze wet
      voorgeschreven gegevens bevat, welke in elektronisch formaat is verstrekt en ontvangen.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel35d
  - number: '36'
    text: |-
      De [artikelen 25, derde lid][ref1], en [27e, van de Algemene wet inzake rijksbelastingen][ref2] vinden
      overeenkomstige toepassing, ingeval niet volledig is voldaan aan de verplichtingen welke zijn opgelegd bij of
      krachtens de [artikelen 28n][ref3], [34 tot en met 35c][ref4] en [39][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel28n
      [ref4]: https://wetten.overheid.nl/BWBR0002629#Artikel34
      [ref5]: https://wetten.overheid.nl/BWBR0002629#Artikel39
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '27'
      - id: ref3
        bwb_id: BWBR0002629
        artikel: 28n
        hoofdstuk: V
        afdeling: '6'
      - id: ref4
        bwb_id: BWBR0002629
        artikel: '34'
        hoofdstuk: VI
        afdeling: '4'
      - id: ref5
        bwb_id: BWBR0002629
        artikel: '39'
        hoofdstuk: VI
        afdeling: '5'
  - number: '37'
    text: |-
      Hij die op een factuur op enigerlei wijze melding maakt van omzetbelasting welke hij, anders dan op grond van dit
      artikel, niet verschuldigd is geworden, wordt die belasting verschuldigd op het tijdstip waarop hij die factuur
      heeft uitgereikt; hij is gehouden deze belasting op de voet van [artikel 14][ref1] te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel14
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '14'
        hoofdstuk: II
        afdeling: '4'
  - number: 37a.1
    text: |-
      De ondernemer, uitgezonderd die bedoeld in het [artikel 7, zesde lid][ref1], is verplicht uiterlijk de laatste dag
      van de maand volgend op een kalendermaand bij de inspecteur op de daartoe opengestelde wijze een formulier langs
      elektronische weg in te dienen met een lijst voor dat tijdvak waarop zijn vermeld de afnemers:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel7
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '7'
        hoofdstuk: II
        afdeling: 1c
  - number: 37a.1.a
    text: |-
      aan wie goederen zijn geleverd met toepassing van de bij deze wet behorende [Tabel II][ref1], onderdeel a, post 6;


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: 37a.1.b
    text: |-
      aan wie in een andere lidstaat goederen zijn geleverd in aansluiting op de ingevolge
      [artikel 17b, derde lid][ref1], in die lidstaat door de ondernemer verrichte intracommunautaire verwervingen;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel17b
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 17b
        hoofdstuk: IIA
        afdeling: '1'
  - number: 37a.1.c
    text: |-
      voor wie hij diensten heeft verricht die met toepassing van artikel 6, eerste lid, niet belastbaar zijn in
      Nederland en waarover de belasting ingevolge artikel 196 van BTW-richtlijn 2006 in de lidstaat van de afnemer wordt
      geheven van de afnemer, tenzij het verrichten van die dienst in die lidstaat is vrijgesteld.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel37a
  - number: 37a.2
    text: In de lijst wordt opgave verlangd van de gegevens, bedoeld in de artikelen 264 en 265 van de BTW-richtlijn 2006.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel37a
  - number: 37a.3
    text: |-
      In afwijking in zoverre van het eerste lid geldt als tijdvak in plaats van een kalendermaand naar keus van de
      ondernemer een kalenderkwartaal indien het totaalbedrag van de in het eerste lid, onderdelen a en b genoemde
      leveringen noch voor het desbetreffende kalenderkwartaal, noch in één van de vier daaraan voorafgaande
      kalenderkwartalen, hoger is dan het daartoe bij ministeriële regeling vastgestelde bedrag. Deze afwijking geldt
      niet meer vanaf het einde van de maand waarin dit bedrag wordt overschreden, in welk geval uiterlijk de volgende
      maand een lijst moet worden opgesteld en ingediend voor alle maanden die sinds de aanvang van dat kwartaal zijn
      verlopen.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel37a
  - number: 37a.4
    text: |-
      In afwijking in zoverre van het eerste lid geldt naar keus van de ondernemer als tijdvak een kalenderkwartaal
      indien de ondernemer de onder het eerste lid onderdeel c genoemde diensten verricht.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel37a
  - number: 37a.5
    text: |-
      Indien voor het doen van aangifte voor de omzetbelasting ontheffing is verleend van de verplichting aangifte langs
      elektronische weg te doen, geldt deze ontheffing mede ten aanzien van de verplichting de lijst langs elektronische
      weg in te dienen. In dit geval wordt de lijst ingediend bij de inspecteur door middel van het uitgereikte of
      toegezonden formulier.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel37a
  - number: 37a.6
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld inzake het indienen van de in dit artikel bedoelde
      gegevens.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel37a
  - number: 37b
    text: |-
      Degene die ter zake van de intracommunautaire verwerving van goederen valt onder de toepassing van
      [artikel 1a, tweede lid][ref1], wordt niettemin de belasting verschuldigd ter zake van die intracommunautaire
      verwerving wanneer in de lidstaat waar de goederen worden geleverd, belastingheffing plaatsvindt alsof
      [artikel 1, aanhef en onderdeel b][ref2], van toepassing zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel1
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel37b
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 1a
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '1'
        hoofdstuk: I
  - number: 37c
    text: |-
      In afwijking van [artikel 1, aanhef en onderdelen b en c][ref1], wordt ter zake van intracommunautaire verwervingen
      van goederen die op grond van [artikel 17b, eerste lid][ref2], in Nederland worden verricht geen belasting geheven,
      voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel17b
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel37c
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 17b
        hoofdstuk: IIA
        afdeling: '1'
  - number: 37c.a
    text: |-
      de goederen zijn verworven door een ondernemer die niet in Nederland woont of is gevestigd en aldaar geen vaste
      inrichting heeft en aan wie een btw-identificatienummer is toegekend in een andere lidstaat;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel37c
  - number: 37c.b
    text: |-
      de goederen door deze ondernemer in Nederland worden geleverd aan een ondernemer die in Nederland woont of is
      gevestigd dan wel aldaar een vaste inrichting heeft, of aan een in Nederland gevestigd lichaam in de zin van de
      [Algemene wet inzake rijksbelastingen][ref1], en aan welke afnemer in Nederland een btw-identificatienummer is
      toegekend; en


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel37c
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: 37c.c
    text: |-
      de goederen rechtstreeks naar de in onderdeel *b* bedoelde afnemer worden verzonden of vervoerd vanuit een lidstaat
      die niet een btw-identificatienummer heeft toegekend aan de in onderdeel *a* bedoelde ondernemer.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel37c
  - number: 37d
    text: |-
      Bij overgang van het geheel of een gedeelte van een algemeenheid van goederen, al dan niet tegen vergoeding of
      in de vorm van een inbreng in een vennootschap, wordt geacht dat geen leveringen of diensten plaatsvinden en
      treedt, tenzij bij ministeriële regeling anders is bepaald, degene op wie de goederen overgaan in de plaats van
      de overdrager.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel37d
  - number: 37e
    text: |-
      De ondernemer die in Nederland woont of is gevestigd, wordt geacht zijn leveringen en diensten in Nederland
      te verrichten, voor zover hij niet aan de hand van boeken, bescheiden of andere gegevensdragers het tegendeel
      aantoont. Deze bepaling is eveneens van toepassing op de ondernemer die in Nederland een vaste inrichting heeft,
      voor zover de leveringen en diensten vanuit die inrichting worden verricht.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel37e
  - number: '38'
    text: |-
      Het is de ondernemer verboden aan anderen dan ondernemers en publiekrechtelijke lichamen goederen en diensten aan
      te bieden tegen prijzen met zodanige aanduidingen dat de omzetbelasting niet in de prijzen zou zijn begrepen.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel38
  - number: '39'
    text: 'Bij algemene maatregel van bestuur kunnen:'
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel39
  - number: 39.a
    text: nadere regels worden gesteld welke tot vergemakkelijking van de heffing van belasting kunnen leiden;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel39
  - number: 39.b
    text: |-
      andere in het kader van de wet passende nadere regels worden gesteld ter aanvulling van in de wet geregelde
      onderwerpen.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel39
  - number: '40.1'
    text: |-
      Indien de ondernemer de in [artikel 28s, eerste lid][ref1], bedoelde melding telecommunicatiediensten,
      omroepdiensten of elektronische diensten of de in [artikel 37a][ref2] bedoelde lijst niet of niet tijdig heeft
      ingediend, dan wel een onvolledige of een onjuiste lijst of melding telecommunicatiediensten, omroepdiensten of
      elektronische diensten heeft ingediend, vormt dat een verzuim ter zake waarvan de inspecteur hem een bestuurlijke
      boete van ten hoogste € 5.278 kan opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel28s
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel37a
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 28s
        hoofdstuk: V
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 37a
        hoofdstuk: VI
        afdeling: '4'
  - number: '40.2'
    text: |-
      De bevoegdheid tot het opleggen van de in het eerste lid bedoelde boete vervalt, in afwijking van
      [artikel 5:45, tweede lid, van de Algemene wet bestuursrecht][ref1], door het verloop van vijf jaren na het einde
      van het kalenderjaar waarin de in [artikel 28s, eerste lid][ref2], of [artikel 37a, eerste lid][ref3], genoemde
      verplichting is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel28s
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel37a
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: 28s
        hoofdstuk: V
        afdeling: '7'
      - id: ref3
        bwb_id: BWBR0002629
        artikel: 37a
        hoofdstuk: VI
        afdeling: '4'
  - number: '40.3'
    text: |-
      [Artikel 67cb van de Algemene wet inzake rijksbelastingen][ref1] is van overeenkomstige toepassing op het bedrag
      van de boete, genoemd in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67cb
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 67cb
  - number: '42'
    text: |-
      Hij die het in [artikel 38][ref1] vervatte verbod overtreedt, wordt gestraft met een geldboete van de derde
      categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel38
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '38'
        hoofdstuk: VI
        afdeling: '5'
  - number: '43.1'
    text: |-
      Aan een ondernemer die bij de aanvang van 1 januari 1969 goederen, anders dan als bedrijfsmiddel, in ongebruikte
      staat hier te lande in voorraad heeft, wordt teruggaaf verleend van de omzetbelasting - andere dan bedoeld in
      artikel I, eerste lid, van de wet van 13 december 1967 (*Stb*. 614) - voldaan voor die goederen en voor de bij de
      voortbrenging van die goederen verbruikte grondstoffen en hulpstoffen. De teruggaaf omvat mede de omzetbelasting
      voldaan voor de bij de voortbrenging van de in voorraad zijnde goederen gebezigde bedrijfsmiddelen en diensten,
      indien de ondernemer de goederen, ongebruikt en in de staat waarin zij zich bij de aanvang van 1 januari 1969
      bevinden, in dat jaar uitvoert. Het recht op teruggaaf dient te kunnen worden aangetoond aan de hand van boeken
      en bescheiden.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel43
  - number: '43.2'
    text: |-
      Onze Minister geeft omtrent de teruggaaf nadere regelen, waarbij zij naar algemene maatstaven kan worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel43
  - number: '43.3'
    text: |-
      De teruggaaf wordt slechts verleend, voor zover de ondernemer bij levering aan hem van de goederen na 31 december
      1968 de ter zake in rekening gebrachte belasting op de voet van [artikel 15][ref1] in aftrek zou kunnen brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '15'
        hoofdstuk: II
        afdeling: '4'
  - number: '43.4'
    text: 'De aanspraak op teruggaaf ontstaat:'
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel43
  - number: 43.4.a
    text: |-
      ingeval de gehele teruggaaf niet meer bedraagt dan f 1500, telkens voor een vierde gedeelte aan het einde van het
      tweede, derde en vierde kwartaal van het jaar 1969 en het eerste kwartaal van het jaar 1970;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel43
  - number: 43.4.b
    text: |-
      ingeval de gehele teruggaaf meer bedraagt dan f 1500, telkens voor een vierde gedeelte aan het einde van het
      tweede, derde en vierde kwartaal van het jaar 1969 en het vierde kwartaal van het jaar 1970.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel43
  - number: '43.5'
    text: |-
      De aanspraak op teruggaaf ter zake van de uitvoer van de goederen ontstaat echter aan het einde van het kwartaal
      waarin de uitvoer plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel43
  - number: '43.6'
    text: |-
      De omzetbelasting, waarvan de teruggaaf op grond van het vierde lid, letter *b*, plaatsvindt na het einde van het
      vierde kwartaal van het jaar 1970, wordt met 6 percent verhoogd als vergoeding voor renteverlies.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel43
  - number: '43.7'
    text: |-
      Tegen een ingevolge [artikel 25 van de Algemene wet inzake rijksbelastingen][ref1] gedane uitspraak
      van de inspecteur betreffende de toepassing van de vorige leden staat, in afwijking in zoverre van
      [artikel 26, eerste lid][ref2], van genoemde wet, uitsluitend beroep open bij de Tariefcommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel26
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '26'
        hoofdstuk: V
        afdeling: '2'
  - number: '44.1'
    text: |-
      Ter zake van de invoer in 1969 van vóór 1 januari 1969 in Nederland gebrachte goederen, wordt een bijzondere
      verbruiksbelasting geheven tot het bedrag, dat bij invoer in 1968 verschuldigd zou zijn geweest uit hoofde van
      artikel I, eerste lid, van de wet van 13 december 1967 (*Stb*. 614).
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel44
  - number: '44.2'
    text: |-
      De Algemene wet inzake de douane en de accijnzen is van toepassing als ware de in het eerste lid bedoelde belasting
      invoerrecht.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel44
  - number: '45.1'
    text: |-
      Met afwijking in zoverre van de [artikelen 2][ref1] en [15][ref2] is, met betrekking tot goederen welke zijn
      bestemd om door de ondernemer als bedrijfsmiddel te worden gebruikt, aftrek slechts toegestaan van:


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '15'
        hoofdstuk: II
        afdeling: '4'
  - number: 45.1.a
    text: 30 percent van de belasting, ingeval de levering of de invoer plaatsvindt in 1969 of 1970;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel45
  - number: 45.1.b
    text: 60 percent van de belasting, ingeval de levering of de invoer plaatsvindt in 1971;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel45
  - number: 45.1.c
    text: 67 percent van de belasting, ingeval de levering of de invoer plaatsvindt in 1972.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel45
  - number: '45.2'
    text: 'Het eerste lid vindt geen toepassing ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel45
  - number: 45.2.a
    text: schepen, met uitzondering van woonschepen en van pleziervaartuigen;
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel45
  - number: 45.2.b
    text: |-
      machines en toestellen voor het vervaardigen en in het fabricageproces bewerken of afwerken van produkten in de
      textielindustrie (met uitzondering van machines en toestellen voor het spinnen van synthetische of kunstmatige
      textielstoffen en met uitzondering van spindoppen) en de voor of bij deze machines en toestellen gebezigde meet-,
      controle-, regel- en andere hulpapparatuur, alsmede de gebouwen waarin die goederen worden gebezigd.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel45
  - number: '45.3'
    text: |-
      In gevallen waarin het eerste lid ten aanzien van een bedrijfsmiddel toepassing heeft gevonden en de ondernemer
      dat bedrijfsmiddel vervolgens levert, wordt onder door Onze Minister te stellen voorwaarden aan die ondernemer
      teruggaaf verleend van 70, onderscheidenlijk 40 of 33 percent van de ter zake van die levering verschuldigde
      belasting naar gelang deze plaatsvindt in de jaren 1969 of 1970, dan wel 1971 of 1972.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel45
  - number: '45.4'
    text: |-
      Onze Minister kan de in het eerste lid genoemde percentages, met ingang van een door hem te bepalen tijdstip, in
      het algemeen of voor bepaalde groepen van bedrijfsmiddelen verhogen en de in het derde lid genoemde percentages
      daarbij aanpassen.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel45
  - number: '45.5'
    text: |-
      Na het tot stand komen van een ministeriële regeling, door Onze Minister krachtens het vierde lid genomen, wordt
      zo spoedig mogelijk, doch uiterlijk binnen twee maanden, een voorstel van wet tot goedkeuring van die ministeriële
      regeling aan de Tweede Kamer der Staten-Generaal gezonden. Indien het voorstel wordt ingetrokken of indien een
      van de Kamers der Staten-Generaal tot het niet-aannemen van het voorstel besluit, wordt de ministeriële regeling
      onverwijld ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel45
  - number: '45.6'
    text: |-
      Onze Minister kan met ingang van een door hem te bepalen tijdstip het eerste lid buiten toepassing verklaren ten
      aanzien van machines en toestellen voor het vervaardigen van schoeisel en voor of bij deze machines en toestellen
      gebezigde meet-, controle-, regel- en andere hulpapparatuur, alsmede gebouwen waarin die goederen worden gebezigd.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel45
  - number: '46'
    text: |-
      Gedurende de jaren 1969 tot en met 1979 bedraagt de belasting ter zake van leveringen en invoer van dagbladen en
      nieuwsbladen (niet dagelijks verschijnende kranten), krachtens abonnement, in afwijking van de [artikelen 9][ref1]
      en [20][ref2], nihil.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel20
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '9'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '20'
        hoofdstuk: III
        afdeling: '2'
  - number: '47'
    text: |-
      Met betrekking tot de in [artikel 4, tweede lid, onderdeel a][ref1], bedoelde handelingen blijft de heffing van
      belasting achterwege indien, met het oog op die handelingen, de voorbelasting ter zake van het in dat onderdeel
      bedoelde goed vóór de inwerkingtreding van die bepaling niet in aftrek is gebracht ingevolge het bepaalde in
      [artikel 15][ref2] dan wel geheel of gedeeltelijk is uitgesloten ingevolge het bepaalde in [artikel 16][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel16
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '4'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '15'
        hoofdstuk: II
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0002629
        artikel: '16'
        hoofdstuk: II
        afdeling: '4'
  - number: '52'
    text: |-
      Hij die ingevolge een vóór de inwerkingtreding van een wijziging in de wetgeving inzake omzetbelasting gesloten
      overeenkomst verplicht is goederen te leveren of een dienst te verlenen, is bevoegd hetgeen met betrekking tot die
      goederen of die dienst wegens omzetbelasting meer is gevorderd dan vóór de inwerkingtreding van die wijziging had
      kunnen geschieden, terug te vorderen van degene aan wie hij de goederen moet leveren of de dienst moet verlenen.
      Hiermede strijdige bedingen zijn nietig.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel52
  - number: '53'
    text: |-
      Hij aan wie ingevolge een vóór de inwerkingtreding van een wijziging in de wetgeving inzake omzetbelasting gesloten
      overeenkomst goederen worden geleverd of een dienst wordt verleend, is bevoegd van hem die verplicht is de goederen
      te leveren of de dienst te verlenen, terug te vorderen hetgeen met betrekking tot die goederen of dienst wegens
      omzetbelasting minder is gevorderd dan vóór de inwerkingtreding van die wijziging had kunnen geschieden. Hiermede
      strijdige bedingen zijn nietig.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel53
  - number: '54.1'
    text: |-
      De Wet op de Omzetbelasting 1954 en de wet van 29 december 1966 (*Stb*. 592) vervallen, behalve ten aanzien van
      reeds verrichte leveringen en diensten en begane strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel54
  - number: '54.2'
    text: Onze Minister is bevoegd nadere bepalingen ter zake van de overgang vast te stellen.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel54
  - number: '55.1'
    text: Deze wet treedt in werking met ingang van 1 januari 1969.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel55
  - number: '55.2'
    text: Zij kan worden aangehaald als 'Wet op de omzetbelasting 1968'.
    url: https://wetten.overheid.nl/BWBR0002629/2016-05-01#Artikel55
