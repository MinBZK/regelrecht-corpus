  - number: 121.a
    text: |-
      in [artikel Ya 11, eerste lid][ref1], in plaats van «[artikel N 12, eerste lid][ref2]» wordt gelezen «artikel 70»,
      in plaats van «vastgestelde aantallen stemmen» wordt gelezen «vastgestelde aantallen stemmen en kiesgerechtigden»
      en in plaats van «totdat het centraal stembureau de uitslag van de verkiezing heeft bekendgemaakt en over de
      toelating van de gekozenen is beslist» wordt gelezen: totdat de uitslag van het referendum onherroepelijk is
      vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0004627
      [ref2]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel121
