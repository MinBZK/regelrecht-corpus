    text: |-
      in [artikel J 11, eerste lid][ref1], in plaats van «het orgaan waarvoor de verkiezing wordt gehouden» wordt
      gelezen: het referendum;


      [ref1]: https://wetten.overheid.nl/BWBR0004627
