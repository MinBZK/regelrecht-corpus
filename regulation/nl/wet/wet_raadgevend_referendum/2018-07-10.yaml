  - number: '123'
    text: |-
      Onze Minister zendt binnen drie jaar na de inwerkingtreding van deze wet, en vervolgens telkens na vier jaar, aan
      de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel123
  - number: '124.1'
    text: |-
      Binnen vier weken na de inwerkingtreding van deze wet wordt een voornemen als bedoeld in
      [artikel 87, vierde lid][ref1], aan de beide kamers der Staten-Generaal meegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel87
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '87'
        hoofdstuk: '11'
  - number: '124.2'
    text: |-
      Deze wet is niet van toepassing op wetten die zijn bekrachtigd en verdragen die stilzwijgend zijn goedgekeurd voor
      de inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel124
  - number: '128.1'
    text: |-
      Deze wet treedt in werking met ingang van de eerste dag van de vierde kalendermaand na de datum van uitgifte
      van het Staatsblad waarin zij wordt geplaatst en vervalt op het tijdstip waarop de wet of wetten ter uitvoering
      van de in het voorstel tot verandering in de [Grondwet][ref1], strekkende tot opneming van bepalingen inzake het
      correctief referendum, ingevoegde [paragraaf 1A van hoofdstuk 5 van de Grondwet](onbekend) in werking treedt of
      treden.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '128.2'
    text: |-
      Ten aanzien van wetten waarvoor op het tijdstip van het vervallen van deze wet de termijn voor het indienen van
      een inleidend verzoek tot het houden van een referendum is ingegaan, blijft het bepaalde in deze wet ook na dat
      tijdstip van kracht.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel128
  - number: '129'
    text: 'Deze wet wordt aangehaald als: Wet raadgevend referendum.'
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel129
