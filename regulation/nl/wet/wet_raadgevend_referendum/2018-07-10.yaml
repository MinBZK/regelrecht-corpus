      in [artikel J 24, eerste lid][ref1], in plaats van «de verkiezing» wordt gelezen: het referendum;


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: 59.e
    text: |-
      in [artikel J 26, eerste lid][ref1], in plaats van «de kandidaat van zijn keuze» wordt gelezen: zijn keuze inzake
      de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: '60.1'
    text: |-
      Met toepassing van [hoofdstuk K van de Kieswet][ref1] kan gestemd worden met een kiezerspas.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#HoofdstukK
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0004627
        hoofdstuk: K
  - number: '60.2'
    text: |-
      Bij de toepassing van [hoofdstuk K van de Kieswet][ref1] wordt het volgende in acht genomen:


      [ref1]: https://wetten.overheid.nl/BWBR0004627#HoofdstukK
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0004627
        hoofdstuk: K
  - number: 60.2.a
    text: |-
      in [artikel K 1][ref1] blijft de zinsnede «binnen het gebied van het orgaan waarvoor de verkiezing wordt gehouden,»
      en het tweede lid buiten toepassing;


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: 60.2.b
    text: |-
      in de [artikelen K 3, eerste en tweede lid][ref1], [K 6, tweede lid][ref2], en [K 8, tweede lid][ref3], in plaats
      van «dag van de kandidaatstelling» wordt gelezen: vierenveertigste dag voor de dag van stemming.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
      [ref2]: https://wetten.overheid.nl/BWBR0004627
      [ref3]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0004627
      - id: ref2
        bwb_id: BWBR0004627
      - id: ref3
        bwb_id: BWBR0004627
  - number: '61'
    text: |-
      Met toepassing van [hoofdstuk L van de Kieswet][ref1] kan bij volmacht worden gestemd, met dien verstande dat in
      de [artikelen L 7, tweede lid][ref2], [L 8, eerste en tweede lid][ref3], en [L 11, eerste lid][ref4], in plaats van
      «dag van de kandidaatstelling» wordt gelezen: vierenveertigste dag voor de dag van stemming.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#HoofdstukL
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelL_7
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelL_8
      [ref4]: https://wetten.overheid.nl/BWBR0004627#ArtikelL_11
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0004627
        hoofdstuk: L
      - id: ref2
        bwb_id: BWBR0004627
        artikel: L_7
      - id: ref3
        bwb_id: BWBR0004627
        artikel: L_8
      - id: ref4
        bwb_id: BWBR0004627
        artikel: L_11
  - number: '62.1'
    text: |-
      Met toepassing van [hoofdstuk M van de Kieswet][ref1] kan bij een referendum door een kiezer die op de
      vierenveertigste dag voor de dag van stemming zijn werkelijke woonplaats buiten Nederland heeft of op de dag van de
      stemming buiten Nederland verblijft, per brief worden gestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#HoofdstukM
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0004627
        hoofdstuk: M
  - number: '62.2'
    text: |-
      Bij de toepassing van [hoofdstuk M van de Kieswet][ref1] wordt het volgende in acht genomen:


      [ref1]: https://wetten.overheid.nl/BWBR0004627#HoofdstukM
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0004627
        hoofdstuk: M
  - number: 62.2.a
    text: |-
      in [artikel M 7, eerste lid][ref1], wordt in plaats van «de kandidaat van zijn keuze» gelezen: zijn keuze inzake de
      aan het referendum onderworpen wet;


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_7
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: M_7
  - number: 62.2.b
    text: |-
      in [artikel M 7, tweede lid][ref1], wordt gelezen: Daarna vouwt hij het stembiljet dicht en doet hij het stembiljet
      in de enveloppe voor het stembiljet.;


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_7
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: M_7
  - number: 62.2.c
    text: |-
      in de [artikelen M 7, vierde lid, tweede volzin][ref1], en [M 10, eerste lid, tweede volzin][ref2], wordt in plaats
      van «dag van de kandidaatstelling» gelezen: vierenveertigste dag voor de dag van stemming;


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_7
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_7
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: M_7
      - id: ref2
        bwb_id: BWBR0004627
        artikel: M_7
  - number: 62.2.d
    text: |-
      [artikel M 7, vierde lid, derde volzin][ref1], is niet van toepassing;


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_7
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: M_7
  - number: 62.2.e
    text: |-
      in [artikel M 8, vierde lid][ref1], wordt in plaats van «nadat over de toelating van de gekozenen is beslist»
      gelezen: nadat de uitslag van het referendum is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_8
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: M_8
  - number: '62.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven met het oog op de combinatie
      van stemmingen voor kiezers die per brief stemmen.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel62
  - number: '63.1'
    text: Onmiddellijk nadat de stemming is geëindigd, vindt de stemopneming plaats.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel63
  - number: '63.2'
    text: |-
      De [artikelen N 1 tot en met N 5 van de Kieswet][ref1] zijn van toepassing, met dien verstande dat in
      [artikel N 5][ref2] de woorden «en voegen deze lijstgewijze bijeen» buiten toepassing blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
      [ref2]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0004627
      - id: ref2
        bwb_id: BWBR0004627
  - number: '64.1'
    text: 'Het stembureau stelt vast:'
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel64
  - number: 64.1.a
    text: het aantal stemmen dat voor de aan het referendum onderworpen wet is uitgebracht;
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel64
  - number: 64.1.b
    text: het aantal stemmen dat tegen de aan het referendum onderworpen wet is uitgebracht;
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel64
  - number: 64.1.c
    text: het aantal blanco stemmen;
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel64
  - number: 64.1.d
    text: de som van de onder a, b en c bedoelde aantallen stemmen, zijnde het aantal geldig uitgebrachte stemmen;
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel64
  - number: 64.1.e
    text: het aantal ongeldige stemmen.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel64
  - number: '64.2'
    text: |-
      De [artikelen N 6, derde lid][ref1], en [N 7 tot en met N 8a van de Kieswet][ref2] zijn van toepassing, met dien
      verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0004627
      [ref2]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0004627
      - id: ref2
        bwb_id: BWBR0004627
  - number: 64.2.a
    text: |-
      in [artikel N 6, derde lid][ref1], in plaats van «op kandidaten» gelezen wordt: voor en tegen de aan het referendum
      onderworpen wet;


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: 64.2.b
    text: |-
      in [artikel N 7, derde lid][ref1], in plaats van «op welke kandidaat hij zijn stem uitbrengt» gelezen wordt: welke
      keuze hij doet.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: '65.1'
    text: |-
      Terstond nadat de stemmen zijn opgenomen, maakt de voorzitter de in [artikel 64][ref1] bedoelde aantallen stemmen
      bekend. Door de aanwezige kiezers kunnen mondeling bezwaren worden ingebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel64
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '64'
        hoofdstuk: '9'
  - number: '65.2'
    text: |-
      [Artikel N 9, tweede, derde en vierde lid, van de Kieswet][ref1] is van toepassing, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: 65.2.a
    text: |-
      in [artikel N 9, derde lid][ref1], in plaats van «lijstgewijs gerangschikt» gelezen wordt: verdeeld in stemmen voor
      en stemmen tegen de wet;


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: 65.2.b
    text: |-
      [artikel N 9, vierde lid, onder b][ref1], gelezen wordt: het aantal stembiljetten dat het pak bevat.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: '66'
    text: |-
      De [artikelen N 10][ref1] en [N 11, eerste lid, van de Kieswet][ref2] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
      [ref2]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0004627
      - id: ref2
        bwb_id: BWBR0004627
  - number: '67.1'
    text: |-
      Nadat de burgemeester van alle in zijn gemeente gevestigde stembureaus het proces-verbaal van de stemming en de
      stemopneming heeft ontvangen, stelt hij voor zijn gemeente de totalen van de in [artikel 64, eerste lid][ref1],
      bedoelde aantallen stemmen, het aantal stemmen dat bij volmacht is uitgebracht en het verschil tussen het aantal
      kiezers dat tot de stemming is toegelaten en het aantal stemmen dat is geteld vast. Voor zover mogelijk geeft
      de burgemeester een verklaring voor het in de vorige volzin bedoelde verschil. Tevens stelt hij op basis van de
      registratie, bedoeld in [artikel 20][ref2], het aantal kiesgerechtigden in de gemeente vast.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0036443#Artikel20
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '64'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0036443
        artikel: '20'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '67.2'
    text: |-
      De burgemeester van ’s-Gravenhage maakt bij de vaststelling van de in [artikel 64][ref1] bedoelde aantallen apart
      melding van het aantal stemmen dat in de briefstembureaus is uitgebracht. Tevens maakt hij apart melding van het
      aantal geregistreerde kiesgerechtigde personen met een woonplaats buiten Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel64
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '64'
        hoofdstuk: '9'
  - number: '67.3'
    text: |-
      Voor de in het eerste lid bedoelde vaststelling wordt gebruik gemaakt van een formulier waarvoor bij ministeriële
      regeling een model wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel67
  - number: '68'
    text: |-
      De burgemeester draagt er zorg voor dat de processen-verbaal, met daarbij gevoegd de opgaven van de door hem
      vastgestelde aantallen stemmen en kiesgerechtigden onverwijld worden overgebracht naar de voorzitter van het
      hoofdstembureau. Tevens legt hij een afschrift van deze stukken onverwijld voor een ieder ter inzage op het
      gemeentehuis totdat de uitslag van het referendum is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel68
  - number: '69'
    text: |-
      De [artikelen N 12, tweede, derde en vierde lid][ref1], en [N 13 tot en met N 21 van de Kieswet][ref2] zijn van
      toepassing, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0004627
      [ref2]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0004627
      - id: ref2
        bwb_id: BWBR0004627
  - number: 69.a
    text: |-
      in de aanhef van [artikel N 12, derde lid][ref1], in plaats van «nadat over de toelating van de gekozenen is
      beslist» gelezen wordt: nadat de uitslag van het referendum is vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: 69.b
    text: |-
      in [artikel N 12, derde lid, onderdeel b][ref1], in plaats van «een strafbaar gestelde gedraging
      in de [Kieswet][ref2], de [artikelen 125 tot en met 129 van het Wetboek van Strafrecht][ref3] of de
      [artikelen 131 tot en met 135 van het Wetboek van Strafrecht BES][ref4]» gelezen wordt: een in deze wet strafbaar
      gestelde gedraging;


      [ref1]: https://wetten.overheid.nl/BWBR0004627
      [ref2]: https://wetten.overheid.nl/BWBR0004627
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel125
      [ref4]: https://wetten.overheid.nl/BWBR0028570#Artikel131
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0004627
      - id: ref2
        bwb_id: BWBR0004627
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '125'
      - id: ref4
        bwb_id: BWBR0028570
        artikel: '131'
  - number: 69.c
    text: |-
      in [artikel N 13][ref1] in plaats van «Nadat is beslist over de toelating van de gekozenen» gelezen
      wordt «Nadat de uitslag van het referendum is vastgesteld» en in plaats van «de afschriften, bedoeld in
      [artikel N 12, eerste lid][ref2]» gelezen wordt: de afschriften, bedoeld in [artikel 68][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004627
      [ref2]: https://wetten.overheid.nl/BWBR0004627
      [ref3]: https://wetten.overheid.nl/BWBR0036443#Artikel68
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0004627
      - id: ref2
        bwb_id: BWBR0004627
      - id: ref3
        bwb_id: BWBR0036443
        artikel: '68'
        hoofdstuk: '9'
  - number: '71.1'
    text: Het hoofdstembureau houdt op de tweede dag na de stemming om tien uur een openbare zitting.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel71
  - number: '71.2'
    text: De voorzitter is belast met de handhaving van de orde tijdens de zitting.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel71
  - number: '72.1'
    text: |-
      Het hoofdstembureau stelt de totalen van de in [artikel 64, eerste lid][ref1], bedoelde aantallen stemmen, het
      aantal stemmen dat bij volmacht is uitgebracht, het aantal kiesgerechtigden en het verschil tussen het aantal
      kiezers dat tot de stemming is toegelaten en het aantal stemmen dat is geteld vast. Voor zover mogelijk geeft het
      hoofdstembureau een verklaring voor het in de vorige volzin bedoelde verschil.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel64
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '64'
        hoofdstuk: '9'
  - number: '72.2'
    text: De voorzitter maakt de aldus verkregen uitkomsten bekend.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel72
  - number: '72.3'
    text: Door de aanwezige kiezers kunnen mondeling bezwaren worden ingebracht.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel72
  - number: '73.1'
    text: |-
      Nadat alle werkzaamheden zijn beëindigd, wordt daarvan onmiddellijk proces-verbaal opgemaakt. Alle ingebrachte
      bezwaren worden in het proces-verbaal vermeld.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel73
  - number: '73.2'
    text: Het proces-verbaal wordt door alle aanwezige leden van het hoofdstembureau getekend.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel73
  - number: '73.3'
    text: Bij ministeriële regeling wordt voor het proces-verbaal een model vastgesteld.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel73
  - number: '74.1'
    text: |-
      Het hoofdstembureau maakt het proces-verbaal onverwijld op een algemeen toegankelijke wijze elektronisch openbaar.
      Bij ministeriële regeling kan hiervoor een internetadres worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel74
  - number: '74.2'
    text: Het hoofdstembureau brengt zijn proces-verbaal onverwijld naar het centraal stembureau over.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel74
  - number: '74.3'
    text: |-
      Het hoofdstembureau brengt de processen-verbaal van de stembureaus en de opgaven, bedoeld in [artikel 68][ref1]
      naar het centraal stembureau over.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel68
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '68'
        hoofdstuk: '9'
  - number: '75'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld betreffende de taak van het hoofdstembureau
      inzake de vaststelling van de uitslag van het referendum.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel75
  - number: '76.1'
    text: |-
      Onmiddellijk nadat de processen-verbaal van alle hoofdstembureaus zijn ontvangen, gaat het centraal stembureau
      over tot het verrichten van de werkzaamheden ter vaststelling en bekendmaking van de opkomst en de uitslag van
      het referendum.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel76
  - number: '76.2'
    text: |-
      [Artikel P 1a van de Kieswet][ref1] is van toepassing, met dien verstande dat in het eerste en het tweede lid in
      plaats van «de uitslag van de verkiezing of de berekening van de zetelverdeling» wordt gelezen: de uitslag van
      het referendum.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: '77.1'
    text: |-
      Het centraal stembureau onderzoekt de geldigheid van de stemming en de juistheid van de vaststelling van de
      uitkomsten van de stemming door de stembureaus en de hoofdstembureaus, en beslist de geschillen die te dien aanzien
      rijzen. Het neemt daartoe kennis van de processen-verbaal van de stembureaus en de hoofdstembureaus.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel77
  - number: '77.2'
    text: |-
      Ten behoeve van het onderzoek, bedoeld in het eerste lid, kan het centraal stembureau tot een nieuwe opneming van
      stembiljetten, zowel uit alle als uit een of meer stembureaus besluiten. De burgemeester die de desbetreffende
      stembiljetten onder zich heeft, doet deze op verzoek van het centraal stembureau onverwijld naar dat orgaan
      overbrengen. Na ontvangst van de stembiljetten gaat het centraal stembureau onmiddellijk tot de opneming over.
      Het is bevoegd daartoe de verzegelde pakken te openen en de inhoud te vergelijken met de processen-verbaal van de
      stembureaus. Bij deze opneming is [hoofdstuk N, paragraaf 1, van de Kieswet][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#Paragraaf1
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0004627
        paragraaf: '1'
  - number: '77.3'
    text: |-
      Ten behoeve van het onderzoek, bedoeld in het eerste lid, is het centraal stembureau tevens bevoegd de verzegelde
      pakken, bedoeld in [artikel N 2 van de Kieswet][ref1], te openen. De burgemeester die de desbetreffende pakken
      onder zich heeft, doet deze op verzoek van het centraal stembureau onverwijld naar dat orgaan overbrengen. Na
      beëindiging van het onderzoek worden de bescheiden uit de geopende pakken opnieuw ingepakt en verzegeld op de in
      artikel N 2 van de Kieswet voorgeschreven wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: '78.1'
    text: |-
      Indien het centraal stembureau besluit dat het referendum ongeldig is wegens de ongeldigheid van de stemming in één
      of meer stembureaus, geeft de voorzitter daarvan onverwijld kennis aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel78
  - number: '78.2'
    text: |-
      Uiterlijk op de dertigste dag nadat deze kennisgeving is ontvangen, vindt in de in het eerste lid bedoelde
      stembureaus een nieuwe stemming plaats en wordt de uitslag van het referendum opnieuw vastgesteld. De dag van de
      stemming wordt vastgesteld door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel78
  - number: '78.3'
    text: |-
      [Artikel V 7 van de Kieswet][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelV_7
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: V_7
  - number: '79'
    text: 'Het centraal stembureau stelt vast:'
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel79
  - number: 79.a
    text: het totale aantal stemmen dat voor de aan het referendum onderworpen wet is uitgebracht;
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel79
  - number: 79.b
    text: het totale aantal stemmen dat tegen de aan het referendum onderworpen wet is uitgebracht;
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel79
  - number: 79.c
    text: het totale aantal blanco stemmen dat is uitgebracht;
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel79
  - number: 79.d
    text: de som van de onder a, b en c bedoelde aantallen stemmen, zijnde het totale aantal geldig uitgebrachte stemmen;
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel79
  - number: 79.e
    text: het totale aantal ongeldige stemmen;
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel79
  - number: 79.f
    text: het totale aantal kiesgerechtigden;
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel79
  - number: 79.g
    text: het totale aantal stemmen dat bij volmacht is uitgebracht;
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel79
  - number: 79.h
    text: |-
      het verschil tussen het aantal kiezers dat tot de stemming is toegelaten en het aantal stemmen dat is geteld vast.
      Voor zover mogelijk geeft het centraal stembureau hiervoor een verklaring.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel79
  - number: '80'
    text: |-
      Het centraal stembureau stelt de opkomst vast door de som van het totale aantal geldige en het totale aantal
      ongeldige stemmen te delen door het totale aantal kiesgerechtigden.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel80
  - number: '81'
    text: |-
      Het centraal stembureau stelt vervolgens vast hoeveel procent van de kiezers die een geldige stem hebben
      uitgebracht zich voor en hoeveel procent van de kiezers die een geldige stem hebben uitgebracht zich tegen de aan
      het referendum onderworpen wet hebben uitgesproken.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel81
  - number: '82.1'
    text: |-
      De voorzitter van het centraal stembureau maakt de opkomst en de uitslag van het referendum zo spoedig mogelijk
      bekend. De bekendmaking geschiedt in een openbare zitting van het centraal stembureau.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel82
  - number: '82.2'
    text: |-
      Dag en uur van de zitting worden door de voorzitter tijdig bekend gemaakt. De wijze van bekendmaking wordt geregeld
      bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel82
  - number: '82.3'
    text: De aanwezige kiezers kunnen mondeling bezwaren inbrengen.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel82
  - number: '82.4'
    text: De voorzitter is belast met de handhaving van de orde tijdens de zitting.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel82
  - number: '83.1'
    text: |-
      Nadat alle werkzaamheden zijn beëindigd, wordt daarvan aanstonds proces-verbaal opgemaakt. In dit proces-verbaal
      worden de opkomst en de uitslag van het referendum, alle ingebrachte bezwaren, alsmede de gerezen geschillen en de
      beslissingen die te dien aanzien zijn genomen, vermeld.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel83
  - number: '83.2'
    text: Het proces-verbaal wordt door alle aanwezige leden van het centraal stembureau getekend.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel83
  - number: '83.3'
    text: Bij ministeriële regeling wordt voor het proces-verbaal een model vastgesteld.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel83
  - number: '84'
    text: |-
      Het centraal stembureau maakt zijn proces-verbaal onverwijld op een algemeen toegankelijke wijze elektronisch
      openbaar. Bij ministeriële regeling kan hiervoor een internetadres worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel84
  - number: '85'
    text: |-
      De voorzitter van het centraal stembureau doet een afschrift van het proces-verbaal toekomen aan de voorzitter van
      de Tweede Kamer der Staten-Generaal, de voorzitter van de Eerste Kamer der Staten-Generaal en Onze Minister.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel85
  - number: '86.1'
    text: |-
      Het centraal stembureau bewaart de pakken, bedoeld in [artikel 77, tweede lid][ref1], drie maanden nadat de uitslag
      van het referendum is vastgesteld. Daarna vernietigt hij deze stukken onmiddellijk, tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel77
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '77'
        hoofdstuk: '10'
  - number: 86.1.a
    text: |-
      de officier van justitie of de rechter-commissaris in het kader van een strafrechtelijk onderzoek een verzoek heeft
      gedaan tot overdracht van deze stukken, in welk geval de vernietiging plaatsvindt nadat dit onderzoek is afgerond;
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel86
  - number: 86.1.b
    text: |-
      strafvervolging is ingesteld wegens een in deze wet strafbaar gestelde gedraging, in welk geval de vernietiging
      plaatsvindt nadat er een onherroepelijke rechterlijke uitspraak is.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel86
  - number: '86.2'
    text: Van de vernietiging wordt proces-verbaal opgemaakt.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel86
  - number: '86.3'
    text: |-
      Nadat de uitslag van het referendum is vastgesteld, is het centraal stembureau bevoegd, de pakken, bedoeld in
      [artikel 77, tweede lid][ref1], het proces-verbaal, bedoeld in [artikel 83][ref2] en de processen-verbaal van
      de hoofdstembureaus, ten dienste van een onderzoek naar enig strafbaar feit aan de officier van justitie over te
      dragen.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel77
      [ref2]: https://wetten.overheid.nl/BWBR0036443#Artikel83
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '77'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0036443
        artikel: '83'
        hoofdstuk: '10'
  - number: '87.1'
    text: Er is een referendumcommissie.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel87
  - number: '87.2'
    text: De referendumcommissie bestaat uit een voorzitter en vier andere leden.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel87
  - number: '87.3'
    text: De leden worden benoemd voor een periode van vier jaren. De leden kunnen worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel87
  - number: '87.4'
    text: |-
      Onze Minister neemt een besluit als bedoeld in het derde lid niet eerder dan vier weken nadat het voornemen daartoe
      in overeenstemming met het gevoelen van de ministerraad, aan de beide kamers der Staten-Generaal is meegedeeld.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel87
  - number: '87.5'
    text: Het besluit wordt zo spoedig mogelijk na het verstrijken van de termijn, bedoeld in het vierde lid, genomen.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel87
  - number: '88'
    text: |-
      [Artikel 22 van de Kaderwet zelfstandige bestuursorganen][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel22
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '22'
  - number: '89.1'
    text: De referendumcommissie heeft een secretaris.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel89
  - number: '89.2'
    text: Aan de secretaris kunnen andere medewerkers worden toegevoegd.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel89
  - number: '89.3'
    text: De secretaris en de andere medewerkers zijn geen lid van de referendumcommissie.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel89
  - number: '89.4'
    text: Onze Minister benoemt de secretaris en de andere medewerkers.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel89
  - number: '90.1'
    text: De referendumcommissie verstrekt informatie aan de kiezer over een aan een referendum onderworpen wet.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel90
  - number: '90.2'
    text: |-
      Daarnaast verstrekt de referendumcommissie subsidies ten behoeve van maatschappelijke initiatieven die zich ten
      doel stellen het publieke debat in Nederland over de aan het referendum onderworpen wet te bevorderen.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel90
  - number: '90.3'
    text: |-
      De referendumcommissie stelt ter uitvoering van de taak, genoemd het tweede lid, een regeling vast. In deze
      regeling wordt in ieder geval een subsidieplafond vastgesteld. Het subsidieplafond bedraagt ten hoogste € 2 miljoen
      per referendum.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel90
  - number: '91'
    text: |-
      Bij besluiten als bedoeld in de [artikelen 6][ref1], [14][ref2], [32, eerste lid][ref3], [44, eerste lid][ref4],
      [79][ref5], [80][ref6] en [81][ref7] gelden de volgende afwijkingen van de [Algemene wet bestuursrecht][ref8]:


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0036443#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0036443#Artikel32
      [ref4]: https://wetten.overheid.nl/BWBR0036443#Artikel44
      [ref5]: https://wetten.overheid.nl/BWBR0036443#Artikel79
      [ref6]: https://wetten.overheid.nl/BWBR0036443#Artikel80
      [ref7]: https://wetten.overheid.nl/BWBR0036443#Artikel81
      [ref8]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0036443
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0036443
        artikel: '32'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0036443
        artikel: '44'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0036443
        artikel: '79'
        hoofdstuk: '10'
      - id: ref6
        bwb_id: BWBR0036443
        artikel: '80'
        hoofdstuk: '10'
      - id: ref7
        bwb_id: BWBR0036443
        artikel: '81'
        hoofdstuk: '10'
      - id: ref8
        bwb_id: BWBR0005537
  - number: 91.a
    text: |-
      In afwijking van [artikel 6:7][ref1] bedraagt de termijn voor het indienen van een beroepschrift zes dagen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: 91.b
    text: |-
      [Titel 8.3][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 91.c
    text: |-
      In afwijking van [artikel 8:41, vijfde lid][ref1], bedraagt de termijn binnen welke de bijschrijving of storting
      van het verschuldigde bedrag dient plaats te vinden, twee weken. De voorzitter van de Afdeling bestuursrechtspraak
      van de Raad van State kan een kortere termijn stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 91.d
    text: |-
      De Afdeling bestuursrechtspraak van de Raad van State behandelt de zaak met toepassing van [afdeling 8.2.3][ref1].
      [Afdeling 8.2.4][ref2] blijft buiten toepassing. Aan het bestuursorgaan wordt terstond een afschrift van het
      beroepschrift gezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling8.2.3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling8.2.4
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 8.2.3
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: 8.2.4
  - number: '92.1'
    text: |-
      In de volgende gevallen doet de Afdeling bestuursrechtspraak van de Raad van State uitspraak uiterlijk op de zesde
      dag nadat het beroepschrift is ontvangen:
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel92
  - number: 92.1.a
    text: |-
      beroep tegen een besluit van de voorzitter van het centraal stembureau inzake het inleidend verzoek tot het houden
      van een referendum;
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel92
  - number: 92.1.b
    text: |-
      beroep tegen een besluit van het centraal stembureau inzake het definitieve verzoek tot het houden van een
      referendum;
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel92
  - number: 92.1.c
    text: beroep tegen een besluit of een wet aan een referendum kan worden onderworpen.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel92
  - number: '92.2'
    text: |-
      Indien de uitspraak van de Afdeling Bestuursrechtspraak van de Raad van State strekt tot gegrondverklaring van het
      beroep, treedt de uitspraak in de plaats van het vernietigde besluit.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel92
  - number: '92.3'
    text: |-
      De voorzitter van de Afdeling Bestuursrechtspraak van de Raad van State stelt partijen onverwijld in kennis van
      de uitspraak.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel92
  - number: '93'
    text: |-
      Degene die meer dan één verzoek indient of meer dan één ondersteuningsverklaring aflegt voor het houden van een
      referendum over dezelfde wet, wordt gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de derde
      categorie.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel93
  - number: '94'
    text: |-
      Degene die zich bij het indienen van een referendumverzoek of het afleggen van een ondersteuningsverklaring
      voordoet voor een ander, wordt gestraft met gevangenisstraf van ten hoogste een jaar of een geldboete van de derde
      categorie.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel94
  - number: '95'
    text: |-
      Degene die bij een referendum door geweld of bedreiging met geweld opzettelijk iemand verhindert zijn of eens
      anders kiesrecht vrij en onbelemmerd uit te oefenen, wordt gestraft met gevangenisstraf van ten hoogste een jaar of
      geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel95
  - number: '96.1'
    text: |-
      Degene die door gift of belofte iemand omkoopt om zijn recht een verzoek tot het houden van een referendum in te
      dienen hetzij niet, hetzij wel uit te oefenen, wordt gestraft met een gevangenisstraf van ten hoogste zes maanden
      of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel96
  - number: '96.2'
    text: Dezelfde straf wordt toegepast op de kiezer die zich door gift of belofte tot een of ander laat omkopen.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel96
  - number: '97.1'
    text: |-
      Degene die door gift of belofte iemand omkoopt om zijn recht een verzoek tot het houden van een referendum te
      ondersteunen hetzij niet hetzij wel uit te oefenen, wordt gestraft met een gevangenisstraf van ten hoogste zes
      maanden of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel97
  - number: '97.2'
    text: Dezelfde straf wordt toegepast op de kiezer die zich door gift of belofte tot een of ander laat omkopen.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel97
  - number: '98'
    text: |-
      Degene die iemand onder valse voorwendselen beweegt om een verzoek in te dienen of een ondersteuningsverklaring af
      te leggen, wordt gestraft met een gevangenisstraf van ten hoogste zes maanden of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel98
  - number: '99.1'
    text: |-
      Degene die bij een referendum door gift of belofte iemand omkoopt om zijn of eens anders kiesrecht hetzij niet,
      hetzij op bepaalde wijze uit te oefenen, wordt gestraft met gevangenisstraf van ten hoogste zes maanden of
      geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel99
  - number: '99.2'
    text: |-
      Dezelfde straf wordt toegepast op de kiezer of de gemachtigde van een kiezer die zich door gift of belofte tot een
      of ander laat omkopen.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel99
  - number: '100'
    text: |-
      Degene die bij gelegenheid van een referendum enige bedrieglijke handeling pleegt waardoor een stem van onwaarde
      wordt of een andere dan bij het uitbrengen van de stem bedoelde keuze aangeeft, wordt gestraft met gevangenisstraf
      van ten hoogste zes maanden of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel100
  - number: '101'
    text: |-
      Degene die opzettelijk zich voor een ander uitgevende, aan een referendum deelneemt, wordt gestraft met
      gevangenisstraf van ten hoogste een jaar of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel101
  - number: '102'
    text: |-
      Degene die bij een referendum opzettelijk een plaats gehad hebbende stemming verijdelt of enige bedrieglijke
      handeling pleegt waardoor aan de stemming een andere uitslag wordt gegeven dan door de wettig uitgebrachte stemmen
      zou zijn verkregen, wordt gestraft met gevangenisstraf van ten hoogste een jaar en zes maanden of geldboete van de
      vierde categorie.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel102
  - number: '103'
    text: |-
      Degene die stembiljetten, stempassen, kiezerspassen, volmachtbewijzen of briefstembewijzen namaakt of vervalst met
      het oogmerk deze bij een referendum als echt en onvervalst te gebruiken of door anderen te doen gebruiken, wordt
      gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel103
  - number: '104'
    text: |-
      Degene die bij een referendum opzettelijk als echt en onvervalst gebruikt of door anderen doet gebruiken
      stembiljetten, stempassen, kiezerspassen, volmachtbewijzen of briefstembewijzen, die hij zelf heeft nagemaakt of
      vervalst of waarvan de valsheid of vervalsing hem, toen hij ze ontving, bekend was, of deze, met het oogmerk om
      ze als echt en onvervalst te gebruiken of door anderen te doen gebruiken, in voorraad heeft, wordt gestraft met
      gevangenisstraf van ten hoogste zes jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel104
  - number: '105'
    text: |-
      Degene die stembiljetten, stempassen, kiezerspassen, volmachtbewijzen of briefstembewijzen voorhanden heeft met het
      oogmerk deze wederrechtelijk bij een referendum te gebruiken of door anderen te doen gebruiken, wordt gestraft met
      gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel105
  - number: '106.1'
    text: |-
      Degene die bij een referendum door gift of belofte een kiezer omkoopt om volmacht te geven tot het uitbrengen van
      zijn stem, wordt gestraft met gevangenisstraf van ten hoogste zes maanden of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel106
  - number: '106.2'
    text: |-
      Met dezelfde straf wordt gestraft de kiezer die zich door gift of belofte tot het bij volmacht stemmen laat
      omkopen.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel106
  - number: '107.1'
    text: |-
      Bij veroordeling wegens een van de in de [artikelen 103 tot en met 106][ref1] omschreven misdrijven kan
      ontzetting van de in [artikel 28, eerste lid, onder 1°, 2° en 4°, van het Wetboek van Strafrecht][ref2]
      dan wel, indien de ontzetting wordt uitgesproken door de strafrechter in Bonaire, Sint Eustatius en Saba,
      [artikel 32, eerste lid, onder 1°, 2°, en 4° van het Wetboek van Strafrecht BES][ref3] vermelde rechten worden
      uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel103
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel32
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '103'
        hoofdstuk: '13'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0028570
        artikel: '32'
  - number: '107.2'
    text: |-
      Bij veroordeling tot een vrijheidsstraf van ten minste een jaar wegens een van de in de
      [artikelen 95][ref1] en [101 tot en met 105][ref2] omschreven misdrijven, kan ontzetting van
      het in [artikel 28, eerste lid, onder 3°, van het Wetboek van Strafrecht][ref3] dan wel,
      indien de ontzetting wordt uitgesproken door de strafrechter in Bonaire, Sint Eustatius en Saba,
      [artikel 32, eerste lid, onder 3° van het Wetboek van Strafrecht BES][ref4] vermelde recht worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel95
      [ref2]: https://wetten.overheid.nl/BWBR0036443#Artikel101
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0028570#Artikel32
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '95'
        hoofdstuk: '13'
      - id: ref2
        bwb_id: BWBR0036443
        artikel: '101'
        hoofdstuk: '13'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '28'
      - id: ref4
        bwb_id: BWBR0028570
        artikel: '32'
  - number: '108'
    text: |-
      Degene die bij een referendum als gemachtigde stemt voor een persoon, wetende dat deze overleden is, wordt gestraft
      met hechtenis van ten hoogste een maand of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel108
  - number: '109'
    text: |-
      Degene die stelselmatig personen aanspreekt of anderszins persoonlijk benadert ten einde hen te bewegen het
      formulier op hun stempas, bestemd voor het stemmen bij volmacht bij een referendum, te ondertekenen en deze kaart
      af te geven, wordt gestraft met hechtenis van ten hoogste een maand of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel109
  - number: '110'
    text: |-
      De werkgever die de hem bij [artikel J 10 van de Kieswet][ref1] juncto [artikel 59][ref2] van deze wet opgelegde
      verplichting niet nakomt, wordt gestraft met hechtenis van ten hoogste veertien dagen of geldboete van de tweede
      categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
      [ref2]: https://wetten.overheid.nl/BWBR0036443#Artikel59
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0004627
      - id: ref2
        bwb_id: BWBR0036443
        artikel: '59'
        hoofdstuk: '8'
  - number: '111'
    text: |-
      De voorzitter, de leden en de opgeroepen plaatsvervangende leden van het stembureau die gedurende de zitting buiten
      noodzaak afwezig zijn zonder dat in vervanging is voorzien, worden gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel111
  - number: '112'
    text: |-
      De in de [artikelen 93 tot en met 106][ref1] bedoelde strafbare feiten worden als misdrijven beschouwd en de in de
      [artikelen 108 tot en met 111][ref2] bedoelde strafbare feiten als overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0036443#Artikel108
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '93'
        hoofdstuk: '13'
      - id: ref2
        bwb_id: BWBR0036443
        artikel: '108'
        hoofdstuk: '13'
  - number: '113'
    text: |-
      Deze wet en de daarop berustende bepalingen is mede van toepassing in Bonaire, Sint Eustatius en Saba, met
      inachtneming van het in dit hoofdstuk bepaalde.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel113
  - number: '114'
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder «openbaar lichaam»: openbaar lichaam
      Bonaire, Sint Eustatius of Saba.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel114
  - number: '115.1'
    text: |-
      Voor de toepassing van de bij deze wet gestelde, de bij deze wet van toepassing verklaarde of de krachtens deze
      wet gestelde bepalingen in Bonaire, Sint Eustatius en Saba, wordt, voor zover dit hoofdstuk niet andere bepaalt,
      telkens in die bepalingen gelezen in plaats van:
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel115
  - number: 115.1.a
    text: '«gemeente»: openbaar lichaam;'
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel115
  - number: 115.1.b
    text: '«burgemeester»: gezaghebber;'
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel115
  - number: 115.1.c
    text: '«burgemeester en wethouders»: het bestuurscollege;'
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel115
  - number: 115.1.d
    text: '«het gemeentehuis»: het bestuurskantoor;'
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel115
  - number: 115.1.e
    text: |-
      «[artikel 1 van de Wet op de identificatieplicht][ref1]»:
      [artikel 2 van de Wet op de identificatieplicht BES][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028575#Artikel2
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0028575
        artikel: '2'
  - number: '115.2'
    text: |-
      Indien uitsluitend de gemeente, de burgemeester of burgemeester en wethouders van ’s-Gravenhage wordt bedoeld,
      geldt het eerste lid, onder a tot en met c, niet.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel115
  - number: '116.1'
    text: |-
      In afwijking van [artikel 29, eerste lid][ref1], kan iedere kiesgerechtigde ingezetene van een openbaar lichaam bij
      de gezaghebber een verzoek tot het houden van een referendum indienen. Het verzoek dient binnen de termijn van vier
      weken, bedoeld in artikel 29, eerste lid, door de gezaghebber te zijn ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel29
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '29'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '116.2'
    text: |-
      De lijst, bedoeld in [artikel 29, derde en vierde lid][ref1], wordt kosteloos beschikbaar gesteld door de
      gezaghebber. Het centraal stembureau draagt er zorg voor dat de gezaghebbers tijdig de beschikking hebben over
      de lijsten.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel29
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '29'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '116.3'
    text: |-
      Na het verstrijken van de termijn van vier weken, bedoeld in [artikel 29, eerste lid][ref1], stelt de gezaghebber,
      indien er verzoeken zijn ingediend, vast:


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel29
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '29'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 116.3.a
    text: het totaal aantal in het openbaar lichaam ingediende verzoeken;
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel116
  - number: 116.3.b
    text: het aantal geldige verzoeken;
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel116
  - number: 116.3.c
    text: het aantal ongeldige verzoeken.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel116
  - number: '116.4'
    text: |-
      Onverminderd [artikel 33, derde lid][ref1], zijn in een openbaar lichaam tevens ongeldig de verzoeken die bij
      de gezaghebber zijn ingediend door personen die niet zijn ingeschreven in de administratie van het betreffende
      openbaar lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel33
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '33'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '116.5'
    text: |-
      De gezaghebber draagt er zorg voor dat de opgave van de door hem vastgestelde aantallen verzoeken en de lijsten met
      de verzoeken langs elektronische weg uiterlijk de tweede dag na afloop van de termijn van vier weken, bedoeld in
      [artikel 29][ref1], ter kennis worden gebracht van de voorzitter van het centraal stembureau. De voorzitter van het
      centraal stembureau betrekt de opgave en de lijsten bij de vaststelling, bedoeld in [artikel 33, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0036443#Artikel33
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '29'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0036443
        artikel: '33'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '116.6'
    text: |-
      Na de elektronische in kennisstelling doet de gezaghebber de lijsten met verzoeken in een pak. [Artikel 36][ref1]
      is van toepassing. De gezaghebber draagt er zorg voor dat het pak, op verzoek van de voorzitter van het centraal
      stembureau of de voorzitter van de Afdeling bestuursrechtspraak van de Raad van State per post zo spoedig mogelijk
      wordt overgebracht naar het centraal stembureau, respectievelijk de Afdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel36
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '36'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '116.7'
    text: |-
      Voor de toepassing in een openbaar lichaam wordt in de [artikelen 29, zesde lid][ref1],
      [33, derde lid, onder a en onder b][ref2], [artikel 35][ref3], en [39][ref4] voor «voorzitter van het centraal
      stembureau» of «voorzitter» telkens gelezen: gezaghebber.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0036443#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0036443#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0036443#Artikel39
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '29'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0036443
        artikel: '33'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0036443
        artikel: '35'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0036443
        artikel: '39'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '117'
    text: |-
      Onverminderd [artikel 33, derde lid][ref1], zijn tevens ongeldig de verzoeken die door personen die zijn
      ingeschreven in de administratie van een openbaar lichaam bij de voorzitter van het centraal stembureau zijn
      ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel33
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '33'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '118.1'
    text: |-
      In afwijking van [artikel 41, eerste lid][ref1], kan iedere kiesgerechtigde ingezetene van een openbaar lichaam
      bij de gezaghebber een verklaring ter ondersteuning van het inleidend verzoek indienen. Het verzoek dient binnen de
      termijn van zes weken, bedoeld in artikel 41, eerste lid, door de gezaghebber te zijn ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel41
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '41'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: '118.2'
    text: |-
      De lijst, bedoeld in [artikel 41 derde en vierde lid][ref1], wordt kosteloos beschikbaar gesteld door de
      gezaghebber. Het centraal stembureau draagt er zorg voor dat de gezaghebbers tijdig de beschikking hebben over
      de lijsten.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel41
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '41'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: '118.3'
    text: |-
      Na het verstrijken van de termijn van zes weken, bedoeld in [artikel 41, eerste lid][ref1], stelt de gezaghebber,
      indien er ondersteuningsverklaringen zijn ingediend, vast:


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel41
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '41'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 118.3.a
    text: het totaal aantal in het openbaar lichaam afgelegde ondersteuningsverklaringen;
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel118
  - number: 118.3.b
    text: het aantal geldige ondersteuningsverklaringen;
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel118
  - number: 118.3.c
    text: het aantal ongeldige ondersteuningsverklaringen.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel118
  - number: '118.4'
    text: |-
      Onverminderd [artikel 45, derde lid][ref1], zijn in een openbaar lichaam tevens ongeldig de
      ondersteuningsverklaringen die bij de gezaghebber zijn afgelegd door personen die niet zijn ingeschreven in de
      administratie van het betreffende openbaar lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel45
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '45'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: '118.5'
    text: |-
      De gezaghebber draagt er zorg voor dat de opgave van de door hem vastgestelde aantallen ondersteuningsverklaringen
      en de lijsten met de ondersteuningsverklaringen langs elektronische weg uiterlijk de tweede dag na afloop van de
      termijn van zes weken, bedoeld in [artikel 41][ref1], ter kennis worden gebracht van het centraal stembureau. Het
      centraal stembureau betrekt de opgave en de lijsten bij de vaststelling, bedoeld in [artikel 45, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0036443#Artikel45
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '41'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0036443
        artikel: '45'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: '118.6'
    text: |-
      Na de elektronische in kennisstelling doet de gezaghebber de lijsten in een pak. [Artikel 51][ref1] is van
      toepassing. De gezaghebber draagt er zorg voor dat het pak, op verzoek van de voorzitter van het centraal
      stembureau of de voorzitter van de Afdeling bestuursrechtspraak van de Raad van State per post zo spoedig mogelijk
      wordt overgebracht naar het centraal stembureau, respectievelijk de Afdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel51
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '51'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: '118.7'
    text: |-
      Voor de toepassing in een openbaar lichaam wordt in de [artikelen 41, zesde lid][ref1],
      [45, derde lid, onder a en onder b][ref2], en [54][ref3] voor «voorzitter van het centraal stembureau» of
      «voorzitter» telkens gelezen: gezaghebber.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0036443#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0036443#Artikel54
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '41'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0036443
        artikel: '45'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0036443
        artikel: '54'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: '119'
    text: |-
      Onverminderd [artikel 45, derde lid][ref1], zijn tevens ongeldig de ondersteuningsverklaringen die door personen
      die zijn ingeschreven in de administratie van een openbaar lichaam bij de voorzitter van het centraal stembureau
      zijn afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel45
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '45'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: '120'
    text: |-
      Geen beroep kan worden ingesteld tegen de vaststelling door de gezaghebber van de aantallen verzoeken en aantallen
      ondersteuningsverklaringen als bedoeld in de [artikelen 116, derde lid][ref1], en [artikel 117, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel116
      [ref2]: https://wetten.overheid.nl/BWBR0036443#Artikel117
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel120
    references:
