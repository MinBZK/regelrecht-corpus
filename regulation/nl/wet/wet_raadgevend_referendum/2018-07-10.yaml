        artikel: '116'
        hoofdstuk: 13a
      - id: ref2
        bwb_id: BWBR0036443
        artikel: '117'
        hoofdstuk: 13a
  - number: '121'
    text: |-
      De [artikelen Ya 11][ref1], [Ya 12][ref2], [Ya 40][ref3] en [Ya 42 van de Kieswet][ref4] zijn bij een referendum
      van toepassing in een openbaar lichaam, met dien verstande dat:


