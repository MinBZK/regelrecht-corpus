  - number: '122'
    text: |-
      [Artikel Z 12, eerste lid, eerste volzin, en tweede tot en met vierde lid, van de Kieswet][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
