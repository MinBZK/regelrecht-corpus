  - number: 59.a
    text: |-
      in [artikel J 5, eerste lid][ref1], de zinsnede «en dat ligt in het gebied van het orgaan waarvoor de verkiezing
      wordt gehouden» buiten toepassing blijft;


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: 59.b
    text: |-
      in de [artikelen J 5, eerste lid][ref1] en [J 7][ref2] in plaats van «dag van de kandidaatstelling» wordt gelezen:
      vierenveertigste dag voor de dag van stemming;


      [ref1]: https://wetten.overheid.nl/BWBR0004627
      [ref2]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel59
