---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_raadgevend_referendum
regulatory_layer: WET
publication_date: '2018-07-27'
valid_from: '2018-07-10'
bwb_id: BWBR0036443
url: https://wetten.overheid.nl/BWBR0036443/2018-07-10
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is bepalingen vast te stellen inzake het raadgevend
    referendum;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder: - *Onze Minister:* Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;
        - *referendum:* raadgevend correctief referendum;
        - *referendumcommissie:* referendumcommissie, genoemd in [artikel 87][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel87
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '87'
        hoofdstuk: '11'
  - number: '2'
    text: |-
      In de in deze wet omschreven gevallen wordt een referendum gehouden, indien na een inleidend verzoek van ten minste
      tienduizend kiesgerechtigden ten minste driehonderdduizend kiesgerechtigden daartoe bij een definitief verzoek de
      wens kenbaar hebben gemaakt.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel2
  - number: '3'
    text: |-
      De uitslag van een referendum geldt als een raadgevende uitspraak tot afwijzing, indien een meerderheid zich
      in afwijzende zin uitspreekt en de opkomst bij het referendum ten minste dertig procent van het totale aantal
      kiesgerechtigden bedraagt.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel3
  - number: '4'
    text: 'Een referendum kan worden gehouden over:'
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel4
  - number: 4.a
    text: wetten;
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel4
  - number: 4.b
    text: stilzwijgende goedkeuring van verdragen die binnen het Koninkrijk alleen voor Nederland of een deel daarvan gelden.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel4
  - number: '5'
    text: 'Geen referendum kan worden gehouden over:'
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel5
  - number: 5.a
    text: wetten inzake het koningschap;
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel5
  - number: 5.b
    text: wetten inzake het koninklijk huis;
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel5
  - number: 5.c
    text: |-
      wetten inzake de begroting, bedoeld in [artikel 105, eerste lid, van de Grondwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel105
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '105'
  - number: 5.d
    text: |-
      wetten tot verandering in de [Grondwet][ref1] en wetten houdende verklaring dat er grond bestaat een voorstel
      hiertoe in overweging te nemen;


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: 5.e
    text: wetten die uitsluitend strekken tot uitvoering van verdragen of besluiten van volkenrechtelijke organisaties;
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel5
  - number: 5.f
    text: |-
      rijkswetten, behoudens rijkswetten tot goedkeuring van verdragen die binnen het Koninkrijk alleen voor Nederland of
      een deel daarvan gelden;
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel5
  - number: 5.g
    text: |-
      wetten als bedoeld in de [artikelen 11][ref1] en [12, tweede en derde lid][ref2], die uitsluitend strekken
      tot intrekking of tot regeling van de inwerkingtreding van een wet naar aanleiding van een daarover gehouden
      referendum;


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0036443#Artikel12
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0036443
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 5.h
    text: |-
      wetten als bedoeld in de [artikelen 12, derde lid][ref1], en [16, derde lid][ref2], die uitsluitend strekken tot
      goedkeuring van het voornemen tot opzegging van een verdrag naar aanleiding van een over de goedkeuring van dat
      verdrag gehouden referendum;


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0036443#Artikel16
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0036443
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 5.i
    text: |-
      wetten als bedoeld in [artikel 15, tweede lid][ref1], die uitsluitend strekken tot intrekking van de aan een
      verdrag verleende goedkeuring naar aanleiding van een daarover gehouden referendum.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel15
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '6.1'
    text: |-
      Onze Minister besluit in overeenstemming met Onze Minister wie het aangaat onverwijld nadat een wetsvoorstel is
      bekrachtigd, of, gelet op [artikel 5][ref1], over de wet een referendum kan worden gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel5
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '5'
        hoofdstuk: '2'
  - number: '6.2'
    text: |-
      Indien Onze Minister tevens de enige minister is wie het aangaat, neemt Onze Minister het besluit in
      overeenstemming met Onze Minister van Veiligheid en Justitie.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel6
  - number: '6.3'
    text: |-
      Indien het een wet tot goedkeuring van een verdrag betreft, wordt het besluit genomen door Onze Minister van
      Buitenlandse Zaken in overeenstemming met Onze Minister en Onze Minister wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel6
  - number: '7.1'
    text: |-
      Onze Minister doet binnen een week na de bekrachtiging van een wet die niet strekt tot goedkeuring van een verdrag,
      mededeling in de Staatscourant van:
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel7
  - number: 7.1.a
    text: de bekrachtiging;
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel7
  - number: 7.1.b
    text: een algemeen toegankelijke vindplaats van de tekst van de wet;
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel7
  - number: 7.1.c
    text: zijn besluit of over de wet een referendum kan worden gehouden.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel7
  - number: '7.2'
    text: |-
      Onze Minister van Buitenlandse Zaken doet binnen een week na de bekrachtiging van een wet tot goedkeuring van een
      verdrag mededeling in de Staatscourant van:
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel7
  - number: 7.2.a
    text: de bekrachtiging;
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel7
  - number: 7.2.b
    text: een algemeen toegankelijke vindplaats van de tekst van de wet en het verdrag;
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel7
  - number: 7.2.c
    text: zijn besluit of over de wet een referendum kan worden gehouden.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel7
  - number: '8.1'
    text: |-
      Een tijdstip van inwerkingtreding van een wet of onderdeel van een wet waarover een referendum kan worden gehouden,
      wordt niet eerder gesteld dan acht weken na de mededeling in de Staatscourant, bedoeld in [artikel 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel7
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '8.2'
    text: |-
      Indien bij of krachtens de wet een tijdstip van inwerkingtreding zodanig is vastgesteld dat dat tijdstip valt
      binnen de in het eerste lid genoemde termijn, wordt de inwerkingtreding van rechtswege opgeschort tot de dag na het
      verstrijken van die termijn.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel8
  - number: '8.3'
    text: |-
      [Artikel 7 van de Bekendmakingswet][ref1] blijft buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel7
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '7'
  - number: '9'
    text: |-
      Indien een inleidend verzoek tot het houden van een referendum over een wet onherroepelijk is toegelaten, vervalt
      hetgeen in die wet omtrent de inwerkingtreding is geregeld van rechtswege.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel9
  - number: '10'
    text: |-
      Indien onherroepelijk is vastgesteld dat geen referendum zal worden gehouden of dat een referendum niet heeft
      geleid tot een raadgevende uitspraak tot afwijzing, wordt de inwerkingtreding bij koninklijk besluit opnieuw
      geregeld.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel10
  - number: '11'
    text: |-
      Indien onherroepelijk is vastgesteld dat een referendum heeft geleid tot een raadgevende uitspraak tot afwijzing,
      wordt zo spoedig mogelijk een voorstel van wet ingediend dat uitsluitend strekt tot intrekking van de wet of tot
      regeling van de inwerkingtreding van de wet.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel11
  - number: '12.1'
    text: |-
      Indien de inwerkingtreding van een wet waarover een referendum kan worden gehouden, geen uitstel kan lijden,
      kan onder verwijzing in die wet naar dit artikel de inwerkingtreding in afwijking van de [artikelen 8][ref1] en
      [9][ref2] worden geregeld, onverminderd de mogelijkheid over de wet een referendum te houden.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0036443#Artikel9
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0036443
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '12.2'
    text: |-
      Indien over een wet als bedoeld in het eerste lid een referendum wordt gehouden en onherroepelijk is vastgesteld
      dat dit heeft geleid tot een raadgevende uitspraak tot afwijzing, wordt zo spoedig mogelijk beslist of een voorstel
      van wet zal worden ingediend dat uitsluitend strekt tot intrekking van de wet. Onze Minister wie het aangaat licht
      de Staten-Generaal zo spoedig mogelijk in over de beslissing van de regering ter zake.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel12
  - number: '12.3'
    text: |-
      Betreft het een wet tot goedkeuring van een verdrag, dan wordt zo spoedig mogelijk beslist of een voorstel van
      wet zal worden ingediend dat uitsluitend strekt tot intrekking van de wet of tot goedkeuring van het voornemen tot
      opzegging van het verdrag, indien de binding aan het verdrag reeds is aangegaan. Onze Minister van Buitenlandse
      Zaken licht de Staten-Generaal zo spoedig mogelijk in over de beslissing van de regering terzake.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel12
  - number: '12.4'
    text: |-
      Voorzover blijkt dat een belanghebbende ten gevolge van de intrekking van een wet overeenkomstig het tweede of
      derde lid dan wel de opzegging van een verdrag overeenkomstig het derde lid schade lijdt of zal lijden welke
      redelijkerwijs niet of niet geheel te zijnen laste behoort te blijven en waarvan de vergoeding niet of niet
      voldoende op andere wijze is verzekerd, kent Onze Minister wie het aangaat hem op zijn verzoek een naar billijkheid
      te bepalen schadevergoeding toe.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel12
  - number: '13.1'
    text: |-
      De bekendmaking van een rijkswet tot goedkeuring van een verdrag dat binnen het Koninkrijk alleen voor Nederland
      of een deel daarvan geldt, vindt niet plaats dan nadat onherroepelijk is komen vast te staan dat over die rijkswet
      geen referendum zal worden gehouden dan wel de uitslag van een referendum over die rijkswet onherroepelijk is
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel13
  - number: '13.2'
    text: |-
      Indien een referendum is gehouden en onherroepelijk is vastgesteld dat dit heeft geleid tot een raadgevende
      uitspraak tot afwijzing, wordt zo spoedig mogelijk een voorstel van rijkswet ingediend dat uitsluitend strekt tot
      intrekking of bekendmaking van de rijkswet.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel13
  - number: '14.1'
    text: |-
      Onze Minister van Buitenlandse Zaken besluit in overeenstemming met Onze Minister en Onze Minister wie het aangaat,
      onverwijld na de verlening van stilzwijgende goedkeuring van een verdrag, of, gelet op de [artikelen 4][ref1] en
      [5][ref2], over de stilzwijgende goedkeuring een referendum kan worden gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0036443#Artikel5
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0036443
        artikel: '5'
        hoofdstuk: '2'
  - number: '14.2'
    text: |-
      Onze Minister van Buitenlandse Zaken doet binnen een week na de verlening van stilzwijgende goedkeuring van een
      verdrag, mededeling in de Staatscourant van:
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel14
  - number: 14.2.a
    text: de verlening van stilzwijgende goedkeuring;
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel14
  - number: 14.2.b
    text: een algemeen toegankelijke vindplaats van de tekst van het verdrag;
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel14
  - number: 14.2.c
    text: zijn besluit of over de stilzwijgende goedkeuring een referendum kan worden gehouden.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel14
  - number: '15.1'
    text: |-
      De binding aan een stilzwijgend goedgekeurd verdrag dat binnen het Koninkrijk alleen voor Nederland of een deel
      daarvan geldt, wordt niet aangegaan dan nadat onherroepelijk vaststaat dat over de stilzwijgende goedkeuring geen
      referendum zal worden gehouden dan wel de uitslag van een referendum onherroepelijk is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel15
  - number: '15.2'
    text: |-
      Indien een referendum is gehouden en onherroepelijk is vastgesteld dat dit heeft geleid tot een raadgevende
      uitspraak tot afwijzing, wordt zo spoedig mogelijk beslist of een voorstel van wet zal worden ingediend dat
      uitsluitend strekt tot intrekking van de aan het verdrag verleende goedkeuring. Onze Minister van Buitenlandse
      Zaken licht de Staten-Generaal zo spoedig mogelijk in over de beslissing van de regering ter zake. De binding aan
      het verdrag wordt niet aangegaan voordat vier weken zijn verstreken nadat Onze Minister van Buitenlandse Zaken de
      Staten-Generaal heeft ingelicht dat geen voorstel van wet als bedoeld in dit lid zal worden ingediend.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel15
  - number: '16.1'
    text: |-
      Indien het aangaan van binding aan een stilzwijgend nog goed te keuren of goedgekeurd verdrag geen uitstel kan
      lijden, kan, onder verwijzing bij de overlegging ter stilzwijgende goedkeuring van het verdrag aan de Staten-
      Generaal naar dit artikel, de binding in afwijking van [artikel 15, eerste lid][ref1], worden aangegaan,
      onverminderd de mogelijkheid over de stilzwijgende goedkeuring een referendum te houden.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel15
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '16.2'
    text: |-
      De binding aan een verdrag voordat daarover een referendum heeft kunnen plaatsvinden wordt aangegaan onder
      voorbehoud van mogelijke beëindiging voor het Koninkrijk bij een raadgevende uitspraak tot afwijzing.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel16
  - number: '16.3'
    text: |-
      Indien over een stilzwijgende goedkeuring als bedoeld in het eerste lid een referendum wordt gehouden en
      onherroepelijk is vastgesteld dat dit heeft geleid tot een raadgevende uitspraak tot afwijzing, wordt zo spoedig
      mogelijk beslist of een voorstel van wet zal worden ingediend dat uitsluitend strekt tot goedkeuring van het
      voornemen tot opzegging van het verdrag. Onze Minister van Buitenlandse Zaken licht de Staten-Generaal zo spoedig
      mogelijk in over de beslissing van de regering ter zake.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel16
  - number: '16.4'
    text: |-
      Voorzover blijkt dat een belanghebbende ten gevolge van de opzegging van een verdrag overeenkomstig het derde lid
      schade lijdt of zal lijden welke redelijkerwijs niet of niet geheel te zijnen laste behoort te blijven en waarvan
      de vergoeding niet of niet voldoende op andere wijze is verzekerd, kent Onze Minister wie het aangaat hem op zijn
      verzoek een naar billijkheid te bepalen schadevergoeding toe.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel16
  - number: '17'
    text: |-
      Bepalingen in de volgende hoofdstukken van deze wet die betrekking hebben op een referendum over een wet, zijn
      tevens van toepassing op een referendum over de stilzwijgende goedkeuring van een verdrag.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel17
  - number: '18.1'
    text: |-
      Kiesgerechtigd voor het referendum zijn diegenen die kiesgerechtigd zijn voor de verkiezing van de leden van de
      Tweede Kamer der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel18
  - number: '18.2'
    text: |-
      Voor de beoordeling of aan de vereisten voor het kiesrecht is voldaan, is de toestand op de vierenveertigste
      dag voor de dag van stemming bepalend. Het vereiste van het hebben bereikt van de achttienjarige leeftijd wordt
      beoordeeld naar de toestand op de dag van de stemming.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel18
  - number: '19'
    text: |-
      [Artikel B 6 van de Kieswet][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: '20'
    text: |-
      De registratie van de kiesgerechtigdheid van de ingezetenen van de gemeente voor de verkiezingen van de Tweede
      Kamer geldt tevens als registratie van de kiesgerechtigdheid voor referenda.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel20
  - number: '22'
    text: |-
      De [artikelen D 2 tot en met D 9 van de Kieswet][ref1] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_2
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: D_2
  - number: '23'
    text: |-
      Voor het houden van referenda wordt Nederland verdeeld in kieskringen die overeenkomen met de kieskringen voor de
      verkiezing van de leden van de Tweede Kamer.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel23
  - number: '24.1'
    text: Burgemeester en wethouders stellen één of meer stembureaus in de gemeente in.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel24
  - number: '24.2'
    text: |-
      Een stembureau bestaat uit een bij algemene maatregel van bestuur vast te stellen aantal leden, van wie er één
      voorzitter is.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel24
  - number: '24.3'
    text: |-
      Burgemeester en wethouders benoemen tijdig voordat de stemming voor een referendum wordt gehouden de leden van elk
      stembureau en een voldoend aantal plaatsvervangende leden.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel24
  - number: '24.4'
    text: |-
      [Artikel E 4, tweede tot en met vierde lid, van de Kieswet][ref1] is van toepassing, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: 24.4.a
    text: |-
      in [artikel E 4, tweede lid, onderdeel b][ref1], in plaats van «voor de desbetreffende verkiezing» wordt gelezen:
      voor het referendum;


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: 24.4.b
    text: |-
      in [artikel E 4, tweede lid, onderdeel c][ref1], in plaats van «bij een vorige verkiezing» wordt gelezen: bij een
      vorig referendum of een vorige verkiezing;


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: 24.4.c
    text: |-
      in [artikel E 4, derde lid][ref1], in plaats van «nadat over de toelating van de gekozenen is beslist» wordt
      gelezen: nadat de uitslag van het referendum is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: '25'
    text: |-
      De hoofdstembureaus voor de verkiezing van de leden van de Tweede Kamer treden op als hoofdstembureaus voor het
      houden van een referendum.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel25
  - number: '26'
    text: De Kiesraad treedt op als centraal stembureau voor het houden van een referendum.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel26
  - number: '27'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels gesteld worden omtrent inrichting, samenstelling en
      werkwijze van het centraal stembureau.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel27
  - number: '28'
    text: |-
      Het inleidend verzoek tot het houden van een referendum wordt gevormd door het totale aantal geldige verzoeken tot
      het houden van een referendum.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel28
  - number: '29.1'
    text: |-
      Iedere kiesgerechtigde kan bij de voorzitter van het centraal stembureau een verzoek tot het houden van een
      referendum indienen. Het verzoek dient binnen een termijn van vier weken na een mededeling als bedoeld in
      [hoofdstuk 3][ref1] door de voorzitter te zijn ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0036443
        hoofdstuk: '3'
  - number: '29.2'
    text: |-
      Voor de beoordeling of aan de vereisten voor het kiesrecht is voldaan, is bepalend of dit op enig tijdstip binnen
      de in het eerste lid bedoelde termijn het geval was.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel29
  - number: '29.3'
    text: |-
      Een verzoek wordt ingediend door het plaatsen van de voornaam, de achternaam, het adres, de geboortedatum, de
      geboorteplaats en de handtekening op een lijst of een fotokopie daarvan.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel29
  - number: '29.4'
    text: Op de lijst kunnen verzoeken van één of meerdere kiesgerechtigden staan.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel29
  - number: '29.5'
    text: |-
      De lijst wordt kosteloos beschikbaar gesteld door het centraal stembureau en is reeds voorzien van een benaming van
      de wet waarop het verzoek betrekking heeft. Bij ministeriële regeling wordt voor de lijst een model gesteld.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel29
  - number: '29.6'
    text: |-
      Een door de voorzitter van het centraal stembureau aan te wijzen persoon tekent bij ontvangst van een lijst hierop
      de datum van ontvangst aan.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel29
  - number: '29.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld voor het indienen van verzoeken door
      de kiesgerechtigde die zijn werkelijke woonplaats buiten Nederland heeft.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel29
  - number: '30.1'
    text: Een verzoeker mag niet meer dan één verzoek tot het houden van een referendum over dezelfde wet indienen.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel30
  - number: '30.2'
    text: Een ingediend verzoek kan niet worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel30
  - number: '31.1'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat verzoeken tot het houden van een referendum in afwijking
      van [artikel 29][ref1] op elektronische wijze kunnen worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel29
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '29'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '31.2'
    text: |-
      Tot het bij algemene maatregel van bestuur openen van deze mogelijkheid kan slechts worden overgegaan indien
      verzekerd is dat die wijze van indiening van verzoeken geen afbreuk doet aan de vereisten van toezicht en
      betrouwbaarheid.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel31
  - number: '31.3'
    text: |-
      Bij de in het eerste lid bedoelde algemene maatregel van bestuur wordt, zoveel mogelijk overeenkomstig en zo
      nodig in afwijking van het bij of krachtens dit hoofdstuk bepaalde, bepaald op welke wijze deze verzoeken worden
      ingediend en gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel31
  - number: '31.4'
    text: |-
      Een krachtens het eerste lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan acht
      weken na de datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel31
  - number: '32.1'
    text: |-
      De voorzitter van het centraal stembureau besluit, indien er verzoeken zijn ingediend, binnen een week na afloop
      van de termijn van vier weken, bedoeld in [artikel 29][ref1], of het inleidend verzoek tot het houden van een
      referendum wordt toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel29
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '29'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '32.2'
    text: |-
      De voorzitter besluit slechts dat het inleidend verzoek niet wordt toegelaten, indien het aantal
      ingediende verzoeken minder bedraagt dan tienduizend, dan wel, indien toepassing is gegeven aan
      [artikel 33, tweede lid][ref1], het aantal geldige verzoeken minder bedraagt dan tienduizend.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel33
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '33'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '33.1'
    text: |-
      De voorzitter van het centraal stembureau stelt, indien er verzoeken zijn ingediend, het aantal ingediende
      verzoeken vast.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel33
  - number: '33.2'
    text: 'Indien er tienduizend of meer verzoeken zijn ingediend stelt de voorzitter tevens vast:'
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel33
  - number: 33.2.a
    text: het aantal geldige verzoeken,
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel33
  - number: 33.2.b
    text: het aantal ongeldige verzoeken.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel33
  - number: '33.3'
    text: 'Ongeldig zijn de verzoeken die:'
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel33
  - number: 33.3.a
    text: |-
      zijn ingediend op een lijst die door de voorzitter van het centraal stembureau is ontvangen voordat de termijn,
      bedoeld in [artikel 29][ref1], is aangevangen;


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel29
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '29'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 33.3.b
    text: |-
      zijn ingediend op een lijst die door de voorzitter van het centraal stembureau is ontvangen nadat de termijn,
      bedoeld in [artikel 29][ref1], is verstreken;


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel29
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '29'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 33.3.c
    text: |-
      niet zijn ingediend op een lijst als bedoeld in[ artikel 29][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel29
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '29'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 33.3.d
    text: |-
      niet alle gegevens bevatten die op grond van [artikel 29, derde lid][ref1], op de lijst moeten worden geplaatst;


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel29
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '29'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 33.3.e
    text: de gegevens bevatten van een persoon die niet kiesgerechtigd is;
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel33
  - number: 33.3.f
    text: onjuiste gegevens bevatten;
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel33
  - number: 33.3.g
    text: |-
      afkomstig zijn van personen die meer dan één verzoek tot het houden van een referendum over dezelfde wet hebben
      ingediend.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel33
  - number: '33.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld betreffende de controle van
      de verzoeken.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel33
  - number: '34.1'
    text: |-
      De controle van de verzoeken die niet reeds op grond van [artikel 33, derde lid, onder a tot en met c][ref1],
      ongeldig zijn verklaard, kan geschieden door middel van een steekproef.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel33
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '33'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '34.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld betreffende de wijze waarop de steekproef
      wordt uitgevoerd. Deze regels hebben in ieder geval betrekking op de omvang van de steekproef, de kenmerken op
      basis waarvan de selectie voor de steekproef wordt bepaald, de controle van de verzoeken van kiesgerechtigde
      personen met een woonplaats buiten Nederland, en de vaststelling van het totaal aantal geldige verzoeken op basis
      van de uitkomst van de steekproef.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel34
  - number: '35.1'
    text: |-
      Indien de voorzitter besluit een verzoek ongeldig te verklaren, wordt dit met een vermelding van de reden op de
      lijst aangetekend.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel35
  - number: '35.2'
    text: |-
      De voorzitter van het centraal stembureau legt een kopie van een lijst waarop één of meer verzoeken ongeldig zijn
      verklaard gedurende twee weken na de dag waarop hij het besluit, bedoeld in [artikel 32][ref1], heeft genomen voor
      een ieder ter inzage.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel32
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '32'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '36.1'
    text: |-
      Nadat de werkzaamheden, bedoeld in de[ artikelen 33][ref1], [34][ref2] en [35, eerste lid][ref3], zijn beëindigd,
      worden de lijsten in een pak gedaan. Het pak wordt verzegeld.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0036443#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0036443#Artikel35
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '33'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0036443
        artikel: '34'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0036443
        artikel: '35'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '36.2'
    text: 'Op het pak wordt vermeld:'
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel36
  - number: 36.2.a
    text: het aantal ingediende verzoeken;
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel36
  - number: 36.2.b
    text: |-
      het aantal geldige en ongeldige verzoeken, indien [artikel 33, tweede lid][ref1], is toegepast;


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel33
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '33'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: 36.2.c
    text: een aanduiding van de wet waarop de verzoeken betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel36
  - number: '37.1'
    text: Nadat alle werkzaamheden zijn beëindigd, wordt daarvan aanstonds proces-verbaal opgemaakt.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel37
  - number: '37.2'
    text: Bij ministeriële regeling wordt voor het proces-verbaal een model vastgesteld.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel37
  - number: '38.1'
    text: |-
      De voorzitter van het centraal stembureau maakt het besluit inzake de toelating van het inleidend verzoek zo
      spoedig mogelijk bekend, door kennisgeving van het besluit in de Staatscourant. Een afschrift van het proces-
      verbaal wordt voor een ieder ter inzage gelegd.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel38
  - number: '38.2'
    text: |-
      De voorzitter doet van het besluit inzake de toelating van het inleidend verzoek mededeling aan de voorzitter
      van de Tweede Kamer der Staten-Generaal, aan de voorzitter van de Eerste Kamer der Staten-Generaal en aan Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel38
  - number: '39.1'
    text: |-
      De voorzitter van het centraal stembureau draagt er zorg voor dat het verzegelde pak, bedoeld
      in[ artikel 36][ref1], wordt vernietigd nadat drie maanden zijn verstreken nadat onherroepelijk is vastgesteld
      dat geen referendum zal worden gehouden of, indien de officier van justitie of de rechter-commissaris in het
      kader van een strafrechtelijk onderzoek een verzoek heeft gedaan tot overdracht van het verzegelde pak, nadat dit
      onderzoek is afgerond, of, indien strafvervolging is ingesteld of grond van deze wet, nadat er een onherroepelijke
      rechterlijke uitspraak is. Van deze vernietiging wordt proces-verbaal opgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel36
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '36'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '39.2'
    text: |-
      De voorzitter is nadat onherroepelijk is vastgesteld dat geen referendum zal worden gehouden bevoegd het verzegelde
      pak, bedoeld in [artikel 36][ref1], ten dienst van een onderzoek naar enig strafbaar feit over te dragen aan de
      officier van justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel36
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '36'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '40'
    text: |-
      Het definitieve verzoek tot het houden van een referendum wordt gevormd door het totale aantal geldige verklaringen
      ter ondersteuning van het inleidend verzoek.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel40
  - number: '41.1'
    text: |-
      Binnen zes weken na de bekendmaking van het besluit van de voorzitter van het centraal stembureau dat het inleidend
      verzoek is toegelaten, dan wel van de uitspraak van de Afdeling bestuursrechtspraak van de Raad van State ingevolge
      [artikel 92, tweede lid][ref1], dat een beroep tegen het besluit van de voorzitter van het centraal stembureau dat
      het inleidend verzoek niet wordt toegelaten gegrond wordt verklaard, kan iedere kiesgerechtigde bij de voorzitter
      van het centraal stembureau een verklaring tot ondersteuning van het inleidend verzoek afleggen. De verklaring tot
      ondersteuning dient binnen de termijn van zes weken door de voorzitter te zijn ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel92
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '92'
        hoofdstuk: '12'
  - number: '41.2'
    text: |-
      Voor de beoordeling of aan de vereisten voor het kiesrecht is voldaan, is bepalend of dit op enig tijdstip binnen
      de in het eerste lid bedoelde termijn het geval was.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel41
  - number: '41.3'
    text: |-
      Een verklaring tot ondersteuning wordt afgelegd door het plaatsen van de voornaam, de achternaam, het adres, de
      geboortedatum, de geboorteplaats en de handtekening op een lijst of een fotokopie daarvan.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel41
  - number: '41.4'
    text: Op de lijst kunnen ondersteuningsverklaringen van één of meerdere kiesgerechtigden staan.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel41
  - number: '41.5'
    text: |-
      De lijst wordt kosteloos beschikbaar gesteld door het centraal stembureau en is reeds voorzien van een benaming
      van de wet waarop de ondersteuningsverklaring betrekking heeft. Bij ministeriële regeling wordt voor de lijst een
      model gesteld.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel41
  - number: '41.6'
    text: |-
      Een door de voorzitter van het centraal stembureau aan te wijzen persoon tekent bij ontvangst van een lijst hierop
      de datum van ontvangst aan.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel41
  - number: '41.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld voor het afleggen van
      ondersteuningsverklaringen door de kiesgerechtigde die zijn werkelijke woonplaats buiten Nederland heeft.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel41
  - number: '42.1'
    text: Een kiesgerechtigde mag niet meer dan één verklaring tot ondersteuning van hetzelfde inleidend verzoek afleggen.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel42
  - number: '42.2'
    text: Een afgelegde ondersteuningsverklaring kan niet worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel42
  - number: '43.1'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat ondersteuningsverklaringen in afwijking van
      [artikel 41][ref1] op elektronische wijze kunnen worden afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel41
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '41'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: '43.2'
    text: |-
      Tot het bij algemene maatregel van bestuur openen van deze mogelijkheid kan slechts worden overgegaan indien
      verzekerd is dat die wijze van het afleggen van ondersteuningsverklaringen geen afbreuk doet aan de vereisten van
      toezicht en betrouwbaarheid.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel43
  - number: '43.3'
    text: |-
      Bij de in het eerste lid bedoelde algemene maatregel van bestuur wordt, zoveel mogelijk overeenkomstig
      en zo nodig in afwijking van het bij of krachtens dit hoofdstuk bepaalde, bepaald op welke wijze deze
      ondersteuningsverklaringen worden afgelegd en gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel43
  - number: '43.4'
    text: |-
      Een krachtens het eerste lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan acht
      weken na de datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel43
  - number: '44.1'
    text: |-
      Het centraal stembureau besluit binnen twee weken na afloop van de termijn van zes weken, bedoeld in
      [artikel 41][ref1], of het definitieve verzoek tot het houden van een referendum wordt toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel41
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '41'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: '44.2'
    text: |-
      Het centraal stembureau besluit slechts dat het definitieve verzoek niet wordt toegelaten, indien het aantal
      afgelegde ondersteuningsverklaringen minder bedraagt dan driehonderdduizend, dan wel, indien toepassing is
      gegeven aan [artikel 45, tweede lid][ref1], het aantal geldige ondersteuningsverklaringen minder bedraagt dan
      driehonderdduizend.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel45
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '45'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: '45.1'
    text: |-
      Het centraal stembureau stelt, indien er ondersteuningsverklaringen zijn afgelegd, het aantal afgelegde
      ondersteuningsverklaringen vast.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel45
  - number: '45.2'
    text: |-
      Indien er driehonderdduizend of meer ondersteuningsverklaringen zijn afgelegd, stelt het centraal stembureau tevens
      vast:
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel45
  - number: 45.2.a
    text: het aantal geldige ondersteuningsverklaringen,
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel45
  - number: 45.2.b
    text: het aantal ongeldige ondersteuningsverklaringen.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel45
  - number: '45.3'
    text: 'Ongeldig zijn de ondersteuningsverklaringen die:'
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel45
  - number: 45.3.a
    text: |-
      zijn ingediend op een lijst die door de voorzitter van het centraal stembureau is ontvangen voordat de termijn,
      bedoeld in [artikel 41][ref1], is aangevangen;


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel41
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '41'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 45.3.b
    text: |-
      zijn ingediend op een lijst die door de voorzitter van het centraal stembureau is ontvangen nadat de termijn,
      bedoeld in [artikel 41][ref1], is verstreken;


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel41
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '41'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 45.3.c
    text: |-
      niet zijn ingediend op een lijst als bedoeld in [artikel 41][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel41
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '41'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 45.3.d
    text: |-
      niet alle gegevens bevatten die op grond van [artikel 41, derde lid][ref1], op de lijst moeten worden geplaatst;


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel41
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '41'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 45.3.e
    text: de gegevens bevatten van een persoon die niet kiesgerechtigd is;
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel45
  - number: 45.3.f
    text: onjuiste gegevens bevatten;
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel45
  - number: 45.3.g
    text: |-
      afkomstig zijn van personen die meer dan één verzoek tot het houden van een referendum over dezelfde wet hebben
      ingediend.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel45
  - number: '45.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld betreffende de controle van
      de ondersteuningsverklaringen.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel45
  - number: '46.1'
    text: |-
      De controle van de ondersteuningsverklaringen die niet reeds op grond van
      [artikel 45, derde lid, onder a tot en met c][ref1], ongeldig zijn verklaard, kan geschieden door middel van een
      steekproef.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel45
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '45'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: '46.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld betreffende de wijze waarop de steekproef
      wordt uitgevoerd. Deze regels hebben in ieder geval betrekking op de omvang van de steekproef, de kenmerken op
      basis waarvan de selectie voor de steekproef wordt bepaald, de controle van de ondersteuningsverklaringen van
      kiesgerechtigde personen met een woonplaats buiten Nederland, en de vaststelling van het totaal aantal geldige
      ondersteuningsverklaringen op basis van de uitkomst van de steekproef.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel46
  - number: '47.1'
    text: |-
      Het centraal stembureau houdt op de tweede dag na afloop van de termijn van twee weken, bedoeld in
      [artikel 44, eerste lid][ref1], om tien uur een openbare zitting.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel44
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '44'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: '47.2'
    text: |-
      Dag en uur van de zitting van het centraal stembureau worden door de voorzitter tijdig bekendgemaakt. De wijze van
      bekendmaking wordt geregeld bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel47
  - number: '47.3'
    text: De voorzitter is belast met de handhaving van de orde tijdens de zitting.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel47
  - number: '47.4'
    text: Door de aanwezige kiesgerechtigden kunnen mondeling bezwaren worden ingebracht.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel47
  - number: '48'
    text: 'Op de zitting maakt de voorzitter van het centraal stembureau aan de aanwezige kiezers bekend:'
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel48
  - number: 48.a
    text: het aantal afgelegde ondersteuningsverklaringen,
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel48
  - number: 48.b
    text: |-
      het aantal geldige en ongeldige ondersteuningsverklaringen, indien [artikel 45, tweede lid][ref1], is toegepast;


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel45
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '45'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 48.c
    text: |-
      het besluit, bedoeld in [artikel 44, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel44
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '44'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: '49.1'
    text: |-
      Bij twijfel over de geldigheid van de verklaring en bij ongeldigheid van de verklaring maakt de voorzitter de
      redenen hiervoor, alsmede de beslissing daaromtrent, onmiddellijk bekend.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel49
  - number: '49.2'
    text: Indien een van de aanwezige kiezers dit verlangt, wordt de betreffende lijst getoond.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel49
  - number: '49.3'
    text: |-
      Indien wordt besloten een verklaring ongeldig te verklaren, wordt dit met opgave van redenen op de lijst
      aangetekend.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel49
  - number: '49.4'
    text: |-
      De voorzitter van het centraal stembureau legt een kopie van een lijst waarop één of meer
      ondersteuningsverklaringen ongeldig zijn verklaard gedurende twee weken na de dag van de openbare zitting, bedoeld
      in [artikel 47, eerste lid][ref1], voor een ieder ter inzage.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel47
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '47'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: '50'
    text: |-
      Het besluit tot toelating van een definitief verzoek houdt tevens de vaststelling in dat een referendum zal worden
      gehouden.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel50
  - number: '51.1'
    text: |-
      Nadat de werkzaamheden, bedoeld in [artikel 48][ref1] en [49, eerste tot en met derde lid][ref2], zijn beëindigd,
      worden de lijsten in een pak gedaan. Het pak wordt verzegeld.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0036443#Artikel49
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '48'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0036443
        artikel: '49'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: '51.2'
    text: 'Op het pak wordt vermeld:'
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel51
  - number: 51.2.a
    text: het aantal afgelegde ondersteuningsverklaringen;
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel51
  - number: 51.2.b
    text: |-
      het aantal geldige en ongeldige ondersteuningsverklaringen indien [artikel 45, tweede lid][ref1], is toegepast;


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel45
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '45'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 51.2.c
    text: een aanduiding van de wet waarop de ondersteuningsverklaringen betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel51
  - number: '52.1'
    text: Nadat alle werkzaamheden zijn beëindigd, wordt daarvan aanstonds proces-verbaal opgemaakt.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel52
  - number: '52.2'
    text: Het proces-verbaal wordt door alle aanwezige leden van het centraal stembureau ondertekend.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel52
  - number: '52.3'
    text: Bij ministeriële regeling wordt voor het proces-verbaal een model vastgesteld.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel52
  - number: '53.1'
    text: |-
      De voorzitter van het centraal stembureau maakt het besluit inzake de toelating van het definitieve verzoek zo
      spoedig mogelijk openbaar door mededeling van het besluit in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel53
  - number: '53.2'
    text: |-
      De voorzitter doet van het besluit inzake de toelating van het inleidend verzoek mededeling aan de voorzitter
      van de Tweede Kamer der Staten-Generaal, aan de voorzitter van de Eerste Kamer der Staten-Generaal en aan Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel53
  - number: '54.1'
    text: |-
      De voorzitter van het centraal stembureau draagt er zorg voor dat het verzegelde pak, bedoeld in
      [artikel 51][ref1], wordt vernietigd nadat drie maanden zijn verstreken nadat onherroepelijk is vastgesteld dat
      geen referendum zal worden gehouden of, indien de officier van justitie of de rechter-commissaris in het kader
      van een strafrechtelijk onderzoek een verzoek heeft gedaan tot overdracht van het verzegelde pak, nadat dit
      onderzoek is afgerond, of, indien strafvervolging is ingesteld of grond van deze wet, nadat er een onherroepelijke
      rechterlijke uitspraak is. Van deze vernietiging wordt proces-verbaal opgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel51
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '51'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: '54.2'
    text: |-
      De voorzitter is nadat onherroepelijk is vastgesteld dat geen referendum zal worden gehouden bevoegd het verzegelde
      pak, bedoeld in [artikel 51][ref1], ten dienst van een onderzoek naar enig strafbaar feit over te dragen aan de
      officier van justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel51
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '51'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: '55.1'
    text: |-
      Binnen een week nadat het besluit van het centraal stembureau dat een referendum zal worden gehouden,
      onherroepelijk is geworden, stelt de referendumcommissie, na overleg met Onze Minister, de dag van de stemming
      vast. De bekendmaking van het besluit geschiedt door kennisgeving in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel55
  - number: '55.2'
    text: |-
      Als dag van de stemming wordt een woensdag aangewezen binnen een termijn die aanvangt op de vijfentachtigste dag en
      eindigt zes maanden na de dagtekening van het besluit.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel55
  - number: '55.3'
    text: |-
      Voor de berekening van de termijn van zes maanden wordt de periode van 1 juli tot en met 31 augustus niet
      meegeteld.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel55
  - number: '56.1'
    text: |-
      Indien binnen de in [artikel 55, tweede lid][ref1], bedoelde termijn een of meer stemmingen voor een verkiezing van
      de leden van de Tweede Kamer der Staten-Generaal, provinciale staten, de algemene besturen van waterschappen, de
      gemeenteraden of het Europees Parlement plaatsvinden, of een ander referendum op basis van deze wet, wordt als dag
      van de stemming voor het referendum aangewezen de dag van die stemming, onderscheidenlijk één van die stemmingen.


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel55
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '55'
        hoofdstuk: '8'
  - number: '56.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven met het oog op de combinatie
      van stemmingen als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel56
  - number: '57.1'
    text: |-
      De tekst van een aan een referendum onderworpen wet is gedurende vier weken voorafgaande aan de stemming kosteloos
      het gemeentehuis van elke gemeente verkrijgbaar. De burgemeester brengt dit ter openbare kennis.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel57
  - number: '57.2'
    text: De referendumcommissie verschaft informatie over een aan een referendum onderworpen wet.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel57
  - number: '57.3'
    text: |-
      Bij een referendum over de goedkeuring van een verdrag geldt het in dit artikel bepaalde mede ten aanzien van de
      tekst van het verdrag.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel57
  - number: '58.1'
    text: |-
      Op het bij de stemming te bezigen stembiljet wordt de vraag vermeld of de kiezer voor of tegen de aan het
      referendum onderworpen wet is, met dien verstande dat de referendumcommissie vaststelt hoe de wet wordt aangeduid.
      Op de achterzijde wordt de handtekening van de voorzitter van het centraal stembureau gedrukt.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel58
  - number: '58.2'
    text: Bij ministeriële regeling wordt voor het stembiljet een model vastgesteld.
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel58
  - number: '59'
    text: |-
      Ten aanzien van de stemming zijn de [artikelen J 1, tweede tot en met vijfde lid][ref1], [J 4][ref2], [J 4a][ref3],
      [J 5, eerste lid][ref4], [J 7 tot en met J 8][ref5],[ J 10][ref6], [J 11, eerste en tweede lid][ref7],
      [J 12 tot en met J 19][ref8], [J 21 tot en met J 31][ref9] en [J 35 tot en met J 38 van de Kieswet][ref10] van
      toepassing, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0004627
      [ref2]: https://wetten.overheid.nl/BWBR0004627
      [ref3]: https://wetten.overheid.nl/BWBR0004627
      [ref4]: https://wetten.overheid.nl/BWBR0004627
      [ref5]: https://wetten.overheid.nl/BWBR0004627
      [ref6]: https://wetten.overheid.nl/BWBR0004627
      [ref7]: https://wetten.overheid.nl/BWBR0004627
      [ref8]: https://wetten.overheid.nl/BWBR0004627
      [ref9]: https://wetten.overheid.nl/BWBR0004627
      [ref10]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0036443/2018-07-10#Artikel59
    references:
      - id: ref1
