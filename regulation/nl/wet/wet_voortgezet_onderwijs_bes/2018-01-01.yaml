  - number: '64'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen voor elke soort van scholen of voor aan scholen
      als bedoeld in [artikel 17][ref1] verzorgde profielen voorwaarden voor de toelating en voorschriften omtrent
      verwijdering en voorwaardelijke bevordering worden vastgesteld. De algemene maatregel van bestuur bedoeld
      in de eerste volzin houdt in elk geval voorschriften in met betrekking tot de voorwaarden voor de toelating
      tot de scholen, bedoeld in de [artikelen 13][ref2], [14][ref3], [15][ref4] en [17][ref5]. Definitieve
      verwijdering van een leerling waarop de [Leerplichtwet BES][ref6] van toepassing is, vindt niet plaats dan
      nadat het bevoegd gezag ervoor heeft zorggedragen dat een andere school, dan wel een instelling als bedoeld in
      [artikel 1, onder c, van de Leerplichtwet BES][ref7] bereid is de leerling toe te laten.

      2 Voor het volgen van een vorm van onderwijs als onderscheiden in [artikel 6][ref8] aan een school wordt
      uitsluitend als leerling toegelaten degene waarvan de ouders aantonen, dan wel, indien hij meerderjarig en
      handelingsbekwaam is, degene die aantoont dat hij:

      a. de Nederlandse nationaliteit bezit of op grond van een wettelijke bepaling als Nederlander wordt behandeld,

      b. vreemdeling is en jonger is dan 18 jaar op de eerste schooldag waarop de vorm van voortgezet onderwijs als
      onderscheiden in [artikel 6][ref9] begint waarvoor voor de eerste maal toelating wordt gewenst,

      c. vreemdeling is, 18 jaar of ouder is op de eerste schooldag waarop de vorm van voortgezet
      onderwijs als onderscheiden in [artikel 6][ref10] begint waarvoor voor de eerste maal toelating
      wordt gewenst en op die dag rechtmatig verblijf houdt in de zin van [3][ref11], [5a][ref12] of
      [6 van de Wet toelating en uitzetting BES][ref13], of

      d. vreemdeling is, niet meer voldoet aan een van de voorwaarden, genoemd onder b of c, en eerder in overeenstemming
      met een van die onderdelen voor een vorm van voortgezet onderwijs als onderscheiden in [artikel 6][ref14] is
      toegelaten tot een school, welke vorm van voortgezet onderwijs nog steeds wordt gevolgd en nog niet is voltooid.

      3 Indien na de toelating tot de school blijkt dat deze op welke grond dan ook niet in overeenstemming met het
      tweede lid heeft plaatsgevonden, wordt de leerling onmiddellijk verwijderd.

      4 De toelating wordt niet afhankelijk gesteld van een andere dan een bij of krachtens de wet geregelde bijdrage.

      5

      6 Op een bezwaarschrift ter zake van de toelating of verwijdering van leerlingen, beslist het
      bevoegd gezag, voor zover het een bevoegd gezag van een openbare school betreft in afwijking van
      [artikel 69, eerste lid, van de Wet administratieve rechtspraak BES][ref15], binnen vier weken na ontvangst van het
      bezwaarschrift, doch niet eerder dan nadat de kandidaat-leerling, respectievelijk de leerling en, indien deze nog
      niet meerderjarig is, ook diens ouders, in de gelegenheid is, respectievelijk zijn gesteld, te worden gehoord en
      kennis heeft respectievelijk hebben kunnen nemen van de op die besluiten betrekking hebbende adviezen of rapporten.


