  - number: '120'
    text: |-
      1 Het bevoegd gezag kan bij Onze Minister een aanvraag indienen om een school of scholengemeenschap voor
      bekostiging in aanmerking te brengen. De aanvraag wordt ingediend voor 1 november.

      2 Elke aanvraag vermeldt de schoolsoorten, de verlangde richting en de plaats van vestiging van de school of
      scholengemeenschap en gaat vergezeld van een prognose over de te verwachten omvang.

      3 Onze Minister besluit met inachtneming van [artikel 119][ref1] voor 1 mei volgend op de aanvraag of de school
      of scholengemeenschap voor bekostiging in aanmerking wordt gebracht. Indien het besluit niet voor 1 mei kan worden
      genomen, stelt Onze Minister de aanvrager daarvan in kennis en noemt hij daarbij een termijn waarbinnen het besluit
      wel tegemoet kan worden gezien.

      4 De bekostiging vangt aan op 1 augustus van enig kalenderjaar, ten vroegste in het eerste en ten laatste in het
      zesde kalenderjaar na het besluit van Onze Minister. Behoudens in het laatste geval vangt de bekostiging aan in
      het kalenderjaar volgend op het kalenderjaar waarin het bevoegd gezag, voor 1 augustus, heeft aangetoond dat het
      bestuurscollege van het betreffende openbaar lichaam uiterlijk met ingang van 1 augustus van het eerstgenoemde
      kalenderjaar de benodigde huisvesting ter beschikking zal stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel119
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel120
    references:
      - id: ref1
