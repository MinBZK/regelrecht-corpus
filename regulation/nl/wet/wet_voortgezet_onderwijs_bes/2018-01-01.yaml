  - number: '112'
    text: |-
      1 Onze Minister kan de school, die ten aanzien van de duur van de cursus, het schoolplan en de bevoegdheden van de
      leraren overeenkomt met een school voor voorbereidend wetenschappelijk onderwijs, voor hoger algemeen voortgezet
      onderwijs, voor middelbaar algemeen voortgezet onderwijs of voor voorbereidend beroepsonderwijs, als bedoeld in
      [artikel 72, eerste lid][ref1], aanwijzen als bevoegd om aan de leerlingen op grond van het met gunstig gevolg
      afleggen van een eindexamen aan de school het diploma uit te reiken, bedoeld in het derde lid van dat artikel.

      1a [Artikel 72, leden 1a en 1b][ref2], zijn van overeenkomstige toepassing op de bevoegdheid het eindexamen af te
      nemen, bedoeld in het eerste lid.

      2 [Artikel 72, tweede, vierde en vijfde lid][ref3], is op dit eindexamen van toepassing.

      3 Onze Minister besluit binnen zes maanden na ontvangst van een aanvraag. Indien de beschikking niet binnen zes
      maanden kan worden gegeven, stelt Onze Minister de aanvrager daarvan in kennis en noemt hij daarbij een termijn
      waarbinnen de beschikking wel tegemoet kan worden gezien.


