  - number: '2'
    text: |-
      1 Het voortgezet onderwijs, bedoeld in deze wet, omvat het onderwijs dat wordt gegeven na het basisonderwijs. Het
      omvat niet educatie en beroepsonderwijs als bedoeld in de [Wet educatie en beroepsonderwijs BES][ref1] en het hoger
      onderwijs.

      2 Het onderwijs wordt zodanig ingericht dat de leerlingen een ononderbroken ontwikkelingsproces kunnen doorlopen.
      Het wordt afgestemd op de voortgang in de ontwikkeling van de leerlingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028395
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028395
  - number: '3'
    text: Voortgezet onderwijs mag slechts worden gegeven door degene die daartoe ingevolge deze wet bevoegd is.
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel3
  - number: '4'
    text: |-
      1 Indien het bevoegd gezag op enigerlei wijze bekend is geworden dat een ten behoeve van zijn school met
      taken belast persoon zich mogelijk schuldig maakt of heeft gemaakt aan een misdrijf tegen de zeden als bedoeld
      in het [Tweede Boek, Titel XIV, van het Wetboek van Strafrecht BES][ref1] jegens een minderjarige leerling
      van de school, treedt het bevoegd gezag onverwijld in overleg met de vertrouwensinspecteur, bedoeld in
      [artikel 6 van de Wet op het onderwijstoezicht][ref2].

      2 Indien uit het overleg, bedoeld in het eerste lid, moet worden geconcludeerd dat er sprake is van
      een redelijk vermoeden dat de desbetreffende persoon zich schuldig heeft gemaakt aan een misdrijf
      als bedoeld in het eerste lid jegens een minderjarige leerling van de school, doet het bevoegd
      gezag onverwijld aangifte bij een opsporingsambtenaar als bedoeld in [artikel 1][ref3] juncto
      [artikel 184 van het Wetboek van Strafvordering BES][ref4], en stelt het bevoegd gezag de vertrouwensinspecteur
      daarvan onverwijld in kennis. Voordat het bevoegd gezag overgaat tot het doen van aangifte, stelt het de ouders
      van de betrokken leerling, onderscheidenlijk de betreffende ten behoeve van de school met taken belaste persoon,
      hiervan op de hoogte.

      3 Indien een personeelslid op enigerlei wijze bekend is geworden dat een ten behoeve van de school met taken belast
      persoon zich mogelijk schuldig maakt of heeft gemaakt aan een misdrijf als bedoeld in het eerste lid jegens een
      minderjarige leerling van de school, stelt het personeelslid het bevoegd gezag daarvan onverwijld in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0028570
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0028681#Artikel184
