  - number: 12b
    text: |-
      1 In elk schooljaar wordt op ten minste 189 dagen onderwijs verzorgd.

      2 In afwijking van het in het eerste lid genoemde aantal dagen behoeft in het laatste leerjaar geen onderwijs te
      worden verzorgd vanaf de aanvang van het eerste tijdvak waarin het centraal eindexamen wordt afgenomen.

      3 Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gesteld omtrent vakanties en andere
      dagen waarop geen onderwijs behoeft te worden verzorgd.

      4 Bij ministeriële regeling kunnen begin en eind van vakanties worden vastgesteld, die niet voor alle scholen
      gelijk behoeven te zijn. Daarbij kan het aantal dagen, genoemd in het eerste lid, voor een daarbij aan te geven
      groep scholen, hoger of lager worden vastgesteld indien dit noodzakelijk is in verband met de spreiding van de
      landelijk vastgestelde vakantie over verschillende delen van Nederland.
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel12b
  - number: '13'
    text: |-
      1 Voorbereidend wetenschappelijk onderwijs is het onderwijs dat is ingericht ter voorbereiding op aansluitend
      wetenschappelijk onderwijs en dat mede algemene vorming omvat. Voorbereidend wetenschappelijk onderwijs wordt
      gegeven aan scholen voor voorbereidend wetenschappelijk onderwijs. Deze worden onderscheiden in gymnasia en
      athenea, elk met een cursusduur van zes jaren.

      2 Aan de gymnasia wordt in elk geval onderwijs verzorgd in Latijnse taal en cultuur en Griekse taal en cultuur.
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel13
  - number: '14'
    text: |-
      Hoger algemeen voortgezet onderwijs is het onderwijs dat is ingericht ter voorbereiding op aansluitend hoger
      beroepsonderwijs en dat mede algemene vorming omvat. Het hoger algemeen voortgezet onderwijs wordt gegeven:

      a. aan scholen met een cursusduur van vijf jaren;

      b. aan afdelingen van scholen voor middelbaar algemeen voortgezet onderwijs. Deze hebben een cursusduur van twee
      jaren en vangen aan na vier jaren middelbaar algemeen voortgezet onderwijs.
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel14
  - number: '15'
    text: |-
      Middelbaar algemeen voortgezet onderwijs is het onderwijs dat is ingericht ter voorbereiding op aansluitend
      beroepsonderwijs dan wel op hoger algemeen voortgezet onderwijs, en dat mede algemene vorming omvat. Het middelbaar
      algemeen voortgezet onderwijs wordt gegeven aan scholen met een cursusduur van vier jaren.
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel15
  - number: '16'
    text: |-
      1 Aan scholen voor middelbaar algemeen voortgezet onderwijs wordt onderwijs in de theoretische leerweg gegeven.

      2 Het onderwijs aan scholen voor middelbaar algemeen voortgezet onderwijs is met ingang van het derde leerjaar
      ingericht volgens profielen. Een profiel is een in schooltijd verzorgd samenhangend onderwijsprogramma, zodanig
      ingericht dat het biedt:

      a. een algemene maatschappelijke voorbereiding en persoonlijke vorming,

      b. een voorbereiding op naar inhoud verwante opleidingen in het aansluitend beroepsonderwijs, en

      c. een voorbereiding op het hoger algemeen voortgezet onderwijs.

      3 De school verzorgt een of meer profielen. De profielen zijn:

      a. techniek,

      b. zorg en welzijn,

      c. economie, en

      d. landbouw.

      4 Elk profiel bestaat uit:

      a. een gemeenschappelijk deel, dat voor alle profielen gelijk is,

      b. een profieldeel, dat kenmerkend is voor dat profiel, en

      c. een vrij deel, dat bestaat uit door de leerling te kiezen vakken en andere programma-onderdelen.

      5 Het gemeenschappelijk deel van elk profiel in de theoretische leerweg omvat Nederlandse taal, Engelse taal,
      maatschappijleer, lichamelijke opvoeding en ten minste één van de vakken behorende tot de beeldende vorming,
      muziek, dans of drama.

      6 Het profieldeel van de theoretische leerweg omvat wat betreft:

      a. het profiel techniek: wiskunde en natuur- en scheikunde I,

      b. het profiel zorg en welzijn: biologie en, ter keuze van de leerling, wiskunde, maatschappijkunde, geschiedenis
      en staatsinrichting, of aardrijkskunde, met dien verstande dat het bevoegd gezag beslist welke van de laatste drie
      vakken wordt of worden aangeboden,

      c. het profiel economie: economie en, ter keuze van de leerling, wiskunde, Spaanse taal of Franse taal,

      d. het profiel landbouw: wiskunde en, ter keuze van de leerling, biologie of natuur- en scheikunde I.

      7 Het vrije deel van de theoretische leerweg:

      a. omvat door de leerling te kiezen vakken, genoemd in het zesde lid,

      b. kan omvatten natuur- en scheikunde II, Papiaments, Duitse taal, vakken behorende tot de beeldende vorming,
      muziek, dans, drama, lichamelijke opvoeding 2 en informatietechnologie, door de leerling te kiezen, en

      c. kan omvatten door het bevoegd gezag vast te stellen vakken en programmaonderdelen.

      7a Het bevoegd gezag stelt de leerling in de gelegenheid om, indien de leerling dat wenst, naast het
      onderwijsprogramma, bestaande uit de in het vierde lid bedoelde delen, beroepsgerichte keuzevakken als bedoeld in
      [artikel 29][ref1] te volgen. Het achtste en tiende lid van artikel 29 zijn van overeenkomstige toepassing.

      8 Het bevoegd gezag beslist welke keuzetaal, genoemd in het zesde lid, onderdeel c, en welke vakken, genoemd in het
      zevende lid, onderdeel b, worden aangeboden. Het bevoegd gezag kan tevens beslissen dat door het bevoegd gezag aan
      te wijzen vakken en andere programmaonderdelen, bedoeld in het zevende lid, onderdeel c, door alle leerlingen in
      het vrije deel moeten worden gevolgd.

      9 Het bevoegd gezag kan de leerling in de gelegenheid stellen, in plaats van de vakken, genoemd in het vijfde,
      zesde en zevende lid, onderdeel b, de overeenkomstige vakken, genoemd in dan wel aangewezen op grond van de
      [artikelen 39][ref2] en [40][ref3] te volgen.

      10 Bij algemene maatregel van bestuur worden voorschriften vastgesteld over de mogelijkheid van vrijstelling en de
      bevoegdheid van het bevoegd gezag om ontheffing te verlenen van onderdelen van dit artikel. Onverminderd het zesde
      en zevende lid, kan bij algemene maatregel van bestuur worden vastgesteld het door alle leerlingen in het derde
      leerjaar te volgen minimum aantal vakken waarin eindexamen kan worden afgelegd, alsmede welke vakken het betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel40
