  - number: '134'
    text: |-
      1 In afwijking van de termijnen genoemd in de [artikelen 132][ref1] en [133][ref2], beslist het bestuurscollege
      binnen vier weken op een aanvraag voor een voorziening in de huisvesting die gelet op de voortgang van het
      onderwijs geen uitstel kan lijden.

      2 Het bestuurscollege wijst de aanvraag af, indien:

      a. de beslissing over de voorziening kan worden genomen met inachtneming van de termijn, bedoeld in
      [artikel 133, eerste lid][ref3], of

      b. een van de weigeringsgronden, genoemd in
      [artikel 135, eerste lid, onderdelen a tot en met d en f, en tweede lid][ref4], van toepassing is.


