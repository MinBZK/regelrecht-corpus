  - number: '150'
    text: |-
      1 Onze Minister verstrekt het expertisecentrum onderwijszorg subsidie.

      2 Bij ministeriële regeling kunnen regels worden gegeven over het verstrekken van subsidie aan het expertisecentrum
      onderwijszorg voor de taken, bedoeld in [artikel 69, eerste lid][ref1].

      3 De [titels 4.1][ref2] en [4.2 van de Algemene wet bestuursrecht][ref3] en de
      [artikelen 4 tot en met 19 van de Wet overige OCW-subsidies][ref4] zijn van toepassing op de subsidie.


