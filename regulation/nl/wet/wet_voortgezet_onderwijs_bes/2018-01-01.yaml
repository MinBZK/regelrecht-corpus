    text: |-
      1 Na de voorlopige vaststelling van het bedrag van de overschrijding, bedoeld in [artikel 163, zesde lid][ref1],
      keert het bestuurscollege aan het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school dat
      op grond van [artikel 164, eerste lid][ref2], aanspraak heeft op een uitkering, een voorschot uit. Het voorschot
      omvat het voorlopig vastgestelde bedrag van de overschrijding, berekend op de wijze als is aangegeven in artikel
      164, eerste en tweede lid.

      2 Het bestuurscollege is bevoegd tijdens het vijfjarig tijdvak op verzoek van het bevoegd gezag van een niet door
      het openbaar lichaam in stand gehouden school jaarlijks een deel van het naar verwachting uit te betalen voorschot
      in mindering daarop uit te keren.

      3 De bekendmaking van de beschikkingen tot voorlopige en definitieve vaststelling van het overschrijdingsbedrag,
      bedoeld in het zesde onderscheidenlijk [zevende lid van artikel 163][ref3], behelst tevens een staat van de
      voorzieningen als bedoeld in artikel 163, eerste lid, onderdeel f, waarin per kalenderjaar wordt aangegeven het
      verloop van de toevoegingen en de onttrekkingen aan de voorzieningen.


