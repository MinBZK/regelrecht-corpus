  - number: '51'
    text: |-
      1 De schoolgids bevat voor ouders en leerlingen informatie over de werkwijze van de school en bevat in elk geval
      informatie over:

      a. de doelen van het onderwijs en de resultaten die met het onderwijsleerproces worden bereikt, waaronder, in ieder
      geval met betrekking tot het schooljaar voorafgaande aan het schooljaar waarin de schoolgids wordt vastgesteld en
      onderscheiden naar soort onderwijs, voor elk leerjaar

      1°. het percentage leerlingen dat doorstroomt naar een hoger leerjaar of een ander soort onderwijs,

      2°. het percentage leerlingen dat de school zonder diploma verlaat en het percentage leerlingen dat voor het
      eindexamen slaagt,

      b. de wijze waarop de zorg voor leerlingen met specifieke onderwijsbehoeften wordt vormgegeven,

      c. 1°. het totaal aantal uren en het soort activiteiten dat als onderwijstijd als bedoeld in
      [artikel 12a, eerste lid][ref1], wordt geprogrammeerd, de vakanties en andere dagen waarop geen onderwijs wordt
      verzorgd, alsmede wat het beleid is ten aanzien van lesuitval,

      2°. de inrichting van het onderwijsprogramma voor de eerste twee leerjaren waarbij wordt aangegeven of sprake is
      van vakoverstijgende programmaonderdelen en de inzet van het personeel daarbij,

      d. de geldelijke bijdrage, bedoeld in [artikel 64, vierde lid][ref2], waarbij wordt vermeld dat deze vrijwillig is,

      e. de rechten en plichten van de ouders, de leerlingen en het bevoegd gezag, waaronder de informatie over de
      klachtenregeling, bedoeld in [artikel 52][ref3], waarbij wat betreft de leerlingen kan worden volstaan met
      vermelding van de rechten en plichten opgenomen in het leerlingenstatuut, bedoeld in [artikel 60][ref4],

      ea. het leerlingenparticipatiebeleid, waaronder wordt begrepen de wijze waarop leerlingen worden betrokken
      bij de vorming van het beleid van de school, alsmede de wijze waarop deze betrokkenheid wordt gefaciliteerd en
      gestimuleerd,

      f. de wijze waarop het bevoegd gezag omgaat met de in [artikel 50, eerste lid][ref5], omschreven bijdragen,

      g. het beleid met betrekking tot de veiligheid,

      h. het verzuimbeleid,

      i. de in het kader van het stelsel van kwaliteitszorg, bedoeld in [artikel 50, vierde lid][ref6], gedane
      bevindingen en de maatregelen die naar aanleiding daarvan zijn getroffen, en

      h. de persoon bij wie de taken, bedoeld in [artikel 4a, eerste lid, onderdeel c][ref7], zijn belegd, en

      i. de wijze waarop de identiteitscommissie, bedoeld in [artikel 109a][ref8], invulling geeft aan het openbare
      karakter onderscheidenlijk de identiteit voor zover het betreft een samenwerkingsschool.

      2 Bij algemene maatregel van bestuur kunnen voorschriften worden gegeven met betrekking tot de wijze waarop

      a. de resultaten worden beschreven die met het onderwijs worden bereikt, en

      b. de context wordt vermeld waarin de onder a bedoelde resultaten dienen te worden geplaatst.

      3 Het bevoegd gezag reikt de schoolgids uit aan de ouders dan wel de meerderjarige en handelingsbekwame leerling
      bij de inschrijving en jaarlijks na de vaststelling van de schoolgids.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel12a
