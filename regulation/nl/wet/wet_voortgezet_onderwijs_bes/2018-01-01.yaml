  - number: '116'
    text: |-
      1 Jaarlijks geeft het College voor examens gelegenheid om door het met gunstig gevolg afleggen van een
      staatsexamen, een diploma te verkrijgen, overeenkomende met een diploma van een school voor voorbereidend
      wetenschappelijk onderwijs, voor hoger algemeen voortgezet onderwijs, voor middelbaar algemeen voortgezet onderwijs
      en voor voorbereidend beroepsonderwijs, als bedoeld in [artikel 72, eerste lid][ref1].

      2 Bij algemene maatregel van bestuur wordt bepaald, welke andere diploma's kunnen worden verkregen door het met
      gunstig gevolg afleggen van een staatsexamen voor het College voor examens.

      3 Zij, die zijn afgewezen bij het eindexamen van een school, worden niet toegelaten tot het in hetzelfde jaar te
      houden overeenkomstige staatsexamen.

      4 De staatsexamens zijn openbaar, behoudens het schriftelijke gedeelte.

      5 Bij algemene maatregel van bestuur worden voorschriften vastgesteld omtrent de in dit artikel bedoelde examens,
      die niet voor alle kandidaten dezelfde vakken en andere programmaonderdelen behoeven te omvatten. Daarbij kan
      worden bepaald het bedrag, dat voor de toelating tot deze examens verschuldigd is. Tevens kan daarbij worden
      bepaald dat dit bedrag is verschuldigd door het bevoegd gezag van een school ten aanzien waarvan toepassing is
      gegeven aan [artikel 72, lid 1a][ref2], of door het bevoegd gezag van een instelling ten aanzien waarvan toepassing
      is gegeven aan [artikel 6.2.2a, eerste lid, van de Wet educatie en beroepsonderwijs BES][ref3].

      6 De staatsexamens omvatten een rekentoets. Bij de vaststelling van de opgaven van de rekentoets worden de
      referentieniveaus rekenen in acht genomen die voor de desbetreffende vormen van onderwijs zijn vastgesteld op grond
      van [artikel 47a][ref4]. Bij of krachtens algemene maatregel van bestuur worden nadere voorschriften omtrent deze
      toets vastgesteld.

      7 [Artikel 75][ref5] is van overeenkomstige toepassing.


