  - number: '117'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen inrichtingen voor voortgezet onderwijs als bedoeld in
      [artikel 6, onderdeel e][ref1], worden aangewezen die voor bekostiging uit 's Rijks kas in aanmerking komen.

      2 Bij of krachtens algemene maatregel van bestuur kunnen voor de aangewezen inrichtingen voor voortgezet onderwijs
      voorschriften worden gegeven voor de toepassing van de bij of krachtens deze wet vastgestelde voorschriften over:

      a. de inrichting van het onderwijs,

      b. de examens,

      c. de rechtspositie van het personeel,

      d. de benoembaarheidsvereisten van het personeel, en

      e. de aanvang, wijze en beëindiging van de bekostiging.

      Daarbij kan, voor zover noodzakelijk, worden afgeweken van het bij of krachtens deze wet bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel6
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '6'
  - number: '118'
    text: Bekostiging uit de openbare kas van een school neemt geen aanvang dan krachtens de bepalingen van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel118
  - number: '119'
    text: |-
      1 Onze Minister kan een school of scholengemeenschap voor bekostiging in aanmerking brengen indien redelijkerwijs
      kan worden aangenomen dat deze, mede gelet op de belangstelling voor de desbetreffende schoolsoort, de verlangde
      richting en het leerlingenverloop, blijkens statistische gegevens, onder meer verstrekt door het Centraal Bureau
      voor de Statistiek, en mede gelet op de hoogte van de bekostiging die krachtens deze titel wordt verstrekt, zal
      worden bezocht door een aantal leerlingen dat voldoende is om een school van voldoende kwaliteit in stand te
      houden.

      2 Bij ministeriële regeling kunnen nadere regels gesteld omtrent de criteria, genoemd in het eerste lid.

      3 Het eerste lid is van overeenkomstige toepassing op de bekostiging van een nieuw te vormen profiel als bedoeld in
      [artikel 18, derde lid][ref1], of [artikel 29, derde lid][ref2] aan een reeds bekostigde school voor voorbereidend
      beroepsonderwijs.

      4 Een op grond van het eerste lid voor bekostiging in aanmerking gebrachte school of scholengemeenschap wordt
      aangeduid als hoofdvestiging.

      5 Onze Minister kan voor bekostiging in aanmerking brengen een school waarvoor een aanvraag als bedoeld in
      [artikel 121, eerste lid][ref3], is ingediend. Onze Minister brengt voor bekostiging in aanmerking een school
      waarvoor een aanvraag als bedoeld in artikel 121, tweede lid, is ingediend.

      6 De besluiten, bedoeld in het eerste en vierde lid, worden gepubliceerd in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel29
