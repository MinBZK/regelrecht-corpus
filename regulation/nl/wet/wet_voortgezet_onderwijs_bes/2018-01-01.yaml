      1 Leerwegondersteunend onderwijs wordt verzorgd ter voorbereiding op of gedurende het volgen van onderwijs in een
      van de leerwegen, genoemd in de [artikelen 16][ref1], [18][ref2] en [29][ref3], ten behoeve van de leerling voor
      wie vaststaat dat een orthopedagogische en orthodidactische benadering is geboden met het oog op het afsluiten van
      het onderwijs in een van deze leerwegen. Leerwegondersteunend onderwijs wordt zodanig in het onderwijs geïntegreerd
      en ingericht dat de leerling een ononderbroken ontwikkelingsproces, gericht op het afsluiten als bedoeld in de
      eerste volzin, kan volgen.

      2 Leerwegondersteunend onderwijs wordt verzorgd, indien de leerling met behulp van de voorzieningen, bedoeld in
      [artikel 50, tweede lid, tweede volzin][ref4], niet een ononderbroken ontwikkelingsproces als bedoeld in het eerste
      lid, kan volgen.

      3 Het bevoegd gezag beslist of een leerling is aangewezen op leerwegondersteunend onderwijs. Het hanteert daartoe
      een indicatieprocedure gebaseerd op erkende testen en toetsen. Na overleg met de ouders van de leerling beslist het
      bevoegd gezag of aan de leerling leerwegondersteunend onderwijs wordt aangeboden.

      4 [Artikel 32, derde lid][ref5], is van overeenkomstige toepassing op de leerling die is aangewezen op
      leerwegondersteunend onderwijs.


