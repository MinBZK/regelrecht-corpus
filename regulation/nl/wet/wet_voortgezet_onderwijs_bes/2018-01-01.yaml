  - number: '52'
    text: |-
      1 Ouders dan wel leerlingen, en personeelsleden kunnen bij de klachtencommissie, bedoeld in het tweede lid,
      onderdeel a, een klacht indienen over gedragingen en beslissingen van het bevoegd gezag of het personeel, waaronder
      discriminatie, dan wel het nalaten van gedragingen en het niet nemen van beslissingen door het bevoegd gezag of
      het personeel.

      2 Het bevoegd gezag treft een regeling voor de behandeling van klachten. Deze regeling vermeldt in ieder geval:

      a. de instelling van een klachtencommissie, die klachten behandelt,

      b. de wijze waarop de klachtencommissie haar werkzaamheden verricht,

      c. de termijn waarbinnen de klager een klacht kan indienen en

      d. de termijn waarbinnen mededeling plaatsvindt van het oordeel, bedoeld in het zesde lid, en hoe bij noodzakelijke
      afwijking van deze termijn wordt gehandeld.

      3 Deze regeling strekt ter vervanging van klachtenregelingen op grond van andere voorschriften dan dit artikel en
      strekt niet ter vervanging van een andere voorziening die op grond van een wettelijke regeling, niet zijnde een
      klachtenregeling, voor de klager openstaat of heeft opengestaan.

      4 Deze regeling

      a. voorziet erin dat de klachten worden behandeld door een klachtencommissie die bestaat uit ten minste drie leden,
      waaronder een voorzitter die geen deel uitmaakt van het bevoegd gezag en niet werkzaam is voor of bij het bevoegd
      gezag, en

      b. waarborgt dat aan de behandeling van een klacht niet wordt deelgenomen door een persoon op wiens gedraging de
      klacht rechtstreeks betrekking heeft.

      5 De klager en degene over wie is geklaagd krijgen de gelegenheid:

      a. hun zienswijze mondeling of schriftelijk toe te lichten en

      b. zich bij de behandeling van de klacht te laten bijstaan.

      6 De klachtencommissie vormt zich een oordeel over de gegrondheid van de klacht en deelt dit oordeel, al dan niet
      vergezeld van aanbevelingen, schriftelijk mede aan de klager, degene over wie is geklaagd en het bevoegd gezag.

      7 Het bevoegd gezag deelt de klager en de klachtencommissie, bedoeld in het tweede lid, onderdeel a, binnen 4
      weken na ontvangst van het in het zesde lid bedoelde oordeel van de klachtencommissie schriftelijk mede of hij het
      oordeel over de gegrondheid van de klacht deelt en of hij naar aanleiding van dat oordeel maatregelen zal nemen en
      zo ja welke. Bij afwijking van de in de eerste volzin bedoelde termijn, doet het bevoegd gezag daarvan met redenen
      omkleed mededeling aan de klager en de klachtencommissie onder vermelding van de termijn waarbinnen het bevoegd
      gezag zijn standpunt bekend zal maken.

      8 Degene die betrokken is bij de uitvoering van dit artikel en daarbij de beschikking krijgt over gegevens waarvan
      hij het vertrouwelijke karakter kent of redelijkerwijze moet vermoeden, is verplicht tot geheimhouding daarvan,
      behoudens voor zover enig wettelijk voorschrift hem tot mededeling verplicht of uit zijn taak de noodzaak tot
      mededeling voortvloeit.

      9 Gegevens die betrekking hebben op een klacht worden bewaard op een plaats die uitsluitend toegankelijk is voor de
      leden van de klachtencommissie en het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel52
  - number: '53'
    text: |-
      1 Het bevoegd gezag stelt ten minste eenmaal in de 4 jaar het schoolplan vast.

      2 Het bevoegd gezag stelt jaarlijks de schoolgids vast ten behoeve van het eerstvolgende schooljaar.

      3 Het bevoegd gezag zendt het schoolplan dan wel de wijzigingen daarvan en de schoolgids onmiddellijk na de
      vaststelling aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel53
  - number: '57'
    text: |-
      1 Aan een school is een medezeggenschapsraad verbonden.

      2 De medezeggenschapsraad van een school bestaat uit ten minste 4 leden.

      3 De medezeggenschapsraad van een school bestaat uit:

      a. leden die uit en door het personeel worden gekozen; en

      b. leden die deels uit en door de ouders en deels uit en door de leerlingen worden gekozen.

      4 De aantallen leden, bedoeld in het derde lid, onderdeel a en onderdeel b, zijn aan elkaar gelijk. Tevens zijn
      de aantallen leden uit en door de ouders en uit en door de leerlingen aan elkaar gelijk. Indien niet aan de tweede
      volzin kan worden voldaan, omdat onvoldoende ouders dan wel leerlingen bereid zijn lid te worden, kan de niet door
      de desbetreffende groep te vervullen plaats worden toegedeeld aan de andere groep.

      5 Indien het bevoegd gezag personeel heeft benoemd of te werk gesteld zonder benoeming dat werkzaamheden verricht
      ten behoeve van meer dan een school, kan een medezeggenschapsraad worden ingesteld die bestaat uit leden die uit en
      door dat personeel worden gekozen. De medezeggenschapsraad bestaat in dat geval uit ten minste 2 leden.

      6 Geen lid van de medezeggenschapsraad kunnen zijn degenen die deel uitmaken van het bevoegd gezag.

      7 Een personeelslid dat is opgedragen om namens het bevoegd gezag op te treden in besprekingen met de
      medezeggenschapsraad kan niet tevens lid zijn van de medezeggenschapsraad.

      8 Kandidaten voor de verkiezing van het deel van de medezeggenschapsraad dat uit en door het personeel wordt
      gekozen, kunnen worden gesteld door personeelsleden en door organisaties van personeel. Kandidaten voor de
      verkiezing van het deel van de medezeggenschapsraad dat uit en door de ouders of de leerlingen wordt gekozen,
      kunnen worden gesteld door ouders of leerlingen en door organisaties van ouders of leerlingen.

      9 De verkiezing van de leden van de medezeggenschapsraad geschiedt bij geheime schriftelijke stemming.

      10 Bij ministeriële regeling kunnen nadere voorschriften worden gegeven over de periode waarin de verkiezing van de
      leden van de medezeggenschapsraad plaatsvindt.

      11 Het bevoegd gezag draagt er zorg voor, dat de leden van de medezeggenschapsraad niet uit hoofde van hun
      lidmaatschap van de raad worden benadeeld in hun positie met betrekking tot de school. De eerste volzin is van
      overeenkomstige toepassing ten aanzien van kandidaatleden en voormalige leden.

      12 De beëindiging anders dan op eigen verzoek van de betrekking van een lid van het personeel mag geen verband
      houden met de kandidaatstelling voor het lidmaatschap, het lidmaatschap of het voormalig lidmaatschap van de
      betrokkene van de medezeggenschapsraad. Een beëindiging van de betrekking in strijd met dit lid is nietig.

      13 De medezeggenschapsraad kiest uit zijn midden een voorzitter en een of meer plaatsvervangende voorzitters. De
      voorzitter, of bij diens verhindering een plaatsvervangende voorzitter, vertegenwoordigt de raad in rechte.
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel57
  - number: '58'
    text: |-
      1 Het bevoegd gezag stelt de medezeggenschapsraad bedoeld in [artikel 57][ref1] ten minste twee maal per jaar in de
      gelegenheid de algemene gang van zaken in de school met hem te bespreken.

      2 Het bevoegd gezag en de medezeggenschapsraad komen bijeen indien daarom onder opgave van redenen door het
      bevoegd gezag, de vertegenwoordigers van ouders, de vertegenwoordigers van leerlingen of de vertegenwoordigers van
      personeel wordt verzocht. De besprekingen kunnen namens het bevoegd gezag worden gevoerd.


