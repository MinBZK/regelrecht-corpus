  - number: '215'
    text: |-
      Bij twijfel of deze wet op een of meer inrichtingen van onderwijs van toepassing is, wordt beslist bij koninklijk
      besluit.
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel215
  - number: '216'
    text: |-
      1 Voortgezet onderwijs wordt niet gegeven in gebouwen en op terreinen, die door de krachtens de
      [Gezondheidswet][ref1] bevoegde inspecteur van het staatstoezicht op de volksgezondheid zijn afgekeurd als
      schadelijk voor de gezondheid, gevaar opleverende voor de veiligheid of wegens onvoldoende ruimte voor het aantal
      in lokalen toegelaten leerlingen.

      2 De inspecteur, bedoeld in het eerste lid, zendt zijn besluit tot afkeuring aan het bestuurscollege van het
      openbaar lichaam waarin de onderwijslocatie ligt. Op dezelfde dag doet hij van zijn besluit mededeling aan Onze
      Minister; voorts, indien het een uit de openbare kas bekostigde school betreft, aan de inspectie en, indien het een
      bijzondere school betreft, aan het schoolbestuur.

      3 Indien de inspecteur, bedoeld in het eerste lid, besluit dat de onderwijslocatie voldoende is verbeterd of dat
      het aantal leerlingen voldoende is beperkt, mag het onderwijs worden hervat. Aan hen, die ingevolge het tweede lid
      van de afkeuring mededeling hebben ontvangen, wordt van dit besluit op gelijke wijze mededeling gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002202
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel216
    references:
      - id: ref1
        bwb_id: BWBR0002202
  - number: '217'
    text: |-
      1 Hij, die in strijd met het voorschrift van [artikel 216, eerste lid][ref1], onderwijs geeft of doet geven in een
      afgekeurd lokaal, wordt gestraft met geldboete van de tweede categorie.

      2 Het feit, strafbaar gesteld in dit artikel, is een overtreding.


