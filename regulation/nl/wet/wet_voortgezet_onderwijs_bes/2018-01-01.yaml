  - number: '188'
    text: |-
      1 Een openbare school of scholengemeenschap wordt opgeheven en de bekostiging van een bijzondere school of
      scholengemeenschap wordt beëindigd indien de school gedurende drie achtereenvolgende schooljaren telkens is bezocht
      door een aantal leerlingen dat minder bedraagt dan een bij ministeriële regeling vast te stellen aantal.

      2 De opheffing van een openbare school of scholengemeenschap of de beëindiging van de bekostiging van een
      bijzondere school of scholengemeenschap geschiedt met ingang van 1 augustus volgend op de drie achtereenvolgende
      schooljaren, bedoeld in het eerste lid.

      3 Indien een profiel als bedoeld in [artikel 18][ref1] of [29][ref2] aan een school voor voorbereidend
      beroepsonderwijs gedurende drie achtereenvolgende schooljaren telkens door nul leerlingen gevolgd is, wordt dat
      profiel aan een openbare school opgeheven, of gaat de aanspraak op bekostiging voor dat profiel aan een bijzondere
      school verloren met ingang van 1 augustus volgend op die drie achtereenvolgende schooljaren.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel29
