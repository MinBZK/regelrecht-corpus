  - number: '189'
    text: |-
      1 Grondslag der berekening is het aantal leerlingen dat op 1 oktober van elk van de jaren bij de school was
      ingeschreven.

      2 Indien voor de leerlingen binnen redelijke afstand geen plaatsruimte beschikbaar is op een gelijksoortige school,
      waar het verlangde onderwijs wordt gegeven, past Onze Minister [artikel 188][ref1] zodanig toe, dat de leerlingen
      van elk leerjaar de cursus kunnen voltooien.

      3 [Artikel 188][ref2] blijft buiten toepassing, zolang de school niet alle leerjaren omvat.

      4 Onze Minister kan op aanvraag van het bevoegd gezag besluiten voor een door hem te bepalen tijd toe te staan,
      dat een openbare school in stand wordt gehouden of een bijzondere school wordt bekostigd, ook al is het aantal
      leerlingen minder, dan in [artikel 188][ref3] is vermeld. Onze Minister besluit binnen zes maanden na ontvangst van
      een aanvraag. Indien de beschikking niet binnen zes maanden kan worden gegeven, stelt Onze Minister de aanvrager
      daarvan in kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden gezien.

      5 Binnen acht weken na de bekendmaking door het Centraal Bureau voor de Statistiek dan wel door Onze Minister van
      de aantallen leerlingen per school voor voortgezet onderwijs, stelt de Rijksvertegenwoordiger vast welke door het
      openbaar lichaam in stand gehouden scholen gedurende reeds een jaar niet meer voldoen aan de voor hen geldende
      norm, genoemd in [artikel 188][ref4]. Wanneer er als gevolg van de opheffing van een school als bedoeld in de
      vorige volzin, naar zijn oordeel niet meer voldoende zal zijn voorzien in de behoefte aan openbaar onderwijs in een
      genoegzaam aantal scholen, draagt de Rijksvertegenwoordiger het bestuurscollege op een verzoek te doen op grond van
      het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel188
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel188
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel188
      [ref4]: https://wetten.overheid.nl/BWBR0030284#Artikel188
