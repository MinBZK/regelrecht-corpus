  - number: '69'
    text: |-
      1 Onze Minister kan op verzoek een rechtspersoon aanwijzen die naar zijn oordeel in staat is deskundige
      ondersteuning te bieden aan leerlingen met een specifieke onderwijsbehoefte waarin binnen de school redelijkerwijs
      niet kan worden voorzien en waaronder in elk geval de volgende taken worden verstaan:

      a. het verzorgen van onderwijsondersteunende activiteiten aan leerlingen met een lichamelijke, verstandelijke,
      zintuiglijke, geestelijke of meervoudige handicap of stoornis,

      b. het verzorgen van ambulante begeleiding ten behoeve van leerlingen met een lichamelijke, verstandelijke,
      zintuiglijke, geestelijke of meervoudige handicap of stoornis,

      c. het verrichten van handelingsgerichte diagnostiek ten behoeve van de leerlingen op verzoek van het bevoegd
      gezag, het samenwerkingsverband of de ouders, of

      d. het op verzoek van een bevoegd gezag, het samenwerkingsverband of de ouders van leerlingen adviseren en
      collegiaal consulteren.

      2 De rechtspersoon, bedoeld in het eerste lid, wordt voor de toepassing van deze wet aangeduid als expertisecentrum
      onderwijszorg.

      3 Een leerling die binnen een locatie van het expertisecentrum onderwijszorg wordt begeleid, blijft ingeschreven
      bij de school. Het bevoegd gezag van deze school blijft verantwoordelijk voor de leerling tijdens het verblijf
      binnen het expertisecentrum onderwijszorg. Onder deze verantwoordelijkheid valt in elk geval de zorg voor het geven
      van adequaat onderwijs door een leraar die daartoe bevoegd is op grond van [artikel 80][ref1].

      4 Met inachtneming van [artikel 172][ref2] vergoedt het bevoegd gezag voor het begeleiden van zijn leerling,
      bedoeld in het derde lid, naar redelijkheid en indien dit naar het oordeel van het samenwerkingsverband, bedoeld in
      [artikel 67][ref3], nodig is, de kosten die worden gemaakt door:

      a. het expertisecentrum onderwijszorg, en

      b. een ander bevoegd gezag van een school of instelling als bedoeld in
      [artikel 67, eerste lid, onderdelen a tot en met c][ref4].

      5 Per openbaar lichaam is er één expertisecentrum onderwijszorg.

      6 Het expertisecentrum onderwijszorg treft een regeling voor de behandeling van klachten over gedragingen en
      beslissingen van het bestuur van dit centrum of het personeel, waaronder discriminatie, dan wel het nalaten van
      gedragingen en het niet nemen van beslissingen door het bestuur of het personeel voor zover het betreft zijn
      onderscheidenlijk hun werkzaamheden in het kader van het onderwijsproces of de deskundige ondersteuning, bedoeld in
      het eerste lid. [Artikel 52][ref5] is van overeenkomstige toepassing.

      7 Bij ministeriële regeling kunnen voorschriften worden gegeven over de taken van het expertisecentrum
      onderwijszorg.


