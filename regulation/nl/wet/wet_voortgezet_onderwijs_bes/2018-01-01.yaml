  - number: '27'
    text: |-
      1 De assistentopleiding, bedoeld in [artikel 26][ref1], wordt onder verantwoordelijkheid van het bevoegd gezag
      verzorgd op grond van een samenwerkingsovereenkomst tussen het bevoegd gezag van de school en het bevoegd gezag
      van een instelling als bedoeld in [artikel 1.1.1 van de Wet educatie en beroepsonderwijs BES][ref2] waarvan het
      onderwijsaanbod mede deze assistentopleiding omvat.

      2 Een samenwerkingsovereenkomst als bedoeld in het eerste lid voorziet in elk geval in afspraken over:

      a. de assistentopleiding die geheel of gedeeltelijk in plaats van de basisberoepsgerichte leerweg zal worden
      verzorgd,

      b. de inschrijving van leerlingen als examendeelnemer bij de instelling,

      c. de examinering en diplomering door de instelling,

      d. de invulling van de betrokkenheid van het bevoegd gezag bij de beroepspraktijkvorming, bedoeld in de
      [artikelen 7.2.7][ref3] en [7.2.8 van de Wet educatie en beroepsonderwijs BES][ref4], met dien verstande dat het
      bevoegd gezag de in dat artikel 7.2.8 bedoelde overeenkomst mede ondertekent,

      e. de toepassing van [artikel 26, tweede lid][ref5],

      f. de rechtsbescherming van de leerling, en

      g. de doorstroom van de leerlingen na het met goed gevolg afsluiten van de assistentopleiding.

      3 In geval van toepassing van [artikel 7.4.6, derde lid, van de Wet educatie en beroepsonderwijs BES][ref6], is het
      bevoegd gezag belast met de uitvoering van de daar bedoelde examinering.

      4 Indien het bevoegd gezag tevens het bevoegd gezag is van een instelling als bedoeld in
      [artikel 1.1.1 van de Wet educatie en beroepsonderwijs BES][ref7], regelt het bevoegd gezag op overeenkomstige
      wijze de onderwerpen, genoemd in het tweede lid.


