  - number: '71'
    text: |-
      1 Onze Minister is bevoegd tot het treffen van noodzakelijke voorzieningen indien het expertisecentrum
      onderwijszorg naar het oordeel van Onze Minister zijn taken ernstig verwaarloost.

      2 De voorzieningen, bedoeld in het eerste lid, worden niet eerder getroffen dan nadat het expertisecentrum
      onderwijszorg in de gelegenheid is gesteld om binnen een door Onze Minister te stellen redelijke termijn alsnog
      zijn taken naar behoren uit te voeren.
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel71
  - number: '72'
    text: |-
      1 Aan de leerlingen van de scholen voor voorbereidend wetenschappelijk onderwijs, voor hoger algemeen voortgezet
      onderwijs, voor middelbaar algemeen voortgezet onderwijs en voor voorbereidend beroepsonderwijs wordt gelegenheid
      gegeven aan deze scholen een eindexamen af te leggen, tenzij in de plaats daarvan de gelegenheid bestaat tot het
      afleggen van een eindexamen, dat niet vanwege de school wordt afgenomen en het bevoegd gezag in verband hiermede
      een eindexamen aan de school niet nodig oordeelt. Het eindexamen kan voor elk vak of ander programma-onderdeel
      bestaan uit een schoolexamen, uit een centraal examen dan wel beide.

      1a Indien ten aanzien van een schoolsoort of leerweg het gemiddelde verschil tussen de cijfers van het centraal
      examen en het schoolexamen over een periode van drie jaren meer dan een half punt bedraagt, kan Onze Minister in
      afwijking van het eerste lid besluiten dat het bevoegd gezag voor een periode van twee jaren leerlingen niet in de
      gelegenheid stelt een eindexamen af te leggen in de desbetreffende schoolsoort of leerweg.

      1b Onze Minister besluit of toepassing wordt gegeven aan lid 1a nadat het bevoegd gezag van de school gedurende een
      periode van ten minste drie jaar de gelegenheid heeft gehad, het gemiddelde verschil, bedoeld in lid 1a, ongedaan
      te maken, voor zover dat verschil meer dan een half punt bedraagt.

      2 Het eindexamen wordt afgenomen door de rector, de directeur, de conrector, de adjunct-directeur of een of meer
      leraren van de school. Het eindexamen staat onder toezicht van een of meer gecommitteerden behoudens voor bij
      of krachtens algemene maatregel van bestuur aan te wijzen examens en examenonderdelen. Bij of krachtens algemene
      maatregel van bestuur wordt bepaald door wie en op welke wijze de gecommitteerden worden aangewezen. Het eindexamen
      kan mede worden afgenomen door deskundigen. Het bevoegd gezag wijst de deskundigen aan.

      3 Zij die het eindexamen met goed gevolg hebben afgelegd, ontvangen een diploma. Leerlingen van een school
      voor voorbereidend beroepsonderwijs voor zover het betreft de basisberoepsgerichte leerweg, die met goed gevolg
      een gedeelte van het examenprogramma hebben afgelegd, ontvangen een getuigschrift voorbereidend middelbaar
      beroepsonderwijs en leerlingen die een leer-werktraject met goed gevolg afsluiten, ontvangen een diploma
      basisberoepsgerichte leerweg/leer-werktraject. Onze Minister stelt de modellen van diploma's en getuigschriften
      vast.

      4 Bij of krachtens algemene maatregel van bestuur worden voorschriften vastgesteld omtrent de in dit artikel
      bedoelde eindexamens, alsmede omtrent programmaonderdelen, die niet voor alle leerlingen van een school dezelfde
      vakken en andere programmaonderdelen behoeven te omvatten. Bij deze algemene maatregel van bestuur worden
      tevens de eindexamenprogramma's vastgesteld. Bij de vaststelling van de eindexamenprogramma’s Nederlandse taal
      respectievelijk Nederlandse taal en literatuur worden de referentieniveaus Nederlandse taal in acht genomen
      die voor de desbetreffende vormen van onderwijs of voor dan wel binnen leerwegen zijn vastgesteld op grond van
      [artikel 47a][ref1].

      5 De eindexamens omvatten een rekentoets. Bij de vaststelling van de opgaven van de rekentoets worden de
      referentieniveaus rekenen in acht genomen die voor de desbetreffende vorm van onderwijs of voor dan wel binnen
      leerwegen zijn vastgesteld op grond van [artikel 47a][ref2]. Bij of krachtens algemene maatregel van bestuur worden
      nadere voorschriften omtrent deze toets vastgesteld.

      6 Voor examens, die niet vanwege de school worden afgenomen, kunnen bij algemene maatregel van bestuur
      voorschriften worden gegeven.

      7 Ten behoeve van de bijzondere inrichting van het onderwijs aan een school kan Onze Minister besluiten toe te
      staan dat wordt afgeweken van het bepaalde bij of krachtens dit artikel. Onze Minister besluit binnen zes maanden
      na ontvangst van een aanvraag. Indien de beschikking niet binnen zes maanden kan worden gegeven, stelt Onze
      Minister de aanvrager daarvan in kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan
      worden gezien.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel47a
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel47a
