  - number: '8'
    text: |-
      Het onderwijs wordt gegeven en de examens worden afgenomen in het Nederlands. In afwijking van de eerste volzin kan
      een andere taal worden gebezigd:

      a. wanneer het onderwijs met betrekking tot die taal betreft,

      b. wanneer het praktijkonderwijs als bedoeld in [artikel 31][ref1] betreft, of

      c. indien de specifieke aard, de inrichting of de kwaliteit van het onderwijs dan wel de herkomst van de deelnemers
      daartoe noodzaakt, overeenkomstig een door het bevoegd gezag vastgestelde gedragscode. De gedragscode wordt
      toegezonden aan de inspectie.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel31
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel8
