    text: |-
      Onze Minister kan onder door hem nader te stellen voorwaarden aanvullende middelen ter beschikking stellen die
      niet strekken tot bekostiging van het onderwijs, bedoeld in deze wet, maar die direct of indirect dienstig zijn
      voor de uitvoering van het onderwijs of voor verhoging van de mogelijkheid tot deelname aan het onderwijs. Bij
      de toepassing van dit artikel zijn de [titels 4.1][ref1] en [4.2 van de Algemene wet bestuursrech][ref2]t en de
      [artikelen 4][ref3], [5][ref4], [9][ref5] en [10 van de Wet overige OCW-subsidies][ref6] van toepassing.


