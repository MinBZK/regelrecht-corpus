  - number: '218'
    text: |-
      Een beslissing als bedoeld in de [artikelen 30, tweede lid][ref1], [32, tweede lid][ref2], en
      [93, vierde lid][ref3], van een bevoegd gezag van een openbare school geldt als een beschikking als bedoeld in
      [artikel 3 van de Wet administratieve rechtspraak BES][ref4].


