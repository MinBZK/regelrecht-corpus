      1 Aan de openbare scholen worden op verzoek van door Ons tot dit doel toegelaten genootschappen op geestelijke
      grondslag de leerlingen, wier ouders daartoe de wens te kennen geven, in de gelegenheid gesteld in de schoollokalen
      levensbeschouwelijk vormingsonderwijs te volgen van leraren, daartoe door deze genootschappen aan te wijzen.

      2 De schoollokalen worden, zo nodig verlicht, kosteloos voor het vormingsonderwijs beschikbaar gesteld.

      3 Bij een geschil omtrent het vaststellen van lessen of het beschikbaar stellen van lokalen van openbare scholen
      beslist Onze Minister bij beschikking.

      4 Aan de genootschappen, bedoeld in het eerste lid, kan een subsidie worden verstrekt. De
      [artikelen 4 tot en met 19 van de Wet overige OCW-subsidies][ref1] zijn van toepassing, met dien verstande dat de
      subsidie slechts kan worden verstrekt bij algemene maatregel van bestuur.

      5 Het bevoegd gezag ziet erop toe dat dit onderwijs uitsluitend wordt gegeven door een leraar die blijkens een
      daartoe strekkende verklaring van het aanwijzend genootschap op geestelijke grondslag:

      a. voldoet aan de bekwaamheidseisen die krachtens [artikel 86, eerste lid][ref2], voor het geven van dat onderwijs
      zijn vastgesteld, en

      b. zijn bekwaamheid onderhoudt.


