    text: |-
      1 De instandhouding van een of meer openbare en een of meer bijzondere scholen kan worden opgedragen of
      overgedragen aan een stichting die met dit doel wordt onderscheidenlijk is opgericht. De besluitvorming van de
      zijde van het openbaar lichaam vindt plaats door de eilandsraad.

      2 Het statutaire doel van de stichting is in elk geval het geven van openbaar onderwijs en onderwijs van een of
      meer richtingen in afzonderlijke scholen voor openbaar onderscheidenlijk bijzonder onderwijs.

      3 De stichting oefent met uitzondering van de besluitvorming over de opheffing van een openbare school alle taken
      en bevoegdheden van het bevoegd gezag uit.

      4 Het personeel dat werkzaam is aan de openbare school en niet is tewerkgesteld zonder benoeming, wordt benoemd
      krachtens een arbeidsovereenkomst naar burgerlijk recht.

      5 De statuten voorzien in ieder geval in een regeling omtrent:

      a. de samenstelling, werkwijze en inrichting van het bestuur van de stichting,

      b. de wijze van benoeming, herbenoeming, schorsing en ontslag van de bestuursleden,

      c. de termijn waarvoor de bestuursleden worden benoemd,

      d. de vaststelling van de begroting en jaarrekening na overleg met de eilandsraad van het openbaar lichaam waarin
      de openbare school is gelegen,

      e. de wijze waarop de eilandsraad van het openbaar lichaam waarin de openbare school is gelegen, toezicht op het
      bestuur van de openbare school uitoefent,

      f. de gronden waarop het bestuur kan besluiten de vergaderingen besloten te houden,

      g. de periode waarvoor de stichting in het leven wordt geroepen, met dien verstande dat deze periode ten minste 5
      jaren bedraagt, en

      h. de bevoegdheid de stichting te ontbinden, met dien verstande dat in de regeling een overheersende invloed van de
      overheid in het bestuur is verzekerd voor zover het openbaar onderwijs betreft.

      6 De statuten van de stichting kunnen slechts worden gewijzigd na goedkeuring van de eilandsraad van het openbaar
      lichaam waarin de openbare school is gelegen. Goedkeuring kan slechts worden onthouden indien overheersende invloed
      van de overheid in het bestuur niet is verzekerd voor zover het openbaar onderwijs betreft.

      7 Het bestuur brengt jaarlijks aan de eilandsraad van het openbaar lichaam waarin de openbare school is gelegen,
      verslag uit over de werkzaamheden, waarbij in ieder geval aandacht wordt geschonken aan de wezenskenmerken van het
      openbaar onderwijs. Het verslag wordt bekendgemaakt.

      8 De vergaderingen van het bestuur van de stichting zijn openbaar, tenzij het bestuur anders beslist, op gronden,
      vermeld in de statuten.

      9 In geval van ernstige taakverwaarlozing door het bestuur of functioneren in strijd met de wet, voor zover het
      openbaar onderwijs betreft, neemt de eilandsraad van het openbaar lichaam waarin de openbare school is gelegen,
      de maatregelen die hij nodig acht om de continuïteit van het onderwijsproces te waarborgen voor zover het openbaar
      onderwijs betreft.

      10 Indien de laatste afzonderlijke openbare school en de laatste afzonderlijke bijzondere school die door de
      stichting in stand worden gehouden, zijn gefuseerd tot een samenwerkingsschool als bedoeld in [artikel 109a][ref1]
      kan de instandhouding van die samenwerkingsschool opgedragen blijven aan de stichting.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel109a
