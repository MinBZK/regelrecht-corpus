  - number: '145'
    text: |-
      1 Het bestuurscollege en het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school dat
      eigenaar is van het gebouw en terrein kunnen in een gezamenlijke akte verklaren dat het bevoegd gezag blijvend
      heeft opgehouden dan wel blijvend zal ophouden het gebouw of terrein of een voor eigendomsoverdracht vatbaar
      gedeelte daarvan, voor de school te gebruiken.

      2 Bij toepassing van het eerste lid stellen het bestuurscollege en het bevoegd gezag van de desbetreffende school
      gezamenlijk vast of voorzieningen in een slechte bouwkundige staat verkeren als gevolg van het verwijtbaar nalaten
      van noodzakelijk onderhoud. Indien dat het geval is, vindt verrekening plaats van de daarmee gemoeide kosten.

      3 De eilandsraad en het bevoegd gezag van de niet door het openbaar lichaam in stand gehouden school treffen
      gezamenlijk een voorziening voor het beslechten van geschillen die zich bij de toepassing van het tweede lid
      voordoen.

      4 De Rijksvertegenwoordiger kan in geval van een geschil omtrent de toepassing van het eerste lid desgevraagd
      besluiten dat het bevoegd gezag blijvend heeft opgehouden dan wel blijvend zal ophouden het gebouw of terrein of
      een voor eigendomsoverdracht vatbaar gedeelte daarvan, voor de school te gebruiken. De aanvraag om het besluit
      wordt gedaan door het bestuurscollege of door het bevoegd gezag van de school.

      5 Het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school dat voornemens is gebouwen
      of terreinen, of een gedeelte daarvan, blijvend niet meer voor de school te gebruiken, doet hiervan onverwijld
      mededeling aan het bestuurscollege.

      6 Zodra de in het eerste lid bedoelde akte door beide partijen is getekend, of het in het vierde lid bedoelde
      besluit van de Rijksvertegenwoordiger onherroepelijk is geworden dan wel in beroep is bepaald dat de uitspraak
      van de rechter, inhoudende een besluit als bedoeld in het vierde lid eerste volzin, in de plaats treedt van het
      vernietigde besluit, wordt de akte, het onherroepelijk geworden besluit onderscheidenlijk de uitspraak, ingeschreven
      in de openbare registers, bedoeld in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek BES][ref1]. Door
      de inschrijving verkrijgt het openbaar lichaam de eigendom.

      7 Het bestuurscollege en het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school dat
      eigenaar is van het schoolgebouw, kunnen in een gezamenlijke akte verklaren dat een gedeelte van het gebouw dat
      niet vatbaar is voor eigendomsoverdracht, blijvend niet meer voor het onderwijs nodig zal zijn.

      8 De Rijksvertegenwoordiger kan in geval van een geschil omtrent de toepassing van het zevende lid desgevraagd
      besluiten dat een gedeelte van het gebouw dat niet vatbaar is voor eigendomsoverdracht, blijvend niet meer voor
      het onderwijs nodig zal zijn. De aanvraag om het besluit wordt gedaan door het bestuurscollege of door het bevoegd
      gezag van de school. Alvorens op de aanvraag te besluiten, hoort de Rijksvertegenwoordiger de wederpartij.

      9 Zodra de in het zevende lid bedoelde akte door beide partijen is getekend, of het in het achtste lid bedoelde
      besluit van de Rijksvertegenwoordiger onherroepelijk is geworden dan wel in beroep is bepaald dat de uitspraak
      van de rechter, inhoudende een beslissing als bedoeld in het achtste lid eerste volzin, in de plaats treedt van
      het vernietigde besluit, kan het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school het
      desbetreffende gedeelte van het gebouw met toestemming van het bestuurscollege verhuren.

      10 De toestemming, bedoeld in het negende lid, wordt verleend voor een tijdvak van ten hoogste 3 jaren. Op verzoek
      van het bevoegd gezag kan dit tijdvak telkens worden verlengd met een termijn van ten hoogste 3 jaren.

      11 Op de verhuur, bedoeld in het negende lid, is [artikel 230a van Boek 7 van het Burgerlijk Wetboek][ref2] niet
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel230a
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel145
    references:
      - id: ref1
