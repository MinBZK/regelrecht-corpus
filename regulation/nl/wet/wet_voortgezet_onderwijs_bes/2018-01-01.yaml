  - number: '110'
    text: |-
      Het bestuur van een bijzondere school voor voortgezet onderwijs geeft binnen vier weken na de oprichting van de
      school onder overlegging van de statuten der instelling, die de school in stand houdt, en van de reglementen, van
      die oprichting kennis aan Onze Minister. Indien de statuten of reglementen worden gewijzigd of ingetrokken, wordt
      eveneens binnen vier weken van de wijziging of van de intrekking van de statuten of reglementen aan Onze Minister
      kennis gegeven.
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel110
  - number: '111'
    text: |-
      1 Algemeen voortgezet onderwijs wordt slechts gegeven door wie voldoet aan [artikel 80, eerste lid][ref1]. De
      artikelen 80, tweede tot en met achtste en zestiende tot en met achttiende lid, alsmede [81][ref2] zijn van
      overeenkomstige toepassing.

      2 Onderwijsondersteunende werkzaamheden als bedoeld in [artikel 86, derde lid][ref3], worden met betrekking tot
      het algemeen voortgezet onderwijs slechts verricht door wie voldoet aan [artikel 84, eerste lid][ref4]. Artikel 84,
      derde en vierde lid, is van overeenkomstige toepassing.


