      1 Op de bekostiging of onderdelen daarvan kunnen voorschotten worden verleend volgens regels, te stellen bij of
      krachtens algemene maatregel van bestuur.

      2 Bij of krachtens algemene maatregel van bestuur worden tevens voorschriften gegeven voor de verrekening van de
      betaalde voorschotten met het bedrag van de vastgestelde bekostiging of onderdelen daarvan.
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel168
  - number: '169'
    text: |-
      Onze Minister is bevoegd tot verrekening van vorderingen krachtens deze wet van of op het bevoegd gezag van een
      school met vorderingen van of op Onze Minister krachtens een andere wet.
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel169
  - number: '170'
    text: |-
      Indien een leerling in de loop van het schooljaar de school verlaat zonder de opleiding te hebben voltooid, en
      aansluitend wordt ingeschreven als leerling aan een andere school voor voortgezet onderwijs of als deelnemer aan
      een instelling voor educatie en beroepsonderwijs, kan het bevoegd gezag van de school met het bevoegd gezag van
      die andere school of die instelling overeenkomen een deel van de bekostiging over te dragen aan dat andere bevoegd
      gezag vanwege deze tussentijdse overstap.
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel170
  - number: '171'
    text: |-
      1 Het bevoegd gezag van een bijzondere school houdt nauwkeurig boek van de inkomsten en uitgaven.

      2 Het bevoegd gezag van een bijzondere school geeft desverlangd aan de door Onze Minister aangewezen ambtenaren de
      boeken en bescheiden ter inzage. Het bevoegd gezag is gehouden deze boeken en bescheiden zeven jaren te bewaren.
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel171
  - number: '172'
    text: |-
      1 Het bevoegd gezag besteedt de verstrekte bekostiging en de betaalde bedragen ten behoeve van die school op de
      wijze zoals aangegeven in het tweede tot en met vierde lid.

      2 De voor voorzieningen in de huisvesting betaalde bedragen worden zodanig aangewend dat een behoorlijke en
      deugdelijke totstandkoming van deze voorzieningen is verzekerd. Indien na realisatie van de in de eerste volzin
      bedoelde voorzieningen de bedragen niet volledig zijn aangewend, kan het resterende deel daarvan worden aangewend
      voor de kosten van personeel of voorzieningen in de exploitatie.

      3 Het voor personeels- en exploitatiekosten betaalde bedrag wordt aangewend voor de kosten van personeel, zoals
      onderscheiden in [artikel 77][ref1], voor voorzieningen in de exploitatie. In geval van een overschot op die
      bedragen, kan dat overschot worden aangewend voor voorzieningen in de huisvesting.

      4 De verstrekte overschrijdingsbedragen worden ten behoeve van het onderwijs aan de scholen van het bevoegd gezag
      aangewend.

      5 Het bevoegd gezag kan de bedragen, bedoeld in het derde lid, mede aanwenden voor de vergoeding, bedoeld in
      [artikel 69, vierde lid][ref2], en voor de kosten van personeel of voorzieningen in de exploitatie van:

      a. een andere school voor voortgezet onderwijs,

      b. een scholengemeenschap waarvan een of meer scholen voor voortgezet onderwijs deel uitmaken,

      c. een school als bedoeld in de [Wet primair onderwijs BES][ref3],

      d. een instelling als bedoeld in de [Wet educatie en beroepsonderwijs BES][ref4], en

      e. het expertisecentrum onderwijszorg.

      6 De op grond van [artikel 149][ref5], [artikel 160][ref6] of [artikel 162][ref7] verstrekte bekostiging wordt
      besteed aan het doel waarvoor zij is verleend.

      7 Het bevoegd gezag kan met het bevoegd gezag waarmee het een samenwerkingsovereenkomst heeft gesloten als bedoeld
      in [artikel 62, derde lid][ref8], overeenkomen om vanwege de samenwerking een deel van de bekostiging over te
      dragen aan het andere bevoegd gezag, bedoeld in het eerste lid van dat artikel.


