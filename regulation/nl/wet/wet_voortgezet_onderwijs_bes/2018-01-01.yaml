  - number: 205a
    text: |-
      1 Met het oog op verbetering van de kwaliteit, toegankelijkheid of doelmatigheid van het voortgezet onderwijs kan
      bij wijze van experiment bij algemene maatregel van bestuur worden afgeweken van titel II, afdeling I, hoofdstuk I
      en van titel III, afdeling III, van de wet.

      2 In geval van toepassing van het eerste lid wordt bij algemene maatregel van bestuur in elk geval bepaald:

      a. het doel van het experiment,

      b. op welke wijze van welke artikelen van het in het eerste lid genoemde hoofdstuk en de daar genoemde afdeling
      wordt afgeweken,

      c. de duur van het experiment, en

      d. op welke wijze en aan de hand van welke criteria de met het experiment beoogde effecten worden geëvalueerd.

      3 Bij ministeriële regeling kunnen regels worden gesteld over de uitvoering van een experiment.

      4 Een experiment duurt ten hoogste zes jaar, tenzij een langere duur gezien de bijzondere aard van het experiment
      noodzakelijk is. Alsdan wordt de duur van het experiment op ten hoogste acht jaar bepaald. Indien een voorstel
      van wet is ingediend bij de Staten-Generaal om het experiment om te zetten in een structurele wettelijke regeling
      voordat een experiment is afgelopen, kan Onze Minister het experiment verlengen tot het tijdstip waarop het
      wetsvoorstel tot wet is verheven en in werking treedt.

      5 Onze Minister zendt drie maanden voor het einde van de werkingsduur van een algemene maatregel van bestuur als
      bedoeld in het eerste lid aan de Staten-Generaal, een verslag over de doeltreffendheid en de effecten van het
      experiment in de praktijk, evenals een standpunt over de voortzetting van die algemene maatregel van bestuur,
      anders dan een voortzetting als experiment.

      6 In verband met een experiment als bedoeld in het eerste lid, kan bij algemene maatregel van bestuur eveneens bij
      wijze van experiment worden afgeweken van:

      a. artikel 1 van de Leerplichtwet BES,

      b. artikel 1.1 van de Wet studiefinanciering BES.

      7 Dit artikel is van overeenkomstige toepassing op een samenwerkingsverband van een school met een school als
      bedoeld in artikel 1, een school als bedoeld in de Wet primair onderwijs BES, of een instelling als bedoeld in de
      Wet educatie en beroepsonderwijs BES. Bij samenwerking met een school of instelling kan voor die school, instelling
      of uitvoeringsinstantie respectievelijk worden afgeweken van hoofdstuk I, titel I, artikelen 1 en 2, titel II,
      afdeling 1 en afdeling 2, artikelen 53 en 54 en titel III, afdeling 1, 2, 4 tot en met 6, afdeling 7, paragrafen
      2, 3, 6 en 7, en afdeling 8, paragraaf 1, van de Wet primair onderwijs BES, dan wel hoofdstuk 2, titel 2, en de
      hoofdstukken 6 en 7 van de Wet educatie en beroepsonderwijs BES. Bij de algemene maatregel van bestuur, bedoeld
      in het tweede lid, wordt geregeld welke bij of krachtens de wet, de Wet primair onderwijs BES of de Wet educatie
      en beroepsonderwijs BES vastgestelde voorschriften van toepassing of van overeenkomstige toepassing zijn op de
      samenwerking.
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel205a
  - number: '206'
    text: |-
      1 De [artikelen 8][ref1], [13 tot en met 30][ref2] en [33 tot en met 41][ref3], en de ter uitvoering daarvan
      vastgestelde voorschriften, vinden met ingang van het eerste schooljaar na hun inwerkingtreding successievelijk
      toepassing per opvolgend leerjaar.

      2 Op de leerjaren waarop de artikelen van deze wet als gevolg van successievelijke inwerkingtreding nog geen
      toepassing hebben, blijft van toepassing het bepaalde bij en krachtens de Wet voortgezet onderwijs BES zoals die
      luidde op de dag voor het tijdstip van de inwerkingtreding van dit artikel.

      3 Bij of krachtens algemene maatregel van bestuur wordt geregeld op welk moment, voor welke leerlingen of
      staatsexamenkandidaten, en voor zover nodig op welke wijze, nog gelegenheid wordt gegeven tot het afleggen van
      een eindexamen als bedoeld in artikel 32 van de Landsverordening voortgezet onderwijs dan wel een landsexamen als
      bedoeld in artikel 57 van die verordening zoals die artikelen luidden op 9 oktober 2010. De gelegenheid tot het
      afleggen van dit eindexamen komt in elk geval toe aan leerlingen die voor het tijdstip van de inwerkingtreding van
      dit artikel zijn toegelaten tot het eerste leerjaar van scholen als bedoeld in de [artikelen 13][ref4], [14][ref5],
      [15][ref6] en [17][ref7].

      4 De [artikelen 72, vijfde lid][ref8], en [116, zesde lid][ref9], zijn voor het eerst van toepassing op de examens
      in een bij koninklijk besluit te bepalen schooljaar. Dit schooljaar kan voor de verschillende vormen van voortgezet
      onderwijs, bedoeld in [artikel 6, onder a tot en met d][ref10], verschillend worden vastgesteld.


