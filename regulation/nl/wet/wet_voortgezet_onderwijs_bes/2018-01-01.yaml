    text: |-
      Indien een leerling gedurende een deel van de week onderwijs ontvangt op een andere school of wordt begeleid bij
      het expertisecentrum onderwijszorg, telt de tijd gedurende welke de leerling dit onderwijs ontvangt mee voor het
