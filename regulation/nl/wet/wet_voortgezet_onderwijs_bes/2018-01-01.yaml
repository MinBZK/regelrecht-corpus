  - number: '124'
    text: |-
      1 De aanspraak op bekostiging blijft bestaan indien het bevoegd gezag een vestiging van een school of
      scholengemeenschap binnen de grenzen van het openbaar lichaam verplaatst.

      2 Onze Minister kan voor bekostiging in aanmerking brengen:

      a. een school of scholengemeenschap die is ontstaan door samenvoeging van scholen of scholengemeenschappen, indien
      deze binnen hetzelfde openbaar lichaam gevestigd zijn,

      b. een scholengemeenschap die is ontstaan door samenvoeging van een scholengemeenschap waarvan een school voor
      middelbaar algemeen voortgezet onderwijs of een school voor voorbereidend beroepsonderwijs deel uitmaakt met
      een instelling als bedoeld in de [Wet educatie en beroepsonderwijs BES][ref1] die in hetzelfde openbaar lichaam
      gevestigd is, of

      c. een of meer scholen die door het bevoegd gezag worden afgesplitst van een scholengemeenschap.

      3 Na een samenvoeging wordt op een vestiging onderwijs verzorgd in dezelfde schoolsoorten als
      bedoeld in [artikel 6][ref2], in dezelfde profielen als bedoeld in [artikel 18, derde lid][ref3], of
      [artikel 29, derde lid][ref4], en in dezelfde leerjaren als op de desbetreffende vestiging voor de samenvoeging,
      behoudens wijzigingen in het onderwijsaanbod op grond van [artikel 119, derde lid][ref5].

      4 Onze Minister kan voor bekostiging in aanmerking brengen een nevenvestiging als bedoeld in [artikel 123][ref6],
      indien het bevoegd gezag heeft aangetoond dat het bestuurscollege van het desbetreffende openbaar lichaam de
      benodigde huisvesting ter beschikking zal stellen. De voorwaarde in de eerste volzin is niet van toepassing
      ten aanzien van instellingen als bedoeld in de [Wet educatie en beroepsonderwijs BES][ref7] en scholen waarvoor
      jaarlijks een bedrag voor huisvestingskosten wordt betaald op grond van [artikel 146][ref8].

      5 [Artikel 119, zesde lid][ref9], is van overeenkomstige toepassing bij toepassing van het tweede en vierde lid.
      [Artikel 120, eerste en derde lid][ref10], is van overeenkomstige toepassing bij toepassing van het tweede lid.


