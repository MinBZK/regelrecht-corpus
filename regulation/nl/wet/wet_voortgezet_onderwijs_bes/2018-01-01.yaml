        artikel: 230a
  - number: '146'
    text: |-
      In afwijking van dit hoofdstuk kan de eilandsraad besluiten dat jaarlijks een bedrag voor huisvestingskosten wordt
      betaald aan het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school voor zover die op het
      grondgebied van dat openbaar lichaam in stand wordt gehouden. De eilandsraad neemt het besluit in overeenstemming
      met het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel146
  - number: '147'
    text: |-
      Het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school is gehouden aan de eilandsraad
      onderscheidenlijk het bestuurscollege alle inlichtingen te verschaffen die de eilandsraad onderscheidenlijk het
      bestuurscollege voor een adequate uitvoering van de bepalingen in dit hoofdstuk noodzakelijk achten.
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel147
  - number: '148'
    text: |-
      1 De scholen, bedoeld in [afdeling I van titel II][ref1] worden door het Rijk bekostigd met inachtneming van de
      [artikelen 151 tot en met 187][ref2]. De uitgaven, bedoeld in de [artikelen 160][ref3] en [162][ref4], alsmede de
      bedragen die het openbaar lichaam krachtens deze wet in aanvulling op de rijksbekostiging verstrekt, blijven ten
      laste van het openbaar lichaam.

      2 Aan niet door het openbaar lichaam in stand gehouden scholen als bedoeld in [afdeling I van titel II][ref5] wordt
      uit de openbare kas geen bekostiging verstrekt dan krachtens de bepalingen van deze wet.

      3 Voor de toepassing van deze afdeling zijn de voorschriften die betrekking hebben op bijzondere scholen, van
      overeenkomstige toepassing op openbare scholen die in stand worden gehouden door een stichting als bedoeld in
      [artikel 98][ref6] of een openbare rechtspersoon als bedoeld in [artikel 97][ref7], tenzij het tegendeel blijkt.


