  - number: '42'
    text: |-
      Het onderwijs:

      a. gaat er mede van uit dat leerlingen opgroeien in een pluriforme samenleving,

      b. is mede gericht op het bevorderen van actief burgerschap en sociale integratie, en

      c. is er mede op gericht dat leerlingen kennis hebben van en kennismaken met verschillende achtergronden en
      culturen van leeftijdgenoten.
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel42
  - number: '43'
    text: |-
      1 De scholen voor voortgezet onderwijs zijn dagscholen.

      2
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel43
  - number: '44'
    text: |-
      1 De naam van de school duidt aan, tot welke van de soorten van scholen, bedoeld in de [artikelen 13][ref1],
      [14][ref2], [15][ref3], [17][ref4] en [31][ref5], de school behoort. Het bevoegd gezag van een school voor
      middelbaar algemeen voortgezet onderwijs, een school voor voorbereidend beroepsonderwijs, of een scholengemeenschap
      waarvan in ieder geval een school voor middelbaar algemeen voortgezet onderwijs of een school voor voorbereidend
      beroepsonderwijs deel uitmaakt, kan voor die school de aanduiding «voorbereidend middelbaar beroepsonderwijs»
      hanteren. Bij verschil van mening tussen het bevoegd gezag en Onze Minister, tot welke van de soorten zij behoort,
      beslist Onze Minister bij beschikking.

      2 In het maatschappelijk verkeer brengt het bevoegd gezag ondubbelzinnig tot uitdrukking:

      a. welk bij of krachtens deze wet geregeld, uit ’s Rijks kas bekostigd onderwijs de leerlingen volgen en aankomende
      leerlingen kunnen gaan volgen,

      b. van welke richting dit onderwijs uitgaat, en

      c. in voorkomend geval welk onderwijs de school verzorgt met toepassing van [artikel 43, tweede lid][ref6].


