  - number: '38'
    text: |-
      1 Het onderwijs aan scholen voor voorbereidend wetenschappelijk onderwijs en aan scholen voor hoger algemeen
      voortgezet onderwijs omvat met ingang van het vierde leerjaar een periode van voorbereidend hoger onderwijs.

      2 De periode van voorbereidend hoger onderwijs is ingericht volgens profielen. Een profiel is een samenhangend
      onderwijsprogramma, zodanig ingericht dat het biedt:

      a. een algemene maatschappelijke voorbereiding en persoonlijke vorming,

      b. een algemene voorbereiding op het hoger onderwijs, en

      c. een bijzondere voorbereiding op groepen van naar inhoud verwante opleidingen in het hoger onderwijs.

      3 De school verzorgt onderwijs in een of meer van de volgende profielen:

      a. het profiel natuur en techniek;

      b. het profiel natuur en gezondheid;

      c. het profiel economie en maatschappij;

      d. het profiel cultuur en maatschappij.

      4 Elk profiel bestaat uit:

      a. een gemeenschappelijk deel, dat voor alle profielen van de desbetreffende schoolsoort gelijk is,

      b. een profieldeel, dat kenmerkend is voor dat profiel, en

      c. een vrij deel.

      5 Het bevoegd gezag richt het onderwijs in de periode van voorbereidend hoger onderwijs in op de grondslag van een
      normatieve studielast voor de leerling van 1 600 uren per leerjaar, uitgaande van 40 weken met elk een normatieve
      studielast van 40 uren. Het bevoegd gezag richt daarbij een in schooltijd verzorgd samenhangend onderwijsprogramma
      in.
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel38
  - number: '39'
    text: |-
      1 Het gemeenschappelijk deel van elk profiel in het atheneum omvat:

      a. Nederlandse taal en literatuur,

      b. Engelse taal en literatuur,

      c. een andere moderne vreemde taal en literatuur, bij algemene maatregel van bestuur aan te wijzen, ter keuze van
      de leerling, voor zover het bevoegd gezag deze vakken aanbiedt,

      d. maatschappijleer,

      e. culturele en kunstzinnige vorming, met dien verstande dat indien Latijnse taal en cultuur of Griekse taal
      en cultuur, dan wel beide, deel uitmaken van het profiel, de leerling is vrijgesteld van het volgen van het vak
      culturele en kunstzinnige vorming, en

      f. lichamelijke opvoeding.

      2 Het gemeenschappelijk deel van elk profiel in het gymnasium omvat:

      a. Nederlandse taal en literatuur,

      b. Engelse taal en literatuur,

      c. Latijnse taal en cultuur of Griekse taal en cultuur, ter keuze van de leerling uit deze beide door het bevoegd
      gezag aan te bieden vakken,

      d. maatschappijleer, en

      e. lichamelijke opvoeding.

      3 Het profieldeel van het profiel natuur en techniek in het gymnasium en atheneum omvat:

      a. wiskunde,

      b. natuurkunde,

      c. scheikunde, en

      d. een vak ter keuze van de leerling uit vakken die bij algemene maatregel van bestuur zijn aangewezen, voor zover
      het bevoegd gezag deze vakken aanbiedt.

      4 Het profieldeel van het profiel natuur en gezondheid in het gymnasium en atheneum omvat:

      a. wiskunde,

      b. biologie,

      c. scheikunde, en

      d. een vak ter keuze van de leerling uit vakken die bij algemene maatregel van bestuur zijn aangewezen, voor zover
      het bevoegd gezag deze vakken aanbiedt.

      5 Het profieldeel van het profiel economie en maatschappij in het gymnasium en atheneum omvat:

      a. wiskunde,

      b. economie,

      c. geschiedenis, en

      d. een vak ter keuze van de leerling uit vakken die bij algemene maatregel van bestuur zijn aangewezen, voor zover
      het bevoegd gezag deze vakken aanbiedt.

      6 Het profieldeel van het profiel cultuur en maatschappij in het gymnasium en atheneum omvat:

      a. wiskunde,

      b. geschiedenis,

      c. een vak ter keuze van de leerling uit culturele vakken die bij algemene maatregel van bestuur zijn aangewezen,
      voor zover het bevoegd gezag deze vakken aanbiedt, en

      d. een vak ter keuze van de leerling uit maatschappelijke vakken die bij algemene maatregel van bestuur zijn
      aangewezen, voor zover het bevoegd gezag deze vakken aanbiedt.

      7 Het vrije deel van elk profiel in het gymnasium en atheneum omvat ten minste één vak uit het geheel van:

      a. vakken, genoemd in het eerste onderscheidenlijk tweede lid, die de leerling niet op grond van het eerste tot en
      met zesde lid heeft gekozen, voor zover het bevoegd gezag deze vakken als onderdeel van het vrije deel aanbiedt,

      b. vakken, genoemd in of aangewezen op grond van het derde tot en met zesde lid, die de leerling niet op grond van
      het eerste tot en met zesde lid heeft gekozen, voor zover het bevoegd gezag deze vakken als onderdeel van het vrije
      deel aanbiedt,

      c. andere bij algemene maatregel van bestuur aan te wijzen vakken, voor zover het bevoegd gezag deze aanbiedt, en

      d. door het bevoegd gezag vast te stellen vakken en andere programmaonderdelen.

      8 Het bevoegd gezag kan beslissen dat vakken en andere programmaonderdelen door alle leerlingen worden gevolgd.
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel39
  - number: '40'
    text: |-
      1 Het gemeenschappelijk deel van elk profiel in het hoger algemeen voortgezet onderwijs omvat:

      a. Nederlandse taal en literatuur,

      b. Engelse taal en literatuur,

      c. maatschappijleer,

      d. culturele en kunstzinnige vorming, en

      e. lichamelijke opvoeding.

      2 Het profieldeel van het profiel natuur en techniek in het hoger algemeen voortgezet onderwijs omvat:

      a. wiskunde,

      b. natuurkunde,

      c. scheikunde, en

      d. een vak ter keuze van de leerling uit vakken die bij algemene maatregel van bestuur zijn aangewezen, voor zover
      het bevoegd gezag deze vakken aanbiedt.

      3 Het profieldeel van het profiel natuur en gezondheid in het hoger algemeen voortgezet onderwijs omvat:

      a. wiskunde,

      b. biologie,

      c. scheikunde, en

      d. een vak ter keuze van de leerling uit vakken die bij algemene maatregel van bestuur zijn aangewezen, voor zover
      het bevoegd gezag deze vakken aanbiedt.

      4 Het profieldeel van het profiel economie en maatschappij in het hoger algemeen voortgezet onderwijs omvat:

      a. wiskunde,

      b. economie,

      c. geschiedenis, en

      d. een vak ter keuze van de leerling uit vakken die bij algemene maatregel van bestuur zijn aangewezen, voor zover
      het bevoegd gezag deze vakken aanbiedt.

      5 Het profieldeel van het profiel cultuur en maatschappij in het hoger algemeen voortgezet onderwijs omvat:

      a. geschiedenis,

      b. een andere moderne vreemde taal en literatuur, bij algemene maatregel van bestuur aan te wijzen, ter keuze van
      de leerling, voor zover het bevoegd gezag deze vakken aanbiedt,

      c. een vak ter keuze van de leerling uit culturele vakken die bij algemene maatregel van bestuur zijn aangewezen,
      voor zover het bevoegd gezag deze vakken aanbiedt, en

      d. een vak ter keuze van de leerling uit maatschappelijke vakken die bij algemene maatregel van bestuur zijn
      aangewezen, voor zover het bevoegd gezag deze vakken aanbiedt.

      6 Het vrije deel van elk profiel in het hoger algemeen voortgezet onderwijs omvat ten minste één vak uit het geheel
      van:

      a. vakken, genoemd in of aangewezen op grond van het tweede tot en met vijfde lid, die de leerling niet op grond
      van die leden heeft gekozen, voor zover het bevoegd gezag deze vakken als onderdeel van het vrije deel aanbiedt,

      b. andere bij algemene maatregel van bestuur aan te wijzen vakken, voor zover het bevoegd gezag deze aanbiedt, en

      c. door het bevoegd gezag vast te stellen vakken en andere programmaonderdelen.

      7 Het bevoegd gezag kan beslissen dat vakken en andere programmaonderdelen door alle leerlingen worden gevolgd.

      8 Het bevoegd gezag kan de leerling in de gelegenheid stellen, in plaats van de vakken, genoemd in of aangewezen op
      grond van het eerste tot en met zesde lid, de overeenkomstige vakken van [artikel 39][ref1] te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel39
