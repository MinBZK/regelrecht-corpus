  - number: '84'
    text: |-
      1 De onderwijsondersteunend functionaris kan worden belast met in [artikel 86, derde lid][ref1], bedoelde
      werkzaamheden in het voortgezet onderwijs indien deze:

      a. in het bezit is van een verklaring omtrent het gedrag, afgegeven ingevolge de
      [Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag BES][ref2], die op het tijdstip van
      overlegging aan het bevoegd gezag niet ouder is dan 6 maanden, en

      b. in het bezit is van een getuigschrift afgegeven krachtens de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref3] of de [Wet educatie en beroepsonderwijs BES][ref4],
      dat is voldaan aan de in [artikel 86, derde lid][ref5], bedoelde bekwaamheidseisen, of

      c. in het bezit is van een erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref6], verleend ten aanzien van de door hem te
      verrichten werkzaamheden, of

      d. niet krachtens rechterlijke uitspraak is uitgesloten van het verrichten van die werkzaamheden.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de wijze waarop een
      onderwijsondersteunende functionaris zijn bekwaamheid kan aantonen.

      3 Het eerste lid is niet van toepassing op een onderwijsondersteunende functionaris voor zover deze is belast met
      werkzaamheden in verband met contractactiviteiten.

      4 De onderwijsondersteunende functionaris die niet voldoet aan de eisen van het eerste lid, onder b, c of d,
      mag voor zover het werkzaamheden betreft waarvoor op grond van [artikel 86, derde lid][ref7], bekwaamheidseisen
      zijn vastgesteld, niettemin met die werkzaamheden worden belast, voor een periode van ten hoogste twee jaren.
      Aan de eerste volzin wordt uitsluitend toepassing gegeven indien het bevoegd gezag en betrokkene in ieder geval
      schriftelijk hebben verklaard dat betrokkene verplicht is zich in te spannen om binnen twee jaren alsnog te voldoen
      aan de bekwaamheidseisen voor die werkzaamheden. Het bevoegd gezag beschikt over geordende gegevens met betrekking
      tot de toepassing van de eerste volzin.

      5 Ten aanzien van studenten aan een opleiding als bedoeld in
      [artikel 7.7, tweede lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref8]
      en deelnemers aan de beroepsbegeleidende leerweg van een opleiding als bedoeld in
      [artikel 7.2.2 van de Wet educatie en beroepsonderwijs BES][ref9] die in het kader van die opleiding
      onderwijsondersteunende werkzaamheden verrichten waarvoor op grond van [artikel 86, derde lid][ref10],
      bekwaamheidseisen zijn vastgesteld, kan voor de duur van die werkzaamheden worden afgeweken van het eerste lid
      onder b tot en met d.


