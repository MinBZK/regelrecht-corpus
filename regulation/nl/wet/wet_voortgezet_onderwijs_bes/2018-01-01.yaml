  - number: 214a
    text: |-
      Tot een bij koninklijk besluit te bepalen tijdstip blijven de bepalingen van de Wet voortgezet onderwijs BES zoals
      die is komen te luiden op 10 oktober 2010, van kracht voor zover de regeling van de daarin opgenomen onderwerpen
      niet is vervangen door de inwerkingtreding van overeenkomstige onderwerpen in deze wet.
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel214a
  - number: 214b
    text: |-
      1 Personen die in het bezit zijn van een getuigschrift, afgegeven krachtens de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], waaruit blijkt dat ten aanzien van het vak
      omgangskunde is voldaan aan de bekwaamheidseisen die zijn vastgesteld krachtens [artikel 86, eerste lid][ref2],
      zijn tevens benoembaar of tewerkstelbaar zonder benoeming voor het geven van praktijkonderwijs als bedoeld
      in [artikel 31][ref3] en voor het geven van onderwijs aan groepen van uitsluitend geïndiceerde leerlingen in
      het leerwegondersteunend onderwijs, bedoeld in [artikel 30][ref4], in de vakken Nederlands, Engels, wiskunde,
      geschiedenis, aardrijkskunde, biologie (incl. kennis der natuur), verzorging, muziek, handvaardigheid (textiele
      werkvormen) en tekenen.

      2 Het eerste lid is uitsluitend van toepassing ten aanzien van personen die:

      a. het in het eerste lid bedoelde getuigschrift hebben behaald na 1 augustus 2006;

      b. voor 1 september 2012 zijn gestart met de opleiding tot leraar voortgezet onderwijs van de tweede graad in
      het vak omgangskunde aan de Fontys Hogeschool Tilburg, de NHL Hogeschool, de Hogeschool Leiden of de Hogeschool
      Utrecht; en

      c. uiterlijk op 31 augustus 2016 met goed gevolg de aanvullende opleiding «Leergang omgangskunde in
      praktijkonderwijs en leerwegondersteunend onderwijs» met een omvang van ten minste 420 uren studie hebben afgerond
      aan een van de in onderdeel b genoemde hogescholen.


