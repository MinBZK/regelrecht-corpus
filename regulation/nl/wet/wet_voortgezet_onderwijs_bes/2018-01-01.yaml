      1 Onverminderd bij algemene maatregel van bestuur gegeven voorschriften met betrekking tot de in- en uitschrijving
      van leerlingen, vindt toelating van een leerling als bedoeld in artikel 64 slechts plaats nadat door de ouders
      of, indien de leerling meerderjarig is, door de leerling de gegevens betreffende de geslachtsnaam, de voorletters,
      de geboortedatum, het geslacht en het persoonsgebonden nummer BES van de leerling zijn overgelegd. Indien door de
      ouders of, indien de leerling meerderjarig is, door de leerling aannemelijk wordt gemaakt dat geen persoonsgebonden
      nummer BES van de leerling kan worden overgelegd, vindt de toelating plaats met inachtneming van het derde lid.

