  - number: '86'
    text: |-
      1 Bij algemene maatregel van bestuur worden bekwaamheidseisen vastgesteld voor leraren.

      2 Bij algemene maatregel van bestuur kunnen voor werkzaamheden van leidinggevende aard die nauw verband houden met
      het pedagogisch-didactische klimaat op de school of onderwijskundige leiding omvatten, bekwaamheidseisen worden
      vastgesteld.

      3 Bij algemene maatregel van bestuur kunnen bekwaamheidseisen worden vastgesteld voor bij die maatregel aan te
      wijzen onderwijsondersteunende werkzaamheden die rechtstreeks verband houden met het onderwijsleerproces.

      4 De in het eerste lid bedoelde bekwaamheidseisen zijn gericht op het handelen in het onderwijsleerproces, het
      algemeen professioneel handelen en het werken binnen een onderwijsorganisatie. Zij omvatten in elk geval eisen ten
      aanzien van:

      a. pedagogisch-didactische kennis, inzicht en vaardigheden, en

      b. vakbekwaamheid.

      5 De in het eerste lid bedoelde bekwaamheidseisen kunnen worden onderscheiden naar schoolsoort en naar
      samenhangende leerjaren, met dien verstande dat zij in elk geval specifiek worden vastgesteld voor de periode van
      voorbereidend hoger onderwijs, bedoeld in [artikel 38, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel38
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel86
    references:
