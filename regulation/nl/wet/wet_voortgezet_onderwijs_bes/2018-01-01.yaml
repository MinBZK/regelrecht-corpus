        bwb_id: BWBR0028395
        artikel: 7.2.2
  - number: '18'
    text: |-
      1 Aan scholen voor voorbereidend beroepsonderwijs wordt, in elk profiel als bedoeld in het derde lid, onderwijs in
      de basisberoepsgerichte leerweg en de kaderberoepsgerichte leerweg gegeven.

      2 Het onderwijs aan scholen voor voorbereidend beroepsonderwijs is met ingang van het derde leerjaar ingericht
      volgens profielen. Een profiel is een in schooltijd verzorgd samenhangend onderwijsprogramma, zodanig ingericht dat
      het biedt:

      a. een algemene maatschappelijke voorbereiding en persoonlijke vorming, en

      b. een voorbereiding op naar inhoud verwante opleidingen in het aansluitend beroepsonderwijs.

      3 De school verzorgt één of meer profielen. De profielen zijn:

      a. bouwen, wonen en interieur,

      b. produceren, installeren en energie,

      c. mobiliteit en transport,

      d. media, vormgeving en ICT,

      e. maritiem en techniek,

      f. zorg en welzijn,

      g. economie en ondernemen,

      h. horeca, bakkerij en recreatie,

      i. groen,

      j. dienstverlening en producten.

      4 Elk profiel bestaat uit:

      a. een gemeenschappelijk deel, dat voor alle profielen gelijk is,

      b. een profieldeel, dat kenmerkend is voor dat profiel, en

      c. een vrij deel, dat bestaat uit door de leerling te kiezen vakken en andere programma-onderdelen.

      5 Het gemeenschappelijk deel van elk profiel in de beroepsgerichte leerwegen omvat Nederlandse taal, Engelse
      taal, maatschappijleer, lichamelijke opvoeding en ten minste één van de vakken behorende tot de beeldende vorming,
      muziek, dans of drama.

      6 Het profieldeel van de beroepsgerichte leerwegen omvat het bij het betreffende profiel behorend profielvak en,
      wat betreft:

      a. de profielen, genoemd in het derde lid, onderdelen a tot en met e: wiskunde en natuur- en scheikunde I,

      b. het profiel, genoemd in het derde lid, onderdeel f: biologie en, ter keuze van de leerling, wiskunde,
      maatschappijkunde, geschiedenis en staatsinrichting, of aardrijkskunde, met dien verstande dat het bevoegd gezag
      beslist welke van de laatste drie vakken wordt of worden aangeboden,

      c. de profielen, genoemd in het derde lid, onderdelen g en h: economie en, ter keuze van de leerling, wiskunde,
      Spaanse taal of Franse taal,

      d. het profiel genoemd in het derde lid, onderdeel i: wiskunde en, ter keuze van de leerling, biologie of natuur-
      en scheikunde I,

      e. het profiel genoemd in het derde lid, onderdeel j: ter keuze van de leerling twee van de vakken wiskunde,
      economie, biologie en natuur- en scheikunde I.

      7 Het vrije deel van elk profiel in de beroepsgerichte leerwegen:

      a. omvat door de leerling te kiezen beroepsgerichte keuzevakken,

      b. kan omvatten door het bevoegd gezag vast te stellen vakken en programma-onderdelen.

      8 Het bevoegd gezag beslist welke keuzetaal, genoemd in het zesde lid, onderdeel c, en welke beroepsgerichte
      keuzevakken, bedoeld in het zevende lid, onderdeel a, worden aangeboden. Het bevoegd gezag kan tevens beslissen dat
      door het bevoegd gezag aan te wijzen vakken en andere programma-onderdelen, bedoeld in het zevende lid, onderdeel
      b, door alle leerlingen in het vrije deel moeten worden gevolgd.

      9 Het bevoegd gezag kan de leerling in de gelegenheid stellen:

      a. in plaats van de vakken van de basisberoepsgerichte leerweg, genoemd in het vijfde en zesde lid, en de vakken
      die in de plaats komen van een tweede moderne vreemde taal, de overeenkomstige vakken van de kaderberoepsgerichte
      leerweg of de overeenkomstige vakken, genoemd in de [artikelen 16][ref1] en [29][ref2] of de overeenkomstige
      vakken, genoemd in dan wel aangewezen op grond van de [artikelen 39][ref3] en [40][ref4] te volgen,

      b. in plaats van de vakken van de kaderberoepsgerichte leerweg, genoemd in het vijfde en zesde lid, en de
      vakken die in de plaats komen van een tweede moderne vreemde taal, de overeenkomstige vakken, genoemd in de
      [artikelen 16][ref5] en [29][ref6] of de overeenkomstige vakken, genoemd in dan wel aangewezen op grond van de
      [artikelen 39][ref7] en [40][ref8] te volgen,

      c. in plaats van de vakken van de basisberoepsgerichte leerweg, genoemd in het zevende lid, onderdeel a, de
      overeenkomstige vakken van de kaderberoepsgerichte leerweg te volgen,

      d. een of meer bij algemene maatregel van bestuur aan te wijzen extra vakken te volgen.

      10 Bij of krachtens algemene maatregel van bestuur worden vastgesteld:

      a. de profielvakken, bedoeld in het zesde lid,

      b. voorschriften met betrekking tot de beroepsgerichte keuzevakken, bedoeld in het zevende lid, onderdeel a, en

      c. voorschriften over de mogelijkheid van vrijstelling en de bevoegdheid van het bevoegd gezag om ontheffing te
      verlenen van onderdelen van dit artikel.

      11 Onverminderd het zesde en zevende lid, kan bij algemene maatregel van bestuur worden vastgesteld het door alle
      leerlingen in het derde leerjaar te volgen minimum aantal vakken waarin eindexamen kan worden afgelegd, alsmede
      welke vakken het betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel29
