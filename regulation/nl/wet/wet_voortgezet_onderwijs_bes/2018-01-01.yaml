  - number: 214d
    text: |-
      1 Het bevoegd gezag van een school als bedoeld in [artikel 15][ref1] of [17][ref2] kan besluiten, in afwijking
      van [artikel 214c, eerste lid][ref3], met ingang van 1 augustus 2017 ten aanzien van het derde leerjaar van die
      school toepassing te geven aan het bepaalde bij of krachtens de [artikelen 16][ref4], [18][ref5] en [29][ref6],
      zoals luidend ingevolge de Wet van 10 februari 2016 tot wijziging van de Wet op het voortgezet onderwijs, de
      Wet voortgezet onderwijs BES en enkele aanverwante wetten in verband met het invoeren van profielen in het
      voorbereidend beroepsonderwijs en het middelbaar algemeen voortgezet onderwijs, alsmede de actualisatie en
      flexibilisering van het beroepsgerichte deel van de examenprogramma’s in het voorbereidend beroepsonderwijs (Stb.
      2016, 88). Bij toepassing van de eerste volzin zijn de in die volzin genoemde artikelen ten aanzien van de school
      met ingang van 1 augustus 2018 van toepassing op het vierde leerjaar.

      2 [Artikel 214c, tweede lid][ref7], is van overeenkomstige toepassing op scholen waarvan het bevoegd gezag een
      besluit als bedoeld in het eerste lid heeft genomen.

      3 In afwijking van [artikel 214c, derde lid][ref8], geldt voor scholen waarvan het bevoegd gezag een besluit als
      bedoeld in het eerste lid heeft genomen dat in het schooljaar 2017–2018 voor de laatste maal gelegenheid wordt
      gegeven tot het afleggen van het eindexamen voorbereidend middelbaar beroepsonderwijs volgens de op 31 juli 2016
      bij of krachtens de Wet op het voortgezet onderwijs, respectievelijk de Wet voortgezet onderwijs BES vastgestelde
      voorschriften, voor de leerlingen die voor 1 augustus 2017 zijn toegelaten tot het vierde leerjaar.

      4 In afwijking van het derde lid, geldt voor scholen waarvan het bevoegd gezag een besluit als bedoeld in het
      eerste lid heeft genomen dat het bevoegd gezag in het schooljaar 2018–2019 een eerder afgewezen leerling nogmaals
      in de gelegenheid stelt het in het derde lid bedoelde examen af te leggen.

      5 Dit artikel vervalt met ingang van 1 augustus 2021.


