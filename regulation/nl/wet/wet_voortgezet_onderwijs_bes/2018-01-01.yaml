  - number: '207'
    text: |-
      In afwijking van [artikel 118][ref1] berust de aanspraak op bekostiging van een school die op de dag voorafgaand
      aan het tijdstip van de inwerkingtreding van dit artikel, werd bekostigd op grond van de Wet voortgezet
      onderwijs BES zoals die wet op 10 oktober 2010 is komen te luiden, na de inwerkingtreding van artikel 118 op
      [titel III][ref2], met dien verstande dat:

      a. een school voor voorbereidend wetenschappelijk onderwijs als bedoeld in artikel 7 van de Landsverordening
      voortgezet onderwijs wordt aangemerkt als school voor voorbereidend wetenschappelijk onderwijs als bedoeld in
      [artikel 13][ref3],

      b. een school voor hoger algemeen voortgezet onderwijs als bedoeld in artikel 8 van de Landsverordening voortgezet
      onderwijs wordt aangemerkt als school voor hoger algemeen voortgezet onderwijs als bedoeld in [artikel 14][ref4],

      c. een school voor voorbereidend secundair beroepsonderwijs als bedoeld in artikel 9 van de Landsverordening
      voortgezet onderwijs wordt aangemerkt als scholengemeenschap als bedoeld in [artikel 123][ref5], waarbij:

      1°. het deel van het onderwijs dat wordt verzorgd in de school voor voorbereidend secundair beroepsonderwijs
      bestaande uit twee leerjaren waarin onderwijs wordt verzorgd in de basisvorming als bedoeld in artikel 10, eerste
      lid, van de Landsverordening voortgezet onderwijs en twee leerjaren waarin onderwijs wordt verzorgd in de leerweg
      theoretisch kadergerichte leerweg als bedoeld in artikel 11, tweede lid, onderdeel a, van de Landsverordening
      voortgezet onderwijs wordt aangemerkt als school voor middelbaar algemeen voortgezet onderwijs als bedoeld in
      [artikel 15][ref6],

      2°. het deel van het onderwijs dat wordt verzorgd in de school voor voorbereidend secundair beroepsonderwijs
      bestaande uit twee leerjaren waarin onderwijs wordt verzorgd in de basisvorming als bedoeld in artikel 10,
      eerste lid, van de Landsverordening voortgezet onderwijs en twee leerjaren waarin onderwijs wordt verzorgd in de
      leerwegen praktisch kadergerichte leerweg en de praktisch basisgerichte leerweg als bedoeld in artikel 11, tweede
      lid, onderdeel b, en onderdeel c, van de Landsverordening voortgezet onderwijs wordt aangemerkt als school voor
      voorbereidend beroepsonderwijs als bedoeld in [artikel 17][ref7],

      3°. de aan de school voor voorbereidend secundair beroepsonderwijs verbonden afdeling voor arbeidsgericht
      onderwijs als bedoeld in artikel 11c van de Landsverordening voortgezet onderwijs wordt aangemerkt als school voor
      praktijkonderwijs als bedoeld in [artikel 31][ref8], en

      d. de Saba Comprehensive School tot een bij koninklijk besluit te bepalen tijdstip wordt aangemerkt als inrichting
      voor voortgezet onderwijs als bedoeld in [artikel 117][ref9], en aansluitend daarop bij beschikking wordt
      aangemerkt als:

      1°. een school als bedoeld in één van de [artikelen 13][ref10], [14][ref11], [15][ref12], [17][ref13] en
      [31][ref14], of

      2°. een scholengemeenschap als bedoeld in [artikel 123][ref15], waarbij in de beschikking tevens wordt aangegeven
      welke scholen als bedoeld in de [artikelen 13][ref16], [14][ref17], [15][ref18], [17][ref19] en [31][ref20] de
      scholengemeenschap omvat.


