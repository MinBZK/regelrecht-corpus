  - number: 4a
    text: |-
      1 Het bevoegd gezag draagt zorg voor de veiligheid op school, waarbij het bevoegd gezag in ieder geval:

      a. beleid met betrekking tot de veiligheid voert,

      b. de veiligheid van leerlingen op school monitort met een instrument dat een representatief en actueel beeld
      geeft, en

      c. er zorg voor draagt dat bij een persoon ten minste de volgende taken zijn belegd:

      1°. het coördineren van het beleid in het kader van het tegengaan van pesten, en

      2°. het fungeren als aanspreekpunt in het kader van pesten.

      2 Onder veiligheid, bedoeld in het eerste lid, wordt verstaan de sociale, psychische en fysieke veiligheid van
      leerlingen.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over het instrument, bedoeld in het
      eerste lid, onderdeel b, dat door de school wordt vormgegeven of gekozen, waaronder:

      a. de aandachtsgebieden die het instrument inzichtelijk maakt,

      b. de representativiteit van het instrument, en

      c. de frequentie waarmee het instrument wordt ingezet.
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel4a
  - number: '5'
    text: |-
      1 Ten behoeve van het schoolbezoek verstrekt het bestuurscollege aan ouders van in het openbaar lichaam
      verblijvende leerlingen die wegens hun lichamelijke, verstandelijke of zintuiglijke handicap niet zelfstandig
      van vervoer gebruik kunnen maken, op aanvraag vergoeding van de door het bestuurscollege noodzakelijk te achten
      vervoerskosten. Indien de leerling meerderjarig en handelingsbekwaam is, wordt de vergoeding op aanvraag verstrekt
      aan de leerling. De eilandsraad stelt daartoe een nadere regeling vast, met inachtneming van het bepaalde in de
      volgende leden.

      2 De regeling maakt geen onderscheid tussen openbaar en bijzonder onderwijs.

      3 De regeling eerbiedigt de op godsdienst of levensbeschouwing van de ouders, dan wel, indien de leerling
      meerderjarig en handelingsbekwaam is, van de leerling berustende keuze van een school.

      4 De regeling voorziet erin dat het vervoer kan plaatsvinden op een wijze die voor de leerling passend is. De
      regeling bepaalt op welke wijze het bestuurscollege ter zake advies van deskundigen inwint.

      5 De regeling bepaalt dat de kosten worden vergoed van vervoer over de afstand tussen de woning van de leerling
      en de dichtstbijzijnde voor de leerling toegankelijke school, met inachtneming van de keuze van de ouders, dan
      wel, indien de leerling meerderjarig en handelingsbekwaam is, van de leerling, tenzij vervoer met betrekking
      tot een verder weg gelegen school voor het openbaar lichaam minder kosten met zich zou brengen en de ouders
      onderscheidenlijk de leerling met het vervoer naar die school instemmen.

      6 De regeling kan bepalen dat het openbaar lichaam, in plaats van vergoeding in geld te geven, het vervoer verzorgt
      of doet verzorgen.

      7 De regeling kan bepalen dat het bestuurscollege in bijzondere gevallen de bevoegdheid heeft ten gunste van de
      ouders, dan wel, indien de leerling meerderjarig en handelingsbekwaam is, ten gunste van de leerling van de inhoud
      van de regeling af te wijken.
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel5
  - number: '6'
    text: |-
      Het voortgezet onderwijs wordt onderscheiden in:

      a. voorbereidend wetenschappelijk onderwijs;

      b. hoger en middelbaar algemeen voortgezet onderwijs;

      c. voorbereidend beroepsonderwijs;

      d. praktijkonderwijs;

      e. andere vormen van voortgezet onderwijs.
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel6
  - number: '7'
    text: |-
      De bepalingen van de [hoofdstukken I][ref1] en [II][ref2] van deze afdeling regelen het openbaar schoolonderwijs;
      de bepalingen van de hoofdstukken I en [III][ref3] zijn voorwaarden voor bekostiging van het bijzonder
      schoolonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#HoofdstukI
