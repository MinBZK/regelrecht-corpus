  - number: '34'
    text: |-
      Bij algemene maatregel van bestuur worden kerndoelen vastgesteld, waarbij aandacht wordt besteed aan aspecten van:

      a. Nederlandse taal,

      b. Engelse taal,

      c. geschiedenis en staatsinrichting,

      d. aardrijkskunde,

      e. economie,

      f. wiskunde,

      g. natuur- en scheikunde,

      h. biologie,

      i. verzorging,

      j. informatiekunde,

      k. techniek,

      l. lichamelijke opvoeding, en

      m. beeldende vorming, muziek, drama en dans.
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel34
  - number: '35'
    text: |-
      1 Het bevoegd gezag richt voor de eerste twee leerjaren een in schooltijd verzorgd samenhangend onderwijsprogramma
      in. Dit programma voldoet aan de volgende voorwaarden:

      a. het bevoegd gezag werkt de kerndoelen uit voor de verschillende schoolsoorten en verschillende groepen
      leerlingen, onverminderd de doorstroombevordering met behoud van keuzevrijheid van leerlingen, bedoeld in
      [artikel 33][ref1], en

      b. in de eerste twee leerjaren worden gezamenlijk ten minste 1 425 uren onderwijs verzorgd op basis van de
      kerndoelen.

      2 Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven voor het verzorgen van
      onderwijs in de eerste twee leerjaren naast het onderwijs dat wordt verzorgd op basis van de kerndoelen.

      3 Het bevoegd gezag beschikt over geordende gegevens met betrekking tot de toepassing van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel33
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel35
