  - number: '26'
    text: |-
      1 Het bevoegd gezag kan bij de school ingeschreven leerlingen die daarbij naar zijn oordeel gebaat
      zijn, in de gelegenheid stellen om geheel of gedeeltelijk in plaats van de basisberoepsgerichte
      leerweg, bedoeld in [artikel 18, eerste lid][ref1], een assistentopleiding te volgen als bedoeld in
      [artikel 7.2.2, eerste lid, onder a, van de Wet educatie en beroepsonderwijs BES][ref2], met inachtneming van de
      [artikelen 7.2.6][ref3] en [8.1.1, zesde lid, van laatstgenoemde wet][ref4]. Artikel 18, tweede lid, tweede volzin,
      is van overeenkomstige toepassing.

      2 De assistentopleiding stemt overeen met het programma-aanbod van de beroepsgerichte programma’s van de
      basisberoepsgerichte leerweg die aan de school wordt verzorgd.

      3 Het bevoegd gezag is niet gehouden, leerlingen die een assistentopleiding volgen als bedoeld in het eerste lid,
      gelegenheid te geven om aan de school een eindexamen in de basisberoepsgerichte leerweg af te leggen als bedoeld in
      [artikel 72, eerste lid][ref5].

      4 Leerlingen die een assistentopleiding volgen als bedoeld in het eerste lid, worden aangemerkt als leerlingen van
      de basisberoepsgerichte leerweg waarvoor de assistentopleiding geheel of gedeeltelijk in de plaats treedt.

      5 Ten aanzien van bij de school ingeschreven leerlingen jonger dan 16 jaar wordt de assistentopleiding verzorgd met
      inachtneming van de volgende vereisten:

      a. de beroepspraktijkvorming, bedoeld in de [artikelen 7.2.7][ref6] en
      [7.2.8 van de Wet educatie en beroepsonderwijs BES][ref7], omvat uitsluitend het verrichten van lichte arbeid van
      geschikte aard,

      b. in plaats van de basisberoepsgerichte leerweg wordt geheel of gedeeltelijk zowel binnenschools als buitenschools
      onderricht in de praktijk van het beroep verzorgd,

      c. een gekwalificeerde mentor of docentbegeleider bewaakt de voortgang van het onderricht in de praktijk van het
      beroep, en

      d. het binnenschools en buitenschools onderricht in de praktijk van het beroep worden geïntegreerd verzorgd.


