  - number: '151'
    text: |-
      De kosten van de scholen zijn:

      a. huisvestingskosten,

      b. inventariskosten,

      c. personeelskosten, en

      d. exploitatiekosten.
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel151
  - number: '153'
    text: |-
      1 Aan scholen wordt in verband met de kosten voor personeel wegens voorschriften die zijn gegeven bij of krachtens
      de [Ambtenarenwet BES][ref1] bekostiging verstrekt.

      2 De in het eerste lid bedoelde bekostiging is verwerkt in de bedragen en in de vermenigvuldigingsbedragen van de
      verhoging, bedoeld in de [artikelen 154][ref2] en [155][ref3].


