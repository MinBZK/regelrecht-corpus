  - number: '32'
    text: |-
      1 Aan de ouders van een leerling van wie het bevoegd gezag van de school waar de leerling zich aanmeldt dan wel van
      de school waaraan de leerling is ingeschreven, redelijkerwijs kan aannemen dat deze niet in staat is het onderwijs
      in een van de leerwegen, genoemd in de [artikelen 16][ref1], [18][ref2] en [29][ref3], al dan niet in combinatie
      met leerwegondersteunend onderwijs, bedoeld in [artikel 30][ref4], met een diploma of getuigschrift voorbereidend
      middelbaar beroepsonderwijs als bedoeld in [artikel 72, derde lid][ref5], af te sluiten, kan het bevoegd gezag
      voorstellen deze leerling in plaats daarvan praktijkonderwijs te doen volgen.

      2 Het bevoegd gezag van de school voor praktijkonderwijs beslist over de toelating van de leerling tot het
      praktijkonderwijs. [Artikel 30, derde lid, tweede volzin][ref6], is van overeenkomstige toepassing.

      3 Het bevoegd gezag van de school voor praktijkonderwijs waaraan de leerling wordt toegelaten, stelt, na overleg
      met de ouders, voor de leerling een handelingsplan op. Het handelingsplan bevat een omschrijving van de wijze
      waarop voor de desbetreffende leerling het praktijkonderwijs met inachtneming van [artikel 31, derde lid][ref7],
      wordt verzorgd.


