      1 Het Rijk bekostigt openbare en bijzondere scholen voor zorg voor leerlingen met een specifieke onderwijsbehoefte.

      2 Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven ter uitvoering van het eerste
      lid.
