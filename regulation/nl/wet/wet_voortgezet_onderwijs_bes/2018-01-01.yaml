    text: |-
      1 Onze Minister kan aan een Raad onderwijs arbeidsmarkt subsidie verstrekken ten behoeve van zijn in
      [artikel 22][ref1] geregelde taken. Bij ministeriële regeling worden regels gesteld omtrent de wijze van
      subsidiëring.

      2 De [titels 4.1][ref2] en [4.2 van de Algemene wet bestuursrecht][ref3] en de
      [artikelen 4 tot en met 19 van de Wet overige OCW-subsidies][ref4] zijn van toepassing op de subsidie.


