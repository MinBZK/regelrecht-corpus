  - number: '136'
    text: |-
      1 Het bestuurscollege beslist met ingang van welk tijdstip de bekostiging van een voorziening daadwerkelijk een
      aanvang kan nemen, onverminderd het bepaalde in [artikel 137][ref1].

      2 De aanspraak op bekostiging van een voorziening vervalt, indien niet binnen een bij de beschikking te
      bepalen termijn met betrekking tot de voorziening een bouwopdracht is gegeven dan wel een koop-, huur- of
      erfpachtovereenkomst is gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel137
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '137'
        afdeling: II
  - number: '137'
    text: |-
      Voorzieningen komen voor bekostiging in aanmerking, mits op het op grond van [artikel 136, eerste lid][ref1],
      vastgestelde tijdstip,

      a. is voldaan aan de bij of krachtens de wet gestelde voorschriften, en

      b. de feiten en omstandigheden waarin de school verkeert, ten opzichte van de feiten en omstandigheden ten tijde
      van de vaststelling van de beschikking tot verlening niet ingrijpend zijn gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel136
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel137
