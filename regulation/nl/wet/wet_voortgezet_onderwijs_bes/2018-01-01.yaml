  - number: '36'
    text: |-
      1 Het bevoegd gezag van een school voor voorbereidend wetenschappelijk onderwijs, voor algemeen voortgezet
      onderwijs en voor voorbereidend beroepsonderwijs kan na overleg met de ouders een leerling ontheffing verlenen voor
      onderdelen van het onderwijsprogramma, bedoeld in [artikel 35, eerste lid, onderdeel a][ref1]. Het bevoegd gezag
      bepaalt bij de ontheffing welk onderwijs voor de leerling in de plaats komt voor de onderdelen waarvoor ontheffing
      is verleend.

      2 Het bevoegd gezag van een school voor voorbereidend wetenschappelijk onderwijs, voor algemeen voortgezet
      onderwijs en voor voorbereidend beroepsonderwijs kan voor leerlingen die daarvoor in aanmerking komen, bij
      de inrichting van het onderwijs afwijken van een of meer programmaonderdelen of van de voorschriften bedoeld
      in [artikel 35, eerste lid, onderdeel a][ref2]. De laatste volzin van het eerste lid is van overeenkomstige
      toepassing. Bij algemene maatregel van bestuur wordt bepaald hoe wordt vastgesteld welke leerlingen in aanmerking
      komen voor deze afwijkingen.

      3 Voor leerlingen:

      a. die leerwegondersteunend onderwijs volgen als bedoeld in [artikel 30][ref3], of

      b. voor wie het bevoegd gezag het volgen van een leer-werktraject als bedoeld in [artikel 19][ref4] het meest
      geschikt acht, verzorgt het bevoegd gezag in de eerste twee leerjaren gezamenlijk ten minste 1 425 uren onderwijs
      op basis van kerndoelen.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel35
