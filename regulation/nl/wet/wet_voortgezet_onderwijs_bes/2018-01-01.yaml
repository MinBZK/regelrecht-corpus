  - number: '31'
    text: |-
      1 Praktijkonderwijs wordt gegeven aan scholen voor praktijkonderwijs.

      2 Praktijkonderwijs is onderwijs voor leerlingen voor wie vaststaat dat

      a. overwegend een orthopedagogische en orthodidactische benadering is geboden, en

      b. het volgen van het onderwijs in een van de leerwegen, genoemd in de [artikelen 16][ref1], [18][ref2]
      en [29][ref3], al dan niet in combinatie met het volgen van leerwegondersteunend onderwijs, bedoeld in
      [artikel 30][ref4], niet leidt tot het behalen van een diploma of een getuigschrift voorbereidend middelbaar
      beroepsonderwijs als bedoeld in [artikel 72][ref5].

      3 Praktijkonderwijs bestaat uit een gedeelte waarin aangepast theoretisch onderwijs, persoonlijkheidsvorming
      en het aanleren van sociale vaardigheden worden verzorgd, en een gedeelte waarin de leerling wordt
      voorbereid op het uitoefenen van functies op de arbeidsmarkt. Praktijkonderwijs wordt zo veel
      mogelijk op basis van de kerndoelen verzorgd en is er op gericht dat leerlingen zo veel mogelijk de
      referentieniveaus Nederlandse taal en rekenen bereiken die voor het praktijkonderwijs zijn vastgesteld
      op grond van [artikel 47a][ref6]. Praktijkonderwijs bereidt de leerling voor op functies binnen de
      regionale arbeidsmarkt op een niveau dat ligt onder het niveau van de assistentopleiding, bedoeld in
      [artikel 7.2.2, eerste lid, onderdeel a, van de Wet educatie en beroepsonderwijs BES][ref7].

      4 Het praktijkonderwijs wordt zodanig ingericht dat de leerlingen per leerjaar ten minste 1 000 klokuren
      praktijkonderwijs ontvangen. De leerlingen ontvangen per dag ten hoogste 5,5 uren praktijkonderwijs, voor zover het
      betreft aangepast theoretisch onderwijs, persoonlijkheidsvorming en het aanleren van sociale vaardigheden.

      5 Het bevoegd gezag van een school voor praktijkonderwijs kan, met inachtneming van de tweede volzin
      van het derde lid en van het vierde lid, indien dat ten behoeve van de leerling noodzakelijk is, bij het
      aanbieden van dat onderwijs afwijken van de voorschriften, gegeven bij of krachtens de [artikelen 12a][ref8],
      [33 tot en met 35][ref9], [46][ref10] en [72][ref11].

      6 Bij algemene maatregel van bestuur worden voorschriften vastgesteld met betrekking tot de vakken die het
      praktijkonderwijs omvat, alsmede met betrekking tot het aantal uren dat het onderricht in de praktijk van de
      uitoefening van een vak of beroep gedurende een schoolweek ten hoogste omvat.


