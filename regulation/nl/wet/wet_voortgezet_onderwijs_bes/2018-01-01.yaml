      1 De kosten van herstel van schade aan gebouwen, terreinen en roerende zaken ten behoeve waarvan met betrekking tot
      scholen bekostiging wordt genoten, worden niet door het openbaar lichaam vergoed, indien:

      a. die schade door schuld of nalatigheid van de rechtspersoon die de school in stand houdt, wordt toegebracht, of

      b. het bevoegd gezag een beroep kan doen op een verzekering waarvoor de premie voor vergoeding in aanmerking komt,
      of voor de vergoeding van die schade door het openbaar lichaam een collectieve verzekering is afgesloten, voor
      zover die collectieve verzekering de schade dekt.

      2 Indien schade, ontstaan aan gebouwen, terreinen of roerende zaken van een door het openbaar lichaam bekostigde
      school voor vergoeding door het openbaar lichaam in aanmerking komt, treedt het openbaar lichaam op het moment van
      een uitdrukkelijk besluit tot vergoeding in alle rechten die het bevoegd gezag ter zake van die schade tegen derden
      mocht hebben.
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel174
  - number: '175'
    text: |-
      1 Het bevoegd gezag stelt jaarlijks een jaarverslag over het voorafgaande kalenderjaar vast. Op deze
      jaarverslaggeving is [Boek 2, titel 9, van het Burgerlijk Wetboek][ref1], met uitzondering van de
      [afdelingen 1][ref2], [11][ref3] en [12][ref4], van overeenkomstige toepassing voor zover bij of krachtens algemene
      maatregel van bestuur niet anders is bepaald. Het jaarverslag bestaat ten minste uit de volgende onderdelen:

      a. een bestuursverslag als bedoeld in [artikel 391 van Boek 2 van het Burgerlijk Wetboek][ref5] waarin de door het
      bevoegd gezag gehanteerde code voor goed bestuur wordt vermeld alsmede ten minste verantwoording wordt afgelegd
      over de afwijkingen van die code voor goed bestuur,

      b. een jaarrekening als bedoeld in [artikel 361 van Boek 2 van het Burgerlijk Wetboek][ref6], met daarbij ingevolge
      het derde lid vast te stellen bijlagen,

      c. overige gegevens als bedoeld in [artikel 392 van Boek 2 van het Burgerlijk Wetboek.][ref7]

      2 Bij algemene maatregel van bestuur kan worden bepaald welke onderdelen het jaarverslag tevens dient te bevatten,
      dan wel welke onderdelen komen te vervallen.

      3 Bij of krachtens algemene maatregel van bestuur kan een nadere invulling worden gegeven aan de onderdelen,
      bedoeld in het eerste lid, en kunnen nadere voorschriften worden gegeven over:

      a. de indeling en wijze van ordening van de gegevens per onderdeel van het jaarverslag,

      b. de wijze en het tijdstip waarop de desbetreffende onderdelen beschikbaar worden gesteld,

      c. de elektronische verzending van het cijfermatige deel uit de jaarrekening, en

      d. de grondslagen voor de jaarrekening.

      4 De beschikbaarstelling van de gegevens, bedoeld in het derde lid, onderdeel b, gaat vergezeld van een verklaring
      omtrent de getrouwheid en rechtmatigheid, afgegeven door een door de toezichthouder of het toezichthoudend orgaan
      aangewezen deskundige als bedoeld in [artikel 121, zesde lid, van Boek 2 van het Burgerlijk Wetboek BES][ref8].
      Bij de aanwijzing van de deskundige bedingt de toezichthouder of het toezichthoudend orgaan dat de controle
      overeenkomstig een door Onze Minister vast te stellen accountantsprotocol plaatsvindt en dat aan Onze Minister op
      diens verzoek inzicht wordt geboden in de controlerapporten van de deskundige.

      5

      6 Bij algemene maatregel van bestuur kan een branchecode voor goed bestuur worden aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Afdeling1
