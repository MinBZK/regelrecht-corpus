  - number: '92'
    text: |-
      Het bevoegd gezag benoemt, schorst en ontslaat de rector, de directeur, de conrectoren, de adjunct-directeuren, de
      leraren en het overige personeel.
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel92
  - number: '93'
    text: |-
      1 Het bevoegd gezag benoemt de rector, de directeur, de conrector en de adjunct-directeur, de leraren en het
      overige personeel, bedoeld in [artikel 92][ref1], in algemene dienst van het bevoegd gezag.

      2 Onder benoeming in algemene dienst van het bevoegd gezag wordt verstaan een benoeming ten behoeve van het
      verrichten van werkzaamheden aan door het bevoegd gezag in stand gehouden scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel92
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel93
