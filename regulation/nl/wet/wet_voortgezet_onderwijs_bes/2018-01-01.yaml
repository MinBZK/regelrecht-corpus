  - number: '121'
    text: |-
      1 De Rijksvertegenwoordiger draagt er zorg voor dat is voorzien in de behoefte aan openbaar onderwijs door een
      voldoende aantal scholen in het openbaar lichaam. Daartoe kan de Rijksvertegenwoordiger het bestuurscollege van
      het openbaar lichaam opdragen, een aanvraag bij Onze Minister in te dienen om een openbare school voor bekostiging
      in aanmerking te brengen indien de ouders van een naar het oordeel van de Rijksvertegenwoordiger voldoende groot
      aantal leerlingen hebben aangegeven dat zij dat wensen en het bestuurscollege van het openbaar lichaam daaraan niet
      heeft voldaan.

      2 Onze Minister kan het bestuurscollege van het openbaar lichaam opdragen een aanvraag bij hem in te dienen om een
      openbare school voor bekostiging in aanmerking te brengen, indien de Rijksvertegenwoordiger het eerste lid niet
      toepast en ouders van een naar het oordeel van Onze Minister voldoende groot aantal leerlingen hebben aangegeven
      dat zij indiening van een dergelijke aanvraag wensen.

      3 Indien een besluit van Onze Minister op een aanvraag als bedoeld in dit artikel onherroepelijk is geworden,
      gaat het bestuurscollege van het openbaar lichaam over tot stichting van de daarbij voor bekostiging in aanmerking
      gebrachte school.

      4 De bekostiging vangt aan op 1 augustus van enig kalenderjaar, ten vroegste in het eerste en ten laatste in het
      zesde kalenderjaar na het besluit van Onze Minister, afhankelijk van het moment dat het bestuurscollege van het
      openbaar lichaam huisvesting ter beschikking heeft.
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel121
  - number: '122'
    text: |-
      1 Onze Minister kan, onder door hem te stellen voorwaarden, voor bekostiging in aanmerking brengen een school die
      wordt opgericht door omzetting van een bekostigde openbare school in een gelijksoortige bijzondere school.

      2 Onze Minister brengt voor bekostiging in aanmerking een school die wordt opgericht door omzetting van een
      bekostigde bijzondere school in een gelijksoortige openbare school of door omzetting van een bekostigde bijzondere
      school in een gelijksoortige bijzondere school van een andere richting.

      3 Een omzetting kan slechts plaatsvinden met ingang van 1 augustus van enig kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel122
  - number: '123'
    text: |-
      1 Een scholengemeenschap omvat een school of inrichting in de zin van deze wet, en een of meer andere al dan niet
      in deze wet bedoelde scholen, inrichtingen of instellingen, die niet zijn instellingen voor hoger onderwijs.

      2 Aan een school of scholengemeenschap kan, naast een hoofdvestiging als bedoeld in
      [artikel 119, vierde lid][ref1], een nevenvestiging zijn verbonden.

      3 Een nevenvestiging is gelegen in hetzelfde openbaar lichaam als de desbetreffende hoofdvestiging.

      4 Een nevenvestiging komt tot stand door een samenvoeging als bedoeld in [artikel 124, tweede lid][ref2], of door
      vorming van een nieuwe nevenvestiging van een school als bedoeld in artikel 124, vierde lid.

      5 Op een nevenvestiging kan onderwijs worden verzorgd in dezelfde schoolsoorten als bedoeld in [artikel 6][ref3],
      in dezelfde afdelingen als bedoeld in [artikel 28][ref4], en in dezelfde leerjaren als op de hoofdvestiging.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel119
