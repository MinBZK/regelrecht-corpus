    text: |-
      Onze Minister kan aan personen die in het bezit zijn van een buiten de Europese Unie behaald bewijsstuk als bedoeld
      in [artikel 80, eerste lid, onderdeel b][ref1], de bevoegdheid verlenen tot het geven van voortgezet onderwijs in
      de openbare lichamen. Hij kan daarbij voorwaarden en beperkingen stellen.


