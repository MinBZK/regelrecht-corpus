        afdeling: I
  - number: '9'
    text: |-
      Het onderwijs wordt zodanig ingericht dat leerlingen die in verband met ziekte thuis verblijven dan wel zijn
      opgenomen in een ziekenhuis, op adequate wijze voldoende onderwijs kunnen genieten.
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel9
  - number: '10'
    text: |-
      1 Scholen dragen zorg voor een optimale aansluiting van leerlingen met een moedertaal die niet overeenkomt met de
      op de school gehanteerde instructietaal.

      2 Het onderwijs wordt zodanig ingericht dat daarbij op structurele en herkenbare wijze aandacht wordt besteed aan
      het bestrijden van achterstanden in het bijzonder in de beheersing van de Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel10
  - number: '11'
    text: |-
      Onderwijs in lichamelijke opvoeding, bestaande uit praktische bewegingsactiviteiten, wordt gespreid verzorgd
      over alle leerjaren van het voortgezet onderwijs. Dit onderwijs vindt plaats gespreid over de schoolweken, en in
      zodanige substantiële omvang en schooltijd dat wordt voldaan aan de eisen op het gebied van kwaliteit, intensiteit
      en variëteit van de bewegingsactiviteiten neergelegd in kerndoelen en examenprogramma’s. In afwijking van de
      tweede volzin geldt voor het laatste leerjaar het voorschrift, dat het onderwijs in het eindexamenvak lichamelijke
      opvoeding niet eerder mag worden afgesloten dan in de maand december.
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel11
  - number: '12'
    text: |-
      1 Het bevoegd gezag stelt elk leerjaar om niet aan een leerling lesmateriaal ter beschikking.

      2 Onder lesmateriaal wordt verstaan: lesmateriaal dat naar vorm en inhoud is gericht op informatieoverdracht in
      onderwijsleersituaties en waarvan het gebruik binnen het onderwijsaanbod door het bevoegd gezag specifiek voor het
      desbetreffende leerjaar is voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0030284/2018-01-01#Artikel12
  - number: 12a
    text: |-
      1 Voorbereidend wetenschappelijk onderwijs aan scholen als bedoeld in [artikel 13][ref1], omvat ten minste 5.700
      klokuren.

      2 Hoger algemeen voortgezet onderwijs:

      a. aan scholen als bedoeld in [artikel 14, onderdeel a][ref2], omvat ten minste 4.700 klokuren;

      b. aan afdelingen als bedoeld in [artikel 14, onderdeel b][ref3], omvat ten minste 1.700 klokuren.

      3 Middelbaar algemeen voortgezet onderwijs aan scholen als bedoeld in [artikel 15][ref4], omvat ten minste 3.700
      klokuren.

      4 Voorbereidend beroepsonderwijs aan scholen als bedoeld in [artikel 17][ref5], omvat ten minste 3.700 klokuren.

      5 Het bevoegd gezag vult de uren in met activiteiten die worden verzorgd in een onderwijsprogramma als bedoeld
      in de [artikelen 16, tweede lid][ref6], [18, tweede lid][ref7], [29, tweede lid][ref8], [35, eerste lid][ref9] en
      [38, vijfde lid, tweede volzin][ref10].

      6 Het bevoegd gezag beschikt over geordende gegevens over die invulling en over de spreiding van de uren over de
      verschillende leerjaren.


