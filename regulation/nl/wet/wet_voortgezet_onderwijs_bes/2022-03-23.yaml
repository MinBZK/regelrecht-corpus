  - number: 218a
    text: |-
      De artikelen die niet bij Besluit van 3 februari 2011, houdende vaststelling van het tijdstip van inwerkingtreding
      van een aantal onderdelen van de Aanpassingswet openbare lichamen Bonaire, Sint Eustatius en Saba (Stb. 2011,
      34) in werking zijn getreden, treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan, verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel218a
  - number: 218b
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van artikel V van de Wet van 4 juni 2015 tot wijziging
      van enige onderwijswetten in verband met het invoeren van verplichting voor scholen om zorg te dragen voor de
      veiligheid op school (Stb. 238) aan de Staten-Generaal een verslag over de doeltreffendheid en effecten van de
      [artikelen 4a][ref1] en [51, eerste lid, onderdeel k][ref2], in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel51
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel218b
