        artikel: '86'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
  - number: 80.1.b.2°
    text: |-
      een erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref1], verleend ten aanzien van het onderwijs dat
      betrokkene zal geven, of


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel5
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel80
    references:
