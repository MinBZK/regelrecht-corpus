    text: |-
      Onverminderd het zesde tot en met negende lid en het twaalfde lid en [artikel 85][ref1] kan ten aanzien van ho-
      studenten die:


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel85
