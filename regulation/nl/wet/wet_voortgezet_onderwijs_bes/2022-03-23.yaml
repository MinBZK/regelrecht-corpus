  - number: '64.2'
    text: |-
      Voor het volgen van een vorm van onderwijs als onderscheiden in [artikel 6][ref1] aan een school wordt uitsluitend
      als leerling toegelaten degene waarvan de ouders aantonen, dan wel, indien hij meerderjarig en handelingsbekwaam
      is, degene die aantoont dat hij:


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel6
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '6'
  - number: 64.2.a
    text: de Nederlandse nationaliteit bezit of op grond van een wettelijke bepaling als Nederlander wordt behandeld,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel64
  - number: 64.2.b
    text: |-
      vreemdeling is en jonger is dan 18 jaar op de eerste schooldag waarop de vorm van voortgezet onderwijs als
      onderscheiden in [artikel 6][ref1] begint waarvoor voor de eerste maal toelating wordt gewenst,


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel6
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '6'
  - number: 64.2.c
    text: |-
      vreemdeling is, 18 jaar of ouder is op de eerste schooldag waarop de vorm van voortgezet onderwijs als
      onderscheiden in [artikel 6][ref1] begint waarvoor voor de eerste maal toelating wordt gewenst en op die dag
      rechtmatig verblijf houdt in de zin van [3][ref2], [5a][ref3] of [6 van de Wet toelating en uitzetting BES][ref4],
      of


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0028571#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0028571#Artikel5a
      [ref4]: https://wetten.overheid.nl/BWBR0028571#Artikel6
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0028571
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0028571
        artikel: 5a
      - id: ref4
        bwb_id: BWBR0028571
        artikel: '6'
  - number: 64.2.d
    text: |-
      vreemdeling is, niet meer voldoet aan een van de voorwaarden, genoemd onder b of c, en eerder in overeenstemming
      met een van die onderdelen voor een vorm van voortgezet onderwijs als onderscheiden in [artikel 6][ref1] is
      toegelaten tot een school, welke vorm van voortgezet onderwijs nog steeds wordt gevolgd en nog niet is voltooid.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel6
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '6'
  - number: '64.3'
    text: |-
      Indien na de toelating tot de school blijkt dat deze op welke grond dan ook niet in overeenstemming met het tweede
      lid heeft plaatsgevonden, wordt de leerling onmiddellijk verwijderd.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel64
  - number: '64.4'
    text: De toelating wordt niet afhankelijk gesteld van een andere dan een bij of krachtens de wet geregelde bijdrage.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel64
  - number: '64.6'
    text: |-
      Op een bezwaarschrift ter zake van de toelating of verwijdering van leerlingen, beslist het
      bevoegd gezag, voor zover het een bevoegd gezag van een openbare school betreft in afwijking van
      [artikel 69, eerste lid, van de Wet administratieve rechtspraak BES][ref1], binnen vier weken na ontvangst van het
      bezwaarschrift, doch niet eerder dan nadat de kandidaat-leerling, respectievelijk de leerling en, indien deze nog
      niet meerderjarig is, ook diens ouders, in de gelegenheid is, respectievelijk zijn gesteld, te worden gehoord en
      kennis heeft respectievelijk hebben kunnen nemen van de op die besluiten betrekking hebbende adviezen of rapporten.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel69
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0028455
        artikel: '69'
  - number: 64a.1
    text: |-
      Het bevoegd gezag weigert een leerling niet de toelating tot het vijfde leerjaar van het voorbereidend
      wetenschappelijk onderwijs dan wel het vierde leerjaar van het hoger algemeen voortgezet onderwijs op grond van
      zijn oordeel over kennis, vaardigheden of leerhouding van de leerling, indien de leerling in het bezit is van een
      diploma hoger algemeen voortgezet onderwijs onderscheidenlijk een diploma voorbereidend middelbaar beroepsonderwijs
      in de theoretische of gemengde leerweg.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel64a
  - number: 64a.2
    text: |-
      In afwijking van het eerste lid, mag het bevoegd gezag de toelating weigeren indien de leerling niet voldoet aan
      voorwaarden die bij algemene maatregel van bestuur kunnen worden gesteld met betrekking tot kennis, vaardigheden of
      leerhouding van de leerling.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel64a
  - number: 64a.3
    text: |-
      De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel64a
  - number: '65.1'
    text: |-
      Onverminderd bij algemene maatregel van bestuur gegeven voorschriften met betrekking tot de in- en uitschrijving
      van leerlingen, vindt toelating van een leerling als bedoeld in artikel 64 slechts plaats nadat door de ouders
      of, indien de leerling meerderjarig is, door de leerling de gegevens betreffende de geslachtsnaam, de voorletters,
      de geboortedatum, het geslacht en het persoonsgebonden nummer BES van de leerling zijn overgelegd. Indien door de
      ouders of, indien de leerling meerderjarig is, door de leerling aannemelijk wordt gemaakt dat geen persoonsgebonden
      nummer BES van de leerling kan worden overgelegd, vindt de toelating plaats met inachtneming van het derde lid.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel65
  - number: '66.1'
    text: |-
      Het bevoegd gezag doet onverwijld opgave aan het bestuurscollege van het openbaar lichaam waar de betrokkene woon-
      of verblijfplaats heeft van de gegevens van degene
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel66
  - number: 66.1.a
    text: |-
      op wie de [Leerplichtwet BES][ref1] niet meer van toepassing is en die de leeftijd van 25 jaren nog niet heeft
      bereikt,


      [ref1]: https://wetten.overheid.nl/BWBR0030281
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0030281
  - number: 66.1.b
    text: |-
      die niet in het bezit is van een diploma voorbereidend wetenschappelijk onderwijs
      of hoger algemeen voortgezet onderwijs als bedoeld in [artikel 13][ref1]
      onderscheidenlijk [artikel 14][ref2] dan wel een diploma van een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen b tot en met e, van de Wet educatie en beroepsonderwijs BES][ref3], en


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '13'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '14'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0028395
        artikel: '7'
  - number: 66.1.c
    text: die
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel66
  - number: 66.1.c.1°
    text: |-
      het onderwijs aan de school gedurende een aaneengesloten periode van ten minste een maand of een door het bevoegd
      gezag te bepalen kortere periode zonder geldige reden niet meer volgt, of
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel66
  - number: 66.1.c.2°
    text: bij de school wordt in- of uitgeschreven of van de school wordt verwijderd.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel66
  - number: '66.2'
    text: Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel66
  - number: '66.3'
    text: |-
      Bij de verwerking van gegevens, bedoeld in dit artikel, wordt het persoonsgebonden nummer BES van de betrokkene
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel66
  - number: '66.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de wijze van de verstrekking van
      gegevens op grond van het eerste lid en wordt een nadere specificatie gegeven van de gegevens die op grond van het
      eerste lid worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel66
  - number: '66.5'
    text: |-
      De gegevens die worden verstrekt op grond van het eerste lid kunnen persoonsgegevens als bedoeld in
      [artikel 16 van de Wet bescherming persoonsgegevens BES][ref1] omvatten, met uitzondering van gegevens over ras,
      politieke gezindheid, seksueel leven of het lidmaatschap van een vakvereniging, voor zover deze persoonsgegevens
      noodzakelijk zijn met het oog op de informatieverstrekking over de achtergronden van het verzuim.


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel16
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0028067
        artikel: '16'
  - number: 66a.1
    text: |-
      De deelname van leerlingen aan activiteiten die geen onderdeel uitmaken van het verplichte onderwijsprogramma
      en worden georganiseerd onder verantwoordelijkheid van het bevoegd gezag, wordt niet afhankelijk gesteld van een
      bijdrage als bedoeld in [artikel 64, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel64
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel66a
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '64'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 66a.2
    text: 'Aan het eerste lid wordt in ieder geval voldaan voor de daar bedoelde activiteiten, indien:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel66a
  - number: 66a.2.a
    text: |-
      deze activiteiten buiten de kerndoelen, bedoeld in [artikel 34][ref1], of eindtermen en eindexamenprogramma’s
      langdurig aan leerlingen worden aangeboden door een school die door dat bevoegd gezag in stand gehouden wordt,


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel34
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel66a
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '34'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 66a.2.b
    text: die school is aangesloten bij een verband van scholen die dergelijke activiteiten organiseren, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel66a
  - number: 66a.2.c
    text: |-
      krachtens een door dat verband vastgestelde code een regeling is getroffen voor de leerlingen ten aanzien van wie
      niet of niet geheel de gevraagde ouderbijdrage wordt betaald.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel66a
  - number: 66a.3
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gesteld aan de scholen, bedoeld in het tweede lid,
      onderdeel b, en aan de code, bedoeld in het tweede lid, onderdeel c.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel66a
  - number: '67.1'
    text: |-
      Het bevoegd gezag is voor elk van zijn scholen aangesloten bij een samenwerkingsverband met, voor zover aanwezig in
      het openbaar lichaam:
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel67
  - number: 67.1.a
    text: een of meer scholen,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel67
  - number: 67.1.b
    text: een of meer scholen voor basisonderwijs,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel67
  - number: 67.1.c
    text: |-
      een of meer instellingen als bedoeld in de [Wet educatie en beroepsonderwijs BES][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0028395
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0028395
  - number: 67.1.d
    text: |-
      de uitvoeringsinstantie, bedoeld in [artikel 5, tweede lid, van de Wet sociale kanstrajecten jongeren BES][ref1],
      en


      [ref1]: https://wetten.overheid.nl/BWBR0028506#Artikel5
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0028506
        artikel: '5'
  - number: 67.1.e
    text: een expertisecentrum onderwijszorg.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel67
  - number: '67.2'
    text: |-
      In afwijking van het eerste lid kan een samenwerkingsverband bestaan uit de betrokkenen, bedoeld in de onderdelen
      a, b, c of d, die gezamenlijk een expertisecentrum onderwijszorg in stand houden.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel67
  - number: '67.3'
    text: |-
      Het samenwerkingsverband stelt zich ten doel een samenhangend geheel van zorgvoorzieningen binnen en tussen scholen
      en in samenwerking met de betrokkenen, bedoeld in het eerste lid, onderdelen b tot en met e, te realiseren en wel
      zodanig dat zoveel mogelijk leerlingen, vavo-studenten en mbo-studenten een ononderbroken onderwijsloopbaan kunnen
      doormaken.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel67
  - number: '67.4'
    text: Per openbaar lichaam is er één samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel67
  - number: '67.5'
    text: |-
      Indien een bevoegd gezag wenst deel te nemen aan het samenwerkingsverband, wordt deze deelname door de bevoegde
      gezagsorganen van het samenwerkingsverband niet geweigerd.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel67
  - number: '67.6'
    text: |-
      Bij ministeriële regeling worden regels gesteld over de wijze waarop een geschil tussen de organisaties, bedoeld in
      het eerste lid, over aangelegenheden die het samenwerkingsverband aangaan, wordt beslecht.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel67
  - number: '68.1'
    text: |-
      Het bevoegd gezag stelt samen met de bevoegde gezagsorganen die samenwerken in een samenwerkingsverband en met het
      expertisecentrum onderwijszorg indien [artikel 67, eerste lid][ref1], van toepassing is, jaarlijks voor 1 mei een
      gezamenlijk eilandelijk zorgplan vast voor het daaropvolgende schooljaar.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel67
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '67'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
  - number: '68.2'
    text: 'Het eilandelijk zorgplan bevat in elk geval een beschrijving van:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel68
  - number: 68.2.a
    text: |-
      de wijze waarop wordt voldaan aan [artikel 67, eerste en derde lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel67
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '67'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
  - number: 68.2.b
    text: |-
      de wijze, waarop de bekostiging voor de zorgvoorzieningen, bedoeld in [artikel 149][ref1], wordt ingezet,


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel149
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '149'
        hoofdstuk: I
        afdeling: III
  - number: 68.2.c
    text: |-
      de wijze waarop de subsidie voor de taken, bedoeld in [artikel 69, eerste lid][ref1], en voor zover van toepassing
      het zevende lid van dat artikel, wordt ingezet,


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel69
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '69'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
  - number: 68.2.d
    text: |-
      de beoogde en bereikte kwalitatieve en kwantitatieve resultaten ten aanzien van de onderwijskundige opvang van de
      leerlingen, vavo-studenten en mbo-studenten met een specifieke onderwijsbehoefte,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel68
  - number: 68.2.e
    text: de procedures voor de handelingsgerichte diagnose van leerlingen, vavo-studenten en mbo-studenten, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel68
  - number: 68.2.f
    text: de wijze waarop aan de ouders informatie wordt verstrekt over de zorgvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel68
  - number: '68.3'
    text: |-
      Het eilandelijk zorgplan wordt voor 15 mei voorafgaand aan het schooljaar waarop het betrekking heeft, toegezonden
      aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel68
  - number: '69.1'
    text: |-
      Onze Minister kan op verzoek een rechtspersoon aanwijzen die naar zijn oordeel in staat is deskundige ondersteuning
      te bieden aan leerlingen met een specifieke onderwijsbehoefte waarin binnen de school redelijkerwijs niet kan
      worden voorzien en waaronder in elk geval de volgende taken worden verstaan:
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel69
  - number: 69.1.a
    text: |-
      het verzorgen van onderwijsondersteunende activiteiten aan leerlingen met een lichamelijke, verstandelijke,
      zintuiglijke, geestelijke of meervoudige handicap of stoornis,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel69
  - number: 69.1.b
    text: |-
      het verzorgen van ambulante begeleiding ten behoeve van leerlingen met een lichamelijke, verstandelijke,
      zintuiglijke, geestelijke of meervoudige handicap of stoornis,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel69
  - number: 69.1.c
    text: |-
      het verrichten van handelingsgerichte diagnostiek ten behoeve van de leerlingen op verzoek van het bevoegd gezag,
      het samenwerkingsverband of de ouders, of
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel69
  - number: 69.1.d
    text: |-
      het op verzoek van een bevoegd gezag, het samenwerkingsverband of de ouders van leerlingen adviseren en collegiaal
      consulteren.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel69
  - number: '69.2'
    text: |-
      De rechtspersoon, bedoeld in het eerste lid, wordt voor de toepassing van deze wet aangeduid als expertisecentrum
      onderwijszorg.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel69
  - number: '69.3'
    text: |-
      Een leerling die binnen een locatie van het expertisecentrum onderwijszorg wordt begeleid, blijft ingeschreven bij
      de school. Het bevoegd gezag van deze school blijft verantwoordelijk voor de leerling tijdens het verblijf binnen
      het expertisecentrum onderwijszorg. Onder deze verantwoordelijkheid valt in elk geval de zorg voor het geven van
      adequaat onderwijs door een leraar die daartoe bevoegd is op grond van [artikel 80][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel80
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '80'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
  - number: '69.4'
    text: |-
      Met inachtneming van [artikel 172][ref1] vergoedt het bevoegd gezag voor het begeleiden van zijn leerling, bedoeld
      in het derde lid, naar redelijkheid en indien dit naar het oordeel van het samenwerkingsverband, bedoeld in
      [artikel 67][ref2], nodig is, de kosten die worden gemaakt door:


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel172
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel67
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '172'
        hoofdstuk: IV
        afdeling: III
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '67'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
  - number: 69.4.a
    text: het expertisecentrum onderwijszorg, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel69
  - number: 69.4.b
    text: |-
      een ander bevoegd gezag van een school of instelling als bedoeld in
      [artikel 67, eerste lid, onderdelen a tot en met c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel67
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '67'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
  - number: '69.5'
    text: Per openbaar lichaam is er één expertisecentrum onderwijszorg.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel69
  - number: '69.6'
    text: |-
      Het expertisecentrum onderwijszorg treft een regeling voor de behandeling van klachten over gedragingen en
      beslissingen van het bestuur van dit centrum of het personeel, waaronder discriminatie, dan wel het nalaten van
      gedragingen en het niet nemen van beslissingen door het bestuur of het personeel voor zover het betreft zijn
      onderscheidenlijk hun werkzaamheden in het kader van het onderwijsproces of de deskundige ondersteuning, bedoeld in
      het eerste lid. [Artikel 52][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel52
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '52'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '69.7'
    text: Bij ministeriële regeling kunnen voorschriften worden gegeven over de taken van het expertisecentrum onderwijszorg.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel69
  - number: '70.1'
    text: |-
      Met het toezicht op de uitvoering van de taken, bedoeld in [artikel 69, eerste lid][ref1], en voor zover van
      toepassing het zevende lid van dat artikel, zijn belast de bij besluit van Onze Minister aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel69
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '69'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
  - number: '70.2'
    text: |-
      De [artikelen 5:13][ref1], [5:15][ref2], [5:16][ref3], [5:17][ref4] en
      [5:20, eerste en tweede lid, van de Algemene wet bestuursrecht][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '70.3'
    text: |-
      Onze Minister is bevoegd tot overeenkomstige toepassing van
      [artikel 5:20, derde lid, van de Algemene wet bestuursrecht][ref1] ten aanzien van de in het eerste lid bedoelde
      taken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '71.1'
    text: |-
      Onze Minister is bevoegd tot het treffen van noodzakelijke voorzieningen indien het expertisecentrum onderwijszorg
      naar het oordeel van Onze Minister zijn taken ernstig verwaarloost.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel71
  - number: '71.2'
    text: |-
      De voorzieningen, bedoeld in het eerste lid, worden niet eerder getroffen dan nadat het expertisecentrum
      onderwijszorg in de gelegenheid is gesteld om binnen een door Onze Minister te stellen redelijke termijn alsnog
      zijn taken naar behoren uit te voeren.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel71
  - number: '72.1'
    text: |-
      Aan de leerlingen van de scholen voor voorbereidend wetenschappelijk onderwijs, voor hoger algemeen voortgezet
      onderwijs, voor middelbaar algemeen voortgezet onderwijs en voor voorbereidend beroepsonderwijs wordt gelegenheid
      gegeven aan deze scholen een eindexamen af te leggen, tenzij in de plaats daarvan de gelegenheid bestaat tot het
      afleggen van een eindexamen, dat niet vanwege de school wordt afgenomen en het bevoegd gezag in verband hiermede
      een eindexamen aan de school niet nodig oordeelt. Het eindexamen kan voor elk vak of ander programma-onderdeel
      bestaan uit een schoolexamen, uit een centraal examen dan wel beide.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel72
  - number: 72.1a
    text: |-
      Indien ten aanzien van een schoolsoort of leerweg het gemiddelde verschil tussen de cijfers van het centraal
      examen en het schoolexamen over een periode van drie jaren meer dan een half punt bedraagt, kan Onze Minister in
      afwijking van het eerste lid besluiten dat het bevoegd gezag voor een periode van twee jaren leerlingen niet in de
      gelegenheid stelt een eindexamen af te leggen in de desbetreffende schoolsoort of leerweg.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel72
  - number: 72.1b
    text: |-
      Onze Minister besluit of toepassing wordt gegeven aan lid 1a nadat het bevoegd gezag van de school gedurende een
      periode van ten minste drie jaar de gelegenheid heeft gehad, het gemiddelde verschil, bedoeld in lid 1a, ongedaan
      te maken, voor zover dat verschil meer dan een half punt bedraagt.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel72
  - number: '72.2'
    text: |-
      Het eindexamen wordt afgenomen door de rector, de directeur, de conrector, de adjunct-directeur of een of meer
      leraren van de school. Het eindexamen staat onder toezicht van een of meer gecommitteerden behoudens voor bij
      of krachtens algemene maatregel van bestuur aan te wijzen examens en examenonderdelen. Bij of krachtens algemene
      maatregel van bestuur wordt bepaald door wie en op welke wijze de gecommitteerden worden aangewezen. Het eindexamen
      kan mede worden afgenomen door deskundigen. Het bevoegd gezag wijst de deskundigen aan.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel72
  - number: '72.3'
    text: |-
      Zij die het eindexamen met goed gevolg hebben afgelegd, ontvangen een diploma. Leerlingen van een school voor
      voorbereidend beroepsonderwijs voor zover het betreft de basisberoepsgerichte leerweg, die met goed gevolg
      een gedeelte van het examenprogramma hebben afgelegd, ontvangen een getuigschrift voorbereidend middelbaar
      beroepsonderwijs en leerlingen die een leer-werktraject met goed gevolg afsluiten, ontvangen een diploma
      basisberoepsgerichte leerweg/leer-werktraject. Onze Minister stelt de modellen van diploma's en getuigschriften
      vast.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel72
  - number: '72.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften vastgesteld omtrent de in dit artikel
      bedoelde eindexamens, alsmede omtrent programmaonderdelen, die niet voor alle leerlingen van een school dezelfde
      vakken en andere programmaonderdelen behoeven te omvatten. Bij deze algemene maatregel van bestuur worden
      tevens de eindexamenprogramma's vastgesteld. Bij de vaststelling van de eindexamenprogramma’s Nederlandse taal
      respectievelijk Nederlandse taal en literatuur worden de referentieniveaus Nederlandse taal in acht genomen
      die voor de desbetreffende vormen van onderwijs of voor dan wel binnen leerwegen zijn vastgesteld op grond van
      [artikel 47a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel47a
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: 47a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '72.5'
    text: |-
      Voor examens, die niet vanwege de school worden afgenomen, kunnen bij algemene maatregel van bestuur voorschriften
      worden gegeven.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel72
  - number: '72.6'
    text: |-
      Ten behoeve van de bijzondere inrichting van het onderwijs aan een school kan Onze Minister besluiten toe te staan
      dat wordt afgeweken van het bepaalde bij of krachtens dit artikel. Onze Minister besluit binnen zes maanden na
      ontvangst van een aanvraag. Indien de beschikking niet binnen zes maanden kan worden gegeven, stelt Onze Minister
      de aanvrager daarvan in kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden
      gezien.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel72
  - number: '73.1'
    text: |-
      De directeur reikt een schooldiploma praktijkonderwijs uit aan de leerling die een school voor praktijkonderwijs
      verlaat en naar het oordeel van de directeur in aanmerking komt voor het schooldiploma. De directeur baseert zijn
      oordeel op een reglement dat door het bevoegd gezag wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel73
  - number: '73.2'
    text: Een portfolio waarin de behaalde resultaten zijn opgenomen, maakt deel uit van het schooldiploma.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel73
  - number: '73.3'
    text: Bij ministeriële regeling wordt een model voor het schooldiploma vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel73
  - number: '73.4'
    text: |-
      De leerling die een deel van het programma heeft voltooid, de school voor praktijkonderwijs verlaat en niet op
      grond van het eerste lid een schooldiploma ontvangt, ontvangt een verklaring.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel73
  - number: '74.1'
    text: |-
      Een diploma als bedoeld in [artikel 72, derde lid][ref1], kan ook worden uitgereikt aan degenen die niet als
      leerlingen van een school zijn ingeschreven, maar tot het eindexamen van die school zijn toegelaten en dit met
      gunstig gevolg hebben afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel72
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '72'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: '74.2'
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften vastgesteld omtrent de in het eerste lid bedoelde toelating
      tot het eindexamen. Daarbij wordt vastgesteld in welke gevallen een bedrag aan het bevoegd gezag verschuldigd is,
      alsmede de hoogte daarvan.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel74
  - number: '76.1'
    text: |-
      De leerling die de school verlaat en aan wie geen diploma kan worden uitgereikt, ontvangt een verklaring waarin
      in ieder geval worden vermeld het tijdstip waarop hij de school verlaat en het leerjaar waartoe hij laatstelijk
      onvoorwaardelijk was bevorderd alsmede voor welke vormen van vervolgonderwijs en voor welke leerjaren daarvan hij
      geschikt wordt geacht. De verklaring wordt door het bevoegd gezag of namens het bevoegd gezag door de rector of de
      directeur, ondertekend.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel76
  - number: '76.2'
    text: Onze Minister stelt het model van de verklaring vast.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel76
  - number: '77.1'
    text: |-
      Aan een school voor voorbereidend wetenschappelijk onderwijs, algemeen voortgezet onderwijs, voorbereidend
      beroepsonderwijs en praktijkonderwijs zijn een of meer leraren verbonden.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel77
  - number: '77.2'
    text: |-
      Aan het hoofd van een school voor voorbereidend wetenschappelijk onderwijs staat een rector, aan het hoofd van een
      school voor algemeen voortgezet onderwijs, voorbereidend beroepsonderwijs en praktijkonderwijs een directeur.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel77
  - number: '77.3'
    text: |-
      De conrectoren en de adjunct-directeuren hebben tot taak de rector onderscheidenlijk de directeur bij te staan en
      bij afwezigheid te vervangen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel77
  - number: '77.4'
    text: Het overige personeel heeft tot taak het onderwijs te ondersteunen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel77
  - number: '77.5'
    text: Een of meer leden van het personeel worden belast met de taak van schooldecaan.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel77
  - number: '77.6'
    text: |-
      Het bevoegd gezag stelt jaarlijks het beleid vast met betrekking tot de formatie van de verschillende categorieën
      personeel van de school. Het bevoegd gezag bepaalt, zoveel mogelijk tegelijk met de vaststelling van het in de
      eerste volzin bedoelde beleid met betrekking tot de formatie, functies en taken van het personeel van de school,
      met inachtneming van de daaromtrent bij algemene maatregel van bestuur te geven nadere voorschriften.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel77
  - number: '77.7'
    text: |-
      Voor de toepassing van deze paragraaf wordt onder «vakken» tevens verstaan, programmaonderdelen als bedoeld in de
      [artikelen 39][ref1] en [40][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel40
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '39'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '40'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '78.1'
    text: |-
      Het bestuur kan hem bij wettelijk voorschrift opgedragen taken en bevoegdheden overdragen aan de rector of de
      directeur van de school.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel78
  - number: '78.2'
    text: |-
      De rector of de directeur van de school kunnen hen bij wettelijk voorschrift opgedragen of door het bevoegd gezag
      overgedragen taken en bevoegdheden overdragen aan elkaar of aan de adjunct-directeur.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel78
  - number: '79.1'
    text: |-
      Het bevoegd gezag stelt na overleg met de rector, de directeur, de conrector en de adjunct-directeur, een
      managementstatuut vast. In het managementstatuut is ten minste een regeling opgenomen betreffende de bevoegdheden
      van de rector, de directeur, de conrector en de adjunct-directeur met betrekking tot de toedeling, bestemming en
      aanwending van de bekostiging.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel79
  - number: '79.2'
    text: |-
      Het managementstatuut bevat tevens de aanduiding van de andere aan het bevoegd gezag bij wettelijk voorschrift
      toegekende taken en bevoegdheden waarvan het bevoegd gezag heeft bepaald dat de rector, de directeur, de conrector
      of de adjunct-directeur van de school deze in naam van het bevoegd gezag kan uitoefenen. Het managementstatuut
      bevat voorts instructies ten aanzien van deze taken en bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel79
  - number: '79.3'
    text: 'In het managementstatuut worden tevens vastgelegd:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel79
  - number: 79.3.a
    text: |-
      de taken en bevoegdheden die het bestuur overdraagt aan de rector en de directeur van de school, indien toepassing
      is gegeven aan [artikel 78, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel78
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '78'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
  - number: 79.3.b
    text: |-
      de taken en bevoegdheden die de rector en de directeur van de school hebben overgedragen aan elkaar of aan de
      adjunct-directeur, indien toepassing is gegeven aan [artikel 78, tweede lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel78
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '78'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
  - number: 79.3.c
    text: de richtlijnen voor de uitoefening van de overgedragen taken en bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel79
  - number: '79.4'
    text: Het bevoegd gezag stelt het managementstatuut op een voor eenieder toegankelijke wijze beschikbaar.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel79
  - number: '80.1'
    text: |-
      Leraren worden door het bevoegd gezag benoemd dan wel tewerkgesteld zonder benoeming. Om tot leraar te kunnen
      worden benoemd of tewerkgesteld zonder benoeming dient de betrokkene:
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel80
  - number: 80.1.a
    text: |-
      in het bezit te zijn van een verklaring omtrent het gedrag, afgegeven volgens de
      [Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag BES][ref1], die op het tijdstip van
      overlegging aan het bevoegd gezag niet ouder is dan 6 maanden,


      [ref1]: https://wetten.overheid.nl/BWBR0028258
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0028258
  - number: 80.1.b
    text: 'in het bezit te zijn van:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel80
  - number: 80.1.b.1°
    text: |-
      een getuigschrift, afgegeven krachtens de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], waaruit
      blijkt dat is voldaan aan de bekwaamheidseisen die zijn vastgesteld krachtens [artikel 86, eerste lid][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel86
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel80
    references:
