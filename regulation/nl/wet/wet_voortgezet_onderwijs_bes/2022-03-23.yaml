  - number: 124.2.b.4
    text: |-
      de inhoud van het onderwijs, bedoeld in [artikel 42][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel42
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel124
