  - number: '86.1'
    text: Bij algemene maatregel van bestuur worden bekwaamheidseisen vastgesteld voor leraren.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel86
  - number: '86.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen voor werkzaamheden van leidinggevende aard die nauw verband houden met
      het pedagogisch-didactische klimaat op de school of onderwijskundige leiding omvatten, bekwaamheidseisen worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel86
  - number: '86.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen bekwaamheidseisen worden vastgesteld voor bij die maatregel aan te wijzen
      onderwijsondersteunende werkzaamheden die rechtstreeks verband houden met het onderwijsleerproces.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel86
  - number: '86.4'
    text: |-
      De in het eerste lid bedoelde bekwaamheidseisen zijn gericht op het handelen in het onderwijsleerproces, het
      algemeen professioneel handelen en het werken binnen een onderwijsorganisatie. Zij omvatten in elk geval eisen ten
      aanzien van:
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel86
  - number: 86.4.a
    text: pedagogisch-didactische kennis, inzicht en vaardigheden, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel86
  - number: 86.4.b
    text: vakbekwaamheid.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel86
  - number: '86.5'
    text: |-
      De in het eerste lid bedoelde bekwaamheidseisen kunnen worden onderscheiden naar schoolsoort en naar samenhangende
      leerjaren, met dien verstande dat zij in elk geval specifiek worden vastgesteld voor de periode van voorbereidend
      hoger onderwijs, bedoeld in [artikel 38, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel38
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '38'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '86.6'
    text: |-
      Onze Minister stelt een beroepsorganisatie die hij vanuit het oogpunt van beroepskwaliteit representatief acht voor
      onderwijspersoneel als bedoeld in deze wet, in de gelegenheid hem een voorstel te doen voor de in het eerste en
      derde lid voorgeschreven bekwaamheidseisen en kan een representatief geachte beroepsorganisatie in de gelegenheid
      stellen hem een voorstel te doen voor bekwaamheidseisen die op grond van het tweede lid kunnen worden vastgesteld.
      Onze Minister stelt deze organisatie vervolgens in elk geval eenmaal in de zes jaar in de gelegenheid, hem een
      voorstel te doen over ongewijzigde handhaving of wijziging van de bekwaamheidseisen voor zover vastgesteld. Uit een
      voorstel als bedoeld in de eerste of tweede volzin blijkt tevens, in hoeverre dat voorstel mede steun geniet van
      een vertegenwoordiging van bevoegde gezagsorganen, van ouders en van leerlingen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel86
  - number: '87'
    text: |-
      Degene die voor een bepaald vak voldoet aan de in [artikel 86, eerste juncto vijfde lid][ref1], bedoelde
      bekwaamheidseisen voor de periode van voorbereidend hoger onderwijs, is daarmee tevens bekwaam voor dat vak voor
      zover dat wordt verzorgd in het voortgezet onderwijs niet zijnde de periode van voorbereidend hoger onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel86
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '86'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
  - number: '88'
    text: |-
      Het bevoegd gezag beschikt ten aanzien van elk personeelslid dat een functie of werkzaamheden verricht waarvoor
      bekwaamheidseisen zijn vastgesteld, over geordende gegevens met betrekking tot de bekwaamheid en het onderhouden
      van de bekwaamheid. Ten behoeve van de onderlinge vergelijkbaarheid en herkenbaarheid van de gegevens kunnen bij
      ministeriële regeling voorschriften worden vastgesteld over de inrichting en wijze van ordening van deze gegevens.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel88
  - number: '90.1'
    text: |-
      De [Ambtenarenwet BES][ref1] en de daarop berustende regelingen zijn voor het personeel van een school voor
      bijzonder onderwijs van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028215
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0028215
  - number: '90.2'
    text: Voor de salarissen en toelagen van het personeel wordt een regeling vastgesteld bij eilandsbesluit.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel90
  - number: '90.3'
    text: |-
      Het bestuurscollege stelt de regeling, bedoeld in het tweede lid, dan wel een wijziging daarvan niet vast dan nadat
      daarover op overeenstemming gericht overleg is gevoerd met de bevoegde gezagsorganen en met de onderwijsvakbonden
      of, bij het ontbreken daarvan, met een representatief te achten vertegenwoordiging van het personeel.
      [Artikel 101 van de Ambtenarenwet BES][ref1] is niet van toepassing op de vaststelling dan wel wijziging van de
      regeling, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel101
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '101'
  - number: '91'
    text: |-
      [Artikel 3, eerste lid, onderdeel b, van het Rechtspositiebesluit ambtenaren BES][ref1] is niet van toepassing op
      het personeel.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel3
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '3'
  - number: '92'
    text: |-
      Het bevoegd gezag benoemt, schorst en ontslaat de rector, de directeur, de conrectoren, de adjunct-directeuren, de
      leraren en het overige personeel.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel92
  - number: '93.1'
    text: |-
      Het bevoegd gezag benoemt de rector, de directeur, de conrector en de adjunct-directeur, de leraren en het overige
      personeel, bedoeld in [artikel 92][ref1], in algemene dienst van het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel92
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '92'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
  - number: '93.2'
    text: |-
      Onder benoeming in algemene dienst van het bevoegd gezag wordt verstaan een benoeming ten behoeve van het
      verrichten van werkzaamheden aan door het bevoegd gezag in stand gehouden scholen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel93
  - number: '94.1'
    text: |-
      Het bevoegd gezag is verplicht aan ho-studenten die in opleiding zijn voor een functie in het voortgezet onderwijs,
      in de educatie of het beroepsonderwijs, bedoeld in de [Wet educatie en beroepsonderwijs BES][ref1], in het hoger
      beroepsonderwijs of in het basisonderwijs, gelegenheid te bieden de als onderdeel van hun opleiding vereiste
      ervaring in de school te verkrijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0028395
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0028395
  - number: '94.2'
    text: |-
      De verplichting, bedoeld in het eerste lid, betreft ho-studenten die zijn ingeschreven voor een opleiding voor het
      beroep van leraar waarop de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] betrekking heeft of
      anderszins studeren om aan de bekwaamheidseisen te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: '94.3'
    text: |-
      Het in uren uitgedrukte aantal lessen en onderdelen van het in schooltijd verzorgd onderwijsprogramma waarvoor
      het bevoegd gezag in enig schooljaar verplicht is, ho-studenten als bedoeld in het eerste lid tot de school toe te
      laten, bedraagt gezamenlijk 5 procent van het in uren uitgedrukte totale aantal in dat schooljaar te geven lessen
      en te verzorgen onderdelen van het in schooltijd verzorgd onderwijsprogramma. Onze Minister kan het percentage
      lager stellen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel94
  - number: '94.4'
    text: |-
      Een bevoegd gezag kan een ho-student de verdere toegang tot de school ontzeggen, indien deze in de school in strijd
      handelt met de grondslag en doelstellingen van de school. Van een beslissing tot ontzegging van de toegang tot
      de school wordt mededeling gedaan door toezending of uitreiking van een afschrift aan het bevoegd gezag van de
      betrokken opleidingsinstelling.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel94
  - number: '94.5'
    text: |-
      De rector of de directeur regelt, onder verantwoordelijkheid van het bevoegd gezag, de werkzaamheden in
      verband met de begeleiding door de leraren van de ho-studenten in de school in overeenstemming met de leraren,
      alsmede in overeenstemming met de betrokken opleidingsinstellingen, dan wel, indien het betreft ho-studenten
      die zich voorbereiden op het afleggen van een staatsexamen ter verkrijging van een bewijs van bekwaamheid, in
      overeenstemming met de betrokken staatsexamencommissie.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel94
  - number: '94.6'
    text: |-
      Onze Minister kan het bevoegd gezag op grond van bijzondere omstandigheden gehele of gedeeltelijke ontheffing van
      de verplichting verlenen. De ontheffing geldt voor een schooljaar.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel94
  - number: '94.7'
    text: |-
      De scholen waarop ho-studenten als bedoeld in het eerste lid, zijn toegelaten, zijn toegankelijk voor de inspectie
      belast met het toezicht op de opleidingsinstellingen, voor de directieleden en de door deze aan te wijzen docenten
      van die opleidingsinstellingen, alsmede voor de leden van de betrokken staatsexamencommissies, een en ander voor
      zover zulks voor de uitoefening van het toezicht op de praktische vorming onderscheidenlijk de begeleiding van de
      praktische vorming van de in de school aanwezige ho-studenten noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel94
  - number: '94.8'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden in verband met het bepaalde in dit artikel nadere
      voorschriften gegeven, betreffende de navolgende onderwerpen:
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel94
  - number: 94.8.a
    text: |-
      het maximum aantal lessen in een vak van een schoolsoort, gedurende dewelke het bevoegd gezag in enig schooljaar
      verplicht is ho-studenten als bedoeld in het eerste lid, toe te laten, welk maximum de 20 procent niet te boven
      mag gaan;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel94
  - number: 94.8.b
    text: |-
      het maximum aantal ho-studenten als bedoeld in het eerste lid, dat bij dezelfde les kan worden toegelaten, welk
      maximum, behoudens bijzondere omstandigheden, de 3 niet te boven mag gaan, alsmede de gevolgen die het toelaten van
      meer dan een ho-student bij dezelfde les heeft voor het maximum, bedoeld in het derde lid, en het maximum, bedoeld
      in dit lid onder a.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel94
  - number: '94.9'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen in verband met het bepaalde in dit artikel nadere
      voorschriften worden gegeven, betreffende de navolgende onderwerpen:
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel94
  - number: 94.9.a
    text: |-
      de wijze van aanmelden van ho-studenten als bedoeld in het eerste lid, alsmede de termijn die voor de aanmelding
      door het bevoegd gezag mag worden gesteld;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel94
  - number: 94.9.b
    text: |-
      de wijze waarop door de school bekendheid moet worden gegeven aan opleidingsinstellingen en staatsexamencommissies
      over de beschikbaarheid en de aard van schoolpracticumplaatsen;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel94
  - number: 94.9.c
    text: de categorieën ho-studenten ten aanzien van wie de verplichting, bedoeld in het eerste lid, niet geldt;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel94
  - number: 94.9.d
    text: |-
      regulering in de situatie dat, bij een beperkte beschikbaarheid van schoolpracticumplaatsen aan de school,
      gelijktijdig ho-studenten die in opleiding zijn voor een functie in het voortgezet onderwijs, en ho-studenten die
      in opleiding zijn voor een functie in het basisonderwijs, worden aangemeld;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel94
  - number: 94.9.e
    text: |-
      de vakken en andere programmaonderdelen van een schoolsoort, waarvoor in verband met de geringe omvang van het
      onderwijs daarin, de in het eerste lid bedoelde verplichting niet geldt.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel94
  - number: '96.1'
    text: |-
      Het openbaar onderwijs draagt bij aan de ontwikkeling van de leerlingen met aandacht voor de godsdienstige,
      levensbeschouwelijke en maatschappelijke waarden zoals die leven in de Nederlandse en de Caribische samenleving, en
      met onderkenning van de betekenis van de verscheidenheid van die waarden.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel96
  - number: '96.2'
    text: Openbare scholen zijn toegankelijk voor leerlingen zonder onderscheid naar godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel96
  - number: '96.3'
    text: Openbaar onderwijs wordt gegeven met eerbiediging van ieders godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel96
  - number: '97.1'
    text: |-
      Een eilandsraad kan bij eilandsverordening een openbare rechtspersoon instellen die tot doel heeft een of meer
      openbare scholen in het openbaar lichaam in stand te houden, al dan niet te zamen met openbare scholen als bedoeld
      in de [Wet primair onderwijs BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030280
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0030280
  - number: '97.2'
    text: De eilandsraad maakt het voornemen tot een besluit als bedoeld in het eerste lid bekend.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel97
  - number: '97.3'
    text: |-
      De openbare rechtspersoon oefent met uitzondering van de besluitvorming over de opheffing van een openbare school
      alle taken en bevoegdheden uit van het bevoegd gezag. Hij bezit rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel97
  - number: '97.4'
    text: |-
      De eilandsverordening, bedoeld in het eerste lid, voorziet in ieder geval in een regeling waarin een overheersende
      invloed van de overheid in het bestuur is verzekerd, en waarin voorts wordt geregeld:
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel97
  - number: 97.4.a
    text: de samenstelling, werkwijze en inrichting van het bestuur van de openbare rechtspersoon,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel97
  - number: 97.4.b
    text: |-
      de wijze van benoeming, herbenoeming, schorsing en ontslag van de bestuursleden, met dien verstande dat de leden
      van het bestuur worden benoemd door de eilandsraad en dat ten minste een derde gedeelte, doch geen meerderheid,
      van die leden wordt benoemd op bindende voordracht van de ouders van de leerlingen die zijn ingeschreven op de
      betrokken school of scholen,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel97
  - number: 97.4.c
    text: de termijn waarvoor de bestuursleden worden benoemd,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel97
  - number: 97.4.d
    text: |-
      de vaststelling van de begroting na goedkeuring door de eilandsraad en de vaststelling van de jaarrekening na
      instemming van de eilandsraad,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel97
  - number: 97.4.e
    text: de wijze waarop de eilandsraad toezicht op het bestuur uitoefent,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel97
  - number: 97.4.f
    text: de gronden waarop het bestuur kan besluiten de vergaderingen besloten te houden, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel97
  - number: 97.4.g
    text: |-
      de periode waarvoor de openbare rechtspersoon in het leven wordt geroepen, met dien verstande dat deze periode ten
      minste 5 jaren bedraagt.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel97
  - number: '97.5'
    text: |-
      De goedkeuring bedoeld in het vierde lid, onderdeel d, kan worden onthouden wegens strijd met het recht of met het
      algemeen belang, waaronder begrepen het financiële belang van het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel97
  - number: '97.6'
    text: |-
      Het bestuur brengt jaarlijks aan de eilandsraad verslag uit over de werkzaamheden, waarbij in ieder geval aandacht
      wordt geschonken aan de wezenskenmerken van het openbaar onderwijs. Het verslag wordt openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel97
  - number: '97.7'
    text: |-
      De vergaderingen van het bestuur van de openbare rechtspersoon zijn openbaar, tenzij het bestuur anders beslist, op
      gronden, vermeld in de eilandsverordening.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel97
  - number: '97.8'
    text: |-
      Indien voor 1 februari van het jaar waarvoor de begroting geldt, de begroting niet is goedgekeurd, neemt de
      eilandsraad de maatregelen die hij nodig acht om de continuïteit van het onderwijsproces te waarborgen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel97
  - number: '97.9'
    text: |-
      De eilandsraad is in geval van ernstige taakverwaarlozing door het bestuur of functioneren in strijd met de wet
      bevoegd zelf te voorzien in het bestuur van de scholen en zo nodig de openbare rechtspersoon te ontbinden.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel97
  - number: '97.10'
    text: |-
      Indien de school een raad van toezicht heeft, is het vierde lid niet van toepassing en voorziet de verordening,
      bedoeld in het eerste lid, onverminderd [artikel 56][ref1] in ieder geval in een regeling waarin een overheersende
      invloed van de overheid in de raad van toezicht is verzekerd, en waarin voorts wordt geregeld:


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel56
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '56'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 97.10.a
    text: de samenstelling, werkwijze en inrichting van de raad van toezicht van de openbare rechtspersoon,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel97
  - number: 97.10.b
    text: |-
      de wijze van benoeming, herbenoeming, schorsing en ontslag van de leden van de raad van toezicht, met dien
      verstande dat de leden van de raad van toezicht worden benoemd door de eilandsraad en dat ten minste een derde
      gedeelte, doch geen meerderheid, van die leden wordt benoemd op bindende voordracht van de ouders van de leerlingen
      die zijn ingeschreven op de betrokken school of scholen,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel97
  - number: 97.10.c
    text: de termijn waarvoor de leden van de raad van toezicht worden benoemd,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel97
  - number: 97.10.d
    text: de vaststelling van de begroting en de jaarrekening, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel97
  - number: 97.10.e
    text: |-
      de periode waarvoor de openbare rechtspersoon in het leven wordt geroepen, met dien verstande dat deze periode ten
      minste 5 jaren bedraagt. Het zesde, zevende en negende lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel97
  - number: '98.1'
    text: |-
      Een eilandsraad kan besluiten dat een of meer openbare scholen in het openbaar lichaam in stand worden gehouden
      door een stichting die zich ten doel stelt het in stand houden van een of meer openbare scholen, al dan niet te
      zamen met openbare scholen als bedoeld in de [Wet primair onderwijs BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030280
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0030280
  - number: '98.2'
    text: De eilandsraad maakt het voornemen tot een besluit als bedoeld in het eerste lid bekend.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel98
  - number: '98.3'
    text: |-
      Een stichting die een openbare school in stand houdt, wordt opgericht door het openbaar lichaam, al dan niet te
      zamen met een of meer privaatrechtelijke rechtspersonen met volledige rechtsbevoegdheid.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel98
  - number: '98.4'
    text: |-
      Onverminderd [artikel 109a, eerste lid][ref1], is het statutaire doel van de stichting uitsluitend het geven van
      openbaar onderwijs overeenkomstig [artikel 96][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel109a
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel96
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: 109a
        hoofdstuk: IV
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '96'
        hoofdstuk: II
        afdeling: I
  - number: '98.5'
    text: |-
      De stichting oefent met uitzondering van de besluitvorming over de opheffing van een openbare school alle taken en
      bevoegdheden van het bevoegd gezag uit.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel98
  - number: '98.6'
    text: |-
      Onverminderd het vierde lid, voorzien de statuten in ieder geval in een regeling waarin een overheersende invloed
      van de overheid in het bestuur is verzekerd, en waarin voorts wordt geregeld:
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel98
  - number: 98.6.a
    text: de samenstelling, werkwijze en inrichting van het bestuur van de stichting,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel98
  - number: 98.6.b
    text: |-
      de wijze van benoeming, herbenoeming, schorsing en ontslag van de bestuursleden, met dien verstande dat de leden
      van het bestuur worden benoemd door de eilandsraad en dat ten minste een derde gedeelte, doch geen meerderheid,
      van die leden wordt benoemd op bindende voordracht van de ouders van de leerlingen die zijn ingeschreven op de
      betrokken school of scholen,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel98
  - number: 98.6.c
    text: de termijn waarvoor de bestuursleden worden benoemd,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel98
  - number: 98.6.d
    text: |-
      de vaststelling van de begroting na goedkeuring door de eilandsraad en de vaststelling van de jaarrekening na
      instemming van de eilandsraad,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel98
  - number: 98.6.e
    text: de wijze waarop de eilandsraad toezicht op het bestuur uitoefent,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel98
  - number: 98.6.f
    text: de gronden waarop het bestuur kan besluiten de vergaderingen besloten te houden,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel98
  - number: 98.6.g
    text: |-
      de periode waarvoor de stichting in het leven wordt geroepen, met dien verstande dat deze periode ten minste 5
      jaren bedraagt, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel98
  - number: 98.6.h
    text: |-
      de bevoegdheid de stichting te ontbinden, met dien verstande dat in de regeling een overheersende invloed van de
      overheid in het bestuur is verzekerd.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel98
  - number: '98.7'
    text: |-
      De goedkeuring bedoeld in het zesde lid, onderdeel d, kan worden onthouden wegens strijd met het recht of met het
      algemeen belang, waaronder begrepen het financiële belang van het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel98
  - number: '98.8'
    text: De statuten van de stichting kunnen slechts worden gewijzigd na instemming van de eilandsraad.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel98
  - number: '98.9'
    text: |-
      Het bestuur brengt jaarlijks aan de eilandsraad verslag uit over de werkzaamheden, waarbij in ieder geval aandacht
      wordt geschonken aan de wezenskenmerken van het openbaar onderwijs. Het verslag wordt openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel98
  - number: '98.10'
    text: |-
      De vergaderingen van het bestuur van de stichting zijn openbaar, tenzij het bestuur anders beslist, op gronden,
      vermeld in de statuten.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel98
  - number: '98.11'
    text: |-
      Indien voor 1 februari van het jaar waarvoor de begroting geldt, de begroting niet is goedgekeurd, neemt de
      eilandsraad de maatregelen die hij nodig acht om de continuïteit van het onderwijsproces te waarborgen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel98
  - number: '98.12'
    text: |-
      De eilandsraad is in geval van ernstige taakverwaarlozing door het bestuur of functioneren in strijd met de wet
      bevoegd zelf te voorzien in het bestuur van de scholen en zo nodig de stichting te ontbinden.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel98
  - number: '98.13'
    text: |-
      Indien de school een raad van toezicht heeft, is het zesde lid niet van toepassing en voorzien de statuten,
      onverminderd [artikel 56][ref1], in ieder geval in een regeling waarin een overheersende invloed van de overheid in
      de raad van toezicht is verzekerd, en waarin voorts wordt geregeld:


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel56
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '56'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 98.13.a
    text: de samenstelling, werkwijze en inrichting van de raad van toezicht van de stichting,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel98
  - number: 98.13.b
    text: |-
      de wijze van benoeming, herbenoeming, schorsing en ontslag van de leden van de raad van toezicht, met dien
      verstande dat de leden van de raad van toezicht worden benoemd door de eilandsraad en dat ten minste een derde
      gedeelte, doch geen meerderheid, van die leden wordt benoemd op bindende voordracht van de ouders van de leerlingen
      die zijn ingeschreven op de betrokken school of scholen,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel98
  - number: 98.13.c
    text: de termijn waarvoor de leden van de raad van toezicht worden benoemd,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel98
  - number: 98.13.d
    text: de vaststelling van de begroting en de jaarrekening,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel98
  - number: 98.13.e
    text: |-
      de periode waarvoor de stichting in het leven wordt geroepen, met dien verstande dat deze periode ten minste 5
      jaren bedraagt,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel98
  - number: 98.13.f
    text: de bevoegdheid de stichting te ontbinden. Het negende, tiende en twaalfde lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel98
  - number: '99.1'
    text: |-
      Een rechtspersoon die een openbare school in stand houdt, kan de instandhouding van die school overdragen aan een
      andere rechtspersoon die tot de instandhouding van een openbare school bevoegd is.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel99
  - number: '99.2'
    text: |-
      De overdracht geschiedt bij notariële akte. Bij deze akte verbindt de overdragende rechtspersoon zich tevens de
      rechten ten aanzien van gebouwen, terreinen en roerende zaken over te dragen. Deze akte geldt tevens als akte van
      levering, bedoeld in [artikel 89 van Boek 3 van het Burgerlijk Wetboek BES][ref1]. In de akte wordt tevens bepaald
      dat de rechtspersoon aan wie wordt overgedragen, het personeel in gelijke betrekkingen aanstelt met ingang van de
      datum van overdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel89
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '89'
  - number: '99.3'
    text: |-
      Door overdracht met inachtneming van het eerste en tweede lid treedt de verkrijgende rechtspersoon in alle uit
      de wet voortvloeiende rechten en verplichtingen van zijn rechtsvoorganger, onverminderd hetgeen verder voor de
      overgang daarvan naar burgerlijk recht is vereist.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel99
  - number: '99.4'
    text: |-
      Voor zover het betreft scholen voor voorbereidend wetenschappelijk onderwijs, voor hoger en middelbaar algemeen
      voortgezet onderwijs, voor voorbereidend beroepsonderwijs en voor praktijkonderwijs kan het bestuurscollege in
      bijzondere omstandigheden ontheffing verlenen van de verplichting tot overdracht van de rechten ten aanzien van
      gebouwen, terreinen en roerende zaken.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel99
  - number: '100'
    text: |-
      In afwijking van [artikel 92][ref1] legt de Rijksvertegenwoordiger de disciplinaire straf of de schorsing op of
      verleent hij het ontslag, indien het betreft een rector, een directeur, een conrector, een adjunct-directeur of een
      leraar van een openbare school, die tevens lid is van de eilandsraad, welke die school in stand houdt.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel92
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '92'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
  - number: '101.1'
    text: Het onderwijs aan openbare scholen wordt gegeven met eerbiediging van ieders geloofs- of levensovertuiging.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel101
  - number: '101.2'
    text: |-
      Wij kunnen hem, die zich in dit opzicht aan plichtsverzuim schuldig maakt, voor ten hoogste een jaar en bij
      herhaling voor onbepaalde tijd in zijn bevoegdheid tot het geven van onderwijs aan een openbare school schorsen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel101
  - number: '102.1'
    text: |-
      Aan de openbare scholen worden op verzoek van kerkelijke gemeenten of van plaatselijke kerken de leerlingen in
      de gelegenheid gesteld in de schoollokalen godsdienstonderwijs te volgen van godsdienstleraren, daartoe door die
      gemeenten of kerken aan te wijzen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel102
  - number: '102.2'
    text: De schoollokalen worden, zo nodig verlicht, kosteloos voor het godsdienstonderwijs beschikbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel102
  - number: '102.3'
    text: |-
      Bij een geschil omtrent het vaststellen van lessen of het beschikbaar stellen van lokalen van openbare scholen
      beslist Onze Minister bij beschikking.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel102
  - number: '102.4'
    text: |-
      Aan de kerkelijke gemeenten of de plaatselijke kerken kan een subsidie worden verstrekt. De
      [artikelen 4 tot en met 19 van de Wet overige OCW-subsidies][ref1] zijn van toepassing, met dien verstande dat de
      subsidie slechts kan worden verstrekt bij algemene maatregel van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0009458#Artikel4
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0009458
        artikel: '4'
  - number: '102.5'
    text: |-
      Voor de toepassing van dit artikel worden met kerkelijke gemeenten gelijkgesteld verenigingen met volledige
      rechtsbevoegdheid, die zich blijkens de statuten het geven of doen geven van godsdienstonderwijs ten doel stellen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel102
  - number: '102.6'
    text: |-
      Het bevoegd gezag ziet erop toe dat dit onderwijs uitsluitend wordt gegeven door een leraar die blijkens een
      daartoe strekkende verklaring van de aanwijzende kerkelijke gemeente of plaatselijke kerk:
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel102
  - number: 102.6.a
    text: |-
      voldoet aan de bekwaamheidseisen die krachtens [artikel 86, eerste lid][ref1], voor het geven van dat onderwijs
      zijn vastgesteld, en


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel86
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '86'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
  - number: 102.6.b
    text: zijn bekwaamheid onderhoudt.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel102
  - number: '103.1'
    text: |-
      Aan de openbare scholen worden op verzoek van door Ons tot dit doel toegelaten genootschappen op geestelijke
      grondslag de leerlingen, wier ouders daartoe de wens te kennen geven, in de gelegenheid gesteld in de schoollokalen
      levensbeschouwelijk vormingsonderwijs te volgen van leraren, daartoe door deze genootschappen aan te wijzen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel103
  - number: '103.2'
    text: De schoollokalen worden, zo nodig verlicht, kosteloos voor het vormingsonderwijs beschikbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel103
  - number: '103.3'
    text: |-
      Bij een geschil omtrent het vaststellen van lessen of het beschikbaar stellen van lokalen van openbare scholen
      beslist Onze Minister bij beschikking.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel103
  - number: '103.4'
    text: |-
      Aan de genootschappen, bedoeld in het eerste lid, kan een subsidie worden verstrekt. De
      [artikelen 4 tot en met 19 van de Wet overige OCW-subsidies][ref1] zijn van toepassing, met dien verstande dat de
      subsidie slechts kan worden verstrekt bij algemene maatregel van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0009458#Artikel4
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0009458
        artikel: '4'
  - number: '103.5'
    text: |-
      Het bevoegd gezag ziet erop toe dat dit onderwijs uitsluitend wordt gegeven door een leraar die blijkens een
      daartoe strekkende verklaring van het aanwijzend genootschap op geestelijke grondslag:
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel103
  - number: 103.5.a
    text: |-
      voldoet aan de bekwaamheidseisen die krachtens [artikel 86, eerste lid][ref1], voor het geven van dat onderwijs
      zijn vastgesteld, en


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel86
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '86'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
  - number: 103.5.b
    text: zijn bekwaamheid onderhoudt.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel103
  - number: '104.1'
    text: |-
      Indien binnen redelijke afstand van de woning van de leerling niet de gelegenheid bestaat tot het volgen van het
      onderwijs aan een openbare school, mag aan deze leerling de toegang tot een gelijksoortige, uit de openbare kas
      bekostigde bijzondere school niet worden geweigerd op grond van levensbeschouwing, tenzij de school uitsluitend
      bestemd is voor interne leerlingen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel104
  - number: '104.2'
    text: |-
      Indien tot een bijzondere school ingevolge het eerste lid andere leerlingen worden toegelaten dan voor wie de
      school in verband met de levensbeschouwing wordt in stand gehouden, kunnen deze leerlingen niet worden verplicht
      tot het volgen van de lessen in de vakken of andere programmaonderdelen, die in verband met die levensbeschouwing
      worden gegeven.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel104
  - number: '105.1'
    text: |-
      De bijzondere school staat onder het bestuur van een rechtspersoon met volledige rechtsbevoegdheid die zich het
      geven van onderwijs in de zin van deze wet ten doel stelt zonder daarbij het maken van winst te beogen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel105
  - number: '105.2'
    text: Het schoolbestuur draagt zorg voor een deskundig beheer.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel105
  - number: '106.1'
    text: |-
      De rechtspersoon die een bijzondere school in stand houdt, kan de instandhouding van die school overdragen aan een
      andere rechtspersoon die voldoet aan het bepaalde in [artikel 105, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel105
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '105'
        hoofdstuk: III
        afdeling: I
  - number: '106.2'
    text: |-
      De overdracht geschiedt bij notariële akte. Bij deze akte verbindt de overdragende rechtspersoon zich tevens de
      rechten ten aanzien van gebouwen, terreinen en roerende zaken over te dragen. Deze akte geldt tevens als akte van
      levering, bedoeld in [artikel 89 van Boek 3 van het Burgerlijk Wetboek BES][ref1]. In de akte wordt tevens bepaald
      dat de rechtspersoon aan wie wordt overgedragen, het personeel in gelijke betrekkingen benoemt met ingang van de
      datum van overdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel89
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '89'
  - number: '106.3'
    text: |-
      Door overdracht met inachtneming van het eerste en tweede lid treedt de verkrijgende rechtspersoon in alle uit de
      wet voortvloeiende rechten en verplichtingen van zijn rechtsvoorganger met betrekking tot de school, onverminderd
      hetgeen verder voor de overgang daarvan naar burgerlijk recht is vereist.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel106
  - number: '106.4'
    text: |-
      Voor zover het betreft scholen voor voorbereidend wetenschappelijk onderwijs, voor hoger en middelbaar algemeen
      voortgezet onderwijs en voor voorbereidend beroepsonderwijs kan het bestuurscollege in bijzondere omstandigheden
      ontheffing verlenen van de verplichting tot overdracht van de rechten ten aanzien van gebouwen, terreinen en
      roerende zaken.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel106
  - number: '106.5'
    text: |-
      Bij een splitsing als bedoeld in [artikel 335 van Boek 2 van het Burgerlijk Wetboek BES][ref1] van een
      rechtspersoon die een school in stand houdt, wordt in de splitsingsakte bepaald dat de voortbestaande splitsende
      rechtspersoon de school in stand zal houden of op welke verkrijgende rechtspersoon de instandhouding van de school
      overgaat. In het laatste geval zijn het tweede tot en met vierde lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel334
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '334'
  - number: '107.1'
    text: Ieder personeelslid is in het bezit van een door het bevoegd gezag en hemzelf getekende akte van benoeming.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel107
  - number: '107.2'
    text: |-
      De akte van benoeming bevat ten minste bepalingen van gelijke inhoud als de bepalingen die zijn vastgesteld in
      [artikel 8 van het Rechtspositiebesluit ambtenaren BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel8
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '8'
  - number: '108'
    text: |-
      In een geval als bedoeld in [artikel 94, vierde lid, eerste volzin][ref1], maakt het bevoegd gezag van een
      bijzondere school de beslissing tot ontzegging van de toegang tot de school schriftelijk en met redenen omkleed
      bekend aan de betrokken ho-student.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel94
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '94'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
  - number: '109.1'
    text: |-
      De instandhouding van een of meer openbare en een of meer bijzondere scholen kan worden opgedragen of overgedragen
      aan een stichting die met dit doel wordt onderscheidenlijk is opgericht. De besluitvorming van de zijde van het
      openbaar lichaam vindt plaats door de eilandsraad.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel109
  - number: '109.2'
    text: |-
      Het statutaire doel van de stichting is in elk geval het geven van openbaar onderwijs en onderwijs van een of meer
      richtingen in afzonderlijke scholen voor openbaar onderscheidenlijk bijzonder onderwijs.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel109
  - number: '109.3'
    text: |-
      De stichting oefent met uitzondering van de besluitvorming over de opheffing van een openbare school alle taken en
      bevoegdheden van het bevoegd gezag uit.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel109
  - number: '109.4'
    text: |-
      Het personeel dat werkzaam is aan de openbare school en niet is tewerkgesteld zonder benoeming, wordt benoemd
      krachtens een arbeidsovereenkomst naar burgerlijk recht.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel109
  - number: '109.5'
    text: 'De statuten voorzien in ieder geval in een regeling omtrent:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel109
  - number: 109.5.a
    text: de samenstelling, werkwijze en inrichting van het bestuur van de stichting,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel109
  - number: 109.5.b
    text: de wijze van benoeming, herbenoeming, schorsing en ontslag van de bestuursleden,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel109
  - number: 109.5.c
    text: de termijn waarvoor de bestuursleden worden benoemd,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel109
  - number: 109.5.d
    text: |-
      de vaststelling van de begroting en jaarrekening na overleg met de eilandsraad van het openbaar lichaam waarin de
      openbare school is gelegen,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel109
  - number: 109.5.e
    text: |-
      de wijze waarop de eilandsraad van het openbaar lichaam waarin de openbare school is gelegen, toezicht op het
      bestuur van de openbare school uitoefent,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel109
  - number: 109.5.f
    text: de gronden waarop het bestuur kan besluiten de vergaderingen besloten te houden,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel109
  - number: 109.5.g
    text: |-
      de periode waarvoor de stichting in het leven wordt geroepen, met dien verstande dat deze periode ten minste 5
      jaren bedraagt, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel109
  - number: 109.5.h
    text: |-
      de bevoegdheid de stichting te ontbinden, met dien verstande dat in de regeling een overheersende invloed van de
      overheid in het bestuur is verzekerd voor zover het openbaar onderwijs betreft.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel109
  - number: '109.6'
    text: |-
      De statuten van de stichting kunnen slechts worden gewijzigd na goedkeuring van de eilandsraad van het openbaar
      lichaam waarin de openbare school is gelegen. Goedkeuring kan slechts worden onthouden indien overheersende invloed
      van de overheid in het bestuur niet is verzekerd voor zover het openbaar onderwijs betreft.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel109
  - number: '109.7'
    text: |-
      Het bestuur brengt jaarlijks aan de eilandsraad van het openbaar lichaam waarin de openbare school is gelegen,
      verslag uit over de werkzaamheden, waarbij in ieder geval aandacht wordt geschonken aan de wezenskenmerken van het
      openbaar onderwijs. Het verslag wordt bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel109
  - number: '109.8'
    text: |-
      De vergaderingen van het bestuur van de stichting zijn openbaar, tenzij het bestuur anders beslist, op gronden,
      vermeld in de statuten.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel109
  - number: '109.9'
    text: |-
      In geval van ernstige taakverwaarlozing door het bestuur of functioneren in strijd met de wet, voor zover het
      openbaar onderwijs betreft, neemt de eilandsraad van het openbaar lichaam waarin de openbare school is gelegen,
      de maatregelen die hij nodig acht om de continuïteit van het onderwijsproces te waarborgen voor zover het openbaar
      onderwijs betreft.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel109
  - number: '109.10'
    text: |-
      Indien de laatste afzonderlijke openbare school en de laatste afzonderlijke bijzondere school die door de stichting
      in stand worden gehouden, zijn gefuseerd tot een samenwerkingsschool als bedoeld in [artikel 109a][ref1] kan de
      instandhouding van die samenwerkingsschool opgedragen blijven aan de stichting.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel109a
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: 109a
        hoofdstuk: IV
        afdeling: I
  - number: 109a.1
    text: |-
      Een samenwerkingsschool is een school waarin zowel openbaar onderwijs als bijzonder onderwijs wordt aangeboden.
      Een samenwerkingsschool kan uitsluitend tot stand komen door samenvoeging van één of meer openbare scholen
      met één of meer bijzondere scholen en wordt in stand gehouden door een stichting, een stichting als bedoeld in
      [artikel 109][ref1] of een stichting als bedoeld in [artikel 98][ref2] waarvan het statutaire doel in ieder geval
      is het in stand houden van een samenwerkingsschool. De [artikelen 99][ref3] en [106][ref4] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel109
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel98
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel99
      [ref4]: https://wetten.overheid.nl/BWBR0030284#Artikel106
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel109a
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '109'
        hoofdstuk: IV
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '98'
        hoofdstuk: II
        afdeling: I
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '99'
        hoofdstuk: II
        afdeling: I
      - id: ref4
        bwb_id: BWBR0030284
        artikel: '106'
        hoofdstuk: III
        afdeling: I
  - number: 109a.2
    text: 'Een samenwerkingsschool kan uitsluitend tot stand komen indien:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel109a
  - number: 109a.2.a
    text: |-
      met die totstandkoming van de samenwerkingsschool de continuïteit van het openbaar of bijzonder onderwijs
      gehandhaafd kan blijven; en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel109a
  - number: 109a.2.b
    text: de betrokken scholen of scholengemeenschappen alle leerjaren omvatten.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel109a
  - number: 109a.3
    text: |-
      Van een situatie als bedoeld in het tweede lid, onderdeel a, is sprake indien één van de betrokken scholen of
      scholengemeenschappen op 1 oktober van het eerste of tweede schooljaar voorafgaand aan de fusiedatum werd bezocht
      door zestig of minder leerlingen boven de opheffingsnorm, bedoeld in [artikel 188][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel188
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel109a
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '188'
        afdeling: IV
  - number: 109a.4
    text: Samenwerkingsscholen zijn toegankelijk voor leerlingen zonder onderscheid naar godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel109a
  - number: 109a.5
    text: Aan een samenwerkingsschool is een identiteitscommissie verbonden.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel109a
  - number: 109a.6
    text: |-
      De identiteitscommissie adviseert gevraagd en ongevraagd het bevoegd gezag en de rector of de directeur over alle
      aangelegenheden die betrekking hebben op de wijze waarop invulling wordt gegeven aan het openbare karakter en de
      identiteit van de samenwerkingsschool. De identiteitscommissie kan tevens voorstellen doen over de aangelegenheden,
      bedoeld in de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel109a
  - number: 109a.7
    text: |-
      De statuten van de stichting die de samenwerkingsschool in stand houdt, voorzien in een regeling over de
      identiteitscommissie waarin in ieder geval de samenstelling, benoeming, herbenoeming, ontslag, duur van de
      benoeming, werkwijze, inrichting en bevoegdheden van de identiteitscommissie zijn vastgelegd alsmede een
      voorziening voor het beslechten van geschillen tussen het bevoegd gezag en de identiteitscommissie. Bij de
      samenstelling van de identiteitscommissie is sprake van een evenwichtige verdeling tussen openbaar en bijzonder
      onderwijs.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel109a
  - number: 109a.8
    text: |-
      Wijziging van de statuten van de stichting die de samenwerkingsschool in stand houdt voor zover die betrekking
      hebben op de regeling omtrent de identiteitscommissie, is slechts mogelijk indien het bevoegd gezag en de
      identiteitscommissie daartoe gezamenlijk besluiten. Indien het een stichting betreft anders dan een stichting
      als bedoeld in [artikel 109][ref1] en anders dan bedoeld in [artikel 98][ref2], kan een wijziging als bedoeld
      in de eerste volzin uitsluitend tot stand komen met goedkeuring van de eilandsraad van het openbaar lichaam
      waarin de samenwerkingsschool gelegen is. Goedkeuring kan slechts worden onthouden indien overheersende invloed
      van de overheid in de identiteitscommissie niet is verzekerd voor zover het openbaar onderwijs binnen de
      samenwerkingsschool betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel109
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel98
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel109a
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '109'
        hoofdstuk: IV
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '98'
        hoofdstuk: II
        afdeling: I
  - number: 109a.9
    text: |-
      De stichting anders dan een stichting als bedoeld in [artikel 109][ref1] en anders dan bedoeld in
      [artikel 98][ref2] brengt jaarlijks aan de eilandsraad van het openbaar lichaam waarin de samenwerkingsschool
      gelegen is, verslag uit over de werkzaamheden waarbij in ieder geval aandacht wordt geschonken aan de
      wezenskenmerken van het openbaar onderwijs. Het verslag wordt bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel109
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel98
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel109a
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '109'
        hoofdstuk: IV
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '98'
        hoofdstuk: II
        afdeling: I
  - number: 109a.10
    text: |-
      De voorschriften van deze wet en van andere wetten die het primair onderwijs betreffen, alsmede de daarop
      gebaseerde regelingen, voor zover die voorschriften en regelingen betrekking hebben op een bijzondere school,
      zijn van overeenkomstige toepassing op een samenwerkingsschool als bedoeld in het eerste lid, tenzij het tegendeel
      blijkt.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel109a
  - number: 109a.11
    text: |-
      In geval van ernstige taakverwaarlozing door het bestuur of functioneren in strijd met de wet, voor zover het
      openbaar onderwijs betreft, neemt de eilandsraad van het openbaar lichaam waar de samenwerkingsschool gelegen
      is, de maatregelen die hij nodig acht om de continuïteit van het onderwijsproces te waarborgen voor zover het
      openbaar onderwijs betreft. De feitelijke samenwerking wordt beëindigd op 1 augustus van het jaar na een daartoe
      door de eilandsraad van het openbaar lichaam waar de samenwerkingsschool gelegen is, en het bevoegd gezag van de
      samenwerkingsschool gezamenlijk genomen besluit.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel109a
  - number: '110'
    text: |-
      Het bestuur van een bijzondere school voor voortgezet onderwijs geeft binnen vier weken na de oprichting van de
      school onder overlegging van de statuten der instelling, die de school in stand houdt, en van de reglementen, van
      die oprichting kennis aan Onze Minister. Indien de statuten of reglementen worden gewijzigd of ingetrokken, wordt
      eveneens binnen vier weken van de wijziging of van de intrekking van de statuten of reglementen aan Onze Minister
      kennis gegeven.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel110
  - number: '111.1'
    text: |-
      Algemeen voortgezet onderwijs wordt slechts gegeven door wie voldoet aan [artikel 80, eerste lid][ref1]. De
      artikelen 80, tweede tot en met achtste en zestiende tot en met achttiende lid, alsmede [81][ref2] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel81
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '80'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '81'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
  - number: '111.2'
    text: |-
      Onderwijsondersteunende werkzaamheden als bedoeld in [artikel 86, derde lid][ref1], worden met betrekking tot het
      algemeen voortgezet onderwijs slechts verricht door wie voldoet aan [artikel 84, eerste lid][ref2]. Artikel 84,
      derde en vierde lid, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel86
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel84
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '86'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '84'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
  - number: '112.1'
    text: |-
      Onze Minister kan de school, die ten aanzien van de duur van de cursus, de opdracht tot actief burgerschap en
      sociale cohesie, het schoolplan en de bevoegdheden van de leraren overeenkomt met een school voor voorbereidend
      wetenschappelijk onderwijs, voor hoger algemeen voortgezet onderwijs, voor middelbaar algemeen voortgezet onderwijs
      of voor voorbereidend beroepsonderwijs, als bedoeld in [artikel 72, eerste lid][ref1], aanwijzen als bevoegd om
      aan de leerlingen op grond van het met gunstig gevolg afleggen van een eindexamen aan de school het diploma uit te
      reiken, bedoeld in het derde lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel72
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '72'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 112.1a
    text: |-
      [Artikel 72, leden 1a en 1b][ref1], zijn van overeenkomstige toepassing op de bevoegdheid het eindexamen af te
      nemen, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel72
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '72'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: '112.2'
    text: |-
      [Artikel 72, tweede en vierde lid][ref1], is op dit eindexamen van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel72
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '72'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: '112.3'
    text: |-
      Onze Minister besluit binnen zes maanden na ontvangst van een aanvraag. Indien de beschikking niet binnen zes
      maanden kan worden gegeven, stelt Onze Minister de aanvrager daarvan in kennis en noemt hij daarbij een termijn
      waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel112
  - number: '113'
    text: |-
      De aanwijzing geschiedt op een daartoe tot Onze Minister gerichte aanvraag van het schoolbestuur. Bij de aanvraag
      worden overgelegd:
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel113
  - number: 113.a
    text: het schoolplan van de school;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel113
  - number: 113.b
    text: bewijsstukken dat wordt voldaan aan de bekwaamheidseisen;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel113
  - number: 113.c
    text: de statuten en het reglement van de rechtspersoon met volledige rechtsbevoegdheid, die de school in stand houdt.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel113
  - number: '114.1'
    text: |-
      Het schoolplan van een ingevolge [artikel 112][ref1] aangewezen school voldoet ten minste aan de voorschriften,
      gegeven bij of krachtens de [artikelen 12a][ref2], [12b][ref3], [16][ref4], [18][ref5], [29][ref6],
      [34 tot en met 41][ref7], [42][ref8], [45][ref9] en [50][ref10].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel112
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel12a
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel12b
      [ref4]: https://wetten.overheid.nl/BWBR0030284#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0030284#Artikel18
      [ref6]: https://wetten.overheid.nl/BWBR0030284#Artikel29
      [ref7]: https://wetten.overheid.nl/BWBR0030284#Artikel34
      [ref8]: https://wetten.overheid.nl/BWBR0030284#Artikel42
      [ref9]: https://wetten.overheid.nl/BWBR0030284#Artikel45
      [ref10]: https://wetten.overheid.nl/BWBR0030284#Artikel50
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '112'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0030284
        artikel: 12a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0030284
        artikel: 12b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0030284
        artikel: '16'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref5
        bwb_id: BWBR0030284
        artikel: '18'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref6
        bwb_id: BWBR0030284
        artikel: '29'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref7
        bwb_id: BWBR0030284
        artikel: '34'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref8
        bwb_id: BWBR0030284
        artikel: '42'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref9
        bwb_id: BWBR0030284
        artikel: '45'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref10
        bwb_id: BWBR0030284
        artikel: '50'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '114.2'
    text: Bij wijziging van het schoolplan doet het schoolbestuur daarvan onmiddellijk mededeling aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel114
  - number: '114.3'
    text: |-
      Onze Minister kan ten behoeve van de bijzondere inrichting van het onderwijs aan de school besluiten toe te staan,
      dat wordt afgeweken van het eerste lid. Onze Minister besluit binnen zes maanden na ontvangst van een aanvraag.
      Indien de beschikking niet binnen zes maanden kan worden gegeven, stelt Onze Minister de aanvrager daarvan in
      kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel114
  - number: '114.4'
    text: De naam van de school duidt aan, met welke van de uit de openbare kas bekostigde scholen zij overeenkomt.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel114
  - number: '114.5'
    text: |-
      De voorwaarden voor de toelating tot de school zijn ten minste gelijk aan die, vastgesteld krachtens
      [artikel 64, eerste tot en met derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel64
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '64'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 114a.1
    text: |-
      Het bevoegd gezag van een ingevolge [artikel 112][ref1] aangewezen school kan leerlingen in de
      gelegenheid stellen in het kader van het onderwijs waarvoor zij aan de school zijn ingeschreven
      deel te nemen aan een opleiding voortgezet algemeen volwassenenonderwijs als bedoeld in
      [artikel 7.3.1, eerste lid, onder a, van de Wet educatie en beroepsonderwijs BES][ref2] die is erkend op grond van
      [artikel 1.4.2 van de Wet educatie en beroepsonderwijs BES][ref3], en die opleiding met een examen af te sluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel112
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0028395#Artikel1
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel114a
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '112'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0028395
        artikel: '1'
  - number: 114a.2
    text: |-
      Het eerste lid vindt uitsluitend toepassing met het doel leerlingen met bijzondere kenmerken beter in staat te
      stellen een diploma als bedoeld in deze wet te behalen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel114a
  - number: 114a.3
    text: |-
      Toepassing van het eerste lid berust op een samenwerkingsovereenkomst, gesloten tussen het bevoegd gezag, bedoeld
      in het eerste lid, en het bevoegd gezag van de instelling die de in het eerste lid bedoelde opleiding verzorgt. De
      samenwerkingsovereenkomst omvat in elk geval:
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel114a
  - number: 114a.3.a
    text: het doel van de samenwerking,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel114a
  - number: 114a.3.b
    text: de doelgroep,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel114a
  - number: 114a.3.c
    text: de wijze waarop wordt nagegaan of het doel wordt bereikt,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel114a
  - number: 114a.3.d
    text: het onderwijsprogramma dat volgens de samenwerking wordt vormgegeven, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel114a
  - number: 114a.3.e
    text: een regeling voor de beslechting van geschillen tussen partijen over de uitvoering van de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel114a
  - number: 114a.4
    text: |-
      Bij algemene maatregel van bestuur wordt nader geregeld voor welke leerlingen en onder welke voorwaarden het eerste
      lid toepassing kan vinden.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel114a
  - number: 114b.1
    text: |-
      Het bevoegd gezag van een ingevolge [artikel 112][ref1] aangewezen school kan leerlingen in de gelegenheid stellen
      in het kader van het onderwijs waarvoor zij aan de school zijn ingeschreven een doorlopende leerroute vmbo-mbo als
      bedoeld in [artikel 27a][ref2] of de geïntegreerde route vmbo-basisberoepsopleiding, bedoeld in [artikel 27l][ref3]
      te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel112
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel27a
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel27l
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel114b
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '112'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0030284
        artikel: 27a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0030284
        artikel: 27l
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 114b.2
    text: |-
      Toepassing van het eerste lid berust op een samenwerkingsovereenkomst, gesloten tussen het bevoegd gezag, bedoeld
      in het eerste lid, en het bevoegd gezag van instelling voor beroepsonderwijs, wat betreft een beroepsopleiding ten
      aanzien waarvan een erkenning is verkregen op grond van [artikel 1.4.1 WEB BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel1
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel114b
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '1'
  - number: 114b.3
    text: |-
      De [artikelen 27a][ref1], [27b, met uitzondering van het tweede lid, onderdeel e][ref2],
      [27c tot en met 27e][ref3], [27f, eerste en tweede lid][ref4], 27g en [27j tot en met 27l][ref5] zijn van
      overeenkomstige toepassing, met dien verstande dat voor «instelling voor beroepsonderwijs» telkens wordt gelezen
      «instelling voor beroepsonderwijs, wat betreft een beroepsopleiding ten aanzien waarvan een erkenning is verkregen
      op grond van [artikel 1.4.1 WEB BES][ref6]».


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel27a
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel27b
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel27c
      [ref4]: https://wetten.overheid.nl/BWBR0030284#Artikel27f
      [ref5]: https://wetten.overheid.nl/BWBR0030284#Artikel27j
      [ref6]: https://wetten.overheid.nl/BWBR0028395#Artikel1
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel114b
