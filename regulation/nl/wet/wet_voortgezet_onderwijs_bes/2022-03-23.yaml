  - number: '36.2'
    text: |-
      Het bevoegd gezag van een school voor voorbereidend wetenschappelijk onderwijs, voor algemeen voortgezet
      onderwijs en voor voorbereidend beroepsonderwijs kan voor leerlingen die daarvoor in aanmerking komen, bij
      de inrichting van het onderwijs afwijken van een of meer programmaonderdelen of van de voorschriften bedoeld
      in [artikel 35, eerste lid, onderdeel a][ref1]. De laatste volzin van het eerste lid is van overeenkomstige
      toepassing. Bij algemene maatregel van bestuur wordt bepaald hoe wordt vastgesteld welke leerlingen in aanmerking
      komen voor deze afwijkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel35
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '35'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '36.3'
    text: 'Voor leerlingen:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel36
  - number: 36.3.a
    text: |-
      die leerwegondersteunend onderwijs volgen als bedoeld in [artikel 30][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel30
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '30'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 36.3.b
    text: |-
      voor wie het bevoegd gezag het volgen van een leer-werktraject als bedoeld in [artikel 19][ref1] het meest geschikt
      acht, verzorgt het bevoegd gezag in de eerste twee leerjaren gezamenlijk ten minste 1 425 uren onderwijs op basis
      van kerndoelen.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel19
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel36
    references:
      - id: ref1
