    text: |-
      de scheiding tussen de functies van bestuur en het toezicht daarop, bedoeld in de [artikelen 54][ref1] en
      [55][ref2] en, indien toepassing wordt gegeven aan [artikel 78][ref3], een beschrijving van de over te dragen
      taken;


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel55
