  - number: '81'
    text: |-
      Onze Minister kan in aanvulling op [artikel 80, eerste lid][ref1], aan personen die in het bezit zijn van een
      buiten de Europese Economische Ruimte of Zwitserland behaald bewijsstuk de bevoegdheid verlenen tot het geven van
      voortgezet onderwijs in de openbare lichamen. Hij kan daarbij voorwaarden en beperkingen stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel80
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel81
