  - number: '42.1'
    text: |-
      Het onderwijs bevordert actief burgerschap en sociale cohesie op doelgerichte en samenhangende wijze, waarbij het
      onderwijs zich in ieder geval herkenbaar richt op:
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel42
  - number: 42.1.a
    text: |-
      het bijbrengen van respect voor en kennis van de basiswaarden van de democratische rechtsstaat, zoals verankerd in
      de [Grondwet][ref1], en de universeel geldende fundamentele rechten en vrijheden van de mens, en het handelen naar
      deze basiswaarden op school;


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: 42.1.b
    text: |-
      het ontwikkelen van de sociale en maatschappelijke competenties die de leerling in staat stellen deel uit te maken
      van en bij te dragen aan de pluriforme, democratische Caribisch Nederlandse samenleving; en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel42
  - number: 42.1.c
    text: |-
      het bijbrengen van kennis over en respect voor verschillen in godsdienst, levensovertuiging, politieke gezindheid,
      afkomst, geslacht, handicap of seksuele gerichtheid alsmede de waarde dat gelijke gevallen gelijk behandeld worden.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel42
  - number: '42.2'
    text: |-
      Het bevoegd gezag draagt zorg voor een schoolcultuur die in overeenstemming is met de waarden, bedoeld in het
      eerste lid, onderdeel a, creëert een omgeving waarin leerlingen worden gestimuleerd actief te oefenen met de omgang
      met en het handelen naar deze waarden en draagt voorts zorg voor een omgeving waarin leerlingen en personeel zich
      veilig en geaccepteerd weten, ongeacht de in het eerste lid, onder c, genoemde verschillen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel42
  - number: '43.1'
    text: De scholen voor voortgezet onderwijs zijn dagscholen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel43
  - number: '44.1'
    text: |-
      De naam van de school duidt aan, tot welke van de soorten van scholen, bedoeld in de [artikelen 13][ref1],
      [14][ref2], [15][ref3], [17][ref4] en [31][ref5], de school behoort. Het bevoegd gezag van een school voor
      middelbaar algemeen voortgezet onderwijs, een school voor voorbereidend beroepsonderwijs, of een scholengemeenschap
      waarvan in ieder geval een school voor middelbaar algemeen voortgezet onderwijs of een school voor voorbereidend
      beroepsonderwijs deel uitmaakt, kan voor die school de aanduiding «voorbereidend middelbaar beroepsonderwijs»
      hanteren. Bij verschil van mening tussen het bevoegd gezag en Onze Minister, tot welke van de soorten zij behoort,
      beslist Onze Minister bij beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0030284#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0030284#Artikel31
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '13'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '14'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '15'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0030284
        artikel: '17'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref5
        bwb_id: BWBR0030284
        artikel: '31'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '44.2'
    text: 'In het maatschappelijk verkeer brengt het bevoegd gezag ondubbelzinnig tot uitdrukking:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel44
  - number: 44.2.a
    text: |-
      welk bij of krachtens deze wet geregeld, uit ’s Rijks kas bekostigd onderwijs de leerlingen volgen en aankomende
      leerlingen kunnen gaan volgen,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel44
  - number: 44.2.b
    text: of het openbaar of bijzonder onderwijs betreft, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel44
  - number: 44.2.c
    text: |-
      in voorkomend geval welk onderwijs de school verzorgt met toepassing van [artikel 43, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel43
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '43'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '45.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voor de scholen voor voorbereidend wetenschappelijk
      onderwijs, algemeen voortgezet onderwijs en voorbereidend beroepsonderwijs voorschriften vastgesteld omtrent de
      inrichting van het onderwijs. Deze voorschriften kunnen per schoolsoort verschillen. Voor de scholen, bedoeld
      in de [artikelen 13][ref1], [14][ref2], [15][ref3] en [17][ref4], kunnen afzonderlijke voorschriften worden
      gegeven. De bij deze algemene maatregel van bestuur gegeven voorschriften zijn niet van toepassing op scholen
      voor voorbereidend beroepsonderwijs, het onderwijs in profielen in het voorbereidend beroepsonderwijs, waarvoor
      [artikel 50, vijfde lid][ref5], wordt toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0030284#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0030284#Artikel50
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '13'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '14'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '15'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0030284
        artikel: '17'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref5
        bwb_id: BWBR0030284
        artikel: '50'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '45.2'
    text: |-
      De algemene maatregel van bestuur, bedoeld in het eerste lid, kan slechts voorschriften inhouden omtrent het in
      uren uitgedrukte aantal lessen dat gedurende de cursus in lichamelijke opvoeding ten minste moet worden verzorgd.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel45
  - number: '46'
    text: |-
      Indien een leerling gedurende een deel van de week onderwijs ontvangt op een andere school of wordt begeleid bij
      het expertisecentrum onderwijszorg, telt de tijd gedurende welke de leerling dit onderwijs ontvangt mee voor het
      aantal uren onderwijs dat de leerling ten minste moet ontvangen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel46
  - number: '47'
    text: |-
      Het bevoegd gezag draagt zorg voor de kwaliteit van het onderwijs op de school. Onder zorg dragen voor de kwaliteit
      van het onderwijs wordt in elk geval verstaan het naleven van de bij of krachtens deze wet gegeven voorschriften en
      het uitvoeren van het stelsel van kwaliteitszorg, bedoeld in [artikel 50, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel50
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '50'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 47a
    text: |-
      Voor de vormen van onderwijs, bedoeld in [artikel 6, onderdelen a tot en met d][ref1], wordt bij algemene
      maatregel van bestuur een samenhangend geheel van referentieniveaus taal en rekenen vastgesteld met dien
      verstande dat verschillende referentieniveaus kunnen worden vastgesteld voor en binnen de leerwegen, bedoeld in de
      [artikelen 16][ref2], [18][ref3] en [29][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0030284#Artikel29
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel47a
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '16'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '18'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0030284
        artikel: '29'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '48'
    text: |-
      Het bevoegd gezag rapporteert over de vorderingen van de leerlingen aan hun ouders, dan wel aan de leerlingen zelf
      indien zij meerderjarig en handelingsbekwaam zijn.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel48
  - number: '50.1'
    text: |-
      Het schoolplan bevat een beschrijving van het beleid met betrekking tot de kwaliteit van het onderwijs dat
      binnen de school wordt gevoerd, en omvat in elk geval het onderwijskundig beleid, het personeelsbeleid en het
      stelsel van kwaliteitszorg. In het schoolplan wordt aangegeven op welke wijze de identiteitscommissie, bedoeld
      in [artikel 109a][ref1], invulling geeft aan het openbare karakter onderscheidenlijk de identiteit voor zover het
      betreft een samenwerkingsschool. Het schoolplan omvat mede het beleid ten aanzien van de aanvaarding van materiële
      bijdragen of geldelijke bijdragen, niet zijnde ouderbijdragen of op de onderwijswetgeving gebaseerde bijdragen,
      indien het bevoegd gezag daarbij verplichtingen op zich neemt waarmee de leerlingen binnen de schooltijden en
      tijdens de activiteiten die worden georganiseerd onder verantwoordelijkheid van het bevoegd gezag, alsmede tijdens
      het overblijven, zullen worden geconfronteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel109a
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: 109a
        hoofdstuk: IV
        afdeling: I
  - number: '50.2'
    text: 'De beschrijving van het onderwijskundig beleid omvat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel50
  - number: 50.2.a
    text: |-
      de uitwerking van de wettelijke voorschriften betreffende de uitgangspunten, de doelstelling en de inhoud van het
      onderwijs,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel50
  - number: 50.2.b
    text: |-
      de door het bevoegd gezag in het schoolplan opgenomen eigen opdrachten voor het onderwijs in een
      onderwijsprogramma,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel50
  - number: 50.2.c
    text: het pedagogisch-didactisch klimaat en het schoolklimaat, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel50
  - number: 50.2.d
    text: |-
      het zorg dragen voor de veiligheid op school, bedoeld in [artikel 4a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel4a
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: 4a
  - number: '50.3'
    text: 'De beschrijving van het personeelsbeleid omvat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel50
  - number: 50.3.a
    text: het voldoen aan de eisen van bevoegdheid en de wijze waarop de bekwaamheid wordt onderhouden,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel50
  - number: 50.3.b
    text: |-
      de maatregelen met betrekking tot het personeel die bijdragen aan de ontwikkeling en de uitvoering van het
      onderwijskundig beleid,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel50
  - number: 50.3.c
    text: het pedagogisch-didactisch handelen van het onderwijspersoneel, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel50
  - number: 50.3.d
    text: de wijze waarop rekening wordt gehouden met de inbreng van leerlingen op dat beleid.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel50
  - number: '50.4'
    text: 'De beschrijving van het stelsel van kwaliteitszorg omvat in elk geval het zorg dragen voor:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel50
  - number: 50.4.a
    text: |-
      het bewaken dat leerlingen een ononderbroken ontwikkelingsproces kunnen doorlopen en dat het onderwijs wordt
      afgestemd op de voortgang in de ontwikkeling van leerlingen, bedoeld in [artikel 2, tweede lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel2
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '2'
  - number: 50.4.b
    text: het vaststellen welke maatregelen ter verbetering nodig zijn, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel50
  - number: 50.4.c
    text: |-
      het vormgeven aan de uitwerking van het eilandelijk zorgplan, bedoeld in [artikel 68][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel68
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '68'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
  - number: '51.1'
    text: |-
      De schoolgids bevat voor ouders en leerlingen informatie over de werkwijze van de school en bevat in elk geval
      informatie over:
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel51
  - number: 51.1.a
    text: |-
      de doelen van het onderwijs en de resultaten die met het onderwijsleerproces worden bereikt, waaronder, in ieder
      geval met betrekking tot het schooljaar voorafgaande aan het schooljaar waarin de schoolgids wordt vastgesteld en
      onderscheiden naar soort onderwijs, voor elk leerjaar
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel51
  - number: 51.1.a.1°
    text: het percentage leerlingen dat doorstroomt naar een hoger leerjaar of een ander soort onderwijs,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel51
  - number: 51.1.a.2°
    text: |-
      het percentage leerlingen dat de school zonder diploma verlaat en het percentage leerlingen dat voor het eindexamen
      slaagt,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel51
  - number: 51.1.b
    text: de wijze waarop de zorg voor leerlingen met specifieke onderwijsbehoeften wordt vormgegeven,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel51
  - number: 51.1.c.1°
    text: |-
      het totaal aantal uren en het soort activiteiten dat als onderwijstijd als bedoeld in
      [artikel 12a, eerste lid][ref1], wordt geprogrammeerd, de vakanties en andere dagen waarop geen onderwijs wordt
      verzorgd, alsmede wat het beleid is ten aanzien van lesuitval,


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel12a
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: 12a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 51.1.c.2°
    text: |-
      de inrichting van het onderwijsprogramma voor de eerste twee leerjaren waarbij wordt aangegeven of sprake is van
      vakoverstijgende programmaonderdelen en de inzet van het personeel daarbij,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel51
  - number: 51.1.d
    text: |-
      de geldelijke bijdrage, bedoeld in [artikel 64, vierde lid][ref1], waarbij wordt vermeld dat deze vrijwillig is en
      dat het niet voldoen van die bijdrage niet leidt tot het uitsluiten van leerlingen van deelname aan activiteiten,


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel64
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '64'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 51.1.e
    text: |-
      de rechten en plichten van de ouders, de leerlingen en het bevoegd gezag, waaronder de informatie over de
      klachtenregeling, bedoeld in [artikel 52][ref1], waarbij wat betreft de leerlingen kan worden volstaan met
      vermelding van de rechten en plichten opgenomen in het leerlingenstatuut, bedoeld in artikel 60,


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel52
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '52'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 51.1.f
    text: |-
      het leerlingenparticipatiebeleid, waaronder wordt begrepen de wijze waarop leerlingen worden betrokken bij
      de vorming van het beleid van de school, alsmede de wijze waarop deze betrokkenheid wordt gefaciliteerd en
      gestimuleerd,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel51
  - number: 51.1.g
    text: |-
      de wijze waarop het bevoegd gezag omgaat met de in [artikel 50, eerste lid][ref1], omschreven bijdragen,


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel50
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '50'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 51.1.h
    text: het beleid met betrekking tot de veiligheid,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel51
  - number: 51.1.i
    text: het verzuimbeleid,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel51
  - number: 51.1.j
    text: |-
      de in het kader van het stelsel van kwaliteitszorg, bedoeld in [artikel 50, vierde lid][ref1], gedane bevindingen
      en de maatregelen die naar aanleiding daarvan zijn getroffen,


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel50
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '50'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 51.1.k
    text: |-
      de persoon bij wie de taken, bedoeld in [artikel 4a, eerste lid, onderdeel c][ref1], zijn belegd, en


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel4a
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: 4a
  - number: 51.1.l
    text: |-
      de wijze waarop de identiteitscommissie, bedoeld in [artikel 109a][ref1], invulling geeft aan het openbare karakter
      onderscheidenlijk de identiteit voor zover het betreft een samenwerkingsschool.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel109a
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: 109a
        hoofdstuk: IV
        afdeling: I
  - number: '51.2'
    text: Bij algemene maatregel van bestuur kunnen voorschriften worden gegeven met betrekking tot de wijze waarop
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel51
  - number: 51.2.a
    text: de resultaten worden beschreven die met het onderwijs worden bereikt, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel51
  - number: 51.2.b
    text: de context wordt vermeld waarin de onder a bedoelde resultaten dienen te worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel51
  - number: 51a.1
    text: |-
      Het bevoegd gezag stelt ten minste eenmaal in de vier jaar het schoolplan vast en stelt dit zo spoedig mogelijk na
      de vaststelling beschikbaar voor de inspectie.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel51a
  - number: 51a.2
    text: |-
      Het bevoegd gezag stelt jaarlijks de schoolgids vast ten behoeve van het eerstvolgende schooljaar en stelt deze
      zo spoedig mogelijk na de vaststelling beschikbaar voor de ouders, voogden, verzorgers dan wel de meerderjarige en
      handelingsbekwame leerling, en de inspectie.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel51a
  - number: '52.1'
    text: |-
      Ouders dan wel leerlingen, en personeelsleden kunnen bij de klachtencommissie, bedoeld in het tweede lid,
      onderdeel a, een klacht indienen over gedragingen en beslissingen van het bevoegd gezag of het personeel, waaronder
      discriminatie, dan wel het nalaten van gedragingen en het niet nemen van beslissingen door het bevoegd gezag of
      het personeel.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel52
  - number: '52.2'
    text: 'Het bevoegd gezag treft een regeling voor de behandeling van klachten. Deze regeling vermeldt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel52
  - number: 52.2.a
    text: de instelling van een klachtencommissie, die klachten behandelt,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel52
  - number: 52.2.b
    text: de wijze waarop de klachtencommissie haar werkzaamheden verricht,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel52
  - number: 52.2.c
    text: de termijn waarbinnen de klager een klacht kan indienen en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel52
  - number: 52.2.d
    text: |-
      de termijn waarbinnen mededeling plaatsvindt van het oordeel, bedoeld in het zesde lid, en hoe bij noodzakelijke
      afwijking van deze termijn wordt gehandeld.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel52
  - number: '52.3'
    text: |-
      Deze regeling strekt ter vervanging van klachtenregelingen op grond van andere voorschriften dan dit artikel en
      strekt niet ter vervanging van een andere voorziening die op grond van een wettelijke regeling, niet zijnde een
      klachtenregeling, voor de klager openstaat of heeft opengestaan.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel52
  - number: '52.4'
    text: Deze regeling
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel52
  - number: 52.4.a
    text: |-
      voorziet erin dat de klachten worden behandeld door een klachtencommissie die bestaat uit ten minste drie leden,
      waaronder een voorzitter die geen deel uitmaakt van het bevoegd gezag en niet werkzaam is voor of bij het bevoegd
      gezag, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel52
  - number: 52.4.b
    text: |-
      waarborgt dat aan de behandeling van een klacht niet wordt deelgenomen door een persoon op wiens gedraging de
      klacht rechtstreeks betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel52
  - number: '52.5'
    text: 'De klager en degene over wie is geklaagd krijgen de gelegenheid:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel52
  - number: 52.5.a
    text: hun zienswijze mondeling of schriftelijk toe te lichten en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel52
  - number: 52.5.b
    text: zich bij de behandeling van de klacht te laten bijstaan.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel52
  - number: '52.6'
    text: |-
      De klachtencommissie vormt zich een oordeel over de gegrondheid van de klacht en deelt dit oordeel, al dan niet
      vergezeld van aanbevelingen, schriftelijk mede aan de klager, degene over wie is geklaagd en het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel52
  - number: '52.7'
    text: |-
      Het bevoegd gezag deelt de klager en de klachtencommissie, bedoeld in het tweede lid, onderdeel a, binnen 4 weken
      na ontvangst van het in het zesde lid bedoelde oordeel van de klachtencommissie schriftelijk mede of hij het
      oordeel over de gegrondheid van de klacht deelt en of hij naar aanleiding van dat oordeel maatregelen zal nemen en
      zo ja welke. Bij afwijking van de in de eerste volzin bedoelde termijn, doet het bevoegd gezag daarvan met redenen
      omkleed mededeling aan de klager en de klachtencommissie onder vermelding van de termijn waarbinnen het bevoegd
      gezag zijn standpunt bekend zal maken.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel52
  - number: '52.8'
    text: |-
      Degene die betrokken is bij de uitvoering van dit artikel en daarbij de beschikking krijgt over gegevens waarvan
      hij het vertrouwelijke karakter kent of redelijkerwijze moet vermoeden, is verplicht tot geheimhouding daarvan,
      behoudens voor zover enig wettelijk voorschrift hem tot mededeling verplicht of uit zijn taak de noodzaak tot
      mededeling voortvloeit.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel52
  - number: '52.9'
    text: |-
      Gegevens die betrekking hebben op een klacht worden bewaard op een plaats die uitsluitend toegankelijk is voor de
      leden van de klachtencommissie en het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel52
  - number: '54.1'
    text: |-
      Het bevoegd gezag draagt mede in verband met de verplichting, bedoeld in [artikel 47][ref1], zorg voor een goed
      bestuurde school met een scheiding tussen de functies van bestuur en het toezicht daarop, en met een rechtmatig
      bestuur en beheer.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel47
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '47'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '54.2'
    text: |-
      De benoeming in de functies van het bestuur en het toezicht op het bestuur, bedoeld in het eerste lid, geschiedt op
      basis van vooraf openbaar gemaakte profielen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel54
  - number: '55.1'
    text: |-
      Het bevoegd gezag draagt er zorg voor dat de functies van bestuur en intern toezicht op het bestuur in functionele
      of organieke zin zijn gescheiden.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel55
  - number: '55.2'
    text: |-
      Een intern toezichthouder of een lid van het interne toezichthoudend orgaan functioneert onafhankelijk van het
      bestuur.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel55
  - number: '56.1'
    text: |-
      De interne toezichthouder of het interne toezichthoudend orgaan houdt toezicht op de uitvoering van de taken en de
      uitoefening van de bevoegdheden door het bestuur en staat het bestuur met raad terzijde. De toezichthouder of het
      toezichthoudend orgaan is ten minste belast met:
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel56
  - number: 56.1.a
    text: |-
      het goedkeuren van de begroting en het jaarverslag en, indien van toepassing, het strategisch meerjarenplan van
      de school;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel56
  - number: 56.1.b
    text: |-
      het toezien op de naleving door het bestuur van wettelijke verplichtingen, de code voor goed bestuur, bedoeld in
      [artikel 175, eerste lid, onderdeel a][ref1], en de afwijkingen van die code;


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel175
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '175'
        hoofdstuk: IV
        afdeling: III
  - number: 56.1.c
    text: |-
      het toezien op de rechtmatige verwerving en de doelmatige en rechtmatige bestemming en aanwending van de middelen
      van de school verkregen op grond van deze wet;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel56
  - number: 56.1.d
    text: |-
      het aanwijzen van een deskundige, bedoeld in
      [artikel 121, zesde lid, van Boek 2 van het Burgerlijk Wetboek BES][ref1] die verslag uitbrengt aan de
      toezichthouder of het toezichthoudend orgaan, en


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel121
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '121'
  - number: 56.1.e
    text: |-
      het jaarlijks afleggen van verantwoording over de uitvoering van de taken en de uitoefening van de bevoegdheden,
      bedoeld onder a tot en met d, in het jaarverslag.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel56
  - number: '56.2'
    text: |-
      De taken en bevoegdheden van de interne toezichthouder of het interne toezichthoudend orgaan zijn zodanig dat hij
      een deugdelijk en onafhankelijk intern toezicht kan uitoefenen. Indien sprake is van meer dan een toezichthouder of
      van een toezichthoudend orgaan is de eerste volzin van overeenkomstige toepassing met betrekking tot de combinatie
      van de toezichthouders of de samenstelling van het toezichthoudend orgaan.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel56
  - number: '56.3'
    text: |-
      De interne toezichthouder of het interne toezichthoudend orgaan pleegt ten minste tweemaal per jaar overleg met de
      medezeggenschapsraad van de school.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel56
  - number: '56.4'
    text: |-
      Indien het intern toezicht wordt uitgeoefend door een raad van toezicht, zijn het eerste tot en met derde lid van
      overeenkomstige toepassing ten aanzien van de raad van toezicht. Een raad van toezicht is tevens belast met het
      benoemen, schorsen en ontslaan van de leden van het bestuur, alsmede de toepassing van de [artikelen 90][ref1],
      [92][ref2], [93][ref3] en [107][ref4] van deze wet, de [Ambtenarenwet BES][ref5] en de daarmee verband houdende
      wettelijke bepalingen op leden van het bestuur die mede tot het personeel behoren.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel90
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel92
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel93
      [ref4]: https://wetten.overheid.nl/BWBR0030284#Artikel107
      [ref5]: https://wetten.overheid.nl/BWBR0028215
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '90'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '92'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '93'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0030284
        artikel: '107'
        hoofdstuk: III
        afdeling: I
      - id: ref5
        bwb_id: BWBR0028215
  - number: '57.1'
    text: Aan een school is een medezeggenschapsraad verbonden.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel57
  - number: '57.2'
    text: De medezeggenschapsraad van een school bestaat uit ten minste 4 leden.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel57
  - number: '57.3'
    text: 'De medezeggenschapsraad van een school bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel57
  - number: 57.3.a
    text: leden die uit en door het personeel worden gekozen; en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel57
  - number: 57.3.b
    text: leden die deels uit en door de ouders en deels uit en door de leerlingen worden gekozen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel57
  - number: '57.4'
    text: |-
      De aantallen leden, bedoeld in het derde lid, onderdeel a en onderdeel b, zijn aan elkaar gelijk. Tevens zijn de
      aantallen leden uit en door de ouders en uit en door de leerlingen aan elkaar gelijk. Indien niet aan de tweede
      volzin kan worden voldaan, omdat onvoldoende ouders dan wel leerlingen bereid zijn lid te worden, kan de niet door
      de desbetreffende groep te vervullen plaats worden toegedeeld aan de andere groep.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel57
  - number: '57.5'
    text: |-
      Indien het bevoegd gezag personeel heeft benoemd of te werk gesteld zonder benoeming dat werkzaamheden verricht
      ten behoeve van meer dan een school, kan een medezeggenschapsraad worden ingesteld die bestaat uit leden die uit en
      door dat personeel worden gekozen. De medezeggenschapsraad bestaat in dat geval uit ten minste 2 leden.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel57
  - number: '57.6'
    text: Geen lid van de medezeggenschapsraad kunnen zijn degenen die deel uitmaken van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel57
  - number: '57.7'
    text: |-
      Een personeelslid dat is opgedragen om namens het bevoegd gezag op te treden in besprekingen met de
      medezeggenschapsraad kan niet tevens lid zijn van de medezeggenschapsraad.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel57
  - number: '57.8'
    text: |-
      Kandidaten voor de verkiezing van het deel van de medezeggenschapsraad dat uit en door het personeel wordt gekozen,
      kunnen worden gesteld door personeelsleden en door organisaties van personeel. Kandidaten voor de verkiezing
      van het deel van de medezeggenschapsraad dat uit en door de ouders of de leerlingen wordt gekozen, kunnen worden
      gesteld door ouders of leerlingen en door organisaties van ouders of leerlingen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel57
  - number: '57.9'
    text: De verkiezing van de leden van de medezeggenschapsraad geschiedt bij geheime schriftelijke stemming.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel57
  - number: '57.10'
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven over de periode waarin de verkiezing van de
      leden van de medezeggenschapsraad plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel57
  - number: '57.11'
    text: |-
      Het bevoegd gezag draagt er zorg voor, dat de leden van de medezeggenschapsraad niet uit hoofde van hun
      lidmaatschap van de raad worden benadeeld in hun positie met betrekking tot de school. De eerste volzin is van
      overeenkomstige toepassing ten aanzien van kandidaatleden en voormalige leden.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel57
  - number: '57.12'
    text: |-
      De beëindiging anders dan op eigen verzoek van de betrekking van een lid van het personeel mag geen verband houden
      met de kandidaatstelling voor het lidmaatschap, het lidmaatschap of het voormalig lidmaatschap van de betrokkene
      van de medezeggenschapsraad. Een beëindiging van de betrekking in strijd met dit lid is nietig.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel57
  - number: '57.13'
    text: |-
      De medezeggenschapsraad kiest uit zijn midden een voorzitter en een of meer plaatsvervangende voorzitters. De
      voorzitter, of bij diens verhindering een plaatsvervangende voorzitter, vertegenwoordigt de raad in rechte.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel57
  - number: '58.1'
    text: |-
      Het bevoegd gezag stelt de medezeggenschapsraad bedoeld in [artikel 57][ref1] ten minste twee maal per jaar in de
      gelegenheid de algemene gang van zaken in de school met hem te bespreken.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel57
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '57'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '58.2'
    text: |-
      Het bevoegd gezag en de medezeggenschapsraad komen bijeen indien daarom onder opgave van redenen door het bevoegd
      gezag, de vertegenwoordigers van ouders, de vertegenwoordigers van leerlingen of de vertegenwoordigers van
      personeel wordt verzocht. De besprekingen kunnen namens het bevoegd gezag worden gevoerd.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel58
  - number: '61'
    text: |-
      Ten behoeve van de bijzondere inrichting van het onderwijs aan een school kan Onze Minister besluiten toe te staan
      dat wordt afgeweken van de [artikelen 8][ref1] en [12a tot en met 41][ref2], en van de voorschriften, bedoeld in
      [artikel 45][ref3]. Onze Minister besluit binnen zes maanden na ontvangst van een aanvraag. Indien de beschikking
      niet binnen zes maanden kan worden gegeven, stelt Onze Minister de aanvrager daarvan in kennis en noemt hij daarbij
      een termijn waarbinnen de beschikking wel tegemoet kan worden gezien.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel45
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '13'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '45'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '63.1'
    text: |-
      Het bevoegd gezag van een school waar een leerling met een specifieke onderwijsbehoefte is ingeschreven stelt
      in overeenstemming met de ouders en met inachtneming van [artikel 69, derde lid][ref1], voor elk schooljaar een
      handelingsplan op. Indien de inschrijving van de in de eerste volzin bedoelde leerling plaatsvindt op of na 1
      augustus wordt het handelingsplan zo spoedig mogelijk doch uiterlijk een maand na die inschrijving opgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel69
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '69'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
  - number: '63.2'
    text: Het handelingsplan wordt jaarlijks met de ouders geëvalueerd.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel63
  - number: '64.1'
    text: |-
      Het bevoegd gezag beslist over de toelating van leerlingen, met inachtneming van deze paragraaf. Bij of
      krachtens algemene maatregel van bestuur kunnen voor elke soort van scholen of voor aan scholen als bedoeld
      in [artikel 17][ref1] verzorgde profielen voorwaarden voor de toelating en voorschriften omtrent verwijdering
      en voorwaardelijke bevordering worden vastgesteld. De algemene maatregel van bestuur bedoeld in de tweede
      volzin houdt in elk geval voorschriften in met betrekking tot de voorwaarden voor de toelating tot de
      scholen, bedoeld in de [artikelen 13][ref2], [14][ref3], [15][ref4] en [17][ref5]. Definitieve verwijdering
      van een leerling waarop de [Leerplichtwet BES][ref6] van toepassing is, vindt niet plaats dan nadat het
      bevoegd gezag ervoor heeft zorggedragen dat een andere school, dan wel een instelling als bedoeld in
      [artikel 1, onder c, van de Leerplichtwet BES][ref7] bereid is de leerling toe te laten.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0030284#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0030284#Artikel17
      [ref6]: https://wetten.overheid.nl/BWBR0030281
      [ref7]: https://wetten.overheid.nl/BWBR0030281#Artikel1
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '17'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
