  - number: '85'
    text: |-
      Volgens regelen, te stellen bij algemene maatregel van bestuur, kunnen in bijzondere gevallen, in afwijking van
      de eisen van benoembaarheid, gesteld in [artikel 80, eerste lid onder b][ref1], leraren die voldoen aan de in
      [artikel 86, eerste juncto vijfde lid][ref2], bedoelde bekwaamheidseisen, niet zijnde bekwaamheidseisen voor de
      periode van voorbereidend hoger onderwijs, tot een bepaald aantal lessen tijdelijk tevens onderwijs geven in het
      desbetreffende vak of de desbetreffende combinatie van vakken aan de scholen of leerjaren van scholen waarvoor moet
      worden voldaan aan laatstgenoemde bekwaamheidseisen.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel86
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel85
