  - number: '80.10'
    text: Bij toepassing van het achtste lid of negende lid is het zesde lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel80
  - number: '80.11'
    text: |-
      Het bevoegd gezag beschikt over geordende gegevens over de toepassing van het vijfde lid, de eerste volzin van het
      zevende lid, het achtste lid en het negende lid.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel80
  - number: '80.12'
    text: |-
      Het eerste lid is niet van toepassing op een leraar, in zoverre deze belast is met het verrichten van werkzaamheden
      in verband met contractactiviteiten.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel80
  - number: '80.13'
    text: |-
      Bij algemene maatregel van bestuur worden ten aanzien van leraren die in vaste dienst zijn verbonden aan een
      school, bedoeld in de [artikelen 13][ref1], [14][ref2], [15][ref3], [17][ref4] en [31][ref5], regelen gesteld
