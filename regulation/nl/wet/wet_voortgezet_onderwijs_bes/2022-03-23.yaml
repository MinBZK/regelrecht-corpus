  - number: '115'
    text: |-
      Onze Minister kan de aanwijzing intrekken, indien niet langer wordt voldaan aan de voorschriften gegeven bij of
      krachtens de [artikelen 112][ref1], [114][ref2] en [114a][ref3] of indien van misbruik van de verleende aanwijzing
      is gebleken. De aanwijzing kan door Onze Minister tevens worden ingetrokken indien het schoolbestuur of het
      personeel van de school in strijd handelt met [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel112
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel114
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel114a
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '112'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '114'
        afdeling: II
      - id: ref3
        bwb_id: BWBR0030284
        artikel: 114a
        afdeling: II
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '116.1'
    text: |-
      Jaarlijks geeft het College voor toetsen en examens gelegenheid om door het met gunstig gevolg afleggen van
      een staatsexamen, een diploma te verkrijgen, overeenkomende met een diploma van een school voor voorbereidend
      wetenschappelijk onderwijs, voor hoger algemeen voortgezet onderwijs, voor middelbaar algemeen voortgezet onderwijs
      en voor voorbereidend beroepsonderwijs, als bedoeld in [artikel 72, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel72
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '72'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: '116.2'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald, welke andere diploma's kunnen worden verkregen door het met
      gunstig gevolg afleggen van een staatsexamen voor het College voor toetsen en examens.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel116
  - number: '116.3'
    text: |-
      Zij, die zijn afgewezen bij het eindexamen van een school, worden niet toegelaten tot het in hetzelfde jaar te
      houden overeenkomstige staatsexamen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel116
  - number: '116.4'
    text: De staatsexamens zijn openbaar, behoudens het schriftelijke gedeelte.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel116
  - number: '116.5'
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften vastgesteld omtrent de in dit artikel bedoelde examens, die
      niet voor alle kandidaten dezelfde vakken en andere programmaonderdelen behoeven te omvatten. Daarbij kan worden
      bepaald het bedrag, dat voor de toelating tot deze examens verschuldigd is. Tevens kan daarbij worden bepaald dat
      dit bedrag is verschuldigd door het bevoegd gezag van een school ten aanzien waarvan toepassing is gegeven aan
      [artikel 72, lid 1a][ref1], of door het bevoegd gezag van een instelling ten aanzien waarvan toepassing is gegeven
      aan [artikel 6.2.2a, eerste lid, van de Wet educatie en beroepsonderwijs BES][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel6
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '72'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '6'
  - number: '117.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen inrichtingen voor voortgezet onderwijs als bedoeld in
      [artikel 6, onderdeel e][ref1], worden aangewezen die voor bekostiging uit 's Rijks kas in aanmerking komen.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel6
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '6'
  - number: '117.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor de aangewezen inrichtingen voor voortgezet onderwijs
      voorschriften worden gegeven voor de toepassing van de bij of krachtens deze wet vastgestelde voorschriften over:
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel117
  - number: 117.2.a
    text: de inrichting van het onderwijs,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel117
  - number: 117.2.b
    text: de examens,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel117
  - number: 117.2.c
    text: de rechtspositie van het personeel,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel117
  - number: 117.2.d
    text: de benoembaarheidsvereisten van het personeel, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel117
  - number: 117.2.e
    text: de aanvang, wijze en beëindiging van de bekostiging.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel117
  - number: '118'
    text: |-
      In deze afdeling worden de onder a tot en met d aangegeven schoolsoorten aangeduid met de daarbij vermelde
      afkortingen:
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel118
  - number: 118.a
    text: 'vwo: voorbereidend wetenschappelijk onderwijs,'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel118
  - number: 118.b
    text: 'havo: hoger algemeen voortgezet onderwijs,'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel118
  - number: 118.c
    text: 'mavo: middelbaar algemeen voortgezet onderwijs,'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel118
  - number: 118.d
    text: 'vbo: voorbereidend beroepsonderwijs.'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel118
  - number: '119'
    text: |-
      Bekostiging uit 's Rijks kas van een school of scholengemeenschap neemt geen aanvang dan krachtens de bepalingen
      van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel119
  - number: '120.1'
    text: 'Onze Minister brengt een openbare of bijzondere school voor bekostiging in aanmerking indien het bevoegd gezag:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel120
  - number: 120.1.a
    text: |-
      met de belangstellingsmeting aannemelijk maakt dat deze school, mede gelet op de hoogte van de bekostiging die
      krachtens deze titel wordt verstrekt, zal worden bezocht door een aantal leerlingen dat voldoende is om een school
      van voldoende kwaliteit in stand te houden; en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel120
  - number: 120.1.b
    text: |-
      voldoet aan de verplichtingen in [artikel 123, eerste en tweede lid][ref1], en [124, eerste en tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel123
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel124
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '123'
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '124'
        paragraaf: '1'
        afdeling: I
  - number: '120.2'
    text: |-
      Onze Minister brengt een openbare of bijzondere scholengemeenschap voor bekostiging in aanmerking indien het
      bevoegd gezag:
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel120
  - number: 120.2.a
    text: |-
      met de belangstellingsmeting aannemelijk maakt dat het aantal leerlingen van elk van de samenstellende scholen ten
      minste drie kwart zal bedragen van het daarvoor in het eerste lid bedoelde aantal; en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel120
  - number: 120.2.b
    text: |-
      voldoet aan de verplichtingen in [artikel 123, eerste en tweede lid][ref1], en [124, eerste en tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel123
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel124
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '123'
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '124'
        paragraaf: '1'
        afdeling: I
  - number: '120.3'
    text: |-
      Onze Minister brengt een openbare school of scholengemeenschap waarvoor een aanvraag als bedoeld in
      [artikel 122, eerste of tweede lid][ref1], is ingediend voor bekostiging in aanmerking, indien voldaan is aan
      de verplichtingen in [artikel 123, eerste en tweede lid][ref2] en [artikel 124, eerste en tweede lid][ref3],
      met uitzondering van een document waaruit blijkt dat het openbaar lichaam van het eiland van de beoogde plaats
      van vestiging is gevraagd om te overleggen over het voornemen tot het doen van een aanvraag om bekostiging.
      [Artikel 125][ref4] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel122
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel123
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel124
      [ref4]: https://wetten.overheid.nl/BWBR0030284#Artikel125
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '122'
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '123'
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '124'
        paragraaf: '1'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0030284
        artikel: '125'
        paragraaf: '1'
        afdeling: I
  - number: '120.4'
    text: |-
      Onze Minister brengt een openbare of bijzondere nevenvestiging van een school voor bekostiging in aanmerking indien
      het bevoegd gezag:
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel120
  - number: 120.4.a
    text: |-
      met de belangstellingsmeting aannemelijk maakt dat deze nevenvestiging, mede gelet op de hoogte van de bekostiging
      die krachtens deze titel wordt verstrekt, zal worden bezocht door een aantal leerlingen dat voldoende is om een
      school van voldoende kwaliteit in stand te houden; en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel120
  - number: 120.4.b
    text: |-
      voldoet aan de verplichtingen in [artikel 123, eerste en tweede lid][ref1], en [124, eerste en tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel123
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel124
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '123'
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '124'
        paragraaf: '1'
        afdeling: I
  - number: '121.1'
    text: |-
      [Artikel 120, eerste lid][ref1], is van overeenkomstige toepassing op de bekostiging van een nieuw te vormen
      profiel als bedoeld in [artikel 18, derde lid][ref2], aan een al bekostigde school voor vbo.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel120
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel18
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '120'
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '18'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '121.2'
    text: |-
      Onze Minister brengt een nieuw te vormen school die wordt toegevoegd aan een al bekostigde school of
      scholengemeenschap voor bekostiging in aanmerking indien het bevoegd gezag:
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel121
  - number: 121.2.a
    text: |-
      met de belangstellingsmeting aannemelijk maakt dat deze nieuwe school zal worden bezocht door ten minste drie kwart
      van het daarvoor in [artikel 120, eerste lid][ref1], bedoelde aantal; en


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel120
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '120'
        paragraaf: '1'
        afdeling: I
  - number: 121.2.b
    text: |-
      voldoet aan de verplichtingen, bedoeld in [artikel 123, eerste en tweede lid][ref1] en
      [artikel 124, eerste en tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel123
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel124
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '123'
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '124'
        paragraaf: '1'
        afdeling: I
  - number: '121.3'
    text: |-
      De [artikelen 124a][ref1] en [125][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel124a
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel125
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: 124a
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '125'
        paragraaf: '1'
        afdeling: I
  - number: '122.1'
    text: |-
      De Rijksvertegenwoordiger draagt er zorg voor dat is voorzien in de behoefte aan openbaar onderwijs door een
      voldoende aantal scholen in het openbaar lichaam. Daartoe kan de Rijksvertegenwoordiger het bestuurscollege van het
      openbaar lichaam opdragen, een aanvraag bij Onze Minister in te dienen om een openbare school of scholengemeenschap
      voor bekostiging in aanmerking te brengen indien de ouders van een naar het oordeel van de Rijksvertegenwoordiger
      voldoende groot aantal leerlingen hebben aangegeven dat zij dat wensen en het bestuurscollege van het openbaar
      lichaam deze wens niet heeft ingewilligd.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel122
  - number: '122.2'
    text: |-
      Onze Minister kan het bestuurscollege van het openbaar lichaam opdragen een aanvraag bij hem in te dienen om een
      openbare school of scholengemeenschap voor bekostiging in aanmerking te brengen, indien de Rijksvertegenwoordiger
      het eerste lid niet toepast en ouders van een naar het oordeel van Onze Minister voldoende groot aantal leerlingen
      hebben aangegeven dat zij indiening van een dergelijke aanvraag wensen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel122
  - number: '122.3'
    text: |-
      Indien een besluit van Onze Minister op een aanvraag als bedoeld in dit artikel onherroepelijk is geworden, gaat
      het bestuurscollege van het openbaar lichaam over tot stichting van de daarbij voor bekostiging in aanmerking
      gebrachte school of scholengemeenschap.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel122
  - number: '123.1'
    text: |-
      Het bevoegd gezag dient voor 1 november bij Onze Minister een aanvraag in om voor bekostiging in aanmerking te
      brengen:
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel123
  - number: 123.1.a
    text: een school;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel123
  - number: 123.1.b
    text: een scholengemeenschap; of
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel123
  - number: 123.1.c
    text: |-
      een nieuw te vormen profiel als bedoeld in [artikel 18, derde lid][ref1], aan een al bekostigde school voor vbo.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel18
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '18'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '123.2'
    text: |-
      Indien het bevoegd gezag het voornemen heeft om een aanvraag, bedoeld in het eerste lid, in te dienen, meldt het
      bevoegd gezag dit aan Onze Minister voor 1 juli voorafgaand aan die voorgenomen aanvraag. Bij ministeriële regeling
      kunnen nadere regels worden gesteld aan de wijze waarop deze melding plaatsvindt en kan een model voor de melding
      worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel123
  - number: '123.3'
    text: |-
      De inspectie adviseert Onze Minister of de aanvraag, bedoeld in het eerste lid, voldoet aan de verplichtingen,
      bedoeld in [artikel 124, tweede lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel124
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '124'
        paragraaf: '1'
        afdeling: I
  - number: '123.4'
    text: 'Onze Minister controleert of de belangstellingsmeting juist en volledig is en besluit voor 1 juni:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel123
  - number: 123.4.a
    text: |-
      met inachtneming van [artikel 120, eerste, tweede en vierde lid][ref1], en [121][ref2], op de aanvraag als bedoeld
      in het eerste lid, of de school, scholengemeenschap, nevenvestiging of nieuw te vormen profiel met ingang van
      1 augustus van het kalenderjaar volgend op het besluit van Onze Minister voor bekostiging in aanmerking wordt
      gebracht; of


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel120
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel121
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '120'
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '121'
        paragraaf: '1'
        afdeling: I
  - number: 123.4.b
    text: |-
      met inachtneming van [artikel 120, derde lid][ref1], op een aanvraag als bedoeld in
      [artikel 122, eerste lid of tweede lid][ref2], of de openbare school of scholengemeenschap met ingang van
      1 augustus van het kalenderjaar volgend op het besluit van Onze Minister voor bekostiging in aanmerking wordt
      gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel120
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel122
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel123
    references:
      - id: ref1
