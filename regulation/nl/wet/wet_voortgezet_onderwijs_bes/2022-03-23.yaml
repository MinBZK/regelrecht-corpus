  - number: 124.2.c
    text: |-
      een document waaruit blijkt dat het openbaar lichaam van het eiland van de beoogde plaats van vestiging en de
      bevoegd gezagsorganen binnen het voedingsgebied van de school of scholengemeenschap zijn gevraagd om te overleggen
      over het voornemen tot het doen van een aanvraag om bekostiging; en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel124
  - number: 124.2.d
    text: |-
      een verklaring omtrent het gedrag afgegeven volgens de
      [Wet justitiële documentatie en op de verklaringen omtrent het gedrag BES][ref1] van de personen die het bestuur
      en het intern toezicht vormen en die op het tijdstip van het doen van de aanvraag niet ouder is dan zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0028258
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0028258
  - number: '124.3'
    text: 'De aanvraag bevat tevens:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel124
  - number: 124.3.a
    text: een beschrijving van het beleid met betrekking tot de bewaking en verbetering van de kwaliteit van het onderwijs;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel124
  - number: 124.3.b
    text: een beschrijving van de beoogde samenstelling van de formatie van de school of scholengemeenschap;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel124
  - number: 124.3.c
    text: |-
      een beschrijving van de wijze waarop invulling wordt gegeven aan de voorschriften die worden gesteld aan de
      bekwaamheid van voorschriften die worden gesteld aan de bekwaamheid van de leraren, onderwijsondersteunende
      functionarissen, de rector, directeur, conrector of adjunct-directeur;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel124
  - number: 124.3.d
    text: |-
      een beschrijving van de wijze waarop invulling wordt gegeven aan de zorg voor de sociale, psychische en fysieke
      veiligheid van leerlingen op school of scholengemeenschap;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel124
  - number: 124.3.e
    text: |-
      een meerjarenbegroting over de eerste drie schooljaren die gebaseerd is op de bekostiging die de school of
      scholengemeenschap zal ontvangen gegeven het aantal te verwachten leerlingen in die periode;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel124
  - number: 124.3.f
    text: de verwachtingen met betrekking tot de huisvesting;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel124
  - number: 124.3.g
    text: |-
      informatie over de hoogte van en het beleid ten aanzien van de vrijwillige geldelijke bijdrage die van de ouders
      zal worden gevraagd en het jaarlijks verwachte totaalbedrag van die bijdragen; en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel124
  - number: 124.3.h
    text: een beschrijving van de wijze waarop uitvoering wordt gegeven aan de medezeggenschap in de school.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel124
  - number: '124.4'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld aan de wijze waarop de aanvraag plaatsvindt en kan
      een model voor de aanvraag worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel124
  - number: 124a.1
    text: 'De belangstellingsmeting wordt uitgevoerd aan de hand van hetzij:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel124a
  - number: 124a.1.a
    text: ouderverklaringen; dan wel
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel124a
  - number: 124a.1.b
    text: in bij ministeriële regeling te bepalen gevallen, een marktonderzoek.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel124a
  - number: 124a.2
    text: 'De belangstellingsmeting:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel124a
  - number: 124a.2.a
    text: |-
      geeft inzicht in het te verwachten aantal leerlingen op 1 januari van het elfde jaar na de indiening van de
      aanvraag, bedoeld in [artikel 123, eerste lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel123
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel124a
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '123'
        paragraaf: '1'
        afdeling: I
  - number: 124a.2.b
    text: |-
      vindt plaats binnen het voedingsgebied dat het eiland omvat van de beoogde plaats van vestiging van de school,
      scholengemeenschap of nevenvestiging.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel124a
  - number: 124a.3
    text: |-
      Het te verwachten aantal leerlingen, bedoeld in het tweede lid, onderdeel a, wordt berekend overeenkomstig de
      formule q = (y/x *100%) * w * z, waarbij:
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel124a
  - number: 124a.3.a
    text: |-
      voor de ouderverklaring geldt: y = aantal leerlingen in de leeftijd van 10 tot en met 12 jaar van wie in de
      ouderverklaring is aangegeven belangstelling te hebben voor de beoogde school, scholengemeenschap of nevenvestiging
      in de aanvraag; x = totaal aantal leerlingen in de leeftijd van 10 tot en met 12 jaar op 1 januari van het jaar
      waarin de aanvraag wordt gedaan in het voedingsgebied, bedoeld in het tweede lid onder b; w = het gemiddelde van
      het aantal leerlingen in de leeftijd van 12 jaar en in de leeftijd van 13 jaar in het voedingsgebied, bedoeld in
      het tweede lid onder b, op 1 januari van het elfde jaar na de indiening van de aanvraag, gebaseerd op gegevens
      onder meer verstrekt door het Centraal Bureau voor de Statistiek, vermenigvuldigd met een bij ministeriële
      regeling te bepalen aantal verblijfsjaren, die de landelijke verhouding tussen het totaal aantal leerlingen en het
      aantal leerlingen in leerjaar 1 weergeeft van de schoolsoort, schoolsoorten of nevenvestiging waarop de aanvraag
      betrekking heeft; z = een bij ministeriële regeling te bepalen correctiefactor.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel124a
  - number: 124a.3.b
    text: |-
      voor het marktonderzoek geldt: y = aantal leerlingen in de leeftijd van 10 tot en met 12 jaar van wie in het
      marktonderzoek is aangegeven belangstelling te hebben voor de beoogde school, scholengemeenschap of nevenvestiging
      in de aanvraag; x = totaal aantal leerlingen in de leeftijd van 10 tot en met 12 jaar die aan het marktonderzoek
      heeft deelgenomen; w = het gemiddelde van het aantal leerlingen in de leeftijd van 12 jaar en in de leeftijd
      van 13 jaar in het voedingsgebied, bedoeld in het tweede lid onder b, op 1 januari van het elfde jaar na de
      indiening van de aanvraag, gebaseerd op gegevens onder meer verstrekt door het Centraal Bureau voor de Statistiek,
      vermenigvuldigd met een bij ministeriële regeling te bepalen aantal verblijfsjaren, die de landelijke verhouding
      tussen het totaal aantal leerlingen en het aantal leerlingen in leerjaar 1 weergeeft van de schoolsoort,
      schoolsoorten of nevenvestiging waarop de aanvraag betrekking heeft; z = een bij ministeriële regeling te bepalen
      correctiefactor.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel124a
  - number: 124a.4
    text: |-
      De ouderverklaring, bedoeld in het eerste lid, heeft betrekking op één leerling in de leeftijd van 10 tot en met
      12 jaar op 1 november van het kalenderjaar waarin de aanvraag wordt gedaan en wordt ingediend door de ouder van
      deze leerling.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel124a
  - number: 124a.5
    text: 'Het marktonderzoek, bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel124a
  - number: 124a.5.a
    text: heeft betrekking op leerlingen in de leeftijd van 10 tot en met 12 jaar;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel124a
  - number: 124a.5.b
    text: |-
      wordt afgenomen onder de ouders van leerlingen, bedoeld in onderdeel a, op een wetenschappelijk verantwoorde manier
      door een onafhankelijk onderzoeksbureau dat aantoonbaar werkt volgens een door een brancheorganisatie opgestelde
      gedragscode met betrekking tot de uitvoering van marktonderzoek;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel124a
  - number: 124a.5.c
    text: |-
      wordt uitgevoerd aan de hand van een aselecte steekproef uit de leerlingen, bedoeld in onderdeel a, die aantoonbaar
      representatief is voor die leerlingen; en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel124a
  - number: 124a.5.d
    text: mag niet ouder zijn dan 24 maanden voorafgaand aan de uiterste indieningsdatum van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel124a
  - number: 124a.6
    text: |-
      Indien uit de belangstellingsmeting van meer dan één aanvraag blijkt dat de voedingsgebieden, bedoeld in het tweede
      lid, onderdeel b, elkaar overlappen en daardoor de som van de leerlingen voor wie belangstelling is aangetoond
      in het overlappende voedingsgebied groter is dan het totaal aantal leerlingen in het overlappende voedingsgebied,
      worden de aantallen van de leerlingen voor wie belangstelling is aangetoond in het overlappende voedingsgebied
      naar evenredigheid verminderd tot de som van het totaal leerlingen in het overlappende voedingsgebied voor wie
      belangstelling is aangetoond gelijk is aan het totaal aantal leerlingen in het overlappende voedingsgebied.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel124a
  - number: 124a.7
    text: 'Bij ministeriële regeling kunnen nadere regels worden gesteld aan de uitvoering van de belangstellingsmeting over:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel124a
  - number: 124a.7.a
    text: de wijze waarop de belangstellingsmeting wordt uitgevoerd; en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel124a
  - number: 124a.7.b
    text: |-
      de omvang van het marktonderzoek in relatie tot de minimale verhoudingen tussen de verschillende onderdelen van de
      formule voor de belangstellingsmeting, bedoeld in het derde lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel124a
  - number: '125.1'
    text: De bekostiging vangt aan op 1 augustus.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel125
  - number: '125.2'
    text: |-
      De aanspraak op bekostiging op grond van de [artikelen 120][ref1] en [121][ref2] vervalt indien uiterlijk op de
      eerste schooldag na 1 augustus in het kalenderjaar na het besluit van Onze Minister geen onderwijs aan de nieuwe
      school, scholengemeenschap, nevenvestiging of in het nieuwe profiel wordt gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel120
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel121
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '120'
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '121'
        paragraaf: '1'
        afdeling: I
  - number: '125.3'
    text: |-
      In afwijking van het tweede lid en op aanvraag van het bevoegd gezag of het openbaar lichaam van het eiland van
      vestiging van de school, scholengemeenschap of nevenvestiging kan Onze Minister besluiten in bijzondere gevallen de
      aanspraak op bekostiging voor een jaar te handhaven. Indien Onze Minister daartoe besluit, vervalt de aanspraak op
      bekostiging, indien uiterlijk op de eerste schooldag na 1 augustus in het tweede kalenderjaar na het in het tweede
      lid bedoelde besluit geen onderwijs wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel125
  - number: '126.1'
    text: |-
      Onze Minister kan, onder door hem te stellen voorwaarden, voor bekostiging in aanmerking brengen een school die
      wordt opgericht door omzetting van een bekostigde openbare school in een gelijksoortige bijzondere school.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel126
  - number: '126.2'
    text: |-
      Onze Minister brengt voor bekostiging in aanmerking een school die wordt opgericht door omzetting van een
      bekostigde bijzondere school in een gelijksoortige openbare school.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel126
  - number: '126.3'
    text: Een omzetting kan slechts plaatsvinden met ingang van 1 augustus van enig kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel126
  - number: '126.4'
    text: Dit artikel is ook van toepassing op een scholengemeenschap.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel126
  - number: '127.1'
    text: 'Onze Minister kan voor bekostiging in aanmerking brengen een:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel127
  - number: 127.1.a
    text: |-
      school of scholengemeenschap die is ontstaan door samenvoeging van scholen of scholengemeenschappen, indien deze
      binnen hetzelfde openbaar lichaam gevestigd zijn,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel127
  - number: 127.1.b
    text: |-
      scholengemeenschap die is ontstaan door samenvoeging van een scholengemeenschap waarvan een school voor mavo of een
      school voor vbo deel uitmaakt met een instelling als bedoeld in de [Wet educatie en beroepsonderwijs BES][ref1] die
      in hetzelfde openbaar lichaam gevestigd is, of


      [ref1]: https://wetten.overheid.nl/BWBR0028395
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0028395
  - number: 127.1.c
    text: school die door het bevoegd gezag wordt afgesplitst van een scholengemeenschap.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel127
  - number: '127.2'
    text: Een samenvoeging of afsplitsing kan slechts plaatsvinden met ingang van 1 augustus van enig kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel127
  - number: 127a
    text: |-
      Aan een school of scholengemeenschap kan, naast een hoofdvestiging, een nevenvestiging zijn verbonden. Een
      nevenvestiging is gelegen in hetzelfde openbaar lichaam als de hoofdvestiging.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel127a
  - number: 127b.1
    text: |-
      Een school of scholengemeenschap die op grond van [artikel 120][ref1] voor bekostiging in aanmerking is gebracht,
      wordt aangeduid als hoofdvestiging. Een school die op grond van [artikel 121, tweede lid][ref2], voor bekostiging
      in aanmerking is gebracht, wordt onderdeel van de hoofdvestiging.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel120
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel121
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel127b
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '120'
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '121'
        paragraaf: '1'
        afdeling: I
  - number: 127b.2
    text: |-
      Op een hoofdvestiging van een scholengemeenschap kan in elk geval onderwijs worden verzorgd in alle
      leerjaren van de schoolsoorten en in alle profielen als bedoeld in [artikel 18, derde lid][ref1], of
      [artikel 29, derde lid][ref2], die de scholengemeenschap omvat.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel29
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel127b
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '18'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '29'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 127c.1
    text: 'Een nevenvestiging komt tot stand door:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel127c
  - number: 127c.1.a
    text: |-
      een samenvoeging als bedoeld in [artikel 127][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel127
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel127c
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '127'
        paragraaf: '1'
        afdeling: I
  - number: 127c.1.b
    text: |-
      door vorming van een nieuwe nevenvestiging als bedoeld in [artikel 120, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel120
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel127c
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '120'
        paragraaf: '1'
        afdeling: I
  - number: 127c.2
    text: |-
      Op een nevenvestiging kan onderwijs worden verzorgd in dezelfde schoolsoorten, profielen als bedoeld in
      [artikel 18, derde lid][ref1], of [artikel 29, derde lid][ref2], en leerjaren als op de hoofdvestiging.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel29
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel127c
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '18'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '29'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 127d
    text: De aanspraak op bekostiging blijft bestaan indien het bevoegd gezag binnen de grenzen van het openbaar lichaam
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel127d
  - number: 127d.a
    text: een vestiging verplaatst, of
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel127d
  - number: 127d.b
    text: |-
      een deel van het onderwijsaanbod op een vestiging verplaatst naar een andere vestiging van dezelfde school of
      scholengemeenschap.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel127d
  - number: 127e
    text: |-
      Onze Minister kan onder door hem nader te stellen voorwaarden aanvullende middelen ter beschikking stellen die
      niet strekken tot bekostiging van het onderwijs, bedoeld in deze wet, maar die direct of indirect dienstig zijn
      voor de uitvoering van het onderwijs of voor verhoging van de mogelijkheid tot deelname aan het onderwijs. Bij
      de toepassing van dit artikel zijn de [titels 4.1][ref1] en [4.2 van de Algemene wet bestuursrecht][ref2] en de
      [artikelen 4][ref3], [5][ref4], [9][ref5] en [10 van de Wet overige OCW-subsidies][ref6] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537
      [ref3]: https://wetten.overheid.nl/BWBR0009458#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0009458#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0009458#Artikel9
      [ref6]: https://wetten.overheid.nl/BWBR0009458#Artikel10
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel127e
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0005537
      - id: ref3
        bwb_id: BWBR0009458
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0009458
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0009458
        artikel: '9'
      - id: ref6
        bwb_id: BWBR0009458
        artikel: '10'
  - number: 127f
    text: |-
      In afwijking van [artikel 7, eerste lid, van de Wet administratieve rechtspraak BES][ref1] kan een belanghebbende
      beroep instellen bij het Gemeenschappelijke Hof van Justitie van Aruba, Curaçao, Sint Maarten en van Bonaire,
      Sint Eustatius en Saba tegen een besluit op grond van deze afdeling met uitzondering van [artikel 127e][ref2]. De
      [artikelen 54][ref3] en [55 van de Wet administratieve rechtspraak BES][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel127e
      [ref3]: https://wetten.overheid.nl/BWBR0028455#Artikel54
      [ref4]: https://wetten.overheid.nl/BWBR0028455#Artikel55
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel127f
    references:
      - id: ref1
        bwb_id: BWBR0028455
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0030284
        artikel: 127e
        paragraaf: '3'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0028455
        artikel: '54'
      - id: ref4
        bwb_id: BWBR0028455
        artikel: '55'
  - number: 127g
    text: Bij ministeriële regeling kunnen nadere regels worden vastgesteld voor de uitvoering van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel127g
  - number: '128'
    text: |-
      De [artikelen 129 tot en met 147][ref1] zijn slechts van toepassing op scholen voor voorbereidend wetenschappelijk
      onderwijs, voor hoger en middelbaar algemeen voortgezet onderwijs, voor voorbereidend beroepsonderwijs en voor
      praktijkonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel129
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '129'
        afdeling: II
  - number: '129.1'
    text: |-
      De eilandsraad of het bestuurscollege draagt overeenkomstig het bepaalde in dit hoofdstuk ten behoeve van de
      scholen zorg voor de voorzieningen in de huisvesting op het grondgebied van het openbaar lichaam. Deze huisvesting
      is zodanig dat kan worden voldaan aan de redelijke eisen die het onderwijs aan de huisvesting van scholen in het
      openbaar lichaam stelt. De eilandsraad of het bestuurscollege behandelt daarbij de door het openbaar lichaam in
      stand gehouden scholen en de andere scholen op gelijke voet.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel129
  - number: '129.2'
    text: |-
      Bij algemene maatregel van bestuur worden bruto vloeroppervlakten per gelijktijdig aanwezige leerling
      voorgeschreven die voorzieningen in de huisvesting ten minste dienen te bevatten. Deze oppervlakten kunnen per
      schoolsoort verschillend worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel129
  - number: '130.1'
    text: 'Voor de toepassing van dit hoofdstuk worden onder voorzieningen in de huisvesting begrepen:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel130
  - number: 130.1.a
    text: 'voor blijvend onderscheidenlijk voor tijdelijk gebruik bestemde voorzieningen, bestaande uit:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel130
  - number: 130.1.a.1°
    text: |-
      nieuwbouw, een bestaand gebouw of een gedeelte daarvan, verplaatsing van een bestaand gebouw of van een gedeelte
      daarvan, terreinen, alsmede eerste aanschaf van leer- en hulpmiddelen en meubilair,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel130
  - number: 130.1.a.2°
    text: uitbreiding van de onder 1° bedoelde voorzieningen, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel130
  - number: 130.1.a.3°
    text: medegebruik van een ruimte die geschikt is voor het onderwijs;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel130
  - number: 130.1.b
    text: herstel van constructiefouten aan het gebouw of het terrein;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel130
  - number: 130.1.c
    text: |-
      herstel en vervanging in verband met schade aan gebouw, leer- en hulpmiddelen en meubilair in geval van bijzondere
      omstandigheden.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel130
  - number: '130.2'
    text: De kosten van bouwvoorbereiding kunnen tot de kosten van huisvesting worden gerekend.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel130
  - number: '131.1'
    text: |-
      Het bestuurscollege stelt jaarlijks, na overleg met de betrokken bevoegde gezagsorganen, ten behoeve van het
      eerstvolgende jaar voor een door hem te bepalen tijdstip een bekostigingsplafond vast voor de bekostiging van de
      voorzieningen in de huisvesting voor:
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel131
  - number: 131.1.a
    text: |-
      basisscholen als bedoeld in de [Wet primair onderwijs BES][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0030280
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0030280
  - number: 131.1.b
    text: |-
      scholen voor voorbereidend wetenschappelijk onderwijs, voor hoger en middelbaar algemeen voortgezet onderwijs, voor
      voorbereidend beroepsonderwijs en voor praktijkonderwijs.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel131
  - number: '131.2'
    text: |-
      Het bekostigingsplafond wordt zodanig vastgesteld dat redelijkerwijs kan worden voorzien in de huisvesting van de
      in het eerste lid bedoelde scholen op het grondgebied van het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel131
  - number: '132.1'
    text: |-
      Het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school dat een voorziening in de
      huisvesting wenst, dient een aanvraag voor 1 september voorafgaand aan het jaar waarop de aanvraag betrekking heeft
      in bij het bestuurscollege.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel132
  - number: '132.2'
    text: De eilandsraad stelt bij verordening de vereisten van de aanvraag vast.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel132
  - number: '132.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op de door het openbaar lichaam in stand gehouden
      scholen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel132
  - number: '133.1'
    text: |-
      Het bestuurscollege beslist voor 1 januari van het jaar waarop de aanvraag betrekking heeft op de aanvraag.
      Het bestuurscollege geeft het bevoegd gezag de gelegenheid om een onvolledige aanvraag binnen een door het
      bestuurscollege te stellen termijn aan te vullen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel133
  - number: '133.2'
    text: 'Het bestuurscollege kan besluiten de aanvraag niet te behandelen, indien:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel133
  - number: 133.2.a
    text: |-
      het bevoegd gezag niet heeft voldaan aan de vereisten voor het in behandeling nemen van de aanvraag, uit de
      eilandsverordening, bedoeld in [artikel 132, tweede lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel132
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '132'
        afdeling: II
  - number: 133.2.b
    text: |-
      de verstrekte gegevens en bescheiden onvoldoende zijn voor de beoordeling van de aanvraag of voor de voorbereiding
      van de beschikking.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel133
  - number: '133.3'
    text: |-
      Indien het bekostigingsplafond, bedoeld in [artikel 131][ref1], niet toereikend is, wordt de volgorde van de
      verlening van bekostiging bepaald op basis van de urgentie van de gevraagde voorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel131
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '131'
        afdeling: II
  - number: '133.4'
    text: |-
      De beschikking van het bestuurscollege kan een gedeelte van de gewenste voorziening dan wel een andere voorziening
      dan gewenst omvatten.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel133
  - number: '134.1'
    text: |-
      In afwijking van de termijnen genoemd in de [artikelen 132][ref1] en [133][ref2], beslist het bestuurscollege
      binnen vier weken op een aanvraag voor een voorziening in de huisvesting die gelet op de voortgang van het
      onderwijs geen uitstel kan lijden.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel132
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel133
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '132'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '133'
        afdeling: II
  - number: '134.2'
    text: 'Het bestuurscollege wijst de aanvraag af, indien:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel134
  - number: 134.2.a
    text: |-
      de beslissing over de voorziening kan worden genomen met inachtneming van de termijn, bedoeld in
      [artikel 133, eerste lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel133
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '133'
        afdeling: II
  - number: 134.2.b
    text: |-
      een van de weigeringsgronden, genoemd in
      [artikel 135, eerste lid, onderdelen a tot en met d en f, en tweede lid][ref1], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel135
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '135'
        afdeling: II
  - number: '135.1'
    text: 'Een voorziening in de huisvesting wordt slechts geweigerd, indien:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel135
  - number: 135.1.a
    text: |-
      de gewenste voorziening geen voorziening is in de zin van [artikel 130][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel130
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '130'
        afdeling: II
  - number: 135.1.b
    text: |-
      de gewenste voorziening niet gerechtvaardigd is op grond van de aard en de omvang van de voorzieningen waarover de
      school reeds beschikt, voor zover deze uit de openbare kas zijn bekostigd,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel135
  - number: 135.1.c
    text: |-
      de gewenste voorziening niet gerechtvaardigd is op grond van de te verwachten ontwikkeling van het aantal
      leerlingen of onderwijskundige ontwikkelingen,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel135
  - number: 135.1.d
    text: |-
      op andere wijze dan is gewenst redelijkerwijs in de behoefte aan huisvesting kan worden voorzien, onder meer
      doordat binnen redelijke afstand van de gewenste plaats van de voorziening gebruik dan wel medegebruik mogelijk is,
      of een reeds voor bekostiging in aanmerking gebracht gebouw of deel daarvan beschikbaar komt,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel135
  - number: 135.1.e
    text: |-
      het bekostigingsplafond, bedoeld in [artikel 131][ref1], niet toereikend is voor de te verstrekken voorzieningen
      voor scholen als bedoeld in het eerste lid, onderdelen a en b, van dat artikel, of


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel131
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '131'
        afdeling: II
  - number: 135.1.f
    text: de gewenste voorziening anders dan op grond van de onderdelen b tot en met d niet noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel135
  - number: '135.2'
    text: |-
      Een voorziening in de huisvesting kan tevens worden geweigerd, indien de voorziening als gevolg van het verwijtbaar
      nalaten van noodzakelijk onderhoud in een slechte bouwkundige staat verkeert of indien de voorziening nodig is voor
      herstel van schade die is veroorzaakt door schuld of toedoen van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel135
  - number: '136.1'
    text: |-
      Het bestuurscollege beslist met ingang van welk tijdstip de bekostiging van een voorziening daadwerkelijk een
      aanvang kan nemen, onverminderd het bepaalde in [artikel 137][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel137
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '137'
        afdeling: II
  - number: '136.2'
    text: |-
      De aanspraak op bekostiging van een voorziening vervalt, indien niet binnen een bij de beschikking te
      bepalen termijn met betrekking tot de voorziening een bouwopdracht is gegeven dan wel een koop-, huur- of
      erfpachtovereenkomst is gesloten.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel136
  - number: '137'
    text: |-
      Voorzieningen komen voor bekostiging in aanmerking, mits op het op grond van [artikel 136, eerste lid][ref1],
      vastgestelde tijdstip,


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel136
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '136'
        afdeling: II
  - number: 137.a
    text: is voldaan aan de bij of krachtens de wet gestelde voorschriften, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel137
  - number: 137.b
    text: |-
      de feiten en omstandigheden waarin de school verkeert, ten opzichte van de feiten en omstandigheden ten tijde van
      de vaststelling van de beschikking tot verlening niet ingrijpend zijn gewijzigd.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel137
  - number: '138.1'
    text: |-
      Het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school geeft opdracht de voorziening
      in de huisvesting waartoe op grond van de [artikelen 133][ref1] en [134][ref2] kan worden overgegaan, tot stand
      te brengen met daartoe door het openbaar lichaam beschikbaar te stellen gelden, tenzij het met het bestuurscollege
      overeenkomt dat het openbaar lichaam deze voorziening tot stand brengt.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel133
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel134
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '133'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '134'
        afdeling: II
  - number: '138.2'
    text: |-
      Indien het openbaar lichaam de voorziening in de huisvesting van een niet door het openbaar lichaam in stand
      gehouden school tot stand heeft gebracht, worden gebouw en terrein aan het bevoegd gezag in eigendom overgedragen,
      tenzij het bestuurscollege en het bevoegd gezag anders overeenkomen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel138
  - number: '138.3'
    text: |-
      Indien de voorziening in de huisvesting, bedoeld in het tweede lid, niet voldoet aan de eisen voor
      eigendomsoverdracht, geeft het bestuurscollege deze aan het bevoegd gezag in gebruik.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel138
  - number: '139'
    text: |-
      Indien het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school aanspraak heeft op
      bekostiging van een voorziening in de huisvesting, behoeven de bouwplannen en de desbetreffende begrotingen de
      instemming van het bestuurscollege, tenzij het bevoegd gezag met het bestuurscollege overeenkomt dat het openbaar
      lichaam deze voorziening tot stand brengt.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel139
  - number: '140'
    text: |-
      Het openbaar lichaam brengt een voorziening in de huisvesting van een niet door het openbaar lichaam in stand
      gehouden school slechts tot stand, indien tussen het bestuurscollege en het bevoegd gezag overeenstemming bestaat
      over de bouwplannen en de wijze van uitvoering.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel140
  - number: '141.1'
    text: |-
      Het bevoegd gezag is verplicht het gebouw en terrein, alsmede de roerende zaken waarvoor bekostiging wordt genoten,
      behoorlijk te gebruiken en te onderhouden.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel141
  - number: '141.2'
    text: |-
      Vervreemding door het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school anders dan op
      grond van de [artikelen 99][ref1] en [106][ref2], van gebouwen, terreinen en roerende zaken waarvoor bekostiging
      wordt genoten, of bezwaren met een zakelijk recht door het bevoegd gezag van een niet door het openbaar lichaam in
      stand gehouden school van zodanige gebouwen en terreinen is zonder toestemming van het bestuurscollege nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel106
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '99'
        hoofdstuk: II
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '106'
        hoofdstuk: III
        afdeling: I
  - number: '141.3'
    text: |-
      Het tweede lid is niet van toepassing ten aanzien van het recht van opstal ten behoeve van een door het openbaar
      lichaam te plaatsen tijdelijke voorziening in de huisvesting op grond die eigendom is van het bevoegd gezag van de
      betrokken school.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel141
  - number: '142.1'
    text: |-
      Het bestuurscollege is bevoegd een gedeelte van een gebouw of terrein dat tijdelijk of gedurende een gedeelte
      van de dag niet nodig zal zijn voor de daar gevestigde school, gedurende die tijd te bestemmen als huisvesting
      voor een andere school, voor ander uit de openbare kas bekostigd onderwijs niet zijnde voortgezet onderwijs,
      of voor educatie als bedoeld in de [Wet educatie en beroepsonderwijs BES][ref1] dan wel voor andere culturele,
      maatschappelijke of recreatieve doeleinden. Het voorgenomen gebruik dient zich te verdragen met het onderwijs
      aan de in het gebouw gevestigde school. Tevens is het bestuurscollege bevoegd ten behoeve van het onderwijs in
      lichamelijke opvoeding of expressie-activiteiten een gebouw of terrein dan wel een gedeelte daarvan dat tijdelijk
      gedurende gedeelten van de dag of in het geheel niet nodig zal zijn voor de daar gevestigde school, gedurende die
      tijd te bestemmen als huisvesting voor een andere school, voor ander uit de openbare kas bekostigd onderwijs, niet
      zijnde voortgezet onderwijs, of voor educatie als bedoeld in de Wet educatie en beroepsonderwijs BES dan wel voor
      andere culturele, maatschappelijke of recreatieve doeleinden. Het bestuurscollege is bevoegd een sportterrein,
      buiten de tijden dat het terrein voor het voortgezet onderwijs wordt gebruikt, gedurende die tijd te bestemmen voor
      culturele, maatschappelijke of recreatieve doeleinden, op zodanige wijze dat het zich verdraagt met het onderwijs
      dat op het terrein wordt gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0028395
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0028395
  - number: '142.2'
    text: |-
      Indien het gebouw of terrein in gebruik is voor een niet door het openbaar lichaam in stand gehouden school, pleegt
      het bestuurscollege vooraf overleg met het bevoegd gezag en, voor zover van toepassing, ook met het bevoegd gezag
      van de andere school of nevenvestiging waarvoor de huisvesting is bestemd.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel142
  - number: '143.1'
    text: |-
      Voor zover [artikel 142][ref1] geen toepassing vindt, kan het bevoegd gezag een gedeelte van een gebouw
      of terrein in gebruik geven ten behoeve van uit de openbare kas bekostigd onderwijs dan wel voor andere
      culturele, maatschappelijke of recreatieve doeleinden. Voor zover niet nodig voor uit de openbare kas bekostigd
      onderwijs, kan het bevoegd gezag een gedeelte van het gebouw of terrein verhuren aan een derde, voor zover
      het gehuurde niet bestemd zal zijn als woon- of bedrijfsruimte in de zin van de vijfde en zesde afdeling van
      [titel 4 van Boek 7 van het Burgerlijk Wetboek][ref2]. Indien het een niet door het openbaar lichaam in stand
      gehouden school betreft, is voor verhuur toestemming van het bestuurscollege vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel142
      [ref2]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '142'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0005290
  - number: '143.2'
    text: 'De ingebruikgeving of verhuur ingevolge het eerste lid eindigt:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel143
  - number: 143.2.a
    text: |-
      indien het bestuurscollege gebruik maakt van zijn bevoegdheid op grond van [artikel 142][ref1] zonder dat enige
      schadeplicht ontstaat, of


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel142
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '142'
        afdeling: II
  - number: 143.2.b
    text: indien het in gebruik gegeven dan wel verhuurde deel nodig is voor gebruik door de eigen school.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel143
  - number: '143.3'
    text: |-
      Ingebruikgeving of verhuur ingevolge het eerste lid geschiedt niet indien het voorgenomen gebruik zich niet
      verdraagt met het onderwijs aan de in het gebouw gevestigde school.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel143
  - number: '143.4'
    text: |-
      Op de ingebruikgeving en verhuur ingevolge het eerste lid is
      [artikel 230a van Boek 7 van het Burgerlijk Wetboek][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel230a
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 230a
  - number: '143.5'
    text: |-
      Het zonder toestemming van het bestuurscollege verhuren van een gebouw of terrein door het bevoegd gezag van een
      niet door het openbaar lichaam in stand gehouden school alsmede elk met dit artikel strijdig beding opgenomen in
      een huurovereenkomst met betrekking tot schoolgebouwen, is nietig.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel143
  - number: '144'
    text: |-
      Voorzieningen aan gebouwen of terreinen in verband met verhuur krachtens de [artikelen 143][ref1] of [145][ref2]
      door het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school, komen niet ten laste van
      het openbaar lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel143
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel145
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel144
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '143'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '145'
        afdeling: II
  - number: '145.1'
    text: |-
      Het bestuurscollege en het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school dat
      eigenaar is van het gebouw en terrein kunnen in een gezamenlijke akte verklaren dat het bevoegd gezag blijvend
      heeft opgehouden dan wel blijvend zal ophouden het gebouw of terrein of een voor eigendomsoverdracht vatbaar
      gedeelte daarvan, voor de school te gebruiken.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel145
  - number: '145.2'
    text: |-
      Bij toepassing van het eerste lid stellen het bestuurscollege en het bevoegd gezag van de desbetreffende school
      gezamenlijk vast of voorzieningen in een slechte bouwkundige staat verkeren als gevolg van het verwijtbaar nalaten
      van noodzakelijk onderhoud. Indien dat het geval is, vindt verrekening plaats van de daarmee gemoeide kosten.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel145
  - number: '145.3'
    text: |-
      De eilandsraad en het bevoegd gezag van de niet door het openbaar lichaam in stand gehouden school treffen
      gezamenlijk een voorziening voor het beslechten van geschillen die zich bij de toepassing van het tweede lid
      voordoen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel145
  - number: '145.4'
    text: |-
      De Rijksvertegenwoordiger kan in geval van een geschil omtrent de toepassing van het eerste lid desgevraagd
      besluiten dat het bevoegd gezag blijvend heeft opgehouden dan wel blijvend zal ophouden het gebouw of terrein of
      een voor eigendomsoverdracht vatbaar gedeelte daarvan, voor de school te gebruiken. De aanvraag om het besluit
      wordt gedaan door het bestuurscollege of door het bevoegd gezag van de school.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel145
  - number: '145.5'
    text: |-
      Het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school dat voornemens is gebouwen
      of terreinen, of een gedeelte daarvan, blijvend niet meer voor de school te gebruiken, doet hiervan onverwijld
      mededeling aan het bestuurscollege.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel145
  - number: '145.6'
    text: |-
      Zodra de in het eerste lid bedoelde akte door beide partijen is getekend, of het in het vierde lid bedoelde besluit
      van de Rijksvertegenwoordiger onherroepelijk is geworden dan wel in beroep is bepaald dat de uitspraak van de
      rechter, inhoudende een besluit als bedoeld in het vierde lid eerste volzin, in de plaats treedt van het vernietigde
      besluit, wordt de akte, het onherroepelijk geworden besluit onderscheidenlijk de uitspraak, ingeschreven in de
      openbare registers, bedoeld in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek BES][ref1]. Door de
      inschrijving verkrijgt het openbaar lichaam de eigendom.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Afdeling2
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel145
    references:
      - id: ref1
        bwb_id: BWBR0028745
        afdeling: '2'
  - number: '145.7'
    text: |-
      Het bestuurscollege en het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school dat
      eigenaar is van het schoolgebouw, kunnen in een gezamenlijke akte verklaren dat een gedeelte van het gebouw dat
      niet vatbaar is voor eigendomsoverdracht, blijvend niet meer voor het onderwijs nodig zal zijn.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel145
  - number: '145.8'
    text: |-
      De Rijksvertegenwoordiger kan in geval van een geschil omtrent de toepassing van het zevende lid desgevraagd
      besluiten dat een gedeelte van het gebouw dat niet vatbaar is voor eigendomsoverdracht, blijvend niet meer voor
      het onderwijs nodig zal zijn. De aanvraag om het besluit wordt gedaan door het bestuurscollege of door het bevoegd
      gezag van de school. Alvorens op de aanvraag te besluiten, hoort de Rijksvertegenwoordiger de wederpartij.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel145
  - number: '145.9'
    text: |-
      Zodra de in het zevende lid bedoelde akte door beide partijen is getekend, of het in het achtste lid bedoelde
      besluit van de Rijksvertegenwoordiger onherroepelijk is geworden dan wel in beroep is bepaald dat de uitspraak
      van de rechter, inhoudende een beslissing als bedoeld in het achtste lid eerste volzin, in de plaats treedt van
      het vernietigde besluit, kan het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school het
      desbetreffende gedeelte van het gebouw met toestemming van het bestuurscollege verhuren.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel145
  - number: '145.10'
    text: |-
      De toestemming, bedoeld in het negende lid, wordt verleend voor een tijdvak van ten hoogste 3 jaren. Op verzoek van
      het bevoegd gezag kan dit tijdvak telkens worden verlengd met een termijn van ten hoogste 3 jaren.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel145
  - number: '145.11'
    text: |-
      Op de verhuur, bedoeld in het negende lid, is [artikel 230a van Boek 7 van het Burgerlijk Wetboek][ref1] niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel230a
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel145
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 230a
  - number: '146'
    text: |-
      In afwijking van dit hoofdstuk kan de eilandsraad besluiten dat jaarlijks een bedrag voor huisvestingskosten wordt
      betaald aan het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school voor zover die op het
      grondgebied van dat openbaar lichaam in stand wordt gehouden. De eilandsraad neemt het besluit in overeenstemming
      met het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel146
  - number: '147'
    text: |-
      Het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school is gehouden aan de eilandsraad
      onderscheidenlijk het bestuurscollege alle inlichtingen te verschaffen die de eilandsraad onderscheidenlijk het
      bestuurscollege voor een adequate uitvoering van de bepalingen in dit hoofdstuk noodzakelijk achten.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel147
  - number: '148.1'
    text: |-
      Het Rijk bekostigt met inachtneming van deze afdeling de scholen, bedoeld in [afdeling I van titel II][ref1].
      De uitgaven, bedoeld in de [artikelen 160][ref2] en [162][ref3], alsmede de bedragen die het openbaar lichaam
      krachtens deze wet in aanvulling op de rijksbekostiging verstrekt, blijven ten laste van het openbaar lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#AfdelingI
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel160
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel162
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel148
    references:
      - id: ref1
        bwb_id: BWBR0030284
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '160'
        hoofdstuk: III
        paragraaf: '3'
        afdeling: III
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '162'
        hoofdstuk: III
        paragraaf: '3'
        afdeling: III
  - number: '148.2'
    text: |-
      Aan niet door het openbaar lichaam in stand gehouden scholen als bedoeld in [afdeling I van titel II][ref1] wordt
      uit de openbare kas geen bekostiging verstrekt dan krachtens de bepalingen van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#AfdelingI
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel148
    references:
      - id: ref1
        bwb_id: BWBR0030284
        afdeling: I
  - number: '148.3'
    text: |-
      Voor de toepassing van deze afdeling zijn de voorschriften die betrekking hebben op bijzondere scholen, van
      overeenkomstige toepassing op openbare scholen die in stand worden gehouden door een stichting als bedoeld in
      [artikel 98][ref1] of een openbare rechtspersoon als bedoeld in [artikel 97][ref2], tenzij het tegendeel blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel98
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel97
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel148
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '98'
        hoofdstuk: II
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '97'
        hoofdstuk: II
        afdeling: I
  - number: '149.1'
    text: Het Rijk bekostigt openbare en bijzondere scholen voor zorg voor leerlingen met een specifieke onderwijsbehoefte.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel149
  - number: '149.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven ter uitvoering van het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel149
  - number: '150.1'
    text: Onze Minister verstrekt het expertisecentrum onderwijszorg subsidie.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel150
  - number: '150.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gegeven over het verstrekken van subsidie aan het expertisecentrum
      onderwijszorg voor de taken, bedoeld in [artikel 69, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel69
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel150
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '69'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
  - number: '150.3'
    text: |-
      De [titels 4.1][ref1] en [4.2 van de Algemene wet bestuursrecht][ref2] en de [artikelen 4][ref3], [5][ref4],
      [9][ref5] en [10 van de Wet overige OCW-subsidies][ref6] zijn van toepassing op de subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537
      [ref3]: https://wetten.overheid.nl/BWBR0009458#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0009458#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0009458#Artikel9
      [ref6]: https://wetten.overheid.nl/BWBR0009458#Artikel10
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel150
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0005537
      - id: ref3
        bwb_id: BWBR0009458
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0009458
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0009458
        artikel: '9'
      - id: ref6
        bwb_id: BWBR0009458
        artikel: '10'
  - number: '152.1'
    text: 'De bekostiging voor een school bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel152
  - number: 152.1.a
    text: een bedrag per school; en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel152
  - number: 152.1.b
    text: een bedrag per leerling, waarbij onderscheid kan worden gemaakt naar schoolsoort, leerjaar, leerweg of profiel.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel152
  - number: '152.2'
    text: |-
      De bekostiging is bestemd voor kosten voor personeel en exploitatie van een school. De bekostiging wordt per school
      berekend aan de hand van een bij of krachtens algemene maatregel van bestuur vastgestelde berekeningswijze.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel152
  - number: '152.3'
    text: 'De bekostiging wordt verstrekt voor:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel152
  - number: 152.3.a
    text: salarissen, toelagen, uitkeringen en vergoedingen voor het personeel;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel152
  - number: 152.3.b
    text: bijdragen voor het pensioen voor het personeel en dat van de nagelaten betrekkingen;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel152
  - number: 152.3.c
    text: |-
      kosten wegens voorschriften die zijn gegeven bij of krachtens de [Ambtenarenwet BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028215
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0028215
  - number: 152.3.d
    text: onderhoud van het gebouw en het terrein;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel152
  - number: 152.3.e
    text: energie- en waterverbruik;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel152
  - number: 152.3.f
    text: |-
      middelen waaronder mede wordt verstaan lesmateriaal als bedoeld in [artikel 12][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel12
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '12'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 152.3.g
    text: administratie, beheer en bestuur;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel152
  - number: 152.3.h
    text: loopbaanoriëntatie en -begeleiding;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel152
  - number: 152.3.i
    text: schoonmaken van het gebouw en het terrein; en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel152
  - number: 152.3.j
    text: publiekrechtelijke heffingen, met uitzondering van belastingen ter zake van onroerende zaken.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel152
  - number: '153.1'
    text: |-
      Onze Minister stelt de hoogte van de bekostiging zodanig vast dat zij voldoet aan de redelijke behoeften van een in
      normale omstandigheden verkerende school.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel153
  - number: '153.2'
    text: |-
      Bij ministeriële regeling worden jaarlijks voor 1 oktober de bedragen, bedoeld in [artikel 152, eerste lid][ref1],
      vastgesteld en worden regels gesteld over de termijnen van de betaling daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel152
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel153
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '152'
        hoofdstuk: II
        afdeling: III
  - number: '153.3'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald in welke gevallen en onder welke voorwaarden aanvullende
      bekostiging kan worden toegekend.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel153
  - number: '153.4'
    text: De vastgestelde bedragen gelden voor het kalenderjaar volgend op het tijdstip van vaststelling.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel153
  - number: '153.5'
    text: |-
      Bij de vaststelling van de bedragen, bedoeld in [artikel 152, eerste lid][ref1], of bij tussentijdse aanpassing
      van die bedragen, worden volgens bij ministeriële regeling te stellen regels loon- en prijsontwikkelingen verwerkt,
      tenzij de toestand van 's Rijks financiën zich daartegen verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel152
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel153
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '152'
        hoofdstuk: II
        afdeling: III
  - number: '154'
    text: |-
      Bij het bepalen van de hoogte van de bekostiging, bedoeld in [artikel 152][ref1], gaat Onze Minister, volgens
      daarover bij of krachtens algemene maatregel van bestuur gestelde regels, uit van het aantal leerlingen van de
      school op 1 oktober van het jaar voorafgaand aan het jaar waarop de bekostiging betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel152
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel154
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '152'
        hoofdstuk: II
        afdeling: III
  - number: '155.1'
    text: |-
      Indien bijzondere ontwikkelingen in het voortgezet onderwijs daartoe aanleiding geven, kunnen bij ministeriële
      regeling regels worden gesteld over het verstrekken van aanvullende bekostiging.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel155
  - number: '155.2'
    text: |-
      Onze Minister kan in verband met de in het eerste lid bedoelde bekostiging een bekostigingsplafond vaststellen. In
      dat geval worden bij ministeriële regeling regels gesteld over de verdeling.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel155
  - number: '156.1'
    text: |-
      Indien bijzondere omstandigheden van een school daartoe aanleiding geven, kan Onze Minister aanvullende bekostiging
      verstrekken.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel156
  - number: '156.2'
    text: 'De verstrekking vindt plaats:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel156
  - number: 156.2.a
    text: op aanvraag van het bevoegd gezag;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel156
  - number: 156.2.b
    text: indien nodig onder het verbinden van verplichtingen aan het bevoegd gezag aan de verstrekking; en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel156
  - number: 156.2.c
    text: voor een bepaalde periode.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel156
  - number: '156.3'
    text: |-
      De aanvraag wordt ingediend in het kalenderjaar waarin de bijzondere omstandigheden zich aandienden. Onze Minister
      beslist binnen vier maanden na ontvangst van de aanvraag. Indien de beschikking niet binnen vier maanden kan
      worden gegeven, stelt Onze Minister de aanvrager daarvan in kennis en noemt hij daarbij een termijn waarbinnen de
      beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel156
  - number: '156.4'
    text: |-
      Onze Minister kan in verband met de in het eerste lid bedoelde bekostiging een bekostigingsplafond vaststellen. In
      dat geval worden bij ministeriële regeling regels gesteld over de verdeling.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel156
  - number: '158'
    text: |-
      Het openbaar lichaam bekostigt aan het bevoegd gezag van een niet door het
      openbaar lichaam in stand gehouden school dat is onderworpen aan een of meer der in
      [artikel 43 van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref1] bedoelde belastingen ter
      zake van onroerende zaken het bedrag dat is uitgegeven voor de belastingen met betrekking tot de in het openbaar
      lichaam gelegen gebouwen en terreinen.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel43
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel158
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '43'
  - number: '160.1'
    text: |-
      Indien in een openbaar lichaam uitsluitend een of meer andere rechtspersonen dan het openbaar lichaam openbare
      scholen in stand houden dan wel openbare scholen ontbreken en het openbaar lichaam uitgaven wil doen voor het
      desbetreffende onderwijs welke niet door het Rijk worden bekostigd, stelt de eilandsraad bij eilandsverordening een
      regeling daarvoor vast en zijn de [artikelen 163 tot en met 165][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel163
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '163'
        hoofdstuk: III
        paragraaf: '4'
        afdeling: III
  - number: '160.2'
    text: |-
      De regeling, bedoeld in het eerste lid, maakt geen onderscheid tussen openbaar en bijzonder onderwijs en voorziet
      in een behandeling van scholen naar dezelfde maatstaf.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel160
  - number: '160.3'
    text: |-
      De regeling, bedoeld in het eerste lid, bevat in elk geval de voorzieningen die door het bevoegd gezag van een in
      het openbaar lichaam gelegen, niet door het openbaar lichaam in stand gehouden school kunnen worden aangevraagd en
      de procedure voor het doen van een aanvraag.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel160
  - number: '160.4'
    text: |-
      De eilandsraad kan besluiten dat het bestuurscollege de regeling, bedoeld in het eerste lid, tijdelijk kan
      aanvullen met nieuwe voorzieningen. De aanvulling wordt binnen 1 week aan de bevoegde gezagsorganen van de
      niet door het openbaar lichaam in stand gehouden scholen gezonden. Binnen 12 weken na de totstandkoming van de
      aanvulling wordt deze voorgelegd aan de eilandsraad en besluit de eilandsraad over de bekrachtiging ervan. Indien
      de eilandsraad niet binnen 12 weken een besluit heeft genomen, wordt de aanvulling gelijkgesteld met een aanvulling
      die is bekrachtigd. Een afwijzing van de aanvulling door de eilandsraad heeft geen gevolgen voor aanvragen waarop
      reeds is besloten of die reeds zijn ingediend en die voorzieningen betreffen waarop de aanvulling betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel160
  - number: '160.5'
    text: |-
      Voor de toepassing van dit artikel wordt een nevenvestiging aangemerkt als een nevenvestiging die is gelegen in het
      openbaar lichaam van de hoofdvestiging. De eilandsraad kan in de eilandsverordening, bedoeld in het eerste lid, aan
      het bestuurscollege de bevoegdheid verlenen om, met inachtneming van de in die eilandsverordening gestelde regels,
      te besluiten dat in het openbaar lichaam gelegen nevenvestigingen van scholen waarvan de hoofdvestiging is gelegen
      in een ander openbaar lichaam in afwijking van de eerste volzin in aanmerking komen voor een of meer van de in de
      regeling genoemde voorzieningen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel160
  - number: '160.6'
    text: |-
      Het bestuurscollege maakt jaarlijks in een van overheidswege uitgegeven blad of een dag-, nieuws- of huis-aan-
      huisblad, dan wel op een andere geschikte wijze, een overzicht bekend van de op grond van de regeling, bedoeld in
      het eerste lid, toegekende voorzieningen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel160
  - number: '162.1'
    text: |-
      Indien een openbaar lichaam zelf een of meer openbare scholen in stand houdt en hij uitgaven wil doen ten
      behoeve van het voorbereidend wetenschappelijk onderwijs, het algemeen voortgezet onderwijs, het voorbereidend
      beroepsonderwijs of het praktijkonderwijs welke niet door het Rijk worden bekostigd, kan de eilandsraad daarvoor
      bij eilandsverordening een regeling vaststellen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel162
  - number: '162.2'
    text: |-
      [Artikel 160, tweede tot en met zesde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel160
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel162
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '160'
        hoofdstuk: III
        paragraaf: '3'
        afdeling: III
  - number: '163.1'
    text: |-
      Indien een openbaar lichaam een of meer scholen in stand houdt, stelt het bestuurscollege jaarlijks met betrekking
      tot die scholen voorlopig vast:
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel163
  - number: 163.1.a
    text: |-
      het totaal van de bedragen die in het voorafgaande kalenderjaar zijn uitgegeven ten behoeve van de
      personeelskosten,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel163
  - number: 163.1.b
    text: |-
      het totaal van de bedragen die in het voorafgaande kalenderjaar zijn uitgegeven ten behoeve van de
      exploitatiekosten,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel163
  - number: 163.1.c
    text: |-
      het totaal van de ontvangen bekostiging, bedoeld in [artikel 152][ref1], en de bedragen die krachtens
      [artikel 172, tweede lid, tweede volzin][ref2] voor personeel of voorzieningen in de exploitatie worden aangewend,


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel152
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel172
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '152'
        hoofdstuk: II
        afdeling: III
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '172'
        hoofdstuk: IV
        afdeling: III
  - number: 163.1.d
    text: |-
      het totaal van de ontvangen aanvullende bekostiging, bedoeld in [artikel 156][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel156
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '156'
        hoofdstuk: II
        afdeling: III
  - number: 163.1.e
    text: een staat van voorzieningen die zijn ingesteld ten behoeve van het openbaar onderwijs.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel163
  - number: '163.2'
    text: |-
      Indien een openbaar lichaam een deel van de ontvangsten, bedoeld in het eerste lid, onderdeel c of d toevoegt aan
      een voorziening, wordt dat deel aangemerkt als een uitgave als bedoeld in dat lid, onderdeel a, onderscheidenlijk
      als een uitgave als bedoeld in de onderdelen c en d van dat lid. Indien het openbaar lichaam bedragen aan een
      voorziening onttrekt, worden deze aangemerkt als ontvangsten, bedoeld in het eerste lid, onderdeel c of d.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel163
  - number: '163.3'
    text: |-
      Bij het vaststellen van de bedragen, bedoeld in het eerste lid, onderdelen b, d en e, worden buiten
      beschouwing gelaten de uitgaven en ontvangsten voor administratie, beheer en bestuur, bedoeld in
      [artikel 152, vierde lid, onderdeel g][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel152
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '152'
        hoofdstuk: II
        afdeling: III
  - number: '163.4'
    text: |-
      Bij het vaststellen van de bedragen, bedoeld in het eerste lid, onderdelen a en b worden buiten beschouwing gelaten
      de uitgaven die worden gedekt door ontvangsten van bedragen die door derden zijn betaald, en de uitgaven voor de
      voorzieningen waarvoor het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school op grond
      van de regeling, bedoeld in [artikel 162, eerste lid][ref1], een aanvraag bij het openbaar lichaam kon indienen en
      wel gedurende de periode waarvoor een dergelijke aanvraag kon worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel162
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '162'
        hoofdstuk: III
        paragraaf: '3'
        afdeling: III
  - number: '163.5'
    text: |-
      Indien het openbaar lichaam een deel van de bekostiging voor personeels- en exploitatiekosten overdraagt aan
      een ander bevoegd gezag, wordt dat deel aangemerkt als een uitgave als bedoeld in het eerste lid, onderdeel a of
      onderdeel b. Indien door een ander bevoegd gezag een deel van de bekostiging voor personeels- en exploitatiekosten
      aan het openbaar lichaam wordt overgedragen, wordt dat deel aangemerkt als een ontvangst als bedoeld in eerste
      lid, onderdeel c.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel163
  - number: '163.6'
    text: |-
      Om de vijf jaar stelt het bestuurscollege voorlopig vast het totaal van de vastgestelde uitgaven en ontvangsten
      in de voorafgaande vijf kalenderjaren, zoals in het eerste tot en met vijfde lid is aangegeven. Indien de uitgaven
      hoger zijn dan de ontvangsten, bepaalt het bestuurscollege tevens het bedrag van de overschrijding. Indien het
      openbaar lichaam vanaf een tijdstip binnen een periode van vijf jaar als bedoeld in de eerste volzin geen school
      in stand houdt, stelt het bestuurscollege in afwijking van die volzin zo spoedig mogelijk na dat tijdstip voorlopig
      vast het totaal van de vastgestelde uitgaven en ontvangsten in het aan dat tijdstip voorafgaande deel van de
      periode van vijf jaar, zoals in het eerste tot en met vijfde lid is aangegeven.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel163
  - number: '163.7'
    text: |-
      Na sluiting van de rekening van het openbaar lichaam stelt het bestuurscollege de in het eerste en zesde lid
      bedoelde bedragen, zo nodig gewijzigd, vast. In het geval de uitgaven hoger zijn dan de ontvangsten, bedoeld in het
      zesde lid, drukt het bestuurscollege vervolgens het bedrag van de overschrijding, bedoeld in genoemd lid, uit in
      een percentage van het totaal van de ontvangsten, bedoeld in het eerste lid onderdelen c en d. Het percentage wordt
      afgerond tot twee decimalen. Afronding naar beneden vindt plaats indien de derde decimaal kleiner is dan 5, en naar
      boven indien deze decimaal ten minste 5 bedraagt.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel163
  - number: '163.8'
    text: |-
      Voor de toepassing van de [artikelen 163 tot en met 165][ref1] worden uitgaven ten behoeve van een nevenvestiging
      aangemerkt als uitgaven ten behoeve van de hoofdvestiging van de school waaraan de nevenvestiging is verbonden.
      Indien ten behoeve van een school of nevenvestiging uitgaven worden gedaan door meer dan één openbaar lichaam,
      worden deze uitgaven aangemerkt als uitgaven van het openbaar lichaam op wier grondgebied de hoofdvestiging is
      gelegen. In het geval, bedoeld in de vorige volzin worden de besluiten ingevolge de artikelen 163 tot en met
      165 genomen door laatstbedoeld openbaar lichaam en hebben deze mede betrekking op de uitgaven van het andere
      openbaar lichaam of de andere openbare lichamen. Voor de toepassing van de artikelen 163 tot en met 165 wordt een
      nevenvestiging aangemerkt als een nevenvestiging die is gelegen in het openbaar lichaam van de hoofdvestiging.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel163
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '163'
        hoofdstuk: III
        paragraaf: '4'
        afdeling: III
  - number: '163.9'
    text: |-
      Het bestuurscollege kan in overeenstemming met het bevoegd gezag van een niet door het openbaar lichaam in stand
      gehouden school besluiten dat met betrekking tot een of meer scholen van dat bevoegd gezag uitgaven die het
      openbaar lichaam doet ten behoeve van een door hem in stand gehouden school buiten beschouwing worden gelaten bij
      het vaststellen van de bedragen, bedoeld in dit artikel.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel163
  - number: '164.1'
    text: |-
      In het jaar volgend op de definitieve vaststelling, bedoeld in [artikel 163, zevende lid][ref1], wordt het
      overschrijdingsbedrag vastgesteld waarop het bevoegd gezag van een niet door het openbaar lichaam in stand
      gehouden school die gedurende een of meer jaren van het desbetreffende tijdvak in het openbaar lichaam was
      gevestigd, aanspraak heeft. Dit overschrijdingsbedrag wordt vastgesteld door het percentage, bedoeld in artikel
      163, zevende lid, te vermenigvuldigen met het totaal van de ontvangsten van een niet door het openbaar lichaam in
      stand gehouden school dat is gebaseerd op de bedragen die krachtens de [artikelen 152][ref2] en [153][ref3] voor
      het desbetreffende tijdvak zijn vastgesteld, met dien verstande dat bij het vaststellen van het totaal van de
      ontvangsten, bedoeld in de vorige volzin, buiten beschouwing blijven de ontvangsten voor administratie, beheer en
      bestuur, bedoeld in artikel 152, derde lid, onderdeel g.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel163
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel152
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel153
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel164
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '163'
        hoofdstuk: III
        paragraaf: '4'
        afdeling: III
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '152'
        hoofdstuk: II
        afdeling: III
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '153'
        hoofdstuk: II
        afdeling: III
  - number: '164.2'
    text: |-
      Indien een openbaar lichaam gedurende een gedeelte van het desbetreffende tijdvak een of meer scholen in stand
      houdt, wordt voor het vaststellen van het overschrijdingsbedrag, bedoeld in het eerste lid, uitgegaan van het
      totaal van de ontvangsten van een niet door het openbaar lichaam in stand gehouden school over een overeenkomstig
      gedeelte van het desbetreffende tijdvak.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel164
  - number: '165.1'
    text: |-
      Na de voorlopige vaststelling van het bedrag van de overschrijding, bedoeld in [artikel 163, zesde lid][ref1],
      keert het bestuurscollege aan het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school dat
      op grond van [artikel 164, eerste lid][ref2], aanspraak heeft op een uitkering, een voorschot uit. Het voorschot
      omvat het voorlopig vastgestelde bedrag van de overschrijding, berekend op de wijze als is aangegeven in artikel
      164, eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel163
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel164
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel165
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '163'
        hoofdstuk: III
        paragraaf: '4'
        afdeling: III
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '164'
        hoofdstuk: III
        paragraaf: '4'
        afdeling: III
  - number: '165.2'
    text: |-
      Het bestuurscollege is bevoegd tijdens het vijfjarig tijdvak op verzoek van het bevoegd gezag van een niet door het
      openbaar lichaam in stand gehouden school jaarlijks een deel van het naar verwachting uit te betalen voorschot in
      mindering daarop uit te keren.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel165
  - number: '165.3'
    text: |-
      De bekendmaking van de beschikkingen tot voorlopige en definitieve vaststelling van het overschrijdingsbedrag,
      bedoeld in het zesde onderscheidenlijk [zevende lid van artikel 163][ref1], behelst tevens een staat van de
      voorzieningen als bedoeld in artikel 163, eerste lid, onderdeel f, waarin per kalenderjaar wordt aangegeven het
      verloop van de toevoegingen en de onttrekkingen aan de voorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel163
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel165
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '163'
        hoofdstuk: III
        paragraaf: '4'
        afdeling: III
  - number: '168.1'
    text: |-
      Op de bekostiging of onderdelen daarvan kunnen voorschotten worden verleend volgens regels, te stellen bij of
      krachtens algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel168
  - number: '168.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden tevens voorschriften gegeven voor de verrekening van de
      betaalde voorschotten met het bedrag van de vastgestelde bekostiging of onderdelen daarvan.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel168
  - number: '169'
    text: |-
      Onze Minister is bevoegd tot verrekening van vorderingen krachtens deze wet van of op het bevoegd gezag van een
      school met vorderingen van of op Onze Minister krachtens een andere wet.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel169
  - number: '170'
    text: |-
      Indien een leerling in de loop van het schooljaar de school verlaat zonder de opleiding te hebben voltooid, en
      aansluitend wordt ingeschreven als leerling aan een andere school voor voortgezet onderwijs of als mbo-student
      of vavo-student aan een instelling voor educatie en beroepsonderwijs, kan het bevoegd gezag van de school met het
      bevoegd gezag van die andere school of die instelling overeenkomen een deel van de bekostiging over te dragen aan
      dat andere bevoegd gezag vanwege deze tussentijdse overstap.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel170
  - number: 170a
    text: |-
      In afwijking van [artikel 172][ref1] kan het bevoegd gezag van de school met het bevoegd gezag van de
      instelling voor beroepsonderwijs waarmee het een samenwerkingsovereenkomst heeft gesloten als bedoeld in
      [artikel 27b, tweede lid][ref2], overeenkomen om vanwege een doorlopende leerroute vmbo-mbo als bedoeld
      in [artikel 27a, tweede lid][ref3], of de geïntegreerde route vmbo-basisberoepsopleiding, bedoeld in
      [artikel 27l, tweede lid][ref4], een deel van de bekostiging over te dragen aan dat andere bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel172
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel27b
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel27a
      [ref4]: https://wetten.overheid.nl/BWBR0030284#Artikel27l
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel170a
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '172'
        hoofdstuk: IV
        afdeling: III
      - id: ref2
        bwb_id: BWBR0030284
        artikel: 27b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0030284
        artikel: 27a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0030284
        artikel: 27l
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '171.1'
    text: Het bevoegd gezag van een bijzondere school houdt nauwkeurig boek van de inkomsten en uitgaven.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel171
  - number: '171.2'
    text: |-
      Het bevoegd gezag van een bijzondere school geeft desverlangd aan de door Onze Minister aangewezen ambtenaren de
      boeken en bescheiden ter inzage. Het bevoegd gezag is gehouden deze boeken en bescheiden zeven jaren te bewaren.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel171
  - number: '172.1'
    text: |-
      Het bevoegd gezag besteedt de verstrekte bekostiging en de betaalde bedragen ten behoeve van die school op de wijze
      zoals aangegeven in het tweede tot en met vierde lid.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel172
  - number: '172.2'
    text: |-
      De voor voorzieningen in de huisvesting betaalde bedragen worden zodanig aangewend dat een behoorlijke en
      deugdelijke totstandkoming van deze voorzieningen is verzekerd. Indien na realisatie van de in de eerste volzin
      bedoelde voorzieningen de bedragen niet volledig zijn aangewend, kan het resterende deel daarvan worden aangewend
      voor de kosten van personeel of voorzieningen in de exploitatie.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel172
  - number: '172.3'
    text: |-
      Het voor personeels- en exploitatiekosten betaalde bedrag wordt aangewend voor de kosten van personeel, zoals
      onderscheiden in [artikel 77][ref1], voor voorzieningen in de exploitatie. In geval van een overschot op die
      bedragen, kan dat overschot worden aangewend voor voorzieningen in de huisvesting.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel77
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel172
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '77'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
  - number: '172.4'
    text: |-
      De verstrekte overschrijdingsbedragen worden ten behoeve van het onderwijs aan de scholen van het bevoegd gezag
      aangewend.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel172
  - number: '172.5'
    text: |-
      Het bevoegd gezag kan de bedragen, bedoeld in het derde lid, mede aanwenden voor de vergoeding, bedoeld in
      [artikel 69, vierde lid][ref1], en voor de kosten van personeel of voorzieningen in de exploitatie van:


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel69
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel172
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '69'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
  - number: 172.5.a
    text: een andere school voor voortgezet onderwijs,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel172
  - number: 172.5.b
    text: een scholengemeenschap waarvan een of meer scholen voor voortgezet onderwijs deel uitmaken,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel172
  - number: 172.5.c
    text: |-
      een school als bedoeld in de [Wet primair onderwijs BES][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0030280
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel172
    references:
      - id: ref1
        bwb_id: BWBR0030280
  - number: 172.5.d
    text: |-
      een instelling als bedoeld in de [Wet educatie en beroepsonderwijs BES][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0028395
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel172
    references:
      - id: ref1
        bwb_id: BWBR0028395
  - number: 172.5.e
    text: het expertisecentrum onderwijszorg.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel172
  - number: '172.6'
    text: |-
      De op grond van [artikel 149][ref1], [artikel 160][ref2] of [artikel 162][ref3] verstrekte bekostiging wordt
      besteed aan het doel waarvoor zij is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel149
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel160
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel162
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel172
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '149'
        hoofdstuk: I
        afdeling: III
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '160'
        hoofdstuk: III
        paragraaf: '3'
        afdeling: III
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '162'
        hoofdstuk: III
        paragraaf: '3'
        afdeling: III
  - number: '172.7'
    text: |-
      Het bevoegd gezag kan met het bevoegd gezag waarmee het een samenwerkingsovereenkomst heeft gesloten als bedoeld in
      artikel 62, derde lid, overeenkomen om vanwege de samenwerking een deel van de bekostiging over te dragen aan het
      andere bevoegd gezag, bedoeld in het eerste lid van dat artikel.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel172
  - number: 172a
    text: |-
      Het bevoegd gezag beheert de middelen van de school op zodanige wijze dat het voortbestaan van de school is
      verzekerd.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel172a
  - number: '173.1'
    text: |-
      De bedragen en bekostiging, bedoeld in [artikel 172][ref1], worden niet aangewend voor contractactiviteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel172
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel173
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '172'
        hoofdstuk: IV
        afdeling: III
  - number: '173.2'
    text: |-
      Het bevoegd gezag van de scholen, bedoeld in [artikel 172][ref1], berekent voor de contractactiviteiten aan de
      betrokken derden de kosten zodanig dat aan het bepaalde in het eerste lid wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel172
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel173
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '172'
        hoofdstuk: IV
        afdeling: III
  - number: '174.1'
    text: |-
      De kosten van herstel van schade aan gebouwen, terreinen en roerende zaken ten behoeve waarvan met betrekking tot
      scholen bekostiging wordt genoten, worden niet door het openbaar lichaam vergoed, indien:
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel174
  - number: 174.1.a
    text: die schade door schuld of nalatigheid van de rechtspersoon die de school in stand houdt, wordt toegebracht, of
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel174
  - number: 174.1.b
    text: |-
      het bevoegd gezag een beroep kan doen op een verzekering waarvoor de premie voor vergoeding in aanmerking komt, of
      voor de vergoeding van die schade door het openbaar lichaam een collectieve verzekering is afgesloten, voor zover
      die collectieve verzekering de schade dekt.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel174
  - number: '174.2'
    text: |-
      Indien schade, ontstaan aan gebouwen, terreinen of roerende zaken van een door het openbaar lichaam bekostigde
      school voor vergoeding door het openbaar lichaam in aanmerking komt, treedt het openbaar lichaam op het moment van
      een uitdrukkelijk besluit tot vergoeding in alle rechten die het bevoegd gezag ter zake van die schade tegen derden
      mocht hebben.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel174
  - number: '175.1'
    text: |-
      Het bevoegd gezag stelt jaarlijks een jaarverslag over het voorafgaande kalenderjaar vast. Op deze
      jaarverslaggeving is [Boek 2, titel 9, van het Burgerlijk Wetboek][ref1], met uitzondering van de
      [afdelingen 1][ref2], [11][ref3] en [12][ref4], van overeenkomstige toepassing voor zover bij of krachtens algemene
      maatregel van bestuur niet anders is bepaald. Het jaarverslag bestaat ten minste uit de volgende onderdelen:


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Afdeling1
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Afdeling11
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Afdeling12
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel175
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0003045
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0003045
        afdeling: '11'
      - id: ref4
        bwb_id: BWBR0003045
        afdeling: '12'
  - number: 175.1.a
    text: |-
      een bestuursverslag als bedoeld in [artikel 391 van Boek 2 van het Burgerlijk Wetboek][ref1] waarin de door het
      bevoegd gezag gehanteerde code voor goed bestuur wordt vermeld alsmede ten minste verantwoording wordt afgelegd
      over de afwijkingen van die code voor goed bestuur,


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel391
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel175
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '391'
  - number: 175.1.b
    text: |-
      een jaarrekening als bedoeld in [artikel 361 van Boek 2 van het Burgerlijk Wetboek][ref1], waaruit dient te blijken
      dat sprake is van een rechtmatige en doelmatige aanwending van de bekostiging, met daarbij ingevolge het derde lid
      vast te stellen bijlagen,


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel361
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel175
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '361'
  - number: 175.1.c
    text: |-
      overige gegevens als bedoeld in [artikel 392 van Boek 2 van het Burgerlijk Wetboek.][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel392
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel175
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '392'
  - number: '175.2'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald welke onderdelen het jaarverslag tevens dient te bevatten,
      dan wel welke onderdelen komen te vervallen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel175
  - number: '175.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan een nadere invulling worden gegeven aan de onderdelen, bedoeld
      in het eerste lid, en kunnen nadere voorschriften worden gegeven over:
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel175
  - number: 175.3.a
    text: de indeling en wijze van ordening van de gegevens per onderdeel van het jaarverslag,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel175
  - number: 175.3.b
    text: de wijze en het tijdstip waarop de desbetreffende onderdelen beschikbaar worden gesteld,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel175
  - number: 175.3.c
    text: de elektronische verzending van het cijfermatige deel uit de jaarrekening, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel175
  - number: 175.3.d
    text: de grondslagen voor de jaarrekening.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel175
  - number: '175.4'
    text: |-
      De beschikbaarstelling van de gegevens, bedoeld in het derde lid, onderdeel b, gaat vergezeld van een verklaring
      omtrent de getrouwheid en rechtmatigheid, afgegeven door een door de toezichthouder of het toezichthoudend orgaan
      aangewezen deskundige als bedoeld in [artikel 121, zesde lid, van Boek 2 van het Burgerlijk Wetboek BES][ref1].
      Bij de aanwijzing van de deskundige bedingt de toezichthouder of het toezichthoudend orgaan dat de controle
      overeenkomstig een door Onze Minister vast te stellen accountantsprotocol plaatsvindt en dat aan Onze Minister op
      diens verzoek inzicht wordt geboden in de controlerapporten van de deskundige.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel121
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel175
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '121'
  - number: '175.5'
    text: |-
      De code voor goed bestuur, bedoeld in het eerste lid, onderdeel a, bevat ten minste bepalingen over de wijze waarop
      invulling wordt gegeven aan:
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel175
  - number: 175.5.a
    text: |-
      een beleid dat de eigen deskundigheid en verantwoordelijkheid van het personeel voor de kwaliteit van het onderwijs
      tot haar recht komt,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel175
  - number: 175.5.b
    text: een integere bedrijfsvoering, waaronder voorzieningen om verstrengeling van belangen tegen te gaan, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel175
  - number: 175.5.c
    text: afstemming met en verantwoording aan de ouders en andere belanghebbenden binnen en buiten de school.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel175
  - number: '175.6'
    text: Bij algemene maatregel van bestuur kan een branchecode voor goed bestuur worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel175
  - number: '175.7'
    text: Het bevoegd gezag maakt het jaarverslag openbaar.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel175
  - number: '175.8'
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven over de wijze en het tijdstip waarop
      openbaarmaking van het jaarverslag plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel175
  - number: '176.1'
    text: |-
      Het bevoegd gezag draagt er zorg voor dat het ten behoeve van Onze Minister beschikt over geordende gegevens die
      van belang zijn voor de berekening van de hoogte van de bekostiging, alsmede over een verklaring over de juistheid
      van de bekostigingsgegevens, afgegeven door een door de toezichthouder of het toezichthoudend orgaan aangewezen
      deskundige als bedoeld in [artikel 121, zesde lid, van Boek 2 van het Burgerlijk Wetboek BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel121
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel176
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '121'
  - number: '176.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de definiëring,
      de wijze van ordening en de beschikbaarstelling van de gegevens, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel176
  - number: '176.3'
    text: |-
      Het bevoegd gezag bewaart de gegevens, bedoeld in het eerste lid, en de desbetreffende boeken en bescheiden
      gedurende een periode van zeven jaren.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel176
  - number: '177.1'
    text: |-
      Het bevoegd gezag draagt er zorg voor dat het beschikt over geordende gegevens ten behoeve van het door Onze
      Minister te voeren beleid met betrekking tot het onderwijs, bedoeld in deze wet, en verleent desgevraagd
      medewerking aan door of namens Onze Minister uit te voeren onderzoek dat geheel of mede op deze gegevens is
      gebaseerd.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel177
  - number: '177.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de definiëring,
      de wijze van ordening en de beschikbaarstelling van de gegevens, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel177
  - number: 178a.1
    text: |-
      Onverminderd de bevoegdheid van de inspectie op grond van de [Wet op het onderwijstoezicht][ref1] kan Onze Minister
      een onderzoek instellen of doen instellen naar de jaarverslaggeving, naar de gegevens die noodzakelijk zijn voor de
      vaststelling van de bekostiging, naar de rechtmatigheid van de bestedingen en naar de doelmatigheid van het beheer
      van de school.


      [ref1]: https://wetten.overheid.nl/BWBR0013800
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel178a
    references:
      - id: ref1
        bwb_id: BWBR0013800
  - number: 178a.2
    text: |-
      Indien uit een op grond van het eerste lid ingesteld onderzoek blijkt dat de bekostiging voor een school onjuist is
      vastgesteld, kan Onze Minister correcties aanbrengen op de bekostiging.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel178a
  - number: 178a.3
    text: |-
      Onze Minister doet het bevoegd gezag schriftelijk mededeling van een besluit tot het aanbrengen van een correctie
      op de bekostiging.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel178a
  - number: 178a.4
    text: |-
      Indien uit de jaarverslaggeving, bedoeld in [artikel 175, eerste lid][ref1], uit de verklaring van de deskundige,
      bedoeld in artikel 175, vierde lid, of uit een op grond van het eerste lid ingesteld onderzoek blijkt dat de
      bekostiging voor een school onrechtmatig is besteed of evident ondoelmatig is aangewend, kan Onze Minister bepalen
      dat het desbetreffende gedeelte van de bekostiging niet ten laste komt van het Rijk of dat de daarmee gemoeide
      bedragen in mindering worden gebracht op de bekostiging.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel175
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel178a
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '175'
        hoofdstuk: IV
        afdeling: III
  - number: 178a.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de wijze waarop wordt vastgesteld
      dat sprake is van evident ondoelmatige aanwending van de bekostiging als bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel178a
  - number: 178a.6
    text: |-
      De voordracht voor een krachtens het vijfde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel178a
  - number: 178a.7
    text: |-
      Een in het tweede lid bedoelde correctie wordt indien de correctie strekt tot verhoging van de bekostiging, binnen
      acht weken na de mededeling, bedoeld in het derde lid, door Onze Minister betaald.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel178a
  - number: '183.1'
    text: |-
      Indien sprake is van wanbeheer van een of meer bestuurders of toezichthouders kan Onze Minister de rechtspersoon
      die de school in stand houdt een aanwijzing geven. Een aanwijzing omvat een of meer maatregelen en is evenredig aan
      het doel waarvoor zij wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel183
  - number: '183.2'
    text: 'Onder wanbeheer wordt uitsluitend verstaan:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel183
  - number: 183.2.a
    text: financieel wanbeleid,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel183
  - number: 183.2.b
    text: |-
      ernstige nalatigheid om, in ieder geval in strijd met [artikel 47][ref1], maatregelen te treffen die noodzakelijk
      zijn voor het waarborgen van de kwaliteit en goede voortgang van het onderwijs aan de school en om te voorkomen dat
      de kwaliteit van het stelsel van voortgezet onderwijs in gevaar komt,


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel47
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel183
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '47'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 183.2.c
    text: |-
      ongerechtvaardigde verrijking, al dan niet beoogd, van de rechtspersoon die de school in stand houdt, zichzelf dan
      wel een derde,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel183
  - number: 183.2.d
    text: |-
      onrechtmatig handelen, waaronder wordt verstaan het in de hoedanigheid van bestuurder of toezichthouder handelen in
      strijd met wettelijke bepalingen waarmee financieel voordeel wordt behaald ten gunste van de rechtspersoon die de
      school in stand houdt, zichzelf of een derde, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel183
  - number: 183.2.e
    text: |-
      het in ernstige mate verwaarlozen van de zorg voor wat door redelijkheid en billijkheid wordt gevorderd in de
      omgang met betrokkenen in de schoolorganisatie, waaronder wordt verstaan intimidatie of bedreiging van personeel,
      leerlingen of ouders door een bestuurder of toezichthouder.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel183
  - number: '183.3'
    text: |-
      In de aanwijzing geeft Onze Minister met redenen omkleed aan op welke punten sprake is van wanbeheer alsmede de in
      verband daarmee te nemen maatregelen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel183
  - number: '183.4'
    text: Een aanwijzing bevat de termijn waarbinnen het bevoegd gezag aan de aanwijzing moet voldoen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel183
  - number: '183.5'
    text: 'Alvorens Onze Minister een aanwijzing als bedoeld in het eerste lid geeft:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel183
  - number: 183.5.a
    text: |-
      heeft de inspectie een onderzoek als bedoeld in [artikel 11][ref1] of
      [artikel 15 van de Wet op het onderwijstoezicht][ref2] verricht,


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel15
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel183
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '15'
  - number: 183.5.b
    text: |-
      heeft de inspectie daarover een inspectierapport als bedoeld in
      [artikel 20, eerste lid, van de Wet op het onderwijstoezicht uitgebracht][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel20
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel183
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '20'
  - number: 183.5.c
    text: |-
      stelt Onze Minister de rechtspersoon vervolgens vier weken in de gelegenheid zijn zienswijze met betrekking tot de
      aanwijzing naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel183
  - number: '184.1'
    text: |-
      Indien het bevoegd gezag van een school in strijd handelt met het bepaalde bij of krachtens deze wet, waaronder
      tevens wordt verstaan het niet opvolgen van een aanwijzing als bedoeld in [artikel 183][ref1], kan Onze Minister
      bepalen dat de bekostiging, voorschotten daaronder begrepen, geheel of gedeeltelijk wordt ingehouden dan wel
      opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel183
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel184
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '183'
        hoofdstuk: IV
        afdeling: III
  - number: '184.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing, indien het bevoegd gezag of het personeel van een school in
      strijd handelt met [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel184
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '184.3'
    text: |-
      Onze Minister kent de bekostiging wederom toe, indien blijkt dat de reden voor de toepassing van het eerste of
      tweede lid is vervallen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel184
  - number: '185.1'
    text: |-
      Indien het bevoegd gezag tekortschiet in haar zorg voor de kwaliteit van het onderwijs, bedoeld in
      [artikel 47][ref1], kan Onze Minister op verzoek van het bevoegd gezag van een school of uit eigen beweging in
      overeenstemming met het bevoegd gezag maatregelen treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel47
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel185
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '47'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '185.2'
    text: |-
      Tot de maatregelen, bedoeld in het eerste lid, behoort de mogelijkheid het bestuur van de instelling te laten
      bijstaan door een extern deskundige. Ook kunnen onder voorwaarden extra financiële middelen aan de instelling ter
      beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel185
  - number: '185.3'
    text: |-
      Onze Minister stelt nadere regels omtrent de toekenning van en verantwoording voor maatregelen, voor zover deze het
      verstrekken van financiële middelen betreffen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel185
  - number: '186'
    text: |-
      In afwijking van [artikel 7, eerste lid, van de Wet administratieve rechtspraak BES][ref1] kan een belanghebbende
      beroep instellen bij het Gemeenschappelijke Hof van Justitie van Aruba, Curaçao, Sint Maarten en van Bonaire, Sint
      Eustatius en Saba tegen een besluit als bedoeld in de [artikelen 156][ref2] en [184][ref3]. De artikelen [54][ref4]
      en [55 van de Wet administratieve rechtspraak BES][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel156
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel184
      [ref4]: https://wetten.overheid.nl/BWBR0028455#Artikel54
      [ref5]: https://wetten.overheid.nl/BWBR0028455#Artikel55
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel186
    references:
      - id: ref1
        bwb_id: BWBR0028455
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '156'
        hoofdstuk: II
        afdeling: III
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '184'
        hoofdstuk: IV
        afdeling: III
      - id: ref4
        bwb_id: BWBR0028455
        artikel: '54'
      - id: ref5
        bwb_id: BWBR0028455
        artikel: '55'
  - number: '187.1'
    text: 'Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven omtrent:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel187
  - number: 187.1.a
    text: de inrichting van de boekhouding van bijzondere scholen,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel187
  - number: 187.1.b
    text: de wijze waarop door het bevoegd gezag verslag wordt gedaan van het financieel beheer van de school,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel187
  - number: 187.1.c
    text: de vaststelling door het bevoegd gezag van een begroting en een jaarrekening, alsmede de inrichting daarvan, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel187
  - number: 187.1.d
    text: de controle van de boekhouding en de administratie van de scholen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel187
  - number: '187.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven ter uitvoering van deze
      afdeling.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel187
  - number: '187.3'
    text: |-
      Indien een beschikking niet binnen de bij of krachtens de algemene maatregel van bestuur, bedoeld in dit artikel,
      gestelde termijn kan worden gegeven, stelt Onze Minister de aanvrager daarvan in kennis en noemt hij daarbij een
      termijn waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel187
  - number: '188.1'
    text: |-
      Een openbare school of scholengemeenschap wordt opgeheven en de bekostiging van een bijzondere school of
      scholengemeenschap wordt beëindigd indien de school gedurende drie achtereenvolgende schooljaren telkens is bezocht
      door een aantal leerlingen dat minder bedraagt dan een bij ministeriële regeling vast te stellen aantal.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel188
  - number: '188.2'
    text: |-
      De opheffing van een openbare school of scholengemeenschap of de beëindiging van de bekostiging van een bijzondere
      school of scholengemeenschap geschiedt met ingang van 1 augustus volgend op de drie achtereenvolgende schooljaren,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel188
  - number: '188.3'
    text: |-
      Indien een profiel als bedoeld in [artikel 18][ref1] of [29][ref2] aan een school voor voorbereidend
      beroepsonderwijs gedurende drie achtereenvolgende schooljaren telkens door nul leerlingen gevolgd is, wordt dat
      profiel aan een openbare school opgeheven, of gaat de aanspraak op bekostiging voor dat profiel aan een bijzondere
      school verloren met ingang van 1 augustus volgend op die drie achtereenvolgende schooljaren.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel29
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel188
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '18'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '29'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '189.1'
    text: |-
      Grondslag der berekening is het aantal leerlingen dat op 1 oktober van elk van de jaren bij de school was
      ingeschreven.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel189
  - number: '189.2'
    text: |-
      Indien voor de leerlingen binnen redelijke afstand geen plaatsruimte beschikbaar is op een gelijksoortige school,
      waar het verlangde onderwijs wordt gegeven, past Onze Minister [artikel 188][ref1] zodanig toe, dat de leerlingen
      van elk leerjaar de cursus kunnen voltooien.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel188
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel189
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '188'
        afdeling: IV
  - number: '189.3'
    text: |-
      [ Artikel 188][ref1] blijft buiten toepassing, indien de school of scholengemeenschap nog niet wordt bekostigd
      gedurende het aantal jaren van de cursusduur. In afwijking van de eerste volzin eindigt de bekostiging van de
      school of scholengemeenschap met ingang van het vierde schooljaar indien op deze school in het derde schooljaar van
      de bekostiging niet ten minste een bij ministeriële regeling te bepalen aantal leerlingen zijn ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel188
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel189
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '188'
        afdeling: IV
  - number: '189.4'
    text: |-
      Onze Minister kan op aanvraag van het bevoegd gezag besluiten voor een door hem te bepalen tijd toe te staan,
      dat een openbare school in stand wordt gehouden of een bijzondere school wordt bekostigd, ook al is het aantal
      leerlingen minder, dan in [artikel 188][ref1] is vermeld of als sprake is van een situatie als bedoeld in het derde
      lid, tweede volzin. Onze Minister besluit binnen zes maanden na ontvangst van een aanvraag. Indien de beschikking
      niet binnen zes maanden kan worden gegeven, stelt Onze Minister de aanvrager daarvan in kennis en noemt hij daarbij
      een termijn waarbinnen de beschikking wel tegemoet kan worden gezien.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel188
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel189
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '188'
        afdeling: IV
  - number: '189.5'
    text: |-
      Binnen acht weken na de bekendmaking door het Centraal Bureau voor de Statistiek dan wel door Onze Minister van
      de aantallen leerlingen per school voor voortgezet onderwijs, stelt de Rijksvertegenwoordiger vast welke door het
      openbaar lichaam in stand gehouden scholen gedurende reeds een jaar niet meer voldoen aan de voor hen geldende
      norm, genoemd in [artikel 188][ref1]. Wanneer er als gevolg van de opheffing van een school als bedoeld in de
      vorige volzin, naar zijn oordeel niet meer voldoende zal zijn voorzien in de behoefte aan openbaar onderwijs in een
      genoegzaam aantal scholen, draagt de Rijksvertegenwoordiger het bestuurscollege op een verzoek te doen op grond van
      het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel188
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel189
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '188'
        afdeling: IV
  - number: '190.1'
    text: Het bevoegd gezag stort het exploitatie-overschot terug in de desbetreffende overheidskas
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel190
  - number: 190.1.a
    text: |-
      indien een openbare school ingevolge [artikel 188][ref1] wordt opgeheven,


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel188
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel190
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '188'
        afdeling: IV
  - number: 190.1.b
    text: |-
      indien de bekostiging van een bijzondere school ingevolge een van de in onderdeel a genoemde artikelen wordt
      beëindigd, of
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel190
  - number: 190.1.c
    text: indien een school ingevolge een beslissing van het bevoegd gezag wordt opgeheven en deze opheffing is gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel190
  - number: '190.2'
    text: Het exploitatietekort blijft in de gevallen, bedoeld in het eerste lid, voor rekening van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel190
  - number: '190.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent de wijze waarop het exploitatie-
      overschot, bedoeld in het eerste lid, wordt berekend.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel190
  - number: '191'
    text: |-
      In afwijking van [artikel 7, eerste lid, van de Wet administratieve rechtspraak BES][ref1] kan een belanghebbende
      beroep instellen bij het Gemeenschappelijke Hof van Justitie van Aruba, Curaçao, Sint Maarten en van
      Bonaire, Sint Eustatius en Saba tegen een besluit op grond van deze afdeling. De [artikelen 54][ref2] en
      [55 van de Wet administratieve rechtspraak BES][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0028455#Artikel54
      [ref3]: https://wetten.overheid.nl/BWBR0028455#Artikel55
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel191
    references:
      - id: ref1
        bwb_id: BWBR0028455
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0028455
        artikel: '54'
      - id: ref3
        bwb_id: BWBR0028455
        artikel: '55'
  - number: 205a.1
    text: |-
      Met het oog op verbetering van de kwaliteit, toegankelijkheid of doelmatigheid van het voortgezet onderwijs kan bij
      wijze van experiment bij algemene maatregel van bestuur worden afgeweken van titel II, afdeling I, hoofdstuk I en
      van titel III, afdeling III, van de wet.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel205a
  - number: 205a.2
    text: 'In geval van toepassing van het eerste lid wordt bij algemene maatregel van bestuur in elk geval bepaald:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel205a
  - number: 205a.2.a
    text: het doel van het experiment,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel205a
  - number: 205a.2.b
    text: |-
      op welke wijze van welke artikelen van het in het eerste lid genoemde hoofdstuk en de daar genoemde afdeling wordt
      afgeweken,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel205a
  - number: 205a.2.c
    text: de duur van het experiment, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel205a
  - number: 205a.2.d
    text: op welke wijze en aan de hand van welke criteria de met het experiment beoogde effecten worden geëvalueerd.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel205a
  - number: 205a.3
    text: Bij ministeriële regeling kunnen regels worden gesteld over de uitvoering van een experiment.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel205a
  - number: 205a.4
    text: |-
      Een experiment duurt ten hoogste zes jaar, tenzij een langere duur gezien de bijzondere aard van het experiment
      noodzakelijk is. Alsdan wordt de duur van het experiment op ten hoogste acht jaar bepaald. Indien een voorstel
      van wet is ingediend bij de Staten-Generaal om het experiment om te zetten in een structurele wettelijke regeling
      voordat een experiment is afgelopen, kan Onze Minister het experiment verlengen tot het tijdstip waarop het
      wetsvoorstel tot wet is verheven en in werking treedt.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel205a
  - number: 205a.5
    text: |-
      Onze Minister zendt drie maanden voor het einde van de werkingsduur van een algemene maatregel van bestuur als
      bedoeld in het eerste lid aan de Staten-Generaal, een verslag over de doeltreffendheid en de effecten van het
      experiment in de praktijk, evenals een standpunt over de voortzetting van die algemene maatregel van bestuur,
      anders dan een voortzetting als experiment.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel205a
  - number: 205a.6
    text: |-
      In verband met een experiment als bedoeld in het eerste lid, kan bij algemene maatregel van bestuur eveneens bij
      wijze van experiment worden afgeweken van:
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel205a
  - number: 205a.6.a
    text: artikel 1 van de Leerplichtwet BES,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel205a
  - number: 205a.6.b
    text: artikel 1.1 van de Wet studiefinanciering BES.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel205a
  - number: 205a.7
    text: |-
      Dit artikel is van overeenkomstige toepassing op een samenwerkingsverband van een school met een school als bedoeld
      in artikel 1, een school als bedoeld in de Wet primair onderwijs BES, of een instelling als bedoeld in de Wet
      educatie en beroepsonderwijs BES. Bij samenwerking met een school of instelling kan voor die school, instelling
      of uitvoeringsinstantie respectievelijk worden afgeweken van hoofdstuk I, titel I, artikelen 1 en 2, titel II,
      afdeling 1 en afdeling 2, artikelen 53 en 54 en titel III, afdeling 1, 2, 4 tot en met 6, afdeling 7, paragrafen
      2, 3, 6 en 7, en afdeling 8, paragraaf 1, van de Wet primair onderwijs BES, dan wel hoofdstuk 2, titel 2, en de
      hoofdstukken 6 en 7 van de Wet educatie en beroepsonderwijs BES. Bij de algemene maatregel van bestuur, bedoeld
      in het tweede lid, wordt geregeld welke bij of krachtens de wet, de Wet primair onderwijs BES of de Wet educatie
      en beroepsonderwijs BES vastgestelde voorschriften van toepassing of van overeenkomstige toepassing zijn op de
      samenwerking.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel205a
  - number: '206.1'
    text: |-
      De [artikelen 8][ref1], [13 tot en met 30][ref2] en [33 tot en met 41][ref3], en de ter uitvoering daarvan
      vastgestelde voorschriften, vinden met ingang van het eerste schooljaar na hun inwerkingtreding successievelijk
      toepassing per opvolgend leerjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel33
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel206
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '13'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '33'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '206.2'
    text: |-
      Op de leerjaren waarop de artikelen van deze wet als gevolg van successievelijke inwerkingtreding nog geen
      toepassing hebben, blijft van toepassing het bepaalde bij en krachtens de Wet voortgezet onderwijs BES zoals die
      luidde op de dag voor het tijdstip van de inwerkingtreding van dit artikel.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel206
  - number: '206.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt geregeld op welk moment, voor welke leerlingen of
      staatsexamenkandidaten, en voor zover nodig op welke wijze, nog gelegenheid wordt gegeven tot het afleggen van
      een eindexamen als bedoeld in artikel 32 van de Landsverordening voortgezet onderwijs dan wel een landsexamen als
      bedoeld in artikel 57 van die verordening zoals die artikelen luidden op 9 oktober 2010. De gelegenheid tot het
      afleggen van dit eindexamen komt in elk geval toe aan leerlingen die voor het tijdstip van de inwerkingtreding van
      dit artikel zijn toegelaten tot het eerste leerjaar van scholen als bedoeld in de [artikelen 13][ref1], [14][ref2],
      [15][ref3] en [17][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0030284#Artikel17
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel206
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '13'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '14'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '15'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0030284
        artikel: '17'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '208.1'
    text: |-
      In afwijking van de [artikelen 129 tot en met 135][ref1] en met overeenkomstige toepassing van [artikel 138][ref2]
      gelden voor het jaar 2011 tot en met een bij koninklijk besluit te bepalen tijdstip de voorschriften van het tweede
      tot en met zevende lid voor de voorziening in de huisvesting van uit ’s Rijks kas bekostigde scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel129
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel138
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel208
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '129'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '138'
        afdeling: II
  - number: '208.2'
    text: |-
      Onze Minister en het bestuurscollege van het openbaar lichaam zijn voor het jaar 2011 tot en met een bij koninklijk
      besluit te bepalen tijdstip gezamenlijk verantwoordelijk voor de huisvesting van uit ’s Rijks kas bekostigde
      scholen alsmede voor de financiering daarvan.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel208
  - number: '208.3'
    text: |-
      Onze Minister en het bestuurscollege van het openbaar lichaam sluiten ter invulling van de gezamenlijke
      verantwoordelijkheid, bedoeld in het tweede lid, namens de Staat der Nederlanden onderscheidenlijk namens het
      betreffende openbaar lichaam, een of meer convenanten.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel208
  - number: '208.4'
    text: |-
      Overeenkomstig het convenant of de convenanten, bedoeld in het derde lid, stelt Onze Minister voor elk van de
      openbare lichamen een plan vast, waarin de voornemens op het terrein van de huisvesting, bedoeld in het tweede lid,
      alsmede de financiering daarvan, op hoofdlijnen worden beschreven.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel208
  - number: '208.5'
    text: |-
      Onze Minister stelt de plannen, bedoeld in het vierde lid, vast in overeenstemming met het bestuurscollege van het
      openbaar lichaam en na overleg met de betreffende bevoegde gezagsorganen van de scholen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel208
  - number: '208.6'
    text: |-
      Onze Minister kan een of meer plannen, bedoeld in het vierde lid, in overeenstemming met het bestuurscollege van
      het betreffende openbaar lichaam, wijzigen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel208
  - number: '208.7'
    text: |-
      De plannen dan wel een wijziging daarvan, worden aan de betrokken bevoegde gezagsorganen van de scholen en in de
      Staatscourant bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel208
  - number: '208.8'
    text: |-
      Voor het jaar 2011 tot en met een bij koninklijk besluit te bepalen tijdstip is het eerste lid tevens van
      toepassing op de Saba Comprehensive School.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel208
  - number: '208.9'
    text: |-
      Met ingang van het in het achtste lid genoemde tijdstip is, in afwijking van [artikel 128][ref1],
      [afdeling II van titel III][ref2] van deze wet tot het tijdstip, genoemd in [artikel 207, onderdeel d][ref3], van
      overeenkomstige toepassing op de Saba Comprehensive School.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel128
      [ref2]: https://wetten.overheid.nl/BWBR0030284#AfdelingII
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel207
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel208
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '128'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0030284
        afdeling: II
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '207'
        afdeling: I
  - number: '210'
    text: |-
      Onverminderd [artikel 80, eerste lid, onderdelen a en c][ref1], kunnen in afwijking van [artikel 3][ref2] en
      artikel 80, eerste lid, onderdeel b, leraren worden benoemd dan wel tewerkgesteld zonder benoeming die op de dag
      voorafgaand aan het tijdstip van de inwerkingtreding van dit artikel, bevoegd waren tot het geven van onderwijs op
      grond van de Landsverordening voortgezet onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel3
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel210
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '80'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '3'
  - number: '211'
    text: |-
      Onverminderd [artikel 80, eerste lid, onderdelen a en c][ref1], mag in afwijking van [artikel 3][ref2] en artikel
      80, eerste lid onderdeel b, gedurende een periode van vijf jaar na het tijdstip van de inwerkingtreding van
      dit artikel, voortgezet onderwijs gegeven worden door degenen die op de dag voorafgaand aan het tijdstip van de
      inwerkingtreding van dit artikel, voortgezet onderwijs gaven op een van de scholen in de openbare lichamen zonder
      daartoe bevoegd te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel3
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel211
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '80'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '3'
  - number: '212'
    text: |-
      Onverminderd [artikel 80, eerste lid, onderdelen a en c][ref1], mogen in afwijking van [artikel 3][ref2] en
      artikel 80, eerste lid onderdeel b, degenen die geen getuigschrift bezitten als bedoeld in artikel 80, eerste lid,
      onderdeel b, ten eerste, maar wel voor het tijdstip van de inwerkingtreding van dit artikel, een opleiding begonnen
      zijn die leidt tot een bewijs van bekwaamheid tot het geven van onderwijs als bedoeld in de Landsverordening
      voortgezet onderwijs gedurende een periode van vijf jaar na het tijdstip van de inwerkingtreding van dit artikel,
      na het behalen van dit bewijs van bekwaamheid worden benoemd dan wel tewerkgesteld worden zonder benoeming tot
      leraar in het voortgezet onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel3
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel212
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '80'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '3'
  - number: '213'
    text: |-
      Onverminderd [artikel 83, eerste lid, onderdelen a en f][ref1], en artikel 83, tweede en derde lid, kan in
      afwijking van artikel 83, eerste lid, onderdeel b, tot rector, directeur, conrector of adjunct-directeur
      worden benoemd dan wel tewerkgesteld zonder benoeming degene die op de dag voorafgaand aan het tijdstip van
      de inwerkingtreding van dit artikel, bevoegd was tot het geven van onderwijs op grond van de Landsverordening
      voortgezet onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel83
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel213
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '83'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
  - number: 214a
    text: |-
      Tot een bij koninklijk besluit te bepalen tijdstip blijven de bepalingen van de Wet voortgezet onderwijs BES zoals
      die is komen te luiden op 10 oktober 2010, van kracht voor zover de regeling van de daarin opgenomen onderwerpen
      niet is vervangen door de inwerkingtreding van overeenkomstige onderwerpen in deze wet.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel214a
  - number: 214b.1
    text: |-
      Personen die in het bezit zijn van een getuigschrift, afgegeven krachtens de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], waaruit blijkt dat ten aanzien van het vak
      omgangskunde is voldaan aan de bekwaamheidseisen die zijn vastgesteld krachtens [artikel 86, eerste lid][ref2],
      zijn tevens benoembaar of tewerkstelbaar zonder benoeming voor het geven van praktijkonderwijs als bedoeld
      in [artikel 31][ref3] en voor het geven van onderwijs aan groepen van uitsluitend geïndiceerde leerlingen in
      het leerwegondersteunend onderwijs, bedoeld in [artikel 30][ref4], in de vakken Nederlands, Engels, wiskunde,
      geschiedenis, aardrijkskunde, biologie (incl. kennis der natuur), verzorging, muziek, handvaardigheid (textiele
      werkvormen) en tekenen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel86
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel31
      [ref4]: https://wetten.overheid.nl/BWBR0030284#Artikel30
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel214b
    references:
      - id: ref1
        bwb_id: BWBR0005682
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '86'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '31'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0030284
        artikel: '30'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 214b.2
    text: 'Het eerste lid is uitsluitend van toepassing ten aanzien van personen die:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel214b
  - number: 214b.2.a
    text: het in het eerste lid bedoelde getuigschrift hebben behaald na 1 augustus 2006;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel214b
  - number: 214b.2.b
    text: |-
      voor 1 september 2012 zijn gestart met de opleiding tot leraar voortgezet onderwijs van de tweede graad in het vak
      omgangskunde aan de Fontys Hogeschool Tilburg, de NHL Hogeschool, de Hogeschool Leiden of de Hogeschool Utrecht; en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel214b
  - number: 214b.2.c
    text: |-
      uiterlijk op 31 augustus 2016 met goed gevolg de aanvullende opleiding «Leergang omgangskunde in praktijkonderwijs
      en leerwegondersteunend onderwijs» met een omvang van ten minste 420 uren studie hebben afgerond aan een van de in
      onderdeel b genoemde hogescholen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel214b
  - number: 214f
    text: |-
      Toepassing van [artikel 125, eerste en tweede lid][ref1], zoals luidend ingevolge de Wet van 25 mei 2018 tot
      wijziging van onder meer de Wet op het voortgezet onderwijs en de Wet voortgezet onderwijs BES in verband met
      modernisering van de bepalingen over voorzieningenplanning (Stb. 2018, 156) leidt niet eerder dan 1 jaar na
      inwerkingtreding van het betrokken artikellid tot het vervallen van de aanspraak op bekostiging.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel125
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel214f
    references:
