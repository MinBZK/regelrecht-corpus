articles:
  - number: '1'
    text: |-
      Deze wet verstaat onder: **assistentopleiding**: assistentopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdeel a, van de Wet educatie en beroepsonderwijs BES][ref1];
      **basisberoepsopleiding**: basisberoepsopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdeel b, van de Wet educatie en beroepsonderwijs BES][ref2]; **basisregister
      onderwijs**: basisregister onderwijs als bedoeld in [artikel 24b van de Wet op het onderwijstoezicht][ref3];
      **belangstellingsmeting**: de belangstellingsmeting, bedoeld in [artikel 124a][ref4]; **beroepsopleiding**:
      opleiding als bedoeld in [artikel 7.1.2, tweede lid, van de Wet educatie en beroepsonderwijs BES][ref5];
      **beroepspraktijkvorming:** beroepspraktijkvorming als bedoeld in
      [artikel 7.2.7, eerste lid, van de Wet educatie en beroepsonderwijs BES][ref6]; **bevoegd gezag**: voor
      wat betreft: a. een openbare school: 1°. het bestuurscollege van het betreffende openbaar lichaam, voor
      zover de raad niet anders bepaalt, en, indien de raad dit besluit, met inachtneming van door hem te
      stellen regelen; 2°. de openbare rechtspersoon, bedoeld in [artikel 97][ref7]; dan wel 3°. de stichting,
      bedoeld in [artikel 98][ref8] of [artikel 109][ref9]; b. een bijzondere school: de rechtspersoon, bedoeld
      in [artikel 105, eerste lid][ref10]; **bijzondere school**: een door een natuurlijke persoon of door
      een privaatrechtelijke rechtspersoon, niet zijnde een stichting als bedoeld in [artikel 98][ref11], in
      stand gehouden school; **College voor toetsen en examens**: College voor toetsen en examens als bedoeld
      in [artikel 2, eerste lid, van de Wet College voor toetsen en examens][ref12]; **contractactiviteiten**:
      activiteiten als bedoeld in [artikel 43, tweede lid][ref13]; **deelnemers**: deelnemers als bedoeld in
      de [Wet educatie en beroepsonderwijs BES][ref14]; **expertisecentrum onderwijszorg**: de rechtspersoon,
      bedoeld in [artikel 69, eerste lid][ref15]; **ho-student**: degene die hoger onderwijs volgt, als bedoeld
      in [artikel 1.1, onderdeel b, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref16];
      **inspectie**: de inspectie, bedoeld in de [Wet op het onderwijstoezicht][ref17], voor zover het
      voortgezet onderwijs betreft; **instelling voor beroepsonderwijs**: instelling als bedoeld in
      [artikel 1.1.1 van de Wet educatie en beroepsonderwijs BES][ref18], waaraan beroepsonderwijs als
      bedoeld in [artikel 1.2.1, tweede lid, van die wet][ref19] wordt verzorgd; **kerndoelen**: de
      op grond van [artikel 34][ref20] vastgestelde na te streven inhoudelijke doelstellingen voor het
      onderwijsprogramma voor de eerste twee leerjaren, bedoeld in [artikel 35][ref21], gericht op het verwerven
      door leerlingen van kennis, inzicht en vaardigheden; **kwalificatie**: de kwalificatie, bedoeld in
      [artikel 7.1.3 van de Wet educatie en beroepsonderwijs BES][ref22]; **mbo-student**: student als bedoeld in
      [artikel 1.1.1 van de Wet educatie en beroepsonderwijs BES][ref23]; **middenkaderopleiding**: middenkaderopleiding
      als bedoeld in [artikel 7.2.2, eerste lid, onderdeel d, van de Wet educatie en beroepsonderwijs BES][ref24]; **Onze
      Minister**: Onze Minister van Onderwijs, Cultuur en Wetenschap; **openbaar lichaam**: openbaar lichaam Bonaire,
      Sint Eustatius of Saba; **openbare rechtspersoon**: een rechtspersoon die krachtens publiekrecht is ingesteld als
      bedoeld in [artikel 97][ref25]; **openbare school**: a. een school in stand gehouden door een openbaar lichaam, al
      dan niet te zamen met een of meer privaatrechtelijke rechtspersonen met volledige rechtsbevoegdheid; b. een door
      een openbare rechtspersoon als bedoeld in [artikel 97][ref26] in stand gehouden school; c. een door een stichting
      als bedoeld in [artikel 98][ref27] of [artikel 109][ref28] in stand gehouden school; **opleidingsdomein**:
      opleidingsdomein als bedoeld in [artikel 1.1.1 van de Wet educatie en beroepsonderwijs BES][ref29];
      **ouders**: ouders, voogden of verzorgers; **personeel**: a. de benoemde rector, directeur, conrector,
      adjunct-directeur of leraar, en overig personeel benoemd in een andere functie dan het geven van onderwijs,
      waaronder begrepen de leden van het bestuur van die scholen die zijn benoemd door een raad van toezicht
      als bedoeld in [artikel 56, derde lid][ref30], voor zover die leden mede zijn benoemd op basis van een
      arbeidsovereenkomst of een schriftelijke aanstelling; b. het onder a bedoelde personeel dat zonder benoeming
      is tewerkgesteld, tenzij het betreft de toepassing van de [artikelen 90 tot en met 93][ref31] en 167,
      voor zover niet anders is bepaald, en de toepassing van daarmee verband houdende wettelijke bepalingen;
      **persoonsgebonden nummer BES**: het administratienummer van de leerling, dan wel het door Onze Minister
      uitgegeven onderwijsnummer, bedoeld in [artikel 65, vierde lid][ref32]; **Raad onderwijs arbeidsmarkt**: de
      Raad onderwijs arbeidsmarkt, bedoeld in [artikel 1.5.1 van de Wet educatie en beroepsonderwijs BES][ref33];
      **Rijksvertegenwoordiger**: Rijksvertegenwoordiger voor de openbare lichamen Bonaire, Sint Eustatius en Saba;
      **scholengemeenschap**: een gemeenschap van twee of meer scholen voor voortgezet onderwijs; **school**: een
      school voor voortgezet onderwijs, tenzij het tegendeel blijkt; **vakopleiding**: vakopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdeel c, van de Wet educatie en beroepsonderwijs BES][ref34]; **vavo-student**:
      vavo-student als bedoeld in [artikel 1.1.1 van de Wet educatie en beroepsonderwijs BES][ref35]; **voortgezet
      onderwijs**: het voortgezet onderwijs, bedoeld in [artikel 2][ref36].


