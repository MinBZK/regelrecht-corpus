        afdeling: I
  - number: '82'
    text: |-
      In afwijking van [artikel 80, eerste lid, onderdeel b][ref1], kan met het verzorgen
      van onderwijs in de assistentopleiding, bedoeld in [artikel 26][ref2], ook worden
      belast degene die in het bezit is van een geschiktheidsverklaring als bedoeld in
      [artikel 4.2.5, eerste lid, van de Wet educatie en beroepsonderwijs BES][ref3] voor tot die assistentopleiding
      behorend onderwijs, met dien verstande dat betrokkene tevens in het bezit is van een getuigschrift als bedoeld in
      [artikel 7a.4 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel26
