        bwb_id: BWBR0005682
        artikel: '7'
  - number: '80.15'
    text: |-
      Het dertiende lid is, behoudens de eis van verblijf in het laatste jaar van de opleiding, van overeenkomstige
      toepassing ten aanzien van ho-studenten van een universitaire lerarenopleiding, met dien verstande dat afwijking
      bij de voltijdse vorm van die opleiding mogelijk is voor ten hoogste de periode van een schooljaar waarin onderwijs
      wordt gegeven, en bij de deeltijdse vorm van die opleiding voor ten hoogste twee jaren.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel80
  - number: '80.16'
    text: |-
      Voor door het bevoegd gezag vastgestelde vakken en andere programma-onderdelen, uitgezonderd godsdienstonderwijs
      en levensbeschouwelijk vormingsonderwijs, kunnen bij algemene maatregel van bestuur regels worden vastgesteld ten
      aanzien van benoeming dan wel tewerkstelling zonder benoeming. Bij deze algemene maatregel van bestuur kan het
      eerste lid geheel of gedeeltelijk van toepassing of overeenkomstige toepassing worden verklaard.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel80
  - number: '80.17'
    text: |-
      In geval van een geschiktheidsverklaring als bedoeld in artikel 197 vindt de benoeming of tewerkstelling zonder
      benoeming plaats voor een periode van ten hoogste twee aaneengesloten schooljaren. Het bevoegd gezag kan deze
      benoemingsperiode, al dan niet onder door dat gezag te stellen voorwaarden, verlengen met ten hoogste twee jaren
      indien het bevoegd gezag daarvoor redenen aanwezig acht. Het bevoegd gezag beschikt over geordende gegevens met
      betrekking tot de toepassing van de tweede volzin. Het bevoegd gezag dat betrokkene voor de eerste maal na afgifte
      van de geschiktheidsverklaring benoemt of tewerkstelt zonder benoeming, tekent het feit en de datum van benoeming
      of tewerkstelling zonder benoeming aan op die verklaring.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel80
  - number: '80.18'
    text: |-
      Het bevoegd gezag kan afwijken van het eerste lid, onder b, ten aanzien van degene die gelet op specifieke
      kennis en bekwaamheden, samenhangend met ervaringen en werkzaamheden in andere sectoren van de samenleving en het
      bedrijfsleven, naar het oordeel van het bevoegd gezag voldoende bekwaam is om onder verantwoordelijkheid van een
      daartoe door het bevoegd gezag aan te wijzen leraar voor een beperkte betrekkingsomvang te worden belast met een
      uitsluitend lesgevende taak voor vakken waar die specifieke kennis en bekwaamheden in het bijzonder betrekking op
      hebben. De betrekkingsomvang is voor het totaal van de in de eerste volzin bedoelde lesgevende taken ten hoogste
      een aantal van op jaarbasis gemiddeld 6 klokuren per week.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel80
  - number: '80.19'
    text: |-
      Onze Minister kan met betrekking tot een vak of ander programmaonderdeel waarvoor niet met een getuigschrift
      afgegeven krachtens de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] kan worden aangetoond dat
      betrokkene voldoet aan de bekwaamheidseisen, bedoeld in [artikel 86, eerste lid][ref2], en waarvoor de bekwaamheid
      evenmin blijkt uit de regeling, bedoeld in het vierde lid, onderdeel b, verklaren dat een leraar wordt geacht
      bij benoeming of tewerkstelling zonder benoeming te voldoen aan de bekwaamheidseisen tot het geven van voortgezet
      onderwijs in dat vak of dat andere programmaonderdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel86
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel80
