    text: |-
      de inrichting van het onderwijs, bedoeld in [artikel 2, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel2
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel124
    references:
