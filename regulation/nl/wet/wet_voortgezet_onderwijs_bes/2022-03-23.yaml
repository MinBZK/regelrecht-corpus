  - number: 124.2.b.3
    text: |-
      de inhoud van een in onderwijstijd verzorgd samenhangend onderwijsprogramma, geldend voor de schoolsoort
      en leerweg, bedoeld in de [artikelen 16][ref1], [18][ref2], [29][ref3], [31][ref4], [33][ref5], [34][ref6],
      [35][ref7], [37][ref8], [38][ref9], [39][ref10] en [40][ref11], voor zover deze schoolsoort of leerweg van
