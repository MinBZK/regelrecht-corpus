      [artikel 7.2.2 van de Wet educatie en beroepsonderwijs BES][ref2] die in het kader van die opleiding
      onderwijsondersteunende werkzaamheden verrichten waarvoor op grond van [artikel 86, derde lid][ref3],
      bekwaamheidseisen zijn vastgesteld, kan voor de duur van die werkzaamheden worden afgeweken van het eerste lid
      onder b tot en met d.


