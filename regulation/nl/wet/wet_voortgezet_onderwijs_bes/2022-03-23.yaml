        paragraaf: '1'
        afdeling: I
  - number: '37'
    text: |-
      Op het onderwijs in het derde leerjaar aan scholen voor voorbereidend wetenschappelijk onderwijs en voor hoger
      algemeen voortgezet onderwijs zijn van overeenkomstige toepassing:
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel37
  - number: 37.a
    text: |-
      [artikel 33][ref1], en

      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel33
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '33'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 37.b
    text: |-
      [artikel 35][ref1] met uitzondering van het eerste lid, tweede volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel35
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '35'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '38.1'
    text: |-
      Het onderwijs aan scholen voor voorbereidend wetenschappelijk onderwijs en aan scholen voor hoger algemeen
      voortgezet onderwijs omvat met ingang van het vierde leerjaar een periode van voorbereidend hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel38
  - number: '38.2'
    text: |-
      De periode van voorbereidend hoger onderwijs is ingericht volgens profielen. Een profiel is een samenhangend
      onderwijsprogramma, zodanig ingericht dat het biedt:
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel38
  - number: 38.2.a
    text: een algemene maatschappelijke voorbereiding en persoonlijke vorming,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel38
  - number: 38.2.b
    text: een algemene voorbereiding op het hoger onderwijs, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel38
  - number: 38.2.c
    text: een bijzondere voorbereiding op groepen van naar inhoud verwante opleidingen in het hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel38
  - number: '38.3'
    text: 'De school verzorgt onderwijs in een of meer van de volgende profielen:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel38
  - number: 38.3.a
    text: het profiel natuur en techniek;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel38
  - number: 38.3.b
    text: het profiel natuur en gezondheid;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel38
  - number: 38.3.c
    text: het profiel economie en maatschappij;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel38
  - number: 38.3.d
    text: het profiel cultuur en maatschappij.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel38
  - number: '38.4'
    text: 'Elk profiel bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel38
  - number: 38.4.a
    text: een gemeenschappelijk deel, dat voor alle profielen van de desbetreffende schoolsoort gelijk is,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel38
  - number: 38.4.b
    text: een profieldeel, dat kenmerkend is voor dat profiel, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel38
  - number: 38.4.c
    text: een vrij deel.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel38
  - number: '38.5'
    text: |-
      Het bevoegd gezag richt het onderwijs in de periode van voorbereidend hoger onderwijs in op de grondslag van een
      normatieve studielast voor de leerling van 1 600 uren per leerjaar, uitgaande van 40 weken met elk een normatieve
      studielast van 40 uren. Het bevoegd gezag richt daarbij een in schooltijd verzorgd samenhangend onderwijsprogramma
      in.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel38
  - number: '39.1'
    text: 'Het gemeenschappelijk deel van elk profiel in het atheneum omvat:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel39
  - number: 39.1.a
    text: Nederlandse taal en literatuur,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel39
  - number: 39.1.b
    text: Engelse taal en literatuur,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel39
  - number: 39.1.c
    text: |-
      een andere moderne vreemde taal en literatuur, bij algemene maatregel van bestuur aan te wijzen, ter keuze van de
      leerling, voor zover het bevoegd gezag deze vakken aanbiedt,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel39
  - number: 39.1.d
    text: maatschappijleer,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel39
  - number: 39.1.e
    text: |-
      culturele en kunstzinnige vorming, met dien verstande dat indien Latijnse taal en cultuur of Griekse taal en
      cultuur, dan wel beide, deel uitmaken van het profiel, de leerling is vrijgesteld van het volgen van het vak
      culturele en kunstzinnige vorming, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel39
  - number: 39.1.f
    text: lichamelijke opvoeding.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel39
  - number: '39.2'
    text: 'Het gemeenschappelijk deel van elk profiel in het gymnasium omvat:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel39
  - number: 39.2.a
    text: Nederlandse taal en literatuur,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel39
  - number: 39.2.b
    text: Engelse taal en literatuur,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel39
  - number: 39.2.c
    text: |-
      Latijnse taal en cultuur of Griekse taal en cultuur, ter keuze van de leerling uit deze beide door het bevoegd
      gezag aan te bieden vakken,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel39
  - number: 39.2.d
    text: maatschappijleer, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel39
  - number: 39.2.e
    text: lichamelijke opvoeding.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel39
  - number: '39.3'
    text: 'Het profieldeel van het profiel natuur en techniek in het gymnasium en atheneum omvat:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel39
  - number: 39.3.a
    text: wiskunde,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel39
  - number: 39.3.b
    text: natuurkunde,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel39
  - number: 39.3.c
    text: scheikunde, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel39
  - number: 39.3.d
    text: |-
      een vak ter keuze van de leerling uit vakken die bij algemene maatregel van bestuur zijn aangewezen, voor zover het
      bevoegd gezag deze vakken aanbiedt.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel39
  - number: '39.4'
    text: 'Het profieldeel van het profiel natuur en gezondheid in het gymnasium en atheneum omvat:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel39
  - number: 39.4.a
    text: wiskunde,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel39
  - number: 39.4.b
    text: biologie,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel39
  - number: 39.4.c
    text: scheikunde, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel39
  - number: 39.4.d
    text: |-
      een vak ter keuze van de leerling uit vakken die bij algemene maatregel van bestuur zijn aangewezen, voor zover het
      bevoegd gezag deze vakken aanbiedt.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel39
  - number: '39.5'
    text: 'Het profieldeel van het profiel economie en maatschappij in het gymnasium en atheneum omvat:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel39
  - number: 39.5.a
    text: wiskunde,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel39
  - number: 39.5.b
    text: economie,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel39
  - number: 39.5.c
    text: geschiedenis, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel39
  - number: 39.5.d
    text: |-
      een vak ter keuze van de leerling uit vakken die bij algemene maatregel van bestuur zijn aangewezen, voor zover het
      bevoegd gezag deze vakken aanbiedt.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel39
  - number: '39.6'
    text: 'Het profieldeel van het profiel cultuur en maatschappij in het gymnasium en atheneum omvat:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel39
  - number: 39.6.a
    text: wiskunde,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel39
  - number: 39.6.b
    text: geschiedenis,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel39
  - number: 39.6.c
    text: |-
      een vak ter keuze van de leerling uit culturele vakken die bij algemene maatregel van bestuur zijn aangewezen, voor
      zover het bevoegd gezag deze vakken aanbiedt, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel39
  - number: 39.6.d
    text: |-
      een vak ter keuze van de leerling uit maatschappelijke vakken die bij algemene maatregel van bestuur zijn
      aangewezen, voor zover het bevoegd gezag deze vakken aanbiedt.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel39
  - number: '39.7'
    text: 'Het vrije deel van elk profiel in het gymnasium en atheneum omvat ten minste één vak uit het geheel van:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel39
  - number: 39.7.a
    text: |-
      vakken, genoemd in het eerste onderscheidenlijk tweede lid, die de leerling niet op grond van het eerste tot en met
      zesde lid heeft gekozen, voor zover het bevoegd gezag deze vakken als onderdeel van het vrije deel aanbiedt,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel39
  - number: 39.7.b
    text: |-
      vakken, genoemd in of aangewezen op grond van het derde tot en met zesde lid, die de leerling niet op grond van
      het eerste tot en met zesde lid heeft gekozen, voor zover het bevoegd gezag deze vakken als onderdeel van het vrije
      deel aanbiedt,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel39
  - number: 39.7.c
    text: andere bij algemene maatregel van bestuur aan te wijzen vakken, voor zover het bevoegd gezag deze aanbiedt, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel39
  - number: 39.7.d
    text: door het bevoegd gezag vast te stellen vakken en andere programmaonderdelen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel39
  - number: '39.8'
    text: Het bevoegd gezag kan beslissen dat vakken en andere programmaonderdelen door alle leerlingen worden gevolgd.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel39
  - number: '40.1'
    text: 'Het gemeenschappelijk deel van elk profiel in het hoger algemeen voortgezet onderwijs omvat:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel40
  - number: 40.1.a
    text: Nederlandse taal en literatuur,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel40
  - number: 40.1.b
    text: Engelse taal en literatuur,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel40
  - number: 40.1.c
    text: maatschappijleer,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel40
  - number: 40.1.d
    text: culturele en kunstzinnige vorming, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel40
  - number: 40.1.e
    text: lichamelijke opvoeding.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel40
  - number: '40.2'
    text: 'Het profieldeel van het profiel natuur en techniek in het hoger algemeen voortgezet onderwijs omvat:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel40
  - number: 40.2.a
    text: wiskunde,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel40
  - number: 40.2.b
    text: natuurkunde,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel40
  - number: 40.2.c
    text: scheikunde, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel40
  - number: 40.2.d
    text: |-
      een vak ter keuze van de leerling uit vakken die bij algemene maatregel van bestuur zijn aangewezen, voor zover het
      bevoegd gezag deze vakken aanbiedt.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel40
  - number: '40.3'
    text: 'Het profieldeel van het profiel natuur en gezondheid in het hoger algemeen voortgezet onderwijs omvat:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel40
  - number: 40.3.a
    text: wiskunde,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel40
  - number: 40.3.b
    text: biologie,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel40
  - number: 40.3.c
    text: scheikunde, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel40
  - number: 40.3.d
    text: |-
      een vak ter keuze van de leerling uit vakken die bij algemene maatregel van bestuur zijn aangewezen, voor zover het
      bevoegd gezag deze vakken aanbiedt.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel40
  - number: '40.4'
    text: 'Het profieldeel van het profiel economie en maatschappij in het hoger algemeen voortgezet onderwijs omvat:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel40
  - number: 40.4.a
    text: wiskunde,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel40
  - number: 40.4.b
    text: economie,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel40
  - number: 40.4.c
    text: geschiedenis, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel40
  - number: 40.4.d
    text: |-
      een vak ter keuze van de leerling uit vakken die bij algemene maatregel van bestuur zijn aangewezen, voor zover het
      bevoegd gezag deze vakken aanbiedt.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel40
  - number: '40.5'
    text: 'Het profieldeel van het profiel cultuur en maatschappij in het hoger algemeen voortgezet onderwijs omvat:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel40
  - number: 40.5.a
    text: geschiedenis,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel40
