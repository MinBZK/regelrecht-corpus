  - number: '41'
    text: |-
      Bij algemene maatregel van bestuur wordt met betrekking tot de profielen, bedoeld in
      [artikel 38, tweede lid][ref1], vastgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel38
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '38'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 41.a
    text: |-
      het relatieve gewicht van elk van de vakken binnen het geheel van de vakken van het eindexamen, uitgedrukt in een
      normatieve studielast per vak,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel41
  - number: 41.b
    text: |-
      de nadere ordening van de vakken, genoemd in de [artikelen 39][ref1] en [40][ref2], met het oog op hun plaats in
      het gemeenschappelijk deel, het profieldeel of het vrije deel,


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel40
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '39'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '40'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 41.c
    text: |-
      voorschriften over vakken en andere programmaonderdelen, bedoeld in [artikel 39, zevende lid][ref1], en
      [artikel 40, zesde lid][ref2], die het bevoegd gezag aanwijst, behalve godsdienstonderwijs of levensbeschouwelijk
      vormingsonderwijs aan bijzondere scholen, en


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel40
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel41
    references:
      - id: ref1
