  - number: '83.2'
    text: |-
      Het bevoegd gezag kan voor ten hoogste de helft van het aantal, bestaande uit de rector of de directeur en de aan
      de school verbonden conrectoren of adjunct-directeuren, afwijken van het bepaalde in het eerste lid, onderdeel b.
