  - number: '80.3'
    text: |-
      Indien het bevoegd gezag een leraar benoemt of tewerkstelt zonder benoeming voor het geven van praktijkonderwijs
      als bedoeld in [artikel 31][ref1] in één of meer bij algemene maatregel van bestuur aan te wijzen vakken,
      volstaat in afwijking van het eerste lid, onderdeel b, onder 1°, het bezit van een getuigschrift krachtens
      de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2], waaruit blijkt dat ten aanzien van
      schoolonderwijs als bedoeld in [artikel 3, eerste lid, van de Wet primair onderwijs BES][ref3] is voldaan aan de
      bekwaamheidseisen die zijn vastgesteld krachtens [artikel 35 van die wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0005682
      [ref3]: https://wetten.overheid.nl/BWBR0030280#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0030280#Artikel35
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel80
    references:
      - id: ref1
