  - number: '123.5'
    text: De besluiten, bedoeld in het vierde en achtste lid, worden gepubliceerd in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel123
  - number: '123.6'
    text: |-
      Voor uitsluitend de controle of de gegevens uit de ouderverklaringen, bedoeld in
      [artikel 124a, vijfde lid, onderdeel a][ref1], juist en volledig zijn, maakt Onze Minister gebruik van het
      burgerservicenummer van een van de ouders en het kind waarop de ouderverklaring betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel124a
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: 124a
        paragraaf: '1'
        afdeling: I
  - number: '123.7'
    text: |-
      Onze Minister stelt op voordracht van de inspectie een kader vast waarin de werkwijze voor het advies, bedoeld
      in het derde lid, is vastgelegd. Deze werkwijze omvat in ieder geval een gesprek over de aanvraag met het bevoegd
      gezag dat de aanvraag heeft ingediend. Dit kader wordt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel123
  - number: '123.8'
    text: |-
      Onze Minister kan de aanvraag, bedoeld in het eerste lid, afwijzen indien de aanvraag is ingediend door een
      rechtspersoon, niet zijnde een openbaar lichaam, die reeds een of meer scholen of scholengemeenschappen in stand
      houdt en die een aanwijzing heeft ontvangen als bedoeld in [artikel 183, eerste lid][ref1], of waarvan een of meer
      van de bestuurders of toezichthouders deel uitmaakte of uitmaakt van een andere rechtspersoon die een dergelijke
      aanwijzing heeft ontvangen, welke aanwijzing onherroepelijk is geworden en ten tijde van de aanvraag nog geen vijf
      jaren oud is gerekend vanaf de ontvangst van het besluit tot toepassing van artikel 183, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel183
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '183'
        hoofdstuk: IV
        afdeling: III
  - number: '123.9'
    text: |-
      Het bestuurscollege van de beoogde plaats van vestiging van de school, scholengemeenschap of nevenvestiging kan
      voor de datum, genoemd in het eerste lid, bij Onze Minister een zienswijze naar voren brengen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel123
  - number: '124.1'
    text: |-
      Een aanvraag als bedoeld in [artikel 123, eerste lid][ref1], vermeldt:


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel123
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '123'
        paragraaf: '1'
        afdeling: I
  - number: 124.1.a
    text: de schoolsoort of schoolsoorten;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel124
  - number: 124.1.b
    text: of het openbaar of bijzonder onderwijs betreft; en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel124
  - number: 124.1.c
    text: de beoogde plaats van vestiging van de school of scholengemeenschap.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel124
  - number: '124.2'
    text: 'De aanvraag gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel124
  - number: 124.2.a
    text: een belangstellingsmeting;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel124
  - number: 124.2.b
    text: |-
      een beschrijving van het voorgenomen beleid over de kwaliteit van het onderwijs dat binnen de school,
      scholengemeenschap, nevenvestiging of het profiel bedoeld in [artikel 18, derde lid][ref1], of
      [artikel 29, derde lid][ref2], zal worden gevoerd, voor zover dit betreft de uitwerking van de wettelijke
      voorschriften voor:


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel29
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel124
