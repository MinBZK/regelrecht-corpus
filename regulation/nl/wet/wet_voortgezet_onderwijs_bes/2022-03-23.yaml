        artikel: '2'
  - number: '2.1'
    text: |-
      Het voortgezet onderwijs, bedoeld in deze wet, omvat het onderwijs dat wordt gegeven na het basisonderwijs. Het
      omvat niet educatie en beroepsonderwijs als bedoeld in de [Wet educatie en beroepsonderwijs BES][ref1] en het hoger
      onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0028395
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028395
  - number: '2.2'
    text: |-
      Het onderwijs wordt zodanig ingericht dat de leerlingen een ononderbroken ontwikkelingsproces kunnen doorlopen. Het
      wordt afgestemd op de voortgang in de ontwikkeling van de leerlingen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel2
  - number: '3'
    text: Voortgezet onderwijs mag slechts worden gegeven door degene die daartoe ingevolge deze wet bevoegd is.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel3
  - number: '4.1'
    text: |-
      Indien het bevoegd gezag op enigerlei wijze bekend is geworden dat een ten behoeve van zijn school met taken
      belast persoon zich mogelijk schuldig maakt of heeft gemaakt aan een misdrijf tegen de zeden als bedoeld
      in het [Tweede Boek, Titel XIV, van het Wetboek van Strafrecht BES][ref1] jegens een minderjarige leerling
      van de school, treedt het bevoegd gezag onverwijld in overleg met de vertrouwensinspecteur, bedoeld in
      [artikel 6 van de Wet op het onderwijstoezicht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028570
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel6
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028570
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '6'
  - number: '4.2'
    text: |-
      Indien uit het overleg, bedoeld in het eerste lid, moet worden geconcludeerd dat er sprake is van
      een redelijk vermoeden dat de desbetreffende persoon zich schuldig heeft gemaakt aan een misdrijf
      als bedoeld in het eerste lid jegens een minderjarige leerling van de school, doet het bevoegd
      gezag onverwijld aangifte bij een opsporingsambtenaar als bedoeld in [artikel 1][ref1] juncto
      [artikel 184 van het Wetboek van Strafvordering BES][ref2], en stelt het bevoegd gezag de vertrouwensinspecteur
      daarvan onverwijld in kennis. Voordat het bevoegd gezag overgaat tot het doen van aangifte, stelt het de ouders
      van de betrokken leerling, onderscheidenlijk de betreffende ten behoeve van de school met taken belaste persoon,
      hiervan op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel184
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '184'
  - number: '4.3'
    text: |-
      Indien een personeelslid op enigerlei wijze bekend is geworden dat een ten behoeve van de school met taken belast
      persoon zich mogelijk schuldig maakt of heeft gemaakt aan een misdrijf als bedoeld in het eerste lid jegens een
      minderjarige leerling van de school, stelt het personeelslid het bevoegd gezag daarvan onverwijld in kennis.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel4
  - number: 4a.1
    text: 'Het bevoegd gezag draagt zorg voor de veiligheid op school, waarbij het bevoegd gezag in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel4a
  - number: 4a.1.a
    text: beleid met betrekking tot de veiligheid voert,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel4a
  - number: 4a.1.b
    text: |-
      de veiligheid van leerlingen op school monitort met een instrument dat een representatief en actueel beeld geeft,
      en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel4a
  - number: 4a.1.c
    text: 'er zorg voor draagt dat bij een persoon ten minste de volgende taken zijn belegd:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel4a
  - number: 4a.1.c.1°
    text: het coördineren van het beleid in het kader van het tegengaan van pesten, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel4a
  - number: 4a.1.c.2°
    text: het fungeren als aanspreekpunt in het kader van pesten.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel4a
  - number: 4a.2
    text: |-
      Onder veiligheid, bedoeld in het eerste lid, wordt verstaan de sociale, psychische en fysieke veiligheid van
      leerlingen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel4a
  - number: 4a.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over het instrument, bedoeld in het
      eerste lid, onderdeel b, dat door de school wordt vormgegeven of gekozen, waaronder:
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel4a
  - number: 4a.3.a
    text: de aandachtsgebieden die het instrument inzichtelijk maakt,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel4a
  - number: 4a.3.b
    text: de representativiteit van het instrument, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel4a
  - number: 4a.3.c
    text: de frequentie waarmee het instrument wordt ingezet.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel4a
  - number: '5.1'
    text: |-
      Ten behoeve van het schoolbezoek verstrekt het bestuurscollege aan ouders van in het openbaar lichaam verblijvende
      leerlingen die wegens hun lichamelijke, verstandelijke of zintuiglijke handicap niet zelfstandig van vervoer
      gebruik kunnen maken, op aanvraag vergoeding van de door het bestuurscollege noodzakelijk te achten vervoerskosten.
      Indien de leerling meerderjarig en handelingsbekwaam is, wordt de vergoeding op aanvraag verstrekt aan de leerling.
      De eilandsraad stelt daartoe een nadere regeling vast, met inachtneming van het bepaalde in de volgende leden.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel5
  - number: '5.2'
    text: De regeling maakt geen onderscheid tussen openbaar en bijzonder onderwijs.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel5
  - number: '5.3'
    text: |-
      De regeling eerbiedigt de op godsdienst of levensbeschouwing van de ouders, dan wel, indien de leerling
      meerderjarig en handelingsbekwaam is, van de leerling berustende keuze van een school.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel5
  - number: '5.4'
    text: |-
      De regeling voorziet erin dat het vervoer kan plaatsvinden op een wijze die voor de leerling passend is. De
      regeling bepaalt op welke wijze het bestuurscollege ter zake advies van deskundigen inwint.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel5
  - number: '5.5'
    text: |-
      De regeling bepaalt dat de kosten worden vergoed van vervoer over de afstand tussen de woning van de leerling
      en de dichtstbijzijnde voor de leerling toegankelijke school, met inachtneming van de keuze van de ouders, dan
      wel, indien de leerling meerderjarig en handelingsbekwaam is, van de leerling, tenzij vervoer met betrekking
      tot een verder weg gelegen school voor het openbaar lichaam minder kosten met zich zou brengen en de ouders
      onderscheidenlijk de leerling met het vervoer naar die school instemmen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel5
  - number: '5.6'
    text: |-
      De regeling kan bepalen dat het openbaar lichaam, in plaats van vergoeding in geld te geven, het vervoer verzorgt
      of doet verzorgen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel5
  - number: '5.7'
    text: |-
      De regeling kan bepalen dat het bestuurscollege in bijzondere gevallen de bevoegdheid heeft ten gunste van de
      ouders, dan wel, indien de leerling meerderjarig en handelingsbekwaam is, ten gunste van de leerling van de inhoud
      van de regeling af te wijken.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel5
  - number: '6'
    text: 'Het voortgezet onderwijs wordt onderscheiden in:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel6
  - number: 6.a
    text: voorbereidend wetenschappelijk onderwijs;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel6
  - number: 6.b
    text: hoger en middelbaar algemeen voortgezet onderwijs;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel6
  - number: 6.c
    text: voorbereidend beroepsonderwijs;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel6
  - number: 6.d
    text: praktijkonderwijs;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel6
  - number: 6.e
    text: andere vormen van voortgezet onderwijs.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel6
  - number: '7'
    text: |-
      De bepalingen van de [hoofdstukken I][ref1] en [II][ref2] van deze afdeling regelen het openbaar schoolonderwijs;
      de bepalingen van de hoofdstukken I en [III][ref3] zijn voorwaarden voor bekostiging van het bijzonder
      schoolonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#HoofdstukI
      [ref2]: https://wetten.overheid.nl/BWBR0030284#HoofdstukII
      [ref3]: https://wetten.overheid.nl/BWBR0030284#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0030284
        hoofdstuk: I
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        hoofdstuk: II
        afdeling: I
      - id: ref3
        bwb_id: BWBR0030284
        hoofdstuk: III
        afdeling: I
  - number: '8'
    text: |-
      Het onderwijs wordt gegeven en de examens worden afgenomen in het Nederlands. In afwijking van de eerste volzin kan
      een andere taal worden gebezigd:
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel8
  - number: 8.a
    text: wanneer het onderwijs met betrekking tot die taal betreft,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel8
  - number: 8.b
    text: |-
      wanneer het praktijkonderwijs als bedoeld in [artikel 31][ref1] betreft, of


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel31
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '31'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 8.c
    text: |-
      indien de specifieke aard, de inrichting of de kwaliteit van het onderwijs dan wel de herkomst van de leerlingen
      daartoe noodzaakt, overeenkomstig een door het bevoegd gezag vastgestelde gedragscode. De gedragscode wordt
      toegezonden aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel8
  - number: '9'
    text: |-
      Het onderwijs wordt zodanig ingericht dat leerlingen die in verband met ziekte thuis verblijven dan wel zijn
      opgenomen in een ziekenhuis, op adequate wijze voldoende onderwijs kunnen genieten.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel9
  - number: '10.1'
    text: |-
      Scholen dragen zorg voor een optimale aansluiting van leerlingen met een moedertaal die niet overeenkomt met de op
      de school gehanteerde instructietaal.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel10
  - number: '10.2'
    text: |-
      Het onderwijs wordt zodanig ingericht dat daarbij op structurele en herkenbare wijze aandacht wordt besteed aan het
      bestrijden van achterstanden in het bijzonder in de beheersing van de Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel10
  - number: '11'
    text: |-
      Onderwijs in lichamelijke opvoeding, bestaande uit praktische bewegingsactiviteiten, wordt gespreid verzorgd
      over alle leerjaren van het voortgezet onderwijs. Dit onderwijs vindt plaats gespreid over de schoolweken, en in
      zodanige substantiële omvang en schooltijd dat wordt voldaan aan de eisen op het gebied van kwaliteit, intensiteit
      en variëteit van de bewegingsactiviteiten neergelegd in kerndoelen en examenprogramma’s. In afwijking van de
      tweede volzin geldt voor het laatste leerjaar het voorschrift, dat het onderwijs in het eindexamenvak lichamelijke
      opvoeding niet eerder mag worden afgesloten dan in de maand december.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel11
  - number: '12.1'
    text: Het bevoegd gezag stelt elk leerjaar om niet aan een leerling lesmateriaal ter beschikking.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel12
  - number: '12.2'
    text: |-
      Onder lesmateriaal wordt verstaan: lesmateriaal dat naar vorm en inhoud is gericht op informatieoverdracht in
      onderwijsleersituaties en waarvan het gebruik binnen het onderwijsaanbod door het bevoegd gezag specifiek voor het
      desbetreffende leerjaar is voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel12
  - number: 12a.1
    text: |-
      Voorbereidend wetenschappelijk onderwijs aan scholen als bedoeld in [artikel 13][ref1], omvat ten minste 5.700
      klokuren.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel13
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '13'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 12a.2
    text: 'Hoger algemeen voortgezet onderwijs:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel12a
  - number: 12a.2.a
    text: |-
      aan scholen als bedoeld in [artikel 14, onderdeel a][ref1], omvat ten minste 4.700 klokuren;


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel14
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '14'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 12a.2.b
    text: |-
      aan afdelingen als bedoeld in [artikel 14, onderdeel b][ref1], omvat ten minste 1.700 klokuren.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel14
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '14'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 12a.3
    text: |-
      Middelbaar algemeen voortgezet onderwijs aan scholen als bedoeld in [artikel 15][ref1], omvat ten minste 3.700
      klokuren.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel15
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '15'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 12a.4
    text: |-
      Voorbereidend beroepsonderwijs aan scholen als bedoeld in [artikel 17][ref1], omvat ten minste 3.700 klokuren.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel17
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '17'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 12a.5
    text: |-
      Het bevoegd gezag kan de uren, bedoeld in het derde of vierde lid, invullen met activiteiten die worden verzorgd
      in het onderwijsprogramma als bedoeld in [artikel 27a, tweede lid][ref1], [of 27l, tweede lid][ref2], voor zover
      het leerlingen betreft die een doorlopende leerroute vmbo-mbo of een geïntegreerde route vmbo-basisberoepsopleiding
      volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel27a
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel27l
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: 27a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: 27l
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 12a.6
    text: |-
      Het bevoegd gezag vult de uren in met activiteiten die worden verzorgd in een onderwijsprogramma als bedoeld in
      de [artikelen 16, tweede lid][ref1], [18, tweede lid][ref2], [29, tweede lid][ref3], [35, eerste lid][ref4] en
      [38, vijfde lid, tweede volzin][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0030284#Artikel35
      [ref5]: https://wetten.overheid.nl/BWBR0030284#Artikel38
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '16'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '18'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '29'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0030284
        artikel: '35'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref5
        bwb_id: BWBR0030284
        artikel: '38'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 12a.6
    text: |-
      Het bevoegd gezag beschikt over geordende gegevens over die invulling en over de spreiding van de uren over de
      verschillende leerjaren.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel12a
  - number: 12b.1
    text: In elk schooljaar wordt op ten minste 189 dagen onderwijs verzorgd.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel12b
  - number: 12b.2
    text: |-
      In afwijking van het in het eerste lid genoemde aantal dagen behoeft in het laatste leerjaar geen onderwijs te
      worden verzorgd vanaf de aanvang van het eerste tijdvak waarin het centraal eindexamen wordt afgenomen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel12b
  - number: 12b.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gesteld omtrent vakanties en andere
      dagen waarop geen onderwijs behoeft te worden verzorgd.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel12b
  - number: 12b.4
    text: |-
      Bij ministeriële regeling kunnen begin en eind van vakanties worden vastgesteld, die niet voor alle scholen gelijk
      behoeven te zijn. Daarbij kan het aantal dagen, genoemd in het eerste lid, voor een daarbij aan te geven groep
      scholen, hoger of lager worden vastgesteld indien dit noodzakelijk is in verband met de spreiding van de landelijk
      vastgestelde vakantie over verschillende delen van Nederland.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel12b
  - number: '13.1'
    text: |-
      Voorbereidend wetenschappelijk onderwijs is het onderwijs dat is ingericht ter voorbereiding op aansluitend
      wetenschappelijk onderwijs en dat mede algemene vorming omvat. Voorbereidend wetenschappelijk onderwijs wordt
      gegeven aan scholen voor voorbereidend wetenschappelijk onderwijs. Deze worden onderscheiden in gymnasia en
      athenea, elk met een cursusduur van zes jaren.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel13
  - number: '13.2'
    text: Aan de gymnasia wordt in elk geval onderwijs verzorgd in Latijnse taal en cultuur en Griekse taal en cultuur.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel13
  - number: '14'
    text: |-
      Hoger algemeen voortgezet onderwijs is het onderwijs dat is ingericht ter voorbereiding op aansluitend hoger
      beroepsonderwijs en dat mede algemene vorming omvat. Het hoger algemeen voortgezet onderwijs wordt gegeven:
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel14
  - number: 14.a
    text: aan scholen met een cursusduur van vijf jaren;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel14
  - number: 14.b
    text: |-
      aan afdelingen van scholen voor middelbaar algemeen voortgezet onderwijs. Deze hebben een cursusduur van twee jaren
      en vangen aan na vier jaren middelbaar algemeen voortgezet onderwijs.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel14
  - number: '15'
    text: |-
      Middelbaar algemeen voortgezet onderwijs is het onderwijs dat is ingericht ter voorbereiding op aansluitend
      beroepsonderwijs dan wel op hoger algemeen voortgezet onderwijs, en dat mede algemene vorming omvat. Het middelbaar
      algemeen voortgezet onderwijs wordt gegeven aan scholen met een cursusduur van vier jaren.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel15
  - number: '16.1'
    text: Aan scholen voor middelbaar algemeen voortgezet onderwijs wordt onderwijs in de theoretische leerweg gegeven.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel16
  - number: '16.2'
    text: |-
      Het onderwijs aan scholen voor middelbaar algemeen voortgezet onderwijs is met ingang van het derde leerjaar
      ingericht volgens profielen. Een profiel is een in schooltijd verzorgd samenhangend onderwijsprogramma, zodanig
      ingericht dat het biedt:
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel16
  - number: 16.2.a
    text: een algemene maatschappelijke voorbereiding en persoonlijke vorming,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel16
  - number: 16.2.b
    text: een voorbereiding op naar inhoud verwante opleidingen in het aansluitend beroepsonderwijs, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel16
  - number: 16.2.c
    text: een voorbereiding op het hoger algemeen voortgezet onderwijs.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel16
  - number: '16.3'
    text: 'De school verzorgt een of meer profielen. De profielen zijn:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel16
  - number: 16.3.a
    text: techniek,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel16
  - number: 16.3.b
    text: zorg en welzijn,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel16
  - number: 16.3.c
    text: economie, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel16
  - number: 16.3.d
    text: groen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel16
  - number: '16.4'
    text: 'Elk profiel bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel16
  - number: 16.4.a
    text: een gemeenschappelijk deel, dat voor alle profielen gelijk is,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel16
  - number: 16.4.b
    text: een profieldeel, dat kenmerkend is voor dat profiel, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel16
  - number: 16.4.c
    text: een vrij deel, dat bestaat uit door de leerling te kiezen vakken en andere programma-onderdelen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel16
  - number: '16.5'
    text: |-
      Het gemeenschappelijk deel van elk profiel in de theoretische leerweg omvat Nederlandse taal, Engelse taal,
      maatschappijleer, lichamelijke opvoeding en ten minste één van de vakken behorende tot de beeldende vorming,
      muziek, dans of drama.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel16
  - number: '16.6'
    text: 'Het profieldeel van de theoretische leerweg omvat wat betreft:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel16
  - number: 16.6.a
    text: 'het profiel techniek: wiskunde en natuur- en scheikunde I,'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel16
  - number: 16.6.b
    text: |-
      het profiel zorg en welzijn: biologie en, ter keuze van de leerling, wiskunde, maatschappijkunde, geschiedenis en
      staatsinrichting, of aardrijkskunde, met dien verstande dat het bevoegd gezag beslist welke van de laatste drie
      vakken wordt of worden aangeboden,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel16
  - number: 16.6.c
    text: 'het profiel economie: economie en, ter keuze van de leerling, wiskunde, Spaanse taal of Franse taal,'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel16
  - number: 16.6.d
    text: 'het profiel groen: wiskunde en, ter keuze van de leerling, biologie of natuur- en scheikunde I.'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel16
  - number: '16.7'
    text: 'Het vrije deel van de theoretische leerweg:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel16
  - number: 16.7.a
    text: omvat door de leerling te kiezen vakken, genoemd in het zesde lid,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel16
  - number: 16.7.b
    text: |-
      kan omvatten natuur- en scheikunde II, Papiaments, Duitse taal, vakken behorende tot de beeldende vorming, muziek,
      dans, drama, lichamelijke opvoeding 2 en informatietechnologie, door de leerling te kiezen, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel16
  - number: 16.7.c
    text: kan omvatten door het bevoegd gezag vast te stellen vakken en programmaonderdelen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel16
  - number: 16.7a
    text: |-
      Het bevoegd gezag stelt de leerling in de gelegenheid om, indien de leerling dat wenst, naast het
      onderwijsprogramma, bestaande uit de in het vierde lid bedoelde delen, beroepsgerichte keuzevakken als bedoeld in
      [artikel 29][ref1] te volgen. Het achtste en tiende lid van artikel 29 zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel29
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '29'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '16.8'
    text: |-
      Het bevoegd gezag beslist welke keuzetaal, genoemd in het zesde lid, onderdeel c, en welke vakken, genoemd in het
      zevende lid, onderdeel b, worden aangeboden. Het bevoegd gezag kan tevens beslissen dat door het bevoegd gezag aan
      te wijzen vakken en andere programmaonderdelen, bedoeld in het zevende lid, onderdeel c, door alle leerlingen in
      het vrije deel moeten worden gevolgd.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel16
  - number: '16.9'
    text: |-
      Het bevoegd gezag kan de leerling in de gelegenheid stellen, in plaats van de vakken, genoemd in het vijfde,
      zesde en zevende lid, onderdeel b, de overeenkomstige vakken, genoemd in dan wel aangewezen op grond van de
      [artikelen 39][ref1] en [40][ref2] te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel40
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '39'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '40'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '16.10'
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften vastgesteld over de mogelijkheid van vrijstelling en de
      bevoegdheid van het bevoegd gezag om ontheffing te verlenen van onderdelen van dit artikel. Onverminderd het zesde
      en zevende lid, kan bij algemene maatregel van bestuur worden vastgesteld het door alle leerlingen in het derde
      leerjaar te volgen minimum aantal vakken waarin eindexamen kan worden afgelegd, alsmede welke vakken het betreft.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel16
  - number: '17'
    text: |-
      Voorbereidend beroepsonderwijs is het onderwijs dat is ingericht ter voorbereiding op aansluitend beroepsonderwijs,
      bedoeld in [artikel 7.2.2, eerste lid, onderdelen b, c en d, van de Wet educatie en beroepsonderwijs BES][ref1] en
      dat mede algemene vorming omvat. Het voorbereidend beroepsonderwijs wordt gegeven aan scholen met een cursusduur
      van vier jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
  - number: '18.1'
    text: |-
      Aan scholen voor voorbereidend beroepsonderwijs wordt, in elk profiel als bedoeld in het derde lid, onderwijs in de
      basisberoepsgerichte leerweg en de kaderberoepsgerichte leerweg gegeven.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel18
  - number: '18.2'
    text: |-
      Het onderwijs aan scholen voor voorbereidend beroepsonderwijs is met ingang van het derde leerjaar ingericht
      volgens profielen. Een profiel is een in schooltijd verzorgd samenhangend onderwijsprogramma, zodanig ingericht dat
      het biedt:
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel18
  - number: 18.2.a
    text: een algemene maatschappelijke voorbereiding en persoonlijke vorming, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel18
  - number: 18.2.b
    text: een voorbereiding op naar inhoud verwante opleidingen in het aansluitend beroepsonderwijs.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel18
  - number: '18.3'
    text: 'De school verzorgt één of meer profielen. De profielen zijn:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel18
  - number: 18.3.a
    text: bouwen, wonen en interieur,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel18
  - number: 18.3.b
    text: produceren, installeren en energie,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel18
  - number: 18.3.c
    text: mobiliteit en transport,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel18
  - number: 18.3.d
    text: media, vormgeving en ICT,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel18
  - number: 18.3.e
    text: maritiem en techniek,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel18
  - number: 18.3.f
    text: zorg en welzijn,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel18
  - number: 18.3.g
    text: economie en ondernemen,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel18
  - number: 18.3.h
    text: horeca, bakkerij en recreatie,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel18
  - number: 18.3.i
    text: groen,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel18
  - number: 18.3.j
    text: dienstverlening en producten.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel18
  - number: '18.4'
    text: 'Elk profiel bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel18
  - number: 18.4.a
    text: een gemeenschappelijk deel, dat voor alle profielen gelijk is,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel18
  - number: 18.4.b
    text: een profieldeel, dat kenmerkend is voor dat profiel, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel18
  - number: 18.4.c
    text: een vrij deel, dat bestaat uit door de leerling te kiezen vakken en andere programma-onderdelen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel18
  - number: '18.5'
    text: |-
      Het gemeenschappelijk deel van elk profiel in de beroepsgerichte leerwegen omvat Nederlandse taal, Engelse taal,
      maatschappijleer, lichamelijke opvoeding en ten minste één van de vakken behorende tot de beeldende vorming,
      muziek, dans of drama.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel18
  - number: '18.6'
    text: |-
      Het profieldeel van de beroepsgerichte leerwegen omvat het bij het betreffende profiel behorend profielvak en,
      wat betreft:
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel18
  - number: 18.6.a
    text: 'de profielen, genoemd in het derde lid, onderdelen a tot en met e: wiskunde en natuur- en scheikunde I,'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel18
  - number: 18.6.b
    text: |-
      het profiel, genoemd in het derde lid, onderdeel f: biologie en, ter keuze van de leerling, wiskunde,
      maatschappijkunde, geschiedenis en staatsinrichting, of aardrijkskunde, met dien verstande dat het bevoegd gezag
      beslist welke van de laatste drie vakken wordt of worden aangeboden,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel18
  - number: 18.6.c
    text: |-
      de profielen, genoemd in het derde lid, onderdelen g en h: economie en, ter keuze van de leerling, wiskunde,
      Spaanse taal of Franse taal,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel18
  - number: 18.6.d
    text: |-
      het profiel genoemd in het derde lid, onderdeel i: wiskunde en, ter keuze van de leerling, biologie of natuur- en
      scheikunde I,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel18
  - number: 18.6.e
    text: |-
      het profiel genoemd in het derde lid, onderdeel j: ter keuze van de leerling twee van de vakken wiskunde, economie,
      biologie en natuur- en scheikunde I.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel18
  - number: '18.7'
    text: 'Het vrije deel van elk profiel in de beroepsgerichte leerwegen:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel18
  - number: 18.7.a
    text: omvat door de leerling te kiezen beroepsgerichte keuzevakken,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel18
  - number: 18.7.b
    text: kan omvatten door het bevoegd gezag vast te stellen vakken en programma-onderdelen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel18
  - number: '18.8'
    text: |-
      Het bevoegd gezag beslist welke keuzetaal, genoemd in het zesde lid, onderdeel c, en welke beroepsgerichte
      keuzevakken, bedoeld in het zevende lid, onderdeel a, worden aangeboden. Het bevoegd gezag kan tevens beslissen dat
      door het bevoegd gezag aan te wijzen vakken en andere programma-onderdelen, bedoeld in het zevende lid, onderdeel
      b, door alle leerlingen in het vrije deel moeten worden gevolgd.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel18
  - number: '18.9'
    text: 'Het bevoegd gezag kan de leerling in de gelegenheid stellen:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel18
  - number: 18.9.a
    text: |-
      in plaats van de vakken van de basisberoepsgerichte leerweg, genoemd in het vijfde en zesde lid, en de vakken
      die in de plaats komen van een tweede moderne vreemde taal, de overeenkomstige vakken van de kaderberoepsgerichte
      leerweg of de overeenkomstige vakken, genoemd in de [artikelen 16][ref1] en [29][ref2] of de overeenkomstige
      vakken, genoemd in dan wel aangewezen op grond van de [artikelen 39][ref3] en [40][ref4] te volgen,


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel39
      [ref4]: https://wetten.overheid.nl/BWBR0030284#Artikel40
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '16'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '29'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '39'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0030284
        artikel: '40'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 18.9.b
    text: |-
      in plaats van de vakken van de kaderberoepsgerichte leerweg, genoemd in het vijfde en zesde lid, en de
      vakken die in de plaats komen van een tweede moderne vreemde taal, de overeenkomstige vakken, genoemd in de
      [artikelen 16][ref1] en [29][ref2] of de overeenkomstige vakken, genoemd in dan wel aangewezen op grond van de
      [artikelen 39][ref3] en [40][ref4] te volgen,


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel39
      [ref4]: https://wetten.overheid.nl/BWBR0030284#Artikel40
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '16'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '29'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '39'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0030284
        artikel: '40'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 18.9.c
    text: |-
      in plaats van de vakken van de basisberoepsgerichte leerweg, genoemd in het zevende lid, onderdeel a, de
      overeenkomstige vakken van de kaderberoepsgerichte leerweg te volgen,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel18
  - number: 18.9.d
    text: een of meer bij algemene maatregel van bestuur aan te wijzen extra vakken te volgen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel18
  - number: '18.10'
    text: 'Bij of krachtens algemene maatregel van bestuur worden vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel18
  - number: 18.10.a
    text: de profielvakken, bedoeld in het zesde lid,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel18
  - number: 18.10.b
    text: voorschriften met betrekking tot de beroepsgerichte keuzevakken, bedoeld in het zevende lid, onderdeel a, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel18
  - number: 18.10.c
    text: |-
      voorschriften over de mogelijkheid van vrijstelling en de bevoegdheid van het bevoegd gezag om ontheffing te
      verlenen van onderdelen van dit artikel.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel18
  - number: '18.11'
    text: |-
      Onverminderd het zesde en zevende lid, kan bij algemene maatregel van bestuur worden vastgesteld het door alle
      leerlingen in het derde leerjaar te volgen minimum aantal vakken waarin eindexamen kan worden afgelegd, alsmede
      welke vakken het betreft.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel18
  - number: '19.1'
    text: |-
      Het bevoegd gezag kan de basisberoepsgerichte leerweg mede inrichten als leer-werktraject. Een leer-
      werktraject is een leerroute binnen de basisberoepsgerichte leerweg met een buitenschools praktijkgedeelte
      dat ten minste 640 klokuren, verzorgd in 80 dagen, en ten hoogste 1 280 klokuren, verzorgd in 160 dagen,
      omvat van de gezamenlijke onderwijstijd van het derde en vierde leerjaar en welk traject specifiek is
      gericht op het behalen van een startkwalificatie op het niveau van de basisberoepsopleiding, bedoeld in
      [artikel 7.2.2, eerste lid, onder b, van de Wet educatie en beroepsonderwijs BES][ref1]. Elke schoolweek in het
      derde en vierde leerjaar omvat ten minste binnenschools onderricht.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
  - number: '19.2'
    text: 'Een leer-werktraject omvat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel19
  - number: 19.2.a
    text: Nederlandse taal, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel19
  - number: 19.2.b
    text: een beroepsgericht programma.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel19
  - number: '19.3'
    text: |-
      Het bevoegd gezag kan, na overleg met de leerling of diens wettelijk vertegenwoordiger, beslissen dat het leer-
      werktraject voor die leerling eveneens een of meer andere vakken van de basisberoepsgerichte leerweg omvat.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel19
  - number: '20'
    text: 'Het bevoegd gezag stelt bij de inrichting van het leer-werktraject in elk geval vast:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel20
  - number: 20.a
    text: |-
      de organisatie van de leerlingbegeleiding vanwege het bevoegd gezag zowel binnen de school als bij het bedrijf dat
      of de organisatie die het buitenschoolse praktijkgedeelte verzorgt, alsmede
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel20
  - number: 20.b
    text: |-
      de invulling van het buitenschoolse praktijkgedeelte en waarborgt daarbij dat niet uitsluitend eenzijdige
      productiearbeid wordt verricht.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel20
  - number: '21.1'
    text: |-
      Het buitenschoolse praktijkgedeelte wordt verzorgd door een bedrijf of organisatie, op grondslag van
      een leer-werkovereenkomst, gesloten door het bevoegd gezag, de betrokken leerling of diens wettelijk
      vertegenwoordiger, dat bedrijf of die organisatie, en de Raad onderwijs arbeidsmarkt, geregeld in de
      [Wet educatie en beroepsonderwijs BES][ref1], dat daarmee verklaart:


      [ref1]: https://wetten.overheid.nl/BWBR0028395
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0028395
  - number: 21.1.a
    text: |-
      dat het een bedrijf of organisatie betreft dat respectievelijk die voldoet aan de kwaliteitscriteria, genoemd in
      [artikel 24][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel24
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '24'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 21.1.b
    text: voor zover van toepassing, dat de gronden voor dat kwaliteitsoordeel nog steeds aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel21
  - number: '21.2'
    text: 'De leer-werkovereenkomst regelt de rechten en plichten van partijen en omvat ten minste bepalingen over:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel21
  - number: 21.2.a
    text: inhoud, leerdoelen, duur, periode van en beoordelingsmaatstaven voor het buitenschoolse praktijkgedeelte,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel21
  - number: 21.2.b
    text: de begeleiding van de leerling, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel21
  - number: 21.2.c
    text: de gevallen waarin en de wijze waarop de overeenkomst voortijdig kan worden ontbonden.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel21
  - number: '21.3'
    text: |-
      In afwijking van [Boek 7A, artikel 1613c, eerste lid, van het Burgerlijk Wetboek BES][ref1], is in geval van strijd
      als bedoeld in dat artikel, [artikel 21][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1613c
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel21
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1613c
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '21'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '22.1'
    text: |-
      Het bedrijf dat of de organisatie die het buitenschoolse gedeelte verzorgt, draagt zorg voor de begeleiding van de
      leerlingen binnen het bedrijf respectievelijk de organisatie.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel22
  - number: '22.2'
    text: |-
      De Raad onderwijs arbeidsmarkt draagt zorg voor een regelmatige beoordeling van bedrijven en organisaties die
      het buitenschoolse praktijkgedeelte verzorgen, aan de hand van de eisen in [artikel 24][ref1]. Hij draagt zorg
      voor openbaarmaking van een overzicht van bedrijven en organisaties met een gunstige beoordeling op grond van de
      eerste volzin. Tot het verzorgen van het buitenschoolse praktijkgedeelte zijn uitsluitend bevoegd de bedrijven en
      organisaties met een gunstige beoordeling op grond van die volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel24
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '24'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '22.3'
    text: |-
      Indien het bevoegd gezag na het sluiten van de leer-werkovereenkomst vaststelt dat de praktijkplaats niet of niet
      volledig beschikbaar is, de begeleiding tekortschiet of ontbreekt, of sprake is van andere omstandigheden die
      maken dat het buitenschoolse praktijkgedeelte niet naar behoren zal kunnen worden verzorgd, bevordert het bevoegd
      gezag, na overleg met de Raad onderwijs arbeidsmarkt, dat een toereikende vervangende voorziening beschikbaar wordt
      gesteld.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel22
  - number: '23.1'
    text: |-
      Onze Minister kan aan een Raad onderwijs arbeidsmarkt subsidie verstrekken ten behoeve van zijn in
      [artikel 22][ref1] geregelde taken. Bij ministeriële regeling worden regels gesteld omtrent de wijze van
      subsidiëring.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel22
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '22'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '23.2'
    text: |-
      De [titels 4.1][ref1] en [4.2 van de Algemene wet bestuursrecht][ref2] en de
      [artikelen 4 tot en met 19 van de Wet overige OCW-subsidies][ref3] zijn van toepassing op de subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537
      [ref3]: https://wetten.overheid.nl/BWBR0009458#Artikel4
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0005537
      - id: ref3
        bwb_id: BWBR0009458
        artikel: '4'
  - number: '24.1'
    text: |-
      Tot het verzorgen van het buitenschoolse praktijkgedeelte zijn uitsluitend bevoegd bedrijven en organisaties ten
      aanzien waarvan wordt voldaan aan de volgende eisen:
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel24
  - number: 24.1.a
    text: |-
      op de leer-werkplek of combinatie van leer-werkplekken kunnen de door het bevoegd gezag vastgestelde
      praktijkopdrachten daadwerkelijk worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel24
  - number: 24.1.b
    text: elke praktijkopdracht als zodanig kan in één bedrijf of organisatie worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel24
  - number: 24.1.c
    text: |-
      in het bedrijf of de organisatie is een gekwalificeerde praktijkbegeleider of leermeester aanwezig, die in staat is
      om kennis, inzicht en vaardigheden van de leerling te beoordelen, alsmede vorderingen daarin, en de leerling zowel
      werkinhoudelijk als pedagogisch-didactisch te begeleiden;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel24
  - number: 24.1.d
    text: |-
      het bedrijf of de organisatie is bereid met de in het tweede lid bedoelde mentor of docentbegeleider contact te
      onderhouden;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel24
  - number: 24.1.e
    text: |-
      de mogelijkheid om binnen hetzelfde bedrijf of dezelfde organisatie, dezelfde moederorganisatie of dezelfde branche
      de leerdoelen van het voorbereidend middelbaar beroepsonderwijs en de eindtermen van de assistentopleiding of
      basisberoepsopleiding te behalen, zonder grote overgangsdrempels voor de leerling;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel24
  - number: 24.1.f
    text: |-
      het bedrijf of de organisatie waarborgt dat een gekwalificeerde praktijkbegeleider of leermeester is gekoppeld
      aan een leerling, en dat deze leermeester ervoor zorgt dat de leerling voldoende hulp en tijd krijgt om de
      praktijkopdrachten uit te voeren;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel24
  - number: 24.1.g
    text: |-
      het productie- of dienstverleningsproces is technisch en organisatorisch voldoende gevarieerd en kan leerlingen
      goed praktijkmateriaal bieden en hen gedegen opleiden;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel24
  - number: 24.1.h
    text: de leer-werkplek past binnen de dagelijkse bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel24
  - number: 24.1.i
    text: |-
      het bedrijf of de organisatie is bereid de leerling de vereiste praktijkopdrachten uit te laten voeren en het werk
      en het stageverslag te bespreken en te beoordelen;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel24
  - number: 24.1.j
    text: |-
      het bedrijf of de organisatie is geschikt voor de betrokken leeftijdsgroep waar het gaat om onder meer ruimte om te
      leren of fouten te maken, erkenning van jong zijn;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel24
  - number: 24.1.k
    text: |-
      het bedrijf of de organisatie respecteert, voor zover van toepassing, het multiculturele karakter van de
      leerlingenpopulatie.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel24
  - number: '24.2'
    text: |-
      Het bevoegd gezag draagt zorg voor beschikbaarheid van een gekwalificeerde mentor of docentbegeleider die de
      voortgang op de leer-werkplek alsmede de integratie tussen het binnenschools en buitenschools programma bewaakt.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel24
  - number: '25.1'
    text: |-
      Leer-werktrajecten worden verzorgd op grondslag van een samenwerkingsovereenkomst tussen
      het bevoegd gezag van de school en het bevoegd gezag van een instelling als bedoeld in de
      [Wet educatie en beroepsonderwijs BES][ref1], voor zover aan die instelling een basisberoepsopleiding als bedoeld
      in [artikel 7.2.2, eerste lid, onder b, van die wet][ref2] wordt verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0028395
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0028395
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '7'
  - number: '25.2'
    text: |-
      Een samenwerkingsovereenkomst als bedoeld in het eerste lid voorziet in elk geval in de
      inrichting van een doorlopende leerweg tot en met de basisberoepsopleiding, bedoeld in
      [artikel 7.2.2, eerste lid, onder b, van de Wet educatie en beroepsonderwijs BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
  - number: '26.1'
    text: |-
      Het bevoegd gezag kan bij de school ingeschreven leerlingen die daarbij naar zijn
      oordeel gebaat zijn, in de gelegenheid stellen om geheel of gedeeltelijk in plaats van
      de basisberoepsgerichte leerweg een assistentopleiding te volgen, met inachtneming van de
      [artikelen 7.2.6][ref1] en [8.1.1, zesde lid, van de Wet educatie en beroepsonderwijs BES][ref2].
      [Artikel 18, tweede lid, tweede volzin][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel18
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '18'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '26.2'
    text: |-
      De assistentopleiding stemt overeen met het programma-aanbod van de beroepsgerichte programma’s van de
      basisberoepsgerichte leerweg die aan de school wordt verzorgd.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel26
  - number: '26.3'
    text: |-
      Het bevoegd gezag is niet gehouden, leerlingen die een assistentopleiding volgen als bedoeld in het eerste lid,
      gelegenheid te geven om aan de school een eindexamen in de basisberoepsgerichte leerweg af te leggen als bedoeld in
      [artikel 72, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel72
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '72'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: '26.4'
    text: |-
      Leerlingen die een assistentopleiding volgen als bedoeld in het eerste lid, worden aangemerkt als leerlingen van de
      basisberoepsgerichte leerweg waarvoor de assistentopleiding geheel of gedeeltelijk in de plaats treedt.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel26
  - number: '26.5'
    text: |-
      Ten aanzien van bij de school ingeschreven leerlingen jonger dan 16 jaar wordt de assistentopleiding verzorgd met
      inachtneming van de volgende vereisten:
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel26
  - number: 26.5.a
    text: |-
      de beroepspraktijkvorming, bedoeld in de [artikelen 7.2.7][ref1] en
      [7.2.8 van de Wet educatie en beroepsonderwijs BES][ref2], omvat uitsluitend het verrichten van lichte arbeid van
      geschikte aard,


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '7'
  - number: 26.5.b
    text: |-
      in plaats van de basisberoepsgerichte leerweg wordt geheel of gedeeltelijk zowel binnenschools als buitenschools
      onderricht in de praktijk van het beroep verzorgd,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel26
  - number: 26.5.c
    text: |-
      een gekwalificeerde mentor of docentbegeleider bewaakt de voortgang van het onderricht in de praktijk van het
      beroep, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel26
  - number: 26.5.d
    text: het binnenschools en buitenschools onderricht in de praktijk van het beroep worden geïntegreerd verzorgd.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel26
  - number: '27.1'
    text: |-
      De assistentopleiding, bedoeld in [artikel 26][ref1], wordt onder verantwoordelijkheid van het bevoegd gezag
      verzorgd op grond van een samenwerkingsovereenkomst tussen het bevoegd gezag van de school en het bevoegd gezag van
      een instelling voor beroepsonderwijs waarvan het onderwijsaanbod mede deze assistentopleiding omvat.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel26
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '26'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '27.2'
    text: 'Een samenwerkingsovereenkomst als bedoeld in het eerste lid voorziet in elk geval in afspraken over:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27
  - number: 27.2.a
    text: de assistentopleiding die geheel of gedeeltelijk in plaats van de basisberoepsgerichte leerweg zal worden verzorgd,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27
  - number: 27.2.b
    text: de inschrijving van leerlingen als extraneus bij de instelling,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27
  - number: 27.2.c
    text: de examinering en diplomering door de instelling,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27
  - number: 27.2.d
    text: |-
      de invulling van de betrokkenheid van het bevoegd gezag bij de beroepspraktijkvorming, bedoeld in de
      [artikelen 7.2.7][ref1] en [7.2.8 van de Wet educatie en beroepsonderwijs BES][ref2], met dien verstande dat het
      bevoegd gezag de in dat artikel 7.2.8 bedoelde overeenkomst mede ondertekent,


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '7'
  - number: 27.2.e
    text: |-
      de toepassing van [artikel 26, tweede lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel26
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '26'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 27.2.f
    text: de rechtsbescherming van de leerling, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27
  - number: 27.2.g
    text: de doorstroom van de leerlingen na het met goed gevolg afsluiten van de assistentopleiding.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27
  - number: '27.3'
    text: |-
      In geval van toepassing van [artikel 7.4.6, derde lid, van de Wet educatie en beroepsonderwijs BES][ref1], is het
      bevoegd gezag belast met de uitvoering van de daar bedoelde examinering.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
  - number: '27.4'
    text: |-
      Indien het bevoegd gezag tevens het bevoegd gezag is van een instelling voor beroepsonderwijs, regelt het bevoegd
      gezag op overeenkomstige wijze de onderwerpen, genoemd in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27
  - number: 27a.1
    text: |-
      Het bevoegd gezag van een school voor middelbaar algemeen voortgezet onderwijs of een school voor voorbereidend
      beroepsonderwijs kan leerlingen een doorlopende leerroute vmbo-mbo aanbieden, met inachtneming van de
      [artikelen 27b tot en met 27k][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel27b
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: 27b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 27a.2
    text: |-
      Een doorlopende leerroute vmbo-mbo is een onderwijsprogramma vanaf het derde leerjaar aan een school voor
      middelbaar algemeen voortgezet onderwijs of een school voor voorbereidend beroepsonderwijs, dat opleidt tot zowel
      een diploma voorbereidend middelbaar beroepsonderwijs als bedoeld in [artikel 72, derde lid][ref1], als het diploma
      van een basisberoepsopleiding, vakopleiding of middenkaderopleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel72
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '72'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 27a.3
    text: 'In een doorlopende leerroute vmbo-mbo worden tot één onderwijsprogramma geïntegreerd:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27a
  - number: 27a.3.a
    text: |-
      de basisberoepsgerichte leerweg en een basisberoepsopleiding in een aanverwant opleidingsdomein of een aanverwante
      kwalificatie;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27a
  - number: 27a.3.b
    text: |-
      de kaderberoepsgerichte leerweg en een vakopleiding in een aanverwant opleidingsdomein of een aanverwante
      kwalificatie;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27a
  - number: 27a.3.c
    text: |-
      de kaderberoepsgerichte, gemengde of theoretische leerweg en een middenkaderopleiding in een aanverwant
      opleidingsdomein of een aanverwante kwalificatie.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27a
  - number: 27a.4
    text: |-
      Een doorlopende leerroute vmbo-mbo stemt wat betreft het daarvan onderdeel uitmakende voortgezet onderwijs overeen
      met een of meer van de profielen, bedoeld in [artikel 16][ref1], [18][ref2] of [29][ref3], die aan de school worden
      verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel29
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '16'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '18'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '29'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 27b.1
    text: |-
      Een doorlopende leerroute vmbo-mbo wordt op grond van een samenwerkingsovereenkomst gezamenlijk verzorgd door het
      bevoegd gezag van een school en het bevoegd gezag van een instelling voor beroepsonderwijs.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27b
  - number: 27b.2
    text: 'In de samenwerkingsovereenkomst zijn in elk geval afspraken opgenomen over:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27b
  - number: 27b.2.a
    text: |-
      het profiel en het aanverwante opleidingsdomein of de aanverwante kwalificatie waarin de doorlopende leerroute
      vmbo-mbo wordt aangeboden;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27b
  - number: 27b.2.b
    text: |-
      de vormgeving van de leiding over de doorlopende leerroute vmbo-mbo, waaronder de samenstelling en de wijze van
      benoeming van die leiding en de taken en bevoegdheden die door de bevoegde gezagsorganen van de school en de
      instelling voor beroepsonderwijs zijn opgedragen aan die leiding;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27b
  - number: 27b.2.c
    text: |-
      de wijze waarop de leiding over de doorlopende leerroute vmbo-mbo inlichtingen verstrekt en verantwoording aflegt
      aan de bevoegde gezagsorganen van de school en de instelling voor beroepsonderwijs;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27b
  - number: 27b.2.d
    text: |-
      de organisatorische en onderwijskundige inrichting van de doorlopende leerroute, waaronder de inzet van personeel
      en het gebruik van faciliteiten van de partijen die deelnemen aan de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27b
  - number: 27b.2.e
    text: |-
      in geval van overdracht van een deel van de bekostiging met toepassing van [artikel 170a][ref1] respectievelijk
      [artikel 8.4a.15 WEB BES][ref2], de omvang en de bestemming van de over te dragen middelen;


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel170a
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel8
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27b
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: 170a
        hoofdstuk: III
        paragraaf: '5'
        afdeling: III
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '8'
  - number: 27b.2.f
    text: |-
      de inhoud van de overstapoptie, bedoeld in [artikel 27k][ref1] en [artikel 8.4a.14 WEB BES][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel27k
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel8
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27b
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: 27k
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '8'
  - number: 27b.2.g
    text: de wijze waarop het bedrijfsleven zal worden betrokken bij de invulling van de doorlopende leerroute vmbo-mbo;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27b
  - number: 27b.2.h
    text: de wijze van geschilbeslechting tussen de deelnemende partijen over de uitvoering van de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27b
  - number: 27b.2.i
    text: |-
      de voorwaarden waaronder een andere school of een andere instelling voor beroepsonderwijs partij kan worden bij de
      overeenkomst, de voorwaarden waaronder de overeenkomst kan worden opgezegd of ontbonden, alsmede de wijze waarop
      de overeenkomst in andere gevallen kan worden gewijzigd, telkens met het oog op het zoveel mogelijk beperken van de
      gevolgen voor de leerlingen en mbo-studenten; en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27b
  - number: 27b.2.j
    text: |-
      de inrichting van de medezeggenschap door de medezeggenschapsorganen van de school onderscheidenlijk de instelling
      voor beroepsonderwijs.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27b
  - number: 27b.3
    text: |-
      Het tweede lid is niet van toepassing indien het bevoegd gezag zowel de school als de instelling voor
      beroepsonderwijs in stand houdt waarbinnen de doorlopende leerroute vmbo-mbo wordt verzorgd. In plaats daarvan
      regelt het bevoegd gezag op overeenkomstige wijze de onderwerpen, genoemd in het tweede lid, met uitzondering van
      de onderdelen h tot en met j van dat lid.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27b
  - number: 27c
    text: |-
      Het bevoegd gezag van een school en het bevoegd gezag van een instelling voor beroepsonderwijs melden aan Onze
      Minister dat zij gezamenlijk een doorlopende leerroute vmbo-mbo aanbieden.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27c
  - number: 27d.1
    text: |-
      Een doorlopende leerroute vmbo-mbo wordt aangeboden op de locatie van de school of van de instelling voor
      beroepsonderwijs die de doorlopende leerroute vmbo-mbo verzorgt.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27d
  - number: 27d.2
    text: |-
      Het bevoegd gezag van de school en het bevoegd gezag van de instelling voor beroepsonderwijs beschrijven voor de
      gehele doorlopende leerroute vmbo-mbo het onderwijsprogramma en de examinering per leerjaar. Daarbij wordt vermeld
      welke delen van het onderwijsprogramma en van het examen:
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27d
  - number: 27d.2.a
    text: voortgezet onderwijs betreffen, en welk deel daarbinnen vakoverstijgend is;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27d
  - number: 27d.2.b
    text: beroepsonderwijs betreffen;
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27d
  - number: 27d.2.c
    text: |-
      een combinatie van voortgezet onderwijs en beroepsonderwijs betreffen, en welk deel daarbinnen voortgezet onderwijs
      onderscheidenlijk beroepsonderwijs betreft.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27d
  - number: 27d.3
    text: |-
      Bij de beschrijving van het onderwijsprogramma wordt tevens vermeld bij welk deel daarvan gebruik wordt gemaakt van
      een team als bedoeld in [artikel 80, negende lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel80
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27d
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '80'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
  - number: 27d.4
    text: |-
      De leerling in een doorlopende leerroute vmbo-mbo kan in staat gesteld worden om aan de school delen van het
      onderwijsprogramma te volgen en examens af te leggen die behoren tot de van die doorlopende leerroute deel
      uitmakende beroepsopleiding.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27d
  - number: 27d.5
    text: |-
      De school kan aan een voormalige leerling, nadat die ingevolge [artikel 27e, tweede lid][ref1], als mbo-student
      is ingeschreven aan een instelling voor beroepsonderwijs, delen van het onderwijsprogramma van een doorlopende
      leerroute vmbo-mbo aanbieden, die behoren tot het van die doorlopende leerroute deel uitmakende middelbaar algemeen
      voortgezet onderwijs of voorbereidend beroepsonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel27e
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27d
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: 27e
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 27e.1
    text: |-
      Een leerling die een doorlopende leerroute vmbo-mbo volgt, wordt gedurende de eerste twee leerjaren van
      die doorlopende leerroute vmbo-mbo aangemerkt als leerling van de leerweg en het profiel, bedoeld in
      [artikel 16][ref1], [18][ref2] of [29][ref3], die deel uitmaken van de door die leerling gevolgde doorlopende
      leerroute vmbo-mbo.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel29
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27e
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '16'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '18'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '29'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 27e.2
    text: |-
      Een leerling in een doorlopende leerroute vmbo-mbo wordt met ingang van het derde leerjaar van die doorlopende
      leerroute vmbo-mbo uitgeschreven als leerling aan de school en ingeschreven als mbo-student aan de instelling voor
      beroepsonderwijs, die het beroepsonderwijs binnen de doorlopende leerroute vmbo-mbo verzorgt. Het bevoegd gezag
      van de school overlegt daartoe aan het bevoegd gezag van de instelling voor beroepsonderwijs de gegevens van die
      leerling, bedoeld in [artikel 8.1.3, eerste lid, eerste volzin, WEB BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel8
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27e
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '8'
  - number: 27f.1
    text: 'Het bevoegd gezag van de school draagt de gehele cursusduur van een doorlopende leerroute vmbo-mbo zorg voor:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27f
  - number: 27f.1.a
    text: |-
      de uitvoering van delen van het onderwijsprogramma die behoren tot het middelbaar algemeen voortgezet onderwijs
      of voorbereidend beroepsonderwijs dat deel uitmaakt van het onderwijsprogramma van die doorlopende leerroute vmbo-
      mbo; en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27f
  - number: 27f.1.b
    text: |-
      de examinering en diplomering betreffende het middelbaar algemeen voortgezet onderwijs of voorbereidend
      beroepsonderwijs dat deel uitmaakt van het onderwijsprogramma van die doorlopende leerroute vmbo-mbo.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27f
  - number: 27f.2
    text: |-
      Ten aanzien van de onderdelen van een doorlopende leerroute vmbo-mbo, bedoeld in het eerste lid, die in het
      derde leerjaar van die route plaatsvinden, is het bepaalde bij of krachtens de [artikelen 176][ref1] en 179,
      eerste, vierde, zevende, tiende en twaalfde tot en met vijftiende lid, alsmede het bepaalde bij of krachtens de
      [artikelen 10][ref2], [12][ref3], [14][ref4], [15][ref5] en [25 van de Wet register onderwijsdeelnemers][ref6] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel176
      [ref2]: https://wetten.overheid.nl/BWBR0042012#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0042012#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0042012#Artikel14
      [ref5]: https://wetten.overheid.nl/BWBR0042012#Artikel15
      [ref6]: https://wetten.overheid.nl/BWBR0042012#Artikel25
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27f
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '176'
        hoofdstuk: IV
        afdeling: III
      - id: ref2
        bwb_id: BWBR0042012
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0042012
        artikel: '12'
      - id: ref4
        bwb_id: BWBR0042012
        artikel: '14'
      - id: ref5
        bwb_id: BWBR0042012
        artikel: '15'
      - id: ref6
        bwb_id: BWBR0042012
        artikel: '25'
  - number: 27f.3
    text: |-
      [Artikel 52][ref1] is van overeenkomstige toepassing op klachten over met de doorlopende leerroute vmbo-mbo verband
      houdende gedragingen en beslissingen van het bevoegd gezag van de instelling voor beroepsonderwijs waarmee een
      samenwerkingsovereenkomst als bedoeld in [artikel is 27b, tweede lid][ref2], is gesloten, of van de ten behoeve van
      die instelling voor beroepsonderwijs met taken belaste personen. Onverminderd [artikel 52, vierde lid][ref3], maken
      de leden van de klachtencommissie geen deel uit van het bevoegd gezag van de instelling voor beroepsonderwijs en is
      de voorzitter van de klachtencommissie niet werkzaam voor of bij dat bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel27b
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel52
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27f
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '52'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: 27b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '52'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 27j.1
    text: |-
      Afhankelijk van de inrichting van de doorlopende leerroute vmbo-mbo door het bevoegd gezag vallen het eerste
      en tweede tijdvak van het centraal examen van het eindexamen, bedoeld in [artikel 72, eerste lid][ref1], in het
      tweede of derde leerjaar van die doorlopende leerroute vmbo-mbo. Het bevoegd gezag kan leerlingen in de gelegenheid
      stellen om in het eerste leerjaar van de doorlopende leerroute vmbo-mbo centraal examen af te leggen in een of meer
      vakken van het eindexamen.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel72
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27j
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '72'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 27j.2
    text: |-
      Het derde tijdvak van het centraal eindexamen wordt afgenomen door het College voor toetsen en examens aansluitend
      aan het leerjaar waarin de kandidaat centraal examen heeft afgelegd in het eerste of tweede tijdvak.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27j
  - number: 27j.3
    text: |-
      Het bepaalde bij of krachtens [artikel 72][ref1] is van overeenkomstige toepassing op het derde leerjaar van een
      doorlopende leerroute vmbo-mbo.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel72
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27j
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '72'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 27j.4
    text: |-
      Indien een voormalige leerling van de school, nadat die ingevolge [artikel 27e, derde lid][ref1], als mbo-student
      is ingeschreven aan de instelling voor beroepsonderwijs waarmee de school gezamenlijk een doorlopende leerroute
      vmbo-mbo verzorgt nog geen volledig eindexamen vmbo heeft afgelegd, meldt het bevoegd gezag van de school hem in
      het derde leerjaar van de doorlopende leerroute vmbo-mbo aan als kandidaat voor het eindexamen. Het eindexamen
      wordt afgenomen onder verantwoordelijkheid van het bevoegd gezag van de school. De directeur en de secretaris van
      de school stellen de uitslag van het eindexamen vast. De directeur reikt de kandidaat die geslaagd is voor het
      eindexamen een diploma van de betreffende leerweg uit.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel27e
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27j
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: 27e
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 27j.5
    text: |-
      Indien de leerling in het eerste of tweede leerjaar van de doorlopende leerroute vmbo-mbo in één of meer vakken
      centraal examen heeft afgelegd, en niet is bevorderd tot het volgende leerjaar, vervallen de met dit centrale
      examen behaalde resultaten en treedt de overstapoptie, bedoeld in [artikel 27k][ref1] in werking.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel27k
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27j
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: 27k
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 27j.6
    text: |-
      Indien de leerling is afgewezen voor het eindexamen, treedt de overstapoptie, bedoeld in [artikel 27k][ref1] in
      werking.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel27k
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27j
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: 27k
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 27k.1
    text: |-
      Indien deelname van de leerling aan een doorlopende leerroute vmbo-mbo wordt beëindigd voordat hij deze met
      succes heeft afgerond wordt hij door het bevoegd gezag van de school of het bevoegd gezag van de instelling voor
      beroepsonderwijs in staat gesteld een vmbo-diploma of het diploma van een beroepsopleiding te behalen, passend bij
      het naar het gezamenlijk oordeel van beide betrokken bevoegde gezagsorganen bereikte onderwijsniveau en de leeftijd
      van de leerling.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27k
  - number: 27k.2
    text: |-
      Indien de leerling ingevolge het eerste lid een diploma van een beroepsopleiding wil behalen bij dezelfde
      instelling voor beroepsonderwijs, zijn de [artikelen 8.1.1b][ref1], [8.2.1][ref2], [8.2.2][ref3] en
      [8.2.2a WEB BES][ref4] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0028395#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0028395#Artikel8
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27k
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0028395
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0028395
        artikel: '8'
  - number: 27k.3
    text: |-
      Het eerste lid is niet van toepassing indien de leerling definitief van de school wordt verwijderd als bedoeld in
      [artikel 64, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel64
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27k
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '64'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 27l.1
    text: |-
      In overleg met de leerling en diens ouders kan het bevoegd gezag van een school voor voorbereidend
      beroepsonderwijs leerlingen die daarbij naar zijn oordeel gebaat zijn in de gelegenheid stellen om in plaats van
      de basisberoepsgerichte leerweg een geïntegreerde route vmbo-basisberoepsopleiding te volgen. Het bevoegd gezag
      besluit hiertoe slechts na overleg met het bevoegd gezag van de instelling voor beroepsonderwijs waarmee het een
      samenwerkingsovereenkomst als bedoeld in [artikel 8.4.3 WEB BES][ref1] heeft gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel8
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27l
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '8'
  - number: 27l.2
    text: |-
      De geïntegreerde route vmbo-basisberoepsopleiding is een onderwijsprogramma vanaf het derde leerjaar aan een school
      voor voorbereidend beroepsonderwijs, dat opleidt tot het diploma van een basisberoepsopleiding in een aanverwant
      opleidingsdomein of een aanverwante kwalificatie.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27l
  - number: 27l.3
    text: |-
      De geïntegreerde route vmbo-basisberoepsopleiding stemt wat betreft het daarvan onderdeel uitmakende voortgezet
      onderwijs overeen met een of meer van de profielen, bedoeld in [artikel 18, derde lid][ref1], die aan de school
      worden verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel18
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27l
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '18'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 27l.4
    text: |-
      Het bevoegd gezag is niet gehouden leerlingen die de geïntegreerde route vmbo-basisberoepsopleiding volgen
      gelegenheid te geven om aan de school een eindexamen in de basisberoepsgerichte leerweg af te leggen als bedoeld in
      [artikel 72, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel72
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27l
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '72'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 27l.5
    text: |-
      De [artikelen 27b tot en met 27k][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel27b
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel27l
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: 27b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '29.1'
    text: |-
      Naast het onderwijs in de leerwegen, genoemd in de [artikelen 16][ref1] en [18][ref2], kan onderwijs in de gemengde
      leerweg worden gegeven aan een scholengemeenschap met in elk geval een school voor middelbaar algemeen voortgezet
      onderwijs en een school voor voorbereidend beroepsonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel18
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '16'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '18'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '29.2'
    text: |-
      Het onderwijs in de gemengde leerweg is met ingang van het derde leerjaar ingericht volgens profielen. Een profiel
      is een in schooltijd verzorgd samenhangend onderwijsprogramma, zodanig ingericht dat het biedt:
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel29
  - number: 29.2.a
    text: een algemene maatschappelijke voorbereiding en persoonlijke vorming, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel29
  - number: 29.2.b
    text: een voorbereiding op naar inhoud verwante opleidingen in het aansluitend beroepsonderwijs.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel29
  - number: '29.3'
    text: 'De school verzorgt een of meer profielen. De profielen zijn:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel29
  - number: 29.3.a
    text: bouwen, wonen en interieur,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel29
  - number: 29.3.b
    text: produceren, installeren en energie,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel29
  - number: 29.3.c
    text: mobiliteit en transport,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel29
  - number: 29.3.d
    text: media, vormgeving en ICT,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel29
  - number: 29.3.e
    text: maritiem en techniek,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel29
  - number: 29.3.f
    text: zorg en welzijn,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel29
  - number: 29.3.g
    text: economie en ondernemen,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel29
  - number: 29.3.h
    text: horeca, bakkerij en recreatie,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel29
  - number: 29.3.i
    text: groen,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel29
  - number: 29.3.j
    text: dienstverlening en producten.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel29
  - number: '29.4'
    text: 'Elk profiel bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel29
  - number: 29.4.a
    text: een gemeenschappelijk deel, dat voor alle profielen gelijk is,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel29
  - number: 29.4.b
    text: een profieldeel, dat kenmerkend is voor dat profiel, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel29
  - number: 29.4.c
    text: een vrij deel, dat bestaat uit een door de leerling te kiezen vakken en andere programma-onderdelen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel29
  - number: '29.5'
    text: |-
      Het gemeenschappelijk deel van elk profiel in de gemengde leerweg omvat Nederlandse taal, Engelse taal,
      maatschappijleer, lichamelijke opvoeding en ten minste één van de vakken behorende tot de beeldende vorming,
      muziek, dans of drama.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel29
  - number: '29.6'
    text: 'Het profieldeel van de gemengde leerweg omvat het bij het betreffende profiel behorende profielvak en, wat betreft:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel29
  - number: 29.6.a
    text: 'de profielen, genoemd in het derde lid, onderdelen a tot en met e: wiskunde en natuur- en scheikunde I,'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel29
  - number: 29.6.b
    text: |-
      het profiel, genoemd in het derde lid, onderdeel f: biologie en, ter keuze van de leerling, wiskunde,
      maatschappijkunde, geschiedenis en staatsinrichting, of aardrijkskunde, met dien verstande dat het bevoegd gezag
      beslist welke van de laatste drie vakken wordt of worden aangeboden,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel29
  - number: 29.6.c
    text: |-
      de profielen, genoemd in het derde lid, onderdelen g en h: economie en, ter keuze van de leerling, wiskunde,
      Spaanse taal of Franse taal,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel29
  - number: 29.6.d
    text: |-
      het profiel genoemd in het derde lid, onderdeel i: wiskunde en, ter keuze van de leerling, biologie of natuur- en
      scheikunde I,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel29
  - number: 29.6.e
    text: |-
      het profiel genoemd in het derde lid, onderdeel j: ter keuze van de leerling twee van de vakken wiskunde, economie,
      biologie en natuur- en scheikunde I.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel29
  - number: '29.7'
    text: 'Het vrije deel van elk profiel in de gemengde leerweg:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel29
  - number: 29.7.a
    text: omvat door de leerling te kiezen vakken, genoemd in het zesde lid,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel29
  - number: 29.7.b
    text: omvat door de leerling te kiezen beroepsgerichte keuzevakken,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel29
  - number: 29.7.c
    text: |-
      kan omvatten natuur- en scheikunde II, Papiaments, Duitse taal, vakken behorende tot de beeldende vorming, muziek,
      dans, drama, lichamelijke opvoeding 2 en informatietechnologie, door de leerling te kiezen, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel29
  - number: 29.7.d
    text: kan omvatten door het bevoegd gezag vast te stellen vakken en programma-onderdelen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel29
  - number: '29.8'
    text: |-
      Het bevoegd gezag beslist welke keuzetaal, genoemd in het zesde lid, onderdeel c, welke beroepsgerichte
      keuzevakken, bedoeld in het zevende lid, onderdeel b, en welke vakken, genoemd in het zevende lid, onderdeel c,
      worden aangeboden. Het bevoegd gezag kan tevens beslissen dat door het bevoegd gezag aan te wijzen vakken en andere
      programma-onderdelen, bedoeld in het zevende lid, onderdeel d, door alle leerlingen in het vrije deel moeten worden
      gevolgd.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel29
  - number: '29.9'
    text: |-
      Het bevoegd gezag kan de leerling in de gelegenheid stellen, in plaats van de vakken, genoemd in het vijfde,
      zesde en zevende lid, onderdeel c, de overeenkomstige vakken, genoemd in dan wel aangewezen op grond van de
      [artikelen 39][ref1] en [40][ref2] te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel40
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '39'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '40'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '29.10'
    text: 'Bij of krachtens algemene maatregel van bestuur worden vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel29
  - number: 29.10.a
    text: de profielvakken, bedoeld in het zesde lid,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel29
  - number: 29.10.b
    text: voorschriften met betrekking tot de beroepsgerichte keuzevakken, bedoeld in het zevende lid, onderdeel b, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel29
  - number: 29.10.c
    text: |-
      voorschriften over de mogelijkheid van vrijstelling en de bevoegdheid van het bevoegd gezag om ontheffing te
      verlenen van onderdelen van dit artikel.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel29
  - number: '29.11'
    text: |-
      Onverminderd het zesde en zevende lid, kan bij algemene maatregel van bestuur worden vastgesteld het door alle
      leerlingen in het derde leerjaar te volgen minimum aantal vakken waarin eindexamen kan worden afgelegd, alsmede
      welke vakken het betreft.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel29
  - number: '30.1'
    text: |-
      Leerwegondersteunend onderwijs wordt verzorgd ter voorbereiding op of gedurende het volgen van onderwijs in een van
      de leerwegen, genoemd in de [artikelen 16][ref1], [18][ref2] en [29][ref3], ten behoeve van de leerling voor wie
      vaststaat dat een orthopedagogische en orthodidactische benadering is geboden met het oog op het afsluiten van het
      onderwijs in een van deze leerwegen. Leerwegondersteunend onderwijs wordt zodanig in het onderwijs geïntegreerd en
      ingericht dat de leerling een ononderbroken ontwikkelingsproces, gericht op het afsluiten als bedoeld in de eerste
      volzin, kan volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel29
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '16'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '18'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '29'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '30.2'
    text: |-
      Leerwegondersteunend onderwijs wordt verzorgd, indien de leerling met behulp van de voorzieningen, bedoeld in
      [artikel 50, tweede lid, tweede volzin][ref1], niet een ononderbroken ontwikkelingsproces als bedoeld in het eerste
      lid, kan volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel50
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '50'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '30.3'
    text: |-
      Het bevoegd gezag beslist of een leerling is aangewezen op leerwegondersteunend onderwijs. Het hanteert daartoe
      een indicatieprocedure gebaseerd op erkende testen en toetsen. Na overleg met de ouders van de leerling beslist het
      bevoegd gezag of aan de leerling leerwegondersteunend onderwijs wordt aangeboden.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel30
  - number: '30.4'
    text: |-
      [Artikel 32, derde lid][ref1], is van overeenkomstige toepassing op de leerling die is aangewezen op
      leerwegondersteunend onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel32
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '32'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '31.1'
    text: Praktijkonderwijs wordt gegeven aan scholen voor praktijkonderwijs.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel31
  - number: '31.2'
    text: Praktijkonderwijs is onderwijs voor leerlingen voor wie vaststaat dat
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel31
  - number: 31.2.a
    text: overwegend een orthopedagogische en orthodidactische benadering is geboden, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel31
  - number: 31.2.b
    text: |-
      het volgen van het onderwijs in een van de leerwegen, genoemd in de [artikelen 16][ref1], [18][ref2] en [29][ref3],
      al dan niet in combinatie met het volgen van leerwegondersteunend onderwijs, bedoeld in [artikel 30][ref4], niet
      leidt tot het behalen van een diploma of een getuigschrift voorbereidend middelbaar beroepsonderwijs als bedoeld
      in [artikel 72][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0030284#Artikel30
      [ref5]: https://wetten.overheid.nl/BWBR0030284#Artikel72
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '16'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '18'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '29'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0030284
        artikel: '30'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref5
        bwb_id: BWBR0030284
        artikel: '72'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: '31.3'
    text: |-
      Praktijkonderwijs bestaat uit een gedeelte waarin aangepast theoretisch onderwijs, persoonlijkheidsvorming en
      het aanleren van sociale vaardigheden worden verzorgd, en een gedeelte waarin de leerling wordt voorbereid op het
      uitoefenen van functies op de arbeidsmarkt. Praktijkonderwijs wordt zo veel mogelijk op basis van de kerndoelen
      verzorgd en is er op gericht dat leerlingen zo veel mogelijk de referentieniveaus Nederlandse taal en rekenen
      bereiken die voor het praktijkonderwijs zijn vastgesteld op grond van [artikel 47a][ref1]. Praktijkonderwijs
      bereidt de leerling voor op functies binnen de regionale arbeidsmarkt op een niveau dat ligt onder het niveau van
      de assistentopleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel47a
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: 47a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '31.4'
    text: |-
      Het praktijkonderwijs wordt zodanig ingericht dat de leerlingen per leerjaar ten minste 1 000 klokuren
      praktijkonderwijs ontvangen. De leerlingen ontvangen per dag ten hoogste 5,5 uren praktijkonderwijs, voor zover het
      betreft aangepast theoretisch onderwijs, persoonlijkheidsvorming en het aanleren van sociale vaardigheden.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel31
  - number: '31.5'
    text: |-
      Het bevoegd gezag van een school voor praktijkonderwijs kan, met inachtneming van de tweede volzin van het
      derde lid en van het vierde lid, indien dat ten behoeve van de leerling noodzakelijk is, bij het aanbieden
      van dat onderwijs afwijken van de voorschriften, gegeven bij of krachtens de [artikelen 12a][ref1],
      [33 tot en met 35][ref2], [46][ref3] en [72][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel46
      [ref4]: https://wetten.overheid.nl/BWBR0030284#Artikel72
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: 12a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '33'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '46'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0030284
        artikel: '72'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: '31.6'
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften vastgesteld met betrekking tot de vakken die het
      praktijkonderwijs omvat, alsmede met betrekking tot het aantal uren dat het onderricht in de praktijk van de
      uitoefening van een vak of beroep gedurende een schoolweek ten hoogste omvat.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel31
  - number: '32.1'
    text: |-
      Aan de ouders van een leerling van wie het bevoegd gezag van de school waar de leerling zich aanmeldt dan wel van
      de school waaraan de leerling is ingeschreven, redelijkerwijs kan aannemen dat deze niet in staat is het onderwijs
      in een van de leerwegen, genoemd in de [artikelen 16][ref1], [18][ref2] en [29][ref3], al dan niet in combinatie
      met leerwegondersteunend onderwijs, bedoeld in [artikel 30][ref4], met een diploma of getuigschrift voorbereidend
      middelbaar beroepsonderwijs als bedoeld in [artikel 72, derde lid][ref5], af te sluiten, kan het bevoegd gezag
      voorstellen deze leerling in plaats daarvan praktijkonderwijs te doen volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0030284#Artikel30
      [ref5]: https://wetten.overheid.nl/BWBR0030284#Artikel72
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '16'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '18'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '29'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0030284
        artikel: '30'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref5
        bwb_id: BWBR0030284
        artikel: '72'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: '32.2'
    text: |-
      Het bevoegd gezag van de school voor praktijkonderwijs beslist over de toelating van de leerling tot het
      praktijkonderwijs. [Artikel 30, derde lid, tweede volzin][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel30
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '30'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '32.3'
    text: |-
      Het bevoegd gezag van de school voor praktijkonderwijs waaraan de leerling wordt toegelaten, stelt, na overleg met
      de ouders, voor de leerling een handelingsplan op. Het handelingsplan bevat een omschrijving van de wijze waarop
      voor de desbetreffende leerling het praktijkonderwijs met inachtneming van [artikel 31, derde lid][ref1], wordt
      verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel31
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '31'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '33'
    text: |-
      Het onderwijs in de eerste twee leerjaren wordt zodanig ingericht dat met behoud van keuzevrijheid de doorstroming
      van leerlingen wordt bevorderd naar een van de profielen, bedoeld in de [artikelen 16][ref1], [18][ref2] of
      [29][ref3] of naar het derde leerjaar voorbereidend wetenschappelijk onderwijs en hoger algemeen voortgezet
      onderwijs en vervolgens naar de periode van voorbereidend hoger onderwijs, bedoeld in [artikel 38][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0030284#Artikel38
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '16'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '18'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '29'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0030284
        artikel: '38'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '34'
    text: 'Bij algemene maatregel van bestuur worden kerndoelen vastgesteld, waarbij aandacht wordt besteed aan aspecten van:'
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel34
  - number: 34.a
    text: Nederlandse taal,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel34
  - number: 34.b
    text: Engelse taal,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel34
  - number: 34.c
    text: geschiedenis en staatsinrichting,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel34
  - number: 34.d
    text: aardrijkskunde,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel34
  - number: 34.e
    text: economie,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel34
  - number: 34.f
    text: wiskunde,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel34
  - number: 34.g
    text: natuur- en scheikunde,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel34
  - number: 34.h
    text: biologie,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel34
  - number: 34.i
    text: verzorging,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel34
  - number: 34.j
    text: informatiekunde,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel34
  - number: 34.k
    text: techniek,
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel34
  - number: 34.l
    text: lichamelijke opvoeding, en
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel34
  - number: 34.m
    text: beeldende vorming, muziek, drama en dans.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel34
  - number: '35.1'
    text: |-
      Het bevoegd gezag richt voor de eerste twee leerjaren een in schooltijd verzorgd samenhangend onderwijsprogramma
      in. Dit programma voldoet aan de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel35
  - number: 35.1.a
    text: |-
      het bevoegd gezag werkt de kerndoelen uit voor de verschillende schoolsoorten en verschillende groepen leerlingen,
      onverminderd de doorstroombevordering met behoud van keuzevrijheid van leerlingen, bedoeld in [artikel 33][ref1],
      en


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel33
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '33'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 35.1.b
    text: in de eerste twee leerjaren worden gezamenlijk ten minste 1 425 uren onderwijs verzorgd op basis van de kerndoelen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel35
  - number: '35.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven voor het verzorgen van
      onderwijs in de eerste twee leerjaren naast het onderwijs dat wordt verzorgd op basis van de kerndoelen.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel35
  - number: '35.3'
    text: Het bevoegd gezag beschikt over geordende gegevens met betrekking tot de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel35
  - number: '36.1'
    text: |-
      Het bevoegd gezag van een school voor voorbereidend wetenschappelijk onderwijs, voor algemeen voortgezet onderwijs
      en voor voorbereidend beroepsonderwijs kan na overleg met de ouders een leerling ontheffing verlenen voor
      onderdelen van het onderwijsprogramma, bedoeld in [artikel 35, eerste lid, onderdeel a][ref1]. Het bevoegd gezag
      bepaalt bij de ontheffing welk onderwijs voor de leerling in de plaats komt voor de onderdelen waarvoor ontheffing
      is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel35
    url: https://wetten.overheid.nl/BWBR0030284/2022-03-23#Artikel36
    references:
      - id: ref1
