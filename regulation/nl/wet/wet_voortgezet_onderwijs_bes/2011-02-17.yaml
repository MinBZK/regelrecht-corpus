  - number: '1'
    text: |-
      Deze wet verstaat onder: **basisregister onderwijs**: basisregister onderwijs als bedoeld in
      [artikel 24b van de Wet op het onderwijstoezicht][ref1]; **bevoegd gezag**: voor wat betreft: a. een openbare
      school: 1°. het bestuurscollege van het betreffende openbaar lichaam, voor zover de raad niet anders bepaalt,
      en, indien de raad dit besluit, met inachtneming van door hem te stellen regelen; 2°. de openbare rechtspersoon,
      bedoeld in [artikel 97][ref2]; dan wel 3°. de stichting, bedoeld in [artikel 98][ref3] of [artikel 109][ref4];
      b. een bijzondere school: de rechtspersoon, bedoeld in [artikel 105, eerste lid][ref5]; **bijzondere school**:
      een door een natuurlijke persoon of door een privaatrechtelijke rechtspersoon, niet zijnde een stichting
      als bedoeld in [artikel 98][ref6], in stand gehouden school; **College voor examens**: College voor examens
      als bedoeld in [artikel 2, eerste lid, van de Wet College voor examens][ref7]; **contractactiviteiten**:
      activiteiten als bedoeld in [artikel 43, tweede lid][ref8]; **deelnemers**: deelnemers als bedoeld in de
      [Wet educatie en beroepsonderwijs BES][ref9] **expertisecentrum onderwijszorg**: de rechtspersoon, bedoeld in
      [artikel 69, eerste lid][ref10]; **inspectie**: de inspectie, bedoeld in de [Wet op het onderwijstoezicht][ref11],
      voor zover het voortgezet onderwijs betreft; **kerndoelen**: de op grond van [artikel 34][ref12] vastgestelde
      na te streven inhoudelijke doelstellingen voor het onderwijsprogramma voor de eerste twee leerjaren, bedoeld
      in [artikel 35][ref13], gericht op het verwerven door leerlingen van kennis, inzicht en vaardigheden; **Onze
      Minister**: Onze Minister van Onderwijs, Cultuur en Wetenschap en, voor wat betreft het landbouwonderwijs,
      Onze Minister van Landbouw, Natuur en Voedselkwaliteit; **openbaar lichaam**: openbaar lichaam Bonaire, Sint
      Eustatius of Saba; **openbare rechtspersoon**: een rechtspersoon die krachtens publiekrecht is ingesteld als
      bedoeld in [artikel 97][ref14]; **openbare school**: a. een school in stand gehouden door een openbaar lichaam,
      al dan niet te zamen met een of meer privaatrechtelijke rechtspersonen met volledige rechtsbevoegdheid;
      b. een door een openbare rechtspersoon als bedoeld in [artikel 97][ref15] in stand gehouden school; c. een
      door een stichting als bedoeld in [artikel 98][ref16] of [artikel 109][ref17] in stand gehouden school;
      **ouders**: ouders, voogden of verzorgers; **personeel**: a. de benoemde rector, directeur, conrector, adjunct-
      directeur of leraar, en overig personeel benoemd in een andere functie dan het geven van onderwijs, waaronder
      begrepen de leden van het bestuur van die scholen die zijn benoemd door een raad van toezicht als bedoeld in
      [artikel 56, derde lid][ref18], voor zover die leden mede zijn benoemd op basis van een arbeidsovereenkomst of
      een schriftelijke aanstelling; b. het onder a bedoelde personeel dat zonder benoeming is tewerkgesteld, tenzij
      het betreft de toepassing van de [artikelen 90 tot en met 93][ref19] en [167][ref20], voor zover niet anders
      is bepaald, en de toepassing van daarmee verband houdende wettelijke bepalingen; **persoonsgebonden nummer
      BES**: het administratienummer van de leerling, dan wel het door Onze Minister uitgegeven onderwijsnummer,
      bedoeld in [artikel 65, vierde lid][ref21]; **Raad onderwijs arbeidsmarkt**: de Raad onderwijs arbeidsmarkt,
      bedoeld in [artikel 1.5.1 van de Wet educatie en beroepsonderwijs BES][ref22] **Rijksvertegenwoordiger**:
      Rijksvertegenwoordiger voor de openbare lichamen Bonaire, Sint Eustatius en Saba; **scholengemeenschap**: een
      scholengemeenschap als bedoeld in [artikel 123][ref23], **school**: een school voor voortgezet onderwijs, tenzij
      het tegendeel blijkt; **voortgezet onderwijs**: het voortgezet onderwijs, bedoeld in [artikel 2][ref24].


