  - number: '209.1'
    text: |-
      Onverminderd de [artikelen 153, eerste lid][ref1], [155, tweede lid][ref2], [156, eerste en tweede lid][ref3] en
      [157, tweede lid][ref4], omvat, tot een bij koninklijk besluit te bepalen tijdstip, de bekostiging van een school
      voor de personeels- en exploitatiekosten, alsmede voor de kosten van de zorg voor leerlingen met een specifieke
      onderwijsbehoefte, een door Onze Minister vast te stellen bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel153
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel155
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel156
      [ref4]: https://wetten.overheid.nl/BWBR0030284#Artikel157
