        artikel: '86'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
  - number: 80.1.b.2°
    text: |-
      een erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EG-beroepskwalificaties][ref1], verleend ten aanzien van het onderwijs dat
      betrokkene zal geven, of


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel5
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '5'
  - number: 80.1.b.3°
    text: |-
      een geschiktheidsverklaring als bedoeld in [artikel 197][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel197
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '197'
  - number: 80.1.c
    text: niet krachtens rechterlijke uitspraak van het geven van onderwijs te zijn uitgesloten.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel80
  - number: '80.2'
    text: |-
      Indien het bevoegd gezag een leraar benoemt of tewerkstelt zonder benoeming voor uitsluitend het geven
      van middelbaar algemeen voortgezet onderwijs of het geven van onderwijs in de eerste drie leerjaren
      van het hoger algemeen voortgezet onderwijs of van het voorbereidend wetenschappelijk onderwijs, is
      het eerste lid, onderdeel b, onder 3°, niet van toepassing en volstaat in afwijking van het eerste
      lid, onderdeel b, onder 1°, het bezit van het getuigschrift van een bacheloropleiding als bedoeld in
      [artikel 7.3a, eerste lid, onderdeel a, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1],
      waaruit blijkt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 80.2.1°
    text: |-
      de betrokkene in het kader van die opleiding met goed gevolg ten minste 30 studiepunten als bedoeld in
      [artikel 7.4, eerste lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], heeft besteed aan
      voorbereiding op het geven van onderwijs in een met zijn opleiding inhoudelijk overeenkomend vak in die leerjaren,
      en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 80.2.2°
    text: |-
      is voldaan aan de bekwaamheidseisen, bedoeld in [artikel 86, eerste lid][ref1], voor zover die van toepassing zijn
      op dat onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel86
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '86'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
  - number: '80.3'
    text: |-
      Bij ministeriële regeling bepaalt Onze Minister op grond van welke bacheloropleidingen als bedoeld in het eerste
      lid onderwijs verzorgd kan worden in daarbij aan te wijzen vakken.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel80
  - number: '80.4'
    text: |-
      In bijzondere gevallen kan Onze Minister aan personen, die in een bepaald vak of onderdeel van een vak door
      buitengewone bekwaamheid uitmunten, ten aanzien van dit vak of dit onderdeel ontheffing verlenen van de in het
      eerste lid onder b gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel80
  - number: '80.5'
    text: |-
      Bij tijdelijke afwezigheid van een leraar kan ten aanzien van degene, die hem vervangt, telkens voor ten hoogste
      een jaar worden afgeweken van de eisen, gesteld in het eerste lid onder b. Indien in een vacature niet terstond kan
      worden voorzien door de benoeming of de tewerkstelling zonder benoeming van een leraar die aan de genoemde eisen
      voldoet, is het bepaalde in de vorige volzin van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel80
  - number: '80.6'
    text: |-
      Degene die benoembaar of tewerkstelbaar zonder benoeming is voor enig vak, mag, onverminderd het zevende lid,
      door het bevoegd gezag gedurende ten hoogste twee jaren worden belast met werkzaamheden als leraar waarvoor hij
      niet voldoet aan de in [artikel 86, eerste lid][ref1], bedoelde bekwaamheidseisen. Aan de eerste volzin wordt
      uitsluitend toepassing gegeven indien het bevoegd gezag en betrokkene in ieder geval schriftelijk hebben verklaard
      dat betrokkene verplicht is zich in te spannen om binnen twee jaren alsnog te voldoen aan de bekwaamheidseisen voor
      die werkzaamheden. Het bevoegd gezag kan de in de eerste volzin bedoelde termijn verlengen met ten hoogste twee
      jaren indien het bevoegd gezag dat noodzakelijk oordeelt vanwege de kwaliteit en de voortgang van het onderwijs aan
      de school. De tweede volzin is in dat geval van overeenkomstige toepassing. De inspectie kan op aanvraag van het
      bevoegd gezag toestaan dat in de eerste twee leerjaren wordt afgeweken van de eis, bedoeld in de tweede volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel86
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '86'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
  - number: '80.7'
    text: |-
      Indien in het onderwijsprogramma, bedoeld in [artikel 35][ref1], sprake is van vakoverstijgende
      programmaonderdelen, kan in de eerste twee leerjaren worden gewerkt met teams die verantwoordelijk zijn voor de
      kwaliteit van het onderwijsprogramma voor die vakoverstijgende programmaonderdelen voor zover wordt voldaan aan de
      volgende voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel35
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '35'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 80.7.a
    text: |-
      leraren die deel uitmaken van een team voldoen ieder aan bekwaamheidseisen als bedoeld in
      [artikel 86, eerste lid][ref1], waarbij de leraren in het team als geheel beschikken over de bekwaamheidseisen voor
      de vakken die zijn betrokken bij het vakoverstijgende programmaonderdeel,


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel86
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '86'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
  - number: 80.7.b
    text: |-
      leraren die deel uitmaken van een team zijn ieder verantwoordelijk voor de kwaliteit van het deel van het onderwijs
      van het desbetreffende vakoverstijgende programmaonderdeel waarvoor zij voldoen aan de bekwaamheidseisen, bedoeld
      in [artikel 86, eerste lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel86
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '86'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
  - number: 80.7.c
    text: 'het onderwijs in het desbetreffende vakoverstijgende programmaonderdeel kan worden verzorgd door:'
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel80
  - number: 80.7.c.1°
    text: leden van het team, en
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel80
  - number: 80.7.c.2°
    text: |-
      andere leraren die daartoe naar het oordeel van het bevoegd gezag geschikt zijn. Daarbij stelt het bevoegd gezag,
      de opvattingen van de leden van het team in aanmerking nemend, vast of de inhoudelijke of didactische kennis en
      vaardigheden van deze leraren voldoende zijn. Indien dat niet het geval is, wordt eveneens vastgesteld hoe hierin
      alsnog wordt voorzien. Het bevoegd gezag legt dit vast in de geordende gegevens, bedoeld in [artikel 88][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel88
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '88'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
  - number: '80.8'
    text: Bij toepassing van het zevende lid is het vijfde lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel80
  - number: '80.9'
    text: |-
      Het bevoegd gezag beschikt over geordende gegevens over de toepassing van het derde lid, de eerste volzin van het
      zesde lid, het zevende lid en het achtste lid.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel80
  - number: '80.10'
    text: |-
      Het eerste lid is niet van toepassing op een leraar, in zoverre deze belast is met het verrichten van werkzaamheden
      in verband met contractactiviteiten.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel80
  - number: '80.11'
    text: |-
      Bij algemene maatregel van bestuur worden ten aanzien van leraren die in vaste dienst zijn verbonden aan een
      school, bedoeld in de [artikelen 13][ref1], [14][ref2], [15][ref3], [17][ref4] en [31][ref5], regelen gesteld
      omtrent de gronden waarop en de procedure volgens welke kan worden afgeweken van het eerste lid, onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0030284#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0030284#Artikel31
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '13'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '14'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '15'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0030284
        artikel: '17'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref5
        bwb_id: BWBR0030284
        artikel: '31'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '80.12'
    text: |-
      Onverminderd het vijfde tot en met achtste lid en het elfde lid en [artikel 85][ref1] kan ten aanzien van studenten
      die:


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel85
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '85'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
  - number: 80.12.a
    text: |-
      aan een hogeschool een duale opleiding volgen als bedoeld in
      [artikel 7.7 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], en aan die opleiding ten
      minste 180 studiepunten hebben behaald, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 80.12.b
    text: |-
      een duale opleiding als bedoeld in dat artikel aan een universiteit volgen tot leraar voortgezet onderwijs
      ten behoeve van het geven van het onderwijs waarvoor de desbetreffende opleiding opleidt tot het daarvoor
      vereiste getuigschrift, worden afgeweken van de eisen in het eerste lid onder b, met dien verstande dat het
      tijdelijk dienstverband van de student een periode beslaat die overeenkomt met een volledig dienstverband
      van vijf maanden. De vorige volzin is van overeenkomstige toepassing ten aanzien van studenten die ten
      minste 166 doch nog geen 180 studiepunten hebben behaald, indien door de desbetreffende hogeschool wordt
      verklaard dat de student beschikt over met 180 studiepunten vergelijkbare en tevens voor het dienstverband
      relevante kennis, inzicht en vaardigheden. De toepassing van de vorige volzin vervalt ten aanzien van die
      student die niet binnen vier weken na aanvang van het dienstverband over 180 studiepunten beschikt. De in
      [artikel 7.7, vijfde lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] bedoelde
      overeenkomst vermeldt tevens de leraar onder wiens verantwoordelijkheid de betrokken student werkzaamheden van
      onderwijskundige aard verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: '80.13'
    text: |-
      Het twaalfde lid is, behoudens de eis van verblijf in het laatste jaar van de opleiding, van overeenkomstige
      toepassing ten aanzien van studenten van een universitaire lerarenopleiding, met dien verstande dat afwijking bij
      de voltijdse vorm van die opleiding mogelijk is voor ten hoogste de periode van een schooljaar waarin onderwijs
      wordt gegeven, en bij de deeltijdse vorm van die opleiding voor ten hoogste twee jaren.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel80
  - number: '80.14'
    text: |-
      Bij algemene maatregel van bestuur kunnen, zo nodig afwijkende, regels worden gesteld met betrekking tot de
      toepassing van het eerste lid ten aanzien van het verzorgen van door het bevoegd gezag vastgestelde vakken en
      andere programmaonderdelen, behoudens godsdienstonderwijs en levensbeschouwelijk vormingsonderwijs.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel80
  - number: '80.15'
    text: |-
      In geval van een geschiktheidsverklaring als bedoeld in [artikel 197][ref1] vindt de benoeming of tewerkstelling
      zonder benoeming plaats voor een periode van ten hoogste twee aaneengesloten schooljaren. Het bevoegd gezag kan
      deze benoemingsperiode, al dan niet onder door dat gezag te stellen voorwaarden, verlengen met ten hoogste twee
      jaren indien het bevoegd gezag daarvoor redenen aanwezig acht. Het bevoegd gezag beschikt over geordende gegevens
      met betrekking tot de toepassing van de tweede volzin. Het bevoegd gezag dat betrokkene voor de eerste maal na
      afgifte van de geschiktheidsverklaring benoemt of tewerkstelt zonder benoeming, tekent het feit en de datum van
      benoeming of tewerkstelling zonder benoeming aan op die verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel197
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '197'
  - number: '80.16'
    text: |-
      Het bevoegd gezag kan afwijken van het eerste lid, onder b, ten aanzien van degene die gelet op specifieke
      kennis en bekwaamheden, samenhangend met ervaringen en werkzaamheden in andere sectoren van de samenleving en het
      bedrijfsleven, naar het oordeel van het bevoegd gezag voldoende bekwaam is om onder verantwoordelijkheid van een
      daartoe door het bevoegd gezag aan te wijzen leraar voor een beperkte betrekkingsomvang te worden belast met een
      uitsluitend lesgevende taak voor vakken waar die specifieke kennis en bekwaamheden in het bijzonder betrekking op
      hebben. De betrekkingsomvang is voor het totaal van de in de eerste volzin bedoelde lesgevende taken ten hoogste
      een aantal van op jaarbasis gemiddeld 4 klokuren per week.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel80
  - number: '80.17'
    text: |-
      Onze Minister kan met betrekking tot een vak of ander programmaonderdeel waarvoor niet met een getuigschrift
      afgegeven krachtens de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] kan worden aangetoond dat
      betrokkene voldoet aan de bekwaamheidseisen, bedoeld in [artikel 86, eerste lid][ref2], verklaren dat een leraar
      wordt geacht bij benoeming of tewerkstelling zonder benoeming te voldoen aan de bekwaamheidseisen tot het geven van
      voortgezet onderwijs in dat vak of dat andere programmaonderdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel86
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0005682
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '86'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
  - number: '81'
    text: |-
      Onze Minister kan aan personen die in het bezit zijn van een buiten de Europese Unie behaald bewijsstuk als bedoeld
      in [artikel 80, eerste lid, onderdeel b][ref1], de bevoegdheid verlenen tot het geven van voortgezet onderwijs in
      de openbare lichamen. Hij kan daarbij voorwaarden en beperkingen stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel80
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '80'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
  - number: '90.1'
    text: |-
      De [Wet materieel ambtenarenrecht BES][ref1] en de daarop berustende regelingen zijn voor het personeel van een
      school voor bijzonder onderwijs van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028215
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0028215
  - number: '90.2'
    text: Voor de salarissen en toelagen van het personeel wordt een regeling vastgesteld bij eilandsbesluit.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel90
  - number: '90.3'
    text: |-
      Het bestuurscollege stelt de regeling, bedoeld in het tweede lid, dan wel een wijziging daarvan niet vast dan nadat
      daarover op overeenstemming gericht overleg is gevoerd met de bevoegde gezagsorganen en met de onderwijsvakbonden
      of, bij het ontbreken daarvan, met een representatief te achten vertegenwoordiging van het personeel.
      [Artikel 101 van de Wet materieel ambtenarenrecht BES][ref1] is niet van toepassing op de vaststelling dan wel
      wijziging van de regeling, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel101
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '101'
  - number: '91'
    text: |-
      [Artikel 6, eerste lid, onderdeel b, van de Wet materieel ambtenarenrecht BES][ref1] is niet van toepassing op
      het personeel.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel6
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '6'
  - number: '92'
    text: |-
      Het bevoegd gezag benoemt, schorst en ontslaat de rector, de directeur, de conrectoren, de adjunct-directeuren, de
      leraren en het overige personeel.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel92
  - number: '93.1'
    text: |-
      Het bevoegd gezag benoemt de rector, de directeur, de conrector en de adjunct-directeur, de leraren en het overige
      personeel, bedoeld in [artikel 92][ref1], in algemene dienst van het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel92
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '92'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
  - number: '93.2'
    text: |-
      Onder benoeming in algemene dienst van het bevoegd gezag wordt verstaan een benoeming ten behoeve van het
      verrichten van werkzaamheden aan door het bevoegd gezag in stand gehouden scholen.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel93
  - number: '94.1'
    text: |-
      Het bevoegd gezag is verplicht aan studenten die in opleiding zijn voor een functie in het voortgezet onderwijs,
      in de educatie of het beroepsonderwijs, bedoeld in de [Wet educatie en beroepsonderwijs BES][ref1], in het hoger
      beroepsonderwijs of in het basisonderwijs, gelegenheid te bieden de als onderdeel van hun opleiding vereiste
      ervaring in de school te verkrijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0028395
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0028395
  - number: '94.2'
    text: |-
      De verplichting, bedoeld in het eerste lid, betreft studenten die zijn ingeschreven voor een opleiding voor het
      beroep van leraar waarop de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] betrekking heeft of
      anderszins studeren om aan de bekwaamheidseisen te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: '94.3'
    text: |-
      Het in uren uitgedrukte aantal lessen en onderdelen van het in schooltijd verzorgd onderwijsprogramma waarvoor het
      bevoegd gezag in enig schooljaar verplicht is, studenten als bedoeld in het eerste lid tot de school toe te laten,
      bedraagt gezamenlijk 5 procent van het in uren uitgedrukte totale aantal in dat schooljaar te geven lessen en te
      verzorgen onderdelen van het in schooltijd verzorgd onderwijsprogramma. Onze Minister kan het percentage lager
      stellen.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel94
  - number: '94.4'
    text: |-
      Een bevoegd gezag kan een student de verdere toegang tot de school ontzeggen, indien deze in de school in strijd
      handelt met de grondslag en doelstellingen van de school. Van een beslissing tot ontzegging van de toegang tot
      de school wordt mededeling gedaan door toezending of uitreiking van een afschrift aan het bevoegd gezag van de
      betrokken opleidingsinstelling dan wel aan de betrokken staatsexamencommissie, en aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel94
  - number: '94.5'
    text: |-
      De rector of de directeur regelt, onder verantwoordelijkheid van het bevoegd gezag, de werkzaamheden in
      verband met de begeleiding door de leraren van de studenten in de school in overeenstemming met de leraren,
      alsmede in overeenstemming met de betrokken opleidingsinstellingen, dan wel, indien het betreft studenten
      die zich voorbereiden op het afleggen van een staatsexamen ter verkrijging van een bewijs van bekwaamheid, in
      overeenstemming met de betrokken staatsexamencommissie.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel94
  - number: '94.6'
    text: |-
      Onze Minister kan het bevoegd gezag op grond van bijzondere omstandigheden gehele of gedeeltelijke ontheffing van
      de verplichting verlenen. De ontheffing geldt voor een schooljaar.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel94
  - number: '94.7'
    text: |-
      De scholen waarop studenten als bedoeld in het eerste lid, zijn toegelaten, zijn toegankelijk voor de inspectie
      belast met het toezicht op de opleidingsinstellingen, voor de directieleden en de door deze aan te wijzen docenten
      van die opleidingsinstellingen, alsmede voor de leden van de betrokken staatsexamencommissies, een en ander voor
      zover zulks voor de uitoefening van het toezicht op de praktische vorming onderscheidenlijk de begeleiding van de
      praktische vorming van de in de school aanwezige studenten noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel94
  - number: '94.8'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden in verband met het bepaalde in dit artikel nadere
      voorschriften gegeven, betreffende de navolgende onderwerpen:
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel94
  - number: 94.8.a
    text: |-
      het maximum aantal lessen in een vak van een schoolsoort, gedurende dewelke het bevoegd gezag in enig schooljaar
      verplicht is studenten als bedoeld in het eerste lid, toe te laten, welk maximum de 20 procent niet te boven mag
      gaan;
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel94
  - number: 94.8.b
    text: |-
      het maximum aantal studenten als bedoeld in het eerste lid, dat bij dezelfde les kan worden toegelaten, welk
      maximum, behoudens bijzondere omstandigheden, de 3 niet te boven mag gaan, alsmede de gevolgen die het toelaten van
      meer dan een student bij dezelfde les heeft voor het maximum, bedoeld in het derde lid, en het maximum, bedoeld in
      dit lid onder a.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel94
  - number: '94.9'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen in verband met het bepaalde in dit artikel nadere
      voorschriften worden gegeven, betreffende de navolgende onderwerpen:
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel94
  - number: 94.9.a
    text: |-
      de wijze van aanmelden van studenten als bedoeld in het eerste lid, alsmede de termijn die voor de aanmelding door
      het bevoegd gezag mag worden gesteld;
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel94
  - number: 94.9.b
    text: |-
      de wijze waarop door de school bekendheid moet worden gegeven aan opleidingsinstellingen en staatsexamencommissies
      over de beschikbaarheid en de aard van schoolpracticumplaatsen;
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel94
  - number: 94.9.c
    text: de categorieën studenten ten aanzien van wie de verplichting, bedoeld in het eerste lid, niet geldt;
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel94
  - number: 94.9.d
    text: |-
      regulering in de situatie dat, bij een beperkte beschikbaarheid van schoolpracticumplaatsen aan de school,
      gelijktijdig studenten die in opleiding zijn voor een functie in het voortgezet onderwijs, en studenten die in
      opleiding zijn voor een functie in het basisonderwijs, worden aangemeld;
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel94
  - number: 94.9.e
    text: |-
      de vakken en andere programmaonderdelen van een schoolsoort, waarvoor in verband met de geringe omvang van het
      onderwijs daarin, de in het eerste lid bedoelde verplichting niet geldt.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel94
  - number: '96.1'
    text: |-
      Het openbaar onderwijs draagt bij aan de ontwikkeling van de leerlingen met aandacht voor de godsdienstige,
      levensbeschouwelijke en maatschappelijke waarden zoals die leven in de Nederlandse en de Caribische samenleving, en
      met onderkenning van de betekenis van de verscheidenheid van die waarden.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel96
  - number: '96.2'
    text: Openbare scholen zijn toegankelijk voor leerlingen zonder onderscheid naar godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel96
  - number: '96.3'
    text: Openbaar onderwijs wordt gegeven met eerbiediging van ieders godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel96
  - number: '97.1'
    text: |-
      Een eilandsraad kan bij eilandsverordening een openbare rechtspersoon instellen die tot doel heeft een of meer
      openbare scholen in het openbaar lichaam in stand te houden, al dan niet te zamen met openbare scholen als bedoeld
      in de [Wet primair onderwijs BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030280
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0030280
  - number: '97.2'
    text: De eilandsraad maakt het voornemen tot een besluit als bedoeld in het eerste lid bekend.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel97
  - number: '97.3'
    text: |-
      De openbare rechtspersoon oefent met uitzondering van de besluitvorming over de opheffing van een openbare school
      alle taken en bevoegdheden uit van het bevoegd gezag. Hij bezit rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel97
  - number: '97.4'
    text: |-
      De eilandsverordening, bedoeld in het eerste lid, voorziet in ieder geval in een regeling waarin een overheersende
      invloed van de overheid in het bestuur is verzekerd, en waarin voorts wordt geregeld:
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel97
  - number: 97.4.a
    text: de samenstelling, werkwijze en inrichting van het bestuur van de openbare rechtspersoon,
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel97
  - number: 97.4.b
    text: |-
      de wijze van benoeming, herbenoeming, schorsing en ontslag van de bestuursleden, met dien verstande dat de leden
      van het bestuur worden benoemd door de eilandsraad en dat ten minste een derde gedeelte, doch geen meerderheid,
      van die leden wordt benoemd op bindende voordracht van de ouders van de leerlingen die zijn ingeschreven op de
      betrokken school of scholen,
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel97
  - number: 97.4.c
    text: de termijn waarvoor de bestuursleden worden benoemd,
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel97
  - number: 97.4.d
    text: |-
      de vaststelling van de begroting na goedkeuring door de eilandsraad en de vaststelling van de jaarrekening na
      instemming van de eilandsraad,
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel97
  - number: 97.4.e
    text: de wijze waarop de eilandsraad toezicht op het bestuur uitoefent,
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel97
  - number: 97.4.f
    text: de gronden waarop het bestuur kan besluiten de vergaderingen besloten te houden, en
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel97
  - number: 97.4.g
    text: |-
      de periode waarvoor de openbare rechtspersoon in het leven wordt geroepen, met dien verstande dat deze periode ten
      minste 5 jaren bedraagt.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel97
  - number: '97.5'
    text: |-
      De goedkeuring bedoeld in het vierde lid, onderdeel d, kan worden onthouden wegens strijd met het recht of met het
      algemeen belang, waaronder begrepen het financiële belang van het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel97
  - number: '97.6'
    text: |-
      Het bestuur brengt jaarlijks aan de eilandsraad verslag uit over de werkzaamheden, waarbij in ieder geval aandacht
      wordt geschonken aan de wezenskenmerken van het openbaar onderwijs. Het verslag wordt openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel97
  - number: '97.7'
    text: |-
      De vergaderingen van het bestuur van de openbare rechtspersoon zijn openbaar, tenzij het bestuur anders beslist, op
      gronden, vermeld in de eilandsverordening.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel97
  - number: '97.8'
    text: |-
      Indien voor 1 februari van het jaar waarvoor de begroting geldt, de begroting niet is goedgekeurd, neemt de
      eilandsraad de maatregelen die hij nodig acht om de continuïteit van het onderwijsproces te waarborgen.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel97
  - number: '97.9'
    text: |-
      De eilandsraad is in geval van ernstige taakverwaarlozing door het bestuur of functioneren in strijd met de wet
      bevoegd zelf te voorzien in het bestuur van de scholen en zo nodig de openbare rechtspersoon te ontbinden.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel97
  - number: '99.1'
    text: |-
      Een rechtspersoon die een openbare school in stand houdt, kan de instandhouding van die school overdragen aan een
      andere rechtspersoon die tot de instandhouding van een openbare school bevoegd is.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel99
  - number: '99.2'
    text: |-
      De overdracht geschiedt bij notariële akte. Bij deze akte verbindt de overdragende rechtspersoon zich tevens de
      rechten ten aanzien van gebouwen, terreinen en roerende zaken over te dragen. Deze akte geldt tevens als akte van
      levering, bedoeld in [artikel 89 van Boek 3 van het Burgerlijk Wetboek BES][ref1]. In de akte wordt tevens bepaald
      dat de rechtspersoon aan wie wordt overgedragen, het personeel in gelijke betrekkingen aanstelt met ingang van de
      datum van overdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel89
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '89'
  - number: '99.3'
    text: |-
      Door overdracht met inachtneming van het eerste en tweede lid treedt de verkrijgende rechtspersoon in alle uit
      de wet voortvloeiende rechten en verplichtingen van zijn rechtsvoorganger, onverminderd hetgeen verder voor de
      overgang daarvan naar burgerlijk recht is vereist.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel99
  - number: '99.4'
    text: |-
      Voor zover het betreft scholen voor voorbereidend wetenschappelijk onderwijs, voor hoger en middelbaar algemeen
      voortgezet onderwijs, voor voorbereidend beroepsonderwijs en voor praktijkonderwijs kan het bestuurscollege in
      bijzondere omstandigheden ontheffing verlenen van de verplichting tot overdracht van de rechten ten aanzien van
      gebouwen, terreinen en roerende zaken.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel99
  - number: '100'
    text: |-
      In afwijking van [artikel 92][ref1] legt de Rijksvertegenwoordiger de disciplinaire straf of de schorsing op of
      verleent hij het ontslag, indien het betreft een rector, een directeur, een conrector, een adjunct-directeur of een
      leraar van een openbare school, die tevens lid is van de eilandsraad, welke die school in stand houdt.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel92
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '92'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
  - number: '101.1'
    text: Het onderwijs aan openbare scholen wordt gegeven met eerbiediging van ieders geloofs- of levensovertuiging.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel101
  - number: '101.2'
    text: |-
      Wij kunnen hem, die zich in dit opzicht aan plichtsverzuim schuldig maakt, voor ten hoogste een jaar en bij
      herhaling voor onbepaalde tijd in zijn bevoegdheid tot het geven van onderwijs aan een openbare school schorsen.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel101
  - number: '102.1'
    text: |-
      Aan de openbare scholen worden op verzoek van kerkelijke gemeenten of van plaatselijke kerken de leerlingen in
      de gelegenheid gesteld in de schoollokalen godsdienstonderwijs te volgen van godsdienstleraren, daartoe door die
      gemeenten of kerken aan te wijzen.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel102
  - number: '102.2'
    text: De schoollokalen worden, zo nodig verlicht, kosteloos voor het godsdienstonderwijs beschikbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel102
  - number: '102.3'
    text: |-
      Bij een geschil omtrent het vaststellen van lessen of het beschikbaar stellen van lokalen van openbare scholen
      beslist Onze Minister bij beschikking.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel102
  - number: '102.4'
    text: |-
      Aan de kerkelijke gemeenten of de plaatselijke kerken kan een subsidie worden verstrekt. De
      [artikelen 4 tot en met 19 van de Wet overige OCW-subsidies][ref1] zijn van toepassing, met dien verstande dat de
      subsidie slechts kan worden verstrekt bij algemene maatregel van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0009458#Artikel4
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0009458
        artikel: '4'
  - number: '102.5'
    text: |-
      Voor de toepassing van dit artikel worden met kerkelijke gemeenten gelijkgesteld verenigingen met volledige
      rechtsbevoegdheid, die zich blijkens de statuten het geven of doen geven van godsdienstonderwijs ten doel stellen.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel102
  - number: '102.6'
    text: |-
      Het bevoegd gezag ziet erop toe dat dit onderwijs uitsluitend wordt gegeven door een leraar die blijkens een
      daartoe strekkende verklaring van de aanwijzende kerkelijke gemeente of plaatselijke kerk:
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel102
  - number: 102.6.a
    text: |-
      voldoet aan de bekwaamheidseisen die krachtens [artikel 86, eerste lid][ref1], voor het geven van dat onderwijs
      zijn vastgesteld, en


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel86
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '86'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
  - number: 102.6.b
    text: zijn bekwaamheid onderhoudt.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel102
  - number: '103.1'
    text: |-
      Aan de openbare scholen worden op verzoek van door Ons tot dit doel toegelaten genootschappen op geestelijke
      grondslag de leerlingen, wier ouders daartoe de wens te kennen geven, in de gelegenheid gesteld in de schoollokalen
      levensbeschouwelijk vormingsonderwijs te volgen van leraren, daartoe door deze genootschappen aan te wijzen.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel103
  - number: '103.2'
    text: De schoollokalen worden, zo nodig verlicht, kosteloos voor het vormingsonderwijs beschikbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel103
  - number: '103.3'
    text: |-
      Bij een geschil omtrent het vaststellen van lessen of het beschikbaar stellen van lokalen van openbare scholen
      beslist Onze Minister bij beschikking.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel103
  - number: '103.4'
    text: |-
      Aan de genootschappen, bedoeld in het eerste lid, kan een subsidie worden verstrekt. De
      [artikelen 4 tot en met 19 van de Wet overige OCW-subsidies][ref1] zijn van toepassing, met dien verstande dat de
      subsidie slechts kan worden verstrekt bij algemene maatregel van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0009458#Artikel4
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0009458
        artikel: '4'
  - number: '103.5'
    text: |-
      Het bevoegd gezag ziet erop toe dat dit onderwijs uitsluitend wordt gegeven door een leraar die blijkens een
      daartoe strekkende verklaring van het aanwijzend genootschap op geestelijke grondslag:
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel103
  - number: 103.5.a
    text: |-
      voldoet aan de bekwaamheidseisen die krachtens [artikel 86, eerste lid][ref1], voor het geven van dat onderwijs
      zijn vastgesteld, en


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel86
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '86'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
  - number: 103.5.b
    text: zijn bekwaamheid onderhoudt.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel103
  - number: '104.1'
    text: |-
      Indien binnen redelijke afstand van de woning van de leerling niet de gelegenheid bestaat tot het volgen van het
      onderwijs aan een openbare school, mag aan deze leerling de toegang tot een gelijksoortige, uit de openbare kas
      bekostigde bijzondere school niet worden geweigerd op grond van levensbeschouwing, tenzij de school uitsluitend
      bestemd is voor interne leerlingen.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel104
  - number: '104.2'
    text: |-
      Indien tot een bijzondere school ingevolge het eerste lid andere leerlingen worden toegelaten dan voor wie de
      school in verband met de levensbeschouwing wordt in stand gehouden, kunnen deze leerlingen niet worden verplicht
      tot het volgen van de lessen in de vakken of andere programmaonderdelen, die in verband met die levensbeschouwing
      worden gegeven.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel104
  - number: '105.1'
    text: |-
      De bijzondere school staat onder het bestuur van een rechtspersoon met volledige rechtsbevoegdheid die zich het
      geven van onderwijs in de zin van deze wet ten doel stelt zonder daarbij het maken van winst te beogen.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel105
  - number: '105.2'
    text: Het schoolbestuur draagt zorg voor een deskundig beheer.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel105
  - number: '106.1'
    text: |-
      De rechtspersoon die een bijzondere school in stand houdt, kan de instandhouding van die school overdragen aan een
      andere rechtspersoon die voldoet aan het bepaalde in [artikel 105, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel105
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '105'
        hoofdstuk: III
        afdeling: I
  - number: '106.2'
    text: |-
      De overdracht geschiedt bij notariële akte. Bij deze akte verbindt de overdragende rechtspersoon zich tevens de
      rechten ten aanzien van gebouwen, terreinen en roerende zaken over te dragen. Deze akte geldt tevens als akte van
      levering, bedoeld in [artikel 89 van Boek 3 van het Burgerlijk Wetboek BES][ref1]. In de akte wordt tevens bepaald
      dat de rechtspersoon aan wie wordt overgedragen, het personeel in gelijke betrekkingen benoemt met ingang van de
      datum van overdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel89
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '89'
  - number: '106.3'
    text: |-
      Door overdracht met inachtneming van het eerste en tweede lid treedt de verkrijgende rechtspersoon in alle uit de
      wet voortvloeiende rechten en verplichtingen van zijn rechtsvoorganger met betrekking tot de school, onverminderd
      hetgeen verder voor de overgang daarvan naar burgerlijk recht is vereist.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel106
  - number: '106.4'
    text: |-
      Voor zover het betreft scholen voor voorbereidend wetenschappelijk onderwijs, voor hoger en middelbaar algemeen
      voortgezet onderwijs en voor voorbereidend beroepsonderwijs kan het bestuurscollege in bijzondere omstandigheden
      ontheffing verlenen van de verplichting tot overdracht van de rechten ten aanzien van gebouwen, terreinen en
      roerende zaken.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel106
  - number: '106.5'
    text: |-
      Bij een splitsing als bedoeld in [artikel 335 van Boek 2 van het Burgerlijk Wetboek BES][ref1] van een
      rechtspersoon die een school in stand houdt, wordt in de splitsingsakte bepaald dat de voortbestaande splitsende
      rechtspersoon de school in stand zal houden of op welke verkrijgende rechtspersoon de instandhouding van de school
      overgaat. In het laatste geval zijn het tweede tot en met vierde lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel334
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '334'
  - number: '107.1'
    text: Ieder personeelslid is in het bezit van een door het bevoegd gezag en hemzelf getekende akte van benoeming.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel107
  - number: '107.2'
    text: |-
      De akte van benoeming bevat ten minste bepalingen van gelijke inhoud als de bepalingen die zijn vastgesteld in
      [artikel 11 van de Wet materieel ambtenarenrecht BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel11
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '11'
  - number: '108'
    text: |-
      In een geval als bedoeld in [artikel 94, vierde lid, eerste volzin][ref1], maakt het bevoegd gezag van een
      bijzondere school de beslissing tot ontzegging van de toegang tot de school schriftelijk en met redenen omkleed
      bekend aan de betrokken student.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel94
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '94'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
  - number: '110'
    text: |-
      Het bestuur van een bijzondere school voor voortgezet onderwijs geeft binnen vier weken na de oprichting van de
      school onder overlegging van de statuten der instelling, die de school in stand houdt, en van de reglementen, van
      die oprichting kennis aan Onze Minister. Indien de statuten of reglementen worden gewijzigd of ingetrokken, wordt
      eveneens binnen vier weken van de wijziging of van de intrekking van de statuten of reglementen aan Onze Minister
      kennis gegeven.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel110
  - number: '117.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen inrichtingen voor voortgezet onderwijs als bedoeld in
      [artikel 6, onderdeel e][ref1], worden aangewezen die voor bekostiging uit 's Rijks kas in aanmerking komen.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel6
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '6'
  - number: '117.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor de aangewezen inrichtingen voor voortgezet onderwijs
      voorschriften worden gegeven voor de toepassing van de bij of krachtens deze wet vastgestelde voorschriften over:
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel117
  - number: 117.2.a
    text: de inrichting van het onderwijs,
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel117
  - number: 117.2.b
    text: de examens,
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel117
  - number: 117.2.c
    text: de rechtspositie van het personeel,
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel117
  - number: 117.2.d
    text: de benoembaarheidsvereisten van het personeel, en
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel117
  - number: 117.2.e
    text: de aanvang, wijze en beëindiging van de bekostiging.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel117
  - number: '118'
    text: Bekostiging uit de openbare kas van een school neemt geen aanvang dan krachtens de bepalingen van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel118
  - number: '119.1'
    text: |-
      Onze Minister kan een school of scholengemeenschap voor bekostiging in aanmerking brengen indien redelijkerwijs
      kan worden aangenomen dat deze, mede gelet op de belangstelling voor de desbetreffende schoolsoort, de verlangde
      richting en het leerlingenverloop, blijkens statistische gegevens, onder meer verstrekt door het Centraal Bureau
      voor de Statistiek, en mede gelet op de hoogte van de bekostiging die krachtens deze titel wordt verstrekt, zal
      worden bezocht door een aantal leerlingen dat voldoende is om een school van voldoende kwaliteit in stand te
      houden.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel119
  - number: '119.2'
    text: Bij ministeriële regeling kunnen nadere regels gesteld omtrent de criteria, genoemd in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel119
  - number: '119.3'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de bekostiging van een nieuw te vormen afdeling als bedoeld in
      [artikel 28][ref1] aan een reeds bekostigde school voor voorbereidend beroepsonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel28
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '28'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '119.4'
    text: |-
      Een op grond van het eerste lid voor bekostiging in aanmerking gebrachte school of scholengemeenschap wordt
      aangeduid als hoofdvestiging.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel119
  - number: '119.5'
    text: |-
      Onze Minister kan voor bekostiging in aanmerking brengen een school waarvoor een aanvraag als bedoeld in
      [artikel 121, eerste lid][ref1], is ingediend. Onze Minister brengt voor bekostiging in aanmerking een school
      waarvoor een aanvraag als bedoeld in artikel 121, tweede lid, is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel121
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '121'
        afdeling: I
  - number: '119.6'
    text: De besluiten, bedoeld in het eerste en vierde lid, worden gepubliceerd in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel119
  - number: '120.1'
    text: |-
      Het bevoegd gezag kan bij Onze Minister een aanvraag indienen om een school of scholengemeenschap voor bekostiging
      in aanmerking te brengen. De aanvraag wordt ingediend voor 1 november.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel120
  - number: '120.2'
    text: |-
      Elke aanvraag vermeldt de schoolsoorten, de verlangde richting en de plaats van vestiging van de school of
      scholengemeenschap en gaat vergezeld van een prognose over de te verwachten omvang.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel120
  - number: '120.3'
    text: |-
      Onze Minister besluit met inachtneming van [artikel 119][ref1] voor 1 mei volgend op de aanvraag of de school of
      scholengemeenschap voor bekostiging in aanmerking wordt gebracht. Indien het besluit niet voor 1 mei kan worden
      genomen, stelt Onze Minister de aanvrager daarvan in kennis en noemt hij daarbij een termijn waarbinnen het besluit
      wel tegemoet kan worden gezien.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel119
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '119'
        afdeling: I
  - number: '120.4'
    text: |-
      De bekostiging vangt aan op 1 augustus van enig kalenderjaar, ten vroegste in het eerste en ten laatste in het
      zesde kalenderjaar na het besluit van Onze Minister. Behoudens in het laatste geval vangt de bekostiging aan in
      het kalenderjaar volgend op het kalenderjaar waarin het bevoegd gezag, voor 1 augustus, heeft aangetoond dat het
      bestuurscollege van het betreffende openbaar lichaam uiterlijk met ingang van 1 augustus van het eerstgenoemde
      kalenderjaar de benodigde huisvesting ter beschikking zal stellen.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel120
  - number: '121.1'
    text: |-
      De Rijksvertegenwoordiger draagt er zorg voor dat is voorzien in de behoefte aan openbaar onderwijs door een
      voldoende aantal scholen in het openbaar lichaam. Daartoe kan de Rijksvertegenwoordiger het bestuurscollege van
      het openbaar lichaam opdragen, een aanvraag bij Onze Minister in te dienen om een openbare school voor bekostiging
      in aanmerking te brengen indien de ouders van een naar het oordeel van de Rijksvertegenwoordiger voldoende groot
      aantal leerlingen hebben aangegeven dat zij dat wensen en het bestuurscollege van het openbaar lichaam daaraan niet
      heeft voldaan.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel121
  - number: '121.2'
    text: |-
      Onze Minister kan het bestuurscollege van het openbaar lichaam opdragen een aanvraag bij hem in te dienen om een
      openbare school voor bekostiging in aanmerking te brengen, indien de Rijksvertegenwoordiger het eerste lid niet
      toepast en ouders van een naar het oordeel van Onze Minister voldoende groot aantal leerlingen hebben aangegeven
      dat zij indiening van een dergelijke aanvraag wensen.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel121
  - number: '121.3'
    text: |-
      Indien een besluit van Onze Minister op een aanvraag als bedoeld in dit artikel onherroepelijk is geworden, gaat
      het bestuurscollege van het openbaar lichaam over tot stichting van de daarbij voor bekostiging in aanmerking
      gebrachte school.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel121
  - number: '121.4'
    text: |-
      De bekostiging vangt aan op 1 augustus van enig kalenderjaar, ten vroegste in het eerste en ten laatste in het
      zesde kalenderjaar na het besluit van Onze Minister, afhankelijk van het moment dat het bestuurscollege van het
      openbaar lichaam huisvesting ter beschikking heeft.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel121
  - number: '122.1'
    text: |-
      Onze Minister kan, onder door hem te stellen voorwaarden, voor bekostiging in aanmerking brengen een school die
      wordt opgericht door omzetting van een bekostigde openbare school in een gelijksoortige bijzondere school.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel122
  - number: '122.2'
    text: |-
      Onze Minister brengt voor bekostiging in aanmerking een school die wordt opgericht door omzetting van een
      bekostigde bijzondere school in een gelijksoortige openbare school of door omzetting van een bekostigde bijzondere
      school in een gelijksoortige bijzondere school van een andere richting.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel122
  - number: '122.3'
    text: Een omzetting kan slechts plaatsvinden met ingang van 1 augustus van enig kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel122
  - number: '123.1'
    text: |-
      Een scholengemeenschap omvat een school of inrichting in de zin van deze wet, en een of meer andere al dan niet in
      deze wet bedoelde scholen, inrichtingen of instellingen, die niet zijn instellingen voor hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel123
  - number: '123.2'
    text: |-
      Aan een school of scholengemeenschap kan, naast een hoofdvestiging als bedoeld in [artikel 119, vierde lid][ref1],
      een nevenvestiging zijn verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel119
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '119'
        afdeling: I
  - number: '123.3'
    text: Een nevenvestiging is gelegen in hetzelfde openbaar lichaam als de desbetreffende hoofdvestiging.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel123
  - number: '123.4'
    text: |-
      Een nevenvestiging komt tot stand door een samenvoeging als bedoeld in [artikel 124, tweede lid][ref1], of door
      vorming van een nieuwe nevenvestiging van een school als bedoeld in artikel 124, vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel124
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '124'
        afdeling: I
  - number: '123.5'
    text: |-
      Op een nevenvestiging kan onderwijs worden verzorgd in dezelfde schoolsoorten als bedoeld in [artikel 6][ref1], in
      dezelfde afdelingen als bedoeld in [artikel 28][ref2], en in dezelfde leerjaren als op de hoofdvestiging.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel28
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '28'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '124.1'
    text: |-
      De aanspraak op bekostiging blijft bestaan indien het bevoegd gezag een vestiging van een school of
      scholengemeenschap binnen de grenzen van het openbaar lichaam verplaatst.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel124
  - number: '124.2'
    text: 'Onze Minister kan voor bekostiging in aanmerking brengen:'
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel124
  - number: 124.2.a
    text: |-
      een school of scholengemeenschap die is ontstaan door samenvoeging van scholen of scholengemeenschappen, indien
      deze binnen hetzelfde openbaar lichaam gevestigd zijn,
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel124
  - number: 124.2.b
    text: |-
      een scholengemeenschap die is ontstaan door samenvoeging van een scholengemeenschap waarvan een school voor
      middelbaar algemeen voortgezet onderwijs of een school voor voorbereidend beroepsonderwijs deel uitmaakt met
      een instelling als bedoeld in de [Wet educatie en beroepsonderwijs BES][ref1] die in hetzelfde openbaar lichaam
      gevestigd is, of


      [ref1]: https://wetten.overheid.nl/BWBR0028395
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0028395
  - number: 124.2.c
    text: een of meer scholen die door het bevoegd gezag worden afgesplitst van een scholengemeenschap.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel124
  - number: '124.3'
    text: |-
      Na een samenvoeging wordt op een vestiging onderwijs verzorgd in dezelfde schoolsoorten als bedoeld in
      [artikel 6][ref1], in dezelfde afdelingen als bedoeld in [artikel 28][ref2], en in dezelfde leerjaren als op
      de desbetreffende vestiging voor de samenvoeging, behoudens wijzigingen in het onderwijsaanbod op grond van
      [artikel 119, derde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel119
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '28'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '119'
        afdeling: I
  - number: '124.4'
    text: |-
      Onze Minister kan voor bekostiging in aanmerking brengen een nevenvestiging als bedoeld in [artikel 123][ref1],
      indien het bevoegd gezag heeft aangetoond dat het bestuurscollege van het desbetreffende openbaar lichaam de
      benodigde huisvesting ter beschikking zal stellen. De voorwaarde in de eerste volzin is niet van toepassing
      ten aanzien van instellingen als bedoeld in de [Wet educatie en beroepsonderwijs BES][ref2] en scholen waarvoor
      jaarlijks een bedrag voor huisvestingskosten wordt betaald op grond van [artikel 146][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel123
      [ref2]: https://wetten.overheid.nl/BWBR0028395
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel146
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '123'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0028395
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '146'
        afdeling: II
  - number: '124.5'
    text: |-
      [Artikel 119, zesde lid][ref1], is van overeenkomstige toepassing bij toepassing van het tweede en vierde lid.
      [Artikel 120, eerste en derde lid][ref2], is van overeenkomstige toepassing bij toepassing van het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel119
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel120
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '119'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '120'
        afdeling: I
  - number: '125'
    text: |-
      Onze Minister kan onder door hem nader te stellen voorwaarden aanvullende middelen ter beschikking
      stellen die niet strekken tot bekostiging van het onderwijs, bedoeld in deze wet, maar die direct
      of indirect dienstig zijn voor de uitvoering van het onderwijs of voor verhoging van de mogelijkheid
      tot deelname aan het onderwijs. Voor zover toepassing van de eerste volzin het verstrekken van
      subsidie betreft, zijn de [titels 4.1][ref1] en [4.2 van de Algemene wet bestuursrecht][ref2] en de
      [artikelen 4 tot en met 19 van de Wet overige OCW-subsidies][ref3] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537
      [ref3]: https://wetten.overheid.nl/BWBR0009458#Artikel4
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0005537
      - id: ref3
        bwb_id: BWBR0009458
        artikel: '4'
  - number: '126'
    text: |-
      In afwijking van [artikel 7, eerste lid, van de Wet administratieve rechtspraak BES][ref1] kan een belanghebbende
      beroep instellen bij het Gemeenschappelijke Hof van Justitie van Aruba, Curaçao, Sint Maarten en van Bonaire,
      Sint Eustatius en Saba tegen een besluit op grond van deze afdeling met uitzondering van [artikel 125][ref2]. De
      [artikelen 54][ref3] en [55 van de Wet administratieve rechtspraak BES][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel125
      [ref3]: https://wetten.overheid.nl/BWBR0028455#Artikel54
      [ref4]: https://wetten.overheid.nl/BWBR0028455#Artikel55
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0028455
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '125'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0028455
        artikel: '54'
      - id: ref4
        bwb_id: BWBR0028455
        artikel: '55'
  - number: '127'
    text: Bij ministeriële regeling kunnen nadere regels worden vastgesteld voor de uitvoering van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel127
  - number: '128'
    text: |-
      De [artikelen 129 tot en met 147][ref1] zijn slechts van toepassing op scholen voor voorbereidend wetenschappelijk
      onderwijs, voor hoger en middelbaar algemeen voortgezet onderwijs, voor voorbereidend beroepsonderwijs en voor
      praktijkonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel129
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '129'
        afdeling: II
  - number: '129.1'
    text: |-
      De eilandsraad of het bestuurscollege draagt overeenkomstig het bepaalde in dit hoofdstuk ten behoeve van de
      scholen zorg voor de voorzieningen in de huisvesting op het grondgebied van het openbaar lichaam. Deze huisvesting
      is zodanig dat kan worden voldaan aan de redelijke eisen die het onderwijs aan de huisvesting van scholen in het
      openbaar lichaam stelt. De eilandsraad of het bestuurscollege behandelt daarbij de door het openbaar lichaam in
      stand gehouden scholen en de andere scholen op gelijke voet.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel129
  - number: '129.2'
    text: |-
      Bij algemene maatregel van bestuur worden bruto vloeroppervlakten per gelijktijdig aanwezige leerling
      voorgeschreven die voorzieningen in de huisvesting ten minste dienen te bevatten. Deze oppervlakten kunnen per
      schoolsoort verschillend worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel129
  - number: '130.1'
    text: 'Voor de toepassing van dit hoofdstuk worden onder voorzieningen in de huisvesting begrepen:'
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel130
  - number: 130.1.a
    text: 'voor blijvend onderscheidenlijk voor tijdelijk gebruik bestemde voorzieningen, bestaande uit:'
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel130
  - number: 130.1.a.1°
    text: |-
      nieuwbouw, een bestaand gebouw of een gedeelte daarvan, verplaatsing van een bestaand gebouw of van een gedeelte
      daarvan, terreinen, alsmede eerste aanschaf van leer- en hulpmiddelen en meubilair,
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel130
  - number: 130.1.a.2°
    text: uitbreiding van de onder 1° bedoelde voorzieningen, en
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel130
  - number: 130.1.a.3°
    text: medegebruik van een ruimte die geschikt is voor het onderwijs;
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel130
  - number: 130.1.b
    text: herstel van constructiefouten aan het gebouw of het terrein;
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel130
  - number: 130.1.c
    text: |-
      herstel en vervanging in verband met schade aan gebouw, leer- en hulpmiddelen en meubilair in geval van bijzondere
      omstandigheden.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel130
  - number: '130.2'
    text: De kosten van bouwvoorbereiding kunnen tot de kosten van huisvesting worden gerekend.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel130
  - number: '131.1'
    text: |-
      Het bestuurscollege stelt jaarlijks, na overleg met de betrokken bevoegde gezagsorganen, ten behoeve van het
      eerstvolgende jaar voor een door hem te bepalen tijdstip een bekostigingsplafond vast voor de bekostiging van de
      voorzieningen in de huisvesting voor:
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel131
  - number: 131.1.a
    text: |-
      basisscholen als bedoeld in de [Wet primair onderwijs BES][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0030280
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0030280
  - number: 131.1.b
    text: |-
      scholen voor voorbereidend wetenschappelijk onderwijs, voor hoger en middelbaar algemeen voortgezet onderwijs, voor
      voorbereidend beroepsonderwijs en voor praktijkonderwijs.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel131
  - number: '131.2'
    text: |-
      Het bekostigingsplafond wordt zodanig vastgesteld dat redelijkerwijs kan worden voorzien in de huisvesting van de
      in het eerste lid bedoelde scholen op het grondgebied van het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel131
  - number: '132.1'
    text: |-
      Het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school dat een voorziening in de
      huisvesting wenst, dient een aanvraag voor 1 september voorafgaand aan het jaar waarop de aanvraag betrekking heeft
      in bij het bestuurscollege.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel132
  - number: '132.2'
    text: De eilandsraad stelt bij verordening de vereisten van de aanvraag vast.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel132
  - number: '132.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op de door het openbaar lichaam in stand gehouden
      scholen.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel132
  - number: '133.1'
    text: |-
      Het bestuurscollege beslist voor 1 januari van het jaar waarop de aanvraag betrekking heeft op de aanvraag.
      Het bestuurscollege geeft het bevoegd gezag de gelegenheid om een onvolledige aanvraag binnen een door het
      bestuurscollege te stellen termijn aan te vullen.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel133
  - number: '133.2'
    text: 'Het bestuurscollege kan besluiten de aanvraag niet te behandelen, indien:'
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel133
  - number: 133.2.a
    text: |-
      het bevoegd gezag niet heeft voldaan aan de vereisten voor het in behandeling nemen van de aanvraag, uit de
      eilandsverordening, bedoeld in [artikel 132, tweede lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel132
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '132'
        afdeling: II
  - number: 133.2.b
    text: |-
      de verstrekte gegevens en bescheiden onvoldoende zijn voor de beoordeling van de aanvraag of voor de voorbereiding
      van de beschikking.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel133
  - number: '133.3'
    text: |-
      Indien het bekostigingsplafond, bedoeld in [artikel 131][ref1], niet toereikend is, wordt de volgorde van de
      verlening van bekostiging bepaald op basis van de urgentie van de gevraagde voorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel131
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '131'
        afdeling: II
  - number: '133.4'
    text: |-
      De beschikking van het bestuurscollege kan een gedeelte van de gewenste voorziening dan wel een andere voorziening
      dan gewenst omvatten.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel133
  - number: '134.1'
    text: |-
      In afwijking van de termijnen genoemd in de [artikelen 132][ref1] en [133][ref2], beslist het bestuurscollege
      binnen vier weken op een aanvraag voor een voorziening in de huisvesting die gelet op de voortgang van het
      onderwijs geen uitstel kan lijden.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel132
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel133
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '132'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '133'
        afdeling: II
  - number: '134.2'
    text: 'Het bestuurscollege wijst de aanvraag af, indien:'
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel134
  - number: 134.2.a
    text: |-
      de beslissing over de voorziening kan worden genomen met inachtneming van de termijn, bedoeld in
      [artikel 133, eerste lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel133
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '133'
        afdeling: II
  - number: 134.2.b
    text: |-
      een van de weigeringsgronden, genoemd in
      [artikel 135, eerste lid, onderdelen a tot en met d en f, en tweede lid][ref1], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel135
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '135'
        afdeling: II
  - number: '135.1'
    text: 'Een voorziening in de huisvesting wordt slechts geweigerd, indien:'
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel135
  - number: 135.1.a
    text: |-
      de gewenste voorziening geen voorziening is in de zin van [artikel 130][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel130
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '130'
        afdeling: II
  - number: 135.1.b
    text: |-
      de gewenste voorziening niet gerechtvaardigd is op grond van de aard en de omvang van de voorzieningen waarover de
      school reeds beschikt, voor zover deze uit de openbare kas zijn bekostigd,
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel135
  - number: 135.1.c
    text: |-
      de gewenste voorziening niet gerechtvaardigd is op grond van de te verwachten ontwikkeling van het aantal
      leerlingen of onderwijskundige ontwikkelingen,
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel135
  - number: 135.1.d
    text: |-
      op andere wijze dan is gewenst redelijkerwijs in de behoefte aan huisvesting kan worden voorzien, onder meer
      doordat binnen redelijke afstand van de gewenste plaats van de voorziening gebruik dan wel medegebruik mogelijk is,
      of een reeds voor bekostiging in aanmerking gebracht gebouw of deel daarvan beschikbaar komt,
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel135
  - number: 135.1.e
    text: |-
      het bekostigingsplafond, bedoeld in [artikel 131][ref1], niet toereikend is voor de te verstrekken voorzieningen
      voor scholen als bedoeld in het eerste lid, onderdelen a en b, van dat artikel, of


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel131
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '131'
        afdeling: II
  - number: 135.1.f
    text: de gewenste voorziening anders dan op grond van de onderdelen b tot en met d niet noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel135
  - number: '135.2'
    text: |-
      Een voorziening in de huisvesting kan tevens worden geweigerd, indien de voorziening als gevolg van het verwijtbaar
      nalaten van noodzakelijk onderhoud in een slechte bouwkundige staat verkeert of indien de voorziening nodig is voor
      herstel van schade die is veroorzaakt door schuld of toedoen van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel135
  - number: '136.1'
    text: |-
      Het bestuurscollege beslist met ingang van welk tijdstip de bekostiging van een voorziening daadwerkelijk een
      aanvang kan nemen, onverminderd het bepaalde in [artikel 137][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel137
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '137'
        afdeling: II
  - number: '136.2'
    text: |-
      De aanspraak op bekostiging van een voorziening vervalt, indien niet binnen een bij de beschikking te
      bepalen termijn met betrekking tot de voorziening een bouwopdracht is gegeven dan wel een koop-, huur- of
      erfpachtovereenkomst is gesloten.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel136
  - number: '137'
    text: |-
      Voorzieningen komen voor bekostiging in aanmerking, mits op het op grond van [artikel 136, eerste lid][ref1],
      vastgestelde tijdstip,


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel136
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '136'
        afdeling: II
  - number: 137.a
    text: is voldaan aan de bij of krachtens de wet gestelde voorschriften, en
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel137
  - number: 137.b
    text: |-
      de feiten en omstandigheden waarin de school verkeert, ten opzichte van de feiten en omstandigheden ten tijde van
      de vaststelling van de beschikking tot verlening niet ingrijpend zijn gewijzigd.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel137
  - number: '138.1'
    text: |-
      Het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school geeft opdracht de voorziening
      in de huisvesting waartoe op grond van de [artikelen 133][ref1] en [134][ref2] kan worden overgegaan, tot stand
      te brengen met daartoe door het openbaar lichaam beschikbaar te stellen gelden, tenzij het met het bestuurscollege
      overeenkomt dat het openbaar lichaam deze voorziening tot stand brengt.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel133
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel134
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '133'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '134'
        afdeling: II
  - number: '138.2'
    text: |-
      Indien het openbaar lichaam de voorziening in de huisvesting van een niet door het openbaar lichaam in stand
      gehouden school tot stand heeft gebracht, worden gebouw en terrein aan het bevoegd gezag in eigendom overgedragen,
      tenzij het bestuurscollege en het bevoegd gezag anders overeenkomen.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel138
  - number: '138.3'
    text: |-
      Indien de voorziening in de huisvesting, bedoeld in het tweede lid, niet voldoet aan de eisen voor
      eigendomsoverdracht, geeft het bestuurscollege deze aan het bevoegd gezag in gebruik.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel138
  - number: '139'
    text: |-
      Indien het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school aanspraak heeft op
      bekostiging van een voorziening in de huisvesting, behoeven de bouwplannen en de desbetreffende begrotingen de
      instemming van het bestuurscollege, tenzij het bevoegd gezag met het bestuurscollege overeenkomt dat het openbaar
      lichaam deze voorziening tot stand brengt.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel139
  - number: '140'
    text: |-
      Het openbaar lichaam brengt een voorziening in de huisvesting van een niet door het openbaar lichaam in stand
      gehouden school slechts tot stand, indien tussen het bestuurscollege en het bevoegd gezag overeenstemming bestaat
      over de bouwplannen en de wijze van uitvoering.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel140
  - number: '141.1'
    text: |-
      Het bevoegd gezag is verplicht het gebouw en terrein, alsmede de roerende zaken waarvoor bekostiging wordt genoten,
      behoorlijk te gebruiken en te onderhouden.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel141
  - number: '141.2'
    text: |-
      Vervreemding door het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school anders dan op
      grond van de [artikelen 99][ref1] en [106][ref2], van gebouwen, terreinen en roerende zaken waarvoor bekostiging
      wordt genoten, of bezwaren met een zakelijk recht door het bevoegd gezag van een niet door het openbaar lichaam in
      stand gehouden school van zodanige gebouwen en terreinen is zonder toestemming van het bestuurscollege nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel106
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '99'
        hoofdstuk: II
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '106'
        hoofdstuk: III
        afdeling: I
  - number: '141.3'
    text: |-
      Het tweede lid is niet van toepassing ten aanzien van het recht van opstal ten behoeve van een door het openbaar
      lichaam te plaatsen tijdelijke voorziening in de huisvesting op grond die eigendom is van het bevoegd gezag van de
      betrokken school.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel141
  - number: '142.1'
    text: |-
      Het bestuurscollege is bevoegd een gedeelte van een gebouw of terrein dat tijdelijk of gedurende een gedeelte
      van de dag niet nodig zal zijn voor de daar gevestigde school, gedurende die tijd te bestemmen als huisvesting
      voor een andere school, voor ander uit de openbare kas bekostigd onderwijs niet zijnde voortgezet onderwijs,
      of voor educatie als bedoeld in de [Wet educatie en beroepsonderwijs BES][ref1] dan wel voor andere culturele,
      maatschappelijke of recreatieve doeleinden. Het voorgenomen gebruik dient zich te verdragen met het onderwijs
      aan de in het gebouw gevestigde school. Tevens is het bestuurscollege bevoegd ten behoeve van het onderwijs in
      lichamelijke opvoeding of expressie-activiteiten een gebouw of terrein dan wel een gedeelte daarvan dat tijdelijk
      gedurende gedeelten van de dag of in het geheel niet nodig zal zijn voor de daar gevestigde school, gedurende die
      tijd te bestemmen als huisvesting voor een andere school, voor ander uit de openbare kas bekostigd onderwijs, niet
      zijnde voortgezet onderwijs, of voor educatie als bedoeld in de Wet educatie en beroepsonderwijs BES dan wel voor
      andere culturele, maatschappelijke of recreatieve doeleinden. Het bestuurscollege is bevoegd een sportterrein,
      buiten de tijden dat het terrein voor het voortgezet onderwijs wordt gebruikt, gedurende die tijd te bestemmen voor
      culturele, maatschappelijke of recreatieve doeleinden, op zodanige wijze dat het zich verdraagt met het onderwijs
      dat op het terrein wordt gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0028395
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0028395
  - number: '142.2'
    text: |-
      Indien het gebouw of terrein in gebruik is voor een niet door het openbaar lichaam in stand gehouden school, pleegt
      het bestuurscollege vooraf overleg met het bevoegd gezag en, voor zover van toepassing, ook met het bevoegd gezag
      van de andere school of nevenvestiging waarvoor de huisvesting is bestemd.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel142
  - number: '143.1'
    text: |-
      Voor zover [artikel 142][ref1] geen toepassing vindt, kan het bevoegd gezag een gedeelte van een gebouw
      of terrein in gebruik geven ten behoeve van uit de openbare kas bekostigd onderwijs dan wel voor andere
      culturele, maatschappelijke of recreatieve doeleinden. Voor zover niet nodig voor uit de openbare kas bekostigd
      onderwijs, kan het bevoegd gezag een gedeelte van het gebouw of terrein verhuren aan een derde, voor zover
      het gehuurde niet bestemd zal zijn als woon- of bedrijfsruimte in de zin van de vijfde en zesde afdeling van
      [titel 4 van Boek 7 van het Burgerlijk Wetboek][ref2]. Indien het een niet door het openbaar lichaam in stand
      gehouden school betreft, is voor verhuur toestemming van het bestuurscollege vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel142
      [ref2]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '142'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0005290
  - number: '143.2'
    text: 'De ingebruikgeving of verhuur ingevolge het eerste lid eindigt:'
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel143
  - number: 143.2.a
    text: |-
      indien het bestuurscollege gebruik maakt van zijn bevoegdheid op grond van [artikel 142][ref1] zonder dat enige
      schadeplicht ontstaat, of


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel142
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '142'
        afdeling: II
  - number: 143.2.b
    text: indien het in gebruik gegeven dan wel verhuurde deel nodig is voor gebruik door de eigen school.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel143
  - number: '143.3'
    text: |-
      Ingebruikgeving of verhuur ingevolge het eerste lid geschiedt niet indien het voorgenomen gebruik zich niet
      verdraagt met het onderwijs aan de in het gebouw gevestigde school.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel143
  - number: '143.4'
    text: |-
      Op de ingebruikgeving en verhuur ingevolge het eerste lid is
      [artikel 230a van Boek 7 van het Burgerlijk Wetboek][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel230a
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 230a
  - number: '143.5'
    text: |-
      Het zonder toestemming van het bestuurscollege verhuren van een gebouw of terrein door het bevoegd gezag van een
      niet door het openbaar lichaam in stand gehouden school alsmede elk met dit artikel strijdig beding opgenomen in
      een huurovereenkomst met betrekking tot schoolgebouwen, is nietig.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel143
  - number: '144'
    text: |-
      Voorzieningen aan gebouwen of terreinen in verband met verhuur krachtens de [artikelen 143][ref1] of [145][ref2]
      door het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school, komen niet ten laste van
      het openbaar lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel143
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel145
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel144
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '143'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '145'
        afdeling: II
  - number: '145.1'
    text: |-
      Het bestuurscollege en het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school dat
      eigenaar is van het gebouw en terrein kunnen in een gezamenlijke akte verklaren dat het bevoegd gezag blijvend
      heeft opgehouden dan wel blijvend zal ophouden het gebouw of terrein of een voor eigendomsoverdracht vatbaar
      gedeelte daarvan, voor de school te gebruiken.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel145
  - number: '145.2'
    text: |-
      Bij toepassing van het eerste lid stellen het bestuurscollege en het bevoegd gezag van de desbetreffende school
      gezamenlijk vast of voorzieningen in een slechte bouwkundige staat verkeren als gevolg van het verwijtbaar nalaten
      van noodzakelijk onderhoud. Indien dat het geval is, vindt verrekening plaats van de daarmee gemoeide kosten.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel145
  - number: '145.3'
    text: |-
      De eilandsraad en het bevoegd gezag van de niet door het openbaar lichaam in stand gehouden school treffen
      gezamenlijk een voorziening voor het beslechten van geschillen die zich bij de toepassing van het tweede lid
      voordoen.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel145
  - number: '145.4'
    text: |-
      De Rijksvertegenwoordiger kan in geval van een geschil omtrent de toepassing van het eerste lid desgevraagd
      besluiten dat het bevoegd gezag blijvend heeft opgehouden dan wel blijvend zal ophouden het gebouw of terrein of
      een voor eigendomsoverdracht vatbaar gedeelte daarvan, voor de school te gebruiken. De aanvraag om het besluit
      wordt gedaan door het bestuurscollege of door het bevoegd gezag van de school.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel145
  - number: '145.5'
    text: |-
      Het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school dat voornemens is gebouwen
      of terreinen, of een gedeelte daarvan, blijvend niet meer voor de school te gebruiken, doet hiervan onverwijld
      mededeling aan het bestuurscollege.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel145
  - number: '145.6'
    text: |-
      Zodra de in het eerste lid bedoelde akte door beide partijen is getekend, of het in het vierde lid bedoelde besluit
      van de Rijksvertegenwoordiger onherroepelijk is geworden dan wel in beroep is bepaald dat de uitspraak van de
      rechter, inhoudende een besluit als bedoeld in het vierde lid eerste volzin, in de plaats treedt van het vernietigde
      besluit, wordt de akte, het onherroepelijk geworden besluit onderscheidenlijk de uitspraak, ingeschreven in de
      openbare registers, bedoeld in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek BES][ref1]. Door de
      inschrijving verkrijgt het openbaar lichaam de eigendom.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Afdeling2
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel145
    references:
      - id: ref1
        bwb_id: BWBR0028745
        afdeling: '2'
  - number: '145.7'
    text: |-
      Het bestuurscollege en het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school dat
      eigenaar is van het schoolgebouw, kunnen in een gezamenlijke akte verklaren dat een gedeelte van het gebouw dat
      niet vatbaar is voor eigendomsoverdracht, blijvend niet meer voor het onderwijs nodig zal zijn.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel145
  - number: '145.8'
    text: |-
      De Rijksvertegenwoordiger kan in geval van een geschil omtrent de toepassing van het zevende lid desgevraagd
      besluiten dat een gedeelte van het gebouw dat niet vatbaar is voor eigendomsoverdracht, blijvend niet meer voor
      het onderwijs nodig zal zijn. De aanvraag om het besluit wordt gedaan door het bestuurscollege of door het bevoegd
      gezag van de school. Alvorens op de aanvraag te besluiten, hoort de Rijksvertegenwoordiger de wederpartij.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel145
  - number: '145.9'
    text: |-
      Zodra de in het zevende lid bedoelde akte door beide partijen is getekend, of het in het achtste lid bedoelde
      besluit van de Rijksvertegenwoordiger onherroepelijk is geworden dan wel in beroep is bepaald dat de uitspraak
      van de rechter, inhoudende een beslissing als bedoeld in het achtste lid eerste volzin, in de plaats treedt van
      het vernietigde besluit, kan het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school het
      desbetreffende gedeelte van het gebouw met toestemming van het bestuurscollege verhuren.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel145
  - number: '145.10'
    text: |-
      De toestemming, bedoeld in het negende lid, wordt verleend voor een tijdvak van ten hoogste 3 jaren. Op verzoek van
      het bevoegd gezag kan dit tijdvak telkens worden verlengd met een termijn van ten hoogste 3 jaren.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel145
  - number: '145.11'
    text: |-
      Op de verhuur, bedoeld in het negende lid, is [artikel 230a van Boek 7 van het Burgerlijk Wetboek][ref1] niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel230a
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel145
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 230a
  - number: '146'
    text: |-
      In afwijking van dit hoofdstuk kan de eilandsraad besluiten dat jaarlijks een bedrag voor huisvestingskosten wordt
      betaald aan het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school voor zover die op het
      grondgebied van dat openbaar lichaam in stand wordt gehouden. De eilandsraad neemt het besluit in overeenstemming
      met het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel146
  - number: '147'
    text: |-
      Het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school is gehouden aan de eilandsraad
      onderscheidenlijk het bestuurscollege alle inlichtingen te verschaffen die de eilandsraad onderscheidenlijk het
      bestuurscollege voor een adequate uitvoering van de bepalingen in dit hoofdstuk noodzakelijk achten.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel147
  - number: '148.1'
    text: |-
      De scholen, bedoeld in [afdeling I van titel II][ref1] worden door het Rijk bekostigd met inachtneming van de
      [artikelen 151 tot en met 187][ref2]. De uitgaven, bedoeld in de [artikelen 160][ref3] en [162][ref4], alsmede de
      bedragen die het openbaar lichaam krachtens deze wet in aanvulling op de rijksbekostiging verstrekt, blijven ten
      laste van het openbaar lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#AfdelingI
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel151
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel160
      [ref4]: https://wetten.overheid.nl/BWBR0030284#Artikel162
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel148
    references:
      - id: ref1
        bwb_id: BWBR0030284
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '151'
        hoofdstuk: I
        afdeling: III
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '160'
        hoofdstuk: III
        paragraaf: '3'
        afdeling: III
      - id: ref4
        bwb_id: BWBR0030284
        artikel: '162'
        hoofdstuk: III
        paragraaf: '3'
        afdeling: III
  - number: '148.2'
    text: |-
      Aan niet door het openbaar lichaam in stand gehouden scholen als bedoeld in [afdeling I van titel II][ref1] wordt
      uit de openbare kas geen bekostiging verstrekt dan krachtens de bepalingen van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#AfdelingI
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel148
    references:
      - id: ref1
        bwb_id: BWBR0030284
        afdeling: I
  - number: '148.3'
    text: |-
      Voor de toepassing van deze afdeling zijn de voorschriften die betrekking hebben op bijzondere scholen, van
      overeenkomstige toepassing op openbare scholen die in stand worden gehouden door een stichting als bedoeld in
      [artikel 98][ref1] of een openbare rechtspersoon als bedoeld in [artikel 97][ref2], tenzij het tegendeel blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel98
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel97
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel148
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '98'
        hoofdstuk: II
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '97'
        hoofdstuk: II
        afdeling: I
  - number: '149.1'
    text: Het Rijk bekostigt openbare en bijzondere scholen voor zorg voor leerlingen met een specifieke onderwijsbehoefte.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel149
  - number: '149.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven ter uitvoering van het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel149
  - number: '151'
    text: 'De kosten van de scholen zijn:'
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel151
  - number: 151.a
    text: huisvestingskosten,
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel151
  - number: 151.b
    text: inventariskosten,
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel151
  - number: 151.c
    text: personeelskosten, en
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel151
  - number: 151.d
    text: exploitatiekosten.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel151
  - number: '153.1'
    text: |-
      Aan scholen wordt in verband met de kosten voor personeel wegens voorschriften die zijn gegeven bij of krachtens de
      [Wet materieel ambtenarenrecht BES][ref1] bekostiging verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0028215
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel153
    references:
      - id: ref1
        bwb_id: BWBR0028215
  - number: '153.2'
    text: |-
      De in het eerste lid bedoelde bekostiging is verwerkt in de bedragen en in de vermenigvuldigingsbedragen van de
      verhoging, bedoeld in de [artikelen 154][ref1] en [155][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel154
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel155
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel153
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '154'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: III
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '155'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: III
  - number: '155.1'
    text: |-
      Indien bijzondere ontwikkelingen in het voortgezet onderwijs daartoe aanleiding geven, kunnen bij ministeriële
      regeling voorschriften worden vastgesteld omtrent het verstrekken van aanvullende bekostiging voor
      personeelskosten.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel155
  - number: '155.2'
    text: |-
      In verband met bijzondere omstandigheden kan Onze Minister op verzoek van het bevoegd gezag van een in het
      eerste lid bedoelde school en onder door hem te stellen voorwaarden aanvullende bekostiging voor personeelskosten
      verstrekken.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel155
  - number: '155.3'
    text: |-
      Een aanvraag als bedoeld in het tweede lid wordt ingediend in het kalenderjaar waarin de bijzondere omstandigheden
      zich hebben aangediend. Onze Minister besluit binnen zes maanden na ontvangst van een in het tweede lid bedoelde
      aanvraag. Indien de beschikking niet binnen zes maanden kan worden gegeven, stelt Onze Minister de aanvrager
      daarvan in kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel155
  - number: '155.4'
    text: |-
      Onze Minister kan in verband met de in het eerste lid bedoelde bekostiging een bekostigingsplafond instellen. In
      dat geval worden bij ministeriële regeling regels omtrent de verdeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel155
  - number: '155.5'
    text: |-
      Onze Minister kan in verband met de in het tweede lid bedoelde bekostiging een bekostigingsplafond instellen. In
      dat geval worden bij ministeriële regeling regels omtrent de verdeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel155
  - number: '156.1'
    text: 'De bekostiging voor de exploitatiekosten van de scholen heeft betrekking op de volgende componenten:'
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel156
  - number: 156.1.a
    text: onderhoud van het gebouw en het terrein,
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel156
  - number: 156.1.b
    text: energie- en waterverbruik,
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel156
  - number: 156.1.c
    text: |-
      middelen, waaronder mede wordt verstaan lesmateriaal als bedoeld in [artikel 12][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel12
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel156
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '12'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 156.1.d
    text: administratie, beheer en bestuur,
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel156
  - number: 156.1.e
    text: loopbaanoriëntatie en -begeleiding,
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel156
  - number: 156.1.f
    text: schoonmaken, en
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel156
  - number: 156.1.g
    text: publiekrechtelijke heffingen, met uitzondering van belastingen ter zake van onroerende zaken.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel156
  - number: '156.2'
    text: |-
      De bekostiging wordt zodanig vastgesteld dat zij voldoet aan de redelijke behoeften van een in normale
      omstandigheden verkerende school.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel156
  - number: '157.1'
    text: |-
      Indien bijzondere ontwikkelingen in het voortgezet onderwijs daartoe aanleiding geven, kunnen bij ministeriële
      regeling voorschriften worden vastgesteld omtrent het verstrekken van aanvullende bekostiging voor
      exploitatiekosten.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel157
  - number: '157.2'
    text: |-
      Indien bijzondere ontwikkelingen in het voortgezet onderwijs aan een school daartoe aanleiding geven, kan Onze
      Minister op verzoek van het bevoegd gezag onder door hem te stellen voorwaarden en voor een door hem te bepalen
      periode aanvullende bekostiging voor exploitatiekosten verstrekken. Het verzoek wordt ingediend in het kalenderjaar
      waarin deze ontwikkelingen zijn aangevangen. Onze Minister besluit binnen vier maanden na ontvangst van het
      verzoek. Indien de beschikking niet binnen vier maanden kan worden gegeven, stelt Onze Minister de verzoeker
      daarvan in kennis en noemt hij daarbij een termijn waarop de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel157
  - number: '157.3'
    text: |-
      Onze Minister kan in verband met de in het eerste lid bedoelde bekostiging een bekostigingsplafond instellen. In
      dat geval worden bij ministeriële regeling regels omtrent de verdeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel157
  - number: '157.4'
    text: |-
      Onze Minister kan in verband met de in het tweede lid bedoelde bekostiging een bekostigingsplafond instellen. In
      dat geval worden bij ministeriële regeling regels omtrent de verdeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel157
  - number: '158'
    text: |-
      Het openbaar lichaam bekostigt aan het bevoegd gezag van een niet door het
      openbaar lichaam in stand gehouden school dat is onderworpen aan een of meer der in
      [artikel 43 van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref1] bedoelde belastingen ter
      zake van onroerende zaken het bedrag dat is uitgegeven voor de belastingen met betrekking tot de in het openbaar
      lichaam gelegen gebouwen en terreinen.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel43
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel158
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '43'
  - number: '159.2'
    text: |-
      In geval van het verstrekken van aanvullende bekostiging als bedoeld in [artikel 155][ref1] of [artikel 157][ref2]
      verstrekt het Rijk aan het desbetreffende bevoegd gezag het bedrag van deze bekostiging.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel155
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel157
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel159
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '155'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: III
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '157'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: III
  - number: '160.1'
    text: |-
      Indien in een openbaar lichaam uitsluitend een of meer andere rechtspersonen dan het openbaar lichaam openbare
      scholen in stand houden dan wel openbare scholen ontbreken en het openbaar lichaam uitgaven wil doen voor het
      desbetreffende onderwijs welke niet door het Rijk worden bekostigd, stelt de eilandsraad bij eilandsverordening een
      regeling daarvoor vast en zijn de [artikelen 163 tot en met 165][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel163
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '163'
        hoofdstuk: III
        paragraaf: '4'
        afdeling: III
  - number: '160.2'
    text: |-
      De regeling, bedoeld in het eerste lid, maakt geen onderscheid tussen openbaar en bijzonder onderwijs en voorziet
      in een behandeling van scholen naar dezelfde maatstaf.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel160
  - number: '160.3'
    text: |-
      De regeling, bedoeld in het eerste lid, bevat in elk geval de voorzieningen die door het bevoegd gezag van een in
      het openbaar lichaam gelegen, niet door het openbaar lichaam in stand gehouden school kunnen worden aangevraagd en
      de procedure voor het doen van een aanvraag.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel160
  - number: '160.4'
    text: |-
      De eilandsraad kan besluiten dat het bestuurscollege de regeling, bedoeld in het eerste lid, tijdelijk kan
      aanvullen met nieuwe voorzieningen. De aanvulling wordt binnen 1 week aan de bevoegde gezagsorganen van de
      niet door het openbaar lichaam in stand gehouden scholen gezonden. Binnen 12 weken na de totstandkoming van de
      aanvulling wordt deze voorgelegd aan de eilandsraad en besluit de eilandsraad over de bekrachtiging ervan. Indien
      de eilandsraad niet binnen 12 weken een besluit heeft genomen, wordt de aanvulling gelijkgesteld met een aanvulling
      die is bekrachtigd. Een afwijzing van de aanvulling door de eilandsraad heeft geen gevolgen voor aanvragen waarop
      reeds is besloten of die reeds zijn ingediend en die voorzieningen betreffen waarop de aanvulling betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel160
  - number: '160.5'
    text: |-
      [Artikel 7, eerste lid, van de Wet administratieve rechtspraak BES][ref1] is van overeenkomstige toepassing op de
      regeling, bedoeld in het eerste lid, een wijziging daarvan, of de aanvulling, bedoeld in het vierde lid, die door
      de eilandsraad is bekrachtigd.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel7
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0028455
        artikel: '7'
  - number: '160.6'
    text: |-
      Voor de toepassing van dit artikel wordt een nevenvestiging aangemerkt als een nevenvestiging die is gelegen in het
      openbaar lichaam van de hoofdvestiging. De eilandsraad kan in de eilandsverordening, bedoeld in het eerste lid, aan
      het bestuurscollege de bevoegdheid verlenen om, met inachtneming van de in die eilandsverordening gestelde regels,
      te besluiten dat in het openbaar lichaam gelegen nevenvestigingen van scholen waarvan de hoofdvestiging is gelegen
      in een ander openbaar lichaam in afwijking van de eerste volzin in aanmerking komen voor een of meer van de in de
      regeling genoemde voorzieningen.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel160
  - number: '160.7'
    text: |-
      Het bestuurscollege maakt jaarlijks in een van overheidswege uitgegeven blad of een dag-, nieuws- of huis-aan-
      huisblad, dan wel op een andere geschikte wijze, een overzicht bekend van de op grond van de regeling, bedoeld in
      het eerste lid, toegekende voorzieningen.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel160
  - number: '161.1'
    text: |-
      Indien de eilandsraad ten aanzien van een of meer door het openbaar lichaam in stand gehouden openbare scholen
      besluit dat deze met ingang van een datum die is gelegen in de periode die aanvangt met een bij koninklijk
      besluit te bepalen datum en eindigt met ingang van het negende kalenderjaar daaropvolgend, in stand zullen
      worden gehouden door een of meer andere rechtspersonen dan het openbaar lichaam, kan de regeling, bedoeld in
      [artikel 160, eerste lid][ref1], dan wel de regeling, bedoeld in [artikel 162, eerste lid][ref2], bij effectuering
      van dat besluit ten aanzien van die scholen en in afwijking van artikel 160, tweede lid, dan wel een regeling op
      grond van dit artikel bij effectuering van dat besluit ten aanzien van die scholen, erin voorzien dat door het
      openbaar lichaam aan een of meer andere rechtspersonen dan het openbaar lichaam dat die scholen in stand houdt,
      bekostiging voor administratie, beheer en bestuur wordt toegekend als aangegeven in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel160
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel162
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel161
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '160'
        hoofdstuk: III
        paragraaf: '3'
        afdeling: III
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '162'
        hoofdstuk: III
        paragraaf: '3'
        afdeling: III
  - number: '161.2'
    text: |-
      De bekostiging, die op grond van het eerste lid kan worden toegekend, bedraagt gedurende het eerste en het tweede
      kalenderjaar volgend op het tijdstip waarop de scholen, bedoeld in het eerste lid, niet langer door het openbaar
      lichaam in stand worden gehouden, maximaal 4 maal 18% van de bekostiging voor de exploitatiekosten, op grond
      van [artikel 156][ref1], en gedurende het derde, vierde en het vijfde kalenderjaar maximaal 3 maal 18% van die
      bekostiging.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel156
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel161
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '156'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: III
  - number: '161.3'
    text: |-
      Indien de eilandsraad besluit scholen niet langer in stand te houden vanaf een andere datum dan 1 augustus dan
      geldt als het eerste kalenderjaar, bedoeld in het tweede lid, het deel van het kalenderjaar dat volgt op de
      datum waarop het openbaar lichaam die scholen niet langer in stand houdt en bedraagt de bekostiging die voor dat
      eerste kalenderjaar maximaal kan worden toegekend voor administratie, beheer en bestuur een evenredig deel van de
      bekostiging die op grond van het tweede lid maximaal kan worden toegekend.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel161
  - number: '161.4'
    text: |-
      Voor de toepassing van het tweede lid wordt per school uitgegaan van de bekostiging voor exploitatiekosten voor
      het kalenderjaar direct voorafgaand aan het tijdstip waarop door het openbaar lichaam de desbetreffende school niet
      langer in stand wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel161
  - number: '161.5'
    text: |-
      De op grond van het eerste lid toe te kennen bekostiging kan in een kalenderjaar niet hoger zijn dan de in het
      daaraan voorafgaande kalenderjaar op grond van dit artikel toegekende bekostiging. De eerste volzin is niet van
      toepassing ten aanzien van de bekostiging voor het tweede kalenderjaar indien de bekostiging voor het eerste
      kalenderjaar is bepaald op grond van het derde lid. Bij de toepassing van de eerste volzin blijft het teruggestorte
      bedrag, bedoeld in het zevende lid, buiten beschouwing.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel161
  - number: '161.6'
    text: |-
      Het bevoegd gezag dat een school als bedoeld in het eerste lid in stand houdt die voor die tijd door het openbaar
      lichaam in stand werd gehouden, legt aan dat openbaar lichaam en aan de andere rechtspersonen die een of meer
      niet door het openbaar lichaam in stand gehouden scholen in dat openbaar lichaam in stand houden, jaarlijks een
      verklaring van de deskundige, bedoeld in [artikel 121, zesde lid, van Boek 2 van het Burgerlijk Wetboek BES][ref1],
      over met betrekking tot de uitgaven en ontvangsten voor administratie, beheer en bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel121
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel161
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '121'
  - number: '161.7'
    text: |-
      Voor zover voor een school als bedoeld in het eerste lid, de bekostiging, bedoeld in het eerste lid, vermeerderd
      met 18% van de bekostiging voor de exploitatiekosten, op grond van [artikel 156][ref1], in een kalenderjaar niet
      volledig is aangewend voor uitgaven voor administratie, beheer en bestuur, wordt het verschil door het bevoegd
      gezag, bedoeld in het zesde lid, teruggestort in de eilandskas.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel156
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel161
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '156'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: III
  - number: '162.1'
    text: |-
      Indien een openbaar lichaam zelf een of meer openbare scholen in stand houdt en hij uitgaven wil doen ten
      behoeve van het voorbereidend wetenschappelijk onderwijs, het algemeen voortgezet onderwijs, het voorbereidend
      beroepsonderwijs of het praktijkonderwijs welke niet door het Rijk worden bekostigd, kan de eilandsraad daarvoor
      bij eilandsverordening een regeling vaststellen.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel162
  - number: '162.2'
    text: |-
      [Artikel 160, tweede tot en met zevende lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel160
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel162
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '160'
        hoofdstuk: III
        paragraaf: '3'
        afdeling: III
  - number: '163.1'
    text: |-
      Indien een openbaar lichaam een of meer scholen in stand houdt, stelt het bestuurscollege jaarlijks met betrekking
      tot die scholen voorlopig vast:
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel163
  - number: 163.1.a
    text: |-
      het totaal van de bedragen die in het voorafgaande kalenderjaar zijn uitgegeven ten behoeve van de
      personeelskosten,
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel163
  - number: 163.1.b
    text: |-
      het totaal van de bedragen die in het voorafgaande kalenderjaar zijn uitgegeven ten behoeve van de
      exploitatiekosten,
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel163
  - number: 163.1.c
    text: |-
      het totaal van de ontvangsten, bedoeld in [artikel 154][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel154
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '154'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: III
  - number: 163.1.d
    text: |-
      het totaal van de ontvangsten dat is gebaseerd op de bedragen die krachtens [artikel 156][ref1]
      voor de exploitatiekosten voor dat kalenderjaar zijn vastgesteld, alsmede de bedragen die krachtens
      [artikel 172, tweede lid tweede volzin][ref2], voor voorzieningen in de exploitatie worden aangewend,


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel156
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel172
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '156'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: III
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '172'
        hoofdstuk: IV
        afdeling: III
  - number: 163.1.e
    text: |-
      het totaal van de aanvullende ontvangsten waaronder worden verstaan de bedragen die krachtens [artikel 157][ref1]
      voor de exploitatiekosten voor dat kalenderjaar zijn vastgesteld,


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel157
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '157'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: III
  - number: 163.1.f
    text: een staat van voorzieningen die zijn ingesteld ten behoeve van het openbaar onderwijs.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel163
  - number: '163.2'
    text: |-
      Indien een openbaar lichaam een deel van de ontvangsten, bedoeld in het eerste lid onderdeel c, dan wel een deel
      van de ontvangsten, bedoeld in de onderdelen d of e van dat lid, toevoegt aan een voorziening, wordt dat deel
      aangemerkt als een uitgave als bedoeld in dat lid onderdeel a, onderscheidenlijk als een uitgave als bedoeld in
      onderdeel b van dat lid. Indien het openbaar lichaam bedragen aan een voorziening onttrekt, worden deze aangemerkt
      als ontvangsten, bedoeld in het eerste lid onderdeel c, onderscheidenlijk als ontvangsten als bedoeld in de
      onderdelen d of e van dat lid.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel163
  - number: '163.3'
    text: |-
      Bij het vaststellen van de bedragen, bedoeld in het eerste lid, onderdelen b, d en e, worden buiten
      beschouwing gelaten de uitgaven en ontvangsten voor administratie, beheer en bestuur, bedoeld in
      [artikel 156, eerste lid, onderdeel d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel156
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '156'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: III
  - number: '163.4'
    text: |-
      Bij het vaststellen van de bedragen, bedoeld in het eerste lid, onderdelen a en b worden buiten beschouwing gelaten
      de uitgaven die worden gedekt door ontvangsten van bedragen die door derden zijn betaald, en de uitgaven voor de
      voorzieningen waarvoor het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school op grond
      van de regeling, bedoeld in [artikel 162, eerste lid][ref1], een aanvraag bij het openbaar lichaam kon indienen en
      wel gedurende de periode waarvoor een dergelijke aanvraag kon worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel162
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '162'
        hoofdstuk: III
        paragraaf: '3'
        afdeling: III
  - number: '163.5'
    text: |-
      Indien het openbaar lichaam een deel van de bekostiging voor personeels- en exploitatiekosten overdraagt aan
      een ander bevoegd gezag, wordt dat deel aangemerkt als een uitgave als bedoeld in het eerste lid, onderdeel a of
      onderdeel b. Indien door een ander bevoegd gezag een deel van de bekostiging voor personeels- en exploitatiekosten
      aan het openbaar lichaam wordt overgedragen, wordt dat deel aangemerkt als een ontvangst als bedoeld in het eerste
      lid, onderdeel c, of onderdeel d.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel163
  - number: '163.6'
    text: |-
      Om de vijf jaar stelt het bestuurscollege voorlopig vast het totaal van de vastgestelde uitgaven en ontvangsten
      in de voorafgaande vijf kalenderjaren, zoals in het eerste tot en met vijfde lid is aangegeven. Indien de uitgaven
      hoger zijn dan de ontvangsten, bepaalt het bestuurscollege tevens het bedrag van de overschrijding. Indien het
      openbaar lichaam vanaf een tijdstip binnen een periode van vijf jaar als bedoeld in de eerste volzin geen school
      in stand houdt, stelt het bestuurscollege in afwijking van die volzin zo spoedig mogelijk na dat tijdstip voorlopig
      vast het totaal van de vastgestelde uitgaven en ontvangsten in het aan dat tijdstip voorafgaande deel van de
      periode van vijf jaar, zoals in het eerste tot en met vijfde lid is aangegeven.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel163
  - number: '163.7'
    text: |-
      Na sluiting van de rekening van het openbaar lichaam stelt het bestuurscollege de in het eerste en zesde lid
      bedoelde bedragen, zo nodig gewijzigd, vast. In het geval de uitgaven hoger zijn dan de ontvangsten, bedoeld in
      het zesde lid, drukt het bestuurscollege vervolgens het bedrag van de overschrijding, bedoeld in genoemd lid,
      uit in een percentage van het totaal van de ontvangsten, bedoeld in het eerste lid onderdelen c tot en met e. Het
      percentage wordt afgerond tot twee decimalen. Afronding naar beneden vindt plaats indien de derde decimaal kleiner
      is dan 5, en naar boven indien deze decimaal ten minste 5 bedraagt.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel163
  - number: '163.8'
    text: |-
      Voor de toepassing van de [artikelen 163 tot en met 165][ref1] worden uitgaven ten behoeve van een nevenvestiging
      aangemerkt als uitgaven ten behoeve van de hoofdvestiging van de school waaraan de nevenvestiging is verbonden.
      Indien ten behoeve van een school of nevenvestiging uitgaven worden gedaan door meer dan één openbaar lichaam,
      worden deze uitgaven aangemerkt als uitgaven van het openbaar lichaam op wier grondgebied de hoofdvestiging is
      gelegen. In het geval, bedoeld in de vorige volzin worden de besluiten ingevolge de artikelen 163 tot en met
      165 genomen door laatstbedoeld openbaar lichaam en hebben deze mede betrekking op de uitgaven van het andere
      openbaar lichaam of de andere openbare lichamen. Voor de toepassing van de artikelen 163 tot en met 165 wordt een
      nevenvestiging aangemerkt als een nevenvestiging die is gelegen in het openbaar lichaam van de hoofdvestiging.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel163
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '163'
        hoofdstuk: III
        paragraaf: '4'
        afdeling: III
  - number: '163.9'
    text: |-
      Het bestuurscollege kan in overeenstemming met het bevoegd gezag van een niet door het openbaar lichaam in stand
      gehouden school besluiten dat met betrekking tot een of meer scholen van dat bevoegd gezag uitgaven die het
      openbaar lichaam doet ten behoeve van een door hem in stand gehouden school buiten beschouwing worden gelaten bij
      het vaststellen van de bedragen, bedoeld in dit artikel.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel163
  - number: '164.1'
    text: |-
      In het jaar volgend op de definitieve vaststelling, bedoeld in [artikel 163, zevende lid][ref1], wordt het
      overschrijdingsbedrag vastgesteld waarop het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden
      school die gedurende een of meer jaren van het desbetreffende tijdvak in het openbaar lichaam was gevestigd,
      aanspraak heeft. Dit overschrijdingsbedrag wordt vastgesteld door het percentage, bedoeld in artikel 163, zevende
      lid, te vermenigvuldigen met het totaal van de ontvangsten van een niet door het openbaar lichaam in stand gehouden
      school dat is gebaseerd op de bedragen die krachtens de [artikelen 152, eerste tot en met derde lid][ref2],
      [154][ref3] en [156][ref4] voor het desbetreffende tijdvak zijn vastgesteld, met dien verstande dat bij het
      vaststellen van het totaal van de ontvangsten, bedoeld in de vorige volzin, buiten beschouwing blijven de
      ontvangsten voor administratie, beheer en bestuur, bedoeld in artikel 156, eerste lid, onderdeel d.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel163
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel152
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel154
      [ref4]: https://wetten.overheid.nl/BWBR0030284#Artikel156
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel164
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '163'
        hoofdstuk: III
        paragraaf: '4'
        afdeling: III
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '152'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: III
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '154'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: III
      - id: ref4
        bwb_id: BWBR0030284
        artikel: '156'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: III
  - number: '164.2'
    text: |-
      Indien een openbaar lichaam gedurende een gedeelte van het desbetreffende tijdvak een of meer scholen in stand
      houdt, wordt voor het vaststellen van het overschrijdingsbedrag, bedoeld in het eerste lid, uitgegaan van het
      totaal van de ontvangsten van een niet door het openbaar lichaam in stand gehouden school over een overeenkomstig
      gedeelte van het desbetreffende tijdvak.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel164
  - number: '165.1'
    text: |-
      Na de voorlopige vaststelling van het bedrag van de overschrijding, bedoeld in [artikel 163, zesde lid][ref1],
      keert het bestuurscollege aan het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school dat
      op grond van [artikel 164, eerste lid][ref2], aanspraak heeft op een uitkering, een voorschot uit. Het voorschot
      omvat het voorlopig vastgestelde bedrag van de overschrijding, berekend op de wijze als is aangegeven in artikel
      164, eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel163
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel164
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel165
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '163'
        hoofdstuk: III
        paragraaf: '4'
        afdeling: III
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '164'
        hoofdstuk: III
        paragraaf: '4'
        afdeling: III
  - number: '165.2'
    text: |-
      Het bestuurscollege is bevoegd tijdens het vijfjarig tijdvak op verzoek van het bevoegd gezag van een niet door het
      openbaar lichaam in stand gehouden school jaarlijks een deel van het naar verwachting uit te betalen voorschot in
      mindering daarop uit te keren.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel165
  - number: '165.3'
    text: |-
      De bekendmaking van de beschikkingen tot voorlopige en definitieve vaststelling van het overschrijdingsbedrag,
      bedoeld in het zesde onderscheidenlijk [zevende lid van artikel 163][ref1], behelst tevens een staat van de
      voorzieningen als bedoeld in artikel 163, eerste lid, onderdeel f, waarin per kalenderjaar wordt aangegeven het
      verloop van de toevoegingen en de onttrekkingen aan de voorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel163
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel165
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '163'
        hoofdstuk: III
        paragraaf: '4'
        afdeling: III
  - number: '165.4'
    text: |-
      In afwijking van [artikel 55 van de Wet administratieve rechtspraak BES][ref1] kan het bevoegd gezag van een
      school, bedoeld in het eerste lid, tegen de in het derde lid bedoelde beschikkingen, beroep instellen bij
      de Rijksvertegenwoordiger. De [artikelen 54][ref2] en 55 van de Wet administratieve rechtspraak BES zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0028455#Artikel54
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel165
    references:
      - id: ref1
        bwb_id: BWBR0028455
        artikel: '55'
      - id: ref2
        bwb_id: BWBR0028455
        artikel: '54'
  - number: '168.1'
    text: |-
      Op de bekostiging of onderdelen daarvan kunnen voorschotten worden verleend volgens regels, te stellen bij of
      krachtens algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel168
  - number: '168.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden tevens voorschriften gegeven voor de verrekening van de
      betaalde voorschotten met het bedrag van de vastgestelde bekostiging of onderdelen daarvan.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel168
  - number: '169'
    text: |-
      Onze Minister is bevoegd tot verrekening van vorderingen krachtens deze wet van of op het bevoegd gezag van een
      school met vorderingen van of op Onze Minister krachtens een andere wet.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel169
  - number: '170'
    text: |-
      Indien een leerling in de loop van het schooljaar de school verlaat zonder de opleiding te hebben voltooid, en
      aansluitend wordt ingeschreven als leerling aan een andere school voor voortgezet onderwijs of als deelnemer aan
      een instelling voor educatie en beroepsonderwijs, kan het bevoegd gezag van de school met het bevoegd gezag van
      die andere school of die instelling overeenkomen een deel van de bekostiging over te dragen aan dat andere bevoegd
      gezag vanwege deze tussentijdse overstap.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel170
  - number: '171.1'
    text: Het bevoegd gezag van een bijzondere school houdt nauwkeurig boek van de inkomsten en uitgaven.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel171
  - number: '171.2'
    text: |-
      Het bevoegd gezag van een bijzondere school geeft desverlangd aan de door Onze Minister aangewezen ambtenaren de
      boeken en bescheiden ter inzage. Het bevoegd gezag is gehouden deze boeken en bescheiden zeven jaren te bewaren.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel171
  - number: '172.1'
    text: |-
      Het bevoegd gezag besteedt de verstrekte bekostiging en de betaalde bedragen ten behoeve van die school op de wijze
      zoals aangegeven in het tweede tot en met vierde lid.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel172
  - number: '172.2'
    text: |-
      De voor voorzieningen in de huisvesting betaalde bedragen worden zodanig aangewend dat een behoorlijke en
      deugdelijke totstandkoming van deze voorzieningen is verzekerd. Indien na realisatie van de in de eerste volzin
      bedoelde voorzieningen de bedragen niet volledig zijn aangewend, kan het resterende deel daarvan worden aangewend
      voor de kosten van personeel of voorzieningen in de exploitatie.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel172
  - number: '172.3'
    text: |-
      Het voor personeels- en exploitatiekosten betaalde bedrag wordt aangewend voor de kosten van personeel, zoals
      onderscheiden in [artikel 77][ref1], voor voorzieningen in de exploitatie. In geval van een overschot op die
      bedragen, kan dat overschot worden aangewend voor voorzieningen in de huisvesting.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel77
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel172
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '77'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
  - number: '172.4'
    text: |-
      De verstrekte overschrijdingsbedragen worden ten behoeve van het onderwijs aan de scholen van het bevoegd gezag
      aangewend.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel172
  - number: '172.5'
    text: |-
      Het bevoegd gezag kan de bedragen, bedoeld in het derde lid, mede aanwenden voor de vergoeding, bedoeld in
      [artikel 69, vierde lid][ref1], en voor de kosten van personeel of voorzieningen in de exploitatie van:


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel69
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel172
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '69'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
  - number: 172.5.a
    text: een andere school voor voortgezet onderwijs,
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel172
  - number: 172.5.b
    text: een scholengemeenschap waarvan een of meer scholen voor voortgezet onderwijs deel uitmaken,
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel172
  - number: 172.5.c
    text: |-
      een school als bedoeld in de [Wet primair onderwijs BES][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0030280
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel172
    references:
      - id: ref1
        bwb_id: BWBR0030280
  - number: 172.5.d
    text: |-
      een instelling als bedoeld in de [Wet educatie en beroepsonderwijs BES][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0028395
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel172
    references:
      - id: ref1
        bwb_id: BWBR0028395
  - number: 172.5.e
    text: het expertisecentrum onderwijszorg.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel172
  - number: '172.6'
    text: |-
      De op grond van [artikel 149][ref1], [artikel 160][ref2] of [artikel 162][ref3] verstrekte bekostiging wordt
      besteed aan het doel waarvoor zij is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel149
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel160
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel162
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel172
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '149'
        hoofdstuk: I
        afdeling: III
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '160'
        hoofdstuk: III
        paragraaf: '3'
        afdeling: III
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '162'
        hoofdstuk: III
        paragraaf: '3'
        afdeling: III
  - number: '172.7'
    text: |-
      Het bevoegd gezag kan met het bevoegd gezag waarmee het een samenwerkingsovereenkomst heeft gesloten als bedoeld in
      [artikel 62, derde lid][ref1], overeenkomen om vanwege de samenwerking een deel van de bekostiging over te dragen
      aan het andere bevoegd gezag, bedoeld in het eerste lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel62
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel172
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '62'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '173.1'
    text: |-
      De bedragen en bekostiging, bedoeld in [artikel 172][ref1], worden niet aangewend voor contractactiviteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel172
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel173
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '172'
        hoofdstuk: IV
        afdeling: III
  - number: '173.2'
    text: |-
      Het bevoegd gezag van de scholen, bedoeld in [artikel 172][ref1], berekent voor de contractactiviteiten aan de
      betrokken derden de kosten zodanig dat aan het bepaalde in het eerste lid wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel172
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel173
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '172'
        hoofdstuk: IV
        afdeling: III
  - number: '174.1'
    text: |-
      De kosten van herstel van schade aan gebouwen, terreinen en roerende zaken ten behoeve waarvan met betrekking tot
      scholen bekostiging wordt genoten, worden niet door het openbaar lichaam vergoed, indien:
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel174
  - number: 174.1.a
    text: die schade door schuld of nalatigheid van de rechtspersoon die de school in stand houdt, wordt toegebracht, of
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel174
  - number: 174.1.b
    text: |-
      het bevoegd gezag een beroep kan doen op een verzekering waarvoor de premie voor vergoeding in aanmerking komt, of
      voor de vergoeding van die schade door het openbaar lichaam een collectieve verzekering is afgesloten, voor zover
      die collectieve verzekering de schade dekt.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel174
  - number: '174.2'
    text: |-
      Indien schade, ontstaan aan gebouwen, terreinen of roerende zaken van een door het openbaar lichaam bekostigde
      school voor vergoeding door het openbaar lichaam in aanmerking komt, treedt het openbaar lichaam op het moment van
      een uitdrukkelijk besluit tot vergoeding in alle rechten die het bevoegd gezag ter zake van die schade tegen derden
      mocht hebben.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel174
  - number: '176.1'
    text: |-
      Het bevoegd gezag draagt er zorg voor dat het ten behoeve van Onze Minister beschikt over geordende gegevens die
      van belang zijn voor de berekening van de hoogte van de bekostiging, alsmede over een verklaring over de juistheid
      van de bekostigingsgegevens, afgegeven door een door de toezichthouder of het toezichthoudend orgaan aangewezen
      deskundige als bedoeld in [artikel 121, zesde lid, van Boek 2 van het Burgerlijk Wetboek BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel121
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel176
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '121'
  - number: '176.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de definiëring,
      de wijze van ordening en de beschikbaarstelling van de gegevens, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel176
  - number: '176.3'
    text: |-
      Het bevoegd gezag bewaart de gegevens, bedoeld in het eerste lid, en de desbetreffende boeken en bescheiden
      gedurende een periode van zeven jaren.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel176
  - number: '183.1'
    text: |-
      Indien sprake is van wanbeheer van een of meer bestuurders of toezichthouders kan Onze Minister de rechtspersoon
      die de school in stand houdt een aanwijzing geven. Een aanwijzing omvat een of meer maatregelen en is evenredig aan
      het doel waarvoor zij wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel183
  - number: '183.2'
    text: 'Onder wanbeheer wordt uitsluitend verstaan:'
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel183
  - number: 183.2.a
    text: financieel wanbeleid,
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel183
  - number: 183.2.b
    text: |-
      ongerechtvaardigde verrijking, al dan niet beoogd, van de rechtspersoon die de school in stand houdt, zichzelf dan
      wel een derde,
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel183
  - number: 183.2.c
    text: |-
      onrechtmatig handelen, waaronder wordt verstaan het in de hoedanigheid van bestuurder of toezichthouder handelen in
      strijd met wettelijke bepalingen of de kennelijke geest van wettelijke bepalingen waarmee financieel voordeel wordt
      behaald ten gunste van de rechtspersoon die de school in stand houdt, zichzelf of een derde, en
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel183
  - number: 183.2.d
    text: |-
      het in ernstige mate verwaarlozen van de zorg voor wat door redelijkheid en billijkheid wordt gevorderd in de
      omgang met betrokkenen in de schoolorganisatie, waaronder wordt verstaan intimidatie of bedreiging van personeel,
      leerlingen of ouders door een bestuurder of toezichthouder.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel183
  - number: '183.3'
    text: |-
      In de aanwijzing geeft Onze Minister met redenen omkleed aan op welke punten sprake is van wanbeheer alsmede de in
      verband daarmee te nemen maatregelen.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel183
  - number: '183.4'
    text: Een aanwijzing bevat de termijn waarbinnen het bevoegd gezag aan de aanwijzing moet voldoen.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel183
  - number: '183.5'
    text: 'Alvorens Onze Minister een aanwijzing als bedoeld in het eerste lid geeft:'
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel183
  - number: 183.5.a
    text: |-
      heeft de inspectie een onderzoek als bedoeld in [artikel 11][ref1] of
      [artikel 15 van de Wet op het onderwijstoezicht][ref2] verricht,


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel15
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel183
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '15'
  - number: 183.5.b
    text: |-
      heeft de inspectie daarover een inspectierapport als bedoeld in
      [artikel 20, eerste lid, van de Wet op het onderwijstoezicht uitgebracht][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel20
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel183
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '20'
  - number: 183.5.c
    text: |-
      stelt Onze Minister de rechtspersoon vervolgens vier weken in de gelegenheid zijn zienswijze met betrekking tot de
      aanwijzing naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel183
  - number: '184.1'
    text: |-
      Indien het bevoegd gezag van een school in strijd handelt met het bepaalde bij of krachtens deze wet, waaronder
      tevens wordt verstaan het niet opvolgen van een aanwijzing als bedoeld in [artikel 183][ref1], kan Onze Minister
      bepalen dat de bekostiging, voorschotten daaronder begrepen, geheel of gedeeltelijk wordt ingehouden dan wel
      opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel183
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel184
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '183'
        hoofdstuk: IV
        afdeling: III
  - number: '184.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing, indien het bevoegd gezag of het personeel van een school in
      strijd handelt met [artikel 5:20 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel184
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '184.3'
    text: |-
      Onze Minister kent de bekostiging wederom toe, indien blijkt dat de reden voor de toepassing van het eerste of
      tweede lid is vervallen.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel184
  - number: '187.1'
    text: 'Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven omtrent:'
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel187
  - number: 187.1.a
    text: de inrichting van de boekhouding van bijzondere scholen,
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel187
  - number: 187.1.b
    text: de wijze waarop door het bevoegd gezag verslag wordt gedaan van het financieel beheer van de school,
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel187
  - number: 187.1.c
    text: de vaststelling door het bevoegd gezag van een begroting en een jaarrekening, alsmede de inrichting daarvan, en
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel187
  - number: 187.1.d
    text: de controle van de boekhouding en de administratie van de scholen.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel187
  - number: '187.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent de erkenning van godsdienstige of
      levensbeschouwelijke bezwaren tegen het sluiten van een verzekering.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel187
  - number: '187.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven ter uitvoering van deze
      afdeling.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel187
  - number: '187.4'
    text: |-
      Indien een beschikking niet binnen de bij of krachtens de algemene maatregel van bestuur, bedoeld in dit artikel,
      gestelde termijn kan worden gegeven, stelt Onze Minister de aanvrager daarvan in kennis en noemt hij daarbij een
      termijn waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel187
  - number: '188.1'
    text: |-
      Een openbare school of scholengemeenschap wordt opgeheven en de bekostiging van een bijzondere school of
      scholengemeenschap wordt beëindigd indien de school gedurende drie achtereenvolgende schooljaren telkens is bezocht
      door een aantal leerlingen dat minder bedraagt dan een bij ministeriële regeling vast te stellen aantal.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel188
  - number: '188.2'
    text: |-
      De opheffing van een openbare school of scholengemeenschap of de beëindiging van de bekostiging van een bijzondere
      school of scholengemeenschap geschiedt met ingang van 1 augustus volgend op de drie achtereenvolgende schooljaren,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel188
  - number: '189.1'
    text: |-
      Grondslag der berekening is het aantal leerlingen dat op 1 oktober van elk van de jaren bij de school was
      ingeschreven.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel189
  - number: '189.2'
    text: |-
      Indien voor de leerlingen binnen redelijke afstand geen plaatsruimte beschikbaar is op een gelijksoortige school,
      waar het verlangde onderwijs wordt gegeven, past Onze Minister [artikel 188][ref1] zodanig toe, dat de leerlingen
      van elk leerjaar de cursus kunnen voltooien.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel188
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel189
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '188'
        afdeling: IV
  - number: '189.3'
    text: |-
      [Artikel 188][ref1] blijft buiten toepassing, zolang de school niet alle leerjaren omvat.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel188
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel189
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '188'
        afdeling: IV
  - number: '189.4'
    text: |-
      Onze Minister kan op verzoek van het bevoegd gezag voor een door hem te bepalen tijd toestaan, dat een openbare
      school in stand wordt gehouden of een bijzondere school wordt bekostigd, ook al is het aantal leerlingen minder,
      dan in [artikel 188][ref1] is vermeld. Onze Minister besluit binnen zes maanden na ontvangst van een aanvraag.
      Indien de beschikking niet binnen zes maanden kan worden gegeven, stelt Onze Minister de aanvrager daarvan in
      kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden gezien.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel188
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel189
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '188'
        afdeling: IV
  - number: '189.5'
    text: |-
      Binnen acht weken na de bekendmaking door het Centraal Bureau voor de Statistiek dan wel door Onze Minister van
      de aantallen leerlingen per school voor voortgezet onderwijs, stelt de Rijksvertegenwoordiger vast welke door het
      openbaar lichaam in stand gehouden scholen gedurende reeds een jaar niet meer voldoen aan de voor hen geldende
      norm, genoemd in [artikel 188][ref1]. Wanneer er als gevolg van de opheffing van een school als bedoeld in de
      vorige volzin, naar zijn oordeel niet meer voldoende zal zijn voorzien in de behoefte aan openbaar onderwijs in een
      genoegzaam aantal scholen, draagt de Rijksvertegenwoordiger het bestuurscollege op een verzoek te doen op grond van
      het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel188
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel189
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '188'
        afdeling: IV
  - number: '190.1'
    text: Het bevoegd gezag stort het exploitatie-overschot terug in de desbetreffende overheidskas
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel190
  - number: 190.1.a
    text: |-
      indien een openbare school ingevolge [artikel 188][ref1] wordt opgeheven,


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel188
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel190
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '188'
        afdeling: IV
  - number: 190.1.b
    text: |-
      indien de bekostiging van een bijzondere school ingevolge een van de in onderdeel a genoemde artikelen wordt
      beëindigd, of
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel190
  - number: 190.1.c
    text: indien een school ingevolge een beslissing van het bevoegd gezag wordt opgeheven en deze opheffing is gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel190
  - number: '190.2'
    text: Het exploitatietekort blijft in de gevallen, bedoeld in het eerste lid, voor rekening van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel190
  - number: '190.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent de wijze waarop het exploitatie-
      overschot, bedoeld in het eerste lid, wordt berekend.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel190
  - number: '191'
    text: |-
      In afwijking van [artikel 7, eerste lid, van de Wet administratieve rechtspraak BES][ref1] kan een belanghebbende
      beroep instellen bij het Gemeenschappelijke Hof van Justitie van Aruba, Curaçao, Sint Maarten en van
      Bonaire, Sint Eustatius en Saba tegen een besluit op grond van deze afdeling. De [artikelen 54][ref2] en
      [55 van de Wet administratieve rechtspraak BES][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0028455#Artikel54
      [ref3]: https://wetten.overheid.nl/BWBR0028455#Artikel55
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel191
    references:
      - id: ref1
        bwb_id: BWBR0028455
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0028455
        artikel: '54'
      - id: ref3
        bwb_id: BWBR0028455
        artikel: '55'
  - number: '193.1'
    text: |-
      Onder een voortijdige schoolverlater in de zin van deze titel wordt verstaan degene op wie
      [artikel 66, eerste lid onder a en b][ref1], van toepassing is en


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel66
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel193
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '66'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 193.1.a
    text: |-
      die het onderwijs aan de school waaraan hij is ingeschreven gedurende een aaneengesloten periode van ten minste een
      maand of een door het bevoegd gezag te bepalen kortere periode zonder geldige reden niet meer volgt, of
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel193
  - number: 193.1.b
    text: |-
      die niet meer aan een school is ingeschreven en evenmin is ingeschreven aan een instelling als bedoeld in de
      [Wet educatie en beroepsonderwijs BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028395
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel193
    references:
      - id: ref1
        bwb_id: BWBR0028395
  - number: '193.2'
    text: |-
      Voor zover nodig in afwijking van het eerste lid wordt onder een voortijdige schoolverlater
      niet verstaan degene die in het bezit is van een getuigschrift van het praktijkonderwijs
      als bedoeld in [artikel 31][ref1] dan wel een diploma van een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid onderdeel a, van de Wet educatie en beroepsonderwijs BES][ref2] en werkzaam is op grond
      van een aanstelling of arbeidsovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel193
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '31'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '7'
  - number: '194.1'
    text: |-
      Het bevoegd gezag meldt onverwijld voortijdige schoolverlaters aan het bestuurscollege, voor zover het bevoegd
      gezag dat niet op grond van [artikel 66][ref1] heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel66
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel194
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '66'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '194.2'
    text: |-
      Het bestuurscollege draagt ten behoeve van doorverwijzing naar onderwijs of arbeidsmarkt zorg voor registratie
      van de gegevens die het bevoegd gezag ingevolge het eerste lid of [artikel 66][ref1] heeft gemeld, of waarover
      het bestuurscollege op grond van [artikel 24f, derde en vierde lid, van de Wet op het onderwijstoezicht][ref2]
      beschikt. Het systeem heeft mede betrekking op de gegevens waarover het openbaar lichaam beschikt in het kader van
      de uitvoering van de [Leerplichtwet BES][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel24f
      [ref3]: https://wetten.overheid.nl/BWBR0030281
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel194
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '66'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0013800
        artikel: 24f
      - id: ref3
        bwb_id: BWBR0030281
  - number: '194.3'
    text: |-
      Het bestuurscollege maakt afspraken met scholen, instellingen als bedoeld in de
      [Wet educatie en beroepsonderwijs BES][ref1] en organisaties die zijn betrokken bij het voorkomen en bestrijden van
      voortijdig schoolverlaten.


      [ref1]: https://wetten.overheid.nl/BWBR0028395
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel194
    references:
      - id: ref1
        bwb_id: BWBR0028395
  - number: '194.4'
    text: |-
      Ter tegemoetkoming in de kosten van uitvoering van het tweede en derde lid kent Onze Minister binnen
      het raam van de door de begrotingswetgever beschikbaar gestelde middelen jaarlijks uiterlijk in
      september ten behoeve van de activiteiten het bestuurscollege een bijzondere uitkering als bedoeld in
      [artikel 91 van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref1] toe. Deze uitkering
      heeft betrekking op het daarop volgende kalenderjaar. Bij ministeriële regeling worden regels gegeven voor de
      berekening en betaling van de uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel91
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel194
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '91'
  - number: '194.5'
    text: |-
      Het bevoegd gezag geeft aan de door het bestuurscollege aangewezen personen alle gevraagde bescheiden ter inzage
      en verstrekt de gevraagde inlichtingen die van belang zijn voor het voorkomen en bestrijden van voortijdig
      schoolverlaten.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel194
  - number: '194.6'
    text: |-
      De eilandsraad stelt streefcijfers vast voor de te behalen resultaten. Het bestuurscollege stelt jaarlijks
      een effectrapportage vast waarin zowel de streefcijfers als de bereikte resultaten zijn aangegeven en waarin
      afwijkingen worden toegelicht.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel194
  - number: '194.7'
    text: |-
      Indien het bestuurscollege het bepaalde bij of krachtens het eerste tot en met zesde lid niet nakomt, kan Onze
      Minister de uitkering geheel of gedeeltelijk inhouden of opschorten. Onze Minister gaat niet over tot gehele of
      gedeeltelijke inhouding dan na overleg met het bestuurscollege. Onze Minister kan de uitkering wederom toekennen
      indien de reden voor inhouding of opschorting is vervallen.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel194
  - number: '194.8'
    text: |-
      Onze Minister kan de in het vierde lid bedoelde uitkering geheel of gedeeltelijk terugvorderen indien niet uit de
      informatie, verstrekt krachtens [artikel 214 van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref1],
      blijkt dat de uitkering is besteed in overeenstemming met dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel91
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel194
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '91'
  - number: '195.1'
    text: |-
      Het bestuurscollege zendt de in [artikel 194, zesde lid][ref1], bedoelde effectrapportage aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel194
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel195
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '194'
  - number: '195.2'
    text: |-
      Het bestuurscollege is gehouden aan de door Onze Minister aangewezen personen alle gevraagde bescheiden ter inzage
      te geven en de gevraagde inlichtingen te verstrekken die van belang zijn voor het door Onze Minister te voeren
      beleid met betrekking tot het voortijdig schoolverlaten door niet-leerplichtigen.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel195
  - number: '195.3'
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent het tijdstip van indiening en de
      inrichting van de effectrapportage en inzake de wijze van beschikbaarstelling van de gegevens, bedoeld in het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel195
  - number: '206.1'
    text: |-
      De [artikelen 8][ref1], [13 tot en met 30][ref2] en [33 tot en met 41][ref3], en de ter uitvoering daarvan
      vastgestelde voorschriften, vinden met ingang van het eerste schooljaar na hun inwerkingtreding successievelijk
      toepassing per opvolgend leerjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel33
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel206
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '13'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '33'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '206.2'
    text: |-
      Op de leerjaren waarop de artikelen van deze wet als gevolg van successievelijke inwerkingtreding nog geen
      toepassing hebben, blijft van toepassing het bepaalde bij en krachtens de Wet voortgezet onderwijs BES zoals die
      luidde op de dag voor het tijdstip van de inwerkingtreding van dit artikel.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel206
  - number: '206.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt geregeld op welk moment, voor welke leerlingen of
      staatsexamenkandidaten, en voor zover nodig op welke wijze, nog gelegenheid wordt gegeven tot het afleggen van
      een eindexamen als bedoeld in artikel 32 van de Landsverordening voortgezet onderwijs dan wel een landsexamen als
      bedoeld in artikel 57 van die verordening zoals die artikelen luidden op 9 oktober 2010. De gelegenheid tot het
      afleggen van dit eindexamen komt in elk geval toe aan leerlingen die voor het tijdstip van de inwerkingtreding van
      dit artikel zijn toegelaten tot het eerste leerjaar van scholen als bedoeld in de [artikelen 13][ref1], [14][ref2],
      [15][ref3] en [17][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0030284#Artikel17
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel206
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '13'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '14'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '15'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0030284
        artikel: '17'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '207'
    text: |-
      In afwijking van [artikel 118][ref1] berust de aanspraak op bekostiging van een school die op de dag voorafgaand
      aan het tijdstip van de inwerkingtreding van dit artikel, werd bekostigd op grond van de Wet voortgezet
      onderwijs BES zoals die wet op 10 oktober 2010 is komen te luiden, na de inwerkingtreding van artikel 118 op
      [titel III][ref2], met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel118
      [ref2]: https://wetten.overheid.nl/BWBR0030284
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel207
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '118'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
  - number: 207.a
    text: |-
      een school voor voorbereidend wetenschappelijk onderwijs als bedoeld in artikel 7 van de Landsverordening
      voortgezet onderwijs wordt aangemerkt als school voor voorbereidend wetenschappelijk onderwijs als bedoeld in
      [artikel 13][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel13
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel207
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '13'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 207.b
    text: |-
      een school voor hoger algemeen voortgezet onderwijs als bedoeld in artikel 8 van de Landsverordening voortgezet
      onderwijs wordt aangemerkt als school voor hoger algemeen voortgezet onderwijs als bedoeld in [artikel 14][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel14
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel207
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '14'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 207.c
    text: |-
      een school voor voorbereidend secundair beroepsonderwijs als bedoeld in artikel 9 van de Landsverordening
      voortgezet onderwijs wordt aangemerkt als scholengemeenschap als bedoeld in [artikel 123][ref1], waarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel123
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel207
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '123'
        afdeling: I
  - number: 207.c.1°
    text: |-
      het deel van het onderwijs dat wordt verzorgd in de school voor voorbereidend secundair beroepsonderwijs bestaande
      uit twee leerjaren waarin onderwijs wordt verzorgd in de basisvorming als bedoeld in artikel 10, eerste lid,
      van de Landsverordening voortgezet onderwijs en twee leerjaren waarin onderwijs wordt verzorgd in de leerweg
      theoretisch kadergerichte leerweg als bedoeld in artikel 11, tweede lid, onderdeel a, van de Landsverordening
      voortgezet onderwijs wordt aangemerkt als school voor middelbaar algemeen voortgezet onderwijs als bedoeld in
      [artikel 15][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel15
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel207
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '15'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 207.c.2°
    text: |-
      het deel van het onderwijs dat wordt verzorgd in de school voor voorbereidend secundair beroepsonderwijs bestaande
      uit twee leerjaren waarin onderwijs wordt verzorgd in de basisvorming als bedoeld in artikel 10, eerste lid, van de
      Landsverordening voortgezet onderwijs en twee leerjaren waarin onderwijs wordt verzorgd in de leerwegen praktisch
      kadergerichte leerweg en de praktisch basisgerichte leerweg als bedoeld in artikel 11, tweede lid, onderdeel
      b, en onderdeel c, van de Landsverordening voortgezet onderwijs wordt aangemerkt als school voor voorbereidend
      beroepsonderwijs als bedoeld in [artikel 17][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel17
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel207
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '17'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 207.c.3°
    text: |-
      de aan de school voor voorbereidend secundair beroepsonderwijs verbonden afdeling voor arbeidsgericht onderwijs
      als bedoeld in artikel 11c van de Landsverordening voortgezet onderwijs wordt aangemerkt als school voor
      praktijkonderwijs als bedoeld in [artikel 31][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel31
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel207
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '31'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 207.d
    text: |-
      de Saba Comprehensive School tot een bij koninklijk besluit te bepalen tijdstip wordt aangemerkt als inrichting
      voor voortgezet onderwijs als bedoeld in [artikel 117][ref1], en aansluitend daarop bij beschikking wordt
      aangemerkt als:


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel117
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel207
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '117'
        afdeling: IV
  - number: 207.d.1°
    text: |-
      een school als bedoeld in één van de [artikelen 13][ref1], [14][ref2], [15][ref3], [17][ref4] en [31][ref5], of


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0030284#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0030284#Artikel31
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel207
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '13'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '14'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '15'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0030284
        artikel: '17'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref5
        bwb_id: BWBR0030284
        artikel: '31'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 207.d.2°
    text: |-
      een scholengemeenschap als bedoeld in [artikel 123][ref1], waarbij in de beschikking tevens wordt aangegeven
      welke scholen als bedoeld in de [artikelen 13][ref2], [14][ref3], [15][ref4], [17][ref5] en [31][ref6] de
      scholengemeenschap omvat.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel123
