  - number: '208.1'
    text: |-
      In afwijking van de [artikelen 129 tot en met 135][ref1] en met overeenkomstige toepassing van [artikel 138][ref2]
      gelden gedurende de jaren 2011 tot en met 2015 de voorschriften van [artikel 167a, tweede tot en met negende lid,
      van de Wet primair onderwijs BES](onbekend) voor de voorziening in de huisvesting van uit 's Rijks kas bekostigde
      scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel129
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel138
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel208
