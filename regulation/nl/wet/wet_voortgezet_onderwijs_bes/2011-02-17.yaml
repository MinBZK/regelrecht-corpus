  - number: '208.2'
    text: Gedurende de jaren 2011 tot en met 2015 is het eerste lid tevens van toepassing op de Saba Comprehensive School.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel208
  - number: '208.3'
    text: |-
      Met ingang van het jaar 2016 is, in afwijking van [artikel 128][ref1], [afdeling II van titel III][ref2] van
      deze wet tot het tijdstip, genoemd in [artikel 207, onderdeel d][ref3], van overeenkomstige toepassing op de Saba
      Comprehensive School.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel128
      [ref2]: https://wetten.overheid.nl/BWBR0030284#AfdelingII
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel207
