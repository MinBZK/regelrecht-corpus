  - number: 214a
    text: |-
      Tot een bij koninklijk besluit te bepalen tijdstip blijven de bepalingen van de Wet voortgezet onderwijs BES zoals
      die is komen te luiden op 10 oktober 2010, van kracht voor zover de regeling van de daarin opgenomen onderwerpen
      niet is vervangen door de inwerkingtreding van overeenkomstige onderwerpen in deze wet.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel214a
  - number: '215'
    text: |-
      Bij twijfel of deze wet op een of meer inrichtingen van onderwijs van toepassing is, wordt beslist bij koninklijk
      besluit.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel215
  - number: '216.1'
    text: |-
      Voortgezet onderwijs wordt niet gegeven in gebouwen en op terreinen, die door de krachtens de
      [Gezondheidswet][ref1] bevoegde inspecteur van het staatstoezicht op de volksgezondheid zijn afgekeurd als
      schadelijk voor de gezondheid, gevaar opleverende voor de veiligheid of wegens onvoldoende ruimte voor het aantal
      in lokalen toegelaten leerlingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002202
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel216
    references:
      - id: ref1
        bwb_id: BWBR0002202
  - number: '216.2'
    text: |-
      De inspecteur, bedoeld in het eerste lid, zendt zijn besluit tot afkeuring aan het bestuurscollege van het
      openbaar lichaam waarin de onderwijslocatie ligt. Op dezelfde dag doet hij van zijn besluit mededeling aan Onze
      Minister; voorts, indien het een uit de openbare kas bekostigde school betreft, aan de inspectie en, indien het een
      bijzondere school betreft, aan het schoolbestuur.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel216
  - number: '216.3'
    text: |-
      Indien de inspecteur, bedoeld in het eerste lid, besluit dat de onderwijslocatie voldoende is verbeterd of dat het
      aantal leerlingen voldoende is beperkt, mag het onderwijs worden hervat. Aan hen, die ingevolge het tweede lid van
      de afkeuring mededeling hebben ontvangen, wordt van dit besluit op gelijke wijze mededeling gedaan.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel216
  - number: '217.1'
    text: |-
      Hij, die in strijd met het voorschrift van [artikel 216, eerste lid][ref1], onderwijs geeft of doet geven in een
      afgekeurd lokaal, wordt gestraft met geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel216
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel217
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '216'
  - number: '217.2'
    text: Het feit, strafbaar gesteld in dit artikel, is een overtreding.
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel217
  - number: '218'
    text: |-
      Een beslissing als bedoeld in de [artikelen 30, tweede lid][ref1], [32, tweede lid][ref2], en
      [93, vierde lid][ref3], van een bevoegd gezag van een openbare school geldt als een beschikking als bedoeld in
      [artikel 3 van de Wet administratieve rechtspraak BES][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel93
      [ref4]: https://wetten.overheid.nl/BWBR0028455#Artikel3
    url: https://wetten.overheid.nl/BWBR0030284/2011-02-17#Artikel218
