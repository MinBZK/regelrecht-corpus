  - number: '11.1'
    text: |-
      Het onderwijs aan de scholen voor voorbereidend secundair beroepsonderwijs omvat aansluitend op de periode van
      basisvorming een tweejarige periode van leerwegen.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11
  - number: '11.2'
    text: 'In de periode van leerwegen volgen de leerlingen onderwijs in:'
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11
  - number: 11.2.a
    text: de theoretisch kadergerichte leerweg,
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11
  - number: 11.2.b
    text: de praktisch kadergerichte leerweg, of
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11
  - number: 11.2.c
    text: de praktisch basisgerichte leerweg.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11
  - number: '11.3'
    text: 'De leerwegen omvatten een samenhangend onderwijsprogramma, gericht op:'
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11
  - number: 11.3.a
    text: een algemene maatschappelijke voorbereiding en persoonlijke vorming, en
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11
  - number: 11.3.b
    text: een voorbereiding op naar inhoud verwante opleidingen in het secundair beroepsonderwijs.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11
  - number: '11.4'
    text: |-
      Het onderwijs in elke leerweg wordt met ingang van het derde leerjaar gegeven in één of meer van de volgende
      sectoren:
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11
  - number: 11.4.a
    text: techniek;
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11
  - number: 11.4.b
    text: zorg en welzijn;
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11
  - number: 11.4.c
    text: economie.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11
  - number: '11.5'
    text: 'De sectoren, genoemd in het vierde lid, omvatten elk één of meer sectorprogramma’s, onderscheiden als volgt:'
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11
  - number: 11.5.a
    text: 'de sector techniek:'
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11
  - number: 11.5.a.1
    text: metaal;
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11
  - number: 11.5.a.2
    text: bouw;
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11
  - number: 11.5.a.3
    text: motorvoertuigentechniek;
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11
  - number: 11.5.a.4
    text: ecotechniek;
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11
  - number: 11.5.a.5
    text: instalectro;
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11
  - number: 11.5.a.6
    text: techniek algemeen;
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11
  - number: 11.5.a.7
    text: informatie- en communicatietechnologie.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11
  - number: 11.5.b
    text: 'de sector zorg en welzijn:'
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11
  - number: 11.5.b.1
    text: algemene mensverzorging;
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11
  - number: 11.5.b.2
    text: uiterlijke verzorging;
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11
  - number: 11.5.b.3
    text: zorg en welzijn algemeen.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11
  - number: 11.5.c
    text: 'de sector economie:'
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11
  - number: 11.5.c.1
    text: hospitality;
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11
  - number: 11.5.c.2
    text: administratie en commercie.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11
  - number: '11.6'
    text: |-
      Bij algemene maatregel van bestuur kunnen de sectorprogramma’s, genoemd in het vijfde lid, aangevuld dan wel
      gewijzigd worden.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11
  - number: 11a.1
    text: 'Het onderwijs in de leerwegen bestaat voor elke sector uit:'
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11a
  - number: 11a.1.a
    text: een gemeenschappelijk deel, dat voor alle leerwegen gelijk is,
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11a
  - number: 11a.1.b
    text: een sectordeel, dat kenmerkend is voor die sector, en
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11a
  - number: 11a.1.c
    text: een keuzedeel, dat voor alle sectoren verschillend kan zijn.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11a
  - number: 11a.2
    text: |-
      Het gemeenschappelijk deel van de leerwegen omvat Nederlandse taal, Engelse taal, mens en maatschappij,
      lichamelijke opvoeding, culturele en artistieke vorming en tevens voor het openbare lichaam Bonaire Papiamentu en
      Spaans en voor de openbare lichamen Saba en Sint Eustatius de Franse taal, Spaanse taal of Papiamentu.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11a
  - number: 11a.3
    text: 'Het sectordeel van de leerwegen omvat de navolgende vakken voor:'
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11a
  - number: 11a.3.a
    text: |-
      de sector techniek: wiskunde en natuur- en scheikunde, met uitzondering voor het in
      [artikel 11, vijfde lid, onderdeel a][ref1], ten 4°, genoemde sectorprogramma ecotechniek;


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel11
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0028424
        artikel: '11'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 11a.3.b
    text: 'de sector zorg en welzijn: biologie en, ter keuze van de leerling, wiskunde of mens en maatschappij;'
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11a
  - number: 11a.3.c
    text: 'de sector economie: economie en, ter keuze van de leerling, wiskunde, Papiamentu, Franse taal of Spaanse taal.'
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11a
  - number: 11a.4
    text: 'Het keuzedeel van de theoretisch kadergerichte leerweg:'
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11a
  - number: 11a.4.a
    text: kan tevens omvatten ten minste één door de leerling te kiezen vak,
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11a
  - number: 11a.4.b
    text: |-
      omvat het door de leerling te kiezen sectorprogramma, bedoeld in [artikel 11, vijfde lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel11
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0028424
        artikel: '11'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 11a.4.c
    text: kan omvatten door het bevoegd gezag vast te stellen vakken en programmaonderdelen.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11a
  - number: 11a.5
    text: 'Het keuzedeel van de praktisch kadergerichte leerweg en de praktisch basisgerichte leerweg:'
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11a
  - number: 11a.5.a
    text: |-
      omvat het door de leerling te kiezen sectorprogramma, bedoeld in [artikel 11, vijfde lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel11
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0028424
        artikel: '11'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 11a.5.b
    text: kan omvatten door het bevoegd gezag vast te stellen vakken en programmaonderdelen.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11a
  - number: 11a.6
    text: |-
      Het bevoegd gezag beslist welke keuzetaal, genoemd in het derde lid, onderdeel c, en welke sectorprogramma’s als
      bedoeld in vierde lid, onderdeel b, en vijfde lid, onderdeel a, en welke vakken en programmaonderdelen als bedoeld
      in het vierde lid, onderdeel c, en het vijfde lid, onderdeel b, worden aangeboden. Het bevoegd gezag kan tevens
      besluiten dat door het bevoegd gezag vast te stellen vakken en programmaonderdelen als bedoeld in het vierde lid,
      onderdeel c, en het vijfde lid, onderdeel b, door alle leerlingen in het keuzedeel moeten worden gevolgd.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11a
  - number: 11a.7
    text: |-
      Onverminderd het tweede tot en met het zesde lid kan bij algemene maatregel van bestuur worden vastgesteld het door
      alle leerlingen van scholen voor voorbereidend secundair beroepsonderwijs in het derde en vierde leerjaar te volgen
      minimum of maximum aantal vakken waarin eindexamen kan worden afgelegd, alsmede welke vakken het betreft.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11a
  - number: 11b.1
    text: |-
      Voor leerlingen, die zich aanmelden voor een school voor voorbereidend secundair beroepsonderwijs dan wel
      staan ingeschreven aan een school voor voorbereidend secundair beroepsonderwijs, die vanwege hun sociale of
      psychosociale omstandigheden niet in staat worden geacht zonder speciale voorzieningen het onderwijs, genoemd in
      [artikel 11, tweede lid][ref1], met een diploma, bedoeld in [artikel 32][ref2], te kunnen afsluiten, en die niet in
      aanmerking komen geplaatst te worden in het onderwijs, genoemd in [artikel 11c][ref3], treft het bevoegd gezag de
      nodige maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0028424#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0028424#Artikel11c
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0028424
        artikel: '11'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0028424
        artikel: '32'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0028424
        artikel: 11c
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 11b.2
    text: |-
      De maatregelen, bedoeld in het eerste lid, betreffen voorzieningen ten aanzien van de groepsgrootte, aanpassingen
      van het programma en extra aandacht voor lacunes in de kennis en ontwikkeling van de leerling.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11b
  - number: 11b.3
    text: |-
      Het bevoegd gezag van een school voor voorbereidend secundair beroepsonderwijs kan met de te nemen maatregelen,
      bedoeld in het eerste lid, indien dat ten behoeve van de leerling, genoemd in het eerste lid, noodzakelijk is,
      afwijken van de voorschriften, gegeven bij of krachtens de [artikelen 10][ref1] en [21][ref2]. Deze maatregelen
      houden de mogelijkheid voor de leerling open om examens af te leggen en een diploma te behalen, zoals bedoeld in
      [artikel 32][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0028424#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0028424#Artikel32
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0028424
        artikel: '10'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0028424
        artikel: '21'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0028424
        artikel: '32'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
  - number: 11b.4
    text: |-
      Maatregelen, als bedoeld in het eerste lid, worden niet genomen dan nadat, op een daartoe strekkend verzoek van de
      zijde van het bevoegd gezag, de onderwijsinspectie het desbetreffende onderwijsprogramma heeft goedgekeurd en, in
      geval deze maatregelen leiden tot extra bekostiging door het openbaar lichaam, niet dan nadat op daartoe strekkend
      verzoek zijdens het bevoegd gezag het bestuurscollege de betreffende maatregelen heeft goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11b
  - number: 11b.5
    text: |-
      Bij algemene maatregel van bestuur worden nadere voorschriften vastgesteld met betrekking tot de groepsgrootte,
      bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11b
  - number: 11c.1
    text: |-
      Arbeidsgericht onderwijs wordt gegeven ten behoeve van leerlingen tot ten hoogste 18 jaar aan afdelingen
      voor arbeidsgericht onderwijs, verbonden aan scholen voor voorbereidend secundair beroepsonderwijs en aan
      scholengemeenschappen waarvan ten minste een school voor voorbereidend secundair beroepsonderwijs deel uitmaakt.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11c
  - number: 11c.2
    text: Arbeidsgericht onderwijs is onderwijs voor leerlingen voor wie vaststaat dat
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11c
  - number: 11c.2.a
    text: overwegend een orthopedagogische en orthodidactische benadering is geboden, en
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11c
  - number: 11c.2.b
    text: |-
      het volgen van het onderwijs in een van de leerwegen, genoemd in [artikel 11, tweede lid][ref1], niet leidt tot het
      behalen van een diploma als bedoeld in [artikel 32][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0028424#Artikel32
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11c
    references:
      - id: ref1
        bwb_id: BWBR0028424
        artikel: '11'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0028424
        artikel: '32'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
  - number: 11c.3
    text: |-
      Arbeidsgericht onderwijs bestaat uit een gedeelte waarin aangepast theoretisch onderwijs, persoonlijkheidsvorming
      en het aanleren van sociale vaardigheden worden verzorgd, en een gedeelte waarin de leerling wordt voorbereid op
      het uitoefenen van functies op de arbeidsmarkt. Arbeidsgericht onderwijs wordt zodanig ingericht dat de kerndoelen
      van de basisvorming zo veel mogelijk kunnen worden bereikt. Arbeidsgericht onderwijs bereidt de leerling voor op
      eenvoudige functies binnen de arbeidsmarkt.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11c
  - number: 11c.4
    text: |-
      Het bevoegd gezag van een school voor voorbereidend secundair beroepsonderwijs met een afdeling voor arbeidsgericht
      onderwijs kan, met inachtneming van de tweede volzin van het derde lid, indien dat ten behoeve van de leerling
      noodzakelijk is, bij het aanbieden van dat onderwijs afwijken van de voorschriften, gegeven bij of krachtens de
      [artikelen 10][ref1], [21][ref2] en [32][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0028424#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0028424#Artikel32
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11c
    references:
      - id: ref1
        bwb_id: BWBR0028424
        artikel: '10'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0028424
        artikel: '21'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0028424
        artikel: '32'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
  - number: 11c.5
    text: 'Bij algemene maatregel van bestuur worden voorschriften vastgesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11c
  - number: 11c.5.a
    text: de groepsgrootte van de leerlingen die arbeidsgericht onderwijs volgen,
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11c
  - number: 11c.5.b
    text: de vakken die het arbeidsgericht onderwijs ten minste omvat, en
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11c
  - number: 11c.5.c
    text: |-
      het aantal uren dat het onderricht in de praktijk van de uitoefening van een vak of beroep in de vorm van begeleide
      stages gedurende een schoolweek ten hoogste omvat.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11c
  - number: 11d.1
    text: |-
      Het bevoegd gezag van een school voor voorbereidend secundair beroepsonderwijs kan aan de ouders van een leerling,
      die zich bij die school aanmeldt of aan die school is ingeschreven, voorstellen dat deze leerling arbeidsgericht
      onderwijs gaat volgen, indien het bevoegd gezag redelijkerwijs kan aannemen dat deze niet in staat is het
      onderwijs in één van de leerwegen, genoemd in [artikel 11, tweede lid][ref1], met een diploma als bedoeld in
      [artikel 32][ref2], af te sluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0028424#Artikel32
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11d
    references:
      - id: ref1
        bwb_id: BWBR0028424
        artikel: '11'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0028424
        artikel: '32'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
  - number: 11d.2
    text: |-
      Het bevoegd gezag van de school beslist, na overleg met de ouders van de in het eerste lid bedoelde leerling,
      over de toelating van de leerling tot de afdeling voor arbeidsgericht onderwijs. Alvorens de beslissing tot
      toelating wordt genomen, legt indien mogelijk het bevoegd gezag van de school waaraan de leerling voorafgaand
      aan de toelating tot het arbeidsgericht onderwijs was of is ingeschreven, een op de desbetreffende leerling
      betrekking hebbend onderwijskundig rapport, alsmede de op schrift gestelde zienswijze van de ouders, over aan de
      verwijzingscommissie, bedoeld in het zesde lid. Geen leerling wordt toegelaten tot het arbeidsgericht onderwijs dan
      nadat de verwijzingscommissie schriftelijk heeft bepaald dat de leerling tot dat onderwijs toelaatbaar is.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11d
  - number: 11d.3
    text: |-
      Het bevoegd gezag van de afdeling voor arbeidsgericht onderwijs waaraan de leerling wordt toegelaten, stelt,
      na overleg met de ouders, voor de leerling een handelingsplan op. Het handelingsplan bevat een omschrijving
      van de wijze waarop voor de desbetreffende leerling het arbeidsgericht onderwijs met inachtneming van
      [artikel 11b, derde lid][ref1], wordt verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel11b
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11d
    references:
      - id: ref1
        bwb_id: BWBR0028424
        artikel: 11b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 11d.4
    text: |-
      Indien de verwijzingscommissie bepaalt dat de leerling niet tot het arbeidsgericht onderwijs toelaatbaar is, brengt
      zij schriftelijk advies uit aan de ouders van de leerling en het in het eerste lid bedoelde bevoegd gezag, over de
      wijze waarop de leerling op de school waar hij is ingeschreven, naar het oordeel van de verwijzingscommissie zou
      moeten worden begeleid.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11d
  - number: 11d.5
    text: |-
      De verwijzingscommissie verstrekt desgevraagd aan de ingevolge [artikel 2][ref1] met het uitoefenen van het
      toezicht daarop bedoelde instantie en het betreffende bestuurscollege de voor de uitoefening van hun taak benodigde
      inlichtingen. Onze Minister en het betreffende bestuurscollege kunnen inzage vorderen van zakelijke gegevens en
      bescheiden, voor zover dat voor de invulling van hun taak redelijkerwijs nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel2
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11d
    references:
      - id: ref1
        bwb_id: BWBR0028424
        artikel: '2'
  - number: 11d.6
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften gegeven met betrekking tot de instelling, taak,
      samenstelling en werkwijze van de verwijzingscommissies. De verwijzigingscommissies worden benoemd bij
      eilandsbesluit.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11d
  - number: 11d.7
    text: |-
      Het toezicht op de verwijzingscommissies wordt volgens bij algemene maatregel van bestuur, te stellen regels
      uitgevoerd door de inspectie.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel11d
  - number: '12.1'
    text: |-
      De instructietaal, zoals bedoeld in [artikel 1][ref1], in een school voor v.w.o., h.a.v.o. of v.s.b.o. is een van
      officiële talen van de openbare lichamen Bonaire, Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel1
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0028424
        artikel: '1'
  - number: '12.2'
    text: |-
      De gekozen instructietaal geldt voor de gehele school of voor een of meerdere leerwegen in het door die school
      aangeboden onderwijs.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel12
  - number: '12.3'
    text: De gekozen instructietaal wordt bij alle vakken toegepast.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel12
  - number: '12.4'
    text: |-
      Een wijziging in de door de school te hanteren instructietaal of instructietalen kan slechts plaatsvinden met
      ingang van de eerste dag van het schooljaar, mits zulks tenminste zestien maanden daaraan voorafgaand door het
      bevoegd gezag in tenminste twee in het desbetreffende openbaar lichaam verschijnende dagbladen bekend is gemaakt.
      Een dergelijke wijziging kan geen betrekking hebben op de cohorten die op de datum van bekendmaking van die
      wijziging reeds op de school stonden ingeschreven.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel12
  - number: '12.5'
    text: |-
      Scholen dragen zorg voor een optimaal mogelijke aansluiting van leerlingen met een moedertaal die niet overeenkomt
      met de op de school gehanteerde instructietaal of instructietalen.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel12
  - number: '12.6'
    text: |-
      Het bevoegd gezag van een dagschool als bedoeld in de [artikelen 7 tot en met 9][ref1] kan in bijzondere gevallen,
      na een daartoe strekkend met redenen omkleed schriftelijk verzoek van ouders, voogden of verzorgers, een leerling
      ontheffing verlenen voor één van de vakken van de basisvorming. Het bevoegd gezag bepaalt bij de ontheffing welk
      onderwijs voor de leerling in de plaats komt voor het vak waarvoor ontheffing is verleend. Het bevoegd gezag geeft
      de inspecteur kennis van de verleende ontheffing en vermeldt de gronden waarop zij berust.


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel7
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0028424
        artikel: '7'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '13.1'
    text: |-
      Onze Minister stelt jaarlijks toetsen vast die betrekking hebben op door hem aan te wijzen kerndoelen van de vakken
      van de basisvorming, met uitzondering van het vak lichamelijke opvoeding. Bij algemene maatregel van bestuur kunnen
      nadere regels gesteld worden met betrekking tot deze toetsen.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel13
  - number: '13.2'
    text: |-
      Het bevoegd gezag neemt deze toetsen af op de dagscholen, bedoeld in de [artikelen 7 tot en met 9][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel7
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028424
        artikel: '7'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '14'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel14
  - number: '15'
    text: |-
      Hoger beroepsonderwijs wordt gegeven aan scholen met een cursusduur van ten hoogste vier jaren. Het bereidt voor op
      beroepen in de navolgende sectoren: dienstverlening en gezondheidszorg; economie; landbouw, veeteelt en natuurlijke
      omgeving; techniek; onderwijs. Aan deze scholen wordt onderwijs gegeven in algemeen vormende en beroepsgerichte
      vakken. Aan opleidingsscholen voor onderwijzers wordt in ieder geval onderwijs gegeven in opvoedkunde, psychologie,
      algemene didactiek en bijzondere didactiek.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel15
  - number: '16.1'
    text: |-
      Aan bijzondere scholen kan behalve de in de[ artikelen 7 tot en met 9][ref1], en [15][ref2] genoemde vakken het vak
      godsdienstonderwijs dan wel het vak levensbeschouwelijke vorming gegeven worden.


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0028424#Artikel15
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028424
        artikel: '7'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0028424
        artikel: '15'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '16.2'
    text: |-
      Aan openbare scholen kan behalve de in de [artikelen 7 tot en met 9][ref1], [14][ref2] en [15][ref3] genoemde
      vakken het vak levensbeschouwelijke vorming gegeven worden.


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0028424#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0028424#Artikel15
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028424
        artikel: '7'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0028424
        artikel: '14'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0028424
        artikel: '15'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '16.3'
    text: |-
      Aan scholen als bedoeld in de [artikelen 7][ref1] en [8][ref2] kan na het derde leerjaar naast het onderwijs in
      de voor die school genoemde vakken en deelvakken in bij ministeriële regeling genoemde gevallen onderwijs worden
      gegeven in andere vakken en programmaonderdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0028424#Artikel8
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028424
        artikel: '7'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0028424
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '16.4'
    text: |-
      Aan scholen als bedoeld in [artikel 9][ref1], kan na het tweede leerjaar naast het onderwijs in de voor die school
      genoemde vakken en sectorprogramma’s in bij ministeriële regeling genoemde gevallen onderwijs worden gegeven in
      andere vakken en programmaonderdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel9
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028424
        artikel: '9'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '17'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel17
  - number: '18.1'
    text: |-
      In een scholengemeenschap zijn tot één school verenigd twee of meer scholen, bedoeld in de
      [artikelen 7 tot en met 9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel7
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028424
        artikel: '7'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '18.2'
    text: In een scholengemeenschap is ten minste het eerste leerjaar gemeenschappelijk.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel18
  - number: '18.3'
    text: |-
      In een gemeenschap van scholen zijn verenigd twee scholen, bedoeld in de [artikelen 7 tot met 9][ref1], die
      ten aanzien van de inrichting van het onderwijs nauw samenwerken. Bij algemene maatregel van bestuur kunnen
      voorschriften worden vastgesteld met betrekking tot deze samenwerking.


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel7
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028424
        artikel: '7'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '19.1'
    text: |-
      De scholen kunnen zijn dagscholen, avondscholen of dag-avondscholen. Volgens regelen, te stellen bij algemene
      maatregel van bestuur, kunnen de cursusduur en de inrichting van het onderwijs aan de avondscholen en aan de dag-
      avondscholen afwijken van die voorgeschreven bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel19
  - number: '19.2'
    text: |-
      Tenzij het tegendeel blijkt, worden onder scholen voor voorbereidend secundair beroepsonderwijs of voor hoger
      beroepsonderwijs mede verstaan afzonderlijke cursussen voor voorbereidend secundair beroepsonderwijs of voor hoger
      beroepsonderwijs.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel19
  - number: '20'
    text: |-
      De naam van de school duidt aan, tot welke van de soorten van scholen, bedoeld in de
      [artikelen 7 tot en met 9][ref1], [14][ref2] en [15][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0028424#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0028424#Artikel15
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028424
        artikel: '7'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0028424
        artikel: '14'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0028424
        artikel: '15'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '21.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voor de scholen voor voorbereidend wetenschappelijk
      onderwijs, hoger algemeen voortgezet onderwijs en voorbereidend secundair beroepsonderwijs nadere voorschriften
      vastgesteld omtrent de inrichting van het onderwijs. Deze voorschriften kunnen per schoolsoort verschillen. Voor de
      scholen, bedoeld in de [artikelen 7 tot en met 9][ref1], kunnen afzonderlijke voorschriften worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel7
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0028424
        artikel: '7'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '21.2'
    text: |-
      De algemene maatregel van bestuur bedoeld in het eerste lid, houdt voor de scholen voor voorbereidend
      wetenschappelijk onderwijs, hoger algemeen voortgezet onderwijs en voorbereidend secundair beroepsonderwijs
      tenminste voorschriften in omtrent:
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel21
  - number: 21.2.a
    text: duur van de lessen;
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel21
  - number: 21.2.b
    text: |-
      de splitsing en samenvoeging van klassen en de vorming van groepen, mede in verband met het totale aantal
      leerlingen;
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel21
  - number: 21.2.c
    text: |-
      de vakken, het minimum aantal wekelijkse lessen in elk van de vakken, als mede het aantal wekelijkse lessen
      dat in alle vakken tezamen gedurende de periode van de basisvorming respectievelijk de periode van het
      profielvoorbereidend onderwijs moet worden gevolgd, en de vakken dan wel deelvakken van de periode van het
      profielenonderwijs met de daarbij behorende minima aan normatieve studielast.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel21
  - number: '21.3'
    text: |-
      De algemene maatregel van bestuur, bedoeld in het eerste lid, houdt voor de scholen voor voorbereidend secundair
      beroepsonderwijs tevens voorschriften in omtrent:
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel21
  - number: 21.3.a
    text: |-
      de vakken en de sectorprogramma’s, het minimum aantal wekelijkse lessen dat in elk van de vakken gedurende de
      periode van de basisvorming respectievelijk in elk van de vakken en sectorprogramma’s gedurende de periode van de
      leerwegen moet worden gevolgd, en
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel21
  - number: 21.3.b
    text: |-
      het maximum aantal wekelijkse lessen dat gedurende de periode van de basisvorming in alle vakken respectievelijk de
      periode van de leerwegen in alle vakken en sectorprogramma’s tezamen mag worden gevolgd.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel21
  - number: '21.4'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel21
  - number: '21.5'
    text: |-
      De algemene maatregel van bestuur, bedoeld in het eerste lid, houdt voor de scholen voor hoger beroepsonderwijs ten
      minste regels in omtrent: de cursusduur, de varianten, de afdelingen en de stage; de duur van de lessen; splitsing
      en samenvoeging van klassen en vorming van groepen, mede in verband met het totale aantal leerlingen; het aantal
      algemeen vormende en beroepsgerichte vakken; het minimum aantal wekelijkse lessen, dat per variant, gedurende de
      cursus in de algemeen vormende en beroepsgerichte vakken moet worden gevolgd; het maximum aantal wekelijkse lessen
      dat gedurende de cursus in alle vakken te zamen mag worden gevolgd.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel21
  - number: '21.6'
    text: |-
      Ten aanzien van de scholen, bedoeld in [artikel 15, derde lid][ref1], wordt geen onderscheid gemaakt in varianten.


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel15
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0028424
        artikel: '15'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '21.7'
    text: Bij algemene maatregel van bestuur kunnen regels worden gesteld voor de vakopleiding in samenwerking met bedrijven.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel21
  - number: '22.1'
    text: |-
      De rector of de directeur van de school ontwerpt jaarlijks met inachtneming van de bij of krachtens deze wet
      gestelde regels, na bespreking met de gezamenlijke leraren, het schoolwerkplan en de lesrooster.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel22
  - number: '22.2'
    text: Het bevoegd gezag stelt het schoolwerkplan en de lesrooster vast en zendt deze ter goedkeuring aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel22
  - number: '22.3'
    text: |-
      De schoolwerkplannen en de lesroosters van de cursussen voor voorbereidend secundair beroepsonderwijs of voor hoger
      beroepsonderwijs behoeven goedkeuring van de inspectie.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel22
  - number: '23.1'
    text: |-
      Het schoolwerkplan bevat in ieder geval gegevens over de schoolorganisatie, doelstellingen, leerstof, didactische
      werkvormen, leermiddelen en tijdplanning.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel23
  - number: '23.2'
    text: Onze Minister kan nadere regels stellen omtrent de inhoud van het schoolwerkplan, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel23
  - number: 23a.1
    text: |-
      Het bevoegd gezag van een school als bedoeld in de [artikelen 7 tot en met 9][ref1], en [15][ref2], stelt jaarlijks
      vóór 31 december een verslag vast over het onderwijs aan de school gedurende het voorafgaande schooljaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0028424#Artikel15
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0028424
        artikel: '7'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0028424
        artikel: '15'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 23a.2
    text: |-
      Het jaarverslag, bedoeld in het eerste lid, bevat met betrekking tot het desbetreffende schooljaar in ieder
      geval een beschrijving van de algemene gang van zaken, waaronder de wijze waarop uitvoering is gegeven aan het
      goedgekeurde schoolwerkplan.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel23a
  - number: 23a.3
    text: |-
      Het bevoegd gezag draagt er zorg voor dat een exemplaar van het jaarverslag in het gebouw van de school ter inzage
      wordt neergelegd op een voor ieder toegankelijke plaats. Het bevoegd gezag zendt het verslag binnen dertig dagen na
      de vaststelling aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel23a
  - number: '24.1'
    text: |-
      Onze Minister stelt voorschriften vast met betrekking tot de begin- en einddatum van het schooljaar en met
      betrekking tot het totaal aantal vakantiedagen per jaar.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel24
  - number: '24.2'
    text: |-
      Het lesrooster wordt vastgesteld in overeenstemming met het schoolwerkplan. Hij geeft de regeling van de
      schooltijden en vermeldt tevens de feestdagen en de schoolvakanties waarvan de begin- en einddata door het
      bestuurscollege, het bevoegd gezag gehoord, worden vastgesteld, alsmede de namen van de leraren.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel24
  - number: '24.3'
    text: Afwijking van lesrooster kan plaats hebben met toestemming van de inspectie.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel24
  - number: '25.1'
    text: |-
      Indien de inspectie van oordeel is, dat het schoolwerkplan of het lesrooster niet voldoet aan de bij of krachtens
      deze wet gegeven voorschriften of anderszins gebreken vertoont en het bevoegd gezag wijziging weigert, vraagt hij
      het oordeel van Onze Minister, aan wiens uitspraak het bevoegd gezag zich onderwerpt.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel25
  - number: '25.2'
    text: |-
      De schoolwerkplannen van de scholen waarvoor niet bij algemene maatregel van bestuur voorschriften omtrent de
      inrichting van het onderwijs zijn vastgesteld, behoeven de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel25
  - number: '26'
    text: |-
      Onze Minister kan nadere voorschriften geven omtrent de modellen van schoolwerkplannen en lesroosters en omtrent de
      inzending daarvan.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel26
  - number: '27'
    text: |-
      Het bevoegd gezag stelt, de inspectie gehoord, een reglement voor de school vast. Onze Minister kan nadere
      voorschriften geven omtrent de inhoud van dit reglement.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel27
  - number: '28'
    text: |-
      Ten behoeve van de bijzondere inrichting van het onderwijs aan een school en ten behoeve van een
      scholengemeenschap, als bedoeld in [artikel 18][ref1], kan Onze Minister goedkeuren, dat wordt afgeweken van de bij
      of krachtens deze wet gegeven voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel18
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0028424
        artikel: '18'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '29.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen voor elke soort van scholen of voor afdelingen van die scholen
      voorwaarden voor de toelating en voorschriften omtrent verwijdering en bevordering worden vastgesteld. De toelating
      mag niet afhankelijk gesteld worden van een geldelijke bijdrage van de ouders.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel29
  - number: '29.2'
    text: |-
      Een leerling mag geen arbeidsgericht onderwijs meer volgen aan een afdeling voor arbeidsgericht onderwijs na afloop
      van het schooljaar waarin hij de leeftijd van achttien jaren heeft bereikt. Op een daartoe strekkend verzoek van
      het bevoegd gezag, gedaan in het in de eerste volzin bedoelde schooljaar, kan de inspectie toestaan dat de leerling
      het daaropvolgende schooljaar arbeidsgericht onderwijs kan blijven volgen, indien zij van mening is dat zonder het
      volgen van dit schooljaar de leerling niet voldoende is voorbereid op eenvoudige functies binnen de arbeidsmarkt.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel29
  - number: '30.1'
    text: |-
      Het gezondheidstoezicht op de scholen wordt uitgeoefend door het bestuurscollege en strekt zich uit over alle
      gebouwen waarin en terreinen waarop voortgezet onderwijs wordt gegeven en over het personeel van de scholen en
      de leerlingen.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel30
  - number: '30.2'
    text: |-
      Geen voortgezet onderwijs wordt gegeven in gebouwen of op terreinen waarvan het bestuurscollege heeft beslist,
      dat zij niet voldoen aan de voorschriften, bedoeld in het zesde lid, of schadelijk zijn voor de gezondheid dan wel
      gevaar opleveren voor de veiligheid.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel30
  - number: '30.3'
    text: |-
      Een beslissing, als bedoeld in het vorige lid, wordt schriftelijk en met redenen omkleed gegeven. Afschriften ervan
      worden gezonden aan de inspectie, aan de rector of de directeur van de school en, indien het een bijzondere school
      betreft, aan het schoolbestuur.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel30
  - number: '30.4'
    text: |-
      Het bestuurscollege maakt zijn beslissing onmiddellijk openbaar op de wijze waarop van eilandswege officiële
      berichten worden bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel30
  - number: '30.5'
    text: |-
      Nadat het bestuurscollege schriftelijk heeft verklaard, dat het gebouw of het terrein voldoende is verbeterd, mag
      het onderwijs worden hervat. Dit wordt openbaar gemaakt overeenkomstig het derde en het vierde lid.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel30
  - number: '30.6'
    text: |-
      Bij algemene maatregel van bestuur kunnen, zowel in het belang van de gezondheid en de veiligheid van de leerlingen
      als van het onderwijs, voorschriften worden gegeven omtrent de bouw en de inrichting van gebouwen waarin voortgezet
      onderwijs wordt gegeven, omtrent de inrichting van de bij de school behorende terreinen, alsmede omtrent het aantal
      leerlingen dat in de lokalen mag worden toegelaten.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel30
  - number: '31.1'
    text: |-
      Hij die in strijd met [artikel 30][ref1] onderwijs geeft of doet geven in een afgekeurd lokaal of die als rector
      of directeur van een school in een lokaal meer leerlingen toelaat dan het mag bevatten volgens de voorschriften,
      bedoeld in het zesde lid van dat artikel, wordt gestraft met een geldboete van ten hoogste USD 56.


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel30
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0028424
        artikel: '30'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '31.2'
    text: |-
      Indien het feit, strafbaar gesteld in het eerste lid, wordt gepleegd voordat twee jaren zijn verlopen sedert een
      veroordeling ter zake van eenzelfde feit onherroepelijk is geworden, wordt een geldboete van ten hoogste USD 112 of
      hechtenis van ten hoogste veertien dagen opgelegd. Bij tweede of volgende herhaling, gepleegd telkens binnen twee
      jaren, nadat de laatste veroordeling onherroepelijk is geworden, wordt hechtenis opgelegd van ten hoogste een jaar.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel31
  - number: '31.3'
    text: Het feit, strafbaar gesteld in dit artikel, is een overtreding.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel31
  - number: '32.1'
    text: |-
      Aan de leerlingen van de scholen, bedoeld in de [artikelen 7 tot en met 9][ref1], wordt gelegenheid gegeven aan
      deze scholen een eindexamen af te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel7
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0028424
        artikel: '7'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '32.2'
    text: |-
      Aan de leerlingen van de overige scholen en aan de leerlingen van de afdelingen van scholen voor hoger
      beroepsonderwijs kan gelegenheid worden gegeven aan deze scholen en afdelingen een eindexamen af te leggen.
      Bij algemene maatregel van bestuur kunnen scholen of afdelingen van scholen voor hoger beroepsonderwijs worden
      aangewezen, waarvan het bevoegd gezag de regeling van het eindexamen vaststelt onder goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel32
  - number: '32.3'
    text: |-
      Het eindexamen wordt afgenomen door de rector of de directeur en leraren van de school onder toezicht, behoudens
      in de bij algemene maatregel van bestuur te noemen gevallen, van een of meer door Onze Minister aan te wijzen
      gecommitteerden. Het eindexamen kan mede worden afgenomen door deskundigen, die door het bevoegd gezag onder
      goedkeuring van Onze Minister worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel32
  - number: '32.4'
    text: |-
      Zij die het eindexamen met gunstig gevolg hebben afgelegd, ontvangen een diploma. Onze Minister stelt modellen van
      de diploma’s vast.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel32
  - number: '32.5'
    text: |-
      Bij algemene maatregel van bestuur worden, behalve indien het tweede lid, tweede volzin, toepassing heeft gevonden,
      voorschriften vastgesteld omtrent de in dit artikel bedoelde eindexamens die niet voor alle leerlingen van een
      school dezelfde vakken, deelvakken, sectorprogramma’s en andere programmaonderdelen behoeven te omvatten.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel32
  - number: '32.6'
    text: |-
      Ten behoeve van de bijzondere inrichting van het onderwijs kan Onze Minister toestaan, dat wordt afgeweken van de
      bij of krachtens dit artikel gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel32
  - number: '33.1'
    text: |-
      De leerling die de school verlaat en aan wie geen akte, diploma, verklaring of getuigschrift als bedoeld in
      [artikel 32, vierde lid][ref1], kan worden uitgereikt, ontvangt een verklaring waarin in ieder geval wordt vermeld
      het tijdstip waarop hij de school verlaat, en het leerjaar waartoe hij laatstelijk onvoorwaardelijk was bevorderd
      alsmede voor welke vormen van vervolgonderwijs hij geschikt wordt geacht. Deze verklaring wordt door het bevoegd
      gezag of namens het bevoegd gezag door de rector of de directeur ondertekend.


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel32
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0028424
        artikel: '32'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
  - number: '33.2'
    text: Onze Minister stelt het model van de verklaring vast.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel33
  - number: '34.1'
    text: Zij die onderwijs geven aan een school, dragen de titel van leraar.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel34
  - number: '34.2'
    text: |-
      Aan het hoofd van een school voor voorbereidend wetenschappelijk onderwijs en aan het hoofd van een
      scholengemeenschap waaraan mede voorbereidend wetenschappelijk onderwijs wordt gegeven, staat een rector, aan het
      hoofd van de overige scholen en scholengemeenschappen een directeur. Tot rector of directeur is slechts benoembaar
      hij die met inachtneming van [artikel 35, eerste lid][ref1], kan worden benoemd tot leraar in een van de vakken
      die aan de school worden onderwezen. In bijzondere gevallen kan het bevoegd gezag met goedkeuring van Onze Minister
      afwijken van het bepaalde in de vorige volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel35
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0028424
        artikel: '35'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: '34.3'
    text: |-
      Het bevoegd gezag benoemt één of meer van de leraren om de rector of de directeur bij te staan en bij afwezigheid
      te vervangen; deze dragen de titel van onderscheidenlijk conrector en adjunct-directeur.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel34
  - number: '34.4'
    text: |-
      Het bestuurscollege van het openbaar lichaam stelt voorschriften vast omtrent het aantal door de rector of de
      directeur en door de conrector of de adjunct-directeur ten minste te geven lessen.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel34
  - number: '35.1'
    text: 'Tot leraar aan een school kan slechts worden benoemd hij die in het bezit is van:'
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel35
  - number: 35.1.a
    text: een bewijs van bekwaamheid voor het door hem aan die school te geven onderwijs;
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel35
  - number: 35.1.b
    text: |-
      een bewijs van voldoende pedagogische en didactische voorbereiding, voor zover vereist bij of krachtens
      [artikel 36][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel36
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0028424
        artikel: '36'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 35.1.c
    text: |-
      een bewijs van goed zedelijk gedrag, afgegeven door de bevoegde overheden van de plaatsen waar hij de laatste twee
      jaren heeft gewoond;
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel35
  - number: 35.1.d
    text: |-
      een geneeskundige verklaring dat hij geen ziels- of lichaamsgebreken heeft die hem voor de vervulling van de
      betrekking ongeschikt maken;
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel35
  - number: '35.2'
    text: |-
      In bijzondere gevallen kan Onze Minister aan personen die in een bepaald vak of onderdeel van een vak door
      buitengewone bekwaamheid uitmunten, ten aanzien van dit vak of dit onderdeel ontheffing verlenen van de in het
      eerste lid onder a en b gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel35
  - number: '35.3'
    text: |-
      Bij tijdelijke afwezigheid van een leraar kan ten aanzien van degene die hem vervangt telkens voor ten hoogste
      twee jaar worden afgeweken van de eisen van benoembaarheid, gesteld in het eerste lid onder a en b. Indien in een
      vacature niet terstond kan worden voorzien door de benoeming van een leraar die aan de genoemde eisen voldoet, is
      het bepaalde in de vorige volzin van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel35
  - number: '35.4'
    text: |-
      In het eerste leerjaar van een dagschool voor voorbereidend wetenschappelijk onderwijs, voor hoger algemeen
      voortgezet onderwijs of voor voorbereidend secundair beroepsonderwijs kan een leraar die daartoe naar het oordeel
      van het bevoegd gezag bekwaam is, ook onderwijs geven in andere vakken dan die waarvoor het in zijn bezit zijnde
      bewijs van bekwaamheid bedoeld in het eerste lid onder a, geldt. In bijzondere gevallen kan het bepaalde in de
      vorige volzin eveneens toepassing vinden ten aanzien van een leraar in het tweede leerjaar van een daarbedoelde
      school.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel35
  - number: '35.5'
    text: In de gevallen, bedoeld in het derde en het vierde lid, is de goedkeuring van de inspectie vereist.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel35
  - number: '35.6'
    text: |-
      Het eerste lid, onderdeel a en b, is niet van toepassing op een leraar, in zoverre deze belast is met het geven van
      het vak godsdienstonderwijs of het vak levensbeschouwelijke vorming.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel35
  - number: '35.7'
    text: |-
      De in het eerste lid onder d bedoelde verklaring mag niet ouder zijn dan twee jaren. Het onderzoek dat ervoor nodig
      is, wordt ingesteld vanwege het bestuurscollege.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel35
  - number: '36.1'
    text: |-
      De bewijzen van bekwaamheid en de bewijzen van voldoende pedagogische en didactische voorbereiding, bedoeld in
      [artikel 35, eerste lid onder a en b][ref1], zijn opgenomen in de bij deze wet opgenomen bijlage.


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel35
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0028424
        artikel: '35'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: '36.2'
    text: Bij algemene maatregel van bestuur kan de in het eerste lid bedoelde bijlage worden aangevuld of gewijzigd.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel36
  - number: '36.3'
    text: |-
      Volgens regelen te stellen bij algemene maatregel van bestuur, kan Onze Minister verklaren, dat een leraar
      wordt geacht in het bezit te zijn van een bewijs van bekwaamheid tot het geven van voortgezet onderwijs
      in vakken waarvoor geen bewijzen van bekwaamheid zijn aangewezen, en van een bewijs, als bedoeld in
      [artikel 35, eerste lid onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel35
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0028424
        artikel: '35'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: '36.4'
    text: |-
      Volgens regels te stellen bij algemene maatregel van bestuur kan Onze Minister verklaren dat de bezitter van een
      buiten de openbare lichamen Bonaire, Sint Eustatius en Saba behaald bewijs van bekwaamheid, dat niet opgenomen is
      in de bijlage, bedoeld in het eerste lid, de bevoegdheid heeft voortgezet onderwijs te geven in de vakken en aan de
      scholen, door hem aangegeven.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel36
  - number: '37.1'
    text: |-
      Aan de scholen worden na overleg met de inspectie toegelaten studenten aan een school voor de opleiding van
      onderwijzend personeel die voor het halen van bewijzen van bekwaamheid een praktische vorming behoeven.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel37
  - number: '37.2'
    text: |-
      Zij die ingevolge het eerste lid worden toegelaten, zijn in het bezit van een bewijs van goed zedelijk gedrag
      en een geneeskundige verklaring, als bedoeld in [artikel 35][ref1]. Zij zijn werkzaam onder de leiding van een
      bevoegde leraar.


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel35
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0028424
        artikel: '35'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: '38.1'
    text: |-
      De salarissen en de toelagen, door het bevoegd gezag toe te kennen aan de rector of de directeur, de leraren en
      het door het bestuurscollege aan te wijzen overige personeel, worden door dat college vastgesteld in overleg met
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel38
  - number: '38.2'
    text: Iedere wijziging van de regeling, bedoeld in het eerste lid, geschiedt in overleg met Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel38
  - number: '38.3'
    text: |-
      Indien het bestuurscollege bij dit overleg een door Onze Minister gedaan voorstel niet kan overnemen, brengt het
      dit schriftelijk onder opgave van de redenen te zijner kennis. Van deze kennisgeving wordt melding gemaakt in het
      verslag van de staat van het onderwijs dat Onze Minister jaarlijks aan de Staten-Generaal doet geven.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel38
  - number: '38.4'
    text: |-
      Wanneer door een regeling, als bedoeld in het eerste lid het peil van het onderwijs naar het oordeel van Onze
      Minister in ernstig gevaar wordt gebracht, kan deze de regeling bij algemene maatregel van bestuur wijzigen.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel38
  - number: '39'
    text: Het bevoegd gezag benoemt, schorst en ontslaat de rector of de directeur, de leraren en het overige personeel.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel39
  - number: '40.1'
    text: |-
      De bevoegdheid tot het geven van onderwijs vervalt van rechtswege bij onherroepelijke veroordeling wegens het
      misdrijf, bedoeld in [artikel 257 van het Wetboek van Strafrecht BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel257
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '257'
  - number: '40.2'
    text: |-
      Onze Minister kan een leraar die onherroepelijk is veroordeeld wegens een ander misdrijf dan bedoeld in het eerste
      lid of die bij het geven van onderwijs opvattingen steunt of verkondigt die strijden met de goede zeden of een
      aansporing inhouden tot ongehoorzaamheid aan de wettelijke regelingen van de openbare lichamen Bonaire, Sint
      Eustatius en Saba, de bevoegdheid tot het geven van onderwijs ontnemen. Gelijke bevoegdheid komt Onze Minister toe
      ten aanzien van een leraar die zich aan ergerlijk levensgedrag schuldig maakt.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel40
  - number: '40.3'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel40
  - number: '40.4'
    text: |-
      De leraar die op grond van dit artikel de bevoegdheid tot het geven van onderwijs verliest, is van rechtswege
      ontslagen met ingang van de dag waarop de beslissing onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel40
  - number: '40.5'
    text: |-
      In bijzondere gevallen kan Onze Minister, de Raad van Advies gehoord, aan hem die ingevolge het eerste of
      het tweede lid de bevoegdheid tot het geven van onderwijs heeft verloren, deze bevoegdheid, al dan niet onder
      voorwaarden teruggeven.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel40
  - number: 40a.1
    text: |-
      Een eilandsraad kan bij eilandsverordening een openbaar orgaan instellen dat tot doel heeft een of meer openbare
      scholen in het openbaar lichaam in stand te houden, al dan niet samen met openbare scholen voor funderend
      onderwijs als bedoeld in de [Wet primair onderwijs BES][ref1] of openbare instellingen in de zin van de
      [Wet educatie en beroepsonderwijs BES][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028735
      [ref2]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0028735
      - id: ref2
        bwb_id: BWBR0007625
  - number: 40a.2
    text: |-
      De eilandsraad maakt het voornemen tot het vaststellen van de eilandsverordening, bedoeld in het eerste lid,
      bekend.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel40a
  - number: 40a.3
    text: |-
      Het openbaar orgaan oefent met uitzondering van de besluitvorming over de opheffing van een openbare school alle
      taken en bevoegdheden uit van het bevoegd gezag. Het bezit rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel40a
  - number: 40a.4
    text: 'De eilandsverordening, bedoeld in het eerste lid, voorziet in ieder geval in een regeling omtrent:'
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel40a
  - number: 40a.4.a
    text: |-
      de samenstelling, werkwijze en inrichting van het bestuur van het openbaar orgaan, met dien verstande dat in de
      regeling een overheersende invloed van de overheid in het bestuur is verzekerd;
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel40a
  - number: 40a.4.b
    text: |-
      de wijze van benoeming, herbenoeming, schorsing en ontslag van de bestuursleden, met dien verstande dat de leden
      van het bestuur worden benoemd door de eilandsraad en dat ten minste een derde deel, doch geen meerderheid, van die
      leden wordt benoemd op bindende voordracht van de ouders van de leerlingen die zijn ingeschreven op de betrokken
      school of scholen;
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel40a
  - number: 40a.4.c
    text: de termijn waarvoor de bestuursleden worden benoemd;
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel40a
  - number: 40a.4.d
    text: de vaststelling van de begroting en de jaarrekening na goedkeuring door de betreffende eilandsraad;
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel40a
  - number: 40a.4.e
    text: de wijze waarop de eilandsraad toezicht op het bestuur uitoefent;
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel40a
  - number: 40a.4.f
    text: de gronden waarop het bestuur kan besluiten de vergadering besloten te houden, en
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel40a
  - number: 40a.4.g
    text: |-
      de periode waarvoor het openbaar orgaan in het leven wordt geroepen, met dien verstande dat deze periode ten minste
      5 jaren bedraagt.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel40a
  - number: 40a.5
    text: |-
      Het bestuur brengt jaarlijks verslag uit aan de eilandsraad over de werkzaamheden, waarbij in ieder geval aandacht
      wordt geschonken aan de wezenskenmerken van het openbaar onderwijs. Het verslag wordt openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel40a
  - number: 40a.6
    text: |-
      De vergaderingen van het bestuur van het openbaar orgaan zijn openbaar, tenzij het bestuur anders beslist, op
      gronden vermeld in de eilandsverordening.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel40a
  - number: 40a.7
    text: |-
      Indien voor 1 februari van het jaar waarvoor de begroting geldt de begroting niet is goedgekeurd, neemt de
      eilandsraad de maatregelen die hij nodig acht om de continuïteit van het onderwijsproces te waarborgen.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel40a
  - number: 40a.8
    text: |-
      De eilandsraad is in geval van ernstige taakverwaarlozing door het bestuur of functioneren in strijd met de wet- en
      regelgeving bevoegd zelf te voorzien in het bestuur van de scholen en zo nodig het openbaar orgaan te ontbinden.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel40a
  - number: '41'
    text: |-
      De openbare scholen zijn, met inachtneming van de krachtens [artikel 29][ref1] vastgestelde voorschriften, voor
      alle leerlingen zonder onderscheid toegankelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel29
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0028424
        artikel: '29'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '42.1'
    text: Het onderwijs aan openbare scholen wordt gegeven met eerbiediging van ieders geloofs- of levensovertuiging.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel42
  - number: '42.2'
    text: |-
      Onze Minister kan hem die zich in dit opzicht aan plichtsverzuim schuldig maakt, voor ten hoogste een jaar en bij
      herhaling voor onbepaalde tijd in zijn bevoegdheid tot het geven van onderwijs aan een openbare school schorsen.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel42
  - number: '43.1'
    text: De benoeming en de overplaatsing van rectoren en directeuren geschieden door het bestuurscollege.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel43
  - number: '43.2'
    text: |-
      De benoeming van leraren geschiedt door het bestuurscollege na ingewonnen bericht van de rector of de directeur van
      de school waaraan de benoeming zal geschieden.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel43
  - number: '43.3'
    text: |-
      De overplaatsing van leraren en de benoeming van de conrectoren of adjunct-directeuren geschieden door het
      bestuurscollege na ingewonnen bericht van de rectoren of directeuren van de desbetreffende scholen.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel43
  - number: '44.1'
    text: |-
      Aan elke openbare school voor voortgezet onderwijs is, behoudens door Onze Minister te verlenen ontheffing, een
      oudercommissie verbonden.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel44
  - number: '44.2'
    text: |-
      De inrichting, de wijze van verkiezing van de leden en de bevoegdheden van de oudercommissie worden geregeld bij
      algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel44
  - number: '45'
    text: |-
      Bij de vaststelling van het lesrooster wordt door het vrijgeven van uitdrukkelijk in dat rooster vermelde
      uren gezorgd, dat de leerlingen waarvan de ouders, voogden of verzorgers daartoe de wens te kennen geven in
      de schoollokalen of elders godsdienstonderwijs kunnen ontvangen. De voor het godsdienstonderwijs bestemde uren
      vallen binnen de schooltijd en worden voor elke school door de rector of de directeur van de school vastgesteld
      in overeenstemming met hen die door de besturen der kerkgenootschappen voor die school met het geven van
      godsdienstonderwijs worden belast.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel45
  - number: '46.1'
    text: |-
      Indien binnen redelijke afstand van de woning van de leerling niet de gelegenheid bestaat tot het volgen van
      onderwijs aan een openbare school, mag aan deze leerling de toegang tot een gelijksoortige uit de openbare kas
      bekostigde bijzondere school niet worden geweigerd op grond van levensbeschouwing, tenzij de school uitsluitend
      bestemd is voor interne leerlingen.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel46
  - number: '46.2'
    text: |-
      Indien tot een bijzondere school andere leerlingen worden toegelaten dan voor wie de school in verband met de
      levensbeschouwing wordt in stand gehouden, kunnen deze leerlingen niet worden verplicht tot het volgen van de
      lessen in de vakken die in verband met die levensbeschouwing aan het schoolwerkplan zijn toegevoegd.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel46
  - number: '47.1'
    text: |-
      De bijzondere school staat onder het bestuur van een stichting of van een vereniging met volledige
      rechtsbevoegdheid of instelling die zich het geven van onderwijs ten doel stelt zonder daarbij het maken van winst
      te beogen.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel47
  - number: '47.2'
    text: Het aan de school verbonden personeel maakt geen deel uit van het schoolbestuur.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel47
  - number: '47.3'
    text: Het schoolbestuur draagt zorg voor een deskundig beheer.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel47
  - number: '48.1'
    text: |-
      Het schoolbestuur stelt, behoudens door Onze Minister te verlenen ontheffing, de ouders, voogden en verzorgers van
      de leerlingen in de gelegenheid een oudercommissie te vormen.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel48
  - number: '48.2'
    text: |-
      De inrichting, de wijze van verkiezing van de leden en de bevoegdheid van de oudercommissie worden door het
      schoolbestuur zoveel mogelijk in overeenstemming met de bepalingen van de algemene maatregel van bestuur, bedoeld
      in [artikel 44, tweede lid][ref1], geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel44
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0028424
        artikel: '44'
        hoofdstuk: II
        afdeling: I
  - number: '49.1'
    text: |-
      De rector, de directeur, de leraren en het overige personeel, bedoeld in [artikel 38, eerste lid][ref1], van de
      bijzondere school zijn in het bezit van een door het schoolbestuur en door henzelf ondertekende akte van benoeming.
      Het schoolbestuur zendt een afschrift van deze akte aan de inspectie.


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel38
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0028424
        artikel: '38'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: '49.2'
    text: |-
      De akte van benoeming bevat ten minste de bepaling of de benoeming in vaste of in tijdelijke dienst geschiedt,
      alsmede de bepaling dat de voorschriften betreffende de materiële rechtspositie van het personeel, werkzaam bij het
      openbaar onderwijs, van overeenkomstige toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel49
  - number: '50'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel50
  - number: '51'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel51
  - number: '52.1'
    text: |-
      Voortgezet onderwijs mag slechts worden gegeven door hem die in het bezit is van een bij of krachtens wet
      aangewezen bewijs van bekwaamheid of enig ander bewijs waaruit blijkt, dat hij voldoende geschikt is voor het door
      hem te geven onderwijs.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel52
  - number: '52.2'
    text: |-
      Met betrekking tot het niet uit de openbare kas bekostigd voortgezet onderwijs zijn de [artikelen 30][ref1],
      [31][ref2], [35, eerste lid onder c en d][ref3], en [40][ref4] mede van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0028424#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0028424#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0028424#Artikel40
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0028424
        artikel: '30'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
