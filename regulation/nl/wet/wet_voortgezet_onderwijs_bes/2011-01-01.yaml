  - number: '10.1'
    text: |-
      Het onderwijs aan de dagscholen, bedoeld in de [artikelen 7 tot en met 9][ref1] , vangt aan met een periode van
      basisvorming, die twee leerjaren beslaat.


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel7
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel10
