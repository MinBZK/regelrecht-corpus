  - number: '55.2'
    text: Bij wijziging van het schoolwerkplan doet het schoolbestuur daarvan onmiddellijk mededeling aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel55
  - number: '55.3'
    text: |-
      Onze Minister kan ten behoeve van de bijzondere inrichting van het onderwijs aan de school goedkeuren, dat wordt
      afgeweken van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel55
  - number: '55.4'
    text: De naam van de school duidt aan, met welke van de uit de openbare kas bekostigde scholen zij overeenkomt.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel55
  - number: '55.5'
    text: |-
      De voorwaarden voor de toelating tot de school zijn ten minste gelijk aan die, vastgesteld krachtens
      [artikel 29][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel29
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0028424
        artikel: '29'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '55.6'
    text: |-
      De [artikelen 35][ref1] en [40][ref2] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0028424#Artikel40
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0028424
        artikel: '35'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0028424
        artikel: '40'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: '56'
    text: |-
      Onze Minister kan bij met redenen omklede beschikking de aanwijzing intrekken, indien niet langer wordt voldaan aan
      de [artikelen 53][ref1] en [55][ref2] of indien van misbruik van de verleende aanwijzing is gebleken.


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0028424#Artikel55
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0028424
        artikel: '53'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0028424
        artikel: '55'
        afdeling: II
  - number: '57.1'
    text: |-
      Jaarlijks wordt gelegenheid gegeven om door het met gunstig gevolg afleggen van een landsexamen voor een door Onze
      Minister in te stellen commissie een akte van bekwaamheid of een diploma te verkrijgen, overeenkomende met een akte
      van bekwaamheid of een diploma van een school, als bedoeld in [artikel 32, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel32
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0028424
        artikel: '32'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
  - number: '57.2'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald, welke andere diploma’s kunnen worden verkregen door het met
      gunstig gevolg afleggen van een landsexamen voor een door Onze Minister in te stellen commissie.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel57
  - number: '57.3'
    text: De landsexamens zijn openbaar, behoudens het schriftelijke gedeelte.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel57
  - number: '57.4'
    text: |-
      Bij algemene maatregel van bestuur worden nadere voorschriften gegeven voor de in dit artikel bedoelde examens, die
      niet voor alle kandidaten dezelfde vakken behoeven te omvatten. Daarbij kan worden bepaald het bedrag dat voor de
      toelating tot deze examens verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel57
  - number: '58'
    text: |-
      Deze titel is mede van toepassing op de afdelingen, opleidingen en cursussen, verbonden aan scholen, en op
      afzonderlijke cursussen.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel58
  - number: '59.1'
    text: |-
      De eilandsraad kan op aanvraag van het bevoegd gezag een school voor bekostiging in aanmerking brengen indien
      er sprake is van voldoende behoefte aan die school. Bij inwilliging van de aanvraag ontstaat de aanspraak op
      bekostiging met ingang van het schooljaar volgend op de inwilliging, dan wel een eerder door de eilandsraad vast te
      stellen moment.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel59
  - number: '59.2'
    text: |-
      Bij eilandsverordening wordt vastgesteld de wijze waarop de in het eerste lid bedoelde behoefte wordt bepaald, en
      worden voorschriften gegeven met betrekking tot de indiening en behandeling van aanvragen om bekostiging op grond
      van het eerste lid. Bij het vaststellen van deze voorschriften geldt als uitgangspunt dat op de aanvraag wordt
      beslist binnen negen maanden na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel59
  - number: '60.1'
    text: 'De vergoeding heeft ten minste betrekking op:'
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel60
  - number: 60.1.a
    text: personeelskosten zoals onder meer salarissen en nascholing, en
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel60
  - number: 60.1.b
    text: |-
      exploitatiekosten zoals onder meer onderhoud en vervanging van inventaris, onderhoud van gebouwen en terreinen,
      energie, water.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel60
  - number: '60.2'
    text: De vergoeding is toereikend met het oog op een goede verzorging van het voortgezet onderwijs.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel60
  - number: '60.3'
    text: 'Bij eilandsverordening worden voor zover van toepassing geregeld:'
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel60
  - number: 60.3.a
    text: de gevallen waarin de niet in het eerste lid genoemde kostensoorten voor vergoeding in aanmerking komen;
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel60
  - number: 60.3.b
    text: de wijze waarop vergoedingen als bedoeld in het eerste lid worden berekend;
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel60
  - number: 60.3.c
    text: de voorwaarden waaronder een vergoeding als bedoeld in het derde lid kan worden toegekend;
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel60
  - number: 60.3.d
    text: |-
      de wijze waarop de vergoedingen beschikbaar worden gesteld aan de bevoegde gezagsorganen, daaronder in elk geval
      begrepen regels over de betalingswijze, de betalingstermijnen, voor zover van toepassing de bevoorschotting en het
      al dan niet mede voor andere, alsdan aan te wijzen doeleinden mogen aanwenden van de vergoedingen, en
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel60
  - number: 60.3.e
    text: de verantwoording van de rechtmatigheid van de aanwending van de vergoedingen.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel60
  - number: '60.4'
    text: |-
      Vooruitlopend op een wijziging van het eerste lid, kunnen bij algemene maatregel van bestuur kostensoorten worden
      aangewezen waarop de vergoeding eveneens betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel60
  - number: '61.1'
    text: |-
      De eilandsraad kan besluiten dat een school niet meer voor bekostiging in aanmerking komt, indien niet langer
      sprake is van voldoende behoefte aan die school. De wijze waarop wordt vastgesteld dat niet langer sprake is van
      voldoende behoefte, wordt geregeld bij eilandsverordening.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel61
  - number: '61.2'
    text: |-
      In geval van een beslissing als bedoeld in het eerste lid, vervalt de aanspraak op bekostiging voor een school
      op een nader door de eilandsraad te bepalen tijdstip, welk tijdstip in elk geval samenvalt met het einde van een
      schooljaar.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel61
  - number: '62'
    text: |-
      Het bevoegd gezag van een bijzondere school geeft het bestuurscollege alle inlichtingen die het voor de toepassing
      van deze titel verlangt.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel62
  - number: 63 t/m 101
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel63_tm_101
  - number: '102'
    text: 'Deze wet wordt aangehaald als: Wet voortgezet onderwijs BES.'
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel102
  - number: '103'
    text: 'Deze wet is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel103
  - number: 103.a
    text: |-
      opleidingen ter vergroting der vakbekwaamheid die uitsluitend worden gegeven binnen overheids- of semi-
      overheidsdiensten en -bedrijven ten behoeve van het eigen personeel;
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel103
  - number: 103.b
    text: andere bij algemene maatregel van bestuur aan te wijzen leergangen of cursussen voor beroepsonderwijs
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel103
  - number: '104'
    text: |-
      Bij twijfel of deze wet op een of meer inrichtingen van onderwijs van toepassing is, beslist Onze Minister, de Raad
      van Advies gehoord.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel104
  - number: '105'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel105
  - number: '106'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel106
  - number: '107'
    text: |-
      Als bevoegd tot het geven van voortgezet onderwijs wordt tevens aangemerkt hij die tot aan de inwerkingtreding van
      de Landsverordening onderwijs heeft gegeven in een vak waarvoor hij niet beschikt over een daartoe in de bijlage
      van de Landsverordening genoemd bewijs van bekwaamheid, indien hij ingevolge de tot bedoelde inwerkingtreding
      geldende voorschriften als daartoe bevoegd is aangemerkt.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel107
  - number: 108 t/m 112
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel108_tm_112
