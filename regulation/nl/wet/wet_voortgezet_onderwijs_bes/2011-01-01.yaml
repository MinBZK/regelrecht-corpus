  - number: '10.2'
    text: |-
      Gedurende de periode van basisvorming wordt onderwijs gegeven in de vakken Nederlandse taal, Engelse taal,
      Spaanse taal, mens en maatschappij, wiskunde, informatiekunde, mens en natuur, techniek, verzorging, lichamelijke
      opvoeding, begeleidingslessen en ten minste twee van de vakken muziek, drama en beeldende vorming. In het openbare
      lichaam Bonaire wordt tevens onderwijs gegeven in het vak Papiamentu.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel10
  - number: '10.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen voorwaarden worden gesteld waaronder een leerling wordt vrijgesteld van
      één of meer van de in het tweede lid genoemde vakken.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel10
  - number: '10.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen voorwaarden worden gesteld omtrent het geven van onderwijs in de Franse
      of Duitse taal.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel10
  - number: '10.5'
    text: |-
      Ten aanzien van de vakken, genoemd in het tweede lid, worden telkens voor een periode van ten hoogste vijf jaar bij
      algemene maatregel van bestuur kerndoelen vastgesteld. Vaststelling van kerndoelen voor een volgende periode vindt
      plaats met inachtneming van een door Onze Minister verrichte evaluatie van de geldende kerndoelen.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel10
  - number: 10a.1
    text: |-
      Het onderwijs aan de scholen voor voorbereidend wetenschappelijk onderwijs en aan scholen voor hoger
      algemeen voortgezet onderwijs omvat aansluitend op de periode van de basisvorming een éénjarige periode van
      profielvoorbereidend onderwijs.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel10a
  - number: 10a.2
    text: 'Het profielvoorbereidend onderwijs omvat:'
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel10a
  - number: 10a.2.a
    text: |-
      Nederlandse taal, Engelse taal, Spaanse taal, Franse of Duitse taal, algemene sociale wetenschappen, wiskunde,
      algemene natuurwetenschappen, culturele en artistieke vorming, lichamelijke opvoeding, studiekeuzebegeleiding, en
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel10a
  - number: 10a.2.b
    text: voor de leerlingen in het openbare lichaam Bonaire het vak Papiamentu;
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel10a
  - number: 10a.3
    text: |-
      Bij algemene maatregel van bestuur, kunnen nadere regels ten aanzien van de vakken Spaanse taal, algemene sociale
      wetenschappen, algemene natuurwetenschappen en culturele en artistieke vorming worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel10a
  - number: 10b.1
    text: |-
      Het onderwijs aan scholen voor voorbereidend wetenschappelijk onderwijs respectievelijk voor hoger algemeen
      voortgezet onderwijs omvat aansluitend op de periode van profielvoorbereidend onderwijs een driejarige
      respectievelijk tweejarige periode van profielenonderwijs.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel10b
  - number: 10b.2
    text: |-
      De periode van profielenonderwijs is ingericht volgens profielen. Een profiel is een samenhangend
      onderwijsprogramma, zodanig ingericht dat het biedt:
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel10b
  - number: 10b.2.a
    text: een algemene maatschappelijke voorbereiding en persoonlijke vorming,
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel10b
  - number: 10b.2.b
    text: een algemene voorbereiding op het hoger onderwijs, en
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel10b
  - number: 10b.2.c
    text: een bijzondere voorbereiding op groepen van naar inhoud verwante opleidingen in het hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel10b
  - number: 10b.3
    text: 'De school verzorgt al dan niet in samenwerking met andere scholen alle profielen. De profielen zijn:'
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel10b
  - number: 10b.3.a
    text: het profiel cultuur en maatschappij
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel10b
  - number: 10b.3.b
    text: het profiel economie en maatschappij
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel10b
  - number: 10b.3.c
    text: het profiel natuur en techniek
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel10b
  - number: 10b.3.d
    text: het profiel natuur en gezondheid.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel10b
  - number: 10b.4
    text: 'Elk profiel bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel10b
  - number: 10b.4.a
    text: een gemeenschappelijk deel, dat voor alle profielen van de desbetreffende schoolsoort gelijk is,
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel10b
  - number: 10b.4.b
    text: een profieldeel, dat kenmerkend is voor dat profiel, en
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel10b
  - number: 10b.4.c
    text: een vrij deel.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel10b
  - number: 10b.5
    text: |-
      Het bevoegd gezag richt het onderwijs in de periode van profielenonderwijs in op de grondslag van een normatieve
      studielast voor de leerling van 1600 uren per leerjaar, uitgaande van 40 weken met elk een normatieve studielast
      van 40 uren. Het bevoegd gezag richt een in schooltijd verzorgd onderwijsprogramma in dat voor elke leerling ten
      minste 1000 uren onderwijs omvat per leerjaar, onverminderd [artikel 10e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel10e
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel10b
    references:
      - id: ref1
