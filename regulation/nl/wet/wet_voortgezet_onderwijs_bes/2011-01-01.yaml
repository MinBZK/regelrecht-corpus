  - number: '1'
    text: |-
      Deze wet verstaat onder: - *Onze Minister:* Onze Minister van Onderwijs, Cultuur en Wetenschap;
        - *school:* een school voor voortgezet onderwijs, tenzij het tegendeel blijkt;
        - *openbare school:* door een openbaar lichaam dan wel een openbare rechtspersoon als bedoeld in
      [artikel 40a][ref1], in stand gehouden school;
        - *bijzondere school:* een door een natuurlijke persoon of door een privaatrechtelijke rechtspersoon in stand
      gehouden school;
        - *bevoegd gezag:* voor wat betreft a. een openbare school: 1°. het bestuurscollege van het desbetreffende openbaar
      lichaam of 2°. het openbare orgaan, bedoeld in [artikel 40a][ref2]; b. een bijzondere school: het schoolbestuur;
        - *instructietaal:* de taal die op een school gehanteerd wordt bij zowel de mondelinge als schriftelijke
      kennisoverdracht en bij alle toets- en examenopgaven;
        - *inspectie:* de inspectie, bedoeld in de [Wet op het onderwijstoezicht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel40a
      [ref2]: https://wetten.overheid.nl/BWBR0028424#Artikel40a
      [ref3]: https://wetten.overheid.nl/BWBR0013800
