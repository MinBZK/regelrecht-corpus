        paragraaf: '3'
        afdeling: I
  - number: '53.1'
    text: |-
      Onze Minister kan de school die ten aanzien van de duur van de cursus, het schoolwerkplan en de bevoegdheden van
      de leraren overeenkomt met een school voor voorbereidend wetenschappelijk onderwijs, voor hoger algemeen voortgezet
      onderwijs, voor middelbaar algemeen voortgezet onderwijs, voor voorbereidend secundair beroepsonderwijs., of voor
      hoger beroepsonderwijs als bedoeld in [artikel 32, eerste en tweede lid][ref1], aanwijzen als bevoegd om aan de
      leerlingen op grond van het met gunstig gevolg afleggen van een eindexamen aan de school het diploma uit te reiken,
      bedoeld in het vierde lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel32
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0028424
        artikel: '32'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
  - number: '53.2'
    text: |-
      [Artikel 32, derde en vijfde lid][ref1], is op dit eindexamen van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel32
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0028424
        artikel: '32'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
  - number: '54'
    text: |-
      De aanwijzing geschiedt op een daartoe tot Onze Minister gericht verzoek van het schoolbestuur. Bij het verzoek
      worden overgelegd:
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel54
  - number: 54.a
    text: het schoolwerkplan van de school;
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel54
  - number: 54.b
    text: |-
      een opgave van de bewijzen van bekwaamheid en van voldoende pedagogische en didactische voorbereiding van de
      leraren;
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel54
  - number: 54.c
    text: de statuten en het reglement van de stichting, vereniging of instelling die de school in stand houdt.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel54
  - number: '55.1'
    text: |-
      Het schoolwerkplan van een ingevolge [artikel 53][ref1] aangewezen school voldoet ten minste aan de voorschriften
      van artikel gegeven bij of krachtens [artikelen 10][ref2], [10a tot en met 10e][ref3], [11][ref4], [11a][ref5],
      [21][ref6] en [23][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0028424#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0028424#Artikel10a
      [ref4]: https://wetten.overheid.nl/BWBR0028424#Artikel11
      [ref5]: https://wetten.overheid.nl/BWBR0028424#Artikel11a
      [ref6]: https://wetten.overheid.nl/BWBR0028424#Artikel21
      [ref7]: https://wetten.overheid.nl/BWBR0028424#Artikel23
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel55
