    text: |-
      Het voortgezet onderwijs omvat het onderwijs, dat wordt gegeven na het funderend onderwijs, met uitzondering van
      het onderwijs geregeld in de [Wet educatie en beroepsonderwijs BES][ref1] en de Landsverordening Universiteit
      Nederlandse Antillen (P.B. 1985, no. 43).


      [ref1]: https://wetten.overheid.nl/BWBR0028395
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0028395
  - number: '4'
    text: |-
      Bij algemene maatregel van bestuur worden de onderwerpen aangewezen waarover aan de bestuurscolleges van de
      openbare lichamen en aan organisaties van ouders, van leraren of van schoolbesturen dan wel aan twee of meer
      van deze groepen, die zich de behartiging van de belangen van een of meer vormen van voortgezet onderwijs ten
      doel stellen, de gelegenheid wordt gegeven Onze Minister van advies te dienen. Aan die organisaties wordt deze
      gelegenheid uitsluitend verleend, indien zij naar het oordeel van Onze Minister voldoende representatief zijn.
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel4
  - number: '5'
    text: 'Het voortgezet onderwijs wordt onderscheiden in:'
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel5
  - number: 5.a
    text: voorbereidend wetenschappelijk onderwijs;
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel5
  - number: 5.b
    text: hoger algemeen voortgezet onderwijs;
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel5
  - number: 5.c
    text: voorbereidend secundair beroepsonderwijs;
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel5
  - number: 5.d
    text: middelbaar en hoger beroepsonderwijs;
    url: https://wetten.overheid.nl/BWBR0028424/2011-01-01#Artikel5
