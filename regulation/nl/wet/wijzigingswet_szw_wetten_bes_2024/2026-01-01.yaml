preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om enige wijzigingen aan te brengen in de wetgeving van
    het Ministerie van Sociale Zaken en Werkgelegenheid die gelding heeft in Caribisch Nederland, teneinde rechten en
    aanspraken van werkenden en nagelaten betrekkingen te verduidelijken en te verbeteren, onder meer op het terrein
    van verlof en vakantie, kinderbijslag, ziekte, ouderdom en overlijden;

    Zo is het dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-Generaal,
    hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0050791/2026-01-01#ArtikelAanhef
articles:
  - number: X
    text: |-
      1 Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.

      2 In afwijking van het eerste lid treedt [artikel VI, onderdelen Ba, F, en Na][ref1], in werking met ingang van de
      dag na de datum van uitgifte van het Staatsblad waarin deze wet wordt geplaatst en werkt terug tot en met 1 juli
      2024.


