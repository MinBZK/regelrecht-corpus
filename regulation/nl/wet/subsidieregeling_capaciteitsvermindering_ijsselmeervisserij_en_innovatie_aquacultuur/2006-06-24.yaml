$id: subsidieregeling_capaciteitsvermindering_ijsselmeervisserij_en_innovatie_aquacultuur
regulatory_layer: WET
publication_date: '2007-11-23'
valid_from: '2006-06-24'
bwb_id: BWBR0011535
url: https://wetten.overheid.nl/BWBR0011535/2006-06-24
preamble:
  text: |-
    Gelet op de artikelen 2 en 4 van de Kaderwet LNV-subsidies,

    Besluit:
  url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a
             minister:

              Minister van Landbouw, Natuur en Voedselkwaliteit;



            b
             IJsselmeervisserij:

              visserij in het IJsselmeer met gebruikmaking van een publiekrechtelijke en een privaatrechtelijke
      vergunning;



            c
            Dienst Regelingen:

              Dienst Regelingen van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;



            d
             publiekrechtelijke vergunning:

              vergunning als bedoeld in artikel 8 van het Reglement voor de binnenvisserij 1985;



            e
             privaatrechtelijke vergunning:

              vergunning als bedoeld in [artikel 21, tweede lid, onderdeel a, van de Visserijwet 1963][ref1], geldend
      voor de visserij in het IJsselmeer;



            f
            merk:

              door of vanwege de minister verstrekt, bij een publiekrechtelijke vergunning behorend merkteken;



            g
             aaleenheid:

              rekeneenheid ter bepaling van het totaalbedrag aan subsidie voor alle merkjes tezamen waarvan de aanvrager
      aan de minister afstand doet;



            h

              [verordening (EG) nr. 2792/1999](31999R2792);

              [verordening (EG) nr. 2792/1999](31999R2792) van de Raad van 17 december 1999 tot vaststelling van de
      uitvoeringsbepalingen en voorwaarden voor de structurele acties van de Gemeenschap in de visserijsector (PbEG
      L 337);



            i
            aquacultuur:

              aquacultuur als bedoeld in bijlage III, onderdeel 2.2 van [verordening (EG) nr. 2792/1999](31999R2792);



            j
            ondernemer:

              natuurlijk persoon of privaatrechtelijke rechtspersoon, die voor eigen rekening en risico een bedrijf
      uitoefent of voornemens is uit te oefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel21
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '21'
  - number: '2'
    text: 'De minister kan op aanvraag subsidie verstrekken ter zake van:'
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel2
  - number: 2.a
    text: de vermindering van de IJsselmeervisserij, of
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel2
  - number: 2.b
    text: de definitieve beëindiging van de IJsselmeervisserij.
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel2
  - number: '3.1'
    text: Een aanvraag kan worden ingediend in de periode van 24 april 2006 tot en met 22 mei 2006.
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel3
  - number: '3.2'
    text: Voor de aanvraagperiode, bedoeld in het eerste lid, bedraagt het subsidieplafond € 2.442.750,–.
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel3
  - number: '4'
    text: 'De subsidie ter zake van de vermindering van de IJsselmeervisserij wordt slechts verleend indien de aanvrager:'
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel4
  - number: 4.a
    text: |-
      over een publiekrechtelijke vergunning en een privaatrechtelijke vergunning beschikt waarmee gedurende het gehele
      jaar de IJsselmeervisserij kan worden uitgeoefend, welke beide op zijn naam staan en op hetzelfde vissersvaartuig
      betrekking hebben, en
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel4
  - number: 4.b
    text: |-
      ter zake van één of meer grote fuiken, schietfuiken of staande netten afstand doet van het recht de
      IJsselmeervisserij te beoefenen door bij de minister de aan deze vistuigen bevestigde merken waarover hij blijkens
      de bijlage bij de in onderdeel a genoemde publiekrechtelijke vergunning op het tijdstip van de subsidieaanvraag
      permanent beschikte, in te leveren.
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel4
  - number: '5'
    text: |-
      De subsidie ter zake van de definitieve beëindiging van de IJsselmeervisserij wordt slechts verleend indien de
      aanvrager:
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel5
  - number: 5.a
    text: |-
      over een publiekrechtelijke en een privaatrechtelijke vergunning beschikt waarmee de IJsselmeervisserij kan worden
      uitgeoefend, welke beide op zijn naam staan en op hetzelfde vissersvaartuig betrekking hebben, en
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel5
  - number: 5.b
    text: |-
      de IJsselmeervisserij definitief beëindigt door aan de minister voorgoed afstand te doen van: - zijn
      publiekrechtelijke vergunning, genoemd in onderdeel a;
        - zijn privaatrechtelijke vergunning, genoemd in onderdeel a, indien deze door de minister is verleend, en
        - het totale aantal merken waarover hij blijkens de bijlage bij de in onderdeel a genoemde publiekrechtelijke
      vergunning op het tijdstip van de subsidieaanvraag permanent beschikte, dan wel, indien dit aantal hoger is, het
      totale aantal merken waarover hij blijkens de bijlage bij de in onderdeel a genoemde publiekrechtelijke vergunning
      op 10 april 2006 permanent kon beschikken.
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel5
  - number: '6.1'
    text: |-
      De subsidie ter zake van de vermindering van de IJsselmeervisserij bedraagt een totaalbedrag voor alle aan de grote
      fuiken, schietfuiken en staande netten bevestigde merken tezamen waarvan de aanvrager aan de minister afstand doet,
      waarvan de hoogte wordt bepaald door die merken volgens de tabel in de bijlage om te rekenen in aaleenheden en de
      som van die aaleenheden te vermenigvuldigen met het bedrag, bedoeld in [artikel 7, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011535#Artikel7
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011535
        artikel: '7'
        paragraaf: '2'
  - number: '6.2'
    text: |-
      De subsidie ter zake van de definitieve beëindiging van de IJsselmeervisserij, bedoeld in [artikel 5][ref1],
      bedraagt:


      [ref1]: https://wetten.overheid.nl/BWBR0011535#Artikel5
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011535
        artikel: '5'
        paragraaf: '2'
  - number: 6.2.a
    text: |-
      een bedrag voor de, op naam van de aanvrager staande, publiekrechtelijke vergunning, waarvan de aanvrager aan de
      minister afstand doet, - van € 15.000,– indien de som van de aaleenheden, berekend op de in onderdelen b en c van
      dit artikellid bedoelde wijze, 300 of minder bedraagt;
        - van € 25.000,– indien de som van de aaleenheden, berekend op de in onderdelen b en c van dit artikellid bedoelde
      wijze, meer dan 300 maar minder dan 601 bedraagt;
        - van € 35.000,– indien de som van de aaleenheden, berekend op de in onderdelen b en c van dit artikellid bedoelde
      wijze, meer dan 600 maar minder dan 1001 bedraagt;
        - van € 45.000,– indien de som van de aaleenheden, berekend op de in onderdelen b en c van dit artikellid bedoelde
      wijze, meer dan 1000 bedraagt;
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel6
  - number: 6.2.b
    text: |-
      een totaalbedrag voor alle op of aan de grote fuik, schietfuik of staande netten bevestigde merken tezamen waarvan
      de aanvrager aan de minister afstand doet, waarvan de hoogte wordt bepaald door die merken volgens de tabel in de
      bijlage om te rekenen in aaleenheden, de som van die aaleenheden te berekenen en deze som te vermenigvuldigen met
      het bedrag, bedoeld in [artikel 7, vierde lid, eerste streepje][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011535#Artikel7
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011535
        artikel: '7'
        paragraaf: '2'
  - number: 6.2.c
    text: |-
      een totaalbedrag voor alle aan de spieringfuik en aalkistjes bevestigde merken tezamen waarvan de aanvrager
      aan de minister afstand doet, waarvan de hoogte wordt bepaald door die merken volgens de tabel in de bijlage
      om te rekenen in aaleenheden, de som van die aaleenheden te berekenen, en deze som te vermenigvuldigen
      met het bedrag, bedoeld in [artikel 7, vierde lid, tweede streepje][ref1]. Spieringmerken die op grond van
      [artikel 8 van het Reglement voor de binnenvisserij 1985][ref2] zijn uitgegeven in de periode van 14 november 2005
      tot en met 2 december 2005 komen niet voor subsidie in aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0011535#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0009027#Artikel8
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011535
        artikel: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009027
        artikel: '8'
  - number: '6.3'
    text: |-
      De berekening van de som van de aaleenheden, bedoeld in onderdeel a, vindt plaats op grond van het totale
      aantal merken waarover de aanvrager op het tijdstip van de subsidieaanvraag blijkens de bijlage bij zijn
      publiekrechtelijke vergunning permanent beschikte, dan wel, indien dit aantal lager is, het totale aantal merken
      waarover hij op 10 april 2006 blijkens de bijlage bij zijn publiekrechtelijke vergunning permanent kon beschikken.
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel6
  - number: '7.1'
    text: |-
      De aanvraag, bedoeld in [artikel 2][ref1], wordt ingediend bij de Dienst Regelingen op een daartoe bestemd
      formulier, dat door de aanvrager volledig en naar waarheid wordt ingevuld en ondertekend.


      [ref1]: https://wetten.overheid.nl/BWBR0011535#Artikel2
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011535
        artikel: '2'
        paragraaf: '2'
  - number: '7.2'
    text: |-
      De aanvraag, bedoeld in [artikel 2][ref1], gaat vergezeld van een kopie van de desbetreffende, op naam van de
      aanvrager staande, publiekrechtelijke en privaatrechtelijke vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0011535#Artikel2
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011535
        artikel: '2'
        paragraaf: '2'
  - number: '7.3'
    text: |-
      Bij de aanvraag tot subsidie ter zake van de vermindering van de IJsselmeervisserij, bedoeld in
      [artikel 2, onderdeel a][ref1], verklaart de aanvrager bereid te zijn de IJsselmeervisserij te verminderen op de
      wijze, bedoeld in [artikel 4, onderdeel b][ref2], en doet hij een bieding, inhoudend het bedrag per aaleenheid,
      uitgedrukt in een percentage van € 300,–, waartegen hij bereid is aan de minister afstand te doen van zijn merken.


      [ref1]: https://wetten.overheid.nl/BWBR0011535#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011535#Artikel4
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011535
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011535
        artikel: '4'
        paragraaf: '2'
  - number: '7.4'
    text: |-
      Bij de aanvraag tot subsidie ter zake van de beëindiging van de IJsselmeervisserij, bedoeld in
      [artikel 2, onderdeel b][ref1], verklaart de aanvrager bereid te zijn de IJsselmeervisserij definitief te
      beëindigen op de wijze, bedoeld in [artikel 5, onderdeel b][ref2], en doet hij een bieding, inhoudende: - het
      bedrag per aaleenheid, uitgedrukt in een percentage van € 300,–, waartegen hij bereid is aan de minister afstand te
      doen van zijn aan de grote fuik, schietfuik of staande netten bevestigde merken;
        - het bedrag per aaleenheid, uitgedrukt in een percentage van € 200,–, waartegen hij bereid is aan de minister
      afstand te doen van zijn aan de spieringfuik of aalkistjes bevestigde merken.


      [ref1]: https://wetten.overheid.nl/BWBR0011535#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011535#Artikel5
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011535
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011535
        artikel: '5'
        paragraaf: '2'
  - number: '7.5'
    text: |-
      Het percentage, bedoeld in onderdeel 4, eerste streepje, moet gelijk zijn aan het percentage, bedoeld in onderdeel
      4, tweede streepje.
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel7
  - number: '7.6'
    text: De bieding, bedoeld in het derde en vierde lid, kan niet worden herroepen of gewijzigd.
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel7
  - number: '8'
    text: |-
      Onverminderd [artikel 4:5 van de Algemene wet bestuursrecht][ref1] wordt een aanvraag tot subsidie slechts
      in behandeling genomen indien op de publiekrechtelijke vergunning, op de privaatrechtelijke vergunning
      of op één of meer merken geen pandrecht is gevestigd en de aanvrager dat ook als zodanig overeenkomstig
      [artikel 7, eerste lid][ref2], op het aanvraagformulier heeft aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011535#Artikel7
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011535
        artikel: '7'
        paragraaf: '2'
  - number: 8a
    text: Een aanvraag om subsidie wordt niet in behandeling genomen indien;
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel8a
  - number: 8a.a
    text: per aanvraagperiode meer dan één aanvraag is ingediend door dezelfde aanvrager;
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel8a
  - number: 8a.b
    text: een aanvraag meer dan één bieding bevat;
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel8a
  - number: 8a.c
    text: aan de bieding voorwaarden zijn verbonden;
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel8a
  - number: 8a.d
    text: |-
      het percentage, bedoeld in de in [artikel 7, derde en vierde lid][ref1], bedoelde bieding, hoger is dan 100%, of


      [ref1]: https://wetten.overheid.nl/BWBR0011535#Artikel7
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0011535
        artikel: '7'
        paragraaf: '2'
  - number: 8a.e
    text: |-
      het percentage, bedoeld in [artikel 7, vierde lid, eerste streepje][ref1], niet gelijk is aan het percentage,
      bedoeld in [artikel 7, vierde lid, tweede streepje][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011535#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0011535#Artikel7
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0011535
        artikel: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011535
        artikel: '7'
        paragraaf: '2'
  - number: 8b
    text: |-
      Een aanvraag tot subsidie als bedoeld in [artikel 2][ref1] kan in ieder geval worden afgewezen indien er naar het
      oordeel van de minister ernstige aanwijzingen zijn dat de aanvrager ter zake van de aanvraag onderling afspraken
      heeft gemaakt met één of meer andere aanvragers.


      [ref1]: https://wetten.overheid.nl/BWBR0011535#Artikel2
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0011535
        artikel: '2'
        paragraaf: '2'
  - number: 8c
    text: |-
      Alle aanvragen tot subsidie ter zake van de vermindering van de IJsselmeervisserij, bedoeld in
      [artikel 2, onderdeel a][ref1], kunnen worden afgewezen indien het aandeel van deze aanvragen op het totale aantal
      van de in de onderdelen a en b bedoelde aanvragen gezamenlijk meer dan 50% bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0011535#Artikel2
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel8c
    references:
      - id: ref1
        bwb_id: BWBR0011535
        artikel: '2'
        paragraaf: '2'
  - number: '9.1'
    text: |-
      Voor zover het betreft niet reeds op grond van [artikel 8b][ref1] afgewezen aanvragen, beslist de minister
      gelijktijdig op de ingediende aanvragen aan de hand van een rangschikking waarbij telkenmale de hoogst
      gerangschikte aanvraag het eerst voor toewijzing in aanmerking komt.


      [ref1]: https://wetten.overheid.nl/BWBR0011535#Artikel8b
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011535
        artikel: 8b
        paragraaf: '2'
  - number: '9.2'
    text: 'De rangschikking vindt plaats volgens een systeem waarbij:'
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel9
  - number: 9.2.a
    text: |-
      aanvragen tot subsidie ter zake van de definitieve beëindiging van de IJsselmeervisserij hoger worden gerangschikt
      dan aanvragen tot subsidie ter zake van de vermindering van de IJsselmeervisserij;
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel9
  - number: 9.2.b
    text: |-
      aanvragen vervolgens hoger worden gerangschikt naarmate het percentage, genoemd in de bieding, bedoeld in
      [artikel 7, derde en vierde lid][ref1], lager is;


      [ref1]: https://wetten.overheid.nl/BWBR0011535#Artikel7
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011535
        artikel: '7'
        paragraaf: '2'
  - number: 9.2.c
    text: |-
      aanvragen vervolgens hoger worden gerangschikt naarmate het vistuig waarop de aanvraag betrekking heeft
      schadelijker is voor het ecosysteem, waarbij schietfuik worden geacht het meest schadelijk te zijn, gevolgd door
      staande netten, grote fuiken, spieringfuiken en aalkistjes;
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel9
  - number: 9.2.d
    text: aanvragen vervolgens hoger worden gerangschikt naarmate deze eerder zijn ontvangen door de Dienst Regelingen.
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel9
  - number: 9a.1
    text: |-
      De minister geeft binnen acht weken na het sluiten van de aanvraagperiode, bedoeld in
      [artikel 3, eerste lid][ref1], een beschikking omtrent subsidieverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0011535#Artikel3
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0011535
        artikel: '3'
        paragraaf: '2'
  - number: 9a.2
    text: |-
      Indien de termijn, bedoeld in het eerste lid, niet kan worden gehaald, stelt de minister de aanvrager daarvan in
      kennis en noemt hij daarbij een redelijke termijn waarop de beschikking tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel9a
  - number: 9b.1
    text: |-
      De ontvanger van de subsidie ter zake van het verminderen van de IJsselmeervisserij, bedoeld in [artikel 4][ref1],
      is verplicht van 25 september 2006 tot en met 7 oktober 2006 alle aan de grote fuiken, schietfuiken of staande
      netten bevestigde merken waarvan de aanvrager aan de minister afstand doet, bij het ministerie van Landbouw, Natuur
      en Voedselkwaliteit in te leveren.


      [ref1]: https://wetten.overheid.nl/BWBR0011535#Artikel4
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0011535
        artikel: '4'
        paragraaf: '2'
  - number: 9b.2
    text: |-
      De ontvanger van de subsidie ter zake van de beëindiging van de IJsselmeervisserij, bedoeld in [artikel 5][ref1],
      is verplicht van 25 september 2006 tot en met 7 oktober 2006 bij het Ministerie van Landbouw, Natuur en
      Voedselkwaliteit in te leveren:


      [ref1]: https://wetten.overheid.nl/BWBR0011535#Artikel5
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0011535
        artikel: '5'
        paragraaf: '2'
  - number: 9b.2.a
    text: |-
      zijn publiekrechtelijke vergunning, zijn privaatrechtelijke vergunning, indien deze door de minister is verleend,
      en het totale aantal merken waarover hij op het moment van de subsidie-aanvraag permanent beschikte, en
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel9b
  - number: 9b.2.b
    text: |-
      een door hem ondertekende verklaring op een daartoe vastgesteld formulier dat hij definitief afstand doet van alle
      rechten op toekenning van de in onderdeel a bedoelde vergunning en merken.
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel9b
  - number: 9c
    text: |-
      De minister stelt binnen vier weken na ontvangst van de in [artikel 9b][ref1] bedoelde bescheiden de subsidie
      overeenkomstig de subsidieverlening vast.


      [ref1]: https://wetten.overheid.nl/BWBR0011535#Artikel9b
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0011535
        artikel: 9b
        paragraaf: '2'
  - number: '11'
    text: |-
      Indien voor het afstand doen van het recht om met een aalvistuig de IJsselmeervisserij te beoefenen of voor
      de definitieve beëindiging van de IJsselmeervisserij met een vissersvaartuig reeds uit anderen hoofde een uit
      overheidsmiddelen bekostigde subsidie is of zal worden verstrekt, wordt deze subsidie in mindering gebracht op de
      op grond van deze regeling verkregen subsidie.
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel11
  - number: '12'
    text: |-
      Uiterlijk twee jaar na de inwerkingtreding van deze regeling wordt een verslag gepubliceerd over de
      doeltreffendheid en de effecten van de subsidie in de praktijk.
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12
  - number: 12a.1
    text: |-
      De minister kan ter stimulering van innovatie in aquacultuur op aanvraag subsidie verstrekken aan een ondernemer of
      een samenwerkingsverband van ondernemers voor projecten in de volgende categorieën:
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12a
  - number: 12a.1.a
    text: diversificatie van gekweekte soorten aquatische fauna;
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12a
  - number: 12a.1.b
    text: nieuwe productiemethoden voor schelpdierenkweek;
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12a
  - number: 12a.1.c
    text: |-
      modernisering van bestaande aquacultuurbedrijven gericht op een verbetering van de productkwaliteit of gericht op
      een verbetering van het welzijn van gekweekte vis;
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12a
  - number: 12a.1.d
    text: verbetering van de afzetmogelijkheden voor het gekweekte product.
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12a
  - number: 12b
    text: |-
      Een subsidie voor een project als bedoeld in [artikel 12a][ref1] wordt slechts verstrekt indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011535#Artikel12a
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0011535
        artikel: 12a
        paragraaf: '3'
  - number: 12b.a
    text: de subsidiabele kosten van het project voor ten minste 60% worden gefinancierd door de subsidieaanvrager;
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12b
  - number: 12b.b
    text: het project uiterlijk op 1 juni 2008 is uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12b
  - number: 12b.c
    text: binnen een jaar na de subsidieverlening een aanvang is gemaakt met de uitvoering van het project;
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12b
  - number: 12b.d
    text: de subsidiabele kosten van het project meer bedragen dan € 10.000,–;
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12b
  - number: 12b.e
    text: |-
      het project wordt uitgevoerd buiten een regio met doelstelling 1 als bedoeld in artikel 1 van [verordening (EG)
      nr. 1260/1999](31999R1260) van de Raad van de Europese Unie van 21 juni 1999 houdende algemene bepalingen inzake de
      Structuurfondsen (PbEG L 161);
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12b
  - number: 12b.f
    text: de financiering van het project gedekt is.
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12b
  - number: 12c.1
    text: |-
      Subsidie wordt niet verstrekt indien met de uitvoering van het project een aanvang is gemaakt alvorens de ontvangst
      van de subsidieaanvraag schriftelijk aan de aanvrager is bevestigd. Onder het maken van een aanvang wordt in ieder
      geval begrepen het aangaan van verplichtingen.
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12c
  - number: 12c.2
    text: 'Subsidie wordt niet verstrekt indien het project naar het oordeel van de minister:'
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12c
  - number: 12c.2.a
    text: bijdraagt aan een vergroting van de productie van forel, paling, meerval, zeebaars en zeebrasem;
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12c
  - number: 12c.2.b
    text: betrekking heeft op open intensieve kweeksystemen met een hoge nutriënteninput;
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12c
  - number: 12c.2.c
    text: betrekking heeft op siervissen;
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12c
  - number: 12c.2.d
    text: |-
      betrekking heeft op aquacultuur van dieren die niet mogen worden gehouden op grond van de Gezondheids- en
      welzijnswet voor dieren of het project in strijd is met overige wet- of regelgeving;
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12c
  - number: 12c.2.e
    text: |-
      betrekking heeft op projecten welke voorzien in het plaatsen van een mosselzaadvanginstallatie (MZI) in de
      Waddenzee of in de Oosterschelde.
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12c
  - number: 12d
    text: |-
      Tot de subsidiabele kosten van het project behoren uitsluitend de volgende kosten, voor zover zij naar het oordeel
      van de minister noodzakelijk zijn en rechtstreeks zijn toe te rekenen aan het project:
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12d
  - number: 12d.a
    text: kosten van apparatuur of voorzieningen;
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12d
  - number: 12d.b
    text: kosten van aankoop, bouw of modernisering van gebouwen;
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12d
  - number: 12d.c
    text: |-
      kosten van een accountantsverklaring als bedoeld in [artikel 12k, tweede lid, onderdeel b][ref1], voor zover deze
      niet meer bedragen dan € 2500,–;


      [ref1]: https://wetten.overheid.nl/BWBR0011535#Artikel12k
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12d
    references:
      - id: ref1
        bwb_id: BWBR0011535
        artikel: 12k
        paragraaf: '3'
  - number: 12d.d
    text: |-
      loonkosten, voor zover deze kosten betrekking hebben op personeel dat ten behoeve van het project is ingezet,
      berekend op basis van het brutojaarloon volgens de verzamelloonlijst van de betrokken medewerkers, exclusief
      volledige winstafhankelijke uitkeringen, verhoogd met de wettelijke dan wel op grond van een collectieve
      arbeidsovereenkomst verschuldigde opslagen voor sociale lasten, te delen door 1600;
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12d
  - number: 12d.e
    text: kosten van de door de aanvrager ten behoeve van het project verrichte arbeid, te waarderen tegen € 30,– per uur, en
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12d
  - number: 12d.f
    text: kosten voor architecten, ingenieurs en overige deskundigen, die uit hoofde van hun beroep adviezen verstrekken;
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12d
  - number: 12e
    text: |-
      De subsidie, bedoeld in [artikel 12a][ref1], bedraagt maximaal 40% van de subsidiabele kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0011535#Artikel12a
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12e
    references:
      - id: ref1
        bwb_id: BWBR0011535
        artikel: 12a
        paragraaf: '3'
  - number: 12f.1
    text: |-
      Op een aanvraag tot subsidieverlening als bedoeld in artikel 12a is artikel 7, eerste lid, van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12f
  - number: 12f.2
    text: |-
      Een aanvraag als bedoeld in het eerste lid gaat vergezeld van een projectplan waarin in ieder geval op een naar het
      oordeel van de minister kenbare wijze de volgende onderdelen zijn opgenomen:
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12f
  - number: 12f.2.a
    text: een beschrijving van de inhoud, de geografische locatie, de doelstellingen en de activiteiten van het project;
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12f
  - number: 12f.2.b
    text: een gespecificeerde begroting van de kosten;
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12f
  - number: 12f.2.c
    text: de wijze waarop het project wordt gefinancierd en uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12f
  - number: 12f.2.d
    text: de planning van de uitvoering;
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12f
  - number: 12f.2.e
    text: de financiële planning van de uitvoering.
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12f
  - number: 12f.3
    text: |-
      Indien de subsidie wordt aangevraagd door een samenwerkingsverband, gaat de aanvraag tevens vergezeld van het aan
      het samenwerkingsverband ten grondslag liggende samenwerkingscontract, met daarin in ieder geval een overzicht van
      de deelnemers aan het samenwerkingsverband alsmede van de verdeling van de verantwoordelijkheden, bevoegdheden en
      financiële verplichtingen tussen de verschillende deelnemers.
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12f
  - number: 12f.4
    text: |-
      Indien de subsidie wordt aangevraagd door een rechtspersoon dan wel een samenwerkingsverband waaraan één of meer
      rechtspersonen deelnemen, gaat de aanvraag tevens vergezeld van de statuten van de betrokken rechtspersoon of
      rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12f
  - number: 12g.1
    text: |-
      Een aanvraag als bedoeld in [artikel 12a][ref1] kan worden ingediend in de periode van 17 oktober 2005 tot en met
      28 november 2005.


      [ref1]: https://wetten.overheid.nl/BWBR0011535#Artikel12a
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12g
    references:
      - id: ref1
        bwb_id: BWBR0011535
        artikel: 12a
        paragraaf: '3'
  - number: 12g.2
    text: Voor de aanvraagperiode, bedoeld in het eerste lid, bedraagt het subsidieplafond € 1.920.000,–.
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12g
  - number: 12h.1
    text: 'De minister beoordeelt of en in welke mate het project:'
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12h
  - number: 12h.1.a
    text: innovatief is;
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12h
  - number: 12h.1.b
    text: economisch of technisch perspectief heeft;
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12h
  - number: 12h.1.c
    text: bijdraagt aan een duurzame aquacultuur.
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12h
  - number: 12h.2
    text: 'De minister stelt een rangschikking op van projecten, waarbij projecten:'
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12h
  - number: 12h.2.a
    text: |-
      hoger worden gerangschikt naarmate deze naar het oordeel van de minister meer voldoen aan de in het eerste lid,
      onderdelen a tot en met c, genoemde criteria;
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12h
  - number: 12h.2.b
    text: |-
      vervolgens hoger worden gerangschikt naarmate de financiële bijdrage van de aanvrager van het project of de
      financiële bijdrage van een ander bestuursorgaan dan de minister hoger is.
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12h
  - number: 12i
    text: |-
      De minister voorziet binnen vier maanden na afloop van de termijn, genoemd in [artikel 12g, eerste lid][ref1],
      in een gelijktijdige beslissing op de aanvragen aan de hand van de rangschikking, bedoeld in
      [artikel 12h, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011535#Artikel12g
      [ref2]: https://wetten.overheid.nl/BWBR0011535#Artikel12h
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12i
    references:
      - id: ref1
        bwb_id: BWBR0011535
        artikel: 12g
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0011535
        artikel: 12h
        paragraaf: '3'
  - number: 12j.1
    text: |-
      De subsidieontvanger voert het project uit overeenkomstig het projectplan, bedoeld in
      [artikel 12f, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011535#Artikel12f
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12j
    references:
      - id: ref1
        bwb_id: BWBR0011535
        artikel: 12f
        paragraaf: '3'
  - number: 12j.2
    text: 'Wijzigingen in het projectplan zijn toegestaan mits:'
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12j
  - number: 12j.2.a
    text: deze geen wijzigingen betreffen van de doelstelling van het project, en
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12j
  - number: 12j.2.b
    text: deze vooraf, na melding aan de Dienst Regelingen, zijn goedgekeurd door de minister.
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12j
  - number: 12j.3
    text: |-
      De minister deelt de subsidieontvanger mee of en in welke mate de wijziging van het projectplan gevolgen heeft voor
      de verleende subsidie of voor de bij de verlening van de subsidie vastgestelde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12j
  - number: 12j.4
    text: |-
      Een wijziging als bedoeld in het tweede lid heeft niet tot gevolg dat de subsidie wordt vastgesteld op een
      hoger bedrag dan het bedrag waarop de subsidie overeenkomstig de beschikking tot subsidieverlening, bedoeld in
      [artikel 12i][ref1], ten hoogste kan worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011535#Artikel12i
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12j
    references:
      - id: ref1
        bwb_id: BWBR0011535
        artikel: 12i
        paragraaf: '3'
  - number: 12j.5
    text: |-
      Indien het project langer duurt dan één jaar, rapporteert de subsidieontvanger elk jaar in de vorm van een
      tussenverslag over de voortgang van het project. Dit verslag bestaat ten minste uit een beschrijving van:
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12j
  - number: 12j.5.a
    text: de activiteiten die tot dan toe in het kader van het project zijn verricht, en
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12j
  - number: 12j.5.b
    text: de mate waarin deze activiteiten hebben bijgedragen aan de in het projectplan omschreven doestellingen.
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12j
  - number: 12j.6
    text: |-
      De subsidieontvanger voert een administratie die zodanig is ingericht dat daaruit naar het oordeel van de minister
      te allen tijde op eenvoudige en duidelijk wijze alle projectkosten kunnen worden afgelezen, gespecificeerd
      overeenkomstig de in [artikel 12d][ref1] onderscheiden subsidiabele kosten, met dien verstande dat ter zake
      van de loonkosten en de kosten voor eigen arbeid een door middel van een sluitende tijdschrijving vastgestelde
      urenverantwoording aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0011535#Artikel12d
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12j
    references:
      - id: ref1
        bwb_id: BWBR0011535
        artikel: 12d
        paragraaf: '3'
  - number: 12k.1
    text: |-
      Binnen drie maanden na afloop van de uitvoering van het project dient de subsidieontvanger een aanvraag tot
      subsidievaststelling in bij de Dienst Regelingen op een daartoe vastgesteld formulier.
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12k
  - number: 12k.2
    text: 'De aanvraag tot vaststelling van de subsidie gaat vergezeld van een eindverslag van het project dat bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12k
  - number: 12k.2.a
    text: |-
      een beschrijving van de activiteiten die in het kader van het project zijn verricht, de mate waarin deze
      activiteiten hebben bijgedragen aan de in het projectplan omschreven doelstellingen, de kennis en informatie die
      tijdens het project zijn opgedaan;
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12k
  - number: 12k.2.b
    text: |-
      een financiële verantwoording van het project, alsmede een verklaring van een accountant of een accountant-
      administratieconsulent als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1],
      waaruit blijkt dat is voldaan aan de in deze regeling neergelegde bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12k
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 12l
    text: |-
      De minister kan in het kader van de beleidsontwikkeling inzake aquacultuur gebruik maken van de kennis en
      informatie die tijdens het project zijn opgedaan en zijn neergelegd in het eindverslag, bedoeld in artikel 12k,
      tweede lid, en deze kennis en informatie zo nodig openbaar maken.
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12l
  - number: 12m
    text: |-
      De accountant of accountant-administratieconsulent, bedoeld in [artikel 12k, tweede lid, onderdeel b][ref1],
      controleert of voldaan is aan de in deze regeling neergelegde bepalingen met inachtneming van het door de Dienst
      Regelingen vastgestelde en bij de beschikking tot subsidieverlening gevoegde controleprotocol.


      [ref1]: https://wetten.overheid.nl/BWBR0011535#Artikel12k
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12m
    references:
      - id: ref1
        bwb_id: BWBR0011535
        artikel: 12k
        paragraaf: '3'
  - number: 12n
    text: De subsidieontvanger bewaart de originele projectadministratie tot en met 2012.
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12n
  - number: 12o
    text: |-
      De minister stelt de subsidie vast binnen drie maanden na ontvangst van de aanvraag, bedoeld in artikel 12k, eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12o
  - number: 12p.1
    text: |-
      De minister kan de ontvanger van een subsidie als bedoeld in artikel 12a op aanvraag ten hoogste eenmaal per zes
      maanden een voorschot verlenen.
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12p
  - number: 12p.2
    text: |-
      Het totaal van de verleende voorschotten bedraagt niet meer dan 80% van het bedrag waarop de subsidie
      overeenkomstig de beschikking tot subsidieverlening, bedoeld in artikel 12i, ten hoogste kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12p
  - number: 12p.3
    text: Een aanvraag tot verlening van een voorschot gaat vergezeld van een overzicht van de liquiditeitsbehoefte.
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12p
  - number: 12p.4
    text: |-
      Een voorschot wordt in ieder geval niet verleend indien de subsidieontvanger naar het oordeel van de minister niet
      heeft voldaan aan artikel 12j, vijfde lid.
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12p
  - number: 12q.1
    text: |-
      Met het toezicht op de naleving van deze regeling zijn belast de ambtenaren van de Dienst Regelingen en de
      ambtenaren van de Algemene Inspectiedienst van het Ministerie van Landbouw, Natuur en Voedselkwaliteit.
    url: https://wetten.overheid.nl/BWBR0011535/2006-06-24#Artikel12q
  - number: 12q.2
    text: |-
      De toezichthouders, bedoeld in het eerste lid, beschikken niet over de bevoegdheden, vermeld in de
