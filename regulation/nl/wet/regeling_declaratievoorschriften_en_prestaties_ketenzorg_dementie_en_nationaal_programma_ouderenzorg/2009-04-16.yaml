        artikel: '5'
  - number: '4'
    text: |-
      4.1 De zorgaanbieder registreert, indien de prestatie ketenzorg dementie en/of de prestatie nationaal programma
      ouderenzorg in rekening gebracht wordt, naast de in [artikel 36, eerste lid 1][ref1], aangegeven administratie-
      eisen, de volgende gegevens volledig en naar waarheid:

      Per gecontracteerde zorgprestatie:

      a. de met de zorgkantoor(s) afgesproken prestatie-indicatoren of prestatie-afspraken of succesfactoren over:

      1. efficiëntie in de zorgverlening;

      2. toegankelijkheid;

      3. cliëntenbelangen; en

      4. 4 andere kwaliteitsaspecten;

      b. de zorgonderdelen die tezamen de opbouw vormen van het totaalproduct dat de zorgaanbieder levert of kan leveren
      aan een cliënt(engroep);

      c. resultaten op uitkomstenniveau voor de kwaliteit van de zorg, de efficiëntie in de zorg en de cliëntgerichtheid
      in de zorglevering (evaluatie beoogde effecten); en

      d. integraal tarief én deeltarieven waarbij de deeltarieven gekoppeld zijn aan de zorgonderdelen die tezamen de
      opbouw vormen van het totaalproduct dat de zorgaanbieder levert of kan leveren aan een cliënt(engroep).

      4.2 De verplichting om te registeren omvat alleen de onderwerpen voor registratie. De manier waarop de registratie
      plaatsvindt, is aan de zorgaanbieder zelf.

      4.3 De verplichting om te registreren geldt wat betreft de registratie van prestaties Ketenzorg Dementie of
      Nationaal Programma Ouderenzorg vanaf 1 februari 2009.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel36
    url: https://wetten.overheid.nl/BWBR0025699/2009-04-16#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '36'
  - number: '5'
    text: >-
      5.1 De zorgaanbieder declareert geen verrichte prestatie in Ketenzorg Dementie of Nationaal Programma Ouderenzorg
      die reeds op andere wijze is/wordt gedeclareerd dan wel bekostigd.


      5.2 De zorgaanbieder dient op de declaratie onderscheid te maken tussen verzekerde zorg onder de zorgverzekering,
      de AWBZ en overige.
    url: https://wetten.overheid.nl/BWBR0025699/2009-04-16#Artikel5
  - number: '6'
    text: >-
      6.1 De zorgaanbieder declareert uitsluitend de prestaties Ketenzorg Dementie of Nationaal Programma Ouderenzorg aan
      een zorgkantoor met wie daartoe een rechtsgeldige overeenkomst is gesloten.
    url: https://wetten.overheid.nl/BWBR0025699/2009-04-16#Artikel6
  - number: '7'
    text: >-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0025699/2009-04-16#Artikel7
