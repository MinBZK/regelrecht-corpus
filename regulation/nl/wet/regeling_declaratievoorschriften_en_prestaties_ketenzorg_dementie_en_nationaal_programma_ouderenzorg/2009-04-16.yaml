  - number: '2'
    text: |-
      In deze regeling wordt verstaan onder:

      2.1 Prestaties Ketenzorg Dementie en Nationaal Programma Ouderenzorg.

      De prestatie Ketenzorg Dementie en de prestatie Nationaal Programma Ouderenzorg zijn kortdurende kleinschalige
      experimenten waarbij:

      - de prestatie al die zorg omvat, die valt onder de Leidraad Ketenzorg Dementie of onder het Nationaal Programma
      Ouderenzorg;
      - het zorgkantoor en zorgaanbieder zelf een beschrijving geven van de nieuwe prestatie zodanig dat de zorg voor
      desbetreffende cliënten duidelijk is verwoord inclusief de beoogde uitkomsten van die zorg.

      2.2 Kortdurend kleinschalige experiment

      Onder kortdurende kleinschalige experimenten worden verstaan experimenten die:

      a. een looptijd hebben van maximaal drie kalenderjaren na startdatum van het kortdurend kleinschalig experiment;

      b. gericht zijn op nieuwe of vernieuwende zorglevering met een betere prijs/kwaliteitsverhouding, op efficiënte
      zorgorganisatie;

      c. beperkt zijn tot een specifieke zorgprestatie waarbij zorgaanbieders en zorgkantoren alleen op lokaal/regionaal
      niveau betrokken zijn;

      d. niet louter tot doel hebben over te gaan op vrije prijzen; en

      e. controleerbare en verifieerbare resultaten in de testomgeving zullen opleveren.

      2.3 Betere prijs/kwaliteitsverhouding

      Een betere prijs/kwaliteitsverhouding zoals verwoord in 2.2 b betekent dat zorgkantoren en zorgaanbieders:

      - de kwaliteit van de zorg voor de cliënt verhogen zonder de prijs van de zorg te verhogen;
      - de prijs van de zorg verlagen zonder dat de kwaliteit van de zorg voor de cliënt wordt verlaagd,
      - zowel de kwaliteit van de zorg voor de cliënt verhogen als de prijs van de zorg verlagen, óf
      - de kwaliteit van de zorg voor de cliënt verhogen met een in verhouding beperkte toename in de prijs.
    url: https://wetten.overheid.nl/BWBR0025699/2009-04-16#Artikel2
  - number: '3'
    text: |-
      3.1 De registratie van de gegevens zoals genoemd in [artikel 4][ref1] heeft tot doel:

      De ontwikkelingen van Ketenzorg Dementie en het Nationaal Programma Ouderenzorg en de daaruit volgende resultaten
      in de zorgverlening in relatie tot de betaalbaarheid, toegankelijkheid en kwaliteit van de zorg te kunnen volgen,
      toetsen en evalueren.

      3.2 De declaratievoorschriften zoals in [artikel 5][ref2] hebben tot doel:

      a. Rechtmatige declaratie mogelijk te maken;

      b. Dubbele declaraties te voorkomen; en

      c. Voorkomen onnodige administratieve lasten.


      [ref1]: https://wetten.overheid.nl/BWBR0025699#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0025699#Artikel5
    url: https://wetten.overheid.nl/BWBR0025699/2009-04-16#Artikel3
