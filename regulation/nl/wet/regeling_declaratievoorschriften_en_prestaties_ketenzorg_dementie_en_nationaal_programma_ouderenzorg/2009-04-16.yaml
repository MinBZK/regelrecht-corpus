  - number: '1'
    text: |-
      Deze regeling is van toepassing op zorgaanbieders die zorg leveren als bedoeld in de [Wmg][ref1], voor zover ze
      prestaties Ketenzorg Dementie of Nationaal Programma Ouderenzorg (NPO) leveren.


      [ref1]: https://wetten.overheid.nl/BWBR0020078
    url: https://wetten.overheid.nl/BWBR0025699/2009-04-16#Artikel1
    references:
      - id: ref1
