      fictief verhoogde grondslag worden naar boven afgerond tot hele euro’s.


      [ref1]: https://wetten.overheid.nl/BWBR0002532#Artikel6
    url: https://wetten.overheid.nl/BWBR0002532/2002-01-01#Artikel10
