preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is, in verband met de loonontwikkeling in het
    bedrijfsleven de ingevolge de Wet buitengewoon pensioen 1940-1945 (Stb. 1947, H 313) en de Wet buitengewoon
    pensioen zeelieden-oorlogsslachtoffers (Stb. 1947, H 420) toegekende en toe te kennen buitengewone pensioenen
    andermaal tijdelijk te verhogen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002532/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De krachtens de [Wet buitengewoon pensioen 1940-1945][ref1] (*Stb.* 1947, H 313) toegekende en toe te kennen
      buitengewone pensioenen worden, voor zover het recht op deze pensioenen op 1 januari 1965 niet is vervallen,
      gerekend van 1 januari 1965 af of van het later tijdstip, waarop zij zijn ingegaan of zullen ingaan, ambtshalve
      tijdelijk verhoogd met een toeslag van honderd zestig procent.

      2 De in het eerste lid bedoelde tijdelijke toeslag wordt verleend tot de dag met ingang waarvan voor de eerste
      maal bij algemene maatregel van bestuur krachtens artikel 31 van de in het eerste lid genoemde wet de buitengewone
      pensioenen worden herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0002032
    url: https://wetten.overheid.nl/BWBR0002532/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002032
  - number: '2'
    text: |-
      Voor zover termijnen van de krachtens de [Wet buitengewoon pensioen 1940-1945][ref1] (*Stb.* 1947, H 313)
      toegekende en toe te kennen buitengewone pensioenen betrekking hebben op tijdvakken na 31 december 1964, zijn de
      wet van 15 juni 1951 (*Stb.* 221), de wet van 10 augustus 1951 (*Stb.* 360), de wet van 16 juni 1954 (*Stb.* 287),
      de wet van 7 juli 1955 (*Stb.* 358), de wet van 18 juli 1957 (*Stb.* 331), de wet van 11 december 1957 (*Stb.*
      570), de wet van 23 september 1959 (*Stb.* 366), de wet van 28 december 1960 (*Stb.* 615), de wet van 29 mei
      1963 (*Stb.* 262), de wet van 25 juni 1964 (*Stb.* 268) en de wet van 14 juli 1965 (*Stb.* 404) daarop niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002032
    url: https://wetten.overheid.nl/BWBR0002532/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002032
  - number: '3'
    text: |-
      Het totaal van buitengewoon pensioen en tijdelijke toeslag daarop kan de maxima, gesteld in de artikelen 17, *e, f*
      en *g,* 18, eerste lid, en 19, eerste lid, van de [Wet buitengewoon pensioen 1940-1945][ref1] (*Stb.* 1947, H 313)
      gerekend van 1 januari 1965 af met honderd zestig procent overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0002032
    url: https://wetten.overheid.nl/BWBR0002532/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002032
  - number: '4'
    text: |-
      Voor de toepassing van [artikel 12, tweede lid, van de Wet buitengewoon pensioen 1940-1945][ref1] (*Stb.* 1947, H
      313) wordt de grondslag, waarover het buitengewoon pensioen is of wordt berekend, gerekend van 1 januari 1965 af
      geacht te zijn verhoogd met honderd zestig procent.


      [ref1]: https://wetten.overheid.nl/BWBR0002032#Artikel12
    url: https://wetten.overheid.nl/BWBR0002532/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002032
        artikel: '12'
  - number: '5'
    text: |-
      Het bedrag van de ingevolge [artikel 1][ref1] toe te kennen toeslag, alsmede het bedrag van de ingevolge
      [artikel 4][ref2] fictief verhoogde grondslag worden naar boven afgerond tot hele euro’s.


      [ref1]: https://wetten.overheid.nl/BWBR0002532#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002532#Artikel4
    url: https://wetten.overheid.nl/BWBR0002532/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002532
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002532
        artikel: '4'
  - number: '6'
    text: |-
      1 De krachtens de Wet buitengewoon pensioen zeelieden- oorlogsslachtoffers (*Stb.* 1947, H 420) toegekende en
      toe te kennen buitengewone pensioenen worden, voor zover het recht op deze pensioenen op 1 januari 1965 niet is
      vervallen, gerekend van 1 januari 1965 af of van het later tijdstip, waarop zij zijn ingegaan of zullen ingaan,
      ambtshalve tijdelijk verhoogd met een toeslag van honderd zestig procent.

      2 De in het eerste lid bedoelde tijdelijke toeslag wordt verleend tot de dag met ingang waarvan voor de eerste
      maal bij algemene maatregel van bestuur krachtens artikel 28 van de in het eerste lid genoemde wet de buitengewone
      pensioenen worden herzien.
    url: https://wetten.overheid.nl/BWBR0002532/2002-01-01#Artikel6
  - number: '7'
    text: |-
      Voor zover termijnen van de krachtens de [Wet buitengewoon pensioen zeelieden-oorlogsslachtoffers][ref1] (*Stb.*
      1947, H 420) toegekende en toe te kennen buitengewone pensioenen betrekking hebben op tijdvakken na 31 december
      1964, zijn de wet van 10 augustus 1951 (*Stb.* 365), de wet van 16 december 1954 (*Stb.* 633), de wet van 18 juli
      1957 (*Stb.* 296), de wet van 27 maart 1958 (*Stb.* 182), de wet van 28 december 1960 (*Stb.* 618), de wet van 30
      maart 1961 (*Stb.* 122), de wet van 29 mei 1963 (*Stb.* 264), de wet van 25 juni 1964 (*Stb.* 269) en de wet van 14
      juli 1965 (*Stb.* 353) daarop niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002035
    url: https://wetten.overheid.nl/BWBR0002532/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002035
  - number: '8'
    text: |-
      Het totaal van buitengewoon pensioen en tijdelijke toeslag daarop kan de maxima, gesteld in de artikelen 17, *e,
      f* en *g,* 18, eerste lid en 19, eerste lid, van de [Wet buitengewoon pensioen zeelieden-oorlogsslachtoffers][ref1]
      (*Stb.* 1947, H 420) gerekend van 1 januari 1965 af met honderd zestig procent overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0002035
    url: https://wetten.overheid.nl/BWBR0002532/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002035
  - number: '9'
    text: |-
      Voor de toepassing van [artikel 11, tweede lid, van de Wet buitengewoon pensioen zeelieden-oorlogsslachtoffers][ref1]
      (*Stb.* 1947, H 420), wordt de grondslag, waarover het buitengewoon pensioen is of wordt berekend, gerekend van 1
      januari 1965 af geacht te zijn verhoogd met honderd zestig procent.


      [ref1]: https://wetten.overheid.nl/BWBR0002035#Artikel11
    url: https://wetten.overheid.nl/BWBR0002532/2002-01-01#Artikel9
