                    conditions:
                      - operation: EQUALS
                        subject: $type
                        value: wijziging_vergunning
                      - operation: EQUALS
                        subject: $articlenumber
                        value: '18'
                  then: 9000
                - when:
                    operation: AND
                    conditions:
                      - operation: EQUALS
                        subject: $type
                        value: ontheffing_vakbekwaamheid
                      - operation: EQUALS
                        subject: $articlenumber
                        value: '16'
                  then: 9000
                - when:
                    operation: AND
                    conditions:
                      - operation: EQUALS
                        subject: $type
                        value: vergunningbewijs
                      - operation: EQUALS
                        subject: $articlenumber
                        value: '22'
                  then: 9000
                - when:
                    operation: AND
                    conditions:
                      - operation: EQUALS
                        subject: $type
                        value: inschrijving_eigen_vervoer
                      - operation: EQUALS
                        subject: $articlenumber
                        value: '41'
                  then: 29900
                - when:
                    operation: AND
                    conditions:
                      - operation: EQUALS
                        subject: $type
                        value: inschrijving_eigen_vervoer
                      - operation: EQUALS
                        subject: $articlenumber
                        value: '45'
                  then: 29900
                - when:
                    operation: AND
                    conditions:
                      - operation: EQUALS
                        subject: $type
                        value: inschrijvingsbewijs
                      - operation: EQUALS
                        subject: $articlenumber
                        value: '46'
                  then: 9000
                - when:
                    operation: EQUALS
                    subject: $type
                    value: gewaarmerkt_afschrift
                  then: 2200
              default: 0
