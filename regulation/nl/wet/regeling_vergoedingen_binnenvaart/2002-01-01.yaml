preamble:
  text: |-
    Gelet op artikel 56 van de Wet vervoer binnenvaart (Stb. 1991, 711),

    Besluit:
  url: https://wetten.overheid.nl/BWBR0005764/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De aanvrager is een vergoeding verschuldigd van:

      a. € 299 voor de behandeling van een aanvraag om een vergunning als bedoeld in
      [artikel 11, eerste lid, van de Wet vervoer binnenvaart][ref1];

      b. € 90 voor de behandeling van een aanvraag om wijziging van een vergunning als bedoeld in
      [artikel 11, eerste lid, van de Wet vervoer binnenvaart][ref2];

      c. € 90 voor de behandeling van een aanvraag om een vergunning als bedoeld in
      [artikel 17, eerste lid, van de Wet vervoer binnenvaart][ref3];

      d. € 90 voor de behandeling van een aanvraag om wijziging van een vergunning als bedoeld in
      [artikel 17, eerste lid, van de Wet vervoer binnenvaart][ref4];

      e. € 90 voor de behandeling van een aanvraag om een vergunning als bedoeld in
      [artikel 18, eerste lid, van de Wet vervoer binnenvaart][ref5];

      f. € 90 voor de behandeling van een aanvraag om wijziging van een vergunning als bedoeld in
      [artikel 18, eerste lid, van de Wet vervoer binnenvaart][ref6];

      g. € 90 voor de behandeling van een aanvraag om ontheffing van de eis van vakbekwaamheid als bedoeld in
      [artikel 16, eerste lid, van het Besluit vervoer binnenvaart][ref7];

      h. € 90 voor de behandeling van een aanvraag om een vergunningbewijs als bedoeld in
      [artikel 22 van de Wet vervoer binnenvaart][ref8];

      i.

      j.

      k. € 299 voor de behandeling van een aanvraag om een inschrijving eigen vervoer als bedoeld in
      [artikel 41, eerste lid, van de Wet vervoer binnenvaart][ref9];

      l. € 299 voor de behandeling van een aanvraag om een inschrijving eigen vervoer als bedoeld in
      [artikel 45, eerste lid, van de Wet vervoer binnenvaart][ref10];

      m. € 90 voor de behandeling van een aanvraag om een inschrijvingsbewijs als bedoeld in
      [artikel 46, eerste lid, van de Wet vervoer binnenvaart][ref11];

      n. € 22 voor de behandeling van een aanvraag om een gewaarmerkt afschrift van de documenten, bedoeld in de
      onderdelen a, c, e, h, k, l en m.


      [ref1]: https://wetten.overheid.nl/BWBR0005319#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005319#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0005319#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0005319#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0005319#Artikel18
      [ref6]: https://wetten.overheid.nl/BWBR0005319#Artikel18
      [ref7]: https://wetten.overheid.nl/BWBR0005503#Artikel16
      [ref8]: https://wetten.overheid.nl/BWBR0005319#Artikel22
      [ref9]: https://wetten.overheid.nl/BWBR0005319#Artikel41
      [ref10]: https://wetten.overheid.nl/BWBR0005319#Artikel45
      [ref11]: https://wetten.overheid.nl/BWBR0005319#Artikel46
    url: https://wetten.overheid.nl/BWBR0005764/2002-01-01#Artikel1
    machine_readable:
      execution:
        parameters:
          - name: type
            type: string
            required: true
            description: Type van aanvraag (e.g., vergunning, wijziging_vergunning, ontheffing_vakbekwaamheid)
          - name: articlenumber
            type: string
            required: false
            description: Artikelnummer uit Wet vervoer binnenvaart of Besluit vervoer binnenvaart
        output:
          - name: vergoedingsbedrag
            type: amount
            type_spec:
              unit: eurocent
            description: Vergoedingsbedrag voor de behandeling van de aanvraag
        actions:
          - output: vergoedingsbedrag
            value:
              operation: IF
              cases:
                - when:
                    operation: AND
                    conditions:
                      - operation: EQUALS
                        subject: $type
                        value: vergunning
                      - operation: EQUALS
                        subject: $articlenumber
                        value: '11'
                  then: 29900
                - when:
                    operation: AND
                    conditions:
                      - operation: EQUALS
                        subject: $type
                        value: wijziging_vergunning
