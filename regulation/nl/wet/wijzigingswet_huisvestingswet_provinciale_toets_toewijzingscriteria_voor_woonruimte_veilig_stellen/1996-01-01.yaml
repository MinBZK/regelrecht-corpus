preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels te geven inzake de toewijzing van woonruimte
    aan woningzoekenden;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007736/1996-01-01#ArtikelAanhef
articles:
  - number: II
    text: |-
      1 Een vóór de inwerkingtreding van deze wet door gedeputeerde staten gegeven toestemming tot afwijking van
      [artikel 5, eerste lid, onderdeel ][ref1] vervalt met ingang van het tijdstip van inwerkingtreding van deze wet.

      2 Deze wet treedt in werking met ingang van 1 januari 1996.

      3 Indien het *Staatsblad* waarin deze wet wordt geplaatst, wordt uitgegeven na 31 december 1995, treedt zij in
      werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin zij wordt geplaatst en werkt zij
      terug tot en met 1 januari 1996.


      [ref1]: https://wetten.overheid.nl/BWBR0005893#Artikel5
    url: https://wetten.overheid.nl/BWBR0007736/1996-01-01#ArtikelII
