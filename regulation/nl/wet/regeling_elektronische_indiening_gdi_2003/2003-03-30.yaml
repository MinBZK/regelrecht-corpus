$id: regeling_elektronische_indiening_gdi_2003
regulatory_layer: WET
publication_date: '2004-03-30'
valid_from: '2003-03-30'
bwb_id: BWBR0014886
url: https://wetten.overheid.nl/BWBR0014886/2003-03-30
preamble:
  text: |-
    Gelet op de artikelen 6, eerste lid, van Verordening (EG) nr. 3508/1992 van de Raad van de Europese
    Gemeenschappen van 27 november 1992 tot instelling van een geïntegreerd beheers- en controlesysteem voor bepaalde
    communautaire steunregelingen (PbEG L 355) en 11 van Verordening (EG) nr. 2419/2001 van de Commissie houdende
    uitvoeringsbepalingen inzake het bij Verordening (EG) nr. 3508/92 van de Raad ingestelde geïntegreerde beheers- en
    controlesysteem voor bepaalde communautaire steunregelingen (PbEG L 327);

    Gelet op de artikelen 13, 19, 24, 25 en 27 van de Landbouwwet en artikel 7a van de Meststoffenwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0014886/2003-03-30#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De aanvraag, bedoeld in [artikel 7a van de Regeling EG-steunverlening akkerbouwgewassen][ref1], de opgave,
      bedoeld in [artikel 6 van de Regeling landbouwtelling 2003][ref2] en de verstrekking van gegevens, bedoeld in
      [artikel 5a van de Regeling administratieve verplichtingen Meststoffenwet][ref3] kunnen gezamenlijk elektronisch
      worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0008301#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0014885#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0009228#Artikel5a
    url: https://wetten.overheid.nl/BWBR0014886/2003-03-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008301
        artikel: 7a
      - id: ref2
        bwb_id: BWBR0014885
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0009228
        artikel: 5a
  - number: '2.1'
    text: De gezamenlijke elektronische indiening geschiedt met het daartoe bestemde elektronische formulier.
    url: https://wetten.overheid.nl/BWBR0014886/2003-03-30#Artikel2
  - number: '2.2'
    text: |-
      Het formulier wordt ondertekend met de door de Minister aan de ondertekenaar ter beschikking gestelde elektronische
      handtekening.
    url: https://wetten.overheid.nl/BWBR0014886/2003-03-30#Artikel2
  - number: '2.3'
    text: De elektronische handtekening bestaat uit een eenmalig te gebruiken tancode.
    url: https://wetten.overheid.nl/BWBR0014886/2003-03-30#Artikel2
  - number: '3.1'
    text: De elektronische handtekening wordt uitsluitend gebruikt door degene aan wie de handtekening is verstrekt.
    url: https://wetten.overheid.nl/BWBR0014886/2003-03-30#Artikel3
  - number: '3.2'
    text: De ontvanger van een tancode ziet toe op het gebruik van de tancode overeenkomstig deze regeling.
    url: https://wetten.overheid.nl/BWBR0014886/2003-03-30#Artikel3
  - number: '4.1'
    text: Een tancode is uitsluitend geldig voor de regeling en de aanvraagperiode waarvoor deze is verstrekt.
    url: https://wetten.overheid.nl/BWBR0014886/2003-03-30#Artikel4
  - number: '4.2'
    text: Door het gebruik van een tancode verklaart de aanvrager dat hij de tancode gebruikt overeenkomstig deze regeling.
    url: https://wetten.overheid.nl/BWBR0014886/2003-03-30#Artikel4
  - number: '5'
    text: De Minister bevestigt de ontvangst van een elektronisch ingediend formulier.
    url: https://wetten.overheid.nl/BWBR0014886/2003-03-30#Artikel5
  - number: '6'
    text: De Minister verstrekt ambtshalve een set tancodes aan bij hem bekende agrarische ondernemers.
    url: https://wetten.overheid.nl/BWBR0014886/2003-03-30#Artikel6
  - number: '7.1'
    text: De Minister verstrekt op verzoek van de aanvrager een set tancodes, ingeval
    url: https://wetten.overheid.nl/BWBR0014886/2003-03-30#Artikel7
  - number: 7.1.a
    text: deze geen tancodes heeft ontvangen;
    url: https://wetten.overheid.nl/BWBR0014886/2003-03-30#Artikel7
  - number: 7.1.b
    text: de verstrekte tancodes zijn gebruikt, of
    url: https://wetten.overheid.nl/BWBR0014886/2003-03-30#Artikel7
  - number: 7.1.c
    text: van verlies van eerder verstrekte tancodes.
    url: https://wetten.overheid.nl/BWBR0014886/2003-03-30#Artikel7
  - number: '7.2'
    text: |-
      De Minister kan verzoeken om een bewijs van de juistheid van bij het verzoek, bedoeld in het eerste lid, verstrekte
      gegevens.
    url: https://wetten.overheid.nl/BWBR0014886/2003-03-30#Artikel7
  - number: '8'
    text: |-
      De Minister kan besluiten de elektronische handtekening niet te verstrekken of in te trekken, indien de indiener
      of een met hem geassocieerd bedrijf of organisatie in het verleden de elektronische handtekening heeft gebruikt in
      strijd met deze regeling of op andere wijze de integriteit van een verstrekte handtekening heeft geschonden.
    url: https://wetten.overheid.nl/BWBR0014886/2003-03-30#Artikel8
  - number: '9.1'
    text: |-
      In afwijking van [artikel 3][ref1] kan een belanghebbende de aan hem verstrekte tancodes doen gebruiken door een
      gemachtigde als bedoeld in [artikel 2:1 van de Algemene wet bestuursrecht][ref2] ten behoeve van het indienen van
      een elektronische formulier namens belanghebbende.


      [ref1]: https://wetten.overheid.nl/BWBR0014886#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0014886/2003-03-30#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0014886
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '2'
  - number: '9.2'
    text: |-
      De gemachtigde maakt bij het indienen van de aanvraag, de opgave onderscheidenlijk de verstrekking slechts gebruik
      van de aan de gemachtigde ter beschikking gestelde toegangscodes tot het elektronische formulier.
    url: https://wetten.overheid.nl/BWBR0014886/2003-03-30#Artikel9
  - number: '10'
    text: |-
      De ontvangst van een door een gemachtigde ingediend elektronisch formulier wordt bevestigd aan de gemachtigde en
      de aanvrager.
    url: https://wetten.overheid.nl/BWBR0014886/2003-03-30#Artikel10
  - number: '11.1'
    text: De Minister kan een elektronisch formulier weigeren, indien dit niet overeenkomstig deze regeling is ingediend.
    url: https://wetten.overheid.nl/BWBR0014886/2003-03-30#Artikel11
  - number: '11.2'
    text: |-
      De Minister kan elektronisch verschafte gegevens en bescheiden weigeren voor zover de aanvaarding daarvan tot een
      onevenredige belasting voor de Minister zou leiden.
    url: https://wetten.overheid.nl/BWBR0014886/2003-03-30#Artikel11
  - number: '11.3'
    text: |-
      De Minister kan een elektronisch verzonden bericht weigeren voor zover de betrouwbaarheid of vertrouwelijkheid
      van dit bericht onvoldoende is gewaarborgd, gelet op de aard en de inhoud van het bericht en het doel waarvoor het
      wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0014886/2003-03-30#Artikel11
  - number: '11.4'
    text: De Minister deelt een weigering op grond van dit artikel zo spoedig mogelijk aan de afzender mede.
    url: https://wetten.overheid.nl/BWBR0014886/2003-03-30#Artikel11
  - number: '12'
    text: |-
      Als tijdstip waarop een elektronisch formulier door de Minister elektronisch is ontvangen, geldt het tijdstip
      waarop het bericht zijn systeem voor gegevensverwerking heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0014886/2003-03-30#Artikel12
  - number: '13'
    text: |-
      De Minister kan besluiten de elektronische aanvraag, opgave onderscheidenlijk verstrekking niet te behandelen,
      indien het elektronisch formulier geheel of gedeeltelijk is geweigerd op grond van [artikel 11][ref1].
      [Artikel 4:5 van de Algemene wet bestuursrecht][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014886#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0014886/2003-03-30#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0014886
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '14'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0014886/2003-03-30#Artikel14
  - number: '15'
    text: 'Deze regeling wordt aangehaald als: Regeling elektronische indiening GDI 2003.'
    url: https://wetten.overheid.nl/BWBR0014886/2003-03-30#Artikel15
