  - number: 1.2.b
    text: |-
      voor de termijn van twaalf maanden in [artikel 9, vierde lid][ref1], wordt gelezen: vierentwintig maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel9
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel1
