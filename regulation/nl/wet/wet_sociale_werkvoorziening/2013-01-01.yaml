        artikel: '1'
        hoofdstuk: '1'
  - number: '10.1'
    text: |-
      Bij overgang van ingezetenschap van de ene naar de andere gemeente treedt het college van de gemeente waarvan de
      betrokkene, bedoeld in [artikel 7][ref1], ingezetene wordt per 1 januari van het tweede kalenderjaar volgend op
      het kalenderjaar van die overgang bij de toepassing van dat artikel in de plaats van het college van de gemeente
      waarvan de betrokkene, bedoeld in [artikel 7][ref2], niet langer ingezetene is.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Artikel7
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '7'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0008903
        artikel: '7'
        hoofdstuk: '3'
  - number: '10.2'
    text: |-
      Bij overgang van ingezetenschap van de ene naar de andere gemeente betaalt het college van de gemeente waarvan
      de betrokkene ingezetene wordt vanaf het tweede kalenderjaar volgend op het kalenderjaar van die overgang
      aan het college van de gemeente waarvan de betrokkene niet langer ingezetene is een vergoeding voorzover zijn
      dienstbetrekking met dat college voortduurt.
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel10
  - number: '10.3'
    text: |-
      De vergoeding, bedoeld in het tweede lid, bedraagt per kalenderjaar: (A / B) x C waarbij: A staat voor de
      uitkering, bedoeld in [artikel 8, eerste lid][ref1] aan de gemeente waarvan de betrokkene ingezetene is; B
      staat voor het op grond van [artikel 8, tweede lid][ref2], vastgestelde aantal bij de uitkering, bedoeld in
      [artikel 8, eerste lid][ref3], behorende minimumaantal arbeidsjaren voor de gemeente waarvan de betrokkene
      ingezetene is; C staat voor het aantal door de ingezetene gerealiseerde arbeidsjaren in dat kalenderjaar berekend
      op honderdsten nauwkeurig waarbij vijfduizendste of meer naar boven wordt afgerond op een honderdste.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0008903#Artikel8
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '8'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0008903
        artikel: '8'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0008903
        artikel: '8'
        hoofdstuk: '4'
  - number: '10.4'
    text: |-
      Iedere maand wordt bij wijze van voorschot 1/12 van de naar het oordeel van het college van de gemeente waarmee de
      betrokkene zijn dienstbetrekking heeft te verwachten vergoeding betaald. Indien in de loop van het kalenderjaar de
      te verwachten vergoeding naar het oordeel van dat college wijzigt wordt het voorschot daarop aangepast.
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel10
  - number: '10.5'
    text: |-
      Voor de toepassing van dit artikel wordt het ingezetenschap van de werknemer die van buiten Nederland in Nederland
      gaat wonen geacht over te zijn gegaan van de gemeente waarin hij laatstelijk in Nederland woonde naar de gemeente
      in Nederland waarin hij gaat wonen.
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel10
  - number: '11.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen stelt van personen, die daartoe een aanvraag hebben ingediend, bij
      beschikking vast:
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel11
  - number: 11.1.a
    text: of deze behoren tot de doelgroep;
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel11
  - number: 11.1.b
    text: 'nadat is vastgesteld dat een persoon tot de doelgroep behoort:'
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel11
  - number: 11.1.b.1°
    text: de geldigheidsduur van de indicatie;
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel11
  - number: 11.1.b.2°
    text: |-
      de indeling van de persoon in één van de arbeidshandicapcategorieën, die bepaald worden door de zwaarte van de
      aanpassing van de omstandigheden en de productiviteit.
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel11
  - number: '11.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen verricht periodiek herindicatie van personen die tot de doelgroep
      behoren overeenkomstig de krachtens [artikel 6, tweede lid, onderdeel a][ref1], gestelde regels. Het eerste lid is
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel6
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '6'
        hoofdstuk: '2'
  - number: '11.3'
    text: |-
      Op aanvraag van het college verricht het Uitvoeringsinstituut werknemersverzekeringen, overeenkomstig de krachtens
      [artikel 6, tweede lid, onderdeel a][ref1], gestelde regels, herindicatie van de werknemer die de bedongen
      arbeid gedurende een ononderbroken periode van ten minste 13 weken niet heeft verricht omdat hij in verband met
      ongeschiktheid ten gevolge van ziekte daartoe verhinderd was en die naar het inzicht van het college duurzaam
      niet in staat zal zijn tot het verrichten van arbeid onder aangepaste omstandigheden. Het eerste lid is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel6
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '6'
        hoofdstuk: '2'
  - number: '11.4'
    text: Indicatie vindt slechts plaats met betrekking tot
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel11
  - number: 11.4.a
    text: 'personen:'
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel11
  - number: 11.4.a.1°
    text: die als werkzoekende staan ingeschreven bij het Uitvoeringsinstituut werknemersverzekeringen,
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel11
  - number: 11.4.a.2°
    text: |-
      die voor een dienstbetrekking als bedoeld in [artikel 1, derde lid][ref1], in aanmerking wensen te komen, en


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel1
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '1'
        hoofdstuk: '1'
  - number: 11.4.a.3°
    text: |-
      van wie niet in de periode van 12 maanden voorafgaand aan de aanvraag de indicatiebeschikking of
      herindicatiebeschikking is ingetrokken op grond van [artikel 12, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel12
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '12'
        hoofdstuk: '5'
  - number: 11.4.b
    text: werknemers die voor herindicatie in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel11
  - number: '11.5'
    text: |-
      Een indicatiebeschikking of herindicatiebeschikking wordt gegeven binnen zestien weken na ontvangst van de
      aanvraag.
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel11
  - number: '11.6'
    text: |-
      In afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1] beslist het
      Uitvoeringsinstituut werknemersverzekeringen binnen zestien weken gerekend vanaf de dag na die waarop de termijn
      voor het indienen van het bezwaarschrift is verstreken tegen een indicatiebeschikking of herindicatiebeschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '11.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de bij of krachtens
      dit artikel aan het Uitvoeringsinstituut werknemersverzekeringen opgedragen taak en de wijze van uitoefening
      daarvan.
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel11
  - number: '11.8'
    text: |-
      De voordracht voor een krachtens het zevende lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel11
  - number: '12.1'
    text: |-
      Het college beheert een wachtlijst. De wachtlijst bevat een overzicht van ingezetenen die geïndiceerd zijn,
      geen dienstbetrekking hebben als bedoeld in de [hoofdstukken 2][ref1] en [3][ref2] en beschikbaar zijn om een
      dergelijke dienstbetrekking te aanvaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008903
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008903
        hoofdstuk: '3'
  - number: '12.2'
    text: |-
      De gemeenteraad kan bij verordening regels stellen over de volgorde waarin de ingezetenen die op de wachtlijst zijn
      geplaatst voor een dienstbetrekking als bedoeld in [artikel 2, eerste lid][ref1], in aanmerking worden gebracht.
      Bij het ontbreken van een dergelijke verordening geldt de volgorde van de plaatsing op de wachtlijst.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel2
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '2'
        hoofdstuk: '2'
  - number: '12.3'
    text: 'Het college kan de indicatiebeschikking of herindicatiebeschikking van een betrokkene intrekken indien:'
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel12
  - number: 12.3.a
    text: betrokkene passende arbeid in dienstbetrekking onder aangepaste omstandigheden weigert;
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel12
  - number: 12.3.b
    text: |-
      de dienstbetrekking van betrokkene door het college is opgezegd op grond van
      [artikel 6, tweede lid, onderdeel a of c][ref1], of door de werkgever, bedoeld in [artikel 7][ref2], in verband
      met de toepassing van [artikel 7, zesde lid, onderdeel b of c][ref3], vanaf het moment dat de opzegging rechtens
      onaantastbaar is;


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0008903#Artikel7
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '6'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008903
        artikel: '7'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0008903
        artikel: '7'
        hoofdstuk: '3'
  - number: 12.3.c
    text: |-
      de dienstbetrekking van betrokkene door het college of de werkgever, bedoeld in [artikel 7][ref1], is opgezegd om
      een dringende reden in de zin van [artikel 678 van Boek 7 van het Burgerlijk Wetboek][ref2] en de werknemer ter
      zake een verwijt kan worden gemaakt, vanaf het moment dat de opzegging rechtens onaantastbaar is;


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel678
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '7'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '678'
  - number: 12.3.d
    text: de dienstbetrekking op verzoek van betrokkene is geëindigd; of
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel12
  - number: 12.3.e
    text: |-
      betrokkene niet beschikbaar is om een dienstbetrekking als bedoeld in [artikel 1, derde lid][ref1], te aanvaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel1
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '1'
        hoofdstuk: '1'
  - number: '12.4'
    text: 'De indicatiebeschikking of herindicatiebeschikking vervalt:'
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel12
  - number: 12.4.a
    text: |-
      per de dag dat betrokkene arbeid in een dienstbetrekking anders dan een dienstbetrekking als bedoeld in
      [artikel 1, derde lid][ref1], aanvaardt of arbeid gaat verrichten in de uitoefening van een bedrijf of in de
      zelfstandige uitoefening van een beroep, tenzij deze arbeid gericht is op het verkrijgen van een dienstbetrekking
      als bedoeld in [artikel 1, derde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Artikel1
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0008903
        artikel: '1'
        hoofdstuk: '1'
  - number: 12.4.b
    text: |-
      per de dag dat betrokkene de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], bereikt; of


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 12.4.c
    text: indien betrokkene overlijdt.
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel12
  - number: '12.5'
    text: |-
      Het college trekt de indicatiebeschikking of herindicatiebeschikking van een betrokkene in op schriftelijk verzoek
      van de betrokkene aan het college per de datum van dat verzoek.
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel12
  - number: '12.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de bij het eerste
      lid aan het college opgedragen taak en de wijze van uitoefening daarvan, met dien verstande dat in ieder geval bij
      of krachtens algemene maatregel van bestuur wordt geregeld wanneer ingezetenen die geïndiceerd zijn, beschikbaar
      zijn om een dienstbetrekking als bedoeld in de [hoofdstukken 2][ref1] en [3][ref2] te aanvaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008903
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008903
        hoofdstuk: '3'
  - number: '12.7'
    text: |-
      De voordracht voor een krachtens het zesde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel12
  - number: '13'
    text: |-
      Het college legt verantwoording af aan Onze Minister over de uitvoering van deze wet op de wijze, bedoeld in
      [artikel 17a van de Financiële-verhoudingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17a
  - number: '14.1'
    text: |-
      Het college en het Uitvoeringsinstituut werknemersverzekeringen verstrekken desgevraagd aan Onze Minister kosteloos
      alle inlichtingen, die hij nodig heeft voor de informatievoorziening en de beleidsvorming met betrekking tot deze
      wet.
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel14
  - number: '14.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld voor de inhoud, de wijze van verstrekken en het tijdstip van
      het verstrekken van de inlichtingen.
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel14
  - number: '15.1'
    text: |-
      Andere colleges, de krachtens [artikel 2, tweede lid][ref1], aangewezen rechtspersonen en het Uitvoeringsinstituut
      werknemersverzekeringen zijn bevoegd uit eigen beweging en verplicht op verzoek, kosteloos, aan het college en de
      krachtens [artikel 2, tweede lid][ref2], aangewezen rechtspersoon alle gegevens en inlichtingen te verstrekken, die
      noodzakelijk zijn voor de uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Artikel2
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008903
        artikel: '2'
        hoofdstuk: '2'
  - number: '15.2'
    text: |-
      Het college en de krachtens [artikel 2, tweede lid][ref1], aangewezen rechtspersoon zijn bevoegd uit eigen
      beweging en verplicht op verzoek uit de administratie aangelegd voor de uitvoering van deze wet kosteloos
      aan bestuursorganen de gegevens te verstrekken die noodzakelijk zijn voor de bij of krachtens wet aan deze
      bestuursorganen opgedragen taken.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel2
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '2'
        hoofdstuk: '2'
  - number: '15.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor de toepassing van het eerste en tweede lid nadere
      regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel15
  - number: '15.4'
    text: |-
      Een ieder verstrekt desgevraagd aan het college, het Uitvoeringsinstituut werknemersverzekeringen en de krachtens
      [artikel 2, tweede lid][ref1], aangewezen rechtspersoon kosteloos alle gegevens en inlichtingen die noodzakelijk
      zijn voor de uitvoering van deze wet ten opzichte van hemzelf, hem in wiens dienst dan wel ten behoeve van wie hij
      werkt of gewerkt heeft of hem die in zijn dienst dan wel te zijnen behoeve werkt of gewerkt heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel2
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '2'
        hoofdstuk: '2'
  - number: '15.5'
    text: |-
      Het college van burgemeester en wethouders, het Uitvoeringsinstituut werknemersverzekeringen en de krachtens
      [artikel 2, derde lid][ref1], aangewezen rechtspersoon gebruiken het burgerservicenummer, bedoeld in
      [artikel 1, onder b, van de Wet algemene bepalingen burgerservicenummer][ref2], bij de verwerking van
      persoonsgegevens voor de uitvoering van deze wet, indien dat nodig is voor de uitvoering van deze wet of voor de
      uitvoering van andere wetten, waarbij gebruik wordt gemaakt van dat burgerservicenummer.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022428#Artikel1
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0022428
        artikel: '1'
  - number: 15a
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van het
      college aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel15a
  - number: '16'
    text: |-
      Met ingang van de datum van inwerkingtreding van deze wet worden de dienstbetrekkingen, die op de dag voorafgaande
      aan die datum bestaan krachtens de Wet Sociale Werkvoorziening zoals deze luidde tot die datum en die na die datum
      voortbestaan, aangemerkt als dienstbetrekking in de zin van deze wet.
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel16
  - number: '19'
    text: |-
      Tenzij hij daartoe verzoekt behoeft de persoon, die op 31 december 1997 een dienstbetrekking heeft krachtens de Wet
      Sociale Werkvoorziening zoals deze luidde op die datum, zolang de dienstbetrekking voortduurt, niet overeenkomstig
      [artikel 11, tweede lid][ref1], te worden geherindiceerd.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel11
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '11'
        hoofdstuk: '5'
  - number: '20.1'
    text: |-
      Indien op de datum van inwerkingtreding van [artikel 10, eerste lid][ref1], de werknemer ingezetene is van een
      andere gemeente dan de gemeente waarvan het college ten behoeve van hem subsidie als bedoeld in [artikel 7][ref2]
      verstrekt, treedt het college van de gemeente waarvan de werknemer ingezetene is per die datum bij de toepassing
      van [dat artikel][ref3] in de plaats van het andere college.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0008903#Artikel7
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '10'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0008903
        artikel: '7'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0008903
        artikel: '7'
        hoofdstuk: '3'
  - number: '20.2'
    text: |-
      Indien op de datum van inwerkingtreding van [artikel 10, tweede lid][ref1], de werknemer in een dienstbetrekking
      staat tot het college van een andere gemeente dan de gemeente waarvan hij ingezetene is betaalt het college
      van de gemeente waarvan de betrokkene ingezetene is vanaf die datum aan het andere college een overeenkomstig
      [artikel 10, derde lid][ref2], berekende vergoeding voorzover zijn dienstbetrekking met dat college voortduurt.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Artikel10
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '10'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0008903
        artikel: '10'
        hoofdstuk: '4'
  - number: '21'
    text: |-
      De verordeningen, bedoeld in de [artikelen 2, derde lid][ref1], en [7, tiende lid][ref2], treden uiterlijk zes
      maanden na de datum van inwerkingtreding van artikel I, onderdeel B, respectievelijk artikel I, onderdeel G, van de
      Wet van 20 december 2007 tot wijziging van de Wet sociale werkvoorziening in verband met een betere realisering van
      de met die wet beoogde doelen (Stb. 564) in werking.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Artikel7
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008903
        artikel: '7'
        hoofdstuk: '3'
  - number: '46'
    text: |-
      Onze Minister zendt na drie jaar na inwerkingtreding van deze wet en vervolgens telkens na vier jaar aan de Staten-
      Generaal een verslag van de doeltreffendheid en doelmatigheid van deze wet.
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel46
  - number: '47'
    text: De Wet Sociale Werkvoorziening wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel47
  - number: '48'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel48
  - number: '49'
    text: 'Deze wet wordt aangehaald als: Wet sociale werkvoorziening.'
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel49
