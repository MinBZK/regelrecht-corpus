  - number: '9.2'
    text: |-
      Verlies van ingezetenschap van de gemeente heeft geen invloed op de toepassing van het eerste lid, zolang de
      dienstbetrekking voortduurt tot en met het kalenderjaar na het jaar waarin het ingezetenschap is verloren. Indien
      de werknemer buiten Nederland gaat wonen heeft het verlies van ingezetenschap geen invloed op de toepassing van
      het eerste lid zolang de dienstbetrekking voortduurt tot en met het kalenderjaar na het jaar waarin hij wederom in
      Nederland gaat wonen.
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel9
  - number: '9.3'
    text: |-
      Onze Minister doet binnen een jaar na ontvangst van de verantwoordingsinformatie, bedoeld in
      [artikel 13, eerste lid][ref1], mededeling van terugvordering op grond van het eerste lid aan het college.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel13
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '13'
        hoofdstuk: '6'
  - number: '9.4'
    text: |-
      Indien de verantwoordingsinformatie, bedoeld in [artikel 13, eerste lid][ref1], niet door Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties is ontvangen binnen twaalf maanden na het kalenderjaar waarop zij
      betrekking heeft, wordt de uitkering met betrekking tot het desbetreffende kalenderjaar op nihil vastgesteld
      en wordt de reeds betaalde uitkering teruggevorderd. Indien volledige terugvordering naar het oordeel van
      Onze Minister leidt tot een onbillijkheid van overwegende aard, stelt Onze Minister de terugvordering vast op
      een percentage van de uitkering. Onze Minister doet binnen drie maanden na de in de eerste zin bedoelde datum
      mededeling van terugvordering aan het college.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel13
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '13'
        hoofdstuk: '6'
  - number: 9a
    text: |-
      In afwijking van [artikel 7:11 van de Algemene wet bestuursrecht][ref1], wordt bij de toepassing van de
      [artikelen 8, tweede lid][ref2], en [9][ref3] gebruikgemaakt van de gegevens in de bijlage, bedoeld in
      [artikel 13, vierde lid][ref4], en de informatie, bedoeld in [artikel 1, tweede lid, onderdeel a][ref5], waarvan
      Onze Minister kennis heeft op 15 augustus voor zover het betreft artikel 8, tweede lid, en 30 september voor zover
      het betreft artikel 9 van het tweede jaar volgend op het verantwoordingsjaar, met dien verstande dat gegevens die
      het college op verzoek van Onze Minister op een latere datum verstrekt mede in aanmerking worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0008903#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0008903#Artikel13
      [ref5]: https://wetten.overheid.nl/BWBR0008903#Artikel1
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref2
