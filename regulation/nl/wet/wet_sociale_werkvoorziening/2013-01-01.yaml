preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe regels te stellen inzake de sociale
    werkvoorziening, onder meer inzake de doelgroep, de indicatiestelling, voorzieningen voor begeleid werken, de
    rechtspositie van de werknemers en de bekostiging;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: arbeidshandicap: het vanwege lichamelijke,
      verstandelijke of psychische beperkingen verminderd vermogen om arbeid te verrichten; arbeidshandicapcategorie:
      een groep van tot de doelgroep behorende personen, die in dezelfde orde arbeidsgehandicapt is; college:
      college van burgemeester en wethouders; dienstbetrekking: een arbeidsovereenkomst als bedoeld in
      [artikel 610, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1]; doelgroep: personen, die nog niet
      de pensioengerechtigde leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref2],
      hebben bereikt en die door lichamelijke, verstandelijke of psychische beperkingen uitsluitend onder aangepaste
      omstandigheden tot regelmatige arbeid in staat zijn; geïndiceerd: blijkens een indicatiebeschikking of
      herindicatiebeschikking als bedoeld in [artikel 11][ref3] tot de doelgroep behoren; gerealiseerd arbeidsjaar:
      het equivalent van een dienstbetrekking op basis van een volledige werkweek die het gehele kalenderjaar
      is vervuld door een geïndiceerde ingezetene of een daarmee gelijkgestelde, gebaseerd op het gemiddelde
      van de twaalf eindemaandsstanden; Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;
      Uitvoeringsinstituut werknemersverzekeringen: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref4]; werknemer: degene die een
      dienstbetrekking heeft als bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel610
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
      [ref3]: https://wetten.overheid.nl/BWBR0008903#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
