      [ref7]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk2
      [ref8]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk3
      [ref9]: https://wetten.overheid.nl/BWBR0008903#Artikel8
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel9
    references:
