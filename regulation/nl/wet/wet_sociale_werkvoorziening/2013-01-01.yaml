  - number: '1.3'
    text: |-
      Het college draagt er zorg voor dat aan zoveel mogelijk ingezetenen die geïndiceerd zijn, een dienstbetrekking
      wordt aangeboden voor het verrichten van arbeid onder aangepaste omstandigheden.
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel1
  - number: '1.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld voor de bepaling van de doelgroep, de
      arbeidshandicapcategorieën en de gerealiseerde arbeidsjaren.
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel1
  - number: '2.1'
    text: |-
      Het college kan ter uitvoering van [artikel 1, derde lid][ref1], aan een ingezetene die geïndiceerd is een
      dienstbetrekking aanbieden voor het verrichten van arbeid onder aangepaste omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel1
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '1'
        hoofdstuk: '1'
  - number: '2.2'
    text: |-
      Het college kan een privaatrechtelijke rechtspersoon aanwijzen ten behoeve van de uitvoering van deze wet.
      Het college regelt in het aanwijzingsbesluit de inhoud van de rechtsbetrekking tussen zichzelf en de betrokken
      rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel2
  - number: '2.3'
    text: |-
      De gemeenteraad stelt bij verordening regels over de wijze waarop de ingezetenen die geïndiceerd zijn of hun
      vertegenwoordigers worden betrokken bij de uitvoering van deze wet, waarbij in ieder geval wordt geregeld de wijze
      waarop:
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel2
  - number: 2.3.a
    text: periodiek overleg wordt gevoerd met deze ingezetenen of hun vertegenwoordigers;
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel2
  - number: 2.3.b
    text: deze ingezetenen of vertegenwoordigers onderwerpen voor de agenda van dit overleg kunnen aanmelden;
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel2
  - number: 2.3.c
    text: zij worden voorzien van de voor een adequate deelname aan het overleg benodigde informatie.
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel2
  - number: '3.1'
    text: |-
      De arbeid, bedoeld in [artikel 2, eerste lid][ref1], is gericht op het behouden dan wel het bevorderen van de
      arbeidsbekwaamheid van de werknemer mede met het oog op het kunnen gaan verrichten van arbeid onder normale
      omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel2
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '2'
        hoofdstuk: '2'
  - number: '3.2'
    text: |-
      Bij de aanpassing van de omstandigheden, bedoeld in [artikel 2, eerste lid][ref1], wordt rekening gehouden met het
      advies ter zake dat in de indicatiebeschikking of herindicatiebeschikking is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel2
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '2'
        hoofdstuk: '2'
  - number: '4'
    text: |-
      Het college bevordert de inschakeling in het arbeidsproces van de werknemers van wie bij herindicatiebeschikking is
      vastgesteld dat zij in staat zijn om arbeid te verrichten onder normale omstandigheden. Het college werkt hierbij
      samen met het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel4
  - number: '5'
    text: |-
      Het college bedingt voor de door zijn werknemer verrichte arbeid dan wel voor ten gevolge van zijn arbeid geleverde
      goederen of diensten een vergoeding, die de concurrentieverhoudingen niet onverantwoord mag beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel5
  - number: '6.1'
    text: |-
      De werknemer is verplicht mee te werken aan het behoud dan wel het bevorderen van zijn arbeidsbekwaamheid en aan
      het verkrijgen van arbeid onder normale omstandigheden, voor zover hij daartoe in staat wordt geacht.
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel6
  - number: '6.2'
    text: |-
      Zo nodig in afwijking van de [artikelen 670][ref1] en
      [670a van titel 10 van Boek 7 van het Burgerlijk Wetboek][ref2], zegt het college uit eigen beweging, dan wel
      onverwijld op een daartoe strekkend verzoek van het college van de gemeente dat een vergoeding als bedoeld in
      [artikel 10, tweede lid][ref3], betaalt, de dienstbetrekking op, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel670
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel670a
      [ref3]: https://wetten.overheid.nl/BWBR0008903#Artikel10
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '670'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: 670a
      - id: ref3
        bwb_id: BWBR0008903
        artikel: '10'
        hoofdstuk: '4'
  - number: 6.2.a
    text: |-
      zijn werknemer niet meewerkt aan een herindicatie overeenkomstig de daaromtrent bij of krachtens algemene maatregel
      van bestuur gestelde regels;
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel6
  - number: 6.2.b
    text: |-
      zijn werknemer blijkens een onaantastbaar geworden herindicatiebeschikking niet langer tot de doelgroep behoort,
      en wel zodra voor hem een alternatieve opvangmogelijkheid feitelijk beschikbaar is of door zijn toedoen niet
      beschikbaar komt, dan wel zodra hij een aanbod tot passende arbeid onder normale omstandigheden heeft geweigerd;
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel6
  - number: 6.2.c
    text: zijn werknemer niet voldoet aan het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel6
  - number: '6.3'
    text: |-
      Voordat het college de dienstbetrekking opzegt wegens een andere reden dan genoemd in de onderdelen a en b van het
      tweede lid, vraagt het advies van het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel6
  - number: '7.1'
    text: |-
      Indien een werkgever met een ingezetene die geïndiceerd is een dienstbetrekking als bedoeld in
      [artikel 1, derde lid][ref1], aangaat, en de inpassing in de arbeid van betrokkene, met inbegrip van begeleiding op
      zijn werkplek, adequaat wordt verzorgd kan het college:


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel1
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '1'
        hoofdstuk: '1'
  - number: 7.1.a
    text: aan de werkgever een subsidie verstrekken; en
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel7
  - number: 7.1.b
    text: |-
      aan de begeleidingsorganisatie een vergoeding verstrekken voor de noodzakelijke kosten van arbeidsinpassing met
      inbegrip van de begeleiding van de geïndiceerde op zijn werkplek.
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel7
  - number: '7.2'
    text: |-
      Op verzoek van de ingezetene die geïndiceerd is verstrekt het college in ieder geval een periodieke subsidie aan de
      werkgever aan wie op grond van het eerste lid subsidie kan worden verstrekt alsmede aan de begeleidingsorganisatie
      een periodieke vergoeding voor de noodzakelijke kosten van de begeleiding op de werkplek indien:
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel7
  - number: 7.2.a
    text: |-
      betrokkene een werknemer is of met inachtneming van [artikel 12][ref1] en de daarop berustende regels recht heeft
      op aanbieding van een dienstbetrekking als bedoeld in [artikel 2, eerste lid][ref2], door het college; en


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Artikel2
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '12'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0008903
        artikel: '2'
        hoofdstuk: '2'
  - number: 7.2.b
    text: het bedrag van de subsidie en de vergoeding omgerekend op jaarbasis niet meer bedraagt dan
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel7
  - number: '7.3'
    text: |-
      Indien op grond van het tweede lid een periodieke subsidie wordt verleend kan het college aan de werkgever een
      vergoeding verstrekken voor de eenmalige noodzakelijke kosten van aanpassing van de omstandigheden waaronder de
      arbeid wordt verricht.
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel7
  - number: '7.4'
    text: |-
      Het college kan op verzoek van de ingezetene die geïndiceerd is en die het college schriftelijk heeft
      meegedeeld in verband met het tweede lid een werkgever te zullen zoeken, een door die ingezetene aangewezen
      begeleidingsorganisatie inschakelen ten behoeve van de totstandkoming van een dienstbetrekking.
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel7
  - number: '7.5'
    text: |-
      Een periodieke subsidie op grond van dit artikel wordt, in afwijking van
      [artikel 4:32 van de Algemene wet bestuursrecht][ref1], verleend zolang de dienstbetrekking duurt en de inpassing
      in de arbeid van betrokkene, met inbegrip van begeleiding op zijn werkplek, adequaat wordt verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '7.6'
    text: |-
      Zo nodig in afwijking van het vijfde lid worden de periodieke subsidie en de periodieke vergoeding voor de
      noodzakelijke kosten van de begeleiding op de werkplek beëindigd:
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel7
  - number: 7.6.a
    text: |-
      indien de werknemer blijkens een onaantastbaar geworden herindicatiebeschikking niet langer tot de doelgroep
      behoort, zodra voor hem een alternatieve opvangmogelijkheid feitelijk beschikbaar is of door zijn toedoen niet
      beschikbaar komt dan wel zodra hij een aanbod tot passende arbeid onder normale omstandigheden heeft geweigerd;
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel7
  - number: 7.6.b
    text: |-
      indien de werknemer niet meewerkt aan een herindicatie overeenkomstig de daaromtrent bij of krachtens algemene
      maatregel van bestuur gestelde regels;
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel7
  - number: 7.6.c
    text: |-
      indien de werknemer niet voldoet aan [artikel 6, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel6
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '6'
        hoofdstuk: '2'
  - number: '7.7'
    text: |-
      Zo nodig in afwijking van de [artikelen 670][ref1] en
      [670a van titel 10 van Boek 7 van het Burgerlijk Wetboek][ref2] kan de werkgever de dienstbetrekking opzeggen
      indien de periodieke subsidie op grond van het zesde lid niet langer wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel670
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel670a
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '670'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: 670a
  - number: '7.8'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de
      toepassing van het eerste tot en met vierde lid.
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel7
  - number: '7.9'
    text: |-
      De voordracht voor een krachtens het achtste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel7
  - number: '7.10'
    text: |-
      De gemeenteraad stelt bij verordening nadere regels met betrekking tot de toepassing van het tweede tot en met het
      vierde lid door het college. De regels, bedoeld in de eerste zin, hebben in ieder geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel7
  - number: 7.10.a
    text: de wijze waarop de hoogte van de periodieke subsidie aan de werkgever dient te worden vastgesteld;
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel7
  - number: 7.10.b
    text: |-
      de hoogte van de voor het college rechtstreeks aan de subsidieverlening verbonden uitvoeringskosten omgerekend
      op jaarbasis;
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel7
  - number: 7.10.c
    text: |-
      de voorwaarden waaronder het college aan de werkgever een vergoeding verstrekt voor de eenmalige noodzakelijke
      kosten van aanpassing van de omstandigheden waaronder arbeid wordt verricht; en
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel7
  - number: 7.10.d
    text: |-
      de voorwaarden waaronder het college een begeleidingsorganisatie inschakelt die door de Wsw-geïndiceerde zelf is
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel7
  - number: '8.1'
    text: |-
      Onze Minister verstrekt jaarlijks ten laste van ’s Rijks kas aan het college een uitkering voor de uitvoering
      van de [hoofdstukken 2][ref1] en [3][ref2]. De uitkering wordt ten minste drie maanden voorafgaand aan het
      kalenderjaar waarop zij betrekking heeft door Onze Minister vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008903
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008903
        hoofdstuk: '3'
  - number: '8.2'
    text: |-
      Het bedrag van de uitkering wordt, overeenkomstig bij of krachtens algemene maatregel van bestuur te stellen
      regels, berekend aan de hand van het voor ieder jaar bij wet vast te stellen totale bedrag dat beschikbaar is voor
      de uitkeringen, bedoeld in het eerste lid. Daarbij wordt, overeenkomstig bij of krachtens de algemene maatregel van
      bestuur te stellen regels, het bijbehorende minimumaantal arbeidsjaren vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel8
  - number: '8.3'
    text: |-
      Onze Minister kan de hoogte van de uitkering wijzigen voor zover dat verband houdt met een na de datum van de
      vaststelling van de uitkering getroffen maatregel, die voor alle gemeenten gelijk werkt.
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel8
  - number: '8.4'
    text: Bij ministeriële regeling worden regels gesteld met betrekking tot de betaling van de uitkering.
    url: https://wetten.overheid.nl/BWBR0008903/2013-01-01#Artikel8
  - number: '9.1'
    text: |-
      Indien uit de verantwoordingsinformatie, bedoeld in [artikel 13, eerste lid][ref1], blijkt dat in het
      kalenderjaar waarop de uitkering betrekking heeft het aantal in dat jaar gerealiseerde arbeidsjaren uit
      dienstbetrekkingen als bedoeld in de [hoofdstukken 2][ref2] en [3][ref3] minder bedraagt dan het op grond van
      [artikel 8, tweede lid][ref4], vastgestelde minimumaantal arbeidsjaren, wordt van de uitkering teruggevorderd:
      ( A – B ) x C A waarbij: A staat voor het op grond van [artikel 8, tweede lid][ref5], vastgestelde aantal bij de
      uitkering, bedoeld in [artikel 8, eerste lid][ref6], behorende minimumaantal arbeidsjaren; B staat voor het aantal
      gerealiseerde arbeidsjaren uit dienstbetrekkingen als bedoeld in de [hoofdstukken 2][ref7] en [3][ref8]; C staat
      voor de uitkering bedoeld in [artikel 8, eerste lid][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk3
      [ref4]: https://wetten.overheid.nl/BWBR0008903#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0008903#Artikel8
