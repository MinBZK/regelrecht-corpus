---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_sociale_werkvoorziening
regulatory_layer: WET
publication_date: '2011-10-18'
valid_from: '2003-02-19'
bwb_id: BWBR0008903
url: https://wetten.overheid.nl/BWBR0008903/2003-02-19
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe regels te stellen inzake de sociale
    werkvoorziening, onder meer inzake de doelgroep, de indicatiestelling, voorzieningen voor begeleid werken, de
    rechtspositie van de werknemers en de bekostiging;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel1
  - number: 1.1.a
    text: |-
      doelgroep: personen, die nog niet de leeftijd van 65 jaar hebben bereikt en die door lichamelijke, verstandelijke
      of psychische beperkingen uitsluitend onder aangepaste omstandigheden tot regelmatige arbeid in staat zijn;
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel1
  - number: 1.1.b
    text: |-
      arbeidshandicap: het vanwege lichamelijke, verstandelijke of psychische beperkingen verminderd vermogen om arbeid
      te verrichten;
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel1
  - number: 1.1.c
    text: |-
      arbeidshandicapcategorie: een groep van tot de doelgroep behorende personen, die in dezelfde orde
      arbeidsgehandicapt is;
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel1
  - number: 1.1.d
    text: |-
      dienstbetrekking: een dienstbetrekking met de gemeente als bedoeld in [hoofdstuk 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008903
        hoofdstuk: '2'
  - number: 1.1.e
    text: 'werknemer: degene die een dienstbetrekking heeft;'
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel1
  - number: 1.1.f
    text: |-
      Uitvoeringsinstituut werknemersverzekeringen: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '5'
  - number: 1.1.g
    text: |-
      Centrale organisatie werk en inkomen: de Centrale organisatie werk en inkomen, genoemd in
      [hoofdstuk 4 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '4'
  - number: 1.1.h
    text: 'Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid.'
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel1
  - number: '1.2'
    text: |-
      Indien bij een gemeenschappelijke regeling als bedoeld in de [Wet gemeenschappelijke regelingen][ref1] de
      uitvoering van deze wet volledig is overgedragen aan het bestuur van een openbaar lichaam als bedoeld in
      [artikel 8][ref2] van die wet, treedt dat bestuur voor de toepassing van deze wet in de plaats van de betrokken
      gemeentebesturen.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel8
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003740
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '8'
  - number: '1.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld voor de bepaling van de doelgroep en
      de arbeidshandicapcategorieën.
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel1
  - number: '2.1'
    text: |-
      De gemeente draagt er zorg voor dat zij aan zoveel mogelijk ingezetenen, die blijkens een indicatiebeschikking
      of herindicatiebeschikking tot de doelgroep behoren, een dienstbetrekking krachtens arbeidsovereenkomst naar
      burgerlijk recht aanbiedt voor het verrichten van arbeid onder aangepaste omstandigheden. Deze dienstbetrekking is
      een arbeidsovereenkomst als bedoeld in [artikel 610, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel610
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '610'
  - number: '2.2'
    text: |-
      Op de arbeidsovereenkomst, bedoeld in het eerste lid, zijn de bepalingen van
      [titel 10 van Boek 7 van het Burgerlijk Wetboek][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005290
  - number: '2.3'
    text: |-
      Het gemeentebestuur kan een rechtspersoon aanwijzen ten behoeve van de uitvoering van deze wet. Het gemeentebestuur
      regelt in het aanwijzingsbesluit de inhoud van de rechtsbetrekking tussen de gemeente en de betrokken
      rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel2
  - number: '2.4'
    text: |-
      Bij ministeriële regeling kunnen, met het oog op een goede verdeling van de beschikbare dienstbetrekkingen over
      de ingezetenen die tot de doelgroep behoren, nadere regels worden gesteld met betrekking tot de volgorde van
      aanbieding van een dienstbetrekking.
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel2
  - number: '3.1'
    text: |-
      De arbeid, bedoeld in [artikel 2, eerste lid][ref1], is gericht op het behouden dan wel het bevorderen van de
      arbeidsbekwaamheid van de werknemer mede met het oog op het kunnen gaan verrichten van arbeid onder normale
      omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel2
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '2'
        hoofdstuk: '2'
  - number: '3.2'
    text: |-
      Bij de aanpassing van de omstandigheden, bedoeld in [artikel 2, eerste lid][ref1], wordt rekening gehouden met het
      advies ter zake dat in de indicatiebeschikking of herindicatiebeschikking is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel2
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '2'
        hoofdstuk: '2'
  - number: '3.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld inzake de aanpassing van de omstandigheden, bedoeld in
      [artikel 2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel2
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '2'
        hoofdstuk: '2'
  - number: '4.1'
    text: |-
      De gemeente, het Uitvoeringsinstituut werknemersverzekeringen en de Centrale organisatie werk en inkomen werken
      samen om de inschakeling in het arbeidsproces te bevorderen van de werknemers van wie de verwachting bestaat dat
      zij in staat zullen zijn om binnen een jaar arbeid te verrichten onder normale omstandigheden en bij de toepassing
      van [artikel 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel7
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '7'
        hoofdstuk: '3'
  - number: '4.2'
    text: Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld voor de uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel4
  - number: '5'
    text: |-
      De gemeente bedingt voor de door de werknemer verrichte arbeid dan wel voor ten gevolge van zijn arbeid geleverde
      goederen of diensten een vergoeding, die de concurrentieverhoudingen niet onverantwoord mag beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel5
  - number: '6.1'
    text: |-
      De werknemer is verplicht mee te werken aan het behoud dan wel het bevorderen van zijn arbeidsbekwaamheid en aan
      het verkrijgen van arbeid onder normale omstandigheden, voor zover hij daartoe in staat wordt geacht.
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel6
  - number: '6.2'
    text: |-
      Onverminderd de bepalingen van titel 10 van Boek 7 van het Burgerlijk Wetboek, wordt de dienstbetrekking opgezegd,
      indien:
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel6
  - number: 6.2.a
    text: |-
      de werknemer niet meewerkt aan een herindicatie overeenkomstig de daaromtrent bij of krachtens algemene maatregel
      van bestuur gestelde regels;
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel6
  - number: 6.2.b
    text: |-
      de werknemer blijkens een onaantastbaar geworden herindicatiebeschikking niet langer tot de doelgroep behoort, en
      wel zodra voor hem een alternatieve opvangmogelijkheid feitelijk beschikbaar is dan wel zodra hij een aanbod tot
      passende arbeid onder normale omstandigheden heeft geweigerd;
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel6
  - number: 6.2.c
    text: de werknemer niet voldoet aan het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel6
  - number: '6.3'
    text: |-
      Voordat de gemeente de dienstbetrekking opzegt wegens een andere reden dan genoemd in de onderdelen *a* en *b* van
      het tweede lid, vraagt zij advies van de commissie, bedoeld in [artikel 12, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel12
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '12'
        hoofdstuk: '5'
  - number: '6.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het advies, de
      werkwijze en de samenstelling van de commissie bij haar taak op grond van het derde lid.
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel6
  - number: '7.1'
    text: |-
      De gemeente kan een subsidie verstrekken aan een werkgever, die met een ingezetene die blijkens een
      indicatiebeschikking of herindicatiebeschikking tot de doelgroep behoort, een arbeidsovereenkomst sluit, indien:
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel7
  - number: 7.1.a
    text: in de beschikking is aangegeven, dat die ingezetene in aanmerking komt voor toepassing van dit hoofdstuk; en
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel7
  - number: 7.1.b
    text: |-
      de inpassing in de arbeid van betrokkene, met inbegrip van de begeleiding op zijn werkplek, wordt verzorgd door
      personen, die verbonden zijn aan een rechtspersoon die tot doel heeft een dergelijke inpassing en begeleiding te
      verrichten.
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel7
  - number: '7.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de toepassing van
      dit artikel.
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel7
  - number: '7.3'
    text: |-
      Een krachtens het tweede lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan acht
      weken na de datum van uitgifte van het *Staatsblad* waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel7
  - number: '8.1'
    text: |-
      Het Rijk verstrekt aan de gemeente overeenkomstig dit hoofdstuk een subsidie voor de uitvoering van
      [de hoofdstukken 2][ref1], [3][ref2] en [5][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008903
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008903
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0008903
        hoofdstuk: '5'
  - number: '8.2'
    text: |-
      Onze Minister verleent vóór 1 oktober van ieder jaar de subsidie, waarop elke gemeente over het daaropvolgende jaar
      recht heeft.
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel8
  - number: '8.3'
    text: |-
      De hoogte van de subsidie wordt, overeenkomstig bij of krachtens algemene maatregel van bestuur gestelde regels en
      na overleg met een representatieve vertegenwoordiging van de gemeenten, bepaald aan de hand van:
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel8
  - number: 8.3.a
    text: |-
      een door Onze Minister voor elke gemeente vast te stellen aantal dienstbetrekkingen op basis van een volledige
      werkweek dan wel arbeidsovereenkomsten op grond van [artikel 7][ref1], onderscheiden naar arbeidshandicapcategorie,
      en rekening houdend met het aantal ingezetenen die blijkens een indicatiebeschikking of herindicatiebeschikking tot
      de onderscheiden arbeidshandicapcategorieën binnen de doelgroep behoren;


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel7
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '7'
        hoofdstuk: '3'
  - number: 8.3.b
    text: |-
      een door Onze Minister jaarlijks vast te stellen bedrag per arbeidsovereenkomst als bedoeld in [artikel 7][ref1]
      en per dienstbetrekking als bedoeld in onderdeel *a*, dat voor elke arbeidshandicapcategorie verschillend kan
      worden vastgesteld, rekening houdend met de verwachte loonkostenontwikkelingen, uitvoeringskosten en opbrengsten
      voortvloeiend uit de dienstbetrekkingen;


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel7
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '7'
        hoofdstuk: '3'
  - number: 8.3.c
    text: de aan de gemeente verleende subsidie over het voorafgaande jaar.
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel8
  - number: '8.4'
    text: |-
      Een krachtens het derde lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan acht
      weken na de datum van uitgifte van het *Staatsblad* waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel8
  - number: '8.5'
    text: |-
      Dienstbetrekkingen aangegaan na de inwerkingtreding van deze wet komen voor subsidie in aanmerking ter hoogte
      van een bij of krachtens algemene maatregel van bestuur te bepalen gedeelte van de subsidie die geldt voor een
      dienstbetrekking op basis van een volledige werkweek.
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel8
  - number: '8.6'
    text: |-
      Onze Minister kan de hoogte van de subsidie wijzigen voor zover dat verband houdt met een na de datum van de
      subsidieverlening getroffen maatregel op het terrein van de arbeidsvoorwaarden, de sociale zekerheid of de
      belastingen, die voor alle gemeenten gelijk werkt.
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel8
  - number: '8.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de wijze van betaling van
      de subsidie.
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel8
  - number: '9.1'
    text: |-
      Na afloop van het jaar stelt Onze Minister de subsidie vast. De vastgestelde subsidie kan van de verleende subsidie
      afwijken, voor zover:
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel9
  - number: 9.1.a
    text: |-
      de som van de produkten van het, op basis van een volledige werkweek berekende, aantal in dat jaar gerealiseerde
      arbeidsjaren uit dienstbetrekkingen en arbeidsovereenkomsten als bedoeld in [de hoofdstukken 2][ref1] en
      [3][ref2] in elke arbeidshandicapcategorie en het bij die arbeidshandicapcategorie behorende bedrag als bedoeld in
      [artikel 8, derde lid][ref3], minder bedraagt dan de verleende subsidie;


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0008903#Artikel8
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008903
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008903
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0008903
        artikel: '8'
        hoofdstuk: '4'
  - number: 9.1.b
    text: |-
      de dienstbetrekking met een werknemer, nadat is vastgesteld dat hij niet langer tot de doelgroep behoort, in strijd
      met [artikel 6, tweede lid, onderdeel ][ref1], langer wordt voortgezet dan de voor hem geldende opzegtermijn;


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel6
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '6'
        hoofdstuk: '2'
  - number: 9.1.c
    text: |-
      het gemeentebestuur niet handelt in overeenstemming met de bij of krachtens deze wet gestelde regels, of daarop
      niet dan wel onvoldoende toeziet, met uitzondering van [de artikelen 2, eerste en derde lid][ref1], en [5][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Artikel5
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008903
        artikel: '5'
        hoofdstuk: '2'
  - number: 9.1.d
    text: |-
      de subsidie in het jaar na het jaar waarin hij is verleend anders is bestemd dan voor de uitvoering van deze wet of
      voor de inschakeling van werkzoekenden in het arbeidsproces of binnen een redelijke termijn niet overeenkomstig die
      bestemming feitelijk is besteed.
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel9
  - number: '9.2'
    text: |-
      Verlies van ingezetenschap in de gemeente heeft geen invloed op de toepassing van onderdeel a van het eerste lid,
      zolang de dienstbetrekking of de arbeidsovereenkomst, bedoeld in [artikel 7][ref1], voortduurt.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel7
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '7'
        hoofdstuk: '3'
  - number: '9.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de subsidievaststelling en de gevolgen
      daarvan voor de subsidieverlening voor de komende jaren.
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel9
  - number: '10'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot een subsidie
      van het Rijk aan de gemeenten in verband met de inkoop door de gemeenten van diensten in het kader van
      arbeidsbemiddeling ten behoeve van de werknemers.
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel10
  - number: '11.1'
    text: |-
      Het gemeentebestuur stelt van personen, die voor indicatie zijn aangemeld dan wel die zich daartoe hebben
      aangemeld, gehoord de commissie, bedoeld in [artikel 12][ref1], bij beschikking vast:


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel12
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '12'
        hoofdstuk: '5'
  - number: 11.1.a
    text: of deze behoren tot de doelgroep;
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel11
  - number: 11.1.b
    text: |-
      nadat is vastgesteld dat een persoon tot de doelgroep behoort, de indeling van de persoon in één van de
      arbeidshandicapcategorieën, die bepaald worden door de zwaarte van de aanpassing van de omstandigheden en de
      produktiviteit;
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel11
  - number: 11.1.c
    text: welke aanpassing van omstandigheden nodig is bij het verrichten van arbeid door de betrokkene;
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel11
  - number: 11.1.d
    text: |-
      of de betrokkene in aanmerking komt voor toepassing van [hoofdstuk 3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008903
        hoofdstuk: '3'
  - number: 11.1.e
    text: of de betrokkene in aanmerking komt voor een scholingstraject.
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel11
  - number: '11.2'
    text: |-
      Het gemeentebestuur verricht periodiek herindicatie van personen overeenkomstig de krachtens
      [artikel 6, tweede lid, onderdeel ][ref1], gestelde regels, gehoord de commissie, bedoeld in [artikel 12][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Artikel12
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '6'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008903
        artikel: '12'
        hoofdstuk: '5'
  - number: '11.3'
    text: |-
      Indicatie vindt slechts plaats met betrekking tot personen die als werkzoekende staan ingeschreven bij de Centrale
      organisatie werk en inkomen, dan wel personen, die reeds een dienstbetrekking hebben en die voor herindicatie in
      aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel11
  - number: '11.4'
    text: Het gemeentebestuur beheert een lijst van ingezetenen die tot de doelgroep behoren.
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel11
  - number: '11.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de krachtens dit
      artikel aan de gemeente opgedragen taken en de wijze van uitoefening daarvan.
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel11
  - number: '11.6'
    text: |-
      Een krachtens het vijfde lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan acht
      weken na de datum van uitgifte van het *Staatsblad* waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel11
  - number: '12.1'
    text: |-
      Het gemeentebestuur stelt een onafhankelijke commissie in dan wel wijst een onafhankelijke commissie aan, die haar,
      na het verrichten van een onderzoek, adviseert omtrent de indicatie, bedoeld in [artikel 11, eerste lid][ref1], en
      de herindicatie, bedoeld in [artikel 11, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Artikel11
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '11'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0008903
        artikel: '11'
        hoofdstuk: '5'
  - number: '12.2'
    text: |-
      In de commissie hebben in elk geval zitting een arbeidskundige, een arbeidsmarktdeskundige, een arts en een
      psycholoog. Ambtenaren in dienst van de gemeente dan wel personen in dienst van de rechtspersoon, bedoeld in
      [artikel 2, derde lid][ref1], maken geen deel uit van de commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel2
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '2'
        hoofdstuk: '2'
  - number: '12.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het advies en de
      werkwijze van de commissie.
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel12
  - number: '12.4'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de deskundigheid van de leden van
      de commissie, de verdere samenstelling van de commissie en de onverenigbaarheid van andere functies met het
      lidmaatschap van de commissie.
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel12
  - number: '12.5'
    text: |-
      Het gemeentebestuur draagt zorg voor de ondersteuning van de commissie, waarbij in elk geval aandacht wordt besteed
      aan de kwaliteitszorg, zulks met in achtneming van bij ministeriële regeling te stellen regels.
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel12
  - number: '13.1'
    text: Onze Minister is verantwoordelijk voor het toezicht op de uitvoering van deze wet door het gemeentebestuur.
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel13
  - number: '13.2'
    text: |-
      Dit toezicht wordt onder gezag van Onze Minister uitgeoefend door de Inspectie Werk en Inkomen,
      genoemd in [hoofdstuk 7 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1],
      onder leiding van het hoofd van die inspectie. De [artikelen 37][ref2], [38][ref3], [42][ref4] en
      [44 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel38
      [ref4]: https://wetten.overheid.nl/BWBR0013060#Artikel42
      [ref5]: https://wetten.overheid.nl/BWBR0013060#Artikel44
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '37'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '38'
      - id: ref4
        bwb_id: BWBR0013060
        artikel: '42'
      - id: ref5
        bwb_id: BWBR0013060
        artikel: '44'
  - number: '13.3'
    text: |-
      Onze Minister kan een gemeentebestuur aanwijzingen geven met betrekking tot de uitvoering van deze wet door dat
      gemeentebestuur. Hij treedt daarbij niet in individuele gevallen.
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel13
  - number: '13.4'
    text: |-
      Ten behoeve van het toezicht, bedoeld in het eerste lid, dient het gemeentebestuur jaarlijks bij Onze
      Minister een verslag in over de uitvoering van deze wet. Het verslag omvat mede een kostenopgave ten behoeve
      van de subsidievaststelling. Het verslag is voorzien van een verklaring van de accountant, belast met de in
      [artikel 213 van de Gemeentewet][ref1] voorgeschreven controle omtrent de juistheid en volledigheid van verstrekte
      gegevens. Het verslag wordt kosteloos verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel213
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '213'
  - number: '13.5'
    text: |-
      Het gemeentebestuur, de krachtens [artikel 2, derde lid][ref1], aangewezen rechtspersoon en de commissie, bedoeld
      in [artikel 12][ref2], verstrekken ten behoeve van het toezicht desgevraagd aan Onze Minister kosteloos nadere of
      andere informatie en verlenen hem inzage in de administratie.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Artikel12
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008903
        artikel: '12'
        hoofdstuk: '5'
  - number: '13.6'
    text: |-
      De administratie moet zodanig worden ingericht en gevoerd, dat alle van belang zijnde vastleggingen en
      bewijsstukken ten behoeve van het besluitvormings-, uitvoerings-, controle- en verantwoordingsproces zichtbaar en
      controleerbaar zijn vastgelegd.
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel13
  - number: '13.7'
    text: |-
      Bij ministeriële regeling worden regels gesteld inzake het verslag en over de verklaring en het onderzoek dat
      resulteert in deze verklaring.
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel13
  - number: '14.1'
    text: |-
      Het gemeentebestuur, de krachtens [artikel 2, derde lid][ref1], aangewezen rechtspersoon en de commissie, bedoeld
      in [artikel 12][ref2], verstrekken desgevraagd aan Onze Minister kosteloos alle inlichtingen, die hij nodig heeft
      voor de informatievoorziening en de beleidsvorming met betrekking tot deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Artikel12
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008903
        artikel: '12'
        hoofdstuk: '5'
  - number: '14.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld voor de inhoud, de wijze van verstrekken en het tijdstip van
      het verstrekken van de inlichtingen.
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel14
  - number: '15.1'
    text: |-
      Andere gemeentebesturen, de krachtens [artikel 2, derde lid][ref1], aangewezen rechtspersonen, de Centrale
      organisatie werk en inkomen en het Uitvoeringsinstituut werknemersverzekeringen zijn bevoegd uit eigen beweging en
      verplicht op verzoek, kosteloos, aan het gemeentebestuur en de krachtens [artikel 2, derde lid][ref2], aangewezen
      rechtspersoon alle gegevens en inlichtingen te verstrekken, die noodzakelijk zijn voor de uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Artikel2
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008903
        artikel: '2'
        hoofdstuk: '2'
  - number: '15.2'
    text: |-
      Het gemeentebestuur en de krachtens [artikel 2, derde lid][ref1], aangewezen rechtspersoon zijn bevoegd uit
      eigen beweging en verplicht op verzoek uit de administratie aangelegd voor de uitvoering van deze wet kosteloos
      aan bestuursorganen de gegevens te verstrekken die noodzakelijk zijn voor de bij of krachtens wet aan deze
      bestuursorganen opgedragen taken.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel2
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '2'
        hoofdstuk: '2'
  - number: '15.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor de toepassing van het eerste en tweede lid nadere
      regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel15
  - number: '15.4'
    text: |-
      Een ieder verstrekt desgevraagd aan het gemeentebestuur, de krachtens [artikel 2, derde lid][ref1], aangewezen
      rechtspersoon en de commissie, bedoeld in [artikel 12][ref2] kosteloos alle gegevens en inlichtingen die
      noodzakelijk zijn voor de uitvoering van deze wet ten opzichte van hemzelf, hem in wiens dienst dan wel ten behoeve
      van wie hij werkt of gewerkt heeft of hem die in zijn dienst dan wel te zijnen behoeve werkt of gewerkt heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Artikel12
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008903
        artikel: '12'
        hoofdstuk: '5'
  - number: '15.5'
    text: |-
      Het gemeentebestuur, de krachtens [artikel 2, derde lid][ref1], aangewezen rechtspersoon
      en de commissie, bedoeld in [artikel 12][ref2] kunnen het sociaal-fiscaalnummer, bedoeld in
      [artikel 2, derde lid, onderdeel j, van de Algemene wet inzake rijksbelastingen][ref3], opnemen in een
      persoonsregistratie aangelegd voor de uitvoering van deze wet en daarvan gebruik maken, indien dat nodig is voor
      de uitvoering van deze wet of voor de uitvoering van andere wetten, waarbij gebruik wordt gemaakt van dat sociaal-
      fiscaalnummer.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel2
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008903
        artikel: '12'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '2'
  - number: '16.1'
    text: |-
      Met ingang van de datum van inwerkingtreding van deze wet worden de dienstbetrekkingen, die op de dag voorafgaande
      aan die datum bestaan krachtens de Wet Sociale Werkvoorziening zoals deze luidde tot die datum en die na die datum
      voortbestaan, aangemerkt als dienstbetrekking in de zin van deze wet.
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel16
  - number: '16.2'
    text: |-
      De rechten en verplichtingen, voortvloeiend uit een tot die datum bestaande dienstbetrekking, blijven in stand
      totdat met de werknemer anders wordt overeengekomen dan wel met betrekking tot die dienstbetrekking een collectieve
      arbeidsovereenkomst van toepassing wordt.
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel16
  - number: '16.3'
    text: |-
      Tot de rechten en verplichtingen, bedoeld in het tweede lid, behoren ook die betreffende de aanspraken op pensioen,
      uitkeringen in verband met aanvullende oudedagsvoorziening en uitkeringen in verband met vrijwillig vervroegde
      uittreding, vastgesteld door de stichtingen bedoeld in artikel 30*a* van de Wet Sociale Werkvoorziening, zoals
      deze luidde tot de datum van inwerkingtreding van deze wet; het ten aanzien van die stichtingen bepaalde, met
      uitzondering van de artikelen 30, en 30, blijft na de datum van inwerkingtreding van deze wet eveneens van
      toepassing, zolang de in dit lid geregelde aanspraken van de werknemers niet bij collectieve arbeidsovereenkomst
      zijn geregeld.
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel16
  - number: '16.4'
    text: Van rechtsvorderingen met betrekking tot de toepassing van dit artikel neemt de kantonrechter kennis.
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel16
  - number: '16.5'
    text: |-
      De gemeente verschaft aan de werknemers informatie omtrent de rechtspositie en de arbeidsvoorwaarden die voor hen
      gelden met ingang van de datum van inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel16
  - number: '17'
    text: 'Het recht zoals dat voor de datum van inwerkingtreding van deze wet gold blijft van toepassing ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel17
  - number: 17.a
    text: |-
      de vergoeding van het Rijk aan de gemeenten over tijdvakken voorafgaande aan die datum alsmede ten aanzien van
      de uitvoering over die tijdvakken door de stichtingen, bedoeld in artikel 30*a*, eerste lid, van de Wet Sociale
      Werkvoorziening zoals deze luidde tot die datum;
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel17
  - number: 17.b
    text: |-
      de mogelijkheid om bezwaar te maken of beroep in te stellen tegen een besluit dat is genomen op grond van de Wet
      Sociale Werkvoorziening zoals deze luidde tot die datum en dat voor die datum is bekendgemaakt;
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel17
  - number: 17.c
    text: |-
      de behandeling van bezwaar of beroep dat voor die datum is gemaakt onderscheidenlijk ingesteld tegen een besluit op
      grond van de Wet Sociale Werkvoorziening zoals deze luidde tot die datum.
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel17
  - number: '18'
    text: |-
      Voor de eerste toepassing van [artikel 8][ref1] wordt, overeenkomstig bij of krachtens algemene maatregel van
      bestuur gestelde regels, rekening gehouden met het aantal dienstbetrekkingen, die op de dag voorafgaande aan de
      datum van inwerkingtreding van deze wet bestaan krachtens de Wet Sociale Werkvoorziening zoals deze luidde tot
      die datum.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel8
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '8'
        hoofdstuk: '4'
  - number: '19'
    text: |-
      Personen, die op de dag voorafgaande aan de datum van inwerkingtreding van deze wet een dienstbetrekking
      hebben krachtens de Wet Sociale Werkvoorziening zoals deze luidde tot die datum, behoeven, zolang de
      dienstbetrekking voortduurt, niet overeenkomstig [de hoofdstukken 2][ref1] en [5][ref2] te worden geïndiceerd;
      [artikel 6, derde lid][ref3], is echter wel van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0008903#Artikel6
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0008903
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008903
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0008903
        artikel: '6'
        hoofdstuk: '2'
  - number: '20'
    text: |-
      Uiterlijk twee jaar na de datum van inwerkingtreding van deze wet dienen voor ondernemingen waarvoor organen
      van overleg, ingesteld krachtens de Wet Sociale Werkvoorziening zoals deze luidde tot die datum, functioneren,
      ondernemingsraden ten behoeve van werknemers in de zin van deze wet te zijn ingesteld. De bestaande organen van
      overleg houden op te bestaan op de datum waarop de ondernemer een ondernemingsraad ten behoeve van werknemers in de
      zin van deze wet heeft ingesteld voor het organisatieonderdeel waarvoor het orgaan van overleg is ingesteld of mede
      voor dat organisatieonderdeel, doch uiterlijk twee jaar na de datum van inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel20
  - number: '21'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met het oog op een goede invoering van deze wet in geval een
      gemeentebestuur op de datum van inwerkingtreding van deze wet deelneemt aan meerdere gemeenschappelijke regelingen
      voor de uitvoering van de sociale werkvoorziening.
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel21
  - number: '46'
    text: |-
      Onze Minister zendt na drie jaar na inwerkingtreding van deze wet en vervolgens telkens na vier jaar aan de Staten-
      Generaal een verslag van de doeltreffendheid en doelmatigheid van deze wet.
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel46
  - number: '47'
    text: De Wet Sociale Werkvoorziening wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel47
  - number: '48'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008903/2003-02-19#Artikel48
