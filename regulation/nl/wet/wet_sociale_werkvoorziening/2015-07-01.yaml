  - number: '14'
    text: |-
      1 Het college en het Uitvoeringsinstituut werknemersverzekeringen verstrekken desgevraagd aan Onze Minister
      kosteloos alle inlichtingen, die hij nodig heeft voor de informatievoorziening en de beleidsvorming met betrekking
      tot deze wet.

      2 Bij ministeriële regeling kunnen regels worden gesteld voor de inhoud, de wijze van verstrekken en het tijdstip
      van het verstrekken van de inlichtingen.
    url: https://wetten.overheid.nl/BWBR0008903/2015-07-01#Artikel14
  - number: '15'
    text: |-
      1 Andere colleges, de krachtens [artikel 2, tweede lid][ref1], aangewezen rechtspersonen en het
      Uitvoeringsinstituut werknemersverzekeringen zijn bevoegd uit eigen beweging en verplicht op verzoek, kosteloos,
      aan het college en de krachtens [artikel 2, tweede lid][ref2], aangewezen rechtspersoon alle gegevens en
      inlichtingen te verstrekken, die noodzakelijk zijn voor de uitvoering van deze wet.

      2 Het college en de krachtens [artikel 2, tweede lid][ref3], aangewezen rechtspersoon zijn bevoegd uit eigen
      beweging en verplicht op verzoek uit de administratie aangelegd voor de uitvoering van deze wet kosteloos
      aan bestuursorganen de gegevens te verstrekken die noodzakelijk zijn voor de bij of krachtens wet aan deze
      bestuursorganen opgedragen taken.

      3 Bij of krachtens algemene maatregel van bestuur kunnen voor de toepassing van het eerste en tweede lid nadere
      regels worden gesteld.

      4 Een ieder verstrekt desgevraagd aan het college, het Uitvoeringsinstituut werknemersverzekeringen en de krachtens
      [artikel 2, tweede lid][ref4], aangewezen rechtspersoon kosteloos alle gegevens en inlichtingen die noodzakelijk
      zijn voor de uitvoering van deze wet ten opzichte van hemzelf, hem in wiens dienst dan wel ten behoeve van wie hij
      werkt of gewerkt heeft of hem die in zijn dienst dan wel te zijnen behoeve werkt of gewerkt heeft.

      5 Het college van burgemeester en wethouders, het Uitvoeringsinstituut werknemersverzekeringen en de
      krachtens [artikel 2, derde lid][ref5], aangewezen rechtspersoon gebruiken het burgerservicenummer, bedoeld
      in [artikel 1, onder b, van de Wet algemene bepalingen burgerservicenummer][ref6], bij de verwerking van
      persoonsgegevens voor de uitvoering van deze wet, indien dat nodig is voor de uitvoering van deze wet of voor de
      uitvoering van andere wetten, waarbij gebruik wordt gemaakt van dat burgerservicenummer.


