  - number: 15a
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van het
      college aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0008903/2015-07-01#Artikel15a
  - number: '16'
    text: |-
      Met ingang van de datum van inwerkingtreding van deze wet worden de dienstbetrekkingen, die op de dag voorafgaande
      aan die datum bestaan krachtens de Wet Sociale Werkvoorziening zoals deze luidde tot die datum en die na die datum
      voortbestaan, aangemerkt als dienstbetrekking in de zin van deze wet.
    url: https://wetten.overheid.nl/BWBR0008903/2015-07-01#Artikel16
  - number: '19'
    text: |-
      1 [Artikel 11, eerste lid][ref1], is van overeenkomstige toepassing op de persoon die op 31 december 1997 een
      dienstbetrekking heeft krachtens de Wet Sociale Werkvoorziening zoals deze luidde op die datum, indien hij tijdens
      die dienstbetrekking om een herindicatie verzoekt.

      2 Met betrekking tot de uitkering aan het college voor de uitvoering van de
      [hoofdstukken 2][ref2] en [3][ref3] over de kalenderjaren gelegen voor de inwerkingtreding van
      [artikel II, onderdeel A, van de Invoeringswet Participatiewet][ref4] blijven de [artikelen 8][ref5], [9][ref6] en
      [9a][ref7] en de daarop berustende bepalingen, zoals deze luidden op de dag voor inwerkingtreding van artikel II,
      onderdeel A, van de Invoeringswet Participatiewet, van toepassing.

      3 Op een aanvraag tot indicatie die minimaal 16 weken voorafgaand aan de dag van inwerkingtreding van
      [artikel II, onderdeel A, van de Invoeringswet Participatiewet][ref8] is ingediend en waarop niet is beslist
      voor die dag van inwerkingtreding, wordt beslist met toepassing van de Wet sociale werkvoorziening en
      [artikel 30d van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref9] en de daarop berustende bepalingen,
      zoals die luidden op die dag voor inwerkingtreding.

      4 Op een bezwaar- of beroepschrift dat is gericht tegen een door het Uitvoeringsinstituut
      werknemersverzekeringen genomen besluit op een aanvraag als bedoeld in het derde lid en waarop op de
      dag voor inwerkingtreding van [artikel II, onderdeel A, van de Invoeringswet Participatiewet][ref10]
      nog niet onherroepelijk is beslist, wordt beslist met toepassing van de Wet sociale werkvoorziening en
      [artikel 30d van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref11] en de daarop berustende
      bepalingen, zoals die luidden op de dag voor inwerkingtreding van artikel II, onderdeel A, van de Invoeringswet
      Participatiewet.


