        artikel: '670'
  - number: '7'
    text: |-
      1 Indien een werkgever met een ingezetene die geïndiceerd is een dienstbetrekking voor het verrichten van arbeid
      onder aangepaste omstandigheden aangaat, en de inpassing in de arbeid van betrokkene, met inbegrip van begeleiding
      op zijn werkplek, adequaat wordt verzorgd kan het college:

      a. aan de werkgever een subsidie verstrekken; en

      b. aan de begeleidingsorganisatie een vergoeding verstrekken voor de noodzakelijke kosten van arbeidsinpassing met
      inbegrip van de begeleiding van de geïndiceerde op zijn werkplek.

      2 Een periodieke subsidie op grond van dit artikel wordt, in afwijking van
      [artikel 4:32 van de Algemene wet bestuursrecht][ref1], verleend zolang de dienstbetrekking duurt en de inpassing
      in de arbeid van betrokkene, met inbegrip van begeleiding op zijn werkplek, adequaat wordt verzorgd.

      3 Zo nodig in afwijking van het tweede lid worden de periodieke subsidie en de periodieke vergoeding voor de
      noodzakelijke kosten van de begeleiding op de werkplek beëindigd:

      a. indien de werknemer blijkens een onaantastbaar geworden herindicatiebeschikking niet langer tot de doelgroep
      behoort, zodra voor hem een alternatieve opvangmogelijkheid feitelijk beschikbaar is of door zijn toedoen niet
      beschikbaar komt dan wel zodra hij een aanbod tot passende arbeid onder normale omstandigheden heeft geweigerd;

      b. indien de werknemer niet meewerkt aan een herindicatie overeenkomstig de daaromtrent bij of krachtens algemene
      maatregel van bestuur gestelde regels;

      c. indien de werknemer niet voldoet aan [artikel 6, eerste lid][ref2].

      4 Zo nodig in afwijking van [artikel 670 van Boek 7 van het Burgerlijk Wetboek][ref3] kan de werkgever de
      dienstbetrekking opzeggen indien de periodieke subsidie op grond van het derde lid niet langer wordt verleend.

      5 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de
      toepassing van het eerste lid.

      6 De voordracht voor een krachtens het vijfde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel432
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Artikel6
