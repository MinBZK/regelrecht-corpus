  - number: '11'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen verricht op aanvraag van het college periodiek herindicatie
      van geïndiceerden overeenkomstig de krachtens [artikel 6, tweede lid, onderdeel a][ref1], gestelde regels en stelt
      daarbij bij beschikking van geïndiceerden vast:

      a. of deze behoren tot de doelgroep;

      b. nadat is vastgesteld dat een geïndiceerde tot de doelgroep behoort:

      1°. de geldigheidsduur van de indicatie;

      2°. de indeling van de geïndiceerde in één van de arbeidshandicapcategorieën, die bepaald worden door de zwaarte
      van de aanpassing van de omstandigheden en de productiviteit.

      2 Op aanvraag van het college verricht het Uitvoeringsinstituut werknemersverzekeringen, overeenkomstig de
      krachtens [artikel 6, tweede lid, onderdeel a][ref2], gestelde regels, herindicatie van de werknemer die de
      bedongen arbeid gedurende een ononderbroken periode van ten minste 13 weken niet heeft verricht omdat hij in
      verband met ongeschiktheid ten gevolge van ziekte daartoe verhinderd was en die naar het inzicht van het college
      duurzaam niet in staat zal zijn tot het verrichten van arbeid onder aangepaste omstandigheden. Het eerste lid is
      van overeenkomstige toepassing.

      3 Een herindicatiebeschikking wordt gegeven binnen zestien weken na ontvangst van de aanvraag.

      4 In afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref3] beslist het
      Uitvoeringsinstituut werknemersverzekeringen binnen zestien weken gerekend vanaf de dag na die waarop de termijn
      voor het indienen van het bezwaarschrift tegen een indicatiebeschikking of herindicatiebeschikking is verstreken.

      5 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de bij of
      krachtens dit artikel aan het Uitvoeringsinstituut werknemersverzekeringen opgedragen taak en de wijze van
      uitoefening daarvan.

      6 De voordracht voor een krachtens het vijfde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel710
