  - number: '2'
    text: |-
      1 Het college kan aan een ingezetene die geïndiceerd is een dienstbetrekking aanbieden voor het verrichten van
      arbeid onder aangepaste omstandigheden.

      2 Het college kan een privaatrechtelijke rechtspersoon aanwijzen ten behoeve van de uitvoering van deze wet.
      Het college regelt in het aanwijzingsbesluit de inhoud van de rechtsbetrekking tussen zichzelf en de betrokken
      rechtspersoon.

      3 De gemeenteraad stelt bij verordening regels over de wijze waarop de ingezetenen die geïndiceerd zijn of hun
      vertegenwoordigers worden betrokken bij de uitvoering van deze wet, waarbij in ieder geval wordt geregeld de wijze
      waarop:

      a. periodiek overleg wordt gevoerd met deze ingezetenen of hun vertegenwoordigers;

      b. deze ingezetenen of vertegenwoordigers onderwerpen voor de agenda van dit overleg kunnen aanmelden;

      c. zij worden voorzien van de voor een adequate deelname aan het overleg benodigde informatie.
    url: https://wetten.overheid.nl/BWBR0008903/2015-07-01#Artikel2
  - number: '3'
    text: |-
      1 De arbeid, bedoeld in [artikel 2, eerste lid][ref1], is gericht op het behouden dan wel het bevorderen van
      de arbeidsbekwaamheid van de werknemer mede met het oog op het kunnen gaan verrichten van arbeid onder normale
      omstandigheden.

      2 Bij de aanpassing van de omstandigheden, bedoeld in [artikel 2, eerste lid][ref2], wordt rekening gehouden met
      het advies ter zake dat in de indicatiebeschikking of herindicatiebeschikking is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Artikel2
