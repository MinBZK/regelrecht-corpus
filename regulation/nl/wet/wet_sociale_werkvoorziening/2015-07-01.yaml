preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe regels te stellen inzake de sociale
    werkvoorziening, onder meer inzake de doelgroep, de indicatiestelling, voorzieningen voor begeleid werken, de
    rechtspositie van de werknemers en de bekostiging;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008903/2015-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      arbeidshandicap: het vanwege lichamelijke, verstandelijke of psychische beperkingen verminderd vermogen om arbeid
      te verrichten;

      arbeidshandicapcategorie: een groep van tot de doelgroep behorende personen, die in dezelfde orde
      arbeidsgehandicapt is;

      college: college van burgemeester en wethouders;

      dienstbetrekking: een arbeidsovereenkomst als bedoeld in
      [artikel 610, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1];

      doelgroep: personen, die nog niet de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref2], hebben bereikt en die door lichamelijke,
      verstandelijke of psychische beperkingen uitsluitend onder aangepaste omstandigheden tot regelmatige arbeid in
      staat zijn;

      geïndiceerd: blijkens een indicatiebeschikking of herindicatiebeschikking als bedoeld in [artikel 11][ref3]
      tot de doelgroep behoren en op de dag voor inwerkingtreding van [artikel II, onderdeel A, van de Invoeringswet
      Participatiewet](onbekend) een dienstbetrekking hebben als bedoeld in [artikel 2, eerste lid][ref4], of
      [artikel 7][ref5];

      gerealiseerd arbeidsjaar: het equivalent van een dienstbetrekking op basis van een volledige werkweek die het
      gehele kalenderjaar is vervuld door een geïndiceerde ingezetene of een daarmee gelijkgestelde, gebaseerd op het
      gemiddelde van de twaalf eindemaandsstanden;

      Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;

      Uitvoeringsinstituut werknemersverzekeringen: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref6];

      werknemer: de geïndiceerde die een dienstbetrekking heeft als bedoeld in [artikel 2, eerste lid][ref7], of
      [artikel 7][ref8].

      2 Indien bij een gemeenschappelijke regeling als bedoeld in de [Wet gemeenschappelijke regelingen][ref9]
      de uitvoering van deze wet volledig is overgedragen aan het bestuur van een openbaar lichaam als bedoeld in
      [artikel 8 van die wet][ref10], treedt dat bestuur voor de toepassing van deze wet, met uitzondering van de
      [artikelen 8][ref11] en [14, eerste lid][ref12], in de plaats van de betrokken colleges.

      3 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld voor de bepaling van de doelgroep en
      de arbeidshandicapcategorieën.


