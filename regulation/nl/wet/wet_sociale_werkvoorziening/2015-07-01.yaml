  - number: '12'
    text: |-
      1 Het college kan de indicatiebeschikking of herindicatiebeschikking van een betrokkene intrekken indien:

      a. betrokkene passende arbeid in dienstbetrekking onder aangepaste omstandigheden weigert;

      b. de dienstbetrekking van betrokkene door het college is opgezegd op grond van
      [artikel 6, tweede lid, onderdeel a of c][ref1], of door de werkgever, bedoeld in [artikel 7][ref2], in verband met
      de toepassing van artikel 7, derde lid, onderdeel b of c, vanaf het moment dat de opzegging rechtens onaantastbaar
      is;

      c. de dienstbetrekking van betrokkene door het college of de werkgever, bedoeld in [artikel 7][ref3], is opgezegd
      om een dringende reden in de zin van [artikel 678 van Boek 7 van het Burgerlijk Wetboek][ref4] en de werknemer ter
      zake een verwijt kan worden gemaakt, vanaf het moment dat de opzegging rechtens onaantastbaar is;

      d. de dienstbetrekking op verzoek van betrokkene is geëindigd; of

      e. betrokkene niet beschikbaar is om een dienstbetrekking voor het verrichten van arbeid onder aangepaste
      omstandigheden te aanvaarden.

      2 De indicatiebeschikking of herindicatiebeschikking vervalt:

      a. per de dag dat betrokkene de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref5], bereikt; of

      b. indien betrokkene overlijdt.

      3 Het college trekt de indicatiebeschikking of herindicatiebeschikking van een betrokkene in op schriftelijk
      verzoek van de betrokkene aan het college per de datum van dat verzoek.


