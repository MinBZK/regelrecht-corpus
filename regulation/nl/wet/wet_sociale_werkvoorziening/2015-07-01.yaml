  - number: '4'
    text: |-
      Het college bevordert de inschakeling in het arbeidsproces van de werknemers van wie bij herindicatiebeschikking is
      vastgesteld dat zij in staat zijn om arbeid te verrichten onder normale omstandigheden. Het college werkt hierbij
      samen met het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0008903/2015-07-01#Artikel4
  - number: '5'
    text: |-
      Het college bedingt voor de door zijn werknemer verrichte arbeid dan wel voor ten gevolge van zijn arbeid geleverde
      goederen of diensten een vergoeding, die de concurrentieverhoudingen niet onverantwoord mag beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0008903/2015-07-01#Artikel5
  - number: '6'
    text: |-
      1 De werknemer is verplicht mee te werken aan het behoud dan wel het bevorderen van zijn arbeidsbekwaamheid en aan
      het verkrijgen van arbeid onder normale omstandigheden, voor zover hij daartoe in staat wordt geacht.

      2 Zo nodig in afwijking van [artikel 670 van Boek 7 van het Burgerlijk Wetboek][ref1] zegt het college uit eigen
      beweging de dienstbetrekking op, indien:

      a. zijn werknemer niet meewerkt aan een herindicatie overeenkomstig de daaromtrent bij of krachtens algemene
      maatregel van bestuur gestelde regels;

      b. zijn werknemer blijkens een onaantastbaar geworden herindicatiebeschikking niet langer tot de doelgroep behoort,
      en wel zodra voor hem een alternatieve opvangmogelijkheid feitelijk beschikbaar is of door zijn toedoen niet
      beschikbaar komt, dan wel zodra hij een aanbod tot passende arbeid onder normale omstandigheden heeft geweigerd;

      c. zijn werknemer niet voldoet aan het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel670
    url: https://wetten.overheid.nl/BWBR0008903/2015-07-01#Artikel6
    references:
