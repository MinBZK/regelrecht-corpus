        bwb_id: BWBR0008903
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008903
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0008903
        artikel: '6'
        hoofdstuk: '2'
  - number: '20'
    text: |-
      Uiterlijk twee jaar na de datum van inwerkingtreding van deze wet dienen voor ondernemingen waarvoor organen
      van overleg, ingesteld krachtens de Wet Sociale Werkvoorziening zoals deze luidde tot die datum, functioneren,
      ondernemingsraden ten behoeve van werknemers in de zin van deze wet te zijn ingesteld. De bestaande organen van
      overleg houden op te bestaan op de datum waarop de ondernemer een ondernemingsraad ten behoeve van werknemers in de
      zin van deze wet heeft ingesteld voor het organisatieonderdeel waarvoor het orgaan van overleg is ingesteld of mede
      voor dat organisatieonderdeel, doch uiterlijk twee jaar na de datum van inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0008903/2005-01-01#Artikel20
  - number: '21'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met het oog op een goede invoering van deze wet in geval een
      gemeentebestuur op de datum van inwerkingtreding van deze wet deelneemt aan meerdere gemeenschappelijke regelingen
      voor de uitvoering van de sociale werkvoorziening.
    url: https://wetten.overheid.nl/BWBR0008903/2005-01-01#Artikel21
  - number: '46'
    text: |-
      Onze Minister zendt na drie jaar na inwerkingtreding van deze wet en vervolgens telkens na vier jaar aan de Staten-
      Generaal een verslag van de doeltreffendheid en doelmatigheid van deze wet.
    url: https://wetten.overheid.nl/BWBR0008903/2005-01-01#Artikel46
  - number: '47'
    text: De Wet Sociale Werkvoorziening wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008903/2005-01-01#Artikel47
  - number: '48'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008903/2005-01-01#Artikel48
  - number: '49'
    text: 'Deze wet wordt aangehaald als: Wet sociale werkvoorziening.'
    url: https://wetten.overheid.nl/BWBR0008903/2005-01-01#Artikel49
