preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe regels te stellen inzake de sociale
    werkvoorziening, onder meer inzake de doelgroep, de indicatiestelling, voorzieningen voor begeleid werken, de
    rechtspositie van de werknemers en de bekostiging;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008903/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. doelgroep: personen, die nog niet de leeftijd van 65 jaar hebben bereikt en die door lichamelijke,
      verstandelijke of psychische beperkingen uitsluitend onder aangepaste omstandigheden tot regelmatige arbeid in
      staat zijn;

      b. arbeidshandicap: het vanwege lichamelijke, verstandelijke of psychische beperkingen verminderd vermogen om
      arbeid te verrichten;

      c. arbeidshandicapcategorie: een groep van tot de doelgroep behorende personen, die in dezelfde orde
      arbeidsgehandicapt is;

      d. dienstbetrekking: een dienstbetrekking met de gemeente als bedoeld in [hoofdstuk 2][ref1];

      e. werknemer: degene die een dienstbetrekking heeft;

      f. Uitvoeringsinstituut werknemersverzekeringen: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2];

      g. Centrale organisatie werk en inkomen: de Centrale organisatie werk en inkomen, genoemd in
      [hoofdstuk 4 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3];

      h. Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid.

      2 Indien bij een gemeenschappelijke regeling als bedoeld in de [Wet gemeenschappelijke regelingen][ref4]
      de uitvoering van deze wet volledig is overgedragen aan het bestuur van een openbaar lichaam als bedoeld in
      [artikel 8][ref5] van die wet, treedt dat bestuur voor de toepassing van deze wet in de plaats van de betrokken
      gemeentebesturen.

      3 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld voor de bepaling van de doelgroep en
      de arbeidshandicapcategorieën.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk2
