  - number: '3'
    text: |-
      1 De arbeid, bedoeld in [artikel 2, eerste lid][ref1], is gericht op het behouden dan wel het bevorderen van
      de arbeidsbekwaamheid van de werknemer mede met het oog op het kunnen gaan verrichten van arbeid onder normale
      omstandigheden.

      2 Bij de aanpassing van de omstandigheden, bedoeld in [artikel 2, eerste lid][ref2], wordt rekening gehouden met
      het advies ter zake dat in de indicatiebeschikking of herindicatiebeschikking is opgenomen.

      3 Bij ministeriële regeling kunnen regels worden gesteld inzake de aanpassing van de omstandigheden, bedoeld in
      [artikel 2, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel2
