  - number: '9'
    text: |-
      1 Na afloop van het jaar stelt Onze Minister de subsidie vast. De vastgestelde subsidie kan van de verleende
      subsidie afwijken, voor zover:

      a. de som van de produkten van het, op basis van een volledige werkweek berekende, aantal in dat jaar gerealiseerde
      arbeidsjaren uit dienstbetrekkingen en arbeidsovereenkomsten als bedoeld in [de hoofdstukken 2][ref1] en
      [3][ref2] in elke arbeidshandicapcategorie en het bij die arbeidshandicapcategorie behorende bedrag als bedoeld in
      [artikel 8, derde lid][ref3], minder bedraagt dan de verleende subsidie;

      b. de dienstbetrekking met een werknemer, nadat is vastgesteld dat hij niet langer tot de doelgroep behoort,
      in strijd met [artikel 6, tweede lid, onderdeel ][ref4], langer wordt voortgezet dan de voor hem geldende
      opzegtermijn;

      c. het gemeentebestuur niet handelt in overeenstemming met de bij of krachtens deze wet gestelde regels, of daarop
      niet dan wel onvoldoende toeziet, met uitzondering van [de artikelen 2, eerste en derde lid][ref5], en [5][ref6].

      2 Verlies van ingezetenschap in de gemeente heeft geen invloed op de toepassing van onderdeel a van het eerste lid,
      zolang de dienstbetrekking of de arbeidsovereenkomst, bedoeld in [artikel 7][ref7], voortduurt.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld voor de subsidievaststelling en de
      gevolgen daarvan voor de subsidieverlening voor de komende jaren.


