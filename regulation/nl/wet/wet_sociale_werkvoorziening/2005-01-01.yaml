  - number: '8'
    text: |-
      1 Het Rijk verstrekt aan de gemeente overeenkomstig dit hoofdstuk een subsidie voor de uitvoering van de
      [hoofdstukken 2][ref1] en [3][ref2].

      2 Onze Minister verleent vóór 1 oktober van ieder jaar de subsidie, waarop elke gemeente over het daaropvolgende
      jaar recht heeft.

      3 De hoogte van de subsidie wordt, overeenkomstig bij of krachtens algemene maatregel van bestuur gestelde regels
      en na overleg met een representatieve vertegenwoordiging van de gemeenten, bepaald aan de hand van:

      a. een door Onze Minister voor elke gemeente vast te stellen aantal dienstbetrekkingen op basis van een volledige
      werkweek dan wel arbeidsovereenkomsten op grond van [artikel 7][ref3], onderscheiden naar arbeidshandicapcategorie,
      en rekening houdend met het aantal ingezetenen die blijkens een indicatiebeschikking of herindicatiebeschikking tot
      de onderscheiden arbeidshandicapcategorieën binnen de doelgroep behoren;

      b. een door Onze Minister jaarlijks vast te stellen bedrag per arbeidsovereenkomst als bedoeld in [artikel 7][ref4]
      en per dienstbetrekking als bedoeld in onderdeel *a*, dat voor elke arbeidshandicapcategorie verschillend kan
      worden vastgesteld, rekening houdend met de verwachte loonkostenontwikkelingen, uitvoeringskosten en opbrengsten
      voortvloeiend uit de dienstbetrekkingen;

      c. de aan de gemeente verleende subsidie over het voorafgaande jaar.

      4 De voordracht voor een krachtens het derde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.

      5 Dienstbetrekkingen aangegaan na de inwerkingtreding van deze wet komen voor subsidie in aanmerking ter hoogte
      van een bij of krachtens algemene maatregel van bestuur te bepalen gedeelte van de subsidie die geldt voor een
      dienstbetrekking op basis van een volledige werkweek.

      6 Onze Minister kan de hoogte van de subsidie wijzigen voor zover dat verband houdt met een na de datum van
      de subsidieverlening getroffen maatregel op het terrein van de arbeidsvoorwaarden, de sociale zekerheid of de
      belastingen, die voor alle gemeenten gelijk werkt.

      7 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de wijze van betaling
      van de subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0008903#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0008903#Artikel7
