  - number: '16'
    text: |-
      1 Met ingang van de datum van inwerkingtreding van deze wet worden de dienstbetrekkingen, die op de dag
      voorafgaande aan die datum bestaan krachtens de Wet Sociale Werkvoorziening zoals deze luidde tot die datum en die
      na die datum voortbestaan, aangemerkt als dienstbetrekking in de zin van deze wet.

      2 De rechten en verplichtingen, voortvloeiend uit een tot die datum bestaande dienstbetrekking, blijven in stand
      totdat met de werknemer anders wordt overeengekomen dan wel met betrekking tot die dienstbetrekking een collectieve
      arbeidsovereenkomst van toepassing wordt.

      3 Tot de rechten en verplichtingen, bedoeld in het tweede lid, behoren ook die betreffende de aanspraken op
      pensioen, uitkeringen in verband met aanvullende oudedagsvoorziening en uitkeringen in verband met vrijwillig
      vervroegde uittreding, vastgesteld door de stichtingen bedoeld in artikel 30*a* van de Wet Sociale Werkvoorziening,
      zoals deze luidde tot de datum van inwerkingtreding van deze wet; het ten aanzien van die stichtingen bepaalde,
      met uitzondering van de artikelen 30, en 30, blijft na de datum van inwerkingtreding van deze wet eveneens van
      toepassing, zolang de in dit lid geregelde aanspraken van de werknemers niet bij collectieve arbeidsovereenkomst
      zijn geregeld.

      4 Van rechtsvorderingen met betrekking tot de toepassing van dit artikel neemt de kantonrechter kennis.

      5 De gemeente verschaft aan de werknemers informatie omtrent de rechtspositie en de arbeidsvoorwaarden die voor hen
      gelden met ingang van de datum van inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0008903/2005-01-01#Artikel16
  - number: '17'
    text: |-
      Het recht zoals dat voor de datum van inwerkingtreding van deze wet gold blijft van toepassing ten aanzien van:

      a. de vergoeding van het Rijk aan de gemeenten over tijdvakken voorafgaande aan die datum alsmede ten aanzien van
      de uitvoering over die tijdvakken door de stichtingen, bedoeld in artikel 30*a*, eerste lid, van de Wet Sociale
      Werkvoorziening zoals deze luidde tot die datum;

      b. de mogelijkheid om bezwaar te maken of beroep in te stellen tegen een besluit dat is genomen op grond van de Wet
      Sociale Werkvoorziening zoals deze luidde tot die datum en dat voor die datum is bekendgemaakt;

      c. de behandeling van bezwaar of beroep dat voor die datum is gemaakt onderscheidenlijk ingesteld tegen een besluit
      op grond van de Wet Sociale Werkvoorziening zoals deze luidde tot die datum.
    url: https://wetten.overheid.nl/BWBR0008903/2005-01-01#Artikel17
  - number: '18'
    text: |-
      Voor de eerste toepassing van [artikel 8][ref1] wordt, overeenkomstig bij of krachtens algemene maatregel van
      bestuur gestelde regels, rekening gehouden met het aantal dienstbetrekkingen, die op de dag voorafgaande aan de
      datum van inwerkingtreding van deze wet bestaan krachtens de Wet Sociale Werkvoorziening zoals deze luidde tot
      die datum.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel8
    url: https://wetten.overheid.nl/BWBR0008903/2005-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '8'
        hoofdstuk: '4'
  - number: '19'
    text: |-
      Personen, die op de dag voorafgaande aan de datum van inwerkingtreding van deze wet een dienstbetrekking
      hebben krachtens de Wet Sociale Werkvoorziening zoals deze luidde tot die datum, behoeven, zolang de
      dienstbetrekking voortduurt, niet overeenkomstig [de hoofdstukken 2][ref1] en [5][ref2] te worden geïndiceerd;
      [artikel 6, derde lid][ref3], is echter wel van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0008903#Artikel6
    url: https://wetten.overheid.nl/BWBR0008903/2005-01-01#Artikel19
    references:
