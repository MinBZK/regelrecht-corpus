  - number: '5'
    text: |-
      De gemeente bedingt voor de door de werknemer verrichte arbeid dan wel voor ten gevolge van zijn arbeid geleverde
      goederen of diensten een vergoeding, die de concurrentieverhoudingen niet onverantwoord mag beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0008903/2005-01-01#Artikel5
  - number: '6'
    text: |-
      1 De werknemer is verplicht mee te werken aan het behoud dan wel het bevorderen van zijn arbeidsbekwaamheid en aan
      het verkrijgen van arbeid onder normale omstandigheden, voor zover hij daartoe in staat wordt geacht.

      2 Onverminderd de bepalingen van [titel 10 van Boek 7 van het Burgerlijk Wetboek][ref1], wordt de dienstbetrekking
      opgezegd, indien:

      a. de werknemer niet meewerkt aan een herindicatie overeenkomstig de daaromtrent bij of krachtens algemene
      maatregel van bestuur gestelde regels;

      b. de werknemer blijkens een onaantastbaar geworden herindicatiebeschikking niet langer tot de doelgroep behoort,
      en wel zodra voor hem een alternatieve opvangmogelijkheid feitelijk beschikbaar is dan wel zodra hij een aanbod tot
      passende arbeid onder normale omstandigheden heeft geweigerd;

      c. de werknemer niet voldoet aan het eerste lid.

      3 Voordat de gemeente de dienstbetrekking opzegt wegens een andere reden dan genoemd in de onderdelen *a* en *b*
      van het tweede lid, vraagt zij advies van de Centrale organisatie werk en inkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0008903/2005-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005290
  - number: '7'
    text: |-
      1 De gemeente kan een subsidie verstrekken aan een werkgever, die met een ingezetene die blijkens een
      indicatiebeschikking of herindicatiebeschikking tot de doelgroep behoort, een arbeidsovereenkomst sluit, indien:

      a. in de beschikking is aangegeven, dat die ingezetene in aanmerking komt voor toepassing van dit hoofdstuk; en

      b. de inpassing in de arbeid van betrokkene, met inbegrip van begeleiding op zijn werkplek, adequaat wordt
      verzorgd.

      2 [Artikel 2, vierde lid][ref1], is van overeenkomstige toepassing.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de toepassing van
      het eerste lid.

      4 De voordracht voor een krachtens het derde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel2
    url: https://wetten.overheid.nl/BWBR0008903/2005-01-01#Artikel7
