  - number: '10'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot een subsidie
      van het Rijk aan de gemeenten in verband met de inkoop door de gemeenten van diensten in het kader van
      arbeidsbemiddeling ten behoeve van de werknemers.

      2 Bij ministeriële regeling kunnen, met het oog op een goede verdeling van de beschikbare dienstbetrekkingen
      of arbeidsovereenkomsten, bedoeld in [hoofdstuk 3][ref1], over de ingezetenen die tot de doelgroep behoren,
      nadere regels worden gesteld met betrekking tot de volgorde van aanbieding van een dienstbetrekking of een
      arbeidsovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk3
