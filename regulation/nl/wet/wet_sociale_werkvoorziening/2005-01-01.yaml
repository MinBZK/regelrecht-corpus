    text: |-
      1 De gemeente draagt er zorg voor dat zij aan zoveel mogelijk ingezetenen, die blijkens een door de
      Centrale organisatie werk en inkomen afgegeven indicatiebeschikking of herindicatiebeschikking, bedoeld in
      [artikel 11][ref1] tot de doelgroep behoren, een dienstbetrekking krachtens arbeidsovereenkomst naar burgerlijk
      recht aanbiedt voor het verrichten van arbeid onder aangepaste omstandigheden. Deze dienstbetrekking is een
      arbeidsovereenkomst als bedoeld in [artikel 610, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref2].

      2 Op de arbeidsovereenkomst, bedoeld in het eerste lid, zijn de bepalingen van
      [titel 10 van Boek 7 van het Burgerlijk Wetboek][ref3] van toepassing.

      3 Het gemeentebestuur kan een rechtspersoon aanwijzen ten behoeve van de uitvoering van deze wet. Het
      gemeentebestuur regelt in het aanwijzingsbesluit de inhoud van de rechtsbetrekking tussen de gemeente en de
      betrokken rechtspersoon.

      4 Het college van burgemeester en wethouders kan een indicatiebeschikking of herindicatiebeschikking intrekken
      als een persoon die tot de doelgroep behoort passende arbeid in dienstbetrekking onder aangepaste omstandigheden
      weigert.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel610
      [ref3]: https://wetten.overheid.nl/BWBR0005290
