    text: |-
      1 Het college van burgemeester en wethouders, de Centrale organisatie werk en inkomen en de krachtens
      [artikel 2, derde lid][ref1], aangewezen rechtspersoon verstrekken desgevraagd aan Onze Minister kosteloos alle
      inlichtingen, die hij nodig heeft voor de informatievoorziening en de beleidsvorming met betrekking tot deze wet.

      2 Bij ministeriële regeling kunnen regels worden gesteld voor de inhoud, de wijze van verstrekken en het tijdstip
      van het verstrekken van de inlichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel2
    url: https://wetten.overheid.nl/BWBR0008903/2005-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '2'
        hoofdstuk: '2'
  - number: '15'
    text: |-
      1 Andere gemeentebesturen, de krachtens [artikel 2, derde lid][ref1], aangewezen rechtspersonen, de Centrale
      organisatie werk en inkomen en het Uitvoeringsinstituut werknemersverzekeringen zijn bevoegd uit eigen beweging en
      verplicht op verzoek, kosteloos, aan het gemeentebestuur en de krachtens [artikel 2, derde lid][ref2], aangewezen
      rechtspersoon alle gegevens en inlichtingen te verstrekken, die noodzakelijk zijn voor de uitvoering van deze wet.

      2 Het gemeentebestuur en de krachtens [artikel 2, derde lid][ref3], aangewezen rechtspersoon zijn bevoegd uit
      eigen beweging en verplicht op verzoek uit de administratie aangelegd voor de uitvoering van deze wet kosteloos
      aan bestuursorganen de gegevens te verstrekken die noodzakelijk zijn voor de bij of krachtens wet aan deze
      bestuursorganen opgedragen taken.

      3 Bij of krachtens algemene maatregel van bestuur kunnen voor de toepassing van het eerste en tweede lid nadere
      regels worden gesteld.

      4 Een ieder verstrekt desgevraagd aan het college van burgemeester en wethouders, de Centrale organisatie werk
      en inkomen en de krachtens [artikel 2, derde lid][ref4], aangewezen rechtspersoon kosteloos alle gegevens en
      inlichtingen die noodzakelijk zijn voor de uitvoering van deze wet ten opzichte van hemzelf, hem in wiens dienst
      dan wel ten behoeve van wie hij werkt of gewerkt heeft of hem die in zijn dienst dan wel te zijnen behoeve werkt of
      gewerkt heeft.

      5 Het college van burgemeester en wethouders, de Centrale organisatie werk en inkomen en de krachtens
      [artikel 2, derde lid][ref5], aangewezen rechtspersoon gebruiken het sociaal-fiscaalnummer, bedoeld in
      [artikel 2, derde lid, onderdeel j, van de Algemene wet inzake rijksbelastingen][ref6], in een persoonsregistratie
      aangelegd voor de uitvoering van deze wet, indien dat nodig is voor de uitvoering van deze wet of voor de
      uitvoering van andere wetten, waarbij gebruik wordt gemaakt van dat sociaal-fiscaalnummer.


