  - number: '11'
    text: |-
      1 De Centrale organisatie werk en inkomen stelt van personen, die voor indicatie zijn aangemeld dan wel die zich
      daartoe hebben aangemeld bij beschikking vast:

      a. of deze behoren tot de doelgroep;

      b. nadat is vastgesteld dat een persoon tot de doelgroep behoort:

      1°. de geldigheidsduur van de indicatie;

      2°. de indeling van de persoon in één van de arbeidshandicapcategorieën, die bepaald worden door de zwaarte van de
      aanpassing van de omstandigheden en de productiviteit.

      2 De Centrale organisatie werk en inkomen verricht periodiek herindicatie van personen die tot de doelgroep behoren
      overeenkomstig de krachtens [artikel 6, tweede lid, onderdeel a][ref1], gestelde regels. Het eerste lid is van
      overeenkomstige toepassing.

      3 Indicatie vindt slechts plaats met betrekking tot personen die als werkzoekende staan ingeschreven bij de
      Centrale organisatie werk en inkomen, dan wel personen, die reeds een dienstbetrekking of een arbeidsovereenkomst
      als bedoeld in [hoofdstuk 3][ref2] hebben en die voor herindicatie in aanmerking komen.

      4 Het college van burgemeester en wethouders beheert een lijst van ingezetenen die tot de doelgroep behoren.

      5 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de bij of
      krachtens dit artikel aan de Centrale organisatie werk en inkomen of het college van burgemeester en wethouders van
      de gemeente opgedragen taak en de wijze van uitoefening daarvan.

      6 De voordracht voor een krachtens het vijfde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0008903/2005-01-01#Artikel11
