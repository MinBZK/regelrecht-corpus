---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_medefinanciering_aanvullende_arbeidsongeschiktheidsverzekeringen
regulatory_layer: WET
publication_date: '2006-05-09'
valid_from: '2006-01-01'
bwb_id: BWBR0006351
url: https://wetten.overheid.nl/BWBR0006351/2006-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is dat een rechtspersoon wordt aangewezen die aanvullende
    arbeidsongeschiktheidsverzekeringen tegen een maximum-premie aanbiedt aan categorieën van werknemers die een
    verhoogd arbeidsongeschiktheidsrisico en dat andere verzekeraars en pensioenfondsen bijdragen in de tekorten van
    deze rechtspersoon;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006351/2006-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006351/2006-01-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0006351/2006-01-01#Artikel1
  - number: 1.b
    text: |-
      aanvullende arbeidsongeschiktheidsverzekering: de overeenkomst van verzekering van het risico van inkomensderving
      ten gevolge van arbeidsongeschiktheid, waaruit, in aanvulling op een wettelijk geregelde loongerelateerde
      arbeidsongeschiktheidsuitkering, een aan het laatstverdiende loon gerelateerd recht op uitkering kan voortvloeien,
      met uitzondering van de overeenkomst van verzekering van uitsluitend het risico van inkomensderving ten
      gevolge van arbeidsongeschiktheid voor zover deze inkomensderving uitgaat boven 70% van het bedrag, bedoeld in
      [artikel 17, eerste lid, van de Wet financiering sociale verzekeringen][ref1], met betrekking tot een loontijdvak
      van een dag;


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel17
    url: https://wetten.overheid.nl/BWBR0006351/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '17'
  - number: 1.c
    text: 'verzekeraar: een verzekeraar:'
    url: https://wetten.overheid.nl/BWBR0006351/2006-01-01#Artikel1
  - number: 1.c.1°
    text: |-
      die in het bezit is van de ingevolge [artikel 24, eerste lid, van de Wet toezicht verzekeringsbedrijf 1993][ref1]
      vereiste vergunning of heeft voldaan aan de ingevolge de artikelen 37 of 38 van die wet vereiste procedure met
      betrekking tot een bijkantoor in Nederland; of


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel24
    url: https://wetten.overheid.nl/BWBR0006351/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '24'
  - number: 1.c.2°
    text: |-
      die heeft voldaan aan de vereiste procedure als bedoeld in de artikelen 111, eerste lid, onderdelen *a* tot en met
      *c*, of tweede lid, 113, eerste of vierde lid, 116, eerste lid, onderdelen *a* tot en met *c*, of derde lid, of
      118, tweede of vijfde lid, van genoemde wet indien het de aldaar bedoelde dienstverrichting naar Nederland betreft;
    url: https://wetten.overheid.nl/BWBR0006351/2006-01-01#Artikel1
  - number: 1.d
    text: 'pensioenfonds:'
    url: https://wetten.overheid.nl/BWBR0006351/2006-01-01#Artikel1
  - number: 1.d.1°
    text: |-
      een pensioenfonds als bedoeld in [artikel 1, eerste lid, onderdeel ][ref1], met uitzondering van een pensioenfonds
      dat uitsluitend toezeggingen als bedoeld in [artikel 2, derde lid, onderdeel ][ref2] uitvoert, en met uitzondering
      van een pensioenfonds als bedoeld in [artikel 1, zesde lid, van de Pensioen- en spaarfondsenwet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002089#Artikel1
    url: https://wetten.overheid.nl/BWBR0006351/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002089
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0002089
        artikel: '1'
  - number: 1.d.2°
    text: |-
      de door Onze Minister aangewezen rechtspersoon die fungeert als pensioenfonds voor werknemers in de zin van de
      [Wet sociale werkvoorziening][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008903
    url: https://wetten.overheid.nl/BWBR0006351/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008903
  - number: 1.e
    text: |-
      werknemer: een werknemer als bedoeld in de [artikelen 3, 4, 5, 7, 7][ref1] alsmede de persoon die op grond van
      artikel 81 van die wet is toegelaten tot de vrijwillige verzekering;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel3
    url: https://wetten.overheid.nl/BWBR0006351/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '3'
  - number: 1.f
    text: |-
      werkgever: een werkgever als bedoeld in de [artikelen 8][ref1], 9, [10][ref2] en
      [11 van de Wet op de arbeidsongeschiktheidsverzekering][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel11
    url: https://wetten.overheid.nl/BWBR0006351/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '11'
  - number: 1.g
    text: |-
      Pensioen- & Verzekeringskamer: de Pensioen- & Verzekeringskamer, bedoeld in
      [artikel 2 van de Wet toezicht verzekeringsbedrijf 1993][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel2
    url: https://wetten.overheid.nl/BWBR0006351/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '2'
  - number: 1.h
    text: |-
      Vereveningsinstantie: de Vereveningsinstantie, bedoeld in [artikel 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006351#Artikel6
    url: https://wetten.overheid.nl/BWBR0006351/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006351
        artikel: '6'
  - number: '2.1'
    text: |-
      Eén rechtspersoon met volledige rechtsbevoegdheid wordt door Onze Minister aangewezen en kan
      slechts door Onze Minister worden aangewezen indien deze uitsluitend tot doel heeft tegen een
      maximumpremie aanvullende arbeidsongeschiktheidsverzekeringen, waaruit een recht op uitkering kan
      voortvloeien tot ten hoogste 70% van het laatstverdiende loon en tot ten hoogste 70% van het in
      [artikel 17, eerste lid, van de Wet financiering sociale verzekeringen][ref1] bedoelde bedrag, met betrekking tot
      een loontijdvak van een dag, aan te bieden aan werknemers indien geldt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel17
    url: https://wetten.overheid.nl/BWBR0006351/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '17'
  - number: 2.1.a
    text: |-
      aan het door tussenkomst van hun werkgever geen aanvullende arbeidsongeschiktheidsverzekering is aangeboden en
      evenmin aan andere werknemers in dienst van hun werkgever door tussenkomst van hun werkgever een aanvullende
      arbeidsongeschiktheidsverzekering is aangeboden;
    url: https://wetten.overheid.nl/BWBR0006351/2006-01-01#Artikel2
  - number: 2.1.b
    text: |-
      voor hen, volgens door de aangewezen rechtspersoon te stellen maatstaven, een zodanig verhoogd risico van
      arbeidsongeschiktheid bestaat dat zij niet verzekerd kunnen worden bij een andere verzekeraar tegen een premie
      lager dan de in de aanhef bedoelde maximumpremie;
    url: https://wetten.overheid.nl/BWBR0006351/2006-01-01#Artikel2
  - number: 2.1.c
    text: |-
      zij zich vóór 1 december 1993 bij een andere dan de krachtens dit artikel aangewezen verzekeraar voor een
      aanvullende arbeidsongeschiktheidsverzekering hebben aangemeld of, indien het personen betreft die op grond
      van [artikel 81 van de Wet op de arbeidsongeschiktheidsverzekering][ref1] zijn toegelaten tot de vrijwillige
      verzekering, zij zich vóór 15 januari 1994 hebben aangemeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel81
    url: https://wetten.overheid.nl/BWBR0006351/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '81'
  - number: '2.2'
    text: |-
      Na de aanwijzing als bedoeld in het eerste lid, is de rechtspersoon gehouden aan de in het eerste lid gestelde
      voorwaarden te blijven voldoen en aan de werknemers voor wie het in het eerste lid, onder *a, b* en *c* gestelde
      geldt, een arbeidsongeschiktheidsverzekering als bedoeld in het eerste lid aan te bieden.
    url: https://wetten.overheid.nl/BWBR0006351/2006-01-01#Artikel2
  - number: '2.3'
    text: Onze Minister treft de aanwijzing in indien geen enkele werknemer bij de rechtspersoon is verzekerd.
    url: https://wetten.overheid.nl/BWBR0006351/2006-01-01#Artikel2
  - number: '2.4'
    text: Een besluit tot aanwijzing of intrekking daarvan wordt in de *Staatscourant* geplaatst.
    url: https://wetten.overheid.nl/BWBR0006351/2006-01-01#Artikel2
  - number: '3.1'
    text: |-
      De krachtens [artikel 2][ref1] aangewezen rechtspersoon stelt jaarlijks de omvang van de door hem geleden schaden
      vast.


      [ref1]: https://wetten.overheid.nl/BWBR0006351#Artikel2
    url: https://wetten.overheid.nl/BWBR0006351/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006351
        artikel: '2'
  - number: '3.2'
    text: |-
      De krachtens [artikel 2][ref1] aangewezen rechtspersoon stelt jaarlijks het bedrag vast dat moet worden aangemerkt
      als het deel van de in het eerste lid bedoelde omvang van de schaden vermeerderd met de aan de bedrijfsuitoefening
      verbonden kosten, met inbegrip van de kosten van de uitoefening van de taak van de Vereveningsinstantie, dat niet
      kan worden betaald uit de over dezelfde periode verdiende premies.


      [ref1]: https://wetten.overheid.nl/BWBR0006351#Artikel2
    url: https://wetten.overheid.nl/BWBR0006351/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006351
        artikel: '2'
  - number: '4'
    text: |-
      Verzekeraars die vanuit een vestiging in Nederland als bedoeld in
      [artikel 1, eerste lid, onderdeel 1, van de Wet toezicht verzekeringsbedrijf 1993][ref1] of door middel van het
      verrichten van diensten als bedoeld in artikel 1, eerste lid, onderdeel *q*, van die wet in Nederland de risico's
      dekken waarop aanvullende arbeidsongeschiktheidsverzekeringen betrekking hebben, alsmede pensioenfondsen die
      dergelijke risico's dekken, en de Minister van Defensie namens het Rijk, betalen aan de krachtens [artikel 2][ref2]
      aangewezen rechtspersoon, het in [artikel 3, tweede lid][ref3], bedoelde bedrag, overeenkomstig de ingevolge
      [artikel 5][ref4] geldende vereveningsregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006351#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0006351#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0006351#Artikel5
    url: https://wetten.overheid.nl/BWBR0006351/2006-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006351
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0006351
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0006351
        artikel: '5'
  - number: '5.1'
    text: |-
      Door Onze Minister aangewezen representatieve organisaties van verzekeraars en pensioenfondsen kunnen in
      gezamenlijke overeenstemming een vereveningsregeling vaststellen aan de hand waarvan wordt bepaald welk deel van
      het in [artikel 3, tweede lid][ref1], bedoelde bedrag aan de krachtens [artikel 2][ref2] aangewezen rechtspersoon
      op aanslag door elke afzonderlijke verzekeraar en elk afzonderlijk pensioenfonds als bedoeld in [artikel 4][ref3],
      en de Minister van Defensie namens het Rijk, moet worden betaald, alsmede op welk tijdstip dit moet worden betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0006351#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006351#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0006351#Artikel4
    url: https://wetten.overheid.nl/BWBR0006351/2006-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006351
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0006351
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0006351
        artikel: '4'
  - number: '5.2'
    text: |-
      Indien de in het eerste lid bedoelde organisaties niet binnen acht weken na inwerkingtreding van deze wet
      in gezamenlijke overeenstemming een vereveningsregeling als bedoeld in het eerste lid vaststellen, stelt de
      Vereveningsinstantie een vereveningsregeling als bedoeld in het eerste lid vast.
    url: https://wetten.overheid.nl/BWBR0006351/2006-01-01#Artikel5
  - number: '5.3'
    text: |-
      Indien een organisatie als bedoeld in het eerste lid bij de Vereveningsinstantie een verzoek indient tot
      wijziging van een overeenkomstig het eerste lid vastgestelde vereveningsregeling, kan de Vereveningsinstantie een
      vereveningsregeling als bedoeld in het eerste lid vaststellen welke in de plaats treedt van de overeenkomstig het
      eerste lid vastgestelde regeling.
    url: https://wetten.overheid.nl/BWBR0006351/2006-01-01#Artikel5
  - number: '5.4'
    text: |-
      Een door de Vereveningsinstantie vastgestelde vereveningsregeling geldt totdat organisaties als bedoeld in het
      eerste lid na die vaststelling in gezamenlijke overeenstemming een vereveningsregeling als bedoeld in het eerste
      lid vaststellen die alsdan in de plaats treedt van de door de Vereveningsinstantie vastgestelde regeling.
    url: https://wetten.overheid.nl/BWBR0006351/2006-01-01#Artikel5
  - number: '5.5'
    text: |-
      De krachtens [artikel 2][ref1] aangewezen rechtspersoon draagt zorg voor plaatsing van de geldende
      vereveningsregeling in de *Staatscourant*.


      [ref1]: https://wetten.overheid.nl/BWBR0006351#Artikel2
    url: https://wetten.overheid.nl/BWBR0006351/2006-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006351
        artikel: '2'
  - number: '5.6'
    text: |-
      Elke afzonderlijke verzekeraar die risico's dekt waarop aanvullende arbeidsongeschiktheidsverzekeringen betrekking
      hebben, elk afzonderlijk pensioenfonds dat dergelijke risico's dekt, alsmede de Minister van Defensie namens het
      Rijk, slaat het bedrag dat ingevolge de krachtens dit artikel geldende vereveningsregeling verschuldigd is, om
      over alle personen die voor de dekking van dit risico premie betalen. De premie wordt door de verzekeraar, het
      pensioenfonds of de Minister van Defensie voor elk van deze personen verhoogd met de in de vorige zin bedoelde
      omslag die deel uitmaakt van de premie.
    url: https://wetten.overheid.nl/BWBR0006351/2006-01-01#Artikel5
  - number: '6.1'
    text: Er is een Vereveningsinstantie.
    url: https://wetten.overheid.nl/BWBR0006351/2006-01-01#Artikel6
  - number: '6.2'
    text: |-
      De Vereveningsinstantie bezit rechtspersoonlijkheid en heeft haar zetel op een door Onze Minister te bepalen
      plaats.
    url: https://wetten.overheid.nl/BWBR0006351/2006-01-01#Artikel6
  - number: '7.1'
    text: |-
      De Vereveningsinstantie heeft een bestuur dat bestaat uit een door de Pensioen- & Verzekeringskamer te bepalen
      oneven aantal leden onder wie de voorzitter.
    url: https://wetten.overheid.nl/BWBR0006351/2006-01-01#Artikel7
  - number: '7.2'
    text: De leden worden benoemd door de Pensioen- & Verzekeringskamer voor een periode van vier jaar.
    url: https://wetten.overheid.nl/BWBR0006351/2006-01-01#Artikel7
  - number: '7.3'
    text: De Pensioen- & Verzekeringskamer benoemt één lid tot voorzitter.
    url: https://wetten.overheid.nl/BWBR0006351/2006-01-01#Artikel7
  - number: '7.4'
    text: De leden kunnen door de Pensioen- & Verzekeringskamer worden geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0006351/2006-01-01#Artikel7
  - number: '7.5'
    text: |-
      De persoon die tussentijds als lid wordt benoemd, treedt af op het tijdstip waarop degene in wiens plaats hij is
      benoemd, had moeten aftreden.
    url: https://wetten.overheid.nl/BWBR0006351/2006-01-01#Artikel7
  - number: '8'
    text: |-
      De Pensioen- & Verzekeringskamer regelt de tijdverzuimvergoeding en de vergoeding voor reis- en verblijfkosten van
      de leden van het bestuur van de Vereveningsinstantie.
    url: https://wetten.overheid.nl/BWBR0006351/2006-01-01#Artikel8
  - number: '9'
    text: |-
      Het bestuur van de Vereveningsinstantie stelt een reglement van werkzaamheden vast waarin in elk geval de
      openbaarheid van de vergaderingen wordt geregeld.
    url: https://wetten.overheid.nl/BWBR0006351/2006-01-01#Artikel9
  - number: '10'
    text: |-
      De kosten van de uitoefening van de taak van de Vereveningsinstantie komen ten laste van de krachtens
      [artikel 2][ref1] aangewezen rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0006351#Artikel2
    url: https://wetten.overheid.nl/BWBR0006351/2006-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006351
        artikel: '2'
  - number: '11.1'
    text: |-
      Verzekeraars en pensioenfondsen als bedoeld in [artikel 4][ref1] melden zich binnen zes weken na aanwijzing van een
      rechtspersoon krachtens [artikel 2][ref2] dan wel binnen zes weken nadat zij voor de eerste keer in Nederland een
      risico dekken waarop aanvullende arbeidsongeschiktheidsverzekeringen betrekkingen hebben, uit eigen beweging bij de
      krachtens [artikel 2][ref3] aangewezen rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0006351#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006351#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0006351#Artikel2
    url: https://wetten.overheid.nl/BWBR0006351/2006-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006351
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0006351
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0006351
        artikel: '2'
  - number: '11.2'
    text: |-
      Verzekeraars en pensioenfondsen als bedoeld in [artikel 4][ref1], alsmede de Minister van Defensie namens het Rijk,
      verstrekken aan de krachtens [artikel 2][ref2] aangewezen rechtspersoon alle gegevens en inlichtingen die naar zijn
      oordeel noodzakelijk zijn voor de uitvoering van de ingevolge [artikel 5][ref3] geldende vereveningsregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0006351#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006351#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0006351#Artikel5
    url: https://wetten.overheid.nl/BWBR0006351/2006-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006351
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0006351
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0006351
        artikel: '5'
  - number: '13'
    text: 'Deze wet wordt aangehaald als: Wet medefinanciering aanvullende arbeidsongeschiktheidsverzekeringen.'
    url: https://wetten.overheid.nl/BWBR0006351/2006-01-01#Artikel13
  - number: '14'
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0006351/2006-01-01#Artikel14
