  - number: III.10
    text: |-
      Een nabestaandenpensioen, een bijzonder nabestaandenpensioen en een wezenpensioen, ingegaan op of na 1 januari
      1996, dat is verminderd op grond van [artikel 27][ref1], [72][ref2] of [150][ref3], zoals die artikelen luidden
      vóór de wijziging bij deze wet, wordt te rekenen vanaf het tijdstip van ingang opnieuw berekend met toepassing van
      die artikelen zoals gewijzigd bij deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel72
