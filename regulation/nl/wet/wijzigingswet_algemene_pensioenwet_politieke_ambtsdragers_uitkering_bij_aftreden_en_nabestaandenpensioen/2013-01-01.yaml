preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om enige wijzigingen aan te brengen in de regeling
    in de Algemene pensioenwet politieke ambtsdragers van de uitkering bij aftreden, in de regeling van het
    nabestaandenpensioen en voorts in die wet nog enige andere wijzigingen aan te brengen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0015157/2013-01-01#ArtikelAanhef
articles:
  - number: III.1
    text: |-
      Degene die in het tijdvak tussen 31 december 1995 en het tijdstip van
      inwerkingtreding van deze wet gewezen politieke ambtsdrager was als bedoeld in
      [artikel 2, tweede lid, van de Algemene pensioenwet politieke ambtsdragers][ref1], kan binnen twee maanden na
      dat tijdstip alsnog een aanmelding doen als bedoeld in [artikel 2a van die wet][ref2], indien dit op grond van
      dat artikel, zoals gewijzigd bij deze wet, in het vorenbedoelde tijdvak mogelijk zou zijn geweest. De aanmelding
      wordt beschouwd als te zijn gedaan op het tijdstip in dat tijdvak waarop dat ook overigens op grond van
      [artikel 2a][ref3] mogelijk zou zijn geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel2a
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel2a
    url: https://wetten.overheid.nl/BWBR0015157/2013-01-01#ArtikelIII
    references:
