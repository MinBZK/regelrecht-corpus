preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om enige wijzigingen aan te brengen in de regeling
    in de Algemene pensioenwet politieke ambtsdragers van de uitkering bij aftreden, in de regeling van het
    nabestaandenpensioen en voorts in die wet nog enige andere wijzigingen aan te brengen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0015157/2013-01-01#ArtikelAanhef
articles:
  - number: III
    text: |-
      1 Degene die in het tijdvak tussen 31 december 1995 en het tijdstip van
      inwerkingtreding van deze wet gewezen politieke ambtsdrager was als bedoeld in
      [artikel 2, tweede lid, van de Algemene pensioenwet politieke ambtsdragers][ref1], kan binnen twee maanden na
      dat tijdstip alsnog een aanmelding doen als bedoeld in [artikel 2a van die wet][ref2], indien dit op grond van
      dat artikel, zoals gewijzigd bij deze wet, in het vorenbedoelde tijdvak mogelijk zou zijn geweest. De aanmelding
      wordt beschouwd als te zijn gedaan op het tijdstip in dat tijdvak waarop dat ook overigens op grond van
      [artikel 2a][ref3] mogelijk zou zijn geweest.

      2 In geval van overlijden tussen 31 december 1995 en twee maanden na het tijdstip van inwerkingtreding van deze wet
      van degene die op grond van het eerste lid alsnog een aanmelding had kunnen doen, wordt aan degene die op grond van
      het eerste lid aangemeld had kunnen worden, op diens aanvraag nabestandenpensioen toegekend met ingang van de dag
      van overlijden.

      3 Degene die tussen 30 juni 1999 en het tijdstip van inwerkingtreding van deze wet politieke ambtsdrager was als
      bedoeld in [artikel 2, tweede lid, van de Algemene pensioenwet politieke ambtsdragers][ref4] of gewezen politieke
      ambtsdrager en in dat tijdvak recht op pensioen heeft gekregen, kan binnen twee maanden na dat tijdstip alsnog de
      keuze doen als bedoeld in de bij deze wet gewijzigde [artikelen 13a][ref5], [58a][ref6] en [138a][ref7].

      4 De [artikelen 15][ref8], [17][ref9], [60][ref10], [62][ref11], [140][ref12] en
      [142, van de Algemene pensioenwet politieke ambtsdragers][ref13] zoals die luidden voor de inwerkingtreding van
      deze wet, blijven van toepassing ten aanzien van een overlijden van degene wiens pensioengeldige tijd geheel is
      gelegen vóór 1 januari 1996.

      5 De [artikelen 17, derde lid, onderdeel a][ref14], [62, derde lid, onderdeel a][ref15], en
      [142, derde lid, onderdeel a][ref16], zoals die artikelen zijn gewijzigd bij deze wet, zijn niet van toepassing in
      gevallen van het einde van een huwelijk of een aanmelding vóór het tijdstip van inwerkingtreding van deze wet.

      6 De [artikelen 22, vijfde lid][ref17], [67, vijfde lid][ref18], [145, vijfde lid][ref19], [23, derde lid][ref20],
      [68, derde lid][ref21], en [146, derde lid][ref22], zoals die zijn komen te luiden door de wijziging bij deze wet,
      zijn niet van toepassing ten aanzien van een huwelijk of aanmelding vóór de inwerkingtreding van deze wet.

      7 De [artikelen 22a][ref23], [22b][ref24], [67a][ref25], [67b][ref26], [145a][ref27] en [145b][ref28] zoals die
      luidden vóór de wijziging van die artikelen bij deze wet blijven van toepassing op een toeslag op grond van die
      artikelen die is ingegaan voor die wijziging.

      8 De [artikelen 23][ref29], [68][ref30] en [146][ref31] zoals die luidden vóór de wijziging van die artikelen bij
      deze wet, blijven van toepassing op een bijzonder nabestaandenpensioen dat is ingegaan vóór de inwerkingtreding
      van deze wet alsmede op een bijzonder nabestaandenpensioen dat daarna ingaat, indien het huwelijk of de
      aanmelding voordien is geëindigd. In afwijking van de vorige volzin wordt een bijzonder nabestandenpensioen
      als daar laatstbedoeld berekend naar de berekeningsgrondslag over het jaar voorafgaande aan het tijdstip van
      inwerkingtreding van deze wet, indien de pensioengeldige tijd van de overledene mede na dat tijdstip is gelegen.

      9 De wijziging van de [artikelen 24][ref32], [69][ref33] en [147][ref34] is van toepassing op degene die op na het
      tijdstip van inwerkingtreding van deze wet wordt aangemerkt als ongehuwd samenwonend als bedoeld in die artikelen.

      10 Een nabestaandenpensioen, een bijzonder nabestaandenpensioen en een wezenpensioen, ingegaan op of na 1 januari
      1996, dat is verminderd op grond van [artikel 27][ref35], [72][ref36] of [150][ref37], zoals die artikelen luidden
      vóór de wijziging bij deze wet, wordt te rekenen vanaf het tijdstip van ingang opnieuw berekend met toepassing van
      die artikelen zoals gewijzigd bij deze wet.

      11 De [artikelen 27a][ref38], [73][ref39] en [150a][ref40] zoals die artikelen luidden vóór de wijziging ervan bij
      deze wet, blijven van toepassing op een nabestaandenpensioen dat is ingegaan vóór de inwerkingtreding van deze wet.

      12 Een toeslag op grond van
      __REF000___________________________________________________________________________________________________________
      ____________________________________________________________________________________________________ wordt
      gehandhaafd op de laatstelijk voor het tijdstip van inwerkingtreding van deze wet vastgestelde hoogte.

      De toeslag wordt vervangen door een toeslag volgens [artikel 22a][ref42], [67a][ref43]
      of [145a van de Algemene pensioenwet politieke ambtsdragers][ref44], zoals die artikelen zijn gewijzigd bij deze
      wet, zodra de hoogte ervan minder zou zijn dan de hoogte van die toeslag.

      13 Een toeslag op grond van [artikel III, derde lid, van de in het dertiende lid genoemde wet][ref45], zoals
      dat artikel is gewijzigd bij deze wet, wordt met ingang van 1 januari 1998 vervangen door een toeslag volgens
      [artikel 22b][ref46], [67b][ref47] of [145b van de Algemene pensioenwet politieke ambtsdragers][ref48], zoals
      gewijzigd bij deze wet. In afwijking van de eerste volzin wordt de daar eerstbedoelde toeslag gehandhaafd indien
      de laatstelijk voor de inwerkingtreding van deze wet vastgestelde hoogte daarvan uitgaat boven de hoogte van een
      toeslag volgens [artikel 22b][ref49], [67b][ref50] of [145b][ref51] van de evengenoemde wet.

      14 [Artikel 7 van de Algemene pensioenwet politieke ambtsdragers][ref52], zoals dat artikel luidde voor de
      wijziging ervan bij deze wet, blijft van toepassing op uitkeringen uit hoofde van ontslagen als bedoeld in
      [artikel 6 van die wet][ref53], verleend met ingang van een datum gelegen vóór 1 januari 2003.


