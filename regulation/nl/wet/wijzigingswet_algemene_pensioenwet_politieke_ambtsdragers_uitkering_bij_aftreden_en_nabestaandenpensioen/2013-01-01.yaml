  - number: III.8
    text: |-
      De [artikelen 23][ref1], [68][ref2] en [146][ref3] zoals die luidden vóór de wijziging van die artikelen bij deze
      wet, blijven van toepassing op een bijzonder nabestaandenpensioen dat is ingegaan vóór de inwerkingtreding van deze
      wet alsmede op een bijzonder nabestaandenpensioen dat daarna ingaat, indien het huwelijk of de aanmelding voordien
      is geëindigd. In afwijking van de vorige volzin wordt een bijzonder nabestandenpensioen als daar laatstbedoeld
      berekend naar de berekeningsgrondslag over het jaar voorafgaande aan het tijdstip van inwerkingtreding van deze
      wet, indien de pensioengeldige tijd van de overledene mede na dat tijdstip is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel68
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel146
    url: https://wetten.overheid.nl/BWBR0015157/2013-01-01#ArtikelIII
