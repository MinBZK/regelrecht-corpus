  - number: III.2
    text: |-
      In geval van overlijden tussen 31 december 1995 en twee maanden na het tijdstip van inwerkingtreding van deze wet
      van degene die op grond van het eerste lid alsnog een aanmelding had kunnen doen, wordt aan degene die op grond van
      het eerste lid aangemeld had kunnen worden, op diens aanvraag nabestandenpensioen toegekend met ingang van de dag
      van overlijden.
    url: https://wetten.overheid.nl/BWBR0015157/2013-01-01#ArtikelIII
  - number: III.3
    text: |-
      Degene die tussen 30 juni 1999 en het tijdstip van inwerkingtreding van deze wet politieke ambtsdrager was als
      bedoeld in [artikel 2, tweede lid, van de Algemene pensioenwet politieke ambtsdragers][ref1] of gewezen politieke
      ambtsdrager en in dat tijdvak recht op pensioen heeft gekregen, kan binnen twee maanden na dat tijdstip alsnog de
      keuze doen als bedoeld in de bij deze wet gewijzigde [artikelen 13a][ref2], [58a][ref3] en [138a][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel2
