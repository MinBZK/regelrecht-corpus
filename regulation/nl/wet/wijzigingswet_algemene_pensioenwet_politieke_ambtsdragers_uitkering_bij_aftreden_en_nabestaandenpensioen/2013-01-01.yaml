  - number: III.13
    text: |-
      Een toeslag op grond van [artikel III, derde lid, van de in het dertiende lid genoemde wet][ref1], zoals dat
      artikel is gewijzigd bij deze wet, wordt met ingang van 1 januari 1998 vervangen door een toeslag volgens
      [artikel 22b][ref2], [67b][ref3] of [145b van de Algemene pensioenwet politieke ambtsdragers][ref4], zoals
      gewijzigd bij deze wet. In afwijking van de eerste volzin wordt de daar eerstbedoelde toeslag gehandhaafd indien
      de laatstelijk voor de inwerkingtreding van deze wet vastgestelde hoogte daarvan uitgaat boven de hoogte van een
      toeslag volgens [artikel 22b][ref5], [67b][ref6] of [145b][ref7] van de evengenoemde wet.


