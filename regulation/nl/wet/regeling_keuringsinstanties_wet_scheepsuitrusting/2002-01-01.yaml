$id: regeling_keuringsinstanties_wet_scheepsuitrusting
regulatory_layer: WET
publication_date: '2016-09-09'
valid_from: '2002-01-01'
bwb_id: BWBR0011647
url: https://wetten.overheid.nl/BWBR0011647/2002-01-01
preamble:
  text: >-
    Gelet op de artikelen 4, derde lid, 13, tweede lid, 16, tweede lid, en 28 van de Wet scheepsuitrusting;


    Besluit:
  url: https://wetten.overheid.nl/BWBR0011647/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a

              *modules B, D, E, F, G en H:*


              de overeenstemmingsbeoordelingsmodules B, D, E, F, G en H, bedoeld in bijlage B van de richtlijn;



            b

              *NEN-EN 45001, NEN-EN 45004, NEN-EN 45011 of NEN-EN 45012:*


              de met de desbetreffende aanduiding overeenkomende norm, uitgegeven door het Nederlands Normalisatie-
      instituut te Delft;



            c

              *Raad voor Accreditatie:*


              de Stichting Raad voor Accreditatie, gevestigd te Utrecht.
    url: https://wetten.overheid.nl/BWBR0011647/2002-01-01#Artikel1
  - number: '2'
    text: |-
      1 Een aanvraag om te worden aangewezen als keuringsinstantie op grond van
      [artikel 4, eerste lid, van de Wet scheepsuitrusting][ref1] vermeldt voor welke van de in
      [artikel 1, onderdeel a][ref2], genoemde modules en voor welke van de in bijlage A.1 van de richtlijn genoemde
      categorieën van scheepsuitrusting de aanwijzing wordt gevraagd.

      2 Aanwijzing kan uitsluitend worden gevraagd voor alle keuringstaken uit een bepaalde module en voor alle tot een
      bepaalde categorie van scheepsuitrusting behorende uitrustingsonderdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0011301#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011647#Artikel1
    url: https://wetten.overheid.nl/BWBR0011647/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011301
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011647
        artikel: '1'
        paragraaf: '1'
  - number: '3'
    text: >-
      1 Een aanvraag als bedoeld in artikel 2, eerste lid, gaat vergezeld van de volgende gegevens en bescheiden:


      a. een uittreksel van het ter zake van de aanvrager in het handelsregister ingeschrevene;


      b. afschriften van polissen van tegen wettelijke aansprakelijkheid afgesloten verzekeringen;


      c. een beschrijving van de organisatie, met inbegrip van de in de organisatie aanwezige waarborgen voor
      onpartijdigheid en onafhankelijkheid;


      d. afschriften van de bedrijfsinterne procedures, handboeken en voorschriften met betrekking tot de uitvoering van
      de keuringstaken waarvoor aanwijzing wordt gevraagd;


      e. een opgave van, voorzover relevant, de in de organisatie aanwezige scheepswerktuigkundige, nautische en
      elektrotechnische kennis en ervaring, met kopieën van relevante diploma's en loopbaanbeschrijvingen;


      f. gegevens met betrekking tot uit te besteden werkzaamheden, met inbegrip van een opgave van opdrachtnemers;


      g. een overzicht van de overige, niet met keuringstaken als bedoeld in de Wet scheepsuitrusting verband houdende
      werkzaamheden van de aanvrager, voorzover deze werkzaamheden betrekking hebben op zeeschepen of uitrusting voor
      zeeschepen;


      h. een door de Raad voor Accreditatie opgesteld beoordelingsrapport dat de uitkomsten bevat van een door de Raad,
      met inachtneming van de artikelen 5 en 6, verricht onderzoek naar het vermogen van de aanvrager om, gelet op zijn
      organisatie, personeel en materieel, de taken te verrichten waarvoor aanwijzing is gevraagd.


      2 Een door de Raad voor Accreditatie onderzochte aanvrager vergoedt de Raad de aan dat onderzoek verbonden kosten.
    url: https://wetten.overheid.nl/BWBR0011647/2002-01-01#Artikel3
  - number: '4'
    text: |-
      In afwijking van [artikel 3][ref1] behoeft de aanvraag niet vergezeld te gaan van de in de onderdelen c tot en
      met h van dat artikel genoemde gegevens en bescheiden, indien de aanvrager voor de taken waarvoor aanwijzing wordt
      gevraagd, beschikt over een door de Raad voor Accreditatie verleende accreditatie en de aanvraag vergezeld gaat
      van:

      a. het desbetreffende certificaat van accreditatie;

      b. een schriftelijke verklaring waarin de aanvrager de Raad voor Accreditatie machtigt om het Ministerie van
      Verkeer en Waterstaat alle gegevens en inlichtingen met betrekking tot zijn accreditatie te verstrekken, die het
      Ministerie verlangt.


      [ref1]: https://wetten.overheid.nl/BWBR0011647#Artikel3
    url: https://wetten.overheid.nl/BWBR0011647/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011647
        artikel: '3'
        paragraaf: '2'
  - number: '5'
    text: >-
      De aan te wijzen instantie voldoet aan de met het oog op de te verrichten taken relevante eisen van:


      a. voor de modules B en G: NEN-EN 45004 of NEN-EN 45011;


      b. voor de modules D, E en H: NEN-EN 45012;


      c. voor module F: NEN-EN 45001, NEN-EN 45004 of NEN-EN 45011.
    url: https://wetten.overheid.nl/BWBR0011647/2002-01-01#Artikel5
  - number: '6'
    text: >-
      De aan te wijzen instantie beschikt of kan beschikken over personeel met:


      a. voorzover de te verrichten taken betrekking hebben op reddingsmiddelen, middelen ter voorkoming van
      verontreiniging van de zee of brandbeschermingsmiddelen: scheepsbouwkundige, werktuigbouwkundige of
      scheepswerktuigkundige kennis op HBO-niveau of een daaraan gelijkwaardige combinatie van scheepsbouwkundige,
      werktuigbouwkundige of scheepswerktuigkundige kennis op MBO-niveau en relevante praktische ervaring;


      b. voorzover de te verrichten taken betrekking hebben op navigatieapparatuur of radiocommunicatieapparatuur:
      nautische kennis op HBO-niveau en elektrotechnische kennis op MBO-niveau in combinatie met relevante praktische
      ervaring op beide kennisgebieden.
    url: https://wetten.overheid.nl/BWBR0011647/2002-01-01#Artikel6
  - number: '7'
    text: >-
      De aan te wijzen instantie is als in Nederland gevestigde onderneming of als in Nederland gevestigde nevenvestiging
      van een buitenlandse onderneming ingeschreven in het handelsregister.
    url: https://wetten.overheid.nl/BWBR0011647/2002-01-01#Artikel7
  - number: '8'
    text: >-
      De aan te wijzen instantie is verzekerd tegen wettelijke aansprakelijkheid, voortvloeiend uit werkzaamheden die
      verband houden met de taken waarvoor aanwijzing is gevraagd, met een verzekerd bedrag van ten minste € 2.268.901
      per gebeurtenis.
    url: https://wetten.overheid.nl/BWBR0011647/2002-01-01#Artikel8
  - number: '9'
    text: |-
      Een aan te wijzen instantie wordt vermoed te voldoen aan de [artikelen 5][ref1] en [6][ref2], indien zij voor de
      taken waarvoor aanwijzing wordt gevraagd is geaccrediteerd door de Raad voor Accreditatie.


      [ref1]: https://wetten.overheid.nl/BWBR0011647#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011647#Artikel6
    url: https://wetten.overheid.nl/BWBR0011647/2002-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011647
        artikel: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0011647
        artikel: '6'
        paragraaf: '3'
  - number: '10'
    text: |-
      1 Indien een keuringsinstantie beproevingen en controles door derden laat verrichten, vergewist zij zich ervan dat
      deze derden voldoen aan de met het oog op de te verrichten werkzaamheden relevante eisen van NEN-EN 45001, en draag
      zij er zorg voor dat zij bij die werkzaamheden de [Wet scheepsuitrusting][ref1] in acht nemen.

      2 Voorts legt zij de voor de uitbesteding van beproevingen of controles benodigde afspraken schriftelijk vast
      en houdt zij een register bij, aan de hand waarvan de uitbestede beproevingen en controles en degenen die deze
      beproevingen en controles hebben verricht, kunnen worden geïdentificeerd.

      3 De keuringsinstantie staat niet toe dat derden als bedoeld in het eerste lid de aan hen uitbestede beproevingen
      of controles eveneens uitbesteden.


      [ref1]: https://wetten.overheid.nl/BWBR0011301
    url: https://wetten.overheid.nl/BWBR0011647/2002-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011301
  - number: '11'
    text: >-
      De keuringsinstantie bewaart gedurende ten minste tien jaren op een systematische en behoorlijke wijze de
      keuringsrapporten, dossiers, verslagen, certificaten, verklaringen en overige gegevens die samenhangen met de
      taken waarvoor zij is aangewezen, en zorgt ervoor dat de door haar gekeurde producten aan de hand van de door haar
      gevoerde administratie afdoende kunnen worden geïdentificeerd.
    url: https://wetten.overheid.nl/BWBR0011647/2002-01-01#Artikel11
  - number: '12'
    text: >-
      1 De keuringsinstantie verstrekt het Ministerie van Verkeer en Waterstaat jaarlijks in de maanden januari, april,
      juli en oktober een opgave van de in het voorafgaande kwartaal uitgegeven, geweigerde of ingetrokken certificaten
      van EG-typeonderzoek en EG-ontwerponderzoek, alsmede van de in dat kwartaal uitgegeven, geweigerde of ingetrokken
      certificaten en verklaringen van overeenstemming.


      2 Voorts verstrekt zij het Ministerie jaarlijks voor 1 maart een schriftelijke rapportage over de werkzaamheden
      die zij in het kader van haar aanwijzing in het voorafgaande kalenderjaar heeft verricht. De rapportage bevat,
      voorzover daarvan in het verslagjaar sprake is geweest, ten minste de volgende gegevens:


      a. een opgave van de verleende, geweigerde of ingetrokken goedkeuringen van kwaliteitssystemen;


      b. een overzicht van de tegen beslissingen van de keuringsinstantie ingediende bezwaren en ingestelde beroepen,
      alsmede de afhandeling en de resultaten daarvan;


      c. de bij de uitgevoerde keuringen en procedures van overeenstemmingsbeoordeling opgedane ervaringen;


      d. de mate waarin bij de uitgevoerde keuringen en procedures van overeenstemmingsbeoordeling derden zijn betrokken,
      de werkzaamheden die door deze derden zijn uitgevoerd, en de in het kader van de inschakeling van derden opgedane
      ervaringen;


      e. de knelpunten op het werkterrein, die uit de uitvoeringspraktijk naar voren komen.
    url: https://wetten.overheid.nl/BWBR0011647/2002-01-01#Artikel12
  - number: '13'
    text: |-
      De keuringsinstantie stelt het Ministerie van Verkeer en Waterstaat onverwijld in kennis van:

      a. wijzigingen van het ter zake van de keuringsinstantie in het handelsregister ingeschrevene, onder overlegging
      van een recent uittreksel uit het handelsregister;

      b. indien zij voor de taken waarvoor zij is aangewezen, door de Raad voor Accreditatie is geaccrediteerd:
      wijziging, schorsing of beëindiging van haar accreditatie;

      c. indien zij niet over een accreditatie als bedoeld in onderdeel b beschikt: wijzigingen in de organisatie, de
      bedrijfsinterne procedures of de personele bezetting van de keuringsinstantie, voorzover die wijzigingen relevant
      zijn voor de wijze waarop of de mate waarin de keuringsinstantie voldoet aan de [artikelen 5][ref1] en [6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011647#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011647#Artikel6
    url: https://wetten.overheid.nl/BWBR0011647/2002-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0011647
        artikel: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0011647
        artikel: '6'
        paragraaf: '3'
  - number: '14'
    text: |-
      1 Een keuringsinstantie die niet over een accreditatie als bedoeld in [artikel 13, onderdeel b][ref1], beschikt,
      wordt jaarlijks onderworpen aan een controleonderzoek en vierjaarlijks aan een hernieuwd onderzoek, uit te voeren
      door de Raad voor Accreditatie, die over de uitkomsten van het onderzoek rapporteert aan het Ministerie van Verkeer
      en Waterstaat.

      2 Bij een controleonderzoek wordt globaal getoetst of de keuringsinstantie nog steeds voldoet aan de
      [artikelen 5][ref2] en [6][ref3]. Bij een hernieuwd onderzoek vindt een volledige herbeoordeling plaats van het
      vermogen van de keuringsinstantie om, gelet op haar organisatie, personeel en materieel, de taken te verrichten
      waarvoor zij is aangewezen.

      3 De periode tussen het onderzoek, bedoeld in [artikel 3, eerste lid, onderdeel h][ref4], en het eerstvolgende
      controleonderzoek of tussen twee onderzoeken als bedoeld in het eerste lid bedraagt ten minste acht en ten hoogste
      zestien maanden. Indien bij twee opeenvolgende onderzoeken als bedoeld in het eerste lid geen non-conformiteiten
      zijn geconstateerd en de keuringsinstantie tevens naar behoren heeft voldaan aan de [artikelen 12][ref5] en
      [13][ref6], mag de keuringsinstantie in afwijking van het eerste lid de maximale termijn tot het eerstvolgende
      onderzoek verlengen tot ten hoogste vierentwintig maanden.

      4 Bij samenloop van een hernieuwd onderzoek met een controleonderzoek treedt het hernieuwde onderzoek in de plaats
      van dat controleonderzoek.

      5 Een door de Raad voor Accreditatie onderzochte keuringsinstantie vergoedt de Raad de aan het desbetreffende
      onderzoek verbonden kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0011647#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0011647#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0011647#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0011647#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0011647#Artikel12
      [ref6]: https://wetten.overheid.nl/BWBR0011647#Artikel13
