        artikel: '6'
        paragraaf: '3'
  - number: '14'
    text: |-
      1 Een keuringsinstantie die niet over een accreditatie als bedoeld in [artikel 13, onderdeel b][ref1], beschikt,
      wordt jaarlijks onderworpen aan een controleonderzoek en vierjaarlijks aan een hernieuwd onderzoek, uit te voeren
      door de Raad voor Accreditatie, die over de uitkomsten van het onderzoek rapporteert aan de Minister van Verkeer
      en Waterstaat.

      2 Bij een controleonderzoek wordt globaal getoetst of de keuringsinstantie nog steeds voldoet aan de
      [artikelen 5][ref2], [6][ref3] en [8][ref4]. Bij een hernieuwd onderzoek vindt een volledige herbeoordeling
      plaats van het vermogen van de keuringsinstantie om, gelet op haar organisatie, personeel en materieel, de taken te
      verrichten waarvoor zij is aangewezen.

      3 De periode tussen het onderzoek, bedoeld in [artikel 3, eerste lid, onderdeel d][ref5], en het eerstvolgende
      controleonderzoek of tussen twee onderzoeken als bedoeld in het eerste lid bedraagt ten minste acht en ten hoogste
      zestien maanden. Indien bij twee opeenvolgende onderzoeken als bedoeld in het eerste lid geen non-conformiteiten
      zijn geconstateerd en de keuringsinstantie tevens naar behoren heeft voldaan aan de [artikelen 12][ref6] en
      [13][ref7], mag de keuringsinstantie in afwijking van het eerste lid de maximale termijn tot het eerstvolgende
      onderzoek verlengen tot ten hoogste vierentwintig maanden.

      4 Bij samenloop van een hernieuwd onderzoek met een controleonderzoek treedt het hernieuwde onderzoek in de plaats
      van dat controleonderzoek.

      5 Een door de Raad voor Accreditatie onderzochte keuringsinstantie vergoedt de Raad de aan het desbetreffende
      onderzoek verbonden kosten.


