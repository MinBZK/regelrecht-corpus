  - number: '12'
    text: |-
      Een keuringsinstantie verstrekt de Minister van Verkeer en Waterstaat jaarlijks voor 1 maart een schriftelijke
      rapportage over de in het voorgaande kalenderjaar door haar uitgevoerde keuringen en procedures van
      overeenstemmingsbeoordeling in het kader van de [Wet scheepsuitrusting][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011301
    url: https://wetten.overheid.nl/BWBR0011647/2005-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0011301
  - number: '13'
    text: |-
      De keuringsinstantie stelt de Minister van Verkeer en Waterstaat onverwijld in kennis van:

      a. wijzigingen van het ter zake van de keuringsinstantie in het handelsregister ingeschrevene, met betrekking tot
      haar naam en adresgegevens;

      b. indien zij voor de taken waarvoor zij is aangewezen, door de Raad voor Accreditatie is geaccrediteerd:
      wijziging, schorsing of beëindiging van haar accreditatie;

      c. indien zij niet over een accreditatie als bedoeld in onderdeel b beschikt: wijzigingen in de organisatie, de
      bedrijfsinterne procedures of de personele bezetting van de keuringsinstantie, voorzover die wijzigingen relevant
      zijn voor de wijze waarop of de mate waarin de keuringsinstantie voldoet aan de [artikelen 5][ref1] en [6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011647#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011647#Artikel6
    url: https://wetten.overheid.nl/BWBR0011647/2005-01-01#Artikel13
    references:
      - id: ref1
