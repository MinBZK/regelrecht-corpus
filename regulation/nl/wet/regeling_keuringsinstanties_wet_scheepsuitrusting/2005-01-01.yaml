        artikel: '6'
        paragraaf: '3'
  - number: '5'
    text: |-
      De aan te wijzen instantie voldoet aan de met het oog op de te verrichten taken relevante eisen van:

      a. voor de modules B en G: NEN-EN 45004 of NEN-EN 45011;

      b. voor de modules D, E en H: NEN-EN 45012;

      c. voor module F: NEN-EN 45001, NEN-EN 45004 of NEN-EN 45011.
    url: https://wetten.overheid.nl/BWBR0011647/2005-01-01#Artikel5
  - number: '6'
    text: |-
      De aan te wijzen instantie beschikt of kan beschikken over personeel met:

      a. voorzover de te verrichten taken betrekking hebben op reddingsmiddelen, middelen ter voorkoming van
      verontreiniging van de zee of brandbeschermingsmiddelen: scheepsbouwkundige, werktuigbouwkundige of
      scheepswerktuigkundige kennis op HBO-niveau of een daaraan gelijkwaardige combinatie van scheepsbouwkundige,
      werktuigbouwkundige of scheepswerktuigkundige kennis op MBO-niveau en relevante praktische ervaring;

      b. voorzover de te verrichten taken betrekking hebben op navigatieapparatuur of radiocommunicatieapparatuur:
      nautische kennis op HBO-niveau en elektrotechnische kennis op MBO-niveau in combinatie met relevante praktische
      ervaring op beide kennisgebieden.
    url: https://wetten.overheid.nl/BWBR0011647/2005-01-01#Artikel6
  - number: '7'
    text: |-
      De aan te wijzen instantie is als in Nederland gevestigde onderneming of als in Nederland gevestigde nevenvestiging
      van een buitenlandse onderneming ingeschreven in het handelsregister.
    url: https://wetten.overheid.nl/BWBR0011647/2005-01-01#Artikel7
  - number: '8'
    text: |-
      De aan te wijzen instantie is verzekerd tegen wettelijke aansprakelijkheid, voortvloeiend uit werkzaamheden die
      verband houden met de taken waarvoor aanwijzing is gevraagd, met een verzekerd bedrag van ten minste € 2.268.901
      per gebeurtenis.
    url: https://wetten.overheid.nl/BWBR0011647/2005-01-01#Artikel8
  - number: '9'
    text: |-
      Een aan te wijzen instantie wordt vermoed te voldoen aan de [artikelen 5][ref1] en [6][ref2], indien zij voor de
      taken waarvoor aanwijzing wordt gevraagd is geaccrediteerd door de Raad voor Accreditatie.


      [ref1]: https://wetten.overheid.nl/BWBR0011647#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011647#Artikel6
    url: https://wetten.overheid.nl/BWBR0011647/2005-01-01#Artikel9
