preamble:
  text: |-
    Gelet op de artikelen 4, derde lid, 13, tweede lid, 16, tweede lid, en 28 van de Wet scheepsuitrusting;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0011647/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a

              *modules B, D, E, F, G en H:*


              de overeenstemmingsbeoordelingsmodules B, D, E, F, G en H, bedoeld in bijlage B van de richtlijn;



            b

              *NEN-EN 45001, NEN-EN 45004, NEN-EN 45011 of NEN-EN 45012:*


              de met de desbetreffende aanduiding overeenkomende norm, uitgegeven door het Nederlands Normalisatie-
      instituut te Delft;



            c

              *Raad voor Accreditatie:*


              de Stichting Raad voor Accreditatie, gevestigd te Utrecht.
    url: https://wetten.overheid.nl/BWBR0011647/2005-01-01#Artikel1
  - number: '2'
    text: |-
      1 Een aanvraag om te worden aangewezen als keuringsinstantie op grond van
      [artikel 4, eerste lid, van de Wet scheepsuitrusting][ref1] vermeldt voor welke van de in
      [artikel 1, onderdeel a][ref2], genoemde modules en voor welke van de in bijlage A.1 van de richtlijn genoemde
      categorieën van scheepsuitrusting de aanwijzing wordt gevraagd.

      2 Aanwijzing kan uitsluitend worden gevraagd voor alle keuringstaken uit een bepaalde module en voor alle tot een
      bepaalde categorie van scheepsuitrusting behorende uitrustingsonderdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0011301#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011647#Artikel1
    url: https://wetten.overheid.nl/BWBR0011647/2005-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011301
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011647
        artikel: '1'
        paragraaf: '1'
  - number: '3'
    text: |-
      1 Een aanvraag gaat vergezeld van de volgende gegevens en bescheiden:

      a. een uittreksel van het ter zake van de aanvrager in het handelsregister ingeschrevene;

      b. afschriften van polissen van tegen wettelijke aansprakelijkheid afgesloten verzekeringen;

      c. indien de aanvrager geaccrediteerd is door de Raad: het certificaat van accreditatie, alsmede een schriftelijke
      verklaring waarin de aanvrager de Raad machtigt om alle door de Minister van Verkeer en Waterstaat gewenste
      gegevens en inlichtingen met betrekking tot zijn accreditatie te verstrekken;

      d. indien de aanvrager niet geaccrediteerd is door de Raad: een door de Raad opgesteld beoordelingsrapport dat de
      uitkomsten bevat van een door de Raad met inachtneming van de [artikelen 5][ref1] en [6][ref2] verricht onderzoek
      naar het vermogen van de aanvrager om de taken te verrichten waarvoor aanwijzing is gevraagd.

      2 Een niet door de Raad geaccrediteerde aanvrager verschaft de Raad alle gegevens en bescheiden die de Raad voor
      het opstellen van het in het eerste lid, onderdeel d, genoemde beoordelingsrapport nodig heeft.

      3 Een door de Raad voor de Accreditatie onderzochte aanvrager vergoedt de Raad de aan dat onderzoek verbonden
      kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0011647#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011647#Artikel6
    url: https://wetten.overheid.nl/BWBR0011647/2005-01-01#Artikel3
    references:
      - id: ref1
