  - number: '8'
    text: |-
      1 Binnen een door Onze Minister te bepalen termijn van ten hoogste vier maanden na de dag waarop de trajectnota ter
      inzage is gelegd, geven de betrokken bestuursorganen in een met redenen omkleed advies ten minste aan:

      a. welke van de in de trajectnota behandelde alternatieven en varianten naar hun oordeel passen in hun ruimtelijk
      beleid;

      b. welke van die alternatieven en varianten naar hun oordeel de voorkeur verdienen;

      c. of en zo ja, tegen welke van die alternatieven en varianten zij bedenkingen hebben.

      2 Indien de betrokken bestuursorganen binnen de gestelde termijn geen advies hebben uitgebracht stemmen zij in met
      de volledigheid van de in de trajectnota behandelde alternatieven en varianten.
    url: https://wetten.overheid.nl/BWBR0006147/2006-12-13#Artikel8
  - number: '9'
    text: |-
      1 Onze Minister bepaalt binnen acht weken na het verstrijken van de ingevolge [artikel 8, eerste lid][ref1],
      bepaalde termijn, in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer,
      zijn standpunt met betrekking tot de aanleg van de hoofdweg, hoofdvaarweg of landelijke spoorweg of de medewerking
      aan de aanleg van de landelijke spoorweg. Het standpunt houdt in dat hij de aanleg van het in de eerste volzin
      bedoelde werk of de medewerking daaraan al dan niet verder in overweging neemt.

      2 Indien de trajectnota betrekking heeft op het tracé van een landelijke spoorweg, voert Onze Minister overleg over
      het door hem te bepalen standpunt met de beheerder van de spoorweg.

      3 Onze Minister deelt het standpunt onder opgave van redenen schriftelijk mee aan de betrokken bestuursorganen en,
      indien de trajectnota betrekking heeft op het tracé van een landelijke spoorweg, aan de beheerder van de spoorweg.

      4 Binnen een week na de mededeling, bedoeld in het derde lid, legt Onze Minister
      het standpunt ter inzage. [Artikel 3, vierde lid][ref2], van deze wet en
      [artikel 3:11, derde en vierde lid, van de Algemene wet bestuursrecht][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel8
