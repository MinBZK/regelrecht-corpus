  - number: '25'
    text: |-
      De [artikelen 15 tot en met 20d][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel15
    url: https://wetten.overheid.nl/BWBR0006147/2006-12-13#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '15'
        hoofdstuk: III
  - number: 25a
    text: |-
      1 Tegen een tracébesluit of een ander in [artikel 20, tweede lid][ref1], bedoeld besluit kan een belanghebbende
      beroep instellen bij de Afdeling bestuursrechtspraak van de Raad van State.

      2 In afwijking van [artikel 6:8 van de Algemene wet bestuursrecht][ref2] vangt de termijn voor het indienen van
      een beroepschrift tegen de in [artikel 20, tweede lid][ref3], bedoelde besluiten aan met ingang van de dag na die
      waarop de in [artikel 20, tiende lid][ref4], bedoelde bekendmaking is geschied.

      3 Voor beroepen tegen een concrete beleidsbeslissing in een planologische kernbeslissing als bedoeld in
      [artikel 39 van de Wet op de Ruimtelijke Ordening][ref5], die de grondslag vormt voor een tracébesluit, vangt, in
      afwijking van [artikel 6:8 van de Algemene wet bestuursrecht][ref6], de beroepstermijn aan met ingang van de dag
      waarop beroep kan worden ingesteld tegen het tracébesluit. Indien niet binnen een jaar na het van kracht worden van
      de planologische kernbeslissing een daarop berustend tracébesluit is vastgesteld, vangt de beroepstermijn aan met
      ingang van de dag waarop dat jaar is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel68
      [ref3]: https://wetten.overheid.nl/BWBR0006147#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0006147#Artikel20
      [ref5]: https://wetten.overheid.nl/BWBR0002375#Artikel39
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel68
    url: https://wetten.overheid.nl/BWBR0006147/2006-12-13#Artikel25a
    references:
