        artikel: 6:8
  - number: 25b
    text: |-
      1 Met betrekking tot beroepen tegen een tracébesluit beslist de Afdeling bestuursrechtspraak van de Raad van State
      binnen twaalf maanden na ontvangst van een verweerschrift.

      2 In bijzondere omstandigheden kan de Afdeling de in het eerste lid genoemde termijn met ten hoogste drie maanden
      verlengen.

      3 Met betrekking tot beroepen tegen de in [artikel 20, tweede lid][ref1], bedoelde besluiten beslist de Afdeling
      bestuursrechtspraak van de Raad van State binnen zes maanden na ontvangst van de desbetreffende verweerschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel20
    url: https://wetten.overheid.nl/BWBR0006147/2006-12-13#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '20'
        hoofdstuk: IV
  - number: 25c
    text: |-
      Bij het beroep tegen een tracébesluit kunnen geen gronden worden aangevoerd die betrekking
      hebben op de concrete beleidsbeslissing in een planologische kernbeslissing als bedoeld in
      [artikel 39 van de Wet op de Ruimtelijke Ordening][ref1], waarop dat besluit berust.

      Indien tegen een in [artikel 20, tweede lid][ref2], bedoeld besluit beroep kan worden ingesteld, kunnen bij dit
      beroep geen gronden worden aangevoerd die betrekking hebben op een concrete beleidsbeslissing in een planologische
      kernbeslissing als bedoeld in [artikel 39 van de Wet op de Ruimtelijke Ordening][ref3] of een tracébesluit waarop
      dat besluit berust.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0006147#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0002375#Artikel39
    url: https://wetten.overheid.nl/BWBR0006147/2006-12-13#Artikel25c
    references:
