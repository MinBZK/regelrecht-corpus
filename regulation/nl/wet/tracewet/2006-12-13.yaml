        artikel: '39'
  - number: '26'
    text: |-
      1 Deze wet blijft buiten toepassing ten aanzien van besluiten van Onze Minister tot vaststelling van een tracé voor
      de aanleg of wijziging van hoofdwegen, landelijke spoorwegen en hoofdvaarwegen die vóór de inwerkingtreding van
      deze wet zijn genomen, voor zover deze besluiten vóór 1 januari 1997 worden opgenomen in een uitvoeringsprogramma
      als bedoeld in [artikel 18, eerste lid][ref1]. In het laatste geval vervalt het besluit indien het niet binnen tien
      jaar na eerste opneming in het uitvoeringsprogramma ten uitvoer wordt gebracht.

      2 Het eerste lid is van overeenkomstige toepassing op besluiten als bedoeld in dat lid die binnen een jaar na
      inwerkingtreding van deze wet zijn genomen alsmede op door Onze Ministers aan te wijzen besluiten die binnen twee
      jaar na inwerkingtreding van deze wet zijn genomen.

      3 Het tweede lid geldt niet voor besluiten ter uitvoering van planologische kernbeslissingen als bedoeld in
      [artikel 28][ref2].

      4 [Artikel 18][ref3] is van overeenkomstige toepassing op besluiten als bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0006147#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0006147#Artikel18
    url: https://wetten.overheid.nl/BWBR0006147/2006-12-13#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '18'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0006147
        artikel: '28'
        hoofdstuk: VI
      - id: ref3
        bwb_id: BWBR0006147
        artikel: '18'
        hoofdstuk: IV
  - number: '27'
    text: |-
      Trajectnota's die na inwerkingtreding van deze wet worden vastgesteld maar geheel of gedeeltelijk vóór de
      inwerkingtreding van deze wet zijn voorbereid worden aangemerkt als trajectnota's in de zin van deze wet indien
      deze voorbereiding is geschied overeenkomstig de eisen die de Tracéwet aan de voorbereiding van trajectnota's
      stelt.
    url: https://wetten.overheid.nl/BWBR0006147/2006-12-13#Artikel27
  - number: '28'
    text: |-
      Indien vóór de inwerkingtreding van deze wet planologische kernbeslissingen van kracht zijn ten aanzien van de
      hogesnelheidslijn Rotterdam-Amsterdam-Belgische grens en de Betuwe-route Rotterdam-Zevenaar worden deze aangemerkt
      als beslissingen in de zin van [artikel 39 van de Wet op de Ruimtelijke Ordening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel39
    url: https://wetten.overheid.nl/BWBR0006147/2006-12-13#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '39'
  - number: 28a
    text: |-
      Onze Minister zendt de Staten-Generaal ieder half jaar een verslag over de voortgang van de projecten, waarvoor een
      beslissing is genomen als bedoeld in [artikel 2, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel2
    url: https://wetten.overheid.nl/BWBR0006147/2006-12-13#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '2'
        hoofdstuk: I
  - number: '29'
    text: |-
      Onze Ministers zenden binnen drie jaar na het in werking treden van deze wet, en vervolgens telkens om de vijf
      jaar, aan de Staten-Generaal een verslag over de wijze waarop zij is toegepast.
    url: https://wetten.overheid.nl/BWBR0006147/2006-12-13#Artikel29
  - number: '33'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0006147/2006-12-13#Artikel33
  - number: '34'
    text: |-
      Voor de plaatsing van deze wet in het *Staatsblad* brengt Onze Minister de in deze wet voorkomende aanhalingen van
      artikelen en afdelingen van de [Algemene wet bestuursrecht][ref1] in overeenstemming met de door Onze Minister van
      Justitie opnieuw vastgestelde nummering daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0006147/2006-12-13#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: '35'
    text: 'Deze wet kan worden aangehaald als: Tracéwet.'
    url: https://wetten.overheid.nl/BWBR0006147/2006-12-13#Artikel35
