  - number: '2'
    text: |-
      1 Deze wet is van toepassing op:

      a. de aanleg van een hoofdweg, landelijke spoorweg of hoofdvaarweg;

      b. een wijziging van een hoofdweg, die bestaat uit:

      1°. de ombouw van een weg tot autosnelweg of

      2°. de uitbreiding van een weg met één of meer rijstroken, indien het uit te breiden weggedeelte twee knooppunten
      of aansluitingen met elkaar verbindt;

      c. een wijziging van een landelijke spoorweg waarmee Onze Minister de bruikbaarheid van die spoorweg beoogt te
      verbeteren, en die bestaat uit:

      1°. een uitbreiding van die spoorweg met één of meer sporen, indien het uit te breiden spoorweggedeelte twee
      aansluitingen met elkaar verbindt;

      2°. de aanleg van spoorwegbouwkundige bouwwerken;

      3°. de aanleg van een verbindingsboog; of

      4°. een geheel van onderling samenhangende maatregelen ten aanzien van die spoorweg;

      d. het opnieuw in gebruik nemen van een reeds aangelegde landelijke spoorweg voor zover het gaat om een lengte van
      5 kilometer of meer;

      e. een wijziging van de hoofdvaarweg, die bestaat uit:

      1°. een vergroting of verdieping waardoor het ruimte-oppervlak van de hoofdvaarweg met ten minste twintig procent
      toeneemt dan wel de hoofdvaarweg blijvend wordt verdiept waarbij meer dan vijf miljoen kubieke meter grond wordt
      verzet of

      2°. een verlegging van een rivier waarbij het zomerbed wordt verlegd en de verlegging een oppervlakte beslaat van
      ten minste 50 hectare.

      2 Een beslissing om de procedure ten aanzien van de aanleg of wijziging van een hoofdweg of hoofdvaarweg of de
      medewerking aan de aanleg of wijziging van een landelijke spoorweg aan te vangen, wordt genomen door Onze Minister
      in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer.

      3 In de beslissing, bedoeld in het tweede lid, wordt ten aanzien van de projecten, genoemd in het eerste lid,
      onder b tot en met e, aangegeven of het ontwerp-tracébesluit, bedoeld in [artikel 11][ref1], en het tracébesluit,
      bedoeld in [artikel 15][ref2], worden vastgesteld door Onze Minister in overeenstemming met Onze Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer dan wel door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0006147#Artikel15
