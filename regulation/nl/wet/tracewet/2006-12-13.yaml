  - number: '4'
    text: |-
      1 Een trajectnota bevat ten minste de volgende onderdelen:

      a. een omschrijving van het verkeers- en vervoertraject waarop de nota betrekking heeft, en een aanduiding daarvan
      op een of meer topografische of geografische kaarten;

      b. een beschrijving van de bestaande verkeers- en vervoervoorzieningen in het desbetreffende verkeers- en
      vervoertraject;

      c. een uiteenzetting van de bestaande en te verwachten verkeers- en vervoerbehoeften voor het desbetreffende
      verkeers- en vervoertraject;

      d. een uiteenzetting van:

      1°. de mogelijke redenen om in de onder *c* bedoelde behoeften niet te voorzien;

      2°. de mogelijkheden om in de onder *c* bedoelde behoeften te voorzien zonder aanleg van een hoofdweg, landelijke
      spoorweg of hoofdvaarweg, als bedoeld in [artikel 2, eerste lid, onder a][ref1];

      3°. de mogelijkheden om in de onder *c* bedoelde behoeften te voorzien door aanleg van een hoofdweg, landelijke
      spoorweg of hoofdvaarweg, als bedoeld in [artikel 2, eerste lid, onder a][ref2], alsmede een beschrijving van
      hetgeen met de voorgenomen activiteit wordt beoogd:

      e. het tracé van de hoofdweg, landelijke spoorweg of hoofdvaarweg, zo mogelijk uitgewerkt in een of meer varianten,
      waarbij voor elke variant de mogelijkheid van een verschuiving van de as van het tracé van ten hoogste 100 meter
      aan elke zijde en van een verschuiving van ten hoogste twee meter naar boven of naar beneden is open gelaten,
      alsmede een beschrijving van de kenmerken van die varianten;

      f. een beschrijving van de bestaande inrichting en het gebruik van de grond, daaronder begrepen water, in het
      desbetreffende verkeers- en vervoertraject;

      g. een beschrijving van de ruimtelijke ontwikkeling van het desbetreffende verkeers- en vervoertraject en de mate
      waarin in streek- en bestemmingsplannen als bedoeld in de [Wet op de Ruimtelijke Ordening][ref3] met de aanleg van
      de hoofdweg, landelijke spoorweg of hoofdvaarweg is rekening gehouden, alsmede een beschrijving van de ruimtelijke
      gevolgen van de aanleg van de hoofdweg, landelijke spoorweg of hoofdvaarweg voor het in de omgeving van het
      desbetreffende verkeers- en vervoertraject gelegen gebied;

      h. een beschrijving van de voor- en nadelen van de onder *d* bedoelde alternatieven en de onder *e* bedoelde
      varianten;

      i. een raming van de kosten van de aanleg van de hoofdweg, landelijke spoorweg of hoofdvaarweg.

      2 Bij de toepassing van het eerste lid onder *a* wordt gebruik gemaakt van een of meer overzichtskaarten met een
      schaal van ten minste 1:50 000.

      3 Bij de toepassing van het eerste lid onder *e* wordt ter voldoening aan [artikel 1, eerste lid onder ][ref4]
      gebruik gemaakt van een of meer detailkaarten met een schaal van ten minste 1:10 000 en van een of meer
      overzichtskaarten met een schaal van ten minste 1:50 000.


