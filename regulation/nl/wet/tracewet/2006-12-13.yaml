  - number: '16'
    text: |-
      1 Onze Minister zendt het tracébesluit aan de betrokken bestuursorganen en, indien het tracébesluit betrekking
      heeft op het tracé van een landelijke spoorweg, aan de beheerder van de spoorweg.

      2 Bij de bekendmaking van het tracébesluit worden de motivering en de toelichting op het tracé vermeld.

      3 De terinzagelegging geschiedt tevens ten kantore van de betrokken bestuursorganen.
    url: https://wetten.overheid.nl/BWBR0006147/2006-12-13#Artikel16
  - number: '18'
    text: |-
      Indien de aanleg of wijziging van een hoofdweg, landelijke spoorweg of hoofdvaarweg niet is opgenomen in een
      jaarlijks voortschrijdend meerjarig uitvoeringsprogramma voor hoofdwegen, landelijke spoorwegen en hoofdvaarwegen,
      dat bij besluit van Onze Minister is vastgesteld voor het derde jaar na het jaar waarin het tracébesluit van kracht
      is geworden, vervalt het tracébesluit van rechtswege. Het tracébesluit vervalt eveneens van rechtswege indien het
      niet binnen tien jaar na het tijdstip waarop het onherroepelijk is geworden in uitvoering is genomen.
    url: https://wetten.overheid.nl/BWBR0006147/2006-12-13#Artikel18
  - number: '20'
    text: |-
      1 .

      2 Onze Minister bevordert een gecoördineerde voorbereiding van de besluiten op de aanvragen om de vergunningen en
      van de overige ambtshalve te nemen besluiten met het oog op de uitvoering van een tracébesluit.

      3 Onze Minister kan van de andere betrokken bestuursorganen de medewerking vorderen, die voor het welslagen van de
      coördinatie nodig is. Die bestuursorganen verlenen de van hen gevorderde medewerking.

      4 Op de voorbereiding van de in het tweede lid bedoelde besluiten is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing, met dien verstande dat:

      a. de ontwerpen van de besluiten binnen een door Onze Minister te bepalen termijn worden toegezonden aan Onze
      Minister, die zorg draagt voor de in [artikel 3:13, eerste lid, van die wet][ref2] bedoelde toezending;

      b. Onze Minister ten aanzien van de ontwerpen van de besluiten gezamenlijk toepassing kan geven aan de
      [artikelen 3:11, eerste lid][ref3], en [3:12 van die wet][ref4];

      c. zienswijzen naar voren kunnen worden gebracht door een ieder;

      d. in afwijking van [artikel 3:18 van die wet][ref5] de besluiten worden genomen binnen een door Onze Minister te
      bepalen termijn;

      e. de besluiten onverwijld worden toegezonden aan Onze Minister.

      5 [Artikel 46, eerste lid, van de Woningwet][ref6] is niet van toepassing op aanvragen om een bouwvergunning ter
      uitvoering van het tracébesluit.

      6 Indien een bestuursorgaan dat in eerste aanleg bevoegd is te beslissen op een aanvraag om een vergunning niet
      of niet tijdig overeenkomstig de aanvraag beslist, kunnen Onze Minister en Onze Minister wie het mede aangaat
      gezamenlijk een beslissing op de aanvraag nemen. In het laatste geval treedt hun besluit in de plaats van het
      besluit van het in eerste aanleg bevoegde bestuursorgaan. Indien Onze in de eerste volzin bedoelde Ministers
      voornemens zijn zelf een beslissing op de aanvraag te nemen, plegen zij overleg met het bestuursorgaan dat in
      eerste aanleg bevoegd is op de aanvraag te beslissen.

      7 Het zesde lid is van overeenkomstige toepassing op de in het tweede lid bedoelde ambtshalve te nemen besluiten.

      8 Indien bij de toepassing van het zesde lid de beslissing op een aanvraag wordt genomen door Onze in dat lid
      bedoelde Ministers, stort het bestuursorgaan dat in eerste aanleg bevoegd was te beslissen op de aanvraag, de ter
      zake ontvangen leges in 's Rijks kas.

      9 Ten aanzien van de in het tweede lid bedoelde aanvragen is Onze Minister mede bevoegd deze in te dienen bij de
      bevoegde bestuursorganen.

      10 De in het tweede lid bedoelde besluiten worden, voor zover ten aanzien daarvan het vierde lid is toegepast,
      gelijktijdig door Onze Minister bekendgemaakt.

      11 Voor zover een ontwerp van een besluit als bedoeld in het tweede lid, zijn grondslag
      vindt in een concrete beleidsbeslissing in een planologische kernbeslissing als bedoeld in
      [artikel 39 van de Wet op de Ruimtelijke Ordening][ref7], of in een tracébesluit, kunnen bedenkingen daarop geen
      betrekking hebben.


