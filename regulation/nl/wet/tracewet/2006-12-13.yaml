    text: |-
      In afwijking van [artikel 2, eerste lid][ref1], is uitsluitend dit hoofdstuk van toepassing op de besluitvorming
      over de aanleg of wijziging van een hoofdweg, landelijke spoorweg of hoofdvaarweg ten aanzien waarvan een
      planologische kernbeslissing van kracht is als bedoeld in [artikel 39 van de Wet op de Ruimtelijke Ordening][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel39
    url: https://wetten.overheid.nl/BWBR0006147/2006-12-13#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002375
        artikel: '39'
  - number: '22'
    text: |-
      1 Indien een planologische kernbeslissing als bedoeld in [artikel 39 van de Wet op de Ruimtelijke Ordening][ref1]
      van kracht is bepalen Onze Ministers met inachtneming van die beslissing het tracé en werken dit uit tot een
      ontwerp-tracébesluit en vervolgens tot een tracébesluit.

      2 De [artikelen 9, tweede lid][ref2], [11, tweede lid, onderdeel b, en derde lid][ref3], [12][ref4] en [15][ref5]
      zijn van overeenkomstige toepassing.

      3 Voor zover een ontwerp-tracébesluit zijn grondslag vindt in een concrete beleidsbeslissing in een planologische
      kernbeslissing als bedoeld in [artikel 39 van de Wet op de Ruimtelijke Ordening][ref6], kunnen bedenkingen daarop
      geen betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0006147#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0006147#Artikel11
