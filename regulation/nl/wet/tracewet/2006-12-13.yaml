      1 De in [artikel 2][ref1] bedoelde werken worden voor de toepassing van de [Belemmeringenwet Privaatrecht][ref2]
      aangemerkt als openbare werken van algemeen nut.

      2 Indien voor de uitvoering van een of meer besluiten als bedoeld in [artikel 20, tweede lid][ref3], toepassing van
      de [Belemmeringenwet Privaatrecht][ref4] noodzakelijk is:

      a. kan Onze Minister van Verkeer en Waterstaat in afwijking van
      [artikel 2, vierde lid, van de Belemmeringenwet Privaatrecht][ref5]:

      1°. een andere plaats of gemeente aanwijzen waar de zitting plaatsvindt;

      2°. bepalen dat de zitting wordt geleid door een door Onze Minister van Verkeer en Waterstaat aan te wijzen
      persoon;

      b. worden in afwijking van de [artikelen 2, vijfde lid][ref6], en
      [3, tweede lid, van de Belemmeringenwet Privaatrecht][ref7] gedeputeerde staten niet gehoord;

      c. geldt in plaats van [artikel 4 van de Belemmeringenwet Privaatrecht][ref8] dat:

      1°. tegen een besluit als bedoeld in [artikel 2, vijfde lid][ref9], of [artikel 3, tweede lid, van die wet][ref10]
      een belanghebbende beroep kan instellen bij de Afdeling bestuursrechtspraak van de Raad van State;

      2°. [artikel 7:1 van de Algemene wet bestuursrecht][ref11] niet van toepassing is;

      3°. de werking van een besluit als bedoeld in [artikel 2, vijfde lid][ref12], of
      [artikel 3, tweede lid, van de Belemmeringenwet Privaatrecht][ref13] opgeschort wordt totdat de termijn voor het
      indienen van een beroepschrift is verstreken.


