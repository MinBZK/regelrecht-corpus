  - number: '15'
    text: |-
      1 Het tracébesluit wordt binnen vijf maanden na de terinzagelegging van het ontwerp-tracébesluit vastgesteld door
      Onze Minister in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, dan
      wel door Onze Minister. De [artikelen 9, tweede lid][ref1], en [11, tweede lid, onderdeel b, en derde lid][ref2],
      zijn van overeenkomstige toepassing.

      2 Een beslissing tot het vaststellen van een hogere waarde voor de ten hoogste toelaatbare
      geluidsbelasting in zones ingevolge de artikelen [artikelen 87e tot en met 87i][ref3] en
      [106d tot en met 106h van de Wet geluidhinder][ref4] met betrekking tot het gebied dat is begrepen in een
      tracébesluit, maakt deel uit van het tracébesluit.

      3 Voor het gebied dat is begrepen in een tracébesluit geldt het tracébesluit als voorbereidingsbesluit
      als bedoeld in [artikel 21 van de Wet op de Ruimtelijke Ordening][ref5]. Voor de bij het tracébesluit
      behorende zone, bedoeld in [artikel 74, eerste lid, van de Wet geluidhinder][ref6] onderscheidenlijk de zone,
      bedoeld in [artikel 106b van die wet][ref7], geldt dat tracébesluit als voorbereidingsbesluit als bedoeld
      in [artikel 21 van de Wet op de Ruimtelijke Ordening][ref8], met dien verstande dat dit slechts geldt met
      betrekking tot geprojecteerde woningen en andere geprojecteerde geluidsgevoelige objecten ten aanzien waarvan
      de geluidsbelasting vanwege de hoofdweg of de landelijke spoorweg of vanwege binnen de zone van die hoofdweg of
      landelijke spoorweg gelegen wegen of spoorwegen de waarden die ingevolge de [artikelen 87e tot en met 87i][ref9]
      en [106d tot en met 106h van de Wet geluidhinder][ref10] als ten hoogst toelaatbare waarden worden
      aangemerkt, te boven zal gaan. Voorzover het tracébesluit geldt als voorbereidingsbesluit, is
      [artikel 21, vierde tot en met zesde lid, van de Wet op de Ruimtelijke Ordening][ref11] niet van toepassing. Het
      tracébesluit geldt niet meer als voorbereidingsbesluit indien voor het in de eerste volzin bedoelde gebied en de in
      de tweede volzin bedoelde zone een bestemmingsplan in overeenstemming met het tracébesluit in werking is getreden.

      4 Onder een geprojecteerde woning of een ander geprojecteerd geluidsgevoelig object als bedoeld in de tweede
      volzin van het derde lid wordt verstaan een nog niet aanwezige woning of ander geluidsgevoelig object waarvoor het
      geldende bestemmingsplan verlening van de bouwvergunning toelaat, maar deze nog niet is afgegeven.

      5 [Artikel 50 van de Woningwet][ref12] is niet van toepassing op aanvragen om een bouwvergunning ter uitvoering van
      het tracébesluit.

      6 Voorzover het tracébesluit en het bestemmingsplan niet met elkaar in overereenstemming
      zijn, geldt het tracébesluit voor de uitvoering daarvan als vrijstelling, als bedoeld in
      [artikel 19 van de Wet op de Ruimtelijke Ordening][ref13].

      7 Voorzover een bestemmingsplan of een ander besluit voor de uitvoering van werken en werkzaamheden een
      aanlegvergunning als bedoeld in [artikel 14 van de Wet op de Ruimtelijke Ordening][ref14] vereist, geldt zodanige
      eis niet voor de uitvoering van werken en werkzaamheden ter uitvoering van het tracébesluit in het gebied dat is
      begrepen in een tracébesluit.

      8 Voorschriften in een leefmilieuverordening als bedoeld in
      [artikel 9, derde lid, van de Wet op de stads- en dorpsvernieuwing][ref15] blijven buiten toepassing voor de
      uitvoering van werken, werkzaamheden en bouwwerken en voor het gebruik van gronden en opstallen ter uitvoering van
      een tracébesluit, voorzover het tracébesluit en die voorschriften niet met elkaar in overeenstemming zijn.

      9 De gemeenteraad is verplicht binnen een jaar nadat het tracébesluit onherroepelijk is geworden het
      bestemmingsplan overeenkomstig dat tracébesluit vast te stellen of te herzien.

      10 Indien het bestemmingsplan nog niet in overeenstemming is met het tracébesluit, verleent het college van
      burgemeester en wethouders aan degenen die inzage verlangen in dat plan tevens inzage in het tracébesluit.


