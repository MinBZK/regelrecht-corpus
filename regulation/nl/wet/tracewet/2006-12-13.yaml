  - number: '5'
    text: |-
      Indien de trajectnota betrekking heeft op het tracé van een landelijke spoorweg, betrekt Onze Minister de beheerder
      van de spoorweg bij de voorbereiding daarvan. Deze verleent de in verband daarmee nodige medewerking aan het
      opstellen van de trajectnota.
    url: https://wetten.overheid.nl/BWBR0006147/2006-12-13#Artikel5
  - number: '6'
    text: |-
      1 Onze Minister voert ter voorbereiding van de trajectnota met de betrokken bestuursorganen overleg over de opzet
      van de nota ten aanzien van het verkeers- en vervoertraject als bedoeld in [artikel 4, eerste lid onder ][ref1], en
      de te behandelen alternatieven en varianten als bedoeld in [artikel 4, eerste lid onder ][ref2].

      2 Onze Minister voert met de betrokken bestuursorganen voorts overleg bij de verdere voorbereiding van de
      trajectnota.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006147#Artikel4
