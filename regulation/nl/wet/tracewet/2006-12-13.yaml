      1 Indien een belanghebbende ten gevolge van een tracébesluit schade lijdt of zal lijden, die redelijkerwijs niet
      of niet geheel te zijnen laste behoort te blijven en ten aanzien waarvan de vergoeding niet of niet voldoende
      anderszins is verzekerd, kent Onze Minister hem op zijn verzoek een naar billijkheid te bepalen schadevergoeding
      toe.

      2 [Artikel 49 van de Wet op de Ruimtelijke Ordening][ref1] blijft buiten toepassing voor zover de belanghebbende
      met betrekking tot de schade een beroep doet of kan doen op een schadevergoeding als bedoeld in het eerste lid.

      3 Bij regeling van Onze Minister kunnen regels worden gesteld omtrent de indiening en afhandeling van een verzoek
      om schadevergoeding.


