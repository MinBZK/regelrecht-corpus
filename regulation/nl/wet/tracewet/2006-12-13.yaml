  - number: '10'
    text: |-
      1 Indien het standpunt van Onze Minister inhoudt dat hij de aanleg van de hoofdweg, hoofdvaarweg of landelijke
      spoorweg of de medewerking aan de aanleg van de landelijke spoorweg verder in overweging neemt, houdt het standpunt
      tevens in welk tracé de voorkeur verdient.

      2 In geval van toepassing van het eerste lid wordt binnen zes maanden na het uitbrengen van het standpunt een
      ontwerp-tracébesluit vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006147/2006-12-13#Artikel10
  - number: '11'
    text: |-
      1 Het ontwerp-tracébesluit wordt vastgesteld door Onze Minister in overeenstemming met Onze Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer dan wel door Onze Minister.

      2 Het ontwerp-tracébesluit bevat ten minste:

      a. de voorgenomen beslissing tot vaststelling van hogere waarden voor de ten hoogste toelaatbare geluidsbelasting
      in zones ingevolge de [artikelen 87e tot en met 87i][ref1] of [106d tot en met 106h van de Wet geluidhinder][ref2];

      b. een beschrijving van de wijze waarop de inpassing van de aan te leggen of te wijzigen hoofdweg, landelijke
      spoorweg of hoofdvaarweg zal geschieden, en waar dit in redelijkheid niet kan worden verlangd, welke compenserende
      maatregelen zullen worden getroffen;

      c. een beschrijving van de wijze waarop rekening is gehouden met het advies van de Commissie voor de
      tunnelveiligheid ten aanzien van het tracé van een in de desbetreffende hoofdweg of landelijke spoorweg
      geplande tunnel en, indien het een tunnel in een hoofdweg betreft, de wijze waarop rekening is gehouden met de
      risicoanalyse, bedoeld in [artikel 6, eerste lid, van de Wet aanvullende regels veiligheid wegtunnels][ref3].

      3 Bij het ontwerp-tracébesluit wordt ter voldoening aan [artikel 1, eerste lid, onder h, onder 1°][ref4], gebruik
      gemaakt van een of meer detailkaarten met een schaal van ten minste 1:2500 en van een of meer overzichtskaarten met
      een schaal van ten minste 1:20 000.


