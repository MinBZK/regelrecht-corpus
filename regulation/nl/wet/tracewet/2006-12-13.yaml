  - number: '3'
    text: |-
      1 Onze Minister stelt een trajectnota op ter voorbereiding van het standpunt, bedoeld in [artikel 9][ref1], en het
      tracébesluit, bedoeld in [artikel 15][ref2].

      2 Bij de voorbereiding betrekt Onze Minister de raden van de gemeenten, de provinciale staten van de provincies en
      de besturen van de regionale openbare lichamen en waterschappen op het gebied waarvan de trajectnota redelijkerwijs
      betrekking kan hebben dan wel betrekking heeft.

      3 Onze Minister geeft kennis van zijn voornemen om een trajectnota op te stellen met overeenkomstige toepassing
      van [artikel 3:12 van de Algemene wet bestuursrecht][ref3]. Deze kennisgeving geschiedt gelijktijdig met de
      kennisgeving, die is voorgeschreven in [artikel 7.13, tweede lid, van de Wet milieubeheer][ref4].

      4 De terinzagelegging van het voornemen geschiedt ten kantore van de betrokken bestuursorganen.

      5 Onze Minister stelt een ieder in de gelegenheid naar keuze schriftelijk of mondeling zijn zienswijze omtrent het
      voornemen naar voren te brengen.

      6 Onze Minister bereidt de trajectnota voor gelijktijdig en in samenhang met de voorbereiding van het milieu-
      effectrapport, als voorgeschreven bij of krachtens de [Wet milieubeheer][ref5].

      7 Een trajectnota als bedoeld in dit hoofdstuk wordt voor de toepassing van de [artikelen 7.30, eerste lid][ref6],
      en [7.32 van de Wet milieubeheer][ref7] gelijkgesteld met een voorontwerp van een besluit als bedoeld in
      [artikel 7.27, eerste lid, van laatstbedoelde wet][ref8].


