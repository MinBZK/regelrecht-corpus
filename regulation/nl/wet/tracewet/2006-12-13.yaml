  - number: '7'
    text: |-
      1 Onze Minister geeft kennis van de trajectnota met overeenkomstige toepassing van
      [artikel 3:12 van de Algemene wet bestuursrecht][ref1].

      2 De [artikelen 3:11][ref2], [3:14][ref3], [3:15, eerste lid][ref4], [3:16][ref5] en
      [3:17 van de Algemene wet bestuursrecht][ref6] zijn van overeenkomstige toepassing, met dien verstande dat in
      plaats van «het ontwerp van het te nemen besluit» en het «ontwerp» wordt gelezen: de trajectnota. Zienswijzen
      kunnen naar voren worden gebracht door een ieder.


