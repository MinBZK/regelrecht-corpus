  - number: '12'
    text: |-
      1 Onze Minister zendt het ontwerp-tracébesluit aan de betrokken bestuursorganen en, indien het ontwerp-tracébesluit
      betrekking heeft op het tracé van een landelijke spoorweg, aan de beheerder van de spoorweg.

      2 Onze Minister zendt het ontwerp-tracébesluit, indien het hogere waarden bevat voor de ten
      hoogste toelaatbare geluidsbelasting in zones ingevolge de [artikelen 87e tot en met 87i][ref1]
      of [106d tot en met 106h van de Wet geluidhinder][ref2], voorts aan:

      a. de gebruikers van de woningen of de woonwagenstandplaatsen, het bevoegd gezag van scholen en de directies van
      ziekenhuizen, verpleeghuizen en andere gezondheidszorggebouwen waarvoor een hogere waarde wordt bepaald;

      b. de Minister van Onderwijs, Cultuur en Wetenschappen, indien het betrekking heeft op scholen.

      3 Op de voorbereiding van het tracébesluit is [afdeling 3.4 van de Algemene wet bestuursrecht][ref3] van
      toepassing. Bij de voorbereiding betrekt Onze Minister de raden van de gemeenten, de provinciale staten van de
      provincies en de besturen van waterschappen op het gebied waarvan het te nemen tracébesluit betrekking heeft.
      De terinzagelegging geschiedt tevens ten kantore van de betrokken bestuursorganen. Zienswijzen kunnen naar voren
      worden gebracht door een ieder.

      4 In afwijking van het tweede lid, aanhef en onder a, kan Onze Minister, indien de omvang van het ontwerp-
      tracébesluit daartoe aanleiding geeft, volstaan met eenieder van de in het tweede lid, onder a, bedoelde personen
      de strekking van het ontwerp-tracébesluit mee te delen en de onderdelen van het ontwerp-tracébesluit die voor de
      betrokkene redelijkerwijs van belang zijn, toe te zenden.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel87e
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel106d
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
