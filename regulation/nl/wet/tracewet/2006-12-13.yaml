preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het ter verzekering van doelmatige procedures voor de totstandkoming
    en van de tijdige tenuitvoerlegging van besluiten met betrekking tot de aanleg of wijziging van hoofdwegen, van
    landelijke railwegen en van hoofdvaarwegen wenselijk is regels te stellen voor de voorbereiding, vaststelling
    en tenuitvoerlegging van zodanige besluiten, deze regels te doen aansluiten bij het bepaalde bij en krachtens de
    Wet milieubeheer (Stb. 1992, 551) inzake het milieu-effectrapport zomede de coördinatie bij de toepassing van die
    regels met de toepassing van de Wet op de Ruimtelijke Ordening (Stb. 1985, 626) te verzekeren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006147/2006-12-13#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet wordt verstaan onder:

      a. Onze Minister: Onze Minister van Verkeer en Waterstaat;

      b. Onze Ministers: Onze Minister en Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

      bb. regionaal openbaar lichaam: een plusregio als bedoeld in
      [artikel 104 van de Wet gemeenschappelijke regelingen][ref1] die de gemeente of gemeenten Amsterdam, Arnhem en
      Nijmegen, Eindhoven en Helmond, Enschede en Hengelo, ’s-Gravenhage, Rotterdam of Utrecht omvat;

      c. hoofdweg: een weg waarvoor een verbinding is aangegeven op een kaart van indicatieve en limitatieve
      hoofdwegverbindingen, die behoort tot een van kracht zijnd plan als bedoeld in [artikel 2][ref2] (*Stb.* 1985,
      626);

      d. landelijke spoorweg: een spoorweg waarvoor een verbinding is aangegeven op een kaart van indicatieve en
      limitatieve spoorwegverbindingen, die behoort tot een van kracht zijnd plan als bedoeld in [artikel 2 ][ref3];

      e. hoofdvaarweg: een vaarweg waarvoor een verbinding is aangegeven op een kaart van indicatieve en limitatieve
      hoofdvaarwegverbindingen, die behoort tot een van kracht zijnd plan als bedoeld in [artikel 2 ][ref4];

      f. bijkomende infrastructurele voorzieningen: werken of bouwwerken die, zonder deel uit te maken van het profiel
      van een hoofdweg, een landelijke spoorweg of een hoofdvaarweg, met die weg, spoorweg of vaarweg zijn verbonden en
      dienen voor de instandhouding dan wel het veilig en doelmatig gebruik daarvan;

      g. verkeers- en vervoertraject: een verkeers- en vervoergebied gelegen tussen twee punten van een verbinding als
      bedoeld onder *c, d* of *e* van dit artikellid;

      h. tracé:

      1°. de aanduiding op een of meer topografische of geografische kaarten van het verloop en de geografische omvang
      van een aan te leggen of te wijzigen hoofdweg, landelijke spoorweg of hoofdvaarweg, en

      2°. een nauwkeurige beschrijving van:

        - de daarbij te realiseren ligging in het terrein,
        - de daarbij te realiseren bijkomende infrastructurele voorzieningen en
        - de daarbij te realiseren maatregelen van landschappelijke, landbouwkundige en ecologische aard, en

      3°. indien het de aanleg of wijziging van een hoofdweg betreft:

        - een nauwkeurige beschrijving van het daarbij te realiseren aantal rijstroken en
        - de in acht te nemen grenswaarden voor geluidhinder en de aanduiding van de maatregelen, gericht op het
      terugbrengen van de verwachte geluidsbelasting van de gevel van woningen of andere geluidsgevoelige gebouwen
      onderscheidenlijk aan de grens van geluidsgevoelige terreinen als bedoeld in de [Wet geluidhinder][ref5], of

      4°. indien het de aanleg of wijziging van een landelijke spoorweg betreft:

        - een nauwkeurige beschrijving van het daarbij te realiseren aantal sporen en
        - de in acht te nemen grenswaarden voor geluidhinder en de aanduiding van de maatregelen, gericht op het
      terugbrengen van de verwachte geluidsbelasting van de gevel van woningen of andere geluidsgevoelige gebouwen
      onderscheidenlijk aan de grens van geluidsgevoelige terreinen als bedoeld in de [Wet geluidhinder][ref6],
      met betrekking tot de aanleg of wijziging van de landelijke spoorweg, alsmede de aansluitende landelijke
      spoorweg waarop ten gevolge van de aanleg of wijziging sprake is van een aanpassing in de zin van
      [artikel 106, eerste lid, onder l, van de Wet geluidhinder][ref7].

      2 Ontheffingen, dispensaties, afwijkingen en soortgelijke beschikkingen worden voor de toepassing van deze wet als
      vergunning aangemerkt.

      3 In deze wet wordt onder aanleg of wijziging van een hoofdweg, landelijke spoorweg of hoofdvaarweg mede verstaan
      de aanleg of wijziging van een deel van die hoofdweg, landelijke spoorweg of hoofdvaarweg.


