preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het ter verzekering van doelmatige procedures voor de totstandkoming
    en van de tijdige tenuitvoerlegging van besluiten met betrekking tot de aanleg of wijziging van hoofdwegen, van
    landelijke railwegen en van hoofdvaarwegen wenselijk is regels te stellen voor de voorbereiding, vaststelling
    en tenuitvoerlegging van zodanige besluiten, deze regels te doen aansluiten bij het bepaalde bij en krachtens de
    Wet milieubeheer (Stb. 1992, 551) inzake het milieu-effectrapport zomede de coördinatie bij de toepassing van die
    regels met de toepassing van de Wet op de Ruimtelijke Ordening (Stb. 1985, 626) te verzekeren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet wordt verstaan onder: - *geluidproductieplafond:* geluidproductieplafond als bedoeld in
      [artikel 11.1 van de Wet milieubeheer][ref1];
        - *hoofdvaarweg:* een vaarweg van nationaal belang;
        - *hoofdweg:* een auto- of autosnelweg van nationaal belang;
        - *landelijke spoorweg:* een spoorweg van nationaal belang;
        - *Onze Minister:* Onze Minister van Infrastructuur en Milieu;
        - *referentiepunt:* referentiepunt als bedoeld in [artikel 11.19 van de Wet milieubeheer][ref2];
        - *startbeslissing:* de beslissing, bedoeld in [artikel 2, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0006147#Artikel2
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0006147
        artikel: '2'
        hoofdstuk: II
  - number: '1.2'
    text: |-
      Ontheffingen, dispensaties, afwijkingen en soortgelijke beschikkingen worden voor de toepassing van deze wet als
      vergunning aangemerkt.
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel1
  - number: '1.3'
    text: |-
      In deze wet wordt onder aanleg of wijziging van een hoofdweg, landelijke spoorweg of hoofdvaarweg mede verstaan de
      aanleg of wijziging van een deel van die hoofdweg, landelijke spoorweg of hoofdvaarweg.
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel1
  - number: '2.1'
    text: |-
      De beslissing om een verkenning uit te voeren naar een mogelijk bestaand of toekomstig probleem op of door het
      ontbreken van een hoofdweg, een landelijke spoorweg of een hoofdvaarweg wordt genomen door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel2
  - number: '2.2'
    text: |-
      Bij de voorbereiding van de startbeslissing betrekt Onze Minister de betrokken bestuursorganen en, voor zover van
      toepassing, de beheerder van de landelijke spoorweg.
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel2
  - number: '2.3'
    text: 'De startbeslissing bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel2
  - number: 2.3.a
    text: een omschrijving van het gebied waarop de verkenning is gericht;
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel2
  - number: 2.3.b
    text: |-
      een beschrijving van de aard van het te verkennen probleem en die van de ruimtelijk relevante ontwikkelingen in
      het gebied;
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel2
  - number: 2.3.c
    text: |-
      de wijze waarop burgers, maatschappelijke organisaties, betrokken bestuursorganen en, voor zover van toepassing, de
      beheerder van de landelijke spoorweg worden betrokken bij de verkenning;
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel2
  - number: 2.3.d
    text: de termijn waarbinnen en de wijze waarop de verkenning zal worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel2
  - number: '2.4'
    text: |-
      De startbeslissing kan tevens inhouden dat ter voorbereiding van de besluitvorming
      op grond van [hoofdstuk III][ref1] een structuurvisie als bedoeld in
      [artikel 2.3, tweede lid, van de Wet ruimtelijke ordening][ref2] wordt vastgesteld. Een structuurvisie wordt in
      ieder geval vastgesteld indien Onze Minister voornemens is ter oplossing van het eerste lid bedoelde probleem de
      aanleg van een hoofdweg, landelijke spoorweg of hoofdvaarweg of de wijziging van een hoofdweg of een landelijke
      spoorweg met meer dan twee rijstroken onderscheidenlijk meer dan twee doorgaande sporen in overweging te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel2
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006147
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '2'
  - number: '2.5'
    text: |-
      Onze Minister geeft kennis van de startbeslissing door middel van plaatsing in de Staatscourant. Volstaan kan
      worden met de vermelding van de zakelijke inhoud.
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel2
  - number: '2.6'
    text: |-
      Onze Minister zendt de startbeslissing tevens aan de Tweede Kamer der Staten-Generaal, de betrokken bestuursorganen
      en, voor zover van toepassing, de beheerder van de landelijke spoorweg.
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel2
  - number: '3'
    text: |-
      Bij de verkenning vergaart Onze Minister de nodige kennis en inzichten omtrent de aard van het probleem, bedoeld in
      [artikel 2, eerste lid][ref1], de relevante ruimtelijke ontwikkelingen en mogelijke oplossingen voor dat probleem.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel2
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '2'
        hoofdstuk: II
  - number: '4.1'
    text: |-
      De structuurvisie, bedoeld in [artikel 2, vierde lid][ref1], bevat:


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel2
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '2'
        hoofdstuk: II
  - number: 4.1.a
    text: de resultaten van de uitgevoerde verkenning;
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel4
  - number: 4.1.b
    text: |-
      een verantwoording over de wijze waarop burgers, maatschappelijke organisaties, betrokken bestuursorganen en, voor
      zover van toepassing, de beheerder van de landelijke spoorweg zijn betrokken bij de verkenning en de resultaten
      daarvan;
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel4
  - number: 4.1.c
    text: |-
      de voorkeur van Onze Minister voor de oplossing van het in [artikel 2, eerste lid][ref1], bedoelde probleem en de
      motivering van die voorkeur.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel2
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '2'
        hoofdstuk: II
  - number: '4.2'
    text: |-
      In de structuurvisie kan worden aangegeven dat vanwege de samenhang met andere te verwezenlijken ruimtelijke
      ontwikkelingen voor de verdere besluitvorming over de activiteit, bedoeld in [artikel 8][ref1], toepassing
      wordt gegeven aan [afdeling 3.1][ref2] of [3.5 van de Wet ruimtelijke ordening][ref3] en [hoofdstuk III][ref4]
      dientengevolge buiten toepassing blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Afdeling3.1
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Afdeling3.5
      [ref4]: https://wetten.overheid.nl/BWBR0006147#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '8'
        hoofdstuk: III
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0020449
        afdeling: '3.1'
      - id: ref3
        bwb_id: BWBR0020449
        afdeling: '3.5'
      - id: ref4
        bwb_id: BWBR0006147
        hoofdstuk: III
  - number: '4.3'
    text: |-
      [Artikel 2.3, vierde lid, van de Wet ruimtelijke ordening][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel2
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '2'
  - number: '5.1'
    text: |-
      De voorkeur, bedoeld in [artikel 4, eerste lid, onderdeel c][ref1], kan inhouden:


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel4
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '4'
        hoofdstuk: II
  - number: 5.1.a
    text: de aanleg of wijziging van een hoofdweg, landelijke spoorweg of hoofdvaarweg;
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel5
  - number: 5.1.b
    text: een oplossing zonder aanleg of wijziging van een hoofdweg, landelijke spoorweg of hoofdvaarweg;
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel5
  - number: 5.1.c
    text: een combinatie van a of b met de realisering van andere ruimtelijke projecten;
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel5
  - number: 5.1.d
    text: dat er geen oplossing wordt uitgewerkt.
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel5
  - number: '5.2'
    text: |-
      Indien de voorkeur, bedoeld in eerste lid, geheel of mede uitgaat naar onderdeel a van dat lid, bevat de
      structuurvisie tevens:
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel5
  - number: 5.2.a
    text: |-
      een globale beschrijving van de te treffen maatregelen en van de noodzakelijke maatregelen en voorzieningen als
      bedoeld in [artikel 10][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel10
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '10'
        hoofdstuk: III
        paragraaf: '3.1'
  - number: 5.2.b
    text: een beschrijving van de verwezenlijking van de voorgenomen activiteit in relatie tot de ruimtelijke ontwikkelingen;
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel5
  - number: 5.2.c
    text: een raming van de kosten en een onderbouwing van de financiële uitvoerbaarheid.
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel5
  - number: '6.1'
    text: |-
      Onze Minister geeft kennis van het ontwerp van de structuurvisie met overeenkomstige toepassing van
      [artikel 3:12 van de Algemene wet bestuursrecht][ref1]. Hij zendt het ontwerp aan de Tweede Kamer der Staten-
      Generaal, de betrokken bestuursorganen en, voor zover van toepassing, de beheerder van de landelijke spoorweg.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '6.2'
    text: |-
      De [artikelen 3:11][ref1], [3:14][ref2], [3:15, eerste lid][ref3], [3:16][ref4] en
      [3:17 van de Algemene wet bestuursrecht][ref5] zijn van overeenkomstige toepassing, met dien verstande dat
      zienswijzen naar voren kunnen worden gebracht door een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '7.1'
    text: |-
      Onze Minister geeft kennis van de structuurvisie door middel van plaatsing in de Staatscourant. Volstaan kan worden
      met de vermelding van de zakelijke inhoud.
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel7
  - number: '7.2'
    text: |-
      Onze Minister zendt de structuurvisie toe aan de Tweede Kamer der Staten-Generaal, aan de betrokken bestuursorganen
      en, voor zover van toepassing, aan de beheerder van de landelijke spoorweg.
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel7
  - number: '7.3'
    text: |-
      [Artikel 2.3, vijfde lid, van de Wet ruimtelijke ordening][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel2
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '2'
  - number: '8'
    text: |-
      Dit hoofdstuk is, tenzij toepassing is gegeven aan [artikel 4, tweede lid][ref1], van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel4
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '4'
        hoofdstuk: II
  - number: 8.a
    text: de aanleg van een hoofdweg, landelijke spoorweg of hoofdvaarweg;
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel8
  - number: 8.b
    text: 'een wijziging van een hoofdweg, die bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel8
  - number: 8.b.1°
    text: de ombouw van een weg tot autosnelweg; of
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel8
  - number: 8.b.2°
    text: |-
      de uitbreiding van een weg met één of meer rijstroken, indien het uit te breiden weggedeelte twee knooppunten of
      aansluitingen met elkaar verbindt;
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel8
  - number: 8.c
    text: |-
      een wijziging van een landelijke spoorweg waarmee Onze Minister de bruikbaarheid van die spoorweg beoogt te
      verbeteren, en die bestaat uit:
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel8
  - number: 8.c.1°
    text: |-
      een uitbreiding van die spoorweg met één of meer sporen, indien het uit te breiden spoorweggedeelte twee
      aansluitingen met elkaar verbindt;
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel8
  - number: 8.c.2°
    text: de aanleg van spoorwegbouwkundige bouwwerken;
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel8
  - number: 8.c.3°
    text: de aanleg van een verbindingsboog; of
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel8
  - number: 8.c.4°
    text: een geheel van onderling samenhangende maatregelen ten aanzien van die spoorweg;
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel8
  - number: 8.d
    text: |-
      het opnieuw in gebruik nemen van een reeds aangelegde landelijke spoorweg voor zover het gaat om een lengte van
      vijf kilometer of meer;
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel8
  - number: 8.e
    text: |-
      een wijziging van de hoofdvaarweg, die bestaat uit een vergroting of verdieping waardoor het ruimteoppervlak van de
      hoofdvaarweg met ten minste twintig procent toeneemt dan wel de hoofdvaarweg blijvend wordt verdiept waarbij meer
      dan vijf miljoen kubieke meter grond wordt verzet.
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel8
  - number: '9.1'
    text: |-
      Het tracébesluit wordt uiterlijk twee jaar nadat de structuurvisie is toegezonden aan de Tweede Kamer der Staten-
      Generaal vastgesteld door Onze Minister. Indien geen toepassing is gegeven aan [artikel 2, vierde lid][ref1], wordt
      het tracébesluit vastgesteld uiterlijk twee jaar nadat de startbeslissing is toegezonden aan de Tweede Kamer der
      Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel2
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '2'
        hoofdstuk: II
  - number: '9.2'
    text: |-
      Indien de voorkeur, bedoeld in [artikel 4, eerste lid, onderdeel c][ref1], een keuze voor
      [artikel 5, eerste lid, onderdeel c][ref2], inhoudt, bevordert Onze Minister de vaststelling van de voor de
      verwezenlijking van die voorkeur noodzakelijke ruimtelijke plannen.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006147#Artikel5
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '4'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0006147
        artikel: '5'
        hoofdstuk: II
  - number: '10.1'
    text: 'Het tracébesluit bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel10
  - number: 10.1.a
    text: |-
      een beschrijving van de te treffen maatregelen, de inpassing van die maatregelen en de te realiseren ligging in het
      terrein, waaronder begrepen de maatregelen, bedoeld in [artikel 11.35 van de Wet milieubeheer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 10.1.b
    text: |-
      een beschrijving van de te treffen voorzieningen, gericht op het ongedaan maken, beperken of compenseren van de
      nadelige gevolgen van de uitvoering van het werk, voor zover die voorzieningen rechtstreeks verband houden met de
      uitvoering van het werk;
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel10
  - number: 10.1.c
    text: |-
      een beschrijving van de te treffen voorzieningen die dienen voor de instandhouding dan wel het veilig en doelmatig
      gebruik van een hoofdweg, landelijke spoorweg of hoofdvaarweg;
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel10
  - number: 10.1.d
    text: |-
      een beschrijving van de tijdelijke maatregelen en de tijdelijk te treffen voorzieningen die nodig zijn voor de
      verwezenlijking van de voorgenomen aanleg of wijziging van een hoofdweg, landelijke spoorweg of hoofdvaarweg;
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel10
  - number: 10.1.e
    text: |-
      de aanduiding op een of meer topografische of geografische kaarten van het verloop en de geografische omvang van
      het werk, waarbij gebruik wordt gemaakt van een of meer detailkaarten met een schaal van ten minste 1:2500 en van
      een of meer overzichtskaarten;
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel10
  - number: 10.1.f
    text: |-
      de termijn waarbinnen Onze Minister de gevolgen van de ingebruikneming van de aan te leggen of te wijzigen
      hoofdweg, landelijke spoorweg of hoofdvaarweg onderzoekt en een opgave van de daarbij te onderzoeken
      milieuaspecten.
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel10
  - number: '10.2'
    text: 'Het tracébesluit inzake de aanleg of wijziging van een hoofdweg bevat, voor zover van toepassing, voorts:'
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel10
  - number: 10.2.a
    text: een beschrijving van het aantal te realiseren rijstroken;
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel10
  - number: 10.2.b
    text: |-
      de beslissing tot het vaststellen of het wijzigen van een geluidproductieplafond indien aanleg of wijziging zou
      leiden tot overschrijding van het geldende geluidproductieplafond, alsmede de referentiepunten ingeval van aanleg
      of ingeval van verplaatsing van referentiepunten;
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel10
  - number: 10.2.c
    text: |-
      indien toepassing is gegeven aan [artikel 104a van de Wet geluidhinder][ref1], de in dat artikel bedoelde hogere
      waarden.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel104a
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 104a
  - number: '10.3'
    text: |-
      Het tracébesluit inzake de aanleg of wijziging van een landelijke spoorweg bevat, voor zover van toepassing,
      voorts:
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel10
  - number: 10.3.a
    text: een beschrijving van het aantal te realiseren sporen;
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel10
  - number: 10.3.b
    text: |-
      de beslissing tot het vaststellen of het wijzigen van een geluidproductieplafond indien aanleg of wijziging zou
      leiden tot overschrijding van het geldende geluidproductieplafond, alsmede de referentiepunten ingeval van aanleg
      of ingeval van verplaatsing van referentiepunten; en
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel10
  - number: 10.3.c
    text: |-
      indien toepassing is gegeven aan [artikel 104a van de Wet geluidhinder][ref1], de in dat artikel bedoelde hogere
      waarden.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel104a
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 104a
  - number: '10.4'
    text: |-
      Bij het tracébesluit wordt aangegeven op welke wijze burgers en maatschappelijke organisaties betrokken
      zijn. Indien geen structuurvisie is vastgesteld, wordt bij het tracébesluit aangegeven wat de resultaten van
      de verkenning, bedoeld in [artikel 3][ref1], zijn en verantwoording afgelegd over de wijze waarop burgers,
      maatschappelijke organisaties, betrokken bestuursorganen en, voor zover van toepassing, de beheerder van de
      landelijke spoorweg zijn betrokken bij die verkenning en de resultaten daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel3
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '3'
        hoofdstuk: II
  - number: '11.1'
    text: |-
      Op de voorbereiding van het tracébesluit is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing,
      met dien verstande dat zienswijzen naar voren kunnen worden gebracht door een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '11.2'
    text: |-
      Bij de voorbereiding van het tracébesluit betrekt Onze Minister de betrokken bestuursorganen van gemeenten,
      provincies en waterschappen.
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel11
  - number: '11.3'
    text: 'Onze Minister zendt het ontwerp-tracébesluit aan:'
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel11
  - number: 11.3.a
    text: de betrokken bestuursorganen;
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel11
  - number: 11.3.b
    text: de beheerder van de spoorweg, indien het betrekking heeft op een landelijke spoorweg.
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel11
  - number: '12.1'
    text: |-
      Onze Minister kan zich bij de vaststelling van het tracébesluit in ieder geval baseren op gegevens en onderzoeken
      die niet ouder zijn dan twee jaar.
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel12
  - number: '12.2'
    text: |-
      Onze Minister kan nadere regels stellen ten aanzien van de methoden en uitgangspunten voor de beoordeling van
      effecten van een project tot aanleg of wijziging van een hoofdweg, een landelijke spoorweg of een hoofdvaarweg.
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel12
  - number: '13.1'
    text: |-
      Voor het gebied dat is begrepen in een tracébesluit geldt het tracébesluit als voorbereidingsbesluit als bedoeld in
      [artikel 3.7 van de Wet ruimtelijke ordening][ref1]. Voor zover het tracébesluit geldt als voorbereidingsbesluit,
      is artikel 3.7, vijfde en zesde lid, van de Wet ruimtelijke ordening niet van toepassing. Het tracébesluit geldt
      niet meer als voorbereidingsbesluit indien voor het in de eerste volzin bedoelde gebied een bestemmingsplan in
      overeenstemming met het tracébesluit van kracht is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5'
  - number: '13.3'
    text: |-
      [Artikel 3.3, eerste tot en met derde lid, van de Wet algemene bepalingen omgevingsrecht][ref1] is
      niet van toepassing op aanvragen om een omgevingsvergunning voor een bouwactiviteit als bedoeld in
      [artikel 2.1, eerste lid, onderdeel a, van die wet][ref2] ter uitvoering van het tracébesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '13.4'
    text: |-
      Voor zover het tracébesluit en het bestemmingsplan of de beheersverordening niet
      met elkaar in overeenstemming zijn, geldt het tracébesluit als omgevingsvergunning
      waarbij ten behoeve van een project van nationaal belang met toepassing van
      [artikel 2.12, eerste lid, onderdeel a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref1] van het
      bestemmingsplan of de beheersverordening wordt afgeweken. Bij de toepassing van [artikel 2.10 van die wet][ref2]
      wordt onder het bestemmingsplan of beheersverordening mede het tracébesluit begrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '13.5'
    text: |-
      Voor zover een bestemmingsplan, een beheersverordening of een ander besluit voor de uitvoering
      van werken of werkzaamheden een omgevingsvergunning voor een aanlegactiviteit als bedoeld in
      [artikel 2.1, eerste lid, onderdeel b, van de Wet algemene bepalingen omgevingsrecht][ref1] vereist, geldt zodanige
      eis niet voor de uitvoering van werken of werkzaamheden ter uitvoering van het tracébesluit in het gebied dat is
      begrepen in een tracébesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '13.6'
    text: |-
      Indien ter uitvoering van het tracébesluit handelingen worden verricht waarvoor krachtens
      [artikel 15 van de Wegenverkeerswet 1994][ref1] een verkeersbesluit is vereist, is dat artikel niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel15
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '15'
  - number: '13.7'
    text: |-
      [Artikel 2.7, tweede lid, van de Wet natuurbescherming][ref1] is niet van toepassing op handelingen waarop het
      tracébesluit betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
  - number: '13.8'
    text: |-
      Indien handelingen waarop het tracébesluit betrekking heeft de kwaliteit van de natuurlijke habitats en de habitats
      van soorten in een Natura 2000-gebied als bedoeld in de [Wet natuurbescherming][ref1] kunnen verslechteren of
      een significant verstorend effect kunnen hebben op de soorten waarvoor het gebied is aangewezen, gelet op de
      instandhoudingsdoelstelling voor dat gebied, wordt het tracébesluit uitsluitend vastgesteld indien is voldaan aan
      [artikel 2.8 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037552
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0037552
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '2'
  - number: '13.9'
    text: |-
      Het zevende en achtste lid zijn niet van toepassing indien ten aanzien van het project
      of de andere handeling waarop het tracébesluit betrekking heeft, is voldaan aan
      [artikel 2.9, eerste, tweede, derde of vijfde lid, van de Wet natuurbescherming][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
  - number: '13.10'
    text: |-
      De gemeenteraad stelt binnen een jaar nadat het tracébesluit onherroepelijk is geworden een bestemmingsplan of
      een beheersverordening als bedoeld in de [Wet ruimtelijke ordening][ref1] overeenkomstig het tracébesluit vast.
      Voor zover een ontwerp van een bestemmingsplan zijn grondslag vindt in het tracébesluit kunnen zienswijzen geen
      betrekking hebben op dat deel van het ontwerpplan.


      [ref1]: https://wetten.overheid.nl/BWBR0020449
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020449
  - number: '13.11'
    text: |-
      Indien het bestemmingsplan nog niet in overeenstemming is met het tracébesluit, verleent het college van
      burgemeester en wethouders aan degenen die inzage verlangen in dat plan tevens inzage in het tracébesluit.
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel13
  - number: '14.1'
    text: |-
      Onze Minister kan [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] buiten toepassing laten bij de
      voorbereiding van een besluit tot wijziging van een tracébesluit waartegen beroep aanhangig is, indien het een
      wijziging van ondergeschikte aard betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '14.2'
    text: |-
      Het wijzigingsbesluit als bedoeld in het eerste lid wordt vastgesteld uiterlijk tien dagen voor de zitting, die
      plaatsvindt ten behoeve van de beoordeling van het bestreden besluit.
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel14
  - number: '15.1'
    text: |-
      Het tweede lid is van toepassing op projecten opgenomen in de bij deze wet behorende bijlage en voor zover het
      ontwerp-tracébesluit na 1 januari 2009 ter inzage is gelegd.
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel15
  - number: '15.2'
    text: |-
      Indien op grond van [artikel 7.2 van de Wet milieubeheer][ref1] een milieueffectrapport wordt opgesteld
      ten behoeve van een tracébesluit zijn de [artikelen 7.27, eerste tot en met vijfde en zevende lid][ref2],
      [7.32, vijfde lid][ref3], en [7.39 tot en met 7.42 van die wet][ref4] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '7'
  - number: '16'
    text: '[VERVALLEN]'
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel16
  - number: '17.1'
    text: |-
      Het luchtkwaliteitsonderzoek ten behoeve van een tracébesluit voor de aanleg of wijziging van een hoofdweg wordt
      beperkt tot het gebied dat zich uitstrekt van de voorafgaande tot en met de eerstvolgende aansluiting op of aan de
      aan te leggen of te wijzigen weg en ter weerszijden van dit wegvak tot één kilometer vanuit de meest buiten gelegen
      rijstroken, een en ander voor zover gelegen op Nederlands grondgebied. Onder aansluiting wordt tevens knooppunt
      verstaan.
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel17
  - number: '17.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op het luchtkwaliteitsonderzoek ten behoeve van een tracébesluit
      voor de aanleg of wijziging van een landelijke spoorweg.
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel17
  - number: '18.1'
    text: |-
      Onze Minister zendt het tracébesluit aan de betrokken bestuursorganen en, indien het tracébesluit betrekking heeft
      op een landelijke spoorweg, aan de beheerder van de spoorweg.
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel18
  - number: '18.2'
    text: De terinzagelegging geschiedt tevens ten kantore van de betrokken bestuursorganen.
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel18
  - number: '19'
    text: |-
      Het tracébesluit vervalt van rechtswege indien het niet binnen tien jaar na het tijdstip waarop het onherroepelijk
      is geworden in uitvoering is genomen.
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel19
  - number: '20.1'
    text: .
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel20
  - number: '20.2'
    text: |-
      Onze Minister bevordert een gecoördineerde voorbereiding van de besluiten op de aanvragen om de vergunningen en van
      de overige ambtshalve te nemen besluiten met het oog op de uitvoering van een tracébesluit.
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel20
  - number: '20.3'
    text: |-
      Onze Minister kan van de andere betrokken bestuursorganen de medewerking vorderen, die voor het welslagen van de
      coördinatie nodig is. Die bestuursorganen verlenen de van hen gevorderde medewerking.
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel20
  - number: '20.4'
    text: |-
      Op de voorbereiding van de in het tweede lid bedoelde besluiten is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 20.4.a
    text: |-
      de ontwerpen van de besluiten binnen een door Onze Minister te bepalen termijn worden toegezonden aan Onze
      Minister, die zorg draagt voor de in [artikel 3:13, eerste lid, van die wet][ref1] bedoelde toezending;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 20.4.b
    text: |-
      Onze Minister ten aanzien van de ontwerpen van de besluiten gezamenlijk toepassing kan geven aan de
      [artikelen 3:11, eerste lid][ref1], en [3:12 van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 20.4.c
    text: zienswijzen naar voren kunnen worden gebracht door een ieder;
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel20
  - number: 20.4.d
    text: |-
      in afwijking van [artikel 3:18 van die wet][ref1] de besluiten worden genomen binnen een door Onze Minister te
      bepalen termijn;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 20.4.e
    text: de besluiten onverwijld worden toegezonden aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel20
  - number: '20.5'
    text: |-
      [Artikel 3.9 van de Wet algemene bepalingen omgevingsrecht][ref1] is niet van toepassing op aanvragen om een
      omgevingsvergunning voor een bouwactiviteit als bedoeld in [artikel 2.1, eerste lid, onder a, van die wet][ref2]
      ter uitvoering van het tracébesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '20.6'
    text: |-
      Indien een bestuursorgaan dat in eerste aanleg bevoegd is te beslissen op een aanvraag om een vergunning niet
      of niet tijdig overeenkomstig de aanvraag beslist, kunnen Onze Minister en Onze Minister wie het mede aangaat
      gezamenlijk een beslissing op de aanvraag nemen. In het laatste geval treedt hun besluit in de plaats van het
      besluit van het in eerste aanleg bevoegde bestuursorgaan. Indien Onze in de eerste volzin bedoelde Ministers
      voornemens zijn zelf een beslissing op de aanvraag te nemen, plegen zij overleg met het bestuursorgaan dat in
      eerste aanleg bevoegd is op de aanvraag te beslissen.
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel20
  - number: '20.7'
    text: Het zesde lid is van overeenkomstige toepassing op de in het tweede lid bedoelde ambtshalve te nemen besluiten.
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel20
  - number: '20.8'
    text: |-
      Indien bij de toepassing van het zesde lid de beslissing op een aanvraag wordt genomen door Onze in dat lid
      bedoelde Ministers, stort het bestuursorgaan dat in eerste aanleg bevoegd was te beslissen op de aanvraag, de ter
      zake ontvangen leges in 's Rijks kas.
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel20
  - number: '20.9'
    text: |-
      Ten aanzien van de in het tweede lid bedoelde aanvragen is Onze Minister mede bevoegd deze in te dienen bij de
      bevoegde bestuursorganen.
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel20
  - number: '20.10'
    text: |-
      De in het tweede lid bedoelde besluiten worden, voor zover ten aanzien daarvan het vierde lid is toegepast,
      gelijktijdig door Onze Minister bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel20
  - number: '20.11'
    text: |-
      Voor zover een ontwerp van een besluit als bedoeld in het tweede lid, zijn grondslag vindt in een tracébesluit,
      kunnen bedenkingen daarop geen betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel20
  - number: '21.1'
    text: |-
      De in [artikel 8][ref1] bedoelde werken worden voor de toepassing van de [Belemmeringenwet Privaatrecht][ref2]
      aangemerkt als openbare werken van algemeen nut.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0001936
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '8'
        hoofdstuk: III
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0001936
  - number: '21.2'
    text: |-
      Indien voor de uitvoering van een of meer besluiten als bedoeld in [artikel 20, tweede lid][ref1], toepassing van
      de [Belemmeringenwet Privaatrecht][ref2] noodzakelijk is:


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0001936
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '20'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0001936
  - number: 21.2.a
    text: |-
      kan Onze Minister in afwijking van [artikel 2, vierde lid, van de Belemmeringenwet Privaatrecht][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0001936#Artikel2
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001936
        artikel: '2'
  - number: 21.2.a.1°
    text: een andere plaats of gemeente aanwijzen waar de zitting plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel21
  - number: 21.2.a.2°
    text: bepalen dat de zitting wordt geleid door een door Onze Minister aan te wijzen persoon;
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel21
  - number: 21.2.b
    text: |-
      worden in afwijking van de artikelen 2, zevende lid, en [3, derde lid][ref1], juncto
      [2, zevende lid, van de Belemmeringenwet Privaatrecht][ref2] gedeputeerde staten niet gehoord;


      [ref1]: https://wetten.overheid.nl/BWBR0001936#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0001936#Artikel2
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001936
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0001936
        artikel: '2'
  - number: 21.2.c
    text: |-
      geldt in plaats van [artikel 4 van de Belemmeringenwet Privaatrecht][ref1] dat de werking van een besluit als
      bedoeld in [artikel 2, vijfde lid][ref2], of [artikel 3, tweede lid, van de Belemmeringenwet Privaatrecht][ref3]
      opgeschort wordt totdat de termijn voor het indienen van een beroepschrift is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0001936#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0001936#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0001936#Artikel3
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001936
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0001936
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0001936
        artikel: '3'
  - number: 21a
    text: |-
      De in [artikel 18, eerste lid, van de onteigeningswet][ref1] bedoelde dagvaarding kan geschieden nadat het
      tracébesluit is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel18
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '18'
  - number: 21b.1
    text: |-
      Onverminderd het bepaalde in [artikel 59, eerste lid, van de onteigeningswet][ref1] kan het vonnis van onteigening
      van de rechtbank niet eerder in de openbare registers worden ingeschreven dan nadat het tracébesluit onherroepelijk
      is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel59
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel21b
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '59'
  - number: 21b.2
    text: |-
      In aanvulling op de [artikelen 54n][ref1] en [59 van de onteigeningswet][ref2] is ten behoeve van de in het eerste
      lid bedoelde inschrijving een uitspraak van de Afdeling bestuursrechtspraak van de Raad van State dan wel een
      verklaring van de Secretaris van de Raad van State nodig, waaruit blijkt dat het tracébesluit onherroepelijk is
      geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel54n
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel59
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel21b
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: 54n
      - id: ref2
        bwb_id: BWBR0001842
        artikel: '59'
  - number: '22.1'
    text: |-
      Indien een belanghebbende ten gevolge van een tracébesluit schade lijdt of zal lijden, die redelijkerwijs niet
      of niet geheel te zijnen laste behoort te blijven en ten aanzien waarvan de vergoeding niet of niet voldoende
      anderszins is verzekerd, kent Onze Minister hem op zijn verzoek een naar billijkheid te bepalen schadevergoeding
      toe.
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel22
  - number: '22.2'
    text: |-
      [Afdeling 6.1 van de Wet ruimtelijke ordening][ref1] blijft buiten toepassing voor zover de belanghebbende met
      betrekking tot de schade een beroep doet of kan doen op een schadevergoeding als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Afdeling6.1
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0020449
        afdeling: '6.1'
  - number: '22.3'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld omtrent de indiening en afhandeling van een verzoek
      om schadevergoeding.
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel22
  - number: '23.1'
    text: |-
      Onze Minister onderzoekt voor afloop van de termijn, genoemd in [artikel 10, eerste lid, onderdeel f][ref1], de
      gevolgen van de ingebruikneming van een aangelegde of gewijzigde hoofdweg, landelijke spoorweg of hoofdvaarweg ten
      aanzien van de in dat artikel bedoelde milieuaspecten.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel10
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '10'
        hoofdstuk: III
        paragraaf: '3.1'
  - number: '23.2'
    text: |-
      Indien het onderzoek betrekking heeft op het aspect luchtkwaliteit, wordt, voor zover voorhanden, gebruik
      gemaakt van de gegevens als bedoeld in [artikel 5.14 van de Wet milieubeheer][ref1], aangegeven welke aanvullende
      maatregelen naar aanleiding van dat onderzoek nodig zijn en binnen welke termijn die maatregelen worden getroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5'
  - number: '23.3'
    text: |-
      Indien het onderzoek betrekking heeft op het aspect geluidhinder, wordt inzicht gegeven in de geluidproductie
      of geluidsbelasting na realisering van de in het tracébesluit opgenomen geluidmaatregelen, aangegeven welke
      aanvullende maatregelen naar aanleiding van dat onderzoek nodig zijn en binnen welke termijn die maatregelen worden
      getroffen.
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel23
  - number: '23.4'
    text: |-
      Onze Minister zendt de Tweede Kamer der Staten-Generaal, de betrokken bestuursorganen en, voor zover van
      toepassing, de beheerder van de landelijke spoorweg de resultaten van het onderzoek toe alsmede een beschrijving
      van de maatregelen die nodig zijn om alsnog te voldoen aan de milieueisen die ten grondslag liggen aan de in het
      tracébesluit opgenomen maatregelen.
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel23
  - number: '23.5'
    text: |-
      De in het vierde lid bedoelde toezending geschiedt gelijktijdig met die van het eerstvolgende verslag, bedoeld
      in [artikel 24][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel24
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '24'
        hoofdstuk: IV
  - number: '24'
    text: Onze Minister zendt de Staten-Generaal ieder half jaar een verslag over de voortgang van de projecten.
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel24
  - number: '25'
    text: |-
      In afwijking van [artikel 6:8 van de Algemene wet bestuursrecht][ref1] vangt de termijn voor het indienen van
      een beroepschrift tegen de in [artikel 20, tweede lid][ref2], bedoelde besluiten aan met ingang van de dag na die
      waarop de in artikel 20, tiende lid, bedoelde bekendmaking is geschied.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0006147#Artikel20
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0006147
        artikel: '20'
        hoofdstuk: IV
  - number: '26.1'
    text: |-
      Met betrekking tot beroepen tegen een tracébesluit beslist de Afdeling bestuursrechtspraak van de Raad van State
      binnen twaalf maanden na ontvangst van een verweerschrift. Met betrekking tot beroepen tegen het tracébesluit
      A74 beslist de Afdeling in afwijking van het bepaalde in de eerste volzin binnen zes maanden na ontvangst van het
      verweerschrift.
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel26
  - number: '26.2'
    text: |-
      In bijzondere omstandigheden kan de Afdeling de in het eerste lid genoemde termijn met ten hoogste drie maanden
      verlengen.
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel26
  - number: '26.3'
    text: |-
      Met betrekking tot beroepen tegen de in [artikel 20, tweede lid][ref1], bedoelde besluiten beslist de Afdeling
      bestuursrechtspraak van de Raad van State binnen zes maanden na ontvangst van de desbetreffende verweerschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel20
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '20'
        hoofdstuk: IV
  - number: '27'
    text: |-
      Indien tegen een in [artikel 20, tweede lid][ref1], bedoeld besluit beroep kan worden ingesteld, kunnen bij dit
      beroep geen gronden worden aangevoerd die betrekking hebben op een tracébesluit waarop dat besluit rust.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel20
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '20'
        hoofdstuk: IV
  - number: '29'
    text: |-
      Onze Ministers zenden binnen drie jaar na het in werking treden van deze wet, en vervolgens telkens om de vijf
      jaar, aan de Staten-Generaal een verslag over de wijze waarop zij is toegepast.
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel29
  - number: '33'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel33
  - number: '34'
    text: |-
      Voor de plaatsing van deze wet in het *Staatsblad* brengt Onze Minister de in deze wet voorkomende aanhalingen van
      artikelen en afdelingen van de [Algemene wet bestuursrecht][ref1] in overeenstemming met de door Onze Minister van
      Justitie opnieuw vastgestelde nummering daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: '35'
    text: 'Deze wet kan worden aangehaald als: Tracéwet.'
    url: https://wetten.overheid.nl/BWBR0006147/2017-01-01#Artikel35
