bwb_id: BWBR0006147
url: https://wetten.overheid.nl/BWBR0006147/2011-01-14
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het ter verzekering van doelmatige procedures voor de totstandkoming
    en van de tijdige tenuitvoerlegging van besluiten met betrekking tot de aanleg of wijziging van hoofdwegen, van
    landelijke railwegen en van hoofdvaarwegen wenselijk is regels te stellen voor de voorbereiding, vaststelling
    en tenuitvoerlegging van zodanige besluiten, deze regels te doen aansluiten bij het bepaalde bij en krachtens de
    Wet milieubeheer (Stb. 1992, 551) inzake het milieu-effectrapport zomede de coördinatie bij de toepassing van die
    regels met de toepassing van de Wet op de Ruimtelijke Ordening (Stb. 1985, 626) te verzekeren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel1
  - number: 1.1.b
    text: 'Onze Ministers: Onze Minister en Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;'
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel1
  - number: 1.1.bb
    text: |-
      regionaal openbaar lichaam: een plusregio als bedoeld in
      [artikel 104 van de Wet gemeenschappelijke regelingen][ref1] die de gemeente of gemeenten Amsterdam, Arnhem en
      Nijmegen, Eindhoven en Helmond, Enschede en Hengelo, ’s-Gravenhage, Rotterdam of Utrecht omvat;


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel104
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '104'
  - number: 1.1.c
    text: |-
      hoofdweg: een weg waarvoor een verbinding is aangegeven op een kaart van indicatieve
      en limitatieve hoofdwegverbindingen, die behoort tot een structuurvisie als bedoeld in
      [artikel 2.3 van de Wet ruimtelijke ordening][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel2
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '2'
  - number: 1.1.d
    text: |-
      landelijke spoorweg: een spoorweg waarvoor een verbinding is aangegeven op een kaart van
      indicatieve en limitatieve spoorwegverbindingen, die behoort tot een structuurvisie als bedoeld in
      [artikel 2.3 van de Wet ruimtelijke ordening][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel2
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '2'
  - number: 1.1.e
    text: |-
      hoofdvaarweg: een vaarweg waarvoor een verbinding is aangegeven op een kaart van indicatieve
      en limitatieve hoofdvaarwegverbindingen, die behoort tot een structuurvisie als bedoeld in
      [artikel 2.3 van de Wet ruimtelijke ordening][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel2
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '2'
  - number: 1.1.f
    text: |-
      bijkomende infrastructurele voorzieningen: werken of bouwwerken, daaronder begrepen oplaadpunten bestemd voor
      het laden van accu’s van voertuigen die een elektromotor als hoofdmotor hebben, die, zonder deel uit te maken van
      het profiel van een hoofdweg, een landelijke spoorweg of een hoofdvaarweg, met die weg, spoorweg of vaarweg zijn
      verbonden en dienen voor de instandhouding dan wel het veilig en doelmatig gebruik daarvan;
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel1
  - number: 1.1.g
    text: |-
      verkeers- en vervoertraject: een verkeers- en vervoergebied gelegen tussen twee punten van een verbinding als
      bedoeld onder *c, d* of *e* van dit artikellid;
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel1
  - number: 1.1.h
    text: 'tracé:'
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel1
  - number: 1.1.h.1°
    text: |-
      de aanduiding op een of meer topografische of geografische kaarten van het verloop en de geografische omvang van
      een aan te leggen of te wijzigen hoofdweg, landelijke spoorweg of hoofdvaarweg, en
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel1
  - number: 1.1.h.2°
    text: |-
      een nauwkeurige beschrijving van: - de daarbij te realiseren ligging in het terrein,
        - de daarbij te realiseren bijkomende infrastructurele voorzieningen en
        - de daarbij te realiseren maatregelen van landschappelijke, landbouwkundige en ecologische aard, en
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel1
  - number: 1.1.h.3°
    text: |-
      indien het de aanleg of wijziging van een hoofdweg betreft: - een nauwkeurige beschrijving van het daarbij te
      realiseren aantal rijstroken en
        - de in acht te nemen grenswaarden voor geluidhinder en de aanduiding van de maatregelen, gericht op het
      terugbrengen van de verwachte geluidsbelasting van de gevel van woningen of andere geluidsgevoelige gebouwen
      onderscheidenlijk aan de grens van geluidsgevoelige terreinen als bedoeld in de [Wet geluidhinder][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0003227
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003227
  - number: 1.1.h.4°
    text: |-
      indien het de aanleg of wijziging van een landelijke spoorweg betreft: - een nauwkeurige beschrijving van het
      daarbij te realiseren aantal sporen en
        - de in acht te nemen grenswaarden voor geluidhinder en de aanduiding van de maatregelen, gericht op het
      terugbrengen van de verwachte geluidsbelasting van de gevel van woningen of andere geluidsgevoelige gebouwen
      onderscheidenlijk aan de grens van geluidsgevoelige terreinen als bedoeld in de [Wet geluidhinder][ref1],
      met betrekking tot de aanleg of wijziging van de landelijke spoorweg, alsmede de aansluitende landelijke
      spoorweg waarop ten gevolge van de aanleg of wijziging sprake is van een aanpassing in de zin van
      [artikel 106, eerste lid, onder l, van de Wet geluidhinder][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003227
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel106
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003227
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '106'
  - number: '1.2'
    text: |-
      Ontheffingen, dispensaties, afwijkingen en soortgelijke beschikkingen worden voor de toepassing van deze wet als
      vergunning aangemerkt.
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel1
  - number: '1.3'
    text: |-
      In deze wet wordt onder aanleg of wijziging van een hoofdweg, landelijke spoorweg of hoofdvaarweg mede verstaan de
      aanleg of wijziging van een deel van die hoofdweg, landelijke spoorweg of hoofdvaarweg.
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel1
  - number: '2.1'
    text: 'Deze wet is van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel2
  - number: 2.1.a
    text: de aanleg van een hoofdweg, landelijke spoorweg of hoofdvaarweg;
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel2
  - number: 2.1.b
    text: 'een wijziging van een hoofdweg, die bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel2
  - number: 2.1.b.1°
    text: de ombouw van een weg tot autosnelweg of
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel2
  - number: 2.1.b.2°
    text: |-
      de uitbreiding van een weg met één of meer rijstroken, indien het uit te breiden weggedeelte twee knooppunten of
      aansluitingen met elkaar verbindt;
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel2
  - number: 2.1.c
    text: |-
      een wijziging van een landelijke spoorweg waarmee Onze Minister de bruikbaarheid van die spoorweg beoogt te
      verbeteren, en die bestaat uit:
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel2
  - number: 2.1.c.1°
    text: |-
      een uitbreiding van die spoorweg met één of meer sporen, indien het uit te breiden spoorweggedeelte twee
      aansluitingen met elkaar verbindt;
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel2
  - number: 2.1.c.2°
    text: de aanleg van spoorwegbouwkundige bouwwerken;
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel2
  - number: 2.1.c.3°
    text: de aanleg van een verbindingsboog; of
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel2
  - number: 2.1.c.4°
    text: een geheel van onderling samenhangende maatregelen ten aanzien van die spoorweg;
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel2
  - number: 2.1.d
    text: |-
      het opnieuw in gebruik nemen van een reeds aangelegde landelijke spoorweg voor zover het gaat om een lengte van 5
      kilometer of meer;
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel2
  - number: 2.1.e
    text: 'een wijziging van de hoofdvaarweg, die bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel2
  - number: 2.1.e.1°
    text: |-
      een vergroting of verdieping waardoor het ruimte-oppervlak van de hoofdvaarweg met ten minste twintig procent
      toeneemt dan wel de hoofdvaarweg blijvend wordt verdiept waarbij meer dan vijf miljoen kubieke meter grond wordt
      verzet of
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel2
  - number: 2.1.e.2°
    text: |-
      een verlegging van een rivier waarbij het zomerbed wordt verlegd en de verlegging een oppervlakte beslaat van ten
      minste 50 hectare.
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel2
  - number: '2.2'
    text: |-
      Een beslissing om de procedure ten aanzien van de aanleg of wijziging van een hoofdweg of hoofdvaarweg of de
      medewerking aan de aanleg of wijziging van een landelijke spoorweg aan te vangen, wordt genomen door Onze Minister
      in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer.
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel2
  - number: '2.3'
    text: |-
      In de beslissing, bedoeld in het tweede lid, wordt ten aanzien van de projecten, genoemd in het eerste lid,
      onder b tot en met e, aangegeven of het ontwerp-tracébesluit, bedoeld in [artikel 11][ref1], en het tracébesluit,
      bedoeld in [artikel 15][ref2], worden vastgesteld door Onze Minister in overeenstemming met Onze Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer dan wel door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0006147#Artikel15
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '11'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0006147
        artikel: '15'
        hoofdstuk: III
  - number: 2a
    text: |-
      Hoofdstuk II is alleen van toepassing op besluitvorming omtrent een project als bedoeld in
      [artikel 2, eerste lid, onder a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel2
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '2'
        hoofdstuk: I
  - number: '3.1'
    text: |-
      Onze Minister stelt een trajectnota op ter voorbereiding van het standpunt, bedoeld in [artikel 9][ref1], en het
      tracébesluit, bedoeld in [artikel 15][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0006147#Artikel15
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '9'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0006147
        artikel: '15'
        hoofdstuk: III
  - number: '3.2'
    text: |-
      Bij de voorbereiding betrekt Onze Minister de raden van de gemeenten, de provinciale staten van de provincies en
      de besturen van de regionale openbare lichamen en waterschappen op het gebied waarvan de trajectnota redelijkerwijs
      betrekking kan hebben dan wel betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel3
  - number: '3.3'
    text: |-
      Onze Minister geeft kennis van zijn voornemen om een trajectnota op te stellen met overeenkomstige toepassing
      van [artikel 3:12 van de Algemene wet bestuursrecht][ref1]. Deze kennisgeving geschiedt gelijktijdig met de
      kennisgeving, die is voorgeschreven in [artikel 7.27, derde lid, van de Wet milieubeheer][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
  - number: '3.4'
    text: De terinzagelegging van het voornemen geschiedt ten kantore van de betrokken bestuursorganen.
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel3
  - number: '3.5'
    text: |-
      Onze Minister stelt een ieder in de gelegenheid naar keuze schriftelijk of mondeling zijn zienswijze omtrent het
      voornemen naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel3
  - number: '3.6'
    text: |-
      Onze Minister bereidt de trajectnota voor gelijktijdig en in samenhang met de voorbereiding van het
      milieueffectrapport, als voorgeschreven bij of krachtens de [Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '3.7'
    text: |-
      Een trajectnota als bedoeld in dit hoofdstuk wordt voor de toepassing van de [artikelen 7.30, eerste lid][ref1],
      en [7.32 van de Wet milieubeheer][ref2] gelijkgesteld met een voorontwerp van een besluit als bedoeld in
      [artikel 7.36a van laatstbedoelde wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '7'
  - number: '4.1'
    text: 'Een trajectnota bevat ten minste de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel4
  - number: 4.1.a
    text: |-
      een omschrijving van het verkeers- en vervoertraject waarop de nota betrekking heeft, en een aanduiding daarvan op
      een of meer topografische of geografische kaarten;
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel4
  - number: 4.1.b
    text: |-
      een beschrijving van de bestaande verkeers- en vervoervoorzieningen in het desbetreffende verkeers- en
      vervoertraject;
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel4
  - number: 4.1.c
    text: |-
      een uiteenzetting van de bestaande en te verwachten verkeers- en vervoerbehoeften voor het desbetreffende verkeers-
      en vervoertraject;
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel4
  - number: 4.1.d
    text: 'een uiteenzetting van:'
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel4
  - number: 4.1.d.1°
    text: de mogelijke redenen om in de onder *c* bedoelde behoeften niet te voorzien;
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel4
  - number: 4.1.d.2°
    text: |-
      de mogelijkheden om in de onder *c* bedoelde behoeften te voorzien zonder aanleg van een hoofdweg, landelijke
      spoorweg of hoofdvaarweg, als bedoeld in [artikel 2, eerste lid, onder a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel2
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '2'
        hoofdstuk: I
  - number: 4.1.d.3°
    text: |-
      de mogelijkheden om in de onder *c* bedoelde behoeften te voorzien door aanleg van een hoofdweg, landelijke
      spoorweg of hoofdvaarweg, als bedoeld in [artikel 2, eerste lid, onder a][ref1], alsmede een beschrijving van
      hetgeen met de voorgenomen activiteit wordt beoogd:


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel2
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '2'
        hoofdstuk: I
  - number: 4.1.e
    text: |-
      het tracé van de hoofdweg, landelijke spoorweg of hoofdvaarweg, zo mogelijk uitgewerkt in een of meer varianten,
      waarbij voor elke variant de mogelijkheid van een verschuiving van de as van het tracé van ten hoogste 100 meter
      aan elke zijde en van een verschuiving van ten hoogste twee meter naar boven of naar beneden is open gelaten,
      alsmede een beschrijving van de kenmerken van die varianten;
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel4
  - number: 4.1.f
    text: |-
      een beschrijving van de bestaande inrichting en het gebruik van de grond, daaronder begrepen water, in het
      desbetreffende verkeers- en vervoertraject;
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel4
  - number: 4.1.g
    text: |-
      een beschrijving van de ruimtelijke ontwikkeling van het desbetreffende verkeers- en vervoertraject en de mate
      waarin in structuurvisies als bedoeld in de [artikelen 2.1][ref1] en [2.2 van de Wet ruimtelijke ordening][ref2],
      in een verordening als bedoeld in [artikel 4.1 van die wet][ref3], in een bestemmingsplan als bedoeld in
      [artikel 3.1 van die wet][ref4] of een beheersverordening als bedoeld in [artikel 3.38 van die wet][ref5] met de
      aanleg van de hoofdweg, landelijke spoorweg of hoofdvaarweg is rekening gehouden, alsmede een beschrijving van de
      ruimtelijke gevolgen van de aanleg van de hoofdweg, landelijke spoorweg of hoofdvaarweg voor het in de omgeving van
      het desbetreffende verkeers- en vervoertraject gelegen gebied;


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0020449
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 4.1.h
    text: |-
      een beschrijving van de voor- en nadelen van de onder *d* bedoelde alternatieven en de onder *e* bedoelde
      varianten;
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel4
  - number: 4.1.i
    text: een raming van de kosten van de aanleg van de hoofdweg, landelijke spoorweg of hoofdvaarweg.
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel4
  - number: '4.2'
    text: |-
      Bij de toepassing van het eerste lid onder *a* wordt gebruik gemaakt van een of meer overzichtskaarten met een
      schaal van ten minste 1:50 000.
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel4
  - number: '4.3'
    text: |-
      Bij de toepassing van het eerste lid onder *e* wordt ter voldoening aan
      [artikel 1, eerste lid onder h, onder 1°][ref1] gebruik gemaakt van een of meer detailkaarten met een schaal van
      ten minste 1:10 000 en van een of meer overzichtskaarten met een schaal van ten minste 1:50 000.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel1
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '1'
        hoofdstuk: I
  - number: '5'
    text: |-
      Indien de trajectnota betrekking heeft op het tracé van een landelijke spoorweg, betrekt Onze Minister de beheerder
      van de spoorweg bij de voorbereiding daarvan. Deze verleent de in verband daarmee nodige medewerking aan het
      opstellen van de trajectnota.
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel5
  - number: '6.1'
    text: |-
      Onze Minister voert ter voorbereiding van de trajectnota met de betrokken bestuursorganen overleg over de opzet van
      de nota ten aanzien van het verkeers- en vervoertraject als bedoeld in [artikel 4, eerste lid onder ][ref1], en de
      te behandelen alternatieven en varianten als bedoeld in [artikel 4, eerste lid onder ][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006147#Artikel4
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '4'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0006147
        artikel: '4'
        hoofdstuk: II
  - number: '6.2'
    text: |-
      Onze Minister voert met de betrokken bestuursorganen voorts overleg bij de verdere voorbereiding van de
      trajectnota.
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel6
  - number: '7.1'
    text: |-
      Onze Minister geeft kennis van de trajectnota met overeenkomstige toepassing van
      [artikel 3:12 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '7.2'
    text: |-
      De [artikelen 3:11][ref1], [3:14][ref2], [3:15, eerste lid][ref3], [3:16][ref4] en
      [3:17 van de Algemene wet bestuursrecht][ref5] zijn van overeenkomstige toepassing, met dien verstande dat in
      plaats van «het ontwerp van het te nemen besluit» en het «ontwerp» wordt gelezen: de trajectnota. Zienswijzen
      kunnen naar voren worden gebracht door een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '8.1'
    text: |-
      Binnen een door Onze Minister te bepalen termijn van ten hoogste vier maanden na de dag waarop de trajectnota ter
      inzage is gelegd, geven de betrokken bestuursorganen in een met redenen omkleed advies ten minste aan:
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel8
  - number: 8.1.a
    text: |-
      welke van de in de trajectnota behandelde alternatieven en varianten naar hun oordeel passen in hun ruimtelijk
      beleid;
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel8
  - number: 8.1.b
    text: welke van die alternatieven en varianten naar hun oordeel de voorkeur verdienen;
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel8
  - number: 8.1.c
    text: of en zo ja, tegen welke van die alternatieven en varianten zij bedenkingen hebben.
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel8
  - number: '8.2'
    text: |-
      Indien de betrokken bestuursorganen binnen de gestelde termijn geen advies hebben uitgebracht stemmen zij in met de
      volledigheid van de in de trajectnota behandelde alternatieven en varianten.
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel8
  - number: '9.1'
    text: |-
      Onze Minister bepaalt binnen acht weken na het verstrijken van de ingevolge [artikel 8, eerste lid][ref1], bepaalde
      termijn, in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, zijn
      standpunt met betrekking tot de aanleg van de hoofdweg, hoofdvaarweg of landelijke spoorweg of de medewerking aan
      de aanleg van de landelijke spoorweg. Het standpunt houdt in dat hij de aanleg van het in de eerste volzin bedoelde
      werk of de medewerking daaraan al dan niet verder in overweging neemt.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel8
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '8'
        hoofdstuk: II
  - number: '9.2'
    text: |-
      Indien de trajectnota betrekking heeft op het tracé van een landelijke spoorweg, voert Onze Minister overleg over
      het door hem te bepalen standpunt met de beheerder van de spoorweg.
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel9
  - number: '9.3'
    text: |-
      Onze Minister deelt het standpunt onder opgave van redenen schriftelijk mee aan de betrokken bestuursorganen en,
      indien de trajectnota betrekking heeft op het tracé van een landelijke spoorweg, aan de beheerder van de spoorweg.
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel9
  - number: '9.4'
    text: |-
      Binnen een week na de mededeling, bedoeld in het derde lid, legt Onze Minister
      het standpunt ter inzage. [Artikel 3, vierde lid][ref1], van deze wet en
      [artikel 3:11, derde en vierde lid, van de Algemene wet bestuursrecht][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '10.1'
    text: |-
      Indien het standpunt van Onze Minister inhoudt dat hij de aanleg van de hoofdweg, hoofdvaarweg of landelijke
      spoorweg of de medewerking aan de aanleg van de landelijke spoorweg verder in overweging neemt, houdt het standpunt
      tevens in welk tracé de voorkeur verdient.
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel10
  - number: '10.2'
    text: |-
      In geval van toepassing van het eerste lid wordt binnen zes maanden na het uitbrengen van het standpunt een
      ontwerp-tracébesluit vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel10
  - number: 10a
    text: |-
      Indien op grond van [artikel 7.2 van de Wet milieubeheer][ref1] een milieueffectrapport wordt opgesteld ten
      aanzien van een project als bedoeld in [artikel 2, eerste lid, onder b][ref2], zijn ten aanzien van de projecten,
      opgenomen in de bij deze wet behorende bijlage, de [artikelen 7.27, eerste tot en met vijfde en zevende lid][ref3],
      [7.32, vijfde lid][ref4], en [7.39 tot en met 7.42 van die wet][ref5] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006147#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0006147
        artikel: '2'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '7'
      - id: ref5
        bwb_id: BWBR0003245
        artikel: '7'
  - number: 10b.1
    text: |-
      Het bepaalde in het tweede en derde lid is van toepassing op projecten tot wijziging van een hoofdweg als bedoeld
      in [artikel 2, eerste lid, onder b][ref1], opgenomen in de bij deze wet behorende bijlage.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel2
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '2'
        hoofdstuk: I
  - number: 10b.2
    text: |-
      In een geval van de wijziging van een hoofdweg als bedoeld in [artikel 2, eerste lid, onder b][ref1], worden
      voornemens tot invoering van een prijs voor het rijden met een motorrijtuig op de weg buiten beschouwing gelaten
      bij de toepassing van de [artikelen 11, eerste lid][ref2], en [15, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006147#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0006147#Artikel15
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0006147
        artikel: '11'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0006147
        artikel: '15'
        hoofdstuk: III
  - number: 10b.3
    text: |-
      Indien op grond van [artikel 7.2 van de Wet milieubeheer][ref1] een milieueffectrapport wordt opgesteld ten
      aanzien van een project als bedoeld in [artikel 2, eerste lid, onder b][ref2], worden voornemens tot invoering
      van een prijs voor het rijden met een motorrijtuig op de weg buiten beschouwing gelaten bij de beschrijving van de
      alternatieven, bedoeld in [artikel 7.23, eerste lid, onderdeel b, van de Wet milieubeheer][ref3], alsmede bij de
      beschrijving van de bestaande toestand van het milieu en van de te verwachten ontwikkeling van dat milieu, bedoeld
      in artikel 7.23, eerste lid, onderdeel d, van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006147#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0006147
        artikel: '2'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '7'
  - number: '11.1'
    text: |-
      Het ontwerp-tracébesluit wordt vastgesteld door Onze Minister in overeenstemming met Onze Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer dan wel door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel11
  - number: '11.2'
    text: 'Het ontwerp-tracébesluit bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel11
  - number: 11.2.a
    text: |-
      de voorgenomen beslissing tot vaststelling van hogere waarden voor de ten hoogste toelaatbare geluidsbelasting in
      zones ingevolge de [artikelen 87e tot en met 87i][ref1] of [106d tot en met 106h van de Wet geluidhinder][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel87e
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel106d
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 87e
      - id: ref2
        bwb_id: BWBR0003227
        artikel: 106d
  - number: 11.2.b
    text: |-
      een beschrijving van de wijze waarop de inpassing van de aan te leggen of te wijzigen hoofdweg, landelijke
      spoorweg of hoofdvaarweg zal geschieden, en waar dit in redelijkheid niet kan worden verlangd, welke compenserende
      maatregelen zullen worden getroffen;
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel11
  - number: 11.2.c
    text: |-
      een beschrijving van de wijze waarop rekening is gehouden met het advies van de Commissie voor de tunnelveiligheid
      ten aanzien van het tracé van een in de desbetreffende hoofdweg of landelijke spoorweg geplande tunnel en, indien
      het een tunnel in een hoofdweg betreft, de wijze waarop rekening is gehouden met de risicoanalyse, bedoeld in
      [artikel 6, eerste lid, van de Wet aanvullende regels veiligheid wegtunnels][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019516#Artikel6
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0019516
        artikel: '6'
  - number: '11.3'
    text: |-
      Bij het ontwerp-tracébesluit wordt ter voldoening aan [artikel 1, eerste lid, onder h, onder 1°][ref1], gebruik
      gemaakt van een of meer detailkaarten met een schaal van ten minste 1:2500 en van een of meer overzichtskaarten met
      een schaal van ten minste 1:20 000.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel1
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '1'
        hoofdstuk: I
  - number: '12.1'
    text: |-
      Onze Minister zendt het ontwerp-tracébesluit aan de betrokken bestuursorganen en, indien het ontwerp-tracébesluit
      betrekking heeft op het tracé van een landelijke spoorweg, aan de beheerder van de spoorweg.
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel12
  - number: '12.2'
    text: |-
      Onze Minister zendt het ontwerp-tracébesluit, indien het hogere waarden bevat voor de ten
      hoogste toelaatbare geluidsbelasting in zones ingevolge de [artikelen 87e tot en met 87i][ref1]
      of [106d tot en met 106h van de Wet geluidhinder][ref2], voorts aan:


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel87e
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel106d
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 87e
      - id: ref2
        bwb_id: BWBR0003227
        artikel: 106d
  - number: 12.2.a
    text: |-
      de gebruikers van de woningen of de woonwagenstandplaatsen, het bevoegd gezag van scholen en de directies van
      ziekenhuizen, verpleeghuizen en andere gezondheidszorggebouwen waarvoor een hogere waarde wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel12
  - number: 12.2.b
    text: de Minister van Onderwijs, Cultuur en Wetenschappen, indien het betrekking heeft op scholen.
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel12
  - number: '12.3'
    text: |-
      Op de voorbereiding van het tracébesluit is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.
      Bij de voorbereiding betrekt Onze Minister de raden van de gemeenten, de provinciale staten van de provincies en
      de besturen van waterschappen op het gebied waarvan het te nemen tracébesluit betrekking heeft. Zienswijzen kunnen
      naar voren worden gebracht door een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '12.4'
    text: |-
      In afwijking van het tweede lid, aanhef en onder a, kan Onze Minister, indien de omvang van het ontwerp-
      tracébesluit daartoe aanleiding geeft, volstaan met eenieder van de in het tweede lid, onder a, bedoelde personen
      de strekking van het ontwerp-tracébesluit mee te delen en de onderdelen van het ontwerp-tracébesluit die voor de
      betrokkene redelijkerwijs van belang zijn, toe te zenden.
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel12
  - number: '15.1'
    text: |-
      Het tracébesluit wordt binnen vijf maanden na de terinzagelegging van het ontwerp-tracébesluit vastgesteld
      door Onze Minister in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en
      Milieubeheer, dan wel door Onze Minister. Indien krachtens het tiende lid toepassing wordt gegeven aan
      [artikel 19j van de Natuurbeschermingswet 1998][ref1] of toepassing wordt gegeven aan het elfde lid wordt het
      tracébesluit vastgesteld mede in overeenstemming met Onze Minister van Landbouw, Natuur en Voedselkwaliteit.
      Indien niet binnen drie weken na het daartoe strekkende verzoek van Onze Minister overeenstemming is
      bereikt tussen Onze Minister en Onze Minister van Landbouw, Natuur en Voedselkwaliteit legt Onze Minister
      dit voor aan Onze Minister-President, Minister van Algemene Zaken. De [artikelen 9, tweede lid][ref2],
      en [11, tweede lid, onderdeel b, en derde lid][ref3], zijn van overeenkomstige toepassing. Bij
      de vaststelling van het tracébesluit inzake de aanleg of wijziging van een hoofdweg, bedoeld in
      [artikel 2, eerste lid, onder a en b][ref4], wordt, onverminderd de bevoegdheid tot herstel van gebreken, gebruik
      gemaakt van:


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel19j
      [ref2]: https://wetten.overheid.nl/BWBR0006147#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0006147#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0006147#Artikel2
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 19j
      - id: ref2
        bwb_id: BWBR0006147
        artikel: '9'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0006147
        artikel: '11'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0006147
        artikel: '2'
        hoofdstuk: I
  - number: 15.1.a
    text: de verkeersgegevens en de daarop gebaseerde onderzoeken,
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel15
  - number: 15.1.b
    text: |-
      de krachtens [artikel 5.20, eerste lid, van de Wet milieubeheer][ref1] bekendgemaakte gegevens en de daarop
      gebaseerde onderzoeken, en


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5'
  - number: 15.1.c
    text: de inventarisatie van en de gevolgen voor de aanwezige flora en fauna en de daarop gebaseerde onderzoeken,
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel15
  - number: '15.2'
    text: |-
      Een beslissing tot het vaststellen van een hogere waarde voor de ten hoogste toelaatbare geluidsbelasting in zones
      ingevolge de artikelen [artikelen 87e tot en met 87i][ref1] en [106d tot en met 106h van de Wet geluidhinder][ref2]
      met betrekking tot het gebied dat is begrepen in een tracébesluit, maakt deel uit van het tracébesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel87e
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel106d
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 87e
      - id: ref2
        bwb_id: BWBR0003227
        artikel: 106d
  - number: '15.3'
    text: |-
      Voor het gebied dat is begrepen in een tracébesluit geldt het tracébesluit als voorbereidingsbesluit als
      bedoeld in [artikel 3.7 van de Wet ruimtelijke ordening][ref1]. Voor de bij het tracébesluit behorende
      zone, bedoeld in [artikel 74, eerste lid, van de Wet geluidhinder][ref2] onderscheidenlijk de zone, bedoeld
      in [artikel 106b van die wet][ref3], geldt dat tracébesluit als voorbereidingsbesluit als bedoeld in
      [artikel 3.7 van de Wet ruimtelijke ordening][ref4], met dien verstande dat dit slechts geldt met betrekking
      tot geprojecteerde woningen en andere geprojecteerde geluidsgevoelige objecten ten aanzien waarvan de
      geluidsbelasting vanwege de hoofdweg of de landelijke spoorweg of vanwege binnen de zone van die hoofdweg of
      landelijke spoorweg gelegen wegen of spoorwegen de waarden die ingevolge de [artikelen 87e tot en met 87i][ref5]
      en [106d tot en met 106h van de Wet geluidhinder][ref6] als ten hoogst toelaatbare waarden worden
      aangemerkt, te boven zal gaan. Voor zover het tracébesluit geldt als voorbereidingsbesluit, is
      [artikel 3.7, vijfde en zesde lid, van de Wet ruimtelijke ordening][ref7] niet van toepassing. Het tracébesluit
      geldt niet meer als voorbereidingsbesluit indien voor het in de eerste volzin bedoelde gebied en de in de tweede
      volzin bedoelde zone een bestemmingsplan in overeenstemming met het tracébesluit van kracht is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel74
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel106b
      [ref4]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0003227#Artikel87e
      [ref6]: https://wetten.overheid.nl/BWBR0003227#Artikel106d
      [ref7]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '74'
      - id: ref3
        bwb_id: BWBR0003227
        artikel: 106b
      - id: ref4
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0003227
        artikel: 87e
      - id: ref6
        bwb_id: BWBR0003227
        artikel: 106d
      - id: ref7
        bwb_id: BWBR0020449
        artikel: '3'
  - number: '15.4'
    text: |-
      Onder een geprojecteerde woning of een ander geprojecteerd geluidsgevoelig object als bedoeld in de tweede
      volzin van het derde lid wordt verstaan een nog niet aanwezige woning of ander geluidsgevoelig object waarvoor
      het geldende bestemmingsplan verlening van de omgevingsvergunning voor een bouwactiviteit als bedoeld in
      [artikel 2.1, eerste lid, onder a, van de Wet algemene bepalingen omgevingsrecht][ref1] toelaat, maar deze nog niet
      is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '15.5'
    text: |-
      [Artikel 3.3, eerste tot en met derde lid, van de Wet algemene bepalingen omgevingsrecht][ref1] is
      niet van toepassing op aanvragen om een omgevingsvergunning voor een bouwactiviteit als bedoeld in
      [artikel 2.1, eerste lid, onder a, van die wet][ref2] ter uitvoering van het tracébesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '15.6'
    text: |-
      Voor zover het tracébesluit en het bestemmingsplan of de beheersverordening niet met elkaar in overeenstemming
      zijn, geldt het tracébesluit als omgevingsvergunning waarbij ten behoeve van een project van nationaal belang met
      toepassing van [artikel 2.12, eerste lid, onder a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref1]
      van het bestemmingsplan of de beheersverordening wordt afgeweken. Bij de toepassing van
      [artikel 2.10 van die wet][ref2] wordt onder bestemmingsplan of beheersverordening mede het tracébesluit begrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '15.7'
    text: |-
      Voor zover een bestemmingsplan, een beheersverordening of een ander besluit voor de uitvoering
      van werken of werkzaamheden een omgevingsvergunning voor een aanlegactiviteit als bedoeld in
      [artikel 2.1, eerste lid, onder b, van de Wet algemene bepalingen omgevingsrecht][ref1] vereist, geldt zodanige
      eis niet voor de uitvoering van werken of werkzaamheden ter uitvoering van het tracébesluit in het gebied dat
      is begrepen in een tracébesluit. Indien ter uitvoering van het tracébesluit handelingen worden verricht waarvoor
      krachtens [artikel 15 van de Wegenverkeerswet 1994][ref2] een verkeersbesluit is vereist, is dat artikel niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel15
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '15'
  - number: '15.8'
    text: |-
      De gemeenteraad stelt binnen een jaar nadat het tracébesluit onherroepelijk is geworden een bestemmingsplan of
      een beheersverordening als bedoeld in de [Wet ruimtelijke ordening][ref1] overeenkomstig het tracébesluit vast.
      Voor zover een ontwerp van een bestemmingsplan zijn grondslag vindt in het tracébesluit kunnen zienswijzen geen
      betrekking hebben op dat deel van het ontwerpplan.


      [ref1]: https://wetten.overheid.nl/BWBR0020449
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0020449
  - number: '15.9'
    text: |-
      Indien het bestemmingsplan nog niet in overeenstemming is met het tracébesluit, verleent het college van
      burgemeester en wethouders aan degenen die inzage verlangen in dat plan tevens inzage in het tracébesluit.
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel15
  - number: '15.10'
    text: |-
      De [artikelen 19d][ref1] en [19kc van de Natuurbeschermingswet 1998][ref2] zijn niet van toepassing
      op handelingen waarop het tracébesluit betrekking heeft. Indien die handelingen de kwaliteit
      van de natuurlijke habitats en de habitats van soorten in een Natura 2000-gebied als bedoeld in
      die wet kunnen verslechteren of een significant verstorend effect kunnen hebben op de soorten
      waarvoor het gebied is aangewezen, gelet op de instandhoudingsdoelstelling voor dat gebied, zijn de
      [artikelen 19j, eerste tot en met derde lid en vijfde lid][ref3], en [19kd van die wet][ref4] en het krachtens
      [artikel 19kb, eerste lid, van die wet][ref5] bepaalde, van overeenkomstige toepassing op het vaststellen van een
      tracébesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel19d
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel19kc
      [ref3]: https://wetten.overheid.nl/BWBR0009641#Artikel19j
      [ref4]: https://wetten.overheid.nl/BWBR0009641#Artikel19kd
      [ref5]: https://wetten.overheid.nl/BWBR0009641#Artikel19kb
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 19d
      - id: ref2
        bwb_id: BWBR0009641
        artikel: 19kc
      - id: ref3
        bwb_id: BWBR0009641
        artikel: 19j
      - id: ref4
        bwb_id: BWBR0009641
        artikel: 19kd
      - id: ref5
        bwb_id: BWBR0009641
        artikel: 19kb
  - number: '15.11'
    text: |-
      [Artikel 16, eerste lid, van de Natuurbeschermingswet 1998][ref1] is niet van toepassing op handelingen waarop
      het tracébesluit betrekking heeft. Indien die handelingen in een beschermd natuurmonument als bedoeld in artikel
      16, eerste lid, van die wet plaatsvinden, of daarbuiten in de gevallen, bedoeld in het vierde lid van dat artikel,
      en de handelingen schadelijk kunnen zijn voor de waarden, bedoeld in het eerste lid van dat artikel, betrekt Onze
      Minister bij de besluitvorming over het tracébesluit het belang van bescherming van de waarden van het beschermde
      natuurmonument.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel16
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '16'
  - number: '15.12'
    text: |-
      [Artikel 19j van de Natuurbeschermingswet 1998][ref1] is niet van toepassing op de vaststelling van
      het tracébesluit indien de handelingen waarop het tracébesluit betrekking heeft, zijn opgenomen in een
      beheerplan als bedoeld in [artikel 19a][ref2] of [19b van die wet][ref3], of in het programma op grond van
      [artikel 19kh, vijfde lid][ref4], en die handelingen overeenkomstig dat plan of dat programma worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel19j
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel19a
      [ref3]: https://wetten.overheid.nl/BWBR0009641#Artikel19b
      [ref4]: https://wetten.overheid.nl/BWBR0009641#Artikel19kh
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 19j
      - id: ref2
        bwb_id: BWBR0009641
        artikel: 19a
      - id: ref3
        bwb_id: BWBR0009641
        artikel: 19b
      - id: ref4
        bwb_id: BWBR0009641
        artikel: 19kh
  - number: 15a.1
    text: |-
      [Artikel 5.16, eerste lid, aanhef, van de Wet milieubeheer][ref1] is ook van toepassing indien het tracébesluit
      inzake de aanleg of wijziging van een hoofdweg, bedoeld in [artikel 2, eerste lid, onder a en b][ref2],
      is genoemd of beschreven in, dan wel past binnen of in elk geval niet in strijd is met een overeenkomstig
      [artikel 3:11, eerste lid, van de Algemene wet bestuursrecht][ref3] ter inzage gelegd ontwerp van het programma,
      bedoeld in [artikel 5.12, eerste lid, van de Wet milieubeheer][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006147#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel5
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0006147
        artikel: '2'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '5'
  - number: 15a.2
    text: |-
      In het tracébesluit dat wordt vastgesteld met toepassing van het eerste lid, wordt ten aanzien van het bepaalde in
      de [bijlage 2 bij de Wet milieubeheer][ref1] uitsluitend aannemelijk gemaakt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 15a.2.a
    text: |-
      gedurende het eerste jaar na ingebruikneming van de overeenkomstig het tracébesluit aangelegde of gewijzigde weg
      bij de gedurende dat jaar verwachte toename van de concentraties verontreinigende stoffen in de buitenlucht door
      de toename van het verkeer gedurende dat jaar die rechtstreeks verband houdt met die aanleg of wijziging, geen
      overschrijding plaatsvindt van een grenswaarde voor luchtkwaliteit; of
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel15a
  - number: 15a.2.b
    text: |-
      de verwachte toename van de concentraties gedurende het onder a bedoelde jaar door de toename van het verkeer
      gedurende dat jaar die rechtstreeks verband houdt met de overeenkomstig het tracébesluit aan te leggen of te
      wijzigen weg, niet 1% van de grenswaarde voor de jaargemiddelde concentratie van zwevende deeltjes (PM) of
      stikstofdioxide overschrijdt.
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel15a
  - number: 15a.3
    text: |-
      Onverminderd [artikel 15][ref1], in samenhang met [artikel 11, tweede lid][ref2], bevat een tracébesluit dat
      vastgesteld wordt met toepassing van het eerste lid tevens de maatregelen die onlosmakelijk verbonden zijn met het
      tracébesluit voor zover die genoemd of beschreven zijn in het ontwerp van het programma, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0006147#Artikel11
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '15'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0006147
        artikel: '11'
        hoofdstuk: III
  - number: 15a.4
    text: |-
      Het luchtkwaliteitsonderzoek ten behoeve van een tracébesluit voor de aanleg of wijziging van een hoofdweg, bedoeld
      in [artikel 2, eerste lid, onder a en b][ref1], wordt beperkt tot het gebied dat zich uitstrekt van de voorafgaande
      tot en met de eerstvolgende aansluiting op of aan de aan te leggen of te wijzigen weg en ter weerszijden van dit
      wegvak tot één kilometer vanuit de meest buiten gelegen rijstroken, een en ander voor zover gelegen op Nederlands
      grondgebied. Onder aansluiting wordt tevens knooppunt verstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel2
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '2'
        hoofdstuk: I
  - number: '16.1'
    text: |-
      Onze Minister zendt het tracébesluit aan de betrokken bestuursorganen en, indien het tracébesluit betrekking heeft
      op het tracé van een landelijke spoorweg, aan de beheerder van de spoorweg.
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel16
  - number: '16.2'
    text: Bij de bekendmaking van het tracébesluit worden de motivering en de toelichting op het tracé vermeld.
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel16
  - number: '16.3'
    text: De terinzagelegging geschiedt tevens ten kantore van de betrokken bestuursorganen.
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel16
  - number: '18'
    text: |-
      Indien de aanleg of wijziging van een hoofdweg, landelijke spoorweg of hoofdvaarweg niet is opgenomen in een
      jaarlijks voortschrijdend meerjarig uitvoeringsprogramma voor hoofdwegen, landelijke spoorwegen en hoofdvaarwegen,
      dat bij besluit van Onze Minister is vastgesteld voor het derde jaar na het jaar waarin het tracébesluit van kracht
      is geworden, vervalt het tracébesluit van rechtswege. Het tracébesluit vervalt eveneens van rechtswege indien het
      niet binnen tien jaar na het tijdstip waarop het onherroepelijk is geworden in uitvoering is genomen.
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel18
  - number: '20.1'
    text: .
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel20
  - number: '20.2'
    text: |-
      Onze Minister bevordert een gecoördineerde voorbereiding van de besluiten op de aanvragen om de vergunningen en van
      de overige ambtshalve te nemen besluiten met het oog op de uitvoering van een tracébesluit.
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel20
  - number: '20.3'
    text: |-
      Onze Minister kan van de andere betrokken bestuursorganen de medewerking vorderen, die voor het welslagen van de
      coördinatie nodig is. Die bestuursorganen verlenen de van hen gevorderde medewerking.
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel20
  - number: '20.4'
    text: |-
      Op de voorbereiding van de in het tweede lid bedoelde besluiten is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 20.4.a
    text: |-
      de ontwerpen van de besluiten binnen een door Onze Minister te bepalen termijn worden toegezonden aan Onze
      Minister, die zorg draagt voor de in [artikel 3:13, eerste lid, van die wet][ref1] bedoelde toezending;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 20.4.b
    text: |-
      Onze Minister ten aanzien van de ontwerpen van de besluiten gezamenlijk toepassing kan geven aan de
      [artikelen 3:11, eerste lid][ref1], en [3:12 van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 20.4.c
    text: zienswijzen naar voren kunnen worden gebracht door een ieder;
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel20
  - number: 20.4.d
    text: |-
      in afwijking van [artikel 3:18 van die wet][ref1] de besluiten worden genomen binnen een door Onze Minister te
      bepalen termijn;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 20.4.e
    text: de besluiten onverwijld worden toegezonden aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel20
  - number: '20.5'
    text: |-
      [Artikel 3.9 van de Wet algemene bepalingen omgevingsrecht][ref1] is niet van toepassing op aanvragen om een
      omgevingsvergunning voor een bouwactiviteit als bedoeld in [artikel 2.1, eerste lid, onder a, van die wet][ref2]
      ter uitvoering van het tracébesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '20.6'
    text: |-
      Indien een bestuursorgaan dat in eerste aanleg bevoegd is te beslissen op een aanvraag om een vergunning niet
      of niet tijdig overeenkomstig de aanvraag beslist, kunnen Onze Minister en Onze Minister wie het mede aangaat
      gezamenlijk een beslissing op de aanvraag nemen. In het laatste geval treedt hun besluit in de plaats van het
      besluit van het in eerste aanleg bevoegde bestuursorgaan. Indien Onze in de eerste volzin bedoelde Ministers
      voornemens zijn zelf een beslissing op de aanvraag te nemen, plegen zij overleg met het bestuursorgaan dat in
      eerste aanleg bevoegd is op de aanvraag te beslissen.
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel20
  - number: '20.7'
    text: Het zesde lid is van overeenkomstige toepassing op de in het tweede lid bedoelde ambtshalve te nemen besluiten.
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel20
  - number: '20.8'
    text: |-
      Indien bij de toepassing van het zesde lid de beslissing op een aanvraag wordt genomen door Onze in dat lid
      bedoelde Ministers, stort het bestuursorgaan dat in eerste aanleg bevoegd was te beslissen op de aanvraag, de ter
      zake ontvangen leges in 's Rijks kas.
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel20
  - number: '20.9'
    text: |-
      Ten aanzien van de in het tweede lid bedoelde aanvragen is Onze Minister mede bevoegd deze in te dienen bij de
      bevoegde bestuursorganen.
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel20
  - number: '20.10'
    text: |-
      De in het tweede lid bedoelde besluiten worden, voor zover ten aanzien daarvan het vierde lid is toegepast,
      gelijktijdig door Onze Minister bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel20
  - number: '20.11'
    text: |-
      Voor zover een ontwerp van een besluit als bedoeld in het tweede lid, zijn grondslag vindt in een tracébesluit,
      kunnen bedenkingen daarop geen betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel20
  - number: 20a.1
    text: |-
      De in [artikel 2][ref1] bedoelde werken worden voor de toepassing van de [Belemmeringenwet Privaatrecht][ref2]
      aangemerkt als openbare werken van algemeen nut.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001936
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0001936
  - number: 20a.2
    text: |-
      Indien voor de uitvoering van een of meer besluiten als bedoeld in [artikel 20, tweede lid][ref1], toepassing van
      de [Belemmeringenwet Privaatrecht][ref2] noodzakelijk is:


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0001936
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '20'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0001936
  - number: 20a.2.a
    text: |-
      kan Onze Minister van Verkeer en Waterstaat in afwijking van
      [artikel 2, vierde lid, van de Belemmeringenwet Privaatrecht][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0001936#Artikel2
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0001936
        artikel: '2'
  - number: 20a.2.a.1°
    text: een andere plaats of gemeente aanwijzen waar de zitting plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel20a
  - number: 20a.2.a.2°
    text: bepalen dat de zitting wordt geleid door een door Onze Minister van Verkeer en Waterstaat aan te wijzen persoon;
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel20a
  - number: 20a.2.b
    text: |-
      worden in afwijking van de [artikelen 2, vijfde lid][ref1], en
      [3, tweede lid, van de Belemmeringenwet Privaatrecht][ref2] gedeputeerde staten niet gehoord;


      [ref1]: https://wetten.overheid.nl/BWBR0001936#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001936#Artikel3
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0001936
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001936
        artikel: '3'
  - number: 20a.2.c
    text: |-
      geldt in plaats van [artikel 4 van de Belemmeringenwet Privaatrecht][ref1] dat:


      [ref1]: https://wetten.overheid.nl/BWBR0001936#Artikel4
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0001936
        artikel: '4'
  - number: 20a.2.c.1°
    text: |-
      tegen een besluit als bedoeld in [artikel 2, vijfde lid][ref1], of [artikel 3, tweede lid, van die wet][ref2] een
      belanghebbende beroep kan instellen bij de Afdeling bestuursrechtspraak van de Raad van State;


      [ref1]: https://wetten.overheid.nl/BWBR0001936#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001936#Artikel3
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0001936
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001936
        artikel: '3'
  - number: 20a.2.c.2°
    text: |-
      [artikel 7:1 van de Algemene wet bestuursrecht][ref1] niet van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 20a.2.c.3°
    text: |-
      de werking van een besluit als bedoeld in [artikel 2, vijfde lid][ref1], of
      [artikel 3, tweede lid, van de Belemmeringenwet Privaatrecht][ref2] opgeschort wordt totdat de termijn voor het
      indienen van een beroepschrift is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0001936#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001936#Artikel3
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0001936
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001936
        artikel: '3'
  - number: 20b
    text: |-
      De in [artikel 18, eerste lid, van de onteigeningswet][ref1] bedoelde dagvaarding kan geschieden nadat het
      tracébesluit is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel18
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel20b
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '18'
  - number: 20c.1
    text: |-
      Onverminderd het bepaalde in [artikel 59, eerste lid, van de onteigeningswet][ref1] kan het vonnis van onteigening
      van de rechtbank niet eerder in de openbare registers worden ingeschreven dan nadat het tracébesluit onherroepelijk
      is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel59
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel20c
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '59'
  - number: 20c.2
    text: |-
      In aanvulling op de [artikelen 54n][ref1] en [59 van de onteigeningswet][ref2] is ten behoeve van de in het eerste
      lid bedoelde inschrijving een uitspraak van de Afdeling bestuursrechtspraak van de Raad van State dan wel een
      verklaring van de Secretaris van de Raad van State nodig, waaruit blijkt dat het tracébesluit onherroepelijk is
      geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel54n
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel59
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel20c
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: 54n
      - id: ref2
        bwb_id: BWBR0001842
        artikel: '59'
  - number: 20d.1
    text: |-
      Indien een belanghebbende ten gevolge van een tracébesluit schade lijdt of zal lijden, die redelijkerwijs niet
      of niet geheel te zijnen laste behoort te blijven en ten aanzien waarvan de vergoeding niet of niet voldoende
      anderszins is verzekerd, kent Onze Minister hem op zijn verzoek een naar billijkheid te bepalen schadevergoeding
      toe.
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel20d
  - number: 20d.2
    text: |-
      [Afdeling 6.1 van de Wet ruimtelijke ordening][ref1] blijft buiten toepassing voor zover de belanghebbende met
      betrekking tot de schade een beroep doet of kan doen op een schadevergoeding als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Afdeling6.1
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel20d
    references:
      - id: ref1
        bwb_id: BWBR0020449
        afdeling: '6.1'
  - number: 20d.3
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld omtrent de indiening en afhandeling van een verzoek
      om schadevergoeding.
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel20d
  - number: 25a.1
    text: |-
      Tegen een tracébesluit of een ander in [artikel 20, tweede lid][ref1], bedoeld besluit kan een belanghebbende
      beroep instellen bij de Afdeling bestuursrechtspraak van de Raad van State.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel20
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '20'
        hoofdstuk: IV
  - number: 25a.2
    text: |-
      In afwijking van [artikel 6:8 van de Algemene wet bestuursrecht][ref1] vangt de termijn voor het indienen van
      een beroepschrift tegen de in [artikel 20, tweede lid][ref2], bedoelde besluiten aan met ingang van de dag na die
      waarop de in [artikel 20, tiende lid][ref3], bedoelde bekendmaking is geschied.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0006147#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0006147#Artikel20
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0006147
        artikel: '20'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0006147
        artikel: '20'
        hoofdstuk: IV
  - number: 25b.1
    text: |-
      Met betrekking tot beroepen tegen een tracébesluit beslist de Afdeling bestuursrechtspraak van de Raad van State
      binnen twaalf maanden na ontvangst van een verweerschrift. Met betrekking tot beroepen tegen het tracébesluit
      A74 beslist de Afdeling in afwijking van het bepaalde in de eerste volzin binnen zes maanden na ontvangst van het
      verweerschrift.
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel25b
  - number: 25b.2
    text: |-
      In bijzondere omstandigheden kan de Afdeling de in het eerste lid genoemde termijn met ten hoogste drie maanden
      verlengen.
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel25b
  - number: 25b.3
    text: |-
      Met betrekking tot beroepen tegen de in [artikel 20, tweede lid][ref1], bedoelde besluiten beslist de Afdeling
      bestuursrechtspraak van de Raad van State binnen zes maanden na ontvangst van de desbetreffende verweerschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel20
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '20'
        hoofdstuk: IV
  - number: 25c
    text: |-
      Indien tegen een in [artikel 20, tweede lid][ref1], bedoeld besluit beroep kan worden ingesteld, kunnen bij dit
      beroep geen gronden worden aangevoerd die betrekking hebben op een tracébesluit waarop dat besluit rust.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel20
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel25c
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '20'
        hoofdstuk: IV
  - number: '26.1'
    text: |-
      Deze wet blijft buiten toepassing ten aanzien van besluiten van Onze Minister tot vaststelling van een tracé voor
      de aanleg of wijziging van hoofdwegen, landelijke spoorwegen en hoofdvaarwegen die vóór de inwerkingtreding van
      deze wet zijn genomen, voor zover deze besluiten vóór 1 januari 1997 worden opgenomen in een uitvoeringsprogramma
      als bedoeld in [artikel 18, eerste lid][ref1]. In het laatste geval vervalt het besluit indien het niet binnen tien
      jaar na eerste opneming in het uitvoeringsprogramma ten uitvoer wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel18
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '18'
        hoofdstuk: IV
  - number: '26.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op besluiten als bedoeld in dat lid die binnen een jaar na
      inwerkingtreding van deze wet zijn genomen alsmede op door Onze Ministers aan te wijzen besluiten die binnen twee
      jaar na inwerkingtreding van deze wet zijn genomen.
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel26
  - number: '26.3'
    text: |-
      Het tweede lid geldt niet voor besluiten ter uitvoering van planologische kernbeslissingen als bedoeld in
      [artikel 28][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel28
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '28'
        hoofdstuk: VI
  - number: '26.4'
    text: |-
      [Artikel 18][ref1] is van overeenkomstige toepassing op besluiten als bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel18
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '18'
        hoofdstuk: IV
  - number: '27'
    text: |-
      Trajectnota's die na inwerkingtreding van deze wet worden vastgesteld maar geheel of gedeeltelijk vóór de
      inwerkingtreding van deze wet zijn voorbereid worden aangemerkt als trajectnota's in de zin van deze wet indien
      deze voorbereiding is geschied overeenkomstig de eisen die de Tracéwet aan de voorbereiding van trajectnota's
      stelt.
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel27
  - number: 28a
    text: |-
      Onze Minister zendt de Staten-Generaal ieder half jaar een verslag over de voortgang van de projecten, waarvoor een
      beslissing is genomen als bedoeld in [artikel 2, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel2
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '2'
        hoofdstuk: I
  - number: '29'
    text: |-
      Onze Ministers zenden binnen drie jaar na het in werking treden van deze wet, en vervolgens telkens om de vijf
      jaar, aan de Staten-Generaal een verslag over de wijze waarop zij is toegepast.
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel29
  - number: '33'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel33
  - number: '34'
    text: |-
      Voor de plaatsing van deze wet in het *Staatsblad* brengt Onze Minister de in deze wet voorkomende aanhalingen van
      artikelen en afdelingen van de [Algemene wet bestuursrecht][ref1] in overeenstemming met de door Onze Minister van
      Justitie opnieuw vastgestelde nummering daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: '35'
    text: 'Deze wet kan worden aangehaald als: Tracéwet.'
    url: https://wetten.overheid.nl/BWBR0006147/2011-01-14#Artikel35
