---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: tracewet
regulatory_layer: WET
publication_date: '2016-07-21'
valid_from: '2002-07-01'
bwb_id: BWBR0006147
url: https://wetten.overheid.nl/BWBR0006147/2002-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het ter verzekering van doelmatige procedures voor de totstandkoming
    en van de tijdige tenuitvoerlegging van besluiten met betrekking tot de aanleg of wijziging van hoofdwegen, van
    landelijke railwegen en van hoofdvaarwegen wenselijk is regels te stellen voor de voorbereiding, vaststelling
    en tenuitvoerlegging van zodanige besluiten, deze regels te doen aansluiten bij het bepaalde bij en krachtens de
    Wet milieubeheer (Stb. 1992, 551) inzake het milieu-effectrapport zomede de coördinatie bij de toepassing van die
    regels met de toepassing van de Wet op de Ruimtelijke Ordening (Stb. 1985, 626) te verzekeren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel1
  - number: 1.1.b
    text: 'Onze Ministers: Onze Minister en Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;'
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel1
  - number: 1.1.bb
    text: |-
      regionaal openbaar lichaam: een regionaal openbaar lichaam als bedoeld in de
      [Kaderwet bestuur in verandering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006620
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006620
  - number: 1.1.c
    text: |-
      hoofdweg: een weg waarvoor een verbinding is aangegeven op een kaart van indicatieve en limitatieve
      hoofdwegverbindingen, die behoort tot een van kracht zijnd plan als bedoeld in [artikel 2][ref1] (*Stb.* 1985,
      626);


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel2a
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: 2a
  - number: 1.1.d
    text: |-
      landelijke railweg: een railweg waarvoor een verbinding is aangegeven op een kaart van indicatieve en limitatieve
      railwegverbindingen, die behoort tot een van kracht zijnd plan als bedoeld in [artikel 2 ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel2
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '2'
  - number: 1.1.e
    text: |-
      hoofdvaarweg: een vaarweg waarvoor een verbinding is aangegeven op een kaart van indicatieve en limitatieve
      hoofdvaarwegverbindingen, die behoort tot een van kracht zijnd plan als bedoeld in [artikel 2 ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel2
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '2'
  - number: 1.1.f
    text: |-
      bijkomende infrastructurele voorzieningen: werken of bouwwerken die, zonder deel uit te maken van het profiel van
      een hoofdweg, een landelijke railweg of een hoofdvaarweg, met die weg, railweg of vaarweg zijn verbonden en dienen
      voor de instandhouding dan wel het veilig en doelmatig gebruik daarvan;
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel1
  - number: 1.1.g
    text: |-
      verkeers- en vervoertraject: een verkeers- en vervoergebied gelegen tussen twee punten van een verbinding als
      bedoeld onder *c, d* of *e* van dit artikellid;
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel1
  - number: 1.1.h
    text: 'tracé:'
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel1
  - number: 1.1.h.1°
    text: |-
      de aanduiding op een of meer topografische of geografische kaarten van het verloop en de geografische omvang van
      een aan te leggen of te wijzigen hoofdweg, landelijke railweg of hoofdvaarweg, en
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel1
  - number: 1.1.h.2°
    text: |-
      indien het de aanleg of wijziging van een hoofdweg of landelijke railweg betreft, een nauwkeurige beschrijving van:
        - de daarbij te realiseren ligging in het terrein,
        - het daarbij te realiseren aantal rijstroken of sporen,
        - de daarbij te realiseren bijkomende infrastructurele voorzieningen en
        - de daarbij te realiseren maatregelen van landschappelijke, landbouwkundige en ecologische aard dan wel indien het
      de aanleg of wijziging van een hoofdvaarweg betreft, een nauwkeurige beschrijving van: - de voor het gebruik van de
      hoofdvaarweg toe te laten laadvermogen per schip,
        - de bij de aanleg of wijziging van de hoofdvaarweg te realiseren bijkomende infrastructurele voorzieningen en
        - de daarbij te realiseren maatregelen van landschappelijke, landbouwkundige en ecologische aard, zomede
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel1
  - number: 1.1.h.3°
    text: |-
      indien het de aanleg of wijziging van een hoofdweg of landelijke railweg betreft, de in acht te nemen
      grenswaarden voor geluidhinder en de aanduiding van de maatregelen, gericht op het terugbrengen van de verwachte
      geluidsbelasting van de gevel van woningen of andere geluidsgevoelige gebouwen onderscheidenlijk aan de grens van
      geluidsgevoelige terreinen als bedoeld in de [Wet geluidhinder][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003227
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003227
  - number: 1.1.i
    text: |-
      schip: schip als bedoeld in
      [artikel 1, eerste lid onder b, en vijfde lid onder a en b, van de Scheepvaartverkeerswet][ref1] (Stb. 1988, 352).


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel1
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '1'
  - number: '1.2'
    text: |-
      Ontheffingen, dispensaties, afwijkingen en soortgelijke beschikkingen worden voor de toepassing van deze wet als
      vergunning aangemerkt.
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel1
  - number: '1.3'
    text: |-
      In deze wet wordt onder aanleg of wijziging van een hoofdweg, landelijke railweg of hoofdvaarweg mede verstaan de
      aanleg of wijziging van een deel van die hoofdweg, landelijke railweg of hoofdvaarweg.
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel1
  - number: '2.1'
    text: |-
      De aanleg van een hoofdweg, landelijke railweg of hoofdvaarweg, in gevallen waarin de hoofdvaarweg kan worden
      bevaren door schepen met een laadvermogen van 1350 ton of meer, geschiedt overeenkomstig het daarvoor met
      toepassing van deze wet vastgestelde tracé.
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel2
  - number: '2.2'
    text: 'Het eerste lid is van overeenkomstige toepassing ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel2
  - number: 2.2.a
    text: een wijziging van een hoofdweg, die bestaat uit de ombouw van een weg tot autosnelweg;
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel2
  - number: 2.2.b
    text: |-
      een verbreding van een hoofdweg met één of meer rijstroken, indien het te verbreden weggedeelte twee knooppunten of
      aansluitingen met elkaar verbindt;
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel2
  - number: 2.2.c
    text: 'een wijziging van een landelijke railweg, die bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel2
  - number: 2.2.c.1°
    text: |-
      een verbreding van die railweg met twee of meer sporen, die over een lengte van 5 kilometer of meer is gelegen
      in een in een streekplan begrensd beschermd natuurmonument of staatsnatuurmonument, aangewezen ingevolge
      [artikel 7][ref1] of [21 van de Natuurbeschermingswet][ref2], dan wel in een in een streekplan begrensd kerngebied,
      natuurontwikkelingsgebied of in een zodanig plan begrensde verbindingszone, deel uitmakend van de ecologische
      hoofdstructuur;


      [ref1]: https://wetten.overheid.nl/BWBR0002611#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002611#Artikel21
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002611
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002611
        artikel: '21'
  - number: 2.2.c.2°
    text: |-
      de aanleg van een geheel nieuwe spoorbaan, die over een lengte van 500 meter of meer op een afstand van 25 meter of
      meer van de grens van de bestemming, aangewezen voor spoorwegdoeleinden, is gelegen of
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel2
  - number: 2.2.c.3°
    text: |-
      de aanleg van spoorwegbouwkundige bouwwerken met de daartoe behorende aansluitingen, los van de bestemming,
      aangewezen voor spoorwegdoeleinden, voor zover deze geheel zijn gelegen in een in een streekplan begrensd gebied
      als bedoeld onder 1°;
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel2
  - number: 2.2.d
    text: 'een wijziging van een hoofdvaarweg, die bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel2
  - number: 2.2.d.1°
    text: |-
      een vergroting of verdieping waardoor: - de hoofdvaarweg geschikt wordt voor gebruik door schepen met een
      laadvermogen van ten minste 1350 ton dan wel de bestaande geschiktheid van de hoofdvaarweg voor zodanig gebruik
      wordt verbeterd, en
        - het ruimte-oppervlak van de hoofdvaarweg met ten minste twintig procent toeneemt dan wel de hoofdvaarweg blijvend
      wordt verdiept waarbij meer dan vijf miljoen kubieke meter grond wordt verzet en waarbij verder bodemlagen die het
      grondwater afsluiten worden doorbroken of
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel2
  - number: 2.2.d.2°
    text: |-
      een verlegging van een rivier: - in het geval waarin de rivier kan worden bevaren door schepen met een laadvermogen
      van ten minste 1350 ton, en
        - waarbij het zomerbed wordt verlegd en de verlegging een oppervlakte beslaat van ten minste 50 hectare.
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel2
  - number: '2.3'
    text: |-
      Bij algemene maatregel van bestuur wordt het eerste lid van overeenkomstige toepassing verklaard ten aanzien van
      in die maatregel aan te geven andere gevallen van wijziging van een hoofdweg, van een landelijke railweg of van een
      hoofdvaarweg dan die welke zijn bedoeld in het tweede lid, indien ten aanzien van deze gevallen het maken van een
      milieu-effectrapport op grond van het bepaalde bij of krachtens de [Wet milieubeheer][ref1] verplicht is.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 2a
    text: |-
      Een beslissing om het in dit hoofdstuk bedoelde besluitvormingsproces ten aanzien van de aanleg of wijziging
      van een hoofdweg of hoofdvaarweg als bedoeld in [artikel 2][ref1] of de medewerking aan de aanleg of wijziging
      van een landelijke railweg als bedoeld in [artikel 2][ref2] aan te vangen, wordt genomen door Onze Minister in
      overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006147#Artikel2
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0006147
        artikel: '2'
        hoofdstuk: I
  - number: '3.1'
    text: |-
      Indien Onze Minister de aanleg of wijziging van een hoofdweg of hoofdvaarweg, als bedoeld in [artikel 2][ref1],
      of de medewerking aan de aanleg of wijziging van een landelijke railweg, als bedoeld in [artikel 2][ref2], in
      overweging neemt stelt hij ter voorbereiding van de in [hoofdstuk III][ref3] bedoelde beslissingen een trajectnota
      op.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006147#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0006147#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0006147
        artikel: '2'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0006147
        hoofdstuk: III
  - number: '3.2'
    text: |-
      Op die voorbereiding is de in [paragraaf 3.5.6 van de Algemene wet bestuursrecht][ref1] geregelde procedure van
      toepassing. Een trajectnota als bedoeld in dit hoofdstuk wordt voor toepassing van die procedure gelijkgesteld met
      een ontwerp van een besluit als bedoeld in [artikel 3:30, eerste lid, van de Algemene wet bestuursrecht][ref2].
      Bij de voorbereiding betrekt Onze Minister de besturen van de provincies, van de regionale openbare lichamen en
      van de gemeenten en waterschappen op het gebied waarvan de trajectnota redelijkerwijs betrekking kan hebben dan wel
      betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf3.5.6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 3.5.6
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '3.3'
    text: |-
      De kennisgeving, bedoeld in [artikel 3:30, tweede lid, van de Algemene wet bestuursrecht][ref1]
      geschiedt gelijktijdig met de kennisgevingen, welke zijn voorgeschreven in
      [artikel 7.13, eerste en tweede lid, van de Wet milieubeheer][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
  - number: '3.4'
    text: 'Onze Minister geeft van het voornemen verder onverwijld kennis:'
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel3
  - number: 3.4.a
    text: in een of meer dag-, nieuws- of huis-aan-huisbladen;
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel3
  - number: 3.4.b
    text: in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel3
  - number: '3.5'
    text: |-
      Onze Minister stelt een ieder in de gelegenheid binnen vier weken na publikatie als bedoeld in het vierde lid zijn
      zienswijze over het voornemen naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel3
  - number: '3.6'
    text: |-
      Onze Minister bereidt de trajectnota voor gelijktijdig en in samenhang met de voorbereiding van het milieu-
      effectrapport, als voorgeschreven bij of krachtens de [Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '3.7'
    text: |-
      Een trajectnota als bedoeld in dit hoofdstuk wordt voor de toepassing van de [artikelen 7.30, eerste lid][ref1],
      [7.31][ref2] en [7.32 van de Wet milieubeheer][ref3] gelijkgesteld met een voorontwerp van een besluit als bedoeld
      in artikel 7.27, eerste lid, van laatstbedoelde wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '7'
  - number: '3.8'
    text: |-
      Onze Minister stemt de toepassing van het vijfde lid en de toepassing van
      [artikel 7.14, vierde lid, van de Wet milieubeheer][ref1] op elkaar af.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
  - number: '4.1'
    text: 'Een trajectnota bevat ten minste de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel4
  - number: 4.1.a
    text: |-
      een omschrijving van het verkeers- en vervoertraject waarop de nota betrekking heeft, en een aanduiding daarvan op
      een of meer topografische of geografische kaarten;
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel4
  - number: 4.1.b
    text: |-
      een beschrijving van de bestaande verkeers- en vervoervoorzieningen in het desbetreffende verkeers- en
      vervoertraject;
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel4
  - number: 4.1.c
    text: |-
      een uiteenzetting van de bestaande en te verwachten verkeers- en vervoerbehoeften voor het desbetreffende verkeers-
      en vervoertraject;
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel4
  - number: 4.1.d
    text: 'een uiteenzetting van:'
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel4
  - number: 4.1.d.1°
    text: de mogelijke redenen om in de onder *c* bedoelde behoeften niet te voorzien;
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel4
  - number: 4.1.d.2°
    text: |-
      de mogelijkheden om in de onder *c* bedoelde behoeften te voorzien zonder aanleg of wijziging van een hoofdweg,
      landelijke railweg of hoofdvaarweg, als bedoeld in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel2
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '2'
        hoofdstuk: I
  - number: 4.1.d.3°
    text: |-
      de mogelijkheden om in de onder *c* bedoelde behoeften te voorzien door aanleg of wijziging van een hoofdweg,
      landelijke railweg of hoofdvaarweg, als bedoeld in [artikel 2][ref1], alsmede een beschrijving van hetgeen met de
      voorgenomen activiteit wordt beoogd:


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel2
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '2'
        hoofdstuk: I
  - number: 4.1.e
    text: |-
      het tracé van de hoofdweg, landelijke railweg of hoofdvaarweg, zo mogelijk uitgewerkt in een of meer varianten,
      waarbij voor elke variant de mogelijkheid van een verschuiving van de as van het tracé van ten hoogste 100 meter
      aan elke zijde en van een verschuiving van ten hoogste twee meter naar boven of naar beneden is open gelaten,
      alsmede een beschrijving van de kenmerken van die varianten;
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel4
  - number: 4.1.f
    text: |-
      een beschrijving van de bestaande inrichting en het gebruik van de grond, daaronder begrepen water, in het
      desbetreffende verkeers- en vervoertraject;
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel4
  - number: 4.1.g
    text: |-
      een beschrijving van de ruimtelijke ontwikkeling van het desbetreffende verkeers- en vervoertraject en de mate
      waarin in streek- en bestemmingsplannen als bedoeld in de [Wet op de Ruimtelijke Ordening][ref1] met de aanleg of
      wijziging van de hoofdweg, landelijke railweg of hoofdvaarweg is rekening gehouden;


      [ref1]: https://wetten.overheid.nl/BWBR0002375
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002375
  - number: 4.1.h
    text: |-
      een beschrijving van de voor- en nadelen van de onder *d* bedoelde alternatieven en de onder *e* bedoelde
      varianten;
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel4
  - number: 4.1.i
    text: een raming van de kosten van de aanleg of wijziging van de hoofdweg, landelijke railweg of hoofdvaarweg.
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel4
  - number: '4.2'
    text: |-
      Bij de toepassing van het eerste lid onder *a* wordt gebruik gemaakt van een of meer overzichtskaarten met een
      schaal van ten minste 1:50 000.
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel4
  - number: '4.3'
    text: |-
      Bij de toepassing van het eerste lid onder *e* wordt ter voldoening aan [artikel 1, eerste lid onder ][ref1]
      gebruik gemaakt van een of meer detailkaarten met een schaal van ten minste 1:10 000 en van een of meer
      overzichtskaarten met een schaal van ten minste 1:50 000.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel1
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '1'
        hoofdstuk: I
  - number: '5'
    text: |-
      Indien de trajectnota betrekking heeft op het tracé van een landelijke railweg, betrekt Onze Minister de exploitant
      van de railweg bij de voorbereiding daarvan. Deze verleent de in verband daarmee nodige medewerking aan het
      opstellen van de trajectnota.
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel5
  - number: '6.1'
    text: |-
      Onze Minister voert ter voorbereiding van de trajectnota met de betrokken bestuursorganen overleg over de opzet van
      de nota ten aanzien van het verkeers- en vervoertraject als bedoeld in [artikel 4, eerste lid onder ][ref1], en de
      te behandelen alternatieven en varianten als bedoeld in [artikel 4, eerste lid onder ][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006147#Artikel4
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '4'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0006147
        artikel: '4'
        hoofdstuk: II
  - number: '6.2'
    text: |-
      Onze Minister voert met de betrokken bestuursorganen voorts overleg bij de verdere voorbereiding van de
      trajectnota.
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel6
  - number: '7.1'
    text: |-
      Binnen een week na de mededeling, bedoeld in [artikel 3:30 van de Algemene wet bestuursrecht][ref1], legt Onze
      Minister door tussenkomst van de betrokken bestuursorganen de trajectnota ter inzage ten kantore van die organen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '7.2'
    text: |-
      De [artikelen 3:20, eerste lid, aanhef en onder ][ref1], [3:21, tweede lid][ref2],
      [3:22, eerste en derde lid][ref3], [3:25, eerste lid, eerste volzin, tweede en derde lid][ref4], en
      [3:31, eerste lid, van de Algemene wet bestuursrecht][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '7.3'
    text: |-
      In afwijking van [artikel 3:32, eerste lid, van de Algemene wet bestuursrecht][ref1] kunnen bedenkingen worden
      ingebracht binnen acht weken na de dag waarop de trajectnota ter inzage is gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '7.4'
    text: |-
      Na de periode van acht weken, bedoeld in het derde lid, blijven de stukken ter inzage liggen op de door Onze
      Minister in overleg met de betrokken bestuursorganen te bepalen uren totdat Onze Minister een standpunt als bedoeld
      in [artikel 9, eerste lid][ref1], heeft bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel9
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '9'
        hoofdstuk: III
  - number: '8.1'
    text: |-
      Binnen een door Onze Minister te bepalen termijn van ten hoogste vier maanden na de dag waarop de trajectnota ter
      inzage is gelegd, geven de betrokken bestuursorganen in een met redenen omkleed advies ten minste aan:
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel8
  - number: 8.1.a
    text: |-
      welke van de in de trajectnota behandelde alternatieven en varianten naar hun oordeel passen in hun ruimtelijk
      beleid;
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel8
  - number: 8.1.b
    text: welke van die alternatieven en varianten naar hun oordeel de voorkeur verdienen;
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel8
  - number: 8.1.c
    text: of en zo ja, tegen welke van die alternatieven en varianten zij bedenkingen hebben.
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel8
  - number: '8.2'
    text: |-
      Indien de betrokken bestuursorganen binnen de gestelde termijn geen advies hebben uitgebracht stemmen zij in met de
      volledigheid van de in de trajectnota behandelde alternatieven en varianten.
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel8
  - number: '9.1'
    text: |-
      Onze Minister bepaalt binnen acht weken na het verstrijken van de ingevolge [artikel 8, eerste lid][ref1],
      bepaalde termijn, in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer,
      zijn standpunt met betrekking tot de aanleg of wijziging van een hoofdweg of hoofdvaarweg als bedoeld in
      [artikel 2][ref2] dan wel de medewerking aan de aanleg of wijziging van een landelijke railweg als bedoeld in
      [artikel 2][ref3]. Het standpunt houdt in dat hij de aanleg of wijziging van een hoofdweg of hoofdvaarweg of de
      medewerking aan de aanleg of wijziging van een landelijke railweg al dan niet verder in overweging neemt. Indien
      hij de aanleg of wijziging van het in de eerste volzin bedoelde werk of de medewerking daaraan verder in overweging
      neemt, houdt het standpunt tevens in welk tracé de voorkeur verdient.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006147#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0006147#Artikel2
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '8'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0006147
        artikel: '2'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0006147
        artikel: '2'
        hoofdstuk: I
  - number: '9.2'
    text: |-
      Indien de trajectnota betrekking heeft op het tracé van een landelijke railweg, voert Onze Minister overleg over
      het door hem te bepalen standpunt met de exploitant van de railweg.
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel9
  - number: '9.3'
    text: |-
      Indien de standpuntbepaling als bedoeld in het eerste lid niet binnen de daar genoemde termijn kan geschieden,
      deelt Onze Minister dit voor het verstrijken daarvan onder vermelding van de redenen mee aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel9
  - number: '10.1'
    text: |-
      Indien het standpunt van Onze Minister inhoudt dat hij de aanleg of wijziging van de hoofdweg of hoofdvaarweg
      als bedoeld in [artikel 2][ref1] dan wel de medewerking aan de aanleg of wijziging van de landelijke railweg als
      bedoeld in [artikel 2][ref2] niet verder in overweging neemt, deelt hij dit standpunt onder opgave van redenen
      schriftelijk mee aan de betrokken bestuursorganen en, indien de trajectnota betrekking heeft op het tracé van een
      landelijke railweg, aan de exploitant van de railweg.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006147#Artikel2
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0006147
        artikel: '2'
        hoofdstuk: I
  - number: '10.2'
    text: |-
      Binnen een week na de mededeling, bedoeld in het eerste lid, legt Onze Minister
      het standpunt ter inzage. [Artikel 7, eerste lid, van deze wet][ref1] en
      [artikel 3:22, eerste en derde lid, van de Algemene wet bestuursrecht][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '7'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '11.1'
    text: |-
      Indien het standpunt van Onze Minister inhoudt dat hij de aanleg of wijziging van de hoofdweg of hoofdvaarweg
      als bedoeld in [artikel 2][ref1] dan wel de medewerking aan de aanleg of wijziging van de landelijke railweg als
      bedoeld in [artikel 2][ref2] verder in overweging neemt, stelt hij overeenkomstig het standpunt, in overeenstemming
      met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, binnen zes maanden na het uitbrengen
      van het standpunt een ontwerp-tracébesluit vast. Hij deelt dit standpunt onder opgave van redenen schriftelijk
      mee aan de betrokken bestuursorganen en, indien de trajectnota betrekking heeft op het tracé van een landelijke
      railweg, aan de exploitant van de railweg.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006147#Artikel2
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0006147
        artikel: '2'
        hoofdstuk: I
  - number: '11.2'
    text: |-
      Bij het ontwerp-tracébesluit wordt ter voldoening aan [artikel 1, eerste lid onder ][ref1] gebruik gemaakt van een
      of meer detailkaarten met een schaal van ten minste 1:2500 en van een of meer overzichtskaarten met een schaal van
      ten minste 1:20 000.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel1
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '1'
        hoofdstuk: I
  - number: '11.3'
    text: |-
      Het ontwerp-tracébesluit bevat de resultaten van het akoestisch onderzoek, bedoeld in [artikel 87d][ref1]
      onderscheidenlijk [106c van de Wet geluidhinder][ref2], alsmede, indien het voornemen bestaat hogere
      waarden vast te stellen voor de ten hoogste toelaatbare geluidsbelasting in zones ingevolge de
      [artikelen 87e tot en met 87i][ref3] of [106d tot en met 106h van de Wet geluidhinder][ref4], de bedoelde hogere
      waarden.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel87d
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel106c
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel87e
      [ref4]: https://wetten.overheid.nl/BWBR0003227#Artikel106d
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 87d
      - id: ref2
        bwb_id: BWBR0003227
        artikel: 106c
      - id: ref3
        bwb_id: BWBR0003227
        artikel: 87e
      - id: ref4
        bwb_id: BWBR0003227
        artikel: 106d
  - number: '11.4'
    text: |-
      Het ontwerp-tracébesluit geeft aan op welke wijze de inpassing van de aan te leggen of te wijzigen hoofdweg,
      landelijke railweg of hoofdvaarweg zal geschieden, en waar dit in redelijkheid niet kan worden verlangd, welke
      compenserende maatregelen zullen worden getroffen.
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel11
  - number: '11.5'
    text: |-
      [Artikel 9, derde lid][ref1], is van overeenkomstige toepassing indien de vaststelling van een ontwerp-tracébesluit
      niet binnen de in het eerste lid bedoelde termijn kan geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel9
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '9'
        hoofdstuk: III
  - number: '11.6'
    text: |-
      Onze Minister handelt bij de toepassing van het vijfde lid in overeenstemming met Onze Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer.
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel11
  - number: '12.1'
    text: |-
      In geval van toepassing van [artikel 11, eerste lid][ref1], zendt Onze Minister het ontwerp-tracébesluit onder
      opgave van redenen en met een toelichting op het tracé aan de betrokken bestuursorganen en, indien het ontwerp-
      tracébesluit betrekking heeft op het tracé van een landelijke railweg, aan de exploitant van de railweg.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel11
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '11'
        hoofdstuk: III
  - number: '12.2'
    text: |-
      Onze Minister zendt het ontwerp-tracébesluit, indien het hogere waarden bevat voor de ten
      hoogste toelaatbare geluidsbelasting in zones ingevolge de [artikelen 87e tot en met 87i][ref1]
      of [106d tot en met 106h van de Wet geluidhinder][ref2], voorts aan:


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel87e
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel106d
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 87e
      - id: ref2
        bwb_id: BWBR0003227
        artikel: 106d
  - number: 12.2.a
    text: |-
      de gebruikers van de woningen of de woonwagenstandplaatsen, het bevoegd gezag van scholen en de directies van
      ziekenhuizen, verpleeghuizen en andere gezondheidszorggebouwen waarvoor een hogere waarde wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel12
  - number: 12.2.b
    text: |-
      de ter plaatse bevoegde inspecteur van het staatstoezicht op de volksgezondheid, die door Onze Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer is aangewezen;
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel12
  - number: 12.2.c
    text: de inspecteur van de volkshuisvesting;
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel12
  - number: 12.2.d
    text: de Minister van Onderwijs, Cultuur en Wetenschappen, indien het betrekking heeft op scholen.
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel12
  - number: '12.3'
    text: |-
      Onze Minister geeft met betrekking tot het ontwerp-tracébesluit toepassing aan de in
      [paragraaf 3.5.6 van de Algemene wet bestuursrecht][ref1] geregelde procedure met inachtneming van de volgende
      volzinnen. Bij de procedure betrekt Onze Minister de besturen van de provincies, gemeenten en waterschappen
      op het gebied waarvan het ontwerp-tracébesluit betrekking heeft. Binnen een week na de datum van toezending,
      bedoeld in het eerste lid, legt Onze Minister het ontwerp-tracébesluit met de toelichting daarop ter inzage.
      [Artikel 7, eerste tot en met derde lid][ref2], is van overeenkomstige toepassing. Na de periode van vier weken,
      bedoeld in [artikel 3:22, eerste lid, van de Algemene wet bestuursrecht][ref3] blijven de stukken ter inzage liggen
      op de door Onze Minister in overleg met de betrokken bestuursorganen te bepalen uren totdat Onze Minister een
      tracébesluit als bedoeld in [artikel 15, eerste lid][ref4], heeft vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf3.5.6
      [ref2]: https://wetten.overheid.nl/BWBR0006147#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0006147#Artikel15
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 3.5.6
      - id: ref2
        bwb_id: BWBR0006147
        artikel: '7'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0006147
        artikel: '15'
        hoofdstuk: III
  - number: '12.4'
    text: |-
      In afwijking van het tweede lid, aanhef en onder a, kan Onze Minister, indien de omvang van het ontwerp-
      tracébesluit daartoe aanleiding geeft, volstaan met eenieder van de in het tweede lid, onder a, bedoelde personen
      de strekking van het ontwerp-tracébesluit mee te delen en de onderdelen van het ontwerp-tracébesluit die voor de
      betrokkene redelijkerwijs van belang zijn, toe te zenden.
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel12
  - number: '13'
    text: |-
      Provinciale staten, het algemeen bestuur van een regionaal openbaar lichaam en de raad van elk van de gemeenten,
      op het gebied waarvan het ontwerp-tracébesluit betrekking heeft, delen elk binnen twaalf weken na de datum van
      verzending door Onze Minister van het ontwerp-tracébesluit aan Onze Ministers schriftelijk hun oordeel over het
      ontwerp-tracébesluit mee.
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel13
  - number: '14.1'
    text: |-
      Indien Onze Minister in de bij de toepassing van [artikel 12, derde lid][ref1], naar voren gebrachte zienswijzen
      of ingebrachte bedenkingen dan wel in het ingevolge [artikel 13][ref2] door provincies, regionale openbare lichamen
      en gemeenten gegeven oordeel aanleiding vindt zijn voorkeur voor het verloop en de geografische omvang van een aan
      te leggen of te wijzigen hoofdweg, landelijke railweg of hoofdvaarweg te wijzigen, bepaalt hij in overeenstemming
      met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer uiterlijk binnen twaalf weken na
      het verstrijken van de in [artikel 13][ref3] bedoelde termijn zijn gewijzigde voorkeur en werkt hij deze eveneens
      binnen de in dit lid bedoelde termijn van twaalf weken uit tot een gewijzigd ontwerp-tracébesluit. De zienswijzen
      en mededelingen als bedoeld in de eerste volzin kunnen geen grond vinden in bedenkingen tegen de trajectnota.
      Artikel 9, derde lid, is van overeenkomstige toepassing indien het bepalen van de gewijzigde voorkeur dan wel het
      uitwerken daarvan tot een gewijzigd ontwerp-tracébesluit niet binnen de in de eerste volzin bedoelde termijn kan
      geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0006147#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0006147#Artikel13
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '12'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0006147
        artikel: '13'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0006147
        artikel: '13'
        hoofdstuk: III
  - number: '14.2'
    text: |-
      Bij toepassing van het eerste lid van dit artikel vinden de [artikelen 9, tweede lid][ref1],
      [11, tweede en vierde lid][ref2], [12][ref3] en [13][ref4] overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0006147#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0006147#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0006147#Artikel13
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '9'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0006147
        artikel: '11'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0006147
        artikel: '12'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0006147
        artikel: '13'
        hoofdstuk: III
  - number: '14.3'
    text: |-
      Indien Onze Minister in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en
      Milieubeheer in andere dan de in het eerste lid bedoelde gevallen aanleiding vindt om een tracébesluit vast te
      stellen dat afwijkt van het ontwerp-tracébesluit dan wel, indien het eerste lid toepassing heeft gevonden, het
      gewijzigde ontwerp-tracébesluit, legt Onze Minister, alvorens het tracébesluit wordt vastgesteld, de onderdelen van
      het voorgenomen tracébesluit, voor zover deze afwijken van het ontwerp-tracébesluit dan wel het gewijzigde ontwerp-
      tracébesluit, gedurende twee weken ter inzage overeenkomstig [artikel 7, eerste lid][ref1]. Binnen de in de eerste
      volzin genoemde termijn kunnen schriftelijk bedenkingen worden ingebracht bij Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel7
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '7'
        hoofdstuk: II
  - number: 14a
    text: |-
      Indien Onze Minister naar aanleiding van de bij toepassing van [artikel 12, derde lid][ref1], naar voren
      gebrachte zienswijzen of bedenkingen dan wel het ingevolge [artikel 13][ref2] door provincies, regionale
      openbare lichamen en gemeenten gegeven oordeel in overweging neemt om in het tracébesluit met toepassing van de
      [artikelen 87e tot en met 87i][ref3] of [106d tot en met 106h van de Wet geluidhinder][ref4] hogere waarden vast te
      stellen voor de ten hoogste toelaatbare geluidsbelasting in zones met betrekking tot gebouwen en standplaatsen als
      bedoeld in [artikel 12, tweede lid, onder a][ref5], ten aanzien waarvan dat artikellid niet is toegepast, wordt,
      alvorens het tracébesluit wordt vastgesteld, ter zake toepassing gegeven aan dat artikellid voor zover het betreft
      bedoelde gebouwen en standplaatsen en legt Onze Minister de daarop betrekking hebbende onderdelen van het ontwerp-
      tracébesluit gedurende twee weken ter inzage overeenkomstig [artikel 7, eerste lid][ref6]. Binnen de in de eerste
      volzin genoemde termijn kunnen schriftelijk bedenkingen worden ingebracht bij Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0006147#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel87e
      [ref4]: https://wetten.overheid.nl/BWBR0003227#Artikel106d
      [ref5]: https://wetten.overheid.nl/BWBR0006147#Artikel12
      [ref6]: https://wetten.overheid.nl/BWBR0006147#Artikel7
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '12'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0006147
        artikel: '13'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0003227
        artikel: 87e
      - id: ref4
        bwb_id: BWBR0003227
        artikel: 106d
      - id: ref5
        bwb_id: BWBR0006147
        artikel: '12'
        hoofdstuk: III
      - id: ref6
        bwb_id: BWBR0006147
        artikel: '7'
        hoofdstuk: II
  - number: '15.1'
    text: |-
      Onze Minister stelt, in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening
      en Milieubeheer, het tracé vast onder opgave van redenen en met een toelichting op dat tracé. De
      [artikelen 9, tweede lid][ref1], en [11, tweede en vierde lid][ref2], zijn van overeenkomstige toepassing. Het
      tracébesluit dient uiterlijk binnen vijf maanden na vaststelling van het ontwerp-tracébesluit onderscheidenlijk,
      indien [artikel 14][ref3] toepassing heeft gevonden, van het gewijzigde ontwerp-tracébesluit te worden genomen.
      [Artikel 9, derde lid][ref4], is van overeenkomstige toepassing indien het nemen van het tracébesluit niet binnen
      de in de derde volzin bedoelde termijn kan geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0006147#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0006147#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0006147#Artikel9
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '9'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0006147
        artikel: '11'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0006147
        artikel: '14'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0006147
        artikel: '9'
        hoofdstuk: III
  - number: '15.2'
    text: |-
      Een beslissing tot het vaststellen van een hogere waarde voor de ten hoogste toelaatbare geluidsbelasting in zones
      ingevolge de artikelen [artikelen 87e tot en met 87i][ref1] en [106d tot en met 106h van de Wet geluidhinder][ref2]
      met betrekking tot het gebied dat is begrepen in een tracébesluit, maakt deel uit van het tracébesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel87e
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel106d
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 87e
      - id: ref2
        bwb_id: BWBR0003227
        artikel: 106d
  - number: '15.3'
    text: |-
      Voor het gebied dat is begrepen in een vastgesteld tracébesluit geldt dat tracébesluit als voorbereidingsbesluit,
      bedoeld in [artikel 21, eerste lid, van de Wet op de Ruimtelijke Ordening][ref1]. Voor de bij dat tracébesluit
      behorende zone, bedoeld in [artikel 74, eerste lid, van de Wet geluidhinder][ref2] onderscheidenlijk de zone,
      bedoeld in [artikel 106b van die wet][ref3], geldt dat tracébesluit als voorbereidingsbesluit, bedoeld in
      [artikel 21, eerste lid, van de Wet op de Ruimtelijke Ordening][ref4], met dien verstande dat dit slechts geldt
      met betrekking tot geprojecteerde woningen en andere geprojecteerde geluidsgevoelige objecten ten aanzien waarvan
      de geluidsbelasting vanwege de hoofdweg of de landelijke railweg of vanwege binnen de zone van die hoofdweg of
      landelijke railweg gelegen wegen of railwegen de waarden die ingevolge de [artikelen 87e tot en met 87i][ref5]
      en [106d tot en met 106h van de Wet geluidhinder][ref6] als ten hoogst toelaatbare waarden worden
      aangemerkt, te boven zal gaan. Voor zover het tracébesluit geldt als voorbereidingsbesluit, is
      [artikel 21, vierde tot en met zesde lid, van de Wet op de Ruimtelijke Ordening][ref7] niet van toepassing. Het
      tracébesluit geldt niet langer als voorbereidingsbesluit indien voor het in de eerste volzin bedoelde gebied en
      de in de tweede volzin bedoelde zone een bestemmingsplan in overeenstemming met het tracébesluit van kracht is
      geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel74
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel106b
      [ref4]: https://wetten.overheid.nl/BWBR0002375#Artikel21
      [ref5]: https://wetten.overheid.nl/BWBR0003227#Artikel87e
      [ref6]: https://wetten.overheid.nl/BWBR0003227#Artikel106d
      [ref7]: https://wetten.overheid.nl/BWBR0003227#Artikel21
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '74'
      - id: ref3
        bwb_id: BWBR0003227
        artikel: 106b
      - id: ref4
        bwb_id: BWBR0002375
        artikel: '21'
      - id: ref5
        bwb_id: BWBR0003227
        artikel: 87e
      - id: ref6
        bwb_id: BWBR0003227
        artikel: 106d
      - id: ref7
        bwb_id: BWBR0003227
        artikel: '21'
  - number: '15.4'
    text: |-
      Onder een geprojecteerde woning of een ander geprojecteerd geluidsgevoelig object als bedoeld in de tweede volzin
      van het derde lid wordt verstaan een nog niet aanwezige woning of ander geluidsgevoelig object waarvoor het
      geldende bestemmingsplan verlening van de bouwvergunning toelaat, maar deze nog niet is afgegeven.
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel15
  - number: '15.5'
    text: |-
      [Artikel 50 van de Woningwet][ref1] is niet van toepassing op aanvragen om een bouwvergunning ter realisering van
      het tracébesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel50
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '50'
  - number: '15.6'
    text: |-
      Voor zover het tracébesluit in strijd is met een bestemmingsplan geldt het tracébesluit als vrijstelling, bedoeld
      in [artikel 19 van de Wet op de Ruimtelijke Ordening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel19
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '19'
  - number: '15.7'
    text: |-
      Voor zover een bestemmingsplan of een ander besluit voor de uitvoering van werken, werkzaamheden en bouwwerken een
      aanlegvergunning als bedoeld in [artikel 14 van de Wet op de Ruimtelijke Ordening][ref1] vereist, geldt zodanige
      eis niet in het gebied dat is begrepen in een vastgesteld tracébesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel14
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '14'
  - number: '15.8'
    text: |-
      Voor zover bij een leefmilieuverordening als bedoeld in
      [artikel 9, eerste lid, van de Wet op de stads- en dorpsvernieuwing][ref1] voorschriften zijn gegeven als bedoeld
      in [artikel 9, derde lid, van die wet][ref2], blijven deze buiten toepassing voor de uitvoering van werken,
      werkzaamheden en bouwwerken en voor het gebruik van gronden en opstallen ter uitvoering van een tracébesluit, voor
      zover zodanige voorschriften strijdig zijn met het tracébesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0003709#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003709#Artikel9
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003709
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0003709
        artikel: '9'
  - number: '15.9'
    text: |-
      De gemeenteraad is verplicht binnen een jaar nadat het tracébesluit onherroepelijk is geworden het bestemmingsplan
      overeenkomstig dat tracébesluit vast te stellen of te herzien.
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel15
  - number: '15.10'
    text: |-
      Indien een bestemmingsplan in strijd is met een onherroepelijk tracébesluit en het bestemmingsplan nog niet is
      aangepast aan het tracébesluit, is het gemeentebestuur verplicht aan degenen die inzage verlangen in zodanig
      bestemmingsplan, tevens inzage te verlenen in het ten aanzien van het door dat plan bestreken gebied vastgestelde
      tracébesluit.
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel15
  - number: '16.1'
    text: |-
      Onze Minister zendt het tracébesluit onder opgave van redenen en met een toelichting op het tracé toe aan de
      Staten-Generaal en aan de besturen van de in [artikel 12, derde lid][ref1], bedoelde provincies, regionale
      openbare lichamen, gemeenten en waterschappen alsmede, indien de trajectnota betrekking heeft op het tracé van een
      landelijke railweg, aan de exploitant van de railweg.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel12
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '12'
        hoofdstuk: III
  - number: '16.2'
    text: Bij de bekendmaking van het tracébesluit worden de motivering en de toelichting op het tracé vermeld.
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel16
  - number: '16.3'
    text: |-
      Binnen een week na de datum van toezending legt Onze Minister het besluit onder opgave van de redenen
      daarvoor en met de toelichting op het tracé ter inzage.[ Artikel 7, eerste lid, van deze wet][ref1] en
      [artikel 3:22, eerste en derde lid, van de Algemene wet bestuursrecht][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '7'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '18'
    text: |-
      Indien de aanleg of wijziging van een hoofdweg, landelijke railweg of hoofdvaarweg niet is opgenomen in een
      jaarlijks voortschrijdend meerjarig uitvoeringsprogramma voor hoofdwegen, landelijke railwegen en hoofdvaarwegen,
      dat bij besluit van Onze Minister is vastgesteld voor het derde jaar na het jaar waarin het tracébesluit van kracht
      is geworden, vervalt het tracébesluit van rechtswege. Het tracébesluit vervalt eveneens van rechtswege indien dit
      niet binnen 10 jaar na het jaar waarin het van kracht is geworden ten uitvoer wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel18
  - number: '20.1'
    text: |-
      Indien voor de aanleg of wijziging van een hoofdweg, landelijke railweg of hoofdvaarweg als bedoeld in
      [artikel 2][ref1] bij of krachtens de wet een vergunning van een orgaan van een provincie, van een regionaal
      openbaar lichaam, van een gemeente, van een waterschap of enig ander publiekrechtelijk lichaam, niet zijnde het
      Rijk, is vereist met betrekking tot de inrichting of het gebruik van grond, daaronder begrepen water, welke is
      benodigd voor die aanleg of wijziging, dient Onze Minister onderscheidenlijk de exploitant van de railweg de
      aanvraag voor die vergunning niet eerder in dan twee jaren voorafgaande aan het tijdstip waarop blijkens het
      meerjarig uitvoeringsprogramma, bedoeld in [artikel 18, eerste lid][ref2], met die aanleg of wijziging zal worden
      begonnen.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006147#Artikel18
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0006147
        artikel: '18'
        hoofdstuk: IV
  - number: '20.2'
    text: |-
      Onze Minister bevordert een gecoördineerde voorbereiding van de besluiten op de aanvragen om de vergunningen en van
      de overige ambtshalve te nemen besluiten met het oog op de uitvoering van een tracébesluit.
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel20
  - number: '20.3'
    text: |-
      Onze Minister kan van de andere betrokken bestuursorganen de medewerking vorderen, die voor het welslagen van de
      coördinatie nodig is. Die bestuursorganen verlenen de van hen gevorderde medewerking.
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel20
  - number: '20.4'
    text: |-
      Op de voorbereiding van de besluiten op de aanvragen om de in het eerste lid bedoelde vergunningen is de in de
      [paragrafen 3.5.2 tot en met 3.5.5 van de Algemene wet bestuursrecht][ref1] geregelde procedure van toepassing, met
      dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf3.5.2
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 3.5.2
  - number: 20.4.a
    text: |-
      de in [artikel 3:18, tweede lid, van de Algemene wet bestuursrecht][ref1] bedoelde mededeling tevens wordt gedaan
      aan Onze Minister;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 20.4.b
    text: |-
      de ontwerpen van de besluiten binnen een door Onze Minister te bepalen termijn worden toegezonden aan Onze Minister,
      die zorg draagt voor de in [artikel 3:19, eerste lid, tweede volzin, van de Algemene wet bestuursrecht][ref1]
      bedoelde toezending;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 20.4.c
    text: |-
      de mededeling, bedoeld in [artikel 3:19, tweede lid, van de Algemene wet bestuursrecht][ref1] in alle gevallen ook
      wordt gedaan door kennisgeving in de Staatscourant;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 20.4.d
    text: |-
      Onze Minister de mededelingen, bedoeld in [artikel 3:19, tweede lid, van de Algemene wet bestuursrecht][ref1] voor
      verschillende ontwerpen kan samenvoegen in één mededeling, welke wordt gedaan door Onze Minister;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 20.4.e
    text: |-
      in afwijking van [artikel 3:28 van de Algemene wet bestuursrecht][ref1] de besluiten worden genomen binnen een door
      Onze Minister te bepalen termijn;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 20.4.f
    text: de besluiten onverwijld worden gezonden aan Onze Minister;
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel20
  - number: 20.4.g
    text: |-
      de in de [artikelen 3:23, tweede lid][ref1], [3:24, derde lid][ref2], en
      [3:25, derde lid, van de Algemene wet bestuursrecht][ref3] bedoelde toezending tevens geschiedt aan Onze Minister;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 20.4.h
    text: |-
      Onze Minister beslist over de toepassing van [artikel 3:29 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '20.5'
    text: |-
      Het vierde lid is van overeenkomstige toepassing op de voorbereiding van de in het tweede lid bedoelde ambtshalve
      te nemen besluiten.
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel20
  - number: '20.6'
    text: |-
      [Artikel 46, eerste lid, van de Woningwet][ref1] is niet van toepassing op aanvragen om een bouwvergunning ter
      uitvoering van het tracébesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel46
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '46'
  - number: '20.7'
    text: |-
      Indien een bestuursorgaan dat in eerste aanleg bevoegd is te beslissen op een aanvraag om een vergunning niet
      of niet tijdig overeenkomstig de aanvraag beslist, kunnen Onze Minister en Onze Minister wie het mede aangaat
      gezamenlijk een beslissing op de aanvraag nemen. In het laatste geval treedt hun besluit in de plaats van het
      besluit van het in eerste aanleg bevoegde bestuursorgaan. Indien Onze in de eerste volzin bedoelde Ministers
      voornemens zijn zelf een beslissing op de aanvraag te nemen, plegen zij overleg met het bestuursorgaan dat in
      eerste aanleg bevoegd is op de aanvraag te beslissen.
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel20
  - number: '20.8'
    text: Het zevende lid is van overeenkomstige toepassing op de in het tweede lid bedoelde ambtshalve te nemen besluiten.
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel20
  - number: '20.9'
    text: |-
      Indien bij de toepassing van het zevende lid de beslissing op een aanvraag wordt genomen door Onze in dat lid
      bedoelde Ministers, stort het bestuursorgaan dat in eerste aanleg bevoegd was te beslissen op de aanvraag, de ter
      zake ontvangen leges in 's Rijks kas.
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel20
  - number: '20.10'
    text: |-
      Ten aanzien van de in het eerste lid bedoelde aanvragen is Onze Minister mede bevoegd deze in te dienen bij de
      bevoegde bestuursorganen.
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel20
  - number: '20.11'
    text: |-
      De in het tweede lid bedoelde besluiten alsmede de in [artikel 3:27 van de Algemene wet bestuursrecht][ref1]
      bedoelde overwegingen worden, voor zover ten aanzien daarvan het vierde lid is toegepast, gelijktijdig door Onze
      Minister bekendgemaakt. Zij worden voorts in de Staatscourant geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '20.12'
    text: |-
      Indien tegen het ontwerp van een in het eerste lid bedoeld besluit bedenkingen naar voren kunnen worden gebracht,
      kunnen deze bedenkingen geen grond vinden in bedenkingen tegen de desbetreffende planologische kernbeslissing,
      bedoeld in [artikel 39 van de Wet op de Ruimtelijke Ordening][ref1], of tegen het tracébesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel39
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '39'
  - number: 20a
    text: |-
      De in [artikel 18, eerste lid, van de onteigeningswet][ref1] bedoelde dagvaarding kan geschieden nadat het
      tracébesluit is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel18
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '18'
  - number: 20b.1
    text: |-
      Het vonnis van onteigening van de rechtbank kan slechts in de openbare registers worden ingeschreven nadat het
      tracébesluit onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel20b
  - number: 20b.2
    text: |-
      In aanvulling op de [artikelen 54n][ref1] en [59 van de onteigeningswet][ref2] is ten behoeve van de in het eerste
      lid bedoelde inschrijving een uitspraak van de Afdeling bestuursrechtspraak van de Raad van State dan wel een
      verklaring van de griffier benodigd, waaruit blijkt dat het tracébesluit onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel54n
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel59
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel20b
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: 54n
      - id: ref2
        bwb_id: BWBR0001842
        artikel: '59'
  - number: '21'
    text: |-
      In afwijking van [artikel 2, eerste lid][ref1], is uitsluitend dit hoofdstuk van toepassing op de besluitvorming
      over de aanleg of wijziging van een hoofdweg, landelijke railweg of hoofdvaarweg ten aanzien waarvan een
      planologische kernbeslissing van kracht is als bedoeld in [artikel 39 van de Wet op de Ruimtelijke Ordening][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel39
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002375
        artikel: '39'
  - number: '22.1'
    text: |-
      Indien een planologische kernbeslissing als bedoeld in [artikel 39 van de Wet op de Ruimtelijke Ordening][ref1] van
      kracht is bepalen Onze Ministers met inachtneming van die beslissing het tracé en werken dit uit tot een ontwerp-
      tracébesluit en vervolgens tot een tracébesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel39
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '39'
  - number: '22.2'
    text: |-
      De [artikelen 9, tweede lid][ref1], [11, tweede en vierde lid][ref2], [12, eerste en tweede lid][ref3], en
      [13][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0006147#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0006147#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0006147#Artikel13
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '9'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0006147
        artikel: '11'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0006147
        artikel: '12'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0006147
        artikel: '13'
        hoofdstuk: III
  - number: '25'
    text: |-
      De [artikelen 14a tot en met 20b][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel19
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '19'
        hoofdstuk: IV
  - number: 25a.1
    text: |-
      Tegen een tracébesluit of een ander in [artikel 20, tweede lid][ref1], bedoeld besluit kan een belanghebbende
      beroep instellen bij de Afdeling bestuursrechtspraak van de Raad van State.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel20
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '20'
        hoofdstuk: IV
  - number: 25a.2
    text: |-
      In afwijking van [artikel 6:8 van de Algemene wet bestuursrecht][ref1] vangt de termijn voor het indienen van
      een beroepschrift tegen de in [artikel 20, tweede lid][ref2], bedoelde besluiten aan met ingang van de dag na die
      waarop de in [artikel 20, tiende lid][ref3], bedoelde bekendmaking is geschied.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0006147#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0006147#Artikel20
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0006147
        artikel: '20'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0006147
        artikel: '20'
        hoofdstuk: IV
  - number: 25a.3
    text: |-
      Voor zover beroep kan worden ingesteld tegen een of meer onderdelen van een planologische kernbeslissing
      als bedoeld in [artikel 39 van de Wet op de Ruimtelijke Ordening][ref1], vangt, in afwijking van
      [artikel 6:8 van de Algemene wet bestuursrecht][ref2], de termijn voor het indienen van een beroepschrift ter
      zake van die onderdelen aan met ingang van de dag waarop beroep kan worden ingesteld tegen het op de planologische
      kernbeslissing berustende tracébesluit. Indien niet binnen een jaar na het van kracht worden van de planologische
      kernbeslissing een daarop berustend tracébesluit is vastgesteld, vangt de beroepstermijn aan met ingang van de dag
      waarop dat jaar is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '39'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '6'
  - number: 25a.4
    text: |-
      [Artikel 7:1 van de Algemene wet bestuursrecht][ref1] is niet van toepassing met betrekking tot een tracébesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 25b.1
    text: |-
      Met betrekking tot beroepen tegen een tracébesluit beslist de Afdeling bestuursrechtspraak van de Raad van State
      binnen twaalf maanden na ontvangst van een verweerschrift.
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel25b
  - number: 25b.2
    text: |-
      In bijzondere omstandigheden kan de Afdeling de in het eerste lid genoemde termijn met ten hoogste drie maanden
      verlengen.
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel25b
  - number: 25b.3
    text: |-
      Met betrekking tot beroepen tegen de in [artikel 20, tweede lid][ref1], bedoelde besluiten beslist de Afdeling
      bestuursrechtspraak van de Raad van State binnen zes maanden na ontvangst van de desbetreffende verweerschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel20
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '20'
        hoofdstuk: IV
  - number: 25c
    text: |-
      Indien tegen een in [artikel 20, tweede lid][ref1], bedoeld besluit beroep kan worden ingesteld, kan
      dat beroep geen grond vinden in bedenkingen tegen een planologische kernbeslissing als bedoeld in
      [artikel 39 van de Wet op de Ruimtelijke Ordening][ref2] of tegen een tracébesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel39
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel25c
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '20'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002375
        artikel: '39'
  - number: '26.1'
    text: |-
      Deze wet blijft buiten toepassing ten aanzien van besluiten van Onze Minister tot vaststelling van een tracé voor
      de aanleg of wijziging van hoofdwegen, landelijke railwegen en hoofdvaarwegen die vóór de inwerkingtreding van deze
      wet zijn genomen, voor zover deze besluiten vóór 1 januari 1997 worden opgenomen in een uitvoeringsprogramma als
      bedoeld in [artikel 18, eerste lid][ref1]. In het laatste geval vervalt het besluit indien het niet binnen tien
      jaar na eerste opneming in het uitvoeringsprogramma ten uitvoer wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel18
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '18'
        hoofdstuk: IV
  - number: '26.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op besluiten als bedoeld in dat lid die binnen een jaar na
      inwerkingtreding van deze wet zijn genomen alsmede op door Onze Ministers aan te wijzen besluiten die binnen twee
      jaar na inwerkingtreding van deze wet zijn genomen.
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel26
  - number: '26.3'
    text: |-
      Het tweede lid geldt niet voor besluiten ter uitvoering van planologische kernbeslissingen als bedoeld in
      [artikel 28][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel28
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '28'
        hoofdstuk: VI
  - number: '26.4'
    text: |-
      [Artikel 18][ref1] is van overeenkomstige toepassing op besluiten als bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel18
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '18'
        hoofdstuk: IV
  - number: '27'
    text: |-
      Trajectnota's die na inwerkingtreding van deze wet worden vastgesteld maar geheel of gedeeltelijk vóór de
      inwerkingtreding van deze wet zijn voorbereid worden aangemerkt als trajectnota's in de zin van deze wet indien
      deze voorbereiding is geschied overeenkomstig de eisen die de Tracéwet aan de voorbereiding van trajectnota's
      stelt.
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel27
  - number: '28'
    text: |-
      Indien vóór de inwerkingtreding van deze wet planologische kernbeslissingen van kracht zijn ten aanzien van de
      hogesnelheidslijn Rotterdam-Amsterdam-Belgische grens en de Betuwe-route Rotterdam-Zevenaar worden deze aangemerkt
      als beslissingen in de zin van [artikel 39 van de Wet op de Ruimtelijke Ordening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel39
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '39'
  - number: '29'
    text: |-
      Onze Ministers zenden binnen drie jaar na het in werking treden van deze wet, en vervolgens telkens om de vijf
      jaar, aan de Staten-Generaal een verslag over de wijze waarop zij is toegepast.
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel29
  - number: '33'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel33
  - number: '34'
    text: |-
      Voor de plaatsing van deze wet in het *Staatsblad* brengt Onze Minister de in deze wet voorkomende aanhalingen van
      artikelen en afdelingen van de [Algemene wet bestuursrecht][ref1] in overeenstemming met de door Onze Minister van
      Justitie opnieuw vastgestelde nummering daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: '35'
    text: 'Deze wet kan worden aangehaald als: Tracéwet.'
    url: https://wetten.overheid.nl/BWBR0006147/2002-07-01#Artikel35
