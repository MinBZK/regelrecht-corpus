        artikel: '63'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '4'
  - number: '61'
    text: |-
      1 De landelijke jaarrekening, waarin rekening en verantwoording wordt afgelegd van het financieel beheer en van de
      geleverde prestaties over het verstreken boekjaar, wordt ingericht zoveel mogelijk met overeenkomstige toepassing
      van het gestelde in titel 9 van Boek 2 van het Burgerlijk Wetboek.

      2 De jaarrekening gaat vergezeld van een verklaring omtrent de getrouwheid, afgegeven door een door het Centraal
      Bestuur aangewezen accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].
      Bij de aanwijzing van de accountant wordt bedongen dat aan Onze Minister desgevraagd inzicht wordt geboden in de
      controlewerkzaamheden van de accountant.

      3 De verklaring bedoeld in het tweede lid heeft mede betrekking op de rechtmatige besteding van de toegekende
      middelen.

      4 De accountant voegt bij de verklaring bedoeld in het tweede lid, tevens een verslag van zijn bevindingen over de
      vraag of het beheer en de organisatie van de Arbeidsvoorzieningsorganisatie voldoen aan eisen van doelmatigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0008367/2002-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '62'
    text: |-
      In het landelijke jaarverslag doet de Arbeidsvoorzieningsorganisatie verslag van haar werkzaamheden, waaronder de
      realisatie van de prestaties zoals die overeenkomstig [artikel 48, vijfde lid, tweede volzin][ref1], waren bepaald,
      en het gevoerde beheer en beleid in het afgelopen kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0008367#Artikel48
    url: https://wetten.overheid.nl/BWBR0008367/2002-01-01#Artikel62
