  - number: '83'
    text: |-
      Onze Minister is belast met het toezicht op de rechtmatigheid en doelmatigheid van de uitvoering van deze en andere
      wetten door de Arbeidsvoorzieningsorganisatie.
    url: https://wetten.overheid.nl/BWBR0008367/2002-01-01#Artikel83
  - number: '84'
    text: |-
      1 Het Centraal Bestuur brengt de besluiten die behoren tot de door Onze Minister aangewezen categorieën onverwijld
      te zijner kennis.

      2 Het Centraal Bestuur brengt voorts de overige daartoe door Onze Minister aangewezen gegevens onverwijld te zijner
      kennis.
    url: https://wetten.overheid.nl/BWBR0008367/2002-01-01#Artikel84
  - number: '85'
    text: |-
      De leden van het Centraal Bestuur en van de Regionale Besturen en de personeelsleden van de
      Arbeidsvoorzieningsorganisatie zijn gehouden Onze Minister en de door Onze Minister daartoe aangewezen personen
      desgevraagd kosteloos alle inlichtingen te verstrekken welke Onze Minister voor de uitoefening van zijn
      toezichthoudende taak nodig heeft en Onze Minister dan wel deze personen te allen tijde inzage te geven in de
      administraties van de Arbeidsvoorzieningsorganisatie.
    url: https://wetten.overheid.nl/BWBR0008367/2002-01-01#Artikel85
  - number: '86'
    text: |-
      1 Onze Minister kan de Arbeidsvoorzieningsorganisatie aanwijzingen geven met betrekking tot de uitoefening van haar
      taak. Hij treedt daarbij niet in individuele gevallen.

      2 De Arbeidsvoorzieningsorganisatie is gehouden overeenkomstig de aanwijzing, bedoeld in het eerste lid, te
      handelen.
    url: https://wetten.overheid.nl/BWBR0008367/2002-01-01#Artikel86
  - number: '87'
    text: |-
      1 Besluiten en regelingen van het Centraal Bestuur, bedoeld in de [artikelen 5, vierde lid][ref1], [19][ref2],
      [32][ref3] en [68][ref4], behoeven de goedkeuring van Onze Minister.

      2 Het besluit omtrent goedkeuring wordt binnen vier weken na de datum waarop Onze Minister het desbetreffende
      besluit heeft ontvangen, bekendgemaakt. Het niet tijdig bekendmaken van een besluit omtrent goedkeuring of een
      besluit tot verdaging van de beslissing omtrent goedkeuring heeft niet tot gevolg dat een besluit tot goedkeuring
      geacht wordt te zijn genomen.

      3 Goedkeuring kan slechts worden onthouden wegens strijd met het recht of het algemeen belang.


