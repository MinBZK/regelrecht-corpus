preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, mede gezien het verslag dat is uitgebracht ter uitvoering van
    artikel 121 van de Arbeidsvoorzieningswet, wenselijk is onder meer de taakomschrijving en de bestuursstructuur
    van de Arbeidsvoorzieningsorganisatie, het financieringsstelsel, en de regeling van het toezicht te herzien,
    alsmede enkele andere daarmee verband houdende en overige wijzigingen aan te brengen en daartoe een nieuwe
    Arbeidsvoorzieningswet vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008367/2002-01-01#ArtikelAanhef
articles:
  - number: '2'
    text: |-
      1 Er is een openbaar lichaam, genaamd Arbeidsvoorzieningsorganisatie.

      2 De Arbeidsvoorzieningsorganisatie bezit rechtspersoonlijkheid en heeft haar zetel te 's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0008367/2002-01-01#Artikel2
  - number: '5'
    text: |-
      1 De Arbeidsvoorzieningsorganisatie is bevoegd tegen vergoeding diensten met betrekking tot het geschikt maken van
      werkzoekenden voor inschakeling in de arbeid en ter vervulling van vacatures te verrichten.

      2 Bij het verrichten van de diensten, bedoeld in het eerste lid, wordt de mededinging op de markt van
      reïntegratiediensten niet verhinderd, beperkt of vervalst.

      3 Voor de in het eerste lid bedoelde diensten worden ten minste zodanige prijzen in rekening gebracht, dat de
      kosten daarvan door de opbrengsten worden gedekt.

      4 Het Centraal Bestuur stelt voor de wijze van bepaling van de prijzen, bedoeld in het derde lid, een algemene
      regeling vast.
    url: https://wetten.overheid.nl/BWBR0008367/2002-01-01#Artikel5
  - number: '10'
    text: |-
      Oprichting of mede-oprichting van en deelneming in stichtingen, maatschappen, vennootschappen, verenigingen,
      coöperaties en onderlinge waarborgmaatschappijen door de Arbeidsvoorzieningsorganisatie vindt slechts plaats
      indien dit naar het oordeel van het Centraal Bestuur bijzonder aangewezen is voor de uitvoering van de taken van de
      Arbeidsvoorzieningsorganisatie op grond van deze wet en behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008367/2002-01-01#Artikel10
  - number: '17'
    text: |-
      1 Het Centraal Bestuur bestaat uit negen leden, onder wie een voorzitter, en drie plaatsvervangende leden.

      2 Het Centraal Bestuur kiest uit de leden een eerste en een tweede plaatsvervangend voorzitter.

      3 De leden en de plaatsvervangende leden worden bij koninklijk besluit benoemd.

      4 Drie leden, onder wie de voorzitter, en één plaatsvervanger voor deze leden worden voor benoeming voorgedragen
      door Onze Minister.

      5 Drie leden en één plaatsvervanger voor deze leden worden voor benoeming voorgedragen op voordracht van de door de
      Stichting van de Arbeid daartoe aan te wijzen representatieve organisaties van werkgevers.

      6 Drie leden en één plaatsvervanger voor deze leden worden voor benoeming voorgedragen op voordracht van de door de
      Stichting van de Arbeid daartoe aan te wijzen representatieve organisaties van werknemers.
    url: https://wetten.overheid.nl/BWBR0008367/2002-01-01#Artikel17
  - number: '19'
    text: |-
      Het Centraal Bestuur stelt een algemene regeling vast met betrekking tot:

      a. de rechtspositie van de voorzitter;

      b. de toekenning van een schadeloosstelling en van een vergoeding voor reis- en verblijfkosten aan de overige leden
      en de plaatsvervangende leden.
    url: https://wetten.overheid.nl/BWBR0008367/2002-01-01#Artikel19
  - number: '21'
    text: |-
      De leden en de plaatsvervangende leden kunnen te allen tijde door Onze Minister worden geschorst en bij koninklijk
      besluit worden ontslagen.
    url: https://wetten.overheid.nl/BWBR0008367/2002-01-01#Artikel21
  - number: '22'
    text: |-
      1 De leden van het Centraal Bestuur hebben ieder één stem.

      2 De leden van het Centraal Bestuur stemmen zonder last.

      3 Besluiten worden genomen bij meerderheid van stemmen.

      4 Besluiten kunnen slechts worden genomen in een vergadering van het Centraal Bestuur waarin ten minste vijf leden
      aanwezig zijn.

      5 Indien de stemmen staken geeft de stem van de voorzitter, of die van de plaatsvervangend voorzitter die hem
      vervangt, de doorslag.
    url: https://wetten.overheid.nl/BWBR0008367/2002-01-01#Artikel22
  - number: '24'
    text: |-
      De voorzitter vertegenwoordigt de Arbeidsvoorzieningsorganisatie in en buiten rechte voor zover het aangelegenheden
      betreft die het Centraal Bestuur aangaan.
    url: https://wetten.overheid.nl/BWBR0008367/2002-01-01#Artikel24
  - number: '25'
    text: |-
      De Algemene Directie bestaat uit één hoofddirecteur en één of meer directeuren, die door het Centraal Bestuur
      worden benoemd.
    url: https://wetten.overheid.nl/BWBR0008367/2002-01-01#Artikel25
  - number: '27'
    text: |-
      De Algemene Directie vertegenwoordigt de Arbeidsvoorzieningsorganisatie in en buiten rechte met betrekking tot de
      aangelegenheden die tot haar taken en bevoegdheden behoren.
    url: https://wetten.overheid.nl/BWBR0008367/2002-01-01#Artikel27
  - number: '28'
    text: |-
      De leden van de Algemene Directie en het daaraan toegevoegde personeel worden in dienst genomen op
      arbeidsovereenkomst naar burgerlijk recht. De bepalingen van titel 10 van Boek 7 van het Burgerlijk Wetboek zijn op
      deze overeenkomst van toepassing.
    url: https://wetten.overheid.nl/BWBR0008367/2002-01-01#Artikel28
  - number: '42'
    text: |-
      1 De arbeidsovereenkomsten, bedoeld in de [artikelen 28][ref1] en [41][ref2], kunnen door de
      Arbeidsvoorzieningsorganisatie niet worden opgezegd zonder voorafgaande toestemming van de ontslagcommissie,
      bedoeld in [artikel 43][ref3].

      2 Het eerste lid is niet van toepassing indien de opzegging geschiedt om een dringende aan de werknemer onverwijld
      meegedeelde reden dan wel indien de opzegging geschiedt met wederzijds goedvinden.

      3 Een opzegging in strijd met het eerste lid is vernietigbaar. De werknemer kan binnen twee maanden na de opzegging
      een beroep doen op deze vernietigingsgrond. [Artikel 55 van Boek 3 van het Burgerlijk Wetboek][ref4] is niet van
      toepassing.

      4 Een rechtsvordering in verband met de vernietiging verjaart door verloop van zes maanden na de dag waartegen
      is opgezegd.

      5 De Arbeidsvoorzieningsorganisatie kan niet opzeggen gedurende de tijd dat de werknemer ongeschikt is tot
      het verrichten van zijn arbeid wegens ziekte, tenzij de ongeschiktheid een aanvang heeft genomen nadat het
      voornemen van de Arbeidsvoorzieningsorganisatie tot opzegging van de arbeidsovereenkomst ter toetsing aan de
      ontslagcommissie, bedoeld in [artikel 43, eerste lid][ref5], is voorgelegd en door die commissie is ontvangen. Van
      de eerste volzin kan slechts worden afgeweken bij collectieve arbeidsovereenkomst of bij regeling door of namens
      een daartoe bevoegd bestuursorgaan.

      6 Indien de toestemming, bedoeld in [artikel 42, eerste lid][ref6], is verleend, wordt de door de
      Arbeidsvoorzieningsorganisatie in acht te nemen termijn van opzegging, verkort met een maand, met dien verstande
      dat de resterende termijn van opzegging ten minste één maand bedraagt. Van de eerste volzin kan slechts worden
      afgeweken bij collectieve arbeidsovereenkomst of bij regeling door of namens een daartoe bevoegd bestuursorgaan.


