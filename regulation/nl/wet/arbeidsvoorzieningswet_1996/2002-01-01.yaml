  - number: '64'
    text: |-
      Het Centraal Bestuur legt jaarlijks vóór 1 mei de landelijke jaarrekening en het landelijke jaarverslag aan Onze
      Minister voor.
    url: https://wetten.overheid.nl/BWBR0008367/2002-01-01#Artikel64
  - number: '66'
    text: Besluiten tot het aangaan van een geldlening behoeven de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008367/2002-01-01#Artikel66
  - number: '67'
    text: |-
      1 De Arbeidsvoorzieningsorganisatie voert een administratie die voldoet aan de eisen van doelmatig beheer en
      controle en die in elk geval haar vermogenstoestand zodanig weergeeft, dat daaruit te allen tijde de rechten en
      verplichtingen van het Centraal Bestuur en van de Regionale Besturen worden gekend.

      2 De administratie wordt in elk geval zodanig ingericht, dat deze een afzonderlijke financiële verantwoording bevat
      van:

      a. de besteding van de basisbijdrage, bedoeld in [artikel 47][ref1];

      b. de besteding van de prestatiebijdrage, bedoeld in [artikel 48][ref2].

      3 De financiële verantwoording, bedoeld in het tweede lid, onderdeel b, bevat een specificatie van de
      toerekening van de activa en passiva en de lasten en baten aan de uitvoering van taken, die op grond van de
      [Wet verzelfstandiging reïntegratiediensten Arbeidsvoorzieningsorganisatie][ref3] overgaan naar de naamloze
      vennootschap, bedoeld in die wet.

      4 De Arbeidsvoorzieningsorganisatie verantwoordt in de administratie tevens de inkomsten, bedoeld in
      [artikel 45, onderdelen b en c][ref4], afzonderlijk.

      5 Het boekjaar van de Arbeidsvoorzieningsorganisatie loopt van 1 januari tot en met 31 december.


