  - number: '60'
    text: |-
      Het Centraal Bestuur stelt jaarlijks, na overleg met de Regionale Besturen, een landelijke jaarrekening en een
      landelijk jaarverslag van de Arbeidsvoorzieningsorganisatie vast, waarin de jaarrekeningen en jaarverslagen,
      bedoeld in [artikel 63][ref1], zijn verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0008367#Artikel63
    url: https://wetten.overheid.nl/BWBR0008367/2002-01-01#Artikel60
