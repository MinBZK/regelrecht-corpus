  - number: '88'
    text: |-
      Besluiten van het Centraal Bestuur kunnen bij koninklijk besluit worden vernietigd. Een besluit tot schorsing of
      vernietiging, dan wel tot opheffing of verlenging van een schorsing, wordt in de *Staatscourant* bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0008367/2002-01-01#Artikel88
  - number: '90'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen, voor zoveel nodig in afwijking van deze wet, voorzieningen worden
      getroffen voor het geval het Centraal Bestuur zijn uit een wet voortvloeiende verplichtingen niet naar behoren
      nakomt.

      2 Het eerste lid is van overeenkomstige toepassing in het geval een voordracht voor de benoeming van de leden van
      het Centraal Bestuur achterwege blijft.
    url: https://wetten.overheid.nl/BWBR0008367/2002-01-01#Artikel90
  - number: '91'
    text: |-
      1 Het Centraal Bestuur verstrekt Onze Minister desgevraagd kosteloos inlichtingen met betrekking tot onderwerpen
      die verband houden met de uitvoering van deze wet en andere wetten door de Arbeidsvoorzieningsorganisatie en
      informeert hem desgevraagd over de uitvoerbaarheid van beleidsvoornemens en wettelijke voorschriften voor zover
      deze betrekking hebben op onderwerpen die daarmee verband houden.

      2 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008367/2002-01-01#Artikel91
