articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. minister: Minister van Onderwijs, Cultuur en Wetenschap;

      b. uitkering: een specifieke uitkering als bedoeld in [artikel 2][ref1];

      c. gemeente: Alkmaar, Almere, Amersfoort, Amsterdam, Apeldoorn, Arnhem, Breda, Delft, Den Haag, Dordrecht, Ede,
      Eindhoven, Emmen, Enschede, Groningen, Haarlem, Haarlemmermeer, Heerlen, Hengelo, ’s Hertogenbosch, Leeuwarden,
      Leiden, Maastricht, Nijmegen, Rotterdam, Tilburg, Utrecht, Zaanstad, Zoetermeer of Zwolle.


      [ref1]: https://wetten.overheid.nl/BWBR0017045#Artikel2
    url: https://wetten.overheid.nl/BWBR0017045/2004-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0017045
        artikel: '2'
  - number: '2'
    text: |-
      De minister verstrekt aan de gemeente of de provincie voor het jaar 2004 een specifieke uitkering ten behoeve van:

      a. het ontwikkelen van een goede culturele bemiddelings- en netwerkstructuur voor scholen in het primair onderwijs,
      en

      b. het vormgeven van een geleidelijke aanpak, waarlangs scholen in het primair onderwijs hun visie op
      cultuureducatie binnen hun school gaan ontwikkelen en verdiepen.
    url: https://wetten.overheid.nl/BWBR0017045/2004-08-01#Artikel2
