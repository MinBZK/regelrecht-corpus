  - number: '4'
    text: |-
      In het geval dat de toezichthouder heeft geconcludeerd dat de betrouwbaarheid niet (meer) buiten twijfel staat en
      uit de toezichtswet zelf geen directe consequenties voortvloeien, kan de toezichthouder gebruik maken van de hem
      ingevolge de toezichtswet toekomende bevoegdheden (bijvoorbeeld het geven van een aanwijzing, het niet verlenen
      c.q. intrekken van een vergunning of het weigeren, wijzigen of intrekken van een verklaring van geen bezwaar).
    url: https://wetten.overheid.nl/BWBR0017862/2006-01-29#Artikel4
  - number: '5'
    text: |-
      De Beleidsregel inzake de betrouwbaarheidstoetsing van (kandidaat)(mede)beleidsbepalers van en houders van
      gekwalificeerde deelnemingen in onder toezicht staande instellingen van 19 april 2004 (Stcrt. 74) wordt
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0017862/2006-01-29#Artikel5
  - number: '6'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na dagtekening van de Staatscourant waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0017862/2006-01-29#Artikel6
