  - number: '3'
    text: |-
      1 De toezichthouder concludeert dat de betrouwbaarheid niet (meer) buiten twijfel staat indien naar zijn oordeel
      uit de antecedenten van betrokkene blijkt dat deze één of meer van de in [artikel 1][ref1] bedoelde gedragingen
      heeft vertoond.

      2 De toezichthouder betrekt bij zijn oordeelsvorming

        - in voorkomend geval het onderlinge verband tussen de aan een antecedent ten grondslag liggende gedraging(en) en
      de overige omstandigheden van het geval;
        - de belangen die de toezichtswet beoogt te beschermen; alsmede
        - de overige belangen van de financiële instelling en betrokkene.

      3 Gelet op aard en de ernst van de misdrijven genoemd in [bijlage A2][ref2], worden de aan die misdrijven ten
      grondslag liggende gedragingen op voorhand geacht onverenigbaar te zijn met de belangen die de toezichtswet beoogt
      te beschermen. De toezichthouder stelt vast dat de betrouwbaarheid niet (meer) buiten twijfel staat indien uit de
      antecedenten van betrokkene blijkt dat deze bij onherroepelijke uitspraak is veroordeeld ter zake van een misdrijf
      als vermeld in genoemde bijlage, tenzij sedert de dag waarop deze uitspraak onherroepelijk is geworden acht jaren
      of meer zijn verstreken.

      4 Indien een antecedent kan worden gekwalificeerd als een antecedent in de zin van zowel [bijlage A1][ref3] als
      [bijlage A2][ref4], dan geldt het bepaalde van [artikel 3, derde lid][ref5], hiervoor.


