preamble:
  text: |-
    Beleidsregel van De Nederlandsche Bank N.V., de Stichting Autoriteit Financiële Markten en de Minister van
    Financiën (hieronder gezamenlijk dan wel ieder afzonderlijk te noemen: 'de toezichthouder') voor het beoordelen
    van de betrouwbaarheid van personen ingevolge de Wet financiële dienstverlening (Wfd) en het Besluit financiële
    dienstverlening (Bfd), de Wet toezicht kredietwezen 1992 (Wtk 1992), Wet toezicht beleggingsinstellingen
    (Wtb), Besluit toezicht beleggingsinstellingen (Btb), Wet toezicht effectenverkeer 1995 (Wte 1995), Besluit
    toezicht effectenverkeer 1995 (Bte 1995), Vrijstellingsregeling Wet toezicht effectenverkeer 1995, Wet toezicht
    verzekeringsbedrijf 1993 (Wtv 1993), Wet toezicht natura-uitvaartverzekeringsbedrijf (Wtn), Wet inzake de
    geldtransactiekantoren (Wgt), Wet toezicht trustkantoren (Wtt), Pensioen- en spaarfondsenwet (Psw) en het Besluit
    vrijgestelde onderlinge waarborgmaatschappijen 1994, hieronder gezamenlijk dan wel ieder afzonderlijk te noemen:
    'de toezichtswet'

    Gelet op onder meer de artikelen 26 Wfd en 7 Bfd, 9, 13, 14, 15, 23, 24, 25, 26, 82 Wtk 1992; 5, 12, 15, 21 Wtb &
    11 Btb; 3 en 6 Wgt; 7, 11, 16, 19, 20, 21 en 22 Wte 1995 & 10, 11 en 22 Bte 1995; 29, 30, 45, 54, 75, 82, 103, 148,
    174, 175 en 176 Wtv 1993; 18, 19, 23, 27, 35, 60, 81, 82 en 84 Wtn; 4 en 5 Wtt; 5 Psw; 6 en 7 Besluit vrijgestelde
    onderlinge waarborgmaatschappijen 1994; 19, 21, 23 en 23a Vrijstellingsregeling Wte 1995 besluit de toezichthouder
    als volgt:
  url: https://wetten.overheid.nl/BWBR0017862/2006-01-29#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Onder betrouwbaarheid wordt voor de toepassing van de toezichtswet verstaan het zich onthouden van één of
      meer gedragingen die naar het oordeel van de toezichthouder in de weg staan aan het vervullen van de functie van
      (mede)beleidsbepaler dan wel het houden van een gekwalificeerde deelneming.

      2 Tot de in het eerste lid bedoelde gedragingen behoren in ieder geval gedragingen die blijk geven van het
      niet hebben van eigenschappen als waarheidslievendheid, verantwoordelijkheidszin, wetsgetrouwheid, openheid,
      oprechtheid, prudentie, punctualiteit, onkreukbaarheid, discretie en rechtschapenheid.
    url: https://wetten.overheid.nl/BWBR0017862/2006-01-29#Artikel1
  - number: '2'
    text: |-
      1 De beoordeling van de betrouwbaarheid geschiedt door op basis van voornemens, handelingen en antecedenten (hierna
      gezamenlijk te noemen: antecedenten) te toetsen of betrokkene blijk geeft of heeft gegeven van zodanige gedragingen
      dat daardoor naar het oordeel van de toezichthouder diens betrouwbaarheid niet (meer) buiten twijfel staat.

      2 De bij de beoordeling van de betrouwbaarheid in acht te nemen antecedenten zijn:

        - strafrechtelijke antecedenten ([bijlage A1][ref1] en [bijlage A2][ref2]);
        - financiële antecedenten ([bijlage B][ref3]);
        - toezichtsantecedenten ([bijlage C][ref4]);
        - fiscaal bestuursrechtelijke antecedenten ([bijlage D][ref5]);
        - overige antecedenten ([bijlage E][ref6]).

      [Bijlage A2][ref7] bevat een limitatieve opsomming van antecedenten; de overige bijlagen zijn niet limitatief.

      3 Inzicht in de in het tweede lid genoemde antecedenten wordt verkregen door gebruik te maken van onder meer:

        - de door de te benoemen persoon en voorgenomen houder van een gekwalificeerde deelneming ingevulde vragenlijst
      volgens het door de toezichthouder vastgestelde model;
        - de mogelijkheid om bij de Landelijk Officier van Justitie gegevens uit politieregisters op te vragen;
        - raadpleging van de database Vennoot '98 van het Ministerie van Justitie;
        - raadpleging van de Belastingdienst;
        - gegevens of inlichtingen verkregen van Nederlandse of buitenlandse overheidsinstanties dan wel van Nederlandse of
      buitenlandse van overheidswege aangewezen instanties die belast zijn met het toezicht op financiële markten of op
      natuurlijke personen en rechtspersonen die op die markten werkzaam zijn;
        - ambtsberichten van het Openbaar Ministerie;
        - referenties.


