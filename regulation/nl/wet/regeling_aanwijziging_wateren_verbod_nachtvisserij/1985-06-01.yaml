preamble:
  text: |-
    Gelet op artikel 7, tweede lid, onderdeel a, van het Reglement voor de binnenvisserij 1985 (Stb. 283);

    Gehoord de Voorlopige Adviesraad voor de Binnenvisserij en de Natuurbeschermingsraad;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0007415/1985-06-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Als water, als bedoeld in artikel 7, tweede lid, onderdeel a, van het Reglement voor de binnenvisserij 1985 (Stb.
      283) wordt aangewezen:

      1. Het Houtwiel, ten noorden van Veenwouden (Fr.);

      2. Het Rottighe Meente, in de gemeente Weststellingwerf (Fr.);

      3. De Deelen, begrensd door de Buitendijkse Hoofdvaart, de Deelenweg, de Hooivaartsweg, Tweede of Nieuwe Deel, de
      lijn van oost naar west door de lange warren langs de dwarssloten, het Binnenkanaal, de Hooivaartsweg, de vaart
      tussen het gemaal Dijksman en de P. C. Otterweg en het Stroomkanaal.

      4. De Beulakerwijde (incl. de Kleine Beulakerwijde);

      5. Het IJsselmeer;

      6. De wateren, gelegen in het Ilperveld, begrensd door de Purmerlander rijweg, het Noord-Hollandschkanaal, de
      gemeentegrens tussen Ilpendam en Landsmeer (Banscheiding) en de rijweg Landsmeer- den Ilp-Purmerland;

      7. De wateren gelegen in het gebied begrensd door het Noord-Hollandschkanaal, de Purmerringvaart tussen Ilpendam
      en Het Stinke Vuil, het Stinke Vuil, de Gouwzee, het IJsselmeer, het Buiten IJ en de in aanleg zijnde noordelijke
      ringweg van Amsterdam tussen de Schellingwouderbrug en de IJtunnelweg bij Nieuwendam, met uitzondering van het
      Kinselmeer, de binnen de bebouwde kommen gelegen wateren, alsmede de langs openbare wegen gelegen wateren voor
      zover wordt gevist vanaf de wegzijde;

      8. De wateren, gelegen in het gebied begrensd door de Zaan, de Knollendammervaart, het Noord-Hollandschkanaal, de
      noordelijke Ringvaart en de Wijde Wormer, het verbindingskanaal tussen de twee laatstgenoemde wateren, de Braak en
      de Poel;

      9. De Oude Zederik, gelegen tussen Ameide en Meerkerk;

      10. De Hooge Boezem van de Nederwaard;

      11. De Hooge Boezem van de Overwaard;

      12. De Nieuwkoopse plassen, begrensd door de weg van de Noordse buurt naar Noorden en Nieuwkoop, de Ziendeweg, de
      Meije, de Kadewetering tot Slikkendam en de provinciale weg Slikkendam – Noordse buurt, met uitzondering van de
      Noordeinderplas tot het Brampjesgat en de Maarten Freekerweg en de Zuideinderplas.
    url: https://wetten.overheid.nl/BWBR0007415/1985-06-01#Artikel1
  - number: '2'
    text: |-
      1 Deze regeling wordt bekendgemaakt in de Nederlandse Staatscourant en treedt in werking met ingang van 1 juni
      1985.

      2 Zij kan worden aangehaald als Regeling aanwijziging wateren verbod nachtvisserij.
    url: https://wetten.overheid.nl/BWBR0007415/1985-06-01#Artikel2
