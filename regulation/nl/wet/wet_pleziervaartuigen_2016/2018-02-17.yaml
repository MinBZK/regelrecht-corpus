  - number: '24'
    text: |-
      Deze wet treedt in werking met ingang van 18 januari 2016. Indien het Staatsblad waarin deze wet wordt geplaatst
      wordt uitgegeven na 17 januari 2016, treedt deze wet in werking met ingang van de dag, volgende op die van
      plaatsing van deze wet in het Staatsblad.
