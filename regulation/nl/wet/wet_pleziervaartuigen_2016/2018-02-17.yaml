$id: wet_pleziervaartuigen_2016
regulatory_layer: WET
publication_date: '2023-03-01'
valid_from: '2018-02-17'
bwb_id: BWBR0037546
url: https://wetten.overheid.nl/BWBR0037546/2018-02-17
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het wenselijk is dat het, gelet op richtlijn 2013/53/EU van het Europees
    Parlement en de Raad van de Europese Unie van 20 november 2013 betreffende pleziervaartuigen en waterscooters
    en tot intrekking van richtlijn 94/25/EG (PbEU L 354), noodzakelijk is regels te stellen met betrekking tot de
    veiligheid en het in de handel brengen van pleziervaartuigen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *accreditatie:* accreditatie zoals bedoeld
      in artikel 2, tiende lid, van de verordening;
        - *CE-markering:* markering waarmee de fabrikant aangeeft dat een product in overeenstemming is met alle
      toepasselijke eisen van de harmonisatiewetgeving van de Europese Unie die in het aanbrengen van die markering
      voorziet;
        - *distributeur:* natuurlijke of rechtspersoon in de toeleveringsketen, anders dan de fabrikant of de importeur,
      die een product op de markt aanbiedt;
        - *EU-conformiteitsverklaring:* verklaring afgegeven door de fabrikant dat een product voldoet aan de eisen,
      bedoeld in artikel 15, eerste tot en met derde lid, van de richtlijn;
        - *fabrikant:* natuurlijke of rechtspersoon die een product vervaardigt of een product laat ontwerpen of
      vervaardigen en het onder zijn naam of merknaam verhandelt;
        - *geharmoniseerde norm:* geharmoniseerde norm als bedoeld in artikel 2, onderdeel 1, onder c, van Verordening
      (EU) nr. 1025/2012, betreffende Europese normalisatie, tot wijziging van de [Richtlijnen 89/686/EEG](31989L0686)
      en [93/15/EEG](31993L0015) van de Raad alsmede de Richtlijnen [94/9/EG](31994L0009), [94/25/EG](31994L0025),
      [95/16/EG](31995L0016), [97/23/EG](31997L0023), [98/34/EG](31998L0034), [2004/22/EG](32004L0022), [2007/23/EG]
      (32007L0023), [2009/23/EG](32009L0023) en [2009/105/EG](32009L0105) van het Europees Parlement en de Raad en tot
      intrekking van Beschikking [87/95/EEG](31987L0095) van de Raad en Besluit [nr. 1673/2006/EG](33573L2006) van het
      Europees Parlement en de Raad;
        - *gemachtigde:* in de Europese Unie gevestigde natuurlijke of rechtspersoon die schriftelijk door de fabrikant is
      gemachtigd om namens hem specifieke taken te vervullen;
        - *harmonisatiewetgeving van de Unie:* alle wetgeving van de Europese Unie die de voorwaarden voor het verhandelen
      van producten harmoniseert;
        - *importeur:* in de Europese Unie gevestigde natuurlijke of rechtspersoon die een product uit een derde land in de
      Europese Unie in de handel brengt;
        - *in bedrijf stellen:* eerste gebruik in de Europese Unie van een onder de richtlijn vallend product door de
      eindgebruiker ervan;
        - *in de handel brengen:* voor het eerst in de Europese Unie op de markt aanbieden van een product;
        - *ingrijpende verbouwing van een vaartuig:* een verbouwing van het vaartuig waarbij de wijze van voortstuwing
      van het vaartuig wordt veranderd, de motor ingrijpend wordt gewijzigd of het vaartuig zodanig wordt gewijzigd
      dat mogelijkerwijs niet meer wordt voldaan aan de toepasselijke essentiële veiligheids- en milieueisen van de
      richtlijn;
        - *ingrijpende wijziging van een motor:* een wijziging van een voortstuwingsmotor waardoor deze de in bijlage I,
      deel B, van de richtlijn vermelde emissiegrenswaarden zou kunnen overschrijden of waardoor het nominale vermogen
      van de motor met meer dan 15% toeneemt;
        - *keuring:* onderzoek waarmee wordt aangetoond of een product aan de eisen van de richtlijn voldoet;
        - *keuringsinstantie:* instantie die activiteiten in het kader van een keuring verricht, zoals ijken, testen,
      certificeren en inspecteren;
        - *kleine of middelgrote onderneming:* onderneming als bedoeld in de Aanbeveling 2003/361/EG van de Commissie, van
      6 mei 2003, betreffende de definitie van kleine, middelgrote en micro-ondernemingen;
        - *marktdeelnemers:* fabrikant, gemachtigde, importeur en distributeur;
        - *markttoezicht:* activiteiten en maatregelen van overheidsinstanties om ervoor te zorgen dat producten voldoen
      aan de toepasselijke eisen die zijn opgenomen in de harmonisatiewetgeving van de Unie en geen gevaar opleveren voor
      de gezondheid en veiligheid of andere aspecten van de bescherming van het openbaar belang;
        - *markttoezichthouder:* door Onze Minister met het markttoezicht belaste ambtenaren;
        - *nationale accreditatie-instantie:* nationale accreditatie-instelling als bedoeld in artikel 2, elfde lid, van
      de verordening;
        - *onderdelen:* in bijlage II van [richtlijn 2013/53](32013L0053)/EU bedoelde onderdelen van vaartuigen, die
      afzonderlijk in de handel worden gebracht;
        - *Onze Minister:* Onze Minister van Infrastructuur en Milieu;
        - *op de markt aanbieden:* in het kader van een handelsactiviteit, al dan niet tegen betaling, verstrekken van een
      product met het oog op distributie, consumptie of gebruik op de markt van de Europese Unie;
        - *particuliere importeur:* in de Europese Unie gevestigde natuurlijke of rechtspersoon die in het kader van een
      niet-handelsactiviteit een product uit een derde land in de Unie invoert met het oogmerk dit voor eigen gebruik in
      bedrijf te stellen;
        - *pleziervaartuig:* voor sport- en vrijetijdsdoeleinden bedoeld vaartuig, niet zijnde een waterscooter, ongeacht
      het type of de wijze van voortstuwing, met een romplengte van 2,5 tot 24 meter;
        - *richtlijn:* [richtlijn nr. 2013/53](32013L0053)/EU van het Europees Parlement en de Raad van de Europese Unie
      van 20 november 2013 betreffende pleziervaartuigen en waterscooters en tot intrekking van [richtlijn 94/25/EG]
      (31994L0025) (PbEU L 354);
        - *uit de handel nemen:* maatregel waarmee wordt beoogd te voorkomen dat een product dat zich in de
      toeleveringsketen bevindt, op de markt wordt aangeboden;
        - *vaartuig:* pleziervaartuig of waterscooter;
        - *verordening:* [verordening (EG) nr. 765/2008](32008R0765) van het Europees parlement en de Raad van de Europese
      Unie van 9 juli 2008 tot vaststelling van de eisen inzake accreditatie en markttoezicht betreffende het verhandelen
      van producten en tot intrekking van [Verordening (EEG) nr. 339/93](31993R0339) (PbEU L 218);
        - *voor eigen gebruik gebouwd vaartuig:* vaartuig dat grotendeels door de toekomstige gebruiker voor eigen gebruik
      is gebouwd;
        - *voortstuwingsmotor:* direct of indirect voor voortstuwing gebruikte inwendige verbrandingsmotor met vonk- of
      compressieontsteking, die gemonteerd zijn of specifiek bestemd zijn voor montage op of in vaartuigen;
        - *waterscooter:* voor sport- en vrijetijdsdoeleinden bedoeld vaartuig met een romplengte van minder dan 4 meter
      dat een voortstuwingsmotor met een waterstraalpomp als primaire voortstuwingsbron gebruikt en ontworpen is om door
      (een) op en niet in de romp zittende, staande of knielende persoon (personen) te worden bediend;
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel1
  - number: '2.1'
    text: 'Deze wet is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel2
  - number: 2.1.a
    text: 'wat de ontwerp en bouwvoorschriften van bijlage I, deel A, van de richtlijn betreft:'
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel2
  - number: 2.1.a.1°
    text: |-
      uitsluitend voor wedstrijden bedoelde vaartuigen, met inbegrip van wedstrijdroeiboten en trainingsroeiboten, die
      als zodanig door de fabrikant worden aangeduid;
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel2
  - number: 2.1.a.2°
    text: |-
      kano’s en kajaks die ontworpen zijn om uitsluitend met menselijke kracht te worden voortgestuwd, gondels en
      waterfietsen;
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel2
  - number: 2.1.a.3°
    text: |-
      surfplanken die uitsluitend zijn ontworpen om door de wind te worden voortgestuwd en die worden bediend door een of
      meer staande personen;
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel2
  - number: 2.1.a.4°
    text: surfplanken;
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel2
  - number: 2.1.a.5°
    text: |-
      originele historische vaartuigen en individuele replica’s daarvan die vóór 1950 zijn ontworpen en hoofdzakelijk met
      de oorspronkelijke materialen zijn gebouwd, en als zodanig door de fabrikant worden aangeduid;
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel2
  - number: 2.1.a.6°
    text: experimentele vaartuigen, mits zij niet in de Europese Unie in de handel worden gebracht;
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel2
  - number: 2.1.a.7°
    text: |-
      voor eigen gebruik gebouwde vaartuigen, onder de voorwaarde dat zij daarna gedurende een periode van vijf jaar,
      gerekend vanaf het in bedrijf stellen van het vaartuig, niet in de Europese Unie in de handel worden gebracht;
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel2
  - number: 2.1.a.8°
    text: |-
      onverminderd het tweede lid, vaartuigen die specifiek bestemd zijn om te worden bemand en passagiers te vervoeren
      voor commerciële doeleinden, ongeacht het aantal passagiers;
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel2
  - number: 2.1.a.9°
    text: duikboten;
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel2
  - number: 2.1.a.10°
    text: luchtkussenvoertuigen;
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel2
  - number: 2.1.a.11°
    text: draagvleugelboten;
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel2
  - number: 2.1.a.12°
    text: |-
      met stoomkracht aangedreven vaartuigen met externe verbranding die als brandstof gebruikmaken van kolen, cokes,
      hout, olie of gas;
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel2
  - number: 2.1.a.13°
    text: |-
      amfibische vaartuigen, te weten motorvoertuigen, op wielen of rupsbanden, die zowel op water als aan land kunnen
      worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel2
  - number: 2.1.b
    text: 'wat de uitlaatemissievoorschriften van bijlage I, deel B, van de richtlijn betreft:'
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel2
  - number: 2.1.b.1°
    text: 'voortstuwingsmotoren die gemonteerd zijn op of specifiek bestemd zijn voor montage op:'
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel2
  - number: 2.1.b.1°.aa
    text: uitsluitend voor wedstrijden bedoelde vaartuigen die als zodanig door de fabrikant worden aangeduid;
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel2
  - number: 2.1.b.1°.bb
    text: experimentele vaartuigen, op voorwaarde dat zij niet in de Europese Unie in de handel worden gebracht;
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel2
  - number: 2.1.b.1°.cc
    text: |-
      vaartuigen die specifiek bestemd zijn om te worden bemand en passagiers te vervoeren voor commerciële doeleinden,
      onverminderd lid 3, ongeacht het aantal passagiers;
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel2
  - number: 2.1.b.1°.dd
    text: duikboten;
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel2
  - number: 2.1.b.1°.ee
    text: luchtkussenvoertuigen;
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel2
  - number: 2.1.b.1°.ff
    text: draagvleugelboten;
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel2
  - number: 2.1.b.1°.gg
    text: |-
      amfibische vaartuigen, te weten motorvoertuigen, op wielen of rupsbanden, die zowel op water als aan land kunnen
      worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel2
  - number: 2.1.b.2°
    text: |-
      originelen en individuele replica’s van historische voortstuwingsmotoren die op een ontwerp van vóór 1950
      gebaseerd zijn, niet in serie geproduceerd zijn en gemonteerd worden op de in onderdeel a, onder 5° of 7°, bedoelde
      vaartuigen;
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel2
  - number: 2.1.b.3°
    text: |-
      voor eigen gebruik gebouwde voortstuwingsmotoren, op voorwaarde dat zij nadien gedurende een periode van vijf jaar,
      gerekend vanaf het moment waarop het vaartuig in bedrijf is gesteld, niet in de Europese Unie in de handel worden
      gebracht;
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel2
  - number: 2.1.c
    text: 'wat de geluidsemissievoorschriften van bijlage I, deel C, van de richtlijn betreft:'
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel2
  - number: 2.1.c.1°
    text: alle in onderdeel b bedoelde vaartuigen;
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel2
  - number: 2.1.c.2°
    text: |-
      een voor eigen gebruik gebouwd vaartuig, op voorwaarde dat deze daarna gedurende een periode van vijf jaar,
      gerekend vanaf het in bedrijf stellen van het vaartuig, niet in de Europese Unie in de handel wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel2
  - number: '2.2'
    text: |-
      Indien hetzelfde vaartuig ook kan worden gebruikt voor de verhuur of voor sport- en vrijetijdscursussen is deze wet
      van toepassing indien het vaartuig voor recreatiedoeleinden in de Europese Unie in de handel wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel2
  - number: '3.1'
    text: |-
      Vaartuigen, gedeeltelijk afgebouwde vaartuigen, onderdelen, ingrijpend verbouwde vaartuigen, voortstuwingsmotoren
      of ingrijpend gewijzigde voortstuwingsmotoren worden slechts op de markt aangeboden of in bedrijf gesteld, indien
      zij bij gebruik volgens hun bestemming en indien zij op correcte wijze zijn gebouwd en worden onderhouden geen
      gevaar opleveren voor de veiligheid en gezondheid van personen, goederen of het milieu.
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel3
  - number: '3.2'
    text: De in het eerste lid bedoelde producten voldoen aan de in bijlage I van de richtlijn opgenomen essentiële eisen.
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel3
  - number: '3.3'
    text: |-
      In vaartuigen ingebouwde voortstuwingsmotoren voldoen, onverminderd het eerste lid, tevens aan artikel 6, vierde
      lid, van de richtlijn, voor zover daarin aanvullende voorschriften zijn gesteld voor het op de markt aanbieden of
      in bedrijf stellen van die voortstuwingsmotoren.
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel3
  - number: '4.1'
    text: |-
      Voor de in [artikel 3, eerste lid][ref1], bedoelde producten die voldoen aan de in artikel 14 van de richtlijn
      bedoelde geharmoniseerde normen geldt als veronderstelling dat zij voldoen aan artikel 3, tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0037546#Artikel3
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0037546
        artikel: '3'
        hoofdstuk: '2'
  - number: '4.2'
    text: |-
      De keuring van de in het eerste lid, bedoelde producten geschiedt overeenkomstig de in de artikelen 19 tot en met
      24 van de richtlijn opgenomen voorschriften en procedures.
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel4
  - number: '4.3'
    text: |-
      Indien de in [artikel 3, eerste lid][ref1], bedoelde producten, met uitzondering van gedeeltelijk afgebouwde
      vaartuigen, op de markt aangeboden of in bedrijf worden gesteld zijn deze:


      [ref1]: https://wetten.overheid.nl/BWBR0037546#Artikel3
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0037546
        artikel: '3'
        hoofdstuk: '2'
  - number: 4.3.a
    text: |-
      vergezeld van een EU-conformiteitsverklaring als bedoeld in artikel 15 van de richtlijn, in de door Onze Minister
      vast te stellen talen, en;
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel4
  - number: 4.3.b
    text: voorzien van een CE-markering.
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel4
  - number: '4.4'
    text: |-
      Voor een van een CE-markering voorzien product geldt als veronderstelling dat het voldoet aan de in bijlage I van
      de richtlijn opgenomen essentiële eisen.
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel4
  - number: '5'
    text: |-
      In afwijking van [artikel 4, derde lid][ref1], is het toegestaan om:


      [ref1]: https://wetten.overheid.nl/BWBR0037546#Artikel4
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0037546
        artikel: '4'
        hoofdstuk: '2'
  - number: 5.a
    text: |-
      gedeeltelijk afgebouwde vaartuigen op de markt aan te bieden wanneer deze vergezeld gaan van een verklaring van
      de fabrikant of importeur, overeenkomstig bijlage III van de richtlijn en in de door Onze Minister vast te stellen
      talen, waaruit blijkt dat deze bestemd zijn om door anderen te worden afgebouwd;
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel5
  - number: 5.b
    text: |-
      onderdelen op de markt aan te bieden of in bedrijf te stellen indien deze vergezeld gaan van een EU-
      conformiteitsverklaring van de fabrikant of van de importeur waaruit blijkt dat deze onderdelen aan de in bijlage I
      van de richtlijn opgenomen essentiële eisen voldoen en bestemd zijn om in vaartuigen te worden gemonteerd;
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel5
  - number: 5.c
    text: |-
      de in artikel 6, vierde lid, van de richtlijn bedoelde voortstuwingsmotoren onder de in dat artikel genoemde
      voorwaarden op de markt aan te bieden of in bedrijf te stellen;
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel5
  - number: 5.d
    text: |-
      de in [artikel 3, eerste lid][ref1], bedoelde producten die niet aan deze richtlijn voldoen, op handelsbeurzen,
      tentoonstellingen, demonstraties en soortgelijke evenementen te tonen, mits met een zichtbaar teken duidelijk
      is aangegeven dat die producten niet aan de in bijlage I van de richtlijn opgenomen essentiële eisen voldoen en
      niet in de Unie op de markt worden aangeboden of in bedrijf gesteld voordat zij daarmee in overeenstemming zijn
      gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0037546#Artikel3
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0037546
        artikel: '3'
        hoofdstuk: '2'
  - number: '6.1'
    text: |-
      De marktdeelnemers en particuliere importeurs nemen de in Hoofdstuk II en artikel 25 van de richtlijn opgenomen
      verplichtingen in acht.
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel6
  - number: '6.2'
    text: |-
      Een wijziging van Hoofdstuk II of artikel 25 van de richtlijn gaat voor de toepassing van deze wet gelden met
      ingang van de dag waarop aan de betrokken wijziging uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel6
  - number: '6.3'
    text: |-
      Op verzoek van de fabrikant bepaalt Onze Minister de door de fabrikant te hanteren fabriekscode, bedoeld in Bijlage
      I, deel A, punt 2.1, onder 2., van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel6
  - number: '6.4'
    text: |-
      Het in artikel 7, zevende lid, en artikel 9, vierde lid, van de richtlijn bedoelde product gaat vergezeld van een
      handleiding in de door Onze Minister vast te stellen talen.
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel6
  - number: '7'
    text: |-
      Keuringen ten aanzien van derden worden uitsluitend verricht door keuringsinstanties die in overeenstemming met
      [artikel 8][ref1] beschikken over een aanmelding bij de Europese Commissie en de andere lidstaten van de Europese
      Unie.


      [ref1]: https://wetten.overheid.nl/BWBR0037546#Artikel8
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0037546
        artikel: '8'
        hoofdstuk: '4'
  - number: '8.1'
    text: |-
      Onze Minister kan op verzoek keuringsinstanties, die voldoen aan de krachtens het derde lid gestelde voorschriften,
      aanwijzen en bij de Europese Commissie en de andere lidstaten van de Europese Unie aanmelden als de op grond van
      deze wet bevoegde keuringsinstanties met betrekking tot de door hem te bepalen categorieën pleziervaartuigen,
      voortstuwingsmotoren en onderdelen van pleziervaartuigen en belast met door hem aan te geven taken. Het toezicht op
      deze keuringsinstanties berust bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel8
  - number: '8.2'
    text: |-
      Onze Minister kan de beoordeling van verzoeken van keuringsinstanties, die voor aanwijzing en aanmelding in
      aanmerking willen komen, en het toezicht op die keuringsinstanties opdragen aan een nationale accreditatie-
      instantie als bedoeld in artikel 2 van de verordening.
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel8
  - number: '8.3'
    text: |-
      Bij ministeriële regeling worden regels gesteld betreffende de procedure voor de aanwijzing, bedoeld in het eerste
      lid, de criteria voor de beoordeling van keuringsinstanties die voor aanwijzing en aanmelding in aanmerking willen
      komen, de wijze van beoordeling en de door deze keuringsinstanties verschuldigde vergoeding voor de kosten van de
      beoordeling en de wijze en het tijdstip van betaling daarvan.
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel8
  - number: '8.4'
    text: |-
      Aangemelde keuringsinstanties nemen rechtstreeks dan wel via een aangestelde vertegenwoordiger deel aan de
      werkzaamheden van de door Europese Commissie, overeenkomstig artikel 42 van de richtlijn, ingestelde sectorale
      groepen van aangemelde instanties.
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel8
  - number: '8.5'
    text: |-
      Onze Minister trekt een aanwijzing en aanmelding in, schort deze op of beperkt deze, indien hij van oordeel is
      dat de betreffende keuringsinstantie niet meer voldoet aan de krachtens het derde lid gestelde criteria of aan het
      vierde lid.
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel8
  - number: '9'
    text: |-
      Indien een keuringsinstantie aantoont dat zij voldoet aan de desbetreffende geharmoniseerde normen of delen ervan,
      waarvan de referenties in het Publicatieblad van de Europese Unie zijn bekendgemaakt, geldt als veronderstelling
      dat zij voldoet aan de krachtens [artikel 8, derde lid][ref1], gestelde criteria voor de beoordeling voor zover de
      toepasselijke geharmoniseerde normen met die criteria overeenkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0037546#Artikel8
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0037546
        artikel: '8'
        hoofdstuk: '4'
  - number: '10.1'
    text: |-
      Een aangemelde keuringsinstantie voert keuringen uit volgens de keuringsprocedures, bedoeld in de artikelen 19 tot
      en met 24 van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel10
  - number: '10.2'
    text: |-
      De keuringen worden op evenredige wijze uitgevoerd, waarbij wordt voorkomen dat marktdeelnemers en particuliere
      importeurs onnodig worden belast. De keuringsinstantie houdt bij de uitoefening van haar activiteiten naar
      behoren rekening met de omvang van een onderneming, de sector waarin zij actief is, haar structuur, de relatieve
      technologische complexiteit van de producten en het massa- of seriële karakter van het productieproces. Daarbij
      eerbiedigt zij evenwel de striktheid en het beschermingsniveau die nodig zijn om het product aan deze richtlijn te
      laten voldoen.
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel10
  - number: '10.3'
    text: |-
      Indien een aangemelde keuringsinstantie vaststelt dat een fabrikant of een particuliere importeur niet heeft
      voldaan aan de eisen van [artikel 3, eerste en tweede lid][ref1], of overeenkomstige geharmoniseerde normen,
      verlangt zij van die fabrikant of particuliere importeur dat hij passende corrigerende maatregelen neemt en
      verleent zij geen certificaat te bewijze van conformiteit aan die eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0037546#Artikel3
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0037546
        artikel: '3'
        hoofdstuk: '2'
  - number: '10.4'
    text: |-
      Indien een aangemelde keuringsinstantie bij het toezicht op de conformiteit na verlening van een certificaat
      vaststelt dat een product niet meer conform is, verlangt zij van de fabrikant of particuliere importeur dat hij
      passende corrigerende maatregelen neemt. Zo nodig schort zij het certificaat op of trekt zij dit in.
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel10
  - number: '10.5'
    text: |-
      Indien geen corrigerende maatregelen door de fabrikant of particuliere importeur worden genomen of de genomen
      maatregelen niet het vereiste effect hebben, worden de certificaten door de aangemelde keuringsinstantie naargelang
      het geval beperkt, opgeschort of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel10
  - number: '10.6'
    text: |-
      Een wijziging van de artikelen 19 tot en met 24 van de richtlijn gaat voor de toepassing van deze wet gelden met
      ingang van de dag waarop aan de betrokken wijziging uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel10
  - number: '11.1'
    text: 'Een aangemelde keuringsinstantie stelt Onze Minister in kennis van:'
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel11
  - number: 11.1.a
    text: elke weigering, beperking, opschorting of intrekking van certificaten;
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel11
  - number: 11.1.b
    text: omstandigheden die van invloed zijn op de werkingssfeer van en de voorwaarden voor aanmelding;
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel11
  - number: 11.1.c
    text: informatieverzoeken over keuringsactiviteiten die zij van markttoezichtautoriteiten ontvangen.
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel11
  - number: '11.2'
    text: |-
      Een aangemelde keuringsinstantie brengt desgevraagd Onze Minister op de hoogte van de binnen de werkingssfeer van
      haar aanmelding verrichte keuringsactiviteiten en andere activiteiten, waaronder grensoverschrijdende activiteiten
      en uitbesteding.
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel11
  - number: '11.3'
    text: |-
      Een aangemelde keuringsinstantie verstrekt de andere uit hoofde van deze richtlijn aangemelde keuringsinstanties
      die soortgelijke keuringsactiviteiten voor dezelfde producten verrichten relevante informatie over negatieve
      keuringsresultaten en op verzoek ook over positieve keuringsresultaten.
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel11
  - number: '12.1'
    text: |-
      Het is verboden een in [artikel 3, eerste lid][ref1], bedoeld product in de handel te brengen of als zodanig
      in bedrijf te stellen, indien dit niet voldoet aan de desbetreffende in bijlage I van de richtlijn opgenomen
      essentiële eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0037546#Artikel3
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0037546
        artikel: '3'
        hoofdstuk: '2'
  - number: '12.2'
    text: |-
      Het is verboden een in [artikel 3, eerste lid][ref1], bedoeld product in de handel te brengen of als zodanig in
      bedrijf te stellen, indien dit niet op deugdelijke wijze is voorzien van de vereiste CE-markering.


      [ref1]: https://wetten.overheid.nl/BWBR0037546#Artikel3
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0037546
        artikel: '3'
        hoofdstuk: '2'
  - number: '12.3'
    text: |-
      Het is verboden een CE-markering aan te brengen, indien niet een van toepassing zijnde procedure van
      conformiteitsbeoordeling is gevolgd of indien het betrokken product niet voldoet aan de desbetreffende in bijlage I
      van de richtlijn opgenomen essentiële eisen.
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel12
  - number: '12.4'
    text: |-
      Het is verboden merktekens of opschriften aan te brengen die anderen kunnen misleiden omtrent de betekenis of
      de grafische vormgeving van de CE-markering, of die de zichtbaarheid of de leesbaarheid van die CE-markering
      verminderen.
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel12
  - number: '12.5'
    text: 'Het is verboden te handelen in strijd met:'
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel12
  - number: 12.5.a
    text: de artikelen 7, 9, derde lid, tot en met 13 van de richtlijn, en
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel12
  - number: 12.5.b
    text: artikel 25 van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel12
  - number: '12.6'
    text: |-
      Het is verboden te handelen in strijd met een door de markttoezichthouder opgelegde verplichting, verbod of
      beperking als bedoeld in de [artikelen 14, eerste en derde lid][ref1], of [16][ref2] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0037546#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0037546#Artikel16
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0037546
        artikel: '14'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0037546
        artikel: '16'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '13.1'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de door Onze Minister
      aangewezen ambtenaren van de Inspectie Leefomgeving en Transport.
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel13
  - number: '13.2'
    text: |-
      Onze Minister kan tevens ambtenaren van een andere diensttak aanwijzen voor het toezicht op de naleving van het
      bij of krachtens deze wet bepaalde. Indien hij ambtenaren van een ander ministerie aanwijst, doet hij dit in
      overeenstemming met zijn ambtgenoot die het mede aangaat.
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel13
  - number: '13.3'
    text: Van een besluit als bedoeld in het tweede lid wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel13
  - number: '13.4'
    text: |-
      Het in het eerste en tweede lid bedoelde toezicht omvat mede de activiteiten en maatregelen in het kader van het
      markttoezicht.
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel13
  - number: '14.1'
    text: |-
      Indien de markttoezichthouder vaststelt dat een product als bedoeld in [artikel 3, eerste lid][ref1], gevaar
      kan opleveren voor de veiligheid en de gezondheid van personen, goederen of het milieu, legt hij direct de
      verantwoordelijke marktdeelnemer of particuliere importeur de verplichting op binnen een door hem vast te stellen
      termijn met de aard van het risico evenredige maatregelen te nemen om dat product in overeenstemming te brengen met
      bijlage I van de richtlijn, uit de handel te nemen of terug te roepen dan wel het in bedrijf stellen of het gebruik
      ervan op te schorten.


      [ref1]: https://wetten.overheid.nl/BWBR0037546#Artikel3
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0037546
        artikel: '3'
        hoofdstuk: '2'
  - number: '14.2'
    text: |-
      De in het eerste lid bedoelde marktdeelnemers of particuliere importeurs dragen er zorg voor de opgelegde
      maatregelen binnen de gestelde termijn uit te voeren.
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel14
  - number: '14.3'
    text: |-
      Indien geen of geen tijdige uitvoering wordt gegeven aan de krachtens het eerste lid opgelegde maatregelen neemt de
      markttoezichthouder alle passende voorlopige maatregelen om het op de markt aanbieden van het betreffende product
      te verbieden of te beperken, dit uit de handel te nemen of terug te roepen dan wel de inbedrijfstelling of het
      gebruik ervan te verbieden of te beperken.
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel14
  - number: '15.1'
    text: |-
      De markttoezichthouder stelt de betrokken aangemelde keuringsinstantie in kennis van een situatie als bedoeld in
      [artikel 14, eerste lid][ref1], alsmede de Europese Commissie en de andere lidstaten van de Europese Unie, indien
      naar zijn oordeel het vastgestelde gevaar niet beperkt is tot het Nederlandse grondgebied.


      [ref1]: https://wetten.overheid.nl/BWBR0037546#Artikel14
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0037546
        artikel: '14'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '15.2'
    text: |-
      De markttoezichthouder stelt direct de Europese Commissie en de andere lidstaten van de Europese Unie
      overeenkomstig artikel 44, vijfde lid, van de richtlijn in kennis van een situatie als bedoeld in
      [artikel 14, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037546#Artikel14
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0037546
        artikel: '14'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '16.1'
    text: |-
      De markttoezichthouder draagt de desbetreffende marktdeelnemer of particuliere importeur op om een product in
      overeenstemming te brengen met de bij of krachtens deze wet geldende voorschriften indien hij vaststelt dat:
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel16
  - number: 16.1.a
    text: de CE-markering niet of ten onrechte is aangebracht;
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel16
  - number: 16.1.b
    text: de EU-conformiteitsverklaring niet of incorrect is opgesteld;
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel16
  - number: 16.1.c
    text: |-
      de verklaring van de fabrikant of importeur, bedoeld in bijlage III van de richtlijn, niet of incorrect is
      opgesteld;
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel16
  - number: 16.1.d
    text: de technische documentatie niet beschikbaar of onvolledig is;
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel16
  - number: 16.1.e
    text: de naam, merknaam en contactgegevens van de fabrikant of importeur ontbreken, onjuist of onvolledig zijn;
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel16
  - number: 16.1.f
    text: niet is voldaan aan enig ander administratief vereiste als bedoeld in de artikelen 7 of 9 van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel16
  - number: '16.2'
    text: |-
      Indien de desbetreffende marktdeelnemer of particuliere importeur de opgedragen handelingen niet of niet tijdig
      uitvoert neemt de markttoezichthouder alle passende maatregelen om het aanbieden van het betreffende product te
      verbieden of te beperken, dit uit de handel te nemen of terug te roepen dan wel de inbedrijfstelling of het gebruik
      ervan te verbieden of te beperken.
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel16
  - number: '17.1'
    text: |-
      Onze Minister kan het toezicht op de aangemelde keuringsinstanties opdragen aan een nationale accreditatie-
      instantie.
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel17
  - number: '17.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gegeven betreffende het op de aangemelde keuringsinstanties uit
      te oefenen toezicht en de door deze instanties verschuldigde vergoeding voor de kosten van de uitoefening van dat
      toezicht en de wijze en het tijdstip van betaling daarvan.
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel17
  - number: '18.1'
    text: |-
      Onze Minister kan aan degene die handelt in strijd met de in [artikel 12][ref1] gestelde verboden een bestuurlijke
      boete opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0037546#Artikel12
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0037546
        artikel: '12'
        hoofdstuk: '5'
  - number: '18.2'
    text: |-
      De bestuurlijke boete die voor een overtreding van [artikel 12, tweede lid en vijfde lid, onderdeel b][ref1],
      ten hoogste kan worden opgelegd komt overeen met de boete van de derde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0037546#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0037546
        artikel: '12'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '23'
  - number: '18.3'
    text: |-
      De bestuurlijke boete die voor een overtreding van [artikel 12, eerste, derde, vierde en zesde lid][ref1],
      kan worden opgelegd komt overeen met de boete van de vierde categorie, bedoeld in
      [artikel 23, vierde lid van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037546#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0037546
        artikel: '12'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '23'
  - number: '18.4'
    text: |-
      De bestuurlijke boete die voor een overtreding van [artikel 12, vijfde lid, onderdeel a][ref1],
      kan worden opgelegd komt overeen met de boete van de vijfde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037546#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0037546
        artikel: '12'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '23'
  - number: '18.5'
    text: |-
      De op te leggen bestuurlijke boete kan met maximaal 50% worden verhoogd, indien binnen een periode van 48 maanden
      tweemaal voor een zelfde feit, elk afzonderlijk in een periode van maximaal 24 maanden voorafgaand aan dat feit,
      een boete is opgelegd en onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel18
  - number: '19'
    text: |-
      Onze Minister is bevoegd tot toepassing van bestuursdwang ter handhaving van de bij of krachtens deze wet gestelde
      verplichtingen.
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel19
  - number: '20.1'
    text: |-
      Producten die voor 18 januari 2016 onder het toepassingsgebied van [Richtlijn 94/25/EG](31994L0025) vielen en
      daarmee in overeenstemming zijn, mogen tot 18 januari 2017 in de handel worden gebracht of in bedrijf gesteld
      met toepassing van de [Wet pleziervaartuigen][ref1], zoals die luidde op de dag voorafgaand aan die van
      inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0008366
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0008366
  - number: '20.2'
    text: |-
      Buitenboordvoortstuwingsmotoren met vonkontsteking met een vermogen van 15kW of minder, die door een kleine of
      middelgrote onderneming zijn vervaardigd, mogen op de markt worden aangeboden of in bedrijf worden gesteld wanneer
      die motoren voldoen aan de grenswaarden voor uitlaatemissies in bijlage I, deel B, punt 2.1, van de richtlijn en
      voor 18 januari 2020 in de handel zijn gebracht.
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel20
  - number: '21'
    text: |-
      Een wijziging van de bijlagen bij de richtlijn gaat voor de toepassing van deze wet gelden met ingang van de dag
      waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in
      de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel21
  - number: '23.1'
    text: |-
      De [Wet pleziervaartuigen][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0008366
    url: https://wetten.overheid.nl/BWBR0037546/2018-02-17#Artikel23
