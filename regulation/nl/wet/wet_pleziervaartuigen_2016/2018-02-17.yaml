  - number: '23.2'
    text: |-
      Op producten die op de markt zijn aangeboden of in gebruik zijn genomen voor de inwerkingtreding van deze wet
      blijven de [artikelen 3][ref1], [4][ref2], [5][ref3], [6][ref4], [7][ref5], [7a][ref6], [7b][ref7], [13][ref8],
      [14][ref9], [15][ref10], [16][ref11] en [17 van de Wet pleziervaartuigen][ref12] van toepassing, zoals die luidde
      op de dag voorafgaand aan die van de inwerkingtreding van deze wet en is [artikel 22][ref13] niet van toepassing.


