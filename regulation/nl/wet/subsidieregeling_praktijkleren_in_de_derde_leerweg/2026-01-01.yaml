  - number: '3.1'
    text: |-
      Het doel van deze regeling is om directe en duurzame inzetbaarheid van werkzoekenden en werkenden op de
      arbeidsmarkt te verbeteren, door scholing via praktijkleren in het mbo in de derde leerweg bij een erkend
      leerbedrijf te subsidiëren.
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel3
  - number: '3.2'
    text: 'Onder werkzoekenden en werkenden vallen:'
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel3
  - number: 3.2.a
    text: personen die betaalde arbeid verrichten;
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel3
  - number: 3.2.b
    text: |-
      personen die in aanmerking komen voor ondersteuning bij arbeidsinschakeling op grond van de
      [artikelen 30a van de Wet SUWI][ref1] en [73 van de Werkloosheidswet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel73
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30a
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '73'
  - number: 3.2.c
    text: |-
      personen die in aanmerking komen voor ondersteuning bij arbeidsinschakeling op grond van de
      [artikelen 7, eerste lid, onderdeel a][ref1], of [7a, eerste lid, onderdeel a, van de Participatiewet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel7a
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: 7a
  - number: 3.2.d
    text: |-
      personen als bedoeld in de [artikelen 38b, eerste en tweede lid][ref1], of
      [38f, vijfde lid, van de Wet financiering sociale verzekeringen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel38b
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel38f
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: 38b
      - id: ref2
        bwb_id: BWBR0017745
        artikel: 38f
  - number: '4.1'
    text: |-
      De minister kan op aanvraag voor de duur van maximaal 40 weken, gelegen binnen een periode van 52 weken, subsidie
      verstrekken aan een erkend leerbedrijf voor een student voor scholing via praktijkleren in het mbo in de derde
      leerweg, waaraan een praktijkovereenkomst ten grondslag ligt.
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel4
  - number: '4.2'
    text: De periode van 52 weken vangt aan vanaf de startdatum van de praktijkovereenkomst.
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel4
  - number: '4.3'
    text: |-
      Een aanvraag kan worden ingediend voor afronding van de praktijkplaats, als bedoeld in
      [artikel 9, tweede lid][ref1]. Als er sprake is van een volgend aanvraagtijdvak, kan in dat volgende
      aanvraagtijdvak een aanvraag worden ingediend voor het resterende deel van de praktijkplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0046007#Artikel9
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0046007
        artikel: '9'
        paragraaf: '2'
  - number: '5'
    text: |-
      Subsidie op grond van [artikel 4][ref1] wordt slechts verstrekt indien:


      [ref1]: https://wetten.overheid.nl/BWBR0046007#Artikel4
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0046007
        artikel: '4'
        paragraaf: '1'
  - number: 5.a
    text: |-
      de student scholing via praktijkleren in het mbo in de derde leerweg heeft gevolgd die voldoet aan de eisen in
      [hoofdstuk 7 van de Wet educatie en beroepsonderwijs][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        hoofdstuk: '7'
  - number: 5.b
    text: |-
      de verzorging van het onderricht in de praktijk van het beroep voor de student door het erkende leerbedrijf heeft
      plaatsgevonden op grond van en overeenkomstig een praktijkovereenkomst;
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel5
  - number: 5.c
    text: het erkende leerbedrijf beschikt over een aanwezigheidsadministratie voor de student bij de beroepspraktijkvorming;
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel5
  - number: 5.d
    text: |-
      het erkende leerbedrijf beschikt over een administratie waaruit de begeleiding van de student in het kader van de
      beroepspraktijkvorming blijkt;
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel5
  - number: 5.e
    text: |-
      de praktijkplaats is gestart op of na 1 augustus 2023, indien de subsidie wordt verstrekt voor een praktijkplaats
      voor een persoon die betaalde arbeid verricht, als bedoeld in [artikel 3, tweede lid, onderdeel a][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0046007#Artikel3
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0046007
        artikel: '3'
        paragraaf: '1'
  - number: 5.f
    text: 'de volgende gegevens aan de Minister zijn geleverd:'
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel5
  - number: 5.f.1°
    text: |-
      het persoonsgebonden nummer, bedoeld in
      [artikel 8, eerste lid, onder a, van de Wet register onderwijsdeelnemers][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0042012#Artikel8
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0042012
        artikel: '8'
  - number: 5.f.2°
    text: |-
      de basisgegevens, bedoeld in [artikel 10, eerste lid, van die wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0042012#Artikel10
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0042012
        artikel: '10'
  - number: '6'
    text: 'Een subsidieaanvraag kan bij de minister worden ingediend in de volgende tijdvakken:'
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel6
  - number: 6.a
    text: van 3 januari 2022, 09:00 uur, tot en met 31 januari 2022, 17:00 uur;
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel6
  - number: 6.b
    text: van 1 juni 2022, 09:00 uur, tot en met 30 juni 2022, 17:00 uur;
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel6
  - number: 6.c
    text: van 1 december 2022, 09:00 uur, tot en met 13 januari 2023, 17:00 uur;
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel6
  - number: 6.d
    text: van 1 juni 2023, 09:00 uur, tot en met 30 juni 2023, 17:00 uur;
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel6
  - number: 6.e
    text: van 1 december 2023, 09:00 uur, tot en met 12 januari 2024, 17:00 uur;
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel6
  - number: 6.f
    text: van 4 november 2024, 09:00 uur, tot en met 29 november 2024, 17:00 uur; en
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel6
  - number: 6.g
    text: van 3 november 2025, 09:00 uur, tot en met 28 november 2025, 17:00 uur.
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel6
  - number: '7'
    text: 'Het subsidieplafond bedraagt:'
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel7
  - number: 7.a
    text: € 4.500.000 voor het eerste aanvraagtijdvak;
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel7
  - number: 7.b
    text: € 7.500.000 voor het tweede aanvraagtijdvak;
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel7
  - number: 7.c
    text: € 4.500.000 voor het derde aanvraagtijdvak;
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel7
  - number: 7.d
    text: € 4.500.000 voor het vierde aanvraagtijdvak;
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel7
  - number: 7.e
    text: € 4.500.000 voor het vijfde aanvraagtijdvak;
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel7
  - number: 7.f
    text: € 4.000.000 voor het zesde aanvraagtijdvak;
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel7
  - number: 7.g
    text: € 2.800.000 voor het zevende aanvraagtijdvak.
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel7
  - number: '8'
    text: |-
      De subsidie betreft een tegemoetkoming voor de door het erkende leerbedrijf gerealiseerde praktijkplaats inzake
      scholing via praktijkleren in het mbo in de derde leerweg, naar rato van het aantal weken dat de student bij de
      beroepspraktijkvorming aanwezig is geweest. Het subsidiebedrag per gerealiseerde praktijkplaats wordt berekend aan
      de hand van het beschikbare budget voor het desbetreffende aanvraagtijdvak gedeeld door het aantal gerealiseerde
      praktijkplaatsen dat in aanmerking komt voor subsidie in dat aanvraagtijdvak, met een maximum van € 2.700 per
      gerealiseerde praktijkplaats.
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel8
  - number: '9.1'
    text: |-
      Een subsidieaanvraag wordt ingediend binnen een jaar na afronding van de gerealiseerde praktijkplaats, waarvoor
      subsidie wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel9
  - number: '9.2'
    text: |-
      Een praktijkplaats wordt als afgerond beschouwd na het einde van de beroepspraktijkvorming, als bedoeld in
      [artikel 7.2.8, eerste lid, van de Wet educatie en beroepsonderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: '9.3'
    text: |-
      Indien een aanvraag wordt ingediend voor afronding van de praktijkplaats, dan ziet de aanvraag op het deel van de
      praktijkplaats dat is gerealiseerd voor indiening van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel9
  - number: '9.4'
    text: |-
      In geval het indienen van een subsidieaanvraag op of kort voor de sluitingsdatum van een aanvraagronde langere
      tijd niet mogelijk is aan de kant van het elektronisch loket, bedoeld in [artikel 10, eerste lid][ref1],
      kan de minister met inachtneming van een redelijke termijn een nieuw tijdstip voor uiterste indiening van een
      subsidieaanvraag bepalen. De minister maakt dit tijdstip bekend op [www.rvo.nl](http://www.rvo.nl).


      [ref1]: https://wetten.overheid.nl/BWBR0046007#Artikel10
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0046007
        artikel: '10'
        paragraaf: '2'
  - number: '9.5'
    text: |-
      Alleen volledige subsidieaanvragen worden in behandeling genomen. Indien een subsidieaanvraag onvolledig is en
      de aanvrager op grond van [artikel 4:5 van de Algemene wet bestuursrecht][ref1] in de gelegenheid is gesteld zijn
      subsidieaanvraag aan te vullen, geldt als datum van ontvangst de datum waarop de volledige aanvraag is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '10.1'
    text: |-
      De subsidieaanvrager dient de subsidieaanvraag in door middel van een elektronisch aanvraagformulier via de website
      [www.rvo.nl/derde-leerweg](http://www.rvo.nl/derde-leerweg) getekend door een functionaris, bevoegd om namens de
      subsidieaanvrager te handelen.
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel10
  - number: '10.2'
    text: |-
      De subsidieaanvrager voegt bij de subsidieaanvraag per gerealiseerde praktijkplaats toe een praktijkovereenkomst,
      een aanwezigheidsadministratie en een administratie waaruit de begeleiding van de student in het kader van de
      beroepspraktijkvorming blijkt.
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel10
  - number: '10.3'
    text: |-
      Als de subsidieaanvrager voor dezelfde gerealiseerde praktijkplaats ook subsidie ontvangt op basis van
      [titel 3.20 van de Regeling nationale EZK- en LNV-subsidies][ref1], vermeldt de subsidieaanvrager dat bij de
      subsidieaanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0035474
  - number: '10.4'
    text: |-
      Door het indienen van een subsidieaanvraag stemt de subsidieaanvrager ermee in dat het subsidiedossier, met
      uitzondering van persoonsgegevens, openbaar wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel10
  - number: '11'
    text: |-
      Onverminderd [artikel 4:35 van de Algemene wet bestuursrecht][ref1] kan de subsidie in ieder geval geheel of
      gedeeltelijk worden geweigerd, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 11.a
    text: de subsidieaanvraag niet voldoet aan de bij deze regeling gestelde eisen;
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel11
  - number: 11.b
    text: |-
      subsidie is of wordt verleend op basis van [titel 3.20 van de Regeling nationale EZK- en LNV-subsidies][ref1],
      voor dezelfde student en zelfde opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0035474
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0035474
  - number: '12'
    text: |-
      De minister beslist binnen 13 weken na sluiting van het aanvraagtijdvak op aanvragen voor het betreffende
      aanvraagtijdvak.
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel12
  - number: '13'
    text: |-
      Aan de verstrekking van de subsidie is de verplichting verbonden dat de subsidieontvanger de documenten, bedoeld in
      [artikel 5][ref1], gedurende vijf jaren bewaart na datum van het vaststellingsbesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0046007#Artikel5
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0046007
        artikel: '5'
        paragraaf: '1'
  - number: '14.1'
    text: 'Aan de directeur-generaal RVO wordt mandaat verleend tot:'
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel14
  - number: 14.1.a
    text: het voorbereiden en nemen van besluiten namens de Minister op grond van deze regeling;
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel14
  - number: 14.1.b
    text: |-
      het nemen van besluiten namens de Minister op grond van de [Wet open overheid][ref1] over informatie die verband
      houdt met deze regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0045754
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0045754
  - number: 14.1.c
    text: het beslissen op bezwaarschriften tegen besluiten als bedoeld in de onderdelen a en b; en
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel14
  - number: 14.1.d
    text: |-
      het in rechte op te treden en tegen rechterlijke uitspraken hoger beroep in te stellen, dan wel af te zien van
      hoger beroep.
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel14
  - number: '14.2'
    text: |-
      De directeur-generaal RVO kan met betrekking tot zijn bevoegdheden, bedoeld in het eerste lid, ondermandaat
      verlenen aan één of meer onder hem ressorterende medewerkers.
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel14
  - number: '15.1'
    text: |-
      De minister is verwerkingsverantwoordelijke als bedoeld in
      [artikel 4 van de Algemene verordening gegevensbescherming][ref1] voor de verwerking van persoonsgegevens op basis
      van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Artikel4
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0040940
        artikel: '4'
  - number: '15.2'
    text: |-
      RVO is verwerker voor de verwerking van persoonsgegevens ter uitvoering van de gemandateerde taken, bedoeld in
      [artikel 14][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0046007#Artikel14
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0046007
        artikel: '14'
        paragraaf: '4'
  - number: '15.3'
    text: |-
      De persoonsgegevens die verwerkt worden ter uitvoering van deze regeling worden niet verder verwerkt voor
      andere doeleinden, met uitzondering van de persoonsgegevens die noodzakelijk zijn voor het uitvoeren van de
      [Subsidieregeling groepshulpen kinderopvang][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0049599
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0049599
  - number: '16'
    text: |-
      Onverminderd het toezicht door de Inspectie van het onderwijs worden de ambtenaren die een aanstelling hebben
      bij het Ministerie van Economische Zaken en Klimaat, voor zover zij werkzaamheden verrichten ten behoeve van de
      uitvoering van deze regeling, belast met het toezicht op de naleving van deze regeling.
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel16
  - number: '17.1'
    text: De minister draagt zorg voor de evaluatie van de doeltreffendheid en doelmatigheid van deze regeling.
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel17
  - number: '17.2'
    text: |-
      De subsidieaanvrager werkt mee aan door of namens de minister ingesteld onderzoek dat erop is gericht de minister
      inlichtingen te verschaffen die van belang zijn voor de evaluatie van de doeltreffendheid en doelmatigheid van deze
      regeling en de ontwikkeling van het beleid van de minister. De subsidieaanvrager verstrekt in dat kader de daartoe
      benodigde inlichtingen, gegevens en bescheiden, niet zijnde persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel17
  - number: '18.1'
    text: |-
      Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst en vervalt met ingang van 1 april 2026.
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel18
  - number: '18.2'
    text: |-
      In afwijking van het eerste lid blijft deze regeling van toepassing op de afwikkeling van verleende subsidies op
      grond van deze regeling.
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel18
  - number: '19'
    text: 'Deze regeling wordt aangehaald als: Subsidieregeling praktijkleren in de derde leerweg.'
    url: https://wetten.overheid.nl/BWBR0046007/2026-01-01#Artikel19
