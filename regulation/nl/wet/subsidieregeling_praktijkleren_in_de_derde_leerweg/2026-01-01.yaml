articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *eerste aanvraagtijdvak:* het tijdvak, bedoeld in
      [artikel 6, eerste lid, onderdeel a][ref1];
        - *tweede aanvraagtijdvak:* het tijdvak, bedoeld in [artikel 6, eerste lid, onderdeel b][ref2];
        - *derde aanvraagtijdvak:* het tijdvak, bedoeld in [artikel 6, eerste lid, onderdeel c][ref3];
        - *vierde aanvraagtijdvak:* het tijdvak, bedoeld in [artikel 6, eerste lid, onderdeel d][ref4];
        - *vijfde aanvraagtijdvak:* het tijdvak, bedoeld in [artikel 6, eerste lid, onderdeel e][ref5];
        - *zesde aanvraagtijdvak:* het tijdvak, bedoeld in [artikel 6, eerste lid, onderdeel f][ref6];
        - *zevende aanvraagtijdvak:* het tijdvak, bedoeld in [artikel 6, eerste lid, onderdeel g][ref7];
        - *erkend leerbedrijf:* een bedrijf of organisatie als bedoeld in
      [artikel 1.5.3, tweede lid, van de Wet educatie en beroepsonderwijs][ref8], dat zorg draagt voor het onderricht in
      de praktijk van het beroep van de student;
        - *gerealiseerde praktijkplaats:* het aantal weken dat tijdens de praktijkplaats, binnen een periode van 52
      aaneengesloten weken, daadwerkelijk onderricht in de praktijk van het beroep plaats vindt, voor de duur van
      maximaal 40 weken;
        - *minister:* de Minister van Sociale Zaken en Werkgelegenheid;
        - *onderwijsinstellingen in het mbo:* een instelling als bedoeld in [artikel 1.1.1][ref9], of
      [artikel 1.4.1, eerste lid, van de Wet educatie en beroepsonderwijs][ref10];
        - *praktijkplaats:* praktijkplaats als bedoeld in [artikel 7.2.9 van de Wet educatie en beroepsonderwijs][ref11];
        - *praktijkovereenkomst:* schriftelijke overeenkomst als bedoeld in
      [artikel 7.2.8, tweede lid, van de Wet educatie en beroepsonderwijs][ref12];
        - *RVO:* Rijksdienst voor Ondernemend Nederland van het Ministerie van Economische Zaken en Klimaat;
        - *scholing via praktijkleren in het mbo in de derde leerweg:* een beroepsopleiding in de derde leerweg als
      bedoeld in [artikel 1.4.1, lid 1a, van de Wet educatie en beroepsonderwijs][ref13], waarbij sprake is van
      beroepspraktijkvorming waarvoor een erkend leerbedrijf een praktijkplaats realiseert, gericht op het behalen van
      een diploma als bedoeld in [artikel 7.4.6 van de Wet educatie en beroepsonderwijs][ref14], een certificaat als
      bedoeld in [artikel 7.2.3 van de Wet educatie en beroepsonderwijs][ref15], of een mbo-verklaring als bedoeld in
      [artikel 7.4.6a van de Wet educatie en beroepsonderwijs][ref16];
        - *subsidieaanvrager:* een voor de opleiding erkend leerbedrijf die een subsidie aanvraagt op grond van deze
      regeling;
        - *Wet SUWI:* [Wet structuur uitvoeringsorganisatie werk en inkomen][ref17].


