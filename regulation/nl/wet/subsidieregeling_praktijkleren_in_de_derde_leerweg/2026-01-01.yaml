  - number: '2'
    text: |-
      Op het aanvragen en verstrekken van subsidie op grond van deze regeling is de
      [Kaderregeling subsidies OCW, SZW en VWS][ref1], met uitzondering van de [artikelen 3.1.][ref2], [7.1.][ref3] en
      [7.2.][ref4], van toepassing.


