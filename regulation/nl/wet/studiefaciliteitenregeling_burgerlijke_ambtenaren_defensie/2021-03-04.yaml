  text: |-
    Gelet op artikel 94a van het Burgerlijk ambtenarenreglement defensie

    Besluit:
  url: https://wetten.overheid.nl/BWBR0043998/2021-03-04#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *‘de ambtenaar’:* degene bedoeld in [artikel 1 van het Burgerlijk ambtenarenreglement defensie][ref1];
        - *‘studiefaciliteiten’:* a. studieverlof als bedoeld in [artikel 3][ref2]; b. tegemoetkoming in studiekosten als
      bedoeld in [artikel 4][ref3];
        - *‘het hoofd defensieonderdeel’:* het hoofd defensieonderdeel als bedoeld in
      [artikel 3, eerste lid, onderdeel b, van het Burgerlijk ambtenarenreglement defensie][ref4].
        - *‘ontslag’:* elke beëindiging van het dienstverband;
        - *‘Uitkering’:* een uitkering op grond van het
      [Besluit Uitkering wegens functioneel leeftijdsontslag burgerlijke ambtenaren defensie][ref5] of een uitkering op
      grond van het [Besluit bovenwettelijke uitkeringen bij werkloosheid voor de sector Defensie][ref6]


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0043998#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0043998#Artikel4
