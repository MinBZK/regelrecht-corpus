  - number: '2'
    text: |-
      1. De ambtenaar die voor studiefaciliteiten in aanmerking wenst te komen dient de aanvraag daartoe in de regel
    url: https://wetten.overheid.nl/BWBR0043998/2021-03-04#Artikel2
    machine_readable:
      untranslatables:
        - construct: "niet in die mate studeert en/of vorderingen maakt"
          reason: "Subjective assessment of study progress cannot be expressed as computable logic"
          legal_text_excerpt: "indien het hoofd defensieonderdeel op grond van de verkregen inlichtingen van oordeel is, dat de ambtenaar niet in die mate studeert en/of vorderingen maakt"
          accepted: false
        - construct: "aannemelijk maakt, dat deze omstandigheid niet aan hem zelf te wijten is"
          reason: "Subjective assessment of fault cannot be expressed as computable logic"
          legal_text_excerpt: "De intrekking geschiedt niet indien de ambtenaar aannemelijk maakt, dat deze omstandigheid niet aan hem zelf te wijten is"
          accepted: false
      execution:
          parameters:
            - name: aanvraag_datum
              type: date
              description: "Datum waarop de aanvraag voor studiefaciliteiten wordt ingediend"
            - name: studie_start_datum
              type: date
              description: "Datum waarop de studie start"
            - name: normaal_studieduur_jaren
              type: number
              description: "Normale duur van de studie in jaren"
            - name: studie_adviezen_op_verzoek_ambtenaar
              type: boolean
              description: "Indien waar, zijn de adviezen ingewonnen op uitdrukkelijk verzoek van de ambtenaar"
            - name: heeft_recht_op_bezoldigingsverhoging
              type: boolean
              description: "Indien waar, heeft de ambtenaar recht op bezoldigingsverhoging uitsluitend op grond van het voltooien van de studie"
            - name: termijn_verlengd
              type: boolean
              description: "Indien waar, is de termijn voor studiefaciliteiten verlengd door het hoofd defensieonderdeel"
          input:
            - name: hoofd_defensieonderdeel
              type: object
              description: "Referentie naar het hoofd defensieonderdeel als bedoeld in BWBR0006040, Artikel 3"
              source:
                regulation: BWBR0006040
                output: hoofd_defensieonderdeel
          output:
            - name: aanvraag_valide
              type: boolean
              description: "Indien waar, is de aanvraag valide (ingediend voor de start van de studie)"
            - name: adviezen_kosten_voor_rekening_mindef
              type: boolean
              description: "Indien waar, kommen de kosten van de adviezen voor rekening van het Ministerie van Defensie"
            - name: studiefaciliteiten_verleend
              type: boolean
              description: "Indien waar, zijn studiefaciliteiten verleend"
            - name: studiefaciliteiten_termijn
              type: number
              description: "De termijn waarvoor studiefaciliteiten worden verleend (in jaren)"
            - name: studiefaciliteiten_uitgesloten
              type: boolean
              description: "Indien waar, zijn studiefaciliteiten uitgesloten op grond van lid 5"
          actions:
            - output: aanvraag_valide
              value:
                operation: LESS_THAN_OR_EQUAL
                subject: $aanvraag_datum
                value: $studie_start_datum
            - output: adviezen_kosten_voor_rekening_mindef
              value:
                operation: NOT
                value:
                  operation: EQUALS
                  subject: $studie_adviezen_op_verzoek_ambtenaar
                  value: true
            - output: studiefaciliteiten_termijn
              value:
                operation: IF
                cases:
                  - when:
                      operation: EQUALS
                      subject: $termijn_verlengd
                      value: true
                    then:
                      operation: ADD
                      values:
                        - $normaal_studieduur_jaren
                        - 1
                default: $normaal_studieduur_jaren
            - output: studiefaciliteiten_verleend
              value:
                operation: AND
                conditions:
                  - operation: EQUALS
                    subject: $aanvraag_valide
                    value: true
                  - operation: EQUALS
                    subject: $studiefaciliteiten_uitgesloten
                    value: false
            - output: studiefaciliteiten_uitgesloten
              value:
                operation: EQUALS
                subject: $heeft_recht_op_bezoldigingsverhoging
                value: true
  - number: '3'
    text: |-
      1. Tenzij het belang van een goede dienstuitoefening zich daartegen verzet, kan door het hoofd defensieonderdeel
      aan de ambtenaar studieverlof worden verleend voor ten hoogste een halve dag per week, met dien verstande dat
      indien lessen in de normale diensturen moeten worden gevolgd, het verlof tot maximaal één dag per week kan worden
      verleend.

      2. Onverminderd het bepaalde in het eerste lid kan studieverlof worden verleend op de dag, waarop wordt deelgenomen
      aan een examen of een tentamen, dat aan het einde van de studie is gelegen dan wel volgt op een duidelijk afgerond
      onderdeel van de studie.

      3. Ter voorbereiding op een examen en tentamen als bovenbedoeld kan bovendien studieverlof worden verleend voor ten
      hoogste vijf halve dagen per jaar.
    url: https://wetten.overheid.nl/BWBR0043998/2021-03-04#Artikel3
  - number: '4'
    text: |-
      1. Voor volledige tegemoetkoming komen in aanmerking:

      a. indien de studie in een andere plaats dan de woon- of standplaats gevolgd moet worden, de noodzakelijke
      gemaakte reiskosten voor interlokaal vervoer en het daarmede in samenhang optredende vervoer in de plaats
      waar de cursus of het examen wordt gehouden, op basis van het laagste tarief van het gebezigde middel
      van openbaar vervoer, waarvan redelijkerwijs gebruik gemaakt kan worden, voor zover de ambtenaar voor
      deze kosten niet uit anderen hoofde een vergoeding geniet; kan van openbaar vervoer redelijkerwijs geen
      gebruik gemaakt worden dan worden de noodzakelijk gemaakte kosten vergoed tegen het tarief, genoemd in de
      [bijlage B, tabel 1B, van de Regeling dienstreizen defensie][ref1];

      b. de werkelijk gemaakte kosten, welke in verband met het afleggen van een examen noodzakelijkerwijze
      worden gemaakt voor nachtverblijf en het gebruik van maaltijden, overeenkomstig het bepaalde in
      [artikel 12, eerste lid, onderdeel a, ten tweede][ref2], juncto artikel 12, vierde lid en zevende lid, onderdeel a,
      van de Regeling dienstreizen defensie.

      2. Voor een tegemoetkoming tot maximaal 50% komen in aanmerking de noodzakelijk gemaakte cursussen lesgelden, de
      examen- en diplomakosten, alsmede de aanschaffingskosten van het verplicht gestelde studiemateriaal.

      3. Bij het volgen van een studie in het kader van de bevordering van de externe werkzekerheid van de ambtenaar
      wordt het in het vorige lid genoemde percentage op 100 gesteld.

      4. Een tegemoetkoming in studiekosten wordt eerst verleend nadat de ambtenaar schriftelijk heeft verklaard dat hij
      bekend is met de verplichting tot gehele of gedeeltelijke terugbetaling als bedoeld in [artikel 5][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0039787
      [ref2]: https://wetten.overheid.nl/BWBR0039787#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0043998#Artikel5
    url: https://wetten.overheid.nl/BWBR0043998/2021-03-04#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0039787
      - id: ref2
        bwb_id: BWBR0039787
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0043998
        artikel: '5'
  - number: 4a
    text: |-
      De kosten van een opleiding als bedoeld in [artikel 20 van het BARD][ref1] worden vergoed:

      a. tot ten hoogste € 500,– in het geval van een diensttijd als ambtenaar bij Defensie van minimaal 2 jaar en
      maximaal 3 jaar;

      b. tot ten hoogste € 1.000,– in het geval van een diensttijd als ambtenaar bij Defensie van minimaal 3 jaar en
      maximaal 4 jaar;

      c. tot ten hoogste € 1.500,– in het geval van een diensttijd als ambtenaar bij Defensie van minimaal 4 jaar en
      maximaal 5 jaar;

      d. tot ten hoogste € 2.000,– in het geval van een diensttijd als ambtenaar bij Defensie van minimaal 5 jaar en
      maximaal 6 jaar;

      e. tot ten hoogste € 2.500,– in het geval van een diensttijd als ambtenaar bij Defensie van minimaal 6 jaar en
      maximaal 7 jaar;

      f. tot ten hoogste € 3.000,– in het geval van een diensttijd als ambtenaar bij Defensie van minimaal 7 jaar en
      maximaal 8 jaar;

      g. tot ten hoogste € 3.500,– in het geval van een diensttijd als ambtenaar bij Defensie van minimaal 8 jaar en
      maximaal 9 jaar;

      h. tot ten hoogste € 4.000,– in het geval van een diensttijd als ambtenaar bij Defensie van minimaal 9 jaar of
      meer.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel20
    url: https://wetten.overheid.nl/BWBR0043998/2021-03-04#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '20'
  - number: 4b
    text: |-
      De kosten bedoeld in [artikel 20 van het BARD][ref1], die voor vergoeding in aanmerking komen, zijn, voor zover zij
      niet rechtstreeks voor rekening komen van of rechtstreeks worden betaald door het ministerie van defensie:

      a. inschrijvings-, les-, college-, practicum-, examen-, en diplomagelden, met uitzondering van kosten verbonden aan
      het volgen van praktisch vliegonderricht;

      b. studieboeken en studiemateriaal, voor zover direct gerelateerd aan de opleiding;

      c. excursie, reis- en verblijfkosten op grond van het Besluit dienstreizen defensie. Eventuele tegemoetkomingen van
      derden worden hierop in mindering gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel20
    url: https://wetten.overheid.nl/BWBR0043998/2021-03-04#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '20'
  - number: '5'
    text: |-
      1. De ambtenaar is verplicht tot terugbetaling van de aan hem verleende tegemoetkoming in de studiekosten ingeval
      de studie niet met goed gevolg is afgesloten op grond van omstandigheden die naar het oordeel van het hoofd
      defensieonderdeel aan de ambtenaar te wijten zijn.

      2. De in het eerste lid bedoelde verplichting tot terugbetaling wordt beperkt tot het bedrag, dat de ambtenaar is
      uitbetaald in het tijdvak van drie jaren, voorafgaande aan de datum, waarop de omstandigheid zich heeft voorgedaan.

      3. De in het eerste lid bedoelde verplichting geldt niet ingeval het ontslag geschiedt met recht op uitkering of
      direct ingaand pensioen.
    url: https://wetten.overheid.nl/BWBR0043998/2021-03-04#Artikel5
  - number: '6'
    text: In bijzondere gevallen kan het hoofd defensieonderdeel afwijken van het bepaalde in de vorige artikelen.
    url: https://wetten.overheid.nl/BWBR0043998/2021-03-04#Artikel6
  - number: '7'
    text: De regeling treedt in werking met ingang van 1 april 1994.
    url: https://wetten.overheid.nl/BWBR0043998/2021-03-04#Artikel7
  - number: '8'
    text: 'Deze regeling wordt aangehaald als: *Studiefaciliteitenregeling burgerlijke ambtenaren defensie*.'
    url: https://wetten.overheid.nl/BWBR0043998/2021-03-04#Artikel8
