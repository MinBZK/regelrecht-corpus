  - number: '2.1'
    text: |-
      De ambtenaar die voor studiefaciliteiten in aanmerking wenst te komen dient de aanvraag daartoe in de regel in
      voor de aanvang van de studie. Hij laat deze aanvraag vergezeld gaan van de voor de beoordeling door het hoofd
      defensieonderdeel noodzakelijke gegevens en van een schatting van de te maken studiekosten.
    url: https://wetten.overheid.nl/BWBR0043998/2020-01-01#Artikel2
  - number: '2.2'
    text: |-
      Het hoofd defensieonderdeel kan, alvorens studiefaciliteiten te verlenen, een studieadvies of in bijzondere
      gevallen – na overleg met de ambtenaar – een psychologisch advies inwinnen. Tenzij deze adviezen worden ingewonnen
      op uitdrukkelijk verzoek van de ambtenaar, komen de daaraan verbonden kosten voor rekening van het Ministerie van
      Defensie.
    url: https://wetten.overheid.nl/BWBR0043998/2020-01-01#Artikel2
  - number: '2.3'
    text: |-
      Studiefaciliteiten worden verleend voor een bepaalde termijn, die wordt afgeleid van de normaal te achten duur van
      de studie. Het hoofd defensieonderdeel kan deze termijn verlengen.
    url: https://wetten.overheid.nl/BWBR0043998/2020-01-01#Artikel2
  - number: '2.4'
    text: |-
      Verleende studiefaciliteiten kunnen – al dan niet tijdelijk – worden ingetrokken indien het hoofd defensieonderdeel
      op grond van de verkregen inlichtingen van oordeel is, dat de ambtenaar niet in die mate studeert en/of vorderingen
      maakt dat hij in staat kan worden geacht de studie binnen de in het derde lid bedoelde termijn te voltooien. De
      intrekking geschiedt niet indien de ambtenaar aannemelijk maakt, dat deze omstandigheid niet aan hem zelf te wijten
      is.
    url: https://wetten.overheid.nl/BWBR0043998/2020-01-01#Artikel2
  - number: '2.5'
    text: |-
      Aan de ambtenaar, die krachtens een op hem van toepassing zijnde regeling aanspraak heeft op een verhoging van
      zijn bezoldiging uitsluitend op grond van het voltooien van een studie, worden ter zake van die studie geen
      studiefaciliteiten verleend.
    url: https://wetten.overheid.nl/BWBR0043998/2020-01-01#Artikel2
  - number: '3.1'
    text: |-
      Tenzij het belang van een goede dienstuitoefening zich daartegen verzet, kan door het hoofd defensieonderdeel
      aan de ambtenaar studieverlof worden verleend voor ten hoogste een halve dag per week, met dien verstande dat
      indien lessen in de normale diensturen moeten worden gevolgd, het verlof tot maximaal één dag per week kan worden
      verleend.
    url: https://wetten.overheid.nl/BWBR0043998/2020-01-01#Artikel3
  - number: '3.2'
    text: |-
      Onverminderd het bepaalde in het eerste lid kan studieverlof worden verleend op de dag, waarop wordt deelgenomen
      aan een examen of een tentamen, dat aan het einde van de studie is gelegen dan wel volgt op een duidelijk afgerond
      onderdeel van de studie.
    url: https://wetten.overheid.nl/BWBR0043998/2020-01-01#Artikel3
  - number: '3.3'
    text: |-
      Ter voorbereiding op een examen en tentamen als bovenbedoeld kan bovendien studieverlof worden verleend voor ten
      hoogste vijf halve dagen per jaar.
    url: https://wetten.overheid.nl/BWBR0043998/2020-01-01#Artikel3
  - number: '4.1'
    text: 'Voor volledige tegemoetkoming komen in aanmerking:'
    url: https://wetten.overheid.nl/BWBR0043998/2020-01-01#Artikel4
  - number: 4.1.a
    text: |-
      indien de studie in een andere plaats dan de woon- of standplaats gevolgd moet worden, de noodzakelijke
      gemaakte reiskosten voor interlokaal vervoer en het daarmede in samenhang optredende vervoer in de plaats
      waar de cursus of het examen wordt gehouden, op basis van het laagste tarief van het gebezigde middel
      van openbaar vervoer, waarvan redelijkerwijs gebruik gemaakt kan worden, voor zover de ambtenaar voor
      deze kosten niet uit anderen hoofde een vergoeding geniet; kan van openbaar vervoer redelijkerwijs geen
      gebruik gemaakt worden dan worden de noodzakelijk gemaakte kosten vergoed tegen het tarief, genoemd in de
      [bijlage B, tabel 1B, van de Regeling dienstreizen defensie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0039787
    url: https://wetten.overheid.nl/BWBR0043998/2020-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0039787
  - number: 4.1.b
    text: |-
      de werkelijk gemaakte kosten, welke in verband met het afleggen van een examen noodzakelijkerwijze
      worden gemaakt voor nachtverblijf en het gebruik van maaltijden, overeenkomstig het bepaalde in
      [artikel 12, eerste lid, onderdeel a, ten tweede][ref1], juncto artikel 12, vierde lid en zevende lid, onderdeel a,
      van de Regeling dienstreizen defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0039787#Artikel12
    url: https://wetten.overheid.nl/BWBR0043998/2020-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0039787
        artikel: '12'
  - number: '4.2'
    text: |-
      Voor een tegemoetkoming tot maximaal 50% komen in aanmerking de noodzakelijk gemaakte cursussen lesgelden, de
      examen- en diplomakosten, alsmede de aanschaffingskosten van het verplicht gestelde studiemateriaal.
    url: https://wetten.overheid.nl/BWBR0043998/2020-01-01#Artikel4
  - number: '4.3'
    text: |-
      Bij het volgen van een studie in het kader van de bevordering van de externe werkzekerheid van de ambtenaar wordt
      het in het vorige lid genoemde percentage op 100 gesteld.
    url: https://wetten.overheid.nl/BWBR0043998/2020-01-01#Artikel4
  - number: '4.4'
    text: |-
      Een tegemoetkoming in studiekosten wordt eerst verleend nadat de ambtenaar schriftelijk heeft verklaard dat hij
      bekend is met de verplichting tot gehele of gedeeltelijke terugbetaling als bedoeld in [artikel 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0043998#Artikel5
    url: https://wetten.overheid.nl/BWBR0043998/2020-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0043998
        artikel: '5'
  - number: '5.1'
    text: |-
      De ambtenaar is verplicht tot terugbetaling van de aan hem verleende tegemoetkoming in de studiekosten ingeval
      de studie niet met goed gevolg is afgesloten op grond van omstandigheden die naar het oordeel van het hoofd
      defensieonderdeel aan de ambtenaar te wijten zijn.
    url: https://wetten.overheid.nl/BWBR0043998/2020-01-01#Artikel5
  - number: '5.2'
    text: |-
      De in het eerste lid bedoelde verplichting tot terugbetaling wordt beperkt tot het bedrag, dat de ambtenaar is
      uitbetaald in het tijdvak van drie jaren, voorafgaande aan de datum, waarop de omstandigheid zich heeft voorgedaan.
    url: https://wetten.overheid.nl/BWBR0043998/2020-01-01#Artikel5
  - number: '5.3'
    text: |-
      De in het eerste lid bedoelde verplichting geldt niet ingeval het ontslag geschiedt met recht op uitkering of
      direct ingaand pensioen.
    url: https://wetten.overheid.nl/BWBR0043998/2020-01-01#Artikel5
  - number: '6'
    text: In bijzondere gevallen kan het hoofd defensieonderdeel afwijken van het bepaalde in de vorige artikelen.
    url: https://wetten.overheid.nl/BWBR0043998/2020-01-01#Artikel6
  - number: '7'
    text: De regeling treedt in werking met ingang van 1 april 1994.
    url: https://wetten.overheid.nl/BWBR0043998/2020-01-01#Artikel7
  - number: '8'
    text: 'Deze regeling wordt aangehaald als: *Studiefaciliteitenregeling burgerlijke ambtenaren defensie*.'
    url: https://wetten.overheid.nl/BWBR0043998/2020-01-01#Artikel8
