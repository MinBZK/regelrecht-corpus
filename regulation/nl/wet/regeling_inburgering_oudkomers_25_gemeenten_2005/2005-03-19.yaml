  - number: '2'
    text: |-
      Doel van de regeling is:

      a. te bevorderen dat oudkomers die in een maatschappelijke achterstandssituatie verkeren, waaronder in het
      bijzonder diegenen die behoren tot de groep werklozen, opvoeders of geestelijke bedienaren, deelnemen aan een
      traject en dit traject afronden teneinde hun maatschappelijke positie te verbeteren; en

      b. te bevorderen dat gemeenten aan oudkomers een traject aanbieden.
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel2
  - number: '3'
    text: |-
      1 De Minister verleent het gemeentebestuur een bijdrage voor het in 2005 aanbieden van trajecten aan oudkomers,
      indien het gemeentebestuur binnen zes weken na inwerkingtreding van deze regeling bij de Minister een aanvraag
      indient en de Minister deze aanvraag goedkeurt.

      2 Een traject wordt slechts in aanmerking genomen bij de vaststelling van de in het eerste lid bedoelde bijdrage
      indien dit traject in 2005 aanvangt en uiterlijk 31 december 2006 is afgerond. Een traject wordt geacht aan te
      vangen op de datum waarop de in [artikel 6][ref1] bedoelde overeenkomst is getekend.

      3 Een aanvraag als bedoeld in het eerste lid bevat de prognose.

      4 De bijdrage, bedoeld in het eerste lid, wordt beschikbaar gesteld onder voorbehoud van autorisatie door de
      begrotingswetgever.


      [ref1]: https://wetten.overheid.nl/BWBR0018100#Artikel6
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel3
