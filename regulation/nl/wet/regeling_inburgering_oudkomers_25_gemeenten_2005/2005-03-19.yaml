  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. Minister: de Minister voor Vreemdelingenzaken en Integratie;

      b. gemeentebestuur: het college van burgemeesters en wethouders van een gemeente, genoemd in de [bijlage][ref1] bij
      deze regeling;

      c. oudkomer:

      1. een persoon die 18 jaar of ouder is, die buiten Nederland is geboren en behoort tot een etnische
      minderheidsgroep, die rechtmatig in Nederland verblijft anders dan voor een tijdelijk doel als bepaald
      bij of krachtens de [Wet inburgering nieuwkomers][ref2], en die niet verplicht is om op grond van de
      [Wet inburgering nieuwkomers][ref3] een inburgeringsprogramma te volgen;

      2. een geestelijke bedienaar als bedoeld in de
      [Regeling aanwijzing bijzondere categorieën vreemdelingen ten behoeve van inburgering][ref4], die niet verplicht
      is om op grond van de [Wet inburgering nieuwkomers][ref5] een inburgeringsprogramma te volgen;

      d. traject: een inburgeringsprogramma dat de oudkomer volgt waarbij het onderdeel Nederlands als tweede taal wordt
      gekoppeld aan onderdelen voor het bereiken van werk, toegang tot beroepsonderwijs, opvoedingsondersteuning of
      sociale activering;

      e. prognose: het aantal oudkomers dat naar de verwachting van het gemeentebestuur een traject zal starten in 2005;

      f. monitor: het door de Minister vastgestelde model-document aan de hand waarvan het gemeentebestuur de Minister
      informatie verschaft over de wijze waarop de gemeente invulling heeft gegeven aan de inburgering van oudkomers en
      de resultaten ervan en aan de hand waarvan de hoogte van de bijdrage over 2005 wordt vastgesteld overeenkomstig
      [artikel 9][ref6].


