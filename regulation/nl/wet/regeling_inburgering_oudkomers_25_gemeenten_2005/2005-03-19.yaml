  - number: '4'
    text: |-
      1 Het in 2005 in te burgeren aantal oudkomers per gemeente, als genoemd in [kolom 4 van de bijlage][ref1], is
      vastgesteld naar evenredigheid van het totaal van de in alle in de [bijlage][ref2] genoemde gemeenten woonachtige
      leden van etnische minderheidsgroepen uit de eerste generatie die behoren tot de groep Niet-westerse allochtonen.

      2 Het normbedrag voor een traject bedraagt € 6.400.

      3 De in de [bijlage][ref3] genoemde indicatieve hoogte van het bedrag per gemeente is het product van het aantal
      oudkomers als genoemd in de [bijlage][ref4] en het in het tweede lid bedoelde normbedrag.

      4 Een traject omvat tenminste 300 contacturen.


