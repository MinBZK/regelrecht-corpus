---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_inburgering_oudkomers_25_gemeenten_2005
regulatory_layer: WET
publication_date: '2008-12-11'
valid_from: '2005-03-19'
bwb_id: BWBR0018100
url: https://wetten.overheid.nl/BWBR0018100/2005-03-19
preamble:
  text: 'Besluit:'
  url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel1
  - number: 1.a
    text: 'Minister: de Minister voor Vreemdelingenzaken en Integratie;'
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel1
  - number: 1.b
    text: |-
      gemeentebestuur: het college van burgemeesters en wethouders van een gemeente, genoemd in de [bijlage][ref1] bij
      deze regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0018100
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018100
  - number: 1.c
    text: 'oudkomer:'
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel1
  - number: 1.c.1
    text: |-
      een persoon die 18 jaar of ouder is, die buiten Nederland is geboren en behoort tot een etnische
      minderheidsgroep, die rechtmatig in Nederland verblijft anders dan voor een tijdelijk doel als bepaald
      bij of krachtens de [Wet inburgering nieuwkomers][ref1], en die niet verplicht is om op grond van de
      [Wet inburgering nieuwkomers][ref2] een inburgeringsprogramma te volgen;


      [ref1]: https://wetten.overheid.nl/BWBR0009544
      [ref2]: https://wetten.overheid.nl/BWBR0009544
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009544
      - id: ref2
        bwb_id: BWBR0009544
  - number: 1.c.2
    text: |-
      een geestelijke bedienaar als bedoeld in de
      [Regeling aanwijzing bijzondere categorieën vreemdelingen ten behoeve van inburgering][ref1], die niet verplicht
      is om op grond van de [Wet inburgering nieuwkomers][ref2] een inburgeringsprogramma te volgen;


      [ref1]: https://wetten.overheid.nl/BWBR0013218
      [ref2]: https://wetten.overheid.nl/BWBR0009544
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013218
      - id: ref2
        bwb_id: BWBR0009544
  - number: 1.d
    text: |-
      traject: een inburgeringsprogramma dat de oudkomer volgt waarbij het onderdeel Nederlands als tweede taal wordt
      gekoppeld aan onderdelen voor het bereiken van werk, toegang tot beroepsonderwijs, opvoedingsondersteuning of
      sociale activering;
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel1
  - number: 1.e
    text: 'prognose: het aantal oudkomers dat naar de verwachting van het gemeentebestuur een traject zal starten in 2005;'
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel1
  - number: 1.f
    text: |-
      monitor: het door de Minister vastgestelde model-document aan de hand waarvan het gemeentebestuur de Minister
      informatie verschaft over de wijze waarop de gemeente invulling heeft gegeven aan de inburgering van oudkomers en
      de resultaten ervan en aan de hand waarvan de hoogte van de bijdrage over 2005 wordt vastgesteld overeenkomstig
      [artikel 9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018100#Artikel9
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018100
        artikel: '9'
        hoofdstuk: '4'
  - number: '2'
    text: 'Doel van de regeling is:'
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel2
  - number: 2.a
    text: |-
      te bevorderen dat oudkomers die in een maatschappelijke achterstandssituatie verkeren, waaronder in het bijzonder
      diegenen die behoren tot de groep werklozen, opvoeders of geestelijke bedienaren, deelnemen aan een traject en dit
      traject afronden teneinde hun maatschappelijke positie te verbeteren; en
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel2
  - number: 2.b
    text: te bevorderen dat gemeenten aan oudkomers een traject aanbieden.
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel2
  - number: '3.1'
    text: |-
      De Minister verleent het gemeentebestuur een bijdrage voor het in 2005 aanbieden van trajecten aan oudkomers,
      indien het gemeentebestuur binnen zes weken na inwerkingtreding van deze regeling bij de Minister een aanvraag
      indient en de Minister deze aanvraag goedkeurt.
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel3
  - number: '3.2'
    text: |-
      Een traject wordt slechts in aanmerking genomen bij de vaststelling van de in het eerste lid bedoelde bijdrage
      indien dit traject in 2005 aanvangt en uiterlijk 31 december 2006 is afgerond. Een traject wordt geacht aan te
      vangen op de datum waarop de in [artikel 6][ref1] bedoelde overeenkomst is getekend.


      [ref1]: https://wetten.overheid.nl/BWBR0018100#Artikel6
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0018100
        artikel: '6'
        hoofdstuk: '3'
  - number: '3.3'
    text: Een aanvraag als bedoeld in het eerste lid bevat de prognose.
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel3
  - number: '3.4'
    text: |-
      De bijdrage, bedoeld in het eerste lid, wordt beschikbaar gesteld onder voorbehoud van autorisatie door de
      begrotingswetgever.
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel3
  - number: '4.1'
    text: |-
      Het in 2005 in te burgeren aantal oudkomers per gemeente, als genoemd in [kolom 4 van de bijlage][ref1], is
      vastgesteld naar evenredigheid van het totaal van de in alle in de [bijlage][ref2] genoemde gemeenten woonachtige
      leden van etnische minderheidsgroepen uit de eerste generatie die behoren tot de groep Niet-westerse allochtonen.


      [ref1]: https://wetten.overheid.nl/BWBR0018100
      [ref2]: https://wetten.overheid.nl/BWBR0018100
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0018100
      - id: ref2
        bwb_id: BWBR0018100
  - number: '4.2'
    text: Het normbedrag voor een traject bedraagt € 6.400.
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel4
  - number: '4.3'
    text: |-
      De in de [bijlage][ref1] genoemde indicatieve hoogte van het bedrag per gemeente is het product van het aantal
      oudkomers als genoemd in de [bijlage][ref2] en het in het tweede lid bedoelde normbedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0018100
      [ref2]: https://wetten.overheid.nl/BWBR0018100
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0018100
      - id: ref2
        bwb_id: BWBR0018100
  - number: '4.4'
    text: Een traject omvat tenminste 300 contacturen.
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel4
  - number: '5.1'
    text: |-
      De Minister verleent het gemeentebestuur de bijdrage, bedoeld in [artikel 3, eerste lid][ref1], bij wijze van een
      voorschot.


      [ref1]: https://wetten.overheid.nl/BWBR0018100#Artikel3
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0018100
        artikel: '3'
        hoofdstuk: '2'
  - number: '5.2'
    text: |-
      Het voorschot is afhankelijk van de prognose en van het bedrag als genoemd in de [bijlage][ref1] en wordt als volgt
      vastgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0018100
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0018100
  - number: 5.2.a
    text: |-
      indien de prognose gelijk is aan het in de [bijlage][ref1] genoemde aantal oudkomers, bedraagt het voorschot het in
      de [bijlage][ref2] genoemde bedrag;


      [ref1]: https://wetten.overheid.nl/BWBR0018100
      [ref2]: https://wetten.overheid.nl/BWBR0018100
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0018100
      - id: ref2
        bwb_id: BWBR0018100
  - number: 5.2.b
    text: |-
      indien de prognose lager is dan het in de [bijlage][ref1] genoemde aantal oudkomers, wordt het in de
      [bijlage][ref2] genoemde bedrag naar evenredigheid verminderd;


      [ref1]: https://wetten.overheid.nl/BWBR0018100
      [ref2]: https://wetten.overheid.nl/BWBR0018100
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0018100
      - id: ref2
        bwb_id: BWBR0018100
  - number: 5.2.c
    text: |-
      indien de prognose hoger is dan het in de [bijlage][ref1] genoemde aantal oudkomers, wordt het in de
      [bijlage][ref2] genoemde bedrag:


      [ref1]: https://wetten.overheid.nl/BWBR0018100
      [ref2]: https://wetten.overheid.nl/BWBR0018100
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0018100
      - id: ref2
        bwb_id: BWBR0018100
  - number: 5.2.c.1°
    text: in het geval het budget toereikend is, naar evenredigheid vermeerderd;
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel5
  - number: 5.2.c.2°
    text: |-
      in het geval het bedrag niet toereikend is, vastgesteld conform dat bedrag vermeerderd met een bedrag. Het
      laatstgenoemde bedrag is afhankelijk van de verdeling van de resterende middelen naar evenredigheid van het aantal
      oudkomers als genoemd in de [bijlage][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018100
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0018100
  - number: '5.3'
    text: De Minister stelt het voorschot binnen acht weken na inwerkingtreding van deze regeling vast.
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel5
  - number: '5.4'
    text: Het voorschot wordt uiterlijk 31 mei 2005 betaald.
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel5
  - number: '6.1'
    text: |-
      Het gemeentebestuur aan wie het voorschot als bedoeld in [artikel 5][ref1] is verleend, sluit een overeenkomst met
      de oudkomer die een traject aanvangt. De overeenkomst bevat tenminste bepalingen met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0018100#Artikel5
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018100
        artikel: '5'
        hoofdstuk: '2'
  - number: 6.1.a
    text: het doel van het traject;
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel6
  - number: 6.1.b
    text: de onderdelen van het traject;
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel6
  - number: 6.1.c
    text: het aantal lesuren van het traject;
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel6
  - number: 6.1.d
    text: de aard en de omvang van de individuele begeleiding;
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel6
  - number: 6.1.e
    text: de verplichtingen van het gemeentebestuur;
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel6
  - number: 6.1.f
    text: de verplichtingen van de oudkomer;
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel6
  - number: 6.1.g
    text: |-
      de informatieoverdracht tussen het gemeentebestuur, de instellingen betrokken bij het aanbieden van het traject en
      de oudkomer over de voortgang van die oudkomer in het traject;
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel6
  - number: 6.1.h
    text: de gevolgen welke zijn verbonden aan niet-nakoming van de overeenkomst door de oudkomer.
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel6
  - number: '6.2'
    text: Het gemeentebestuur sluit op grond van deze regeling met een oudkomer slechts één overeenkomst.
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel6
  - number: '7.1'
    text: |-
      Het gemeentebestuur aan wie het voorschot als bedoeld in [artikel 5][ref1] is verleend, draagt er zorg voor dat
      de oudkomer met wie een overeenkomst als bedoeld in [artikel 6][ref2] is gesloten een begintoets en een eindtoets
      aflegt aan de hand waarvan het niveau Nederlands als tweede taal van de oudkomer wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0018100#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0018100#Artikel6
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0018100
        artikel: '5'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0018100
        artikel: '6'
        hoofdstuk: '3'
  - number: '7.2'
    text: |-
      Voor de begintoets en de eindtoets, bedoeld in het eerste lid, wordt uitsluitend gebruik gemaakt van de hierna
      volgende combinaties van toetsen:
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel7
  - number: 7.2.a
    text: de Intaketoets NT2 als begintoets met de NT2-Profieltoets, NT2-Cat of Itemdito als eindtoets; of
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel7
  - number: 7.2.b
    text: de Intaketoets Alfabetisering NT2 als begintoets met de NT2-Profieltoets Alfabetisering als eindtoets.
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel7
  - number: '8.1'
    text: |-
      Het gemeentebestuur aan wie een voorschot als bedoeld in [artikel 4][ref1] is verleend, verstrekt de Minister de
      informatie over de gegevens die in de monitor worden gevraagd, uiterlijk 1 april 2006 over de periode januari 2005
      tot en met december 2005, en 1 april 2007 over de periode januari 2006 tot en met december 2006.


      [ref1]: https://wetten.overheid.nl/BWBR0018100#Artikel4
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0018100
        artikel: '4'
        hoofdstuk: '2'
  - number: '8.2'
    text: 'In de monitor worden tenminste de volgende prestatiegegevens gevraagd:'
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel8
  - number: 8.2.a
    text: |-
      het aantal oudkomers met wie in 2005 een overeenkomst als bedoeld in [artikel 6][ref1] is gesloten;


      [ref1]: https://wetten.overheid.nl/BWBR0018100#Artikel6
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0018100
        artikel: '6'
        hoofdstuk: '3'
  - number: 8.2.b
    text: het aantal oudkomers dat een traject heeft afgerond;
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel8
  - number: 8.2.c
    text: het aantal oudkomers dat een traject voortijdig heeft beëindigd;
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel8
  - number: 8.2.d
    text: |-
      het niveau Nederlands als tweede taal van de oudkomers, bedoeld in onderdeel b, bij afronding van het traject ten
      opzichte van het niveau Nederlands als tweede taal bij de start van het traject.
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel8
  - number: '8.3'
    text: |-
      De verstrekte informatie als bedoeld in het eerste lid heeft alleen betrekking op trajecten die geheel of
      gedeeltelijk zijn bekostigd door de bijdrage, bedoeld in [artikel 3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018100#Artikel3
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0018100
        artikel: '3'
        hoofdstuk: '2'
  - number: '8.4'
    text: De verstrekte informatie als bedoeld in het eerste lid is voorzien van een accountantsverklaring.
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel8
  - number: '8.5'
    text: |-
      Ten behoeve van de verstrekking van de in het eerste lid bedoelde gegevens stelt de Minister een controleprotocol
      vast.
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel8
  - number: '8.6'
    text: |-
      Het gemeentebestuur draagt er zorg voor dat de door hem ingeschakelde accountant meewerkt aan de door of namens de
      auditdienst van het ministerie van Justitie in te stellen onderzoeken naar de verrichte controlewerkzaamheden door
      die accountant. De daaraan verbonden kosten zijn begrepen in de bijdrage, bedoeld in [artikel 3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018100#Artikel3
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0018100
        artikel: '3'
        hoofdstuk: '2'
  - number: '9.1'
    text: |-
      De Minister stelt de bijdrage vast met behulp van de door het gemeentebestuur op grond van [artikel 8][ref1]
      verstrekte informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0018100#Artikel8
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0018100
        artikel: '8'
        hoofdstuk: '3'
  - number: '9.2'
    text: 'De bijdrage voor een gemeente bedraagt:'
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel9
  - number: 9.2.a
    text: |-
      € 2.667 voor iedere oudkomer met wie een overeenkomst als bedoeld in [artikel 6][ref1] is gesloten; en


      [ref1]: https://wetten.overheid.nl/BWBR0018100#Artikel6
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0018100
        artikel: '6'
        hoofdstuk: '3'
  - number: 9.2.b
    text: |-
      € 5.333 voor iedere oudkomer die, evenals het gemeentebestuur, aan de verplichtingen, genoemd in de overeenkomst,
      bedoeld in [artikel 6][ref1], heeft voldaan en die een begintoets en een eindtoets als bedoeld in [artikel 7][ref2]
      is afgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0018100#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0018100#Artikel7
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0018100
        artikel: '6'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0018100
        artikel: '7'
        hoofdstuk: '3'
  - number: '9.3'
    text: |-
      Het aantal oudkomers dat de Minister bij het vaststellen van de bijdrage betrekt, kan het in het voorschot genoemde
      aantal oudkomers niet overtreffen.
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel9
  - number: '10.1'
    text: De Minister stelt de bijdrage uiterlijk 1 april 2007 vast.
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel10
  - number: '10.2'
    text: |-
      De overeenkomstig [artikel 9, tweede lid][ref1], vastgestelde bijdrage voor een gemeente wordt binnen 12 maanden na
      de vaststelling ervan betaald onder verrekening van het voorschot.


      [ref1]: https://wetten.overheid.nl/BWBR0018100#Artikel9
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0018100
        artikel: '9'
        hoofdstuk: '4'
  - number: '10.3'
    text: Indien het voorschot hoger is dan de vastgestelde bijdrage, is de Minister bevoegd het verschil terug te vorderen.
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel10
  - number: '11'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel11
  - number: '12'
    text: 'Deze regeling wordt aangehaald als: Regeling inburgering oudkomers 25 gemeenten 2005.'
    url: https://wetten.overheid.nl/BWBR0018100/2005-03-19#Artikel12
