  - number: '8'
    text: |-
      1 Het gemeentebestuur aan wie een voorschot als bedoeld in [artikel 4][ref1] is verleend, verstrekt de Minister de
      informatie over de gegevens die in de monitor worden gevraagd, uiterlijk 1 april 2006 over de periode januari 2005
      tot en met december 2005, en 1 april 2007 over de periode januari 2006 tot en met december 2006.

      2 In de monitor worden tenminste de volgende prestatiegegevens gevraagd:

      a. het aantal oudkomers met wie in 2005 een overeenkomst als bedoeld in [artikel 6][ref2] is gesloten;

      b. het aantal oudkomers dat een traject heeft afgerond;

      c. het aantal oudkomers dat een traject voortijdig heeft beëindigd;

      d. het niveau Nederlands als tweede taal van de oudkomers, bedoeld in onderdeel b, bij afronding van het traject
      ten opzichte van het niveau Nederlands als tweede taal bij de start van het traject.

      3 De verstrekte informatie als bedoeld in het eerste lid heeft alleen betrekking op trajecten die geheel of
      gedeeltelijk zijn bekostigd door de bijdrage, bedoeld in [artikel 3, eerste lid][ref3].

      4 De verstrekte informatie als bedoeld in het eerste lid is voorzien van een accountantsverklaring.

      5 Ten behoeve van de verstrekking van de in het eerste lid bedoelde gegevens stelt de Minister een controleprotocol
      vast.

      6 Het gemeentebestuur draagt er zorg voor dat de door hem ingeschakelde accountant meewerkt aan de door
      of namens de auditdienst van het ministerie van Justitie in te stellen onderzoeken naar de verrichte
      controlewerkzaamheden door die accountant. De daaraan verbonden kosten zijn begrepen in de bijdrage, bedoeld in
      [artikel 3, eerste lid][ref4].


