  - number: '7'
    text: |-
      1 Het gemeentebestuur aan wie het voorschot als bedoeld in [artikel 5][ref1] is verleend, draagt er zorg voor dat
      de oudkomer met wie een overeenkomst als bedoeld in [artikel 6][ref2] is gesloten een begintoets en een eindtoets
      aflegt aan de hand waarvan het niveau Nederlands als tweede taal van de oudkomer wordt vastgesteld.

      2 Voor de begintoets en de eindtoets, bedoeld in het eerste lid, wordt uitsluitend gebruik gemaakt van de hierna
      volgende combinaties van toetsen:

      a. de Intaketoets NT2 als begintoets met de NT2-Profieltoets, NT2-Cat of Itemdito als eindtoets; of

      b. de Intaketoets Alfabetisering NT2 als begintoets met de NT2-Profieltoets Alfabetisering als eindtoets.


      [ref1]: https://wetten.overheid.nl/BWBR0018100#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0018100#Artikel6
