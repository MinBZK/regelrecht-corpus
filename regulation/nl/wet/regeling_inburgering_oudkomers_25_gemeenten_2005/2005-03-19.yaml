  - number: '10'
    text: |-
      1 De Minister stelt de bijdrage uiterlijk 1 april 2007 vast.

      2 De overeenkomstig [artikel 9, tweede lid][ref1], vastgestelde bijdrage voor een gemeente wordt binnen 12 maanden
      na de vaststelling ervan betaald onder verrekening van het voorschot.

      3 Indien het voorschot hoger is dan de vastgestelde bijdrage, is de Minister bevoegd het verschil terug te
      vorderen.


