  - number: '9'
    text: |-
      1 De Minister stelt de bijdrage vast met behulp van de door het gemeentebestuur op grond van [artikel 8][ref1]
      verstrekte informatie.

      2 De bijdrage voor een gemeente bedraagt:

      a. € 2.667 voor iedere oudkomer met wie een overeenkomst als bedoeld in [artikel 6][ref2] is gesloten; en

      b. € 5.333 voor iedere oudkomer die, evenals het gemeentebestuur, aan de verplichtingen, genoemd in de
      overeenkomst, bedoeld in [artikel 6][ref3], heeft voldaan en die een begintoets en een eindtoets als bedoeld in
      [artikel 7][ref4] is afgenomen.

      3 Het aantal oudkomers dat de Minister bij het vaststellen van de bijdrage betrekt, kan het in het voorschot
      genoemde aantal oudkomers niet overtreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0018100#Artikel8
