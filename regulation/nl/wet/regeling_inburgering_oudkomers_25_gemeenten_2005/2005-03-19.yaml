  - number: '5'
    text: |-
      1 De Minister verleent het gemeentebestuur de bijdrage, bedoeld in [artikel 3, eerste lid][ref1], bij wijze van
      een voorschot.

      2 Het voorschot is afhankelijk van de prognose en van het bedrag als genoemd in de [bijlage][ref2] en wordt als
      volgt vastgesteld:

      a. indien de prognose gelijk is aan het in de [bijlage][ref3] genoemde aantal oudkomers, bedraagt het voorschot het
      in de [bijlage][ref4] genoemde bedrag;

      b. indien de prognose lager is dan het in de [bijlage][ref5] genoemde aantal oudkomers, wordt het in de
      [bijlage][ref6] genoemde bedrag naar evenredigheid verminderd;

      c. indien de prognose hoger is dan het in de [bijlage][ref7] genoemde aantal oudkomers, wordt het in de
      [bijlage][ref8] genoemde bedrag:

      1°. in het geval het budget toereikend is, naar evenredigheid vermeerderd;

      2°. in het geval het bedrag niet toereikend is, vastgesteld conform dat bedrag vermeerderd met een bedrag. Het
      laatstgenoemde bedrag is afhankelijk van de verdeling van de resterende middelen naar evenredigheid van het aantal
      oudkomers als genoemd in de [bijlage][ref9].

      3 De Minister stelt het voorschot binnen acht weken na inwerkingtreding van deze regeling vast.

      4 Het voorschot wordt uiterlijk 31 mei 2005 betaald.


