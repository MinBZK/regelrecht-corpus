preamble:
  text: |-
    Gelet op de artikelen 66a, tweede lid, 66b, eerste en derde lid, 66c, derde lid, en 66d, vierde lid, van de
    Wegenverkeerswet 1994;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0032425/2016-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *erkenning:* erkenning als bedoeld in [artikel 66a, eerste lid, van de wet][ref1];
        - *wet:* [Wegenverkeerswet 1994][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel66a
      [ref2]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0032425/2016-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 66a
      - id: ref2
        bwb_id: BWBR0006622
  - number: '3'
    text: |-
      1 De aanvrager of de onderneming van de aanvrager van een erkenning is ingeschreven in het handelsregister, bedoeld
      in [artikel 2 van de Handelsregisterwet 2007][ref1]. Uit de inschrijving blijkt dat de aanvrager een onderneming is
      die in opdracht van derden bedrijfsmatig exportdiensten voor voertuigen verleend.

      2 De aanvrager van de erkenning beschikt over een goed afsluitbare voorziening, welke naar het oordeel van
      de Dienst Wegverkeer voldoende bescherming tegen inbraak biedt, waarin de op de erkenning betrekking hebbende
      bescheiden en documenten kunnen worden opgeborgen.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel2
    url: https://wetten.overheid.nl/BWBR0032425/2016-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '2'
  - number: '4'
    text: |-
      In de erkenning worden de vestigingen vermeld waarop de erkenning betrekking heeft. De uitoefening van de erkenning
      heeft slechts plaats vanaf de locatie die door het erkende bedrijf als bedrijfsadres is opgegeven en welke op het
      uittreksel uit het handelsregister, bedoeld in [artikel 22 van de Handelsregisterwet 2007][ref1], als zodanig is
      vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel22
    url: https://wetten.overheid.nl/BWBR0032425/2016-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '22'
  - number: '5'
    text: |-
      1 Het erkende bedrijf neemt het bij en krachtens de [wet][ref1] bepaalde omtrent de erkenning in acht.

      2 Het erkende bedrijf draagt er zorg voor dat bij voortduring wordt voldaan aan de eisen en voorschriften die
      gelden voor de erkenning.

      3 Het erkende bedrijf is verplicht wijzigingen in de bedrijfsactiviteit alsmede wijzigingen in de bedrijfsgegevens,
      voor zover deze van belang kunnen zijn voor de erkenning, onverwijld schriftelijk te melden aan de Dienst
      Wegverkeer.

      4 Het personeel van het erkende bedrijf is voor zover dit nodig is in het kader van zijn functie, op de hoogte van
      de regels die gelden voor de erkenning.

      5 Het erkende bedrijf heeft een afschrift van de beschikking waaruit blijkt dat de erkenning is verleend aanwezig.
      Het erkende bedrijf geeft de beschikking op verzoek ter inzage aan klanten.

      6 Vanaf de buitenkant van het bedrijf is op een door de Dienst Wegverkeer vastgestelde en in de Staatscourant
      bekendgemaakte wijze zichtbaar dat de erkenning is verleend.

      7 Het erkende bedrijf bewaart de kentekenbewijzen deel II en processen-verbaal van aangifte van diefstal van de
      kentekenplaten van de voor export afgemelde voertuigen, alsmede overige in het kader van de erkenning aan het
      erkende bedrijf verstrekte documenten en bescheiden in de in [artikel 3, tweede lid][ref2], bedoelde voorziening.

      8

      9 Het bedrijf maakt gebruik van in het kader van de erkenning door de Dienst Wegverkeer goedgekeurde
      datacommunicatieapparatuur en laat de communicatie plaatsvinden in een door deze dienst geaccepteerd netwerk. Bij
      dit gebruik neemt het bedrijf de door de Dienst Wegverkeer gegeven aanwijzingen in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0006622
      [ref2]: https://wetten.overheid.nl/BWBR0032425#Artikel3
    url: https://wetten.overheid.nl/BWBR0032425/2016-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006622
      - id: ref2
        bwb_id: BWBR0032425
        artikel: '3'
        hoofdstuk: '2'
  - number: '6'
    text: |-
      1 De Dienst Wegverkeer verstrekt in het kader van de erkenning codes aan het erkende bedrijf. Het erkende bedrijf
      draagt er zorg voor dat de codes niet toegankelijk zijn voor onbevoegden.

      2 Het erkende bedrijf ziet er op toe dat de kentekenbewijzen deel II niet door anderen dan het bevoegde personeel
      van het erkende bedrijf worden gebruikt en neemt ook overigens de noodzakelijke zorgvuldigheid ten aanzien van het
      beheer van documenten en codes in acht.
    url: https://wetten.overheid.nl/BWBR0032425/2016-01-01#Artikel6
  - number: 6a
    text: |-
      Aan een op grond van [artikel 23k van het Besluit voertuigen][ref1] bestaande verplichting wordt gevolg gegeven
      door de tellerstand van een motorrijtuig te verstrekken aan de Dienst Wegverkeer door middel van datacommunicatie-
      apparatuur als bedoeld in [artikel 5, negende lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025554#Artikel23k
      [ref2]: https://wetten.overheid.nl/BWBR0032425#Artikel5
    url: https://wetten.overheid.nl/BWBR0032425/2016-01-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0025554
        artikel: 23k
      - id: ref2
        bwb_id: BWBR0032425
        artikel: '5'
        hoofdstuk: '3'
  - number: '7'
    text: |-
      1 Het toezicht op het erkende bedrijf bestaat uit het uitvoeren van periodieke controles door de daartoe bevoegde
      ambtenaren. Deze controles kunnen frequenter plaatsvinden indien het vermoeden bestaat dat het erkende bedrijf de
      in het kader van de erkenning geldende eisen en voorschriften niet nakomt.

      2 De in het eerste lid bedoelde ambtenaren worden desgevraagd behoorlijk in de gelegenheid gesteld te onderzoeken
      of het erkende bedrijf voldoet aan de gestelde eisen en voorschriften. Het erkende bedrijf geeft inzage in
      de met betrekking tot de erkenning te voeren administratie. Tevens toont het erkende bedrijf op verzoek van
      bedoelde ambtenaren de kopieën van processen-verbaal van gestolen kentekenplaten alsmede de overeenkomstig
      [artikel 9, derde lid][ref1], bewaarde helften van kentekenplaten.

      3 Bij de intrekking, schorsing of wijziging van de erkenning kan een onderscheid gemaakt worden tussen de betrokken
      vestigingen.


      [ref1]: https://wetten.overheid.nl/BWBR0032425#Artikel9
    url: https://wetten.overheid.nl/BWBR0032425/2016-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0032425
        artikel: '9'
        hoofdstuk: '4'
  - number: '8'
    text: |-
      1 Onverminderd [hoofdstuk 3][ref1] zijn op de erkenning het tweede tot en met zevende lid van toepassing.

      2 De melding dat een voertuig voorgoed buiten Nederland wordt gebracht kan door het erkende bedrijf alleen worden
      gedaan namens een derde die het voertuig exporteert.

      3 Ten behoeve van het versneld melden dat voertuigen voorgoed buiten Nederland worden gebracht, verstrekt de Dienst
      Wegverkeer aan het erkende bedrijf blanco documenten om te worden gebruikt als kentekenbewijzen deel II welke bij
      de melding door het erkende bedrijf worden gebruikt.

      4 Na de melding stelt het erkende bedrijf het kentekenbewijs deel II en het vrijwaringsbewijs ter hand aan de
      aanvrager.

      5 Het erkende bedrijf brengt bij de persoon die het voertuig naar het buitenland brengt
      onder de aandacht dat er een verzekering tegen wettelijke aansprakelijkheid als bedoeld in de
      [Wet aansprakelijkheidsverzekering motorrijtuigen][ref2] dient te zijn afgesloten alvorens met het voertuig van de
      weg gebruik wordt gemaakt.

      6 Het erkende bedrijf bewaart het afschrift van het proces-verbaal van diefstal van de bij het voertuig behorende
      kentekenplaten minimaal twee jaar in de in [artikel 3, tweede lid][ref3], bedoelde voorziening. Het erkende bedrijf
      vernietigt het afschrift wanneer ten minste twee en ten hoogste drie jaren zijn verstreken sinds de dag van de
      exportmelding.

      7 In geval van vermissing van blanco documenten om te worden gebruikt als kentekenbewijzen deel II doet het
      bedrijf, onder opgave van de nummers, daarvan onverwijld mededeling aan de Dienst Wegverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0032425#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0002415
      [ref3]: https://wetten.overheid.nl/BWBR0032425#Artikel3
    url: https://wetten.overheid.nl/BWBR0032425/2016-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0032425
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0002415
      - id: ref3
        bwb_id: BWBR0032425
        artikel: '3'
        hoofdstuk: '2'
  - number: '9'
    text: |-
      1 Bij de melding, bedoeld in [artikel 8, tweede lid][ref1], geeft het erkende bedrijf de lamineercodes van de
      kentekenplaten van het voertuig op.

      2 Het erkende bedrijf neemt de kentekenplaten in van het voertuig waarvoor een melding als bedoeld in
      [artikel 8, tweede lid][ref2], wordt gedaan, en maakt de ingenomen kentekenplaten onbruikbaar door deze op zodanige
      wijze doormidden te knippen dat de lamineercode goed leesbaar blijft.

      3 Het erkende bedrijf bewaart de twee helften van de ingenomen kentekenplaten waarop de laatste tien meldingen,
      bedoeld in [artikel 8, tweede lid][ref3], betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0032425#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0032425#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0032425#Artikel8
    url: https://wetten.overheid.nl/BWBR0032425/2016-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0032425
        artikel: '8'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0032425
        artikel: '8'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0032425
        artikel: '8'
        hoofdstuk: '4'
  - number: 9a
    text: |-
      1 Indien de kentekenplaten als gevolg van vermissing of diefstal niet aanwezig zijn bij het voertuig:

      a. is [artikel 9][ref1] niet van toepassing;

      b. legt de aanvrager een afschrift van het proces-verbaal over waaruit blijkt dat de kentekenplaten van het
      voertuig vermist dan wel gestolen zijn, en

      c. bewaart het erkende bedrijf het afschrift, bedoeld in onderdeel b, gedurende de in [artikel 8, zesde lid][ref2],
      genoemde termijn.

      2 Indien één van de kentekenplaten als gevolg van vermissing of diefstal niet aanwezig is bij het voertuig
      zijn [artikel 9][ref3] en het eerste lid, onderdelen b en c, van overeenkomstige toepassing op de aanwezige
      kentekenplaat.


      [ref1]: https://wetten.overheid.nl/BWBR0032425#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0032425#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0032425#Artikel9
    url: https://wetten.overheid.nl/BWBR0032425/2016-01-01#Artikel9a
