  - number: '5.2'
    text: |-
      Voor de toepassing van dit hoofdstuk worden de gegevens van de aangifte overschotheffing – daaronder begrepen
      de correcties –, het afsluitformulier 1995, het afsluitformulier 1996 en de vrijstellingsverklaring slechts in
      aanmerking genomen voor zover deze vóór 10 juli 1997 door het Bureau Heffingen zijn ontvangen.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel5
  - number: '6.1'
    text: Het varkensrecht komt overeen met het in 1996 gemiddeld op het bedrijf gehouden aantal varkens, verminderd met 10%.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel6
  - number: '6.2'
    text: |-
      Het fokzeugenrecht komt overeen met het in 1996 gemiddeld op het bedrijf gehouden aantal fokzeugen, verminderd
      met 10%.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel6
  - number: '6.3'
    text: |-
      De in het eerste en tweede lid bedoelde vermindering met 10% is niet van toepassing op het aantal varkens,
      onderscheidenlijk fokzeugen, dat groter is dan het aantal dat wordt bepaald door het niet-gebonden
      mestproductierecht voor varkens en kippen geldend met betrekking tot 1996 te delen door 7,4 kilogram fosfaat.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel6
  - number: '6.4'
    text: |-
      Het in 1996 gemiddeld op het bedrijf gehouden aantal varkens, onderscheidenlijk fokzeugen, is het in 1996 gemiddeld
      gehouden aantal varkens, onderscheidenlijk fokzeugen, dat met betrekking tot het desbetreffende bedrijf is
      opgegeven in de aangifte overschotheffing 1996, bij gebreke daarvan, op het afsluitformulier 1996, dan wel, bij
      gebreke daarvan, op de vrijstellingsverklaring 1996.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel6
  - number: '6.5'
    text: |-
      Indien in 1996 overdracht van het bedrijf heeft plaatsgevonden, wordt het in 1996 gemiddeld op het bedrijf gehouden
      aantal varkens, onderscheidenlijk fokzeugen, bepaald door de som van het over het gehele jaar 1996 gemiddelde
      aantal varkens, onderscheidenlijk fokzeugen, dat door de vervreemder van het bedrijf is gehouden en het over het
      gehele jaar 1996 gemiddelde aantal varkens, onderscheidenlijk fokzeugen, dat door de verkrijger van het bedrijf is
      gehouden, zoals deze aantallen blijken uit de door de vervreemder en de verkrijger gedane opgaven, bedoeld in het
      vierde lid.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel6
  - number: '6.6'
    text: |-
      Het in 1996 gemiddeld op het bedrijf gehouden aantal varkens, onderscheidenlijk fokzeugen, is ten hoogste het
      aantal dat wordt bepaald door het niet-gebonden mestproductierecht voor varkens en kippen geldend met betrekking
      tot 1996 te vermeerderen met het grondgebonden mestproductierecht geldend met betrekking tot 1996 en de som te
      delen door 7,4 kilogram fosfaat.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel6
  - number: '7.1'
    text: |-
      Het varkensrecht en het fokzeugenrecht van een daartoe aangemeld bedrijf komen overeen met het in 1995 gemiddeld op
      het bedrijf gehouden aantal varkens, onderscheidenlijk fokzeugen, verminderd met 10%.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel7
  - number: '7.2'
    text: |-
      [Artikel 6, derde, vierde, vijfde en zesde lid][ref1], is van overeenkomstige toepassing op de bepaling van de
      omvang van het varkensrecht, onderscheidenlijk fokzeugenrecht, bedoeld in het eerste lid, met dien verstande dat in
      plaats van «1996» telkens moet worden gelezen: 1995.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel6
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '6'
        hoofdstuk: II
  - number: '7.3'
    text: |-
      De belanghebbende doet de in het eerste lid bedoelde melding binnen zes weken na inwerkingtreding van deze
      wet bij het Bureau Heffingen, met gebruikmaking van een daartoe door Onze Minister vastgesteld formulier, dat
      overeenkomstig de op het formulier aangegeven wijze volledig en naar waarheid is ingevuld en door de belanghebbende
      is ondertekend.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel7
  - number: '7.4'
    text: |-
      Indien in 1995 of 1996 registratie van een kennisgeving van verplaatsing met betrekking tot het niet-gebonden
      mestproductierecht voor varkens en kippen heeft plaatsgevonden, wordt het overeenkomstig het eerste en tweede
      lid bepaalde varkensrecht, onderscheidenlijk fokzeugenrecht, vergroot voor het bedrijf waarheen is verplaatst en
      verkleind tot ten minste nihil voor het bedrijf waarvan het niet-gebonden mestproductierecht afkomstig is.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel7
  - number: '7.5'
    text: |-
      Ingeval de in het vierde lid bedoelde registratie plaatsvond in 1995, komt de in dat lid bedoelde
      vergroting overeen met het aantal varkenseenheden dat wordt bepaald door overeenkomstige toepassing
      van [artikel 9, tweede en vijfde lid][ref1], en komt de in het vierde lid bedoelde verkleining
      overeen met het aantal varkenseenheden dat wordt bepaald door overeenkomstige toepassing van
      [artikel 9, derde, vierde en vijfde lid][ref2], met dien verstande dat in het tweede, derde en vierde
      lid van dat artikel in plaats van «1996» telkens wordt gelezen: 1995. Ingeval de in het vierde lid
      bedoelde registratie plaatsvond in 1996, komt de vergroting overeen met het aantal varkenseenheden dat
      wordt bepaald door overeenkomstige toepassing van [artikel 10, tweede en vierde lid][ref3], en komt de
      verkleining overeen met het aantal varkenseenheden dat wordt bepaald door overeenkomstige toepassing van
      [artikel 10, derde en vierde lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0009542#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0009542#Artikel10
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '9'
        hoofdstuk: II
