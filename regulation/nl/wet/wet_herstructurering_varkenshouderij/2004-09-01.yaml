        artikel: '6'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0009542
        artikel: '7'
        hoofdstuk: II
  - number: '9.1'
    text: |-
      Indien in 1996 registratie van een kennisgeving van verplaatsing met betrekking tot het niet-gebonden
      mestproductierecht voor varkens en kippen heeft plaatsgevonden, wordt, in verband met de toepassing van
      [artikel 9, zesde lid, van de Wet verplaatsing mestproductie][ref1], het overeenkomstig [artikel 6][ref2],
      [8][ref3] of [11, tweede lid][ref4], bepaalde varkensrecht vergroot voor het bedrijf waarheen is verplaatst en
      verkleind tot ten minste nihil voor het bedrijf waarvan het niet-gebonden mestproductierecht afkomstig is.


      [ref1]: https://wetten.overheid.nl/BWBR0006285#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0009542#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0009542#Artikel11
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006285
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0009542
        artikel: '6'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0009542
        artikel: '8'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0009542
        artikel: '11'
        hoofdstuk: II
  - number: '9.2'
    text: |-
      De in het eerste lid bedoelde vergroting betreft het fokzeugenrecht en komt overeen met 90% van het aantal
      varkenseenheden dat wordt bepaald door het door de belanghebbende daartoe bij wijze van melding aangegeven deel van
      de kilogrammen fosfaat waarmee het niet-gebonden mestproductierecht voor varkens en kippen is vergroot, maar die
      volgens de in de kennisgeving van verplaatsing gedane opgave in 1996 niet meer konden worden benut, te delen door
      7,4 kilogram fosfaat.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel9
  - number: '9.3'
    text: |-
      De in het eerste lid bedoelde verkleining komt overeen met 90% van het aantal varkenseenheden dat wordt bepaald
      door de kilogrammen fosfaat waarmee het niet-gebonden mestproductierecht voor varkens en kippen van het bedrijf
      is verkleind, maar die volgens de in de kennisgeving van verplaatsing gedane opgave in 1996 nog op dat bedrijf kon
      worden benut, te delen door 7,4 kilogram fosfaat. De verkleining komt ten laste van het fokzeugenrecht voor zover
      het aantal varkenseenheden waarmee de verkleining overeenkomt groter is dan het verschil tussen het varkensrecht en
      het fokzeugenrecht.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel9
  - number: '9.4'
    text: |-
      Indien het betreft een verkleining van het overeenkomstig [artikel 6][ref1] bepaalde varkensrecht, blijft het derde
      lid buiten toepassing ten aanzien van het door de belanghebbende daartoe bij wijze van melding aangegeven deel van
      de in dat lid bedoelde kilogrammen fosfaat. Dit deel komt evenwel ten hoogste overeen met het aantal kilogrammen
      fosfaat dat wordt bepaald door de mestproductie afkomstig van de in 1996 gehouden dieren van andere diersoorten
      dan varkens en kippen achtereenvolgens in mindering te brengen op het niet-gebonden mestproductierecht voor die
      diersoorten geldend met betrekking tot 1996 en op het grondgebonden mestproductierecht geldend met betrekking
      tot 1996, het aldus vastgestelde saldo van het grondgebonden mestproductierecht, zijnde ten minste nihil, te
      vermeerderen met het niet-gebonden mestproductierecht voor varkens en kippen geldend met betrekking tot 1996,
      en op deze som de mestproductie afkomstig van varkens in mindering te brengen. De mestproductie afkomstig van de
      onderscheiden diersoorten wordt overeenkomstig [artikel 55, negende lid, van de Meststoffenwet][ref2] vastgesteld
      op basis van het in 1996 gemiddeld op het bedrijf gehouden aantal dieren van de onderscheiden diersoorten en
      diercategorieën daarbinnen, dat met betrekking tot het bedrijf is opgegeven in de aangifte overschotheffing 1996.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel55
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '6'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '55'
  - number: '9.5'
    text: |-
      [Artikel 7, derde lid][ref1], is op de meldingen, bedoeld in het tweede en vierde lid, van overeenkomstige
      toepassing. Bij gebreke van een overeenkomstig [artikel 7, derde lid][ref2], gedane melding, is de vergroting
      van het varkensrecht nihil, onderscheidenlijk worden het varkensrecht en het fokzeugenrecht verkleind met het
      overeenkomstig het derde lid bepaalde aantal varkenseenheden.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel7
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '7'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0009542
        artikel: '7'
        hoofdstuk: II
  - number: '10.1'
    text: |-
      Indien na 1996 registratie heeft plaatsgevonden van een uiterlijk op 9 juli 1997 gedane kennisgeving van
      verplaatsing met betrekking tot het niet-gebonden mestproductierecht voor varkens en kippen, wordt het
      overeenkomstig [artikel 6][ref1], [7][ref2], [8][ref3] of [11, derde lid][ref4], bepaalde varkensrecht vergroot
      voor het bedrijf waarheen is verplaatst en verkleind tot ten minste nihil voor het bedrijf waarvan het niet-
      gebonden mestproductierecht afkomstig is.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0009542#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0009542#Artikel11
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '6'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0009542
        artikel: '7'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0009542
        artikel: '8'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0009542
        artikel: '11'
        hoofdstuk: II
  - number: '10.2'
    text: |-
      De in het eerste lid bedoelde vergroting betreft het fokzeugenrecht en komt overeen met 90% van het aantal
      varkenseenheden dat wordt bepaald door het door de belanghebbende daartoe bij wijze van melding aangegeven deel
      van de kilogrammen fosfaat waarmee het niet-gebonden mestproductierecht voor varkens en kippen van het bedrijf is
      vergroot te delen door 7,4 kilogram fosfaat.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel10
  - number: '10.3'
    text: |-
      De in het eerste lid bedoelde verkleining komt overeen met 90% van het aantal varkenseenheden dat wordt bepaald
      door de kilogrammen fosfaat waarmee het niet-gebonden mestproductierecht voor varkens en kippen van het bedrijf
      is verkleind te delen door 7,4 kilogram fosfaat. De verkleining komt ten laste van het fokzeugenrecht voor zover
      het aantal varkenseenheden waarmee de verkleining overeenkomt groter is dan het verschil tussen het varkensrecht
      en het fokzeugenrecht. Artikel 9, vierde lid, is van overeenkomstige toepassing, met dien verstande dat voor
      de toepassing van dit artikel, indien het varkensrecht overeenkomstig [artikel 7][ref1] wordt bepaald, in
      [artikel 9, vierde lid][ref2], in plaats van «1996» telkens wordt gelezen: 1995.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel9
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '7'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0009542
        artikel: '9'
        hoofdstuk: II
  - number: '10.4'
    text: |-
      [Artikel 7, derde lid][ref1], is op de meldingen, bedoeld in het tweede en derde lid, tweede volzin, van
      overeenkomstige toepassing. Bij gebreke van een overeenkomstig [artikel 7, derde lid][ref2], gedane melding, is de
      vergroting van het varkensrecht nihil, onderscheidenlijk worden het varkensrecht en het fokzeugenrecht verkleind
      met het overeenkomstig het derde lid bepaalde aantal varkenseenheden.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel7
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel10
    references:
