  - number: '42.1'
    text: |-
      Indien [artikel 37][ref1] op een andere datum dan 1 januari in werking treedt wordt in het desbetreffende
      kalenderjaar de in [artikel 91a, eerste lid, van de Gezondheids- en welzijnswet voor dieren][ref2] bedoelde
      varkensheffing, in afwijking van [artikel 91a, derde lid, van die wet][ref3], geheven over het tijdvak dat
      bestaat uit het nog niet verstreken deel van dat jaar naar het aantal varkens, uitgedrukt in heffingseenheden
      overeenkomstig [artikel 91b van die wet][ref4], dat gemiddeld in dat tijdvak op het bedrijf wordt gehouden,
      vermenigvuldigd met de uitkomst van de deling van het aantal kalendermaanden waaruit dat tijdvak bestaat door
      twaalf.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel91a
      [ref3]: https://wetten.overheid.nl/BWBR0005662#Artikel91a
      [ref4]: https://wetten.overheid.nl/BWBR0005662#Artikel91b
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel42
