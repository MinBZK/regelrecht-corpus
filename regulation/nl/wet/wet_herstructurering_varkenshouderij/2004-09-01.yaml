  - number: '42.2'
    text: |-
      In geval het eerste lid van toepassing is, is in het desbetreffende kalenderjaar op het tarief van de
      varkensheffing [artikel 91e, eerste lid, van de Gezondheids- en welzijnswet voor dieren][ref1] van toepassing, met
      dien verstande dat in onderdeel a, van dat artikellid in plaats van «1 januari van het desbetreffende kalenderjaar»
      wordt gelezen «de datum waarop [artikel 37][ref2] van de Wet herstructurering varkenshouderij in werking treedt»
      en in de onderdelen b tot en met e, van dat artikellid in plaats van «in het desbetreffende kalenderjaar»
      wordt gelezen: in het, vanaf de datum van inwerkingtreding van [artikel 37][ref3] van de Wet herstructurering
      varkenshouderij, nog niet verstreken deel van het kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel91e
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0009542#Artikel37
