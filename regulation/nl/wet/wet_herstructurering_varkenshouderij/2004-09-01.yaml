        artikel: '7'
        hoofdstuk: II
  - number: '11.1'
    text: |-
      De [artikelen 9][ref1] en [10][ref2] zijn niet van toepassing op een kennisgeving van verplaatsing met betrekking
      tot een samenvoeging van bedrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel10
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '9'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0009542
        artikel: '10'
        hoofdstuk: II
  - number: '11.2'
    text: |-
      Indien in 1996 registratie heeft plaatsgevonden van een kennisgeving van verplaatsing met betrekking tot een
      samenvoeging van bedrijven, worden het varkensrecht en het fokzeugenrecht van het na samenvoeging ontstane bedrijf
      bepaald door de som van het over het gehele jaar 1996 gemiddelde aantal varkens, onderscheidenlijk fokzeugen,
      verminderd met 10%, dat op elk van de oorspronkelijke bedrijven is gehouden te vermeerderen met het over het
      gehele jaar 1996 gemiddelde aantal varkens, onderscheidenlijk fokzeugen, verminderd met 10%, dat op het door
      samenvoeging ontstane bedrijf is gehouden, zoals deze aantallen blijken uit de met betrekking tot de onderscheiden
      bedrijven gedane opgaven, bedoeld in [artikel 6, vierde lid][ref1]. [Artikel 6, derde en zesde lid][ref2], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel6
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '6'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0009542
        artikel: '6'
        hoofdstuk: II
  - number: '11.3'
    text: |-
      Indien na 1996 registratie heeft plaatsgevonden van een uiterlijk op 9 juli 1997 gedane kennisgeving van
      verplaatsing met betrekking tot een samenvoeging van bedrijven, komen het varkensrecht en het fokzeugenrecht
      van het na samenvoeging ontstane bedrijf overeen met de som van het in 1996 gemiddeld op elk van de
      oorspronkelijke bedrijven gehouden aantal varkens, onderscheidenlijk fokzeugen, verminderd met 10%.
      [Artikel 6, derde, vierde en zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel6
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '6'
        hoofdstuk: II
  - number: '11.4'
    text: |-
      De [artikelen 9, eerste, tweede en derde lid][ref1], en [10, eerste, tweede en derde lid, eerste volzin][ref2],
      zijn, indien het tijdstip van registratie van de in die artikelen bedoelde kennisgeving van verplaatsing is gelegen
      vóór het tijdstip van registratie van de kennisgeving van verplaatsing met betrekking tot de samenvoeging van de
      bedrijven, van overeenkomstige toepassing op elk van de samengevoegde bedrijven, met dien verstande dat voor de
      toepassing van dit lid in deze artikelen in plaats van «varkensrecht» telkens wordt gelezen «90% van het in 1996
      gemiddeld op het bedrijf gehouden aantal varkens» en in plaats van «fokzeugenrecht» telkens wordt gelezen: 90% van
      het in 1996 gemiddeld op het bedrijf gehouden aantal fokzeugen.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel10
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '9'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0009542
        artikel: '10'
        hoofdstuk: II
  - number: '11.5'
    text: |-
      Met betrekking tot een bedrijf dat in 1995 door samenvoeging van bedrijven is ontstaan worden, indien de
      belanghebbende daartoe overeenkomstig [artikel 7, derde lid][ref1], een melding doet, het varkensrecht en het
      fokzeugenrecht, overeenkomstig het tweede en vierde lid bepaald, met dien verstande dat in die leden in plaats van
      «1996» telkens wordt gelezen: 1995. Voor de toepassing van het vierde lid wordt in [artikel 9, eerste lid][ref2],
      in plaats van «1996» gelezen «1995» en wordt in [artikel 10, eerste lid][ref3], in plaats van« na 1996» gelezen: in
      of na 1996.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0009542#Artikel10
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '7'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0009542
        artikel: '9'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0009542
        artikel: '10'
        hoofdstuk: II
  - number: '11.6'
    text: |-
      Ingeval met betrekking tot één van de samengevoegde bedrijven dan wel het door samenvoeging ontstane bedrijf geen
      opgave als bedoeld in [artikel 6, vierde lid][ref1], is gedaan, worden, indien de belanghebbende overeenkomstig
      [artikel 7, derde lid][ref2], een melding doet, het varkensrecht en het fokzeugenrecht overeenkomstig
      [artikel 8, eerste en tweede lid][ref3], bepaald. Voor de toepassing van [artikel 8, tweede lid][ref4], wordt
      uitgegaan van de opgave met betrekking tot een van de oorspronkelijke bedrijven, zoals dat bij de melding is
      aangegeven door de belanghebbende.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0009542#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0009542#Artikel8
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '6'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0009542
        artikel: '7'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0009542
        artikel: '8'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0009542
        artikel: '8'
        hoofdstuk: II
  - number: '12'
    text: |-
      Indien registratie heeft plaatsgevonden van een na 9 juli 1997 en vóór inwerkingtreding van deze wet gedane
      kennisgeving van verplaatsing met betrekking tot het niet-gebonden mestproductierecht voor varkens en kippen, wordt
      het overeenkomstig [artikel 6][ref1], [7][ref2], [8][ref3] of [11][ref4] bepaalde varkensrecht voor het bedrijf
      waarvan het niet-gebonden mestproductierecht afkomstig is verkleind tot ten minste nihil, met 90% van het aantal
      varkenseenheden dat wordt bepaald door de kilogrammen fosfaat waarmee het niet-gebonden mestproductierecht voor
      varkens en kippen van het bedrijf is verkleind te delen door 7,4 kilogram fosfaat. De verkleining komt ten laste
      van het fokzeugenrecht voor zover het aantal varkenseenheden waarmee de verkleining overeenkomt groter is dan het
      verschil tussen het varkensrecht en het fokzeugenrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0009542#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0009542#Artikel11
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '6'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0009542
        artikel: '7'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0009542
        artikel: '8'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0009542
        artikel: '11'
        hoofdstuk: II
  - number: '13'
    text: |-
      Het overeenkomstig dit hoofdstuk bepaalde varkensrecht, onderscheidenlijk fokzeugenrecht, is niet groter dan het
      aantal varkenseenheden dat wordt bepaald door 90% van het niet-gebonden mestproductierecht voor varkens en kippen,
      zoals dat gold op de dag voorafgaande aan het tijdstip van inwerkingtreding van [artikel 15][ref1], te vermeerderen
      met 125 kilogram fosfaat per hectare van de op de dag voorafgaand aan dat tijdstip tot het bedrijf behorende
      oppervlakte landbouwgrond, en deze som te delen door 7,4 kilogram fosfaat.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel15
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '15'
        hoofdstuk: III
  - number: '14'
    text: |-
      Met betrekking tot een bedrijf geldt in plaats van het varkensrecht of het fokzeugenrecht dat is bepaald
      overeenkomstig dit hoofdstuk een lager varkensrecht of fokzeugenrecht, indien de belanghebbende daarvan
      overeenkomstig [artikel 7, derde lid][ref1], een melding doet.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel7
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '7'
        hoofdstuk: II
  - number: 14a.1
    text: |-
      De omvang van het grondgebonden deel van het varkensrecht op 1 september 1998 komt overeen met het overeenkomstig
      dit hoofdstuk bepaalde varkensrecht, verminderd met 90% van het aantal varkenseenheden dat wordt bepaald door het
      niet-gebonden mestproductierecht voor varkens en kippen geldend met betrekking tot 1996 te delen door 7,4 kilogram
      fosfaat. Ingeval het varkensrecht wordt bepaald op grond van artikel 7, wordt in de eerste volzin in plaats van
      «1996» gelezen: 1995.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel14a
  - number: 14a.2
    text: |-
      De omvang van het grondgebonden deel van het fokzeugenrecht op 1 september 1998 komt overeen met het overeenkomstig
      dit hoofdstuk bepaalde fokzeugenrecht, verminderd met 90% van het aantal varkenseenheden dat wordt bepaald door het
      niet-gebonden mestproductierecht voor varkens en kippen geldend met betrekking tot 1996 te delen door 7,4 kilogram
      fosfaat. Ingeval het fokzeugenrecht wordt bepaald op grond van artikel 7, wordt in de eerste volzin in plaats van
      «1996» gelezen: 1995.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel14a
  - number: 14a.3
    text: |-
      Voor de toepassing van het eerste en tweede lid wordt het varkensrecht, onderscheidenlijk fokzeugenrecht, niet
      in aanmerking genomen, voorzover dat als gevolg van de toepassing van artikel 7, vierde of vijfde lid, 9 of 10
      is vergroot.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel14a
  - number: '15.1'
    text: |-
      Het is verboden op een bedrijf gemiddeld gedurende het jaar een groter aantal varkens, onderscheidenlijk fokzeugen,
      te houden dan het op het bedrijf rustende varkensrecht, onderscheidenlijk fokzeugenrecht, verminderd met het
      grondgebonden deel van het varkensrecht, onderscheidenlijk fokzeugenrecht.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel15
  - number: '15.2'
    text: |-
      De vermindering, bedoeld in het eerste lid, geschiedt niet voor het deel van het grondgebonden deel van het
      varkensrecht, onderscheidenlijk fokzeugenrecht, dat overeenkomt met het aantal varkenseenheden dat wordt
      bepaald door achtereenvolgens 125 kilogram fosfaat per hectare van de in desbetreffende jaar tot het bedrijf
      behorende oppervlakte landbouwgrond te verminderen met de in het desbetreffende jaar geproduceerde dierlijke
      meststoffen, uitgedrukt in kilogrammen fosfaat, afkomstig van andere in [bijlage A van de Meststoffenwet][ref1]
      opgenomen diersoorten dan varkens, kippen en kalkoenen, en dit verschil te delen door 7,4 kilogram fosfaat.
      Voor de toepassing van de eerste volzin wordt niet in aanmerking genomen de hoeveelheid dierlijke meststoffen
      afkomstig van andere diersoorten dan varkens, kippen en kalkoenen die overeenkomt met het niet-gebonden
      mestproductierecht voor die diersoorten. De hoeveelheid dierlijke meststoffen wordt bepaald overeenkomstig
      [artikel 55, achtste lid, van de Meststoffenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004054
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel55
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004054
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '55'
  - number: '15.3'
    text: |-
      Het is verboden anders dan op een bedrijf op enig moment een groter aantal varkens te houden dan overeenkomt met
      3 varkenseenheden.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel15
  - number: '16'
    text: |-
      Een varkensrecht kan, onder welke titel dan ook, met inachtneming van [artikel 17][ref1] geheel of gedeeltelijk
      overgaan naar een ander bedrijf overeenkomstig de [artikelen 18][ref2] en [19][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0009542#Artikel19
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '17'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0009542
        artikel: '18'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0009542
        artikel: '19'
        hoofdstuk: III
  - number: '17.1'
    text: |-
      Een varkensrecht, of een gedeelte daarvan, afkomstig van een bedrijf gelegen in een concentratiegebied kan overgaan
      naar een in hetzelfde gebied gelegen bedrijf of naar een buiten de concentratiegebieden gelegen bedrijf.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel17
  - number: '17.2'
    text: |-
      Een varkensrecht, of een gedeelte daarvan, afkomstig van een bedrijf gelegen buiten de concentratiegebieden kan
      uitsluitend overgaan naar een buiten de concentratiegebieden gelegen bedrijf.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel17
  - number: '17.3'
    text: |-
      Een bedrijf is gelegen binnen een concentratiegebied, onderscheidenlijk buiten de concentratiegebieden, indien de
      huisvesting waarin de varkens worden of zullen worden gehouden hoofdzakelijk is gelegen binnen het desbetreffende
      concentratiegebied, onderscheidenlijk buiten de concentratiegebieden. Bij ministeriële regeling kunnen nadere
      regels worden gesteld omtrent de wijze waarop wordt bepaald of de huisvesting hoofdzakelijk is gelegen binnen een
      van de concentratiegebieden, dan wel buiten de concentratiegebieden.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel17
  - number: '18.1'
    text: |-
      Degene naar wiens bedrijf het varkensrecht, of een gedeelte daarvan, moet overgaan en degene van wiens bedrijf
      het varkensrecht, of een gedeelte daarvan, afkomstig is, geven van de overgang gezamenlijk kennis aan het Bureau
      Heffingen, met gebruikmaking van een daartoe door Onze Minister vastgesteld formulier, dat overeenkomstig de op het
      formulier aangegeven wijze volledig en naar waarheid is ingevuld en door beide partijen is ondertekend.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel18
  - number: '18.2'
    text: |-
      Er kan eerst aanspraak worden gemaakt op het van het andere bedrijf afkomstige varkensrecht, of een gedeelte
      daarvan, vanaf het tijdstip van registratie van de kennisgeving door het Bureau Heffingen.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel18
  - number: '18.3'
    text: |-
      Op het tijdstip van registratie van de kennisgeving vindt een verkleining plaats van het varkensrecht van het
      bedrijf waarvan het varkensrecht, of een gedeelte daarvan, afkomstig is, en vindt een vergroting plaats van het
      varkensrecht van het bedrijf waarnaar het varkensrecht, of een gedeelte daarvan, overgaat. De verkleining komt
      overeen met het aantal varkenseenheden waarop de kennisgeving betrekking heeft. De vergroting komt overeen met het
      aantal varkenseenheden waarop de kennisgeving betrekking heeft, verminderd met: - 40%, indien de kennisgeving in
      1998 wordt gedaan;
        - 60%, indien de kennisgeving in 1999 wordt gedaan;
        - 25%, indien de kennisgeving na 1999 wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel18
  - number: '18.4'
    text: |-
      De verkleining, onderscheidenlijk vergroting, betreft het fokzeugenrecht voor zover zulks door de betrokken
      partijen bij de kennisgeving is aangegeven.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel18
  - number: '18.5'
    text: |-
      De verkleining, onderscheidenlijk vergroting, betreft het grondgebonden deel van het varkensrecht of het
      grondgebonden deel van het fokzeugenrecht, voorzover zulks door de betrokken partijen bij de kennisgeving
      is aangegeven. Ingeval sprake is van de overgang van een varkensrecht, onderscheidenlijk fokzeugenrecht,
      afkomstig van een bedrijf dat is gelegen in een concentratiegebied naar een bedrijf dat is gelegen buiten
      de concentratiegebieden, betreft de vergroting te allen tijde het grondgebonden deel van het varkensrecht,
      onderscheidenlijk fokzeugenrecht.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel18
  - number: '18.6'
    text: |-
      Voor het lopende jaar is de verkleining, onderscheidenlijk vergroting, van het varkensrecht en het fokzeugenrecht
      beperkt tot het aantal varkenseenheden waarvan de betrokken partijen op het formulier van de kennisgeving hebben
      aangegeven dat deze op het bedrijf waarvan zij afkomstig zijn in dat jaar niet zijn benut voor het houden van
      varkens, onderscheidenlijk fokzeugen.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel18
  - number: '19.1'
    text: |-
      De registratie, bedoeld in [artikel 18][ref1], vindt niet plaats indien:


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel18
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '18'
        hoofdstuk: III
  - number: 19.1.a
    text: |-
      de kennisgeving betrekking heeft op een groter aantal varkenseenheden dan overeenkomt met het varkensrecht,
      onderscheidenlijk fokzeugenrecht, van het bedrijf waarvan de varkenseenheden afkomstig zijn;
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel19
  - number: 19.1.b
    text: |-
      niet is voldaan aan het bepaalde in [artikel 17][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel17
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '17'
        hoofdstuk: III
  - number: 19.1.c
    text: |-
      het formulier, bedoeld in [artikel 18, eerste lid][ref1], niet volledig en naar waarheid is ingevuld en
      ondertekend.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel18
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '18'
        hoofdstuk: III
  - number: '19.2'
    text: |-
      Indien eerst na de registratie blijkt dat niet aan de in het eerste lid bedoelde voorwaarden voor registratie is
      voldaan, wordt de registratie door het Bureau Heffingen doorgehaald. Met terugwerkende kracht tot het tijdstip
      van de registratie vindt een verkleining plaats van het varkensrecht, onderscheidenlijk fokzeugenrecht, van
      het bedrijf waarheen het varkensrecht, of een gedeelte daarvan, is overgegaan met het aantal varkenseenheden
      waarop de kennisgeving betrekking had, en vindt een vergroting plaats van het varkensrecht, onderscheidenlijk
      fokzeugenrecht, van het bedrijf waarvan het varkensrecht, of een gedeelte daarvan, afkomstig was met eenzelfde
      aantal varkenseenheden, althans voor zover de kennisgeving niet betrekking had op een groter aantal varkenseenheden
      dan overeenkwam met het varkensrecht, onderscheidenlijk fokzeugenrecht, van dat bedrijf.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel19
  - number: '19.3'
    text: |-
      De in het tweede lid bedoelde verkleining, onderscheidenlijk vergroting, betreft het grondgebonden deel van
      het varkensrecht, onderscheidenlijk fokzeugenrecht, voorzover de kennisgeving daarop betrekking had. Ingeval de
      kennisgeving betrekking had op een overgang als bedoeld in [artikel 18, vijfde lid, tweede volzin][ref1], betreft
      de verkleining het grondgebonden deel van het varkensrecht, onderscheidenlijk fokzeugenrecht, van het bedrijf
      waarheen het varkensrecht, of een gedeelte daarvan, is overgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel18
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '18'
        hoofdstuk: III
  - number: '20.1'
    text: |-
      In geval van overdracht van een bedrijf kan een verkrijger van het bedrijf eerst aanspraak maken op het
      varkensrecht van dat bedrijf, vanaf het tijdstip van registratie door het Bureau Heffingen van de door de
      vervreemder en de verkrijger van het bedrijf gezamenlijk gedane kennisgeving van overgang van het varkensrecht.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel20
  - number: '20.2'
    text: |-
      Op het tijdstip van registratie van de kennisgeving worden het varkensrecht en het fokzeugenrecht verminderd met: -
      40%, indien de kennisgeving in 1998 wordt gedaan;
        - 60%, indien de kennisgeving in 1999 wordt gedaan;
        - 25%, indien de kennisgeving na 1999 wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel20
  - number: '20.3'
    text: |-
      De [artikelen 18, eerste lid][ref1], en [19, eerste lid, onderdeel c][ref2], zijn op de kennisgeving en
      registratie, bedoeld in het eerste lid, van overeenkomstige toepassing. Indien de kennisgeving niet binnen drie
      maanden na de overdracht is gedaan, komt het varkensrecht te vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel19
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '18'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0009542
        artikel: '19'
        hoofdstuk: III
  - number: '20.4'
    text: |-
      Dit artikel is niet van toepassing op een overdracht aan een persoon waarmee bloed- of aanverwantschap in de eerste
      graad bestaat en evenmin op een overdracht krachtens erfrecht of huwelijksvermogensrecht.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel20
  - number: '21.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen in afwijking van de in [artikel 18, derde lid][ref1], en
      [artikel 20, tweede lid][ref2], genoemde percentages andere percentages worden vastgesteld. De bij de maatregel
      vastgestelde percentages zijn van toepassing op kennisgevingen die zijn gedaan na het tijdstip van inwerkingtreding
      van de maatregel.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel20
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '18'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0009542
        artikel: '20'
        hoofdstuk: III
  - number: '21.2'
    text: |-
      Bij een algemene maatregel van bestuur als bedoeld in het eerste lid kunnen voor verschillende groepen van gevallen
      de percentages verschillend worden vastgesteld. De percentages kunnen tevens verschillend worden vastgesteld al
      naar gelang de kennisgeving de overgang van het fokzeugenrecht betreft dan wel het deel van het varkensrecht niet
      zijnde fokzeugenrecht. Bij de maatregel kunnen omtrent de groepen van gevallen nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel21
  - number: '21.3'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de toekenning van een financiële tegemoetkoming voor de in
      [artikel 18, derde lid][ref1], en [artikel 20, tweede lid][ref2], bedoelde verminderingen aan de belanghebbende van
      wiens bedrijf het varkensrecht, of een gedeelte daarvan, afkomstig is, onderscheidenlijk aan de belanghebbende die
      het bedrijf overdraagt, voor zover de desbetreffende kennisgeving in 1998 of 1999 wordt gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel20
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '18'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0009542
        artikel: '20'
        hoofdstuk: III
  - number: '22.1'
    text: |-
      In afwijking van [artikel 228 van Boek 3 van het Burgerlijk Wetboek][ref1] kan op varkensrechten geen pandrecht
      worden gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel228
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '228'
  - number: '22.2'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat alvorens het Bureau Heffingen de in
      [artikel 18, eerste lid][ref1], bedoelde kennisgeving in behandeling neemt, van deze kennisgeving mededeling wordt
      gedaan aan in die regeling aan te geven derde-belanghebbenden.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel18
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '18'
        hoofdstuk: III
  - number: '22.3'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de uitvoering van het tweede lid,
      waarbij onder meer kan worden bepaald welke gegevens door het Bureau Heffingen aan de derde-belanghebbenden
      kenbaar worden gemaakt, de periode gedurende welke het Bureau Heffingen de in [artikel 18, eerste lid][ref1],
      bedoelde kennisgeving niet in behandeling neemt, alsmede de wijze waarop en de termijn waarbinnen de
      in de regeling aangegeven derde-belanghebbenden zich bij het Bureau Heffingen dienen aan te melden. Bij
      de ministeriële regeling kan worden bepaald dat een aanmelding die is gedaan op grond van de krachtens
      [artikel 12, derde lid, van de Wet verplaatsing mestproductie][ref2] gestelde regels tevens in aanmerking wordt
      genomen voor de toepassing van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0006285#Artikel12
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '18'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0006285
        artikel: '12'
  - number: '23.1'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat een kennisgeving als bedoeld in [artikel 18, eerste lid][ref1],
      een kennisgeving als bedoeld in [artikel 20, eerste lid][ref2], of een aanmelding als bedoeld in
      [artikel 22, derde lid][ref3], eerst door het Bureau Heffingen in behandeling wordt genomen nadat een daarvoor
      vastgesteld bedrag is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0009542#Artikel22
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '18'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0009542
        artikel: '20'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0009542
        artikel: '22'
        hoofdstuk: III
  - number: '23.2'
    text: |-
      Al naar gelang sprake is van een kennisgeving als bedoeld in [artikel 18, eerste lid][ref1], van een kennisgeving
      als bedoeld in [artikel 20, eerste lid][ref2], of van een aanmelding als bedoeld in [artikel 22, derde lid][ref3],
      kan het bedrag verschillend worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0009542#Artikel22
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '18'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0009542
        artikel: '20'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0009542
        artikel: '22'
        hoofdstuk: III
  - number: '24.1'
    text: |-
      In plaats van het in de [artikelen 6][ref1], [7][ref2] en [11][ref3] genoemde percentage van 10 geldt een lager
      percentage en in plaats van het in de [artikelen 8 tot en met 13][ref4] en [14a][ref5] genoemde percentage van 90
      geldt een hoger percentage voor bedrijven die vanaf 9 juli 1997 tot het tijdstip van inwerkingtreding van deze wet
      aan een of meer van de volgende voorwaarden voldeden:


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0009542#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0009542#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0009542#Artikel14a
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '6'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0009542
        artikel: '7'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0009542
        artikel: '11'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0009542
        artikel: '8'
        hoofdstuk: II
      - id: ref5
        bwb_id: BWBR0009542
        artikel: 14a
        hoofdstuk: II
  - number: 24.1.a
    text: op het bedrijf werden fokzeugen in groepshuisvesting gehouden;
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel24
  - number: 24.1.b
    text: |-
      het bedrijf was bij het Productschap voor Vee en Vlees te Rijswijk als houder van scharrelvarkens geregistreerd en
      voldeed aan de in dat verband door het productschap gestelde voorwaarden;
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel24
  - number: 24.1.c
    text: |-
      het bedrijf paste biologische productiemethoden toe en was onderworpen aan controle door een controle-organisatie
      voor biologische landbouw;
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel24
  - number: 24.1.d
    text: het bedrijf beschikte over een groen-labelstal;
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel24
  - number: 24.1.e
    text: op het bedrijf rustte, blijkens de registratie van het Bureau Heffingen, geen niet-gebonden mestproductierecht.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel24
  - number: '24.2'
    text: |-
      Het percentage van 10 wordt verminderd met, onderscheidenlijk het percentage van 90 wordt vermeerderd met: -
      indien is voldaan aan de in onderdeel a van het eerste lid genoemde voorwaarde, het aantal procentpunten dat wordt
      bepaald door 5 te vermenigvuldigen met het aantal in groepshuisvesting gehouden fokzeugen, en te delen door het
      varkensrecht zoals dit zonder toepassing van dit artikel zou gelden;
        - indien is voldaan aan de in de onderdelen a en b van het eerste lid genoemde voorwaarden, 5 procentpunten;
        - indien is voldaan aan de in onderdeel c van het eerste lid genoemde voorwaarde, 10 procentpunten;
        - indien is voldaan aan de in onderdeel d van het eerste lid genoemde voorwaarde, 5 procentpunten of, indien dit
      minder is, het aantal procentpunten dat wordt bepaald door 5 te vermenigvuldigen met het aantal varkens dat in
      groen-label-stallen kan worden gehuisvest en te delen door het varkensrecht zoals dit zonder toepassing van dit
      artikel zou gelden;
        - indien is voldaan aan de in onderdeel e van het eerste lid genoemde voorwaarde, 10 procentpunten. Het
      percentage van 10 wordt met ten hoogste 10 procentpunten verlaagd. Het percentage van 90 wordt met ten hoogste 10
      procentpunten verhoogd.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel24
  - number: '24.3'
    text: |-
      De verlaging van het percentage van 10, onderscheidenlijk de verhoging van het percentage van 90, is uitsluitend
      van toepassing op daartoe aangemelde bedrijven die aan de in het eerste lid, onderdelen a, b, c of d, genoemde
      voorwaarden voldoen en dat door overlegging van bescheiden hebben aangetoond. [Artikel 7, derde lid][ref1], is
      op deze melding van overeenkomstige toepassing. Bij gebreke van een overeenkomstig [artikel 7, derde lid][ref2],
      gedane melding wordt het percentage van 10 niet verlaagd, onderscheidenlijk wordt het percentage van 90 niet
      verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel7
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '7'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0009542
        artikel: '7'
        hoofdstuk: II
  - number: '24.4'
    text: Het verstrekken van onjuiste gegevens bij de in het derde lid bedoelde melding is een strafbaar feit.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel24
  - number: '24.5'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld voor de toepassing van dit artikel, waarbij onder
      meer aan de toepasselijkheid van het eerste en tweede lid nadere voorwaarden kunnen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel24
  - number: '25'
    text: |-
      Bij algemene maatregel van bestuur kunnen, voor bepaalde groepen van gevallen waarbij de bepaling van de
      hoogte van het varkensrecht of fokzeugenrecht overeenkomstig [hoofdstuk II][ref1] en [artikel 24][ref2]
      leidt tot onbillijkheden van overwegende aard, regels worden gesteld omtrent een van [hoofdstuk II][ref3]
      en [artikel 24][ref4] afwijkende bepaling van de hoogte van deze rechten. Bij deze regels kunnen nadere
      voorwaarden en beperkingen worden gesteld, waaronder een verplichte doorhaling van gegevens als bedoeld in
      [artikel 7, derde lid, van de Meststoffenwet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0009542#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0009542#HoofdstukII
      [ref4]: https://wetten.overheid.nl/BWBR0009542#Artikel24
      [ref5]: https://wetten.overheid.nl/BWBR0004054#Artikel7
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0009542
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0009542
        artikel: '24'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0009542
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0009542
        artikel: '24'
        hoofdstuk: IV
      - id: ref5
        bwb_id: BWBR0004054
        artikel: '7'
  - number: '26.1'
    text: |-
      In bij ministeriële regeling bepaalde gevallen kan Onze Minister het varkensrecht en het fokzeugenrecht van een
      bedrijf ambtshalve vaststellen.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel26
  - number: '26.2'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de in het eerste lid bedoelde vaststelling.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel26
  - number: '27.1'
    text: |-
      Onze Minister kan ten aanzien van een bedrijf waarvan het varkensrecht is overschreden bepalen dat het op enig
      moment op het bedrijf gehouden aantal varkens, onderscheidenlijk fokzeugen, het door hem vastgestelde aantal niet
      mag overschrijden.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel27
  - number: '27.2'
    text: |-
      Het door Onze Minister vastgestelde aantal varkens, onderscheidenlijk fokzeugen, dat op enig moment ten hoogste
      mag worden gehouden komt overeen met het aantal varkens, onderscheidenlijk fokzeugen, dat overeenkomstig het
      varkensrecht, onderscheidenlijk fokzeugenrecht, gemiddeld gedurende het jaar mag worden gehouden. Dit aantal wordt
      vermeerderd met 10%.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel27
  - number: '27.3'
    text: |-
      Onverminderd [artikel 15][ref1], is het verboden op enig moment op een bedrijf een groter aantal varkens,
      onderscheidenlijk fokzeugen, te houden dan het overeenkomstig het eerste en tweede lid door Onze Minister bepaalde
      aantal.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel15
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '15'
        hoofdstuk: III
  - number: '27.4'
    text: |-
      Voor zolang Onze Minister met betrekking tot een bedrijf gebruik maakt van de in het eerste lid bedoelde
      bevoegdheid vindt geen registratie als bedoeld in de [artikelen 18][ref1] en [19][ref2] plaats van een kennisgeving
      die betrekking heeft op het op het desbetreffende bedrijf rustende varkensrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel19
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '18'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0009542
        artikel: '19'
        hoofdstuk: III
  - number: '27.5'
    text: |-
      De in het eerste lid bedoelde bevoegdheid kan met betrekking tot een bedrijf voor een aaneengesloten periode van
      ten hoogste drie jaar worden uitgeoefend. Deze periode kan telkens worden verlengd met eenzelfde periode te rekenen
      vanaf het tijdstip waarop wordt geconstateerd dat op het bedrijf een groter aantal varkens wordt gehouden dan
      overeenkomt met het overeenkomstig het eerste en tweede lid door Onze Minister bepaalde aantal.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel27
  - number: '28'
    text: |-
      Onze Minister is bevoegd tot toepassing van bestuursdwang ter handhaving van de bij of krachtens deze wet gestelde
      verplichtingen.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel28
  - number: '29.1'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent het opmaken, bewaren, overleggen en afdragen van
      gegevens door houders van varkens, daaronder begrepen personen, rechtspersonen en samenwerkingsverbanden van
      personen of rechtspersonen die de varkens tijdelijk in het kader van een onderneming, niet zijnde een bedrijf,
      onder zich hebben, met betrekking tot het door hen gehouden, verhandelde, ontvangen of afgeleverde aantal varkens,
      onderscheiden naar diercategorieën.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel29
  - number: '29.2'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de berekening van het aantal varkens dat gedurende een jaar
      gemiddeld op het bedrijf is gehouden, alsmede omtrent de daartoe op te maken, te bewaren, over te leggen of af te
      dragen gegevens.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel29
  - number: '29.3'
    text: |-
      Bij ministeriële regeling kunnen voor de toepassing van [hoofdstuk III][ref1] en [artikel 27 van deze wet][ref2]
      regels worden gesteld omtrent het opmaken, bewaren, overleggen of afdragen van gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel27
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0009542
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0009542
        artikel: '27'
        hoofdstuk: IV
  - number: '29.4'
    text: Handelen in strijd met krachtens dit artikel gestelde regels is een strafbaar feit.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel29
  - number: '30'
    text: |-
      De belanghebbende, bedoeld in [artikel 5, eerste lid, onderdeel j][ref1], kan met gebruikmaking van een daartoe
      door Onze Minister vastgesteld formulier, dat overeenkomstig de op het formulier aangegeven wijze volledig en naar
      waarheid is ingevuld en door hem is ondertekend, een kennisgeving van het vervallen, onderscheidenlijk gedeeltelijk
      vervallen, van het varkensrecht van zijn bedrijf bij het Bureau Heffingen doen. Na registratie van de kennisgeving
      door het Bureau Heffingen is het varkensrecht nihil, onderscheidenlijk vindt een verkleining van het varkensrecht
      en het fokzeugenrecht plaats met het desbetreffende aantal varkenseenheden waarop de kennisgeving betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel5
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '5'
        hoofdstuk: II
  - number: '33'
    text: |-
      Indien in deze wet geregelde onderwerpen in het belang van een goede uitvoering van de wet nadere regeling
      behoeven, kan deze geschieden bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel33
  - number: '34'
    text: |-
      Tegen een op grond van deze wet genomen besluit kan een belanghebbende beroep instellen bij het College van Beroep
      voor het bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel34
  - number: '35.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel35
  - number: '35.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel35
  - number: '36'
    text: |-
      Er is een structuurschema dat inzicht geeft in de ruimtelijke aspecten van het rijksbeleid inzake de
      varkenshouderij, rekening houdend met in ieder geval de belangen van diergezondheid, natuur, water en landschap.
      Het structuurschema is een plan als bedoeld in [artikel 2a van de Wet op de Ruimtelijke Ordening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel2a
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: 2a
  - number: '40.1'
    text: |-
      Onze Minister zendt binnen drie jaar na de inwerkingtreding van deze wet, en vervolgens telkens na vijf jaar, aan
      de Staten-Generaal een verslag over de doeltreffendheid en de effecten van de [hoofdstukken I tot en met IV][ref1]
      van deze wet in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#HoofdstukI
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0009542
        hoofdstuk: I
  - number: '40.2'
    text: |-
      Onze Minister zendt jaarlijks na de inwerkingtreding van deze wet aan de Staten-Generaal een voortgangsverslag over
      de toepassing en de uitvoering van de [hoofdstukken I tot en met IV][ref1] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#HoofdstukI
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0009542
        hoofdstuk: I
  - number: '41.1'
    text: |-
      Indien [artikel 15][ref1] op een andere datum dan 1 januari in werking treedt, wordt voor de toepassing van het
      eerste en tweede lid van dat artikel in het desbetreffende jaar in de genoemde artikelleden in plaats van «jaar»
      telkens gelezen: het vanaf het tijdstip van inwerkingtreding van dit artikel resterende deel van het jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel15
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '15'
        hoofdstuk: III
  - number: '41.2'
    text: |-
      Indien [artikel 38][ref1] op een andere datum dan 1 januari in werking treedt, wordt in het desbetreffende jaar
      voor de toepassing van [artikel 55, eerste lid, van de Meststoffenwet][ref2] onder uitbreiding van de productie
      van dierlijke meststoffen verstaan: een grotere productie dan het op de dag voorafgaande aan het tijdstip van
      inwerkingtreding van [artikel 38][ref3] geldende mestproductierecht, dat achtereenvolgens is vermenigvuldigd
      met het op het tijdstip van inwerkingtreding van [artikel 38][ref4] in het desbetreffende jaar verstreken aantal
      maanden gedeeld door twaalf, en is vermeerderd met het op 31 december van het desbetreffende jaar geldende
      mestproductierecht dat is vermenigvuldigd met het sedert het tijdstip van inwerkingtreding van [artikel 38][ref5]
      in het desbetreffende jaar verstreken aantal maanden gedeeld door twaalf.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel55
      [ref3]: https://wetten.overheid.nl/BWBR0009542#Artikel38
      [ref4]: https://wetten.overheid.nl/BWBR0009542#Artikel38
      [ref5]: https://wetten.overheid.nl/BWBR0009542#Artikel38
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '38'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '55'
      - id: ref3
        bwb_id: BWBR0009542
        artikel: '38'
        hoofdstuk: V
      - id: ref4
        bwb_id: BWBR0009542
        artikel: '38'
        hoofdstuk: V
      - id: ref5
        bwb_id: BWBR0009542
        artikel: '38'
        hoofdstuk: V
  - number: '41.3'
    text: |-
      Voor de toepassing van [artikel 13][ref1] en het tweede lid en voor de toepassing van
      [artikel 55a, eerste lid, van de Meststoffenwet][ref2] worden ingeval in het betreffende kalenderjaar wijzigingen
      in de tot het bedrijf behorende oppervlakte landbouwgrond hebben plaatsgevonden of verplaatsing als bedoeld in
      [artikel 1 van de Wet verplaatsing mestproduktie][ref3] heeft plaatsgevonden, de gevolgen daarvan voor de omvang
      van het in die bepalingen bedoelde niet-gebonden mestproductierecht voor varkens en kippen bepaald overeenkomstig
      de regels van [artikel 55 van de Meststoffenwet][ref4] en overeenkomstig de regels gesteld bij of krachtens
      de [Wet verplaatsing mestproductie][ref5], alsof het de bepaling van het op de eerste dag van een kalenderjaar
      geldende niet-gebonden mestproductierecht zou betreffen en de bedoelde wijzigingen of verplaatsing zich zouden
      hebben voorgedaan in het voorafgaande kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel55a
      [ref3]: https://wetten.overheid.nl/BWBR0006285#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0004054#Artikel55
      [ref5]: https://wetten.overheid.nl/BWBR0006285
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '13'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0004054
        artikel: 55a
      - id: ref3
