preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is uitvoering te geven aan richtlijn nr. 91/676/EEG van
    de Raad van de Europese Gemeenschappen van 12 december 1991 inzake de bescherming van water tegen verontreiniging
    door nitraten uit agrarische bronnen (PbEG L 375), en dat het ook overigens zowel in het belang van het milieu en
    de ruimtelijke kwaliteit als in het belang van dierenwelzijn en diergezondheid, wenselijk is regels te stellen met
    het oog op een herstructurering van de varkenshouderij en daarbij een stelsel van varkensrechten en een heffing ter
    zake van het houden van varkens in te voeren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#ArtikelAanhef
