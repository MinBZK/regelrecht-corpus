      - id: ref3
        bwb_id: BWBR0009542
        artikel: '10'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0009542
        artikel: '10'
        hoofdstuk: II
  - number: '8.1'
    text: |-
      Bij gebreke van enige opgave als bedoeld in de [artikelen 6, vierde lid][ref1], en [7, tweede lid][ref2], komt
      het varkensrecht van het bedrijf overeen met 90% van het aantal varkenseenheden dat wordt bepaald door het door de
      belanghebbende daartoe bij wijze van melding aangegeven deel van het niet-gebonden mestproductierecht voor varkens
      en kippen geldend met betrekking tot 1996 te delen door 7,4 kilogram fosfaat en op de uitkomst 18% in mindering
      te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel7
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '6'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0009542
        artikel: '7'
        hoofdstuk: II
  - number: '8.2'
    text: |-
      Het fokzeugenrecht van het in het eerste lid bedoelde bedrijf komt overeen met een percentage van het varkensrecht,
      welk percentage wordt bepaald door het in 1994 gemiddeld op het bedrijf gehouden aantal fokzeugen te delen door
      het in 1994 gemiddeld op het bedrijf gehouden aantal varkens en de uitkomst te vermenigvuldigen met 100. De in de
      eerste volzin bedoelde aantallen fokzeugen en varkens zijn de aantallen die met betrekking tot het bedrijf zijn
      opgegeven in de aangifte overschotheffing die betrekking heeft op het jaar 1994. Bij gebreke van deze opgave is het
      fokzeugenrecht nihil.
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel8
  - number: '8.3'
    text: |-
      [Artikel 7, derde lid][ref1], is op de melding, bedoeld in het eerste lid, van overeenkomstige toepassing. Bij
      gebreke van een overeenkomstig [artikel 7, derde lid][ref2], gedane melding, is het varkensrecht nihil.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel7
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '7'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0009542
        artikel: '7'
        hoofdstuk: II
  - number: '8.4'
    text: |-
      In geval in 1996 of 1995 het bedrijf is overgedragen, wordt, indien de belanghebbende overeenkomstig
      [artikel 7, derde lid][ref1] een melding doet, voor de toepassing van het eerste lid onder het ontbreken van een
      opgave als bedoeld in [artikel 6, vierde lid][ref2], onderscheidenlijk [artikel 7, tweede lid][ref3], mede verstaan
      het geval dat met betrekking tot het desbetreffende jaar hetzij door de vervreemder, hetzij door de verkrijger geen
      opgave is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0009542#Artikel7
    url: https://wetten.overheid.nl/BWBR0009542/2004-09-01#Artikel8
    references:
