  - number: XIX
    text: |-
      1 De bepaling van [artikel XIV, onderdeel A][ref1] is niet van toepassing op de arbeidsverhoudingen van personen:

      a. die op de dag vóór de inwerkingtreding van deze wet ongeschikt zijn tot het verrichten van hun arbeid wegens
      ziekte, zolang die ongeschiktheid duurt; of

      b. van wie de ongeschiktheid tot het verrichten van hun arbeid wegens ziekte intreedt op of na de datum van
      inwerkingtreding van deze wet en tevens binnen vier weken nadat een vóór die inwerkingtreding gelegen periode van
      ongeschiktheid door herstel is geëindigd, zolang die ongeschiktheid duurt.

      2 Voor de toepassing van het eerste lid wordt de ongeschiktheid tot het verrichten van arbeid wegens ziekte geacht
      niet te zijn onderbroken wanneer perioden van ongeschiktheid elkaar met een onderbreking van minder dan vier weken
      opvolgen.


      [ref1]: https://wetten.overheid.nl/BWBR0006355#ArtikelXIV
