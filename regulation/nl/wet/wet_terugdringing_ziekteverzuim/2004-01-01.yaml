  - number: XVI
    text: |-
      1 De inwerkingtreding van deze wet heeft geen gevolgen voor het recht op ziekengeld van de verzekerde:

      a. die op de dag vóór de inwerkingtreding van deze wet ongeschikt is tot het werken wegens ziekte, zolang die
      ongeschiktheid duurt; of

      b. wiens ongeschiktheid tot het werken wegens ziekte intreedt op of na de datum van inwerkingtreding van deze wet
      en tevens binnen vier weken nadat een vóór die inwerkingtreding gelegen periode van ongeschiktheid door herstel is
      geëindigd, zolang die ongeschiktheid duurt.

      2 Voor de toepassing van het eerste lid wordt de ongeschiktheid tot het werken wegens ziekte geacht niet te zijn
      onderbroken wanneer perioden van ongeschiktheid elkaar met een onderbreking van minder dan vier weken opvolgen.
    url: https://wetten.overheid.nl/BWBR0006355/2004-01-01#ArtikelXVI
  - number: XVII
    text: |-
      1 [Artikel 57 van de Ziektewet][ref1] blijft voor door de bedrijfsvereniging op grond van dat artikel getroffen en
      door de Minister van Sociale Zaken en Werkgelegenheid goedgekeurde besluiten van kracht tot 1 juli 1994.

      2 De op grond van [artikel 54 van de Ziektewet][ref2] getroffen regelingen en overeenkomsten inzake hogere, langere
      of andere uitkeringen blijven van kracht tot 1 juli 1994.

      3 In de gevallen waarin het eerste lid toepassing vindt blijven de [artikelen 1][ref3],
      7*a* en [57 van de Wet op de arbeidsongeschiktheidsverzekering][ref4], de
      artikelen 1 en 48 van de Algemene Arbeidsongeschiktheidswet, [artikel 3][ref5] en
      [artikel 3 van de Wet arbeidsongeschiktheidsvoorziening militairen][ref6], zoals deze luidden vóór het tijdstip van
      inwerkingtreding van deze wet, van kracht.


