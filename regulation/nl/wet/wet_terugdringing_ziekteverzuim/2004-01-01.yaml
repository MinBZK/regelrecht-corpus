preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is door een vergroting van de financiële betrokkenheid
    van werkgevers en werknemers in de marktsector en bij de overheid het ziekteverzuim terug te dringen en daartoe
    de Ziektewet, het Burgerlijk Wetboek en enkele andere wetten te wijzigen en een regeling te treffen voor het
    overheidspersoneel;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006355/2004-01-01#ArtikelAanhef
articles:
  - number: XV
    text: |-
      1 Voor personen in dienst van staat, provincie, gemeente, waterschap of enig ander publiekrechtelijk lichaam dan
      wel van de NV Nederlandse Spoorwegen gelden de navolgende bepalingen.

      2 Bij verhindering wegens ongeschiktheid ten gevolge van ziekte, zwangerschap of bevalling om zijn dienst
      te verrichten of zijn ambt te vervullen bestaat gedurende een tijdvak van 104 weken aanspraak op 70% van de
      bezoldiging als bedoeld in de zin van het [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1] dan wel
      van hetgeen daarmee overeenkomt, voor zover deze bezoldiging niet meer bedraagt dan hetgeen overeenkomt met het
      maximum dagloon, bedoeld in [artikel 9, eerste lid, van de Coördinatiewet Sociale Verzekering][ref2]. De aanspraak
      bedraagt de eerste 52 weken echter minimaal het bedrag van het minimumloon dat voor betrokkene zou gelden indien
      de [Wet minimumloon en minimumvakantiebijslag][ref3] op hem van toepassing zou zijn. De eerste twee volzinnen zijn
      van overeenkomstige toepassing voor zover in verband met ziekte, zwangerschap of bevalling ook na ontslag aanspraak
      bestaat op betaling van bezoldiging of van hetgeen daarmee overeenkomt.

      3 Is de bezoldiging of hetgeen daarmee overeenkomt, op een andere wijze dan naar tijdruimte vastgesteld, dan zijn
      de bepalingen van dit artikel van toepassing met dien verstande, dat als bezoldiging wordt beschouwd de gemiddelde
      bezoldiging die betrokkene, wanneer hij niet verhinderd was geweest, gedurende die tijd had kunnen verdienen.

      4 Van het tweede lid kan bij algemeen verbindend voorschrift ten nadele van betrokkene slechts in zoverre worden
      afgeweken dat betrokkene voor de eerste twee dagen van het in het tweede lid bedoelde tijdvak van 104 weken geen
      aanspraak heeft op bezoldiging of hetgeen daarmee overeenkomt.

      5 In afwijking van het tweede lid heeft de vrouwelijke werknemer de in dat lid bedoelde aanspraak
      niet gedurende de periode dat zij zwangerschaps- of bevallingsverlof geniet overeenkomstig
      [artikel 3:1, tweede en derde lid, van de Wet arbeid en zorg][ref4].

      6 Voor de toepassing van het tweede en vierde lid worden perioden waarin betrokkene wegens ongeschiktheid ten
      gevolge van ziekte, zwangerschap of bevalling verhinderd is om zijn dienst te verrichten of zijn ambt te vervullen,
      samengeteld indien zij elkaar met een onderbreking van minder dan vier weken opvolgen. Bij de vaststelling van de
      periode van vier weken blijven perioden, waarin zwangerschaps- of bevallingsverlof wordt genoten overeen-komstig
      [artikel 3:1, tweede en derde lid, van de Wet arbeid en zorg][ref5], buiten beschouwing.

      7 Het tweede lid is niet van toepassing op zakgeldgenietenden.

      8 Bij algemeen verbindend voorschrift kan worden bepaald dat de aanspraak bedoeld in het tweede lid niet bestaat
      indien:

      a. de ziekte is voorgewend, althans zodanig overdreven voorgesteld, dat reden voor verhindering niet kan worden
      aangenomen;

      b. de verhindering het gevolg is van een ziekte of gebrek waarover betrokkene bij het aangaan van de
      arbeidsverhouding opzettelijk valse inlichtingen aan de werkgever heeft verstrekt.

      9 Bij algemeen verbindend voorschrift kan worden bepaald dat de aanspraak bedoeld in het tweede lid vervalt wanneer
      en voor zolang betrokkene:

      a. weigert zich te onderwerpen aan een onderzoek vanwege de bedrijfsgeneeskundige of een daarmee gelijk te stellen
      geneeskundige of, na voor zulk een onderzoek te zijn opgeroepen, zonder geldige reden niet verschijnt;

      b. weigert de volledige medewerking bedoeld in [artikel P8, eerste lid van de Algemene burgerlijke pensioenwet
      (Stb. 1986, 540)](onbekend) dan wel een daarmee overeenkomende bepaling, te verlenen;

      c. zonder voldoende gronden nalaat zich onder behandeling van een geneeskundige te stellen of blijven stellen, dan
      wel zich niet houdt aan de voorschriften hem door de behandelende geneeskundige gegeven, met dien verstande dat te
      dezen voorschriften tot het verlenen van medewerking aan een ingreep van heelkundige aard zijn uitgezonderd;

      d. zich zodanig gedraagt, dat zijn genezing wordt belemmerd of vertraagd;

      e. tijdens de verhindering dienst te verrichten voor zichzelf of voor derden arbeid verricht, tenzij dit door de
      bedrijfsgeneeskundige of een daarmee gelijk te stellen geneeskundige in het belang van zijn genezing wenselijk
      wordt geacht;

      f. in gebreke blijft op het door de bedrijfsgeneeskundige of een daarmee gelijk te stellen geneeskundige bepaalde
      tijdstip en in de door deze bepaalde mate zijn dienst te hervatten, tenzij hij daarvoor een inmiddels opgekomen,
      door deze als geldig erkende reden heeft opgegeven;

      g. weigert passende arbeid te verrichten welke door het bevoegd gezag wordt opgedragen en waartoe hij door de
      bedrijfsgeneeskundige of een daarmee gelijk te stellen geneeskundige in staat wordt geacht;

      h. zonder deugdelijke grond weigert mee te werken aan door de werkgever of een door hem aangewezen deskundige
      gegeven redelijke voorschriften of getroffen maatregelen die erop gericht zijn om de betrokkene in staat te stellen
      passende arbeid te verrichten.

      i. zonder deugdelijke grond weigert mee te werken aan het opstellen, evalueren en bijstellen van een plan van
      aanpak als bedoeld in [artikel 71a, tweede lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref6].

      10 Bij algemeen verbindend voorschrift kan worden bepaald dat de aanspraak bedoeld in het tweede lid geheel of ten
      dele vervallen kan worden verklaard indien betrokkene de voor hem terzake van afwezigheid tijdens ziekte gestelde
      voorschriften overtreedt.

      11 De aanspraak bedoeld in het tweede lid wordt verminderd met:

      a. het bedrag van de vergoeding of uitkering welke betrokkene geniet krachtens een wettelijk voorgeschreven
      verzekering;

      b. het bedrag van de bezoldiging of het loon, door betrokkene in of buiten dienstbetrekking genoten voor
      werkzaamheden die hij heeft verricht gedurende de tijd dat hij zijn dienst had kunnen verrichten of zijn ambt had
      kunnen vervullen, zo hij daartoe wegens ziekte niet verhinderd was geweest.

      12 Algemeen verbindende voorschriften waarin niet een speciale regeling is getroffen voor de aanspraken bij ziekte
      op bezoldiging of hetgeen daarmee overeenkomt gelden voor de toepassing van het vierde lid als voorschriften
      waarbij van het tweede lid wordt afgeweken.

      13 Indien betrokkene voor de aanvang van zijn dienstbetrekking of ambtsvervulling een overeenkomst had gesloten tot
      verzekering van de geldelijke gevolgen van verhindering tot werken wegens ziekte, mag hij die overeenkomst, voor
      zover hij daaraan rechten kan ontlenen die gelijkwaardig zijn aan die welke voor hem uit dit artikel voortvloeien,
      voor het vervolg, echter niet eerder dan met ingang van de aanvang van de dienstbetrekking of ambtsvervulling
      opzeggen. De door betrokkene vooruitbetaalde premie wordt door de verzekeraar naar gelang van het opgezegde
      gedeelte van de overeenkomst terugbetaald, onder aftrek van ten hoogste 25% van het terug te betalen bedrag voor
      administratiekosten.

      14 Het tijdvak van 104 weken, bedoeld in de eerste volzin van het tweede lid, wordt verlengd:

      a. met de duur van de vertraging indien de werkgever de aangifte, bedoeld in
      [artikel 38, eerste lid, van de Ziektewet][ref7] later doet dan op grond van dat artikel van de [Ziektewet][ref8]
      is voorgeschreven.;

      b. met de duur van de verlenging van de wachttijd, bedoeld in
      [artikel 19, eerste lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref9], indien de wachttijd op grond
      van het zevende lid van dat artikel wordt verlengd; en

      c. met de duur van het tijdvak, dat het Uitvoeringsinstituut werknemersverzekeringen op grond van
      [artikel 71a, negende lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref10] heeft vastgesteld.


