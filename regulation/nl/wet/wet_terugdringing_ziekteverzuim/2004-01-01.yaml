  - number: XXIII
    text: |-
      1 Het Landelijk instituut sociale verzekeringen is bevoegd tegen kostprijs werkzaamheden te verrichten in
      opdracht of ten behoeve van een dienst als bedoeld in artikel 17, eerste lid, onderdelen *a* en *c*, van de
      Arbeidsomstandighedenwet.

      2 De werkzaamheden als bedoeld in het eerste lid kunnen slechts betrekking hebben op de uit artikel 4*a* van de
      Arbeidsomstandighedenwet voortvloeiende taken, voor zover die taken voor 1 mei 1993 door de bedrijfsverenigingen of
      uitvoeringsinstellingen werden verricht.

      3 De bevoegdheid als bedoeld in het eerste lid vervalt met ingang van 1 januari 1998.
