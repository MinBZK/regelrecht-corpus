  - number: XVIII
    text: |-
      1 Degene die op grond van [artikel XVII][ref1] aanspraken heeft verkregen die voortvloeien uit [artikel 57][ref2]
      of [artikel 54 van de Ziektewet][ref3] behoudt deze aanspraken, indien:

      a. hij op 30 juni 1994 ongeschikt is tot werken wegens ziekte, zolang die ongeschiktheid duurt; of

      b. de ongeschiktheid tot het werken wegens ziekte intreedt na 30 juni 1994 en tevens binnen vier weken nadat een
      vóór die dag gelegen periode van ongeschiktheid door herstel is geëindigd, zolang die ongeschiktheid duurt.

      2 Artikel XVI, tweede lid, en, voor zoveel nodig, artikel XVII, derde lid, zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006355#ArtikelXVII
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel57
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel54
