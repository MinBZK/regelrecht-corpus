  - number: '345'
    text: |-
      1 Tot een maand nadat alle partijen bij de splitsing de nederlegging van het voorstel tot splitsing hebben
      aangekondigd kan iedere schuldeiser of contractuele wederpartij van zulk een partij, alsmede iedere bijzonder
      rechthebbende in de zin van [artikel 349][ref1], door een verzoekschrift bij de rechter in eerste aanleg van de
      statutaire zetel van zulk een partij tegen een aangekondigde splitsing in verzet komen op de grond dat het voorstel
      ten aanzien van zijn rechtsverhouding strijdt met [artikel 344][ref2] of dat hij anderszins in zijn positie als
      crediteur, contractuele wederpartij of bijzonder rechthebbende wordt geschaad. In voorkomende gevallen vermeldt het
      verzoekschrift welke zekerheid, waarborg, contractswijziging, ontbinding of schadevergoeding wordt verlangd.

      2 Voordat de rechter beslist, kan hij de partijen bij de splitsing in de gelegenheid stellen binnen een door
      hem gestelde termijn een door hem omschreven wijziging in het voorstel tot splitsing aan te brengen en het
      gewijzigde voorstel overeenkomstig [artikel 342][ref3] openbaar te maken. Oordeelt hij dat het verzet om een andere
      aangevoerde reden gegrond is dan bepaalt hij de door een of meer bij de splitsing betrokken partijen of een derde
      te stellen zekerheid of waarborg of te betalen schadevergoeding, dan wel de contractswijziging of -ontbinding die
      zal gelden wanneer de splitsing tot stand komt. Aan een contractswijziging of -ontbinding kan hij een per de datum
      van de splitsing ingaande, op een of meer partijen rustende verplichting tot schadevergoeding verbinden.

      3 De in [artikel 347][ref4] bedoelde akte van splitsing mag niet worden verleden voordat het verzet is ingetrokken,
      de beslissing waarbij het verzet ongegrond is verklaard uitvoerbaar is of, bij gegrondverklaring om een andere
      reden dan schending van [artikel 344][ref5], de vastgestelde zekerheid of waarborg is gesteld.

      4 Indien de akte van splitsing al is verleden, kan de rechter op een ingesteld rechtsmiddel:

      a. bevelen dat een rechtsverhouding die in strijd met [artikel 344][ref6] is overgegaan geheel of gedeeltelijk
      wordt overgedragen aan een of meer door hem aan te wijzen verkrijgende rechtspersonen of aan de voortbestaande
      gesplitste rechts- persoon, of bepalen dat twee of meer van deze rechtspersonen hoofdelijk tot nakoming van de uit
      de rechtsverhouding voortvloeiende verbintenissen verbonden zijn;

      b. bevelen dat een door hem omschreven waarborg wordt gegeven.

      De rechter kan aan een bevel als bedoeld een dwangsom verbinden.

      5 Indien door een overdracht als bedoeld in het vierde lid, onder a, de overdragende of verkrijgende rechtspersoon
      nadeel lijdt, is de andere rechtspersoon gehouden dit goed te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel349
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel344
      [ref3]: https://wetten.overheid.nl/BWBR0028744#Artikel342
      [ref4]: https://wetten.overheid.nl/BWBR0028744#Artikel347
