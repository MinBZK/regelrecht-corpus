  - number: '130'
    text: |-
      1 De oproeping geschiedt schriftelijk aan het adres van de betrokkene voor zover dit aan de vennootschap bekend
      is. Zijn aandelen aan toonder in omloop of zijn een of meer adressen van houders van aandelen op naam onbekend dan
      geschiedt de oproeping tevens door een aankondiging in de Staatscourant.

      2 De oproepingstermijn bedraagt ten minste twaalf dagen, de dag van oproeping en de dag van de vergadering niet
      meegerekend. Als dag van oproeping geldt de dag waarop de oproeping verzonden is dan wel, indien dat later is, de
      dag waarop de oproeping is geplaatst in het in het eerste lid bedoelde blad.

      3 De oproeping vermeldt de plaats van de vergadering en de te behandelen onderwerpen. Wordt een voorstel tot
      statutenwijziging gedaan dan wordt de letterlijke tekst van het voorstel meegezonden of ten kantore van de
      vennootschap voor de aandeelhouders ter inzage gelegd. Van de terinzagelegging wordt mededeling gedaan in de
      aankondiging bedoeld in het eerste lid, indien daarvan sprake is.

      4 Tenzij de statuten anders bepalen wordt een vergadering gehouden in het openbaar lichaam van de statutaire zetel.
      Voor een vennootschap als bedoeld in [artikel 119][ref1] geldt dat de vergadering moet worden gehouden in het
      openbaar lichaam van de statutaire zetel.

      5 Zijn de voorschriften bedoeld in het eerste tot en met het vierde lid niet in acht genomen, dan kunnen slechts
      geldige besluiten worden genomen in een vergadering waarin alle met betrekking tot dat onderwerp stemgerechtigde
      aandeelhouders aanwezig of vertegenwoordigd zijn. Ook dan kan over een onderwerp waarvan de behandeling niet met
      inachtneming van de statutaire oproepingstermijn is aangekondigd slechts rechtsgeldig worden besloten met algemene
      stemmen.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel119
