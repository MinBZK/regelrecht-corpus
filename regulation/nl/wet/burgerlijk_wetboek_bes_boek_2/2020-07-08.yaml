  - number: '230'
    text: |-
      1 Voor zover de statuten niet anders bepalen geschiedt de oproeping schriftelijk aan het adres van de betrokkene.
      Zijn een of meer adressen onbekend dan geschiedt de oproeping tevens door een aankondiging in de Staatscourant.

      2 De oproepingstermijn bedraagt ten minste vijf dagen, de dag van oproeping en de dag van de vergadering niet
      meegerekend. Als dag van oproeping geldt de dag waarop de oproeping verzonden is dan wel, indien dat later is, de
      dag waarop de oproeping is geplaatst in het eerste lid bedoelde blad.

      3 De oproeping vermeldt de plaats van de vergadering en de te behandelen onderwerpen. Wordt een voorstel tot
      statutenwijziging gedaan dan wordt de letterlijke tekst van het voorstel meegezonden of ten kantore van de
      vennootschap voor de aandeelhouders ter inzage gelegd. Van de terinzagelegging wordt mededeling gedaan in de
      aankondiging bedoeld in het eerste lid, indien daarvan sprake is.

      4 Tenzij de statuten anders bepalen wordt een vergadering gehouden in het openbaar lichaam van de statutaire zetel.

      5 Zijn de voorschriften bedoeld in het eerste tot en met vierde lid niet in acht genomen, dan kunnen slechts
      geldige besluiten worden genomen in een vergadering waarin alle met betrekking tot dat onderwerp stemgerechtigde
      aandeelhouders aanwezig of vertegenwoordigd zijn. Ook dan kan over een onderwerp waarvan de behandeling niet met
      inachtneming van de statutaire oproepingstermijn is aangekondigd slechts rechtsgeldig worden besloten met algemene
      stemmen.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel230
  - number: '231'
    text: |-
      1 Iedere aandeelhouder en iedere stemgerechtigde is bevoegd in persoon of bij schriftelijk gevolmachtigde de
      algemene vergadering bij te wonen, daarin het woord te voeren en, voor zover hem dat toekomt, het stemrecht uit
      te oefenen.

      2 De statuten kunnen bepalen dat het recht om de algemene vergadering bij te wonen en daarin het woord te voeren
      slechts toekomt aan de aandeelhouder of stemgerechtigde die van zijn voornemen hiertoe op ten hoogste de derde dag
      voor de dag van de vergadering aan het bestuur van de vennootschap kennis geeft. De statuten kunnen de in de eerste
      zin bedoelde rechten ook aan andere personen toekennen.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel231
  - number: '232'
    text: |-
      1 Voor zover de statuten niet anders bepalen geeft ieder aandeel recht op het uitbrengen van één stem ten aanzien
      van alle onderwerpen. Stemrecht kan niet bestaan los van een meer omvattend recht van aandeel.

      2 Geen stem kan worden uitgebracht op een aandeel dat toebehoort aan de vennootschap zelf. Tenzij de statuten
      anders bepalen kan evenmin stem worden uitgebracht op een aandeel dat toebehoort aan een rechtspersoon waarin de
      vennootschap krachtens stemrecht, direct of indirect, doorslaggevende zeggenschap kan uitoefenen, ook indien alle
      stemgerechtigden stemmen.

      3 Tenzij de statuten anders bepalen hebben bestuurders en commissarissen als zodanig in de algemene vergadering en
      bij besluitvorming van de algemene vergadering een raadgevende stem.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel232
  - number: '233'
    text: |-
      1 Voor zover de statuten niet anders bepalen worden alle besluiten genomen bij volstrekte meerderheid van de
      uitgebrachte stemmen.

      2 De statuten kunnen bepalen dat bij staken van stemmen de beslissing wordt opgedragen aan een derde.

      3 Een door de vergadering aangewezen persoon houdt notulen bij van de beraadslagingen en de genomen besluiten. De
      notulen worden ondertekend door de voorzitter van de vergadering.

      4 De ondertekende notulen worden door het bestuur gedurende tien jaren bewaard.

      5 Iedere aandeelhouder heeft recht op een afschrift van de notulen.

      6 Het eerste tot en met vierde lid vinden overeenkomstige toepassing bij besluiten van andere organen. Het vijfde
      lid vindt overeenkomstige toepassing wanneer een ander orgaan dan de algemene vergadering een besluit neemt
      als bedoeld in [artikel 204][ref1], [207, tweede lid][ref2], [214, derde lid][ref3], [215, eerste lid][ref4],
      [217, eerste lid][ref5], of [218, tweede lid][ref6].


