  - number: '303'
    text: |-
      1 In plaats van een rechtspersoon in de zin van dit boek kan bij de toepassing van [artikel 300][ref1] en
      [302][ref2] als zich omzettende rechtspersoon ook optreden een buitenlandse rechtspersoon, mits het recht dat
      die buitenlandse rechtspersoon beheerst zich niet tegen een zodanige omzetting verzet. Een verklaring van die
      strekking, afgelegd door een op dit rechtsgebied deskundige, wordt aan de akte van omzetting gehecht.

      2 Voor de toepassing van [artikel 300, tweede lid][ref3], en voor het tijdstip van totstandkoming geldt dat de voor
      een zodanige omzetting geldende buitenlandse regels mede in aanmerking worden genomen. Rechterlijke machtiging is
      alleen vereist bij omzetting in een stichting.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel300
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel302
      [ref3]: https://wetten.overheid.nl/BWBR0028744#Artikel300
