    text: |-
      Bij de vaststelling in hoeverre is voldaan aan een quorum of meerderheidseis, wordt geen rekening gehouden met
      lidmaatschappen of aandelen waarvan de wet bepaalt of de statuten bepalen dat daarvoor geen stem kan worden
      uitgebracht.
