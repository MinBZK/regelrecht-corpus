  - number: '211'
    text: |-
      1 De overdraagbaarheid van aandelen kan bij de statuten worden beperkt of uitgesloten. Hetzelfde geldt voor de
      mogelijkheid van toedeling van aandelen uit een gemeenschap.

      2 Een overdracht of toedeling die de instemming heeft van alle aandeelhouders is geldig.

      3 In geval van executoriaal beslag, faillissement, afgifte van een legaat of toedeling uit een gemeenschap kan de
      rechter bepalingen als bedoeld in het eerste lid geheel of gedeeltelijk buiten toepassing verklaren. Het verzoek
      daartoe kan worden gedaan door onderscheidenlijk de executant, de curator of een belanghebbende bij de afgifte
      van het legaat of de toedeling. De rechter wijst het verzoek slechts toe indien de belangen van de verzoeker dat
      bepaaldelijk vorderen. De rechter kan bepalen dat de vennootschap aan de executant of de curator inzage moet geven
      in het register bedoeld in [artikel 209][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel209
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel211
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '209'
        afdeling: '2'
  - number: '212'
    text: |-
      1 De bevoegdheid tot het vestigen van vruchtgebruik op aandelen kan niet bij de statuten worden beperkt of
      uitgesloten.

      2 Tenzij bij de vestiging van het vruchtgebruik anders is bepaald, komen het stemrecht en de overige
      zeggenschapsrechten toe aan de aandeelhouder. De statuten kunnen de aan de vruchtgebruiker toekomende rechten
      beperken of uitsluiten.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel212
  - number: '213'
    text: |-
      1 De bevoegdheid tot het vestigen van een pandrecht op aandelen kan bij de statuten worden beperkt of uitgesloten.
      Voor zover het tegendeel niet volgt uit een voorziening als bedoeld in het tweede lid komen de aan het aandeel
      verbonden rechten toe aan de aandeelhouder.

      2 Tenzij de statuten anders bepalen kan bij de vestiging of in een aanvullende akte tussen aandeelhouder en
      pandhouder worden bepaald dat de aan de aandelen verbonden rechten, al dan niet voorwaardelijk, geheel of
      gedeeltelijk toekomen aan de pandhouder.

      3 Wordt pandrecht gevestigd met toepassing van het [tweede lid van artikel 236 van Boek 3][ref1] en vervolgens
      een voorziening als bedoeld in het tweede lid van dit artikel getroffen in een aanvullende akte, dan is voor de
      geldigheid van die akte vereist dat [artikel 210, tweede lid][ref2], overeenkomstige toepassing heeft gevonden. Ook
      artikel 210, derde, vierde en vijfde lid, vindt overeenkomstige toepassing.

      4 In afwijking van het [tweede lid van artikel 236 van Boek 3][ref3] kan pandrecht op aandelen op naam ook worden
      gevestigd zonder betekening of erkenning als bedoeld in [artikel 210][ref4]. [Artikel 239 van Boek 3][ref5] vindt
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel236
