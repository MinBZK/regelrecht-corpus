  - number: '31'
    text: |-
      1 Zodra het einde van de vereffening in zicht is, stelt de vereffenaar een rekening en verantwoording op van de
      vereffening waaruit blijkt in hoeverre elk van de schuldeisers is voldaan en, zo van een overschot sprake is, de
      omvang en samenstelling daarvan. Ter zake van het overschot stelt hij een plan van uitkering op dat de grondslagen
      van de uitkering bevat.

      2 De vereffenaar legt de in het eerste lid genoemde stukken gedurende een periode van ten minste dertig dagen
      ter inzage ten kantore van de rechtspersoon en het handelsregister. In de Staatscourant, alsmede schriftelijk aan
      houders van aandelen op naam en alle bekende crediteuren, maakt hij bekend waar en tot wanneer deze stukken ter
      inzage liggen.

      3 Uiterlijk op de dertigste dag nadat zowel de ter inzage legging als de bekendmaking daarvan in het blad, bedoeld
      in het vorige lid, heeft plaatsgevonden, kan iedere schuldeiser of gerechtigde tegen de in het eerste lid genoemde
      stukken door een verzoekschrift bij de rechter in verzet komen. De vereffenaar doet van gedaan verzet op dezelfde
      wijze mededeling als van de terinzage legging. Is geen verzet gedaan of is het gedaan verzet ingetrokken dan gaat
      de vereffenaar tot verdere afwikkeling en uitkering van het overschot over.

      4 De rechter kan na gedaan verzet zodanige instructies voor een voortgezette vereffening geven en zodanige
      wijzigingen in het plan van uitkering aanbrengen als hem juist voorkomt.

      5 Zodra de beslissing op elk verzet onherroepelijk is geworden doet de vereffenaar daarvan mededeling op dezelfde
      wijze als van het gedaan verzet. Hij gaat vervolgens tot verdere afwikkeling en uitkering van het overschot over.

      6 Het eerste tot en met het vijfde lid vindt geen toepassing indien de vereffenaar terstond bij zijn aantreden
      vaststelt dat geen aan hem bekende baten aanwezig zijn.

      7 De vereffening eindigt en de rechtspersoon houdt op te bestaan op het tijdstip waarop geen aan de vereffenaar
      bekende baten meer aanwezig zijn. De vereffenaar stelt een slotverantwoording op en legt deze ter inzage ten
      kantore van de rechtspersoon en het handelsregister.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel31
  - number: '32'
    text: |-
      1 Op verzoek van iemand die daarbij een redelijk belang heeft kan de rechter de vereffening heropenen of alsnog
      openen en een of meer vereffenaars benoemen.

      2 Indien het verzoek is gedaan door een achteraf opkomende schuldeiser is de vereffenaar bevoegd van de
      rechthebbenden tot het overschot het door ieder te veel ontvangene terug te vorderen.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel32
  - number: '33'
    text: |-
      1 Na afloop van de vereffening blijven de boeken en bescheiden van de ontbonden rechtspersoon gedurende tien jaren
      berusten onder de vereffenaar of de daartoe door de rechter op verzoek van de vereffenaar aangewezen bewaarder.

      2 Tegen een aanwijzing door de rechter is geen rechtsmiddel toegelaten.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel33
  - number: '34'
    text: |-
      1 Iedere bewaarder is gehouden zijn aanwijzing of benoeming als zodanig ter inschrijving op te geven aan het
      kantoor van de handelsregisters, waar de ontbonden rechtspersoon was ingeschreven.

      2 De rechthebbenden tot het overschot en hun rechtverkrijgenden kunnen door de rechter, worden gemachtigd tot
      inzage van de boeken en bescheiden, indien zij aantonen als zodanig bij die inzage een redelijk belang te hebben.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel34
  - number: '35'
    text: |-
      1 Rechterlijke uitspraken, inhoudende:

      a. worden door de griffier van de rechterlijke instantie waarvoor de zaak laatstelijk aanhangig was aan de
      beheerder van het handelsregister gezonden met het verzoek zorg te dragen voor deponering en inschrijving van het
      uit die uitspraak blijkende relevante feit, zulks onverminderd de elders uit de wet voortvloeiende verplichting van
      anderen om van dat feit opgaaf ter inschrijving te doen.

      2 In geval van faillissement of surséance van betaling van een rechtspersoon die is ingeschreven in het
      handelsregister, worden de aankondigingen welke krachtens de [Faillissementswet BES][ref1] in de Staatscourant
      worden opgenomen, door hem die met die openbaarmaking is belast, mede ter inschrijving in dat register opgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0028917
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel35
