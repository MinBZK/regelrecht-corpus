  - number: '309'
    text: |-
      Fusie is de rechtshandeling van twee of meer rechtspersonen waarbij een van deze het vermogen van de andere onder
      algemene titel verkrijgt of waarbij een nieuwe rechtspersoon die bij deze rechtshandeling door hen samen wordt
      opgericht, hun vermogen onder algemene titel verkrijgt.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel309
  - number: '310'
    text: |-
      1 Rechtspersonen kunnen fuseren met rechtspersonen die dezelfde rechtsvorm hebben.

        - Wordt de verkrijgende rechtspersoon nieuw opgericht, dan moet hij de rechtsvorm hebben van de fuserende
      rechtspersonen.
        - Voor de toepassing van dit artikel worden naamloze en besloten vennootschap als rechtspersonen met dezelfde
      rechtsvorm aangemerkt.
        - Een verkrijgende rechtspersoon kan, ongeacht zijn rechtsvorm, fuseren met een vereniging, coöperatie, onderlinge
      waarborgmaatschappij, naamloze of besloten vennootschap waarvan hij enig lid of aandeelhouder is.
        - Een ontbonden rechtspersoon mag niet fuseren, indien reeds uit hoofde van de vereffening een uitkering is gedaan.

      6 Een rechtspersoon mag niet fuseren gedurende faillissement of surséance van betaling.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel310
  - number: '311'
    text: |-
      1 Met uitzondering van de verkrijgende rechtspersoon houden de fuserende rechtspersonen door het van kracht worden
      van de fusie op te bestaan.

      2 De leden of aandeelhouders van de verdwijnende rechtspersonen worden door de fusie lid of aandeelhouder van de
      verkrijgende rechtspersoon, uitgezonderd in de gevallen van de [artikelen 310, vierde lid][ref1], [333][ref2] of
      [334][ref3], of wanneer krachtens de ruilverhouding van de aandelen zelfs geen recht bestaat op een enkel aandeel.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel310
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel333
      [ref3]: https://wetten.overheid.nl/BWBR0028744#Artikel334
