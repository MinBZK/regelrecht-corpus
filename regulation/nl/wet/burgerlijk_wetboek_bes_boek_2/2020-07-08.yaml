        bwb_id: BWBR0041991
  - number: '106'
    text: |-
      1 Tenzij de statuten ten aanzien van alle of bepaalde soorten aandelen anders bepalen heeft iedere aandeelhouder
      bij uitgifte van aandelen ten aanzien van iedere soort een voorkeursrecht in evenredigheid met het aantal door hem
      gehouden aandelen van die soort. De statuten kunnen bepalen dat een in de statuten aangewezen orgaan bij alle of
      bepaalde emissies over het al of niet bestaan van een voorkeursrecht en de modaliteiten daarvan beslist.

      2 Ten aanzien van de bekendmaking van het voorkeursrecht vindt [artikel 130, eerste lid][ref1], overeenkomstige
      toepassing. Het voorkeursrecht kan worden uitgeoefend gedurende ten minste twee weken na de bekendmaking.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel130
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel106
