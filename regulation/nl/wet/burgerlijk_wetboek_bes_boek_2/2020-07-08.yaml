  - number: '50'
    text: |-
      1 De stichting en de stichting particulier fonds zijn als zodanig bij notariële akte opgerichte rechtspersonen
      die geen leden of aandeelhouders kennen en beogen met behulp van een daartoe bestemd vermogen een in de statuten
      vermeld doel te verwezenlijken.

      2 Als leden van een stichting worden niet aangemerkt:

      a. personen aan wie bij of krachtens de statuten de bevoegdheid is gegeven om in de vervulling van ledige plaatsen
      in organen van de stichting te voorzien of om bestuurders of leden van andere organen van de stichting te schorsen
      en te ontslaan,

      b. deelnemers aan een pensioenfonds dat door de stichting wordt beheerd.

      3 Het doel van een stichting die niet is een stichting particulier fonds, mag niet inhouden het doen van
      uitkeringen aan oprichters of aan hen die deel uitmaken van haar organen noch ook aan anderen, tenzij wat deze
      laatsten betreft de uitkeringen een ideële of sociale strekking hebben.

      4 Uitkeringen die voortvloeien uit een recht op pensioen, worden niet aangemerkt als uitkeringen bedoeld in het
      derde lid.

      5 Het doel van een stichting particulier fonds mag niet inhouden het uitoefenen van een bedrijf.

      6 Als bedrijf bedoeld in het vijfde lid wordt niet aangemerkt:

      a. het zich bezig houden met de belegging van haar kapitaal, ongeacht de aard van die beleggingen;

      b. het houden van een belang in een andere rechtspersoon;

      c. het deelnemen in een commanditaire vennootschap als commanditaire vennoot.

      7 Waar in de wet gesproken wordt van stichting geldt de bepaling eveneens voor de stichting particulier fonds,
      tenzij het tegendeel blijkt.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel50
  - number: '51'
    text: |-
      1 De statuten moeten inhouden:

      a. de naam van de stichting, met het woord stichting respectievelijk stichting particulier fonds of een vertaling
      daarvan als deel van de naam;

      b. het doel van de stichting;

      c. de wijze van benoeming en ontslag van de bestuurders;

      d. het openbaar lichaam waar zij haar zetel heeft;

      e. de bestemming van het overschot na vereffening in geval van ontbinding van de stichting of de wijze waarop de
      bestemming zal worden vastgesteld.

      2 De statuten van de stichting kunnen door haar organen slechts worden gewijzigd, indien en voor zover de statuten
      daartoe de mogelijkheid openen, onverminderd het bepaalde in [artikel 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel5
