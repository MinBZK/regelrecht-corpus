  - number: '360'
    text: |-
      In het geval van een zuivere splitsing kan de akte van splitsing bepalen dat onderscheiden aandeelhouders van de
      splitsende rechtspersoon aandeelhouder worden van onderscheiden verkrijgende rechtspersonen. In dat geval:

      a. vermeldt het voorstel tot splitsing naast de in de [artikelen 340][ref1] en [357][ref2] genoemde gegevens welke
      aandeelhouders van welke verkrijgende rechtspersonen aandeelhouder worden;

      b. deelt het bestuur in de toelichting op het voorstel tot splitsing mee volgens welke criteria deze verdeling
      is vastgesteld;

      c. moet de deskundige bedoeld in [artikel 359][ref3] mede verklaren dat de voorgestelde verdeling, mede gelet op de
      bijgevoegde stukken, naar zijn oordeel redelijk is; en

      d. wordt het besluit tot splitsing door de algemene vergadering van de splitsende vennootschap genomen met een
      meerderheid van drie vierden van de uitgebrachte stemmen in een vergadering waarin 95% van het door de aandelen
      vertegenwoordigde vermogen is vertegenwoordigd.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel340
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel357
