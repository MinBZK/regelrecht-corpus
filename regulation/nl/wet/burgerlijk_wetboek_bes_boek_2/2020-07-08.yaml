  - number: '102'
    text: |-
      1 De statuten vermelden de naam, het openbaar lichaam waar de vennootschap haar zetel heeft en het doel van de
      vennootschap. De naam vangt aan of eindigt met de woorden naamloze vennootschap, hetzij voluit geschreven, hetzij
      afgekort tot «N.V.». De naam mag niet in andere dan Latijnse schrifttekens gesteld zijn.

      2 De statuten kunnen bepalen dat er verschillende soorten aandelen zijn. Zij kunnen aan een of meer soorten een
      nominale waarde toekennen. De nominale waarde kan in een of meer vreemde muntsoorten worden uitgedrukt.

      3 Door statutenwijziging kan de nominale waarde worden opgeheven of gewijzigd. Vermeerdering van de nominale waarde
      mag er niet toe leiden dat het nominaal kapitaal groter wordt dan het eigen vermogen van de vennootschap. Als
      nominaal kapitaal heeft te gelden de som van de nominale waarden van de uitgegeven aandelen.

      4 Kennen de statuten aandelen met een nominale waarde, dan bevatten zij bepalingen met betrekking tot de aan die
      aandelen en andere aandelen verbonden stem-, winst- en liquidatierechten.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel102
  - number: '103'
    text: |-
      1 Voor zover de wet of de statuten niet anders bepalen zijn aan alle aandelen gelijke rechten en verplichtingen
      verbonden.

      2 De statuten kunnen bepalen dat ter zake van aandelen van een of meer soorten onderaandelen kunnen worden
      uitgegeven, die de bij de uitgifte aan te geven fractie van een aandeel vertegenwoordigen.

      3 De bepalingen van dit boek over aandelen en aandeelhouders vinden overeenkomstige toepassing op onderaandelen en
      houders daarvan voor zover uit die bepalingen niet anders blijkt.

      4 Tenzij de statuten anders bepalen gelden voor de toepassing van [artikel 129, eerste lid][ref1], en
      [132, eerste lid][ref2], onderaandelen die tezamen ten minste een of meer aandelen vertegenwoordigen als zoveel
      aandelen, ongeacht de gerechtigdheid tot de onderaandelen.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel129
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel132
