    text: |-
      1 De bepalingen van deze titel gelden voor de in dit boek in afzonderlijke rechtsvormen geregelde rechtspersonen:
      de stichting, de stichting particulier fonds, de vereniging, de coöperatie, de onderlinge waarborgmaatschappij, de
      naamloze vennootschap en de besloten vennootschap.

      2 [Artikel 3][ref1] geldt ook voor andere rechtsvormen die als rechtspersoon hebben te gelden. Voor zover het
      tegendeel niet uit de wet voortvloeit en de aard van de rechtspersoon zich niet daartegen verzet kunnen de overige
      bepalingen van deze titel analogisch worden toegepast op die andere rechtspersonen.

      3 Van de bepalingen van dit boek kan slechts worden afgeweken voor zover dat uit de wet blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel3
