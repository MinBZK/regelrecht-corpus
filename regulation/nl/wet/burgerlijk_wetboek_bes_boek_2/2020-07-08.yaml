  - number: '323'
    text: |-
      1 De rechter kan een fusie alleen vernietigen:

      a. indien de door een notaris ondertekende akte van fusie geen authentiek geschrift is;

      b. wegens het niet naleven van [artikel 310, vijfde en zesde lid][ref1], [artikel 316, derde lid][ref2], of
      [318, tweede lid][ref3];

      c. wegens nietigheid, het niet van kracht zijn of een grond tot vernietiging van een voor de fusie vereist besluit
      van de algemene vergadering of, in een stichting, van het bestuur;

      d. wegens het niet naleven van [artikel 317, vijfde lid][ref4].

      2 Vernietiging geschiedt op vordering tegen de verkrijgende rechtspersoon van een lid, aandeelhouder, bestuurder of
      andere belanghebbende. Een niet door de rechter vernietigde fusie is geldig.

      3 De bevoegdheid tot het instellen van de vordering tot vernietiging vervalt door herstel van het
      verzuim of door verloop van zes maanden na de nederlegging van de akte van fusie ten kantore van de in
      [artikel 318, derde lid][ref5], bedoelde registers.

      4 De fusie wordt niet vernietigd:

      a. indien de rechtspersoon binnen een door de rechter te bepalen tijdvak het verzuim heeft hersteld;

      b. indien de reeds ingetreden gevolgen van de fusie bezwaarlijk ongedaan kunnen worden gemaakt.

      5 Heeft de eiser tot vernietiging van de fusie schade geleden door een verzuim dat tot vernietiging had kunnen
      leiden, en vernietigt de rechter de fusie niet, dan kan de rechter de rechtspersoon veroordelen tot vergoeding van
      de schade. De rechtspersoon heeft daarvoor verhaal op de schuldigen aan het verzuim en, tot ten hoogste het genoten
      voordeel, op degenen die door het verzuim zijn bevoordeeld.

      6 De vernietiging wordt, door de zorg van de griffier van het gerecht waar de vordering laatstelijk aanhangig was,
      ingeschreven in de registers waarin de fusie ingevolge [artikel 318, derde lid][ref6], moet zijn ingeschreven.

      7 De rechtspersonen zijn hoofdelijk aansprakelijk voor verbintenissen die, ten laste van de rechtspersoon waarin
      zij gefuseerd zijn geweest, zijn ontstaan na de fusie en voordat de vernietiging in de registers is ingeschreven.

      8 De onherroepelijke uitspraak tot vernietiging van een fusie is voor ieder bindend. Verzet van derden en
      herroeping zijn niet toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel310
