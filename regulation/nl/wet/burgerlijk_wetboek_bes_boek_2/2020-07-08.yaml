  - number: '300'
    text: |-
      1 Een rechtspersoon kan zich met inachtneming van de volgende bepalingen omzetten in een andere rechtsvorm.

      2 Voor omzetting is vereist een besluit tot omzetting en statutenwijziging, genomen met inachtneming van ten minste
      de vereisten voor een besluit tot statutenwijziging. Zij komt tot stand bij notariële akte van omzetting die de
      nieuwe statuten bevat.

      3 Omzetting van een stichting is alleen mogelijk indien de statuten toelaten dat alle bepalingen daarvan worden
      gewijzigd.

      4 Voor de omzetting van of in een stichting en van een naamloze of besloten vennootschap in een vereniging is
      bovendien rechterlijke machtiging vereist.

      5 In de gevallen waarin rechterlijke machtiging is vereist doet het bestuur van de om te zetten rechtspersoon
      mededeling van het voornemen tot omzetting en van de plaats en het tijdstip van de behandeling van het
      machtigingsverzoek in de Staatscourant en door aankondiging in een in het openbaar lichaam Bonaire, Sint Eustatius
      of Saba verschijnend nieuwsblad.

      6 Slechts de rechtspersoon kan machtiging tot omzetting verzoeken. Daarbij moet worden overgelegd een bewijs dat
      aan de verplichtingen uit het vijfde lid is voldaan en een notarieel ontwerp van de akte. De machtiging wordt
      geweigerd indien een vereist besluit nietig is of indien een vordering tot vernietiging daarvan aanhangig is.
      Zij wordt voorts geweigerd indien de omzetting leidt tot ongerechtvaardigde bevoordeling of benadeling van een of
      meer personen, alsmede indien de belangen van stemgerechtigden die niet hebben ingestemd of van anderen, van wie
      ten minste iemand zich tot de rechter heeft gewend, onvoldoende zijn ontzien. De rechter kan voorwaarden aan het
      verlenen van de machtiging verbinden. Een voorwaarde kan zijn dat aan een of meer aandeelhouders schadevergoeding
      wordt betaald op de voet van [artikel 302, derde lid][ref1].

      7 Indien voor de omzetting machtiging van de rechter is vereist, verklaart de notaris aan de voet van de akte van
      omzetting dat de machtiging op het ontwerp van de akte is verleend en, voor zover toepasselijk, dat aan de daarbij
      gestelde voorwaarden is voldaan.

      8 Bij omzetting van een stichting moet uit de akte van omzetting blijken welk vermogen de stichting heeft en hoe
      dit is samengesteld. Na de omzetting moet uit de statuten blijken dat het netto vermogen dat zij bij de omzetting
      had, niet door uitkeringen aan aandeelhouders of leden mag verminderen en niet door uitkeringen aan derden mag
      verminderen zonder toestemming van de rechter.

      9 [Artikel 5][ref2] vindt overeenkomstige toepassing. Bij de toepassing van [artikel 24][ref3] wordt telkens
      naast «oprichting», «oprichtingshandeling», en «oprichtingsbalans» ook gelezen: omzetting, omzettingshandeling
      en omzettingsbalans.

      10 Omzetting beëindigt het bestaan van de rechtspersoon niet.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel302
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0028744#Artikel24
