    text: |-
      1 Een stichting kan zich omzetten in een buitenlandse rechtspersoon met inachtneming van de volgende leden.

        - Het derde tot en met het zevende lid en de eerste volzin van het achtste lid van [artikel 300][ref1] zijn van
      overeenkomstige toepassing.
        - Voor de omzetting is vereist een daartoe strekkend eenstemmig besluit van het bestuur dat is genomen met
      inachtneming van ten minste de vereisten voor een besluit tot statutenwijziging. [Artikel 304][ref2] is voor het
      overige van overeenkomstige toepassing met dien verstande dat een verklaring als bedoeld in het tweede lid, onder
      c, moet zijn afgegeven en getekend door alle bestuurders.


