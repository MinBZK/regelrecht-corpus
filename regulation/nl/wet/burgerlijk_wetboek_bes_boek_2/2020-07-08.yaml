  - number: '239'
    text: |-
      1 De statuten kunnen bepalen dat de vennootschap een aandeelhouderbestuurde vennootschap is. In dat geval
      wordt in de wet telkens in plaats van bestuurder gelezen: aandeelhouder, en in plaats van het bestuur:
      de algemene vergadering van aandeelhouders. Voor de aandeelhouder-bestuurde vennootschap gelden voorts de
      [artikelen 240 tot en met 242][ref1].

      2 Een besluit tot wijziging van de statuten waardoor een bepaling als bedoeld in het eerste lid wordt ingevoerd of
      afgeschaft kan slechts tot stand komen met de uitdrukkelijke instemming van alle stemgerechtigde aandeelhouders.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel240
