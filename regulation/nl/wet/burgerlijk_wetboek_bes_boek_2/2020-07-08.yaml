  - number: '141'
    text: |-
      1 Een commissaris wordt in de akte van oprichting aangewezen of door de algemene vergadering benoemd voor een
      periode die eindigt aan het einde van de eerste algemene vergadering die gehouden wordt nadat minimaal drie en
      maximaal zes jaar sedert zijn aanwijzing of benoeming is verstreken.

      2 De bevoegdheid tot benoeming van een commissaris kan niet anders worden beperkt dan door de vereisten van quorum,
      versterkte meerderheid van maximaal twee derden van de uitgebrachte stemmen of een door de raad van commissarissen
      zelf op te stellen bindende voordracht. Een bindende voordracht kan te allen tijde door een meerderheid van twee
      derden der uitgebrachte stemmen ter zijde worden gesteld. Een quorum-vereiste geldt niet in een vergadering die
      wordt gehouden binnen drie weken nadat het nemen van het benoemingsbesluit op dat quorumvereiste is afgestuit.

      3 Tenzij de statuten anders bepalen komt de bevoegdheid de bezoldiging van een commissaris vast te stellen toe aan
      de algemene vergadering. De bezoldiging kan niet afhankelijk zijn van de financiële resultaten van de vennootschap.
      Zij kan niet bestaan of mede bestaan uit aandelen in de vennootschap of een groepsmaatschappij of daarvan afgeleide
      rechten.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel141
  - number: '142'
    text: |-
      1 Een commissaris kan te allen tijde worden geschorst of ontslagen door de raad van commissarissen op een niet
      voor beperking vatbare voordracht van de algemene vergadering of het bestuur of een ander in de statuten aangewezen
      orgaan.

      2 Op verzoek van de algemene vergadering, het bestuur, de raad van commissarissen of een ander in de statuten
      aangewezen orgaan kan een commissaris worden geschorst of ontslagen door de rechter indien hij zijn taak kennelijk
      onbehoorlijk vervult of wegens andere gewichtige redenen. De rechter kan, hangende het onderzoek, voorzieningen
      treffen als bedoeld in het [derde lid van artikel 255][ref1]. De overige bepalingen van artikel 255 vinden
      overeenkomstige toepassing.

      3 Een schorsing vervalt indien de betrokkene niet binnen twee maanden na de schorsing is ontslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel255
