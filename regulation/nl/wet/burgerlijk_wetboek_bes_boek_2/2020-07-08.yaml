    text: |-
      Hij die, zonder deel uit te maken van het bestuur, voor zekere tijd of onder zekere omstandigheden, al dan niet
      krachtens een bepaling van de statuten of van dit boek, het beleid van de vennootschap bepaalt of mede bepaalt als
      ware hij bestuurder, wordt ter zake van dat optreden, wat zijn verplichtingen ten opzichte van de vennootschap en
      van derden betreft, alsmede voor de toepassing van [artikel 9][ref1] als bestuurder aangemerkt.


