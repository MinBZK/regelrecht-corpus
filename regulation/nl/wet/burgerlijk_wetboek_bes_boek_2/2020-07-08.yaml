  - number: '250'
    text: |-
      1 Hij die voor eigen rekening aandelen houdt die ten minste 95% van het eigen vermogen van een naamloze of
      besloten vennootschap vertegenwoordigen, kan tegen de gezamenlijke andere aandeelhouders een vordering instellen
      tot overdracht van hun aandelen aan de eiser. Hetzelfde geldt, indien twee of meer groepsmaatschappijen samen het
      vereiste aantal aandelen houden en samen de vordering instellen tot overdracht aan een hunner.

      2 In de statuten kan het percentage genoemd in het eerste lid worden verlaagd, mits dit niet lager wordt gesteld
      dan 90.

      3 Indien tegen een of meer gedaagden verstek is verleend, moet de rechter ambtshalve onderzoeken of de eiser of
      eisers de vereisten van het eerste of het tweede lid vervullen.

      4 De rechter wijst de vordering tegen alle gedaagden af, indien een gedaagde ondanks de vergoeding ernstige
      stoffelijke schade zou lijden door de overdracht of een eiser jegens een gedaagde afstand heeft gedaan van zijn
      bevoegdheid de vordering in te stellen. Voor zover de statuten niet anders bepalen wijst de rechter de vordering
      tegen alle gedaagden ook af indien een gedaagde houder is van een aandeel waaraan de statuten een bijzonder recht
      inzake de zeggenschap in de vennootschap verbinden.

      5 Indien de rechter oordeelt dat het eerste tot en met vierde lid de toewijzing van de vordering niet belet,
      kan hij bevelen dat een of drie deskundigen zullen berichten over de waarde van de over te dragen aandelen.
      Hij kan bepalen dat de eiser zekerheid moet stellen voor de met het deskundigenrapport gemoeide kosten.
      [Artikel 121, vierde lid][ref1], is van overeenkomstige toepassing. De rechter stelt de prijs vast die de over te
      dragen aandelen op een door hem te bepalen dag hebben. Zo lang en voor zover de prijs niet is betaald, wordt hij
      verhoogd met rente, gelijk aan de wettelijke rente, van die dag af tot de overdracht; uitkeringen op de aandelen
      die in dit tijdvak betaalbaar worden gesteld, strekken op de dag van betaalbaarstelling tot gedeeltelijke betaling
      van de prijs.

      6 De rechter die de vordering toewijst, veroordeelt de overnemer aan degenen aan wie de aandelen toebehoren
      of zullen toebehoren de vastgestelde prijs met rente te betalen tegen levering van het onbezwaarde recht op de
      aandelen. De rechter geeft omtrent de kosten van het geding zodanige uitspraak als hij meent dat behoort. Een
      gedaagde die geen verweer heeft gevoerd, wordt niet verwezen in de kosten.

      7 Staat het bevel tot overdracht bij gerechtelijk gewijsde vast, dan deelt de overnemer de dag en plaats van
      overdracht en betaling en de prijs schriftelijk mee aan de houders van de over te nemen aandelen van wie hij
      het adres kent. Tenzij hij van allen het adres kent, kondigt hij deze ook aan in de Staatscourant en een in het
      openbaar lichaam Bonaire, Sint Eustatius of Saba verspreid nieuwsblad.

      8 De overnemer die aan zijn verplichtingen uit het zevende lid heeft voldaan kan, indien een houder van over te
      nemen aandelen niet op de medegedeelde dag of uiterlijk binnen vier weken daarna aan de overdracht meewerkt, zich
      van zijn verplichtingen ingevolge het zesde lid bevrijden door de vastgestelde prijs met rente voor alle nog niet
      overgenomen aandelen te consigneren, onder mededeling van hem bekende rechten van pand en vruchtgebruik en de
      hem bekende beslagen. Door deze mededeling gaat beslag over van de aandelen op het recht op uitkering. Door het
      consigneren gaat het recht op de aandelen onbezwaard op hem over en gaan rechten van pand of vruchtgebruik over op
      het recht op uitkering. Aan aandeel- en dividendbewijzen waarop na de overgang uitkeringen betaalbaar zijn gesteld,
      kan nadien geen recht jegens de vennootschap meer worden ontleend. De overnemer maakt het consigneren en de prijs
      per aandeel op dat tijdstip bekend op de wijze van het zevende lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel121
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel250
    references:
      - id: ref1
