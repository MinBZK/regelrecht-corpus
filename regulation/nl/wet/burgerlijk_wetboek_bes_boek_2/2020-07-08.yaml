        artikel: '19'
      - id: ref2
        bwb_id: BWBR0028744
        artikel: '140'
        afdeling: '7'
  - number: '140'
    text: |-
      1 De raad van commissarissen bestaat uit ten minste drie natuurlijke personen. Is het aantal commissarissen minder
      dan drie dan neemt het bestuur, of indien het bestuur dit nalaat, de raad van commissarissen onverwijld maatregelen
      tot aanvulling van zijn ledental door benoeming overeenkomstig [artikel 141][ref1]. Commissarissen mogen direct
      noch indirect aandelen in de vennootschap of een groepsmaatschappij of daarvan afgeleide rechten hebben.

      2 Tot de taak van de raad van commissarissen behoort in elk geval het houden van toezicht op het bestuur. Bij de
      vervulling van zijn taak richt de raad zich op het belang van de vennootschap en de daarmee verbonden onderneming.
      De raad ziet er op toe dat de belangen van minderheidsaandeelhouders en werknemers niet onnodig of onevenredig
      worden geschaad.

      3 De raad van commissarissen is zonder beperking bevoegd een bestuurder te schorsen. De schorsing vervalt indien de
      betrokkene niet binnen twee maanden na de dag van schorsing is ontslagen.

      4 De raad van commissarissen stelt na overleg met het bestuur een reglement vast waarin nadere regels
      worden gesteld ten aanzien van de taakvervulling en de besluitvorming door het bestuur. Bepaalde categorieën
      van handelingen of besluiten van het bestuur kunnen door dit reglement aan de goedkeuring van de raad van
      commissarissen worden onderworpen.

      5 De statuten kunnen aanvullende bepalingen omtrent de taak en de bevoegdheden van de raad en van zijn leden
      bevatten.

      6 Het bestuur verschaft de raad van commissarissen en de individuele commissarissen tijdig de voor de uitoefening
      van hun taak noodzakelijke of met het oog daarop door de betrokkene verlangde gegevens.

      7 Het bepaalde bij de [artikelen 9][ref2], [14][ref3] en [16][ref4] vindt overeenkomstige toepassing ten aanzien
      van commissarissen.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0028744#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0028744#Artikel16
