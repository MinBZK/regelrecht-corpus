  - number: '235'
    text: |-
      1 Een besluit van de algemene vergadering kan ook tot stand komen door schriftelijke stemuitbrenging buiten
      vergadering, mits alle met betrekking tot dat onderwerp stemgerechtigde personen stem hebben uitgebracht. Alle
      aandeelhouders, bestuurders en commissarissen ontvangen tijdig bericht van de voorgenomen besluitvorming buiten
      vergadering.

      2 Het [derde tot en met het vijfde lid van artikel 233][ref1] vindt overeenkomstige toepassing.


