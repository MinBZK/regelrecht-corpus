  - number: '313'
    text: |-
      1 In een schriftelijke toelichting geeft het bestuur van elke te fuseren rechtspersoon de redenen voor de fusie met
      een uiteenzetting over de verwachte gevolgen voor de werkzaamheden en een toelichting uit juridisch, economisch en
      sociaal oogpunt.

      2 Indien het laatste boekjaar van de rechtspersoon, waarover een jaarrekening of andere financiële verantwoording
      is vastgesteld, meer dan zes maanden voor de nederlegging van het voorstel tot fusie is verstreken, maakt het
      bestuur een jaarrekening of tussentijdse vermogensopstelling op. Deze heeft betrekking op de stand van het vermogen
      op ten vroegste de eerste dag van de derde maand voor de maand waarin zij wordt neergelegd. De vermogensopstelling
      wordt opgemaakt met inachtneming van de indeling en de waarderingsmethoden die in de laatst vastgestelde
      jaarrekening of andere financiële verantwoording zijn toegepast, tenzij daarvan gemotiveerd wordt afgeweken op de
      grond dat de actuele waarde belangrijk afwijkt van de boekwaarde.

      3 In de gevallen van de [artikelen 310, vierde lid][ref1], en [333][ref2] is geen toelichting vereist voor
      de verdwijnende rechtspersoon, tenzij anderen dan de verkrijgende rechtspersoon een bijzonder recht jegens de
      verdwijnende rechtspersoon hebben, zoals een recht op uitkering van winst of tot het nemen van aandelen.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel310
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel333
