  - number: '131'
    text: |-
      1 Iedere aandeelhouder en iedere stemgerechtigde is bevoegd in persoon of bij schriftelijk gevolmachtigde de
      algemene vergadering bij te wonen, daarin het woord te voeren en, voor zover hem dat toekomt, het stemrecht uit
      te oefenen.

      2 De statuten kunnen bepalen dat het recht om de algemene vergadering bij te wonen en daarin het woord te voeren
      slechts toekomt aan de aandeelhouder of stemgerechtigde die van zijn voornemen hiertoe op ten hoogste de derde dag
      voor de dag van de vergadering aan het bestuur van de vennootschap kennis geeft. Zijn toonderbewijzen in omloop
      dan kan de eis worden gesteld dat deze stukken uiterlijk op de dag van de kennisgeving bij de vennootschap of een
      aangewezen derde in bewaring worden gegeven. De statuten kunnen de in de eerste zin bedoelde rechten ook aan andere
      personen toekennen.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel131
  - number: '132'
    text: |-
      1 Voor zover de statuten niet anders bepalen geeft ieder aandeel recht op het uitbrengen van één stem ten aanzien
      van alle onderwerpen. Ten aanzien van houders van aandelen aan toonder gelden alleen die stemrechtbeperkingen die
      uitdrukkelijk op het toonderbewijs staan vermeld. Stemrecht kan niet bestaan los van een meer omvattend recht van
      aandeel.

      2 Geen stem kan worden uitgebracht op een aandeel dat toebehoort aan de vennootschap zelf. Tenzij de statuten
      anders bepalen kan evenmin stem worden uitgebracht op een aandeel dat toebehoort aan een rechtspersoon waarin de
      vennootschap krachtens stemrecht, direct of indirect, doorslaggevende zeggenschap kan uitoefenen, ook indien alle
      stemgerechtigden stemmen.

      3 De statuten kunnen bepalen dat de in [artikel 131, eerste lid][ref1], bedoelde rechten uitsluitend kunnen worden
      uitgeoefend door degenen die op een in de statuten vastgestelde dag, de registratiedag, die rechten hadden en als
      zodanig aan het bestuur van de vennootschap bekend waren. De registratie dag mag ten hoogste twintig dagen voor
      die der vergadering liggen. Worden de aandelen verhandeld op een effectenbeurs, dan kan de in dit lid bedoelde
      termijn ten hoogste zestig dagen zijn en kunnen de statuten het vaststellen van de registratiedag overlaten aan een
      orgaan van de vennootschap. Als nadere voorwaarde voor de uitoefening van de in artikel 131, eerste lid, bedoelde
      rechten kunnen de statuten dan ook voorschrijven dat de betrokkene op de registratiedag in een bij of krachtens de
      statuten aangewezen register als rechthebbende is ingeschreven. Indien de statuten een registratiedag bevatten of
      een registratiedag krachtens de statuten is vastgesteld, wordt deze bij de oproeping vermeld.

      4 Tenzij de statuten anders bepalen hebben bestuurders en commissarissen als zodanig in de algemene vergadering en
      bij de besluitvorming van de algemene vergadering een raadgevende stem.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel131
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel132
