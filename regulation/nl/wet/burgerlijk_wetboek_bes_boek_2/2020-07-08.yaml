  - number: '355'
    text: |-
      Deze afdeling is van toepassing, indien bij een splitsing een naamloze of besloten vennootschap wordt gesplitst of
      wordt opgericht.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel355
  - number: '356'
    text: |-
      1 Indien aandelen of certificaten van aandelen van een splitsende vennootschap zijn opgenomen in de prijscourant
      van een beurs, kan de ruilverhouding afhankelijk zijn van de prijs van die aandelen onderscheidenlijk certificaten
      op die beurs op een of meer in het voorstel tot splitsing te bepalen tijdstippen, gelegen voor de dag waarop de
      splitsing van kracht wordt.

      2 Indien krachtens de ruilverhouding van de aandelen recht bestaat op geld of schuldvorderingen, mag het
      gezamenlijke bedrag daarvan een tiende van het door de toegekende aandelen vertegenwoordigde eigen vermogen niet te
      boven gaan.

      3 Bij de akte van splitsing kan een verkrijgende vennootschap aandelen in de verkrijgende vennootschap die zij zelf
      houdt of krachtens de akte van splitsing verkrijgt, intrekken tot ten hoogste de vermogenswaarde die de aandelen
      die zij toekent aan haar nieuwe aandeelhouders vertegenwoordigen.

      4 Aandelen in het kapitaal van de splitsende vennootschap die worden gehouden door of voor rekening van een
      verkrijgende rechtspersoon of door of voor rekening van de splitsende vennootschap vervallen, indien de splitsende
      vennootschap bij de splitsing ophoudt te bestaan.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel356
  - number: '357'
    text: |-
      1 Het voorstel tot splitsing bevat naast de in [artikel 340][ref1] genoemde gegevens:

      a. de ruilverhouding van de aandelen en eventueel de omvang van de betalingen krachtens de ruilverhouding;

      b. met ingang van welk tijdstip en in welke mate de aandeelhouders van de splitsende vennootschap zullen delen in
      de winst van de verkrijgende vennootschappen;

      c. hoeveel aandelen eventueel zullen worden ingetrokken met toepassing van [artikel 356, derde lid][ref2];

      d. een splitsingsbalans van alle partijen bij de splitsing die naamloze of besloten vennootschap zijn en niet
      ophouden te bestaan.

      2 De in het eerste lid onder d bedoelde splitsingsbalans toont een eigen vermogen dat niet negatief is of,
      indien de betrokken vennootschap een nominaal kapitaal heeft, niet lager is dan dat nominaal kapitaal. Zij heeft
      betrekking op het vermoedelijke tijdstip van de splitsing. Gegevens daarvoor mogen worden ontleend aan de in
      [artikel 341, tweede lid][ref3], bedoelde jaarrekeningen of vermogensopstellingen. Afwijkingen daarvan worden
      toegelicht.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel340
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel356
      [ref3]: https://wetten.overheid.nl/BWBR0028744#Artikel341
