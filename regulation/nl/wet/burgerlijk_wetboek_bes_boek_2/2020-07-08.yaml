      De op een vennootschap rustende verplichtingen als vermeld in [artikel 122][ref1] gelden niet indien:

      a. de financiële gegevens van de vennootschap over het betrokken boekjaar door een andere rechtspersoon of
      een contractuele vennootschap zijn geconsolideerd in een jaarrekening die voldoet aan de normen als gesteld in
      [artikel 120, derde lid][ref2]; en

      b. de onder a bedoelde andere rechtspersoon of contractuele vennootschap schriftelijk heeft verklaard zich
      hoofdelijk aansprakelijk te stellen voor de uit rechtshandelingen voortvloeiende schulden van de vennootschap die
      zijn ontstaan of zullen ontstaan binnen twee jaar na de afloop van het onder a bedoelde boekjaar, met vermelding
      van de datum van afloop van dat boekjaar; en

      c. de verklaring als bedoeld onder b binnen zes maanden na afloop van het onder a bedoelde boekjaar is neergelegd
      ten kantore van het handelsregister waar de vennootschap is ingeschreven; en

      d. binnen zes maanden na de balansdatum van de onder a bedoelde geconsolideerde jaarrekening, of op een later
      ingevolge [artikel 122][ref3] geoorloofd tijdstip, die geconsolideerde jaarrekening is neergelegd ten kantore van
      de vennootschap of het onder c bedoelde handelsregister, een en ander met overeenkomstige toepassing van artikel
      122.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel122
