  - number: '242'
    text: |-
      1 De [artikelen 12][ref1], [18][ref2] en [236][ref3] vinden geen toepassing. De [artikelen 17][ref4] en [238][ref5]
      zijn van overeenkomstige toepassing. [Artikel 14, eerste tot en met vierde lid][ref6], is van overeenkomstige
      toepassing, voor zover daarvan niet is afgeweken in de aandeelhoudersovereenkomst. In dat geval is alleen het
      vijfde lid van artikel 14 van overeenkomstige toepassing.

      2 Iedere aandeelhouder heeft recht op inzage in alle tot de administratie behorende boeken, bescheiden en andere
      gegevensdragers en het recht om daarvan, dan wel van de desbetreffende gegevens, op eigen kosten afschriften te
      maken of te laten maken.


