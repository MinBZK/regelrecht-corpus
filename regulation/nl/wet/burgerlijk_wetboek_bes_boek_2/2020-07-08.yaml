  - number: '114'
    text: |-
      1 De vennootschap kan geen eigen aandelen nemen.

      2 Onverminderd het bepaalde in [titel 7][ref1] kunnen de statuten de verkrijging door de vennootschap
      van eigen aandelen van derden uitsluiten, beperken of aan voorwaarden onderwerpen. Zolang de vennootschap
      direct of indirect eigen aandelen houdt, kunnen de daaraan verbonden rechten niet worden uitgeoefend.
      [Artikel 118, vijfde en zesde en zevende lid][ref2], is van overeenkomstige toepassing op verkrijging van eigen
      aandelen.

      3 De vennootschap kan door een daarop gericht besluit van de algemene vergadering of een door de statuten
      aangewezen ander orgaan door de vennootschap gehouden eigen aandelen intrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0028744
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel118
