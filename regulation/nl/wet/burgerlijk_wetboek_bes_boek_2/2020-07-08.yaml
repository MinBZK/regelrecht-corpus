  - number: '204'
    text: |-
      De algemene vergadering van aandeelhouders of een daartoe in of krachtens de statuten aangewezen ander orgaan
      is bevoegd na de oprichting te besluiten tot uitgifte van nieuwe aandelen. De daarop volgende uitgifte geschiedt
      bij een door de vennootschap en de nemer getekende akte. [Artikel 15, derde lid][ref1] is van overeenkomstige
      toepassing op de akte.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel15
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel204
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '15'
  - number: '205'
    text: '<<r>>'
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel205
  - number: '206'
    text: |-
      De statuten kunnen bepalen dat, al dan niet krachtens besluit van een daartoe aangewezen orgaan, bepaalde of alle
      aandeelhouders bij uitgifte van bepaalde of alle aandelen een voorkeursrecht hebben in een daarbij te bepalen
      verhouding.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel206
  - number: '207'
    text: |-
      1 De nemer van een aandeel is verplicht de tegenprestatie te voldoen die in de akte van oprichting of het besluit
      tot uitgifte is vastgesteld. Indien anders dan in geld wordt gestort, wordt de waarde van de storting in de akte
      van oprichting of de akte van uitgifte in een bedrag weergeven. Worden aandelen met een nominale waarde genomen dan
      bedraagt de waarde van de tegenprestatie ten minste het nominale bedrag van het aandeel.

      2 In de akte van oprichting of het besluit tot uitgifte kan worden bepaald dat de tegenprestatie, of een deel
      daarvan, pas na verloop van een bepaalde tijd opeisbaar zal zijn of pas opeisbaar zal zijn na een daartoe strekkend
      besluit van een in die akte of dat besluit genoemd orgaan. In geval van faillissement van de vennootschap gaat de
      bevoegdheid tot het nemen van dit besluit over op de curator.

      3 Voor zover de vordering van de vennootschap tot voldoening van de tegenprestatie niet onvoorwaardelijk opeisbaar
      is voordat één jaar na de uitgifte van het aandeel is verstreken, wordt deze vordering buiten beschouwing gelaten
      bij de berekening van het eigen vermogen van de vennootschap, zoals bedoeld in dit boek, en bij de vaststelling van
      de in het eerste lid bedoelde waarde.

      4 Als bijstortingsplicht wordt in de wet aangeduid iedere verplichting tot storting op een uitgegeven aandeel die
      niet onmiddellijk en onvoorwaardelijk opeisbaar is.

      5 Behoudens ontheffing van de bijstortingsplicht op de voet van [artikel 215][ref1] kan de houder van een aandeel
      niet worden ontheven van zijn verplichtingen uit hoofde van dit artikel. Bij vervreemding van een aandeel blijft de
      vervreemder nog gedurende een jaar naast de verkrijger hoofdelijk aansprakelijk voor uit dit artikel voortvloeiende
      verplichtingen.

      6 Ten aanzien van een verplichting tot storting of bijstorting op een aandeel kan de wederpartij van de
      vennootschap zich nimmer op verrekening beroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel215
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel207
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '215'
        afdeling: '3'
  - number: '208'
    text: |-
      1 Aan de nemer of houder van een aandeel wordt desgevraagd een op naam gesteld aandeelbewijs afgegeven. De waarde
      van de verrichte storting en de eventuele bijstortingsverplichting worden daarop aangetekend.

      2 Aan de latere verkrijger te goeder trouw kan niet worden tegengeworpen dat het daarop door de vennootschap
      vermelde aangaande de storting of de bijstortingsverplichting onjuist of onvolledig is.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel208
  - number: '209'
    text: |-
      1 Het bestuur houdt een register bij, waarin de namen en adressen van alle houders van aandelen zijn opgenomen,
      met vermelding van de soort aandeel, daaraan verbonden stemrecht, het daarop gestorte of als gestort weergegeven
      bedrag, de eventuele bijstortingsverplichting, de dag van verkrijging, de eventuele aansprakelijkheid uit hoofde
      van [artikel 205, vijfde lid][ref1], en het al of niet afgegeven zijn van een aandeelbewijs. Aangetekend worden ook
      de vestiging of overdracht van vruchtgebruik op de aandelen en de vestiging van pandrecht op de aandelen, alsmede
      een daarmee samenhangende overgang van stemrecht. Het register wordt regelmatig bijgehouden. Bij iedere mutatie
      wordt de dag waarop deze is aangebracht vermeld.

      2 Iedere aandeelhouder heeft recht op inzage in het register. De statuten kunnen het inzagerecht aan anderen
      toekennen.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel205
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel209
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '205'
        afdeling: '2'
  - number: '210'
    text: |-
      1 Aandelen zijn overdraagbaar, behoudens het in [artikel 211][ref1] en elders in de wet bepaalde.

      2 Levering van aandelen geschiedt door een door partijen getekende akte van overdracht en hetzij betekening van
      die akte aan de vennootschap, hetzij erkenning van de overdracht door de vennootschap. Erkenning geschiedt door
      een ondertekende aantekening op de akte van overdracht of een aan de verkrijger gerichte schriftelijke verklaring
      van de vennootschap. Betreft het aandelen waarop een bijstortingsplicht rust, dan kan erkenning slechts geschieden
      wanneer de akte van overdracht een vaste dagtekening draagt.

      3 Indien een aandeelbewijs door de vennootschap is afgegeven kan dat stuk, voorzien van een door partijen
      ondertekende aantekening tot overdracht, als akte van overdracht gelden.

      4 De statuten kunnen bepalen dat, indien een aandeelbewijs door de vennootschap is afgegeven, als akte van
      overdracht uitsluitend kan gelden een stuk als bedoeld in het derde lid. Zij kunnen ook bepalen dat erkenning
      of betekening slechts kan geschieden na inlevering van het afgegeven aandeelbewijs, zulks onverminderd het
      recht van de opvolgend aandeelhouder op afgifte van een te zijnen name gesteld aandeelbewijs op de voet van
      [artikel 208, eerste lid][ref2]. In beide gevallen lijdt de regel uitzondering wanneer de vervreemder ten genoege
      van de vennootschap aannemelijk maakt dat zijn aandeelbewijs verloren is gegaan. De vervreemder, die zich op deze
      bepaling beroept, is tegenover de vennootschap en derden aansprakelijk voor alle als gevolg hiervan te lijden
      schade.

      5 De levering en de dag daarvan worden in het register, bedoeld in [artikel 209][ref3], aangetekend.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel211
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel208
      [ref3]: https://wetten.overheid.nl/BWBR0028744#Artikel209
