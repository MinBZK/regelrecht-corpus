  - number: '341'
    text: |-
      1 In een schriftelijke toelichting geeft het bestuur van elke partij bij de splitsing de redenen voor de splitsing
      met een uiteenzetting over de verwachte gevolgen voor de werkzaamheden en een toelichting uit juridisch, economisch
      en sociaal oogpunt.

      2 Indien het laatste boekjaar van de rechtspersoon, waarover een jaarrekening of andere financiële verantwoording
      is vastgesteld, meer dan zes maanden voor de nederlegging van het voorstel tot splitsing is verstreken, maakt het
      bestuur een jaarrekening of tussentijdse vermogensopstelling op. Deze heeft betrekking op de stand van het vermogen
      op ten vroegste de eerste dag van de derde maand voor de maand waarin zij wordt neergelegd.

      De vermogendes opstelling wordt opgemaakt met inachtneming van de indeling en de waarderingsmethoden die in de
      laatst vastgestelde jaarrekening of andere financiële verantwoording zijn toegepast, tenzij daarvan gemotiveerd
      wordt afgeweken op grond dat de actuele waarde belangrijk afwijkt van de boekwaarde.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel341
  - number: '342'
    text: |-
      1 Elke partij bij de splitsing legt ten kantore van het handelsregister neer:

      a. het voorstel tot splitsing;

      b. de laatste drie goedgekeurde jaarrekeningen of andere financiële verantwoordingen van de partijen bij de
      splitsing, met de deskundigenverklaring daarbij, voor zover deze stukken ter inzage liggen of moeten liggen;

      c. de jaarverslagen van de partijen bij de splitsing over de laatste drie afgesloten jaren, voor zover deze ter
      inzage liggen of moeten liggen;

      d. tussentijdse vermogensopstellingen of niet goedgekeurde jaarrekeningen, voor zover vereist ingevolge
      [artikel 341, tweede lid][ref1], en voor zover de jaarrekening van de rechtspersoon ter inzage moet liggen.

      2 Tegelijkertijd legt het bestuur de stukken, met inbegrip van jaarrekeningen en jaarverslagen die niet ter
      openbare inzage hoeven te liggen, samen met de toelichtingen van de besturen op het voorstel neer ten kantore
      van de rechtspersoon of, bij gebreke van een kantoor, aan de woonplaats van een bestuurder. De stukken liggen tot
      het tijdstip van de splitsing op het adres van elke verkrijgende rechtspersoon en de voortbestaande gesplitste
      rechtspersoon, onderscheidenlijk op het adres van een bestuurder daarvan, nog zes maanden nadien ter inzage voor de
      leden of aandeelhouders en voor hen die een bijzonder recht jegens de rechtspersoon hebben, zoals een recht op een
      uitkering van winst, tot het nemen van aandelen of tot het bijwonen van vergaderingen. In dit tijdvak kunnen zij
      kosteloos een afschrift daarvan krijgen.

      3 De partijen bij de splitsing kondigen in de Staatscourant en in een in het openbaar lichaam Bonaire, Sint
      Eustatius of Saba verschijnend nieuwsblad aan dat de stukken zijn neergelegd, met opgave van de openbare registers
      waar zij liggen en van het adres waar zij krachtens het tweede lid ter inzage liggen. Indien het besluit tot
      splitsing moet worden goedgekeurd op de voet van [artikel 346, vijfde lid][ref2], wordt mededeling gedaan van het
      tijdstip van behandeling van het goedkeuringsverzoek.

      4 Indien de besturen van de partijen bij de splitsing het voorstel tot splitsing wijzigen, is het eerste tot en met
      het derde lid van overeenkomstige toepassing.

      5 Het tweede lid geldt niet voor stichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel341
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel346
