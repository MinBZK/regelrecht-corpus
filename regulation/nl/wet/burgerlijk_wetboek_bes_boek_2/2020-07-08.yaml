  - number: '327'
    text: |-
      In de toelichting op het voorstel tot fusie moet het bestuur mededelen:

      a. volgens welke methode of methoden de ruilverhouding van de aandelen is vastgesteld;

      b. of deze methode of methoden in het gegeven geval passen;

      c. tot welke waardering elke gebruikte methode leidt;

      d. indien meer dan een methode is gebruikt, of het bij de waardering aangenomen betrekkelijke gewicht van de
      methoden in het maatschappelijke verkeer als aanvaardbaar kan worden beschouwd; en

      e. welke bijzondere moeilijkheden er eventueel zijn geweest bij de waardering en bij de bepaling van de
      ruilverhouding.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel327
  - number: '328'
    text: |-
      1 Een door het bestuur aangewezen externe deskundige als bedoeld in [artikel 121][ref1] moet het voorstel tot
      fusie onderzoeken en moet verklaren of de voorgestelde ruilverhouding van de aandelen, mede gelet op de bijgevoegde
      stukken, naar zijn oordeel redelijk is. Hij moet tevens een verslag opstellen, waarin hij zijn oordeel geeft over
      de fusiebalans van de verkrijgende vennootschap en de mededelingen, bedoeld in [artikel 327][ref2].

      2 Indien een van de fuserende vennootschappen een naamloze vennootschap is, wordt bij deze slechts dezelfde persoon
      als bij een andere fuserende rechtspersoon als deskundige aangewezen, indien de algemene vergadering het besluit
      daartoe heeft goedgekeurd.

      3 De deskundigen zijn bij alle fuserende vennootschappen gelijkelijk tot onderzoek bevoegd.

      4 Op de verklaring van de deskundige is [artikel 314][ref3] van overeenkomstige toepassing en op zijn verslag het
      tweede en derde lid van artikel 314.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel121
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel327
      [ref3]: https://wetten.overheid.nl/BWBR0028744#Artikel314
