  - number: '36'
    text: |-
      1 Voor de toepassing van de bepalingen van dit boek wordt met een schriftelijke uiting gelijkgesteld een per
      exploit, telegram, telex, telefax, e-mail of ander tekst overbrengend communicatiemiddel gedane uiting.

      2 Uit alle geschriften, gedrukte stukken en schriftelijke uitingen van de rechtspersoon, met uitzondering van
      uitingen per telegram, telex, telefax, e-mail of ander tekstoverbrengend communicatiemiddel, moeten de volledige
      naam van de rechtspersoon, het openbaar lichaam waar hij zijn statutaire zetel heeft en zijn plaats van vestiging
      duidelijk blijken. Is de rechtspersoon ingeschreven in het handelsregister dan wordt ook het inschrijfnummer
      vermeld.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel36
  - number: '37'
    text: |-
      1 Voor de oprichting van een rechtspersoon, die bij notariële akte moet worden opgericht, zijn de oprichters aan de
      Staat een vast recht verschuldigd. De hoogte van het vast recht wordt vastgesteld bij ministeriële regeling.

      2 Het vast recht wordt ten behoeve van de Staat door de notaris voor wie de akte van oprichting wordt verleden
      geïnd. Indien een notaris nalaat het vast recht te innen, is hij niettemin afdrachtsplichtig.

      3 Het vast recht wordt op aangifte afgedragen binnen dertig dagen na de dag dat de akte van oprichting is verleden.
      De aangifte wordt gedaan door het aanbieden van de akte van oprichting.

      4 De aangifte wordt gelijktijdig met de betaling gedaan bij de ontvanger, bedoeld in
      [artikel 1.3, onderdeel k, van de Belastingwet BES][ref1] in het openbaar lichaam Bonaire, Sint Eustatius of Saba
      waar de akte van oprichting is verleden.

      5 Invordering geschiedt overeenkomstig [afdeling 3 van titel 5 van hoofdstuk VIII van de Belastingwet BES][ref2].

      6 Het bepaalde in het eerste tot en met het vijfde lid is van overeenkomstige toepassing bij wijziging van de
      statuten en bij omzetting van een naamloze of besloten vennootschap, met dien verstande dat het vast recht dan door
      de vennootschap verschuldigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel1.3
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Afdeling3
