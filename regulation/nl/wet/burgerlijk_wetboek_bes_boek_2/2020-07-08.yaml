  - number: '18'
    text: |-
      1 De statuten kunnen bepalen dat de bestuurstaken op de in dit artikel bepaalde wijze worden verdeeld over een
      algemeen bestuur en een uitvoerend bestuur.

      2 Behoudens beperkingen overeenkomstig [artikel 8, tweede lid][ref1], is het uitvoerend bestuur belast met het
      besturen van de rechtspersoon, voor zover dit betrekking heeft op de dagelijkse gang van zaken. Het uitvoerend
      bestuur is voorts belast met de overige taken die in dit boek aan het bestuur zijn toebedeeld.

      3 Behoudens beperkingen in de wet en de statuten is het uitvoerend bestuur bevoegd tot vertegenwoordiging van de
      rechtspersoon. [Artikel 10][ref2] vindt overeenkomstige toepassing.

      4 Tot de taak van het algemeen bestuur behoort in elk geval: het als zodanig benoemen van uitvoerende bestuurders
      en het vaststellen van hun bezoldiging als zodanig, het beslissen over aangelegenheden die de dagelijkse gang van
      zaken te boven gaan en het houden van toezicht op het uitvoerend bestuur.

      5 Bij twijfel of een aangelegenheid tot de dagelijkse gang van zaken behoort beslist het algemeen bestuur of dit
      zo is.

      6 Een of meer leden van het algemeen bestuur kunnen tevens lid zijn van het uitvoerend bestuur, mits zij in het
      algemeen bestuur een minderheid vormen en tezamen in het algemeen bestuur minder stemmen kunnen uitbrengen dan de
      overige leden van het algemeen bestuur tezamen.

      7 Het uitvoerend bestuur verschaft het algemeen bestuur en de individuele leden van het algemeen bestuur tijdig de
      voor de uitoefening van hun taak noodzakelijke of met het oog daarop door de betrokkene verlangde gegevens.

      8 Het algemeen bestuur is te allen tijde bevoegd een uitvoerend bestuurder als zodanig te ontslaan of voor een
      periode van maximaal twee maanden te schorsen.

      9 Voor de toepassing van [artikel 8, derde lid][ref3], heeft het algemeen bestuur als bestuur te gelden. Het
      uitvoerend bestuur oefent zijn bevoegdheden als zodanig uit met inachtneming van de besluiten van het algemeen
      bestuur. Binnen het uitvoerend bestuur oefenen individuele bestuurders hun bevoegdheden uit met inachtneming van de
      besluiten van het uitvoerend bestuur.

      10 Onverminderd het bepaalde in het negende lid hebben voor de toepassing van de wet leden van het algemeen
      bestuur en van het uitvoerend bestuur gelijkelijk als bestuurder te gelden, voor zover het tegendeel niet uit de
      wet blijkt.


