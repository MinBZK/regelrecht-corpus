  - number: '362'
    text: |-
      1 Indien alle verkrijgende vennootschappen bij de splitsing worden opgericht en de splitsende rechtspersoon
      daarvan bij de splitsing direct of indirect enig aandeelhouder wordt, zijn de [artikelen 340, vierde lid][ref1], en
      [357 tot en met 359][ref2] niet van toepassing.

      2 Indien alle voor de splitsing vereiste besluiten worden genomen met de daarvoor uitgebrachte stemmen van alle
      stemgerechtigde personen zijn de [artikelen 357 tot en met 359][ref3] niet van toepassing.


