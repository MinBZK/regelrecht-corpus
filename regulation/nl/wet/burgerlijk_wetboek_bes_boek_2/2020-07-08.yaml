  - number: '337'
    text: |-
      1 Indien het gehele vermogen van de splitsende rechtspersoon overgaat, houdt hij door het van kracht worden van de
      splitsing op te bestaan.

      2 Het eerste lid geldt niet, indien ten minste een verkrijgende rechtspersoon een bij de splitsing opgerichte
      naamloze of besloten vennootschap is en de splitsende rechtspersoon daarvan bij de splitsing alle aandelen
      verkrijgt.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel337
  - number: '338'
    text: |-
      1 De waarde van het deel van het vermogen van de splitsende rechtspersoon dat elke verkrijgende rechtspersoon
      verkrijgt ten tijde van de splitsing moet ten minste nul zijn.

      2 Hetzelfde geldt voor het eigen vermogen dat een voortbestaande splitsende rechtspersoon behoudt.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel338
  - number: '339'
    text: |-
      1 De leden of aandeelhouders van de splitsende rechtspersoon worden door de splitsing lid of aandeelhouder van alle
      verkrijgende rechtspersonen.

      2 Geen aandelen in een verkrijgende vennootschap worden verkregen voor aandelen in een splitsende vennootschap die
      door of voor rekening van die verkrijgende vennootschap of door of voor rekening van de splitsende vennootschap
      worden gehouden.

      3 Het eerste lid geldt voorts niet voor zover:

      a. alle aandelen in de verkrijgende vennootschappen direct of indirect worden gehouden door of voor rekening van de
      splitsende vennootschap en de splitsende vennootschap niet ophoudt te bestaan;

      b. ten aanzien van verkrijgende vennootschappen [artikel 360][ref1] of [artikel 363][ref2] wordt toegepast;

      c. krachtens de ruilverhouding van de aandelen zelfs geen recht bestaat op een enkel aandeel.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel360
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel363
