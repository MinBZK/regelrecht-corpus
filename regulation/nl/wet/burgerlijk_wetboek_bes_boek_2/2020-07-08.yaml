  - number: '120'
    text: |-
      1 Jaarlijks binnen zes maanden na afloop van het boekjaar, behoudens verlenging van deze termijn door de algemene
      vergadering op grond van bijzondere omstandigheden met ten hoogste zes maanden, maakt het bestuur een jaarrekening
      op en een jaarverslag en legt het deze stukken voor alle aandeelhouders ter inzage ten kantore van de vennootschap.
      De stukken worden opgemaakt in de taal van de statuten, tenzij de algemene vergadering tevoren anders heeft
      beslist.

      2 Het bestuur voegt aan de jaarrekening toe: de laatste beschikbare jaarrekening met de daarbij eventueel behorende
      deskundigenverklaring en het jaarverslag van de dochtermaatschappijen, voor zover deze niet zijn geconsolideerd
      tenzij, blijkens de toelichting op de jaarrekening, vermelding van deze gegevens van te verwaarlozen betekenis is
      voor het door de vennootschap te verschaffen inzicht als in het derde lid bedoeld.

      3 De jaarrekening wordt opgesteld volgens de door de International Accounting Standards Board (IASB) vastgestelde
      normen en geeft een zodanig inzicht dat een verantwoord oordeel kan worden gevormd omtrent het vermogen en het
      resultaat, alsmede, voor zover de aard van een jaarrekening dat toelaat, omtrent de solvabiliteit en de liquiditeit
      van de vennootschap. De vennootschap mag de jaarrekening opstellen volgens andere internationaal aanvaarde normen,
      mits uit de toelichting blijkt welke gegronde redenen daartoe aanleiding hebben gegeven en volgens welke normen de
      jaarrekening is opgesteld.

      4 De opgemaakte jaarrekening wordt door alle bestuurders ondertekend. Zij wordt mede ondertekend door de
      commissarissen die in functie zijn. Ontbreekt een handtekening dan wordt de reden daarvoor medegedeeld.

      5 Het jaarverslag geeft een getrouw beeld van de toestand op de balansdatum en de gang van zaken gedurende het
      boekjaar van de vennootschap en van de dochtermaatschappijen waarvan de financiële gegevens in haar jaarrekening
      zijn opgenomen. Het bevat mede inlichtingen omtrent gebeurtenissen van bijzondere betekenis, die na het einde van
      het boekjaar hebben plaatsgevonden, terwijl voorts mededelingen worden gedaan over de verwachte gang van zaken. Het
      jaarverslag mag niet in strijd zijn met de jaarrekening.

      6 Het jaarverslag wordt onverwijld na afloop van de in het eerste lid genoemde termijn aangeboden aan de
      algemene vergadering. Tegelijkertijd wordt de opgemaakte jaarrekening aan de algemene vergadering ter goedkeuring
      voorgelegd. De statuten kunnen bepalen dat de algemene vergadering de bevoegdheid heeft alle of bepaalde posten te
      wijzigen dan wel het bestuur op te dragen de jaarrekening te wijzigen volgens door de algemene vergadering of een
      commissie uit die vergadering te geven aanwijzingen.

      7 [Artikel 15, derde lid][ref1], vindt overeenkomstige toepassing op het jaarverslag, de opgemaakte en goedgekeurde
      jaarrekening en de daarbij behorende stukken.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel15
