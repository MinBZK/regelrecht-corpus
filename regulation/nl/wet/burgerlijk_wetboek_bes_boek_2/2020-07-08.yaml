  - number: '200'
    text: |-
      1 De besloten vennootschap is een rechtspersoon met een of meer op naam gestelde aandelen. De vennootschap kent
      geen aandelen aan toonder.

      2 De vennootschap wordt door een of meer personen opgericht bij notariële akte. Bij de oprichting wordt ten minste
      één aandeel met volledig stemrecht, dat deelt in de winst, dan wel één aandeel met volledig stemrecht en één
      aandeel dat deelt in de winst, bij een oprichter of een derde geplaatst.

      3 Rechten die stemrecht noch aanspraak op winstuitkering omvatten, worden niet als aandeel aangemerkt.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel200
  - number: '201'
    text: |-
      1 Onverminderd het bepaalde in [artikel 4, tweede lid][ref1], bevat de akte van oprichting in elk geval:

      a. de aantallen en soorten van de bij de oprichting geplaatste aandelen, alsmede de namen en woonplaatsen van
      degenen die deze aandelen hebben genomen;

      b. indien uitsluitend in geld wordt gestort, een verklaring van alle oprichters dat het eigen vermogen van de
      vennootschap bij oprichting niet negatief is.

      2 Wordt in natura gestort dan wordt aan de akte gehecht een door alle oprichters getekende oprichtingsbalans die
      een eigen vermogen toont dat niet negatief is.

      3 Heeft de vennootschap bij de oprichting een nominaal kapitaal dan wordt bij de toepassing van het eerste lid
      onder b en het tweede lid het bedrag daarvan in aanmerking genomen.

      4 De akte wordt in persoon of bij schriftelijke volmacht getekend door iedere oprichter en door ieder die blijkens
      de akte een of meer aandelen neemt.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel4
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel201
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '4'
  - number: '202'
    text: |-
      1 De statuten vermelden de naam, het openbaar lichaam waar de vennootschap haar zetel heeft en het doel van de
      vennootschap. De naam vangt aan of eindigt met de woorden besloten vennootschap, hetzij voluit geschreven, hetzij
      afgekort tot «B.V.». De naam mag niet in andere dan Latijnse schrifttekens gesteld zijn.

      2 De statuten kunnen bepalen dat er verschillende soorten aandelen zijn. Zij kunnen aan een of meer soorten een
      nominale waarde toekennen. De nominale waarde kan in een of meer vreemde muntsoorten worden uitgedrukt.

      3 Door statutenwijziging kan de nominale waarde worden opgeheven of gewijzigd. Vermeerdering van de nominale waarde
      mag er niet toe leiden dat het nominaal kapitaal groter wordt dan het eigen vermogen van de vennootschap. Als
      nominaal kapitaal heeft te gelden de som van de nominale waarden van de uitgegeven aandelen.

      4 Kennen de statuten aandelen met een nominale waarde dan bevatten zij bepalingen met betrekking tot de aan die
      aandelen en andere aandelen verbonden stem-, winst- en liquidatierechten.

      5 In afwijking van [artikel 3, tweede lid][ref1], kunnen de statuten bepalen dat houders van aandelen of van een
      bepaald soort aandelen persoonlijk aansprakelijk zijn, al dan niet hoofdelijk, voor bepaalde of alle schulden van
      de vennootschap. In dat geval komt het in [artikel 209, tweede lid][ref2], bedoelde inzagerecht toe aan iedere
      belanghebbende. Iedere belanghebbende kan voorts verlangen dat aan hem wordt afgegeven een door het bestuur van de
      vennootschap gewaarmerkt uittreksel uit het register waarop de voor hem van belang zijnde gegevens staan vermeld.
      Een besluit tot wijziging van de statuten, waardoor een zodanige persoonlijke aansprakelijkheid wordt ingevoerd,
      gewijzigd of afgeschaft, kan slechts tot stand komen met de uitdrukkelijke instemming van alle aandeelhouders.

      6 Wordt door statutenwijziging een aansprakelijkheidsregeling als bedoeld in het vijfde lid afgeschaft of
      gewijzigd, waardoor de aansprakelijkheid van een of meer aandeelhouders vervalt of vermindert, dan heeft die
      afschaffing of wijziging ook effect voor bestaande schulden, zulks slechts met dien verstande dat ten aanzien van
      die schulden het verval of de vermindering van de aansprakelijkheid eerst intreedt zes maanden na het tijdstip
      waarop, nadat de statutenwijziging heeft plaatsgevonden, ten aanzien van de betrokken aandeelhouder een daarop
      aansluitende aantekening in het register als bedoeld in [artikel 209][ref3] is gedaan, alles onverminderd het
      bepaalde in de [Handelsregisterwet 2009 BES][ref4]. De statuten kunnen deze termijn verlengen.

      7 Houdt een aandeelhouder, op wie een aansprakelijkheid rust uit hoofde van een statutaire bepaling als bedoeld
      in het vijfde lid, op aandeelhouder te zijn, dan vervalt ook de aansprakelijkheid voor bestaande schulden, zulks
      echter met dien verstande dat ten aanzien van die schulden het verval van aansprakelijkheid eerst intreedt zes
      maanden na het tijdstip waarop, nadat zijn aandeelhouderschap is geëindigd, daarvan aantekening is gedaan in het
      register als bedoeld in [artikel 209][ref5]. De statuten kunnen deze termijn verlengen.

      8 De statuten kunnen, naast het bepaalde in [artikel 27][ref6], andere wijzen van ontbinding aangeven. Een
      ontbinding krachtens een statutaire bepaling treedt niet in alvorens daaraan bekendheid is gegeven door de
      vereffenaars overeenkomstig artikel 27, tweede lid. De statutaire bepaling verliest haar geldigheid indien de
      bekendmaking niet binnen zes maanden na het tijdstip waarop dat voor het eerst mogelijk was is geschied.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel209
      [ref3]: https://wetten.overheid.nl/BWBR0028744#Artikel209
