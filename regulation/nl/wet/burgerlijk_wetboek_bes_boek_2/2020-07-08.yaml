      1 Iedere belanghebbende kan van de vennootschap in rechte nakoming vorderen van de in
      [artikel 120, eerste, tweede en zesde lid][ref1], [artikel 121, eerste lid][ref2] en [artikel 122][ref3] omschreven
      verplichtingen.

      2 Iedere belanghebbende die van oordeel is dat de jaarrekening of het jaarverslag niet voldoet aan het bepaalde
      in [artikel 120, derde of vijfde lid][ref4], dan wel [artikel 124, tweede lid][ref5], kan van de vennootschap
      in rechte vorderen deze stukken in te richten of aan te vullen overeenkomstig bij rechterlijk bevel te geven
      aanwijzing. De vordering kan ook betrekking hebben op een jaarrekening die nog niet is goedgekeurd. Zij kan ook
      worden ingesteld door het openbaar ministerie in algemeen belang.

      3 De in het tweede lid bedoelde vordering moet worden ingesteld binnen zes maanden nadat aan de verplichting tot
      openbaarmaking is voldaan. Zij kan ook worden ingesteld vóór de openbaarmaking. Het verzoekschrift vermeldt in welk
      opzicht de jaarrekening of het jaarverslag herziening behoeven. De rechter beslist niet dan nadat hij de deskundige
      die met het onderzoek van de jaarrekening is belast geweest, in de gelegenheid heeft gesteld te worden gehoord over
      de onderwerpen van de vordering.

      4 Voor zover de rechter de vordering toewijst, geeft hij aan de vennootschap een bevel omtrent de wijze waarop deze
      de jaarrekening of het jaarverslag moet inrichten; het bevel bevat daaromtrent nauwkeurige aanwijzingen.

      5 De rechter kan, ook ambtshalve, beslissen dat het bevel mede of uitsluitend een of meer toekomstige
      jaarrekeningen of jaarverslagen betreft. Op verzoek van de vennootschap kan de rechter dit bevel intrekken of
      wijzigen wegens wijziging der omstandigheden. Hierover beslist de rechter niet dan nadat hij degene op wiens
      vordering het bevel is gegeven, in de gelegenheid heeft gesteld te worden gehoord.

      6 Indien het bevel betrekking heeft op een goedgekeurde jaarrekening, vernietigt het bevel die goedkeuring. De
      rechter kan de gevolgen van de vernietiging beperken.


