  - number: '121'
    text: |-
      1 De vennootschap verleent aan een externe deskundige die bevoegd is tot het afleggen van de in het vijfde lid van
      dit artikel bedoelde verklaring, de opdracht tot onderzoek van de jaarrekening. De opdracht kan worden verleend aan
      een organisatie waarin deskundigen die mogen worden aangewezen, samenwerken.

      2 Tot het verlenen van de opdracht is de algemene vergadering bevoegd. Gaat deze daartoe niet over dan is de raad
      van commissarissen bevoegd of, zo deze ontbreekt of in gebreke blijft, het bestuur.

      3 De deskundige onderzoekt of de jaarrekening voldoet aan de in [artikel 120, derde lid][ref1], gestelde vereisten.
      Hij gaat voorts na of het jaarverslag voor zover hij dat kan beoordelen, in overeenstemming met het in artikel 120,
      vijfde lid, bepaalde is opgesteld en met de jaarrekening verenigbaar is.

      4 De deskundige is gerechtigd tot inzage van alle boeken, bescheiden en andere gegevensdragers van de vennootschap
      waarvan de kennisneming tot richtige invulling van zijn taak nodig is. Het is hem verboden hetgeen hem nopens de
      zaken der vennootschap blijkt of medegedeeld wordt, verder bekend te maken dan zijn opdracht met zich brengt.

      5 De deskundige brengt omtrent zijn onderzoek verslag uit aan het orgaan dat hem heeft benoemd, het bestuur
      en, zo die er is, de raad van commissarissen. Hij geeft de uitslag van zijn onderzoek weer in een schriftelijke
      verklaring, waarin hij zijn oordeel geeft over de getrouwheid van de jaarrekening en de gebleken tekortkomingen.

      6 Tot het afleggen van de in het vijfde lid bedoelde verklaring is bevoegd een register-accountant
      in de zin van de Nederlandse regelgeving, een accountant-administratieconsulent als bedoeld in
      [artikel 2:393, eerste lid, Nederlands BW][ref2], een certified public accountant in de zin van de regelgeving
      in de Verenigde Staten, alsmede iemand die door Onze Minister van Financiën bij een herroepelijke vergunning
      als deskundige is toegelaten op grond van een bewijs dat betrokkene voldoet aan eisen van bekwaamheid.
      Deze eisen moeten op een niveau liggen dat gelijkwaardig is aan dat van een registeraccountant, accountant-
      administratieconsulent als bedoeld of certified public accountant als bedoeld. Onze Minister kan aan de vergunning
      voorwaarden verbinden.

      7 De jaarrekening kan door de algemene vergadering eerst worden goedgekeurd nadat zij kennis heeft kunnen nemen van
      de verklaring van de deskundige, die aan de jaarrekening moet zijn toegevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel120
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
