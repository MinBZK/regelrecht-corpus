  - number: '90'
    text: |-
      1 De coöperatie is een bij notariële akte als coöperatie opgerichte rechtspersoon met leden. Zij moet zich blijkens
      de statuten ten doel stellen in bepaalde stoffelijke behoeften van haar leden te voorzien krachtens overeenkomsten,
      anders dan van verzekering, met hen gesloten in het bedrijf dat zij te dien einde te hunnen behoeve uitoefent of
      doet uitoefenen.

      2 De onderlinge waarborgmaatschappij is een bij notariële akte als onderlinge waarborgmaatschappij
      opgerichte rechtspersoon met leden. Zij moet zich blijkens de statuten ten doel stellen met haar leden
      verzekeringsovereenkomsten te sluiten of leden en mogelijk anderen in het kader van een wettelijke regeling
      verzekerd te houden, een en ander in het verzekeringsbedrijf dat zij te dien einde ten behoeve van haar leden
      uitoefent.

      3 De statuten van een coöperatie kunnen haar veroorloven overeenkomsten als die welke zij met haar leden sluit, ook
      met anderen aan te gaan. Hetzelfde geldt voor de statuten van een onderlinge waarborgmaatschappij die geen bepaling
      als bedoeld in [artikel 92][ref1] kennen.

      4 Indien een coöperatie of een onderlinge waarborgmaatschappij de in het derde lid bedoelde bevoegdheid uitoefent,
      mag zij dat niet in een zodanige mate doen, dat de overeenkomsten met de leden slechts van ondergeschikte betekenis
      zijn.

      5 De naam van een coöperatie moet het woord «coöperatief» bevatten of een afleiding daarvan, die van een onderlinge
      waarborgmaatschappij het woord «onderling» of «wederkerig» of een afleiding daarvan. Is de akte van oprichting
      in een andere taal dan de Nederlandse gesteld dan kan het equivalent van deze woorden in die andere taal worden
      gebruikt.


