      1 De algemene vergadering van aandeelhouders of een daartoe in of krachtens de statuten aangewezen ander orgaan
      is bevoegd na de oprichting te besluiten tot uitgifte van nieuwe aandelen op naam. De daarop volgende uitgifte
      geschiedt bij een door de vennootschap en de nemer getekende akte. [Artikel 15, derde lid][ref1], is van
      overeenkomstige toepassing op de akte.

      2 Aandelen aan toonder kunnen niet als zodanig worden uitgegeven. Indien de statuten dat mogelijk maken kan dit ook
      worden bepaald in een latere akte van uitgifte. Vanaf de afgifte van het toonderbewijs geldt het betrokken aandeel
      als een aandeel aan toonder.


