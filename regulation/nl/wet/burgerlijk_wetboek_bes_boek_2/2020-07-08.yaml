  - number: '70'
    text: |-
      1 De vereniging is een rechtspersoon met leden die is gericht op een bepaald doel, anders dan een dat is omschreven
      in [artikel 90, eerste of tweede lid][ref1].

      2 Een vereniging wordt bij meerzijdige rechtshandeling opgericht.

      3 Een vereniging mag geen winst onder haar leden verdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel90
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '90'
  - number: '71'
    text: |-
      1 Wordt een vereniging opgericht bij een notariële akte dan moeten, onverminderd het bepaalde in [artikel 4][ref1],
      de volgende bepalingen in acht worden genomen.

      2 De statuten moeten inhouden:

      a. de naam van de vereniging en het openbaar lichaam waar zij haar zetel heeft;

      b. het doel van de vereniging;

      c. de verplichtingen die de leden tegenover de vereniging hebben, of de wijze waarop zodanige verplichtingen kunnen
      worden opgelegd;

      d. de wijze van bijeenroeping van de algemene vergadering;

      e. de wijze van benoeming en ontslag van de bestuurders;

      f. de bestemming van het overschot na vereffening in geval van ontbinding van de vereniging of de wijze waarop de
      bestemming zal worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel4
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '4'
  - number: '72'
    text: |-
      1 Een vereniging die niet overeenkomstig het [eerste lid van artikel 71][ref1] is opgericht, kan geen regels kennen
      die als statuten in de zin van dit boek hebben te gelden, tenzij deze schriftelijk zijn vastgelegd in een daartoe
      bestemd document.

      2 De algemene vergadering van een vereniging als in het eerste lid bedoeld kan besluiten de statuten te doen
      opnemen in een notariële akte. Alsdan is [artikel 71][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel71
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '71'
      - id: ref2
        bwb_id: BWBR0028744
        artikel: '71'
  - number: '73'
    text: |-
      1 Een vereniging waarvan de statuten niet zijn opgenomen in een notariële akte, kan geen registergoederen
      verkrijgen en kan geen erfgenaam zijn.

      2 De bestuurders van een zodanige vereniging zijn hoofdelijk naast de vereniging verbonden voor schulden uit een
      rechtshandeling die tijdens hun bestuur ontstaan of opeisbaar worden. Na hun aftreden zijn zij voorts hoofdelijk
      verbonden voor schulden, voortspruitend uit een tijdens hun bestuur verrichte rechtshandeling.

      Aansprakelijkheid ingevolge een der voorgaande volzinnen rust niet op degene die niet tevoren over de
      rechtshandeling is geraadpleegd en die heeft geweigerd haar, toen zij hem bekend werd, als bestuurder voor zijn
      verantwoording te nemen.

      Ontbreken personen die ingevolge de eerste of tweede volzin naast de vereniging zijn verbonden, dan zijn degenen
      die handelden, hoofdelijk verbonden.

      3 De bestuurders van een zodanige vereniging kunnen haar doen inschrijven in het handelsregister. Daarbij leggen
      zij een afschrift van de statuten ten kantore van dat register neer. Is een afschrift bij het register neergelegd
      dan zijn in geval van statutenwijziging de bestuurders verplicht aldaar tevens een afschrift van de wijziging en
      van de gewijzigde statuten neer te leggen.

      4 Heeft de inschrijving bedoeld in het derde lid plaatsgevonden, dan is degene die uit hoofde van het tweede lid
      wordt verbonden slechts aansprakelijk, voor zover de wederpartij aannemelijk maakt dat de vereniging niet aan de
      verbintenis zal voldoen.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel73
  - number: '74'
    text: |-
      1 Een vereniging kan naast gewone leden ook een of meer andere soorten van leden hebben.

      2 Gewone leden hebben de rechten en verplichtingen die in dit boek aan leden zijn toegekend. Leden, niet zijnde
      gewone leden, hebben deze rechten en verplichtingen voor zover de statuten niet anders bepalen.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel74
  - number: '75'
    text: |-
      Tenzij de statuten anders bepalen, beslist het bestuur over de toelating van een lid en kan bij niet-toelating de
      algemene vergadering alsnog tot toelating besluiten.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel75
  - number: '76'
    text: |-
      1 Het lidmaatschap van de vereniging is persoonlijk, tenzij de statuten anders bepalen.

      2 Tenzij de statuten van de vereniging anders bepalen, gaat het lidmaatschap van een rechtspersoon die door fusie
      of splitsing ophoudt te bestaan, over op de verkrijgende rechtspersoon, onderscheidenlijk overeenkomstig de aan de
      akte van splitsing gehechte beschrijving op een van de verkrijgende rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel76
  - number: '77'
    text: Verbintenissen kunnen slechts bij of krachtens de statuten aan het lidmaatschap worden verbonden.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel77
  - number: '78'
    text: |-
      1 Het lidmaatschap eindigt:

      a. door de dood van het lid, tenzij de statuten overgang krachtens erfrecht toelaten;

      b. door opzegging door het lid;

      c. door opzegging door de vereniging;

      d. door ontzetting.

      2 De vereniging kan het lidmaatschap opzeggen in de gevallen in de statuten genoemd, voorts wanneer een lid
      heeft opgehouden aan de vereisten door de statuten voor het lidmaatschap gesteld, te voldoen, alsook wanneer
      redelijkerwijs van de vereniging niet gevergd kan worden het lidmaatschap te laten voortduren. Tenzij de statuten
      dit aan een ander orgaan opdragen, geschiedt de opzegging door het bestuur.

      3 Ontzetting kan alleen worden uitgesproken wanneer een lid in strijd met de statuten, reglementen of besluiten der
      vereniging handelt, of de vereniging op onredelijke wijze benadeelt.

      4 Tenzij de statuten dit aan een ander orgaan opdragen, geschiedt de ontzetting door het bestuur. Het lid wordt
      ten spoedigste schriftelijk van het besluit, met opgave van redenen, in kennis gesteld. Hem staat, behalve wanneer
      krachtens de statuten het besluit door de algemene vergadering is genomen, binnen één maand na ontvangst van de
      kennisgeving van het besluit, beroep op de algemene vergadering of een daartoe bij de statuten aangewezen orgaan of
      derde open. De statuten kunnen een andere regeling van het beroep bevatten, doch de termijn kan niet korter dan op
      één maand worden gesteld. Gedurende de beroepstermijn en hangende het beroep is het lid geschorst.

      5 Wanneer het lidmaatschap in de loop van een boekjaar eindigt, blijft, tenzij de statuten anders bepalen,
      desniettemin de jaarlijkse bijdrage voor het geheel verschuldigd.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel78
  - number: '79'
    text: |-
      1 Tenzij de statuten anders bepalen, kan opzegging van het lidmaatschap slechts geschieden tegen het einde van een
      boekjaar en met inachtneming van een opzeggingstermijn van vier weken. In ieder geval kan het lidmaatschap worden
      beëindigd door opzegging tegen het eind van het boekjaar, volgend op dat waarin wordt opgezegd, of onmiddellijk,
      indien redelijkerwijs niet gevergd kan worden het lidmaatschap te laten voortduren.

      2 Een opzegging in strijd met het in het eerste lid bepaalde, doet het lidmaatschap eindigen op het vroegst
      toegelaten tijdstip volgende op de datum waartegen was opgezegd.

      3 Een lid kan voorts zijn lidmaatschap met onmiddellijke ingang opzeggen binnen een maand nadat een besluit
      of statutenwijziging waarbij zijn rechten zijn beperkt of zijn verplichtingen zijn verzwaard, hem is bekend
      geworden of medegedeeld. Het besluit of de gewijzigde statutaire bepaling is alsdan niet op hem van toepassing.
      Deze bevoegdheid tot opzegging kan de leden bij de statuten worden ontzegd voor het geval van wijziging van daar
      nauwkeurig omschreven rechten en verplichtingen.

      4 Een lid kan zijn lidmaatschap ook met onmiddellijke ingang opzeggen binnen een maand nadat hem een besluit is
      meegedeeld tot omzetting van de vereniging in een andere rechtsvorm, tot fusie of tot splitsing.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel79
  - number: '80'
    text: |-
      1 Het bestuur wordt uit de leden benoemd. De statuten kunnen echter bepalen dat bestuurders ook buiten de leden
      kunnen worden benoemd.

      2 De benoeming geschiedt door de algemene vergadering. De statuten kunnen de wijze van benoeming echter ook anders
      regelen, mits elk lid middellijk of onmiddellijk aan de stemming over de benoeming der bestuurders kan deelnemen.

      3 De statuten kunnen bepalen, dat een of meer der bestuurders, mits minder dan de helft, door andere personen dan
      de leden worden benoemd.

      4 Is in de statuten bepaald dat een bestuurder in een vergadering uit een bindende voordracht moet worden benoemd,
      dan kan aan die voordracht het bindend karakter worden ontnomen door een met ten minste twee derden van de
      uitgebrachte stemmen genomen besluit van die vergadering. In de statuten kan worden bepaald dat op deze vergadering
      ten minste een bepaald aantal stemmen moet kunnen worden uitgebracht; dit aantal mag niet hoger worden gesteld dan
      twee derden van het aantal stemmen dat door de stemgerechtigden gezamenlijk kan worden uitgebracht.

      5 Indien ingevolge de statuten een bestuurder door leden of afdelingen buiten een vergadering wordt benoemd,
      dan moet aan de leden gelegenheid worden geboden kandidaten te stellen. De statuten kunnen bepalen dat dit recht
      slechts aan een aantal leden gezamenlijk toekomt, mits hun aantal niet hoger wordt gesteld dan een vijfde van het
      aantal leden dat aan de verkiezing kan deelnemen. De statuten kunnen voorts bepalen dat aldus gestelde kandidaten
      slechts zijn benoemd, indien zij ten minste een bepaald aantal stemmen op zich hebben verenigd, mits dit aantal
      niet groter is dan twee derden van het aantal der uitgebrachte stemmen.

      6 Een bestuurder kan, ook al is hij voor een bepaalde tijd benoemd, te allen tijde door het orgaan dat hem heeft
      benoemd, worden ontslagen of geschorst. Voor de toepassing van deze bepaling worden de bestuurders die bij de
      oprichting zijn aangewezen geacht te zijn benoemd door de algemene vergadering, tenzij uit de statuten anders
      voortvloeit.

      7 Tenzij de statuten anders bepalen, wijst het bestuur uit zijn midden een voorzitter, een secretaris en een
      penningmeester aan.

      8 Indien [artikel 18][ref1] toepassing heeft gevonden geldt het in dit artikel bepaalde voor de benoeming van het
      algemeen bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel18
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '18'
  - number: '81'
    text: |-
      1 Behoudens het in [artikel 82][ref1] bepaalde, hebben alle leden die niet geschorst zijn, toegang tot de algemene
      vergadering en hebben zij daar ieder één stem; een geschorst lid heeft toegang tot de vergadering waarin het
      besluit tot schorsing wordt behandeld, en is bevoegd daarover het woord te voeren. De statuten kunnen aan bepaalde
      leden meer dan één stem toekennen.

      2 Tenzij de statuten anders bepalen, treden de voorzitter en de secretaris van het bestuur of hun vervangers, als
      zodanig ook op bij de algemene vergadering.

      3 De statuten kunnen bepalen dat personen die deel uitmaken van andere organen der vereniging en die geen lid zijn,
      in de algemene vergadering stemrecht kunnen uitoefenen. Het aantal der door hen gezamenlijk uitgebrachte stemmen
      zal echter niet meer mogen zijn dan de helft van het aantal der door de leden uitgebrachte stemmen.

      4 Tenzij de statuten anders bepalen, kan iemand die krachtens het eerste lid of derde lid stemgerechtigd is, aan
      een andere stemgerechtigde schriftelijk volmacht verlenen tot het uitbrengen van zijn stem.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel82
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '82'
  - number: '82'
    text: |-
      1 De statuten kunnen bepalen dat de algemene vergadering zal bestaan uit afgevaardigden die door en
      uit de leden worden gekozen. De wijze van verkiezing en het aantal van de afgevaardigden worden door
      de statuten geregeld; elk lid moet middellijk of onmiddellijk aan de verkiezing kunnen deelnemen. Het
      [vierde en vijfde lid van artikel 80][ref1] zijn bij de verkiezing van overeenkomstige toepassing.
      [Artikel 81, derde lid][ref2], is van overeenkomstige toepassing op personen die deel uitmaken van andere organen
      der vereniging en die geen afgevaardigde zijn.

      2 De statuten kunnen bepalen dat bepaalde besluiten van de algemene vergadering aan een referendum zullen worden
      onderworpen. De statuten regelen de gevallen waarin, de tijd waarbinnen, en de wijze waarop het referendum zal
      worden gehouden. Hangende de uitslag van het referendum wordt de uitvoering van het besluit geschorst.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel81
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '80'
      - id: ref2
        bwb_id: BWBR0028744
        artikel: '81'
  - number: '83'
    text: |-
      1 Aan de algemene vergadering komen in de vereniging alle bevoegdheden toe, die niet door de wet of de statuten aan
      andere organen zijn toegekend.

      2 Een eenstemmig besluit van alle leden of afgevaardigden, ook al zijn deze niet in een vergadering bijeen, heeft,
      mits met voorkennis van het bestuur genomen, dezelfde kracht als een besluit van de algemene vergadering.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel83
  - number: '84'
    text: |-
      1 Het bestuur roept de algemene vergadering bijeen, zo dikwijls het dit wenselijk oordeelt, of wanneer het daartoe
      volgens de wet of de statuten verplicht is.

      De statuten kunnen deze bevoegdheid ook aan anderen dan het bestuur verlenen.

      2 Op schriftelijk verzoek van ten minste een zodanig aantal leden of afgevaardigden als bevoegd is tot het
      uitbrengen van een tiende gedeelte der stemmen in de algemene vergadering of van een zoveel geringer aantal als bij
      de statuten is bepaald, is het bestuur verplicht tot het bijeenroepen van een algemene vergadering op een termijn
      van niet langer dan vier weken na indiening van het verzoek.

      3 Indien aan het verzoek binnen veertien dagen geen gevolg wordt gegeven, kunnen, tenzij in de statuten de
      wijze van bijeenroeping der algemene vergadering voor dit geval anders is geregeld, de verzoekers zelf tot die
      bijeenroeping overgaan op de wijze waarop het bestuur de algemene vergadering bijeenroept of bij advertentie in ten
      minste één ter plaatse waar de vereniging gevestigd is, veelgelezen dagblad. De verzoekers kunnen alsdan anderen
      dan bestuurders belasten met de leiding der vergadering en het opstellen der notulen.

      4 Tenzij de statuten anders bepalen wordt de vergadering gehouden in het openbaar lichaam van de statutaire zetel.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel84
  - number: '85'
    text: |-
      De [artikelen 80 tot en met 84][ref1] zijn van overeenkomstige toepassing op de afdelingen van een vereniging die
      geen rechtspersonen zijn en die een algemene vergadering en een bestuur hebben. Hetgeen in die artikelen omtrent de
      statuten is bepaald, kan in een afdelingsreglement worden neergelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel80
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '80'
  - number: '86'
    text: |-
      1 Onverminderd het bepaalde in [artikel 5][ref1] kan in de statuten van de vereniging geen verandering worden
      gebracht dan door een besluit van een algemene vergadering, waartoe is opgeroepen met de mededeling dat aldaar
      wijziging van de statuten zal worden voorgesteld. De termijn voor oproeping tot een zodanige vergadering bedraagt
      ten minste zeven dagen, de dag van de oproeping en de dag van vergadering niet meegerekend.

      2 Zij die de oproeping tot de algemene vergadering ter behandeling van een voorstel tot statutenwijziging hebben
      gedaan, moeten ten minste vijf dagen vóór de vergadering een afschrift van dat voorstel, waarin de voorgedragen
      wijziging woordelijk is opgenomen, op een daartoe geschikte plaats voor de leden ter inzage leggen tot na
      afloop van de dag waarop de vergadering wordt gehouden. Aan de afdelingen waaruit de vereniging bestaat en aan
      afgevaardigden moet het voorstel ten minste veertien dagen vóór de vergadering ter kennis zijn gebracht; de vorige
      volzin is alsdan niet van toepassing.

      3 Het bepaalde in de eerste twee leden is niet van toepassing, indien in de algemene vergadering alle leden of
      afgevaardigden aanwezig of vertegenwoordigd zijn en het besluit tot statutenwijziging met algemene stemmen wordt
      genomen.

      4 Het in dit artikel en de eerste twee leden van het in [artikel 87][ref2] bepaalde is van overeenkomstige
      toepassing op een besluit tot ontbinding.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel87
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0028744
        artikel: '87'
  - number: '87'
    text: |-
      1 Tenzij de statuten anders bepalen, behoeft een besluit tot statutenwijziging ten minste twee derden van de
      uitgebrachte stemmen.

      2 Voor zover de bevoegdheid tot wijziging bij de statuten mocht zijn uitgesloten, is wijziging niettemin mogelijk
      met algemene stemmen in een vergadering, waarin alle leden of afgevaardigden aanwezig of vertegenwoordigd zijn.

      3 Een bepaling in de statuten, welke de bevoegdheid tot wijziging van een of meer andere bepalingen beperkt, kan
      slechts worden gewijzigd met inachtneming van gelijke beperking.

      4 Een bepaling in de statuten, welke de bevoegdheid tot wijziging van een of meer andere bepalingen uitsluit, kan
      slechts worden gewijzigd met algemene stemmen in een vergadering, waarin alle leden of afgevaardigden aanwezig of
      vertegenwoordigd zijn.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel87
  - number: '88'
    text: |-
      De vereniging kan, voor zover uit de statuten niet het tegendeel voortvloeit, ten behoeve van de leden rechten
      bedingen en, voor zover dit in de statuten uitdrukkelijk is bepaald, te hunnen laste verplichtingen aangaan.
      Zij kan nakoming van bedongen rechten jegens en schadevergoeding aan een lid vorderen, tenzij dit zich daartegen
      verzet.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel88
  - number: '89'
    text: |-
      1 Het bestuur brengt op een algemene vergadering binnen acht maanden na afloop van het boekjaar, behoudens
      verlenging van deze termijn door de algemene vergadering, een jaarverslag uit over de gang van zaken in de
      vereniging en over het gevoerde beleid. Het legt een jaarrekening, ten minste bestaande uit een balans, een staat
      van baten en lasten en een toelichting op deze stukken, ter goedkeuring aan de vergadering voor. De jaarrekening
      wordt ondertekend door de bestuurders en, zo die er zijn, de commissarissen; ontbreekt de ondertekening van een of
      meer hunner, dan wordt daarvan onder opgave van redenen melding gemaakt. Na verloop van de termijn kan ieder lid
      van de gezamenlijke bestuurders in rechte vorderen dat zij deze verplichtingen nakomen.

      2 Ontbreekt een raad van commissarissen en wordt omtrent de getrouwheid van de stukken aan de algemene vergadering
      niet overgelegd een verklaring afkomstig van een deskundige als bedoeld in [artikel 121, eerste lid][ref1], dan
      benoemt de algemene vergadering jaarlijks een commissie van ten minste twee leden die geen deel van het bestuur
      mogen uitmaken. De commissie onderzoekt de stukken bedoeld in de tweede volzin van het eerste lid en brengt aan de
      algemene vergadering verslag van haar bevindingen uit. Het bestuur is verplicht de commissie ten behoeve van haar
      onderzoek alle door haar gevraagde inlichtingen te verschaffen, haar desgewenst de kas en de waarden te tonen en de
      boeken, bescheiden en andere gegevensdragers van de vereniging voor raadpleging beschikbaar te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel121
