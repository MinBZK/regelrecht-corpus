  - number: '358'
    text: |-
      In de toelichting op het voorstel tot splitsing moet het bestuur mededelen:

      a. volgens welke methode of methoden de ruilverhouding van de aandelen is vastgesteld;

      b. of deze methode of methoden in het gegeven geval passen;

      c. tot welke waardering elke gebruikte methode leidt;

      d. indien meer dan een methode is gebruikt, of het bij de waardering aangenomen betrekkelijke gewicht van de
      methoden in het maatschappelijk verkeer als aanvaardbaar kan worden beschouwd; en

      e. elke bijzondere moeilijkheden er eventueel zijn geweest bij de waardering en bij de bepaling van de
      ruilverhouding.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel358
  - number: '359'
    text: |-
      1 Een door het bestuur aangewezen externe deskundige als bedoeld in [artikel 121][ref1] moet het voorstel tot
      splitsing onderzoeken en moet verklaren of de voorgestelde ruilverhouding van de aandelen, mede gelet op de
      bijgevoegde stukken, naar zijn oordeel redelijk is. Hij moet tevens een verslag opstellen, waarin hij zijn oordeel
      geeft over de splitsingsbalansen bedoeld in [artikel 357, eerste lid, onder d][ref2], en de mededelingen, bedoeld
      in [artikel 358][ref3].

      2 Indien twee of meer van de partijen bij de splitsing naamloze vennootschappen zijn, wordt slechts dezelfde
      persoon als deskundige aangewezen, indien de algemene vergaderingen het besluit daartoe hebben goedgekeurd.

      3 De deskundigen zijn bij alle partijen bij de splitsing gelijkelijk tot onderzoek bevoegd.

      4 Op de verklaring van de deskundige is [artikel 342][ref4] van overeenkomstige toepassing en op zijn verslag het
      [tweede en derde lid van artikel 342][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel121
