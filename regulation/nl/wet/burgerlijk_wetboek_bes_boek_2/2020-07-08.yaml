  - number: '136'
    text: |-
      1 De benoeming van bestuurders die niet in de akte van oprichting zijn aangewezen geschiedt door de algemene
      vergadering, voor zover de statuten niet anders bepalen.

      2 Tenzij de statuten anders bepalen is het orgaan of degene die de bestuurder heeft benoemd te allen tijde bevoegd
      die bestuurder te schorsen of te ontslaan. Ten aanzien van de bestuurders die in de akte van oprichting zijn
      aangewezen komen de in de eerste volzin omschreven bevoegdheden toe aan de algemene vergadering, tenzij uit de
      statuten anders voortvloeit.

      3 Tenzij de statuten anders bepalen komt de bevoegdheid de bezoldiging van een bestuurder vast te stellen toe aan
      de algemene vergadering.

      4 Een schorsing in de zin van dit artikel vervalt indien de betrokkene niet binnen twee maanden na de dag van
      schorsing is ontslagen.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel136
  - number: '137'
    text: |-
      [Artikel 136][ref1] vindt geen toepassing ten aanzien van de uitvoerend bestuurders als zodanig indien in de
      statuten toepassing is gegeven aan [artikel 18][ref2].


