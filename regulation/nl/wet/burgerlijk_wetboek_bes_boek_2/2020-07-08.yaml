  - number: '343'
    text: |-
      1 Het bestuur van elke partij bij de splitsing is verplicht de algemene vergadering en de andere partijen bij de
      splitsing in te lichten over na het voorstel tot splitsing gebleken belangrijke wijzigingen in de omstandigheden
      die de mededelingen in het voorstel tot splitsing of in de toelichting hebben beïnvloed.

      2 Voor een stichting geldt deze verplichting jegens degenen die blijkens de statuten de splitsing moeten
      goedkeuren.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel343
  - number: '344'
    text: |-
      1 Een rechtsverhouding waarbij de splitsende rechtspersoon partij is mag, op straffe van gegrondverklaring van een
      verzet als bedoeld in [artikel 345][ref1], slechts in haar geheel overgaan.

      2 Is echter een rechtsverhouding verbonden met verschillende vermogensbestanddelen die op onderscheiden
      verkrijgende rechtspersonen overgaan, dan mag zij worden gesplitst in dier voege dat zij overgaat op alle
      betrokken verkrijgende rechtspersonen naar evenredigheid van het verband dat de rechtsverhouding heeft met de
      vermogensbestanddelen die elke rechtspersoon verkrijgt.

      3 Indien een rechtsverhouding mede verbonden is met vermogensbestanddelen die de voortbestaande splitsende
      rechtspersoon behoudt, is het tweede lid te zijnen aanzien van overeenkomstige toepassing.

      4 Het eerste tot en met derde lid laten de rechten die de wederpartij bij een rechtsverhouding kan ontlenen aan
      [artikel 351][ref2] onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel345
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel351
