  - number: '253'
    text: |-
      1 Indien in de algemene vergadering door handelingen of gebeurtenissen die een houder van aandelen op naam
      redelijkerwijs niet heeft kunnen verhinderen een zodanige meerderheid is ontstaan dat een medeaandeelhouder,
      alleen of samen met een groepsmaatschappij van de medeaandeelhouder of krachtens een overeenkomst met
      andere stemgerechtigden, meer dan de helft van de bestuurders, leden van het algemeen bestuur in de zin van
      [artikel 18][ref1] of commissarissen kan benoemen of ontslaan, ook indien alle stemgerechtigden stemmen,
      kan die houder van aandelen op naam tegen de vennootschap een vordering tot uittreding als omschreven
      in [artikel 251][ref2] instellen. De vordering kan ook worden ingesteld tegen de medeaandeelhouder, de
      groepsmaatschappij of de andere in dit lid bedoelde stemgerechtigden. De vennootschap wordt in elk geval mede in
      het geding geroepen.

      2 Op de vordering als bedoeld in het eerste lid zijn het [tweede tot en met het vijfde lid van artikel 251][ref3]
      en het [tweede tot en met het zesde lid van artikel 252][ref4] van overeenkomstige toepassing.

      3 Tenzij het [vierde lid van artikel 251][ref5] overeenkomstige toepassing heeft gevonden, vervalt de bevoegdheid
      tot het instellen van de vordering zes maanden na het einde van de dag waarop de aandeelhouder kennis heeft genomen
      van het ontstaan van een meerderheid als bedoeld in het eerste lid of daarvan is verwittigd.


