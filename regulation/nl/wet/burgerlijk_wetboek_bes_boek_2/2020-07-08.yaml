  - number: '54'
    text: |-
      1 Bij ernstige twijfel of de wet of de statuten te goeder trouw worden nageleefd, dan wel het bestuur naar behoren
      wordt gevoerd, zijn het openbare ministerie en iedere belanghebbende bevoegd aan het bestuur inlichtingen te
      verzoeken.

      De inlichtingen worden desgevraagd op schrift gesteld.

      2 Bij niet of niet behoorlijke voldoening aan het verzoek, alsmede wanneer er gegronde redenen zijn om aan een
      juist beleid te twijfelen, kan de rechter, op verzoek van een belanghebbende of het openbaar ministerie, een
      onderzoeker benoemen met de opdracht een onderzoek in te stellen naar het beleid en de gang van zaken bij de
      stichting gedurende een bepaald tijdvak en daarover voor een bepaald of nader vast te stellen tijdstip schriftelijk
      aan hem te rapporteren. De rechter kan aan de onderzoeker richtlijnen verstrekken met betrekking tot de wijze
      waarop hij zijn onderzoek inricht.

      3 Het bestuur is gehouden aan het onderzoek alle vereiste medewerking te verlenen.

      De rechter is bevoegd te dier zake de hem geraden voorkomende bevelen te geven. De rechter kan bepalen dat de
      verzoeker zekerheid stelt voor de kosten van het onderzoek op de door hem vast te stellen wijze en tot een door hem
      vast te stellen maximum.

      4 Op verzoek van de onderzoeker kan de rechter getuigen en deskundigen horen.

      Ook kan hij op verzoek van de onderzoeker dan wel op verzoek van de oorspronkelijke verzoeker, de onderzoeker
      gehoord, voorzieningen treffen als bedoeld in het derde lid van [artikel 255][ref1].

      5 De voorziening kan te allen tijde op verzoek van een belanghebbende worden ingetrokken, verlengd of gewijzigd.
      Zij vervalt op het door de rechter bepaalde tijdstip en in elk geval op het tijdstip dat twee maanden zijn
      verstreken nadat het rapport overeenkomstig het zesde lid ter griffie van het gerecht is neergelegd, tenzij
      voordien een verzoek is ingediend op de voet van [artikel 55][ref2]. De voorziening vervalt dan in elk geval
      wanneer het verzoek wordt afgewezen en die beslissing onherroepelijk is geworden. Wordt het verzoek geheel of
      gedeeltelijk toegewezen dan kan de rechter desgevraagd of ambtshalve de voorziening verlengen totdat overeenkomstig
      de statuten dan wel op de voet van [artikel 56, tweede lid][ref3], in de vervulling van de ledige plaats is
      voorzien. Het [vierde en vijfde lid van artikel 255][ref4] vinden overeenkomstige toepassing.

      6 Het door de onderzoeker uitgebrachte rapport wordt ter griffie van het gerecht neergelegd en in afschrift
      verstrekt aan de stichting en de oorspronkelijke verzoeker. Uit het rapport moet blijken dat de inhoud daarvan aan
      het bestuur in concept is voorgelegd alsmede tot welke opmerkingen van het bestuur en bijstellingen van de inhoud
      deze opmerkingen aanleiding hebben gegeven.

      7 Het is aan de onderzoeker verboden hetgeen hem bij zijn onderzoek blijkt verder bekend te maken dan zijn
      onderzoek met zich brengt.

      8 De rechter begroot de kosten van het onderzoek. Hij kan desgevraagd of ambtshalve bepalen dat deze kosten geheel
      of gedeeltelijk zullen worden gedragen door de stichting, de oorspronkelijke verzoeker dan wel, indien daartoe
      gronden zijn, een of meer van de huidige of voormalige bestuurders van de stichting.

      9 Ten aanzien van de stichting particulier fonds kan een verzoek als bedoeld in het eerste en tweede lid
      uitsluitend worden gedaan door het openbaar ministerie. De tweede volzin van het vierde lid en het vijfde lid zijn
      in dit geval niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel255
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel55
      [ref3]: https://wetten.overheid.nl/BWBR0028744#Artikel56
      [ref4]: https://wetten.overheid.nl/BWBR0028744#Artikel255
