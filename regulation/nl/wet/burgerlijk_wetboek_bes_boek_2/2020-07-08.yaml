  - number: '302'
    text: |-
      1 Wanneer een naamloze of besloten vennootschap zich omzet in een vereniging, coöperatie of onderlinge
      waarborgmaatschappij, wordt iedere aandeelhouder lid, tenzij hij de schadevergoeding heeft gevraagd, bedoeld in
      het tweede lid. In de oproeping tot de vergadering waarin tot omzetting en statutenwijziging wordt besloten en de
      publicaties bedoeld in [artikel 300, vijfde lid][ref1], wordt op deze mogelijkheid gewezen.

      2 Binnen twee weken nadat het besluit tot omzetting en statutenwijziging is genomen kan iedere aandeelhouder
      die niet met het besluit heeft ingestemd, de vennootschap schriftelijk schadevergoeding vragen voor het
      verlies van zijn aandelen. Deze bevoegdheid komt niet toe aan de aandeelhouder die zich al op de voet van
      [artikel 300, zesde lid][ref2], tot de rechter heeft gewend en daarbij om schadevergoeding heeft gevraagd, tenzij
      de rechter in die procedure op dat verzoek niet heeft beslist.

      3 Bij gebreke van overeenstemming wordt de schadevergoeding bepaald door een of meer onafhankelijke deskundigen,
      ten verzoeke van de meest gerede partij te benoemen door de rechter die over de in [artikel 300, vierde lid][ref3],
      bedoelde machtiging beslist. De kosten van de deskundigen zijn voor rekening van de vennootschap.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel300
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel300
      [ref3]: https://wetten.overheid.nl/BWBR0028744#Artikel300
