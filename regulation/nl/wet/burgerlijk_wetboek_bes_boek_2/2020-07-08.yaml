  - number: '346'
    text: |-
      1 Het besluit tot splitsing wordt genomen door de algemene vergadering; in een stichting wordt het besluit genomen
      door degene die de statuten mag wijzigen of, als geen ander dat mag, door het bestuur. Het besluit mag niet
      afwijken van het voorstel tot splitsing.

      2 Een besluit tot splitsing kan eerst worden genomen na verloop van een maand na de dag waarop alle partijen bij de
      splitsing de nederlegging van het voorstel tot splitsing hebben aangekondigd.

      3 Een besluit tot splitsing wordt genomen op dezelfde wijze en met dezelfde meerderheid als een besluit tot
      wijziging van de statuten. Vereisen de statuten hiervoor goedkeuring, dan geldt dit ook voor het besluit tot
      splitsing. Vereisen de statuten voor de wijziging van afzonderlijke bepalingen verschillende meerderheden, dan is
      voor een besluit tot splitsing de grootste daarvan vereist, en sluiten de statuten wijziging van bepalingen uit,
      dan zijn de stemmen van alle stemgerechtigde leden of aandeelhouders vereist; een en ander tenzij die bepalingen na
      de splitsing onverminderd zullen gelden. De notulen van de vergaderingen waarin tot splitsing wordt besloten worden
      opgemaakt bij notariële akte.

      4 Het derde lid geldt niet voor zover de statuten een andere regeling voor besluiten tot splitsing geven.

      5 Een besluit tot splitsing van een stichting behoeft de voorafgaande goedkeuring van de rechter, tenzij
      uitsluitend stichtingen die stichting particulier fonds zijn, of uitsluitend stichtingen die dat niet zijn, bij
      de splitsing betrokken zijn en de statuten van de deze stichtingen het mogelijk maken alle bepalingen daarvan
      te wijzigen. De rechter wijst het verzoek af, indien er gegronde redenen zijn om aan te nemen dat de splitsing
      strijdig is met het belang van de stichting of dat de belangen van aangeslotenen of derden onevenredig worden
      geschaad.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel346
  - number: '347'
    text: |-
      1 De splitsing geschiedt bij notariële akte en wordt van kracht met ingang van de dag na die waarop de akte
      is verleden. De akte mag slechts worden verleden binnen zes maanden na de aankondiging van de nederlegging van
      het voorstel tot splitsing of, indien dit als gevolg van gedaan verzet niet mag, binnen een maand na het in
      [artikel 345, derde lid][ref1] bedoelde tijdstip.

      2 Aan de voet van de akte verklaart de notaris dat hem is gebleken dat de vormvoorschriften in acht zijn
      genomen voor alle besluiten die deze en de volgende afdeling en de statuten voor het tot stand komen van
      de splitsing vereisen en dat voor het overige de daarvoor in deze en de volgende afdeling en in de statuten
      gegeven voorschriften zijn nageleefd. Aan de akte wordt de in [artikel 340, tweede lid, onder d][ref2], bedoelde
      beschrijving gehecht.

      3 De [artikelen 4][ref3] en [5][ref4] vinden overeenkomstige toepassing met dien verstande dat de vereiste stukken
      worden aangeboden ten kantore van het handelsregister van elk van de partijen bij de splitsing. Bij de toepassing
      van [artikel 24][ref5] wordt telkens naast «oprichting», «oprichtingshandeling» en «oprichtingsbalans» ook gelezen:
      splitsing, splitsingshandeling en splitsingsbalans.

      4 De verkrijgende rechtspersonen, elk voor zover het goederen betreft die bij de splitsing op hen zijn overgegaan,
      doen binnen een maand na de splitsing opgave aan de beheerders van andere openbare registers waarin overgang
      van rechten of de splitsing kan worden ingeschreven. Gaat door de splitsing een registergoed op een verkrijgende
      vennootschap over, dan is de gesplitste rechtspersoon of, zo deze bij de splitsing is opgehouden te bestaan, elk
      van de verkrijgende rechtspersonen in zijn plaats verplicht binnen deze termijn aan de bewaarder van de openbare
      registers, bedoeld in [titel 1, afdeling 2 van Boek 3][ref6], de voor de inschrijving van de splitsing vereiste
      stukken aan te bieden.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel345
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel340
