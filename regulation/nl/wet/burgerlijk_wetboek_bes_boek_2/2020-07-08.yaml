  - number: '301'
    text: |-
      1 Bij omzetting van een rechtspersoon in een naamloze vennootschap of besloten vennootschap gelden, naast
      [artikel 300][ref1], de volgende leden.

      2 Door de omzetting worden van rechtswege aandeelhouder de leden of aandeelhouders in verhouding tot ieders recht.
      Wordt een stichting omgezet, dan worden krachtens in de akte van omzetting geregelde uitgifte aandeelhouder de in
      die akte genoemde personen. De akte van omzetting wordt in persoon of bij schriftelijke volmacht door die personen
      getekend.

      3 Aan de akte van omzetting wordt een omzettingsbalans gehecht. Bij omzetting in een naamloze of besloten
      vennootschap mag het getoonde eigen vermogen niet negatief zijn. Heeft de vennootschap waarin de rechtspersoon
      wordt omgezet een nominaal kapitaal dan mag het eigen vermogen niet lager zijn dan dat nominaal kapitaal.

      4 De omzettingsbalans heeft betrekking op een tijdstip dat ten hoogste een maand voor de dag van de akte ligt. Zij
      wordt getekend door alle bestuurders en commissarissen.

      5 Na de omzetting kunnen aandeelhouders, vruchtgebruikers en pandhouders de aan een aandeel verbonden rechten
      niet uitoefenen, zolang zij niet zijn ingeschreven in het in [artikel 109][ref2] of [209][ref3] bedoelde register.
      Voor zover aandeelbewijzen aan toonder zijn uitgegeven vindt geen inschrijving plaats dan tegen afgifte van die
      aandeelbewijzen aan de vennootschap, dit behoudens toepassing van het [vierde lid van artikel 105][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel300
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel109
