  - number: 51a
    text: |-
      1 Het bestuur van een stichting houdt een register bij waarin de namen en adressen van alle personen worden
      opgenomen aan wie een uitkering is gedaan die niet meer bedraagt dan 25% van het voor uitkering vatbare bedrag in
      een bepaald boekjaar, alsmede het bedrag van de uitkering en de datum waarop deze uitkering is gedaan.

      2 Het register wordt regelmatig bijgehouden.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel51a
  - number: '52'
    text: |-
      1 Wanneer een erflater iets heeft vermaakt aan een stichting die hij in een bij notariële akte gemaakte uiterste
      wilsbeschikking heeft opgericht, is de stichting erfgenaam of legataris, naar gelang het haar vermaakte aan een
      erfstelling of aan een legaat beantwoordt.

      2 Heeft hij bij een in andere vorm gemaakte uiterste wil verklaard een stichting in het leven te roepen, dan wordt
      deze beschikking aangemerkt als een aan de gezamenlijke erfgenamen opgelegde last om die stichting op te richten.

      3 Degene op wie een last om een stichting op te richten rust, kan daartoe op vordering van het openbaar ministerie
      worden veroordeeld door de rechter in eerste aanleg van het openbaar lichaam waar de erflater ten tijde van zijn
      overlijden woonde of, indien de erflater zijn laatste woonplaats niet binnen het openbaar lichaam Bonaire, Sint
      Eustatius of Saba had, door de rechter in eerste aanleg te Bonaire. De rechter kan bepalen, dat het vonnis dezelfde
      rechtskracht heeft als een in wettige vorm opgemaakte akte van hem die tot de rechtshandeling gehouden is of dat
      een door de rechter aan te wijzen vertegenwoordiger de handeling zal verrichten.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel52
  - number: '53'
    text: |-
      1 Indien ongewijzigde handhaving van de statuten zou leiden tot gevolgen, die bij de oprichting redelijkerwijze
      niet kunnen zijn gewild, en de statuten de mogelijkheid van wijziging uitsluiten of daarin niet voorzien, of zij
      die tot wijziging de bevoegdheid hebben zulks nalaten, kan de rechter op verzoek van een oprichter, van het bestuur
      of van het openbaar ministerie de statuten wijzigen.

      2 De rechter wijkt daarbij zo min mogelijk van de bestaande statuten af. Indien wijziging van het doel noodzakelijk
      is, wijst hij een doel aan dat aan het bestaande verwant is. Met inachtneming van het vorenstaande is de rechter
      bevoegd, zo nodig, de statuten op andere wijze te wijzigen dan is verzocht.

      3 Met overeenkomstige toepassing van het eerste en tweede lid kan de rechter de statuten wijzigen om ontbinding
      van de stichting op een grond als vermeld in [artikel 24][ref1] of [artikel 57, eerste lid, onder a][ref2], te
      voorkomen.

      4 In een geding, waarin ontbinding van een stichting op een grond als in het derde lid vermeld wordt verzocht kan
      de rechter de in dit artikel bedoelde bevoegdheden ook ambtshalve uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel57
