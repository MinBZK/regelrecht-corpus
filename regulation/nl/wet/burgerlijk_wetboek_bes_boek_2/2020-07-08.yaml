  - number: '139'
    text: |-
      Bepalen de statuten dat er een raad van commissarissen is, dan kunnen zij tevens bepalen dat deze
      onafhankelijk is in de zin van dit artikel. In dat geval gelden, in afwijking van [artikel 19][ref1], de
      [artikelen 140 tot en met 143][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel140
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel139
    references:
