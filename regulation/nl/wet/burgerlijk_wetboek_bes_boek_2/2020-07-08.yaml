  - number: '133'
    text: |-
      1 Voor zover de statuten niet anders bepalen worden alle besluiten genomen bij volstrekte meerderheid van de
      uitgebrachte stemmen.

      2 De statuten kunnen bepalen dat bij staken van stemmen de beslissing wordt opgedragen aan een derde.

      3 Een door de vergadering aangewezen persoon houdt notulen bij van de beraadslagingen en de genomen besluiten. De
      notulen worden ondertekend door de voorzitter van de vergadering.

      4 De ondertekende notulen worden door het bestuur gedurende tien jaren bewaard.

      5 Iedere aandeelhouder heeft recht op een afschrift van de notulen.

      6 Het eerste tot en met vierde lid van dit artikel vinden overeenkomstige toepassing bij besluiten van andere
      organen. Het vijfde lid vindt overeenkomstige toepassing wanneer een ander orgaan dan de algemene vergadering een
      besluit neemt als bedoeld in [artikel 104, eerste lid][ref1], [106, eerste lid][ref2], [107, tweede lid][ref3],
      [114, derde lid][ref4], [115, eerste lid][ref5], [117, eerste lid][ref6], [118, tweede lid][ref7], of
      [121, eerste lid][ref8].


