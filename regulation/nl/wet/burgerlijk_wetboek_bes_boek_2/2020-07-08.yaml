  - number: '304'
    text: |-
      1 Een naamloze en een besloten vennootschap kunnen zich omzetten in een buitenlandse rechtspersoon mits dit ten
      gevolge heeft dat, volgens het recht dat die buitenlandse rechtspersoon beheerst, het bestaan van de vennootschap
      als rechtspersoon in de gekozen rechtsvorm wordt voortgezet.

      2 Voor de omzetting is vereist een daartoe strekkend besluit van de vergadering van aandeelhouders, genomen
      op eenstemmig voorstel van het bestuur en met inachtneming van ten minste de vereisten voor een besluit tot
      statutenwijziging. Vereist is voorts een notariële akte waarin het besluit tot omzetting wordt geconstateerd en
      waaraan is gehecht:

      a. en geschrift, afgegeven door een persoon of instantie die naar het recht van de buitenlandse rechtspersoon de
      bevoegdheid heeft een akte van oprichting van zo'n buitenlandse rechtspersoon tot stand te brengen, welk geschrift
      de statutaire of soortgelijke regels bevat die de buitenlandse rechtspersoon na de omzetting zullen beheersen;

      b. en verklaring dat, zodra alle formaliteiten zijn vervuld, ook aan de voorwaarde van het eerste lid zal zijn
      voldaan, welke verklaring moet zijn afgegeven en getekend door de onder a. bedoelde persoon of instantie of een
      andere deskundige op het rechtsgebied van de buitenlandse rechtspersoon;

      c. en verklaring afgegeven en getekend door alle bestuurders die ten tijde van het omzettingsbesluit met de
      in [artikel 15][ref1] omschreven taken waren belast en alle stemgerechtigde aandeelhouders, die niet tegen het
      voorstel tot omzetting hebben gestemd, waarin de ondertekenaars zich hoofdelijk aansprakelijk stellen voor alle
      schulden van de vennootschap die bestaan op het tijdstip dat de omzetting onaantastbaar is; behoudens het geval van
      kwade trouw vervalt deze aansprakelijkheid drie maanden na dat tijdstip en in elk geval een jaar na de aanvang van
      het voortgezette bestaan van de vennootschap in de gekozen buitenlandse rechtsvorm.

        - De in het tweede lid bedoelde notariële akte kan een opschortende voorwaarde voor het van kracht worden van de
      omzetting bevatten.
        - [Artikel 4, eerste lid][ref2], is van overeenkomstige toepassing. Van [artikel 5][ref3] zijn van overeenkomstige
      toepassing het eerste lid, de laatste volzin van het tweede lid en het derde lid, zulks met dien verstande dat
      in het eerste lid de woorden «ingeschreven in het handelsregister» worden gelezen als «uitgeschreven uit het
      handelsregister» en dat mededeling van de omzetting door de zorg van de notaris ook wordt gedaan in een veel
      gelezen lokaal nieuwsblad. Bevat de akte van omzetting een opschortende voorwaarde als bedoeld in het derde lid van
      dit artikel dan behoeft aan het gestelde in de tweede en derde volzin van artikel 5, eerste lid, niet eerder dan zo
      spoedig mogelijk na het vervuld zijn van die voorwaarde te worden voldaan. Een opschortende voorwaarde waaraan niet
      voor of door de uitschrijving uit het handelsregister is voldaan, wordt geacht door die uitschrijving in vervulling
      te zijn gegaan.
        - De omzetting is onaantastbaar zodra de in het vierde lid bedoelde uitschrijving uit het handelsregister heeft
      plaatsgevonden. Mocht nadien blijken dat aan de voorwaarde van het eerste lid niet is voldaan dan wordt de
      omzetting geacht niet te hebben plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0028744#Artikel5
