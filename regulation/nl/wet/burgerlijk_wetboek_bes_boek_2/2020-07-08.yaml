  - number: '11'
    text: |-
      1 De rechtspersoon wordt bij rechtshandelingen met of rechtsgedingen tegen een bestuurder vertegenwoordigd door
      de raad van commissarissen. Ontbreekt een raad van commissarissen dan wordt de rechtspersoon vertegenwoordigd door
      de overige bestuurders tezamen of, zo deze ontbreken, door een voor dat geval door de algemene vergadering aan te
      wijzen persoon. Bij de stichting geschiedt de aanwijzing door de rechter op verzoek van een belanghebbende.

      2 Van het bepaalde in het eerste lid kan in de statuten of in een krachtens de statuten door de algemene
      vergadering, bij de stichting door een ander orgaan, vastgesteld reglement worden afgeweken. Daarbij kunnen
      ook bijzondere regels inzake de besluitvorming bij tegenstrijdig belang worden vastgesteld. De regeling kan
      mede betrekking hebben op tegenstrijdige belangen tussen de rechtspersoon enerzijds, een commissaris, lid of
      aandeelhouder anderzijds.

      3 De algemene vergadering is steeds bevoegd om, met gehele of gedeeltelijke terzijdestelling van het eerste lid,
      de statutaire regeling of het daarop gebaseerde reglement, voor gevallen als bedoeld in het eerste lid, dan wel
      voor andere gevallen van tegenstrijdig belang tussen de rechtspersoon en een bestuurder, commissaris, lid of
      aandeelhouder, incidenteel of voor een bepaalde periode, een of meer personen als bijzonder vertegenwoordiger van
      de rechtspersoon aan te wijzen.

      4 De bestuurder of commissaris die weet of behoort te begrijpen dat ter zake van een voorgenomen rechtshandeling
      sprake is van een tegenstrijdig belang tussen hem en de rechtspersoon, bevordert zoveel mogelijk dat de algemene
      vergadering, of de aangewezen bijzonder vertegenwoordiger, daarvan tijdig op de hoogte worden gesteld. Indien geen
      bijzonder vertegenwoordiger is aangewezen geldt het bepaalde in dit lid niet voor de bestuurder of commissaris van
      een vennootschap waarvan de aandelen op een beurs verhandeld worden, tenzij de statuten anders bepalen.

      5 Bij de besluitvorming in de algemene vergadering ingevolge het derde lid heeft degene wiens tegenstrijdig belang
      in het geding is geen stemrecht. Hetzelfde geldt voor een door de betrokkene beheerste rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel11
  - number: '12'
    text: |-
      1 De statuten moeten voorschriften bevatten omtrent de wijze waarop in het bestuur van de rechtspersoon tijdelijk
      wordt voorzien in geval van ontstentenis of belet van alle bestuurders.

      2 De statuten kunnen bepalen dat het orgaan dat een bestuurder benoemt een plaatsvervangend bestuurder kan
      aanwijzen, die bij belet of ontstentenis van de bestuurder diens taken waarneemt en diens bevoegdheden uitoefent.
      Een plaatsvervangend bestuurder heeft voor de toepassing van de wet als bestuurder te gelden voor zover het
      tegendeel niet uit de wet blijkt.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel12
  - number: '13'
    text: |-
      1 De rechtspersoon treedt niet buiten zijn statutaire doelomschrijving.

      2 Tenzij de statuten een beroep op doeloverschrijding uitsluiten is een door de rechtspersoon verrichte
      rechtshandeling vernietigbaar indien daardoor het doel werd overschreden en de wederpartij dit wist of zonder eigen
      onderzoek moest weten; slechts de rechtspersoon kan een beroep op deze grond tot vernietiging doen.

      3 De bevoegdheid om een beroep op vernietiging te doen vervalt zes maanden na de dag waarop de rechtshandeling
      is verricht.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel13
  - number: '14'
    text: |-
      1 Iedere bestuurder is tegenover de rechtspersoon gehouden tot een behoorlijke vervulling van de binnen zijn
      werkkring gelegen taak.

      2 Tot de werkkring van een bestuurder behoren alle bestuurstaken die niet bij of krachtens de statuten aan één of
      meer andere bestuurders zijn toegedeeld.

      3 Iedere bestuurder draagt niettemin verantwoordelijkheid voor de algemene gang van zaken en is gehouden zoveel
      mogelijk bij te dragen tot het afwenden van de gevolgen van een schadetoebrengend feit, ook al behoort de
      aangelegenheid niet tot zijn werkkring. De bestuurders aan wie ingevolge het tweede lid bepaalde taken zijn
      toegedeeld houden de overige bestuurders regelmatig op de hoogte van de stand van zaken op dat taakgebied.

      4 De aansprakelijkheid ter zake van het bepaalde in het eerste tot en met het derde lid van dit artikel is een
      hoofdelijke voor alle bestuurders. Niet aansprakelijk is echter de bestuurder die bewijst dat de onbehoorlijke
      taakvervulling, mede gelet op zijn werkkring en de periode gedurende welke hij in functie is geweest, niet aan hem
      te wijten is en dat hij niet nalatig is geweest in het treffen van maatregelen om de gevolgen daarvan af te wenden.

      5 Wordt in geval van faillissement van de rechtspersoon een vordering uit hoofde van dit artikel ingesteld door de
      curator dan komt aan de bestuurder een beroep op kwijting, in welke vorm dan ook door de rechtspersoon verleend,
      niet toe. De bestuurder kan in dit geval ook geen beroep doen op verrekening met een vordering op de rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel14
  - number: '15'
    text: |-
      1 Het bestuur is verplicht van de vermogenstoestand van de rechtspersoon en van alles betreffende de werkzaamheden
      van de rechtspersoon, naar de eisen die voortvloeien uit deze werkzaamheden, op zodanige wijze een administratie
      te voeren en de daartoe behorende boeken, bescheiden en andere gegevensdragers op zodanige wijze te bewaren, dat te
      allen tijde de rechten en verplichtingen van de rechtspersoon kunnen worden gekend. Iedere bestuurder heeft recht
      op inzage in de administratie en de daartoe behorende boeken, bescheiden en andere gegevensdragers.

      2 Onverminderd het elders in de wet bepaalde is het bestuur verplicht jaarlijks binnen acht maanden na afloop van
      het boekjaar een jaarrekening, ten minste bestaande uit een balans en een staat van baten en lasten, op te maken en
      op papier te stellen.

      3 Het bestuur is verplicht de in het eerste en tweede lid bedoelde boeken, bescheiden en andere gegevensdragers
      gedurende tien jaren te bewaren.

      4 De op een gegevensdrager aangebrachte gegevens, uitgezonderd de op papier gestelde balans en staat van baten
      en lasten, kunnen op een andere gegevensdrager worden overgebracht en bewaard, mits de overbrenging geschiedt met
      juiste en volledige weergave van de gegevens en deze gegevens gedurende de volledige bewaartijd beschikbaar zijn en
      binnen redelijke tijd leesbaar kunnen worden gemaakt.

      5 Het boekjaar van een rechtspersoon is het kalenderjaar, indien in de statuten geen ander boekjaar is aangewezen.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel15
  - number: '16'
    text: |-
      1 In geval van faillissement van de rechtspersoon is iedere bestuurder jegens de boedel hoofdelijk aansprakelijk
      voor het tekort, zijnde het bedrag van de schulden voor zover deze niet door vereffening van de overige baten
      kunnen worden voldaan, indien er sprake is geweest van kennelijk onbehoorlijk bestuur en aannemelijk is dat dit een
      belangrijke oorzaak is van het faillissement.

      2 Indien niet is voldaan aan de verplichtingen uit [artikel 15][ref1] of de jaarrekening niet tijdig is opgemaakt,
      wordt vermoed dat er ook voor het overige sprake is geweest van kennelijk onbehoorlijk bestuur en dat onbehoorlijk
      bestuur een belangrijke oorzaak is van het faillissement. Hetzelfde geldt indien de rechtspersoon volledig
      aansprakelijk vennoot is van een vennootschap onder firma of commanditaire vennootschap en niet voldaan is aan de
      verplichtingen uit [artikel 15a van Boek 3][ref2]. Een onbelangrijk verzuim wordt niet in aanmerking genomen.

      3 Niet aansprakelijk is de bestuurder die bewijst dat het onbehoorlijk bestuur dat een belangrijke oorzaak is
      geweest van het faillissement, mede gelet op zijn werkkring en de periode gedurende welke hij in functie is
      geweest, niet aan hem te wijten is en dat hij niet nalatig is geweest in het treffen van maatregelen om de gevolgen
      daarvan af te wenden.

      4 Het bepaalde in het tweede lid vindt geen toepassing ten aanzien van de bestuurder die bewijst dat het niet
      voldoen aan die verplichtingen, mede gelet op zijn werkkring en de periode gedurende welke hij in functie is
      geweest, niet aan hem te wijten is en dat hij niet nalatig is geweest in het treffen van maatregelen om een
      verbeterde nakoming van die verplichtingen te bevorderen.

      5 De rechter kan het bedrag waarvoor de bestuurders of bepaalde bestuurders aansprakelijk zijn verminderen indien
      hem dit bovenmatig voorkomt, gelet op de aard en de ernst van het onbehoorlijk bestuur, de andere oorzaken van het
      faillissement, alsmede de wijze waarop dit is afgewikkeld.

      6 Is de omvang van het tekort nog niet bekend, dan kan de rechter, al dan niet met toepassing van het vijfde
      lid, bepalen dat van het tekort tot betaling waarvan hij de bestuurders veroordeelt, een staat wordt opgemaakt
      overeenkomstig [Boek 2, titel 6 van het Wetboek van Burgerlijke Rechtsvordering BES][ref3].

      7 Op vordering van de curator of een aangesproken bestuurder kan de rechter bepalen dat bij de berekening van
      het tekort en de verdeling van de opbrengst uit hoofde van dit artikel via de uitdelingslijst de vordering van
      een schuldeiser geheel of gedeeltelijk buiten beschouwing blijft indien en voor zover analogische toepassing van
      [artikel 101, eerste lid, van Boek 6][ref4] daartoe aanleiding geeft. De vordering wordt ingesteld tegen de daartoe
      in het geding geroepen schuldeiser.

      8 Bij de toepassing van het eerste lid wordt slechts in aanmerking genomen het onbehoorlijk
      bestuur in de periode van drie jaren voorafgaande aan het faillissement of de in de zin van
      [artikel 238 van de Faillissementswet BES][ref5] daaraan voorafgaande surséance van betaling.
      [Artikel 14, vijfde lid][ref6], is van overeenkomstige toepassing.

      9 Met een bestuurder wordt voor de toepassing van dit artikel gelijkgesteld degene die gedurende enig tijdvak
      binnen de in het achtste lid bedoelde periode het beleid van de rechtspersoon heeft bepaald of mede heeft bepaald,
      als ware hij bestuurder, dan wel als oprichter kennelijk onzorgvuldig heeft gehandeld. De vordering kan niet worden
      ingesteld tegen een door de rechter, anders dan ingevolge de laatste volzin van [artikel 2, derde lid][ref7],
      benoemde functionaris.

      10 De bovenstaande leden van dit artikel vinden toepassing bij de naamloze en de besloten vennootschap. Voor
      het overige vinden zij slechts toepassing bij de rechtspersoon aan welke gedurende enig tijdvak binnen de in het
      achtste lid bedoelde periode een onderneming in de zin van de [Handelsregisterwet 2009 BES][ref8] toebehoorde,
      waarbij dan alleen onbehoorlijk bestuur gedurende dat tijdvak in aanmerking wordt genomen.

      11 De bovenstaande leden zijn van toepassing dan wel van overeenkomstige toepassing op de aansprakelijkheid
      van bestuurders van niet door het recht van de openbare lichamen Bonaire, Sint Eustatius en Saba beheerste
      rechtspersonen, indien deze in de openbare lichamen Bonaire, Sint Eustatius en Saba failliet worden verklaard.
      Als bestuurders zijn eveneens aansprakelijk degenen die met de leiding van de in de openbare lichamen Bonaire,
      Sint Eustatius en Saba verrichte werkzaamheden zijn belast. Bevoegd is de rechter die het faillissement heeft
      uitgesproken.

      12 Dit artikel laat onverlet de bevoegdheid van de curator tot het instellen van een vordering op grond van de
      overeenkomst met de bestuurder of op grond van [artikel 14][ref9].


