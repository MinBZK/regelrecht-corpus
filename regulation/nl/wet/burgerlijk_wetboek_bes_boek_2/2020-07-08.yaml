  - number: '257'
    text: |-
      1 De statuten kunnen bepalen dat in gevallen, nauwkeurig in de statuten omschreven, de aandeelhouder verplicht
      is zijn aandelen aan de vennootschap dan wel aan één of meer medeaandeelhouders over te dragen tegen voorwaarden,
      zoals deze bij de statuten zijn bepaald of krachtens de statuten door onafhankelijke deskundigen zullen worden
      vastgesteld.

      2 Nakoming van de in het eerste lid bedoelde verplichting kan niet worden gevorderd voordat de vennootschap of een
      medeaandeelhouder aan de aandeelhouder een schriftelijk, onvoorwaardelijk en onherroepelijk aanbod heeft gedaan
      om zijn aandelen tegen contante betaling over te nemen en dit aanbod is afgewezen of de in het vierde lid bedoelde
      termijn voor aanvaarding is verlopen.

      3 Bij aanvaarding van het aanbod wordt de koopprijs vastgesteld door een of meer door de rechter op verzoek van
      de meest gerede partij te benoemen deskundigen. Daarbij gaan de deskundigen uit van de waarde van de vennootschap
      op de dag van aanvaarding van het aanbod. Zij houden rekening met het eventueel door de aandeelhouder te lijden
      fiscaal nadeel. Over het aldus vastgestelde bedrag is wettelijke rente verschuldigd tot aan de dag van voldoening.
      De kosten van de deskundigen zijn voor rekening van degene die het aanbod heeft gedaan.

      4 Degene die het in het tweede lid bedoelde aanbod doet, moet daarbij een termijn voor schriftelijke aanvaarding
      stellen die niet korter mag zijn dan vier weken en verklaren dat hij onmiddellijk na de schriftelijke aanvaarding
      zekerheid zal stellen voor de kosten van de deskundigen en de uiteindelijk door hem te betalen bedragen.
      [Artikel 121, vierde lid][ref1], is van overeenkomstige toepassing.

      5 Wordt het onherroepelijk aanbod niet gedaan binnen zes weken nadat de aandeelhouder de vennootschap schriftelijk
      heeft doen weten dat hij bereid is zijn aandelen over te dragen, dan is de aandeelhouder van al zijn verplichtingen
      uit de statutaire bepaling bevrijd. Hetzelfde geldt indien de in het vierde lid bedoelde, aangeboden zekerheid niet
      binnen zes dagen wordt gesteld of onvoldoende is, zulks onverminderd de rechten van de aandeelhouder uit het door
      hem aanvaarde aanbod.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel121
