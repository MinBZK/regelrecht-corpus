        artikel: '121'
        afdeling: '4'
  - number: '251'
    text: |-
      1 De houder van aandelen op naam, die door gedragingen van de vennootschap dan wel van één of meer
      medeaandeelhouders zodanig in zijn rechten of belangen wordt geschaad dat het voortduren van zijn
      aandeelhouderschap in redelijkheid niet meer van hem kan worden gevergd, kan tegen de vennootschap een vordering
      tot uittreding instellen, inhoudende dat deze zijn aandelen tegen contante betaling overneemt.

      2 De eiser is niet ontvankelijk indien niet blijkt dat hij ten minste vier weken voor het aanhangig maken van de
      vordering zijn bezwaren schriftelijk kenbaar heeft gemaakt aan het bestuur van de vennootschap.

      3 Het bestuur van de vennootschap doet onmiddellijk schriftelijk mededeling van de kenbaar gemaakte bezwaren en van
      het instellen van de vordering aan de commissarissen en de medeaandeelhouders.

      4 De bevoegdheid tot het instellen van de vordering vervalt indien de vennootschap of een medeaandeelhouder voor
      het aanhangig maken daarvan aan de aandeelhouder een schriftelijk, onvoorwaardelijk en onherroepelijk aanbod doet
      om zijn aandelen tegen contante betaling over te nemen. Bij aanvaarding wordt de koopprijs vastgesteld door een of
      meer door de rechter op verzoek van de meest gerede partij te benoemen deskundigen. Daarbij gaan de deskundigen uit
      van de waarde van de vennootschap op de dag van aanvaarding van het aanbod. Zij houden rekening met het eventueel
      door de eiser te lijden fiscaal nadeel. Over het aldus vastgestelde bedrag is wettelijke rente verschuldigd tot aan
      de dag van voldoening. De kosten van de deskundigen zijn voor rekening van degene die het aanbod heeft gedaan.

      5 Degene die het in het vierde lid bedoelde aanbod doet, moet daarbij een termijn voor schriftelijke aanvaarding
      stellen die niet korter mag zijn dan vier weken en verklaren dat hij onmiddellijk na de schriftelijke aanvaarding
      zekerheid zal stellen voor de kosten van de deskundigen en de uiteindelijk door hem te betalen bedragen.
      [Artikel 121, vierde lid][ref1], is van overeenkomstige toepassing.

      6 Op verzoek van de aandeelhouder, die het aanbod heeft aanvaard, kan de rechter bepalen dat de in het vierde lid
      bedoelde bevoegdheid gedurende een daarbij te bepalen periode herleeft indien de aangeboden zekerheid niet binnen
      zes dagen wordt gesteld of onvoldoende is, zulks onverminderd de rechten van de aandeelhouder uit het door hem
      aanvaarde aanbod.

      7 Tegen beslissingen van de rechter als bedoeld in dit artikel staat geen hogere voorziening open.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel121
