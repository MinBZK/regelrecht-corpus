  - number: '26'
    text: |-
      1 De rechter voor wie een verzoek tot ontbinding van een rechtspersoonaanhangig is, kan op
      verzoek van een belanghebbende of het openbaar ministerie een voorziening treffen als bedoeld
      in het [derde lid van artikel 255][ref1] indien het belang van de rechtspersoon of een andere in
      [artikel 7, eerste lid][ref2], bedoelde persoon, dan wel het belang van de crediteuren van de rechtspersoon dit
      eist. De overige bepalingen van artikel 255 vinden overeenkomstige toepassing.

      2 Zolang een verzoek tot ontbinding van een naamloze of besloten vennootschap aanhangig is, mogen de aandeelhouders
      hun aandelen niet vervreemden, verpanden of met vruchtgebruik belasten zonder toestemming van de rechter.

      3 Het bepaalde in het tweede lid geldt niet voor aandelen die worden verhandeld op een beurs.


