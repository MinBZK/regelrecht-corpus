  - number: '312'
    text: |-
      1 De besturen van de te fuseren rechtspersonen stellen een voorstel tot fusie op.

      2 Dit voorstel vermeldt ten minste:

      a. de rechtsvorm, naam en statutaire zetel van de te fuseren rechtspersonen;

      b. de statuten van de verkrijgende rechtspersoon zoals die luiden en zoals zij na de fusie zullen luiden of, indien
      de verkrijgende rechtspersoon nieuw wordt opgericht, het ontwerp van de akte van oprichting;

      c. welke rechten of vergoedingen ingevolge [artikel 320][ref1] ten laste van de verkrijgende rechtspersoon worden
      toegekend aan degenen die anders dan als lid of aandeelhouder bijzondere rechten hebben jegens de verdwijnende
      rechtspersonen, zoals rechten op een uitkering van winst of tot het nemen van aandelen, en met ingang van welk
      tijdstip;

      d. welke voordelen in verband met de fusie worden toegekend aan een bestuur der of commissaris van een te fuseren
      rechtspersoon of aan een ander die bij de fusie is betrokken;

      e. de voornemens over de samenstelling na de fusie van het bestuur en, als er een raad van commissarissen zal zijn,
      van die raad;

      f. voor elk van de verdwijnende rechtspersonen het tijdstip met ingang waarvan financiële gegevens zullen worden
      verantwoord in de jaarrekening of andere financiële verantwoording van de verkrijgende rechtspersoon;

      g. de voorgenomen maatregelen in verband met de overgang van het lidmaatschap of aandeelhouderschap van de
      verdwijnende rechtspersonen;

      h. de voornemens omtrent voortzetting of beëindiging van werkzaamheden;

      i. wie in voorkomend geval het besluit tot fusie moeten goedkeuren.

      3 Het voorstel tot fusie wordt ondertekend door de bestuurders van elke te fuseren rechtspersoon; ontbreekt de
      handtekening van een of meer hunner, dan wordt daarvan onder opgave van reden melding gemaakt.

      4 Indien een fuserende rechtspersoon een naamloze vennootschap is waarvan de statuten een bepaling bevatten als
      bedoeld in [artikel 139][ref2], moet het voorstel tot fusie zijn goedgekeurd door de raad van commissarissen van
      die vennootschap en wordt het door de commissarissen mede ondertekend; ontbreekt de handtekening van een of meer
      hunner, dan wordt daarvan onder opgave van redenen melding gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel320
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel139
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel312
