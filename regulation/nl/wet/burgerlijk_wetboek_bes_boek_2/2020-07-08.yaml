        artikel: '22'
  - number: '119'
    text: |-
      1 Voor een vennootschap die voldoet aan elk van de in het tweede lid omschreven criteria gelden in plaats van de
      [artikelen 116][ref1] en [117][ref2] de [artikelen 120 tot en met 126][ref3].

      2 De in het eerste lid bedoelde criteria zijn:

      a. bij de vennootschap zijn in het openbaar lichaam Bonaire, Sint Eustatius of Saba of op Curaçao of Sint Maarten
      op enig tijdstip in de periode tussen één maand voor en één maand na de balansdatum ten minste twintig werknemers,
      tezamen volmakende ten minste twintig mandagen, werkzaam krachtens een arbeidsovereenkomst met de vennootschap,
      een groepsmaatschappij van de vennootschap, een uitzendbureau of een soortgelijke instelling; de waarde van de
      activa bedraagt, volgens een met inachtneming van het [derde lid van artikel 120][ref4] opgemaakte balans, meer dan
      USD 2,8 miljoen of het equivalent daarvan in andere valuta;

      b. de netto-omzet gedurende het boekjaar, berekend met inachtneming van het [derde lid van artikel 120][ref5]
      opgemaakte jaarrekening, meer dan USD 5,6 miljoen of het equivalent daarvan in andere valuta.

      3 Een vennootschap die niet voldoet aan elk van de in het tweede lid omschreven criteria kan in haar statuten de
      [artikelen 120 tot en met 122][ref6] van toepassing verklaren, al dan niet tezamen met de [artikelen 123][ref7]
      en [124][ref8]. In dat geval zijn ook de [artikelen 125][ref9] en [126][ref10] van toepassing en gelden de
      [artikelen 116][ref11] en [117][ref12] niet.

      4 De in het tweede lid genoemde bedragen kunnen worden bijgesteld bij algemene maatregel van bestuur telkens
      wanneer de prijsontwikkeling daartoe aanleiding geeft.


