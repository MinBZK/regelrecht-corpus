  - number: '335'
    text: |-
      1 Splitsing is zuivere splitsing en afsplitsing.

      2 Zuivere splitsing is de rechtshandeling waarbij het vermogen van een rechtspersoon die bij de splitsing ophoudt
      te bestaan onder algemene titel overeenkomstig de aan de akte van splitsing gehechte beschrijving wordt verkregen
      door twee of meer andere rechtspersonen.

      3 Afsplitsing is de rechtshandeling waarbij het vermogen of een deel daarvan van een rechtspersoon die bij de
      splitsing niet ophoudt te bestaan onder algemene titel overeenkomstig de aan de akte van splitsing gehechte
      beschrijving wordt verkregen door een of meer andere rechtspersonen waarvan ten minste één overeenkomstig het
      bepaalde in deze afdeling of [afdeling 5][ref1] lidmaatschapsrechten of aandelen toekent aan de leden of aan
      aandeelhouders van de splitsende rechtspersoon of waarvan ten minste één bij de splitsing door de splitsende
      rechtspersoon wordt opgericht.

      4 Partij bij de splitsing is de splitsende rechtspersoon, alsmede elke verkrijgende rechtspersoon, met uitzondering
      van rechtspersonen die bij de splitsing worden opgericht.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Afdeling5
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel335
    references:
      - id: ref1
        bwb_id: BWBR0028744
        afdeling: '5'
  - number: '336'
    text: |-
      1 De partijen bij een splitsing moeten dezelfde rechtsvorm hebben.

      2 Wordt een verkrijgende rechtspersoon bij de splitsing opgericht, dan moet hij de rechtsvorm hebben van de
      splitsende rechtspersoon.

      3 Voor de toepassing van dit artikel worden naamloze en besloten vennootschap als rechtspersonen met dezelfde
      rechtsvorm aangemerkt.

      4 Bij splitsing van een vereniging, coöperatie, onderlinge waarborgmaatschappij of stichting kunnen ook naamloze of
      besloten vennootschappen worden opgericht, mits de splitsende rechtspersoon daarvan bij de splitsing alle aandelen
      verkrijgt.

      5 Een ontbonden rechtspersoon mag niet partij zijn bij een splitsing, indien reeds uit hoofde van de vereffening
      een uitkering is gedaan.

      6 Een rechtspersoon mag niet partij zijn bij een splitsing gedurende faillissement of surséance van betaling.

      7 Een splitsende rechtspersoon mag in faillissement of surséance van betaling zijn, mits alle verkrijgende
      rechtspersonen bij de splitsing opgerichte naamloze of besloten vennootschappen zijn en de splitsende
      rechtspersoon daarvan bij de splitsing enig aandeelhouder wordt. Indien de splitsende rechtspersoon in
      faillissement is, kan de curator tot splitsing besluiten en rusten de verplichtingen die ingevolge deze en
      de volgende afdeling op het bestuur rusten, op de curator; indien de rechtspersoon in surséance van betaling
      is, behoeft het besluit tot splitsing de goedkeuring van de bewindvoerder. [Artikel 338, tweede lid][ref1],
      [artikel 340, tweede lid, onderdeel e][ref2], voor zover het betreft de waarde van het deel van het vermogen dat
      de splitsende rechtspersoon zal behouden, [artikel 341, tweede lid][ref3], [artikel 343, eerste lid][ref4], en
      [artikel 361, derde lid][ref5], gelden niet in faillissement; artikel 338, tweede lid, geldt niet in surséance.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel338
