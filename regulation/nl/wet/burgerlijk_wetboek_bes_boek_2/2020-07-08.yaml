  - number: '20'
    text: |-
      1 Een stem is nietig in de gevallen waarin een eenzijdige rechtshandeling nietig is; een stem kan niet worden
      vernietigd.

      2 Een onbekwame die lid is van een vereniging, kan zijn stemrecht daarin zelf uitoefenen, voor zover de statuten
      zich daartegen niet verzetten; in andere gevallen komt de uitoefening van het stemrecht toe aan zijn wettelijke
      vertegenwoordiger.

      3 Tenzij de statuten anders bepalen, is het in de vergadering van een orgaan van een rechtspersoon uitgesproken
      oordeel van de voorzitter omtrent de uitslag van een stemming beslissend. Hetzelfde geldt voor de inhoud van een
      genomen besluit, voor zover werd gestemd over een niet schriftelijk vastgelegd voorstel.

      4 Wordt onmiddellijk na het uitspreken van het oordeel van de voorzitter de juistheid daarvan betwist, dan vindt
      een nieuwe stemming plaats, indien de meerderheid der vergadering of, indien de oorspronkelijke stemming niet
      hoofdelijk of schriftelijk geschiedde, een stemgerechtigde aanwezige dit verlangt. Door deze nieuwe stemming
      vervallen de rechtsgevolgen van de oorspronkelijke stemming.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel20
  - number: '21'
    text: |-
      1 Een besluit van een orgaan van de rechtspersoon dat in strijd is met de wet of de statuten is nietig, tenzij iets
      anders uit de wet voortvloeit.

      2 Nietig is ook een besluit indien een door dit boek of de statuten voorgeschreven quorum, meerderheid, voorstel,
      voordracht of machtiging ontbreekt. Nietig is voorts een besluit zolang een door dit boek of de statuten
      voorgeschreven goedkeuring van een ander orgaan ontbreekt.

      3 Een besluit van een orgaan van de rechtspersoon is vernietigbaar op vordering van iemand die een redelijk belang
      heeft bij naleving van het voorschrift dat niet is nageleefd wegens:

      a. onverminderd het bepaalde in het tweede lid van dit artikel, strijd met bepalingen van de wet of de statuten,
      die de tot standkoming van besluiten regelen;

      b. strijd met de redelijkheid en billijkheid die door [artikel 7][ref1] wordt geëist;

      c. strijd met een krachtens de statuten vastgesteld reglement;

      d. strijd met een aandeelhoudersovereenkomst als bedoeld in het [tweede lid van de artikelen 127][ref2] en
      [227][ref3], waarbij alle aandeelhouders en ook de vennootschap partij zijn.

      4 De bevoegdheid om vernietiging van een besluit te vorderen vervalt zes maanden na het einde van de dag, waarop
      hetzij aan het besluit voldoende bekendheid is gegeven, hetzij de belanghebbende van het besluit kennis heeft
      genomen of daarvan is verwittigd.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel7
