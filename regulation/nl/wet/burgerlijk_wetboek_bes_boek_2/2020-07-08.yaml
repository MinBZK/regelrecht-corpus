  - number: '3'
    text: |-
      1 Een rechtspersoon staat wat het vermogensrecht betreft, met een natuurlijk persoon gelijk, voor zover uit de wet
      niet het tegendeel voortvloeit.

      2 Leden, aandeelhouders en anderen die krachtens de wet of de statuten bij de organisatie van de rechtspersoon zijn
      betrokken zijn niet persoonlijk aansprakelijk voor de schulden van de rechtspersoon, voor zover uit de wet niet het
      tegendeel voortvloeit.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel3
  - number: '4'
    text: |-
      1 Is een notariële akte van oprichting vereist dan wordt deze verleden in de taal die de oprichters kiezen, mits
      de notaris deze taal verstaat. Is de taal een andere dan het Papiaments of de Nederlandse, Engelse of Spaanse taal,
      dan wordt een door een beëdigd vertaler ondertekende Nederlandse vertaling aan de akte gehecht.

      2 De akte bevat in elk geval:

      a. de statuten van de rechtspersoon;

      b. tenzij het gaat om een stichting die bij uiterste wilsbeschikking wordt opgericht, de namen en woonplaatsen van
      de eerste bestuurders en van de overige functionarissen die er volgens de wet of de statuten moeten zijn.

      3 Waar in dit boek wordt gesproken van een notariële akte wordt daaronder verstaan een akte verleden door of ten
      overstaan van een notaris die in het openbaar lichaam Bonaire, Sint Eustatius of Saba het notarisambt uitoefent.
      Een volmacht tot medewerking aan de akte moet schriftelijk zijn verleend.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel4
  - number: '5'
    text: |-
      1 De notaris, ten overstaan van wie de akte van oprichting wordt verleden, draagt zorg dat deze voldoet aan het in
      dit boek bepaalde en dat de vereiste stukken daaraan zijn gehecht. Hij draagt vervolgens zorg dat de rechtspersoon
      zo spoedig mogelijk wordt ingeschreven in het handelsregister en dat tegelijkertijd een authentiek afschrift van
      de akte met de ingevolge dit boek daaraan gehechte stukken ten kantore van het handelsregister wordt gedeponeerd.
      Tevens draagt hij zorg dat zo spoedig mogelijk in de Staatscourant, mededeling gedaan wordt van de oprichting van
      de rechtspersoon.

      2 Is de akte van oprichting notarieel verleden dan is voor een wijziging van de statuten steeds ook een notariële
      akte vereist. Het eerste lid van dit artikel is van overeenkomstige toepassing. Naast het afschrift van de
      authentieke akte van statutenwijziging wordt steeds een afschrift van de gewijzigde statuten gedeponeerd. Iedere
      bestuurder is bevoegd de akte te doen verlijden, onverminderd de bevoegdheid van de algemene vergadering een ander
      daartoe te machtigen.

      3 Bij verzuim in de naleving van de uit het eerste en tweede lid voortvloeiende verplichtingen is de notaris
      persoonlijk aansprakelijk jegens hen die daardoor schade hebben geleden.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel5
  - number: '6'
    text: |-
      1 Uit rechtshandelingen, verricht namens een op te richten rechtspersoon, ontstaan slechts rechten en
      verplichtingen voor de rechtspersoon, wanneer hij die rechtshandelingen bij of na zijn oprichting uitdrukkelijk of
      stilzwijgend bekrachtigt.

      2 Degenen die een rechtshandeling verrichten namens een op te richten rechtspersoon zijn daardoor hoofdelijk
      verbonden. Deze verbondenheid vervalt een jaar na de bekrachtiging, tenzij schriftelijk anders is bedongen.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel6
  - number: '7'
    text: |-
      1 De rechtspersoon en degenen die krachtens de wet of de statuten bij zijn organisatie zijn betrokken, moeten zich
      als zodanig jegens elkander gedragen naar hetgeen door redelijkheid en billijkheid wordt gevorderd.

      2 Een tussen hen krachtens wet, gewoonte, statuten, reglementen, besluit of overeenkomst geldende regel of
      beslissing is niet van toepassing voor zover dit in de gegeven omstandigheden naar maatstaven van redelijkheid en
      billijkheid onaanvaardbaar zou zijn.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel7
  - number: '8'
    text: |-
      1 Met uitzondering van de in [artikel 239][ref1] bedoelde aandeelhouderbestuurde vennootschap heeft iedere
      rechtspersoon een bestuur.

      2 Behoudens wettelijke of statutaire beperkingen, daaronder begrepen beperkingen krachtens de statuten of door een
      krachtens de wet of de statuten vastgesteld reglement, is het bestuur belast met het besturen van de rechtspersoon.
      Individuele bestuurders oefenen hun bevoegdheden uit met inachtneming van de besluiten van het bestuur.

      3 Bij de vervulling van zijn taak richt het bestuur zich naar het belang van de rechtspersoon en, voor zover
      daarvan sprake is, de met deze verbonden onderneming.

      4 Tenzij de statuten anders bepalen is het bestuur van een rechtspersoon die niet een stichting is, zonder opdracht
      van de algemene vergadering niet bevoegd aangifte te doen tot faillietverklaring van de rechtspersoon.

      5 De rechtsverhouding tussen een bestuurder en de rechtspersoon wordt niet aangemerkt of mede aangemerkt als een
      arbeidsovereenkomst.

      6 In geval van faillissement van de rechtspersoon zijn loon en andere vergoedingen die de bestuurder toekomen
      in verband met de uitoefening van zijn functie, vanaf de dag van de faillietverklaring niet voor rekening van de
      boedel, voor zover de rechter-commissaris in het faillissement niet anders beslist.

      7 Het bepaalde in het zesde lid is van overeenkomstige toepassing op vergoedingen die toekomen aan leden van andere
      organen van de rechtspersoon.


