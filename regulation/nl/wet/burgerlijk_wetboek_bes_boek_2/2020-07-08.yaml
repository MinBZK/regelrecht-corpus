  - number: '324'
    text: Deze afdeling is van toepassing, indien een naamloze of besloten vennootschap fuseert.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel324
  - number: '325'
    text: |-
      1 Indien aandelen of certificaten van aandelen van een te fuseren vennootschap zijn opgenomen in de prijscourant
      van een beurs, kan de ruilverhouding afhankelijk zijn van de prijs van die aandelen onderscheidenlijk certificaten
      op die beurs op een of meer in het voorstel tot fusie te bepalen tijdstippen, gelegen voor de dag waarop de fusie
      van kracht wordt.

      2 Indien krachtens de ruilverhouding van de aandelen recht bestaat op geld of schuldvorderingen, mag het
      gezamenlijke bedrag daarvan een tiende van het door de toegekende aandelen vertegenwoordigde eigen vermogen niet te
      boven gaan.

      3 Bij de akte van fusie kan de verkrijgende vennootschap aandelen in de verkrijgende vennootschap die zij zelf
      of een andere fuserende vennootschap houdt, intrekken tot ten hoogste de vermogenswaarde die de aandelen die zij
      toekent aan haar nieuwe aandeelhouders vertegenwoordigen.

      4 Aandelen van de verdwijnende vennootschappen die worden gehouden door of voor rekening van de fuserende
      vennootschappen, vervallen.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel325
  - number: '326'
    text: |-
      1 Het voorstel tot fusie bevat naast de in [artikel 312][ref1] genoemde gegevens:

      a. de ruilverhouding van de aandelen en eventueel de omvang van de betalingen krachtens de ruilverhouding;

      b. met ingang van welk tijdstip en in welke mate de aandeelhouders van de verdwijnende vennootschappen zullen delen
      in de winst van de verkrijgende vennootschap;

      c. hoeveel aandelen eventueel zullen worden ingetrokken met toepassing van [artikel 325, derde lid][ref2];

      d. een fusiebalans van de verkrijgende vennootschap.

      2 De fusiebalans van de verkrijgende vennootschap toont een eigen vermogen dat niet negatief is of, indien
      de verkrijgende vennootschap een nominaal kapitaal heeft, niet lager is dan dat nominaal kapitaal. Zij heeft
      betrekking op het vermoedelijke tijdstip van de fusie. Gegevens daarvoor mogen worden ontleend aan de in
      [artikel 313, tweede lid][ref3], bedoelde jaarrekeningen of vermogensopstellingen. Afwijkingen daarvan worden
      toegelicht.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel312
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel325
      [ref3]: https://wetten.overheid.nl/BWBR0028744#Artikel313
