      1 Indien door een jaarrekening of door tussentijdse cijfers, die de vennootschap overeenkomstig [artikel 122][ref1]
      of anderszins openbaar heeft gemaakt, een misleidende voorstelling wordt gegeven van de toestand der vennootschap,
      zijn de bestuurders en commissarissen tegenover derden hoofdelijk aansprakelijk voor de schade, door dezen
      dientengevolge geleden. De bestuurder of commissaris die bewijst dat zulks niet aan een tekortkoming zijnerzijds is
      te wijten, is niet aansprakelijk.

      2 Het eerste lid is van overeenkomstige toepassing indien door het niet tijdig opmaken of openbaar maken van de
      jaarrekening schade is geleden.

      3 Met een bestuurder wordt voor de toepassing van dit artikel gelijkgesteld degene die de inhoud van de
      jaarrekening geheel of gedeeltelijk heeft bepaald of mede heeft bepaald, als ware hij bestuurder.


