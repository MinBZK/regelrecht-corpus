  - number: '254'
    text: |-
      1 De in [artikel 251][ref1] bedoelde vordering tot uittreding komt ook toe aan:

      a. de aandeelhouder die als zodanig niet of niet langer voldoet aan in de statuten gestelde kwaliteitseisen en
      dientengevolge een of meer van de aan zijn aandeel verbonden rechten niet kan uitoefenen.

      b. de aandeelhouder die aan de vennootschap en zijn medeaandeelhouders op naam schriftelijk heeft medegedeeld dat
      hij zijn aandelen wil vervreemden tegen daarbij genoemde voorwaarden en dat voornemen niet ten uitvoer kan leggen
      door de werking van een statutaire blokkeringsregeling in de zin van [artikel 111][ref2] of [211][ref3] die de
      overdracht uitsluit of uiterst bezwaarlijk maakt.

      2 In de gevallen bedoeld in het eerste lid vindt het [zevende lid van artikel 252][ref4] geen toepassing.

      3 Tenzij het [vierde lid van artikel 251][ref5] overeenkomstige toepassing heeft gevonden, vervalt de bevoegdheid
      tot het instellen van de vordering zes maanden na het einde van de dag waarop de aandeelhouder is komen te verkeren
      in een situatie als bedoeld in het eerste lid onder a of de in het eerste lid onder b bedoelde schriftelijke
      mededeling door de vennootschap is ontvangen.


