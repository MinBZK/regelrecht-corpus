  - number: '352'
    text: |-
      1 Het tweede tot en met vierde lid zijn van toepassing indien van een vermogensbestanddeel aan de hand van de aan
      de akte van splitsing gehechte beschrijving niet kan worden bepaald welke rechtspersoon daarop na de splitsing
      rechthebbende is.

      2 Indien het gehele vermogen van de gesplitste rechtspersoon is overgegaan, zijn de verkrijgende rechtspersonen
      gezamenlijk rechthebbende. Elke verkrijgende rechtspersoon deelt in het vermogensbestanddeel naar evenredigheid van
      de waarde van het deel van het vermogen van de gesplitste rechtspersoon dat hij verkrijgt.

      3 Indien niet het gehele vermogen is overgegaan, is de gesplitste rechtspersoon rechthebbende.

      4 Voor zover verkrijgende rechtspersonen uit hoofde van het tweede lid aansprakelijk zijn voor schulden, zijn zij
      hoofdelijk verbonden.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel352
  - number: '353'
    text: |-
      1 De verkrijgende rechtspersonen en de voortbestaande gesplitste rechtspersoon zijn aansprakelijk tot nakoming van
      de verbintenissen van de gesplitste rechtspersoon ten tijde van de splitsing.

      2 Voor ondeelbare verbintenissen zijn de verkrijgende rechtspersonen en de voortbestaande gesplitste rechtspersoon
      elk voor het geheel aansprakelijk.

      3 Voor deelbare verbintenissen is de verkrijgende rechtspersoon waarop de verbintenis is overgegaan of, zo de
      verbintenis niet op een verkrijgende rechtspersoon is overgegaan, de voortbestaande gesplitste rechtspersoon voor
      het geheel aansprakelijk. De aansprakelijkheid voor deelbare verbintenissen is voor elke andere rechtspersoon
      beperkt tot de waarde van het vermogen dat hij bij de splitsing heeft verkregen of behouden.

      4 Andere rechtspersonen dan de rechtspersoon waarop de verbintenis is overgegaan of, zo de verbintenis niet op een
      verkrijgende rechtspersoon is overgegaan, dan de voortbestaande gesplitste rechtspersoon zijn niet tot nakoming
      gehouden voordat de laatstbedoelde rechtspersoon in de nakoming van de verbintenis is tekortgeschoten.

      5 Ten aanzien van de aansprakelijkheid zijn de bepalingen betreffende hoofdelijke verbondenheid van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel353
  - number: '354'
    text: |-
      1 De rechter kan een splitsing alleen vernietigen:

      a. indien de door een notaris ondertekende akte van splitsing geen authentiek geschrift is;

      b. wegens het niet naleven van [artikel 336, vijfde of zesde lid][ref1], [artikel 345, derde lid][ref2], of de
      [eerste volzin van artikel 347, tweede lid][ref3];

      c. wegens nietigheid, het niet van kracht zijn of een grond tot vernietiging van een voor de splitsing vereist
      besluit van de algemene vergadering of, in een stichting, van het bestuur;

      d. wegens het niet naleven van [artikel 346, vijfde lid][ref4].

      2 Vernietiging geschiedt door een uitspraak van de rechter van de statutaire zetel van de gesplitste rechtspersoon
      op vordering tegen alle verkrijgende rechtspersonen en de voortbestaande gesplitste rechtspersoon van een lid,
      aandeelhouder, bestuurder of andere belanghebbende. Een niet door de rechter vernietigde splitsing is geldig.

      3 De bevoegdheid tot het instellen van de vordering tot vernietiging vervalt door herstel van het verzuim
      of door verloop van zes maanden na de nederlegging van de akte van splitsing ten kantore van de in
      [artikel 347, derde lid][ref5], bedoelde registers.

      4 De splitsing wordt niet vernietigd:

      a. indien het verzuim binnen een door de rechter te bepalen termijn is hersteld;

      b. indien de reeds ingetreden gevolgen van de splitsing bezwaarlijk ongedaan kunnen worden gemaakt.

      5 Heeft de eiser tot vernietiging van de splitsing schade geleden door een verzuim dat tot vernietiging had
      kunnen leiden, en vernietigt de rechter de splitsing niet, dan kan de rechter de verkrijgende rechtspersonen en de
      voortbestaande gesplitste rechtspersoon veroordelen tot vergoeding van de schade. De rechtspersonen hebben daarvoor
      verhaal op de schuldigen aan het verzuim en, tot ten hoogste het genoten voordeel, op degenen die door het verzuim
      zijn bevoordeeld.

      6 De vernietiging wordt, door de zorg van de griffier van het gerecht waar de vordering laatstelijk aanhangig was,
      ingeschreven in de registers waarin de splitsing ingevolge [artikel 347, derde lid][ref6], moet zijn ingeschreven.

      7 De gesplitste rechtspersoon is naast de betrokken verkrijgende rechtspersoon hoofdelijk verbonden tot nakoming
      van verbintenissen die ten laste van de verkrijgende rechtspersonen zijn ontstaan na de splitsing en voordat de
      vernietiging in de registers is ingeschreven.

      8 De onherroepelijke uitspraak tot vernietiging van een splitsing is voor een ieder bindend. Verzet van derden en
      herroeping zijn niet toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel336
