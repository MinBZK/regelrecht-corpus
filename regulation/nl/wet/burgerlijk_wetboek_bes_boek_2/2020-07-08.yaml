      1 De statuten kunnen bepalen dat zij die bij de ontbinding leden waren, of minder dan een jaar te voren hebben
      opgehouden leden te zijn, tegenover de rechtspersoon naar de daarbij aangegeven maatstaf voor een tekort
      aansprakelijk zijn; wordt een coöperatie of onderlinge waarborgmaatschappij ontbonden door haar insolventie nadat
      zij in staat van faillissement is verklaard, dan wordt de termijn van een jaar niet van de dag der ontbinding, maar
      van de dag der faillietverklaring gerekend. De statuten kunnen een langere termijn dan een jaar vaststellen.

      2 Bevatten de statuten niet een maatstaf voor ieders aansprakelijkheid, dan zijn allen voor gelijke delen
      aansprakelijk.

      3 Kan op een of meer van de leden of oud-leden het bedrag van zijn aandeel in het tekort niet worden verhaald, dan
      zijn voor het ontbrekende de overige leden en oud-leden, ieder naar evenredigheid van zijn aandeel, aansprakelijk.
      Deze aansprakelijkheid bestaat ook, indien de vereffenaars afzien van verhaal op een of meer leden of oud-leden,
      op grond dat door de uitoefening van het verhaalsrecht een bate voor de boedel niet zou worden verkregen. Indien de
      vereffening geschiedt onder toezicht van personen, door de wet met dat toezicht belast, kunnen de vereffenaars van
      dat verhaal slechts afzien met machtiging van deze personen.

      4 De aansprakelijke leden en oud-leden zijn gehouden tot onmiddellijke betaling van hun aandeel in een geraamd
      tekort, vermeerderd met 50 ten honderd, of zoveel minder als de vereffenaars voldoende achten, tot voorlopige
      dekking van een nadere omslag voor de kosten van invordering en van het aandeel van hen, die in gebreke mochten
      blijven aan hun verplichting te voldoen.

      5 Een lid of oud-lid is niet bevoegd tot verrekening van zijn schuld uit hoofde van dit artikel.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel92
  - number: '93'
    text: |-
      1 Indien de statuten een regeling bevatten als bedoeld in [artikel 92][ref1] kunnen zij de verplichting van de
      leden of oud-leden om in een tekort bij te dragen, tot een maximum beperken.

      2 Bevatten de statuten geen regeling als bedoeld in [artikel 92][ref2] dan zijn de leden of oud-leden niet gehouden
      om in een tekort bij te dragen.


