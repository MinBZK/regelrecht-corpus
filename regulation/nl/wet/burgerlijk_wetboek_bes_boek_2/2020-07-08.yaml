      1 De op een vennootschap rustende verplichtingen als vermeld in [artikel 121][ref1] gelden niet indien aan de
      voorwaarden van [artikel 123][ref2] is voldaan en bovendien alle aandeelhouders tijdens het boekjaar of binnen zes
      maanden na afloop daarvan schriftelijk hebben verklaard daarmee in te stemmen.

      2 In het geval bedoeld in het eerste lid hoeft ook geen jaarverslag te worden opgemaakt; voorts hoeft ook
      [artikel 120, derde lid][ref3], niet te worden toegepast mits de jaarrekening bestaat uit ten minste een balans,
      een winst- en verliesrekening en een toelichting op deze stukken en zij een zodanig inzicht geeft dat een
      verantwoord oordeel kan worden gevormd omtrent het vermogen en het resultaat, alsmede, voor zover de aard van een
      jaarrekening dat toelaat, omtrent de solvabiliteit en de liquiditeit van de vennootschap.


