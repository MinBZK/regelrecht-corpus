  - number: '55'
    text: |-
      1 Op verzoek van het openbaar ministerie of een belanghebbende kan een bestuurder door de rechter worden ontslagen
      indien:

      a. hij iets doet of nalaat in strijd met de bepalingen van de wet of de statuten;

      b. naar het oordeel van de rechter uit het in [artikel 54, zesde lid][ref1], bedoelde rapport blijkt dat de
      bestuurder zich schuldig heeft gemaakt aan kennelijk onbehoorlijk bestuur of dat zijn optreden als zodanig aan een
      behoorlijk functioneren van het bestuur in de weg staat.

      2 De rechter kan bepalen dat een door hem ontslagen bestuurder gedurende vijf jaar nadat het ontslag onherroepelijk
      is geworden geen bestuurder van een stichting kan zijn.

      3 Ten aanzien van de stichting particulier fonds kan een verzoek als bedoeld in het eerste lid uitsluitend worden
      gedaan door het openbaar ministerie.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel54
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '54'
  - number: '56'
    text: |-
      1 Telkens wanneer het door de statuten voorgeschreven bestuur geheel of gedeeltelijk ontbreekt en daarin niet
      overeenkomstig de statuten wordt voorzien, kan de rechter op verzoek van een belanghebbende of het openbaar
      ministerie in de vervulling van de ledige plaats voorzien. De rechter neemt daarbij zoveel mogelijk de statuten
      in acht.

      2 De rechter kan desverzocht of ambtshalve in de ledige plaats voorzien tegelijk met de toewijzing van een verzoek
      als bedoeld in [artikel 55][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel55
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '55'
  - number: '57'
    text: |-
      1 De rechter ontbindt de stichting op verzoek van een belanghebbende of het openbaar ministerie, indien:

      a. het vermogen van de stichting ten enenmale onvoldoende is voor de verwezenlijking van haar doel en in hoge mate
      onwaarschijnlijk is dat een voldoende vermogen door bijdragen of op andere wijze binnen afzienbare tijd zal worden
      verkregen;

      b. het doel der stichting is bereikt of niet meer kan worden bereikt en wijziging van het doel niet in aanmerking
      komt.

      2 De rechter kan desverzocht of ambtshalve de stichting ontbinden tegelijk met de afwijzing van een verzoek als
      bedoeld in [artikel 53][ref1] of [56][ref2].

      3 Het [vierde tot en met het achtste lid van artikel 24][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel56
      [ref3]: https://wetten.overheid.nl/BWBR0028744#Artikel24
