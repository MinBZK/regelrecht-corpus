  - number: '314'
    text: |-
      1 Elke te fuseren rechtspersoon legt ten kantore van het handelsregister neer:

      a. het voorstel tot fusie;

      b. de laatste drie goedgekeurde jaarrekeningen of andere financiële verantwoordingen van de te fuseren
      rechtspersonen, met de deskundigen verklaring daarbij, voor zover deze stukken ter inzage liggen of moeten liggen;

      c. de jaarverslagen van de te fuseren rechtspersonen over de laatste drie afgesloten jaren, voor zover deze ter
      inzage liggen of moeten liggen;

      d. tussentijdse vermogensopstellingen of niet goedgekeurde jaarrekeningen, voor zover vereist ingevolge
      [artikel 313, tweede lid][ref1], en voor zover de jaar rekening van de rechtspersoon ter inzage moet liggen.

      2 Tegelijkertijd legt het bestuur de stukken, met inbegrip van jaarrekeningen en jaarverslagen die niet ter
      openbare inzage behoeven te liggen, samen met de toelichtingen van de besturen op het voorstel neer ten kantore
      van de rechtspersoon of, bij gebreke van een kantoor, aan de woonplaats van een bestuurder. De stukken liggen tot
      het tijdstip van de fusie, en op het adres van de verkrijgende rechtspersoon onderscheidenlijk van een bestuurder
      daarvan nog zes maanden nadien, ter inzage voor de leden of aandeelhouders, en voor hen die een bijzonder recht
      jegens de rechtspersoon hebben, zoals een recht op een uitkering van winst, tot het nemen van aandelen of tot het
      bijwonen van vergaderingen. In dit tijdvak kunnen zij kosteloos een afschrift daarvan krijgen.

      3 De te fuseren rechtspersonen kondigen in de Staatscourant en in een in het openbaar lichaam Bonaire, Sint
      Eustatius of Saba verschijnend nieuwsblad aan dat de stukken zijn neergelegd, met opgave van de openbare registers
      waar zij liggen en van het adres waar zij krachtens het tweede lid ter inzage liggen. Indien het besluit tot fusie
      moet worden goedgekeurd op de voet van [artikel 317, vijfde lid][ref2], wordt mededeling gedaan van de plaats en
      het tijdstip van de behandeling van het goedkeuringsverzoek.

      4 Indien de besturen van de te fuseren rechtspersonen het voorstel tot fusie wijzigen, zijn het eerste tot en met
      het derde lid van overeenkomstige toepassing.

      5 Het tweede lid geldt niet voor stichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel313
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel317
