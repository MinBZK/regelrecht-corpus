  - number: '22'
    text: |-
      1 De onherroepelijke uitspraak die de nietigheid van een besluit van een rechtspersoon vaststelt of die zulk een
      besluit vernietigt, is voor een ieder, behoudens herroeping of verzet door derden, bindend, indien de rechtspersoon
      partij in het geding is geweest. Herroeping komt ieder lid of aandeelhouder toe.

      2 Is het besluit een rechtshandeling van de rechtspersoon, die tot een wederpartij is gericht, of is het een
      vereiste voor de geldigheid van zulk een rechtshandeling, dan kan de nietigheid of vernietiging van het besluit
      niet aan die wederpartij worden tegengeworpen, indien deze het gebrek dat aan het besluit kleefde, kende noch
      behoefde te kennen. Niettemin kan de nietigheid of vernietiging van een besluit tot uitgifte van aandelen aan de
      beoogd aandeelhouder en een besluit tot benoeming van een bestuurder of een commissaris aan de benoemde worden
      tegengeworpen; de rechtspersoon vergoedt echter de schade van de wederpartij, indien deze het gebrek in het besluit
      kende noch behoefde te kennen.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel22
