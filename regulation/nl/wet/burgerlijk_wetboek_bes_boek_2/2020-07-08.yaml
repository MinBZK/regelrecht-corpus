  - number: '105'
    text: |-
      1 Uiterlijk op 31 december 2019 stelt de vennootschap door een statutenwijziging aandelen aan toonder op naam. De
      verplichting wordt bekendgemaakt overeenkomstig [artikel 130, eerste lid][ref1]. Is de verplichting bekendgemaakt
      dan is [artikel 301, vijfde lid][ref2], van overeenkomstige toepassing.

      2 Aandelen aan toonder die op 1 januari 2020 niet op naam zijn gesteld door de vennootschap luiden vanaf die datum
      van rechtswege op naam.

      3 Een aandeelbewijs dat na omzetting in een aandeel op naam niet uiterlijk op 31 december 2020 is ingeleverd bij
      de vennootschap wordt om niet verkregen door de vennootschap, ongeacht of de statuten de verkrijging van eigen
      aandelen toestaan. De vennootschap wordt geregistreerd als aandeelhouder in het register.

      4 In het geval de verkrijging om niet ertoe leidt dat de vennootschap alle aandelen in de vennootschap houdt, gaat
      één door de vennootschap aan te wijzen aandeel over op de gezamenlijke bestuurders. De gezamenlijke bestuurders
      worden geregistreerd als aandeelhouder in het register.

      5 Een aandeelhouder die zich uiterlijk vijf jaar na de verkrijging van de aandelen door de vennootschap als bedoeld
      in lid 3 alsnog meldt bij de vennootschap met een aandeelbewijs heeft recht op een vervangend aandeel op naam van
      de vennootschap.

      6 De aandeelhouder die ten genoege van de vennootschap aannemelijk maakt dat zijn toonderbewijs is verloren of
      teniet gegaan wordt op zijn verzoek, tot het tegendeel blijkt, door de vennootschap als aandeelhouder op naam
      aangemerkt. Tegenover de vennootschap en derden is hij aansprakelijk voor alle als gevolg hiervan te lijden schade.

      7 Aan de latere verkrijger te goeder trouw kan niet worden tegengeworpen dat een aandeel aan toonder niet
      rechtsgeldig in omloop is gebracht of dat niet aan de stortingsplicht of bijstortingsplicht is voldaan.

      8 De vennootschap brengt bij de eerstvolgende statutenwijziging na inwerkingtreding van de
      [Wet omzetting aandelen aan toonder][ref3] de statuten in overeenstemming met het bepaalde in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel130
