      1 Coöperaties en onderlinge waarborgmaatschappijen zijn niet bevoegd door een besluit wijzigingen in de met haar
      leden in de uitoefening van haar bedrijf aangegane overeenkomsten aan te brengen, tenzij zij zich deze bevoegdheid
      in de overeenkomst op duidelijke wijze hebben voorbehouden. Een verwijzing naar statuten, reglementen, algemene
      voorwaarden of dergelijke, is daartoe niet voldoende.

      2 Op een wijziging als in het eerste lid bedoeld kan de rechtspersoon zich tegenover een lid slechts beroepen
      indien de wijziging schriftelijk aan het lid was medegedeeld.
