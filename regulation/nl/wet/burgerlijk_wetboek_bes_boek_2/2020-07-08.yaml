  - number: '27'
    text: |-
      1 De rechtspersoon wordt, onverminderd het elders in de wet bepaalde, ontbonden:

      a. door een daartoe strekkend besluit van de algemene vergadering of, indien de rechtspersoon een stichting is en
      de statuten dat toelaten, door een besluit van een daartoe in de statuten aangewezen orgaan of derde;

      b. na faillietverklaring, door hetzij opheffing van het faillissement wegens gebrek aan baten, hetzij insolventie.

      2 Een bepaling in de akte van oprichting of de statuten die een andere wijze van ontbinding aangeeft wordt,
      onverminderd het elders in de wet bepaalde, voor niet geschreven gehouden.

      3 Van de ontbinding wordt door de vereffenaars, in het geval van het eerste lid, onder b, door de curator,
      mededeling gedaan in de Staatscourant. Indien de rechtspersoon is ingeschreven in het handelsregister wordt van de
      ontbinding tevens opgave gedaan ten kantore van het handelsregister, ter inschrijving.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel27
  - number: '28'
    text: |-
      1 Na haar ontbinding geldt als doel van de rechtspersoon de vereffening van zijn vermogen en alles wat daartoe
      dienstig kan zijn.

      2 In alle van de rechtspersoon uitgaande stukken worden aan de naam van de rechtspersoon aan het slot toegevoegd de
      voluit geschreven woorden «in liquidatie» of de vertaling daarvan in de daarvoor in aanmerking komende taal.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel28
  - number: '29'
    text: |-
      1 Indien noch bij de statuten noch bij besluit van de algemene vergadering vereffenaars zijn aangewezen of benoemd,
      treedt het bestuur als zodanig op. De rechter is te allen tijde bevoegd om op verzoek van een belanghebbende of het
      openbaar ministerie een vereffenaar te ontslaan, een of meer andere vereffenaars aan te wijzen, deze van de nodige
      instructies te voorzien en een beslissing te nemen ten aanzien van de beloning van vereffenaars en de onderlinge
      verdeling van die beloning.

      2 Zijn er twee of meer vereffenaars, dan kan ieder van hen alle werkzaamheden tot vereffening verrichten, tenzij
      anders is bepaald. Bij verschil van mening tussen de vereffenaars beslist de rechter op de voet van het eerste
      lid, tweede zin. Voor het overige vinden de bepalingen omtrent de bevoegdheden, plichten en aansprakelijkheid
      van bestuurders ten aanzien van de vereffenaars zo veel mogelijk toepassing, onverminderd het bepaalde in het
      [eerste lid van artikel 28][ref1].

      3 Blijkt de vereffenaar dat de schulden de baten vermoedelijk zullen overtreffen dan doet hij aangifte tot
      faillietverklaring, tenzij alle bekende schuldeisers desgevraagd schriftelijk instemmen met voortzetting van de
      vereffening buiten faillissement.

      4 Indien noch bij de statuten, noch bij besluit van de algemene vergadering of bij de aanwijzing van vereffenaars
      door de rechter anders is bepaald, heeft de raad van commissarissen ten aanzien van de vereffenaars dezelfde taak
      als hij voor de ontbinding ten aanzien van het bestuur had.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel28
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel29
