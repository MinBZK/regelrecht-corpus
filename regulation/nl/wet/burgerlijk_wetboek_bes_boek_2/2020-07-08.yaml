  - number: 323a
    text: |-
      1 Als verdwijnende rechtspersoon kan bij de toepassing van de [artikelen 309 tot en met 334][ref1] ook optreden
      een buitenlandse rechtspersoon met een vergelijkbare rechtsvorm, mits het recht dat die buitenlandse rechtspersoon
      beheerst zich niet tegen de fusie en de wijze waarop deze tot stand komt verzet. Een verklaring met die strekking,
      afgelegd door een op dat rechtsgebied deskundige, wordt aan de akte van fusie gehecht.

      2 [Artikel 323][ref2] is van toepassing met dien verstande dat als vernietigingsgrond ook geldt dat het recht dat
      de buitenlandse rechtspersoon beheerst zich tegen een fusie als voltrokken verzet.

      3 De [artikelen 310 tot en met 334][ref3] vinden uitsluitend toepassing ten aanzien van de verkrijgende
      rechtspersoon. Met betrekking tot de verdwijnende rechtspersoon worden de voor een zodanige fusie geldende regels
      zoveel mogelijk in acht genomen.

      4 De in [artikel 318, tweede lid][ref4], bedoelde verklaring hoeft geen betrekking te hebben op de toepasselijke
      wettelijke en statutaire voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel309
