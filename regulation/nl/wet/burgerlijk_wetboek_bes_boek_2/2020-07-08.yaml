  - number: '25'
    text: |-
      1 Een in het handelsregister ingeschreven rechtspersoon wordt op verzoek van de Kamer van Koophandel door een
      beschikking van de rechter ontbonden, indien:

      a. de rechtspersoon, ondanks aanmaning, het voor zijn inschrijving in het handelsregister of voor de inschrijving
      van een aan hem toebehorende ondernemingverschuldigde bedrag niet heeft voldaan gedurende ten minste een jaar na de
      datum waarvoor hij dat bedrag had moeten voldoen;

      b. er gedurende ten minste zes maanden geen bestuurders van de rechtspersoon in het register staan ingeschreven,
      terwijl ook geen opgaaf tot inschrijving is gedaan, dan wel met betrekking tot alle ingeschreven en tot
      inschrijving opgegeven bestuurders zich een van de navolgende omstandigheden voordoet:

      1°. de bestuurder is overleden;

      2°. de bestuurder is gedurende zes maanden niet bereikbaar gebleken op het in het register of bij de opgaaf
      vermelde adres.

      2 Van haar voornemen ontbinding te verzoeken doet de Kamer van Koophandel schriftelijk mededeling aan alle
      ingeschreven en tot inschrijving opgegeven bestuurders op het in het register of bij de opgaaf vermelde adres. Ook
      doet zij daarvan mededeling in de Staatscourant en in een in het openbaar lichaam Bonaire, Sint Eustatius of Saba
      verschijnend nieuwsblad. De kosten van de publicaties zijn voor rekening van de rechtspersoon.

      3 Het ontbindingsverzoek kan uitsluitend worden ingediend binnen de periode gelegen tussen een maand en drie
      maanden na het verzenden van de in het tweede lid bedoelde mededeling en het verschijnen van de in vorige lid
      bedoelde publicaties. Van de indiening van het verzoek wordt door de Kamer inschrijving gedaan in het register.

      4 Verschijnt de rechtspersoon dan gaat de rechter niet tot ontbinding over alvorens hij de rechtspersoon in de
      gelegenheid heeft gesteld de gronden voor de ontbinding weg te nemen.

      5 Het [zesde tot en met het negende lid van artikel 24][ref1] vinden overeenkomstige toepassing. Indien de rechter
      de Kamer van Koophandel tot curator benoemt kan de Kamer de benoeming niet weigeren.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel24
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel25
