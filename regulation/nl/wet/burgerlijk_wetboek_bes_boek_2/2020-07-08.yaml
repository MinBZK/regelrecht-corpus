      1 Voor de vennootschap gelden in plaats van de [artikelen 116][ref1] en [117][ref2] de
      [artikelen 120 tot en met 126][ref3], ongeacht of zij aan de criteria van [artikel 119, tweede lid][ref4], voldoet.

      2 De in [artikel 120, vierde lid][ref5], bedoelde opgemaakte jaarrekening behoeft de instemming van de raad van
