  - number: '10'
    text: |-
      1 Behoudens beperkingen in de wet en de statuten is het bestuur bevoegd tot vertegenwoordiging van de
      rechtspersoon. Indien er meer bestuurders zijn is iedere bestuurder bevoegd, voor zover de statuten niet anders
      bepalen.

      2 Beperkingen van de bestuursbevoegdheid als bedoeld in het [tweede lid van artikel 8][ref1] strekken mede tot
      beperking van de daarmee samenhangende vertegenwoordigingsbevoegdheid.

      3 Tenzij de statuten anders bepalen kan, onverminderd het bepaalde in de [Handelsregisterwet 2009 BES][ref2], een
      beperking van de vertegenwoordigingsbevoegdheid als bedoeld in het eerste en tweede lid, aan een wederpartij die
      de beperking kent of behoort te kennen worden tegengeworpen. [Artikel 61, tweede en derde lid, van Boek 3][ref3],
      vindt overeenkomstige toepassing. Aan de wederpartij komt slechts toe een beroep op het bepaalde in het vierde lid
      van dit artikel.

      4 Iedere bestuurder is te allen tijde bevoegd en desgevraagd verplicht om aan een wederpartij uitsluitsel
      te geven over de vraag of aan een statutaire, wettelijke of andere voorwaarde voor het intreden van
      vertegenwoordigingsbevoegdheid van het bestuur of een bestuurder is voldaan. Wordt niet binnen redelijke termijn
      uitdrukkelijk verklaard dat aan de voorwaarde is voldaan dan kan de wederpartij, die niet uit anderen hoofde
      met het vervuld zijn van de voorwaarde bekend is of behoort te zijn, de rechtshandeling als ongeldig van de hand
      wijzen, mits dit terstond na afloop van die termijn geschiedt.

      5 De statuten kunnen ook aan andere door of krachtens de statuten aan te wijzen functionarissen, al dan niet
      tezamen met bestuurders, vertegenwoordigingsbevoegdheid toekennen.


