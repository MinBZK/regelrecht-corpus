  - number: '30'
    text: |-
      1 De vereffenaar maakt de activa van de rechtspersoon te gelde, wikkelt de verhoudingen tot derden af en betaalt de
      schulden. Hetgeen na de voldoening van de schuldeisers overblijft wordt aan hen die krachtens de statuten daartoe
      zijn gerechtigd uitgekeerd, of anders aan de leden of aandeelhouders. Bij de naamloze en besloten vennootschap
      vindt het [derde lid van artikel 118][ref1], respectievelijk [artikel 218][ref2] overeenkomstige toepassing. Heeft
      geen ander recht op het overschot dan keert de vereffenaar dit uit aan de Staat.

      2 De vereffenaar is bevoegd om, indien de staat van de boedel daartoe aanleiding geeft, uitkeringen bij voorbaat
      te doen.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel118
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel218
