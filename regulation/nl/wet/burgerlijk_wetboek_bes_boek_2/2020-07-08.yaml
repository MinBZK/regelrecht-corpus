  - number: '319'
    text: |-
      1 Pandrecht en vruchtgebruik op een recht van lidmaatschap of op aandelen van de verdwijnende rechtspersonen gaan
      over op hetgeen daarvoor in de plaats treedt.

      2 Rust het pandrecht of vruchtgebruik op een recht van lidmaatschap of op aandelen waarvoor niets in de plaats
      treedt, dan moet de verkrijgende rechtspersoon een gelijkwaardige vervanging geven.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel319
  - number: '320'
    text: |-
      1 Hij die, anders dan als lid of aandeelhouder, een bijzonder recht jegens een verdwijnende rechtspersoon heeft,
      zoals een recht op een uitkering van winst of tot het nemen van aandelen, moet een gelijkwaardig recht in de
      verkrijgende rechtspersoon krijgen, of schadevergoeding. Schadevergoeding kan niet worden gevorderd door iemand die
      reeds op de voet van [artikel 316][ref1] schadevergoeding heeft verzocht, tenzij de rechter in die procedure op dat
      verzoek niet heeft beslist.

      2 De schadevergoeding wordt bij gebreke van overeenstemming bepaald door een of meer onafhankelijke deskundigen,
      ten verzoeke van de meest gerede partij te benoemen door de rechter in eerste aanleg van de statutaire zetel van de
      verkrijgende rechtspersoon.

      3 [Artikel 319][ref2] is van overeenkomstige toepassing op pandrecht of vruchtgebruik dat op de bijzondere rechten
      was gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel316
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel319
