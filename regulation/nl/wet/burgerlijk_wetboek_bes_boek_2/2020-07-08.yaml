  - number: '321'
    text: |-
      1 Op het tijdstip met ingang waarvan de verkrijgende rechtspersoon de financiële gegevens van een verdwijnende
      rechtspersoon zal verantwoorden in de eigen jaarrekening of andere financiële verantwoording, is het laatste
      boekjaar van die verdwijnende rechtspersoon geëindigd.

      2 De verplichtingen omtrent de jaarrekening of andere financiële verantwoording van de verdwijnende rechtspersonen
      rusten na de fusie op de verkrijgende rechtspersoon.

      3 Waarderingsverschillen tussen de verantwoording van activa en passiva in de laatste jaarrekening of andere
      financiële verantwoording van de verdwijnende rechtspersonen en in de eerste jaarrekening of andere financiële
      verantwoording waarin de verkrijgende rechtspersoon deze activa en passiva verantwoordt, moeten worden toegelicht.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel321
  - number: '322'
    text: |-
      1 Indien ten gevolge van de fusie een overeenkomst van een fuserende rechtspersoon naar maatstaven van redelijkheid
      en billijkheid niet ongewijzigd in stand behoort te blijven, wijzigt of ontbindt de rechter de overeenkomst op
      vordering van een der partijen. Aan de wijziging of ontbinding kan terugwerkende kracht worden verleend.

      2 De bevoegdheid tot het instellen van de vordering vervalt door verloop van zes maanden na de nederlegging van
      de akte van fusie ten kantore van de in [artikel 318, derde lid][ref1], bedoelde registers. De vordering kan
      niet worden ingesteld door iemand die reeds op de voet van [artikel 316][ref2] wijziging of ontbinding van de
      overeenkomst heeft verzocht, tenzij de rechter in die procedure op dat verzoek niet heeft beslist.

      3 Indien uit de wijziging of ontbinding van de overeenkomst schade ontstaat voor de wederpartij, is de
      rechtspersoon gehouden tot vergoeding daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel318
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel316
