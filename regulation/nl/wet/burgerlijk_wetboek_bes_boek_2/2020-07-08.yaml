    text: |-
      Voor een onderlinge waarborgmaatschappij gelden voorts de volgende bepalingen:

      a. Zij die als verzekeringnemer bij een onderlinge waarborgmaatschappij een overeenkomstvan verzekering lopende
      hebben, zijn van rechtswege lid van de waarborgmaatschappij. Bij de onderlinge waarborgmaatschappij die krachtens
      haar statuten ook verzekeringnemers die geen lid zijn mag verzekeren, kan van deze bepaling worden afgeweken.

      b. Tenzij de statuten anders bepalen, duurt het lidmaatschap dat uit een verzekeringsovereenkomst ontstaat, voort
      totdat alle door het lid met de waarborgmaatschappij gesloten verzekeringsovereenkomsten zijn geëindigd. Bij
      overdracht of overgang van de rechten en verplichtingen uit zodanige overeenkomst gaat het lidmaatschap, voor zover
      uit die overeenkomst voortvloeiende, op de nieuwe verkrijger of de nieuwe verkrijgers over, een en ander behoudens
      afwijkende bepalingen in de statuten.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel98
  - number: '99'
    text: |-
      1 Het is aan een persoon die geen coöperatie of een onderlinge waarborgmaatschappij is, verboden zaken te doen met
      gebruik van de aanduiding «coöperatief», «onderling» of «wederkerig» of een afleiding daarvan.

      2 Ingeval van overtreding van dit verbod kan iedere coöperatie of onderlinge waarborgmaatschappij vorderen, dat de
      overtreder zich op straffe van een door de rechter te bepalen dwangsom onthoudt het gewraakte woord bij het doen
      van zaken te gebruiken.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel99
  - number: '100'
    text: |-
      1 De naamloze vennootschap is een rechtspersoon met een of meer op naam of aan toonder gestelde aandelen.

      2 De vennootschap wordt door een of meer personen opgericht bij notariële akte. Bij de oprichting wordt ten minste
      één aandeel met volledig stemrecht, dat deelt in de winst, dan wel één aandeel met volledig stemrecht en één
      aandeel dat deelt in de winst, bij een oprichter of een derde geplaatst.

      3 Rechten die stemrecht noch aanspraak op winstuitkering omvatten, worden niet als aandeel aangemerkt.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel100
  - number: '101'
    text: |-
      1 Onverminderd het bepaalde in [artikel 4, tweede lid][ref1], bevat de akte van oprichting in elk geval:

      a. de aantallen en soorten van de bij de oprichting geplaatste aandelen, alsmede de namen en woonplaatsen van
      degenen die deze aandelen hebben genomen;

      b. indien uitsluitend in geld wordt gestort, een verklaring van alle oprichters dat het eigen vermogen van de
      vennootschap bij oprichting niet negatief is.

      2 Wordt in natura gestort dan wordt aan de akte gehecht een door alle oprichters getekende oprichtingsbalans die
      een eigen vermogen toont dat niet negatief is.

      3 Heeft de vennootschap bij de oprichting een nominaal kapitaal dan wordt bij de toepassing van het eerste lid
      onder b en het tweede lid het bedrag daarvan in aanmerking genomen.

      4 De akte wordt in persoon of bij schriftelijke volmacht getekend door iedere oprichter en door ieder die blijkens
      de akte een of meer aandelen neemt.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel4
