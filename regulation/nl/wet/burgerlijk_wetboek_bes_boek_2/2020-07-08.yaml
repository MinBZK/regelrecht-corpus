  - number: '96'
    text: |-
      Voor de coöperatie geldt voorts dat, met behoud der vrijheid van uittreding uit de coöperatie, daaraan bij de
      statuten voorwaarden, in overeenstemming met haar doel en strekking, kunnen worden verbonden. Een voorwaarde welke
      verder gaat dan geoorloofd is, wordt in zoverre voor niet geschreven gehouden.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel96
  - number: '97'
    text: |-
      Voor een coöperatie, die in haar statuten een regeling heeft opgenomen als bedoeld in [artikel 92][ref1], gelden
      bovendien de volgende bepalingen:

      a. Het lidmaatschap wordt schriftelijk aangevraagd. Aan de aanvrager wordt eveneens schriftelijk bericht, dat hij
      als lid is toegelaten of geweigerd. Wanneer hij is toegelaten, wordt hem tevens medegedeeld onder welk nummer hij
      als lid in de administratie der coöperatie is ingeschreven. Niettemin behoeft, ten bewijze van de verkrijging van
      het lidmaatschap, van een schriftelijke aanvrage en een schriftelijk bericht als hiervoor bedoeld, niet te blijken.

      b. De geschriften, waarbij het lidmaatschap wordt aangevraagd, worden gedurende ten minster tien jaren door
      het bestuur bewaard. Echter behoeven de hier bedoelde geschriften niet te worden bewaard voor zover het betreft
      diegenen, van wie het lidmaatschap kan blijken uit een door en ondertekende, gedagtekende verklaring in de
      administratie van de coöperatie.

      c. De opzegging van het lidmaatschap kan slechts geschieden, hetzij bij een afzonderlijk geschrift, hetzij door een
      door het lid ondertekende, gedagtekende verklaring in de administratie van de coöperatie. Het lid dat de opzegging
      doet, ontvangt daarvan een schriftelijke erkenning van het bestuur. Wordt de schriftelijke erkenning niet binnen
      veertien dagen gegeven, dan is het lid bevoegd de opzegging op kosten van de coöperatie bij deurwaardersexploot
      te herhalen.

      d. Een door het bestuur gewaarmerkt afschrift van de ledenlijst wordt ten kantore van het handelsregister
      neergelegd bij de inschrijving van de coöperatie. Binnen een maand na het einde van ieder boekjaar wordt door het
      bestuur een schriftelijke opgave van de wijzigingen die de ledenlijst in de loop van het boek jaar heeft ondergaan,
      aan de ten kantore van het handelsregister neergelegde lijst toegevoegd of wordt, indien de Kamer van Koophandel
      dit nodig oordeelt, een nieuwe lijst neergelegd.


