  - number: 114a
    text: |-
      Certificaten aan toonder van aandelen mogen niet worden uitgegeven. Zolang certificaten aan toonder uitstaan,
      kunnen de aan het aandeel verbonden rechten niet worden uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel114a
  - number: '115'
    text: |-
      1 De statuten kunnen bepalen dat een orgaan per soort aandelen kan besluiten tot gehele of gedeeltelijke
      terugbetaling of ontheffing van een bijstortingsplicht als bedoeld in [artikel 107, vierde lid][ref1], mits het
      eigen vermogen van de vennootschap op het tijdstip van de terugbetaling of ontheffing ten minste nihil is en door
      de terugbetaling of ontheffing niet negatief wordt. Een besluit dat niet aan deze voorwaarde voldoet heeft geen
      enkele rechtskracht.

      2 Heeft de vennootschap een nominaal kapitaal dan wordt bij de toepassing van het eerste lid het bedrag daarvan als
      ondergrens in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel107
