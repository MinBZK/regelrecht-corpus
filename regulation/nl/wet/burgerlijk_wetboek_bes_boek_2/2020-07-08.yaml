      1 Behoudens beperkingen in de wet, de statuten of de aandeelhoudersovereenkomst, is iedere aandeelhouder bevoegd
      tot vertegenwoordiging van de vennootschap.

      2 Het [tweede tot en met het vijfde lid van artikel 10][ref1] vinden overeenkomstige toepassing.


