  - number: '350'
    text: |-
      1 Indien de gesplitste rechtspersoon bij de splitsing ophoudt te bestaan, is zijn laatste boekjaar geëindigd op
      het tijdstip met ingang waarvan de financiële gegevens betreffende zijn vermogen zullen worden verantwoord in de
      jaarrekening of andere financiële verantwoording van de verkrijgende rechtspersonen.

      2 Indien de gesplitste rechtspersoon bij de splitsing ophoudt te bestaan, rusten de verplichtingen omtrent zijn
      jaarrekening of andere financiële verantwoording na de splitsing op de gezamenlijke verkrijgende rechtspersonen.

      3 Waarderingsverschillen tussen de verantwoording van activa en passiva in de laatste jaarrekening of andere
      financiële verantwoording van de gesplitste rechtspersoon en in de eerste jaarrekening of andere financiële
      verantwoording waarin een verkrijgende rechtspersoon deze activa en passiva verantwoordt, moeten worden toegelicht.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel350
  - number: '351'
    text: |-
      1 Indien ten gevolge van de splitsing een overeenkomst van een partij bij de splitsing naar maatstaven van
      redelijkheid en billijkheid niet ongewijzigd in stand behoort te blijven, wijzigt of ontbindt de rechter
      de overeenkomst op vordering van een der partijen bij de overeenkomst. Aan de wijziging of ontbinding kan
      terugwerkende kracht worden verleend.

      2 De bevoegdheid tot het instellen van de vordering vervalt door verloop van zes maanden na de nederlegging van
      de akte van splitsing ten kantore van de in [artikel 347, derde lid][ref1], bedoelde registers. De vordering kan
      niet worden ingesteld door iemand die reeds op de voet van [artikel 345][ref2] wijziging of ontbinding van de
      overeenkomst heeft verzocht, tenzij de rechter in die procedure op dat verzoek niet heeft beslist.

      3 Indien uit de wijziging of ontbinding van de overeenkomst schade ontstaat voor de wederpartij, is de betrokken
      rechtspersoon gehouden tot vergoeding daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel347
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel345
