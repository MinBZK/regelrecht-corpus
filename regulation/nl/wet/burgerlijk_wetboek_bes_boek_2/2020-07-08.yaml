  - number: '112'
    text: |-
      1 De bevoegdheid tot het vestigen van vruchtgebruik op aandelen kan niet bij de statuten worden beperkt of
      uitgesloten.

      2 Tenzij bij de vestiging van het vruchtgebruik anders is bepaald, komen het stemrecht en de overige
      zeggenschapsrechten toe aan de aandeelhouder. De statuten kunnen de aan de vruchtgebruiker toekomende rechten
      beperken of uitsluiten.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel112
  - number: '113'
    text: |-
      1 De bevoegdheid tot het vestigen van een pandrecht op aandelen kan bij de statuten worden beperkt of uitgesloten.
      Voor zover het tegendeel niet volgt uit een voorziening als bedoeld in het tweede lid komen de aan het aandeel
      verbonden rechten toe aan de aandeelhouder.

      2 Tenzij de statuten anders bepalen kan bij de vestiging of in een aanvullende akte tussen aandeelhouder en
      pandhouder worden bepaald dat de aan de aandelen verbonden rechten, al dan niet voorwaardelijk, geheel of
      gedeeltelijk toekomen aan de pandhouder.

      3 Wordt pandrecht gevestigd met toepassing van het tweede lid van [artikel 236 van Boek 3][ref1] en vervolgens
      een voorziening als bedoeld in het tweede lid van dit artikel getroffen in een aanvullende akte, dan is voor de
      geldigheid van die akte vereist dat [artikel 110, tweede lid][ref2], overeenkomstige toepassing heeft gevonden. Ook
      artikel 110, derde, vierde en vijfde lid, vindt overeenkomstige toepassing.

      4 In afwijking van het [tweede lid van artikel 236 van Boek 3][ref3] kan pandrecht op aandelen op naam ook worden
      gevestigd zonder betekening of erkenning als bedoeld in [artikel 110][ref4].

      [Artikel 239 van Boek 3][ref5] vindt overeenkomstige toepassing.


