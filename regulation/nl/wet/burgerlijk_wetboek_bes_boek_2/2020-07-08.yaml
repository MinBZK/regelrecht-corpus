    text: |-
      1 Rechtshandelingen van de vennootschap met een bestuurder, commissaris of aandeelhouder, het prijsgeven van
      een recht daaronder begrepen, mogen niet worden verricht zonder de voorafgaande goedkeuring van de raad van
      commissarissen.

      2 Het eerste lid is van overeenkomstige toepassing op het aanspannen van een rechtsgeding tegen een bestuurder,
      commissaris of aandeelhouder, tenzij het betreft een geding als bedoeld in [artikel 142, tweede lid][ref1].


