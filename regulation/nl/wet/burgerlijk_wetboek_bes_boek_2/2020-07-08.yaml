      1 De aansprakelijkheid van een rechtspersoon als bestuurder van een andere rechtspersoon rust tevens hoofdelijk op
      ieder die ten tijde van het ontstaan van de aansprakelijkheid van de rechtspersoon daarvan bestuurder is.

      2 Ten aanzien van de aan het slot van het eerste lid bedoelde bestuurder vinden [artikel 14, vierde lid][ref1], en
      [artikel 16, derde en vierde lid][ref2], overeenkomstige toepassing.


