  - number: '334'
    text: |-
      1 De akte van fusie kan bepalen dat de aandeelhouders van de verdwijnende vennootschappen aandeelhouder worden
      van een groepsmaatschappij van de verkrijgende vennootschap. Zij worden dan geen aandeelhouder van de verkrijgende
      vennootschap.

      2 Zulk een fusie is slechts mogelijk, indien de groepsmaatschappij alleen of samen met een andere groepsmaatschappij
      alle aandelen van de verkrijgende vennootschap houdt. De [artikelen 317, eerste tot en met vierde lid][ref1], en
      [331][ref2] zijn op het besluit van de groepsmaatschappij van overeenkomstige toepassing.

      3 De groepsmaatschappij die de aandelen toekent geldt naast de verkrijgende vennootschap als fuserende
      rechtspersoon. Op haar rusten de verplichtingen die ingevolge de [artikelen 312 tot en met 328][ref3] op
      een verkrijgende vennootschap rusten, met uitzondering van de verplichtingen uit de [artikelen 316][ref4],
      [317][ref5], [318, vierde lid][ref6], [321, tweede lid][ref7], en [323, zevende lid][ref8]; voor de toepassing
      van [artikel 328, derde lid][ref9], blijft zij buiten beschouwing. De [artikelen 312, tweede lid, onder b][ref10],
      [320][ref11], [325, derde lid][ref12], en [326, eerste lid, onder b][ref13], gelden alsdan niet voor de
      verkrijgende vennootschap.


