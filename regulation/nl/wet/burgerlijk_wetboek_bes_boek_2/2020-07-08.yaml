  - number: '24'
    text: |-
      1 De rechter kan de rechtspersoon ontbinden indien:

      a. zijn doel of werkzaamheden geheel of ten dele in strijd zijn met de goede zeden, de openbare orde, de wet of
      de statuten;

      b. de oprichtingshandeling ernstige gebreken vertoont;

      c. de statuten in strijd zijn met de wet;

      d. in geval van ontstentenis van alle bestuurders, niet op de voet van de in [artikel 12, eerste lid][ref1],
      bedoelde voorschriften tijdelijk in het bestuur is voorzien;

      2 De rechter kan een vereniging, coöperatie of onderlinge waarborgmaatschappij ook ontbinden bij het geheel
      ontbreken van leden.

      3 De rechter kan een naamloze of besloten vennootschap voorts ontbinden indien:

      a. niet ten minste één aandeel met volledig stemrecht dat deelt in de winst, dan wel één aandeel met volledig
      stemrecht en één aandeel dat deelt in de winst, wordt gehouden door een ander dan de vennootschap zelf;

      b. het verzoek tot ontbinding is gedaan binnen een jaar na de oprichting en de vennootschap niet kan
      aantonen dat de in [artikel 101, eerste lid, onder b][ref2], respectievelijk [201, eerste lid, onder b][ref3]
      bedoelde verklaring juist was dan wel de in artikel 101, tweede lid, respectievelijk 201, tweede lid bedoelde
      oprichtingsbalans bij waardering van de getoonde activa en passiva naar in het maatschappelijk verkeer aanvaardbare
      maatstaven de toen bestaande toestand juist weergaf.

      4 Ontbinding kan worden verzocht door een belanghebbende of het openbaar ministerie. Van de indiening van het
      verzoek wordt door de indiener mededeling gedaan in de Staatscourant. Indien de rechtspersoon is ingeschreven
      in het handelsregister wordt van de indiening tevens opgave gedaan ten kantore van het handelsregister, ter
      inschrijving.

      5 De rechter gaat niet over tot ontbinding voordat hij de rechtspersoon in de gelegenheid heeft gesteld de gronden
      voor ontbinding weg te nemen. Voor wat betreft de in het derde lid, onder b, genoemde grond geldt dat de rechter
      de ontbinding niet uitspreekt alvorens hij de vennootschap in de gelegenheid heeft gesteld binnen een door hem te
      bepalen termijn haar eigen vermogen alsnog in overeenstemming te brengen met de daar bedoelde verklaring of balans.

      6 De beschikking, waarbij de rechtspersoon ontbonden wordt verklaard, houdt in de benoeming van een curator en de
      aanwijzing van een rechter commissaris.

      7 De vereffening van de ontbonden rechtspersoon geschiedt door de curator onder toezicht van de rechter
      commissaris, overeenkomstig de bepalingen van de [Faillissementswet BES][ref4].

      8 Van de beschikking, waarbij de rechtspersoon ontbonden wordt verklaard, wordt door de curator mededeling gedaan
      in de Staatscourant. Indien de rechtspersoon is ingeschreven in het handelsregister wordt van de beschikking tevens
      opgave gedaan ten kantore van het handelsregister, ter inschrijving.

      9 Is de ontbindingsgrond geheel of gedeeltelijk te wijten aan de grove schuld of de grove nalatigheid van een
      of meer oprichters, huidige of voormalige bestuurders of commissarissen, dan wel huidige of voormalige leden
      of aandeelhouders, dan zijn deze jegens de ontbonden rechtspersoon hoofdelijk aansprakelijk voor een bij de
      vereffening blijkend tekort. [Artikel 14, vijfde lid][ref5], vindt overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel101
      [ref3]: https://wetten.overheid.nl/BWBR0028744#Artikel201
      [ref4]: https://wetten.overheid.nl/BWBR0028917
      [ref5]: https://wetten.overheid.nl/BWBR0028744#Artikel14
