  - number: '240'
    text: |-
      1 De aandeelhouders kunnen de wijze waarop de vennootschap door hen zal worden bestuurd, de daarbij toepasselijke
      taakverdeling en beloning en de wijze van totstandkoming van beslissingen dienaangaande, nader vastleggen in een
      aandeelhoudersovereenkomst als bedoeld in [artikel 227, tweede lid][ref1], mits alle aandeelhouders en ook de
      vennootschap daarbij partij zijn.

      2 De aandeelhoudersovereenkomst wordt schriftelijk vastgelegd en door alle partijen getekend. Niet naleving van dit
      voorschrift heeft geen nietigheid ten gevolge.

      3 Tenzij de aandeelhoudersovereenkomst anders bepaalt worden alle beslissingen aangaande het bestuur genomen door
      de algemene vergadering van aandeelhouders met toepassing van de voor die vergadering geldende regels.

      4 Onverminderd het bepaalde in [artikel 228][ref2] is iedere aandeelhouder steeds bevoegd tot het bijeenroepen van
      een algemene vergadering. [Artikel 229][ref3] vindt geen toepassing. In plaats van [artikel 235][ref4] geldt dat
      een besluit van de algemene vergadering ook tot stand kan komen op een nader in de aandeelhouders-overeenkomst vast
      te stellen wijze, mits alle aandeelhouders in de gelegenheid zijn gesteld aan het overleg en de besluitvorming deel
      te nemen.

      5 De statuten kunnen bepalen dat ook de wijze van totstandkoming van besluiten van de algemene vergadering
      wordt geregeld in de aandeelhoudersovereenkomst. In dat geval vinden ook de [artikelen 228, tweede lid][ref5],
      [230][ref6], [232][ref7], [233][ref8] en [235][ref9] geen toepassing, voor zover het tegendeel niet uit de statuten
      of de aandeelhoudersovereenkomst blijkt.


