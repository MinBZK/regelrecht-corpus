  - number: '331'
    text: |-
      1 Tenzij de statuten anders bepalen, kan een verkrijgende vennootschap bij bestuursbesluit tot fusie besluiten.

      2 Dit besluit kan slechts worden genomen, indien de vennootschap het voornemen hiertoe heeft vermeld in de
      aankondiging dat het voorstel tot fusie is neergelegd.

      3 Het besluit kan niet worden genomen, indien een of meer aandeelhouders die tezamen ten minste een tiende van het
      eigen vermogen vertegenwoordigen, of een zoveel geringer bedrag als in de statuten is bepaald, binnen een maand
      na de aankondiging aan het bestuur hebben verzocht de algemene vergadering bijeen te roepen om over de fusie te
      besluiten. [Artikel 317][ref1] is dan van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel317
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel331
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '317'
        afdeling: '2'
  - number: '333'
    text: |-
      1 Indien de verkrijgende vennootschap fuseert met een vennootschap waarvan zij alle aandelen houdt of
      met een vereniging, coöperatie of onderlinge waarborgmaatschappij waarvan zij het enige lid is, zijn de
      [artikelen 326 tot en met 328][ref1] niet van toepassing.

      2 Indien iemand, of een ander voor zijn rekening, alle aandelen houdt van de te fuseren vennootschappen
      en de verkrijgende vennootschap geen aandelen toekent ingevolge de akte van fusie, zijn de
      [artikelen 326 tot en met 328][ref2] niet van toepassing.

      3 Indien alle stemgerechtigde personen hebben gestemd voor alle voor de fusie vereiste besluiten zijn de
      [artikelen 326 tot en met 328][ref3] niet van toepassing.

      4 Indien een verkrijgende vereniging, coöperatie, onderlinge waarborgmaatschappij of stichting fuseert met een
      naamloze of besloten vennootschap waarvan zij alle aandelen houdt, zijn de bepalingen van deze afdeling niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel326
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel326
      [ref3]: https://wetten.overheid.nl/BWBR0028744#Artikel326
