  - number: '315'
    text: |-
      1 Het bestuur van elke te fuseren rechtspersoon is verplicht de algemene vergadering en de andere te fuseren
      rechtspersonen in te lichten over na het voorstel tot fusie gebleken belangrijke wijzigingen in de omstandigheden
      die, waren zij bekend geweest, de mededelingen in het voorstel tot fusie of in de toelichting zouden hebben
      beïnvloed.

      2 Voor een stichting geldt deze verplichting jegens degenen die blijkens de statuten de fusie moeten goedkeuren.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel315
  - number: '316'
    text: |-
      1 Tot een maand nadat alle fuserende rechtspersonen de in het [derde lid van artikel 314][ref1] bedoelde
      aankondiging hebben gedaan kan iedere schuldeiser of contractuele wederpartij van een van de fuserende
      vennootschappen, alsmede iedere bijzonder rechthebbende in de zin van [artikel 320][ref2], door een verzoekschrift
      bij de rechter in eerste aanleg van de statutaire zetel van een verdwijnende of verkrijgende vennootschap, tegen de
      aangekondigde fusie in verzet komen op de grond dat hij in zijn positie als crediteur, contractuele wederpartij of
      bijzonder rechthebbende wordt geschaad. Het verzoekschrift vermeldt welke zekerheid, waarborg, contractswijziging,
      ontbinding of schadevergoeding wordt verlangd.

      2 Indien de rechter het verzet gegrond oordeelt bepaalt hij de door de verkrijgende vennootschap of een derde te
      stellen zekerheid of waarborg of te betalen schadevergoeding, dan wel de contractswijziging of -ontbinding die zal
      gelden wanneer de fusie tot stand komt. Aan een contractswijziging of -ontbinding kan hij een per de datum van de
      fusie ingaande, op de verkrijgende vennootschap rustende verplichting tot schadevergoeding verbinden.

      3 De in [artikel 318][ref3] bedoelde akte van fusie mag niet worden verleden voordat het verzet is ingetrokken,
      de beslissing waarbij het verzet ongegrond is verklaard uitvoerbaar is of, bij gegrondverklaring, de vastgestelde
      waarborg of zekerheid is gesteld.

      4 Indien de akte van fusie al is verleden, kan de rechter op een ingesteld rechtsmiddel het stellen van een door
      hem omschreven waarborg bevelen en daaraan een dwangsom verbinden.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel314
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel320
      [ref3]: https://wetten.overheid.nl/BWBR0028744#Artikel318
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel316
