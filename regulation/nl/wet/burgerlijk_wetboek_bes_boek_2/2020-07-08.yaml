  - number: '252'
    text: |-
      1 Indien de in [artikel 251][ref1] bedoelde vordering tot uittreding aanhangig wordt gemaakt en de rechter deze
      gegrond oordeelt wijst hij deze voorlopig toe. Daarbij benoemt hij één of meer deskundigen die schriftelijk
      bericht moeten uitbrengen binnen een door de rechter te bepalen termijn. In hun schriftelijk bericht laten
      de deskundigen zich uit over de prijs van de aandelen op het tijdstip van de voorlopige toewijzing, uitgaande
      van de waarde van de vennootschap op dat tijdstip, de fiscale gevolgen van de overdracht voor de eiser, de
      vennootschap en de medeaandeelhouders en de bedrijfseconomische gevolgen van de overdracht voor de vennootschap.
      Hij kan bepalen dat de eiser zekerheid moet stellen voor de met het deskundigenrapport gemoeide kosten.
      [Artikel 121, vierde lid][ref2], is van overeenkomstige toepassing.

      2 Nadat de deskundigen hun bericht hebben uitgebracht bepaalt de rechter het door de vennootschap te betalen
      bedrag. Daarin is begrepen een eventueel door de eiser te lijden fiscaal nadeel. Indien de eiser op onredelijke
      gronden weigert zijn aandelen vrijwillig over te dragen aan een alsnog binnen acht dagen bij incidentele conclusie
      door de vennootschap of een medeaandeelhouder aan te wijzen gegadigde op daarbij aan te geven voorwaarden, kan de
      rechter de vordering alsnog afwijzen.

      3 Indien de rechter de vordering definitief toewijst bepaalt hij dat de aandelen zullen worden overgedragen op
      de wijze als in het vierde lid voorzien. Daarbij veroordeelt hij de vennootschap tot betaling van het door hem
      vastgestelde bedrag, vermeerderd met de wettelijke rente vanaf het tijdstip van voorlopige toewijzing en de door
      hem vastgestelde kosten, die van de deskundigen en de notaris daaronder begrepen, in handen van een door hem
      daarbij aangewezen notaris. Aan deze veroordeling kan hij een dwangsom ten behoeve van de eiser verbinden. Vruchten
      die aan de aandelen zijn opgekomen sedert het tijdstip van de voorlopige toewijzing vervallen aan de vennootschap.
      Alvorens te beslissen hoort de rechter de aan te wijzen notaris, indien daartoe naar zijn oordeel aanleiding
      bestaat.

      4 Tenzij partijen onverwijld eenstemmig aan de notaris te kennen geven dat zij alsnog voor een andere oplossing
      kiezen, geldt als akte van overdracht een door de notaris na de ontvangst van het door de vennootschap
      verschuldigde met bekwame spoed opgemaakt proces-verbaal, waarin de beslissing van de rechter wordt geconstateerd.
      De notaris neemt in die akte zodanige toevoegingen en verduidelijkingen op als hij in het belang van het
      rechtsverkeer nodig acht. Na het verlijden van de akte keert de notaris het door hem ontvangen bedrag na aftrek
      van de door de rechter vastgestelde kosten aan de eiser uit. Een afschrift van de akte wordt door de notaris aan de
      vennootschap en de eiser toegezonden.

      5 Zolang niet onherroepelijk is beslist op de vordering, of het geding niet op andere wijze is geëindigd kan de
      eiser zijn aandelen niet vervreemden, dan wel daarop een pandrecht of recht van vruchtgebruik vestigen, zonder
      schriftelijke toestemming van de vennootschap of, bij gebreke daarvan, van de rechter.

      6 De vordering tot uittreding kan slechts met instemming van de wederpartij worden ingetrokken. Uitsluitend
      tegen een beslissing als bedoeld in het derde lid, of tot afwijzing van de vordering is een hogere voorziening
      toegelaten. Een vordering tot oproeping in vrijwaring, voeging of tussenkomst wordt niet toegelaten, onverminderd
      het bepaalde in het tweede lid, laatste volzin.

      7 De vordering tot uittreding kan ook worden ingesteld tegen een of meer van de medeaandeelhouders die zich alleen
      of samen met de vennootschap of andere medeaandeelhouders schuldig hebben gemaakt aan gedragingen als in het
      [eerste lid van artikel 251][ref3] omschreven. De vennootschap wordt in elk geval mede in het geding geroepen. Het
      tweede tot en met het vijfde lid van artikel 251 zijn van toepassing. Het tweede tot en met het zesde lid van het
      onderhavige artikel vinden overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel251
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel121
      [ref3]: https://wetten.overheid.nl/BWBR0028744#Artikel251
