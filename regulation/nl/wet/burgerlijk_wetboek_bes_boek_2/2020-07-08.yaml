  - number: '317'
    text: |-
      1 Het besluit tot fusie wordt genomen door de algemene vergadering; in een stichting wordt het besluit genomen door
      degene die de statuten mag wijzigen of, als geen ander dat mag, door het bestuur. Het besluit mag niet afwijken van
      het voorstel tot fusie.

      2 Een besluit tot fusie kan eerst worden genomen na verloop van een maand na de dag waarop alle fuserende
      rechtspersonen de nederlegging van het voorstel tot fusie hebben aangekondigd.

      3 Een besluit tot fusie wordt genomen op dezelfde wijze en met dezelfde meerderheid als een besluit tot wijziging
      van de statuten. Vereisen de statuten hiervoor goedkeuring, dan geldt dit ook voor het besluit tot fusie. Vereisen
      de statuten voor de wijziging van afzonderlijke bepalingen verschillende meerderheden, dan is voor een besluit tot
      fusie de grootste daarvan vereist en sluiten de statuten wijziging van bepalingen uit, dan zijn de stemmen van alle
      stemgerechtigde leden of aandeelhouders vereist; een en ander tenzij die bepalingen na de fusie onverminderd zullen
      gelden. De notulen van de vergaderingen waarin tot fusie wordt besloten worden opgemaakt bij notariële akte.

      4 Het derde lid geldt niet, voor zover de statuten een andere regeling voor besluiten tot fusie geven.

      5 Een besluit tot fusie van een stichting behoeft de voorafgaande goedkeuring van de rechter, tenzij uitsluitend
      stichtingen die stichting particulier fonds zijn, of uitsluitend stichtingen die dat niet zijn, bij de fusie
      betrokken zijn en de statuten van deze stichtingen het mogelijk maken alle bepalingen daarvan te wijzigen. De
      rechter wijst het verzoek af, indien er gegronde redenen zijn om aan te nemen dat de fusie strijdig is met het
      belang van de stichting of dat de belangen van aangeslotenen of derden onevenredig worden geschaad.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel317
  - number: '318'
    text: |-
      1 De fusie geschiedt bij notariële akte en wordt van kracht met ingang van de dag na die waarop de akte
      is verleden. De akte mag slechts worden verleden binnen zes maanden na de aankondiging van de nederlegging
      van het voorstel of, indien dit als gevolg van gedaan verzet niet mag, binnen een maand na het in het
      [derde lid van artikel 316][ref1] bedoelde tijdstip.

      2 Aan de voet van de akte verklaart de notaris dat hem is gebleken dat de vormvoorschriften in acht zijn genomen
      voor alle besluiten die deze en de volgende afdeling en de statuten voor het totstandkomen van de fusie vereisen
      en dat voor het overige de daarvoor in deze en de volgende afdeling en in de statuten gegeven voorschriften zijn
      nageleefd.

      3 De [artikelen 4][ref2] en [5][ref3] vinden overeenkomstige toepassing met dien verstande dat de vereiste
      stukken worden aangeboden ten kantore van het handelsregister van de verkrijgende en van elke gefuseerde
      rechtspersoon. Bij de toepassing van [artikel 24][ref4] wordt telkens naast «oprichting», «oprichtingshandeling» en
      «oprichtingsbalans» ook gelezen: fusie, fusiehandeling en fusiebalans.

      4 De verkrijgende rechtspersoon doet binnen een maand opgave van de fusie aan de beheerders van andere openbare
      registers waarin overgang van rechten of de fusie kan worden ingeschreven. Gaat door de fusie een registergoed
      op de verkrijgende rechtspersoon over, dan is deze verplicht binnen deze termijn aan de bewaarder van de openbare
      registers, bedoeld in [titel 1, afdeling 2 van Boek 3][ref5], de voor de inschrijving van de fusie vereiste stukken
      aan te bieden.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel316
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0028744#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0028744#Artikel24
      [ref5]: https://wetten.overheid.nl/BWBR0028745#Afdeling2
