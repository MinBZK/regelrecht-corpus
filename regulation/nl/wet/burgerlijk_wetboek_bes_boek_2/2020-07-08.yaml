  - number: '19'
    text: |-
      1 Tenzij toepassing is gegeven aan [artikel 18][ref1] kunnen de statuten bepalen dat er een raad van commissarissen
      is of kan zijn. Zij omschrijven dan de taak van de raad van commissarissen.

      2 Tot de taak van de raad van commissarissen behoort in elk geval het houden van toezicht op het bestuur.

      3 De raad van commissarissen bestaat uit een of meer natuurlijke personen.

      4 Tenzij de statuten anders bepalen is de raad van commissarissen bevoegd iedere bestuurder te schorsen. De
      schorsing vervalt indien de betrokkene niet binnen twee maanden na de dag van schorsing is ontslagen.

      5 De statuten kunnen aanvullende bepalingen omtrent de taak en de bevoegdheden van de raad van commissarissen en
      van zijn leden bevatten.

      6 Het bestuur verschaft de raad van commissarissen en de individuele commissarissen tijdig de voor de uitoefening
      van hun taak noodzakelijke of met het oog daarop door de betrokkene verlangde gegevens.

      7 Het bepaalde in de [artikelen 9][ref2], [14][ref3] en [16][ref4] vindt overeenkomstige toepassing ten aanzien
      van commissarissen. Bij de vervulling van zijn taak richt de raad van commissarissen zich naar het belang van
      de rechtspersoon en, voor zover daarvan sprake is, de met deze verbonden onderneming. Tenzij de statuten anders
      bepalen, sluit dit niet uit dat een commissaris, met inachtneming van de vorige zin, in het bijzonder opkomt voor
      de belangen van degene die hem heeft benoemd of voorgedragen en deze belangen relatief zwaar laat wegen.

      8 Op de benoeming, de schorsing en het ontslag van commissarissen zijn onderscheidenlijk de
      [artikelen 51, eerste lid, onder c][ref5], [80][ref6] en [236][ref7] van overeenkomstige toepassing. Bij
      de naamloze vennootschap is [artikel 136][ref8] van overeenkomstige toepassing, behoudens het bepaalde in
      [artikel 139][ref9].


