      1 De rechter in eerste aanleg van het openbaar lichaam waar de rechtspersoon zijn statutaire zetel of, bij gebreke
      daarvan, zijn centrum van activiteiten heeft, neemt kennis van alle rechtsvorderingen die krachtens dit boek of
      de statuten tegen een bestuurder of de rechtspersoon worden ingesteld, alsook van de rechtsvorderingen waartoe
      de overeenkomst tussen een bestuurder en de rechtspersoon aanleiding geeft. Hetzelfde geldt voor alle overige in
      dit boek geregelde procedures. Tenzij anders is overeengekomen geldt hetzelfde voor procedures die voortvloeien
      uit de aandeelhoudersovereenkomst bedoeld in het [tweede lid van de artikelen 127][ref1] en [227][ref2] en
      [artikel 240][ref3].

      2 De statuten kunnen bepalen dat alle of bepaalde geschillen tussen twee of meer van de in
      [artikel 7, eerste lid][ref4], bedoelde personen als zodanig worden beslist door arbitrage.


