  - number: '348'
    text: |-
      1 De rechthebbende van een pandrecht of vruchtgebruik op een recht van lidmaatschap of op aandelen in het kapitaal
      van de splitsende rechtspersoon verkrijgt eenzelfde recht op hetgeen het lid of de aandeelhouder krachtens de akte
      van splitsing verkrijgt. Indien de splitsende rechtspersoon na de splitsing voortbestaat, blijft daarnaast het
      bestaande pandrecht of recht van vruchtgebruik in stand.

      2 Vervallen aandelen waarop een pandrecht of vruchtgebruik rust, en treedt daarvoor niets in de plaats, dan moeten
      de verkrijgende rechtspersonen de rechthebbende een gelijkwaardige vervanging geven.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel348
  - number: '349'
    text: |-
      1 Hij die, anders dan als lid of aandeelhouder, een bijzonder recht jegens de splitsende rechtspersoon heeft, zoals
      een recht op een uitkering van winst of tot het nemen van aandelen, moet hetzij zodanige rechten in verkrijgende
      rechtspersonen krijgen, dat deze, waar toepasselijk samen met het recht dat hij jegens de voortbestaande
      splitsende rechtspersoon heeft, gelijkwaardig zijn aan zijn recht voor de splitsing, hetzij schadevergoeding
      krijgen. Schadevergoeding kan niet worden gevorderd door iemand die reeds op de voet van [artikel 345][ref1]
      schadevergoeding heeft verzocht, tenzij de rechter in die procedure op dat verzoek niet heeft beslist.

      2 De schadevergoeding wordt bij gebreke van overeenstemming bepaald door een of meer onafhankelijke deskundigen,
      ten verzoeke van de meest gerede partij te benoemen door de rechter in eerste aanleg van de statutaire zetel van de
      splitsende rechtspersoon.

      3 [Artikel 348][ref2] is van overeenkomstige toepassing op pandrecht of vruchtgebruik dat op de bijzondere rechten
      was gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel345
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel348
