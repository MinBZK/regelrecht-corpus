  - number: '255'
    text: |-
      1 In iedere stand van een geding op de voet van [artikel 252][ref1] of [253][ref2], kan de rechter op verzoek van
      een belanghebbende een door deze gevraagde voorziening als bedoeld in het derde lid treffen, indien het belang van
      de vennootschap of een andere in [artikel 7, eerste lid][ref3], bedoelde persoon dit eist. Alvorens te beslissen
      kan de rechter desverzocht of ambtshalve getuigen en deskundigen horen.

      2 De voorziening kan te allen tijde op verzoek van een belanghebbende worden ingetrokken, verlengd of gewijzigd.
      Zij vervalt op het door de rechter bepaalde tijdstip en in elk geval op het tijdstip dat de beslissing op de
      vordering in het hoofdgeding onherroepelijk is geworden.

      3 De voorziening kan inhouden:

      a. schorsing van de werking van een besluit van een orgaan van de rechtspersoon, dan wel een bevel om een besluit
      geheel of ten dele in te trekken, de uitvoering daarvan geheel of ten dele op te schorten of de gevolgen daarvan
      geheel of ten dele ongedaan te maken;

      b. schorsing van een of meer bestuurders of commissarissen;

      c. tijdelijke aanstelling van een of meer bestuurders of commissarissen;

      d. tijdelijke afwijking van daarbij aangegeven bepalingen van de statuten;

      e. tijdelijke ontneming van stemrecht;

      f. tijdelijke overgang van aandelen ten titel van beheer;

      g. een tot de rechtspersoon of andere persoon als bedoeld in [artikel 7, eerste lid][ref4], gericht bevel om
      bepaalde handelingen te verrichten of na te laten.

      4 Een voorziening kan door derden te goeder trouw verworven rechten niet aantasten. Dreigt aantasting dan wordt
      de betrokken derde als belanghebbende in het geding geroepen. De rechter kan, gehoord de derde, bepalen dat de
      voorziening toch tegen die derde werkt, ongeacht de mate waarin deze te goeder trouw is, mits daarbij aan de derde
      een redelijke door de vennootschap te betalen schadevergoeding wordt toegekend, zulks onverminderd het verhaal door
      de vennootschap van het betaalde bedrag op degene die de schade heeft veroorzaakt, indien en voor zover daartoe
      gronden zijn.

      5 De rechter regelt zo nodig de gevolgen van de getroffen voorziening. Aan het niet opvolgen van een bevel kan hij
      desverzocht de verbeurte van een dwangsom ten behoeve van de verzoeker of de vennootschap verbinden.

      6 Het instellen van hoger beroep of cassatie tegen een beschikking als bedoeld in dit artikel staat aan
      voortzetting van het hoofdgeding niet in de weg.

      7 Indien de rechter de vordering in het hoofdgeding afwijst kan hij op verzoek van de vennootschap daarbij
      beslissen dat de eiser aan de vennootschap de directe kosten vergoedt waartoe getroffen voorzieningen aanleiding
      hebben gegeven, voor zover deze kosten voor rekening van de vennootschap zijn gekomen, zulks onverminderd een
      eventueel door de vennootschap of een derde in te stellen vordering tot schadevergoeding, indien daartoe gronden
      zijn. De in dit lid bedoelde kosten worden door de rechter begroot.


