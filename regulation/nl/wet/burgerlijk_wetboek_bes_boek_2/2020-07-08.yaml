  - number: '122'
    text: |-
      1 De vennootschap is verplicht binnen acht dagen na goedkeuring van de jaarrekening en gedurende twee jaar daarna
      een volledig afschrift van de jaarrekening, waarop de dag van de goedkeuring is aangetekend, ten kantore van de
      vennootschap ter inzage te leggen voor belanghebbenden.

      2 Is de jaarrekening niet binnen twee maanden na afloop van de in [artikel 120, eerste lid][ref1], voor het opmaken
      daarvan voorgeschreven termijn goedgekeurd, dan wordt de opgemaakte jaarrekening onverwijld ten kantore van de
      vennootschap ter inzage gelegd voor belanghebbenden.

      3 Van de ter inzage legging als bedoeld in de het eerste en tweede lid wordt onverwijld mededeling gedaan ten
      kantore van het handelsregister, in het geval van het tweede lid met vermelding dat het een niet goedgekeurde
      jaarrekening betreft.

      4 De statuten kunnen bepalen dat een belanghebbende die inzage wil zich moet laten vertegenwoordigen door een
      persoon als bedoeld in [artikel 121, zesde lid][ref2]. Is dat het geval dan wordt daarvan melding gemaakt bij de
      mededeling ten kantore van het handelsregister als bedoeld in het derde lid.

      5 Aan de tot inzage gerechtigde belanghebbende of vertegenwoordiger wordt desgevraagd tegen kostprijs een afschrift
      van de ter inzage gelegde stukken verschaft.

      6 Het eerste tot en met het vijfde lid van dit artikel gelden niet voor de vennootschap die met inachtneming van de
      in het eerste tot en met het derde lid genoemde termijnen en bijkomende eisen haar goedgekeurde dan wel opgemaakte
      jaarrekening voor een ieder ter inzage legt ten kantore van het handelsregister.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel120
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel121
