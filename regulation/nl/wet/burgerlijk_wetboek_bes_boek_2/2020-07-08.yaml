  - number: '108'
    text: |-
      1 Aan de nemer of houder van een aandeel op naam wordt desgevraagd een op naam gesteld aandeelbewijs afgegeven. De
      waarde van de verrichte storting en de eventuele bijstortingsverplichting worden daarop aangetekend.

      2 Aan de latere verkrijger te goeder trouw kan niet worden tegengeworpen dat het daarop door de vennootschap
      vermelde aangaande de storting of de bijstortingsverplichting onjuist of onvolledig is.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel108
  - number: '109'
    text: |-
      1 Het bestuur houdt een register bij, waarin de namen en adressen van alle houders van aandelen op naam zijn
      opgenomen, met vermelding van de soort aandeel, het daaraan verbonden stemrecht, het daarop gestorte of als gestort
      weergegeven bedrag, de eventuele bijstortingsverplichting, de dag van verkrijging en het al of niet afgegeven zijn
      van een aandeelbewijs. Aangetekend worden ook de vestiging of overdracht van vruchtgebruik op de aandelen en de
      vestiging van pandrecht op de aandelen, alsmede een daarmee samenhangende overgang van stemrecht. Het register
      wordt regelmatig bijgehouden. Bij iedere mutatie wordt de dag waarop deze is aangebracht vermeld.

      2 Iedere aandeelhouder heeft recht op inzage in het register voor zover het betreft de door hem gehouden aandelen.
      De statuten kunnen het inzagerecht aan anderen toekennen.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel109
  - number: '110'
    text: |-
      1 Aandelen zijn overdraagbaar, behoudens het in [artikel 111][ref1] en elders in de wet bepaalde.

      2 Levering van aandelen op naam geschiedt door een door partijen getekende akte van overdracht en hetzij betekening
      van die akte aan de vennootschap, hetzij erkenning van de overdracht door de vennootschap. Erkenning geschiedt door
      een ondertekende aantekening op de akte van overdracht of een aan de verkrijger gerichte schriftelijke verklaring
      van de vennootschap. Betreft het aandelen waarop een bijstortingsplicht rust, dan kan erkenning slechts geschieden
      wanneer de akte van overdracht een vaste dagtekening draagt.

      3 Indien een aandeelbewijs door de vennootschap is afgegeven kan dat stuk, voorzien van een door partijen
      ondertekende aantekening tot overdracht, als akte van overdracht gelden.

      4 De statuten kunnen bepalen dat, indien een aandeelbewijs door de vennootschap is afgegeven, als akte van
      overdracht uitsluitend kan gelden een stuk als bedoeld in het derde lid. Zij kunnen ook bepalen dat erkenning
      of betekening slechts kan geschieden na inlevering van het afgegeven aandeelbewijs, zulks onverminderd het
      recht van de opvolgend aandeelhouder op afgifte van een te zijnen name gesteld aandeelbewijs op de voet van
      [artikel 108, eerste lid][ref2]. In beide gevallen lijdt de regel uitzondering wanneer de vervreemder ten genoege
      van de vennootschap aannemelijk maakt dat zijn aandeelbewijs verloren is gegaan. De vervreemder, die zich op deze
      bepaling beroept, is tegenover de vennootschap en derden aansprakelijk voor alle als gevolg hiervan te lijden
      schade.

      5 De levering en de dag daarvan worden in het register, bedoeld in [artikel 109][ref3], aangetekend.

      6 Levering van beursgenoteerde aandelen kan ook geschieden overeenkomstig het bij die beurs gebruikelijke systeem.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel111
