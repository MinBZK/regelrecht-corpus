  - number: '340'
    text: |-
      1 De besturen van de partijen bij de splitsing stellen een voorstel tot splitsing op.

      2 Dit voorstel vermeldt ten minste:

      a. de rechtsvorm, naam en statutaire zetel van de partijen bij de splitsing en, voor zover de verkrijgende
      rechtspersonen bij de splitsing worden opgericht, van deze rechtspersonen;

      b. de statuten van de verkrijgende rechtspersonen en van de voortbestaande splitsende rechtspersoon, zoals die
      statuten luiden en zoals zij na de splitsing zullen luiden dan wel, voor zover de verkrijgende rechtspersonen bij
      de splitsing worden opgericht, het ontwerp van de akte van oprichting;

      c. of het gehele vermogen van de splitsende rechtspersoon zal overgaan of een gedeelte daarvan;

      d. een beschrijving aan de hand waarvan nauwkeurig kan worden bepaald welke vermogensbestanddelen van de splitsende
      rechtspersoon zullen overgaan op elk van de verkrijgende rechtspersonen en, indien niet het gehele vermogen van de
      splitsende rechtspersoon zal overgaan, welke vermogensbestanddelen door hem zullen worden behouden, alsmede een pro
      forma winst- en verliesrekening dan wel exploitatierekening van de verkrijgende rechtspersonen en de voortbestaande
      splitsende rechtspersoon;

      e. de waarde, bepaald naar de dag waarop de in [artikel 341, tweede, lid][ref1] bedoelde jaarrekening of
      tussentijdse vermogensopstelling van de splitsende rechtspersoon betrekking heeft en berekend met inachtneming van
      de derde volzin van die bepaling, van het deel van het vermogen dat elke verkrijgende rechtspersoon zal verkrijgen
      en van het deel dat de voortbestaande splitsende rechtspersoon zal behouden, alsmede de waarde van aandelen in
      het kapitaal van verkrijgende rechtspersonen en die de voorbestaande splitsende rechtspersoon bij de splitsing
      zal verkrijgen;

      f. welke rechten of vergoedingen ingevolge [artikel 349][ref2] ten laste van de verkrijgende rechtspersonen worden
      toegekend aan degenen die anders dan als lid of aandeelhouder bijzondere rechten hebben jegens de splitsende
      rechtspersoon, zoals rechten op een uitkering van winst of tot het nemen van aandelen, en met ingang van welk
      tijdstip de toekenning geschiedt;

      g. welke voordelen in verband met de splitsing worden toegekend aan een bestuurder of commissaris van een partij
      bij de splitsing of aan een ander die bij de splitsing is betrokken;

      h. de voornemens over de samenstelling na de splitsing van de besturen van de verkrijgende rechtspersonen en van
      de voortbestaande splitsende rechtspersoon, alsmede, voor zover er raden van commissarissen zullen zijn, van die
      raden;

      i. het tijdstip met ingang waarvan financiële gegevens betreffende elk deel van het vermogen dat zal
      overgaan zullen worden verantwoord in de jaarrekening of andere financiële verantwoording van de verkrijgende
      rechtspersonen;

      j. de voorgenomen maatregelen in verband met het verkrijgen door de leden of aandeelhouders van de splitsende
      rechtspersoon van het lidmaatschap of aandeelhouderschap van de verkrijgende rechtspersonen;

      k. de voornemens omtrent voortzetting of beëindiging van werkzaamheden;

      l. wie in voorkomend geval het besluit tot splitsing moet goedkeuren.

      3 Het voorstel tot splitsing wordt ondertekend door de bestuurders van elke partij bij de splitsing; ontbreekt de
      handtekening van een of meer hunner, dan wordt daarvan onder opgave van redenen melding gemaakt.

      4 Indien een partij bij de splitsing een naamloze vennootschap is waarvan de statuten een bepaling bevatten als
      bedoeld in [artikel 139][ref3], moet het voorstel tot splitsing zijn goedgekeurd door de raad van commissarissen
      van die vennootschap en wordt het door de commissarissen mede ondertekend; ontbreekt de handtekening van een of
      meer hunner, dan wordt daarvan onder opgave van redenen melding gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel341
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel349
      [ref3]: https://wetten.overheid.nl/BWBR0028744#Artikel139
