    text: |-
      1 Voor zover de statuten niet anders bepalen behoort aan de algemene vergadering van aandeelhouders, binnen de bij
      de wet en de statuten gestelde grenzen, alle bevoegdheid die niet aan het bestuur of aan anderen is toegekend.

      2 De aandeelhouders kunnen hun onderlinge verhouding en hun verhouding tot de vennootschap, daaronder
      begrepen de wijze waarop zij hun bevoegdheden als aandeelhouder zullen uitoefenen, nader regelen in een
      aandeelhoudersovereenkomst. De aandeelhoudersovereenkomst mag niet in strijd zijn met de wet of de statuten.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel127
  - number: '128'
    text: |-
      1 Jaarlijks wordt ten minste één algemene vergadering gehouden.

      2 Voor zover de statuten niet anders bepalen, zijn tot het bijeenroepen van een algemene vergadering iedere
      bestuurder en iedere commissaris bevoegd. Het bestuur en de raad van commissarissen zijn steeds bevoegd tot
      bijeenroeping van de algemene vergadering.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel128
  - number: '129'
    text: |-
      1 Aandeelhouders die alleen of samen met andere aandeelhouders ten minste tien procent van de stemmen ten aanzien
      van een bepaald onderwerp kunnen uitbrengen, kunnen het bestuur of de raad van commissarissen schriftelijk
      verzoeken om een algemene vergadering bijeen te roepen teneinde te beraadslagen en te besluiten over dat onderwerp,
      mits zij daarbij een redelijk belang hebben.

      2 Indien het bestuur of de raad van commissarissen niet binnen veertien dagen na de dag dat het verzoek de
      vennootschap of het betrokken orgaan heeft bereikt, gevolg geeft aan een zodanig verzoek, kunnen de verzoekers
      zelf tot bijeenroeping overgaan. Met het oog daarop geeft het bestuur de verzoekers inzage in het register, bedoeld
      in [artikel 109][ref1].

      3 Bij de oproeping door de aandeelhouders worden geen andere dan de aanvankelijk aangegeven onderwerpen als te
      behandelen vermeld.

      4 De oproeping en de daarbij behorende stukken worden mede gezonden aan iedere bestuurder en iedere commissaris.

      5 Voor de toepassing van [artikel 130, vijfde lid][ref2], worden de in het eerste tot en met vierde lid bedoelde
      voorschriften mede in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel109
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel130
