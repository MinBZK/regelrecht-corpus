  - number: '363'
    text: |-
      1 De akte van splitsing kan bepalen dat de aandeelhouders van de splitsende vennootschap aandeelhouder worden van
      een groepsmaatschappij van een verkrijgende vennootschap. Zij worden dan geen aandeelhouder van die verkrijgende
      vennootschap.

      2 Zulk een splitsing is slechts mogelijk, indien de groepsmaatschappij alleen of samen met
      een andere groepsmaatschappij alle aandelen van de verkrijgende vennootschap houdt. Het
      [eerste tot en met het vierde lid van artikel 346][ref1] en [artikel 361][ref2] zijn op het besluit van de
      groepsmaatschappij van overeenkomstige toepassing.

      3 De groepsmaatschappij die de aandelen toekent geldt naast de verkrijgende vennootschap als partij bij de
      splitsing. Op haar rusten de verplichtingen die ingevolge de [artikelen 340 tot en met 360][ref3] op een
      verkrijgende rechtspersoon rusten, met uitzondering van de verplichtingen uit de [artikelen 345][ref4], 346
      en het tweede en vierde lid van artikel 350; voor de toepassing van het vierde lid van artikel 359 blijft zij
      buiten beschouwing; de [artikelen 352][ref5], [353][ref6] en het [zevende lid van artikel 354][ref7] gelden
      voor haar niet. Het [tweede lid, onder b, van artikel 340][ref8], het [derde lid van artikel 356][ref9] en het
      [eerste lid, onder b, van artikel 357][ref10] gelden alsdan niet voor de verkrijgende vennootschap.


