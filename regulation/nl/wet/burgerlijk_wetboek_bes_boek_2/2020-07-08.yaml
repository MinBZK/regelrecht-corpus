  - number: '2'
    text: |-
      1 Een rechtspersoon ontstaat niet bij het ontbreken van een door een notaris ondertekende akte, voor zover
      door de wet voor de totstandkoming vereist. Het ontbreken van kracht van authenticiteit aan een door een
      notaris ondertekende akte verhindert het ontstaan van de rechtspersoon niet, tenzij het gaat om een uiterste
      wilsbeschikking.

      2 Vernietiging van de rechtshandeling waardoor een rechtspersoon is ontstaan, tast diens bestaan niet aan. Het
      vervallen van de deelneming van een of meer oprichters van een rechtspersoon heeft op zichzelf geen invloed op de
      rechtsgeldigheid van de deelneming der overblijvende oprichters.

      3 Is ten name van een niet bestaande rechtspersoon een vermogen gevormd, dan verklaart de rechter op verzoek
      van een belanghebbende of het openbaar ministerie dat dit vermogen toebehoort aan een bij die beschikking in het
      leven geroepen rechtspersoon in de voorgewende rechtsvorm. Tenzij een andere oplossing de rechter geraden voorkomt
      ontbindt de rechter die rechtspersoon bij dezelfde beschikking.

      Het [zesde tot en met het achtste lid van artikel 24][ref1] vinden overeenkomstige toepassing. De andere
      oplossing kan bestaan in het alsnog vaststellen van statuten door de rechter en het aanwijzen van bestuurders,
      commissarissen, leden of aandeelhouders.

      4 Is het niet ontstaan van de rechtspersoon geheel of gedeeltelijk te wijten aan de grove schuld of de grove
      nalatigheid van een of meer personen die voor de ontbinding hebben gefungeerd als oprichter, bestuurder,
      commissaris, lid of aandeelhouder, dan zijn deze jegens de ontbonden rechtspersoon hoofdelijk aansprakelijk voor
      een bij de vereffening blijkend tekort.


