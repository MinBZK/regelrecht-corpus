  - number: '116'
    text: |-
      1 Jaarlijks binnen acht maanden na afloop van het boekjaar, behoudens verlenging van deze termijn door de algemene
      vergadering op grond van bijzondere omstandigheden met ten hoogste zes maanden, maakt het bestuur een jaarrekening
      op, ten minste bestaande uit een balans, een winst en verliesrekening en een toelichting op deze stukken.

      2 De opgemaakte jaarrekening wordt door alle bestuurders ondertekend. Zij wordt mede ondertekend door de
      commissarissen die in functie zijn. Ontbreekt een handtekening dan wordt de reden daarvoor medegedeeld.

      3 De opgemaakte jaarrekening wordt aan de algemene vergadering ter goedkeuring voorgelegd. De statuten kunnen
      bepalen dat de algemene vergadering de bevoegdheid heeft alle of bepaalde posten te wijzigen dan wel het bestuur op
      te dragen de jaarrekening te wijzigen volgens door de algemene vergadering of een commissie uit die vergadering te
      geven aanwijzingen.

      4 De jaarrekening geeft volgens normen die in het maatschappelijk verkeer als aanvaardbaar worden beschouwd een
      zodanig inzicht dat een verantwoord oordeel kan worden gevormd omtrent het vermogen en het resultaat alsmede, voor
      zover de aard van een jaarrekening dat toelaat, omtrent de solvabiliteit en de liquiditeit van de vennootschap.

      5 [Artikel 15, derde lid][ref1], vindt overeenkomstige toepassing op de opgemaakte en goedgekeurde jaarrekening en
      de daarbij behorende stukken.

      6 Iedere aandeelhouder en iedere houder van schuldbrieven aan toonder heeft gedurende twee jaren na het tijdstip
      van opmaken, onderscheidenlijk goedkeuren van de jaarrekening recht op inzage in de krachtens het vijfde lid
      bewaarde stukken.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel15
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '15'
  - number: '117'
    text: |-
      1 De algemene vergadering of een ander daartoe bij de statuten aangewezen orgaan is bevoegd om een externe
      deskundige te benoemen ten einde op de boekhouding regelmatig toezicht te houden, alsmede aan de algemene
      vergadering verslag uit te brengen omtrent de door het bestuur opgemaakte jaarrekening.

      2 De deskundige is gerechtigd tot inzage van alle boeken, bescheiden en andere gegevensdragers van de vennootschap,
      waarvan de kennisneming tot richtige vervulling van zijn taak nodig is. Het is hem verboden hetgeen hem nopens de
      zaken der vennootschap blijkt of medegedeeld wordt, verder bekend te maken dan zijn opdracht met zich brengt.

      3 De deskundige brengt zijn verslag ook ter kennis van het bestuur, de raad van commissarissen en het orgaan dat
      hem heeft benoemd.
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel117
  - number: '118'
    text: |-
      1 In onmiddellijke samenhang met de goedkeuring van de jaarrekening, beslist de algemene vergadering of een ander
      bij de statuten aangewezen orgaan over de uitkering of inhouding van de uit die jaarrekening blijkende winst en
      over het doen van andere uitkeringen ten laste van het uit die jaarrekening blijkende eigen vermogen.

      2 De algemene vergadering of een ander bij de statuten aangewezen orgaan kan besluiten tot het doen van
      tussentijdse uitkeringen ten laste van een lopend boekjaar of ten laste van een afgesloten boekjaar, waarvan de
      jaarrekening nog niet is goedgekeurd.

      3 Voor zover de statuten niet anders bepalen geeft ieder aandeel bij iedere uitkering recht op een gelijk bedrag en
      geeft ieder onderaandeel recht op de dienovereenkomstige fractie van dat bedrag. De statuten kunnen bepalen dat de
      aandelen die de vennootschap zelf houdt meetellen bij de berekening van de verdeling van uitkeringen. De statuten
      kunnen de verdeling van uitkeringen geheel of gedeeltelijk overlaten aan een daartoe aangewezen orgaan.

      4 Het recht op uitkering vervalt door een tijdsverloop van drie jaren na het einde van de dag, waarop hetzij
      daaraan voldoende bekendheid is gegeven, hetzij de uitkeringsgerechtigde daarvan kennis heeft genomen of daarvan
      is verwittigd. Bij de statuten kan worden bepaald dat het recht op uitkering niet vervalt of een langere termijn
      worden gesteld.

      5 Uitkeringen aan aandeelhouders en andere uitkeringsgerechtigden mogen niet worden gedaan indien het eigen
      vermogen van de vennootschap negatief is of door die uitkering negatief zou worden. Een besluit tot het doen van
      een zodanige uitkering heeft geen enkele rechtskracht. [Artikel 22, tweede lid][ref1], vindt geen toepassing,
      tenzij de uitkering is gedaan aan de regelmatige opvolgend houder van een toonderbewijs, dan wel van een aandeel of
      daarmee verbonden recht dat op een beurs verhandeld wordt.

      6 Een uitkering als bedoeld in dit artikel wordt vermoed te zijn gedaan in strijd met de eerste zin van het vijfde
      lid, indien de jaarrekening van het boekjaar ten laste waarvan de uitkering wordt gedaan, met inachtneming van die
      uitkering een eigen vermogen toont dat negatief is. Betreft het een uitkering als bedoeld in het eerste lid dan is
      het vermoeden onweerlegbaar.

      7 Heeft de vennootschap een nominaal kapitaal dan wordt bij de toepassing van het vijfde lid het bedrag daarvan als
      ondergrens in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel22
    url: https://wetten.overheid.nl/BWBR0028744/2020-07-08#Artikel118
