regulatory_layer: WET
publication_date: '2005-09-20'
valid_from: '1999-07-24'
bwb_id: BWBR0010352
url: https://wetten.overheid.nl/BWBR0010352/1999-07-24
preamble:
  text: 'Besluit:'
  url: https://wetten.overheid.nl/BWBR0010352/1999-07-24#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      De secretaris-generaal is, tenzij bij wettelijk voorschrift anders is bepaald of de aard van de bevoegdheid zich
      daartegen verzet, bevoegd namens de minister of de staatssecretaris besluiten te nemen, stukken af te doen en
      uitgaande brieven te ondertekenen.
    url: https://wetten.overheid.nl/BWBR0010352/1999-07-24#Artikel1
  - number: '1.2'
    text: Bij verhindering van de secretaris-generaal is de plaatsvervangend secretaris-generaal bevoegd.
    url: https://wetten.overheid.nl/BWBR0010352/1999-07-24#Artikel1
  - number: '1.3'
    text: |-
      De secretaris-generaal kan de bevoegdheid bedoeld in het eerste lid doen uitoefenen door onder hem ressorterende
      ambtenaren, voorzover deze niet ressorteren onder een directeur-generaal.
    url: https://wetten.overheid.nl/BWBR0010352/1999-07-24#Artikel1
  - number: '2.1'
    text: |-
      De directeuren-generaal en de plaatsvervangend secretaris-generaal zijn, tenzij bij wettelijk voorschrift anders
      is bepaald of de aard van de bevoegdheid zich daartegen verzet, bevoegd namens de minister of de staatssecretaris
      besluiten te nemen, stukken af te doen en uitgaande brieven te ondertekenen.
    url: https://wetten.overheid.nl/BWBR0010352/1999-07-24#Artikel2
  - number: '2.2'
    text: De bevoegdheid van de directeuren-generaal betreft de aangelegenheden die hun directoraten-generaal betreffen.
    url: https://wetten.overheid.nl/BWBR0010352/1999-07-24#Artikel2
  - number: '2.3'
    text: Bij verhindering van de directeuren-generaal is de plaatsvervangend directeur-generaal bevoegd.
    url: https://wetten.overheid.nl/BWBR0010352/1999-07-24#Artikel2
  - number: '2.4'
    text: |-
      De bevoegdheid van de plaatsvervangend secretaris-generaal betreft de Centrale Directies, de Directie Personeel en
      Organisatie, de Directie Informatievoorziening en Algemene Zaken, de Departementale Accountantsdienst Financiën en
      de Directie en dienst der Domeinen.
    url: https://wetten.overheid.nl/BWBR0010352/1999-07-24#Artikel2
  - number: '2.5'
    text: |-
      De directeuren-generaal en de plaatsvervangend secretaris-generaal kunnen de bevoegdheid bedoeld in het eerste en
      tweede lid doen uitoefenen door onder hen ressorterende ambtenaren.
    url: https://wetten.overheid.nl/BWBR0010352/1999-07-24#Artikel2
  - number: '3.1'
    text: |-
      Aan de minister en de staatssecretaris is in ieder geval voorbehouden de afdoening en ondertekening van stukken
      bestemd voor:
    url: https://wetten.overheid.nl/BWBR0010352/1999-07-24#Artikel3
  - number: 3.1.a
    text: de Koningin;
    url: https://wetten.overheid.nl/BWBR0010352/1999-07-24#Artikel3
  - number: 3.1.b
    text: de ministerraad en de daaruit gevormde onderraad of commissie;
    url: https://wetten.overheid.nl/BWBR0010352/1999-07-24#Artikel3
  - number: 3.1.c
    text: |-
      de voorzitters van de Eerste en Tweede Kamer der Staten-Generaal en de voorzitters van de uit die kamers gevormde
      commissies;
    url: https://wetten.overheid.nl/BWBR0010352/1999-07-24#Artikel3
  - number: 3.1.d
    text: de Raad en State;
    url: https://wetten.overheid.nl/BWBR0010352/1999-07-24#Artikel3
  - number: 3.1.e
    text: de Algemene Rekenkamer.
    url: https://wetten.overheid.nl/BWBR0010352/1999-07-24#Artikel3
  - number: '3.2'
    text: |-
      Ten aanzien van de in het eerste lid, onder d genoemde college geldt het in de aanhef van het eerste lid gestelde
      niet voor zover het gaat om administratiefrechtelijke procedures.
    url: https://wetten.overheid.nl/BWBR0010352/1999-07-24#Artikel3
  - number: '3.3'
    text: |-
      In bijzondere gevallen kan voorts voor bepaalde aangelegenheden aan de secretaris-generaal en de plaatsvervangend
      secretaris-generaal de bevoegdheid worden verleend de in het eerste lid bedoelde stukken af te doen of te
      ondertekenen.
    url: https://wetten.overheid.nl/BWBR0010352/1999-07-24#Artikel3
  - number: '4'
    text: |-
      Bij de uitoefening van de bevoegdheden als bedoeld in de [artikelen 1][ref1] en [2][ref2] worden de Regeling
      personeelsmandaat Ministerie van Financiën, de Uitvoeringsregeling Wob Financiën, het Besluit Financieel Beheer
      Financiën, alsmede andere regelingen die voor een specifiek terrein bepalingen omtrent de uitoefening van
      bevoegdheden bevatten, in acht genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0010352#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0010352#Artikel2
    url: https://wetten.overheid.nl/BWBR0010352/1999-07-24#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0010352
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0010352
        artikel: '2'
  - number: '5'
    text: |-
      De ondertekening van uitgaande stukken zal luiden als volgt: DE MINISTER danwel DE STAATSSECRETARIS VAN FINANCIËN,
      Namens deze, gevolgd door de aanduiding van de functionaris.
    url: https://wetten.overheid.nl/BWBR0010352/1999-07-24#Artikel5
  - number: '6.1'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0010352/1999-07-24#Artikel6
  - number: '6.2'
    text: |-
      Het besluit van 13 juli 1981, nummer 181-2343 en het besluit van 13 juli 1981, nummer 181-2344, worden met ingang
      van 1 april 1999 ingetrokken.
    url: https://wetten.overheid.nl/BWBR0010352/1999-07-24#Artikel6
  - number: '7'
    text: Dit besluit wordt bekendgemaakt door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0010352/1999-07-24#Artikel7
  - number: '8'
    text: 'Dit besluit wordt aangehaald als: Regeling tekeningsbevoegdheid Ministerie van Financiën 1999.'
    url: https://wetten.overheid.nl/BWBR0010352/1999-07-24#Artikel8
