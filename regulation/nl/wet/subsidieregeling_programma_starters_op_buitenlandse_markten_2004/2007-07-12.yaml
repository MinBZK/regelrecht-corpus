  - number: '13'
    text: |-
      De minister geeft de beschikking tot subsidievaststelling binnen dertien weken na ontvangst van de aanvraag daartoe
      dan wel nadat de voor het indienen ervan geldende termijn is verstreken.
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel13
  - number: '14'
    text: |-
      De [Subsidieregeling programma starters op buitenlandse markten 2003][ref1] wordt ingetrokken, met dien verstande
      dat

      a. zij van toepassing blijft op aanvragen om subsidie die zijn ingediend voor de datum van inwerkingtreding van
      deze regeling, en op subsidies die voor die datum zijn verstrekt;

      b. het subsidieplafond voor 2004 voor de [Subsidieregeling programma starters op buitenlandse markten 2003][ref2]
      ten aanzien van de aanvragen die zijn ingediend voor de datum van inwerkingtreding van deze regeling wordt verhoogd
      tot € 6.150.200.


