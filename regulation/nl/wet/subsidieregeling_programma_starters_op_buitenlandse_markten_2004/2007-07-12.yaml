  - number: '3'
    text: |-
      1 De subsidie bedraagt 50 procent van de rechtstreeks aan de in het internationaliseringsplan genoemde activiteiten
      toe te rekenen, na de indiening van de aanvraag door de subsidie-ontvanger gemaakte en betaalde kosten, maar niet
      meer dan € 11.500.

      2 Het bedrag van de subsidie wordt verlaagd voor zover dit tezamen met in de drie voorafgaande jaren door een
      bestuursorgaan aan de aanvrager verstrekte subsidie waarvoor geen goedkeuring van de Commissie van de Europese
      Gemeenschappen was verkregen, meer bedraagt dan € 200.000 dan wel, indien het een onderneming in het wegvervoer
      betreft, € 100.000.
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel3
  - number: '4'
    text: |-
      1 Als kosten van een marktverkenning worden uitsluitend in aanmerking genomen de kosten die aan de subsidie-
      ontvanger in rekening worden gebracht door een organisatie die deskundig en ervaren is op het gebied van
      marktonderzoek.

      2 Als kosten van partnerselectie worden uitsluitend in aanmerking genomen de kosten die aan de subsidie-ontvanger
      in rekening worden gebracht door een organisatie, reis- en verblijfkosten van de subsidie-ontvanger daaronder niet
      begrepen.

      3 Als kosten van productpresentatie worden uitsluitend in aanmerking genomen de kosten voor de huur van de
      benodigde ruimte, de kosten van de huur, transport, opbouw en inrichting (door derden) van de stand, de huur van
      audiovisuele middelen en kosten van buitenlandse promotie, waaronder begrepen kosten van een bureau of organisatie
      in verband met vooronderzoek en andere promotieactiviteiten, zoals het samenstellen en vertalen van persartikelen.

      4 Als kosten van presentatiemateriaal worden uitsluitend in aanmerking genomen de kosten van schriftelijke,
      digitale en/of audiovisuele product- en/of bedrijfsinformatie die aan de subsidie-ontvanger in rekening worden
      gebracht.

      5 Als kosten van het vergroten van kennis en kunde op het gebied van internationaal ondernemen worden uitsluitend
      in aanmerking genomen:

      a. de kosten van opleidingen, cursussen, workshops, seminars, trainingen en dergelijke die relevant zijn voor het
      internationaal ondernemen en, indien van toepassing, het in het kader daarvan behalen van een diploma;

      b. de door de ondernemer betaalde reis- en verblijfkosten, gemaakt door stagiairs als bedoeld in
      [artikel 1, onderdeel j][ref1], alsmede, indien het stages betreft van drie maanden of langer, de contractueel
      vastgelegde stagevergoedingen;

      c. de kosten voor de tijdelijke inhuur van één of meer op het terrein van internationaal ondernemen ervaren
      interim-managers voor zover die kosten direct verband houden met de ondersteuning van de uitvoering van het
      internationaliseringsplan.

      6 Als kosten van het inwinnen van juridisch advies worden uitsluitend in aanmerking genomen de kosten die in
      rekening worden gebracht door een in internationale handel gespecialiseerde juridische adviseur.

      7 Als kosten van het aanvragen van één of meer octrooien, merk- of modelregistraties worden uitsluitend in
      aanmerking genomen de kosten verbonden aan de indiening van die aanvragen, waaronder begrepen de diensten van een
      octrooi-, merk- en/of modelgemachtigde, indieningstaksen en dergelijke, alsmede kosten voor vertaling.


      [ref1]: https://wetten.overheid.nl/BWBR0017396#Artikel1
