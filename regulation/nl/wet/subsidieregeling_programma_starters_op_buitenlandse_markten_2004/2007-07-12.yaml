  - number: '5'
    text: |-
      1 Ieder begrotingsjaar wordt bij ministeriële regeling een subsidieplafond vastgesteld voor het in dat jaar
      verlenen van subsidies op grond van deze regeling.

      2 Het subsidieplafond voor het in 2004 verlenen van subsidies bedraagt € 2.130.000.
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel5
  - number: '6'
    text: |-
      1 Een aanvraag om subsidie wordt ingediend met gebruikmaking van een formulier, overeenkomstig het model dat is
      opgenomen in de bij deze regeling behorende [bijlage 1][ref1].

      2 De aanvraag gaat vergezeld van een internationaliseringsplan overeenkomstig het model dat is opgenomen in de bij
      deze regeling behorende [bijlage 2][ref2] en een begroting voor de activiteiten, opgenomen in het plan, alsmede van
      andere bescheiden overeenkomstig hetgeen in het formulier is vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0017396
      [ref2]: https://wetten.overheid.nl/BWBR0017396
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0017396
      - id: ref2
        bwb_id: BWBR0017396
  - number: '7'
    text: De minister geeft een beschikking binnen dertien weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel7
  - number: '8'
    text: |-
      De minister beslist in ieder geval afwijzend op een aanvraag indien:

      a. de aanvraag niet voldoet aan deze regeling;

      b. de aanvrager op het tijdstip van indiening van de aanvraag meer dan 100 werknemers in dienst heeft;

      c. de aanvrager in de twaalf maanden voorafgaand aan de datum van indiening van de aanvraag meer dan 30 procent
      van zijn omzet uit exportactiviteiten behaalde, tenzij de aanvrager in die periode een omzet van niet meer dan
      € 100.000 heeft behaald.

      d. door toekenning het totaal van de ten laste van hetzelfde subsidieplafond verstrekte subsidies, per aanvraag
      vermeerderd met € 2.700, meer zou komen te bedragen dan het betrokken subsidieplafond.
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel8
  - number: '9'
    text: |-
      De minister verdeelt het beschikbare bedrag in de volgorde van ontvangst van de aanvragen, met dien verstande
      dat, indien een aanvrager niet heeft voldaan aan enig wettelijk voorschrift voor het in behandeling nemen van de
      aanvraag en met toepassing van [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad
      de aanvraag aan te vullen, de dag waarop de aanvraag voldoet aan de wettelijke voorschriften met betrekking tot de
      verdeling als datum van ontvangst geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:5
  - number: '10'
    text: |-
      1 De subsidie-ontvanger voert de activiteiten uit overeenkomstig het internationaliseringsplan waarop de
      subsidieverlening betrekking heeft en voltooit deze binnen 18 maanden na de subsidieverlening, behoudens
      voorafgaande schriftelijke ontheffing van de minister voor het vertragen, essentieel wijzigen, of stopzetten van de
      uitvoering van de activiteiten.

      2 Aan een ontheffing als bedoeld in het eerste lid kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel10
  - number: '11'
    text: |-
      1 De subsidie-ontvanger voert een administratie die zodanig is ingericht, dat daaruit te allen tijde op eenvoudige
      en duidelijke wijze alle aan de activiteiten toe te rekenen kosten kunnen worden afgelezen.

      2 De subsidie-ontvanger doet onverwijld mededeling aan de minister van de indiening bij de rechtbank van een
      verzoek tot het op hem van toepassing verklaren van de schuldsaneringsregeling natuurlijke personen, tot verlening
      van surseance van betaling aan hem of tot faillietverklaring van hem.
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel11
  - number: '12'
    text: |-
      1 De subsidie-ontvanger dient zijn aanvraag om subsidievaststelling in binnen dertien weken na het tijdstip waarop
      de activiteiten ingevolge [artikel 10, eerste lid][ref1], moeten zijn voltooid.

      2 De aanvraag wordt ingediend met gebruikmaking van een formulier, overeenkomstig het model dat is opgenomen in de
      bij deze regeling behorende [bijlage 3][ref2].

      3 De aanvraag gaat, overeenkomstig hetgeen in het formulier is vermeld, vergezeld van:

      a. afschriften van de op de activiteiten betrekking hebbende, aan de subsidie-ontvanger verstrekte, facturen en de
      desbetreffende betalingsbewijzen,

      b. een eindverslag omtrent de uitvoering en de resultaten van de activiteiten,

      c. overige in het formulier genoemde bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0017396#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0017396
