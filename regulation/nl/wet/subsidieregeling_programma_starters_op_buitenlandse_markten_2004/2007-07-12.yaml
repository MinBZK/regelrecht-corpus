preamble:
  text: |-
    Gelet op artikel 3 van de Kaderwet EZ-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. minister: de Minister van Economische Zaken;

      b. ondernemer: een natuurlijke persoon of rechtspersoon, niet zijnde een rechtspersoon die krachtens publiekrecht
      is ingesteld, die een onderneming in stand houdt;

      c. ondernemersorganisatie: een stichting of vereniging met volledige rechtsbevoegdheid die, blijkens haar statuten,
      tot doel heeft de belangen te behartigen van ondernemingen of organisaties van ondernemingen, die een afdeling in
      haar bureauorganisatie heeft functioneren welke zich bezighoudt met internationaal ondernemen binnen de bedoelde
      ondernemingen en die in het kader van de uitvoering van deze regeling een overeenkomst met de minister heeft
      gesloten;

      d. internationaliseringsplan: een plan van aanpak dat is opgesteld door de ondernemer in samenwerking met een
      ondernemersorganisatie, Syntens of een consulent internationale handel van een kamer van koophandel en fabrieken,
      en dat is gericht op de oriëntatie op of het voor eigen rekening en risico bewerken van een buitenlandse markt
      vanuit Nederland, en dat een inventarisatie bevat van de sterke en zwakke kanten, kansen en bedreigingen van de
      onderneming op gebied van export en direct daaraan gerelateerde activiteiten in het buitenland en aangeeft welke
      activiteiten zullen worden uitgevoerd om de doelstellingen in het plan op die buitenlandse markt te realiseren,
      bestaande uit:

      1°. marktverkenning,

      2°. partnerselectie,

      3°. productpresentatie,

      4°. het ontwikkelen en produceren van presentatiemateriaal,

      5°. het vergroten van kennis en kunde op het gebied van internationaal ondernemen,

      6°. het inwinnen van juridisch advies of

      7°. het aanvragen van één of meer internationale octrooien , merk- of modelregistraties;

      e. doelland: land waarop het internationaliseringsplan gericht is;

      f. marktverkenning: een schriftelijk verslag over de mogelijkheden van ondernemen op een markt in het buitenland,
      opgesteld door een organisatie die deskundig en ervaren is op het gebied van marktonderzoek;

      g. partnerselectie: het ten behoeve van de ondernemer selecteren van en het leggen van contacten door een
      organisatie die deskundig en ervaren is op het gebied van marktonderzoek;

      h. productpresentatie: de presentatie van een onderneming of product op buitenlandse of internationale beurzen,
      congressen, symposia, exposities en dergelijke evenementen;

      i. presentatiemateriaal: schriftelijke, digitale en/of audiovisuele product- en/of bedrijfsinformatie;

      j. vergroten van kennis en kunde op gebied van internationaal ondernemen: het volgen door de ondernemer of een
      van zijn vaste medewerkers van opleidingen, cursussen, workshops, seminars, trainingen en dergelijke, die relevant
      zijn voor het internationaal ondernemen en waarvan de kwaliteit gewaarborgd is, danwel het met instemming van
      de desbetreffende onderwijsinstelling contracteren door het bedrijf van één of meer studenten, die een opleiding
      op het gebied van internationaal ondernemen volgen bij een instelling voor middelbaar beroepsonderwijs, hoger
      beroepsonderwijs of universitair onderwijs, voor een stage van tenminste drie maanden die gericht is op één of meer
      onderzoeksopdrachten ten behoeve van de uitvoering van het internationaliseringsplan of, indien de stageduur korter
      is dan drie maanden, voor een doelgerichte stageopdracht, zoals veldonderzoek ten behoeve van de internationale
      oriëntatie van de onderneming in het doelland, danwel de tijdelijke inhuur van één of meer op het terrein van
      internationaal ondernemen ervaren interim-managers ten behoeve van de uitvoering van het internationaliseringsplan;

      k. inwinnen van juridisch advies: het inwinnen door de ondernemer van een handelsgerelateerd specialistisch
      juridisch advies;

      l. aanvragen van één of meer octrooien, merk- of modelregistraties: het met behulp van een octrooi-, merk- of
      modelgemachtigde indienen van één of meer octrooiaanvragen dan wel aanvragen voor merk- of modelregistraties ten
      behoeve van de merk- of modelbescherming in het doelland;
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel1
  - number: '2'
    text: |-
      1 De minister verstrekt op aanvraag een subsidie aan een ondernemer die voor eigen rekening en risico één of meer
      activiteiten als bedoeld in [artikel 1, onder d][ref1], uitvoert.

      2 De subsidie wordt slechts verstrekt indien de ondernemer gedurende de 12 maanden voorafgaand aan de aanvraag om
      subsidie ten hoogste 3% van zijn totale fiscale omzet in het betreffende doelland heeft gerealiseerd, tenzij

      a. indien de totale fiscale omzet in het betreffende doelland meer is dan 3% van zijn totale fiscale omzet, die
      omzet met niet meer dan drie afnemers is gerealiseerd; danwel

      b. de ondernemer aannemelijk maakt dat activiteiten ter zake van marktverkenning, partnerselectie, juridisch advies
      of het aanvragen van octrooien, merk- of modelregistraties in redelijkheid noodzakelijk zijn voor zijn toegang tot
      een regio binnen dat doelland, waarin hij nog niet actief is.

      3 Geen subsidie wordt verstrekt:

      a. indien voor de activiteiten, genoemd in het internationaliseringsplan, reeds door een bestuursorgaan of de
      Commissie van de Europese Gemeenschappen subsidie is verstrekt;

      b. voor zover de aanvrager vóór het indienen van de aanvraag ter zake van de in het internationaliseringsplan
      genoemde activiteiten reeds verplichtingen is aangegaan, tenzij de minister daarvoor toestemming heeft gegeven;

      c. indien aan de aanvrager op grond van deze regeling of de
      [Subsidieregeling programma starters op buitenlandse markten 2003][ref2] reeds subsidie is verleend voor
      activiteiten in hetzelfde doelland;

      d. indien een eerder aan de aanvrager op grond van één van de in onderdeel c genoemde regelingen verleende subsidie
      nog niet is vastgesteld;

      e. aan een aanvrager die een onderneming in stand houdt als bedoeld in artikel 1, onderdelen a, b, c, f en h, van
      de Verordening (EG) nr. 1998/2006 van de Commissie van de Europese Gemeenschappen van 15 december 2006 (Pb EU L
      379) betreffende de toepassing van de artikelen 87 en 88 van het Verdrag op de-minimissteun;

      f. indien, door een of meer bestuursorganen, aan de aanvrager over een periode van drie belastingjaren reeds
      € 200.000 of meer – dan wel, indien het een onderneming in het wegvervoer betreft: € 100.000 of meer – subsidie is
      verstrekt zonder goedkeuring van de Commissie van de Europese Gemeenschappen;

      g. indien de organisatie, die overeenkomstig [artikel 1, onderdeel d][ref3], meewerkte bij de opstelling van het
      internationaliseringsplan, tevens is betrokken bij de uitvoering van de in dat plan genoemde activiteiten.

      4 Indien aan de aanvrager reeds subsidie is verleend op grond van één van de in het derde lid, onderdeel c,
      genoemde regelingen, kan in afwijking van het derde lid, onderdeel c, ten hoogste eenmaal een nieuwe subsidie
      worden verleend voor activiteiten in hetzelfde doelland, indien de ondernemer aannemelijk maakt dat activiteiten
      ter zake van marktverkenning, partnerselectie, juridisch advies of het aanvragen van octrooien, merk- of
      modelregistraties in redelijkheid noodzakelijk zijn voor zijn toegang tot een regio binnen dat doelland, waarin hij
      nog niet actief is.

      5 In de gevallen genoemd in het tweede lid, onderdeel b en het vierde lid, wordt slechts subsidie verstrekt voor de
      uitvoering van uitsluitend de activiteiten marktverkenning, partnerselectie, juridisch advies of het aanvragen van
      octrooien, merk- of modelregistraties.


