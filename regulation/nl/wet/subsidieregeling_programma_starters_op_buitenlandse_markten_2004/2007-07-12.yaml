---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: subsidieregeling_programma_starters_op_buitenlandse_markten_2004
regulatory_layer: WET
publication_date: '2008-12-23'
valid_from: '2007-07-12'
bwb_id: BWBR0017396
url: https://wetten.overheid.nl/BWBR0017396/2007-07-12
preamble:
  text: |-
    Gelet op artikel 3 van de Kaderwet EZ-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel1
  - number: 1.a
    text: 'minister: de Minister van Economische Zaken;'
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel1
  - number: 1.b
    text: |-
      ondernemer: een natuurlijke persoon of rechtspersoon, niet zijnde een rechtspersoon die krachtens publiekrecht is
      ingesteld, die een onderneming in stand houdt;
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel1
  - number: 1.c
    text: |-
      ondernemersorganisatie: een stichting of vereniging met volledige rechtsbevoegdheid die, blijkens haar statuten,
      tot doel heeft de belangen te behartigen van ondernemingen of organisaties van ondernemingen, die een afdeling in
      haar bureauorganisatie heeft functioneren welke zich bezighoudt met internationaal ondernemen binnen de bedoelde
      ondernemingen en die in het kader van de uitvoering van deze regeling een overeenkomst met de minister heeft
      gesloten;
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel1
  - number: 1.d
    text: |-
      internationaliseringsplan: een plan van aanpak dat is opgesteld door de ondernemer in samenwerking met een
      ondernemersorganisatie, Syntens of een consulent internationale handel van een kamer van koophandel en fabrieken,
      en dat is gericht op de oriëntatie op of het voor eigen rekening en risico bewerken van een buitenlandse markt
      vanuit Nederland, en dat een inventarisatie bevat van de sterke en zwakke kanten, kansen en bedreigingen van de
      onderneming op gebied van export en direct daaraan gerelateerde activiteiten in het buitenland en aangeeft welke
      activiteiten zullen worden uitgevoerd om de doelstellingen in het plan op die buitenlandse markt te realiseren,
      bestaande uit:
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel1
  - number: 1.d.1°
    text: marktverkenning,
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel1
  - number: 1.d.2°
    text: partnerselectie,
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel1
  - number: 1.d.3°
    text: productpresentatie,
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel1
  - number: 1.d.4°
    text: het ontwikkelen en produceren van presentatiemateriaal,
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel1
  - number: 1.d.5°
    text: het vergroten van kennis en kunde op het gebied van internationaal ondernemen,
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel1
  - number: 1.d.6°
    text: het inwinnen van juridisch advies of
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel1
  - number: 1.d.7°
    text: het aanvragen van één of meer internationale octrooien , merk- of modelregistraties;
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel1
  - number: 1.e
    text: 'doelland: land waarop het internationaliseringsplan gericht is;'
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel1
  - number: 1.f
    text: |-
      marktverkenning: een schriftelijk verslag over de mogelijkheden van ondernemen op een markt in het buitenland,
      opgesteld door een organisatie die deskundig en ervaren is op het gebied van marktonderzoek;
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel1
  - number: 1.g
    text: |-
      partnerselectie: het ten behoeve van de ondernemer selecteren van en het leggen van contacten door een organisatie
      die deskundig en ervaren is op het gebied van marktonderzoek;
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel1
  - number: 1.h
    text: |-
      productpresentatie: de presentatie van een onderneming of product op buitenlandse of internationale beurzen,
      congressen, symposia, exposities en dergelijke evenementen;
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel1
  - number: 1.i
    text: 'presentatiemateriaal: schriftelijke, digitale en/of audiovisuele product- en/of bedrijfsinformatie;'
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel1
  - number: 1.j
    text: |-
      vergroten van kennis en kunde op gebied van internationaal ondernemen: het volgen door de ondernemer of een van
      zijn vaste medewerkers van opleidingen, cursussen, workshops, seminars, trainingen en dergelijke, die relevant
      zijn voor het internationaal ondernemen en waarvan de kwaliteit gewaarborgd is, danwel het met instemming van
      de desbetreffende onderwijsinstelling contracteren door het bedrijf van één of meer studenten, die een opleiding
      op het gebied van internationaal ondernemen volgen bij een instelling voor middelbaar beroepsonderwijs, hoger
      beroepsonderwijs of universitair onderwijs, voor een stage van tenminste drie maanden die gericht is op één of meer
      onderzoeksopdrachten ten behoeve van de uitvoering van het internationaliseringsplan of, indien de stageduur korter
      is dan drie maanden, voor een doelgerichte stageopdracht, zoals veldonderzoek ten behoeve van de internationale
      oriëntatie van de onderneming in het doelland, danwel de tijdelijke inhuur van één of meer op het terrein van
      internationaal ondernemen ervaren interim-managers ten behoeve van de uitvoering van het internationaliseringsplan;
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel1
  - number: 1.k
    text: |-
      inwinnen van juridisch advies: het inwinnen door de ondernemer van een handelsgerelateerd specialistisch juridisch
      advies;
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel1
  - number: 1.l
    text: |-
      aanvragen van één of meer octrooien, merk- of modelregistraties: het met behulp van een octrooi-, merk- of
      modelgemachtigde indienen van één of meer octrooiaanvragen dan wel aanvragen voor merk- of modelregistraties ten
      behoeve van de merk- of modelbescherming in het doelland;
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel1
  - number: '2.1'
    text: |-
      De minister verstrekt op aanvraag een subsidie aan een ondernemer die voor eigen rekening en risico één of meer
      activiteiten als bedoeld in [artikel 1, onder d][ref1], uitvoert.


      [ref1]: https://wetten.overheid.nl/BWBR0017396#Artikel1
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0017396
        artikel: '1'
        paragraaf: '1'
  - number: '2.2'
    text: |-
      De subsidie wordt slechts verstrekt indien de ondernemer gedurende de 12 maanden voorafgaand aan de aanvraag om
      subsidie ten hoogste 3% van zijn totale fiscale omzet in het betreffende doelland heeft gerealiseerd, tenzij
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel2
  - number: 2.2.a
    text: |-
      indien de totale fiscale omzet in het betreffende doelland meer is dan 3% van zijn totale fiscale omzet, die omzet
      met niet meer dan drie afnemers is gerealiseerd; danwel
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel2
  - number: 2.2.b
    text: |-
      de ondernemer aannemelijk maakt dat activiteiten ter zake van marktverkenning, partnerselectie, juridisch advies of
      het aanvragen van octrooien, merk- of modelregistraties in redelijkheid noodzakelijk zijn voor zijn toegang tot een
      regio binnen dat doelland, waarin hij nog niet actief is.
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel2
  - number: '2.3'
    text: 'Geen subsidie wordt verstrekt:'
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel2
  - number: 2.3.a
    text: |-
      indien voor de activiteiten, genoemd in het internationaliseringsplan, reeds door een bestuursorgaan of de
      Commissie van de Europese Gemeenschappen subsidie is verstrekt;
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel2
  - number: 2.3.b
    text: |-
      voor zover de aanvrager vóór het indienen van de aanvraag ter zake van de in het internationaliseringsplan genoemde
      activiteiten reeds verplichtingen is aangegaan, tenzij de minister daarvoor toestemming heeft gegeven;
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel2
  - number: 2.3.c
    text: |-
      indien aan de aanvrager op grond van deze regeling of de
      [Subsidieregeling programma starters op buitenlandse markten 2003][ref1] reeds subsidie is verleend voor
      activiteiten in hetzelfde doelland;


      [ref1]: https://wetten.overheid.nl/BWBR0014457
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0014457
  - number: 2.3.d
    text: |-
      indien een eerder aan de aanvrager op grond van één van de in onderdeel c genoemde regelingen verleende subsidie
      nog niet is vastgesteld;
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel2
  - number: 2.3.e
    text: |-
      aan een aanvrager die een onderneming in stand houdt als bedoeld in artikel 1, onderdelen a, b, c, f en h, van de
      Verordening (EG) nr. 1998/2006 van de Commissie van de Europese Gemeenschappen van 15 december 2006 (Pb EU L 379)
      betreffende de toepassing van de artikelen 87 en 88 van het Verdrag op de-minimissteun;
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel2
  - number: 2.3.f
    text: |-
      indien, door een of meer bestuursorganen, aan de aanvrager over een periode van drie belastingjaren reeds € 200.000
      of meer – dan wel, indien het een onderneming in het wegvervoer betreft: € 100.000 of meer – subsidie is verstrekt
      zonder goedkeuring van de Commissie van de Europese Gemeenschappen;
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel2
  - number: 2.3.g
    text: |-
      indien de organisatie, die overeenkomstig [artikel 1, onderdeel d][ref1], meewerkte bij de opstelling van het
      internationaliseringsplan, tevens is betrokken bij de uitvoering van de in dat plan genoemde activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0017396#Artikel1
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0017396
        artikel: '1'
        paragraaf: '1'
  - number: '2.4'
    text: |-
      Indien aan de aanvrager reeds subsidie is verleend op grond van één van de in het derde lid, onderdeel c, genoemde
      regelingen, kan in afwijking van het derde lid, onderdeel c, ten hoogste eenmaal een nieuwe subsidie worden
      verleend voor activiteiten in hetzelfde doelland, indien de ondernemer aannemelijk maakt dat activiteiten ter zake
      van marktverkenning, partnerselectie, juridisch advies of het aanvragen van octrooien, merk- of modelregistraties
      in redelijkheid noodzakelijk zijn voor zijn toegang tot een regio binnen dat doelland, waarin hij nog niet actief
      is.
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel2
  - number: '2.5'
    text: |-
      In de gevallen genoemd in het tweede lid, onderdeel b en het vierde lid, wordt slechts subsidie verstrekt voor de
      uitvoering van uitsluitend de activiteiten marktverkenning, partnerselectie, juridisch advies of het aanvragen van
      octrooien, merk- of modelregistraties.
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel2
  - number: '3.1'
    text: |-
      De subsidie bedraagt 50 procent van de rechtstreeks aan de in het internationaliseringsplan genoemde activiteiten
      toe te rekenen, na de indiening van de aanvraag door de subsidie-ontvanger gemaakte en betaalde kosten, maar niet
      meer dan € 11.500.
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel3
  - number: '3.2'
    text: |-
      Het bedrag van de subsidie wordt verlaagd voor zover dit tezamen met in de drie voorafgaande jaren door een
      bestuursorgaan aan de aanvrager verstrekte subsidie waarvoor geen goedkeuring van de Commissie van de Europese
      Gemeenschappen was verkregen, meer bedraagt dan € 200.000 dan wel, indien het een onderneming in het wegvervoer
      betreft, € 100.000.
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel3
  - number: '4.1'
    text: |-
      Als kosten van een marktverkenning worden uitsluitend in aanmerking genomen de kosten die aan de subsidie-ontvanger
      in rekening worden gebracht door een organisatie die deskundig en ervaren is op het gebied van marktonderzoek.
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel4
  - number: '4.2'
    text: |-
      Als kosten van partnerselectie worden uitsluitend in aanmerking genomen de kosten die aan de subsidie-ontvanger
      in rekening worden gebracht door een organisatie, reis- en verblijfkosten van de subsidie-ontvanger daaronder niet
      begrepen.
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel4
  - number: '4.3'
    text: |-
      Als kosten van productpresentatie worden uitsluitend in aanmerking genomen de kosten voor de huur van de benodigde
      ruimte, de kosten van de huur, transport, opbouw en inrichting (door derden) van de stand, de huur van audiovisuele
      middelen en kosten van buitenlandse promotie, waaronder begrepen kosten van een bureau of organisatie in verband
      met vooronderzoek en andere promotieactiviteiten, zoals het samenstellen en vertalen van persartikelen.
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel4
  - number: '4.4'
    text: |-
      Als kosten van presentatiemateriaal worden uitsluitend in aanmerking genomen de kosten van schriftelijke, digitale
      en/of audiovisuele product- en/of bedrijfsinformatie die aan de subsidie-ontvanger in rekening worden gebracht.
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel4
  - number: '4.5'
    text: |-
      Als kosten van het vergroten van kennis en kunde op het gebied van internationaal ondernemen worden uitsluitend in
      aanmerking genomen:
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel4
  - number: 4.5.a
    text: |-
      de kosten van opleidingen, cursussen, workshops, seminars, trainingen en dergelijke die relevant zijn voor het
      internationaal ondernemen en, indien van toepassing, het in het kader daarvan behalen van een diploma;
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel4
  - number: 4.5.b
    text: |-
      de door de ondernemer betaalde reis- en verblijfkosten, gemaakt door stagiairs als bedoeld in
      [artikel 1, onderdeel j][ref1], alsmede, indien het stages betreft van drie maanden of langer, de contractueel
      vastgelegde stagevergoedingen;


      [ref1]: https://wetten.overheid.nl/BWBR0017396#Artikel1
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0017396
        artikel: '1'
        paragraaf: '1'
  - number: 4.5.c
    text: |-
      de kosten voor de tijdelijke inhuur van één of meer op het terrein van internationaal ondernemen ervaren
      interim-managers voor zover die kosten direct verband houden met de ondersteuning van de uitvoering van het
      internationaliseringsplan.
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel4
  - number: '4.6'
    text: |-
      Als kosten van het inwinnen van juridisch advies worden uitsluitend in aanmerking genomen de kosten die in rekening
      worden gebracht door een in internationale handel gespecialiseerde juridische adviseur.
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel4
  - number: '4.7'
    text: |-
      Als kosten van het aanvragen van één of meer octrooien, merk- of modelregistraties worden uitsluitend in aanmerking
      genomen de kosten verbonden aan de indiening van die aanvragen, waaronder begrepen de diensten van een octrooi-,
      merk- en/of modelgemachtigde, indieningstaksen en dergelijke, alsmede kosten voor vertaling.
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel4
  - number: '5.1'
    text: |-
      Ieder begrotingsjaar wordt bij ministeriële regeling een subsidieplafond vastgesteld voor het in dat jaar verlenen
      van subsidies op grond van deze regeling.
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel5
  - number: '5.2'
    text: Het subsidieplafond voor het in 2004 verlenen van subsidies bedraagt € 2.130.000.
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel5
  - number: '6.1'
    text: |-
      Een aanvraag om subsidie wordt ingediend met gebruikmaking van een formulier, overeenkomstig het model dat is
      opgenomen in de bij deze regeling behorende [bijlage 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017396
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0017396
  - number: '6.2'
    text: |-
      De aanvraag gaat vergezeld van een internationaliseringsplan overeenkomstig het model dat is opgenomen in de bij
      deze regeling behorende [bijlage 2][ref1] en een begroting voor de activiteiten, opgenomen in het plan, alsmede van
      andere bescheiden overeenkomstig hetgeen in het formulier is vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0017396
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0017396
  - number: '7'
    text: De minister geeft een beschikking binnen dertien weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel7
  - number: '8'
    text: 'De minister beslist in ieder geval afwijzend op een aanvraag indien:'
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel8
  - number: 8.a
    text: de aanvraag niet voldoet aan deze regeling;
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel8
  - number: 8.b
    text: de aanvrager op het tijdstip van indiening van de aanvraag meer dan 100 werknemers in dienst heeft;
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel8
  - number: 8.c
    text: |-
      de aanvrager in de twaalf maanden voorafgaand aan de datum van indiening van de aanvraag meer dan 30 procent
      van zijn omzet uit exportactiviteiten behaalde, tenzij de aanvrager in die periode een omzet van niet meer dan
      € 100.000 heeft behaald.
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel8
  - number: 8.d
    text: |-
      door toekenning het totaal van de ten laste van hetzelfde subsidieplafond verstrekte subsidies, per aanvraag
      vermeerderd met € 2.700, meer zou komen te bedragen dan het betrokken subsidieplafond.
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel8
  - number: '9'
    text: |-
      De minister verdeelt het beschikbare bedrag in de volgorde van ontvangst van de aanvragen, met dien verstande
      dat, indien een aanvrager niet heeft voldaan aan enig wettelijk voorschrift voor het in behandeling nemen van de
      aanvraag en met toepassing van [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad
      de aanvraag aan te vullen, de dag waarop de aanvraag voldoet aan de wettelijke voorschriften met betrekking tot de
      verdeling als datum van ontvangst geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '10.1'
    text: |-
      De subsidie-ontvanger voert de activiteiten uit overeenkomstig het internationaliseringsplan waarop de
      subsidieverlening betrekking heeft en voltooit deze binnen 18 maanden na de subsidieverlening, behoudens
      voorafgaande schriftelijke ontheffing van de minister voor het vertragen, essentieel wijzigen, of stopzetten van de
      uitvoering van de activiteiten.
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel10
  - number: '10.2'
    text: Aan een ontheffing als bedoeld in het eerste lid kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel10
  - number: '11.1'
    text: |-
      De subsidie-ontvanger voert een administratie die zodanig is ingericht, dat daaruit te allen tijde op eenvoudige en
      duidelijke wijze alle aan de activiteiten toe te rekenen kosten kunnen worden afgelezen.
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel11
  - number: '11.2'
    text: |-
      De subsidie-ontvanger doet onverwijld mededeling aan de minister van de indiening bij de rechtbank van een verzoek
      tot het op hem van toepassing verklaren van de schuldsaneringsregeling natuurlijke personen, tot verlening van
      surseance van betaling aan hem of tot faillietverklaring van hem.
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel11
  - number: '12.1'
    text: |-
      De subsidie-ontvanger dient zijn aanvraag om subsidievaststelling in binnen dertien weken na het tijdstip waarop de
      activiteiten ingevolge [artikel 10, eerste lid][ref1], moeten zijn voltooid.


      [ref1]: https://wetten.overheid.nl/BWBR0017396#Artikel10
    url: https://wetten.overheid.nl/BWBR0017396/2007-07-12#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0017396
        artikel: '10'
        paragraaf: '3'
  - number: '12.2'
    text: |-
      De aanvraag wordt ingediend met gebruikmaking van een formulier, overeenkomstig het model dat is opgenomen in de
      bij deze regeling behorende [bijlage 3][ref1].


