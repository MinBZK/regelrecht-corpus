  - number: '16'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0009756/2015-01-01#Artikel16
  - number: '17'
    text: 'Deze wet wordt aangehaald als: Wet privatisering FVP.'
    url: https://wetten.overheid.nl/BWBR0009756/2015-01-01#Artikel17
