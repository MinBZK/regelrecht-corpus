  - number: '4'
    text: |-
      Archiefbescheiden van het fonds gaan met ingang van de datum waarop het besluit tot aanwijzing van de stichting
      in werking treedt over naar de stichting, voorzover zij niet overeenkomstig de [Archiefwet 1995][ref1] zijn
      overgebracht naar een archiefbewaarplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0009756/2015-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: '5'
    text: |-
      1 De Nederlandsche Bank houdt toezicht op de naleving door de stichting van alle voorschriften en verplichtingen
      die op grond van deze wet ten aanzien van de stichting gelden.

      2 De [artikelen 152][ref1], [153][ref2], [163 tot en met 166a van de Pensioenwet][ref3] zijn van overeenkomstige
      toepassing.

      3 De Nederlandsche Bank kan een aanwijzing geven aan het bestuur van de stichting indien:

      a. de statuten van de stichting niet voldoen aan [artikel 2, eerste en derde lid][ref4];

      b. de naleving door de stichting, bedoeld in het eerste lid, alsmede de gang van zaken bij de stichting haar,
      hetzij geheel, hetzij op bepaalde onderdelen, onbevredigend voorkomt.

      4 Het bestuur van de stichting volgt een aanwijzing als bedoeld in het derde lid, binnen de door de Nederlandsche
      Bank gestelde termijn op.

      5 Indien het bestuur van de stichting in gebreke blijft binnen de gestelde termijn gevolg te geven aan een
      aanwijzing als bedoeld in het derde lid, stelt de Nederlandsche Bank, voorzover de aanwijzing geen betrekking heeft
      op de wijze waarop de stichting het beheer over haar middelen voert, Onze Minister hiervan in kennis.

      6 Kennisgeving aan Onze Minister als bedoeld in het vijfde lid, vindt niet plaats alvorens de termijn voor het
      instellen van beroep tegen de aanwijzing, bedoeld in het derde lid, is verstreken, dan wel nadat op het ingestelde
      beroep definitief is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel152
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel153
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel163
      [ref4]: https://wetten.overheid.nl/BWBR0009756#Artikel2
    url: https://wetten.overheid.nl/BWBR0009756/2015-01-01#Artikel5
