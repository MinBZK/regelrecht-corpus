        artikel: '5'
  - number: '7'
    text: |-
      1 Het bestuur van de stichting legt aan de Nederlandsche Bank jaarlijks voor 1 juli een door een accountant
      als bedoeld in [artikel 393, lid 1, van Boek 2 van het Burgerlijk Wetboek][ref1] gecontroleerd verslag van het
      voorgaande boekjaar over, waarin een volledig beeld van de financiële toestand van de stichting wordt gegeven en
      waaruit ten genoegen van de Nederlandsche Bank blijkt dat aan deze wet wordt voldaan. Het boekjaar van de stichting
      loopt gelijk met het kalenderjaar.

      2 De Nederlandsche Bank kan aanwijzingen geven met betrekking tot de vorm en inhoud van het in het eerste lid
      bedoelde verslag.

      3 Het bestuur van de stichting verstrekt de Nederlandsche Bank een afschrift van haar statuten, stelt de
      Nederlandsche Bank in kennis van een voornemen tot wijziging van de statuten en verstrekt de Nederlandsche Bank
      onverwijld een authentiek gewaarmerkt afschrift van de notariële akte waarin een statutenwijziging is neergelegd.

      4 Indien het bestuur van de stichting ter nadere uitwerking van de doelstelling een reglement opstelt zendt het dit
      reglement, alsmede iedere wijziging hiervan, onverwijld ter kennisneming aan de Nederlandsche Bank.

      5 Het bestuur van de stichting verstrekt de Nederlandsche Bank voorts alle informatie die de Nederlandsche Bank
      voor de uitoefening van het toezicht noodzakelijk acht.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0009756/2015-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '8'
    text: |-
      1 Inlichtingen uit de basisregistratie personen en inlichtingen en uittreksels uit de registers van de burgerlijke
      stand, die met het oog op uitvoering van de doelstelling worden gevraagd, zijn vrij van leges.

      2 Indien de stichting voorziet in aanvullende pensioenvoorzieningen van werkloze werknemers, verlenen het
      Uitvoeringsinstituut werknemersverzekeringen en de pensioenuitvoerders waaraan bijdragen worden uitgekeerd,
      tegen een redelijke kostenvergoeding hun medewerking aan de uitvoering hiervan. Onder werkloze werknemer wordt
      verstaan de werknemer die werkloos is als bedoeld in [artikel 16 van de Werkloosheidswet][ref1] en als gevolg
      daarvan een door het Uitvoeringsinstituut werknemersverzekeringen vastgesteld recht op een uitkering op grond van
      [die wet][ref2] heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0009756/2015-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0004045
  - number: '9'
    text: |-
      De kosten verbonden aan:

      a. de administratieve werkzaamheden ten behoeve van de uitvoering van de doelstelling;

      b. het verlenen van medewerking als bedoeld in [artikel 8, tweede lid][ref1];

      c. het toezicht door de Nederlandsche Bank, bedoeld in [artikel 5, eerste lid][ref2];

      d. de door de Nederlandsche Bank te verrichten activiteiten of te nemen maatregelen die voortvloeien uit het
      toezicht;

      komen ten laste van de stichting.


      [ref1]: https://wetten.overheid.nl/BWBR0009756#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0009756#Artikel5
    url: https://wetten.overheid.nl/BWBR0009756/2015-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009756
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0009756
        artikel: '5'
  - number: '10'
    text: |-
      1 Het burgerservicenummer of, bij het ontbreken daarvan, het sociaal-fiscaalnummer kan door de stichting in
      een door haar beheerde persoonsregistratie worden opgenomen en bij het verstrekken van gegevens daaruit worden
      gebruikt.

      2 De stichting gebruikt dit burgerservicenummer of, bij het ontbreken daarvan, dit sociaal-fiscaalnummer
      uitsluitend:

      a. in het verkeer met de persoon op wie het nummer betrekking heeft;

      b. in contacten met personen en instanties voorzover deze zelf gemachtigd zijn tot het opnemen van het
      burgerservicenummer of, bij het ontbreken daarvan, het sociaal-fiscaalnummer in een persoonsregistratie.
    url: https://wetten.overheid.nl/BWBR0009756/2015-01-01#Artikel10
  - number: '11'
    text: |-
      In de statuten van de stichting wordt opgenomen dat een ieder die direct of indirect betrokken is bij de uitvoering
      van deze wet door de stichting en daarbij de beschikking krijgt over gegevens waarvan hij het vertrouwelijke
      karakter kent of redelijkerwijs moet vermoeden, en voor wie niet reeds uit hoofde van ambt, beroep of wettelijk
      voorschrift terzake van die gegevens een geheimhoudingsplicht geldt, verplicht is tot geheimhouding van die
      gegevens, behoudens voorzover enig wettelijk voorschrift hem tot mededeling verplicht of uit zijn taak de noodzaak
      tot mededeling voortvloeit.
    url: https://wetten.overheid.nl/BWBR0009756/2015-01-01#Artikel11
  - number: '12'
    text: |-
      Van burgerlijke rechtsvorderingen terzake van geschillen inzake het voorzien in aanvullende pensioenvoorzieningen
      door de stichting neemt de kantonrechter kennis.
    url: https://wetten.overheid.nl/BWBR0009756/2015-01-01#Artikel12
  - number: '14'
    text: |-
      Door personen tot de dag van inwerkingtreding van het besluit tot aanwijzing van de stichting opgebouwde
      aanspraken, gebaseerd op artikel 4a van de FVP-wet, worden met ingang van de dag van inwerkingtreding van het
      besluit tot aanwijzing van de stichting, overgenomen door de stichting.
    url: https://wetten.overheid.nl/BWBR0009756/2015-01-01#Artikel14
  - number: '15'
    text: |-
      1 De Wet van 13 december 1972 tot bevriezing van het kinderbijslagbedrag voor het eerste kind, alsmede oprichting
      van het Fonds Voorheffing pensioenverzekering wordt ingetrokken.

      2 Het Fonds Voorheffing Pensioenverzekering is ontbonden met dien verstande dat, onverminderd
      [artikel 3, tweede lid][ref1], het bestuur van het fonds nadien de jaarrekening en het jaarverslag van het fonds
      vast stelt tot aan de dag van inwerkingtreding van het besluit tot aanwijzing van de stichting.

      3 Zolang bezwaar- of beroepstermijnen van het betreffende besluit nog niet zijn verstreken, blijft, in afwijking
      van het eerste lid, de rechtsgang van de FVP-wet van toepassing op besluiten:

      a. van het fonds; en

      b. van de stichting indien het recht op een bijdrage voor de dag van inwerkingtreding van het besluit tot
      aanwijzing van de stichting is geëindigd.

      4 Bij civielrechtelijke procedures ter zake van handelingen of besluiten van het fonds alsmede voor de toepassing
      van het derde lid treedt de stichting met ingang van de inwerkingtreding van het besluit tot aanwijzing van
      die stichting in de plaats van het fonds zonder dat daarvoor een betekening nodig is en met overneming van
      procureurstelling onderscheidenlijk aanwijzing van een gemachtigde.


      [ref1]: https://wetten.overheid.nl/BWBR0009756#Artikel3
    url: https://wetten.overheid.nl/BWBR0009756/2015-01-01#Artikel15
