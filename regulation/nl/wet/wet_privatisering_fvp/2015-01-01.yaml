  - number: '3'
    text: |-
      1 Op de datum waarop het besluit tot aanwijzing van de stichting in werking treedt gaan alle vermogensbestanddelen
      van het fonds onder algemene titel over op de stichting.

      2 Het bestuur van het fonds doet van de in het eerste lid bedoelde vermogensbestanddelen door een accountant als
      bedoeld in [artikel 393, lid 1, van Boek 2 van het Burgerlijk Wetboek][ref1] een verklaring opstellen, die door de
      stichting wordt neergelegd ten kantore van de Kamer van Koophandel.

      3 Ingeval op grond van het eerste lid registergoederen overgaan zal verandering in de tenaamstelling in de openbare
      registers, bedoeld in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref2] plaatsvinden. De
      daartoe benodigde opgaven worden door de zorg van het bestuur van het fonds aan de bewaarders van de desbetreffende
      registers gedaan.

      4 Terzake van de overgang van vermogensbestanddelen, bedoeld in het derde lid, blijft heffing van
      overdrachtsbelasting achterwege.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0009756/2015-01-01#Artikel3
