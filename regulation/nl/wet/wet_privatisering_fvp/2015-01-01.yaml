  - number: '6'
    text: |-
      1 Indien het bestuur van de stichting in gebreke blijft gevolg te geven aan een aanwijzing als bedoeld in
      [artikel 5, derde lid][ref1], kan de Nederlandsche Bank, voorzover de aanwijzing betrekking heeft op de wijze
      waarop de stichting haar middelen beheert, aan het bestuur van de stichting aanzeggen dat vanaf een bepaald
      tijdstip de organen van de stichting, dan wel de voor de stichting werkzame organen, die bevoegd zijn tot het
      beheren van de middelen van de stichting, hun bevoegdheden slechts mogen uitoefenen na goedkeuring door een of meer
      door de Nederlandsche Bank daartoe aangewezen personen en met inachtneming van de opdrachten van deze personen.

      2 Indien naar het oordeel van de Nederlandsche Bank onverwijld ingrijpen noodzakelijk is kan zij zonder
      voorafgaande aanwijzing als bedoeld in [artikel 5, derde lid][ref2], onmiddellijk tot de aanzegging, bedoeld in
      het eerste lid, overgaan nadat zij het bestuur van de stichting in de gelegenheid heeft gesteld haar mening over de
      onmiddellijke uitvoering te geven.

      3 De organen, bedoeld in het eerste lid, verlenen de door de Nederlandsche Bank aangewezen personen alle
      medewerking.

      4 De door de Nederlandsche Bank aangewezen personen oefenen hun bevoegdheden uit gedurende ten hoogste twee jaren
      na de bekendmaking van de aanzegging bedoeld in het eerste lid. De Nederlandsche Bank kan deze termijn telkens
      verlengen met ten hoogste een jaar. Een zodanige verlenging maakt de Nederlandsche Bank aan het bestuur van de
      stichting bekend en wordt terstond van kracht. De Nederlandsche Bank kan te allen tijde de door haar aangewezen
      personen door anderen vervangen.

      5 De Nederlandsche Bank trekt in elk geval de maatregel, bedoeld in het eerste lid, in zodra zij van oordeel is dat
      de noodzaak tot het treffen van die maatregel niet langer bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0009756#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009756#Artikel5
    url: https://wetten.overheid.nl/BWBR0009756/2015-01-01#Artikel6
