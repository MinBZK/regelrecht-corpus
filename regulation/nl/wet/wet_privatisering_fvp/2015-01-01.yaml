preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is het Fonds Voorheffing Pensioenverzekering te
    privatiseren en in verband hiermee de Wet van 13 december 1972 tot bevriezing van het kinderbijslagbedrag voor het
    eerste kind, alsmede oprichting van het Fonds Voorheffing Pensioenverzekering, in te trekken en enige aanvullende
    voorzieningen te treffen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009756/2015-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

      a. Onze Minister: de Minister van Sociale Zaken en Werkgelegenheid;

      b. FVP-wet: de Wet van 13 december 1972 tot bevriezing van het kinderbijslagbedrag voor het eerste kind, alsmede
      oprichting van het Fonds Voorheffing Pensioenverzekering;

      c. fonds: het Fonds Voorheffing Pensioenverzekering, bedoeld in de FVP-wet;

      d. de Nederlandsche Bank: De Nederlandsche Bank N.V.;

      e. Uitvoeringsinstituut werknemersverzekeringen: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];

      f. werknemer: de persoon die op grond van [hoofdstuk I, paragraaf 2, van de Werkloosheidswet][ref2] wordt
      aangemerkt als werknemer;

      g. pensioenuitvoerder: een pensioenuitvoerder als bedoeld in [artikel 1 van de Pensioenwet][ref3] en een
      pensioenuitvoerder als bedoeld in [artikel 1 van de Wet verplichte beroepspensioenregeling][ref4];

      h. stichting: de aangewezen stichting, bedoeld in [artikel 2][ref5];

      i. doelstelling: de doelstelling, bedoeld in [artikel 2, eerste lid][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
