  - number: '2'
    text: |-
      1 Onze Minister wijst een stichting aan die uitsluitend als doelstellingen heeft door aanwending van haar middelen
      te voorzien in aanvullende pensioenvoorzieningen ten behoeve van werknemers of hun nagelaten betrekkingen en het
      kunnen voorzien in bijdragen ter financiering van onderzoeken en projecten inzake aanvullende pensioenen.

      2 De middelen, bedoeld in het eerste lid, bestaan uit de vermogensbestanddelen, bedoeld in
      [artikel 3, eerste lid][ref1], alsmede uit de door beleggingen van middelen verkregen resultaten.

      3 De aan te wijzen stichting voldoet ten minste aan de volgende voorwaarden:

      a. het bestuur van de stichting is in gelijke verhouding samengesteld uit in de Sociaal Economische Raad
      vertegenwoordigde gezamenlijke centrale werkgeversorganisaties en gezamenlijke werknemersorganisaties;

      b. de stichting wordt in staat geacht de doelstelling naar behoren uit te voeren.

      4 De stichting belegt haar middelen op een solide wijze, rekening houdend met de aard en de looptijd van haar
      verplichtingen. De stichting gaat geen verplichtingen aan voorzover daaraan niet uit haar middelen kan worden
      voldaan.

      5 Onze Minister kan de aanwijzing van de stichting na een kennisgeving door de Nederlandsche Bank als bedoeld in
      [artikel 5, vijfde lid][ref2], intrekken.

      6 De intrekking, bedoeld in het vijfde lid, heeft de ontbinding van de stichting ten gevolge en doet een batig
      saldo van middelen van de stichting op de staat overgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009756#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009756#Artikel5
