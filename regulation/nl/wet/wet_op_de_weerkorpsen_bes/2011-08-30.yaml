        artikel: '4'
  - number: '6'
    text: |-
      De kosten verbonden aan operationele inzet, daaronder begrepen de vergoeding, bedoeld in
      [artikel 5, tweede lid][ref1], alsmede eventuele kosten voor transport en verblijf, komen voor rekening van het
      orgaan dat om de inzet heeft verzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0028240#Artikel5
    url: https://wetten.overheid.nl/BWBR0028240/2011-08-30#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028240
        artikel: '5'
  - number: '8'
    text: |-
      1 Degene die handelt in strijd met het verbod, bedoeld in [artikel 2, eerste en vierde lid][ref1], wordt gestraft
      met hechtenis van ten hoogste twee jaar of een geldboete van de vijfde categorie.

      2 Overtreding van de in [artikel 2, eerste en vierde lid][ref2], gestelde verboden wordt beschouwd als een
      misdrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0028240#Artikel2
