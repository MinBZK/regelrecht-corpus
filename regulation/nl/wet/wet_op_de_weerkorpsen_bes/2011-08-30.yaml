articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. *Onze Minister:* Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;

      b. *regionaal bevelhebber:* de door Onze Minister van Defensie van het Koninkrijk aangewezen commandant van de
      Zeemacht in het Carabisch gebied;

      c. *weerkorps:* iedere organisatie van particulieren, welke gericht is op of voorbereidt tot het in onderling
      verband verrichten van of deelnemen aan handelingen in bijstand of hulpverlening aan Onze Minister of de regionaal
      bevelhebber dan wel aan door hen aan te wijzen functionarissen;

      d. *militaire bijstand:* de terbeschikking van de krijgsmacht ter handhaving van de openbare orde en rust, dan wel
      in het kader van hulpverlening bij rampen en crisis.
    url: https://wetten.overheid.nl/BWBR0028240/2011-08-30#Artikel1
  - number: '2'
    text: |-
      1 Het is verboden weerkorpsen tot stand te brengen, daarvan deel uit te maken of deze te steunen.

      2 Het verbod, bedoeld in het eerste lid, geldt niet voor organisaties die zijn toegelaten bij of krachtens algemene
      maatregel van bestuur. Aan de toelating kunnen voorwaarden worden verbonden.

      3 [Vervallen]

      4 [Vervallen]
    url: https://wetten.overheid.nl/BWBR0028240/2011-08-30#Artikel2
  - number: '3'
    text: |-
      1 De doelstelling, organisatie en de inrichting van een weerkorps worden bij of krachtens algemene maatregel van
      bestuur, goedgekeurd. Zulks geschiedt bij de toelating van het weerkorps.

      2 Bij of krachtens algemene maatregel van bestuur, worden nadere voorwaarden gesteld waaraan een weerkorps moet
      voldoen. Deze hebben in ieder geval betrekking op:

      a. de inzet van een weerkorps;

      b. de verantwoording van de financiële middelen;

      c. de goedkeuring van de interne reglementen.

      3 Weerkorpsen zijn verplicht te allen tijde mee te werken aan controles uitgeoefend door of namens Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028240/2011-08-30#Artikel3
  - number: '4'
    text: |-
      1 Onze Minister kan weerkorpsen ter beschikking stellen van de gezaghebber in bijstand aan het politiekorps van
      Bonaire, Sint Eustatius en Saba ter handhaving van de openbare orde en rust.

      2 Onze Minister kan weerkorpsen ter beschikking stellen van bevoegde autoriteiten in het kader van hulpverlening
      bij rampen en crisis.

      3 Indien in de gevallen, bedoeld in het eerste en tweede lid, tevens militaire bijstand wordt verleend, overleggen
      zo mogelijk Onze Minister, de regionaal bevelhebber en de gezaghebber omtrent de terbeschikkingstelling.

      4 In buitengewone omstandigheden stelt Onze Minister weerkorpsen ter beschikking van de regionaal bevelhebber.

      5 Aan de in het eerste, tweede en derde lid bedoelde terbeschikkingstelling kunnen door Onze Minister voorwaarden
      worden verbonden.

      6 Bij ministeriële regeling kan een instructie voor het optreden in bijstand of steunverlening als bedoeld in het
      eerste, tweede en derde lid, worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028240/2011-08-30#Artikel4
  - number: '5'
    text: |-
      1 Met inachtneming van [artikel 3, tweede lid, onderdeel b][ref1], kan Onze Minister aan weerkorpsen een bijdrage
      ten laste van de begroting van het Rijk toekennen ten behoeve van de voorbereiding op hun taak alsmede ten behoeve
      van de instandhouding van het materieel.

      2 Indien weerkorpsen overeenkomstig de bepalingen van [artikel 4][ref2] worden ingezet, ontvangen de leden die
      worden ingezet hiervoor een door Onze Minister vast te stellen vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0028240#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028240#Artikel4
    url: https://wetten.overheid.nl/BWBR0028240/2011-08-30#Artikel5
    references:
