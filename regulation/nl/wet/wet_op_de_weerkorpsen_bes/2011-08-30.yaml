  - number: '9'
    text: |-
      De regionaal bevelhebber kan Onze Minister en de gezaghebber alsmede leidinggevenden van weerkorpsen desgevraagd of
      eigener beweging van advies dienen over alle aangelegenheden die de weerkorpsen betreffen.
    url: https://wetten.overheid.nl/BWBR0028240/2011-08-30#Artikel9
