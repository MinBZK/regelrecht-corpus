  - number: '1'
    text: |-
      Indien de bepalingen uit [Afdeling 1][ref1] daarin niet voorzien, kunnen bij algemene maatregel van bestuur op
      voordracht van Onze Ministers van Justitie en van Binnenlandse Zaken, regels worden gesteld die betrekking hebben
      op aanspraken op uitkeringen of voorzieningen, of andere rechten dan wel verplichtingen die samenhangen met de
      overgang van een gemeentelijk politiekorps, een onderdeel van het Korps Rijkspolitie of een ander onderdeel van
      de Staat naar een regionaal politiekorps of het Korps landelijke politiediensten, met de feitelijke integratie van
      deze korpsen of diensten, dan wel die anderszins samenhangen met de reorganisatie van het politiebestel.


      [ref1]: https://wetten.overheid.nl/BWBR0006300#Afdeling1
    url: https://wetten.overheid.nl/BWBR0006300/1996-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006300
        afdeling: '1'
  - number: '2'
    text: |-
      Indien op het tijdstip van inwerkingtreding van deze wet het bij koninklijke boodschap van 10 maart 1992 ingediende
      voorstel van wet tot wijziging van binnentredingsbepalingen (kamerstukken II 1991/92, 22 539, nr. 2) nog niet in
      werking is getreden, komen de bevoegdheden die in de door dat wetsvoorstel te wijzigen bepalingen zijn toegekend
      aan functionarissen van gemeente- of rijkspolitie, tot het tijdstip van de inwerkingtreding van dat voorstel
      van wet toe aan ambtenaren met gelijke functie of rang bij de regionale politiekorpsen of het Korps landelijke
      politiediensten.
    url: https://wetten.overheid.nl/BWBR0006300/1996-01-01#Artikel2
  - number: '3'
    text: |-
      De [Politiewet 1993][ref1] treedt in werking met ingang van de eerste dag van de derde kalendermaand na het
      tijdstip waarop dit wetsvoorstel tot wet wordt verheven en de bepalingen uit [Afdeling 1][ref2], Hoofdstuk 1, in
      werking zijn getreden, dan wel eerder op een bij koninklijk besluit te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0006299
      [ref2]: https://wetten.overheid.nl/BWBR0006300#Afdeling1
    url: https://wetten.overheid.nl/BWBR0006300/1996-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006299
      - id: ref2
        bwb_id: BWBR0006300
        afdeling: '1'
  - number: '4'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor
      verschillende artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0006300/1996-01-01#Artikel4
  - number: '5'
    text: 'Deze wet wordt aangehaald als: Invoeringswet Politiewet 1993.'
    url: https://wetten.overheid.nl/BWBR0006300/1996-01-01#Artikel5
  - number: '6'
    text: |-
      1 Voor het tijdstip van plaatsing in het *Staatsblad* vervangt Onze Minister van Justitie de in deze wet
      voorkomende aanduiding "19.." door het jaartal van het *Staatsblad*, waarin het bij koninklijke boodschap van
      27 maart 1992 ingediende voorstel van wet tot vaststelling van een nieuwe [Politiewet][ref1], na tot wet te zijn
      verheven, is geplaatst.

      2 De tekst van de [Politiewet 1993][ref2] wordt in het *Staatsblad* geplaatst nadat:

      a. afdeling 2, hoofdstuk 1, artikel 17, in werking is getreden,

      b. het bij koninklijke boodschap van 4 november 1992 ingediende voorstel van wet tot wijziging van de
      [Gemeentewet][ref3] en van een aantal andere wetten met het oog op de invoering van de [Gemeentewet][ref4] en
      vaststelling van het tijdstip van inwerkingtreding van de [Gemeentewet][ref5] (Invoeringswet [Gemeentewet][ref6])
      (kamerstukken II 1992/93, 22 893, nr. 2) tot wet is verheven en in werking is getreden,

      c. het bij koninklijke boodschap van 6 april 1993 ingediende voorstel van wet tot wijziging van de
      [Provinciewet][ref7] en een aantal andere wetten met het oog op de invoering van de [Provinciewet][ref8] en
      vaststelling van het tijdstip van inwerkingtreding van de [Provinciewet][ref9] (Invoeringswet Provinciewet)
      (kamerstukken II 1992/93, 23 086, nr. 2) tot wet is verheven en in werking is getreden, en

      d. het bij koninklijke boodschap van 20 augustus 1993 ingediende voorstel van wet tot wijziging
      van de [Algemene wet bestuursrecht][ref10] alsmede nadere aanpassing van een aantal wetten aan de
      [Algemene wet bestuursrecht][ref11] (Aanpassingswet Awb III) (kamerstukken II 1992/93, 23 258, nr. 2) tot wet is
      verheven en onderdeel 5 van die wet in werking is getreden.

      3 Voor de in het tweede lid bedoelde plaatsing brengt Onze Minister van Justitie de in de [Politiewet 1993][ref12]
      voorkomende verwijzingen naar de [Provinciewet][ref13] en de [Gemeentewet][ref14] in overeenstemming met de
      ingevolge artikel 4 van hoofdstuk IX van de Invoeringswet [Provinciewet][ref15] vastgestelde nieuwe nummering
      van de [Provinciewet][ref16] onderscheidenlijk de ingevolge artikel 4 van hoofdstuk XIII van de Invoeringswet
      Gemeentewet vastgestelde nieuwe nummering van de [Gemeentewet][ref17].


