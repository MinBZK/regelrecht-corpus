    text: |-
      De bepalingen uit deze Afdeling zijn niet van toepassing op de verplichtingen van de Staat of een gemeente ten
      aanzien van personen met wie het actieve dienstverband bij de gemeentepolitie of de rijkspolitie dan wel een ander
      onderdeel van de Staat dat overgaat in het Korps landelijke politiediensten, op de dag voorafgaand aan de datum van
      de inwerkingtreding van de [Politiewet 1993][ref1] niet meer bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0006299
