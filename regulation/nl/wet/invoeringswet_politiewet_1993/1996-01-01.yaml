  - number: '7'
    text: |-
      Wettelijke procedures en rechtsgedingen waarbij een gemeente of de Staat betrokken is en die betrekking hebben op
      vermogensbestanddelen als bedoeld in artikel 1 of 2, worden met ingang van het tijdstip van overgang voortgezet
      door of tegen de politieregio waaraan die vermogensbestanddelen toekomen.
    url: https://wetten.overheid.nl/BWBR0006300/1996-01-01#Artikel7
  - number: '8'
    text: |-
      Ter zake van de verkrijging door de politieregio van de vermogensbestanddelen, bedoeld in artikel 1 of artikel 2,
      blijft de heffing van overdrachtsbelasting achterwege.
    url: https://wetten.overheid.nl/BWBR0006300/1996-01-01#Artikel8
  - number: '1'
    text: |-
      1 Op het tijdstip waarop de [Politiewet 1993][ref1] in werking treedt, gaan degenen die op de dag voorafgaand aan
      de datum van inwerkingtreding van deze wet voorkomen in een formatieplan dat is opgesteld krachtens artikel 15
      van de Wet tijdelijke voorzieningen reorganisatie politiebestel (*Stb.* 1991, 674), van rechtswege over naar de
      politieregio dan wel naar het Korps landelijke politiediensten waarop dat formatieplan betrekking heeft.

      2 Op het in het eerste lid genoemde tijdstip gaan de vrijwilligers die op de dag voorafgaand aan de datum van
      inwerkingtreding van de [Politiewet 1993][ref2] zijn aangenomen bij het Korps Rijkspolitie en de gemeentepolitie en
      die op een lijst zijn opgenomen om bij een politieregio dan wel het Korps landelijke politiediensten als vrijwillig
      ambtenaar van politie te gaan functioneren, van rechtswege over naar die politieregio dan wel naar het Korps
      landelijke politiediensten.


      [ref1]: https://wetten.overheid.nl/BWBR0006299
      [ref2]: https://wetten.overheid.nl/BWBR0006299
