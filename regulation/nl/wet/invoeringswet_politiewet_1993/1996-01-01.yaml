  - number: '4'
    text: |-
      1 Indien het al of niet overgaan van een of meer vermogensbestanddelen ingevolge artikel 1, eerste lid, of artikel
      2 leidt tot een aanmerkelijke, onredelijke benadeling, komen de daarbij betrokkenen een redelijke vergoeding
      overeen ter compensatie daarvan.

      2 Recht op de in het eerste lid bedoelde vergoeding bestaat slechts voor zover daarop aanspraak is gemaakt voordat
      drie maanden na het in artikel 1, eerste lid, bedoelde tijdstip zijn verstreken.

      3 Geschillen die uit de toepassing van het eerste en tweede lid voortvloeien, worden onverwijld ter advisering
      voorgelegd aan een commissie van drie onafhankelijke deskundigen. Elk der betrokkenen benoemt één deskundige, de
      twee aldus benoemde deskundigen benoemen een derde. De commissie brengt binnen een maand na benoeming van de derde
      deskundige haar advies uit. Betrokkenen dragen elk de helft van de kosten van de advisering.
    url: https://wetten.overheid.nl/BWBR0006300/1996-01-01#Artikel4
  - number: '5'
    text: |-
      1 De rechter wijzigt op verlangen van een der partijen de gevolgen van een overeenkomst als bedoeld in artikel
      1, eerste lid, en artikel 2, eerste lid, of ontbindt deze geheel of gedeeltelijk, indien ten gevolge van de
      overgang van rechten of verplichtingen uit die overeenkomst ongewijzigde instandhouding daarvan naar maatstaven
      van redelijkheid en billijkheid niet mag worden verwacht. Aan de wijziging of ontbinding kan terugwerkende kracht
      worden verleend.

      2 De bevoegdheid wijziging of ontbinding te verlangen vervalt op het moment waarop zes maanden na de overgang zijn
      verstreken.

      3 Indien de derde, bedoeld in artikel 1, eerste lid, en artikel 2, eerste lid, ten gevolge van de wijziging
      of ontbinding schade lijdt, zijn de gemeente en de verkrijgende politieregio, onderscheidenlijk de Staat en de
      verkrijgende politieregio of politieregio's, hoofdelijk aansprakelijk voor de vergoeding daarvan.

      4 Voor de toepassing van dit artikel staat degene op wie een recht of een verplichting uit een overeenkomst is
      overgegaan, met een partij bij die overeenkomst gelijk.
    url: https://wetten.overheid.nl/BWBR0006300/1996-01-01#Artikel5
  - number: '6'
    text: |-
      1 Indien op grond van artikel 1, eerste lid, of artikel 2, eerste lid, een registergoed overgaat, is degene
      aan wie dat registergoed voor de overgang toebehoorde verplicht om deze overgang onverwijld te doen inschrijven
      in de openbare registers, bedoeld in [afdeling 2 van titel 1 van boek 3 van het Burgerlijk Wetboek][ref1].
      [Artikel 24, eerste lid, van Boek 3 van het Burgerlijk Wetboek][ref2] is niet van toepassing.

      2 Ter inschrijving van de overgang, bedoeld in het eerste lid, wordt een uittreksel van de lijst, bedoeld in
      artikel 3, eerste lid, aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel24
