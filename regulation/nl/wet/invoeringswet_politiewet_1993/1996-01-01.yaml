preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is in verband met de invoering van de Politiewet 1993
    overgangsmaatregelen te treffen, bepalingen in diverse wetten te wijzigen en het tijdstip te regelen waarop de
    Politiewet 1993 in werking treedt.

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006300/1996-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De vermogensbestanddelen van een gemeente die toegerekend moeten worden aan het korps van gemeentepolitie, gaan
      op het tijdstip waarop de [Politiewet 1993][ref1] in werking treedt, onder algemene titel over op de politieregio
      waarbij die gemeente krachtens de bijlage, bedoeld in [artikel 21, eerste lid, van de Politiewet 1993][ref2] is
      ingedeeld, met dien verstande dat:

      a. de rechten en verplichtingen van de gemeente uit een overeenkomst met een derde, behoudens voor zover de
      rechtsverhouding of de daaruit voortvloeiende rechten en verplichtingen ondeelbaar zijn, bij de overgang worden
      gesplitst voor zover dat, in het bijzonder in verband met de samenhang tussen die rechten en verplichtingen en
      andere vermogensbestanddelen die al of niet op een politieregio overgaan, noodzakelijk is; en

      b. de vermogensbestanddelen in ieder geval overgaan of niet overgaan overeenkomstig het daaromtrent in de lijst,
      bedoeld in artikel 3, eerste lid, bepaalde.

      2 Indien met betrekking tot vermogensbestanddelen die ingevolge het eerste lid overgaan boekwaarden zijn
      opgenomen in de gemeenterekening, zoals deze over het jaar voorafgaande aan dat waarin de overgang plaatsvindt, is
      vastgesteld of zal worden vastgesteld, verkrijgt de gemeente op het tijdstip van de overgang van de desbetreffende
      vermogensbestanddelen een vordering op de politieregio ter grootte van het bedrag van deze boekwaarden, met dien
      verstande dat een vordering in ieder geval wordt verkregen of niet wordt verkregen overeenkomstig het daaromtrent
      in de lijst, bedoeld in artikel 3, eerste lid, bepaalde.

      3 Het in het tweede lid bepaalde geldt niet voor zover:

      a. de boekwaarden na 1 januari 1989 in de gemeenterekening zijn opgenomen; of

      b. na 1 januari 1989 is afgeweken van de bestendige gedragslijn met betrekking tot de vaststelling van de
      boekwaarden in de gemeenterekening;

      een en ander behoudens voor zover dit gerechtvaardigd was en niet in verband stond met de reorganisatie van de
      politie, met dien verstande dat een vordering in ieder geval wordt verkregen of niet wordt verkregen overeenkomstig
      het daaromtrent in de lijst, bedoeld in artikel 3, eerste lid, bepaalde.

      4 Voor zover reserves of voorzieningen, opgenomen in de gemeenterekening, zoals deze is vastgesteld of zal worden
      vastgesteld over het jaar voorafgaande aan dat waarin de overgang van de vermogensbestanddelen, bedoeld in het
      eerste lid, plaatsvindt, zijn toe te rekenen aan het korps van gemeentepolitie, verkrijgt de politieregio op het
      tijdstip van de overgang een vordering op de gemeente ter grootte van het bedrag daarvan, met dien verstande dat
      een vordering in ieder geval wordt verkregen of niet wordt verkregen overeenkomstig het daaromtrent in de lijst,
      bedoeld in artikel 3, eerste lid, bepaalde.

      5 Een vordering als bedoeld in het vierde lid ontstaat eveneens, voor zover:

      a. reserves of voorzieningen als bedoeld in het vierde lid na 1 januari 1989 van de gemeenterekening zijn
      verwijderd;

      b. reserves of voorzieningen als bedoeld in het vierde lid na 1 januari 1989 zijn afgenomen doordat is afgeweken
      van de bestendige gedragslijn met betrekking tot de vaststelling daarvan; of

      c. reserves of voorzieningen als bedoeld in het vierde lid na 1 januari 1989 niet zijn opgenomen in de
      gemeenterekening, hoewel de gemeente daartoe was gehouden op grond van een wettelijk voorschrift;

      een en ander behoudens voor zover dit gerechtvaardigd was en niet in verband stond met de reorganisatie van de
      politie, met dien verstande dat een vordering in ieder geval wordt verkregen of niet wordt verkregen overeenkomstig
      het daaromtrent in de lijst, bedoeld in artikel 3, eerste lid, bepaalde.

      6 Een politieregio waarop ingevolge het eerste lid een onroerende zaak of een beperkt gebruiksrecht daarop van
      een gemeente is overgegaan, is verplicht die zaak of dat recht bij een voorgenomen vervreemding eerst aan de
      desbetreffende gemeente te koop aan te bieden tegen een redelijke prijs.

      7 Voor het bepalen van de redelijke prijs, bedoeld in het zesde lid, geldt de boekwaarde, bedoeld in het tweede
      lid, als uitgangspunt indien een voorgenomen vervreemding plaatsvindt voordat vijf jaren zijn verstreken na het in
      artikel 1, eerste lid, bedoelde tijdstip, en de gemeente in de tien jaren die zijn gelegen voor dat tijdstip ten
      behoeve van die zaak geen middelen als bedoeld in [artikel 9](onbekend) (*Stb.* 1989, 223) heeft aangewend.


      [ref1]: https://wetten.overheid.nl/BWBR0006299
      [ref2]: https://wetten.overheid.nl/BWBR0006299#Artikel21
