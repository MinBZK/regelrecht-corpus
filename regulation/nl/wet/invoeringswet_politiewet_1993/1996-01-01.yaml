  - number: '2'
    text: |-
      Wettelijke procedures en rechtsgedingen die betrekking hebben op het dienstverband van de in artikel 1 bedoelde
      personen, worden vanaf het in dat artikel bedoelde tijdstip voortgezet door of tegen de politieregio, bedoeld in
      artikel 1, dan wel de Staat.
    url: https://wetten.overheid.nl/BWBR0006300/1996-01-01#Artikel2
  - number: '3'
    text: |-
      1 De functionarissen die op de dag voorafgaand aan de datum van inwerkingtreding van de [Politiewet 1993][ref1] op
      grond van de [artikelen 141][ref2] en [142 van het Wetboek van Strafvordering][ref3] met het opsporen van strafbare
      feiten zijn belast, behouden die bevoegdheid tot het opsporen van strafbare feiten gedurende één jaar na het
      tijdstip van inwerkingtreding van de [Politiewet 1993][ref4], voor zover hun functie ongewijzigd blijft.

      2 Het eerste lid is niet van toepassing op die functionarissen die op het tijdstip van inwerkingtreding van
      de [Politiewet 1993][ref5] ambtenaar van politie of militair van de Koninklijke marechaussee, als bedoeld in
      [artikel 141 van het Wetboek van Strafvordering][ref6], zijn.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gegeven over de wijze waarop
      functionarissen, als bedoeld in het eerste lid, die voldoen aan de eisen voor beëdiging tot buitengewoon
      opsporingsambtenaar, een akte van beëdiging verkrijgen.

      4 De [artikelen 152][ref7], [153][ref8], [157][ref9] en [159 van het Wetboek van Strafvordering][ref10] zijn van
      overeenkomstige toepassing.


