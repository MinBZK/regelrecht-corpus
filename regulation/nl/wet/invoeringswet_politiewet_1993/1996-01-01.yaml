    text: |-
      1 De vermogensbestanddelen van de Staat die toegerekend moeten worden aan een district van het Korps Rijkspolitie
      gaan op het tijdstip waarop de [Politiewet 1993][ref1] in werking treedt, onder algemene titel over op de
      politieregio waarin dat district opgaat, met dien verstande dat:

      a. de rechten en verplichtingen van de Staat uit een overeenkomst met een derde, behoudens voor zover de
      rechtsverhouding of de daaruit voortvloeiende rechten en verplichtingen ondeelbaar zijn, bij de overgang worden
      gesplitst voor zover dat, in het bijzonder in verband met de samenhang tussen die rechten en verplichtingen en
      andere vermogensbestanddelen die al of niet op een politieregio overgaan, noodzakelijk is; en

      b. de vermogensbestanddelen in ieder geval overgaan of niet overgaan overeenkomstig het daaromtrent in de lijst,
      bedoeld in artikel 3, eerste lid, bepaalde. Indien een district van het Korps Rijkspolitie opgaat in meer dan een
      politieregio, gaan de vermogensbestanddelen over op de onderscheiden politieregio's voor zover zij zijn toe te
      rekenen aan het deel van het district dat in de desbetreffende politieregio opgaat.

      2 Indien een dringende reden van algemeen belang zich verzet tegen de overgang van een vermogensbestanddeel,
      bedoeld in het eerste lid, kan Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, in
      overeenstemming met Onze Ministers van Justitie en van Binnenlandse Zaken, uiterlijk drie maanden voor het in het
      eerste lid bedoelde tijdstip dat vermogensbestanddeel daarvan uitzonderen.


      [ref1]: https://wetten.overheid.nl/BWBR0006299
    url: https://wetten.overheid.nl/BWBR0006300/1996-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006299
  - number: '3'
    text: |-
      1 De in artikel 1, eerste lid, bedoelde vermogensbestanddelen, de uit artikel 1, tweede, vierde en vijfde
      lid, voortvloeiende vorderingen, de bij het desbetreffende korps van gemeentepolitie in gebruik zijnde
      vermogensbestanddelen die niet aan dat korps moeten worden toegerekend, de in artikel 2, eerste lid, bedoelde
      vermogensbestanddelen, alsmede de vermogensbestanddelen die ingevolge artikel 2, tweede lid, zijn uitgezonderd van
      overgang, staan vermeld op een lijst, die is opgemaakt

      a. voor het onderdeel dat betrekking heeft op het korps van gemeentepolitie van de gemeente van de burgemeester
      bedoeld in artikel 2 van de Wet tijdelijke voorzieningen reorganisatie politiebestel: door die gemeente en, namens
      de in te stellen politieregio, de in artikel 3 van de Wet tijdelijke voorzieningen reorganisatie politiebestel
      bedoelde plaatsvervanger van die burgemeester;

      b. voor het onderdeel dat betrekking heeft op een ander korps van gemeentepolitie: door de desbetreffende gemeente
      en, namens de in te stellen politieregio, de burgemeester, bedoeld in artikel 2 van de Wet tijdelijke voorzieningen
      reorganisatie politiebestel, en

      c. voor het onderdeel dat betrekking heeft op een district van het Korps Rijkspolitie: door de Staat en, namens de
      in te stellen politieregio, de burgemeester, bedoeld in artikel 2 van de Wet tijdelijke voorzieningen reorganisatie
      politiebestel.

      2 De lijst is zodanig opgesteld dat:

      a. registergoederen die ingevolge artikel 1, eerste lid, of artikel 2, eerste lid, overgaan daarop zodanig worden
      omschreven dat de lijst voldoet aan de vereisten van de [Kadasterwet][ref1] op het punt van inschrijfbaarheid van
      stukken;

      b. de overige vermogensbestanddelen die ingevolge artikel 1, eerste lid, of artikel 2, eerste lid, overgaan,
      alsmede de bij de politie in gebruik zijnde vermogensbestanddelen die niet overgaan op de politieregio, daarop met
      voldoende bepaaldheid zijn omschreven;

      c. daaruit blijkt hoe de in artikel 1, eerste lid, en artikel 2, eerste lid, bedoelde rechten en verplichtingen
      worden gesplitst;

      d. de grootte van de vorderingen, bedoeld in artikel 1, tweede, vierde en vijfde lid, aan de hand daarvan voldoende
      bepaalbaar is;

      e. daaruit blijkt of aan artikel 4, eerste lid, toepassing is of moet worden gegeven.

      3 Indien de betrokkenen, bedoeld in het eerste lid, op het tijdstip waarop dit artikel in werking treedt
      overeenstemming hebben bereikt over de inhoud van de lijst, delen zij dit onverwijld mede aan Onze Ministers van
      Justitie en van Binnenlandse Zaken.

      4 Indien de betrokkenen, bedoeld in het eerste lid, op het tijdstip waarop dit artikel in werking treedt geen
      overeenstemming hebben bereikt over de inhoud van een lijst, leggen zij hetgeen hen verdeeld houdt onverwijld ter
      advisering voor aan een commissie van drie onafhankelijke deskundigen. Elk der betrokkenen benoemt één deskundige,
      de twee aldus benoemde deskundigen benoemen een derde. De commissie brengt uiterlijk een maand na het in de eerste
      volzin bedoelde tijdstip haar advies uit. De betrokkenen dragen elk de helft van de kosten van de advisering.

      5 Uiterlijk zes weken na het tijdstip waarop dit artikel in werking treedt, delen de betrokkenen, bedoeld in het
      vierde lid, Onze Ministers van Justitie en van Binnenlandse Zaken mede of zij, mede gelet op het advies, bedoeld in
      het vierde lid, alsnog overeenstemming hebben bereikt over de inhoud van de lijst en, indien dit niet het geval is,
      op welke punten tussen hen nog verschil van mening bestaat. Onze Ministers van Justitie en van Binnenlandse Zaken
      stellen daarop, zo nodig gehoord de betrokkenen, uiterlijk twee maanden na dit tijdstip te zamen de desbetreffende
      lijst vast. Tegen deze beslissing staat geen voorziening open.

      6 De burgemeester, bedoeld in artikel 2 van de Wet tijdelijke voorzieningen reorganisatie politiebestel, en diens
      plaatsvervanger voeren over hun optreden namens de in te stellen politieregio zo veel mogelijk overleg met het
      regionaal overlegorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004541
