      1 De archiefbescheiden van een korps van gemeentepolitie betreffende zaken die nog niet zijn afgedaan, worden
      op het tijdstip dat de [Politiewet 1993][ref1] in werking treedt, overgedragen aan de politieregio waarbij die
      gemeente krachtens de bijlage, bedoeld in [artikel 21, eerste lid, van de Politiewet 1993][ref2], is ingedeeld.

      2 De archiefbescheiden van een korps van gemeentepolitie betreffende zaken die op het in het eerste lid bedoelde
      tijdstip zijn afgedaan, maar die nog niet zijn overgebracht naar een archiefbewaarplaats, worden op dat tijdstip
      overgedragen aan de in het eerste lid bedoelde politieregio. De overbrenging van deze archiefbescheiden ingevolge
      de [Archiefwet 1995][ref3] (*Stb.* 276) naar een in die wet genoemde archiefbewaarplaats geschiedt als had geen
      overdracht plaatsgevonden.

      3 Van de overdracht, bedoeld in het eerste en tweede lid, maken degene onder wie de archiefbescheiden tot de
      overdracht hebben berust en de beheerder van het politiekorps in de politieregio, bedoeld in het eerste en tweede
      lid, een verklaring op, die ten minste inhoudt een specificatie van deze archiefbescheiden. Zij bewaren ieder een
      door beiden ondertekend exemplaar van deze verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0006299
      [ref2]: https://wetten.overheid.nl/BWBR0006299#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0007376
