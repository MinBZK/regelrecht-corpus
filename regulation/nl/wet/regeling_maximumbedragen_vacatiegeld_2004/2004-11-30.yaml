preamble:
  text: |-
    Gelet op artikel 1, derde lid, van het Vacatiegeldenbesluit 1988 (Stb. 205);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0017556/2004-11-30#ArtikelAanhef
articles:
  - number: '1'
    text: Voor de toekenning van vacatiegeld worden twee categorieën commissies onderscheiden, te weten algemeen en zwaar.
    url: https://wetten.overheid.nl/BWBR0017556/2004-11-30#Artikel1
  - number: '2'
    text: |-
      Het maximumbedrag aan vacatiegeld per vergadering dat kan worden toegekend aan
      een lid, een secretaris en een adjunct-secretaris van een commissie als bedoeld in
      [artikel 1, eerste lid, van het Vacatiegeldenbesluit 1988][ref1], dan wel aan een deskundige die aan de
      werkzaamheden van een zodanige commissie deelneemt, bedraagt met ingang van 1 juli 2004 voor de onderscheiden
      categorieën:

      a. algemeen EUR 135,00;

      b. zwaar EUR 200,00.


      [ref1]: https://wetten.overheid.nl/BWBR0004317#Artikel1
    url: https://wetten.overheid.nl/BWBR0017556/2004-11-30#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004317
        artikel: '1'
  - number: '3'
    text: |-
      Aan de voorzitter van een commissie kan aan vacatiegeld worden toegekend een bedrag van maximaal 130% van het
      bedrag dat aan een lid van de desbetreffende commissie wordt toegekend.
    url: https://wetten.overheid.nl/BWBR0017556/2004-11-30#Artikel3
  - number: '4'
    text: |-
      1 De Regeling maximumbedragen vacatiegeld 1999 van 1 juli 1999 wordt ingetrokken.

      2 Deze regeling wordt aangehaald als: Regeling maximumbedragen vacatiegeld 2004.

      3 Deze regeling treedt in werking met ingang van 1 juli 2004. Indien de Staatscourant waarin deze regeling wordt
      geplaatst, wordt uitgegeven op of na de datum van 1 juli 2004, dan treedt zij in werking met ingang van de datum
      van uitgifte van die Staatscourant en werkt zij terug tot en met 1 juli 2004.
    url: https://wetten.overheid.nl/BWBR0017556/2004-11-30#Artikel4
