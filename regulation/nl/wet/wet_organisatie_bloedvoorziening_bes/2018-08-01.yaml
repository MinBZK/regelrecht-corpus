  - number: '12'
    text: |-
      Het is verboden bloedproducten af te leveren aan anderen dan:

      a. de Bloedvoorzieningsorganisatie;

      b. ziekenhuizen in de zin van [artikel 1, onder j, van de Wet op de Geneesmiddelenvoorziening BES][ref1],
      apothekers en apotheekhoudende artsen als bedoeld in
      [artikel 3, eerste lid, onder a, respectievelijk b, van genoemde wet][ref2];

      c. door Onze Minister aangewezen andere natuurlijke of rechtspersonen.

      2. Aflevering als bedoeld in het eerste lid, onder b, is uitsluitend toegestaan op last van de
      Bloedvoorzieningsorganisatie.

      3. Onze Minister wijst slechts de personen aan, bedoeld in het eerste lid, onder c, indien naar zijn oordeel het
      belang van een in geneeskundig opzicht doelmatige voorziening in de behoefte aan bloedproducten zulks vordert
      dan wel een bijzondere omstandigheid daartoe aanleiding geeft. [Artikel 3, derde en vierde lid][ref3], is van
      overeenkomstige toepassing. Zodanige aanwijzing, alsmede wijziging of intrekking ervan, wordt bekendgemaakt in
      de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0028486#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028486#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0028454#Artikel3
