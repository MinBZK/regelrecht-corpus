  - number: '13'
    text: |-
      1 Het is verboden tussenproducten af te leveren aan anderen dan:

      a. de Bloedvoorzieningsorganisatie;

      b. natuurlijke of rechtspersonen, die in het bezit zijn van een vergunning als bedoeld in
      [artikel 3, eerste lid, onder d, van de Wet op de Geneesmiddelenvoorziening BES][ref1];

      c. instellingen voor wetenschappelijk onderzoek;

      door Onze Minister aangewezen andere natuurlijke of rechtspersonen.

      2 Aflevering als bedoeld in het eerste lid, onder b, mag slechts geschieden voorzover de tussenproducten
      zijn bereid uit plasma van vrijwillige donoren aan wie ten hoogste een vergoeding is gegeven als bedoeld
      in [artikel 4, tweede lid][ref2], en het bloed dat is gebruikt voor de bereiding ervan, is onderzocht op de
      aanwezigheid van via bloed of bloedplasma overdraagbare ziekteverwekkers, kwalitatief overeenkomende met de
      werkwijze zoals die in Bonaire, Sint Eustatius en Saba of in het land Curaçao wordt gehanteerd.

      3 Onze Minister wijst slechts de personen aan, bedoeld in het eerste lid, onder d, indien naar zijn oordeel het
      belang van een doelmatige voorziening in de behoefte aan bloedproducten daardoor niet wordt geschaad, dan wel een
      bijzondere omstandigheid daartoe aanleiding geeft. [Artikel 3, derde en vierde lid][ref3], is van overeenkomstige
      toepassing. Zodanige aanwijzing, alsmede wijziging of intrekking ervan, wordt bekendgemaakt in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0028486#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028454#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0028454#Artikel3
