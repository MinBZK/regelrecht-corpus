  - number: '21'
    text: |-
      1 Degene die opzettelijk de bij [artikel 22][ref1] opgelegde plicht tot geheimhouding schendt, wordt gestraft
      hetzij met gevangenisstraf van ten hoogste twee jaren hetzij met een geldboete van ten hoogste een boete van de
      vierde categorie hetzij met beide straffen. Het in dit lid strafbaar gestelde feit is een misdrijf.

      2 Degene aan wiens schuld schending van de geheimhouding te wijten is, wordt gestraft met hechtenis van ten hoogste
      zes maanden hetzij met een geldboete van ten hoogste een boete van de vijfde categorie hetzij met beide straffen.
      Het in dit lid strafbaar gestelde feit is een overtreding.

      3 Geen vervolging wordt ingesteld dan op klachte van degene te wiens aanzien de geheimhouding geschonden is.


      [ref1]: https://wetten.overheid.nl/BWBR0028454#Artikel22
    url: https://wetten.overheid.nl/BWBR0028454/2018-08-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0028454
        artikel: '22'
        hoofdstuk: '8'
  - number: '22'
    text: |-
      Een ieder die betrokken is bij de uitvoering van deze wet en daarbij de beschikking krijgt over gegevens waarvan
      hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden en voor wie niet reeds uit hoofde van
      ambt, beroep of wettelijk voorschrift ter zake van die gegevens een geheimhoudingsplicht geldt, is verplicht tot
      geheimhouding daarvan behoudens voor zover enig wettelijk voorschrift hem tot bekendmaking verplicht of uit zijn
      taak bij de uitvoering van deze wet de noodzaak tot bekendmaking voortvloeit.
    url: https://wetten.overheid.nl/BWBR0028454/2018-08-01#Artikel22
