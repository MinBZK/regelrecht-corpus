        artikel: '3'
        hoofdstuk: '2'
  - number: '16'
    text: |-
      1 Het is verboden bloedproducten en tussenproducten uit te voeren naar een ander land zonder vergunning van Onze
      Minister.

      2 Onze Minister verleent slechts een vergunning indien naar zijn oordeel het belang van een doelmatige voorziening
      in de behoefte aan bloedproducten en tussenproducten daardoor niet wordt geschaad.

      3 Onze Minister kan aan de vergunning voorschriften verbinden of de vergunning onder beperkingen verlenen. De
      vergunning kan worden ingetrokken. [Artikel 3, derde en vierde lid][ref1], is van overeenkomstige toepassing.

      4 Het in het eerste lid vervatte verbod geldt niet ten aanzien van:

      a. de uitvoer naar het land Curaçao op last van de Bloedvoorzieningsorganisatie;

      b. een persoon die bij het overschrijden van de grens in het bezit is van een hoeveelheid van een bloedproduct,
      welke kennelijk voor eigen gebruik bestemd is;

      c. het Nederlandse Rode Kruis, district Benedenwinden en Bovenwinden met desbetreffende afdelingen, voorzover de
      uitvoer geschiedt in het kader van door deze organisatie te bieden hulpverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0028454#Artikel3
    url: https://wetten.overheid.nl/BWBR0028454/2018-08-01#Artikel16
