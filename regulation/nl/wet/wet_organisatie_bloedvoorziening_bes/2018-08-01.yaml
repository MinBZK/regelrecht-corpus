  - number: '18'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de ambtenaren van de
      Inspectie gezondheidszorg en jeugd.
    url: https://wetten.overheid.nl/BWBR0028454/2018-08-01#Artikel18
  - number: '19'
    text: |-
      1 Met de opsporing van de bij deze wet strafbaar gestelde feiten zijn, naast de in
      [artikel 184 van het Wetboek van Strafvordering BES][ref1] bedoelde personen, belast daartoe bij algemene
      maatregel van bestuur aangewezen ambtenaren werkzaam bij de Inspectie gezondheidszorg en jeugd. Deze ambtenaren
      zijn tevens belast met de opsporing van de feiten, strafbaar gesteld in de [artikelen 185 tot en met 188][ref2] en
      [190 van het Wetboek van Strafrecht BES][ref3], voor zover deze feiten betrekking hebben op een bevel, vordering of
      handeling, gedaan of ondernomen door henzelf.

      2 Van een algemene maatregel van bestuur als bedoeld in het eerste lid wordt mededeling gedaan in de Staatscourant.

      3 Bij algemene maatregel van bestuur, kunnen regels worden gesteld omtrent de vereisten waaraan de ingevolge het
      eerste lid aangewezen ambtenaren dienen te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel184
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel185
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel190
