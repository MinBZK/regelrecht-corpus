  - number: '4'
    text: |-
      1 Het is verboden bloed in te zamelen anders dan in opdracht van de Bloedvoorzieningsorganisatie.

      2 Het is verboden aan een donor andere dan door hem in redelijkheid gemaakte kosten te vergoeden.
    url: https://wetten.overheid.nl/BWBR0028454/2018-08-01#Artikel4
  - number: '5'
    text: |-
      1 De Bloedvoorzieningsorganisatie voert de werkzaamheden betreffende het inzamelen van bloed en het bereiden van
      tussenproducten en bloedproducten uit het ingezamelde bloed, alsmede het bewaren, verpakken, etiketteren, vervoeren
      en afleveren daarvan, op verantwoorde wijze uit. Onder verantwoord wordt in ieder geval verstaan: doeltreffend
      en doelmatig alsmede gericht op een zo hoog mogelijke kwaliteit van de tussenproducten en bloedproducten van het
      ingezamelde bloed en een zo groot mogelijke veiligheid van donor en gebruiker.

      2 Onze Minister kan de Bloedvoorzieningsorganisatie omtrent het eerste lid aanwijzingen geven. Deze aanwijzingen
      kunnen onder meer betrekking hebben op:

      a. de door de Bloedvoorzieningsorganisatie op te stellen protocollen;

      b. de personen die bij de uitvoering van de werkzaamheden zijn betrokken;

      c. de ruimten waarin en de middelen waarmee de werkzaamheden worden uitgevoerd;

      d. het inzamelen van bloed;

      e. het bereiden van tussenproducten en bloedproducten uit het ingezamelde bloed, alsmede het bewaren, verpakken,
      etiketteren, vervoeren en afleveren daarvan;

      f. het voeren van een administratie en het verwerken van de geadministreerde gegevens;

      g. de uitwisseling van de in onderdeel f bedoelde gegevens.

      3 De aanwijzingen worden bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028454/2018-08-01#Artikel5
  - number: '6'
    text: |-
      1 De taak, bedoeld in [artikel 3, eerste lid][ref1], omvat mede de systematische bewaking, beheersing en
      verbetering van de bloedvoorziening.

      2 Ter uitvoering van de werkzaamheden, genoemd in het eerste lid, draagt de Bloedvoorzieningsorganisatie in elk
      geval zorg voor:

      a. het op systematische wijze verzamelen en registreren van gegevens betreffende:

      1°. de kwaliteit, doelmatigheid en doeltreffendheid van de te verrichten werkzaamheden; en

      2°. de kwaliteit van het bloedproduct;

      b. het aan de gegevens, bedoeld onder a, op systematische wijze toetsen in hoeverre de wijze van uitvoering
      overeenkomt met een verantwoorde uitvoering als bedoeld in [artikel 5][ref2]; en

      c. het op basis van de uitkomst van de toetsing, bedoeld onder b, zo nodig aanpassen van de wijze waarop de
      werkzaamheden ten behoeve van de bloedvoorziening worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0028454#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028454#Artikel5
