    text: |-
      1 Onze Minister stelt met het oog op een doeltreffende en doelmatige bloedvoorziening na overleg met het
      bestuurscollege periodiek een meerjarenplan inzake de bloedvoorziening vast. Uitgangspunten daarbij zijn dat:

      a. gestreefd wordt naar een voorziening met vrijwillig en om niet gegeven bloed dat zonder winstoogmerk bewerkt en
      geleverd wordt, en

      b. de organisatie ten behoeve van zodanige voorziening moet voldoen aan hoge eisen van veiligheid, doelmatigheid
      en kwaliteit.

      2 Onze Minister stelt bij de voorbereiding van het plan de bij de bloedvoorziening betrokken instanties in de
      gelegenheid om hun opvattingen ter zake naar voren te brengen.

      3 Onze Minister zendt een afschrift van het plan aan de Staten. Van de vaststelling van het plan wordt mededeling
      gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028454/2018-08-01#Artikel2
  - number: '3'
    text: |-
      1 Onze Minister wijst één rechtspersoon aan die ter uitvoering van het plan, bedoeld in
      [artikel 2, eerste lid][ref1], tot taak heeft:

      a. het jaarlijks ramen van de behoefte aan bloed, tussenproducten en bloedproducten;

      b. het voorzien in de benodigde bloedproducten in Bonaire, Sint Eustatius en Saba door inzameling of invoer.

      2 De aanwijzing vindt slechts plaats indien wordt voldaan aan de volgende eisen:

      a. de rechtspersoon is gevestigd in de openbare lichamen Bonaire, Sint Eustatius en Saba of Nederland;

      b. de werkzaamheid van de rechtspersoon is niet gericht op het behalen van winst;

      c. de rechtspersoon is, wat betreft zijn organisatie, personeel en materieel, in staat de in het eerste lid
      bedoelde taken op verantwoorde wijze te vervullen.

      3 Onze Minister kan de aanwijzing onder beperkingen verlenen en aan de aanwijzing voorschriften verbinden. Hij
      kan, gehoord de rechtspersoon, de beperkingen en voorschriften wijzigen en nieuwe beperkingen en voorschriften
      vaststellen.

      4 Onze Minister kan de aanwijzing intrekken indien:

      a. de rechtspersoon daarom verzoekt;

      b. de rechtspersoon een of meer van de in het eerste lid bedoelde taken niet of niet verantwoord vervult of het
      bepaalde bij of krachtens deze wet niet naleeft;

      c. naar het oordeel van Onze Minister het belang van een doelmatige bloedvoorziening zulks vordert; dan wel

      d. een bijzondere omstandigheid daartoe aanleiding geeft.

      5 De aanwijzing alsmede de beperkingen waaronder deze is verleend en de voorschriften die daaraan zijn verbonden en
      voorts de intrekking van de aanwijzing worden bekendgemaakt in de Staatscourant.

      6 Bij algemene maatregel van bestuur, kunnen regels worden gesteld met betrekking tot de overdracht van de in het
      eerste lid, onder b bedoelde activiteiten ingeval een aanwijzing is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0028454#Artikel2
