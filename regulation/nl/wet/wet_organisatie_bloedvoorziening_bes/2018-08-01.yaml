    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *Onze Minister:* Onze Minister van Volksgezondheid, Welzijn en Sport;
        - *bestuurscollege:* het bestuurscollege van de openbare lichamen Bonaire, Sint Eustatius en Saba;
        - *Bloedvoorzieningsorganisatie:* de krachtens [artikel 3, eerste lid][ref1], aangewezen rechtspersoon;
        - *donor:* persoon die een deel van zijn bloed of een bestanddeel van een deel van zijn bloed afstaat voor gebruik
      in het kader van de geneeskundige behandeling van andere personen of ten behoeve van wetenschappelijk onderzoek;
        - *inzamelen van bloed:* het werven, oproepen en keuren van donoren en het bij donoren afnemen van bloed,
      bloedcellen of bloedplasma;
        - *product:* menselijk bloed, alsmede daaruit afgescheiden bestanddelen, waaraan al dan niet een andere substantie
      is toegevoegd;
        - *tussenproduct:* product, niet geschikt voor toediening aan de mens;
        - *bloedproduct:* product, geschikt voor toediening aan de mens;
        - *bloedvoorziening:* het geheel van maatregelen en middelen terzake van onder meer het inzamelen van bloed en het
      bereiden en afleveren van tussenproducten en bloedproducten.

      2. Met een donor wordt gelijkgesteld de persoon die een deel van zijn bloed of een bestanddeel van een deel van
      zijn bloed laat afzonderen ten behoeve van de geneeskundige behandeling van zichzelf.

      3. De [artikelen 4, eerste lid][ref2], [12, tweede lid][ref3], [13, eerste lid][ref4], [15, eerste lid][ref5], en
      [16, eerste lid][ref6], en de daarop berustende bepalingen zijn niet van toepassing op bloed of een bestanddeel
      van bloed dat ofwel is afgestaan uitsluitend ten behoeve van de geneeskundige behandeling van een bepaalde andere
      persoon, ofwel is afgezonderd ten behoeve van de geneeskundige behandeling van de donor zelf. De genoemde artikelen
      zijn evenmin van toepassing op uit het in de vorige volzin bedoelde bloed bereide bloedproducten.


