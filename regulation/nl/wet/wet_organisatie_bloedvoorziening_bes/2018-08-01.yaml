  - number: '17'
    text: |-
      Bij algemene maatregel van bestuur, kan worden bepaald dat bij het indienen van een aanvraag om een aanwijzing als
      bedoeld in de [artikelen 12, eerste lid, onder c][ref1], en [13, eerste lid, onder d][ref2], dan wel een vergunning
      als bedoeld in de [artikelen 15, eerste lid][ref3], en [16, eerste lid][ref4], een bedrag moet worden betaald,
      waarvan de hoogte bij die algemene maatregel van bestuur wordt geregeld, doch ten hoogste de kosten verbonden
      aan de behandeling van het verzoek en de afgifte van de aanwijzing of vergunning mag bedragen. Bij ministeriële
      regeling met algemene werking kunnen regels worden gesteld omtrent de wijze van betaling.


      [ref1]: https://wetten.overheid.nl/BWBR0028454#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0028454#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0028454#Artikel15
