  - number: '14'
    text: |-
      Het is verboden de aflevering van bloedproducten en tussenproducten te laten geschieden tegen een vergoeding
      die meer bedraagt dan de kosten welke ten behoeve van het inzamelen van bloed, het bereiden, bewaren, verpakken,
      etiketteren of afleveren zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0028454/2018-08-01#Artikel14
  - number: '15'
    text: |-
      1 Het is verboden bloedproducten en tussenproducten uit een ander land in te voeren zonder vergunning van Onze
      Minister.

      2 Onze Minister verleent een vergunning slechts indien naar zijn oordeel het belang van een in geneeskundig opzicht
      doelmatige voorziening in de behoefte aan bloedproducten en tussenproducten zulks vordert dan wel een bijzondere
      omstandigheid daartoe aanleiding geeft.

      3 Indien het in het tweede lid genoemde belang zulks vordert, onderscheidenlijk indien een bijzondere omstandigheid
      daartoe aanleiding geeft, kan Onze Minister voorschriften aan de vergunning verbinden of de vergunning onder
      beperkingen verlenen. De vergunning kan worden ingetrokken. [Artikel 3, derde en vierde lid][ref1], is van
      overeenkomstige toepassing.

      4 Het in het eerste lid vervatte verbod geldt niet:

      a. ten aanzien van de invoer vanuit het land Curaçao op last van de Bloedvoorzieningsorganisatie;

      b. ten aanzien van een persoon die bij het overschrijden van de grens in het bezit is van een hoeveelheid van een
      bloedproduct, welke kennelijk voor eigen gebruik is bestemd;

      c. ten aanzien van een instelling van wetenschappelijk onderzoek, voor zover het in te voeren bloedproduct of
      tussenproduct bestemd is voor wetenschappelijk onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0028454#Artikel3
    url: https://wetten.overheid.nl/BWBR0028454/2018-08-01#Artikel15
    references:
      - id: ref1
