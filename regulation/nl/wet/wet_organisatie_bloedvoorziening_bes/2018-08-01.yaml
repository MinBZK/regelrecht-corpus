  - number: '20'
    text: |-
      1 Met hechtenis van ten hoogste zes maanden of geldboete van ten hoogste een boete van de vijfde categorie wordt
      gestraft degene die handelt in strijd met:

      a. de [artikelen 4, eerste of tweede lid][ref1], [10, vierde lid][ref2], [12, eerste of tweede lid][ref3],
      [13, eerste lid][ref4], [14][ref5], [15, eerste lid][ref6], of [16, eerste lid][ref7];

      b. een krachtens de [artikelen 12, derde lid][ref8], [13, derde lid][ref9], [15, derde lid][ref10], of
      [16, derde lid][ref11], aan een aanwijzing onderscheidenlijk vergunning verbonden voorschrift.

      2 De in het eerste lid strafbaar gestelde feiten zijn overtredingen.


