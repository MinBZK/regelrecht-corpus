  - number: '8'
    text: |-
      1 De Bloedvoorzieningsorganisatie brengt jaarlijks vóór 1 juni verslag uit aan Onze Minister over de vervulling van
      haar taken en de uitvoering van de werkzaamheden in het afgelopen kalenderjaar. Onze Minister kan regels stellen
      over de inrichting van het verslag.

      2 Zodra de Bloedvoorzieningsorganisatie het jaarverslag en de jaarrekening heeft vastgesteld, stelt zij deze aan
      Onze Minister ter beschikking.
    url: https://wetten.overheid.nl/BWBR0028454/2018-08-01#Artikel8
  - number: '9'
    text: |-
      1 De Bloedvoorzieningsorganisatie verstrekt voor een goede uitvoering van deze wet Onze Minister de door deze
      gevraagde gegevens.

      2 De Bloedvoorzieningsorganisatie deelt wijzigingen in de organisatie, het personeel of het materieel, die
      ingrijpende gevolgen hebben voor het vervullen van de taken, bedoeld in [artikel 3, eerste lid][ref1], mede aan
      Onze Minister.

      3 De Bloedvoorzieningsorganisatie stelt Onze Minister onverwijld in kennis van elk geval van risico’s voor het
      leven of de gezondheid van mensen, ontstaan of te vrezen als gevolg van gebreken in de bloedvoorziening in Bonaire,
      Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0028454#Artikel3
    url: https://wetten.overheid.nl/BWBR0028454/2018-08-01#Artikel9
