  - number: '7'
    text: |-
      1 De Bloedvoorzieningsorganisatie dient jaarlijks vóór 1 december een begroting en een beleidsplan in bij Onze
      Minister.

      2 Bij ministeriële regeling met algemene werking kunnen regels worden gesteld over de inrichting van de begroting
      en het beleidsplan.

      3 De begroting en het beleidsplan behoeven de goedkeuring van Onze Minister.

      4 Onze Minister onthoudt zijn goedkeuring aan de begroting of het beleidsplan indien deze in strijd zijn met het
      bepaalde bij of krachtens deze wet, waaronder begrepen het plan, bedoeld in [artikel 2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028454#Artikel2
