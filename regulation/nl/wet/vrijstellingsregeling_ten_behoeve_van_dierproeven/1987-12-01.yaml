articles:
  - number: '1'
    text: |-
      Van het verbod gesteld in [artikel 2, eerste lid, van de Diergeneesmiddelenwet][ref1] (Stb. 1985, 410) wordt
      vrijstelling verleend voor zover het betreft het voorhanden hebben, in voorraad hebben of toepassen van
      diergeneesmiddelen ten behoeve van dierproeven, voor zover deze proeven worden verricht in het kader van de
      [Wet op de dierproeven][ref2] (Stb. 1977, 70) door de in deze wet bedoelde vergunninghouders.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003081
