    text: |-
      Het rangschikkingsbedrag, bedoeld voor de vergelijking van de fasebedragen op grond van
      [artikel 58, tweede lid, van het besluit][ref1], wordt berekend volgens de formule in het tweede lid en voor de
      uitdrukking in euro per 1.000 kg vermindering van broeikasgas vermenigvuldigd met de factor 1.000 en afgerond op
      drie decimalen.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel58
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel88
