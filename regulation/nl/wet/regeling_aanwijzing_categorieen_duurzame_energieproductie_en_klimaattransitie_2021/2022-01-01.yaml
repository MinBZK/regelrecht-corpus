    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare warmte of hernieuwbare
      elektriciteit en hernieuwbare warmte, geproduceerd door een productie-installatie voor de productie van
      hernieuwbare warmte of hernieuwbare elektriciteit en hernieuwbare warmte, uitsluitend door middel van thermische
      conversie van vaste of vloeibare biomassa als bedoeld in de NTA 8003: 2017, met uitzondering van biomassa als
      bedoeld in de nummers 100, 150, 170 tot en met 179 van de NTA 8003: 2017, met een nominaal thermisch vermogen van
      ten minste 5 MWth, waarvoor reeds subsidie op grond van het [Besluit SDE][ref1] is verstrekt en waarvoor op het
      moment van aanvraag ten minste negen jaar voordien de subsidieperiode is aangevangen.

      2 De biomassa die in de productie-installatie, bedoeld in het eerste lid, wordt toegepast, is voor ten minste 97%
      van de energetische waarde biogeen.


