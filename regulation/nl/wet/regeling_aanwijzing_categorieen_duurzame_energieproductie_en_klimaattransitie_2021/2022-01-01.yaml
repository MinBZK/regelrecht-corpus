        bwb_id: BWBR0045389
        artikel: '85'
        paragraaf: '3'
  - number: 5.1.a
    text: |-
      binnen twee weken na afgifte van de betreffende beschikking tot subsidieverlening is een uitvoeringsovereenkomst
      tot stand gekomen tussen de Staat en de subsidieontvanger;
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel5
  - number: 5.1.b
    text: |-
      de subsidieontvanger heeft binnen vier weken na afgifte van de beschikking tot subsidieverlening aangetoond dat een
      bankgarantie als bedoeld in [artikel 2, eerste lid][ref1], van de uitvoeringsovereenkomst is afgegeven.


