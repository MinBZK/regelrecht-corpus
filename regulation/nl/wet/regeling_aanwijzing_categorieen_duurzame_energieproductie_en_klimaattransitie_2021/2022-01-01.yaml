      1 De minister verstrekt op aanvraag subsidie aan een producent van geavanceerde hernieuwbare brandstof, die in
      Nederland worden geleverd aan wegvoertuigen of binnenvaartschepen en wordt ingeboekt in het register hernieuwbare
      energie vervoer, bedoeld in [paragraaf 9.7.5 van de Wet milieubeheer][ref1], en die wordt geproduceerd door een
      productie-installatie waarmee:

      a. bioethanol wordt geproduceerd uit vaste lignocellulosehoudende biomassa, waarvan maximaal 50% B-Hout is als
      bedoeld in nummers 170 t/m 179 van de NTA 8003: 2017;

      b. bioLNG wordt geproduceerd door middel van monomestvergisting;

      c. bioLNG wordt geproduceerd door middel van allesvergisting; of

      d. diesel- en benzinevervangers worden geproduceerd uit gehydrogeneerde pyrolyse-olie uit vaste
      lignocellulosehoudende biomassa, waarvan maximaal 50% B-Hout is als bedoeld in nummers 170 t/m 179 van de NTA 8003:
      2017.

      2 De productie-installatie, bedoeld in het eerste lid, onderdelen b en c, maakt uitsluitend gebruik van
      grondstoffen als bedoeld in deel A van bijlage IX bij de [richtlijn (EU) 2018/2001](32018L2001).

      3 De productie-installatie, bedoeld in het eerste lid, onderdelen a en d, maakt uitsluitend gebruik van vaste
      grondstoffen als bedoeld onder o) met uitzondering van zwart residuloog, bruin residuloog, vezelslib, lignine en
      tallolie, en q) van deel A van Bijlage IX bij de [richtlijn (EU) 2018/2001](32018L2001).


