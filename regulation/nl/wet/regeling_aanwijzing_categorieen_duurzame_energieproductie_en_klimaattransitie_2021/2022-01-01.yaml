      drie jaar na de datum van inwerkingtreding van de beschikking tot subsidieverlening in gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0045389#Artikel23
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0045389
        artikel: '23'
        paragraaf: '3'
  - number: '24.4'
    text: |-
      De subsidieontvanger neemt de productie-installatie, bedoeld in
      [artikel 23, eerste lid, onderdelen d, e, f en g][ref1], binnen vier jaar na de datum van inwerkingtreding van de
      beschikking tot subsidieverlening in gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0045389#Artikel23
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0045389
        artikel: '23'
        paragraaf: '3'
  - number: '24.5'
    text: |-
      [Artikel 3, eerste lid, van de algemene uitvoeringsregeling][ref1] is niet van toepassing op een productie-
      installatie als bedoeld in [artikel 23, eerste lid, onderdelen a en b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023563#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0045389#Artikel23
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0023563
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0045389
        artikel: '23'
        paragraaf: '3'
  - number: '25'
    text: 'De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbaar gas geproduceerd door:'
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel25
  - number: 25.a
    text: |-
      een productie-installatie waarmee hernieuwbaar gas wordt geproduceerd uitsluitend door middel van allesvergisting,
      waarbij ten minste de vergister nieuw is;
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel25
  - number: 25.b
    text: |-
      een productie-installatie waarmee hernieuwbaar gas wordt geproduceerd door middel van monomestvergisting, met een
      productie-installatie met een vermogen groter dan 400 kW, waarbij ten minste de vergister nieuw is; of
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel25
  - number: 25.c
    text: |-
      een productie-installatie waarmee hernieuwbaar gas wordt geproduceerd door middel van monomestvergisting, met een
      productie-installatie met een vermogen kleiner dan of gelijk aan 400 kW, waarbij ten minste de vergister nieuw is.
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel25
  - number: '26.1'
    text: |-
      De subsidie, bedoeld in [artikel 25][ref1], wordt voor een periode van twaalf jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0045389#Artikel25
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0045389
        artikel: '25'
        paragraaf: '3'
  - number: '26.2'
    text: |-
      De subsidieontvanger neemt de productie-installatie binnen vier jaar na de datum van inwerkingtreding van de
      beschikking tot subsidieverlening in gebruik.
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel26
  - number: '26.3'
    text: |-
      De subsidieontvanger draagt er zorg voor dat wordt aangetoond dat de in een installatie met een totaal nominaal
      thermisch vermogen van de gasopwaardeerinstallatie gelijk aan of groter dan 20 MW gebruikte biomassa voldoet aan de
      duurzaamheids- en broeikasgasemissiereductiecriteria, bedoeld in [artikel 29, eerste lid][ref1], van de [richtlijn
      (EU) 2018/2001](32018L2001).


      [ref1]: https://wetten.overheid.nl/BWBR0045389#Artikel29
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0045389
        artikel: '29'
        paragraaf: '3'
  - number: '27'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbaar gas geproduceerd door een productie-
      installatie die ingrijpend wordt gerenoveerd en waarmee:
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel27
  - number: 27.a
    text: |-
      uitsluitend door middel van allesvergisting hernieuwbaar gas wordt geproduceerd met een productie-installatie
      waarvoor reeds subsidie op grond van het [Besluit SDE][ref1] is verstrekt als productie-installatie voor de
      productie van hernieuwbare elektriciteit of hernieuwbare warmte, waarbij ten minste de opwerkinstallatie waarmee
      biogas op aardgaskwaliteit wordt gebracht nieuw is en waarvoor op het moment van aanvraag ten minste negen jaar
      voordien de subsidieperiode is aangevangen;


      [ref1]: https://wetten.overheid.nl/BWBR0022735
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0022735
  - number: 27.b
    text: |-
      uitsluitend door middel van allesvergisting hernieuwbaar gas wordt geproduceerd, waarvoor reeds subsidie op grond
      van het [Besluit SDE][ref1] is verstrekt als productie-installaties voor de productie van hernieuwbaar gas en
      waarvoor op het moment van aanvraag ten minste negen jaar voordien de subsidieperiode is aangevangen;


      [ref1]: https://wetten.overheid.nl/BWBR0022735
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0022735
  - number: 27.c
    text: |-
      uitsluitend door middel van monomestvergisting met een vermogen kleiner dan of gelijk aan 400 kW hernieuwbaar
      gas wordt geproduceerd, waarvoor reeds subsidie op grond van het [Besluit SDE][ref1] is verstrekt als productie-
      installaties voor de productie van hernieuwbare elektriciteit of hernieuwbare warmte, waarbij ten minste de
      opwerkinstallatie waarmee biogas op aardgaskwaliteit wordt gebracht nieuw is en waarvoor op het moment van aanvraag
      ten minste negen jaar voordien de subsidieperiode is aangevangen; of


      [ref1]: https://wetten.overheid.nl/BWBR0022735
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0022735
  - number: 27.d
    text: |-
      uitsluitend door middel van monomestvergisting met een vermogen kleiner dan of gelijk aan 400 kW hernieuwbaar
      gas wordt geproduceerd, waarvoor reeds subsidie op grond van het [Besluit SDE][ref1] is verstrekt als productie-
      installaties voor de productie van hernieuwbaar gas en waarvoor op het moment van aanvraag ten minste negen jaar
      voordien de subsidieperiode is aangevangen.


      [ref1]: https://wetten.overheid.nl/BWBR0022735
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0022735
  - number: '28.1'
    text: |-
      De subsidie, bedoeld in [artikel 27][ref1], wordt voor een periode van twaalf jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0045389#Artikel27
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0045389
        artikel: '27'
        paragraaf: '3'
  - number: '28.2'
    text: |-
      De subsidieontvanger neemt de productie-installatie binnen vier jaar na de datum van inwerkingtreding van de
      beschikking tot subsidieverlening in gebruik.
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel28
  - number: '28.3'
    text: |-
      Een subsidieontvanger draagt er zorg voor dat wordt aangetoond dat de in een installatie met een totaal nominaal
      thermisch vermogen van de gasopwaardeerinstallatie gelijk aan of groter dan 20 MW gebruikte biomassa voldoet aan de
      duurzaamheids- en broeikasgasemissiereductiecriteria, bedoeld in [artikel 29, eerste lid][ref1], van de [richtlijn
      (EU) 2018/2001](32018L2001).


      [ref1]: https://wetten.overheid.nl/BWBR0045389#Artikel29
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0045389
        artikel: '29'
        paragraaf: '3'
  - number: '29.1'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbaar gas geproduceerd door een productie-
      installatie voor de productie van hernieuwbaar gas uit biogas dat vrijkomt ten gevolge van een biologische
      afbraakreactie van gisting van zuiveringsslib:
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel29
  - number: 29.1.a
    text: |-
      waarbij er verbeteringen zijn uitgevoerd in het productieproces waarna er per ton slib sprake is van ten minste 25%
      meer biogasproductie ten opzichte van voor de verbetering; en
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel29
  - number: 29.1.b
    text: |-
      waarbij ten minste de installatiedelen die verantwoordelijk zijn voor de aanvullende productie van biogas nieuw
      zijn.
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel29
  - number: '29.2'
    text: |-
      De installatiedelen die verantwoordelijk zijn voor de aanvullende productie, worden niet in gebruik genomen voor de
      subsidie is aangevraagd.
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel29
  - number: '30.1'
    text: |-
      De subsidie, bedoeld in [artikel 29, eerste lid][ref1], wordt voor een periode van twaalf jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0045389#Artikel29
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0045389
        artikel: '29'
        paragraaf: '3'
  - number: '30.2'
    text: |-
      De subsidieontvanger neemt de productie-installatie binnen vier jaar na de datum van inwerkingtreding van de
      beschikking tot subsidieverlening in gebruik.
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel30
  - number: '30.3'
    text: |-
      De subsidieaanvrager maakt aannemelijk dat de voorgestelde aanpassingen een verbetering van 25% inhouden ten
      opzichte van de gemiddelde productie van het jaar voorafgaande aan de aanvraag, of, wanneer hij minder dan een jaar
      produceert, ten opzichte van de totale gemiddelde productie tot het moment van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel30
  - number: '30.4'
    text: |-
      De subsidieontvanger draagt er zorg voor dat wordt aangetoond dat de in de productie-installatie met een totaal
      nominaal thermisch vermogen van de gasopwaardeerinstallatie gelijk aan of groter dan 20 MW gebruikte biomassa
      voldoet aan het broeikasgasemissiereductiecriterium, bedoeld in [artikel 29, eerste lid][ref1], van de [richtlijn
      (EU) 2018/2001](32018L2001).


      [ref1]: https://wetten.overheid.nl/BWBR0045389#Artikel29
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0045389
        artikel: '29'
        paragraaf: '3'
  - number: '31'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbaar gas geproduceerd door een productie-
      installatie voor de productie van hernieuwbaar gas uit biogas dat vrijkomt ten gevolge van een biologische
      afbraakreactie van gisting van zuiveringsslib, waarbij ten minste de opwerkinstallatie waarmee biogas op
      aardgaskwaliteit wordt gebracht nieuw is.
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel31
  - number: '32.1'
    text: |-
      De subsidie, bedoeld in [artikel 31][ref1], wordt voor een periode van twaalf jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0045389#Artikel31
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0045389
        artikel: '31'
        paragraaf: '3'
  - number: '32.2'
    text: |-
      De subsidieontvanger neemt de productie-installatie binnen vier jaar na de datum van inwerkingtreding van de
      beschikking tot subsidieverlening in gebruik.
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel32
  - number: '32.3'
    text: |-
      De subsidieontvanger draagt er zorg voor dat wordt aangetoond dat de in de productie-installatie met een totaal
      nominaal thermisch uitgangsvermogen van de gasopwaardeerinstallatie gelijk aan of groter dan 20 MW gebruikte
      biomassa voldoet aan het broeikasgasemissiereductiecriterium, bedoeld in [artikel 29, eerste lid][ref1], van de
      [richtlijn (EU) 2018/2001](32018L2001).


      [ref1]: https://wetten.overheid.nl/BWBR0045389#Artikel29
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0045389
        artikel: '29'
        paragraaf: '3'
  - number: '33'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbaar gas, niet zijnde biosyngas,
      geproduceerd door een productie-installatie voor de productie van hernieuwbaar gas door middel van vergassing,
      waarbij ten minste de vergasser nieuw is, uit:
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel33
  - number: 33.a
    text: 'biomassa als bedoeld in de NTA 8003: 2017; of'
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel33
  - number: 33.b
    text: |-
      biomassa als bedoeld in de NTA 8003: 2017, met uitzondering van B-Hout als bedoeld in nummers 100, 150, 170 t/m 179
      van de NTA 8003: 2017.
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel33
  - number: '34.1'
    text: |-
      De subsidie, bedoeld in [artikel 33][ref1], wordt voor een periode van twaalf jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0045389#Artikel33
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0045389
        artikel: '33'
        paragraaf: '3'
  - number: '34.2'
    text: |-
      De subsidieontvanger neemt de productie-installatie binnen vier jaar na de datum van inwerkingtreding van de
      beschikking tot subsidieverlening in gebruik.
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel34
  - number: '34.3'
    text: |-
      De subsidieontvanger draagt er zorg voor dat ten minste 97% van de energetische waarde van de jaarlijks in de
      productie-installatie gebruikte brandstof biogeen is.
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel34
  - number: '34.4'
    text: |-
      De subsidieontvanger draagt er zorg voor dat wordt aangetoond dat de gebruikte vloeibare biomassa, dan wel de in
      een installatie met een totaal nominaal thermisch vermogen van de gasopwaardeerinstallatie gelijk aan of groter dan
      20 MW gebruikte overige biomassa voldoet aan de duurzaamheids- en broeikasgasemissiereductiecriteria, bedoeld in
      [artikel 29, eerste lid][ref1], van de [richtlijn (EU) 2018/2001](32018L2001).


      [ref1]: https://wetten.overheid.nl/BWBR0045389#Artikel29
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0045389
        artikel: '29'
        paragraaf: '3'
  - number: '35.1'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare warmte geproduceerd door een
      productie-installatie die uitsluitend voorziet in de productie van hernieuwbare warmte uit zonne-energie, en
      waarbij uitsluitend gebruik wordt gemaakt van afgedekte collectoren waarbij de transparante isolerende laag, niet
      zijnde beglazing van kassen of fotovoltaïsche zonnepanelen, een geïntegreerd geheel vormt met de collector, met een
      totaal thermisch vermogen:
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel35
  - number: 35.1.a
    text: groter dan of gelijk aan 140 kWth en kleiner dan 1 MWth; of
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel35
  - number: 35.1.b
    text: groter dan of gelijk aan 1 MWth.
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel35
  - number: '35.2'
    text: |-
      Het vermogen in kWth van de productie-installatie wordt berekend door de apertuuroppervlakte in vierkante meter te
      vermenigvuldigen met een factor 0,7.
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel35
  - number: '35.3'
    text: |-
      De subsidie wordt niet verstrekt indien reeds op basis van
      [artikel 4.5.2. van de Regeling nationale EZK- en LNV-subsidies][ref1] subsidie is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: '4'
  - number: '36.1'
    text: |-
      De subsidie, bedoeld in [artikel 35, eerste lid][ref1], wordt voor een periode van vijftien jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0045389#Artikel35
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0045389
        artikel: '35'
        paragraaf: '3'
  - number: '36.2'
    text: |-
      De subsidieontvanger neemt de productie-installatie binnen drie jaar na de datum van inwerkingtreding van de
      beschikking tot subsidieverlening in gebruik.
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel36
  - number: '36.3'
    text: |-
      De subsidieontvanger draagt er zorg voor dat de opgewekte hernieuwbare warmte die voor subsidie in aanmerking komt,
      wordt aangewend als nuttig aangewende warmte.
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel36
  - number: '37'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare warmte, hernieuwbare elektriciteit of
      hernieuwbare elektriciteit en hernieuwbare warmte geproduceerd door:
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel37
  - number: 37.a
    text: |-
      een productie-installatie waarmee hernieuwbare warmte wordt geproduceerd door middel van allesvergisting, waarbij
      ten minste de vergister nieuw is;
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel37
  - number: 37.b
    text: |-
      een productie-installatie waarmee hernieuwbare elektriciteit en hernieuwbare warmte worden geproduceerd door middel
      van allesvergisting, waarbij ten minste de vergister nieuw is en waarbij het nominaal elektrisch rendement ten
      minste 20% bedraagt;
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel37
  - number: 37.c
    text: |-
      een productie-installatie waarmee hernieuwbare warmte wordt geproduceerd door middel van monomestvergisting, met
      een vermogen groter dan 400 kW, waarbij ten minste de vergister nieuw is;
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel37
  - number: 37.d
    text: |-
      een productie-installatie waarmee hernieuwbare elektriciteit en hernieuwbare warmte worden geproduceerd door middel
      van monomestvergisting, met een vermogen groter dan 400 kW, voor elektrisch en thermisch vermogen samen, waarbij
      ten minste de vergister nieuw is en waarbij het nominaal elektrisch rendement ten minste 20% bedraagt;
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel37
  - number: 37.e
    text: |-
      een productie-installatie waarmee hernieuwbare warmte wordt geproduceerd door middel van monomestvergisting, met
      een vermogen kleiner dan of gelijk aan 400 kW, waarbij ten minste de vergister nieuw is; of
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel37
  - number: 37.f
    text: |-
      een productie-installatie waarmee hernieuwbare elektriciteit en hernieuwbare warmte worden geproduceerd door
      middel van monomestvergisting, met een vermogen kleiner dan of gelijk aan 400 kW, voor elektrisch en thermisch
      vermogen samen, waarbij ten minste de vergister nieuw is en waarbij het nominaal elektrisch rendement ten minste
      20% bedraagt.
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel37
  - number: '38.1'
    text: |-
      De subsidie, bedoeld in [artikel 37][ref1], wordt voor een periode van twaalf jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0045389#Artikel37
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0045389
        artikel: '37'
        paragraaf: '3'
  - number: '38.2'
    text: |-
      De subsidieontvanger neemt de productie-installatie binnen vier jaar na de datum van inwerkingtreding van de
      beschikking tot subsidieverlening in gebruik.
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel38
  - number: '38.3'
    text: |-
      De subsidieontvanger draagt er zorg voor dat de opgewekte hernieuwbare warmte die voor subsidie in aanmerking komt,
      wordt aangewend als nuttig aangewende warmte.
