  - number: '55'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare warmte, of hernieuwbare elektriciteit
      en hernieuwbare warmte, door middel van verbranding van houtpellets, met een brander in een ketel, een oven of een
      fornuis met een nominaal thermisch vermogen groter dan of gelijk aan 5 MWth en een nominaal elektrisch vermogen
      kleiner dan of gelijk aan 100 MWth waarin:

      a. houtpellets geproduceerd uit biomassa als bedoeld in de nummers 110 tot en met 138 van de NTA 8003: 2017 worden
      verbrand;

      b. reststoffen die vrijkomen uit bioraffinage als bedoeld in nummer 595 van de NTA 8003:2017, van biomassa als
      bedoeld in de nummers 110 tot en met 138 van de NTA 8003:2017, worden verbrand voor ten hoogste 25% van het aantal
      kWh dat in een kalenderjaar voor subsidie in aanmerking komt; of

      c. houtpellets geproduceerd uit biomassa als bedoeld in de nummers 160 tot en met 169 van de NTA 8003: 2017 worden
      verbrand, voor ten hoogste vijftien vijfentachtigste deel van de som van het aantal kWh dat in een kalenderjaar
      voor subsidie in aanmerking komt, geproduceerd met biomassa als bedoeld in de onderdelen a en b.
