  - number: '69.1'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van koolstofdioxide-arme warmte geproduceerd door
      een productie-installatie voor de productie van warmte uit zonne-energie die integraal onderdeel uitmaakt van een
      nieuwe tuinbouwkas.
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel69
  - number: '69.2'
    text: 'De productie-installatie, bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel69
  - number: 69.2.a
    text: |-
      maakt gebruik van een optisch en zonvolgend systeem waarbij zonlicht wordt geconcentreerd op collectorbuizen met
      een thermisch vermogen dat ten minste vier keer het nominaal thermisch vermogen van de warmtepomp bedraagt;
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel69
  - number: 69.2.b
    text: heeft een seizoensopslag van warmte;
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel69
  - number: 69.2.c
    text: wordt niet gebruikt voor koudelevering; en
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel69
  - number: 69.2.d
    text: |-
      maakt gebruik van een warmtepomp met een COP-waarde van ten minste 5,0 en een nominaal thermisch vermogen van ten
      minste 500 kWth.
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel69
  - number: '70.1'
    text: |-
      De subsidie, bedoeld in [artikel 69, eerste lid][ref1], wordt voor een periode van vijftien jaar verstrekt.


