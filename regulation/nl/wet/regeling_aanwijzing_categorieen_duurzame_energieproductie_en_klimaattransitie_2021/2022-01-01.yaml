      van ten minste 3,0 en met een nominaal thermisch vermogen van ten minste 500 kWth; of

      b. een productie-installatie, bestaande uit één of meer doubletten, waarmee koolstofdioxide-arme warmte wordt
      geproduceerd uitsluitend door middel van één of meer geothermische bronnen met een diepte van ten minste 500 meter
      en kleiner dan 1.500 meter, waarbij de warmte wordt opgewaardeerd met een compressiewarmtepomp met een COP-waarde
      van ten minste 3,0 en met een nominaal thermisch vermogen van ten minste 500 kWth en de warmte wordt aangewend voor
      de verwarming van gebouwde omgeving.
