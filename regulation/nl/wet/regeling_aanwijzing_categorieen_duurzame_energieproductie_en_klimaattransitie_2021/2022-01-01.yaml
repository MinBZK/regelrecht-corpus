  - number: '6'
    text: |-
      1 Als te renoveren productie-installaties waarvoor subsidie kan worden verstrekt als bedoeld in
      [artikel 3, eerste lid, onderdeel c, en derde lid, onderdeel c, van het besluit][ref1] worden aangewezen productie-
      installaties waarmee hernieuwbare elektriciteit wordt geproduceerd als bedoeld in [artikel 11, onderdeel c][ref2].

      2 Als productie-installaties die als bedoeld in [artikel 3, tweede lid, onderdeel a, van het besluit][ref3] worden
      aangewezen:

      a. productie-installaties waarmee hernieuwbaar gas door biomassa wordt geproduceerd als bedoeld in
      [artikel 27][ref4];

      b. productie-installaties waarmee hernieuwbare warmte of hernieuwbare elektriciteit en hernieuwbare warmte uit
      biomassa wordt geproduceerd als bedoeld in [artikel 39][ref5]; en

      c. productie-installaties waarmee hernieuwbare warmte of hernieuwbare elektriciteit en hernieuwbare warmte uit
      biomassa wordt geproduceerd als bedoeld in de [artikelen 43][ref6] en [57, eerste lid][ref7].

      3 Als te renoveren productie-installaties waarvoor subsidie kan worden verstrekt als bedoeld in
      [artikel 3, tweede lid, onderdeel c, van het besluit][ref8] worden aangewezen:

      a. productie-installaties waarmee hernieuwbaar gas door biomassa wordt geproduceerd als bedoeld in
      [artikel 27][ref9]; en

      b. productie-installaties waarmee hernieuwbare warmte of hernieuwbare elektriciteit en hernieuwbare warmte uit
      biomassa wordt geproduceerd als bedoeld in [artikel 39][ref10].

      4 Als productie-installaties waarvoor subsidie wordt verstrekt indien deze geheel of deels bestaat uit gebruikte
      materialen als bedoeld in [artikel 3, vierde lid, van het besluit][ref11] worden aangewezen:

      a. productie-installaties waarmee hernieuwbaar gas wordt geproduceerd als bedoeld in de [artikelen 25][ref12],
      [27][ref13], [29, eerste lid][ref14], [31][ref15] en [33][ref16];

      b. productie-installaties waarmee hernieuwbare warmte, hernieuwbare elektriciteit of hernieuwbare
      elektriciteit en hernieuwbare warmte wordt geproduceerd als bedoeld in de [artikelen 37][ref17], [39][ref18],
      [41, eerste lid][ref19], [43][ref20], [45, eerste lid][ref21], [47, eerste lid][ref22], [49, eerste lid][ref23],
      [51 eerste lid][ref24], [53, eerste lid][ref25], [55][ref26], [57, eerste lid][ref27] en [61, onderdeel f][ref28];

      c. productie-installaties waarmee koolstofdioxide-arme warmte wordt geproduceerd als bedoeld in
      [artikel 77, eerste lid][ref29];

      d. productie-installaties waarmee koolstofdioxide wordt afgevangen en permanent opgeslagen als bedoeld in
      [artikel 83, eerste lid][ref30]; en

      e. productie-installaties waarmee koolstofdioxide wordt afgevangen en gebruikt als bedoeld in
      [artikel 85, eerste lid][ref31].


