  - number: '65'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van koolstofdioxide-arme warmte geproduceerd door een
      productie-installatie voor de productie van warmte onttrokken uit drinkwater of oppervlaktewater die niet wordt
      gebruikt voor koudelevering, waarbij de warmte wordt opgewaardeerd door middel van een warmtepomp met een COP-
      waarde van ten minste 3,0 met een nominaal thermisch vermogen van ten minste 500 kWth, met een seizoensopslag van
      warmte en waarbij het aantal subsidiabele vollasturen:
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel65
  - number: 65.a
    text: |-
