      kWh dat in een kalenderjaar voor subsidie in aanmerking komt; of

      c. houtpellets geproduceerd uit biomassa als bedoeld in de nummers 160 tot en met 169 van de NTA 8003: 2017 worden
      verbrand, voor ten hoogste vijftien vijfentachtigste deel van de som van het aantal kWh dat in een kalenderjaar
      voor subsidie in aanmerking komt, geproduceerd met biomassa als bedoeld in de onderdelen a en b.

      2 De productie-installatiestoot per normaal kubieke meter minder dan 5 milligram stof, minder dan 100 milligram
      stikstofoxiden, minder dan 60 milligram zwaveldioxiden en minder dan 5 milligram ammoniak uit.
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel53
  - number: '54'
    text: |-
      1 De subsidie, bedoeld in [artikel 53, eerste lid][ref1], wordt voor een periode van twaalf jaar verstrekt.

      2 De subsidieontvanger neemt de productie-installatie binnen vier jaar na de datum van inwerkingtreding van de
      beschikking tot subsidieverlening in gebruik.

      3 De subsidieontvanger draagt er zorg voor dat ten minste 97% van de energetische waarde van de jaarlijks in de
      productie-installatie gebruikte brandstof biogeen is.

      4 De subsidieontvanger draagt er zorg voor dat de opgewekte hernieuwbare warmte die voor subsidie in aanmerking
      komt, wordt aangewend als nuttig aangewende warmte.

      5 De subsidieontvanger draagt er zorg voor dat in voldoende mate aannemelijk wordt gemaakt
      dat de gebruikte biomassa voldoet aan de duurzaamheidseisen voor vaste biomassa, bedoeld in
      [artikel 7 van de algemene uitvoeringsregeling][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0045389#Artikel53
