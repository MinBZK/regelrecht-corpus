  - number: '3'
    text: |-
      1 De maximale vermindering van broeikasgas in kg die in aanmerking komt voor subsidies voor de afvang en permanente
      opslag van koolstofdioxide op grond van [artikel 83, eerste lid][ref1], die worden aangevraagd in de periode,
      genoemd in [artikel 2, eerste lid][ref2], bedraagt, gerekend voor de hele looptijd van die subsidies:

      a. 70.500.000.000 kg voor de koolstofdioxide afkomstig van door subsidieontvangers uitgevoerde economische
      activiteiten met SBI-code 06, 08 tot en met 33, 35.2, 35.3 of 38: en

      b. 45.000.000.000 kg voor de koolstofdioxide afkomstig van door subsidieontvangers uitgevoerde economische
      activiteiten met SBI-code 35.1 of afkomstig van economische activiteiten met SBI-code 35.1 die vrijkomt bij de
      verbranding van een bijproduct afkomstig van door subsidieontvangers uitgevoerde economische activiteiten met SBI-
      code 06, 08 tot en met 33, 35.2, 35.3 of 38.

      2 Indien bij een subsidie als bedoeld in het eerste lid de koolstofdioxide deels afkomstig is als bijproduct van
      een activiteit als bedoeld in het eerste lid, onderdeel a, en deels van een activiteit als bedoeld in het eerste
      lid, onderdeel b, wordt alle koolstofdioxide toegerekend:

      a. aan de maximale vermindering van broeikasgas in kg, bedoeld in het eerste lid, onderdeel b; en vervolgens

      b. aan de maximale vermindering van broeikasgas, bedoeld in het eerste lid, onderdeel a.

      3 De maximale vermindering van broeikasgas die in aanmerking komt voor subsidies voor de productie van geavanceerde
      hernieuwbare brandstof op grond van [artikel 81, eerste lid][ref3], die worden aangevraagd in de periode, genoemd
      in [artikel 2, eerste lid][ref4], komt overeen met 7.400.000.000 kWh, gerekend voor de hele looptijd van de
      subsidies.


