  - number: '25'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbaar gas geproduceerd door:

      a. een productie-installatie waarmee hernieuwbaar gas wordt geproduceerd uitsluitend door middel van
      allesvergisting, waarbij ten minste de vergister nieuw is;

      b. een productie-installatie waarmee hernieuwbaar gas wordt geproduceerd door middel van monomestvergisting, met
      een productie-installatie met een vermogen groter dan 400 kW, waarbij ten minste de vergister nieuw is; of

      c. een productie-installatie waarmee hernieuwbaar gas wordt geproduceerd door middel van monomestvergisting, met
      een productie-installatie met een vermogen kleiner dan of gelijk aan 400 kW, waarbij ten minste de vergister nieuw
      is.
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel25
  - number: '26'
    text: |-
      1 De subsidie, bedoeld in [artikel 25][ref1], wordt voor een periode van twaalf jaar verstrekt.

      2 De subsidieontvanger neemt de productie-installatie binnen vier jaar na de datum van inwerkingtreding van de
      beschikking tot subsidieverlening in gebruik.

      3 De subsidieontvanger draagt er zorg voor dat wordt aangetoond dat de in een installatie met een totaal nominaal
      thermisch vermogen van de gasopwaardeerinstallatie gelijk aan of groter dan 20 MW gebruikte biomassa voldoet aan de
      duurzaamheids- en broeikasgasemissiereductiecriteria, bedoeld in [artikel 29, eerste lid][ref2], van de [richtlijn
      (EU) 2018/2001](32018L2001).


      [ref1]: https://wetten.overheid.nl/BWBR0045389#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0045389#Artikel29
