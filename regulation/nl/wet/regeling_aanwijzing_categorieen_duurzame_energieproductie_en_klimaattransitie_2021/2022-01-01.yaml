  - number: '75.1'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van koolstofdioxide-arme warmte geproduceerd door een
      productie-installatie voor de productie van warmte door middel van:
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel75
  - number: 75.1.a
    text: |-
      een gesloten warmtepomp of compressiewarmtepomp met een COP-waarde van ten minste 2,3 en een nominaal thermisch
      vermogen van ten minste 500 kWth; of
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel75
  - number: 75.1.b
    text: |-
      een open warmtepomp of mechanische damprecompressie-installatie met een COP-waarde van ten minste 2,3 en ten
      hoogste 12,0 en een nominaal thermisch vermogen van ten minste 500 kWth.
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel75
  - number: '75.2'
    text: |-
      De productie-installatie produceert warmte die op dezelfde locatie wordt gebruikt voor een industriële toepassing
      en levert geen koude.
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel75
  - number: '76.1'
    text: |-
      De subsidie, bedoeld in [artikel 75, eerste lid][ref1], wordt voor een periode van twaalf jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0045389#Artikel75
