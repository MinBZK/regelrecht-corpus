      verwarming van gebouwde omgeving;
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel65
  - number: 65.b
    text: |-
      ten hoogste 3.500 vollasturen per jaar bedraagt en de productie-installatie uitsluitend warmte levert voor
      verwarming van gebouwde omgeving; of
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel65
  - number: 65.c
    text: ten hoogste 3.500 vollasturen per jaar bedraagt.
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel65
