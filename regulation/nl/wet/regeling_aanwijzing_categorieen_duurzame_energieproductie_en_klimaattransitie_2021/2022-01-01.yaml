        artikel: '2'
        paragraaf: '2'
  - number: '5.2'
    text: |-
      Voor het opstellen van de uitvoeringsovereenkomst als bedoeld in het eerste lid wordt gebruik gemaakt van het in
      [bijlage 1][ref1] opgenomen model.


      [ref1]: https://wetten.overheid.nl/BWBR0045389
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0045389
  - number: '5.3'
    text: |-
      Het eerste lid is niet van toepassing op een productie-installatie als bedoeld in
      [artikel 9b, eerste lid, onderdeel a, van de Elektriciteitswet 1998][ref1].


