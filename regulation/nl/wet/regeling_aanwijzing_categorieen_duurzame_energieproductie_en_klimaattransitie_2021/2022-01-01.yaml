      genoemde aantal uren;

      c. de basisenergieprijs, bedoeld in [artikel 45, eerste lid, van het besluit][ref3], voor de productie van
      hernieuwbare warmte, hernieuwbare elektriciteit of de gecombineerde opwekking van hernieuwbare elektriciteit en
      hernieuwbare warmte, vastgesteld op het in de vijfde kolom van onderstaande tabel genoemde bedrag; en

      d. de correcties op het basisbedrag voor subsidie voor een productie-installatie als bedoeld in het in de eerste
      kolom van onderstaande tabel genoemde artikel, worden voor 2021 vastgesteld op:

      1°. voor de energie- of elektriciteitsprijs, bedoeld in [artikel 14, eerste lid, onderdeel a][ref4], of
      [47, eerste lid, onderdeel a, van het besluit][ref5], het in de zesde kolom van onderstaande tabel genoemde bedrag;

      2°. voor de correcties, bedoeld in [artikel 47, eerste lid, onderdeel b, van het besluit][ref6], op € 0 per kWh; en

      3°. voor de correcties, bedoeld in [artikel 47, eerste lid, onderdeel c, van het besluit][ref7], het in de zevende
      kolom van onderstaande tabel genoemde bedrag.













