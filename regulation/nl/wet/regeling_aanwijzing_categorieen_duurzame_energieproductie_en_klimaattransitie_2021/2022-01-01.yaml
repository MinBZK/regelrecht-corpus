  - number: '37'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare warmte, hernieuwbare elektriciteit of
      hernieuwbare elektriciteit en hernieuwbare warmte geproduceerd door:

      a. een productie-installatie waarmee hernieuwbare warmte wordt geproduceerd door middel van allesvergisting,
      waarbij ten minste de vergister nieuw is;

      b. een productie-installatie waarmee hernieuwbare elektriciteit en hernieuwbare warmte worden geproduceerd door
      middel van allesvergisting, waarbij ten minste de vergister nieuw is en waarbij het nominaal elektrisch rendement
      ten minste 20% bedraagt;

      c. een productie-installatie waarmee hernieuwbare warmte wordt geproduceerd door middel van monomestvergisting, met
      een vermogen groter dan 400 kW, waarbij ten minste de vergister nieuw is;

      d. een productie-installatie waarmee hernieuwbare elektriciteit en hernieuwbare warmte worden geproduceerd door
      middel van monomestvergisting, met een vermogen groter dan 400 kW, voor elektrisch en thermisch vermogen samen,
      waarbij ten minste de vergister nieuw is en waarbij het nominaal elektrisch rendement ten minste 20% bedraagt;

      e. een productie-installatie waarmee hernieuwbare warmte wordt geproduceerd door middel van monomestvergisting, met
      een vermogen kleiner dan of gelijk aan 400 kW, waarbij ten minste de vergister nieuw is; of

      f. een productie-installatie waarmee hernieuwbare elektriciteit en hernieuwbare warmte worden geproduceerd door
      middel van monomestvergisting, met een vermogen kleiner dan of gelijk aan 400 kW, voor elektrisch en thermisch
      vermogen samen, waarbij ten minste de vergister nieuw is en waarbij het nominaal elektrisch rendement ten minste
      20% bedraagt.
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel37
