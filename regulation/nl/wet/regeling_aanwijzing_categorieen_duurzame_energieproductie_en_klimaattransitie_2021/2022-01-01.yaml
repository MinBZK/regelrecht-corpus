  - number: '23'
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare elektriciteit geproduceerd door
      een productie-installatie voor de productie van hernieuwbare elektriciteit uit zonlicht uitsluitend door middel
      van fotovoltaïsche zonnepanelen, die is aangesloten op een elektriciteitsnet via een aansluiting met een totale
      maximale doorlaatwaarde van meer dan 3*80 A:

      a. met een totaal nominaal vermogen groter dan of gelijk aan 15 kWp en kleiner dan 1 MWp, waarbij de zonnepanelen
      op of aan een gebouw zijn aangebracht;

      b. met een totaal nominaal vermogen groter dan of gelijk aan 15 kWp en kleiner dan 1 MWp, waarbij de zonnepanelen,
      niet met een gebouw verbonden, op land staan of op water drijven;

      c. met een totaal nominaal vermogen groter dan of gelijk aan 1 MWp, waarbij de zonnepanelen op of aan een gebouw
      zijn aangebracht;

      d. met een totaal nominaal vermogen groter dan of gelijk aan 1 MWp, waarbij de zonnepanelen, niet met een gebouw
      verbonden, op land staan;

      e. met een totaal nominaal vermogen groter dan of gelijk aan 1 MWp, waarbij de zonnepanelen op water drijven;

      f. met een totaal nominaal vermogen groter dan of gelijk aan 1 MWp, waarbij de zonnepanelen, niet met een gebouw
      verbonden, op land staan, en automatisch met de stand van de zon meebewegen door middel van een zonvolgsysteem; of

      g. met een totaal nominaal vermogen groter dan of gelijk aan 1 MWp, waarbij de zonnepanelen op water drijven en
      automatisch met de stand van de zon meebewegen door middel van een zonvolgsysteem.

      2 Voor de werking van dit artikel wordt onder gebouw tevens verstaan een aan de grond gebonden overkapping ten
      behoeve van het tegen weersinvloeden beschermd parkeren van voertuigen.
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel23
  - number: '24'
    text: |-
      1 De subsidie, bedoeld in [artikel 23, eerste lid][ref1], wordt voor een periode van vijftien jaar verstrekt.

      2 De subsidieontvanger neemt de productie-installatie, bedoeld in [artikel 23, eerste lid, onderdelen a en b][ref2],
      binnen twee jaar na de datum van inwerkingtreding van de beschikking tot subsidieverlening in gebruik.

      3 De subsidieontvanger neemt de productie-installatie, bedoeld in [artikel 23, eerste lid, onderdeel c][ref3],
      binnen drie jaar na de datum van inwerkingtreding van de beschikking tot subsidieverlening in gebruik.

      4 De subsidieontvanger neemt de productie-installatie, bedoeld in
      [artikel 23, eerste lid, onderdelen d, e, f en g][ref4], binnen vier jaar na de datum van inwerkingtreding van de
      beschikking tot subsidieverlening in gebruik.

      5 [Artikel 3, eerste lid, van de algemene uitvoeringsregeling][ref5] is niet van toepassing op een productie-
      installatie als bedoeld in [artikel 23, eerste lid, onderdelen a en b][ref6].


