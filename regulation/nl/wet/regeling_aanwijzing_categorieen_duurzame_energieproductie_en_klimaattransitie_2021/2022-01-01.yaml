  - number: '71.1'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van koolstofdioxide-arme warmte geproduceerd door een
      productie-installatie die voorziet in de productie van warmte uit zonne-energie en buitenluchtwarmte door middel
      van zonnecollectoren die warmte en stroom produceren, waarbij de warmte wordt aangewend voor de verwarming van
      gebouwde omgeving.
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel71
  - number: '71.2'
    text: |-
      De productie-installatie, bedoeld in het eerste lid, maakt gebruik van een water-water-warmtepomp van minimaal 500
      kWth en een COP-waarde van ten minste 3,0, waarbij de oppervlakte aan fotovoltaïsch-thermische panelen minimaal
      1,2 m2 per kWth aan vermogen van de warmtepomp bedraagt.
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel71
  - number: '72.1'
    text: |-
      De subsidie, bedoeld in [artikel 71, eerste lid][ref1], wordt voor een periode van vijftien jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0045389#Artikel71
