  - number: '7'
    text: |-
      1 Als productie-installaties waarvoor het verschil in kWh kan worden opgeteld als bedoeld in
      [artikel 15, derde en vierde lid, van het besluit][ref1] worden aangewezen productie-installaties
      waarmee hernieuwbare elektriciteit wordt geproduceerd als bedoeld in de [artikelen 11][ref2], [13][ref3],
      [15, eerste lid][ref4], [17, eerste lid][ref5], [19, eerste lid][ref6], en [21, eerste lid][ref7]. Het verschil in
      kWh dat bij het aantal geproduceerde kWh van het volgende jaar kan worden opgeteld, bedoeld in artikel 15, vierde
      lid, van het besluit, wordt gemaximeerd op 25% van het aantal kWh dat het desbetreffende jaar voor subsidie in
      aanmerking komt.

      2 Als productie-installaties waarvoor het verschil in kWh kan worden opgeteld als bedoeld in
      [artikel 15, derde en vierde lid, van het besluit][ref8] worden aangewezen productie-installaties waarmee
      hernieuwbare elektriciteit wordt geproduceerd als bedoeld in [artikel 23, eerste lid][ref9]. Het verschil in kWh
      dat bij het aantal geproduceerde kWh van het volgende jaar kan worden opgeteld, bedoeld in artikel 15, vierde
      lid, van het besluit, wordt gemaximeerd op 25% van het aantal kWh dat het desbetreffende jaar voor subsidie in
      aanmerking komt. Bij de benutting van de opgetelde kWh, bedoeld in artikel 15, vierde lid, van het besluit, wordt
      de productie verdeeld in een deel netlevering en een deel niet-netlevering op basis van de verhouding tussen de
      geproduceerde energie die aan het net geleverd is en de energie die niet aan het net geleverd is in het voorgaande
      jaar.

      3 Als productie-installaties waarvoor het verschil in kWh kan worden opgeteld als bedoeld in
      [artikel 32, derde en vierde lid, van het besluit][ref10] worden aangewezen productie-installaties waarmee
      hernieuwbaar gas wordt geproduceerd als bedoeld in de [artikelen 25][ref11], [27][ref12], [29, eerste lid][ref13],
      [31][ref14] en [33][ref15]. Het verschil in kWh dat bij het aantal geproduceerde kWh van het volgende jaar kan
      worden opgeteld, bedoeld in artikel 32, vierde lid, van het besluit, wordt gemaximeerd op 25% van het aantal kWh
      dat het desbetreffende jaar voor subsidie in aanmerking komt.

      4 Als productie-installaties waarvoor het verschil in kWh kan worden opgeteld als bedoeld in
      [artikel 48, derde en vierde lid, van het besluit][ref16] worden aangewezen productie-installaties
      waarmee hernieuwbare warmte, hernieuwbare elektriciteit of hernieuwbare elektriciteit en hernieuwbare
      warmte wordt geproduceerd als bedoeld in de [artikelen 35, eerste lid][ref17], [37][ref18], [39][ref19],
      [41, eerste lid][ref20], [43][ref21], [45, eerste lid][ref22], [47, eerste lid][ref23], [49, eerste lid][ref24],
      [51, eerste lid][ref25], [53, eerste lid][ref26], [55][ref27], [57, eerste lid][ref28], [59, eerste lid][ref29],
      en [61][ref30].

      5 Voor de productie-installaties, bedoeld in het vierde lid, wordt het verschil in kWh
      dat bij het aantal geproduceerde kWh van het volgende jaar kan worden opgeteld, bedoeld in
      [artikel 48, vierde lid, van het besluit][ref31], gemaximeerd op 25% van het aantal kWh dat het desbetreffende jaar
      voor subsidie in aanmerking komt.

      6 Als productie-installaties waarvoor het verschil in kWh kan worden opgeteld als bedoeld in
      [artikel 55j, derde en vierde lid, van het besluit][ref32] worden aangewezen:

      a. productie-installaties waarmee koolstofdioxide-arme warmte wordt geproduceerd als bedoeld in de
      [artikelen 63][ref33], [65][ref34], [67, eerste lid][ref35], [69, eerste lid][ref36], [71, eerste lid][ref37],
      [75, eerste lid][ref38], en [77, eerste lid][ref39];

      b. productie-installaties waarmee geavanceerde hernieuwbare brandstof wordt geproduceerd als bedoeld in
      [artikel 81, eerste lid][ref40];

      c. productie-installaties waarmee koolstofdioxide wordt afgevangen en permanent opgeslagen als bedoeld in
      [artikel 83, eerste lid][ref41]; en

      d. productie-installaties waarmee koolstofdioxide wordt afgevangen en gebruikt als bedoeld in
      [artikel 85, eerste lid][ref42].

      7 Voor de productie-installatie, bedoeld in het zesde lid, wordt het verschil in kg verminderde broeikasgas
      dat bij het aantal kg verminderde broeikasgas van het volgende jaar kan worden opgeteld, bedoeld in
      [artikel 55j, vierde lid, van het besluit][ref43], gemaximeerd op 25% van het aantal kg verminderde broeikasgas dat
      het desbetreffende jaar voor subsidie in aanmerking komt.

      8 Als productie-installaties waarvoor het verschil in kWh kan worden opgeteld als bedoeld in
      [artikel 55j, derde lid, van het besluit][ref44] worden aangewezen:

      a. productie-installaties waarmee koolstofdioxide-arme warmte wordt geproduceerd als bedoeld in
      [artikel 73, eerste lid][ref45]; en

      b. productie-installaties waarmee waterstof wordt geproduceerd als bedoeld in [artikel 79, eerste lid][ref46].


