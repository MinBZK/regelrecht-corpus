    text: |-
      De subsidieontvanger draagt er zorg voor dat de opgewekte koolstofdioxide-arme warmte die voor subsidie in
      aanmerking komt, wordt aangewend als nuttig aangewende koolstofdioxide-arme warmte.
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel72
  - number: '73.1'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van koolstofdioxide-arme warmte geproduceerd door een
      productie-installatie voor de productie van warmte door middel van elektriciteit in een ketel.
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel73
  - number: '73.2'
    text: |-
      De productie-installatie heeft een nominaal thermisch vermogen van ten minste 5 MWth, waarbij de geproduceerde
      warmte wordt toegepast in een verwarmingssysteem met een aanvoertemperatuur aan de gebruikerszijde van ten minste
      100 °C in het stookseizoen of in een stoomsysteem.
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel73
  - number: '73.3'
    text: |-
      Het vermogen van de aansluiting op het elektriciteitsnet is ten minste even groot als het vermogen van de
      elektroboiler.
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel73
  - number: '73.4'
    text: |-
      Het vermogen van de elektroboiler is niet groter dan het thermisch vermogen van de op de locatie aanwezige boilers
      die gestookt worden op fossiele brandstoffen en het maximale thermische vermogen dat zij gelijktijdig kunnen
      leveren.
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel73
  - number: '74.1'
    text: |-
      De subsidie, bedoeld in [artikel 73, eerste lid][ref1], wordt voor een periode van vijftien jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0045389#Artikel73
