  - number: '7.1'
    text: |-
      Als productie-installaties waarvoor het verschil in kWh kan worden opgeteld als bedoeld in
      [artikel 15, derde en vierde lid, van het besluit][ref1] worden aangewezen productie-installaties
      waarmee hernieuwbare elektriciteit wordt geproduceerd als bedoeld in de [artikelen 11][ref2], [13][ref3],
      [15, eerste lid][ref4], [17, eerste lid][ref5], [19, eerste lid][ref6], en [21, eerste lid][ref7]. Het verschil in
      kWh dat bij het aantal geproduceerde kWh van het volgende jaar kan worden opgeteld, bedoeld in artikel 15, vierde
      lid, van het besluit, wordt gemaximeerd op 25% van het aantal kWh dat het desbetreffende jaar voor subsidie in
      aanmerking komt.


