  - number: '11'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare elektriciteit geproduceerd
      door een productie-installatie waarmee door hydro-mechanisch-elektrische omzetting hernieuwbare elektriciteit
      wordt geproduceerd uit potentiële of kinetische energie van stromend water dat niet specifiek voor de
      elektriciteitsproductie omhoog is gepompt:

      a. in installaties met een valhoogte kleiner dan 50 centimeter;

      b. in installaties met een valhoogte gelijk aan of groter dan 50 centimeter; of

      c. in installaties met een valhoogte gelijk aan of groter dan 50 centimeter, die ingrijpend zijn gerenoveerd en
      waarbij ten minste de turbines nieuw zijn.
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel11
  - number: '12'
    text: |-
      1 De subsidie, bedoeld in [artikel 11][ref1], wordt voor een periode van vijftien jaar verstrekt.

      2 De subsidieontvanger neemt de productie-installatie binnen vier jaar na de datum van inwerkingtreding van de
      beschikking tot subsidieverlening in gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0045389#Artikel11
