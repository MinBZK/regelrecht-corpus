      Nederland worden geleverd aan wegvoertuigen of binnenvaartschepen en wordt ingeboekt in het register hernieuwbare
      energie vervoer, bedoeld in [paragraaf 9.7.5 van de Wet milieubeheer][ref1], en die wordt geproduceerd door een
      productie-installatie waarmee:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Paragraaf9.7.5
