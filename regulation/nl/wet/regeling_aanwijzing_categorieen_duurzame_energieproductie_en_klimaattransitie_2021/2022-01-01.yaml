      1 De minister verstrekt op aanvraag subsidie aan een producent van koolstofdioxide-arme warmte geproduceerd door
      een productie-installatie voor de productie van warmte door middel van elektriciteit in een ketel.

      2 De productie-installatie heeft een nominaal thermisch vermogen van ten minste 5 MWth, waarbij de geproduceerde
      warmte wordt toegepast in een verwarmingssysteem met een aanvoertemperatuur aan de gebruikerszijde van ten minste
      100 °C in het stookseizoen of in een stoomsysteem.

      3 Het vermogen van de aansluiting op het elektriciteitsnet is ten minste even groot als het vermogen van de
      elektroboiler.

      4 Het vermogen van de elektroboiler is niet groter dan het thermisch vermogen van de op de locatie aanwezige
      boilers die gestookt worden op fossiele brandstoffen en het maximale thermische vermogen dat zij gelijktijdig
      kunnen leveren.
