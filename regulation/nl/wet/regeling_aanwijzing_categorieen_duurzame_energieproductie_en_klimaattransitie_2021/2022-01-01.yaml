    text: bioLNG wordt geproduceerd door middel van allesvergisting; of
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel81
  - number: 81.1.d
    text: |-
      diesel- en benzinevervangers worden geproduceerd uit gehydrogeneerde pyrolyse-olie uit vaste lignocellulosehoudende
      biomassa, waarvan maximaal 50% B-Hout is als bedoeld in nummers 170 t/m 179 van de NTA 8003: 2017.
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel81
  - number: '81.2'
    text: |-
