  - number: '61'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare warmte geproduceerd door:

      a. een productie-installatie met een vermogen tot 20 MW, bestaande uit één of meer doubletten, waarmee hernieuwbare
      warmte wordt geproduceerd uitsluitend door middel van één of meer geothermische bronnen met een diepte van ten
      minste 1.500 meter;

      b. een productie-installatie met een vermogen van ten minste 20 MW, bestaande uit één of meer doubletten, waarmee
      hernieuwbare warmte wordt geproduceerd uitsluitend door middel van één of meer geothermische bronnen met een diepte
      van ten minste 1.500 meter;

      c. een productie-installatie, bestaande uit één of meer doubletten, waarmee uitsluitend door middel van één of meer
      geothermische bronnen met een diepte van ten minste 1.500 meter hernieuwbare warmte wordt geproduceerd die wordt
      aangewend voor verwarming van gebouwde omgeving;

      d. een productie-installatie met een vermogen tot 20 MW, bestaande uit één of meer doubletten, waarmee hernieuwbare
      warmte wordt geproduceerd, gebruikmakend van ten minste één olie- of gasput met een diepte van ten minste 1.500
      meter;

      e. een productie-installatie met een vermogen van ten minste 20 MW, bestaande uit één of meer doubletten, waarmee
      hernieuwbare warmte wordt geproduceerd, gebruikmakend van ten minste één olie- of gasput met een diepte van
      tenminste 1.500 meter;

      f. een productie-installatie als bedoeld in de onderdelen a, b, d of e, waarvoor op het moment van aanvragen reeds
      een subsidie is verleend op grond van het [besluit][ref1] of het Besluit SDE, die wordt uitgebreid met ten minste
      één aanvullende put met een diepte van ten minste 1.500 meter; of

      g. een productie-installatie, bestaande uit één of meer doubletten, waarmee hernieuwbare warmte wordt geproduceerd
      uitsluitend door middel van één of meer geothermische bronnen met een diepte van ten minste 4.000 meter.


      [ref1]: https://wetten.overheid.nl/BWBR0022735
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel61
    references:
