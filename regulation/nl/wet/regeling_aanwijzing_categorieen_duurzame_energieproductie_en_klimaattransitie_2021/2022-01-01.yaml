      1 De minister verstrekt op aanvraag subsidie aan een producent die met een productie-installatie koolstofdioxide
      afvangt en permanent opslaat of doet opslaan door een houder van een vergunning voor het exploiteren van
      een broeikasgasinstallatie als bedoeld in [artikel 16.5 van de Wet milieubeheer][ref1], in een ondergronds
      opslagvoorkomen voor koolstofdioxide waarbij:

      a. het aantal subsidiabele vollasturen ten hoogste 4.000 vollasturen per jaar bedraagt, de afvang van
      koolstofdioxide gebeurt in een op het moment van indienen van de aanvraag bestaand productieproces, gebruik wordt
      gemaakt van gasvormig transport van koolstofdioxide door een buisleiding, waarbij de producent valt onder het
      systeem van verhandelbare broeikasgasemissierechten, bedoeld in [titel 16.2 van de Wet milieubeheer][ref2] en ten
      minste de compressor nieuw is;

      b. het aantal subsidiabele vollasturen ten hoogste 8.000 vollasturen per jaar bedraagt, de afvang van
      koolstofdioxide gebeurt in een op het moment van indienen van de aanvraag bestaand productieproces, gebruik wordt
      gemaakt van gasvormig transport van koolstofdioxide door een buisleiding en ten minste de compressor nieuw is;

      c. het aantal subsidiabele vollasturen ten hoogste 4.000 vollasturen per jaar bedraagt, de afvang van
      koolstofdioxide gebeurt in een op het moment van indienen van de aanvraag bestaand productieproces, gebruik
      wordt gemaakt van vloeibaar transport van koolstofdioxide en waarbij de producent valt onder het systeem van
      verhandelbare broeikasgasemissierechten, bedoeld in [titel 16.2 van de Wet milieubeheer][ref3];

      d. het aantal subsidiabele vollasturen ten hoogste 8.000 vollasturen per jaar bedraagt, de afvang van
      koolstofdioxide gebeurt in een op het moment van indienen van de aanvraag bestaand productieproces, gebruik wordt
      gemaakt van vloeibaar transport van koolstofdioxide en ten minste de vervloeiingsinstallatie nieuw is;

      e. de afvang van koolstofdioxide gebeurt in een op het moment van indienen van de aanvraag bestaand
      productieproces, gebruik wordt gemaakt van gasvormig transport van koolstofdioxide door een buisleiding en ten
      minste de installatie voor de afvang van koolstofdioxide en de compressor nieuw zijn;

      f. de afvang van koolstofdioxide gebeurt in een op het moment van indienen van de aanvraag bestaand
      productieproces, gebruik wordt gemaakt van vloeibaar transport van koolstofdioxide en ten minste de installatie
      voor de afvang van koolstofdioxide en de vervloeiingsinstallatie nieuw zijn;

      g. de afvang van koolstofdioxide die ontstaat bij een op het moment van indienen bestaand
      verbrandingsproces, gebruik wordt gemaakt van gasvormig transport van koolstofdioxide door een buisleiding,
      waarbij de producent valt onder het systeem van verhandelbare broeikasgasemissierechten, bedoeld in
      [titel 16.2 van de Wet milieubeheer][ref4] en ten minste de installatie voor de afvang van koolstofdioxide en de
      compressor nieuw zijn;

      h. de afvang van koolstofdioxide die ontstaat bij een op het moment van indienen van de aanvraag bestaand
      verbrandingsproces, gebruik wordt gemaakt van gasvormig transport van koolstofdioxide door een buisleiding,
      waarbij de producent niet valt onder het systeem van verhandelbare broeikasgasemissierechten, bedoeld in
      [titel 16.2 van de Wet milieubeheer][ref5] en ten minste de installatie voor de afvang van koolstofdioxide en de
      compressor nieuw zijn;

      i. de afvang van koolstofdioxide die ontstaat door een op het moment van indienen van de aanvraag
      bestaand verbrandingsproces, gebruik wordt gemaakt van vloeibaar transport van koolstofdioxide,
      waarbij de producent valt onder het systeem van verhandelbare broeikasgasemissierechten, bedoeld in
      [titel 16.2 van de Wet milieubeheer][ref6] en ten minste de installatie voor de afvang van koolstofdioxide en ten
      minste de installatie voor de afvang van koolstofdioxide en de vervloeiingsinstallatie nieuw zijn;

      j. de afvang van koolstofdioxide die ontstaat door een op het moment van indienen van de aanvraag
      bestaand verbrandingsproces, gebruik wordt gemaakt van vloeibaar transport van koolstofdioxide, waarbij
      de producent niet valt onder het systeem van verhandelbare broeikasgasemissierechten, bedoeld in
      [titel 16.2 van de Wet milieubeheer][ref7] en ten minste de installatie voor de afvang van koolstofdioxide en de
      vervloeiingsinstallatie nieuw zijn;

      k. de afvang van koolstofdioxide gebeurt in een nieuw productieproces, gebruik wordt gemaakt van gasvormig
      transport van koolstofdioxide door een buisleiding en ten minste de installatie voor de afvang van koolstofdioxide
      en de compressor nieuw zijn;

      l. de afvang van koolstofdioxide gebeurt in een nieuw productieproces, gebruik wordt gemaakt van
      vloeibaar transport van koolstofdioxide ten minste de installatie voor de afvang van koolstofdioxide en de
      vervloeiingsinstallatie nieuw zijn;

      m. de afvang van koolstofdioxide die ontstaat door een nieuw verbrandingsproces, gebruik wordt gemaakt van
      gasvormig transport van koolstofdioxide door een buisleiding en ten minste de installatie voor de afvang van
      koolstofdioxide en de compressor nieuw zijn;

      n. de afvang van koolstofdioxide die ontstaat door een nieuw verbrandingsproces, gebruik wordt gemaakt van
      vloeibaar transport van koolstofdioxide en ten minste de installatie voor de afvang van koolstofdioxide en de
      vervloeiingsinstallatie nieuw zijn;

      o. het aantal subsidiabele vollasturen ten hoogste 4.000 vollasturen per jaar bedraagt, de afvang van
      koolstofdioxide gebeurt in een op het moment van indienen van de aanvraag bestaand productieproces, gebruik wordt
      gemaakt van gasvormig transport van koolstofdioxide door een buisleiding, waarbij de producent niet valt onder het
      systeem van verhandelbare broeikasgasemissierechten, bedoeld in [titel 16.2 van de Wet milieubeheer][ref8] en ten
      minste de compressor nieuw is; of

      p. het aantal subsidiabele vollasturen ten hoogste 4.000 vollasturen per jaar bedraagt, de afvang van
      koolstofdioxide gebeurt in een op het moment van indienen van de aanvraag bestaand productieproces, gebruik
      wordt gemaakt van vloeibaar transport van koolstofdioxide, waarbij de producent niet valt onder het systeem van
      verhandelbare broeikasgasemissierechten, bedoeld in [titel 16.2 van de Wet milieubeheer][ref9].

      2 Een productie-installatie als bedoeld in het eerste lid, aanhef en onderdeel
      a of o, kan worden gecombineerd met een productie-installatie als bedoeld in
      [artikel 85, eerste lid, aanhef en onderdeel a, b, c, f, g, h, i, j, k, l of m][ref10].

      3 Een productie-installatie als bedoeld in het eerste lid, aanhef en onderdeel c of p, kan worden gecombineerd met
      een productie-installatie als bedoeld in [artikel 85, eerste lid, aanhef en onderdeel b, g, j of m][ref11].


