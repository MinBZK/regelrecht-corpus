  - number: '77'
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een producent van koolstofdioxide-arme warmte geproduceerd door
      een productie-installatie waarmee restwarmte wordt uitgekoppeld met een thermisch vermogen van ten minste 2 MWth en
      naar een andere locatie wordt getransporteerd waarbij ten minste de warmtewisselaar bij de uitkoppeling nieuw is,
      waarbij transport plaatsvindt met behulp van een transportleiding:

      a. met een verhouding van kilometer nieuw aan te leggen transportleiding per MWth outputvermogen van de productie-
      installatie en andere op de transportleiding invoedende installaties van ≥ 0,20 en < 0,30;

      b. met een verhouding van kilometer nieuw aan te leggen transportleiding per MWth outputvermogen van de productie-
      installatie en andere op de transportleiding invoedende installaties van ≥ 0,30 en < 0,40;

      c. met een verhouding van kilometer nieuw aan te leggen transportleiding per MWth outputvermogen van de productie-
      installatie en andere op de transportleiding invoedende installaties van ≥ 0,40 en < 0,50;

      d. met een verhouding van kilometer nieuw aan te leggen transportleiding per MWth outputvermogen van de productie-
      installatie en andere op de transportleiding invoedende installaties van ≥ 0,50; of

      e. waarbij de warmte wordt opgewaardeerd met een nieuwe warmtepomp met een nominaal thermisch vermogen van ten
      minste 500 kWth en een COP-waarde van ten minste 3,0.

      2 De levering van stoom wordt uitgesloten van subsidie.
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel77
  - number: '78'
    text: |-
      1 De subsidie, bedoeld in [artikel 77, eerste lid][ref1], wordt voor een periode van vijftien jaar verstrekt.

      2 De subsidieontvanger neemt de productie-installatie binnen vier jaar na de datum van inwerkingtreding van de
      beschikking tot subsidieverlening in gebruik.

      3 De subsidieontvanger draagt er zorg voor dat de opgewekte koolstofdioxide-arme warmte die voor subsidie in
      aanmerking komt, wordt aangewend als nuttig aangewende koolstofdioxide-arme warmte.


