        bwb_id: BWBR0001936
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001936
        artikel: '3'
  - number: 4.1.b
    text: |-
      de subsidieaanvrager voor de investering in de productie-installatie beschikt over
      een verklaring van de minister dat sprake is van energie-investeringen op grond van
      [artikel 3.42, eerste lid, van de Wet inkomstenbelasting 2001][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 4.1.c
    text: |-
      voor dezelfde productie-installatie reeds subsidie is verstrekt op grond van de
      [Subsidieregeling coöperatieve energieopwekking][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044882
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0044882
  - number: '4.2'
    text: |-
      Bij het overleggen van de toestemming van de eigenaar, bedoeld in het eerste lid, onderdeel a, wordt gebruik
      gemaakt van het middel dat door de minister beschikbaar wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel4
  - number: '5.1'
    text: |-
      Een subsidie als bedoeld in de [artikelen 83, eerste lid, onderdelen e tot met n][ref1], en
      [85, eerste lid, onderdelen a, b, c, en f tot en met m][ref2], of een subsidie van meer dan € 400.000.000,- wordt
      verleend onder de volgende opschortende voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0045389#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0045389#Artikel85
