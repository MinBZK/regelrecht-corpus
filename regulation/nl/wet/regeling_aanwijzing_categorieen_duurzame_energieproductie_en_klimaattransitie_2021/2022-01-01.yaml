      1 Het rangschikkingsbedrag, bedoeld voor de vergelijking van de fasebedragen op grond van
      [artikel 58, tweede lid, van het besluit][ref1], wordt berekend volgens de formule in het tweede lid en voor de
      uitdrukking in euro per 1.000 kg vermindering van broeikasgas vermenigvuldigd met de factor 1.000 en afgerond op
      drie decimalen.

      2 De formule voor de berekening van het rangschikkingsbedrag luidt:

      a. voor productie-installaties voor de productie van hernieuwbare elektriciteit, hernieuwbaar gas, hernieuwbare
      warmte of hernieuwbare warmte en hernieuwbare elektriciteit: het quotiënt van het verschil tussen het fasebedrag
      waarvoor de aanvrager de aanvraag heeft ingediend en de langetermijnenergieprijs als vastgesteld in de derde kolom
      van de in dit lid opgenomen tabel, en de omrekenfactor vastgesteld in de vierde kolom van de in dit lid opgenomen
      tabel;

      b. voor productie-installaties voor vermindering van broeikasgas: het quotiënt van het verschil tussen het
      fasebedrag waarvoor de aanvrager de aanvraag heeft ingediend en het langetermijnbroeikasgasbedrag als vastgesteld
      in de derde kolom van de in dit lid opgenomen tabel, en de omrekenfactor vastgesteld in de vierde kolom van de in
      dit lid opgenomen tabel.










