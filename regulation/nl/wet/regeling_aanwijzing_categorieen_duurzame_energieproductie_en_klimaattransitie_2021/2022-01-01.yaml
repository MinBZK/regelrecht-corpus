      Voor een productie-installatie als bedoeld in het in de eerste kolom van onderstaande tabel genoemde artikel wordt:

      a. het basisbedrag voor subsidie, bedoeld in [artikel 44, eerste lid, van het besluit][ref1], voor de productie
      van hernieuwbare warmte en de gecombineerde opwekking van hernieuwbare elektriciteit en hernieuwbare warmte,
      vastgesteld op het in de derde kolom van onderstaande tabel genoemde bedrag;

      b. voor de productie van hernieuwbare warmte, hernieuwbare elektriciteit of de gecombineerde opwekking
