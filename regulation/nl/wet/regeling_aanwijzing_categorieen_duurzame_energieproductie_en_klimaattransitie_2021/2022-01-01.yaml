  - number: '41'
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare warmte of hernieuwbare
      elektriciteit en hernieuwbare warmte geproduceerd door een productie-installatie voor de productie van hernieuwbare
      warmte of hernieuwbare elektriciteit en hernieuwbare warmte uit biogas dat vrijkomt ten gevolge van een biologische
      afbraakreactie van gisting van zuiveringsslib waarbij er verbeteringen zijn uitgevoerd in het productieproces
      waarna er per ton slib sprake is van ten minste 25% meer biogasproductie ten opzichte van voor de verbetering:

      a. waarmee hernieuwbare warmte wordt geproduceerd, waarbij ten minste de installatie-onderdelen die
      verantwoordelijk zijn voor de meerproductie nieuw zijn; of

      b. waarmee hernieuwbare warmte en hernieuwbare elektriciteit wordt geproduceerd, waarbij ten minste de installatie-
      onderdelen die verantwoordelijk zijn voor de meerproductie nieuw zijn.

      2 De installatiedelen die verantwoordelijk zijn voor de meerproductie worden niet in gebruik genomen voor de
      subsidie is aangevraagd.
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel41
  - number: '42'
    text: |-
      1 De subsidie, bedoeld in [artikel 41, eerste lid][ref1], wordt voor een periode van twaalf jaar verstrekt.

      2 De subsidieontvanger neemt de productie-installatie binnen vier jaar na de datum van inwerkingtreding van de
      beschikking tot subsidieverlening in gebruik.

      3 De subsidieontvanger draagt er zorg voor dat de opgewekte hernieuwbare warmte die voor subsidie in aanmerking
      komt, wordt aangewend als nuttig aangewende warmte.

      4 De subsidieaanvrager maakt aannemelijk dat de voorgestelde aanpassingen een verbetering van 25% inhouden ten
      opzichte van de gemiddelde productie van het jaar voorafgaande aan de aanvraag, of, wanneer de producent minder dan
      een jaar produceert, ten opzichte van de totale gemiddelde productie tot het moment van de aanvraag.

      5 De subsidieontvanger draagt er zorg voor dat wordt aangetoond dat de in een installatie voor de opwekking van
      warmte of gecombineerde opwekking van warmte en elektriciteit met een totaal nominaal thermisch ingangsvermogen
      gelijk aan of groter dan 2 MW gebruikte biomassa voldoet aan het broeikasgasemissiereductiecriterium, bedoeld in
      [artikel 29, eerste lid][ref2], van de [richtlijn (EU) 2018/2001](32018L2001).


      [ref1]: https://wetten.overheid.nl/BWBR0045389#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0045389#Artikel29
