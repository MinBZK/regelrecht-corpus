      1 De minister verstrekt op aanvraag subsidie aan een producent die met een productie-installatie koolstofdioxide
      afvangt en gebruikt of doet gebruiken ter vermindering van broeikasgas door middel van nuttig aangewende
      koolstofdioxide en:

      a. de afvang van koolstofdioxide gebeurt in een op het moment van indienen van de aanvraag bestaand
      productieproces, gebruik wordt gemaakt van gasvormig transport van koolstofdioxide door een transportleiding en ten
      minste de installatie voor de afvang van koolstofdioxide en de compressor nieuw zijn;

      b. de afvang van koolstofdioxide gebeurt in een op het moment van indienen van de aanvraag bestaand
      productieproces, gebruik wordt gemaakt van vloeibaar transport van koolstofdioxide en ten minste de installatie
      voor de afvang van koolstofdioxide en de vervloeiingsinstallatie nieuw zijn;

      c. de afvang van koolstofdioxide gebeurt in een op het moment van indienen van de aanvraag bestaand
      productieproces, gebruik wordt gemaakt van gasvormig transport van koolstofdioxide door een transportleiding en ten
      minste de installatie voor de afvang van koolstofdioxide, de compressor en de transportleiding nieuw zijn;

      d. de afvang van koolstofdioxide gebeurt in een op het moment van indienen van de aanvraag bestaand
      productieproces, gebruik wordt gemaakt van vloeibaar transport van koolstofdioxide en ten minste de
      vervloeiingsinstallatie nieuw is;

      e. de afvang van koolstofdioxide gebeurt in een op het moment van indienen van de aanvraag bestaand
      productieproces, gebruik wordt gemaakt van gasvormig transport van koolstofdioxide door een transportleiding en ten
      minste de compressor en de transportleiding nieuw zijn;

      f. de afvang van koolstofdioxide gebeurt in een nieuw productieproces, gebruik wordt gemaakt van gasvormig
      transport van koolstofdioxide door een transportleiding en ten minste de installatie voor de afvang van
      koolstofdioxide en de compressor nieuw zijn;

      g. de afvang van koolstofdioxide gebeurt in een nieuw productieproces, gebruik wordt gemaakt van vloeibaar
      transport van koolstofdioxide en ten minste de installatie voor de afvang van koolstofdioxide en de
      vervloeiingsinstallatie nieuw zijn;

      h. de afvang van koolstofdioxide gebeurt in een nieuw productieproces, gebruik wordt gemaakt van gasvormig
      transport van koolstofdioxide door een transportleiding en ten minste de installatie voor de afvang van
      koolstofdioxide, de compressor en de transportleiding nieuw zijn;

      i. de afvang van koolstofdioxide die ontstaat door een verbrandingsproces in een op het moment van indienen van de
      aanvraag bestaande afvalverbrandingsinstallatie, gebruik wordt gemaakt van gasvormig transport van koolstofdioxide
      door een transportleiding en ten minste de installatie voor de afvang van koolstofdioxide en de compressor nieuw
      zijn;

      j. de afvang van koolstofdioxide die ontstaat door een verbrandingsproces in een op het moment van indienen van de
      aanvraag bestaande afvalverbrandingsinstallatie, gebruik wordt gemaakt van vloeibaar transport van koolstofdioxide
      en ten minste de installatie voor de afvang van koolstofdioxide en de vervloeiingsinstallatie nieuw zijn;

      k. de afvang van koolstofdioxide die ontstaat door een verbrandingsproces in een op het moment van indienen van de
      aanvraag bestaande afvalverbrandingsinstallatie, gebruik wordt gemaakt van gasvormig transport van koolstofdioxide
      door een transportleiding en ten minste de installatie voor de afvang van koolstofdioxide, de compressor en de
      transportleiding nieuw zijn;

      l. de afvang van koolstofdioxide die ontstaat door een verbrandingsproces gebeurt in een op het moment van indienen
      van de aanvraag bestaande biomassaverbrandingsinstallatie, gebruik wordt gemaakt van gasvormig transport van
      koolstofdioxide door een buisleiding en ten minste de installatie voor de afvang van koolstofdioxide nieuw is; of

      m. de afvang van koolstofdioxide die ontstaat door een verbrandingsproces gebeurt in een op het moment van indienen
      van de aanvraag bestaande biomassaverbrandingsinstallatie, gebruik wordt gemaakt van vloeibaar transport van
      koolstofdioxide en ten minste de installatie voor de afvang van koolstofdioxide en de vervloeiingsinstallatie nieuw
      zijn.

      2 Een productie-installatie als bedoeld in het eerste lid, aanhef en onderdeel a, b, c, f,
      g, h, i, j, k, l of m, kan worden gecombineerd met een productie-installatie als bedoeld in
      [artikel 83, aanhef en onderdeel a of o][ref1].

      3 Een productie-installatie als bedoeld in het eerste lid, aanhef en onderdeel b, g, j of m, kan worden
      gecombineerd met een productie-installatie als bedoeld in [artikel 83, aanhef en onderdeel c of p][ref2].


