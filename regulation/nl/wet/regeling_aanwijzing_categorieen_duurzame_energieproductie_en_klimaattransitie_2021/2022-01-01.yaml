  - number: '77.1'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van koolstofdioxide-arme warmte geproduceerd door een
      productie-installatie waarmee restwarmte wordt uitgekoppeld met een thermisch vermogen van ten minste 2 MWth en
      naar een andere locatie wordt getransporteerd waarbij ten minste de warmtewisselaar bij de uitkoppeling nieuw is,
      waarbij transport plaatsvindt met behulp van een transportleiding:
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel77
  - number: 77.1.a
    text: |-
      met een verhouding van kilometer nieuw aan te leggen transportleiding per MWth outputvermogen van de productie-
      installatie en andere op de transportleiding invoedende installaties van ≥ 0,20 en < 0,30;
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel77
  - number: 77.1.b
    text: |-
      met een verhouding van kilometer nieuw aan te leggen transportleiding per MWth outputvermogen van de productie-
      installatie en andere op de transportleiding invoedende installaties van ≥ 0,30 en < 0,40;
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel77
  - number: 77.1.c
    text: |-
      met een verhouding van kilometer nieuw aan te leggen transportleiding per MWth outputvermogen van de productie-
      installatie en andere op de transportleiding invoedende installaties van ≥ 0,40 en < 0,50;
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel77
  - number: 77.1.d
    text: |-
      met een verhouding van kilometer nieuw aan te leggen transportleiding per MWth outputvermogen van de productie-
      installatie en andere op de transportleiding invoedende installaties van ≥ 0,50; of
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel77
  - number: 77.1.e
    text: |-
      waarbij de warmte wordt opgewaardeerd met een nieuwe warmtepomp met een nominaal thermisch vermogen van ten minste
      500 kWth en een COP-waarde van ten minste 3,0.
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel77
  - number: '77.2'
    text: De levering van stoom wordt uitgesloten van subsidie.
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel77
