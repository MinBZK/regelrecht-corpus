    text: |-
      In afwijking van de fasebedragen, genoemd in de derde, vierde, vijfde of zesde kolom van de tabel in
      het tweede lid, geldt voor de productie-installaties, bedoeld in de [artikelen 83, eerste lid][ref1] en
      [85, eerste lid][ref2], het fasebedrag in euro per 1.000 kg broeikasgas in vier decimalen dat door de aanvrager
      bij de aanvraag in een fase is ingediend, indien dat bedrag per 1.000 kg broeikasgas lager is dan het fasebedrag,
      genoemd in de respectievelijke derde, vierde, vijfde of zesde kolom van de tabel in het tweede lid, dat van
      toepassing is voor de fase waarin de aanvraag is ingediend.


