    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare warmte of hernieuwbare
      elektriciteit en hernieuwbare warmte geproduceerd door een productie-installatie voor de productie van warmte of
      hernieuwbare elektriciteit en hernieuwbare warmte door middel van verbranding van vaste of vloeibare biomassa als
      bedoeld in de NTA 8003: 2017, met uitzondering van biomassa als bedoeld in de nummers 100, 150, 170 tot en met 179
      van de NTA 8003: 2017 in een ketel met een nominaal thermisch vermogen groter dan of gelijk aan 0,5 MWth en kleiner
      dan 5 MWth waarbij ten minste de ketel nieuw is.

      2 Een productie-installatie met een vermogen kleiner dan 1 MWth stoot per normaal kubieke meter minder dan
      15 milligram stof, minder dan 275 milligram stikstofoxiden en minder dan 60 milligram zwaveldioxiden uit.

      3 Een productie-installatie met een vermogen groter dan of gelijk aan 1 MWth stoot per normaal kubieke meter minder
      dan 5 milligram stof, minder dan 145 milligram stikstofoxiden, minder dan 60 milligram zwaveldioxiden en minder dan
      5 milligram ammoniak bij toepassing van selectieve katalytische reductie of minder dan 10 milligram ammoniak bij
      toepassing van selectieve niet-katalytische reductie uit.
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel45
  - number: '46'
    text: |-
      1 De subsidie, bedoeld in [artikel 45, eerste lid][ref1], wordt voor een periode van twaalf jaar verstrekt.

      2 De subsidieontvanger neemt de productie-installatie binnen vier jaar na de datum van inwerkingtreding van de
      beschikking tot subsidieverlening in gebruik.

      3 De subsidieontvanger draagt er zorg voor dat de opgewekte hernieuwbare warmte die voor subsidie in aanmerking
      komt, wordt aangewend als nuttig aangewende warmte.

      4 De subsidieontvanger draagt er zorg voor dat ten minste 97% van de energetische waarde van de jaarlijks in de
      productie-installatie gebruikte brandstof biogeen is.

      5 De subsidieontvanger draagt er zorg voor dat wordt aangetoond dat de gebruikte vloeibare biomassa voldoet aan de
      duurzaamheids- en broeikasgasemissiereductiecriteria, bedoeld in [artikel 29, eerste lid][ref2], van de [richtlijn
      (EU) 2018/2001](32018L2001).

      6 Als gebruik wordt gemaakt van houtige biomassa als bedoeld in de nummers 100 tot en met 199 van de NTA 8003:2017,
      draagt de subsidieontvanger er zorg voor dat de geproduceerde warmte wordt toegepast in een verwarmingssysteem met
      een aanvoertemperatuur aan de gebruikerszijde van ten minste 100 °C in het stookseizoen of in een stoomsysteem.


