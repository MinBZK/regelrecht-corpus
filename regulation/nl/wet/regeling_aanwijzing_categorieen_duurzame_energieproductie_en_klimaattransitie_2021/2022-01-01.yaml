      stikstofoxiden, minder dan 60 milligram zwaveldioxiden en minder dan 5 milligram ammoniak uit.
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel51
  - number: '52.1'
    text: |-
