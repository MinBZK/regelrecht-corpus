      grondstoffen als bedoeld onder o) met uitzondering van zwart residuloog, bruin residuloog, vezelslib, lignine en
      tallolie, en q) van deel A van Bijlage IX bij de [richtlijn (EU) 2018/2001](32018L2001).
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel81
  - number: '82.1'
    text: |-
      De subsidie, bedoeld in [artikel 81, eerste lid, onderdelen a en d][ref1], wordt voor een periode van vijftien
      jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0045389#Artikel81
    url: https://wetten.overheid.nl/BWBR0045389/2022-01-01#Artikel82
