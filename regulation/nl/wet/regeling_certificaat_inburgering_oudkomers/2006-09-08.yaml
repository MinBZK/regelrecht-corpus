  - number: '2'
    text: |-
      1 Het college van burgemeester en wethouders vermeldt op het certificaat bij de afzonderlijke toetsonderdelen het
      bij de eindtoets behaalde niveau.

      2 Voor het certificaat wordt enkel het in de bijlage opgenomen model gebruikt.

      3 Bij het certificaat wordt een gewaarmerkte kopie van de verklaring van de onderwijsinstelling inhoudende de
      toetsresultaten gevoegd.
    url: https://wetten.overheid.nl/BWBR0018730/2006-09-08#Artikel2
  - number: '3'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0018730/2006-09-08#Artikel3
  - number: '4'
    text: 'Deze regeling wordt aangehaald als: Regeling certificaat inburgering oudkomers.'
    url: https://wetten.overheid.nl/BWBR0018730/2006-09-08#Artikel4
