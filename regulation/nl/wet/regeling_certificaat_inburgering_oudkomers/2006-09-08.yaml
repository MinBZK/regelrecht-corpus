---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.5.4/schema/v0.5.4/schema.json
$id: regeling_certificaat_inburgering_oudkomers
regulatory_layer: WET
publication_date: '2018-12-13'
valid_from: '2006-09-08'
valid_to: '2018-12-31'
bwb_id: BWBR0018730
url: https://wetten.overheid.nl/BWBR0018730/2006-09-08
preamble:
  text: |-
    Gelet op de Regeling inburgering oudkomers 25 gemeenten 2005, alsmede de Regeling inburgering oudkomers G30 2005,
    de Regeling inburgering oudkomers 54 gemeenten en de Regeling inburgering oudkomers;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0018730/2006-09-08#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Het college van burgemeester en wethouders reikt aan de oudkomer een certificaat uit indien:

      a. de gemeente met de oudkomer een overeenkomst heeft gesloten als bedoeld in de
      [Regeling inburgering oudkomers][ref1], de [Regeling inburgering oudkomers 54 gemeenten][ref2], de
      [Regeling inburgering inburgering G30 2005][ref3], de [Regeling inburgering oudkomers 25 gemeenten 2005][ref4],
      de [Regeling inburgering oudkomers G25 2006][ref5], de [Regeling inburgering oudkomers G30 2006][ref6] en de
      [Regeling inburgering oudkomers niet-G56 2006][ref7], en;

      b. de oudkomer de in onder a. genoemde regelingen bedoelde NT2-Profieltoets als eindtoets heeft afgelegd.

      2 Geen certificaat wordt uitgereikt aan de oudkomer die niet in Nederland in een gemeentelijke basisadministratie
      is ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0014009
      [ref2]: https://wetten.overheid.nl/BWBR0015683
      [ref3]: https://wetten.overheid.nl/BWBR0018320
      [ref4]: https://wetten.overheid.nl/BWBR0018100
      [ref5]: https://wetten.overheid.nl/BWBR0019119
      [ref6]: https://wetten.overheid.nl/BWBR0019824
      [ref7]: https://wetten.overheid.nl/BWBR0019120
    url: https://wetten.overheid.nl/BWBR0018730/2006-09-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014009
      - id: ref2
        bwb_id: BWBR0015683
      - id: ref3
        bwb_id: BWBR0018320
      - id: ref4
        bwb_id: BWBR0018100
      - id: ref5
        bwb_id: BWBR0019119
      - id: ref6
        bwb_id: BWBR0019824
      - id: ref7
        bwb_id: BWBR0019120
    machine_readable:
      inputs:
        - name: bsn
          type: string
          description: Burgerservicenummer van de oudkomer
      outputs:
        - name: certificaat_uitreikbaar
          type: boolean
          description: Indieneen certificaat uitgereikt kan worden aan de oudkomer
      actions:
        - describe: Check of de gemeente een overeenkomst heeft met de oudkomer
          action:
            AND:
              conditions:
                - source:
                    regulation: BWBR0014009
                    output: overeenkomst_gesloten
                - source:
                    regulation: BWBR0015683
                    output: overeenkomst_gesloten
                - source:
                    regulation: BWBR0018320
                    output: overeenkomst_gesloten
                - source:
                    regulation: BWBR0018100
                    output: overeenkomst_gesloten
                - source:
                    regulation: BWBR0019119
                    output: overeenkomst_gesloten
                - source:
                    regulation: BWBR0019824
                    output: overeenkomst_gesloten
                - source:
                    regulation: BWBR0019120
                    output: zelfs_overeenkomst_gesloten
          target: overeenkomst_gesloten_met_oudkomer
        - describe: Check of de oudkomer de NT2-Profieltoets heeft afgelegd
          action:
            source:
              regulation: BWBR0014009
              output: nt2_profieltoets_afgelegd
          target: nt2_profieltoets_geslaagd
        - describe: Check of de oudkomer ingeschreven staat in de gemeentelijke basisadministratie
          action:
            source:
              regulation: wet_basisregistratie_personen
              output: ingeschreven_in_nederland
          target: ingeschreven_in_gba
        - describe: Bepaal of het certificaat kan worden uitgereikt
          action:
            AND:
              conditions:
                - EQUALS:
                    left:
                      source: overeenkomst_gesloten_met_oudkomer
                    right:
                      value: true
                - EQUALS:
                    left:
                      source: nt2_profieltoets_geslaagd
                    right:
                      value: true
                - NOT:
                    EQUALS:
                      left:
                        source: ingeschreven_in_gba
                      right:
                        value: false
          target: certificaat_uitreikbaar
  - number: '2'
    text: |-
      1 Het college van burgemeester en wethouders vermeldt op het certificaat bij de afzonderlijke toetsonderdelen het
      bij de eindtoets behaalde niveau.

      2 Voor het certificaat wordt enkel het in de bijlage opgenomen model gebruikt.

      3 Bij het certificaat wordt een gewaarmerkte kopie van de verklaring van de onderwijsinstelling inhoudende de
      toetsresultaten gevoegd.
    url: https://wetten.overheid.nl/BWBR0018730/2006-09-08#Artikel2
    machine_readable:
      inputs:
        - name: bsn
          type: string
          description: Burgerservicenummer van de oudkomer
        - name: nt2_niveaus
          type: list
          description: Behaalde niveaus voor elk toetsonderdeel van de NT2-Profieltoets
          item_type: string
        - name: model_versie
          type: string
          description: Versie van het model uit de bijlage
          default: standaard_model_2006
        - name: gewaarmerkte_kopie_aanwezig
          type: boolean
          description: Of er een gewaarmerkte kopie van de toetsresultaten verklaring is
      outputs:
        - name: certificaat_inhoud
          type: object
          description: Inhoud van het certificaat
          properties:
            toetsonderdelen:
              type: list
              item_type: string
            model:
              type: string
            gewaarmerkte_kopie:
              type: boolean
      actions:
        - describe: Voeg toetsonderdelen en behaalde niveaus toe aan certificaat
          action:
            SET:
              source: nt2_niveaus
          target: toetsonderdelen
        - describe: Stel het model in voor het certificaat
          action:
            SET:
              value: standaard_model_2006
          target: model
        - describe: Voeg informatie over de gewaarmerkte kopie toe
          action:
            SET:
              source: gewaarmerkte_kopie_aanwezig
          target: gewaarmerkte_kopie
        - describe: Combineer alle onderdelen tot certificaat_inhoud
          action:
            SET:
              value:
                toetsonderdelen:
                  source: toetsonderdelen
                model:
                  source: model
                gewaarmerkte_kopie:
                  source: gewaarmerkte_kopie
          target: certificaat_inhoud
  - number: '3'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0018730/2006-09-08#Artikel3
  - number: '4'
    text: 'Deze regeling wordt aangehaald als: Regeling certificaat inburgering oudkomers.'
    url: https://wetten.overheid.nl/BWBR0018730/2006-09-08#Artikel4
