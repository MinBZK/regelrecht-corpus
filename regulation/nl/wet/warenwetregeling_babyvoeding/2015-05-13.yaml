  - number: '6'
    text: |-
      Onverminderd [artikel 5][ref1] mogen bij eet- of drinkwaren op basis van granen en bij babyvoeding de volgende
      vermeldingen worden gebezigd:

      a. op eet- of drinkwaren waarvan het gebruik vanaf de leeftijd van vier maanden wordt aanbevolen: een vermelding
      dat zij geschikt zijn om vanaf die leeftijd te worden genuttigd, tenzij door onafhankelijke, op het gebied van
      geneeskunde, voedingsleer of farmacie deskundige personen of door personen uit andere beroepsgroepen die voor de
      zorg van moeder en kind verantwoordelijk zijn, een andersluidend advies wordt gegeven;

      b. de gemiddelde hoeveelheid van de in [bijlage I][ref2] bedoelde voedingsstoffen, voor zover die vermelding
      niet reeds gebezigd wordt krachtens [artikel 5, onder d][ref3], uitgedrukt in cijfers, per 100 g of 100 ml van de
      eetwaar zoals die wordt verkocht en, indien van toepassing, per aangegeven portie;

      c. cijfergegevens en informatie over in [bijlage V][ref4] bedoelde vitamines en mineralen, uitgedrukt in
      percentages van de daarin aangegeven referentiewaarden, per 100 g of 100 ml van de waar zoals die wordt verkocht
      en, voor zover van toepassing, per aangegeven portie, mits de in de waar aanwezige hoeveelheden ten minste gelijk
      zijn aan 15% van de referentiewaarden.


