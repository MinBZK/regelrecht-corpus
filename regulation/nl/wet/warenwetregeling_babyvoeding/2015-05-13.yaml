  - number: BII:5
    text: |-
      5.1 Natrium

        - Natriumzouten mogen uitsluitend voor technologische doeleinden aan bewerkte eet- of drinkwaren op basis van
      granen worden toegevoegd.
        - Het natriumgehalte van bewerkte eet- of drinkwaren op basis van granen is niet hoger dan 25 mg/100 kJ (100 mg/100
      kcal).

      5.2 5.2 Calcium

      1. Voor de in [artikel 1, eerste lid, onder c, 2°][ref1], bedoelde eet- of drinkwaren is het calciumgehalte niet
      lager dan 20 mg/100 kJ (80 mg/100 kcal).

      2. Voor de in [artikel 1, eerste lid, onder c, 4°][ref2], bedoelde met toevoeging van melk bereide eet- of
      drinkwaren (melkbiscuits) die als zodanig worden verkocht, is het calciumgehalte niet lager dan 12 mg/100 kJ (50
      mg/100 kcal).


      [ref1]: https://wetten.overheid.nl/BWBR0008503#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008503#Artikel1
