        bwb_id: BWBR0008503
      - id: ref2
        bwb_id: BWBR0008503
  - number: '3'
    text: |-
      1 Bewerkte eet- of drinkwaren op basis van granen voldoen wat betreft hun samenstelling aan [bijlage II][ref1]
      en [bijlage III][ref2].

      2 Babyvoeding die als zodanig wordt verkocht of volgens de gebruiksaanwijzing van de fabrikant is aangemaakt,
      voldoet wat betreft de samenstelling aan [bijlage IV][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008503
      [ref2]: https://wetten.overheid.nl/BWBR0008503
      [ref3]: https://wetten.overheid.nl/BWBR0008503
    url: https://wetten.overheid.nl/BWBR0008503/2015-05-13#Artikel3
