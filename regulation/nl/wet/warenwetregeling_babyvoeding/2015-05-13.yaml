  - number: BII:4
    text: |-
      4.1 Voor de in [artikel 1, eerste lid, onder c, 1° en 4°][ref1], bedoelde eet- of drinkwaren is het vetgehalte
      niet hoger dan 0,8 g/100 kJ (3,3 g/100 kcal).

      4.2 Voor de in [artikel 1, eerste lid, onder c, 2°][ref2], bedoelde eet- of drinkwaren is het vetgehalte niet
      hoger dan 1,1 g/100 kJ (4,5 g/100 kcal). Indien het vetgehalte hoger is 0,8 g/100 kJ (3,3 g/100 kcal), is de
      hoeveelheid:

      a. laurinezuur niet groter dan 15% van het totale vetgehalte;

      b. myristinezuur niet groter dan 15% van het totale vetgehalte;

      c. linolzuur (in de vorm van glyceriden = linoleaten) niet kleiner dan 70 mg/100 kJ (300 mg/100 kcal) en niet
      groter dan 285 mg/100kJ (1200 mg/100 kcal).


      [ref1]: https://wetten.overheid.nl/BWBR0008503#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008503#Artikel1
