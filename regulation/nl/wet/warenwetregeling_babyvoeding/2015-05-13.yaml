    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst, met dien verstande dat bewerkte eet- of drinkwaren op basis van granen en babyvoeding die niet
      voldoen aan deze regeling, nog verhandeld mogen worden tot 31 maart 1999.
    url: https://wetten.overheid.nl/BWBR0008503/2015-05-13#Artikel7
