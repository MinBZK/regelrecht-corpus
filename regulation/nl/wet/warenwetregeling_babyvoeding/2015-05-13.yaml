  - number: '2'
    text: |-
      Bij de bereiding van bewerkte eet- of drinkwaren op basis van granen en van babyvoeding:

      a. wordt gebruik gemaakt van ingrediënten waarvan op grond van algemeen aanvaarde wetenschappelijke gegevens is
      aangetoond dat zij geschikt zijn als specifieke voeding voor zuigelingen en peuters;

      b. mogen uitsluitend de in [bijlage I][ref1] bedoelde voedingsstoffen worden toegevoegd, met inachtneming van
      [bijlage VI][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008503
      [ref2]: https://wetten.overheid.nl/BWBR0008503
    url: https://wetten.overheid.nl/BWBR0008503/2015-05-13#Artikel2
    references:
