  - number: BII:1
    text: |-
      Bewerkte eet- of drinkwaren op basis van granen worden voornamelijk bereid uit een of meer gemalen graansoorten of
      zetmeelhoudende wortelproducten.

      De hoeveelheid graan of wortelproduct is niet kleiner dan 25% (g/g) van het droge eindmengsel.
    url: https://wetten.overheid.nl/BWBR0008503/2015-05-13#Artikel1
  - number: BII:2
    text: |-
      2.1 Voor de in [artikel 1, eerste lid, onder c, 2∞ en 4∞][ref1], bedoelde eet- of drinkwaren is het
      eiwitgehalte niet hoger dan 1,3 g/100 kJ (5,5 g/100 kcal).

      2.2 Voor de in [artikel 1, eerste lid, onder c, 2∞][ref2], bedoelde eet- of drinkwaren is de toegevoegde
      hoeveelheid eiwit niet kleiner dan 0,48 g/100 kJ (2 g/100 kcal).

      2.3 Voor de in [artikel 1, eerste lid, onder c, 4∞][ref3], bedoelde biscuits waaraan een eiwitrijk voedingsmiddel
      wordt toegevoegd en die als zodanig worden verkocht, is de toegevoegde hoeveelheid eiwit niet kleiner dan 0,36
      g/100 kJ (1,5 g/100 kcal).

      2.4 De chemische index van het toegevoegde eiwit is gelijk aan ten minste 80% van die van het referentie-eiwit
      (caseïne zoals gedefinieerd in [bijlage III][ref4]) of de eiwitrendementscoëfficiënt (PER) van het eiwit in
      het mengsel is gelijk aan ten minste 70% van die van het referentie-eiwit. In alle gevallen mogen aminozuren
      uitsluitend worden toegevoegd om de voedingswaarde van het eiwitmengsel te verbeteren, en uitsluitend in de
      hoeveelheden die daarvoor nodig zijn.


