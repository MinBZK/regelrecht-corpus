        bwb_id: BWBR0008503
      - id: ref3
        bwb_id: BWBR0008503
  - number: 3a
    text: |-
      Bewerkte eet- of drinkwaren op basis van granen, en babyvoeding, die gereed zijn voor onmiddellijke consumptie of
      zijn gereconstitueerd volgens de aanwijzingen van de fabrikant daarvan, bevatten ten hoogste:

      a. 0,003 mg/kg residuen van de afzonderlijke in bijlage VII genoemde bestrijdingsmiddelen;

      b. de in bijlage VIII vermelde residuen van de daar genoemde bestrijdingsmiddelen; en

      c. 0,01 mg/kg residu en van andere afzonderlijke bestrijdingsmiddelen.
    url: https://wetten.overheid.nl/BWBR0008503/2015-05-13#Artikel3a
  - number: '4'
    text: |-
      Bij bewerkte eet- of drinkwaren op basis van granen en bij babyvoeding wordt niet vermeld dat zij geschikt zijn
      voor kinderen jonger dan vier maanden.
    url: https://wetten.overheid.nl/BWBR0008503/2015-05-13#Artikel4
  - number: '5'
    text: |-
      Onverminderd verordening (EU) 1169/2011 worden bij eet- of drinkwaren op basis van granen en bij babyvoeding de
      volgende vermeldingen gebezigd:

      a. een vermelding van de geschikte leeftijd van waaraf de eetwaar, rekening houdend met de samenstelling, de
      substantie of andere specifieke eigenschappen, kan worden genuttigd;

      b. informatie of de eetwaar al dan niet gluten bevat, indien de leeftijd van waaraf de eetwaar volgens een onder a
      bedoelde vermelding kan worden genuttigd, lager is dan zes maanden;

      c. de beschikbare energiewaarde, uitgedrukt in kJ en kcal, en het gehalte aan eiwitten, koolhydraten en vetten,
      uitgedrukt in cijfers, per 100 g of 100 ml eetwaar zoals die wordt verkocht en, indien van toepassing, per voor
      consumptie aanbevolen hoeveelheid van de eetwaar;

      d. de gemiddelde hoeveelheid van elk mineraal en elke vitamine waarvoor een specifieke hoeveelheid is vermeld in
      [bijlage II][ref1] onderscheidenlijk [bijlage IV][ref2], uitgedrukt in cijfers, per 100 g of 100 ml eetwaar zoals
      die wordt verkocht en, indien van toepassing, per voor consumptie aanbevolen hoeveelheid eetwaar; en

      e. indien nodig een gebruiksaanwijzing voor de juiste bereiding van de eetwaar, en een waarschuwing dat deze
      gebruiksaanwijzing moet worden gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0008503
      [ref2]: https://wetten.overheid.nl/BWBR0008503
    url: https://wetten.overheid.nl/BWBR0008503/2015-05-13#Artikel5
    references:
