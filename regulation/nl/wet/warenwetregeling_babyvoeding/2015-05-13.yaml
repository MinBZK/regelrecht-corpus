      3.1 Indien sucrose, fructose, glucose, glucosesiropen of honing worden toegevoegd aan in
      [artikel 1, eerste lid, onder c, 1° en 4°][ref1], bedoelde eet- of drinkwaren, is de hoeveelheid:

        - toegevoegde koolhydraten uit deze bronnen niet groter dan 1,8 g/100 kJ (7,5 g/100kcal);
        - toegevoegd fructose niet groter dan 0,9 g/100 kJ (3,75 g/100 kcal).

      3.2 Indien sucrose, fructose, glucose, glucosesiropen of honing worden toegevoegd aan in
      [artikel 1, eerste lid, onder c, 2°][ref2], bedoelde eet- of drink-waren, is de hoeveelheid:

        - toegevoegde koolhydraten uit deze bronnen niet groter dan 1,2 g/100 kJ (5 g/100 kcal);
        - toegevoegd fructose niet groter dan 0,6 g/100 kJ (2,5 g/100 kcal).


