preamble:
  text: |-
    Gelet op richtlijn nr. 96/5/EG van de Commissie van de Europese Gemeenschappen van 16 februari 1996 inzake bewerkte
    voedingsmiddelen op basis van granen en babyvoeding voor zuigelingen en peuters (PbEG L 49);

    alsmede op artikel 10, eerste lid, van het Warenwetbesluit Produkten voor bijzondere voeding;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0008503/2015-05-13#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

      a. *zuigelingen:* kinderen jonger dan twaalf maanden;

      b. *peuters:* kinderen van één tot drie jaar;

      c. *bewerkte eet- of drinkwaren op basis van granen:*

      1º eenvoudige graanproducten die met melk of met andere daarvoor in aanmerking komende eet- of drinkwaren worden
      aangemaakt;

      2º graanproducten waaraan een eiwitrijke eetwaar is toegevoegd, en die worden aangemaakt met water of een andere,
      geen eiwit bevattende vloeistof;

      3º deegwaren die vóór consumptie bereid worden in kokend water of andere geschikte vloeistoffen; en

      4º beschuiten en biscuits die als zodanig worden genuttigd, of eerst worden verkruimeld en vervolgens met water,
      melk of een andere geschikte vloeistof worden vermengd;

      d. *babyvoeding:* voor bijzondere voeding bestemde eet- of drinkwaren, met uitzondering van bewerkte eet- of
      drinkwaren op basis van granen;

      e. *residu van bestrijdingsmiddelen:* het residu in bewerkte eet- of drinkwaren op
      basis van granen, en in babyvoeding, van een gewasbeschermingsmiddel als bedoeld in
      [artikel 1 van de Wet gewasbeschermingsmiddelen en biociden][ref1], met inbegrip van de metabolieten daarvan en de
      producten die bij de afbraak of de reactie vrijkomen;

      f. *verordening (EU) 1169/2011:* Verordening (EU) nr. 1169/2011 van het Europees Parlement en de Raad van 25
      oktober 2011 betreffende de verstrekking van voedselinformatie aan consumenten, tot wijziging van [Verordeningen
      (EG) nr. 1924/2006](32006R1924) en [(EG) nr. 1925/2006](32006R1925) van het Europees Parlement en de Raad en tot
      intrekking van [Richtlijn 87/250/EEG](31987L0250) van de Commissie, [Richtlijn 90/496/EEG](31990L0496) van de Raad,
      [Richtlijn 1999/10/EG](31999L0010) van de Commissie, [Richtlijn 2000/13/EG](32000L0013) van het Europees Parlement
      en de Raad, [Richtlijnen 2002/67/EG](32002L0067) en [2008/5/EG](32008L0005) van de Commissie, en [Verordening (EG)
      nr. 608/2004](32004R0608) van de Commissie (PbEU 2011, L 304).

      2 Deze regeling is van toepassing op bewerkte eet- of drinkwaren op basis van granen en op babyvoeding, die:

        - voorzien in de specifieke behoeften van in goede gezondheid verkerende zuigelingen en peuters; en
        - zijn bedoeld voor consumptie door hetzij zuigelingen tijdens de periode waarin zij worden gespeend, hetzij
      peuters om hun voeding aan te vullen of hen geleidelijk aan gewoon voedsel te laten wennen.

      3 Deze regeling is niet van toepassing op voor peuters bestemde melk.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel1
    url: https://wetten.overheid.nl/BWBR0008503/2015-05-13#Artikel1
