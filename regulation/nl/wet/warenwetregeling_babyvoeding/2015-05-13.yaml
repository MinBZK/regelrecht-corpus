  - number: BIV:1
    text: |-
      1.1 Indien vlees, gevogelte, vis, orgaanvlees of een andere traditionele eiwitbron de enige bestanddelen zijn die
      in de aanduiding van de eetwaar worden genoemd:

        - bestaat de totale eetwaar voor ten minste 40% (g/g) uit het genoemde vlees, gevogelte, vis of orgaanvlees of uit
      de genoemde andere traditionele eiwitbron;
        - bestaat de totale hoeveelheid eiwit uit de genoemde bronnen voor ten minste 25% (g/g) uit elke genoemde soort
      vlees, gevogelte, vis of orgaanvlees of uit de genoemde andere traditionele eiwitbron;
        - is de hoeveelheid eiwit uit de genoemde bronnen niet kleiner dan 1,7 g/100 kJ (7 g/100 kcal).

      1.2 Indien vlees, gevogelte, vis, orgaanvlees of een andere traditionele eiwitbron als eerste in de aanduiding van
      de eetwaar worden genoemd, alleen of in combinatie, ongeacht of de eetwaar als maaltijd wordt aangeboden:

        - bestaat de totale eetwaar voor ten minste 10% (g/g) uit het genoemde vlees, gevogelte, vis of orgaanvlees of uit
      de genoemde andere traditionele eiwitbron;
        - bestaat de totale hoeveelheid eiwit uit de genoemde bronnen voor ten minste 25% (g/g) uit elke genoemde soort
      vlees, gevogelte, vis of orgaanvlees of andere traditionele eiwitbron;
        - is de hoeveelheid eiwit uit de genoemde bronnen niet kleiner dan 1 g/100 kJ (4 g/100 kcal).

      1.3 Indien vlees, gevogelte, vis, orgaanvlees of een andere traditionele eiwitbron alleen of in combinatie,
      maar niet als eerste, in de aanduiding van de eetwaar worden genoemd, ongeacht of de eetwaar als maaltijd wordt
      aangeboden:

        - bestaat de totale eetwaar voor ten minste 8% (g/g) uit het genoemde vlees, gevogelte, vis of orgaanvlees of uit
      de genoemde andere traditionele eiwitbron;
        - bestaat de totale hoeveelheid eiwit uit de genoemde bronnen voor ten minste 25% (g/g) uit elke genoemde soort
      vlees, gevogelte, vis of orgaanvlees of andere traditionele eiwitbron;
        - is de hoeveelheid eiwit uit de genoemde bronnen niet kleiner dan 0,5 g/100 kJ (2,2 g/100 kcal);
        - is de totale hoeveelheid eiwit in de eetwaar uit alle bronnen niet kleiner dan 0,7 g/100kJ (3 g/100 kcal).

      1.3bis Indien kaas samen met andere bestanddelen in de aanduiding van een hartige waar wordt genoemd, ongeacht de
      vraag of de waar als maaltijd wordt aangeboden:

        - is de hoeveelheid eiwit uit zuivelbronnen niet kleiner dan 0,5 g/100 kJ (2,2 g/100 kcal);
        - is de totale hoeveelheid eiwit in de waar uit alle bronnen niet kleiner dan 0,7 g/100 kJ (3 g/100 kcal). .

      1.4 Indien de eetwaar op het etiket wordt aangeduid als maaltijd, maar vlees, gevogelte, vis, orgaanvlees of een
      andere traditionele eiwitbron niet in de aanduiding van de waar worden genoemd, is de totale hoeveelheid eiwit in
      de waar uit alle bronnen niet kleiner dan 0,7 g/100 kJ (3 g/100 kcal).

      1.4bis De punten 1.1 tot en met 1.4 zijn niet van toepassing op sauzen die als begeleiding bij een maaltijd worden
      aangeboden.

      1.4ter Indien zuivelproducten in de aanduiding van een zoet gerecht als eerste of enige bestanddeel worden genoemd,
      is de hoeveelheid zuiveleiwit in de waar niet kleiner dan 2,2 g/100 kcal. De punten 1.1 tot en met 1.4 zijn niet
      van toepassing op alle overige zoete gerechten. .

      1.5 Aminozuren mogen alleen worden toegevoegd om de voedingswaarde van de in de eetwaar aanwezige eiwitten te
      verhogen, en alleen in de voor dat doel benodigde hoeveelheden.
    url: https://wetten.overheid.nl/BWBR0008503/2015-05-13#Artikel1
  - number: BIV:2
    text: |-
      De totale hoeveelheid koolhydraten in groente- en vruchtensappen en nectars, in uitsluitend uit vruchten bestaande
      gerechten, in nagerechten of in puddingen is niet groter dan:

        - 10 g/100 ml voor groentesappen en daarop gebaseerde dranken;
        - 15 g/100 ml voor vruchtensappen en nectars en daarop gebaseerde dranken;
        - 20 g/100 g voor uitsluitend uit vruchten bestaande gerechten;
        - 25 g/100 g voor nagerechten en puddingen;
        - 5 g/100 g voor andere niet op melk gebaseerde dranken.
    url: https://wetten.overheid.nl/BWBR0008503/2015-05-13#Artikel2
  - number: BIV:3
    text: |-
      3.1 Voor vlees, gevogelte, vis, orgaanvlees of een andere traditionele eiwitbron.

      Indien vlees of kaas de enige bestanddelen zijn of als eerste in de aanduiding van een eetwaar worden genoemd, is
      de totale hoeveelheid vet in de eetwaar uit alle bronnen niet groter dan 1,4 g/100 kJ (6 g/100 kcal).

      3.2 Voor alle overige eet- of drinkwaren is de totale hoeveelheid vet in de eetwaar uit alle bronnen niet groter
      dan 1,1 g/100kJ (4,5 g/100 kcal).
    url: https://wetten.overheid.nl/BWBR0008503/2015-05-13#Artikel3
  - number: BIV:4
    text: |-
      4.1 Het uiteindelijke natriumgehalte van de eetwaar is niet hoger dan 48 mg/100 kJ (200 mg/100 kcal) of 200 mg/100
      g. Indien kaas het enige bestanddeel is dat in de aanduiding van de eetwaar wordt genoemd, is het uiteindelijke
      natriumgehalte van de eetwaar niet hoger dan 70 mg/100 kJ (300 mg/100 kcal).

      4.2 Aan eet- of drinkwaren op basis van vruchten en aan nagerechten en puddingen worden geen natriumzouten
      toegevoegd, tenzij dit om technologische redenen gebeurt.
    url: https://wetten.overheid.nl/BWBR0008503/2015-05-13#Artikel4
  - number: BIV:5
    text: |-
      Het uiteindelijke gehalte aan vitamine C van vruchtensappen, nectars of groentesappen is niet lager dan 6 mg/100 kJ
      (25 mg/100 kcal) of 25 mg/100 g.

      Het uiteindelijke gehalte aan vitamine A van groentesappen is niet lager dan 25 µg RE/100 kJ (100 µg RE/100 kcal)
      (RE = all-transretinol-equivalent).

      Vitamine A wordt niet toegevoegd aan andere babyvoeding.

      Vitamine D wordt niet toegevoegd aan babyvoeding.
    url: https://wetten.overheid.nl/BWBR0008503/2015-05-13#Artikel5
