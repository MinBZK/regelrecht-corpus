        paragraaf: '6'
  - number: '23.1'
    text: Het college neemt op aanvraag een besluit omtrent toelating van een gewasbeschermingsmiddel.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel23
  - number: '23.2'
    text: |-
      Een besluit omtrent toelating wordt genomen binnen een bij algemene maatregel van bestuur te bepalen termijn.
      Deze termijn kan krachtens algemene maatregel van bestuur worden vastgesteld indien dit noodzakelijk is voor de
      uitvoering van een communautaire maatregel inzake de opneming of niet opneming van een werkzame stof op bijlage I
      bij [richtlijn 91/414/EEG](31991L0414).
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel23
  - number: '23.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen gevallen worden aangewezen waarbij een op aanvraag te nemen
      besluit omtrent toelating na de in het tweede lid bedoelde termijn, van rechtswege is verleend of niet verleend.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel23
  - number: '23.4'
    text: |-
      Indien een besluit omtrent toelating niet binnen de in het tweede lid bedoelde termijn, kan worden genomen en een
      eerder verstrekte toelating van het gewasbeschermingsmiddel voor het einde van die termijn vervalt, kan het college
      het vervallen van de eerder verstrekte toelating opschorten tot de dag waarop het college op de aanvraag heeft
      besloten, onverminderd [artikel 28, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel28
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '23.5'
    text: |-
      Het eerste tot en met vierde lid zijn van overeenkomstige toepassing op besluiten tot verlenging, intrekking of
      wijziging die op aanvraag zijn genomen.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel23
  - number: '24.1'
    text: |-
      Een aanvraag wordt in behandeling genomen indien de aanvraag in de Nederlandse taal is opgesteld en wordt ingediend
      door een binnen de Europese Unie gevestigde:
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel24
  - number: 24.1.a
    text: |-
      natuurlijke persoon of rechtspersoon die verantwoordelijk is voor het op de markt brengen van het
      gewasbeschermingsmiddel;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel24
  - number: 24.1.b
    text: officiële instantie, die zich bezig houdt met landbouwactiviteiten;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel24
  - number: 24.1.c
    text: wetenschappelijke instantie, die zich bezig houdt met landbouwactiviteiten;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel24
  - number: 24.1.d
    text: beroepsinstantie op landbouwgebied;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel24
  - number: 24.1.e
    text: beroepsgebruiker.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel24
  - number: '24.2'
    text: |-
      Een aanvraag van een instantie of gebruiker als bedoeld in het eerste lid, onderdelen b tot en met e, wordt slechts
      in behandeling genomen indien die aanvraag betreft:
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel24
  - number: 24.2.a
    text: |-
      een uitbreiding van de toepassing van een eerder toegelaten gewasbeschermingsmiddel als bedoeld in
      [artikel 31][ref1], eerste lid;


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel31
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '31'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 24.2.b
    text: |-
      toelating van een gewasbeschermingsmiddel als bedoeld in [artikel 32, eerste lid][ref1], of [33, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel33
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '32'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0021670
        artikel: '33'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '25.1'
    text: 'Een aanvraag gaat vergezeld van de volgende documenten:'
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel25
  - number: 25.1.a
    text: |-
      een dossier betreffende het gewasbeschermingsmiddel dat, voldoet aan bij of krachtens algemene maatregel van
      bestuur gestelde regels voor de uitvoering van [richtlijn 91/414/EEG](31991L0414) of een voor die richtlijn
      vastgestelde communautaire maatregel of een verklaring van toegang tot voornoemd dossier;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel25
  - number: 25.1.b
    text: |-
      een dossier betreffende elke werkzame stof in het gewasbeschermingsmiddel dat voldoet aan bij of krachtens algemene
      maatregel van bestuur gestelde regels voor de uitvoering van [richtlijn 91/414/EEG](31991L0414) of een voor die
      richtlijn vastgestelde communautaire maatregel of een verklaring van toegang tot een dossier als hiervoor bedoeld.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel25
  - number: '25.2'
    text: |-
      Indien Onze Minister overweegt een voordracht te doen tot vaststelling, wijziging, of intrekking van een algemene
      maatregel van bestuur als bedoeld in het eerste lid kan hij, indien een onmiddellijke voorziening vereist is,
      regelen stellen overeenkomstig de voorgenomen maatregelen.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel25
  - number: '25.3'
    text: |-
      Een regeling als bedoeld in het tweede lid blijft, behoudens eerdere intrekking, van kracht totdat de daar bedoelde
      algemene maatregel van bestuur, in werking treedt, doch uiterlijk tot acht maanden na het in werking treden van
      de regeling.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel25
  - number: '26.1'
    text: |-
      Een aanvraag die vergezeld gaat van een dossier waar proeven op gewervelde dieren aan ten grondslag liggen,
      wordt niet in behandeling genomen tenzij de aanvrager voorafgaand aan die proeven bij het college inlichtingen
      heeft ingewonnen omtrent proeven op gewervelde dieren die bij een eerdere aanvraag tot toelating van een
      gewasbeschermingsmiddel zijn uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel26
  - number: '26.2'
    text: 'Het college verstrekt de volgende informatie:'
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel26
  - number: 26.2.a
    text: of de eerdere aanvraag tot een toelating heeft geleid;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel26
  - number: 26.2.b
    text: de naam en het adres van degene op naam van wie de toelating is geregistreerd.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel26
  - number: '26.3'
    text: |-
      Het college maakt de identiteit van de betrokken partijen over en weer bekend, nadat hij zekerheid heeft gekregen
      over het voornemen tot het doen van proeven op gewervelde dieren.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel26
  - number: '26.4'
    text: |-
      De betrokken partijen als bedoeld in het derde lid, doen al hetgeen redelijkerwijs van hen kan worden verlangd
      om overeenstemming te bereiken over de uitwisseling van informatie, ten einde onnodige herhaling van proeven met
      gewervelde dieren te beperken.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel26
  - number: '26.5'
    text: |-
      Het college stelt op grond van [artikel 8][ref1] regels over uitwisseling van gegevens, waaronder regels over de
      vergoeding te betalen door de aanvrager voor de kosten van proeven op gewervelde dieren van degenen die eerder
      gegevens over deze proeven hebben overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel8
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '8'
        hoofdstuk: '2'
  - number: '27.1'
    text: |-
      Het college gebruikt bij de behandeling van de aanvraag geen gegevens die door andere aanvragers zijn verstrekt,
      tenzij de aanvrager met de andere aanvrager schriftelijk is overeengekomen dat deze gegevens mogen worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel27
  - number: '27.2'
    text: |-
      In afwijking van het eerste lid, kan het college, bij de behandeling van de aanvraag gebruik maken van gegevens die
      door andere aanvragers zijn verstrekt indien:
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel27
  - number: 27.2.a
    text: |-
      met betrekking tot de gegevens voor de opneming van de werkzame stof in bijlage I bij [richtlijn 91/414/EEG]
      (31991L0414) een periode van tien jaar is verstreken na de datum van opname in bijlage I bij [richtlijn 91/414/EEG]
      (31991L0414) van de in het gewasbeschermingsmiddel werkzame stof, of
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel27
  - number: 27.2.b
    text: |-
      met betrekking tot andere gegevens dan de gegevens, bedoeld in onderdeel a, een periode van tien jaar is verstreken
      na de toelating door het college van een gewasbeschermingsmiddel, voor zover voor die toelating door andere
      aanvragers gegevens zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel27
  - number: '27.3'
    text: |-
      In afwijking van het eerste lid, kan het college, bij de behandeling van de aanvraag gebruik maken van aanvullende
      gegevens die door andere aanvragers zijn verstrekt voor:
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel27
  - number: 27.3.a
    text: de opname van een werkzame stof,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel27
  - number: 27.3.b
    text: het wijzigen van de voorwaarden voor de opname van een werkzame stof, of
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel27
  - number: 27.3.c
    text: |-
      de handhaving van de opname van een werkzame stof, in bijlage I bij [richtlijn 91/414/EEG](31991L0414) indien een
      periode van vijf jaar is verstreken na de datum van het besluit van de Commissie van de Europese Gemeenschappen
      volgend op de ontvangst van de betreffende aanvullende gegevens.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel27
  - number: '27.4'
    text: |-
      Het college gebruikt de in het derde lid bedoelde aanvullende gegevens van een andere aanvrager niet eerder dan
      nadat de periodes genoemd in het tweede lid, onderdelen a en b, zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel27
  - number: '28.1'
    text: 'Een gewasbeschermingsmiddel wordt toegelaten indien het gewasbeschermingsmiddel voldoet aan de voorwaarde dat:'
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel28
  - number: 28.1.a
    text: |-
      de werkzame stoffen die het bevat in bijlage I bij [richtlijn 91/414/EEG](31991L0414) zijn vermeld en voldoen aan
      de voorwaarden van die bijlage,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel28
  - number: 28.1.b
    text: |-
      het gewasbeschermingsmiddel na toepassing van de uniforme beginselen van bijlage VI bij [richtlijn 91/414/EEG]
      (31991L0414) op grond van de stand van de wetenschappelijke en technische kennis aan de hand van het onderzoek
      van het dossier, rekening houdend met alle normale omstandigheden waaronder het gewasbeschermingsmiddel kan worden
      gebruikt en de gevolgen van het gebruik:
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel28
  - number: 28.1.b.1°
    text: voldoende werkzaam is,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel28
  - number: 28.1.b.2°
    text: geen onaanvaardbare uitwerking heeft op planten of plantaardige producten,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel28
  - number: 28.1.b.3°
    text: geen onnodig lijden of pijn veroorzaakt bij te bestrijden gewervelde dieren,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel28
  - number: 28.1.b.4°
    text: |-
      geen directe of indirecte schadelijke uitwerking heeft op de gezondheid van mens of dier via drinkwater, voedsel,
      voer of welke andere wijze dan ook of op het grondwater, en
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel28
  - number: 28.1.b.5°
    text: |-
      geen voor het milieu onaanvaardbaar effect heeft, waarbij in het bijzonder rekening wordt gehouden met de volgende
      aspecten: '- de plaats waar het middel in het milieu terechtkomt en wordt verspreid, met name voor wat betreft'
      besmetting van het water, waaronder drinkwater en grondwater,
        - de gevolgen voor niet-doelsoorten,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel28
  - number: 28.1.c
    text: |-
      de aard en de hoeveelheid van de werkzame stoffen en zo nodig de in toxicologisch en ecotoxicologisch opzicht
      belangrijke onzuiverheden en hulpstoffen worden bepaald overeenkomstig de bij een communautaire maatregel
      vastgestelde methoden, of, voor zover deze methoden niet zijn vastgesteld, overeenkomstig door Onze Minister
      vastgestelde of goedgekeurde methoden,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel28
  - number: 28.1.d
    text: |-
      de residuen die het gevolg zijn van geoorloofd gebruik die in toxicologisch opzicht of vanuit milieu oogpunt van
      belang zijn, kunnen worden bepaald met algemeen gebruikte passende methoden,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel28
  - number: 28.1.e
    text: |-
      de fysische en chemische eigenschappen van het gewasbeschermingsmiddel zijn vastgesteld en voor juist gebruik en
      adequate opslag van het middel aanvaardbaar zijn geacht, en
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel28
  - number: 28.1.f
    text: |-
      de voorlopige maximum residugehalten op landbouwproducten die zijn bepaald aanvaardbaar zijn en aan de Commissie
      der Europese Gemeenschappen zijn medegedeeld.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel28
  - number: '28.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld inzake de toepassing van uniforme beginselen
      als bedoeld in het eerste lid, onderdeel b, aanhef, voor de beoordeling van gewasbeschermingsmiddelen.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel28
  - number: '28.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de beoordelingsmethoden bij de
      toepassing van de toelatingsvoorwaarden, bedoeld in het eerste lid, alsmede regels inzake onder meer:
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel28
  - number: 28.3.a
    text: de geschiktheid voor niet-professionele gebruikers;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel28
  - number: 28.3.b
    text: |-
      de methode waarmee de op grond van [artikel 29][ref1] vast te stellen voorschriften worden bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel29
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '29'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '28.4'
    text: Een toelating geldt voor een in het besluit tot toelating te bepalen termijn van ten hoogste tien jaren.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel28
  - number: '28.5'
    text: |-
      Indien Onze Minister overweegt een voordracht te doen tot vaststelling, wijziging, of intrekking van een algemene
      maatregel van bestuur als bedoeld in het tweede en derde lid kan hij, indien een onmiddellijke voorziening vereist
      is, regelen stellen overeenkomstig de voorgenomen maatregelen.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel28
  - number: '28.6'
    text: |-
      Een regeling als bedoeld in het vijfde lid blijft, behoudens eerdere intrekking, van kracht totdat de daar bedoelde
      algemene maatregel van bestuur, in werking treedt, doch uiterlijk tot acht maanden na het in werking treden van
      de regeling.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel28
  - number: '29.1'
    text: 'Het college geeft bij de toelating voorschriften omtrent:'
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel29
  - number: 29.1.a
    text: de doeleinden waarvoor het gewasbeschermingsmiddel uitsluitend dan wel niet gebruikt mag worden,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel29
  - number: 29.1.b
    text: |-
      de voorzorgsmaatregelen die nodig zijn om te kunnen voldoen aan het gestelde in
      [artikel 28, eerste lid, onderdelen b tot en met f][ref1], alsmede het krachtens het
      [tweede, derde en vijfde lid van dat artikel][ref2] bepaalde,


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel28
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0021670
        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 29.1.c
    text: goede praktijken alsmede waar mogelijk, de toepassing van de beginselen van geïntegreerde bestrijding, en
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel29
  - number: 29.1.d
    text: |-
      de samenstelling, kleur, grootte, vorm, afwerking, verpakking, aanduidingen en vermeldingen op, aan, bij of van de
      verpakking van het gewasbeschermingsmiddel.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel29
  - number: '29.2'
    text: 'Het college kan bij de toelating voorts voorschriften geven over onder meer:'
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel29
  - number: 29.2.a
    text: |-
      het op de markt brengen van een gewasbeschermingsmiddel voor een aangewezen categorie van personen of
      rechtspersonen,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel29
  - number: 29.2.b
    text: 'het gebruik van een gewasbeschermingsmiddel voor een aangewezen categorie van personen of rechtspersonen alsmede:'
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel29
  - number: 29.2.b.1°
    text: de tijden en plaatsen waarop,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel29
  - number: 29.2.b.2°
    text: de klimatologische omstandigheden waaronder,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel29
  - number: 29.2.b.3°
    text: de doseringen waarin,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel29
  - number: 29.2.b.4°
    text: de wijze waarop, of
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel29
  - number: 29.2.b.5°
    text: de technische hulpmiddelen waarmede, het gewasbeschermingsmiddel wordt toegepast,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel29
  - number: 29.2.c
    text: het gebruik van technische veiligheidsmaatregelen, of
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel29
  - number: 29.2.d
    text: |-
      door de gebruiker van het gewasbeschermingmiddel in acht te nemen veiligheidstermijnen, voorzorgsmaatregelen en
      veiligheidsadviezen met betrekking tot de bescherming van zichzelf, andere gebruikers, leveranciers, werknemers,
      consumenten, dieren of het milieu bij:
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel29
  - number: 29.2.d.1°
    text: het oogsten of in het verkeer brengen van behandelde planten of delen daarvan,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel29
  - number: 29.2.d.2°
    text: het gebruik van behandelde planten of delen daarvan,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel29
  - number: 29.2.d.3°
    text: het telen van gewassen op behandelde grond,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel29
  - number: 29.2.d.4°
    text: het gebruik van behandeld water,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel29
  - number: 29.2.d.5°
    text: het betreden of gebruiken van behandelde ruimten, oppervlakken en goederen,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel29
  - number: 29.2.d.6°
    text: het betreden of gebruiken van ruimten, waarin zich behandelde goederen bevinden of bevonden, of
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel29
  - number: 29.2.d.7°
    text: |-
      het informeren van gebruikers, leveranciers en werknemers over de gevaren en de maatregelen tot voorkoming van
      gevaar bij handelingen als bedoeld onder 1° tot en met 6°.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel29
  - number: '29.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld voor de toepassing van het eerste en
      tweede lid alsmede over te stellen voorschriften inzake:
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel29
  - number: 29.3.a
    text: |-
      de toepassing van beginselen van geïntegreerde bestrijding als bedoeld in [artikel 78][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel78
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '78'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: 29.3.b
    text: |-
      de uitvoering van goede praktijken als bedoeld in [artikel 79][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel79
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '79'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: 29.3.c
    text: |-
      het gebruik van voertuigen, werktuigen, methoden, technieken, materialen bij de toepassing van
      gewasbeschermingsmiddelen als bedoeld in [artikel 80][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel80
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '80'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: 29.3.d
    text: |-
      een ingevolge [artikel 81][ref1] aan te vragen vergunning, vrijstelling, ontheffing of meldingsplicht.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel81
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '81'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '29.4'
    text: |-
      Indien Onze Minister overweegt een voordracht te doen tot vaststelling, wijziging, of intrekking van een algemene
      maatregel van bestuur als bedoeld in het derde lid kan hij, indien een onmiddellijke voorziening vereist is,
      regelen stellen overeenkomstig de voorgenomen maatregelen.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel29
  - number: '29.5'
    text: |-
      Een regeling als bedoeld in het vierde lid blijft, behoudens eerdere intrekking, van kracht totdat de daar bedoelde
      algemene maatregel van bestuur, in werking treedt, doch uiterlijk tot acht maanden na het in werking treden van
      de regeling.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel29
  - number: '30.1'
    text: |-
      Aanvragen voor bijzondere vormen van toelating als bedoeld in deze paragraaf worden overeenkomstig de
      [paragrafen 1][ref1] en [2][ref2] van dit hoofdstuk in behandeling genomen voor zover in deze paragraaf geen
      andersluidende bepalingen zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0021670
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0021670
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '30.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor bijzondere vormen van toelating als bedoeld in deze
      paragraaf nadere regels worden gesteld in verband met de bijzondere aard van die vormen van toelating.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel30
  - number: '31.1'
    text: |-
      Het college kan op aanvraag besluiten tot uitbreiding van de toepassing van een
      eerder toegelaten gewasbeschermingsmiddel aan de hand van de voorwaarden, bedoeld in
      [artikel 28, eerste lid, onderdeel b, onder 3° tot en met 5°][ref1], wanneer het voorgenomen gebruik een kleine
      omvang heeft in vergelijking met het gebruik dat verband houdt met de eerdere toelating.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel28
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '31.2'
    text: |-
      Het college besluit op een aanvraag als bedoeld in het eerste lid of op verzoek van Onze Minister tot uitbreiding
      van een toepassing als bedoeld in het eerste lid, wanneer dit in het openbaar belang is en het voorgenomen gebruik
      van kleine omvang is.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel31
  - number: '31.3'
    text: |-
      De aanvrager deelt het college bij de aanvraag mede hoe de voorschriften voor de uitbreiding van de toepassing aan
      de gebruikers wordt medegedeeld.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel31
  - number: '31.4'
    text: |-
      Het college kan in het belang van de volksgezondheid, arbeidsbescherming en het milieu ambtshalve een wijze van
      mededelen bepalen.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel31
  - number: '31.5'
    text: Onze Minister kan regels stellen voor de toepassing van het tweede en vierde lid.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel31
  - number: '32.1'
    text: |-
      Het college besluit tot toelating van een gewasbeschermingsmiddel indien op grond van een ander toelatingsbesluit
      dat middel in dezelfde samenstelling onder een andere handelsnaam maar voor een zelfde doeleinde is toegelaten.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel32
  - number: '32.2'
    text: |-
      De [artikelen 25, eerste en derde lid][ref1], alsmede [26 tot en met 29][ref2] zijn niet van toepassing op een
      aanvraag als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel26
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '25'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0021670
        artikel: '26'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '32.3'
    text: |-
      Het in het eerste lid bedoelde andere toelatingsbesluit geldt eveneens voor het gewasbeschermingsmiddel dat
      krachtens het eerste lid is toegelaten.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel32
  - number: '33.1'
    text: 'Het college besluit tot toelating van een gewasbeschermingsmiddel dat:'
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel33
  - number: 33.1.a
    text: in een andere Staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte is toegelaten,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel33
  - number: 33.1.b
    text: |-
      wordt ingevoerd vanuit een andere Staat die partij is bij de Overeenkomst betreffende de Europese Economische
      Ruimte waar het middel is toegelaten,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel33
  - number: 33.1.c
    text: niet wezenlijk verschilt van een reeds in Nederland toegelaten gewasbeschermingsmiddel en
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel33
  - number: 33.1.d
    text: |-
      afkomstig is van de onderneming die het in onderdeel c, bedoelde gewasbeschermingsmiddel vervaardigt,
      een daarmee gelieerde onderneming, een onderneming die onder licentie het gewasbeschermingsmiddel
      vervaardigt of een onderneming die beschikt over de verklaringen van toegang, bedoeld in
      [artikel 25, eerste lid, onderdelen a en b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel25
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '25'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '33.2'
    text: |-
      De [artikelen 25, eerste en derde lid][ref1], alsmede [26 tot en met 29][ref2] zijn niet van toepassing op een
      aanvraag als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel26
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '25'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0021670
        artikel: '26'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '33.3'
    text: |-
      Alle besluiten inzake toelating van het in het eerste lid, onderdeel c, bedoelde toegelaten gewasbeschermingsmiddel
      gelden eveneens voor het gewasbeschermingsmiddel dat op grond van dit artikel wordt toegelaten.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel33
  - number: '34.1'
    text: |-
      In afwijking van [artikel 28][ref1] besluit het college tot voorlopige toelating van een gewasbeschermingsmiddel
      dat een werkzame stof bevat die niet is vermeld in bijlage I bij [richtlijn 91/414/EEG](31991L0414) en die op 26
      juli 1993 nog niet in een lidstaat van de Europese Unie op de markt was en daarmee niet ingevolge een communautaire
      maatregel is gelijkgesteld, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel28
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 34.1.a
    text: |-
      de werkzame stof naar het oordeel van het college voldoet aan de voorwaarden om in bijlage I bij [richtlijn 91/414/
      EEG](31991L0414) geplaatst te mogen worden en
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel34
  - number: 34.1.b
    text: |-
      het gewasbeschermingsmiddel naar het oordeel van het college voldoet aan het gestelde bij of
      krachtens [artikel 28, eerste lid, onderdelen b tot en met f][ref1], alsmede het krachtens het
      [tweede, derde en vijfde lid van dat artikel][ref2] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel28
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0021670
        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '34.2'
    text: |-
      Een toelating als bedoeld in het eerste lid geldt in afwijking van [artikel 28, vierde lid][ref1], voor een termijn
      van maximaal drie jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel28
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '34.3'
    text: |-
      Het college doet onverwijld aan de Commissie van de Europese Gemeenschappen en de andere lidstaten een kennisgeving
      van de beoordeling van het dossier en de toelatingsvoorwaarden.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel34
  - number: '35'
    text: |-
      In afwijking van [artikel 24, eerste lid][ref1], kan het college op aanvraag van Onze Minister besluiten tot
      toelating van een gewasbeschermingsmiddel indien:


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel24
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 35.a
    text: de werkzame stof niet met het oog op gebruik als gewasbeschermingsmiddel op de markt wordt gebracht,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel35
  - number: 35.b
    text: |-
      de fabrikant of importeur niet beweert dat sprake is van een voldoende werkzaamheid ter bescherming van planten of
      gewassen, en
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel35
  - number: 35.c
    text: |-
      het gewasbeschermingsmiddel naar het oordeel van het college onder door het college te stellen voorschriften aan
      het gestelde bij of krachtens [artikel 28, eerste lid, onderdelen b tot en met f][ref1], alsmede het krachtens het
      [tweede, derde en vijfde lid van dat artikel][ref2] bepaalde voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel28
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0021670
        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '36.1'
    text: |-
      Het college besluit tot toelating van een gewasbeschermingsmiddel dat een of meer werkzame stoffen bevat die zijn
      vermeld in bijlage I bij [richtlijn 91/414/EEG](31991L0414) en waarvan de werkzame stoffen deel uitmaken van een
      in een andere lidstaat van de Europese Unie toegelaten gewasbeschermingsmiddel. De aanvrager verstrekt gegevens om
      de vergelijkbaarheid van het gewasbeschermingsmiddel met het in een andere lidstaat van de Europese Unie toegelaten
      gewasbeschermingsmiddel te staven.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel36
  - number: '36.2'
    text: |-
      Het college kan geen herhaling van proeven of analyses vragen van de in het eerste lid genoemde
      gewasbeschermingsmiddelen voor zover de agrarische, fytosanitaire, ecologische, met inbegrip van klimatologische
      omstandigheden bij de proeven of analyses die in de andere lidstaat zijn uitgevoerd met betrekking tot het gebruik
      van het gewasbeschermingsmiddel, vergelijkbaar zijn met de Nederlandse omstandigheden.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel36
  - number: '36.3'
    text: |-
      Het college neemt bij de toelating voorschriften op die voortvloeien uit bij of krachtens algemene maatregel van
      bestuur vast te stellen regels indien:
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel36
  - number: 36.3.a
    text: |-
      die verband houden met verschillen in voedingsgewoonten en noodzakelijk zijn in verband met de consumptie van
      behandelde producten of
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel36
  - number: 36.3.b
    text: |-
      de agrarische, fytosanitaire en ecologische met in begrip van klimatologische omstandigheden niet vergelijkbaar
      zijn met de omstandigheden die zich in de in het eerste lid genoemde lidstaat voordoen.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel36
  - number: '36.4'
    text: |-
      Het college stelt de aanvrager, Onze Minister en de Commissie van de Europese Gemeenschappen in kennis van
      de gevallen waarin herhaling van een proef wordt geëist en van de gevallen waarin het college voornemens is
      toelating van een reeds in een lidstaat van de Europese Unie toegelaten gewasbeschermingsmiddel te weigeren,
      terwijl de aanvrager aanvoert dat de agrarische, fytosanitaire en ecologische, met inbegrip van klimatologische,
      omstandigheden met betrekking tot het gebruik van het middel in de gebieden van de lidstaat waar de proef is
      uitgevoerd of waarvoor de toelating is verstrekt vergelijkbaar zijn met die in Nederland.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel36
  - number: '36.5'
    text: |-
      Het college geeft bij zijn voornemen, bedoeld in het vierde lid, de naam en specificaties van het
      gewasbeschermingsmiddel alsmede de redenen van het voornemen tot weigering van de toelating.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel36
  - number: '36.6'
    text: |-
      Wanneer de Commissie van de Europese Gemeenschappen een communautaire maatregel heeft genomen naar aanleiding
      van een kennisgeving van het college als bedoeld in het vierde lid of een kennisgeving van een autoriteit van
      een andere lidstaat van de Europese Unie, deelt Onze Minister aan het college mede of er redenen zijn om in
      afwijking van de communautaire maatregel het gewasbeschermingsmiddel voorlopig toe te laten, toelating van het
      gewasbeschermingsmiddel te weigeren, de toelating van het gewasbeschermingsmiddel te beperken of in te trekken.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel36
  - number: '36.7'
    text: |-
      Het college besluit tot toelating, weigert een toelating, beperkt een toelating of trekt een toelating in ingevolge
      daartoe door de Commissie van de Europese Gemeenschappen genomen communautaire maatregelen, overeenkomstig de
      mededeling van Onze Minister, bedoeld in het zesde lid.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel36
  - number: '37.1'
    text: |-
      Het college kan op aanvraag vrijstelling verlenen van de verboden, bedoeld in de [artikelen 19][ref1] en
      [20][ref2], voor een gewasbeschermingsmiddel met betrekking tot een proef of experiment voor onderzoek of
      ontwikkelingsdoeleinden, indien de proef of het experiment naar het oordeel van het college onder gecontroleerde
      omstandigheden en voor beperkte hoeveelheden en oppervlakten wordt uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel20
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '19'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0021670
        artikel: '20'
        hoofdstuk: '3'
  - number: '37.2'
    text: |-
      De aanvrager verstrekt het college alle beschikbare gegevens op grond waarvan de mogelijke gevolgen voor de
      gezondheid van mens en dier alsmede het effect op het milieu kunnen worden beoordeeld.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel37
  - number: '37.3'
    text: |-
      Het college besluit niet tot vrijstelling indien de voorgenomen proef of het voorgenomen experiment schadelijke
      gevolgen voor de gezondheid van mens en dier of onaanvaardbare nadelige effecten op het milieu kan hebben zonder
      dat deze gevolgen of effecten onder het stellen van voorschriften voorkomen kunnen worden.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel37
  - number: '37.4'
    text: |-
      Het college kan aan een vrijstelling voorschriften verbinden en verbindt in ieder geval aan een vrijstelling
      voorschriften die noodzakelijk zijn voor de uitvoering van gemeenschappelijke voorwaarden als bedoeld in artikel
      22, vierde lid, van [richtlijn 91/414/EEG](31991L0414), voor zover deze voorwaarden zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel37
  - number: '37.5'
    text: Een vrijstelling kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel37
  - number: '37.6'
    text: |-
      Onze Minister kan instanties erkennen met het oog op het verrichten van bepaalde proeven en experimenten en
      daarbij voorschriften stellen voor de wijze waarop de proeven of experimenten worden verricht. Onze Minister kan de
      erkenning naar zijn oordeel schorsen, wijzigen of intrekken.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel37
  - number: '37.7'
    text: |-
      Onze Minister kan bij regeling voorwaarden stellen voor de erkenning van instanties. Onze Minister geeft bij het
      vaststellen van voornoemde voorwaarden onder meer uitvoering aan gemeenschappelijke voorwaarden als bedoeld in
      artikel 22, vierde lid, van [richtlijn 91/414/EEG](31991L0414), voor zover deze voorwaarden zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel37
  - number: '37.8'
    text: |-
      Onze Minister kan bij regeling bepalen dat hij een aanvraag tot erkenning als bedoeld in het zesde lid eerst in
      behandeling neemt, nadat een daarvoor vastgesteld bedrag is voldaan.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel37
  - number: '38.1'
    text: |-
      Onze Minister kan ambtshalve of op aanvraag in bijzondere omstandigheden vrijstelling verlenen met het oog op
      een beperkt en gecontroleerd gebruik van de verboden, bedoeld in de [artikelen 19][ref1] en [20][ref2], voor
      ten hoogste 120 dagen, voor het gebruik van een gewasbeschermingsmiddel, indien de plantaardige productie door
      onvoorziene, op geen enkele andere wijze te bestrijden gevaren wordt bedreigd.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel20
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '19'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0021670
        artikel: '20'
        hoofdstuk: '3'
  - number: '38.2'
    text: |-
      De in het eerste lid bedoelde vrijstelling wordt in ieder geval verleend ter uitvoering van een communautaire
      maatregel, die is gericht op een te bestrijden gevaar.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel38
  - number: '38.3'
    text: Aan een vrijstelling kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel38
  - number: '38.4'
    text: Een vrijstelling kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel38
  - number: '38.5'
    text: |-
      Indien naar het oordeel van Onze Minister een onverwijlde voorziening noodzakelijk is, kan Onze Minister bepalen
      dat de vrijstelling onmiddellijk in werking treedt. In dat geval kan hij de vrijstelling, in afwijking van
      [artikel 3:42, tweede lid, van de Algemene wet bestuursrecht][ref1] op een andere wijze bekend maken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '38.6'
    text: |-
      Onze Minister kan bij regeling bepalen dat hij een aanvraag als bedoeld in het eerste lid eerst in behandeling
      neemt, nadat een daarvoor vastgesteld bedrag is voldaan.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel38
  - number: '39.1'
    text: |-
      Het college kan op aanvraag iedere toelating met toepassing van de [paragrafen 1][ref1] en [2][ref2] van dit
      hoofdstuk verlengen of opnieuw verlengen met maximaal tien jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0021670
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0021670
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '39.2'
    text: |-
      In afwijking van het eerste lid kan een toelating als bedoeld in [artikel 34, eerste lid][ref1], slechts worden
      verlengd na toepassing van de in artikel 19 van [richtlijn 91/414/EEG](31991L0414) genoemde procedure voor de bij
      die procedure bepaalde voorwaarden en termijnen of voor zover voornoemde procedure nog niet tot een communautaire
      maatregel heeft geleid voor een periode die nodig is om het dossier en eventueel aanvullende informatie volledig te
      kunnen onderzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel34
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '39.3'
    text: |-
      Een vrijstelling als bedoeld in [artikel 38, eerste lid][ref1], kan door Onze Minister worden verlengd na
      toepassing van de in artikel 19 van [richtlijn 91/414/EEG](31991L0414) genoemde procedure voor de bij die procedure
      bepaalde voorwaarden en termijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel38
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '38'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: '40.1'
    text: |-
      Iedere natuurlijke persoon of rechtspersoon, die een gewasbeschermingsmiddel op de markt brengt dat is toegelaten,
      of waarvoor een vrijstelling is verstrekt, is verplicht het college onmiddellijk op de hoogte te stellen van alle
      nieuwe gegevens betreffende mogelijk gevaarlijke gevolgen van het gewasbeschermingsmiddel of de residuen daarvan
      voor de gezondheid van mens, dier of het milieu.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel40
  - number: '40.2'
    text: |-
      De in het eerste lid genoemde plicht tot verstrekken van gegevens richt zich eveneens tot andere aanvragers als
      bedoeld in [artikel 24, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel24
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '40.3'
    text: |-
      Het college kan ambtshalve het op de markt brengen, binnen Nederland brengen, op voorraad hebben, voorhanden hebben
      of gebruiken van een gewasbeschermingsmiddel tijdelijk beperken of verbieden indien er gegronde redenen zijn om
      te oordelen dat een toegelaten gewasbeschermingsmiddel gevaar oplevert voor de gezondheid van mens of dier dan wel
      onaanvaardbare effecten heeft op het milieu.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel40
  - number: '40.4'
    text: 'Het college brengt onverwijld:'
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel40
  - number: 40.4.a
    text: Onze Minister,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel40
  - number: 40.4.b
    text: de Commissie van de Europese Gemeenschappen, en
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel40
  - number: 40.4.c
    text: |-
      andere lidstaten van de Europese Unie, op de hoogte van nieuwe gegevens als bedoeld in het eerste lid, alsmede een
      beperking of een verbod als bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel40
  - number: '41.1'
    text: |-
      Het college kan een toelating intrekken op verzoek van de natuurlijke persoon of rechtspersoon ten name van wie de
      toelating is opgenomen in het register, bedoeld in [artikel 42, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel42
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '6'
  - number: '41.2'
    text: |-
      Het college kan een toelating wijzigen met toepassing van de [paragrafen 1][ref1] en [2][ref2] van dit hoofdstuk
      op verzoek van de natuurlijke persoon of rechtspersoon ten name van wie de toelating is opgenomen in het register,
      bedoeld in [artikel 42, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0021670#Artikel42
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0021670
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0021670
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0021670
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '6'
  - number: '41.3'
    text: |-
      Het college trekt een toelating of een toepassing van een toegelaten gewasbeschermingsmiddel ambtshalve of op
      aanvraag geheel of gedeeltelijk in indien:
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel41
  - number: 41.3.a
    text: |-
      er aanwijzingen bestaan dat met in achtneming van de voorschriften bedoeld in [artikel 29][ref1], niet langer wordt
      voldaan aan de bij of krachtens [artikel 28][ref2] gestelde regels,


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel28
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '29'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0021670
        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 41.3.b
    text: |-
      onjuiste of misleidende informatie is verstrekt met betrekking tot de gegevens op basis waarvan het
      gewasbeschermingsmiddel is toegelaten, of
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel41
  - number: 41.3.c
    text: |-
      de natuurlijke persoon of rechtspersoon ten name van wie de toelating is opgenomen in het register, bedoeld in
      [artikel 42, tweede lid][ref1], de jaarlijkse vergoeding, bedoeld in [artikel 10, eerste lid, onderdeel e][ref2],
      niet voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel10
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0021670
        artikel: '10'
        hoofdstuk: '2'
  - number: '41.4'
    text: |-
      Het college wijzigt een toelating ambtshalve of op aanvraag indien naar het oordeel van het college op grond van
      nieuwe wetenschappelijke en technische kennis de wijze van gebruik en de gebruikte hoeveelheden kunnen worden
      gewijzigd.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel41
  - number: '41.5'
    text: |-
      Bij wijziging of intrekking van een toelating bepaalt het college of, in hoeverre, en voor welke termijn het is
      toegestaan om een niet meer voor bepaalde toepassingen te gebruiken of niet meer toegelaten gewasbeschermingsmiddel
      in afwijking van [artikel 20][ref1] op de markt te brengen, in voorraad te houden, voorhanden te hebben of te
      gebruiken.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel20
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '20'
        hoofdstuk: '3'
  - number: '41.6'
    text: |-
      Vrijstellingen kunnen ambtshalve of op aanvraag worden gewijzigd en ingetrokken. Het eerste tot en met vierde lid
      zijn van overeenkomstige toepassing op vrijstellingen.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel41
  - number: '41.7'
    text: |-
      Onverminderd het zesde lid besluit het college bij wijziging of intrekking van vrijstellingen als bedoeld in
      [artikel 37, eerste lid][ref1], overeenkomstig het [vierde lid van dat artikel][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel37
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0021670
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: '41.8'
    text: |-
      Onverminderd het eerste tot en met zevende lid worden toelatingen of vrijstellingen voor gewasbeschermingsmiddelen
      gewijzigd of ingetrokken indien voor de in het betrokken gewasbeschermingsmiddel opgenomen werkzame stof een
      communautaire maatregel is genomen om te voldoen aan de bij die communautaire maatregel bepaalde voorwaarden en
      termijnen.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel41
  - number: '42.1'
    text: |-
      Een besluit omtrent toelating of vrijstelling met betrekking tot een gewasbeschermingsmiddel, dan wel verlenging,
      wijziging of intrekking daarvan alsmede een tijdelijke beperking of verbod tot het op de markt brengen of gebruik
      van een gewasbeschermingsmiddel worden in de Staatscourant bekendgemaakt en medegedeeld aan de aanvrager.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel42
  - number: '42.2'
    text: Het college draagt zorg voor een register dat volgens door Onze Minister te stellen regels wordt ingericht.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel42
  - number: '42.3'
    text: Alle in het eerste lid genoemde besluiten worden in het register vermeld.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel42
  - number: '42.4'
    text: |-
      De door het college via elektronische weg openbaar gemaakte informatie inzake de registratie van besluiten geeft
      een weerlegbaar vermoeden van de inhoud van de geregistreerde besluiten.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel42
  - number: '43.1'
    text: |-
      Het college of Onze Minister besluit in afwijking van de [Wet openbaarheid van bestuur][ref1] en in
      afwijking van de [artikelen 3:7, tweede lid][ref2], [3:11, tweede lid][ref3], [7:4, zevende lid][ref4],
      [7:18, zevende lid][ref5], en [8:29, tweede lid, van de Algemene wet bestuursrecht][ref6] over de openbaarmaking
      van bij het college onderscheidenlijk Onze Minister aanwezige gegevens inzake toelating of vrijstelling van
      gewasbeschermingsmiddelen op grond van het bij of krachtens deze wet bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0005252
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '43.2'
    text: |-
      Een aanvrager van een toelating kan het college gemotiveerd meedelen welke commercieel gevoelige informatie waarvan
      bekendmaking hem op industrieel of commercieel gebied zou kunnen schaden, voor iedereen behalve het college en
      de Commissie van de Europese Gemeenschappen vertrouwelijk blijft. Het college behandelt voornoemde commercieel
      gevoelige informatie vertrouwelijk als het college de motivering aanvaardt.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel43
  - number: '43.3'
    text: |-
      Het college neemt de nodige stappen om de vertrouwelijkheid van de volledige samenstelling van productformules
      te garanderen.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel43
  - number: '43.4'
    text: Het college behandelt informatie, die door andere lidstaten als vertrouwelijk is gekwalificeerd, vertrouwelijk.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel43
  - number: '43.5'
    text: 'De volgende informatie wordt niet als vertrouwelijk beschouwd:'
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel43
  - number: 43.5.a
    text: de naam en het adres van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel43
  - number: 43.5.b
    text: de naam en het adres van de fabrikant van het gewasbeschermingsmiddel;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel43
  - number: 43.5.c
    text: de naam en het adres van de fabrikant van de werkzame stof;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel43
  - number: 43.5.d
    text: de naam en het gehalte van de werkzame stof en de naam van het gewasbeschermingsmiddel;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel43
  - number: 43.5.e
    text: |-
      de namen van andere stoffen die uit hoofde van [titel 9.2 van de Wet milieubeheer][ref1] als gevaarlijk worden
      beschouwd en een rol spelen bij de indeling van het product;


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 43.5.f
    text: de fysische en chemische eigenschappen van de werkzame stof en het gewasbeschermingsmiddel;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel43
  - number: 43.5.g
    text: de wijzen waarop het gewasbeschermingsmiddel onschadelijk kan worden gemaakt;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel43
  - number: 43.5.h
    text: |-
      een beknopt overzicht van de resultaten van de krachtens [artikel 28][ref1] vereiste proeven die ertoe strekken de
      werkzaamheid en de onschadelijkheid van het middel voor mens, dier, plant en milieu vast te stellen;


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel28
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 43.5.i
    text: |-
      de methoden en voorzorgsmaatregelen die worden aanbevolen om de risico's van hantering, opslag, vervoer, brand en
      andere risico's te beperken;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel43
  - number: 43.5.j
    text: veiligheidsinformatiebladen;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel43
  - number: 43.5.k
    text: |-
      de analysemethoden die bij de beoordeling als bedoeld in
      [artikel 28, eerste lid, onderdeel b, onder 4 en 5 en onderdelen c en d][ref1], alsmede het derde lid, onderdeel a,
      zijn toegepast;


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel28
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 43.5.l
    text: de methoden voor het verwijderen van het middel en de verpakking daarvan;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel43
  - number: 43.5.m
    text: de te volgen procedures en de te nemen maatregelen bij morsen of lekken;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel43
  - number: 43.5.n
    text: de te verlenen eerste hulp en de medische behandeling bij persoonlijke ongevallen.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel43
  - number: '43.6'
    text: |-
      Indien de aanvrager, fabrikant of importeur van het gewasbeschermingsmiddel of van de werkzame stof op een later
      tijdstip informatie vrijgeeft die voordien vertrouwelijk was, wordt het college daarvan op de hoogte gebracht.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel43
  - number: '43.7'
    text: |-
      Onze Minister kan voor de uitvoering van communautaire maatregelen regels stellen over de openbaarmaking van
      informatie.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel43
  - number: '44.1'
    text: Het college neemt op aanvraag een besluit omtrent toelating van een biocide.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel44
  - number: '44.2'
    text: |-
      Een besluit omtrent toelating wordt genomen binnen een bij algemene maatregel van bestuur te bepalen termijn.
      Deze termijn kan krachtens algemene maatregel van bestuur worden vastgesteld indien dit noodzakelijk is voor de
      uitvoering van een communautaire maatregel inzake de opneming of niet opneming van een werkzame stof op bijlage I,
      IA of IB bij [richtlijn 98/8/EG](31998L0008).
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel44
  - number: '44.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen gevallen worden aangewezen waarbij een op aanvraag te nemen
      besluit omtrent toelating na de in het tweede lid bedoelde termijn, van rechtswege is verleend of niet verleend.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel44
  - number: '44.4'
    text: |-
      Indien een besluit omtrent toelating niet binnen de in het tweede lid bedoelde termijn, kan worden genomen en een
      eerder verstrekte toelating van de biocide voor het einde van die termijn vervalt, kan het college het vervallen
      van de eerder verstrekte toelating opschorten tot de dag waarop het college op de aanvraag heeft besloten,
      onverminderd [artikel 49, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel49
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '49'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '44.5'
    text: |-
      Het eerste tot en met vierde lid zijn van overeenkomstige toepassing op besluiten tot verlenging, intrekking of
      wijziging die op aanvraag zijn genomen.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel44
  - number: '45.1'
    text: |-
      Een aanvraag wordt in behandeling genomen indien de aanvraag in de Nederlandse taal is opgesteld en wordt ingediend
      door een natuurlijke persoon of rechtspersoon, die verantwoordelijk is voor het op de markt brengen van de biocide
      en die binnen de Europese Gemeenschap een permanente vestiging heeft.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel45
  - number: '45.2'
    text: 'Een aanvraag gaat vergezeld van de volgende documenten:'
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel45
  - number: 45.2.a
    text: |-
      een dossier betreffende de biocide dat, voldoet aan bij of krachtens algemene maatregel van bestuur gestelde
      regels voor de uitvoering van [richtlijn 98/8/EG](31998L0008) of een voor die richtlijn vastgestelde communautaire
      maatregel of een verklaring van toegang tot voornoemd dossier;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel45
  - number: 45.2.b
    text: |-
      een dossier betreffende elke werkzame stof in de biocide dat, voldoet aan bij of krachtens algemene maatregel
      van bestuur gestelde regels voor de uitvoering van [richtlijn 98/8/EG](31998L0008) of een voor die richtlijn
      vastgestelde communautaire maatregel of een verklaring van toegang tot een dossier als hiervoor bedoeld.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel45
  - number: '45.3'
    text: |-
      Indien Onze Minister overweegt een voordracht te doen tot vaststelling, wijziging, of intrekking van een algemene
      maatregel van bestuur als bedoeld in het tweede lid, onderdelen a of b, kan hij, indien een onmiddellijke
      voorziening vereist is, regelen stellen overeenkomstig de voorgenomen maatregelen.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel45
  - number: '45.4'
    text: |-
      Een regeling als bedoeld in het derde lid blijft, behoudens eerdere intrekking, van kracht totdat de daar bedoelde
      algemene maatregel van bestuur, in werking treedt, doch uiterlijk tot acht maanden na het in werking treden van
      de regeling.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel45
  - number: '46.1'
    text: |-
      Een aanvraag die vergezeld gaat van een dossier waar proeven op gewervelde dieren aan ten grondslag liggen wordt
      niet in behandeling genomen tenzij, de aanvrager voorafgaand aan die proeven bij het college inlichtingen heeft
      ingewonnen omtrent proeven op gewervelde dieren die bij een eerdere aanvraag tot toelating van een biocide zijn
      uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel46
  - number: '46.2'
    text: 'Het college verstrekt de volgende informatie:'
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel46
  - number: 46.2.a
    text: |-
      of de biocide waarvoor een aanvraag wordt ingediend, gelijkenis vertoont met een biocide waarvoor reeds een
      toelating is verleend;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel46
  - number: 46.2.b
    text: de naam en het adres van degenen op naam van wie de toelating is geregistreerd.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel46
  - number: '46.3'
    text: |-
      Het college maakt de identiteit van de betrokken partijen over en weer bekend, nadat hij zekerheid heeft gekregen
      over het voornemen tot het doen van proeven op gewervelde dieren.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel46
  - number: '46.4'
    text: |-
      De betrokken partijen als bedoeld in het derde lid doen al hetgeen redelijkerwijs van hen kan worden verlangd om
      overeenstemming te bereiken over de uitwisseling van informatie, teneinde zo mogelijk een herhaling van proeven met
      gewervelde dieren te beperken.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel46
  - number: '46.5'
    text: |-
      Het college stelt op grond van [artikel 8][ref1] regels over uitwisseling van gegevens, waaronder regels over de
      vergoeding te betalen door de aanvrager voor de kosten van proeven op gewervelde dieren van degenen die eerder
      gegevens over deze proeven hebben overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel8
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '8'
        hoofdstuk: '2'
  - number: '47.1'
    text: |-
      Het college gebruikt bij de behandeling van de aanvraag geen gegevens die door andere aanvragers zijn verstrekt,
      tenzij de aanvrager met de andere aanvrager schriftelijk is overeengekomen dat deze gegevens mogen worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel47
  - number: '47.2'
    text: |-
      In afwijking van het eerste lid kan het college bij de behandeling van de aanvraag gebruik maken van gegevens die
      door andere aanvragers zijn verstrekt nadat:
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel47
  - number: 47.2.a
    text: |-
      met betrekking tot de gegevens voor de opneming van de werkzame stof in bijlage I, IA of IB bij [richtlijn 98/8/
      EG](31998L0008) een periode van vijftien jaar is verstreken na de datum van opname in bijlage I, IA of IB bij
      [richtlijn 98/8/EG](31998L0008) van de in de biocide werkzame stof, indien die werkzame stof op of na 15 mei 2000
      op de markt van de Europese Unie is toegelaten,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel47
  - number: 47.2.b
    text: |-
      een periode van tien jaar is verstreken na de toelating door het college van een biocide, waarvan de werkzame stof
      vóór 15 mei 2000 op de markt van de Europese Unie was en die voor de opname in bijlage I, IA of IB bij [richtlijn
      98/8/EG](31998L0008) is toegelaten voor zover voor die toelating door andere aanvragers gegevens zijn verstrekt, of
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel47
  - number: 47.2.c
    text: |-
      een periode van tien jaar is verstreken na de datum van opname in bijlage I, IA of IB bij [richtlijn 98/8/EG]
      (31998L0008) van een biocide of een nieuwe productsoort, waarvan de werkzame stof vóór 15 mei 2000 op de markt van
      de Europese Unie was toegelaten voor zover voor die besluiten door die andere aanvragers gegevens zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel47
  - number: '47.3'
    text: |-
      In afwijking van het eerste lid kan het college, bij de behandeling van de aanvraag gebruik maken van aanvullende
      gegevens die door een andere aanvrager zijn verstrekt voor:
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel47
  - number: 47.3.a
    text: de opname van een werkzame stof;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel47
  - number: 47.3.b
    text: het wijzigen van de voorwaarden voor de opname van een werkzame stof, of
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel47
  - number: 47.3.c
    text: de handhaving van de opname van een werkzame stof,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel47
  - number: '47.4'
    text: |-
      Het college gebruikt de in het derde lid bedoelde aanvullende gegevens van een andere aanvrager niet eerder dan
      nadat de periodes genoemd in het tweede lid, onderdelen a, b, en c, zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel47
  - number: '48.1'
    text: |-
      In afwijking van deze paragraaf worden biociden met een gering risico beoordeeld volgens een procedure als bedoeld
      in [paragraaf 4][ref1] van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0021670
        hoofdstuk: '5'
        paragraaf: '4'
  - number: '48.2'
    text: |-
      In afwijking van deze paragraaf worden biociden die voldoen aan het bepaalde in [artikel 63][ref1] niet beoordeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel63
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '63'
        hoofdstuk: '5'
        paragraaf: '5'
  - number: '49.1'
    text: 'Een biocide wordt toegelaten indien de biocide voldoet aan de voorwaarde dat:'
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel49
  - number: 49.1.a
    text: |-
      de werkzame stoffen die het bevat in bijlage I bij [richtlijn 98/8/EG](31998L0008) zijn vermeld en voldoen aan de
      voorwaarden van die bijlage,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel49
  - number: 49.1.b
    text: |-
      de biocide na toepassing van de gemeenschappelijke beginselen van bijlage VI bij [richtlijn 98/8/EG](31998L0008)
      op grond van de stand van de wetenschappelijke en technische kennis en aan de hand van het onderzoek van het
      overeenkomstig [artikel 45, tweede lid][ref1], verstrekte dossier, bij gebruik overeenkomstig het besluit tot
      toelating, rekening houdend met alle omstandigheden waaronder de biocide normaliter wordt gebruikt, de wijze waarop
      het met de biocide behandelde materiaal kan worden gebruikt en de gevolgen van gebruik en verwijdering:


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel45
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '45'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 49.1.b.1°
    text: voldoende werkzaam is,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel49
  - number: 49.1.b.2°
    text: |-
      geen onaanvaardbare effecten heeft op de doelorganismen, zoals onaanvaardbare resistentie of kruisresistentie of
      onnodig lijden en pijn voor gewervelde dieren,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel49
  - number: 49.1.b.3°
    text: |-
      zelf of via zijn residuen geen onaanvaardbare effecten heeft op: - de gezondheid van mens of dier, hetzij direct,
      hetzij indirect, waaronder via drinkwater, voedsel, voer, lucht in gebouwen, of door omstandigheden op de werkplek,
      dan wel,
        - het oppervlaktewater of het grondwater, en
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel49
  - number: 49.1.b.4°
    text: |-
      zelf of via zijn residuen geen onaanvaardbare effecten heeft op het milieu, waarbij in het bijzonder rekening wordt
      gehouden met de volgende aspecten: - lot en verspreiding in het milieu, met name met betrekking tot verontreiniging
      van oppervlaktewateren, met inbegrip van estuariumwater en zeewater, grondwater en drinkwater alsmede
        - de gevolgen voor niet-doelorganismen,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel49
  - number: 49.1.c
    text: |-
      de aard en de hoeveelheid van de werkzame stoffen en zo nodig eventuele in toxicologisch en ecotoxicologisch
      opzicht belangrijke verontreinigingen en hulpstoffen, en de residuen die in toxicologisch opzicht of voor het
      milieu van belang zijn en bij toegelaten gebruik ontstaan, worden bepaald overeenkomstig de bij een communautaire
      maatregel vastgestelde methoden, of voor zover deze methoden niet zijn vastgesteld, overeenkomstig door Onze
      Minister vastgestelde of goedgekeurde methoden, en
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel49
  - number: 49.1.d
    text: |-
      de fysische en chemische eigenschappen van het product zijn vastgesteld en voor de juiste wijze van gebruik, opslag
      en vervoer van het product aanvaardbaar zijn geacht.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel49
  - number: '49.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld inzake de toepassing van gemeenschappelijke
      beginselen als bedoeld in het eerste lid, onderdeel b, aanhef, voor de beoordeling van biociden.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel49
  - number: '49.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de beoordelingsmethoden bij de
      toepassing van de toelatingsvoorwaarden, bedoeld in het eerste lid, alsmede regels inzake onder meer:
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel49
  - number: 49.3.a
    text: de geschiktheid voor niet-professionele gebruikers;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel49
  - number: 49.3.b
    text: |-
      de methode waarmee de op grond van [artikel 50][ref1] vast te stellen voorschriften worden bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel50
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '50'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '49.4'
    text: Een toelating geldt voor een in het besluit tot toelating te bepalen termijn van ten hoogste tien jaren.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel49
  - number: '49.5'
    text: |-
      Indien Onze Minister overweegt een voordracht te doen tot vaststelling, wijziging, of intrekking van een algemene
      maatregel van bestuur als bedoeld in het tweede of derde lid kan hij, indien een onmiddellijke voorziening vereist
      is, regelen stellen overeenkomstig de voorgenomen maatregelen.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel49
  - number: '49.6'
    text: |-
      Een regeling als bedoeld in het vijfde lid blijft, behoudens eerdere intrekking, van kracht totdat de daar bedoelde
      algemene maatregel van bestuur, in werking treedt, doch uiterlijk tot acht maanden na het in werking treden van
      de regeling.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel49
  - number: '50.1'
    text: 'Het college geeft bij de toelating voorschriften omtrent:'
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel50
  - number: 50.1.a
    text: de doeleinden waarvoor de biocide uitsluitend dan wel niet gebruikt mag worden,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel50
  - number: 50.1.b
    text: |-
      de voorzorgsmaatregelen die nodig zijn om te kunnen voldoen aan het gestelde in
      [artikel 49, eerste lid, onderdelen b tot en met d][ref1], alsmede het krachtens het
      [tweede, derde en vijfde lid van dat artikel][ref2] bepaalde,


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel49
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '49'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0021670
        artikel: '49'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 50.1.c
    text: een juist gebruik van een biocide, en
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel50
  - number: 50.1.d
    text: |-
      de samenstelling, kleur, grootte, vorm, afwerking, verpakking, aanduidingen en vermeldingen op, aan, bij of van de
      verpakking van de biocide.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel50
  - number: '50.2'
    text: 'Het college kan bij de toelating voorts voorschriften geven over onder meer:'
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel50
  - number: 50.2.a
    text: het op de markt brengen van een biocide voor een aangewezen categorie van personen of rechtspersonen,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel50
  - number: 50.2.b
    text: 'het gebruik van een biocide voor een aangewezen categorie van personen of rechtspersonen alsmede:'
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel50
  - number: 50.2.b.1°
    text: de tijden en plaatsen waarop,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel50
  - number: 50.2.b.2°
    text: de klimatologische omstandigheden waaronder,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel50
  - number: 50.2.b.3°
    text: de doseringen waarin,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel50
  - number: 50.2.b.4°
    text: de wijze waarop, of
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel50
  - number: 50.2.b.5°
    text: de technische hulpmiddelen waarmee, de biocide wordt toegepast, of
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel50
  - number: 50.2.c
    text: |-
      door de gebruiker van de biocide in acht te nemen veiligheidstermijnen, voorzorgsmaatregelen en veiligheidsadviezen
      met betrekking tot de bescherming van zichzelf, andere gebruikers, leveranciers, werknemers, consumenten, dieren of
      het milieu bij:
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel50
  - number: 50.2.c.1°
    text: het gebruik van behandelde grond,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel50
  - number: 50.2.c.2°
    text: het gebruik van behandeld water,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel50
  - number: 50.2.c.3°
    text: het betreden of gebruiken van behandelde ruimten, oppervlakken, producten en goederen,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel50
  - number: 50.2.c.4°
    text: het betreden of gebruiken van ruimten, waarin zich behandelde goederen bevinden of bevonden, of
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel50
  - number: 50.2.c.5°
    text: |-
      het informeren van gebruikers, leveranciers, werknemers en consumenten over de gevaren en de maatregelen tot
      voorkoming van gevaar bij handelingen als bedoeld onder 1° tot en met 4°.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel50
  - number: '50.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld voor de toepassing van het eerste of
      tweede lid alsmede over te stellen voorschriften inzake:
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel50
  - number: 50.3.a
    text: |-
      een juist gebruik als bedoeld in [artikel 78][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel78
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '78'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: 50.3.b
    text: |-
      de uitvoering van goede praktijken als bedoeld in [artikel 79][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel79
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '79'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: 50.3.c
    text: |-
      het gebruik van voertuigen, werktuigen, methoden, technieken en materialen bij de toepassing van biociden als
      bedoeld in [artikel 80][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel80
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '80'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: 50.3.d
    text: |-
      een ingevolge [artikel 81][ref1] aan te vragen vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel81
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '81'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '50.4'
    text: |-
      Indien Onze Minister overweegt een voordracht te doen tot vaststelling, wijziging, of intrekking van een algemene
      maatregel van bestuur als bedoeld in het derde lid kan hij, indien een onmiddellijke voorziening vereist is,
      regelen stellen overeenkomstig de voorgenomen maatregelen.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel50
  - number: '50.5'
    text: |-
      Een regeling als bedoeld in het vierde lid blijft, behoudens eerdere intrekking, van kracht totdat de daar bedoelde
      algemene maatregel van bestuur, in werking treedt, doch uiterlijk tot acht maanden na het in werking treden van
      de regeling.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel50
  - number: '51.1'
    text: |-
      Aanvragen voor bijzondere vormen van toelating als bedoeld in deze paragraaf worden overeenkomstig de
      [paragrafen 1][ref1] en [2][ref2] van dit hoofdstuk in behandeling genomen voor zover in deze paragraaf geen
      andersluidende bepalingen zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0021670
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0021670
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '51.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor bijzondere vormen van toelating als bedoeld in deze
      paragraaf nadere regels worden gesteld in verband met de bijzondere aard van die vormen van toelating.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel51
  - number: '52.1'
    text: |-
      Het college besluit tot toelating van een biocide indien op grond van een ander toelatingsbesluit die biocide in
      dezelfde samenstelling onder een andere handelsnaam maar voor eenzelfde doeleinde is toegelaten.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel52
  - number: '52.2'
    text: |-
      De [artikelen 45, tweede en vierde lid][ref1], alsmede [46 tot en met 50][ref2] zijn niet van toepassing op een
      aanvraag als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel46
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '45'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0021670
        artikel: '46'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '52.3'
    text: |-
      Het in het eerste lid, bedoelde andere toelatingsbesluit geldt eveneens voor de biocide die krachtens het eerste
      lid is toegelaten.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel52
  - number: '53.1'
    text: 'Het college besluit tot toelating van een biocide die:'
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel53
  - number: 53.1.a
    text: in een andere Staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte is toegelaten,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel53
  - number: 53.1.b
    text: |-
      wordt ingevoerd vanuit een andere Staat die partij is bij de Overeenkomst betreffende de Europese Economische
      Ruimte waar het middel is toegelaten,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel53
  - number: 53.1.c
    text: niet wezenlijk verschilt van een reeds in Nederland toegelaten biocide, en
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel53
  - number: 53.1.d
    text: |-
      afkomstig is van de onderneming die de in onderdeel c, bedoelde biocide vervaardigt, een daarmee gelieerde
      onderneming, een onderneming die onder licentie de biocide vervaardigt of een onderneming die beschikt over de
      verklaringen van toegang, bedoeld in [artikel 45, tweede lid, onderdelen a en b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel45
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '45'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '53.2'
    text: |-
      De [artikelen 45, tweede en vierde lid][ref1], alsmede [46 tot en met 50][ref2] zijn niet van toepassing op een
      aanvraag als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel46
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '45'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0021670
        artikel: '46'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '53.3'
    text: |-
      Alle besluiten inzake toelating van de in het eerste lid, onderdeel c, bedoelde reeds in Nederland toegelaten
      biocide gelden eveneens voor de biocide die op grond van dit artikel wordt toegelaten.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel53
  - number: '54.1'
    text: |-
      In afwijking van [artikel 49][ref1] besluit het college tot voorlopige toelating van een biocide die een werkzame
      stof bevat die niet is vermeld in bijlage I of IA bij [richtlijn 98/8/EG](31998L0008) en die op 15 mei 2000 nog
      niet in een lidstaat van de Europese Unie op de markt was en daarmee niet ingevolge een communautaire maatregel is
      gelijkgesteld, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel49
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '49'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 54.1.a
    text: |-
      de werkzame stof naar het oordeel van het college voldoet aan de voorwaarden om in bijlage I of IA bij [richtlijn
      98/8/EG](31998L0008) geplaatst te mogen worden,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel54
  - number: 54.1.b
    text: |-
      de biocide naar het oordeel van het college voldoet aan het gestelde bij of krachtens
      [artikel 49, eerste lid, onderdelen b tot en met d][ref1], alsmede het krachtens het
      [tweede, derde en vijfde lid van dat artikel][ref2] bepaalde, en


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel49
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '49'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0021670
        artikel: '49'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 54.1.c
    text: |-
      er op basis van de samenvatting die aan alle overige lidstaten van de Europese Unie is toegezonden geen bezwaren
      zijn ontvangen van die lidstaten.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel54
  - number: '54.2'
    text: |-
      Een toelating als bedoeld in het eerste lid geldt, in afwijking van [artikel 49, vierde lid][ref1], voor een
      termijn van maximaal drie jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel49
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '49'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '54.3'
    text: |-
      Het college doet onverwijld aan de Commissie van de Europese Gemeenschappen en de andere lidstaten een kennisgeving
      van de beoordeling van het dossier en de toelatingsvoorwaarden.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel54
  - number: '55'
    text: |-
      In afwijking van [artikel 45, eerste lid][ref1], kan het college op aanvraag van Onze Minister besluiten tot
      toelating van een biocide indien:


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel45
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '45'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 55.a
    text: de werkzame stof niet met het oog op gebruik als biocide op de markt wordt gebracht,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel55
  - number: 55.b
    text: |-
      de fabrikant of importeur niet beweert dat er sprake is van een voldoende werkzaamheid ter bescherming van de
      gezondheid van mens of dier dan wel ter voorkoming van schade aan natuurlijke of vervaardigde producten, en
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel55
  - number: 55.c
    text: |-
      de biocide naar het oordeel van het college onder door het college te stellen voorschriften aan het gestelde
      bij of krachtens [artikel 49, eerste lid, onderdelen b tot en met d][ref1], alsmede het krachtens het
      [tweede, derde en vijfde lid van dat artikel][ref2] bepaalde voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel49
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '49'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0021670
        artikel: '49'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '56.1'
    text: |-
      Het college besluit tot toelating van een biocide dat reeds in een andere lidstaat van de Europese Unie is
      toegelaten, indien de werkzame stof of de combinatie van werkzame stoffen van de biocide in bijlage I bij
      [richtlijn 98/8/EG](31998L0008) is opgenomen en voldoet aan de in die bijlagen opgenomen eisen.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel56
  - number: '56.2'
    text: 'Een aanvraag tot toelating van een biocide, als bedoeld in het eerste lid bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel56
  - number: 56.2.a
    text: |-
      een samenvatting van het dossier, bedoeld in [artikel 45, tweede lid, onder a][ref1], alsmede


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel45
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '45'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 56.2.b
    text: een gewaarmerkt afschrift van de toelating uit de in het eerste lid bedoelde lidstaat.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel56
  - number: '56.3'
    text: |-
      Het college neemt bij de toelating voorschriften op die voortvloeien uit bij of krachtens algemene maatregel van
      bestuur vast te stellen regels indien:
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel56
  - number: 56.3.a
    text: de doelsoort niet in schadelijke hoeveelheden voorkomt,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel56
  - number: 56.3.b
    text: bij het doelorganisme onaanvaardbare tolerantie voor of resistentie tegen de biocide is aangetoond, of
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel56
  - number: 56.3.c
    text: |-
      de relevante toepassingsomstandigheden, bijvoorbeeld het klimaat of de voortplantingsperiode van de doelsoort, in
      belangrijke mate afwijken van die in de lidstaat waar de biocide het eerst werd toegelaten.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel56
  - number: '56.4'
    text: |-
      In afwijking van het eerste lid kan het college de toelating van producten die onder de soorten 15, 17 en 23 van
      bijlage V bij [richtlijn 98/8/EG](31998L0008) vallen, weigeren, indien die weigering kan worden gerechtvaardigd
      en verenigbaar is met de doelstellingen van [richtlijn 98/8](31998L0008). Het college brengt de lidstaten van
      de Europese Unie en de Commissie van de Europese Gemeenschappen op de hoogte van dergelijke besluiten en van de
      redenen die eraan ten grondslag liggen.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel56
  - number: '56.5'
    text: |-
      Onverminderd het derde lid stelt het college, indien het college van mening is dat een door een andere lidstaat
      toegelaten biocide niet aan de in bij of krachtens [artikel 49][ref1] gestelde regels kan voldoen en het college
      voornemens is de toelating te weigeren of de toelating onder bepaalde voorwaarden te beperken, de aanvrager, de
      Commissie van de Europese Gemeenschappen en de andere lidstaten daarvan in kennis met de naam en specificaties van
      de biocide alsmede de redenen van het voornemen.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel49
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '49'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '56.6'
    text: |-
      Wanneer de Commissie van de Europese Gemeenschappen of de Raad van de Europese Unie een communautaire maatregel
      heeft genomen naar aanleiding van een kennisgeving van het college als bedoeld in het vijfde lid of een
      kennisgeving van een autoriteit van een andere lidstaat van de Europese Unie, deelt Onze Minister aan het college
      mede of er redenen zijn om in afwijking van de communautaire maatregel de biocide voorlopig toe te laten, toelating
      van de biocide te weigeren, de toelating van de biocide te beperken of een toelating in te trekken.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel56
  - number: '56.7'
    text: |-
      Het college besluit tot toelating, weigert een toelating, beperkt een toelating of trekt een toelating in ingevolge
      daartoe door de Commissie van de Europese Gemeenschappen of de Raad van de Europese Unie genomen communautaire
      maatregelen, overeenkomstig de mededeling van Onze Minister, bedoeld in het zesde lid.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel56
  - number: '57.1'
    text: Aanvragen voor registratie worden volgens de procedure en voorwaarden van deze paragraaf in behandeling genomen.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel57
  - number: '57.2'
    text: |-
      Tenzij anders aangegeven, zijn alle bepalingen inzake de toelating van een biocide ook van toepassing op de
      registratie van een biocide.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel57
  - number: '58'
    text: 'Een registratie wordt verleend onder de voorwaarde dat:'
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel58
  - number: 58.a
    text: |-
      de werkzame stof of stoffen in bijlage IA bij [richtlijn 98/8/EG](31998L0008) zijn vermeld en aan de eisen van die
      bijlagen is voldaan en
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel58
  - number: 58.b
    text: de biocide geen tot bezorgdheid aanleiding gevende stof bevat.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel58
  - number: '59.1'
    text: |-
      De registratie wordt aangevraagd door een natuurlijke persoon of rechtspersoon, die een biocide met een gering
      risico op de markt brengt en die binnen de Europese Gemeenschap een permanente vestiging heeft.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel59
  - number: '59.2'
    text: 'De aanvraag tot registratie bevat de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel59
  - number: 59.2.a
    text: de naam en het adres van de aanvrager,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel59
  - number: 59.2.b
    text: |-
      een vermelding van alle fabrikanten van de biocide alsmede de namen en adressen, met inbegrip van de
      vestigingsplaats, van de fabrikant van de werkzame stoffen,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel59
  - number: 59.2.c
    text: zo nodig, een verklaring van toegang tot het dossier met de benodigde relevante gegevens,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel59
  - number: 59.2.d
    text: de identiteit van de biocide en de handelsnaam,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel59
  - number: 59.2.e
    text: de volledige samenstelling van de biocide alsmede de fysische en chemische eigenschappen en het beoogde gebruik,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel59
  - number: 59.2.f
    text: |-
      de vermelding van een productsoort overeenkomstig bij ministeriële regeling vast te stellen soorten biociden en
      toepassingsgebieden,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel59
  - number: 59.2.g
    text: de categorie van gebruikers,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel59
  - number: 59.2.h
    text: de gebruiksmethode,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel59
  - number: 59.2.i
    text: de gegevens over de doeltreffendheid,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel59
  - number: 59.2.j
    text: de analysemethoden,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel59
  - number: 59.2.k
    text: de verpakking en etikettering, waaronder een ontwerpetiket, en
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel59
  - number: 59.2.l
    text: |-
      een veiligheidsinformatieblad, opgesteld overeenkomstig artikel 31 en bijlage II van de verordening (EG) nr.
      1907/2006 van het Europees Parlement en de Raad van 18 december 2006 inzake de registratie en beoordeling van en
      de autorisatie en beperkingen ten aanzien van chemische stoffen (REACH), tot oprichting van een Europees Agentschap
      voor chemische stoffen, houdende wijziging van Richtlijn 1999/45/EG en houdende intrekking van Verordening (EEG)
      nr. 793/93 van de Raad en Verordening (EG) nr. 1488/94 van de Commissie alsmede Richtlijn 76/769/EEG van de Raad en
      de Richtlijnen 91/155/EEG, 93/67/EEG, 93/105/EG en 2000/21/EG van de Commissie (PbEU 2007, L 136).
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel59
  - number: '60'
    text: |-
      Een aanvraag voor de registratie van een biocide met een gering risico die reeds in een andere lidstaat van de
      Europese Unie is geregistreerd, wordt overeenkomstig het bepaalde in de [artikelen 58][ref1] en [59][ref2] in
      behandeling genomen, met uitzondering van de gegevens over de doeltreffendheid, waarvoor een samenvatting voldoende
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel59
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '58'
        hoofdstuk: '5'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0021670
        artikel: '59'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: '61.1'
    text: |-
      Het college weigert voorlopig de registratie van een biocide met een gering risico die door een andere lidstaat van
      de Europese Unie is geregistreerd, indien de biocide niet aan de krachtens [artikel 58][ref1] gestelde voorwaarden
      voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel58
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '58'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: '61.2'
    text: |-
      Bij een voorlopige weigering als bedoeld in het eerste lid stelt het college de bevoegde autoriteit van de in het
      eerste lid bedoelde andere lidstaat onmiddellijk in kennis van zijn bezwaren. Het college tracht met voornoemde
      bevoegde autoriteit binnen een termijn van ten hoogste 90 dagen tot overeenstemming te komen.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel61
  - number: '61.3'
    text: |-
      Na afloop van de termijn, genoemd in het tweede lid, stelt het college de aanvrager, de Commissie van de Europese
      Gemeenschappen en de andere lidstaten van zijn voornemen tot weigering van de registratie in kennis met de naam en
      specificaties van de biocide alsmede de redenen van het voornemen tot weigering van de registratie.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel61
  - number: '61.4'
    text: |-
      Bij een voorlopige weigering als bedoeld in het eerste lid, stelt het college de aanvrager, de Commissie van
      de Europese Gemeenschappen en de andere lidstaten daarvan in kennis met de naam en specificaties van de biocide
      alsmede de redenen van het voornemen tot weigering van de registratie.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel61
  - number: '61.5'
    text: |-
      Indien de Commissie van de Europese Gemeenschappen of de Raad van de Europese Unie een communautaire maatregel
      heeft genomen naar aanleiding van een kennisgeving van het college als bedoeld in het derde lid of een kennisgeving
      van een autoriteit van een andere lidstaat, deelt Onze Minister aan het college mede of er redenen zijn om
      in afwijking van de communautaire maatregel de biocide voorlopig te registreren, registratie te weigeren, de
      registratie te beperken of in te trekken.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel61
  - number: '61.6'
    text: |-
      Het college registreert, weigert te registreren, beperkt een registratie of trekt een registratie in na een
      procedure als bedoeld in het eerste tot en met vierde lid, ingevolge daartoe door de Commissie van de Europese
      Gemeenschappen of de Raad van de Europese Unie genomen communautaire maatregelen, overeenkomstig de mededeling van
      Onze Minister, bedoeld in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel61
  - number: '62.1'
    text: Het college stelt op aanvraag bij de toelating een kaderformulering vast.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel62
  - number: '62.2'
    text: Het college kan ambtshalve bij de toelating een kaderformulering vaststellen.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel62
  - number: '63'
    text: |-
      Stoffen die in bijlage IB bij [richtlijn 98/8/EG](31998L0008) opgenomen zijn, vallen niet onder de werking van deze
      wet en mogen vrijelijk op de markt worden gebracht en gebruikt voor zover aan de voorwaarden bij de opneming van
      een stof in bijlage IB bij [richtlijn 98/8/EG](31998L0008) is voldaan.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel63
  - number: '64.1'
    text: |-
      Het college kan op aanvraag vrijstelling verlenen van de verboden, bedoeld in de [artikelen 19][ref1] en
      [20][ref2], voor een biocide met betrekking tot een proef of experiment voor onderzoek of ontwikkelingsdoeleinden,
      indien de proef of het experiment naar het oordeel van het college onder gecontroleerde omstandigheden en voor
      beperkte hoeveelheden en oppervlakten wordt uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel20
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '19'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0021670
        artikel: '20'
        hoofdstuk: '3'
  - number: '64.2'
    text: |-
      De aanvrager verstrekt het college alle beschikbare gegevens op grond waarvan de mogelijke gevolgen voor de
      gezondheid van mens en dier alsmede het effect op het milieu kunnen worden beoordeeld.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel64
  - number: '64.3'
    text: |-
      Het college besluit niet tot vrijstelling indien de voorgenomen proef of het voorgenomen experiment schadelijke
      gevolgen voor de gezondheid van mens en dier of onaanvaardbare nadelige effecten op het milieu kan hebben zonder
      dat deze gevolgen of effecten onder het stellen van voorschriften voorkomen kunnen worden.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel64
  - number: '64.4'
    text: |-
      Het college kan aan een vrijstelling voorschriften verbinden en verbindt aan een vrijstelling in ieder geval
      voorschriften die de aanvrager verplichten gegevens bij te houden en zonodig aan het college te verstrekken alsmede
      voorschriften die noodzakelijk zijn voor de uitvoering van gemeenschappelijke voorwaarden als bedoeld in artikel
      17, vijfde lid, van [richtlijn 98/8/EG](31998L0008), voor zover deze voorwaarden zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel64
  - number: '64.5'
    text: Een vrijstelling kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel64
  - number: '64.6'
    text: |-
      Onze Minister kan instanties erkennen met het oog op het verrichten van bepaalde proeven en experimenten en
      daarbij voorschriften stellen voor de wijze waarop de proeven of experimenten worden verricht. Onze Minister kan de
      erkenning naar zijn oordeel schorsen, wijzigen of intrekken.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel64
  - number: '64.7'
    text: |-
      Onze Minister kan bij regeling regels stellen voor de erkenning van instanties, bedoeld in het zesde lid, alsmede
      regels die noodzakelijk zijn voor de uitvoering van de gemeenschappelijke voorwaarden als bedoeld in artikel 17,
      vijfde lid, van [richtlijn 98/8/EG](31998L0008), voor zover de gemeenschappelijke voorwaarden zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel64
  - number: '64.8'
    text: |-
      Onze Minister kan bij regeling in afwijking van het eerste lid regels stellen voor het melden of registreren van
      proeven of experimenten en het vaststellen van voorwaarden voor onder meer de uitvoering van artikel 17, eerste
      lid, onderdelen a en b, van [richtlijn 98/8/EG](31998L0008).
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel64
  - number: '64.9'
    text: |-
      Onze Minister kan bij regeling bepalen dat hij een aanvraag tot erkenning als bedoeld in het zesde lid eerst in
      behandeling neemt, nadat een daarvoor vastgesteld bedrag is voldaan.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel64
  - number: '65.1'
    text: |-
      Onze Minister kan ambtshalve of op aanvraag in bijzondere omstandigheden vrijstelling verlenen met het oog op
      een beperkt en gecontroleerd gebruik van de verboden, bedoeld in de [artikelen 19][ref1] en [20][ref2], voor ten
      hoogste 120 dagen, voor het gebruik van een biocide voor zover noodzakelijk wegens een, niet op andere wijze te
      bestrijden gevaar.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel20
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '19'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0021670
        artikel: '20'
        hoofdstuk: '3'
  - number: '65.2'
    text: |-
      De in het eerste lid bedoelde vrijstelling wordt in ieder geval verleend voor de uitvoering van een communautaire
      maatregel die is gericht op een te bestrijden gevaar.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel65
  - number: '65.3'
    text: Aan een vrijstelling kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel65
  - number: '65.4'
    text: Een vrijstelling kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel65
  - number: '65.5'
    text: |-
      Indien naar het oordeel van Onze Minister een onverwijlde voorziening noodzakelijk is, kan Onze Minister bepalen
      dat de vrijstelling onmiddellijk in werking treedt. In dat geval kan hij de vrijstelling, in afwijking van
      [artikel 3:42 van de Algemene wet bestuursrecht][ref1], op andere dan de daar genoemde wijze bekend maken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '65.6'
    text: |-
      Onze Minister kan bij regeling bepalen dat hij een aanvraag als bedoeld in het eerste lid eerst in behandeling
      neemt, nadat een daarvoor vastgesteld bedrag is voldaan.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel65
  - number: '66.1'
    text: |-
      Het college kan op aanvraag iedere toelating met toepassing van de [paragrafen 1][ref1] en [2][ref2] van dit
      hoofdstuk verlengen of opnieuw verlengen met maximaal tien jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0021670
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0021670
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '66.2'
    text: |-
      In afwijking van het eerste lid kan een toelating als bedoeld in [artikel 54][ref1] slechts worden verlengd na
      toepassing van de in artikel 28, tweede lid, van [richtlijn 98/8/EG](31998L0008) genoemde procedure voor de bij
      die procedure bepaalde voorwaarden en termijnen of voor zover voornoemde procedure nog niet tot een communautaire
      maatregel heeft geleid voor een periode van ten hoogste een jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel54
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '54'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '66.3'
    text: |-
      Een vrijstelling als bedoeld in [artikel 65, eerste lid][ref1], kan worden verlengd na toepassing van de in
      artikel 28, tweede lid, van [richtlijn 98/8/EG](31998L0008) genoemde procedure voor de bij die procedure bepaalde
      voorwaarden en termijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel65
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '65'
        hoofdstuk: '5'
        paragraaf: '6'
  - number: '67.1'
    text: |-
      Iedere natuurlijke persoon of rechtspersoon die een biocide op de markt brengt dat is toegelaten, of waarvoor een
      vrijstelling is verstrekt, is verplicht het college onmiddellijk op de hoogte te stellen van alle nieuwe gegevens
      betreffende mogelijk gevaarlijke gevolgen van de biocide of de residuen daarvan voor de gezondheid van mens, dier
      of het milieu. In het bijzonder moet kennis worden gegeven van:
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel67
  - number: 67.1.a
    text: nieuwe kennis of informatie betreffende de effecten van de werkzame stof of de biocide op de mens of het milieu;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel67
  - number: 67.1.b
    text: veranderingen in de herkomst of samenstelling van de werkzame stof of combinatie van werkzame stoffen;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel67
  - number: 67.1.c
    text: veranderingen in de samenstelling van een biocide;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel67
  - number: 67.1.d
    text: ontwikkeling van resistentie;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel67
  - number: 67.1.e
    text: veranderingen van administratieve aard of andere aspecten, zoals de aard van de verpakking.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel67
  - number: '67.2'
    text: |-
      Het college kan ambtshalve het op de markt brengen, binnen Nederland brengen, op voorraad hebben, voorhanden hebben
      of gebruiken van een biocide tijdelijk beperken of verbieden wanneer er gegronde redenen zijn om te oordelen dat
      een toegelaten biocide gevaar oplevert voor de gezondheid van mens of dier dan wel onaanvaardbare effecten heeft op
      het milieu.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel67
  - number: '67.3'
    text: 'Het college brengt onverwijld:'
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel67
  - number: 67.3.a
    text: Onze Minister,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel67
  - number: 67.3.b
    text: de Commissie van de Europese Gemeenschappen, en
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel67
  - number: 67.3.c
    text: andere lidstaten van de Europese Unie,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel67
  - number: '68.1'
    text: |-
      Het college kan een toelating intrekken op verzoek van de natuurlijke of rechtspersoon ten name van wie de
      toelating is opgenomen in het register, bedoeld in [artikel 42, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel42
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '6'
  - number: '68.2'
    text: |-
      Het college kan een toelating wijzigen met toepassing van de [paragrafen 1][ref1] en [2][ref2] van dit hoofdstuk
      op verzoek van de natuurlijke persoon of rechtspersoon ten name van wie de toelating is opgenomen in het register,
      bedoeld in [artikel 42, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0021670#Artikel42
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0021670
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0021670
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0021670
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '6'
  - number: '68.3'
    text: |-
      Het college trekt een toelating of een toepassing van een toegelaten biocide ambtshalve of op aanvraag geheel of
      gedeeltelijk in indien:
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel68
  - number: 68.3.a
    text: |-
      er aanwijzingen bestaan dat met in achtneming van de voorschriften bedoeld in [artikel 50][ref1], niet langer
      wordt voldaan aan de bij of krachtens [artikel 49][ref2] gestelde regels en de bij [artikel 58][ref3] gestelde
      toelatingsvoorwaarden,


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0021670#Artikel58
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '50'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0021670
        artikel: '49'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0021670
        artikel: '58'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: 68.3.b
    text: |-
      onjuiste of misleidende informatie is verstrekt met betrekking tot de gegevens op basis waarvan de biocide is
      toegelaten, of
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel68
  - number: 68.3.c
    text: |-
      de natuurlijke of rechtspersoon ten name van wie de toelating is opgenomen in het register, bedoeld in
      [artikel 42, tweede lid][ref1], de jaarlijkse vergoeding bedoeld in [artikel 10, eerste lid, onderdeel e][ref2],
      niet voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel10
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0021670
        artikel: '10'
        hoofdstuk: '2'
  - number: '68.4'
    text: |-
      Het college wijzigt een toelating ambtshalve of op aanvraag indien naar het oordeel van het college blijkt dat op
      grond van nieuwe wetenschappelijke en technische kennis de wijze van gebruik en de gebruikte hoeveelheden kunnen
      worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel68
  - number: '68.5'
    text: |-
      Bij wijziging of intrekking van een toelating bepaalt het college of, in hoeverre, en voor welke termijn het is
      toegestaan een niet meer voor bepaalde toepassingen te gebruiken of niet meer toegelaten biocide in afwijking van
      [artikel 20][ref1] op de markt te brengen, in voorraad te houden, voorhanden te hebben of te gebruiken.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel20
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '20'
        hoofdstuk: '3'
  - number: '68.6'
    text: |-
      Vrijstellingen kunnen ambtshalve of op aanvraag worden gewijzigd en ingetrokken. Het eerste tot en met vierde lid
      zijn van overeenkomstige toepassing op vrijstellingen.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel68
  - number: '68.7'
    text: |-
      Onverminderd het zesde lid besluit het college bij wijziging of intrekking van vrijstellingen als bedoeld in
      [artikel 64, eerste lid][ref1], overeenkomstig het [vierde lid van dat artikel][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel64
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '64'
        hoofdstuk: '5'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0021670
        artikel: '64'
        hoofdstuk: '5'
        paragraaf: '6'
  - number: '68.8'
    text: |-
      Onverminderd het eerste tot en met zevende lid worden toelatingen of vrijstellingen voor biociden gewijzigd of
      ingetrokken indien voor de in de betrokken biocide opgenomen werkzame stof een communautaire maatregel is genomen
      om te voldoen aan de bij die communautaire maatregel bepaalde voorwaarden en termijnen.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel68
  - number: '69.1'
    text: |-
      Een besluit omtrent toelating, of vrijstelling van een biocide, een kaderformulering, dan wel verlenging, wijziging
      of intrekking daarvan alsmede een tijdelijke beperking of verbod tot het op de markt brengen of gebruik van een
      biocide worden in de Staatscourant bekendgemaakt en medegedeeld aan de aanvrager.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel69
  - number: '69.2'
    text: |-
      Het college registreert besluiten als bedoeld in het eerste lid in het register, bedoeld in
      [artikel 42, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel42
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '6'
  - number: '69.3'
    text: |-
      De door het college via een elektronische weg openbaar gemaakte informatie inzake de registratie van besluiten
      geeft een weerlegbaar vermoeden van de inhoud van de geregistreerde besluiten.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel69
  - number: '70.1'
    text: |-
      Het college of Onze Minister besluit in afwijking van de [Wet openbaarheid van bestuur][ref1] en in
      afwijking van de [artikelen 3:7, tweede lid][ref2], [3:11, tweede lid][ref3], [7:4, zevende lid][ref4],
      [7:18, zevende lid][ref5], en [8:29, tweede lid, van de Algemene wet bestuursrecht][ref6] over de openbaarmaking
      van bij het college onderscheidenlijk Onze Minister aanwezige gegevens inzake toelating van biociden op grond van
      het bij of krachtens deze wet bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0005252
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '70.2'
    text: |-
      Een aanvrager van een toelating kan het college gemotiveerd meedelen welke commercieel gevoelige informatie waarvan
      bekendmaking hem op industrieel of commercieel gebied zou kunnen schaden, voor iedereen behalve het college en
      de Commissie van de Europese Gemeenschappen vertrouwelijk blijft. Het college behandelt voornoemde commercieel
      gevoelige informatie vertrouwelijk als het college de motivering aanvaardt.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel70
  - number: '70.3'
    text: |-
      Het college neemt de nodige stappen om de vertrouwelijkheid van de volledige samenstelling van productformules te
      garanderen, indien de aanvrager dit wenst.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel70
  - number: '70.4'
    text: Het college behandelt informatie, die door andere lidstaten als vertrouwelijk is gekwalificeerd, vertrouwelijk.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel70
  - number: '70.5'
    text: 'De volgende informatie wordt in geen geval als vertrouwelijk beschouwd:'
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel70
  - number: 70.5.a
    text: de naam en het adres van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel70
  - number: 70.5.b
    text: de naam en het adres van de fabrikant van de biocide;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel70
  - number: 70.5.c
    text: de naam en het adres van de fabrikant van de werkzame stof;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel70
  - number: 70.5.d
    text: de naam en het gehalte van de werkzame stof en de naam van de biocide;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel70
  - number: 70.5.e
    text: |-
      de namen van andere stoffen die uit hoofde van [titel 9.2 van de Wet milieubeheer][ref1] als gevaarlijk worden
      beschouwd en een rol spelen bij de indeling van het product;


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 70.5.f
    text: de fysische en chemische eigenschappen van de werkzame stof en de biocide;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel70
  - number: 70.5.g
    text: de wijzen waarop de biocide onschadelijk kan worden gemaakt;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel70
  - number: 70.5.h
    text: |-
      een beknopt overzicht van de resultaten van de krachtens [artikel 49][ref1] vereiste proeven die ertoe strekken
      de werkzaamheid en de effecten van de stof of het product op mens, dier en milieu en, indien van toepassing, de
      resistentiebevorderende werking ervan vast te stellen;


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel49
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '49'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 70.5.i
    text: |-
      de aanbevolen methoden en voorzorgsmaatregelen om de gevaren bij hantering, opslag, vervoer, gebruik, alsmede bij
      brand of andere mogelijke ongelukken te beperken;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel70
  - number: 70.5.j
    text: veiligheidsinformatiebladen;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel70
  - number: 70.5.k
    text: de analysemethoden die bij de beoordeling zijn toegepast;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel70
  - number: 70.5.l
    text: de methoden voor het verwijderen van het product en de verpakking daarvan;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel70
  - number: 70.5.m
    text: de te volgen procedures en de te nemen maatregelen bij morsen of lekken;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel70
  - number: 70.5.n
    text: de te verlenen eerste hulp en medisch advies bij persoonlijke ongevallen.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel70
  - number: '70.6'
    text: |-
      Indien de aanvrager, de fabrikant of de importeur van de biocide of van de werkzame stof op een later tijdstip
      informatie vrijgeeft die voordien vertrouwelijk was, wordt het college daarvan op de hoogte gebracht.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel70
  - number: '70.7'
    text: |-
      Onze Minister kan voor de uitvoering van communautaire maatregelen nadere regels stellen over de openbaarmaking
      van informatie.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel70
  - number: '71.1'
    text: |-
      Het is verboden zonder geldig bewijs van vakbekwaamheid een gewasbeschermingsmiddel of biocide op de markt te
      brengen.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel71
  - number: '71.2'
    text: 'Het eerste lid is niet van toepassing bij:'
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel71
  - number: 71.2.a
    text: |-
      het op de markt brengen van een middel dat door het college bij de toelating als geschikt voor niet-professioneel
      gebruik is aangemerkt of
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel71
  - number: 71.2.b
    text: |-
      een producent van een middel die het middel levert aan een leverancier die over een geldig bewijs van
      vakbekwaamheid beschikt.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel71
  - number: '71.3'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over onder meer:'
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel71
  - number: 71.3.a
    text: de instanties die een bewijs van vakbekwaamheid kunnen verstrekken;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel71
  - number: 71.3.b
    text: de wijze waarop een bewijs van vakbekwaamheid kan worden verkregen;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel71
  - number: 71.3.c
    text: de eisen die voor een bewijs van vakbekwaamheid gelden;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel71
  - number: 71.3.d
    text: de geldigheidsduur, de verlenging en de voorwaarden tot verlenging van een bewijs van vakbekwaamheid;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel71
  - number: 71.3.e
    text: |-
      het tijdelijk of permanent intrekken van een bewijs van vakbekwaamheid, bedoeld in [artikel 85][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel85
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '85'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 71.3.f
    text: de aanwijzing van het voor het intrekken van een bewijs van vakbekwaamheid bevoegde bestuursorgaan;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel71
  - number: 71.3.g
    text: de wijze waarop wederom een bewijs van vakbekwaamheid verkregen kan worden;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel71
  - number: 71.3.h
    text: de vergoeding van kosten gemaakt voor het verstrekken van een bewijs van vakbekwaamheid; en
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel71
  - number: 71.3.i
    text: de categorieën van handelingen waarvoor geen bewijs van vakbekwaamheid vereist is.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel71
  - number: '72.1'
    text: Het is verboden een niet toegelaten gewasbeschermingsmiddel of biocide aan te bevelen of aan te prijzen.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel72
  - number: '72.2'
    text: |-
      Het is verboden gebruik van gewasbeschermingsmiddelen of biociden aan te bevelen of aan te prijzen in strijd met
      voorschriften gegeven bij een besluit tot toelating of vrijstelling van een middel of een verlenging, wijziging of
      intrekking daarvan, dan wel een besluit tot een tijdelijk verbod op of een beperking van het op de markt brengen of
      gebruiken van een middel.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel72
  - number: '72.3'
    text: Het is verboden misleidende informatie te geven over de gevaren van een middel voor mens, dier, plant of milieu.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel72
  - number: '72.4'
    text: 'Als misleidende informatie als bedoeld in het derde lid worden in ieder geval beschouwd de vermeldingen:'
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel72
  - number: 72.4.a
    text: middel met een gering risico,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel72
  - number: 72.4.b
    text: niet-vergiftig,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel72
  - number: 72.4.c
    text: ongevaarlijk.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel72
  - number: '72.5'
    text: |-
      Een aanprijzing of aanbeveling van een biocide bevat de zin: «Gebruik biociden veilig. Lees vóór gebruik eerst het
      etiket en de productinformatie». De term «biociden» kan door de adverteerder worden vervangen door een nauwkeuriger
      aanduiding van de productsoort. Voor gewasbeschermingsmiddelen is dit lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel72
  - number: '73.1'
    text: |-
      De leverancier is verplicht zich er bij het op de markt brengen van gewasbeschermingsmiddelen of biociden van
      te vergewissen dat de gebruiker over een geldig bewijs van vakbekwaamheid beschikt en zich bij aflevering te
      vergewissen van de identiteit van de gebruiker of diens vertegenwoordiger die het middel ontvangt.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel73
  - number: '73.2'
    text: |-
      Het eerste lid geldt niet voor de distributie of aflevering van een middel dat door het college als geschikt voor
      niet-professioneel gebruik is aangemerkt.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel73
  - number: '74.1'
    text: |-
      Het binnen Nederland brengen van een niet toegelaten gewasbeschermingsmiddel of biocide is in afwijking van de
      [artikelen 19][ref1] en [20][ref2] toegestaan wanneer het middel gezien het bijgeleverde etiket of gezien de
      samenstelling van de werkzame stof of preparaat bestemd is voor:


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel20
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '19'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0021670
        artikel: '20'
        hoofdstuk: '3'
  - number: 74.1.a
    text: |-
      een lidstaat van de Europese Unie en voldoet aan de voorschriften inzake controle die in die lidstaat zijn
      vastgesteld ter implementatie van artikel 3, eerste lid, van [richtlijn 91/414/EEG](31991L0414) onderscheidenlijk
      artikel 3, eerste lid, van [richtlijn 98/8/EG](31998L0008) of
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel74
  - number: 74.1.b
    text: een land buiten de Europese Unie en aldaar niet verboden is.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel74
  - number: '74.2'
    text: |-
      De importeur van een middel als bedoeld in het eerste lid en de opvolgende eigenaar of houder van het middel dragen
      zorg voor de aanwezigheid op het bedrijf van een administratie, die voldoet aan bij of krachtens algemene maatregel
      van bestuur te stellen eisen. Daarbij kunnen regels worden gesteld inzake leveringen voor opslag en daarop volgende
      verzending vanaf het grondgebied van Nederland naar het buitenland.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel74
  - number: '74.3'
    text: |-
      Een importeur kan een middel als bedoeld in het eerste lid binnen Nederland leveren voor opslag mits daarop door de
      importeur en opvolgende eigenaar of houder van het middel vervoer tot buiten het Nederlands grondgebied plaatsvindt
      en de importeur, opvolgend eigenaar of houder de opslag overeenkomstig het tweede lid administreert.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel74
  - number: '74.4'
    text: |-
      Het tweede en derde lid zijn van overeenkomstige toepassing op een in Nederland gevestigde producent die een
      middel produceert dat gezien het bijgeleverde etiket of gezien de samenstelling van werkzame stof of preparaat
      niet bestemd is voor de Nederlandse markt voor zover de producent het middel op een met een importeur vergelijkbare
      wijze binnen het Nederlands grondgebied levert voor opslag als bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel74
  - number: '75'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor het op de markt brengen van gewasbeschermingsmiddelen
      of biociden nadere regels worden gesteld over onder meer:
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel75
  - number: 75.a
    text: het aanbevelen of aanprijzen van middelen,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel75
  - number: 75.b
    text: de administratie van middelen,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel75
  - number: 75.c
    text: het vervoer en de opslag van middelen niet bestemd voor de handel, of
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel75
  - number: 75.d
    text: de wijze van afleveren van middelen.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel75
  - number: '76.1'
    text: |-
      Het is verboden zonder geldig bewijs van vakbekwaamheid een gewasbeschermingsmiddel of biocide te ontvangen, te
      gebruiken of voorhanden te hebben.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel76
  - number: '76.2'
    text: |-
      Het eerste lid is niet van toepassing, wanneer het middel door het college bij de toelating als geschikt voor niet-
      professioneel gebruik is aangemerkt.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel76
  - number: '76.3'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over onder meer:'
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel76
  - number: 76.3.a
    text: de instanties die een bewijs van vakbekwaamheid kunnen verstrekken;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel76
  - number: 76.3.b
    text: de wijze waarop een bewijs van vakbekwaamheid kan worden verkregen;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel76
  - number: 76.3.c
    text: de eisen die voor een bewijs van vakbekwaamheid gelden;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel76
  - number: 76.3.d
    text: de geldigheidsduur, de verlenging en de voorwaarden tot verlenging van een bewijs van vakbekwaamheid;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel76
  - number: 76.3.e
    text: |-
      het tijdelijk of permanent intrekken van een bewijs van vakbekwaamheid, bedoeld in [artikel 85][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel85
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '85'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 76.3.f
    text: de aanwijzing van het voor het intrekken van een bewijs van vakbekwaamheid bevoegde bestuursorgaan;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel76
  - number: 76.3.g
    text: de wijze waarop wederom een bewijs van vakbekwaamheid verkregen kan worden;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel76
  - number: 76.3.h
    text: de vergoeding van kosten gemaakt voor het verstrekken van een bewijs van vakbekwaamheid; en
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel76
  - number: 76.3.i
    text: de categorieën van handelingen waarvoor geen bewijs van vakbekwaamheid vereist is.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel76
  - number: '77'
    text: |-
      De gebruiker of degene die een gewasbeschermingsmiddel of biocide namens de gebruiker ontvangt, legitimeert
      zich, op verzoek van de leverancier, bedoeld in [artikel 73][ref1], of zijn vertegenwoordiger, met een
      document als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref2], onverminderd het bepaalde in
      [artikel 2 van de Wet op de identificatieplicht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0006297#Artikel2
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '73'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006297
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0006297
        artikel: '2'
  - number: '78.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over juist gebruik van biociden of het
      toepassen van beginselen van geïntegreerde bestrijding.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel78
  - number: '78.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de wijze waarop het gebruik van
      gewasbeschermingsmiddelen of biociden wordt geadministreerd.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel78
  - number: '79'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de uitvoering van goede
      praktijken bij het toepassen van gewasbeschermingsmiddelen of biociden.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel79
  - number: '80.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over het gebruik van voertuigen,
      werktuigen, methoden, technieken en materialen bij de toepassing van gewasbeschermingsmiddelen of biociden
      waaronder bepalingen inzake het gebruik van gewasbeschermingsmiddelen of biociden vanuit vliegtuigen of in besloten
      ruimten.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel80
  - number: '80.2'
    text: Bij algemene maatregel van bestuur als bedoeld in het eerste lid kan een verbod worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel80
  - number: '81.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat de toepassing van een
      gewasbeschermingsmiddel of biocide of een gebruik als bedoeld in [artikel 80, eerste lid][ref1], alleen is
      toegestaan na ontheffing, vergunning of vrijstelling door Onze Minister of nadat van vorenbedoelde toepassing of
      gebruik melding is gedaan aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel80
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '80'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '81.2'
    text: Aan vergunningen kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel81
  - number: '81.3'
    text: Vergunningen kunnen onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel81
  - number: '81.4'
    text: |-
      Het bepaalde in het tweede en derde lid is van overeenkomstige toepassing op ontheffingen, vrijstellingen of
      meldingen als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel81
  - number: '82.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet of onderdelen daarvan zijn belast de bij
      besluit van Onze Ministers aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel82
  - number: '82.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel82
  - number: '82.3'
    text: Onze Minister regelt de taakverdeling tussen de krachtens het eerste lid aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel82
  - number: '83'
    text: |-
      Bij regeling van Onze Ministers kunnen regels worden gesteld over de wijze van monsterneming, het verpakken en het
      verzegelen van monsters.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel83
  - number: '84'
    text: |-
      Een toezichthouder is bevoegd met medeneming van de benodigde apparatuur een woning binnen te treden zonder
      toestemming van de bewoner.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel84
  - number: '85.1'
    text: |-
      Een bewijs van vakbekwaamheid ten behoeve van het verrichten van handelingen ten aanzien van
      gewasbeschermingsmiddelen of biociden, wordt ingetrokken indien niet langer wordt voldaan aan de eisen die ter zake
      van het verkrijgen of behouden van een zodanig bewijs van vakbekwaamheid bij of krachtens deze wet is gesteld.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel85
  - number: '85.2'
    text: |-
      Een bewijs van vakbekwaamheid wordt niet eerder ingetrokken dan nadat gedurende een redelijke termijn gelegenheid
      is gegeven alsnog aan de in het eerste lid bedoelde eisen te voldoen.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel85
  - number: '85.3'
    text: |-
      Een bewijs van vakbekwaamheid kan tevens worden ingetrokken indien degene aan wie een bewijs van vakbekwaamheid is
      verleend, dan wel een persoon voor wie diegene verantwoordelijk is of geacht wordt verantwoordelijk te zijn, heeft
      gehandeld in strijd met bij of krachtens deze wet gestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel85
  - number: '85.4'
    text: |-
      Bij een intrekking als bedoeld in het derde lid kan het bestuursorgaan bepalen dat degene tot wie het bewijs van
      vakbekwaamheid was gericht gedurende een door dat bestuursorgaan te bepalen termijn niet in aanmerking komt voor
      een zelfde bewijs van vakbekwaamheid.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel85
  - number: '85.5'
    text: |-
      Het eerste tot en met het vierde lid zijn van overeenkomstige toepassing met betrekking tot een vergunning die
      ingevolge deze wet wordt verleend.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel85
  - number: '86'
    text: |-
      Onze Minister is, mede namens Onze Minister van Sociale Zaken en Werkgelegenheid, Onze Minister van
      Volksgezondheid, Welzijn en Sport en Onze Minister van Verkeer en Waterstaat, bevoegd tot oplegging
      van een last onder bestuursdwang ter handhaving van de bij of krachtens deze wet gestelde regels en
      [artikel 5:20 van de Algemene wet bestuursrecht][ref1], voor zover het de verplichting betreft tot het verlenen van
      medewerking aan de ingevolge [artikel 82][ref2] aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel82
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0021670
        artikel: '82'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: '87.1'
    text: |-
      De ingevolge [artikel 82][ref1] aangewezen ambtenaren zijn, indien naar hun redelijk oordeel ernstig gevaar voor
      personen, planten, dieren of het milieu bestaat, bevoegd mondeling of bij gedagtekend schrijven te bevelen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel82
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '82'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 87.1.a
    text: |-
      door hen aan te wijzen werkzaamheden met betrekking tot gewasbeschermingsmiddelen of biociden of met betrekking tot
      met die middelen behandelde gebouwen, plaatsen of voorwerpen worden gestaakt dan wel niet worden aangevangen en
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel87
  - number: 87.1.b
    text: in of op door hen aan te wijzen plaatsen geen personen mogen verblijven.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel87
  - number: '87.2'
    text: |-
      Een mondeling bevel wordt zo snel mogelijk schriftelijk bevestigd aan degene die verantwoordelijk is voor de
      aangewezen werkzaamheden of voor de gang van zaken in of op de aangewezen plaats.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel87
  - number: '87.3'
    text: |-
      Degene tot wie een bevel als bedoeld in het eerste lid is gericht, is verplicht de inhoud van dat bevel ter kennis
      te brengen van een ieder wie het bevel aangaat.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel87
  - number: '87.4'
    text: |-
      Zodra naar het oordeel van de ambtenaar die een bevel als bedoeld in het eerste lid heeft gegeven, geen ernstig
      gevaar meer aanwezig is, trekt deze het bevel in.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel87
  - number: '87.5'
    text: |-
      Degene die een bevel als bedoeld in het eerste lid heeft gegeven, is bevoegd met betrekking tot dat bevel de nodige
      maatregelen te treffen, met inbegrip van oplegging van een last onder bestuursdwang, de nodige aanwijzingen te
      geven en zo nodig de hulp van de sterke arm in te roepen.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel87
  - number: '87.6'
    text: |-
      Ieder wie het aangaat is verplicht zich te gedragen overeenkomstig een krachtens dit artikel gegeven bevel of
      aanwijzing.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel87
  - number: '88.1'
    text: |-
      Een overheidslichaam kan – behoudens matiging door de rechter – de te zijnen laste komende kosten van beheer,
      verwijdering, of vernietiging van gewasbeschermingsmiddelen of biociden, ten aanzien waarvan in strijd is gehandeld
      met het bij of krachtens deze wet bepaalde, verhalen op degene door wiens onrechtmatige daad die kosten zijn
      veroorzaakt, of op degene die anderszins krachtens burgerlijk recht buiten overeenkomst aansprakelijk is voor de
      gevolgen daarvan.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel88
  - number: '88.2'
    text: |-
      Een overheidslichaam kan in een geval als bedoeld in het eerste lid, overeenkomstig de regels betreffende
      ongerechtvaardigde verrijking, de daar bedoelde kosten verhalen op degene die door het beheer van de betrokken
      gewasbeschermingsmiddelen of biociden ongerechtvaardigd wordt verrijkt.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel88
  - number: '88.3'
    text: |-
      Voor de toepassing van dit artikel is niet vereist dat op het tijdstip waarop de in het eerste lid bedoelde
      handeling met de in dat lid bedoelde gewasbeschermingsmiddelen en biociden zich heeft voorgedaan, reeds jegens de
      overheid onrechtmatig werd gehandeld.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel88
  - number: '90.1'
    text: |-
      Onze Minister kan, mede namens Onze Minister van Sociale Zaken en Werkgelegenheid, Onze Minister van
      Volksgezondheid, Welzijn en Sport en Onze Minister van Verkeer en Waterstaat, een bestuurlijke boete opleggen
      ter zake van een overtreding van het bepaalde bij of krachtens [artikel 18][ref1], [19][ref2], [20][ref3],
      [22, eerste, tweede of vierde lid][ref4], [40, derde lid][ref5], [64, achtste lid][ref6], [67, tweede lid][ref7],
      [71, eerste lid][ref8], [72, eerste, tweede of derde lid][ref9], [73, eerste lid][ref10], [74, tweede lid][ref11],
      [75][ref12], [76, eerste lid][ref13], [77 tot en met 81][ref14], [115][ref15] of [118][ref16].


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0021670#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0021670#Artikel22
