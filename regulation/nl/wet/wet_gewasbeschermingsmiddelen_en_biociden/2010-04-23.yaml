  - number: '129.4'
    text: |-
      Gewasbeschermingsmiddelen of biociden, die op of na 3 mei 2007 zijn vrijgesteld van toelating of waarvoor een
      ontheffing is verstrekt op grond van [artikel 16aa van de Bestrijdingsmiddelenwet 1962][ref1], worden vanaf die
      datum geacht te zijn toegelaten op grond van [artikel 123, eerste lid][ref2], van deze wet, onder de voorschriften
      die bij de vrijstelling of ontheffing zijn gegeven.


