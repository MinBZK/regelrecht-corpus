    text: |-
      De op het tijdstip van inwerkingtreding van deze wet bij het College voor de toelating van bestrijdingsmiddelen
      aanhangige aanvragen, verzoeken en bezwaarschriften zijn met ingang van dat tijdstip van rechtswege aanhangig bij
      het college in de staat, waarin zij zich op dat moment bevinden.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel130
  - number: '130.3'
    text: |-
      De op het tijdstip van inwerkingtreding van deze wet aanhangige aanvragen tot toelating of registratie
      ingevolge [artikel 4 van de Bestrijdingsmiddelenwet 1962][ref1] worden met ingang van dat tijdstip
      overeenkomstig de [hoofdstukken 4][ref2] en [9][ref3] dan wel, ingeval het biociden betreft, overeenkomstig de
      [hoofdstukken 5][ref4] en [9][ref5] van deze wet behandeld.


