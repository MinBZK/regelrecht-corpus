$id: wet_gewasbeschermingsmiddelen_en_biociden
regulatory_layer: WET
publication_date: '2013-11-20'
valid_from: '2010-04-23'
bwb_id: BWBR0021670
url: https://wetten.overheid.nl/BWBR0021670/2010-04-23
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe regels te stellen voor de toelating, het op
    de markt brengen en het gebruik van gewasbeschermingsmiddelen alsmede voor de toelating en registratie, het op
    de markt brengen en het gebruik van biociden, mede gelet op richtlijn nr. 91/414/EEG van de Raad van de Europese
    Gemeenschappen van 15 juli 1991 betreffende het op de markt brengen van gewasbeschermingsmiddelen (PbEG L 230) en
    richtlijn nr. 98/8/EG van het Europees Parlement en de Raad van de Europese Unie van 16 februari 1998 betreffende
    het op de markt brengen van biociden (PbEG L 123);

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: basisstof: in bijlage 1B bij [richtlijn
      98/8/EG](31998L0008) opgenomen stof die hoofdzakelijk voor andere dan bestrijdingsdoeleinden wordt gebruikt,
      maar in ondergeschikte mate als biocide wordt toegepast, hetzij rechtstreeks, hetzij in een product dat bestaat
      uit die stof en een eenvoudig oplosmiddel, dat zelf geen tot bezorgdheid aanleiding gevende stof is, en die niet
      rechtsreeks voor gebruik als biocide op de markt wordt gebracht; biocide: werkzame stof of preparaat dat één of
      meer werkzame stoffen bevat, bestemd of aangewend om een schadelijk organisme te vernietigen, af te schrikken,
      onschadelijk te maken, de effecten daarvan te voorkomen of het op andere wijze langs chemische of biologische
      weg te bestrijden, niet zijnde een gewasbeschermingsmiddel en opgenomen in bijlage V bij [richtlijn 98/8/EG]
      (31998L0008); biocide met een gering risico: biocide die als werkzame stof uitsluitend een of meer in bijlage 1A
      bij [richtlijn 98/8/EG](31998L0008) aangewezen, geen tot bezorgdheid aanleiding gevende stoffen bevat; college:
      College voor de toelating van gewasbeschermingsmiddelen en biociden, genoemd in [artikel 3][ref1]; communautaire
      maatregel: verordening, richtlijn of beschikking als bedoeld in artikel 249 van het Verdrag tot oprichting
      van de Europese Economische Gemeenschap (Trb. 1957, 91) betrekking hebbende op gewasbeschermingsmiddelen of
      biociden; gebruiker: iedere natuurlijke persoon of rechtspersoon die een gewasbeschermingsmiddel of biocide
      toepast, toedient, doet toepassen, of doet toedienen; geïntegreerde bestrijding: de rationele toepassing van
      een combinatie van biologische, biotechnologische, chemische, mechanische en fysische bestrijding, teelt- of
      gewasveredelingsmaatregelen, waarbij het gebruik van chemische gewasbeschermingsmiddelen wordt beperkt tot het
      strikte minimum dat noodzakelijk is om populaties van schadelijke organismen onder de niveaus te houden waarbij in
      economisch opzicht onaanvaardbare schade of verliezen optreden; gewasbeschermingsmiddel: werkzame stof of preparaat
      dat één of meer werkzame stoffen bevat, bestemd of aangewend om:


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel3
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '3'
        hoofdstuk: '2'
  - number: 1.1.1°
    text: |-
      planten of plantaardige producten te beschermen tegen alle schadelijke organismen of de werking daarvan te
      voorkomen;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel1
  - number: 1.1.2°
    text: levensprocessen van planten te beïnvloeden, voor zover het niet gaat om nutritieve stoffen;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel1
  - number: 1.1.3°
    text: plantaardige producten te bewaren;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel1
  - number: 1.1.4°
    text: ongewenste planten te doden; of
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel1
  - number: 1.1.5°
    text: delen van planten te vernietigen of een ongewenste groei van planten af te remmen of te voorkomen;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel1
  - number: '1.2'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt onder «gebruiken» mede verstaan de aanwezigheid van een
      werkzame stof, al dan niet in een gewasbeschermingsmiddel of biocide, op of in gebouwen, plaatsen, voorwerpen,
      de grond dan wel op of in planten of plantaardige producten, met uitzondering van binnen Nederland gebracht
      uitgangsmateriaal waaronder stekken en zaaizaad, voor zover de werkzame stof in het land van herkomst op het
      uitgangsmateriaal is toegepast in overeenstemming met de wetgeving van dat land.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel1
  - number: '1.3'
    text: |-
      Onder een biocide wordt mede verstaan een werkzame stof die door de gebruiker op de plaats van toepassing is
      gegenereerd door middel van apparatuur die niet bij ministeriële regeling is uitgezonderd van de werking van deze
      wet.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel1
  - number: '2.1'
    text: |-
      Onze Minister doet mededeling in de Staatscourant van de vaststelling of wijziging van een communautaire maatregel
      voor zover daaraan uitvoering moet worden gegeven, onder vermelding van de artikelen van deze wet waarop de
      desbetreffende communautaire maatregel betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel2
  - number: '2.2'
    text: |-
      In afwijking van het eerste lid wordt een communautaire maatregel die slechts bepalingen inzake de opneming of
      niet-opneming van een werkzame stof in bijlage I bij [richtlijn 91/414/EEG](31991L0414) alsmede bijlage I, IA of IB
      bij [richtlijn 98/8/EG](31998L0008), bevat door het college in de Staatscourant gepubliceerd.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel2
  - number: '2.3'
    text: |-
      Een communautaire maatregel of wijziging daarvan gaat voor de toepassing van deze wet gelden met ingang van de dag
      waarop daaraan uiterlijk uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de Staatscourant
      wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel2
  - number: '3'
    text: |-
      Er is een College voor de toelating van gewasbeschermingsmiddelen en biociden. Het college bezit
      rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel3
  - number: '4'
    text: 'Het college is belast met:'
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel4
  - number: 4.a
    text: het toelaten van gewasbeschermingsmiddelen overeenkomstig hoofdstuk 4 dan wel hoofdstuk 9 van de wet;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel4
  - number: 4.b
    text: het toelaten of registreren van biociden overeenkomstig hoofdstuk 5 dan wel hoofdstuk 9 van de wet;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel4
  - number: 4.c
    text: |-
      het bijhouden van het in [artikel 42][ref1] bedoelde register;


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel42
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '6'
  - number: 4.d
    text: |-
      het verlenen van de in de [artikelen 37][ref1] en [64][ref2] bedoelde vrijstellingen voor proefdoeleinden; en


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel64
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel4
    references:
