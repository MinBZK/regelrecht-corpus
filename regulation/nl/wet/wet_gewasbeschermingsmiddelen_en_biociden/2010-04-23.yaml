  - number: '108'
    text: |-
      Bij gebreke van volledige betaling binnen de in [artikel 4:87 van de Algemene wet bestuursrecht][ref1] bedoelde
      termijn kan Onze Minister de verschuldigde bestuurlijke boete invorderen bij dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '111.1'
    text: |-
      Onze Minister kan op een met redenen omkleed verzoek bepalingen van een schriftelijke overeenkomst tussen degenen
      die in de uitoefening van beroep of bedrijf handelingen verrichten met gewasbeschermingsmiddelen of biociden,
      algemeen verbindend verklaren voor zover deze bepalingen betrekking hebben op onderwerpen als bedoeld in
      [hoofdstuk 6, paragraaf 1][ref1], van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0021670
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '111.2'
    text: |-
      Een verzoek tot algemeenverbindendverklaring kan slechts worden ingediend door degenen die, dan wel organisaties
      van degenen die, wat betreft hun deelnemersaantal en hun gezamenlijke omzet, een naar het oordeel van Onze Minister
      belangrijke meerderheid vormen van degenen die de betrokken handelingen met gewasbeschermingsmiddelen of biociden
      verrichten.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel111
  - number: '111.3'
    text: |-
      Onze Minister kan regels stellen met betrekking tot de onderwerpen die in ieder geval in een overeenkomst waarvoor
      algemeenverbindendverklaring wordt verzocht, aan de orde dienen te komen, alsmede met betrekking tot de bij een
      verzoek als bedoeld in het eerste lid over te leggen gegevens.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel111
  - number: '112.1'
    text: |-
      [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1] is van toepassing op de voorbereiding
      van het besluit tot algemeenverbindendverklaring, met dien verstande dat de termijn van
      [artikel 3:18, eerste lid, van de Algemene wet bestuursrecht][ref2] kan worden opgeschort voor zolang nodig ter
      voldoening aan internationaalrechtelijke verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '112.2'
    text: |-
      Onze Minister kan aan het besluit tot algemeenverbindendverklaring voorschriften verbinden ten aanzien van aan hem
      over te leggen rapportages over de uitvoering en handhaving van de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel112
  - number: '112.3'
    text: |-
      Een besluit tot algemeenverbindendverklaring geldt voor een in het besluit aangegeven termijn van ten hoogste vijf
      jaar.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel112
  - number: '113.1'
    text: |-
      Onze Minister kan op een daartoe strekkend verzoek van een besluit tot algemeenverbindendverklaring ontheffing
      verlenen, indien de verzoeker zorg draagt voor het op een zodanige wijze verrichten van de betrokken handelingen
      dat deze wijze naar het oordeel van Onze Minister ten minste gelijkwaardig is aan de wijze waarop die handelingen
      overeenkomstig de betrokken algemeenverbindendverklaring worden verricht.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel113
  - number: '113.2'
    text: |-
      Een ontheffing van een algemeen verbindend verklaarde overeenkomst kan onder beperkingen worden verleend. Aan de
      ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel113
  - number: '113.3'
    text: |-
      Een krachtens het eerste lid verleende ontheffing kan ambtshalve of op een daartoe strekkend verzoek worden
      gewijzigd of worden ingetrokken. [Artikel 114, eerste lid][ref1], is van overeenkomstige toepassing, met dien
      verstande dat voor het in onderdeel b van dat lid genoemde belang in de plaats treedt: het niet langer voldoen aan
      het in het eerste lid van dit artikel genoemde vereiste.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel114
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '114'
        hoofdstuk: '8'
        paragraaf: '1'
  - number: '113.4'
    text: |-
      [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1] is van toepassing op de voorbereiding van het besluit tot
      ontheffing als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '114.1'
    text: 'Onze Minister kan een besluit tot algemeenverbindendverklaring intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel114
  - number: 114.1.a
    text: de ter zake verstrekte gegevens onjuist zijn of onvolledig zijn;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel114
  - number: 114.1.b
    text: |-
      op grond van een verandering van de omstandigheden of inzichten opgetreden na het nemen van het besluit, moet
      worden aangenomen dat het van kracht blijven van de overeenkomst niet meer gerechtvaardigd is;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel114
  - number: 114.1.c
    text: |-
      een voor Nederland verbindend verdrag of een voor Nederland verbindend besluit van een volkenrechtelijke
      organisatie, dan wel regels ter uitvoering daarvan, hiertoe verplichten, of
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel114
  - number: 114.1.d
    text: degenen die het verzoek hebben ingediend, daartoe verzoeken.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel114
  - number: '114.2'
    text: |-
      [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1] is van toepassing op de voorbereiding van een besluit als
      bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '115'
    text: |-
      Een ieder is tot naleving van een voor hem geldende algemeen verbindend verklaarde overeenkomst gehouden tegenover
      ieder ander, die bij de naleving een redelijk belang heeft.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel115
  - number: '116.1'
    text: |-
      Indien een of meer van degenen voor wie een overeenkomst algemeen verbindend is verklaard, het vermoeden gegrond
      achten dat een of meer van de algemeen verbindend verklaarde bepalingen uit de overeenkomst niet worden nageleefd,
      kunnen zij met het oog op het instellen van een rechtsvordering Onze Minister verzoeken een onderzoek daarnaar te
      doen instellen.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel116
  - number: '116.2'
    text: |-
      Indien een verzoek als bedoeld in het eerste lid is ingediend, kan Onze Minister een onderzoek instellen. Nadat
      het onderzoek is afgerond licht Onze Minister degene of degenen, die om het onderzoek hebben verzocht, in over de
      uitkomsten van het onderzoek.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel116
  - number: '117.1'
    text: 'In deze afdeling en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel117
  - number: 117.1.a
    text: |-
      EG-verordening: verordening van de Raad van de Europese Unie of van het Europees Parlement en de Raad van de
      Europese Unie gezamenlijk, die geheel of gedeeltelijk berust op de artikelen 37, 95, 152, 153, of 175 van het
      Verdrag tot oprichting van de Europese Gemeenschap en waarin voorschriften zijn neergelegd betreffende het op
      de markt brengen van gewasbeschermingsmiddelen of biociden of het op de markt brengen van producten die met
      gewasbeschermingsmiddelen of biociden behandeld zijn alsmede daarmee samenhangende activiteiten;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel117
  - number: 117.1.b
    text: |-
      EG-richtlijn: richtlijn van de Raad van de Europese Unie of het Europees Parlement en de Raad van de Europese
      Unie gezamenlijk, die geheel of gedeeltelijk berust op de artikelen 37, 95, 152, 153, of 175 van het Verdrag
      tot oprichting van de Europese Gemeenschap en waarin voorschriften zijn neergelegd betreffende het op de
      markt brengen van gewasbeschermingsmiddelen of biociden of het op de markt brengen van producten die met
      gewasbeschermingsmiddelen of biociden behandeld zijn alsmede daarmee samenhangende activiteiten.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel117
  - number: '117.2'
    text: |-
      Voor de toepassing van deze paragraaf en de daarop berustende bepalingen gelden de begripsomschrijvingen zoals die
      zijn neergelegd in EG-verordeningen. Daar waar deze begripsbepalingen afwijken van de in [artikel 1][ref1] van deze
      wet opgenomen begripsbepalingen, gelden de begripsbepalingen zoals die zijn neergelegd in de EG-verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel1
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '1'
        hoofdstuk: '1'
  - number: '118.1'
    text: Bij ministeriële regeling kunnen regels worden gesteld voor een goede uitvoering van EG-verordeningen.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel118
  - number: '118.2'
    text: Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ter implementatie van EG-richtlijnen.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel118
  - number: '118.3'
    text: Bij ministeriële regeling kunnen regels worden gesteld ter implementatie van EG-beschikkingen.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel118
  - number: '118.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ter implementatie van een overeenkomst
      betreffende het op de markt brengen van gewasbeschermingsmiddelen of biociden of het op de markt brengen van
      producten die met gewasbeschermingsmiddelen of biociden behandeld zijn alsmede daarmee samenhangende activiteiten
      tussen de Europese Gemeenschap en een derde land of een internationale organisatie.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel118
  - number: '118.5'
    text: 'De regels bedoeld in het eerste tot en met vierde lid kunnen betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel118
  - number: 118.5.a
    text: de procedures en termijnen voor het op de markt brengen van gewasbeschermingsmiddelen of biociden;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel118
  - number: 118.5.b
    text: de wijze van onderzoek naar gewasbeschermingsmiddelen of biociden;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel118
  - number: 118.5.c
    text: de wijze van beoordeling van gewasbeschermingsmiddelen of biociden;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel118
  - number: 118.5.d
    text: het verpakken of etiketteren van gewasbeschermingsmiddelen of biociden;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel118
  - number: 118.5.e
    text: |-
      de gevolgen die worden verbonden aan de effecten op mens, dier, plant, of milieu van productie van, handel in,
      opslag van, of het gebruik van gewasbeschermingsmiddelen of biociden;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel118
  - number: 118.5.f
    text: de wijze van toepassen van gewasbeschermingsmiddelen of biociden;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel118
  - number: 118.5.g
    text: |-
      het verlenen, schorsen en intrekken van certificaten, erkenningen, vergunningen en getuigschriften van
      vakbekwaamheid;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel118
  - number: 118.5.h
    text: het erkennen van examens of instanties;
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel118
  - number: 118.5.i
    text: het op de markt brengen van producten die met gewasbeschermingsmiddelen of biociden behandeld zijn.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel118
  - number: '119.1'
    text: |-
      Tegen een op grond van deze wet genomen besluit, met uitzondering van een besluit als bedoeld in de
      [artikelen 90, eerste lid][ref1], [107][ref2] en [108][ref3], kan een belanghebbende beroep instellen bij het
      College van Beroep voor het bedrijfsleven.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel90
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel107
      [ref3]: https://wetten.overheid.nl/BWBR0021670#Artikel108
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '90'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0021670
        artikel: '107'
        hoofdstuk: '7'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0021670
        artikel: '108'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: '119.2'
    text: |-
      In afwijking van [artikel 8:7 van de Algemene wet bestuursrecht][ref1] is voor beroepen tegen besluiten als bedoeld
      in [artikel 90, eerste lid][ref2], de rechtbank te Rotterdam bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel90
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0021670
        artikel: '90'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: '120.1'
    text: |-
      Een voordracht voor een op grond van deze wet vast te stellen algemene maatregel van bestuur kan worden gedaan
      en een ministeriële regeling op grond van deze wet kan worden vastgesteld door Onze Minister van Sociale Zaken
      en Werkgelegenheid, Onze Minister van Volksgezondheid, Welzijn en Sport, dan wel Onze Minister van Verkeer en
      Waterstaat, in overeenstemming met Onze Minister, indien belangen van arbeidsomstandigheden, volksgezondheid, dan
      wel waterbeheer in het geding zijn.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel120
  - number: '120.2'
    text: |-
      Een ministeriële regeling op grond van deze wet wordt vastgesteld in overeenstemming met Onze Minister van Sociale
      Zaken en Werkgelegenheid, Onze Minister van Volksgezondheid, Welzijn en Sport, dan wel Onze Minister van Verkeer en
      Waterstaat voor zover belangen van arbeidsomstandigheden, volksgezondheid, dan wel waterbeheer in het geding zijn.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel120
  - number: '121.1'
    text: Aanvragen voor besluiten inzake gewasbeschermingsmiddelen en biociden die
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel121
  - number: 121.1.a
    text: |-
      werkzame stoffen bevatten die vóór 26 juli 1993 onderscheidenlijk 15 mei 2000 in een lidstaat van de Europese Unie
      op de markt zijn gebracht of ingevolge een communautaire maatregel daarmee zijn gelijkgesteld, en
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel121
  - number: 121.1.b
    text: |-
      waarvan de werkzame stoffen ingevolge een communautaire maatregel zijn of worden onderzocht voor opneming in
      bijlage I bij richtlijn 91/414/EEG onderscheidenlijk in bijlage I, IA, of IB bij richtlijn 98/8/EG,
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel121
  - number: '121.2'
    text: |-
      Een aanvraag voor een besluit als bedoeld in het eerste lid wordt op grond van dit hoofdstuk in behandeling genomen
      tot:
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel121
  - number: 121.2.a
    text: |-
      de termijn bedoeld in [artikel 127, tweede lid][ref1], is verstreken, onder de voorwaarden, opgenomen bij de
      communautaire maatregel, bedoeld in [artikel 127, tweede lid][ref2] of


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel127
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '127'
        hoofdstuk: '9'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0021670
        artikel: '127'
        hoofdstuk: '9'
        paragraaf: '3'
  - number: 121.2.b
    text: |-
      de uiterste termijn van herbeoordeling van een gewasbeschermingsmiddel of biocide als bedoeld in
      [artikel 128, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel128
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '128'
        hoofdstuk: '9'
        paragraaf: '3'
  - number: '121.3'
    text: |-
      Aanvragen voor besluiten inzake gewasbeschermingsmiddelen of biociden als bedoeld in het eerste lid die een
      combinatie van werkzame stoffen bevatten, worden beoordeeld aan de hand van [hoofdstuk 4][ref1] of [5][ref2] voor
      zover in dit hoofdstuk geen andersluidende bepalingen zijn opgenomen voor een in de combinatie opgenomen werkzame
      stof als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0021670
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0021670
        hoofdstuk: '5'
  - number: 121a.1
    text: |-
      Het college houdt bij de beoordeling van een aanvraag als bedoeld in [artikel 121, eerste lid][ref1], naar
      behoren rekening met de effecten die een gewasbeschermingsmiddel, onderscheidenlijk een biocide, kan hebben op de
      gezondheid van mens en dier, alsmede op het milieu en beoordeelt of deze effecten niet onaanvaardbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel121
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel121a
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '121'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 121a.2
    text: |-
      Het college beoordeelt een aanvraag als bedoeld in [artikel 121, eerste lid][ref1], aan de hand van een dossier
      dat de nodige informatie bevat om de effecten, bedoeld in het eerste lid, daadwerkelijk te kunnen onderzoeken en
      aan de hand van gegevens die bij het college over het middel bekend zijn, onverminderd de [artikelen 27][ref2]
      en [47][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel121
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0021670#Artikel47
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel121a
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '121'
        hoofdstuk: '9'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0021670
        artikel: '27'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0021670
        artikel: '47'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 121a.3
    text: |-
      Het college neemt een aanvraag voor een besluit inzake een gewasbeschermingsmiddel als bedoeld in
      [artikel 121, eerste lid][ref1], slechts in behandeling onder de voorwaarde dat het dossier, bedoeld in het tweede
      lid, naar het oordeel van het college ten minste voldoet aan de voorschriften inzake de te verstrekken gegevens die
      ter uitvoering van [artikel 3 van de Bestrijdingsmiddelenwet 1962][ref2] op 19 augustus 1991 bestonden en met in
      achtneming van bij of krachtens algemene maatregel van bestuur te stellen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel121
      [ref2]: https://wetten.overheid.nl/BWBR0002380#Artikel3
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel121a
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '121'
        hoofdstuk: '9'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002380
        artikel: '3'
  - number: 121a.4
    text: |-
      Het college neemt een aanvraag voor een besluit inzake een biocide als bedoeld in [artikel 121, eerste lid][ref1],
      slechts in behandeling onder de voorwaarde dat het dossier, bedoeld in het tweede lid, naar het oordeel van
      het college ten minste voldoet aan de voorschriften inzake de te verstrekken gegevens die ter uitvoering van de
      [artikelen 3][ref2] en [3a van de Bestrijdingsmiddelenwet 1962][ref3] op 15 mei 1998 bestonden en met in achtneming
      van bij of krachtens algemene maatregel van bestuur te stellen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel121
      [ref2]: https://wetten.overheid.nl/BWBR0002380#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002380#Artikel3a
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel121a
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '121'
        hoofdstuk: '9'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002380
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0002380
        artikel: 3a
  - number: 121a.5
    text: |-
      Voor de uitvoering van het eerste tot en met vierde lid worden bij of krachtens algemene
      maatregel van bestuur regels gesteld in verband met de gevolgen van het gebruik bedoeld in
      [artikel 28, eerste lid, onderdeel b, onder 1° tot en met 5°][ref1], onderscheidenlijk
      [artikel 49, eerste lid, onderdeel b, onder 1° tot en met 4°][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel49
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel121a
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0021670
        artikel: '49'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '122.1'
    text: |-
      Het college stelt volgens bij of krachtens algemene maatregel van bestuur te stellen regels
      lijsten van gewasbeschermingsmiddelen, onderscheidenlijk biociden vast, waarvoor onder de
      [Bestrijdingsmiddelenwet 1962][ref1] een aanvraag tot verlenging van de toelating of registratie als bedoeld
      in [artikel 25d, zesde lid, onderdeel e, van de Bestrijdingsmiddelenwet 1962][ref2] is ingediend en verlengt de
      voor deze gewasbeschermingsmiddelen en biociden op grond van [artikel 129, tweede lid, eerste volzin][ref3], op
      het tijdstip van inwerkingtreding van deze wet geldende besluiten tot toelating met een in de lijsten opgenomen
      termijn. Het college kan de geldende besluiten tot toelating opnieuw verlengen door deze lijsten te wijzigen of
      opnieuw vast te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002380
      [ref2]: https://wetten.overheid.nl/BWBR0002380#Artikel25d
      [ref3]: https://wetten.overheid.nl/BWBR0021670#Artikel129
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0002380
      - id: ref2
        bwb_id: BWBR0002380
        artikel: 25d
      - id: ref3
        bwb_id: BWBR0021670
        artikel: '129'
        hoofdstuk: '10'
        paragraaf: '1'
  - number: '122.2'
    text: |-
      Een gewasbeschermingsmiddel of biocide wordt slechts op een lijst als bedoeld in het eerste lid opgenomen
      indien het college van oordeel is dat het gewasbeschermingsmiddel, onderscheidenlijk de biocide, als bedoeld in
      [artikel 122, eerste lid][ref1], aan [artikel 121a][ref2] voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel122
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel121a
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '122'
        hoofdstuk: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0021670
        artikel: 121a
        hoofdstuk: '9'
        paragraaf: '1'
  - number: '122.3'
    text: |-
      De verlenging, bedoeld in het eerste lid, eindigt in ieder geval op de uiterste datum dat aan een communautaire
      maatregel inzake de opneming of niet opneming van een werkzame stof in bijlage I bij richtlijn 91/414/
      EEG onderscheidenlijk in bijlage I, IA of IB bij richtlijn 98/8/EG gevolg moet zijn gegeven, tenzij het
      college een besluit als bedoeld in [artikel 127, eerste of derde lid][ref1], of een besluit als bedoeld in
      [artikel 128, eerste of derde lid][ref2], neemt.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel128
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '127'
        hoofdstuk: '9'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0021670
        artikel: '128'
        hoofdstuk: '9'
        paragraaf: '3'
  - number: '122.4'
    text: |-
      Het college besluit ambtshalve tot een nieuw onderzoek inzake de toelating van een
      gewasbeschermingsmiddel als bedoeld in het tweede lid, indien het college op basis van de haar
      bekende gegevens tot het oordeel komt dat er aanwijzingen bestaan dat niet wordt voldaan aan de in
      [artikel 28, eerste lid, onderdeel b, onder 1° tot en met 5°][ref1], alsmede onderdelen d en e, genoemde
      voorwaarden. Het college kan na voornoemd onderzoek besluiten tot een tijdelijke beperking, een wijziging dan wel
      intrekking van de toelating of tot een verbod van het gewasbeschermingsmiddel.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel28
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '123.1'
    text: |-
      Het college besluit volgens bij of krachtens algemene maatregel van bestuur te stellen regels op aanvraag tot
      toelating van een gewasbeschermingsmiddel of biocide, als bedoeld in [artikel 121, eerste lid][ref1], indien het
      belang van de landbouw of een andere economische sector dit volgens voornoemde regels vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel121
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '121'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: '123.2'
    text: |-
      [Artikel 122, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel122
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '122'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: '123.3'
    text: |-
      Indien naar het oordeel van het college een onverwijlde voorziening noodzakelijk is, kan het college
      bepalen dat de toelating onmiddellijk in werking treedt. In dat geval kan het college, in afwijking van
      [artikel 3:42, van de Algemene wet bestuursrecht][ref1], het besluit op bij ministeriële regeling te bepalen wijzen
      bekend maken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '124.1'
    text: |-
      Het college besluit volgens bij of krachtens algemene maatregel van bestuur te stellen regels op aanvraag tot
      toelating van gewasbeschermingsmiddelen of biociden als bedoeld in [artikel 121, eerste lid][ref1]: - waarvan
      de werkzame stoffen zijn opgenomen in communautaire maatregelen voor de uitvoering van de vierde fase van het
      werkprogramma als bedoeld in artikel 8, tweede lid, tweede alinea, van [richtlijn 91/414/EEG](31991L0414), of
        - die volgens bijlage II, onderdeel B, bij [Verordening nr. 2092/91/EEG](31991R2092) van de Raad van de
      Europese Gemeenschappen van 24 juni 1991 inzake de biologische produktiemethode en aanduidingen dienaangaande op
      landbouwprodukten en levensmiddelen (PbEG L 198), onder de bij deze verordening gestelde voorwaarden voor gebruik
      bij biologische productiemethoden in aanmerking kunnen komen en waarvan de werkzame stof is opgenomen in bijlage
      II, onderdeel B, bij genoemde verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel121
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '121'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: '124.2'
    text: |-
      [Artikel 122, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel122
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '122'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: '125.1'
    text: |-
      Het college besluit op aanvraag tot toelating van een gewasbeschermingsmiddel of biocide als bedoeld in
      [artikel 121, eerste lid][ref1], waarvan de samenstelling in vergelijking met een eerder besluit tot toelating
      gewijzigd is, indien het college van oordeel is dat bij de gewijzigde samenstelling van dat middel sprake is van
      minder risico voor mens, dier, plant of milieu of van een middel met een grotere werkzaamheid bij een voor mens,
      dier, plant of milieu vergelijkbaar risico in vergelijking tot de samenstelling van het reeds toegelaten middel.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel121
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '121'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: '125.2'
    text: |-
      Alleen aanvragen van een natuurlijke persoon of rechtspersoon ten name van wie een eerdere toelating als
      bedoeld in het eerste lid is opgenomen in het register, bedoeld in [artikel 42, tweede lid][ref1], alsmede van
      aanvragers die een verklaring van toegang als bedoeld in [artikel 25, eerste lid, onderdelen a en b][ref2], of
      [artikel 45, tweede lid, onderdelen a en b][ref3], kunnen overleggen, worden in behandeling genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0021670#Artikel45
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0021670
        artikel: '25'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0021670
        artikel: '45'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '125.3'
    text: |-
      [Artikel 122, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel122
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '122'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: '126.1'
    text: |-
      Het college kan in afwijking van [artikel 49][ref1] een aanvraag tot vereenvoudigde uitbreiding van de toepassing
      van een biocide als bedoeld in [artikel 121, eerste lid][ref2], in behandeling nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel121
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '49'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0021670
        artikel: '121'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: '126.2'
    text: |-
      Alleen een natuurlijke persoon of rechtspersoon ten name van wie een besluit tot toelating is opgenomen in het
      register, bedoeld in [artikel 42, tweede lid][ref1], kan een aanvraag als bedoeld in het eerste lid, indienen met
      betrekking tot voornoemd besluit tot toelating.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel42
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '6'
  - number: '126.3'
    text: |-
      Op een aanvraag als bedoeld in het eerste lid, is [artikel 49, eerste lid, onderdeel b, aanhef en onder 1°][ref1],
      niet van toepassing, wanneer het voorgenomen gebruik een kleine omvang heeft in vergelijking met het gebruik dat
      verband houdt met de eerdere toelating.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel49
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '49'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '126.4'
    text: |-
      De [artikelen 45, tweede lid][ref1], [48, tweede lid][ref2],
      [49, eerste lid, onderdeel a en onderdeel b, aanhef, eerste zinsdeel][ref3] met betrekking tot de
      gemeenschappelijke beginselen, en de [artikelen 54 tot en met 56][ref4] alsmede de [paragrafen 4][ref5] en
      [5 van hoofdstuk 5][ref6], zijn op besluiten als bedoeld in het eerste lid niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel48
