      gewasbeschermingsmiddelen en biociden die op de dag voorafgaande aan het tijdstip van inwerkingtreding van deze wet
      op grond van de [Bestrijdingsmiddelenwet 1962][ref2] zijn toegelaten of geregistreerd of waarvoor op dat tijdstip
      een vrijstelling, ontheffing of uitzondering op grond van [die wet][ref3] van kracht is.


