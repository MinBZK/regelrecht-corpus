  - number: '129.2'
    text: |-
      Gewasbeschermingsmiddelen en biociden die op 3 mei 2007 van rechtswege zijn toegelaten op grond van
      [artikel 25d van de Bestrijdingsmiddelenwet 1962][ref1] worden vanaf die datum geacht te zijn toegelaten op
      grond van [artikel 122, eerste lid][ref2], van deze wet onder de voorschriften die bij de toelating zijn gegeven.
      Alle toelatingen van rechtswege op grond van dit lid vervallen op de datum van inwerkingtreding van het eerste
      besluit tot vaststelling van een lijst voor gewasbeschermingsmiddelen, onderscheidenlijk biociden, als bedoeld in
      [artikel 122, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel25d
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel122
      [ref3]: https://wetten.overheid.nl/BWBR0021670#Artikel122
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel129
