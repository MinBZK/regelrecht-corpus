        artikel: '44'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '128.3'
    text: |-
      Het college kan een termijn voor de indiening van een aanvraag als bedoeld in het tweede lid, op aanvraag of
      ambtshalve opnieuw wijzigen of verlengen tot een bij de in het eerste lid genoemde communautaire maatregel bepaalde
      uiterste termijn van herbeoordeling van een toegelaten gewasbeschermingsmiddel of biocide. Het verstrijken van de
      uiterste termijn van herbeoordeling van een toegelaten gewasbeschermingsmiddel of biocide leidt van rechtswege tot
      intrekking van de toelating.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel128
  - number: '128.4'
    text: |-
      Besluiten tot wijziging, verlenging of intrekking als bedoeld in het eerste tot en met derde lid, worden genomen
      binnen de termijn opgenomen bij de communautaire maatregel, bedoeld in het eerste lid, alsmede met in achtneming
      van de binnen die termijn toe te passen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel128
  - number: '129.1'
    text: |-
      Gewasbeschermingsmiddelen of biociden die op het tijdstip van inwerkingtreding van deze wet zijn toegelaten
      op grond van de [Bestrijdingsmiddelenwet 1962][ref1] bij besluit van het College voor de toelating van
      bestrijdingsmiddelen, worden bij de inwerkingtreding van deze wet geacht te zijn toegelaten op grond van
      [artikel 28][ref2] onderscheidenlijk [artikel 49][ref3] van deze wet onder de voorschriften die bij de toelating
      zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002380
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0021670#Artikel49
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel129
