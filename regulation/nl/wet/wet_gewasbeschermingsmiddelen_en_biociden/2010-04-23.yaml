    text: |-
      Ingeval van overtreding van het bij of krachtens de [artikelen 22, tweede lid][ref1], [22, vierde lid][ref2],
      in samenhang met [22, tweede lid][ref3], [71, eerste lid][ref4], [72, eerste tot en met derde lid][ref5],
