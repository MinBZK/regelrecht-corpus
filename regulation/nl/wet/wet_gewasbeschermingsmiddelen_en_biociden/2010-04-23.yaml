  - number: '94'
    text: |-
      Indien de ernst van de overtreding of de omstandigheden waaronder zij is begaan daartoe aanleiding geven, wordt zij
      aan het openbaar ministerie voorgelegd.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel94
  - number: '97.1'
    text: |-
      Ingeval van overtreding van het bepaalde bij of krachtens de [artikelen 18][ref1], [19][ref2], [20][ref3],
      [22, eerste lid][ref4], [22, vierde lid][ref5], in samenhang met [22, eerste lid][ref6], [40, derde lid][ref7],
      [64, achtste lid][ref8], [67, tweede lid][ref9], [74, tweede lid][ref10], [75][ref11], [78 tot en met 81][ref12],
