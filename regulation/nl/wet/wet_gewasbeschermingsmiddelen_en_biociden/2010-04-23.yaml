  - number: '129.3'
    text: |-
      Biociden die op het tijdstip van inwerkingtreding van deze wet zijn geregistreerd als biocide met een gering
      risico op grond van de [Bestrijdingsmiddelenwet 1962][ref1], worden geacht te zijn geregistreerd op grond van
      [artikel 58][ref2] van deze wet.


