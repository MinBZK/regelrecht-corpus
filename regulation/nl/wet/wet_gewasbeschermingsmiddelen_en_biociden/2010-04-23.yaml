      niet opneming van de werkzame stof in bijlage I bij [richtlijn 91/414/EEG](31991L0414) onderscheidenlijk in bijlage
      I, IA of IB bij [richtlijn 98/8/EG](31998L0008), of
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel127
  - number: 127.1.b
    text: |-
      beëindiging van het onderzoek bedoeld in artikel 8, tweede lid, van [richtlijn 91/414/EEG](31991L0414)
      onderscheidenlijk artikel 16, tweede lid, van [richtlijn 98/8/EG](31998L0008).
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel127
  - number: '127.2'
    text: |-
      Een besluit tot wijziging of intrekking als bedoeld in het eerste lid, wordt genomen binnen de termijn alsmede
      met in achtneming van de binnen die termijn toe te passen voorwaarden, opgenomen bij de communautaire maatregel,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel127
  - number: '127.3'
    text: |-
      In afwijking van het eerste lid kan het college volgens bij of krachtens algemene maatregel van bestuur te stellen
      regels ambtshalve besluiten tot verlenging van een besluit tot toelating voor zover er sprake is van een ingevolge
      de in het eerste lid genoemde communautaire maatregel toegestaan noodzakelijk gebruik.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel127
  - number: '128.1'
    text: |-
      Het college besluit ambtshalve volgens bij of krachtens algemene maatregel van bestuur te stellen regels
      tot wijziging, verlenging of intrekking van besluiten, als bedoeld in de [artikelen 28][ref1], [49][ref2],
      [122 tot en met 126][ref3] met betrekking tot de termijn van toelating, indien bij communautaire maatregel een
      besluit is genomen tot opneming van de in het gewasbeschermingsmiddel, onderscheidenlijk in de biocide, werkzame
      stof in bijlage I bij [richtlijn 91/414/EEG](31991L0414), onderscheidenlijk in bijlage I, IA of IB bij [richtlijn
      98/8/EG](31998L0008).


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0021670#Artikel122
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel128
