  - number: '128.2'
    text: |-
      Het college bepaalt bij zijn wijzigingsbesluit bedoeld in het eerste lid, ambtshalve een termijn voor de indiening
      van een aanvraag als bedoeld in [artikel 23, eerste lid][ref1], voor een gewasbeschermingsmiddel, onderscheidenlijk
      in [artikel 44, eerste lid][ref2], voor een biocide.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel44
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel128
