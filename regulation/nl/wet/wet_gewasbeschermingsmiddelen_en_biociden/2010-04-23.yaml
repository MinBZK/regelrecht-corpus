    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel11
  - number: '12.1'
    text: |-
      Het college stelt jaarlijks een werkplan voor het eerstvolgende jaar vast. Het werkplan bevat tevens een visie
      op de ontwikkelingen voor de eerstvolgende vier jaren met betrekking tot aard en omvang van de aan het college
      toebedeelde taken en de daaruit voortvloeiende gevolgen voor de organisatie. Het werkplan wordt vóór 1 oktober aan
      Onze Ministers ter kennis gebracht.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel12
  - number: '12.2'
    text: |-
      Indien de goedkeuring wordt onthouden aan de begroting, is het college gerechtigd gedurende ten hoogste zes maanden
      voor iedere maand gedurende welke de goedkeuring wordt onthouden, uitgaven te doen ter grootte van ten hoogste een
      twaalfde deel van de begroting van het voorafgaande jaar waarmee is ingestemd.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel12
  - number: '12.3'
    text: |-
      Onze Minister kan tevens een onderzoek instellen naar de doelmatigheid van het beheer, de organisatie en het beleid
      van het college alsmede naar de doeltreffendheid van de uitvoering en het beleid van het college. Desgevraagd geeft
      het college ten behoeve van dit onderzoek inzage van de boeken en bescheiden en verstrekt het alle inlichtingen die
      voor dit onderzoek nodig geoordeeld worden.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel12
  - number: '12.4'
    text: |-
      Onze Minister kan nadere regels stellen over de inrichting van het werkplan, bedoeld in het eerste lid, alsmede het
      jaarverslag, de begroting en de jaarrekening bedoeld, in [artikel 18][ref1], respectievelijk [artikel 26][ref2],
      respectievelijk [artikel 34 van de Kaderwet zelfstandige bestuursorganen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0020495#Artikel34
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '26'
      - id: ref3
        bwb_id: BWBR0020495
        artikel: '34'
  - number: '13'
    text: |-
      Onze Minister stelt na overleg met het college een informatiestatuut vast. Het informatiestatuut bevat regels met
      betrekking tot de informatievoorziening tussen Onze Ministers en het college.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel13
  - number: '18'
    text: |-
      Een ieder is verplicht ten aanzien van gewasbeschermingsmiddelen of biociden of de tot die middelen behorende
      werkzame stoffen alsmede ten aanzien van lege verpakkingen voldoende zorg in acht te nemen. Die zorg houdt in
      ieder geval in dat een ieder die weet of redelijkerwijs kan vermoeden dat door zijn handelen of nalaten gevaar
      ontstaat of kan ontstaan voor de mens, voor dieren of planten waarvan de instandhouding gewenst is, voor planten
      die aan anderen toebehoren of voor bodem of water, verplicht is dergelijk handelen achterwege te laten voor zover
      zulks in redelijkheid kan worden gevergd, dan wel onverwijld alle maatregelen te nemen die redelijkerwijs van hem
      kunnen worden gevergd teneinde voornoemd gevaar te voorkomen of de nadelige gevolgen daarvan te beperken en zoveel
      mogelijk ongedaan te maken.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel18
  - number: '19'
    text: |-
      Het is verboden een werkzame stof op de markt te brengen, voorhanden of in voorraad te hebben, binnen Nederland te
      brengen of, al dan niet in een gewasbeschermingsmiddel of biocide, te gebruiken.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel19
  - number: '20'
    text: |-
      Het is verboden een gewasbeschermingsmiddel of een biocide op de markt te brengen, voorhanden of in voorraad te
      hebben, binnen Nederland te brengen of te gebruiken, dat niet ingevolge deze wet is toegelaten of, voor zover het
      een biocide met een gering risico betreft, is geregistreerd.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel20
  - number: '21.1'
    text: |-
      Het verbod, bedoeld in [artikel 19][ref1], geldt niet voor een werkzame stof die tot de samenstelling behoort van
      een ingevolge deze wet toegelaten gewasbeschermingsmiddel of een ingevolge deze wet toegelaten of geregistreerd
      biocide.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel19
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '19'
        hoofdstuk: '3'
  - number: '21.2'
    text: |-
      Voor de toepassing van het eerste lid en de [artikelen 19][ref1] en [20][ref2] gelden als toegelaten of
      geregistreerd: gewasbeschermingsmiddelen of biociden, op de verpakking waarvan de naam van een toegelaten of
      geregistreerd middel en het nummer van de toelating of de registratie zijn vermeld en die zijn opgenomen in het in
      [artikel 42, tweede lid][ref3], bedoelde register.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0021670#Artikel42
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '19'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0021670
        artikel: '20'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0021670
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '6'
  - number: '22.1'
    text: |-
      Het is verboden te handelen in strijd met de voorschriften die krachtens de [artikelen 29][ref1] en [50][ref2] bij
      de toelating worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel50
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '29'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0021670
        artikel: '50'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '22.2'
    text: |-
      Het is verboden toegelaten gewasbeschermingsmiddelen, onderscheidenlijk toegelaten of geregistreerde biociden,
      op de markt te brengen of voorhanden of in voorraad te hebben indien de krachtens de [artikelen 29][ref1]
      en [50][ref2] voor het gebruik gegeven voorschriften niet op de daarbij voorgeschreven wijze op, aan of bij
      de verpakking zijn vermeld of indien het gehalte aan werkzame stof en de verdere samenstelling, kleur, vorm,
      afwerking, verpakking, aanduidingen of vermeldingen niet aan die voorschriften voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel50
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '29'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0021670
        artikel: '50'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '22.3'
    text: |-
      Het in het tweede lid bedoelde verbod geldt niet voor zover het college een voorziening heeft getroffen voor het op
      de markt brengen, in voorraad houden, voorhanden hebben of gebruiken van gewasbeschermingsmiddelen en biociden als
      bedoeld in [artikel 41, derde lid][ref1], of [artikel 68, derde lid][ref2], dan wel voor zover wordt voldaan aan
      het bij of krachtens de [artikelen 74, tweede lid][ref3], en [artikel 75, onderdeel c][ref4], bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel68
      [ref3]: https://wetten.overheid.nl/BWBR0021670#Artikel74
      [ref4]: https://wetten.overheid.nl/BWBR0021670#Artikel75
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '41'
        hoofdstuk: '4'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0021670
        artikel: '68'
        hoofdstuk: '5'
        paragraaf: '7'
      - id: ref3
        bwb_id: BWBR0021670
        artikel: '74'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0021670
        artikel: '75'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '22.4'
    text: |-
      Het eerste tot en met derde lid zijn van overeenkomstige toepassing op vrijstellingen als bedoeld in
      [artikel 37, eerste lid][ref1], [artikel 38, eerste lid][ref2], [artikel 64, eerste lid][ref3], en
      [artikel 65, eerste lid][ref4], alsmede erkenningen als bedoeld in [artikel 37, zesde lid][ref5] en
      [artikel 64, zesde lid][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0021670#Artikel64
      [ref4]: https://wetten.overheid.nl/BWBR0021670#Artikel65
      [ref5]: https://wetten.overheid.nl/BWBR0021670#Artikel37
      [ref6]: https://wetten.overheid.nl/BWBR0021670#Artikel64
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0021670
        artikel: '38'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0021670
        artikel: '64'
        hoofdstuk: '5'
        paragraaf: '6'
      - id: ref4
        bwb_id: BWBR0021670
        artikel: '65'
        hoofdstuk: '5'
        paragraaf: '6'
      - id: ref5
        bwb_id: BWBR0021670
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref6
        bwb_id: BWBR0021670
