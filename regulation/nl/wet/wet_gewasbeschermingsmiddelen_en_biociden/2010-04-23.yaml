  - number: '129.5'
    text: |-
      Gewasbeschermingsmiddelen of biociden, die zijn vrijgesteld van toelating of waarvoor een ontheffing is verstrekt
      op grond van [artikel 16a van de Bestrijdingsmiddelenwet 1962][ref1], worden geacht te zijn toegelaten op grond
      van [artikel 38][ref2] van deze wet voor gewasbeschermingsmiddelen, onderscheidenlijk [artikel 65][ref3] van
      deze wet voor biociden, onder de voorschriften die bij de vrijstelling of ontheffing zijn gegeven en tot de in de
      vrijstelling of ontheffing opgenomen termijn is verstreken.


