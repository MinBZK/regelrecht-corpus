  - number: '10.2'
    text: |-
      De in het eerste lid bedoelde tarieven hebben een rechtstreeks verband met de in dat lid bedoelde activiteiten
      en belopen niet meer dan nodig is ter dekking van de gemaakte kosten die zijn toe te rekenen aan de onderscheiden
