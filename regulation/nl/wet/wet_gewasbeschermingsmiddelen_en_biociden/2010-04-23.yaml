  - number: '126.5'
    text: |-
      Het college besluit op een aanvraag als bedoeld in het eerste lid of op verzoek van Onze Minister tot uitbreiding
      van een toepassing als bedoeld in het eerste lid, wanneer dit in het openbaar belang is en het voorgenomen gebruik
      van kleine omvang is.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel126
  - number: '126.6'
    text: |-
      De aanvrager deelt het college bij de aanvraag mede hoe de voorschriften voor de uitbreiding van de toepassing aan
      de gebruikers worden medegedeeld.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel126
  - number: '126.7'
    text: |-
      Het college kan in het belang van de volksgezondheid, arbeidsbescherming en milieu ambtshalve een wijze van
      mededelen bepalen.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel126
  - number: '126.8'
    text: Onze Minister kan regels stellen voor de toepassing van het bepaalde in het vijfde en zevende lid.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel126
  - number: '127.1'
    text: |-
      Het college besluit ambtshalve volgens bij of krachtens algemene maatregel van bestuur te stellen regels
      tot wijziging of intrekking van een toelating, als bedoeld in de [artikelen 28][ref1], [49][ref2],
      [122 tot en met 126][ref3] van een gewasbeschermingsmiddel of biocide als bedoeld in [artikel 121][ref4], indien
      bij communautaire maatregel een besluit is genomen tot:


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0021670#Artikel122
      [ref4]: https://wetten.overheid.nl/BWBR0021670#Artikel121
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel127
