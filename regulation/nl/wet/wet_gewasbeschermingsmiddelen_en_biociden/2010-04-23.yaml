        hoofdstuk: '5'
        paragraaf: '6'
  - number: 4.e
    text: |-
      andere, bij algemene maatregel van bestuur opgedragen taken, die verband houden met de onder a tot en met d
      bedoelde taken.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel4
  - number: '5.1'
    text: |-
      Het college bestaat uit vijf leden, de voorzitter daaronder begrepen, en ten hoogste vier plaatsvervangende leden.
      De benoeming vindt plaats op grond van deskundigheid op het gebied van de taken waarmee het college is belast.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel5
  - number: '5.2'
    text: De leden wijzen uit hun midden een plaatsvervangend voorzitter aan.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel5
  - number: '5.3'
    text: |-
      De leden en de plaatsvervangend leden worden voor de duur van vier jaren benoemd. Zij zijn ten hoogste twee keer
      herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel5
  - number: '5.4'
    text: |-
      De leden en de plaatsvervangend leden hebben op persoonlijke titel zitting in het college en oefenen hun functie
      uit zonder last of ruggespraak.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel5
  - number: '5.5'
    text: |-
      Zolang in een vacature niet is voorzien, vormen de overblijvende leden het college, met de bevoegdheid van het
      volledig college.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel5
  - number: '5.6'
    text: |-
      Leden en plaatsvervangend leden die zijn benoemd ter vervanging van een tussentijds opengevallen plaats, treden af
      op het tijdstip waarop degene in wiens plaats zij zijn benoemd, zou moeten aftreden.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel5
  - number: '5.7'
    text: |-
      De bezoldiging dan wel schadeloosstelling, bedoeld in
      [artikel 14, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1], voor de leden en plaatsvervangende
      leden van het college komt ten laste van de begroting van het college.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel14
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '14'
  - number: '7.1'
    text: |-
      Het college heeft een secretaris en een secretariaat. Het secretariaat is belast met de ondersteuning van het
      college.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel7
  - number: '7.2'
    text: |-
      De secretaris wordt op voordracht van het college benoemd door Onze Minister. Hij kan worden geschorst of ontslagen
      door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel7
  - number: '7.3'
    text: |-
      De secretaris van het college is tevens directeur van het secretariaat. Hij is belast met de dagelijkse leiding
      daarvan.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel7
  - number: '8.1'
    text: 'Het college stelt een bestuursreglement vast, waarin in ieder geval wordt geregeld:'
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel8
  - number: 8.1.a
    text: de werkwijze van het college en de taakverdeling tussen de leden, en
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel8
  - number: 8.1.b
    text: |-
      overige zaken betrekking hebbende op de uitvoering van het bij of krachtens deze wet gestelde, waaronder de nadere
      eisen, bedoeld in [artikel 2:15 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
  - number: '8.2'
    text: |-
      Het college kan bij het reglement zijn vertegenwoordiging in en buiten rechte opdragen aan een of meer leden van
      het college of aan de secretaris. Het kan bepalen dat deze vertegenwoordiging uitsluitend betrekking heeft op
      bepaalde aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel8
  - number: '8.3'
    text: |-
      Het college kan bij het reglement de uitoefening van daarbij aan te wijzen taken en bevoegdheden opdragen aan een
      of meer leden of aan de secretaris.
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel8
  - number: '8.6'
    text: |-
      In aanvulling op het eerste lid, onderdeel b, kan het college in een bestuursreglement regels stellen voor
      het bij een schriftelijke aanvraag overleggen van gegevens op een elektronische gegevensdrager en de aanvrager
      daartoe verplichten, voorzover een belanghebbende de gegevens niet langs elektronische weg verzendt als bedoeld in
      [artikel 2:15 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0021670/2010-04-23#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
  - number: '10.1'
    text: |-
