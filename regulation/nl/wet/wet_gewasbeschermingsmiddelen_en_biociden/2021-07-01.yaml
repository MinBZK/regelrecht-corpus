preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe regels te stellen voor de toelating, het op
    de markt brengen en het gebruik van gewasbeschermingsmiddelen alsmede voor de toelating en registratie, het op
    de markt brengen en het gebruik van biociden, mede gelet op richtlijn nr. 91/414/EEG van de Raad van de Europese
    Gemeenschappen van 15 juli 1991 betreffende het op de markt brengen van gewasbeschermingsmiddelen (PbEG L 230) en
    richtlijn nr. 98/8/EG van het Europees Parlement en de Raad van de Europese Unie van 16 februari 1998 betreffende
    het op de markt brengen van biociden (PbEG L 123);

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: apparatuur voor de toepassing van
      gewasbeschermingsmiddelen: apparaat dat specifiek is bestemd voor de toepassing van gewasbeschermingsmiddelen,
      inclusief hulpstukken die essentieel zijn voor de doeltreffende werking daarvan, zoals spuitdoppen, manometers,
      filters, zeven en toebehoren voor het schoonmaken van tanks; behandeld voorwerp: behandeld voorwerp als
      bedoeld in artikel 3, eerste lid, onder 1, van verordening (EU) Nr. 528/2012; biociden: biociden als bedoeld
      in artikel 3, eerste lid onder a, van verordening (EU) Nr. 528/2012; college: College voor de toelating van
      gewasbeschermingsmiddelen en biociden, genoemd in [artikel 3][ref1]; communautaire maatregel: verordening,
      richtlijn of beschikking als bedoeld in artikel 249 van het Verdrag tot oprichting van de Europese Economische
      Gemeenschap (Trb. 1957, 91) betrekking hebbende op gewasbeschermingsmiddelen of biociden; distributeur: elke
      natuurlijke persoon of rechtspersoon die ervoor zorgt dat gewasbeschermingsmiddelen of biociden in de handel
      verkrijgbaar zijn, met inbegrip van groothandelaren, detailhandelaren, verkopers en leveranciers; gebruiker:
      iedere natuurlijke persoon of rechtspersoon die een gewasbeschermingsmiddel of biocide toepast, toedient, doet
      toepassen, of doet toedienen; geïntegreerde gewasbescherming: de zorgvuldige afweging van alle beschikbare
      gewasbeschermingsmethoden, gevolgd door de integratie van passende maatregelen die de ontwikkeling van populaties
      van schadelijke organismen tegengaan, het gebruik van gewasbeschermingsmiddelen en andere vormen van interventie
      tot economisch en ecologisch verantwoorde niveaus beperkt houden en het risico voor de gezondheid van de mens en
      voor het milieu tot een minimum beperken; gewasbeschermingsmiddel: gewasbeschermingsmiddel als bedoeld in artikel
      2, eerste lid, van verordening (EG) 1107/2009; Onze Minister: - voor gewasbeschermingsmiddelen, alsmede voor de
      toepassing van [hoofdstuk 2][ref2]: Onze Minister van Landbouw, Natuur en Voedselkwaliteit in overeenstemming met
      Onze Minister van Infrastructuur en Milieu;
        - voor biociden: Onze Minister van Infrastructuur en Milieu in overeenstemming met Onze Minister van Landbouw,
      Natuur en Voedselkwaliteit;
        - voor de [artikelen 86][ref3] en [90][ref4]: Onze Minister van Landbouw, Natuur en Voedselkwaliteit met betrekking
      tot overtredingen met gewasbeschermingsmiddelen of Onze Minister van Infrastructuur en Milieu met betrekking
      tot overtredingen met biociden; Onze Ministers: Onze Minister van Landbouw, Natuur en Voedselkwaliteit, Onze
      Minister van Infrastructuur en Milieu, Onze Minister van Sociale Zaken en Werkgelegenheid, en Onze Minister van
      Volksgezondheid, Welzijn en Sport; professionele gebruiker: persoon die in de landbouwsector of in een andere
      sector, gewasbeschermingsmiddelen gebruikt in het kader van zijn beroepsactiviteiten, met inbegrip van bedieners
      van toepassingsapparatuur, technici, werkgevers en zelfstandigen; richtlijn 2009/128/EG: Richtlijn 2009/128/
      EG van het Europees Parlement en de Raad van 21 oktober 2009 tot vaststelling van een kader voor communautaire
      actie ter verwezenlijking van een duurzaam gebruik van pesticiden (PbEU L 309); verordening (EG) nr. 1107/2009:
      Verordening (EG) Nr. 1107/2009 van het Europees Parlement en de Raad van 21 oktober 2009 betreffende het op de
      markt brengen van gewasbeschermingsmiddelen en tot intrekking van de Richtlijnen 79/117/EEG en 91/414/EEG van de
      Raad (PbEU, L 309); verordening (EU) Nr. 528/2012: Verordening (EU) Nr. 528/2012 van het Europees Parlement en de
      Raad van 22 mei 2012 betreffende het op de markt aanbieden en het gebruik van biociden (PbEU, L 167); verordening
      (EU) 2017/625: Verordening (EU) 2017/625 van het Europees Parlement en de Raad van 15 maart 2017 betreffende
      officiële controles en andere officiële activiteiten die worden uitgevoerd om de toepassing van de levensmiddelen-
      en diervoederwetgeving en van de voorschriften inzake diergezondheid, dierenwelzijn, plantgezondheid en
      gewasbeschermingsmiddelen te waarborgen, tot wijziging van de Verordeningen (EG) nr. 999/2001, (EG) nr. 396/2005,
      (EG) nr. 1069/2009, (EG) nr. 1107/2009, (EU) nr. 1151/2012, (EU) nr. 652/2014, (EU) 2016/429 en (EU) 2016/2031
      van het Europees Parlement en de Raad, de Verordeningen (EG) nr. 1/2005 en (EG) nr. 1099/2009 van de Raad en de
      [Richtlijnen 98/58/EG](31998L0058), [1999/74/EG](31999L0074), [2007/43/EG](32007L0043), [2008/119/EG](32008L0119)
      en [2008/120/EG](32008L0120) van de Raad, en tot intrekking van de Verordeningen (EG) nr. [854/2004](32754L2004)
      en (EG) nr. [882/2004](32782L2004) van het Europees Parlement en de Raad, de Richtlijnen [89/608/EEG](31989L0608),
      [89/662/EEG](31989L0662), [90/425/EEG](31990L0425), [91/496/EEG](31991L0496), [96/23/EG](31996L0023), [96/93/EG]
      (31996L0093) en [97/78/EG](31997L0078) van de Raad en Besluit [92/438/EEG](31992L0438) van de Raad (verordening
      officiële controles) (PbEU 2017, L 95); verpakking: omhulsel waarin een gewasbeschermingsmiddel of biocide aan of
      ten behoeve van een gebruiker wordt afgeleverd, of dat daartoe is bestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Hoofdstuk2
