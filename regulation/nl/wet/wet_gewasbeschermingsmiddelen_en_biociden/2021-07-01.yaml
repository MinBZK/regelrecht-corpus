  - number: '138'
    text: |-
      Onze Minister zendt binnen vier jaar na de inwerkingtreding van deze wet en vervolgens telkens na vier jaar aan de
      Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel138
  - number: '140'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel140
  - number: '141'
    text: 'Deze wet wordt aangehaald als: Wet gewasbeschermingsmiddelen en biociden.'
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel141
