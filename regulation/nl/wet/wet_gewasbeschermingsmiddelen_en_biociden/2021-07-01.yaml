  - number: 130a.1
    text: |-
      De Wet gewasbeschermingsmiddelen en biociden en de daarop berustende bepalingen, zoals deze luidden voor de
      inwerkingtreding van de Wet van 24 maart 2011 houdende wijziging van de Wet gewasbeschermingsmiddelen en biociden
      in verband met de implementatie van Europese regelgeving op het gebied van het op de markt brengen en het duurzame
      gebruik van gewasbeschermingsmiddelen (Stb. 235) blijft voor zover nodig van toepassing in de in artikel 80, eerste
      lid, van verordening (EG) 1107/2009 bedoelde gevallen.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel130a
  - number: 130a.2
    text: |-
      Op de voet van artikel 8o, tweede lid, van verordening (EG) 1107/2009 blijft het bepaalde bij of krachtens de
      [artikelen 25][ref1] en [27][ref2] van toepassing zoals deze bepalingen luidden voor de inwerkingtreding van
      de Wet van 24 maart 2011 houdende wijziging van de Wet gewasbeschermingsmiddelen en biociden in verband met de
      implementatie van Europese regelgeving op het gebied van het op de markt brengen en het duurzame gebruik van
      gewasbeschermingsmiddelen (Stb. 235).


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel27
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel130a
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '25'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0021670
        artikel: '27'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 130a.3
    text: |-
      De Wet gewasbeschermingsmiddelen en biociden en de daarop berustende bepalingen, zoals deze luidden voor de
      inwerkingtreding van de Wet van 24 maart 2011 houdende wijziging van de Wet gewasbeschermingsmiddelen en biociden
      in verband met de implementatie van Europese regelgeving op het gebied van het op de markt brengen en het duurzame
      gebruik van gewasbeschermingsmiddelen (Stb. 235), blijft van toepassing op aanvragen tot toelating, in de in
      artikel 80, vijfde lid, van verordening (EG) 1107/2009 bedoelde gevallen, totdat op die aanvragen is beslist.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel130a
