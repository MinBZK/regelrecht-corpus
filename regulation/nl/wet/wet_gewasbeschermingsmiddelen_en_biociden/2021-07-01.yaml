  - number: '1.2'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt onder «gebruiken» mede verstaan de aanwezigheid van een
      werkzame stof, al dan niet in een gewasbeschermingsmiddel of biocide, op of in gebouwen, plaatsen, voorwerpen,
      de grond dan wel op of in planten of plantaardige producten, met uitzondering van binnen Nederland gebracht
      uitgangsmateriaal waaronder stekken en zaaizaad, voor zover de werkzame stof in het land van herkomst op het
      uitgangsmateriaal is toegepast in overeenstemming met de wetgeving van dat land.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel1
  - number: '2.1'
    text: |-
      Onze Minister doet mededeling in de Staatscourant van de vaststelling of wijziging van een communautaire maatregel
      voor zover daaraan uitvoering moet worden gegeven, onder vermelding van de artikelen van deze wet waarop de
      desbetreffende communautaire maatregel betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel2
  - number: '2.2'
    text: |-
      Een communautaire maatregel of wijziging daarvan gaat voor de toepassing van deze wet gelden met ingang van de dag
      waarop daaraan uiterlijk uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de Staatscourant
      wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel2
  - number: 2a
    text: |-
      Een ieder is verplicht op zorgvuldige wijze om te gaan met gewasbeschermingsmiddelen, biociden, de daarbij
      behorende werkzame stoffen of daarbij gebruikte toevoegingsstoffen, alsmede restanten daarvan of de aangebroken
      verpakkingen. Die zorgvuldigheid houdt in ieder geval in, dat een ieder, die weet of redelijkerwijs kan vermoeden
      dat door zijn handelen of nalaten gevaar ontstaat of kan ontstaan voor een mens, voor een dier of voor planten
      waarvan de instandhouding gewenst is, voor planten die aan anderen toebehoren, voor de bodem of voor het water,
      verplicht is dergelijk handelen achterwege te laten, tenzij zulks in redelijkheid niet van hem kan worden gevergd,
      dan wel onverwijld alle maatregelen te nemen die redelijkerwijs van hem kunnen worden gevergd teneinde voornoemd
      gevaar te voorkomen of de nadelige gevolgen daarvan te beperken en zoveel mogelijk ongedaan te maken.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel2a
  - number: '3'
    text: |-
      Er is een College voor de toelating van gewasbeschermingsmiddelen en biociden. Het college bezit
      rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel3
  - number: '4.1'
    text: |-
      Het college wordt aangewezen als de bevoegde autoriteit voor Nederland in de zin van artikel 75 van verordening
      (EG) 1107/2009. Het college is in dat kader belast met het optreden als rapporteur lidstaat voor de beoordeling
      van werkzame stoffen, beschermstoffen en synergisten, alsmede met de toelating van gewasbeschermingsmiddelen en
      toevoegingsstoffen, overeenkomstig verordening (EG) 1107/2009.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel4
  - number: '4.2'
    text: |-
      Het college wordt aangewezen als de bevoegde autoriteit voor Nederland in de zin van artikel 81, eerste lid, van
      verordening (EU) Nr. 528/2012, tenzij in deze wet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel4
  - number: '4.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen aan het college andere taken worden opgedragen, die samenhangen met het
      op de markt brengen of het gebruik van gewasbeschermingsmiddelen of biociden.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel4
  - number: '4.4'
    text: |-
      In afwijking van het eerste lid is Onze Minister van Landbouw, Natuur en Voedselkwaliteit belast met het
      verstrekken van informatie als bedoeld in artikel 67, eerste lid, derde tekstblok, van verordening (EG) 1107/2009.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel4
  - number: '4.5'
    text: |-
      In afwijking van het eerste lid verstrekt de houder van een toelating aan Onze Minister van Landbouw, Natuur en
      Voedselkwaliteit informatie over het verkoopvolume van gewasbeschermingsmiddelen als bedoeld in artikel 67, derde
      lid, van Verordening (EG) nr. 1107/2009.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel4
  - number: '5.1'
    text: |-
      Het college bestaat uit vijf leden, de voorzitter daaronder begrepen, en ten hoogste vier plaatsvervangende leden.
      De benoeming vindt plaats op grond van deskundigheid op het gebied van de taken waarmee het college is belast.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel5
  - number: '5.2'
    text: De leden wijzen uit hun midden een plaatsvervangend voorzitter aan.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel5
  - number: '5.3'
    text: |-
      De leden en de plaatsvervangend leden worden voor de duur van vier jaren benoemd. Zij zijn ten hoogste twee keer
      herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel5
  - number: '5.4'
    text: |-
      De leden en de plaatsvervangend leden hebben op persoonlijke titel zitting in het college en oefenen hun functie
      uit zonder last of ruggespraak.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel5
  - number: '5.5'
    text: |-
      Zolang in een vacature niet is voorzien, vormen de overblijvende leden het college, met de bevoegdheid van het
      volledig college.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel5
  - number: '5.6'
    text: |-
      Leden en plaatsvervangend leden die zijn benoemd ter vervanging van een tussentijds opengevallen plaats, treden af
      op het tijdstip waarop degene in wiens plaats zij zijn benoemd, zou moeten aftreden.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel5
  - number: '5.7'
    text: |-
      De bezoldiging dan wel schadeloosstelling, bedoeld in
      [artikel 14, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1], voor de leden en plaatsvervangende
      leden van het college komt ten laste van de begroting van het college.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel14
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '14'
  - number: '7.1'
    text: |-
      Het college heeft een secretaris en een secretariaat. Het secretariaat is belast met de ondersteuning van het
      college.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel7
  - number: '7.2'
    text: Na instemming van Onze Minister sluit, wijzigt en beëindigt het college de arbeidsovereenkomst met de secretaris.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel7
  - number: '7.3'
    text: |-
      De secretaris van het college is tevens directeur van het secretariaat. Hij is belast met de dagelijkse leiding
      daarvan.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel7
  - number: '8.1'
    text: 'Het college stelt een bestuursreglement vast, waarin in ieder geval wordt geregeld:'
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel8
  - number: 8.1.a
    text: de werkwijze van het college en de taakverdeling tussen de leden, en
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel8
  - number: 8.1.b
    text: |-
      overige zaken betrekking hebbende op de uitvoering van het bij of krachtens deze wet gestelde, waaronder de nadere
      eisen, bedoeld in [artikel 2:15 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
  - number: '8.2'
    text: |-
      Het college kan bij het reglement zijn vertegenwoordiging in en buiten rechte opdragen aan een of meer leden van
      het college of aan de secretaris. Het kan bepalen dat deze vertegenwoordiging uitsluitend betrekking heeft op
      bepaalde aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel8
  - number: '8.3'
    text: |-
      Het college kan bij het reglement de uitoefening van daarbij aan te wijzen taken en bevoegdheden opdragen aan een
      of meer leden of aan de secretaris.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel8
  - number: '8.6'
    text: |-
      In aanvulling op het eerste lid, onderdeel b, kan het college in een bestuursreglement regels stellen voor
      het bij een schriftelijke aanvraag overleggen van gegevens op een elektronische gegevensdrager en de aanvrager
      daartoe verplichten, voorzover een belanghebbende de gegevens niet langs elektronische weg verzendt als bedoeld in
      [artikel 2:15 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
  - number: '10.1'
    text: |-
      Het college stelt zijn tarieven vast in verband met de uitvoering van de in [artikel 4][ref1] bedoelde wettelijke
      taken. Het tarief omvat een jaarlijkse bijdrage ten laste van de houder van een toelating voor ieder toegelaten
      gewasbeschermingsmiddel dat op 1 februari is opgenomen in het register van het college.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel4
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '4'
        hoofdstuk: '2'
  - number: '10.2'
    text: |-
      De tarieven, bedoeld in het eerste lid, bedragen niet meer dan nodig is ter dekking van de gemaakte kosten in
      verband met de verrichte activiteiten.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel10
  - number: '10.3'
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld over het maximumtarief of de maximale verhoging
      per jaar, alsmede voor gewasbeschermingsmiddelen over een verlaging van het tarief voor bepaalde vormen van
      toelating, bepaalde activiteiten en bepaalde groepen aanvragers van een toelating, overeenkomstig artikel 74,
      tweede lid, van verordening (EG) 1107/2009.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel10
  - number: '10.4'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld met betrekking tot de tarieven bedoeld in artikel 80, tweede
      lid, van verordening (EU) Nr. 528/2012.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel10
  - number: '11'
    text: 'De inkomsten van het college bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel11
  - number: 11.a
    text: |-
      de opbrengsten van de tarieven, bedoeld in [artikel 10][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel10
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '10'
        hoofdstuk: '2'
  - number: 11.b
    text: vergoedingen voor verrichte diensten;
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel11
  - number: 11.c
    text: bijdragen van het Rijk;
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel11
  - number: 11.d
    text: andere baten, hoe ook genoemd.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel11
  - number: '12.1'
    text: |-
      Het college stelt jaarlijks een werkplan voor het eerstvolgende jaar vast. Het werkplan bevat tevens een visie
      op de ontwikkelingen voor de eerstvolgende vier jaren met betrekking tot aard en omvang van de aan het college
      toebedeelde taken en de daaruit voortvloeiende gevolgen voor de organisatie. Het werkplan wordt vóór 1 oktober aan
      Onze Ministers ter kennis gebracht.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel12
  - number: '12.2'
    text: |-
      Indien de goedkeuring wordt onthouden aan de begroting, is het college gerechtigd gedurende ten hoogste zes maanden
      voor iedere maand gedurende welke de goedkeuring wordt onthouden, uitgaven te doen ter grootte van ten hoogste een
      twaalfde deel van de begroting van het voorafgaande jaar waarmee is ingestemd.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel12
  - number: '12.3'
    text: |-
      Onze Minister kan tevens een onderzoek instellen naar de doelmatigheid van het beheer, de organisatie en het beleid
      van het college alsmede naar de doeltreffendheid van de uitvoering en het beleid van het college. Desgevraagd geeft
      het college ten behoeve van dit onderzoek inzage van de boeken en bescheiden en verstrekt het alle inlichtingen die
      voor dit onderzoek nodig geoordeeld worden.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel12
  - number: '12.4'
    text: |-
      Onze Minister kan nadere regels stellen over de inrichting van het werkplan, bedoeld in het eerste lid, alsmede het
      jaarverslag, de begroting en de jaarrekening bedoeld, in [artikel 18][ref1], respectievelijk [artikel 26][ref2],
      respectievelijk [artikel 34 van de Kaderwet zelfstandige bestuursorganen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0020495#Artikel34
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '26'
      - id: ref3
        bwb_id: BWBR0020495
        artikel: '34'
  - number: '13'
    text: |-
      Onze Minister stelt na overleg met het college een informatiestatuut vast. Het informatiestatuut bevat regels met
      betrekking tot de informatievoorziening tussen Onze Ministers en het college.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel13
  - number: '18'
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder: - *basisstof:* werkzame stof als bedoeld
      in artikel 23, eerste lid, van verordening (EG) 1107/2009;
        - *milieu:* hetgeen daaromtrent is bepaald in artikel 3, onderdeel 13, van verordening (EG) 1107/2009;
        - *niet-chemische methoden:* methoden die een alternatief vormen voor het gebruik van gewasbeschermingsmiddelen en
      die berusten op landbouwtechnieken als bedoeld in punt 1 van bijlage III bij richtlijn 2009/128/EG, of fysische,
      mechanische of biologische bestrijdingsmethoden;
        - *op de markt brengen:* hetgeen daaromtrent is bepaald in artikel 3, onderdeel 9, van verordening (EG) 1107/2009;
        - *risico-indicator:* het resultaat van een berekeningsmethode die wordt gebruikt bij de beoordeling van risico’s
      van gewasbeschermingsmiddelen voor de menselijke gezondheid en het milieu;
        - *voorlichter:* persoon die beroepsmatig of in het kader van een commerciële dienst advies verstrekt over de
      bestrijding van schadelijke organismen en het veilig gebruik van gewasbeschermingsmiddelen, in voorkomend geval
      met inbegrip van particuliere en zelfstandige voorlichtingsdiensten, handelsagenten, levensmiddelenproducenten
      en detailhandelaren;
        - *werkzame stof:* hetgeen daaromtrent is bepaald in artikel 2, tweede lid, van verordening (EG) 1107/2009.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel18
  - number: '19'
    text: |-
      Het is verboden een werkzame stof die niet is opgenomen in een toegelaten gewasbeschermingsmiddel te gebruiken,
      tenzij de stof is goedgekeurd als basisstof op grond van artikel 23 van verordening (EG) 1107/2009.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel19
  - number: '20.1'
    text: |-
      Het is verboden in strijd te handelen met de artikelen 28, eerste lid, 52, eerste en vijfde lid, 55, 56, eerste
      lid, 58, eerste lid, en 64, van verordening (EG) 1107/2009 of de ter uitvoering daarvan vastgestelde verordeningen.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel20
  - number: '20.2'
    text: |-
      Het is verboden in strijd te handelen met de artikelen 49, vierde lid, 56, tweede of vierde lid, 65, eerste lid, 66
      en 67 van verordening (EG) 1107/2009 of de ter uitvoering daarvan vastgestelde verordeningen.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel20
  - number: '20.3'
    text: |-
      Het is verboden een niet in Nederland toegelaten gewasbeschermingsmiddel of toevoegingsstof voorhanden of op
      voorraad te hebben.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel20
  - number: '21'
    text: |-
      Het is verboden zaad van een plant, dat met een gewasbeschermingsmiddel is behandeld, op de markt te brengen of te
      gebruiken in Nederland, tenzij aangetoond kan worden dat het zaad is behandeld met een gewasbeschermingsmiddel dat
      als zodanig is toegelaten in een lidstaat van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel21
  - number: '22.1'
    text: |-
      Het is verboden een toegelaten gewasbeschermingsmiddel op de markt te brengen of te gebruiken, indien de wettelijke
      of door het college bij de toelating vastgestelde voorschriften of beperkingen niet of niet op de voorgeschreven
      wijze op, aan of bij de verpakking zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel22
  - number: '22.2'
    text: |-
      Het is verboden een gewasbeschermingsmiddel op de markt te brengen of te gebruiken, indien het gehalte aan
      werkzame stof en de verdere samenstelling waaronder beschermstoffen, synergisten of formuleringshulpstoffen, kleur,
      vorm, afwerking, verpakking, andere aanduidingen of vermeldingen afwijken van de toelating of de desbetreffende
      voorschriften, gesteld bij of krachtens deze wet, verordening (EG) 1107/2009 of een ter uitvoering van die
      verordening vastgestelde verordening.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel22
  - number: '22.3'
    text: |-
      De in [artikel 19][ref1] of [20][ref2] of het eerste en tweede lid bedoelde verboden gelden niet voor zover het
      college een voorziening heeft getroffen voor het kunnen verwijderen, op de markt brengen, opslaan of gebruiken van
      gewasbeschermingsmiddelen als bedoeld in artikel 46 van verordening (EG) 1107/2009.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel20
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '19'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0021670
        artikel: '20'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '28.1'
    text: 'Bij regeling van Onze Minister kunnen ter uitvoering van verordening (EG) 1107/2009 regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel28
  - number: 28.1.a
    text: |-
      de wijze van totstandkoming en de inhoud van een afbouwplan, bedoeld in artikel 4, zevende lid, van verordening
      (EG) 1107/2009;
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel28
  - number: 28.1.b
    text: de erkenning van proeven en analysen, bedoeld in artikel 29, derde lid, van verordening (EG) 1107/2009;
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel28
  - number: 28.1.c
    text: |-
      de specifieke gebruiksomstandigheden in verband met milieu of landbouw en de in verband daarmee te stellen
      nationale risicobeperkende maatregelen, bedoeld in artikel 36, derde lid, van verordening (EG) 1107/2009;
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel28
  - number: 28.1.d
    text: |-
      de vereenvoudiging of stimulering van aanvragen voor toelating in verband met de uitbreiding voor een kleine
      toepassing van een bestaande toelating, bedoeld in artikel 51 van verordening (EG) 1107/2009;
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel28
  - number: 28.1.e
    text: de etikettering van gewasbeschermingsmiddelen, bedoeld in artikel 65 van verordening (EG) 1107/2009.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel28
  - number: '28.2'
    text: |-
      Bij regeling van Onze Minister kunnen ter uitvoering van artikel 81 van verordening (EG) 1107/2009 regels worden
      gesteld over beschermstoffen, synergisten, formuleringshulpstoffen en toevoegingsstoffen. Deze regels kunnen
      betrekking hebben op de kwaliteit of samenstelling van deze stoffen en een verbod op of beperking van het op de
      markt brengen of gebruik inhouden.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel28
  - number: '28.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen, voor zover noodzakelijk voor de uitvoering van artikel
      36, eerste lid, van verordening (EG) 1107/2009, regels worden vastgesteld over de toepassing van de in dat artikel
      bedoelde uniforme beginselen, voor zover voor de toepassing van die beginselen geen beoordelingsmethoden in
      richtsnoeren als bedoeld in artikel 77 van die verordening zijn gesteld. De voordracht voor een krachtens de eerste
      volzin vast te stellen algemene maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan
      beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel28
  - number: '29.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter uitvoering van artikel 13, tweede lid, van richtlijn
      2009/128/EG regels worden gesteld voor de toelating of het gebruik van gewasbeschermingsmiddelen voor niet-
      professioneel gebruik, teneinde gevaarlijke situaties te vermijden. Deze regels kunnen onder meer betrekking hebben
      op:
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel29
  - number: 29.1.a
    text: de mate van toxiciteit van het gewasbeschermingsmiddel;
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel29
  - number: 29.1.b
    text: gebruiksklare formuleringen;
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel29
  - number: 29.1.c
    text: beperkingen aan het formaat van de verpakking.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel29
  - number: '29.2'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld met betrekking tot de aanpassing van het etiket van een
      gewasbeschermingsmiddel nadat de gevaarsclassificatie van een gewasbeschermingsmiddel is gewijzigd, overeenkomstig
      artikel 31, tweede lid, van verordening (EG) 1107/2009.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel29
  - number: '29.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter uitvoering van artikel 31, tweede en vierde
      lid, van verordening (EG) 1107/2009 regels worden gesteld over de door het college bij de toelating te
      stellen voorschriften, waaronder in ieder geval bij gebruik van het gewasbeschermingsmiddel in acht te nemen
      herbetredingstermijnen, voorzorgsmaatregelen en veiligheidsadviezen ter bescherming van de gebruiker of andere
      personen, die tijdens of na het gebruik met het gewasbeschermingsmiddel zelf of een daarmee behandeld product of
      materiaal in aanraking kunnen komen.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel29
  - number: '29.4'
    text: |-
      De voordracht voor een krachtens het derde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel29
  - number: '37.1'
    text: |-
      Op aanvraag kan het college ontheffing verlenen van de verboden, bedoeld in de [artikelen 19][ref1],
      [20, eerste lid][ref2], en [22, eerste en tweede lid][ref3], in verband met het gebruik van een
      gewasbeschermingsmiddel in een proef of experiment voor onderzoek of ontwikkelingsdoeleinden als bedoeld in artikel
      54 van verordening (EG) 1107/2009.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0021670#Artikel22
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '19'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0021670
        artikel: '20'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0021670
        artikel: '22'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '37.2'
    text: |-
      Onze Minister kan op aanvraag een bedrijf of instelling waar proeven of experimenten worden uitgevoerd, erkennen.
      Op erkende bedrijven en instellingen zijn de [artikelen 19][ref1], [20, eerste lid][ref2], met betrekking tot de
      daarin genoemde artikelen 28, eerste lid, en 55 van verordening (EG) 1107/2009, en 22, eerste en tweede lid, niet
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel20
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '19'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0021670
        artikel: '20'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '37.3'
    text: Aan een ontheffing of erkenning kunnen voorschriften en beperkingen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel37
  - number: '37.4'
    text: |-
      Bij regeling van Onze Minister kunnen ter uitvoering van artikel 54 van verordening (EG) 1107/2009 regels
      worden gesteld over de voorwaarden voor de verlening van een ontheffing of erkenning, bedoeld in het eerste
      respectievelijk tweede lid.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel37
  - number: '37.5'
    text: |-
      Bij de regeling bedoeld in het vierde lid kan tevens worden bepaald dat een aanvraag eerst in behandeling wordt
      genomen nadat een daarvoor vastgesteld bedrag is voldaan en dat alvorens een ontheffing of erkenning kan worden
      verleend een onderzoek ter plaatse noodzakelijk is, waarvan de kosten ten laste van de begunstigde worden gebracht.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel37
  - number: '38.1'
    text: |-
      Onze Minister kan ambtshalve of op aanvraag vrijstelling verlenen van de verboden, bedoeld in de
      [artikelen 19][ref1], [20][ref2] en [22][ref3], voor het gebruik van een gewasbeschermingsmiddel overeenkomstig
      artikel 53 van verordening (EG) 1107/2009.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0021670#Artikel22
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '19'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0021670
        artikel: '20'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0021670
        artikel: '22'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '38.2'
    text: |-
      Een vrijstelling wordt in ieder geval verleend ter uitvoering van een communautaire maatregel, die is gericht op
      een te bestrijden gevaar.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel38
  - number: '38.3'
    text: Aan een vrijstelling kunnen voorschriften en beperkingen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel38
  - number: '38.4'
    text: |-
      Indien een onverwijlde voorziening noodzakelijk is, kan Onze Minister bepalen dat de vrijstelling onmiddellijk
      na haar bekendmaking in werking treedt. In dat geval kan het vrijstellingsbesluit op andere dan de in
      [artikel 3:42 van de Algemene wet bestuursrecht][ref1] bedoelde wijze worden bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '38.5'
    text: |-
      Bij regeling van Onze Minister kan worden bepaald dat een aanvraag eerst in behandeling wordt genomen nadat een
      daarvoor vastgesteld bedrag is voldaan. Tevens kunnen regels worden gesteld omtrent de te volgen procedure en
      minimumvoorwaarden voor vrijstelling.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel38
  - number: '39'
    text: |-
      Het college kan ter uitvoering van artikel 71, eerste lid, van verordening (EG) 1107/2009 het op de markt brengen
      of het gebruik van een toegelaten gewasbeschermingsmiddel, met inbegrip van met een gewasbeschermingsmiddel
      behandeld zaaizaad, of een goedgekeurde werkzame stof, beschermstof, synergist of formuleringshulpstof tijdelijk
      beperken of verbieden, indien er duidelijke aanwijzingen bestaan dat het gewasbeschermingsmiddel, het met een
      gewasbeschermingsmiddel behandelde zaaizaad of de stof een ernstig risico inhoudt voor de gezondheid van mens en
      dier of voor het milieu.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel39
  - number: '40'
    text: |-
      Een besluit tot toelating of vrijstelling van een gewasbeschermingsmiddel, alsmede een tijdelijke beperking van of
      verbod op het op de markt brengen of gebruik van een toegelaten gewasbeschermingsmiddel, wordt in de Staatscourant
      bekendgemaakt en medegedeeld aan de aanvrager.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel40
  - number: '41'
    text: |-
      Dit hoofdstuk en de daarop berustende bepalingen zijn mede van toepassing op biociden en behandelde voorwerpen
      binnen de exclusieve economische zone.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel41
  - number: '42'
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder: - *op de markt aanbieden:* de levering
      van een biocide of een behandeld voorwerp voor distributie of gebruik in het kader van een handelsactiviteit, al
      dan niet tegen betaling als bedoeld in artikel 3, eerste lid, onder i, van verordening (EU) Nr. 528/2012;
        - *toelating:* toelating als bedoeld in artikel 3, eerste lid, onder o, van verordening (EU) Nr. 528/2012.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel42
  - number: '43.1'
    text: |-
      Het is verboden in strijd te handelen met de artikelen 17, eerste, vijfde en zesde lid, artikel 27, eerste lid,
      47, eerste lid, 56, 58, eerste tot en met het zesde lid, 62, 68, eerste lid, 69, eerste en tweede lid, 72, eerste
      en derde lid en 95, tweede lid, van verordening (EU) Nr. 528/2012 of de ter uitvoering daarvan vastgestelde
      verordeningen.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel43
  - number: '43.2'
    text: |-
      Het eerste lid is niet van toepassing indien het handelen, bedoeld in het eerste lid overeenkomstig verordening
      (EU) Nr. 528/2012 is toegestaan.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel43
  - number: '43.3'
    text: Het is verboden biociden zonder toelating voorhanden of op voorraad te hebben.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel43
  - number: '43.4'
    text: |-
      Het is verboden in strijd te handelen met een passende voorlopige maatregel, bedoeld in artikel 88 van verordening
      (EU) Nr. 528/2012.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel43
  - number: '44'
    text: |-
      De in [artikel 43][ref1] bedoelde verboden gelden niet in de respijtperiode bedoeld in artikel 52 van verordening
      (EU) Nr. 528/2012.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel43
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '43'
        hoofdstuk: '5'
  - number: '45'
    text: 'Bij regeling van Onze Minister kunnen ter uitvoering van verordening (EU) Nr. 528/2012 regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel45
  - number: 45.a
    text: |-
      vrijstellingen van verordening (EU) Nr. 528/2012 met betrekking tot bepaalde biociden vanwege belangen op het
      gebied van defensie, bedoeld in artikel 2, achtste lid, van verordening (EU) Nr. 528/2012;
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel45
  - number: 45.b
    text: de etikettering van biociden, bedoeld in artikel 69, derde lid, onder b, van verordening (EU) Nr. 528/2012.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel45
  - number: '46.1'
    text: |-
      Onze Minister kan ter uitvoering van artikel 55 van verordening (EU) Nr. 528/2012 ambtshalve of op aanvraag
      vrijstelling verlenen van het verbod, bedoeld in [artikel 43, eerste lid][ref1], om te handelen in strijd met
      artikel 17, eerste lid, van verordening (EU) Nr. 528/2012 en van de voorwaarden van artikel 19 van verordening (EU)
      Nr. 528/2012 inzake het verlenen van een toelating voor een biocide.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel43
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '43'
        hoofdstuk: '5'
  - number: '46.2'
    text: |-
      Indien een onverwijlde voorziening noodzakelijk is, kan Onze Minister bepalen dat de vrijstelling onmiddellijk
      na haar bekendmaking in werking treedt. In dat geval kan het vrijstellingsbesluit op andere dan de in
      [artikel 3:42 van de Algemene wet bestuursrecht][ref1] bedoelde wijze worden bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '46.3'
    text: |-
      Bij regeling van Onze Minister kan worden bepaald dat een aanvraag eerst in behandeling wordt genomen nadat een bij
      die regeling vastgesteld bedrag is voldaan op een daarbij te bepalen wijze. Bij regeling van Onze Minister kunnen
      tevens regels worden gesteld omtrent de te volgen procedure en de minimumvoorwaarden voor vrijstelling.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel46
  - number: '47'
    text: Het college is belast met de uitvoering van artikel 27 van verordening (EU) Nr. 528/2012.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel47
  - number: '48'
    text: Het college is belast met de uitvoering van artikel 88 van verordening (EU) Nr. 528/2012.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel48
  - number: '49'
    text: |-
      Een besluit omtrent toelating of vrijstelling van een biocide van Onze Minister of het college, wordt in de
      Staatscourant bekendgemaakt en medegedeeld aan de aanvrager en de houder van de toelating.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel49
  - number: '71.1'
    text: |-
      Het is verboden zonder een geldig bewijs van vakbekwaamheid op te treden als voorlichter als bedoeld in
      [artikel 18][ref1] of een gewasbeschermingsmiddel, toegelaten voor professioneel gebruik, te ontvangen, te
      gebruiken of voorhanden te hebben, behoudens in bij regeling van Onze Minister te bepalen gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel18
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '18'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '71.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden ter uitvoering van artikel 5 van richtlijn 2009/128/EG
      regels gesteld over:
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel71
  - number: 71.2.a
    text: de eisen en procedures voor het verkrijgen van een bewijs van vakbekwaamheid;
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel71
  - number: 71.2.b
    text: de geldigheidsduur van een bewijs van vakbekwaamheid,
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel71
  - number: 71.2.c
    text: |-
      de eisen en procedures voor het intrekken van een bewijs van vakbekwaamheid, bedoeld in [artikel 85][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel85
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '85'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 71.2.d
    text: het vernieuwen van een bewijs van vakbekwaamheid.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel71
  - number: '71.3'
    text: 'Bij regeling van Onze Minister worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel71
  - number: 71.3.a
    text: de instanties die een bewijs van vakbekwaamheid kunnen verlenen of intrekken,
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel71
  - number: 71.3.b
    text: |-
      het tarief dat in rekening wordt gebracht voor het verkrijgen of wederom verkrijgen van een bewijs van
      vakbekwaamheid,
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel71
  - number: 71.3.c
    text: overige eisen en procedures in verband met de implementatie van artikel 5 van richtlijn 2009/128/EG.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel71
  - number: '71.4'
    text: |-
      Het eerste, tweede en derde lid zijn van overeenkomstige toepassing op biociden, toegelaten voor professioneel
      gebruik, in de bij of krachtens algemene maatregel van bestuur te bepalen gevallen.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel71
  - number: '72.1'
    text: Het is verboden een niet toegelaten biocide aan te bevelen of aan te prijzen.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel72
  - number: '72.2'
    text: |-
      Het is verboden het gebruik van een biocide aan te bevelen of aan te prijzen in strijd met de voor dat gebruik
      geldende voorschriften.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel72
  - number: '73.1'
    text: |-
      Een distributeur brengt een gewasbeschermingsmiddel, niet zijnde een gewasbeschermingsmiddel toegelaten voor
      niet-professioneel gebruik, uitsluitend op de markt voor een klant die over een geldig bewijs van vakbekwaamheid
      beschikt.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel73
  - number: '73.2'
    text: |-
      Een distributeur zorgt ervoor dat hij of voldoende van zijn personeel over een bewijs van vakbekwaamheid beschikt,
      alsmede dat hij of dat personeel op het tijdstip van verkoop beschikbaar is voor klanten, in verband met de
      voorlichtende taak, bedoeld in het derde lid. Deze verplichting is niet van toepassing op gewasbeschermingsmiddelen
      die zijn toegelaten voor niet-professioneel gebruik.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel73
  - number: '73.3'
    text: 'Een distributeur of zijn personeel geeft voorlichting aan klanten over:'
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel73
  - number: 73.3.a
    text: het juiste gebruik van een gewasbeschermingsmiddel;
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel73
  - number: 73.3.b
    text: de risico’s van dat gebruik voor de gezondheid en voor het milieu; en
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel73
  - number: 73.3.c
    text: de geldende veiligheidsinstructies voor het gewasbeschermingsmiddel.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel73
  - number: '73.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de verstrekking van algemene
      informatie door distributeurs of producenten aan niet-professionele gebruikers over de risico's van het
      gebruik van gewasbeschermingsmiddelen of biociden voor de gezondheid van mens en dier of voor het milieu.
      De informatieverplichting omvat ten minste blootstelling, een veilige opslag, een veilig gebruik en veilige
      verwijdering van restanten volgens de geldende regels, alsmede informatie over alternatieve bestrijdingsmethoden
      die minder risico opleveren.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel73
  - number: '73.5'
    text: |-
      Het eerste, tweede en derde lid zijn van overeenkomstige toepassing op een distributeur van biociden in de bij of
      krachtens algemene maatregel van bestuur te bepalen gevallen.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel73
  - number: '74.1'
    text: |-
      Het binnen Nederland brengen, de productie, de opslag en het vervoer van niet-toegelaten biociden zijn in afwijking
      van [artikel 43][ref1] toegestaan, indien aangetoond kan worden dat de biociden zijn bestemd voor gebruik in een
      andere lidstaat van de Europese Unie waar de biociden wel zijn toegelaten, of voor gebruik in een derde land en
      aldaar niet verboden zijn, en is voldaan aan bij regeling van Onze Minister gestelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel43
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '43'
        hoofdstuk: '5'
  - number: '74.2'
    text: |-
      De productie, de opslag en het vervoer van niet-toegelaten gewasbeschermingsmiddelen zijn in afwijking van
      [artikel 20][ref1] toegestaan, indien aangetoond kan worden dat de gewasbeschermingsmiddelen zijn bestemd voor
      gebruik in een andere lidstaat van de Europese Unie en het bewuste gewasbeschermingsmiddel daar is toegelaten, of
      voor gebruik in een derde land, en is voldaan aan bij regeling van Onze Minister gestelde voorschriften in verband
      met het kunnen controleren dat het bewuste middel niet op het Nederlandse grondgebied wordt gebruikt dan wel
      daadwerkelijk wordt uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel20
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '20'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '74.3'
    text: 'De voorschriften bedoeld in het eerste en het tweede lid hebben betrekking op:'
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel74
  - number: 74.3.a
    text: |-
      de bescheiden waarmee kan worden aangetoond dat het gewasbeschermingsmiddel of de biocide is bestemd voor een
      andere lidstaat of een derde land;
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel74
  - number: 74.3.b
    text: |-
      eisen met betrekking tot de verpakking, de etikettering, de opslag, het vervoer en de administratie van de bewuste
      partij gewasbeschermingsmiddelen of biociden; en
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel74
  - number: 74.3.c
    text: |-
      andere eisen voor zover nodig voor een goede uitvoering van artikel 28, tweede lid, onderdelen c en d, van
      verordening (EG) 1107/2009.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel74
  - number: '75.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor het op de markt brengen of gebruiken van
      gewasbeschermingsmiddelen of biociden nadere regels worden gesteld over onder meer:
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel75
  - number: 75.1.a
    text: het aanbevelen of aanprijzen van gewasbeschermingsmiddelen of biociden;
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel75
  - number: 75.1.b
    text: de administratie van biociden en gewasbeschermingsmiddelen;
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel75
  - number: 75.1.c
    text: het vervoer en de opslag van gewasbeschermingsmiddelen of biociden;
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel75
  - number: 75.1.d
    text: de wijze van afleveren van gewasbeschermingsmiddelen of biociden.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel75
  - number: '75.2'
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel75
  - number: '77'
    text: |-
      De klant, bedoeld in [artikel 73][ref1], legitimeert zich op verzoek van de distributeur of zijn personeel met een
      document als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '73'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '78.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over juist gebruik van biociden of
      geïntegreerde gewasbescherming overeenkomstig artikel 14 van richtlijn 2009/128/EG en artikel 55 van verordening
      (EG) 1107/2009.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel78
  - number: '78.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de wijze waarop het gebruik van
      biociden wordt geadministreerd.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel78
  - number: '79'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de uitvoering van goede
      praktijken bij het toepassen van gewasbeschermingsmiddelen of biociden.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel79
  - number: '80.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de productie, het op de
      markt brengen of het gebruik van voertuigen, vaartuigen, luchtvaartuigen, apparatuur voor de toepassing van
      gewasbeschermingsmiddelen of andere methoden, technieken en materialen, zowel in de open lucht als in besloten
      ruimten. Deze regels kunnen een verbod of beperking van het gebruik inhouden.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel80
  - number: '80.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter uitvoering van artikel 8 van richtlijn 2009/128/
      EG regels worden gesteld over een keuring van in gebruik zijnde apparatuur voor de toepassing van
      gewasbeschermingsmiddelen. Deze regels omvatten de keuringsfrequentie, de keuringseisen, de keuringsinstanties,
      het in rekening te brengen tarief voor de keuring en de mogelijkheid van vrijstelling voor aan te wijzen types
      apparatuur.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel80
  - number: '80.3'
    text: |-
      De voordracht voor een krachtens dit artikel vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel80
  - number: 80a
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over het gebruik van
      gewasbeschermingsmiddelen of biociden in specifieke gebieden als bedoeld in artikel 12 van richtlijn 2009/128/EG.
      Deze regels kunnen een verbod inhouden dan wel zijn gericht op een vermindering van het gebruik van alle of een
      bepaald type gewasbeschermingsmiddelen of biociden in bij die maatregel aangewezen gebieden.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel80a
  - number: '81.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat de toepassing van een
      gewasbeschermingsmiddel of biocide of een gebruik als bedoeld in [artikel 80, eerste lid][ref1], alleen is
      toegestaan na ontheffing, vergunning of vrijstelling door Onze Minister of nadat van vorenbedoelde toepassing of
      gebruik melding is gedaan aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel80
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '80'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '81.2'
    text: Aan vergunningen kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel81
  - number: '81.3'
    text: Vergunningen kunnen onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel81
  - number: '81.4'
    text: |-
      Het bepaalde in het tweede en derde lid is van overeenkomstige toepassing op ontheffingen, vrijstellingen of
      meldingen als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel81
  - number: 81a.1
    text: Onze Ministers stellen een nationaal actieplan op ter uitvoering van artikel 4 van richtlijn 2009/128/EG.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel81a
  - number: 81a.2
    text: Het plan wordt ten minste iedere vijf jaren herzien.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel81a
  - number: 81a.3
    text: |-
      Op de voorbereiding en wijziging van een nationaal actieplan is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel81a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 81b
    text: |-
      Onze Minister wordt aangewezen als bevoegde autoriteit als bedoeld in artikel 3, derde lid, van verordening (EU)
      2017/625 voor zover het betreft het gebied, genoemd in artikel 1, tweede lid, onderdeel h, van verordening (EU)
      2017/625.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel81b
  - number: '82.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet of onderdelen daarvan zijn belast de bij
      besluit van Onze Ministers aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel82
  - number: '82.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel82
  - number: '82.3'
    text: Onze Minister regelt de taakverdeling tussen de krachtens het eerste lid aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel82
  - number: '82.4'
    text: |-
      De door Onze Minister aangewezen ambtenaren, bedoeld in het eerste lid, verstrekken elkaar ter uitvoering van hun
      taak uit eigen beweging of desgevraagd onderling de voor de uitvoering van hun taak noodzakelijke gegevens.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel82
  - number: '83'
    text: |-
      Bij regeling van Onze Ministers kunnen regels worden gesteld over de wijze van monsterneming, het verpakken en het
      verzegelen van monsters.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel83
  - number: '84'
    text: |-
      Een toezichthouder is bevoegd met medeneming van de benodigde apparatuur een woning binnen te treden zonder
      toestemming van de bewoner.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel84
  - number: 84a.1
    text: Distributeurs en gebruikers zijn een retributie verschuldigd voor herinspectie.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel84a
  - number: 84a.2
    text: Bij algemene maatregel van bestuur kunnen regels worden gesteld over de retributie.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel84a
  - number: 84a.3
    text: Het tarief van de retributie wordt bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel84a
  - number: 84a.4
    text: Onze Minister kan de verschuldigde bedragen, verhoogd met de invorderingskosten, invorderen bij dwangbevel.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel84a
  - number: 84a.5
    text: |-
      De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel84a
  - number: 84a.6
    text: |-
      Een krachtens het derde lid vast te stellen ministeriële regeling wordt aan de beide kamers der Staten-Generaal
      overgelegd. De ministeriële regeling wordt niet eerder vastgesteld dan vier weken na de overlegging.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel84a
  - number: '85.1'
    text: |-
      Een bewijs van vakbekwaamheid ten behoeve van het verrichten van handelingen ten aanzien van
      gewasbeschermingsmiddelen of biociden, wordt ingetrokken indien niet langer wordt voldaan aan de eisen die ter zake
      van het verkrijgen of behouden van een zodanig bewijs van vakbekwaamheid bij of krachtens deze wet is gesteld.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel85
  - number: '85.2'
    text: |-
      Een bewijs van vakbekwaamheid wordt niet eerder ingetrokken dan nadat gedurende een redelijke termijn gelegenheid
      is gegeven alsnog aan de in het eerste lid bedoelde eisen te voldoen.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel85
  - number: '85.3'
    text: |-
      Een bewijs van vakbekwaamheid kan tevens worden ingetrokken indien degene aan wie een bewijs van vakbekwaamheid is
      verleend, dan wel een persoon voor wie diegene verantwoordelijk is of geacht wordt verantwoordelijk te zijn, heeft
      gehandeld in strijd met bij of krachtens deze wet gestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel85
  - number: '85.4'
    text: |-
      Bij een intrekking als bedoeld in het derde lid kan het bestuursorgaan bepalen dat degene tot wie het bewijs van
      vakbekwaamheid was gericht gedurende een door dat bestuursorgaan te bepalen termijn niet in aanmerking komt voor
      een zelfde bewijs van vakbekwaamheid.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel85
  - number: '85.5'
    text: |-
      Het eerste tot en met het vierde lid zijn van overeenkomstige toepassing met betrekking tot een vergunning,
      ontheffing of erkenning die ingevolge deze wet wordt verleend.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel85
  - number: '86'
    text: |-
      Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van de bij of krachtens deze
      wet gestelde regels.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel86
  - number: '87.1'
    text: |-
      De ingevolge [artikel 82][ref1] aangewezen ambtenaren zijn, indien naar hun redelijk oordeel ernstig gevaar voor
      personen, planten, dieren of het milieu bestaat, bevoegd mondeling of bij gedagtekend schrijven te bevelen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel82
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '82'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 87.1.a
    text: |-
      door hen aan te wijzen werkzaamheden met betrekking tot gewasbeschermingsmiddelen of biociden of met betrekking tot
      met die middelen behandelde gebouwen, plaatsen of voorwerpen worden gestaakt dan wel niet worden aangevangen en
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel87
  - number: 87.1.b
    text: in of op door hen aan te wijzen plaatsen geen personen mogen verblijven.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel87
  - number: '87.2'
    text: |-
      Een mondeling bevel wordt zo snel mogelijk schriftelijk bevestigd aan degene die verantwoordelijk is voor de
      aangewezen werkzaamheden of voor de gang van zaken in of op de aangewezen plaats.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel87
  - number: '87.3'
    text: |-
      Degene tot wie een bevel als bedoeld in het eerste lid is gericht, is verplicht de inhoud van dat bevel ter kennis
      te brengen van een ieder wie het bevel aangaat.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel87
  - number: '87.4'
    text: |-
      Zodra naar het oordeel van de ambtenaar die een bevel als bedoeld in het eerste lid heeft gegeven, geen ernstig
      gevaar meer aanwezig is, trekt deze het bevel in.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel87
  - number: '87.5'
    text: |-
      Degene die een bevel als bedoeld in het eerste lid heeft gegeven, is bevoegd met betrekking tot dat bevel de nodige
      maatregelen te treffen, met inbegrip van oplegging van een last onder bestuursdwang, de nodige aanwijzingen te
      geven en zo nodig de hulp van de sterke arm in te roepen.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel87
  - number: '87.6'
    text: |-
      Ieder wie het aangaat is verplicht zich te gedragen overeenkomstig een krachtens dit artikel gegeven bevel of
      aanwijzing.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel87
  - number: 87a
    text: |-
      Onze Minister is bevoegd ter handhaving van de bij of krachtens deze wet gestelde regels maatregelen te treffen als
      bedoeld in artikel 138, tweede lid, onderdelen d en g, van verordening (EU) 2017/625.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel87a
  - number: '88.1'
    text: |-
      Een overheidslichaam kan – behoudens matiging door de rechter – de te zijnen laste komende kosten van beheer,
      verwijdering, of vernietiging van gewasbeschermingsmiddelen of biociden, ten aanzien waarvan in strijd is gehandeld
      met het bij of krachtens deze wet bepaalde, verhalen op degene door wiens onrechtmatige daad die kosten zijn
      veroorzaakt, of op degene die anderszins krachtens burgerlijk recht buiten overeenkomst aansprakelijk is voor de
      gevolgen daarvan.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel88
  - number: '88.2'
    text: |-
      Een overheidslichaam kan in een geval als bedoeld in het eerste lid, overeenkomstig de regels betreffende
      ongerechtvaardigde verrijking, de daar bedoelde kosten verhalen op degene die door het beheer van de betrokken
      gewasbeschermingsmiddelen of biociden ongerechtvaardigd wordt verrijkt.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel88
  - number: '88.3'
    text: |-
      Voor de toepassing van dit artikel is niet vereist dat op het tijdstip waarop de in het eerste lid bedoelde
      handeling met de in dat lid bedoelde gewasbeschermingsmiddelen en biociden zich heeft voorgedaan, reeds jegens de
      overheid onrechtmatig werd gehandeld.
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel88
  - number: '90'
    text: |-
      Onze Minister kan een bestuurlijke boete opleggen in geval van overtreding van het bepaalde bij of krachtens
      [artikel 2a][ref1], [19][ref2], [20][ref3], [21][ref4], [22][ref5], [28][ref6], [29][ref7], [37, derde lid][ref8],
      [38, derde lid][ref9], [39][ref10], [43][ref11], [71 tot en met 81][ref12], [87, zesde lid][ref13], [115][ref14]
      of [118][ref15].


