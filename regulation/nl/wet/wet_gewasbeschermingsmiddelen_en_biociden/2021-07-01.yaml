  - number: 129.5.a
    text: de toelating intrekt of wijzigt op grond van deze wet, of
    url: https://wetten.overheid.nl/BWBR0021670/2021-07-01#Artikel129
  - number: 129.5.b
    text: |-
      het middel toelaat op grond van [artikel 35][ref1] of [55][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0021670#Artikel55
