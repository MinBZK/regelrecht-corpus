  - number: '129.5'
    text: |-
      Gewasbeschermingsmiddelen of biociden die op grond van
      [artikel 1, derde lid, van de Bestrijdingsmiddelenwet 1962][ref1] zijn uitgezonderd van de toepassing van
      [die wet][ref2], zijn bij de inwerkingtreding van deze wet van rechtswege toegelaten, tot het moment waarop het
      college:


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002380
