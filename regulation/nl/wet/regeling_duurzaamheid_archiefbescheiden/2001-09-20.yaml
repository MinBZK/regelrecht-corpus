preamble:
  text: |-
    Gelet op artikel 11, tweede lid, van het Archiefbesluit 1995,

    Besluit:
  url: https://wetten.overheid.nl/BWBR0012804/2001-09-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

      a. archiefbescheiden: archiefbescheiden als bedoeld in [artikel 11, eerste lid, van het Archiefbesluit 1995][ref1];

      b. NEN: een door de Stichting Nederlands Normalisatie-Instituut uitgegeven norm;

      c. ICN-kwaliteitseis: een door het Instituut Collectie Nederland uitgegeven kwaliteitseis;

      d. ISO: een door de International Organization for Standardization uitgegeven norm;

      e. DIN: een door het Deutsches Institut für Normung uitgegeven norm;

      f. ANSI: een door het American National Standards Institute uitgegeven norm.

      2 Met de in deze regeling genoemde technische producteisen worden gelijkgesteld technische producteisen die worden
      gesteld in een andere lidstaat van de Europese Unie dan wel in een staat die partij is bij de overeenkomst inzake
      de Europese Economische Ruimte, en die ten minste een gelijkwaardige productkwaliteit waarborgen, mits daarbij een
      geldig rapport wordt overgelegd, waaruit blijkt dat de producten aan die eisen voldoen en dat rapport is opgemaakt
      door een beproevingslaboratorium dat voldoet aan NEN-EN-ISO/IEC 17025.


      [ref1]: https://wetten.overheid.nl/BWBR0007748#Artikel11
    url: https://wetten.overheid.nl/BWBR0012804/2001-09-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007748
        artikel: '11'
  - number: '2'
    text: |-
      1 Indien de zorgdrager voor het opmaken en bewaren van archiefbescheiden materialen gebruikt als bedoeld in
      de [artikelen 3 tot en met 7][ref1] voldoen die materialen aan de normen en eisen, die in die artikelen worden
      gesteld.

      2 De zorgdrager verlangt van de leverancier van de in het eerste lid bedoelde materialen bewijsstukken, waaruit
      blijkt dat de te leveren materialen voldoen aan de eisen die daaraan in deze regeling zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0012804#Artikel3
    url: https://wetten.overheid.nl/BWBR0012804/2001-09-20#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0012804
        artikel: '3'
  - number: '3'
    text: |-
      1 Papier voldoet aan NEN 2728.

      2 Inkten en toners voldoen aan ISO 11798.

      3 In afwijking van het tweede lid voldoen balpennen en balpeninkten aan DIN 16554.2 of ISO 12757-2 en
      rollerbalpennen en rollerbalpeninkten aan ISO 14145-2.

      4 Schrijfmachine- en printerlinten bevatten als kleurstof koolstof of gelijkwaardige materialen.

      5 Indien het papier of de schrijfstoffen van archiefbescheiden chemische of fysische reacties kunnen aangaan met
      andere materialen wanneer zij met die materialen in dezelfde verpakkingseenheid zouden worden opgeborgen, worden
      die andere materialen binnen of buiten de verpakkingseenheid afzonderlijk verpakt.
    url: https://wetten.overheid.nl/BWBR0012804/2001-09-20#Artikel3
  - number: '4'
    text: |-
      1 Omslagen, mappen en hechtmechanieken voor papier voldoen aan ICN-kwaliteitseisen nummers 1, 2 en 12.

      2 Archiefdozen voor standaardformaten papier voldoen aan ICN-kwaliteitseisen nummer 4 of 13, indien omslagen
      volgens ICN-kwaliteitseisen nummer 1 of 2 worden toegepast.

      3 Archiefdozen voor standaardformaten papier voldoen aan ICN-kwaliteitseis nummer 3, indien de archiefbescheiden in
      onmiddellijk contact komen met het karton.

      4 Karton voor archiefdozen van andere dan standaardformaten voldoet aan ICN-kwaliteitseisen nummer 10 of16, indien
      omslagen volgens ICN-kwaliteitseisen nummer 1 of 2 worden toegepast.

      5 Karton voor archiefdozen van andere dan standaardformaten voldoet aan ICN-kwaliteitseis nummer 11, indien de
      archiefbescheiden in onmiddellijk contact komen met het karton.

      6 Etiketten voldoen aan ICN-kwaliteitseis nummer 15.
    url: https://wetten.overheid.nl/BWBR0012804/2001-09-20#Artikel4
  - number: '5'
    text: |-
      1 Microfilm voor archiefbescheiden is een polyester (polyethyleentereftalaat) halogeenzilverfilm, negatief
      ontwikkeld, die voldoet aan NEN 3528. Deze film wordt aangeduid als de moederfilm.

      2 De kwaliteit van de opname van de moederfilm is overeenkomstig Quality Index 10 van ISO 6199, Annex C.

      3 Van de moederfilm wordt een kopie vervaardigd, die een kwaliteit heeft van ten hoogste 1 target minder volgens
      ISO 6199 ten opzichte van de moederfilm. Deze film wordt aangeduid als de duplicaatfilm. Bij het kopieerproces
      vindt geen wisseling van polariteit plaats. Voor het overige is de kwaliteit van de duplicaatfilm gelijk aan die
      van de moederfilm.

      4 Moederfilms en duplicaatfims worden beheerd en bewaard als archiefbescheiden.

      5 De afwerking van de moederfilm en de duplicaatfilm voldoet aan NEN 2154.

      6 De verpakking van de moederfilm en de duplicaatfilm bevat geen lignine en polyvinylchloride en voldoet aan ANSI
      IT 9.2, ongeacht het formaat van de films.

      7 De moederfilm en de duplicaatfilm worden niet ter inzage gegeven.

      8 Gebruikskopieën worden gemaakt van de duplicaatfilm.
    url: https://wetten.overheid.nl/BWBR0012804/2001-09-20#Artikel5
  - number: '6'
    text: |-
      1 Zwart-wit films voldoen aan ISO 10602 of ANSI IT 9.1 en aan ANSI PH 1.41.

      2 De afwerking van zwart-wit films en zwart-wit papier voldoet aan NEN 2148 of ANSI PH 4.8.

      3 De verpakking van zwart-wit films en zwart-wit papier bevat geen lignine en polyvinylchloride en voldoet aan ANSI
      IT 9.2.
    url: https://wetten.overheid.nl/BWBR0012804/2001-09-20#Artikel6
  - number: '7'
    text: |-
      1 Optische schijven voldoen aan ISO 9660 en ISO 10149.

      2 De verpakking van optische schijven bevat geen polyvinylchloride, is stofvrij en bestaat uit harde kunststof,
      waaruit geen stoffen kunnen vrijkomen die reacties kunnen aangaan met de verpakte optische schijven.
    url: https://wetten.overheid.nl/BWBR0012804/2001-09-20#Artikel7
  - number: '8'
    text: |-
      Archiefbescheiden op optische schijven of elektromagnetische dragers worden overgezet op of in nieuwe dragers,
      zodra het gevaar dreigt dat de informatie verloren gaat dan wel onleesbaar of niet waarneembaar wordt als gevolg
      van:

      a. natuurlijke of door de verpakking veroorzaakte veroudering van de gebruikte materialen, of;

      b. het in onbruik raken van apparatuur of programmatuur, die benodigd is om de informatie leesbaar of waarneembaar
      te maken.
    url: https://wetten.overheid.nl/BWBR0012804/2001-09-20#Artikel8
  - number: '9'
    text: |-
      Het gebruik van andere categorieën materialen dan omschreven in de [artikelen 3 tot en met 7][ref1] is toegestaan,
      indien :

      a. deze andere materialen voldoen aan [artikel 11, eerste lid, van het Archiefbesluit 1995][ref2] in verband met de
      eigenschappen van die materialen of als gevolg van regelmatige conserverende handelingen;

      b. de archiefbescheiden, opgemaakt door middel van deze andere materialen tijdig worden vervangen door
      reproducties.


      [ref1]: https://wetten.overheid.nl/BWBR0012804#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007748#Artikel11
    url: https://wetten.overheid.nl/BWBR0012804/2001-09-20#Artikel9
