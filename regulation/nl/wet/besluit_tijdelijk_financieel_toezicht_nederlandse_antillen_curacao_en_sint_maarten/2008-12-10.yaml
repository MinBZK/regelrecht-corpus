  - number: '2'
    text: |-
      1 Er is een College financieel toezicht.

      2 Het college bestaat uit zes leden, waaronder een voorzitter.

      3 De voorzitter en de andere leden worden op grond van deskundigheid benoemd. Over de benoeming beslist de raad van
      ministers van het Koninkrijk volgens de volgende procedure:

      a. de voorzitter op aanbeveling van Onze Minister-President, in zijn hoedanigheid van voorzitter van de raad van
      ministers van het Koninkrijk;

      b. een lid in overeenstemming met het gevoelen van de Raad van ministers van het Land op aanbeveling van Onze
      Minister-President van het Land;

      c. een lid in overeenstemming met het gevoelen en op aanbeveling van het bestuurscollege van Curaçao;

      d. een lid in overeenstemming met het gevoelen en op aanbeveling van het bestuurscollege van Sint Maarten, en

      e. twee leden in overeenstemming met het gevoelen van de Nederlandse ministerraad van wie één namens Bonaire, Sint
      Eustatius en Saba gezamenlijk en één namens Nederland.

      4 De benoeming geschiedt bij koninklijk besluit op voordracht van Onze Minister.

      5 De leden van het college oefenen hun functie uit zonder last of ruggespraak.

      6 De leden worden benoemd voor de periode gedurende welke dit besluit van kracht is.

      7 Een lid wordt op eigen verzoek ontslagen.

      8 Een lid kan worden geschorst of ontslagen wegens ongeschiktheid voor de vervulde functie, dan wel wegens andere
      zwaarwegende in zijn persoon gelegen redenen, dan wel wegens het aanvaarden van een ambt, betrekking of functie als
      bedoeld in [artikel 3, eerste of tweede lid][ref1].

      9 De raad van ministers van het Koninkrijk beslist over schorsing en ontslag. Schorsing en ontslag geschiedt
      bij koninklijk besluit op voordracht van Onze Minister. Over ontslag wordt het aanbevelende bestuur vooraf
      geconsulteerd.

      10 Voorafgaande aan een ontslag of een schorsing als bedoeld in het achtste lid, wordt het college gehoord, tenzij
      de omstandigheden met betrekking tot het ontslag of de schorsing dat belemmeren.

      11 Onze Minister stelt na overleg met de besturen de vaste vergoeding van de leden van het college vast. Hierbij
      wordt de toepasselijke salarisschaal van [bijlage B van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren][ref2]
      en de toepasselijke deeltijdfactor aangegeven. De leden hebben voorts overeenkomstig het
      [Reisbesluit binnenland][ref3] en het [Reisbesluit buitenland][ref4] recht op vergoeding van reis- en
      verblijfskosten. Daarnaast hebben de leden op declaratiebasis recht op vergoeding van kosten van internationale
      telefoongesprekken die zij maken in het kader van de werkzaamheden voor het college.


      [ref1]: https://wetten.overheid.nl/BWBR0024823#Artikel3
