  - number: '30'
    text: |-
      1 Zo spoedig mogelijk na de inwerkingtreding van dit besluit zenden de besturen aan het college een afschrift van
      de begroting voor het jaar 2008 en een uitvoeringsrapportage als bedoeld in [artikel 18, eerste lid][ref1], over de
      periode van 1 januari 2008 tot aan de datum van inwerkingtreding van dit besluit.

      2 De besturen zenden zo spoedig mogelijk na de inwerkingtreding tevens een afschrift van de ontwerpbegroting, dan
      wel, als de begroting reeds is vastgesteld, de begroting, voor het jaar 2009 aan het college.

      3 Met de inwerkingtreding van dit besluit vangt voor het eilandgebied Sint Maarten de overname van de
      schuldendiensten door Nederland aan. Voor het Land onderscheidenlijk voor het eilandgebied Curaçao vangt de
      overname van de schuldendiensten aan op het moment dat het college aan de raad van ministers van het Koninkrijk
      bericht dat de betreffende ontwerpbegroting dan wel, als de begroting reeds is vastgesteld, de begroting voor het
      jaar 2009 in overeenstemming is met de normen, genoemd in [artikel 15][ref2].

      4 Nederland saneert de schulden van het Land en de eilandgebieden. Het betreft de per 31 december 2005 bestaande
      schulden van de Nederlandse Antillen, Curaçao en Sint Maarten, met inbegrip van de herfinanciering van die schulden
      en de financiering van de rente op die schulden, tot het niveau van de voor het jaar 2005 geldende rentelastnorm,
      en de betalingsachterstanden per 31 december 2005;

      5 Voor de in het derde lid bedoelde overname van de schuldendiensten geldt dat Nederland de rente- en
      aflossingsverplichtingen op de in het vierde lid beschreven te saneren schulden overneemt. Deze rente- en
      aflossingsverplichtingen tezamen vormen de in dit besluit genoemde schuldendiensten. Bij inwerkingtreding van de
      nieuwe staatkundige verhoudingen neemt Nederland de dan nog resterende hoofdsom van de in het vierde lid beschreven
      te saneren schulden over.

      6 De sanering en overname van de schulden zoals beschreven in het vierde en vijfde lid vinden plaats conform de
      afspraken in de slotverklaring van 2 november 2006, zoals die nader is uitgewerkt in het Overgangsakkoord van 12
      februari 2007, het document Toetreding Curaçao tot het overgangsakkoord van 28 augustus 2007, de conclusies van het
      Bestuurlijk Overleg van 9 oktober 2007 en de besluiten van de Politieke Stuurgroep van 22 januari, 16 februari en
      22 mei 2008, alsmede nadien in dit kader gesloten akkoorden.


