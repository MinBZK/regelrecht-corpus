  - number: '26'
    text: |-
      1 Tegen een koninklijk besluit als bedoeld in deze regeling, houdende een of meer aanwijzingen of het vaststellen
      van een leningplafond als bedoeld in [artikel 29, vijfde lid][ref1], staat voor een bestuur gedurende dertig
      dagen na verzending van het besluit beroep open bij Ons. De Raad van State van het Koninkrijk is belast met het
      voorbereiden van het ontwerpbesluit inzake de beslissing op het beroep. Ons besluit wordt in het Publicatieblad
      van de Nederlandse Antillen bekend gemaakt en ter kennis van het betrokken bestuur en vertegenwoordigend orgaan
      gebracht.

      2 De Raad van State van het Koninkrijk kan bij de voorbereiding van het ontwerpbesluit, bedoeld in het eerste lid,
      belanghebbenden, getuigen, deskundigen en tolken oproepen om tijdens het onderzoek ter zitting te worden gehoord.
      De raad stelt in ieder geval het betrokken bestuur in de gelegenheid te worden gehoord.

      3 De [artikelen 32 tot en met 35 van de Wet op de Raad van State][ref2] zijn van overeenkomstige toepassing.

      4 De [artikelen 6:5][ref3], [6:6][ref4], [6:14][ref5], [6:15][ref6], [6:17][ref7] en [6:21][ref8], [8:24][ref9],
      [8:25][ref10], [8:27 tot en met 8:29][ref11], [8:31][ref12][8:32][ref13], [8:33 tot en met 8:36, eerste lid][ref14],
      [8:39][ref15], [8:50][ref16], [8:61][ref17] en [8:62 van de Algemene wet bestuursrecht][ref18] zijn van
      overeenkomstige toepassing. Ambtsberichten en andere door Onze Minister aangewezen stukken zijn niet openbaar.

      5 Het ontwerp van een koninklijk besluit als bedoeld in het eerste lid, is niet openbaar.

      6 [Artikel 18a van de Wet op de Raad van State][ref19] is van overeenkomstige toepassing. Het onderzoek ter zitting
      is openbaar.

      7 Het beroep schorst niet de werking van het besluit waartegen het is gericht.

      8 De Raad van State van het Koninkrijk kan een procesreglement vaststellen voor de behandeling van het beroep,
      bedoeld in het eerste lid, en van het verzoek om een voorlopige voorziening, bedoeld in [artikel 27][ref20].

      9 Binnen twee maanden na ontvangst van het ontwerpbesluit kan Onze Minister, met vermelding van de gerezen
      bedenkingen, de Raad verzoeken zijn ontwerp in nadere overweging te nemen. In het kader van die nadere overweging
      stelt de Raad opnieuw het betrokken bestuur in de gelegenheid te worden gehoord.

      10 Ons besluit wijkt niet af van het ontwerp of, indien daarvan sprake is, het nader ontwerp, voor zover het
      advies van de Raad uitsluitend is gebaseerd op rechtmatigheidsgronden, en voor het overige uitsluitend indien
      zeer zwaarwegende, op het in dit besluit geregelde toezicht betrekking hebbende, gronden daartoe aanleiding geven.
      Indien Ons besluit afwijkt van het ontwerp of het nader ontwerp wordt het in het Staatsblad geplaatst met het
      rapport van Onze Minister. Dat rapport bevat in ieder geval de argumenten op grond waarvan wordt voorgesteld af te
      wijken van het ontwerp respectievelijk het nader ontwerp, alsmede het ontwerp zelf en indien daarvan sprake is, het
      nader ontwerp.

      11 Ons besluit wijkt voorts niet af van het ontwerp dan na toepassing van het negende lid, eerste volzin. Indien
      niet binnen twee maanden een verzoek als bedoeld in de eerste volzin van het negende lid is gedaan, beslissen Wij
      overeenkomstig het ontwerp van de Raad van State van het Koninkrijk.

      12 Besluiten van Onze Minister op grond van dit besluit zijn niet vatbaar voor beroep op de administratieve rechter
      op grond van de Landsverordening Administratieve rechtsspraak of de [Algemene wet bestuursrecht][ref21]. Dit geldt
      eveneens voor Ons besluit als bedoeld in het eerste lid.


