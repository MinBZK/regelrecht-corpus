  - number: '21'
    text: |-
      1 De namen en functies van degenen die zijn gemachtigd tot het verrichten van privaatrechtelijke rechtshandelingen
      die voortvloeien uit een besluit tot het aangaan van financiële verplichtingen, worden door de besturen gedeponeerd
      bij het college. Daarbij wordt tevens aangegeven voor welke rechtshandelingen en tot welke bedragen zij gemachtigd
      zijn. Het college houdt hiervan een register bij en publiceert dit register na elke wijziging, maar in elk geval
      iedere zes maanden. Publicatie geschiedt op de website van het college.

      2 Bij toepassing van [artikel 20, vijfde lid][ref1], wordt, na inwerkingtreding van een koninklijk besluit als
      bedoeld in [artikel 20, zesde lid][ref2], in het register bij de betreffende personen aangetekend dat voor het
      aangaan van verplichtingen de voorafgaande instemming van het college is vereist.

      3 Privaatrechtelijke rechtshandelingen betreffende het aangaan van financiële verplichtingen als bedoeld in het
      eerste lid zijn nietig indien zij zijn aangegaan door personen die daartoe blijkens het register, bedoeld in het
      eerste en tweede lid, niet of niet voldoende gemachtigd zijn.

      4 In afwijking van het derde lid is een rechtshandeling als bedoeld in dat lid wel rechtsgeldig als de bevoegdheid
      tot het aangaan van de betreffende verplichting blijkt uit een ten behoeve van die rechtshandeling verstrekte
      schriftelijke machtiging. Deze machtiging wordt slechts in incidentele gevallen verstrekt.

      5 Het bestuur verstrekt afschriften van de in het vierde lid bedoelde machtigingen aan het college.


