    text: |-
      1 Indien dit nodig is in verband met het herstel van schade veroorzaakt door buitengewone gebeurtenissen, waaronder
      natuurrampen, kan het bestuur in overeenstemming met een beslissing daarover van de raad van ministers van het
      Koninkrijk, besluiten af te wijken van de normen, genoemd in [artikel 15][ref1].

      2 Indien in spoedeisende gevallen een beslissing van de raad van ministers van het Koninkrijk niet kan worden
      afgewacht, kan een bestuur in overeenstemming met de voorzitter van de raad van ministers van het koninkrijk
      verplichtingen aangaan die niet voortvloeien uit de uitvoering van de begroting.

      3 Indien geen contact mogelijk is met de voorzitter van de raad van ministers van het Koninkrijk kan het bestuur de
      noodzakelijke maatregelen treffen die kunnen leiden tot een afwijking van de normen, genoemd in [artikel 15][ref2].


