    text: |-
      Door het eilandgebied Sint Maarten kunnen geldleningen worden aangegaan ten name of ten laste van dat eilandgebied.
      Op die geldleningen is artikel 96 van de Eilandenregeling Nederlandse Antillen van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0024823/2008-12-10#Artikel31
  - number: '32'
    text: |-
      1 De besturen informeren het college binnen twee weken na inwerkingtreding van dit besluit over de geldende
      regelgeving op het gebied van:

      a. procedures voor vervreemding en verkrijging van aandelen in rechtspersonen door het Land, respectievelijk de
      eilandgebieden;

      b. richtlijnen voor het dividendbeleid van rechtspersonen waarin het Land, respectievelijk de eilandgebieden
      deelnemen, en

      c. procedures en eisen rond de benoeming en het ontslag van bestuurders van rechtspersonen waarin het Land,
      respectievelijk de eilandgebieden deelnemen.

      2 Het college onderzoekt of het betrokken bestuur en Nederland met betrekking tot de regelgeving, bedoeld in
      het eerste lid, gezamenlijk conclusies hebben getrokken aan de hand van internationaal aanvaarde normen. Indien
      na onderzoek door het college blijkt dat de gezamenlijke conclusies niet zijn getrokken en niet alsnog binnen
      redelijke termijn zijn te verwachten, bericht het college dienaangaande de raad van ministers van het Koninkrijk
      door tussenkomst van Onze Minister.

      3 Op een bericht als bedoeld in het tweede lid is [artikel 13, vierde, zevende en achtste lid][ref1], van
      overeenkomstige toepassing, waarbij een advies tot het geven van een aanwijzing in afschrift aan het betrokken
      bestuur wordt gezonden. Het college bericht het betrokken vertegenwoordigend orgaan dat het advies is verzonden
      Een eventuele aanwijzing door de raad van ministers van het Koninkrijk inzake regelgeving als bedoeld in het
      eerste lid, is in overeenstemming met internationaal aanvaarde normen en wordt gegeven bij koninklijk besluit op de
      voordacht van Onze Minister.


