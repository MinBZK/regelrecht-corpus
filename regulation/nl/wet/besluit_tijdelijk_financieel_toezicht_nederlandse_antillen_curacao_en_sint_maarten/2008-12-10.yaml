      1 Voor de beoordeling van de ontwerpbegroting en van de vastgestelde begroting van het Land, onderscheidenlijk de
      eilandgebieden hanteert het college de volgende normen:

      a. de in de begroting en de meerjarige begroting opgenomen uitgaven op de gewone dienst worden gedekt door de ter
      dekking van die uitgaven opgenomen middelen;

      b. de in de begroting en de meerjarige begroting opgenomen uitgaven op de kapitaaldienst worden gedekt door de
      ter dekking van die uitgaven opgenomen middelen, rekening houdend met de verwachte ontvangsten uit de opbrengst
      van geldleningen;

      c. de rentelastnorm wordt niet overschreden.

      2 Bij de beoordeling, bedoeld in het eerste lid, worden de volgende aspecten betrokken:

      a. in de begroting en de meerjarige begroting zijn alle verwachte uitgaven en verwachte ontvangsten opgenomen;

      b. de in de begroting opgenomen ontvangsten en uitgaven worden toereikend toegelicht;

      c. de begroting is zodanig ingericht dat het voldoet aan de criteria van ordelijkheid en controleerbaarheid.

      3 Bij de begroting wordt een uiteenzetting verstrekt van de financiële toestand van het Land onderscheidenlijk
      het eilandgebied.

      4 In afwijking van het eerste lid, onder a, wordt de rentelast voortvloeiend uit de door Nederland over te nemen
      schulden niet betrokken bij de beoordeling van het tekort op de gewone dienst.
    url: https://wetten.overheid.nl/BWBR0024823/2008-12-10#Artikel15
  - number: '16'
    text: |-
      1 In de begrotingen, bedoeld in [artikel 15][ref1], worden de voornemens tot het aantrekken van geldleningen
      opgenomen.

      2 Van de aangetrokken leningen wordt melding gemaakt in de uitvoeringsrapportages, bedoeld in [artikel 18][ref2].

      3 De besturen informeren het college, als bij de uitvoering van de begroting de omvang van een lening het begrote
      leningbedrag dreigt te overschrijden.

      4 Op basis van de voornemens tot het aantrekken van geldleningen, bedoeld in het eerste lid, de meldingen, bedoeld
      in het tweede lid, en de verstrekte informatie, bedoeld in het derde lid, beoordeelt het college of het bestuur
      voldoet aan de normen, genoemd in [artikel 15][ref3].

      5 Het college beoordeelt tevens of wordt voldaan aan de afspraken over de verbeteringen van het financieel beheer,
      voor zover deze betrekking hebben op het aantrekken van leningen.

      6 Indien geldleningen ten laste van het Land of een eilandgebied worden aangetrokken in het kader van een open
      biedingprocedure bij de Bank van de Nederlandse Antillen, gebeurt dat aantrekken in overeenstemming met een advies
      daarover van die bank.

      7 De Nederlandse Staat heeft een lopende inschrijving op de leningen bedoeld in het zesde lid, telkens voor het
      gevraagde leningbedrag, tegen het actuele rendement op staatsleningen van de betreffende looptijd.

      8 Bij een open biedingprocedure als bedoeld in het zesde lid, hebben bij gelijke leningvoorwaarden lokale
      inschrijvingen voorrang.

      9 Indien geldleningen ten laste van het Land of een eilandgebied onderhands worden aangetrokken, worden telkens
      naast Nederland ook een of meerdere derde partijen in de gelegenheid gesteld om gelijktijdig een aanbod te doen en
      wordt er vervolgens aangetrokken daar waar de leningvoorwaarden het meest gunstig zijn. Voor de Nederlandse Staat
      geldt in dit verband het aanbod, bedoeld in het zevende lid. Het achtste lid is van overeenkomstige toepassing.

      10 Het bestuur bericht het college over een voornemen tot het onderhands aantrekken van een geldlening, onder
      bijvoeging van de voorwaarden van de aangeboden geldleningen. Het college adviseert op basis van een onderlinge
      vergelijking van de betreffende leningvoorwaarden binnen veertien dagen na ontvangst van dat bericht. Indien een
      bestuur afwijkt van het advies van het college, geschiedt dat met een gemotiveerd besluit. Het bestuur informeert
      het college over het genomen besluit.

      11 Het college kan de raad van ministers van het Koninkrijk door tussenkomst van Onze Minister berichten als blijkt
      dat een bestuur afwijkt van het advies, bedoeld in het tiende lid. Bij dat bericht kan het college adviseren tot
      het nemen van een besluit als bedoeld in het twaalfde en dertiende lid. Het college zendt gelijk met het advies
      een afschrift daarvan aan het betreffende bestuur en bericht het betrokken vertegenwoordigend orgaan dat het advies
      is verzonden.

      12 Op een advies als bedoeld in het elfde lid kan de raad van ministers van het Koninkrijk beslissen tot het
      geven van een aanwijzing met betrekking tot het onderhands aangaan van leningen. Alvorens een voorstel voor een
      aanwijzing bij de raad van ministers van het Koninkrijk wordt ingediend stelt Onze Minister het betrokken bestuur
      in de gelegenheid zijn visie te geven.

      13 Het geven van de aanwijzing geschiedt bij koninklijk besluit op de voordracht van Onze Minister.


