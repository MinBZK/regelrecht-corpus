  - number: '33'
    text: |-
      De voorzitter en de leden van het college zoals die zijn benoemd op grond van
      [artikel 2 van het Besluit tijdelijk financieel toezicht BES][ref1] zoals dat luidde voor
      de inwerkingtreding van dit besluit worden geacht als zodanig te zijn benoemd op grond van
      [artikel 2, derde lid, aanhef en onderdelen a en e, en vierde lid][ref2], van dit besluit.


