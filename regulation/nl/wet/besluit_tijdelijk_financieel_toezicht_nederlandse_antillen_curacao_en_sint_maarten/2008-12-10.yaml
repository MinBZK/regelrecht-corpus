preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties van 11 juli 2008, nr. 2008-
    0000316536, CZW, gedaan mede namens Onze Minister van Financiën en in overeenstemming met de regering van de
    Nederlandse Antillen en de bestuurscolleges van de eilandgebieden Curaçao en Sint Maarten;

    Gelet op de artikelen 38, eerste en tweede lid, van het Statuut voor het Koninkrijk der Nederlanden;

    De Raad van State van het Koninkrijk gehoord (advies van 14 augustus 2008, nr. W04.08.0307/I/K);

    Gezien het nader rapport van de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties, uitgebracht mede
    namens Onze Minister van Financiën van 28 oktober 2008, in overeenstemming met de regering van de Nederlandse
    Antillen en de bestuurscolleges van de eilandgebieden Curaçao en Sint Maarten;

    De bepalingen van het Statuut voor het Koninkrijk der Nederlanden in acht genomen zijnde;

    Overwegende, dat de bevolkingen van de eilanden van de Nederlandse Antillen met gebruikmaking van het recht van
    zelfbeschikking zich in referenda hebben uitgesproken om te komen tot een nieuwe staatkundige status van die
    eilanden binnen het Koninkrijk der Nederlanden;

    Dat op basis daarvan de regeringen van Nederland en de Nederlandse Antillen, met instemming van de eilandgebieden
    Curaçao, Sint Maarten, Bonaire, Sint Eustatius en Saba zijn overeengekomen om te bewerkstelligen dat bij de start
    van de nieuwe staatkundige verhoudingen sprake is van een gezonde financiële positie van de eilanden;

    Dat tevens is overeengekomen dat in dat kader Nederland de verplichting op zich neemt om tot aan de rentelastnorm
    de schuld van de Nederlandse Antillen, Curaçao en Sint Maarten naar de stand van 31 december 2005 over te nemen en
    dat die verplichting mede omvat de herfinanciering van die schuld en de financiering van de rente op die schuld,
    alsmede de sanering van betalingsachterstanden;

    Dat deze verplichting en de bijbehorende voorwaarden zijn neergelegd in de Slotverklaring van 2 november 2006,
    zoals die nader is uitgewerkt in het Overgangsakkoord van 12 februari 2007, het document Toetreding Curaçao tot het
    Overgangsakkoord van 28 augustus 2007 en het bestuursakkoord van 22 mei 2008;

    Dat in verband met de sanering van de schulden en de gezondmaking van de overheidsfinanciën, in de overgangsperiode
    tot de nieuwe staatkundige verhoudingen financieel toezicht op de begrotingen van de Nederlandse Antillen en de
    eilandgebieden Curaçao en Sint Maarten wordt ingesteld;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0024823/2008-12-10#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt verstaan onder:

        - *begroting:* de begroting, bedoeld in de Staatsregeling van de Nederlandse Antillen, onderscheidenlijk de
      begroting, bedoeld in de Eilandenregeling Nederlandse Antillen;
        - *bestuur:* de Raad van Ministers van het Land of het bestuurscollege van Curaçao of Sint Maarten;
        - *collectieve sector:* het Land tezamen met de rechtspersonen die met toepassing van [artikel 23][ref1] als
      zodanig zijn aangewezen, respectievelijk een eilandgebied tezamen met de rechtspersonen die met toepassing van
      [artikel 23][ref2] als zodanig zijn aangewezen;
        - *college:* het College financieel toezicht, bedoeld in [artikel 2][ref3];
        - *eilandgebieden:* de eilandgebieden Curaçao en Sint Maarten;
        - *eilandgebied:* het eilandgebied Curaçao of het eilandgebied Sint Maarten;
        - *geconsolideerde schuld:* de gezamenlijke schulden van de collectieve sector van het Land of van de collectieve
      sector van het eilandgebied in de vorm van leningen en betalingsachterstanden, met uitzondering van de onderlinge
      schulden binnen de collectieve sector van het Land of eilandgebied;
        - *kapitaaluitgaven:* uitgaven die ingevolge de geldende definitie van het System of National Accounts van de
      Verenigde Naties op de kapitaaldienst van de overheidsrekening worden geboekt;
        - *Land:* het land de Nederlandse Antillen;
        - *Onze Minister:* Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;
        - *rentelast:* de uitgaven aan rente, toerekenbaar aan een begrotingsjaar, over de geconsolideerde schuld van het
      Land, onderscheidenlijk van een eilandgebied;
        - *rentelastnorm:* de rentelast die overeenkomt met 5% van de gemiddelde gerealiseerde gezamenlijke inkomsten van
      de collectieve sector van het Land, onderscheidenlijk van de collectieve sector van het eilandgebied over de drie
      jaren voorafgaand aan het jaar waarin de begroting is of wordt ingediend;
        - *vertegenwoordigend orgaan:* de Staten van het Land of de eilandsraad van een eilandgebied.

      2 Voor de toepassing van de [artikelen 2][ref4], [3][ref5], [4, tweede tot en met vierde lid][ref6], [7][ref7] en
      [10][ref8] wordt tevens verstaan onder:

      a. eilandgebied: het eilandgebied Bonaire, Sint Eustatius of Saba;

      b. eilandsraad: de eilandsraad van Bonaire, Sint Eustatius of Saba;

      c. bestuur: het bestuurscollege van Bonaire, Sint Eustatius of Saba;

      d. bestuurscollege: het bestuurscollege van Bonaire, Sint Eustatius of Saba.


