  - number: '23'
    text: |-
      1 Onze Minister en het betreffende bestuur wijzen gezamenlijk, na advies van het Centraal Bureau voor de Statistiek
      van de Nederlandse Antillen in samenwerking met het Centraal Bureau voor de Statistiek van Nederland, aan welke
      rechtspersonen behoren tot de collectieve sector van het Land respectievelijk van de afzonderlijke eilandgebieden.

      2 Voor de aanwijzing is het System of National Accounts van de Verenigde Naties leidend.

      3 Het bestuur stelt de betrokken rechtspersonen schriftelijk in kennis van de aanwijzing.

      4 Het bestuur rapporteert jaarlijks voor 1 april aan het college over de voorlopige jaarcijfers over het voorgaande
      kalenderjaar van de betreffende collectieve sector.
    url: https://wetten.overheid.nl/BWBR0024823/2008-12-10#Artikel23
  - number: '24'
    text: |-
      1 Het Centraal Bureau voor de Statistiek van de Nederlandse Antillen rapporteert aan de besturen uiterlijk 1
      september over de uitgaven-, ontvangsten-, tekort- en schuldcijfers van het voorafgaande jaar van de collectieve
      sector van het Land respectievelijk van de eilandgebieden. Daarbij zijn de definities van het System of National
      Accounts leidend. Het Centraal Bureau van de Statistiek Nederland adviseert het CBS van de Nederlandse Antillen.

      2 Het bestuur zendt de rapportage, bedoeld in het eerste lid, binnen twee weken naar het college. Indien uit die
      rapportage blijkt dat een overschrijding van de rentelastnorm dreigt, bericht het bestuur het college gelijktijdig
      met toezending van de rapportage over het beleid dat zal worden gevoerd ter beheersing van de rentelasten.

      3 Indien na kennisneming van de rapportage, bedoeld in het eerste lid, naar het oordeel van het college het bestuur
      niet of niet voldoende de dreiging wegneemt van een overschrijding van de rentelastnorm, doet het college binnen
      veertien dagen na ontvangst van de rapportage aan het betrokken bestuur aanbevelingen over de te nemen maatregelen
      ter beheersing van de rentelasten.

      4 Indien na ten minste veertien dagen na het doen van de aanbevelingen, bedoeld in het derde lid, naar oordeel
      van het college sprake blijft van een dreiging van een overschrijding van de rentelastnorm bericht het college na
      afloop van die periode dienaangaande de raad van ministers van het Koninkrijk door tussenkomst van Onze Minister.
      [Artikel 13, vierde, zevende en achtste lid][ref1], is van overeenkomstige toepassing. Indien het college adviseert
      tot het geven van een aanwijzing, zendt het college gelijk met dat advies een afschrift daarvan aan het betreffende
      bestuur en bericht het betrokken vertegenwoordigend orgaan dat het advies is verzonden.


