  - number: '10'
    text: |-
      1 Indien naar het oordeel van de raad van ministers van het Koninkrijk het college bij de uitoefening van zijn taak
      ernstig in gebreke blijft, kan Onze Minister, in overeenstemming met de besturen, de noodzakelijke voorzieningen
      treffen.

      2 Deze voorzieningen worden, spoedeisende gevallen uitgezonderd, niet eerder getroffen dan nadat het college in de
      gelegenheid is gesteld om binnen een door de raad van ministers van het Koninkrijk te stellen termijn alsnog zijn
      taak naar behoren uit te voeren.
    url: https://wetten.overheid.nl/BWBR0024823/2008-12-10#Artikel10
  - number: '11'
    text: |-
      1 Het bestuur zendt uiterlijk op 15 augustus voorafgaande aan het begrotingsjaar een afschrift van de
      ontwerpbegroting voor advies aan het college.

      2 Op verzoek van het bestuur kan in overleg met het college een latere datum worden overeengekomen waarop de
      ontwerpbegroting uiterlijk toegezonden zal worden.

      3 De bij een vertegenwoordigend orgaan ingediende ontwerpbegroting gaat vergezeld van een advies als bedoeld
      in [artikel 12][ref1]. De indiener geeft bij de ontwerpbegroting aan in hoeverre en op welke wijze rekening is
      gehouden met dat advies.

      4 Het bestuur zendt de begroting, onmiddellijk nadat deze is vastgesteld, voor advies als bedoeld in
      [artikel 12][ref2], aan het college.

      5 Het college zendt een advies ter zake van een ontwerpbegroting of een vastgestelde begroting binnen veertien
      dagen na ontvangst van die ontwerpbegroting onderscheidenlijk vastgestelde begroting aan het betreffende bestuur.

      6 De afkondiging van een begroting kan, in afwijking van artikel 18, tweede lid, van de Staatsregeling of artikel
      77 van de Eilandenregeling Nederlandse Antillen worden aangehouden totdat het college daarover advies heeft
      uitgebracht. Een afkondiging wordt niet langer aangehouden dan gedurende de termijn, bedoeld in het vijfde lid.
      De Gouverneur onderscheidenlijk de gezaghebber kan in verband met het aflopen van die termijn het aanhouden van de
      afkondiging eenmalig met ten hoogste een week verlengen.

      7 Het tweede tot en met het vijfde lid zijn van overeenkomstige toepassing op een ontwerpverordening tot wijziging
      van een begroting en op een vastgestelde verordening tot wijziging van een begroting.


      [ref1]: https://wetten.overheid.nl/BWBR0024823#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0024823#Artikel12
    url: https://wetten.overheid.nl/BWBR0024823/2008-12-10#Artikel11
