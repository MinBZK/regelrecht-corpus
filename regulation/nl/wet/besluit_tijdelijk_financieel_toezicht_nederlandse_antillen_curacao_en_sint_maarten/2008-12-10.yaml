      1 Indien het bestuur nalaat een voorziening ter uitvoering van een beleidsvoornemen te treffen of deze op een
      zodanig tijdstip vaststelt, implementeert of uitvoert dat de haalbaarheid van de uitgaven- en ontvangstenramingen
      in gevaar komt, adviseert het college hierover overeenkomstig [artikel 12, eerste lid][ref1].

      2 Het college adviseert eveneens overeenkomstig [artikel 12, eerste lid][ref2], indien het vertegenwoordigende
      orgaan niet met een voorgestelde voorziening instemt of daarmee op een zodanig tijdstip instemt dat de haalbaarheid
      van de uitgaven- en ontvangstenramingen in gevaar komt;

      3 Op een advies als bedoeld in het eerste en tweede lid, is [artikel 13][ref3] van overeenkomstige toepassing.


