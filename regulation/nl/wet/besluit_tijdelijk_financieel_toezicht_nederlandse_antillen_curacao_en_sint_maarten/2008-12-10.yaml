  - number: '22'
    text: |-
      1 De besturen dragen er, in overeenstemming met het college, zorg voor:

      a. dat het college afschriften ontvangt van de bankrekeningen van het Land, respectievelijk de eilandgebieden;

      b. dat het Land respectievelijk de eilandgebieden een bankrekening hebben bij de Bank van de Nederlandse Antillen;

      c. dat het Land respectievelijk de eilandgebieden ten behoeve van het liquiditeitenbeheer een hoofdbankrekening
      hebben, welke bankrekening bij de Bank van de Nederlandse Antillen of bij een commerciële bank kan worden
      aangehouden;

      d. dat creditsaldi op de rekeningen bij commerciële banken dagelijks worden overgeboekt naar de hoofdbankrekening
      van het Land respectievelijk de eilandgebieden;

      e. dat debetsaldi op de rekeningen bij commerciële banken dagelijks worden aangevuld vanaf de hoofdbankrekening van
      het Land respectievelijk de eilandgebieden.

      2 Een debetsaldo op de hoofdbankrekening van het Land respectievelijk het eilandgebied zal, indien nodig, door de
      Nederlandse staat worden aangevuld via de bankrekening van het Land respectievelijk het eilandgebied bij de Bank
      Nederlandse Antillen. Hierdoor ontstaat een lening van het Land respectievelijk het eilandgebied bij de Nederlandse
      Staat.

      3 Het rentepercentage over de lening, bedoeld in het tweede lid, is gelijk aan de Euro Overnight Index Average.

      4 De rentevergoeding over deze lening is relevant voor de normen, genoemd in [artikel 15][ref1].

      5 Het college voert in verband met mogelijke toepassing van het tweede lid periodiek overleg met de besturen over
      het verwachte liquiditeitsverloop.


      [ref1]: https://wetten.overheid.nl/BWBR0024823#Artikel15
