  - number: '3'
    text: |-
      1 Een lid van het college kan niet tevens zijn:

      a. Gouverneur;

      b. minister of staatssecretaris;

      c. commissaris van de Koning of gedeputeerde;

      d. lid van een vertegenwoordigend orgaan of van een daarmee vergelijkbaar orgaan van Nederland;

      e. gezaghebber of gedeputeerde van een eilandgebied;

      f. burgemeester of wethouder;

      g. lid van de Raad van Advies van de Nederlandse Antillen;

      h. lid van de Raad van State van het Koninkrijk;

      i. lid van de Algemene Rekenkamer van het Land of van Nederland;

      j. nationale of eilandelijke ombudsman of substituut-ombudsman;

      k. ambtenaar bij een ministerie of een eilandgebied, alsmede de daaronder ressorterende instellingen, diensten
      en bedrijven.

      2 Een lid vervult ook overigens geen nevenfunctie of andere betrekking die overigens ongewenst is met het oog op
      een goede vervulling van zijn functie of de handhaving van zijn onafhankelijkheid of van het vertrouwen daarin.

      3 Een lid meldt het voornemen tot het aanvaarden van een nevenfunctie of andere betrekking aan het college. Het
      college informeert Onze Minister en de besturen.

      4 Het college maakt de nevenfuncties en andere betrekkingen van een lid openbaar. Openbaarmaking geschiedt bij
      zijn benoeming en voorts door jaarlijkse publicatie van een opgave van deze nevenfuncties en betrekkingen in de
      Staatscourant en De Curaçaosche Courant.
    url: https://wetten.overheid.nl/BWBR0024823/2008-12-10#Artikel3
  - number: '4'
    text: |-
      1 De taken van het college zijn, onverminderd de in andere artikelen van dit besluit genoemde taken:

      a. het toezicht op de toepassing door het Land en de eilandgebieden van de normen, genoemd in [artikel 15][ref1],
      bij de voorbereiding, de uitvoering en de verantwoording van de begroting en bij het betalingsverkeer;

      b. het toetsen of het Land en de eilandgebieden voldoen aan de bij dit besluit vastgestelde voorwaarden voor het
      aangaan van rentedragende leningen en rentedragende kredieten;

      c. het rapporteren aan en adviseren van de Minister van Financiën van het Land, de Staten, de betrokken
      bestuurscolleges en de eilandsraden en, door tussenkomst van Onze Minister, de raad van ministers van het
      Koninkrijk;

      d. het toezicht op de voortgang van de implementatie van de verbetering van het financieel beheer;

      e. de in het [Besluit tijdelijk financieel toezicht BES][ref2] genoemde taken met betrekking tot de eilandgebieden
      Bonaire, Sint Eustatius en Saba.

      2 Het college zendt eens per half jaar door tussenkomst van Onze Minister een schriftelijk verslag over zijn
      werkzaamheden aan de raad van ministers van het Koninkrijk en aan de betrokken ministers, de beide kamers der
      Staten-Generaal, de Staten, de bestuurscolleges en de eilandsraden.

      3 Het college verstrekt desgevraagd inlichtingen over zijn werkzaamheden aan Onze Minister, aan Onze Minister van
      Financiën van Nederland en aan de besturen.

      4 Onze Minister kan, na instemming van de raad van ministers van het Koninkrijk, die handelt in overeenstemming met
      de besturen, beleidsregels vaststellen en algemene en bijzondere aanwijzingen geven ten aanzien van de uitoefening
      van de in dit besluit aan het college toegekende taken en bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0024823#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0022921
