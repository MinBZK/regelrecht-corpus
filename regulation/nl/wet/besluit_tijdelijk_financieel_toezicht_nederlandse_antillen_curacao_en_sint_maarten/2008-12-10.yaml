  - number: '18'
    text: |-
      1 De besturen zenden uiterlijk zes weken na afloop van ieder kwartaal een uitvoeringsrapportage aan het college en
      aan het betrokken vertegenwoordigend orgaan.

      2 Het college en de besturen stellen ten behoeve van de uitvoeringsrapportage gezamenlijk een model vast, dat
      aangeeft over welke onderwerpen gerapporteerd wordt. Hiertoe behoren in ieder geval informatie over de uitputting
      van de begroting (resterende verplichtingenruimte), eventuele nieuwe beleidsvoornemens met financiële consequenties
      en mee- en tegenvallers in de uitvoering van de begroting.

      3 Indien uit de uitvoeringsrapportage over het vierde kwartaal blijkt dat sprake is van een tekort op de gewone
      dienst of van een overschrijding van de rentelastnorm, geeft het bestuur in die rapportage aan welke maatregelen
      worden voorgenomen ter compensatie van het tekort, respectievelijk de overschrijding.

      4 Uiterlijk 31 augustus van ieder jaar verstrekken de besturen een afschrift van de vastgestelde jaarrekening van
      het voorafgaande jaar aan het college.

      5 Indien de jaarrekening op dat tijdstip nog niet is vastgesteld, verstrekken de besturen de in voorbereiding
      zijnde jaarrekening naar de stand van dat tijdstip. Het bestuur verstrekt de bevindingen van de Algemene Rekenkamer
      van de Nederlandse Antillen en van de interne accountant op het ontwerp van de jaarrekening onmiddellijk na de
      ontvangst van die bevindingen aan het college.

      6 Indien uit de vastgestelde jaarrekening blijkt dat sprake is van een tekort op de gewone dienst of van een
      overschrijding van de rentelastnorm, geeft het bestuur tegelijk met de jaarrekening aan welke maatregelen worden
      voorgenomen ter compensatie van het tekort, respectievelijk de overschrijding.

      7 Het college beoordeelt de voorgenomen maatregelen, bedoeld in het derde en het zesde lid, aan de hand van de
      normen, genoemd in [artikel 15][ref1], en zendt het bestuur binnen veertien dagen na ontvangst van de betreffende
      uitvoeringsrapportage een advies overeenkomstig [artikel 12, eerste lid][ref2].

      8 Op een advies als bedoeld in het zevende lid, is [artikel 13][ref3] van overeenkomstige toepassing.


