    text: |-
      1 De besturen rapporteren uiterlijk zes weken na afloop van ieder kwartaal aan het college over de uitvoering van
      de implementatieplannen ter verbetering van het financieel beheer. Het college en de besturen stellen ten behoeve
      van die rapportage gezamenlijk een model vast, dat aangeeft over welke onderwerpen gerapporteerd wordt.

      2 Het college kan de besturen ter zake van de uitvoering van deze implementatieplannen aanbevelingen geven.

      3 Het college kan aanbevelingen geven op het terrein van het financieel beheer rekening houdend met de bevindingen
      van de interne accountant en van de Algemene Rekenkamer van de Nederlandse Antillen.
    url: https://wetten.overheid.nl/BWBR0024823/2008-12-10#Artikel19
  - number: '20'
    text: |-
      1 De besturen gaan uitsluitend financiële verplichtingen aan voor zover deze zijn opgenomen in een begroting die
      niet ingevolge [artikel 13][ref1] is opgeschort.

      2 De besturen leggen het voornemen tot het aangaan van een financiële verplichting, voor zover het de limieten
      voor financieel zelfbeheer, zoals die gelden met ingang van 1 januari 2008, te boven gaat, voor advies voor
      aan de directeur Financiën van het Land, respectievelijk de hoofden Financiën van de eilandgebieden of, bij hun
      afwezigheid, aan hun eerste of tweede plaatsvervanger. Een positief advies wordt verleend indien de financiële
      verplichting voortvloeit uit de uitvoering van de begroting. De in de eerste volzin bedoelde limieten kunnen na
      overleg met het college gewijzigd worden.

      3 Als het bestuur een financiële verplichting aangaat zonder of in afwijking van een positief advies, als bedoeld
      in het tweede lid, deelt het bestuur dat terstond mee aan het college.

      4 Het college kan de raad van ministers van het Koninkrijk door tussenkomst van Onze Minister berichten als blijkt
      dat een bestuur een financiële verplichting is aangegaan zonder of in afwijking van een positief advies als bedoeld
      in het tweede lid. Bij dat bericht kan het college adviseren tot het geven van een aanwijzing als bedoeld in het
      vijfde lid. Gelijk met dat advies zendt het college een afschrift daarvan aan het betreffende bestuur en bericht
      het betrokken vertegenwoordigend orgaan dat het advies is verzonden.

      5 Op een advies als bedoeld in het vierde lid, kan de raad van ministers van het Koninkrijk beslissen dat ten laste
      van de desbetreffende begroting of bepaalde artikelen van die begroting geen financiële verplichtingen mogen worden
      aangegaan voordat het college daarmee heeft ingestemd. Alvorens een voorstel voor een aanwijzing bij de raad van
      ministers van het Koninkrijk wordt ingediend stelt Onze Minister het betrokken bestuur in de gelegenheid zijn visie
      te geven.

      6 De aanwijzing geschiedt bij koninklijk besluit op de voordracht van Onze Minister.

      7 De instemming, bedoeld in het vijfde lid, wordt verleend als de betreffende financiële verplichting voldoet aan
      het eerste lid.

      8 In geval van het aangaan van financiële verplichtingen en het verrichten van privaatrechtelijke rechtshandelingen
      waartoe door een vertegenwoordigend orgaan is besloten, is dit artikel van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024823#Artikel13
