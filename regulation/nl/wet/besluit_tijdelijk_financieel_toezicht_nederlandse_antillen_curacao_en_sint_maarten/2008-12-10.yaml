  - number: '5'
    text: |-
      1 Het college stelt ter uitvoering van de in [artikel 4][ref1] en andere artikelen genoemde taken een
      bestuursreglement vast, waarin in ieder geval regels over de besluitvorming, werkwijze en procedures zijn
      opgenomen. In het reglement worden tevens regels opgenomen over de verdeling van de werkzaamheden bij de
      voorbereiding van de besluiten en adviezen van het college.

      2 Het bestuursreglement wordt bekendgemaakt in de Staatscourant en De Curaçaosche Courant.

      3 De voorzitter en de secretaris van het college bevorderen een doelmatige en voorspoedige uitvoering van de taken
      van het college.

      4 Een lid kan zich doen vertegenwoordigen door een ander lid, mits hij daartoe schriftelijk volmacht heeft verleend
      aan dat lid. De voorzitter beoordeelt de deugdelijkheid van de volmacht. Een lid kan slechts voor één ander lid als
      gevolmachtigde optreden.

      5 Het college streeft bij het nemen van besluiten naar consensus. Indien bij het nemen van besluiten door het
      college de stemmen staken, heeft de voorzitter de doorslaggevende stem.


      [ref1]: https://wetten.overheid.nl/BWBR0024823#Artikel4
