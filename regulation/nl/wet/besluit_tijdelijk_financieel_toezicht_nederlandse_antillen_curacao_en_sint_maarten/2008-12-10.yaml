      1 Als het college binnen een week na 15 augustus respectievelijk de op grond van [artikel 11, tweede lid][ref1],
      overeengekomen datum nog geen ontwerpbegroting heeft ontvangen, respectievelijk op 15 december nog geen
      vastgestelde begroting heeft ontvangen, en er naar zijn oordeel ook geen uitzicht bestaat dat binnen een redelijke
      termijn alsnog een ontwerpbegroting, respectievelijk een vastgestelde begroting zal worden toegezonden, bericht het
      college dienaangaande de raad van ministers van het Koninkrijk door tussenkomst van Onze Minister.

      2 Een bericht van het college als bedoeld in het eerste lid kan vergezeld gaan van een gemotiveerd advies tot het
      geven van een aanwijzing.

      3 Het college zendt gelijk met het advies, bedoeld in het tweede lid, een afschrift daarvan aan het betreffende
      bestuur en bericht het betrokken vertegenwoordigend orgaan dat het advies is verzonden.

      4 Op een advies als bedoeld in het tweede lid kan de raad van ministers van het Koninkrijk beslissen tot het
      geven van een aanwijzing aan het betreffende bestuur alsnog een ontwerpbegroting, respectievelijk een vastgestelde
      begroting ter beoordeling toe te zenden aan het college. Alvorens een voorstel voor een aanwijzing bij de raad van
      ministers van het Koninkrijk wordt ingediend stelt Onze Minister het betrokken bestuur in de gelegenheid zijn visie
      te geven.

      5 De aanwijzing geschiedt bij koninklijk besluit op de voordracht van Onze Minister.

      6 Indien bij de aanvang van een begrotingsjaar er geen op dat jaar betrekking hebbende begroting in werking is
      getreden, strekt de begroting van het aan het betrokken begrotingsjaar voorafgaande jaar tot grondslag van het
      beheer, zulks om de dienst gaande te houden.


      [ref1]: https://wetten.overheid.nl/BWBR0024823#Artikel11
