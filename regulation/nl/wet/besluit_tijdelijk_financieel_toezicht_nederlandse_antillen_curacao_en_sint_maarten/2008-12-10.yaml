  - number: '6'
    text: |-
      1 Het college heeft een secretaris.

      2 Aan de secretaris kunnen medewerkers worden toegevoegd.

      3 De secretaris en de medewerkers worden op voordracht van het college vanwege Onze Minister aan het college ter
      beschikking gesteld.

      4 De secretaris en de medewerkers staan onder gezag van het college en leggen uitsluitend aan het college
      verantwoording af.

      5 De secretaris en de medewerkers zijn geen lid van het college.
    url: https://wetten.overheid.nl/BWBR0024823/2008-12-10#Artikel6
  - number: '7'
    text: |-
      1 De leden, de secretaris en de medewerkers van het college, voor zover niet woonachtig op een van de
      eilandgebieden en in het bezit van de Nederlandse nationaliteit, zijn vrijgesteld te voldoen aan de verplichtingen,
      bedoeld in artikel 3, eerste lid, onder f, van de Landsverordening toelating en uitzetting.

      2 De leden, de secretaris of de medewerkers van het college die niet de Nederlandse nationaliteit bezitten, hebben
      als lid, secretaris dan wel medewerker voor de toepassing van de Landsverordening toelating en uitzetting en de
      Landsverordening arbeid vreemdelingen van rechtswege toelating als bedoeld in artikel 3, eerste lid, onderdeel f,
      van de eerstgenoemde landsverordening, mits is voldaan aan de voorwaarden genoemd in die bepaling.
    url: https://wetten.overheid.nl/BWBR0024823/2008-12-10#Artikel7
  - number: '8'
    text: |-
      1 De besturen verstrekken het college alle inlichtingen die het voor de uitoefening van zijn taken nodig acht.
      Hiertoe behoren de gegevens van de betreffende collectieve sector van het Land, onderscheidenlijk het eilandgebied.

      2 De besturen verlenen het college dan wel door hem aangewezen vertegenwoordigers, te allen tijde toegang tot dan
      wel inzage in alle goederen, administraties, documenten en andere informatiedragers.

      3 Het college neemt de met betrekking tot natuurlijke en rechtspersonen in de Nederlandse Antillen geldende
      geheimhoudingsbepalingen in acht.
    url: https://wetten.overheid.nl/BWBR0024823/2008-12-10#Artikel8
  - number: '9'
    text: |-
      1 De bezoldiging van de leden, de secretaris en de medewerkers van het college, alsmede de bekostiging van de
      overige apparaatsuitgaven komen ten laste van de begroting van Onze Minister.

      2 De uitgaven en ontvangsten samenhangende met het verstrekken van leningen als bedoeld in de [artikelen 16][ref1]
      en [22][ref2] door de Nederlandse Staat aan het Land en de eilandgebieden komen ten laste respectievelijk ten
      gunste van de begroting van Onze Minister.

      3 De valutarisico’s samenhangende met het verstrekken van leningen als bedoeld in de [artikelen 16][ref3] en
      [22][ref4] door de Nederlandse Staat aan het Land en de eilandgebieden komen ten laste respectievelijk ten gunste
      van de begroting van Onze Minister.


