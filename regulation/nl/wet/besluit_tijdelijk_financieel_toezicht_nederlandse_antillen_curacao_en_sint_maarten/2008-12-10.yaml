  - number: '29'
    text: |-
      1 Zolang de rentelastnorm voor een of meer collectieve sectoren niet bepaald kan worden, of de beoordeling, bedoeld
      in [artikel 15][ref1], niet plaats kan vinden, komen het college en de betrokken besturen jaarlijks uiterlijk op
      1 september een leningplafond overeen dat met betrekking tot het eerstvolgende begrotingsjaar gebruikt zal worden
      voor de beoordeling, bedoeld in [artikel 15][ref2].

      2 Het leningplafond, bedoeld in het eerste lid, is er op gericht dat de meerjarencijfers van het Land,
      respectievelijk de meerjarige startbegrotingen van de nieuwe landen na de toedeling van de resterende landsschuld
      zullen voldoen aan de normen, genoemd in [artikel 15][ref3].

      3 In afwijking van het eerste lid komen het college en de besturen binnen twee weken na de inwerkingtreding van dit
      besluit een leningplafond overeen voor het begrotingsjaar 2009.

      4 Indien het niet mogelijk blijkt een leningplafond overeen te komen zoals bedoeld in het eerste of derde lid, kan
      het college de raad van ministers van het Koninkrijk door tussenkomst van Onze Minister adviseren een leningplafond
      vast te stellen. Alvorens een voorstel in te dienen bij de raad van ministers van het Koninkrijk stelt Onze
      Minister het bestuur in de gelegenheid zijn visie te geven.

      5 Een leningplafond als bedoeld in het vierde lid wordt vastgesteld bij koninklijk besluit op de voordracht van
      Onze Minister.


