    text: |-
      1 Dit besluit kan buiten toepassing worden verklaard bij landsbesluit voor het Land of bij eilandsbesluit voor het
      eilandgebied Curaçao onderscheidenlijk Sint Maarten in het geval dat Nederland de overname van schuldendiensten
      staakt om redenen die niet zijn afgesproken in de Slotverklaring van 2 november 2006, zoals die nader is uitgewerkt
      in het Overgangsakkoord van 12 februari 2007, het document Toetreding Curaçao tot het Overgangsakkoord van 28
      augustus 2007, de conclusies van het Bestuurlijk Overleg van 9 oktober 2007 en de besluiten van de Politieke
      Stuurgroep van 22 januari en 16 februari 2008, alsmede nadien in dit kader nader gesloten akkoorden.

      2 Een verklaring als bedoeld in het eerste lid wordt niet eerder gedaan dan nadat de Raad van State van
      het Koninkrijk op een door tussenkomst van de raad van ministers van het Koninkrijk ingediend verzoek
      van het betrokken bestuur heeft bevestigd dat er sprake is van een in dat lid bedoeld geval. De raad
      van ministers van Koninkrijk bevordert dat een in dit lid bedoeld verzoek onverwijld wordt doorgeleid.
      [Artikel 18a van de Wet op de Raad van State][ref1] is van overeenkomstige toepassing.


