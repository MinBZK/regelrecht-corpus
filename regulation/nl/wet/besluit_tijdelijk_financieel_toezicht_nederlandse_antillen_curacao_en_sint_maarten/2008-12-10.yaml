    text: |-
      1 Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.

      2 Dit besluit vervalt met ingang van 1 januari van het derde jaar na het jaar van inwerkingtreding of op een eerder
      bij koninklijk besluit te bepalen tijdstip.
