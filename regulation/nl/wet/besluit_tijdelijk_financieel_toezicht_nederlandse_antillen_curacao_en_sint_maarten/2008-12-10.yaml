    text: |-
      1 Indien een advies als bedoeld in [artikel 12][ref1] ter zake van een vastgestelde begroting of een vastgestelde
      verordening tot wijziging van een begroting aanbevelingen bevat als bedoeld in [dat artikel][ref2], deelt het
      betreffende bestuur binnen veertien dagen na ontvangst van het advies aan het college mee in hoeverre en op welke
      wijze rekening wordt gehouden met die aanbevelingen en, indien aan de orde, onder vermelding van de termijnen die
      daarbij in acht worden genomen.

      2 Indien naar het oordeel van het college het bestuur met de in het eerste lid genoemde mededeling niet of niet
      voldoende de normen, genoemd in [artikel 15][ref3], in acht neemt, dan wel indien het bestuur nalaat die mededeling
      aan het college te doen, geeft het college binnen veertien dagen na ontvangst van de mededeling, respectievelijk na
      het uitblijven ervan, daarover bericht aan het betreffende bestuur en het vertegenwoordigend orgaan.

      3 Indien na ten minste zeven dagen na verzending van het bericht, bedoeld in het tweede lid, naar het oordeel van
      het college sprake blijft van een begroting, respectievelijk een verordening tot wijziging van de begroting die
      geheel of ten dele niet voldoet aan de normen, genoemd in [artikel 15][ref4], bericht het college na afloop van die
      periode dienaangaande de raad van ministers van het Koninkrijk door tussenkomst van Onze Minister.

      4 Een bericht van het college als bedoeld in het derde lid, kan vergezeld gaan van een gemotiveerd advies tot het
      geven van een aanwijzing als bedoeld in het zevende lid.

      5 Het college zendt gelijk met het advies, bedoeld in het vierde lid, een afschrift daarvan aan het betreffende
      bestuur, waarna dat bestuur zonodig beslist of de uitvoering van de begroting of een deel daarvan wordt opgeschort.
      Het college bericht het betrokken vertegenwoordigend orgaan dat het advies is verzonden.

      6 Gedurende de periode dat de begroting of een deel van de begroting is opgeschort met toepassing van het vijfde
      lid, geldt de begroting of het deel van de begroting van het jaar voorafgaande aan het betreffende begrotingsjaar.
      Het bestuur legt deze voorafgaande begroting of het deel daarvan onmiddellijk ter beoordeling voor aan het college.
      [Artikel 12, eerste lid][ref5], en dit artikel zijn voor zover mogelijk van overeenkomstige toepassing op deze
      voorafgaande begroting of het deel daarvan.

      7 Op een advies als bedoeld in het vierde lid, kan de raad van ministers van het Koninkrijk beslissen tot het
      geven van een aanwijzing aan het betreffende bestuur om de begroting zodanig aan te passen dat deze voldoet aan de
      normen, genoemd in [artikel 15][ref6]. Alvorens een voorstel voor een aanwijzing bij de raad van ministers van het
      Koninkrijk wordt ingediend stelt Onze Minister het betrokken bestuur in de gelegenheid zijn visie te geven.

      8 De aanwijzing geschiedt bij koninklijk besluit op de voordracht van Onze Minister.


