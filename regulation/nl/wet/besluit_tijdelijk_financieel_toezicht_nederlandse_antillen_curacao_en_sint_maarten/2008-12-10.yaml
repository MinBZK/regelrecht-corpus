  - number: '27'
    text: |-
      1 Indien op grond van [artikel 26, eerste lid][ref1], tegen een besluit beroep is ingesteld, kan een daartoe door
      de Vice-President aangewezen staatsraad op verzoek een voorlopige voorziening treffen indien onverwijlde spoed,
      gelet op de betrokken belangen, dat vereist.

      2 Een verzoek om voorlopige voorziening kan worden gedaan door het bestuur dat het beroep instelde.

      3 De [artikelen 32 tot en met 35 van de Wet op de Raad van State][ref2] zijn van overeenkomstige toepassing,

      4 De [artikelen 6:5][ref3], [6:6][ref4], [6:14][ref5], [6:15][ref6], [6:17][ref7] en [6:21][ref8], [8:68][ref9],
      [8:72, vijfde lid][ref10], [8:83, eerste, derde en vierde lid, van de Algemene wet bestuursrecht][ref11] zijn van
      overeenkomstige toepassing.

      5 De staatsraad, bedoeld in het eerste lid, doet zo spoedig mogelijk schriftelijk of mondeling uitspraak

      6 De uitspraak strekt tot:

      a. onbevoegdheid van de staatsraad, bedoeld in het eerste lid,

      b. niet-ontvankelijkverklaring van het verzoek,

      c. afwijzing van het verzoek, of

      d. gehele of gedeeltelijke toewijzing van het verzoek.

      7 De staatsraad, bedoeld in het eerste lid, kan de voorlopige voorziening, op verzoek en ambtshalve, opheffen of
      wijzigen, nadat hij partijen heeft gehoord, althans behoorlijk opgeroepen. De [artikelen 6:4, derde lid][ref12],
      [6:5][ref13], [6:6][ref14], [6:14][ref15], [6:15][ref16], [6:17][ref17] en [6:21][ref18],
      [8:83 eerste, derde en vierde lid, van de Algemene wet bestuursrecht][ref19] zijn van overeenkomstige toepassing.

      8 De voorlopige voorziening vervalt, zodra door Ons is beslist, voor zover daarvoor in Ons besluit geen ander
      tijdstip is aangegeven.


