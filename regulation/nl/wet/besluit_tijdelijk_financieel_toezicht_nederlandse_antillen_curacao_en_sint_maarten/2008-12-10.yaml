  - number: '12'
    text: |-
      1 Een advies van het college bevat zijn gemotiveerde bevindingen met betrekking tot de uitgevoerde beoordeling,
      bedoeld in [artikel 15][ref1], en zo nodig zijn aanbevelingen met betrekking tot de wijze waarop een ontvangen
      ontwerpbegroting of vastgestelde begroting, in overeenstemming met de normen, genoemd in [artikel 15][ref2], kan
      worden gebracht.

      2 Het eerste lid is van overeenkomstige toepassing op een ontwerpverordening tot wijziging van een begroting en op
      een vastgestelde verordening tot wijziging van een begroting.


      [ref1]: https://wetten.overheid.nl/BWBR0024823#Artikel15
