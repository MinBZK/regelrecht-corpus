preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de regeringen van de Nederlandse Antillen en Nederland en de
    bestuurscolleges van Curaçao en Sint Maarten zijn overeengekomen

    Zo is het, dat Wij, de Raad van State van het Koninkrijk gehoord, en met gemeen overleg der Staten-Generaal, de
    bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde, hebben goedgevonden en verstaan, gelijk Wij
    goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder: - *begroting:* begroting, bedoeld in de onderscheiden Staatsregelingen van de
      landen;
        - *bestuur:* raad van ministers van het land Curaçao onderscheidenlijk ministerraad van het land Sint Maarten;
        - *collectieve sector:* land Curaçao onderscheidenlijk land Sint Maarten tezamen met de rechtspersonen die met
      toepassing van [artikel 23][ref1] als zodanig zijn aangewezen;
        - *college:* College financieel toezicht Curaçao en Sint Maarten, bedoeld in [artikel 2, eerste lid][ref2];
        - *landen:* landen Curaçao en Sint Maarten;
        - *land:* land Curaçao of land Sint Maarten;
        - *geconsolideerde schuld:* gezamenlijke schulden van de collectieve sector van een land in de vorm van leningen en
      betalingsachterstanden, met uitzondering van de onderlinge schulden binnen de desbetreffende collectieve sector;
        - *kapitaaluitgaven:* uitgaven die ingevolge de geldende definitie van het System of National Accounts van de
      Verenigde Naties op de kapitaaldienst van de overheidsrekening worden geboekt;
        - *Onze Minister:* Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;
        - *rentelast:* uitgaven aan rente, toerekenbaar aan een begrotingsjaar, over de geconsolideerde schuld van een
      land;
        - *rentelastnorm:* rentelast die overeenkomt met 5% van de gemiddelde gerealiseerde gezamenlijke inkomsten van
      de collectieve sector van een land, over de drie jaren voorafgaand aan het jaar waarin de begroting is of wordt
      ingediend;
        - *Staten:* Staten van een land.


      [ref1]: https://wetten.overheid.nl/BWBR0028132#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0028132#Artikel2
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028132
        artikel: '23'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0028132
        artikel: '2'
        hoofdstuk: '2'
  - number: '2.1'
    text: Er is een College financieel toezicht Curaçao en Sint Maarten.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel2
  - number: '2.2'
    text: Het college bestaat uit vier leden waaronder een voorzitter.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel2
  - number: '2.3'
    text: |-
      De voorzitter en de andere leden worden op grond van deskundigheid benoemd. Over de benoeming beslist de raad van
      ministers van het Koninkrijk volgens de volgende procedure:
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel2
  - number: 2.3.a
    text: |-
      de voorzitter op aanbeveling van Onze Minister-President, in zijn hoedanigheid van voorzitter van de raad van
      ministers van het Koninkrijk;
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel2
  - number: 2.3.b
    text: |-
      een lid in overeenstemming met het gevoelen van de raad van ministers van Curaçao op aanbeveling van Onze Minister-
      President van dat land;
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel2
  - number: 2.3.c
    text: |-
      een lid in overeenstemming met het gevoelen van de ministerraad van Sint Maarten op aanbeveling van Onze Minister-
      President van dat land;
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel2
  - number: 2.3.d
    text: |-
      een lid in overeenstemming met het gevoelen van de Nederlandse ministerraad op aanbeveling van Onze Minister-
      President van dat land.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel2
  - number: '2.4'
    text: De leden worden benoemd bij koninklijk besluit op voordracht van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel2
  - number: '2.5'
    text: De leden van het college oefenen hun functie uit zonder last of ruggespraak.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel2
  - number: '2.6'
    text: De leden worden benoemd voor een periode van drie jaar. Herbenoeming is mogelijk.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel2
  - number: '2.7'
    text: Een lid wordt op eigen verzoek ontslagen.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel2
  - number: '2.8'
    text: |-
      Een lid kan worden geschorst of ontslagen wegens ongeschiktheid voor de vervulde functie, dan wel wegens andere
      zwaarwegende in zijn persoon gelegen redenen, dan wel wegens het aanvaarden van een ambt, betrekking of functie als
      bedoeld in [artikel 3, eerste en tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028132#Artikel3
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028132
        artikel: '3'
        hoofdstuk: '2'
  - number: '2.9'
    text: |-
      De raad van ministers van het Koninkrijk beslist over schorsing en ontslag. Schorsing en ontslag geschieden
      bij koninklijk besluit op voordracht van Onze Minister. Over ontslag wordt het aanbevelende bestuur vooraf
      geconsulteerd.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel2
  - number: '2.10'
    text: |-
      Voorafgaande aan een ontslag of een schorsing als bedoeld in het achtste lid wordt het college gehoord, tenzij de
      omstandigheden met betrekking tot het ontslag of de schorsing dat horen belemmeren.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel2
  - number: '2.11'
    text: |-
      Onze Minister stelt in overeenstemming met Onze Ministers van Financiën van de landen de vaste
      vergoeding van de leden van het college vast. Hierbij wordt de toepasselijke salarisschaal van
      [bijlage B van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren][ref1] en de toepasselijke
      deeltijdfactor aangegeven. De leden hebben voorts overeenkomstig het [Reisbesluit binnenland][ref2] en het
      [Reisbesluit buitenland][ref3] recht op vergoeding van reis- en verblijfskosten. Daarnaast hebben de leden op
      declaratiebasis recht op vergoeding van kosten van internationale telefoongesprekken die zij maken in het kader van
      de werkzaamheden voor het college.


      [ref1]: https://wetten.overheid.nl/BWBR0003630
      [ref2]: https://wetten.overheid.nl/BWBR0005889
      [ref3]: https://wetten.overheid.nl/BWBR0006842
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003630
      - id: ref2
        bwb_id: BWBR0005889
      - id: ref3
        bwb_id: BWBR0006842
  - number: '3.1'
    text: 'Een lid van het college kan niet tevens zijn:'
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel3
  - number: 3.1.a
    text: Gouverneur;
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel3
  - number: 3.1.b
    text: minister of staatssecretaris;
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel3
  - number: 3.1.c
    text: commissaris van de Koning of gedeputeerde;
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel3
  - number: 3.1.d
    text: lid van de Staten of van een daarmee vergelijkbaar orgaan van Nederland;
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel3
  - number: 3.1.e
    text: burgemeester of wethouder dan wel gezaghebber of eilandgedeputeerde;
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel3
  - number: 3.1.f
    text: lid van de Raad van Advies van een van de landen;
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel3
  - number: 3.1.g
    text: lid van de Raad van State van het Koninkrijk;
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel3
  - number: 3.1.h
    text: lid van de Algemene Rekenkamer van een van de landen of van Nederland;
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel3
  - number: 3.1.i
    text: ombudsman of substituut-ombudsman van een van de landen of van Nederland;
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel3
  - number: 3.1.j
    text: ambtenaar bij een ministerie of een daaronder ressorterende instelling, dienst of bedrijf.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel3
  - number: '3.2'
    text: |-
      Een lid vervult ook overigens geen andere betrekking of nevenfunctie die overigens ongewenst is met het oog op een
      goede vervulling van zijn functie of de handhaving van zijn onafhankelijkheid of van het vertrouwen daarin.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel3
  - number: '3.3'
    text: |-
      Een lid meldt het voornemen tot het aanvaarden van een andere betrekking of nevenfunctie aan het college. Het
      college informeert Onze Minister en de besturen.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel3
  - number: '3.4'
    text: |-
      Het college maakt de nevenfuncties van een lid openbaar. Openbaarmaking geschiedt bij zijn benoeming en voorts
      door jaarlijkse publicatie van een opgave van deze nevenfuncties in de Staatscourant, de Curaçaosche Courant en de
      Landscourant Sint Maarten.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel3
  - number: '4.1'
    text: 'De taken van het college zijn, onverminderd de in andere artikelen van deze wet genoemde taken:'
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel4
  - number: 4.1.a
    text: |-
      het toezicht op de toepassing door de landen van de normen, genoemd in [artikel 15][ref1], bij de uitvoering en de
      verantwoording van de begroting en bij het betalingsverkeer;


      [ref1]: https://wetten.overheid.nl/BWBR0028132#Artikel15
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028132
        artikel: '15'
        hoofdstuk: '4'
  - number: 4.1.b
    text: |-
      het toetsen of de landen voldoen aan de in deze wet vastgelegde voorwaarden voor het aangaan van rentedragende
      leningen en rentedragende kredieten;
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel4
  - number: 4.1.c
    text: |-
      het rapporteren aan en adviseren van Onze Ministers van Financiën van de landen, de beide Staten, de besturen en,
      door tussenkomst van Onze Minister, de raad van ministers van het Koninkrijk;
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel4
  - number: 4.1.d
    text: het toezicht op de voortgang van de implementatie van de verbetering van het financieel beheer.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel4
  - number: '4.2'
    text: |-
      Het college zendt eens per half jaar door tussenkomst van Onze Minister een schriftelijk verslag over zijn
      werkzaamheden aan de raad van ministers van het Koninkrijk en aan de besturen, de beide Kamers der Staten-Generaal,
      en de beide Staten.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel4
  - number: '4.3'
    text: |-
      Het college verstrekt desgevraagd inlichtingen over zijn werkzaamheden aan Onze Minister, aan Onze Minister van
      Financiën van Nederland en aan de besturen.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel4
  - number: '4.4'
    text: |-
      Onze Minister kan, na instemming van de raad van ministers van het Koninkrijk, die handelt in overeenstemming met
      de besturen, beleidsregels vaststellen en algemene en bijzondere aanwijzingen geven ten aanzien van de uitoefening
      van de in deze wet aan het college toegekende taken en bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel4
  - number: '5.1'
    text: |-
      Het college stelt ter uitvoering van de in [artikel 4][ref1] genoemde taken een bestuursreglement vast, waarin in
      ieder geval regels over de besluitvorming, werkwijze en procedures zijn opgenomen. In het reglement worden tevens
      regels opgenomen over de verdeling van de werkzaamheden bij de voorbereiding van de besluiten en adviezen van het
      college.


      [ref1]: https://wetten.overheid.nl/BWBR0028132#Artikel4
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028132
        artikel: '4'
        hoofdstuk: '2'
  - number: '5.2'
    text: |-
      Het bestuursreglement wordt bekendgemaakt in de Staatscourant, de Curaçaosche Courant en de Landscourant Sint
      Maarten.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel5
  - number: '5.3'
    text: |-
      De voorzitter en de secretaris van het college zien toe op een doelmatige en voorspoedige uitvoering van de taken
      van het college.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel5
  - number: '5.4'
    text: |-
      Een lid kan zich doen vertegenwoordigen, mits daartoe schriftelijk volmacht is verleend aan een ander lid. De
      voorzitter beoordeelt de deugdelijkheid van de volmacht. Een lid kan slechts voor één ander lid als gevolmachtigde
      optreden.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel5
  - number: '5.5'
    text: |-
      Het college streeft bij het nemen van besluiten naar consensus. Indien bij het nemen van besluiten door het college
      de stemmen staken, heeft de voorzitter de doorslaggevende stem.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel5
  - number: '6.1'
    text: Het college heeft een secretaris.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel6
  - number: '6.2'
    text: Aan de secretaris kunnen medewerkers worden toegevoegd.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel6
  - number: '6.3'
    text: |-
      De secretaris en de medewerkers worden op voordracht van het college vanwege Onze Minister aan het college ter
      beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel6
  - number: '6.4'
    text: |-
      De secretaris en de medewerkers staan onder gezag van het college en leggen uitsluitend aan het college
      verantwoording af.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel6
  - number: '6.5'
    text: De secretaris en de medewerkers zijn geen lid van het college.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel6
  - number: '6.6'
    text: |-
      De secretaris en de medewerkers van het college ondersteunen tevens het college financieel toezicht Bonaire, Sint
      Eustatius en Saba, zoals vastgelegd in de Wet financiele verhoudingen openbare lichamen Bonaire, Sint Eustatius
      en Saba.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel6
  - number: '7'
    text: |-
      De leden, de secretaris en de medewerkers van het college alsmede hun echtgenoten of geregistreerde partners
      en minderjarige kinderen voor zover zij met hen een gemeenschappelijke huishouding voeren, zijn van rechtswege
      toegelaten tot de landen. Aan de leden, de secretaris en de medewerkers van het college alsmede hun echtgenoten of
      geregistreerde partners worden geen nadere voorwaarden gesteld voor de uitoefening van een beroep of het verrichten
      van arbeid.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel7
  - number: '8.1'
    text: |-
      De besturen verstrekken het college alle inlichtingen die het voor de uitoefening van zijn taken nodig acht.
      Hiertoe behoren de gegevens van de desbetreffende collectieve sector van de landen.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel8
  - number: '8.2'
    text: |-
      De besturen verlenen het college dan wel door hem aangewezen vertegenwoordigers, te allen tijde toegang tot dan wel
      inzage in alle goederen, administraties, documenten en andere informatiedragers.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel8
  - number: '8.3'
    text: |-
      Het college neemt de met betrekking tot natuurlijke personen en rechtspersonen in de desbetreffende landen geldende
      geheimhoudingsbepalingen in acht.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel8
  - number: '9'
    text: |-
      De bezoldiging van de leden, de secretaris en de medewerkers van het college, alsmede de bekostiging van de overige
      apparaatsuitgaven komen ten laste van de begroting van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel9
  - number: '10.1'
    text: |-
      Indien naar het oordeel van de raad van ministers van het Koninkrijk het college bij de uitoefening van zijn taak
      ernstig in gebreke blijft, kan Onze Minister, in overeenstemming met de besturen, de noodzakelijke voorzieningen
      treffen.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel10
  - number: '10.2'
    text: |-
      Deze voorzieningen worden, spoedeisende gevallen uitgezonderd, niet eerder getroffen dan nadat het college in de
      gelegenheid is gesteld om binnen een door de raad van ministers van het Koninkrijk te stellen termijn alsnog zijn
      taak naar behoren uit te voeren.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel10
  - number: '11.1'
    text: |-
      Op verzoek van een bestuur adviseert het college binnen veertien dagen na dat verzoek op een ontwerpbegroting of
      ontwerpverordening tot wijziging van een begroting. Het college kan een bestuur ook ongevraagd adviseren op de
      betreffende ontwerpbegroting of ontwerpverordening tot wijziging van een begroting.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel11
  - number: '11.2'
    text: |-
      Indien advies is uitgebracht op een ontwerpbegroting of een ontwerpverordening tot wijziging van een begroting,
      gaat dat bij de Staten ingediende ontwerp vergezeld van dat advies. De indiener geeft in dat geval bij het ontwerp
      aan in hoeverre en op welke wijze rekening is gehouden met het advies.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel11
  - number: '11.3'
    text: |-
      Naast de gevallen, bedoeld in het eerste lid, kan het college ook overigens bij de begrotingsvoorbereiding gevraagd
      en ongevraagd adviseren
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel11
  - number: '12.1'
    text: |-
      Het bestuur zendt een begroting of een verordening tot wijziging van de begroting, onmiddellijk nadat deze is
      vastgesteld, aan het college.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel12
  - number: '12.2'
    text: |-
      Indien het college van oordeel is dat de in het eerste lid bedoelde vastgestelde begroting respectievelijk de in
      dat lid bedoelde vastgestelde verordening tot wijziging van de begroting geheel of ten dele niet in overeenstemming
      is met de normen, genoemd in [artikel 15][ref1], brengt het college een advies uit aan het desbetreffende bestuur
      binnen veertien dagen na ontvangst van die vastgestelde begroting dan wel vastgestelde verordening tot wijziging
      van de begroting.


      [ref1]: https://wetten.overheid.nl/BWBR0028132#Artikel15
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0028132
        artikel: '15'
        hoofdstuk: '4'
  - number: '12.3'
    text: |-
      Het advies, bedoeld in het tweede lid, bevat de gemotiveerde bevindingen met betrekking tot de uitgevoerde
      beoordeling, bedoeld in [artikel 15][ref1], en zo nodig aanbevelingen met betrekking tot de wijze waarop
      de desbetreffende vastgestelde begroting dan wel vastgestelde verordening tot wijziging van de begroting in
      overeenstemming met de normen, genoemd in artikel 15, kan worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0028132#Artikel15
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0028132
        artikel: '15'
        hoofdstuk: '4'
  - number: '12.4'
    text: |-
      Indien een advies als bedoeld in het tweede lid aanbevelingen bevat als bedoeld in het derde lid, deelt het
      desbetreffende bestuur binnen veertien dagen na ontvangst van dat rapport aan het college mee in hoeverre en op
      welke wijze rekening wordt gehouden met die aanbevelingen en, indien aan de orde, onder vermelding van de termijnen
      die daarbij in acht zullen worden genomen.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel12
  - number: '12.5'
    text: |-
      Indien naar het oordeel van het college het bestuur met de in het vierde lid bedoelde mededeling niet of niet
      voldoende de normen, genoemd in [artikel 15][ref1], in acht neemt, dan wel indien het bestuur nalaat die mededeling
      aan het college te doen, geeft het college binnen veertien dagen na ontvangst van de mededeling, respectievelijk na
      het uitblijven ervan, daarover bericht aan het desbetreffende bestuur en aan de Staten.


      [ref1]: https://wetten.overheid.nl/BWBR0028132#Artikel15
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0028132
        artikel: '15'
        hoofdstuk: '4'
  - number: '13.1'
    text: |-
      Indien na ten minste zeven dagen na verzending van het bericht, bedoeld in [artikel 12, vijfde lid][ref1], naar
      het oordeel van het college sprake blijft van een begroting, respectievelijk een verordening tot wijziging van de
      begroting die geheel of ten dele niet voldoet aan de normen, genoemd in [artikel 15][ref2], bericht het college na
      afloop van die periode dienaangaande de raad van ministers van het Koninkrijk door tussenkomst van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0028132#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0028132#Artikel15
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028132
        artikel: '12'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0028132
        artikel: '15'
        hoofdstuk: '4'
  - number: '13.2'
    text: |-
      Een bericht als bedoeld in het eerste lid kan vergezeld gaan van een gemotiveerd advies tot het geven van een
      aanwijzing als bedoeld in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel13
  - number: '13.3'
    text: |-
      Het college zendt gelijk met het advies, bedoeld in het tweede lid, een afschrift daarvan aan het desbetreffende
      bestuur, waarna dat bestuur zonodig beslist of de uitvoering van de begroting of een deel daarvan wordt opgeschort.
      Het college bericht de betrokken Staten dat het advies is verzonden.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel13
  - number: '13.4'
    text: |-
      Gedurende de periode dat de begroting of een deel van de begroting is opgeschort met toepassing van het derde lid,
      geldt de begroting of het deel van de begroting van het jaar voorafgaande aan het desbetreffende begrotingsjaar.
      Het bestuur legt deze voorafgaande begroting of het desbetreffende deel daarvan onmiddellijk ter beoordeling voor
      aan het college. [Artikel 12, tweede tot en met vijfde lid][ref1], alsmede het eerste tot en met derde, vijfde en
      zesde lid van dit artikel zijn voor zover mogelijk van overeenkomstige toepassing op deze voorafgaande begroting of
      het deel daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0028132#Artikel12
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028132
        artikel: '12'
        hoofdstuk: '3'
  - number: '13.5'
    text: |-
      Op een advies als bedoeld in het tweede lid kan de raad van ministers van het Koninkrijk concluderen tot het
      geven van een aanwijzing aan het betreffende bestuur om de begroting zodanig aan te passen dat deze voldoet aan
      de normen, genoemd in [artikel 15][ref1]. Alvorens een aanwijzing wordt gegeven, stelt Onze Minister het betrokken
      bestuur in de gelegenheid om zijn visie te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0028132#Artikel15
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028132
        artikel: '15'
        hoofdstuk: '4'
  - number: '13.6'
    text: |-
      Een aanwijzing als bedoeld in het vijfde lid geschiedt bij koninklijk besluit op de voordracht van Onze Minister,
      in overeenstemming met de conclusie van de raad van ministers van het Koninkrijk.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel13
  - number: '14.1'
    text: |-
      Als het college op 15 december nog geen vastgestelde begroting heeft ontvangen en er naar zijn oordeel ook geen
      uitzicht bestaat dat binnen een redelijke termijn alsnog een ontwerpbegroting, respectievelijk een vastgestelde
      begroting zal worden toegezonden, bericht het college dienaangaande de raad van ministers van het Koninkrijk door
      tussenkomst van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel14
  - number: '14.2'
    text: |-
      Een bericht van het college als bedoeld in het eerste lid kan vergezeld gaan van een gemotiveerd advies tot het
      geven van een aanwijzing.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel14
  - number: '14.3'
    text: |-
      Het college zendt gelijk met het advies, bedoeld in het tweede lid, een afschrift daarvan aan het desbetreffende
      bestuur en bericht de Staten dat het advies is verzonden.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel14
  - number: '14.4'
    text: |-
      Op een advies als bedoeld in het tweede lid kan de raad van ministers van het Koninkrijk concluderen tot het geven
      van een aanwijzing aan het desbetreffende bestuur alsnog een ontwerpbegroting, respectievelijk een vastgestelde
      begroting ter beoordeling toe te zenden aan het college. Alvorens een voorstel voor een aanwijzing bij de raad van
      ministers van het Koninkrijk wordt ingediend stelt Onze Minister het betrokken bestuur in de gelegenheid zijn visie
      te geven.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel14
  - number: '14.5'
    text: |-
      De aanwijzing geschiedt bij koninklijk besluit op de voordracht van Onze Minister, in overeenstemming met de
      conclusie van de raad van ministers van het Koninkrijk.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel14
  - number: '14.6'
    text: |-
      Indien bij de aanvang van een begrotingsjaar er geen op dat jaar betrekking hebbende begroting is vastgesteld,
      strekt de begroting van het aan het betrokken begrotingsjaar voorafgaande jaar tot grondslag van het beheer.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel14
  - number: '15.1'
    text: |-
      Voor de beoordeling van de vastgestelde begroting van een land en een vastgestelde verordening tot wijziging van de
      begroting hanteert het college de volgende normen:
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel15
  - number: 15.1.a
    text: |-
      de in de begroting en de meerjarige begroting opgenomen uitgaven op de gewone dienst worden gedekt door de ter
      dekking van die uitgaven opgenomen middelen;
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel15
  - number: 15.1.b
    text: |-
      de in de begroting en de meerjarige begroting opgenomen uitgaven op de kapitaaldienst worden gedekt door de ter
      dekking van die uitgaven opgenomen middelen, rekening houdend met de verwachte ontvangsten uit de opbrengst van
      geldleningen;
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel15
  - number: 15.1.c
    text: de rentelastnorm wordt niet overschreden.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel15
  - number: '15.2'
    text: 'Bij de beoordeling, bedoeld in het eerste lid, worden de volgende aspecten betrokken:'
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel15
  - number: 15.2.a
    text: in de begroting en de meerjarige begroting zijn alle verwachte uitgaven en verwachte ontvangsten opgenomen;
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel15
  - number: 15.2.b
    text: de in de begroting opgenomen ontvangsten en uitgaven worden toereikend toegelicht;
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel15
  - number: 15.2.c
    text: de begroting is zodanig ingericht dat zij voldoet aan de criteria van ordelijkheid en controleerbaarheid.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel15
  - number: '15.3'
    text: Bij de begroting wordt een uiteenzetting verstrekt van de financiële toestand van het land.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel15
  - number: '16.1'
    text: |-
      In de begrotingen, bedoeld in [artikel 15][ref1], worden de voornemens tot het aantrekken van geldleningen
      opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028132#Artikel15
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028132
        artikel: '15'
        hoofdstuk: '4'
  - number: '16.2'
    text: |-
      Van de aangetrokken leningen wordt melding gemaakt in de uitvoeringsrapportages, bedoeld in [artikel 18][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028132#Artikel18
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028132
        artikel: '18'
        hoofdstuk: '5'
  - number: '16.3'
    text: |-
      De besturen informeren het college, als bij de uitvoering van de begroting de omvang van een lening het begrote
      leningbedrag dreigt te overschrijden.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel16
  - number: '16.4'
    text: |-
      Op basis van de voornemens tot het aantrekken van geldleningen, bedoeld in het eerste lid, de meldingen, bedoeld
      in het tweede lid, en de verstrekte informatie, bedoeld in het derde lid, beoordeelt het college of het bestuur
      voldoet aan de normen, genoemd in [artikel 15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028132#Artikel15
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028132
        artikel: '15'
        hoofdstuk: '4'
  - number: '16.5'
    text: |-
      Het college beoordeelt tevens of wordt voldaan aan de afspraken over de verbeteringen van het financieel beheer,
      voor zover deze betrekking hebben op het aantrekken van leningen.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel16
  - number: '16.6'
    text: |-
      Indien geldleningen ten laste van een land worden aangetrokken in het kader van een open biedingprocedure bij de
      centrale bank van Curaçao en van Sint Maarten, gebeurt dat aantrekken in overeenstemming met een advies daarover
      van die bank.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel16
  - number: '16.7'
    text: |-
      De Nederlandse Staat heeft een lopende inschrijving op de leningen bedoeld in het zesde lid, telkens voor het
      gevraagde leningbedrag, tegen het actuele rendement op staatsleningen van de desbetreffende looptijd.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel16
  - number: '16.8'
    text: |-
      Bij een open biedingsproces als bedoeld in het zesde lid, hebben bij gelijke leningvoorwaarden lokale
      inschrijvingen voorrang.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel16
  - number: '16.9'
    text: |-
      Indien geldleningen ten laste van een land onderhands worden aangetrokken, worden telkens naast Nederland ook een
      of meerdere derde partijen in de gelegenheid gesteld om gelijktijdig een aanbod te doen en wordt er vervolgens
      aangetrokken daar waar de leningvoorwaarden het meest gunstig zijn. Voor de Nederlandse Staat geldt in dit verband
      het aanbod, bedoeld in het zevende lid. Het achtste lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel16
  - number: '16.10'
    text: |-
      Het bestuur bericht het college over een voornemen tot het onderhands aantrekken van een geldlening, onder
      bijvoeging van de voorwaarden van de aangeboden geldleningen. Het college adviseert op basis van een onderlinge
      vergelijking van de leningvoorwaarden binnen veertien dagen na ontvangst van dat bericht. Indien een bestuur
      afwijkt van het advies van het college, geschiedt dat met een gemotiveerd besluit. Het bestuur informeert het
      college over het genomen besluit.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel16
  - number: '16.11'
    text: |-
      Het college kan de raad van ministers van het Koninkrijk door tussenkomst van Onze Minister berichten als blijkt
      dat een bestuur afwijkt van het advies, bedoeld in het tiende lid. Bij dat bericht kan het college adviseren tot
      het nemen van een besluit als bedoeld in het twaalfde lid. Het college zendt gelijk met het advies een afschrift
      daarvan aan het desbetreffende bestuur en bericht de Staten dat het advies is verzonden.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel16
  - number: '16.12'
    text: |-
      Op een advies als bedoeld in het elfde lid kan de raad van ministers van het Koninkrijk concluderen tot het
      geven van een aanwijzing met betrekking tot het onderhands aangaan van leningen. Alvorens een voorstel voor een
      aanwijzing bij de raad van ministers van het Koninkrijk wordt ingediend stelt Onze Minister het betrokken bestuur
      in de gelegenheid zijn visie te geven.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel16
  - number: '16.13'
    text: |-
      Het geven van de aanwijzing geschiedt bij koninklijk besluit op de voordracht van Onze Minister, in overeenstemming
      met de conclusie van de raad van ministers van het Koninkrijk.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel16
  - number: '17.1'
    text: |-
      Indien het bestuur nalaat een voorziening ter uitvoering van een beleidsvoornemen te treffen of deze op een zodanig
      tijdstip vaststelt, implementeert of uitvoert dat de haalbaarheid van de uitgaven- en ontvangstenramingen in gevaar
      komt, adviseert het college hierover overeenkomstig [artikel 12, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028132#Artikel12
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0028132
        artikel: '12'
        hoofdstuk: '3'
  - number: '17.2'
    text: |-
      Het college adviseert eveneens overeenkomstig [artikel 12, derde lid][ref1], indien het vertegenwoordigende orgaan
      niet met een voorgestelde voorziening instemt of daarmee op een zodanig tijdstip instemt dat de haalbaarheid van de
      uitgaven- en ontvangstenramingen in gevaar komt.


      [ref1]: https://wetten.overheid.nl/BWBR0028132#Artikel12
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0028132
        artikel: '12'
        hoofdstuk: '3'
  - number: '17.3'
    text: |-
      Op een advies als bedoeld in het eerste en tweede lid, is [artikel 13][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028132#Artikel13
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0028132
        artikel: '13'
        hoofdstuk: '3'
  - number: '18.1'
    text: |-
      De besturen zenden uiterlijk zes weken na afloop van ieder kwartaal een uitvoeringsrapportage aan het college en
      aan de Staten.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel18
  - number: '18.2'
    text: |-
      Het college en de besturen stellen ten behoeve van de uitvoeringsrapportage gezamenlijk een model vast,
      dat aangeeft over welke onderwerpen gerapporteerd wordt. Hiertoe behoort in ieder geval informatie over de
      uitputting van de begroting en de daarmee samenhangende resterende verplichtingenruimte, over eventuele nieuwe
      beleidsvoornemens met financiële consequenties en over mee- en tegenvallers in de uitvoering van de begroting.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel18
  - number: '18.3'
    text: |-
      Indien uit de uitvoeringsrapportage over het vierde kwartaal blijkt dat sprake is van een tekort op de gewone
      dienst of van een overschrijding van de rentelastnorm, geeft het bestuur in die rapportage aan welke maatregelen
      worden voorgenomen ter compensatie van het tekort, respectievelijk de overschrijding.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel18
  - number: '18.4'
    text: |-
      Uiterlijk op 31 augustus van ieder jaar verstrekken de besturen een afschrift van de vastgestelde jaarrekening over
      het voorafgaande jaar aan het college.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel18
  - number: '18.5'
    text: |-
      Indien de jaarrekening op het tijdstip, genoemd in het vierde lid, nog niet is vastgesteld, verstrekken de besturen
      de in voorbereiding zijnde jaarrekening naar de stand van dat tijdstip. Het bestuur verstrekt de bevindingen van de
      desbetreffende Algemene Rekenkamer en van de interne accountant op het ontwerp van de jaarrekening onmiddellijk na
      de ontvangst van die bevindingen aan het college.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel18
  - number: '18.6'
    text: |-
      Indien uit de vastgestelde jaarrekening blijkt dat sprake is van een tekort op de gewone dienst of van een
      overschrijding van de rentelastnorm, geeft het bestuur tegelijk met de jaarrekening aan welke maatregelen worden
      voorgenomen ter compensatie van het tekort, respectievelijk de overschrijding.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel18
  - number: '18.7'
    text: |-
      Het college beoordeelt de voorgenomen maatregelen, bedoeld in het derde en het zesde lid, aan de hand van de
      normen, genoemd in [artikel 15][ref1], en zendt het bestuur binnen veertien dagen na ontvangst van de betreffende
      uitvoeringsrapportage een advies overeenkomstig [artikel 12, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028132#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0028132#Artikel12
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028132
        artikel: '15'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0028132
        artikel: '12'
        hoofdstuk: '3'
  - number: '18.8'
    text: |-
      Op een advies als bedoeld in het zevende lid, zijn de [artikelen 12, vierde en vijfde lid][ref1], en [13][ref2] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028132#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0028132#Artikel13
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028132
        artikel: '12'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0028132
        artikel: '13'
        hoofdstuk: '3'
  - number: '19.1'
    text: |-
      De besturen rapporteren uiterlijk zes weken na afloop van ieder kwartaal aan het college over de uitvoering van de
      implementatieplannen ter verbetering van het financieel beheer. Het college en de besturen stellen ten behoeve van
      die rapportage gezamenlijk een model vast, dat aangeeft over welke onderwerpen gerapporteerd wordt.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel19
  - number: '19.2'
    text: Het college kan de besturen ter zake van de uitvoering van de implementatieplannen aanbevelingen geven.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel19
  - number: '19.3'
    text: |-
      Het college kan aanbevelingen geven op het terrein van het financieel beheer, rekening houdend met de bevindingen
      van de interne accountant en van de Algemene Rekenkamers van Curaçao en van Sint Maarten.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel19
  - number: '20.1'
    text: |-
      De besturen gaan uitsluitend financiële verplichtingen aan voor zover deze zijn opgenomen in een begroting die niet
      ingevolge [artikel 13][ref1] is opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0028132#Artikel13
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028132
        artikel: '13'
        hoofdstuk: '3'
  - number: '20.2'
    text: |-
      De besturen leggen het voornemen tot het aangaan van een financiële verplichting, voor zover het de limieten voor
      financieel zelfbeheer, zoals die gelden bij de inwerkingtreding van deze wet, te boven gaat, voor advies voor
      aan een door Onze Minister van Financiën van het desbetreffende land aan te wijzen functionaris of, bij diens
      afwezigheid, aan diens eerste of tweede plaatsvervanger. Een positief advies wordt verleend indien de financiële
      verplichting voortvloeit uit de uitvoering van de begroting. De in de eerste volzin bedoelde limieten kunnen na
      overleg met het college gewijzigd worden.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel20
  - number: '20.3'
    text: |-
      Indien het bestuur financiële verplichtingen aangaat zonder of in afwijking van een positief advies als bedoeld
      in het tweede lid, kan Onze Minister van Financiën van het betrokken land voorafgaand toezicht instellen op het
      aangaan van financiële verplichtingen in de zin dat ten laste van de desbetreffende begroting of bepaalde artikelen
      van die begroting alleen financiële verplichtingen mogen worden aangegaan nadat hij daarmee heeft ingestemd. Gelijk
      met het instellen van voorafgaand toezicht bericht die minister daarvan aan de betrokken Staten met een afschrift
      aan het college.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel20
  - number: '20.4'
    text: |-
      In de uitvoeringsrapportages, bedoeld in [artikel 18, eerste lid][ref1], wordt tevens gerapporteerd over de
      gevallen waarin het bestuur financiële verplichtingen is aangegaan zonder of in afwijking van een positief advies,
      als bedoeld in het tweede lid, en over de gevallen waarin toepassing is gegeven aan het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028132#Artikel18
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028132
        artikel: '18'
        hoofdstuk: '5'
  - number: '20.5'
    text: |-
      Indien het bestuur financiële verplichtingen aangaat zonder of in afwijking van een positief advies als bedoeld in
      het tweede lid, en het voorafgaand toezicht door Onze Minister van Financiën van het betrokken land uitblijft of
      niet toereikend is, kan het college Onze Minister van Financiën van het betrokken land adviseren om een beslissing
      onderscheidenlijk een nadere beslissing te nemen als bedoeld in het derde lid. Het college bericht de betrokken
      Staten dat het advies is verzonden.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel20
  - number: '20.6'
    text: |-
      Indien na het in het vijfde lid bedoelde advies blijkt dat het toezicht door Onze Minister van Financien van het
      betrokken land nog steeds uitblijft dan wel niet toereikend is, kan het college dat berichten aan de raad van
      ministers van het Koninkrijk door tussenkomst van Onze Minister. Bij dat bericht kan het college adviseren tot
      het geven van een aanwijzing als bedoeld in het zevende lid. Gelijk met dat advies zendt het college een afschrift
      daarvan aan het desbetreffende bestuur en bericht het college de betrokken Staten dat het advies is verzonden.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel20
  - number: '20.7'
    text: |-
      Op een advies als bedoeld in het zesde lid, kan de raad van ministers van het Koninkrijk concluderen dat ten laste
      van de desbetreffende begroting of bepaalde artikelen van die begroting geen financiële verplichtingen mogen worden
      aangegaan voordat het college daarmee heeft ingestemd. Alvorens een voorstel voor een aanwijzing bij de raad van
      ministers van het Koninkrijk wordt ingediend stelt Onze Minister het betrokken bestuur in de gelegenheid zijn visie
      te geven.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel20
  - number: '20.8'
    text: |-
      De aanwijzing geschiedt bij koninklijk besluit op de voordracht van Onze Minister, in overeenstemming met de
      conclusie van de raad van ministers van het Koninkrijk.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel20
  - number: '20.9'
    text: |-
      De instemming, bedoeld in het derde lid, en die, bedoeld in het zevende lid, worden verleend als de desbetreffende
      financiële verplichting voldoet aan het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel20
  - number: '20.10'
    text: |-
      In geval van het aangaan van financiële verplichtingen en het verrichten van privaatrechtelijke rechtshandelingen
      waartoe door de Staten van een land is besloten, is dit artikel van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel20
  - number: '21.1'
    text: |-
      Onze Minister van Financiën van het betrokken land houdt een register bij van de namen en functies van degenen die
      zijn gemachtigd tot het verrichten van privaatrechtelijke rechtshandelingen die voortvloeien uit een besluit tot
      het aangaan van financiële verplichtingen. Daarbij geeft hij tevens aan voor welke rechtshandelingen en tot welke
      bedragen zij gemachtigd zijn. Hij publiceert dit register na elke wijziging, maar in elk geval iedere zes maanden.
      Publicatie geschiedt op de website van Onze Minister van Financien van het betrokken land.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel21
  - number: '21.2'
    text: |-
      Bij toepassing van [artikel 20, zevende lid][ref1], wordt, na inwerkingtreding van een koninklijk besluit als
      bedoeld in artikel 20, achtste lid, in het register bij de desbetreffende personen aangetekend dat voor het aangaan
      van verplichtingen de voorafgaande instemming van het college is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0028132#Artikel20
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0028132
        artikel: '20'
        hoofdstuk: '5'
  - number: '21.3'
    text: |-
      Privaatrechtelijke rechtshandelingen betreffende het aangaan van financiële verplichtingen als bedoeld in het
      eerste lid zijn nietig indien zij zijn aangegaan door personen die daartoe blijkens het register, bedoeld in het
      eerste en tweede lid, niet of niet voldoende gemachtigd zijn.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel21
  - number: '21.4'
    text: |-
      In afwijking van het derde lid is een rechtshandeling als bedoeld in dat lid wel rechtsgeldig als de bevoegdheid
      tot het aangaan van de verplichting blijkt uit een ten behoeve van die rechtshandeling verstrekte schriftelijke
      machtiging. Deze machtiging wordt slechts in incidentele gevallen verstrekt.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel21
  - number: '21.5'
    text: Het bestuur verstrekt afschriften van de in het vierde lid bedoelde machtigingen aan het college.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel21
  - number: '21.6'
    text: |-
      Het college kan Onze Minister van Financien van het betrokken land aanbevelingen geven ter zake van de wijze waarop
      het beheer wordt gevoerd van het in dit artikel bedoelde register.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel21
  - number: '22.1'
    text: 'De besturen dragen er, in overeenstemming met het college, zorg voor:'
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel22
  - number: 22.1.a
    text: dat het college afschriften ontvangt van de bankrekeningen van het betrokken land;
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel22
  - number: 22.1.b
    text: dat het betrokken land een bankrekening heeft bij de centrale bank van Curaçao en van Sint Maarten;
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel22
  - number: 22.1.c
    text: |-
      dat het betrokken land ten behoeve van het liquiditeitenbeheer een hoofdbankrekening heeft, welke bankrekening bij
      de centrale bank van Curaçao en van Sint Maarten of bij een commerciële bank kan worden aangehouden;
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel22
  - number: 22.1.d
    text: |-
      dat creditsaldi op de rekeningen bij commerciële banken dagelijks worden overgeboekt naar de hoofdbankrekening van
      het betrokken land;
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel22
  - number: 22.1.e
    text: |-
      dat debetsaldi op de rekeningen bij commerciële banken dagelijks worden aangevuld vanaf de hoofdbankrekening van
      het betrokken land.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel22
  - number: '22.2'
    text: |-
      Een debetsaldo op de hoofdbankrekening van een land zal, indien nodig, door de Nederlandse staat worden aangevuld
      via de bankrekening van het land bij de centrale bank van Curaçao en van Sint Maarten. Hierdoor ontstaat een lening
      van het betrokken land bij de Nederlandse Staat.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel22
  - number: '22.3'
    text: Het rentepercentage over de lening, bedoeld in het tweede lid, is gelijk aan de Euro Overnight Index Average.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel22
  - number: '22.4'
    text: |-
      De rentevergoeding over deze lening is relevant voor de normen, genoemd in [artikel 15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028132#Artikel15
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0028132
        artikel: '15'
        hoofdstuk: '4'
  - number: '22.5'
    text: |-
      Het college voert in verband met mogelijke toepassing van het tweede lid periodiek overleg met de besturen over het
      verwachte liquiditeitsverloop.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel22
  - number: '23.1'
    text: |-
      Onze Minister en het desbetreffende bestuur wijzen tweejaarlijks gezamenlijk, na advies van het centraal bureau
      voor de statistiek van dat land in samenwerking met het Centraal Bureau voor de Statistiek van Nederland, voor 1
      april aan welke rechtspersonen met ingang van het volgende begrotingsjaar behoren tot de desbetreffende collectieve
      sector.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel23
  - number: '23.2'
    text: Voor de aanwijzing is het System of National Accounts van de Verenigde Naties leidend.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel23
  - number: '23.3'
    text: Het bestuur stelt de betrokken rechtspersonen schriftelijk in kennis van de aanwijzing.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel23
  - number: '23.4'
    text: |-
      Het bestuur rapporteert jaarlijks voor 1 april aan het college over de voorlopige jaarcijfers over het voorgaande
      kalenderjaar van de desbetreffende collectieve sector.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel23
  - number: '24.1'
    text: |-
      Het centraal bureau voor de statistiek van Curaçao onderscheidenlijk Sint Maarten rapporteert aan het
      desbetreffende bestuur uiterlijk op 1 september over de uitgaven-, ontvangsten-, tekort- en schuldcijfers van
      het voorafgaande jaar van de betrokken collectieve sector. Daarbij zijn de definities van het System of National
      Accounts leidend. Het Centraal Bureau voor de Statistiek Nederland adviseert het centraal bureau voor de statistiek
      van het betrokken land.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel24
  - number: '24.2'
    text: |-
      Het bestuur zendt de rapportage, bedoeld in het eerste lid, binnen twee weken naar het college. Indien uit die
      rapportage blijkt dat een overschrijding van de rentelastnorm dreigt, bericht het bestuur het college gelijktijdig
      met toezending van de rapportage over het beleid dat zal worden gevoerd ter beheersing van de rentelasten.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel24
  - number: '24.3'
    text: |-
      Indien na kennisneming van de rapportage, bedoeld in het eerste lid, naar het oordeel van het college het bestuur
      niet of niet voldoende de dreiging wegneemt van een overschrijding van de rentelastnorm, doet het college binnen
      veertien dagen na ontvangst van de rapportage aan het betrokken bestuur aanbevelingen over de te nemen maatregelen
      ter beheersing van de rentelasten.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel24
  - number: '24.4'
    text: |-
      Indien na ten minste veertien dagen na het doen van de aanbevelingen, bedoeld in het derde lid, naar het oordeel
      van het college sprake blijft van een dreiging van een overschrijding van de rentelastnorm bericht het college na
      afloop van die periode dienaangaande de raad van ministers van het Koninkrijk door tussenkomst van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel24
  - number: '24.5'
    text: |-
      Op het bericht, bedoeld in het vierde lid, is [artikel 13, tweede, vijfde en zesde lid][ref1], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028132#Artikel13
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0028132
        artikel: '13'
        hoofdstuk: '3'
  - number: '25.1'
    text: |-
      Indien dit nodig is in verband met het herstel van schade veroorzaakt door buitengewone gebeurtenissen, waaronder
      natuurrampen, kan het bestuur in overeenstemming met een beslissing daarover van de raad van ministers van het
      Koninkrijk, besluiten af te wijken van de normen, genoemd in [artikel 15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028132#Artikel15
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0028132
        artikel: '15'
        hoofdstuk: '4'
  - number: '25.2'
    text: |-
      Indien in spoedeisende gevallen een beslissing van de raad van ministers van het Koninkrijk niet kan worden
      afgewacht, kan een bestuur in overeenstemming met de voorzitter van de raad van ministers van het koninkrijk
      verplichtingen aangaan die niet voortvloeien uit de uitvoering van de begroting.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel25
  - number: '25.3'
    text: |-
      Indien geen contact mogelijk is met de voorzitter van de raad van ministers van het Koninkrijk kan het bestuur de
      noodzakelijke maatregelen treffen die kunnen leiden tot een afwijking van de normen, genoemd in [artikel 15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028132#Artikel15
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0028132
        artikel: '15'
        hoofdstuk: '4'
  - number: '26.1'
    text: |-
      Tegen een koninklijk besluit als bedoeld in deze wet, houdende een of meer aanwijzingen, of tegen een koninklijk
      besluit als bedoeld in [artikel 33][ref1] staat voor een bestuur gedurende dertig dagen na verzending van
      het besluit beroep open bij Ons. De Raad van State van het Koninkrijk is belast met het voorbereiden van
      het ontwerpbesluit inzake de beslissing op het beroep. Ons besluit wordt in het voor de bekendmaking van
      landsverordeningen gebruikte publicatieblad van het betrokken land bekend gemaakt en ter kennis van het betrokken
      bestuur en de Staten gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0028132#Artikel33
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0028132
        artikel: '33'
        hoofdstuk: '8'
  - number: '26.2'
    text: |-
      De Raad van State van het Koninkrijk kan bij de voorbereiding van het ontwerpbesluit, bedoeld in het eerste lid,
      belanghebbenden, getuigen, deskundigen en tolken oproepen om tijdens het onderzoek ter zitting te worden gehoord.
      De Raad stelt in ieder geval het betrokken bestuur in de gelegenheid te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel26
  - number: '26.3'
    text: |-
      De [artikel 45 van de Wet op de Raad van State][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel45
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002367
        artikel: '45'
  - number: '26.4'
    text: |-
      De [artikelen 6:5][ref1], [6:6][ref2], [6:14][ref3], [6:15][ref4], [6:17][ref5], [6:21][ref6], [8:24][ref7],
      [8:25][ref8], [8:27 tot en met 8:29][ref9], [8:31][ref10], [8:32][ref11], [8:33 tot en met 8:36, eerste lid][ref12],
      [8:39][ref13], [8:50][ref14], [8:61][ref15] en [8:62 van de Algemene wet bestuursrecht][ref16] zijn van
      overeenkomstige toepassing. Ambtsberichten en andere door Onze Minister aangewezen stukken zijn niet openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref8]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref9]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref10]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref11]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref12]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref13]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref14]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref15]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref16]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref7
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref8
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref9
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref10
