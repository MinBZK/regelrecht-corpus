  - number: '27.8'
    text: |-
      De voorlopige voorziening vervalt, zodra door Ons is beslist, voor zover daarvoor in Ons besluit geen ander
      tijdstip is aangegeven.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel27
  - number: '28'
    text: 'De landen hebben regelgeving die voldoet aan internationaal aanvaarde normen op het gebied van:'
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel28
  - number: 28.a
    text: procedures voor vervreemding en verkrijging van aandelen in rechtspersonen door de landen;
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel28
  - number: 28.b
    text: richtlijnen voor het dividendbeleid van rechtspersonen waarin de landen deelnemen, en
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel28
  - number: 28.c
    text: procedures en eisen rond de benoeming en het ontslag van bestuurders van rechtspersonen waarin de landen deelnemen.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel28
  - number: '29.1'
    text: |-
      Voor het bij de inwerkingtreding van deze wet lopende begrotingsjaar wordt onder rentelastnorm verstaan de
      rentelast die overeenkomt met 5% van de voor dat jaar begrote gezamenlijke inkomsten van de collectieve sector van
      een land.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel29
  - number: '29.2'
    text: |-
      Voor het na de inwerkingtreding van deze wet beginnende tweede begrotingsjaar wordt onder rentelastnorm verstaan
      de rentelast die overeenkomt met 5% van de gemiddelde begrote gezamenlijke inkomsten van de collectieve sector van
      een land in het jaar waarop die begroting betrekking heeft en in de begroting van het daaraan voorafgaande jaar,
      na wijziging.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel29
  - number: '29.3'
    text: |-
      Voor het na de inwerkingtreding van deze wet beginnende derde begrotingsjaar wordt onder rentelastnorm verstaan de
      rentelast die overeenkomt met 5% van de gemiddelde gezamenlijke inkomsten van de collectieve sector van een land
      zoals die zijn gerealiseerd in het eerste jaar na inwerkingtreding van deze wet en zoals ze zijn opgenomen in de
      begroting, na wijziging, van het tweede jaar na inwerkingtreding van deze wet en in de begroting van het lopende
      jaar.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel29
  - number: '29.4'
    text: |-
      Voor het na de inwerkingtreding van deze wet beginnende vierde begrotingsjaar wordt onder rentelastnorm verstaan de
      rentelast die overeenkomt met 5% van de gemiddelde gerealiseerde gezamenlijke inkomsten van de collectieve sector
      van een land over de eerste twee jaren na inwerkingtreding van deze wet, en zoals die inkomsten zijn opgenomen in
      de begroting, na wijziging, van het derde jaar na inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel29
  - number: '30.1'
    text: |-
      Onmiddellijk na de inwerkingtreding van deze wet zenden de besturen aan het college een afschrift van de begroting
      voor het jaar van die inwerkingtreding.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel30
  - number: '30.2'
    text: |-
      Het college beoordeelt die begroting overeenkomstig de beoordeling bedoeld in [artikel 12, tweede lid][ref1], en
      rapporteert uiterlijk vier weken na ontvangst van die begroting aan het bestuur overeenkomstig artikel 12, tweede
      lid. Artikel 12, derde tot en met vijfde lid, en [artikel 13][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028132#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0028132#Artikel13
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0028132
        artikel: '12'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0028132
        artikel: '13'
        hoofdstuk: '3'
  - number: '31.1'
    text: |-
      De uitgaven en ontvangsten samenhangende met het verstrekken van leningen als bedoeld in de [artikelen 16][ref1] en
      [22][ref2] door de Staat der Nederlanden aan de landen komen ten laste respectievelijk ten gunste van de begroting
      van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0028132#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0028132#Artikel22
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0028132
        artikel: '16'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0028132
        artikel: '22'
        hoofdstuk: '5'
  - number: '31.2'
    text: |-
      De valutarisico’s samenhangende met het verstrekken van leningen als bedoeld in de [artikelen 16][ref1] en
      [22][ref2] door de Staat der Nederlanden aan de landen komen ten laste respectievelijk ten gunste van de begroting
      van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0028132#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0028132#Artikel22
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0028132
        artikel: '16'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0028132
        artikel: '22'
        hoofdstuk: '5'
  - number: '31.3'
    text: |-
      De Staat der Nederlanden saneert de per 31 december 2005 bestaande schulden van de Nederlandse Antillen, Curaçao en
      Sint Maarten, met inbegrip van de herfinanciering van die schulden en de financiering van de rente op die schulden,
      tot het niveau van de voor het jaar 2005 geldende rentelastnorm en de betalingsachterstanden per 31 december 2005.
      De Staat der Nederlanden neemt de op de datum van inwerkingtreding van deze wet resterende hoofdsom van de in dit
      lid beschreven te saneren schulden over.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel31
  - number: '32'
    text: |-
      Het beheer van de bescheiden betreffende de werkzaamheden van het college wordt in het bestuursreglement, bedoeld
      in [artikel 5, eerste lid][ref1], geregeld. De bescheiden worden na beëindiging van de werkzaamheden van het
      college bewaard in het archief van het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties. De bescheiden
      worden in afschrift ter beschikking gesteld van Curaçao en Sint Maarten.


      [ref1]: https://wetten.overheid.nl/BWBR0028132#Artikel5
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0028132
        artikel: '5'
        hoofdstuk: '2'
  - number: '33.1'
    text: |-
      De raad van ministers van het Koninkrijk beslist vijf jaar na de inwerkingtreding van deze wet of en, zo ja, met
      ingang van welk tijdstip een van de landen of beide een of meer verplichtingen op grond van deze wet blijvend niet
      meer behoeft na te komen.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel33
  - number: '33.2'
    text: |-
      Zolang ten aanzien van een land een of meer verplichtingen op grond van deze wet nog van toepassing zijn, wordt na
      een besluit als bedoeld in het eerste lid drie jaar later opnieuw een besluit genomen en vervolgens telkens binnen
      een periode van drie jaar na ieder besluit.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel33
  - number: '33.3'
    text: |-
      Een besluit als bedoeld in het eerste en tweede lid wordt genomen bij koninklijk besluit op voordracht van Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel33
  - number: '33.4'
    text: |-
      De raad van ministers van het Koninkrijk kan, al dan niet naar aanleiding van een advies daartoe van de
      evaluatiecommissie, bedoeld in het zevende lid, of op een gemotiveerd verzoek van het land, beslissen dat een
      besluit als bedoeld in het tweede lid, op een eerder tijdstip wordt genomen.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel33
  - number: '33.5'
    text: |-
      Indien de raad van ministers van het Koninkrijk een advies of verzoek als bedoeld in het vierde lid, niet opvolgt,
      motiveert hij dit besluit.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel33
  - number: '33.6'
    text: |-
      Een besluit als bedoeld in het eerste en tweede lid wordt niet genomen dan nadat aan de raad van ministers
      van het Koninkrijk een advies is uitgebracht door een evaluatiecommissie als bedoeld in het zevende lid. De
      raad van ministers van het Koninkrijk kan slechts gemotiveerd, op gronden ontleend aan de normen, genoemd in
      [artikel 15][ref1], afwijken van het advies van de evaluatiecommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0028132#Artikel15
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0028132
        artikel: '15'
        hoofdstuk: '4'
  - number: '33.7'
    text: |-
      Onze Minister stelt, in overeenstemming met de raad van ministers van het Koninkrijk, uiterlijk zes maanden
      voorafgaande aan een beslissing als bedoeld in het eerste en tweede lid, in voorkomend geval na toepassing van het
      vierde lid, een evaluatiecommissie in. De evaluatiecommissie bestaat uit vier onafhankelijke leden die op grond van
      deskundigheid en volgens de volgende procedure worden benoemd:
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel33
  - number: 33.7.a
    text: de voorzitter in overeenstemming met Onze Ministers van Financiën van de landen;
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel33
  - number: 33.7.b
    text: een lid in overeenstemming met Onze Minister van Financiën van het land Curaçao;
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel33
  - number: 33.7.c
    text: een lid in overeenstemming met Onze Minister van Financiën van het land Sint Maarten;
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel33
  - number: 33.7.d
    text: een lid, aan te wijzen door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel33
  - number: '33.8'
    text: Een evaluatiecommissie kan zich ter uitvoering van haar werkzaamheden laten ondersteunen.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel33
  - number: '33.9'
    text: |-
      Een evaluatiecommissie brengt uiterlijk drie maanden nadat deze is ingesteld, door tussenkomst van Onze Minister,
      advies uit aan de raad van ministers van het Koninkrijk. Het advies bevat gemotiveerde oordelen en aanbevelingen.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel33
  - number: '33.10'
    text: 'Het advies van de evaluatiecommissie bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel33
  - number: 33.10.a
    text: |-
      een oordeel over de vraag of het desbetreffende land structureel voldoet aan de normen, genoemd in
      [artikel 15][ref1], en of alsdan het te nemen besluit, bedoeld in het eerste onderscheidenlijk het tweede lid,
      kan inhouden dat de verplichtingen op grond van deze wet blijvend niet meer behoeven te worden nagekomen door het
      desbetreffende land;


      [ref1]: https://wetten.overheid.nl/BWBR0028132#Artikel15
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0028132
        artikel: '15'
        hoofdstuk: '4'
  - number: 33.10.b
    text: |-
      een oordeel of er sprake is van niet aan het desbetreffende land te wijten omstandigheden, waaronder die genoemd in
      [artikel 25][ref1], die het voldoen aan de normen in de weg hebben gestaan;


      [ref1]: https://wetten.overheid.nl/BWBR0028132#Artikel25
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0028132
        artikel: '25'
        hoofdstuk: '6'
  - number: 33.10.c
    text: |-
      een oordeel of de toepassing van de normen, genoemd in [artikel 15][ref1], zodanig is dat het gerechtvaardigd is
      dat een of meerdere verplichtingen op grond van deze wet blijvend niet meer behoeven te worden nagekomen en welke
      verplichtingen het in dat geval kan betreffen;


      [ref1]: https://wetten.overheid.nl/BWBR0028132#Artikel15
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0028132
        artikel: '15'
        hoofdstuk: '4'
  - number: 33.10.d
    text: een aanbeveling over het tijdstip van de volgende evaluatie;
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel33
  - number: 33.10.e
    text: |-
      indien de evaluatiecommissie van oordeel is dat voortzetting van deze wet, geheel of gedeeltelijk, nodig is,
      aanbevelingen aan het desbetreffende land over maatregelen die bevorderen dat het aan de normen kan voldoen;
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel33
  - number: 33.10.f
    text: |-
      zo nodig, met het oog op een optimale uitvoering van deze wet, aanbevelingen aan de landen met betrekking tot het
      krachtens deze wet uit te oefenen toezicht.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel33
  - number: '33.11'
    text: |-
      Een land voldoet structureel aan de normen, genoemd in [artikel 15][ref1], indien het ten minste de laatste drie
      achtereenvolgende jaren geheel heeft voldaan aan deze normen en deze normen in zijn regelgeving heeft verankerd.
      Bij het oordeel, bedoeld in de eerste volzin, betrekt de evaluatiecommissie mede de door het college gedurende de
      evaluatieperiode uitgebrachte adviezen en rapportages en de eventuele, op grond van deze wet gegeven aanwijzingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028132#Artikel15
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0028132
        artikel: '15'
        hoofdstuk: '4'
  - number: '33.12'
    text: |-
      Alvorens advies uit te brengen hoort de evaluatiecommissie het betrokken bestuur. Het bestuur reageert binnen een
      week. In het geval het bestuur bezwaar maakt tegen een of meer onderdelen van het ontwerpadvies en in het advies
      aan deze bezwaren geen gevolg wordt gegeven, vermeldt de evaluatiecommissie deze bezwaren in het advies alsmede de
      reden waarom aan deze bezwaren geen gevolg is gegeven.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel33
  - number: '33.13'
    text: |-
      [Artikel 8][ref1] is ten aanzien van de evaluatiecommissie van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028132#Artikel8
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0028132
        artikel: '8'
        hoofdstuk: '2'
  - number: '34'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel34
  - number: '35'
    text: |-
      Deze wet vervalt op een bij koninklijk besluit te bepalen tijdstip. Dit tijdstip is het tijdstip met ingang
      waarvan alle verplichtingen op grond van deze wet ingevolge [artikel 33][ref1] door beide landen blijvend niet meer
      behoeven te worden nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028132#Artikel33
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0028132
        artikel: '33'
        hoofdstuk: '8'
  - number: '36'
