  - number: '26.5'
    text: Het ontwerpbesluit inzake de beslissing op het beroep, bedoeld in het eerste lid, is niet openbaar.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel26
  - number: '26.6'
    text: |-
      [Artikel 27d van de Wet op de Raad van State][ref1] is van overeenkomstige toepassing. Het onderzoek ter zitting
      is openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel27d
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002367
        artikel: 27d
  - number: '26.7'
    text: Het beroep schorst niet de werking van het besluit waartegen het is gericht.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel26
  - number: '26.8'
    text: |-
      De Raad van State van het Koninkrijk kan een procesreglement vaststellen voor de behandeling van het beroep,
      bedoeld in het eerste lid, en van het verzoek om een voorlopige voorziening, bedoeld in [artikel 27][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028132#Artikel27
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0028132
        artikel: '27'
        hoofdstuk: '7'
  - number: '26.9'
    text: |-
      Binnen twee maanden na ontvangst van het ontwerpbesluit kan Onze Minister, met vermelding van de gerezen
      bedenkingen, de Raad verzoeken zijn ontwerp in nadere overweging te nemen. In het kader van die nadere overweging
      stelt de Raad opnieuw het betrokken bestuur in de gelegenheid te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel26
  - number: '26.10'
    text: |-
      Ons besluit wijkt niet af van het ontwerp of, indien daarvan sprake is, het nader ontwerp, voor zover het advies
      van de Raad uitsluitend is gebaseerd op rechtmatigheidsgronden, en voor het overige uitsluitend indien zeer
      zwaarwegende, op het in deze wet geregelde toezicht betrekking hebbende, gronden daartoe aanleiding geven. Indien
      Ons besluit afwijkt van het ontwerp of het nader ontwerp wordt het in het Staatsblad geplaatst met een rapport
      van Onze Minister. Dit rapport bevat in ieder geval de argumenten op grond waarvan wordt voorgesteld af te wijken
      van het ontwerp respectievelijk het nader ontwerp, alsmede het ontwerp zelf en indien daarvan sprake is, het nader
      ontwerp.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel26
  - number: '26.11'
    text: |-
      Ons besluit wijkt voorts niet af van het ontwerp dan na toepassing van het negende lid, eerste volzin. Indien
      niet binnen twee maanden een verzoek als bedoeld in de eerste volzin van het negende lid is gedaan, beslissen Wij
      overeenkomstig het ontwerp van de Raad van State van het Koninkrijk.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel26
  - number: '26.12'
    text: |-
      Besluiten van Onze Minister op grond van deze wet zijn niet vatbaar voor beroep op de administratieve
      rechter op grond van de landsverordeningen van de landen die de administratieve rechtspraak regelen of de
      [Algemene wet bestuursrecht][ref1]. Dit geldt eveneens voor Ons besluit als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: '27.1'
    text: |-
      Indien op grond van [artikel 26, eerste lid][ref1], tegen een besluit beroep is ingesteld, kan een daartoe door
      de Vicepresident van de Raad van State aangewezen staatsraad op verzoek een voorlopige voorziening treffen indien
      onverwijlde spoed, gelet op de betrokken belangen, dat vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0028132#Artikel26
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0028132
        artikel: '26'
        hoofdstuk: '7'
  - number: '27.2'
    text: Een verzoek om voorlopige voorziening kan worden gedaan door het bestuur dat het beroep instelde.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel27
  - number: '27.3'
    text: |-
      De [artikel 45 van de Wet op de Raad van State][ref1] zijn van overeenkomstige toepassing,


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel45
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002367
        artikel: '45'
  - number: '27.4'
    text: |-
      De [artikelen 6:5][ref1], [6:6][ref2], [6:14][ref3], [6:15][ref4], [6:17][ref5], [6:21][ref6], [8:68][ref7],
      [8:72, vijfde lid][ref8], en [8:83, eerste, derde en vierde lid, van de Algemene wet bestuursrecht][ref9] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
