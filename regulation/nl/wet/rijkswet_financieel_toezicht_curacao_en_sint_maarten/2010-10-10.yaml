  - number: '27.5'
    text: De staatsraad, bedoeld in het eerste lid, doet zo spoedig mogelijk schriftelijk of mondeling uitspraak.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel27
  - number: '27.6'
    text: 'De uitspraak strekt tot:'
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel27
  - number: 27.6.a
    text: onbevoegdheid van de staatsraad, bedoeld in het eerste lid,
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel27
  - number: 27.6.b
    text: niet-ontvankelijkverklaring van het verzoek,
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel27
  - number: 27.6.c
    text: afwijzing van het verzoek, of
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel27
  - number: 27.6.d
    text: gehele of gedeeltelijke toewijzing van het verzoek.
    url: https://wetten.overheid.nl/BWBR0028132/2010-10-10#Artikel27
  - number: '27.7'
    text: |-
      De staatsraad, bedoeld in het eerste lid, kan de voorlopige voorziening, op verzoek en ambtshalve,
      opheffen of wijzigen, nadat hij partijen heeft gehoord, althans behoorlijk heeft opgeroepen. De
      [artikelen 6:4, derde lid][ref1], [6:5][ref2], [6:6][ref3], [6:14][ref4], [6:15][ref5], [6:17][ref6], [6:21][ref7]
      en [8:83 eerste, derde en vierde lid, van de Algemene wet bestuursrecht][ref8] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel6
