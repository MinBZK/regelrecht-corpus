preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Interimwet op het speciaal onderwijs en het
    voortgezet speciaal onderwijs te wijzigen teneinde de schoolsoorten onderwijs aan blinde kinderen en onderwijs aan
    slechtziende kinderen samen te voegen tot de schoolsoort onderwijs aan visueel gehandicapte kinderen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007421/2013-07-04#ArtikelAanhef
articles:
  - number: XX.1
    text: |-
      Deze wet treedt met uitzondering van de [artikelen II, onderdeel J][ref1], [VII][ref2], [IX][ref3] en [XIX][ref4]
      in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de onderscheiden artikelen en onderdelen
      daarvan verschillend kan worden bepaald.


