bwb_id: BWBR0007421
url: https://wetten.overheid.nl/BWBR0007421/1995-08-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Interimwet op het speciaal onderwijs en het
    voortgezet speciaal onderwijs te wijzigen teneinde de schoolsoorten onderwijs aan blinde kinderen en onderwijs aan
    slechtziende kinderen samen te voegen tot de schoolsoort onderwijs aan visueel gehandicapte kinderen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007421/1995-08-01#ArtikelAanhef
articles:
  - number: X.1
    text: |-
      Indien het bevoegd gezag besluit de school voor speciaal en voortgezet speciaal onderwijs voor blinde kinderen
      het "Koninklijk Instituut tot onderwijs van slechtzienden en blinden" te Huizen met ingang van de datum van
      inwerkingtreding van deze wet om te zetten in een instelling voor speciaal en voortgezet speciaal onderwijs aan
      visueel gehandicapte kinderen en het bevoegd gezag van de "Comeniusschool" voor speciaal en voortgezet speciaal
      onderwijs aan slechtziende kinderen te Amsterdam besluit de school met ingang van die datum om te zetten in
      een nevenvestiging daarvan, komen die instelling en nevenvestiging met ingang van die datum voor bekostiging in
      aanmerking.
    url: https://wetten.overheid.nl/BWBR0007421/1995-08-01#ArtikelX
  - number: X.2
    text: |-
      Indien het bevoegd gezag besluit de "mr. H.P. van Heukelomschool" voor speciaal onderwijs aan meervoudig
      gehandicapte kinderen te Haren met ingang van de datum van inwerkingtreding van deze wet om te zetten in een
      instelling voor speciaal en voortgezet speciaal onderwijs aan visueel gehandicapte kinderen en het bevoegd gezag
      van de "VISIO school Noord" voor speciaal onderwijs aan blinde kinderen te Haren besluit de school met ingang van
      die datum om te zetten in een nevenvestiging daarvan, komen die instelling en nevenvestiging met ingang van die
      datum voor bekostiging in aanmerking.
    url: https://wetten.overheid.nl/BWBR0007421/1995-08-01#ArtikelX
  - number: X.3
    text: |-
      Indien het bevoegd gezag besluit de "Theofaanschool Louis Braille" voor speciaal en voortgezet speciaal onderwijs
      aan blinde, slechtziende en meervoudig gehandicapte kinderen te Grave met ingang van de datum van inwerkingtreding
      van deze wet om te zetten in een instelling voor speciaal en voortgezet speciaal onderwijs aan visueel gehandicapte
      kinderen en de bevoegde gezagsorganen van de school voor speciaal onderwijs aan meervoudig gehandicapte kinderen
      "De Markendalen" te Breda en de "Prinses Margriet Francisca school" voor speciaal en voortgezet speciaal
      onderwijs aan slechtziende kinderen te Rotterdam besluiten de scholen met ingang van die datum om te zetten in
      nevenvestigingen daarvan, komen die instelling en nevenvestigingen met ingang van die datum voor bekostiging in
      aanmerking.
    url: https://wetten.overheid.nl/BWBR0007421/1995-08-01#ArtikelX
  - number: X.4
    text: |-
      Indien het bevoegd gezag besluit de "School voor slechtziende kinderen Bartimeus" voor speciaal en voortgezet
      speciaal onderwijs aan slechtziende kinderen te Zeist en de "Brailleschool Bartimeus" voor speciaal en voortgezet
      speciaal onderwijs aan blinde kinderen te Zeist met ingang van de datum van inwerkingtreding van deze wet samen te
      voegen tot een instelling voor speciaal en voortgezet speciaal onderwijs aan visueel gehandicapte kinderen en het
      bevoegd gezag van de school voor speciaal onderwijs aan meervoudig gehandicapte kinderen "De Bosschool" te Doorn
      besluit de school met ingang van die datum om te zetten in een nevenvestiging daarvan, komen die instelling en
      nevenvestiging met ingang van die datum voor bekostiging in aanmerking.
    url: https://wetten.overheid.nl/BWBR0007421/1995-08-01#ArtikelX
  - number: X.5
    text: |-
      Indien ingevolge het eerste tot en met het vierde lid een hoofd- of nevenvestiging onder het gezag komt te staan
      van het bevoegd gezag van de instelling, welk bevoegd gezag daaraan voorafgaand niet de school die hoofd- of
      nevenvestiging is geworden in stand hield, treedt met ingang van de datum van inwerkingtreding van deze wet het
      bevoegd gezag van de instelling, onverminderd hetgeen voor de overgang daarvan naar burgerlijk recht is vereist,
      in alle rechten en verplichtingen ten aanzien van gebouwen en terreinen, ten aanzien van roerende zaken voor
      zover deze niet volledig uit eigen middelen zijn aangeschaft, en ten aanzien van niet bestede vergoedingen van het
      bevoegd gezag van de desbetreffende school.
    url: https://wetten.overheid.nl/BWBR0007421/1995-08-01#ArtikelX
  - number: XI.1
    text: |-
      Het dienstverband tussen een bevoegd gezag dat met ingang van de datum van inwerkingtreding van deze wet een of
      meer instellingen als bedoeld in [artikel X][ref1] in stand houdt, en een personeelslid dat de dag voorafgaande
      aan die datum in dienst is bij dat bevoegd gezag of diens rechtsvoorganger, blijft in stand met ingang van de
      datum van inwerkingtreding van deze wet, indien dat dienstverband bij de school of scholen waaruit de instelling is
      ontstaan, gezien de op de dag voorafgaande aan die datum geldende regelingen voor de omvang van het personeel van
      die scholen, zou zijn gehandhaafd.


      [ref1]: https://wetten.overheid.nl/BWBR0007421#ArtikelX
    url: https://wetten.overheid.nl/BWBR0007421/1995-08-01#ArtikelXI
    references:
      - id: ref1
        bwb_id: BWBR0007421
        artikel: X
        hoofdstuk: II
  - number: XI.2
    text: In afwijking van het eerste lid
    url: https://wetten.overheid.nl/BWBR0007421/1995-08-01#ArtikelXI
  - number: XI.2.a
    text: |-
      benoemt het bevoegd gezag, bedoeld in dat lid, met ingang van de datum van inwerkingtreding van deze wet, een van
      de directeuren van de scholen waaruit de instelling is ontstaan die op de dag voorafgaande aan die datum in dienst
      zijn bij het bevoegd gezag van die scholen, als directeur in algemene dienst en om werkzaam te zijn als directeur
      van die instelling, en
    url: https://wetten.overheid.nl/BWBR0007421/1995-08-01#ArtikelXI
  - number: XI.2.b
    text: |-
      beëindigt het bevoegd gezag, bedoeld in het eerste lid, met ingang van de datum van inwerkingtreding van deze
      wet het dienstverband met de andere directeuren van de scholen waaruit de instelling is ontstaan die op de dag
      voorafgaande aan die datum in dienst zijn bij het bevoegd gezag van die scholen, en niet tot directeur van die
      instelling worden benoemd.
    url: https://wetten.overheid.nl/BWBR0007421/1995-08-01#ArtikelXI
  - number: XI.3
    text: |-
      Het bevoegd gezag benoemt met ingang van de datum van inwerkingtreding van deze wet het personeel, bedoeld in het
      tweede lid, onder *b*, in functies waarvan het niveau en het carrièrepatroon zo veel mogelijk overeenkomt met het
      niveau en het carrièrepatroon dat is gegarandeerd in de oorspronkelijke functie, met dien verstande dat het niveau
      en het carrièrepatroon van de nieuwe functie ten minste gelijk zijn aan die van een normfunctie leraar.
    url: https://wetten.overheid.nl/BWBR0007421/1995-08-01#ArtikelXI
  - number: XI.4
    text: |-
      Het tweede lid, aanhef en onder *a*, en het derde lid zijn niet van toepassing indien betrokkenen de wens te kennen
      geven niet voor een functie, als bedoeld in die leden, in aanmerking te willen komen.
    url: https://wetten.overheid.nl/BWBR0007421/1995-08-01#ArtikelXI
  - number: XI.5
    text: |-
      De directeur van de instelling, bedoeld in het tweede lid, onder *a*, behoudt ten minste recht op salariëring
      volgens het functieniveau dat op de dag voorafgaande aan de datum van inwerkingtreding van deze wet voor hem gold
      dan wel op de maximumschaal die daarvoor reeds 2 jaar formatief voor hem aanwezig was. Indien voor de functie
      van directeur van die instelling een hogere maximumschaal gaat gelden dan die welke op de dag voorafgaande aan
      de datum van inwerkingtreding van deze wet voor de directeur gold dan wel formatief beschikbaar was, wordt hij
      vanaf die datum bezoldigd volgens het carrièrepatroon dat bij die hogere maximumschaal behoort en heeft hij bij
      de vaststelling van het salaris aanspraak op een bevorderingsperiodiek. Hij behoudt een blijvende aanspraak op de
      hogere maximumschaal, bedoeld in de vorige volzin, indien deze gedurende 3 achtereenvolgende schooljaren aan die
      instelling voor hem beschikbaar is geweest.
    url: https://wetten.overheid.nl/BWBR0007421/1995-08-01#ArtikelXI
  - number: XI.6
    text: |-
      Indien een personeelslid als bedoeld in het tweede lid, onder *b*, wordt benoemd in een functie als bedoeld in
      het derde lid, behoudt hij ten minste aanspraak op salariëring volgens het functieniveau dat voor hem gold op
      de dag voorafgaande aan de datum van inwerkingtreding van deze wet, in zijn functie als directeur van een school
      waaruit de instelling is ontstaan, of, indien hij 2 jaar of langer directeur is geweest van die school, de
      maximumschaal die op die dag reeds 2 jaar formatief voor hem aanwezig was indien deze maximumschaal hoger is dan
      het functieniveau dat voor hem gold op die dag.
    url: https://wetten.overheid.nl/BWBR0007421/1995-08-01#ArtikelXI
  - number: XI.7
    text: |-
      Zolang het personeel, bedoeld in het derde lid, in dienst is van het bevoegd gezag van de instelling, vindt ten
      minste een verbruik van formatierekeneenheden plaats op basis van de functie en de maximumschaal waarvoor dat
      personeel een salarisgarantie heeft als bedoeld in het zesde lid.
    url: https://wetten.overheid.nl/BWBR0007421/1995-08-01#ArtikelXI
  - number: XI.8
    text: |-
      Het bevoegd gezag verstrekt aan de directeur en de personeelsleden die op de datum van inwerkingtreding van deze
      wet in dienst van het bevoegd gezag zijn, een op die datum ingaande benoeming in algemene dienst.
    url: https://wetten.overheid.nl/BWBR0007421/1995-08-01#ArtikelXI
  - number: XI.9
    text: |-
      In aanvulling op [artikel 49 van de Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs][ref1]
      wordt zolang een of meer nevenvestigingen als bedoeld in [artikel X][ref2] aan een instelling zijn verbonden, met
      betrekking tot die instelling in [artikel 49, eerste lid, onder ][ref3] voor "een andere school of andere scholen"
      gelezen "een andere school, instelling, hoofdvestiging of nevenvestiging, dan wel andere scholen, instellingen,
      hoofdvestigingen of nevenvestigingen".


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0007421#ArtikelX
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel49
    url: https://wetten.overheid.nl/BWBR0007421/1995-08-01#ArtikelXI
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '49'
      - id: ref2
        bwb_id: BWBR0007421
        artikel: X
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '49'
  - number: XII.1
    text: |-
      Behoudens goedkeuring door de begrotingswetgever wordt het totaalbedrag, bedoeld in [artikel 92][ref1] voor de
      periode vanaf de datum van inwerkingtreding van deze wet tot en met 31 december van het desbetreffende jaar vóór
      1 oktober van dat jaar voor een instelling vastgesteld op vijf maal het bedrag van de vergoeding voor de materiële
      voorzieningen ten behoeve van de instandhouding waarop de scholen waaruit die instelling is ontstaan en, indien
      van toepassing, de gemeente die eigenaar is van een schoolgebouw, een schoolbad of een tuinbouwkas met betrekking
      tot het gebruik daarvan door die scholen te zamen recht hadden voor de maand voorafgaande aan de datum van
      inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel92a
    url: https://wetten.overheid.nl/BWBR0007421/1995-08-01#ArtikelXII
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 92a
  - number: XII.2
    text: |-
      Behoudens goedkeuring door de begrotingswetgever wordt het totaalbedrag, bedoeld in [artikel 92][ref1] voor elk
      van de vier kalenderjaren volgend op het jaar van inwerkingtreding van deze wet vastgesteld op het totaalbedrag
      dat gold voor het voorafgaande kalenderjaar, aangepast aan de prijsmutatie van de netto materiële consumptie,
      zoals opgenomen in de Macro Economische Verkenning, die naar verwachting zal optreden tussen het prijsniveau in
      laatstgenoemd kalenderjaar en het prijsniveau in het jaar waarvoor het totaalbedrag geldt. Daarbij wordt voor
      het kalenderjaar volgend op het jaar van inwerkingtreding van deze wet voor het totaalbedrag dat gold voor het
      voorafgaande kalenderjaar uitgegaan van twaalf-vijfde maal het totaalbedrag dat gold voor de periode vanaf de datum
      van inwerkingtreding van deze wet tot en met 31 december van het jaar van de inwerkingtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel92a
    url: https://wetten.overheid.nl/BWBR0007421/1995-08-01#ArtikelXII
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 92a
  - number: XII.3
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op de in [artikel 92][ref1] bedoelde delen van het
      totaalbedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel92a
    url: https://wetten.overheid.nl/BWBR0007421/1995-08-01#ArtikelXII
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 92a
  - number: XII.4
    text: |-
      [Artikel 92][ref1] zijn van overeenkomstige toepassing op de ingevolge het eerste tot en met derde lid vast te
      stellen bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel92a
    url: https://wetten.overheid.nl/BWBR0007421/1995-08-01#ArtikelXII
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 92a
  - number: XIII.1
    text: |-
      Behoudens goedkeuring door de begrotingswetgever en onverminderd het tweede lid wordt het aantal
      formatierekeneenheden, bedoeld in [artikel 93][ref1], voor elk van de eerste vijf schooljaren vanaf de datum van
      inwerkingtreding van deze wet voor een instelling vastgesteld op het totale aantal formatierekeneenheden waarop de
      scholen waaruit die instelling is ontstaan gezamenlijk recht hadden voor het schooljaar voorafgaand aan de datum
      van inwerkingtreding van deze wet,


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel93a
    url: https://wetten.overheid.nl/BWBR0007421/1995-08-01#ArtikelXIII
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 93a
  - number: XIII.1.a
    text: |-
      verminderd met de formatie voor de reguliere taken waarop die scholen voor laatstgenoemd schooljaar recht zouden
      hebben indien het leerlingen zonder een visuele handicap zou betreffen en
    url: https://wetten.overheid.nl/BWBR0007421/1995-08-01#ArtikelXIII
  - number: XIII.1.b
    text: vermeerderd met een aantal formatierekeneenheden voor onderwijskundige integratie.
    url: https://wetten.overheid.nl/BWBR0007421/1995-08-01#ArtikelXIII
  - number: XIII.2
    text: |-
      Het op basis van het eerste lid berekende aantal formatierekeneenheden wordt aangepast aan de wijzigingen van de
      formatieregelingen die gelden voor alle soorten speciaal onderwijs of voortgezet speciaal onderwijs.
    url: https://wetten.overheid.nl/BWBR0007421/1995-08-01#ArtikelXIII
  - number: XIV
    text: |-
      [Titel IV][ref1], [afdeling 3, van de Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs]
      (onbekend) en de ter uitvoering daarvan vastgestelde bepalingen zijn van toepassing op nevenvestigingen als bedoeld
      in artikel X, met dien verstande dat het bevoegd gezag een verzoek om een voorziening indient bij de gemeente
      waarin de nevenvestiging waarvoor de voorziening wordt gewenst, is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0007421/1995-08-01#ArtikelXIV
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: XV
    text: |-
      Voor de datum van inwerkingtreding van deze wet ingediende verzoeken om een voorziening als bedoeld in
      [Titel IV][ref1], [afdeling 3, van de Interimwet op het speciaal onderwijs en het voortgezet speciaal
      onderwijs](onbekend) en voor die datum op grond van [artikel 93][ref2], [artikel 95, zesde lid][ref3], of
      [artikel 98 van die wet][ref4] ingediende verzoeken, van een bevoegd gezag van een school waaruit een instelling
      als bedoeld in [artikel X][ref5] is ontstaan, worden, indien daarop na de datum van inwerkingtreding van deze wet
      wordt beslist, geacht te zijn gedaan door het bevoegd gezag van de instelling en ten behoeve van de instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel93
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel95
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel98
      [ref5]: https://wetten.overheid.nl/BWBR0007421#ArtikelX
    url: https://wetten.overheid.nl/BWBR0007421/1995-08-01#ArtikelXV
    references:
      - id: ref1
        bwb_id: BWBR0003549
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '93'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '95'
      - id: ref4
        bwb_id: BWBR0003549
        artikel: '98'
      - id: ref5
        bwb_id: BWBR0007421
        artikel: X
        hoofdstuk: II
  - number: XVI
    text: |-
      De afrekeningen van de vergoedingen voor de periode voorafgaand aan de datum van inwerkingtreding van
      deze wet ten behoeve van een school genoemd in [artikel X][ref1], dienen te geschieden overeenkomstig de
      [Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs][ref2] en de ter uitvoering daarvan
      vastgestelde voorschriften zoals die golden voor het jaar waarop de afrekening betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0007421#ArtikelX
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0007421/1995-08-01#ArtikelXVI
    references:
      - id: ref1
        bwb_id: BWBR0007421
        artikel: X
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003549
  - number: XVII
    text: |-
      De [Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs][ref1] en de ter uitvoering
      daarvan vastgestelde voorschriften en overgangsregelingen zoals luidend op de dag voorafgaand aan de datum van
      inwerkingtreding van deze wet, blijven van toepassing op geschillen met betrekking tot hun toepassing die op die
      dag aanhangig waren of na die dag binnen de beroepstermijn aanhangig zijn gemaakt met betrekking tot de scholen,
      genoemd in [artikel X][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003549
      [ref2]: https://wetten.overheid.nl/BWBR0007421#ArtikelX
    url: https://wetten.overheid.nl/BWBR0007421/1995-08-01#ArtikelXVII
    references:
      - id: ref1
        bwb_id: BWBR0003549
      - id: ref2
        bwb_id: BWBR0007421
        artikel: X
        hoofdstuk: II
  - number: XVIII
    text: |-
      Voor de toepassing van de [Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs][ref1] en de
      ter uitvoering daarvan vastgestelde voorschriften wordt onder het aantal leerlingen van een instelling, bedoeld in
      [artikel X][ref2], verstaan het aantal leerlingen van de hoofdvestiging en de nevenvestiging of nevenvestigingen
      van de instelling te zamen, tenzij in bedoelde voorschriften anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
      [ref2]: https://wetten.overheid.nl/BWBR0007421#ArtikelX
    url: https://wetten.overheid.nl/BWBR0007421/1995-08-01#ArtikelXVIII
    references:
      - id: ref1
        bwb_id: BWBR0003549
      - id: ref2
        bwb_id: BWBR0007421
        artikel: X
        hoofdstuk: II
  - number: XIX
    text: |-
      Indien het bevoegd gezag van een school voor basisonderwijs dat in de periode voorafgaand aan de inwerkingtreding
      van [artikel II, onderdeel J][ref1], van deze wet de verplichting, bedoeld in [artikel 108][ref2] niet is
      nagekomen, aantoont dat daardoor op grond van [artikel 108][ref3] zoals luidend voor die inwerkingtreding een
      korting zou plaatsvinden die lager is dan de korting op grond van laatstgenoemd artikellid, zoals luidend na die
      inwerkingtreding, vindt die lagere korting plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0007421#ArtikelII
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel108a
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel108a
    url: https://wetten.overheid.nl/BWBR0007421/1995-08-01#ArtikelXIX
    references:
      - id: ref1
        bwb_id: BWBR0007421
        artikel: II
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0003420
        artikel: 108a
      - id: ref3
        bwb_id: BWBR0003420
        artikel: 108a
  - number: XX.1
    text: |-
      Deze wet treedt met uitzondering van de [artikelen II, onderdeel J][ref1], [VII][ref2], [IX][ref3] en [XIX][ref4]
      in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de onderscheiden artikelen en onderdelen
      daarvan verschillend kan worden bepaald.


