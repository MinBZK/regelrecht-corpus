$id: wijzigingswet_wet_op_het_primair_onderwijs_enz_wet_samen_sterker_door_vereenvoudiging_samenwerkingsschool
regulatory_layer: WET
publication_date: '2017-09-07'
valid_from: '2018-01-01'
bwb_id: BWBR0039948
url: https://wetten.overheid.nl/BWBR0039948/2018-01-01
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wegens leerlingendaling noodzakelijk is om de vorming van
    samenwerkingsscholen te vereenvoudigen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0039948/2018-01-01#ArtikelAanhef
articles:
  - number: VIIa
    text: |-
      Onze Minister van Onderwijs, Cultuur en Wetenschap zendt binnen drie jaar na de inwerkingtreding van deze wet aan
      de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0039948/2018-01-01#ArtikelVIIa
  - number: VIII
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0039948/2018-01-01#ArtikelVIII
