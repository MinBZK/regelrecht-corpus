  - number: 1a
    text: |-
      Deze regeling berust op [artikel 7.2.3 van de Wet educatie en beroepsonderwijs][ref1] en
      [artikel 17c van het Examen- en kwalificatiebesluit beroepsopleidingen WEB][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.3
      [ref2]: https://wetten.overheid.nl/BWBR0027963#Artikel17c
    url: https://wetten.overheid.nl/BWBR0032494/2017-10-28#Artikel1a
