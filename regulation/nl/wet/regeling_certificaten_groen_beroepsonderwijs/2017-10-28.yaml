  - number: '1.3'
    text: |-
      Uit het kwalificatiedossier Dierlijke vruchtbaarheid en voortplanting (Crebonummer 23213), bedoeld in
      [bijlage 3 van de Regeling vaststelling kwalificatiedossiers en opleidingsdomeinen 2016][ref1], is een certificaat
      verbonden aan het onderdeel Embryotransplanteur/-winner (C0001) van de kwalificatie Specialist vruchtbaarheid en
      voortplanting niveau 4 (Crebonummer 25538).


      [ref1]: https://wetten.overheid.nl/BWBR0037678
    url: https://wetten.overheid.nl/BWBR0032494/2017-10-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0037678
  - number: 1a
    text: |-
      Deze regeling berust op [artikel 7.2.3 van de Wet educatie en beroepsonderwijs][ref1] en
      [artikel 17c van het Examen- en kwalificatiebesluit beroepsopleidingen WEB][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0027963#Artikel17c
    url: https://wetten.overheid.nl/BWBR0032494/2017-10-28#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0027963
        artikel: 17c
  - number: '2.1'
    text: |-
      Het model voor certificaten als bedoeld in [artikel 7.2.3 van de Wet educatie en beroepsonderwijs][ref1] die worden
      uitgereikt in het kader van een beroepsopleiding waarvan het eerste studiejaar is gestart voor 1 augustus 2016,
      wordt vastgesteld volgens bijlage 1 bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0032494/2017-10-28#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: '2.2'
    text: 'Het certificaat wordt opgemaakt op een beveiligde papiersoort met de volgende kenmerken:'
    url: https://wetten.overheid.nl/BWBR0032494/2017-10-28#Artikel2
  - number: 2.2.a
    text: een uniek watermerk;
    url: https://wetten.overheid.nl/BWBR0032494/2017-10-28#Artikel2
  - number: 2.2.b
    text: UV-vezels;
    url: https://wetten.overheid.nl/BWBR0032494/2017-10-28#Artikel2
  - number: 2.2.c
    text: een vloeiend kleurverloop;
    url: https://wetten.overheid.nl/BWBR0032494/2017-10-28#Artikel2
  - number: 2.2.d
    text: een microtekst; en
    url: https://wetten.overheid.nl/BWBR0032494/2017-10-28#Artikel2
  - number: 2.2.e
    text: een beschermlaag die verkleurt bij mechanische of chemische aantasting.
    url: https://wetten.overheid.nl/BWBR0032494/2017-10-28#Artikel2
  - number: '2.3'
    text: |-
      Met het papier dat voldoet aan de veiligheidseisen in het tweede lid, als bedoeld in deze regeling wordt
      gelijkgesteld papier dat ten minste een gelijkwaardig beschermingsniveau biedt.
    url: https://wetten.overheid.nl/BWBR0032494/2017-10-28#Artikel2
  - number: '2.4'
    text: |-
      Artikel 2 en [bijlage 1][ref1] van de regeling vervallen met ingang van 1 augustus 2022.


      [ref1]: https://wetten.overheid.nl/BWBR0032494
    url: https://wetten.overheid.nl/BWBR0032494/2017-10-28#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0032494
  - number: '3'
    text: |-
      Aan een onderdeel van een kwalificatie, zoals benoemd in [artikel 1][ref1] van deze regeling op 31 augustus 2016,
      is een certificaat verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0032494#Artikel1
    url: https://wetten.overheid.nl/BWBR0032494/2017-10-28#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0032494
        artikel: '1'
  - number: '4'
    text: |-
      Deze regeling treedt in werking met ingang van 1 januari 2013. Indien de Staatscourant waarin deze regeling wordt
      geplaatst, wordt uitgegeven na 1 januari 2013, treedt zij in werking met ingang van de dag na de datum van uitgifte
      van de Staatscourant waarin zij wordt geplaatst, en werkt zij terug tot en met 1 januari 2013.
    url: https://wetten.overheid.nl/BWBR0032494/2017-10-28#Artikel4
  - number: '5'
    text: 'Deze regeling wordt aangehaald als: Regeling certificaten groen beroepsonderwijs.'
    url: https://wetten.overheid.nl/BWBR0032494/2017-10-28#Artikel5
