            required: true
            description: Code van het onderdeel
        output:
          - name: certificaten
            type: array
            description: Lijst van certificaatcodes verbonden aan de kwalificatie en/of onderdeel
        actions:
          - output: certificaten
            value:
              operation: IF
              cases:
                - when:
                    operation: AND
                    conditions:
                      - operation: IN
                        subject: $kwalificatie_crebo
                        values: ["23212", "23221"]
                      - operation: EQUAL
                        subject: $onderdeel_code
                        value: "C0003"
                  then:
                    operation: LIST
                    items: ["C0003"]
                - when:
                    operation: AND
                    conditions:
                      - operation: IN
                        subject: $kwalificatie_crebo
                        values: ["23212", "23221"]
                      - operation: EQUAL
                        subject: $onderdeel_code
                        value: "C0013"
                  then:
                    operation: LIST
                    items: ["C0013"]
                - when:
                    operation: AND
                    conditions:
                      - operation: IN
                        subject: $kwalificatie_crebo
                        values: ["25433", "25557"]
                      - operation: EQUAL
                        subject: $onderdeel_code
                        value: "C0003"
                  then:
                    operation: LIST
                    items: ["C0003"]
                - when:
                    operation: AND
                    conditions:
                      - operation: IN
                        subject: $kwalificatie_crebo
                        values: ["25433", "25557"]
                      - operation: EQUAL
                        subject: $onderdeel_code
                        value: "C0013"
                  then:
