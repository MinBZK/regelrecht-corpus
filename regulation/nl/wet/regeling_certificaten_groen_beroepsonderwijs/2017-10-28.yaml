preamble:
  text: |-
    Handelende na overleg met de Minister van Onderwijs, Cultuur en Wetenschap;

    Gelet op artikel 3 van het Besluit certificaten groen beroepsonderwijs, artikel 7, eerste lid, van het Honden- en
    kattenbesluit 1999 en artikel 17, eerste lid, van het Besluit gewasbeschermingsmiddelen en biociden;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0032494/2017-10-28#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Uit het kwalificatiedossier Agro, productie, handel en technologie (Crebonummers 23212, 23221), bedoeld in
      [bijlage 3 van de Regeling vaststelling kwalificatiedossiers en opleidingsdomeinen 2016][ref1], is een certificaat
      verbonden:

      a. aan de volgende onderdelen van de kwalificatie Vakbekwaam medewerker agrarisch loonwerk niveau 3 (Crebonummers
      25433, 25557):

      1°. Gewasbescherming A (uitvoeren) (C0003);

      2°. MW (Mollen- en Woelrattenbestrijding) (C0013);

      b. aan de volgende onderdelen van de kwalificatie Vakexpert agrarisch loonwerk niveau 4 (Crebonummers 25533,
      25556):

      1°. Gewasbescherming A (uitvoeren) (C0003);

      2°. Gewasbescherming B (bedrijfsvoeren) (C0004);

      3°. Gewasbescherming C (distributie en opslag) (C0005);

      c. aan de volgende onderdelen van de kwalificatie Vakexpert teelt en groene technologie niveau 4 (Crebonummer
      25534):

      1°. Gewasbescherming A (uitvoeren) (C0003);

      2°. Gewasbescherming B (bedrijfsvoeren) (C0004);

      3°. Gewasbescherming C (distributie en opslag) (C0005);

      4°. MW (Mollen- en Woelrattenbestrijding) (C0013);

      d. aan de volgende onderdelen van de kwalificatie Vakexpert veehouderij niveau 4 (Crebonummer 25535):

      1°. Gewasbescherming A (uitvoeren) (C0003);

      2°. Gewasbescherming B (bedrijfsvoeren) (C0004);

      3°. Gewasbescherming C (distributie en opslag) (C0005);

      4°. Houder van vleeskuikens (C0010);

      5°. MW (Mollen- en Woelrattenbestrijding) (C0013);

      e. aan de volgende onderdelen van de kwalificatie Vakbekwaam medewerker teelt niveau 3 (Crebonummer 25536):

      1°. Gewasbescherming A (uitvoeren) (C0003);

      2°. MW (Mollen- en Woelrattenbestrijding) (C0013);

      f. aan de volgende onderdelen van de kwalificatie Vakbekwaam medewerker veehouderij niveau 3 (Crebonummer 25537):

      1°. Houder van vleeskuikens (C0010);

      2°. Gewasbescherming A (uitvoeren) (C0003);

      3°. MW (Mollen- en Woelrattenbestrijding) (C0013);

      g. aan het keuzedeel Houder van vleeskuikens (K0602).

      2 Uit het kwalificatiedossier Dierverzorging (Crebonummer 23214), bedoeld in
      [bijlage 3 van de Regeling vaststelling kwalificatiedossiers en opleidingsdomeinen 2016][ref2] is een certificaat
      verbonden:

      a. aan de volgende onderdelen van de kwalificatie Proefdierverzorger-3 (Crebonummer 25449):

      1°. Euthanaseren van kleine proefdieren (C0002);

      2°. Uitvoeren proefdierhandelingen (C0014);

      b. aan de volgende onderdelen van de kwalificatie Bedrijfsleider dierverzorging niveau 4 (Crebonummer 25539):

      1°. Houder van herpeten (C0006);

      2°. Houder van honden en katten (C0007);

      3°. Houder van overige zoogdieren (C0008);

      4°. Houder van vissen (C0009);

      5°. Houder van vogels (C0011);

      c. aan het onderdeel Wettelijke vereiste Dierenartsassistent-Paraveterinair (C0016) van de kwalificatie
      Dierenartsassistent paraveterinair niveau 4 (Crebonummer 25540);

      d. aan de volgende keuzedelen:

      1°. Houder van herpeten (K0469);

      2°. Houder van honden en katten (K0470);

      3°. Houder van overige zoogdieren (K0471);

      4°. Houder van vissen (K0472);

      5°. Houder van vogels (K0473);

      6°. Houder van vleeskuikens (K0602);

      7°. Uitvoeren proefdierhandelingen (K0606).

      3 Uit het kwalificatiedossier Dierlijke vruchtbaarheid en voortplanting (Crebonummer 23213), bedoeld in
      [bijlage 3 van de Regeling vaststelling kwalificatiedossiers en opleidingsdomeinen 2016][ref3], is een certificaat
      verbonden aan het onderdeel Embryotransplanteur/-winner (C0001) van de kwalificatie Specialist vruchtbaarheid en
      voortplanting niveau 4 (Crebonummer 25538).


      [ref1]: https://wetten.overheid.nl/BWBR0037678
      [ref2]: https://wetten.overheid.nl/BWBR0037678
      [ref3]: https://wetten.overheid.nl/BWBR0037678
    url: https://wetten.overheid.nl/BWBR0032494/2017-10-28#Artikel1
    references:
