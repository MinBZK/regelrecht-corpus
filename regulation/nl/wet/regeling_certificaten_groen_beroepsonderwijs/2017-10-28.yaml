  - number: 1a
    text: |-
      Deze regeling berust op [artikel 7.2.3 van de Wet educatie en beroepsonderwijs][ref1] en
      [artikel 17c van het Examen- en kwalificatiebesluit beroepsopleidingen WEB][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.3
      [ref2]: https://wetten.overheid.nl/BWBR0027963#Artikel17c
    url: https://wetten.overheid.nl/BWBR0032494/2017-10-28#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 7.2.3
      - id: ref2
        bwb_id: BWBR0027963
        artikel: 17c
  - number: '2'
    text: |-
      1 Het model voor certificaten als bedoeld in [artikel 7.2.3 van de Wet educatie en beroepsonderwijs][ref1] die
      worden uitgereikt in het kader van een beroepsopleiding waarvan het eerste studiejaar is gestart voor 1 augustus
      2016, wordt vastgesteld volgens bijlage 1 bij deze regeling.

      2 Het certificaat wordt opgemaakt op een beveiligde papersoort met de volgende kenmerken:

      a. een uniek watermerk;

      b. UV-vezels;

      c. een vloeiend kleurverloop;

      d. een microtekst; en

      e. een beschermlaag die verkleurt bij mechanische of chemische aantasting.

      3 Met het papier dat voldoet aan de veiligheidseisen in het tweede lid, als bedoeld in deze regeling wordt
      gelijkgesteld papier dat ten minste een gelijkwaardig beschermingsniveau biedt.

      4 Artikel 2 en [bijlage 1][ref2] van de regeling vervallen met ingang van 1 augustus 2022.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.3
      [ref2]: https://wetten.overheid.nl/BWBR0032494
    url: https://wetten.overheid.nl/BWBR0032494/2017-10-28#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 7.2.3
      - id: ref2
        bwb_id: BWBR0032494
    machine_readable:
      execution:
        parameters:
          - name: peildatum
            type: date
            required: true
            description: Datum waarop de geldigheid van Artikel 2 wordt gecontroleerd
        output:
          - name: is_artikel_2_vervallen
            type: boolean
            description: Indicatie of Artikel 2 en bijlage 1 zijn vervallen
        actions:
          - output: is_artikel_2_vervallen
            value:
              operation: GREATER_EQUAL
              subject: $peildatum
              value: 2022-08-01
  - number: '3'
    text: |-
      Aan een onderdeel van een kwalificatie, zoals benoemd in [artikel 1][ref1] van deze regeling op 31 augustus 2016,
      is een certificaat verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0032494#Artikel1
    url: https://wetten.overheid.nl/BWBR0032494/2017-10-28#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0032494
        artikel: '1'
    machine_readable:
      execution:
        parameters:
          - name: kwalificatie_startdatum
            type: date
            required: true
            description: Datum van het onderdeel van de kwalificatie
        output:
          - name: certificaat_verbonden_retroactief
            type: boolean
            description: Indicatie of een certificaat retroactief verbonden is aan het onderdeel
        actions:
          - output: certificaat_verbonden_retroactief
            value:
              operation: LESS_EQUAL
              subject: $kwalificatie_startdatum
              value: 2016-08-31
  - number: '4'
    text: |-
      Deze regeling treedt in werking met ingang van 1 januari 2013. Indien de Staatscourant waarin deze regeling wordt
      geplaatst, wordt uitgegeven na 1 januari 2013, treedt zij in werking met ingang van de dag na de datum van uitgifte
      van de Staatscourant waarin zij wordt geplaatst, en werkt zij terug tot en met 1 januari 2013.
    url: https://wetten.overheid.nl/BWBR0032494/2017-10-28#Artikel4
  - number: '5'
    text: 'Deze regeling wordt aangehaald als: Regeling certificaten groen beroepsonderwijs.'
