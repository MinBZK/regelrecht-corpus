preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is het Besluit op de Vennootschapsbelasting 1942 door een
    meer overzichtelijke en op verschillende punten herziene wettelijke regeling te vervangen en in samenhang daarmede
    het Besluit op de Commissarissenbelasting 1941 te doen vervallen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Onder de naam 'vennootschapsbelasting' wordt een directe belasting geheven van de lichamen vermeld in de
      [artikelen 2][ref1] en [3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel3
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002672
        artikel: '3'
        hoofdstuk: I
  - number: '2.1'
    text: 'Als binnenlandse belastingplichtigen zijn aan de belasting onderworpen de in Nederland gevestigde:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel2
  - number: 2.1.a
    text: |-
      naamloze vennootschappen, besloten vennootschappen met beperkte aansprakelijkheid, open commanditaire
      vennootschappen en andere vennootschappen welker kapitaal geheel of ten dele in aandelen is verdeeld;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel2
  - number: 2.1.b
    text: coöperaties en verenigingen op coöperatieve grondslag;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel2
  - number: 2.1.c
    text: onderlinge waarborgmaatschappijen en verenigingen welke op onderlinge grondslag als verzekeraar of bank optreden;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel2
  - number: 2.1.d
    text: |-
      verenigingen en stichtingen die op de voet van de [Woningwet][ref1] bij koninklijk besluit zijn toegelaten als
      instellingen die in het belang van de volkshuisvesting werkzaam zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005181
  - number: 2.1.e
    text: |-
      hiervoor niet genoemde verenigingen en stichtingen alsmede andere dan publiekrechtelijke rechtspersonen, indien en
      voor zover zij een onderneming drijven;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel2
  - number: 2.1.f
    text: fondsen voor gemene rekening;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel2
  - number: 2.1.g
    text: in het derde lid vermelde ondernemingen van publiekrechtelijke rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel2
  - number: '2.2'
    text: |-
      Onder een fonds voor gemene rekening wordt verstaan een fonds ter verkrijging van voordelen voor de
      deelgerechtigden door het voor gemene rekening beleggen of anderszins aanwenden van gelden, mits van de
      deelgerechtigdheid in het fonds blijkt uit verhandelbare bewijzen van deelgerechtigdheid. Een fonds voor gemene
      rekening wordt als onderneming aangemerkt. De bewijzen van deelgerechtigdheid worden als verhandelbaar aangemerkt
      indien voor vervreemding niet de toestemming van alle deelgerechtigden is vereist, met dien verstande dat ingeval
      vervreemding uitsluitend kan plaatsvinden aan het fonds voor gemene rekening of aan bloed- en aanverwanten in de
      rechte linie de bewijzen niet als verhandelbaar worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel2
  - number: '2.3'
    text: 'Als ondernemingen als bedoeld zijn in het eerste lid, onderdeel g, worden aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel2
  - number: 2.3.1°
    text: landbouwbedrijven;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel2
  - number: 2.3.2°
    text: nijverheidsbedrijven met uitzondering van die welke uitsluitend of nagenoeg uitsluitend water leveren;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel2
  - number: 2.3.3°
    text: mijnbouwbedrijven;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel2
  - number: 2.3.4°
    text: |-
      handelsbedrijven welke niet uitsluitend of nagenoeg uitsluitend de handel in onroerende zaken of daarop betrekking
      hebbende rechten tot voorwerp hebben;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel2
  - number: 2.3.5°
    text: |-
      vervoersbedrijven met uitzondering van bedrijven welke uitsluitend of nagenoeg uitsluitend het vervoer van personen
      binnen de grenzen van een gemeente tot voorwerp hebben;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel2
  - number: 2.3.6°
    text: bouwkassen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel2
  - number: '2.4'
    text: |-
      Heeft de oprichting van een lichaam plaatsgevonden naar Nederlands recht, dan wordt voor de toepassing van
      deze wet, met uitzondering van de [artikelen 13 tot en met 13d][ref1], [13i tot en met 13k][ref2], [14a][ref3],
      [14b][ref4], [15][ref5] en [15a][ref6], het lichaam steeds geacht in Nederland te zijn gevestigd. Bij een
      lichaam dat zonder toepassing van de eerste volzin niet een binnenlandse belastingplichtige zou zijn, wordt,
      in afwijking van [hoofdstuk II][ref7], het voordeel uit hoofde van een aanmerkelijk belang als bedoeld in
      [artikel 17, derde lid, onderdeel b][ref8], bepaald op de voet van [hoofdstuk III][ref9]. Een Europese naamloze
      vennootschap die bij haar oprichting werd beheerst door Nederlands recht, wordt voor de toepassing van de eerste
      volzin geacht te zijn opgericht naar Nederlands recht.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel13i
      [ref3]: https://wetten.overheid.nl/BWBR0002672#Artikel14a
