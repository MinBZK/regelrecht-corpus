  - number: 10a.4.a
    text: een lichaam waarin de belastingplichtige voor ten minste een derde gedeelte belang heeft;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel10a
  - number: 10a.4.b
    text: een lichaam dat voor ten minste een derde gedeelte belang heeft in de belastingplichtige;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel10a
  - number: 10a.4.c
    text: |-
      een lichaam waarin een derde voor ten minste een derde gedeelte belang heeft, terwijl deze derde tevens voor ten
      minste een derde gedeelte belang heeft in de belastingplichtige, waarbij een belang dat wordt gehouden door de
      partner of een minderjarig kind van een natuurlijk persoon aan die persoon wordt toegerekend, waarbij onder een
      kind mede wordt verstaan een kind van een partner alsmede een pleegkind;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel10a
  - number: 10a.4.d
    text: |-
      een lichaam dat met de belastingplichtige deel uitmaakt van een fiscale eenheid als bedoeld in de
      [artikelen 15][ref1] en [15a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel15a
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '15'
        hoofdstuk: II
        afdeling: '2.9'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 15a
        hoofdstuk: II
        afdeling: '2.9'
  - number: 10a.5
    text: 'Als een met de belastingplichtige verbonden natuurlijk persoon wordt aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel10a
  - number: 10a.5.a
    text: |-
      voor de toepassing van dit artikel: een natuurlijk persoon die voor tenminste een derde gedeelte een belang heeft
      in de belastingplichtige of in een met hem verbonden lichaam;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel10a
  - number: 10a.5.b
    text: |-
      voor de toepassing van de [artikelen 13b][ref1] en [13ba][ref2]: een natuurlijk persoon die, al dan niet tezamen
      met zijn partner, voor tenminste een derde gedeelte een belang heeft in de belastingplichtige of in een met hem
      verbonden lichaam, alsmede de partner van deze persoon en een bloed- of aanverwant in de rechte lijn van deze
      persoon, waarbij een pleegkind, een partner van een pleegkind en een pleegouder worden gelijkgesteld met bloedof
      aanverwanten.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel13b
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel13ba
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 13b
        hoofdstuk: II
        afdeling: '2.5'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 13ba
        hoofdstuk: II
        afdeling: '2.5'
  - number: 10a.6
    text: |-
      Een met de belastingplichtige verbonden lichaam als bedoeld in het vierde lid wordt, indien die belastingplichtige
      deel uitmaakt van een fiscale eenheid als bedoeld in [artikel 15, eerste lid][ref1], tevens aangemerkt als een met
      de andere van die fiscale eenheid deel uitmakende belastingplichtigen verbonden lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '15'
        hoofdstuk: II
        afdeling: '2.9'
  - number: 10b
    text: |-
      Indien de belastingplichtige van een lichaam waarmee hij is gelieerd in de zin van [artikel 8b][ref1] een
      geldlening heeft verkregen welke geen vaste aflossingsdatum heeft of een aflossingsdatum die meer dan 10 jaar is
      gelegen na het tijdstip van het aangaan daarvan, terwijl rechtens dan wel in feite geen vergoeding op die lening
      is overeengekomen of een vergoeding die in belangrijke mate lager is dan hetgeen in het economische verkeer door
      onafhankelijke partijen zou zijn overeengekomen, komen bij het bepalen van de winst vergoedingen op die lening
      en waardemutaties van die lening niet in aftrek. Bij verschuiving van de aflossingsdatum naar een later tijdstip
      wordt voor de toepassing van de eerste volzin de geldlening geacht vanaf het tijdstip van totstandkoming die nieuwe
      aflossingsdatum te hebben gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel8b
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 8b
        hoofdstuk: II
        afdeling: '2.2'
  - number: 10c.1
    text: |-
      Bij het bepalen van de winst blijven buiten aanmerking voordelen uit hoofde van als tijdelijke belegging
      ingekochte eigen aandelen en aandelen in een vennootschap die voor tenminste een derde gedeelte belang heeft in
      de belastingplichtige.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel10c
  - number: 10c.2
    text: |-
      Inkoop van eigen aandelen en van aandelen in een verbonden vennootschap als bedoeld in
      [artikel 10a, zevende lid, van de Wet op de loonbelasting 1964][ref1], met het oog op de nakoming van een
      optieverplichting jegens personeel van de eigen onderneming of de onderneming van de verbonden vennootschap is
      een tijdelijke belegging tot drie maanden na het tenietgaan van de optieverplichting. Voorzover deze tijdelijke
      belegging nog niet onder de werkingssfeer van het eerste lid valt, is dat lid toch van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 10a
  - number: 10c.3
    text: |-
      Voor de toepassing van dit artikel wordt onder een optieverplichting verstaan een verplichting die de tegenhanger
      is van een recht om een of meer aandelen of daarmee gelijk te stellen rechten te verwerven, of van een recht dat
      daarmee gelijk te stellen is.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel10c
  - number: 10c.4
    text: |-
      Voor de toepassing van dit artikel wordt met een aandeel als bedoeld in het eerste lid gelijk gesteld een recht
      om een zodanig aandeel te verwerven alsmede een recht waarvan de waarde direct of indirect verband houdt met de
      waardeverandering van een zodanig aandeel.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel10c
  - number: '11.1'
    text: |-
      Bij het bepalen van de winst komt een aan een commissaris-natuurlijk persoon die in het lichaam een aanmerkelijk
      belang heeft in de zin van [artikel 4.6][ref1] of [4.7 van de Wet inkomstenbelasting 2001][ref2] ter zake van
      de uitoefening van zijn taak toegekende beloning, welke per jaar meer dan € 1815 bedraagt slechts voor de helft
      doch tot ten minste € 1815 en ten hoogste € 9076 in aftrek. Indien en voor zover wordt aangetoond dat de beloning
      toegekend ter zake van de toezichthoudende taak uitgeoefend ten behoeve van niet-aandeelhouders en ter zake van
      het bijkomstig deelhebben aan de bestuurstaak, het op grond van de vorige volzin in aftrek komende bedrag te boven
      gaat, komt dit meerdere mede in aftrek.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '4'
  - number: '11.2'
    text: |-
      Het op grond van het eerste lid niet in aftrek komende gedeelte van een beloning van een commissaris wordt, indien
      die beloning ten goede komt aan een lichaam dat in de belastingplichtige een deelneming heeft als bedoeld is in
      [artikel 13][ref1], aangemerkt als een voordeel uit hoofde van die deelneming.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel13
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '13'
        hoofdstuk: II
        afdeling: '2.5'
  - number: '12.1'
    text: |-
      Lichamen die zijn aangemerkt als culturele instelling alsmede lichamen zonder aandeelhouders of deelgerechtigden
      die een sociaal belang behartigen en de winst hoofdzakelijk behalen met behulp van vrijwilligers, kunnen een
      bestedingsreserve vormen tot vermindering van de in aanmerking te nemen kosten bedoeld in het tweede lid, indien en
      zolang het voornemen bestaat tot het maken van die kosten.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel12
  - number: '12.2'
    text: |-
      De kosten waarvoor een bestedingsreserve kan worden gevormd zijn de in het jaar of in de volgende vijf jaren te
      verrichten:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel12
  - number: 12.2.a
    text: |-
      uitgaven ter zake van de aanschaf, voortbrenging of verbetering van bedrijfsmiddelen, met uitzondering van
      onroerende zaken die bestemd zijn om direct of indirect hoofdzakelijk al dan niet kortstondig ter beschikking te
      worden gesteld aan derden, of
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel12
  - number: 12.2.b
    text: uitgaven ter zake van projecten.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel12
  - number: '12.3'
    text: |-
      Het eerste lid is slechts van toepassing voorzover ondernemingsactiviteiten worden verricht die in de lijn liggen
      van het belang dat het lichaam behartigt of bestaan uit het inzamelen om niet en vervolgens verkopen van gebruikte
      goederen met het oog op dat belang. Daarbij wordt onder gebruikte goederen verstaan: alle roerende lichamelijke
      zaken die, in de staat waarin zij verkeren of na herstelling daarvan, opnieuw kunnen worden gebruikt of verbruikt,
      met uitzondering van vervoermiddelen, kunstvoorwerpen, voorwerpen voor verzamelingen, antiquiteiten, edele metalen
      en edelstenen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel12
  - number: '12.4'
    text: |-
      Bij ministeriële regeling kunnen ter voorkoming van ernstige concurrentieverstoring, lichamen, groepen lichamen of
      activiteiten worden uitgezonderd van de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel12
  - number: '12.5'
    text: |-
      Het ten laste van de winst van een jaar aan de reserve toe te voegen bedrag beloopt ten hoogste de in het jaar
      behaalde winst vóór die toevoeging.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel12
  - number: '12.6'
    text: |-
      Een bestedingsreserve van een jaar wordt uiterlijk in het vijfde jaar na het jaar waarin de reserve is ontstaan,
      in de winst opgenomen, behalve voorzover de reserve is gevormd met betrekking tot de aanschaf, voortbrenging of
      verbetering van een bedrijfsmiddel of met betrekking tot een project:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel12
  - number: 12.6.a
    text: waarvan uit de aard voortvloeit dat een langer tijdvak is vereist, of
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel12
  - number: 12.6.b
    text: |-
      waarbij aan de aanschaf, voortbrenging of verbetering van het bedrijfsmiddel respectievelijk voorbereiding van het
      project een begin van uitvoering is gegeven, maar verdere uitvoering is vertraagd door bijzondere omstandigheden.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel12
  - number: 12a.1
    text: |-
      Indien aannemelijk is dat op enig tijdstip het uiteindelijke belang in de belastingplichtige in belangrijke mate is
      gewijzigd, gelden in afwijking in zoverre van [artikel 3.54 van de Wet inkomstenbelasting 2001][ref1] de volgende
      regels:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 12a.1.a
    text: |-
      een ten tijde van die wijziging reeds gevormde herinvesteringsreserve wordt direct voorafgaande aan die wijziging
      aan de winst toegevoegd;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel12a
  - number: 12a.1.b
    text: |-
      na die wijziging kan een herinvesteringsreserve slechts worden gevormd ter zake van vervreemde bedrijfsmiddelen
      waarvan het besluit tot vervreemding is genomen na die wijziging;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel12a
  - number: 12a.1.c
    text: |-
      is een herinvesteringsreserve in mindering gebracht op de aanschaffings- of voortbrengingskosten van een
      bedrijfsmiddel en houdt de verwerving van dit bedrijfsmiddel verband met die wijziging, dan wordt de boekwaarde
      van het bedrijfsmiddel op het tijdstip direct voorafgaande aan die wijziging verhoogd met het bedrag van deze
      vermindering, met dien verstande dat de verwerving van het bedrijfsmiddel in elk geval geacht wordt verband te
      houden met die wijziging indien de verwerving plaatsvindt in de zes maanden voorafgaande aan die wijziging.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel12a
  - number: 12a.2
    text: |-
      Voor de toepassing van het eerste lid blijft een wijziging van het uiteindelijke belang in de belastingplichtige
      buiten aanmerking voorzover:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel12a
  - number: 12a.2.a
    text: de wijziging voortvloeit uit een overgang krachtens erfrecht of huwelijksvermogensrecht, of
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel12a
  - number: 12a.2.b
    text: |-
      de wijziging betrekking heeft op een uitbreiding van het uiteindelijke belang van een natuurlijke persoon of
      rechtspersoon die bij het begin van het jaar waarin de herinvesteringsreserve is gevormd, reeds ten minste een
      derde deel van het uiteindelijke belang in de belastingplichtige had.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel12a
  - number: 12a.3
    text: |-
      Het eerste lid is niet van toepassing indien het de belastingplichtige niet bekend is of bekend had kunnen zijn dat
      het uiteindelijke belang in de belastingplichtige in belangrijke mate is gewijzigd, mits de wijziging niet uitgaat
      boven hetgeen als gebruikelijk kan worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel12a
  - number: 12a.4
    text: 'Voor de toepassing van dit artikel:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel12a
  - number: 12a.4.a
    text: |-
      worden onder beleggingen mede begrepen liquide middelen alsmede onroerende zaken die zijn bestemd om direct of
      indirect ter beschikking te worden gesteld aan anderen dan met de belastingplichtige verbonden lichamen als bedoeld
      in [artikel 10a, vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 10a
        hoofdstuk: II
        afdeling: '2.2'
  - number: 12a.4.b
    text: |-
      worden, bij een belastingplichtige die een onderneming drijft waarvan de werkzaamheden
      noodzakelijkerwijs meebrengen dat gelden worden belegd die aan hem, anders dan als eigen vermogen,
      zijn toevertrouwd door lichamen of natuurlijke personen die niet met hem zijn verbonden als bedoeld in
      [artikel 10a, vierde onderscheidenlijk vijfde lid][ref1], de beleggingen die rechtstreeks samenhangen met die
      gelden niet als belegging aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 10a
        hoofdstuk: II
        afdeling: '2.2'
  - number: 12b.1
    text: |-
      Indien de belastingplichtige een immaterieel activum heeft voortgebracht ter zake waarvan aan hem een
      octrooi is verleend (octrooi-activum) of een immaterieel activum heeft voortgebracht dat is voortgevloeid
      uit speur- en ontwikkelingswerk waarvoor aan hem een S&O-verklaring is afgegeven als bedoeld in de
      [Wet vermindering afdracht loonbelasting en premie voor de volksverzekeringen][ref1] (S&O-activum), worden, ingeval
      hij daarvoor bij de aangifte over een jaar kiest met ingang van dat jaar de voordelen uit hoofde van dat activum,
      met inachtneming van de drempel als geduid in het vijfde lid, slechts in aanmerking genomen voor 5/H gedeelte.
      Daarbij staat H voor het percentage van het hoogste tarief, bedoeld in [artikel 22][ref2], geldend voor het jaar
      waarin het voordeel is genoten. De eerste volzin vindt slechts toepassing voor zover het saldo van de voordelen
      positief is.


      [ref1]: https://wetten.overheid.nl/BWBR0007746
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel22
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0007746
      - id: ref2
        bwb_id: BWBR0002672
        artikel: '22'
        hoofdstuk: V
  - number: 12b.2
    text: |-
      Dit artikel is slechts van toepassing op immateriële activa waarvan de te verwachten voordelen in belangrijke mate
      hun oorzaak vinden in aan de belastingplichtige verleende octrooien alsmede op S&O-activa.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel12b
  - number: 12b.3
    text: Voor de toepassing van dit artikel worden onder octrooien mede begrepen kwekersrechten.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel12b
  - number: 12b.4
    text: |-
      Dit artikel is niet van toepassing op door de belastingplichtige voortgebrachte merken, logo’s, en daarmee
      vergelijkbare vermogensbestanddelen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel12b
  - number: 12b.5
    text: |-
      Het eerste lid is van toepassing voor zover het saldo van de in het jaar genoten voordelen uit hoofde van
      immateriële activa als bedoeld in dat lid, uitgaat boven de drempel. De drempel is gelijk aan:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel12b
  - number: 12b.5.a
    text: |-
      het saldo van de nog in te lopen voortbrengingskosten, bedoeld in het zesde lid, aan het einde van het voorafgaande
      jaar, vermeerderd met:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel12b
  - number: 12b.5.b
    text: |-
      de voortbrengingskosten van de octrooi- en S&O-activa waarvoor de belastingplichtige in het jaar heeft gekozen voor
      toepassing van dit artikel, alsmede met:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel12b
  - number: 12b.5.c
    text: |-
      een bedrag gelijk aan het saldo van de voordelen, bedoeld in het eerste lid, eerste volzin, indien dat saldo
      negatief is, en verminderd met:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel12b
  - number: 12b.5.d
    text: |-
      de voordelen uit hoofde van de octrooi-activa, bedoeld in onderdeel b, genoten in de periode met ingang van het
      jaar van aanvraag van het octrooi tot en met het jaar voorafgaande aan het jaar van verlenen van het octrooi, voor
      zover deze voordelen niet uitgaan boven de som van de in onderdelen a, b en c bedoelde bedragen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel12b
  - number: 12b.6
    text: |-
      De inspecteur stelt gelijktijdig met de vaststelling van de aanslag over het jaar bij voor bezwaar vatbare
      beschikking vast het saldo van de nog in te lopen voortbrengingskosten aan het einde van het jaar, welk saldo is:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel12b
  - number: 12b.6.a
    text: |-
      het bedrag dat bij het einde van het voorafgaande jaar op de voet van dit lid is vastgesteld, zo dat is
      vastgesteld, vermeerderd met:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel12b
  - number: 12b.6.b
    text: 'de in het vijfde lid, onderdelen b en c, bedoelde vermeerderingen, en verminderd met:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel12b
  - number: 12b.6.c
    text: 'de in het vijfde lid, onderdeel d, bedoelde vermindering, alsmede met:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel12b
  - number: 12b.6.d
    text: de in het jaar genoten voordelen die de drempel van het jaar niet te boven gingen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel12b
  - number: 12b.7
    text: |-
      Indien enig feit grond oplevert voor het vermoeden dat het in het zesde lid bedoelde saldo te laag is
      vastgesteld, kan de inspecteur de aldaar bedoelde beschikking herzien bij voor bezwaar vatbare beschikking.
      Een feit dat de inspecteur bekend was of redelijkerwijs bekend had kunnen zijn, kan geen grond voor herziening
      opleveren, behoudens in de gevallen waarin de belastingplichtige ter zake van dit feit te kwader trouw is.
      __REF000___________________________________________________________________________________________________________
      ____ is van overeenkomstige toepassing. Rechtsmiddelen tegen een in dat lid bedoelde beschikking kunnen uitsluitend
      betrekking hebben op de vermeerderingen ingevolge onderdeel b en de verminderingen ingevolge de onderdelen c en d
      van dat lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel16
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '16'
  - number: 12b.8
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels, waaronder nadere voorwaarden, worden gesteld
      voor de toepassing van dit artikel. Daarbij kunnen tevens regels worden gesteld voor de bepaling van de voordelen
      uit hoofde van een immaterieel activum als bedoeld in het eerste lid en voor de bepaling welk deel van de door
      een andere Mogendheid geheven belasting over voordelen die onder dit artikel vallen, op basis van regelingen ter
      voorkoming van dubbele belasting, kan worden verrekend met de verschuldigde vennootschapsbelasting.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel12b
  - number: 12b.9
    text: |-
      Tot de voordelen, bedoeld in het eerste lid, wordt niet gerekend een bedrag ingevolge een RDA-beschikking of een
      correctie-RDA-beschikking als bedoeld in [artikel 3.52a van de Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '13.1'
    text: |-
      Bij het bepalen van de winst blijven buiten aanmerking de voordelen uit hoofde van een deelneming, alsmede de
      kosten ter zake van de verwerving of de vervreemding van die deelneming (deelnemingsvrijstelling).
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13
  - number: '13.2'
    text: 'Van een deelneming is sprake indien de belastingplichtige:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13
  - number: 13.2.a
    text: |-
      voor ten minste 5% van het nominaal gestorte kapitaal aandeelhouder is van een vennootschap waarvan het kapitaal
      geheel of ten dele in aandelen is verdeeld;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13
  - number: 13.2.b
    text: |-
      ten minste 5% bezit van het aantal in omloop zijnde bewijzen van deelgerechtigdheid in een fonds voor gemene
      rekening; daarbij wordt het aantal andere dan enkelvoudige bewijzen van deelgerechtigdheid herleid tot een daarmee
      overeenstemmend aantal enkelvoudige bewijzen;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13
  - number: 13.2.c
    text: lid is van een coöperatie of van een vereniging op coöperatieve grondslag;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13
  - number: 13.2.d
    text: |-
      als commanditaire vennoot een aandeel heeft in de vennootschappelijke gemeenschap van een open commanditaire
      vennootschap en daardoor voor ten minste 5% deelt in het door die vennootschap behaalde voordeel.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13
  - number: '13.3'
    text: |-
      Ingeval de belastingplichtige in het bezit is van aandelen in een vennootschap die is gevestigd in een lidstaat
      van de Europese Unie waarmee Nederland een verdrag ter voorkoming van dubbele belasting heeft gesloten dat voorziet
      in een verlaging van belastingheffing op dividenden op grond van het aantal stemrechten, is, in afwijking van
      het tweede lid, aanhef en onderdeel a, eveneens sprake van een deelneming indien de aandelen in het bezit van de
      belastingplichtige ten minste 5% van de stemrechten vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13
  - number: '13.4'
    text: |-
      Indien de belastingplichtige in een lichaam een deelneming heeft als bedoeld in het tweede of derde lid, worden
      onder deze deelneming mede begrepen door de belastingplichtige gehouden:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13
  - number: 13.4.a
    text: winstbewijzen van dat lichaam;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13
  - number: 13.4.b
    text: |-
      schuldvorderingen op dat lichaam als bedoeld in [artikel 10, eerste lid, onderdeel d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '10'
        hoofdstuk: II
        afdeling: '2.2'
  - number: '13.5'
    text: 'Van een deelneming is mede sprake indien de belastingplichtige:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13
  - number: 13.5.a
    text: |-
      aandeelhouder is van een vennootschap, deelgerechtigd is in een fonds voor gemene rekening, of als commanditaire
      vennoot een aandeel heeft in de vennootschappelijke gemeenschap van een open commanditaire vennootschap, terwijl
      deze vennootschap, onderscheidenlijk dit fonds voor gemene rekening of deze open commanditaire vennootschap
      met de belastingplichtige is verbonden in de zin van [artikel 10a, vierde lid][ref1], of waarin een met de
      belastingplichtige verbonden lichaam een deelneming heeft als bedoeld in het tweede of derde lid;


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 10a
        hoofdstuk: II
        afdeling: '2.2'
  - number: 13.5.b
    text: |-
      een schuldvordering op een lichaam bezit als bedoeld in [artikel 10, eerste lid, onderdeel d][ref1], terwijl
      de belastingplichtige daarin geen maar een met de belastingplichtige verbonden lichaam wel een deelneming als
      bedoeld in het tweede of derde lid heeft, of dat lichaam met de belastingplichtige is verbonden in de zin van
      [artikel 10a, vierde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '10'
        hoofdstuk: II
        afdeling: '2.2'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 10a
        hoofdstuk: II
        afdeling: '2.2'
  - number: 13.5.c
    text: |-
      houder is van een winstbewijs van een lichaam, terwijl de belastingplichtige daarin geen maar een met de
      belastingplichtige verbonden lichaam wel een deelneming als bedoeld in het tweede of derde lid heeft, of dat
      lichaam met de belastingplichtige is verbonden in de zin van [artikel 10a, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 10a
        hoofdstuk: II
        afdeling: '2.2'
  - number: '13.6'
    text: |-
      Indien een deelneming of een deel daarvan is vervreemd of verkregen tegen een prijs welke geheel of ten dele
      bestaat uit een recht op een of meer termijnen waarvan het aantal of de omvang in het jaar van de vervreemding
      of de verkrijging nog niet vaststaat, behoren bij de vervreemder de waardeveranderingen van dat recht en bij de
      verkrijger de waardeveranderingen van de met dat recht corresponderende verplichting tot de voordelen uit hoofde
      van de deelneming. De eerste volzin is van overeenkomstige toepassing bij aanpassingen van de prijs waartegen is
      vervreemd of verkregen; voorts is die volzin van overeenkomstige toepassing op de houder van een deelneming van wie
      door de vennootschap waarin de deelneming wordt gehouden, aandelen zijn ingekocht.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13
  - number: '13.7'
    text: |-
      Indien de inspecteur vooraf bij voor bezwaar vatbare beschikking, eventueel onder het stellen van nadere
      voorwaarden, heeft vastgesteld dat een rechtshandeling strekt tot het afdekken van valutarisico dat met een
      deelneming wordt gelopen, behoort een voordeel uit de desbetreffende rechtshandeling tot de voordelen uit hoofde
      van de deelneming.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13
  - number: '13.8'
    text: |-
      De deelnemingsvrijstelling vindt geen toepassing ten aanzien van een belastingplichtige die als
      beleggingsinstelling is aangemerkt.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13
  - number: '13.9'
    text: |-
      De deelnemingsvrijstelling is niet van toepassing op voordelen uit hoofde van een als belegging gehouden deelneming
      (beleggingsdeelneming), alsmede op de kosten ter zake van de verwerving of de vervreemding van die deelneming,
      tenzij sprake is van een kwalificerende beleggingsdeelneming.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13
  - number: '13.10'
    text: 'Een deelneming wordt in ieder geval geacht een beleggingsdeelneming te zijn indien:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13
  - number: 13.10.a
    text: |-
      de bezittingen van het lichaam waarin de belastingplichtige de deelneming heeft, geconsolideerd beschouwd,
      doorgaans grotendeels bestaan uit belangen als bedoeld in het veertiende lid, met dien verstande dat voor de
      consolidatie alleen belangen van ten minste 5% in aanmerking worden genomen;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13
  - number: 13.10.b
    text: |-
      de functie van het lichaam waarin de belastingplichtige de deelneming heeft tezamen met de lichamen waarin dit
      lichaam een belang van ten minste 5% heeft, grotendeels bestaat uit het direct of indirect financieren van de
      belastingplichtige of van met de belastingplichtige verbonden lichamen, dan wel van bedrijfsmiddelen die door de
      belastingplichtige of door met de belastingplichtige verbonden lichamen worden gebruikt, daaronder begrepen het ter
      beschikking stellen van het gebruik of het gebruiksrecht van bedrijfsmiddelen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13
  - number: '13.11'
    text: |-
      Voor de toepassing van het negende lid, [artikel 13aa, eerste, derde en vijfde lid][ref1],
      [13ba, veertiende lid][ref2], en [artikel 23c, tweede tot met vijfde lid][ref3], wordt een deelneming van de
      belastingplichtige in een lichaam als kwalificerende beleggingsdeelneming aangemerkt indien:


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel13aa
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel13ba
      [ref3]: https://wetten.overheid.nl/BWBR0002672#Artikel23c
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 13aa
        hoofdstuk: II
        afdeling: '2.5'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 13ba
        hoofdstuk: II
        afdeling: '2.5'
      - id: ref3
        bwb_id: BWBR0002672
        artikel: 23c
        hoofdstuk: Va
  - number: 13.11.a
    text: |-
      het lichaam is onderworpen aan een belasting naar de winst die resulteert in een naar Nederlandse begrippen reële
      heffing;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13
  - number: 13.11.b
    text: |-
      de bezittingen van het lichaam onmiddellijk of middellijk, doorgaans voor minder dan de helft bestaan uit
      laagbelaste vrije beleggingen, met dien verstande dat voor de toepassing van dit onderdeel en [artikel 13a][ref1]
      laagbelaste vrije beleggingen niet als zodanig in aanmerking worden genomen indien de bezittingen van het lichaam
      dat de laagbelaste vrije beleggingen bezit doorgaans ten minste hoofdzakelijk bestaan uit andere bezittingen dan
      laagbelaste vrije beleggingen, waarbij de deelnemingen die dat lichaam houdt worden geacht geen bezittingen te
      zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel13a
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 13a
        hoofdstuk: II
        afdeling: '2.5'
  - number: '13.12'
    text: |-
      Voor de toepassing van het elfde lid en [artikel 13a, eerste lid][ref1], worden als vrije beleggingen aangemerkt:


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel13a
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 13a
        hoofdstuk: II
        afdeling: '2.5'
  - number: 13.12.a
    text: |-
      andere beleggingen dan die welke redelijkerwijs noodzakelijk zijn in het kader van de ondernemingsactiviteiten van
      het lichaam dat de beleggingen bezit, met uitzondering van beleggingen bestaande uit onroerende zaken – daaronder
      mede begrepen rechten die direct of indirect betrekking hebben op onroerende zaken – die niet in het bezit zijn van
      een lichaam dat is aangemerkt als beleggingsinstelling of vrijgestelde beleggingsinstelling;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13
  - number: 13.12.b
    text: |-
      bezittingen die worden aangewend voor werkzaamheden die grotendeels bestaan uit het direct of indirect financieren
      van de belastingplichtige of van met de belastingplichtige verbonden lichamen, met uitzondering van:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13
  - number: 13.12.b.1°
    text: |-
      bezittingen waarvan het aannemelijk is dat deze worden gehouden door een lichaam waarvan de werkzaamheden ingevolge
      bij ministeriële regeling te stellen regels kunnen worden aangemerkt als actieve financieringswerkzaamheden;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13
  - number: 13.12.b.2°
    text: |-
      bezittingen waarvan blijkt dat de aanschaffings- of voortbrengingskosten geheel of nagenoeg geheel zijn
      gefinancierd door geldleningen verkregen van andere dan verbonden lichamen of verbonden natuurlijke personen;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13
  - number: 13.12.c
    text: |-
      bedrijfsmiddelen die worden aangewend voor werkzaamheden die grotendeels bestaan uit het ter beschikking stellen
      van het gebruik of het gebruiksrecht er van aan de belastingplichtige of aan met de belastingplichtige verbonden
      lichamen, met uitzondering van:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13
  - number: 13.12.c.1°
    text: |-
      bedrijfsmiddelen waarvan het aannemelijk is dat deze worden gehouden door een lichaam waarvan de
      werkzaamheden ingevolge bij ministeriële regeling te stellen regels kunnen worden aangemerkt als actieve
      terbeschikkingstellingswerkzaamheden;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13
  - number: 13.12.c.2°
    text: |-
      bedrijfsmiddelen waarvan blijkt dat de aanschaffings- of voortbrengingskosten geheel of nagenoeg geheel zijn
      gefinancierd door geldleningen verkregen van andere dan verbonden lichamen of verbonden natuurlijke personen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13
  - number: '13.13'
    text: |-
      Vrije beleggingen zijn laagbelast indien de voordelen uit hoofde van de beleggingen, bezittingen of
      bedrijfsmiddelen als bedoeld in het twaalfde lid niet worden betrokken in een belasting naar de winst die
      resulteert in een naar Nederlandse begrippen reële heffing.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13
  - number: '13.14'
    text: |-
      Voor de toepassing van het elfde en twaalfde lid en [artikel 13a][ref1] zijn bezittingen die bestaan uit belangen
      in lichamen, in ieder geval een belegging indien zij bestaan uit:


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel13a
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 13a
        hoofdstuk: II
        afdeling: '2.5'
  - number: 13.14.a
    text: |-
      belangen van minder dan 5% van het nominaal gestorte kapitaal van een vennootschap waarvan het kapitaal geheel of
      ten dele in aandelen is verdeeld;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13
  - number: 13.14.b
    text: |-
      belangen van minder dan 5% van het aantal in omloop zijnde bewijzen van deelgerechtigdheid in een fonds voor gemene
      rekening, met dien verstande dat daarbij het aantal andere dan enkelvoudige bewijzen van deelgerechtigdheid wordt
      herleid tot een daarmee overeenstemmend aantal enkelvoudige bewijzen;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13
  - number: 13.14.c
    text: |-
      een aandeel als commanditaire vennoot in de vennootschappelijke gemeenschap van een open commanditaire
      vennootschap, welk aandeel voor minder dan 5% deelt in het door die vennootschap behaalde voordeel.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13
  - number: '13.15'
    text: |-
      Bezittingen die worden aangewend voor werkzaamheden die grotendeels bestaan uit het direct of indirect financieren
      van de belastingplichtige of met de belastingplichtige verbonden lichamen en die op grond van het twaalfde lid,
      onderdeel b, onder 2°, niet als vrije beleggingen, of op grond van het dertiende lid niet als laagbelaste vrije
      beleggingen worden aangemerkt, worden voor de toepassing van het elfde lid en [artikel 13a][ref1] geacht geen
      bezittingen te zijn van het lichaam waarin de belastingplichtige een deelneming heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel13a
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 13a
        hoofdstuk: II
        afdeling: '2.5'
  - number: '13.16'
    text: |-
      Indien een belang dat de belastingplichtige reeds meer dan een jaar houdt en waarvoor hij in die periode
      onafgebroken in aanmerking kwam voor de deelnemingsvrijstelling, niet langer als een deelneming wordt aangemerkt
      omdat de omvang van het belang niet meer voldoet aan de voorwaarde van ten minste 5%, bedoeld in het tweede of
      derde lid, blijft nog gedurende een periode van drie jaar, gerekend vanaf het tijdstip dat niet meer wordt voldaan
      aan de bedoelde voorwaarde, de deelnemingsvrijstelling van toepassing met betrekking tot voordelen uit hoofde van
      dat belang en kosten ter zake van de verwerving of de vervreemding van dat belang. Het zesde, zevende en negende
      lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13
  - number: 13a.1
    text: |-
      De belastingplichtige die al dan niet tezamen met een verbonden lichaam een als belegging gehouden belang heeft van
      25% of meer in een lichaam:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13a
  - number: 13a.1.a
    text: |-
      dat niet is onderworpen aan een belasting naar de winst die resulteert in een naar Nederlandse begrippen reële
      heffing, en
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13a
  - number: 13a.1.b
    text: |-
      waarvan de bezittingen, onmiddellijk of middellijk, uitsluitend of nagenoeg uitsluitend, bestaan uit laagbelaste
      vrije beleggingen, waardeert dat belang op de waarde in het economische verkeer.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13a
  - number: 13a.2
    text: |-
      Met ingang van het tijdstip waarop het eerste lid geen toepassing meer vindt ten aanzien van de belastingplichtige,
      wordt de verkrijgingsprijs van het belang in het lichaam voor de bepaling van de winst gesteld op de boekwaarde van
      dit belang op het tijdstip onmiddellijk voorafgaande aan dat waarop het eerste lid geen toepassing meer vindt.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13a
  - number: 13a.3
    text: |-
      Voor de bepaling van de omvang van het in het eerste lid bedoelde belang blijven buiten beschouwing
      aandelen, bewijzen van deelgerechtigdheid, lidmaatschapsrechten en aandelen als commanditaire vennoot in de
      vennootschappelijke gemeenschap van een open commanditaire vennootschap, die bij de ontbinding van het lichaam niet
      delen in de reserves van het lichaam.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13a
  - number: 13aa.1
    text: |-
      Indien de belastingplichtige voordelen geniet uit hoofde van beleggingsdeelnemingen niet zijnde kwalificerende
      beleggingsdeelnemingen, wordt een gebruteerd bedrag van die voordelen tot de winst gerekend en wordt ter
      verrekening van de op die voordelen drukkende winstbelasting de verschuldigde vennootschapsbelasting verminderd
      volgens [artikel 23c][ref1] (deelnemingsverrekening).


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel23c
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13aa
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 23c
        hoofdstuk: Va
  - number: 13aa.2
    text: |-
      Brutering van een voordeel vindt plaats door vermenigvuldiging van het voordeel met de factor 100/95. De brutering
      vindt ook toepassing op de voordelen bedoeld in [artikel 13, zesde en zevende lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel13
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13aa
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '13'
        hoofdstuk: II
        afdeling: '2.5'
  - number: 13aa.3
    text: |-
      Herwaarderingsvoordelen en vervreemdingsvoordelen worden berekend met inachtneming van de kosten ter zake van
      de verwerving en de vervreemding van de desbetreffende beleggingsdeelneming niet zijnde een kwalificerende
      beleggingsdeelneming.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13aa
  - number: 13aa.4
    text: |-
      Voor zover een voordeel bestaat uit een winstuitkering waarvoor een verzoek als bedoeld in
      [artikel 23c, derde lid][ref1], wordt gedaan, wordt dit voordeel, in afwijking van het tweede lid, in aanmerking
      genomen na vermeerdering ervan met het bedrag van op die winstuitkering drukkende winstbelasting als bedoeld in
      artikel 23c, vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel23c
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13aa
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 23c
        hoofdstuk: Va
  - number: 13aa.5
    text: |-
      Ingeval in een jaar het bedrag van de gezamenlijke gebruteerde voordelen uit hoofde van beleggingsdeelnemingen
      niet zijnde kwalificerende beleggingsdeelnemingen positief is, wordt ter verrekening van op die voordelen
      drukkende winstbelasting, op de verschuldigde vennootschapsbelasting van dat jaar een vermindering verleend volgens
      [artikel 23c][ref1] (deelnemingsverrekening).


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel23c
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13aa
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 23c
        hoofdstuk: Va
  - number: 13aa.6
    text: |-
      Ingeval in een jaar het bedrag van de gezamenlijke gebruteerde voordelen uit hoofde van beleggingsdeelnemingen niet
      zijnde kwalificerende beleggingsdeelnemingen negatief is, wordt de winst van dat jaar verminderd met een bedrag
      ter grootte van 5/H deel van dat bedrag. Daarbij staat H voor het percentage van het hoogste tarief, bedoeld in
      [artikel 22][ref1], geldend aan het einde van het jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel22
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13aa
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '22'
        hoofdstuk: V
  - number: 13aa.7
    text: 'Dit artikel vindt geen toepassing:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13aa
  - number: 13aa.7.a
    text: |-
      ingeval het lichaam waarin de belastingplichtige een deelneming heeft, is vrijgesteld van een belasting naar de
      winst, of is onderworpen aan een belasting naar de winst die niet resulteert in een daadwerkelijke heffing;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13aa
  - number: 13aa.7.b
    text: ten aanzien van een belastingplichtige die als beleggingsinstelling is aangemerkt.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13aa
  - number: 13b.1
    text: |-
      Indien een schuldvordering op een lichaam (schuldenaar) waarin de belastingplichtige of een met hem verbonden
      lichaam een deelneming heeft, is afgewaardeerd ten laste van de in Nederland belastbare winst van de
      belastingplichtige of een met hem verbonden lichaam, wordt, indien de schuldvordering door de belastingplichtige
      wordt vervreemd of overgebracht als bedoeld in het tweede lid, ter zake van die vervreemding of overbrenging tot
      de winst van de belastingplichtige gerekend een bedrag gelijk aan die afwaardering voorzover met betrekking tot die
      schuldvordering niet reeds een bedrag op de voet van dit artikel tot de winst van de belastingplichtige of een met
      hem verbonden lichaam is gerekend.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13b
  - number: 13b.2
    text: |-
      Een vervreemding of overbrenging als bedoeld in het eerste lid doet zich onderscheidenlijk voor indien de
      afgewaardeerde schuldvordering:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13b
  - number: 13b.2.a
    text: wordt vervreemd aan een met de belastingplichtige verbonden lichaam of verbonden natuurlijk persoon;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13b
  - number: 13b.2.b
    text: |-
      wordt overgebracht naar het vermogen van een buiten Nederland gedreven onderneming, dan wel naar het vermogen van
      een buiten Nederland gedreven gedeelte van een onderneming op de winst waarvan een regeling ter voorkoming van
      dubbele belasting van toepassing is.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13b
  - number: 13b.3
    text: |-
      Het eerste lid is van overeenkomstige toepassing indien de onderneming of een gedeelte van de onderneming van de
      schuldenaar, wordt vervreemd aan de belastingplichtige of een met hem verbonden lichaam of verbonden natuurlijk
      persoon.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13b
  - number: 13b.4
    text: |-
      Voor de toepassing van het tweede lid, onderdeel a, en het derde lid, wordt, bij vervreemding aan een niet in
      Nederland gevestigd lichaam of een niet in Nederland wonend natuurlijk persoon, dat lichaam onderscheidenlijk die
      natuurlijke persoon geacht een met de belastingplichtige verbonden lichaam, onderscheidenlijk verbonden natuurlijk
      persoon te zijn, tenzij de belastingplichtige het tegendeel aannemelijk maakt.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13b
  - number: 13b.5
    text: |-
      Dit artikel is van overeenkomstige toepassing indien de belastingplichtige of een met hem verbonden lichaam via een
      deelneming middellijk een belang van 5% of meer in de schuldenaar heeft.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13b
  - number: 13ba.1
    text: |-
      Indien de belastingplichtige een schuldvordering heeft op een lichaam (schuldenaar) waarin hij of een met hem
      verbonden lichaam een deelneming heeft en die schuldvordering is afgewaardeerd ten laste van de in Nederland
      belastbare winst van de belastingplichtige of een met hem verbonden lichaam of ten laste van het in Nederland
      belastbare resultaat uit een werkzaamheid van een met hem verbonden natuurlijk persoon, wordt, indien zich een
      omstandigheid voordoet als bedoeld in het tweede lid, tot de winst van de belastingplichtige gerekend een bedrag
      gelijk aan die afwaardering. Het in de eerste volzin bedoelde bedrag kan gelijktijdig ten laste van de winst worden
      toegevoegd aan een reserve (opwaarderingsreserve).
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13ba
  - number: 13ba.2
    text: 'Van een omstandigheid als bedoeld in het eerste lid is sprake indien:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13ba
  - number: 13ba.2.a
    text: |-
      de met de schuldvordering corresponderende schuld door de schuldenaar wordt voldaan door het uitgeven van aandelen,
      winstbewijzen, lidmaatschapsrechten of bewijzen van deelgerechtigdheid (omzetting);
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13ba
  - number: 13ba.2.b
    text: |-
      de met de schuldvordering corresponderende schuld gaat functioneren als eigen vermogen van de schuldenaar zonder
      dat deze daartoe aandelen uitgeeft, en de schuldvordering hierdoor bij de belastingplichtige onder een deelneming
      wordt begrepen; of
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13ba
  - number: 13ba.2.c
    text: de schuldvordering geheel of gedeeltelijk wordt prijsgegeven.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13ba
  - number: 13ba.3
    text: |-
      Het eerste lid is niet van toepassing voor zover met betrekking tot de schuldvordering reeds een bedrag op de voet
      van het eerste lid of [artikel 13b][ref1] tot de winst van de belastingplichtige of een met hem verbonden lichaam
      is gerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel13b
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13ba
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 13b
        hoofdstuk: II
        afdeling: '2.5'
  - number: 13ba.4
    text: |-
      Het eerste lid is ter zake van een omstandigheid als bedoeld in het tweede lid, onderdeel c, niet van toepassing
      voor zover de in dat lid bedoelde omstandigheid bij de schuldenaar leidt tot een voordeel dat wordt betrokken in
      een belasting naar de winst die resulteert in een naar Nederlandse begrippen reële heffing.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13ba
  - number: 13ba.5
    text: |-
      De opwaarderingsreserve wordt aan de winst toegevoegd voor zover het verschil tussen de actuele waarde in het
      economische verkeer van de deelneming en de waarde in het economische verkeer van de deelneming ten tijde van
      de in het eerste lid bedoelde omstandigheid uitgaat boven het bedrag waarmee de opwaarderingsreserve sinds
      die omstandigheid reeds is afgenomen. Voor de toepassing van de eerste volzin, het zesde lid en het tiende
      lid, onderdeel b, worden de door een met de belastingplichtige verbonden lichaam gehouden deelnemingen in de
      schuldenaar, toegerekend aan de belastingplichtige, tenzij het verbonden lichaam met betrekking tot de schuldenaar
      eveneens beschikt over een opwaarderingsreserve.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13ba
  - number: 13ba.6
    text: |-
      Indien de deelneming na de in het eerste lid bedoelde omstandigheid gedeeltelijk is vervreemd aan een niet
      met de belastingplichtige verbonden lichaam of een niet met hem verbonden natuurlijk persoon, wordt voor
      de toepassing van het vijfde lid de actuele waarde in het economische verkeer van de deelneming vermeerderd
      met de opbrengst van het vervreemde gedeelte, daaronder begrepen de waardeveranderingen als bedoeld in
      [artikel 13, zesde lid, eerste volzin][ref1], en de prijsaanpassingen als bedoeld in de tweede volzin van dat lid.
      Indien de deelneming na de in het eerste lid bedoelde omstandigheid is uitgebreid doordat aandelen, winstbewijzen,
      lidmaatschapsrechten, bewijzen van deelgerechtigheid of schuldvorderingen zijn verkregen van de schuldenaar zelf
      of van een niet met de belastingplichtige verbonden lichaam of een niet met hem verbonden natuurlijk persoon, wordt
      voor de toepassing van het vijfde lid de actuele waarde in het economische verkeer van de deelneming verminderd met
      het voor die uitbreiding opgeofferde bedrag, in de zin van [artikel 13d, tweede lid][ref2]. Onder een uitbreiding
      van de deelneming wordt mede begrepen een storting van kapitaal zonder uitreiking van aandelen, winstbewijzen,
      lidmaatschapsrechten of bewijzen van deelgerechtigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel13d
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13ba
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '13'
        hoofdstuk: II
        afdeling: '2.5'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 13d
        hoofdstuk: II
        afdeling: '2.5'
  - number: 13ba.7
    text: |-
      Indien de opwaarderingsreserve is ontstaan bij een omstandigheid als bedoeld in het tweede lid, onderdeel a,
      vervalt de reserve zonder dat dit tot een toevoeging aan de winst leidt tot het bedrag van de na die omstandigheid
      uit hoofde van de uitgegeven aandelen, winstbewijzen, lidmaatschapsrechten of bewijzen van deelgerechtigheid
      genoten voordelen, waarop de deelnemingsvrijstelling niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13ba
  - number: 13ba.8
    text: |-
      Indien een omstandigheid, anders dan bedoeld in het tiende lid, meebrengt dat noch de belastingplichtige,
      noch een met hem verbonden lichaam meer een deelneming in de schuldenaar heeft, wordt direct voorafgaande aan
      die omstandigheid het vijfde lid voor het laatst toegepast. Een nog resterend bedrag aan opwaarderingsreserve
      vervalt zonder dat dit tot een toevoeging aan de winst leidt. Daarna blijft met betrekking tot die deelneming
      [artikel 13, zesde lid][ref1], ten aanzien van de belastingplichtige of het met hem verbonden lichaam buiten
      toepassing, voorzover het positieve voordelen betreft tot het in de tweede volzin bedoelde resterende bedrag, en
      voorzover het negatieve voordelen betreft tot ten hoogste het bedrag van de oorspronkelijke opwaarderingsreserve.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel13
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13ba
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '13'
        hoofdstuk: II
        afdeling: '2.5'
  - number: 13ba.9
    text: |-
      In afwijking van het achtste lid, tweede volzin, wordt het restant van de opwaarderingsreserve wel toegevoegd
      aan de winst indien de omstandigheid in overwegende mate is gericht op het realiseren van een vrijval van de
      opwaarderingsreserve die niet tot een toevoeging aan de winst leidt. Een omstandigheid wordt, tenzij het tegendeel
      aannemelijk wordt gemaakt, geacht in overwegende mate te zijn gericht op het realiseren van een vrijval die niet
      tot een toevoeging aan de winst leidt, indien de belastingplichtige of een met hem verbonden lichaam binnen 3 jaar
      na die omstandigheid opnieuw een deelneming in de schuldenaar verkrijgt.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13ba
  - number: 13ba.10
    text: |-
      Ingeval zich een omstandigheid voordoet als aangeduid in de volgende volzin, wordt onmiddellijk daaraan
      voorafgaande de opwaarderingsreserve toegevoegd aan de winst. Een omstandigheid als bedoeld in de eerste volzin is:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13ba
  - number: 13ba.10.a
    text: |-
      de onderneming of een gedeelte van de onderneming van de schuldenaar wordt vervreemd aan de belastingplichtige of
      aan een met hem verbonden lichaam of verbonden natuurlijk persoon;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13ba
  - number: 13ba.10.b
    text: |-
      de deelneming of een gedeelte van de deelneming wordt vervreemd aan een met de belastingplichtige verbonden
      natuurlijk persoon;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13ba
  - number: 13ba.10.c
    text: |-
      de schuldenaar gaat als dochtermaatschappij deel uitmaken van een fiscale eenheid met de belastingplichtige als
      bedoeld in [artikel 15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13ba
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '15'
        hoofdstuk: II
        afdeling: '2.9'
  - number: 13ba.11
    text: |-
      Dit artikel is van overeenkomstige toepassing indien de belastingplichtige in verband met een in het tweede lid
      genoemde omstandigheid een deelneming in de schuldenaar verkrijgt.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13ba
  - number: 13ba.12
    text: |-
      Indien de belastingplichtige of een met hem verbonden lichaam via een deelneming een middellijk belang van 5% of
      meer heeft in de schuldenaar, is dit artikel van overeenkomstige toepassing. Daarbij vinden het vijfde, zesde,
      achtste, negende en tiende lid toepassing op de deelneming of deelnemingen via welke het middellijke belang wordt
      gehouden.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13ba
  - number: 13ba.13
    text: |-
      Indien de belastingplichtige een schuldvordering heeft op een lichaam, en die schuldvordering is afgewaardeerd
      ten laste van de in Nederland belastbare winst van de belastingplichtige of een met hem verbonden lichaam of ten
      laste van het resultaat uit een werkzaamheid van een met hem verbonden natuurlijk persoon, is, indien zich een
      omstandigheid voordoet als bedoeld in de volgende volzin, dit artikel van overeenkomstige toepassing. Van een
      omstandigheid als bedoeld in de eerste volzin is sprake indien de belastingplichtige of een met hem verbonden
      lichaam in verband met een vervreemding van de schuldvordering aan een niet verbonden lichaam of persoon,
      rechtstreeks een deelneming verkrijgt in de schuldenaar dan wel via een deelneming een middellijk belang van 5%
      of meer in de schuldenaar verkrijgt. In het laatste geval vinden het vijfde, zesde, achtste, negende en tiende
      lid toepassing op de deelneming of deelnemingen via welke het middellijke belang wordt gehouden. Voorts vervalt
      de opwaarderingsreserve zonder dat dit tot een toevoeging aan de winst leidt tot het bedrag van de waarde-aangroei
      van de vervreemde schuldvordering, voor zover de belastingplichtige aannemelijk maakt dat deze waarde-aangroei bij
      de verkrijger van de schuldvordering leidt tot een voordeel dat wordt betrokken in een belasting naar de winst die
      resulteert in een naar Nederlandse begrippen reële heffing
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13ba
  - number: 13ba.14
    text: |-
      Dit artikel is niet van toepassing indien de in het eerste lid bedoelde deelneming een beleggingsdeelneming niet
      zijnde een kwalificerende beleggingsdeelneming is.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13ba
  - number: 13d.1
    text: |-
      De deelnemingsvrijstelling vindt geen toepassing ten aanzien van een verlies op een deelneming dat tot uitdrukking
      komt nadat het lichaam waarin de belastingplichtige deelneemt is ontbonden (liquidatieverlies).
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13d
  - number: 13d.2
    text: |-
      Het liquidatieverlies wordt gesteld op het bedrag waarmede het door de belastingplichtige voor de deelneming
      opgeofferde bedrag het totaal van de liquidatie-uitkeringen overtreft. Onder het voor de deelneming opgeofferde
      bedrag worden mede begrepen:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13d
  - number: 13d.2.a
    text: |-
      de bedragen die met betrekking tot vorderingen op die deelneming ingevolge [artikel 13b][ref1] of
      [13ba, vijfde, negende of tiende lid][ref2], tot de winst zijn gerekend;


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel13b
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel13ba
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13d
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 13b
        hoofdstuk: II
        afdeling: '2.5'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 13ba
        hoofdstuk: II
        afdeling: '2.5'
  - number: 13d.2.b
    text: |-
      de positieve voordelen uit hoofde van die deelneming waarop de deelnemingsvrijstelling op grond van
      [artikel 13h][ref1] geen toepassing heeft gevonden;


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel13h
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13d
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 13h
        hoofdstuk: II
        afdeling: '2.5'
  - number: 13d.2.c
    text: |-
      de waardeveranderingen van een met de deelneming verband houdende verplichting als bedoeld in
      [artikel 13, zesde lid, eerste volzin][ref1], alsmede aanpassingen van de prijs waartegen de deelneming is
      verkregen als bedoeld in [artikel 13, zesde lid, tweede volzin][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel13
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13d
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '13'
        hoofdstuk: II
        afdeling: '2.5'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: '13'
        hoofdstuk: II
        afdeling: '2.5'
  - number: 13d.2.d
    text: |-
      een negatief saldo van de positieve en negatieve bedragen aan winst uit een andere staat dat op de voet van
      [artikel 15j][ref1] is doorgeschoven naar een lichaam dat niet in Nederland is gevestigd, indien dit saldo is
      voortgevloeid uit een voorheen door de belastingplichtige gedreven buitenlandse onderneming en voor zover ter zake
      van dat negatieve bedrag in die andere staat generlei tegemoetkoming voor de belastingheffing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15j
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13d
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 15j
        hoofdstuk: II
        afdeling: 2.10a
  - number: 13d.3
    text: |-
      Tot het totaal van de liquidatie-uitkeringen worden ten minste gerekend de positieve voordelen uit hoofde van de
      deelneming welke met toepassing van de deelnemingsvrijstelling zijn genoten in:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13d
  - number: 13d.3.a
    text: |-
      het jaar waarin het ontbonden lichaam zijn onderneming geheel of nagenoeg geheel heeft gestaakt, in de vijf daaraan
      voorafgaande jaren en in de daaropvolgende jaren;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13d
  - number: 13d.3.b
    text: |-
      het zesde tot en met het tiende jaar voorafgaande aan dat waarin het ontbonden lichaam zijn onderneming geheel
      of nagenoeg geheel heeft gestaakt ingeval over het desbetreffende jaar dat lichaam volgens zijn jaarrekening -
      opgemaakt volgens de bepalingen van [titel 9, boek 2 van het Burgerlijk Wetboek][ref1], dan wel, ten aanzien van
      een deelneming in een buiten Nederland gevestigd lichaam, volgens soortgelijke buitenlandse wettelijke regelingen -
      verlies heeft geleden.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13d
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: 13d.4
    text: |-
      Indien, onmiddellijk of middellijk, tot het vermogen van het ontbonden lichaam een deelneming heeft behoord die
      deel uitmaakt van de liquidatie-uitkering of die is vervreemd en die in waarde is gedaald sedert de verkrijging
      van de deelneming in het ontbonden lichaam, wordt het liquidatieverlies slechts in aanmerking genomen voor zover
      dit verlies het bedrag van die waardedaling te boven gaat. Indien, onmiddellijk of middellijk, tot het vermogen van
      het ontbonden lichaam tevens een deelneming heeft behoord die sedertdien in waarde is gestegen, is de vorige volzin
      slechts van toepassing voor zover de aldaar bedoelde waardedaling deze waardestijging te boven gaat. Waardedalingen
      en waardestijgingen welke zowel onmiddellijk als middellijk tot uiting komen worden uitsluitend in aanmerking
      genomen voor zover zij onmiddellijk tot uiting komen. Indien, onmiddellijk of middellijk, tot het vermogen van
      het ontbonden lichaam een deelneming heeft behoord welke was verkregen van een verbonden lichaam, wordt het
      liquidatieverlies voor zover dit is toe te rekenen aan een daling van de waarde van die deelneming, slechts in
      aanmerking genomen voor zover dit toe te rekenen gedeelte niet uitgaat boven het liquidatieverlies dat bij het
      ontbonden lichaam met betrekking tot die deelneming in aanmerking is genomen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13d
  - number: 13d.5
    text: |-
      Indien, onmiddellijk of middellijk, tot het vermogen van het ontbonden lichaam een deelneming heeft behoord in
      een lichaam dat inmiddels is ontbonden en ter zake waarvan ingevolge het negende lid, geen liquidatieverlies in
      aanmerking is genomen, of niet in aanmerking zou zijn genomen indien die deelneming door een in Nederland gevestigd
      lichaam zou zijn gehouden, wordt het liquidatieverlies slechts in aanmerking genomen voor zover dit verlies uitgaat
      boven het liquidatieverlies met betrekking tot de deelneming in dat eerder ontbonden lichaam.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13d
  - number: 13d.6
    text: |-
      Indien een deelneming is verkregen van een verbonden lichaam wordt het opgeofferde bedrag ten tijde van de
      verkrijging niet hoger gesteld dan het bedrag hetwelk dat lichaam voor die deelneming heeft opgeofferd. Indien zulk
      een deelneming is verkregen in het kader van de ontbinding van het verbonden lichaam en ter zake van die deelneming
      het vierde lid, eerste volzin, toepassing heeft gevonden, wordt het opgeofferde bedrag vermeerderd met de aldaar
      bedoelde waardedaling tot ten hoogste het door het ontbonden lichaam voor die deelneming opgeofferde bedrag. Indien
      een storting op aandelen of bewijzen van deelgerechtigdheid bestaat uit aandelen of bewijzen van deelgerechtigdheid
      in een verbonden lichaam, wordt het opgeofferde bedrag ten tijde van de storting niet hoger gesteld dan op het
      bedrag dat is opgeofferd voor de aandelen of bewijzen van deelgerechtigdheid die als storting dienen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13d
  - number: 13d.7
    text: |-
      Indien aandelen of bewijzen van deelgerechtigdheid worden verkregen van een verbonden lichaam en deze aandelen
      of bewijzen van deelgerechtigdheid op het tijdstip van verkrijging of enig tijdstip daarna tot een deelneming
      gaan behoren, wordt het opgeofferde bedrag niet hoger gesteld dan het bedrag dat door dat lichaam voor die
      aandelen of bewijzen van deelgerechtigdheid is opgeofferd. De eerste volzin is niet van toepassing voor zover
      de belastingplichtige aannemelijk maakt dat over het bedrag van de waardetoename van de aandelen of bewijzen van
      deelgerechtigdheid na het tijdstip van de verkrijging daarvan door het lichaam waarvan de belastingplichtige de
      aandelen of bewijzen van deelgerechtigdheid verkrijgt, belasting naar de winst is geheven die resulteert in een
      naar Nederlandse begrippen reële heffing.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13d
  - number: 13d.8
    text: |-
      Ingeval de deelneming als dochtermaatschappij met de belastingplichtige deel uitmaakt van een fiscale eenheid
      als bedoeld in [artikel 15, eerste lid][ref1], wordt op het tijdstip waarop die eenheid ten aanzien van die
      dochtermaatschappij wordt beëindigd het door de belastingplichtige voor die dochtermaatschappij opgeofferde bedrag
      gesteld op het vanaf dat tijdstip voor de heffing van de vennootschapsbelasting in aanmerking te nemen eigen
      vermogen van die dochtermaatschappij nadat dit is verminderd met de toelaatbare reserves.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13d
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '15'
        hoofdstuk: II
        afdeling: '2.9'
  - number: 13d.9
    text: 'Het liquidatieverlies wordt eerst op het tijdstip waarop de vereffening is voltooid in aanmerking genomen, mits:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13d
  - number: 13d.9.a
    text: |-
      geen recht geldt op enigerlei tegemoetkoming bij de belastingheffing ter zake van verliezen die bij het ontbonden
      lichaam onverrekend zijn gebleven, anders dan op de voet van dit artikel of [artikel 13e][ref1], voor:


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel13e
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13d
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 13e
        hoofdstuk: II
        afdeling: '2.5'
  - number: 13d.9.a.1°
    text: de belastingplichtige, of een met hem verbonden lichaam;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13d
  - number: 13d.9.a.2°
    text: |-
      het lichaam dat of de persoon die de onderneming geheel of gedeeltelijk voortzet, of een met dat lichaam verbonden
      lichaam;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13d
  - number: 13d.9.b
    text: 'de onderneming van het ontbonden lichaam:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13d
  - number: 13d.9.b.1°
    text: geheel is gestaakt, dan wel
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13d
  - number: 13d.9.b.2°
    text: |-
      geheel of gedeeltelijk is voortgezet uitsluitend door een ander dan de belastingplichtige of een met hem verbonden
      lichaam;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13d
  - number: 13d.9.c
    text: |-
      de omvang van het liquidatieverlies is gebleken en tevens blijkt dat is voldaan aan het bepaalde in de onderdelen
      a, 1°, en b.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13d
  - number: 13d.10
    text: |-
      Het in een jaar ter zake van een deelneming opgeofferde bedrag wordt op een bij de aangifte gedaan verzoek door de
      inspecteur bij voor bezwaar vatbare beschikking vastgesteld. Indien het opgeofferde bedrag tot een onjuist bedrag
      is vastgesteld, kan de inspecteur de beschikking bij voor bezwaar vatbare beschikking herzien. De bevoegdheid tot
      herziening vervalt door verloop van vijf jaren na de vaststelling van de beschikking.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13d
  - number: 13d.11
    text: |-
      Indien de onderneming van het ontbonden lichaam geheel of gedeeltelijk wordt voortgezet door de belastingplichtige
      of door een met hem verbonden lichaam wordt het liquidatieverlies op verzoek van de belastingplichtige bij voor
      bezwaar vatbare beschikking van de inspecteur vastgesteld. [Artikel 20b, derde lid][ref1] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel20b
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13d
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 20b
        hoofdstuk: IV
  - number: 13e.1
    text: |-
      Indien de onderneming van het ontbonden lichaam geheel of gedeeltelijk is voortgezet door de belastingplichtige
      wordt het op de voet van [artikel 13d][ref1] berekende liquidatieverlies in aanmerking genomen zodra de onderneming
      door de belastingplichtige geheel is gestaakt, of geheel of gedeeltelijk is voortgezet uitsluitend door een ander
      dan de belastingplichtige of een met hem verbonden lichaam, mits wordt voldaan aan de voorwaarden van artikel 13d,
      negende lid, onderdelen a en c.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel13d
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13e
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 13d
        hoofdstuk: II
        afdeling: '2.5'
  - number: 13e.2
    text: |-
      Indien de onderneming van het ontbonden lichaam geheel of gedeeltelijk is voortgezet door een verbonden
      lichaam waarin de belastingplichtige of een met hem verbonden lichaam deelneemt, wordt het voor de verkrijging
      van die deelneming opgeofferde bedrag verhoogd met het ten aanzien van het ontbonden lichaam op de voet van
      [artikel 13d][ref1] berekende liquidatieverlies, mits wordt voldaan aan de voorwaarden van artikel 13d, negende
      lid, onderdelen a en c.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel13d
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13e
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 13d
        hoofdstuk: II
        afdeling: '2.5'
  - number: 13e.3
    text: |-
      Indien tot de voortgezette onderneming of het voortgezette gedeelte van de onderneming een in het buitenland
      gedreven onderneming behoort waarvan het saldo van de positieve en negatieve bedragen aan winst waarop de in
      [artikel 15e][ref1] geregelde objectvrijstelling voor buitenlandse ondernemingswinsten van toepassing is, op het
      tijdstip van aanvang van de voortzetting negatief was, wordt:


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15e
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13e
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 15e
        hoofdstuk: II
        afdeling: 2.10a
  - number: 13e.3.a
    text: |-
      het in aanmerking te nemen liquidatieverlies, bedoeld in het eerste lid, verminderd met het stakingsverlies,
      bedoeld in [artikel 15i][ref1], voor zover dat verlies in aftrek is gekomen en heeft geleid tot een
      winstvermindering;


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15i
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13e
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 15i
        hoofdstuk: II
        afdeling: 2.10a
  - number: 13e.3.b
    text: |-
      de in het tweede lid bedoelde verhoging van het opgeofferde bedrag verminderd met het op de voet van
      [artikel 15j][ref1] naar die deelneming doorgeschoven saldo, voor zover dit saldo bij die deelneming als
      stakingsverlies als bedoeld in [artikel 15i][ref2] in aftrek is gekomen en heeft geleid tot een winstvermindering.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15j
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel15i
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13e
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 15j
        hoofdstuk: II
        afdeling: 2.10a
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 15i
        hoofdstuk: II
        afdeling: 2.10a
  - number: 13h
    text: |-
      Indien bij het bepalen van de in een jaar genoten winst ten aanzien van de belastingplichtige met toepassing
      van [artikel 3.55][ref1], [3.56][ref2] of [3.57 van de Wet inkomstenbelasting 2001][ref3] een voordeel uit de
      vervreemding van aandelen of winstbewijzen die geen deelneming vormen, niet in aanmerking is genomen terwijl de
      door hem verkregen aandelen of winstbewijzen op het tijdstip van de aandelenfusie of de overgang onder algemene
      titel in het kader van een fusie of een splitsing van een rechtspersoon dan wel op enig tijdstip daarna wel een
      deelneming vormen of tot een deelneming gaan behoren:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13h
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 13h.a
    text: |-
      vindt de deelnemingsvrijstelling geen toepassing op positieve voordelen uit hoofde van die deelneming met
      uitzondering van uitkeringen van winst, tot het bedrag van het voordeel dat met toepassing van een van de genoemde
      artikelen buiten aanmerking is gebleven, behalve voorzover het voordeel al eerder in aanmerking is genomen;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13h
  - number: 13h.b
    text: |-
      wordt voor de bepaling van het opgeofferde bedrag, bedoeld in [artikel 13d][ref1], de verkrijgingsprijs niet hoger
      gesteld dan het bedrag hetwelk de belastingplichtige voor de in het kader van de aandelenfusie, de juridische
      splitsing of de juridische fusie vervreemde aandelen of winstbewijzen heeft opgeofferd.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel13d
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13h
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 13d
        hoofdstuk: II
        afdeling: '2.5'
  - number: 13i.1
    text: |-
      Indien de belastingplichtige aandelen of winstbewijzen die een deelneming vormen, in het kader van een
      aandelenfusie als bedoeld in [artikel 3.55 van de Wet inkomstenbelasting 2001][ref1] vervreemdt,


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13i
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 13i.1.a
    text: |-
      wordt het voor de aandelen of winstbewijzen die in het kader van de fusie worden verkregen, opgeofferde bedrag,
      bedoeld in [artikel 13d][ref1], niet hoger gesteld dan het bedrag dat voor de vervreemde aandelen of winstbewijzen
      is opgeofferd;


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel13d
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13i
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 13d
        hoofdstuk: II
        afdeling: '2.5'
  - number: 13i.1.b
    text: |-
      wordt een geldlening waarop [artikel 10a, eerste lid][ref1], van toepassing is die verband houdt met de vervreemde
      aandelen, geacht verband te houden met de aandelen of winstbewijzen die in het kader van de fusie worden verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13i
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 10a
        hoofdstuk: II
        afdeling: '2.2'
  - number: 13i.2
    text: |-
      Indien het voordeel uit de vervreemding van aandelen of winstbewijzen ingevolge
      [artikel 3.55 van de Wet inkomstenbelasting 2001][ref1] niet in aanmerking wordt genomen:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13i
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 13i.2.a
    text: |-
      treden de aandelen of winstbewijzen die in het kader van de fusie worden verkregen, ingeval deze een deelneming
      vormen, in de plaats van de aandelen of winstbewijzen die in het kader van de fusie worden vervreemd;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13i
  - number: 13i.2.b
    text: |-
      worden de verkregen aandelen of winstbewijzen, ingeval deze geen deelneming vormen, in afwijking in zoverre van het
      genoemde artikel, te boek gesteld op de waarde in het economische verkeer verminderd met het bedrag dat ingevolge
      het tweede lid van dat artikel, buiten aanmerking is gebleven.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13i
  - number: 13j.1
    text: |-
      Indien vermogen van een rechtspersoon waarin de belastingplichtige een deelneming
      heeft, in het kader van een splitsing onder algemene titel overgaat, wordt de in
      [artikel 3.56, eerste lid, van de Wet inkomstenbelasting 2001][ref1] bedoelde vervreemding van aandelen en
      schuldvorderingen geacht te hebben plaatsgevonden aan een met de belastingplichtige en de splitsende rechtspersoon
      verbonden lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13j
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 13j.2
    text: |-
      Het voor de aandelen in de splitsende rechtspersoon opgeofferde bedrag, bedoeld in [artikel 13d, tweede lid][ref1],
      wordt voor een evenredig gedeelte toegerekend aan de door de verkrijgende rechtspersonen uitgereikte aandelen.
      Indien de splitsende rechtspersoon na de splitsing blijft bestaan, wordt het voor de aandelen in de splitsende
      rechtspersoon opgeofferde bedrag in dezelfde mate verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel13d
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13j
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 13d
        hoofdstuk: II
        afdeling: '2.5'
  - number: 13j.3
    text: |-
      Een geldlening waarop [artikel 10a, eerste lid][ref1], van toepassing is en die verband houdt met de aandelen die
      de belastingplichtige in de splitsende rechtspersoon heeft, wordt geacht verband te houden met de aandelen die de
      belastingplichtige direct na de splitsing heeft op de bij de splitsing betrokken rechtspersonen.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13j
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 10a
        hoofdstuk: II
        afdeling: '2.2'
  - number: 13j.4
    text: |-
      Indien het voordeel bij de splitsing ingevolge [artikel 3.56, tweede lid, van de Wet inkomstenbelasting 2001][ref1]
      niet in aanmerking wordt genomen:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13j
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 13j.4.a
    text: |-
      treden de aandelen die de belastingplichtige direct na de splitsing in de splitsende en verkrijgende rechtspersonen
      heeft, ingeval deze een deelneming vormen, in de plaats van de aandelen die de belastingplichtige ten tijde van de
      splitsing in de splitsende rechtspersoon heeft;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13j
  - number: 13j.4.b
    text: |-
      worden de aandelen die de belastingplichtige direct na de splitsing in de splitsende- en de verkrijgende
      rechtspersonen heeft, voorzover deze geen deelneming vormen, in afwijking in zoverre van het derde lid van het
      genoemde artikel, te boek gesteld voor de waarde in het economische verkeer verminderd met het voordeel dat niet in
      aanmerking is genomen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13j
  - number: 13j.5
    text: |-
      De vorige leden zijn van overeenkomstige toepassing indien in het kader van de splitsing aandelen worden
      uitgereikt:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13j
  - number: 13j.5.a
    text: aan een ander lichaam dan de belastingplichtige of
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13j
  - number: 13j.5.b
    text: door een andere rechtspersoon dan de rechtspersoon op wie de vermogensbestanddelen onder algemene titel overgaan.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13j
  - number: 13k.1
    text: |-
      Indien het vermogen van een rechtspersoon waarin de belastingplichtige een deelneming
      heeft, in het kader van een fusie onder algemene titel overgaat, wordt de in
      [artikel 3.57, eerste lid, van de Wet inkomstenbelasting 2001][ref1] bedoelde vervreemding van aandelen
      en schuldvorderingen geacht te hebben plaatsgevonden aan een met de belastingplichtige en de verdwijnende
      rechtspersoon verbonden lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13k
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 13k.2
    text: |-
      Het voor de aandelen in de verkrijgende rechtspersoon opgeofferde bedrag, bedoeld in [artikel 13d][ref1], wordt
      niet hoger gesteld dan het bedrag dat is opgeofferd voor de aandelen in de verdwijnende rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel13d
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13k
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 13d
        hoofdstuk: II
        afdeling: '2.5'
  - number: 13k.3
    text: |-
      Een geldlening waarop [artikel 10a, eerste lid][ref1], van toepassing is en die verband houdt met de aandelen die
      de belastingplichtige in de verdwijnende rechtspersoon heeft, wordt geacht verband te houden met de aandelen die de
      belastingplichtige direct na de fusie in de verkrijgende rechtspersoon heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13k
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 10a
        hoofdstuk: II
        afdeling: '2.2'
  - number: 13k.4
    text: |-
      Indien het voordeel bij de fusie ingevolge [artikel 3.57, tweede lid, van de Wet inkomstenbelasting 2001][ref1],
      niet in aanmerking wordt genomen:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13k
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 13k.4.a
    text: |-
      treden de in het kader van de fusie verkregen aandelen ingeval deze een deelneming vormen, in de plaats van de
      aandelen die de belastingplichtige ten tijde van de fusie in de verdwijnende rechtspersoon heeft;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13k
  - number: 13k.4.b
    text: |-
      worden de in het kader van de fusie verkregen aandelen, ingeval deze geen deelneming vormen, in afwijking in
      zoverre van het [derde lid van het genoemde artikel][ref1], te boek gesteld voor de waarde in het economische
      verkeer verminderd met het voordeel dat niet in aanmerking is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13k
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 13k.5
    text: |-
      Indien de belastingplichtige tevens de verkrijgende rechtspersoon is, vindt artikel
      [3.57, tweede lid, van de Wet inkomstenbelasting 2001][ref1] geen toepassing. Onze Minister kan, op een voor de
      fusie gedaan verzoek van de belastingplichtige, onder door hem te stellen voorwaarden, de inspecteur toestaan het
      voordeel dat als gevolg van de in het eerste lid bedoelde vervreemding tot uitdrukking komt, geheel of ten dele
      buiten aanmerking te laten. De in de tweede volzin bedoelde voorwaarden mogen slechts strekken ter verzekering
      van de heffing en de invordering van belasting welke verschuldigd zou zijn of zou worden indien die volzin buiten
      toepassing zou blijven. De inspecteur beslist op het verzoek bij voor bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13k
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 13k.6
    text: |-
      De vorige leden zijn van overeenkomstige toepassing indien in het kader van de fusie aandelen worden uitgereikt
      door een andere rechtspersoon dan de rechtspersoon op wie de vermogensbestanddelen onder algemene titel overgaan.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13k
  - number: 13l.1
    text: |-
      Bij het bepalen van de in een jaar genoten winst komt niet in aftrek het op de voet van dit artikel bepaalde
      bedrag aan renten en kosten ter zake van geldleningen dat geacht wordt verband te houden met de financiering van
      deelnemingen (bovenmatige deelnemingsrente), voor zover het bedrag aan bovenmatige deelnemingsrente € 750 000 te
      boven gaat.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13l
  - number: 13l.2
    text: |-
      De bovenmatige deelnemingsrente van een jaar wordt gesteld op het gedeelte van het totale bedrag aan renten en
      kosten ter zake van geldleningen van het jaar, dat evenredig is aan de verhouding tussen het gemiddelde bedrag
      aan deelnemingsschulden in het jaar en het gemiddelde totale bedrag aan geldleningen in het jaar. De in de
      eerste volzin bedoelde gemiddelden worden bepaald naar de stand bij het begin en het einde van het jaar, waarbij
      tijdelijke mutaties rond die tijdstippen worden genegeerd voor zover deze plaatsvinden met het oog op de toepassing
      van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13l
  - number: 13l.3
    text: |-
      Van een deelnemingsschuld als bedoeld in het tweede lid is sprake voor zover het gezamenlijke bedrag van
      de verkrijgingsprijs van de deelnemingen uitgaat boven het eigen vermogen, met dien verstande dat een
      deelnemingsschuld nooit meer bedraagt dan het gezamenlijke bedrag van de geldleningen en nooit meer bedraagt dan
      het gezamenlijke bedrag van de verkrijgingsprijs van de deelnemingen. Een op de voet van de eerste volzin bepaalde
      deelnemingsschuld wordt verminderd met het bedrag van de schulden waarop [artikel 10a, eerste lid][ref1], of
      [artikel 10b][ref2] van toepassing is, doch niet verder dan tot nihil, voor zover de rechtshandelingen waarmee die
      schulden rechtens dan wel in feite direct of indirect verband houden de deelnemingsschuld zoals berekend volgens de
      eerste volzin vergroten.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel10b
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13l
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 10a
        hoofdstuk: II
        afdeling: '2.2'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 10b
        hoofdstuk: II
        afdeling: '2.2'
  - number: 13l.4
    text: |-
      Voor zover de belastingplichtige een deelneming anders waardeert dan op verkrijgingsprijs, wordt voor de bepaling
      van de deelnemingsschuld ingevolge het derde lid de boekwaarde van het eigen vermogen verminderd met het bedrag van
      de boekwaarde van die deelneming verminderd met de verkrijgingsprijs van die deelneming.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13l
  - number: 13l.5
    text: |-
      Voor de toepassing van het derde lid blijft de verkrijgingsprijs van een deelneming buiten aanmerking voor zover
      het belang in het lichaam waarin de deelneming wordt gehouden is verworven of uitgebreid of daarin eigen vermogen
      is gebracht in verband met een uitbreiding op dat moment dan wel in de daaraan voorafgaande of daarop volgende
      periode van twaalf maanden van de operationele activiteiten van de groep bestaande uit de belastingplichtige
      tezamen met de met hem verbonden lichamen en de verkrijgingsprijs is toe te rekenen aan de hiervoor bedoelde
      uitbreiding van operationele activiteiten.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13l
  - number: 13l.6
    text: |-
      De toepassing van het vijfde en tiende lid met betrekking tot een deelneming blijft in een jaar achterwege voor
      zover:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13l
  - number: 13l.6.a
    text: |-
      de in het jaar in verband met de financiering van die deelneming verschuldigde renten en kosten naast de
      belastingplichtige door een met de belastingplichtige verbonden lichaam rechtens dan wel in feite in aftrek kunnen
      worden gebracht op de grondslag van een naar de winst geheven belasting;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13l
  - number: 13l.6.b
    text: |-
      de in het jaar in verband met de financiering van die deelneming verschuldigde renten en kosten rechtens dan wel
      in feite direct of indirect staan tegenover een vergoeding voor verstrekking van vermogen aan het lichaam waarin
      de deelneming wordt gehouden of aan een met de belastingplichtige verbonden lichaam, waarbij de voldoening van de
      vergoeding rechtens dan wel in feite direct of indirect in aftrek kan worden gebracht op de grondslag van een naar
      de winst geheven belasting terwijl over de ontvangst van de vergoeding per saldo geen belasting naar de winst wordt
      geheven of geen belasting naar de winst wordt geheven welke naar Nederlandse maatstaven redelijk is als bedoeld in
      [artikel 10a, derde lid, onderdeel b][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13l
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 10a
        hoofdstuk: II
        afdeling: '2.2'
  - number: 13l.6.c
    text: |-
      de verwerving of de uitbreiding van de deelneming, dan wel de inbreng van eigen vermogen in het lichaam waarin de
      deelneming wordt gehouden, niet door de belastingplichtige zou hebben plaatsgevonden, of de deelneming niet door de
      belastingplichtige zou zijn gehouden, ingeval de aftrek van rente buiten beschouwing zou worden gelaten.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13l
  - number: 13l.7
    text: |-
      Dit artikel is slechts van toepassing op bestanddelen van de winst die geen deel uitmaken van winst uit een andere
      staat als bedoeld in [artikel 15e][ref1] waarop de objectvrijstelling voor buitenlandse ondernemingswinsten van
      toepassing is en op bestanddelen van het vermogen welke niet dienstbaar zijn aan het behalen van dergelijke winst
      uit een andere staat.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15e
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13l
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 15e
        hoofdstuk: II
        afdeling: 2.10a
  - number: 13l.8
    text: 'Voor de toepassing van dit artikel:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13l
  - number: 13l.8.a
    text: |-
      wordt onder geldlening verstaan een schuld die voortvloeit uit een overeenkomst van geldlening of uit een daarmee
      vergelijkbare overeenkomst, waarbij zonder toepassing van dit artikel rente in aanmerking wordt genomen bij het
      bepalen van de winst;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13l
  - number: 13l.8.b
    text: wordt onder een deelneming verstaan een bezit waarop de deelnemingsvrijstelling van toepassing is;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13l
  - number: 13l.8.c
    text: |-
      worden onder renten en kosten ter zake van geldleningen mede begrepen kosten en resultaten ter zake van
      rechtshandelingen die strekken tot het afdekken van renterisico’s op geldleningen of van valutarisico’s op de rente
      ter zake van geldleningen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13l
  - number: 13l.9
    text: |-
      Indien de belastingplichtige actieve financieringsactiviteiten binnen het concern verricht, blijven voor
      de toepassing van het tweede en derde lid buiten aanmerking geldleningen voor zover deze verband houden met
      geldvorderingen welke in het kader van die actieve financieringsactiviteiten binnen het concern worden aangehouden,
      evenals de renten en kosten ter zake van dergelijke geldleningen. Onder actieve financieringsactiviteiten binnen
      het concern als bedoeld in de eerste volzin worden verstaan werkzaamheden die door de belastingplichtige anders
      dan incidenteel worden verricht in verband met het arrangeren en uitvoeren van financiële transacties via eigen
      bankrekeningen ten behoeve van de belastingplichtige tezamen met de met hem verbonden lichamen, waarbij het
      aantal personen in dienstbetrekking bij de belastingplichtige, hun bevoegdheden en verantwoordelijkheden in
      overeenstemming zijn met de aard en functie van de belastingplichtige en de belastingplichtige voorts beschikt over
      een kantoor dat is voorzien van in de financiële sector gebruikelijke faciliteiten. Onder geldvordering als bedoeld
      in de eerste volzin wordt verstaan een vordering die voortvloeit uit een overeenkomst van geldlening of uit een
      daarmee vergelijkbare overeenkomst.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13l
  - number: 13l.10
    text: |-
      In afwijking van het vijfde lid kan de belastingplichtige voor de toepassing van het derde lid 90% van de
      verkrijgingsprijs van een deelneming buiten aanmerking laten voor zover het lichaam waarin de deelneming wordt
      gehouden is verworven of uitgebreid of in dat lichaam eigen vermogen is ingebracht in een boekjaar dat is
      aangevangen voor of op 1 januari 2006.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13l
  - number: 13l.11
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld voor de toepassing van dit artikel
      ingeval de belastingplichtige, de deelneming of het lichaam waarin de deelneming wordt gehouden onmiddellijk of
      middellijk is betrokken bij een reorganisatie of deel gaat uitmaken van een fiscale eenheid. Onder die regels
      kunnen mede regels worden begrepen met betrekking tot de verkrijgingprijs van de deelneming en de aan de deelneming
      toe te rekenen financiering. De voordracht voor een algemene maatregel van bestuur als bedoeld in de eerste volzin
      wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel13l
  - number: '14.1'
    text: |-
      De belastingplichtige die zijn gehele onderneming of een zelfstandig onderdeel van een onderneming overdraagt
      (overdrager) aan een ander lichaam dat reeds belastingplichtig is of door de overname belastingplichtig wordt
      (overnemer), tegen uitreiking van aandelen in de overnemer (bedrijfsfusie), behoeft de winst behaald met of bij
      de overdracht niet in aanmerking te nemen, mits voor het bepalen van de winst bij de overdrager en de overnemer
      dezelfde bepalingen van toepassing zijn, de overnemer niet op de voet van [artikel 20][ref1] aanspraak kan
      maken op voorwaartse verrekening van verliezen, op vermindering ter voorkoming van dubbele belasting ter zake
      van buitenlandse resultaten, op toepassing van de innovatiebox, op toepassing van de objectvrijstelling voor
      buitenlandse ondernemingswinsten, op toepassing van de deelnemingsverrekening of op toepassing van de verrekening
      bij buitenlandse ondernemingswinsten en latere heffing is verzekerd. Indien de winst niet in aanmerking wordt
      genomen, treedt de overnemer ten aanzien van alle vermogensbestanddelen die in het kader van de bedrijfsfusie zijn
      verkregen in de plaats van de overdrager.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel20
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '20'
        hoofdstuk: IV
  - number: '14.2'
    text: |-
      Bestaat voor de overnemer aanspraak op voorwaartse verrekening van verliezen, op vermindering ter voorkoming
      van dubbele belasting ter zake van buitenlandse resultaten, op toepassing van de innovatiebox, op toepassing
      van de objectvrijstelling voor buitenlandse ondernemingswinsten, op toepassing van de deelnemingsverrekening of
      op toepassing van de verrekening bij buitenlandse ondernemingswinsten, zijn voor het bepalen van de winst niet
      dezelfde bepalingen van toepassing of kan de belastingheffing uit anderen hoofde alleen met behulp van nadere
      voorwaarden worden verzekerd, dan kan Onze Minister op gezamenlijk verzoek van de overdrager en de overnemer onder
      te stellen nadere voorwaarden, de inspecteur belast met de aanslagregeling van de overdrager toestaan de winst
      behaald met of bij de overdracht geheel of ten dele buiten aanmerking te laten. Daarbij treedt de overnemer ten
      aanzien van al hetgeen in het kader van de overdracht is verkregen, voorzover daaraan geen nadere voorwaarden zijn
      gesteld, in de plaats van de overdrager. Het verzoek wordt voor de overdracht gedaan bij de in de vorige volzin
      bedoelde inspecteur, die daarop bij voor bezwaar vatbare beschikking beslist.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14
  - number: '14.3'
    text: |-
      Indien de winst op de voet van het eerste of het tweede lid buiten aanmerking blijft en de in het kader van de
      bedrijfsfusie verkregen aandelen een deelneming vormen, wordt het voor die aandelen opgeofferde bedrag gesteld
      op de fiscale boekwaarde van het overgedragen vermogen verminderd met de daarin begrepen reserves bedoeld in de
      [artikelen 3.53][ref1] en [3.54 van de Wet inkomstenbelasting 2001][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
  - number: '14.4'
    text: |-
      In afwijking van het eerste en het tweede lid, wordt de winst wel in aanmerking genomen, indien de bedrijfsfusie
      in overwegende mate is gericht op het ontgaan of uitstellen van belastingheffing. De bedrijfsfusie wordt, tenzij
      het tegendeel aannemelijk wordt gemaakt, geacht in overwegende mate te zijn gericht op het ontgaan of uitstellen
      van belastingheffing indien deze niet plaatsvindt op grond van zakelijke overwegingen, zoals herstructurering of
      rationalisering van de actieve werkzaamheden van de overdrager en de overnemer. Indien aandelen in de overdrager
      dan wel in de overnemer binnen drie jaar na de overdracht geheel of ten dele, direct of indirect worden vervreemd
      aan een lichaam dat niet met de overdrager en de overnemer is verbonden, worden zakelijke overwegingen niet
      aanwezig geacht, tenzij het tegendeel aannemelijk wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14
  - number: '14.5'
    text: |-
      Ten aanzien van een fonds voor gemene rekening zijn de voorgaande leden van overeenkomstige toepassing in geval van
      overgang van bezittingen van dat fonds.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14
  - number: '14.6'
    text: |-
      Voor de toepassing van dit artikel worden met aandelen gelijkgesteld winstbewijzen, bewijzen van deelgerechtigdheid
      of lidmaatschapsrechten.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14
  - number: '14.7'
    text: |-
      De in het tweede lid bedoelde voorwaarden mogen slechts strekken ter verzekering van de heffing en de invordering
      van belasting die verschuldigd zou zijn of zou worden indien het tweede of het vijfde lid buiten toepassing zou
      blijven. Voorts kunnen voorwaarden worden gesteld die betrekking hebben op het bepalen van de in een jaar genoten
      winst, de toelaatbare reserves, de verrekening van verliezen, de vermindering ter voorkoming van dubbele belasting
      ter zake van buitenlandse resultaten, de toepassing van de innovatiebox, de toepassing van de objectvrijstelling
      voor buitenlandse ondernemingswinsten, de toepassing van de deelnemingsverrekening of de toepassing van de
      verrekening bij buitenlandse ondernemingswinsten en kunnen voorwaarden worden gesteld indien de waarde in het
      economische verkeer van de overgedragen vermogensbestanddelen op het tijdstip van de bedrijfsfusie lager is dan de
      boekwaarde van deze vermogensbestanddelen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14
  - number: '14.8'
    text: |-
      De overdrager die zekerheid wenst omtrent de vraag of de bedrijfsfusie niet wordt geacht in overwegende mate te
      zijn gericht op het ontgaan of uitstellen van belastingheffing, kan voor de overdracht een verzoek indienen bij de
      inspecteur, die daarop bij voor bezwaar vatbare beschikking beslist.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14
  - number: '14.9'
    text: |-
      De overdrager of de overnemer die voorafgaande aan een voorgenomen vervreemding van aandelen als bedoeld in de
      laatste volzin van het vierde lid, zekerheid wil hebben omtrent de vraag of, niettegenstaande de vervreemding,
      aannemelijk is dat de overdracht niet in overwegende mate is gericht op het ontgaan of uitstellen van
      belastingheffing, kan een verzoek indienen bij de inspecteur, die daarop bij voor bezwaar vatbare beschikking
      beslist.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14
  - number: 14a.1
    text: |-
      Indien vermogen van een belastingplichtige onder algemene titel in het kader van een splitsing overgaat (de
      splitsende rechtspersoon), wordt:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14a
  - number: 14a.1.a
    text: |-
      indien de splitsende rechtspersoon ophoudt te bestaan: de splitsende rechtspersoon geacht zijn
      vermogensbestanddelen ten tijde van de splitsing te hebben overgedragen aan de rechtspersonen waarop deze
      vermogensbestanddelen onder algemene titel overgaan (verkrijgende rechtspersonen) en ten tijde van de splitsing te
      zijn opgehouden uit zijn onderneming in Nederland belastbare winst te genieten;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14a
  - number: 14a.1.b
    text: |-
      indien de splitsende rechtspersoon blijft bestaan: de splitsende rechtspersoon geacht de vermogensbestanddelen
      die in het kader van de splitsing overgaan, ten tijde van de splitsing te hebben overgedragen aan de rechtspersoon
      of rechtspersonen waarop deze vermogensbestanddelen onder algemene titel overgaan (verkrijgende rechtspersoon
      respectievelijk verkrijgende rechtspersonen).
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14a
  - number: 14a.2
    text: |-
      De winst behaald als gevolg van het eerste lid behoeft niet in aanmerking te worden genomen, mits voor het
      bepalen van de winst bij de splitsende rechtspersoon en de verkrijgende rechtspersonen dezelfde bepalingen van
      toepassing zijn, noch bij de splitsende rechtspersoon indien deze ophoudt te bestaan noch bij de verkrijgende
      rechtspersoon aanspraak bestaat op voorwaartse verrekening van verliezen op de voet van [artikel 20][ref1], op
      vermindering ter voorkoming van dubbele belasting ter zake van buitenlandse resultaten, op toepassing van de
      innovatiebox, op toepassing van de objectvrijstelling voor buitenlandse ondernemingswinsten, op toepassing van de
      deelnemingsverrekening of op toepassing van de verrekening bij buitenlandse ondernemingswinsten en latere heffing
      is verzekerd. Indien de winst buiten aanmerking blijft, treedt de verkrijgende rechtspersoon met betrekking tot al
      hetgeen in het kader van de splitsing is verkregen in de plaats van de splitsende rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel20
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '20'
        hoofdstuk: IV
  - number: 14a.3
    text: |-
      Ingeval niet is voldaan aan de in het tweede lid, eerste volzin, bedoelde vereisten, kan onze Minister, op een
      gezamenlijk voor de splitsing gedaan verzoek van de splitsende rechtspersoon en de verkrijgende rechtspersonen,
      onder door hem te stellen voorwaarden de inspecteur belast met de aanslagregeling van de splitsende rechtspersoon
      toestaan de winst behaald als gevolg van het eerste lid geheel of ten dele buiten aanmerking te laten. Daarbij
      treedt de verkrijgende rechtspersoon met betrekking tot al hetgeen in het kader van de splitsing is verkregen,
      voorzover daaraan geen voorwaarden zijn gesteld, in de plaats van de splitsende rechtspersoon. De inspecteur
      beslist op het verzoek bij voor bezwaar vatbare beschikking waarin de in de eerste volzin bedoelde voorwaarden
      zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14a
  - number: 14a.4
    text: |-
      Indien de winst niet in aanmerking wordt genomen en de verkrijgende rechtspersoon aandelen uitreikt aan
      de splitsende rechtspersoon wordt, indien de uitgereikte aandelen een deelneming vormen, het voor die
      aandelen opgeofferde bedrag gesteld op de fiscale boekwaarde van het vermogen dat in het kader van de
      splitsing overgaat verminderd met de daarin begrepen reserves als bedoeld in de [artikelen 3.53][ref1] en
      [3.54 van de Wet inkomstenbelasting 2001][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 14a.5
    text: |-
      De in het derde lid bedoelde voorwaarden mogen slechts strekken ter verzekering van de heffing en de invordering
      van belasting welke verschuldigd zou zijn of zou worden indien de eerste volzin van het derde lid buiten
      toepassing zou blijven. Voorts kunnen voorwaarden worden gesteld die betrekking hebben op het bepalen van de in
      een jaar genoten winst van de verkrijgende rechtspersoon, de toelaatbare reserves, de verrekening van verliezen,
      de vermindering ter voorkoming van dubbele belasting ter zake van buitenlandse resultaten, de toepassing van de
      innovatiebox, de toepassing van de objectvrijstelling voor buitenlandse ondernemingswinsten, de toepassing van
      de deelnemingsverrekening of de toepassing van de verrekening bij buitenlandse ondernemingswinsten en kunnen
      voorwaarden worden gesteld indien de waarde in het economisch verkeer van de vermogensbestanddelen die onder
      algemene titel overgaan op het tijdstip van de overgang lager is dan de boekwaarde van deze vermogensbestanddelen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14a
  - number: 14a.6
    text: |-
      Het tweede lid, respectievelijk het derde lid, eerste volzin, is niet van toepassing indien de splitsing in
      overwegende mate is gericht op het ontgaan of uitstellen van belastingheffing. De splitsing wordt, tenzij het
      tegendeel aannemelijk wordt gemaakt, geacht in overwegende mate te zijn gericht op het ontgaan of uitstellen van
      belastingheffing indien de splitsing niet plaatsvindt op grond van zakelijke overwegingen zoals herstructurering of
      rationalisering van de actieve werkzaamheden van de splitsende- en de verkrijgende rechtspersonen. Indien aandelen
      in de gesplitste rechtspersoon, dan wel in een verkrijgende rechtspersoon binnen drie jaar na de splitsing geheel
      of ten dele, direct of indirect worden vervreemd aan een lichaam dat niet met de gesplitste rechtspersoon en met de
      verkrijgende rechtspersonen is verbonden, worden zakelijke overwegingen niet aanwezig geacht, tenzij het tegendeel
      aannemelijk wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14a
  - number: 14a.7
    text: |-
      De verkrijgende rechtspersoon wordt ten tijde van de splitsing als een met de belastingplichtige verbonden lichaam
      aangemerkt.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14a
  - number: 14a.8
    text: |-
      De splitsende rechtspersoon die zekerheid wil hebben omtrent de vraag of de splitsing niet wordt geacht in
      overwegende mate te zijn gericht op het ontgaan of uitstellen van belastingheffing kan voor de splitsing een
      verzoek indienen bij de inspecteur, die daarop bij voor bezwaar vatbare beschikking beslist.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14a
  - number: 14a.9
    text: |-
      De gesplitste rechtspersoon of de verkrijgende rechtspersoon die voorafgaande aan een voorgenomen vervreemding van
      aandelen als bedoeld in het zesde lid, laatste volzin, zekerheid wil hebben omtrent de vraag of, niettegenstaande
      de vervreemding, aannemelijk is dat de splitsing niet in overwegende mate is gericht op het ontgaan of uitstellen
      van belastingheffing, kan een verzoek indienen bij de inspecteur, die daarop bij voor bezwaar vatbare beschikking
      beslist.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14a
  - number: 14a.10
    text: |-
      Voor de toepassing van dit artikel worden met aandelen gelijk gesteld winstbewijzen, bewijzen van
      deelgerechtigdheid en lidmaatschapsrechten.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14a
  - number: 14a.11
    text: |-
      Het tweede tot en met het tiende lid vinden slechts toepassing indien de splitsende
      en de verkrijgende rechtspersonen in Nederland zijn gevestigd, of in de zin van
      [artikel 3.55, vijfde lid, van de Wet inkomstenbelasting 2001][ref1] zijn gevestigd in een lidstaat van de Europese
      Unie of een bij ministeriële regeling aangewezen staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 14a.12
    text: |-
      Renten en kosten ter zake van schulden die voortvloeien uit een overeenkomst van geldlening of een daarmee
      vergelijkbare overeenkomst, waarbij rente in aanmerking wordt genomen bij het bepalen van de winst en die verband
      houden met de verwerving van een belang in een lichaam (overnameschulden), komen in gevallen waarbij na de
      splitsing zowel de overnameschuld als het vermogen van het lichaam waarin een belang is verworven deel zijn gaan
      uitmaken van het vermogen van eenzelfde lichaam, slechts in aftrek tot het bedrag dat de winst van het lichaam dat
      de schuld heeft opgenomen zou hebben belopen indien de splitsing niet zou hebben plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14a
  - number: 14a.13
    text: |-
      Voor de toepassing van het twaalfde lid is [artikel 15ad, tweede tot en met tiende lid][ref1], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15ad
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 15ad
        hoofdstuk: II
        afdeling: '2.9'
  - number: 14a.14
    text: |-
      Het twaalfde lid is van overeenkomstige toepassing met betrekking tot renten van schulden welke verband houden met
      de verwerving van aandelen die in het kader van de splitsing zijn uitgegeven dan wel met terugbetaling op aandelen
      in het kader van de splitsing.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14a
  - number: 14b.1
    text: |-
      Indien vermogen van een belastingplichtige onder algemene titel in het kader van een fusie overgaat (de
      verdwijnende rechtspersoon), wordt de verdwijnende rechtspersoon geacht zijn vermogensbestanddelen ten tijde
      van de fusie te hebben overgedragen aan de rechtspersoon waarop deze vermogensbestanddelen onder algemene titel
      overgaan (verkrijgende rechtspersoon) en ten tijde van de fusie te zijn opgehouden uit de onderneming in Nederland
      belastbare winst te genieten.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14b
  - number: 14b.2
    text: |-
      De winst behaald als gevolg van het eerste lid behoeft niet in aanmerking te worden genomen, mits voor het bepalen
      van de winst bij de verdwijnende rechtspersoon en de verkrijgende rechtspersoon dezelfde bepalingen van toepassing
      zijn, bij geen van deze rechtspersonen aanspraak bestaat op voorwaartse verrekening van verliezen op de voet van
      [artikel 20][ref1], op vermindering ter voorkoming van dubbele belasting ter zake van buitenlandse resultaten, op
      toepassing van de innovatiebox, op toepassing van de objectvrijstelling voor buitenlandse ondernemingswinsten, op
      toepassing van de deelnemingsverrekening of op toepassing van de verrekening bij buitenlandse ondernemingswinsten
      en latere heffing is verzekerd. Indien de winst buiten aanmerking blijft, treedt de verkrijgende rechtspersoon met
      betrekking tot al hetgeen in het kader van de fusie is verkregen in de plaats van de verdwijnende rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel20
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '20'
        hoofdstuk: IV
  - number: 14b.3
    text: |-
      Ingeval niet is voldaan aan de in het tweede lid, eerste volzin, bedoelde vereisten, kan onze Minister, op een
      gezamenlijk voor de fusie gedaan verzoek van de verdwijnende rechtspersoon en de verkrijgende rechtspersoon, onder
      door hem te stellen voorwaarden de inspecteur belast met de aanslagregeling van de verdwijnende rechtspersoon
      toestaan de winst behaald als gevolg van het eerste lid geheel of ten dele buiten aanmerking te laten. Daarbij
      treedt de verkrijgende rechtspersoon met betrekking tot al hetgeen in het kader van de fusie is verkregen,
      voorzover daaraan geen voorwaarden zijn gesteld, in de plaats van de verdwijnende rechtspersoon. De inspecteur
      beslist op het verzoek bij voor bezwaar vatbare beschikking waarin de in de eerste volzin bedoelde voorwaarden
      zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14b
  - number: 14b.4
    text: |-
      De in het derde lid bedoelde voorwaarden mogen slechts strekken ter verzekering van de heffing en de invordering
      van belasting welke verschuldigd zou zijn of zou worden indien de eerste volzin van het derde lid buiten
      toepassing zou blijven. Voorts kunnen voorwaarden worden gesteld die betrekking hebben op het bepalen van de in
      een jaar genoten winst van de verkrijgende rechtspersoon, de toelaatbare reserves, de verrekening van verliezen,
      de vermindering ter voorkoming van dubbele belasting ter zake van buitenlandse resultaten, de toepassing van de
      innovatiebox, de toepassing van de objectvrijstelling voor buitenlandse ondernemingswinsten, de toepassing van
      de deelnemingsverrekening of de toepassing van de verrekening bij buitenlandse ondernemingswinsten en kunnen
      voorwaarden worden gesteld indien de waarde in het economische verkeer van de vermogensbestanddelen die onder
      algemene titel overgaan op het tijdstip van de overgang lager is dan de boekwaarde van deze vermogensbestanddelen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14b
  - number: 14b.5
    text: |-
      Het tweede lid, respectievelijk het derde lid, eerste volzin, is niet van toepassing indien de fusie in overwegende
      mate is gericht op het ontgaan of uitstellen van belastingheffing. De fusie wordt, tenzij het tegendeel aannemelijk
      wordt gemaakt, geacht in overwegende mate te zijn gericht op het ontgaan of uitstellen van belastingheffing indien
      de fusie niet plaatsvindt op grond van zakelijke overwegingen, zoals herstructurering of rationalisering van de
      actieve werkzaamheden van de verdwijnende en de verkrijgende rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14b
  - number: 14b.6
    text: |-
      De verkrijgende rechtspersoon wordt ten tijde van de fusie als een met de belastingplichtige verbonden lichaam,
      aangemerkt.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14b
  - number: 14b.7
    text: |-
      De verdwijnende rechtspersoon die zekerheid wil hebben omtrent de vraag of de fusie niet wordt geacht in
      overwegende mate te zijn gericht op het ontgaan of uitstellen van belastingheffing kan voor de fusie een verzoek
      indienen bij de inspecteur, die daarop bij voor bezwaar vatbare beschikking beslist.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14b
  - number: 14b.8
    text: |-
      Het tweede tot en met het zevende lid vinden slechts toepassing indien de verdwijnende
      en de verkrijgende rechtspersoon in Nederland zijn gevestigd, of in de zin van
      [artikel 3.55, vijfde lid, Wet inkomstenbelasting 2001][ref1] zijn gevestigd in een lidstaat van de Europese
      Unie of een bij ministeriële regeling aangewezen staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 14b.9
    text: |-
      Renten en kosten ter zake van schulden die voortvloeien uit een overeenkomst van geldlening of een daarmee
      vergelijkbare overeenkomst, waarbij rente in aanmerking wordt genomen bij het bepalen van de winst en die verband
      houden met de verwerving van een belang in een lichaam (overnameschulden), komen in gevallen waarbij na de fusie
      zowel de overnameschuld als het vermogen van het lichaam waarin een belang is verworven deel zijn gaan uitmaken
      van het vermogen van eenzelfde lichaam, slechts in aftrek tot het bedrag dat de winst van het lichaam dat de schuld
      heeft opgenomen zou hebben belopen indien de fusie niet zou hebben plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14b
  - number: 14b.10
    text: |-
      Voor de toepassing van het negende lid is [artikel 15ad, tweede tot en met tiende lid][ref1], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15ad
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 15ad
        hoofdstuk: II
        afdeling: '2.9'
  - number: 14b.11
    text: |-
      Het negende lid is van overeenkomstige toepassing met betrekking tot renten van schulden welke verband houden met
      de verwerving van aandelen die in het kader van de fusie zijn uitgegeven dan wel met terugbetaling op aandelen in
      het kader van de fusie.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14b
  - number: 14c.1
    text: |-
      Indien een naamloze vennootschap of besloten vennootschap met beperkte aansprakelijkheid die uitsluitend
      natuurlijke personen als aandeelhouder heeft, wordt ontbonden en de door de vennootschap gedreven onderneming
      door de aandeelhouders wordt voortgezet, kan Onze Minister op gezamenlijk verzoek van de belastingplichtige en
      de voortzettende aandeelhouders onder door hem nader te stellen voorwaarden toestaan dat de winst die bij of als
      gevolg van de ontbinding tot uitdrukking komt, niet in aanmerking wordt genomen. De aandeelhouders treden met
      betrekking tot de vermogensbestanddelen waarmee zij de onderneming voortzetten en die zij in het kader van de
      ontbinding verkrijgen, ieder voor zijn gedeelte, in de plaats van de belastingplichtige, behalve voorzover bij de
      te stellen voorwaarden anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14c
  - number: 14c.2
    text: 'Indien:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14c
  - number: 14c.2.a
    text: |-
      bij de belastingplichtige de objectvrijstelling voor buitenlandse ondernemingswinsten, bedoeld in
      [artikel 15e][ref1], van toepassing is en de ontbinding zonder toepassing van het eerste lid zou leiden tot een
      stakingsverlies op de voet van [artikel 15i][ref2], kan de belastingplichtige, in afwijking in zoverre van het
      eerste lid, dit verlies onder nader te stellen voorwaarden in aanmerking nemen;


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15e
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel15i
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14c
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 15e
        hoofdstuk: II
        afdeling: 2.10a
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 15i
        hoofdstuk: II
        afdeling: 2.10a
  - number: 14c.2.b
    text: |-
      de belastingplichtige aanspraak kan maken op voorwaartse verrekening van verliezen, blijft de in het eerste lid
      bedoelde winst slechts buiten aanmerking voor zover deze uitgaat boven die verliezen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14c
  - number: 14c.3
    text: |-
      Voorzover na toepassing van het tweede lid verliezen nog niet zijn verrekend, worden deze voor 20/45 deel aangemerkt
      als ondernemingsverlies in de zin van [artikel 3.148, tweede lid, van de Wet inkomstenbelasting 2001][ref1] van de
      aandeelhouders die de onderneming voortzetten. Een en ander voorzover aannemelijk is dat dit verlies is geleden in
      de uitoefening van de onderneming die wordt voortgezet. Het verlies wordt door de inspecteur vastgesteld bij voor
      bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14c
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 14c.4
    text: 'Het eerste lid is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14c
  - number: 14c.4.a
    text: |-
      voorzover de vermogensbestanddelen en fiscale reserves van de belastingplichtige niet kunnen gaan behoren tot het
      vermogen waarmee de onderneming door de aandeelhouders wordt voortgezet;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14c
  - number: 14c.4.b
    text: |-
      indien de naamloze vennootschap of besloten vennootschap met beperkte aansprakelijkheid niet in Nederland is
      gevestigd, behoudens indien de vennootschap een onderneming drijft met behulp van een in Nederland aanwezige vaste
      inrichting, en:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14c
  - number: 14c.4.b.1°
    text: |-
      het heffingsrecht over de uit die onderneming genoten winst ingevolge de
      [Belastingregeling voor het Koninkrijk][ref1], de Belastingregeling voor het land Nederland dan wel een verdrag ter
      voorkoming van dubbele belasting aan Nederland is toegewezen, en


      [ref1]: https://wetten.overheid.nl/BWBR0002464
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14c
    references:
      - id: ref1
        bwb_id: BWBR0002464
  - number: 14c.4.b.2°
    text: |-
      de plaats van de werkelijke leiding van de vennootschap is gelegen op de BES eilanden of in een in het achtste lid
      bedoeld land of bedoelde staat.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14c
  - number: 14c.5
    text: 'Voor de toepassing van dit artikel:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14c
  - number: 14c.5.a
    text: |-
      wordt onder een aandeelhouder die voortzet verstaan een aandeelhouder bij wie de in het eerste
      lid bedoelde vermogensbestanddelen, vanaf het tijdstip dat deze vermogensbestanddelen hem aangaan,
      behoren tot het vermogen van een onderneming met betrekking waartoe hij ondernemer als bedoeld
      in [artikel 3.4 van de Wet Inkomstenbelasting 2001][ref1] of medegerechtigde als bedoeld in
      [artikel 3.3, eerste lid, onderdeel a, van die wet][ref2], is;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14c
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 14c.5.b
    text: |-
      worden met aandeelhouders gelijkgesteld houders van winstbewijzen die medegerechtigd zijn tot het vermogen van
      de vennootschap.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14c
  - number: 14c.6
    text: |-
      De in het eerste lid bedoelde voorwaarden mogen slechts strekken ter verzekering van de heffing en de invordering
      van de inkomstenbelasting en de vennootschapsbelasting die verschuldigd zouden zijn of zouden worden indien het
      eerste lid buiten toepassing zou blijven. Voorts kunnen aan de voortzettende aandeelhouder voorwaarden worden
      gesteld die betrekking hebben op de in een jaar genoten winst, de toelaatbare reserves, en kunnen voorwaarden
      worden gesteld indien de waarde in het economische verkeer van de vermogensbestanddelen op het tijdstip dat
      onmiddellijk voorafgaat aan het voortzetten van de onderneming voor rekening van de aandeelhouders lager is dan
      de boekwaarde van deze vermogensbestanddelen. Indien de onderneming door meerdere aandeelhouders wordt voortgezet,
      wordt in de voorwaarden bepaald dat de verliezen, bedoeld in het derde lid, naar rato van het belang van een
      ieder in de belastingplichtige worden toegerekend. Tevens kunnen voorwaarden worden gesteld die betrekking hebben
      op de verdeling van de in het eerste lid bedoelde vermogensbestanddelen over de voortzettende aandeelhouders en
      de voortgang van de vereffening van het vermogen van de belastingplichtige. Tenslotte kunnen voorwaarden worden
      gesteld met betrekking tot de financiering van de onderneming bij aanvang van het voortzetten door de aandeelhouder
      indien de vennootschap voor de overdracht van vermogensbestanddelen waarmee de aandeelhouder de onderneming wil
      voortzetten, een tegenprestatie ontvangt.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14c
  - number: 14c.7
    text: |-
      Het in het eerste lid bedoelde verzoek wordt voor de ontbinding van belastingplichtige gedaan bij de inspecteur
      belast met de aanslagregeling van de belastingplichtige. De inspecteur beslist op het verzoek bij voor bezwaar
      vatbare beschikking waarin de in het eerste lid bedoelde voorwaarden zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14c
  - number: 14c.8
    text: |-
      Voor de toepassing van dit artikel wordt met een naamloze vennootschap of besloten vennootschap met beperkte
      aansprakelijkheid gelijkgesteld een rechtspersoon met een in aandelen verdeeld kapitaal die:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14c
  - number: 14c.8.a
    text: |-
      is opgericht naar het op de BES eilanden geldende recht dan wel het recht van Aruba, Curaçao, Sint Maarten, een
      lidstaat van de Europese Unie of een staat in de relatie waarmee een met Nederland gesloten verdrag ter voorkoming
      van dubbele belasting van toepassing is waarin een bepaling is opgenomen die discriminatie naar nationaliteit
      verbiedt voor rechtspersonen die overigens in dezelfde omstandigheden verkeren als een naar Nederlands recht
      opgerichte naamloze vennootschap of besloten vennootschap met beperkte aansprakelijkheid, en
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14c
  - number: 14c.8.b
    text: |-
      naar aard en inrichting vergelijkbaar is met de naamloze vennootschap of besloten vennootschap met beperkte
      aansprakelijkheid.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel14c
  - number: '15.1'
    text: |-
      Ingeval een belastingplichtige (moedermaatschappij) de juridische en economische eigendom bezit van ten minste 95
      percent van de aandelen in het nominaal gestorte kapitaal van een andere belastingplichtige (dochtermaatschappij)
      en dit bezit ten minste 95% van de statutaire stemrechten in de dochtermaatschappij vertegenwoordigt en in alle
      gevallen recht geeft op ten minste 95% van de winst en ten minste 95% van het vermogen van de dochtermaatschappij,
      wordt op verzoek van beide belastingplichtigen de belasting van hen geheven alsof er één belastingplichtige is, in
      die zin dat de werkzaamheden en het vermogen van de dochtermaatschappij deel uitmaken van de werkzaamheden en het
      vermogen van de moedermaatschappij. De belasting wordt geheven bij de moedermaatschappij. De belastingplichtigen
      tezamen worden in dat geval aangemerkt als fiscale eenheid. Van een fiscale eenheid kan meer dan één
      dochtermaatschappij deel uitmaken.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15
  - number: '15.2'
    text: |-
      Onder een bezit als bedoeld in het eerste lid wordt mede verstaan een middellijk bezit van aandelen, mits deze
      onmiddellijk worden gehouden door één of meer belastingplichtigen die van de fiscale eenheid deel uitmaken.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15
  - number: '15.3'
    text: 'Het eerste lid vindt slechts toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15
  - number: 15.3.a
    text: |-
      de tijdvakken waarover de belasting wordt geheven voor beide belastingplichtigen samenvallen, met dien verstande
      dat een gedeelte van een boekjaar dat ingevolge [artikel 7, vierde lid][ref1], als afzonderlijk jaar wordt
      aangemerkt voor de toepassing van dit onderdeel niet als afzonderlijk tijdvak wordt aangemerkt;


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel7
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '7'
        hoofdstuk: II
        afdeling: '2.1'
  - number: 15.3.b
    text: |-
      voor het bepalen van de winst bij beide belastingplichtigen dezelfde bepalingen van toepassing zijn of is voldaan
      aan de krachtens het vierde lid, eerste volzin, gegeven regels;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15
  - number: 15.3.c
    text: |-
      beide belastingplichtigen in Nederland zijn gevestigd en ingeval op een belastingplichtige de
      [Belastingregeling voor het Koninkrijk][ref1], de Belastingregeling voor het land Nederland dan wel een verdrag
      ter voorkoming van dubbele belasting van toepassing is, die belastingplichtige tevens volgens die regeling
      onderscheidenlijk dat verdrag geacht wordt in Nederland te zijn gevestigd of is voldaan aan de in en krachtens het
      vierde lid, tweede volzin, gestelde voorwaarden;


      [ref1]: https://wetten.overheid.nl/BWBR0002464
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002464
  - number: 15.3.d
    text: |-
      de moedermaatschappij een naamloze vennootschap, een besloten vennootschap met beperkte aansprakelijkheid,
      een coöperatie, een onderlinge waarborgmaatschappij of een belastingplichtige als bedoeld in
      [artikel 2, eerste lid, onderdeel d][ref1], is, dan wel een lichaam dat is opgericht naar het op de BES eilanden
      geldende recht dan wel het recht van Aruba, Curaçao, Sint Maarten, een lidstaat van de Europese Unie of een staat
      in de relatie waarmee een met Nederland gesloten verdrag ter voorkoming van dubbele belasting van toepassing is
      waarin een bepaling is opgenomen die discriminatie naar nationaliteit verbiedt voor lichamen die overigens in
      dezelfde omstandigheden verkeren als naar Nederlands recht opgerichte lichamen, welk lichaam voorts naar aard en
      inrichting vergelijkbaar is met de hiervoor genoemde naar Nederlands recht opgerichte lichamen;


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel2
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '2'
        hoofdstuk: I
  - number: 15.3.e
    text: |-
      de dochtermaatschappij een naamloze vennootschap of een besloten vennootschap met beperkte aansprakelijkheid
      is, dan wel een daarmee naar aard en inrichting vergelijkbaar lichaam dat is opgericht naar het recht van een in
      onderdeel d bedoeld land, bedoeld heffingsgebied binnen het Rijk of bedoelde staat;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15
  - number: 15.3.f
    text: de moedermaatschappij de aandelen in de dochtermaatschappij niet, middellijk of onmiddellijk, als voorraad houdt.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15
  - number: '15.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gegeven voor de beoordeling of een naar
      buitenlands recht opgericht lichaam naar aard en inrichting vergelijkbaar is met een naar Nederlands recht
      opgericht lichaam als bedoeld in het derde lid, onderdelen d en e. Tevens kunnen bij algemene maatregel van
      bestuur regels worden gegeven volgens welke belastingplichtigen bij wie voor het bepalen van de winst niet dezelfde
      bepalingen van toepassing zijn tezamen een fiscale eenheid kunnen vormen. Voorts kan een belastingplichtige die
      op grond van de nationale wet of op grond van de Belastingregeling voor het Koninkrijk dan wel een verdrag ter
      voorkoming van dubbele belasting niet in Nederland is gevestigd maar wel een onderneming drijft met behulp van
      een in Nederland aanwezige vaste inrichting, onder bij algemene maatregel van bestuur te stellen voorwaarden, deel
      uitmaken van een fiscale eenheid voorzover het heffingsrecht over de uit die onderneming genoten winst ingevolge
      de Belastingregeling voor het Koninkrijk, de Belastingregeling voor het land Nederland dan wel een verdrag ter
      voorkoming van dubbele belasting aan Nederland is toegewezen indien:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15
  - number: 15.4.a
    text: |-
      de plaats van de werkelijke leiding van deze belastingplichtige is gelegen op de BES eilanden dan wel in Aruba,
      Curaçao, Sint Maarten, een lidstaat van de Europese Unie of een staat in de relatie waarmee een met Nederland
      gesloten verdrag ter voorkoming van dubbele belasting van toepassing is waarin een bepaling is opgenomen die
      discriminatie van vaste inrichtingen verbiedt;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15
  - number: 15.4.b
    text: |-
      de belastingplichtige, bedoeld in onderdeel a, een naamloze vennootschap of een besloten vennootschap met beperkte
      aansprakelijkheid, dan wel een daarmee naar aard en inrichting vergelijkbaar lichaam is; en
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15
  - number: 15.4.c
    text: |-
      in het geval de belastingplichtige, bedoeld in onderdeel a, als moedermaatschappij deel uitmaakt van de fiscale
      eenheid – het aandelenbezit, bedoeld in het eerste lid, in de dochtermaatschappij behoort tot het vermogen van de
      in Nederland aanwezige vaste inrichting van deze moedermaatschappij.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15
  - number: '15.5'
    text: |-
      De fiscale eenheid komt tot stand op een door de belastingplichtigen in het verzoek, bedoeld in het eerste lid, aan
      te geven tijdstip, doch niet eerder dan drie maanden voor het tijdstip waarop het verzoek is gedaan.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15
  - number: '15.6'
    text: 'De fiscale eenheid eindigt:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15
  - number: 15.6.a
    text: indien niet langer aan de bij of krachtens dit artikel gestelde vereisten wordt voldaan;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15
  - number: 15.6.b
    text: |-
      indien de belastingplichtige, bedoeld in het vierde lid, derde volzin, de plaats van werkelijke leiding verplaatst
      naar Nederland;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15
  - number: 15.6.c
    text: |-
      indien de belastingplichtige de plaats van werkelijke leiding verplaatst naar het buitenland met achterlating van
      een vaste inrichting in Nederland;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15
  - number: 15.6.d
    text: |-
      op gezamenlijk verzoek van de moedermaatschappij en de dochtermaatschappij met ingang van het in het verzoek
      genoemde tijdstip doch niet eerder dan met ingang van de datum van indiening van het verzoek; met dien verstande
      dat indien de fiscale eenheid ten aanzien van één of meer dochtermaatschappijen wordt beëindigd, de fiscale eenheid
      daardoor niet eveneens ten aanzien van de andere belastingplichtigen wordt beëindigd.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15
  - number: '15.7'
    text: |-
      Indien een dochtermaatschappij in de loop van haar boekjaar deel gaat uitmaken van een fiscale eenheid en deze
      eenheid ten aanzien van die dochtermaatschappij nog in hetzelfde boekjaar eindigt, wordt voor de tussenliggende
      periode ten aanzien van die dochtermaatschappij geacht geen fiscale eenheid tot stand te zijn gekomen. De vorige
      volzin is van overeenkomstige toepassing op een bestaande fiscale eenheid die in de loop van haar boekjaar
      deel gaat uitmaken van een andere fiscale eenheid en nog in hetzelfde boekjaar uit laatstgenoemde eenheid wordt
      ontvoegd.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15
  - number: '15.8'
    text: |-
      Het verzoek bedoeld in het eerste lid en zesde lid, onderdeel d, wordt gedaan bij de inspecteur belast met
      de aanslagregeling van de moedermaatschappij. De inspecteur beslist op het verzoek bij voor bezwaar vatbare
      beschikking.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15
  - number: '15.9'
    text: |-
      Ingeval de belastingplichtige bij het doen van het in het eerste lid bedoelde verzoek reeds als moedermaatschappij
      deel uitmaakt van een fiscale eenheid wordt dit verzoek geacht mede te zijn gedaan namens de andere
      belastingplichtigen die van die fiscale eenheid deel uitmaken.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15
  - number: '15.10'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gegeven tot verzekering van de
      heffing en invordering van de belasting met het oog op de omstandigheid dat de in het eerste lid bedoelde
      belastingplichtigen voor de toepassing van deze wet een fiscale eenheid vormen. Onder die regels worden mede
      begrepen regels voor:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15
  - number: 15.10.a
    text: de omstandigheid dat de moedermaatschappij niet alle aandelen in de dochtermaatschappij bezit;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15
  - number: 15.10.b
    text: |-
      de voortzetting van een fiscale eenheid ten aanzien van een belastingplichtige ingeval sprake is van een
      omstandigheid als bedoeld in het zesde lid, onderdeel b of onderdeel c;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15
  - number: 15.10.c
    text: |-
      de toepassing van de [artikelen 13d, achtste lid][ref1], en [15ab tot en met 15af][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel13d
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel15ab
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 13d
        hoofdstuk: II
        afdeling: '2.5'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 15ab
        hoofdstuk: II
        afdeling: '2.9'
  - number: 15.10.d
    text: de berekening van de verminderingen ter voorkoming van dubbele belasting ter zake van buitenlandse resultaten;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15
  - number: 15.10.e
    text: de toepassing van de objectvrijstelling voor buitenlandse ondernemingswinsten;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15
  - number: 15.10.f
    text: de toepassing van de innovatiebox;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15
  - number: 15.10.g
    text: de toepassing van de deelnemingsverrekening;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15
  - number: 15.10.h
    text: de toepassing van de verrekening bij buitenlandse ondernemingswinsten.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15
  - number: '15.11'
    text: |-
      Een krachtens het vierde lid, eerste volzin, en tiende lid vastgestelde algemene maatregel van bestuur treedt
      niet eerder in werking dan acht weken na de datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van de
      plaatsing wordt onverwijld mededeling gedaan aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15
  - number: 15aa.1
    text: |-
      Voor de toepassing van de [artikelen 15ab tot en met 15aj][ref1] wordt verstaan onder:


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15ab
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15aa
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 15ab
        hoofdstuk: II
        afdeling: '2.9'
  - number: 15aa.1.a
    text: 'maatschappij: een belastingplichtige die deel uitmaakt van een fiscale eenheid;'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15aa
  - number: 15aa.1.b
    text: 'het voegingstijdstip: het tijdstip met ingang waarvan een belastingplichtige deel uitmaakt van een fiscale eenheid;'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15aa
  - number: 15aa.1.c
    text: |-
      het ontvoegingstijdstip: het tijdstip waarop een fiscale eenheid ten aanzien van een belastingplichtige anders dan
      door ontbinding en vereffening van een dochtermaatschappij wordt beëindigd.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15aa
  - number: 15aa.2
    text: |-
      Indien zonder toepassing van [artikel 3.54 van de Wet inkomstenbelasting 2001][ref1] bij de vervreemding van een
      goed de boekwinst die daarbij tot uitdrukking komt ingevolge goed koopmansgebruik is doorgeschoven naar een ander
      goed, wordt voor de toepassing van de [artikelen 15ab tot en met 15aj][ref2] het reserveren van deze winst, alsmede
      de afboeking daarvan op de aanschaffingskosten of voortbrengingskosten van het andere goed, geacht te hebben
      plaatsgevonden met toepassing van artikel 3.54 van de Wet inkomstenbelasting 2001.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel15ab
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15aa
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 15ab
        hoofdstuk: II
        afdeling: '2.9'
  - number: 15ab.1
    text: |-
      Op het tijdstip onmiddellijk voorafgaand aan het tijdstip van voeging van een dochtermaatschappij stelt
      de moedermaatschappij haar belang, dan wel indien gelijktijdig ook andere dochtermaatschappijen worden
      gevoegd, stellen de moedermaatschappij en de gelijktijdig gevoegde dochtermaatschappijen hun belang in die
      dochtermaatschappij te boek op de waarde in het economische verkeer.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ab
  - number: 15ab.2
    text: |-
      Indien op het tijdstip van voeging van een maatschappij tot het vermogen van die maatschappij een deelneming
      behoort waarvan de onderneming geheel of nagenoeg geheel is gestaakt, dan wel daartoe is besloten, of indien op het
      tijdstip van voeging van een maatschappij tot het vermogen van die maatschappij een onderneming behoort waarop het
      bepaalde in [artikel 13e][ref1] van toepassing is, komt, onverminderd het bepaalde in de [artikelen 13d][ref2] en
      [13e][ref3], een liquidatieverlies uit hoofde van de deelneming slechts in aftrek voorzover de winst van de fiscale
      eenheid, zonder rekening te houden met dat liquidatieverlies, aan die maatschappij is toe te rekenen.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel13e
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel13d
      [ref3]: https://wetten.overheid.nl/BWBR0002672#Artikel13e
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ab
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 13e
        hoofdstuk: II
        afdeling: '2.5'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 13d
        hoofdstuk: II
        afdeling: '2.5'
      - id: ref3
        bwb_id: BWBR0002672
        artikel: 13e
        hoofdstuk: II
        afdeling: '2.5'
  - number: 15ab.3
    text: |-
      Voorzover een liquidatieverlies in een jaar ingevolge het tweede lid niet in aanmerking is genomen, wordt het
      achtereenvolgens in mindering gebracht op en ten hoogste tot de positieve belastbare bedragen van het daaraan
      voorafgaande jaar en de negen volgende jaren, van:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ab
  - number: 15ab.3.a
    text: |-
      de desbetreffende maatschappij, in de jaren waarin deze geen deel uitmaakte of uitmaakt van de fiscale eenheid;
      onderscheidenlijk
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ab
  - number: 15ab.3.b
    text: van de fiscale eenheid, voorzover de winst van de fiscale eenheid aan die maatschappij is toe te rekenen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ab
  - number: 15ab.4
    text: |-
      Het in mindering brengen van liquidatieverliezen vindt plaats in de volgorde waarin deze zijn ontstaan en de
      positieve belastbare bedragen zijn ontstaan.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ab
  - number: 15ab.5
    text: |-
      Voorzover een liquidatieverlies ingevolge het derde lid in het voorafgaande jaar als bedoeld in dat lid op het
      belastbare bedrag in mindering wordt gebracht, zal de aanslag over dat jaar worden herzien. Over het bedrag van de
      herziening wordt geen belastingrente vergoed.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ab
  - number: 15ab.6
    text: |-
      De tot het vermogen van een maatschappij behorende schuldvorderingen op een andere maatschappij worden op het
      tijdstip onmiddellijk voorafgaand aan het tijdstip waarop de fiscale eenheid ten aanzien van deze maatschappijen
      tot stand komt door die maatschappij gesteld op de bedrijfswaarde of, indien dat lager is, de nominale waarde.
      Tevens worden op het eerstgenoemde tijdstip de schulden van de andere maatschappij waarop de schuldvorderingen
      betrekking hebben, gesteld op dezelfde waarde als waarop die schuldvorderingen ingevolge de vorige volzin worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ab
  - number: 15ab.7
    text: |-
      Het zesde lid is niet van toepassing voor zover met betrekking tot de schuldvordering reeds een bedrag op de voet
      van de [artikelen 13b][ref1] of [13ba][ref2] in aanmerking is genomen bij de maatschappij die de schuldvordering
      houdt of bij een met hem verbonden lichaam als bedoeld in [artikel 10a, vierde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel13b
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel13ba
      [ref3]: https://wetten.overheid.nl/BWBR0002672#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ab
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 13b
        hoofdstuk: II
        afdeling: '2.5'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 13ba
        hoofdstuk: II
        afdeling: '2.5'
      - id: ref3
        bwb_id: BWBR0002672
        artikel: 10a
        hoofdstuk: II
        afdeling: '2.2'
  - number: 15ac.1
    text: |-
      Bij het bepalen van de winst van een fiscale eenheid worden voor de toepassing van [artikel 11][ref1] tantièmes
      en salarissen, door een dochtermaatschappij toegekend aan anderen dan de moedermaatschappij, geacht als zodanig te
      zijn toegekend door de moedermaatschappij.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel11
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ac
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '11'
        hoofdstuk: II
        afdeling: '2.2'
  - number: 15ac.2
    text: |-
      [Artikel 3.13, eerste lid, onderdeel a, van de Wet inkomstenbelasting 2001][ref1] vindt bij het bepalen van
      de winst van een fiscale eenheid geen toepassing, behoudens voorzover aannemelijk wordt gemaakt dat de in dat
      onderdeel bedoelde voordelen niet tot de winst van de schuldenaar zouden hebben behoord indien deze geen deel zou
      hebben uitgemaakt van de fiscale eenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ac
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 15ac.3
    text: |-
      Ten aanzien van een coöperatie die als moedermaatschappij van een fiscale eenheid deel uitmaakt vindt
      [artikel 9, eerste lid, onderdeel g][ref1], geen toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel9
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ac
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '9'
        hoofdstuk: II
        afdeling: '2.2'
  - number: 15ac.4
    text: |-
      De vermindering van belasting ingevolge voorschriften ter voorkoming van dubbele belasting wordt berekend alsof de
      maatschappijen van de fiscale eenheid één belastingplichtige zijn.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ac
  - number: 15ac.5
    text: |-
      Indien tot de winst van de fiscale eenheid winst uit een buitenlandse onderneming of uit een in het buitenland
      gelegen onroerende zaak behoort en de laatstgenoemde winst voor de toepassing van de objectvrijstelling voor
      buitenlandse ondernemingswinsten tot een hoger bedrag in aanmerking zou worden genomen dan het gezamenlijke
      bedrag dat in aanmerking zou zijn genomen bij afwezigheid van de fiscale eenheid, als gevolg van het feit dat in
      het laatste geval financieringskosten toerekenbaar zijn aan de buitenlandse onderneming of de in het buitenland
      gelegen onroerende zaak die bij de fiscale eenheid niet tot uitdrukking komen, wordt de objectvrijstelling voor
      buitenlandse ondernemingswinsten berekend alsof deze financieringskosten wel bij de fiscale eenheid tot uitdrukking
      komen, met dien verstande dat voor de toepassing van de objectvrijstelling voor buitenlandse ondernemingswinsten
      ten minste in aanmerking wordt genomen het hiervoor bedoelde gezamenlijke bedrag. Indien bij afwezigheid van de
      fiscale eenheid [artikel 10, eerste lid, onderdeel d][ref1], op de financieringskosten of een deel daarvan van
      toepassing zou zijn, wordt de eerste volzin toegepast alsof artikel 10, eerste lid, onderdeel d, daarop niet van
      toepassing zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ac
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '10'
        hoofdstuk: II
        afdeling: '2.2'
  - number: 15ac.6
    text: |-
      Het vijfde lid vindt geen toepassing voorzover de belastingplichtige aannemelijk maakt dat de in dat lid bedoelde
      financieringskosten in het andere land bij de berekening van de belastbare grondslag niet in aftrek worden
      toegelaten.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ac
  - number: 15ac.7
    text: |-
      Ingeval een dochtermaatschappij geheel of ten dele is verkregen tegen een verplichting als bedoeld in
      [artikel 13, zesde lid, eerste volzin][ref1], blijven de waardeveranderingen van die verplichting bij het bepalen
      van de winst van de fiscale eenheid buiten aanmerking. De eerste volzin is van overeenkomstige toepassing bij
      aanpassingen van de prijs waartegen een dochtermaatschappij is verkregen als bedoeld in artikel 13, zesde lid,
      tweede volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel13
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ac
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '13'
        hoofdstuk: II
        afdeling: '2.5'
  - number: 15ad.1
    text: |-
      Renten en kosten ter zake van schulden die voortvloeien uit een overeenkomst van geldlening of een daarmee
      vergelijkbare overeenkomst, waarbij rente in aanmerking wordt genomen bij het bepalen van de winst en die rechtens
      dan wel in feite direct of indirect verband houden met de verwerving of uitbreiding door een maatschappij van een
      belang in een of meer andere maatschappijen (overnameschulden), komen bij het bepalen van de in een jaar genoten
      winst slechts in aftrek tot een bedrag gelijk aan de winst van de fiscale eenheid van het jaar berekend zonder
      toepassing van dit artikel maar met inachtneming van het zevende lid, verminderd met het deel van die winst dat
      toerekenbaar is aan die andere maatschappijen en vermeerderd met de hiervoor bedoelde renten. Ingeval een in de
      eerste volzin bedoelde andere maatschappij tijdens het bestaan van de fiscale eenheid is geliquideerd, vindt dit
      artikel toepassing alsof die liquidatie niet heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ad
  - number: 15ad.2
    text: |-
      De aftrekbeperking van het eerste lid is slechts van toepassing indien het bedrag aan renten dat ingevolge dat
      lid niet in aftrek zou komen meer bedraagt dan € 1 000 000 en er bij de fiscale eenheid sprake is van een teveel
      aan overnamerenten.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ad
  - number: 15ad.3
    text: 'De aftrekbeperking van het eerste lid is slechts van toepassing tot het laagste van de volgende twee bedragen:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ad
  - number: 15ad.3.a
    text: het bedrag aan renten dat ingevolge het eerste lid niet in aftrek zou komen, verminderd met € 1 000 000;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ad
  - number: 15ad.3.b
    text: het volgens het vierde lid berekende bedrag van het teveel aan overnamerenten.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ad
  - number: 15ad.4
    text: |-
      Het bedrag van het teveel aan overnamerenten, bedoeld in het derde lid, onderdeel b, wordt gesteld op het
      gezamenlijke bedrag aan in het eerste lid bedoelde renten die in het jaar zijn verschuldigd over het bovenmatige
      deel van de overnameschulden met betrekking tot de in het jaar gevoegde maatschappijen en over het bovenmatige deel
      van de overnameschulden met betrekking tot de in elk van de voorgaande jaren gevoegde maatschappijen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ad
  - number: 15ad.5
    text: |-
      Van een bovenmatig deel aan overnameschulden met betrekking tot de in een bepaald jaar gevoegde maatschappijen
      is sprake voor zover het gezamenlijke bedrag van de overnameschulden die verband houden met de verwerving of
      uitbreiding van een belang in een of meer in datzelfde jaar gevoegde maatschappijen bij het einde van het jaar meer
      bedraagt dan een in het zesde lid aangegeven percentage van de verkrijgingsprijs van die belangen. Daarbij worden
      tijdelijke mutaties van die schulden rond het einde van het jaar genegeerd voor zover deze plaatsvinden met het oog
      op de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ad
  - number: 15ad.6
    text: |-
      Het in het vijfde lid bedoelde percentage van de verkrijgingsprijs van een belang bedraagt in het jaar van voeging
      60% en neemt vervolgens met 5%-punt per jaar af tot 25%.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ad
  - number: 15ad.7
    text: |-
      Dit artikel is slechts van toepassing op bestanddelen van de winst die geen deel uitmaken van winst uit een andere
      staat als bedoeld in [artikel 15e][ref1] waarop de objectvrijstelling voor buitenlandse ondernemingswinsten van
      toepassing is en op bestanddelen van het vermogen welke niet dienstbaar zijn aan het behalen van dergelijke winst
      uit een andere staat.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15e
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ad
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 15e
        hoofdstuk: II
        afdeling: 2.10a
  - number: 15ad.8
    text: |-
      Het bedrag aan renten dat ingevolge dit artikel niet in aftrek komt, wordt overgebracht naar het volgende jaar en
      wordt in dat jaar onderworpen aan de aftrekbeperking van dit artikel, met dien verstande dat het tweede tot en met
      zesde lid daarbij buiten toepassing blijven.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ad
  - number: 15ad.9
    text: |-
      De ingevolge de voorgaande leden berekende aftrekbeperking blijft buiten aanmerking voor zover deze volgens bij
      of krachtens algemene maatregel van bestuur te stellen regels samenvalt met de bij de fiscale eenheid ingevolge
      [artikel 13l][ref1] berekende aftrekbeperking van bovenmatige deelnemingsrente.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel13l
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ad
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 13l
        hoofdstuk: II
        afdeling: '2.5'
  - number: 15ad.10
    text: |-
      Voor de toepassing van dit artikel worden onder renten en kosten ter zake van schulden mede begrepen kosten en
      resultaten ter zake van rechtshandelingen die strekken tot het afdekken van renterisico’s op geldleningen of van
      valutarisico’s op de rente ter zake van geldleningen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ad
  - number: 15ae.1
    text: |-
      Voor de toepassing van [artikel 20, tweede lid][ref1], vindt:


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel20
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ae
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '20'
        hoofdstuk: IV
  - number: 15ae.1.a
    text: |-
      de verrekening van door een maatschappij voor haar voegingstijdstip geleden verliezen (voorvoegingsverliezen) met
      de belastbare winst van de fiscale eenheid plaats voorzover deze winst aan die maatschappij is toe te rekenen;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ae
  - number: 15ae.1.b
    text: |-
      de verrekening van een verlies van de fiscale eenheid met de voor het voegingstijdstip van een maatschappij genoten
      belastbare winst van die maatschappij plaats voorzover het verlies aan die maatschappij is toe te rekenen;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ae
  - number: 15ae.1.c
    text: |-
      indien een bestaande fiscale eenheid wordt uitgebreid of indien een bestaande fiscale eenheid wordt opgenomen in
      een nieuwe fiscale eenheid – de verrekening van een voor dat voegingstijdstip geleden verlies van die bestaande
      fiscale eenheid met de belastbare winst van de fiscale eenheid plaats voorzover deze winst is toe te rekenen aan de
      maatschappijen die direct voorafgaande aan dat voegingstijdstip tot de bestaande fiscale eenheid behoorden;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ae
  - number: 15ae.1.d
    text: |-
      indien een bestaande fiscale eenheid wordt uitgebreid of indien een bestaande fiscale eenheid wordt opgenomen in
      een nieuwe fiscale eenheid – de verrekening van een na dat voegingstijdstip geleden verlies van de fiscale eenheid
      met de belastbare winst van de bestaande fiscale eenheid plaats voorzover dit verlies is toe te rekenen aan de
      maatschappijen die direct voorafgaande aan dat voegingstijdstip tot de bestaande fiscale eenheid behoorden.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ae
  - number: 15ae.2
    text: |-
      Het eerste lid, onderdeel a, vindt geen toepassing voorzover de winst van de fiscale eenheid betrekking heeft op
      vermogensbestanddelen die door een maatschappij zijn verkregen van een andere maatschappij die ten tijde van die
      verkrijging van de fiscale eenheid deel uitmaakte en die winst op de voet van [artikel 15ah, tweede lid][ref1],
      aan die andere maatschappij zou zijn toegerekend indien de fiscale eenheid niet ten aanzien van die
      andere maatschappij zou zijn beëindigd, behoudens indien met betrekking tot die vermogensbestanddelen
      [artikel 15ai, eerste of tweede lid][ref2], toepassing heeft gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15ah
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel15ai
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ae
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 15ah
        hoofdstuk: II
        afdeling: '2.9'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 15ai
        hoofdstuk: II
        afdeling: '2.9'
  - number: 15ae.3
    text: |-
      Met betrekking tot de in het eerste lid bedoelde verrekening wordt in de [artikelen 20, vierde en zesde lid][ref1],
      en [20a][ref2] voor «de belastingplichtige» gelezen: de maatschappij, onderscheidenlijk de bestaande fiscale
      eenheid die wordt uitgebreid, of de bestaande fiscale eenheid die wordt opgenomen in een nieuwe fiscale eenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel20a
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ae
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '20'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 20a
        hoofdstuk: IV
  - number: 15ae.4
    text: |-
      Bij de voorwaartse verrekening van verliezen van een fiscale eenheid of voorvoegingsverliezen van de
      moedermaatschappij worden voorvoegingsverliezen van dochtermaatschappijen buiten beschouwing gelaten bij de vraag
      welk jaar voor de toepassing van [artikel 20a, eerste lid][ref1], als oudste jaar kwalificeert.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel20a
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ae
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 20a
        hoofdstuk: IV
  - number: 15ae.5
    text: |-
      Voor de toepassing van [artikel 20a, vierde lid][ref1], worden de werkzaamheden die na het begin van het
      oudste jaar, bedoeld in het eerste lid van dat artikel, binnen een fiscale eenheid van de ene maatschappij zijn
      overgedragen aan een andere maatschappij, gedurende het bestaan van de fiscale eenheid tussen die maatschappijen
      nog in aanmerking genomen bij de overdragende maatschappij.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel20a
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ae
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 20a
        hoofdstuk: IV
  - number: 15af.1
    text: |-
      Vanaf het tijdstip van ontvoeging van een dochtermaatschappij worden voor de toepassing van
      [artikel 20, tweede lid][ref1], de volgende verliezen verrekend met de door die dochtermaatschappij na dat tijdstip
      genoten belastbare winst:


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel20
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15af
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '20'
        hoofdstuk: IV
  - number: 15af.1.a
    text: de voorvoegingsverliezen van die maatschappij; en
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15af
  - number: 15af.1.b
    text: de verliezen van de fiscale eenheid die aan die dochtermaatschappij zijn toe te rekenen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15af
  - number: 15af.2
    text: |-
      Het eerste lid, onderdeel b, vindt slechts toepassing indien die maatschappij en de moedermaatschappij daarom
      verzoeken en voorzover aannemelijk wordt gemaakt dat deze verliezen aan die dochtermaatschappij zijn toe te
      rekenen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15af
  - number: 15af.3
    text: |-
      Het in het tweede lid bedoelde verzoek wordt gedaan bij de aangifte van de moedermaatschappij over het laatste
      jaar waarin de dochtermaatschappij nog deel uitmaakt van de fiscale eenheid. De inspecteur stelt het aan de
      dochtermaatschappij toe te rekenen verlies van de fiscale eenheid vast bij voor bezwaar vatbare beschikking.
      [Artikel 20b, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel20b
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15af
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 20b
        hoofdstuk: IV
  - number: 15af.4
    text: |-
      In afwijking in zoverre van het eerste lid vindt geen verrekening plaats met de belastbare winst van de ontvoegde
      dochtermaatschappij voorzover die winst betrekking heeft op vermogensbestanddelen die door die maatschappij
      zijn verkregen van een andere maatschappij waarmee het ten tijde van die verkrijging van de fiscale eenheid deel
      uitmaakte en die winst op de voet van [artikel 15ah, tweede lid][ref1], niet aan de ontvoegde dochtermaatschappij
      zou zijn toegerekend indien de fiscale eenheid niet ten aanzien van die maatschappij zou zijn beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15ah
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15af
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 15ah
        hoofdstuk: II
        afdeling: '2.9'
  - number: 15af.5
    text: |-
      Het vierde lid vindt geen toepassing indien met betrekking tot de daar bedoelde vermogensbestanddelen
      [artikel 15ai, eerste of tweede lid][ref1], toepassing heeft gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15ai
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15af
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 15ai
        hoofdstuk: II
        afdeling: '2.9'
  - number: 15af.6
    text: |-
      Vanaf het in het eerste lid bedoelde ontvoegingstijdstip vindt met de winst van de fiscale eenheid
      onderscheidenlijk de moedermaatschappij geen verrekening plaats van de verliezen die ingevolge dat lid worden
      verrekend met de belastbare winst van de ontvoegde dochtermaatschappij.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15af
  - number: 15af.7
    text: |-
      Ten aanzien van een ontvoegde dochtermaatschappij die op de voet van het eerste lid, onderdeel b, verliezen van
      de fiscale eenheid mag verrekenen, wordt in [artikelen 20, vierde en zesde lid][ref1], en [20a][ref2] voor «de
      belastingplichtige» gelezen: de maatschappij.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel20a
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15af
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '20'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 20a
        hoofdstuk: IV
  - number: 15ag.1
    text: |-
      Vanaf het ontvoegingstijdstip van een moedermaatschappij worden voor de toepassing van
      [artikel 20, tweede lid][ref1], voorvoegingsverliezen van die moedermaatschappij niet verrekend met de door haar na
      dat tijdstip genoten belastbare winst voorzover die winst betrekking heeft op vermogensbestanddelen die door haar
      tijdens het bestaan van de fiscale eenheid zijn verkregen van een dochtermaatschappij en die winst op de voet van
      [artikel 15ah, tweede lid][ref2], niet aan de moedermaatschappij zou zijn toegerekend indien de fiscale eenheid met
      die dochtermaatschappij niet zou zijn beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel15ah
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ag
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '20'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 15ah
        hoofdstuk: II
        afdeling: '2.9'
  - number: 15ag.2
    text: |-
      Het eerste lid vindt geen toepassing indien met betrekking tot de vermogensbestanddelen
      [artikel 15ai, eerste of tweede lid][ref1], toepassing heeft gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15ai
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ag
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 15ai
        hoofdstuk: II
        afdeling: '2.9'
  - number: 15ah.1
    text: |-
      Voor de toepassing van de [artikelen 15ab, tweede lid][ref1], [15ad][ref2] en [15ae][ref3] wordt onder de aan een
      maatschappij toe te rekenen winst van de fiscale eenheid verstaan de winst van die maatschappij berekend alsof zij
      geen deel uitmaakt van de fiscale eenheid, voorzover deze winst bij de fiscale eenheid tot uitdrukking komt en met
      inachtneming van het tweede en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15ab
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel15ad
      [ref3]: https://wetten.overheid.nl/BWBR0002672#Artikel15ae
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ah
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 15ab
        hoofdstuk: II
        afdeling: '2.9'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 15ad
        hoofdstuk: II
        afdeling: '2.9'
      - id: ref3
        bwb_id: BWBR0002672
        artikel: 15ae
        hoofdstuk: II
        afdeling: '2.9'
  - number: 15ah.2
    text: |-
      Ingeval in enig jaar door een maatschappij (overnemer) een vermogensbestanddeel is verkregen van een andere
      maatschappij (overdrager) die tot de fiscale eenheid behoort:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ah
  - number: 15ah.2.a
    text: |-
      wordt bij het bepalen van de aan de overnemer toe te rekenen winst, de afschrijving op het overgedragen
      vermogensbestanddeel berekend op basis van de waarde in het economische verkeer ten tijde van de overdracht;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ah
  - number: 15ah.2.b
    text: |-
      wordt bij het bepalen van de aan de overdrager toe te rekenen winst, het verschil tussen het bedrag van
      de afschrijving dat met betrekking tot het overgedragen vermogensbestanddeel ingevolge onderdeel a bij de
      overnemer in aanmerking wordt genomen en het bedrag van de afschrijving dat met betrekking tot dat overgedragen
      vermogensbestanddeel bij de fiscale eenheid tot uitdrukking komt, gerekend tot de winst van de overdrager;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ah
  - number: 15ah.2.c
    text: |-
      blijven bij het bepalen van de aan de overnemer toe te rekenen winst, buiten aanmerking de met betrekking tot het
      overgedragen vermogensbestanddeel gerealiseerde stille reserves voor zover deze ten tijde van de verkrijging reeds
      aanwezig waren, en niet reeds op grond van onderdeel b aan de overdrager zijn toegerekend;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ah
  - number: 15ah.2.d
    text: |-
      wordt het bedrag dat ingevolge onderdeel c buiten aanmerking blijft bij de bepaling van de aan de overnemer toe te
      rekenen winst, toegerekend aan de overdrager.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ah
  - number: 15ah.3
    text: |-
      Voorts worden bij het bepalen van de aan een maatschappij toe te rekenen winst, positieve onderscheidenlijk
      negatieve voordelen ter zake van rechtsverhoudingen tussen maatschappijen die van de fiscale eenheid deel uitmaken
      en die niet in de winst van de fiscale eenheid tot uitdrukking komen, in aanmerking genomen voorzover bij de
      berekening van de aan de ene maatschappij toe te rekenen winst positieve voordelen tot uitdrukking komen en ten
      belope van hetzelfde bedrag bij de berekening van de aan de andere maatschappij toe te rekenen winst negatieve
      voordelen staan.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ah
  - number: 15ah.4
    text: |-
      Indien aan het voornemen tot herinvestering bedoeld in [artikel 3.54 van de Wet inkomstenbelasting 2001][ref1],
      gevolg is gegeven door een andere maatschappij van de fiscale eenheid dan de maatschappij die het bedrijfsmiddel
      heeft vervreemd ter zake waarvan de herinvesteringsreserve is gevormd, wordt het bedrijfsmiddel waarin is
      geherinvesteerd voor de toepassing van het tweede lid geacht te zijn verworven door de maatschappij die het
      bedrijfsmiddel heeft vervreemd en onmiddellijk daarna te zijn overgedragen aan die andere maatschappij.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ah
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 15ai.1
    text: |-
      Indien in enig jaar door een maatschappij (overdrager) een vermogensbestanddeel is overgedragen aan een andere
      maatschappij (overnemer) waarvan de waarde in het economische verkeer op het moment van de overdracht hoger was
      dan de boekwaarde, wordt op het tijdstip onmiddellijk voorafgaand aan het ontvoegingstijdstip van die overdrager
      of overnemer, dat vermogensbestanddeel te boek gesteld op de waarde in het economische verkeer. Indien met
      betrekking tot een in de vorige volzin bedoeld vermogensbestanddeel door de overnemer een reserve is gevormd als
      bedoeld in [artikel 3.54 van de Wet inkomstenbelasting 2001][ref1], wordt deze reserve op het tijdstip onmiddellijk
      voorafgaande aan het in de eerste volzin bedoelde ontvoegingstijdstip opgenomen in de winst van de fiscale eenheid.
      Indien de reserve, bedoeld in de tweede volzin, reeds is afgeboekt op de aanschaffings- of voortbrengingskosten
      van een vervangend bedrijfsmiddel, wordt dat bedrijfsmiddel op het tijdstip onmiddellijk voorafgaand aan het in de
      eerste volzin bedoelde ontvoegingstijdstip te boek gesteld op de waarde in het economische verkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ai
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 15ai.2
    text: |-
      In afwijking van het eerste lid wordt het overgedragen vermogensbestanddeel op het tijdstip onmiddellijk
      voorafgaand aan de ontvoeging te boek gesteld op een bedrag gelijk aan de waarde in het economische verkeer van
      het vermogensbestanddeel ten tijde van de overdracht, verminderd met de afschrijving tussen het tijdstip van de
      overdracht en het ontvoegingstijdstip berekend overeenkomstig [artikel 15ah, tweede lid, onderdeel a][ref1], mits
      de belastingplichtige de hoogte van dit bedrag aannemelijk maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15ah
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ai
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 15ah
        hoofdstuk: II
        afdeling: '2.9'
  - number: 15ai.3
    text: 'Het eerste lid vindt geen toepassing ingeval:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ai
  - number: 15ai.3.a
    text: |-
      de overdracht heeft plaatsgevonden in het kader van een bij de aard en omvang van de overdrager en de overnemer
      passende normale bedrijfsuitoefening;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ai
  - number: 15ai.3.b
    text: |-
      sprake was van een overdracht van een onderneming of een zelfstandig onderdeel van een onderneming, tegen
      uitreiking door de overnemer van eigen aandelen, en na het tijdstip waarop de overdracht heeft plaatsgevonden ten
      minste drie kalenderjaren zijn verstreken; of
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ai
  - number: 15ai.3.c
    text: na het tijdstip waarop de overdracht heeft plaatsgevonden ten minste zes kalenderjaren zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ai
  - number: 15ai.4
    text: |-
      Indien aan het voornemen tot herinvestering als bedoeld in [artikel 3.54 van de Wet inkomstenbelasting 2001][ref1]
      gevolg is gegeven door een andere maatschappij van de fiscale eenheid dan de maatschappij die het bedrijfsmiddel
      heeft vervreemd ter zake waarvan de herinvesteringsreserve is gevormd, wordt het bedrijfsmiddel waarin is
      geherinvesteerd voor de toepassing van het eerste lid geacht te zijn verworven door de maatschappij die het
      bedrijfsmiddel heeft vervreemd en onmiddellijk daarna te zijn overgedragen aan de andere maatschappij.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ai
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 15ai.5
    text: |-
      Voor de toepassing van [artikel 3.54 van de Wet inkomstenbelasting 2001][ref1] mag de bij de fiscale eenheid
      aanwezige herinvesteringsreserve worden afgeboekt op de aanschaffings- of voortbrengingskosten van de eerstvolgende
      herinvestering door de maatschappij die het bedrijfsmiddel heeft vervreemd terzake waarvan de reserve is gevormd,
      in plaats van op die kosten van de eerstvolgende herinvestering door een maatschappij van de fiscale eenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ai
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 15ai.6
    text: |-
      Het eerste en tweede lid vinden geen toepassing met betrekking tot een overgedragen vermogensbestanddeel waarop
      [artikel 15c][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15c
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15ai
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 15c
        hoofdstuk: II
        afdeling: '2.10'
  - number: 15aj.1
    text: |-
      Herinvesteringsreserves als bedoeld in [artikel 3.54 van de Wet inkomstenbelasting 2001][ref1] bedragen op het
      tijdstip onmiddellijk voorafgaand aan het ontvoegingstijdstip van een dochtermaatschappij niet meer dan hetgeen
      deze volgens het genoemde [artikel 3.54][ref2] bij de moedermaatschappij en de ontvoegde dochtermaatschappij
      gezamenlijk zouden hebben belopen als de dochtermaatschappij geen deel zou hebben uitgemaakt van de fiscale
      eenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15aj
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 15aj.2
    text: |-
      De tot het vermogen van een maatschappij behorende schuldvorderingen op een andere maatschappij worden op het
      tijdstip onmiddellijk voorafgaand aan het ontvoegingstijdstip gesteld op de nominale waarde of, indien dat lager
      is, de bedrijfswaarde. Tevens worden op het eerstgenoemde tijdstip de schulden van de andere maatschappij waarop de
      schuldvorderingen betrekking hebben, gesteld op de nominale waarde. Indien de schuldvordering op een lagere waarde
      dan de nominale waarde is gesteld, blijft de toekomstige waarde-aangroei van deze vordering bij de bepaling van de
      winst van de schuldeiser buiten aanmerking, voorzover deze aantoont dat de waardedaling van de vordering beneden
      de nominale waarde heeft plaatsgevonden tijdens de periode dat beide maatschappijen deel uitmaakten van dezelfde
      fiscale eenheid, of reeds eerder is teruggenomen door de werking van de [artikelen 13b][ref1], [13ba][ref2] of
      [15ab, zesde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel13b
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel13ba
      [ref3]: https://wetten.overheid.nl/BWBR0002672#Artikel15ab
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15aj
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 13b
        hoofdstuk: II
        afdeling: '2.5'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 13ba
        hoofdstuk: II
        afdeling: '2.5'
      - id: ref3
        bwb_id: BWBR0002672
        artikel: 15ab
        hoofdstuk: II
        afdeling: '2.9'
  - number: 15aj.3
    text: |-
      Indien een dochtermaatschappij in het zicht van haar liquidatie wordt ontvoegd, worden op het tijdstip onmiddellijk
      voorafgaand aan het ontvoegingstijdstip achtereenvolgens:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15aj
  - number: 15aj.3.a
    text: |-
      de schulden van die dochtermaatschappij gesteld op de bedrijfswaarde als deze waarde lager is dan de nominale
      waarde van de schuld, en
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15aj
  - number: 15aj.3.b
    text: |-
      de aan de dochtermaatschappij toe te rekenen egalisatiereserves als bedoeld in
      [artikel 3.53, eerste lid, onderdeel a, van de Wet inkomstenbelasting 2001][ref1] en herinvesteringsreserves als
      bedoeld in het eerste lid, onderdeel b, van dat artikel aan de winst toegevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15aj
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 15aj.4
    text: |-
      De op het tijdstip onmiddellijk voorafgaand aan het ontvoegingstijdstip bij de fiscale eenheid aanwezige reserves
      als bedoeld in [artikel 3.53, eerste lid, onderdelen a en b, van de Wet inkomstenbelasting 2001][ref1] worden op
      het ontvoegingstijdstip als volgt over de moedermaatschappij en de dochtermaatschappij verdeeld:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15aj
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 15aj.4.a
    text: |-
      een egalisatiereserve wordt toegedeeld aan de verschillende maatschappijen naar de mate waarin de kosten waarop de
      reserve betrekking heeft, ten laste van die maatschappijen zullen komen;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15aj
  - number: 15aj.4.b
    text: |-
      een herinvesteringsreserve wordt toegedeeld aan de maatschappij die het vermogensbestanddeel heeft vervreemd ter
      zake waarvan de reserve is gevormd.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15aj
  - number: 15aj.5
    text: |-
      Vanaf het ontvoegingstijdstip van een maatschappij treedt deze met betrekking tot hetgeen zij na de ontvoeging
      voortzet in de plaats van de fiscale eenheid, behoudens voorzover bij of krachtens deze wet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15aj
  - number: 15aj.6
    text: |-
      De aandelen in een dochtermaatschappij worden op het ontvoegingstijdstip teboekgesteld op het in
      [artikel 13d, achtste lid][ref1], vastgestelde opgeofferde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel13d
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15aj
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 13d
        hoofdstuk: II
        afdeling: '2.5'
  - number: 15aj.7
    text: |-
      Indien op het ontvoegingstijdstip van een maatschappij tot het vermogen van die maatschappij een deelneming
      behoort waarvan de onderneming geheel of nagenoeg geheel is gestaakt, dan wel daartoe is besloten, en die
      deelneming tijdens het bestaan van de fiscale eenheid van een andere maatschappij is verkregen, wordt op het
      ontvoegingstijdstip het door die maatschappij voor de deelneming opgeofferde bedrag niet hoger gesteld dan de
      waarde in het economische verkeer van de deelneming op het tijdstip van verkrijging van de deelneming door die
      maatschappij.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15aj
  - number: 15a.1
    text: |-
      Van een centrale maatschappij en haar ledenmaatschappijen wordt, op verzoek van al deze belastingplichtigen en
      ten vroegste met ingang van het jaar waarin het verzoek is ingediend, de belasting van hen geheven alsof er één
      belastingplichtige is, in die zin dat de werkzaamheden en het vermogen van de ledenmaatschappijen deel uitmaken
      van de werkzaamheden en het vermogen van de centrale maatschappij. De belasting wordt geheven bij de centrale
      maatschappij. De belastingplichtigen tezamen worden in dat geval aangemerkt als fiscale eenheid.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15a
  - number: 15a.2
    text: 'Het eerste lid vindt slechts toepassing zo lang:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15a
  - number: 15a.2.a
    text: de werkzaamheden van de ledenmaatschappijen plaatsvinden onder leiding van de centrale maatschappij;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15a
  - number: 15a.2.b
    text: |-
      de werkzaamheden van de maatschappijen elkaar over en weer aangaan, met dien verstande dat de maatschappijen in
      ieder geval onderling instaan voor elkaars schulden;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15a
  - number: 15a.2.c
    text: winstuitdelingen aan de leden van de ledenmaatschappijen plaatsvinden naar een gelijke maatstaf;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15a
  - number: 15a.2.d
    text: de tijdvakken waarover de belasting wordt geheven voor de maatschappijen samenvallen;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15a
  - number: 15a.2.e
    text: de door Onze Minister nader te stellen voorwaarden zijn vervuld.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15a
  - number: 15a.3
    text: |-
      De inspecteur beslist op het verzoek bij voor bezwaar vatbare beschikking, waarin de in het tweede lid, onderdeel
      e, bedoelde voorwaarden zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15a
  - number: 15a.4
    text: |-
      Het eerste lid vindt geen toepassing ingeval voor het bepalen van de winst niet bij de maatschappijen dezelfde
      bepalingen – uitgezonderd [artikel 9, eerste lid, onderdeel g][ref1] – van toepassing zijn, tenzij Onze Minister
      anders bepaalt.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel9
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '9'
        hoofdstuk: II
        afdeling: '2.2'
  - number: 15a.5
    text: |-
      De in het tweede lid, onderdeel e, bedoelde voorwaarden kunnen strekken tot de verzekering van de heffing en
      invordering van de belasting met het oog op de omstandigheid dat de in het eerste lid bedoelde belastingplichtigen
      voor de toepassing van deze wet een fiscale eenheid vormen alsmede met het oog op de totstandkoming en beëindiging
      van de fiscale eenheid. Onder die voorwaarden worden mede begrepen voorwaarden die betrekking kunnen hebben op het
      bepalen van de in een jaar genoten winst, de toelaatbare reserves, de verrekening van verliezen, de verminderingen
      ter voorkoming van dubbele belasting ter zake van buitenlandse resultaten en de inhoud en wijziging van de statuten
      van de maatschappijen alsmede de overdracht en beëindiging van lidmaatschapsrechten in de centrale maatschappij.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15a
  - number: 15a.6
    text: |-
      Indien de ledenmaatschappijen deel uitmaken van een fiscale eenheid met een centrale maatschappij vindt met
      betrekking tot die centrale maatschappij [artikel 9, eerste lid, onderdeel g][ref1], geen toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel9
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '9'
        hoofdstuk: II
        afdeling: '2.2'
  - number: 15a.7
    text: |-
      [Artikel 15, tiende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '15'
        hoofdstuk: II
        afdeling: '2.9'
  - number: 15a.8
    text: 'Dit artikel verstaat onder:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15a
  - number: 15a.8.a
    text: |-
      centrale maatschappij: een in Nederland gevestigde coöperatie waarvan de leden uitsluitend zijn in Nederland
      gevestigde coöperaties;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15a
  - number: 15a.8.b
    text: 'ledenmaatschappijen: de leden van een centrale maatschappij.'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15a
  - number: 15a.9
    text: Dit artikel is op overeenkomstige wijze van toepassing op onderlinge waarborgmaatschappijen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15a
  - number: 15a.10
    text: |-
      Het bepaalde in [artikel 15ac, vijfde en zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15ac
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 15ac
        hoofdstuk: II
        afdeling: '2.9'
  - number: 15c.1
    text: |-
      Indien een belastingplichtige voor de toepassing van deze wet of een verdrag ter voorkoming van dubbele belasting
      dan wel de [Belastingregeling voor het Koninkrijk][ref1], de Belastingregeling voor het land Nederland niet
      meer wordt aangemerkt als inwoner van Nederland, worden de bestanddelen van zijn vermogen waarvan de voordelen
      dientengevolge niet meer begrepen worden in de belastbare winst, op het tijdstip onmiddellijk voorafgaande aan
      het ophouden van het hiervoor bedoelde inwonerschap geacht te zijn vervreemd tegen de waarde in het economische
      verkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0002464
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0002464
  - number: 15c.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing met betrekking tot de vermogensbestanddelen die bij een fiscale
      eenheid afkomstig zijn van een dochtermaatschappij indien zich ten aanzien van die dochtermaatschappij een
      omstandigheid voordoet als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15c
  - number: 15d
    text: |-
      Voordelen die niet reeds uit anderen hoofde in aanmerking zijn genomen, worden gerekend tot de winst van het jaar
      waarin de belastingplichtige ophoudt in Nederland belastbare winst te genieten. In dat geval worden de bestanddelen
      van zijn vermogen voor de toepassing van de desinvesteringsbijtelling geacht te zijn vervreemd tegen de waarde in
      het economische verkeer.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15d
  - number: 15e.1
    text: |-
      Bij de belastingplichtige met winst uit een andere staat wordt de winst verminderd met de positieve en de negatieve
      bedragen van de winst uit die staat (objectvrijstelling voor buitenlandse ondernemingswinsten).
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15e
  - number: 15e.2
    text: 'Onder winst uit een andere staat wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15e
  - number: 15e.2.a
    text: |-
      voor zover in de relatie tot de andere staat een verdrag van kracht is dat, of een regeling is getroffen die,
      voorziet in een regeling voor de heffing over de bestanddelen van de winst van de belastingplichtige: het
      gezamenlijke bedrag van:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15e
  - number: 15e.2.a.1°
    text: |-
      de winst die toerekenbaar is aan een buitenlandse onderneming in die staat, zijnde een onderneming die, of een
      gedeelte van een onderneming dat, wordt gedreven met behulp van een vaste inrichting binnen het gebied van die
      staat;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15e
  - number: 15e.2.a.2°
    text: |-
      de in de winst begrepen opbrengsten, verminderd met de daarmee verband houdende kosten, uit de in die staat gelegen
      onroerende zaken, en
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15e
  - number: 15e.2.a.3°
    text: |-
      de in de winst begrepen overige voordelen, verminderd met de daarmee verband houdende kosten, uit die staat die op
      grond van dat verdrag, onderscheidenlijk die regeling, ter heffing aan die staat zijn toegewezen;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15e
  - number: 15e.2.b
    text: |-
      voor zover in de relatie tot de andere staat niet een verdrag als bedoeld in onderdeel a van kracht is en niet een
      regeling als bedoeld in onderdeel a is getroffen: het gezamenlijke bedrag van:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15e
  - number: 15e.2.b.1°
    text: |-
      de in die staat behaalde winst uit buitenlandse onderneming, zijnde een onderneming die, of een gedeelte van een
      onderneming dat, wordt gedreven met behulp van een vaste inrichting als bedoeld in [artikel 15f][ref1] binnen het
      gebied van die staat;


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15f
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15e
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 15f
        hoofdstuk: II
        afdeling: 2.10a
  - number: 15e.2.b.2°
    text: |-
      de in de winst begrepen opbrengsten, verminderd met de daarmee verband houdende kosten, uit binnen het gebied van
      de andere staat gelegen onroerende zaken, daaronder begrepen rechten die direct of indirect betrekking hebben op
      dergelijke onroerende zaken, en
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15e
  - number: 15e.2.b.3°
    text: |-
      de in de winst begrepen opbrengsten, verminderd met de daarmee verband houdende kosten, uit rechten op aandelen
      in de winst van een onderneming waarvan de leiding in de andere staat is gevestigd voor zover deze rechten niet
      opkomen uit effectenbezit.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15e
  - number: 15e.3
    text: |-
      Voor de toepassing van het tweede lid, onderdeel b, worden mede als buitenlandse onderneming beschouwd
      werkzaamheden die gedurende een aaneengesloten periode van ten minste 30 dagen in, op of boven het winningsgebied
      van de andere staat worden verricht. Het winningsgebied van een andere staat bestaat uit de territoriale zee van
      die staat alsmede het buiten de territoriale zee gelegen deel van de zeebodem en de ondergrond daarvan, voor zover
      de andere staat daar op grond van het internationale recht soevereine rechten kan uitoefenen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15e
  - number: 15e.4
    text: |-
      Voor de toepassing van het tweede lid, onderdeel b, wordt onder het gebied van een andere staat verstaan: het
      grondgebied van die staat, daaronder begrepen het gebied buiten de territoriale zee van die staat voor zover deze
      daar in overeenstemming met het internationale recht soevereine rechten kan uitoefenen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15e
  - number: 15e.5
    text: |-
      Inkomen uit de exploitatie van schepen of luchtvaartuigen in het internationale verkeer wordt voor de toepassing
      van het tweede lid, onderdeel b, alleen als winst uit buitenlandse onderneming in aanmerking genomen voor zover dat
      inkomen in de staat waar de vaste inrichting is gelegen in een belastingheffing naar de winst wordt betrokken.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15e
  - number: 15e.6
    text: |-
      Voor de toepassing van het tweede lid, onderdeel b, worden bij het bepalen van de winst uit een buitenlandse
      onderneming aan die buitenlandse onderneming de voordelen toegerekend die deze geacht zou worden te behalen –
      in het bijzonder bij haar handelen met andere onderdelen van de onderneming – indien zij een zelfstandige en
      onafhankelijke onderneming zou zijn, die dezelfde of soortgelijke werkzaamheden zou uitoefenen onder dezelfde
      of soortgelijke omstandigheden, hierbij in aanmerking nemende de door de belastingplichtige door middel van de
      buitenlandse onderneming en andere delen van de onderneming uitgeoefende functies, gebruikte activa en gelopen
      risico’s.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15e
  - number: 15e.7
    text: |-
      De objectvrijstelling voor buitenlandse ondernemingswinsten vindt geen toepassing op de winst uit een laagbelaste
      buitenlandse beleggingsonderneming als bedoeld in [artikel 15g][ref1], tenzij zodanige winst op grond van een
      verdrag ter voorkoming van dubbele belasting in Nederland voor een vrijstelling ter voorkoming van dubbele
      belasting in aanmerking komt.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15g
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15e
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 15g
        hoofdstuk: II
        afdeling: 2.10a
  - number: 15e.8
    text: |-
      De objectvrijstelling voor buitenlandse ondernemingswinsten vindt geen toepassing ten aanzien van een
      belastingplichtige die als beleggingsinstelling is aangemerkt.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15e
  - number: 15e.9
    text: |-
      Voor de toepassing van de [artikelen 8][ref1], [10][ref2] en [13b][ref3] wordt onder regeling ter voorkoming
      van dubbele belasting mede verstaan de objectvrijstelling voor buitenlandse ondernemingswinsten, bedoeld in dit
      artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0002672#Artikel13b
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15e
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '8'
        hoofdstuk: II
        afdeling: '2.2'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: '10'
        hoofdstuk: II
        afdeling: '2.2'
      - id: ref3
        bwb_id: BWBR0002672
        artikel: 13b
        hoofdstuk: II
        afdeling: '2.5'
  - number: 15f.1
    text: |-
      Voor de toepassing van [artikel 15e, tweede lid, onderdeel b][ref1], wordt onder vaste inrichting verstaan een
      vaste bedrijfsinrichting met behulp waarvan de werkzaamheden van een onderneming geheel of gedeeltelijk worden
      uitgeoefend. De plaats van uitvoering van een bouwwerk of van constructie- of installatiewerkzaamheden is slechts
      dan een vaste inrichting indien de duur ervan twaalf maanden overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15e
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15f
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 15e
        hoofdstuk: II
        afdeling: 2.10a
  - number: 15f.2
    text: 'In afwijking in zoverre van het eerste lid wordt niet als een vaste inrichting beschouwd:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15f
  - number: 15f.2.a
    text: |-
      het gebruikmaken van inrichtingen, uitsluitend voor opslag, uitstalling of aflevering van aan de belastingplichtige
      toebehorende goederen of koopwaar;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15f
  - number: 15f.2.b
    text: |-
      het aanhouden van een voorraad van aan de belastingplichtige toebehorende goederen of koopwaar, uitsluitend voor
      opslag, uitstalling of aflevering;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15f
  - number: 15f.2.c
    text: |-
      het aanhouden van een voorraad van aan de belastingplichtige toebehorende goederen of koopwaar, uitsluitend voor
      bewerking of verwerking door een ander;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15f
  - number: 15f.2.d
    text: |-
      het aanhouden van een vaste bedrijfsinrichting, uitsluitend om voor de onderneming goederen of koopwaar aan te
      kopen of inlichtingen in te winnen;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15f
  - number: 15f.2.e
    text: |-
      het aanhouden van een vaste bedrijfsinrichting, uitsluitend om voor de onderneming enige andere werkzaamheid uit te
      oefenen die van voorbereidende aard is of het karakter van hulpwerkzaamheid heeft;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15f
  - number: 15f.2.f
    text: |-
      het aanhouden van een vaste bedrijfsinrichting, uitsluitend voor een combinatie van de in de onderdelen a tot en
      met e genoemde werkzaamheden, mits het totaal van de werkzaamheden van de vaste bedrijfsinrichting dat uit deze
      combinatie voortvloeit van voorbereidende aard is of het karakter van hulpwerkzaamheid heeft.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15f
  - number: 15f.3
    text: |-
      Indien een persoon of lichaam – niet zijnde een onafhankelijke vertegenwoordiger in de zin van het vierde lid –
      voor een belastingplichtige werkzaam is, en een machtiging bezit om namens de belastingplichtige overeenkomsten af
      te sluiten en dit recht in een andere staat gewoonlijk uitoefent, heeft die belastingplichtige voor de toepassing
      van [artikel 15e, tweede lid, onderdeel b][ref1], een vaste inrichting in die andere staat met betrekking tot de
      werkzaamheden die de persoon of het lichaam voor die belastingplichtige verricht. De vorige volzin is niet van
      toepassing indien de werkzaamheden van de persoon of het lichaam beperkt blijven tot werkzaamheden als bedoeld in
      het tweede lid die, indien zij zouden worden uitgeoefend met behulp van een vaste bedrijfsinrichting, deze vaste
      bedrijfsinrichting op grond van de bepalingen van dat lid niet tot een vaste inrichting zouden maken.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15e
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15f
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 15e
        hoofdstuk: II
        afdeling: 2.10a
  - number: 15f.4
    text: |-
      Een belastingplichtige heeft geen vaste inrichting in een andere staat alleen op grond van de omstandigheid
      dat hij in die staat zaken doet door bemiddeling van een makelaar, commissionair of enige andere onafhankelijke
      vertegenwoordiger, mits deze vertegenwoordiger in de normale uitoefening van zijn bedrijf handelt.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15f
  - number: 15g.1
    text: |-
      Voor de toepassing van [artikel 15e, zevende lid][ref1], is een buitenlandse onderneming een laagbelaste
      buitenlandse beleggingsonderneming indien:


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15e
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15g
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 15e
        hoofdstuk: II
        afdeling: 2.10a
  - number: 15g.1.a
    text: |-
      de werkzaamheden van de buitenlandse onderneming tezamen met de werkzaamheden van de lichamen waarin de
      belastingplichtige, onmiddellijk dan wel middellijk, een belang van 5% of meer heeft dat toerekenbaar is aan
      de buitenlandse onderneming, grotendeels bestaan uit beleggen of het direct of indirect financieren van de
      belastingplichtige of met de belastingplichtige verbonden lichamen, dan wel van bedrijfsmiddelen die door de
      belastingplichtige of met de belastingplichtige verbonden lichamen worden gebruikt, daaronder begrepen het ter
      beschikking stellen van het gebruik of het gebruiksrecht daarvan, en
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15g
  - number: 15g.1.b
    text: |-
      de winst uit de buitenlandse onderneming in de staat waarin deze is behaald niet is onderworpen aan een belasting
      naar de winst die resulteert in een naar Nederlandse begrippen reële heffing.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15g
  - number: 15g.2
    text: 'Van werkzaamheden als bedoeld in het eerste lid, onderdeel a, is geen sprake voor zover:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15g
  - number: 15g.2.a
    text: |-
      de werkzaamheden ingevolge bij ministeriële regeling te stellen regels kunnen worden aangemerkt als actieve
      financierings- of terbeschikkingstellingswerkzaamheden, of
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15g
  - number: 15g.2.b
    text: |-
      de werkzaamheden bestaan uit het houden van onroerende zaken – daaronder mede begrepen rechten die direct of
      indirect betrekking hebben op onroerende zaken – die niet in het bezit zijn van een lichaam dat is aangemerkt als
      beleggingsinstelling of vrijgestelde beleggingsinstelling.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15g
  - number: 15h.1
    text: |-
      Ingeval in een jaar het gezamenlijke bedrag aan winst uit buitenlandse onderneming waarop ingevolge
      [artikel 15e, zevende lid][ref1], de objectvrijstelling voor buitenlandse-ondernemingswinsten geen toepassing
      vindt, positief is, wordt, ter verrekening van op die winst drukkende buitenlandse winstbelasting, op de door
      de belastingplichtige verschuldigde vennootschapsbelasting van dat jaar een vermindering verleend volgens
      [artikel 23d][ref2] (verrekening bij buitenlandse ondernemingswinsten).


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15e
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel23d
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15h
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 15e
        hoofdstuk: II
        afdeling: 2.10a
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 23d
        hoofdstuk: Va
  - number: 15h.2
    text: |-
      Ingeval in een jaar het gezamenlijke bedrag aan winst uit buitenlandse onderneming waarop ingevolge
      [artikel 15e, zevende lid][ref1], de objectvrijstelling voor buitenlandse-ondernemingswinsten geen toepassing
      vindt, negatief is, wordt de winst van dat jaar verminderd met een bedrag ter grootte van 5/H deel van dat bedrag.
      Daarbij staat H voor het percentage van het hoogste tarief, bedoeld in [artikel 22][ref2], geldend aan het einde
      van het jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15e
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel22
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15h
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 15e
        hoofdstuk: II
        afdeling: 2.10a
      - id: ref2
        bwb_id: BWBR0002672
        artikel: '22'
        hoofdstuk: V
  - number: 15h.3
    text: |-
      Dit artikel vindt geen toepassing ingeval de belastingplichtige voor de winst uit de laagbelaste buitenlandse
      beleggingsonderneming in het buitenland is vrijgesteld van een belasting naar de winst, of aldaar is onderworpen
      aan een belasting naar de winst die niet resulteert in een daadwerkelijke heffing.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15h
  - number: 15h.4
    text: |-
      Dit artikel vindt geen toepassing ten aanzien van een belastingplichtige die als beleggingsinstelling is
      aangemerkt.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15h
  - number: 15i.1
    text: |-
      Ingeval de belastingplichtige ophoudt winst uit een andere staat te genieten, vindt de objectvrijstelling voor
      buitenlandse ondernemingswinsten geen toepassing met betrekking tot het op de voet van dit artikel berekende
      verlies uit die staat (stakingsverlies).
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15i
  - number: 15i.2
    text: |-
      Van een stakingsverlies uit een staat is sprake ingeval de op de voet van [artikel 15e][ref1] in aanmerking genomen
      bedragen aan winst uit die staat per saldo hebben geleid tot een negatief bedrag, doch voor zover ter zake van dit
      negatieve saldo in die andere staat generlei tegemoetkoming bij de belastingheffing is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15e
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15i
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 15e
        hoofdstuk: II
        afdeling: 2.10a
  - number: 15i.3
    text: |-
      Het stakingsverlies wordt niet in aanmerking genomen voor zover een ander dan de belastingplichtige of een met hem
      verbonden lichaam in die andere staat recht heeft op enigerlei tegemoetkoming bij de belastingheffing ter zake van
      verliezen die deel uitmaken van het stakingsverlies.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15i
  - number: 15i.4
    text: |-
      Het stakingverlies komt in aftrek op het tijdstip waarop de belastingplichtige ophoudt winst uit de andere staat
      te genieten:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15i
  - number: 15i.4.a
    text: |-
      mits de activiteiten van de belastingplichtige in de andere staat niet in belangrijke mate reeds zijn of worden
      voortgezet door een met de belastingplichtige verbonden lichaam, en
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15i
  - number: 15i.4.b
    text: voor zover de hoogte van het in aanmerking te nemen stakingsverlies is gebleken.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15i
  - number: 15i.5
    text: |-
      Ingeval de belastingplichtige binnen drie jaren na het tijdstip waarop het stakingsverlies in aftrek is gekomen
      weer winst uit die andere staat gaat genieten, wordt een bedrag ter grootte van het in aftrek gekomen verlies aan
      de winst toegevoegd.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15i
  - number: 15i.6
    text: |-
      De objectvrijstelling voor buitenlandse ondernemingswinsten is niet van toepassing op de toevoeging aan de winst,
      bedoeld in het vijfde lid. Het bedrag dat aan de winst is toegevoegd, wordt voor de toepassing van het tweede
      lid aangemerkt als een negatief bedrag aan winst uit de andere staat dat op de voet van [artikel 15e][ref1] in
      aanmerking is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15e
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15i
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 15e
        hoofdstuk: II
        afdeling: 2.10a
  - number: 15i.7
    text: |-
      Het saldo van de positieve en negatieve bedragen aan winst uit een andere staat wordt op verzoek door de inspecteur
      bij voor bezwaar vatbare beschikking vastgesteld, mits de belastingplichtige een berekening heeft overgelegd waarop
      naar zijn oordeel het saldo zou moeten worden vastgesteld. Indien het saldo op een onjuist bedrag is vastgesteld,
      kan de inspecteur de beschikking bij voor bezwaar vatbare beschikking herzien. De bevoegdheid tot herziening
      vervalt door verloop van vijf jaren na de vaststelling van de beschikking.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15i
  - number: 15j.1
    text: |-
      Indien de belastingplichtige ophoudt winst uit een andere staat te genieten en de activiteiten die tot die winst
      hebben geleid in belangrijke mate reeds zijn of worden voortgezet door een met de belastingplichtige verbonden
      lichaam, wordt het saldo van de positieve en de negatieve bedragen aan winst uit die andere staat dat bij de
      belastingplichtige in aanmerking is genomen op de voet van [artikel 15e][ref1], doorgeschoven naar het verbonden
      lichaam dat de activiteiten voortzet en bij dat lichaam aangemerkt als bestanddelen die door dat lichaam op de voet
      van artikel 15e in aanmerking zijn genomen. Ingeval de activiteiten door meer dan een met de belastingplichtige
      verbonden lichaam zijn of worden voortgezet, vindt de eerste volzin naar evenredigheid toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15e
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15j
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 15e
        hoofdstuk: II
        afdeling: 2.10a
  - number: 15j.2
    text: |-
      Een voortzetting wordt niet aanwezig geacht in geval van een voortzetting in het zicht van staking. De
      doorschuiving op de voet van het eerste lid vindt dan geen toepassing. Van voortzetting in het zicht van staking
      is sprake ingeval de voortgezette activiteiten binnen drie jaar na de aanvang van de voortzetting worden gestaakt,
      tenzij het verbonden lichaam aannemelijk maakt dat de staking plaatsvindt op grond van zakelijke overwegingen die
      zijn opgekomen na de aanvang van de voortzetting.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15j
  - number: 15j.3
    text: |-
      Op een door de belastingplichtige en het voortzettende lichaam gezamenlijk gedaan verzoek wordt door de inspecteur
      belast met de aanslagregeling van de belastingplichtige het doorgeschoven saldo bij voor bezwaar vatbare
      beschikking vastgesteld. Indien het saldo op een onjuist bedrag is vastgesteld, kan de inspecteur de beschikking
      bij voor bezwaar vatbare beschikking herzien. De bevoegdheid tot herziening vervalt door verloop van vijf jaren na
      de vaststelling van de beschikking.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel15j
  - number: '16.1'
    text: |-
      Aftrekbare giften zijn de in het jaar gedane en met schriftelijke bescheiden gestaafde giften aan algemeen nut
      beogende instellingen en steunstichtingen SBBI. De aftrek bedraagt ten hoogste 50 percent van de winst met een
      maximum van € 100 000.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel16
  - number: '16.2'
    text: |-
      Als giften worden aangemerkt bevoordelingen uit vrijgevigheid en al dan niet verplichte bijdragen, voor zover
      daardoor geen op geld waardeerbare aanspraken ontstaan.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel16
  - number: '16.3'
    text: |-
      De aftrek, bedoeld in het eerste lid, wordt verhoogd met 50 percent van het bedrag van de giften die zijn gedaan
      aan een culturele instelling, doch ten hoogste met € 2500.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel16
  - number: '17.1'
    text: |-
      Ten aanzien van buitenlandse belastingplichtigen wordt de belasting geheven naar het belastbare Nederlandse bedrag;
      [artikel 7, vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel7
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '7'
        hoofdstuk: II
        afdeling: '2.1'
  - number: '17.2'
    text: |-
      Het belastbare Nederlandse bedrag is het in een jaar genoten Nederlandse inkomen verminderd met de op de voet
      van [Hoofdstuk IV][ref1] te verrekenen verliezen uit Nederlands inkomen; [artikel 7, vierde lid][ref2], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel7
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002672
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002672
        artikel: '7'
        hoofdstuk: II
        afdeling: '2.1'
  - number: '17.3'
    text: 'Het Nederlandse inkomen is het gezamenlijke bedrag van:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel17
  - number: 17.3.a
    text: |-
      de belastbare winst uit een in Nederland gedreven onderneming, zijnde het bedrag van de gezamenlijke voordelen die
      worden verkregen uit een onderneming die, of een gedeelte van een onderneming dat wordt gedreven met behulp van een
      vaste inrichting in Nederland of van een vaste vertegenwoordiger in Nederland (Nederlandse onderneming);
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel17
  - number: 17.3.b
    text: |-
      het belastbare inkomen uit een aanmerkelijk belang in de zin van
      [hoofdstuk 4 van de Wet inkomstenbelasting 2001][ref1] in een in Nederland gevestigde vennootschap, niet zijnde een
      vrijgestelde beleggingsinstelling, indien de belastingplichtige het aanmerkelijk belang houdt met als voornaamste
      doel of een van de voornaamste doelen om de heffing van inkomstenbelasting of dividendbelasting bij een ander te
      ontgaan en dit aanmerkelijk belang niet behoort tot het vermogen van een onderneming;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '4'
  - number: 17.3.c
    text: |-
      de belastbare winst van een op Aruba, Curaçao of Sint Maarten gevestigd lichaam voor zover die wordt
      behaald uit een op de BES eilanden gedreven onderneming met behulp van een vaste inrichting of een vaste
      vertegenwoordiger op de BES eilanden en die vaste inrichting of vaste vertegenwoordiger op basis van
      [artikel 5.2 van de Belastingwet BES][ref1] voor de toepassing van de opbrengstbelasting als bedoeld in
      [hoofdstuk V van de Belastingwet BES][ref2] niet op de BES eilanden maar in Nederland zou zijn gevestigd indien
      de vaste inrichting een lichaam zou zijn geweest of de activiteiten van de vaste vertegenwoordiger in een lichaam
      zouden zijn ondergebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0029244#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0029244
        hoofdstuk: V
  - number: '17.4'
    text: |-
      Voor de toepassing van het derde lid, onderdeel b, is [afdeling 4.2 van de Wet inkomstenbelasting 2001][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Afdeling4.2
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0011353
        afdeling: '4.2'
  - number: '17.5'
    text: |-
      In afwijking van het derde lid, onderdeel b, wordt, indien het aanmerkelijk belang wordt gehouden om de heffing
      van alleen dividendbelasting te ontgaan, het in aanmerking te nemen belastbare inkomen uit dat aanmerkelijk belang
      gesteld op 15/H gedeelte van de ontvangen opbrengst, bedoeld in de [Wet op de dividendbelasting 1965][ref1], uit
      dat belang. Daarbij staat H voor het percentage van het hoogste tarief, bedoeld in [artikel 22][ref2], geldend voor
      het jaar waarin het voordeel is genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0002515
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel22
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002515
      - id: ref2
        bwb_id: BWBR0002672
        artikel: '22'
        hoofdstuk: V
  - number: 17a
    text: 'Tot een Nederlandse onderneming worden gerekend:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel17a
  - number: 17a.a
    text: 'in Nederland gelegen onroerende zaken, daaronder begrepen:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel17a
  - number: 17a.a.1°
    text: rechten die direct of indirect betrekking hebben op in Nederland gelegen onroerende zaken en
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel17a
  - number: 17a.a.2°
    text: |-
      rechten die samenhangen met de exploratie en de exploitatie van in Nederland aanwezige natuurlijke rijkdommen
      waaronder ook wordt gerekend de opwekking van energie uit het water, de stromen en de winden, of rechten waaraan
      deze zijn onderworpen;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel17a
  - number: 17a.b
    text: |-
      rechten op aandelen in de winst of de medegerechtigdheid tot het vermogen van een onderneming waarvan de leiding in
      Nederland is gevestigd voorzover zij niet opkomen uit effectenbezit;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel17a
  - number: 17a.c
    text: |-
      schuldvorderingen op een in Nederland gevestigde vennootschap indien de gerechtigde tot de schuldvordering een
      aanmerkelijk belang als bedoeld in [artikel 17, derde lid, onderdeel b][ref1], in de vennootschap heeft;


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel17
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '17'
        hoofdstuk: III
  - number: 17a.d
    text: |-
      werkzaamheden die worden verricht als bestuurder of commissaris van een in Nederland gevestigd lichaam in de zin
      van de [Algemene wet inzake rijksbelastingen][ref1] alsmede leidende werkzaamheden en functies die worden verricht
      voor een zodanig lichaam, ook indien de bevoegdheid is beperkt tot buiten Nederland gelegen gedeelten van de
      onderneming van dat lichaam;


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: 17a.e
    text: |-
      werkzaamheden die gedurende een aaneengesloten periode van tenminste 30 dagen in, op of boven het
      Noordzeewinningsgebied worden verricht. Het Noordzeewinningsgebied bestaat uit de territoriale zee van Nederland
      alsmede het buiten de territoriale zee onder de Noordzee gelegen deel van de zeebodem en de ondergrond daarvan,
      voorzover het Koninkrijk der Nederlanden daar op grond van het internationale recht rechten mag uitoefenen, en
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel17a
  - number: 17a.f
    text: |-
      werkzaamheden als bedoeld in onderdeel e, indien deze na een onderbreking worden voortgezet door het lichaam
      dat deze werkzaamheden heeft verricht, of onmiddellijk of na een onderbreking worden voortgezet door een met
      dat lichaam verbonden lichaam en de duur van deze werkzaamheden in een tijdvak van 12 maanden een periode van
      ten minste 30 dagen bedraagt. In dat geval wordt ieder van deze lichamen geacht te hebben voldaan aan de in dat
      onderdeel gestelde voorwaarde van 30 dagen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel17a
  - number: '18.1'
    text: |-
      De belastbare winst uit onderneming wordt opgevat en bepaald op de voet van
      [artikel 8, eerste tot en met het achtste, elfde en dertiende lid][ref1], alsmede de
      [artikelen 8b tot en met 15aj][ref2] en [artikel 15d][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0002672#Artikel15d
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '8'
        hoofdstuk: II
        afdeling: '2.2'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: '9'
        hoofdstuk: II
        afdeling: '2.2'
      - id: ref3
        bwb_id: BWBR0002672
        artikel: 15d
        hoofdstuk: II
        afdeling: '2.10'
  - number: '18.2'
    text: |-
      Het belastbare inkomen uit aanmerkelijk belang wordt opgevat en berekend volgens de regels van
      [hoofdstuk 4 van de Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '4'
  - number: '19'
    text: |-
      Indien in het land waar de onderneming is gevestigd een overeenkomstig standpunt wordt ingenomen, wordt niet als
      het drijven van een binnenlandse onderneming door een niet in Nederland gevestigd lichaam aangemerkt:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel19
  - number: 19.a
    text: |-
      het vervoer te water of door de lucht van personen en zaken tussen plaatsen buiten Nederland en plaatsen in
      Nederland, dan wel tussen plaatsen buiten Nederland onderling, tenzij de leiding van de onderneming in Nederland
      gevestigd is;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel19
  - number: 19.b
    text: het exploiteren van baanvakken van spoor- en tramlijnen tussen de grens en het naastbij de grens gelegen station.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel19
  - number: '20.1'
    text: |-
      Indien de berekening van de belastbare winst of van het Nederlandse inkomen leidt tot een negatief bedrag, wordt
      dit aangemerkt als een verlies.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel20
  - number: '20.2'
    text: |-
      Een verlies wordt verrekend met de belastbare winsten, onderscheidenlijk de Nederlandse inkomens, van het
      voorafgaande jaar en de negen volgende jaren, mits het verlies door de inspecteur is vastgesteld bij voor bezwaar
      vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel20
  - number: '20.3'
    text: |-
      In afwijking van het tweede lid zijn de verliezen geleden in een periode waarin een belastingplichtige als
      beleggingsinstelling is aangemerkt (statusperiode), niet verrekenbaar met de belastbare winsten, onderscheidenlijk
      Nederlandse inkomens, die buiten de statusperiode zijn genoten, en zijn verliezen die buiten de statusperiode zijn
      geleden niet verrekenbaar met de winsten, onderscheidenlijk Nederlandse inkomens, die binnen de statusperiode zijn
      genoten.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel20
  - number: '20.4'
    text: |-
      Indien de feitelijke werkzaamheid van een belastingplichtige gedurende het gehele of nagenoeg het gehele jaar
      uitsluitend of nagenoeg uitsluitend bestaat uit het houden van deelnemingen of het direct of indirect financieren
      van met hem verbonden lichamen, is in afwijking van het tweede lid het verlies van dat jaar slechts verrekenbaar
      met de belastbare winsten, onderscheidenlijk de Nederlandse inkomens, van jaren waarin:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel20
  - number: 20.4.a
    text: |-
      de feitelijke werkzaamheid van de belastingplichtige eveneens gedurende het gehele of nagenoeg het gehele jaar
      uitsluitend of nagenoeg uitsluitend bestaat uit het houden van deelnemingen of het direct of indirect financieren
      van met hem verbonden lichamen, en
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel20
  - number: 20.4.b
    text: |-
      de boekwaarde van de vorderingen op met de belastingplichtige verbonden lichamen verminderd met de boekwaarde van
      de schulden aan zodanige lichamen gedurende het gehele of nagenoeg het gehele jaar niet uitgaat boven de boekwaarde
      van soortgelijke vorderingen verminderd met de boekwaarde van soortgelijke schulden aan het einde van het jaar
      waarin het verlies is geleden.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel20
  - number: '20.5'
    text: |-
      De in het vierde lid, onderdeel b, opgenomen voorwaarde blijft buiten toepassing indien de belastingplichtige
      aannemelijk maakt dat de wijziging van het in dat onderdeel bedoelde saldo niet in overwegende mate is gericht op
      verruiming van verliesverrekening.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel20
  - number: '20.6'
    text: |-
      De feitelijke werkzaamheid van de belastingplichtige, bedoeld in het vierde lid, wordt in ieder geval geacht
      niet uitsluitend of nagenoeg uitsluitend te bestaan uit het houden van deelnemingen of het direct of indirect
      financieren van met hem verbonden lichamen indien ten minste 25 werknemers, berekend op basis van volledige
      werktijd, andere dan de genoemde werkzaamheden uitoefenen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel20
  - number: '20.7'
    text: |-
      De verrekening geschiedt in de volgorde waarin de verliezen zijn ontstaan en de belastbare winsten zijn gemaakt of
      de Nederlandse inkomens zijn genoten.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel20
  - number: '20.8'
    text: |-
      De in het tweede lid genoemde termijn voor de achterwaartse verliesverrekening wordt voor een belastingplichtige
      aan wie wegens gemoedsbezwaren tegen één of meer volksverzekeringen ontheffing is verleend als bedoeld in
      [artikel 64, eerste lid, aanhef en onderdeel b, van de Wet financiering sociale verzekeringen][ref1], en hij
      daarvoor bij de aangifte kiest, voor in het negende lid bedoelde verliezen vervangen door drie jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel64
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '64'
  - number: '20.9'
    text: |-
      Het achtste lid is van toepassing op verliezen die zijn toe te rekenen aan kosten en lasten van schade als gevolg
      van risico's die andere belastingplichtigen die wat betreft aard en omvang van de bedrijfsactiviteiten in een
      vergelijkbare positie verkeren als de belastingplichtige, plegen te verzekeren.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel20
  - number: 20a.1
    text: |-
      Indien aannemelijk is dat in vergelijking met het begin van het oudste jaar waarvan een verlies nog niet
      volledig is verrekend, het uiteindelijke belang in de belastingplichtige in belangrijke mate is gewijzigd, zijn
      de verliezen geleden voor het tijdstip waarop de wijziging heeft plaatsgevonden, in afwijking in zoverre van
      [artikel 20][ref1], niet meer voorwaarts verrekenbaar. Daarbij worden de vóór het tijdstip van de in de eerste
      volzin bedoelde wijziging genoten winst na giftenaftrek van het jaar waarin die wijziging heeft plaatsgevonden
      en de na dat tijdstip in dat jaar genoten winst na giftenaftrek afzonderlijk berekend. Bij een negatieve uitkomst
      wordt het bedrag toegerekend aan de belastbare winst van het voorafgaande respectievelijk het volgende jaar.
      Indien toerekening aan een ander jaar niet mogelijk is omdat de belastingplicht is aangevangen met het jaar waarin
      zich de wijziging heeft voorgedaan of is geëindigd bij het einde van dat jaar, wordt het negatieve bedrag niet in
      aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel20
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '20'
        hoofdstuk: IV
  - number: 20a.2
    text: |-
      Voor de toepassing van het eerste lid blijft buiten aanmerking een wijziging van het uiteindelijke belang in de
      belastingplichtige voorzover:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel20a
  - number: 20a.2.a
    text: de wijziging voortvloeit uit een overgang krachtens erfrecht of huwelijksvermogensrecht, of
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel20a
  - number: 20a.2.b
    text: |-
      de wijziging betrekking heeft op een uitbreiding van het uiteindelijke belang van een natuurlijke persoon of
      rechtspersoon die bij het begin van het oudste jaar, bedoeld in het eerste lid, reeds ten minste een derde deel van
      het uiteindelijke belang in de belastingplichtige had.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel20a
  - number: 20a.3
    text: |-
      Het eerste lid is niet van toepassing indien het de belastingplichtige niet bekend is of bekend had kunnen zijn dat
      het uiteindelijke belang in de belastingplichtige in belangrijke mate is gewijzigd, mits de wijziging niet uitgaat
      boven hetgeen als gebruikelijk kan worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel20a
  - number: 20a.4
    text: |-
      Het eerste lid is voorts niet van toepassing op een verlies dat is geleden in een jaar waarin de bezittingen van de
      belastingplichtige gedurende ten minste negen maanden niet grotendeels uit beleggingen bestonden, mits:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel20a
  - number: 20a.4.a
    text: |-
      direct voorafgaande aan de wijziging, bedoeld in het eerste lid, de gezamenlijke omvang van de werkzaamheden van de
      belastingplichtige niet is afgenomen tot minder dan 30 percent van de gezamenlijke omvang van de werkzaamheden bij
      het begin van het oudste jaar, bedoeld in het eerste lid, en
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel20a
  - number: 20a.4.b
    text: |-
      ten tijde van de wijziging niet het voornemen bestaat de gezamenlijke omvang van de op dat tijdstip aanwezige
      werkzaamheden binnen een periode van drie jaar alsnog te laten afnemen tot minder dan 30 percent van de
      gezamenlijke omvang van de werkzaamheden bij het begin van het oudste jaar, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel20a
  - number: 20a.5
    text: |-
      Voor de toepassing van het vierde lid blijven werkzaamheden die in samenhang met de in het eerste lid bedoelde
      wijziging zijn aangevangen, buiten beschouwing.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel20a
  - number: 20a.6
    text: |-
      Een verlies waarop het vierde lid van toepassing is, is slechts verrekenbaar met de belastbare winst
      onderscheidenlijk het Nederlandse inkomen van een jaar waarin de bezittingen van de belastingplichtige gedurende
      ten minste negen maanden niet grotendeels bestaan uit beleggingen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel20a
  - number: 20a.7
    text: |-
      Indien de omvangrijkste werkzaamheid van de belastingplichtige van het oudste jaar, bedoeld in het eerste lid, in
      dat jaar of in één van de drie daaraan voorafgaande jaren is aangevangen of verworven, wordt voor de toepassing
      van het vierde lid voor het oudste jaar gelezen het jaar waarvan het verlies ten tijde van de wijziging nog niet
      volledig is verrekend en de omvang van de werkzaamheden het grootst was.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel20a
  - number: 20a.8
    text: 'Voor de toepassing van dit artikel:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel20a
  - number: 20a.8.a
    text: |-
      worden onder beleggingen mede begrepen liquide middelen alsmede onroerende zaken die zijn bestemd om direct of
      indirect ter beschikking te worden gesteld aan anderen dan met de belastingplichtige verbonden lichamen als bedoeld
      in [artikel 10a, vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 10a
        hoofdstuk: II
        afdeling: '2.2'
  - number: 20a.8.b
    text: |-
      worden, bij een belastingplichtige die een onderneming drijft waarvan de werkzaamheden
      noodzakelijkerwijs meebrengen dat gelden worden belegd die aan hem, anders dan als eigen vermogen,
      zijn toevertrouwd door lichamen of natuurlijke personen die niet met hem zijn verbonden als bedoeld in
      [artikel 10a, vierde onderscheidenlijk vijfde lid][ref1], de beleggingen die rechtstreeks samenhangen met die
      gelden niet als belegging aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 10a
        hoofdstuk: II
        afdeling: '2.2'
  - number: 20a.9
    text: |-
      Met betrekking tot de verrekening van een verlies met de belastbare winsten, onderscheidenlijk binnenlandse
      inkomens uit voorafgaande jaren vinden het eerste, tweede en derde lid overeenkomstige toepassing, tenzij:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel20a
  - number: 20a.9.a
    text: |-
      in de tussenliggende periode de werkzaamheden van de belastingplichtige niet zijn gestaakt, noch nagenoeg geheel
      zijn gestaakt, en
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel20a
  - number: 20a.9.b
    text: |-
      gedurende ten minste negen maanden in het jaar waarin het verlies is geleden en in het jaar waarin de belastbare
      winst onderscheidenlijk het binnenlandse inkomen is behaald waarmee het verlies achterwaarts zou worden verrekend,
      de bezittingen van de belastingplichtige niet grotendeels bestaan uit beleggingen. Daarbij wordt voor het in
      het eerste lid bedoelde oudste jaar, gelezen het oudste jaar dat voorafgaat aan het jaar waarin die wijziging
      heeft plaatsgevonden en valt binnen de voor de belastingplichtige geldende termijn voor de achterwaartse
      verliesverrekening, bedoeld in [artikel 20][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel20
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '20'
        hoofdstuk: IV
  - number: 20a.10
    text: |-
      De belastingplichtige die zekerheid wenst over het antwoord op de volgende vragen, kan een verzoek indienen bij de
      inspecteur, die daarop bij voor bezwaar vatbare beschikking beslist. De vragen betreffen:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel20a
  - number: 20a.10.a
    text: |-
      is sprake van een situatie waarin het uiteindelijke belang in de belastingplichtige in belangrijke mate wijzigt of
      is gewijzigd;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel20a
  - number: 20a.10.b
    text: |-
      bestonden de bezittingen gedurende ten minste negen maanden in het jaar waarin het verlies is geleden niet
      grotendeels uit beleggingen;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel20a
  - number: 20a.10.c
    text: is voldaan aan de voorwaarden, bedoeld in het vierde lid, onderdelen a of b;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel20a
  - number: 20a.10.d
    text: zijn de werkzaamheden van het lichaam gestaakt of nagenoeg geheel gestaakt als bedoeld in het negende lid, of
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel20a
  - number: 20a.10.e
    text: |-
      bestonden de bezittingen gedurende ten minste negen maanden in het jaar waarin de belastbare winst
      onderscheidenlijk het binnenlandse inkomen is behaald waarmee een verlies achterwaarts zou worden verrekend, niet
      grotendeels uit beleggingen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel20a
  - number: 20a.11
    text: |-
      Indien niet is voldaan aan de voorwaarden, bedoeld in het vierde lid, onderdelen a of b, maar wel aan de voorwaarde
      in de aanhef van dat lid, kunnen op verzoek van de belastingplichtige verliezen toch nog voorwaarts worden
      verrekend met belastbare winsten onderscheidenlijk binnenlandse inkomens voorzover die winsten en inkomens zijn toe
      te rekenen aan werkzaamheden die reeds aanwezig waren direct voorafgaande aan de wijziging, bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel20a
  - number: 20a.12
    text: |-
      Indien een belastingplichtige vanaf enig tijdstip als gevolg van de toepassing van dit artikel verliezen niet
      meer kan verrekenen met winsten na dat tijdstip, kan hij op het onmiddellijk daaraan voorafgaande tijdstip een
      herinvesteringsreserve in de winst opnemen en de boekwaarde van zijn bezittingen verhogen tot ten hoogste de waarde
      in het economische verkeer, behoudens voorzover die verhoging gepaard zou moeten gaan met een verhoging van de
      boekwaarde van een verplichting.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel20a
  - number: 20b.1
    text: |-
      De inspecteur stelt het bedrag van een verlies van een jaar vast bij voor bezwaar vatbare beschikking, gelijktijdig
      met het vaststellen van de aanslag over dat jaar.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel20b
  - number: 20b.2
    text: Het bedrag van het verlies wordt op het aanslagbiljet afzonderlijk vermeld.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel20b
  - number: 20b.3
    text: |-
      Indien enig feit grond oplevert voor het vermoeden dat het verlies te hoog is vastgesteld, kan de
      inspecteur de in het eerste lid bedoelde beschikking herzien bij voor bezwaar vatbare beschikking. Een
      feit dat de inspecteur bekend was of redelijkerwijs bekend had kunnen zijn, kan geen grond voor herziening
      opleveren, behoudens in de gevallen waarin de belastingplichtige ter zake van dit feit te kwader trouw is.
      __REF000___________________________________________________________________________________________________________
      ____ is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel16
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel20b
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '16'
  - number: 20b.4
    text: |-
      De in het eerste lid bedoelde beschikking wordt herzien voorzover de verrekening van het verlies ingevolge
      [artikel 15af][ref1] toekomt aan een andere belastingplichtige.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15af
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel20b
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 15af
        hoofdstuk: II
        afdeling: '2.9'
  - number: 20b.5
    text: |-
      De voorgaande leden zijn van overeenkomstige toepassing ten aanzien van de vaststelling dat
      [artikel 20, vierde lid][ref1], op het verlies van een jaar van toepassing is en de vaststelling van het in
      onderdeel b van dat lid bedoelde saldo aan het einde van het jaar waarin het verlies is geleden.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel20
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel20b
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '20'
        hoofdstuk: IV
  - number: '21.1'
    text: |-
      De verrekening van een verlies met de belastbare winst, onderscheidenlijk het Nederlandse inkomen, van een
      voorafgaand jaar geschiedt door vermindering van de aanslag bij voor bezwaar vatbare beschikking van de inspecteur.
      De beschikking wordt gegeven gelijktijdig met het vaststellen van de aanslag over het jaar waarin het verlies is
      ontstaan.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel21
  - number: '21.2'
    text: |-
      Rechtsmiddelen tegen de beschikking bedoeld in het eerste lid kunnen uitsluitend betrekking hebben op de toepassing
      van de [artikelen 20][ref1] en [20a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel20a
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '20'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 20a
        hoofdstuk: IV
  - number: '21.3'
    text: |-
      Voorafgaand aan de vermoedelijke vaststelling van de in het eerste lid bedoelde beschikking kan de inspecteur bij
      voor bezwaar vatbare beschikking volgens door Onze Minister te stellen regelen een voorlopige verliesverrekening
      verlenen tot ten hoogste het bedrag waarop de vermindering vermoedelijk zal worden vastgesteld. Een voorlopige
      verliesverrekening kan door één of meer voorlopige verliesverrekeningen worden aangevuld. Voorlopige
      verliesverrekeningen worden verrekend bij de in het eerste lid bedoelde beschikking dan wel, indien een dergelijke
      beschikking niet wordt vastgesteld, met de aanslag over het jaar waarover het verlies dat tot een voorlopige
      verliesverrekening heeft geleid, is aangegeven.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel21
  - number: 21a.1
    text: |-
      Het bedrag van een met de belastbare winst, onderscheidenlijk het Nederlandse inkomen, van een volgend jaar
      verrekend verlies wordt door de inspecteur, gelijktijdig met het vaststellen van de aanslag over dat jaar,
      vastgesteld bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel21a
  - number: 21a.2
    text: Het bedrag van het verrekende verlies wordt op het aanslagbiljet afzonderlijk vermeld.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel21a
  - number: 21a.3
    text: |-
      Rechtsmiddelen tegen de beschikking bedoeld in het eerste lid kunnen uitsluitend betrekking hebben op de toepassing
      van de [artikelen 20][ref1] en [20a][ref2], alsmede, indien geen belasting is verschuldigd, tegen de grootte van
      het verrekende bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel20a
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '20'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 20a
        hoofdstuk: IV
  - number: '22'
    text: |-
      De belasting wordt bepaald aan de hand van de volgende tabel.








                  Bij een belastbaar bedrag of een belastbaar Nederlands bedrag van meer dan


                  maar niet meer dan


                  bedraagt de belasting het in kolom III vermelde bedrag, vermeerderd met het bedrag dat wordt berekend
      door het in kolom IV vermelde percentage te nemen van het gedeelte van het belastbare bedrag, of het gedeelte van
      het belastbare Nederlandse bedrag, dat het in kolom I vermelde bedrag te boven gaat




                  I


                  II


                  III


                  IV






                  –


                  € 200 000


                  –


                  20%




                  € 200 000


                  –


                  € 40 000


                  25%
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel22
  - number: 23a.1
    text: |-
      Indien in enig jaar met betrekking tot een bij een lichaam als bedoeld in
      [artikel 19a, eerste lid, onderdeel d, van de Wet op de loonbelasting 1964][ref1] verzekerde aanspraak ingevolge
      een pensioenregeling of een regeling voor vervroegde uittreding, [artikel 19b, eerste lid, van die wet][ref2]
      toepassing vindt, wordt bij dat lichaam de door hem volgens [artikel 22][ref3] verschuldigde belasting over dat
      jaar vermeerderd met 52% van de waarde welke in het economische verkeer aan die aanspraak kan worden toegekend.
      De vorige volzin is niet van toepassing indien degene ten aanzien van wie vorenbedoeld artikel 19b, eerste lid,
      toepassing vindt, als binnenlandse belastingplichtige aan de inkomstenbelasting is onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel19b
      [ref3]: https://wetten.overheid.nl/BWBR0002672#Artikel22
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19a
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 19b
      - id: ref3
        bwb_id: BWBR0002672
        artikel: '22'
        hoofdstuk: V
  - number: 23a.2
    text: |-
      Onze Minister kan onder door hem te stellen voorwaarden bepalen dat de in het eerste lid bedoelde vermeerdering
      geheel of gedeeltelijk achterwege blijft.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel23a
  - number: 23b.1
    text: |-
      Bij een aangewezen bank of beleggingsinstelling als bedoeld in
      [artikel 5.14 van de Wet inkomstenbelasting 2001][ref1], wordt in de ingroeiperiode, bedoeld in dat
      artikel, voor elke maand van die periode de volgens [artikel 22][ref2] of krachtens [artikel 28][ref3]
      verschuldigde belasting vermeerderd met een lumpsumheffing. De lumpsumheffing wordt berekend naar
      de situatie aan het eind van de maand en bedraagt 0,2 % van het verschil tussen het van beleggers
      aangetrokken vermogen en 100/70 van hetgeen daarvan is aangewend ten behoeve van projecten als bedoeld in
      [artikel 5.14, derde lid, van de Wet inkomstenbelasting 2001][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0002672#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel23b
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: '22'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0002672
        artikel: '28'
        hoofdstuk: VII
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '5'
  - number: 23b.2
    text: |-
      Indien in enig jaar een aangewezen bank of beleggingsinstelling als bedoeld in
      [artikel 5.14 van de Wet inkomstenbelasting 2001][ref1] niet langer voldoet aan de voorwaarden gesteld voor die
      aanwijzing, wordt bij die instelling de volgens [artikel 22][ref2] of krachtens [artikel 28][ref3] verschuldigde
      belasting over dat jaar vermeerderd met een bedrag ter grootte van een in de volgende volzin aangegeven percentage
      van de waarde in het economische verkeer van het vermogen van die instelling op het tijdstip dat niet meer aan de
      voorwaarden wordt voldaan. Het in de eerste volzin bedoelde percentage bedraagt voor elke maand vanaf het niet meer
      voldoen aan de voorwaarden tot de intrekking van de aanwijzing 0,2.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0002672#Artikel28
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel23b
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: '22'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0002672
        artikel: '28'
        hoofdstuk: VII
  - number: 23c.1
    text: |-
      De op de voet van [hoofdstuk V][ref1] berekende belasting wordt verminderd wegens deelnemingsverrekening, bedoeld
      in [artikel 13aa][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002672#HoofdstukV
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel13aa
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel23c
    references:
      - id: ref1
        bwb_id: BWBR0002672
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 13aa
        hoofdstuk: II
        afdeling: '2.5'
  - number: 23c.2
    text: 'Het bedrag van de deelnemingsverrekening is het laagste van de volgende bedragen:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel23c
  - number: 23c.2.a
    text: |-
      5% van het bedrag van de gezamenlijke gebruteerde voordelen, bedoeld in [artikel 13aa, vijfde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel13aa
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel23c
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 13aa
        hoofdstuk: II
        afdeling: '2.5'
  - number: 23c.2.b
    text: |-
      het bedrag dat tot de volgens [hoofdstuk V][ref1] berekende belasting in dezelfde verhouding staat als het bedrag
      van de gezamenlijke gebruteerde voordelen nadat het is verminderd met de bij de winstbepaling van het jaar in
      aftrek gekomen kosten ter zake van de beleggingsdeelnemingen niet zijnde kwalificerende beleggingsdeelnemingen,
      staat tot het belastbare bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel23c
    references:
      - id: ref1
        bwb_id: BWBR0002672
        hoofdstuk: V
  - number: 23c.3
    text: |-
      Voor zover het bedrag van de gezamenlijke gebruteerde voordelen bestaat uit een winstuitkering, wordt voor de
      toepassing van het tweede lid, onderdeel a, ter zake van die winstuitkering op verzoek van de belastingplichtige
      geen 5% in aanmerking genomen maar het werkelijke bedrag aan winstbelasting dat daarop drukt, ingeval aan de
      volgende voorwaarden is voldaan:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel23c
  - number: 23c.3.1°
    text: |-
      het lichaam waarin de belastingplichtige een beleggingsdeelneming niet zijnde een kwalificerende
      beleggingsdeelneming heeft, is gevestigd in een lidstaat van de Europese Unie of een bij ministeriële regeling
      aangewezen staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte en is zonder
      keuzemogelijkheid en zonder er van te zijn vrijgesteld onderworpen aan de aldaar geheven belasting naar de winst,
      bedoeld in artikel 2, onderdeel a, onder iii, van Richtlijn 2011/96/EU van de Raad van 30 november 2011 betreffende
      de gemeenschappelijke fiscale regeling voor moedermaatschappijen en dochterondernemingen uit verschillende
      lidstaten (PbEU 2011, L 345/8) of aan een andere aldaar geheven belasting naar de winst;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel23c
  - number: 23c.3.2°
    text: |-
      de belastingplichtige en het lichaam waarin de belastingplichtige een beleggingsdeelneming niet zijnde een
      kwalificerende beleggingsdeelneming heeft, hebben één van de in bijlage I, deel A, bij die richtlijn opgenomen
      rechtsvormen of een rechtsvorm die vergelijkbaar is met een van de rechtsvormen die voor Nederland zijn opgenomen
      in deze bijlage;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel23c
  - number: 23c.3.3°
    text: |-
      de belastingplichtige en het lichaam waarin de belastingplichtige een beleggingsdeelneming niet zijnde een
      kwalificerende beleggingsdeelneming heeft, worden in de staat van vestiging niet geacht volgens een met een andere
      staat gesloten verdrag ter voorkoming van dubbele belasting buiten de lidstaten van de Europese Unie en de bij
      ministeriële regeling aangewezen staten die partij zijn bij de Overeenkomst betreffende de Europese Economische
      Ruimte te zijn gevestigd.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel23c
  - number: 23c.4
    text: |-
      Het werkelijke bedrag aan winstbelasting dat drukt op een winstuitkering als bedoeld in het derde lid, betreft
      belasting naar de winst waarvan de belastingplichtige aantoont dat die is toe te rekenen aan die winstuitkering
      en dat die is betaald door het lichaam waarin de belastingplichtige een beleggingsdeelneming niet zijnde een
      kwalificerende beleggingsdeelneming heeft, of door lichamen waarin het lichaam waarin de belastingplichtige een
      beleggingsdeelneming niet zijnde een kwalificerende beleggingsdeelneming heeft, een belang heeft waarbij aan de
      volgende voorwaarden wordt voldaan:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel23c
  - number: 23c.4.1°
    text: |-
      het lichaam waarin de belastingplichtige een beleggingsdeelneming niet zijnde een kwalificerende
      beleggingsdeelneming heeft, heeft een onmiddellijk of middellijk belang in het lichaam waarbij het belang in elke
      schakel ten minste 5% bedraagt;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel23c
  - number: 23c.4.2°
    text: |-
      het lichaam is gevestigd in een lidstaat van de Europese Unie of een bij ministeriële regeling aangewezen staat
      die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte en is zonder keuzemogelijkheid en
      zonder er van te zijn vrijgesteld onderworpen aan de aldaar geheven belasting naar de winst, bedoeld in artikel 2,
      onderdeel a, onder iii, van Richtlijn 2011/96/EU van de Raad van 30 november 2011 betreffende de gemeenschappelijke
      fiscale regeling voor moedermaatschappijen en dochterondernemingen uit verschillende lidstaten (PbEU 2011, L 345/8)
      of aan een andere aldaar geheven belasting naar de winst;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel23c
  - number: 23c.4.3°
    text: |-
      het lichaam heeft één van de in bijlage I, deel A, bij die richtlijn opgenomen rechtsvormen of een rechtsvorm die
      vergelijkbaar is met een van de rechtsvormen die voor Nederland zijn opgenomen in deze bijlage;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel23c
  - number: 23c.4.4°
    text: |-
      het lichaam wordt in de staat van vestiging niet geacht volgens een met een derde staat gesloten verdrag ter
      voorkoming van dubbele belasting te zijn gevestigd buiten de Europese Unie en de bij ministeriële regeling
      aangewezen staten die partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel23c
  - number: 23c.5
    text: |-
      Ingeval de bedragen aan winstuitkeringen die in een jaar zijn genoten uit hoofde van een beleggingsdeelneming niet
      zijnde een kwalificerende beleggingsdeelneming die voldoet aan de voorwaarden, bedoeld in het derde lid, in dat
      jaar niet of niet geheel in aanmerking zijn genomen voor de bepaling van het bedrag van de gezamenlijke gebruteerde
      voordelen van dat jaar maar in materieel opzicht in dat van een voorafgaand jaar (voordeel is in een voorafgaand
      jaar reeds belast), wordt het bedrag, bedoeld in het tweede lid, onderdeel a, op verzoek van belastingplichtige
      verhoogd met (100-H)/100 deel van het werkelijke bedrag aan winstbelasting dat op dat eerder belaste voordeel
      drukt voor zover dat bedrag uitgaat boven 5% van het eerder belaste gebruteerde voordeel. Daarbij staat H voor het
      percentage van het hoogste tarief, bedoeld in [artikel 22][ref1], geldend aan het einde van het jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel22
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel23c
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '22'
        hoofdstuk: V
  - number: 23c.6
    text: |-
      De vermindering ingevolge dit artikel bedraagt ten hoogste het bedrag van de op de voet van [hoofdstuk V][ref1]
      berekende belasting, verminderd met de verminderingen volgens de regelen ter voorkoming van dubbele belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel23c
    references:
      - id: ref1
        bwb_id: BWBR0002672
        hoofdstuk: V
  - number: 23c.7
    text: |-
      Voor zover in een jaar het volgens het tweede lid, onderdeel a, of het derde lid berekende bedrag door de
      toepassing van het tweede lid, onderdeel b, of het zesde lid niet leidt tot een vermindering van de volgens
      [hoofdstuk V][ref1] over dat jaar berekende belasting, wordt het overgebracht naar het volgende jaar en in dat jaar
      bij de berekening van de deelnemingsverrekening in aanmerking genomen door het toe te voegen aan het bedrag van het
      tweede lid, onderdeel a. Deze overbrenging vindt alleen plaats indien het naar het volgende jaar over te brengen
      bedrag door de inspecteur is vastgesteld bij voor bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel23c
    references:
      - id: ref1
        bwb_id: BWBR0002672
        hoofdstuk: V
  - number: 23c.8
    text: |-
      Indien enig feit grond oplevert voor het vermoeden dat het volgens het zevende lid over te brengen bedrag te hoog
      is vastgesteld, kan de inspecteur de in dat lid bedoelde beschikking herzien bij voor bezwaar vatbare beschikking.
      Een feit dat de inspecteur bekend was of redelijkerwijs bekend had kunnen zijn, kan geen grond voor herziening
      opleveren, behoudens in de gevallen waarin de belastingplichtige ter zake van dit feit te kwader trouw is.
      __REF000___________________________________________________________________________________________________________
      ____ is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel16
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel23c
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '16'
  - number: 23d.1
    text: |-
      De op de voet van [hoofdstuk V][ref1] berekende belasting wordt verminderd wegens de verrekening bij buitenlandse
      ondernemingswinsten, bedoeld in [artikel 15h][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002672#HoofdstukV
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel15h
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel23d
    references:
      - id: ref1
        bwb_id: BWBR0002672
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 15h
        hoofdstuk: II
        afdeling: 2.10a
  - number: 23d.2
    text: 'De vermindering wegens de verrekening bij buitenlandse ondernemingswinsten is het laagste van de volgende bedragen:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel23d
  - number: 23d.2.a
    text: |-
      5% van het gezamenlijke bedrag aan winst uit buitenlandse onderneming waarop de objectvrijstelling voor
      buitenlandse ondernemingswinsten geen toepassing vindt, bedoeld in [artikel 15h, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15h
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel23d
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 15h
        hoofdstuk: II
        afdeling: 2.10a
  - number: 23d.2.b
    text: |-
      het bedrag dat tot de volgens [hoofdstuk V][ref1] berekende belasting in dezelfde verhouding staat als het in
      onderdeel a bedoelde gezamenlijke bedrag aan winst uit buitenlandse onderneming, staat tot het belastbare bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel23d
    references:
      - id: ref1
        bwb_id: BWBR0002672
        hoofdstuk: V
  - number: 23d.3
    text: |-
      Op verzoek van de belastingplichtige wordt voor de toepassing van het tweede lid, onderdeel a, geen 5% van
      het aldaar bedoelde bedrag aan winst uit buitenlandse onderneming in aanmerking genomen, maar het door de
      belastingplichtige aan te tonen werkelijke bedrag aan buitenlandse winstbelasting dat ter zake van die winst is
      betaald.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel23d
  - number: 23d.4
    text: |-
      De vermindering ingevolge dit artikel bedraagt ten hoogste het bedrag van de op de voet van [hoofdstuk V][ref1]
      berekende belasting, verminderd met de verminderingen volgens de regelen ter voorkoming van dubbele belasting en
      de deelnemingsverrekening.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel23d
    references:
      - id: ref1
        bwb_id: BWBR0002672
        hoofdstuk: V
  - number: 23d.5
    text: |-
      Voor zover in een jaar het volgens het tweede lid, onderdeel a, of het derde lid berekende bedrag door de
      toepassing van het tweede lid, onderdeel b, of het vierde lid niet leidt tot een vermindering van de volgens
      [hoofdstuk V][ref1] over dat jaar berekende belasting, wordt het overgebracht naar het volgende jaar en in dat jaar
      bij de berekening van de verrekening bij buitenlandse ondernemingswinsten in aanmerking genomen door het toe te
      voegen aan het bedrag van het tweede lid, onderdeel a. Deze overbrenging vindt alleen plaats indien het naar het
      volgende jaar over te brengen bedrag door de inspecteur is vastgesteld bij voor bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel23d
    references:
      - id: ref1
        bwb_id: BWBR0002672
        hoofdstuk: V
  - number: 23d.6
    text: |-
      Indien enig feit grond oplevert voor het vermoeden dat het volgens het vijfde lid over te brengen bedrag te hoog
      is vastgesteld, kan de inspecteur de in dat lid bedoelde beschikking herzien bij voor bezwaar vatbare beschikking.
      Een feit dat de inspecteur bekend was of redelijkerwijs bekend had kunnen zijn, kan geen grond voor herziening
      opleveren, behoudens in de gevallen waarin de belastingplichtige ter zake van dit feit te kwader trouw is.
      __REF000___________________________________________________________________________________________________________
      ________ is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel16
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel23d
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '16'
  - number: '24.1'
    text: De belasting wordt geheven bij wege van aanslag.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel24
  - number: '24.2'
    text: |-
      Ingeval [artikel 15][ref1] of [artikel 15a][ref2] toepassing vindt, wordt de aanslag gesteld ten name van de
      moedermaatschappij onderscheidenlijk de centrale maatschappij.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel15a
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '15'
        hoofdstuk: II
        afdeling: '2.9'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 15a
        hoofdstuk: II
        afdeling: '2.9'
  - number: '25.1'
    text: |-
      Als voorheffingen worden aangewezen de geheven dividendbelasting, uitgezonderd de belasting die op de voet van
      [artikel 12, eerste lid, van de Wet op de dividendbelasting 1965][ref1] is geheven, en naar prijzen van kansspelen
      geheven kansspelbelasting, betrekking hebbende op bestanddelen van de winst en van het Nederlandse inkomen. De
      dividendbelasting die met toepassing van [artikel 1, zevende lid, van de Wet op de dividendbelasting 1965][ref2]
      is geheven, wordt slechts als voorheffing aangewezen voor zover de met die dividendbelasting verband houdende
      opbrengst deel uitmaakt van het Nederlandse inkomen, bedoeld in [artikel 17, derde lid][ref3]. Ten aanzien van
      een belastingplichtige die is aangemerkt als een beleggingsinstelling als bedoeld in [artikel 28][ref4], wordt de
      dividendbelasting niet als een voorheffing aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0002515#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0002515#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002672#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0002672#Artikel28
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002515
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0002515
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0002672
        artikel: '17'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0002672
        artikel: '28'
        hoofdstuk: VII
  - number: '25.2'
    text: |-
      In afwijking van het eerste lid wordt dividendbelasting niet als voorheffing in aanmerking genomen indien de
      belastingplichtige ten laste van wie de dividendbelasting is ingehouden niet tevens de uiteindelijk gerechtigde is
      tot de opbrengst waarop dividendbelasting is ingehouden. Niet als uiteindelijk gerechtigde wordt beschouwd degene
      die in samenhang met de genoten opbrengst een tegenprestatie heeft verricht als onderdeel van een samenstel van
      transacties waarbij aannemelijk is dat:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel25
  - number: 25.2.a
    text: |-
      de opbrengst geheel of gedeeltelijk direct of indirect ten goede is gekomen aan een natuurlijk persoon of
      rechtspersoon die in mindere mate gerechtigd is tot vermindering, teruggaaf of verrekening van dividendbelasting
      dan degene die de tegenprestatie heeft verricht; en
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel25
  - number: 25.2.b
    text: |-
      deze natuurlijk persoon of rechtspersoon een positie in aandelen, winstbewijzen of geldleningen als bedoeld in
      [artikel 10, eerste lid, onderdeel d][ref1], van de Wet op de vennootschapsbelasting 1969 op directe of indirecte
      wijze behoudt of verkrijgt die vergelijkbaar is met zijn positie in soortgelijke aandelen, winstbewijzen of
      geldleningen voorafgaand aan het moment waarop het samenstel van transacties een aanvang heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '10'
        hoofdstuk: II
        afdeling: '2.2'
  - number: '25.3'
    text: 'Voor de toepassing van het tweede lid:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel25
  - number: 25.3.a
    text: |-
      kan van een samenstel van transacties eveneens sprake zijn ingeval transacties zijn aangegaan op een
      gereglementeerde markt als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1] of een met een
      gereglementeerde markt als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref2] vergelijkbaar
      systeem dat gelegen of werkzaam is in een staat die niet een lidstaat is van de Europese Unie;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 25.3.b
    text: |-
      wordt met een samenstel van transacties gelijkgesteld een transactie die betrekking heeft op de enkele verwerving
      van een of meer dividendbewijzen of op de vestiging van kortlopende genotsrechten op aandelen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel25
  - number: '25.4'
    text: |-
      De dividendbelasting die op grond van [artikel 9.2, vierde lid, van de Wet inkomstenbelasting 2001][ref1] niet als
      voorheffing in aanmerking wordt genomen, wordt als voorheffing aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel9
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '9'
  - number: 25.4.a
    text: |-
      van de bank, bedoeld in [artikel 3.126a van de Wet inkomstenbelasting 2001][ref1], indien die bank een bedrag ter
      grootte van die dividendbelasting overmaakt naar de lijfrentespaarrekening van degene bij wie de dividendbelasting
      niet als voorheffing in aanmerking wordt genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 25.4.b
    text: |-
      van de beheerder van de beleggingsinstelling, bedoeld in [artikel 3.126a van de Wet inkomstenbelasting 2001][ref1],
      indien die beheerder een bedrag ter grootte van die dividendbelasting aanwendt ter verkrijging van een of meer
      geblokkeerde rechten van deelneming in die instelling ten behoeve van degene bij wie de dividendbelasting niet als
      voorheffing in aanmerking wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 25a.1
    text: |-
      Geen aanslag wordt vastgesteld, dan wel een aanslag wordt vastgesteld op nihil, en verrekening van voorheffingen
      blijft achterwege indien de berekening van de belasting niet leidt tot een positief bedrag.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel25a
  - number: 25a.2
    text: |-
      Het eerste lid is niet van toepassing ten aanzien van de belastingplichtige die binnen een door Onze Minister te
      bepalen termijn aangifte heeft gedaan. Alsdan wordt een aanslag vastgesteld en worden de voorheffingen verrekend,
      ook indien de berekening van de belasting leidt tot nihil.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel25a
  - number: '26'
    text: |-
      Ingeval [artikel 15][ref1] of [artikel 15a][ref2] toepassing vindt, kan de inspecteur in afwijking in zoverre
      van [artikel 6, eerste lid, van de Algemene wet inzake rijksbelastingen][ref3] uitsluitend de moedermaatschappij
      onderscheidenlijk de centrale maatschappij uitnodigen tot het doen van aangifte voor de vennootschapsbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel15a
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel6
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '15'
        hoofdstuk: II
        afdeling: '2.9'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 15a
        hoofdstuk: II
        afdeling: '2.9'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '6'
  - number: '27.1'
    text: |-
      De inspecteur herziet een voorlopige aanslag op verzoek voor zover die voorlopige aanslag op een ander bedrag
      is vastgesteld dan het bedrag waarop de aanslag, na verrekening van voorheffingen en reeds opgelegde voorlopige
      aanslagen, vermoedelijk zal worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel27
  - number: '27.2'
    text: |-
      Ingeval een verzoek om herziening geheel of gedeeltelijk wordt afgewezen, beslist de inspecteur bij een voor
      bezwaar vatbare beschikking, waarbij de termijn voor het instellen van bezwaar eindigt op de dag van de dagtekening
      van de aanslag waarmee de voorlopige aanslag wordt verrekend.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel27
  - number: '27.3'
    text: |-
      In afwijking van de [Algemene wet bestuursrecht][ref1] en
      [artikel 26 van de Algemene wet inzake rijksbelastingen][ref2] is een voorlopige aanslag niet voor bezwaar vatbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel26
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '26'
  - number: '27.4'
    text: |-
      In afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1] beslist de inspecteur binnen
      zes weken na ontvangst van een bezwaarschrift als bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '27.5'
    text: |-
      De voorgaande leden zijn van overeenkomstige toepassing met betrekking tot beschikkingen die afzonderlijk
      op het aanslagbiljet van de voorlopige aanslag zijn vermeld, waarbij voor de toepassing van dit artikel de
      betalingskorting, bedoeld in [artikel 27a van de Invorderingswet 1990][ref1], alsmede de belastingrente, bedoeld
      in [Hoofdstuk VA van de Algemene wet inzake rijksbelastingen][ref2], geacht worden onderdeel uit te maken van de
      voorlopige aanslag.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel27a
      [ref2]: https://wetten.overheid.nl/BWBR0002320#HoofdstukVA
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: 27a
      - id: ref2
        bwb_id: BWBR0002320
        hoofdstuk: VA
  - number: '28.1'
    text: |-
      Wij behouden Ons voor bij algemene maatregel van bestuur nadere, van de bepalingen van deze wet afwijkende, regelen
      te geven met betrekking tot de heffing van de belasting van beleggingsinstellingen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel28
  - number: '28.2'
    text: |-
      Als beleggingsinstellingen worden aangemerkt naamloze vennootschappen, besloten vennootschappen met beperkte
      aansprakelijkheid en fondsen voor gemene rekening, danwel lichamen die zijn opgericht of aangegaan naar het op
      de BES eilanden geldende recht alsmede het recht van Aruba, Curaçao, Sint Maarten, een lidstaat van de Europese
      Unie of een staat in de relatie waarmee een met Nederland gesloten verdrag ter voorkoming van dubbele belasting
      van toepassing is waarin een bepaling is opgenomen die discriminatie naar nationaliteit verbiedt voor lichamen die
      overigens in dezelfde situatie verkeren als naar Nederlands recht opgerichte of aangegane lichamen, die naar aard
      en inrichting vergelijkbaar zijn met de hiervoor genoemde naar Nederlands recht opgerichte of aangegane lichamen,
      welker doel en feitelijke werkzaamheid bestaan in het beleggen van vermogen en welke lichamen voldoen aan de
      volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel28
  - number: 28.2.a
    text: |-
      de te beleggen middelen, voor zover zij het vermogen van het lichaam te boven gaan, zijn slechts verkregen
      door het aangaan van schulden op aan het lichaam toebehorende onroerende zaken of op rechten waaraan deze zijn
      onderworpen tot ten hoogste zestig percent van de boekwaarde van de onroerende zaken of van de rechten waaraan
      deze zijn onderworpen en van andere schulden tot ten hoogste twintig percent van de boekwaarde van de overige
      beleggingen. Voor de toepassing van dit onderdeel wordt onder onroerende zaken mede verstaan belangen in met de
      beleggingsinstelling verbonden lichamen waarvan de bezittingen, geconsolideerd beschouwd, doorgaans ten minste
      nagenoeg uitsluitend bestaan uit onroerende zaken of rechten waaraan deze zijn onderworpen;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel28
  - number: 28.2.b
    text: |-
      het door Ons bij algemene maatregel van bestuur te bepalen gedeelte van de winst wordt niet later dan in de
      achtste maand na afloop van het jaar ter beschikking gesteld van aandeelhouders en houders van bewijzen van
      deelgerechtigdheid; de ter beschikking te stellen winst wordt gelijkelijk over alle aandelen en bewijzen van
      deelgerechtigdheid verdeeld;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel28
  - number: 28.2.c
    text: |-
      indien de aandelen of bewijzen van deelgerechtigdheid in dat lichaam zijn toegelaten tot de handel op een
      markt in financiële instrumenten als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1],
      of het lichaam dan wel zijn beheerder beschikt over een vergunning op grond van de [artikelen 2:65][ref2]
      of [2:69b van die wet][ref3] of daarvan is vrijgesteld op grond van de [artikelen 2:66, derde lid][ref4], of
      [2:69c, derde lid, van die wet][ref5], geldt ten aanzien van de aandelen of bewijzen van deelgerechtigdheid dat:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref5
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 28.2.c.1°
    text: het belang bij het lichaam niet voor een vierde gedeelte of meer berust bij een enkele natuurlijke persoon;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel28
  - number: 28.2.c.2°
    text: |-
      zowel van het totaal aantal aandelen of bewijzen van deelgerechtigdheid als van de aandelen of bewijzen
      van deelgerechtigdheid die bij ontbinding van het lichaam delen in de reserves van het lichaam niet
      vijfenveertig percent of meer bij een lichaam berust – niet zijnde een beleggingsinstelling als bedoeld
      in de aanhef van dit onderdeel of een instelling voor collectieve belegging in effecten als bedoeld in
      [artikel 4, vierde lid, van de Algemene wet inzake rijksbelastingen][ref1] – dat is onderworpen aan een in
      enige vorm naar de winst geheven belasting of waarvan de winst in een zodanige belasting wordt betrokken bij de
      gerechtigden tot het vermogen of tot de winst van het lichaam, dan wel bij twee of meer zodanige lichamen welke met
      elkaar zijn verbonden, waarbij mede in aanmerking worden genomen de aandelen of de bewijzen van deelgerechtigdheid
      op grond waarvan vorenbedoelde lichamen al dan niet krachtens overeenkomst met andere stemgerechtigden in de
      algemene vergadering van aandeelhouders stemrechten kunnen uitoefenen;


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel4
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '4'
  - number: 28.2.d
    text: |-
      indien de aandelen of bewijzen van deelgerechtigdheid in dat lichaam niet zijn toegelaten tot de handel op een
      markt in financiële instrumenten als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1], of
      het lichaam dan wel zijn beheerder niet beschikt over een vergunning op grond van de [artikelen 2:65][ref2] of
      [2:69b van die wet][ref3] of niet daarvan is vrijgesteld op grond van de [artikelen 2:66, derde lid][ref4], of
      [2:69c, derde lid, van die wet][ref5], geldt ten aanzien van de aandelen of bewijzen van deelgerechtigdheid dat:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref5
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 28.2.d.1°
    text: |-
      er geen natuurlijke personen zijn die een aanmerkelijk belang hebben in het lichaam in de zin van
      [afdeling 4.3 van de Wet inkomstenbelasting 2001][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Afdeling4.3
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0011353
        afdeling: '4.3'
  - number: 28.2.d.2°
    text: |-
      zowel van het totaal aantal aandelen of bewijzen van deelgerechtigdheid als van de aandelen of bewijzen van
      deelgerechtigheid die bij ontbinding van het lichaam delen in de reserves van het lichaam drie vierde gedeelte
      of meer bij natuurlijke personen berust, bij lichamen die niet zijn onderworpen aan een in enige vorm naar de
      winst geheven belasting of daarvan zijn vrijgesteld en waarvan de winst niet in een zodanige belasting wordt
      betrokken bij de gerechtigden tot het vermogen of tot de winst van het lichaam, dan wel direct of indirect bij
      beleggingsinstellingen waarvan de aandelen of bewijzen van deelgerechtigdheid voldoen aan de voorwaarden, bedoeld
      in onderdeel c;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel28
  - number: 28.2.e
    text: |-
      het belang bij het lichaam berust niet door tussenkomst van niet in Nederland gevestigde fondsen voor gemene
      rekening en vennootschappen welker kapitaal geheel of ten dele in aandelen is verdeeld, voor een vierde gedeelte of
      meer bij in Nederland gevestigde lichamen;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel28
  - number: 28.2.f
    text: |-
      in de in onderdeel c, aanhef, bedoelde situatie zijn bestuurders van het lichaam alsmede meer dan de helft van de
      leden van de raad van commissarissen van het lichaam niet tevens bestuurder of commissaris van een ander lichaam
      bij wie al dan niet tezamen met een verbonden lichaam ten minste één vierde gedeelte of meer berust van de aandelen
      of bewijzen van deelgerechtigdheid in het lichaam en staan evenmin in dienstbetrekking tot dat andere lichaam, met
      dien verstande dat deze voorwaarde niet geldt ingeval dat andere lichaam een beleggingsinstelling is als bedoeld in
      onderdeel c.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel28
  - number: '28.3'
    text: |-
      Voor de toepassing van dit artikel en de daarop berustende bepalingen wordt bij een lichaam onder het beleggen van
      vermogen mede verstaan:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel28
  - number: 28.3.a
    text: |-
      het houden van aandelen in alsmede het besturen van een ander lichaam waarvan doel en feitelijke werkzaamheid,
      afgezien van het eventueel beleggen van vermogen, bestaan uit het ontwikkelen van vastgoed ten behoeve van zichzelf
      of ten behoeve van:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel28
  - number: 28.3.a.1°
    text: het lichaam;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel28
  - number: 28.3.a.2°
    text: met het lichaam verbonden lichamen die als beleggingsinstelling zijn aangemerkt, of
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel28
  - number: 28.3.a.3°
    text: lichamen waarin het lichaam of een onder 2° bedoeld lichaam een belang heeft van ten minste een derde gedeelte;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel28
  - number: 28.3.b
    text: |-
      het investeren in een verbetering of uitbreiding van vastgoed, ingeval de investering minder bedraagt dan 30% van
      de WOZ-waarde van dat vastgoed, bedoeld in [artikel 3.30a van de Wet inkomstenbelasting 2001][ref1], voorafgaande
      aan de aanvang van de werkzaamheden;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 28.3.c
    text: |-
      het verstrekken van garanties ten behoeve van met de beleggingsinstelling verbonden lichamen waarvan de
      bezittingen, geconsolideerd beschouwd, doorgaans ten minste nagenoeg uitsluitend bestaan uit onroerende zaken of
      rechten waaraan deze zijn onderworpen;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel28
  - number: 28.3.d
    text: |-
      het uitlenen van gelden die van derden zijn ingeleend aan met de beleggingsinstelling verbonden lichamen waarvan
      de bezittingen, geconsolideerd beschouwd, doorgaans ten minste nagenoeg uitsluitend bestaan uit onroerende zaken of
      rechten waaraan deze zijn onderworpen;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel28
  - number: 28.3.e
    text: |-
      het houden van aandelen in alsmede het besturen van een of meer andere lichamen waarvan doel en feitelijke
      werkzaamheid, afgezien van het eventueel beleggen van vermogen, bestaan uit het verrichten van bijkomstige
      werkzaamheden die een rechtstreeks verband houden met beleggingen in vastgoed van het lichaam of van de lichamen,
      genoemd in onderdeel a, onder 2° en 3°, mits:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel28
  - number: 28.3.e.1°
    text: |-
      de waarde van de aandelen in de andere lichamen, bedoeld in de aanhef, niet meer bedraagt dan 15% van het eigen
      vermogen van het lichaam;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel28
  - number: 28.3.e.2°
    text: |-
      de omzet uit bijkomstige werkzaamheden, bedoeld in de aanhef, niet meer bedraagt dan 25% van de behaalde omzet uit
      de beleggingen, bedoeld in de aanhef, in het vastgoed waarvoor de werkzaamheden worden verricht; en
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel28
  - number: 28.3.e.3°
    text: de bezittingen van de andere lichamen, bedoeld in de aanhef, geheel met eigen vermogen zijn gefinancierd.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel28
  - number: '28.4'
    text: |-
      In de in het derde lid, onderdeel d, bedoelde situatie worden voor de toepassing van het tweede lid, onderdeel a,
      bij de beleggingsinstelling de van derden ingeleende gelden en de daarmee verband houdende vorderingen op verbonden
      lichamen buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel28
  - number: '28.5'
    text: |-
      Onze Minister kan in bijzondere gevallen onder door hem te stellen voorwaarden afwijkingen toestaan van het
      bepaalde in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel28
  - number: '28.6'
    text: |-
      Met ingang van het jaar dat een lichaam wordt aangemerkt als een vrijgestelde beleggingsinstelling als bedoeld in
      [artikel 6a][ref1] vindt dit artikel geen toepassing meer.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel6a
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 6a
        hoofdstuk: I
  - number: 28a.1
    text: |-
      Bij een omzetting op de voet van [artikel 18 van Boek 2 van het Burgerlijk Wetboek][ref1] van een rechtspersoon
      in een andere rechtsvorm, anders dan van een naamloze vennootschap in een besloten vennootschap met beperkte
      aansprakelijkheid of omgekeerd dan wel van een vereniging in een stichting of omgekeerd, wordt:


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel18
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '18'
  - number: 28a.1.a
    text: de rechtspersoon geacht te zijn geliquideerd;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel28a
  - number: 28a.1.b
    text: |-
      het vermogen van de rechtspersoon geacht te zijn uitgekeerd aan de deelgerechtigden tot dat vermogen naar de mate
      van hun gerechtigdheid, en
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel28a
  - number: 28a.1.c
    text: het vermogen van de andere rechtsvorm geacht daarin te zijn ingebracht.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel28a
  - number: 28a.2
    text: Het eerste lid is mede van toepassing voor de heffing van de inkomstenbelasting en de dividendbelasting.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel28a
  - number: 28a.3
    text: |-
      Onze Minister kan op verzoek, onder door hem te stellen voorwaarden, de inspecteur toestaan afwijkingen toe te
      staan van het eerste en het tweede lid. De inspecteur beslist op het verzoek bij voor bezwaar vatbare beschikking
      waarin de in de vorige volzin bedoelde voorwaarden zijn opgenomen. De voorwaarden mogen slechts strekken ter
      verzekering van de heffing en de invordering van de belastingen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel28a
  - number: 28b.1
    text: |-
      Indien de belastingplichtige een negatief valutaresultaat uit hoofde van een deelneming ten laste van
      de winst brengt, of heeft gebracht, en dit negatieve valutaresultaat daadwerkelijk in het jaar of enig
      voorafgaand jaar ten laste van de winst komt, of is gekomen, vindt in het jaar, in afwijking in zoverre van
      [artikel 13, eerste lid][ref1], de deelnemingsvrijstelling geen toepassing op opgekomen positieve valutaresultaten
      uit hoofde van deelnemingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel13
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '13'
        hoofdstuk: II
        afdeling: '2.5'
  - number: 28b.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op een positief valutaresultaat uit hoofde van een deelneming die
      direct of indirect is verkregen van een verbonden lichaam voor zover bij dat lichaam de deelnemingsvrijstelling
      geen toepassing zou hebben gevonden.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel28b
  - number: 28b.3
    text: |-
      Ingeval met betrekking tot een deelneming een valutaresultaat ten laste van de winst is gekomen, wordt een
      nadien op de voet van [artikel 13d][ref1] berekend liquidatieverlies met betrekking tot die deelneming slechts
      in aanmerking genomen voor zover dit verlies het bedrag van de per saldo ten laste van de winst gekomen
      valutaresultaten uit hoofde van die deelneming te boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel13d
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 13d
        hoofdstuk: II
        afdeling: '2.5'
  - number: 28b.4
    text: |-
      Het eerste lid is niet van toepassing op een positief valutaresultaat als dit resultaat indien het negatief was
      geweest niet ten laste van de winst gebracht zou kunnen worden.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel28b
  - number: '29'
    text: 'Wij behouden Ons voor bij algemene maatregel van bestuur:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel29
  - number: 29.a
    text: |-
      nadere regelen te geven met betrekking tot het bepalen van de winst van verzekeringsondernemingen, waaronder
      regelen met betrekking tot bij deze ondernemingen toelaatbaar te achten reserves, alsmede
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel29
  - number: 29.b
    text: andere in het kader van de wet passende nadere regelen te geven ter aanvulling van in de wet geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel29
  - number: '30'
    text: |-
      Voor de berekening van het in [artikel 13d][ref1] bedoelde liquidatieverlies wordt bij het begin van het eerste
      jaar waarover de winst volgens deze wet wordt bepaald het bedrag dat voor de verkrijging van een deelneming is
      opgeofferd niet hoger gesteld dan de boekwaarde aan het einde van het laatste jaar waarover de winst volgens het
      Besluit op de Vennootschapsbelasting 1942 is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel13d
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 13d
        hoofdstuk: II
        afdeling: '2.5'
  - number: '31'
    text: |-
      Indien de belasting wordt geheven over een jaar dat aanvangt voor de datum van inwerkingtreding van een wijziging
      van [artikel 22][ref1] en op of na die datum eindigt, wordt deze in afwijking in zoverre van dat artikel berekend
      volgens de formule: belasting = (X/B x To) + (Y/B x Tn), waarin: X voorstelt: het aantal voor de datum van
      inwerkingtreding van de wijziging vallende dagen van dat jaar; Y voorstelt: het aantal na de datum onmiddellijk
      voorafgaande aan de datum van inwerkingtreding van de wijziging vallende dagen van dat jaar; B voorstelt: het
      totale aantal dagen van dat jaar; To voorstelt: de verschuldigde belasting op de voet van [artikel 22][ref2],
      zoals dat luidt op de datum onmiddellijk voorafgaande aan de datum van inwerkingtreding van de wijziging; Tn
      voorstelt: de verschuldigde belasting op de voet van [artikel 22][ref3], zoals dat luidt met ingang van de datum
      van inwerkingtreding van de wijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0002672#Artikel22
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '22'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0002672
        artikel: '22'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0002672
        artikel: '22'
        hoofdstuk: V
  - number: 31a
    text: |-
      [Artikel I, onderdeel E, van hoofdstuk 2 van de Invoeringswet Wet inkomstenbelasting 2001](onbekend) vindt
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel31a
  - number: 31b
    text: |-
      [Artikel I, onderdelen H en G, van hoofdstuk 2 van de Invoeringswet Wet inkomstenbelasting 2001](onbekend) vinden
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel31b
  - number: 31c
    text: |-
      [Artikel I, onderdeel J, vierde lid, van hoofdstuk 2 van de Invoeringswet Wet inkomstenbelasting 2001](onbekend) is
      van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel31c
  - number: 31d.1
    text: |-
      Indien de belastingplichtige ten gevolge van de wijziging met ingang van 1 januari 2004 van de Wet op de
      vennootschapsbelasting 1969 met ingang van die datum bij de waardering van een pensioenverplichting moet
      overgaan op een ander waarderingsstelsel of op de hantering van een andere overlevingstafel of een andere
      leeftijdsterugstelling, wordt zolang de verplichting nog bestaat en de waarde van die verplichting ten gevolge
      van die wijziging uitkomt op een bedrag dat lager is dan de volgens het tweede lid gecorrigeerde waarde van de
      in aanmerking genomen waarde aan het einde van het laatste jaar waarin het oude stelsel of de eerder toegepaste
      overlevingstafel of leeftijdsterugstelling nog toepassing vond, de gecorrigeerde waarde in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel31d
  - number: 31d.2
    text: |-
      De in aanmerking genomen waarde aan het einde van het laatste jaar waarin het oude stelsel of de eerder toegepaste
      overlevingstafel of leeftijdsterugstelling nog toepassing vond, wordt verlaagd met de sedert 1 januari 2004 gedane
      uitkeringen ingevolge de in het eerste lid bedoelde pensioenverplichting en met de sedert dat tijdstip aan derden
      betaalde premies of koopsommen voor zover die betrekking hebben op de pensioenverplichting.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel31d
  - number: '32'
    text: |-
      Indien in het kader van een bedrijfsfusie artikel VII van de Wet van 28 december 1989, *Stb.* 601, tot invoering in
      de inkomstenbelasting en de vennootschapsbelasting van een investeringsaftrek voor investeringen van een beperkte
      omvang en intrekking van de Wet investeringsrekening toepassing vindt, vindt [artikel 14, vierde lid][ref1],
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel14
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '14'
        hoofdstuk: II
        afdeling: '2.6'
  - number: '33.1'
    text: |-
      Indien immateriële activa die bij een publiekrechtelijke rechtspersoon of een lichaam als bedoeld in
      [artikel 2, zevende lid, eerste volzin,][ref1] deel uitmaken van vermogen waarmee geen belastbare winst
      wordt behaald omdat het niet wordt aangewend in het kader van de uitoefening van een bedrijf als bedoeld in
      [artikel 2, derde lid][ref2], op enig tijdstip bij dezelfde rechtspersoon of hetzelfde lichaam of bij een verbonden
      lichaam deel gaan uitmaken van vermogen waarmee belastbare winst wordt behaald, worden zij op dat tijdstip te boek
      gesteld voor de in het derde tot en met vijfde lid bedoelde waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel2
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002672
        artikel: '2'
        hoofdstuk: I
  - number: '33.2'
    text: |-
      Indien immateriële activa die bij een vereniging of stichting die op de voet van de [Woningwet][ref1] bij
      koninklijk besluit is toegelaten als instelling die in het belang van de volkshuisvesting werkzaam is, deel
      uitmaken van vermogen waarmee geen belastbare winst wordt behaald, op enig tijdstip bij hetzelfde lichaam of bij
      een verbonden lichaam deel gaan uitmaken van vermogen waarmee belastbare winst wordt behaald, worden zij op dat
      tijdstip te boek gesteld voor de in het derde tot en met vijfde lid bedoelde waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005181
  - number: '33.3'
    text: |-
      Ingeval de activa bij dezelfde rechtspersoon of hetzelfde lichaam gaan behoren tot vermogen waarmee belastbare
      winst wordt behaald, vindt de teboekstelling plaats voor de waarde die zou gelden als de activa bij de
      rechtspersoon of het lichaam altijd hadden behoord tot vermogen waarmee belastbare winst wordt behaald en op die
      activa was afgeschreven volgens [artikel 3.30 van de Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '33.4'
    text: |-
      Ingeval de activa bij een verbonden lichaam gaan behoren tot vermogen waarmee belastbare winst wordt behaald, vindt
      de teboekstelling bij dat verbonden lichaam plaats voor nihil.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel33
  - number: '33.5'
    text: |-
      In afwijking van het derde lid vindt de teboekstelling plaats voor nihil indien de activa door de rechtspersoon
      of het lichaam zijn verkregen van een ten tijde van de verkrijging verbonden lichaam en de vervreemding bij dat
      verbonden lichaam niet heeft geleid tot belastbare winst.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel33
  - number: 33a.1
    text: |-
      Voor een recht dat periodieke uitkeringen of verstrekkingen oplevert (stamrecht) waarop het met ingang van
      1 januari 1992 vervallen artikel 19 van de Wet op de inkomstenbelasting 1964, dan wel het met ingang van die
      datum vervallen artikel 44j, derde lid, van die wet is toegepast, blijft het met ingang van die datum vervallen
      [artikel 23a][ref1] van kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel23a
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 23a
        hoofdstuk: V
  - number: 33a.2
    text: Het eerste lid is niet van toepassing indien het stamrecht is bedongen vóór 1 januari 1973.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel33a
  - number: 33b.1
    text: |-
      Bij de aanwezigheid van een op basis van een regeling ter voorkoming van dubbele belasting naar een jaar dat
      aanvangt op of na 1 januari 2012 over te brengen bedrag aan negatieve buitenlandse winst uit een staat, vindt de
      objectvrijstelling voor buitenlandse ondernemingswinsten, bedoeld in [artikel 15e][ref1], met betrekking tot de
      positieve buitenlandse winst uit die staat van dat jaar en van de daaropvolgende jaren, geen toepassing tot in
      totaal een bedrag gelijk aan dat van het over te brengen bedrag aan negatieve buitenlandse winst.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15e
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel33b
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 15e
        hoofdstuk: II
        afdeling: 2.10a
  - number: 33b.2
    text: 'Het eerste lid vindt geen toepassing voor zover:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel33b
  - number: 33b.2.a
    text: |-
      met het bedrag aan negatieve buitenlandse winst al rekening is gehouden bij de toepassing van [artikel 13c][ref1],
      zoals dat luidde op 31 december 2011;


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel13c
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel33b
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 13c
        hoofdstuk: II
        afdeling: '2.5'
  - number: 33b.2.b
    text: |-
      de belastingplichtige aannemelijk maakt dat het bedrag aan negatieve buitenlandse winst heeft geleid tot een
      verlies dat vanwege de in [artikel 20, tweede lid][ref1], opgenomen termijnen niet meer verrekenbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel20
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel33b
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '20'
        hoofdstuk: IV
  - number: 33b.3
    text: |-
      Het eerste lid vindt geen toepassing indien de belastingplichtige is opgehouden winst uit de in dat lid bedoelde
      andere staat te genieten, de belastingplichtige niet binnen drie jaren na het tijdstip waarop hij is opgehouden
      winst uit die andere staat te genieten weer winst uit die andere staat is gaan genieten en voldaan is aan de
      voorwaarden van [artikel 15i, tweede, derde en vierde lid][ref1], voor het in aftrek kunnen brengen van een
      stakingsverlies.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15i
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel33b
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 15i
        hoofdstuk: II
        afdeling: 2.10a
  - number: 33b.4
    text: |-
      Op verzoek van de belastingplichtige wordt, bij toepassing van het eerste lid in enig jaar, het daarna nog
      resterende bedrag aan negatieve buitenlandse winst uit een staat door de inspecteur bij voor bezwaar vatbare
      beschikking vastgesteld. Rechtsmiddelen tegen een dergelijke beschikking kunnen alleen betrekking hebben op de
      mutaties in het nog resterende bedrag ten opzichte van de daaraan voorafgaande vaststelling van het bedrag. Een
      bij voor bezwaar vatbare beschikking vastgesteld resterend bedrag aan negatieve buitenlandse winst kan worden
      herzien indien dit wijziging ondergaat als gevolg van de verrekening van verliezen of het opleggen van een
      navorderingsaanslag over enig jaar, dan wel indien enig feit grond oplevert voor het vermoeden dat het bedrag te
      laag is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel33b
  - number: 33b.5
    text: |-
      [Artikel 13c][ref1], zoals dat luidde op 31 december 2011, blijft van toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel13c
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel33b
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 13c
        hoofdstuk: II
        afdeling: '2.5'
  - number: 33b.5.a
    text: |-
      met betrekking tot een deelneming in een lichaam dat een onderneming drijft die voordien als een buitenlandse
      onderneming werd gedreven door de belastingplichtige of een met hem verbonden lichaam, indien verliezen uit die
      buitenlandse onderneming voorafgaand aan het eerste jaar dat aanvangt op of na 1 januari 2012 in mindering zijn
      gekomen op de in Nederland belastbare winst;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel33b
  - number: 33b.5.b
    text: |-
      met betrekking tot een deelneming, indien de belastingplichtige via deze deelneming een belang heeft van ten minste
      vijf percent in een lichaam als bedoeld in onderdeel a.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel33b
  - number: 33b.6
    text: |-
      Bij de toepassing van het vijfde lid blijven de [artikelen 2, vierde lid][ref1], [10a, vierde lid][ref2],
      [13ba, zevende lid][ref3], [13d, tweede lid, onderdeel b][ref4], en [18, eerste lid][ref5], zoals deze luidden op
      31 december 2011, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel10a
      [ref3]: https://wetten.overheid.nl/BWBR0002672#Artikel13ba
      [ref4]: https://wetten.overheid.nl/BWBR0002672#Artikel13d
      [ref5]: https://wetten.overheid.nl/BWBR0002672#Artikel18
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel33b
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 10a
        hoofdstuk: II
        afdeling: '2.2'
      - id: ref3
        bwb_id: BWBR0002672
        artikel: 13ba
        hoofdstuk: II
        afdeling: '2.5'
      - id: ref4
        bwb_id: BWBR0002672
        artikel: 13d
        hoofdstuk: II
        afdeling: '2.5'
      - id: ref5
        bwb_id: BWBR0002672
        artikel: '18'
        hoofdstuk: III
  - number: 33c.1
    text: |-
      Een bij een belastingplichtige met betrekking tot een laagbelaste buitenlandse beleggingsonderneming als
      bedoeld in [artikel 15g][ref1], op basis van een regeling ter voorkoming van dubbele belasting naar een jaar dat
      aanvangt op of na 1 januari 2012 over te brengen bedrag aan te verrekenen belasting, wordt voor de toepassing van
      [artikel 23d][ref2] aangemerkt als een naar dat jaar over te brengen bedrag als bedoeld in het vijfde lid van dat
      artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15g
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel23d
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel33c
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 15g
        hoofdstuk: II
        afdeling: 2.10a
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 23d
        hoofdstuk: Va
  - number: 33c.2
    text: |-
      Een bij een belastingplichtige met betrekking tot een laagbelaste buitenlandse beleggingsonderneming als bedoeld
      in [artikel 15g][ref1], op basis van een regeling ter voorkoming van dubbele belasting naar een jaar dat aanvangt
      op of na 1 januari 2012 over te brengen bedrag aan negatieve buitenlandse winst, wordt voor de toepassing van
      [artikel 23d, tweede lid, onderdeel a, en derde lid][ref2], in dat jaar en de daaropvolgende jaren, in mindering
      gebracht op het gezamenlijke bedrag aan winst uit buitenlandse onderneming van die jaren, doch niet verder dan tot
      nihil, tot in totaal het over te brengen bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15g
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel23d
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel33c
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 15g
        hoofdstuk: II
        afdeling: 2.10a
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 23d
        hoofdstuk: Va
  - number: 33c.3
    text: 'Het tweede lid vindt geen toepassing voor zover:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel33c
  - number: 33c.3.a
    text: |-
      met het bedrag aan negatieve buitenlandse winst al rekening is gehouden bij de toepassing van [artikel 13c][ref1],
      zoals dat luidde op 31 december 2011;


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel13c
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel33c
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 13c
        hoofdstuk: II
        afdeling: '2.5'
  - number: 33c.3.b
    text: |-
      de belastingplichtige aannemelijk maakt dat het bedrag aan negatieve buitenlandse winst heeft geleid tot een
      verlies dat vanwege de in [artikel 20, tweede lid][ref1], opgenomen termijnen niet meer verrekenbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel20
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel33c
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '20'
        hoofdstuk: IV
  - number: 33c.4
    text: |-
      [Artikel 33b, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel33b
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel33c
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 33b
        hoofdstuk: VIII
  - number: 33d.1
    text: |-
      Voor de bepaling van het stakingsverlies uit een staat, bedoeld in [artikel 15i, tweede lid][ref1], worden mede als
      op de voet van [artikel 15e][ref2] in aanmerking genomen bedragen aan winst uit die staat beschouwd de positieve
      bedragen aan buitenlandse winst uit die staat die de belastingplichtige in de vijf jaren voorgaande aan het eerste
      jaar dat aanvangt op of na 1 januari 2012 heeft genoten. De eerste volzin vindt geen toepassing voor zover een
      positief bedrag aan buitenlandse winst uit een staat is verrekend met een negatief bedrag aan winst uit die staat
      van een ander jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15i
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel15e
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel33d
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 15i
        hoofdstuk: II
        afdeling: 2.10a
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 15e
        hoofdstuk: II
        afdeling: 2.10a
  - number: 33d.2
    text: |-
      Voor zover als gevolg van [artikel 33b, eerste lid][ref1], de objectvrijstelling voor buitenlandse
      ondernemingswinsten, bedoeld in [artikel 15e][ref2], niet van toepassing is op positieve buitenlandse winst uit een
      staat, wordt deze winst niet in aanmerking genomen bij de bepaling van het stakingsverlies uit die staat, bedoeld
      in [artikel 15i, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel33b
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel15e
      [ref3]: https://wetten.overheid.nl/BWBR0002672#Artikel15i
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel33d
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 33b
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 15e
        hoofdstuk: II
        afdeling: 2.10a
      - id: ref3
        bwb_id: BWBR0002672
        artikel: 15i
        hoofdstuk: II
        afdeling: 2.10a
  - number: '34.1'
    text: |-
      Indien een lichaam binnen tien jaar na een herkapitalisatie als bedoeld in artikel 58 van de Wet op de
      inkomstenbelasting 1964, zoals dit artikel ten tijde van de herkapitalisatie luidde, de herkapitalisatie
      door een verkleining van het gestorte kapitaal geheel of gedeeltelijk ongedaan maakt, wordt de volgens de
      [artikelen 22][ref1], [23a][ref2] en [23b][ref3] of krachtens [artikel 28][ref4] berekende belasting over het jaar
      waarin die kapitaalsverkleining plaats vindt vermeerderd met 50% van die kapitaalsverkleining.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel23a
      [ref3]: https://wetten.overheid.nl/BWBR0002672#Artikel23b
      [ref4]: https://wetten.overheid.nl/BWBR0002672#Artikel28
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '22'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 23a
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0002672
        artikel: 23b
        hoofdstuk: V
      - id: ref4
        bwb_id: BWBR0002672
        artikel: '28'
        hoofdstuk: VII
  - number: '34.2'
    text: |-
      Onder verkleining van het gestorte kapitaal wordt verstaan teruggaaf van hetgeen op aandelen is gestort, nadat
      tevoren de algemene vergadering van aandeelhouders tot deze teruggaaf heeft besloten en de nominale waarde van de
      desbetreffende geplaatste aandelen bij statutenwijziging met een gelijk bedrag is verminderd, zomede onmiddellijke
      of middellijke verwerving van eigen aandelen. Het bedrag van de kapitaalsverkleining wordt gesteld op het bedrag
      van de teruggaaf, onderscheidenlijk het bedrag van het op de verworven aandelen nominaal gestorte kapitaal.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel34
  - number: '34.3'
    text: |-
      Over het jaar waarin de herkapitalisatie geheel ongedaan wordt gemaakt, wordt de volgens het eerste lid
      verschuldigde belasting verhoogd tot 50% van de kapitaalsvergroting bij die herkapitalisatie.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel34
  - number: '34.4'
    text: |-
      De volgens het vervallen [artikel 23][ref1] en volgens dit artikel verschuldigde belasting beloopt over een tijdvak
      van tien jaar ten hoogste 50% van de kapitaalsvergroting waarop artikel 58 van de Wet op de inkomstenbelasting
      1964, zoals dit artikel ten tijde van de herkapitalisatie luidde, is toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel23
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '23'
        hoofdstuk: V
  - number: '34.5'
    text: Onze Minister kan afwijkingen toestaan van het bepaalde in de eerste drie leden.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel34
  - number: 34a
    text: |-
      De dividendbelasting die op grond van [artikel 10bis.5, achtste lid, van de Wet inkomstenbelasting 2001][ref1]
      niet als voorheffing in aanmerking wordt genomen, wordt mede als voorheffing als bedoeld in [artikel 25][ref2]
      aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel10bis
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel25
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: 10bis
      - id: ref2
        bwb_id: BWBR0002672
        artikel: '25'
        hoofdstuk: VI
  - number: 34a.a
    text: |-
      van de bank, bedoeld in [artikel 10bis.5 van de Wet inkomstenbelasting 2001][ref1], indien die bank een bedrag
      ter grootte van die dividendbelasting overmaakt naar de spaarrekening eigen woning van degene bij wie de
      dividendbelasting niet als voorheffing in aanmerking wordt genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel10bis
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: 10bis
  - number: 34a.b
    text: |-
      van de beheerder van de beleggingsinstelling, bedoeld in [artikel 10bis.5 van de Wet inkomstenbelasting 2001][ref1],
      indien die beheerder een bedrag ter grootte van die dividendbelasting aanwendt ter verkrijging van een of meer
      geblokkeerde rechten van deelneming in die instelling ten behoeve van degene bij wie de dividendbelasting niet als
      voorheffing in aanmerking wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel10bis
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: 10bis
  - number: 34b.1
    text: |-
      Met betrekking tot op 31 december 2013 bestaande aanspraken op periodieke uitkeringen ter vervanging
      van gederfd of te derven loon als bedoeld in de [artikelen 11, eerste lid, onderdeel g][ref1],
      en [37 van de Wet op de loonbelasting 1964][ref2], zoals die op 31 december 2013 luidden, blijft
      [artikel 23a, tweede lid][ref3], zoals dat op 31 december 2013 luidde, met overeenkomstige toepassing van
      [artikel 39f, eerste en tweede lid, van de Wet op de loonbelasting 1964][ref4], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0002672#Artikel23a
      [ref4]: https://wetten.overheid.nl/BWBR0002471#Artikel39f
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel34b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '37'
      - id: ref3
        bwb_id: BWBR0002672
        artikel: 23a
        hoofdstuk: V
      - id: ref4
        bwb_id: BWBR0002471
        artikel: 39f
  - number: 34b.2
    text: |-
      Met betrekking tot op 31 december 2013 bestaande stamrechtspaarrekeningen en stamrechtbeleggingsrechten als
      bedoeld in [artikel 11a van de Wet op de loonbelasting 1964][ref1], zoals dat op 31 december 2013 luidde,
      blijft artikel [25, vierde lid][ref2], zoals dat op 31 december 2013 luidde, met overeenkomstige toepassing van
      [artikel 39f, eerste en tweede lid, van de Wet op de loonbelasting 1964][ref3], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11a
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel39f
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel34b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 11a
      - id: ref2
        bwb_id: BWBR0002672
        artikel: '25'
        hoofdstuk: VI
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 39f
  - number: '35'
    text: |-
      [Artikel 16, derde lid][ref1], vervalt met ingang van 1 januari 2018, met dien verstande dat dit voor het eerst
      toepassing vindt met betrekking tot boekjaren die aanvangen op of na 1 januari 2018.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel16
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '16'
        hoofdstuk: II
        afdeling: '2.11'
  - number: '37.1'
    text: |-
      Het Besluit op de Vennootschapsbelasting 1942 (*Verord.bl.* 51), het Invoeringsbesluit Vennootschapsbelasting
      1942 (*Stcrt.* 85, verbeterd bij publikatie in *Stcrt.* 90 en 94), het besluit van de secretaris-generaal
      van het Departement van Financiën van 3 juni 1942 (*Stcrt.* 113) tot wijziging van het Invoeringsbesluit
      Vennootschapsbelasting 1942, de verordening van de Rijkscommissaris voor het bezette Nederlandse gebied van 26 juni
      1943 (*Verord.bl.* 60), houdende wijziging van het Besluit op de Vennootschapsbelasting 1942 en van de Zegelwet, en
      het Besluit op de Winstbelasting 1940 (*Verord.bl.* 83), vervallen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel37
  - number: '37.2'
    text: De Wet op de Dividend- en Tantièmebelasting 1917 (*Stb.* 1918, 4) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel37
  - number: '37.3'
    text: |-
      Het Besluit op de Commissarissenbelasting 1941 (*Verord.bl.* 106) en het besluit van de secretaris-generaal
      van het Departement van Financiën van 10 augustus 1942 (*Verord.bl.* 97) tot wijziging van het Besluit op de
      Commissarissenbelasting 1941 vervallen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel37
  - number: '37.4'
    text: |-
      De in het eerste en het tweede lid bedoelde regelingen blijven van toepassing met betrekking tot jaren voorafgaande
      aan die waarop deze wet van toepassing is. De in het derde lid bedoelde regeling blijft van toepassing met
      betrekking tot commissarisloon dat voor de toepassing van het Besluit op de Vennootschapsbelasting 1942 als
      bedrijfskosten wordt beschouwd.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel37
  - number: '37.5'
    text: |-
      [Hoofdstuk IV][ref1] is voor zoveel nodig mede van toepassing op naar de bepalingen van het Besluit op de
      Vennootschapsbelasting 1942 te berekenen verliezen, winsten en binnenlandse inkomens.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002672
        hoofdstuk: IV
  - number: '39.1'
    text: |-
      Deze wet treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin zij
      is geplaatst.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel39
  - number: '39.3'
    text: 'Deze wet kan worden aangehaald als: Wet op de vennootschapsbelasting 1969.'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel39
