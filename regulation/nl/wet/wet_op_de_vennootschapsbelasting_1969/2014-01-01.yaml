        artikel: '12'
  - number: 2.7.f
    text: |-
      lichamen die een bedrijf uitoefenen als bedoeld in het derde lid, tweede volzin, met uitzondering van lichamen die
      uitsluitend of nagenoeg uitsluitend water leveren;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel2
  - number: 2.7.g
    text: NOB Holding N.V.;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel2
  - number: 2.7.h
    text: de N.V. Luchthaven Schiphol;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel2
  - number: 2.7.i
