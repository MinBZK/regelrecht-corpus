    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel2
  - number: 2.7.n
    text: ABN AMRO Group N.V.;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel2
  - number: 2.7.o
    text: de Nederlandse Investeringsbank voor Ontwikkelingslanden N.V.;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel2
  - number: 2.7.p
    text: Ultra Centrifuge Nederland N.V.;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel2
  - number: 2.7.q
    text: SNS REAAL N.V.;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel2
  - number: '2.8'
    text: |-
      Voor de toepassing van deze wet worden op de BES eilanden gevestigde lichamen die door de toepassing van
      [artikel 5.2 van de Belastingwet BES][ref1] geacht worden niet op de BES eilanden te zijn gevestigd, geacht in
      Nederland te zijn gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel5
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '5'
  - number: '2.9'
    text: |-
      Op schriftelijk verzoek en onder door Onze Minister te stellen voorwaarden staat de inspecteur toe dat een lichaam
      als bedoeld in het eerste lid, onderdeel e, geacht wordt zijn onderneming te drijven met behulp van zijn gehele
      vermogen, indien het lichaam als culturele instelling is aangemerkt. Het verzoek moet uiterlijk binnen zes maanden
      na afloop van het jaar waarop het verzoek voor het eerst betrekking heeft, worden ingediend bij de inspecteur.
      De inspecteur beslist op het verzoek bij voor bezwaar vatbare beschikking waarin de door Onze Minister te stellen
      voorwaarden zijn opgenomen. Bij inwilliging van het verzoek geldt dit tot wederopzegging door het lichaam, waarbij
      wederopzegging alleen mogelijk is met ingang van het tiende jaar of een veelvoud daarvan na het einde van het jaar
      waarvoor het verzoek voor het eerst is ingewilligd.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel2
  - number: '3.1'
    text: 'Als buitenlandse belastingplichtigen zijn aan de belasting onderworpen de niet in Nederland gevestigde:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel3
  - number: 3.1.a
    text: verenigingen en andere rechtspersonen;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel3
  - number: 3.1.b
    text: |-
      open commanditaire vennootschappen en andere niet rechtspersoonlijkheid bezittende vennootschappen welker kapitaal
      geheel of ten dele in aandelen is verdeeld;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel3
  - number: 3.1.c
    text: doelvermogens;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel3
  - number: 3.1.d
    text: |-
      maar op Aruba, Curaçao of Sint Maarten gevestigde lichamen die een onderneming drijven met behulp van een vaste
      inrichting op de BES eilanden of een vaste vertegenwoordiger op de BES eilanden;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel3
  - number: '3.2'
    text: |-
      In afwijking in zoverre van het eerste lid zijn lichamen die vergelijkbaar zijn met een naar Nederlands recht
      opgerichte vereniging of stichting als bedoeld in [artikel 2, eerste lid, onderdeel e][ref1], of die een
      kerkgenootschap zijn, slechts aan de belasting onderworpen voor zover zij een onderneming drijven. Artikel 2,
      negende lid, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel2
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '2'
        hoofdstuk: I
  - number: '4'
    text: |-
      Onder het drijven van een onderneming als bedoeld in [artikel 2, eerste lid, onderdeel e][ref1] en in
      [artikel 3, tweede lid][ref2], wordt mede verstaan:


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel3
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002672
        artikel: '3'
        hoofdstuk: I
  - number: 4.a
    text: |-
      een uiterlijk daarmee overeenkomende werkzaamheid waardoor in concurrentie wordt getreden
      met ondernemingen, gedreven door natuurlijke personen, dan wel door lichamen, vermeld in
      [artikel 2, eerste lid, onderdelen a, b, c en d][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel2
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '2'
        hoofdstuk: I
  - number: 4.b
    text: |-
      een werkzaamheid die bestaat uit de verzorging van werknemers of gewezen werknemers, van hun echtgenoten of
      gewezen echtgenoten, dan wel hun partners of gewezen partners en van hun kinderen of pleegkinderen door middel
      van uitkeringen op grond van een regeling voor vervroegde uittreding (VUT-uitkeringen) of pensioen, uit het
      verzekeren van dergelijke uitkeringen, dan wel uit het verzekeren van lijfrenten of kapitaalsuitkeringen uit
      levensverzekering.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel4
  - number: '5.1'
    text: |-
      Wij behouden Ons voor bij algemene maatregel van bestuur onder daarbij te stellen voorwaarden van de belasting vrij
      te stellen:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel5
  - number: 5.1.a
    text: |-
      lichamen welker bezittingen uitsluitend of hoofdzakelijk bestaan uit op de voet van de [Natuurschoonwet 1928][ref1]
      (*Stb.* 1989, 252) aangewezen landgoederen, welker werkzaamheden ten minste hoofdzakelijk bestaan uit de
      instandhouding van die landgoederen en welker overige werkzaamheden niet kunnen worden aangemerkt als het drijven
      van een onderneming;


      [ref1]: https://wetten.overheid.nl/BWBR0001939
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001939
  - number: 5.1.b
    text: |-
      lichamen welke zich uitsluitend of nagenoeg uitsluitend ten doel stellen de verzorging van werknemers en gewezen
      werknemers bij invaliditeit en ouderdom en de verzorging van hun echtgenoten en gewezen echtgenoten, dan wel
      partners en gewezen partners en van hun kinderen en pleegkinderen die de leeftijd van 30 jaar nog niet hebben
      bereikt, een en ander door middel van pensioen krachtens een pensioenregeling of van uitkeringen krachtens een
      regeling voor vervroegde uittreding, behoudens voorzover zij voordelen behalen uit bij algemene maatregel van
      bestuur aangewezen werkzaamheden die niet rechtstreeks verband houden met het uitvoeren van bedoelde regelingen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel5
  - number: 5.1.c
    text: 'lichamen welke uitsluitend of nagenoeg uitsluitend werkzaamheden verrichten welke bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel5
  - number: 5.1.c.1°
    text: |-
      het genezen, verplegen of verzorgen van zieken, kraamvrouwen, mensen met een verstandelijke of lichamelijke
      beperking, wezen of ouderen die niet meer zelfstandig kunnen wonen;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel5
  - number: 5.1.c.2°
    text: het bieden van een passende werkzaamheid aan mensen met een verstandelijke of lichamelijke beperking; dan wel
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel5
  - number: 5.1.c.3°
    text: het verstrekken van kleine kredieten aan personen, behorende tot de economisch zwakke groepen van de bevolking;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel5
  - number: 5.1.d
    text: |-
      lichamen welke werkzaam zijn op het gebied van de landbouw, van de verzekering tegen schade op onderlinge grondslag
      of van de verzorging van uitvaarten, mits bij deze lichamen het streven naar winst, hetzij geheel ontbreekt, hetzij
      van bijkomstige betekenis is;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel5
  - number: 5.1.e
    text: |-
      ziekenhuisverplegingsfondsen en ziektekostenverzekeringsmaatschappijen, voor zover zij geen winst beogen of maken
      anders dan voor instellingen ten bate van de volksgezondheid;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel5
  - number: 5.1.f
    text: |-
      instellingen welke krachtens de wet zijn toegelaten of erkend als draagster van risico met betrekking tot
      publiekrechtelijk geregelde verzekeringen, uitsluitend of nagenoeg uitsluitend risico’s verzekeren krachtens de
      sociale-verzekeringswetten met uitzondering van de [Zorgverzekeringswet][ref1] en geen andere onderneming drijven
      dan een verzekeringsonderneming;


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: 5.1.g
    text: |-
      lichamen welker werkzaamheid uitsluitend of nagenoeg uitsluitend bestaat uit het in stand houden van openbare
      leeszalen en bibliotheken.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel5
  - number: '5.2'
    text: 'Het eerste lid, onderdeel b, is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel5
  - number: 5.2.a
    text: |-
      naamloze vennootschappen, besloten vennootschappen met beperkte aansprakelijkheid en andere vennootschappen welker
      kapitaal geheel of ten dele in aandelen is verdeeld waarin een werknemer of gewezen werknemer, zijn echtgenoot of
      partner, een van hun bloed- of aanverwanten in de rechte lijn of in de tweede graad van de zijlijn, dan wel een van
      hun pleegkinderen al dan niet tezamen voor ten minste tien percent van het nominaal gestorte kapitaal, onmiddellijk
      of middellijk, aandeelhouder is;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel5
  - number: 5.2.b
    text: |-
      andere dan de onder a bedoelde lichamen waarvan de werkzaamheid hoofdzakelijk bestaat in de uitvoering van
      pensioenregelingen of van regelingen voor vervroegde uittreding van werknemers of gewezen werknemers van naamloze
      vennootschappen, besloten vennootschappen met beperkte aansprakelijkheid of andere vennootschappen welker
      kapitaal geheel of ten dele in aandelen is verdeeld waarin deze werknemers of gewezen werknemers, hun echtgenoten
      of partners, hun bloed- of aanverwanten in de rechte lijn of in de tweede graad van de zijlijn, dan wel hun
      pleegkinderen al dan niet tezamen voor ten minste tien percent van het nominaal gestorte kapitaal, onmiddellijk of
      middellijk, aandeelhouder zijn of op enig moment zijn geweest.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel5
  - number: '5.3'
    text: |-
      Voor de toepassing van het eerste lid, onderdeel b, wordt onder een pensioenregeling of een regeling voor
      vervroegde uittreding verstaan:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel5
  - number: 5.3.a
    text: |-
      een zodanige regeling in de zin van [artikel 1 van de Pensioenwet][ref1] respectievelijk de wettelijke bepalingen
      betreffende de loonbelasting, dan wel een buitenlandse regeling welke daarmee naar aard en strekking overeenkomt;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '1'
  - number: 5.3.b
    text: |-
      een pensioenregeling waaraan deelneming verplicht is op grond van de
      [Wet verplichte deelneming in een bedrijfstakpensioenfonds 2000][ref1], de Wet op het notarisambt of de
      [Wet verplichte beroepspensioenregeling][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012092
      [ref2]: https://wetten.overheid.nl/BWBR0018831
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012092
      - id: ref2
        bwb_id: BWBR0018831
  - number: '5.4'
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is voorgelegd.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel5
  - number: '5.5'
    text: |-
      Voor de toepassing van het eerste lid, aanhef en onderdeel b, worden met
      werknemers gelijkgesteld: deelnemers aan een pensioenregeling als bedoeld in
      [artikel 1.7, tweede lid, onderdeel b, van de Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel1
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '1'
  - number: '6.1'
    text: |-
      Lichamen als bedoeld in [artikel 2, eerste lid, onderdeel e][ref1], en [artikel 3, tweede lid][ref2], zijn met
      betrekking tot een jaar van de belasting vrijgesteld, indien de winst van het jaar – opgevat overeenkomstig
      [hoofdstuk II][ref3] van deze wet met uitzondering van [artikel 9a][ref4] en [artikel 12][ref5] – niet meer
      bedraagt dan € 15 000, dan wel van het jaar en de daaraan voorafgaande vier jaren tezamen niet meer bedraagt dan
      € 75 000. Indien in een jaar verlies geleden wordt, wordt de winst voor dat jaar gesteld op nihil.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002672#HoofdstukII
      [ref4]: https://wetten.overheid.nl/BWBR0002672#Artikel9a
      [ref5]: https://wetten.overheid.nl/BWBR0002672#Artikel12
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002672
        artikel: '3'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0002672
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0002672
        artikel: 9a
        hoofdstuk: II
        afdeling: '2.2'
      - id: ref5
        bwb_id: BWBR0002672
        artikel: '12'
        hoofdstuk: II
        afdeling: '2.2'
  - number: '6.2'
    text: |-
      Het eerste lid is niet van toepassing ten aanzien van lichamen die een werkzaamheid verrichten als bedoeld in
      [artikel 4, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel4
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '4'
        hoofdstuk: I
  - number: '6.3'
    text: |-
      Op verzoek van een lichaam bepaalt de inspecteur bij voor bezwaar vatbare beschikking dat dit lichaam, in afwijking
      van het eerste lid, niet van de belasting is vrijgesteld. Het verzoek moet uiterlijk binnen zes maanden na afloop
      van het jaar waarop het verzoek betrekking heeft, worden ingediend bij de inspecteur.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel6
  - number: '6.4'
    text: |-
      Bij inwilliging van het verzoek, bedoeld in het derde lid, geldt dit tot wederopzegging door het lichaam, waarbij
      wederopzegging alleen mogelijk is met ingang van het vijfde jaar of een veelvoud daarvan na het einde van het jaar
      waarvoor het verzoek voor het eerst is ingewilligd.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel6
  - number: 6a.1
    text: |-
      Van de belasting wordt op verzoek vrijgesteld een beleggingsinstelling, welker doel en feitelijke werkzaamheid
      bestaat uit de belegging van gelden of andere goederen en die uitsluitend belegt in financiële instrumenten, met
      toepassing van het beginsel van risicospreiding, waarbij de aandelen of bewijzen van deelgerechtigdheid (rechten
      van deelneming) op verzoek van de deelnemers ten laste van de activa van de instelling direct of indirect worden
      ingekocht of terugbetaald (vrijgestelde beleggingsinstelling).
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel6a
  - number: 6a.2
    text: |-
      Het eerste lid vindt slechts toepassing indien de beleggingsinstelling een naamloze vennootschap of een fonds voor
      gemene rekening is, of een lichaam dat is opgericht of aangegaan naar het op de BES eilanden geldende recht dan wel
      het recht van Aruba, Curaçao, Sint Maarten, een lidstaat van de Europese Unie of een staat in de relatie waarmee
      een met Nederland gesloten verdrag ter voorkoming van dubbele belasting van toepassing is waarin een bepaling is
      opgenomen die discriminatie naar nationaliteit verbiedt voor lichamen die overigens in dezelfde situatie verkeren
      als naar Nederlands recht opgerichte of aangegane lichamen, die naar aard en inrichting vergelijkbaar is met het
      hiervoor genoemde naar Nederlands recht opgerichte of aangegane lichaam.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel6a
  - number: 6a.3
    text: |-
      Voor de toepassing van dit artikel wordt onder een beleggingsinstelling verstaan een lichaam waarin ter collectieve
      belegging gevraagde of verkregen gelden of andere goederen zijn of worden opgenomen teneinde de deelnemers in de
      opbrengst van de beleggingen te doen delen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel6a
  - number: 6a.4
    text: 'Voor de toepassing van dit artikel worden onder financiële instrumenten verstaan:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel6a
  - number: 6a.4.a
    text: |-
      financiële instrumenten als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1], met uitzondering
      van zaken en rechten als omschreven in [artikel 17a, onderdelen a en b][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel17a
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 17a
        hoofdstuk: III
  - number: 6a.4.b
    text: banktegoeden.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel6a
  - number: 6a.5
    text: Een lichaam wordt uitsluitend met ingang van een jaar als vrijgestelde beleggingsinstelling aangemerkt.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel6a
  - number: 6a.6
    text: |-
      Het verzoek, bedoeld in het eerste lid, wordt uiterlijk ingediend in het jaar met ingang waarvan het lichaam als
      vrijgestelde beleggingsinstelling wil worden aangemerkt. De inspecteur beslist op het verzoek bij voor bezwaar
      vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel6a
  - number: 6a.7
    text: |-
      Indien een lichaam in de loop van een jaar niet langer voldoet aan de voorwaarden voor vrijstelling van de
      belasting, wordt het lichaam met ingang van dat jaar bij een voor bezwaar vatbare beschikking van de inspecteur
      niet meer als vrijgestelde beleggingsinstelling aangemerkt.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel6a
  - number: 6a.8
    text: |-
      Op verzoek van de vrijgestelde beleggingsinstelling wordt zij niet meer als zodanig aangemerkt. Het verzoek,
      bedoeld in de eerste volzin, moet zijn ingediend voorafgaande aan het jaar met ingang waarvan het lichaam niet meer
      als vrijgestelde beleggingsinstelling wil worden aangemerkt. De inspecteur beslist op het verzoek bij voor bezwaar
      vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel6a
  - number: '7.1'
    text: Ten aanzien van binnenlandse belastingplichtigen wordt de belasting geheven naar het belastbare bedrag.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel7
  - number: '7.2'
    text: |-
      Het belastbare bedrag is de in een jaar genoten belastbare winst verminderd met de op de voet van
      [Hoofdstuk IV][ref1] te verrekenen verliezen.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002672
        hoofdstuk: IV
  - number: '7.3'
    text: Belastbare winst is de winst verminderd met de aftrekbare giften.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel7
  - number: '7.4'
    text: |-
      Onder jaar wordt verstaan boekjaar, dan wel, zo de belastingplichtige niet regelmatig boekhoudt met
      geregelde jaarlijkse afsluitingen, kalenderjaar. Indien de belastingplichtige in de loop van het boekjaar als
      dochtermaatschappij deel gaat uitmaken of ophoudt deel uit te maken van een fiscale eenheid als bedoeld in
      [artikel 15, eerste lid][ref1], wordt het gedeelte van dat boekjaar waarin de belastingplichtige geen deel uitmaakt
      van die fiscale eenheid als afzonderlijk jaar aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '15'
        hoofdstuk: II
        afdeling: '2.9'
  - number: '7.5'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld in welke gevallen de inspecteur onder door hem te stellen
      voorwaarden de belastingplichtige op zijn verzoek kan toestaan het belastbare bedrag te berekenen in een andere
      geldeenheid dan de euro. Daarbij wordt onder meer aangegeven tegen welke koers de in de wetgeving opgenomen
      bedragen in euro’s worden omgerekend in de andere geldeenheid en tegen welke koers het in de andere geldeenheid
      berekende belastbare bedrag wordt omgerekend in euro’s. De inspecteur beslist op het verzoek bij voor bezwaar
      vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel7
  - number: '8.1'
    text: |-
      De winst wordt opgevat en bepaald op de voet van de [artikelen 3.8][ref1],
      [3.11][ref2] en [3.12][ref3], [3.13, eerste lid, onderdelen a, g, h en i][ref4],
      [3.14, eerste lid, onderdelen b tot en met h, en tweede tot en met zesde lid][ref5], [3.21 tot en met 3.30][ref6],
      [3.30a, eerste tot en met zevende lid][ref7], [3.31 tot en met 3.54][ref8], [3.55 tot en met 3.57][ref9],
      [10.10][ref10], [10a.2][ref11] en [10a.3 van de Wet inkomstenbelasting 2001][ref12], waarbij voor ondernemer wordt
      gelezen belastingplichtige.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref7]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref8]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref9]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref10]: https://wetten.overheid.nl/BWBR0011353#Artikel10
      [ref11]: https://wetten.overheid.nl/BWBR0011353#Artikel10a
      [ref12]: https://wetten.overheid.nl/BWBR0011353#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref6
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref7
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref8
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref9
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref10
        bwb_id: BWBR0011353
        artikel: '10'
      - id: ref11
        bwb_id: BWBR0011353
        artikel: 10a
      - id: ref12
        bwb_id: BWBR0011353
        artikel: 10a
  - number: '8.2'
    text: 'Het eerste lid is niet van toepassing voorzover:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel8
  - number: 8.2.a
    text: |-
      bij of krachtens deze wet of krachtens [artikel 3.65 van de Wet inkomstenbelasting 2001][ref1] anders is bepaald;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 8.2.b
    text: |-
      [artikel 3.53 van de Wet inkomstenbelasting 2001][ref1] betrekking heeft op de vorming van een oudedagsreserve;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 8.2.c
    text: uit het verschil in wezen tussen de belastingplichtige en een natuurlijk persoon het tegendeel voortvloeit.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel8
  - number: '8.3'
    text: |-
      Indien een onderneming niet voor rekening van de belastingplichtige wordt gedreven, maar de belastingplichtige,
      anders dan als aandeelhouder, medegerechtigd is tot het vermogen van die onderneming, wordt de winst van die
      onderneming rechtstreeks door de belastingplichtige genoten.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel8
  - number: '8.4'
    text: |-
      [Artikel 3.13, eerste lid, onderdeel a, van de Wet inkomstenbelasting 2001][ref1] is niet van toepassing indien
      de belastingplichtige deel heeft uitgemaakt van een fiscale eenheid en sinds het ontvoegingstijdstip minder dan 6
      jaren zijn verstreken, behoudens voorzover de belastingplichtige aannemelijk maakt dat de in dat onderdeel bedoelde
      voordelen niet tot zijn winst zouden behoren, indien hij geen deel zou hebben uitgemaakt van de fiscale eenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '8.5'
    text: |-
      Bij aanwezigheid in een jaar van een of meer werknemers in de zin van de
      [Wet op de loonbelasting 1964][ref1] wordt de winst mede opgevat en bepaald op de voet van
      [artikel 3.15, eerste, tweede, derde en vijfde lid, van de Wet inkomstenbelasting 2001][ref2]. Daarbij
      wordt voor de toepassing van genoemd eerste lid het aldaar vermelde bedrag vervangen door 0,4% van het
      gezamenlijke bedrag van het door de desbetreffende werknemers in het jaar genoten belastbare loon in de zin
      van [artikel 9 van de Wet op de loonbelasting 1964][ref3] indien deze uitkomst hoger is dan € 4400. Indien de
      belastingplichtige daarvoor bij de aangifte kiest, wordt voor de toepassing van de tweede volzin tot het loon niet
      gerekend het loon uit een vroegere dienstbetrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0002471
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel9
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002471
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0002471
        artikel: '9'
  - number: '8.6'
    text: |-
      Ingeval de belastingplichtige een lichaam is als bedoeld in
      [artikel 19a, eerste lid, onderdeel d, van de Wet op de loonbelasting 1964][ref1] geldt voor de waardering
      van pensioenverplichtingen, in aanvulling op [artikel 3.29 van de Wet inkomstenbelasting 2001][ref2], dat de
      verplichting niet hoger mag worden gewaardeerd dan volgens een stelsel dat correspondeert met een methode die bij
      verzekeraars als bedoeld in [artikel 19a, eerste lid, onderdeel b, van de Wet op de loonbelasting 1964][ref3] bij
      een belangrijk deel van de pensioenovereenkomsten als uitgangspunt dient voor de bepaling van de premies ingevolge
      die overeenkomsten. Voorts geldt als aanvulling dat bij de waardering van de verplichting geen overlevingstafel
      kan worden gehanteerd waarin rekening is gehouden met verwachtingen omtrent toekomstige levensverwachtingen
      en kan een leeftijdsterugstelling alleen worden toegepast ter correctie van het verschil tussen de gehanteerde
      overlevingstafel en een overlevingstafel van recentere datum.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19a
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 19a
  - number: 8.6a
    text: |-
      Voor de toepassing van [artikel 3.30a van de Wet inkomstenbelasting 2001][ref1] wordt verstaan onder:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 8.6a.a
    text: |-
      een met de belastingplichtige verbonden lichaam: hetgeen daaronder wordt verstaan in
      [artikel 10a, vierde lid, en zesde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 10a
        hoofdstuk: II
        afdeling: '2.2'
  - number: 8.6a.b
    text: |-
      een met de belastingplichtige verbonden persoon: een natuurlijke persoon voor wie de belastingplichtige een
      verbonden lichaam is als bedoeld in [artikel 3.30a, tiende lid, van de Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '8.7'
    text: |-
      [Artikel 3.53, eerste lid, onderdeel a, van de Wet inkomstenbelasting 2001][ref1] is niet van
      toepassing op kosten en lasten in verband met een regeling voor vervroegde uittreding als bedoeld in
      [artikel 32ba van de Wet op de loonbelasting 1964][ref2] ten behoeve van werknemers als bedoeld in
      [artikel 12a van die wet][ref3]. Een voorziening ter zake van een zodanige regeling voor vervroegde uittreding voor
      bedoelde werknemers is niet mogelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel32ba
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel12a
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 32ba
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 12a
  - number: '8.8'
    text: |-
      Voor de toepassing van de [artikelen 3.40 tot en met 3.46 van de Wet inkomstenbelasting 2001][ref1] worden niet in
      aanmerking genomen verplichtingen aangegaan door een vennootschap welker kapitaal geheel of ten dele in aandelen
      is verdeeld:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 8.8.a
    text: ter zake van de verwerving van een onderneming of een gedeelte van een onderneming tegen uitreiking van aandelen;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel8
  - number: 8.8.b
    text: |-
      tegenover een persoon die of een lichaam dat voor ten minste een derde gedeelte van het nominaal gestorte kapitaal
      onmiddellijk of middellijk aandeelhouder is of in de loop van de laatste vijf jaren is geweest in die vennootschap;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel8
  - number: 8.8.c
    text: |-
      tegenover een andere vennootschap welker kapitaal geheel of ten dele in aandelen is verdeeld, indien hetzij
      de belastingplichtige in die vennootschap, hetzij een derde in beide vennootschappen voor ten minste een derde
      gedeelte van het nominaal gestorte kapitaal onmiddellijk of middellijk aandeelhouder is of in de loop van de
      laatste vijf jaren is geweest.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel8
  - number: '8.9'
    text: |-
      De [artikelen 3.40 tot en met 3.46 van de Wet inkomstenbelasting 2001][ref1] zijn niet van toepassing ten aanzien
      van lichamen welke als beleggingsinstelling zijn aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '8.10'
    text: |-
      Voor de toepassing van [artikel 3.47 van de Wet inkomstenbelasting 2001][ref1] worden aan het einde van het jaar,
      voorafgaande aan dat met ingang waarvan een lichaam als beleggingsinstelling wordt aangemerkt, de goederen van zulk
      een lichaam geacht te zijn vervreemd voor de waarde in het economische verkeer van die goederen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '8.11'
    text: Onze Minister kan bepalen dat het achtste lid niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel8
  - number: '8.12'
    text: |-
      [Artikel 3.55 van de Wet inkomstenbelasting 2001][ref1] vindt geen toepassing ingeval de aandelen of winstbewijzen
      die worden vervreemd behoren tot het vermogen van een lichaam dat als beleggingsinstelling is aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '8.13'
    text: |-
      Voor de toepassing van [artikel 3.54 van de Wet inkomstenbelasting 2001][ref1], wordt een deelneming als bedoeld in
      [artikel 13][ref2] niet tot de bedrijfsmiddelen gerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel13
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: '13'
        hoofdstuk: II
        afdeling: '2.5'
  - number: '8.14'
    text: |-
      Het in het vijfde lid aan het slot vermelde bedrag wordt bij het begin van het kalenderjaar van rechtswege
      vervangen door het bedrag dat krachtens [artikel 10.1 van de Wet inkomstenbelasting 2001][ref1] wordt vastgesteld
      ter vervanging van het in [artikel 3.15, eerste lid, van die wet][ref2] vermelde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '8.15'
    text: |-
      Voor de toepassing van de [artikelen 8c][ref1], [10a][ref2], [12a][ref3], [13b][ref4], [13ba][ref5], [20a][ref6],
      [25][ref7] en [28][ref8] zijn de [artikelen 2.14a][ref9] en [10a.7 van de Wet inkomstenbelasting 2001][ref10] van
      overeenkomstige toepassing, met dien verstande dat artikel 2.14a, zevende lid, van de Wet inkomstenbelasting 2001
      voor de toepassing van artikel 10a buiten toepassing blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel8c
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel10a
      [ref3]: https://wetten.overheid.nl/BWBR0002672#Artikel12a
      [ref4]: https://wetten.overheid.nl/BWBR0002672#Artikel13b
      [ref5]: https://wetten.overheid.nl/BWBR0002672#Artikel13ba
      [ref6]: https://wetten.overheid.nl/BWBR0002672#Artikel20a
      [ref7]: https://wetten.overheid.nl/BWBR0002672#Artikel25
      [ref8]: https://wetten.overheid.nl/BWBR0002672#Artikel28
      [ref9]: https://wetten.overheid.nl/BWBR0011353#Artikel2
      [ref10]: https://wetten.overheid.nl/BWBR0011353#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 8c
        hoofdstuk: II
        afdeling: '2.2'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 10a
        hoofdstuk: II
        afdeling: '2.2'
      - id: ref3
        bwb_id: BWBR0002672
        artikel: 12a
        hoofdstuk: II
        afdeling: '2.2'
      - id: ref4
        bwb_id: BWBR0002672
        artikel: 13b
        hoofdstuk: II
        afdeling: '2.5'
      - id: ref5
        bwb_id: BWBR0002672
        artikel: 13ba
        hoofdstuk: II
        afdeling: '2.5'
      - id: ref6
        bwb_id: BWBR0002672
        artikel: 20a
        hoofdstuk: IV
      - id: ref7
        bwb_id: BWBR0002672
        artikel: '25'
        hoofdstuk: VI
      - id: ref8
        bwb_id: BWBR0002672
        artikel: '28'
        hoofdstuk: VII
      - id: ref9
        bwb_id: BWBR0011353
        artikel: '2'
      - id: ref10
        bwb_id: BWBR0011353
        artikel: 10a
  - number: 8a
    text: |-
      Tot de winst behoort niet het bedrag waarmee de af te dragen dividendbelasting ingevolge
      [artikel 11, eerste lid, van de Wet op de dividendbelasting 1965][ref1] is verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0002515#Artikel11
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0002515
        artikel: '11'
  - number: 8b.1
    text: |-
      Indien een lichaam, onmiddellijk of middellijk, deelneemt aan de leiding van of het toezicht op, dan wel in het
      kapitaal van een ander lichaam en tussen deze lichamen ter zake van hun onderlinge rechtsverhoudingen voorwaarden
      worden overeengekomen of opgelegd (verrekenprijzen) die afwijken van voorwaarden die in het economische verkeer
      door onafhankelijke partijen zouden zijn overeengekomen, wordt de winst van die lichamen bepaald alsof die
      laatstbedoelde voorwaarden zouden zijn overeengekomen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel8b
  - number: 8b.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing indien een zelfde persoon, onmiddellijk of middellijk, deelneemt
      aan de leiding van of aan het toezicht op, dan wel in het kapitaal van het ene en het andere lichaam.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel8b
  - number: 8b.3
    text: |-
      De in het eerste en tweede lid bedoelde lichamen nemen in hun administratie gegevens op waaruit blijkt op welke
      wijze de in dat lid bedoelde verrekenprijzen tot stand zijn gekomen en waaruit kan worden opgemaakt of er met
      bettrekking tot de totstandgekomen verrekenprijzen sprake is van voorwaarden die in het economische verkeer door
      onafhankelijke partijen zouden zijn overeengekomen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel8b
  - number: 8c.1
    text: |-
      Bij het bepalen van de winst blijven buiten aanmerking de door de belastingplichtige van onderscheidenlijk aan
      lichamen of natuurlijke personen die behoren tot het concern waarvan de belastingplichtige deel uitmaakt, ontvangen
      en betaalde:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel8c
  - number: 8c.1.a
    text: renten ter zake van rechtens dan wel in feite direct of indirect samenhangende geldleningen, of
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel8c
  - number: 8c.1.b
    text: |-
      royalty's ter zake van rechtens dan wel in feite direct of indirect samenhangende rechtsverhoudingen, indien door
      de belastingplichtige met betrekking tot die geldleningen of rechtsverhoudingen per saldo geen reële risico's
      worden gelopen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel8c
  - number: 8c.2
    text: |-
      Een belastingplichtige wordt met betrekking tot samenhangende geldleningen geacht reële risico's te lopen indien
      het eigen vermogen dat passend is ter dekking van de risico's ten minste bedraagt het laagste van de volgende
      bedragen:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel8c
  - number: 8c.2.a
    text: 1% van het bedrag van de uitstaande geldleningen, of
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel8c
  - number: 8c.2.b
    text: € 2 000 000.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel8c
  - number: 8c.3
    text: |-
      Onverminderd het bepaalde in het eerste lid, wordt tot de winst van de belastingplichtige gerekend een met
      inachtneming van [artikel 8b][ref1] te bepalen vergoeding voor de door de belastingplichtige uitgeoefende functies
      die betrekking hebben op de samenhangende geldleningen of rechtsverhoudingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel8b
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel8c
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 8b
        hoofdstuk: II
        afdeling: '2.2'
  - number: 8c.4
    text: |-
      Onder een concern wordt verstaan: de belastingplichtige tezamen met de
      met hem verbonden lichamen en verbonden natuurlijke personen, bedoeld in
      [artikel 10a, vierde lid in verbinding met het zesde lid, onderscheidenlijk vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel8c
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 10a
        hoofdstuk: II
        afdeling: '2.2'
  - number: 8d
    text: |-
      Bij het bepalen van de winst blijven buiten aanmerking de subsidies, bedoeld in
      [artikel 71a, eerste lid, van de Woningwet][ref1], ontvangen door verenigingen en stichtingen die op de voet van de
      [Woningwet][ref2] bij koninklijk besluit zijn toegelaten als instellingen die in het belang van de volkshuisvesting
      werkzaam zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel71a
      [ref2]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel8d
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 71a
      - id: ref2
        bwb_id: BWBR0005181
  - number: '9.1'
    text: 'Bij het bepalen van de winst komen mede in aftrek:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel9
  - number: 9.1.a
    text: aandelen in de winst aan bestuurders en verder personeel toegekend ter zake van in de onderneming verrichte arbeid;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel9
  - number: 9.1.b
    text: |-
      aandelen in de winst welke de tegenprestatie vormen voor het verlenen van een concessie of een licentie op een
      octrooi, of voor een andere, soortgelijke prestatie, zoals leveringen of aankopen, mits deze aandelen in de winst
      niet aan oprichters, aandeelhouders, leden, deelnemers of deelgerechtigden als zodanig zijn opgekomen;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel9
  - number: 9.1.c
    text: aandelen in de winst van een verzekeringsonderneming welke aan verzekerden krachtens hun verzekering toekomen;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel9
  - number: 9.1.d
    text: oprichtingskosten, alsmede kosten van wijziging van het kapitaal;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel9
  - number: 9.1.e
    text: |-
      het gedeelte van de winst van een open commanditaire vennootschap dat toekomt aan de voor het geheel aansprakelijke
      vennoten als zodanig;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel9
  - number: 9.1.f
    text: |-
      bij de in [artikel 2, eerste lid, onderdeel g][ref1], bedoelde ondernemingen van publiekrechtelijke rechtspersonen:
      een door Onze Minister te bepalen redelijke rente berekend over het vermogen bij het begin van het jaar;


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel2
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '2'
        hoofdstuk: I
  - number: 9.1.g
    text: |-
      uitdelingen van een coöperatie of van een vereniging op coöperatieve grondslag uit de daartoe beschikbare over het
      jaar genoten winst, naar de maatstaf van de door of jegens de leden in dat jaar verrichte prestaties - daaronder
      niet begrepen kapitaalverstrekking door leden als zodanig - tot ten hoogste het bedrag van het op de voet van het
      tweede lid bepaalde gedeelte van de over het jaar genoten winst, voor zover die uitdelingen zijn toegekend aan
      leden, natuurlijke personen;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel9
  - number: 9.1.h
    text: |-
      bij een algemeen nut beogende instelling en bij een lichaam dat een sociaal belang behartigt en de winst
      hoofdzakelijk behaalt met behulp van arbeid die door natuurlijke personen om niet of naar een loon dat in
      belangrijke mate lager is dan hetgeen in het economische verkeer gebruikelijk is, wordt verricht (vrijwilligers):
      de kosten die met betrekking tot vrijwilligers aftrekbaar zouden zijn indien hun beloning plaats zou vinden op
      basis van het minimumloon, verminderd met de werkelijke kosten.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel9
  - number: '9.2'
    text: |-
      Het in het eerste lid, onderdeel g, bedoelde gedeelte is het deel dat zich tot het geheel van de over het jaar
      genoten winst verhoudt als het gedeelte van de totale kosten van de coöperatie of de vereniging op coöperatieve
      grondslag over het jaar dat betrekking heeft op door of jegens de leden verrichte prestaties, zich verhoudt
      tot die totale kosten, met dien verstande dat het aldus berekende deel wordt vermeerderd met € 2269 tot ten
      hoogste het bedrag van die winst. Bij de berekening van het gedeelte van de totale kosten komen als door de leden
      geleverde zaken slechts in aanmerking die welke door hen in eigen onderneming zijn voortgebracht, komen aan de
      leden geleverde zaken, indien zij door de coöperatie of de vereniging op coöperatieve grondslag zelf vervaardigd
      zijn, slechts in aanmerking tot de daarin verwerkte grondstoffen en komen als op zaken betrekking hebbende kosten
      uitsluitend in aanmerking die welke aan de leveranciers zelf ten goede zijn gekomen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel9
  - number: '9.3'
    text: |-
      Voorzover een lichaam als bedoeld in het eerste lid, onderdeel h, aannemelijk maakt dat in het economische verkeer
      met betrekking tot een in dat onderdeel bedoelde persoon een hoger loon dan het minimumloon gebruikelijk is, worden
      de daar bedoelde aftrekbare kosten berekend op basis van dat hogere loon.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel9
  - number: '9.4'
    text: |-
      De kosten, bedoeld in het eerste lid, onderdeel h, komen slechts in aftrek indien het lichaam deze in zijn
      administratie heeft gespecificeerd naar de in dat onderdeel bedoelde personen onder opgave van hun naam, adres,
      woonplaats en de daadwerkelijk aan hen verstrekte beloningen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel9
  - number: '9.5'
    text: |-
      De aftrek van het eerste lid, onderdeel h, wordt slechts in aanmerking genomen voorzover deze meer bedraagt dan
      de aftrek ingevolge [artikel 9a][ref1]. Indien de berekening van de belastbare winst door de aftrek van het eerste
      lid, onderdeel h, zou leiden tot een negatief bedrag, blijft de aftrek beperkt tot een zodanig bedrag dat geen
      negatief bedrag ontstaat. Indien vóór het in aanmerking nemen van de aftrek van het eerste lid, onderdeel h, de
      berekening van de winst reeds leidt tot een negatief bedrag, vindt die aftrek geen toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel9a
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 9a
        hoofdstuk: II
        afdeling: '2.2'
  - number: '9.6'
    text: |-
      Bij ministeriële regeling kunnen ter voorkoming van concurrentieverstoring, lichamen, groepen lichamen of
      activiteiten worden uitgezonderd van de toepassing van het eerste lid, onderdeel h.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel9
  - number: 9a.1
    text: 'Bij het bepalen van de winst komen mede in aftrek:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel9a
  - number: 9a.1.a
    text: |-
      bij een algemeen nut beogende instelling: een bedrag ter grootte van de winst behaald met kenbaar fondswervende
      activiteiten;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel9a
  - number: 9a.1.b
    text: 'bij een fondswerver: de uitkeringen aan een algemeen nut beogende instelling.'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel9a
  - number: 9a.2
    text: |-
      Voor de toepassing van dit artikel wordt verstaan onder: - *kenbaar fondswervende activiteiten:* 1°. activiteiten
      die in belangrijke mate met behulp van vrijwilligers worden verricht en die bestaan uit het verkopen van roerende
      zaken of het leveren van diensten tegen een prijs die meer bedraagt dan de prijs die doorgaans in het economische
      verkeer als zakelijk wordt ervaren, en waarbij naar de koper van de zaak of de afnemer van de dienst kenbaar
      is gemaakt dat de opbrengst uitsluitend of nagenoeg uitsluitend ten goede komt aan een algemeen nut beogende
      instelling; 2°. activiteiten die in belangrijke mate met behulp van vrijwilligers worden verricht en die bestaan
      uit het verkopen van roerende zaken of het leveren van diensten tegen een prijs die doorgaans in het economische
      verkeer als zakelijk wordt ervaren, doch waarvan de kostprijs aanmerkelijk lager is dan in het economische verkeer
      gebruikelijk is omdat voor de vervaardiging van de zaak of de levering van de dienst vrijwilligers hun arbeid ter
      beschikking stellen en naar de koper van de zaak of de afnemer van de dienst kenbaar is gemaakt dat de opbrengst
      uitsluitend of nagenoeg uitsluitend ten goede komt aan een algemeen nut beogende instelling; of 3°. activiteiten
      die bestaan uit het inzamelen van roerende zaken om niet en waarbij naar degenen die de zaken afstaan kenbaar is
      gemaakt dat de opbrengst van het ingezamelde uitsluitend of nagenoeg uitsluitend ten goede komt aan een algemeen
      nut beogende instelling;
        - *een fondswerver:* een lichaam dat uitsluitend kenbaar fondswervende activiteiten verricht.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel9a
  - number: 9a.3
    text: 'De uitkeringen, bedoeld in het eerste lid, onderdeel b, worden slechts in aanmerking genomen indien:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel9a
  - number: 9a.3.a
    text: |-
      de fondswerver zich statutair of ingevolge schriftelijke overeenkomst uiterlijk bij aanvang van de kenbaar
      fondswervende activiteiten heeft verplicht de opbrengst geheel of nagenoeg geheel uit te keren, en
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel9a
  - number: 9a.3.b
    text: |-
      de uitkeringen zijn gedaan uiterlijk zes maanden na afloop van het jaar waarin de daarvoor bestemde gelden zijn
      verworven.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel9a
  - number: 9a.4
    text: |-
      Indien de berekening van de winst door de aftrek van het eerste lid, onderdeel b, zou leiden tot een negatief
      bedrag, blijft de aftrek beperkt tot een zodanig bedrag dat geen negatief bedrag ontstaat. Indien vóór het in
      aanmerking nemen van de aftrek van het eerste lid, onderdeel b, de berekening van de winst reeds leidt tot een
      negatief bedrag, vindt die aftrek geen toepassing.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel9a
  - number: '10.1'
    text: 'Bij het bepalen van de winst komen niet in aftrek:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel10
  - number: 10.1.a
    text: |-
      de niet onder [artikel 9][ref1] vallende onmiddellijke of middellijke uitdelingen van winst, onder welke naam of in
      welke vorm ook gedaan;


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel9
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '9'
        hoofdstuk: II
        afdeling: '2.2'
  - number: 10.1.b
    text: |-
      de niet onder [artikel 9][ref1] vallende uitkeringen welke worden gedaan ingevolge statuten, stichtingsbrief of
      andere soortgelijke akte, tenzij zij naar haar aard tot de kosten van een onderneming behoren;


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel9
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '9'
        hoofdstuk: II
        afdeling: '2.2'
  - number: 10.1.c
    text: |-
      renten op inleggelden van een coöperatie of van een vereniging op coöperatieve grondslag, renten op aandelen in
      een onderlinge waarborgmaatschappij of in een vereniging welke op onderlinge grondslag als verzekeraar of bank
      optreedt en, in het algemeen, alle vergoedingen voor kapitaalverstrekkingen door oprichters, aandeelhouders, leden,
      deelnemers of deelgerechtigden als zodanig;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel10
  - number: 10.1.d
    text: |-
      vergoedingen op een geldlening alsmede waardemutaties van de lening, indien de lening onder zodanige voorwaarden is
      aangegaan dat deze feitelijk functioneert als eigen vermogen van de belastingplichtige;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel10
  - number: 10.1.e
    text: |-
      de vennootschapsbelasting, alsmede belastingen die buiten Nederland in enige vorm naar de winst of bestanddelen van
      de winst worden geheven, indien voor de belastingplichtige ter zake daarvan een regeling ter voorkoming van dubbele
      belasting van toepassing is of indien de bestanddelen van de winst waarop de buiten Nederland geheven belasting
      betrekking heeft niet worden begrepen in de belastbare winst;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel10
  - number: 10.1.f
    text: |-
      de wegens genoten winst geheven dividendbelasting, naar de prijzen van kansspelen geheven kansspelbelasting, naar
      een balanstotaal geheven bankenbelasting en naar de hoogte van de depositobasis geheven heffing op grond van de
      [Tijdelijke wet resolutieheffing 2014][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0034433
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0034433
  - number: 10.1.g
    text: |-
      de bedragen aan meer in aanmerking te nemen loon als omschreven in
      [artikel 12a van de Wet op de loonbelasting 1964][ref1], in situaties van een aanmerkelijk belang in de
      belastingplichtige, behoudens indien de belastingplichtige aannemelijk maakt dat over die bedragen bij degene
      die deze bedragen volgens genoemd artikel geniet per saldo een belasting naar het inkomen wordt geheven die naar
      Nederlandse maatstaven redelijk is;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel12a
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 12a
  - number: 10.1.h
    text: |-
      bij lichamen waarin een publiekrechtelijke rechtspersoon een belang heeft of heeft gehad: door die rechtspersoon
      geheven belastingen of rechten voorzover aannemelijk is dat de invoering of wijziging daarvan is of was
      gericht op het verminderen van de grondslag voor de heffing van belastingen naar de winst of het inkomen. De
      belastingplichtige diezekerheid wenst omtrent de vraag of dit onderdeel ten aanzien van hem toepassing vindt, kan
      een verzoek indienen bij de inspecteur, die daarop bij voor bezwaar vatbare beschikking beslist;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel10
  - number: 10.1.i
    text: |-
      kosten en lasten die verband houden met een werkruimte, de inrichting daaronder begrepen,
      ten behoeve van een natuurlijk persoon die een aanmerkelijk belang als bedoeld in
      [hoofdstuk 4, uitgezonderd de artikelen 4.10 en 4.11, van de Wet inkomstenbelasting 2001][ref1] in de
      belastingplichtige heeft, of van een daarmee verbonden persoon als bedoeld in [artikel 3.92 van die wet][ref2],
      in zijn woning die niet tot het vermogen van een onderneming of tot het resultaat uit een werkzaamheid behoort,
      tenzij de kosten en lasten bestaan uit een vergoeding die als loon wordt belast dan wel de werkruimte een naar
      verkeersopvatting zelfstandig gedeelte van de woning vormt en:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 10.1.i.1º
    text: |-
      ingeval bedoeld persoon tevens een werkruimte buiten die woning ter beschikking heeft, hij zijn belastbaar loon
      hoofdzakelijk in de werkruimte in die woning verwerft, of
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel10
  - number: 10.1.i.2º
    text: |-
      ingeval bedoeld persoon niet tevens een werkruimte buiten die woning ter beschikking heeft, hij zijn belastbaar
      loon hoofdzakelijk in of vanuit de werkruimte in die woning verwerft en in belangrijke mate in de werkruimte in die
      woning verwerft;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel10
  - number: 10.1.j
    text: |-
      bij een vennootschap met een geheel of ten dele in aandelen verdeeld kapitaal: uitreiking of toekenning van
      aandelen in dat kapitaal of in dat van een met die vennootschap verbonden lichaam, van winstbewijzen in de
      vennootschap of in een met die vennootschap verbonden lichaam, alsmede van rechten om aandelen in dat kapitaal of
      winstbewijzen in de vennootschap of een daarmee verbonden lichaam te verwerven of van daarmee gelijk te stellen
      rechten, daaronder begrepen aan werknemers van wie het loon op jaarbasis meer bedraagt dan € 552.000 toegekende
      rechten waarvan de waarde hoofdzakelijk direct of indirect wordt bepaald door de waardeverandering van die aandelen
      of winstbewijzen;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel10
  - number: 10.1.k
    text: |-
      bij verenigingen en stichtingen die op de voet van de [Woningwet][ref1] bij koninklijk besluit zijn toegelaten
      als instellingen die in het belang van de volkshuisvesting werkzaam zijn: de verschuldigde bijdragen, bedoeld in
      [artikel 71e, tweede lid, van de Woningwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005181
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel71e
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005181
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 71e
  - number: '10.2'
    text: |-
      Voor de toepassing van dit artikel wordt onder woning mede verstaan: een duurzaam aan een plaats gebonden schip of
      woonwagen als bedoeld in [artikel 1, eerste lid, onder f, van de Huisvestingswet][ref1], alsmede de aanhorigheden
      van een woning, schip of woonwagen.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel1
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '1'
  - number: '10.3'
    text: |-
      Bij ministeriële regeling worden regels gesteld ter bepaling van hetgeen voor de toepassing van het eerste lid,
      onderdeel j, wordt verstaan onder werknemers en onder het loon op jaarbasis.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel10
  - number: '10.4'
    text: |-
      Bij het begin van het kalenderjaar wordt het in het eerste lid, onderdeel j, genoemde bedrag bij ministeriële
      regeling vervangen door een ander bedrag. Dit bedrag wordt berekend door het te vervangen bedrag te
      vermenigvuldigen met de tabelcorrectiefactor, bedoeld in [artikel 10.2 van de Wet inkomstenbelasting 2001][ref1],
      en vervolgens de nodig geachte afronding aan te brengen. Indien in het voorafgaande kalenderjaar een dergelijke
      afronding is toegepast, kan bij vervanging worden uitgegaan van het niet-afgeronde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel10
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '10'
  - number: 10a.1
    text: |-
      Bij het bepalen van de winst komen mede niet in aftrek renten – kosten en valutaresultaten daaronder begrepen – ter
      zake van schulden rechtens dan wel in feite direct of indirect verschuldigd aan een verbonden lichaam of verbonden
      natuurlijk persoon, voor zover die schulden rechtens dan wel in feite direct of indirect verband houden met een van
      de volgende rechtshandelingen:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel10a
  - number: 10a.1.a
    text: |-
      een winstuitdeling of een teruggaaf van gestort kapitaal door de belastingplichtige of door een met hem verbonden
      lichaam dat aan deze belasting is onderworpen, aan een met hem verbonden lichaam of verbonden natuurlijk persoon;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel10a
  - number: 10a.1.b
    text: |-
      een kapitaalstorting door de belastingplichtige, door een met hem verbonden lichaam dat aan deze belasting is
      onderworpen of door een met hem verbonden natuurlijk persoon die in Nederland woont, in een met hem verbonden
      lichaam;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel10a
  - number: 10a.1.c
    text: |-
      de verwerving of uitbreiding van een belang door de belastingplichtige, door een met hem verbonden lichaam dat
      aan deze belasting is onderworpen of door een met hem verbonden natuurlijk persoon die in Nederland woont, in een
      lichaam dat na deze verwerving of uitbreiding een met hem verbonden lichaam is.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel10a
  - number: 10a.2
    text: |-
      Van een verband als bedoeld in het eerste lid tussen een schuld en een rechtshandeling kan ook sprake zijn indien
      de schuld is aangegaan na het verrichten van de rechtshandeling.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel10a
  - number: 10a.3
    text: 'Het eerste lid vindt geen toepassing:'
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel10a
  - number: 10a.3.a
    text: |-
      indien de belastingplichtige aannemelijk maakt dat aan de schuld en de daarmee verband houdende rechtshandeling in
      overwegende mate zakelijke overwegingen ten grondslag liggen, of
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel10a
  - number: 10a.3.b
    text: |-
      indien de belastingplichtige aannemelijk maakt dat over de rente bij degene aan wie de rente rechtens dan wel in
      feite direct of indirect is verschuldigd, per saldo een belasting naar de winst of het inkomen wordt geheven welke
      naar Nederlandse maatstaven redelijk is en dat er geen sprake is van verrekening van verliezen of van andersoortige
      aanspraken uit jaren voorafgaande aan het jaar waarin de schuld is aangegaan waardoor over de rente per saldo geen
      heffing naar bedoelde redelijke maatstaven is verschuldigd, behoudens ingeval de inspecteur aannemelijk maakt dat
      de schuld is aangegaan met het oog op het verrekenen van verliezen of andersoortige aanspraken welke in het jaar
      zelf zijn ontstaan dan wel op korte termijn zullen ontstaan of dat aan de schuld of aan de daarmee verband houdende
      rechtshandeling niet in overwegende mate zakelijke overwegingen ten grondslag liggen. Voor de toepassing van dit
      onderdeel is een naar de winst geheven belasting naar Nederlandse maatstaven redelijk indien deze resulteert in een
      heffing naar een tarief van ten minste 10% over een naar Nederlandse maatstaven bepaalde belastbare winst, waarbij
      [artikel 12b][ref1] buiten toepassing blijft..


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel12b
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel10a
    references:
