  - number: '2.5'
    text: |-
      De lichamen, vermeld in het eerste lid, onderdelen a, b, c en d, worden geacht hun onderneming te drijven met
      behulp van hun gehele vermogen.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel2
  - number: '2.6'
    text: |-
      Voor de toepassing van deze wet wordt het bestaan van een naamloze vennootschap of besloten vennootschap met
      beperkte aansprakelijkheid steeds aangenomen, zodra en zolang een onderneming als behorende aan een naamloze
      vennootschap of besloten vennootschap met beperkte aansprakelijkheid in het handelsregister staat ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel2
  - number: '2.7'
    text: |-
      Lichamen waarvan uitsluitend Nederlandse publiekrechtelijke rechtspersonen onmiddellijk of middellijk
      aandeelhouders, deelnemers of leden zijn, alsmede lichamen waarvan de bestuurders uitsluitend door Nederlandse
      publiekrechtelijke rechtspersonen onmiddellijk of middellijk worden benoemd en ontslagen en welker vermogen bij
      liquidatie uitsluitend ter beschikking van Nederlandse publiekrechtelijke rechtspersonen komt, zijn slechts aan
      de belasting onderworpen, voorzover zij een bedrijf uitoefenen als bedoeld is in het derde lid. Het bepaalde in de
      vorige volzin is niet van toepassing ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel2
  - number: 2.7.a
    text: het Nederlands Meetinstituut NV;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel2
  - number: 2.7.b
    text: de N.V. Nederlands Inkoopcentrum (NIC);
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel2
  - number: 2.7.c
    text: de Stichting Exploitatie Nederlandse Staatsloterij;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel2
  - number: 2.7.d
    text: De Koninklijke Nederlandse Munt N.V.;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel2
  - number: 2.7.e
    text: |-
      lichamen waarin een rechtspersoon, aan wie een distributiebedrijf toebehoort in de zin van de
      [Wet energiedistributie][ref1], een belang heeft, alsmede lichamen die met een zodanige rechtspersoon in een groep
      zijn verbonden in de zin van [artikel 24b van boek 2 van het Burgerlijk Wetboek][ref2], welke lichamen activiteiten
      verrichten die eerstgenoemde rechtspersoon ingevolge [artikel 12, eerste lid, van de Wet energiedistributie][ref3]
      niet zelf mag verrichten, tenzij die lichamen uitsluitend of nagenoeg uitsluitend water leveren;


      [ref1]: https://wetten.overheid.nl/BWBR0008429
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
      [ref3]: https://wetten.overheid.nl/BWBR0008429#Artikel12
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008429
      - id: ref2
