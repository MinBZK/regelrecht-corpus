    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel2
  - number: 2.7.j
    text: de N.V. Bank Nederlandse Gemeenten;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel2
  - number: 2.7.k
    text: de Nederlandse Waterschapsbank N.V.;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel2
  - number: 2.7.l
    text: Fortis Bank (Nederland) N.V.;
    url: https://wetten.overheid.nl/BWBR0002672/2014-01-01#Artikel2
  - number: 2.7.m
