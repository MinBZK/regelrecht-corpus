preamble:
  text: |-
    Gelet op de artikelen 24 en 25 van de Landbouwwet,

    Besluit:
  url: https://wetten.overheid.nl/BWBR0012862/2001-09-30#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a

              *Minister:*


              Minister van Landbouw, Natuurbeheer en Visserij;



            b

              *CBS:*


              Centraal Bureau voor de Statistiek als bedoeld in
      [artikel 1, onderdeel b, van de Wet op het Centraal bureau en de Centrale commissie voor de statistiek][ref1];



            c

              *beschrijvingsbiljet:*


              het als bijlage bij deze regeling opgenomen modelformulier voor de periodieke inventarisatie van de
      boomkwekerijgewassen, vaste planten en waterplanten;



            d

              *opgaveplichtige:*


              opgaveplichtige als bedoeld in artikel 1, onderdeel d, van de Regeling landbouwtelling 2001, die in de
      open grond of in het water ten minste 20 are boomkwekerijgewassen of ten minste 5 are vaste planten of waterplanten
      teelt, dan wel onder glas ten minste 2 are boomkwekerijgewassen, vaste planten of waterplanten teelt.


      [ref1]: https://wetten.overheid.nl/BWBR0008005#Artikel1
    url: https://wetten.overheid.nl/BWBR0012862/2001-09-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008005
        artikel: '1'
  - number: '2'
    text: |-
      1 In het tijdvak dat loopt van 1 oktober 2001 tot en met 31 oktober 2001 wordt een landbouwtelling als bedoeld in
      de [artikelen 24][ref1] en [25 van de Landbouwwet][ref2] gehouden.

      2 De in het vorige lid bedoelde landbouwtelling heeft betrekking op de teelt in de open grond, in het water en
      onder glas van boomkwekerijgewassen, vaste planten en waterplanten.


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0002252#Artikel25
    url: https://wetten.overheid.nl/BWBR0012862/2001-09-30#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002252
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0002252
        artikel: '25'
  - number: '3'
    text: |-
      1 Ten behoeve van de telling, bedoeld in [artikel 2, eerste lid][ref1], wordt een beschrijvingsbiljet verzonden
      door het CBS vanwege de Minister.

      2 De opgaveplichtige verstrekt de op het beschrijvingsbiljet gevraagde gegevens naar de toestand op de datum
      van ondertekening, tenzij op het biljet anders is aangegeven, en neemt daarbij de overige op het biljet gegeven
      aanwijzingen in acht.

      3 De opgaveplichtige zendt het ingevulde en door hem ondertekende beschrijvingsbiljet voor 1 november 2001 naar
      het CBS.


      [ref1]: https://wetten.overheid.nl/BWBR0012862#Artikel2
    url: https://wetten.overheid.nl/BWBR0012862/2001-09-30#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012862
        artikel: '2'
  - number: '4'
    text: |-
      1 Deze regeling treedt in werking met ingang van de tweede dag na dagtekening van de Staatscourant waarin zij wordt
      geplaatst.

      2 De regeling wordt aangehaald als `Regeling landbouwtelling boomkwekerijgewassen, vaste planten en waterplanten
      2001'.

      Deze regeling zal met de toelichting en bijlage in de Staatscourant worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0012862/2001-09-30#Artikel4
