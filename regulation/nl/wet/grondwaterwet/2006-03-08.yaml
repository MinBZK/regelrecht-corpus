  - number: '37'
    text: |-
      1 Hij, die op grond van [artikel 35, eerste, tweede of derde lid][ref1], een vordering kan doen, kan eerst
      verzoeken een onderzoek in te stellen. Dit verzoek moet schriftelijk worden ingediend bij gedeputeerde staten van
      de provincie, waarbinnen de onroerende zaak geheel of grotendeels is gelegen. Deze zenden het verzoek voorzover
      nodig door aan het college van gedeputeerde staten dat de vergunning heeft verleend en geven daarvan in dat geval
      kennis aan de verzoeker.

      2 Gedeputeerde staten stellen het verzoek in handen van een door hen in te stellen commissie van deskundigen en
      zenden een afschrift daarvan aan de vergunninghouder of vergunninghouders die zij daarbij betrokken achten. Zij
      doen hiervan mededeling aan de verzoeker.

      3 Onverminderd het bepaalde in het eerste lid stellen gedeputeerde staten een ieder op zijn verzoek de gegevens
      beschikbaar van de ingevolge de vergunningvoorschriften verrichte metingen van het grondwaterpeil.


      [ref1]: https://wetten.overheid.nl/BWBR0003406#Artikel35
    url: https://wetten.overheid.nl/BWBR0003406/2006-03-08#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0003406
        artikel: '35'
        hoofdstuk: IV
  - number: '38'
    text: |-
      1 In het in [artikel 37, eerste lid][ref1], bedoelde geval brengt de commissie van deskundigen zo spoedig mogelijk
      advies uit over de ondervanging of vergoeding van de schade dan wel over de overneming van de onroerende zaak.

      2 De commissie van deskundigen zendt haar advies bij aangetekende brief aan degene op wiens verzoek zij een
      onderzoek heeft ingesteld, zomede aan de betrokken vergunninghouder of vergunninghouders. Gedeputeerde staten
      ontvangen een afschrift van het advies.


      [ref1]: https://wetten.overheid.nl/BWBR0003406#Artikel37
    url: https://wetten.overheid.nl/BWBR0003406/2006-03-08#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0003406
        artikel: '37'
        hoofdstuk: IV
  - number: '39'
    text: |-
      1 Gedurende vier weken na de verzending van het advies kunnen de in [artikel 38, tweede lid][ref1], bedoelde
      personen schriftelijk bedenkingen inbrengen bij de commissie van deskundigen. De commissie stelt degenen, die
      dit bij het schriftelijk inbrengen van bedenkingen verlangen, in de gelegenheid hun bedenkingen in persoon of bij
      gemachtigde op een daartoe door haar te beleggen zitting voor één of meer van haar leden mondeling toe te lichten,
      daarbij desgewenst bijgestaan door deskundigen.

      2 Van het behandelde ter zitting, bedoeld in het eerste lid, wordt een proces-verbaal opgemaakt dat aan de
      betrokkenen die hun bedenkingen hebben toegelicht, in afschrift wordt toegezonden.

      3 Indien de commissie in de bedenkingen aanleiding heeft gevonden haar aanvankelijk advies te wijzigen,
      zendt zij haar nader advies gelijktijdig met het proces-verbaal aan de betrokkenen, overeenkomstig
      [artikel 38, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003406#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0003406#Artikel38
    url: https://wetten.overheid.nl/BWBR0003406/2006-03-08#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003406
        artikel: '38'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0003406
        artikel: '38'
        hoofdstuk: IV
  - number: '40'
    text: |-
      Indien een onroerende zaak is gelegen in een gebied waarin de grondwaterstand invloed ondergaat van meer dan één
      onttrekking en blijkens het onderzoek van de commissie van deskundigen niet of niet binnen redelijke termijn is
      vast te stellen door welke onttrekking de schade die die onroerende zaak ondervindt, wordt veroorzaakt, kennen
      gedeputeerde staten de rechthebbende ten aanzien van die onroerende zaak op zijn verzoek een vergoeding van
      de kosten van ondervanging der schade of schadevergoeding toe. De rechthebbende is in dat geval gehouden tot
      overdracht van de rechten welke hij tegenover derden mocht kunnen doen gelden.
    url: https://wetten.overheid.nl/BWBR0003406/2006-03-08#Artikel40
  - number: '41'
    text: |-
      1 Indien de houder van een vergunning door gehele of gedeeltelijke intrekking van zijn vergunning of door wijziging
      van de daaraan verbonden voorschriften schade lijdt of zal lijden welke redelijkerwijs niet of niet geheel te
      zijnen laste behoort te blijven, kennen gedeputeerde staten hem op zijn verzoek een naar billijkheid te bepalen
      schadevergoeding toe.

      2 Onze Minister kan de in het eerste lid bedoelde schadevergoeding toekennen indien de gehele of gedeeltelijke
      intrekking van een vergunning of wijziging van de daaraan verbonden voorschriften nodig is;

      a. als gevolg van het rekening houden met het in [artikel 7 van de Wet op de waterhuishouding][ref1] bedoelde plan,
      voor zover dat is vastgesteld of herzien ingevolge een aanwijzing als bedoeld in [artikel 10 van die wet][ref2];

      b. ter voldoening aan een ingevolge [artikel 30 van deze wet][ref3] jo [artikel 8.27 van de Wet milieubeheer][ref4]
      gegeven aanwijzing.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004575#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0003406#Artikel30
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel8.27
    url: https://wetten.overheid.nl/BWBR0003406/2006-03-08#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0004575
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0004575
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0003406
        artikel: '30'
        hoofdstuk: II
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '8.27'
  - number: '42'
    text: |-
      1 Indien de gehele of gedeeltelijke intrekking van een vergunning of wijziging van de daaraan verbonden
      voorschriften nodig is om gunstig te kunnen beschikken op de aanvraag tot verlening of uitbreiding van een andere
      vergunning, kunnen gedeputeerde staten indien zij op grond van [artikel 41, eerste lid][ref1], schadevergoeding
      toekennen, deze geheel of gedeeltelijk ten laste van de aanvrager brengen. Indien schadevergoeding is toegekend
      door Onze in [artikel 41, tweede lid][ref2], bedoelde Minister kunnen gedeputeerde staten deze op diens verzoek
      geheel of gedeeltelijk ten laste van de aanvrager brengen.

      2 In de in het eerste lid bedoelde gevallen worden de beschikkingen op deze aanvraag en de beschikking tot
      gehele of gedeeltelijke intrekking van de daarbij betrokken vergunning of tot wijziging van de daaraan verbonden
      voorschriften, alsmede de daarmede verband houdende beschikkingen tot toekenning van de schadevergoeding en tot
      verhaal daarvan zoveel mogelijk gelijktijdig gegeven.

      3 Elk van de in het tweede lid bedoelde beschikkingen treedt - in afwijking van [artikel 43, eerste lid][ref3],
      van deze wet juncto [artikel 20.3 van de Wet milieubeheer][ref4] - eerst in werking wanneer deze beschikkingen alle
      onherroepelijk zijn geworden en vervolgens de deswege verschuldigde schadevergoeding is betaald. Voor het bewijs
      van betaling is [artikel 59, tweede lid, der Onteigeningswet][ref5] van overeenkomstige toepassing.

      4 Indien door een beslissing in beroep op één der beschikkingen, bedoeld in het tweede lid, de overige
      beschikkingen niet meer in stand kunnen of behoeven te worden gehouden, worden deze ingetrokken.

      5 De in het tweede lid bedoelde beschikkingen worden eveneens ingetrokken, indien degene te wiens laste de
      schadevergoeding geheel of gedeeltelijk is gebracht, heeft verklaard het bedrag daarvan niet voor zijn rekening
      te willen nemen, dan wel indien hij dat bedrag niet heeft voldaan binnen acht weken na een daartoe aan hem bij
      aangetekende brief gedane aanmaning tot betaling.


      [ref1]: https://wetten.overheid.nl/BWBR0003406#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0003406#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0003406#Artikel43
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel20.3
      [ref5]: https://wetten.overheid.nl/BWBR0001842#Artikel59
