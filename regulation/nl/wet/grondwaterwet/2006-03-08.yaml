        artikel: '8.27'
  - number: '48'
    text: |-
      1 Provinciale staten zijn bevoegd bij wijze van provinciale belasting een heffing in te stellen wegens onttrekken
      van grondwater, ter bestrijding van de ten laste van de provincie komende kosten

      a. van maatregelen, direct verband houdende met het voorkomen en tegengaan van nadelige gevolgen van onttrekkingen
      en infiltraties, voor zover deze kosten niet met toepassing van [artikel 35][ref1] voor rekening van de
      vergunninghouder gebracht worden;

      b. in verband met de voor het grondwaterbeheer noodzakelijke onderzoekingen;

      c. in verband met het onderzoek en advies van de in [artikel 37, tweede lid][ref2], bedoelde commissie van
      deskundigen;

      d. in verband met het houden van het in [artikel 13][ref3] bedoelde register;

      e. in verband met de vergoeding van schade ingevolge de [artikelen 34][ref4], [40][ref5] en [41, eerste lid][ref6].

      2 Bij algemene maatregel van bestuur worden nadere voorschriften gegeven met betrekking tot de kosten welke kunnen
      worden aangemerkt als kosten die zijn verbonden aan de voor het grondwaterbeheer noodzakelijke onderzoekingen.

      3 Aan een heffing worden onderworpen de bij de verordening aan te wijzen houders van inrichtingen, welke zijn
      ingeschreven in het in [artikel 13][ref7] bedoelde register.

      4 Als grondslag voor de heffing geldt de onttrokken hoeveelheid grondwater. Indien op grond van de
      vergunningvoorschriften water wordt geïnfiltreerd, wordt daarmede rekening gehouden bij het opleggen van de heffing
      aan de vergunninghouder.

      5 Het onttrekken van grondwater ten behoeve van koude- en warmteopslag door middel van een inrichting waarbij
      grondwater wordt onttrokken en het water vervolgens in een gesloten systeem weer volledig wordt geïnfiltreerd in
      hetzelfde watervoerende pakket als waaraan het is onttrokken, in overeenstemming met de voorwaarden welke daartoe
      zijn gesteld in de vergunning die voor het onttrekken van grondwater en infiltreren van water ingevolge deze wet is
      verleend, is van de heffing vrijgesteld.

      6 Het onttrekken van grondwater ten behoeve van de sanering van het grondwater is van de heffing vrijgesteld.

      7 Het onttrekken van grondwater ten behoeve van landijsbanen is van de heffing vrijgesteld.


