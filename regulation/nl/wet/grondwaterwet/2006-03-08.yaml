  - number: '59'
    text: |-
      1 Op de bij Ons aanhangige beroepschriften betreffende besluiten terzake van een onttrekking, welke zijn ingekomen
      vóór of na het tijdstip van de inwerkingtreding van deze wet, binnen de in het voordien geldende recht gegeven
      beroepstermijn, wordt door Ons beslist met toepassing van het vóór bedoeld tijdstip geldende recht.

      2 Een met toepassing van het eerste lid in beroep verleende of gewijzigde vergunning wordt beschouwd als vóór het
      tijdstip van de inwerkingtreding van deze wet te zijn verleend.
    url: https://wetten.overheid.nl/BWBR0003406/2006-03-08#Artikel59
  - number: '61'
    text: 'Deze wet kan worden aangehaald als: Grondwaterwet.'
    url: https://wetten.overheid.nl/BWBR0003406/2006-03-08#Artikel61
  - number: '62'
    text: |-
      Deze wet treedt in werking op een door Ons te bepalen tijdstip, dat voor de onderscheidene artikelen of onderdelen
      daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003406/2006-03-08#Artikel62
