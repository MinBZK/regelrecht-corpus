        afdeling: '2'
  - number: '58'
    text: |-
      1 De Grondwaterwet Waterleidingbedrijven wordt ingetrokken.

      2 Niettemin worden ten aanzien van een aanvraag om vergunning of een verzoek om wijziging van een vergunning of van
      de daaraan verbonden voorschriften, ingediend vóór de inwerkingtreding van deze wet op grond van de Grondwaterwet
      Waterleidingbedrijven, de bepalingen van die wet toegepast. Hetzelfde geldt ten aanzien van een aanspraak op
      schadevergoeding, waarvan mededeling is gedaan op grond van artikel 19, eerste lid, van die wet.

      3 Voor zover de Grondwaterwet Waterleidingbedrijven krachtens het tweede lid van toepassing is, geschiedt zulks
      met inachtneming van de na de inwerkingtreding van deze wet inwerkinggetreden [Boeken 3][ref1], [5][ref2] en
      [6 van Burgerlijk Wetboek][ref3] en het [Wetboek van Burgerlijke Rechtsvordering][ref4], zoals dat is gewijzigd bij
      de tegelijk met de [Boeken 3][ref5], [5][ref6] en [6 van het Burgerlijk Wetboek][ref7] inwerkinggetreden Wet van 7
      mei 1986, *Stb.* 295.


