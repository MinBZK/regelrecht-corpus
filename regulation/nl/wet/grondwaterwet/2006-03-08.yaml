  - number: '20'
    text: |-
      1 Gedeputeerde staten stellen de provinciale grondwatercommissie in de gelegenheid hun advies uit te brengen over
      het ontwerp van de beschikking op de aanvraag om een vergunning.

      2 Provinciale staten bepalen bij verordening voor welke onttrekkingen van grondwater de provinciale
      grondwatercommissie - in afwijking van het eerste lid - niet in de gelegenheid wordt gesteld van advies te dienen.
      [Artikel 11, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003406#Artikel11
    url: https://wetten.overheid.nl/BWBR0003406/2006-03-08#Artikel20
