        artikel: '14'
        hoofdstuk: I
        afdeling: '5'
  - number: '36'
    text: |-
      1 Ingeval de rechtbank de vordering, bedoeld in [artikel 35, derde lid][ref1], gegrond acht, veroordeelt
      zij de vergunninghouder tot overneming en tot betaling van de overnemingssom. Tegen het vonnis staat
      geen ander rechtsmiddel open dan beroep in cassatie. Het beroep in cassatie moet op straffe van niet-
      ontvankelijkheid binnen acht dagen na het instellen ervan worden ingeschreven in de registers, bedoeld in
      [artikel 433 van het Wetboek van Burgerlijke Rechtsvordering][ref2].

      2 Ten aanzien van de vaststelling van de overnemingssom vinden de [artikelen 27, eerste en tweede lid][ref3],
      [28, eerste, tweede en derde lid][ref4], [29-35][ref5] en [37, eerste lid, der Onteigeningswet][ref6]
      overeenkomstige toepassing, met dien verstande, dat de rechtbank in plaats van een of een oneven aantal deskundigen
      ook twee deskundigen kan benoemen.

      3 Het vonnis waarbij de vergunninghouder tot overneming is veroordeeld, kan worden ingeschreven in de openbare
      registers, bedoeld in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref7], nadat het in kracht van
      gewijsde is gegaan. Door inschrijving van het vonnis gaat de eigendom op de vergunninghouder over.


      [ref1]: https://wetten.overheid.nl/BWBR0003406#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel433
      [ref3]: https://wetten.overheid.nl/BWBR0001842#Artikel27
      [ref4]: https://wetten.overheid.nl/BWBR0001842#Artikel28
      [ref5]: https://wetten.overheid.nl/BWBR0001842#Artikel29
      [ref6]: https://wetten.overheid.nl/BWBR0001842#Artikel37
      [ref7]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0003406/2006-03-08#Artikel36
