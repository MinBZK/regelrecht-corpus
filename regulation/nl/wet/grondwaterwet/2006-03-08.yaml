  - number: '34'
    text: |-
      De schade tengevolge van het in de [artikelen 31][ref1] en [32][ref2] bedoelde onderzoek wordt vergoed door de
      provincie onderscheidenlijk door degene op wiens verzoek voor het onderzoek een gedoogplicht is opgelegd. De
      vordering tot schadevergoeding staat ter kennisneming van de rechtbank van het arrondissement, waarin de gronden
      of wateren ten aanzien waarvan een gedoogplicht is opgelegd geheel of gedeeltelijk zijn gelegen. De vordering tot
      schadevergoeding wordt behandeld en beslist door de kantonrechter van de rechtbank.


      [ref1]: https://wetten.overheid.nl/BWBR0003406#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0003406#Artikel32
    url: https://wetten.overheid.nl/BWBR0003406/2006-03-08#Artikel34
