        afdeling: '4'
  - number: '21'
    text: |-
      Indien ten tijde van de behandeling van de aanvraag tot verlening of wijziging van een vergunning de gevolgen van
      het onttrekken van grondwater of het infiltreren van water onvoldoende kunnen worden beoordeeld, kan de vergunning
      voor een proefperiode worden verleend. Na afloop van die periode kan de vergunning een of meerdere malen opnieuw
      voor een proefperiode worden verleend. De proefperiode wordt in de vergunning ten hoogste op vijf jaren gesteld,
      met dien verstande, dat de gezamenlijke proefperioden een periode van tien jaren niet mogen overtreffen.
    url: https://wetten.overheid.nl/BWBR0003406/2006-03-08#Artikel21
  - number: '22'
    text: |-
      1 Op aanvraag van de vergunninghouder kunnen gedeputeerde staten voorschriften die aan de vergunning zijn
      verbonden, wijzigen, aanvullen of intrekken, dan wel alsnog voorschriften aan de vergunning verbinden.

      2 Op de voorbereiding van een beschikking krachtens het eerste lid zijn
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] en [afdeling 13.2 van de Wet milieubeheer][ref2] van
      toepassing, en is [artikel 20][ref3] van deze wet van overeenkomstige toepassing.


