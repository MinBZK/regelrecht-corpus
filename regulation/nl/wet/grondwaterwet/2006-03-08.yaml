  - number: 14b
    text: |-
      1 In een vergunning kan worden bepaald dat zij slechts geldt voor een daarbij vast te stellen termijn, indien:

      a. het onttrekken of het infiltreren naar zijn aard tijdelijk is;

      b. uit de aanvraag blijkt dat de vergunning slechts voor een daarbij aangegeven termijn wordt gevraagd, of

      c. dat nodig is in het belang van het ontwikkelen van een alternatief voor het onttrekken of infiltreren, dat
      minder nadelige gevolgen voor bij het grondwaterbeheer betrokken belangen veroorzaakt.

      2 Na afloop van de termijn, bedoeld in de aanhef van het eerste lid, kan een vergunning die is verleend met
      toepassing van het eerste lid, onder *c*, éénmaal of meermalen opnieuw voor een bepaalde termijn worden veleend,
      met dien verstande dat de gestelde termijnen gezamenlijk een periode van tien jaar niet mogen overschrijden.
    url: https://wetten.overheid.nl/BWBR0003406/2006-03-08#Artikel14b
  - number: '15'
    text: |-
      1 Het in [artikel 14, eerste lid][ref1], omschreven verbod geldt niet ten aanzien van het onttrekken van grondwater
      in de door provinciale staten bij verordening aangewezen gevallen. De aanwijzing kan geen betrekking hebben op
      gevallen waarin de te onttrekken hoeveelheid grondwater meer dan 10 m3 per uur bedraagt, tenzij het onttrekkingen
      door middel van inrichtingen voor noodvoorzieningen betreft.

      2 [Artikel 11, vierde lid][ref2], is van overeenkomstige toepassing.

      3 Het in [artikel 14, eerste lid][ref3], omschreven verbod, geldt niet voor het infiltreren van water dat geschiedt
      ter voldoening aan een voorschrift, verbonden aan een vergunning tot het onttrekken van grondwater.

      4 [Artikel 14a][ref4] is van overeenkomstige toepassing op de verlening van een vergunning voor het onttrekken van
      grondwater, waaraan een voorschrift tot het infiltreren van water wordt verbonden, als bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003406#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003406#Artikel11
