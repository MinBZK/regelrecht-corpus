preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, teneinde een goed beheer van het grondwater te bevorderen,
    wenselijk is regelen te stellen inzake het onttrekken van grondwater alsmede inzake het daarvoor kunstmatig in de
    bodem brengen van water;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003406/2006-03-08#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:

      "Onze Minister": Onze Minister van Verkeer en Waterstaat;

      "een inrichting": een inrichting of werk, bestemd tot het onttrekken van grondwater;

      "onttrekken van grondwater": onttrekken van grondwater door middel van een inrichting;

      "infiltreren van water": water in de bodem brengen ter aanvulling van het grondwater met het oog op het onttrekken
      van grondwater.

      2 Inrichtingen tot het onttrekken van grondwater die een samenhangend geheel vormen, worden als één inrichting
      aangemerkt.

      3 Deze wet is niet van toepassing op het onttrekken van grondwater:

      a. bij de ontwatering of afwatering van gronden;

      b. bij of ten behoeve van het opsporen of winnen van delfstoffen of aardwarmte in de zin van
      [artikel 1 van de Mijnbouwwet][ref1], voorzover het onttrekken op een diepte van meer dan 500 meter beneden de
      oppervlakte van de aardbodem plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel1
    url: https://wetten.overheid.nl/BWBR0003406/2006-03-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '1'
  - number: '11'
    text: |-
      1 Hij die grondwater onttrekt is verplicht:

      a. de inrichting op te geven aan gedeputeerde staten van de provincie of de provincies, waarin de inrichting is
      gelegen;

      b. de hoeveelheden grondwater die worden onttrokken, te meten en daarvan aantekening te houden;

      c. telkenmale in de maand januari of, bij beëindiging van de onttrekking, binnen een maand na die beëindiging, aan
      gedeputeerde staten van de provincie of provincies, waarin de inrichting is gelegen, opgave te verstrekken van de
      in het voorafgaande onderscheidenlijk het lopende kalenderjaar per kwartaal onttrokken hoeveelheden grondwater;

      d. bij de onder *c.* bedoelde opgave kennis te geven van wijzigingen die zich in het voorafgaande onderscheidenlijk
      het lopende kalenderjaar hebben voorgedaan met betrekking tot de bij de opgave, als bedoeld onder *a.*, verstrekte
      gegevens.

      2 Voor hem die water infiltreert gelden de in het eerste lid omschreven verplichtingen op overeenkomstige
      wijze. Voorts is hij verplicht de kwaliteit van het te infiltreren water te meten, te registreren en daarvan aan
      gedeputeerde staten opgave te doen. Bij algemene maatregel van bestuur worden regelen gesteld omtrent de wijze van
      meting en registratie.

      3 Provinciale staten kunnen bij verordening gevallen aanwijzen, waarvoor de in het eerste lid omschreven
      verplichting niet geldt.

      4 Gedeputeerde staten zenden een verordening die krachtens het derde lid is vastgesteld, onverwijld aan Onze
      Minister. De verordening treedt niet eerder in werking dan drie maanden nadat zij aan Onze Minister is gezonden.
    url: https://wetten.overheid.nl/BWBR0003406/2006-03-08#Artikel11
  - number: '12'
    text: |-
      1 Bij algemene maatregel van bestuur worden voorschriften gegeven met betrekking tot de bij de opgave te
      verstrekken gegevens, de meting en het houden van aantekening dienaangaande.

      2 Gedeputeerde staten kunnen bij verordening bepalen dat voor door hen aangewezen gebieden of categorieën van
      inrichtingen de opgave van de onttrokken hoeveelheden grondwater ook op andere tijdstippen of over kortere perioden
      zal geschieden dan die vermeld in [artikel 11, eerste lid, onder c][ref1]. Onze Minister wordt een afschrift van
      die verordening toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003406#Artikel11
    url: https://wetten.overheid.nl/BWBR0003406/2006-03-08#Artikel12
