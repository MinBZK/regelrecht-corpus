  - number: '33'
    text: |-
      Rechthebbenden ten aanzien van enige onroerende zaak, waarin het grondwater invloed ondergaat door een
      onttrekking of een infiltratie krachtens een vergunning als bedoeld in [artikel 14, eerste lid][ref1],
      zijn verplicht die onttrekking of die infiltratie te gedogen, onverminderd het bepaalde in
      [artikel 35, eerste, tweede en derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003406#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003406#Artikel35
    url: https://wetten.overheid.nl/BWBR0003406/2006-03-08#Artikel33
