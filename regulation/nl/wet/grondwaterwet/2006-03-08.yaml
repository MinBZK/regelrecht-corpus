  - number: '43'
    text: |-
      1 Beroep op de administratieve rechter staat open overeenkomstig [hoofdstuk 20 van de Wet milieubeheer][ref1].

      2 Tegen een beschikking als bedoeld in [artikel 30][ref2] houdende een aanwijzing overeenkomstig
      [artikel 8.27 van de Wet milieubeheer][ref3] kan geen beroep worden ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk20
