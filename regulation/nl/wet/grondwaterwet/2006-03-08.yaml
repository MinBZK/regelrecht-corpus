  - number: '25'
    text: |-
      1 Gedeputeerde staten trekken de vergunning in, indien de vergunninghouder schriftelijk verklaart daarvan geen
      gebruik te maken.

      2 Gedeputeerde staten kunnen de vergunning intrekken indien:

      a. de te harer verkrijging verstrekte gegevens zodanig onjuist of onvolledig blijken, dat op de aanvraag een andere
      beslissing zou zijn genomen indien bij de beoordeling daarvan de juiste gegevens bekend waren geweest;

      b. daarvan gedurende vier achtereenvolgende jaren geen gebruik is gemaakt;

      c. aan het onttrokken water een andere bestemming wordt gegeven dan in de vergunning staat vermeld;

      d. de aan de vergunning verbonden voorschriften niet in acht worden genomen.
    url: https://wetten.overheid.nl/BWBR0003406/2006-03-08#Artikel25
  - number: '28'
    text: |-
      Indien een inrichting is gelegen in meer dan één provincie, kunnen de colleges van gedeputeerde
      staten van deze provincies bij gemeenschappelijke beschikking bepalen dat de gegevens bedoeld in
      [artikel 11, eerste lid, onder c][ref1], voor deze inrichting slechts behoeven te worden verstrekt aan één van
      deze colleges.


      [ref1]: https://wetten.overheid.nl/BWBR0003406#Artikel11
    url: https://wetten.overheid.nl/BWBR0003406/2006-03-08#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0003406
        artikel: '11'
        hoofdstuk: I
        afdeling: '4'
  - number: '29'
    text: |-
      Indien de inrichting door middel waarvan wordt of zal worden onttrokken, zich bevindt in een gebied dat in meer
      dan één provincie is gelegen, of indien het infiltreren in een zodanig gebied plaats vindt of zal vinden, worden
      de beschikkingen krachtens de [artikelen 14][ref1], [22-25][ref2], [31][ref3] en [40-42][ref4], door de betrokken
      colleges van gedeputeerde staten gemeenschappelijk gegeven. Indien deze colleges niet tot overeenstemming kunnen
      komen, doen zij hiervan zo spoedig mogelijk doch uiterlijk één jaar na de indiening van de aanvraag of het verzoek
      mededeling aan Onze Minister, die alsdan de beschikking geeft. Deze beschikking wordt voor de toepassing van deze
      wet gelijkgesteld met een beschikking van gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0003406#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003406#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0003406#Artikel31
