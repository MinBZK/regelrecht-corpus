  - number: '49'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van
      gedeputeerde staten aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0003406/2006-03-08#Artikel49
  - number: '53'
    text: |-
      1 Een vergunning, verleend op grond van de Grondwaterwet Waterleidingbedrijven, wordt voor de toepassing van deze
      wet beschouwd als krachtens deze wet te zijn verleend.

      2 De rechten en verplichtingen, die op het tijdstip van de inwerkingtreding van deze wet krachtens een beschikking
      als bedoeld in artikel 29, tweede lid, van de Grondwaterwet Waterleidingbedrijven gelden met betrekking tot het in
      werking hebben van een inrichting waarvoor vergunning is verleend hetzij krachtens de Hinderwet hetzij krachtens
      de aan die wet voorafgaande Koninklijke besluiten, blijven gelden voorzover zodanige rechten en verplichtingen ook
      voortvloeien uit een krachtens deze wet verleende vergunning.
    url: https://wetten.overheid.nl/BWBR0003406/2006-03-08#Artikel53
  - number: '54'
    text: |-
      1 Voor een onttrekking of infiltratie, voor welke voor het tijdstip van de inwerkingtreding van deze wet een
      vergunning is verleend op grond van de Hinderwet of op grond van een provinciale, waterschaps- of gemeentelijke
      verordening, dan wel een onttrekking of infiltratie voor welke op die datum geen vergunning is vereist en welke
      voor die datum geregeld heeft plaats gevonden, wordt een vergunning krachtens deze wet geacht te zijn verleend,
      voor zover die onttrekking of infiltratie voor een door gedeputeerde staten te stellen tijdstip, gelegen voor 1
      maart 1989, schriftelijk bij gedeputeerde staten is gemeld.

      2 In een geval als bedoeld in het eerste lid kan de vergunning niet eerder dan een jaar nadat de melding door
      gedeputeerde staten is ontvangen, worden gewijzigd of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003406/2006-03-08#Artikel54
  - number: '55'
    text: |-
      In afwijking van het bepaalde in [artikel 11, eerste lid, sub c][ref1], betreft de daar bedoelde opgave welke
      plaatsvindt in de maand januari, volgende op het tijdstip van de inwerkingtreding van deze wet, alleen de
      voorafgaande kwartalen sinds dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0003406#Artikel11
    url: https://wetten.overheid.nl/BWBR0003406/2006-03-08#Artikel55
