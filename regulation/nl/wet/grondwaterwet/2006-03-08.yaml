  - number: 15b
    text: |-
      De regels bedoeld in [artikel 15][ref1], hebben in ieder geval betrekking op:

      a. het melden van inrichtingen waarop [artikel 11, eerste lid][ref2], niet van toepassing is op grond van een
      aanwijzing als bedoeld in [artikel 11, derde lid][ref3], en

      b. de perioden waarin, het doel waarvoor en de voorwaarden waaronder het onttrekken slechts mag plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0003406#Artikel15a
