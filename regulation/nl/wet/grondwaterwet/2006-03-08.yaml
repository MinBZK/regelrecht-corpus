  - number: '16'
    text: |-
      1 De aanvraag tot verlening of wijziging van een vergunning wordt ingediend bij gedeputeerde staten van de
      provincie waarin de aanvrager de onttrekking of de infiltratie wil verrichten, dan wel waarin hij deze verricht.

      2 Provinciale staten bepalen bij verordening welke gegevens en bescheiden de aanvrager moet overleggen; daarbij
      kunnen tevens nadere regelen worden gegeven betreffende de wijze waarop de nodige onderzoekingen moeten worden
      verricht ter beoordeling van de vergunningaanvraag. [Artikel 11, vierde lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003406#Artikel11
    url: https://wetten.overheid.nl/BWBR0003406/2006-03-08#Artikel16
