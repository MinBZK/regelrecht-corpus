  - number: '24'
    text: |-
      1 Gedeputeerde staten kunnen hetzij uit eigen beweging hetzij op verzoek van belanghebbenden de vergunning
      geheel of gedeeltelijk intrekken, indien blijkt van omstandigheden of feiten, waardoor in verband met de bij het
      grondwaterbeheer betrokken belangen de onttrekking of infiltratie in haar geheel dan wel gedeeltelijk niet langer
      toelaatbaar wordt geacht.

      2 Op de voorbereiding van een beschikking krachtens het eerste lid zijn
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] en [afdeling 13.2 van de Wet milieubeheer][ref2] van
      toepassing, en is [artikel 20][ref3] van deze wet van overeenkomstige toepassing.


