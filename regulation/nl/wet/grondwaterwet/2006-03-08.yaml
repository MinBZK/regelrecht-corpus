  - number: '30'
    text: |-
      De [artikelen 8.27][ref1] en [21.1][ref2] en [hoofdstuk 19 van de Wet milieubeheer][ref3] zijn van overeenkomstige
      toepassing met betrekking tot het verlenen en wijzigen van vergunningen, het wijzigen van vergunningvoorschriften
      en het intrekken van vergunningen, met dien verstande dat voor de toepassing van artikel 8.27 onder "Onze Minister"
      wordt verstaan: Onze Minister van Verkeer en Waterstaat en dat laatstgenoemde minister bij de toepassing van dat
      artikel rekening houdt met de nota, bedoeld in [artikel 3 van de Wet op de waterhuishouding][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8.27
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel21.1
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk19
      [ref4]: https://wetten.overheid.nl/BWBR0004575#Artikel3
