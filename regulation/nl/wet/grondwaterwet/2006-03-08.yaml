  - number: '31'
    text: |-
      1 Indien gedeputeerde staten in verband met de toepassing van deze wet een onderzoek ter plaatse nodig oordelen,
      zijn zij bevoegd de rechthebbenden ten aanzien van gronden of wateren waar dat onderzoek wordt ingesteld,
      de verplichting op te leggen het verrichten van het onderzoek, zomede het aanbrengen, het aanwezig zijn, het
      onderhoud, het gebruik en het verwijderen van de voor dat onderzoek nodige middelen te gedogen, onverminderd het
      recht van deze rechthebbenden op schadevergoeding.

      2 De beschikking waarbij de gedoogplicht wordt opgelegd, wordt ten minste twee weken voor de aanvang van het
      onderzoek aan de rechthebbenden bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0003406/2006-03-08#Artikel31
  - number: '32'
    text: |-
      1 Indien de aanvrager of de houder van een vergunning of hij die voornemens is een aanvraag in te dienen, ter
      verkrijging van de gegevens bedoeld in [artikel 16, tweede lid][ref1], onderzoekingen moet verrichten in de gronden
      of wateren ten aanzien waarvan hem de nodige bevoegdheid ontbreekt, kan hij gedeputeerde staten verzoeken de
      rechthebbenden daartoe een gedoogplicht overeenkomstig [artikel 31][ref2] op te leggen.

      2 Hij legt hiertoe over een opgave van de ligging van de gronden of wateren, van de namen en woonplaatsen van de
      rechthebbenden daarvan, zomede van de aard der onderzoekingen.

      3 Gedeputeerde staten stellen bij het opleggen van de gedoogplicht zodanige voorwaarden dat de vergoeding van
      schade aan de rechthebbenden op voldoende wijze is verzekerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003406#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003406#Artikel31
