  - number: '13'
    text: |-
      1 Gedeputeerde staten houden ter provinciale griffie een register bij waarin de inrichtingen worden ingeschreven
      met vermelding van de verstrekte gegevens. Voorts worden daarin vermeld de vergunningen, krachtens welke het
      onttrekken van grondwater of het infiltreren van water plaatsvindt.

      2 Het register ligt ter provinciale griffie kosteloos voor een ieder ter inzage.
    url: https://wetten.overheid.nl/BWBR0003406/2006-03-08#Artikel13
  - number: '14'
    text: |-
      1 Het is verboden grondwater te onttrekken of water te infiltreren, tenzij daarvoor door gedeputeerde staten een
      vergunning is verleend.

      2 Aan de vergunning kunnen voorschriften worden verbonden ter bescherming van bij het grondwaterbeheer betrokken
      belangen. Deze voorschriften kunnen mede betrekking hebben op voorafgaande melding van beëindiging of vermindering
      van het onttrekken of het infiltreren.

      3 Bij het verlenen, wijzigen of intrekken van de vergunning wordt rekening gehouden met de in het
      [artikel 7 van de Wet op de waterhuishouding][ref1] bedoelde plan.

      4 In de vergunning worden vermeld de hoeveelheden grondwater of de hoeveelheden water die per een of meer
      tijdseenheden mogen worden onttrokken onderscheidenlijk geïnfiltreerd alsmede het doel waarvoor het te onttrekken
      water is bestemd.

      5 De vergunning geldt voor de rechtsopvolgers van de vergunninghouder. Binnen drie maanden, te rekenen van de dag
      van de rechtsopvolging dient wijziging van de tenaamstelling te worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel7
    url: https://wetten.overheid.nl/BWBR0003406/2006-03-08#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004575
        artikel: '7'
  - number: 14a
    text: |-
      1 Een vergunning voor het infiltreren van water, als bedoeld in [artikel 14, eerste lid][ref1], wordt slechts
      verleend, indien er geen gevaar is voor verontreiniging van het grondwater. Bij het beoordelen van dat gevaar
      worden de regels in acht genomen, daaromtrent te stellen bij algemene maatregel van bestuur op grond van
      [artikel 12 van de Wet bodembescherming][ref2].

      2 Onverminderd [artikel 14, tweede lid][ref3], worden aan de vergunning voorschriften verbonden volgens regels te
      stellen bij de in het eerste lid bedoelde maatregel.

      3 Aan de vergunning worden in ieder geval voorschriften verbonden ter verzekering van de controle op de kwaliteit
      van het grondwater.


      [ref1]: https://wetten.overheid.nl/BWBR0003406#Artikel14
