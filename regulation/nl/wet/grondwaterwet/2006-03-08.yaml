  - number: '23'
    text: |-
      1 Uit eigen beweging of op verzoek van een belanghebbende, niet zijnde de vergunninghouder, kunnen gedeputeerde
      staten de voorschriften die aan de vergunning zijn verbonden, wijzigen, aanvullen of intrekken, dan wel alsnog
      voorschriften aan de vergunning verbinden, indien de bescherming van de bij het grondwater betrokken belangen dat
      vordert.

      2 Op de voorbereiding van een beschikking krachtens het eerste lid zijn
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] en [afdeling 13.2 van de Wet milieubeheer][ref2] van
      toepassing, en is [artikel 20][ref3] van deze wet van overeenkomstige toepassing.


