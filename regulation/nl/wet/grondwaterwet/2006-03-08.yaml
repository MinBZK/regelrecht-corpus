  - number: 15a
    text: |-
      1 Provinciale staten kunnen bij verordening met betrekking tot daarbij aan te wijzen gevallen ten aanzien van het
      onttrekken van grondwater regels stellen ter bescherming van bij het grondwaterbeheer betrokken belangen. Deze
      regels kunnen ten aanzien van het onttrekken verboden en beperkingen inhouden. Bij die regels kan aan gedeputeerde
      staten de bevoegdheid worden verleend in bij die regels aan te geven omstandigheden het onttrekken te verbieden.

      2 De aanwijzing kan slechts betrekking hebben op onttrekkingen door middel van:

      a. inrichtingen die uitsluitend worden gebruikt voor het drooghouden van een bouwput ten behoeve van bouwkundige
      of civieltechnische werken en inrichtingen die bij wijze van proef of ten behoeve van grondsanering grondwater
      onttrekken, waarbij:

      1°. de te onttrekken hoeveelheid grondwater niet meer bedraagt dan 100 000 m3 per maand, en

      2°. de onttrekking niet langer duurt dan zes maanden;

      b. inrichtingen ten behoeve van noodvoorzieningen;

      c. inrichtingen die uitsluitend of nagenoeg uitsluitend worden gebruikt voor beregenings- of bevloeiingsdoeleinden
      en waarbij de te onttrekken hoeveelheid grondwater niet meer bedraagt dan 60 m3 per uur, of

      d. inrichtingen die uitsluitend worden gebruikt voor grondwatersanering en waarbij de te onttrekken hoeveelheid
      grondwater niet meer bedraagt dan 50 000 m3 per maand.

      3 Het in [artikel 14, eerste lid][ref1], omschreven verbod geldt niet ten aanzien van het onttrekken van grondwater
      in de gevallen waarin regels als bedoeld in het eerste lid van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003406#Artikel14
    url: https://wetten.overheid.nl/BWBR0003406/2006-03-08#Artikel15a
