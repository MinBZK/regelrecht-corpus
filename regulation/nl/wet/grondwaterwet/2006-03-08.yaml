        artikel: '31'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003406
        artikel: '32'
        hoofdstuk: III
  - number: '35'
    text: |-
      1 De schade aan een onroerende zaak, welke is veroorzaakt door een onttrekking of infiltratie krachtens een
      vergunning als bedoeld in [artikel 14, eerste lid][ref1], wordt door de vergunninghouder, indien en voorzover dit
      redelijkerwijze kan worden gevergd, ondervangen.

      2 Indien en voorzover de schade niet is ondervangen, is de vergunninghouder desgevorderd verplicht jegens ieder die
      enig recht op het gebruik of het genot van de onroerende zaak heeft, die schade te vergoeden.

      3 Niettemin kan een eigenaar van de onroerende zaak, indien door de aard of de omvang van de schade de eigendom
      van die zaak voor hem van te geringe betekenis is geworden, vorderen dat de vergunninghouder de onroerende zaak in
      eigendom overneemt.

      4 De in het vorige lid bedoelde vordering kan worden gedaan zowel bij niet-aanvaarding van een als schadevergoeding
      aangeboden som als na aanvaarding daarvan.

      5 De vorderingen, op grond van het eerste, het tweede en het derde lid, staan ter kennisneming van de rechtbank
      binnen wier rechtsgebied de onroerende zaak of het grootste gedeelte daarvan is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0003406#Artikel14
    url: https://wetten.overheid.nl/BWBR0003406/2006-03-08#Artikel35
    references:
      - id: ref1
