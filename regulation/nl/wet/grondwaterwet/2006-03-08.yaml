        afdeling: '4'
  - number: '56'
    text: |-
      Provinciale staten stellen het in [artikel 8][ref1] bedoelde plan voor de eerste maal vast binnen drie jaren na de
      inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003406#Artikel8
    url: https://wetten.overheid.nl/BWBR0003406/2006-03-08#Artikel56
