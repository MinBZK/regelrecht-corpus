$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: burgerlijk_wetboek_bes_boek_7a
regulatory_layer: WET
publication_date: '2025-02-19'
valid_from: '2026-01-01'
bwb_id: BWBR0028752
url: https://wetten.overheid.nl/BWBR0028752/2026-01-01
articles:
  - number: 1250 t/m 1473
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1250_tm_1473
  - number: '1557.1'
    text: |-
      Koop en verkoop op afbetaling is de koop en verkoop, waarbij partijen overeenkomen dat de koopprijs wordt betaald
      in termijnen, waarvan twee of meer verschijnen, nadat de verkochte zaak aan de koper is afgeleverd.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557
  - number: '1557.2'
    text: De overeenkomst is niet van kracht voordat partijen de door de koper te betalen prijs hebben bepaald.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557
  - number: '1557.3'
    text: |-
      Alle overeenkomsten, welke dezelfde strekking hebben, onder welke vorm of welke benaming ook aangegaan, worden als
      koop en verkoop op afbetaling aangemerkt.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557
  - number: '1557.4'
    text: 'Koop en verkoop op afbetaling in de zin der wet zijn niet de overeenkomsten welke betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557
  - number: 1557.4.a
    text: onroerende zaken,
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557
  - number: 1557.4.b
    text: |-
      zeeschepen waarvan de bruto-inhoud tenminste twintig kubieke meters of de bruto-tonnage tenminste zes bedraagt, die
      teboekstaan of teboekgesteld kunnen worden in het in [artikel 193 van Boek 8][ref1] genoemde register;


      [ref1]: https://wetten.overheid.nl/BWBR0028753#Artikel193
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557
    references:
      - id: ref1
        bwb_id: BWBR0028753
        artikel: '193'
  - number: 1557.4.c
    text: |-
      luchtvaartuigen teboekstaand in het register genoemd in [titel 15 van Boek 8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028753
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557
    references:
      - id: ref1
        bwb_id: BWBR0028753
  - number: '1557.5'
    text: |-
      Het in deze titel bepaalde vindt overeenkomstige toepassing op vermogensrechten, niet zijnde registergoederen, voor
      zover dat in overeenstemming is met de aard van het recht.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557
  - number: 1557a
    text: Van de bepalingen van deze titel mag slechts worden afgeweken, indien en voor zover dit daaruit blijkt.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557a
  - number: 1557b.1
    text: |-
      Bedingen, waarbij of krachtens welke de schuldenaar, voor het geval hij enige verplichting uit de overeenkomst niet
      vervult, de betaling van zekere som als schadevergoeding of enige straf wordt of kan worden opgelegd, kunnen alleen
      bij schriftelijk aangegane overeenkomst worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557b
  - number: 1557b.2
    text: |-
      Indien de overeengekomen of opgelegde schadevergoeding of straf de rechter bovenmatig voorkomt, kan deze haar, ten
      aanzien van het hem voorgelegde geval, verminderen of opheffen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557b
  - number: 1557c.1
    text: |-
      Vervroegde opeisbaarheid, als straf wegens nalatigheid van de koper in het betalen van termijnen, kan alleen
      bedongen worden voor het geval de achterstand bedraagt, ten aanzien van één termijn ten minste een tiende, of ten
      aanzien van meer termijnen gezamenlijk tenminste een twintigste deel van de gehele koopprijs.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557c
  - number: 1557c.2
    text: |-
      Onder gehele koopprijs wordt verstaan de som van alle betalingen, waartoe de koper bij regelmatige nakoming van de
      overeenkomst gehouden is.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557c
  - number: 1557c.3
    text: |-
      Het tweede lid van [artikel 1557b][ref1] is hier niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1557b
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557c
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1557b
        afdeling: '1'
  - number: 1557d
    text: |-
      Op enig beding, als bedoeld in de voorafgaande twee artikelen, kan wegens niet tijdige nakoming beroep alleen
      worden gedaan, indien de schuldenaar, na in gebreke te zijn gesteld, nalatig blijft om zijn verplichtingen na te
      komen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557d
  - number: 1557e.1
    text: De koper is steeds bevoegd tot vervroegde betaling van één of meer eerstvolgende termijnen van de koopprijs.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557e
  - number: 1557e.2
    text: |-
      In geval van vervroegde betaling ineens van het gehele nog verschuldigde bedrag heeft hij recht op een aftrek,
      berekend naar vijf ten honderd ‘s jaars over elke daarbij vervroegd betaalde termijn.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557e
  - number: 1557e.3
    text: Van de bepalingen van dit artikel kan ten voordele van de koper door partijen worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557e
  - number: 1557f.1
    text: |-
      Overdracht, inpandgeving of elke andere handeling, waardoor de koper aan de verkoper of aan een derde enig recht
      toekent op zijn loon, pensioen of andere periodieke inkomsten wegens arbeidsovereenkomst, kan ter zake van koop en
      verkoop op afbetaling, behalve voor opeisbare verplichtingen, alleen geschieden voor betalingen, waartoe de koper
      bij regelmatige nakoming van de overeenkomst zal gehouden zijn, en voor de kosten.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557f
  - number: 1557f.2
    text: |-
      De handeling heeft alsdan geen werking dan naar gelang bedoelde termijnen verschijnen overeenkomstig een bij
      schriftelijke overeenkomst vastgelegd plan van regelmatige afbetaling of naar gelang er kosten vallen, telkens tot
      het beloop daarvan.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557f
  - number: 1557f.3
    text: |-
      Bovendien is vereist, dat de koper, na in gebreke te zijn gesteld, nalatig is gebleven. Alleen de termijnen en
      kosten, waarover de ingebrekestelling is geschied, en die, welke daarna verschijnen, komen in aanmerking bij het
      bepalen van bedoelde werking.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557f
  - number: 1557f.4
    text: |-
      Ten aanzien van hem, die de uitkering wegens arbeidsovereenkomst verschuldigd is, heeft de handeling geen gevolg,
      alvorens de ingebrekestelling van de koper en het plan van regelmatige afbetaling met opgave van hetgeen daarop
      voldaan is en van de gevorderde kosten schriftelijk te zijner kennis zijn gebracht, dan wel schriftelijk door hem
      zijn erkend. Betalingen, dienovereenkomstig te goeder trouw door hem gedaan, bevrijden hem tegenover de koper.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557f
  - number: 1557g
    text: |-
      Volmacht tot invordering van loon, pensioen of andere periodieke vorderingen ter zake van een arbeidsovereenkomst,
      onder welke vorm of welke benaming ook, door de koper verleend, is steeds herroepelijk.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557g
  - number: 1557h.1
    text: |-
      Huurkoop is de koop en verkoop op afbetaling, waarbij partijen overeenkomen, dat de verkochte zaak niet door enkele
      aflevering in eigendom overgaat, maar pas door vervulling van de opschortende voorwaarde van algehele betaling van
      wat door de koper uit hoofde van de koopovereenkomst verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557h
  - number: 1557h.2
    text: |-
      Alle overeenkomsten, welke dezelfde strekking hebben, hetzij als huur en verhuur, hetzij onder andere vorm of
      andere benaming aangegaan, worden als huurkoop aangemerkt.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557h
  - number: 1557h.3
    text: |-
      Onder huurkoop is begrepen de overeenkomst, waarbij ter zake van een koop en verkoop een derde, die de eigendom der
      zaak verwerft, aan de koper krediet verleent des dat het geheel van handelingen de strekking van huurkoop erlangt.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557h
  - number: 1557i.1
    text: |-
      Huurkoop wordt aangegaan bij authentieke of onderhandse akte, welke voldoet aan de bepalingen van
      [artikel 1557j][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1557j
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557i
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1557j
        afdeling: '2'
  - number: 1557i.2
    text: |-
      Hetzelfde geldt voor overeenkomsten, welke bestaande overeenkomsten zodanig wijzigen of aanvullen, dat daardoor
      huurkoop zou ontstaan.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557i
  - number: 1557i.3
    text: |-
      Wordt de overeenkomst aangegaan bij onderhandse akte, dan moet deze, zo de koper dit verlangt, in dubbel worden
      opgemaakt.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557i
  - number: 1557i.4
    text: |-
      Het dubbel, of zo dit niet is opgemaakt, een authentiek of door de verkoper ondertekend afschrift, wordt zo spoedig
      mogelijk na het sluiten van de overeenkomst door de verkoper aan de koper verstrekt.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557i
  - number: 1557i.5
    text: Verder afschrift kan de koper te allen tijde tegen betaling van de kosten vorderen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557i
  - number: 1557j.1
    text: |-
      De akte van huurkoop moet duidelijk vermelden de gehele koopprijs, als bedoeld in [artikel 1557c][ref1], het plan
      van regelmatige afbetaling, als bedoeld in [artikel 1557f][ref2], en de bedingen betreffende voorbehoud en overgang
      van eigendom.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1557c
      [ref2]: https://wetten.overheid.nl/BWBR0028752#Artikel1557f
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557j
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1557c
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0028752
        artikel: 1557f
        afdeling: '1'
  - number: 1557j.2
    text: |-
      In de gevallen, bedoeld in het tweede en het [derde lid van artikel 1557h][ref1], treden de overeenkomstige
      gegevens hiervoor in de plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1557h
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557j
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1557h
        afdeling: '2'
  - number: 1557j.3
    text: |-
      Ontbreekt een akte, welke voldoet aan genoemde voorwaarden, dan geldt de overeenkomst niet als huurkoop, doch wordt
      de koop en verkoop op afbetaling geacht te zijn gesloten zonder beding, dat de verkochte zaak niet door enkele
      aflevering aan de koper overgaat.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557j
  - number: 1557k
    text: |-
      Ter zake van huurkoop kan de koper, indien hij bij het aangaan van de overeenkomst werkelijk woonplaats in het
      openbaar lichaam Bonaire, Sint Eustatius of Saba heeft, geen woonplaats kiezen, behalve voor het geval dat hij
      te eniger tijd geen bekende werkelijke woonplaats in het openbaar lichaam Bonaire, Sint Eustatius of Saba mocht
      hebben.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557k
  - number: 1557l.1
    text: |-
      De verkoper is verplicht de verkochte zaak aan de koper te leveren door aan deze de
      macht over de zaak te verschaffen. Op zijn verdere verplichtingen zijn de bepalingen van
      [titel 1, afdeling 1 tot en met 3, van Boek 7][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028751#Afdeling1
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557l
    references:
      - id: ref1
        bwb_id: BWBR0028751
        afdeling: '1'
  - number: 1557l.2
    text: Vervreemding door de verkoper van de in huurkoop afgeleverde zaak werkt niet ten nadele van de huurkoper.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557l
  - number: 1557m.1
    text: |-
      De koper heeft van de zaak, die hij krachtens huurkoop onder zich heeft, het genot, ook voordat hij de eigendom
      daarvan verkrijgt.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557m
  - number: 1557m.2
    text: Hij mag de zaak gebruiken overeenkomstig haar bestemming.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557m
  - number: 1557m.3
    text: Haar gedaante of inrichting mag hij niet veranderen, noch de zaak verhuren of zijn genot aan anderen afstaan.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557m
  - number: 1557m.4
    text: |-
      De zaak is voor risico van de koper van de aflevering af. Het
      [tweede, derde en vierde lid van artikel 10 van Boek 7][ref1] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028751#Artikel10
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557m
    references:
      - id: ref1
        bwb_id: BWBR0028751
        artikel: '10'
  - number: 1557m.5
    text: |-
      Van deze bepalingen kan bij overeenkomst worden afgeweken. Van het vierde lid kan echter bij een consumentenkoop
      niet ten nadele van de koper worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557m
  - number: 1557n.1
    text: |-
      De vruchten, welke de zaak tijdens het genot oplevert, behoren de koper toe. Voor zover bij de akte van huurkoop
      hiervan is afgeweken, heeft de koper niettemin het genot der vruchten, indien niet anders is overeengekomen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557n
  - number: 1557n.2
    text: |-
      De burgerlijke vruchten worden, voor zover niet anders is overeengekomen, gerekend van dag tot dag verkregen te
      worden en de koper toe te behoren, naarmate zijn genot duurt, welk ook het tijdstip moge wezen, waarop dezelve
      betaalbaar zijn.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557n
  - number: 1557n.3
    text: |-
      De verplichting tot teruggave van de in huurkoop afgeleverde zaak omvat die tot teruggave van de vruchten, welke de
      verkoper toebehoren.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557n
  - number: 1557o
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557o
  - number: 1557p
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557p
  - number: 1557q
    text: |-
      Ontbinding van huurkoop, of teruggave van een in huurkoop gehouden zaak krachtens daartoe gemaakt beding, kan,
      wegens niet tijdige nakoming door de koper van zijn verplichtingen, niet worden ingeroepen of gevorderd, tenzij de
      koper, na in gebreke te zijn gesteld, nalatig blijft om zijn verplichtingen na te komen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557q
  - number: 1557r
    text: |-
      Wanneer de verkoper ontbinding van de overeenkomst of teruggave van de in huurkoop afgeleverde zaak kan vorderen,
      zal hij, indien er redelijk belang bestaat bij onverwijlde voorziening, een rechtelijk bevel tot teruggave bij
      voorraad kunnen verkrijgen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557r
  - number: 1557s
    text: |-
      Indien, wegens het niet nakomen door de koper van zijn verplichtingen, de in huurkoop afgeleverde zaak krachtens
      daartoe gemaakt beding wordt teruggenomen, heeft dit ontbinding van de overeenkomst tot gevolg, tenzij tussen
      partijen anders overeengekomen is.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557s
  - number: 1557t
    text: |-
      Indien bij ontbinding van de overeenkomst wegens het niet nakomen door de koper van zijn verplichtingen de
      verkoper in betere vermogenstoestand zou geraken dan bij het in stand blijven van de overeenkomst, vindt volledige
      verrekening plaats.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557t
  - number: 1557u
    text: |-
      Indien bij ontbinding der overeenkomst de koper recht mocht hebben op enige terugbetaling, kan hij door de rechter
      worden gemachtigd de zaak, die hij terug moet geven, onder zich te houden, totdat het hem verschuldigde wordt
      betaald of de verkoper daarvoor voldoende zekerheid heeft gesteld.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557u
  - number: 1557v.1
    text: |-
      Indien wegens niet-betaling van verschenen termijnen de in huurkoop afgeleverde zaak is teruggenomen zonder
      voorafgaande rechterlijke tussenkomst, kan de koper gedurende veertien dagen na de terugneming de zaak inlossen,
      door betaling van de verschenen termijnen en de verschuldigde rente, boeten en kosten.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557v
  - number: 1557v.2
    text: Mocht de overeenkomst zijn ontbonden, dan wordt dit door de inlossing ongedaan gemaakt.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557v
  - number: 1557v.3
    text: |-
      Bij herhaling van het in het eerste lid genoemde geval heeft de koper het recht van inlossing alleen onder
      volledige betaling.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557v
  - number: 1557v.4
    text: |-
      Aan de vordering tot inlossing, anders dan onder volledige betaling, behoeft de verkoper niet te voldoen, indien
      omstandigheden aanwezig zijn, die tot toepassing van [artikel 1557r][ref1] aanleiding zouden geven.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1557r
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557v
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1557r
        afdeling: '2'
  - number: 1557v.5
    text: Van de bepalingen van dit artikel kan ten voordele van de koper door partijen worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557v
  - number: 1557w.1
    text: |-
      In het vonnis, waarbij de verplichting tot teruggave van een in huurkoop afgeleverde zaak wordt vastgesteld of de
      overeenkomst wordt ontbonden, kan een bevel tot teruggave worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557w
  - number: 1557x.1
    text: |-
      Bij het vonnis, dat bevel tot teruggave uit kracht van huurkoop inhoudt, kan de geldswaarde der terug te geven zaak
      worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557x
  - number: 1557x.2
    text: In dat geval kan de tenuitvoerlegging ook door uitwinning geschieden.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1557x
  - number: 1558 t/m 1563
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1558_tm_1563
  - number: '1564'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1564
  - number: '1565.1'
    text: |-
      Huur en verhuur is een overeenkomst, waarbij de ene partij zich verbindt om de andere het genot ener zaak te doen
      hebben, gedurende een bepaalde tijd en tegen een bepaalde prijs, welke de laatstgemelde aanneemt te betalen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1565
  - number: '1565.2'
    text: Men kan allerlei soort van zaken hetzij onroerende, hetzij roerende, verhuren.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1565
  - number: '1566'
    text: |-
      De bepalingen van deze en de volgende afdeling zijn mede van toepassing op de huur van vermogensrechten, voor zover
      de strekking van die bepalingen of de aard van het recht zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1566
  - number: '1567'
    text: |-
      De verhuurder is door de aard van de overeenkomst, en zonder dat daartoe enig bijzonder beding vereist wordt,
      verplicht:
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1567
  - number: 1567.1°
    text: om het verhuurde aan de huurder ter beschikking te stellen;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1567
  - number: 1567.2°
    text: om hetzelve te onderhouden in zodanige staat, dat het tot het gebruik, waartoe het verhuurd is, dienen kan;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1567
  - number: 1567.3°
    text: om de huurder het rustige genot daarvan te doen hebben, zolang de huur duurt.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1567
  - number: '1568.1'
    text: |-
      De verhuurder is gehouden de verhuurde zaak in alle opzichten in goede staat van onderhoud ter beschikking te
      stellen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1568
  - number: '1568.2'
    text: |-
      Hij moet daaraan, gedurende de huurtijd, alle reparatiën laten doen, welke noodzakelijk mochten worden, met
      uitzondering van degene, tot welke de huurder verplicht is.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1568
  - number: '1569.1'
    text: |-
      De verhuurder moet de huurder instaan voor alle gebreken van de verhuurde zaak, welke het gebruik daarvan
      verhinderen, al mocht ook de verhuurder dezelve tijdens het doen der verhuring niet gekend hebben.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1569
  - number: '1569.2'
    text: |-
      Indien door die gebreken enig nadeel voor de huurder ontstaat, is de verhuurder gehouden hem deswege schadeloos
      te stellen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1569
  - number: '1570'
    text: |-
      Indien, gedurende de huurtijd, de verhuurde zaak door enig toeval geheel en al vergaan is, vervalt de
      huurovereenkomst van rechtswege. Indien de zaak slechts ten dele vergaan is, heeft de huurder de keus om, naar
      gelang der omstandigheden, of vermindering van de huurprijs te vorderen of de huurovereenkomst te ontbinden; doch
      hij kan, dier beide gevallen, aanspraak op schadevergoeding maken.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1570
  - number: '1571'
    text: De verhuurder mag, gedurende de huurtijd, de gedaante of inrichting van de verhuurde zaak niet veranderen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1571
  - number: '1572.1'
    text: |-
      Indien, gedurende de huurtijd, de verhuurde zaak dringende reparatiën nodig heeft, welke niet tot na het eindigen
      der huur kunnen worden uitgesteld, moet de huurder dezelve gedogen, welke ongemakken hem ook hierdoor worden
      veroorzaakt, en hoewel hij ook, gedurende het doen dier reparatiën, van een gedeelte van de verhuurde zaak
      verstoken zij.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1572
  - number: '1572.2'
    text: |-
      Doch indien deze reparatiën langer dan veertig dagen duren, zal de huurprijs verminderd worden naar evenredigheid
      van de tijd, en van het gedeelte van de verhuurde zaak, waarvan de huurder zal zijn verstoken geweest.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1572
  - number: '1572.3'
    text: |-
      Indien de reparatiën van dien aard zijn, dat daardoor het gehuurde, hetgeen de huurder en zijn huisgezin ter
      bewoning noodzakelijk is, onbewoonbaar wordt, kan dezelve de huur doen verbreken.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1572
  - number: '1573'
    text: |-
      De verhuurder is niet verplicht de huurder te waarborgen tegen de belemmeringen, welke hem derden, door
      feitelijkheden, in zijn genot toebrengen, zonder overigens enig recht op het gehuurde te beweren; behoudens het
      recht van de huurder om dezelve uit eigen hoofde te vervolgen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1573
  - number: '1574'
    text: |-
      Indien daarentegen de huurder in deszelfs genot is gestoord geworden tengevolge ener rechtsvordering, welke tot de
      eigendom van de zaak betrekking heeft, heeft hij het recht om een geëvenredigde vermindering van de huurprijs te
      vorderen, mits van die stoornis of belemmering aan de eigenaar behoorlijk kennis gegeven zij.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1574
  - number: '1575'
    text: |-
      Indien degenen, die de feitelijkheden gepleegd hebben, enig recht ten aanzien van de verhuurde zaak beweren te
      hebben, of indien de huurder zelf in rechten gedagvaard is om tot ontruiming van het geheel of van een gedeelte van
      de zaak verwezen te worden, of om de uitoefening van enige erfdienstbaarheid of een ander recht ten aanzien van de
      zaak te gedogen, moet hij de verhuurder daarvan betekening doen, en hij kan dezelve tot vrijwaring oproepen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1575
  - number: '1576.1'
    text: |-
      De huurder mag, indien hem dit vermogen niet is toegestaan, het goed niet weder verhuren, noch zijn huur aan een
      ander afstaan.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1576
  - number: '1576.2'
    text: |-
      Indien het gehuurde in een huis of in een woning bestaat, welke de huurder zelf bewoont, kan hij een gedeelte
      daarvan, onder zijn verantwoordelijkheid, aan een ander verhuren, indien hem dat vermogen niet bij de overeenkomst
      is ontzegd geworden.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1576
  - number: '1577'
    text: 'De huurder is tot twee hoofdverplichtingen gehouden:'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1577
  - number: 1577.1°
    text: |-
      om het gehuurde als een goed huurder te gebruiken, en overeenkomstig de bestemming, welke daaraan bij de
      huurovereenkomst gegeven is, of volgens die, welke, bij gebreke van overeenkomst daaromtrent, naar gelang der
      omstandigheden voorondersteld wordt;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1577
  - number: 1577.2°
    text: om de huurprijs op de bepaalde termijnen te voldoen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1577
  - number: '1578'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1578
  - number: '1579'
    text: |-
      Indien tussen de verhuurder en de huurder een beschrijving van het verhuurde is opgemaakt, is laatstgenoemde
      gehouden de zaak in die staat weder op te leveren, waarin hij deze, volgens die beschrijving, heeft aanvaard; met
      uitzondering van hetgeen door ouderdom of door onvermijdelijke toevallen vergaan of van waarde verminderd is.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1579
  - number: '1580'
    text: |-
      Indien geen beschrijving is opgemaakt, wordt de huurder, ten aanzien van het onderhoud, hetwelk ten laste van
      huurders komt, behoudens tegenbewijs, voorondersteld het gehuurde in goede staat te hebben aanvaard, en moet hij
      hetzelve in die staat teruggeven.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1580
  - number: '1581.1'
    text: |-
      De huurder is aansprakelijk voor schade aan de verhuurde zaak die is ontstaan door een hem toe te rekenen
      tekortschieten in de nakoming van een verplichting uit de huurovereenkomst.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1581
  - number: '1581.2'
    text: Alle schade behalve brandschade wordt vermoed daardoor te zijn ontstaan.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1581
  - number: '1582'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1582
  - number: '1583'
    text: |-
      De huurder is jegens de verhuurder op gelijke wijze als voor eigen gedragingen aansprakelijk voor de gedragingen
      van hen die met zijn goedvinden het gehuurde gebruiken of zich met zijn goedvinden daarop bevinden.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1583
  - number: '1584'
    text: |-
      De huurder mag, bij ontruiming van de verhuurde zaak, afbreken en naar zich nemen al hetgeen hij daaraan, op zijn
      kosten, heeft doen maken, mits zulks gedaan worde zonder beschadiging van de zaak.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1584
  - number: '1585'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1585
  - number: '1586'
    text: |-
      Wanneer er geschil ontstaat over de prijs ener verhuring, bij monde aangegaan, waarvan de uitvoering begonnen is,
      en er geen kwijting aanwezig is, moet de verhuurder op zijn eed geloofd worden, tenware de huurder mocht verkiezen
      de huurprijs door deskundigen te doen begroten.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1586
  - number: '1587'
    text: |-
      Indien de huur bij geschrift is aangegaan, houdt dezelve van rechtswege op, wanneer de bepaalde tijd verstreken is,
      zonder dat daartoe een opzegging vereist worde.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1587
  - number: '1588'
    text: |-
      Indien de huur zonder geschrift is aangegaan, houdt dezelve op de bepaalde tijd niet op, dan voor zover de
      ene partij aan de andere de huur heeft opgezegd, met inachtneming der termijnen, welke bij algemeen verbindend
      voorschrift of plaatselijke keur bepaald zijn, of welke, bij gebreke van zodanige verordening of keur, het
      plaatselijk gebruik medebrengt.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1588
  - number: '1589'
    text: |-
      Wanneer de ene partij aan de andere een opzegging van huur heeft betekend, kan de huurder, hoewel in het genot
      blijvende, zich niet beroepen op een stilzwijgende wederinhuring.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1589
  - number: '1590'
    text: |-
      Indien, na het eindigen van een verhuring bij geschrift aangegaan, de huurder in het genot is gebleven en gelaten,
      ontstaat daardoor een nieuwe huur, waarvan de gevolgen geregeld worden bij de artikelen tot mondelinge verhuringen
      betrekkelijk.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1590
  - number: '1591'
    text: |-
      In het geval der twee voorgaande artikelen strekt zich de borgtocht, voor de huur gesteld, niet uit tot de
      verplichtingen, die uit de verlenging der huur ontstaan.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1591
  - number: '1592'
    text: De huurovereenkomst gaat geenszins teniet door de dood van de verhuurder, noch die van de huurder.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1592
  - number: '1593.1'
    text: |-
      Door verkoop van het verhuurde wordt een tevoren aangegane huur niet verbroken, tenware dit bij de verhuring mocht
      voorbehouden zijn.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1593
  - number: '1593.2'
    text: |-
      Bij zodanig voorbehoud kan de huurder, zonder uitdrukkelijk beding, geen aanspraak op vergoeding maken, maar met
      dat laatste beding is hij niet tot ontruiming van het gehuurde verplicht, zolang de verschuldigde vergoeding niet
      is gekweten.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1593
  - number: '1594'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1594
  - number: '1595.1'
    text: |-
      Een koper, die gebruik wil maken van de bevoegdheid, bij de huurovereenkomst voorbehouden, om, in geval van
      verkoop, de huurder tot ontruiming van het gehuurde te noodzaken, is verplicht de huurder zodanige tijd tevoren te
      waarschuwen, als bij algemeen verbindend voorschrift of plaatselijke keur tot het doen van opzeggingen geregeld is,
      of, bij gebreke van zodanige verordening of keur, het plaatselijk gebruik medebrengt.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1595
  - number: '1595.2'
    text: Bij huur van landerijen moet de waarschuwing ten minste een jaar aan de ontruiming voorafgaan.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1595
  - number: '1596'
    text: |-
      De verhuurder kan de huur niet doen ophouden door te verklaren, dat hij de verhuurde zaak zelf wil betrekken,
      tenware het tegendeel mocht bedongen zijn.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1596
  - number: '1597'
    text: |-
      Indien men bij de huurovereenkomst is overeengekomen, dat de gehuurde zaak de bevoegdheid zoude hebben om het
      verhuurde huis of land zelf te betrekken, is hij verplicht vooraf een opzegging te doen betekenen, zoveel tijd
      tevoren als bij [artikel 1595][ref1] is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1595
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1597
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: '1595'
        afdeling: '2'
  - number: '1598.1'
    text: Deze afdeling is uitsluitend van toepassing op huur en verhuur van woningen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1598
  - number: '1598.2'
    text: |-
      Onder huur en verhuur van een woning wordt verstaan de overeenkomst waarbij de ene partij, de verhuurder, zich
      verbindt aan de andere partij, de huurder, een woning in gebruik te verstrekken en de huurder zich verbindt tot
      een tegenprestatie.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1598
  - number: '1598.3'
    text: |-
      Onder huurcommissie wordt verstaan de huurcommissie, bedoeld in
      [artikel 1.4 van de Wet maatregelen huurwoningmarkt Caribisch Nederland][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039553#Artikel1
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1598
    references:
      - id: ref1
        bwb_id: BWBR0039553
        artikel: '1'
  - number: '1598.4'
    text: Onder huurprijs wordt verstaan de prijs die is verschuldigd voor het enkele gebruik van de woning.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1598
  - number: '1598.5'
    text: |-
      Onder servicekosten wordt verstaan de vergoeding voor de zaken en diensten die geleverd worden in verband met de
      bewoning van de woning.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1598
  - number: '1598.6'
    text: |-
      Onder woning wordt verstaan ieder gebouw of elk gedeelte van een gebouw dat afzonderlijk wordt verhuurd, alsmede
      elk perceel huurgrond voor het hebben daarop van woning.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1598
  - number: '1599'
    text: |-
      Deze afdeling is niet van toepassing op huur welke een gebruik van een woning betreft dat naar zijn aard slechts
      van korte duur is.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1599
  - number: '1600.1'
    text: Geringe en dagelijkse reparatiën zijn voor rekening van de huurder.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1600
  - number: '1600.2'
    text: |-
      Bij gebreke van een overeenkomst worden als zodanig aangemerkt reparatiën aan de sluiting van de luiken of blinden,
      de binnensloten, de vensterglazen binnen- en buitenshuis, en al hetgeen verder door het plaatselijk gebruik
      daaronder begrepen wordt.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1600
  - number: '1600.3'
    text: |-
      Niettemin komen die reparatiën ten laste van de verhuurder, indien zij door de vervallen toestand van het verhuurde
      of door overmacht noodzakelijk zijn geworden.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1600
  - number: '1601'
    text: |-
      De huur van meubelen om een geheel huis, een gehele woning, of enig ander vertrek, daarmede te stofferen wordt
      gehouden voor zo lang te zijn aangegaan, als de huizen, de woningen of vertrekken, volgens plaatselijk gebruik,
      doorgaans verhuurd worden.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1601
  - number: '1602.1'
    text: |-
      De huur van gestoffeerde kamers wordt gehouden bij het jaar te zijn aangegaan, wanneer dezelve is aangegaan voor
      een zekere som in het jaar; bij de maand, wanneer dezelve is aangegaan tegen een bepaalde som in de maand; bij de
      dag, wanneer dezelve is aangegaan tegen een bepaalde som voor iedere dag.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1602
  - number: '1602.2'
    text: |-
      Indien niet blijkt, dat de huur voor een zekere som bij het jaar, bij de maand of voor iedere dag is aangegaan,
      wordt dezelve geacht volgens plaatselijk gebruik te zijn gesloten.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1602
  - number: 1602a
    text: |-
      Indien de huurder van een huis of vertrek, na het eindigen van de huurtijd, bij schriftelijke overeenkomst
      bepaald, in het bezit van het gehuurde blijft, zonder dat zich de verhuurder daartegen verzet, wordt hij geacht het
      verhuurde op dezelfde voorwaarden te blijven behouden voor de tijd, welke bij algemeen verbindend voorschrift of
      plaatselijke keur geregeld is, of bij gebreke daarvan het plaatselijk gebruik medebrengt, en kan hij het verhuurde
      niet verlaten, noch daaruit gezet worden, dan na een tijdige opzegging, overeenkomstig de verordening, de keur of
      het plaatselijk gebruik gedaan.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1602a
  - number: 1602b.1
    text: |-
      In openbare lichamen waarvoor [hoofdstuk 1 van de Wet maatregelen huurwoningmarkt Caribisch Nederland][ref1] niet
      in werking is getreden, zijn van deze titel slechts de [artikelen 1600 tot en met 1602b][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039553#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0028752#Artikel1600
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1602b
    references:
      - id: ref1
        bwb_id: BWBR0039553
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0028752
        artikel: '1600'
        paragraaf: '1'
        afdeling: '3'
  - number: 1602b.2
    text: |-
      [Artikel 1602a][ref1] is niet van toepassing in openbare lichamen waarvoor
      [hoofdstuk 1 van de Wet maatregelen huurwoningmarkt Caribisch Nederland][ref2] in werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1602a
      [ref2]: https://wetten.overheid.nl/BWBR0039553#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1602b
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1602a
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0039553
        hoofdstuk: '1'
  - number: 1602b.3
    text: |-
      [Artikel 1602a][ref1] en dit artikel vervallen wanneer voor alle openbare lichamen
      [hoofdstuk 1 van de Wet maatregelen huurwoningmarkt Caribisch Nederland][ref2] in werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1602a
      [ref2]: https://wetten.overheid.nl/BWBR0039553#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1602b
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1602a
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0039553
        hoofdstuk: '1'
  - number: '1603.1'
    text: |-
      In [hoofdstuk 1 van de Wet maatregelen huurwoningmarkt Caribisch Nederland][ref1] worden nadere regels gegeven
      aangaande huurprijzen en andere vergoedingen.


      [ref1]: https://wetten.overheid.nl/BWBR0039553#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603
    references:
      - id: ref1
        bwb_id: BWBR0039553
        hoofdstuk: '1'
  - number: '1603.2'
    text: |-
      Ter zake van huur gelden de huurprijzen die partijen zijn overeengekomen, voor zover uit deze onderafdeling niet
      anders voortvloeit.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603
  - number: '1603.3'
    text: |-
      De volgende artikelen van deze onderafdeling en [onderafdeling 3][ref1] zijn, behoudens de [artikelen 1603b][ref2],
      [1603d][ref3], [1603k][ref4] en [1603l][ref5], niet van toepassing op een overeenkomst van huur en
      verhuur, die betrekking heeft op een woning, ten aanzien waarvan bij de aanvang van de bewoning een
      huurprijs gold of geldt, die, indien nodig herleid tot een bedrag per jaar, hoger is dan het krachtens
      [1.3, derde lid, van de Wet maatregelen huurwoningmarkt Caribisch Nederland][ref6] vastgestelde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Afdeling3
      [ref2]: https://wetten.overheid.nl/BWBR0028752#Artikel1603b
      [ref3]: https://wetten.overheid.nl/BWBR0028752#Artikel1603d
      [ref4]: https://wetten.overheid.nl/BWBR0028752#Artikel1603k
      [ref5]: https://wetten.overheid.nl/BWBR0028752#Artikel1603l
      [ref6]: https://wetten.overheid.nl/BWBR0039553#Artikel1
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603
    references:
      - id: ref1
        bwb_id: BWBR0028752
        paragraaf: '3'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0028752
        artikel: 1603b
        paragraaf: '2'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0028752
        artikel: 1603d
        paragraaf: '2'
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0028752
        artikel: 1603k
        paragraaf: '3'
        afdeling: '3'
      - id: ref5
        bwb_id: BWBR0028752
        artikel: 1603l
        paragraaf: '3'
        afdeling: '3'
      - id: ref6
        bwb_id: BWBR0039553
        artikel: '1'
  - number: 1603a.1
    text: |-
      De huurprijs kan worden verhoogd hetzij op grond van een beding in de huurovereenkomst dat in deze wijziging
      voorziet, hetzij indien een dergelijk beding niet van kracht is, op de wijze als voorgeschreven in de
      [artikelen 1603e][ref1] en [1603f][ref2]. Gedurende het bestaan van een dergelijk beding is toepassing van die
      artikelen uitgesloten. Indien een dergelijk beding niet meer van kracht is, kan vanaf een tijdvak van twaalf
      maanden na het tijdstip waarop laatstelijk toepassing is gegeven aan het beding, aan de hiervoor genoemde artikelen
      toepassing worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1603e
      [ref2]: https://wetten.overheid.nl/BWBR0028752#Artikel1603f
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603a
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1603e
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0028752
        artikel: 1603f
        paragraaf: '2'
        afdeling: '3'
  - number: 1603a.2
    text: |-
      Leidt toepassing van een beding als bedoeld in lid 1 tot verhoging van de huurprijs
      met een hoger percentage dan het maximale huurverhogingspercentage, bedoeld in
      [artikel 1.13, derde lid, van de Wet maatregelen huurwoningmarkt Caribisch Nederland][ref1], dan is het beding
      nietig voor zover zij tot dit hogere percentage leidt en geldt de huurprijs als verhoogd met dat maximale
      huurverhogingspercentage.


      [ref1]: https://wetten.overheid.nl/BWBR0039553#Artikel1
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603a
    references:
      - id: ref1
        bwb_id: BWBR0039553
        artikel: '1'
  - number: 1603b
    text: |-
      De huurder kan tot uiterlijk zes maanden na het tijdstip waarop een door hem met betrekking tot die woonruimte
      voor de eerste maal aangegane huurovereenkomst is ingegaan, de huurcommissie verzoeken uitspraak te doen over de
      redelijkheid van de overeengekomen huurprijs.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603b
  - number: 1603c.1
    text: |-
      De huurprijs kan op verzoek van de verhuurder worden verhoogd op de wijze voorgeschreven in de
      [artikelen 1603e][ref1] en [1603f][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1603e
      [ref2]: https://wetten.overheid.nl/BWBR0028752#Artikel1603f
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603c
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1603e
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0028752
        artikel: 1603f
        paragraaf: '2'
        afdeling: '3'
  - number: 1603c.1.a
    text: gedurende het eerste tijdvak van twaalf maanden na de dag van ingang van de huur ten hoogste eenmaal, en
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603c
  - number: 1603c.1.b
    text: |-
      telkens tegen het einde van elkaar opvolgende tijdvakken van twaalf maanden na hetzij het ingaan van de onder a
      bedoelde verhoging, hetzij bij gebreke van zodanige verhoging de dag van ingang van de huur.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603c
  - number: 1603c.2
    text: |-
      Een verhoging van de huurprijs krachtens lid 1 is niet mogelijk, zolang er tussen huurder en
      verhuurder geen overeenstemming is dat de, bij toepassing van de [artikelen 1.15][ref1] en
      [1.19 van de Wet maatregelen huurwoningmarkt Caribisch Nederland][ref2] geconstateerde gebreken ten aanzien van de
      woonruimte zijn opgeheven.


      [ref1]: https://wetten.overheid.nl/BWBR0039553#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0039553#Artikel1
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603c
    references:
      - id: ref1
        bwb_id: BWBR0039553
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0039553
        artikel: '1'
  - number: 1603c.3
    text: |-
      In afwijking van lid 1 kan de huurprijs worden verhoogd tegen het einde van een tijdvak dat even zoveel korter dan
      twaalf maanden is als het daaraan voorafgaande tijdvak langer dan twaalf maanden is geweest.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603c
  - number: 1603c.4
    text: |-
      De huurprijs kan op verzoek van de huurder worden verlaagd op de wijze voorgeschreven in de [artikelen 1603e][ref1]
      en [1603g][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1603e
      [ref2]: https://wetten.overheid.nl/BWBR0028752#Artikel1603g
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603c
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1603e
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0028752
        artikel: 1603g
        paragraaf: '2'
        afdeling: '3'
  - number: 1603d
    text: |-
      Bepalingen in huurovereenkomsten die tot gevolg hebben dat de huurprijs in enig tijdvak van twaalf maanden meer dan
      eenmaal wordt verhoogd, zijn nietig, tenzij het gaat om het geval van [artikel 1603h][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1603h
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603d
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1603h
        paragraaf: '2'
        afdeling: '3'
  - number: 1603e.1
    text: |-
      Een voorstel tot wijziging van de huurprijs moet tenminste twee maanden voor de voorgestelde dag van ingang van de
      wijziging schriftelijk worden gedaan.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603e
  - number: 1603e.2
    text: 'Het in lid 1 bedoelde voorstel dient te vermelden:'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603e
  - number: 1603e.2.a
    text: de geldende huurprijs;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603e
  - number: 1603e.2.b
    text: het percentage of het bedrag van de wijziging van de huurprijs;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603e
  - number: 1603e.2.c
    text: de voorgestelde huurprijs;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603e
  - number: 1603e.2.d
    text: de voorgestelde dag van ingang van de voorgestelde huurprijs;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603e
  - number: 1603e.2.e
    text: |-
      de wijze waarop en het tijdvak waarbinnen de huurder, wanneer hij bezwaren heeft tegen het voorstel, daarvan kan
      doen blijken, en de gevolgen die deze onderafdeling verbindt aan het niet doen blijken van bezwaren.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603e
  - number: 1603e.2
    text: |-
      Indien een overeenkomst tot wijziging van de huurprijs tot stand komt naar aanleiding van een voorstel daartoe, dat
      niet voldoet aan lid 1 aanhef en onder b, d of e, blijft de voordien geldende huurprijs verschuldigd, tenzij blijkt
      dat degene tot wie het voorstel was gericht niet door het verzuim is benadeeld.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603e
  - number: 1603f.1
    text: |-
      Indien de huurder voor het tijdstip waarop de verhoging van de huurprijs blijkens het voorstel had moeten ingaan,
      schriftelijk verklaart met het voorstel van de verhuurder niet in te stemmen, kan de verhuurder tot zes weken na
      dat tijdstip onder overlegging van een afschrift van dat voorstel en van voornoemde verklaring van de huurder de
      huurcommissie verzoeken uitspraak te doen over de redelijkheid van het voorstel.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603f
  - number: 1603f.2
    text: |-
      De huurder kan de huurcommissie binnen vier maanden na het in lid 1 bedoelde tijdstip verzoeken uitspraak te doen
      over de redelijkheid van het voorstel, indien:
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603f
  - number: 1603f.2.a
    text: |-
      hij noch vóór het in lid 1 bedoelde tijdstip de daar bedoelde schriftelijke verklaring doet, noch door het betalen
      van de voorgestelde huurverhoging doet blijken met die verhoging in te stemmen, en
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603f
  - number: 1603f.2.b
    text: |-
      de verhuurder hem binnen drie maanden na het in lid 1 bedoelde tijdstip bij aangetekend schrijven nogmaals van het
      voorstel in kennis heeft gesteld, waarbij een afschrift van het voorstel is gevoegd, en hij met het voorstel tot
      huurverhoging niet instemt.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603f
  - number: 1603f.3
    text: |-
      De huurder wordt geacht de voorgestelde verhoging van de huurprijs met ingang van de in het voorstel genoemde datum
      van ingang met de verhuurder te zijn overeengekomen indien hij, na ontvangst van het in het tweede lid bedoelde
      schrijven, niet binnen vier maanden na die datum van ingang een verzoek tot de huurcommissie heeft gericht.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603f
  - number: 1603f.4
    text: |-
      Indien de huurder het in het tweede lid bedoelde verzoek doet, stelt de huurcommissie de verhuurder daarvan
      onverwijld in kennis.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603f
  - number: 1603f.5
    text: |-
      Indien de verhuurder een voorstel als bedoeld in [artikel 1603e][ref1] bij aangetekend schrijven heeft gedaan,
      kan hij, indien voldaan is aan lid 2 onder a, binnen zes weken na het in lid 1 bedoelde tijdstip de huurcommissie
      verzoeken uitspraak te doen over de redelijkheid van het voorstel. De verhuurder legt bij dit verzoek een afschrift
      over van het voorstel en een bewijs van aangetekende verzending.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1603e
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603f
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1603e
        paragraaf: '2'
        afdeling: '3'
  - number: 1603g
    text: |-
      Indien de verhuurder met een voorstel van de huurder tot verlaging van de huurprijs niet instemt, kan de
      huurder tot uiterlijk zes weken na het tijdstip waarop de verlaging blijkens het voorstel had moeten ingaan, de
      huurcommissie verzoeken uitspraak te doen over de redelijkheid van het voorstel.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603g
  - number: 1603h.1
    text: 'De huurprijs van woonruimte waarin of waaraan gedurende de huurtijd door of vanwege de verhuurder:'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603h
  - number: 1603h.1.a
    text: |-
      voorzieningen zijn aangebracht die verband houden met een maatregel die gericht is op het opheffen of verminderen
      van beperkingen die een gehandicapte, bij het normale gebruik van zijn woonruimte ondervindt, in de kosten waarvan
      ingevolge enige wettelijke regeling een financiële tegemoetkoming is verleend, of
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603h
  - number: 1603h.1.b
    text: |-
      veranderingen of toevoegingen, waaronder niet wordt verstaan het verhelpen van gebreken als bedoeld in
      [artikel 1569][ref1], zijn aangebracht, waardoor het woongerief geacht kan worden te zijn gestegen en die niet
      ingrepen zijn als bedoeld onder a, is de huurprijs, vermeerderd met een bedrag dat in redelijke verhouding
      staat tot de door de verhuurder gemaakte kosten van deze ingrepen, veranderingen of toevoegingen met dien
      verstande dat de nieuwe huurprijs niet hoger mag zijn dan die welke bij toepassing van de regels bedoeld in
      [artikel 1.13, eerste lid, van de Wet maatregelen huurwoningmarkt Caribisch Nederland][ref2] als redelijk is aan
      te merken.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1569
      [ref2]: https://wetten.overheid.nl/BWBR0039553#Artikel1
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603h
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: '1569'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0039553
        artikel: '1'
  - number: 1603h.2
    text: |-
      Indien partijen geen overeenstemming hebben kunnen bereiken over het bedrag van de verhoging, kan ieder van hen
      binnen drie maanden na de totstandkoming van de ingrepen, veranderingen of toevoegingen de huurcommissie verzoeken
      daarover een uitspraak te doen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603h
  - number: 1603h.3
    text: |-
      Onder gehandicapte in het eerste lid wordt verstaan een persoon die ten gevolge van ziekte of gebrek aantoonbare
      beperkingen ondervindt.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603h
  - number: 1603i.1
    text: |-
      Voor de vordering van de huurder tot vermindering van de huurprijs op grond van [artikel 1574][ref1] geldt een met
      inachtneming van de volgende leden toe te passen vervaltermijn van zes maanden na de aanvang van de dag volgend op
      die waarop de huurder van het gebrek kennis heeft gegeven aan de verhuurder.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1574
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603i
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: '1574'
        afdeling: '2'
  - number: 1603i.2
    text: |-
      Is de vordering van de huurder gegrond op een tekortkoming die krachtens [artikel 1569][ref1] als een gebrek heeft
      te gelden, dan kan de huurder, in plaats van zijn vordering binnen de in lid 1 bedoelde termijn bij de rechter
      in te stellen, binnen zes maanden na de aanvang van de dag volgend op die waarop de huurder van het gebrek heeft
      kennis gegeven aan de verhuurder, de huurcommissie verzoeken over de vermindering uitspraak te doen overeenkomstig
      de in [artikel 1.15, tweede lid, van de Wet maatregelen huurwoningmarkt Caribisch Nederland][ref2] bedoelde
      eilandsverordening. De huurder kan eerst een verzoek tot de huurcommissie richten, indien de verhuurder niet binnen
      zes weken na de aanvang van de dag volgend op die waarop de huurder van het gebrek kennis heeft gegeven aan de
      verhuurder, het gebrek heeft verholpen.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1569
      [ref2]: https://wetten.overheid.nl/BWBR0039553#Artikel1
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603i
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: '1569'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0039553
        artikel: '1'
  - number: 1603i.3
    text: |-
      Na het verstrijken van de in de voorgaande leden bedoelde termijn van zes maanden kan, voor wat het verleden
      betreft, geen huurvermindering worden verlangd over een langere periode dan zes maanden, voorafgaande aan het
      instellen van de vordering of het indienen van het verzoek.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603i
  - number: 1603j
    text: |-
      Indien de huurovereenkomst meer omvat dan het enkele gebruik van de woning en bij die overeenkomst slechts de
      hoogte van de prijs en niet die van de huurprijs is vastgesteld, kan de huurder de huurcommissie verzoeken de
      huurprijs en het voorschotbedrag aan servicekosten vast te stellen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603j
  - number: 1603k.1
    text: |-
      Indien de huurder en de verhuurder geen overeenstemming hebben kunnen bereiken over een betalingsverplichting van
      de huurder met betrekking tot de servicekosten, kan de huurder of verhuurder de huurcommissie verzoeken uitspraak
      daarover te doen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603k
  - number: 1603k.2
    text: |-
      De verhuurder verstrekt aan de huurder elk jaar, uiterlijk zes maanden na het verstrijken van een kalenderjaar,
      een overzicht van de in dat kalenderjaar in rekening gebrachte servicekosten, met vermelding van de wijze van
      berekening daarvan.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603k
  - number: 1603k.3
    text: |-
      Het verzoek heeft betrekking op niet meer dan één tijdvak van ten hoogste twaalf maanden en kan worden gedaan tot
      uiterlijk vierentwintig maanden nadat de in het tweede lid genoemde termijn voor het verstrekken van het overzicht
      door de verhuurder is verstreken.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603k
  - number: 1603l.1
    text: |-
      Elk in verband met de totstandkoming van een huurovereenkomst betreffende woonruimte gemaakt beding, niet de
      huurprijs betreffende, voor zover daarbij ten behoeve van een der partijen een niet redelijk voordeel wordt
      overeengekomen, is nietig.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603l
  - number: 1603l.2
    text: |-
      Elk in verband met de totstandkoming van een zodanige huurovereenkomst gemaakt beding, voor zover daarbij door of
      tegenover een derde enig niet redelijk voordeel wordt overeengekomen, is nietig.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603l
  - number: 1603l.3
    text: |-
      Indien sprake is van een beding als bedoeld in het eerste en tweede lid kunnen de verhuurder en de huurder
      de huurcommissie verzoeken uitspraak te doen over de vraag of met dat beding enig niet redelijk voordeel is
      overeengekomen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603l
  - number: 1603m
    text: |-
      Van de bepalingen van de [onderafdelingen 2][ref1] en [3][ref2] kan niet worden afgeweken, tenzij uit die
      bepalingen anders voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Afdeling3
      [ref2]: https://wetten.overheid.nl/BWBR0028752#Afdeling3
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603m
    references:
      - id: ref1
        bwb_id: BWBR0028752
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0028752
        paragraaf: '3'
        afdeling: '3'
  - number: 1603n.1
    text: |-
      In afwijking van [artikel 1587][ref1] eindigt een voor bepaalde tijd voor de duur van langer dan vier jaar
      aangegane huur niet door het enkele verloop van de huurtijd; zij kan door elk van beide partijen worden opgezegd
      tegen een voor de betaling van de huurprijs overeengekomen dag, niet vallend voor het verstrijken van de bepaalde
      tijd. Op een voor bepaalde tijd voor de duur van vier jaar of korter aangegane huur, die schriftelijk wordt
      aangegaan, is artikel 1587 onverkort van toepassing. Indien na afloop van een voor bepaalde tijd aangegane huur met
      dezelfde huurder opnieuw een huurovereenkomst voor bepaalde tijd wordt aangegaan, geldt deze laatste overeenkomst
      als een huurovereenkomst voor onbepaalde tijd.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1587
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603n
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: '1587'
        afdeling: '2'
  - number: 1603n.2
    text: |-
      Een voor onbepaalde tijd aangegane of voor onbepaalde tijd verlengde huur kan door elk van beide partijen worden
      opgezegd tegen een voor de betaling van de huurprijs overeengekomen dag.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603n
  - number: 1603n.3
    text: |-
      De opzegging door de verhuurder moet op straffe van nietigheid de gronden vermelden die tot de opzegging hebben
      geleid. Een opzegging op andere dan de in [artikel 1603p][ref1] genoemde gronden, is nietig. De huurder moet
      bij de opzegging worden gevraagd binnen zes weken aan de verhuurder mede te delen of hij al dan niet toestemt in
      beëindiging van de overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1603g
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603n
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1603g
        paragraaf: '2'
        afdeling: '3'
  - number: 1603n.4
    text: 'Bij de opzegging moeten de volgende termijnen in acht worden genomen:'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603n
  - number: 1603n.4.a
    text: |-
      bij opzegging door de huurder: een termijn gelijk aan de tijd die tussen twee opvolgende voor betaling van de
      huurprijs overeengekomen dagen verstrijkt, doch niet korter dan een maand en niet langer dan drie maanden;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603n
  - number: 1603n.4.b
    text: |-
      bij opzegging door de verhuurder: een termijn niet korter dan drie maanden, voor elk jaar dat de huurder krachtens
      overeenkomst ononderbroken het gehuurde in gebruik heeft gehad verlengd met één maand tot ten hoogste zes maanden.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603n
  - number: 1603n.5
    text: |-
      Een opzegging die in strijd met het eerste, derde of vierde lid, onder a, is gedaan en een opzegging die op een
      kortere termijn is gedaan dan die van het vierde lid, onder b, gelden niettemin als waren zij gedaan tegen de
      voorgeschreven dag en met inachtneming van de voorgeschreven termijn.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603n
  - number: 1603n.6
    text: |-
      Elk beding waarbij in strijd met het vierde lid, onder a, een langere opzegtermijn of waarbij in strijd met het
      vierde lid, onder b, een kortere opzegtermijn wordt overeengekomen of waarbij van andere bepalingen van dit artikel
      wordt afgeweken, is nietig. Eveneens is nietig elk beding dat de huur zonder opzegging doet eindigen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603n
  - number: 1603n.7
    text: Dit artikel geldt niet, indien de beëindiging geschiedt met wederzijds goedvinden nadat de huur is ingegaan.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603n
  - number: 1603o.1
    text: |-
      De verhuurder kan, indien hij zes weken na de opzegging van de overeenkomst niet van de huurder een schriftelijke
      mededeling heeft ontvangen dat hij in de beëindiging van de overeenkomst toestemt, de huurcommissie verzoeken
      het tijdstip vast te stellen waarop de overeenkomst zal eindigen. De verhuurder vermeldt daarbij de naam van de
      huurder en kort de gronden waarop hij meent de huur te moeten opzeggen. De gronden hebben, behoudens het geval,
      bedoeld in [artikel 1603p][ref1], tweede lid, uitsluitend betrekking op het niet voldoen door de huurder aan zijn
      verplichtingen als bedoeld in de tweede en derde afdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1603p
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603o
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1603p
        paragraaf: '4'
        afdeling: '3'
  - number: 1603o.2
    text: |-
      Een opgezegde overeenkomst blijft, tenzij de huurder de overeenkomst heeft opgezegd of na de opzegging door de
      verhuurder schriftelijk in de beëindiging heeft toegestemd, na de dag waartegen is opgezegd van rechtswege van
      kracht, tot onherroepelijk is beslist op een verzoek van de verhuurder als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603o
  - number: 1603o.3
    text: De huurcommissie neemt bij haar beslissing enkel de in de opzegging genoemde gronden in aanmerking.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603o
  - number: 1603o.4
    text: |-
      Indien de huurcommissie het verzoek afwijst, wordt de overeenkomst van rechtswege verlengd. De huurcommissie
      beslist of de overeenkomst voor onbepaalde tijd of voor een door haar vast te stellen bepaalde tijd wordt verlengd.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603o
  - number: 1603o.5
    text: |-
      Indien de huurcommissie het verzoek toewijst, stelt zij tevens het tijdstip van ontruiming vast. De toewijzing
      geldt als een veroordeling tot ontruiming tegen dat tijdstip.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603o
  - number: 1603p.1
    text: 'De huurcommissie wijst het verzoek slechts toe indien:'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603p
  - number: 1603p.1.a
    text: de huurder niet aan zijn in de tweede en derde afdeling omschreven verplichtingen voldoet, en
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603p
  - number: 1603p.1.b
    text: |-
      de koper van de woning gebruik wil maken van de bevoegdheid, bij de overeenkomst voorbehouden om, ingeval
      van verkoop, de huurder tot ontruiming van het gehuurde te noodzaken overeenkomstig het bepaalde in
      [artikel 1595][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1595
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603p
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: '1595'
        afdeling: '2'
  - number: 1603p.2
    text: |-
      Indien de huurcommissie het verzoek toewijst, bepaalt zij, met inachtneming van de termijnen tot het doen van
      opzeggingen, het tijdstip waarop de huur een einde zal nemen en geeft zij een bevel tot ontruiming.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603p
  - number: 1603q.1
    text: |-
      Een onherroepelijk geworden bevel tot ontruiming levert een executoriale titel op, die met toepassing van de
      voorschriften van het [Wetboek van Burgerlijke Rechtsvordering BES][ref1] kan worden ten uitvoer gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028496
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603q
    references:
      - id: ref1
        bwb_id: BWBR0028496
  - number: 1603q.2
    text: De huurcommissie kan het bevel tot ontruiming niet uitvoerbaar bij voorraad verklaren.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603q
  - number: 1603r
    text: Van deze onderafdeling kan niet ten nadele van de huurder worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603r
  - number: 1603s.1
    text: |-
      Wanneer de huurcommissie op een verzoek van de huurder of verhuurder als bedoeld in de [onderafdelingen 2][ref1]
      en [3][ref2] uitspraak heeft gedaan, worden zij geacht te zijn overeengekomen wat in die uitspraak is vastgesteld,
      tenzij een van hen binnen acht weken nadat aan hen afschrift van die uitspraak is verzonden, een beslissing
      van het Gerecht in eerste aanleg van Bonaire, Sint Eustatius en Saba heeft gevorderd over het punt waarover de
      huurcommissie om een uitspraak was verzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Afdeling3
      [ref2]: https://wetten.overheid.nl/BWBR0028752#Afdeling3
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603s
    references:
      - id: ref1
        bwb_id: BWBR0028752
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0028752
        paragraaf: '3'
        afdeling: '3'
  - number: 1603s.2
    text: Tegen een beslissing krachtens dit artikel is geen hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603s
  - number: 1603t
    text: |-
      Een wijziging van de huurprijs, vastgesteld in een uitspraak van de huurcommissie of van het Gerecht in eerste
      aanleg van Bonaire, Sint Eustatius en Saba, mag in rekening worden gebracht met ingang van de in het voorstel tot
      wijziging voorgestelde dag dan wel indien de huurprijs is vastgesteld zonder dat daartoe een voorstel is gedaan,
      de dag waarop vaststelling is verzocht aan de huurcommissie of vaststelling is gevorderd bij het Gerecht in eerste
      aanleg van Bonaire, Sint Eustatius en Saba. Zo in de uitspraak een latere dag van ingang wordt vastgesteld, geldt
      die wijziging met ingang van die latere dag.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603t
  - number: 1603u.1
    text: |-
      Van de uitspraak van de huurcommissie als bedoeld in [onderafdeling 4][ref1] staat zowel aan de huurder als aan de
      verhuurder gedurende acht weken na de dagtekening van de mededeling beroep open bij het Gerecht in eerste aanleg
      van Bonaire, Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Afdeling3
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603u
    references:
      - id: ref1
        bwb_id: BWBR0028752
        paragraaf: '4'
        afdeling: '3'
  - number: 1603u.2
    text: |-
      Tegen een beslissing krachtens dit artikel staat geen ander rechtsmiddel open dan cassatie in het belang van de
      wet.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603u
  - number: 1603v.1
    text: Deze afdeling is uitsluitend van toepassing op huur en verhuur van bedrijfsruimte.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603v
  - number: 1603v.2
    text: 'Onder bedrijfsruimte wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603v
  - number: 1603v.2.a
    text: |-
      een gebouwde onroerende zaak of gedeelte daarvan, die krachtens overeenkomst van huur en verhuur is bestemd voor
      de uitoefening van een kleinhandelsbedrijf, van een restaurant- of cafébedrijf, van een afhaal- of besteldienst of
      van een ambachtsbedrijf, een en ander indien in de verhuurde ruimte een voor het publiek toegankelijk lokaal voor
      rechtstreekse levering van roerende zaken of voor dienstverlening aanwezig is;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603v
  - number: 1603v.2.b
    text: |-
      een gebouwde onroerende zaak of gedeelte daarvan die krachtens zulk een overeenkomst bestemd is voor de uitoefening
      van een hotelbedrijf;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603v
  - number: 1603v.2.c
    text: een onroerende zaak die krachtens zulk een overeenkomst is bestemd voor de uitoefening van een kampeerbedrijf.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603v
  - number: 1603v.3
    text: |-
      Tot de in het tweede lid bedoelde bedrijfsruimte worden ook gerekend de onroerende aanhorigheden, de bij het een en
      ander behorende grond en de, mede gelet op de bestemming van die bedrijfsruimte, afhankelijke woning.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603v
  - number: 1603v.4
    text: |-
      Onder huurcommissie wordt verstaan de huurcommissie, bedoeld in
      [artikel 1.4 van de Wet maatregelen huurwoningmarkt Caribisch Nederland][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039553#Artikel1
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603v
    references:
      - id: ref1
        bwb_id: BWBR0039553
        artikel: '1'
  - number: 1603v.5
    text: Onder huurprijs wordt verstaan de prijs die is verschuldigd voor het enkele gebruik van de bedrijfsruimte.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603v
  - number: 1603w.1
    text: |-
      De [artikelen 1.2][ref1], [1.4 tot en met 1.8][ref2], [1.10 tot en met 1.12][ref3] en
      [1.23 tot en met 1.47 van de Wet maatregelen huurwoningmarkt Caribisch Nederland][ref4], de
      [artikelen 1600 tot en met 1602][ref5], de [artikelen 1603n, eerste tot en met derde lid en zevende lid][ref6],
      [1603o tot en met 1603s][ref7] en [1603u][ref8] zijn van overeenkomstige toepassing op de huur en verhuur van
      bedrijfsruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0039553#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0039553#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0039553#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0039553#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0028752#Artikel1600
      [ref6]: https://wetten.overheid.nl/BWBR0028752#Artikel1603n
      [ref7]: https://wetten.overheid.nl/BWBR0028752#Artikel1603o
      [ref8]: https://wetten.overheid.nl/BWBR0028752#Artikel1603u
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603w
    references:
      - id: ref1
        bwb_id: BWBR0039553
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0039553
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0039553
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0039553
        artikel: '1'
      - id: ref5
        bwb_id: BWBR0028752
        artikel: '1600'
        paragraaf: '1'
        afdeling: '3'
      - id: ref6
        bwb_id: BWBR0028752
        artikel: 1603n
        paragraaf: '4'
        afdeling: '3'
      - id: ref7
        bwb_id: BWBR0028752
        artikel: 1603o
        paragraaf: '4'
        afdeling: '3'
      - id: ref8
        bwb_id: BWBR0028752
        artikel: 1603u
        paragraaf: '5'
        afdeling: '3'
  - number: 1603w.2
    text: 'De termijn van opzegging bedraagt:'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603w
  - number: 1603w.2.a
    text: voor de huurder ten minste een jaar;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603w
  - number: 1603w.2.b
    text: voor de verhuurder ten minste een jaar.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603w
  - number: 1603w.3
    text: |-
      Een opzegging die in strijd met [artikel 1603n, eerste en derde lid, of het tweede lid, onderdeel a][ref1], is
      gedaan en een opzegging die op een kortere termijn is gedaan dan die van het tweede lid, onderdeel b, gelden
      niettemin als waren zij gedaan tegen de voorgeschreven dag en met inachtneming van de voorgeschreven termijn.
      Elk beding waarbij in strijd met het tweede lid, onderdeel a, een langere opzegtermijn of waarbij in strijd met
      het tweede lid, onderdeel b, een kortere opzegtermijn wordt overeengekomen of waarbij van artikel 1603n, eerste
      tot en met derde lid en zevende lid, wordt afgeweken, is nietig. Eveneens is nietig elk beding dat de huur zonder
      opzegging doet eindigen.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1603n
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603w
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1603n
        paragraaf: '4'
        afdeling: '3'
  - number: 1603w.4
    text: |-
      [Hoofdstuk 1 van de Wet maatregelen huurwoningmarkt Caribisch Nederland][ref1] is niet van toepassing ten aanzien
      van zeehavens, luchthavens en op de in het eerste lid bedoelde bedrijfsruimte voor zover deze in een zeehaven of op
      een luchthaven gevestigd zijn of daarmee ruimtelijk verbonden zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0039553#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603w
    references:
      - id: ref1
        bwb_id: BWBR0039553
        hoofdstuk: '1'
  - number: 1603x.1
    text: |-
      Zowel de huurder als de verhuurder kunnen verzoeken dat de huurcommissie de huurprijs, zo deze niet overeenstemt
      met die van vergelijkbare bedrijfsruimte ter plaatse, nader zal vaststellen:
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603x
  - number: 1603x.1.a
    text: indien de overeenkomst voor bepaalde tijd geldt, na afloop van de overeengekomen duur;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603x
  - number: 1603x.1.b
    text: |-
      in alle andere gevallen, telkens wanneer tenminste vijf jaar zijn verstreken sinds de dag waarop de laatste door
      partijen vastgestelde huurprijs is ingegaan of waarop de laatste door de huurcommissie dan wel het Gerecht in
      eerste aanleg voor de openbare lichamen Bonaire, Sint Eustatius en Saba vastgestelde huurprijs is verzocht.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603x
  - number: 1603x.2
    text: |-
      Bij de nadere vaststelling van de huurprijs let de huurcommissie op het gemiddelde van de huurprijzen van
      vergelijkbare bedrijfsruimte ter plaatse, die zich hebben voorgedaan in een tijdvak van vijf jaren voorafgaande
      aan de dag van het instellen van de vordering. Iedere aldus in de vergelijking te betrekken huurprijs wordt
      herleid volgens de algemene ontwikkeling van het prijspeil sinds de dag waarop die huurprijs gold tot aan die
      van het instellen van de vordering. Zo het niet mogelijk is de huurcommissie de voor de toepassing van deze
      maatstaf benodigde gegevens te verschaffen, maakt de huurcommissie een schatting aan de hand van de wel te zijner
      beschikking staande gegevens, waarbij zij die maatstaf zoveel mogelijk als richtsnoer bezigt.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603x
  - number: 1603x.3
    text: |-
      De huurcommissie wijst een verzoek tot verhoging van de huurprijs af, voor zover deze is gegrond op verbeteringen
      van het gehuurde, die op kosten van de huurder zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603x
  - number: 1603x.4
    text: |-
      Indien de huurcommissie de huurprijs nader vaststelt, geldt deze met ingang van de dag waarop deze is verzocht,
      tenzij zij op verzoek van een der partijen op grond van de bijzondere omstandigheden van het geval een andere
      ingangsdatum vaststelt. Zij kan daarbij tevens bepalen dat de huurprijs gedurende een door haar vast te stellen
      termijn van ten hoogste vijf jaren geleidelijk zal worden aangepast.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603x
  - number: 1603y
    text: Van deze afdeling kan niet ten nadele van de huurder worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1603y
  - number: '1605'
    text: |-
      Indien bij een huurovereenkomst van landerijen een kleinere of grotere uitgestrektheid wordt opgegeven, dan dezelve
      werkelijk hebben, geeft zulks geen grond tot vermeerdering of vermindering van de huurprijs, dan alleen in de
      gevallen en volgens de bepalingen bij de [vijfde titel van dit boek][ref1] vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028752
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1605
    references:
      - id: ref1
        bwb_id: BWBR0028752
  - number: '1606'
    text: |-
      Indien de huurder van landerijen dezelve niet van de tot beweiding of bebouwing noodzakelijke beesten en
      bouwgereedschappen voorziet; indien hij met de beweiding of bebouwing ophoudt, of te dien opzichte niet als een
      goed huurder handelt; indien hij de gehuurde zaak tot een ander einde gebruikt, dan waartoe hetzelve bestemd is;
      of indien hij, in het algemeen, de bedingen, bij de huurovereenkomst gemaakt, niet nakomt, en daardoor enig nadeel
      voor de verhuurder ontstaat, is deze bevoegd om, naar gelang der omstandigheden, de vernietiging van de huur, met
      vergoeding van schade, te vorderen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1606
  - number: '1607'
    text: Alle huurders van landerijen zijn gehouden de vruchten in de daartoe bestemde bergplaatsen te bergen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1607
  - number: '1608.1'
    text: |-
      De huurder van landerijen is, op straffe van vergoeding van schade, gehouden de eigenaar van alle feitelijkheden te
      doen kennis dragen, welke op de gehuurde erven mochten gepleegd worden.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1608
  - number: '1608.2'
    text: |-
      Deze kennisgeving moet gedaan worden binnen dezelfde termijn, welke tussen de tijd der oproepingen ter
      terechtzitting en de dag der verschijning, naarmate van de afstand der plaatsen, bepaald is.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1608
  - number: '1609'
    text: De huur van landen, zonder geschrift aangegaan, wordt gerekend aangegaan te zijn voor één jaar.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1609
  - number: '1610'
    text: |-
      Indien, na het eindigen van een schriftelijk aangegane verhuring, de huurder in het genot van de zaak blijft, en
      daarin gelaten wordt, worden de gevolgen van de nieuwe huur door de vroeger aangegane overeenkomst geregeld.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1610
  - number: '1611'
    text: |-
      De huurder wiens huur eindigt, en hij welke hem in de huur opvolgt, zijn verplicht elkander over en weder met al
      datgene te gerieven, dat vereist wordt om het verlaten en het betrekken van de zaak gemakkelijk te maken, zo wat
      betreft de bebouwing voor het volgende jaar, het inoogsten der nog te velde staande vruchten, als anderszins; alles
      overeenkomstig het plaatselijk gebruik.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1611
  - number: '1612'
    text: |-
      De huurder moet insgelijks, bij zijn vertrek, het stro en de mest van het afgelopen jaar achterlaten, indien hij
      dezelve bij de aanvang van zijn huur ontvangen heeft; en al had hij die zelfs niet ontvangen, kan de eigenaar
      dezelve, volgens een te maken begroting, aan zich houden.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1612
  - number: '1613'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613
  - number: 1613a
    text: |-
      De arbeidsovereenkomst is de overeenkomst, waarbij de ene partij, de arbeider, zich verbindt, in dienst van de
      andere partij, de werkgever, tegen loon, gedurende zekere tijd arbeid te verrichten.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613a
  - number: 1613b
    text: |-
      De aanneming van werk van stoffelijke aard is de overeenkomst, waarbij de ene partij, de aannemer, zich verbindt,
      voor de andere partij, de aanbesteder, tegen een bepaalde prijs een bepaald werk tot stand te brengen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613b
  - number: 1613c.1
    text: |-
      Indien een overeenkomst de kenmerken bevat van een arbeidsovereenkomst, en van enige andere soort van overeenkomst,
      zullen zowel de bepalingen betreffende de arbeidsovereenkomst als die betreffende de andere soort van overeenkomst,
      welker kenmerken zij mede bevat, van toepassing zijn; in geval van strijd tussen deze bepalingen zullen die der
      arbeidsovereenkomst van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613c
  - number: 1613c.2
    text: |-
      Indien een aanneming van werk door meerdere soortgelijke overeenkomsten, zij het ook telkens met enige tussentijd,
      is gevolgd, of indien het, bij het aangaan ener aanneming van werk, blijkbaar in de bedoeling van partijen ligt
      meerdere dergelijke overeenkomsten aan te gaan, in dier voege, dat de verschillende aannemingen tezamen als een
      arbeidsovereenkomst kunnen worden beschouwd, zullen de bepalingen betreffende de arbeidsovereenkomst op deze
      overeenkomsten gezamenlijk en op elk harer afzonderlijk, met uitsluiting van de bepalingen der zesde afdeling
      van deze titel, van toepassing zijn. Is evenwel in een dergelijk geval de eerste overeenkomst bij wijze van proef
      aangegaan, dan zal deze geacht worden haar aard van aanneming van werk te hebben behouden en zullen de bepalingen
      der [zesde afdeling][ref1] van deze titel op haar van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#AfdelingZesde
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613c
    references:
      - id: ref1
        bwb_id: BWBR0028752
        afdeling: Zesde
  - number: 1613ca
    text: |-
      Hij die ten behoeve van een ander tegen beloning door die ander gedurende drie opeenvolgende maanden wekelijks
      tenminste acht uren dan wel gedurende tenminste vijfendertig uren per maand arbeid verricht, wordt vermoed deze
      arbeid te verrichten krachtens arbeidsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613ca
  - number: 1613cb
    text: |-
      Indien een arbeidsovereenkomst ten minste drie maanden heeft geduurd, wordt de bedongen arbeid in enige maand
      vermoed een omvang te hebben gelijk aan de gemiddelde omvang van de arbeid per maand in de drie voorafgaande
      maanden.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613cb
  - number: 1613d
    text: |-
      Wanneer een arbeidsovereenkomst schriftelijk wordt aangegaan, zijn de kosten der akte en andere bijkomende onkosten
      ten laste van de werkgever.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613d
  - number: 1613e
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613e
  - number: 1613f.1
    text: |-
      Een minderjarige is bekwaam als arbeider arbeidsovereenkomsten aan te gaan, indien hij daartoe door zijn wettelijke
      vertegenwoordiger, hetzij mondeling, hetzij schriftelijk, is gemachtigd.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613f
  - number: 1613f.2
    text: |-
      Een mondelinge machtiging kan slechts strekken tot het aangaan van een bepaalde arbeidsovereenkomst. Zij wordt
      verleend in tegenwoordigheid van de werkgever of van degene, die namens deze handelt. Zij kan niet voorwaardelijk
      worden verleend.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613f
  - number: 1613f.3
    text: |-
      Indien de machtiging schriftelijk is verleend, is de minderjarige verplicht haar ter hand te stellen aan de
      werkgever, die de minderjarige afschrift daarvan geeft en de machtiging bij het einde der dienstbetrekking aan de
      minderjarige of diens rechtverkrijgenden teruggeeft.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613f
  - number: 1613f.4
    text: |-
      Voor zover zulks niet door het stellen van bepaalde voorwaarden in de machtiging uitdrukkelijk is uitgesloten,
      staat de minderjarige in alles, wat betrekking heeft op de arbeidsovereenkomst, door hem ingevolge de
      verleende machtiging aangegaan, met een meerderjarige gelijk, behoudens het bepaalde bij het derde lid
      van [artikel 1614f][ref1]. Echter kan hij niet in rechte verschijnen zonder bijstand van zijn wettelijke
      vertegenwoordiger, behalve wanneer de rechter gebleken is, dat de wettelijke vertegenwoordiger niet bij machte is
      zich te verklaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1614f
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613f
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1614f
        afdeling: Derde
  - number: 1613g
    text: |-
      Indien een daartoe niet bekwame minderjarige een arbeidsovereenkomst heeft aangegaan en dientengevolge gedurende
      vier weken, zonder verzet van zijn wettelijke vertegenwoordiger, in dienst van de werkgever arbeid heeft verricht,
      wordt hij geacht door die vertegenwoordiger mondeling tot het aangaan dier arbeidsovereenkomst gemachtigd te zijn
      geweest.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613g
  - number: 1613h
    text: Een tussen echtgenoten aangegane arbeidsovereenkomst is nietig.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613h
  - number: 1613i.1
    text: |-
      Een door de werkgever vastgesteld reglement is voor de arbeider slechts verbindend, indien is voldaan aan de
      navolgende vereisten:
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613i
  - number: 1613i.1.1°
    text: dat een volledig exemplaar van het reglement kosteloos door of vanwege de werkgever aan de arbeider is verstrekt;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613i
  - number: 1613i.1.2°
    text: |-
      dat door of vanwege de werkgever een door deze ondertekend volledig exemplaar van het reglement ter inzage voor
      een ieder is nedergelegd ter griffie van het gerecht in eerste aanleg, binnen welks rechtsgebied de onderneming, in
      welke het reglement geldt, gevestigd is;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613i
  - number: 1613i.1.3°
    text: |-
      dat een volledig exemplaar van het reglement in de Nederlandse taal en in Bonaire, onderscheidenlijk Sint Eustatius
      en Saba bovendien onderscheidenlijk in het Papiaments en in de Engelse taal gesteld op een voor de arbeider
      gemakkelijk toegankelijke plaats, zo mogelijk in het arbeidslokaal, zodanig opgehangen is en blijft, dat het
      duidelijk leesbaar is. De nederlegging en de inzage van het reglement ter griffie geschieden kosteloos.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613i
  - number: 1613i.2
    text: |-
      Het reglement is eveneens slechts verbindend voor zover de inhoud niet in strijd is met de door de arbeider
      aangegane arbeidsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613i
  - number: 1613i.3
    text: Elk beding, strijdig met enige bepaling van dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613i
  - number: 1613j.1
    text: |-
      Indien gedurende de dienstbetrekking een reglement wordt vastgesteld of het bestaande wordt gewijzigd, is dit
      nieuwe of gewijzigde reglement voor de arbeider slechts verbindend, indien een volledig exemplaar van het ontwerp
      daarvan of van de ontworpen wijzigingen algemeen is bekend gemaakt zodanige tijd tevoren, dat hij zich over de
      inhoud behoorlijk heeft kunnen beraden.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613j
  - number: 1613j.2
    text: |-
      Indien de arbeider na vaststelling van het nieuwe of het gewijzigde reglement mededeelt, dat hij zich daarmede
      niet verenigt, wordt deze mededeling aangemerkt als een opzegging van de dienstbetrekking tegen de dag, waarop
      het nieuwe of het gewijzigde reglement in werking zal treden. Is de tijd tussen de dag, waarop het nieuwe of het
      gewijzigde reglement door of vanwege de werkgever aan de arbeider is verstrekt, en die, waarop het in werking zal
      treden, korter dan die gedurende welke de dienstbetrekking bij regelmatige beëindiging had behoren voort te duren,
      dan is de werkgever schadeplichtig.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613j
  - number: 1613j.3
    text: Elk beding, strijdig met enige bepaling van dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613j
  - number: 1613k
    text: |-
      Een verklaring van de arbeider, waarbij hij zich verbindt zich met elk in de toekomst vastgesteld reglement of met
      elke toekomstige wijziging van een bestaand reglement te verenigen, is nietig.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613k
  - number: 1613l
    text: |-
      Van de bepalingen van het reglement kan alleen dan bij bijzondere overeenkomst worden afgeweken, indien deze
      schriftelijk is aangegaan.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613l
  - number: 1613m
    text: |-
      Ter berekening van het in geld vastgestelde loon per dag wordt, voor de toepassing van deze titel, de dag gesteld
      op tien uren, de week op zes dagen, de maand op vijfentwintig dagen en het jaar op driehonderd dagen. Is het loon,
      hetzij voor het geheel, hetzij gedeeltelijk, op andere wijze dan naar tijdruimte vastgesteld, dan wordt als het in
      geld vastgestelde loon per dag aangenomen het gemiddelde loon des arbeiders, berekend over de laatste voorafgegane
      dertig werkdagen: bij gebreke van die maatstaf wordt als loon aangenomen het gebruikelijk loon voor de, wat aard,
      plaats en tijd betreft, meest nabij komende arbeid.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613m
  - number: 1613n
    text: 'Het loon van arbeiders, welke niet bij de werkgever inwonen, mag niet anders worden vastgesteld dan in:'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613n
  - number: 1613n.1°
    text: geld;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613n
  - number: 1613n.2°
    text: voedsel te nuttigen, alsmede verlichtingsmiddelen te gebruiken ter plaatse waar ze worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613n
  - number: 1613n.3°
    text: kleding, door de arbeider bij de waarneming der dienstbetrekking te dragen;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613n
  - number: 1613n.4°
    text: |-
      een bepaalde hoeveelheid der voortbrengselen van het bedrijf, waarin het loon verdiend wordt, of der grond- of
      hulpstoffen, in dat bedrijf gebruikt, een en ander voor zover die voortbrengselen of grond- of hulpstoffen, wat
      aard en hoeveelheid betreft, behoren tot de eerste levensbehoeften van de arbeider en zijn gezin, of als grond-
      of hulpstoffen, werktuigen of gereedschappen in het bedrijf des arbeiders worden gebezigd, en in ieder geval met
      uitsluiting van alcoholhoudende drank;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613n
  - number: 1613n.5°
    text: |-
      het gebruik van een aangewezen woning of lokaal, van een bepaald stuk grond of stalling voor een bepaald aantal
      naar de soort aangeduide dieren, toebehorende aan de arbeider of aan een der leden van zijn gezin; het gebruik van
      werktuigen of gereedschappen, alsmede onderhoud daarvan;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613n
  - number: 1613n.6°
    text: bepaalde werkzaamheden of diensten door of voor rekening van de werkgever voor de arbeider te verrichten;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613n
  - number: 1613n.7°
    text: onderricht door of vanwege de werkgever aan de arbeider te verstrekken.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613n
  - number: 1613o.1
    text: |-
      Indien bij overeenkomst of bij reglement geen bepaald loon is vastgesteld, heeft de arbeider aanspraak op zodanig
      loon als ten tijde van het sluiten der overeenkomst voor arbeid als de bedongene, ter plaatse waar deze moest
      worden verricht, gebruikelijk was.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613o
  - number: 1613o.2
    text: Indien zodanig gebruik niet bestaat, wordt het loon met inachtneming der omstandigheden naar billijkheid bepaald.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613o
  - number: 1613p.1
    text: |-
      Voor zover het loon anders dan volgens [artikel 1613n][ref1] geoorloofd is, is vastgesteld, wordt het op een bedrag
      in geld gewaardeerd en geacht vastgesteld te zijn op het vijfvoud van dit bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1613n
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613p
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1613n
        afdeling: Tweede
  - number: 1613p.2
    text: |-
      Het gehele loon, dat dientengevolge verschuldigd zal zijn, zal echter het overeenkomstig de bepalingen van het
      voorgaande artikel berekende loon niet met meer dan een derde mogen overschrijden.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613p
  - number: 1613p.3
    text: Elk beding, strijdig met enige bepaling van dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613p
  - number: 1613q.1
    text: |-
      Ongeoorloofd en nietig is elk beding tussen de werkgever of diens vertegenwoordiger en een arbeider, waarbij deze
      zich verbindt, het loon of zijn overige inkomsten of een gedeelte daarvan op een bepaalde wijze te besteden, of
      zich zijn benodigdheden op een bepaalde plaats of bij een bepaalde persoon aan te schaffen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613q
  - number: 1613q.2
    text: 'Van deze bepalingen zijn uitgezonderd:'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613q
  - number: 1613q.2.1°
    text: |-
      het beding, waarbij de arbeider deelneemt in enig fonds, dat naar het oordeel van de Minister van Sociale Zaken en
      Werkgelegenheid in overeenstemming met de Minister van Justitie voldoende waarborg van soliditeit biedt, of waarbij
      de arbeider toestemt, dat te zijnen behoeve een inlage in de door hem aangewezen bank wordt gestort;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613q
  - number: 1613q.2.2°
    text: |-
      ten aanzien van minderjarige arbeiders het beding, dat een gedeelte van het, gedurende de minderjarigheid
      verdiende, loon door de werkgever ten name van de arbeider zal worden geplaatst in de door de minderjarige
      aangewezen bank of in een fonds als in sub 1° bedoeld met bepaling, dat het door de arbeider eerst zal kunnen
      worden opgevorderd, wanneer hij zekere, niet hoger dan eenentwintig jaren te stellen, leeftijd zal hebben bereikt
      of uit anderen hoofde meerderjarig geworden is of wanneer de rechter in eerste aanleg op verzoek van de wettelijke
      vertegenwoordiger en na verhoor of behoorlijke oproeping van de minderjarige en van de werkgever tot de uitbetaling
      machtiging heeft verleend.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613q
  - number: 1613r.1
    text: |-
      Indien de arbeider ingevolge een ongeoorloofd en nietig beding, als bedoeld bij het [voorgaande artikel][ref1], met
      de werkgever enige overeenkomst heeft aangegaan, ontstaat daaruit generlei verbintenis. De arbeider is gerechtigd
      het reeds te dier zake op zijn loon in rekening geledene of door hem betaalde van de werkgever terug te vorderen,
      zonder gehouden te zijn tot teruggave van hetgeen hem ter voldoening aan de overeenkomst is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1613q
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613r
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1613q
        afdeling: Tweede
  - number: 1613r.2
    text: |-
      Niettemin is de rechter bevoegd, bij toewijzing van de vordering des arbeiders, de veroordeling te beperken tot
      zodanig bedrag als hem met het oog op de omstandigheden van het geval billijk zal voorkomen, doch uiterlijk tot de
      som waarop de door de arbeider geleden schade door hem wordt gewaardeerd.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613r
  - number: 1613r.3
    text: |-
      Heeft de arbeider ingevolge een ongeoorloofd en nietig beding, als voormeld, met een ander dan de werkgever enige
      overeenkomst aangegaan, dan heeft hij het recht dat bedrag van hetgeen hij uit dien hoofde betaald heeft of nog
      verschuldigd is, van de werkgever te vorderen. De bepaling van het tweede lid is ook ten deze van toepassing.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613r
  - number: 1613r.4
    text: Ieder vorderingsrecht des arbeiders krachtens dit artikel vervalt na verloop van zes maanden.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613r
  - number: 1613s.1
    text: |-
      De werkgever kan slechts boete stellen op de overtreding van voorschriften van een reglement, indien die
      voorschriften bepaaldelijk zijn aangeduid en de boete in het reglement is aangegeven.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613s
  - number: 1613s.2
    text: De overeenkomst waarbij boete wordt bedongen, wordt schriftelijk aangegaan.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613s
  - number: 1613s.3
    text: |-
      De overeenkomst of het reglement, waarbij boete is bedongen, moet nauwkeurig de bestemming der boeten vermelden.
      Zij mogen noch onmiddellijk, noch middellijk strekken tot persoonlijk voordeel van de werkgever zelf of van degene,
      wie deze de bevoegdheid heeft verleend de arbeiders boete op te leggen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613s
  - number: 1613s.4
    text: |-
      Iedere boete, in een reglement of in een overeenkomst bedongen, moet op een bepaald bedrag gesteld zijn, uitgedrukt
      in de munt, waarin het loon is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613s
  - number: 1613s.5
    text: |-
      Binnen een week mag aan een arbeider geen hoger bedrag aan gezamenlijke boeten worden opgelegd dat zijn in geld
      vastgesteld loon voor één dag. Geen afzonderlijke boete mag hoger dan dit bedrag worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613s
  - number: 1613s.6
    text: Elk beding, strijdig met enige bepaling van dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613s
  - number: 1613s.7
    text: |-
      Het in dit en het volgende artikel bepaalde is mede van toepassing op een door de werkgever bedongen boete als
      bedoeld in de [artikelen 91 tot en met 94 van Boek 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel91
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613s
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '91'
  - number: 1613t.1
    text: |-
      De mogelijkheid een boete op te leggen laat het recht op schadevergoeding op grond van de wet onverlet. Echter mag
      de werkgever ter zake van een zelfde feit niet boete heffen en tevens schadevergoeding vorderen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613t
  - number: 1613t.2
    text: Elk beding strijdig met de tweede volzin van het vorige lid is nietig.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613t
  - number: 1613u
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613u
  - number: 1613v
    text: |-
      Ieder beding waarbij de arbeider al dan niet gedurende bepaalde tijd beperkt wordt om na het einde van de
      dienstbetrekking op zekere wijze werkzaam te zijn is nietig.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613v
  - number: 1613w
    text: |-
      Alle akten en geschriften betreffende het aangaan, wijzigen of eindigen van arbeidsovereenkomsten, benevens alle
      stukken, die door de werkgever en de arbeider of hun wettelijke vertegenwoordigers tezamen of ieder afzonderlijk,
      hetzij in onderhandse vorm, hetzij ten overstaan van een openbare ambtenaar, zonder medewerking van derden, ter
      uitvoering van de arbeidsovereenkomst worden opgemaakt, zijn vrij van zegel en van de formaliteit van registratie
      of worden, indien deze formaliteit wordt gewenst, kosteloos geregistreerd.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613w
  - number: 1613x.1
    text: |-
      De bepalingen van deze titel zijn niet van toepassing op de arbeidsovereenkomst tussen de rederij en de schipper en
      op die tussen de schipper en de scheepsofficieren en scheepsgezellen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613x
  - number: 1613x.2
    text: |-
      Zij zijn voorts niet van toepassing ten aanzien van personen in dienst van de overheid, tenware zij, hetzij
      vóór of bij de aanvang der dienstbetrekking door of namens partijen hetzij bij algemeen verbindend voorschrift
      van toepassing zijn verklaard. Indien zij wel van toepassing zijn verklaard wordt de overheid ten aanzien dier
      bepalingen als werkgever beschouwd.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1613x
  - number: '1614'
    text: De werkgever is verplicht de arbeider zijn loon op de bepaalde tijd te voldoen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614
  - number: 1614a
    text: |-
      Het loon, naar tijdruimte vastgesteld, is verschuldigd van het tijdstip, waarop de arbeider in dienst is getreden,
      tot dat van het einde der dienstbetrekking.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614a
  - number: 1614b
    text: Geen loon is verschuldigd voor de tijd, gedurende welke de arbeider de bedongen arbeid niet heeft verricht.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614b
  - number: 1614c.1
    text: |-
      Evenwel behoudt de arbeider zijn aanspraak op het naar tijdruimte vastgestelde loon voor een betrekkelijk korte
      tijd, wanneer hij tengevolge van ziekte of ongeval verhinderd is geweest zijn arbeid te verrichten, tenzij de
      ziekte of het ongeval door zijn opzet of onzedelijkheid veroorzaakt of het gevolg is van een lichaamsgebrek,
      waaromtrent hij bij het aangaan der overeenkomst de werkgever opzettelijk valse inlichtingen heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614c
  - number: 1614c.2
    text: |-
      Komt hem in zodanige geval krachtens de ziekte- of ongevallenregeling of krachtens enige verzekering of uit enig
      fonds waarin de deelneming is bedongen bij of voorvloeit uit de arbeidsovereenkomst, een geldelijke vergoeding of
      uitkering toe, dan wordt het loon verminderd met het bedrag dier vergoeding of uitkering.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614c
  - number: 1614c.5
    text: |-
      Is het loon in geld op andere wijze dan naar tijdruimte vastgesteld, dan zijn de bepalingen van dit artikel
      eveneens van toepassing met dien verstande, dat als loon wordt aangenomen het gemiddelde loon, hetwelk de arbeider,
      wanneer hij niet verhinderd ware geweest, gedurende die tijd had kunnen verdienen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614c
  - number: 1614c.6
    text: |-
      Het loon wordt echter verminderd met het bedrag der onkosten, welke de arbeider zich door het niet verrichten van
      de arbeid heeft bespaard.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614c
  - number: 1614c.7
    text: |-
      Van de bepalingen van dit artikel mag alleen bij schriftelijk aangegane overeenkomst of bij reglement worden
      afgeweken.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614c
  - number: 1614ca.1
    text: |-
      De arbeider heeft recht op verlof met behoud van het naar tijdruimte vastgestelde loon voor een korte, naar
      billijkheid te berekenen tijd, wanneer hij zijn arbeid niet kan verrichten wegens:
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614ca
  - number: 1614ca.1.a
    text: onvoorziene omstandigheden die een onmiddellijke onderbreking van de arbeid vergen;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614ca
  - number: 1614ca.1.b
    text: zeer bijzondere persoonlijke omstandigheden;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614ca
  - number: 1614ca.1.c
    text: |-
      een door wet of overheid, zonder geldelijke vergoeding, opgelegde verplichting, waarvan de vervulling niet in zijn
      vrije tijd kon plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614ca
  - number: 1614ca.1.d
    text: de uitoefening van het actief kiesrecht.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614ca
  - number: 1614ca.2
    text: 'Onder zeer bijzondere persoonlijke omstandigheden worden in ieder geval begrepen:'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614ca
  - number: 1614ca.2.a
    text: de bevalling van de echtgenoot;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614ca
  - number: 1614ca.2.b
    text: |-
      het overlijden en de lijkbezorging van een van zijn huisgenoten of een van zijn bloed- en aanverwanten in de rechte
      lijn en in de tweede graad van de zijlijn;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614ca
  - number: 1614ca.2.c
    text: |-
      spoedeisend, onvoorzien of redelijkerwijze niet buiten werktijd om te plannen arts- of ziekenhuisbezoek door de
      arbeider of de noodzakelijke begeleiding daarbij van de personen, bedoeld in [artikel 1614cb, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1614cb
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614ca
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1614cb
        afdeling: Derde
  - number: 1614ca.2.d
    text: |-
      noodzakelijke verzorging op de eerste ziektedag van de personen, bedoeld in [artikel 1614cb, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1614cb
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614ca
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1614cb
        afdeling: Derde
  - number: 1614ca.3
    text: |-
      Onder echtgenoot als genoemd in het tweede lid wordt mede verstaan de persoon met wie de arbeider ongehuwd
      samenwoont of degene van wie de arbeider het kind erkent. Er is sprake van ongehuwd samenwonen als twee ongehuwde
      personen een gezamenlijke huishouding voeren. Van een gezamenlijke huishouding als bedoeld in de tweede zin is
      sprake indien de betrokkenen hun hoofdverblijf hebben in dezelfde woning en blijk geven zorg te dragen voor elkaar
      door middel van het leveren van een bijdrage in de kosten van de huishouding dan wel op andere wijze in elkaars
      verzorging voorzien.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614ca
  - number: 1614cb.1
    text: |-
      De arbeider heeft recht op verlof voor de noodzakelijke verzorging in verband met ziekte van een persoon als
      bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614cb
  - number: 1614cb.2
    text: 'Onder een persoon als bedoeld in het eerste lid, wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614cb
  - number: 1614cb.2.a
    text: de echtgenoot;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614cb
  - number: 1614cb.2.b
    text: een kind tot wie de arbeider als ouder in een familierechtelijke betrekking staat;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614cb
  - number: 1614cb.2.c
    text: een kind van de echtgenoot;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614cb
  - number: 1614cb.2.d
    text: |-
      een pleegkind dat blijkens de basisadministratie personen, bedoeld in
      [artikel 2 van de Wet basisadministraties persoonsgegevens BES][ref1], op hetzelfde adres woont als de arbeider en
      de arbeider als pleegouder dat kind verzorgt;


      [ref1]: https://wetten.overheid.nl/BWBR0028208#Artikel2
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614cb
    references:
      - id: ref1
        bwb_id: BWBR0028208
        artikel: '2'
  - number: 1614cb.2.e
    text: een bloedverwant van de arbeider in de eerste of tweede graad;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614cb
  - number: 1614cb.2.f
    text: |-
      de persoon die, zonder dat er sprake is van een arbeidsrelatie, deel uitmaakt van de huishouding van de arbeider;
      of
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614cb
  - number: 1614cb.2.g
    text: |-
      de persoon met wie de arbeider anderszins een sociale relatie heeft, voor zover de te verlenen verzorging
      rechtstreeks voortvloeit uit die relatie en redelijkerwijs door de arbeider moet worden verleend.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614cb
  - number: 1614cb.3
    text: |-
      Voor de toepassing van het tweede lid, onderdelen a en c, is [artikel 1614ca, derde lid][ref1], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1614ca
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614cb
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1614ca
        afdeling: Derde
  - number: 1614cb.4
    text: |-
      Als pleegouder als bedoeld in het tweede lid, onderdeel d, wordt beschouwd de persoon die voldoet aan de regels die
      bij en krachtens [artikel 18.4.7i van de Invoeringswet openbare lichamen Bonaire, Sint Eustatius en Saba][ref1],
      aan het pleegouderschap zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel18
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614cb
    references:
      - id: ref1
        bwb_id: BWBR0028063
        artikel: '18'
  - number: 1614cb.5
    text: |-
      Het verlof bedraagt in elke periode van 12 achtereenvolgende maanden ten hoogste twee maal de arbeidsduur per week.
      De periode van 12 maanden gaat in op de eerste dag waarop het verlof wordt genoten.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614cb
  - number: 1614cc
    text: |-
      De arbeider meldt vooraf aan zijn werkgever dat hij het verlof, bedoeld in [artikel 1614ca][ref1] of
      [1614cb][ref2], opneemt onder opgave van de reden. Indien dit niet mogelijk is, meldt de arbeider het opnemen van
      het verlof zo spoedig mogelijk aan zijn werkgever onder opgave van de reden. Bij de melding van de verlofopname,
      bedoeld in artikel 1614cb, geeft de arbeider ook de omvang, de wijze van opneming en de vermoedelijke duur van
      het verlof aan. De werkgever kan de opname van verlof afwijzen, indien zwaarwegende bedrijfs- of dienstbelangen
      zich hiertegen verzetten. De werkgever geeft in dat geval zijn afwijzing schriftelijk aan onder vermelding van de
      redenen van zijn afwijzing.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1614ca
      [ref2]: https://wetten.overheid.nl/BWBR0028752#Artikel1614cb
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614cc
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1614ca
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0028752
        artikel: 1614cb
        afdeling: Derde
  - number: 1614cd.1
    text: |-
      De vrouwelijke arbeider heeft recht op doorbetaling van het volledige salaris gedurende het zwangerschaps- en
      bevallingsverlof.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614cd
  - number: 1614cd.2
    text: |-
      Het recht op het zwangerschapsverlof bestaat vanaf zes weken voor de dag na de vermoedelijke datum van bevalling,
      of vanaf tien weken voor die dag indien het een zwangerschap van meer dan een kind betreft, zoals aangegeven in
      een aan de werkgever overgelegde schriftelijke verklaring van een arts of verloskundige, tot en met de dag van de
      bevalling. Het zwangerschapsverlof gaat in uiterlijk vier weken voor de dag na de vermoedelijke datum van bevalling
      of uiterlijk acht weken voor die dag indien het een zwangerschap van meer dan een kind betreft.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614cd
  - number: 1614cd.3
    text: |-
      Het recht op bevallingsverlof gaat in op de dag na de dag van de bevalling en bedraagt tien aaneengesloten weken
      vermeerderd met het aantal dagen dat het zwangerschapsverlof tot en met de vermoedelijke datum van bevalling, dan
      wel, indien eerder gelegen, tot en met de werkelijke datum van bevalling, minder dan zes weken heeft bedragen, of,
      indien het een zwangerschap van meer dan een kind betreft, minder dan tien weken heeft bedragen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614cd
  - number: 1614cd.4
    text: |-
      Voor de toepassing van het derde lid worden dagen waarover de arbeider als gevolg van ziekte een uitkering als
      bedoeld in [artikel 3, eerste lid, onder a, van de Wet ziekteverzekering BES][ref1] heeft genoten in de periode
      dat degene recht heeft op zwangerschapsverlof, maar dat verlof nog niet is ingegaan, aangemerkt als dagen waarover
      zwangerschapsverlof is genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0028728#Artikel3
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614cd
    references:
      - id: ref1
        bwb_id: BWBR0028728
        artikel: '3'
  - number: 1614cd.5
    text: |-
      Als een kind tijdens het bevallingsverlof vanwege zijn medische toestand in een ziekenhuis is opgenomen, wordt
      het bevallingsverlof verlengd met het aantal opnamedagen, te rekenen vanaf de achtste dag van opname tot en met de
      laatste dag van het bevallingsverlof tot een maximum van tien weken. De in de eerste zin bedoelde verlenging van
      het bevallingsverlof is uitsluitend van toepassing voor zover de ziekenhuisopname langer duurt dan het aantal dagen
      waarmee het bevallingsverlof als gevolg van de werkelijke datum van bevalling op grond van het tweede lid wordt
      verlengd.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614cd
  - number: 1614cd.6
    text: Van dit artikel kan niet ten nadele van de vrouwelijke arbeider worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614cd
  - number: 1614ce.1
    text: |-
      Na de bevalling van de echtgenoot, heeft de arbeider gedurende een tijdvak van vier weken, te rekenen vanaf de
      eerste dag na de bevalling, recht op geboorteverlof ter grootte van de helft van zijn arbeidsduur per week.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614ce
  - number: 1614ce.2
    text: |-
      Als de arbeidsovereenkomst wordt beëindigd voordat het geboorteverlof volledig is genoten, heeft de arbeider, als
      hij een nieuwe arbeidsovereenkomst aangaat, tegenover de nieuwe werkgever aanspraak op het verlof dat nog niet
      is opgenomen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614ce
  - number: 1614ce.3
    text: |-
      Als de arbeidsovereenkomst wordt beëindigd, is de werkgever verplicht aan de arbeider, op diens verzoek, een
      verklaring uit te reiken waaruit blijkt op hoeveel geboorteverlof de arbeider aanspraak heeft.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614ce
  - number: 1614ce.4
    text: |-
      Voor de toepassing van het eerste lid is [artikel 1614ca, derde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1614ca
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614ce
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1614ca
        afdeling: Derde
  - number: 1614cf.1
    text: |-
      Dagen of gedeelten van dagen waarop de werknemer zijn arbeid niet verricht wegens het verlof, bedoeld in
      [artikel 1614ca][ref1] kunnen slechts indien in een voorkomend geval de werknemer ermee instemt worden aangemerkt
      als vakantie, met dien verstande dat de werknemer ten minste recht houdt op het wettelijk minimum aan vakantie-
      aanspraken.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1614ca
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614cf
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1614ca
        afdeling: Derde
  - number: 1614cf.2
    text: |-
      Dagen of gedeelten van dagen waarop de werknemer zijn arbeid niet verricht wegens het verlof, bedoeld in de
      [artikelen 1614cb][ref1], [1614cd][ref2] of [1614ce][ref3] kunnen niet worden aangemerkt als vakantie.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1614cb
      [ref2]: https://wetten.overheid.nl/BWBR0028752#Artikel1614cd
      [ref3]: https://wetten.overheid.nl/BWBR0028752#Artikel1614ce
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614cf
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1614cb
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0028752
        artikel: 1614cd
        afdeling: Derde
      - id: ref3
        bwb_id: BWBR0028752
        artikel: 1614ce
        afdeling: Derde
  - number: 1614d
    text: |-
      Ook verliest de arbeider zijn aanspraak op het naar tijdruimte vastgestelde loon niet, indien hij bereid was de
      bedongen arbeid te verrichten, doch de werkgever daarvan geen gebruik heeft gemaakt, hetzij door eigen schuld of
      zelfs tengevolge van, hem persoonlijk betreffende, toevallige verhindering. De bepalingen van het tweede, vijfde,
      zesde en zevende lid van het voorgaande artikel zijn van toepassing.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614d
  - number: 1614da.1
    text: |-
      Indien een arbeidsduur van minder dan 15 uur per week is overeengekomen en de tijdstippen waarop de arbeid moet
      worden verricht, niet zijn vastgelegd, dan wel indien de duur van de arbeid niet of niet eenduidig is vastgelegd,
      heeft de arbeider voor iedere periode van minder dan drie uur waarin hij arbeid heeft verricht, recht op het loon
      waarop hij aanspraak zou hennen indien hij drie uur arbeid zou hebben verricht.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614da
  - number: 1614da.2
    text: Van dit artikel kan niet ten nadele van de werknemer worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614da
  - number: 1614e.1
    text: |-
      Bestaat het loon voor het geheel of voor een gedeelte in een bedrag, dat afhankelijk is gesteld van enig gegeven,
      dat uit de administratie van de werkgever moet kunnen blijken, dan heeft de arbeider het recht van de werkgever
      mededeling te verlangen van zodanige bewijsstukken, als voor hem nodig zijn om tot kennis van dat gegeven te
      geraken.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614e
  - number: 1614e.2
    text: |-
      Bij schriftelijk aangegane overeenkomst of bij reglement kan worden bepaald, dat mededeling van de genoemde
      bewijsstukken, in plaats van aan iedere arbeider afzonderlijk, zal geschieden aan een bepaald aantal arbeiders
      in dienst van de werkgever of aan een of meer deskundigen inzake boekhouding, allen door de arbeiders bij
      schriftelijke keuze aan te wijzen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614e
  - number: 1614e.3
    text: |-
      De mededeling van de bewijsstukken door of vanwege de werkgever geschiedt desverlangd onder uitdrukkelijke
      verplichting van geheimhouding door de arbeider en degene, die hem overeenkomstig het voorgaande lid vervangt; deze
      kan echter nimmer tot geheimhouding tegenover de arbeider worden verplicht.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614e
  - number: 1614e.4
    text: De verplichting tot geheimhouding is voor zover nodig opgeheven, indien de opgave in rechte wordt betwist.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614e
  - number: 1614e.5
    text: |-
      Voor zover het gegeven, in het eerste lid bedoeld, betreft de winst, in des werkgevers onderneming of een deel
      daarvan behaald, kan van de bepalingen van het eerste lid bij schriftelijk aangegane overeenkomst of bij reglement,
      ook op andere wijze dan in het tweede lid omschreven, worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614e
  - number: 1614f.1
    text: Een volmacht tot de vordering van loon moet schriftelijk worden verleend.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614f
  - number: 1614f.2
    text: |-
      Indien in de in [artikel 1613f][ref1] genoemde schriftelijke machtiging de voorwaarde is opgenomen, dat het in geld
      vastgestelde loon, geheel of gedeeltelijk, in stede van aan de minderjarige, aan de wettelijke vertegenwoordiger
      zelf moet worden voldaan, wordt deze ten opzichte van de voldoening van het loon, of van het gedeelte hetwelk hem
      moet worden voldaan, als de arbeider aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1613f
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614f
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1613f
        afdeling: Tweede
  - number: 1614f.3
    text: |-
      Ook indien geen zodanige voorwaarde in de machtiging is opgenomen, wordt het aan de minderjarige verschuldigde in
      geld vastgestelde loon aan de wettelijke vertegenwoordiger voldaan, wanneer deze zich tegen de voldoening aan de
      minderjarige schriftelijk verzet.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614f
  - number: 1614f.4
    text: |-
      In andere gevallen dan die, bedoeld in het tweede en derde lid van dit artikel, is de werkgever door betaling aan
      de minderjarige behoorlijk gekweten.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614f
  - number: 1614f.5
    text: |-
      Voldoening aan derden, in strijd met de bepalingen van dit of het [volgende artikel][ref1], is nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1614g
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614f
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1614g
        afdeling: Derde
  - number: 1614g.1
    text: |-
      Beslag onder de werkgever op het door deze aan de arbeider verschuldigde loon is niet verder geldig dan tot een
      derde gedeelte van het in geld vastgestelde loon. Generlei beperking geldt, indien het beslag dient tot verhaal van
      onderhoud, waarop hij, te wiens behoeve het beslag gelegd wordt, volgens de wet aanspraak heeft.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614g
  - number: 1614g.2
    text: |-
      Overdracht, inpandgeving of elke andere handeling, waardoor de arbeider enig recht op zijn loon aan een derde
      toekent, is slechts in zoverre geldig als een beslag op zijn loon geldig zoude zijn.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614g
  - number: 1614g.3
    text: |-
      Volmacht tot invordering van het loon, onder welke vorm of welke benaming ook door de arbeider verleend, is steeds
      herroepelijk.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614g
  - number: 1614g.4
    text: Elk beding, strijdig met enige bepaling van dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614g
  - number: 1614h.1
    text: |-
      De voldoening van het in geld vastgestelde loon geschiedt in wettig betaalmiddel van het openbaar lichaam Bonaire,
      Sint Eustatius en Saba of met toepassing van [artikel 114, eerste lid, van Boek 6][ref1] met dien verstande dat in
      buitenlands geld vastgesteld loon zal worden berekend naar de koers van de dag en plaats der betaling, of, indien
      aldaar geen koers bestaat, naar die der naastbijgelegen handelsplaats, waar een koers bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel114
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614h
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '114'
  - number: 1614h.2
    text: |-
      Wanneer met de berekening van het in geld van een vreemd Rijk vastgestelde loon enige dagen vóór de betaling ervan
      een aanvang wordt gemaakt, zal kunnen gelden de koers van de dag waarop de berekening geschiedt.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614h
  - number: 1614i
    text: |-
      De voldoening van het loon, voor zover het in andere bestanddelen dan in geld is vastgesteld, geschiedt volgens
      hetgeen bij overeenkomst of reglement is bedongen, of in het geval, bedoeld in [artikel 1613p][ref1], naar de daar
      gestelde regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1613p
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614i
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1613p
        afdeling: Tweede
  - number: 1614j.1
    text: |-
      Voldoening van het loon, voor zover zij anders heeft plaatsgehad dan bij de voorafgaande twee artikelen is bepaald,
      is nietig. De arbeider behoudt het recht van de werkgever het verschuldigde loon te vorderen, zonder gehouden te
      zijn hem het bij de nietige voldoening ontvangene terug te geven.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614j
  - number: 1614j.2
    text: |-
      Niettemin is de rechter bevoegd, bij toewijzing van de vordering des arbeiders, de veroordeling te beperken tot
      zodanig bedrag als hem met het oog op de omstandigheden van het geval billijk zal voorkomen, doch uiterlijk tot de
      som, waarop de door de arbeider geleden schade door hem wordt gewaardeerd.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614j
  - number: 1614j.3
    text: Ieder vorderingsrecht des arbeiders krachtens dit artikel vervalt na verloop van zes maanden.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614j
  - number: 1614k
    text: |-
      Indien de plaats der voldoening van het loon niet bij overeenkomst of reglement, of door het gebruik is bepaald,
      of het loon met toepassing van [artikel 114, eerste lid, van Boek 6][ref1] betaald wordt geschiedt de voldoening
      hetzij ter plaatse waar de arbeid in de regel wordt verricht, hetzij ten kantore des werkgevers indien dit gelegen
      is op hetzelfde eiland waar de arbeider woont, hetzij aan de woning des arbeiders, ter keuze van de werkgever.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel114
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614k
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '114'
  - number: 1614l.1
    text: |-
      De uitbetaling van het in geld naar tijdruimte vastgestelde loon zal geschieden als volgt: - indien het loon bij de
      week of bij kortere tijdruimte is vastgesteld, telkens na een week;
        - indien het loon is vastgesteld bij een tijdruimte, langer dan een week, doch korter dan een maand, telkens na
      verloop van de tijd, waarbij het loon vastgesteld is;
        - indien het loon bij de maand is vastgesteld, telkens na een maand;
        - indien het loon bij langere tijdruimte dan een maand is vastgesteld, telkens na een kwartaal.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614l
  - number: 1614l.2
    text: |-
      De uitbetalingstermijnen, bij dit artikel vastgesteld, zullen door partijen, met onderling goedvinden, steeds mogen
      worden ingekort.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614l
  - number: 1614l.3
    text: |-
      De uitbetalingstermijnen mogen niet dan met schriftelijke toestemming van Onze Minister wie het aangaat worden
      verlengd, terwijl deze toestemming te allen tijde kan worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614l
  - number: 1614m
    text: |-
      De uitbetaling van het in geld doch niet naar tijdruimte vastgestelde loon, zal geschieden met inachtneming van de
      bepalingen van het voorgaande artikel, met dien verstande, dat dit loon geacht zal worden te zijn vastgesteld bij
      de tijdruimte, waarbij het loon gewoonlijk wordt vastgesteld voor de arbeid, welke ten aanzien van aard, plaats en
      tijd het meest nabijkomt aan de arbeid, waarvoor het loon verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614m
  - number: 1614n.1
    text: |-
      Voor zover het in geld vastgestelde loon bestaat in een bedrag, dat afhankelijk is gesteld van enig gegeven, dat
      uit de administratie van de werkgever moet kunnen blijken, zal de uitbetaling geschieden telkens wanneer het bedrag
      van dat loon kan worden bepaald, met dien verstande, dat de uitbetaling ten minste eenmaal per jaar zal geschieden.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614n
  - number: 1614n.2
    text: |-
      Voor zover het gegeven in het eerste lid bedoeld betreft de winst, in des werkgevers onderneming of een deel
      daarvan behaald en de aard van het bedrijf of het gebruik medebrengt, dat deze winst eerst na langer tijdsverloop
      dan één jaar wordt bepaald, kan bij schriftelijk aangegane overeenkomst of bij reglement worden bedongen, dat de
      uitbetaling telkens na die bepaling zal geschieden.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614n
  - number: 1614o
    text: |-
      Indien het loon in geld voor een gedeelte naar tijdruimte en voor een ander gedeelte op andere wijze, ofwel indien
      het loon in gedeelten naar meerdere verschillende tijdruimten is vastgesteld, zullen voor ieder dier gedeelten de
      voorschriften der [artikelen 1614l tot en met 1614n][ref1] van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1614l
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614o
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1614l
        afdeling: Derde
  - number: 1614p.1
    text: Bij iedere uitbetaling zal het gehele bedrag van het verschuldigde loon worden voldaan.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614p
  - number: 1614p.2
    text: |-
      Echter kan ten aanzien van het in geld, doch afhankelijk van de uikomsten van de te verrichten arbeid, vastgestelde
      loon bij schriftelijk aangegane overeenkomst of bij reglement worden bedongen, dat telkens, behoudens definitieve
      afrekening op de eerste betaaldag waarop daartoe de mogelijkheid zal bestaan, zal worden uitbetaald een zeker
      gedeelte van het loon, bedragende ten minste drie vierden van het gebruikelijk loon voor de, wat aard, plaats en
      tijd betreft, meest nabijkomende arbeid.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614p
  - number: 1614pa.1
    text: |-
      De werkgever is verplicht bij elke voldoening van het in geld vastgestelde loon de arbeider een schriftelijke
      opgave te verstrekken van het loonbedrag, van de bedragen waaruit dit is samengesteld, van de bedragen die op het
      loonbedrag, van de bedragen waaruit dit is samengesteld, van de bedragen die op het loonbedrag zijn ingehouden,
      alsmede van het bedrag van het loon waarop een persoon van de leeftijd van de werknemer over de termijn waarop het
      loon is berekend ingevolge het bepaalde bij of krachtens de [Wet minimumlonen BES][ref1] aanspraak heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0028170
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614pa
    references:
      - id: ref1
        bwb_id: BWBR0028170
  - number: 1614pa.2
    text: |-
      De opgave vermeldt voorts de naam van de werkgever en van de werknemer, de datum van indiensttreding, de termijn
      waarover het loon is berekend, alsmede de overeengekomen arbeidsduur.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614pa
  - number: 1614q
    text: |-
      Voor zover het in geld vastgestelde loon, of het gedeelte daarvan, dat overblijft na aftrek van hetgeen door de
      werkgever niet behoeft te worden uitbetaald, en na aftrek van hetgeen, waarop derden overeenkomstig de bepalingen
      van deze titel rechten doen gelden, niet wordt uitbetaald uiterlijk de achtste werkdag na die, waarop ingevolge
      de [artikelen 1614l][ref1], [1614m][ref2] en [1614o][ref3], de betaling had moeten geschieden, heeft de arbeider,
      indien deze niet-betaling aan de werkgever is toe te schrijven, aanspraak op een verhoging wegens de vertraging,
      welke voor de negende tot en met de twaalfde werkdag bedraagt vijf ten honderd per dag en voor elke volgende
      werkdag een ten honderd, met dien verstande, dat de verhoging wegens vertraging in geen geval de helft van het
      verschuldigde bedrag zal te boven gaan. Niettemin is de rechter bevoegd de verhoging te beperken tot zodanig bedrag
      als hem met het oog op de omstandigheden van het geval billijk zal voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1614l
      [ref2]: https://wetten.overheid.nl/BWBR0028752#Artikel1614m
      [ref3]: https://wetten.overheid.nl/BWBR0028752#Artikel1614o
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614q
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1614l
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0028752
        artikel: 1614m
        afdeling: Derde
      - id: ref3
        bwb_id: BWBR0028752
        artikel: 1614o
        afdeling: Derde
  - number: 1614r.1
    text: |-
      Behalve bij het eindigen der dienstbetrekking, is verrekening door de werkgever van zijn schuld tot uitbetaling van
      het loon alleen toegelaten met de volgende vorderingen op de arbeider:
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614r
  - number: 1614r.1.1°
    text: de door hem aan de werkgever verschuldigde schadevergoeding;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614r
  - number: 1614r.1.2°
    text: |-
      de boeten, door hem volgens [artikel 1613s][ref1] aan de werkgever verschuldigd, mits door deze een schriftelijk
      bewijs worde afgegeven, vermeldende het bedrag van iedere boete, alsmede de tijd waarop en de reden waarom zij is
      opgelegd, met opgave van de overtreden bepaling van het reglement of van de schriftelijk aangegane overeenkomst;


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1613s
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614r
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1613s
        afdeling: Tweede
  - number: 1614r.1.3°
    text: |-
      de bijdrage tot een fonds of de inlage door de werkgever overeenkomstig
      [artikel 1613q, tweede lid, s onder 1° en 2°][ref1], ten behoeve van de arbeider gestort;


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1613q
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614r
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1613q
        afdeling: Tweede
  - number: 1614r.1.4°
    text: |-
      de huurprijs van een woning, een lokaal, een stuk grond of van werktuigen of gereedschappen, door de arbeider
      in eigen bedrijf gebruikt, welke door de werkgever bij schriftelijk aangegane overeenkomst aan de arbeider zijn
      verhuurd;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614r
  - number: 1614r.1.5°
    text: |-
      de koopprijs van gewone en dagelijkse benodigdheden der huishouding, daaronder niet begrepen alcoholhoudende drank,
      alsmede van grond- of hulpstoffen door de arbeider in eigen bedrijf gebruik; een en ander door de werkgever aan de
      arbeider geleverd, mits van die levering blijke uit een schriftelijke, door de werkgever aan de arbeider afgegeven,
      verklaring, vermeldende de oorzaak en het bedrag der schuld, en mits de werkgever niet meer berekene dan de
      kostende prijs, en die prijs niet hoger zij dan die, waarvoor de arbeider zich die benodigdheden der huishouding,
      grond- of hulpstoffen elders zoude kunnen aanschaffen;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614r
  - number: 1614r.1.6°
    text: |-
      de voorschotten op het loon, door de werkgever in geld aan de arbeider verstrekt, mits daarvan blijke door een
      verklaring als in het voorgaande nummer vermeld;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614r
  - number: 1614r.1.7°
    text: het bedrag van hetgeen op het loon te veel is betaald;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614r
  - number: 1614r.1.8°
    text: de door de werkgever ingevolge wettelijke regeling voor de werknemer betaalde/te betalen belastingen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614r
  - number: 1614r.2
    text: |-
      Ter zake van hetgeen de werkgever krachtens de nummers 2°, 3° en 5° zoude kunnen vorderen, mag behoudens
      schriftelijke toestemming van Onze Minister wie het aangaat door hem bij elke uitbetaling van het loon niet meer
      worden verrekend, dan een vijfde gedeelte van het in geld vastgestelde loon, hetwelk alsdan zoude moeten worden
      uitbetaald; ter zake van hetgeen hij krachtens de bepalingen van dit artikel in het geheel zoude kunnen vorderen,
      mag behoudens schriftelijke toestemming van Onze Minister wie het aangaat verrekening niet verder gaan dan tot twee
      vijfde gedeelten van hetzelfde bedrag.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614r
  - number: 1614r.3
    text: Elk beding, waardoor de werkgever een ruimere bevoegdheid tot verrekening zoude worden toegekend, is nietig.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614r
  - number: 1614s.1
    text: |-
      Bedingen, welke de strekking hebben om een zeker bedrag van het loon op de betaaldag niet uit te betalen,
      zijn alleen geldig, indien zij bij schriftelijk aangegane overeenkomst of bij reglement zijn gemaakt met het
      doel om op dit bedrag te kunnen verhalen hetgeen de arbeider bij het einde der dienstbetrekking krachtens
      [artikel 1615o, derde lid][ref1], verschuldigd mocht zijn, en indien zij voorts voldoen aan de verdere bepalingen
      van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1615o
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614s
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1615o
        afdeling: Vijfde
  - number: 1614s.2
    text: |-
      De werkgever is verplicht het niet uitbetaalde bedrag ten name van de arbeider bij een door de arbeider aangewezen
      bank te beleggen. De inlage van dit bedrag geschiedt binnen drie dagen na die der loonuitbetaling. Vanaf het
      ogenblik der loonuitbetaling wordt de arbeider geacht de eigenaar te zijn van het in te leggen bedrag.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614s
  - number: 1614s.3
    text: |-
      Dit bedrag mag behoudens schriftelijke toestemming van de Gouverneur bij elke loonuitbetaling niet meer zijn dan
      een tiende gedeelte van het in geld vastgestelde, alsdan betaalbare, loon. In het geheel mag het ten hoogste het
      bedrag der schadeloosstelling bedoeld bij [artikel 1615r][ref1] evenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1615r
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614s
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1615r
        afdeling: Vijfde
  - number: 1614s.4
    text: |-
      Zodra de dienstbetrekking is geëindigd op een wijze, waardoor de arbeider niet tot het betalen ener
      schadevergoeding gelijk bij het eerste lid bedoeld, gehouden is, erlangt hij, of zijn rechtverkrijgenden, de vrije
      beschikking over het aldus te zijnen name ingelegde bedrag en over de daarvan gekweekte renten.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614s
  - number: 1614s.5
    text: |-
      Alles wat betreft de inlagen en de terugbetalingen krachtens dit artikel te doen zal verder bij besluiten van Onze
      Minister wie het aangaat worden geregeld.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614s
  - number: 1614t.1
    text: |-
      Indien het loon des arbeiders geheel of gedeeltelijk in inwoning, kost, of andere levensbenodigdheden is
      vastgesteld, is de werkgever verplicht dit, mits overeenkomstig de vereisten van gezondheid en goede zeden, volgens
      plaatselijk gebruik te voldoen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614t
  - number: 1614t.2
    text: Elk beding, waardoor deze verplichting des werkgevers zoude worden uitgesloten of beperkt, is nietig.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614t
  - number: 1614u
    text: |-
      De werkgever, die tijdelijk verhinderd is het loon, voor zover dit in inwoning, kost of andere levensbenodigdheden
      is vastgesteld, te voldoen, zonder dat deze verhindering het gevolg is van eigen toedoen van de arbeider, is deze
      een vergoeding schuldig, waarvan het bedrag bij overeenkomst of, bij gebreke van dien, door het plaatselijk gebruik
      wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614u
  - number: 1614v
    text: |-
      De werkgever is gehouden inwonende arbeiders, zonder korting van het loon, in de gelegenheid te stellen hun
      godsdienstplichten te vervullen, alsmede ontspanning van de arbeid te genieten, in beide gevallen op de wijze bij
      overeenkomst of, bij gebreke van dien, door het plaatselijk gebruik bepaald.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614v
  - number: 1614w
    text: |-
      De werkgever is gehouden de arbeid dusdanig te regelen, dat de arbeider geen arbeid heeft te verrichten op zondagen
      en die dagen, die volgens algemeen verbindend voorschrift ten aanzien van de bedongen arbeid met zondagen worden
      gelijkgesteld, behalve voor zover het tegendeel is bedongen of uit de aard van de arbeid voortvloeit.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614w
  - number: 1614x.1
    text: |-
      De werkgever is verplicht de lokalen, werktuigen en gereedschappen, waarin of waarmede hij de arbeid doet
      verrichten, op zodanige wijze in te richten en te onderhouden, alsmede omtrent het verrichten van de arbeid
      zodanige regelingen te treffen en aanwijzingen te verstrekken, dat de arbeider tegen gevaar van lijf, eerbaarheid
      en goed zover beschermd is, als redelijkerwijze in verband met de aard van de arbeid gevorderd kan worden.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614x
  - number: 1614x.2
    text: |-
      Zijn die verplichtingen niet nagekomen, dan is de werkgever gehouden tot vergoeding der schade aan de arbeider
      dientengevolge in de uitoefening zijner dienstbetrekking overkomen, tenzij door hem het bewijs wordt geleverd,
      dat die niet-nakoming aan overmacht, of die schade in belangrijke mate mede aan grove schuld van de arbeider is
      te wijten.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614x
  - number: 1614x.3
    text: |-
      Indien de arbeider, tengevolge het niet nakomen dier verplichtingen door de werkgever, in de uitoefening zijner
      dienstbetrekking zodanig letsel heeft bekomen, dat daarvan de dood het gevolg is, is de werkgever overeenkomstig
      [artikel 108 van Boek 6][ref1] jegens de daar bedoelde personen aansprakelijk, tenzij door hem het bewijs wordt
      geleverd, dat die niet-nakoming aan overmacht, of de dood in belangrijke mate mede aan grove schuld van de arbeider
      is te wijten. Het voorbehoud bij het voorgaande lid gemaakt, is ook ten deze van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel108
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614x
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '108'
  - number: 1614x.4
    text: Elk beding, waardoor deze verplichtingen des werkgevers zouden worden uitgesloten of beperkt, is nietig.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614x
  - number: 1614y
    text: |-
      De werkgever is in het algemeen verplicht al datgene te doen en na te laten, wat een goed werkgever in gelijke
      omstandigheden behoort te doen en na te laten.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614y
  - number: 1614ya.1
    text: |-
      De werkgever bevordert ten aanzien van de arbeider die in verband met ongeschiktheid ten gevolge van ziekte
      verhinderd is de bedongen arbeid te verrichten, de inschakeling in de eigen arbeid.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614ya
  - number: 1614ya.2
    text: |-
      Uit hoofde van de uitoefening van zijn taak, bedoeld in het eerste lid, treft de werkgever zo tijdig mogelijk
      zodanige maatregelen en verstrekt zodanige aanwijzingen als redelijkerwijs nodig is, opdat de arbeider, die in
      verband met ongeschiktheid ten gevolge van ziekte verhinderd is de bedongen arbeid te verrichten, in staat wordt
      gesteld de eigen arbeid te verrichten.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614ya
  - number: 1614z.1
    text: |-
      De werkgever is verplicht bij het eindigen der dienstbetrekking de arbeider op diens verlangen een getuigschrift
      uit te reiken.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614z
  - number: 1614z.2
    text: |-
      Het getuigschrift bevat een juiste opgave omtrent de aard van de verrichte arbeid en de duur der dienstbetrekking,
      alsmede, doch alleen op bijzonder verzoek van degene aan wie het getuigschrift moet worden uitgereikt, omtrent de
      wijze, waarop de arbeider aan zijn verplichtingen heeft voldaan en de wijze, waarop de dienstbetrekking geëindigd
      is; heeft de werkgever de dienstbetrekking echter zonder het aanvoeren van redenen doen eindigen, dan is hij
      slechts gehouden zulks te vermelden, zonder verplicht te zijn de redenen zelf mede te delen. Heeft de arbeider de
      dienstbetrekking doen eindigen en is hij deswege schadeplichtig geworden, dan is de werkgever gerechtigd zulks in
      het getuigschrift te vermelden.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614z
  - number: 1614z.3
    text: |-
      De werkgever, die weigert het gevraagde getuigschrift af te geven, die in het getuigschrift tegen beter weten
      onjuiste mededelingen opneemt, of die het getuigschrift van een kenmerk voorziet, bestemd om aangaande de arbeider
      enige mededeling te doen, welke niet in de bewoordingen van het getuigschrift is vervat, is zowel jegens de
      arbeider als jegens derden aansprakelijk voor de daardoor veroorzaakte schade.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614z
  - number: 1614z.4
    text: Elk beding, waardoor deze verplichtingen des werkgevers zouden worden uitgesloten of beperkt, is nietig.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614z
  - number: 1614aa.1
    text: |-
      De [artikelen 646 tot en met 649 van Boek 7 van het Nederlandse Burgerlijk Wetboek][ref1] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel646
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614aa
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '646'
  - number: 1614aa.2
    text: |-
      De opzegging van de arbeidsovereenkomst door de werkgever in strijd met de artikelen, bedoeld in het eerste lid,
      of wegens de omstandigheid dat de werknemer in of buiten rechte een beroep heeft gedaan op de artikelen, bedoeld in
      het eerste lid, of ter zake bijstand heeft verleend, is vernietigbaar.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614aa
  - number: 1614aa.3
    text: |-
      Indien de werknemer niet binnen twee maanden na de opzegging een beroep op deze vernietigingsgrond doet, vervalt
      zijn bevoegdheid daartoe.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614aa
  - number: 1614aa.4
    text: |-
      Een rechtsvordering in verband met de vernietiging verjaart door verloop van zes maanden na de dag waartegen is
      opgezegd.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614aa
  - number: 1614aa.5
    text: De opzegging, bedoeld in het tweede lid, maakt de werkgever niet schadeplichtig.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1614aa
  - number: '1615'
    text: |-
      De arbeider is verplicht de bedongen arbeid naar zijn beste vermogen te verrichten. Voor zover aard en omvang van
      de te verrichten arbeid niet bij overeenkomst of reglement zijn omschreven, beslist daaromtrent het gebruik.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615
  - number: 1615a
    text: |-
      De arbeider is verplicht de arbeid zelf te verrichten; hij kan zich daarin niet dan met toestemming des werkgevers
      door een derde doen vervangen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615a
  - number: 1615b
    text: |-
      De arbeider is verplicht zich te houden aan de voorschriften omtrent het verrichten van de arbeid alsmede aan die,
      welke strekken ter bevordering van de goede orde in de onderneming des werkgevers, hem door of namens de werkgever
      binnen de perken van de bestaande wettelijke regelingen, van overeenkomst of reglement gegeven.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615b
  - number: 1615c
    text: De arbeider, die bij de werkgever inwoont, is verplicht zich te gedragen naar de orde des huizes.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615c
  - number: 1615d
    text: |-
      De arbeider is in het algemeen verplicht al datgene te doen en na te laten, wat een goed arbeider in gelijke
      omstandigheden behoort te doen en na te laten.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615d
  - number: 1615da.1
    text: |-
      De arbeider die bij de uitvoering van de overeenkomst schade toebrengt aan de werkgever of aan een derde jegens
      wie de werkgever tot vergoeding van die schade is gehouden, is te dier zake niet jegens de werkgever aansprakelijk,
      tenzij de schade een gevolg is van zijn opzet of bewuste roekeloosheid. Uit de omstandigheden van het geval kan,
      mede gelet op de aard van de betreffende overeenkomst, anders voortvloeien dan in de vorige volzin is bepaald.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615da
  - number: 1615da.2
    text: |-
      Afwijking van het vorige lid en van [artikel 170 lid 3 van Boek 6][ref1] ten nadele van de arbeider is slechts
      mogelijk bij schriftelijke overeenkomst en slechts voor zover de arbeider te dier zake is verzekerd.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel170
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615da
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '170'
  - number: 1615e.1
    text: |-
      De dienstbetrekking eindigt van rechtswege, wanneer de tijd is verstreken, bij overeenkomst of reglement, bij wet
      of door het gebruik aangegeven.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615e
  - number: 1615e.2
    text: 'Voorafgaande opzegging is in dat geval nodig:'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615e
  - number: 1615e.2.1
    text: indien zulks bij schriftelijk aangegane overeenkomst of bij reglement is bepaald;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615e
  - number: 1615e.2.2
    text: |-
      indien volgens wet of het gebruik opzegging behoort plaats te vinden en daarvan niet, waar zulks geoorloofd is, bij
      schriftelijk aangegane overeenkomst of bij reglement is afgeweken.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615e
  - number: 1615e.3
    text: |-
      Een dienstbetrekking als bedoeld in het eerste lid, kan slechts tussentijds worden opgezegd indien voor ieder der
      partijen dat recht schriftelijk is overeengekomen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615e
  - number: 1615e.4
    text: Voor de beëindiging van een voor onbepaalde tijd aangegane dienstbetrekking is voorafgaande opzegging nodig.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615e
  - number: 1615e.5
    text: |-
      Elk beding krachtens hetwelk de dienstbetrekking van rechtswege eindigt wegens zwangerschap of bevalling van de
      arbeider is nietig.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615e
  - number: 1615e.6
    text: |-
      Elk beding krachtens hetwelk de dienstbetrekking van rechtswege eindigt wegens zwangerschap of bevalling van de
      arbeider is nietig.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615e
  - number: 1615e.7
    text: |-
      Indien een voor onbepaalde tijd aangegane dienstbetrekking, die anders dan door rechtsgeldige opzegging of
      ontbinding door de rechter is beëindigd, éénmaal of meermalen is voorgezet door een dienstbetrekking voor bepaalde
      tijd met tussenpozen van niet meer dan drie maanden, is in afwijking van het eerste lid, voor de beëindiging van de
      laatste dienstbetrekking voorafgaande opzegging nodig. De termijn voor opzegging wordt berekend vanaf het tijdstip
      van totstandkoming van de dienstbetrekking voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615e
  - number: 1615e.8
    text: |-
      Van een voortgezette dienstbetrekking als bedoeld in het zevende lid, is eveneens sprake indien een zelfde arbeider
      achtereenvolgens in dienst is geweest bij verschillende werkgevers die redelijkerwijze geacht moeten worden ten
      aanzien van de verrichte arbeid elkanders opvolgers te zijn.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615e
  - number: 1615f.1
    text: |-
      Indien de dienstbetrekking na het verstrijken van de tijd, in het eerste lid van het voorgaande artikel omschreven,
      door partijen zonder tegenspraak wordt voorgezet, wordt zij geacht voor dezelfde tijd, doch telkens ten hoogste
      voor een jaar, op de vroegere voorwaarden wederom te zijn aangegaan.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615f
  - number: 1615f.2
    text: |-
      Hetzelfde geldt, wanneer in de gevallen, waarin opzegging nodig is, tijdige opzegging achterwege blijft en de
      gevolgen van de voortzetting der dienstbetrekking niet opzettelijk zijn geregeld.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615f
  - number: 1615fa.1
    text: 'Vanaf de dag dat tussen dezelfde partijen:'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615fa
  - number: 1615fa.1.a
    text: |-
      dienstbetrekkingen voor bepaalde tijd elkaar met tussenpozen van niet meer dan drie maanden hebben opgevolgd en een
      periode van 36 maanden, deze tussenpozen inbegrepen, hebben overschreden; dan wel
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615fa
  - number: 1615fa.1.b
    text: |-
      meer dan drie voor bepaalde tijd aangegane dienstbetrekkingen elkaar hebben opgevolgd met tussenpozen van minder
      dan drie maanden;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615fa
  - number: 1615fa.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op elkaar opvolgende dienstbetrekkingen tussen een arbeider en
      verschillende werkgevers, die ten aanzien van de verrichte arbeid redelijkerwijze geacht moeten worden elkanders
      opvolger te zijn.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615fa
  - number: 1615fa.3
    text: |-
      Het eerste lid, onderdeel a en laatste zinssnede, is niet van toepassing op een dienstbetrekking aangegaan voor
      niet meer dan drie maanden, die onmiddellijk volgt op een tussen dezelfde partijen aangegane dienstbetrekking voor
      36 maanden of langer.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615fa
  - number: 1615fa.4
    text: |-
      De termijn van opzegging wordt berekend vanaf het tijdstip van totstandkoming van de eerste dienstbetrekking als
      bedoeld onder a of b van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615fa
  - number: 1615fa.5
    text: |-
      Van het eerste, tweede, derde en vierde lid kan slechts bij collectieve arbeidsovereenkomst ten nadele van de
      arbeider worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615fa
  - number: 1615g
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615g
  - number: 1615h.1
    text: |-
      Opzegging kan geschieden tegen elke dag, tenzij bij schriftelijke overeenkomst of reglement daarvoor een andere dag
      is aangewezen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615h
  - number: 1615h.2
    text: |-
      De werkgever mag, op straffe van nietigheid, niet opzeggen gedurende de tijd, dat de arbeider ongeschikt is tot
      het verrichten van zijn arbeid tengevolge van ziekte of ongeval, tenzij de ongeschiktheid ten minste een jaar
      heeft geduurd. Evenmin mag de werkgever, op straffe van nietigheid, opzeggen gedurende het zwangerschaps- en
      bevallingsverlof, bedoeld in [artikel 1614cd][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1614cd
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615h
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1614cd
        afdeling: Derde
  - number: 1615h.3
    text: |-
      De werkgever mag, op straffe van nietigheid, niet opzeggen gedurende de tijd dat een meerderjarige arbeider
      verhinderd is de bedongen arbeid te verrichten, omdat hij, anders dan met het oogmerk om de krijgsdienst of
      andere overheidsdienst bij wijze van beroep te verrichten, een verplichting naleeft, hem opgelegd door de wet,
      of voortvloeiende uit een verbintenis door hem jegens de overheid aangegaan, ten aanzien van ’s Lands verdediging
      of ter bescherming van de openbare orde. Hetzelfde geldt ten aanzien van de minderjarige arbeider, indien de
      dienstbetrekking op het ogenblik, waarop de verhindering aanvangt, ten minste zes maanden heeft geduurd.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615h
  - number: 1615h.4
    text: Van het bepaalde in het tweede en het derde lid kan slechts worden afgeweken bij collectieve arbeidsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615h
  - number: 1615h.5
    text: De werkgever kan, op straffe van nietigheid, de dienstbetrekking niet opzeggen wegens het huwelijk van de arbeider.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615h
  - number: 1615h.6
    text: |-
      De werkgever kan, op straffe van nietigheid, de dienstbetrekking niet opzeggen wegens het lidmaatschap van
      de werknemer van een vereniging van werknemers die krachtens haar statuten ten doel heeft de belangen van die
      vereniging, tenzij die activiteiten in de arbeidstijd van de werknemer worden verricht en de werkgever daaraan op
      redelijke gronden zijn toestemming heeft onthouden.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615h
  - number: 1615i.1
    text: |-
      De door de werkgever in acht te nemen termijn van opzegging bedraagt bij een dienstbetrekking die op de dag van
      opzegging:
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615i
  - number: 1615i.1.a
    text: 'korter dan vijf jaar heeft geduurd: één maand;'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615i
  - number: 1615i.1.b
    text: 'vijf jaar of langer, maar korter dan tien jaar heeft geduurd: twee maanden;'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615i
  - number: 1615i.1.c
    text: 'tien jaar of langer, maar korter dan vijftien jaar heeft geduurd: drie maanden;'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615i
  - number: 1615i.1.d
    text: 'vijftien jaar of langer heeft geduurd: vier maanden;'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615i
  - number: 1615i.2
    text: De door de arbeider in acht te nemen termijn van opzegging bedraagt één maand.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615i
  - number: 1615i.3
    text: |-
      Indien de toestemming als bedoeld in [artikel 4 van de Wet beëindiging arbeidsovereenkomsten BES][ref1],
      respectievelijk de beoordeling als bedoeld in [artikel 5 van evengenoemde wet][ref2], is gegeven, wordt de door
      de werkgever in acht te nemen termijn van opzegging verkort met de in artikel 4 respectievelijk 5 van de Wet
      beëindiging arbeidsovereenkomsten BES genoemde termijn, met dien verstande dat de resterende termijn van opzegging
      ten minste één maand bedraagt. Bij collectieve arbeidsovereenkomst kan worden overeengekomen dat de resterende
      termijn van opzegging als bedoeld in de eerste volzin, korter dan één maand bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0028174#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0028174#Artikel5
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615i
    references:
      - id: ref1
        bwb_id: BWBR0028174
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0028174
        artikel: '5'
  - number: 1615i.4
    text: |-
      De termijn, bedoeld in het eerste lid, kan slechts bij collectieve arbeidsovereenkomst worden verkort. De termijn
      kan bij schriftelijke overeenkomst worden verlengd.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615i
  - number: 1615i.5
    text: |-
      Van de termijn, bedoeld in het tweede lid, kan bij schriftelijke overeenkomst worden afgeweken. De termijn van
      opzegging door de arbeider mag bij verlenging niet langer zijn dan zes maanden en voor de werkgever niet korter dan
      het dubbele van die van de arbeider. Bij collectieve arbeidsovereenkomst kan worden overeengekomen dat de termijn
      van opzegging voor de werkgever als bedoeld in de tweede volzin, wordt verkort, mits die termijn niet korter is dan
      die voor de arbeider.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615i
  - number: 1615i.6
    text: |-
      Voor de toepassing van het eerste lid worden dienstbetrekkingen geacht een zelfde niet onderbroken dienstbetrekking
      te vormen in geval van herstel van de dienstbetrekking ingevolge [artikel 1615t][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1615t
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615i
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1615t
        afdeling: Vijfde
  - number: 1615j
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615j
  - number: 1615k
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615k
  - number: 1615l
    text: De dienstbetrekking eindigt door de dood van de arbeider.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615l
  - number: 1615m
    text: |-
      De dienstbetrekking eindigt niet door de dood van de werkgever tenzij uit de overeenkomst het tegendeel
      voortvloeit. Echter zijn zowel de erfgenamen van de werkgever als de arbeider bevoegd de dienstbetrekking, voor
      een bepaalde tijd aangegaan, door opzegging met inachtneming van de bepalingen der [artikelen 1615h][ref1] en
      [1615i][ref2] te doen eindigen, als ware zij aangegaan voor onbepaalde tijd.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1615h
      [ref2]: https://wetten.overheid.nl/BWBR0028752#Artikel1615i
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615m
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1615h
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0028752
        artikel: 1615i
        afdeling: Vijfde
  - number: 1615n.1
    text: |-
      Een proeftijd, gedurende welke ieder der partijen bevoegd is de dienstbetrekking zonder opzegging of zonder
      inachtneming van de voor opzegging geldende bepalingen te doen eindigen, kan, op straffe van nietigheid,
      uitsluitend bij schriftelijke overeenkomst worden overeengekomen. Elk beding waarbij de proeftijd niet voor beide
      partijen gelijk, of op langer dan twee maanden gesteld wordt, alsmede elk beding, waarbij door het aangaan van een
      nieuwe proeftijd de gezamenlijke proeftijden langer dan twee maanden worden, is nietig.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615n
  - number: 1615n.2
    text: |-
      Bij een zodanig beëindiging is het bepaalde in de [artikelen 1615s][ref1] en [1615t][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1615s
      [ref2]: https://wetten.overheid.nl/BWBR0028752#Artikel1615t
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615n
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1615s
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0028752
        artikel: 1615t
        afdeling: Vijfde
  - number: 1615o.1
    text: |-
      Ieder der partijen kan de dienstbetrekking zonder opzegging of zonder inachtneming van de voor opzegging
      geldende bepalingen doen eindigen, doch de partij, die dit doet zonder dat de wederpartij daarin toestemt, is
      schadeplichtig, tenzij zij de dienstbetrekking aldus doet eindigen om een dringende, aan de wederpartij onverwijld
      medegedeelde reden.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615o
  - number: 1615o.2
    text: |-
      Eveneens is schadeplichtig de partij, die door opzet of schuld aan de wederpartij een dringende reden heeft gegeven
      om de dienstbetrekking zonder opzegging of zonder inachtneming van de voor opzegging geldende bepalingen te doen
      eindigen, indien de wederpartij van die bevoegdheid heeft gebruik gemaakt of de rechter op die grond krachtens
      [artikel 1615w][ref1] de arbeidsovereenkomst ontbonden heeft verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1615w
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615o
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1615w
        afdeling: Vijfde
  - number: 1615o.3
    text: |-
      Ingeval een der partijen schadeplichtig is, heeft de wederpartij de keus de in [artikel 1615r][ref1] genoemde
      schadeloosstelling of een volledige schadevergoeding te vorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1615r
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615o
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1615r
        afdeling: Vijfde
  - number: 1615p.1
    text: |-
      Voor de werkgever worden als dringende redenen in de zin van het eerste lid van het voorgaande artikel beschouwd
      zodanige daden, eigenschappen of gedragingen van de arbeider, die ten gevolge hebben, dat van de werkgever
      redelijkerwijze niet kan gevergd worden de dienstbetrekking te laten voortduren.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615p
  - number: 1615p.2
    text: 'Dringende redenen zullen onder andere aanwezig geacht kunnen worden:'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615p
  - number: 1615p.2.1°
    text: |-
      wanneer de arbeider bij de afsluiting der overeenkomst de werkgever heeft misleid door het vertonen van valse of
      vervalste getuigschriften, of deze opzettelijk valse inlichtingen heeft gegeven omtrent de wijze waarop zijn vorige
      dienstbetrekking is geëindigd;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615p
  - number: 1615p.2.2°
    text: |-
      wanneer hij, in ernstige mate, de bekwaamheid of geschiktheid blijkt te missen tot de arbeid, waarvoor hij zich
      heeft verbonden;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615p
  - number: 1615p.2.3°
    text: wanneer hij zich ondanks waarschuwing overgeeft aan dronkenschap of ander liederlijk gedrag;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615p
  - number: 1615p.2.4°
    text: |-
      wanneer hij zich schuldig maakt aan diefstal, verduistering, bedrog of andere misdrijven, waardoor hij het
      vertrouwen van de werkgever onwaardig wordt;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615p
  - number: 1615p.2.5°
    text: |-
      wanneer hij de werkgever, diens familieleden of huisgenoten, of zijn medearbeiders mishandelt, grovelijk beledigt
      of op ernstige wijze bedreigt;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615p
  - number: 1615p.2.6°
    text: |-
      wanneer hij de werkgever, diens familieleden of huisgenoten, of zijn medearbeiders verleidt of tracht te verleiden
      tot handelingen, strijdig met de wetten of de goede zeden;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615p
  - number: 1615p.2.7°
    text: |-
      wanneer hij opzettelijk, of ondanks waarschuwing roekeloos, des werkgevers eigendom beschadigt, of aan ernstig
      gevaar blootstelt;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615p
  - number: 1615p.2.8°
    text: wanneer hij opzettelijk, of ondanks waarschuwing roekeloos, zichzelf of anderen aan ernstig gevaar blootstelt;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615p
  - number: 1615p.2.9°
    text: |-
      wanneer hij bijzonderheden aangaande de huishouding of het bedrijf van de werkgever, welke hij behoorde geheim te
      houden, bekend maakt;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615p
  - number: 1615p.2.10°
    text: |-
      wanneer hij hardnekkig weigert te voldoen aan redelijke bevelen of opdrachten, hem door of namens de werkgever
      verstrekt;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615p
  - number: 1615p.2.11°
    text: wanneer hij op andere wijze grovelijk de plichten veronachtzaamt welke de overeenkomst hem oplegt;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615p
  - number: 1615p.2.12°
    text: wanneer hij door opzet of roekeloosheid buiten staat geraakt of blijft de bedongen arbeid te verrichten.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615p
  - number: 1615p.3
    text: |-
      Bedingen, waardoor aan de werkgever de beslissing wordt overgelaten of er een dringende reden in de zin van
      [artikel 1615o, eerste lid][ref1], aanwezig is, zijn nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1615o
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615p
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1615o
        afdeling: Vijfde
  - number: 1615q.1
    text: |-
      Voor de arbeider worden als dringende redenen in de zin van [artikel 1615o, eerste lid][ref1], beschouwd
      zodanige omstandigheden, die ten gevolge hebben, dat van de arbeider redelijkerwijze niet kan gevergd worden de
      dienstbetrekking te laten voortduren.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1615o
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615q
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1615o
        afdeling: Vijfde
  - number: 1615q.2
    text: 'Dringende redenen zullen onder andere aanwezig geacht kunnen worden:'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615q
  - number: 1615q.2.1°
    text: |-
      wanneer de werkgever de arbeider, diens familieleden of huisgenoten mishandelt, grovelijk beledigt of op ernstige
      wijze bedreigt, of gedoogt dat dergelijke handelingen door een zijner huisgenoten of ondergeschikten worden
      gepleegd;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615q
  - number: 1615q.2.2°
    text: |-
      wanneer hij de arbeider, diens familieleden of huisgenoten verleidt of tracht te verleiden tot handelingen,
      strijdig met de wetten of de goede zeden, of gedoogt dat dergelijke verleiding of poging tot verleiding door een
      zijner huisgenoten of ondergeschikten worden gepleegd;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615q
  - number: 1615q.2.3°
    text: wanneer hij het loon niet op de bepaalde tijd voldoet;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615q
  - number: 1615q.2.4°
    text: wanneer hij, waar kost en inwoning bedongen zijn, niet op behoorlijke wijze daarin voorziet;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615q
  - number: 1615q.2.5°
    text: |-
      wanneer hij de arbeider, wiens loon afhankelijk van de uitkomsten van de te verrichten arbeid is vastgesteld, geen
      voldoende arbeid verschaft;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615q
  - number: 1615q.2.6°
    text: |-
      wanneer hij de arbeider, wiens loon afhankelijk van de uitkomsten van de te verrichten arbeid is vastgesteld, de
      bedongen hulp niet of niet in behoorlijke mate verschaft;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615q
  - number: 1615q.2.7°
    text: wanneer hij op andere wijze grovelijk de plichten veronachtzaamt welke de overeenkomst hem oplegt;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615q
  - number: 1615q.2.8°
    text: |-
      wanneer hij, zonder dat de aard der dienstbetrekking dit medebrengt, de arbeider, niettegenstaande diens weigering,
      gelast, arbeid in het bedrijf van een andere werkgever te verrichten;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615q
  - number: 1615q.2.9°
    text: |-
      wanneer de voortduring der dienstbetrekking voor de arbeider zou verbonden zijn met ernstige gevaren voor leven,
      gezondheid, zedelijkheid of goede naam, welke niet blijkbaar waren ten tijde van het sluiten der overeenkomst;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615q
  - number: 1615q.2.10°
    text: |-
      wanneer de arbeider door ziekte of andere oorzaken zonder zijn toedoen buiten staat geraakt de bedongen arbeid
      te verrichten.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615q
  - number: 1615q.3
    text: |-
      Bedingen, waardoor aan de arbeider de beslissing wordt overgelaten, of er een dringende reden in de zin van
      [artikel 1615o, eerste lid][ref1], aanwezig is, zijn nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1615o
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615q
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1615o
        afdeling: Vijfde
  - number: 1615r.1
    text: |-
      De schadeloosstelling, bedoeld in [artikel 1615o, derde lid][ref1], is gelijk aan het bedrag van het in geld
      vastgestelde loon voor de tijd, dat de dienstbetrekking bij regelmatige beëindiging had behoren voort te duren.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1615o
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615r
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1615o
        afdeling: Vijfde
  - number: 1615r.2
    text: |-
      Is het loon van de arbeider, hetzij voor het geheel, hetzij gedeeltelijk, niet naar tijdruimte vastgesteld, dan
      geldt de maatstaf van [artikel 1613m, tweede zin][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1613m
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615r
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1613m
        afdeling: Tweede
  - number: 1615r.3
    text: |-
      Elk beding, waarbij ten behoeve van de arbeider een schadeloosstelling tot een lager bedrag wordt bedongen, is
      nietig. Bij schriftelijk aangegane overeenkomst of bij reglement mag een schadeloosstelling tot een hoger bedrag
      worden vastgesteld. De rechter is bevoegd de schadeloosstelling, zo deze hem met het oog op de omstandigheden van
      het geval bovenmatig voorkomt, op een kleinere som te bepalen, doch niet op minder dan het in geld vastgestelde
      loon voor de duur van de opzeggingstermijn ingevolge de [artikelen 1615h][ref1], [1615i][ref2] en [1615j][ref3],
      noch op minder dan het in geld vastgestelde loon voor drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1615h
      [ref2]: https://wetten.overheid.nl/BWBR0028752#Artikel1615i
      [ref3]: https://wetten.overheid.nl/BWBR0028752#Artikel1615j
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615r
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1615h
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0028752
        artikel: 1615i
        afdeling: Vijfde
      - id: ref3
        bwb_id: BWBR0028752
        artikel: 1615j
        afdeling: Vijfde
  - number: 1615r.4
    text: |-
      Indien de door de arbeider verschuldigde schadeloosstelling meer bedraagt dan het in geld vastgestelde loon voor
      een maand of de door de werkgever verschuldigde schadeloosstelling meer bedraagt dan het in geld vastgestelde loon
      voor drie maanden, kan de rechter toestaan, dat de schadeloosstelling op door hem te bepalen wijze in termijnen
      wordt betaald.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615r
  - number: 1615r.5
    text: |-
      Van het bedrag der verschuldigde schadeloosstelling is de wettelijke rente verschuldigd, te rekenen van de dag,
      waarop de dienstbetrekking is geëindigd.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615r
  - number: 1615s.1
    text: |-
      Indien een der partijen de dienstbetrekking al of niet met inachtneming van de voor de beëindiging geldende
      bepalingen, kennelijk onredelijk doet eindigen, kan de rechter steeds aan de wederpartij naar billijkheid een
      schadevergoeding toekennen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615s
  - number: 1615s.2
    text: 'Beëindiging van de dienstbetrekking door de werkgever zal onder andere kennelijk onredelijk geacht kunnen worden:'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615s
  - number: 1615s.2.1°
    text: wanneer deze geschiedt zonder opgave van redenen of onder opgave van een voorgewende of valse reden;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615s
  - number: 1615s.2.2°
    text: |-
      wanneer, mede in aanmerking genomen de voor de arbeider getroffen voorzieningen en de voor hem bestaande
      mogelijkheden om ander passend werk te vinden, de gevolgen der beëindiging voor hem te ernstig zijn in vergelijking
      met het belang van de werkgever bij de beëindiging;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615s
  - number: 1615s.2.3°
    text: |-
      wanneer deze geschiedt in verband met een verhindering van de arbeider om de bedongen arbeid te verrichten, als
      bedoeld in [artikel 1615h, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1615h
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615s
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1615h
        afdeling: Vijfde
  - number: 1615s.2.4°
    text: |-
      wanneer deze geschiedt in afwijking van een in de bedrijfstak of de onderneming krachtens wettelijke regeling of
      gebruik geldende getalsverhoudings- of anciënniteitsregeling, tenzij hiervoor zwaarwichtige gronden aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615s
  - number: 1615s.3
    text: 'Beëindiging van de dienstbetrekking door de arbeider zal onder andere kennelijk onredelijk geacht kunnen worden:'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615s
  - number: 1615s.3.1°
    text: wanneer deze geschiedt zonder opgave van redenen of onder opgave van een voorgewende of valse reden;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615s
  - number: 1615s.3.2°
    text: |-
      wanneer de gevolgen der beëindiging voor de werkgever te ernstig zijn in vergelijking met het belang van de
      arbeider bij de beëindiging.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615s
  - number: 1615s.4
    text: |-
      Bedingen, waardoor aan een der partijen de beslissing wordt overgelaten of de dienstbetrekking al of niet kennelijk
      onredelijk is beëindigd, zijn nietig.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615s
  - number: 1615t.1
    text: |-
      De rechter kan de partij, die schadeplichtig is geworden volgens [artikel 1615o][ref1] of die de dienstbetrekking
      kennelijk onredelijk doet eindigen, ook veroordelen de dienstbetrekking te herstellen.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1615o
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615t
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1615o
        afdeling: Vijfde
  - number: 1615t.2
    text: |-
      Indien de rechter een zodanige veroordeling uitspreekt, kan hij bepalen voor of op welk tijdstip de
      dienstbetrekking moet worden hersteld en kan hij voorzieningen treffen omtrent de rechtsgevolgen van de
      onderbreking.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615t
  - number: 1615t.3
    text: |-
      De rechter kan in het vonnis, houdende veroordeling tot herstel der dienstbetrekking, bepalen dat de verplichting
      tot herstel vervalt door betaling van een in het vonnis vastgestelde afkoopsom. Is in het vonnis geen afkoopsom
      vastgesteld, dan zal de rechter deze alsnog vaststellen, indien een der patijen daartoe een verzoek indient.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615t
  - number: 1615t.4
    text: |-
      Een zodanig verzoek, door de tot herstel veroordeelde partij ingediend, schorst de tenuitvoerlegging van het
      vonnis, voor zover betreft de veroordeling tot herstel der dienstbetrekking, totdat op het verzoek is beslist,
      met dien verstande dat , wanneer het verzoek is ingediend door de werkgever, deze in ieder geval verplicht blijft
      gedurende de schorsing het loon te betalen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615t
  - number: 1615t.5
    text: |-
      De rechter stelt de hoogte der afkoopsom met het oog op de omstandigheden van het geval naar billijkheid vast; hij
      kan toestaan dat de afkoopsom op door hem te bepalen wijze in termijnen wordt betaald. Indien een afkoopsom wegens
      het niet naleven van een verplichting om een dienstbetrekking te herstellen op andere wijze is vastgesteld kan de
      rechter het bedrag van de verschuldigde afkoopsom op verzoek van de meest gerede partij wijzigen in zodanig bedrag
      als hem met het oog op de omstandigheden van het geval billijk zal voorkomen en kan hij toelaten dat de afkoopsom
      op door hem te bepalen wijze in termijnen wordt betaald.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615t
  - number: 1615u
    text: |-
      Ieder vorderingsrecht krachtens [artikel 1615o, derde lid][ref1], [1615s, eerste lid][ref2] en
      [1615t, eerste lid][ref3], verjaart na verloop van zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1615o
      [ref2]: https://wetten.overheid.nl/BWBR0028752#Artikel1615s
      [ref3]: https://wetten.overheid.nl/BWBR0028752#Artikel1615t
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615u
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1615o
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0028752
        artikel: 1615s
        afdeling: Vijfde
      - id: ref3
        bwb_id: BWBR0028752
        artikel: 1615t
        afdeling: Vijfde
  - number: 1615v.1
    text: |-
      Indien de dienstbetrekking is aangegaan voor langer dan vijf jaren of voor de duur van het leven van een bepaalde
      persoon, is niettemin de arbeider bevoegd, van het ogenblik, waarop vijf jaren sedert haar aanvang zijn verlopen,
      haar op te zeggen met inachtneming van een termijn van zes maanden.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615v
  - number: 1615v.2
    text: Elk beding, waardoor deze bevoegdheid tot opzegging wordt uitgesloten of beperkt, is nietig.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615v
  - number: 1615w.1
    text: |-
      Ieder der partijen is te allen tijde bevoegd zich wegens gewichtige redenen tot de rechter te wenden met het
      schriftelijk verzoek de arbeidsovereenkomst ontbonden te verklaren. Elk beding, waardoor deze bevoegdheid wordt
      uitgesloten of beperkt, is nietig.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615w
  - number: 1615w.2
    text: |-
      Als gewichtige redenen worden beschouwd omstandigheden, welke een dringende reden, als bedoeld in
      [artikel 1615o, eerste lid][ref1], zouden hebben opgeleverd, indien de dienstbetrekking deswege onverwijld
      beëindigd ware, alsook veranderingen in de omstandigheden, welke van dien aard zijn, dat de dienstbetrekking
      billijkheidshalve dadelijk of na korte tijd behoort te eindigen.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1615o
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615w
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1615o
        afdeling: Vijfde
  - number: 1615w.3
    text: De rechter willigt het verzoek niet in dan na verhoor of behoorlijke oproeping van de wederpartij.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615w
  - number: 1615w.4
    text: Indien de rechter het verzoek inwilligt, bepaalt hij op welk tijdstip de dienstbetrekking eindigt.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615w
  - number: 1615w.5
    text: |-
      Indien de rechter het verzoek inwilligt wegens veranderingen in de omstandigheden, kan hij, zo hem dat met het
      oog op de omstandigheden van het geval billijk voorkomt, aan een der partijen ten laste van de wederpartij een
      vergoeding toekennen; hij kan toestaan dat de vergoeding op door hem te bepalen wijze in termijnen wordt betaald.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615w
  - number: 1615w.6
    text: |-
      Alvorens een ontbinding, waaraan een vergoeding verbonden wordt, uit te spreken, stelt de rechter de partijen van
      zijn voornemen in kennis en stelt hij een termijn, binnen welke de verzoeker de bevoegdheid heeft zijn eis in te
      trekken.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615w
  - number: 1615w.7
    text: Indien de verzoeker dat doet, zal de rechter alleen een beslissing geven omtrent de proceskosten.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615w
  - number: 1615w.8
    text: Tegen een beschikking krachtens dit artikel is generlei voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615w
  - number: 1615x
    text: |-
      De bepalingen van deze afdeling sluiten voor geen van beide partijen de mogelijkheid uit van ontbinding wegens een
      tekortkoming in de nakoming van de overeenkomst en van schadevergoeding. De ontbinding kan slechts door de rechter
      worden uitgesproken.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1615x
  - number: '1616'
    text: |-
      Bij aanneming van werk kan men overeenkomen, dat de aannemer alleen arbeid verrichten, ofwel dat hij ook de stof
      leveren zal.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1616
  - number: '1617'
    text: |-
      Ingeval de aannemer de stof moet leveren, en het werk, op welke wijze ook vergaat, alvorens het geleverd is, komt
      het verlies voor zijn rekening, tenware de aanbesteder nalatig zij geweest om het werk te ontvangen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1617
  - number: '1618'
    text: |-
      Indien de aannemer alleen arbeid moet verrichten, en het werk vergaat, is hij slechts voor zijn schuld
      aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1618
  - number: '1619'
    text: |-
      Indien het werk, in het geval bij het voorgaande artikel vermeld, buiten enig plichtverzuim van de aannemer is
      verloren gegaan, voordat de levering geschied is, en zonder dat de aanbesteder nalatig is geweest om het werk op te
      nemen en goed te keuren, heeft de aannemer geen aanspraak op de bedongen prijs, tenware de zaak door een gebrek in
      de stof zelf verloren ware gegaan.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1619
  - number: '1620'
    text: |-
      Indien een werk bij het stuk of bij de maat bearbeid wordt, kan hetzelve bij gedeelten worden opgenomen; die
      opneming wordt geacht geschied te zijn voor al de betaalde gedeelten, wanneer de aanbesteder de aannemer telkens
      betaalt naar evenredigheid van hetgeen afgewerkt is.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1620
  - number: '1621'
    text: |-
      Indien een gebouw, voor een bepaalde prijs aangenomen en afgemaakt, geheel of gedeeltelijk vergaat door een gebrek
      in de samenstelling, of zelfs uit hoofde van de ongeschiktheid van de grond, zijn de bouwmeesters en aannemers
      daarvoor, gedurende tien jaren, aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1621
  - number: '1622'
    text: |-
      Indien een bouwmeester of aannemer op zich genomen heeft om een gebouw bij aanneming te maken, volgens een bestek,
      met de eigenaar van de grond beraamd en vastgesteld, kan hij geen vermeerdering van de prijs vorderen, noch
      onder voorwendsel van vermeerdering der arbeidslonen of bouwstoffen, noch onder dat van gemaakte veranderingen of
      bijvoegselen, die niet in het bestek begrepen zijn, indien die veranderingen of vergrotingen niet schriftelijk zijn
      ingewilligd, en over derzelver prijs met de eigenaar geen overeenkomst is getroffen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1622
  - number: '1623'
    text: |-
      De aanbesteder kan, des goedvindende, de aanneming opzeggen, ofschoon het werk reeds begonnen zij, mits hij de
      aannemer, wegens al deszelfs gemaakte kosten, arbeid en winstderving, volkomen schadeloosstelle.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1623
  - number: '1624.1'
    text: Aanneming van werk houdt op door de dood van de aannemer.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1624
  - number: '1624.2'
    text: |-
      Maar de aanbesteder is gehouden aan de erfgenamen, naar evenredigheid van de bij de overeenkomst bedongen prijs,
      te betalen de waarde van het gedane werk en die der in gereedheid gebrachte bouwstoffen, mits dat werk of die
      bouwstoffen hem tot enig nut kunnen verstrekken.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1624
  - number: '1625'
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1625
  - number: '1626'
    text: |-
      Metselaars, timmerlieden, smeden en andere ambachtslieden, welke tot het zetten van een gebouw of het maken
      van enig ander aangenomen werk gebezigd zijn, hebben geen rechtsvordering tegen degene, te wiens behoeve de
      werken gemaakt zijn, dan ten belope van hetgeen deze aan de aannemer schuldig is, op het ogenblik waarop zij hun
      rechtsvordering aanleggen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1626
  - number: '1627.1'
    text: |-
      Metselaars, timmerlieden, smeden en andere ambachtslieden, die zelf onmiddellijk en voor een bepaalde prijs een
      werk op zich nemen, zijn gehouden aan de regelen in deze afdeling voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1627
  - number: '1627.2'
    text: Zij zijn aannemers in het vak, waarin zij werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1627
  - number: '1628.1'
    text: |-
      De aannemer die een retentierecht uitoefent op een onroerende zaak kan dit tegen een hypotheekhouder met een
      ouder recht slechts inroepen voor zover zijn prestatie tot een hogere opbrengst van het goed ten bate van de
      hypotheekhouder heeft geleid.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1628
  - number: '1628.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing indien uit andere hoofde dan aanneming van werk een retentierecht
      wordt uitgeoefend op een onroerende zaak.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1628
  - number: '1629'
    text: |-
      De rechten en verplichtingen van voerlieden en schippers zijn in het [Wetboek van Koophandel BES][ref1]
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028278
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1629
    references:
      - id: ref1
        bwb_id: BWBR0028278
  - number: '1630'
    text: |-
      Maatschap is een overeenkomst, waarbij twee of meer personen zich verbinden om iets in gemeenschap te brengen, met
      het oogmerk om het daaruit ontstaande voordeel met elkander te delen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1630
  - number: '1631'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1631
  - number: '1632'
    text: Maatschappen zijn, of algeheel, of bijzonder.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1632
  - number: '1633'
    text: |-
      De wet kent slechts de algehele maatschap van winst. Zij verbiedt alle maatschappen, hetzij van al de goederen,
      hetzij van een bepaald gedeelte van dezelve onder een algemene titel; onverminderd de bepalingen, vastgesteld in de
      [zesde][ref1] en [zevende titel van het eerste boek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028743
      [ref2]: https://wetten.overheid.nl/BWBR0028743
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1633
    references:
      - id: ref1
        bwb_id: BWBR0028743
      - id: ref2
        bwb_id: BWBR0028743
  - number: '1634'
    text: |-
      De algehele maatschap van winst bevat slechts hetgeen partijen, onder welke benaming ook, gedurende de loop der
      maatschap door haar vlijt zullen verkrijgen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1634
  - number: '1635'
    text: |-
      De bijzondere maatschap is de zodanige, welke slechts betrekking heeft tot zekere bepaalde goederen, of tot
      derzelver gebruik, of tot de vruchten die daarvan zullen getrokken worden, of tot een bepaalde onderneming, of tot
      de uitoefening van enig bedrijf of beroep.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1635
  - number: '1636'
    text: De maatschap begint van het ogenblik der overeenkomst, indien daarbij geen ander tijdstip bepaald is.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1636
  - number: '1637.1'
    text: De inbreng van de vennoot kan bestaan in geld, goederen, genot van goederen en arbeid.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1637
  - number: '1637.2'
    text: |-
      Op de inbreng van een goed zijn de bepalingen omtrent koop, op de inbreng van genot van een goed de
      [artikelen 1564 tot en met 1612][ref1] van overeenkomstige toepassing, voor zover de aard van de rechtsverhouding
      zich daartegen niet verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1564
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1637
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: '1564'
        afdeling: '1'
  - number: '1638'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1638
  - number: '1639'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1639
  - number: '1640'
    text: |-
      Wanneer een der vennoten, voor zijn eigen rekening, een opeisbare som te vorderen heeft van iemand, die mede een
      insgelijks opeisbare som verschuldigd is aan de maatschap, moet de betaling, welke hij ontvangt, op de inschuld
      der maatschap en op die van hemzelf, naar evenredigheid van beide die vorderingen, toegerekend worden, al ware het
      ook dat hij, bij de kwijting, alles in mindering of voldoening van zijn eigen inschuld mocht gebracht hebben; maar
      indien hij bij de kwijting bepaald heeft, dat de gehele betaling zoude strekken voor de inschuld der maatschap, zal
      deze bepaling worden nagekomen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1640
  - number: '1641'
    text: |-
      Indien een der vennoten zijn gehele aandeel in een gemene inschuld der maatschap ontvangen heeft, en de schuldenaar
      naderhand onvermogend is geworden, is die vennoot gehouden het ontvangene in de gemene kas in te brengen, al had
      hij ook voor zijn aandeel kwijting gegeven.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1641
  - number: '1642'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1642
  - number: '1643'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1643
  - number: '1644'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1644
  - number: '1645.1'
    text: |-
      Indien bij de overeenkomst van maatschap het aandeel van iedere vennoot in de winsten en de verliezen niet is
      bepaald, is elks aandeel geëvenredigd aan hetgeen hij in de maatschap heeft ingebracht.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1645
  - number: '1645.2'
    text: |-
      Ten aanzien van degene, die slechts zijn nijverheid heeft ingebracht, wordt het aandeel in de winsten en de
      verliezen berekend gelijk te staan met het aandeel van degene der vennoten, die het minst heeft ingebracht.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1645
  - number: '1646.1'
    text: |-
      De vennoten kunnen niet bedingen, dat zij de regeling der begroting van hun aandeel aan een hunner of aan een derde
      zullen overlaten.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1646
  - number: '1646.2'
    text: Een zodanig beding wordt voorondersteld niet geschreven te zijn.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1646
  - number: '1647.1'
    text: Het beding, waarbij aan een der vennoten al de voordelen mochten toegezegd zijn, is nietig.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1647
  - number: '1647.2'
    text: |-
      Maar het is geoorloofd te bedingen, dat al de verliezen bij uitsluiting door een of meer der vennoten zullen
      gedragen worden.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1647
  - number: '1648.1'
    text: |-
      De vennoot, die bij een bijzonder beding van de overeenkomst van maatschap met het beheer belast is, kan zelfs in
      weerwil der overige vennoten, alle daden verrichten, welke tot zijn beheer betrekkelijk zijn.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1648
  - number: '1648.2'
    text: |-
      Deze macht kan, zolang de maatschap duurt, niet zonder gewichtige reden herroepen worden; maar indien dezelve niet
      bij de overeenkomst der maatschap, maar bij een latere akte, is gegeven, is zij, evenals een eenvoudige lastgeving,
      herroepelijk.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1648
  - number: '1649'
    text: |-
      Indien verscheidene vennoten met het beheer belast zijn, zonder dat hun bijzondere werkzaamheden bepaald zijn,
      of zonder beding dat de een buiten de ander niets zoude mogen verrichten, is ieder van hen afzonderlijk tot alle
      handelingen, dat beheer betreffende, bevoegd.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1649
  - number: '1650'
    text: |-
      Indien er bedongen is, dat een der beheerders niets buiten de andere zoude mogen verrichten, vermag de ene,
      zonder een nieuwe overeenkomst, niet te handelen zonder medewerking van de andere, al mocht deze zich ook voor het
      ogenblik in de onmogelijkheid bevinden om aan de daden van het beheer deel te nemen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1650
  - number: '1651'
    text: 'Bij gebreke van bijzondere bedingen omtrent de wijze van beheer, moeten de volgende regelen worden in acht genomen:'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1651
  - number: 1651.1°
    text: |-
      de vennoten worden geacht zich over en weder de macht te hebben verleend om de een voor de ander te beheren.
      Hetgeen ieder van hen verricht, is ook verbindend voor het aandeel der overige vennoten, zonder dat hij hun
      toestemming hebbe bekomen; onverminderd het recht van deze laatstgemelden, of van een hunner, om zich tegen de
      handeling, zolang die nog niet gesloten is, te verzetten;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1651
  - number: 1651.2°
    text: |-
      ieder der vennoten mag gebruik maken van de goederen aan de maatschap toebehorende, mits hij dezelve tot zodanige
      einden gebruike, als waartoe zij gewoonlijk bestemd zijn, en mits hij zich van dezelve niet bediene tegen het
      belang der maatschap, of op zodanige wijze, dat de overige vennoten daardoor verhinderd worden om van die goederen,
      volgens hun recht, mede gebruik te maken;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1651
  - number: 1651.3°
    text: |-
      iedere vennoot heeft de bevoegdheid om de overige vennoten te verplichten in de onkosten te dragen, welke tot
      behoud der aan de maatschap behorende goederen noodzakelijk zijn;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1651
  - number: 1651.4°
    text: |-
      geen der vennoten kan, zonder toestemming der overige, enige nieuwigheden daarstellen ten aanzien der onroerende
      zaken, welke tot de maatschap behoren, al beweerde hij ook, dat dezelve voor de maatschap voordelig waren.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1651
  - number: '1652'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1652
  - number: '1653'
    text: |-
      Elk der vennoten mag, zelfs zonder toestemming der overige, een derde persoon aannemen als deelgenoot in het
      aandeel, hetwelk hij in de maatschap heeft; doch hij kan dezelve, zonder zodanige toestemming, niet als medelid der
      maatschap toelaten, al mocht hij ook met het beheer der zaken van de maatschap belast zijn.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1653
  - number: '1654'
    text: |-
      De vennoten zijn niet ieder voor het geheel voor de schulden der maatschap verbonden, en een der vennoten kan de
      overige niet verbinden, indien deze hem daartoe geen volmacht gegeven hebben.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1654
  - number: '1655'
    text: |-
      De vennoten kunnen door de schuldeiser, met wie zij gehandeld hebben, aangesproken worden, ieder voor gelijke som
      en gelijk aandeel, al ware het dat het aandeel in de maatschap van de ene minder dan dat van de andere bedroeg,
      tenzij, bij het aangaan der schuld, derzelver verplichting, om in evenredigheid van het aandeel in de maatschap van
      elke vennoot te dragen, uitdrukkelijk zij bepaald.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1655
  - number: '1656'
    text: |-
      Het beding, dat een handeling voor rekening der maatschap is aangegaan, verbindt slechts de vennoot, die dezelve
      aangegaan heeft, maar niet de overige, tenzij de laatstgenoemden hem daartoe volmacht hadden gegeven, of de zaak
      ten voordele der maatschap gestrekt hebbe.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1656
  - number: '1657'
    text: |-
      Indien een der vennoten in naam der maatschap een overeenkomst heeft aangegaan, kan de maatschap de uitvoering
      daarvan vorderen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1657
  - number: '1658'
    text: 'Een maatschap wordt ontbonden:'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1658
  - number: 1658.1°
    text: door verloop van de tijd, voor welke dezelve is aangegaan;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1658
  - number: 1658.2°
    text: door het tenietgaan van een goed of de volbrenging der handeling, die het onderwerp der maatschap uitmaakt;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1658
  - number: 1658.3°
    text: door opzegging van een vennoot aan de andere vennoten;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1658
  - number: 1658.4°
    text: door de dood of de curatele van een hunner, of indien hij in staat van faillissement is verklaard.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1658
  - number: '1659.1'
    text: De rechter kan op vordering van ieder der vennoten de maatschap wegens gewichtige redenen ontbinden.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1659
  - number: '1659.2'
    text: |-
      Een zodanige ontbinding heeft geen terugwerkende kracht. De rechter kan de vordering toewijzen onder door
      hem te stellen voorwaarden en een partij die in de naleving van haar verplichtingen is tekortgeschoten, met
      overeenkomstige toepassing van [artikel 277 van Boek 6][ref1] tot schadevergoeding veroordelen.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel277
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1659
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '277'
  - number: '1659.3'
    text: |-
      De [artikelen 265 tot en met 279 van Boek 6][ref1] zijn op een maatschap niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel265
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1659
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '265'
  - number: '1660'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1660
  - number: '1661.1'
    text: Een opzegging is vernietigbaar, indien zij in strijd met de redelijkheid en billijkheid is geschied.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1661
  - number: '1661.2'
    text: |-
      Een vennootschap voor bepaalde tijd of voor een bepaald werk aangegaan, kan niet worden opgezegd, tenzij dit is
      bedongen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1661
  - number: '1662'
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1662
  - number: '1663.1'
    text: |-
      Indien bedongen is, dat, in geval van overlijden van een der vennoten, de maatschap met deszelfs erfgenaam, of
      alleen tussen de overblijvende vennoten, zoude voortduren, moet dat beding worden nagekomen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1663
  - number: '1663.2'
    text: |-
      In het tweede geval heeft de erfgenaam des overledenen geen verder recht dan op de verdeling der maatschap,
      overeenkomstig de gesteldheid, waarin dezelve zich ten tijde van dat overlijden bevond; doch hij deelt in
      de voordelen en draagt in de verliezen, die de noodzakelijke gevolgen zijn van verrichtingen, welke vóór het
      overlijden van de vennoot, wiens erfgenaam hij is, hebben plaatsgehad.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1663
  - number: 1664 t/m 1684
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1664_tm_1684
  - number: '1685.1'
    text: |-
      Schenkingen is een overeenkomst, waarbij de schenker, bij zijn leven, om niet en onherroepelijk enig goed afstaat
      ten behoeve van de begiftigde, die hetzelve aanneemt.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1685
  - number: '1685.2'
    text: De wet erkent geen andere schenkingen dan schenkingen onder de levenden.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1685
  - number: '1686.1'
    text: Schenkingen vermag alleen de tegenwoordige goederen van de schenker te bevatten.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1686
  - number: '1686.2'
    text: Indien dezelve toekomstige goederen bevat, is zij te dien opzichte nietig.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1686
  - number: '1687'
    text: |-
      De schenker mag zich niet voorbehouden de bevoegdheid om over een voorwerp, in de schenking begrepen, te
      beschikken; zodanige schenking wordt, voor zoveel dat voorwerp aangaat, als nietig beschouwd.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1687
  - number: '1688'
    text: |-
      Het is aan de schenker geoorloofd zich het genot of vruchtgebruik van geschonken goederen te zijnen eigen voordele
      voor te behouden, of daarover ten behoeve van een ander te beschikken; in welke gevallen de bepalingen van titel 8
      van Boek 3 zullen moeten worden in acht genomen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1688
  - number: '1689'
    text: |-
      Een schenking is nietig, indien zij gemaakt is onder voorwaarde om andere schulden of lasten te voldoen dan die,
      welke uitgedrukt staan in de akte van schenking zelf, of in een staat, welke daaraan zal moeten zijn vastgehecht.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1689
  - number: '1690.1'
    text: De schenker mag zich voorbehouden om over een bepaalde geldsom uit de geschonken goederen te beschikken.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1690
  - number: '1690.2'
    text: |-
      Indien hij overlijdt zonder over die geldsom beschikt te hebben, blijft het geschonkene in het geheel aan de
      begiftigde.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1690
  - number: '1691'
    text: |-
      De schenker vermag zich het recht voor te behouden om de gegeven goederen tot zich te doen terugkeren, hetzij
      ingeval de begiftigde alleen, of deze en zijn afkomelingen vóór de schenker kwamen te overlijden, maar dit kan niet
      anders bedongen worden dan ten behoeve van de schenker alleen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1691
  - number: '1692'
    text: |-
      Het gevolg van het recht van terugkering zal daarin bestaan, dat alle vervreemdingen der geschonken goederen worden
      vernietigd, en die goederen tot de schenker terugkeren vrij en ontheven van alle lasten en hypotheken, welke daarop
      sedert het tijdstip der schenking mochten gelegd zijn.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1692
  - number: '1693'
    text: De schenker is in geval van uitwinning tot geen vrijwaring gehouden.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1693
  - number: '1694'
    text: |-
      De bepalingen van de [artikelen 906][ref1], [907][ref2], [908][ref3], 908, [909][ref4] en [911][ref5], die van
      [artikel 921][ref6], en eindelijk de [zevende][ref7] en [achtste afdeling van de twaalfde titel van Boek 4][ref8],
      zijn op schenkingen toepasselijk.


      [ref1]: https://wetten.overheid.nl/BWBR0028746#Artikel906
      [ref2]: https://wetten.overheid.nl/BWBR0028746#Artikel907
      [ref3]: https://wetten.overheid.nl/BWBR0028746#Artikel908
      [ref4]: https://wetten.overheid.nl/BWBR0028746#Artikel909
      [ref5]: https://wetten.overheid.nl/BWBR0028746#Artikel911
      [ref6]: https://wetten.overheid.nl/BWBR0028746#Artikel921
      [ref7]: https://wetten.overheid.nl/BWBR0028746#AfdelingZevende
      [ref8]: https://wetten.overheid.nl/BWBR0028746#AfdelingAchtste
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1694
    references:
      - id: ref1
        bwb_id: BWBR0028746
        artikel: '906'
      - id: ref2
        bwb_id: BWBR0028746
        artikel: '907'
      - id: ref3
        bwb_id: BWBR0028746
        artikel: '908'
      - id: ref4
        bwb_id: BWBR0028746
        artikel: '909'
      - id: ref5
        bwb_id: BWBR0028746
        artikel: '911'
      - id: ref6
        bwb_id: BWBR0028746
        artikel: '921'
      - id: ref7
        bwb_id: BWBR0028746
        afdeling: Zevende
      - id: ref8
        bwb_id: BWBR0028746
        afdeling: Achtste
  - number: '1695'
    text: |-
      Alle personen mogen bij wege van schenking beschikken en genieten, uitgezonderd de zodanige, welke de wet daartoe
      onbekwaam verklaart.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1695
  - number: '1696'
    text: |-
      Minderjarigen mogen niet bij wege van schenking beschikken, behoudens hetgeen bij de zevende titel van het eerste
      boek is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1696
  - number: '1697.1'
    text: Schenkingen tussen echtgenoten, staande huwelijk gedaan, zijn verboden.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1697
  - number: '1697.2'
    text: |-
      Deze bepaling is echter niet toepasselijk op geschenken of handgiften van roerende zaken of geldsommen, waarvan de
      waarden of het beloop niet bovenmatig is in aanmerking van de gegoedheid des schenkers.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1697
  - number: '1698'
    text: |-
      Ten einde bekwaam te zijn om bij wege van schenking voordeel te genieten, moet de begiftigde, op het tijdstip
      waarop de schenking heeft plaatsgehad, bestaan.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1698
  - number: '1699'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1699
  - number: '1700'
    text: |-
      De bepalingen van het[ tweede en van het laatste lid van artikel 931][ref1], mitsgaders de [artikelen 933][ref2],
      [934][ref3], [935][ref4] en [937][ref5], zijn op schenkingen toepasselijk.


      [ref1]: https://wetten.overheid.nl/BWBR0028746#Artikel931
      [ref2]: https://wetten.overheid.nl/BWBR0028746#Artikel933
      [ref3]: https://wetten.overheid.nl/BWBR0028746#Artikel934
      [ref4]: https://wetten.overheid.nl/BWBR0028746#Artikel935
      [ref5]: https://wetten.overheid.nl/BWBR0028746#Artikel937
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1700
    references:
      - id: ref1
        bwb_id: BWBR0028746
        artikel: '931'
      - id: ref2
        bwb_id: BWBR0028746
        artikel: '933'
      - id: ref3
        bwb_id: BWBR0028746
        artikel: '934'
      - id: ref4
        bwb_id: BWBR0028746
        artikel: '935'
      - id: ref5
        bwb_id: BWBR0028746
        artikel: '937'
  - number: '1701'
    text: |-
      Geen schenking, uitgezonderd degene waarvan bij [artikel 1706][ref1] wordt gehandeld, kan op straffe van nietigheid
      anders gedaan worden dan bij een notariële akte, waarvan de minuut onder de notaris is verbleven.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1706
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1701
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: '1706'
        afdeling: Derde
  - number: '1702.1'
    text: |-
      Geen schenking is voor de schenker verbindend, of brengt enig gevolg hoegenaamd teweeg, dan van de dag, waarop
      dezelve in uitdrukkelijke bewoordingen zal zijn aangenomen, hetzij door de begiftigde zelf, hetzij door een
      persoon, aan wie door deze, bij een authentieke akte, de volmacht is verleend om schenkingen aan te nemen, welke
      aan de begiftigde gedaan zijn, of in het vervolg mochten gedaan worden.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1702
  - number: '1702.2'
    text: |-
      Indien de aanneming niet bij de akte van schenking zelf gedaan is, zal zulks kunnen geschieden bij een latere
      authentieke akte, waarvan een minuut zal worden gehouden, mits dit plaatshebbe gedurende het leven van de schenker;
      in welk geval de schenking, ten opzichte van deze laatstgenoemde, slechts van kracht zal zijn van de dag, waarop de
      aanneming aan deze zal zijn betekend geworden.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1702
  - number: '1703.1'
    text: |-
      Een schenker kan door geen akte van bevestiging de gebreken verhelpen ener schenking die nietig in de vorm is; die
      schenking moet om geldig te zijn, opnieuw in de wettige vorm worden gebracht.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1703
  - number: '1703.2'
    text: |-
      De bevestiging, bekrachtiging of vrijwillige nakoming ener schenking, door de erfgenamen of rechtverkrijgenden
      van de schenker, na diens overlijden gedaan, versteekt dezen van de bevoegdheid om zich op eenig gebrek in de vorm
      te beroepen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1703
  - number: '1704.1'
    text: |-
      Schenking aan minderjarigen die onder ouderlijk gezag van beide ouders staan, kan worden aangenomen door de ouders
      of – indien een ouder het gezag alleen uitoefent – door die ouder.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1704
  - number: '1704.2'
    text: |-
      Schenking, aan onder voogdij staande minderjarigen of onder curatele gestelden gedaan, wordt aangenomen door de
      voogd of curator.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1704
  - number: '1704.3'
    text: |-
      Indien de in [artikel 345, eerste lid, onder c, van Boek 1][ref1], bedoelde machtiging is vereist en deze wordt
      verleend, blijft de schenking van kracht al mocht de schenker vóór het verlenen van de machtiging zijn overleden.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel345
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1704
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '345'
  - number: '1705'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1705
  - number: '1706'
    text: |-
      De giften van hand tot hand van roerende zaken, geldsommen of schuldvorderingen aan toonder, vereisen geen akte,
      en zijn van kracht door de enkele overlevering aan de begiftigde, of aan een derde, die het gegevene voor hem
      aanneemt.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1706
  - number: '1707'
    text: 'Een schenking is, ongeacht of zij reeds is uitgevoerd, vernietigbaar:'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1707
  - number: '1707.1'
    text: uit hoofde van niet-vervulling van de voorwaarden waaronder zij gedaan is;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1707
  - number: '1707.2'
    text: |-
      indien de begiftigde is veroordeeld wegens het opzettelijk plegen van of medeplichtigheid aan een misdrijf jegens
      de schenker;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1707
  - number: '1707.3'
    text: |-
      indien de begiftigde wettelijk verplicht is in het onderhoud van de schenker bij te dragen en hij in verzuim is
      deze verplichting na te komen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1707
  - number: '1708'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1708
  - number: '1709'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1709
  - number: '1710'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1710
  - number: '1711.1'
    text: |-
      De bevoegdheid in rechte een beroep te doen op een vernietigingsgrond, vermeld in [artikel 1707][ref1], vervalt na
      verloop van een jaar na de dag waarop die grond is ontstaan en aan de schenker bekend heeft kunnen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1707
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1711
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: '1707'
        afdeling: Vierde
  - number: '1711.2'
    text: |-
      Het beroep kan niet worden gedaan door de schenker tegen de erfgenamen van de begiftigde, noch door de erfgenamen
      van de schenker ware aangevangen, of deze binnen het jaar van de ten laste gelegde daad mocht zijn overleden.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1711
  - number: '1712'
    text: |-
      Door de bepalingen van deze titel wordt geen hinder toegebracht aan hetgeen bij de
      [zevende titel van het eerste boek][ref1] is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028743
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1712
    references:
      - id: ref1
        bwb_id: BWBR0028743
  - number: 1713 t/m 1758
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1713_tm_1758
  - number: '1759'
    text: |-
      Bruiklening is een overeenkomst, waarbij de ene partij aan de andere een zaak om niet ten gebruike geeft, onder
      voorwaarde dat degene, die deze zaak ontvangt, dezelve, na daarvan gebruik te hebben gemaakt, of na een bepaalde
      tijd, zal teruggeven.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1759
  - number: '1760'
    text: De uitlener blijft eigenaar van de geleende zaak.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1760
  - number: '1761'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1761
  - number: '1762.1'
    text: |-
      De verbintenissen, welke uit de bruiklening voortspruiten, gaan over tot de erfgenamen van degene, die ter leen
      geeft, en van hem, die ter leen ontvangt.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1762
  - number: '1762.2'
    text: |-
      Maar indien men de uitlening gedaan heeft alleen uit aanmerking van degene, die ter leen ontvangt, en aan deszelfs
      persoon in het bijzonder, kunnen deszelfs erfgenamen het verdere genot van de geleende zaak niet blijven behouden.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1762
  - number: '1763.1'
    text: |-
      Die iets ter leen ontvangt, is gehouden, als een goed huisvader, voor de bewaring en het behoud van de geleende
      zaak te zorgen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1763
  - number: '1763.2'
    text: |-
      Hij mag daarvan geen ander gebruik maken dan hetwelk de aard der zaak medebrengt, of bij de overeenkomst bepaald
      is.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1763
  - number: '1764'
    text: |-
      Indien de geleende zaak verloren gaat door een toeval, hetwelk degene, die dezelve ter leen ontvangen heeft, door
      zijn eigen zaak te gebruiken, had kunnen voorkomen, of indien hij, slechts een van beide kunnende behouden, aan de
      zijne een voorrang heeft gegeven, is hij voor het verlies der andere zaak aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1764
  - number: '1765'
    text: |-
      Indien de zaak bij het ter leen geven geschat is, komt het verlies van dezelve, al ontstond dat ook door toeval,
      ten laste van degene, die de zaak ter leen ontvangen heeft, tenware het tegendeel mocht bedongen zijn.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1765
  - number: '1766'
    text: |-
      Indien de zaak alleen tengevolge van het gebruik, waartoe dezelve geleend is, en buiten schuld van de gebruiker, in
      waarde vermindert, is deze wegens die vermindering niet aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1766
  - number: '1767'
    text: |-
      Indien de gebruiker, om van de geleende zaak gebruik te kunnen maken, enige onkosten gemaakt heeft, kan hij dezelve
      niet terugvorderen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1767
  - number: '1768'
    text: |-
      Indien een zaak in bruikleen is gegeven aan twee of meer personen tezamen, zijn zij hoofdelijk verbonden tot
      teruggave daarvan en tot vergoeding van de schade die het gevolg is van een tekortschieten in de nakoming van die
      verplichting, tenzij de tekortkoming aan geen van hen kan worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1768
  - number: '1769'
    text: |-
      De uitlener kan de geleende zaak niet terugvorderen dan na verloop van de bepaalde tijd, of, bij gebreke ener
      dusdanige bepaling, nadat dezelve tot het gebruik, waartoe zij was uitgeleend, gediend heeft, of heeft kunnen
      dienen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1769
  - number: '1770'
    text: |-
      Indien evenwel de uitlener, gedurende dat tijdsverloop, of voordat de behoefte van de gebruiker opgehouden heeft,
      de geleende zaak, om dringende en onverwachts opkomende redenen, zelf benodigd heeft, kan de rechter, naar gelang
      der omstandigheden, de gebruiker noodzaken het geleende aan de uitlener terug te geven.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1770
  - number: '1771'
    text: |-
      Indien de gebruiker, gedurende de bruiklening, tot behoud der zaak enige buitengewone noodzakelijke onkosten heeft
      moeten maken, welke zo dringend waren, dat hij daarvan tevoren aan de uitlener geen kennis heeft kunnen geven, is
      deze verplicht hem dezelve te vergoeden.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1771
  - number: '1772'
    text: |-
      Indien de ter leen gegeven zaak zodanige gebreken heeft, dat daardoor aan degene, die zich van dezelve bedient,
      nadeel zoude kunnen worden toegebracht, is de uitlener, zo hij die gebreken gekend, en daarvan aan de gebruiker
      geen kennis gegeven heeft, voor de gevolgen verantwoordelijk.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1772
  - number: '1773'
    text: |-
      Verbruiklening is een overeenkomst, waarbij de ene partij aan de andere een zekere hoeveelheid van verbruikbare
      goederen afgeeft, onder voorwaarde dat de laatstgemelde haar even zoveel, van gelijke soort en hoedanigheid,
      teruggeve.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1773
  - number: '1774'
    text: |-
      Uit kracht deze verbruiklening wordt degene, die ter leen ontvangt, rechthebbende op het geleende goed, en indien
      hetzelve, op welke wijze ook, vergaat, komt dat verlies voor zijn rekening.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1774
  - number: '1775'
    text: De schuld, uit lening van geld voortspruitende, bestaat alleen in geldsom, die bij de overeenkomst is uitgedrukt.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1775
  - number: '1776'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1776
  - number: '1777'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1777
  - number: '1778'
    text: De uilener kan het ter leen gegevene niet terugeisen, voordat de tijd, bij de overeenkomst bepaald, verstreken is.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1778
  - number: '1779'
    text: |-
      Geen tijdsbepaling gemaakt zijnde, kan de rechter, wanneer de uitlener de teruggave vordert, naar gelang der
      omstandigheden, aan degene, die het goed ter leen ontvangen heeft, enig uitstel toestaan.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1779
  - number: '1780'
    text: |-
      Indien men is overeengekomen, dat hij, die een goed ter leen heeft ontvangen, dit zal teruggeven, wanneer hij
      daartoe in staat zal zijn, zal de rechter, naar gelang der omstandigheden, de tijd der teruggave bepalen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1780
  - number: '1781'
    text: |-
      De bepaling van [artikel 1772][ref1] is op verbruiklening toepasselijk.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1772
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1781
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: '1772'
        afdeling: Derde
  - number: '1782'
    text: |-
      Die iets ter leen ontvangt, is verplicht hetzelve, in gelijke hoeveelheid en hoedanigheid, en op de bepaalde tijd,
      terug te geven.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1782
  - number: '1783.1'
    text: |-
      Indien hij zich in de onmogelijkheid bevindt om hieraan te voldoen, is hij gehouden de waarde van het geleende te
      betalen, waarbij zullen moeten in aanmerking genomen worden de tijd en de plaats, waarop het goed, tengevolge der
      overeenkomst, had moeten worden teruggegeven.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1783
  - number: '1783.2'
    text: |-
      Indien deze tijd en plaats niet bepaald zijn, moet de voldoening geschieden overeenkomstig de waarde, welke het
      geleende goed, ten tijde waarop en ter plaatse alwaar de lening geschied is, gehad heeft.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1783
  - number: '1784'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1784
  - number: '1785'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1785
  - number: '1786'
    text: De hoegrootheid der bij overeenkomst bedongen rente moet in geschrift worden bepaald.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1786
  - number: '1787'
    text: |-
      Indien de uitlener rente bedongen heeft, zonder dat het beloop daarvan bepaald zij, is degene, die ter leen
      ontvangen heeft, gehouden het beloop der wettelijke rente te voldoen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1787
  - number: '1788'
    text: |-
      Het bewijs van de betaling der hoofdsom, zonder voorbehoud van rente gegeven zijnde, doet de voldoening der rente
      vooronderstellen, en de schuldenaar wordt daarvan bevrijd.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1788
  - number: '1789'
    text: |-
      Het vestigen ener altijddurende rente is een overeenkomst, waarbij de uitlener interesten bedingt, tegen betaling
      ener hoofdsom, welke hij aanneemt niet terug te zullen vorderen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1789
  - number: '1790.1'
    text: Deze rente is uit haar aard aflosbaar.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1790
  - number: '1790.2'
    text: |-
      Partijen kunnen alleenlijk overeenkomen, dat de aflossing niet geschieden zal dan na verloop van een zekere tijd,
      welke niet langer dan voor tien jaren mag gesteld worden, of zonder dat zij de schuldeiser vooraf verwittigd hebben
      op een zekere door hen bevorens vastgestelde termijn, welke echter de tijd van een jaar niet zal mogen te boven
      gaan.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1790
  - number: '1791'
    text: 'De schuldenaar ener altijddurende rente kan tot de aflossing genoodzaakt worden:'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1791
  - number: 1791.1°
    text: indien hij niets betaald heeft op de gedurende twee achtereenvolgende jaren verschuldigde renten;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1791
  - number: 1791.2°
    text: indien hij verzuimt aan de geldschieter de bij de overeenkomst beloofde zekerheid te bezorgen;
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1791
  - number: 1791.3°
    text: indien hij in staat van faillissement is verklaard.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1791
  - number: '1792'
    text: |-
      In de twee eerste gevallen, bij het vorige artikel vermeld, kan de schuldenaar zich van de verplichting tot
      aflossing ontheffen, indien hij binnen de twintig dagen, te rekenen van de gerechtelijke aanmaning, al de
      verschenen termijnen betaalt of de beloofde zekerheid stelt.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1792
  - number: '1793.1'
    text: |-
      Een kansovereenkomst is een handeling, waarvan de uitkomsten, met betrekking tot voordeel en nadeel, hetzij voor al
      de partijen, hetzij voor enige derzelve, van een onzekere gebeurtenis afhangen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1793
  - number: '1793.2'
    text: |-
      Van dien aard zijn: - de overeenkomst van verzekering;
        - lijfrenten;
        - spel en weddenschap; overeenkomsten tot verrekening van een koers- of prijsverschil.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1793
  - number: '1793.3'
    text: |-
      De eerste overeenkomst wordt bij het [Wetboek van Koophandel BES][ref1] geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0028278
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1793
    references:
      - id: ref1
        bwb_id: BWBR0028278
  - number: '1794'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1794
  - number: '1795'
    text: |-
      Lijfrente kan worden gevestigd, hetzij op het lijf des geldschieters, of van hem wie men daarvan het genot geeft,
      hetzij op dat van een derde, ofschoon deze daarvan geen genot hebbe.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1795
  - number: '1796'
    text: Dezelve kan gevestigd worden op het lijf van een of meer personen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1796
  - number: '1797'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1797
  - number: '1798'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1798
  - number: '1799'
    text: Lijfrente kan tot zodanig beloop van renten gesteld worden, als partijen goedvinden te bepalen.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1799
  - number: '1800'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1800
  - number: '1801'
    text: |-
      Indien de schuldenaar met betaling van verschenen lijfrente in verzuim is, kan de renteheffer vorderen dat
      zekerheid wordt gesteld over de te vervallen rente.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1801
  - number: '1802'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1802
  - number: '1803'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1803
  - number: '1804.1'
    text: |-
      De gerechtigde tot een lijfrente heeft slechts een verkregen recht op de lijfrente, naar evenredigheid van het
      getal der dagen, welke degene geleefd heeft op wiens lijf de rente is gevestigd.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1804
  - number: '1804.2'
    text: |-
      Indien echter de overeenkomst medebrengt, dat de rente vooruit moet worden betaald, is het recht op de termijn, die
      betaald had behoren te zijn, verkregen van de dag, waarop de betaling had moeten geschieden.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1804
  - number: '1805'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1805
  - number: '1806'
    text: |-
      De renteheffer kan de verschenen rente niet vorderen dan door te doen blijken van het leven van hem, op wie de
      lijfrente gevestigd is.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1806
  - number: '1807'
    text: De wet staat geen rechtsvordering toe ter zake van een schuld uit spel of uit weddingschap voortgesproten.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1807
  - number: '1808.1'
    text: |-
      Onder de hierboven staande bepaling zijn echter niet begrepen die spelen, welke geschikt zijn tot lichaamsoefening,
      als het schermen, wedlopen en dergelijke.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1808
  - number: '1808.2'
    text: Niettemin kan de rechter de eis ontzeggen of verminderen, wanneer hem de som overmatig toeschijnt.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1808
  - number: '1809'
    text: Van de vorige twee artikelen kan op generlei wijze worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1809
  - number: '1810'
    text: |-
      In geen geval kan hij, die het verlorene vrijwillig betaald heeft, hetzelve terugeisen, tenware van de kant van
      degene, die gewonnen heeft, bedrog, list of oplichting hebbe plaatsgehad.
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1810
  - number: 1811 t/m 1883
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028752/2026-01-01#Artikel1811_tm_1883
