  - number: '7'
    text: |-
      1 De minister betaalt op of omstreeks 15 februari 2001 aan gemeenten een voorschot van 50% van de maximale subsidie
      bedoeld in [artikel 4, tweede lid][ref1], zonder dat daartoe door burgemeester en wethouders reeds een aanvraag
      is ingediend.

      2 Gemeenten die over het jaar 1999 geen of een nihil jaaropgave als bedoeld in artikel 11 van de Regeling
      kinderopvang en buitenschoolse opvang alleenstaande ouders 1999 en over het jaar 2000 geen aanvraag voor
      kinderopvang als bedoeld in artikel 6, eerste lid, van de Regeling kinderopvang en buitenschoolse opvang
      alleenstaande ouders 2000 hebben ingediend, ontvangen geen voorschot, tenzij de aanvraag bedoeld in
      [artikel 6, eerste lid][ref2], uiterlijk op 1 februari 2001 door de minister is ontvangen. In dat geval ontvangt de
      gemeente het voorschot, bedoeld in het eerste lid, op of omstreeks 15 maart 2001.

      3 De minister betaalt op of omstreeks 15 juni 2001 aan gemeenten een voorschot van 80% van de maximale subsidie,
      bedoeld in [artikel 6, zesde lid][ref3]. Bij de betaalbaarstelling van dit voorschot wordt het voorschot, bedoeld
      in het eerste of tweede lid, verrekend dan wel teruggevorderd.

      4 Indien de minister gebruik maakt van zijn bevoegdheid, bedoeld in [artikel 4, derde lid][ref4], of
      [artikel 5, vijfde lid][ref5], wordt de daaruit voortvloeiende hogere subsidie zo spoedig mogelijk bij wijze
      van voorschot in één keer aan gemeenten betaalbaar gesteld tot 80% van de maximale subsidie, bedoeld in
      [artikel 6, zesde lid][ref6].


