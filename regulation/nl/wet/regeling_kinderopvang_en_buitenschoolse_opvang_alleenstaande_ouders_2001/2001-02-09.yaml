  - number: '6'
    text: |-
      1 Burgemeester en wethouders dragen zorg dat de minister uiterlijk op 1 april 2001 een aanvraag heeft ontvangen om
      in aanmerking te komen voor subsidie.

      2 Bij de aanvraag wordt aangegeven tot welk subsidiebedrag burgemeester en wethouders voornemens zijn in 2001 door
      middel van overeenkomsten als bedoeld in [artikel 3, eerste lid][ref1], kinderopvangplaatsen voor alleenstaande
      ouders aan te gaan. Daarbij kunnen burgemeester en wethouders aangeven voor meer of minder subsidie in aanmerking
      te willen komen dan bij toepassing van [artikel 4, tweede lid][ref2], voor die gemeente beschikbaar is. De aanvraag
      is ingericht volgens de bij deze regeling behorende [bijlage 2][ref3].

      3 Indien burgemeester en wethouders bij de aanvraag te kennen geven het maximum subsidiebedrag dat volgt uit de
      toepassing van [artikel 4, tweede lid][ref4], niet of niet volledig te zullen aanwenden, kan de minister voor die
      gemeente een lagere maximale subsidie verlenen, overeenkomstig het door die gemeente aangegeven bedrag.

      4 Indien de aanvraag bedoeld in het eerste lid niet uiterlijk op 1 april is ontvangen door de minister, kan de
      minister de subsidie ambtshalve op nihil vaststellen en het voorschot bedoeld in [artikel 7, eerste lid][ref5],
      terugvorderen.

      5 Indien de minister gebruik gemaakt heeft van de bevoegdheid bedoeld in het derde lid of vierde lid, kan hij
      de daardoor resterende subsidie toevoegen aan de gemeenten die meer subsidie hebben aangevraagd dan het maximale
      subsidiebedrag en voor die gemeenten een hogere maximale subsidie verlenen. [Artikel 4, tweede lid][ref6], is van
      overeenkomstige toepassing.

      6 Burgemeester en wethouders van gemeenten die zorgdragen dat de aanvraag, bedoeld in het eerste lid, tijdig is
      ontvangen door de minister, ontvangen vóór 1 juni 2001 van de minister een beschikking tot subsidieverlening waarin
      de maximale subsidie voor het jaar 2001 is opgenomen.


