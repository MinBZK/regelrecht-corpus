  - number: '9'
    text: |-
      1 Met het toezicht op de naleving van deze regeling zijn belast de ambtenaren van de directie Toezicht en van de
      Accountantsdienst van het Ministerie van Sociale Zaken en Werkgelegenheid.

      2 Burgemeester en wethouders verstrekken desgevraagd aan de minister kosteloos alle inlichtingen, die hij voor het
      toezicht en de beleidsvorming met betrekking tot deze regeling nodig heeft en verlenen inzage in de administratie
      terzake van belang zijnde bescheiden.
    url: https://wetten.overheid.nl/BWBR0012018/2001-02-09#Artikel9
  - number: '10'
    text: |-
      1 Burgemeester en wethouders dragen er zorg voor dat de administratie voor de uitvoering van deze regeling
      zodanig wordt ingericht dat, naast de in [artikel 3, eerste lid][ref1], bedoelde overeenkomsten, dan wel indien de
      alleenstaande ouder zelf met instemming van de gemeente een overeenkomst sluit een afschrift van deze overeenkomst,
      alle overige van belang zijnde vastleggingen en bewijsstukken ten behoeve van het besluitvormings-, uitvoerings-,
      controle- en verantwoordingsproces zichtbaar en controleerbaar zijn vastgelegd.

      2 Burgemeester en wethouders maken hierbij gebruik van de daarvoor door de minister verstrekte formulieren, die
      zijn ingericht overeenkomstig de in [artikel 6, tweede lid][ref2], en [artikel 8, tweede lid][ref3], bedoelde
      bijlagen en zijn voorzien van een voor iedere gemeente uniek kenmerk.


      [ref1]: https://wetten.overheid.nl/BWBR0012018#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0012018#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0012018#Artikel8
