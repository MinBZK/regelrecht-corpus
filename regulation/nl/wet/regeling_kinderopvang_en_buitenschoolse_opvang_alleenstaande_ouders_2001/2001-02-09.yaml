  - number: '8'
    text: |-
      1 Burgemeester en wethouders dragen zorg dat uiterlijk op 20 september 2002 de minister opgave van de in
      het kalenderjaar 2001 voor subsidie in aanmerking komende kosten voortvloeiend uit overeenkomsten voor
      kinderopvang, bedoeld in deze regeling, heeft ontvangen. Deze jaaropgave is, indien de opgave betrekking heeft
      op een subsidiebedrag hoger dan f 100.000,-, voorzien van een verklaring van een deskundige, belast met de in
      [artikel 213 van de Gemeentewet][ref1] voorgeschreven controle omtrent de juistheid van gegevens.

      2 De jaaropgave en de verklaring, bedoeld in het eerste lid, zijn ingericht overeenkomstig de bij deze regeling
      behorende [bijlage 3][ref2] respectievelijk [bijlage 4][ref3].

      3 De verklaring van de deskundige, bedoeld in het eerste lid, is gebaseerd op een controle die is uitgevoerd
      overeenkomstig het in [bijlage 5][ref4] bij deze regeling beschreven controle- en rapportageprotocol.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel213
