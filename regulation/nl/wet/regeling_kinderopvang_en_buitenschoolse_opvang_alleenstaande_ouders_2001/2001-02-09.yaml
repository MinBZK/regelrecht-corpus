  - number: '11'
    text: |-
      1 Met inachtneming van de [artikelen 2][ref1], [3][ref2] en [5][ref3] stelt de minister de subsidie vast binnen
      12 maanden na ontvangst van de jaaropgave, bedoeld in [artikel 8, eerste lid][ref4].

      2 Indien de jaaropgave niet is ontvangen binnen 18 maanden na het kalenderjaar waarop het betrekking heeft, dan
      wel niet is voorzien van de verklaring, bedoeld in [artikel 8, eerste lid][ref5], stelt de minister de subsidie
      ambtshalve vast.

      3 De vastgestelde subsidie kan van de verleende en betaalde subsidie afwijken indien burgemeester en wethouders
      afwijken van deze regeling.


