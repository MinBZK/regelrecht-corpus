  - number: '12'
    text: |-
      1 Burgemeester en wethouders van een gemeente die ten behoeve van een alleenstaande ouder, bedoeld in artikel 2,
      eerste lid, onderdeel b, van de Regeling kinderopvang en buitenschoolse opvang alleenstaande ouders 2000 in het
      jaar 2001 oordelen over de noodzaak van voortzetting van de bekostiging van de kinderopvang ten behoeve van die
      alleenstaande ouder, nemen daarbij in acht dat de minister in ieder geval tot één jaar na de aanvang van de arbeid
      van de alleenstaande ouder de subsidie, bedoeld in [artikel 3, eerste lid][ref1], verleent.

      2 Na het jaar, bedoeld in het eerste lid, wordt de subsidie, bedoeld in [artikel 3, eerste lid][ref2], door
      de minister slechts verleend indien burgemeester en wethouders aantonen dat het door de alleenstaande ouder
      ontvangen loon inclusief de tot het loon te rekenen vergoedingen en eventueel daarenboven te verstrekken
      toeslagen die op grond van de [artikelen 10][ref3], [10a][ref4] en [11 van de Wet op de loonbelasting 1964][ref5]
      tot het loon wordt gerekend, ten hoogste 130% van het voor hem geldende minimumloon op grond van de
      [Wet minimumloon en minimumvakantiebijslag][ref6] bedraagt.

      3 In afwijking van het tweede lid verleent de minister de subsidie, bedoeld in dat lid, nog tot maximaal 6
      maanden na afloop van de periode van een jaar, bedoeld in dat lid, indien burgemeester en wethouders beslissen
      dat het stopzetten van de bekostiging van de kinderopvang ten behoeve van de alleenstaande ouder zou leiden tot
      onbillijkheden van overwegende aard.

      4 Dit artikel is van overeenkomstige toepassing op de alleenstaande ouder, bedoeld in artikel 2, eerste
      lid, onderdeel c, van de Regeling kinderopvang en buitenschoolse opvang alleenstaande ouders 1998, voor wie
      de kinderopvang werd bekostigd op grond van genoemde regeling zoals die regeling luidde tot de datum van
      inwerkingtreding van deze regeling.


