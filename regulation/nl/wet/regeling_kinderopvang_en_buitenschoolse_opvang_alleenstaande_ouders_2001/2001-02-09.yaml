  - number: '2'
    text: |-
      1 De minister verstrekt op aanvraag aan een gemeente subsidie voor de door de gemeenten in het
      kalenderjaar 2001 te maken kosten voor kinderopvangplaatsen voortvloeiend uit overeenkomsten als bedoeld in
      [artikel 3, eerste lid][ref1], ten behoeve van alleenstaande ouders die als zodanig in dat jaar:

      a. algemene bijstand ontvangen als bedoeld in de [Algemene bijstandswet][ref2] en:

      1º. betaalde arbeid verrichten, of

      2º. ten aanzien van wie het volgen van scholing of een opleiding noodzakelijk wordt geacht voor de inschakeling in
      de arbeid, of

      3º. deelnemen aan activiteiten die bijdragen tot sociale activering.

      b. geen algemene bijstand meer ontvangen als bedoeld in de [Algemene bijstandswet][ref3] wegens het direct daarop
      aansluitend verrichten van betaalde arbeid, waaronder begrepen arbeid die met overheidsbijdragen wordt gefinancierd
      dan wel waarvoor de werkgever subsidie ontvangt op grond van de [Wet inschakeling werkzoekenden][ref4], het
      [Besluit in- en doorstroombanen][ref5] of de [Regeling schoonmaakdiensten particulieren][ref6], waarbij, met
      inachtneming van [artikel 12][ref7], naar het oordeel van burgemeester en wethouders het bekostigen van de
      kinderopvang nog steeds noodzakelijk is om die arbeid te kunnen blijven verrichten;

      c. een uitkering ontvangen als bedoeld in de [Wet inkomensvoorziening kunstenaars][ref8];

      d. de leeftijd van 18 jaar nog niet hebben bereikt, scholing of een opleiding volgen dan wel betaalde arbeid
      verrichten, en met toepassing van [artikel 11][ref9] of [13, vierde lid, van de Algemene bijstandswet][ref10]
      algemene bijstand ontvangen of kunnen ontvangen.

      2 Met algemene bijstand als bedoeld in het eerste lid, onderdelen a, b en d, wordt gelijkgesteld een uitkering op
      grond van enige sociale zekerheidswet waarvan de hoogte de bijstandsuitkering voor een alleenstaande ouder niet te
      boven gaat indien naar het oordeel van burgemeester en wethouders het ontbreken van de bekostiging van kinderopvang
      ten aanzien van de betreffende alleenstaande ouder zou leiden tot onbillijkheden van overwegende aard.

      3 Gemeenten hebben geen recht op subsidie voor de te maken kosten voor kinderopvang op basis van deze
      regeling voor alleenstaande ouders ten aanzien van wie [artikel 74 van de Werkloosheidswet][ref11] of
      [artikel 22a van de Wet op de (re)integratie arbeidsgehandicapten][ref12] van toepassing is.


