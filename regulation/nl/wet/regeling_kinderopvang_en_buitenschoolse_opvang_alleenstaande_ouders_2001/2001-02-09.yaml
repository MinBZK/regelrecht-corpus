  - number: '5'
    text: |-
      1 De subsidie voor een kinderopvangplaats in de vorm van hele-dagopvang voor vijf of meer werk- of studiedagen per
      week gedurende een geheel kalenderjaar bedraagt f 19.900,-.

      2 De subsidie voor een kinderopvangplaats in de vorm van halve-dagopvang of buitenschoolse opvang voor vijf of meer
      werk- of studiedagen per week gedurende een geheel kalenderjaar bedraagt f 13.135,-.

      3 De subsidie voor een kinderopvangplaats in de vorm van gastouderopvang gedurende een geheel kalenderjaar bedraagt
      f 7.960,-.

      4 De subsidie wordt naar evenredigheid verlaagd, indien:

      a. de kinderopvangplaats, bedoeld in het eerste of tweede lid, voor minder dan vijf werk- of studiedagen van de
      week wordt overeengekomen of slechts gedurende een gedeelte van het kalenderjaar, of

      b. de kinderopvangplaats, bedoeld in het derde lid, slechts gedurende een gedeelte van het kalenderjaar wordt
      overeengekomen.

      5 [Artikel 4, derde lid][ref1], is van overeenkomstige toepassing op de bedragen genoemd in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0012018#Artikel4
