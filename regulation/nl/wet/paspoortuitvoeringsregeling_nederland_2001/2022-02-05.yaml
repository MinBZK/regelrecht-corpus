  - number: '99'
    text: |-
      1 De aan het Rijk verschuldigde kosten worden vastgesteld aan de hand van de aanvraagbestanden die met
      gebruikmaking van het reisdocumentenstation aan de leverancier zijn verzonden.

      2 Het college van burgemeester en wethouders stelt de Minister van Binnenlandse Zaken en Koninkrijksrelaties op de
      hoogte van:

      a. het verlenen van gehele of gedeeltelijke kwijtschelding van rechten als bedoeld in
      [artikel 2, tweede lid, van het Besluit paspoortgelden][ref1], door het zenden van een afschrift van de beschikking
      waarbij de kwijtschelding is verleend;

      b. een situatie waarin een spoedlevering niet binnen de gestelde periode heeft plaatsgevonden, dan wel de met
      spoed geleverde reisdocumenten niet op de juiste wijze blijken te zijn vervaardigd, door het zenden van een daarop
      betrekking hebbende en door de leverancier geverifieerde mededeling.

      3 Het bestuurscollege stelt de Minister van Binnenlandse Zaken en Koninkrijksrelaties op de
      hoogte van het verlenen van gehele of gedeeltelijke kwijtschelding van rechten als bedoeld in in
      [artikel 2a, tweede lid, van het Besluit paspoortgelden][ref2], door het zenden van een afschrift van de
      beschikking waarbij de kwijtschelding is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0005264#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005264#Artikel2a
