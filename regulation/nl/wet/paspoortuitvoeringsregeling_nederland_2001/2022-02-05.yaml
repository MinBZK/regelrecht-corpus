  - number: 80b
    text: |-
      1 De burgemeester dan wel de gezaghebber, of de door hem daartoe aangewezen ambtenaar wijst per uitgiftelocatie ten
      hoogste drie personen aan die aanvragen in behandeling mogen nemen met behulp van het mobiel vingerafdrukopname-
      apparaat overeenkomstig de gebruikershandleiding bij het mobiel vingerafdrukopname-apparaat, bedoeld in
      [artikel 87][ref1].

      2 In afwijking van het eerste lid wijst de burgemeester van Haarlemmermeer of de door hem daartoe aangewezen
      ambtenaar ten minste drie personen aan bij de vestigingen van de Vertegenwoordiging van de Nederlandse regering bij
      de regeringen van Aruba, Curaçao en Sint Maarten die aanvragen in behandeling mogen nemen met behulp van het mobiel
      vingerafdrukopname-apparaat overeenkomstig de gebruikershandleiding bij het mobiel vingerafdrukopname-apparaat,
      bedoeld in [artikel 87][ref2].

      3 De leverancier verstrekt aan de autorisatiebevoegde aanvraagstation het wachtwoord waarmee toegang tot het mobiel
      vingerafdrukopname-apparaat kan worden verkregen en een authenticatiekaart waarmee het mobiel vingerafdrukopname-
      apparaat in het locale netwerk van de uitgiftelocatie of de vestigingen van de Vertegenwoordiging van de
      Nederlandse regering bij de regeringen van Aruba, Curaçao en Sint Maarten kan worden aangesloten.

      4 De autorisatiebevoegde aanvraagstation brengt dit wachtwoord uitsluitend ter kennis aan de aangewezen personen
      bedoeld in het eerste en tweede lid en ziet er op toe dat het wachtwoord te allen tijde gescheiden van het mobiel
      vingerafdrukopname-apparaat wordt bewaard. Alle betrokkenen nemen alle daartoe noodzakelijke maatregelen om te
      voorkomen dat het wachtwoord bekend wordt. Indien het wachtwoord is zoekgeraakt of ter kennis is gekomen van een
      onbevoegde wordt terstond contact opgenomen met de leverancier.

      5 [Artikel 80a, tweede tot en met vijfde lid][ref3], is van overeenkomstige toepassing op de verstrekte
      authenticatiekaart.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0012811#Artikel87
      [ref3]: https://wetten.overheid.nl/BWBR0012811#Artikel80a
