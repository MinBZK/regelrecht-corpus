  - number: '85'
    text: |-
      1 De reisdocumenten worden bewaard op de in [artikel 91][ref1] voorgeschreven wijze tot het tijdstip dat zij worden
      uitgereikt, dan wel:

      a. indien het een gemeente betreft, worden opgehaald door de leverancier ingevolge [artikel 46][ref2] of per
      aangetekende post worden verstuurd ingevolge [artikel 49][ref3] of [51][ref4];

      b. indien het een openbaar lichaam betreft, per aangetekende post, met gebruikmaking van het daartoe door de
      Minister van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde formulier, worden teruggestuurd aan
      de leverancier.

      2 Aan de hand van de gegevens in het reisdocumentenstation wordt nagegaan welke reisdocumenten langer dan drie
      maanden na de datum dat zij voor uitreiking beschikbaar zijn gesteld nog niet zijn uitgereikt, teneinde deze
      ingevolge [artikel 42, vierde lid, van de wet][ref5] definitief aan het verkeer te onttrekken.


