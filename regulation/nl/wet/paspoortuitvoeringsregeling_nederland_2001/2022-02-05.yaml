        artikel: 100g
        hoofdstuk: XIVa
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012811
        artikel: 100j
        hoofdstuk: XIVa
        paragraaf: '3'
  - number: 100l
    text: |-
      [Artikel 73][ref1] is van overeenkomstige toepassing op de verstrekking van gegevens uit de administratie van
      nooddocumenten.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel73
    url: https://wetten.overheid.nl/BWBR0012811/2022-02-05#Artikel100l
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '73'
        hoofdstuk: IX
  - number: 100m
    text: |-
      1 De gezaghebber of de door hem daartoe aangewezen ambtenaar wijst ten minste drie ambtenaren aan om namens hem
      bestellingen te doen van blanco noodpaspoorten en laissez-passer's bij de leverancier en tevens drie ambtenaren om
      leveringen daarvan in ontvangst te nemen.

      2 De aanmelding van de tot bestelling en van de tot ontvangst bevoegde ambtenaren, bedoeld in het eerste lid,
      alsmede wijzigingen in deze gegevens, vindt plaats bij de Minister van Binnenlandse Zaken en Koninkrijksrelaties,
      met gebruikmaking van de daartoe door de Minister van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar
      gestelde formulieren.

      3 Het ingevulde registratieformulier wordt gewaarmerkt met een afdruk van het in [artikel 88][ref1] bedoelde
      dienststempel.

      4 De Minister van Binnenlandse Zaken en Koninkrijksrelaties houdt een registratie bij van de ingevolge het eerste
      lid aangemelde personen en geeft deze gegevens door aan de leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel88
    url: https://wetten.overheid.nl/BWBR0012811/2022-02-05#Artikel100m
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '88'
        hoofdstuk: XI
        paragraaf: '4'
  - number: 100n
    text: |-
      1 De nooddocumenten worden met gebruikmaking van het daartoe door de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties beschikbaar gestelde formulier door de daartoe aangewezen ambtenaar maximaal vier maal binnen
      een jaar bij de leverancier besteld. De bestelopdracht wordt gesteld op briefpapier van het openbaar lichaam en,
      na ondertekening van de daartoe aangewezen ambtenaar, gewaarmerkt met een afdruk van het in [artikel 88][ref1]
      bedoelde dienststempel.

      2 Het aantal blanco noodpaspoorten en laissez-passer's dat binnen een jaar kan worden besteld, wordt bepaald door
      de leverancier en is gebaseerd op het jaarlijkse aantal verstrekte documenten, in de periode tussen 1 oktober en
      30 september, vermeerderd met vijf procent. De leverancier maakt jaarlijks voor 1 november het aantal te bestellen
      nooddocumenten voor het daaropvolgende jaar bekend aan de gezaghebber.

      3 Indien tussen twee bestellingen blijkt dat de voorraad noodpaspoorten dan wel laissez-passer's ontoereikend zal
      zijn, kan een opdracht voor een spoedbestelling worden geplaatst. De opdracht voor een spoedbestelling kan slechts
      worden gedaan, nadat in overleg met de leverancier is vastgesteld dat het aflevertijdstip van de eerstvolgende
      bestelopdracht niet kan worden vervroegd. De omvang van de spoedbestelling is niet groter dan noodzakelijk om de
      periode tot de levering van de eerstvolgende bestelling te overbruggen.

      4 Alvorens een bestelopdracht te plaatsen, wordt nagegaan of de in [artikel 100m][ref2] bedoelde gegevens nog juist
      zijn.

      5 Indien gegevens zijn gewijzigd, dient het nieuwe registratieformulier minstens vijf werkdagen voor het plaatsen
      van een nieuwe bestelopdracht in het bezit van de Minister van Binnenlandse Zaken en Koninkrijksrelaties te zijn.

      6 De bestelling wordt door de leverancier bevestigd door toezending van een leveringsbevestiging aan de
      gezaghebber.

      7 De daadwerkelijke aflevering vindt gemiddeld maximaal tien werkdagen na de op de leveringsbevestigingen vermelde
      dagtekening plaats door de transporteur.

      8 Bij aflevering ondertekent de tot ontvangst bevoegde persoon, bedoeld in [artikel 100m, eerste lid][ref3], de
      strook die aan de leveringsbevestiging is gehecht.

      9 De tot ontvangst bevoegde persoon legitimeert zich, op verzoek van de transporteur, met een binnen het koninkrijk
      uitgegeven reisdocument of rijbewijs.

      10 De aflevering van de zending vindt plaats in de kluisruimte. Indien aflevering in de kluisruimte niet mogelijk
      of niet doelmatig is, vindt aflevering plaats in een voor het publiek afgesloten ruimte zo dicht mogelijk bij de
      kluis.

      11 De tot ontvangst bevoegde persoon controleert in het bijzijn van de transporteur aan de hand van de
      leveringsbevestiging het aantal pakketten alsmede de verzegeling. Indien de zending niet voor de gezaghebber
      bestemd is, afwijkingen vertoont, beschadigd is dan wel documenten ontbreken, wordt hiervan aantekening gemaakt op
      de aan de leveringsbevestiging gehechte strook en de Minister van Binnenlandse Zaken en Koninkrijksrelaties hiervan
      terstond in kennis gesteld.

      12 De ingevulde en ondertekende strook wordt aan de transporteur overhandigd.

      13 Indien de persoon die de zending in ontvangst neemt zich desgevraagd niet of niet voldoende kan legitimeren
      dan wel onvoldoende zekerheid bestaat met betrekking tot zijn bevoegdheid om de zending in ontvangst te nemen, dan
      wel om enige andere reden door een handelen of nalaten van de gezaghebber een veilige aflevering niet mogelijk is,
      draagt de transporteur de zending niet over.


