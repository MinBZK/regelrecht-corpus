  - number: '101'
    text: |-
      De reisdocumenten die voor de inwerkingtreding van deze regeling zijn verstrekt, behouden de geldigheid die daarin
      is vermeld.
    url: https://wetten.overheid.nl/BWBR0012811/2022-02-05#Artikel101
  - number: '103'
    text: |-
      Voor het kalenderjaar 2017 wordt in [artikel 94, eerste lid][ref1], in plaats van ‘31 december van ieder jaar’
      gelezen ’1 oktober’ en voor ‘14 februari van het daarop volgende kalenderjaar’ vervangen door: 1 december.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel94
    url: https://wetten.overheid.nl/BWBR0012811/2022-02-05#Artikel103
