  - number: '61'
    text: |-
      1 Met het oog op vermelding daarvan in het register vermiste of vervallen reisdocumenten, wordt van mogelijke
      fraude terstond melding gedaan aan de Minister van Binnenlandse Zaken en Koninkrijksrelaties, met gebruikmaking van
      het daartoe door de Minister van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde formulier.

      2 Met het oog op vermelding daarvan in het register vermiste of vervallen reisdocumenten, wordt van een
      vermissing terstond melding gedaan aan de Minister van Binnenlandse Zaken en Koninkrijksrelaties door middel van
      verstrekking van dit gegeven uit de basisregistratie personen. Indien de melding wordt gedaan door of namens de
      gezaghebber van een openbaar lichaam of door de burgemeester, bedoeld in de [artikelen 3.2, eerste lid][ref1], en
      [4.2, eerste lid, van het besluit][ref2] en de burgemeester van Haarlemmermeer, bedoeld in artikel 3.2, tweede lid,
      en artikel 4.2, tweede lid, van het besluit, wordt dit gedaan met gebruikmaking van het daartoe door de Minister
      van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0044308#Artikel3.2
      [ref2]: https://wetten.overheid.nl/BWBR0044308#Artikel4.2
