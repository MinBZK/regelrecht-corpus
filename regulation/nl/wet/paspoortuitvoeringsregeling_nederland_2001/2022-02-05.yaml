  - number: '90'
    text: |-
      De met de uitvoering van de wet belaste autoriteiten treffen maatregelen om de onder hen berustende reisdocumenten,
      apparatuur, programmatuur, opslagmedia, documentatie en overige materialen te beveiligen tegen ontvreemding dan wel
      vernietiging ten gevolge van inbraak, diefstal, verduistering, overvallen, brand of anderszins.
    url: https://wetten.overheid.nl/BWBR0012811/2022-02-05#Artikel90
  - number: 90a
    text: |-
      De voorschriften voor de technische en organisatorische voorzieningen die noodzakelijk zijn voor de vervaardiging
      van het publiek identificatiemiddel zijn:

      a. de Baseline Informatiebeveiliging Overheid; en

      b. de Voorschriften Informatiebeveiliging Rijksdienst.
    url: https://wetten.overheid.nl/BWBR0012811/2022-02-05#Artikel90a
  - number: '91'
    text: |-
      1 Buiten de werkuren worden de van de leverancier ontvangen reisdocumenten, de ingehouden reisdocumenten, de
      opslagmedia, de documentatie en de overige materialen opgeslagen in een inbraakvertragende en brandwerende
      voorziening, zoals een gesloten inbraakwerende waardekast of kluis, met een waardebergingsindicatie van € 1.000,-.
      Deze voorziening is in een af te sluiten ruimte geplaatst.

      2 De plaatsen waar de reisdocumenten, de documentatie en de overige materialen zijn opgeslagen, alsmede de ruimte
      waarin de apparatuur en de programmatuur zich bevinden, zijn uitgerust met een inbraakalarmeringssysteem dat in
      verbinding staat met een door de rijksoverheid toegelaten alarmcentrale. Voor zover een openbaar lichaam niet
      beschikt over een inbraakalarmeringssysteem, bedoeld in de eerste zin van dit lid, dienen deze plaatsen en deze
      ruimte onder permanente fysieke (24-uurs) bewaking te staan.

      3 De apparatuur en programmatuur, alsmede de tijdens de werkuren uit te reiken of ingehouden reisdocumenten en de
      te gebruiken documentatie en overige materialen bevinden zich, onder voortdurend toezicht, op een voor onbevoegden
      onbereikbare en afsluitbare plaats.

      4 In afwijking van het eerste lid blijft de authenticatiekaart ook tijdens de werkuren opgeslagen in de
      voorziening, bedoeld in het eerste lid. De authenticatiekaart mag zich uitsluitend buiten de desbetreffende
      voorziening bevinden op het moment dat deze nodig is om het mobiel vingerafdrukopname-apparaat in het locale
      netwerk van de uitgiftelocatie aan te sluiten.

      5 In afwijking van het tweede en derde lid, staat een aanvraagstation of een mobiel vingerafdrukopname-apparaat
      gedurende de werkuren onder voortdurend toezicht van degene die bevoegd is tot het gebruik ervan en bevindt het
      zich buiten de werkuren in een voor onbevoegden onbereikbare, afsluitbare en bij voorkeur beveiligde ruimte.

      6 In afwijking van het tweede lid, geldt voor de vestigingen van de Vertegenwoordiging van de Nederlandse regering
      bij de regeringen van Aruba, Curaçao en Sint Maarten dat de plaatsen waar de Nederlandse identiteitskaarten, de
      documentatie en de overige materialen zijn opgeslagen, alsmede de ruimte waarin de apparatuur en de programmatuur
      zich bevinden, zijn uitgerust met een inbraakalarmeringssysteem dat in verbinding staat met een ter plaatse door de
      overheid toegelaten alarmcentrale, dan wel onder permanente fysieke (24-uurs) bewaking staan.
    url: https://wetten.overheid.nl/BWBR0012811/2022-02-05#Artikel91
  - number: '92'
    text: |-
      1 Van de in de reisdocumentenmodule en de in het reisdocumentenstation opgeslagen gegevens wordt dagelijks
      een reservekopie gemaakt. Voor het reisdocumentenstation wordt daartoe gebruik gemaakt van de door de Minister
      van Binnenlandse Zaken en Koninkrijksrelaties te verstrekken opslagmedia. Per reisdocumentenstation worden 5
      opslagmedia verstrekt. Na het maken van de reservekopie wordt gecontroleerd of deze is geslaagd.

      2 De bewaring van de reservekopieën geschiedt zodanig, dat de twee oudste reservekopieën op de locatie van het
      reisdocumentenarchiefstation worden bewaard, terwijl de drie meest recente reservekopieën elders worden bewaard, in
      een vergelijkbare voorziening als bedoeld in [artikel 91, eerste lid][ref1].

      3 De verstrekkende autoriteit beschikt over een op schrift gestelde procedure inzake back-up en herstel, die er in
      voorziet dat reconstructie van de gegevens mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel91
    url: https://wetten.overheid.nl/BWBR0012811/2022-02-05#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '91'
        hoofdstuk: XII
  - number: '93'
    text: |-
      1 De verstrekkende autoriteit beschikt over een op schrift gestelde beveiligingsprocedure. In deze
      beveiligingsprocedure worden in ieder geval maatregelen vastgelegd inzake:

      a. de ontvangst, het transport, de bewaring en het beheer van de van de leverancier ontvangen reisdocumenten, de
      ingehouden reisdocumenten, de apparatuur, de programmatuur, de documentatie en de overige materialen;

      b. de verantwoordelijkheden van de beveiligingsfunctionaris als bedoeld in het tiende lid;

      c. de functiescheiding tussen de bij de verstrekking, het beheer en de uitreiking van de reisdocumenten betrokken
      functionarissen;

      d. de beveiliging van het aanvraagsysteem reisdocumenten, onder meer gericht op het voorkomen van onbevoegde
      toegang of gebruik van gegevens die in het systeem of tot het systeem behorende opslagmedia zijn opgenomen.

      2 Indien het als gevolg van de omvang van het ambtelijk apparaat niet mogelijk is om te allen tijde te voldoen aan
      de in het eerste lid, onder c, gestelde eis van functiescheiding, kan daarvan met inachtneming van het derde en
      vierde lid, worden afgeweken.

      3 In de situatie, bedoeld in het tweede lid, wordt schriftelijk vastgelegd:

      a. de reden waarom tijdelijk niet aan de eis van functiescheiding kan worden voldaan;

      b. de periode waarin niet aan de eis van functiescheiding wordt voldaan;

      c. de namen van de personen die in de onder b bedoelde periode zijn belast met de verstrekking, het beheer en de
      uitreiking van de reisdocumenten.

      4 Na afloop van de periode, bedoeld in het derde lid, controleert de daartoe aangewezen persoon, die in de
      desbetreffende periode niet betrokken is geweest bij de verstrekking, het beheer en de uitreiking van de
      reisdocumenten, of de schriftelijke vastlegging, bedoeld in het derde lid, aanwezig is en de verstrekking,
      het beheer en de uitreiking op de voorgeschreven wijze hebben plaatsgevonden. In het geval er sprake is van
      onregelmatigheden wordt gehandeld overeenkomstig [artikel 95][ref1].

      5 De burgemeester of de gezaghebber draagt zorg, dat de bij de uitvoering van de [wet][ref2] betrokken personen
      regelmatig worden geïnformeerd over ontvreemdingsrisico's en ten minste één maal per jaar worden geïnstrueerd met
      betrekking tot risicobeperkende afspraken en maatregelen terzake.

      6 De beveiligingsprocedure wordt jaarlijks geëvalueerd en zo nodig aangepast.

      7 Ten behoeve van het opstellen en evalueren van de beveiligingsprocedure wordt gebruik gemaakt van de door de
      Minister van Binnenlandse Zaken en Koninkrijksrelaties daarvoor beschikbaar gestelde hulpmiddelen. Afwijkingen van
      de beveiligingsvoorschriften worden schriftelijk vastgelegd en ten minste vijf jaren naast de beveiligingsprocedure
      bewaard.

      8 De burgemeester of de gezaghebber wijst een beveiligingsfunctionaris aan die belast is met het beheer van en het
      toezicht op de naleving van de beveiligingsprocedure.

      9 Van de aanwijzing of de vervanging van de beveiligingsfunctionaris wordt terstond melding gedaan aan de Minister
      van Binnenlandse Zaken en Koninkrijksrelaties met gebruikmaking van het daartoe door de Minister van Binnenlandse
      Zaken en Koninkrijksrelaties beschikbaar gestelde formulier.

      10 De functie van beveiligingsfunctionaris is niet verenigbaar met het verrichten van andere handelingen ter
      uitvoering van de [wet][ref3].

      11 De taken en verantwoordelijkheden van de beveiligingsfunctionaris worden vastgelegd in een functieomschrijving.

      12 De burgemeester of de gezaghebber draagt er zorg voor dat de beveiligingsfunctionaris in staat wordt gesteld
      alle handelingen te verrichten die uit zijn taak voortvloeien.

      13 De beveiligingsfunctionaris is rechtstreeks verantwoording verschuldigd aan de burgemeester of de gezaghebber.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel95
      [ref2]: https://wetten.overheid.nl/BWBR0005212
      [ref3]: https://wetten.overheid.nl/BWBR0005212
