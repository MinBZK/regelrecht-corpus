  - number: 3aa
    text: |-
      Gegevens die betrekking hebben op de status van een reisdocument zijn:

      a. in aanvraag;

      b. geldig;

      c. ongeldig, met inbegrip van de reden van ongeldigheid;

      d. definitief aan het verkeer onttrokken.
    url: https://wetten.overheid.nl/BWBR0012811/2022-02-05#Artikel3aa
  - number: 3ab
    text: |-
      Gegevens die betrekking hebben op de status van het reisdocument als publiek identificatiemiddel zijn:

      a. uitgereikt;

      b. geactiveerd;

      c. geblokkeerd;

      d. ingetrokken.
    url: https://wetten.overheid.nl/BWBR0012811/2022-02-05#Artikel3ab
  - number: 3ac
    text: |-
      Degene die op grond van deze regeling gegevens verstrekt ten behoeve van de reisdocumentenadministratie, het
      register vermiste of vervallen reisdocumenten of de basisadministratie, verstrekt deze gegevens, met uitzondering
      van vingerafdrukken, gezichtsopname en handtekening, eveneens aan de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties ten behoeve van het basisregister reisdocumenten.
    url: https://wetten.overheid.nl/BWBR0012811/2022-02-05#Artikel3ac
  - number: 3ad
    text: |-
      1 Teneinde de veiligheid en betrouwbaarheid van het basisregister reisdocumenten te waarborgen, neemt de Minister
      van Binnenlandse Zaken en Koninkrijksrelaties passende maatregelen om inbreuken op en aantastingen van de
      beveiliging en de processen van het register te voorkomen. Hierbij wordt in ieder geval voldaan aan:

      a. de open normen en standaarden op de ‘pas-toe-of-leg-uit-lijst’ van het Forum Standaardisatie;

      b. de Baseline Informatiebeveiliging Overheid; en

      c. de Voorschriften Informatiebeveiliging Rijksdienst.

      2 De in het eerste lid bedoelde maatregelen worden getroffen en onderhouden op basis van daartoe na een
      risicoanalyse vastgestelde informatiebeveiligingsplannen.

      3 Teneinde maatregelen te kunnen aanpassen en doorontwikkeling mogelijk te maken, wordt voor het register of
      onderdelen daarvan onderhoud gepleegd. Hiertoe kunnen, na voorafgaande bekendmaking, het register of onderdelen
      daarvan tijdelijk buiten gebruik worden gesteld.
    url: https://wetten.overheid.nl/BWBR0012811/2022-02-05#Artikel3ad
  - number: '5'
    text: |-
      1 De tot verstrekking dan wel inhouding bevoegde autoriteiten dragen er zorg voor dat de administratie, bedoeld
      in [artikel 25, vierde en vijfde lid, van de wet][ref1], te allen tijde de naam, voornamen, geboortedatum en
      geboorteplaats bevat van de personen ten aanzien van wie zij op grond van de wet bevoegd zijn tot verstrekking dan
      wel inhouding.

      2 De in het eerste lid bedoelde administratie is op naam toegankelijk en kan desgewenst worden gevoerd door het
      bewaren en raadplegen van de regelmatig toegezonden signaleringslijst en de tussentijdse aanvullingen daarop.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel25
