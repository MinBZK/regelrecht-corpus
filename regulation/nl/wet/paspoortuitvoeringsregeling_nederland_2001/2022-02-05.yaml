        artikel: '15'
  - number: '65'
    text: |-
      1 De burgemeester of de gezaghebber deelt met het oog op een vermelding in het register paspoortsignaleringen op
      grond van [artikel 47, derde lid, van de wet][ref1] de Minister van Binnenlandse Zaken en Koninkrijksrelaties
      de gegevens mede van de houder van een reisdocument dat van rechtswege is vervallen, indien de houder weigert het
      reisdocument in te leveren dan wel de woon- of verblijfplaats van de houder niet kan worden achterhaald.

      2 De autoriteit die het in het eerste lid bedoelde reisdocument heeft ingehouden, dan wel bij wie het
      desbetreffende reisdocument is ingeleverd deelt met het oog op de verwijdering van de in het eerste lid bedoelde
      vermelding uit het register paspoortsignaleringen de Minister van Binnenlandse Zaken en Koninkrijksrelaties zulks
      terstond mede.

      3 De in het eerste en tweede lid bedoelde mededeling geschiedt met gebruikmaking van het daartoe door de Minister
      van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde formulier.

      4 Van het van rechtswege vervallen van een reisdocument ingevolge
      [artikel 47, eerste lid, onder a, b, c, e, f of h van de wet][ref2] wordt, met het oog op de vermelding daarvan in
      het register vermiste of vervallen reisdocumenten, terstond melding gedaan aan de Minister van Binnenlandse Zaken
      en Koninkrijksrelaties door verstrekking van dit gegeven uit de basisadministratie, dan wel met gebruikmaking van
      het daartoe door de Minister van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde formulier indien
      verstrekking van dit gegeven uit de basisadministratie niet mogelijk is.

      5 De in het register vermiste of vervallen reisdocumenten opgenomen gegevens worden na de datum van opname bewaard
      gedurende een periode:

      a. 11 jaar indien de geldigheidsduur van het document 5 jaar of korter is;

      b. 16 jaar indien de geldigheidsduur van het document langer dan 5 jaar is.

      6 Van het van rechtswege vervallen van een reisdocument ingevolge
      [artikel 47, eerste lid, onder i, van de wet][ref3] wordt, met het oog op de vermelding daarvan in het register
      vermiste of vervallen reisdocumenten, terstond melding gedaan aan de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties door Onze Minister die het aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel47
