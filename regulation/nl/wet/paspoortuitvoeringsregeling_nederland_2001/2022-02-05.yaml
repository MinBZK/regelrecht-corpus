  - number: '60'
    text: |-
      1 Indien een eerder uitgereikt reisdocument mogelijk voorwerp is van fraude, is vermist of op andere gronden
      dan ingevolge de [wet][ref1] door een daartoe bevoegde autoriteit is ingenomen, kan de houder dit gegeven
      overeenkomstig het tweede, derde, onderscheidenlijk vierde lid, melden aan:

      a. de burgemeester van de gemeente waarvan hij ingezetene is,

      b. een burgemeester als bedoeld in de [artikelen 3.2, eerste lid][ref2], en
      [4.2, eerste lid, van het besluit][ref3], indien de houder niet in de basisregistratie personen als ingezetene
      is ingeschreven,

      c. de gezaghebber van een openbaar lichaam; of

      d. de burgemeester van Haarlemmermeer, bedoeld in [artikel 3.2, tweede lid][ref4], en
      [artikel 4.2, tweede lid, van het besluit][ref5], indien de houder in de basisadministratie van Aruba, Curaçao of
      Sint Maarten is ingeschreven, het reisdocument een Nederlandse identiteitskaart betreft en de aanvraag is gedaan
      bij de burgemeester van Haarlemmermeer op een vestiging van de Vertegenwoordiging van de Nederlandse regering bij
      de regeringen van Aruba, Curaçao en Sint Maarten.

      2 De melding van mogelijke fraude vindt plaats door middel van een door de houder ten overstaan van de daartoe
      door de burgemeester of de gezaghebber aangewezen persoon af te leggen schriftelijke verklaring, overeenkomstig
      het daartoe door de Minister van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde formulier. Bij de
      melding van mogelijke fraude levert de houder zijn reisdocument in. Indien het reisdocument is vermist wordt een
      melding van vermissing gedaan, bedoeld in het derde lid.

      3 De melding van een vermissing vindt plaats door middel van een door de houder ten overstaan van de daartoe door
      de burgemeester of de gezaghebber aangewezen persoon af te leggen schriftelijke verklaring, overeenkomstig het
      daartoe door de Minister van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde formulier. Indien
      een proces-verbaal van de politie wordt overgelegd, wordt daarvan een kopie gemaakt die aan de schriftelijke
      verklaring omtrent de vermissing wordt toegevoegd. De melding van een vermissing aan een burgemeester kan tevens
      elektronisch geschieden, overeenkomstig het daartoe door de Minister van Binnenlandse Zaken en Koninkrijksrelaties
      beschikbaar gestelde formulier, indien de burgemeester deze weg beschikbaar heeft gesteld. In het geval van een
      elektronische melding geschiedt de vaststelling van de juistheid van de identiteit van de houder door middel van
      Digid op basis van ten minste een twee-factoren-authenticatie, dan wel een ander en minstens even betrouwbare
      authenticatiemethode.

      4 De melding van de inname van een uitgereikt reisdocument op andere gronden dan ingevolge de [wet][ref6] door een
      daartoe bevoegde autoriteit vindt plaats door middel van het overleggen van een door de desbetreffende autoriteit
      afgegeven schriftelijke verklaring omtrent de inname, aan de daartoe door de burgemeester of de gezaghebber
      aangewezen persoon. De daartoe aangewezen persoon maakt een kopie van deze verklaring.

      5 De schriftelijke verklaring omtrent mogelijke fraude, bedoeld in het tweede lid, de schriftelijke
      of elektronische verklaring omtrent de vermissing, bedoeld in het derde lid, dan wel de kopie van de
      schriftelijke verklaring die omtrent de inname is overgelegd, bedoeld in het vierde lid, wordt bewaard in de
      reisdocumentenadministratie in de gemeente of het openbaar lichaam waar de in het eerste lid bedoelde melding is
      gedaan.

      6 Mogelijke fraude, vermissing of inname op andere gronden dan ingevolge de [wet][ref7] door een daartoe bevoegde
      autoriteit van een uitgereikt reisdocument wordt terstond opgenomen in de basisadministratie waarin de houder als
      ingezetene is ingeschreven, waarbij een inname en mogelijke fraude worden opgenomen als een inhouding.


      [ref1]: https://wetten.overheid.nl/BWBR0005212
      [ref2]: https://wetten.overheid.nl/BWBR0044308#Artikel3.2
      [ref3]: https://wetten.overheid.nl/BWBR0044308#Artikel4.2
      [ref4]: https://wetten.overheid.nl/BWBR0044308#Artikel3.2
      [ref5]: https://wetten.overheid.nl/BWBR0044308#Artikel4.2
      [ref6]: https://wetten.overheid.nl/BWBR0005212
      [ref7]: https://wetten.overheid.nl/BWBR0005212
