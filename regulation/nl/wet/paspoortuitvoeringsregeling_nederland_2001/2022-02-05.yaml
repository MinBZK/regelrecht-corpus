  - number: '13'
    text: |-
      1 De Minister van Justitie en Veiligheid informeert de burgemeester of gezaghebber of er aan de voorwaarden voor
      aanspraak op een reisdocument als bedoeld in [artikel 12][ref1], [14][ref2] of [15, tweede lid, van de wet][ref3]
      is voldaan.

      2 Indien er bedenkingen bestaan tegen het verstrekken van het reisdocument als bedoeld in [artikel 12][ref4],
      [14][ref5] of [15, tweede lid, van de wet][ref6], blijkt uit de schriftelijke vaststelling daarvan:

      a. dat de aanvrager in het bezit moet zijn van een geldig reisdocument voor grensoverschrijding, verstrekt door de
      autoriteiten van een ander land;

      b. dat de verblijfsvergunning van de aanvrager niet meer zal worden verlengd;

      c. dat de verblijfsvergunning van de aanvrager is of wordt ingetrokken; of

      d. welke andere bedenkingen er zijn.


