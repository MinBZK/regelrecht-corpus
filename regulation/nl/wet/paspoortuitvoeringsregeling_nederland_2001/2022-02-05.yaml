  - number: '54'
    text: |-
      1 Uitsluitend indien op grond van [artikel 4.2, eerste lid, van het besluit][ref1] door een burgemeester als
      bedoeld in dat artikel een reisdocument wordt verstrekt en de aanvrager bij de aanvraag aannemelijk heeft gemaakt
      dat van hem redelijkerwijs niet kan worden gevergd dat hij in persoon verschijnt bij de uitreiking, wordt het
      reisdocument per aangetekende post aan hem toegezonden.

      2 De inlevering van de Nederlandse reisdocumenten, bedoeld in [artikel 32 van de wet][ref2], geschiedt in dat geval
      door deze reisdocumenten per aangetekende post toe te sturen aan de in het eerste lid bedoelde autoriteit.

      3 Tot toezending van het uit te reiken reisdocument wordt niet overgegaan dan na ontvangst van de ingevolge het
      tweede lid toegestuurde reisdocumenten.


      [ref1]: https://wetten.overheid.nl/BWBR0044308#Artikel4.2
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel32
