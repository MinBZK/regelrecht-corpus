  - number: '22'
    text: |-
      1 Ter uitvoering van [artikel 2.1, eerste lid, van het besluit][ref1] wordt voor de vaststelling van de identiteit
      geen gebruik gemaakt van de in de reisdocumentenadministratie opgenomen gegevens behorende bij een eerder aan
      betrokkene uitgereikt nooddocument.

      2 Indien de in [artikel 2.1, eerste lid, van het besluit][ref2] bedoelde gegevens berusten bij een andere
      autoriteit, dan wordt deze verzocht om kosteloze verstrekking van een afschrift van de gevraagde gegevens uit de
      reisdocumentenadministratie. In de aanvraag wordt vermeld bij welke autoriteit de gegevens zijn opgevraagd.

      3 Bij een gericht onderzoek als bedoeld in [artikel 2.1, tweede lid, van het besluit][ref3] worden tevens nadere
      identificerende vragen gesteld.

      4 De aanvrager aan wie niet eerder een Nederlands reisdocument is verstrekt, overlegt bij zijn aanvraag andere
      identiteitsdocumenten die voorzien zijn van zijn foto en handtekening. Indien hij dergelijke documenten niet kan
      overleggen, is [artikel 2.1, tweede lid, van het besluit][ref4] van overeenkomstige toepassing.

      5 In de aanvraag wordt vermeld dat de identiteit van de aanvrager is vastgesteld en met welke documenten of andere
      bewijsstukken de identiteitsvaststelling heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0044308#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0044308#Artikel2.1
