  - number: '12'
    text: |-
      1 Behoudens het bepaalde in [artikel 15a][ref1], verzamelt de burgemeester voor reisdocumenten als bedoeld
      in [artikel 14][ref2] of [15, tweede lid, van de wet][ref3] of de gezaghebber voor reisdocumenten als bedoeld
      in [artikel 12][ref4], 14 of 15, tweede lid, van de wet, gegevens voor de vaststelling van de aanspraak op
      verstrekking. De gegevens worden waar mogelijk verzameld uit de basisadministratie, alsmede aan de hand van het
      door de aanvrager overgelegde verblijfsdocument of overige bewijsstukken.

      2 De volgende gegevens worden verzameld:

      a. Met betrekking tot de nationaliteit:

      Welke nationaliteit de aanvrager bezit, dan wel dat de aanvrager van onbekende nationaliteit of staatloos is;

      b. Met betrekking tot de binnenkomst in het Europese dan wel Caribische deel van Nederland:

      1° de gemeente dan wel het openbaar lichaam waarvan de aanvrager bij binnenkomst voor het eerst ingezetene werd;

      2° de geldigheidsduur en autoriteit van verstrekking van het reisdocument waarover de aanvrager bij binnenkomst
      beschikte;

      c. Met betrekking tot het rechtmatig verblijf van de aanvrager in Nederland:

      1° de in de basisadministratie opgenomen gegevens over de verblijfstitel van de aanvrager en de datum sedert welke
      de aanvrager in de vreemdelingenadministratie is ingeschreven;

      2° het documentnummer en de geldigheidsduur van het verblijfsdocument, dan wel de reden waarom geen geldig
      verblijfsdocument ter inzage kan worden overgelegd;

      d. Met betrekking tot de redenen om aanspraak te kunnen maken op een reisdocument:

      1° de reden waarom de aanvrager geen reisdocument van een ander land kan verkrijgen, dan wel de reden waarom van de
      aanvrager niet kan worden gevergd dat hij een reisdocument van een ander land aanvraagt;

      2° indien de aanvrager van een reisdocument als bedoeld in [artikel 12][ref5] of [15, tweede lid, van de wet][ref6]
      niet in het bezit is van een verblijfsvergunning voor bepaalde tijd of voor onbepaalde tijd: met welk doel hij zich
      wenst te begeven buiten het Europese dan wel het Caribische deel van Nederland.

      3 De gezaghebber raadpleegt de Minister van Justitie en Veiligheid over de gegevens bedoeld in het tweede lid,
      onderdeel c, onderdeel 1°. De burgemeester raadpleegt de Minister van Justitie en Veiligheid over de datum sedert
      welke de aanvrager in de vreemdelingenadministratie is ingeschreven.

      4 Indien de in de basisadministratie opgenomen gegevens afwijken van de gegevens die omtrent de aanvrager in zijn
      verblijfsdocument of in de vreemdelingenadministratie zijn opgenomen dan wel anderszins onzekerheid bestaat over
      deze gegevens, wordt daarnaar een gericht onderzoek ingesteld.

      5 De burgemeester of de gezaghebber verwijst een persoon die een aanvraag voor de verstrekking van een reisdocument
      voor vreemdelingen als bedoeld in [artikel 15, tweede lid, van de wet][ref7] wil indienen naar de Minister van
      Buitenlandse Zaken, indien de betrokken persoon zich naar een land wenst te begeven waar hij met een laissez-passer
      toegang en verblijf kan verkrijgen.


