  - number: 22a
    text: |-
      1 Indien onvoldoende zekerheid bestaat over de juistheid van de door de aanvrager gedane mededeling dat hij geen
      ingezetene is, dan wel over de identiteit of de nationaliteit van de aanvrager, wordt de betrokken persoon, indien
      deze op korte termijn over een reisdocument moet beschikken, doorverwezen naar een autoriteit die bevoegd is tot de
      verstrekking van nooddocumenten.

      2 De vaststelling van de identiteit en de nationaliteit van de echtgenoot, echtgenote of geregistreerd partner
      dan wel de gewezen echtgenoot, echtgenote of geregistreerd partner van de aanvrager, respectievelijk van een
      wettelijke vertegenwoordiger die een verklaring van toestemming moet overleggen, geschiedt op de in het eerste lid
      en [artikel 2.1 van het besluit][ref1] vermelde wijze, voor zover de betrokken persoon geen ingezetene is.


      [ref1]: https://wetten.overheid.nl/BWBR0044308#Artikel2.1
