  - number: '3'
    text: |-
      1 Voor de in [artikel 2, eerste lid, onder a, d en e, van de wet][ref1] bedoelde reisdocumenten worden de volgende
      modellen vastgesteld:

      a. nationaal paspoort: model nationaal paspoort met 34 bladzijden, dan wel met 66 bladzijden (zakenpaspoort), dat
      is opgenomen in [bijlage M][ref2] bij deze regeling;

      b. reisdocument voor vluchtelingen: model reisdocument voor vluchtelingen, dat is opgenomen in [bijlage N][ref3]
      bij deze regeling;

      c. reisdocument voor vreemdelingen: model reisdocument voor vreemdelingen, dat is opgenomen in [bijlage O][ref4]
      bij deze regeling;

      2 Voor de ingevolge [artikel 2, eerste lid, onder g, van de wet][ref5] vastgestelde reisdocumenten worden de
      volgende modellen vastgesteld:

      a. faciliteitenpaspoort: model nationaal paspoort met 34 bladzijden, dan wel met 66 bladzijden (zakenpaspoort), als
      bedoeld in onderdeel a, voorzien van standaardclausule VI;

      b. tweede paspoort: model nationaal paspoort met 34 bladzijden, dan wel met 66 bladzijden (zakenpaspoort), als
      bedoeld in onderdeel a, voorzien van standaardclausule VII.

      3 Met betrekking tot de ingevolge [artikel 2, tweede lid, van de wet][ref6] bedoelde identiteitskaarten worden van
      de volgende documenten in deze regeling de navolgende modellen vastgesteld:

      a. Nederlandse identiteitskaart: model Nederlandse identiteitskaart, dat is opgenomen in [bijlage P][ref7] bij
      deze regeling;

      b. vervangende Nederlandse identiteitskaart: model vervangende Nederlandse identiteitskaart, dat is opgenomen in
      [bijlage Q][ref8] bij deze regeling.

      4 In de modellen, genoemd in het eerste, tweede en derde lid, onder a, is een machineleesbare strook en een door de
      Minister van Binnenlandse Zaken en Koninkrijksrelaties ondertekende chip opgenomen.


