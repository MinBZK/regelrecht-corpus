  - number: '23'
    text: |-
      1 In de aanvraag voor een reisdocument worden de volgende persoonsgegevens van de aanvrager vermeld:

      a. geslachtsnaam en voornamen;

      b. geboortedatum en geboorteplaats;

      c. adres en woonplaats;

      d. geslacht;

      e. nationaliteit;

      f. lengte.

      2 De in het eerste lid, onder a tot en met e, bedoelde gegevens worden geverifieerd in de basisadministratie waarin
      de aanvrager als ingezetene is ingeschreven.

      3 De geslachtsnaam omvat tevens de voorvoegsels en adellijke titels, de voornaam omvat tevens de adellijke
      predikaten. Op verzoek van de aanvrager kan de vermelding van adellijke titels en predikaten achterwege blijven.

      4 Indien alleen een naam, voornaam of een roepnaam bekend is, wordt deze als geslachtsnaam beschouwd.

      5 Indien de naam van de geboorteplaats niet kan worden ontleend aan de basisadministratie waarin de aanvrager als
      ingezetene is ingeschreven, dient de naam te worden vermeld zoals deze is opgenomen in zijn geboorteakte. In alle
      andere gevallen wordt de naam gevolgd zoals deze luidde ten tijde van de geboorte van de aanvrager, waarbij zoveel
      mogelijk de Nederlandse schrijfwijze wordt gebruikt. Indien de geboorteplaats niet kan worden vastgesteld, blijft
      de vermelding daarvan in de aanvraag achterwege. Het vermelden van het land achter de geboorteplaats is slechts
      toegestaan op verzoek van de aanvrager die aantoont daarbij een zwaarwegend belang te hebben en voorzover het
      reisdocument daartoe voldoende ruimte bevat.

      6 De geboortedatum omvat de dag, de maand en het jaar. Van vermelding van de dag, de maand en het jaar kan worden
      afgezien, voor zover deze niet bekend zijn.

      7 In de aanvraag wordt, indien de aanvrager een burgerservicenummer heeft, het burgerservicenummer vermeld en
      indien de aanvrager een administratienummer heeft, het administratienummer vermeld, waaronder de aanvrager is
      ingeschreven in de basisadministratie.
    url: https://wetten.overheid.nl/BWBR0012811/2022-02-05#Artikel23
  - number: '24'
    text: |-
      In de aanvraag voor een reisdocument, niet zijnde een Nederlandse identiteitskaart of vervangende Nederlandse
      identiteitskaart, kan op verzoek van de aanvrager die door middel van schriftelijke bewijsstukken aantoont in het
      maatschappelijk verkeer zakelijk of beroepshalve bekend te staan onder een andere naam, tevens deze andere naam
      worden vermeld ter opneming van dit gegeven in het reisdocument.
    url: https://wetten.overheid.nl/BWBR0012811/2022-02-05#Artikel24
  - number: '25'
    text: |-
      1 In de aanvraag voor een reisdocument worden tevens de geslachtsnaam van de huidige echtgenoot, echtgenote of
      geregistreerd partner, dan wel van de laatste gewezen echtgenoot, echtgenote of geregistreerd partner, alsmede de
      burgerlijke staat op het moment van de aanvraag vermeld, indien de aanvrager om opneming van deze gegevens in het
      aangevraagde reisdocument verzoekt.

      2 Indien de aanvraag betrekking heeft op de Nederlandse identiteitskaart of vervangende Nederlandse
      identiteitskaart wordt aan het in het eerste lid bedoelde verzoek slechts gevolg gegeven voorzover het reisdocument
      voldoende ruimte bevat voor vermelding van deze gegevens.
    url: https://wetten.overheid.nl/BWBR0012811/2022-02-05#Artikel25
  - number: '26'
    text: |-
      1 Van de door de aanvrager overgelegde Nederlandse reisdocumenten die op zijn naam zijn gesteld, worden het soort
      reisdocument, het documentnummer, de datum waarop de geldigheid van het document eindigt en de autoriteit die het
      document heeft verstrekt, in de aanvraag vermeld.

      2 Indien het overgelegde Nederlandse reisdocument bladzijden met een nog geldig visum of een geldige verblijfstitel
      bevat, wordt op verzoek van de aanvrager in de aanvraag vermeld, dat in het aangevraagde reisdocument
      standaardclausule XII met het documentnummer van het in te leveren reisdocument wordt opgenomen.
    url: https://wetten.overheid.nl/BWBR0012811/2022-02-05#Artikel26
  - number: '27'
    text: |-
      1 Indien zijn eerder uitgereikt reisdocument mogelijk voorwerp is van fraude, is vermist of op andere gronden dan
      ingevolge de [wet][ref1] door een daartoe bevoegde autoriteit is ingenomen, kan de aanvrager een aanvraag voor
      een reisdocument indienen, indien hij de vermissing, mogelijke fraude, onderscheidenlijke inname, overeenkomstig
      [artikel 60][ref2] meldt of heeft gemeld.

      2 In de aanvraag worden vermeld:

      a. mogelijke fraude, de vermissing, of inname op andere gronden dan ingevolge de [wet][ref3],

      b. het nummer van het desbetreffende reisdocument en de autoriteit die het heeft verstrekt, en

      c. de datum waarop de schriftelijke verklaring, bedoeld in [artikel 60, tweede lid][ref4], of de schriftelijke
      of elektronische verklaring, bedoeld in artikel 60 derde lid, is afgelegd, dan wel de schriftelijke verklaring,
      bedoeld in artikel 60, vierde lid, is overgelegd.

      3 Indien een gegeven als bedoeld in het tweede lid, onder b of c, niet voorhanden is, wordt hiernaar een gericht
      onderzoek ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005212
      [ref2]: https://wetten.overheid.nl/BWBR0012811#Artikel60
      [ref3]: https://wetten.overheid.nl/BWBR0005212
      [ref4]: https://wetten.overheid.nl/BWBR0012811#Artikel60
