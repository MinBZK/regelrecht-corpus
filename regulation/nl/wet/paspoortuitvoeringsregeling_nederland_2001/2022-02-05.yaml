    text: |-
      De definitieve onttrekking van een reisdocument, niet zijnde een nooddocument of een gevonden reisdocument, wordt
      geregistreerd in de basisadministratie waarin de houder als ingezetene is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0012811/2022-02-05#Artikel68
  - number: '71'
    text: |-
      1 Van de definitieve onttrekking aan het verkeer van een reisdocument, niet zijnde een nooddocument of een gevonden
      reisdocument en van de uitreiking van een reisdocument, geeft de burgemeester, een burgemeester als bedoeld in
      de [artikelen 3.2, eerste of tweede lid][ref1], en [4.2, eerste of tweede lid, van het besluit][ref2], of de
      gezaghebber kennis:

      a. aan de autoriteit in Aruba, Curaçao, of Sint Maarten, of de gezaghebber van het openbaar lichaam indien
      de houder van het document daar ingezetene is, of laatstelijk ingezetene was of indien het document door deze
      autoriteit is afgegeven, of

      b. aan de Minister van Binnenlandse Zaken indien het bepaalde onder a niet van toepassing is en de houder als niet-
      ingezetene is geregistreerd in de basisadministratie.

      2 In afwijking van het eerste lid geeft de burgemeester van Haarlemmermeerkennis van de definitieve onttrekking
      aan het verkeer van een Nederlandse identiteitskaart en van de uitreiking van een Nederlandse identiteitskaart
      aan de Minister van Binnenlandse Zaken en Koninkrijksrelaties, indien de houder in de basisadministratie van
      Aruba, Curaçao of Sint Maarten is ingeschreven en de aanvraag is gedaan bij de burgemeester van Haarlemmermeer op
      een vestiging van de Vertegenwoordiging van de Nederlandse regering bij de regeringen van Aruba, Curaçao en Sint
      Maarten.


      [ref1]: https://wetten.overheid.nl/BWBR0044308#Artikel3.2
      [ref2]: https://wetten.overheid.nl/BWBR0044308#Artikel4.2
