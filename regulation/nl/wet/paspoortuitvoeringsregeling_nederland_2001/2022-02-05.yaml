        artikel: '88'
        hoofdstuk: XI
        paragraaf: '4'
  - number: 100j
    text: |-
      1 Tot uitreiking van het aangevraagde nooddocument wordt slechts overgegaan, nadat de identiteit van de aanvrager
      in zijn aanwezigheid is vastgesteld en de aanvrager de in het document weergegeven persoonsgegevens op juistheid
      heeft gecontroleerd, tenzij [artikel 28, derde lid, van de wet][ref1] van toepassing is.

      2 De daartoe aangewezen ambtenaar registreert de uitreiking van het nooddocument in het reisdocumentenstation.

      3 Indien bij de uitreiking blijkt dat het nooddocument is beschadigd, onjuist is geproduceerd of gepersonaliseerd
      dan wel uit de opslag is verdwenen, wordt dit in het reisdocumentenstation geregistreerd.

      4 Indien het nooddocument niet binnen drie maanden, nadat het voor uitreiking beschikbaar is gesteld, door de
      aanvrager in ontvangst is genomen, wordt dit geregistreerd in het reisdocumentenstation.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel28
    url: https://wetten.overheid.nl/BWBR0012811/2022-02-05#Artikel100j
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '28'
  - number: 100k
    text: |-
      1 De gezaghebber voert een administratie van de door hem verstrekte nooddocumenten.

      2 De in het eerste lid bedoelde administratie wordt bijgehouden in het reisdocumentenstation, voor zover het de
      daarin overeenkomstig de [artikelen 100g][ref1] en [100j][ref2] opgenomen gegevens betreft.

      3 De overige gegevens met betrekking tot de aanvraag, verstrekking en uitreiking worden als afzonderlijke
      documenten in de administratie opgenomen op een wijze die raadpleging in samenhang met de in het tweede lid
      bedoelde gegevens mogelijk maakt.

      4 De in de administratie opgenomen gegevens worden gedurende elf jaren na de datum van verstrekking van het
      betreffende nooddocument bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel100g
      [ref2]: https://wetten.overheid.nl/BWBR0012811#Artikel100j
    url: https://wetten.overheid.nl/BWBR0012811/2022-02-05#Artikel100k
    references:
