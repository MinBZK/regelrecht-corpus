  - number: '40'
    text: |-
      1 De daartoe aangewezen ambtenaar draagt zorg dat de aanvraaggegevens, genoemd in de
      [artikelen 21 tot en met 27][ref1], [30 tot en met 37][ref2] en [39][ref3] in de reisdocumentenmodule en de foto,
      vingerafdrukken en handtekening in het aanvraagstation worden vastgelegd.

      2 Indien bij de aanvraag voor het opnemen van de vingerafdrukken gebruik is gemaakt van het mobiel
      vingerafdrukopname-apparaat worden de gegevens uitsluitend verwerkt in een aanvraagstation dat zich op
      de uitgiftelocatie bevindt. Het mobiel vingerafdrukopname-apparaat wordt in het locale netwerk van de
      uitgiftelocatie aangesloten, waarna de daarin vastgelegde vingerafdrukken door het aanvraagstation uit het mobiel
      vingerafdrukopname-apparaat worden opgehaald en samengevoegd met de ingevolge [artikel 38, derde lid][ref4],
      gedigitaliseerde foto en handtekening.

      3 De in de reisdocumentenmodule en het aanvraagstation vastgelegde gegevens worden verwerkt en doorgezonden naar
      het reisdocumentenstation.

      4 Nadat de aanvraaggegevens zijn doorgezonden aan het reisdocumentenstation wordt, indien de daartoe aangewezen
      ambtenaar, met inachtneming van het bij of krachtens de [wet][ref5] bepaalde, heeft beslist dat het aangevraagde
      reisdocument kan worden uitgereikt, in de aanvraag het feit van deze verstrekking vermeld.

      5 In de aanvraag voor een reisdocument waarbij sprake is van een beslissing tot verstrekking van een reisdocument
      waarvan de territoriale geldigheid beperkter is, wordt vermeld voor welke landen het reisdocument geldig is.

      6 Indien de aanvraaggegevens zijn doorgezonden aan het reisdocumentenstation, maar de beslissing op de aanvraag is
      aangehouden, worden de in het vierde en vijfde lid genoemde gegevens in het reisdocumentenstation vastgelegd, nadat
      de verstrekking heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0012811#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0012811#Artikel39
      [ref4]: https://wetten.overheid.nl/BWBR0012811#Artikel38
      [ref5]: https://wetten.overheid.nl/BWBR0005212
