  - number: '47'
    text: |-
      1 Indien reisdocumenten niet op het verwachte tijdstip worden ontvangen, wordt op een speciaal daarvoor bestemd
      telefoonnummer informatie ingewonnen over de te verwachten levertijd.

      2 In het geval de zending zich nog onder de distributeur bevindt, draagt deze er zorg voor dat de zending alsnog de
      volgende dag wordt afgeleverd bij de uitgiftelocatie in het Europese deel van Nederland, onderscheidenlijk bij de
      Minister van Buitenlandse Zaken, indien de zending bestemd is voor een gezaghebber.

      3 In het geval reisdocumenten op een verkeerde uitgiftelocatie in het Europese deel van Nederland zijn afgeleverd,
      draagt de leverancier er zorg voor dat de desbetreffende documenten, zo mogelijk nog dezelfde dag, op de juiste
      uitgiftelocatie in het Europese deel van Nederland worden aangeboden.

      4 Het in ontvangst nemen van reisdocumenten als bedoeld in het derde lid geschiedt overeenkomstig
      [bijlage D][ref1], met gebruikmaking van het daartoe door de distributeur beschikbaar gestelde formulier.

      5 In het geval de zending zich nog onder de transporteur bevindt, draagt deze er zorg voor dat de zending alsnog zo
      spoedig mogelijk wordt afgeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0012811
    url: https://wetten.overheid.nl/BWBR0012811/2022-02-05#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0012811
  - number: '48'
    text: |-
      Indien een reisdocument is beschadigd, onjuist is geproduceerd of gepersonaliseerd, dan wel niet op het verwachte
      tijdstip is ontvangen en niet alsnog ingevolge [artikel 47, tweede, derde of vijfde lid][ref1], zal worden bezorgd,
      wordt het op het reisdocument betrekking hebbende aanvraagbestand opnieuw verzonden aan de leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel47
    url: https://wetten.overheid.nl/BWBR0012811/2022-02-05#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '47'
        hoofdstuk: IV
  - number: '49'
    text: |-
      Reisdocumenten die:

      a. bij de controle van de zending in het reisdocumentenstation dan wel bij de uitreiking onjuist blijken te zijn
      geproduceerd of gepersonaliseerd, dan wel blijken te zijn beschadigd;

      b. na het verwachte tijdstip zijn ontvangen en waarvan inmiddels het daarop betrekking hebbende aanvraagbestand
      ingevolge [artikel 48][ref1] opnieuw is verzonden, worden per aangetekende post, met gebruikmaking van het daartoe
      door de Minister van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde formulier, teruggestuurd aan
      de leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel48
    url: https://wetten.overheid.nl/BWBR0012811/2022-02-05#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '48'
        hoofdstuk: IV
  - number: '51'
    text: |-
      1 Indien de aanvrager op het moment van de uitreiking ingezetene is van een andere gemeente, wordt het document
      uitgereikt in die gemeente.

      2 Het reisdocument wordt per aangetekende post verstuurd naar het hoofd burgerzaken van de gemeente waarvan de
      aanvrager inmiddels ingezetene is.

      3 De burgemeester van de gemeente, bedoeld in het tweede lid, gaat tot uitreiking van het reisdocument over met
      in achtneming van [artikel 4.6 van het besluit][ref1]. De op de uitreiking betrekking hebbende gegevens worden
      geregistreerd in de basisregistratie personen.

      4 Van de uitreiking van het reisdocument wordt met gebruikmaking van het daartoe door de Minister van Binnenlandse
      Zaken en Koninkrijksrelaties beschikbaar gestelde formulier kennis gegeven aan de burgemeester van de gemeente waar
      de aanvraag in behandeling is genomen.

      5 De burgemeester die een kennisgeving ontvangt als bedoeld in het vierde lid registreert de uitreiking van het
      reisdocument in het reisdocumentenstation en de reisdocumentenmodule, waarin de gegevens betreffende de aanvraag
      zijn vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0044308#Artikel4.6
    url: https://wetten.overheid.nl/BWBR0012811/2022-02-05#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0044308
        artikel: '4.6'
  - number: '52'
    text: |-
      Indien het bij de uitreiking van het aangevraagde reisdocument in te leveren reisdocument mogelijk voorwerp is
      van fraude, is vermist op andere gronden dan ingevolge de [wet][ref1] door een daartoe bevoegde autoriteit is
      ingenomen, zijn de [artikelen 60][ref2] en [61][ref3] alsnog van toepassing en worden de gegevens, bedoeld in
      [artikel 27, tweede lid][ref4], alsnog in de aanvraag met betrekking tot het uit te reiken document opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005212
