  - number: 43b
    text: |-
      1 De gepersonaliseerde Nederlandse identiteitskaarten die bestemd zijn voor personen die in de basisadministratie
      van Aruba, Curaçao of Sint Maarten zijn ingeschreven en zijn aangevraagd bij de burgemeester van
      Haarlemmermeer op een vestiging van de Vertegenwoordiging van de Nederlandse regering bij de regeringen van
      Aruba, Curaçao en Sint Maarten, worden in Nederland bij de burgemeester van Haarlemmermeer afgeleverd. De
      [artikelen 57 tot en met 60 van de Paspoortuitvoeringsregeling Buitenland 2001][ref1] zijn van overeenkomstige
      toepassing, met dien verstande dat in plaats van ‘het Ministerie van Buitenlandse Zaken’ of ‘het ministerie’ wordt
      gelezen ‘de burgemeester van Haarlemmermeer’ en in plaats van ‘de uitgiftelocatie’ of ‘de uitgiftelocatie in het
      buitenland’ wordt gelezen ‘de vestigingen van de Vertegenwoordiging van de Nederlandse regering bij de regeringen
      van Aruba, Curaçao en Sint Maarten’.

      2 De in het eerste lid bedoelde documenten worden door de transporteur afgeleverd bij de vestigingen van de
      Vertegenwoordiging van de Nederlandse regering bij de regeringen van Aruba, Curaçao en Sint Maarten.

      3 Op de vestigingen van de Vertegenwoordiging van de Nederlandse regering bij de regeringen van Aruba, Curaçao
      en Sint Maarten worden de in het eerste lid bedoelde documenten in ontvangst genomen door een daartoe aangewezen
      persoon als bedoeld in [artikel 82a, eerste lid][ref2], die zich legitimeert met een geldig identiteitsdocument.

      4 De aflevering van de zending vindt plaats op het voor de desbetreffende locatie afgesproken tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0012811#Artikel82a
    url: https://wetten.overheid.nl/BWBR0012811/2022-02-05#Artikel43b
