  - number: '7'
    text: |-
      Als gemeenten als bedoeld in de [artikelen 3.2, eerste lid][ref1], en [4.2, eerste lid, van het besluit][ref2]
      worden aangewezen Bergen op Zoom, Bergeijk, Breda, Echt-Susteren, Enschede, ’s-Gravenhage, Haarlemmermeer,
      Maastricht, Montferland, Oldambt, Sluis en Venlo.


