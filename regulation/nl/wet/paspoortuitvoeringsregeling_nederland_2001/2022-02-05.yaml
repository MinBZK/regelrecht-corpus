  - number: '67'
    text: |-
      1 Het deugdelijk vernietigen van een reisdocument dat definitief aan het verkeer wordt onttrokken, geschiedt door
      het reisdocument op gecontroleerde wijze te verbranden of te versnipperen, zodat reconstructie van het reisdocument
      niet meer mogelijk is.

      2 Op verzoek van de houder wordt diens nationaal paspoort, Nederlandse identiteitskaart, faciliteitenpaspoort,
      tweede paspoort, reisdocument voor vluchtelingen of reisdocument voor vreemdelingen, na inlevering, definitief aan
      het verkeer onttrokken door het document onbruikbaar gemaakt aan hem terug te geven.

      3 Het onbruikbaar maken geschiedt door het aanbrengen van drie ponsgaten (elk van ten minste 12 mm) door het gehele
      reisdocument op zodanige wijze dat elk in het reisdocument aangebrachte kinegram gedeeltelijk en de aangebrachte
      chip geheel onbruikbaar worden gemaakt. Voordat het reisdocument wordt teruggegeven aan de houder, wordt
      gecontroleerd of de chip onbruikbaar is.

      4 Indien het ingeleverde reisdocument bladzijden met een nog geldig visum of een geldige verblijfstitel bevat
      en in verband daarmee het verzoek is gedaan, bedoeld in [artikel 26, tweede lid][ref1], worden de desbetreffende
      bladzijden en het documentnummer intact gelaten.

      5 Een reisdocument, dat ingevolge [artikel 7.1, eerste lid, onder c, van het besluit][ref2], ten gevolge van
      misdruk of verkeerde personalisatie is ingehouden of ingeleverd, wordt deugdelijk vernietigd overeenkomstig het
      eerste lid nadat het per aangetekende post, met gebruikmaking van het daartoe door de Minister van Binnenlandse
      Zaken en Koninkrijksrelaties beschikbaar gesteld formulier, is teruggestuurd aan de leverancier.

      6 De in [artikel 7.1, eerste lid, onder d, van het besluit][ref3], en in het tweede lid
      bedoelde teruggave van een reisdocument vindt niet plaats, indien het reisdocument op grond van
      [artikel 47, eerste lid, onder a, b, c, g, h of i, van de wet][ref4] van rechtswege is vervallen, op grond van
      [54, eerste lid, onder b, c en e, van de wet][ref5] is ingehouden, dan wel [artikel 97, tweede lid][ref6], of
      [artikel 98, eerste of tweede lid][ref7], van toepassing is.


