  - number: '41'
    text: |-
      De in het aanvraagstation vastgelegde foto, handtekening en vingerafdrukken worden met de aanvraaggegevens, bedoeld
      in [artikel 40][ref1], samengevoegd tot een aanvraagbestand in het reisdocumentenstation.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel40
    url: https://wetten.overheid.nl/BWBR0012811/2022-02-05#Artikel41
