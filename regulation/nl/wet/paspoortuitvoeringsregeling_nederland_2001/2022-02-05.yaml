  - number: '87'
    text: |-
      1 De burgemeester of de gezaghebber maakt binnen het aanvraagsysteem reisdocumenten gebruik van het
      reisdocumentenstation, het aanvraagstation het mobiel vingerafdrukopname-apparaat en de overige materialen,
      overeenkomstig het bepaalde in deze regeling en met inachtneming van de bijgeleverde gebruikershandleidingen.

      2 De burgemeester of de gezaghebber draagt zorg voor de technische inrichting, de werking en de beveiliging van
      de reisdocumentenmodule en de correcte uitwisseling van de daarin opgenomen gegevens met het reisdocumentenstation
      en de basisadministratie, overeenkomstig het bepaalde in deze regeling en met inachtneming van de ter zake door de
      Minister van Binnenlandse Zaken en Koninkrijksrelaties nader gegeven voorschriften.
