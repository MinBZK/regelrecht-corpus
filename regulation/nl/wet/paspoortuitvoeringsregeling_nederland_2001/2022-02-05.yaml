  - number: '94'
    text: |-
      1 De burgemeester of de gezaghebber voert jaarlijks uiterlijk op een door de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties vast te stellen tijdstip een controle uit op de toepassing van de beveiligingsmaatregelen,
      genoemd in de [artikelen 90 tot en met 93][ref1], en de overige aspecten van het aanvraag- en uitgifteproces
      van reisdocumenten en informeert jaarlijks uiterlijk op een door de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties vast te stellen tijdstip de Minister van Binnenlandse Zaken en Koninkrijksrelaties over de
      bevindingen van de controle.

      2 Bij de controle en de verslaglegging wordt gebruik gemaakt van de daarvoor door de Minister van Binnenlandse
      Zaken en Koninkrijksrelaties beschikbaar gestelde hulpmiddelen.

      3 De minister kan in aanvulling op de in het eerste lid bedoelde controle steekproefsgewijze een nader onderzoek
      uitvoeren teneinde de bevindingen van de controle, bedoeld in het eerste lid, te verifiëren.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel90
