      - id: ref1
        bwb_id: BWBR0005212
        artikel: '28'
  - number: '31'
    text: |-
      1 De verklaring van toestemming als bedoeld in de [artikelen 34 tot en met 37 van de wet][ref1] dient schriftelijk
      te worden overgelegd.

      2 In de verklaring van toestemming worden tevens de naam en de handtekening vermeld van degene die de aanvraag ten
      behoeve van een handelingsonbekwame indient.

      3 In de aanvraag wordt melding gemaakt van de overlegging van de betreffende verklaring van toestemming.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel34
    url: https://wetten.overheid.nl/BWBR0012811/2022-02-05#Artikel31
