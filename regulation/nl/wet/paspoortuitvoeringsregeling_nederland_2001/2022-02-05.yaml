  - number: '44'
    text: |-
      1 De tot ontvangst bevoegde persoon controleert in het bijzijn van de besteller of de zending voor hem bestemd is.
      Indien dit het geval is en het pakket is onbeschadigd, vindt de overdracht plaats.

      2 Indien de zending niet voor de uitgiftelocatie bestemd is, afwijkingen vertoont, beschadigd is dan wel documenten
      ontbreken wordt gehandeld overeenkomstig bijlage D. Het in kennis stellen van de leverancier geschiedt met
      gebruikmaking van het daartoe door de Minister van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde
      formulier.

      3 Bij de constatering dat het pakket beschadigd is, wordt het pakket in het bijzijn van de besteller in een voor
      het publiek afgesloten ruimte gecontroleerd. Ook in geval van beschadiging wordt het pakket in ontvangst genomen.

      4 Indien de tot ontvangst bevoegde persoon vaststelt dat er documenten zijn beschadigd of ontbreken, wordt hiervan
      door de besteller een proces-verbaal opgemaakt.

      5 Het afschrift van het proces-verbaal wordt door de autoriteit bewaard.
    url: https://wetten.overheid.nl/BWBR0012811/2022-02-05#Artikel44
  - number: '45'
    text: |-
      1 De daartoe aangewezen persoon gaat na of de in de zending aanwezige documenten overeenkomen met de
      aanvraagnummers in het op de zending betrekking hebbende elektronische bericht in het reisdocumentenstation, dat
      door de leverancier is verzonden.

      2 In het reisdocumentenstation wordt geregistreerd of een reisdocument overeenkomstig de opgave in het elektronisch
      bericht, bedoeld in het eerste lid, is ontvangen, al dan niet is beschadigd en op de juiste wijze is geproduceerd
      en gepersonaliseerd. Deze gegevens kunnen in verband met de raadpleging daarvan tevens op elektronische wijze
      worden doorgegeven aan de reisdocumentenmodule.
    url: https://wetten.overheid.nl/BWBR0012811/2022-02-05#Artikel45
  - number: '46'
    text: |-
      1 De reisdocumenten, die na de controle van de zending als bedoeld in [artikel 44][ref1] of [45][ref2] in
      een gemeente voor een andere burgemeester blijken te zijn bestemd, worden op de uitgiftelocatie op de in
      [artikel 91][ref3] aangegeven wijze opgeslagen tot ze worden opgehaald door de distributeur.

      2 Het overdragen van de verkeerd geleverde documenten aan de distributeur geschiedt overeenkomstig
      [bijlage D][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel44
