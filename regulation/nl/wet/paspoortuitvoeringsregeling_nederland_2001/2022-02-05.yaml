  - number: '59'
    text: |-
      De burgemeester of de gezaghebber geeft de Minister van Binnenlandse Zaken en Koninkrijksrelaties met gebruikmaking
      van het daartoe door de Minister van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde formulier
      kennis van zijn beslissing, bedoeld in [artikel 45, tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel45
