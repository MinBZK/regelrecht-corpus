        bwb_id: BWBR0005212
      - id: ref2
        bwb_id: BWBR0012811
        artikel: '93'
        hoofdstuk: XII
  - number: '79'
    text: |-
      1 De burgemeester of de gezaghebber wijst per uitgiftelocatie ten minste twee personen aan die binnen het
      aanvraagsysteem reisdocumenten zullen functioneren als autorisatiebevoegde reisdocumentenstation overeenkomstig
      de gebruikershandleiding bij het reisdocumentenstation, bedoeld in [artikel 87][ref1]. Tevens wijst de
      burgemeester of de gezaghebber per aanvraagstationlocatie ten minste twee personen aan die zullen functioneren als
      autorisatiebevoegde aanvraagstation overeenkomstig de gebruikershandleiding bij het aanvraagstation, bedoeld in
      artikel 87.

      2 De burgemeester of de gezaghebber draagt er zorg voor, dat een autorisatiebevoegde in staat wordt gesteld alle
      handelingen te verrichten die uit zijn taak voortvloeien.

      3 De autorisatiebevoegden zijn rechtstreeks verantwoording verschuldigd aan de burgemeester of de gezaghebber.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel87
    url: https://wetten.overheid.nl/BWBR0012811/2022-02-05#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '87'
        hoofdstuk: XI
        paragraaf: '4'
  - number: '80'
    text: |-
      1 Per reisdocumentenstation worden ten minste 2 en ten hoogste 20 identificatiekaarten beschikbaar gesteld aan de
      autorisatiebevoegde reisdocumentenstation.

      2 De autorisatiebevoegde reisdocumentenstation is, met inachtneming van de gebruikershandleiding bij het
      reisdocumentenstation, bedoeld in [artikel 87][ref1], verantwoordelijk voor het autorisatiebeheer, de bewaring van
      de identificatiekaarten en de registratie van de personen aan wie hij in een bepaald tijdvak een kaart verstrekt.

      3 De autorisatiebevoegde reisdocumentenstation registreert in het reisdocumentenstation met inachtneming van de
      gebruikershandleiding de intrekking van identificatiekaarten indien deze na verlies, diefstal of defect verloren
      zijn gegaan of onbruikbaar zijn geworden of anderszins niet langer gebruikt mogen worden. De autorisatiebevoegde
      draagt zorg voor de vernietiging van ingetrokken identificatiekaarten voor zover deze in zijn bezit zijn en geen
      nader onderzoek daaraan hoeft plaats te vinden.

      4 De leverancier houdt een registratie bij van de uitgegeven en ingetrokken identificatiekaarten.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel87
    url: https://wetten.overheid.nl/BWBR0012811/2022-02-05#Artikel80
    references:
