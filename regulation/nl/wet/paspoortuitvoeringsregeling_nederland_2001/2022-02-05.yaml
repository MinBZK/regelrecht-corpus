        artikel: '34'
  - number: '32'
    text: |-
      1 Op de procedure voor het verkrijgen van de nodige zekerheid over de identiteit van degene die het
      gezag over de minderjarige uitoefent of van de curator zijn [artikel 22][ref1] van deze regeling en
      [artikel 2.1 van het besluit][ref2] van overeenkomstige toepassing.

      2 Indien degene die een verklaring van toestemming moet afgeven niet in persoon verschijnt, kan de aanvraag slechts
      in behandeling worden genomen indien uit de overgelegde schriftelijke verklaring van toestemming en eventuele
      andere overgelegde stukken met de nodige zekerheid kan worden afgeleid dat de verklaring van toestemming van de
      betreffende persoon afkomstig is.

      3 Voor het verkrijgen van de nodige zekerheid over de bevoegdheid tot het afgeven van de verklaring van toestemming
      van degene die het gezag over de minderjarige uitoefent of van de curator wordt gebruik gemaakt van de door de
      betreffende persoon overgelegde stukken en de omtrent het gezag of de curatele in de basisadministratie opgenomen
      gegevens.

      4 Indien onzekerheid bestaat over de bevoegdheid van degene die het gezag over de minderjarige uitoefent of van de
      curator wordt daarnaar een gericht onderzoek ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0044308#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0012811/2022-02-05#Artikel32
    references:
