        artikel: '67'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: '98'
    text: |-
      1 Indien het vermoeden bestaat dat de met het reisdocument gepleegde onregelmatigheden strafbare feiten opleveren
      en de vermoedelijke dader bekend is, wordt daarvan onder gelijktijdige overlegging van het desbetreffende
      reisdocument aangifte gedaan bij de plaatselijke politie en melding gemaakt aan het Expertisecentrum
      Identiteitsfraude en Documenten van de Koninklijke Marechaussee, met gebruikmaking van het daartoe door de Minister
      van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde formulier.

      2 Indien het vermoeden bestaat dat de met het reisdocument gepleegde onregelmatigheden strafbare feiten opleveren
      en de vermoedelijke dader niet bekend is, wordt het desbetreffende reisdocument per aangetekende post met
      gebruikmaking van het daartoe door de Minister van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde
      formulier aan het Expertisecentrum Identiteitsfraude en Documenten van de Koninklijke Marechaussee gezonden.

      3 De Commandant van het Expertisecentrum Identiteitsfraude en Documenten van de Koninklijke Marechaussee onttrekt
      het reisdocument, bedoeld in het vorige lid, definitief aan het verkeer door middel van vernietiging als bedoeld in
      [artikel 67, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel67
