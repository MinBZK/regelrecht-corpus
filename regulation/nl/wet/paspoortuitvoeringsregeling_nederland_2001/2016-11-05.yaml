  - number: '64'
    text: |-
      1 Behoudens het bepaalde in het tweede lid worden ingehouden of ingeleverde reisdocumenten, die niet
      strafrechtelijk in beslag zijn genomen, door de plaatselijke politie met een begeleidende brief per aangetekende
      post gezonden aan:

      a. de burgemeester van de gemeente of de gezaghebber van het openbaar lichaam waarvan de houder ingezetene is,
      dan wel

      b. de burgemeester of de gezaghebber ter plaatse, indien niet bekend is van welke gemeente of welk openbaar lichaam
      de houder ingezetene is, dan wel

      c. de Minister van Buitenlandse Zaken, indien het een diplomatiek paspoort, een dienstpaspoort of een op grond van
      [artikel 15, tweede lid, van de wet][ref1] verstrekt laissez-passer betreft.

      2 Indien het reisdocument op grond van een daartoe strekkende vermelding in het opsporingsregister is ingehouden,
      wordt terstond contact opgenomen met de Minister van Binnenlandse Zaken en Koninkrijksrelaties ten einde te
      vernemen aan welke autoriteit het reisdocument moet worden doorgezonden.

      3 Bij inhouding of inlevering wordt aan de betrokken persoon een ontvangstbewijs verstrekt.

      4 De in het eerste lid bedoelde begeleidende brief vermeldt de volgende gegevens:

      a. geslachtsnaam, voornamen, geboortedatum, geboorteplaats en woonplaats van de houder;

      b. het nummer van het reisdocument;

      c. de autoriteit die het reisdocument heeft verstrekt en het einde van de geldigheidsduur;

      d. de datum en de reden van inhouding of inlevering van het reisdocument.

      5 Gevonden reisdocumenten worden met een opgave van de documentnummers ingeleverd bij de in het eerste lid genoemde
      autoriteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel15
    url: https://wetten.overheid.nl/BWBR0012811/2016-11-05#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '15'
  - number: '65'
    text: |-
      1 De burgemeester of de gezaghebber deelt met het oog op een vermelding in het register paspoortsignaleringen op
      grond van [artikel 47, derde lid, van de wet][ref1] de Minister van Binnenlandse Zaken en Koninkrijksrelaties de
      gegevens mede van de houder van een reisdocument dat van rechtswege is vervallen, indien de houder weigert het
      reisdocument in te leveren dan wel de woon- of verblijfplaats van de houder niet kan worden achterhaald.

      2 De autoriteit die het in het eerste lid bedoelde reisdocument heeft ingehouden, dan wel bij wie het
      desbetreffende reisdocument is ingeleverd deelt met het oog op de verwijdering van de in het eerste lid bedoelde
      vermelding uit het register paspoortsignaleringen de Minister van Binnenlandse Zaken en Koninkrijksrelaties zulks
      terstond mede.

      3 De in het eerste en tweede lid bedoelde mededeling geschiedt met gebruikmaking van het daartoe door de Minister
      van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde formulier.

      4 Van het van rechtswege vervallen van een reisdocument ingevolge
      [artikel 47, eerste lid, onder a, b, c, e, f of h van de wet][ref2] wordt, met het oog op de vermelding
      daarvan in het basisregister reisdocumenten, terstond melding gedaan aan de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties door verstrekking van dit gegeven uit de basisadministratie, dan wel met gebruikmaking van
      het daartoe door de Minister van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde formulier indien
      verstrekking van dit gegeven uit de basisadministratie niet mogelijk is.

      5 De in het basisregister reisdocumenten opgenomen gegevens worden na de datum van opname bewaard gedurende een
      periode:

      a. 11 jaar indien de geldigheidsduur van het document 5 jaar of korter is;

      b. 16 jaar indien de geldigheidsduur van het document langer dan 5 jaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel47
    url: https://wetten.overheid.nl/BWBR0012811/2016-11-05#Artikel65
