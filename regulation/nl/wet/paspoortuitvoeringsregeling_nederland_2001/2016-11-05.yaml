  - number: '78'
    text: |-
      1 De burgemeester dan wel de gezaghebber, of de door hem daartoe aangewezen ambtenaar wijst de personen aan die
      bevoegd zijn tot het verrichten van de handelingen die bij of krachtens de [wet][ref1] zijn voorgeschreven.

      2 De in het eerste lid bedoelde aanwijzing van personen, alsmede de registratie van hun bevoegdheden geschiedt
      met inachtneming van de functionele beschrijvingen met betrekking tot het aanvraagsysteem reisdocumenten en
      overeenkomstig de beveiligingsprocedure, bedoeld in [artikel 93][ref2].

      3 De gezaghebber draagt er zorg voor dat de handelingen, bedoeld in het eerste lid, die plaatsvinden in een niet
      tot de organisatie van het openbaar lichaam behorende uitgiftelocatie, uitsluitend worden verricht door bezoldigde
      ambtenaren van het openbaar lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0005212
      [ref2]: https://wetten.overheid.nl/BWBR0012811#Artikel93
