        hoofdstuk: XI
        paragraaf: '1'
  - number: '81'
    text: |-
      1 De burgemeester of de door hem daartoe aangewezen ambtenaar wijst per uitgiftelocatie ten minste drie personen
      aan om zendingen van reisdocumenten en foto- en handtekeningformulieren in ontvangst te nemen. Identificatiekaarten
      en daarop betrekking hebbende codes worden uitsluitend in ontvangst genomen door een autorisatiebevoegde
      reisdocumentenstation.

      2 De aanmelding, registratie en vervanging van de tot ontvangst bevoegde personen, bedoeld in de eerste zin van
      het eerste lid, vindt plaats bij de distributeur, met gebruikmaking van de door de burgemeester daartoe beschikbaar
      gestelde machtiging tot ontvangstneming.

      3 De machtiging tot ontvangstneming wordt gewaarmerkt met een afdruk van een dienststempel als bedoeld in
      [artikel 88][ref1] en de handtekening van de burgemeester of de door hem daartoe aangewezen persoon.

      4 De gemeente bewaart een kopie van het in het derde lid genoemde formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel88
    url: https://wetten.overheid.nl/BWBR0012811/2016-11-05#Artikel81
