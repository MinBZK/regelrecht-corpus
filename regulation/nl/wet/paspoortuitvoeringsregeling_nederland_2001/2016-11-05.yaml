  text: |-
    Gelet op de artikelen 2, eerste lid, onder g, tweede en derde lid, 3, eerste, derde, vierde en zevende lid, 16,
    tweede lid, 26, eerste lid, onder d en derde lid, 27, eerste lid, 30, eerste lid, 31, derde lid, 40, eerste lid,
    onder d en zesde lid, 43, 57 en 59 van de Paspoortwet en artikel 3 van het Besluit paspoortgelden;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0012811/2016-11-05#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

      a. *de wet:* de [Paspoortwet][ref1];

      b. *aanvraag, weigering, verstrekking, uitreiking, houder, wijziging, inhouding, vervallen of vervallenverklaring
      en vermissing:* hetgeen ingevolge [artikel 1, eerste lid, van de wet][ref2] daaronder wordt verstaan;

      c. *aanvrager:* degene die een aanvraag als bedoeld in [artikel 1, onder a, van de wet][ref3] indient of op wie een
      dergelijke aanvraag betrekking heeft;

      d. *register paspoortsignaleringen:* het register, bedoeld in [artikel 25, derde lid, van de wet][ref4];

      e. *signalerende autoriteit:* de autoriteit, bedoeld in de [artikelen 18 tot en met 24 van de wet][ref5], die op
      grond van [artikel 25 van de wet][ref6] een verzoek tot weigering of vervallenverklaring heeft ingediend;

      f. *basisadministratie:* de basisregistratie personen, dan wel een basisadministratie als bedoeld in
      [artikel 2 van de Wet basisadministraties persoonsgegevens BES][ref7];

      g. *basisregister reisdocumenten:* het register, bedoeld in [artikel 4a van de wet][ref8];

      h. *aanvraagsysteem reisdocumenten:* het geheel van apparatuur, programmatuur, opslagmedia en overige materialen,
      waarvan door de bevoegde autoriteit gebruik wordt gemaakt bij de aanvraag, verstrekking, uitreiking en registratie
      van reisdocumenten;

      i. *reisdocumentenstation:* de door de leverancier beschikbaar gestelde apparatuur en programmatuur, waarin
      gegevens met betrekking tot aangevraagde en uitgereikte reisdocumenten worden verwerkt en gearchiveerd en waarmee
      de gegevensuitwisseling tussen de bevoegde autoriteit en de leverancier plaatsvindt (reisdocumentenaanvraag- en
      archiefstation);

      j. *reisdocumentenadministratie:* de in het reisdocumentenstation en op andere wijze bij de bevoegde autoriteit
      opgeslagen gegevens met betrekking tot aangevraagde en uitgereikte reisdocumenten;

      k. *reisdocumentenmodule:* de apparatuur en programmatuur, waarmee de bevoegde autoriteit bij de aanvraag en
      uitreiking gegevens uitwisselt met het reisdocumentenstation en de basisadministratie;

      l. *standaardclausule:* een clausule, waarvan de tekst in [bijlage A van deze regeling][ref9] is opgenomen en die
      door de leverancier dan wel de bevoegde autoriteit in het reisdocument wordt aangebracht;

      m. *openbaar lichaam:* openbaar lichaam Bonaire, Sint Eustatius of Saba;

      n. *aanvraagnummer:* het nummer dat voorgedrukt is op het foto- en handtekeningformulier;

      o. *administratienummer:* het administratienummer, bedoeld in
      [artikel 4.9 van de Wet basisregistratie personen][ref10], dan wel in de [artikelen 10][ref11] en
      [11 van de Wet basisadministraties persoonsgegevens BES][ref12];

      p. *burgerservicenummer :* het nummer, bedoeld in
      [artikel 1, onder b, van de Wet algemene bepalingen burgerservicenummer][ref13];

      q. *spoedopdracht:* de opdracht aan de leverancier om versneld over te gaan tot vervaardiging en levering van een
      reisdocument;

      r. ;

      s. *identificatiekaart:* een document als bedoeld in [artikel 80][ref14], waarmee op elektronische wijze toegang
      kan worden verkregen tot het reisdocumentenstation en de daarin opgeslagen programmatuur en gegevens;

      t. *leverancier:* een bedrijf dat in opdracht van de Minister van Binnenlandse Zaken en Koninkrijksrelaties belast
      is met het verrichten van een of meerdere diensten die verband houden met de verstrekking van reisdocumenten;

      u. *distributeur:* het bedrijf dat zorg draagt voor de distributie van reisdocumenten, identificatiekaarten en
      overige materialen die door de leverancier worden geleverd;

      v. *bestelkantoor:* het plaatselijke kantoor van de distributeur;

      w. *besteller:* een werknemer in dienst bij de distributeur, die belast is met de feitelijke aflevering van de
      documenten en overige materialen;

      x. *uitgiftelocatie:* de locatie bij een bevoegde autoriteit waar de aanvragen aan de leverancier worden verzonden
      en de documenten en overige materialen door de distributeur worden afgeleverd;

      y. *transporteur:* het bedrijf dat, in voorkomende gevallen met inschakeling van tussenpersonen, zorg draagt
      voor de distributie van reisdocumenten, identificatiekaarten en overige materialen tussen het ministerie van
      Buitenlandse Zaken en de bevoegde autoriteiten in de openbare lichamen;

      z. *verblijfsdocument:* een document waaruit het verblijfsrecht van de vreemdeling ingevolge de
      [Vreemdelingenwet 2000][ref15] of de [Wet toelating en uitzetting BES][ref16] blijkt;

      aa. *aanvraagstation:* de door de minister van Binnenlandse Zaken en Koninkrijksrelaties aangewezen apparatuur en
      programmatuur voor het ondersteunen van het aanvraag- en uitgifteproces van reisdocumenten;

      bb. *foto- en handtekeningenformulier:* het daartoe door de leverancier beschikbaar gestelde formulier dat bestemd
      is voor het opnemen van de foto en de handtekening, bedoeld in [artikel 38, eerste en tweede lid][ref17];

      cc. *aanvraagstationlocatie:*de locatie waar de bevoegde autoriteit met inachtneming van [artikel 91][ref18] één of
      meerdere aanvraagstations heeft geplaatst;

      dd. *mobiel vingerafdrukopname-apparaat:* de door de Minister van Binnenlandse Zaken en Koninkrijksrelaties
      aangewezen mobiele apparatuur en bijbehorende programmatuur voor het opnemen van vingerafdrukken;

      ee. *ingezetene:*een ingezetene als bedoeld in
      [artikel 1.1, onderdeel f, van de Wet basisregistratie personen][ref19], dan wel
      [artikel 1, onderdeel h, van de Wet basisadministraties persoonsgegevens BES][ref20].

      2 Deze regeling is van toepassing op de verstrekking van reisdocumenten door de burgemeesters en de gezaghebbers.


