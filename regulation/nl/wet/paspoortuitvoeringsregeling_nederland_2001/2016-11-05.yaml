  - number: '28'
    text: |-
      1 Bij het indienen van een aanvraag voor een reisdocument wordt een pasfoto overgelegd die een goedgelijkend beeld
      van de aanvrager geeft.

      2 De overgelegde pasfoto voldoet aan de acceptatiecriteria van de in [bijlage L][ref1] bij deze regeling opgenomen
      fotomatrix.

      3 In afwijking van het tweede lid kan een pasfoto worden geaccepteerd indien de aanvrager heeft aangetoond dat
      godsdienstige of levensbeschouwelijke redenen zich verzetten tegen het niet bedekken van het hoofd.

      4 In afwijking van het tweede lid kan een pasfoto worden geaccepteerd indien op grond van objectief vast te
      stellen fysieke of medische redenen, door de aanvrager niet kan worden voldaan aan alle in de fotomatrix opgenomen
      acceptatiecriteria. Bij gerede twijfel aan de medische redenen kan van de aanvrager worden verlangd, dat deze
      daartoe een door een bevoegde arts of medische instelling ondertekende verklaring overlegt.

      5 In afwijking van het tweede lid kan een pasfoto van een aanvrager die de leeftijd van zes jaar nog niet heeft
      bereikt worden geaccepteerd, indien de foto voldoet aan de in de fotomatrix voor die leeftijdscategorie opgenomen
      minimum vereisten.


      [ref1]: https://wetten.overheid.nl/BWBR0012811
    url: https://wetten.overheid.nl/BWBR0012811/2016-11-05#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0012811
  - number: 28a
    text: |-
      1 Bij het indienen van een aanvraag voor een reisdocument worden de afdrukken van twee vingers van de aanvrager
      opgenomen. Bij de aanvraag van een Nederlandse identiteitskaart worden geen vingerafdrukken opgenomen.

      2 Bij een aanvrager als bedoeld in de eerste zin van het eerste lid worden platte afdrukken van de linker- en
      rechter wijsvinger opgenomen voor opslag in het reisdocument. Indien de kwaliteit van de vingerafdrukken van de
      wijsvingers onvoldoende is, worden platte afdrukken van de middelvingers, ringvingers of duimen opgenomen.

      3 Indien van slechts één vinger de afdruk van voldoende kwaliteit kan worden opgenomen, wordt uitsluitend de afdruk
      van die vinger opgenomen.

      4 In afwijking van het eerste lid wordt van het opnemen van vingerafdrukken afgezien indien de aanvrager op het
      moment van het indienen van de aanvraag de leeftijd van twaalf jaar nog niet heeft bereikt.

      5 Indien de daartoe aangewezen persoon van oordeel is dat het fysiek dan wel als gevolg van een tijdelijke
      verhindering onmogelijk is om van de aanvrager te verlangen dat bij hem op het moment van het indienen van de
      aanvraag twee vingerafdrukken worden opgenomen, wordt in ieder geval de afdruk opgenomen van de vinger waarbij dit
      volgens de daartoe aangewezen persoon wel mogelijk is. Bij gerede twijfel of het fysiek dan wel als gevolg van een
      tijdelijke verhindering onmogelijk is om twee vingerafdrukken op te nemen, kan van de aanvrager worden verlangd,
      dat deze daartoe een door een bevoegde arts of medische instelling ondertekende verklaring overlegt.

      6 Indien van de aanvrager geen vingerafdrukken worden opgenomen, wordt in de aanvraag de reden voor het niet
      opnemen vermeld.
    url: https://wetten.overheid.nl/BWBR0012811/2016-11-05#Artikel28a
  - number: '29'
    text: |-
      Indien de persoon aan wie het aangevraagde reisdocument moet worden verstrekt door leeftijd of een handicap niet in
      staat is zijn handtekening te plaatsen, wordt daarvan in de aanvraag melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0012811/2016-11-05#Artikel29
  - number: '30'
    text: |-
      Indien de aanvrager ingevolge [artikel 28, derde lid, van de wet][ref1] niet persoonlijk bij het indienen van de
      aanvraag is verschenen, wordt dit gegeven met de reden daarvan in de aanvraag vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel28
    url: https://wetten.overheid.nl/BWBR0012811/2016-11-05#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '28'
  - number: '31'
    text: |-
      1 De verklaring van toestemming als bedoeld in de [artikelen 34 tot en met 37 van de wet][ref1] dient schriftelijk
      te worden overgelegd.

      2 In de verklaring van toestemming worden tevens de naam en de handtekening vermeld van degene die de aanvraag ten
      behoeve van een handelingsonbekwame indient.

      3 In de aanvraag wordt melding gemaakt van de overlegging van de betreffende verklaring van toestemming.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel34
    url: https://wetten.overheid.nl/BWBR0012811/2016-11-05#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '34'
  - number: '32'
    text: |-
      1 Op de procedure voor het verkrijgen van de nodige zekerheid over de identiteit van degene die het gezag over de
      minderjarige uitoefent of van de curator is artikel 22 van overeenkomstige toepassing.

      2 Indien degene die een verklaring van toestemming moet afgeven niet in persoon verschijnt, kan de aanvraag slechts
      in behandeling worden genomen indien uit de overgelegde schriftelijke verklaring van toestemming en eventuele
      andere overgelegde stukken met de nodige zekerheid kan worden afgeleid dat de verklaring van toestemming van de
      betreffende persoon afkomstig is.

      3 Voor het verkrijgen van de nodige zekerheid over de bevoegdheid tot het afgeven van de verklaring van toestemming
      van degene die het gezag over de minderjarige uitoefent of van de curator wordt gebruik gemaakt van de door de
      betreffende persoon overgelegde stukken en de omtrent het gezag of de curatele in de basisadministratie opgenomen
      gegevens.

      4 Indien onzekerheid bestaat over de bevoegdheid van degene die het gezag over de minderjarige uitoefent of van de
      curator wordt daarnaar een gericht onderzoek ingesteld.
    url: https://wetten.overheid.nl/BWBR0012811/2016-11-05#Artikel32
  - number: '37'
    text: |-
      1 De aanvrager kan de burgemeester verzoeken om een versnelde uitreiking van het aangevraagde reisdocument.

      2 Indien de aanvrager verzoekt om de versnelde uitreiking van het aangevraagde reisdocument, wordt in de aanvraag
      voor het reisdocument een vermelding opgenomen waaruit blijkt dat het een spoedopdracht betreft.

      3 In het geval van een spoedopdracht draagt de burgemeester er zorg voor dat de aanvraag nog dezelfde dag vóór
      16.00 uur de leverancier bereikt, opdat het uit te reiken reisdocument de daarop volgende werkdag op het reguliere
      tijdstip, doch uiterlijk 16.00 uur, op de uitgiftelocatie kan worden afgeleverd.
    url: https://wetten.overheid.nl/BWBR0012811/2016-11-05#Artikel37
  - number: '38'
    text: |-
      1 De daartoe aangewezen persoon vergelijkt, behoudens in het in [artikel 30][ref1] bedoelde geval, nauwkeurig de
      overgelegde foto van de aanvrager dan wel van degene ten behoeve van wie de aanvraag wordt ingediend met de persoon
      die voor hem staat en brengt deze foto op de bestemde plaats in het foto- en handtekeningformulier aan.

      2 De in het eerste lid bedoelde persoon ziet, behoudens in het in [artikel 29][ref2] bedoelde geval, er op toe dat
      in het foto- en handtekeningformulier op de bestemde plaats de duidelijk leesbare handtekening wordt geplaatst van
      de aanvrager dan wel van de persoon ten behoeve van wie de aanvraag van het reisdocument wordt gedaan.

      3 Het foto- en handtekeningformulier wordt door de in het eerste lid bedoelde persoon met gebruikmaking van het
      aanvraagstation gedigitaliseerd.

      4 Het opnemen van de vingerafdrukken als bedoeld in [artikel 28a][ref3], geschiedt met gebruikmaking van het
      aanvraagstation.

      5 Indien de aanvrager omwille van bijzondere omstandigheden als genoemd in
      [artikel 28, derde lid, van de wet][ref4] niet in persoon verschijnt op de uitgiftelocatie worden zijn
      vingerafdrukken opgenomen met behulp van het mobiel vingerafdrukopname-apparaat.

      6 Indien de aanvrager zijn aanvraag niet indient op de uitgiftelocatie, kunnen zijn vingerafdrukken worden
      opgenomen met behulp van het mobiel vingerafdrukopname-apparaat.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0012811#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0012811#Artikel28a
      [ref4]: https://wetten.overheid.nl/BWBR0005212#Artikel28
