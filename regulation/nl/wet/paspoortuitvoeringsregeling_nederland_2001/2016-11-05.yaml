  - number: '42'
    text: |-
      De daartoe aangewezen persoon zendt, nadat is vastgesteld dat het aangevraagde reisdocument kan worden uitgereikt,
      het aanvraagbestand met gebruikmaking van het reisdocumentenstation naar de leverancier van de reisdocumenten. Het
      te verzenden aanvraagbestand wordt met gebruikmaking van de aan hem toegekende identificatiekaart voorzien van een
      digitale handtekening.
    url: https://wetten.overheid.nl/BWBR0012811/2016-11-05#Artikel42
  - number: '43'
    text: |-
      1 De reisdocumenten en identificatiekaarten worden in ontvangst genomen door een daartoe aangewezen persoon als
      bedoeld in [artikel 81, eerste lid][ref1].

      2 De in het eerste lid genoemde persoon toont de in [artikel 81, tweede lid][ref2], bedoelde machtiging tot
      ontvangstneming van de burgemeester en legitimeert zich, op verzoek van de besteller, met een identiteitsdocument
      als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref3].

      3 De aflevering van de zending vindt plaats op het voor de desbetreffende uitgiftelocatie afgesproken tijdstip. Bij
      aflevering kan de besteller worden verplicht zich te identificeren met een door de distributeur aan haar werknemers
      beschikbaar gestelde legitimatie.

      4 Indien de persoon die de zending in ontvangst neemt zich desgevraagd niet of niet voldoende kan legitimeren dan
      wel onvoldoende zekerheid bestaat met betrekking tot zijn bevoegdheid om de zending in ontvangst te nemen, dan
      wel om enige andere reden door een handelen of nalaten van de bevoegde autoriteit een veilige aflevering op de
      uitgiftelocatie niet mogelijk is, draagt de besteller de zending niet over.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0012811#Artikel81
      [ref3]: https://wetten.overheid.nl/BWBR0006297#Artikel1
