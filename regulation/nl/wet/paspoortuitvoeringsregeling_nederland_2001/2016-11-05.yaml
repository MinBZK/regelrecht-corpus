  - number: '68'
    text: |-
      De definitieve onttrekking van een reisdocument, niet zijnde een nooddocument of een gevonden reisdocument, wordt
      geregistreerd in de basisadministratie waarin de houder als ingezetene is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0012811/2016-11-05#Artikel68
  - number: '71'
    text: |-
      Van de definitieve onttrekking aan het verkeer van een reisdocument, niet zijnde een nooddocument of een gevonden
      reisdocument, alsmede van de uitreiking van een vervangend reisdocument, wordt met gebruikmaking van het daartoe
      door de Minister van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde formulier kennis gegeven aan:

      a. de Minister van Buitenlandse Zaken indien het reisdocument is verstrekt in het buitenland, dan wel

      b. een burgemeester als bedoeld in [artikel 7][ref1], indien deze autoriteit het reisdocument heeft verstrekt aan
      een houder die ten tijde van de verstrekking geen ingezetene was, dan wel

      c. de autoriteit in Aruba, Curaçao of Sint Maarten, die het reisdocument heeft verstrekt, dan wel

      d. de burgemeester van de gemeente of de gezaghebber van het openbaar lichaam waarvan de houder ingezetene is, of
      laatstelijk ingezetene was, indien het reisdocument niet in het buitenland of door de in onderdeel b of c genoemde
      autoriteit is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel7
    url: https://wetten.overheid.nl/BWBR0012811/2016-11-05#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '7'
        hoofdstuk: I
        paragraaf: '5'
  - number: '72'
    text: |-
      1 Van elk verstrekt reisdocument wordt een administratie bijgehouden.

      2 De in het eerste lid bedoelde reisdocumentenadministratie wordt bijgehouden in het reisdocumentenstation, voor
      zover het de daarin overeenkomstig de [artikelen 40][ref1] en [55][ref2] opgenomen gegevens betreft.

      3 De overige gegevens met betrekking tot de aanvraag, verstrekking en uitreiking worden als afzonderlijke
      documenten in de reisdocumentenadministratie opgenomen op een wijze die raadpleging in samenhang met de in het
      tweede lid bedoelde gegevens mogelijk maakt.

      4 De in de reisdocumentenadministratie opgenomen gegevens, met uitzondering van de gegevens, bedoeld in
      [artikel 3, negende lid, van de wet][ref3] worden na de datum van verstrekking bewaard gedurende een periode van:

      a. 11 jaar indien de geldigheidsduur van het verstrekte document 5 jaar of korter is of indien het verstrekte
      document niet wordt uitgereikt;

      b. 16 jaar indien de geldigheidsduur van het verstrekte document langer dan 5 jaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel40
