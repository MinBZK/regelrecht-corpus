  - number: '96'
    text: |-
      Onverminderd de eigen verantwoordelijkheid van de houder van een reisdocument ingevolge de [wet][ref1], draagt
      de burgemeester of de gezaghebber er bij wijze van faciliteit zorg voor dat de persoon die ingezetene van zijn
      gemeente of openbaar lichaam is, en houder is van een reisdocument, waarvan de geldigheidsduur binnenkort zal
      verlopen, schriftelijk wordt gewezen op het verstrijken van de geldigheidstermijn, de verplichting het reisdocument
      in te leveren en de mogelijkheid om een nieuw reisdocument aan te vragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005212
