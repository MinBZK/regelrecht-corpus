  - number: '100'
    text: |-
      Ten behoeve van de controle op de juistheid en volledigheid van de bedragen die terzake van de verschuldigde
      kosten als bedoeld in [artikel 7, eerste lid, onder a, van de wet][ref1] aan het Rijk zijn afgedragen, is het
      college van burgemeester en wethouders of het bestuurscollege verplicht desgevraagd aan de door de Minister
      van Binnenlandse Zaken en Koninkrijksrelaties krachtens [artikel 66 van de Comptabiliteitswet 2001][ref2]
      daartoe aangewezen ambtenaren de voor deze controle benodigde informatie te verschaffen. Deze ambtenaren
      kunnen tevens informatie inwinnen bij de in [artikel 213, tweede lid, van de Gemeentewet][ref3] en
      [artikel 38, derde lid, van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref4] bedoelde
      registeraccountants.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel7
