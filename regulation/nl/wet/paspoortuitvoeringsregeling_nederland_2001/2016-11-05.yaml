  - number: 100g
    text: |-
      1 De daartoe aangewezen ambtenaar draagt zorg dat de aanvraaggegevens in het reisdocumentenstation en de foto en
      handtekening in het aanvraagstation worden vastgelegd.

      2 De in het aanvraagstation vastgelegde gegevens worden verwerkt en doorgezonden naar het reisdocumentenstation.

      3 Indien de beslissing op de aanvraag ingevolge [artikel 100e, tweede of derde lid][ref1], is aangehouden, worden
      de in de [artikel 100f][ref2] genoemde gegevens in het reisdocumentenstation vastgelegd, nadat de verstrekking
      heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel100e
      [ref2]: https://wetten.overheid.nl/BWBR0012811#Artikel100f
