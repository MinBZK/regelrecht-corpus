  - number: '16'
    text: |-
      1 Een reisdocument voor vluchtelingen, verstrekt aan een persoon die beschikt over een verblijfsvergunning voor
      onbepaalde tijd als bedoeld in [artikel 33 van de Vreemdelingenwet 2000][ref1], is geldig voor vijf jaren en voor
      alle landen, met uitzondering van het land waarvan de houder de nationaliteit bezit.

      2 Een reisdocument voor vluchtelingen, verstrekt aan een persoon die beschikt over een verblijfsvergunning
      voor bepaalde tijd als bedoeld in [artikel 28 van de Vreemdelingenwet 2000][ref2], dan wel als bedoeld in
      [artikel 12a van de Wet toelating en uitzetting BES][ref3], is geldig:

      a. tot de datum waarop de geldigheidsduur van de verblijfsvergunning eindigt, met een minimale geldigheidsduur van
      een jaar en een maximale geldigheidsduur van drie jaren, en

      b. voor alle landen, met uitzondering van het land waarvan de houder de nationaliteit bezit.

      3 Een reisdocument voor vreemdelingen, verstrekt aan een persoon die beschikt over een verblijfsvergunning
      voor onbepaalde tijd als bedoeld in [artikel 20 van de Vreemdelingenwet 2000][ref4], dan wel als bedoeld in de
      [Wet toelating en uitzetting BES][ref5], is geldig voor vijf jaren en voor alle landen, met uitzondering van het
      land waarvan de houder de nationaliteit bezit.

      4 Een reisdocument voor vreemdelingen, verstrekt aan een persoon die beschikt over een verblijfsvergunning
      voor bepaalde tijd als bedoeld in [artikel 14 van de Vreemdelingenwet 2000][ref6], dan wel als bedoeld in de
      [Wet toelating en uitzetting BES][ref7], is geldig:

      a. tot de datum waarop de geldigheidsduur van de verblijfsvergunning eindigt, met een maximale geldigheidsduur van
      vijf jaren, en

      b. voor alle landen, met uitzondering van het land waarvan de houder de nationaliteit bezit.

      5 Een reisdocument voor vreemdelingen, verstrekt aan een persoon die op grond van de
      [Wet betreffende de positie van Molukkers][ref8] als Nederlander wordt behandeld, is geldig voor vijf jaren en voor
      alle landen.

      6 Op een reisdocument voor vreemdelingen, verstrekt op grond van [artikel 15a][ref9], is het bepaalde in het derde
      en vierde lid van overeenkomstige toepassing, met dien verstande dat het reisdocument ten hoogste geldig is tot de
      datum waarop de houder de leeftijd van zestien jaren bereikt.

      7 Een reisdocument voor vreemdelingen als bedoeld in [artikel 15, tweede lid, van de wet][ref10], is geldig:

      a. voor het land van bestemming en de landen waarvan de houder op zijn doorreis de grens passeert, met uitzondering
      van het land waarvan de houder de nationaliteit bezit;

      b. voor de duur van de reis, waarbij rekening wordt gehouden met de door het land van bestemming en de landen van
      doorreis vereiste minimale geldigheid van het reisdocument na binnenkomst, dan wel na vertrek van de houder, met
      een maximum van een jaar.

      8 Indien als gevolg van een tijdelijke verhindering bij de aanvrager geen vingerafdrukken in het document
      worden opgenomen, bedraagt in afwijking van het eerste, tweede, derde en vijfde lid, de geldigheidsduur van het
      betreffende reisdocument één jaar en bedraagt in afwijking van het vierde, zesde en zevende lid, de geldigheidsduur
      van het betreffende reisdocument maximaal één jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel33
