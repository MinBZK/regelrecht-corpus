  - number: '47'
    text: |-
      1 Indien reisdocumenten niet op het verwachte tijdstip worden ontvangen, wordt op een speciaal daarvoor bestemd
      telefoonnummer informatie ingewonnen over de te verwachten levertijd.

      2 In het geval de zending zich nog onder de distributeur bevindt, draagt deze er zorg voor dat de zending alsnog de
      volgende dag wordt afgeleverd bij de uitgiftelocatie in het Europese deel van Nederland, onderscheidenlijk bij de
      Minister van Buitenlandse Zaken, indien de zending bestemd is voor een gezaghebber.

      3 In het geval reisdocumenten op een verkeerde uitgiftelocatie in het Europese deel van Nederland zijn afgeleverd,
      draagt de leverancier er zorg voor dat de desbetreffende documenten, zo mogelijk nog dezelfde dag, op de juiste
      uitgiftelocatie in het Europese deel van Nederland worden aangeboden.

      4 Het in ontvangst nemen van reisdocumenten als bedoeld in het derde lid geschiedt overeenkomstig
      [bijlage D][ref1], met gebruikmaking van het daartoe door de distributeur beschikbaar gestelde formulier.

      5 In het geval de zending zich nog onder de transporteur bevindt, draagt deze er zorg voor dat de zending alsnog zo
      spoedig mogelijk wordt afgeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0012811
    url: https://wetten.overheid.nl/BWBR0012811/2016-11-05#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0012811
  - number: '48'
    text: |-
      Indien een reisdocument is beschadigd, onjuist is geproduceerd of gepersonaliseerd, dan wel niet op het verwachte
      tijdstip is ontvangen en niet alsnog ingevolge [artikel 47, tweede, derde of vijfde lid][ref1], zal worden bezorgd,
      wordt het op het reisdocument betrekking hebbende aanvraagbestand opnieuw verzonden aan de leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel47
    url: https://wetten.overheid.nl/BWBR0012811/2016-11-05#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '47'
        hoofdstuk: IV
  - number: '49'
    text: |-
      Reisdocumenten die:

      a. bij de controle van de zending in het reisdocumentenstation dan wel bij de uitreiking onjuist blijken te zijn
      geproduceerd of gepersonaliseerd, dan wel blijken te zijn beschadigd;

      b. na het verwachte tijdstip zijn ontvangen en waarvan inmiddels het daarop betrekking hebbende aanvraagbestand
      ingevolge [artikel 48][ref1] opnieuw is verzonden, worden per aangetekende post, met gebruikmaking van het daartoe
      door de Minister van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde formulier, teruggestuurd aan
      de leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel48
    url: https://wetten.overheid.nl/BWBR0012811/2016-11-05#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '48'
        hoofdstuk: IV
  - number: '50'
    text: |-
      Tot uitreiking van het reisdocument wordt slechts overgegaan, nadat de identiteit van de aanvrager in zijn
      aanwezigheid is vastgesteld, tenzij [artikel 28, derde lid, van de wet][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel28
    url: https://wetten.overheid.nl/BWBR0012811/2016-11-05#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '28'
  - number: 50a
    text: |-
      1 Indien de tot uitreiking bevoegde persoon twijfelt aan de identiteit van de aanvrager worden de vingerafdrukken
      van de aanvrager geverifieerd tegen de vingerafdrukken die in het uit te reiken reisdocument zijn opgenomen.

      2 Indien de verificatie niet slaagt, wordt het reisdocument niet uitgereikt.
    url: https://wetten.overheid.nl/BWBR0012811/2016-11-05#Artikel50a
  - number: '51'
    text: |-
      1 Indien de aanvrager op het moment van de uitreiking ingezetene is van een andere gemeente, wordt het document
      uitgereikt in die gemeente.

      2 Het reisdocument wordt per aangetekende post verstuurd naar het hoofd burgerzaken van de gemeente waarvan de
      aanvrager inmiddels ingezetene is.

      3 De burgemeester van de gemeente, bedoeld in het tweede lid, gaat tot uitreiking van het reisdocument over met
      in achtneming van [artikel 50][ref1]. De op de uitreiking betrekking hebbende gegevens worden geregistreerd in de
      basisregistratie personen.

      4 Van de uitreiking van het reisdocument wordt met gebruikmaking van het daartoe door de Minister van Binnenlandse
      Zaken en Koninkrijksrelaties beschikbaar gestelde formulier kennis gegeven aan de burgemeester van de gemeente waar
      de aanvraag in behandeling is genomen.

      5 De burgemeester die een kennisgeving ontvangt als bedoeld in het vierde lid registreert de uitreiking van het
      reisdocument in het reisdocumentenstation en de reisdocumentenmodule, waarin de gegevens betreffende de aanvraag
      zijn vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel50
    url: https://wetten.overheid.nl/BWBR0012811/2016-11-05#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '50'
        hoofdstuk: V
  - number: '52'
    text: |-
      1 Indien het bij de uitreiking van het aangevraagde reisdocument in te leveren reisdocument is vermist of op andere
      gronden dan ingevolge de wet door een daartoe bevoegde autoriteit is ingenomen, wordt dit gegeven, alsmede het
      nummer van het desbetreffende reisdocument en de autoriteit die het heeft verstrekt, alsnog in de aanvraag met
      betrekking tot het uit te reiken reisdocument opgenomen. Indien deze gegevens op het moment van de uitreiking niet
      voorhanden zijn, wordt hiernaar een gericht onderzoek ingesteld.

      2 [Artikel 27, tweede tot en met zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel27
    url: https://wetten.overheid.nl/BWBR0012811/2016-11-05#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '27'
        hoofdstuk: III
        paragraaf: '1'
  - number: '54'
    text: |-
      1 Uitsluitend indien op grond van [artikel 7][ref1] door een burgemeester als bedoeld in [artikel 7][ref2] een
      reisdocument wordt verstrekt en de aanvrager bij de aanvraag aannemelijk heeft gemaakt dat van hem redelijkerwijs
      niet kan worden gevergd dat hij in persoon verschijnt bij de uitreiking, wordt het reisdocument per aangetekende
      post aan hem toegezonden.

      2 De inlevering van de Nederlandse reisdocumenten, bedoeld in [artikel 32 van de wet][ref3], geschiedt in dat geval
      door deze reisdocumenten per aangetekende post toe te sturen aan de in het eerste lid bedoelde autoriteit.

      3 Tot toezending van het uit te reiken reisdocument wordt niet overgegaan dan na ontvangst van de ingevolge het
      tweede lid toegestuurde reisdocumenten.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0012811#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005212#Artikel32
