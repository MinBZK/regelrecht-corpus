  - number: 8a
    text: De werkzaamheden op grond van de wet worden uitgevoerd door bevoegde en gekwalificeerde personen.
    url: https://wetten.overheid.nl/BWBR0012811/2016-11-05#Artikel8a
  - number: '9'
    text: |-
      1 Voor het verkrijgen van de nodige zekerheid over het Nederlanderschap van de aanvrager die ingezetene is van een
      gemeente of openbaar lichaam, wordt gebruik gemaakt van de in de basisadministratie opgenomen gegevens.

      2 Indien onzekerheid bestaat over het Nederlanderschap van de aanvrager wordt daarnaar een gericht onderzoek
      ingesteld. Dit onderzoek omvat zoveel mogelijk verificatie van de nationaliteit met behulp van door de aanvrager
      over te leggen documenten die zijn afgegeven door een bevoegde autoriteit, waaronder zijn geboorteakte,
      reisdocumenten die op zijn naam zijn gesteld, dan wel buitenlandse reisdocumenten waarin hij staat vermeld en en
      eventuele andere bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0012811/2016-11-05#Artikel9
  - number: '10'
    text: |-
      1 Het nationaal paspoort is geldig voor tien jaren en voor alle landen. Indien de aanvrager bij de aanvraag de
      leeftijd van achttien jaar nog niet heeft bereikt, is het nationaal paspoort in afwijking van de eerste zin geldig
      voor vijf jaren en voor alle landen.

      2 Indien als gevolg van een tijdelijke verhindering bij de aanvrager geen vingerafdrukken in het nationaal paspoort
      worden opgenomen, bedraagt in afwijking van het eerste lid de geldigheidsduur van het betreffende nationaal
      paspoort één jaar.

      3 De Nederlandse identiteitskaart is geldig voor tien jaren. Indien de aanvrager bij de aanvraag de leeftijd van
      achttien jaar nog niet heeft bereikt, is de Nederlandse identiteitskaart, in afwijking van de eerste zin geldig
      voor vijf jaren.
    url: https://wetten.overheid.nl/BWBR0012811/2016-11-05#Artikel10
  - number: '11'
    text: |-
      1 De vaststelling van het recht op een reisdocument voor vluchtelingen als bedoeld in [artikel 11 van de wet][ref1]
      geschiedt op grond van de gegevens die over het verblijfsrecht en de nationaliteit van de aanvrager in de
      basisadministratie zijn opgenomen, alsmede aan de hand van het door de aanvrager overgelegde verblijfsdocument
      waaruit diens nationaliteit blijkt, en:

      a. waaruit diens verblijfsrecht ingevolge [artikel 28][ref2] of [33 van de Vreemdelingenwet 2000][ref3] blijkt, of

      b. waaruit diens verblijfsrecht ingevolge [artikel 12a van de Wet toelating en uitzetting BES][ref4] blijkt.

      2 De vaststelling van het recht op een reisdocument voor vreemdelingen als bedoeld in [artikel 13 van de wet][ref5]
      geschiedt op grond van de gegevens die over het verblijfsrecht en de staatloosheid van de aanvrager in de
      basisadministratie zijn opgenomen, alsmede aan de hand van het door de aanvrager overgelegde verblijfsdocument,
      waaruit het gegeven van diens staatloosheid blijkt, en:

      a. waaruit diens verblijfsrecht ingevolge [artikel 14][ref6] of [20 van de Vreemdelingenwet 2000][ref7] blijkt, of

      b. waaruit diens toelating als staatloze in de openbare lichamen blijkt.

      3 Indien de in de basisadministratie opgenomen gegevens als bedoeld in het eerste en tweede lid afwijken van de
      gegevens die zijn vermeld in het door de aanvrager overgelegde verblijfsdocument dan wel anderszins onzekerheid
      bestaat over deze gegevens, wordt daarnaar een gericht onderzoek ingesteld waarbij de gegevens die over het
      verblijfsrecht en de nationaliteit dan wel staatloosheid van de aanvrager in de vreemdelingenadministratie zijn
      opgenomen, mede worden betrokken.


