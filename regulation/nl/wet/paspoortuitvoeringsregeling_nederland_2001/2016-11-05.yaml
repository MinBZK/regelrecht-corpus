        bwb_id: BWBR0005212
        artikel: '45'
  - number: '60'
    text: |-
      1 Indien de houder van een uitgereikt reisdocument aan de burgemeester van de gemeente of de gezaghebber
      van het openbaar lichaam waarvan hij ingezetene is buiten de gevallen, bedoeld in de [artikelen 27][ref1] en
      [52][ref2], mededeling doet van de vermissing of de inname van het desbetreffende reisdocument, wordt de ingevolge
      [artikel 31, eerste lid, van de wet][ref3] af te leggen schriftelijke verklaring omtrent de vermissing door de
      houder gedaan ten overstaan van de daartoe aangewezen persoon, die de mededeling omtrent de vermissing in ontvangst
      neemt, of schriftelijk, overeenkomstig het daartoe door de Minister van Binnenlandse Zaken en Koninkrijksrelaties
      beschikbaar gestelde formulier. De in [artikel 31, tweede lid, van de wet][ref4] genoemde kopie van het proces-
      verbaal vormt een integraal onderdeel van de schriftelijke verklaring omtrent de vermissing en wordt aan deze
      verklaring toegevoegd.

      2 De schriftelijke verklaring omtrent de vermissing en de bijgevoegde kopie van het proces-verbaal van de politie
      dan wel de overgelegde kopie van de schriftelijke verklaring die omtrent de inname is overgelegd, worden bewaard in
      de reisdocumentenadministratie in de gemeente of het openbaar lichaam waar de in het eerste lid bedoelde mededeling
      is gedaan.

      3 Indien een eerder uitgereikt Nederlands reisdocument, niet zijnde een nooddocument, is vermist of op andere
      gronden dan ingevolge de [wet][ref5] door een daartoe bevoegde autoriteit is ingenomen, wordt dit gegeven terstond
      opgenomen in de basisadministratie waarin de houder als ingezetene is ingeschreven.

      4 De burgemeester verwijst de houder die een mededeling van vermissing van het aan hem uitgereikte reisdocument wil
      doen en geen ingezetene van zijn gemeente is, naar de burgemeester van de gemeente waar de houder ingezetene is dan
      wel naar een burgemeester als bedoeld in [artikel 7][ref6], indien de houder geen ingezetene van een gemeente is.

      5 De gezaghebber neemt ook de verklaring van vermissing op van personen die geen ingezetene zijn van zijn openbaar
      lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel27
