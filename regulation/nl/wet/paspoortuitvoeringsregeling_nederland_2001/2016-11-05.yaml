        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0005212
        artikel: '32'
  - number: '55'
    text: |-
      1 De daartoe aangewezen persoon registreert de uitreiking van een reisdocument, alsmede de inlevering van het
      vorige reisdocument, in de reisdocumentenmodule en geeft dit door aan het reisdocumentenstation.

      2 Indien bij de uitreiking blijkt dat het reisdocument is beschadigd, onjuist is geproduceerd of gepersonaliseerd
      dan wel uit de opslag is verdwenen, wordt dit in de reisdocumentenmodule geregistreerd en doorgegeven aan het
      reisdocumentenstation.

      3 Indien de registratie, bedoeld in het eerste lid, niet kan plaatsvinden in de reisdocumentenmodule,
      geschiedt deze in eerste instantie in het reisdocumentenstation en wordt dit later alsnog doorgegeven aan de
      reisdocumentenmodule.

      4 Indien binnen drie maanden na de datum van ontvangst bij de uitgiftelocatie geen uitreiking van een geleverd
      reisdocument heeft plaatsgevonden, wordt dit geregistreerd in de reisdocumentenmodule en het reisdocumentenstation.
    url: https://wetten.overheid.nl/BWBR0012811/2016-11-05#Artikel55
  - number: '56'
    text: |-
      Bij uitreiking van een reisdocument, niet zijnde een nooddocument, worden de daarop betrekking hebbende gegevens
      geregistreerd in de basisadministratie waarin de houder als ingezetene is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0012811/2016-11-05#Artikel56
  - number: '57'
    text: Dit hoofdstuk is niet van toepassing op Nederlandse identiteitskaarten.
    url: https://wetten.overheid.nl/BWBR0012811/2016-11-05#Artikel57
  - number: '58'
    text: |-
      1 De burgemeester of de gezaghebber die een aanvraag in behandeling neemt dan wel een ingehouden reisdocument
      ontvangt betreffende een persoon die blijkens de in [artikel 5][ref1] bedoelde administratie in het register
      paspoortsignaleringen is opgenomen, verzoekt ingevolge [artikel 44, tweede lid, van de wet][ref2] bij brief of per
      faxbericht aan de Minister van Binnenlandse Zaken en Koninkrijksrelaties hem mede te delen of zulks nog steeds het
      geval is.

      2 In afwijking van het eerste lid kan in spoedgevallen het verzoek ook met gebruikmaking van andere
      communicatiemiddelen worden gedaan, mits het daarna bij brief of per faxbericht wordt bevestigd.

      3 De burgemeester of de gezaghebber die ingevolge [artikel 44, derde lid, van de wet][ref3] de in het register
      paspoortsignaleringen opgenomen gegevens van een persoon wenst te ontvangen, doet daartoe op de in het eerste en
      tweede lid voorgeschreven wijze een verzoek aan de Minister van Binnenlandse Zaken en Koninkrijksrelaties. Dit
      verzoek kan ook tegelijkertijd met het in het eerste lid bedoelde verzoek worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0005212#Artikel44
    url: https://wetten.overheid.nl/BWBR0012811/2016-11-05#Artikel58
