  - number: '105'
    text: |-
      De burgemeester of de gezaghebber is slechts bevoegd van een aanvraagsysteem reisdocumenten in zijn gemeente
      of openbaar lichaam gebruik te maken nadat uit een daartoe door de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties ingesteld onderzoek is gebleken, dat aan het bepaalde in [artikel 87, tweede lid][ref1], wordt
      voldaan.


