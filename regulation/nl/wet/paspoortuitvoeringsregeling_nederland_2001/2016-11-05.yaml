  - number: '2'
    text: |-
      Andere reisdocumenten van het Koninkrijk der Nederlanden ingevolge
      [artikel 2, eerste lid, onder g, van de wet][ref1] zijn:

      a. faciliteitenpaspoort;

      b. tweede paspoort.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel2
    url: https://wetten.overheid.nl/BWBR0012811/2016-11-05#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '2'
  - number: '3'
    text: |-
      1 Met betrekking tot de in [artikel 2, eerste lid, onder a tot en met e, van de wet][ref1] bedoelde reisdocumenten
      bestaan de navolgende modellen:

      a. nationaal paspoort: model nationaal paspoort met 34 bladzijden, dan wel met 66 bladzijden (zakenpaspoort);

      b. diplomatiek paspoort: model diplomatiek paspoort;

      c. dienstpaspoort: model dienstpaspoort en model nationaal paspoort voorzien van standaardclausule IX;

      d. reisdocument voor vluchtelingen: model reisdocument voor vluchtelingen;

      e. reisdocument voor vreemdelingen: model reisdocument voor vreemdelingen.

      2 Met betrekking tot het in [artikel 2, eerste lid, onder f, van de wet][ref2] bedoelde nooddocument bestaan de
      navolgende modellen:

      a. noodpaspoort: model noodpaspoort;

      b. laissez-passer: model laissez-passer.

      3 Met betrekking tot de ingevolge [artikel 2, eerste lid, onder g, van de wet][ref3] vastgestelde reisdocumenten
      bestaan de navolgende modellen:

      a. faciliteitenpaspoort: model nationaal paspoort met 34 bladzijden, dan wel met 66 bladzijden (zakenpaspoort),
      voorzien van standaardclausule VI;

      b. tweede paspoort: model nationaal paspoort met 34 bladzijden, dan wel met 66 bladzijden (zakenpaspoort), voorzien
      van standaardclausule VII.

      4 Met betrekking tot de ingevolge [artikel 2, tweede lid, van de wet][ref4] genoemde Nederlandse identiteitskaart
      bestaat het navolgende model: model Nederlandse identiteitskaart.

      5 In de modellen, genoemd in het eerste, derde en vierde lid, is een machineleesbare strook en een chip opgenomen.

      6 In het model noodpaspoort, genoemd in het tweede lid, onder a, is een machineleesbare strook opgenomen.

      7 De in het eerste lid, onder a, en derde lid genoemde reisdocumenten en de Nederlandse identiteitskaart, bedoeld
      in het vierde lid, vermelden het burgerservicenummer van de houder, tenzij aan de houder geen burgerservicenummer
      is toegekend.

      8 De woonplaats en het adres worden niet opgenomen in de in het eerste tot en met vierde lid genoemde modellen.


