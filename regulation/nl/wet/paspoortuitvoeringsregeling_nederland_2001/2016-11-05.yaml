  - number: '82'
    text: |-
      1 De gezaghebber of de door hem daartoe aangewezen ambtenaar wijst ten minste drie personen aan om zendingen van
      gepersonaliseerde documenten in ontvangst te nemen. Identificatiekaarten en daarop betrekking hebbende codes worden
      uitsluitend in ontvangst genomen door een autorisatiebevoegde reisdocumentenstation.

      2 De aanmelding, registratie en vervanging van de tot ontvangst bevoegde personen, bedoeld in de eerste zin van het
      eerste lid, vindt plaats bij de transporteur.
    url: https://wetten.overheid.nl/BWBR0012811/2016-11-05#Artikel82
  - number: '83'
    text: |-
      1 De burgemeester dan wel de gezaghebber, of de door hem daartoe aangewezen ambtenaar meldt met gebruikmaking
      van het daartoe door de Minister van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde formulier aan
      de Minister van Binnenlandse Zaken en Koninkrijksrelaties de aanvraagstationlocatie in zijn gemeente of openbare
      lichaam waar één of meerdere aanvraagstations zijn geplaatst alsmede de uitgiftelocatie waar de verzending
      van de aanvragen naar de leverancier en de aflevering van de zendingen door de distributeur of de transporteur
      plaatsvindt.

      2 Indien in de gemeente of het openbaar lichaam gebruik wordt gemaakt van meerdere aanvraagstationlocaties en
      uitgiftelocaties als bedoeld in het eerste lid, worden deze locaties, mits de beveiliging daarvan voldoet aan
      de beveiligingseisen als bedoeld in [hoofdstuk XII][ref1], op de in het eerste lid aangegeven wijze, eveneens
      aangemeld.

      3 Wijzigingen met betrekking tot aanvraagstationlocaties en uitgiftelocaties worden, met gebruikmaking van het
      daartoe door de Minister van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde formulier, uiterlijk
      drie maanden voor het tijdstip waarop de wijziging ingaat, gemeld aan de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties.

      4 De Minister van Binnenlandse Zaken en Koninkrijksrelaties houdt een registratie bij van de ingevolge het eerste,
      tweede en derde lid aangemelde aanvraagstationlocaties en uitgiftelocaties en geeft deze gegevens door aan de
      leverancier.

      5 De leverancier wijst aan elke uitgiftelocatie een unieke locatiecode toe en meldt deze terug aan de Minister van
      Binnenlandse Zaken en Koninkrijksrelaties en aan de burgemeester dan wel de gezaghebber.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#HoofdstukXII
