  - number: '14'
    text: |-
      1 Indien de Minister van Justitie heeft vastgesteld, dat de aanvrager niet beschikt over een geldige
      verblijfsvergunning voor bepaalde tijd dan wel voor onbepaalde tijd, zendt hij het formulier met deze mededeling
      terug aan de burgemeester of de gezaghebber waar de aanvraag is ingediend. Het teruggezonden formulier wordt door
      de burgemeester of de gezaghebber aangemerkt als de in [artikel 40, vijfde en zesde lid, van de wet][ref1] vereiste
      vaststelling door de Minister van Justitie in overeenstemming met de Minister van Buitenlandse Zaken, inhoudende
      dat door de aanvrager niet is voldaan aan de voorwaarden voor een aanspraak op verstrekking van een reisdocument
      voor vreemdelingen als bedoeld in [artikel 14 van de wet][ref2].

      2 Indien de Minister van Justitie heeft vastgesteld, dat de aanvrager beschikt over een geldige verblijfsvergunning
      voor bepaalde tijd dan wel voor onbepaalde tijd, zendt hij het aanvraagformulier met deze mededeling aan de
      Minister van Buitenlandse Zaken, die beslist of aan de aanvrager die geen reisdocument van een ander land kan
      verkrijgen dan wel die kan aantonen dat van hem redelijkerwijs niet kan worden gevergd dat hij van een ander land
      een reisdocument aanvraagt, een reisdocument voor vreemdelingen kan worden verstrekt.

      3 De Minister van Buitenlandse Zaken vermeldt in het formulier zijn beslissing inzake de verstrekking van het
      aangevraagde reisdocument. De daartoe aangewezen ambtenaar voorziet op de bestemde plaats het formulier van zijn
      handtekening en zendt het terug aan de burgemeester of de gezaghebber waar de aanvraag is ingediend.

      4 Indien de Minister van Buitenlandse Zaken geen bedenkingen heeft tegen het verlenen van het aangevraagde
      reisdocument, wordt het teruggezonden formulier door de burgemeester of de gezaghebber aangemerkt als de
      in [artikel 40, vijfde en zesde lid, van de wet][ref3] vereiste vaststelling door de Minister van Justitie
      in overeenstemming met de Minister van Buitenlandse Zaken, inhoudende dat door de aanvrager is voldaan aan
      de voorwaarden voor een aanspraak op verstrekking van een reisdocument voor vreemdelingen als bedoeld in
      [artikel 14 van de wet][ref4].

      5 Indien de Minister van Buitenlandse Zaken bedenkingen heeft tegen het verlenen van het aangevraagde reisdocument,
      legt hij deze bedenkingen vast in een beschikking die rechtstreeks aan de aanvrager wordt gezonden. Bij de
      terugzending van het formulier aan de burgemeester of de gezaghebber wordt een afschrift van de beschikking
      meegezonden. Het teruggezonden formulier wordt door de burgemeester of de gezaghebber aangemerkt als een
      mededeling van de Minister van Justitie in overeenstemming met de Minister van Buitenlandse Zaken, inhoudende
      dat bij beschikking van de Minister van Buitenlandse Zaken is vastgesteld, dat door de aanvrager niet is voldaan
      aan de voorwaarden voor een aanspraak op verstrekking van een reisdocument voor vreemdelingen als bedoeld in
      [artikel 14 van de wet][ref5].

      6 De burgemeester of de gezaghebber aan wie het formulier ingevolge het vijfde lid is teruggezonden, neemt geen
      beslissing op de aanvraag gedurende de periode dat nog een beroepstermijn tegen de beschikking van de Minister
      van Buitenlandse Zaken open staat dan wel een daarop betrekking hebbende beroepsprocedure aanhangig is. Indien
      door de aanvrager beroep is aangetekend tegen de beschikking van de Minister van Buitenlandse Zaken, stelt deze de
      burgemeester of de gezaghebber hiervan en van de afloop van deze beroepsprocedure terstond in kennis.


