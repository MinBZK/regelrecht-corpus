  - number: '61'
    text: |-
      Van de vermissing of de inname van een Nederlands reisdocument als bedoeld in de [artikelen 27][ref1], [52][ref2]
      en [60][ref3] wordt, met het oog op de vermelding daarvan in het basisregister reisdocumenten, terstond melding
      gedaan aan de Minister van Binnenlandse Zaken en Koninkrijksrelaties door verstrekking van dit gegeven uit
      de basisadministratie. Indien de melding wordt gedaan door of namens de gezaghebber van een openbaar lichaam,
      geschiedt de melding met gebruikmaking van het daartoe beschikbaar gestelde formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0012811#Artikel52
      [ref3]: https://wetten.overheid.nl/BWBR0012811#Artikel60
