  - number: '13'
    text: |-
      1 Het formulier en de eventuele overgelegde bewijsstukken worden doorgezonden aan de Minister van Justitie in wiens
      vreemdelingenadministratie de aanvrager ten tijde van de aanvraag is opgenomen.

      2 Bij het formulier worden afschriften van de in het bezit van de aanvrager zijnde buitenlandse reisdocumenten,
      dan wel van de buitenlandse reisdocumenten waarin hij staat bijgeschreven (met alle bestempelde visumbladzijden)
      meegezonden.

      3 In het formulier worden de navolgende gegevens die over de aanvrager in de vreemdelingenadministratie zijn
      opgenomen, vermeld:

      a. geslachtsnaam, voornamen, geboortedatum, geboorteplaats en nationaliteit;

      b. de datum sedert welke de aanvrager in de vreemdelingenadministratie is ingeschreven;

      c. het verblijfsrecht van de aanvrager met de datum waarop dit eindigt;

      d. het aan de aanvrager verstrekte verblijfsdocument met vermelding van het documentnummer en de geldigheidsduur,
      dan wel de reden waarom de aanvrager niet in aanmerking komt voor een verblijfsdocument.

      4 In het formulier wordt tevens vermeld of en zo ja, op welke punten de ingevolge [artikel 12][ref1] vermelde
      gegevens afwijken van de gegevens die omtrent de aanvrager in de vreemdelingenadministratie zijn opgenomen.

      5 De daartoe aangewezen ambtenaar voorziet het formulier op de bestemde plaats van zijn handtekening.


