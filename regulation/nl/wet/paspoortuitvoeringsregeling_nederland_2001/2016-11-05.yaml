  - number: '39'
    text: |-
      1 Een aanvraag waarbij niet is voldaan aan het bepaalde in de [artikelen 9 tot en met 38][ref1] wordt niet in
      behandeling genomen.

      2 In de aanvraag voor een reisdocument voor vluchtelingen dan wel een reisdocument voor vreemdelingen wordt,
      afhankelijk van de nationaliteit van de persoon aan wie het reisdocument wordt uitgereikt, aangegeven welk land van
      de territoriale geldigheid is uitgesloten.

      3 In de aanvraag voor een reisdocument voor vreemdelingen, uit te reiken aan een staatloze, wordt aangegeven dat
      diens status van staatloze in het reisdocument moet worden vermeld.

      4 De daartoe aangewezen persoon vermeldt in de aanvraag de verstrekkende autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel9
    url: https://wetten.overheid.nl/BWBR0012811/2016-11-05#Artikel39
