      1 De burgemeester of de door hem daartoe aangewezen persoon spreekt met het bestelkantoor het tijdstip af waarop de
      zending wordt afgeleverd.

      2 De vastlegging van de tijdstippen waarop een zending in een openbaar lichaam wordt afgeleverd, geschiedt in
      overleg met de transporteur.
