  - number: '7'
    text: |-
      De burgemeesters van Bergen op Zoom, Bergeijk, Breda, Echt-Susteren, Enschede, ’s-Gravenhage, Haarlemmermeer,
      Maastricht, Montferland, Oldambt, Sluis en Venlo verrichten de handelingen ingevolge de [wet][ref1] en
      [artikel 6, eerste lid][ref2], tevens ten behoeve van personen die geen ingezetene van een gemeente zijn.


