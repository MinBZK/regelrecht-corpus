  - number: '75'
    text: |-
      1 De burgemeester of de gezaghebber die door toezending van het daartoe door de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties beschikbaar gestelde formulier een kennisgeving ontvangt van:

      a. de definitieve onttrekking aan het verkeer van een reisdocument en de uitreiking van een vervangend
      reisdocument, waarbij is vermeld of het oude reisdocument is ingehouden, ingeleverd of vermist, dan wel

      b. de uitreiking van een reisdocument, waarbij definitieve onttrekking aan het verkeer van een eerder verstrekt
      reisdocument niet aan de orde is, dan wel

      c. de definitieve onttrekking van een reisdocument, waarbij geen nieuw reisdocument is uitgereikt, draagt zorg
      dat deze feiten worden geregistreerd in de basisadministratie, waarin de betrokken persoon als ingezetene is
      ingeschreven.

      2 De burgemeester of de gezaghebber die een in het eerste lid bedoelde kennisgeving ontvangt betreffende een
      persoon die laatstelijk ingezetene van zijn gemeente of openbaar lichaam was, bewaart deze kennisgeving als
      onderdeel van de basisadministratie tot het moment dat de betrokken persoon weer ingezetene van een gemeente of
      openbaar lichaam wordt, dan wel elf jaren zijn verstreken.

      3 De in het eerste en tweede lid bedoelde registratie vindt niet plaats, indien de feiten betrekking hebben op een
      nooddocument of een gevonden reisdocument.

      4 De autoriteit die ten onrechte een kennisgeving als bedoeld in het eerste lid heeft ontvangen, zendt deze
      door aan de burgemeester van de gemeente of de gezaghebber van het openbaar lichaam waarvan de betrokken persoon
      ingezetene is, of laatstelijk ingezetene was.

      5 Indien een persoon wederom ingezetene wordt, wordt een in de tussentijd gezonden kennisgeving als bedoeld in het
      eerste lid opgevraagd bij de burgemeester van de gemeente of de gezaghebber van het openbaar lichaam waarvan de
      betrokken persoon laatstelijk ingezetene was.
    url: https://wetten.overheid.nl/BWBR0012811/2016-11-05#Artikel75
  - number: '76'
    text: |-
      1 Een burgemeester als bedoeld in [artikel 7][ref1] verschaft zich, zoveel mogelijk overeenkomstig het bepaalde in
      het [tweede][ref2] en [derde hoofdstuk][ref3], de nodige zekerheid over de identiteit en de nationaliteit van een
      aanvrager, die stelt niet als ingezetene in de basisadministratie te zijn ingeschreven, aan de hand van het door de
      aanvrager overgelegde reisdocument en eventuele andere bewijsstukken.

      2 Indien onvoldoende zekerheid bestaat over de juistheid van de door de aanvrager gedane mededeling dat hij geen
      ingezetene is, dan wel over de identiteit of de nationaliteit van de aanvrager, wordt de betrokken persoon, indien
      deze op korte termijn over een reisdocument moet beschikken, doorverwezen naar een autoriteit die bevoegd is tot de
      verstrekking van nooddocumenten.

      3 De vaststelling van de identiteit en de nationaliteit van de echtgenoot, echtgenote of geregistreerd partner dan
      wel de gewezen echtgenoot, echtgenote of geregistreerd partner van de aanvrager, respectievelijk van een wettelijke
      vertegenwoordiger die een verklaring van toestemming moet overleggen, geschiedt op de in het eerste en tweede lid
      vermelde wijze, voor zover de betrokken persoon geen ingezetene is.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0012811#HoofdstukII
      [ref3]: https://wetten.overheid.nl/BWBR0012811#HoofdstukIII
