  - number: '101'
    text: |-
      De reisdocumenten die voor de inwerkingtreding van deze regeling zijn verstrekt, behouden de geldigheid die daarin
      is vermeld.
    url: https://wetten.overheid.nl/BWBR0012811/2016-11-05#Artikel101
  - number: '102'
    text: |-
      1 Indien ingevolge [artikel 9][ref1] of [22][ref2] raadpleging moet plaatsvinden van gegevens, behorende bij een
      reisdocument dat is uitgereikt voor de inwerkingtreding van deze regeling, verstrekt de autoriteit bij wie de
      gegevens in de reisdocumentenadministratie berusten op verzoek van de autoriteit die de aanvraag in ontvangst neemt
      kosteloos het originele aanvraagformulier, behorende bij het desbetreffende reisdocument. Alvorens tot verstrekking
      van het originele aanvraagformulier wordt overgegaan, maakt de desbetreffende autoriteit daarvan een kopie die
      in zijn reisdocumentenadministratie wordt bewaard, waarop wordt aangetekend aan welke autoriteit het originele
      aanvraagformulier is verstrekt.

      2 Na vergelijking wordt het originele aanvraagformulier bewaard als onderdeel van de reisdocumentenadministratie,
      behorende bij het uitgereikte nieuwe reisdocument. Indien geen nieuw reisdocument wordt uitgereikt, zendt de
      autoriteit die de aanvraag in behandeling heeft genomen het originele aanvraagformulier terug naar de autoriteit
      die het heeft verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0012811#Artikel22
