  - number: 100h
    text: |-
      1 Na de verstrekking worden de datum waarop het nooddocument uiterlijk moet worden ingeleverd en de autoriteit bij
      wie de inlevering dient plaats te vinden, in het reisdocumentenstation vastgelegd.

      2 De in het eerste lid bedoelde datum is de datum waarop de geldigheidsduur van het nooddocument eindigt.

      3 De ingevolge het eerste lid te vermelden autoriteit is:

      a. de burgemeester of de gezaghebber van de woon- of verblijfplaats van de houder, dan wel

      b. de door de Gouverneur van Aruba, Curaçao of Sint Maarten aangewezen autoriteit, bevoegd tot het in ontvangst
      nemen van aanvragen voor nationale paspoorten, indien de houder in Aruba, Curaçao of Sint Maarten woonachtig is,
      dan wel

      c. de Gouverneur van Aruba, Curaçao of Sint Maarten, indien de houder het nieuwe reisdocument bij de Gouverneur zal
      aanvragen, dan wel

      d. het hoofd van de Nederlandse consulaire post in het buitenland, waar de houder het nieuwe reisdocument zal
      aanvragen.
    url: https://wetten.overheid.nl/BWBR0012811/2016-11-05#Artikel100h
  - number: 100i
    text: |-
      1 De daartoe aangewezen ambtenaar controleert het aanvraagbestand in het reisdocumentenstation op volledigheid en
      autoriseert het gebruik van dit bestand voor het personaliseren van het nooddocument.

      2 Het personaliseren van een noodpaspoort geschiedt met behulp van het in het reisdocumentenstation opgenomen
      aanvraagbestand en met gebruikmaking van de daartoe bestemde reisdocumentenprinter, overeenkomstig de
      gebruikershandleiding bij het reisdocumentenstation.

      3 Het personaliseren van een laissez-passer geschiedt door de gegevens met de pen op onuitwisbare wijze in
      de daartoe bestemde rubrieken van het reisdocument in te vullen, overeenkomstig de in bijlage J opgenomen
      invulinstructie laissez-passer. Vervolgens wordt op de in de invulinstructie aangegeven wijze de autoriteit
      vermeld, die het document heeft verstrekt en het laissez-passer gewaarmerkt met het in [artikel 88][ref1] bedoelde
      dienststempel.

      4 Na het personaliseren van het nooddocument wordt het bijbehorende laminaat over de houderpagina aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel88
    url: https://wetten.overheid.nl/BWBR0012811/2016-11-05#Artikel100i
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '88'
        hoofdstuk: XI
        paragraaf: '4'
  - number: 100j
    text: |-
      1 Tot uitreiking van het aangevraagde nooddocument wordt slechts overgegaan, nadat de identiteit van de aanvrager
      in zijn aanwezigheid is vastgesteld en de aanvrager de in het document weergegeven persoonsgegevens op juistheid
      heeft gecontroleerd, tenzij [artikel 28, derde lid, van de wet][ref1] van toepassing is.

      2 De daartoe aangewezen ambtenaar registreert de uitreiking van het nooddocument in het reisdocumentenstation.

      3 Indien bij de uitreiking blijkt dat het nooddocument is beschadigd, onjuist is geproduceerd of gepersonaliseerd
      dan wel uit de opslag is verdwenen, wordt dit in het reisdocumentenstation geregistreerd.

      4 Indien het nooddocument niet binnen drie maanden, nadat het voor uitreiking beschikbaar is gesteld, door de
      aanvrager in ontvangst is genomen, wordt dit geregistreerd in het reisdocumentenstation.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel28
    url: https://wetten.overheid.nl/BWBR0012811/2016-11-05#Artikel100j
    references:
