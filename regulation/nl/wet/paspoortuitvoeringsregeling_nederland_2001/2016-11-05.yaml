  - number: '77'
    text: |-
      1 Een burgemeester als bedoeld in [artikel 7][ref1] geeft van de definitieve onttrekking aan het verkeer van
      een reisdocument, niet zijnde een nooddocument of een gevonden reisdocument, alsmede van de uitreiking van een
      vervangend reisdocument aan een persoon die geen ingezetene is met gebruikmaking van het daartoe door de Minister
      van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde formulier kennis aan:

      a. de burgemeester of de gezaghebber, indien de houder laatstelijk ingezetene was van diens gemeente of openbaar
      lichaam en het bepaalde onder b of c niet van toepassing is, dan wel

      b. de autoriteit in Aruba, Curaçao of Sint Maarten, indien deze het definitief aan het verkeer onttrokken
      reisdocument heeft verstrekt, dan wel

      c. de Minister van Buitenlandse Zaken indien het definitief aan het verkeer onttrokken reisdocument is verstrekt in
      het buitenland en de houder ten tijde van die verstrekking geen ingezetene was.

      2 Indien een burgemeester als bedoeld in [artikel 7 ][ref2]door toezending van het daartoe door de Minister
      van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde formulier op de hoogte wordt gesteld van de
      definitieve onttrekking aan het verkeer van een door hem verstrekt reisdocument en de uitreiking van een vervangend
      reisdocument, neemt hij deze feiten op in de administratie, bedoeld in [artikel 74][ref3].

      3 Van een vermissing van een Nederlands reisdocument als bedoeld in de [artikelen 27][ref4], [52][ref5] en
      [60][ref6] wordt met gebruikmaking van het daartoe door de Minister van Binnenlandse Zaken en Koninkrijksrelaties
      beschikbaar gestelde formulier melding gemaakt aan de Minister van Binnenlandse Zaken en Koninkrijksrelaties.


