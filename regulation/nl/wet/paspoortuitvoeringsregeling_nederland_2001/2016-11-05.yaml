  - number: '62'
    text: |-
      1 De burgemeester of de gezaghebber die een reisdocument heeft ingehouden dan wel bij wie een reisdocument is
      ingeleverd van een houder, die in verband met het bepaalde in de [artikelen 18 tot en met 24 van de wet][ref1] in
      het register paspoortsignaleringen is opgenomen en ten aanzien van wie hij niet bevoegd is tot vervallenverklaring,
      zendt dit reisdocument per aangetekende post en met vermelding van de reden van doorzending terstond door aan:

      a. de burgemeester van de gemeente of de gezaghebber van het openbaar lichaam waarvan de houder ingezetene is,
      dan wel

      b. de burgemeester van Den Haag, indien de houder geen ingezetene van een gemeente of openbaar lichaam is.

      2 De burgemeester of de gezaghebber aan wie een reisdocument ten onrechte is doorgezonden, draagt er zorg voor dat
      het reisdocument alsnog op de in het eerste lid bedoelde wijze aan de tot vervallenverklaring bevoegde burgemeester
      of gezaghebber wordt toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel18
    url: https://wetten.overheid.nl/BWBR0012811/2016-11-05#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '18'
  - number: '63'
    text: |-
      1 De burgemeester of de gezaghebber die een reisdocument heeft ingehouden of bij wie een reisdocument is
      ingeleverd dan wel die een gevonden reisdocument heeft ontvangen, dat blijkens [artikel 67][ref1] definitief
      aan het verkeer moet worden onttrokken en daartoe niet bevoegd is, zendt dit reisdocument per aangetekende
      post en met vermelding van de reden van doorzending terstond aan de Minister van Buitenlandse Zaken, indien
      het een diplomatiek paspoort, een dienstpaspoort of een door de Minister van Buitenlandse Zaken op grond van
      [artikel 15, tweede lid, van de wet][ref2] aan een vreemdeling verstrekt laissez-passer betreft.

      2 Indien het een op grond van [artikel 16, eerste lid, van de wet][ref3] verstrekt nooddocument betreft, is
      de burgemeester of de gezaghebber bevoegd dit namens de Minister van Binnenlandse Zaken en Koninkrijksrelaties
      definitief aan het verkeer te onttrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0005212#Artikel16
