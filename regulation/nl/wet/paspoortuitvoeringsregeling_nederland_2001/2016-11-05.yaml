      1 De burgemeester of de gezaghebber voert voor 1 oktober van ieder jaar een controle uit op de toepassing van de
      beveiligingsmaatregelen, genoemd in de [artikelen 90 tot en met 93][ref1], en de overige aspecten van het aanvraag-
      en uitgifteproces van reisdocumenten en informeert voor 1 november van ieder jaar de Minister van Binnenlandse
      Zaken en Koninkrijksrelaties over de bevindingen van de controle.

      2 Bij de controle en de verslaglegging wordt gebruik gemaakt van de daarvoor door de Minister van Binnenlandse
      Zaken en Koninkrijksrelaties beschikbaar gestelde hulpmiddelen.

      3 De minister kan in aanvulling op de in het eerste lid bedoelde controle steekproefsgewijze een nader onderzoek
      uitvoeren teneinde de bevindingen van de controle, bedoeld in het eerste lid, te verifiëren.


