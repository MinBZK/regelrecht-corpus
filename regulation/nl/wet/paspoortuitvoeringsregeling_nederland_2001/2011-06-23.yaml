  - number: '103'
    text: |-
      In afwijking van [artikel 69, onder a][ref1], vindt het ongedaan maken van een bijschrijving in een reisdocument
      dat voor de inwerkingtreding van deze regeling is verstrekt, plaats door deze bijschrijving met de pen op
      onuitwisbare wijze door te halen, het plaatsen van de clausule "Wijziging/doorhaling goedgekeurd d.d. <datum> en
      waarmerking van de doorhaling met het in [artikel 88, eerste lid][ref2], bedoelde dienststempel, voorzien van de
      paraaf van de burgemeester of de daartoe aangewezen ambtenaar.


