  - number: 100f
    text: |-
      1 De daartoe aangewezen ambtenaar vermeldt na de beslissing dat het nooddocument kan worden verstrekt, in de
      aanvraag:

      a. het gegeven dat de verstrekking heeft plaatsgevonden;

      b. de datum van de verstrekking;

      c. de datum waarop de geldigheidsduur van het uit te reiken nooddocument eindigt;

      d. de verstrekkende autoriteit.

      2 Indien sprake is van een aanvraag als bedoeld in [artikel 100e, derde lid][ref1], of een aanvraag voor een
      laissez-passer, wordt in de aanvraag vermeld voor welke landen het nooddocument geldig is.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel100e
