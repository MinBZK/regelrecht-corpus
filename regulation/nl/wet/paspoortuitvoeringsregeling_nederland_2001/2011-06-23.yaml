        artikel: '87'
        hoofdstuk: XI
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0012811
        artikel: '87'
        hoofdstuk: XI
        paragraaf: '4'
  - number: '80'
    text: |-
      1 Een autorisatiebevoegde reisdocumentenstation krijgt van de leverancier de beschikking over een
      identificatiekaart, waarmee op elektronische wijze toegang kan worden verkregen tot het reisdocumentenstation en de
      daarin opgeslagen programmatuur en gegevens.

      2 De autorisatiebevoegde reisdocumentenstation is, met inachtneming van de gebruikershandleiding bij het
      reisdocumentenstation, bedoeld in [artikel 87][ref1], verantwoordelijk voor het aanvragen, de bewaring, de
      uitgifte, de intrekking en het (autorisatie)beheer van de identificatiekaarten van andere personen die bevoegd zijn
      tot het verrichten van handelingen waarvoor toegang tot het reisdocumentenstation is vereist. Hij geeft wijzigingen
      terstond door aan de leverancier.

      3 Met inachtneming van het bepaalde in [bijlage I][ref2] kunnen extra identificatiekaarten bij de leverancier
      worden nabesteld.

      4 De identificatiekaarten worden op naam uitgegeven.

      5 De leverancier houdt een registratie bij van de uitgegeven en ingetrokken identificatiekaarten.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0012811
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '87'
        hoofdstuk: XI
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0012811
  - number: 80a
    text: |-
      1 Per aanvraagstationlocatie worden door de leverancier twee opstartkaarten verstrekt, waarmee het aanvraagstation
      in werking kan worden gesteld.

      2 De autorisatiebevoegde aanvraagstation is, met inachtneming van de gebruikershandleiding bij het aanvraagstation,
      bedoeld in [artikel 87][ref1], verantwoordelijk voor de bewaring en het gebruik van de opstartkaart.

      3 Bij defect of verlies van een opstartkaart wordt terstond contact opgenomen met de leverancier.

      4 Een defecte opstartkaart wordt terstond aan de leverancier toegestuurd.

      5 De leverancier houdt een registratie bij van de uitgegeven opstartkaarten. Tevens registreert hij welke
      opstartkaarten vermist zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel87
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel80a
