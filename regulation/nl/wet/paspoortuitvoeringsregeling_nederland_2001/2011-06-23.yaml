    text: |-
      1 Op het opmaken van de aanvraag voor een nooddocument zijn de
      [artikelen 21, met uitzondering van het vierde lid][ref1], [23, met uitzondering van het achtste lid][ref2],
      [26, met uitzondering van het tweede lid][ref3], [27, met uitzondering van het zesde lid][ref4], [28][ref5],
      [29][ref6], [30][ref7], [31][ref8] en [32][ref9] van overeenkomstige toepassing.

      2 Op het opnemen van de foto en de handtekening van de aanvrager is
      [artikel 38, met uitzondering van het vierde lid][ref10], van overeenkomstige toepassing.


