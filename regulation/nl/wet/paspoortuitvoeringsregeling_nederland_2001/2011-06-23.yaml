  - number: '73'
    text: |-
      Onverminderd het bepaalde in [artikel 65, tweede lid, van de wet][ref1], wordt de verstrekking van gegevens uit de
      in [artikel 72][ref2] bedoelde reisdocumentenadministratie uitsluitend toegestaan aan:

      a. degenen die bij of krachtens de [wet][ref3] belast zijn met de uitvoering daarvan, voor zover die gegevens
      noodzakelijk zijn voor het verrichten van werkzaamheden met betrekking tot reisdocumenten;

      b. de ambtenaren, werkzaam bij het ministerie van Buitenlandse Zaken, een Nederlandse consulaire vertegenwoordiging
      in het buitenland onderscheidenlijk het Kabinet van de Gouverneur van Aruba, Curaçao of Sint Maarten, voor zover
      die gegevens noodzakelijk zijn voor consulaire handelingen waarbij de identiteit van de betrokken persoon moet
      worden vastgesteld;

      c. de opsporingsambtenaren bedoeld in [artikel 141][ref4] en [142 van het Wetboek van Strafvordering][ref5] en
      [artikel 184][ref6] en [185 van het Wetboek van Strafvordering BES][ref7], voor zover die gegevens noodzakelijk
      zijn voor de opsporing van strafbare feiten in het kader van het onderzoek waarbij zij zijn betrokken of voor zover
      die noodzakelijk zijn voor de identificatie van slachtoffers;

      d. de ambtenaren van het openbaar ministerie van het Europese deel van Nederland en het openbaar ministerie
      van Bonaire, Sint Eustatius en Saba, voor zover die gegevens noodzakelijk zijn voor de uitoefening van de hun
      opgedragen werkzaamheden;

      e. de ambtenaren werkzaam bij de autoriteiten, bedoeld in de [artikelen 18 tot en met 24 van de wet][ref8],
      voor zover die gegevens noodzakelijk zijn voor het verzoek tot weigering of vervallenverklaring en de
      daarmee verband houdende vermelding van deze gegevens in het register paspoortsignaleringen als bedoeld in
      [artikel 25, derde lid, van de wet][ref9];

      f. de ambtenaren werkzaam bij het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties, voor zover
      die gegevens noodzakelijk zijn voor de hun opgedragen werkzaamheden in verband met de verwerking van
      gegevens in het basisregister reisdocumenten, in verband met de uitoefening van hun taak als bedoeld in
      [artikel 58 van de wet][ref10], alsmede in verband met onderzoek naar onregelmatigheden met reisdocumenten;

      g. degene die in opdracht van het college van burgemeester en wethouders of het bestuurscollege belast is
      met de controle op de uitvoering van de bij of krachtens de [wet][ref11] gestelde regels, de toepassing
      van de beveiligingsmaatregelen, de werking van het aanvraagsysteem reisdocumenten of de opneming van
      reisdocumentengegevens in de basisadministratie, voor zover die gegevens noodzakelijk zijn voor de hun opgedragen
      werkzaamheden;

      h. de houder, beheerder, bewerker en degene die belast is met de invoer, wijziging, of verwijdering van gegevens,
      voor zover die gegevens, de rechtstreekse toegang daaronder begrepen, noodzakelijk zijn voor de uitoefening van de
      hun in verband daarmee opgedragen werkzaamheden;

      i. de ambtenaren werkzaam bij de Algemene Inlichtingen- en Veiligheidsdienst en de
      Militaire Inlichtingen- en Veiligheidsdienst, voor zover die gegevens noodzakelijk
      zijn voor de uitvoering van hun taken als bedoeld in [artikel 6, tweede lid][ref12], en
      [artikel 7, tweede lid, van de Wet op de inlichtingen- en veiligheidsdiensten 2002][ref13].


