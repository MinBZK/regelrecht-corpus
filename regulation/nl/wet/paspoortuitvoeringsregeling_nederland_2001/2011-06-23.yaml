        artikel: '45'
  - number: '60'
    text: |-
      1 Indien de houder van een uitgereikt reisdocument aan de burgemeester van de gemeente of de gezaghebber van
      het openbaar lichaam waar hij als ingezetene in de basisadministratie is ingeschreven buiten de gevallen,
      bedoeld in de [artikelen 27][ref1] en [52][ref2], mededeling doet van de vermissing of de inname van het
      desbetreffende reisdocument, wordt de ingevolge [artikel 31, eerste lid, van de wet][ref3] af te leggen
      schriftelijke verklaring omtrent de vermissing door de houder gedaan ten overstaan van de daartoe aangewezen
      ambtenaar, die de mededeling omtrent de vermissing in ontvangst neemt overeenkomstig modelformulier C2. De in
      [artikel 31, tweede lid, van de wet][ref4] genoemde kopie van het proces-verbaal vormt een integraal onderdeel van
      de schriftelijke verklaring omtrent de vermissing en wordt aan deze verklaring toegevoegd.

      2 De schriftelijke verklaring omtrent de vermissing en de bijgevoegde kopie van het proces-verbaal van de politie
      dan wel de overgelegde kopie van de schriftelijke verklaring die omtrent de inname is overgelegd, worden bewaard in
      de reisdocumentenadministratie in de gemeente of het openbaar lichaam waar de in het eerste lid bedoelde mededeling
      is gedaan.

      3 Indien een eerder uitgereikt Nederlands reisdocument, niet zijnde een nooddocument, is vermist of op andere
      gronden dan ingevolge de [wet][ref5] door een daartoe bevoegde autoriteit is ingenomen, wordt dit gegeven terstond
      opgenomen in de basisadministratie van de gemeente of het openbaar lichaam waar de houder als ingezetene is
      ingeschreven.

      4 De burgemeester verwijst de houder die een mededeling van vermissing van het aan hem uitgereikte reisdocument wil
      doen en niet in de basisadministratie van zijn gemeente als ingezetene is ingeschreven, naar de burgemeester van
      de gemeente waar de houder in de basisadministratie als ingezetene is ingeschreven dan wel naar een burgemeester
      als genoemd in [artikel 7][ref6] indien de houder niet als ingezetene in de basisadministratie van een gemeente
      is ingeschreven.

      5 De gezaghebber neemt ook de verklaring van vermissing op van personen die niet als ingezetenen zijn ingeschreven
      in de basisadministratie van zijn openbaar lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0012811#Artikel52
      [ref3]: https://wetten.overheid.nl/BWBR0005212#Artikel31
