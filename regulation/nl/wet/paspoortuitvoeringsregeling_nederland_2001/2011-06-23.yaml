  - number: '28'
    text: |-
      1 Bij het indienen van een aanvraag voor een reisdocument wordt een pasfoto overgelegd die een goedgelijkend beeld
      van de aanvrager geeft.

      2 De overgelegde pasfoto voldoet aan de acceptatiecriteria van de in [bijlage L][ref1] bij deze regeling opgenomen
      fotomatrix.

      3 In afwijking van het tweede lid kan een pasfoto worden geaccepteerd indien de aanvrager heeft aangetoond dat
      godsdienstige of levensbeschouwelijke redenen zich verzetten tegen het niet bedekken van het hoofd.

      4 In afwijking van het tweede lid kan een pasfoto worden geaccepteerd indien op grond van objectief vast te
      stellen fysieke of medische redenen, door de aanvrager niet kan worden voldaan aan alle in de fotomatrix opgenomen
      acceptatiecriteria. Bij gerede twijfel aan de medische redenen kan van de aanvrager worden verlangd, dat deze
      daartoe een door een bevoegde arts of medische instelling ondertekende verklaring overlegt.

      5 In afwijking van het tweede lid kan een pasfoto van een aanvrager die de leeftijd van zes jaar nog niet heeft
      bereikt worden geaccepteerd, indien de foto voldoet aan de in de fotomatrix voor die leeftijdscategorie opgenomen
      minimum vereisten.


      [ref1]: https://wetten.overheid.nl/BWBR0012811
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0012811
  - number: 28a
    text: |-
      1 Bij het indienen van een aanvraag voor een reisdocument, worden de afdrukken van vier vingers van de aanvrager
      opgenomen.

      2 Bij de aanvrager worden platte afdrukken van de linker- en de rechterwijsvinger opgenomen voor opslag in
      het reisdocument. Indien de kwaliteit van de vingerafdrukken van de wijsvingers ontoereikend is, worden platte
      afdrukken van de middelvingers, ringvingers of duimen opgenomen.

      3 In de reisdocumentenadministratie worden de vingerafdrukken opgeslagen die ingevolge het tweede lid zijn
      opgenomen. Daarnaast worden bij de aanvrager platte afdrukken van twee andere in het tweede lid genoemde vingers
      opgenomen voor opslag in de reisdocumentenadministratie. Indien de kwaliteit van deze vingers ontoereikend is,
      worden platte afdrukken van de pinken opgenomen.

      4 Indien van slechts één vinger een afdruk van voldoende kwaliteit kan worden opgenomen, wordt uitsluitend de
      afdruk van die vinger opgeslagen in het reisdocument en in de reisdocumentenadministratie.

      5 In afwijking van het eerste lid wordt van het opnemen van vingerafdrukken afgezien, indien de aanvrager op het
      moment van het indienen van de aanvraag de leeftijd van twaalf jaar nog niet heeft bereikt.

      6 Indien de daartoe aangewezen ambtenaar van oordeel is dat het fysiek dan wel als gevolg van een tijdelijke
      verhindering onmogelijk is om van de aanvrager te verlangen dat bij hem op het moment van het indienen van de
      aanvraag vier vingerafdrukken worden opgenomen, worden in ieder geval de afdrukken opgenomen van de vingers waarbij
      dit volgens de daartoe aangewezen ambtenaar wel mogelijk is. Bij gerede twijfel of het fysiek dan wel als gevolg
      van een tijdelijke verhindering onmogelijk is om vier vingerafdrukken op te nemen, kan van de aanvrager worden
      verlangd, dat deze daartoe een door een bevoegde arts of medische instelling ondertekende verklaring overlegt.

      7 Indien van de aanvrager geen vingerafdrukken worden opgenomen, wordt in de aanvraag de reden voor het niet
      opnemen vermeld.
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel28a
  - number: '29'
    text: |-
      Indien de persoon aan wie het aangevraagde reisdocument moet worden verstrekt door leeftijd of een handicap niet in
      staat is zijn handtekening te plaatsen, wordt daarvan in de aanvraag melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel29
  - number: '30'
    text: |-
      Indien de aanvrager ingevolge [artikel 28, derde lid, van de wet][ref1] niet persoonlijk bij het indienen van de
      aanvraag is verschenen, wordt dit gegeven met de reden daarvan in de aanvraag vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel28
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '28'
  - number: '31'
    text: |-
      1 De verklaring van toestemming als bedoeld in de [artikelen 34 tot en met 37 van de wet][ref1] dient schriftelijk
      te worden overgelegd.

      2 In de verklaring van toestemming worden tevens de naam en de handtekening vermeld van degene die de aanvraag ten
      behoeve van een handelingsonbekwame indient.

      3 In de aanvraag wordt melding gemaakt van de overlegging van de betreffende verklaring van toestemming.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel34
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '34'
  - number: '32'
    text: |-
      1 Op de procedure voor het verkrijgen van de nodige zekerheid over de identiteit van degene die het gezag over de
      minderjarige uitoefent of van de curator is artikel 22 van overeenkomstige toepassing.

      2 Indien degene die een verklaring van toestemming moet afgeven niet in persoon verschijnt, kan de aanvraag slechts
      in behandeling worden genomen indien uit de overgelegde schriftelijke verklaring van toestemming en eventuele
      andere overgelegde stukken met de nodige zekerheid kan worden afgeleid dat de verklaring van toestemming van de
      betreffende persoon afkomstig is.

      3 Voor het verkrijgen van de nodige zekerheid over de bevoegdheid tot het afgeven van de verklaring van toestemming
      van degene die het gezag over de minderjarige uitoefent of van de curator wordt gebruik gemaakt van de door de
      betreffende persoon overgelegde stukken en de omtrent het gezag of de curatele in de basisadministratie opgenomen
      gegevens.

      4 Indien onzekerheid bestaat over de bevoegdheid van degene die het gezag over de minderjarige uitoefent of van de
      curator wordt daarnaar een gericht onderzoek ingesteld.
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel32
  - number: '33'
    text: |-
      1 Bijschrijving van kinderen is toegestaan in ieder geldig Nederlands reisdocument met uitzondering van de
      Nederlandse identiteitskaart, het diplomatiek paspoort, het dienstpaspoort, het tweede paspoort, het noodpaspoort,
      het laissez-passer en het reisdocument waarin een noodverlenging is aangebracht.

      2 Onverminderd het bepaalde in [artikel 7][ref1] kan bijschrijving in een reeds uitgereikt geldig reisdocument
      uitsluitend worden verzocht aan de burgemeester van de gemeente of de gezaghebber van het openbaar lichaam waar
      de houder van het reisdocument dan wel waar het bij te schrijven kind als ingezetene in de basisadministratie is
      ingeschreven.

      3 Voor elke bijschrijving van een kind in een reisdocument dient een afzonderlijke aanvraag te worden opgemaakt.
      [Artikel 21, eerste en tweede lid][ref2], is van overeenkomstige toepassing.

      4 In de aanvraag wordt aangegeven of deze betrekking heeft op een bijschrijving in een gelijktijdig aangevraagd
      reisdocument dan wel op een bijschrijving in een reeds uitgereikt geldig reisdocument.

      5 Indien om bijschrijving wordt verzocht in een gelijktijdig aangevraagd reisdocument, wordt in de aanvraag het
      aanvraagnummer, behorende bij de aanvraag voor het desbetreffende reisdocument, vermeld.

      6 Indien om bijschrijving wordt verzocht in een reeds uitgereikt geldig reisdocument, wordt in de aanvraag voor de
      bijschrijving het documentnummer van het desbetreffende reisdocument vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0012811#Artikel21
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel33
