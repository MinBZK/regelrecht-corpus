        artikel: '32'
  - number: '55'
    text: |-
      1 De daartoe aangewezen ambtenaar registreert de uitreiking van of de bijschrijving in een reisdocument, alsmede de
      inlevering van het vorige reisdocument, in de reisdocumentenmodule en geeft dit door aan het reisdocumentenstation.

      2 Indien bij de uitreiking blijkt dat het reisdocument of de bijschrijvingssticker is beschadigd, onjuist
      is geproduceerd of gepersonaliseerd dan wel uit de opslag is verdwenen, wordt dit in de reisdocumentenmodule
      geregistreerd en doorgegeven aan het reisdocumentenstation.

      3 Indien de registratie, bedoeld in het eerste lid, niet kan plaatsvinden in de reisdocumentenmodule,
      geschiedt deze in eerste instantie in het reisdocumentenstation en wordt dit later alsnog doorgegeven aan de
      reisdocumentenmodule.

      4 Indien binnen drie maanden na de datum van ontvangst bij de uitgiftelocatie geen uitreiking van een geleverd
      reisdocument of plaatsing van een geleverde bijschrijvingssticker heeft plaatsgevonden, wordt dit geregistreerd in
      de reisdocumentenmodule en het reisdocumentenstation.
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel55
  - number: '56'
    text: |-
      1 Bij uitreiking van een reisdocument, niet zijnde een nooddocument, worden de daarop betrekking hebbende gegevens
      geregistreerd in de basisadministratie waarin de houder als ingezetene is ingeschreven.

      2 De bijschrijving in een reisdocument waarvan de aanvraag is ingediend bij een burgemeester wordt geregistreerd in
      de basisadministratie van de gemeente waarin het bijgeschreven kind als ingezetene is ingeschreven.

      3 Van een bijschrijving in een reisdocument door de burgemeester van een gemeente waar het bijgeschreven kind
      niet als ingezetene in de basisadministratie is ingeschreven, wordt met gebruikmaking van modelformulier C3 kennis
      gegeven aan de burgemeester van de gemeente waar het bijgeschreven kind als ingezetene in de basisadministratie is
      of voor het laatst was ingeschreven.

      4 In de openbare lichamen kan uitsluitend de gezaghebber van het openbaar lichaam waar het kind als ingezetene in
      de basisadministratie is ingeschreven het kind bijschrijven in een reisdocument.
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel56
  - number: '57'
    text: Dit hoofdstuk is niet van toepassing op Nederlandse identiteitskaarten.
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel57
  - number: '58'
    text: |-
      1 De burgemeester of de gezaghebber die een aanvraag in behandeling neemt dan wel een ingehouden reisdocument
      ontvangt betreffende een persoon die blijkens de in [artikel 5][ref1] bedoelde administratie in het register
      paspoortsignaleringen is opgenomen, verzoekt ingevolge [artikel 44, tweede lid, van de wet][ref2] bij brief of per
      faxbericht aan het agentschap BPR hem mede te delen of zulks nog steeds het geval is.

      2 In afwijking van het eerste lid kan in spoedgevallen het verzoek ook met gebruikmaking van andere
      communicatiemiddelen worden gedaan, mits het daarna bij brief of per faxbericht wordt bevestigd.

      3 De burgemeester of de gezaghebber die ingevolge [artikel 44, derde lid, van de wet][ref3] de in het register
      paspoortsignaleringen opgenomen gegevens van een persoon wenst te ontvangen, doet daartoe op de in het eerste en
      tweede lid voorgeschreven wijze een verzoek aan het agentschap BPR. Dit verzoek kan ook tegelijkertijd met het in
      het eerste lid bedoelde verzoek worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0005212#Artikel44
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel58
