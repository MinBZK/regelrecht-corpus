    text: |-
      De burgemeesters van Den Haag, Enschede, Maastricht, Echt-Susteren en Oldambt verrichten de handelingen
      ingevolge de [wet][ref1] en [artikel 6][ref2] tevens ten behoeve van personen die niet als ingezetene in de
      basisadministratie van een gemeente zijn ingeschreven.


