    text: |-
      De burgemeester of de gezaghebber die niet bevoegd is tot het in ontvangst nemen van de aanvraag verwijst
      de betrokken persoon terstond naar de burgemeester of de gezaghebber die ingevolge de [wet][ref1] en de
      [artikelen 6][ref2] en [7 van deze regeling][ref3] daartoe wel bevoegd is.


