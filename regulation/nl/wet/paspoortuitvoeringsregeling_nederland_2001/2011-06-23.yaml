        artikel: '48'
        hoofdstuk: IV
  - number: '87'
    text: |-
      1 De burgemeester of de gezaghebber maakt binnen het aanvraagsysteem reisdocumenten gebruik van het
      reisdocumentenstation, het aanvraagstation het mobiel vingerafdrukopname-apparaat en de overige materialen,
      overeenkomstig het bepaalde in deze regeling en met inachtneming van de bijgeleverde gebruikershandleidingen.

      2 De burgemeester of de gezaghebber draagt zorg voor de technische inrichting, de werking en de beveiliging van
      de reisdocumentenmodule en de correcte uitwisseling van de daarin opgenomen gegevens met het reisdocumentenstation
      en de basisadministratie, overeenkomstig het bepaalde in deze regeling en met inachtneming van de terzake door de
      Minister van Binnenlandse Zaken en Koninkrijksrelaties nader gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel87
  - number: '88'
    text: |-
      1 Het dienststempel is een inktstempel van een rond formaat met een diameter van 15 mm, dat voorzien is van het
      gemeentewapen of het wapen van het openbaar lichaam.

      2 Voor het ongedaan maken van een bijschrijving wordt een door de leverancier beschikbaar gesteld clausulestempel
      gebruikt, dat in drie talen de tekst “vervallen” bevat.
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel88
  - number: '89'
    text: |-
      1 De in [artikel 38][ref1] bedoelde foto- en handtekeningformulieren worden vier maal per jaar door de leverancier
      beschikbaar gesteld.

      2 Het aantal foto- en handtekeningformulieren dat jaarlijks beschikbaar wordt gesteld, is gebaseerd op het
      jaarlijkse aantal aanvraagbestanden, dat ingevolge [artikel 42][ref2] vanuit de desbetreffende uitgiftelocatie
      aan de leverancier is gezonden, in de periode tussen 1 oktober en 30 september, vermeerderd met vijf procent. De
      leverancier maakt jaarlijks voor 1 november het aantal beschikbaar te stellen foto- en handtekeningformulieren voor
      het volgende kalenderjaar en de tijdstippen waarop deze worden afgeleverd, bekend aan de uitgiftelocatie.

      3 Indien tussen twee aflevertijdstippen blijkt dat de voorraad foto- en handtekeningformulieren ontoereikend
      zal zijn, kan met gebruikmaking van modelformulier C8 een spoedbestelling worden gedaan. De omvang van de
      spoedbestelling is niet groter dan noodzakelijk om de periode tot het eerstvolgende aflevertijdstip te overbruggen.

      4 De foto- en handtekeningformulieren worden door de leverancier binnen tien werkdagen na de spoedbestelling
      geleverd op de uitgiftelocatie waarvoor de bestelling is gedaan.

      5 De overige standaardformulieren worden eenmalig door de leverancier ter beschikking gesteld en kunnen desgewenst
      worden nabesteld.

      6 De foto- en handtekeningformulieren en andere standaardformulieren worden kosteloos verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0012811#Artikel42
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel89
