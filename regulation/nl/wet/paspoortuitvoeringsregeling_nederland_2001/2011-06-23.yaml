  - number: 100e
    text: |-
      1 Indien de aanvraag voor een nooddocument betrekking heeft op een Nederlander dan wel op een als ingezetene in
      de basisadministratie van een openbaar lichaam ingeschreven vreemdeling die recht heeft op verstrekking van een
      reisdocument als bedoeld in [artikel 11][ref1] of [13 van de wet][ref2], beslist de gezaghebber of het aangevraagde
      nooddocument kan worden uitgereikt, onverminderd het bepaalde in het derde lid.

      2 In alle andere dan de in het eerste lid bedoelde gevallen vindt verstrekking van een nooddocument door de
      gezaghebber slechts plaats na machtiging van de Minister van Binnenlandse Zaken en Koninkrijksrelaties, aan wie
      daartoe per fax of op een andere beveiligde wijze een kopie van de aanvraaggegevens, waaronder het formulier C1,
      ter beschikking wordt gesteld.

      3 De gezaghebber die een aanvraag in behandeling neemt betreffende een persoon die blijkens de in [artikel 5][ref3]
      bedoelde administratie in het register paspoortsignaleringen is vermeld, legt deze aanvraag onverwijld voor
      aan de Minister van Binnenlandse Zaken en Koninkrijksrelaties die beslist of hij de gezaghebber machtigt om tot
      verstrekking van een nooddocument over te gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0012811#Artikel5
