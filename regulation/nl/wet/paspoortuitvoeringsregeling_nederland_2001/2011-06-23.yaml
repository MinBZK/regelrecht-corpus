  - number: '37'
    text: |-
      1 De aanvrager kan de burgemeester verzoeken om een versnelde uitreiking van het aangevraagde reisdocument dan
      wel om een versnelde plaatsing van een bijschrijvingssticker in zijn reisdocument, mits hij aangeeft daarbij een
      dringend belang te hebben.

      2 Indien de aanvrager verzoekt om de versnelde uitreiking van het aangevraagde reisdocument dan wel om de versnelde
      plaatsing van een bijschrijvingssticker in zijn reisdocument, wordt in de aanvraag voor het reisdocument en in de
      eventuele aanvragen voor de gelijktijdige bijschrijving van kinderen in dat reisdocument dan wel in de aanvraag
      voor de bijschrijvingssticker, een vermelding opgenomen waaruit blijkt dat het een spoedopdracht betreft.

      3 In het geval van een spoedopdracht draagt de burgemeester er zorg voor dat de aanvraag nog dezelfde dag vóór
      16.00 uur de leverancier bereikt, opdat het uit te reiken reisdocument dan wel de te plaatsen bijschrijvingssticker
      de daarop volgende werkdag op het reguliere tijdstip, doch uiterlijk 16.00 uur, op de uitgiftelocatie kan worden
      afgeleverd.
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel37
  - number: '38'
    text: |-
      1 De daartoe aangewezen ambtenaar vergelijkt, behoudens in het in [artikel 30][ref1] bedoelde geval, nauwkeurig de
      overgelegde foto van de aanvrager dan wel van degene ten behoeve van wie de aanvraag wordt ingediend met de persoon
      die voor hem staat en brengt deze foto op de bestemde plaats in het foto- en handtekeningformulier aan.

      2 De in het eerste lid bedoelde ambtenaar ziet, behoudens in het in [artikel 29][ref2] bedoelde geval, er op toe
      dat in het foto- en handtekeningformulier op de bestemde plaats de duidelijk leesbare handtekening wordt geplaatst
      van de aanvrager dan wel van de persoon ten behoeve van wie de aanvraag van het reisdocument wordt gedaan.

      3 Het foto- en handtekeningformulier wordt door de in het eerste lid bedoelde ambtenaar met gebruikmaking van het
      aanvraagstation gedigitaliseerd.

      4 Het opnemen van de vingerafdrukken als bedoeld in [artikel 28a][ref3], geschiedt met gebruikmaking van het
      aanvraagstation. Indien de aanvrager op grond van [artikel 28, derde lid, van de wet][ref4] niet in persoon
      verschijnt, worden zijn vingerafdrukken opgenomen met behulp van het mobiel vingerafdrukopname-apparaat.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0012811#Artikel29
