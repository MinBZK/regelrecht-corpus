  - number: '72'
    text: |-
      1 Van elk verstrekt reisdocument respectievelijk van elke daarin opgenomen bijschrijving wordt een administratie
      bijgehouden.

      2 De in het eerste lid bedoelde reisdocumentenadministratie wordt bijgehouden in het reisdocumentenstation, voor
      zover het de daarin overeenkomstig de [artikelen 40][ref1] en [55][ref2] opgenomen gegevens betreft.

      3 De overige gegevens met betrekking tot de aanvraag, verstrekking en uitreiking worden als afzonderlijke
      documenten in de reisdocumentenadministratie opgenomen op een wijze die raadpleging in samenhang met de in het
      tweede lid bedoelde gegevens mogelijk maakt.

      4 De in de reisdocumentenadministratie opgenomen gegevens worden gedurende elf jaren na de datum van verstrekking
      van het betreffende reisdocument dan wel de opneming van de bijschrijving in een reisdocument bewaard.

      5 In afwijking van het vierde lid worden de in de reisdocumentenadministratie opgenomen vingerafdrukken, bedoeld
      in [artikel 28a][ref3], bewaard tot het moment dat de uitreiking van het aangevraagde reisdocument dan wel de reden
      voor het niet uitreiken daarvan, in het reisdocumentenstation is geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0012811#Artikel55
      [ref3]: https://wetten.overheid.nl/BWBR0012811#Artikel28a
