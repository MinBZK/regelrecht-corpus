  - number: '95'
    text: |-
      1 In het geval van ontvreemding dan wel vernietiging van reisdocumenten, bijschrijvingsstickers, apparatuur,
      programmatuur, opslagmedia, documentatie en overige materialen ten gevolge van inbraak, diefstal, verduistering,
      overvallen, brand of anderszins dient de met de uitvoering van de [wet][ref1] belaste autoriteit daarvan terstond
      aangifte te doen bij de plaatselijke politie en tevens terstond het agentschap BPR daarvan in kennis te stellen.

      2 De in het eerste lid bedoelde autoriteit zendt het agentschap BPR vervolgens binnen één werkdag, eventueel per
      fax, een schriftelijke kennisgeving waarin de navolgende gegevens zijn opgenomen:

      a. het tijdstip en de exacte toedracht van de ontvreemding of vernietiging;

      b. de nummers van de ontvreemde of vernietigde reisdocumenten en bijschrijvingsstickers, alsmede de daarin vermelde
      persoonsgegevens;

      c. de ontvreemde of vernietigde apparatuur, programmatuur, opslagmedia, documentatie en overige materialen met de
      eventueel daarop vermelde nummers.

      3 Zodra het door de plaatselijke politie opgemaakte proces-verbaal beschikbaar is, wordt daarvan een afschrift
      gezonden aan het agentschap BPR.


      [ref1]: https://wetten.overheid.nl/BWBR0005212
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0005212
  - number: '96'
    text: |-
      Onverminderd de eigen verantwoordelijkheid van de houder van een reisdocument ingevolge de [wet][ref1],
      draagt de burgemeester of de gezaghebber er bij wijze van faciliteit zorg voor dat de persoon, die blijkens de
      basisadministratie van zijn gemeente of openbare lichaam als ingezetene is ingeschreven en houder is van een
      reisdocument, waarvan de geldigheidsduur binnenkort zal verlopen, schriftelijk wordt gewezen op het verstrijken van
      de geldigheidstermijn, de verplichting het reisdocument in te leveren en de mogelijkheid om een nieuw reisdocument
      aan te vragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005212
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0005212
  - number: '97'
    text: |-
      1 De burgemeester of de gezaghebber die in verband met een handeling op grond van deze regeling enig Nederlands
      reis- of identiteitsdocument krijgt overgelegd, gaat aan de hand van de door de Minister van Binnenlandse Zaken
      en Koninkrijksrelaties verstrekte lijst van toetsingspunten na of met het desbetreffende reisdocument enige
      onregelmatigheid is gepleegd.

      2 Indien het vermoeden bestaat dat met een overgelegd reisdocument enige onregelmatigheid is gepleegd, wordt
      daarvan met gebruikmaking van modelformulier C5 melding gemaakt aan het Expertise Centrum Identiteitsfraude en
      Documenten van de Koninklijke Marechaussee.
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel97
  - number: '98'
    text: |-
      1 Indien het vermoeden bestaat dat de met het reisdocument gepleegde onregelmatigheden strafbare feiten opleveren
      en de vermoedelijke dader bekend is, wordt daarvan onder gelijktijdige overlegging van het desbetreffende
      reisdocument aangifte gedaan bij de plaatselijke politie. In het geval de vermoedelijke dader niet bekend is, wordt
      het desbetreffende reisdocument per aangetekende post met gebruikmaking van modelformulier C5 aan het Expertise
      Centrum Identiteitsfraude en Documenten van de Koninklijke Marechaussee gezonden.

      2 De burgemeester of de gezaghebber die van mening is dat met het reisdocument onregelmatigheden zijn gepleegd die
      geen strafbare feiten opleveren, onttrekt dit document op de in [artikel 67][ref1] bedoelde wijze definitief aan
      het verkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel67
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel98
