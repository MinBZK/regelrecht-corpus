  - number: '68'
    text: |-
      De definitieve onttrekking van een reisdocument, niet zijnde een nooddocument of een gevonden reisdocument, wordt
      geregistreerd in de basisadministratie van de gemeente of het openbaar lichaam waarin de houder als ingezetene
      is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel68
  - number: '69'
    text: |-
      Het ongedaan maken van een bijschrijving vindt plaats:

      a. door het plaatsen van het in [artikel 88, tweede lid][ref1], bedoelde stempel, voorzien van de paraaf van de
      burgemeester, de gezaghebber of de daartoe aangewezen ambtenaar over de tekst en de foto van de bijschrijving in
      het reisdocument, dan wel

      b. als gevolg van de definitieve onttrekking aan het verkeer van het reisdocument waarin de bijschrijving is
      opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel88
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '88'
        hoofdstuk: XI
        paragraaf: '4'
  - number: '70'
    text: |-
      Het ongedaan maken van een bijschrijving in een reisdocument, bedoeld in [artikel 69][ref1], wordt geregistreerd
      in de basisadministratie van de gemeente of het openbaar lichaam waarin de bijgeschrevene als ingezetene is
      ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel69
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel70
