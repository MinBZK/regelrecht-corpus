  - number: '81'
    text: |-
      1 De burgemeester of de door hem daartoe aangewezen ambtenaar wijst per uitgiftelocatie ten minste drie
      ambtenaren aan om zendingen van reisdocumenten, bijschrijvingsstickers, identificatiekaarten en foto- en
      handtekeningformulieren in ontvangst te nemen.

      2 De aanmelding, registratie en vervanging van de tot ontvangst bevoegde ambtenaren, bedoeld in het eerste lid,
      vindt plaats bij de distributeur, met gebruikmaking van de door de distributeur daartoe kosteloos beschikbaar
      gestelde postmachtiging.

      3 De postmachtiging wordt gewaarmerkt met een afdruk van een dienststempel als bedoeld in
      [artikel 88, eerste lid][ref1], en de handtekening van de burgemeester of de door hem daartoe aangewezen ambtenaar.

      4 De gemeente bewaart een kopie van het in het derde lid genoemde formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel88
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel81
