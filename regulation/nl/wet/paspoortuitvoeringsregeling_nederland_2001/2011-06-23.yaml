  - number: '90'
    text: |-
      De met de uitvoering van de wet belaste autoriteiten treffen maatregelen om de onder hen berustende reisdocumenten,
      bijschrijvingsstickers, apparatuur, programmatuur, opslagmedia, documentatie en overige materialen te beveiligen
      tegen ontvreemding dan wel vernietiging ten gevolge van inbraak, diefstal, verduistering, overvallen, brand of
      anderszins.
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel90
  - number: '91'
    text: |-
      1 Buiten de werkuren worden de van de leverancier ontvangen reisdocumenten, de ingehouden reisdocumenten,
      de bijschrijvingsstickers, de opslagmedia, de documentatie en de overige materialen opgeslagen in een
      inbraakvertragende en brandwerende voorziening, zoals een gesloten inbraakwerende waardekast of kluis, met een
      waardebergingsindicatie van € 1.000,-. Deze voorziening is in een af te sluiten ruimte geplaatst.

      2 De plaatsen waar de reisdocumenten, de bijschrijvingsstickers, de documentatie en de overige materialen zijn
      opgeslagen, alsmede de ruimte waarin de apparatuur en de programmatuur zich bevinden, zijn uitgerust met een
      electronisch inbraakalarmeringssysteem dat voorziet in een zogenoemde permanente vaste-lijn-verbinding met
      een door de rijksoverheid toegelaten alarmcentrale. Voor zover een openbaar lichaam niet beschikt over een
      inbraakalarmeringssysteem, bedoeld in de eerste zin van dit lid, dienen deze plaatsen en deze ruimte onder
      permanente fysieke (24-uurs) bewaking te staan.

      3 De apparatuur en programmatuur, alsmede de tijdens de werkuren uit te reiken of ingehouden reisdocumenten, de
      bijschrijvingsstickers en de te gebruiken documentatie en overige materialen bevinden zich, onder voortdurend
      toezicht, op een voor onbevoegden onbereikbare en afsluitbare plaats.

      4 In afwijking van het eerste lid blijft de authenticatiekaart ook tijdens de werkuren opgeslagen in de
      voorziening, bedoeld in het eerste lid. De authenticatiekaart mag zich uitsluitend buiten de desbetreffende
      voorziening bevinden op het moment dat deze nodig is om het mobiel vingerafdrukopname-apparaat in het locale
      netwerk van de uitgiftelocatie aan te sluiten.

      5 In afwijking van het tweede en derde lid, staat een aanvraagstation of een mobiel vingerafdrukopname-apparaat
      gedurende de werkuren onder voortdurend toezicht van degene die bevoegd is tot het gebruik ervan en bevindt het
      zich buiten de werkuren in een voor onbevoegden onbereikbare, afsluitbare en bij voorkeur beveiligde ruimte.
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel91
  - number: '92'
    text: |-
      1 Van de in de reisdocumentenmodule en de in het reisdocumentenstation opgeslagen gegevens wordt dagelijks een
      back-up gemaakt. Na het maken van de back-up wordt gecontroleerd of deze is geslaagd.

      2 De bewaring van de back-ups geschiedt zodanig, dat afwisselend een exemplaar op de uitgiftelocatie wordt
      bewaard in de voorziening, bedoeld in [artikel 91, eerste lid][ref1], terwijl een ander exemplaar elders wordt
      bewaard, in een vergelijkbare voorziening als bedoeld in [artikel 91, eerste lid][ref2], zodat tegelijkertijd twee
      opeenvolgende back-ups op verschillende plaatsen voorhanden zijn.

      3 De verstrekkende autoriteit beschikt over een op schrift gestelde procedure inzake back-up en herstel, die er in
      voorziet dat reconstructie van de gegevens mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0012811#Artikel91
