  - number: 100a
    text: |-
      1 Het verstrekken van een nooddocument kan uitsluitend geschieden ten behoeve van een aanvrager ten aanzien van
      wie, vanwege aantoonbare medische of humanitaire redenen, voldoende aannemelijk is dat zijn reis geen uitstel
      gedoogt, en die niet in staat moet worden geacht op tijd een ander geldig reisdocument te verkrijgen.

      2 In verband met het eerste lid wordt van de aanvrager overlegging van bescheiden verlangd waaruit de
      medische of humanitaire redenen en de spoedeisendheid van de reis kunnen worden afgeleid, zoals bewijzen van
      de noodzakelijkheid van een ziekenhuisopname van betrokkene, dan wel van ziekenhuisopname of overlijden van
      familieleden van betrokkene, uitnodigingen van officiële instanties, alsmede vervoersbewijzen of hotelreserveringen
      die met het voorgaande verband houden.
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel100a
  - number: 100b
    text: |-
      1 Een nooddocument is maximaal een jaar geldig.

      2 Bij het vaststellen van de geldigheidsduur wordt rekening gehouden met de duur van de reis, alsmede de door het
      land van bestemming en de landen van doorreis vereiste minimale geldigheid van het reisdocument na binnenkomst, dan
      wel vertrek van de houder.

      3 De territoriale geldigheid van een noodpaspoort omvat alle landen.

      4 De territoriale geldigheid van een laissez-passer omvat het land van bestemming en de landen waarvan de houder op
      zijn doorreis de grens passeert, behoudens het bepaalde in het vijfde lid.

      5 Indien de verstrekking van een laissez-passer geschiedt ten behoeve van een vreemdeling, omvat de territoriale
      geldigheid nimmer het land waarvan de houder de nationaliteit bezit.
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel100b
  - number: 100c
    text: |-
      1 Op het verkrijgen van de nodige zekerheid over de identiteit, de nationaliteit en, voor zover het een
      vreemdeling betreft, tevens de verblijfsrechtelijke positie van de aanvrager, zijn de [artikelen 9][ref1],
      [11][ref2] en [12, eerste en tweede lid][ref3], met uitzondering van onderdeel II, derde lid en
      [artikel 22, met uitzondering van het derde lid][ref4], van overeenkomstige toepassing.

      2 Indien de aanvrager als ingezetene is ingeschreven in een basisadministratie van een ander openbaar lichaam,
      in de basisadministratie van Aruba, Curaçao of Sint Maarten, dan wel in de gemeentelijke basisadministratie
      persoonsgegevens vindt zover mogelijk verificatie van diens identiteit, nationaliteit en verblijfsrechtelijke
      positie in die basisadministratie plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel9
