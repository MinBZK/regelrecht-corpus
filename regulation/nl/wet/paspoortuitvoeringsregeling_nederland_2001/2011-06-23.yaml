  - number: 100m
    text: |-
      1 De gezaghebber of de door hem daartoe aangewezen ambtenaar wijst ten minste drie ambtenaren aan om namens hem
      bestellingen te doen van blanco noodpaspoorten en laissez-passer's bij de leverancier en tevens drie ambtenaren om
      leveringen daarvan in ontvangst te nemen.

      2 De aanmelding van de tot bestelling en van de tot ontvangst bevoegde ambtenaren, bedoeld in het eerste
      lid, alsmede wijzigingen in deze gegevens, vindt plaats bij het agentschap BPR, met gebruikmaking van de
      standaardformulieren B6 en B7.

      3 Het ingevulde registratieformulier wordt gewaarmerkt met een afdruk van het in [artikel 88][ref1] bedoelde
      dienststempel.

      4 Het agentschap BPR houdt een registratie bij van de ingevolge het eerste lid aangemelde personen en geeft deze
      gegevens door aan de leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel88
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel100m
