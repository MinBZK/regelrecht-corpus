  - number: '77'
    text: |-
      1 Een burgemeester als genoemd in [artikel 7][ref1] geeft van de definitieve onttrekking aan het verkeer van
      een reisdocument, niet zijnde een nooddocument of een gevonden reisdocument, alsmede van de uitreiking van een
      vervangend reisdocument aan een persoon die niet als ingezetene in de basisadministratie is ingeschreven met
      gebruikmaking van modelformulier C3 kennis aan:

      a. de burgemeester of de gezaghebber, indien de houder laatstelijk in de basisadministratie van diens gemeente of
      openbaar lichaam als ingezetene was ingeschreven en het bepaalde onder b of c niet van toepassing is, dan wel

      b. de autoriteit in Aruba, Curaçao of Sint Maarten, indien deze het definitief aan het verkeer onttrokken
      reisdocument heeft verstrekt, dan wel

      c. het hoofd van de Nederlandse consulaire post in het buitenland, indien deze het definitief aan het verkeer
      onttrokken reisdocument heeft verstrekt en de houder ten tijde van die verstrekking niet in de basisadministratie
      als ingezetene was ingeschreven.

      2 Indien een burgemeester als genoemd in [artikel 7 ][ref2]door toezending van modelformulier C3 op de hoogte wordt
      gesteld van de definitieve onttrekking aan het verkeer van een door hem verstrekt reisdocument en de uitreiking van
      een vervangend reisdocument, neemt hij deze feiten op in zijn administratie als bedoeld in [artikel 74][ref3].

      3 Van de ongedaanmaking van een bijschrijving als bedoeld in [artikel 69][ref4] wordt met gebruikmaking van
      modelformulier C3 kennis gegeven aan de autoriteit bedoeld in het eerste lid onder a, b of c, die de bijschrijving
      heeft geplaatst, dan wel aan de burgemeester van de gemeente of de gezaghebber van het openbaar lichaam waar het
      bijgeschreven kind als ingezetene in de basisadministratie is, of voor het laatst was, ingeschreven, indien de
      bijschrijving niet door een in het eerste lid onder a, b of c genoemde autoriteit is geplaatst.

      4 Van de vermissing van een Nederlands reisdocument als bedoeld in de [artikelen 27][ref5], [52][ref6] en
      [60][ref7] wordt met gebruikmaking van modelformulier C7 melding gemaakt aan het agentschap BPR.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0012811#Artikel7
