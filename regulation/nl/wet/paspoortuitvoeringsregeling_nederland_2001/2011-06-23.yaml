        paragraaf: '5'
  - number: 100p
    text: |-
      1 De gezaghebber houdt een voorraadadministratie bij van de aan hem beschikbaar gestelde nooddocumenten.

      2 Uit de voorraadadministratie dient, uitgesplitst naar soort, aan de hand van de documentnummers te allen tijde te
      blijken hoeveel nooddocumenten:

      a. in de voorraad aanwezig zijn;

      b. aan de voorraad zijn toegevoegd;

      c. aan de voorraad zijn onttrokken in verband met uitreiking;

      d. zijn verschreven, gestolen, vermist of anderszins als onbruikbaar moeten worden beschouwd.

      3 Met betrekking tot de uitgereikte nooddocumenten wordt per opeenvolgend documentnummer apart geregistreerd aan
      wie uitreiking van het desbetreffende nooddocument heeft plaatsgevonden.

      4 De gezaghebber houdt de voorraadadministratie bij in het reisdocumentenstation.
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel100p
  - number: 100q
    text: |-
      1 Eén maal per jaar wordt het aantal in voorraad zijnde blanco nooddocumenten met vermelding van soort en
      documentnummer vastgesteld.

      2 Indien op enig moment een omissie in de voorraad of in de administratie wordt geconstateerd, maakt de gezaghebber
      terstond een inventarisatie op van de aanwezige nooddocumenten.

      3 De inventarisatie wordt opgesteld door tenminste twee personen.

      4 Van de inventarisatie wordt een proces-verbaal opgemaakt, dat naar het agentschap BPR wordt gezonden.
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel100q
  - number: 100r
    text: |-
      1 De blanco nooddocumenten worden in volgorde van de nummers verbruikt.

      2 Het is een tot verstrekking bevoegde autoriteit niet toegestaan nooddocumenten te verbruiken die aan een andere
      autoriteit daartoe ter beschikking zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel100r
  - number: 100s
    text: |-
      1 De gezaghebber verstrekt, met gebruikmaking van modelformulier C12, een keer per kwartaal een schriftelijke
      verantwoording van het totale voorraadverloop met betrekking tot nooddocumenten over het voorgaande jaar aan het
      agentschap BPR.

      2 Deze verantwoording bevat, uitgesplitst naar noodpaspoorten en laissez-passer's:

      a. de totale voorraad blanco nooddocumenten aan het begin van het kwartaal;

      b. de in de loop van het kwartaal aan de voorraad toegevoegde blanco nooddocumenten;

      c. de in de loop van het kwartaal aan de voorraad onttrokken nooddocumenten die zijn uitgereikt;

      d. de in de loop van het kwartaal aan de voorraad onttrokken nooddocumenten die niet zijn uitgereikt, omdat zij
      zijn verschreven, gestolen, vermist of anderszins als onbruikbaar moeten worden beschouwd;

      e. de totale voorraad blanco nooddocumenten aan het einde van het kwartaal.

      3 Nooddocumenten die onjuist blijken te zijn geproduceerd of beschadigd worden met het in het eerste lid bedoelde
      verantwoordingsformulier meegezonden aan de leverancier.

      4 Nooddocumenten die als gevolg van verschrijvingen of anderszins onbruikbaar zijn geworden, worden definitief aan
      het verkeer onttrokken door ze deugdelijk te vernietigen op de in [artikel 67, tweede lid][ref1], aangegeven wijze.

      5 Het in het eerste lid bedoelde verantwoordingsformulier wordt ondertekend door of namens de gezaghebber.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel67
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel100s
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '67'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: '101'
    text: |-
      De reisdocumenten die voor de inwerkingtreding van deze regeling zijn verstrekt, behouden de geldigheid die daarin
      is vermeld.
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel101
  - number: '102'
    text: |-
      1 Indien ingevolge [artikel 9][ref1] of [22][ref2] raadpleging moet plaatsvinden van gegevens, behorende bij een
      reisdocument dat is uitgereikt voor de inwerkingtreding van deze regeling, verstrekt de autoriteit bij wie de
      gegevens in de reisdocumentenadministratie berusten op verzoek van de autoriteit die de aanvraag in ontvangst neemt
      kosteloos het originele aanvraagformulier, behorende bij het desbetreffende reisdocument. Alvorens tot verstrekking
      van het originele aanvraagformulier wordt overgegaan, maakt de desbetreffende autoriteit daarvan een kopie die
      in zijn reisdocumentenadministratie wordt bewaard, waarop wordt aangetekend aan welke autoriteit het originele
      aanvraagformulier is verstrekt.

      2 Na vergelijking wordt het originele aanvraagformulier bewaard als onderdeel van de reisdocumentenadministratie,
      behorende bij het uitgereikte nieuwe reisdocument. Indien geen nieuw reisdocument wordt uitgereikt, zendt de
      autoriteit die de aanvraag in behandeling heeft genomen het originele aanvraagformulier terug naar de autoriteit
      die het heeft verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0012811#Artikel22
