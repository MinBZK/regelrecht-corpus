        hoofdstuk: III
        paragraaf: '1'
  - number: '53'
    text: |-
      De ten behoeve van de bijschrijving in een bestaand reisdocument vervaardigde bijschrijvingssticker wordt door de
      daartoe aangewezen ambtenaar op de daarvoor bestemde pagina in het reisdocument aangebracht.
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel53
  - number: '54'
    text: |-
      1 Uitsluitend indien op grond van [artikel 7][ref1] door een burgemeester als genoemd in [artikel 7][ref2] een
      reisdocument wordt verstrekt en de aanvrager bij de aanvraag aannemelijk heeft gemaakt dat van hem redelijkerwijs
      niet kan worden gevergd dat hij in persoon verschijnt bij de uitreiking, wordt het reisdocument per aangetekende
      post aan hem toegezonden.

      2 De inlevering van de Nederlandse reisdocumenten als bedoeld in [artikel 32 van de wet][ref3] geschiedt in dat
      geval door deze reisdocumenten per aangetekende post toe te sturen aan de in het eerste lid bedoelde autoriteit.

      3 Tot toezending van het uit te reiken reisdocument wordt niet overgegaan dan na ontvangst van de ingevolge het
      tweede lid toegestuurde reisdocumenten.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0012811#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005212#Artikel32
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel54
