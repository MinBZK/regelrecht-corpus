  - number: '47'
    text: |-
      1 Indien reisdocumenten of bijschrijvingsstickers niet op het verwachte tijdstip worden ontvangen, wordt op een
      speciaal daarvoor bestemd telefoonnummer informatie ingewonnen over de te verwachten levertijd.

      2 In het geval de zending zich nog onder de distributeur bevindt, draagt deze er zorg voor dat de zending alsnog de
      volgende dag wordt afgeleverd bij de uitgiftelocatie in het Europese deel van Nederland, onderscheidenlijk bij de
      Minister van Buitenlandse Zaken, indien de zending bestemd is voor een gezaghebber.

      3 In het geval reisdocumenten of bijschrijvingsstickers op een verkeerde uitgiftelocatie in het Europese deel van
      Nederland zijn afgeleverd, draagt de leverancier er zorg voor dat de desbetreffende documenten, zo mogelijk nog
      dezelfde dag, op de juiste uitgiftelocatie in het Europese deel van Nederland worden aangeboden.

      4 Het in ontvangst nemen van reisdocumenten of bijschrijvingsstickers als bedoeld in het derde lid geschiedt
      overeenkomstig bijlage D, met gebruikmaking van standaardformulier B4.

      5 In het geval de zending zich nog onder de transporteur bevindt, draagt deze er zorg voor dat de zending alsnog zo
      spoedig mogelijk wordt afgeleverd.
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel47
  - number: '48'
    text: |-
      Indien een reisdocument of een bijschrijvingssticker is beschadigd, onjuist is geproduceerd of
      gepersonaliseerd, dan wel niet op het verwachte tijdstip is ontvangen en niet alsnog ingevolge
      [artikel 47, tweede, derde of vijfde lid][ref1], zal worden bezorgd, wordt het op het reisdocument, op de daarin
      opgenomen bijschrijving of op de bijschrijvingssticker betrekking hebbende aanvraagbestand opnieuw verzonden aan
      de leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel47
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '47'
        hoofdstuk: IV
  - number: '49'
    text: |-
      Reisdocumenten en bijschrijvingsstickers die:

      a. bij de controle van de zending in het reisdocumentenstation dan wel bij de uitreiking onjuist blijken te zijn
      geproduceerd of gepersonaliseerd, dan wel blijken te zijn beschadigd;

      b. na het verwachte tijdstip zijn ontvangen en waarvan inmiddels het daarop betrekking hebbende aanvraagbestand
      ingevolge [artikel 48][ref1] opnieuw is verzonden, worden per aangetekende post, met gebruikmaking van
      modelformulier C10, teruggestuurd aan de leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel48
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '48'
        hoofdstuk: IV
  - number: '50'
    text: |-
      1 Tot uitreiking van het reisdocument of plaatsing van een bijschrijvingssticker wordt slechts overgegaan, nadat
      de identiteit van de aanvrager in zijn aanwezigheid is vastgesteld en de aanvrager de in het document weergegeven
      persoonsgegevens op juistheid heeft gecontroleerd, tenzij [artikel 28, derde lid, van de wet][ref1] van toepassing
      is.

      2 De plaatsing van een bijschrijvingssticker vindt plaats door dezelfde autoriteit die de aanvraag daartoe in
      ontvangst heeft genomen, tenzij [artikel 51][ref2] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0012811#Artikel51
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0012811
        artikel: '51'
        hoofdstuk: V
  - number: 50a
    text: |-
      1 Indien de tot uitreiking bevoegde ambtenaar twijfelt aan de identiteit van de aanvrager worden de vingerafdrukken
      van de aanvrager geverifieerd tegen de vingerafdrukken die in het uit te reiken reisdocument zijn opgenomen.

      2 Indien de verificatie niet slaagt, wordt het reisdocument niet uitgereikt.
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel50a
  - number: '51'
    text: |-
      1 Indien de aanvrager op het moment van de uitreiking in de basisadministratie van een andere gemeente als
      ingezetene is ingeschreven, wordt het document uitgereikt in die gemeente.

      2 Indien de aanvraag tot plaatsing van een bijschrijvingssticker is gedaan in de gemeente waar de aanvrager
      als ingezetene in de basisadministratie was ingeschreven en de aanvrager op het moment van de plaatsing als
      ingezetene is ingeschreven in de basisadministratie van een andere gemeente, geschiedt de plaatsing van de
      bijschrijvingssticker in die andere gemeente.

      3 Indien de aanvraag tot plaatsing van een bijschrijvingssticker is gedaan in de gemeente waar de bij te schrijven
      persoon als ingezetene in de basisadministratie was ingeschreven en deze persoon op het moment van de plaatsing
      als ingezetene is ingeschreven in de basisadministratie van een andere gemeente, geschiedt de plaatsing van de
      bijschrijvingssticker in die andere gemeente.

      4 Het reisdocument of de bijschrijvingssticker wordt per aangetekende post verstuurd naar het hoofd burgerzaken
      van de gemeente waar de aanvrager dan wel de bij te schrijven persoon inmiddels in de basisadministratie is
      ingeschreven.

      5 De burgemeester van de gemeente, bedoeld in het vierde lid, gaat tot uitreiking van het reisdocument of plaatsing
      van de bijschrijvingssticker over met in achtneming van [artikel 50][ref1]. De op de uitreiking betrekking hebbende
      gegevens worden geregistreerd in de basisadministratie van zijn gemeente.

      6 Van de uitreiking van het reisdocument of de plaatsing van de bijschrijvingssticker wordt met gebruikmaking van
      modelformulier C3 kennis gegeven aan de burgemeester van de gemeente waar de aanvraag in behandeling is genomen.

      7 De burgemeester die een kennisgeving ontvangt zoals bedoeld in het zesde lid registreert de uitreiking van het
      reisdocument of de plaatsing van de bijschrijvingssticker in het reisdocumentenstation en de reisdocumentenmodule,
      waarin de gegevens betreffende de aanvraag zijn vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel50
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel51
