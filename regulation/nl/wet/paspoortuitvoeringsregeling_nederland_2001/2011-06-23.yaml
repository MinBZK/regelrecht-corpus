  - number: '93'
    text: |-
      1 De verstrekkende autoriteit beschikt over een op schrift gestelde beveiligingsprocedure. In deze
      beveiligingsprocedure worden in ieder geval maatregelen vastgelegd inzake:

      a. de ontvangst, het transport, de bewaring en het beheer van de van de leverancier ontvangen reisdocumenten,
      de ingehouden reisdocumenten, de bijschrijvingsstickers, de apparatuur, de programmatuur, de documentatie en de
      overige materialen;

      b. de verantwoordelijkheden van de beveiligingsfunctionaris als bedoeld in het tiende lid;

      c. de functiescheiding tussen de bij de verstrekking, het beheer en de uitreiking van de reisdocumenten en
      bijschrijvingsstickers betrokken functionarissen;

      d. de beveiliging van het aanvraagsysteem reisdocumenten, onder meer gericht op het voorkomen van onbevoegde
      toegang of gebruik van gegevens die in het systeem of tot het systeem behorende opslagmedia zijn opgenomen.

      2 Indien het als gevolg van de omvang van het ambtelijk apparaat niet mogelijk is om te allen tijde te voldoen aan
      de in het eerste lid, onder c, gestelde eis van functiescheiding, kan daarvan met inachtneming van het derde en
      vierde lid, worden afgeweken.

      3 In de situatie, bedoeld in het tweede lid, wordt schriftelijk vastgelegd:

      a. de reden waarom tijdelijk niet aan de eis van functiescheiding kan worden voldaan;

      b. de periode waarin niet aan de eis van functiescheiding wordt voldaan;

      c. de namen van de ambtenaren die in de onder b bedoelde periode zijn belast met de verstrekking, het beheer en de
      uitreiking van de reisdocumenten en bijschrijvingsstickers.

      4 Na afloop van de periode, bedoeld in het derde lid, controleert de daartoe aangewezen ambtenaar, die in
      de desbetreffende periode niet betrokken is geweest bij de verstrekking, het beheer en de uitreiking van de
      reisdocumenten en bijschrijvingsstickers, of de schriftelijke vastlegging, bedoeld in het derde lid, aanwezig is
      en de verstrekking, het beheer en de uitreiking op de voorgeschreven wijze hebben plaatsgevonden. In het geval er
      sprake is van onregelmatigheden wordt gehandeld overeenkomstig [artikel 95][ref1].

      5 De burgemeester of de gezaghebber draagt zorg, dat de bij de uitvoering van de [wet][ref2] betrokken ambtenaren
      regelmatig worden geïnformeerd over ontvreemdingsrisico's en ten minste één maal per jaar worden geïnstrueerd met
      betrekking tot risicobeperkende afspraken en maatregelen terzake.

      6 De beveiligingsprocedure wordt jaarlijks geëvalueerd en zo nodig aangepast.

      7 Ten behoeve van het opstellen en evalueren van de beveiligingsprocedure wordt gebruik gemaakt van de door het
      Agentschap BPR daarvoor beschikbaar gestelde hulpmiddelen. Afwijkingen van de beveiligingsvoorschriften worden
      schriftelijk vastgelegd en ten minste vijf jaren naast de beveiligingsprocedure bewaard.

      8 De burgemeester of de gezaghebber wijst een beveiligingsfunctionaris aan die belast is met het beheer van en het
      toezicht op de naleving van de beveiligingsprocedure.

      9 Van de aanwijzing of de vervanging van de beveiligingsfunctionaris wordt terstond melding gedaan aan het
      agentschap BPR met gebruikmaking van standaardformulier B5.

      10 De functie van beveiligingsfunctionaris is niet verenigbaar met het verrichten van andere handelingen ter
      uitvoering van de [wet][ref3].

      11 De taken en verantwoordelijkheden van de beveiligingsfunctionaris worden vastgelegd in een functieomschrijving.

      12 De burgemeester of de gezaghebber draagt er zorg voor dat de beveiligingsfunctionaris in staat wordt gesteld
      alle handelingen te verrichten die uit zijn taak voortvloeien.

      13 De beveiligingsfunctionaris is rechtstreeks verantwoording verschuldigd aan de burgemeester of de gezaghebber.

      14 Indien bij de aanvraag geen gebruik wordt gemaakt van het aanvraagstation wordt in afwijking van het vierde lid
      als volgt gehandeld:

      a. In de periode, bedoeld in het derde lid, worden met betrekking tot de aangevraagde en uitgereikte reisdocumenten
      en bijschrijvingen de aanvraagformulieren bewaard en afschriften gemaakt van de gegevens die over deze documenten
      in het reisdocumentenstation zijn opgenomen.

      b. Na afloop van de periode, bedoeld in het derde lid, controleert de daartoe aangewezen ambtenaar, die in
      de desbetreffende periode niet betrokken is geweest bij de verstrekking, het beheer en de uitreiking van de
      reisdocumenten en bijschrijvingsstickers, of de schriftelijke vastlegging, bedoeld in het derde lid, alsmede de
      aanvraagformulieren en afschriften, bedoeld in onderdeel a, aanwezig zijn, en de verstrekking, het beheer en de
      uitreiking op de voorgeschreven wijze hebben plaatsgevonden. In het geval er sprake is van onregelmatigheden wordt
      gehandeld overeenkomstig [artikel 95][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel95
      [ref2]: https://wetten.overheid.nl/BWBR0005212
      [ref3]: https://wetten.overheid.nl/BWBR0005212
      [ref4]: https://wetten.overheid.nl/BWBR0012811#Artikel95
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel93
