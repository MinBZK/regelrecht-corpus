        artikel: '47'
      - id: ref2
        bwb_id: BWBR0005212
        artikel: '47'
  - number: '66'
    text: |-
      De burgemeester of de gezaghebber geeft van een gevonden reisdocument, niet zijnde een nooddocument, met
      gebruikmaking van modelformulier C4 terstond kennis aan het Expertise Centrum Identiteitsfraude en Documenten van
      de Koninklijke Marechaussee.
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel66
  - number: '67'
    text: |-
      1 De burgemeester of de gezaghebber onttrekt een nationaal paspoort, een Nederlandse identiteitskaart, een
      faciliteitenpaspoort, een tweede paspoort, een reisdocument voor vluchtelingen, een reisdocument voor vreemdelingen
      of een op grond van [artikel 16, eerste lid, van de wet][ref1] verstrekt nooddocument dat hij onder zich heeft
      terstond definitief aan het verkeer, indien:

      a. het niet binnen drie maanden, nadat het voor uitreiking beschikbaar is gesteld, door de aanvrager in ontvangst
      is genomen;

      b. het daartoe, al dan niet bij de uitreiking van een nieuw reisdocument, is ingeleverd;

      c. het vervallen is verklaard dan wel ingevolge [artikel 54, eerste lid, van de wet][ref2] is ingehouden, tenzij
      nog een beroepstermijn open staat, een beroepsprocedure aanhangig is of het reisdocument anderszins in een
      gerechtelijke procedure nodig is;

      d. het na uitreiking als onbruikbaar is beschouwd ten gevolge van misdruk, verkeerde personalisatie of de onjuiste
      plaatsing van de bijschrijvingssticker en dientengevolge is ingehouden of ingeleverd;

      e. het als gevonden reisdocument is ontvangen, tenzij hij in de gelegenheid is het terug te geven aan de in de
      basisadministratie van zijn gemeente of openbaar lichaam als ingezetene ingeschreven houder die nog geen verklaring
      als bedoeld in [artikel 31 van de wet][ref3] heeft afgelegd.

      2 Het reisdocument wordt definitief aan het verkeer onttrokken door het deugdelijk te vernietigen, dan wel het
      geheel of gedeeltelijk onbruikbaar gemaakt aan de houder terug te geven ingevolge het derde lid. De vernietiging
      geschiedt door het reisdocument op gecontroleerde wijze te verbranden of te versnipperen, zodat reconstructie van
      het reisdocument niet meer mogelijk is.

      3 Op verzoek van de houder wordt diens nationaal paspoort, Nederlandse identiteitskaart, faciliteitenpaspoort,
      tweede paspoort, reisdocument voor vluchtelingen of reisdocument voor vreemdelingen, na inlevering, onbruikbaar
      gemaakt aan hem teruggegeven.

      4 Het onbruikbaar maken geschiedt door het aanbrengen van drie ponsgaten (elk van tenminste 12 mm) door het gehele
      reisdocument op zodanige wijze dat het in het reisdocument aangebrachte kinegram gedeeltelijk en de aangebrachte
      chip geheel onbruikbaar worden gemaakt. Voordat het reisdocument wordt teruggegeven aan de houder, wordt
      gecontroleerd of de chip onbruikbaar is.

      5 Indien het ingeleverde reisdocument bladzijden met een nog geldig visum of een geldige verblijfstitel bevat
      en in verband daarmee het verzoek is gedaan, bedoeld in [artikel 26, derde lid][ref4], worden de desbetreffende
      bladzijden en het documentnummer intact gelaten.

      6 In afwijking van het tweede lid wordt een reisdocument, dat ingevolge het eerste lid, onder d, tengevolge van
      misdruk of verkeerde personalisatie is ingehouden of ingeleverd, definitief aan het verkeer onttrokken door het per
      aangetekende post, met gebruikmaking van modelformulier C10, terug te sturen aan de leverancier.

      7 De in het eerste lid, onder e, en in het derde lid bedoelde teruggave van een reisdocument vindt niet plaats,
      indien het reisdocument op grond van [artikel 47, eerste lid, onder a, b, c, g of h, van de wet][ref5] van
      rechtswege is vervallen, op grond van [54, eerste lid, onder b, c en e, van de wet][ref6] is ingehouden, dan wel
      [artikel 97, tweede lid][ref7], of [artikel 98, tweede lid][ref8], van toepassing is.

      8 Een bijschrijvingssticker die niet binnen drie maanden na ontvangst bij de uitgiftelocatie in het daartoe
      bestemde reisdocument is aangebracht, wordt op de in het tweede lid aangegeven wijze deugdelijk vernietigd.


