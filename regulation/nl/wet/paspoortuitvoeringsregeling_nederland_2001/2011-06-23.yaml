        artikel: '50'
        hoofdstuk: V
  - number: '52'
    text: |-
      1 Indien het bij de uitreiking van het aangevraagde reisdocument in te leveren reisdocument is vermist of op andere
      gronden dan ingevolge de wet door een daartoe bevoegde autoriteit is ingenomen, wordt dit gegeven, alsmede het
      nummer van het desbetreffende reisdocument en de autoriteit die het heeft verstrekt, alsnog in de aanvraag met
      betrekking tot het uit te reiken reisdocument opgenomen. Indien deze gegevens op het moment van de uitreiking niet
      voorhanden zijn, wordt hiernaar een gericht onderzoek ingesteld.

      2 [Artikel 27, tweede tot en met zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel27
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel52
