  - number: '94'
    text: |-
      1 De burgemeester of de gezaghebber voert een keer per jaar een controle uit op de toepassing van de
      beveiligingsmaatregelen, genoemd in de [artikelen 90 tot en met 93][ref1].

      2 Bij de controle en de verslaglegging wordt gebruik gemaakt van de daarvoor door het agentschap BPR beschikbaar
      gestelde hulpmiddelen.

      3 De burgemeester of de gezaghebber laat een keer per drie jaar een onderzoek uitvoeren door een
      deskundige met kennis van zaken op het terrein van auditing, die niet betrokken is of is geweest bij de
      beleidsvoorbereiding, planvorming of feitelijke uitvoering van de reisdocumentuitgifte of daarmee verband houdende
      beveiligingsmaatregelen in de gemeente of in het openbaar lichaam. Het onderzoek heeft betrekking op de wijze
      waarop uitvoering is gegeven aan het eerste en tweede lid, alsmede op de werking van beveiligingsmaatregelen in
      de praktijk.

      4 De deskundige voert het onderzoek uit aan de hand van het onderzoeksprotocol en de toepasselijke vragenlijst
      zoals die zijn opgenomen in [bijlage K][ref2]. Voor het invullen van de vragenlijst wordt gebruik gemaakt van de
      daartoe door het agentschap BPR beschikbaar gestelde internetfaciliteiten. Met behulp van deze internetfaciliteiten
      wordt tevens de definitieve versie van de ingevulde vragenlijst op elektronische wijze aan het agentschap BPR
      toegezonden.

      5 De burgemeester of de gezaghebber biedt de elektronische versie van de ingevulde vragenlijst, bedoeld in het
      vierde lid, door middel van een aanbiedingsbrief volgens [modelformulier C13][ref3] aan het agentschap BPR aan,
      vergezeld van een door de deskundige ondertekende schriftelijke verklaring volgens [modelformulier C14][ref4],
      waarin wordt vermeld dat deze instaat voor de juistheid van de in het kader van het onderzoek verstrekte gegevens.

      6 Het agentschap BPR kan in aanvulling op het in het derde lid bedoelde onderzoek steekproefsgewijze een nader
      onderzoek uitvoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel90
      [ref2]: https://wetten.overheid.nl/BWBR0012811
      [ref3]: https://wetten.overheid.nl/BWBR0012811
      [ref4]: https://wetten.overheid.nl/BWBR0012811
