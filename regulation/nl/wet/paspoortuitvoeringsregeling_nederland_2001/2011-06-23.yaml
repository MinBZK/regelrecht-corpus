  - number: '39'
    text: |-
      1 Een aanvraag waarbij niet is voldaan aan het bepaalde in de [artikelen 9 tot en met 38][ref1] wordt niet in
      behandeling genomen.

      2 Indien de daartoe aangewezen ambtenaar, met inachtneming van het bij of krachtens de wet bepaalde, heeft beslist
      dat het aangevraagde reisdocument kan worden uitgereikt dan wel de aangevraagde bijschrijving kan plaatsvinden,
      worden in de aanvraag vermeld het feit van deze verstrekking, de datum van deze verstrekking en de datum waarop de
      geldigheidsduur van het uit te reiken reisdocument eindigt.

      3 In de aanvraag voor een reisdocument waarbij sprake is van een weigering of vervallenverklaring wordt,
      afhankelijk van de genomen beslissing, vermeld voor welke landen het reisdocument geldig is.

      4 In de aanvraag voor een reisdocument voor vluchtelingen dan wel een reisdocument voor vreemdelingen wordt,
      afhankelijk van de nationaliteit van de persoon aan wie het reisdocument wordt uitgereikt, aangegeven welk land van
      de territoriale geldigheid is uitgesloten.

      5 In de aanvraag voor een reisdocument voor vreemdelingen, uit te reiken aan een staatloze, wordt aangegeven dat
      diens status van staatloze in het reisdocument moet worden vermeld.

      6 De daartoe aangewezen ambtenaar vermeldt in de aanvraag de verstrekkende autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel9
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel39
