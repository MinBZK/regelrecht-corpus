        artikel: '88'
        hoofdstuk: XI
        paragraaf: '4'
  - number: '82'
    text: |-
      1 De gezaghebber of de door hem daartoe aangewezen ambtenaar wijst ten minste drie ambtenaren aan om zendingen van
      gepersonaliseerde documenten in ontvangst te nemen.

      2 De aanmelding, registratie en vervanging van de tot ontvangst bevoegde ambtenaren, bedoeld in het eerste lid,
      vindt plaats bij de transporteur.
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel82
  - number: '83'
    text: |-
      1 De burgemeester dan wel de gezaghebber, of de door hem daartoe aangewezen ambtenaar meldt met gebruikmaking van
      standaardformulier B2 aan het agentschap BPR de aanvraagstationlocatie in zijn gemeente of openbare lichaam waar
      één of meerdere aanvraagstations zijn geplaatst alsmede de uitgiftelocatie waar de verzending van de aanvragen naar
      de leverancier en de aflevering van de zendingen door de distributeur of de transporteur plaatsvindt.

      2 Indien in de gemeente of het openbaar lichaam gebruik wordt gemaakt van meerdere aanvraagstationlocaties en
      uitgiftelocaties als bedoeld in het eerste lid, worden deze locaties, mits de beveiliging daarvan voldoet aan
      de beveiligingseisen als bedoeld in [hoofdstuk XII][ref1], op de in het eerste lid aangegeven wijze, eveneens
      aangemeld.

      3 Wijzigingen met betrekking tot aanvraagstationlocaties en uitgiftelocaties worden, met gebruikmaking van
      standaardformulier B2, uiterlijk drie maanden voor het tijdstip waarop de wijziging ingaat, gemeld aan het
      agentschap BPR.

      4 Het agentschap BPR houdt een registratie bij van de ingevolge het eerste, tweede en derde lid aangemelde
      aanvraagstationlocaties en uitgiftelocaties en geeft deze gegevens door aan de leverancier.

      5 De leverancier wijst aan elke uitgiftelocatie een unieke locatiecode toe en meldt deze terug aan het agentschap
      BPR en aan de burgemeester dan wel de gezaghebber.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#HoofdstukXII
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0012811
        hoofdstuk: XII
  - number: '84'
    text: |-
      1 De burgemeester of de door hem daartoe aangewezen ambtenaar spreekt met het bestelkantoor het tijdstip af waarop
      de zending wordt afgeleverd.

      2 De vastlegging van de tijdstippen waarop een zending in een openbaar lichaam wordt afgeleverd, geschiedt in
      overleg met de transporteur.
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel84
  - number: '85'
    text: |-
      1 De reisdocumenten en bijschrijvingsstickers worden bewaard op de in [artikel 91][ref1] voorgeschreven wijze tot
      het tijdstip dat zij worden uitgereikt, dan wel:

      a. indien het een gemeente betreft, worden opgehaald door de leverancier ingevolge [artikel 46][ref2] of per
      aangetekende post worden verstuurd ingevolge [artikel 49][ref3] of [51][ref4];

      b. indien het een openbaar lichaam betreft, per aangetekende post, met gebruikmaking van modelformulier C10, worden
      teruggestuurd aan de leverancier.

      2 Aan de hand van de gegevens in het reisdocumentenstation wordt nagegaan welke reisdocumenten en
      bijschrijvingsstickers langer dan drie maanden na de datum van verstrekking nog niet zijn uitgereikt, teneinde deze
      ingevolge [artikel 67][ref5] definitief aan het verkeer te onttrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel91
