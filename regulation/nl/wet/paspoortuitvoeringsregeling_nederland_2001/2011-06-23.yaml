  - number: 43a
    text: |-
      1 De gepersonaliseerde reisdocumenten, bijschrijvingsstickers en identificatiekaarten die bestemd zijn
      voor de openbare lichamen, worden in Nederland bij het ministerie van Buitenlandse Zaken afgeleverd. De
      [artikelen 57 tot en met 60 van de Paspoortuitvoeringsregeling Buitenland 2001][ref1] zijn van overeenkomstige
      toepassing.

      2 De in het eerste lid bedoelde documenten worden door de transporteur afgeleverd bij de uitgiftelocatie in de
      openbare lichamen.

      3 Op de uitgiftelocatie worden de in het eerste lid bedoelde documenten in ontvangst genomen door een
      daartoe aangewezen ambtenaar als bedoeld in artikel 81a, eerste lid, die zich legitimeert met een geldig
      identiteitsdocument.

      4 De aflevering van de zending vindt plaats op het voor de desbetreffende uitgiftelocatie afgesproken tijdstip.

      5 Indien de persoon die de zending in ontvangst neemt zich desgevraagd niet of niet voldoende kan legitimeren dan
      wel onvoldoende zekerheid bestaat met betrekking tot zijn bevoegdheid om de zending in ontvangst te nemen, dan
      wel om enige andere reden door een handelen of nalaten van de bevoegde autoriteit een veilige aflevering op de
      uitgiftelocatie niet mogelijk is, wordt de zending niet overgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel57
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '57'
  - number: '44'
    text: |-
      1 De tot ontvangst bevoegde ambtenaar controleert in het bijzijn van de besteller of de zending voor hem bestemd
      is. Indien dit het geval is en het pakket is onbeschadigd, tekent de tot ontvangst bevoegde ambtenaar de door de
      besteller overgelegde distributielijst voor ontvangst.

      2 Indien de zending niet voor de uitgiftelocatie bestemd is, afwijkingen vertoont, beschadigd is dan wel documenten
      ontbreken wordt gehandeld overeenkomstig bijlage D. Het in kennis stellen van de leverancier geschiedt met
      gebruikmaking van modelformulier C9.

      3 Bij de constatering dat het pakket beschadigd is, wordt het pakket in het bijzijn van de besteller in een voor
      het publiek afgesloten ruimte gecontroleerd. Ook in geval van beschadiging wordt het pakket in ontvangst genomen.

      4 Indien de tot ontvangst bevoegde ambtenaar vaststelt dat er documenten zijn beschadigd of ontbreken, wordt
      hiervan door de besteller een proces-verbaal opgemaakt.

      5 Het afschrift van het proces-verbaal wordt door de autoriteit bewaard.
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel44
  - number: '45'
    text: |-
      1 De daartoe aangewezen ambtenaar gaat na of de in de zending aanwezige documenten overeenkomen met de
      aanvraagnummers in het op de zending betrekking hebbende elektronische bericht in het reisdocumentenstation, dat
      door de leverancier is verzonden.

      2 In het reisdocumentenstation wordt geregistreerd of een reisdocument of bijschrijvingssticker overeenkomstig de
      opgave in het elektronisch bericht, bedoeld in het eerste lid, is ontvangen, al dan niet is beschadigd en op de
      juiste wijze is geproduceerd of gepersonaliseerd. Deze gegevens kunnen in verband met de raadpleging daarvan tevens
      op elektronische wijze worden doorgegeven aan de reisdocumentenmodule.
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel45
  - number: '46'
    text: |-
      1 De reisdocumenten of bijschrijvingsstickers, die na de controle van de zending als bedoeld in artikel 44 of
      45 in een gemeente voor een andere burgemeester blijken te zijn bestemd, worden op de uitgiftelocatie op de in
      [artikel 91][ref1] aangegeven wijze opgeslagen tot ze worden opgehaald door de leverancier.

      2 Het overdragen van de verkeerd geleverde documenten aan de leverancier geschiedt overeenkomstig
      [bijlage D][ref2], met gebruikmaking van standaardformulier B4.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0012811
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel46
