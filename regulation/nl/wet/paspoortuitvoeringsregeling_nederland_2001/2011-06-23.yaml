        artikel: '69'
        hoofdstuk: VIII
        paragraaf: '2'
  - number: '71'
    text: |-
      1 Van de definitieve onttrekking aan het verkeer van een reisdocument, niet zijnde een nooddocument of een gevonden
      reisdocument, alsmede van de uitreiking van een vervangend reisdocument, wordt met gebruikmaking van modelformulier
      C3 kennis gegeven aan:

      a. het hoofd van de Nederlandse consulaire post in het buitenland, indien deze het reisdocument heeft verstrekt,
      dan wel

      b. een burgemeester als genoemd in [artikel 7][ref1], indien deze autoriteit het reisdocument heeft verstrekt aan
      een houder die ten tijde van de verstrekking niet als ingezetene in een basisadministratie was ingeschreven, dan
      wel

      c. de autoriteit in Aruba, Curaçao of Sint Maarten, die het reisdocument heeft verstrekt, dan wel

      d. de burgemeester van de gemeente of de gezaghebber van het openbaar lichaam waar de houder als ingezetene in
      de basisadministratie is, of voor het laatst was ingeschreven, indien het definitief aan het verkeer onttrokken
      reisdocument niet door een in a, b of c genoemde autoriteit is verstrekt.

      2 Van de ongedaanmaking van een bijschrijving als bedoeld in [artikel 69][ref2] wordt met gebruikmaking van
      modelformulier C3 kennis gegeven aan de autoriteit bedoeld in het eerste lid, onder a, b of c, die de bijschrijving
      heeft geplaatst, dan wel aan de burgemeester van de gemeente of de gezaghebber van het openbaar lichaam waar het
      bijgeschreven kind als ingezetene in de basisadministratie is, of voor het laatst was, ingeschreven, indien de
      bijschrijving niet door een in het eerste lid onder a, b of c genoemde autoriteit is geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0012811#Artikel69
