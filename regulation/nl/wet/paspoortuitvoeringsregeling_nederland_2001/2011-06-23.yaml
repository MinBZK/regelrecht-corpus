  - number: '75'
    text: |-
      1 De burgemeester of de gezaghebber die door toezending van modelformulier C3 een kennisgeving ontvangt van:

      a. de definitieve onttrekking aan het verkeer van een reisdocument en de uitreiking van een vervangend
      reisdocument, waarbij is vermeld of het oude reisdocument is ingehouden, ingeleverd of vermist, dan wel

      b. de uitreiking van een reisdocument, waarbij definitieve onttrekking aan het verkeer van een eerder verstrekt
      reisdocument niet aan de orde is, dan wel

      c. de definitieve onttrekking van een reisdocument, waarbij geen nieuw reisdocument is uitgereikt, dan wel

      d. het ongedaan maken van een bijschrijving in een reisdocument, draagt zorg dat deze feiten worden geregistreerd
      in de basisadministratie, waarin de betrokken persoon als ingezetene is ingeschreven.

      2 De burgemeester of de gezaghebber die een in het eerste lid bedoelde kennisgeving ontvangt betreffende een
      persoon die laatstelijk in de basisadministratie van zijn gemeente of openbaar lichaam als ingezetene was
      ingeschreven, bewaart deze kennisgeving als onderdeel van de basisadministratie tot het moment dat de betrokken
      persoon weer als ingezetene in een basisadministratie wordt ingeschreven, dan wel elf jaren zijn verstreken.

      3 De in het eerste en tweede lid bedoelde registratie vindt niet plaats, indien de feiten betrekking hebben op een
      nooddocument of een gevonden reisdocument.

      4 De autoriteit die ten onrechte een kennisgeving als bedoeld in het eerste lid heeft ontvangen, zendt deze door
      aan de burgemeester van de gemeente of de gezaghebber van het openbaar lichaam waar de betrokken persoon als
      ingezetene in de basisadministratie is, of voor het laatst was, ingeschreven.

      5 Indien een persoon wederom als ingezetene in een basisadministratie wordt ingeschreven, wordt een in de
      tussentijd gezonden kennisgeving als bedoeld in het eerste lid opgevraagd bij de burgemeester van de gemeente of de
      gezaghebber van het openbaar lichaam waar de betrokken persoon laatstelijk als ingezetene in de basisadministratie
      was ingeschreven.
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel75
  - number: '76'
    text: |-
      1 Een burgemeester als genoemd in [artikel 7][ref1] verschaft zich, zoveel mogelijk overeenkomstig het bepaalde in
      het [tweede][ref2] en [derde hoofdstuk][ref3], de nodige zekerheid over de identiteit en de nationaliteit van een
      aanvrager, die stelt niet als ingezetene in de basisadministratie te zijn ingeschreven, aan de hand van het door de
      aanvrager overgelegde reisdocument en eventuele andere bewijsstukken.

      2 Indien onvoldoende zekerheid bestaat over de juistheid van de door de aanvrager gedane mededeling dat hij
      niet als ingezetene in de basisadministratie is ingeschreven, dan wel over de identiteit of de nationaliteit van
      de aanvrager, wordt de betrokken persoon, indien deze op korte termijn over een reisdocument moet beschikken,
      doorverwezen naar een autoriteit die bevoegd is tot de verstrekking van nooddocumenten.

      3 De vaststelling van de identiteit en de nationaliteit van de echtgenoot, echtgenote of geregistreerd partner dan
      wel de gewezen echtgenoot, echtgenote of geregistreerd partner van de aanvrager, respectievelijk van een wettelijke
      vertegenwoordiger die een verklaring van toestemming moet overleggen, geschiedt op de in het eerste en tweede lid
      vermelde wijze, voor zover de betrokken persoon niet als ingezetene in een basisadministratie is ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0012811#HoofdstukII
      [ref3]: https://wetten.overheid.nl/BWBR0012811#HoofdstukIII
