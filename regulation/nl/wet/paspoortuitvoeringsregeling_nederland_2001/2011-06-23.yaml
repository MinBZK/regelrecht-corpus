  - number: '86'
    text: |-
      1 Indien op enig moment een reisdocument of bijschrijvingssticker na aflevering en registratie daarvan in het
      reisdocumentenstation blijkt te ontbreken, wordt terstond een inventarisatie opgemaakt van de nog aanwezige
      reisdocumenten of bijschrijvingsstickers aan de hand van de gegevens in het reisdocumentenstation.

      2 De ontbrekende reisdocumenten en bijschrijvingsstickers worden geregistreerd in het reisdocumentenstation.

      3 [Artikel 48][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel48
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel86
