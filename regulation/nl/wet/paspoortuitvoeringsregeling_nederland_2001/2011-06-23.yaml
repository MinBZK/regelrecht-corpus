  - number: '34'
    text: |-
      1 Voor het verkrijgen van de nodige zekerheid over de identiteit van het bij te schrijven kind en over het gegeven
      of deze, evenals de houder van het reisdocument waarin de bijschrijving wordt verzocht, Nederlander dan wel
      vreemdeling is, wordt gebruik gemaakt van het door de aanvrager overgelegde reisdocument, alsmede van de gegevens
      die in de basisadministratie van de gemeente of het openbaar lichaam waar de aanvraag in ontvangst wordt genomen,
      zijn vermeld.

      2 Indien het bij te schrijven kind niet als ingezetene in de basisadministratie van de gemeente waar de aanvraag in
      ontvangst wordt genomen, is ingeschreven, worden de in het eerste lid bedoelde gegevens geverifieerd:

      a. in de gemeente waar het bij te schrijven kind als ingezetene in de basisadministratie is ingeschreven, dan wel

      b. aan de hand van de bewijsstukken die, door degene die het verzoek tot bijschrijving doet, worden overgelegd,
      indien het bij te schrijven kind niet als ingezetene in enige basisadministratie van een gemeente is ingeschreven.

      3 Indien het bij te schrijven kind niet als ingezetene in de basisadministratie van het openbaar lichaam waar de
      aanvraag in ontvangst wordt genomen, is ingeschreven, worden de in het eerste lid bedoelde gegevens geverifieerd:

      a. in het openbaar lichaam waar het bij te schrijven kind als ingezetene in de basisadministratie is ingeschreven,
      dan wel

      b. aan de hand van de bewijsstukken die, door degene die het verzoek tot bijschrijving doet, worden overgelegd,
      indien het bij te schrijven kind niet als ingezetene in enige basisadministratie van een openbaar lichaam is
      ingeschreven.

      4 Indien onzekerheid blijft bestaan over de juistheid van de in het eerste lid bedoelde gegevens, wordt daarnaar
      een gericht onderzoek ingesteld. Dit onderzoek omvat zoveel mogelijk verificatie met behulp van door de aanvrager
      over te leggen documenten die zijn afgegeven door een bevoegde autoriteit, waaronder de geboorteakte van het bij
      te schrijven kind, en eventuele andere bewijsstukken. Tevens worden in dat geval nadere identificerende vragen
      gesteld.

      5 In de aanvraag wordt vermeld of de identiteit van het bij te schrijven kind is vastgesteld en met welke
      documenten of andere bewijsstukken de identiteitsvaststelling heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel34
  - number: '35'
    text: |-
      1 In de aanvraag voor een bijschrijving worden de volgende persoonsgegevens van het bij te schrijven kind vermeld:

      a. geslachtsnaam en voornamen;

      b. geboortedatum en geboorteplaats;

      c. adres en woonplaats;

      d. geslacht.

      2 De in het eerste lid bedoelde gegevens worden geverifieerd in de basisadministratie waarin het bij te schrijven
      kind als ingezetene is ingeschreven. [Artikel 34, tweede en derde lid][ref1], is van overeenkomstige toepassing.

      3 In de aanvraag wordt de datum vermeld waarop de geldigheidsduur eindigt van het reisdocument waarin de
      bijschrijving zal plaatsvinden.

      4 [Artikel 23, derde tot en met zevende lid][ref2] en de [artikelen 26][ref3], [28][ref4] en [30][ref5] zijn van
      overeenkomstige toepassing.


