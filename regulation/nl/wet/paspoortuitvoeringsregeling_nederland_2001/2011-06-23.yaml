  - number: '17'
    text: |-
      1 Aan een staatloze persoon die op grond van de [Wet betreffende de positie van Molukkers][ref1] als Nederlander
      wordt behandeld, wordt op zijn verzoek binnen de grenzen bij de [wet][ref2] bepaald een faciliteitenpaspoort
      verstrekt.

      2 Indien onzekerheid bestaat over de behandeling als Nederlander van de aanvrager, wordt daarnaar een gericht
      onderzoek ingesteld. Dit onderzoek omvat zoveel mogelijk verificatie van de behandeling als Nederlander met behulp
      van door de aanvrager over te leggen documenten die zijn afgegeven door een bevoegde autoriteit, waaronder zijn
      geboorteakte, en eventuele andere bewijsstukken.


      [ref1]: https://wetten.overheid.nl/BWBR0003052
      [ref2]: https://wetten.overheid.nl/BWBR0005212
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003052
      - id: ref2
        bwb_id: BWBR0005212
  - number: '18'
    text: |-
      1 Een faciliteitenpaspoort is geldig voor vijf jaren en voor alle landen.

      2 Indien als gevolg van een tijdelijke verhindering bij de aanvrager geen vingerafdrukken in het document worden
      opgenomen, bedraagt in afwijking van het eerste lid, de geldigheidsduur van het betreffende reisdocument één jaar.
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel18
  - number: '19'
    text: |-
      1 Ingevolge [artikel 30, eerste lid, van de wet][ref1] kan een tweede paspoort worden verstrekt op verzoek van
      houders van een nationaal paspoort, die aantonen dat zij voor zakelijke of beroepsmatige redenen:

      a. in een reis achtereenvolgens verschillende landen moeten bezoeken waarbij zij de gerede kans lopen dat hun
      toelating tot een land op problemen zal stuiten, omdat uit het daartoe over te leggen nationaal paspoort blijkt dat
      zij eerder in een ander land zijn geweest, dan wel

      b. regelmatig dringend moeten reizen op een tijdstip dat hun nationaal paspoort zich in verband met visering bij
      een buitenlandse vertegenwoordiging bevindt.

      2 De Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt na overleg met de Minister van Buitenlandse Zaken
      een overzicht op van de in het eerste lid, onder a, bedoelde landen.

      3 Bij de aanvraag dient het oorspronkelijke paspoort en het eventueel eerder uitgereikte tweede paspoort te worden
      overgelegd.

      4 In afwijking van het derde lid kan bij de aanvraag worden volstaan met afschriften van de houderpagina en van
      alle bestempelde visumbladzijden van het oorspronkelijke paspoort en het eventueel eerder uitgereikte tweede
      paspoort, indien de aanvrager met een door een buitenlandse vertegenwoordiging verstrekte verklaring of ander
      schriftelijk bewijs kan aantonen, dat het over te leggen reisdocument zich op dat moment in verband met visering
      bij de desbetreffende buitenlandse vertegenwoordiging bevindt.

      5 Indien bij de aanvraag blijkt dat de geldigheidsduur van het oorspronkelijke paspoort binnen zes maanden zal
      verstrijken, wordt de beslissing op de aanvraag pas genomen nadat het oorspronkelijke paspoort is vervangen door
      een nieuw nationaal paspoort.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel30
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '30'
  - number: '20'
    text: |-
      1 Een tweede paspoort is geldig voor twee jaren en voor alle landen.

      2 Indien als gevolg van een tijdelijke verhindering bij de aanvrager geen vingerafdrukken in het document worden
      opgenomen, bedraagt in afwijking van het eerste lid, de geldigheidsduur van het betreffende reisdocument één jaar.
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel20
  - number: '21'
    text: |-
      1 De gegevens voor de aanvraag van een reisdocument worden opgenomen met behulp van de reisdocumentenmodule en
      het aanvraagstation.

      2 In de aanvraag wordt de in [artikel 83][ref1] bedoelde locatiecode, behorende bij de uitgiftelocatie, vermeld.

      3 In de aanvraag wordt aangegeven op welk model reisdocument deze betrekking heeft.

      4 In de aanvraag wordt het aantal gelijktijdig in het reisdocument bij te schrijven kinderen vermeld.

      5 In de aanvraag wordt het aanvraagnummer vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel83
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '83'
        hoofdstuk: XI
        paragraaf: '2'
  - number: '22'
    text: |-
      1 Voor het verkrijgen van de nodige zekerheid over de identiteit van de aanvrager wordt gebruik gemaakt van
      het door de aanvrager overgelegde Nederlandse reisdocument, alsmede van de gegevens die over de aanvrager in de
      basisadministratie zijn opgenomen.

      2 Indien de aanvrager niet in staat is een eerder uitgereikt Nederlands reisdocument over te leggen, de in het
      overgelegde reisdocument vermelde gegevens afwijken van de gegevens die over de aanvrager in de basisadministratie
      zijn opgenomen, dan wel anderszins onvoldoende zekerheid bestaat over de identiteit van de aanvrager, worden de in
      de reisdocumentenadministratie opgenomen gegevens behorende bij het eerder aan betrokkene uitgereikte reisdocument,
      niet zijnde een nooddocument, geraadpleegd. Tevens worden in dat geval nadere identificerende vragen gesteld.

      3 Berusten de in het tweede lid bedoelde gegevens bij een andere autoriteit, dan wordt deze verzocht om kosteloze
      verstrekking van een afschrift van de gevraagde gegevens uit de reisdocumentenadministratie. In de aanvraag wordt
      vermeld bij welke autoriteit de gegevens zijn opgevraagd.

      4 In afwijking van het tweede en het derde lid kan bij vermissing van een eerder uitgereikt reisdocument
      het raadplegen van de gegevens uit de reisdocumentenadministratie achterwege blijven, indien de identiteit
      van de aanvrager met voldoende zekerheid kan worden vastgesteld aan de hand van een ander op grond van
      [artikel 30 van de wet][ref1] aan de aanvrager uitgereikt geldig reisdocument.

      5 De aanvrager aan wie niet eerder een Nederlands reisdocument is verstrekt, dient bij zijn aanvraag andere
      identiteitsdocumenten die voorzien zijn van zijn foto en handtekening over te leggen. Indien hij dergelijke
      documenten niet kan overleggen of ondanks overlegging van deze documenten twijfel blijft bestaan over zijn
      identiteit, wordt daarnaar een gericht onderzoek ingesteld. Dit onderzoek omvat zoveel mogelijk verificatie van
      de identiteit met behulp van door de aanvrager over te leggen documenten die zijn afgegeven door een bevoegde
      autoriteit, waaronder zijn geboorteakte, en eventuele andere bewijsstukken.

      6 In de aanvraag wordt vermeld dat de identiteit van de aanvrager is vastgesteld en met welke documenten of andere
      bewijsstukken de identiteitsvaststelling heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel30
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '30'
  - number: '23'
    text: |-
      1 In de aanvraag voor een reisdocument worden de volgende persoonsgegevens van de aanvrager vermeld:

      a. geslachtsnaam en voornamen;

      b. geboortedatum en geboorteplaats;

      c. adres en woonplaats;

      d. geslacht;

      e. nationaliteit;

      f. lengte.

      2 De in het eerste lid, onder a tot en met e, bedoelde gegevens worden geverifieerd in de basisadministratie waarin
      de aanvrager als ingezetene is ingeschreven.

      3 De geslachtsnaam omvat tevens de voorvoegsels en adellijke titels, de voornaam omvat tevens de adellijke
      predikaten. Op verzoek van de aanvrager kan de vermelding van adellijke titels en predikaten achterwege blijven.

      4 Indien alleen een naam, voornaam of een roepnaam bekend is, wordt deze als geslachtsnaam beschouwd.

      5 Indien de naam van de geboorteplaats niet kan worden ontleend aan de basisadministratie waarin de aanvrager als
      ingezetene is ingeschreven, dient de naam te worden vermeld zoals deze is opgenomen in zijn geboorteakte. In alle
      andere gevallen wordt de naam gevolgd zoals deze luidde ten tijde van de geboorte van de aanvrager, waarbij zoveel
      mogelijk de Nederlandse schrijfwijze wordt gebruikt. Indien de geboorteplaats niet kan worden vastgesteld, blijft
      de vermelding daarvan in de aanvraag achterwege. Het vermelden van het land achter de geboorteplaats is slechts
      toegestaan op verzoek van de aanvrager die aantoont daarbij een zwaarwegend belang te hebben en voorzover het
      reisdocument daartoe voldoende ruimte bevat.

      6 De geboortedatum omvat de dag, de maand en het jaar. Van vermelding van de dag en de maand kan worden afgezien,
      voor zover deze niet bekend zijn.

      7 In de aanvraag wordt het administratienummer vermeld waaronder de aanvrager in de basisadministratie is
      ingeschreven.

      8 In de aanvraag voor een nationaal paspoort, een zakenpaspoort, een tweede paspoort, een faciliteitenpaspoort
      of een Nederlandse identiteitskaart wordt, indien de aanvrager een burgerservicenummer heeft, tevens het
      burgerservicenummer van de aanvrager vermeld.
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel23
  - number: '24'
    text: |-
      In de aanvraag voor een reisdocument, niet zijnde een Nederlandse identiteitskaart, kan op verzoek van de aanvrager
      die door middel van schriftelijke bewijsstukken aantoont in het maatschappelijk verkeer zakelijk of beroepshalve
      bekend te staan onder een andere naam, tevens deze andere naam worden vermeld ter opneming van dit gegeven in het
      reisdocument.
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel24
  - number: '25'
    text: |-
      1 In de aanvraag voor een reisdocument worden tevens de geslachtsnaam van de huidige echtgenoot, echtgenote of
      geregistreerd partner, dan wel van de laatste gewezen echtgenoot, echtgenote of geregistreerd partner, alsmede de
      burgerlijke staat op het moment van de aanvraag vermeld, indien de aanvrager om opneming van deze gegevens in het
      aangevraagde reisdocument verzoekt.

      2 Indien de aanvraag betrekking heeft op de Nederlandse identiteitskaart wordt aan het in het eerste lid bedoelde
      verzoek slechts gevolg gegeven voorzover het reisdocument voldoende ruimte bevat voor vermelding van deze gegevens.
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel25
  - number: '26'
    text: |-
      1 Van de door de aanvrager overgelegde Nederlandse of buitenlandse reisdocumenten die op zijn naam zijn gesteld,
      dan wel van de reisdocumenten waarin hij staat bijgeschreven, worden het soort reisdocument, het documentnummer,
      de datum waarop de geldigheid van het document eindigt en de autoriteit die het document heeft verstrekt, in de
      aanvraag vermeld.

      2 Het bezit van of de vermelding in een buitenlands reisdocument wordt geregistreerd in de basisadministratie
      waarin de aanvrager als ingezetene is ingeschreven.

      3 Indien het overgelegde Nederlandse reisdocument bladzijden met een nog geldig visum of een geldige verblijfstitel
      bevat, wordt op verzoek van de aanvrager in de aanvraag vermeld, dat in het aangevraagde reisdocument
      standaardclausule XII met het documentnummer van het in te leveren reisdocument wordt opgenomen.
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel26
  - number: '27'
    text: |-
      1 Indien een eerder uitgereikt Nederlands reisdocument is vermist of op andere gronden dan ingevolge de [wet][ref1]
      door een daartoe bevoegde autoriteit is ingenomen, wordt dit gegeven, alsmede het nummer van het desbetreffende
      reisdocument en de autoriteit die het heeft verstrekt, in de aanvraag vermeld. Indien deze gegevens op het moment
      van de aanvraag niet voorhanden zijn, wordt hiernaar een gericht onderzoek ingesteld.

      2 De ingevolge [artikel 31, eerste lid, van de wet][ref2] door de aanvrager af te leggen schriftelijke verklaring
      omtrent de vermissing geschiedt ten overstaan van de daartoe aangewezen ambtenaar overeenkomstig modelformulier
      C2. De in [artikel 31, tweede lid, van de wet][ref3] genoemde gewaarmerkte kopie van het proces-verbaal vormt een
      integraal onderdeel van de schriftelijke verklaring omtrent de vermissing en wordt aan deze verklaring toegevoegd.

      3 De daartoe aangewezen ambtenaar maakt een kopie van de door de aanvrager over te leggen schriftelijke verklaring
      omtrent de inname van zijn reisdocument als bedoeld in [artikel 31, vierde lid, van de wet][ref4].

      4 De schriftelijke verklaring omtrent de vermissing en de bijgevoegde gewaarmerkte kopie van het proces-
      verbaal van de politie dan wel de kopie van de schriftelijke verklaring omtrent de inname worden bewaard in de
      reisdocumentenadministratie.

      5 De datum waarop de schriftelijke verklaring omtrent de vermissing wordt afgelegd dan wel de schriftelijke
      verklaring omtrent de inname wordt overgelegd, alsmede het nummer van het proces-verbaal van de politie, bedoeld in
      het tweede lid, worden in de aanvraag vermeld.

      6 Indien een eerder uitgereikt Nederlands reisdocument, niet zijnde een nooddocument, is vermist of op andere
      gronden dan ingevolge de [wet][ref5] door een daartoe bevoegde autoriteit is ingenomen, wordt dit gegeven terstond
      opgenomen in de basisadministratie van de gemeente waar de houder als ingezetene is ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0005212
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0005212#Artikel31
      [ref4]: https://wetten.overheid.nl/BWBR0005212#Artikel31
      [ref5]: https://wetten.overheid.nl/BWBR0005212
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel27
