  - number: '15'
    text: |-
      1 De Minister van Justitie vermeldt in het formulier of tegen het verlenen van een reisdocument voor vreemdelingen
      als bedoeld in [artikel 15, tweede lid, van de wet][ref1] op verblijfsrechtelijke gronden bedenkingen bestaan.
      Indien dit het geval is, vermeldt de Minister van Justitie in het formulier als bedenkingen:

      a. de aanvrager dient in het bezit te zijn van een geldig reisdocument voor grensoverschrijding, verstrekt door de
      autoriteiten van een ander land, dan wel

      b. de verblijfsvergunning van de aanvrager zal niet meer worden verlengd, dan wel

      c. de verblijfsvergunning van de aanvrager is of wordt ingetrokken, dan wel

      d. andere bedenkingen.

      2 De daartoe aangewezen ambtenaar voorziet het formulier op de bestemde plaats van zijn handtekening en zendt het
      aan de Minister van Buitenlandse Zaken.

      3 De Minister van Buitenlandse Zaken vermeldt in het formulier of en zo ja, welke bedenkingen hij heeft tegen
      de verstrekking van het aangevraagde reisdocument. Het formulier wordt door de daartoe aangewezen ambtenaar
      op de bestemde plaats voorzien van zijn handtekening en teruggezonden aan de burgemeester of de gezaghebber
      waar de aanvraag is ingediend. Het teruggezonden formulier wordt door de burgemeester of de gezaghebber
      aangemerkt als de in [artikel 40, vijfde en zesde lid, van de wet][ref2] vereiste vaststelling door de Minister
      van Justitie in overeenstemming met de Minister van Buitenlandse Zaken of door de aanvrager is voldaan aan
      de voorwaarden voor een aanspraak op verstrekking van een reisdocument voor vreemdelingen als bedoeld in
      [artikel 15, tweede lid, van de wet][ref3]. In dat geval is het in het teruggezonden formulier neergelegde oordeel
      van de Minister van Buitenlandse Zaken doorslaggevend.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel40
