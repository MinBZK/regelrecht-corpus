    text: |-
      Van de vermissing of de inname van een Nederlands reisdocument als bedoeld in de [artikelen 27][ref1], [52][ref2]
      en [60][ref3] wordt, met het oog op de vermelding daarvan in het basisregister reisdocumenten, terstond melding
      gedaan aan het agentschap BPR door verstrekking van dit gegeven uit de basisadministratie.


