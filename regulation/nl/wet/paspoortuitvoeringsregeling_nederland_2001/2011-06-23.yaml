  - number: '6'
    text: |-
      1 De burgemeester of de gezaghebber neemt ten behoeve van personen die als ingezetene in de basisadministratie van
      zijn gemeente, onderscheidenlijk openbaar lichaam zijn ingeschreven naast de in de [wet][ref1] genoemde gevallen
      tevens de aanvragen in ontvangst voor en gaat over tot verstrekking van:

      a. faciliteitenpaspoorten;

      b. tweede paspoorten.

      2 De gezaghebber neemt ten behoeve van een persoon die in aanmerking komt voor een reisdocument als bedoeld in
      de [artikelen 9][ref2], [11][ref3], [12][ref4], [13][ref5], [14][ref6] of [15, tweede lid, van de wet][ref7],
      maar op het moment van vertrek uit het openbaar lichaam niet in het bezit is van een geldig nationaal paspoort,
      reisdocument voor vluchtelingen of reisdocument voor vreemdelingen, met inachtneming van het bepaalde in
      [hoofdstuk XIVa][ref8], een aanvraag in ontvangst voor en gaat over tot de verstrekking van:

      a. een noodpaspoort, indien de aanvrager Nederlander is;

      b. een laissez-passer, indien verstrekking van een noodpaspoort met gebruikmaking van het reisdocumentenstation
      niet mogelijk is of de aanvrager vreemdeling is.


