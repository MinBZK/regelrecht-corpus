  - number: 100j
    text: |-
      1 Tot uitreiking van het aangevraagde nooddocument wordt slechts overgegaan, nadat de identiteit van de aanvrager
      in zijn aanwezigheid is vastgesteld en de aanvrager de in het document weergegeven persoonsgegevens op juistheid
      heeft gecontroleerd, tenzij [artikel 28, derde lid, van de wet][ref1] van toepassing is.

      2 De daartoe aangewezen ambtenaar registreert de uitreiking van het nooddocument in het reisdocumentenstation.

      3 Indien bij de uitreiking blijkt dat het nooddocument is beschadigd, onjuist is geproduceerd of gepersonaliseerd
      dan wel uit de opslag is verdwenen, wordt dit in het reisdocumentenstation geregistreerd.

      4 Indien het nooddocument niet binnen drie maanden, nadat het voor uitreiking beschikbaar is gesteld, door de
      aanvrager in ontvangst is genomen, wordt dit geregistreerd in het reisdocumentenstation.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel28
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel100j
