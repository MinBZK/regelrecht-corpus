  - number: 15a
    text: |-
      1 Met betrekking tot de aanspraak op verstrekking van een reisdocument van een in Nederland geboren
      kind, dat de leeftijd van zestien jaren nog niet heeft bereikt en van wie ieder van de ouders die
      gezamenlijk het gezag uitoefenen dan wel van wie de ouder die alleen het gezag uitoefent, beschikt over een
      verblijfsrecht ingevolge [artikel 28][ref1] of [33 van de Vreemdelingenwet 2000][ref2], dan wel ingevolge
      [artikel 12a van de Wet toelating en uitzetting BES][ref3], wordt op voorhand aangenomen dat ingevolge
      [artikel 40, vijfde en zesde lid, van de wet][ref4], door de Minister van Justitie in overeenstemming met de
      Minister van Buitenlandse Zaken is vastgesteld dat aan de voorwaarden als bedoeld in [artikel 14 van de wet][ref5]
      is voldaan.

      2 De vaststelling van de aanspraak op verstrekking van het reisdocument dat ingevolge het eerste lid wordt
      aangevraagd, geschiedt aan de hand van het door de aanvrager overgelegde verblijfsdocument, waaruit diens
      verblijfsrecht ingevolge [artikel 14][ref6] of [20 van de Vreemdelingenwet 2000][ref7], dan wel ingevolge de
      [Wet toelating en uitzetting BES][ref8], en diens nationaliteit blijkt, alsmede op grond van de gegevens die over
      het verblijfsrecht en de nationaliteit van de aanvrager in de basisadministratie zijn opgenomen.

      3 [Artikel 11, derde lid][ref9], is van overeenkomstige toepassing.


