  - number: '12'
    text: |-
      1 Behoudens het bepaalde in [artikel 15a][ref1], wordt gebruik gemaakt van modelformulier C1 bij de vaststelling
      van de aanspraak op verstrekking:

      a. van een reisdocument als bedoeld in [artikel 14][ref2] of [15, tweede lid, van de wet][ref3] door de
      burgemeester, of

      b. van een reisdocument als bedoeld in [artikel 12][ref4], [14][ref5] of [15, tweede lid, van de wet][ref6] door
      de gezaghebber.

      2 In het formulier worden naast de geslachtsnaam, voornamen, geboortedatum en geboorteplaats van de aanvrager de
      navolgende gegevens vermeld:

      I. met betrekking tot de nationaliteit:

      a. welke nationaliteit de aanvrager bezit, dan wel

      b. door welke oorzaak de aanvrager staatloos of van onbekende nationaliteit is, dan wel

      c. op grond van welke wettelijke regeling of administratieve beslissing de aanvrager zijn nationaliteit heeft
      verloren;

      II. met betrekking tot de (gewezen) echtgenoot, echtgenote of geregistreerd partner:

      de geslachtsnaam, voornamen, geboortedatum, geboorteplaats, nationaliteit en burgerlijke staat van de echtgenoot,
      echtgenote of geregistreerd partner, dan wel laatste gewezen echtgenoot, echtgenote of geregistreerd partner,
      alsmede het bezit van een verblijfsdocument met vermelding van het verblijfsrecht, het documentnummer en de
      geldigheidsduur van het document indien de betrokkene niet het Nederlanderschap bezit;

      III. met betrekking tot de binnenkomst in het Europese dan wel Caribische deel van Nederland:

      a. de datum van binnenkomst van de aanvrager;

      b. het land van waar de aanvrager voor binnenkomst laatstelijk was vertrokken of het deel van Nederland indien de
      aanvrager voor binnenkomst laatstelijk was vertrokken uit het Europese dan wel Caribische deel van Nederland;

      c. de gemeente dan wel het openbaar lichaam waar de aanvrager bij binnenkomst voor het eerst als ingezetene in de
      basisadministratie is ingeschreven;

      d. het documentnummer, de geldigheidsduur, alsmede de datum en autoriteit van verstrekking van het reisdocument
      waarover de aanvrager bij binnenkomst beschikte;

      IV. met betrekking tot het rechtmatig verblijf van de aanvrager in Nederland:

      a. de in de basisadministratie opgenomen gegevens over het verblijfsrecht van de aanvrager;

      b. het door de aanvrager ter inzage overgelegde verblijfsdocument met vermelding van het verblijfsrecht, het
      documentnummer en de geldigheidsduur van het document, dan wel de reden waarom geen geldig verblijfsdocument ter
      inzage kan worden overgelegd;

      V. met betrekking tot de redenen om aanspraak te kunnen maken op een reisdocument:

      a. de reden waarom de aanvrager geen reisdocument van een ander land kan verkrijgen, dan wel

      b. de reden waarom van de aanvrager niet kan worden gevergd, dat hij een reisdocument van een ander land aanvraagt,
      dan wel

      c. indien de aanvrager een verzoek om naturalisatie tot Nederlander heeft ingediend, op welke datum dit is
      geschied, in welk stadium de procedure zich bevindt en wat het daarop betrekking hebbende behandelingsnummer van
      het ministerie van Justitie is, dan wel

      d. indien de aanvrager van een reisdocument als bedoeld in [artikel 12][ref7] of [15, tweede lid, van de wet][ref8]
      niet in het bezit is van een verblijfsvergunning voor bepaalde tijd of voor onbepaalde tijd, met welk doel hij zich
      wenst te begeven buiten het Europese dan wel het Caribische deel van Nederland.

      3 De daartoe aangewezen ambtenaar voorziet het formulier op de bestemde plaats van zijn handtekening.

      4 De burgemeester of de gezaghebber verwijst een persoon die een aanvraag voor de verstrekking van een reisdocument
      voor vreemdelingen als bedoeld in [artikel 15, tweede lid, van de wet][ref9] wil indienen naar de Minister van
      Buitenlandse Zaken, indien de betrokken persoon zich naar een land wenst te begeven waar hij met een laissez-passer
      toegang en verblijf kan verkrijgen.


