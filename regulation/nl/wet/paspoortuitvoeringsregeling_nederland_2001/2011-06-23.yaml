  - number: 100k
    text: |-
      1 De gezaghebber voert een administratie van de door hem verstrekte nooddocumenten.

      2 De in het eerste lid bedoelde administratie wordt bijgehouden in het reisdocumentenstation, voor zover het de
      daarin overeenkomstig de [artikelen 100g][ref1] en [100j][ref2] opgenomen gegevens betreft.

      3 De overige gegevens met betrekking tot de aanvraag, verstrekking en uitreiking worden als afzonderlijke
      documenten in de administratie opgenomen op een wijze die raadpleging in samenhang met de in het tweede lid
      bedoelde gegevens mogelijk maakt.

      4 De in de administratie opgenomen gegevens worden gedurende elf jaren na de datum van verstrekking van het
      betreffende nooddocument bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel100g
      [ref2]: https://wetten.overheid.nl/BWBR0012811#Artikel100j
