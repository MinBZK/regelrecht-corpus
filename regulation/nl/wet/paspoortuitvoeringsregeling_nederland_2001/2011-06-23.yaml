        artikel: '44'
  - number: '59'
    text: |-
      De burgemeester of de gezaghebber geeft het agentschap BPR met gebruikmaking van modelformulier C6 kennis van zijn
      beslissing, bedoeld in [artikel 45, tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel45
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel59
