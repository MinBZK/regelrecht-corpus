        artikel: '93'
        hoofdstuk: XII
  - number: '79'
    text: |-
      1 De burgemeester of de gezaghebber wijst per uitgiftelocatie tenminste twee ambtenaren aan die binnen het
      aanvraagsysteem reisdocumenten zullen functioneren als autorisatiebevoegde reisdocumentenstation overeenkomstig
      de gebruikershandleiding bij het reisdocumentenstation, bedoeld in [artikel 87][ref1]. Tevens wijst de
      burgemeester of de gezaghebber per aanvraagstationlocatie tenminste twee ambtenaren aan die zullen functioneren
      als autorisatiebevoegde aanvraagstation overeenkomstig de gebruikershandleiding bij het aanvraagstation, bedoeld
      in [artikel 87][ref2].

      2 Van de aanwijzing of de vervanging van een autorisatiebevoegde wordt terstond met gebruikmaking
      van standaardformulier B3 melding gedaan aan het agentschap BPR, die een registratie bijhoudt van de
      autorisatiebevoegden en deze gegevens doorgeeft aan de leverancier.

      3 De burgemeester of de gezaghebber draagt er zorg voor, dat een autorisatiebevoegde in staat wordt gesteld alle
      handelingen te verrichten die uit zijn taak voortvloeien.

      4 De autorisatiebevoegden zijn rechtstreeks verantwoording verschuldigd aan de burgemeester of de gezaghebber.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0012811#Artikel87
    url: https://wetten.overheid.nl/BWBR0012811/2011-06-23#Artikel79
