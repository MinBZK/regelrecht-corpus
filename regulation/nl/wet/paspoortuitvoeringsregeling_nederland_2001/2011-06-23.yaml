        bwb_id: BWBR0012811
        artikel: '91'
        hoofdstuk: XII
      - id: ref2
        bwb_id: BWBR0012811
  - number: 46a
    text: |-
      De documenten die na de controle van de zending als bedoeld in de [artikelen 44][ref1] of [45][ref2] in de openbare
      lichamen voor een andere autoriteit blijken te zijn bestemd, worden op de uitgiftelocatie vernietigd op de in
      [artikel 67, tweede lid][ref3], aangegeven wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel44
