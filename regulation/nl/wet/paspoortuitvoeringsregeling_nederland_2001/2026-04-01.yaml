---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: paspoortuitvoeringsregeling_nederland_2001
regulatory_layer: WET
publication_date: '2026-03-31'
valid_from: '2026-04-01'
bwb_id: BWBR0012811
url: https://wetten.overheid.nl/BWBR0012811/2026-04-01
preamble:
  text: |-
    Gelet op de artikelen 2, eerste lid, onder g, tweede en derde lid, 3, eerste, derde, vierde en zevende lid, 16,
    tweede lid, 26, eerste lid, onder d en derde lid, 27, eerste lid, 30, eerste lid, 31, derde lid, 40, eerste lid,
    onder d en zesde lid, 43, 57 en 59 van de Paspoortwet en artikel 3 van het Besluit paspoortgelden;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel1
  - number: 1.1.a
    text: |-
      *de wet:* de [Paspoortwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005212
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005212
  - number: 1.1.b
    text: |-
      *aanvraag, weigering, verstrekking, uitreiking, houder, wijziging, inhouding, vervallen of vervallenverklaring en
      vermissing:* hetgeen ingevolge [artikel 1, eerste lid, van de wet][ref1] daaronder wordt verstaan;


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel1
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '1'
  - number: 1.1.c
    text: |-
      *aanvrager:* degene die een aanvraag als bedoeld in [artikel 1, onder a, van de wet][ref1] indient of op wie een
      dergelijke aanvraag betrekking heeft;


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel1
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '1'
  - number: 1.1.d
    text: |-
      *register paspoortsignaleringen:* het register, bedoeld in [artikel 25, derde lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel25
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '25'
  - number: 1.1.e
    text: |-
      *signalerende autoriteit:* de autoriteit, bedoeld in de [artikelen 18 tot en met 24 van de wet][ref1], die op grond
      van [artikel 25 van de wet][ref2] een verzoek tot weigering of vervallenverklaring heeft ingediend;


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel25
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0005212
        artikel: '25'
  - number: 1.1.f
    text: |-
      *basisadministratie:* de basisregistratie personen, dan wel een basisadministratie als bedoeld in
      [artikel 2 van de Wet basisadministraties persoonsgegevens BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028208#Artikel2
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028208
        artikel: '2'
  - number: 1.1.g
    text: |-
      *basisregister reisdocumenten:* het register, bedoeld in [artikel 4c van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel4c
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: 4c
  - number: 1.1.h
    text: |-
      *aanvraagsysteem reisdocumenten:* het geheel van apparatuur, programmatuur, opslagmedia en overige materialen,
      waarvan door de bevoegde autoriteit gebruik wordt gemaakt bij de aanvraag, verstrekking, uitreiking en registratie
      van reisdocumenten;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel1
  - number: 1.1.i
    text: |-
      *reisdocumentenstation:* de door de leverancier beschikbaar gestelde apparatuur en programmatuur, waarin gegevens
      met betrekking tot aangevraagde en uitgereikte reisdocumenten worden verwerkt en gearchiveerd en waarmee de
      gegevensuitwisseling tussen de bevoegde autoriteit en de leverancier plaatsvindt (reisdocumentenaanvraag- en
      archiefstation);
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel1
  - number: 1.1.j
    text: |-
      *reisdocumentenadministratie:* de in het reisdocumentenstation en op andere wijze bij de bevoegde autoriteit
      opgeslagen gegevens met betrekking tot aangevraagde en uitgereikte reisdocumenten;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel1
  - number: 1.1.k
    text: |-
      *reisdocumentenmodule:* de apparatuur en programmatuur, waarmee de bevoegde autoriteit bij de aanvraag en
      uitreiking gegevens uitwisselt met het reisdocumentenstation en de basisadministratie;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel1
  - number: 1.1.l
    text: |-
      *standaardclausule:* een clausule, waarvan de tekst in [bijlage A van deze regeling][ref1] is opgenomen en die door
      de leverancier dan wel de bevoegde autoriteit in het reisdocument wordt aangebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0012811
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0012811
  - number: 1.1.m
    text: '*openbaar lichaam:* openbaar lichaam Bonaire, Sint Eustatius of Saba;'
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel1
  - number: 1.1.n
    text: '*aanvraagnummer:* het nummer dat voorgedrukt is op het foto- en handtekeningformulier;'
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel1
  - number: 1.1.o
    text: |-
      *administratienummer:* het administratienummer, bedoeld in [artikel 4.9 van de Wet basisregistratie personen][ref1],
      dan wel in de [artikelen 10][ref2] en [11 van de Wet basisadministraties persoonsgegevens BES][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0028208#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0028208#Artikel11
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0028208
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0028208
        artikel: '11'
  - number: 1.1.q
    text: |-
      *spoedopdracht:* de opdracht aan de leverancier om versneld over te gaan tot vervaardiging en levering van een
      reisdocument;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel1
  - number: 1.1.r
    text: ;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel1
  - number: 1.1.s
    text: |-
      *identificatiekaart:* een document als bedoeld in [artikel 80][ref1], waarmee op elektronische wijze toegang kan
      worden verkregen tot het reisdocumentenstation en de daarin opgeslagen programmatuur en gegevens;


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel80
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '80'
        hoofdstuk: XI
        paragraaf: '1'
  - number: 1.1.t
    text: |-
      *leverancier:* een bedrijf dat in opdracht van de Minister van Binnenlandse Zaken en Koninkrijksrelaties belast is
      met het verrichten van een of meerdere diensten die verband houden met de verstrekking van reisdocumenten;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel1
  - number: 1.1.u
    text: |-
      *distributeur:* het bedrijf dat zorg draagt voor de distributie van reisdocumenten, identificatiekaarten en overige
      materialen die door de leverancier worden geleverd;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel1
  - number: 1.1.v
    text: '*bestelkantoor:* het plaatselijke kantoor van de distributeur;'
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel1
  - number: 1.1.w
    text: |-
      *besteller:* een werknemer in dienst bij de distributeur, die belast is met de feitelijke aflevering van de
      documenten en overige materialen;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel1
  - number: 1.1.x
    text: |-
      *uitgiftelocatie:* de locatie bij een bevoegde autoriteit waar de aanvragen aan de leverancier worden verzonden en
      de documenten en overige materialen door de distributeur worden afgeleverd;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel1
  - number: 1.1.y
    text: |-
      *transporteur:* het bedrijf dat, in voorkomende gevallen met inschakeling van tussenpersonen, zorg draagt voor de
      distributie van reisdocumenten, identificatiekaarten en overige materialen tussen het ministerie van Buitenlandse
      Zaken en de bevoegde autoriteiten in de openbare lichamen;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel1
  - number: 1.1.z
    text: |-
      *verblijfsdocument:* een document waaruit het verblijfsrecht van de vreemdeling ingevolge de
      [Vreemdelingenwet 2000][ref1] of de [Wet toelating en uitzetting BES][ref2] blijkt;


      [ref1]: https://wetten.overheid.nl/BWBR0011823
      [ref2]: https://wetten.overheid.nl/BWBR0028571
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011823
      - id: ref2
        bwb_id: BWBR0028571
  - number: 1.1.aa
    text: |-
      *aanvraagstation:* de door de minister van Binnenlandse Zaken en Koninkrijksrelaties aangewezen apparatuur en
      programmatuur voor het ondersteunen van het aanvraag- en uitgifteproces van reisdocumenten;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel1
  - number: 1.1.bb
    text: |-
      *foto- en handtekeningenformulier:* het daartoe door de leverancier beschikbaar gestelde formulier dat bestemd is
      voor het opnemen van de foto en de handtekening, bedoeld in [artikel 38, eerste en tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel38
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '38'
        hoofdstuk: III
        paragraaf: '4'
  - number: 1.1.cc
    text: |-
      *aanvraagstationlocatie:*de locatie waar de bevoegde autoriteit met inachtneming van [artikel 91][ref1] één of
      meerdere aanvraagstations heeft geplaatst;


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel91
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '91'
        hoofdstuk: XII
  - number: 1.1.dd
    text: |-
      *mobiel vingerafdrukopname-apparaat:* de door de Minister van Binnenlandse Zaken en Koninkrijksrelaties aangewezen
      mobiele apparatuur en bijbehorende programmatuur voor het opnemen van vingerafdrukken;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel1
  - number: 1.1.ee
    text: |-
      *ingezetene:*een ingezetene als bedoeld in [artikel 1.1, onderdeel f, van de Wet basisregistratie personen][ref1],
      dan wel [artikel 1, onderdeel h, van de Wet basisadministraties persoonsgegevens BES][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028208#Artikel1
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0028208
        artikel: '1'
  - number: 1.1.ff
    text: |-
      *besluit:* [Paspoortbesluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0044308
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0044308
  - number: 1.1.gg
    text: |-
      *register vermiste of vervallen reisdocumenten:* het register, bedoeld in [artikel 4a van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel4a
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: 4a
  - number: '1.2'
    text: Deze regeling is van toepassing op de verstrekking van reisdocumenten door de burgemeesters en de gezaghebbers.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel1
  - number: '3.1'
    text: |-
      Voor de in [artikel 2, eerste lid, onder a, d en e, van de wet][ref1] bedoelde reisdocumenten worden de volgende
      modellen vastgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel2
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '2'
  - number: 3.1.a
    text: |-
      nationaal paspoort: model nationaal paspoort met 34 bladzijden, dan wel met 66 bladzijden (zakenpaspoort), dat is
      opgenomen in [bijlage M][ref1] bij deze regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0012811
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012811
  - number: 3.1.b
    text: |-
      reisdocument voor vluchtelingen: model reisdocument voor vluchtelingen, dat is opgenomen in [bijlage N][ref1] bij
      deze regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0012811
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012811
  - number: 3.1.c
    text: |-
      reisdocument voor vreemdelingen: model reisdocument voor vreemdelingen, dat is opgenomen in [bijlage O][ref1] bij
      deze regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0012811
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012811
  - number: '3.2'
    text: |-
      Voor de ingevolge [artikel 2, eerste lid, onder g, van de wet][ref1] vastgestelde reisdocumenten worden de volgende
      modellen vastgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel2
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '2'
  - number: 3.2.a
    text: |-
      faciliteitenpaspoort: model nationaal paspoort met 34 bladzijden, dan wel met 66 bladzijden (zakenpaspoort), als
      bedoeld in onderdeel a, voorzien van standaardclausule VI;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel3
  - number: 3.2.b
    text: |-
      tweede paspoort: model nationaal paspoort met 34 bladzijden, dan wel met 66 bladzijden (zakenpaspoort), als bedoeld
      in onderdeel a, voorzien van standaardclausule VII.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel3
  - number: '3.3'
    text: |-
      Met betrekking tot de ingevolge [artikel 2, tweede lid, van de wet][ref1] bedoelde identiteitskaarten worden van de
      volgende documenten in deze regeling de navolgende modellen vastgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel2
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '2'
  - number: 3.3.a
    text: |-
      Nederlandse identiteitskaart: model Nederlandse identiteitskaart, dat is opgenomen in [bijlage P][ref1] bij deze
      regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0012811
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012811
  - number: 3.3.b
    text: |-
      vervangende Nederlandse identiteitskaart: model vervangende Nederlandse identiteitskaart, dat is opgenomen in
      [bijlage Q][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0012811
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012811
  - number: '3.4'
    text: |-
      In de modellen, genoemd in het eerste, tweede en derde lid, onder a, is een machineleesbare strook en een door de
      Minister van Binnenlandse Zaken en Koninkrijksrelaties ondertekende chip opgenomen.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel3
  - number: 3aa
    text: 'Gegevens die betrekking hebben op de status van een reisdocument zijn:'
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel3aa
  - number: 3aa.a
    text: in aanvraag;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel3aa
  - number: 3aa.b
    text: geldig;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel3aa
  - number: 3aa.c
    text: ongeldig, met inbegrip van de reden van ongeldigheid;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel3aa
  - number: 3aa.d
    text: definitief aan het verkeer onttrokken.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel3aa
  - number: 3ab
    text: 'Gegevens die betrekking hebben op de status van het reisdocument als publiek identificatiemiddel zijn:'
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel3ab
  - number: 3ab.a
    text: uitgereikt;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel3ab
  - number: 3ab.b
    text: geactiveerd;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel3ab
  - number: 3ab.c
    text: geblokkeerd;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel3ab
  - number: 3ab.d
    text: ingetrokken.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel3ab
  - number: 3ac
    text: |-
      Degene die op grond van deze regeling gegevens verstrekt ten behoeve van de reisdocumentenadministratie, het
      register vermiste of vervallen reisdocumenten of de basisadministratie, verstrekt deze gegevens, met uitzondering
      van vingerafdrukken, gezichtsopname en handtekening, eveneens aan de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties ten behoeve van het basisregister reisdocumenten.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel3ac
  - number: 3ad.1
    text: |-
      Teneinde de veiligheid en betrouwbaarheid van het basisregister reisdocumenten te waarborgen, neemt de Minister van
      Binnenlandse Zaken en Koninkrijksrelaties passende maatregelen om inbreuken op en aantastingen van de beveiliging
      en de processen van het register te voorkomen. Hierbij wordt in ieder geval voldaan aan:
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel3ad
  - number: 3ad.1.a
    text: de open normen en standaarden op de ‘pas-toe-of-leg-uit-lijst’ van het Forum Standaardisatie;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel3ad
  - number: 3ad.1.b
    text: de Baseline Informatiebeveiliging Overheid; en
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel3ad
  - number: 3ad.1.c
    text: de Voorschriften Informatiebeveiliging Rijksdienst.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel3ad
  - number: 3ad.2
    text: |-
      De in het eerste lid bedoelde maatregelen worden getroffen en onderhouden op basis van daartoe na een risicoanalyse
      vastgestelde informatiebeveiligingsplannen.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel3ad
  - number: 3ad.3
    text: |-
      Teneinde maatregelen te kunnen aanpassen en doorontwikkeling mogelijk te maken, wordt voor het register of
      onderdelen daarvan onderhoud gepleegd. Hiertoe kunnen, na voorafgaande bekendmaking, het register of onderdelen
      daarvan tijdelijk buiten gebruik worden gesteld.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel3ad
  - number: '5.1'
    text: |-
      De tot verstrekking dan wel inhouding bevoegde autoriteiten dragen er zorg voor dat de administratie, bedoeld
      in [artikel 25, vierde en vijfde lid, van de wet][ref1], te allen tijde de naam, voornamen, geboortedatum en
      geboorteplaats bevat van de personen ten aanzien van wie zij op grond van de wet bevoegd zijn tot verstrekking dan
      wel inhouding.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel25
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '25'
  - number: '5.2'
    text: |-
      De in het eerste lid bedoelde administratie is op naam toegankelijk en kan desgewenst worden gevoerd door het
      bewaren en raadplegen van de regelmatig toegezonden signaleringslijst en de tussentijdse aanvullingen daarop.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel5
  - number: '7.1'
    text: |-
      Als gemeenten als bedoeld in de [artikelen 3.2., eerste lid, onderdeel a][ref1], en
      [4.2., eerste lid, onderdeel a, van het besluit][ref2], worden aangewezen Aalten, Bergen op Zoom, Bergeijk, Breda,
      Echt-Susteren, Enschede, ’s-Gravenhage, Haarlemmermeer, Heerlen, Maastricht, Montferland, Nijmegen, Oldambt, Sluis
      en Venlo.


      [ref1]: https://wetten.overheid.nl/BWBR0044308#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0044308#Artikel4
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0044308
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0044308
        artikel: '4'
  - number: '7.2'
    text: |-
      Als gemeenten als bedoeld in de [artikelen 3.2., eerste lid, onderdeel b][ref1], en
      [4.2., eerste lid, onderdeel b, van het besluit][ref2], worden aangewezen Almelo, Alphen aan den Rijn, Arnhem,
      Dijk en Waard, Dordrecht, ’s-Gravenhage, Haarlemmermeer, Horst aan de Maas, Krimpen aan den IJssel, Land van Cuijk,
      Leeuwarden, Lelystad, Middelburg, Nieuwegein, Noordenveld, Roermond, Rotterdam, Sittard-Geleen, Soest, Stichtse
      Vecht, Vught, Zaanstad, Zutphen en Zwolle.


      [ref1]: https://wetten.overheid.nl/BWBR0044308#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0044308#Artikel4
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0044308
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0044308
        artikel: '4'
  - number: '8'
    text: |-
      De burgemeester of de gezaghebber die niet bevoegd is tot het in ontvangst nemen van de aanvraag verwijst
      de betrokken persoon terstond naar de burgemeester of de gezaghebber die ingevolge de [wet][ref1] en de
      [artikelen 3.1][ref2] en [3.2 van het besluit][ref3] daartoe wel bevoegd is.


      [ref1]: https://wetten.overheid.nl/BWBR0005212
      [ref2]: https://wetten.overheid.nl/BWBR0044308#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0044308#Artikel3
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005212
      - id: ref2
        bwb_id: BWBR0044308
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0044308
        artikel: '3'
  - number: '12.1'
    text: |-
      Behoudens het bepaalde in [artikel 15a][ref1], verzamelt de burgemeester voor reisdocumenten als bedoeld in
      [artikel 14][ref2] of [15, tweede lid, van de wet][ref3] of de gezaghebber voor reisdocumenten als bedoeld
      in [artikel 12][ref4], 14 of 15, tweede lid, van de wet, gegevens voor de vaststelling van de aanspraak op
      verstrekking. De gegevens worden waar mogelijk verzameld uit de basisadministratie, alsmede aan de hand van het
      door de aanvrager overgelegde verblijfsdocument of overige bewijsstukken.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel15a
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0005212#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0005212#Artikel12
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: 15a
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005212
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0005212
        artikel: '15'
      - id: ref4
        bwb_id: BWBR0005212
        artikel: '12'
  - number: '12.2'
    text: 'De volgende gegevens worden verzameld:'
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel12
  - number: 12.2.a
    text: |-
      Met betrekking tot de nationaliteit: Welke nationaliteit de aanvrager bezit, dan wel dat de aanvrager van onbekende
      nationaliteit of staatloos is;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel12
  - number: 12.2.b
    text: 'Met betrekking tot de binnenkomst in het Europese dan wel Caribische deel van Nederland:'
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel12
  - number: 12.2.b.1
    text: de gemeente dan wel het openbaar lichaam waarvan de aanvrager bij binnenkomst voor het eerst ingezetene werd;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel12
  - number: 12.2.b.2
    text: |-
      de geldigheidsduur en autoriteit van verstrekking van het reisdocument waarover de aanvrager bij binnenkomst
      beschikte;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel12
  - number: 12.2.c
    text: 'Met betrekking tot het rechtmatig verblijf van de aanvrager in Nederland:'
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel12
  - number: 12.2.c.1
    text: |-
      de in de basisadministratie opgenomen gegevens over de verblijfstitel van de aanvrager en de datum sedert welke de
      aanvrager in de vreemdelingenadministratie is ingeschreven;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel12
  - number: 12.2.c.2
    text: |-
      het documentnummer en de geldigheidsduur van het verblijfsdocument, dan wel de reden waarom geen geldig
      verblijfsdocument ter inzage kan worden overgelegd;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel12
  - number: 12.2.d
    text: 'Met betrekking tot de redenen om aanspraak te kunnen maken op een reisdocument:'
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel12
  - number: 12.2.d.1
    text: |-
      de reden waarom de aanvrager geen reisdocument van een ander land kan verkrijgen, dan wel de reden waarom van de
      aanvrager niet kan worden gevergd dat hij een reisdocument van een ander land aanvraagt;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel12
  - number: 12.2.d.2
    text: |-
      indien de aanvrager van een reisdocument als bedoeld in [artikel 12][ref1] of [15, tweede lid, van de wet][ref2]
      niet in het bezit is van een verblijfsvergunning voor bepaalde tijd of voor onbepaalde tijd: met welk doel hij zich
      wenst te begeven buiten het Europese dan wel het Caribische deel van Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel15
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0005212
        artikel: '15'
  - number: '12.3'
    text: |-
      De gezaghebber raadpleegt de Minister van Justitie en Veiligheid over de gegevens bedoeld in het tweede lid,
      onderdeel c, onderdeel 1°. De burgemeester raadpleegt de Minister van Justitie en Veiligheid over de datum sedert
      welke de aanvrager in de vreemdelingenadministratie is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel12
  - number: '12.4'
    text: |-
      Indien de in de basisadministratie opgenomen gegevens afwijken van de gegevens die omtrent de aanvrager in zijn
      verblijfsdocument of in de vreemdelingenadministratie zijn opgenomen dan wel anderszins onzekerheid bestaat over
      deze gegevens, wordt daarnaar een gericht onderzoek ingesteld.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel12
  - number: '12.5'
    text: |-
      De burgemeester of de gezaghebber verwijst een persoon die een aanvraag voor de verstrekking van een reisdocument
      voor vreemdelingen als bedoeld in [artikel 15, tweede lid, van de wet][ref1] wil indienen naar de Minister van
      Buitenlandse Zaken, indien de betrokken persoon zich naar een land wenst te begeven waar hij met een laissez-passer
      toegang en verblijf kan verkrijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel15
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '15'
  - number: '13.1'
    text: |-
      De Minister van Justitie en Veiligheid informeert de burgemeester of gezaghebber of er aan de voorwaarden voor
      aanspraak op een reisdocument als bedoeld in [artikel 12][ref1], [14][ref2] of [15, tweede lid, van de wet][ref3]
      is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0005212#Artikel15
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0005212
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0005212
        artikel: '15'
  - number: '13.2'
    text: |-
      Indien er bedenkingen bestaan tegen het verstrekken van het reisdocument als bedoeld in [artikel 12][ref1],
      [14][ref2] of [15, tweede lid, van de wet][ref3], blijkt uit de schriftelijke vaststelling daarvan:


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0005212#Artikel15
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0005212
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0005212
        artikel: '15'
  - number: 13.2.a
    text: |-
      dat de aanvrager in het bezit moet zijn van een geldig reisdocument voor grensoverschrijding, verstrekt door de
      autoriteiten van een ander land;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel13
  - number: 13.2.b
    text: dat de verblijfsvergunning van de aanvrager niet meer zal worden verlengd;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel13
  - number: 13.2.c
    text: dat de verblijfsvergunning van de aanvrager is of wordt ingetrokken; of
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel13
  - number: 13.2.d
    text: welke andere bedenkingen er zijn.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel13
  - number: '14.1'
    text: |-
      De Minister van Buitenlandse Zaken informeert de burgemeester of gezaghebber of er aan de voorwaarden voor
      aanspraak op een reisdocument als bedoeld in [artikel 12][ref1], [14][ref2] of [15, tweede lid, van de wet][ref3]
      is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0005212#Artikel15
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0005212
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0005212
        artikel: '15'
  - number: '14.2'
    text: |-
      Indien er vanwege de internationale betrekkingen bedenkingen bestaan over het verstrekken van het reisdocument
      als bedoeld in [artikel 12][ref1], [14][ref2] of [15, tweede lid, van de wet][ref3], vermeldt de Minister van
      Buitenlandse Zaken schriftelijk, gemotiveerd waaruit de bedenkingen bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0005212#Artikel15
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0005212
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0005212
        artikel: '15'
  - number: 15a.1
    text: |-
      Met betrekking tot de aanspraak op verstrekking van een reisdocument van een in Nederland geboren kind,
      dat de leeftijd van zestien jaren nog niet heeft bereikt en van wie ieder van de ouders die gezamenlijk
      het gezag uitoefenen dan wel van wie de ouder die alleen het gezag uitoefent, beschikt over een
      verblijfsrecht ingevolge [artikel 28][ref1] of [33 van de Vreemdelingenwet 2000][ref2], dan wel ingevolge
      [artikel 12a van de Wet toelating en uitzetting BES][ref3], wordt op voorhand aangenomen dat ingevolge
      [artikel 40, vijfde en zesde lid, van de wet][ref4], door de Minister van Justitie in overeenstemming met de
      Minister van Buitenlandse Zaken is vastgesteld dat aan de voorwaarden als bedoeld in [artikel 14 van de wet][ref5]
      is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0028571#Artikel12a
      [ref4]: https://wetten.overheid.nl/BWBR0005212#Artikel40
      [ref5]: https://wetten.overheid.nl/BWBR0005212#Artikel14
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '33'
      - id: ref3
        bwb_id: BWBR0028571
        artikel: 12a
      - id: ref4
        bwb_id: BWBR0005212
        artikel: '40'
      - id: ref5
        bwb_id: BWBR0005212
        artikel: '14'
  - number: 15a.2
    text: |-
      De vaststelling van de aanspraak op verstrekking van het reisdocument dat ingevolge het eerste lid wordt
      aangevraagd, geschiedt aan de hand van het door de aanvrager overgelegde verblijfsdocument, waaruit diens
      verblijfsrecht ingevolge [artikel 14][ref1] of [20 van de Vreemdelingenwet 2000][ref2], dan wel ingevolge de
      [Wet toelating en uitzetting BES][ref3], en diens nationaliteit blijkt, alsmede op grond van de gegevens die over
      het verblijfsrecht en de nationaliteit van de aanvrager in de basisadministratie zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0028571
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '20'
      - id: ref3
        bwb_id: BWBR0028571
  - number: 15a.3
    text: |-
      Indien de in de basisadministratie, dan wel in het aanvraag-informatieformulier opgenomen gegevens afwijken van
      de gegevens die zijn vermeld in het door de aanvrager overgelegde verblijfsdocument dan wel anderszins onzekerheid
      bestaat over deze gegevens, wordt daarnaar een gericht onderzoek ingesteld waarbij de gegevens die over het
      verblijfsrecht en de nationaliteit dan wel staatloosheid van de aanvrager in de vreemdelingenadministratie zijn
      opgenomen, mede worden betrokken.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel15a
  - number: '21.1'
    text: |-
      De gegevens voor de aanvraag van een reisdocument worden opgenomen met behulp van de reisdocumentenmodule en het
      aanvraagstation.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel21
  - number: '21.2'
    text: |-
      In de aanvraag wordt de in [artikel 83][ref1] bedoelde locatiecode, behorende bij de uitgiftelocatie, vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel83
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '83'
        hoofdstuk: XI
        paragraaf: '2'
  - number: '21.3'
    text: In de aanvraag wordt aangegeven op welk model reisdocument deze betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel21
  - number: '21.4'
    text: In de aanvraag wordt het aanvraagnummer vermeld.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel21
  - number: '22.1'
    text: |-
      Ter uitvoering van [artikel 2.1, eerste lid, van het besluit][ref1] wordt voor de vaststelling van de identiteit
      geen gebruik gemaakt van de in de reisdocumentenadministratie opgenomen gegevens behorende bij een eerder aan
      betrokkene uitgereikt nooddocument.


      [ref1]: https://wetten.overheid.nl/BWBR0044308#Artikel2
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0044308
        artikel: '2'
  - number: '22.2'
    text: |-
      Indien de in [artikel 2.1, eerste lid, van het besluit][ref1] bedoelde gegevens berusten bij een andere
      autoriteit, dan wordt deze verzocht om kosteloze verstrekking van een afschrift van de gevraagde gegevens uit de
      reisdocumentenadministratie. In de aanvraag wordt vermeld bij welke autoriteit de gegevens zijn opgevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0044308#Artikel2
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0044308
        artikel: '2'
  - number: '22.3'
    text: |-
      Bij een gericht onderzoek als bedoeld in [artikel 2.1, tweede lid, van het besluit][ref1] worden tevens nadere
      identificerende vragen gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0044308#Artikel2
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0044308
        artikel: '2'
  - number: '22.4'
    text: |-
      De aanvrager aan wie niet eerder een Nederlands reisdocument is verstrekt, overlegt bij zijn aanvraag andere
      identiteitsdocumenten die voorzien zijn van zijn foto en handtekening. Indien hij dergelijke documenten niet kan
      overleggen, is [artikel 2.1, tweede lid, van het besluit][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0044308#Artikel2
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0044308
        artikel: '2'
  - number: '22.5'
    text: |-
      In de aanvraag wordt vermeld dat de identiteit van de aanvrager is vastgesteld en met welke documenten of andere
      bewijsstukken de identiteitsvaststelling heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel22
  - number: 22a.1
    text: |-
      Indien onvoldoende zekerheid bestaat over de juistheid van de door de aanvrager gedane mededeling dat hij geen
      ingezetene is, dan wel over de identiteit of de nationaliteit van de aanvrager, wordt de betrokken persoon, indien
      deze op korte termijn over een reisdocument moet beschikken, doorverwezen naar een autoriteit die bevoegd is tot de
      verstrekking van nooddocumenten.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel22a
  - number: 22a.2
    text: |-
      De vaststelling van de identiteit en de nationaliteit van de echtgenoot, echtgenote of geregistreerd partner dan
      wel de gewezen echtgenoot, echtgenote of geregistreerd partner van de aanvrager, respectievelijk van een wettelijke
      vertegenwoordiger die een verklaring van toestemming moet overleggen, geschiedt op de in het eerste lid en
      [artikel 2.1 van het besluit][ref1] vermelde wijze, voor zover de betrokken persoon geen ingezetene is.


      [ref1]: https://wetten.overheid.nl/BWBR0044308#Artikel2
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0044308
        artikel: '2'
  - number: '23.1'
    text: 'In de aanvraag voor een reisdocument worden de volgende persoonsgegevens van de aanvrager vermeld:'
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel23
  - number: 23.1.a
    text: geslachtsnaam en voornamen;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel23
  - number: 23.1.b
    text: geboortedatum en geboorteplaats;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel23
  - number: 23.1.c
    text: adres en woonplaats;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel23
  - number: 23.1.d
    text: geslacht;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel23
  - number: 23.1.e
    text: nationaliteit;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel23
  - number: 23.1.f
    text: lengte.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel23
  - number: '23.2'
    text: |-
      De in het eerste lid, onder a tot en met e, bedoelde gegevens worden geverifieerd in de basisadministratie waarin
      de aanvrager als ingezetene is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel23
  - number: '23.3'
    text: |-
      De geslachtsnaam omvat tevens de voorvoegsels en adellijke titels, de voornaam omvat tevens de adellijke
      predikaten. Op verzoek van de aanvrager kan de vermelding van adellijke titels en predikaten achterwege blijven.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel23
  - number: '23.4'
    text: Indien alleen een naam, voornaam of een roepnaam bekend is, wordt deze als geslachtsnaam beschouwd.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel23
  - number: '23.5'
    text: |-
      Indien de naam van de geboorteplaats niet kan worden ontleend aan de basisadministratie waarin de aanvrager als
      ingezetene is ingeschreven, dient de naam te worden vermeld zoals deze is opgenomen in zijn geboorteakte. In alle
      andere gevallen wordt de naam gevolgd zoals deze luidde ten tijde van de geboorte van de aanvrager, waarbij zoveel
      mogelijk de Nederlandse schrijfwijze wordt gebruikt. Indien de geboorteplaats niet kan worden vastgesteld, blijft
      de vermelding daarvan in de aanvraag achterwege. Het vermelden van het land achter de geboorteplaats is slechts
      toegestaan op verzoek van de aanvrager die aantoont daarbij een zwaarwegend belang te hebben en voorzover het
      reisdocument daartoe voldoende ruimte bevat.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel23
  - number: '23.6'
    text: |-
      De geboortedatum omvat de dag, de maand en het jaar. Van vermelding van de dag, de maand en het jaar kan worden
      afgezien, voor zover deze niet bekend zijn.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel23
  - number: '23.7'
    text: |-
      In de aanvraag wordt, indien de aanvrager een burgerservicenummer heeft, het burgerservicenummer vermeld en indien
      de aanvrager een administratienummer heeft, het administratienummer vermeld, waaronder de aanvrager is ingeschreven
      in de basisadministratie.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel23
  - number: '24'
    text: |-
      In de aanvraag voor een reisdocument, niet zijnde een Nederlandse identiteitskaart of vervangende Nederlandse
      identiteitskaart, kan op verzoek van de aanvrager die door middel van schriftelijke bewijsstukken aantoont in het
      maatschappelijk verkeer zakelijk of beroepshalve bekend te staan onder een andere naam, tevens deze andere naam
      worden vermeld ter opneming van dit gegeven in het reisdocument.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel24
  - number: '25.1'
    text: |-
      In de aanvraag voor een reisdocument worden tevens de geslachtsnaam van de huidige echtgenoot, echtgenote of
      geregistreerd partner, dan wel van de laatste gewezen echtgenoot, echtgenote of geregistreerd partner, alsmede de
      burgerlijke staat op het moment van de aanvraag vermeld, indien de aanvrager om opneming van deze gegevens in het
      aangevraagde reisdocument verzoekt.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel25
  - number: '25.2'
    text: |-
      Indien de aanvraag betrekking heeft op de Nederlandse identiteitskaart of vervangende Nederlandse identiteitskaart
      wordt aan het in het eerste lid bedoelde verzoek slechts gevolg gegeven voorzover het reisdocument voldoende ruimte
      bevat voor vermelding van deze gegevens.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel25
  - number: '26.1'
    text: |-
      Van de door de aanvrager overgelegde Nederlandse reisdocumenten die op zijn naam zijn gesteld, worden het soort
      reisdocument, het documentnummer, de datum waarop de geldigheid van het document eindigt en de autoriteit die het
      document heeft verstrekt, in de aanvraag vermeld.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel26
  - number: '26.2'
    text: |-
      Indien het overgelegde Nederlandse reisdocument bladzijden met een nog geldig visum of een geldige verblijfstitel
      bevat, wordt op verzoek van de aanvrager in de aanvraag vermeld, dat in het aangevraagde reisdocument
      standaardclausule XII met het documentnummer van het in te leveren reisdocument wordt opgenomen.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel26
  - number: '27.1'
    text: |-
      Indien zijn eerder uitgereikt reisdocument mogelijk voorwerp is van fraude, is vermist of op andere gronden dan
      ingevolge de [wet][ref1] door een daartoe bevoegde autoriteit is ingenomen, kan de aanvrager een aanvraag voor
      een reisdocument indienen, indien hij de vermissing, mogelijke fraude, onderscheidenlijke inname, overeenkomstig
      [artikel 60][ref2] meldt of heeft gemeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005212
      [ref2]: https://wetten.overheid.nl/BWBR0012811#Artikel60
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005212
      - id: ref2
        bwb_id: BWBR0012811
        artikel: '60'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '27.2'
    text: 'In de aanvraag worden vermeld:'
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel27
  - number: 27.2.a
    text: |-
      mogelijke fraude, de vermissing, of inname op andere gronden dan ingevolge de [wet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005212
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005212
  - number: 27.2.b
    text: het nummer van het desbetreffende reisdocument en de autoriteit die het heeft verstrekt, en
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel27
  - number: 27.2.c
    text: |-
      de datum waarop de in [artikel 60, tweede tot en met zesde lid][ref1] bedoelde schriftelijke dan wel elektronische
      verklaringen, zijn afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel60
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '60'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '27.3'
    text: |-
      Indien een gegeven als bedoeld in het tweede lid, onder b of c, niet voorhanden is, wordt hiernaar een gericht
      onderzoek ingesteld.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel27
  - number: '28.1'
    text: |-
      Bij het indienen van een aanvraag voor een reisdocument wordt een pasfoto overgelegd die een goedgelijkend beeld
      van de aanvrager geeft.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel28
  - number: '28.2'
    text: |-
      De overgelegde pasfoto voldoet aan de acceptatiecriteria van de in [bijlage L][ref1] bij deze regeling opgenomen
      fotomatrix.


      [ref1]: https://wetten.overheid.nl/BWBR0012811
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0012811
  - number: '28.3'
    text: |-
      In afwijking van het tweede lid kan een pasfoto worden geaccepteerd indien de aanvrager heeft aangetoond dat
      godsdienstige of levensbeschouwelijke redenen zich verzetten tegen het niet bedekken van het hoofd.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel28
  - number: '28.4'
    text: |-
      In afwijking van het tweede lid kan een pasfoto worden geaccepteerd indien op grond van objectief vast te stellen
      fysieke of medische redenen, door de aanvrager niet kan worden voldaan aan alle in de fotomatrix opgenomen
      acceptatiecriteria. Bij gerede twijfel aan de medische redenen kan van de aanvrager worden verlangd, dat deze
      daartoe een door een bevoegde arts of medische instelling ondertekende verklaring overlegt.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel28
  - number: '28.5'
    text: |-
      In afwijking van het tweede lid kan een pasfoto van een aanvrager die de leeftijd van zes jaar nog niet heeft
      bereikt worden geaccepteerd, indien de foto voldoet aan de in de fotomatrix voor die leeftijdscategorie opgenomen
      minimum vereisten.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel28
  - number: 28a.1
    text: |-
      Bij het indienen van een aanvraag voor een reisdocument worden de afdrukken van twee vingers van de aanvrager
      opgenomen. Bij de aanvraag van een vervangende Nederlandse identiteitskaart worden geen vingerafdrukken opgenomen.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel28a
  - number: 28a.2
    text: |-
      Bij een aanvrager als bedoeld in de eerste zin van het eerste lid worden platte afdrukken van de linker- en rechter
      wijsvinger opgenomen voor opslag in het reisdocument. Indien de kwaliteit van de vingerafdrukken van de wijsvingers
      onvoldoende is, worden platte afdrukken van de middelvingers, ringvingers of duimen opgenomen.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel28a
  - number: 28a.3
    text: |-
      Indien van slechts één vinger de afdruk van voldoende kwaliteit kan worden opgenomen, wordt uitsluitend de afdruk
      van die vinger opgenomen.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel28a
  - number: 28a.4
    text: |-
      In afwijking van het eerste lid wordt van het opnemen van vingerafdrukken afgezien indien de aanvrager op het
      moment van het indienen van de aanvraag de leeftijd van twaalf jaar nog niet heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel28a
  - number: 28a.5
    text: |-
      Indien de daartoe aangewezen persoon van oordeel is dat het fysiek dan wel als gevolg van een tijdelijke
      verhindering onmogelijk is om van de aanvrager te verlangen dat bij hem op het moment van het indienen van de
      aanvraag twee vingerafdrukken worden opgenomen, wordt in ieder geval de afdruk opgenomen van de vinger waarbij dit
      volgens de daartoe aangewezen persoon wel mogelijk is. Bij gerede twijfel of het fysiek dan wel als gevolg van een
      tijdelijke verhindering onmogelijk is om twee vingerafdrukken op te nemen, kan van de aanvrager worden verlangd,
      dat deze daartoe een door een bevoegde arts of medische instelling ondertekende verklaring overlegt.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel28a
  - number: 28a.6
    text: |-
      Indien van de aanvrager geen vingerafdrukken worden opgenomen, wordt in de aanvraag de reden voor het niet opnemen
      vermeld.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel28a
  - number: '29'
    text: |-
      Indien de persoon aan wie het aangevraagde reisdocument moet worden verstrekt door leeftijd of een handicap niet in
      staat is zijn handtekening te plaatsen, wordt daarvan in de aanvraag melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel29
  - number: '30'
    text: |-
      Indien de aanvrager ingevolge [artikel 28, derde lid, van de wet][ref1] niet persoonlijk bij het indienen van de
      aanvraag is verschenen, wordt dit gegeven met de reden daarvan in de aanvraag vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel28
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '28'
  - number: '31.1'
    text: |-
      De verklaring van toestemming als bedoeld in de [artikelen 34 tot en met 37 van de wet][ref1] dient schriftelijk te
      worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel34
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '34'
  - number: '31.2'
    text: |-
      In de verklaring van toestemming worden tevens de naam en de handtekening vermeld van degene die de aanvraag ten
      behoeve van een handelingsonbekwame indient.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel31
  - number: '31.3'
    text: In de aanvraag wordt melding gemaakt van de overlegging van de betreffende verklaring van toestemming.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel31
  - number: '32.1'
    text: |-
      Op de procedure voor het verkrijgen van de nodige zekerheid over de identiteit van degene die het
      gezag over de minderjarige uitoefent of van de curator zijn [artikel 22][ref1] van deze regeling en
      [artikel 2.1 van het besluit][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0044308#Artikel2
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '22'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0044308
        artikel: '2'
  - number: '32.2'
    text: |-
      Indien degene die een verklaring van toestemming moet afgeven niet in persoon verschijnt, kan de aanvraag slechts
      in behandeling worden genomen indien uit de overgelegde schriftelijke verklaring van toestemming en eventuele
      andere overgelegde stukken met de nodige zekerheid kan worden afgeleid dat de verklaring van toestemming van de
      betreffende persoon afkomstig is.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel32
  - number: '32.3'
    text: |-
      Voor het verkrijgen van de nodige zekerheid over de bevoegdheid tot het afgeven van de verklaring van toestemming
      van degene die het gezag over de minderjarige uitoefent of van de curator wordt gebruik gemaakt van de door de
      betreffende persoon overgelegde stukken en de omtrent het gezag of de curatele in de basisadministratie opgenomen
      gegevens.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel32
  - number: '32.4'
    text: |-
      Indien onzekerheid bestaat over de bevoegdheid van degene die het gezag over de minderjarige uitoefent of van de
      curator wordt daarnaar een gericht onderzoek ingesteld.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel32
  - number: '37.1'
    text: De aanvrager kan de burgemeester verzoeken om een versnelde uitreiking van het aangevraagde reisdocument.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel37
  - number: '37.2'
    text: |-
      Indien de aanvrager verzoekt om de versnelde uitreiking van het aangevraagde reisdocument, wordt in de aanvraag
      voor het reisdocument een vermelding opgenomen waaruit blijkt dat het een spoedopdracht betreft.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel37
  - number: '37.3'
    text: |-
      In het geval van een spoedopdracht draagt de burgemeester er zorg voor dat de aanvraag nog dezelfde dag vóór
      16.00 uur de leverancier bereikt, opdat het uit te reiken reisdocument de daarop volgende werkdag op het reguliere
      tijdstip, doch uiterlijk 16.00 uur, op de uitgiftelocatie kan worden afgeleverd.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel37
  - number: '38.1'
    text: |-
      De daartoe aangewezen persoon vergelijkt, behoudens in het in [artikel 30][ref1] bedoelde geval, nauwkeurig de
      overgelegde foto van de aanvrager dan wel van degene ten behoeve van wie de aanvraag wordt ingediend met de persoon
      die voor hem staat en brengt deze foto op de bestemde plaats in het foto- en handtekeningformulier aan.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel30
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '30'
        hoofdstuk: III
        paragraaf: '1'
  - number: '38.2'
    text: |-
      De in het eerste lid bedoelde persoon ziet, behoudens in het in [artikel 29][ref1] bedoelde geval, er op toe dat in
      het foto- en handtekeningformulier op de bestemde plaats de duidelijk leesbare handtekening wordt geplaatst van de
      aanvrager dan wel van de persoon ten behoeve van wie de aanvraag van het reisdocument wordt gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel29
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '29'
        hoofdstuk: III
        paragraaf: '1'
  - number: '38.3'
    text: |-
      Het foto- en handtekeningformulier wordt door de in het eerste lid bedoelde persoon met gebruikmaking van het
      aanvraagstation gedigitaliseerd.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel38
  - number: '38.4'
    text: |-
      Het opnemen van de vingerafdrukken als bedoeld in [artikel 28a][ref1], geschiedt met gebruikmaking van het
      aanvraagstation.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel28a
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: 28a
        hoofdstuk: III
        paragraaf: '1'
  - number: '38.5'
    text: |-
      Indien de aanvrager omwille van bijzondere omstandigheden als genoemd in [artikel 28, derde lid, van de wet][ref1]
      niet in persoon verschijnt op de uitgiftelocatie worden zijn vingerafdrukken opgenomen met behulp van het mobiel
      vingerafdrukopname-apparaat.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel28
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '28'
  - number: '38.6'
    text: |-
      Indien de aanvrager zijn aanvraag niet indient op de uitgiftelocatie, kunnen zijn vingerafdrukken worden opgenomen
      met behulp van het mobiel vingerafdrukopname-apparaat.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel38
  - number: '39.1'
    text: |-
      Een aanvraag waarbij niet is voldaan aan het bepaalde in de [artikelen 2.1][ref1], [2.2][ref2],
      [2.6 tot en met 2.9][ref3] en [2.12 tot en met 2.17 van het besluit][ref4] en de [artikelen 12 tot en met 38][ref5]
      wordt niet in behandeling genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0044308#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0044308#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0044308#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0044308#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0012811#Artikel12
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0044308
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0044308
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0044308
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0044308
        artikel: '2'
      - id: ref5
        bwb_id: BWBR0012811
        artikel: '12'
        hoofdstuk: II
        paragraaf: '2'
  - number: '39.2'
    text: |-
      In de aanvraag voor een reisdocument voor vluchtelingen dan wel een reisdocument voor vreemdelingen wordt,
      afhankelijk van de nationaliteit van de persoon aan wie het reisdocument wordt uitgereikt, aangegeven welk land van
      de territoriale geldigheid is uitgesloten.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel39
  - number: '39.3'
    text: |-
      In de aanvraag voor een reisdocument voor vreemdelingen, uit te reiken aan een staatloze, wordt aangegeven dat
      diens status van staatloze in het reisdocument moet worden vermeld.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel39
  - number: '39.4'
    text: De daartoe aangewezen persoon vermeldt in de aanvraag de verstrekkende autoriteit.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel39
  - number: '40.1'
    text: |-
      De daartoe aangewezen persoon draagt zorg dat de aanvraaggegevens, genoemd in de
      [artikelen 21 tot en met 27][ref1], [30 tot en met 37][ref2] en [39][ref3] in de reisdocumentenmodule en de foto,
      vingerafdrukken en handtekening in het aanvraagstation worden vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0012811#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0012811#Artikel39
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '21'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0012811
        artikel: '30'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0012811
        artikel: '39'
        hoofdstuk: III
        paragraaf: '5'
  - number: '40.2'
    text: |-
      Indien bij de aanvraag voor het opnemen van de vingerafdrukken gebruik is gemaakt van het mobiel
      vingerafdrukopname-apparaat worden de gegevens uitsluitend verwerkt in een aanvraagstation dat zich op
      de uitgiftelocatie bevindt. Het mobiel vingerafdrukopname-apparaat wordt in het locale netwerk van de
      uitgiftelocatie aangesloten, waarna de daarin vastgelegde vingerafdrukken door het aanvraagstation uit het mobiel
      vingerafdrukopname-apparaat worden opgehaald en samengevoegd met de ingevolge [artikel 38, derde lid][ref1],
      gedigitaliseerde foto en handtekening.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel38
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '38'
        hoofdstuk: III
        paragraaf: '4'
  - number: '40.3'
    text: |-
      De in de reisdocumentenmodule en het aanvraagstation vastgelegde gegevens worden verwerkt en doorgezonden naar
      het reisdocumentenstation.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel40
  - number: '40.4'
    text: |-
      Nadat de aanvraaggegevens zijn doorgezonden aan het reisdocumentenstation wordt, indien de daartoe aangewezen
      ambtenaar, met inachtneming van het bij of krachtens de [wet][ref1] bepaalde, heeft beslist dat het aangevraagde
      reisdocument kan worden uitgereikt, in de aanvraag het feit van deze verstrekking vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005212
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0005212
  - number: '40.5'
    text: |-
      In de aanvraag voor een reisdocument waarbij sprake is van een beslissing tot verstrekking van een reisdocument
      waarvan de territoriale geldigheid beperkter is, wordt vermeld voor welke landen het reisdocument geldig is.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel40
  - number: '40.6'
    text: |-
      Indien de aanvraaggegevens zijn doorgezonden aan het reisdocumentenstation, maar de beslissing op de aanvraag is
      aangehouden, worden de in het vierde en vijfde lid genoemde gegevens in het reisdocumentenstation vastgelegd, nadat
      de verstrekking heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel40
  - number: '41'
    text: |-
      De in het aanvraagstation vastgelegde foto, handtekening en vingerafdrukken worden met de aanvraaggegevens, bedoeld
      in [artikel 40][ref1], samengevoegd tot een aanvraagbestand in het reisdocumentenstation.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel40
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '40'
        hoofdstuk: III
        paragraaf: '5'
  - number: '42'
    text: |-
      De daartoe aangewezen persoon zendt, nadat is vastgesteld dat het aangevraagde reisdocument kan worden uitgereikt,
      het aanvraagbestand met gebruikmaking van het reisdocumentenstation naar de leverancier van de reisdocumenten. Het
      te verzenden aanvraagbestand wordt met gebruikmaking van de aan hem toegekende identificatiekaart voorzien van een
      digitale handtekening.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel42
  - number: 42a
    text: |-
      De leverancier geeft uitvoering aan [artikel 1.6, eerste lid, van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044308#Artikel1
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0044308
        artikel: '1'
  - number: '43.1'
    text: |-
      De reisdocumenten en identificatiekaarten worden in ontvangst genomen door een daartoe aangewezen persoon als
      bedoeld in [artikel 81, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel81
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '81'
        hoofdstuk: XI
        paragraaf: '1'
  - number: '43.2'
    text: |-
      De in het eerste lid genoemde persoon toont de in [artikel 81, tweede lid][ref1], bedoelde machtiging tot
      ontvangstneming van de burgemeester en legitimeert zich, op verzoek van de besteller, met een identiteitsdocument
      als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '81'
        hoofdstuk: XI
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '43.3'
    text: |-
      De aflevering van de zending vindt plaats op het voor de desbetreffende uitgiftelocatie afgesproken tijdstip. Bij
      aflevering kan de besteller worden verplicht zich te identificeren met een door de distributeur aan haar werknemers
      beschikbaar gestelde legitimatie.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel43
  - number: '43.4'
    text: |-
      Indien de persoon die de zending in ontvangst neemt zich desgevraagd niet of niet voldoende kan legitimeren dan
      wel onvoldoende zekerheid bestaat met betrekking tot zijn bevoegdheid om de zending in ontvangst te nemen, dan
      wel om enige andere reden door een handelen of nalaten van de bevoegde autoriteit een veilige aflevering op de
      uitgiftelocatie niet mogelijk is, draagt de besteller de zending niet over.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel43
  - number: 43a.1
    text: |-
      De gepersonaliseerde reisdocumenten en identificatiekaarten die bestemd zijn voor de openbare
      lichamen, worden in Nederland bij het ministerie van Buitenlandse Zaken afgeleverd. De
      [artikelen 57 tot en met 60 van de Paspoortuitvoeringsregeling Buitenland 2001][ref1] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel57
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '57'
  - number: 43a.2
    text: |-
      De in het eerste lid bedoelde documenten worden door de transporteur afgeleverd bij de uitgiftelocatie in de
      openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel43a
  - number: 43a.3
    text: |-
      Op de uitgiftelocatie worden de in het eerste lid bedoelde documenten in ontvangst genomen door een daartoe
      aangewezen persoon als bedoeld in [artikel 82, eerste lid][ref1], die zich legitimeert met een geldig
      identiteitsdocument.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel82
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '82'
        hoofdstuk: XI
        paragraaf: '1'
  - number: 43a.4
    text: De aflevering van de zending vindt plaats op het voor de desbetreffende uitgiftelocatie afgesproken tijdstip.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel43a
  - number: 43a.5
    text: |-
      Indien de persoon die de zending in ontvangst neemt zich desgevraagd niet of niet voldoende kan legitimeren dan
      wel onvoldoende zekerheid bestaat met betrekking tot zijn bevoegdheid om de zending in ontvangst te nemen, dan
      wel om enige andere reden door een handelen of nalaten van de bevoegde autoriteit een veilige aflevering op de
      uitgiftelocatie niet mogelijk is, wordt de zending niet overgedragen.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel43a
  - number: 43b.1
    text: |-
      De gepersonaliseerde Nederlandse identiteitskaarten die bestemd zijn voor personen die in de basisadministratie
      van Aruba, Curaçao of Sint Maarten zijn ingeschreven en zijn aangevraagd bij de burgemeester van
      Haarlemmermeer op een vestiging van de Vertegenwoordiging van de Nederlandse regering bij de regeringen van
      Aruba, Curaçao en Sint Maarten, worden in Nederland bij de burgemeester van Haarlemmermeer afgeleverd. De
      [artikelen 57 tot en met 60 van de Paspoortuitvoeringsregeling Buitenland 2001][ref1] zijn van overeenkomstige
      toepassing, met dien verstande dat in plaats van ‘het Ministerie van Buitenlandse Zaken’ of ‘het ministerie’ wordt
      gelezen ‘de burgemeester van Haarlemmermeer’ en in plaats van ‘de uitgiftelocatie’ of ‘de uitgiftelocatie in het
      buitenland’ wordt gelezen ‘de vestigingen van de Vertegenwoordiging van de Nederlandse regering bij de regeringen
      van Aruba, Curaçao en Sint Maarten’.


      [ref1]: https://wetten.overheid.nl/BWBR0012810#Artikel57
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel43b
    references:
      - id: ref1
        bwb_id: BWBR0012810
        artikel: '57'
  - number: 43b.2
    text: |-
      De in het eerste lid bedoelde documenten worden door de transporteur afgeleverd bij de vestigingen van de
      Vertegenwoordiging van de Nederlandse regering bij de regeringen van Aruba, Curaçao en Sint Maarten.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel43b
  - number: 43b.3
    text: |-
      Op de vestigingen van de Vertegenwoordiging van de Nederlandse regering bij de regeringen van Aruba, Curaçao en
      Sint Maarten worden de in het eerste lid bedoelde documenten in ontvangst genomen door een daartoe aangewezen
      persoon als bedoeld in [artikel 82a, eerste lid][ref1], die zich legitimeert met een geldig identiteitsdocument.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel82a
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel43b
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: 82a
        hoofdstuk: XI
        paragraaf: '1'
  - number: 43b.4
    text: De aflevering van de zending vindt plaats op het voor de desbetreffende locatie afgesproken tijdstip.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel43b
  - number: '44.1'
    text: |-
      De tot ontvangst bevoegde persoon controleert in het bijzijn van de besteller of de zending voor hem bestemd is.
      Indien dit het geval is en het pakket is onbeschadigd, vindt de overdracht plaats.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel44
  - number: '44.2'
    text: |-
      Indien de zending niet voor de uitgiftelocatie bestemd is, afwijkingen vertoont, beschadigd is dan wel documenten
      ontbreken wordt gehandeld overeenkomstig bijlage D. Het in kennis stellen van de leverancier geschiedt met
      gebruikmaking van het daartoe door de Minister van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde
      formulier.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel44
  - number: '44.3'
    text: |-
      Bij de constatering dat het pakket beschadigd is, wordt het pakket in het bijzijn van de besteller in een voor het
      publiek afgesloten ruimte gecontroleerd. Ook in geval van beschadiging wordt het pakket in ontvangst genomen.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel44
  - number: '44.4'
    text: |-
      Indien de tot ontvangst bevoegde persoon vaststelt dat er documenten zijn beschadigd of ontbreken, wordt hiervan
      door de besteller een proces-verbaal opgemaakt.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel44
  - number: '44.5'
    text: Het afschrift van het proces-verbaal wordt door de autoriteit bewaard.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel44
  - number: '45.1'
    text: |-
      De daartoe aangewezen persoon gaat na of de in de zending aanwezige documenten overeenkomen met de aanvraagnummers
      in het op de zending betrekking hebbende elektronische bericht in het reisdocumentenstation, dat door de
      leverancier is verzonden.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel45
  - number: '45.2'
    text: |-
      In het reisdocumentenstation wordt geregistreerd of een reisdocument overeenkomstig de opgave in het elektronisch
      bericht, bedoeld in het eerste lid, is ontvangen, al dan niet is beschadigd en op de juiste wijze is geproduceerd
      en gepersonaliseerd. Deze gegevens kunnen in verband met de raadpleging daarvan tevens op elektronische wijze
      worden doorgegeven aan de reisdocumentenmodule.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel45
  - number: '46.1'
    text: |-
      De reisdocumenten, die na de controle van de zending als bedoeld in [artikel 44][ref1] of [45][ref2] in
      een gemeente voor een andere burgemeester blijken te zijn bestemd, worden op de uitgiftelocatie op de in
      [artikel 91][ref3] aangegeven wijze opgeslagen tot ze worden opgehaald door de distributeur.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0012811#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0012811#Artikel91
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '44'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0012811
        artikel: '45'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0012811
        artikel: '91'
        hoofdstuk: XII
  - number: '46.2'
    text: |-
      Het overdragen van de verkeerd geleverde documenten aan de distributeur geschiedt overeenkomstig [bijlage D][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012811
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0012811
  - number: 46a
    text: |-
      De documenten die na de controle van de zending als bedoeld in de [artikelen 44][ref1] of [45][ref2] in de openbare
      lichamen voor een andere autoriteit blijken te zijn bestemd, worden op de uitgiftelocatie vernietigd op de in
      [artikel 67, eerste lid][ref3], aangegeven wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0012811#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0012811#Artikel67
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel46a
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '44'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0012811
        artikel: '45'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0012811
        artikel: '67'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: 46b
    text: |-
      De documenten die na de controle van de zending als bedoeld in de [artikelen 44][ref1] of [45][ref2] in Aruba,
      Curaçao en Sint Maarten voor een andere autoriteit blijken te zijn bestemd, worden op de vestigingen van de
      Vertegenwoordiging van de Nederlandse regering bij de regeringen van Aruba, Curaçao en Sint Maarten vernietigd op
      de in [artikel 67, eerste lid][ref3], aangegeven wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0012811#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0012811#Artikel67
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel46b
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '44'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0012811
        artikel: '45'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0012811
        artikel: '67'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: '47.1'
    text: |-
      Indien reisdocumenten niet op het verwachte tijdstip worden ontvangen, wordt op een speciaal daarvoor bestemd
      telefoonnummer informatie ingewonnen over de te verwachten levertijd.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel47
  - number: '47.2'
    text: |-
      In het geval de zending zich nog onder de distributeur bevindt, draagt deze er zorg voor dat de zending alsnog de
      volgende dag wordt afgeleverd bij de uitgiftelocatie in het Europese deel van Nederland, onderscheidenlijk bij de
      Minister van Buitenlandse Zaken, indien de zending bestemd is voor een gezaghebber.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel47
  - number: '47.3'
    text: |-
      In het geval reisdocumenten op een verkeerde uitgiftelocatie in het Europese deel van Nederland zijn afgeleverd,
      draagt de leverancier er zorg voor dat de desbetreffende documenten, zo mogelijk nog dezelfde dag, op de juiste
      uitgiftelocatie in het Europese deel van Nederland worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel47
  - number: '47.4'
    text: |-
      Het in ontvangst nemen van reisdocumenten als bedoeld in het derde lid geschiedt overeenkomstig [bijlage D][ref1],
      met gebruikmaking van het daartoe door de distributeur beschikbaar gestelde formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0012811
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0012811
  - number: '47.5'
    text: |-
      In het geval de zending zich nog onder de transporteur bevindt, draagt deze er zorg voor dat de zending alsnog zo
      spoedig mogelijk wordt afgeleverd.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel47
  - number: '48'
    text: |-
      Indien een reisdocument is beschadigd, onjuist is geproduceerd of gepersonaliseerd, dan wel niet op het verwachte
      tijdstip is ontvangen en niet alsnog ingevolge [artikel 47, tweede, derde of vijfde lid][ref1], zal worden bezorgd,
      wordt het op het reisdocument betrekking hebbende aanvraagbestand opnieuw verzonden aan de leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel47
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '47'
        hoofdstuk: IV
  - number: '49'
    text: 'Reisdocumenten die:'
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel49
  - number: 49.a
    text: |-
      bij de controle van de zending in het reisdocumentenstation dan wel bij de uitreiking onjuist blijken te zijn
      geproduceerd of gepersonaliseerd, dan wel blijken te zijn beschadigd;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel49
  - number: 49.b
    text: |-
      na het verwachte tijdstip zijn ontvangen en waarvan inmiddels het daarop betrekking hebbende aanvraagbestand
      ingevolge [artikel 48][ref1] opnieuw is verzonden, worden per aangetekende post, met gebruikmaking van het daartoe
      door de Minister van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde formulier, teruggestuurd aan
      de leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel48
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '48'
        hoofdstuk: IV
  - number: '51.1'
    text: |-
      Indien de aanvrager op het moment van de uitreiking ingezetene is van een andere gemeente, wordt het document
      uitgereikt in die gemeente.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel51
  - number: '51.2'
    text: |-
      Het reisdocument wordt per aangetekende post verstuurd naar het hoofd burgerzaken van de gemeente waarvan de
      aanvrager inmiddels ingezetene is.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel51
  - number: '51.3'
    text: |-
      De burgemeester van de gemeente, bedoeld in het tweede lid, gaat tot uitreiking van het reisdocument over met
      in achtneming van [artikel 4.6 van het besluit][ref1]. De op de uitreiking betrekking hebbende gegevens worden
      geregistreerd in de basisregistratie personen.


      [ref1]: https://wetten.overheid.nl/BWBR0044308#Artikel4
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0044308
        artikel: '4'
  - number: '51.4'
    text: |-
      Van de uitreiking van het reisdocument wordt met gebruikmaking van de daartoe door de Minister van Binnenlandse
      Zaken en Koninkrijksrelaties beschikbaar gestelde dienst kennis gegeven aan de burgemeester van de gemeente waar de
      aanvraag in behandeling is genomen.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel51
  - number: '51.5'
    text: |-
      De burgemeester die een kennisgeving ontvangt als bedoeld in het vierde lid registreert de uitreiking van het
      reisdocument in het reisdocumentenstation en de reisdocumentenmodule, waarin de gegevens betreffende de aanvraag
      zijn vastgelegd.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel51
  - number: '52'
    text: |-
      Indien het bij de uitreiking van het aangevraagde reisdocument in te leveren reisdocument mogelijk voorwerp is
      van fraude, is vermist op andere gronden dan ingevolge de [wet][ref1] door een daartoe bevoegde autoriteit is
      ingenomen, zijn de [artikelen 60][ref2] en [61][ref3] alsnog van toepassing en worden de gegevens, bedoeld in
      [artikel 27, tweede lid][ref4], alsnog in de aanvraag met betrekking tot het uit te reiken document opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005212
      [ref2]: https://wetten.overheid.nl/BWBR0012811#Artikel60
      [ref3]: https://wetten.overheid.nl/BWBR0012811#Artikel61
      [ref4]: https://wetten.overheid.nl/BWBR0012811#Artikel27
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0005212
      - id: ref2
        bwb_id: BWBR0012811
        artikel: '60'
        hoofdstuk: VII
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0012811
        artikel: '61'
        hoofdstuk: VII
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0012811
        artikel: '27'
        hoofdstuk: III
        paragraaf: '1'
  - number: '54.1'
    text: |-
      Uitsluitend indien op grond van [artikel 4.2, eerste lid, van het besluit][ref1] door een burgemeester als bedoeld
      in dat artikel een reisdocument wordt verstrekt en de aanvrager bij de aanvraag aannemelijk heeft gemaakt dat van
      hem redelijkerwijs niet kan worden gevergd dat hij in persoon verschijnt bij de uitreiking, wordt het reisdocument
      per aangetekende post aan hem toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0044308#Artikel4
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0044308
        artikel: '4'
  - number: '54.2'
    text: |-
      De inlevering van de Nederlandse reisdocumenten, bedoeld in [artikel 32 van de wet][ref1], geschiedt in dat geval
      door deze reisdocumenten per aangetekende post toe te sturen aan de in het eerste lid bedoelde autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel32
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '32'
  - number: '54.3'
    text: |-
      Tot toezending van het uit te reiken reisdocument wordt niet overgegaan dan na ontvangst van de ingevolge het
      tweede lid toegestuurde reisdocumenten.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel54
  - number: '55.1'
    text: |-
      De daartoe aangewezen persoon registreert de uitreiking van een reisdocument, alsmede de inlevering van het vorige
      reisdocument, in de reisdocumentenmodule en geeft dit door aan het reisdocumentenstation.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel55
  - number: '55.2'
    text: |-
      Indien bij de uitreiking blijkt dat het reisdocument is beschadigd, onjuist is geproduceerd of gepersonaliseerd
      dan wel uit de opslag is verdwenen, wordt dit in de reisdocumentenmodule geregistreerd en doorgegeven aan het
      reisdocumentenstation.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel55
  - number: '55.3'
    text: |-
      Indien de registratie, bedoeld in het eerste lid, niet kan plaatsvinden in de reisdocumentenmodule, geschiedt deze
      in eerste instantie in het reisdocumentenstation en wordt dit later alsnog doorgegeven aan de reisdocumentenmodule.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel55
  - number: '55.4'
    text: |-
      Indien binnen drie maanden na de datum van ontvangst bij de uitgiftelocatie geen uitreiking van een geleverd
      reisdocument heeft plaatsgevonden, wordt dit geregistreerd in de reisdocumentenmodule en het reisdocumentenstation.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel55
  - number: '56'
    text: |-
      Bij uitreiking van een reisdocument, niet zijnde een nooddocument, worden de daarop betrekking hebbende gegevens
      geregistreerd in de basisadministratie waarin de houder als ingezetene is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel56
  - number: 56a.1
    text: |-
      De Minister van Binnenlandse Zaken en Koninkrijksrelaties verzendt direct na uitreiking de persoonlijke PIN-code en
      de intrekkingscode aan de houder van de Nederlandse identiteitskaart.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel56a
  - number: 56a.2
    text: |-
      Indien de houder de toegezonden PIN-code met intrekkingscode heeft verloren, verstrekt de Minister van Binnenlandse
      Zaken en Koninkrijksrelaties op een verzoek van de houder:
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel56a
  - number: 56a.2.a
    text: |-
      dat binnen zes weken na uitreiking is gedaan, deze codes opnieuw, tenzij de houder tijdens het activeringsproces
      van het publiek identificatiemiddel de PIN-code heeft gewijzigd of de intrekkingscode heeft gebruikt;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel56a
  - number: 56a.2.b
    text: |-
      dat later dan zes weken na uitreiking is gedaan, nieuwe codes, tenzij de houder tijdens het activeringsproces van
      het publiek identificatiemiddel de PIN-code heeft gewijzigd of de intrekkingscode heeft gebruikt;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel56a
  - number: 56a.2.c
    text: |-
      dat een verzoek betreft in verband met een PIN-code die al tijdens het activeringsproces van het publieke middels
      is gewijzigd, na identificatie nieuwe codes, tenzij de houder de intrekkingscode heeft gebruikt.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel56a
  - number: 56a.3
    text: |-
      In afwijking van het eerste en tweede lid verzendt de Minister van Binnenlandse Zaken en Koninkrijksrelaties de
      codes aan de gezaghebber, indien de gezaghebber de uitreiking bevoegde autoriteit is. De houder kan de codes na
      identificatie ophalen bij de gezaghebber.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel56a
  - number: 56a.4
    text: |-
      In afwijking van het eerste en tweede lid verzendt de Minister van Binnenlandse Zaken en Koninkrijksrelaties
      de codes aan de burgemeester van Haarlemmermeer, indien de houder van de Nederlandse identiteitskaart in de
      basisadministratie van Aruba, Curaçao of Sint Maarten is ingeschreven en de aanvraag is gedaan bij de burgemeester
      van Haarlemmermeer op een vestiging van de Vertegenwoordiging van de Nederlandse regering bij de regeringen
      van Aruba, Curaçao en Sint Maarten. De houder kan de codes na identificatie ophalen bij de vestiging van de
      Vertegenwoordiging van de Nederlandse regering bij de regeringen van Aruba, Curaçao en Sint Maarten die wordt
      gemeld in een bericht daaromtrent aan de houder namens de burgemeester van Haarlemmermeer.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel56a
  - number: '58.1'
    text: |-
      De burgemeester of de gezaghebber die een aanvraag in behandeling neemt dan wel een ingehouden reisdocument
      ontvangt betreffende een persoon die blijkens de in [artikel 5][ref1] bedoelde administratie in het register
      paspoortsignaleringen is opgenomen, verzoekt ingevolge [artikel 44, tweede lid, van de wet][ref2] de Minister van
      Binnenlandse Zaken en Koninkrijksrelaties hem mede te delen of zulks nog steeds het geval is.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel44
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '5'
        hoofdstuk: I
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0005212
        artikel: '44'
  - number: '58.2'
    text: |-
      De burgemeester of de gezaghebber die ingevolge [artikel 44, derde lid, van de wet][ref1] de in het register
      paspoortsignaleringen opgenomen gegevens van een persoon wenst te ontvangen, doet daartoe een verzoek aan de
      Minister van Binnenlandse Zaken en Koninkrijksrelaties. Dit verzoek kan ook tegelijkertijd met het in het eerste
      lid bedoelde verzoek worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel44
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '44'
  - number: '59'
    text: |-
      De burgemeester of de gezaghebber geeft de Minister van Binnenlandse Zaken en Koninkrijksrelaties met gebruikmaking
      van het daartoe door de Minister van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde formulier
      kennis van zijn beslissing, bedoeld in [artikel 45, tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel45
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '45'
  - number: '60.1'
    text: |-
      Indien een eerder uitgereikt reisdocument mogelijk voorwerp is van fraude, is vermist of op andere gronden
      dan ingevolge de [wet][ref1] door een daartoe bevoegde autoriteit is ingenomen, kan de houder dit gegeven
      overeenkomstig het tweede tot en met zesde lid, melden aan:


      [ref1]: https://wetten.overheid.nl/BWBR0005212
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0005212
  - number: 60.1.a
    text: de burgemeester van de gemeente waarvan hij ingezetene is;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel60
  - number: 60.1.b
    text: |-
      een burgemeester als bedoeld in de [artikelen 3.2., eerste lid, onderdeel a][ref1], en
      [4.2., eerste lid, onderdeel a, van het besluit][ref2], indien de houder niet in de basisregistratie personen als
      ingezetene is ingeschreven;


      [ref1]: https://wetten.overheid.nl/BWBR0044308#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0044308#Artikel4
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0044308
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0044308
        artikel: '4'
  - number: 60.1.c
    text: de gezaghebber van een openbaar lichaam;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel60
  - number: 60.1.d
    text: |-
      de burgemeester van Haarlemmermeer, bedoeld in [artikel 3.2, tweede lid][ref1], en
      [artikel 4.2, tweede lid, van het besluit][ref2], indien de houder in de basisadministratie van Aruba, Curaçao of
      Sint Maarten is ingeschreven, het reisdocument een Nederlandse identiteitskaart betreft en de aanvraag is gedaan
      bij de burgemeester van Haarlemmermeer op een vestiging van de Vertegenwoordiging van de Nederlandse regering bij
      de regeringen van Aruba, Curaçao en Sint Maarten;


      [ref1]: https://wetten.overheid.nl/BWBR0044308#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0044308#Artikel4
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0044308
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0044308
        artikel: '4'
  - number: 60.1.e
    text: |-
      een burgemeester als bedoeld in de [artikelen 3.2., eerste lid, onderdeel b][ref1], en
      [4.2., eerste lid, onderdeel b, van het besluit][ref2], indien de houder verblijft in een penitentiaire inrichting
      in een in [artikel 7, tweede lid][ref3], aangewezen gemeente en in de basisregistratie personen als ingezetene is
      ingeschreven; of


      [ref1]: https://wetten.overheid.nl/BWBR0044308#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0044308#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0012811#Artikel7
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0044308
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0044308
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0012811
        artikel: '7'
        hoofdstuk: I
        paragraaf: '5'
  - number: 60.1.f
    text: de Minister van Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel60
  - number: '60.2'
    text: |-
      De melding van mogelijke fraude vindt in de in het eerste lid, onder a tot en met e, bedoelde gevallen plaats
      door middel van een door de houder ten overstaan van de daartoe door de burgemeester of de gezaghebber aangewezen
      persoon af te leggen schriftelijke verklaring, overeenkomstig het daartoe door de Minister van Binnenlandse Zaken
      en Koninkrijksrelaties beschikbaar gestelde formulier. Bij de melding van mogelijke fraude levert de houder zijn
      reisdocument in. Indien het reisdocument is vermist wordt een melding van vermissing gedaan, bedoeld in het vierde
      lid.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel60
  - number: '60.3'
    text: |-
      De melding van mogelijke fraude bedoeld in het in het eerste lid, onder f, vindt plaats door een elektronische
      verklaring overeenkomstig het daartoe door de Minister van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar
      gestelde formulier, indien de houder op verzoek van de burgemeester van de in het eerste lid, onder a, bedoelde
      gemeente, heeft ingestemd met het doen van een elektronische melding. De vaststelling van de juistheid van de
      identiteit van de houder geschiedt door middel van DigiD op basis van ten minste een twee-factoren-authenticatie,
      dan wel een andere en minstens even betrouwbare authenticatiemethode. De houder levert het reisdocument zo spoedig
      mogelijk in bij de in het eerste lid, onder a, bedoelde gemeente.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel60
  - number: '60.4'
    text: |-
      De melding van een vermissing vindt in de in het eerste lid, onder a tot en met e, bedoelde gevallen plaats door
      middel van een door de houder ten overstaan van de daartoe door de burgemeester of de gezaghebber aangewezen
      persoon af te leggen schriftelijke verklaring, overeenkomstig het daartoe door de Minister van Binnenlandse Zaken
      en Koninkrijksrelaties beschikbaar gestelde formulier. Indien een proces-verbaal van de politie wordt overgelegd,
      wordt daarvan een kopie gemaakt die aan de schriftelijke verklaring omtrent de vermissing wordt toegevoegd. De
      melding van een vermissing aan een burgemeester kan tevens elektronisch geschieden, overeenkomstig het daartoe door
      de Minister van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde formulier, indien de burgemeester
      deze weg beschikbaar heeft gesteld. In het geval van een elektronische melding geschiedt de vaststelling van
      de juistheid van de identiteit van de houder door middel van DigiD op basis van ten minste een twee-factoren-
      authenticatie, dan wel een ander en minstens even betrouwbare authenticatiemethode.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel60
  - number: '60.5'
    text: |-
      De melding van een vermissing bedoeld in het eerste lid, onder f, vindt plaats door een elektronische verklaring,
      overeenkomstig het daartoe door de Minister van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde
      formulier, indien de houder op verzoek van de burgemeester van de in het eerste lid, onder a, bedoelde gemeente,
      heeft ingestemd met het doen van een elektronische melding. De vaststelling van de identiteit van de houder
      geschiedt door middel van DigiD op basis van ten minste een twee-factoren-authenticatie, dan wel een andere en
      minstens even betrouwbare authenticatiemethode.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel60
  - number: '60.6'
    text: |-
      De melding van de inname van een uitgereikt reisdocument op andere gronden dan ingevolge de [wet][ref1] door een
      daartoe bevoegde autoriteit vindt plaats door middel van het overleggen van een door de desbetreffende autoriteit
      afgegeven schriftelijke verklaring omtrent de inname, aan de daartoe door de burgemeester of de gezaghebber
      aangewezen persoon. De daartoe aangewezen persoon maakt een kopie van deze verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0005212
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0005212
  - number: '60.7'
    text: |-
      De schriftelijke verklaring omtrent mogelijke fraude, bedoeld in het tweede lid, de schriftelijke of elektronische
      verklaring omtrent de vermissing, bedoeld in het vierde lid, dan wel de kopie van de schriftelijke verklaring die
      omtrent de inname is overgelegd, bedoeld in het zesde lid, wordt bewaard in de reisdocumentenadministratie in de
      gemeente of het openbaar lichaam waar de in het eerste lid bedoelde melding is gedaan.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel60
  - number: '60.8'
    text: |-
      Mogelijke fraude, vermissing of inname op andere gronden dan ingevolge de [wet][ref1] door een daartoe bevoegde
      autoriteit van een uitgereikt reisdocument wordt terstond opgenomen in de basisadministratie waarin de houder als
      ingezetene is ingeschreven, waarbij een inname en mogelijke fraude worden opgenomen als een inhouding.


      [ref1]: https://wetten.overheid.nl/BWBR0005212
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0005212
  - number: '61.1'
    text: |-
      Met het oog op vermelding daarvan in het register vermiste of vervallen reisdocumenten, wordt van mogelijke fraude
      terstond melding gedaan aan de Minister van Binnenlandse Zaken en Koninkrijksrelaties, met gebruikmaking van de
      daartoe door de Minister van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde dienst.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel61
  - number: '61.2'
    text: |-
      Met het oog op vermelding daarvan in het register vermiste of vervallen reisdocumenten, wordt van een vermissing
      terstond melding gedaan aan de Minister van Binnenlandse Zaken en Koninkrijksrelaties door middel van verstrekking
      van dit gegeven uit de basisregistratie personen. Indien de melding wordt gedaan door of namens de gezaghebber van
      een openbaar lichaam of door de burgemeester, bedoeld in de [artikelen 3.2., eerste lid, onderdeel a][ref1], en
      [4.2., eerste lid, onderdeel a, van het besluit][ref2] en de burgemeester van Haarlemmermeer, bedoeld in artikel
      3.2., tweede lid, en artikel 4.2., tweede lid, van het besluit, wordt dit gedaan met gebruikmaking van de daartoe
      door de Minister van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0044308#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0044308#Artikel4
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0044308
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0044308
        artikel: '4'
  - number: 61a.1
    text: |-
      De Minister die het aangaat kan een reisdocument als vermist opgeven bij de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties, met het oog op de vermelding daarvan in het register vermiste of vervallen reisdocumenten,
      indien:
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel61a
  - number: 61a.1.a
    text: |-
      de houder van het reisdocument is opgenomen in het register paspoortsignaleringen op de grond van
      [artikel 23 van de wet][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel23
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel61a
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '23'
  - number: 61a.1.b
    text: |-
      de Minister die het aangaat het gegronde vermoeden heeft dat de houder de feitelijke beschikking over zijn
      reisdocument buiten het Koninkrijk heeft overgedragen aan een derde, anders dan door of ten behoeve van handelingen
      van een daartoe bevoegde autoriteit.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel61a
  - number: 61a.2
    text: |-
      De Minister die het aangaat geeft het reisdocument als vermist op met gebruikmaking van de daartoe door de Minister
      van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde dienst.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel61a
  - number: '62.1'
    text: |-
      De burgemeester of de gezaghebber die een reisdocument heeft ingehouden dan wel bij wie een reisdocument is
      ingeleverd van een houder, die in verband met het bepaalde in de [artikelen 18 tot en met 24 van de wet][ref1] in
      het register paspoortsignaleringen is opgenomen en ten aanzien van wie hij niet bevoegd is tot vervallenverklaring,
      zendt dit reisdocument per aangetekende post en met vermelding van de reden van doorzending terstond door aan:


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel18
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '18'
  - number: 62.1.a
    text: de burgemeester van de gemeente of de gezaghebber van het openbaar lichaam waarvan de houder ingezetene is, dan wel
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel62
  - number: 62.1.b
    text: de burgemeester van Den Haag, indien de houder geen ingezetene van een gemeente of openbaar lichaam is.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel62
  - number: '62.2'
    text: |-
      De burgemeester of de gezaghebber aan wie een reisdocument ten onrechte is doorgezonden, draagt er zorg voor dat
      het reisdocument alsnog op de in het eerste lid bedoelde wijze aan de tot vervallenverklaring bevoegde burgemeester
      of gezaghebber wordt toegezonden.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel62
  - number: '63.1'
    text: |-
      De burgemeester of de gezaghebber die een reisdocument heeft ingehouden of bij wie een reisdocument is ingeleverd
      dan wel die een gevonden reisdocument heeft ontvangen, dat blijkens [artikel 7.1 van het besluit][ref1] definitief
      aan het verkeer moet worden onttrokken en daartoe niet bevoegd is, zendt dit reisdocument per aangetekende
      post en met vermelding van de reden van doorzending terstond aan de Minister van Buitenlandse Zaken, indien
      het een diplomatiek paspoort, een dienstpaspoort of een door de Minister van Buitenlandse Zaken op grond van
      [artikel 15, tweede lid, van de wet][ref2] aan een vreemdeling verstrekt laissez-passer betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0044308#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel15
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0044308
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005212
        artikel: '15'
  - number: '63.2'
    text: |-
      Indien het een op grond van [artikel 16, eerste lid, van de wet][ref1] verstrekt nooddocument betreft, is de
      burgemeester of de gezaghebber bevoegd dit namens de Minister van Binnenlandse Zaken en Koninkrijksrelaties
      definitief aan het verkeer te onttrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel16
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '16'
  - number: '64.1'
    text: |-
      Behoudens het bepaalde in het tweede lid worden ingehouden of ingeleverde reisdocumenten, die niet strafrechtelijk
      in beslag zijn genomen, door de plaatselijke politie met een begeleidende brief per aangetekende post gezonden aan:
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel64
  - number: 64.1.a
    text: de burgemeester van de gemeente of de gezaghebber van het openbaar lichaam waarvan de houder ingezetene is, dan wel
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel64
  - number: 64.1.b
    text: |-
      de burgemeester of de gezaghebber ter plaatse, indien niet bekend is van welke gemeente of welk openbaar lichaam de
      houder ingezetene is, dan wel
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel64
  - number: 64.1.c
    text: |-
      de Minister van Buitenlandse Zaken, indien het een diplomatiek paspoort, een dienstpaspoort of een op grond van
      [artikel 15, tweede lid, van de wet][ref1] verstrekt laissez-passer betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel15
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '15'
  - number: '64.2'
    text: |-
      Indien het reisdocument op grond van een daartoe strekkende vermelding in het opsporingsregister is ingehouden,
      wordt terstond contact opgenomen met de Minister van Binnenlandse Zaken en Koninkrijksrelaties ten einde te
      vernemen aan welke autoriteit het reisdocument moet worden doorgezonden.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel64
  - number: '64.3'
    text: Bij inhouding of inlevering wordt aan de betrokken persoon een ontvangstbewijs verstrekt.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel64
  - number: '64.4'
    text: 'De in het eerste lid bedoelde begeleidende brief vermeldt de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel64
  - number: 64.4.a
    text: geslachtsnaam, voornamen, geboortedatum, geboorteplaats en woonplaats van de houder;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel64
  - number: 64.4.b
    text: het nummer van het reisdocument;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel64
  - number: 64.4.c
    text: de autoriteit die het reisdocument heeft verstrekt en het einde van de geldigheidsduur;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel64
  - number: 64.4.d
    text: de datum en de reden van inhouding of inlevering van het reisdocument.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel64
  - number: '64.5'
    text: |-
      Gevonden reisdocumenten worden met een opgave van de documentnummers ingeleverd bij de in het eerste lid genoemde
      autoriteiten.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel64
  - number: '65.1'
    text: |-
      De burgemeester of de gezaghebber deelt met het oog op een vermelding in het register paspoortsignaleringen op
      grond van [artikel 47, derde lid, van de wet][ref1] de Minister van Binnenlandse Zaken en Koninkrijksrelaties
      de gegevens mede van de houder van een reisdocument dat van rechtswege is vervallen, indien de houder weigert het
      reisdocument in te leveren dan wel de woon- of verblijfplaats van de houder niet kan worden achterhaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel47
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '47'
  - number: '65.2'
    text: |-
      De autoriteit die het in het eerste lid bedoelde reisdocument heeft ingehouden, dan wel bij wie het desbetreffende
      reisdocument is ingeleverd deelt met het oog op de verwijdering van de in het eerste lid bedoelde vermelding uit
      het register paspoortsignaleringen de Minister van Binnenlandse Zaken en Koninkrijksrelaties zulks terstond mede.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel65
  - number: '65.3'
    text: |-
      De in het eerste en tweede lid bedoelde mededeling geschiedt met gebruikmaking van het daartoe door de Minister van
      Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde formulier.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel65
  - number: '65.4'
    text: |-
      Van het van rechtswege vervallen van een reisdocument ingevolge
      [artikel 47, eerste lid, onder a, b, c, e, f of h van de wet][ref1] wordt, met het oog op de vermelding daarvan in
      het register vermiste of vervallen reisdocumenten, terstond melding gedaan aan de Minister van Binnenlandse Zaken
      en Koninkrijksrelaties door verstrekking van dit gegeven uit de basisadministratie, dan wel met gebruikmaking van
      het daartoe door de Minister van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde formulier indien
      verstrekking van dit gegeven uit de basisadministratie niet mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel47
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '47'
  - number: '65.5'
    text: |-
      De in het register vermiste of vervallen reisdocumenten opgenomen gegevens worden na de datum van opname bewaard
      gedurende een periode:
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel65
  - number: 65.5.a
    text: 11 jaar indien de geldigheidsduur van het document 5 jaar of korter is;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel65
  - number: 65.5.b
    text: 16 jaar indien de geldigheidsduur van het document langer dan 5 jaar is.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel65
  - number: '65.6'
    text: |-
      Van het van rechtswege vervallen van een reisdocument ingevolge [artikel 47, eerste lid, onder i, van de wet][ref1]
      wordt, met het oog op de vermelding daarvan in het register vermiste of vervallen reisdocumenten, terstond melding
      gedaan aan de Minister van Binnenlandse Zaken en Koninkrijksrelaties door Onze Minister die het aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel47
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '47'
  - number: '67.1'
    text: |-
      Het deugdelijk vernietigen van een reisdocument dat definitief aan het verkeer wordt onttrokken, geschiedt door
      het reisdocument op gecontroleerde wijze te verbranden of te versnipperen, zodat reconstructie van het reisdocument
      niet meer mogelijk is.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel67
  - number: '67.2'
    text: |-
      Op verzoek van de houder wordt diens nationaal paspoort, Nederlandse identiteitskaart, faciliteitenpaspoort, tweede
      paspoort, reisdocument voor vluchtelingen of reisdocument voor vreemdelingen, na inlevering, definitief aan het
      verkeer onttrokken door het document onbruikbaar gemaakt aan hem terug te geven.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel67
  - number: '67.3'
    text: |-
      Het onbruikbaar maken geschiedt door het aanbrengen van drie ponsgaten (elk van ten minste 12 mm) door het gehele
      reisdocument op zodanige wijze dat elk in het reisdocument aangebrachte kinegram gedeeltelijk en de aangebrachte
      chip geheel onbruikbaar worden gemaakt. Voordat het reisdocument wordt teruggegeven aan de houder, wordt
      gecontroleerd of de chip onbruikbaar is.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel67
  - number: '67.4'
    text: |-
      Indien het ingeleverde reisdocument bladzijden met een nog geldig visum of een geldige verblijfstitel bevat en
      in verband daarmee het verzoek is gedaan, bedoeld in [artikel 26, tweede lid][ref1], worden de desbetreffende
      bladzijden en het documentnummer intact gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel26
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '26'
        hoofdstuk: III
        paragraaf: '1'
  - number: '67.5'
    text: |-
      Een reisdocument, dat ingevolge [artikel 7.1, eerste lid, onder c, van het besluit][ref1], ten gevolge van misdruk
      of verkeerde personalisatie is ingehouden of ingeleverd, wordt deugdelijk vernietigd overeenkomstig het eerste
      lid nadat het per aangetekende post, met gebruikmaking van het daartoe door de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties beschikbaar gesteld formulier, is teruggestuurd aan de leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0044308#Artikel7
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0044308
        artikel: '7'
  - number: '67.6'
    text: |-
      De in [artikel 7.1, eerste lid, onder d, van het besluit][ref1], en in het tweede lid bedoelde
      teruggave van een reisdocument vindt niet plaats, indien het reisdocument op grond van
      [artikel 47, eerste lid, onder a, b, c, g, h of i, van de wet][ref2] van rechtswege is vervallen, op grond van
      [54, eerste lid, onder b, c en e, van de wet][ref3] is ingehouden, dan wel [artikel 97, tweede lid][ref4], of
      [artikel 98, eerste of tweede lid][ref5], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0044308#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0005212#Artikel54
      [ref4]: https://wetten.overheid.nl/BWBR0012811#Artikel97
      [ref5]: https://wetten.overheid.nl/BWBR0012811#Artikel98
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0044308
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005212
        artikel: '47'
      - id: ref3
        bwb_id: BWBR0005212
        artikel: '54'
      - id: ref4
        bwb_id: BWBR0012811
        artikel: '97'
        hoofdstuk: XIII
      - id: ref5
        bwb_id: BWBR0012811
        artikel: '98'
        hoofdstuk: XIII
  - number: '68'
    text: |-
      De definitieve onttrekking van een reisdocument, niet zijnde een nooddocument of een gevonden reisdocument, wordt
      geregistreerd in de basisadministratie waarin de houder als ingezetene is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel68
  - number: '71.1'
    text: |-
      Van de definitieve onttrekking aan het verkeer van een reisdocument, niet zijnde een nooddocument
      of een gevonden reisdocument en van de uitreiking van een reisdocument, geeft de burgemeester, een
      burgemeester als bedoeld in de [artikelen 3.2., eerste lid, onderdeel a, of tweede lid][ref1], en
      [4.2., eerste lid, onderdeel a, of tweede lid, van het besluit][ref2], of de gezaghebber kennis:


      [ref1]: https://wetten.overheid.nl/BWBR0044308#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0044308#Artikel4
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0044308
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0044308
        artikel: '4'
  - number: 71.1.a
    text: |-
      aan de autoriteit in Aruba, Curaçao, of Sint Maarten, of de gezaghebber van het openbaar lichaam indien de houder
      van het document daar ingezetene is, of laatstelijk ingezetene was of indien het document door deze autoriteit is
      afgegeven, of
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel71
  - number: 71.1.b
    text: |-
      aan de Minister van Binnenlandse Zaken indien het bepaalde onder a niet van toepassing is en de houder als niet-
      ingezetene is geregistreerd in de basisadministratie.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel71
  - number: '71.2'
    text: |-
      In afwijking van het eerste lid geeft de burgemeester van Haarlemmermeerkennis van de definitieve onttrekking aan
      het verkeer van een Nederlandse identiteitskaart en van de uitreiking van een Nederlandse identiteitskaart aan
      de Minister van Binnenlandse Zaken en Koninkrijksrelaties, indien de houder in de basisadministratie van Aruba,
      Curaçao of Sint Maarten is ingeschreven en de aanvraag is gedaan bij de burgemeester van Haarlemmermeer op een
      vestiging van de Vertegenwoordiging van de Nederlandse regering bij de regeringen van Aruba, Curaçao en Sint
      Maarten.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel71
  - number: '72.1'
    text: Van elk verstrekt reisdocument wordt een administratie bijgehouden.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel72
  - number: '72.2'
    text: |-
      De in het eerste lid bedoelde reisdocumentenadministratie wordt bijgehouden in het reisdocumentenstation, voor
      zover het de daarin overeenkomstig de [artikelen 40][ref1] en [55][ref2] opgenomen gegevens betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0012811#Artikel55
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '40'
        hoofdstuk: III
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0012811
        artikel: '55'
        hoofdstuk: V
  - number: '72.3'
    text: |-
      De overige gegevens met betrekking tot de aanvraag, verstrekking en uitreiking worden als afzonderlijke documenten
      in de reisdocumentenadministratie opgenomen op een wijze die raadpleging in samenhang met de in het tweede lid
      bedoelde gegevens mogelijk maakt.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel72
  - number: '72.4'
    text: |-
      De in de reisdocumentenadministratie opgenomen gegevens, met uitzondering van de gegevens, bedoeld in
      [artikel 3, negende lid, van de wet][ref1] worden na de datum van verstrekking bewaard gedurende een periode van:


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel3
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '3'
  - number: 72.4.a
    text: |-
      11 jaar indien de geldigheidsduur van het verstrekte document 5 jaar of korter is of indien het verstrekte document
      niet wordt uitgereikt;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel72
  - number: 72.4.b
    text: 16 jaar indien de geldigheidsduur van het verstrekte document langer dan 5 jaar is.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel72
  - number: '73'
    text: |-
      Onverminderd het bepaald in [artikel 3, negende lid, van de wet][ref1], wordt de verstrekking van gegevens uit de
      in [artikel 72][ref2] bedoelde reisdocumentenadministratie uitsluitend toegestaan aan:


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0012811#Artikel72
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0012811
        artikel: '72'
        hoofdstuk: IX
  - number: 73.a
    text: |-
      degenen die bij of krachtens de [wet][ref1] belast zijn met de uitvoering daarvan, voor zover die gegevens
      noodzakelijk zijn voor het verrichten van werkzaamheden met betrekking tot reisdocumenten;


      [ref1]: https://wetten.overheid.nl/BWBR0005212
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0005212
  - number: 73.b
    text: |-
      de ambtenaren, werkzaam bij het ministerie van Buitenlandse Zaken, een Nederlandse consulaire vertegenwoordiging in
      het buitenland onderscheidenlijk het Kabinet van de Gouverneur van Aruba, Curaçao of Sint Maarten, voor zover die
      gegevens noodzakelijk zijn voor consulaire handelingen waarbij de identiteit van de betrokken persoon moet worden
      vastgesteld;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel73
  - number: 73.c
    text: |-
      de opsporingsambtenaren bedoeld in [artikel 141][ref1] en [142 van het Wetboek van Strafvordering][ref2] en
      [artikel 184][ref3] en [185 van het Wetboek van Strafvordering BES][ref4], voor zover die gegevens noodzakelijk
      zijn voor de opsporing van strafbare feiten in het kader van het onderzoek waarbij zij zijn betrokken of voor zover
      die noodzakelijk zijn voor de identificatie van slachtoffers;


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel142
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel184
      [ref4]: https://wetten.overheid.nl/BWBR0028681#Artikel185
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '142'
      - id: ref3
        bwb_id: BWBR0028681
        artikel: '184'
      - id: ref4
        bwb_id: BWBR0028681
        artikel: '185'
  - number: 73.d
    text: |-
      de ambtenaren van het openbaar ministerie van het Europese deel van Nederland en het openbaar ministerie van
      Bonaire, Sint Eustatius en Saba, voor zover die gegevens noodzakelijk zijn voor de uitoefening van de hun
      opgedragen werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel73
  - number: 73.e
    text: |-
      de ambtenaren werkzaam bij de autoriteiten, bedoeld in de [artikelen 18 tot en met 24 van de wet][ref1],
      voor zover die gegevens noodzakelijk zijn voor het verzoek tot weigering of vervallenverklaring en de
      daarmee verband houdende vermelding van deze gegevens in het register paspoortsignaleringen als bedoeld in
      [artikel 25, derde lid, van de wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel25
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0005212
        artikel: '25'
  - number: 73.f
    text: |-
      de ambtenaren werkzaam bij het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties, voor zover die
      gegevens noodzakelijk zijn voor de hun opgedragen werkzaamheden in verband met de verwerking van gegevens in
      het register vermiste of vervallen reisdocumenten, in verband met de uitoefening van hun taak als bedoeld in
      [artikel 58 van de wet][ref1], alsmede in verband met onderzoek naar onregelmatigheden met reisdocumenten;


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel58
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '58'
  - number: 73.g
    text: |-
      degene die in opdracht van het college van burgemeester en wethouders of het bestuurscollege belast is
      met de controle op de uitvoering van de bij of krachtens de [wet][ref1] gestelde regels, de toepassing
      van de beveiligingsmaatregelen, de werking van het aanvraagsysteem reisdocumenten of de opneming van
      reisdocumentengegevens in de basisadministratie, voor zover die gegevens noodzakelijk zijn voor de hun opgedragen
      werkzaamheden;


      [ref1]: https://wetten.overheid.nl/BWBR0005212
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0005212
  - number: 73.h
    text: |-
      de houder, beheerder, bewerker en degene die belast is met de invoer, wijziging, of verwijdering van gegevens, voor
      zover die gegevens, de rechtstreekse toegang daaronder begrepen, noodzakelijk zijn voor de uitoefening van de hun
      in verband daarmee opgedragen werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel73
  - number: 73.i
    text: |-
      de ambtenaren werkzaam bij de Algemene Inlichtingen- en Veiligheidsdienst en de
      Militaire Inlichtingen- en veiligheidsdienst, voor zover die gegevens noodzakelijk
      zijn voor de uitvoering van hun taken als bedoeld in [artikel 8, tweede lid][ref1], en
      [artikel 10, tweede lid, van de Wet op de inlichtingen- en veiligheidsdiensten 2017][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel10
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '10'
  - number: '74.1'
    text: |-
      Een burgemeester als bedoeld in [artikel 4.2, eerste lid, van het besluit][ref1] en de burgemeester van
      Haarlemmermeer, bedoeld in artikel 4.2, tweede lid, van het besluit voeren een aparte administratie van de door
      hen ingevolge artikel 4.2, eerste lid, van het besluit respectievelijk artikel 4.2, tweede lid, van het besluit
      verstrekte reisdocumenten respectievelijk Nederlandse identiteitskaarten.


      [ref1]: https://wetten.overheid.nl/BWBR0044308#Artikel4
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0044308
        artikel: '4'
  - number: '74.2'
    text: |-
      De [artikelen 72][ref1] en [73][ref2] zijn van overeenkomstige toepassing op de inrichting van deze administratie
      en op de verstrekking van gegevens daaruit.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0012811#Artikel73
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '72'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0012811
        artikel: '73'
        hoofdstuk: IX
  - number: '75.1'
    text: |-
      De burgemeester of de gezaghebber die door middel van de daartoe door de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties beschikbaar gestelde dienst een kennisgeving ontvangt van:
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel75
  - number: 75.1.a
    text: |-
      de definitieve onttrekking aan het verkeer van een reisdocument en de uitreiking van een vervangend reisdocument,
      waarbij is vermeld of het oude reisdocument is ingehouden, ingeleverd of vermist, dan wel
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel75
  - number: 75.1.b
    text: |-
      de uitreiking van een reisdocument, waarbij definitieve onttrekking aan het verkeer van een eerder verstrekt
      reisdocument niet aan de orde is, dan wel
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel75
  - number: 75.1.c
    text: |-
      de definitieve onttrekking van een reisdocument, waarbij geen nieuw reisdocument is uitgereikt, draagt zorg
      dat deze feiten worden geregistreerd in de basisadministratie, waarin de betrokken persoon als ingezetene is
      ingeschreven.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel75
  - number: '75.2'
    text: |-
      De burgemeester of de gezaghebber die een in het eerste lid bedoelde kennisgeving ontvangt betreffende een persoon
      die laatstelijk ingezetene van zijn gemeente of openbaar lichaam was, bewaart deze kennisgeving als onderdeel van
      de basisadministratie tot het moment dat de betrokken persoon weer ingezetene van een gemeente of openbaar lichaam
      wordt, dan wel elf jaren zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel75
  - number: '75.3'
    text: |-
      De in het eerste en tweede lid bedoelde registratie vindt niet plaats, indien de feiten betrekking hebben op een
      nooddocument of een gevonden reisdocument.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel75
  - number: '75.4'
    text: |-
      De autoriteit die ten onrechte een kennisgeving als bedoeld in het eerste lid heeft ontvangen, zendt deze door aan
      de burgemeester van de gemeente of de gezaghebber van het openbaar lichaam waarvan de betrokken persoon ingezetene
      is, of laatstelijk ingezetene was.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel75
  - number: '75.5'
    text: |-
      Indien een persoon wederom ingezetene wordt, wordt een in de tussentijd gezonden kennisgeving als bedoeld in het
      eerste lid opgevraagd bij de burgemeester van de gemeente of de gezaghebber van het openbaar lichaam waarvan de
      betrokken persoon laatstelijk ingezetene was.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel75
  - number: '78.1'
    text: |-
      De burgemeester dan wel de gezaghebber, of de door hem daartoe aangewezen ambtenaar wijst de personen aan die
      bevoegd zijn tot het verrichten van de handelingen die bij of krachtens de [wet][ref1] zijn voorgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0005212
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0005212
  - number: '78.2'
    text: |-
      De in het eerste lid bedoelde aanwijzing van personen, alsmede de registratie van hun bevoegdheden geschiedt
      met inachtneming van de functionele beschrijvingen met betrekking tot het aanvraagsysteem reisdocumenten en
      overeenkomstig de beveiligingsprocedure, bedoeld in [artikel 93][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel93
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '93'
        hoofdstuk: XII
  - number: '78.3'
    text: |-
      De gezaghebber draagt er zorg voor dat de handelingen, bedoeld in het eerste lid, die plaatsvinden in een niet
      tot de organisatie van het openbaar lichaam behorende uitgiftelocatie, uitsluitend worden verricht door bezoldigde
      ambtenaren van het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel78
  - number: '79.1'
    text: |-
      De burgemeester of de gezaghebber wijst per uitgiftelocatie ten minste twee personen aan die binnen het
      aanvraagsysteem reisdocumenten zullen functioneren als autorisatiebevoegde reisdocumentenstation overeenkomstig
      de gebruikershandleiding bij het reisdocumentenstation, bedoeld in [artikel 87][ref1]. Tevens wijst de
      burgemeester of de gezaghebber per aanvraagstationlocatie ten minste twee personen aan die zullen functioneren als
      autorisatiebevoegde aanvraagstation overeenkomstig de gebruikershandleiding bij het aanvraagstation, bedoeld in
      artikel 87.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel87
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '87'
        hoofdstuk: XI
        paragraaf: '4'
  - number: '79.2'
    text: |-
      De burgemeester of de gezaghebber draagt er zorg voor, dat een autorisatiebevoegde in staat wordt gesteld alle
      handelingen te verrichten die uit zijn taak voortvloeien.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel79
  - number: '79.3'
    text: De autorisatiebevoegden zijn rechtstreeks verantwoording verschuldigd aan de burgemeester of de gezaghebber.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel79
  - number: '80.1'
    text: |-
      Per reisdocumentenstation worden ten minste 2 en ten hoogste 20 identificatiekaarten beschikbaar gesteld aan de
      autorisatiebevoegde reisdocumentenstation.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel80
  - number: '80.2'
    text: |-
      De autorisatiebevoegde reisdocumentenstation is, met inachtneming van de gebruikershandleiding bij het
      reisdocumentenstation, bedoeld in [artikel 87][ref1], verantwoordelijk voor het autorisatiebeheer, de bewaring van
      de identificatiekaarten en de registratie van de personen aan wie hij in een bepaald tijdvak een kaart verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel87
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '87'
        hoofdstuk: XI
        paragraaf: '4'
  - number: '80.3'
    text: |-
      De autorisatiebevoegde reisdocumentenstation registreert in het reisdocumentenstation met inachtneming van de
      gebruikershandleiding de intrekking van identificatiekaarten indien deze na verlies, diefstal of defect verloren
      zijn gegaan of onbruikbaar zijn geworden of anderszins niet langer gebruikt mogen worden. De autorisatiebevoegde
      draagt zorg voor de vernietiging van ingetrokken identificatiekaarten voor zover deze in zijn bezit zijn en geen
      nader onderzoek daaraan hoeft plaats te vinden.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel80
  - number: '80.4'
    text: De leverancier houdt een registratie bij van de uitgegeven en ingetrokken identificatiekaarten.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel80
  - number: 80a.1
    text: |-
      Per aanvraagstationlocatie worden door de leverancier twee opstartkaarten verstrekt, waarmee het aanvraagstation in
      werking kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel80a
  - number: 80a.2
    text: |-
      De autorisatiebevoegde aanvraagstation is, met inachtneming van de gebruikershandleiding bij het aanvraagstation,
      bedoeld in [artikel 87][ref1], verantwoordelijk voor de bewaring en het gebruik van de opstartkaart.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel87
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel80a
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '87'
        hoofdstuk: XI
        paragraaf: '4'
  - number: 80a.3
    text: Bij defect of verlies van een opstartkaart wordt terstond contact opgenomen met de leverancier.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel80a
  - number: 80a.4
    text: Een defecte opstartkaart wordt terstond aan de leverancier toegestuurd.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel80a
  - number: 80a.5
    text: |-
      De leverancier houdt een registratie bij van de uitgegeven opstartkaarten. Tevens registreert hij welke
      opstartkaarten vermist zijn.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel80a
  - number: 80b.1
    text: |-
      De burgemeester dan wel de gezaghebber, of de door hem daartoe aangewezen ambtenaar wijst per uitgiftelocatie
      de personen aan die aanvragen in behandeling mogen nemen met behulp van het mobiel vingerafdrukopname-apparaat
      overeenkomstig de gebruikershandleiding bij het mobiel vingerafdrukopname-apparaat, bedoeld in [artikel 87][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel87
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel80b
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '87'
        hoofdstuk: XI
        paragraaf: '4'
  - number: 80b.2
    text: |-
      In afwijking van het eerste lid wijst de burgemeester van Haarlemmermeer of de door hem daartoe aangewezen
      ambtenaar ten minste drie personen aan bij de vestigingen van de Vertegenwoordiging van de Nederlandse regering bij
      de regeringen van Aruba, Curaçao en Sint Maarten die aanvragen in behandeling mogen nemen met behulp van het mobiel
      vingerafdrukopname-apparaat overeenkomstig de gebruikershandleiding bij het mobiel vingerafdrukopname-apparaat,
      bedoeld in [artikel 87][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel87
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel80b
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '87'
        hoofdstuk: XI
        paragraaf: '4'
  - number: 80b.3
    text: |-
      De leverancier verstrekt aan de autorisatiebevoegde aanvraagstation het wachtwoord waarmee toegang tot het mobiel
      vingerafdrukopname-apparaat kan worden verkregen en een authenticatiekaart waarmee het mobiel vingerafdrukopname-
      apparaat in het locale netwerk van de uitgiftelocatie of de vestigingen van de Vertegenwoordiging van de
      Nederlandse regering bij de regeringen van Aruba, Curaçao en Sint Maarten kan worden aangesloten.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel80b
  - number: 80b.4
    text: |-
      De autorisatiebevoegde aanvraagstation brengt dit wachtwoord uitsluitend ter kennis aan de aangewezen personen
      bedoeld in het eerste en tweede lid en ziet er op toe dat het wachtwoord te allen tijde gescheiden van het mobiel
      vingerafdrukopname-apparaat wordt bewaard. Alle betrokkenen nemen alle daartoe noodzakelijke maatregelen om te
      voorkomen dat het wachtwoord bekend wordt. Indien het wachtwoord is zoekgeraakt of ter kennis is gekomen van een
      onbevoegde wordt terstond contact opgenomen met de leverancier.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel80b
  - number: 80b.5
    text: |-
      [Artikel 80a, tweede tot en met vijfde lid][ref1], is van overeenkomstige toepassing op de verstrekte
      authenticatiekaart.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel80a
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel80b
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: 80a
        hoofdstuk: XI
        paragraaf: '1'
  - number: '81.1'
    text: |-
      De burgemeester of de door hem daartoe aangewezen ambtenaar wijst per uitgiftelocatie ten minste drie personen aan
      om zendingen van reisdocumenten en foto- en handtekeningformulieren in ontvangst te nemen. Identificatiekaarten
      en daarop betrekking hebbende codes worden uitsluitend in ontvangst genomen door een autorisatiebevoegde
      reisdocumentenstation.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel81
  - number: '81.2'
    text: |-
      De aanmelding, registratie en vervanging van de tot ontvangst bevoegde personen, bedoeld in de eerste zin van het
      eerste lid, vindt plaats bij de distributeur, met gebruikmaking van de door de burgemeester daartoe beschikbaar
      gestelde machtiging tot ontvangstneming.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel81
  - number: '81.3'
    text: |-
      De machtiging tot ontvangstneming wordt gewaarmerkt met een afdruk van een dienststempel als bedoeld in
      [artikel 88][ref1] en de handtekening van de burgemeester of de door hem daartoe aangewezen persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel88
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '88'
        hoofdstuk: XI
        paragraaf: '4'
  - number: '81.4'
    text: De gemeente bewaart een kopie van het in het derde lid genoemde formulier.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel81
  - number: '82.1'
    text: |-
      De gezaghebber of de door hem daartoe aangewezen ambtenaar wijst ten minste drie personen aan om zendingen van
      gepersonaliseerde documenten in ontvangst te nemen. Identificatiekaarten en daarop betrekking hebbende codes worden
      uitsluitend in ontvangst genomen door een autorisatiebevoegde reisdocumentenstation.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel82
  - number: '82.2'
    text: |-
      De aanmelding, registratie en vervanging van de tot ontvangst bevoegde personen, bedoeld in de eerste zin van het
      eerste lid, vindt plaats bij de transporteur.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel82
  - number: 82a.1
    text: |-
      De burgemeester van Haarlemmermeer of de door hem daartoe aangewezen ambtenaar wijst ten minste drie personen bij
      de vestigingen van de Vertegenwoordiging van de Nederlandse regering bij de regeringen van Aruba, Curaçao en Sint
      Maarten aan om zendingen van gepersonaliseerde documenten in ontvangst te nemen.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel82a
  - number: 82a.2
    text: |-
      De aanmelding, registratie en vervanging van de tot ontvangst bevoegde personen, bedoeld in de eerste zin van het
      eerste lid, vindt plaats bij de transporteur.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel82a
  - number: '83.1'
    text: |-
      De burgemeester dan wel de gezaghebber, of de door hem daartoe aangewezen ambtenaar meldt met gebruikmaking van
      het daartoe door de Minister van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde formulier aan
      de Minister van Binnenlandse Zaken en Koninkrijksrelaties de aanvraagstationlocatie in zijn gemeente of openbare
      lichaam waar één of meerdere aanvraagstations zijn geplaatst alsmede de uitgiftelocatie waar de verzending
      van de aanvragen naar de leverancier en de aflevering van de zendingen door de distributeur of de transporteur
      plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel83
  - number: '83.2'
    text: |-
      Indien in de gemeente of het openbaar lichaam gebruik wordt gemaakt van meerdere aanvraagstationlocaties en
      uitgiftelocaties als bedoeld in het eerste lid, worden deze locaties, mits de beveiliging daarvan voldoet aan
      de beveiligingseisen als bedoeld in [hoofdstuk XII][ref1], op de in het eerste lid aangegeven wijze, eveneens
      aangemeld.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#HoofdstukXII
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0012811
        hoofdstuk: XII
  - number: '83.3'
    text: |-
      Wijzigingen met betrekking tot aanvraagstationlocaties en uitgiftelocaties worden, met gebruikmaking van het
      daartoe door de Minister van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde formulier, uiterlijk
      drie maanden voor het tijdstip waarop de wijziging ingaat, gemeld aan de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel83
  - number: '83.4'
    text: |-
      De Minister van Binnenlandse Zaken en Koninkrijksrelaties houdt een registratie bij van de ingevolge het eerste,
      tweede en derde lid aangemelde aanvraagstationlocaties en uitgiftelocaties en geeft deze gegevens door aan de
      leverancier.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel83
  - number: '83.5'
    text: |-
      De leverancier wijst aan elke uitgiftelocatie een unieke locatiecode toe en meldt deze terug aan de Minister van
      Binnenlandse Zaken en Koninkrijksrelaties en aan de burgemeester dan wel de gezaghebber.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel83
  - number: '84.1'
    text: |-
      De burgemeester of de door hem daartoe aangewezen persoon spreekt met het bestelkantoor het tijdstip af waarop de
      zending wordt afgeleverd.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel84
  - number: '84.2'
    text: |-
      De vastlegging van de tijdstippen waarop een zending in een openbaar lichaam wordt afgeleverd, geschiedt in overleg
      met de transporteur.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel84
  - number: '85.1'
    text: |-
      De reisdocumenten worden bewaard op de in [artikel 91][ref1] voorgeschreven wijze tot het tijdstip dat zij worden
      uitgereikt, dan wel:


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel91
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '91'
        hoofdstuk: XII
  - number: 85.1.a
    text: |-
      indien het een gemeente betreft, worden opgehaald door de leverancier ingevolge [artikel 46][ref1] of per
      aangetekende post worden verstuurd ingevolge [artikel 49][ref2] of [51][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0012811#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0012811#Artikel51
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '46'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0012811
        artikel: '49'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0012811
        artikel: '51'
        hoofdstuk: V
  - number: 85.1.b
    text: |-
      indien het een openbaar lichaam betreft, per aangetekende post, met gebruikmaking van het daartoe door de
      Minister van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde formulier, worden teruggestuurd aan
      de leverancier.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel85
  - number: '85.2'
    text: |-
      Aan de hand van de gegevens in het reisdocumentenstation wordt nagegaan welke reisdocumenten langer dan drie
      maanden na de datum dat zij voor uitreiking beschikbaar zijn gesteld nog niet zijn uitgereikt, teneinde deze
      ingevolge [artikel 42, vierde lid, van de wet][ref1] definitief aan het verkeer te onttrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel42
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '42'
  - number: '86.1'
    text: |-
      Indien op enig moment een reisdocument na aflevering en registratie daarvan in het reisdocumentenstation blijkt
      te ontbreken, wordt terstond een inventarisatie opgemaakt van de nog aanwezige reisdocumenten aan de hand van de
      gegevens in het reisdocumentenstation.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel86
  - number: '86.2'
    text: De ontbrekende reisdocumenten worden geregistreerd in het reisdocumentenstation.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel86
  - number: '86.3'
    text: |-
      [Artikel 48][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel48
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '48'
        hoofdstuk: IV
  - number: '87.1'
    text: |-
      De burgemeester of de gezaghebber maakt binnen het aanvraagsysteem reisdocumenten gebruik van het
      reisdocumentenstation, het aanvraagstation het mobiel vingerafdrukopname-apparaat en de overige materialen,
      overeenkomstig het bepaalde in deze regeling en met inachtneming van de bijgeleverde gebruikershandleidingen.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel87
  - number: '87.2'
    text: |-
      De burgemeester of de gezaghebber draagt zorg voor de technische inrichting, de werking en de beveiliging van de
      reisdocumentenmodule en de correcte uitwisseling van de daarin opgenomen gegevens met het reisdocumentenstation
      en de basisadministratie, overeenkomstig het bepaalde in deze regeling en met inachtneming van de ter zake door de
      Minister van Binnenlandse Zaken en Koninkrijksrelaties nader gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel87
  - number: '88'
    text: De dienststempel is een stempel die voorzien is van het gemeentewapen of het wapen van het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel88
  - number: '89.1'
    text: |-
      De in [artikel 38][ref1] bedoelde foto- en handtekeningformulieren worden vier maal per jaar door de leverancier
      beschikbaar gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel38
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '38'
        hoofdstuk: III
        paragraaf: '4'
  - number: '89.2'
    text: |-
      Het aantal foto- en handtekeningformulieren dat jaarlijks beschikbaar wordt gesteld, is gebaseerd op het
      jaarlijkse aantal aanvraagbestanden, dat ingevolge [artikel 42][ref1] vanuit de desbetreffende uitgiftelocatie
      aan de leverancier is gezonden, in de periode tussen 1 oktober en 30 september, vermeerderd met vijf procent. De
      leverancier maakt jaarlijks voor 1 november het aantal beschikbaar te stellen foto- en handtekeningformulieren voor
      het volgende kalenderjaar en de tijdstippen waarop deze worden afgeleverd, bekend aan de uitgiftelocatie.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel42
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '42'
        hoofdstuk: IV
  - number: '89.3'
    text: |-
      Indien tussen twee aflevertijdstippen blijkt dat de voorraad foto- en handtekeningformulieren ontoereikend
      zal zijn, kan met gebruikmaking van het daartoe door de Minister van Binnenlandse Zaken en Koninkrijksrelaties
      beschikbaar gestelde formulier een spoedbestelling worden gedaan. De omvang van de spoedbestelling is niet groter
      dan noodzakelijk om de periode tot het eerstvolgende aflevertijdstip te overbruggen.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel89
  - number: '89.4'
    text: |-
      De foto- en handtekeningformulieren worden door de leverancier binnen tien werkdagen na de spoedbestelling geleverd
      op de uitgiftelocatie waarvoor de bestelling is gedaan.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel89
  - number: '89.5'
    text: |-
      De overige standaardformulieren worden eenmalig door de leverancier ter beschikking gesteld en kunnen desgewenst
      worden nabesteld.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel89
  - number: '89.6'
    text: De foto- en handtekeningformulieren en andere standaardformulieren worden kosteloos verstrekt.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel89
  - number: '90'
    text: |-
      De met de uitvoering van de wet belaste autoriteiten treffen maatregelen om de onder hen berustende reisdocumenten,
      apparatuur, programmatuur, opslagmedia, documentatie en overige materialen te beveiligen tegen ontvreemding dan wel
      vernietiging ten gevolge van inbraak, diefstal, verduistering, overvallen, brand of anderszins.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel90
  - number: 90a
    text: |-
      De voorschriften voor de technische en organisatorische voorzieningen die noodzakelijk zijn voor de vervaardiging
      van het publiek identificatiemiddel zijn:
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel90a
  - number: 90a.a
    text: de Baseline Informatiebeveiliging Overheid; en
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel90a
  - number: 90a.b
    text: de Voorschriften Informatiebeveiliging Rijksdienst.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel90a
  - number: '91.1'
    text: |-
      Buiten de werkuren worden de van de leverancier ontvangen reisdocumenten, de ingehouden reisdocumenten, de
      opslagmedia, de documentatie en de overige materialen opgeslagen in een inbraakvertragende en brandwerende
      voorziening, zoals een gesloten inbraakwerende waardekast of kluis, die in passende verhouding staat tot de waarde
      van de inhoud. Deze voorziening is in een af te sluiten ruimte geplaatst.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel91
  - number: '91.2'
    text: |-
      De plaatsen waar de reisdocumenten, de documentatie en de overige materialen zijn opgeslagen, alsmede de ruimte
      waarin de apparatuur en de programmatuur zich bevinden, zijn uitgerust met een inbraakalarmeringssysteem dat in
      verbinding staat met een door de rijksoverheid toegelaten alarmcentrale. Voor zover een openbaar lichaam niet
      beschikt over een inbraakalarmeringssysteem, bedoeld in de eerste zin van dit lid, dienen deze plaatsen en deze
      ruimte onder permanente fysieke (24-uurs) bewaking te staan.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel91
  - number: '91.3'
    text: |-
      De apparatuur en programmatuur, alsmede de tijdens de werkuren uit te reiken of ingehouden reisdocumenten en de
      te gebruiken documentatie en overige materialen bevinden zich, onder voortdurend toezicht, op een voor onbevoegden
      onbereikbare en afsluitbare plaats.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel91
  - number: '91.4'
    text: |-
      In afwijking van het eerste lid blijft de authenticatiekaart ook tijdens de werkuren opgeslagen in de voorziening,
      bedoeld in het eerste lid. De authenticatiekaart mag zich uitsluitend buiten de desbetreffende voorziening
      bevinden op het moment dat deze nodig is om het mobiel vingerafdrukopname-apparaat in het locale netwerk van de
      uitgiftelocatie aan te sluiten.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel91
  - number: '91.5'
    text: |-
      In afwijking van het tweede en derde lid, staat een aanvraagstation of een mobiel vingerafdrukopname-apparaat
      gedurende de werkuren onder voortdurend toezicht van degene die bevoegd is tot het gebruik ervan en bevindt het
      zich buiten de werkuren in een voor onbevoegden onbereikbare, afsluitbare en bij voorkeur beveiligde ruimte.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel91
  - number: '91.6'
    text: |-
      In afwijking van het tweede lid, geldt voor de vestigingen van de Vertegenwoordiging van de Nederlandse regering
      bij de regeringen van Aruba, Curaçao en Sint Maarten dat de plaatsen waar de Nederlandse identiteitskaarten, de
      documentatie en de overige materialen zijn opgeslagen, alsmede de ruimte waarin de apparatuur en de programmatuur
      zich bevinden, zijn uitgerust met een inbraakalarmeringssysteem dat in verbinding staat met een ter plaatse door de
      overheid toegelaten alarmcentrale, dan wel onder permanente fysieke (24-uurs) bewaking staan.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel91
  - number: '92.1'
    text: |-
      Van de in de reisdocumentenmodule en de in het reisdocumentenstation opgeslagen gegevens wordt dagelijks een
      reservekopie gemaakt. Voor het reisdocumentenstation wordt daartoe gebruik gemaakt van de door de Minister
      van Binnenlandse Zaken en Koninkrijksrelaties te verstrekken opslagmedia. Per reisdocumentenstation worden 5
      opslagmedia verstrekt. Na het maken van de reservekopie wordt gecontroleerd of deze is geslaagd.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel92
  - number: '92.2'
    text: |-
      De bewaring van de reservekopieën geschiedt zodanig, dat de twee oudste reservekopieën op de locatie van het
      reisdocumentenarchiefstation worden bewaard, terwijl de drie meest recente reservekopieën elders worden bewaard, in
      een vergelijkbare voorziening als bedoeld in [artikel 91, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel91
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '91'
        hoofdstuk: XII
  - number: '92.3'
    text: |-
      De verstrekkende autoriteit beschikt over een op schrift gestelde procedure inzake back-up en herstel, die er in
      voorziet dat reconstructie van de gegevens mogelijk is.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel92
  - number: '93.1'
    text: |-
      De verstrekkende autoriteit beschikt over een op schrift gestelde beveiligingsprocedure. In deze
      beveiligingsprocedure worden in ieder geval maatregelen vastgelegd inzake:
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel93
  - number: 93.1.a
    text: |-
      de ontvangst, het transport, de bewaring en het beheer van de van de leverancier ontvangen reisdocumenten, de
      ingehouden reisdocumenten, de apparatuur, de programmatuur, de documentatie en de overige materialen;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel93
  - number: 93.1.b
    text: de verantwoordelijkheden van de beveiligingsfunctionaris als bedoeld in het tiende lid;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel93
  - number: 93.1.c
    text: |-
      de functiescheiding tussen de bij de aanvraag, de verstrekking en de uitreiking van de reisdocumenten betrokken
      functionarissen;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel93
  - number: 93.1.d
    text: |-
      de beveiliging van het aanvraagsysteem reisdocumenten, onder meer gericht op het voorkomen van onbevoegde toegang
      of gebruik van gegevens die in het systeem of tot het systeem behorende opslagmedia zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel93
  - number: '93.2'
    text: |-
      Indien het als gevolg van een noodsituatie wegens de omvang van het ambtelijk apparaat niet mogelijk is om
      gedurende een beperkte periode te voldoen aan de in het eerste lid, onder c, bedoelde functiescheiding, kan daarvan
      met inachtneming van het derde en vierde lid, worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel93
  - number: '93.3'
    text: |-
      In de situatie, bedoeld in het tweede lid, wordt met behulp van de door de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties beschikbaar gestelde dienst vastgelegd:
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel93
  - number: 93.3.a
    text: de reden waarom tijdelijk niet aan de eis van functiescheiding kan worden voldaan;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel93
  - number: 93.3.b
    text: de periode waarin niet aan de eis van functiescheiding wordt voldaan;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel93
  - number: 93.3.c
    text: |-
      de namen van de personen die in de onder b bedoelde periode zijn belast met de aanvraag, de verstrekking en de
      uitreiking van de reisdocumenten.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel93
  - number: '93.4'
    text: |-
      Na afloop van de periode, bedoeld in het derde lid, controleert de daartoe aangewezen persoon, die in de
      desbetreffende periode niet betrokken is geweest bij de aanvraag, de verstrekking en de uitreiking van de
      reisdocumenten, of de schriftelijke vastlegging, bedoeld in het derde lid, aanwezig is en de aanvraag, de
      verstrekking en de uitreiking op de voorgeschreven wijze hebben plaatsgevonden. In het geval er sprake is van
      onregelmatigheden wordt gehandeld overeenkomstig [artikel 95][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel95
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '95'
        hoofdstuk: XII
  - number: '93.5'
    text: |-
      Indien het bij de aanvraag en uitgifte van een nooddocument als bedoeld in
      [artikel 2, eerste lid, onder f, van de Paspoortwet][ref1] door de gezaghebber niet mogelijk is om te voldoen aan
      de in het eerste lid, onder c, bedoelde functiescheiding, kan daarvan worden afgeweken. Het derde lid en vierde lid
      zijn in dat geval niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel2
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '2'
  - number: '93.6'
    text: |-
      De burgemeester of de gezaghebber draagt zorg, dat de bij de uitvoering van de [wet][ref1] betrokken personen
      regelmatig worden geïnformeerd over ontvreemdingsrisico's en ten minste één maal per jaar worden geïnstrueerd met
      betrekking tot risicobeperkende afspraken en maatregelen terzake.


      [ref1]: https://wetten.overheid.nl/BWBR0005212
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0005212
  - number: '93.7'
    text: De beveiligingsprocedure wordt jaarlijks geëvalueerd en zo nodig aangepast.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel93
  - number: '93.8'
    text: |-
      Ten behoeve van het opstellen en evalueren van de beveiligingsprocedure wordt gebruik gemaakt van de door de
      Minister van Binnenlandse Zaken en Koninkrijksrelaties daarvoor beschikbaar gestelde hulpmiddelen. Afwijkingen van
      de beveiligingsvoorschriften worden schriftelijk vastgelegd en ten minste vijf jaren naast de beveiligingsprocedure
      bewaard.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel93
  - number: '93.9'
    text: |-
      De burgemeester of de gezaghebber wijst een beveiligingsfunctionaris aan die belast is met het beheer van en het
      toezicht op de naleving van de beveiligingsprocedure.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel93
  - number: '93.10'
    text: |-
      Van de aanwijzing of de vervanging van de beveiligingsfunctionaris wordt terstond melding gedaan aan de Minister
      van Binnenlandse Zaken en Koninkrijksrelaties met gebruikmaking van het daartoe door de Minister van Binnenlandse
      Zaken en Koninkrijksrelaties beschikbaar gestelde formulier.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel93
  - number: '93.11'
    text: |-
      De functie van beveiligingsfunctionaris is niet verenigbaar met het verrichten van andere handelingen ter
      uitvoering van de [wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005212
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0005212
  - number: '93.12'
    text: De taken en verantwoordelijkheden van de beveiligingsfunctionaris worden vastgelegd in een functieomschrijving.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel93
  - number: '93.13'
    text: |-
      De burgemeester of de gezaghebber draagt er zorg voor dat de beveiligingsfunctionaris in staat wordt gesteld alle
      handelingen te verrichten die uit zijn taak voortvloeien.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel93
  - number: '93.14'
    text: De beveiligingsfunctionaris is rechtstreeks verantwoording verschuldigd aan de burgemeester of de gezaghebber.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel93
  - number: '94.1'
    text: |-
      De burgemeester of de gezaghebber voert jaarlijks uiterlijk op een door de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties vast te stellen tijdstip een controle uit op de toepassing van de beveiligingsmaatregelen,
      genoemd in de [artikelen 90 tot en met 93][ref1], en de overige aspecten van het aanvraag- en uitgifteproces
      van reisdocumenten en informeert jaarlijks uiterlijk op een door de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties vast te stellen tijdstip de Minister van Binnenlandse Zaken en Koninkrijksrelaties over de
      bevindingen van de controle.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel90
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '90'
        hoofdstuk: XII
  - number: '94.2'
    text: |-
      Bij de controle en de verslaglegging wordt gebruik gemaakt van de daarvoor door de Minister van Binnenlandse Zaken
      en Koninkrijksrelaties beschikbaar gestelde hulpmiddelen.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel94
  - number: '94.3'
    text: |-
      De minister kan in aanvulling op de in het eerste lid bedoelde controle steekproefsgewijze een nader onderzoek
      uitvoeren teneinde de bevindingen van de controle, bedoeld in het eerste lid, te verifiëren.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel94
  - number: '95.1'
    text: |-
      In het geval van ontvreemding dan wel vernietiging van reisdocumenten, apparatuur, programmatuur, opslagmedia,
      documentatie en overige materialen ten gevolge van inbraak, diefstal, verduistering, overvallen, brand of
      anderszins dient de met de uitvoering van de [wet][ref1] belaste autoriteit daarvan terstond aangifte te doen bij
      de plaatselijke politie en tevens terstond de Minister van Binnenlandse Zaken en Koninkrijksrelaties daarvan in
      kennis te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005212
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0005212
  - number: '95.2'
    text: |-
      De in het eerste lid bedoelde autoriteit zendt de Minister van Binnenlandse Zaken en Koninkrijksrelaties vervolgens
      binnen één werkdag, een schriftelijke kennisgeving waarin de navolgende gegevens zijn opgenomen:
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel95
  - number: 95.2.a
    text: het tijdstip en de exacte toedracht van de ontvreemding of vernietiging;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel95
  - number: 95.2.b
    text: de nummers van de ontvreemde of vernietigde reisdocumenten, alsmede de daarin vermelde persoonsgegevens;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel95
  - number: 95.2.c
    text: |-
      de ontvreemde of vernietigde apparatuur, programmatuur, opslagmedia, documentatie en overige materialen met de
      eventueel daarop vermelde nummers.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel95
  - number: '95.3'
    text: |-
      Zodra het door de plaatselijke politie opgemaakte proces-verbaal beschikbaar is, wordt daarvan een afschrift
      gezonden aan de Minister van Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel95
  - number: '96'
    text: |-
      Onverminderd de eigen verantwoordelijkheid van de houder van een reisdocument ingevolge de [wet][ref1], draagt
      de burgemeester of de gezaghebber er bij wijze van faciliteit zorg voor dat de persoon die ingezetene van zijn
      gemeente of openbaar lichaam is, en houder is van een reisdocument, waarvan de geldigheidsduur binnenkort zal
      verlopen, schriftelijk wordt gewezen op het verstrijken van de geldigheidstermijn, de verplichting het reisdocument
      in te leveren en de mogelijkheid om een nieuw reisdocument aan te vragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005212
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0005212
  - number: '97.1'
    text: |-
      De burgemeester of de gezaghebber die in verband met een handeling op grond van deze regeling enig Nederlands
      reis- of identiteitsdocument krijgt overgelegd, gaat aan de hand van de door de Minister van Binnenlandse Zaken
      en Koninkrijksrelaties verstrekte lijst van toetsingspunten na of met het desbetreffende reisdocument enige
      onregelmatigheid is gepleegd.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel97
  - number: '97.2'
    text: |-
      De burgemeester of de gezaghebber die van mening is dat met het reisdocument onregelmatigheden zijn gepleegd die
      geen strafbare feiten opleveren, onttrekt dit document op de in [artikel 67, eerste lid][ref1], bedoelde wijze
      definitief aan het verkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel67
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '67'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: '98.1'
    text: |-
      Indien het vermoeden bestaat dat de met het reisdocument gepleegde onregelmatigheden strafbare feiten opleveren en
      de vermoedelijke dader bekend is, wordt daarvan onder gelijktijdige overlegging van het desbetreffende reisdocument
      aangifte gedaan bij de plaatselijke politie en melding gemaakt aan het Expertisecentrum Identiteitsfraude en
      Documenten van de Koninklijke Marechaussee, met gebruikmaking van het daartoe door de Minister van Binnenlandse
      Zaken en Koninkrijksrelaties beschikbaar gestelde formulier.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel98
  - number: '98.2'
    text: |-
      Indien het vermoeden bestaat dat de met het reisdocument gepleegde onregelmatigheden strafbare feiten opleveren
      en de vermoedelijke dader niet bekend is, wordt het desbetreffende reisdocument per aangetekende post met
      gebruikmaking van het daartoe door de Minister van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde
      formulier aan het Expertisecentrum Identiteitsfraude en Documenten van de Koninklijke Marechaussee gezonden.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel98
  - number: '98.3'
    text: |-
      De Commandant van het Expertisecentrum Identiteitsfraude en Documenten van de Koninklijke Marechaussee onttrekt
      het reisdocument, bedoeld in het vorige lid, definitief aan het verkeer door middel van vernietiging als bedoeld in
      [artikel 67, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel67
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '67'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: '99.1'
    text: |-
      De aan het Rijk verschuldigde kosten worden vastgesteld aan de hand van de aanvraagbestanden die met gebruikmaking
      van het reisdocumentenstation aan de leverancier zijn verzonden.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel99
  - number: '99.2'
    text: |-
      Het college van burgemeester en wethouders stelt de Minister van Binnenlandse Zaken en Koninkrijksrelaties op de
      hoogte van:
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel99
  - number: 99.2.a
    text: |-
      het verlenen van gehele of gedeeltelijke kwijtschelding van rechten als bedoeld in
      [artikel 2, tweede lid, van het Besluit paspoortgelden][ref1], door het zenden van een afschrift van de beschikking
      waarbij de kwijtschelding is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0005264#Artikel2
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0005264
        artikel: '2'
  - number: 99.2.b
    text: |-
      een situatie waarin een spoedlevering niet binnen de gestelde periode heeft plaatsgevonden, dan wel de met spoed
      geleverde reisdocumenten niet op de juiste wijze blijken te zijn vervaardigd, door het zenden van een daarop
      betrekking hebbende en door de leverancier geverifieerde mededeling.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel99
  - number: '99.3'
    text: |-
      Het bestuurscollege stelt de Minister van Binnenlandse Zaken en Koninkrijksrelaties op de
      hoogte van het verlenen van gehele of gedeeltelijke kwijtschelding van rechten als bedoeld in in
      [artikel 2a, tweede lid, van het Besluit paspoortgelden][ref1], door het zenden van een afschrift van de
      beschikking waarbij de kwijtschelding is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0005264#Artikel2a
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0005264
        artikel: 2a
  - number: '100'
    text: |-
      Ten behoeve van de controle op de juistheid en volledigheid van de bedragen die terzake van de verschuldigde
      kosten als bedoeld in [artikel 7, eerste lid, onder a, van de wet][ref1] aan het Rijk zijn afgedragen, is het
      college van burgemeester en wethouders of het bestuurscollege verplicht desgevraagd aan de door de Minister
      van Binnenlandse Zaken en Koninkrijksrelaties krachtens [artikel 66 van de Comptabiliteitswet 2001][ref2]
      daartoe aangewezen ambtenaren de voor deze controle benodigde informatie te verschaffen. Deze ambtenaren
      kunnen tevens informatie inwinnen bij de in [artikel 213, tweede lid, van de Gemeentewet][ref3] en
      [artikel 38, derde lid, van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref4] bedoelde
      registeraccountants.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel66
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel213
      [ref4]: https://wetten.overheid.nl/BWBR0028151#Artikel38
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0013891
        artikel: '66'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '213'
      - id: ref4
        bwb_id: BWBR0028151
        artikel: '38'
  - number: 100d.1
    text: |-
      Op het opmaken van de aanvraag voor een nooddocument zijn de
      [artikelen 21, met uitzondering van het vierde lid][ref1], [23][ref2], [26][ref3],
      [27, met uitzondering van het zesde lid][ref4], [28][ref5], [29][ref6], [30][ref7], [31][ref8] en [32][ref9] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0012811#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0012811#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0012811#Artikel27
      [ref5]: https://wetten.overheid.nl/BWBR0012811#Artikel28
      [ref6]: https://wetten.overheid.nl/BWBR0012811#Artikel29
      [ref7]: https://wetten.overheid.nl/BWBR0012811#Artikel30
      [ref8]: https://wetten.overheid.nl/BWBR0012811#Artikel31
      [ref9]: https://wetten.overheid.nl/BWBR0012811#Artikel32
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100d
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '21'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0012811
        artikel: '23'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0012811
        artikel: '26'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0012811
        artikel: '27'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0012811
        artikel: '28'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref6
        bwb_id: BWBR0012811
        artikel: '29'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref7
        bwb_id: BWBR0012811
        artikel: '30'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref8
        bwb_id: BWBR0012811
        artikel: '31'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref9
        bwb_id: BWBR0012811
        artikel: '32'
        hoofdstuk: III
        paragraaf: '2'
  - number: 100d.2
    text: |-
      Op het opnemen van de foto en de handtekening van de aanvrager is
      [artikel 38, met uitzondering van het vierde, vijfde en zesde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel38
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100d
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '38'
        hoofdstuk: III
        paragraaf: '4'
  - number: 100e.1
    text: |-
      Indien de aanvraag voor een nooddocument betrekking heeft op een Nederlander dan wel op een als ingezetene in
      de basisadministratie van een openbaar lichaam ingeschreven vreemdeling die recht heeft op verstrekking van een
      reisdocument als bedoeld in [artikel 11][ref1] of [13 van de wet][ref2], beslist de gezaghebber of het aangevraagde
      nooddocument kan worden uitgereikt, onverminderd het bepaalde in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel13
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100e
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0005212
        artikel: '13'
  - number: 100e.2
    text: |-
      In alle andere dan de in het eerste lid bedoelde gevallen vindt verstrekking van een nooddocument door de
      gezaghebber slechts plaats na machtiging van de Minister van Binnenlandse Zaken en Koninkrijksrelaties, aan wie
      daartoe per fax of op een andere beveiligde wijze een kopie van de aanvraaggegevens, waaronder het daartoe door
      de Minister van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde formulier, ter beschikking wordt
      gesteld.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100e
  - number: 100e.3
    text: |-
      De gezaghebber die een aanvraag in behandeling neemt betreffende een persoon die blijkens de in [artikel 5][ref1]
      bedoelde administratie in het register paspoortsignaleringen is vermeld, legt deze aanvraag onverwijld voor
      aan de Minister van Binnenlandse Zaken en Koninkrijksrelaties die beslist of hij de gezaghebber machtigt om tot
      verstrekking van een nooddocument over te gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel5
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100e
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '5'
        hoofdstuk: I
        paragraaf: '4'
  - number: 100f.1
    text: |-
      De daartoe aangewezen ambtenaar vermeldt na de beslissing dat het nooddocument kan worden verstrekt, in de
      aanvraag:
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100f
  - number: 100f.1.a
    text: het gegeven dat de verstrekking heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100f
  - number: 100f.1.b
    text: de datum van de verstrekking;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100f
  - number: 100f.1.c
    text: de datum waarop de geldigheidsduur van het uit te reiken nooddocument eindigt;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100f
  - number: 100f.1.d
    text: de verstrekkende autoriteit.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100f
  - number: 100f.2
    text: |-
      Indien sprake is van een aanvraag als bedoeld in [artikel 100e, derde lid][ref1], of een aanvraag voor een laissez-
      passer, wordt in de aanvraag vermeld voor welke landen het nooddocument geldig is.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel100e
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100f
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: 100e
        hoofdstuk: XIVa
        paragraaf: '2'
  - number: 100g.1
    text: |-
      De daartoe aangewezen ambtenaar draagt zorg dat de aanvraaggegevens in het reisdocumentenstation en de foto en
      handtekening in het aanvraagstation worden vastgelegd.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100g
  - number: 100g.2
    text: De in het aanvraagstation vastgelegde gegevens worden verwerkt en doorgezonden naar het reisdocumentenstation.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100g
  - number: 100g.3
    text: |-
      Indien de beslissing op de aanvraag ingevolge [artikel 100e, tweede of derde lid][ref1], is aangehouden, worden de
      in de [artikel 100f][ref2] genoemde gegevens in het reisdocumentenstation vastgelegd, nadat de verstrekking heeft
      plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel100e
      [ref2]: https://wetten.overheid.nl/BWBR0012811#Artikel100f
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100g
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: 100e
        hoofdstuk: XIVa
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012811
        artikel: 100f
        hoofdstuk: XIVa
        paragraaf: '2'
  - number: 100h.1
    text: |-
      Na de verstrekking worden de datum waarop het nooddocument uiterlijk moet worden ingeleverd en de autoriteit bij
      wie de inlevering dient plaats te vinden, in het reisdocumentenstation vastgelegd.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100h
  - number: 100h.2
    text: De in het eerste lid bedoelde datum is de datum waarop de geldigheidsduur van het nooddocument eindigt.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100h
  - number: 100h.3
    text: 'De ingevolge het eerste lid te vermelden autoriteit is:'
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100h
  - number: 100h.3.a
    text: de burgemeester of de gezaghebber van de woon- of verblijfplaats van de houder, dan wel
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100h
  - number: 100h.3.b
    text: |-
      de door de Gouverneur van Aruba, Curaçao of Sint Maarten aangewezen autoriteit, bevoegd tot het in ontvangst nemen
      van aanvragen voor nationale paspoorten, indien de houder in Aruba, Curaçao of Sint Maarten woonachtig is, dan wel
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100h
  - number: 100h.3.c
    text: |-
      de Gouverneur van Aruba, Curaçao of Sint Maarten, indien de houder het nieuwe reisdocument bij de Gouverneur zal
      aanvragen, dan wel
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100h
  - number: 100h.3.d
    text: |-
      het hoofd van de Nederlandse consulaire post in het buitenland, waar de houder het nieuwe reisdocument zal
      aanvragen.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100h
  - number: 100i.1
    text: |-
      De daartoe aangewezen ambtenaar controleert het aanvraagbestand in het reisdocumentenstation op volledigheid en
      autoriseert het gebruik van dit bestand voor het personaliseren van het nooddocument.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100i
  - number: 100i.2
    text: |-
      Het personaliseren van een noodpaspoort geschiedt met behulp van het in het reisdocumentenstation opgenomen
      aanvraagbestand en met gebruikmaking van de daartoe bestemde reisdocumentenprinter, overeenkomstig de
      gebruikershandleiding bij het reisdocumentenstation.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100i
  - number: 100i.3
    text: |-
      Het personaliseren van een laissez-passer geschiedt door de gegevens met de pen op onuitwisbare wijze in de daartoe
      bestemde rubrieken van het reisdocument in te vullen, overeenkomstig de in bijlage J opgenomen invulinstructie
      laissez-passer. Vervolgens wordt op de in de invulinstructie aangegeven wijze de autoriteit vermeld, die het
      document heeft verstrekt en het laissez-passer gewaarmerkt met het in [artikel 88][ref1] bedoelde dienststempel.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel88
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100i
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '88'
        hoofdstuk: XI
        paragraaf: '4'
  - number: 100i.4
    text: Na het personaliseren van het nooddocument wordt het bijbehorende laminaat over de houderpagina aangebracht.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100i
  - number: 100j.1
    text: |-
      Tot uitreiking van het aangevraagde nooddocument wordt slechts overgegaan, nadat de identiteit van de aanvrager in
      zijn aanwezigheid is vastgesteld en de aanvrager de in het document weergegeven persoonsgegevens op juistheid heeft
      gecontroleerd, tenzij [artikel 28, derde lid, van de wet][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel28
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100j
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '28'
  - number: 100j.2
    text: De daartoe aangewezen ambtenaar registreert de uitreiking van het nooddocument in het reisdocumentenstation.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100j
  - number: 100j.3
    text: |-
      Indien bij de uitreiking blijkt dat het nooddocument is beschadigd, onjuist is geproduceerd of gepersonaliseerd dan
      wel uit de opslag is verdwenen, wordt dit in het reisdocumentenstation geregistreerd.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100j
  - number: 100j.4
    text: |-
      Indien het nooddocument niet binnen drie maanden, nadat het voor uitreiking beschikbaar is gesteld, door de
      aanvrager in ontvangst is genomen, wordt dit geregistreerd in het reisdocumentenstation.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100j
  - number: 100k.1
    text: De gezaghebber voert een administratie van de door hem verstrekte nooddocumenten.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100k
  - number: 100k.2
    text: |-
      De in het eerste lid bedoelde administratie wordt bijgehouden in het reisdocumentenstation, voor zover het de
      daarin overeenkomstig de [artikelen 100g][ref1] en [100j][ref2] opgenomen gegevens betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel100g
      [ref2]: https://wetten.overheid.nl/BWBR0012811#Artikel100j
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100k
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: 100g
        hoofdstuk: XIVa
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012811
        artikel: 100j
        hoofdstuk: XIVa
        paragraaf: '3'
  - number: 100k.3
    text: |-
      De overige gegevens met betrekking tot de aanvraag, verstrekking en uitreiking worden als afzonderlijke documenten
      in de administratie opgenomen op een wijze die raadpleging in samenhang met de in het tweede lid bedoelde gegevens
      mogelijk maakt.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100k
  - number: 100k.4
    text: |-
      De in de administratie opgenomen gegevens worden gedurende elf jaren na de datum van verstrekking van het
      betreffende nooddocument bewaard.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100k
  - number: 100l
    text: |-
      [Artikel 73][ref1] is van overeenkomstige toepassing op de verstrekking van gegevens uit de administratie van
      nooddocumenten.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel73
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100l
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '73'
        hoofdstuk: IX
  - number: 100m.1
    text: |-
      De gezaghebber of de door hem daartoe aangewezen ambtenaar wijst ten minste drie ambtenaren aan om namens hem
      bestellingen te doen van blanco noodpaspoorten en laissez-passer's bij de leverancier en tevens drie ambtenaren om
      leveringen daarvan in ontvangst te nemen.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100m
  - number: 100m.2
    text: |-
      De aanmelding van de tot bestelling en van de tot ontvangst bevoegde ambtenaren, bedoeld in het eerste lid, alsmede
      wijzigingen in deze gegevens, vindt plaats bij de Minister van Binnenlandse Zaken en Koninkrijksrelaties, met
      gebruikmaking van de daartoe door de Minister van Binnenlandse Zaken en Koninkrijksrelaties beschikbaar gestelde
      formulieren.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100m
  - number: 100m.3
    text: |-
      Het ingevulde registratieformulier wordt gewaarmerkt met een afdruk van het in [artikel 88][ref1] bedoelde
      dienststempel.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel88
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100m
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '88'
        hoofdstuk: XI
        paragraaf: '4'
  - number: 100m.4
    text: |-
      De Minister van Binnenlandse Zaken en Koninkrijksrelaties houdt een registratie bij van de ingevolge het eerste lid
      aangemelde personen en geeft deze gegevens door aan de leverancier.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100m
  - number: 100n.1
    text: |-
      De nooddocumenten worden met gebruikmaking van het daartoe door de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties beschikbaar gestelde formulier door de daartoe aangewezen ambtenaar maximaal vier maal binnen
      een jaar bij de leverancier besteld. De bestelopdracht wordt gesteld op briefpapier van het openbaar lichaam en,
      na ondertekening van de daartoe aangewezen ambtenaar, gewaarmerkt met een afdruk van het in [artikel 88][ref1]
      bedoelde dienststempel.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel88
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100n
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '88'
        hoofdstuk: XI
        paragraaf: '4'
  - number: 100n.2
    text: |-
      Het aantal blanco noodpaspoorten en laissez-passer's dat binnen een jaar kan worden besteld, wordt bepaald door
      de leverancier en is gebaseerd op het jaarlijkse aantal verstrekte documenten, in de periode tussen 1 oktober en
      30 september, vermeerderd met vijf procent. De leverancier maakt jaarlijks voor 1 november het aantal te bestellen
      nooddocumenten voor het daaropvolgende jaar bekend aan de gezaghebber.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100n
  - number: 100n.3
    text: |-
      Indien tussen twee bestellingen blijkt dat de voorraad noodpaspoorten dan wel laissez-passer's ontoereikend zal
      zijn, kan een opdracht voor een spoedbestelling worden geplaatst. De opdracht voor een spoedbestelling kan slechts
      worden gedaan, nadat in overleg met de leverancier is vastgesteld dat het aflevertijdstip van de eerstvolgende
      bestelopdracht niet kan worden vervroegd. De omvang van de spoedbestelling is niet groter dan noodzakelijk om de
      periode tot de levering van de eerstvolgende bestelling te overbruggen.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100n
  - number: 100n.4
    text: |-
      Alvorens een bestelopdracht te plaatsen, wordt nagegaan of de in [artikel 100m][ref1] bedoelde gegevens nog juist
      zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel100m
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100n
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: 100m
        hoofdstuk: XIVa
        paragraaf: '5'
  - number: 100n.5
    text: |-
      Indien gegevens zijn gewijzigd, dient het nieuwe registratieformulier minstens vijf werkdagen voor het plaatsen van
      een nieuwe bestelopdracht in het bezit van de Minister van Binnenlandse Zaken en Koninkrijksrelaties te zijn.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100n
  - number: 100n.6
    text: De bestelling wordt door de leverancier bevestigd door toezending van een leveringsbevestiging aan de gezaghebber.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100n
  - number: 100n.7
    text: |-
      De daadwerkelijke aflevering vindt gemiddeld maximaal tien werkdagen na de op de leveringsbevestigingen vermelde
      dagtekening plaats door de transporteur.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100n
  - number: 100n.8
    text: |-
      Bij aflevering ondertekent de tot ontvangst bevoegde persoon, bedoeld in [artikel 100m, eerste lid][ref1], de
      strook die aan de leveringsbevestiging is gehecht.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel100m
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100n
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: 100m
        hoofdstuk: XIVa
        paragraaf: '5'
  - number: 100n.9
    text: |-
      De tot ontvangst bevoegde persoon legitimeert zich, op verzoek van de transporteur, met een binnen het koninkrijk
      uitgegeven reisdocument of rijbewijs.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100n
  - number: 100n.10
    text: |-
      De aflevering van de zending vindt plaats in de kluisruimte. Indien aflevering in de kluisruimte niet mogelijk
      of niet doelmatig is, vindt aflevering plaats in een voor het publiek afgesloten ruimte zo dicht mogelijk bij de
      kluis.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100n
  - number: 100n.11
    text: |-
      De tot ontvangst bevoegde persoon controleert in het bijzijn van de transporteur aan de hand van de
      leveringsbevestiging het aantal pakketten alsmede de verzegeling. Indien de zending niet voor de gezaghebber
      bestemd is, afwijkingen vertoont, beschadigd is dan wel documenten ontbreken, wordt hiervan aantekening gemaakt op
      de aan de leveringsbevestiging gehechte strook en de Minister van Binnenlandse Zaken en Koninkrijksrelaties hiervan
      terstond in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100n
  - number: 100n.12
    text: De ingevulde en ondertekende strook wordt aan de transporteur overhandigd.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100n
  - number: 100n.13
    text: |-
      Indien de persoon die de zending in ontvangst neemt zich desgevraagd niet of niet voldoende kan legitimeren dan wel
      onvoldoende zekerheid bestaat met betrekking tot zijn bevoegdheid om de zending in ontvangst te nemen, dan wel om
      enige andere reden door een handelen of nalaten van de gezaghebber een veilige aflevering niet mogelijk is, draagt
      de transporteur de zending niet over.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100n
  - number: 100o.1
    text: |-
      Na ontvangst van de zending wordt deze terstond veilig gesteld. Indien de aflevering niet aan de kluis geschiedt,
      ziet de ambtenaar die de zending in ontvangst heeft genomen erop toe, dat de zending terstond in de kluis wordt
      opgeslagen.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100o
  - number: 100o.2
    text: |-
      De bij de zending gevoegde ontvangstbevestiging wordt na vergelijking van de verpakkingseenheden van de zending
      met de opgave in de leveringsbevestiging binnen vijf werkdagen na aflevering van de zending, aan de leverancier
      geretourneerd.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100o
  - number: 100o.3
    text: |-
      De controle van de inhoud van de verpakkingseenheden als bedoeld in het tweede lid geschiedt door de tot ontvangst
      bevoegde persoon, en ten minste één andere persoon. Van de controle wordt een proces-verbaal opgemaakt, dat bij de
      in [artikel 100p][ref1] bedoelde voorraadadministratie wordt gearchiveerd.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel100p
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100o
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: 100p
        hoofdstuk: XIVa
        paragraaf: '5'
  - number: 100o.4
    text: |-
      Bij constatering van afwijkingen tussen de inhoud van de zending en de opgave in de leveringsbevestiging wordt
      terstond contact opgenomen met de leverancier. De geconstateerde afwijkingen worden schriftelijk medegedeeld aan de
      Minister van Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100o
  - number: 100p.1
    text: De gezaghebber houdt een voorraadadministratie bij van de aan hem beschikbaar gestelde nooddocumenten.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100p
  - number: 100p.2
    text: |-
      Uit de voorraadadministratie dient, uitgesplitst naar soort, aan de hand van de documentnummers te allen tijde te
      blijken hoeveel nooddocumenten:
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100p
  - number: 100p.2.a
    text: in de voorraad aanwezig zijn;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100p
  - number: 100p.2.b
    text: aan de voorraad zijn toegevoegd;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100p
  - number: 100p.2.c
    text: aan de voorraad zijn onttrokken in verband met uitreiking;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100p
  - number: 100p.2.d
    text: zijn verschreven, gestolen, vermist of anderszins als onbruikbaar moeten worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100p
  - number: 100p.3
    text: |-
      Met betrekking tot de uitgereikte nooddocumenten wordt per opeenvolgend documentnummer apart geregistreerd aan wie
      uitreiking van het desbetreffende nooddocument heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100p
  - number: 100p.4
    text: De gezaghebber houdt de voorraadadministratie bij in het reisdocumentenstation.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100p
  - number: 100q.1
    text: |-
      Eén maal per jaar wordt het aantal in voorraad zijnde blanco nooddocumenten met vermelding van soort en
      documentnummer vastgesteld.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100q
  - number: 100q.2
    text: |-
      Indien op enig moment een omissie in de voorraad of in de administratie wordt geconstateerd, maakt de gezaghebber
      terstond een inventarisatie op van de aanwezige nooddocumenten.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100q
  - number: 100q.3
    text: De inventarisatie wordt opgesteld door ten minste twee personen.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100q
  - number: 100q.4
    text: |-
      Van de inventarisatie wordt een proces-verbaal opgemaakt, dat naar de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties wordt gezonden.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100q
  - number: 100r.1
    text: De blanco nooddocumenten worden in volgorde van de nummers verbruikt.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100r
  - number: 100r.2
    text: |-
      Het is een tot verstrekking bevoegde autoriteit niet toegestaan nooddocumenten te verbruiken die aan een andere
      autoriteit daartoe ter beschikking zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100r
  - number: 100s.1
    text: |-
      De gezaghebber verstrekt, met gebruikmaking van het daartoe door de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties beschikbaar gestelde formulier, een keer per kwartaal een schriftelijke verantwoording van het
      totale voorraadverloop met betrekking tot nooddocumenten over het voorgaande jaar aan de Minister van Binnenlandse
      Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100s
  - number: 100s.2
    text: 'Deze verantwoording bevat, uitgesplitst naar noodpaspoorten en laissez-passer''s:'
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100s
  - number: 100s.2.a
    text: de totale voorraad blanco nooddocumenten aan het begin van het kwartaal;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100s
  - number: 100s.2.b
    text: de in de loop van het kwartaal aan de voorraad toegevoegde blanco nooddocumenten;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100s
  - number: 100s.2.c
    text: de in de loop van het kwartaal aan de voorraad onttrokken nooddocumenten die zijn uitgereikt;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100s
  - number: 100s.2.d
    text: |-
      de in de loop van het kwartaal aan de voorraad onttrokken nooddocumenten die niet zijn uitgereikt, omdat zij zijn
      verschreven, gestolen, vermist of anderszins als onbruikbaar moeten worden beschouwd;
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100s
  - number: 100s.2.e
    text: de totale voorraad blanco nooddocumenten aan het einde van het kwartaal.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100s
  - number: 100s.3
    text: |-
      Nooddocumenten die onjuist blijken te zijn geproduceerd of beschadigd worden met het in het eerste lid bedoelde
      verantwoordingsformulier meegezonden aan de leverancier.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100s
  - number: 100s.4
    text: |-
      Nooddocumenten die als gevolg van verschrijvingen of anderszins onbruikbaar zijn geworden, worden definitief aan
      het verkeer onttrokken door ze deugdelijk te vernietigen op de in [artikel 67, eerste lid][ref1], aangegeven wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel67
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100s
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '67'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: 100s.5
    text: Het in het eerste lid bedoelde verantwoordingsformulier wordt ondertekend door of namens de gezaghebber.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel100s
  - number: '101'
    text: |-
      De reisdocumenten die voor de inwerkingtreding van deze regeling zijn verstrekt, behouden de geldigheid die daarin
      is vermeld.
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel101
  - number: '103'
    text: |-
      Voor het kalenderjaar 2017 wordt in [artikel 94, eerste lid][ref1], in plaats van ‘31 december van ieder jaar’
      gelezen ’1 oktober’ en voor ‘14 februari van het daarop volgende kalenderjaar’ vervangen door: 1 december.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel94
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '94'
        hoofdstuk: XII
  - number: '105'
    text: |-
      De burgemeester of de gezaghebber is slechts bevoegd van een aanvraagsysteem reisdocumenten in zijn gemeente
      of openbaar lichaam gebruik te maken nadat uit een daartoe door de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties ingesteld onderzoek is gebleken, dat aan het bepaalde in [artikel 87, tweede lid][ref1], wordt
      voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0012811#Artikel87
    url: https://wetten.overheid.nl/BWBR0012811/2026-04-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0012811
        artikel: '87'
        hoofdstuk: XI
        paragraaf: '4'
  - number: '106'
    text: |-
      Deze regeling berust mede op de [artikelen 1.4, eerste lid][ref1], [2.5, derde lid][ref2], [2.6, vierde lid][ref3],
      [2.7][ref4], [2.10, derde lid][ref5], [3.2, eerste lid][ref6], [4.2, eerste lid][ref7], [7.1, vierde lid][ref8],
      [8.1, derde lid][ref9], [8.2, eerste lid][ref10], en [10.1 van het besluit][ref11].


      [ref1]: https://wetten.overheid.nl/BWBR0044308#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0044308#Artikel2
