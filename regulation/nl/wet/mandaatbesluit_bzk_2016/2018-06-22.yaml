  - number: '5.9'
    text: |-
      1 De directeur verleent ondermandaat bij schriftelijk besluit, met uitzondering van de in
      [artikel 5.8, vierde lid][ref1], beschreven situatie, in overeenstemming met het diensthoofd en met kennisgeving
      aan de directeur Concernondersteuning en de directeur Financieel-economische Zaken.

      2 De door de directeur gemandateerde, bedoeld in artikel 5.9, eerste lid, verleent ondermandaat bij schriftelijk
      besluit, in overeenstemming met de directeur en met kennisgeving aan de directeur Concernondersteuning en aan de
      directeur Financieel-economische Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0038549#Artikel5.8
    url: https://wetten.overheid.nl/BWBR0038549/2018-06-22#Artikel5.9
