  - number: '7.2'
    text: |-
      1 De uitoefening van een mandaat geschiedt binnen de door de secretaris-generaal vastgestelde kaders met betrekking
      tot het beleid en beheer inzake de bedrijfsvoering van het ministerie.

      2 De uitoefening van een mandaat geschiedt met inachtneming van de departementale procedures en richtlijnen.

      3 Afwijking van het eerste lid ten aanzien van een onder het diensthoofd ressorterend dienstonderdeel is slechts
      mogelijk in overeenstemming met de secretaris-generaal, de directeur Financieel-economische Zaken en de directeur
      van het SG-Cluster die het aangaat en wordt schriftelijk vastgelegd.
    url: https://wetten.overheid.nl/BWBR0038549/2018-06-22#Artikel7.2
  - number: '7.3'
    text: |-
      1 De gemandateerde is verantwoordelijk voor het bijhouden van een of meer doelmatig ingerichte administraties die
      inzicht bieden in het door en namens de gemandateerde gevoerde financiële beheer en beheer van niet-geldelijke
      zaken op grond van diens mandaat.

      2 De directeur Financieel-economische Zaken is bevoegd om de administraties, bedoeld in het eerste lid, te
      onderzoeken ten behoeve van de uitvoering van taken behorende tot hun werkterrein.
    url: https://wetten.overheid.nl/BWBR0038549/2018-06-22#Artikel7.3
  - number: '7.4'
    text: |-
      1 Ondertekening van besluiten en stukken op grond van mandaat vindt plaats op de volgende wijze:

      De Minister van Binnenlandse Zaken en Koninkrijksrelaties,

      namens deze,

      (handtekening)

      (naam)

      (aanduiding functie gemandateerde)

      2 Bij ondertekening van besluiten en stukken op grond van volmacht wordt de aanduiding van de Minister voorafgegaan
      door: Namens de Staat der Nederlanden.

      3 Bij ondertekening van besluiten en stukken door een plaatsvervanger wordt de handtekening voorafgegaan door: b/a.
    url: https://wetten.overheid.nl/BWBR0038549/2018-06-22#Artikel7.4
  - number: '7.5'
    text: |-
      In gevallen waarin dit besluit niet voorziet, beslist de Minister, de secretaris-generaal of het diensthoofd over
      de doorverlening van zijn mandaat.
    url: https://wetten.overheid.nl/BWBR0038549/2018-06-22#Artikel7.5
  - number: '8.1'
    text: |-
      1 De directeur Concernondersteuning is belast met het beheer van dit besluit.

      2 De secretaris-generaal, de diensthoofden en de directeuren, ieder voor zover het hen aangaat, zijn
      verantwoordelijk voor een juiste, volledige en tijdige aanlevering aan de directeur Concernondersteuning van de
      gegevens die een goed beheer van dit besluit onderscheidenlijk het mandaatregister mogelijk maken.

      3 Het beheer en de aanlevering van gegevens geschieden met inachtneming van de desbetreffende (richtlijnen inzake)
      administratieve organisatiebeschrijvingen.

      4 De directeur Concernondersteuning rapporteert aan de Minister en de secretaris-generaal over het beheer van dit
      besluit en het centrale mandaatregister.
    url: https://wetten.overheid.nl/BWBR0038549/2018-06-22#Artikel8.1
  - number: '8.2'
    text: |-
      1 De directeur Concernondersteuning draagt zorg voor de inrichting en het beheer van een centraal mandaatregister.

      2 Het register biedt inzicht in:

      a. de functies en namen van functionarissen aan wie door of namens de Minister (onder)mandaat is (door)verleend,
      met aanduiding van de verleende bevoegdheid;

      b. de functies en namen van functionarissen die de Minister vertegenwoordigen in een (bestuurs)orgaan van een
      rechtspersoon anders dan de Staat, met aanduiding van het (bestuurs)orgaan en de rechtspersoon.

      3 Het register is openbaar.

      4 De directeur Concernondersteuning draagt zorg voor de gegevensverstrekking uit het register. Bij de uitvoering
      van deze werkzaamheden pleegt hij zo nodig overleg met de directeur Constitutionele Zaken en Wetgeving
    url: https://wetten.overheid.nl/BWBR0038549/2018-06-22#Artikel8.2
  - number: '8.3'
    text: |-
      1 In afwijking van [artikel 8.2, tweede lid][ref1], worden gegevens met betrekking tot de verlening van
      ondermandaat aan functionarissen in de rang van directeur en daaronder ressorterende functionarissen bij
      de Algemene Inlichtingen- en Veiligheidsdienst opgenomen in een door de directeur-generaal van de Algemene
      Inlichtingen- en Veiligheidsdienst bijgehouden mandaatregister.

      2 De directeur-generaal van de Algemene Inlichtingen- en Veiligheidsdienst kan in overeenstemming met de
      secretaris-generaal nadere regels stellen ten aanzien van het register, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0038549#Artikel8.2
    url: https://wetten.overheid.nl/BWBR0038549/2018-06-22#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0038549
        artikel: '8.2'
        hoofdstuk: '8'
  - number: '8.4'
    text: |-
      Wijziging van dit besluit geschiedt op initiatief van de directeur Concernondersteuning na advies van de directeur
      Financieel-economische Zaken en de directeur Constitutionele Zaken en Wetgeving.
    url: https://wetten.overheid.nl/BWBR0038549/2018-06-22#Artikel8.4
  - number: '9.1'
    text: |-
      1 Besluiten of handelingen die op grond van het [Mandaatbesluit BZK 2012][ref1] zijn genomen of verricht in de
      periode tot de datum van inwerkingtreding van dit besluit en waarin op het tijdstip van inwerkingtreding van dit
      besluit niet is voorzien, worden aangemerkt als te zijn genomen of verricht namens de Minister.

      2 Vóór het tijdstip van inwerkingtreding van dit besluit van kracht zijnde mandaten, ondermandaten, volmachten
      en machtigingen, waarin op het tijdstip van inwerkingtreding van dit besluit niet is voorzien, blijven van kracht
      totdat op grond van dit besluit is voorzien in mandaat, ondermandaat, volmacht of machtiging dan wel is voorzien in
      intrekking daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0031837
    url: https://wetten.overheid.nl/BWBR0038549/2018-06-22#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0031837
  - number: '9.2'
    text: |-
      Het [Mandaatbesluit BZK 2012][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0031837
    url: https://wetten.overheid.nl/BWBR0038549/2018-06-22#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0031837
  - number: '9.3'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin het wordt
      geplaatst en werkt terug tot en met 1 april 2016.
    url: https://wetten.overheid.nl/BWBR0038549/2018-06-22#Artikel9.3
  - number: '9.4'
    text: 'Dit besluit wordt aangehaald als: Mandaatbesluit BZK 2016.'
    url: https://wetten.overheid.nl/BWBR0038549/2018-06-22#Artikel9.4
