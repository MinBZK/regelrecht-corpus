  - number: '4.4'
    text: |-
      Het mandaat van de directeur-generaal Overheidsorganisatie omvat tevens:

      a. de leiding van het overleg met de centrales van overheidspersoneel en de overheidswerkgevers of verenigingen van
      overheidswerkgevers, bedoeld in de [Regeling overleg Raad voor het Overheidspersoneelsbeleid][ref1];

      b. de leiding van het overleg met de Sectorcommissie overleg rijkspersoneel, genoemd in het Algemeen
      Rijksambtenarenreglement.


      [ref1]: https://wetten.overheid.nl/BWBR0008494
    url: https://wetten.overheid.nl/BWBR0038549/2018-06-22#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0008494
  - number: '4.5'
    text: |-
      Het mandaat van het diensthoofd is niet van toepassing op:

      a. de onderdeeloverstijgende kaders van het beleid en beheer inzake alle aspecten van de bedrijfsvoering van
      het ministerie met inbegrip van aangelegenheden op organisatorisch, personeel, financieel en materieel gebied en
      aangelegenheden met betrekking tot het verrichten van privaatrechtelijke rechtshandelingen;

      b. het nader vaststellen van de inrichting van de onder de diensthoofden ressorterende dienstonderdelen op basis
      van het [Organisatiebesluit BZK 2016][ref1];

      c. aangelegenheden die op grond van bovendepartementale regelgeving of afspraken op centraal departementaal niveau
      dienen te worden afgehandeld;

      d. het vertegenwoordigen van de Minister in het departementaal overleg met de centrales van verenigingen van
      ambtenaren, bedoeld in [artikel 113 van het Algemeen Rijksambtenarenreglement][ref2];

      e. personele beheersbeslissingen op grond van het
      [Besluit financiën en personeel Kabinetten van de Gouverneurs][ref3] ten aanzien van de directeuren van de
      Kabinetten van de Gouverneurs van Aruba, Curaçao en Sint Maarten;

      f. het optreden als gemachtigd ambtenaar in de zin van departementale regelgeving met betrekking tot de uitvoering
      van de [Wet openbaarheid van bestuur][ref4];

      g. het optreden als bevoegd gezag als bedoeld in de [Interne klokkenluidersregeling Rijk, Politie en Defensie][ref5];

      h. het verlenen van ontslag aan een ambtenaar op grond van [artikel 125e van de Ambtenarenwet][ref6];

      i. het vaststellen en ondertekenen van beleidsregels en circulaires met betrekking tot de aangelegenheden, bedoeld
      in dit artikel;

      j. het toekennen van vergoeding van representatiekosten op grond van
      [artikel 68a Algemeen Rijksambtenarenreglement][ref7].


