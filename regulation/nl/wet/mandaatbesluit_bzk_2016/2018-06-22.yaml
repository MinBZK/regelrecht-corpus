      - id: ref2
        bwb_id: BWBR0038549
  - number: '5.8'
    text: |-
      1 De directeur is, voor zover niet anders is bepaald, bevoegd tot het verlenen van ondermandaat aan onder hem
      ressorterende functionarissen ten aanzien van aangelegenheden op het werkterrein van deze functionarissen,
      respectievelijk tot het beperken of het intrekken daarvan.

      2 De directeur die leiding geeft aan een agentschap is tevens bevoegd tot het verlenen van ondermandaat voor het
      uitoefenen van integraal management met inbegrip van aangelegenheden op organisatorisch, personeel, financieel en
      materieel gebied.

      3 De directeur kan, voor zover niet anders is bepaald, bij het verlenen van ondermandaat tevens de bevoegdheid
      toekennen tot het verlenen van ondermandaat aan een rechtstreeks onder de gemandateerde ressorterende functionaris
      ten aanzien van aangelegenheden op het werkterrein van de functionaris.

      4 De directeur is bevoegd om in bijzondere gevallen, naast het bepaalde in het eerste, tweede en derde lid,
      mondeling of schriftelijk ondermandaat te verlenen aan een onder hem ressorterende functionaris voor een bepaald
      geval, met inachtneming van [artikel 1, derde lid, van het Besluit privaatrechtelijke rechtshandelingen 1996][ref1].

      5 Het verlenen van ondermandaat door de directeur, niet zijnde een directeur die leiding geeft aan een agentschap,
      voor het aangaan van financiële verplichtingen en het doen van uitgaven is enkel mogelijk aan in [bijlage 1][ref2]
      van dit besluit genoemde onder hem ressorterende functionarissen met inachtneming van het aldaar genoemde
      maximumgrensbedrag per (meerjarige) verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0007804#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0038549
