        artikel: '3'
  - number: '2.2'
    text: |-
      Mandaat wordt evenmin verleend met betrekking tot stukken bestemd voor:

      a. de Koning;

      b. de Raad van Ministers (van het Koninkrijk) en daaruit gevormde onderraden en commissies;

      c. de voorzitters van de Eerste en Tweede Kamer der Staten-Generaal en de voorzitters van uit de Kamers gevormde
      commissies;

      d. een minister of een staatssecretaris;

      e. de Raad van State (van het Koninkrijk);

      f. de Algemene Rekenkamer;

      g. de Nationale ombudsman;

      h. de Gouverneurs van Aruba, Curaçao en Sint Maarten;

      i. de Ministers van Aruba, Curaçao en Sint Maarten;

      j. de Gevolmachtigde Ministers van Aruba, Curaçao en Sint Maarten;

      k. de besturen van de openbare lichamen Bonaire, Sint Eustatius en Saba;

      l. buitenlandse autoriteiten, in rang gelijk aan of hoger dan een minister of een staatssecretaris,

      tenzij het een stuk betreft van louter informatieve of administratieve aard, dan wel het een aangelegenheid betreft
      van ondergeschikt beleidsmatig of politiek belang.
    url: https://wetten.overheid.nl/BWBR0038549/2018-06-22#Artikel2.2
  - number: '3.1'
    text: |-
      Aan de secretaris-generaal wordt mandaat verleend ten aanzien van aangelegenheden die, gelet op het koninklijk
      besluit van 18 oktober 1988, houdende regeling van de functie en verantwoordelijkheid van de secretaris-generaal,
      behoren tot het werkterrein van de secretaris-generaal.
    url: https://wetten.overheid.nl/BWBR0038549/2018-06-22#Artikel3.1
  - number: '3.2'
    text: |-
      Onverminderd het bepaalde in dit besluit, heeft het mandaat van de secretaris-generaal in ieder geval betrekking
      op:

      a. het werkterrein van de functionarissen en organisatieonderdelen van het ministerie, met uitzondering van de
      taken van het Bureau Algemene Bestuursdienst, genoemd in het [Organisatiebesluit BZK 2016][ref1];

      b. het beleid en beheer inzake alle aspecten van de bedrijfsvoering van het ministerie met inbegrip van
      aangelegenheden op organisatorisch, personeel, financieel en materieel gebied;

      c. het vaststellen van de formatie van het ministerie, bedoeld in
      [artikel 3, tweede lid, van het Coördinatiebesluit organisatie en bedrijfsvoering rijksdienst 2011][ref2];

      d. het rechtstreeks leiding geven aan de diensthoofden en overige rechtstreeks onder de secretaris-generaal
      ressorterende functionarissen, voor zover ten aanzien van de directeur-generaal voor de Algemene Bestuursdienst
      niet anders is bepaald;

      e. het nader vaststellen van de inrichting van het ministerie;

      f. aangelegenheden die op grond van bovendepartementale regelgeving of afspraken op centraal departementaal niveau
      dienen te worden afgehandeld;

      g. het beslissen op bezwaarschriften, met inbegrip van de personele bezwaren, anders dan bedoeld in
      [artikel 5.4, onder a][ref3];

      h. het optreden als gemachtigd ambtenaar in de zin van departementale regelgeving met betrekking tot de uitvoering
      van de [Wet openbaarheid van bestuur][ref4];

      i. het behandelen van klachten ingevolge een wettelijke regeling met betrekking tot klachtrecht, waarover door een
      commissie wordt gerapporteerd of geadviseerd;

      j. het vertegenwoordigen van de Minister in het departementaal overleg met de centrales van verenigingen van
      ambtenaren, bedoeld in [artikel 113 van het Algemeen Rijksambtenarenreglement][ref5];

      k. personele beheersbeslissingen op grond van het
      [Besluit financiën en personeel Kabinetten van de Gouverneurs][ref6] ten aanzien van de directeuren van de
      Kabinetten van de Gouverneurs van Aruba, Curaçao en Sint Maarten;

      l. de verantwoordelijkheid voor het beheer van de archiefbescheiden bij het ministerie op grond van de geldende
      wet- en regelgeving;

      m. het vertegenwoordigen van de Minister namens de Staat in gerechtelijke procedures waarbij het ministerie is
      betrokken;

      n. het vaststellen van beleidsregels en circulaires met betrekking tot de aangelegenheden, bedoeld in dit artikel;

      o. het beslissen op bezwaarschriften tegen de door de directeur-generaal van de Algemene
      Inlichtingen- en Veiligheidsdienst genomen besluiten met betrekking tot aanvragen als bedoeld in
      [hoofdstuk 4 van de Wet op de inlichtingen- en veiligheidsdiensten 2002][ref7];

      p. de bevoegdheid om te beslissen op bezwaarschriften tegen namens de Minister genomen besluiten met betrekking tot
      de uitvoering van de begroting voor Koninkrijksrelaties, met uitzondering van besluiten die door de Minister of de
      secretaris-generaal zijn genomen;

      q. het wijzigen van [bijlage 1][ref8] van dit besluit.


