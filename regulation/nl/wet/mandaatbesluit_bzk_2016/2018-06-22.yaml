  - number: '3.6'
    text: |-
      1 Bij tijdelijke afwezigheid of verhindering van de secretaris-generaal worden diens taken uitgeoefend door het
      diensthoofd, de diensthoofden of de directeur Concernondersteuning, die bij schriftelijk besluit van de secretaris-
      generaal in overeenstemming met de Minister is of zijn aangewezen als plaatsvervanger.

      2 Bij gebreke van voornoemd besluit of bij afwezigheid van de aangewezen plaatsvervanger(s) is één van de
      diensthoofden, naar anciënniteit van de benoeming in de functie, met de plaatsvervanging belast.
    url: https://wetten.overheid.nl/BWBR0038549/2018-06-22#Artikel3.6
  - number: '4.1'
    text: |-
      Aan het diensthoofd wordt mandaat verleend ten aanzien van aangelegenheden die behoren tot het werkterrein van het
      diensthoofd en de onder het diensthoofd ressorterende functionarissen en dienstonderdelen.
    url: https://wetten.overheid.nl/BWBR0038549/2018-06-22#Artikel4.1
  - number: '4.2'
    text: |-
      1 Onverminderd het bepaalde in dit besluit, heeft het mandaat van het diensthoofd in ieder geval betrekking op:

      a. het uitoefenen van integraal management met inbegrip van aangelegenheden op organisatorisch, personeel,
      financieel en materieel gebied;

      b. het vaststellen van de capaciteitsplannen binnen de door de secretaris-generaal vastgestelde formatie van de
      onder de diensthoofden ressorterende dienstonderdelen;

      c. het leiding geven aan de rechtstreeks onder het diensthoofd ressorterende functionarissen;

      d. het optreden als bestuurder in de zin van de [Wet op de ondernemingsraden][ref1] in het overleg met de
      ondernemingsraad van de onder het diensthoofd ressorterende dienstonderdelen, voor zover niet een onder het
      diensthoofd ressorterende functionaris als zodanig optreedt;

      e. het vertegenwoordigen van de Minister namens de Staat in gerechtelijke procedures waarbij het dienstonderdeel
      is betrokken;

      f. het vaststellen van beleidsregels en circulaires met betrekking tot aangelegenheden op het werkterrein van het
      diensthoofd;

      g. het beheer van de archiefbescheiden van de onder het diensthoofd ressorterende dienstonderdelen op grond van de
      desbetreffende departementale regelgeving;

      h. het afnemen van de eed of de belofte van ambtenaren die worden aangesteld bij een onder het diensthoofd
      ressorterend dienstonderdeel;

      i. het beslissen op bezwaarschriften gericht tegen besluiten inzake aangelegenheden die behoren tot zijn
      werkterrein, met inbegrip van de personele bezwaren, anders dan bedoeld in [artikel 5.4, onder a][ref2], en met
      uitzondering van die besluiten die door de Minister, de secretaris-generaal of het diensthoofd zijn genomen,
      onverminderd [artikel 4.3][ref3] en voor zover in wet- en regelgeving niet anders is bepaald;

      j. het inschakelen van de Landsadvocaat voor ondersteuning of vertegenwoordiging van het ministerie.

      2 Het eerste lid, onder a, b, d en h, is niet van toepassing op de diensthoofden van BZK Kerndepartement.


