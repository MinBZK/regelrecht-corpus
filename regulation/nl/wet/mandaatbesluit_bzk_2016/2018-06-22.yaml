        bwb_id: BWBR0038547
  - number: '5.1'
    text: |-
      Aan de directeur wordt mandaat verleend ten aanzien van aangelegenheden die behoren tot het werkterrein van de
      directeur en de onder de directeur ressorterende functionarissen en dienstonderdelen.
    url: https://wetten.overheid.nl/BWBR0038549/2018-06-22#Artikel5.1
  - number: '5.2'
    text: |-
      1 Onverminderd het bepaalde in dit besluit, heeft het mandaat van de directeur in ieder geval betrekking op:

      a. het uitoefenen van integraal management met inbegrip van aangelegenheden op organisatorisch, personeel,
      financieel en materieel gebied;

      b. het leiding geven aan de rechtstreeks onder de directeur ressorterende functionarissen;

      c. het optreden als bestuurder in de zin van de [Wet op de ondernemingsraden][ref1] in het overleg met de
      ondernemingsraad van het desbetreffende dienstonderdeel, voor zover het diensthoofd niet als zodanig optreedt;

      d. het vertegenwoordigen van de Minister namens de Staat in gerechtelijke procedures waarbij het
      organisatieonderdeel is betrokken;

      e. het afnemen van de eed of de belofte van ambtenaren bij het dienstonderdeel waarover de directeur de leiding
      voert voor zover het een agentschap betreft;

      f. het beslissen op bezwaarschriften gericht tegen besluiten inzake aangelegenheden die behoren tot zijn
      werkterrein met inbegrip van de personele bezwaren, anders dan bedoeld in [artikel 5.4, onder a][ref2], en met
      uitzondering van die besluiten die door de Minister, de secretaris-generaal, het diensthoofd of de directeur zijn
      genomen, voor zover in wet- en regelgeving niet anders is bepaald.

      2 Het eerste lid, onder a, c en e, zijn niet van toepassing op de directeuren van BZK Kerndepartement.


      [ref1]: https://wetten.overheid.nl/BWBR0002747
      [ref2]: https://wetten.overheid.nl/BWBR0038549#Artikel5.4
    url: https://wetten.overheid.nl/BWBR0038549/2018-06-22#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0002747
      - id: ref2
        bwb_id: BWBR0038549
        artikel: '5.4'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '5.3'
    text: |-
      Het mandaat van de directeur Financieel-economische Zaken omvat tevens:

      a. de uitvoering van [artikel 21 van de Comptabiliteitswet 2001][ref1] en het [Besluit taak FEZ][ref2];

      b. het geven van instructies aan de onderdelen die verantwoordelijk zijn voor de financiële bedrijfsvoering en
      control;

      c. het inhoudelijk aansturen van onderdelen die zijn betrokken bij het bewaken van en adviseren over de uitvoering
      van de bedrijfsvoering in brede zin.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0005333
    url: https://wetten.overheid.nl/BWBR0038549/2018-06-22#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0005333
  - number: '5.4'
    text: |-
      Het mandaat van de directeur Concernondersteuning omvat tevens:

      a. het beslissen op bezwaarschriften tegen besluiten met betrekking tot een personele aangelegenheid voor
      zover wordt besloten tot herroeping van het bestreden besluit zonder dat het bezwaar is voorgelegd aan de
      Bezwarenadviescommissie personele aangelegenheden dan wel wanneer wordt besloten in afwijking van het advies van
      deze commissie;

      b. het vertegenwoordigen van de Minister namens de Staat in gerechtelijke procedures met betrekking tot een
      personele aangelegenheid;

      c. het ondertekenen van procedurele stukken in het kader van de behandeling van bezwaarschriften tegen besluiten
      van of namens de Minister met betrekking tot een personele aangelegenheid;

      d. het inschakelen van de Landsadvocaat voor ondersteuning of vertegenwoordiging van het Ministerie inzake
      rechtspositionele vraagstukken;

      e. het ondertekenen van stukken met betrekking tot het voeren van de salarisadministratie bij de directie;

      f. het aangaan van directieoverstijgende departementale (raam)overeenkomsten behorend tot de vakgebieden Personeel
      & Organisatie en Communicatie voor zover hier niet in wordt voorzien vanuit categoriemanagement;

      g. de vergoeding van representatiekosten op grond van [artikel 68a Algemeen Rijksambtenarenreglement][ref1];

      h. het geven van vakinhoudelijke instructies aan de Personeel & Organisatieafdelingen van alle dienstonderdelen en
      tot het geven van advies aan managers op het gebied van Personeel & Organisatiezaken van het ministerie;

      i. het op verzoek van het bevoegd gezag aanwijzen van bedrijfshulpverleners;

      j. het op verzoek van het bevoegd gezag sluiten van stageovereenkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel68a
    url: https://wetten.overheid.nl/BWBR0038549/2018-06-22#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 68a
  - number: '5.5'
    text: |-
      Het mandaat van de directeur Democratie en Burgerschap omvat tevens de uitvoering van de
      [Wet raadgevend referendum][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0036443
    url: https://wetten.overheid.nl/BWBR0038549/2018-06-22#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0036443
  - number: '5.6'
    text: |-
      1 Het mandaat van de directeur is niet van toepassing op:

      a. personele aangelegenheden ten aanzien van rechtstreeks onder de secretaris-generaal of het diensthoofd
      ressorterende functionarissen;

      b. het aanstellen van een ambtenaar;

      c. het verlenen van een gratificatie bij ambtsjubileum;

      d. het opleggen van een disciplinaire straf;

      e. het schorsen van een ambtenaar in zijn ambt;

      f. het verlenen van ontslag aan een ambtenaar;

      g. het aanwijzen van een ambtenaar als VWNW-kandidaat;

      h. het vaststellen van beleidsregels en circulaires ten aanzien van aangelegenheden op het werkterrein van het
      diensthoofd, tenzij deze bevoegdheid in hogere regelgeving aan de desbetreffende functionaris is toegekend;

      i. het besluiten tot een reorganisatie in de zin van de rechtspositieregeling;

      j. het toekennen van materiële schadevergoeding vanaf € 2.500,– of immateriële schadevergoeding;

      k. het vaststellen van de formatie van de onder de diensthoofden ressorterende dienstonderdelen;

      l. de onderwerpen genoemd in [artikel 4.5][ref1].

      2 De beperkingen genoemd in het eerste lid, onderdeel b tot en met f, zijn niet van toepassing op het mandaat van
      de directeur die leiding geeft aan een agentschap.


      [ref1]: https://wetten.overheid.nl/BWBR0038549#Artikel4.5
    url: https://wetten.overheid.nl/BWBR0038549/2018-06-22#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0038549
        artikel: '4.5'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '5.7'
    text: |-
      1 Het mandaat van de directeur met betrekking tot het aangaan van financiële verplichtingen en het doen van
      uitgaven is beperkt tot het budget dat aan de directeur ter beschikking is gesteld op basis van een door het
      diensthoofd en de DG-controller goedgekeurde budgettaire uitwerking van dat deel van de begroting waarvoor de
      directeur verantwoordelijk is met een maximum bedrag per (meerjarige) verplichting als vermeld in [bijlage 1][ref1]
      van dit besluit.

      2 De directeur is bevoegd om in afwijking van het eerste lid financiële verplichtingen aan te gaan en uitgaven te
      doen, voor zover aan hem daartoe uitdrukkelijk en schriftelijk mandaat is verleend door de Minister, de secretaris-
      generaal of het diensthoofd, met instemming van de DG-Controller en binnen het vastgestelde budget dat aan het
      diensthoofd ter beschikking is gesteld.

      3 De directeur legt over het door hem gevoerde financiële beheer verantwoording af aan het diensthoofd.

      4 In afwijking van het derde lid legt de directeur binnen het SG-Cluster over het door hem gevoerde financiële
      beheer verantwoording af aan de directeur Concernondersteuning.

      5 In afwijking van het vierde lid legt de directeur Concernondersteuning over het door hem gevoerde financiële
      beheer verantwoording af aan de secretaris-generaal.

      6 De directeur van een agentschap is verantwoordelijk voor een kostendekkende exploitatie binnen de afspraken die
      hij met opdrachtgevers en de eigenaar heeft gemaakt. Voor het aangaan van financiële verplichtingen en het doen van
      uitgaven geldt voor de directeur een maximum bedrag per (meerjarige) verplichting als vermeld in [bijlage 1][ref2]
      van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0038549
      [ref2]: https://wetten.overheid.nl/BWBR0038549
    url: https://wetten.overheid.nl/BWBR0038549/2018-06-22#Artikel5.7
    references:
