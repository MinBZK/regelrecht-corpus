  - number: '5.11'
    text: |-
      1 Bij tijdelijke afwezigheid of verhindering van de directeur worden diens taken volledig uitgeoefend door de
      plaatsvervangend directeur.

      2 De aanwijzing van een plaatsvervangend directeur geschiedt door de directeur met inachtneming van het
      [Organisatiebesluit BZK 2016][ref1] en in overeenstemming met het diensthoofd.

      3 Bij gelijktijdige tijdelijke afwezigheid of verhindering van de directeur en de plaatsvervangend directeur worden
      de taken van de directeur bij wijze van plaatsvervanging uitgeoefend door de leidinggevende van de directeur.

      4 In afwijking van het vorige lid kan de plaatsvervanging van de directeur die leiding geeft aan een agentschap
      volledig worden uitgeoefend door de functionaris die daartoe door de directeur in overeenstemming met het
      diensthoofd is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0038547
    url: https://wetten.overheid.nl/BWBR0038549/2018-06-22#Artikel5.11
    references:
      - id: ref1
        bwb_id: BWBR0038547
  - number: '6.1'
    text: |-
      Het mandaat van de directeur Ambtenaar en Organisatie omvat tevens:

      a. het centraal opdrachtgeverschap aan P-Direkt voor de uitvoering van de standaard dienstverlening;

      b. het beheer van het budget dat in het kader van de centrale bekostiging is overgedragen.
    url: https://wetten.overheid.nl/BWBR0038549/2018-06-22#Artikel6.1
  - number: '6.2'
    text: |-
      Het mandaat van de directeur Inkoop-, Facilitair- en Huisvestingbeleid Rijk omvat tevens:

      a. het centraal opdrachtgeverschap aan FM Haaglanden voor de uitvoering van de standaard dienstverlening;

      b. het beheer van het budget dat in het kader van de centrale bekostiging is overgedragen.
    url: https://wetten.overheid.nl/BWBR0038549/2018-06-22#Artikel6.2
  - number: '6.3'
    text: |-
      1 Het mandaat van de directeur Concernondersteuning omvat tevens de uitvoering van de rijksbrede inkoopcategorie
      Vervoer.

      2 Het mandaat van de directeur-generaal Rijksvastgoedbedrijf omvat tevens de uitvoering van de rijksbrede
      inkoopcategorie Energie.

      3 Het mandaat van de CIO BZK omvat tevens de uitvoering van de rijksbrede inkoopcategorie ICT-werkomgeving Rijk.

      4 De directeur Concernondersteuning kan de CIO BZK en de directeur-generaal Rijksvastgoedbedrijf instructies geven
      over de uitoefening van het mandaat, bedoeld in het tweede onderscheidenlijk derde lid, en inlichtingen vragen over
      de uitoefening dienaangaande.
    url: https://wetten.overheid.nl/BWBR0038549/2018-06-22#Artikel6.3
  - number: '6.4'
    text: |-
      1 De maximumbedragen voor het aangaan van financiële verplichtingen en het doen van uitgaven, als vermeld in
      [bijlage 1][ref1] van dit besluit, zijn niet van toepassing op de in dit hoofdstuk verleende mandaten.

      2 Voor het aangaan van (meerjarige) verplichtingen boven de 25 miljoen euro inclusief BTW voor de rijksbrede
      inkoopcategorie Vervoer heeft de directeur Concernondersteuning mandaat samen met de secretaris-generaal.

      3 Voor het aangaan van (meerjarige) verplichtingen boven de 25 miljoen euro inclusief BTW voor de rijksbrede
      inkoopcategorie Energie heeft de directeur Rijksvastgoedbedrijf mandaat samen met de secretaris-generaal.

      4 Voor het aangaan van (meerjarige) verplichtingen boven de 10 miljoen euro inclusief BTW voor de rijksbrede
      inkoopcategorie ICT-werkomgeving Rijk heeft de CIO BZK mandaat samen met de secretaris-generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0038549
    url: https://wetten.overheid.nl/BWBR0038549/2018-06-22#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0038549
  - number: '7.1'
    text: |-
      De uitoefening van een mandaat geschiedt met inachtneming van:

      a. algemene en bijzondere aanwijzingen van de mandaatgever ten aanzien van de uitoefening van het mandaat;

      b. departementale richtlijnen met betrekking tot paraaf en medeparaaf en het voorleggen en afdoen van stukken;

      c. de van toepassing zijnde wet- en regelgeving en overige departementale richtlijnen, in
      het bijzonder de [Comptabiliteitswet 2001][ref1], de [Wet op de ondernemingsraden][ref2], het
      [Besluit privaatrechtelijke rechtshandelingen 1996][ref3], het [Besluit taak FEZ][ref4], het departementale
      kader voor externe inhuur, het [Organisatiebesluit BZK 2016][ref5] en (de richtlijnen inzake) administratieve
      organisatiebeschrijvingen.


      [ref1]: https://wetten.overheid.nl/BWBR0013891
      [ref2]: https://wetten.overheid.nl/BWBR0002747
      [ref3]: https://wetten.overheid.nl/BWBR0007804
      [ref4]: https://wetten.overheid.nl/BWBR0005333
      [ref5]: https://wetten.overheid.nl/BWBR0038547
