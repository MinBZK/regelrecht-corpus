preamble:
  text: |-
    Gelet op de artikelen 10:3, 10:9 en 10:12 van de Algemene wet bestuursrecht en de artikelen 22, vierde lid, en 32,
    vierde lid, van de Comptabiliteitswet 2011;

    besluiten

    vast te stellen het navolgende Mandaatbesluit:
  url: https://wetten.overheid.nl/BWBR0038549/2018-06-22#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. *ministerie:* het ministerie van Binnenlandse Zaken en Koninkrijksrelaties;

      b. *Minister:* de Minister van Binnenlandse Zaken en Koninkrijksrelaties;

      c. *diensthoofd:* een directeur-generaal of de Nationaal Commissaris Digitale Overheid;

      d. *directeur:* de leidinggevende werkzaam binnen een in het [Organisatiebesluit BZK 2016][ref1] genoemd
      dienstonderdeel die rechtstreeks ressorteert onder de secretaris-generaal, een directeur-generaal of de Nationaal
      Commissaris Digitale Overheid;

      e. *mandaat:* de bevoegdheid om namens de Minister besluiten te nemen en stukken af te doen en te ondertekenen;

      f. *werkterrein:* de taken van de betreffende functionaris en zijn dienstonderdeel overeenkomstig het
      [Organisatiebesluit BZK 2016][ref2] en de daarop berustende bepalingen;

      g. *SG-Cluster:* de directies Concernondersteuning, Koninkrijksrelaties, Financieel-economische Zaken,
      Constitutionele Zaken en Wetgeving, de staf van de Chief Information Officer BZK en BZK Flex en het programma
      directoraat-generaal Wederopbouw Bovenwindse eilanden;

      h. *BZK Kerndepartement:* de directoraten-generaal Bestuur en Wonen en Overheidsorganisaties, met uitzondering van
      de agentschappen Logius en de Rijksdienst voor Identiteitsgegevens, en het SG-Cluster.


      [ref1]: https://wetten.overheid.nl/BWBR0038547
      [ref2]: https://wetten.overheid.nl/BWBR0038547
    url: https://wetten.overheid.nl/BWBR0038549/2018-06-22#Artikel1.1
    references:
