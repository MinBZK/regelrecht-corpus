    text: |-
      1 Het mandaat van de directeur-generaal Algemene Inlichtingen- en Veiligheidsdienst
      omvat tevens de bevoegdheid om te besluiten op aanvragen als bedoeld in
      [hoofdstuk 4 van de Wet op de inlichtingen- en veiligheidsdiensten 2002][ref1].

      2 Het eerste lid is niet van toepassing op bezwaarschriften dienaangaande.


