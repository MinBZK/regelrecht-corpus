$id: investeringsregeling_energiebesparing
regulatory_layer: WET
publication_date: '2007-02-15'
valid_from: '2006-11-15'
valid_to: '2007-03-31'
bwb_id: BWBR0020502
url: https://wetten.overheid.nl/BWBR0020502/2006-11-15
preamble:
  text: |-
    Gelet op verordening (EG) nr. 1/2004 van de Commissie van de Europese Gemeenschappen van 23 december 2003,
    betreffende de toepassing van de artikelen 87 en 88 van het EG-Verdrag op staatssteun voor kleine en middelgrote
    ondernemingen die landbouwproducten produceren, verwerken en afzetten;

    Gelet op de artikelen 2, 4 en 6 van de Kaderwet LNV-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0020502/2006-11-15#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - Minister: Minister van Landbouw, Natuur en Voedselkwaliteit;
        - landbouwonderneming: onderneming waarin de primaire productie van landbouwproducten plaatsvindt, zijnde een
      kleine of middelgrote onderneming zoals omschreven in bijlage I bij [verordening (EG) nr. 70/2001](32001R0070)
      van de Commissie van 12 januari 2001 betreffende de toepassing van de artikelen 87 en 88 van het EG-Verdrag op
      staatssteun voor kleine en middelgrote ondernemingen;
        - landbouwproducten: de producten genoemd in bijlage I bij het Verdrag tot oprichting van de Europese Gemeenschap,
      met uitzondering van de producten genoemd in hoofdstuk 3 van die bijlage;
        - energie-extensief: energieverbruik op een glastuinbouwonderneming dat blijkens de jaarafrekening van het
      energiebedrijf over het jaar voorafgaand aan het jaar waarin de subsidieaanvraag wordt ingediend, niet hoger is dan
      25 m3 gas van normale calorische waarde per m2 glasoppervlak;
        - energie-intensief: energieverbruik op een glastuinbouwonderneming dat blijkens de jaarafrekening van het
      energiebedrijf over het jaar voorafgaand aan het jaar waarin de subsidieaanvraag wordt ingediend, tenminste 25 m3
      gas van normale calorische waarde per per m2 glasoppervlak bedraagt;
        - samenwerkingsverband: samenwerkingsverband van ten minste twee en maximaal drie landbouwondernemingen, ieder met
      een andere eigenaar, gericht op het realiseren van een van de doelstellingen van deze regeling op het grondgebied
      van deze landbouwondernemingen.
    url: https://wetten.overheid.nl/BWBR0020502/2006-11-15#Artikel1
  - number: '2'
    text: |-
      Op grond van deze regeling kan op aanvraag door de Minister aan een landbouwonderneming in Nederland subsidie
      worden verleend voor investeringen op het terrein van energiebesparing geïmplementeerd op het grondgebied van de
      landbouwonderneming.
    url: https://wetten.overheid.nl/BWBR0020502/2006-11-15#Artikel2
  - number: '3'
    text: |-
      De Minister verdeelt het voor subsidie beschikbare bedrag in volgorde van ontvangst van de volledige aanvragen
      tot subsidieverlening.

      Indien door subsidieverlening van aanvragen met dezelfde datum van ontvangst het subsidieplafond zou worden
      overschreden, geschiedt rangschikking van die aanvragen door loting, waarbij de door loting hoogst gerangschikte
      aanvraag het eerst voor subsidieverlening in aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0020502/2006-11-15#Artikel3
  - number: '4'
    text: |-
      1 De aanvraag tot subsidieverlening wordt ingediend bij Dienst Regelingen op een daartoe door Dienst Regelingen
      verstrekt formulier.

      De aanvraag gaat vergezeld van de in de bijlage met betrekking tot de onderscheiden investeringen genoemde
      documenten.

      2 De Minister kan de subsidieontvanger ook andere verplichtingen opleggen indien deze noodzakelijk zijn om te
      controleren of de subsidie overeenkomstig de doelstelling van deze regeling wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0020502/2006-11-15#Artikel4
  - number: '5'
    text: |-
      Indien de aanvraag wordt ingediend door een samenwerkingsverband, wordt één van de aan het samenwerkingsverband
      deelnemende aanvragers door de overige deelnemers door een machtigingsformulier gemachtigd tot het indienen van
      de aanvraag.
    url: https://wetten.overheid.nl/BWBR0020502/2006-11-15#Artikel5
  - number: '6'
    text: |-
      Ingeval sprake is van een onvolledige aanvraag tot subsidieverlening in de zin van
      [artikel 4:5 van de Algemene wet bestuursrecht][ref1], komt de aanvraag voor behandeling in aanmerking op de dag
      waarop de aanvraag volledig is aangevuld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0020502/2006-11-15#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:5
  - number: '7'
    text: |-
      Een subsidie ten laste van een begroting die nog niet is vastgesteld, wordt verleend onder de voorwaarde, bedoeld
      in [artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel434
    url: https://wetten.overheid.nl/BWBR0020502/2006-11-15#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:34
  - number: '8'
    text: |-
      1 De volledige aanvraag tot subsidievaststelling wordt uiterlijk 2 april 2007 ingediend bij Dienst Regelingen op
      een daartoe door Dienst Regelingen verstrekt formulier.

      2 De aanvraag gaat vergezeld van de in de bijlage met betrekking tot de onderscheiden investeringen genoemde
      documenten.
    url: https://wetten.overheid.nl/BWBR0020502/2006-11-15#Artikel8
  - number: '9'
    text: Aanvragen tot subsidieverlening kunnen worden ingediend vanaf 15 november 2006 tot en met 29 november 2006.
    url: https://wetten.overheid.nl/BWBR0020502/2006-11-15#Artikel9
  - number: '10'
    text: Het subsidieplafond voor deze regeling bedraagt € 6.000.000,00.
    url: https://wetten.overheid.nl/BWBR0020502/2006-11-15#Artikel10
  - number: '11'
    text: |-
      1 Indien de subsidieaanvrager voor dezelfde subsidiabele activiteiten tevens subsidie van een bestuursorgaan heeft
      aangevraagd of ontvangen, dan wel in verband daarmee van anderen inkomsten verwerft, doet hij daarvan mededeling in
      de aanvraag.

      2 In de situatie, bedoeld in het eerste lid:

        - wordt op grond van deze regeling geen subsidie verstrekt voor kosten die uit andere hoofde zijn of worden
      gesubsidieerd of gefinancierd, en
        - wordt slechts een zodanig bedrag aan subsidie verstrekt dat het totaal van alle subsidiebedragen niet meer
      bedraagt dan 40% van de subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0020502/2006-11-15#Artikel11
  - number: '12'
    text: |-
      Indien toepassing wordt gegeven aan [artikel 4:57 van de Algemene wet bestuursrecht ][ref1]of
      [artikel 6 van de Kaderwet LNV-subsidies][ref2], worden terug te vorderen bedragen vermeerderd met de wettelijke
      rente vanaf het tijdstip van subsidieverstrekking tot aan het tijdstip van algehele voldoening.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel457
      [ref2]: https://wetten.overheid.nl/BWBR0009194#Artikel6
    url: https://wetten.overheid.nl/BWBR0020502/2006-11-15#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:57
      - id: ref2
        bwb_id: BWBR0009194
        artikel: '6'
  - number: '13'
    text: |-
      1 De Minister kan subsidie verstrekken voor de investeringen en aan de landbouwondernemingen, genoemd in de bijlage
      bij deze regeling.

      2 Subsidie wordt uitsluitend verstrekt voor nieuwe machines en nieuw materieel, met inbegrip van
      computerprogrammatuur tot maximaal de marktwaarde van de activa.
    url: https://wetten.overheid.nl/BWBR0020502/2006-11-15#Artikel13
  - number: '14'
    text: |-
      1 De subsidie wordt alleen verleend indien:

      a. de eigenaar, gerechtigde, pachter, directeur of bedrijfsleider van de landbouwonderneming beschikt over
      voldoende agrarische vakbekwaamheid, hetgeen blijkt uit:

      1°. het bezit van een getuigschrift van een erkende landbouwkundige opleiding onderscheidenlijk van een opleiding
      van een hiermee gelijkwaardig niveau, of

      2°. de omstandigheid dat hij op het moment van de aanvraag ten minste drie jaren op een landbouwonderneming
      werkzaam is geweest.

      b. de landbouwonderneming voldoet aan de geldende nationale en Europese minimumnormen op het gebied van
      milieu, hygiëne en dierenwelzijn, hetgeen betekent dat hij op het tijdstip van het indienen van de aanvraag
      tot subsidieverlening de landbouwonderneming uitoefent met inachtneming van de geldende nationale en Europese
      minimumnormen op het gebied van milieu, dierenwelzijn en hygiëne, hetgeen in ieder geval omvat de geldende
      normen bij of krachtens de [Wet milieubeheer][ref1], de [Wet verontreiniging oppervlaktewater][ref2],
      de [Meststoffenwet][ref3], de [Wet bodembescherming][ref4], de [Bestrijdingsmiddelenwet 1962][ref5], de
      [Gezondheids- en welzijnswet voor dieren][ref6], de [Diergeneesmiddelenwet][ref7] en de [Plantenziektewet][ref8].

      c. de aanvrager een landbouwonderneming exploiteert waarvan de economische levensvatbaarheid op het tijdstip van
      indiening van de aanvraag tot subsidieverlening kan worden aangetoond.

      2 De subsidie wordt niet verleend indien:

      a. de investering is gericht op een productieverhoging waarvoor op de markt geen normale afzetmogelijkheden kunnen
      worden gevonden;

      b. de investering erop is gericht om te voldoen aan een communautaire norm die langer dan 36 maanden op de
      betrokken landbouwonderneming van toepassing is;

      c. door de investeringen de productie verder stijgt dan op grond van productiebeperkingen of beperkingen t.a.v.
      communautaire steunverlening is toegestaan;

      d. de investering een stijging van de productiecapaciteit met meer dan 20% tot gevolg heeft;

      e. de investering betrekking heeft op gewone vervangingsinvesteringen.

      3 De aanvraag wordt geweigerd aan stichtingen en aan ondernemingen die zijn gericht op onderzoek, scholing,
      opleiding, voorlichting, advies of begeleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0002682
      [ref3]: https://wetten.overheid.nl/BWBR0004054
      [ref4]: https://wetten.overheid.nl/BWBR0003994
      [ref5]: https://wetten.overheid.nl/BWBR0002380
      [ref6]: https://wetten.overheid.nl/BWBR0005662
      [ref7]: https://wetten.overheid.nl/BWBR0003818
      [ref8]: https://wetten.overheid.nl/BWBR0002075
    url: https://wetten.overheid.nl/BWBR0020502/2006-11-15#Artikel14
