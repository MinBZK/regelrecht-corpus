  - number: '15'
    text: |-
      1 Geen subsidie wordt verstrekt voor activiteiten waarvan met de uitvoering is begonnen vóór de datum van
      ontvangstbevestiging die volgt op de aanvraag tot subsidieverlening.

      2 Voor de toepassing van het eerste lid worden voorbereidende activiteiten om te komen tot een aanvraag voor
      subsidieverlening buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0020502/2006-11-15#Artikel15
  - number: '16'
    text: |-
      1 Als subsidiabele kosten worden aangemerkt de in de bijlage met betrekking tot de onderscheiden investeringen
      genoemde kosten.

      2 De subsidiabele kosten in deze regeling worden in aanmerking genomen met inbegrip van de verschuldigde BTW indien
      de aanvrager de BTW niet kan verrekenen met de door hem af te dragen omzetbelasting.
    url: https://wetten.overheid.nl/BWBR0020502/2006-11-15#Artikel16
  - number: '17'
    text: |-
      De subsidie, bedoeld in [artikel 13][ref1], wordt vastgesteld overeenkomstig hetgeen daaromtrent in de bijlage met
      betrekking tot de onderscheiden investeringen is bepaald tot ten hoogste € 1.125.000 per landbouwonderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0020502#Artikel13
    url: https://wetten.overheid.nl/BWBR0020502/2006-11-15#Artikel17
    references:
