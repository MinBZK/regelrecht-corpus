        bwb_id: BWBR0020502
        artikel: '13'
        paragraaf: '5'
  - number: '18'
    text: Deze regeling treedt in werking op 15 november 2006.
    url: https://wetten.overheid.nl/BWBR0020502/2006-11-15#Artikel18
  - number: '19'
    text: 'Deze regeling wordt aangehaald als: Investeringsregeling energiebesparing.'
    url: https://wetten.overheid.nl/BWBR0020502/2006-11-15#Artikel19
