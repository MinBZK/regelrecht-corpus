preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is het Besluit op de Dividendbelasting 1941 door een meer
    overzichtelijke en op verschillende punten herziene wettelijke regeling te vervangen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Onder de naam 'dividendbelasting' wordt een directe belasting geheven van degenen, die - rechtstreeks of door
      middel van certificaten - gerechtigd zijn tot de opbrengst van aandelen in, en winstbewijzen van en geldleningen
      als bedoeld in [artikel 10, eerste lid, onderdeel d, van de Wet op de vennootschapsbelasting 1969][ref1] aan
      in Nederland gevestigde naamloze vennootschappen, besloten vennootschappen met beperkte aansprakelijkheid, open
      commanditaire vennootschappen, andere vennootschappen welker kapitaal geheel of ten dele in aandelen is verdeeld
      en lichamen als bedoeld in [artikel 2, twaalfde lid, van de Wet op de vennootschapsbelasting 1969][ref2]
      voor zover de opbrengstgerechtigde woonachtig of gevestigd is in een staat die een dergelijk lichaam als een
      belastingplichtige voor een naar de winst geheven belasting beschouwt.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel2
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: '2'
  - number: '1.2'
    text: |-
      Voor de toepassing van deze wet worden bewijzen van deelgerechtigdheid in fondsen voor gemene
      rekening als bedoeld in [artikel 2, vierde lid, van de Wet op de vennootschapsbelasting 1969][ref1] en
      kwalificerende lidmaatschapsrechten in in Nederland gevestigde houdstercoöperaties gelijkgesteld met
      aandelen in vennootschappen waarvan het kapitaal geheel of ten dele in aandelen is verdeeld en worden
      de fondsen, onderscheidenlijk de houdstercoöperaties, gelijkgesteld met vennootschappen, waarbij de
      belasting mede wordt geheven over de opbrengst van winstbewijzen van en geldleningen als bedoeld in
      [artikel 10, eerste lid, onderdeel d, van de Wet op de vennootschapsbelasting 1969][ref2] aan fondsen voor gemene
      rekening, onderscheidenlijk houdstercoöperaties.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel10
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: '10'
  - number: '1.3'
    text: |-
      Heeft de oprichting van een in het eerste lid bedoelde vennootschap plaatsgevonden naar Nederlands recht, dan
      wordt die vennootschap steeds geacht in Nederland te zijn gevestigd. Een Europese naamloze vennootschap die bij
      haar oprichting werd beheerst door Nederlands recht, wordt voor de toepassing van de eerste volzin geacht te zijn
      opgericht naar Nederlands recht.
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel1
  - number: '1.4'
    text: |-
      In afwijking van het eerste lid zijn van de belasting vrijgesteld degenen, die – rechtstreeks of door middel van
      certificaten – gerechtigd zijn tot de opbrengsten van aandelen in of winstbewijzen van een lichaam als bedoeld in
      [artikel 6a van de Wet op de vennootschapsbelasting 1969][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel6a
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 6a
  - number: '1.5'
    text: |-
      In afwijking van het vierde lid wordt wel belasting geheven van degenen die – rechtstreeks of door middel van
      certificaten – gerechtigd zijn tot de opbrengst van aandelen in of winstbewijzen van een lichaam dat ingevolge
      [artikel 6a van de Wet op de vennootschapsbelasting 1969][ref1] is vrijgesteld van belastingheffing:


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel6a
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 6a
  - number: 1.5.a
    text: |-
      gedurende een tijdvak van acht maanden na het einde van het tijdvak waarover
      [artikel 28 van de Wet op de vennootschapsbelasting 1969][ref1] op het lichaam van toepassing is geweest,
      voorzover de opbrengst de in die acht maanden op grond van [artikel 28, tweede lid, onderdeel b][ref2], aan de
      belastingplichtigen ter beschikking te stellen winst niet te boven gaat;


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel28
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: '28'
  - number: 1.5.b
    text: |-
      voorzover de opbrengst het bedrag van de zuivere winst die reeds aanwezig was op het tijdstip
      onmiddellijk voorafgaande aan het tijdstip waarop het lichaam wordt vrijgesteld op grond van
      [artikel 6a van de Wet op de vennootschapsbelasting 1969][ref1], niet te boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel6a
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 6a
  - number: '1.6'
    text: |-
      Voor de toepassing van deze wet worden op de BES eilanden gevestigde lichamen die door de toepassing van
      [artikel 5.2 van de Belastingwet BES][ref1] geacht worden niet op de BES eilanden te zijn gevestigd, geacht in
      Nederland te zijn gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel5
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '5'
  - number: '1.7'
    text: |-
      Voor de toepassing van deze wet wordt onder een kwalificerend lidmaatschapsrecht verstaan: een lidmaatschapsrecht
      van een lid van een houdstercoöperatie dat, al dan niet tezamen met de lidmaatschapsrechten van een of meer in de
      tweede volzin omschreven andere leden van die houdstercoöperatie, recht geeft op ten minste 5% van de jaarwinst
      van die houdstercoöperatie dan wel op ten minste 5% van hetgeen bij liquidatie wordt uitgekeerd. De in de eerste
      volzin bedoelde andere leden zijn de leden die met het in die volzin bedoelde lid zijn verbonden in de zin van
      [artikel 10a, vierde tot en met zesde lid, van de Wet op de vennootschapsbelasting 1969][ref1], met dien verstande
      dat daarbij onder lichaam en lichamen als bedoeld in artikel 10a, zesde lid, van die wet mede wordt verstaan:
      natuurlijke persoon, onderscheidenlijk natuurlijke personen.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 10a
  - number: '1.8'
    text: |-
      Voor de toepassing van deze wet wordt onder houdstercoöperatie verstaan: een coöperatie waarvan de
      feitelijke werkzaamheid in het aan het tijdstip waarop de opbrengst ter beschikking wordt gesteld
      voorafgaande jaar doorgaans hoofdzakelijk heeft bestaan uit het houden van deelnemingen als bedoeld
      in [artikel 13 van de Wet op de vennootschapsbelasting 1969][ref1] of het direct of indirect
      financieren van lichamen of natuurlijke personen die met die coöperatie zijn verbonden in de zin van
      [artikel 10a, vierde tot en met zesde lid, van die wet][ref2], met dien verstande dat daarbij onder lichaam
      en lichamen als bedoeld in artikel 10a, zesde lid, van die wet mede wordt verstaan: natuurlijke persoon,
      onderscheidenlijk natuurlijke personen.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 10a
  - number: '1.9'
    text: 'Voor de toepassing van deze wet wordt mede verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel1
  - number: 1.9.a
    text: 'een coöperatie: een vereniging op coöperatieve grondslag;'
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel1
  - number: 1.9.b
    text: |-
      een lidmaatschapsrecht: een daarmee op één lijn te stellen bewijs van deelgerechtigdheid tot het vermogen van een
      coöperatie of vereniging op coöperatieve grondslag.
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel1
  - number: '1.10'
    text: |-
      Indien de houders van stemrechten, kapitaalbelangen of winstrechten in een lichaam als bedoeld in
      [artikel 2, twaalfde lid, van de Wet op de vennootschapsbelasting 1969][ref1] door tussenkomst van
      dat lichaam gerechtigd zijn tot de opbrengst van aandelen, winstbewijzen of geldleningen als bedoeld in
      [artikel 10, eerste lid, onderdeel d, van die wet][ref2], wordt voor de toepassing van deze wet dat lichaam
      aangemerkt als gerechtigde tot die opbrengst.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel10
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: '10'
  - number: '2'
    text: |-
      De belasting wordt geheven naar de opbrengst van de in [artikel 1][ref1] bedoelde aandelen, winstbewijzen en
      geldleningen.


      [ref1]: https://wetten.overheid.nl/BWBR0002515#Artikel1
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002515
        artikel: '1'
        hoofdstuk: I
  - number: '3.1'
    text: 'Tot de opbrengst behoren:'
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel3
  - number: 3.1.a
    text: |-
      onmiddellijke of middellijke uitdelingen van winst, onder welke naam of in welke vorm ook gedaan daaronder begrepen
      hetgeen ter gelegenheid van inkoop van aandelen, anders dan ter tijdelijke belegging, wordt uitgekeerd boven het
      gemiddeld op de desbetreffende aandelen gestorte kapitaal;
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel3
  - number: 3.1.b
    text: |-
      hetgeen bij liquidatie op aandelen wordt uitgekeerd boven het gemiddeld op de desbetreffende aandelen gestorte
      kapitaal, behoudens voorzover de liquidatie-uitkering is toe te rekenen aan de vermogensbestanddelen waarmee
      degene die gerechtigd is tot de liquidatie-uitkering, de onderneming van de vennootschap met toepassing van
      [artikel 14c van de Wet op de vennootschapsbelasting 1969][ref1] voortzet of mede voortzet;


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel14c
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 14c
  - number: 3.1.c
    text: |-
      de nominale waarde van aandelen uitgereikt aan aandeelhouders, voor zover niet blijkt dat storting heeft plaats
      gevonden of zal plaats vinden; bijschrijving op aandelen wordt met uitreiking van aandelen gelijkgesteld;
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel3
  - number: 3.1.d
    text: |-
      gedeeltelijke teruggaaf van hetgeen op aandelen is gestort, indien en voor zover er zuivere winst is, tenzij
      tevoren de algemene vergadering van aandeelhouders tot deze teruggaaf heeft besloten en de nominale waarde van de
      desbetreffende geplaatste aandelen bij statutenwijziging met een gelijk bedrag is verminderd;
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel3
  - number: 3.1.e
    text: |-
      hetgeen wordt uitgekeerd op winstbewijzen, daaronder begrepen hetgeen wordt genoten ter gelegenheid van afkoop of
      inkoop daarvan;
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel3
  - number: 3.1.f
    text: |-
      vergoedingen op geldleningen als bedoeld in
      [artikel 10, eerste lid, onderdeel d, van de Wet op de vennootschapsbelasting 1969][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '10'
  - number: 3.1.g
    text: |-
      gehele of gedeeltelijke teruggaaf van hetgeen op bewijzen van deelgerechtigdheid in een fonds voor gemene rekening
      is gestort, wordt als uitkering beschouwd, voorzover het vermogen van het fonds uitgaat boven hetgeen op de in
      omloop zijnde bewijzen van deelgerechtigdheid is gestort;
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel3
  - number: 3.1.h
    text: |-
      het bedrag dat als storting wordt toegerekend aan elk van de bewijzen van deelgerechtigdheid in een fonds voor
      gemene rekening voorzover winsten van dat fonds worden bestemd om te gelden als storting op aan deelgerechtigden
      uit te geven of reeds uitgegeven bewijzen van deelgerechtigdheid;
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel3
  - number: 3.1.i
    text: |-
      renten op inleggelden en, in het algemeen, alle vergoedingen voor kapitaalverstrekkingen aan een houdstercoöperatie
      door leden als zodanig, met uitzondering van gehele of gedeeltelijke teruggaaf van inleggelden.
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel3
  - number: '3.2'
    text: |-
      Niet in geld genoten opbrengst wordt in aanmerking genomen naar de waarde welke daaraan in het economische verkeer
      kan worden toegekend.
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel3
  - number: '3.3'
    text: |-
      Inkoop van aandelen met het oog op de nakoming van een optieverplichting jegens een
      werknemer van de eigen vennootschap of een verbonden vennootschap als bedoeld in
      [artikel 10a, zevende lid, van de Wet op de loonbelasting 1964][ref1] is een tijdelijke belegging. Ingeval deze
      aandelen drie maanden na het tenietgaan van de optieverplichting nog tot de bezittingen van de vennootschap
      behoren, worden zij op dat tijdstip geacht te zijn ingekocht tegen de waarde in het economische verkeer van
      de aandelen op dat tijdstip. Voor de toepassing van dit lid wordt onder een optieverplichting verstaan een
      verplichting die de tegenhanger is van een recht om een of meer aandelen of daarmee gelijk te stellen rechten te
      verwerven, of van een recht dat daarmee gelijk te stellen is.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 10a
  - number: '3.4'
    text: |-
      Inkoop van aandelen in een kalenderjaar door een beleggingsinstelling of instelling voor collectieve belegging
      in effecten als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1] wordt aangemerkt als
      een tijdelijke belegging, tenzij de instelling de inkoop terstond aanmerkt als een inkoop in de zin van het
      eerste lid, onderdeel a. Ingeval aan het einde van het kalenderjaar meer aandelen als tijdelijke belegging
      zijn ingekocht dan in dat jaar door de instelling in het economische verkeer zijn gebracht, worden de meer
      ingekochte aandelen geacht een inkoop van aandelen te zijn als bedoeld in het eerste lid, onderdeel a,
      tegen de gemiddelde waarde in het economische verkeer van de in de loop van het kalenderjaar als tijdelijke
      belegging ingekochte aandelen. Voor de toepassing van dit lid blijven aandelen die zijn ingekocht met
      het oog op de nakoming van een optieverplichting als bedoeld in het derde lid, en aandelen die in het
      economische verkeer zijn gebracht in het kader van een zodanige optieverplichting of ter voldoening van
      de in [artikel 28, tweede lid, onderdeel b, van de Wet op de vennootschapsbelasting 1969][ref2] bedoelde
      uitdelingsverplichting, buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel28
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: '28'
  - number: 3a.1
    text: |-
      Voor zover de storting op aandelen in een vennootschap bestaat uit aandelen in een andere vennootschap wordt ten
      aanzien van alle aandeelhouders slechts als gestort aangemerkt hetgeen op de laatstbedoelde aandelen is gestort,
      verminderd met hetgeen in contanten is bijbetaald. In afwijking van de eerste volzin wordt, ingeval die andere
      vennootschap niet in Nederland is gevestigd, als gestort kapitaal aangemerkt de waarde in het economische verkeer
      van de ingebrachte aandelen ten tijde van de storting, tenzij deze aandelenruil in overwegende mate is gericht op
      het ontgaan of uitstellen van belastingheffing.
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel3a
  - number: 3a.2
    text: |-
      In geval van een overgang onder algemene titel in het kader van een splitsing van een rechtspersoon wordt
      ten aanzien van alle aandeelhouders ten hoogste een evenredig gedeelte van het bedrag van het op de aandelen
      in de splitsende rechtspersoon gestorte kapitaal aangemerkt als gestort kapitaal op de door de verkrijgende
      rechtspersonen in het kader van de splitsing toegekende aandelen, en wordt, in geval van een splitsing waarbij de
      splitsende rechtspersoon blijft bestaan, het op de aandelen in de splitsende rechtspersoon gestorte kapitaal in
      dezelfde mate verminderd. Indien in het kader van de splitsing een bijbetaling in contanten plaatsvindt, wordt voor
      de toepassing van de eerste volzin het op de aandelen in de splitsende rechtspersoon gestorte kapitaal verminderd
      met deze bijbetaling. In afwijking van de eerste en tweede volzin wordt, ingeval de splitsende rechtspersoon
      niet in Nederland is gevestigd, als gestort kapitaal op de door de verkrijgende rechtspersoon in het kader van
      de splitsing uitgereikte aandelen aangemerkt de waarde in het economische verkeer van het vermogen dat als gevolg
      van de splitsing overgaat op de verkrijgende rechtspersoon voor zover het vermogen niet bestaat uit aandelen in
      een in Nederland gevestigde vennootschap, tenzij deze splitsing in overwegende mate is gericht op het ontgaan of
      uitstellen van belastingheffing.
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel3a
  - number: 3a.3
    text: |-
      Voor de toepassing van het tweede lid wordt onder een evenredig gedeelte verstaan: een gedeelte dat
      evenredig is aan de verhouding tussen de waarde in het economische verkeer ten tijde van de splitsing van de
      vermogensbestanddelen van de splitsende rechtspersoon die overgaan op de verkrijgende rechtspersoon en de waarde in
      het economische verkeer ten tijde van de splitsing van het gehele vermogen van de splitsende rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel3a
  - number: 3a.4
    text: |-
      Ingeval de splitsende rechtspersoon in Nederland is gevestigd en de overgang onder algemene titel in het kader
      van een splitsing in overwegende mate is gericht op het ontgaan of uitstellen van belastingheffing, blijft het
      tweede lid, eerste en tweede volzin, buiten toepassing en wordt hetgeen bij de splitsing door een aandeelhouder als
      zodanig wordt genoten aangemerkt als een uitdeling van winst door de splitsende rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel3a
  - number: 3a.5
    text: |-
      In geval van een overgang onder algemene titel in het kader van een fusie van een rechtspersoon wordt ten aanzien
      van alle aandeelhouders ten hoogste het bedrag van het op de aandelen in de verdwijnende rechtspersoon gestorte
      kapitaal aangemerkt als gestort kapitaal op de door de verkrijgende rechtspersonen in het kader van de fusie
      toegekende aandelen. Indien in het kader van de fusie een bijbetaling in contanten plaatsvindt, wordt voor de
      toepassing van de eerste volzin het op de aandelen in de verdwijnende rechtspersoon gestorte kapitaal verminderd
      met deze bijbetaling. In afwijking van de eerste en tweede volzin wordt, ingeval de verdwijnende rechtspersoon
      niet in Nederland is gevestigd, als gestort kapitaal op de door de verkrijgende rechtspersoon in het kader van
      de fusie toegekende aandelen aangemerkt de waarde in het economische verkeer van het vermogen dat als gevolg van
      de fusie overgaat op de verkrijgende rechtspersoon voor zover het vermogen niet bestaat uit aandelen in een in
      Nederland gevestigde vennootschap, tenzij de fusie in overwegende mate is gericht op het ontgaan of uitstellen
      van belastingheffing.
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel3a
  - number: 3a.6
    text: |-
      Een aandelenruil, een splitsing en een fusie worden voor de toepassing van het eerste, tweede, vierde en vijfde
      lid, tenzij het tegendeel aannemelijk wordt gemaakt, geacht in overwegende mate te zijn gericht op het ontgaan of
      uitstellen van belastingheffing indien de aandelenruil, de splitsing, respectievelijk de fusie, niet plaatsvindt
      op grond van zakelijke overwegingen, zoals herstructurering of rationalisering van de actieve werkzaamheden van
      de bij de aandelenruil, de splitsing, respectievelijk de fusie, betrokken rechtspersonen. Bij een splitsing worden
      zakelijke overwegingen voorts niet aanwezig geacht indien de activa die bij de splitsing overgaan op de andere
      rechtspersoon hoofdzakelijk, onmiddellijk of middellijk, bestaan uit beleggingen, liquide middelen daaronder
      begrepen, of indien hetgeen bij de splitsende rechtspersoon achterblijft hoofdzakelijk, onmiddellijk of middellijk,
      bestaat uit beleggingen, tenzij de beleggingen die overgaan, respectievelijk achterblijven, geen afzondering van
      ingehouden winst representeren.
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel3a
  - number: 3a.7
    text: |-
      De rechtspersoon die zekerheid wenst omtrent de vraag of een aandelenruil, een splitsing of een fusie in
      overwegende mate is gericht op het ontgaan of het uitstellen van belastingheffing, kan vóór de aandelenruil, de
      splitsing, respectievelijk de fusie, een verzoek indienen bij de inspecteur die daarop bij voor bezwaar vatbare
      beschikking beslist.
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel3a
  - number: 3b
    text: |-
      De herbeleggingsreserve die is gevormd ingevolge de nadere regelen die zijn gegeven krachtens
      [artikel 28 van de Wet op de vennootschapsbelasting 1969][ref1] met betrekking tot de heffing van
      vennootschapsbelasting van beleggingsinstellingen, wordt aangemerkt als op de aandelen van de instelling gestort
      kapitaal.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel28
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '28'
  - number: '4.1'
    text: |-
      Inhouding van de belasting mag achterwege blijven ten aanzien van
      opbrengsten van aandelen, winstbewijzen en geldleningen als bedoeld in
      [artikel 10, eerste lid, onderdeel d, van de Wet op de vennootschapsbelasting 1969][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '10'
  - number: 4.1.a
    text: |-
      de deelnemingsvrijstelling, bedoeld in [artikel 13 van de Wet op de vennootschapsbelasting 1969][ref1], of de
      deelnemingsverrekening, bedoeld in [artikel 13aa van die wet][ref2], van toepassing is op de voordelen die de tot
      de opbrengstgerechtigde uit die aandelen, winstbewijzen en geldleningen geniet en de deelneming behoort tot het
      vermogen van zijn in Nederland gedreven onderneming;


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel13aa
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 13aa
  - number: 4.1.b
    text: |-
      de opbrengstgerechtigde en de inhoudingsplichtige deel uitmaken van dezelfde fiscale eenheid als bedoeld in
      [artikel 15 van de Wet op de vennootschapsbelasting 1969][ref1] en de aandelen, winstbewijzen en geldleningen bij
      de opbrengstgerechtigde behoren tot het vermogen van zijn in Nederland gedreven onderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '15'
  - number: '4.2'
    text: |-
      Inhouding van belasting blijft achterwege ten aanzien van de opbrengsten van aandelen, winstbewijzen en geldleningen
      als bedoeld in [artikel 10, eerste lid, onderdeel d, van de Wet op de vennootschapsbelasting 1969][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '10'
  - number: 4.2.a
    text: 'de opbrengstgerechtigde een lichaam is dat volgens de fiscale wetgeving van:'
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4
  - number: 4.2.a.1°
    text: |-
      een andere lidstaat van de Europese Unie of een andere staat die partij is bij de Overeenkomst betreffende de
      Europese Economische Ruimte aldaar is gevestigd, of
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4
  - number: 4.2.a.2°
    text: |-
      een staat waarmee Nederland een verdrag ter voorkoming van dubbele belasting heeft gesloten of een openbaar
      lichaam binnen het Rijk waarvoor Nederland een regeling ter voorkoming van dubbele belasting heeft getroffen dat,
      onderscheidenlijk die, voorziet in een regeling voor dividenden, niet zijnde een lidstaat van de Europese Unie of
      een staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte, aldaar is gevestigd, en
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4
  - number: 4.2.b
    text: |-
      de opbrengstgerechtigde op het tijdstip waarop de opbrengst ter beschikking wordt gesteld
      een belang in de inhoudingsplichtige heeft waarop de deelnemingsvrijstelling, bedoeld in
      [artikel 13 van de Wet op de vennootschapsbelasting 1969][ref1], of de deelnemingsverrekening, bedoeld in
      [artikel 13aa van die wet][ref2], van toepassing zou zijn indien hij in Nederland zou zijn gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel13aa
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 13aa
  - number: '4.3'
    text: 'Het tweede lid vindt geen toepassing ingeval:'
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4
  - number: 4.3.a
    text: |-
      de opbrengstgerechtigde in de staat van vestiging volgens een door die staat met een andere staat gesloten verdrag
      ter voorkoming van dubbele belasting geacht wordt te zijn gevestigd in een staat waarmee Nederland geen verdrag
      ter voorkoming van dubbele belasting heeft gesloten dat voorziet in een regeling voor dividenden, niet zijnde een
      lidstaat van de Europese Unie of een staat die partij is bij de Overeenkomst betreffende de Europese Economische
      Ruimte;
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4
  - number: 4.3.b
    text: |-
      de opbrengstgerechtigde een vergelijkbare functie vervult als een beleggingsinstelling als bedoeld in
      [artikel 6a][ref1] of [artikel 28 van de Wet op de vennootschapsbelasting 1969][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel28
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 6a
      - id: ref2
        bwb_id: BWBR0002672
        artikel: '28'
  - number: 4.3.c
    text: |-
      de opbrengstgerechtigde het belang, bedoeld in het tweede lid, onderdeel b, heeft met als hoofddoel of een van de
      hoofddoelen om de heffing van belasting bij een ander te ontgaan en er sprake is van een kunstmatige constructie of
      transactie of reeks van constructies of samenstel van transacties waarbij:
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4
  - number: 4.3.c.1°
    text: een constructie of transactie uit verscheidene stappen of onderdelen kan bestaan;
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4
  - number: 4.3.c.2°
    text: |-
      een constructie of transactie of reeks van constructies of samenstel van transacties als kunstmatig wordt beschouwd
      voor zover zij, onderscheidenlijk het, niet is opgezet op grond van geldige zakelijke redenen die de economische
      realiteit weerspiegelen.
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4
  - number: '4.4'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing ten aanzien van opbrengsten met betrekking waartoe de
      opbrengstgerechtigde niet de uiteindelijke gerechtigde is.
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4
  - number: '4.5'
    text: |-
      Inhouding van de belasting mag achterwege blijven ten aanzien van de
      opbrengsten van aandelen in, winstbewijzen van en geldleningen als bedoeld in
      [artikel 10, eerste lid, onderdeel d, van de Wet op de vennootschapsbelasting 1969][ref1] aan:


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '10'
  - number: 4.5.a
    text: |-
      aangewezen banken en beleggingsinstellingen als bedoeld in [artikel 5.14 van de Wet inkomstenbelasting 2001][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
  - number: 4.5.b
    text: |-
      vennootschappen als bedoeld in
      [artikel 5, eerste lid, onderdeel a, van de Wet op de vennootschapsbelasting 1969][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel5
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '5'
  - number: '4.6'
    text: |-
      Bij een beleggingsinstelling in de zin van [artikel 28 van de Wet op de vennootschapsbelasting 1969][ref1] mag
      inhouding van de belasting achterwege blijven ten aanzien van opbrengsten van geblokkeerde rechten van deelneming
      in die instelling als bedoeld in [artikel 3.126a van de Wet inkomstenbelasting 2001][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '4.7'
    text: |-
      Voor het achterwege laten van de inhouding van dividendbelasting ingevolge dit artikel, een teruggaaf van
      dividendbelasting ingevolge [artikel 10][ref1] of artikel 10a, alsmede het achterwege laten dan wel een
      vermindering of teruggaaf van dividendbelasting ingevolge de [Belastingregeling voor het Koninkrijk][ref2],
      de Belastingregeling voor het land Nederland of een door Nederland gesloten verdrag ter voorkoming van dubbele
      belasting, wordt niet als uiteindelijk gerechtigde beschouwd degene die in samenhang met de genoten opbrengst een
      tegenprestatie heeft verricht als onderdeel van een samenstel van transacties waarbij aannemelijk is dat:


      [ref1]: https://wetten.overheid.nl/BWBR0002515#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002464
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002515
        artikel: '10'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002464
  - number: 4.7.a
    text: 'de opbrengst geheel of gedeeltelijk direct of indirect ten goede is gekomen aan:'
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4
  - number: 4.7.a.1
    text: |-
      een natuurlijke persoon of een rechtspersoon ten aanzien van wie inhouding niet achterwege mag blijven, terwijl dit
      ten aanzien van degene die de tegenprestatie heeft verricht wel mag, of
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4
  - number: 4.7.a.2
    text: |-
      een natuurlijke persoon of rechtspersoon die in mindere mate gerechtigd is tot vermindering of teruggaaf van
      dividendbelasting dan degene die de tegenprestatie heeft verricht; en
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4
  - number: 4.7.b
    text: |-
      deze natuurlijke persoon of rechtspersoon een positie in aandelen, winstbewijzen of geldleningen als bedoeld in
      [artikel 10, eerste lid, onderdeel d, van de Wet op de vennootschapsbelasting 1969][ref1] op directe of indirecte
      wijze behoudt of verkrijgt die vergelijkbaar is met zijn positie in soortgelijke aandelen, winstbewijzen of
      geldleningen voorafgaand aan het moment waarop het samenstel van transacties een aanvang heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '10'
  - number: '4.8'
    text: 'Voor de toepassing van het zevende lid:'
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4
  - number: 4.8.a
    text: |-
      kan van een samenstel van transacties eveneens sprake zijn ingeval transacties zijn aangegaan op een
      gereglementeerde markt als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1] of een met een
      gereglementeerde markt als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref2] vergelijkbaar
      systeem dat gelegen of werkzaam is in een staat die niet een lidstaat is van de Europese Unie;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 4.8.b
    text: |-
      wordt met een samenstel van transacties gelijkgesteld een transactie die betrekking heeft op de enkele verwerving
      van een of meer dividendbewijzen of op de vestiging van kortlopende genotsrechten op aandelen;
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4
  - number: 4.8.c
    text: |-
      zijn de [artikelen 2.14a][ref1] en [10a.7 van de Wet inkomstenbelasting 2001][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: 10a
  - number: '4.9'
    text: |-
      Indien een opbrengstgerechtigde volgens de fiscale wetgeving van de staat op grond van
      wiens recht die opbrengstgerechtigde is opgericht aldaar niet wordt behandeld als de
      gerechtigde tot de opbrengst van aandelen, winstbewijzen en geldleningen als bedoeld in
      [artikel 10, eerste lid, onderdeel d, van de Wet op de vennootschapsbelasting 1969][ref1] omdat die
      opbrengstgerechtigde volgens de fiscale wetgeving van die staat niet aldaar is gevestigd, en die
      opbrengstgerechtigde niet volgens de fiscale wetgeving van een andere staat in die staat is gevestigd, wordt voor
      de toepassing van dit artikel een achterliggende gerechtigde tot die opbrengst geacht de opbrengstgerechtigde te
      zijn, mits iedere zodanige gerechtigde volgens de fiscale wetgeving van de staat waarin hij is gevestigd, aldaar
      wordt behandeld als de gerechtigde tot die opbrengst. Van achterliggende gerechtigdheid als bedoeld in de eerste
      volzin is slechts sprake voor zover de gerechtigdheid tot de opbrengst, bedoeld in die volzin, rechtstreeks
      verband houdt met een participatie in degene die zonder de toepassing van de eerste volzin de opbrengstgerechtigde
      zou zijn. Het tweede lid vindt geen toepassing ingeval niet ten aanzien van iedere achterliggende gerechtigde
      inhouding van belasting ingevolge dat lid achterwege zou blijven ingeval hij zijn middellijke belang in de
      inhoudingsplichtige onmiddellijk zou hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '10'
  - number: '4.10'
    text: |-
      Indien een opbrengstgerechtigde volgens de fiscale wetgeving van de staat waarin
      die opbrengstgerechtigde is gevestigd aldaar niet wordt behandeld als de gerechtigde
      tot de opbrengst van aandelen, winstbewijzen en geldleningen als bedoeld in
      [artikel 10, eerste lid, onderdeel d, van de Wet op de vennootschapsbelasting 1969][ref1] omdat die
      opbrengstgerechtigde een belang in de inhoudingsplichtige heeft door tussenkomst van een lichaam dat die staat als
      gerechtigde tot die opbrengst beschouwt, wordt die opbrengstgerechtigde voor de toepassing van dit artikel geacht
      niet de opbrengstgerechtigde te zijn. Indien het in de eerste volzin bedoelde lichaam volgens de fiscale wetgeving
      van de staat waarin dat lichaam is gevestigd aldaar wordt behandeld als de gerechtigde tot de opbrengst van
      aandelen in, winstbewijzen van en geldleningen als bedoeld in artikel 10, eerste lid, onderdeel d, van de Wet op
      de vennootschapsbelasting 1969, wordt dat lichaam voor de toepassing van dit artikel geacht de opbrengstgerechtigde
      te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '10'
  - number: '4.11'
    text: |-
      Voor de toepassing van het tweede lid is de inhoudingsplichtige verplicht binnen een maand na het tijdstip waarop
      de opbrengst ter beschikking is gesteld een verklaring te verstrekken aan de inspecteur dat aan de in het tweede,
      derde en vierde lid gestelde voorwaarden is voldaan, en bij hem opgaaf te doen volgens bij ministeriële regeling te
      stellen regels.
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4
  - number: '4.12'
    text: |-
      Indien aan bij ministeriële regeling te stellen voorwaarden wordt voldaan, wordt voor de toepassing van het
      derde lid, onderdeel c, tenzij de inspecteur het tegendeel aannemelijk maakt, de opbrengstgerechtigde geacht het
      belang niet te hebben met als hoofddoel of een van de hoofddoelen om de heffing van belasting bij een ander te
      ontgaan en wordt geacht sprake te zijn van geldige zakelijke redenen die de economische realiteit weerspiegelen.
      Indien niet aan de voorwaarden, bedoeld in de eerste zin, wordt voldaan, dient de opbrengstgerechtigde of de
      inhoudingsplichtige aannemelijk te maken dat:
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4
  - number: 4.12.a
    text: |-
      de opbrengstgerechtigde het belang niet heeft met als hoofddoel of een van de hoofddoelen om de heffing van
      belasting bij een ander te ontgaan; of
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4
  - number: 4.12.b
    text: sprake is van geldige zakelijke redenen die de economische realiteit weerspiegelen.
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4
  - number: '4.13'
    text: |-
      Indien de opbrengstgerechtigde een lichaam is als bedoeld in
      [artikel 2, twaalfde lid, van de Wet op de vennootschapsbelasting 1969][ref1] vindt het eerste lid, aanhef en
      onderdeel a, geen toepassing voor zover ten aanzien van een achterliggende gerechtigde die woonachtig of gevestigd
      is in een staat die dat lichaam niet als een belastingplichtige voor een naar de winst geheven belasting beschouwt
      het eerste of het tweede lid geen toepassing zou vinden indien die achterliggende gerechtigde zonder de toepassing
      van [artikel 1, tiende lid][ref2], de opbrengstgerechtigde zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002515#Artikel1
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002515
        artikel: '1'
        hoofdstuk: I
  - number: 4c.1
    text: |-
      Inhouding van de belasting mag achterwege blijven ten aanzien van de opbrengst van aandelen ter gelegenheid van
      een inkoop van aandelen voor zover het totale bedrag van de inkoop in het kalenderjaar niet meer bedraagt dan
      twintig keer het bedrag van het volgens het tweede lid bepaalde gemiddeld uitgekeerde dividend in contanten in
      vijf voorafgaande kalenderjaren, verminderd met de bedragen aan inkoop van aandelen ter zake waarvan inhouding op
      de voet van dit artikel in de voorafgaande vier kalenderjaren achterwege is gebleven, mits voorts aan de volgende
      vereisten is voldaan:
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4c
  - number: 4c.1.a
    text: |-
      de ingekochte aandelen behoren tot een soort welke is toegelaten tot de handel op een gereglementeerde markt
      als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1] of een met een gereglementeerde markt
      vergelijkbaar systeem uit een staat die geen lidstaat is en de inhoudingsplichtige is niet een lichaam waarvan de
      feitelijke werkzaamheid hoofdzakelijk bestaat uit het, onmiddellijk of middellijk, beleggen van vermogen of een
      daarmee overeenkomende werkzaamheid;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4c
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 4c.1.b
    text: |-
      in het kalenderjaar wordt aan dividend in contanten ten minste uitgekeerd een bedrag gelijk aan het volgens het
      tweede lid bepaalde gemiddeld uitgekeerde dividend in contanten in vijf voorafgaande kalenderjaren, en
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4c
  - number: 4c.1.c
    text: |-
      in het kalenderjaar tot het tijdstip van de inkoop en in de vier daaraan voorafgaande kalenderjaren is het nominaal
      gestorte kapitaal in de inhoudingsplichtige niet vergroot, tenzij aan de vergroting van het nominaal gestorte
      kapitaal in overwegende mate zakelijke overwegingen ten grondslag hebben gelegen.
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4c
  - number: 4c.2
    text: |-
      Het bedrag van het in het eerste lid bedoelde gemiddeld uitgekeerde dividend in contanten in vijf voorafgaande
      kalenderjaren, wordt berekend door na correctie van de bedragen van de zeven voorafgaande kalenderjaren met een
      inflatiebijstelling, het jaar met het hoogste en het jaar met het laagste gecorrigeerde bedrag buiten aanmerking
      te laten.
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4c
  - number: 4c.3
    text: |-
      Indien de inhoudingsplichtige verschillende soorten nominaal gestort kapitaal heeft, worden de bepalingen van dit
      artikel per soort ingekochte aandelen toegepast.
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4c
  - number: 4c.4
    text: 'Bij ministeriële regeling worden regels gesteld:'
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4c
  - number: 4c.4.a
    text: |-
      voor de toepassing van dit artikel met betrekking tot situaties waarin de inhoudingsplichtige in omvang is
      toegenomen of afgenomen ten gevolge van een fusie of splitsing;
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4c
  - number: 4c.4.b
    text: met betrekking tot de in het tweede lid bedoelde inflatiebijstelling.
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4c
  - number: 4c.5
    text: |-
      De inhoudingsplichtige die zekerheid wil hebben op de vraag in hoeverre de inhouding van de belasting op de voet
      van dit artikel achterwege mag blijven, kan daartoe een verzoek indienen bij de inspecteur, die daarop bij voor
      bezwaar vatbare beschikking beslist. Het verzoek wordt gedaan ten minste zes weken voor de voorgenomen inkoop.
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4c
  - number: 4d.1
    text: |-
      Bij een beleggingsinstelling of instelling voor collectieve belegging in effecten als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref1] mag voorts inhouding van de belasting achterwege blijven
      ten aanzien van een inkoop van aandelen als bedoeld in [artikel 3, vierde lid][ref2], voorzover de grondslag voor
      de inhouding van de belasting van de ingekochte aandelen door de instelling in mindering wordt gebracht van een
      agioreserve of een herbeleggingsreserve.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002515#Artikel3
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4d
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002515
        artikel: '3'
        hoofdstuk: II
  - number: 4d.2
    text: 'Voor de toepassing van dit artikel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4d
  - number: 4d.2.a
    text: |-
      agioreserve: het in de instelling gestorte kapitaal voorzover dit uitgaat boven de nominale waarde van de in het
      economische verkeer zijnde aandelen in de instelling;
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4d
  - number: 4d.2.b
    text: |-
      herbeleggingsreserve: de herbeleggingsreserve die door de instelling is gevormd ingevolge de nadere regelen die
      zijn gegeven krachtens [artikel 28 van de Wet op de vennootschapsbelasting 1969][ref1] met betrekking tot de
      heffing van vennootschapsbelasting van beleggingsinstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel28
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4d
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '28'
  - number: 4e
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld op grond waarvan inhouding van belasting
      achterwege mag blijven ten aanzien van de opbrengst van tot een aanmerkelijk belang behorende aandelen of
      winstbewijzen, voor zover de opbrengstgerechtigde met betrekking tot die opbrengst verzoekt om toepassing van
      [artikel 4.12a van de Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4e
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
  - number: 4f
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld op grond waarvan inhouding van dividendbelasting achterwege
      mag blijven ten aanzien van de opbrengst van tot een aanmerkelijk belang behorende aandelen of winstbewijzen in een
      situatie als bedoeld in [artikel 25, elfde lid, van de Invorderingswet 1990][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel4f
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
  - number: '5'
    text: De belasting bedraagt 15% van de opbrengst.
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel5
  - number: '6.1'
    text: |-
      Neemt de vennootschap die de opbrengst verschuldigd is, de belasting voor haar rekening, dan wordt voor het
      berekenen van de belasting de opbrengst vermenigvuldigd met 100/85.
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel6
  - number: '6.2'
    text: |-
      Indien bij het einde van het kalenderjaar blijkt dat bij een inkoop van aandelen in het jaar niet is voldaan aan
      de voorwaarden van [artikel 4c, eerste lid, onderdelen b of c][ref1], wordt de belasting berekend gelijk als in
      situaties waarin de vennootschap de belasting voor haar rekening neemt.


      [ref1]: https://wetten.overheid.nl/BWBR0002515#Artikel4c
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002515
        artikel: 4c
        hoofdstuk: II
  - number: '7.1'
    text: De belasting wordt geheven door inhouding op de opbrengst.
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel7
  - number: '7.2'
    text: Inhoudingsplichtige is de vennootschap die de opbrengst verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel7
  - number: '7.3'
    text: |-
      De inhoudingsplichtige is verplicht de belasting in te houden op het tijdstip waarop de opbrengst ter beschikking
      is gesteld.
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel7
  - number: '7.4'
    text: De inhoudingsplichtige is verplicht de ingehouden belasting op aangifte af te dragen.
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel7
  - number: '7.5'
    text: |-
      Overtreft de belasting de opbrengst in geld, dan wordt het ontbrekende geacht te zijn ingehouden op het in het
      derde lid omschreven tijdstip, met dien verstande dat de inhoudingsplichtige bevoegd is dat ontbrekende te verhalen
      op degene die tot de opbrengst gerechtigd is. De inhoudingsplichtige kan de afgifte van de niet in geld genoten
      opbrengst opschorten tot voldoening van deze vordering plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel7
  - number: '9.1'
    text: |-
      De inhoudingsplichtige, degene bij wie de opbrengst is betaalbaar gesteld, het administratiekantoor dat de
      opbrengst doorbetaalt aan certificaathouders, of degene tot wiens beroep het kopen of innen van dividendbewijzen
      gewoonlijk behoort, is, zodra de opbrengst is uitbetaald, tegoedgeschreven, verrekend of uitgereikt, gehouden ten
      behoeve van de rechthebbende een gedagtekende nota (dividendnota) uit te reiken volgens bij ministeriële regeling
      te stellen regels.
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel9
  - number: '9.2'
    text: De dividendnota mag zowel op papier worden verstrekt als elektronisch beschikbaar worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel9
  - number: '9.3'
    text: 'In afwijking van het eerste lid mag de uitreiking van een dividendnota achterwege blijven indien:'
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel9
  - number: 9.3.a
    text: |-
      inhouding van de belasting achterwege blijft op de voet van deze wet, of vanwege een door Nederland gesloten
      verdrag ter voorkoming van dubbele belasting, of
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel9
  - number: 9.3.b
    text: |-
      de rechthebbende een aanmerkelijk belang heeft in de inhoudingsplichtige als bedoeld in
      [hoofdstuk 4 van de Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '4'
  - number: '9.4'
    text: |-
      Voor de toepassing van [artikel 26, tweede lid, van de Algemene wet inzake rijksbelastingen][ref1] wordt de
      belasting geacht te zijn ingehouden op de dag waarop de dividendnota is gedagtekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel26
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '26'
  - number: '10.1'
    text: |-
      Aan een in Nederland gevestigde rechtspersoon die niet aan de vennootschapsbelasting onderworpen is, wordt
      op zijn verzoek bij een door de inspecteur te nemen voor bezwaar vatbare beschikking teruggaaf verleend van
      in een kalenderjaar te zijnen laste ingehouden dividendbelasting. De eerste volzin is niet van toepassing op
      dividendbelasting naar opbrengsten met betrekking waartoe de rechtspersoon niet de uiteindelijk gerechtigde is.
      De eerste volzin is ook niet van toepassing met betrekking tot een vrijgestelde beleggingsinstelling als bedoeld
      in [artikel 6a van de Wet op de vennootschapsbelasting 1969][ref1]. Het verzoek wordt gedaan binnen een bij
      ministeriële regeling te stellen termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel6a
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 6a
  - number: '10.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van een lichaam dat is gevestigd in een andere
      lidstaat van de Europese Unie of in een andere staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte dat aldaar niet aan een belastingheffing naar de winst is onderworpen en dat, ware het in
      Nederland gevestigd geweest, ook alhier niet aan de heffing van de vennootschapsbelasting zou zijn onderworpen.
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel10
  - number: '10.3'
    text: |-
      Ten aanzien van een lichaam dat is gevestigd in een bij ministeriële regeling aangewezen staat, niet zijnde
      een staat als bedoeld in het tweede lid, waarmee Nederland een regeling is overeengekomen die voorziet in de
      uitwisseling van inlichtingen, dat aldaar niet aan een belastingheffing naar de winst is onderworpen en dat,
      ware het in Nederland gevestigd geweest, ook alhier niet aan de heffing van de vennootschapsbelasting zou
      zijn onderworpen, is het eerste lid van overeenkomstige toepassing voor zover de te zijnen laste ingehouden
      dividendbelasting betrekking heeft op de opbrengst uit portfolio-investeringen. Onder portfolio-investeringen
      worden verstaan de investeringen die vallen onder de vrijheid van kapitaalverkeer, bedoeld in artikel 63 van het
      Verdrag betreffende de werking van de Europese Unie, en die geen directe investering vormen in de zin van artikel
      64 van dat verdrag.
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel10
  - number: '10.4'
    text: |-
      Het tweede en derde lid zijn niet van toepassing met betrekking tot lichamen die een
      vergelijkbare functie vervullen als beleggingsinstellingen als bedoeld in [artikel 6a][ref1] of
      [artikel 28 van de Wet op de vennootschapsbelasting 1969][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel28
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 6a
      - id: ref2
        bwb_id: BWBR0002672
        artikel: '28'
  - number: '10.5'
    text: |-
      Bij een in Nederland gevestigd lichaam dat aan de vennootschapsbelasting is onderworpen is het eerste lid van
      overeenkomstige toepassing op de dividendbelasting die ten laste van dat lichaam is ingehouden op opbrengsten die
      bij hem ingevolge de [artikelen 8e][ref1], [8f ][ref2]en [8g van de Wet op de vennootschapsbelasting 1969][ref3]
      niet tot de winst behoren. Bij een lichaam dat is gevestigd in een staat als bedoeld in het tweede of derde lid,
      zijn het tweede en vierde lid, onderscheidenlijk het derde en vierde lid, van overeenkomstige toepassing op de
      te zijnen laste ingehouden dividendbelasting op opbrengsten die in die andere staat niet in een belasting naar de
      winst worden betrokken en die, ware het lichaam in Nederland gevestigd, ingevolge de artikelen 8e, 8f en 8g van de
      Wet op de vennootschapsbelasting 1969 niet tot de winst zouden behoren.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel8e
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel8f
      [ref3]: https://wetten.overheid.nl/BWBR0002672#Artikel8g
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 8e
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 8f
      - id: ref3
        bwb_id: BWBR0002672
        artikel: 8g
  - number: '10.6'
    text: |-
      In de gevallen waarin het volkenrecht dan wel het internationale gebruik daartoe noopt, is het eerste lid van
      overeenkomstige toepassing ten aanzien van bij ministeriële regeling aangewezen internationale organisaties.
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel10
  - number: 10a.1
    text: |-
      Aan een natuurlijke persoon of een lichaam die woonachtig is, onderscheidenlijk dat gevestigd is, in een
      andere lidstaat van de Europese Unie of in een andere staat die partij is bij de Overeenkomst betreffende de
      Europese Economische Ruimte wordt op zijn verzoek bij een voor bezwaar vatbare beschikking teruggaaf verleend
      van de in een kalenderjaar ingehouden dividendbelasting ten aanzien van opbrengsten waarvoor die natuurlijke
      persoon, onderscheidenlijk dat lichaam, niet belastingplichtig is voor de inkomstenbelasting, onderscheidenlijk
      de vennootschapsbelasting, voor zover deze dividendbelasting na vermindering met andere teruggaaf op basis
      van deze wet of een door Nederland gesloten verdrag ter voorkoming van dubbele belasting, hoger is dan de
      inkomstenbelasting, onderscheidenlijk de vennootschapsbelasting, die verschuldigd zou zijn indien die natuurlijke
      persoon, onderscheidenlijk dat lichaam, woonachtig, onderscheidenlijk gevestigd, zou zijn in Nederland.
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel10a
  - number: 10a.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van een natuurlijke persoon of een lichaam die
      woonachtig is, onderscheidenlijk dat gevestigd is, in een bij ministeriële regeling aangewezen staat, niet
      zijnde een staat als bedoeld in het eerste lid, waarmee Nederland een regeling is overeengekomen die voorziet
      in de uitwisseling van inlichtingen voor de heffing van belastingen, voor zover de te zijnen laste ingehouden
      dividendbelasting betrekking heeft op de opbrengst uit portfolio-investeringen. Onder portfolio-investeringen
      worden verstaan de investeringen die vallen onder de vrijheid van kapitaalverkeer, bedoeld in artikel 63 van het
      Verdrag betreffende de werking van de Europese Unie, en die geen directe investering vormen in de zin van artikel
      64 van dat verdrag.
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel10a
  - number: 10a.3
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op belasting naar opbrengsten met betrekking waartoe die
      natuurlijke persoon of dat lichaam niet de uiteindelijk gerechtigde is.
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel10a
  - number: 10a.4
    text: |-
      Het eerste en tweede lid zijn niet van toepassing met betrekking tot lichamen die een vergelijkbare
      functie vervullen als een beleggingsinstelling als bedoeld in de [artikelen 6a][ref1] of
      [28 van de Wet op de vennootschapsbelasting 1969][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel28
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 6a
      - id: ref2
        bwb_id: BWBR0002672
        artikel: '28'
  - number: 10a.5
    text: |-
      De teruggaaf, bedoeld in het eerste of tweede lid, wordt niet verleend indien de natuurlijke persoon of het lichaam
      voor het voor teruggaaf in aanmerking komende bedrag aan dividendbelasting recht heeft op volledige verrekening
      in zijn woonstaat, onderscheidenlijk vestigingsstaat, op grond van een tussen Nederland en die woonstaat,
      onderscheidenlijk vestigingsstaat, gesloten verdrag ter voorkoming van dubbele belasting.
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel10a
  - number: 10a.6
    text: 'Bij ministeriële regeling worden regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel10a
  - number: 10a.6.a
    text: het verzoek, bedoeld in het eerste lid, en
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel10a
  - number: 10a.6.b
    text: |-
      het bepalen van de inkomstenbelasting of de vennootschapsbelasting die verschuldigd zou zijn indien de natuurlijke
      persoon, onderscheidenlijk het lichaam, woonachtig, onderscheidenlijk gevestigd, zou zijn in Nederland.
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel10a
  - number: '11.1'
    text: |-
      Op de ingevolge [artikel 7, vierde lid][ref1], op aangifte af te dragen belasting kan een in het tweede lid
      nader aangeduide vermindering worden toegepast wegens winstuitkeringen op aandelen en winstbewijzen die door de
      inhoudingsplichtige zijn ontvangen van een lichaam dat is gevestigd op Aruba, Curaçao, Sint Maarten of de BES
      eilanden dan wel in een staat in relatie waarmee een met Nederland gesloten verdrag ter voorkoming van dubbele
      belasting van toepassing is, indien aan de volgende voorwaarden is voldaan:


      [ref1]: https://wetten.overheid.nl/BWBR0002515#Artikel7
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002515
        artikel: '7'
        hoofdstuk: IV
  - number: 11.1.1°
    text: |-
      de inhoudingsplichtige was op het tijdstip waarop het lichaam de winstuitkering ter beschikking stelde - al
      dan niet te zamen met in Nederland gevestigde, met de inhoudingsplichtige verbonden lichamen als bedoeld in
      [artikel 10a, vierde lid, van de Wet op de vennootschapsbelasting 1969][ref1] - voor ten minste 25 percent van het
      nominaal gestorte kapitaal aandeelhouder van dat lichaam dan wel bezat, zo het verdrag daarin voorziet, ten minste
      25 percent van de stemrechten in dat lichaam;


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 10a
  - number: 11.1.2°
    text: |-
      op de winstuitkeringen is op de BES eilanden in Aruba, Curaçao, Sint Maarten, of de staat waar het lichaam is
      gevestigd een bronbelasting van ten minste 5 percent ingehouden;
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel11
  - number: 11.1.3°
    text: |-
      bij het bepalen van de winst van de inhoudingsplichtige blijven de winstuitkeringen op de voet van
      [artikel 13 van de Wet op de vennootschapsbelasting 1969][ref1] buiten aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel13
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '13'
  - number: '11.2'
    text: |-
      De in het eerste lid bedoelde vermindering bedraagt 3 percent van de door de inhoudingsplichtige ter
      beschikking gestelde opbrengst waarop hij dividendbelasting heeft ingehouden, doch niet meer dan 3 percent
      van de winstuitkeringen - vóór aftrek van de ingehouden bronbelasting - bedoeld in het eerste lid die hij
      in het kalenderjaar tot het tijdstip van inhouding alsmede in de twee daaraan voorafgaande kalenderjaren
      heeft ontvangen voor zover die winstuitkeringen nog niet in aanmerking zijn genomen bij de vaststelling van
      een eerdere vermindering. De winstuitkeringen worden in aanmerking genomen in de volgorde waarin zij door de
      inhoudingsplichtige zijn ontvangen.
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel11
  - number: '11.3'
    text: |-
      Tot de in het tweede lid genoemde opbrengst waarop de inhoudingsplichtige dividendbelasting heeft ingehouden,
      wordt niet gerekend de opbrengst waarop hij weliswaar dividendbelasting heeft ingehouden doch welke belasting
      voor volledige teruggaaf in aanmerking komt, behalve indien de opbrengst ter beschikking wordt gesteld aan een
      rechtspersoon of lichaam als bedoeld in [artikel 10][ref1], die respectievelijk dat voor minder dan 5 percent van
      het nominaal gestorte kapitaal aandeelhouder is van de inhoudingsplichtige.


      [ref1]: https://wetten.overheid.nl/BWBR0002515#Artikel10
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002515
        artikel: '10'
        hoofdstuk: IV
  - number: '11.4'
    text: |-
      Voor de toepassing van dit artikel wordt met een winstuitkering op aandelen en winstbewijzen ter zake waarvan een
      vermindering kan worden toegepast gelijkgesteld de uit een staat waarmee Nederland een verdrag ter voorkoming van
      dubbele belasting heeft gesloten afkomstige winst, die in overeenstemming met het ter zake in het desbetreffende
      verdrag bepaalde in Nederland van belastingheffing is vrijgesteld en in de andere staat, naast de belasting die
      over die winst is geheven, is onderworpen aan een aanvullende belasting van ten minste 5 percent.
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel11
  - number: '11.5'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld voor de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel11
  - number: 11a.1
    text: |-
      Een inhoudingsplichtige die voor de heffing van de vennootschapsbelasting is aangemerkt als beleggingsinstelling
      als bedoeld in [artikel 28 van de Wet op de vennootschapsbelasting 1969][ref1] mag op de ingevolge
      [artikel 7, vierde lid][ref2], op aangifte af te dragen belasting een vermindering toepassen wegens ten laste van
      hem ingehouden dividendbelasting en buitenlandse bronheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0002515#Artikel7
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0002515
        artikel: '7'
        hoofdstuk: IV
  - number: 11a.2
    text: |-
      De in het eerste lid bedoelde vermindering is gelijk aan het gezamenlijke bedrag van de ten laste van de
      inhoudingsplichtige ingehouden dividendbelasting en buiten Nederland ingehouden en drukkende belastingen
      aan de bron op de opbrengsten van aandelen, winstbewijzen en geldleningen, voor zover deze dividendbelasting
      en buitenlandse bronheffingen zijn ingehouden op een tijdstip dat de inhoudingsplichtige is aangemerkt als
      beleggingsinstelling als bedoeld in het eerste lid en deze belastingen nog niet eerder in mindering zijn gekomen.
      Een buitenlandse bronheffing wordt daarbij in aanmerking genomen tot een maximum van 15% van de opbrengst waarop
      zij drukt, en vervolgens verminderd met het bedrag waarvoor uiteindelijke gerechtigden die een belang hebben in
      de inhoudingsplichtige, bij dooruitdeling van de opbrengst waarop de bronheffing betrekking heeft, op grond van
      [artikel 10, de Belastingregeling voor het Koninkrijk][ref1], de Belastingregeling voor het land Nederland dan
      wel een verdrag ter voorkoming van dubbele belasting recht zouden hebben op een vermindering of teruggaaf van
      dividendbelasting. De eerste volzin is slechts van toepassing op belasting naar opbrengsten met betrekking waartoe
      de inhoudingsplichtige de uiteindelijk gerechtigde is; [artikel 4, zevende lid][ref2], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002464#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002515#Artikel4
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0002464
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002515
        artikel: '4'
        hoofdstuk: II
  - number: 11a.3
    text: |-
      Indien de inhoudingsplichtige als dochtermaatschappij deel uitmaakt van een fiscale eenheid in de zin van
      [artikel 15, eerste lid, van de Wet op de vennootschapsbelasting 1969][ref1] worden de ten laste van haar
      ingehouden dividendbelasting en buitenlandse bronheffingen voor de toepassing van de vermindering op de voet van
      het eerste lid toegerekend aan de moedermaatschappij van die fiscale eenheid. Ingeval vóór het tot stand komen
      van die fiscale eenheid ten laste van de inhoudingsplichtige dividendbelasting en buitenlandse bronheffingen zijn
      ingehouden die nog niet op de voet van het eerste lid tot een vermindering hebben geleid, worden zij toegerekend
      aan de moedermaatschappij. Bij een verbreking van de fiscale eenheid blijven dividendbelasting en buitenlandse
      bronheffingen die nog niet op de voet van het eerste lid tot een vermindering hebben geleid, achter bij de
      moedermaatschappij.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '15'
  - number: '12.1'
    text: |-
      Indien de inhoudingsplichtige winstuitkeringen heeft ontvangen die zouden kunnen leiden tot een vermindering op de
      voet van [artikel 11][ref1], mag hij in afwijking van [artikel 4, eerste en tweede lid][ref2], tot een bedrag ter
      grootte van die vermindering afzien van het achterwege laten van inhouding van de belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0002515#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002515#Artikel4
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002515
        artikel: '11'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002515
        artikel: '4'
        hoofdstuk: II
  - number: '12.2'
    text: |-
      De inhoudingsplichtige die op de voet van het eerste lid afziet van het achterwege laten van inhouding van
      belasting, is verplicht aangifte te doen van de ingehouden belasting.
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel12
  - number: '12.3'
    text: |-
      Opbrengsten met betrekking tot welke op de voet van het eerste lid belasting is ingehouden, worden voor de
      gerechtigde tot die opbrengsten gelijkgesteld met winstuitkeringen die voldoen aan de voorwaarden voor een
      vermindering op de voet van [artikel 11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002515#Artikel11
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002515
        artikel: '11'
        hoofdstuk: IV
  - number: '13'
    text: |-
      De inspecteur stelt, op verzoek van de inhoudingsplichtige, bij voor bezwaar vatbare beschikking vast hetgeen is
      gestort op de aandelen van een besloten vennootschap met beperkte aansprakelijkheid of een naamloze vennootschap,
      niet zijnde een beleggingsmaatschappij met veranderlijk kapitaal, alsmede het gemiddeld op de desbetreffende
      aandelen gestorte kapitaal. Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het
      verzoek.
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel13
  - number: '15'
    text: |-
      Bij het bepalen van hetgeen gemiddeld is gestort op bewijzen van deelgerechtigdheid in een fonds voor gemene
      rekening waarop met ingang van 1 januari 1970 de [Wet op de vennootschapsbelasting 1969][ref1] toepassing vindt,
      wordt het alsdan aanwezige vermogen aangemerkt als op dat tijdstip te zijn gestort. Tot dit vermogen worden niet
      gerekend na 1 januari 1968 behaalde en niet uitgekeerde voordelen, welke, zo zij vóór het eerstbedoelde tijdstip
      zouden zijn uitgekeerd aan niet tot het vermogen van een onderneming gerechtigde binnenlandse belastingplichtigen,
      als inkomsten uit vermogen zouden zijn aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002672
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002672
  - number: '16'
    text: |-
      [Artikel 3a, eerste lid][ref1], vindt geen toepassing met betrekking tot stortingen op aandelen die vóór 1 januari
      1946 hebben plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002515#Artikel3a
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002515
        artikel: 3a
        hoofdstuk: II
  - number: 16a
    text: |-
      In aanvulling op [artikel 4, zesde lid][ref1], mag bij een beleggingsinstelling in de zin van
      [artikel 28 van de Wet op de vennootschapsbelasting 1969][ref2] inhouding van de belasting achterwege
      blijven ten aanzien van opbrengsten van geblokkeerde rechten van deelneming in die instelling als bedoeld in
      [artikel 10bis.5, derde lid, van de Wet inkomstenbelasting 2001][ref3] alsmede ten aanzien van de opbrengsten van
      stamrechtbeleggingsrechten als bedoeld in [artikel 39f van de Wet op de loonbelasting 1964][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002515#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel10bis
      [ref4]: https://wetten.overheid.nl/BWBR0002471#Artikel39f
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0002515
        artikel: '4'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002672
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: 10bis
      - id: ref4
        bwb_id: BWBR0002471
        artikel: 39f
  - number: '17.1'
    text: Deze wet treedt in werking op 1 januari 1966.
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel17
  - number: '17.2'
    text: |-
      Deze wet kan worden aangehaald als: Wet op de dividendbelasting, met vermelding van het jaar, waarin zij in het
      *Staatsblad* wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0002515/2022-01-01#Artikel17
