---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_op_de_dividendbelasting_1965
regulatory_layer: WET
publication_date: '2023-12-27'
valid_from: '2004-01-01'
bwb_id: BWBR0002515
url: https://wetten.overheid.nl/BWBR0002515/2004-01-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is het Besluit op de Dividendbelasting 1941 door een meer
    overzichtelijke en op verschillende punten herziene wettelijke regeling te vervangen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Onder de naam 'dividendbelasting' wordt een directe belasting geheven van degenen, die - rechtstreeks of door
      middel van certificaten - gerechtigd zijn tot de opbrengst van aandelen in, en winstbewijzen van en geldleningen
      als bedoeld in [artikel 10, eerste lid, onderdeel d, van de Wet op de vennootschapsbelasting 1969][ref1] aan
      in Nederland gevestigde naamloze vennootschappen, besloten vennootschappen met beperkte aansprakelijkheid, open
      commanditaire vennootschappen en andere vennootschappen welker kapitaal geheel of ten dele in aandelen is verdeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '10'
  - number: '1.2'
    text: |-
      Voor de toepassing van deze wet worden bewijzen van deelgerechtigdheid in fondsen voor gemene rekening als bedoeld
      in [artikel 2, tweede lid, van de Wet op de vennootschapsbelasting 1969][ref1], gelijkgesteld met aandelen in
      vennootschappen waarvan het kapitaal geheel of ten dele in aandelen is verdeeld en worden de fondsen gelijkgesteld
      met vennootschappen.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel2
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '2'
  - number: '1.3'
    text: |-
      Heeft de oprichting van een in het eerste lid bedoelde vennootschap plaatsgevonden naar Nederlands recht, dan
      wordt die vennootschap steeds geacht in Nederland te zijn gevestigd. Een Europese naamloze vennootschap die bij
      haar oprichting werd beheerst door Nederlands recht, wordt voor de toepassing van de eerste volzin geacht te zijn
      opgericht naar Nederlands recht.
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel1
  - number: '2'
    text: |-
      De belasting wordt geheven naar de opbrengst van de in [artikel 1][ref1] bedoelde aandelen, winstbewijzen en
      geldleningen.


      [ref1]: https://wetten.overheid.nl/BWBR0002515#Artikel1
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002515
        artikel: '1'
        hoofdstuk: I
  - number: '3.1'
    text: 'Tot de opbrengst behoren:'
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel3
  - number: 3.1.a
    text: |-
      onmiddellijke of middellijke uitdelingen van winst, onder welke naam of in welke vorm ook gedaan daaronder begrepen
      hetgeen ter gelegenheid van inkoop van aandelen, anders dan ter tijdelijke belegging, wordt uitgekeerd boven het
      gemiddeld op de desbetreffende aandelen gestorte kapitaal;
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel3
  - number: 3.1.b
    text: |-
      hetgeen bij liquidatie op aandelen wordt uitgekeerd boven het gemiddeld op de desbetreffende aandelen gestorte
      kapitaal, behoudens voorzover de liquidatie-uitkering is toe te rekenen aan de vermogensbestanddelen waarmee
      degene die gerechtigd is tot de liquidatie-uitkering, de onderneming van de vennootschap met toepassing van
      [artikel 14c van de Wet op de vennootschapsbelasting 1969][ref1] voortzet of mede voortzet;


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel14c
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 14c
  - number: 3.1.c
    text: |-
      de nominale waarde van aandelen uitgereikt aan aandeelhouders, voor zover niet blijkt dat storting heeft plaats
      gevonden of zal plaats vinden; bijschrijving op aandelen wordt met uitreiking van aandelen gelijkgesteld;
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel3
  - number: 3.1.d
    text: |-
      gedeeltelijke teruggaaf van hetgeen op aandelen is gestort, indien en voor zover er zuivere winst is, tenzij
      tevoren de algemene vergadering van aandeelhouders tot deze teruggaaf heeft besloten en de nominale waarde van de
      desbetreffende geplaatste aandelen bij statutenwijziging met een gelijk bedrag is verminderd;
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel3
  - number: 3.1.e
    text: |-
      hetgeen wordt uitgekeerd op winstbewijzen, daaronder begrepen hetgeen wordt genoten ter gelegenheid van afkoop of
      inkoop daarvan;
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel3
  - number: 3.1.f
    text: |-
      vergoedingen op geldleningen als bedoeld in
      [artikel 10, eerste lid, onderdeel d, van de Wet op de vennootschapsbelasting 1969][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '10'
  - number: 3.1.g
    text: |-
      gehele of gedeeltelijke teruggaaf van hetgeen op bewijzen van deelgerechtigdheid in een fonds voor gemene rekening
      is gestort, wordt als uitkering beschouwd, voorzover het vermogen van het fonds uitgaat boven hetgeen op de in
      omloop zijnde bewijzen van deelgerechtigdheid is gestort;
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel3
  - number: 3.1.h
    text: |-
      het bedrag dat als storting wordt toegerekend aan elk van de bewijzen van deelgerechtigdheid in een fonds voor
      gemene rekening voorzover winsten van dat fonds worden bestemd om te gelden als storting op aan deelgerechtigden
      uit te geven of reeds uitgegeven bewijzen van deelgerechtigdheid.
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel3
  - number: '3.2'
    text: |-
      Niet in geld genoten opbrengst wordt in aanmerking genomen naar de waarde welke daaraan in het economische verkeer
      kan worden toegekend.
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel3
  - number: '3.3'
    text: |-
      Inkoop van aandelen met het oog op de nakoming van een optieverplichting jegens een
      werknemer van de eigen vennootschap of een verbonden vennootschap als bedoeld in
      [artikel 10a, zevende lid, van de Wet op de loonbelasting 1964][ref1] is een tijdelijke belegging. Ingeval deze
      aandelen drie maanden na het tenietgaan van de optieverplichting nog tot de bezittingen van de vennootschap
      behoren, worden zij op dat tijdstip geacht te zijn ingekocht tegen de waarde in het economische verkeer van
      de aandelen op dat tijdstip. Voor de toepassing van dit lid wordt onder een optieverplichting verstaan een
      verplichting die de tegenhanger is van een recht om een of meer aandelen of daarmee gelijk te stellen rechten te
      verwerven, of van een recht dat daarmee gelijk te stellen is.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 10a
  - number: 3a.1
    text: |-
      Voorzover de storting op aandelen in een vennootschap bestaat uit aandelen in een andere vennootschap wordt ten
      aanzien van alle aandeelhouders slechts als gestort aangemerkt hetgeen op de laatstbedoelde aandelen is gestort,
      verminderd met hetgeen in contanten is bijbetaald.
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel3a
  - number: 3a.2
    text: |-
      In geval van een overgang onder algemene titel in het kader van een splitsing van een rechtspersoon wordt
      ten aanzien van alle aandeelhouders ten hoogste een evenredig gedeelte van het bedrag van het op de aandelen
      in de splitsende rechtspersoon gestorte kapitaal aangemerkt als gestort kapitaal op de door de verkrijgende
      rechtspersonen in het kader van de splitsing toegekende aandelen, en wordt, in geval van een splitsing waarbij de
      splitsende rechtspersoon blijft bestaan, het op de aandelen in de splitsende rechtspersoon gestorte kapitaal in
      dezelfde mate verminderd. Indien in het kader van de splitsing een bijbetaling in contanten plaatsvindt, wordt voor
      de toepassing van de vorige volzin het op de aandelen in de splitsende rechtspersoon gestorte kapitaal verminderd
      met deze bijbetaling.
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel3a
  - number: 3a.3
    text: |-
      In geval van een overgang onder algemene titel in het kader van een fusie van een rechtspersoon wordt ten aanzien
      van alle aandeelhouders ten hoogste het bedrag van het op de aandelen in de verdwijnende rechtspersoon gestorte
      kapitaal aangemerkt als gestort kapitaal op de door de verkrijgende rechtspersonen in het kader van de fusie
      toegekende aandelen. Indien in het kader van de fusie een bijbetaling in contanten plaatsvindt, wordt voor de
      toepassing van de vorige volzin het op de aandelen in de verdwijnende rechtspersoon gestorte kapitaal verminderd
      met deze bijbetaling.
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel3a
  - number: 3a.4
    text: |-
      Indien de overgang onder algemene titel in het kader van een splitsing in overwegende mate is gericht op het
      ontgaan of uitstellen van belastingheffing, blijft het tweede lid buiten toepassing; in dat geval wordt hetgeen
      bij de splitsing door een aandeelhouder als zodanig wordt genoten aangemerkt als een uitdeling van winst door
      de splitsende rechtspersoon. Een splitsing wordt, tenzij het tegendeel aannemelijk wordt gemaakt, geacht in
      overwegende mate te zijn gericht op het ontgaan of uitstellen van belastingheffing indien de splitsing niet
      plaatsvindt op grond van zakelijke overwegingen, zoals herstructurering of rationalisering van de actieve
      werkzaamheden van de splitsende en de verkrijgende rechtspersonen. Zakelijke overwegingen worden voorts niet
      aanwezig geacht indien de activa die bij de splitsing overgaan op de andere rechtspersoon hoofdzakelijk,
      onmiddellijk of middellijk, bestaan uit beleggingen – liquide middelen daaronder begrepen – of indien hetgeen bij
      de splitsende rechtspersoon achterblijft hoofdzakelijk – onmiddellijk of middellijk bestaat uit beleggingen, tenzij
      de beleggingen die overgaan respectievelijk achterblijven geen afzondering van ingehouden winst representeren.
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel3a
  - number: 3a.5
    text: |-
      Voor de toepassing van het tweede lid wordt onder een evenredig gedeelte verstaan: een gedeelte dat
      evenredig is aan de verhouding tussen de waarde in het economische verkeer ten tijde van de splitsing van de
      vermogensbestanddelen van de splitsende rechtspersoon die overgaan op de verkrijgende rechtspersoon en de waarde in
      het economische verkeer ten tijde van de splitsing van het gehele vermogen van de splitsende rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel3a
  - number: 3a.6
    text: |-
      De splitsende rechtspersoon die zekerheid wil hebben omtrent de vraag of de splitsing niet wordt geacht in
      overwegende mate te zijn gericht op het ontgaan of uitstellen van belastingheffing, kan voor de splitsing een
      verzoek indienen bij de inspecteur die daarop bij voor bezwaar vatbare beschikking beslist.
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel3a
  - number: 3a.7
    text: |-
      In het geval van toekenning van een aandelenoptierecht aan een werknemer wordt als gestort aangemerkt het bedrag,
      bedoeld in [artikel 9, derde lid, van de Wet op de vennootschapsbelasting 1969][ref1] vermeerderd met het bedrag
      dat de werknemer ter zake in rekening wordt gebracht, en wordt als tijdstip van storting aangemerkt het tijdstip,
      bedoeld in genoemd [artikel 9, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel9
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: '9'
  - number: 3b
    text: |-
      De herbeleggingsreserve die is gevormd ingevolge de nadere regelen die zijn gegeven krachtens
      [artikel 28 van de Wet op de vennootschapsbelasting 1969][ref1] met betrekking tot de heffing van
      vennootschapsbelasting van beleggingsinstellingen, wordt aangemerkt als op de aandelen van de instelling gestort
      kapitaal.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel28
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '28'
  - number: '4.1'
    text: |-
      Inhouding van de belasting mag achterwege blijven ten aanzien van opbrengsten van aandelen, winstbewijzen en
      geldleningen als bedoeld in [artikel 10, eerste lid, onderdeel d, van de Wet op de vennootschapsbelasting 1969][ref1]
      indien de deelnemingsvrijstelling, bedoeld in [artikel 13 van de Wet op de vennootschapsbelasting 1969][ref2], van
      toepassing is op de voordelen die de tot de opbrengstgerechtigde uit die aandelen, winstbewijzen en geldleningen
      geniet en de deelneming behoort tot het vermogen van zijn in Nederland gedreven onderneming. De eerste volzin is
      niet van toepassing ten aanzien van opbrengsten met betrekking waartoe de opbrengstgerechtigde niet de uiteindelijk
      gerechtigde is.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel13
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: '13'
  - number: '4.2'
    text: |-
      Inhouding van de belasting mag achterwege blijven ten aanzien van de opbrengsten
      van aandelen in, winstbewijzen ten laste van en geldleningen als bedoeld in
      [artikel 10, eerste lid, onderdeel d, van de Wet op de vennootschapsbelasting 1969][ref1]
      verstrekt aan aangewezen kredietinstellingen en beleggingsinstellingen als bedoeld in
      [artikel 5.14 van de Wet inkomstenbelasting 2001][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '5'
  - number: '4.3'
    text: |-
      Voor het achterwege laten van de inhouding van dividendbelasting ingevolge dit artikel, een teruggaaf van
      dividendbelasting ingevolge [artikel 10][ref1], alsmede het achterwege laten dan wel een vermindering of teruggaaf
      van dividendbelasting ingevolge de Belastingregeling voor het Koninkrijk of een door Nederland gesloten verdrag
      ter voorkoming van dubbele belasting, wordt niet als uiteindelijk gerechtigde beschouwd degene die in samenhang
      met de genoten opbrengst een tegenprestatie heeft verricht als onderdeel van een samenstel van transacties
      waarbij aannemelijk is dat: - de opbrengst geheel of gedeeltelijk direct of indirect ten goede is gekomen aan: een
      natuurlijke persoon of een rechtspersoon ten aanzien van wie inhouding niet achterwege mag blijven, terwijl dit ten
      aanzien van degene die de tegenprestatie heeft verricht wel mag, of een natuurlijke persoon of rechtspersoon die
      in mindere mate gerechtigd is tot vermindering of teruggaaf van dividendbelasting dan degene die de tegenprestatie
      heeft verricht; en
        - deze natuurlijke persoon of rechtspersoon een positie in aandelen, winstbewijzen of geldleningen als bedoeld in
      [artikel 10, eerste lid, onderdeel d, van de Wet op de vennootschapsbelasting 1969][ref2] op directe of indirecte
      wijze behoudt of verkrijgt die vergelijkbaar is met zijn positie in soortgelijke aandelen, winstbewijzen of
      geldleningen voorafgaand aan het moment waarop het samenstel van transacties een aanvang heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002515#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel10
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002515
        artikel: '10'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002672
        artikel: '10'
  - number: '4.4'
    text: |-
      Voor de toepassing van het derde lid: - kan van een samenstel van transacties eveneens sprake zijn ingeval
      transacties zijn aangegaan op een gereglementeerde effectenbeurs of markt;
        - wordt met een samenstel van transacties gelijkgesteld een transactie die betrekking heeft op de enkele verwerving
      van een of meer dividendbewijzen of op de vestiging van kortlopende genotsrechten op aandelen.
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel4
  - number: 4a.1
    text: |-
      Inhouding van belasting blijft achterwege ten aanzien van de opbrengst van aandelen, winstbewijzen en geldleningen
      als bedoeld in [artikel 10, eerste lid, onderdeel d, van de Wet op de vennootschapsbelasting 1969](onbekend) die
      wordt uitgedeeld aan een in een andere lid-staat van de Europese Unie gevestigd lichaam, indien aan de volgende
      voorwaarden is voldaan:
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel4a
  - number: 4a.1.1°
    text: |-
      de inhoudingsplichtige en het ontvangende lichaam hebben één van de in de bijlage bij de [Richtlijn 90/435/EEG]
      (31990L0435) van de Raad van de Europese Gemeenschappen van 23 juli 1990 betreffende de gemeenschappelijke fiscale
      regeling voor moedermaatschappijen en dochterondernemingen uit verschillende Lid-Staten (*PbEG* L 225), opgenomen
      rechtsvormen;
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel4a
  - number: 4a.1.2°
    text: |-
      het ontvangende lichaam (moedermaatschappij) is op het tijdstip waarop de opbrengst ter beschikking is gesteld
      reeds gedurende een ononderbroken periode van één jaar voor ten minste 25 percent van het nominaal gestorte
      kapitaal aandeelhouder van de inhoudingsplichtige (dochtermaatschappij);
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel4a
  - number: 4a.1.3°
    text: |-
      de moedermaatschappij en de dochtermaatschappij zijn in de lid-staat van vestiging zonder keuzemogelijkheid en
      zonder ervan te zijn vrijgesteld, onderworpen aan de aldaar geheven belasting naar de winst als bedoeld in artikel
      2, onderdeel *c,* van de richtlijn;
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel4a
  - number: 4a.1.4°
    text: |-
      de moedermaatschappij en de dochtermaatschappij worden in de lid-staat van vestiging niet geacht volgens een met
      een derde Staat gesloten verdrag ter voorkoming van dubbele belasting buiten de lid-staten van de Europese Unie te
      zijn gevestigd;
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel4a
  - number: 4a.2
    text: |-
      Indien de moedermaatschappij is gevestigd in een lid-staat van de Europese Unie waarmee Nederland een verdrag ter
      voorkoming van dubbele belasting heeft gesloten dat voorziet in een verlaging van belastingheffing op dividenden op
      grond van het bezit van het aantal stemrechten in de vennootschap die de dividenden uitdeelt, geldt in afwijking in
      zoverre van het eerste lid, als voorwaarde dat die moedermaatschappij in het bezit is van ten minste 25 percent van
      de stemrechten in de inhoudingsplichtige.
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel4a
  - number: 4a.3
    text: |-
      Inhouding van belasting blijft mede achterwege indien de moedermaatschappij, in afwijking in zoverre van het
      eerste en tweede lid, voor ten minste 10 percent van het nominaal gestorte kapitaal aandeelhouder is van de
      inhoudingsplichtige dan wel in het bezit is van ten minste 10 percent van de stemrechten in de inhoudingsplichtige,
      mits de lid-staat van de Europese Unie waarin de moedermaatschappij is gevestigd bij een zelfde bezitspercentage:
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel4a
  - number: 4a.3.1°
    text: |-
      bij de belastingheffing over de winstuitkering van de inhoudingsplichtige aan de moedermaatschappij handelt
      overeenkomstig artikel vier van de in het eerste lid genoemde richtlijn, alsmede
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel4a
  - number: 4a.3.2°
    text: |-
      van zijn kant in een overeenkomstig geval heffing van bronbelasting op winstuitkeringen aan in Nederland gevestigde
      moedermaatschappijen achterwege laat overeenkomstig artikel vijf van die richtlijn.
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel4a
  - number: 4a.4
    text: |-
      De inhoudingsplichtige is verplicht binnen één maand na het tijdstip waarop de opbrengst ter beschikking is
      gesteld bij de inspecteur schriftelijk opgaaf te doen van de naam, de plaats van vestiging en het adres van
      de moedermaatschappij, van het nominaal gestorte kapitaal dan wel het aantal stemgerechtigde aandelen van de
      inhoudingsplichtige, van het gedeelte van dat kapitaal dan wel van de stemgerechtigde aandelen onderscheidenlijk
      het percentage van de stemrechten dat de moedermaatschappij bezit en van het bedrag van de ter beschikking gestelde
      opbrengst. Voorts dient de inhoudingsplichtige te verklaren dat aan de in het eerste en tweede lid gestelde
      voorwaarden is voldaan. Bij de toepassing van het derde lid dient de inhoudingsplichtige tevens te verklaren dat,
      in afwijking in zoverre van de in het eerste en tweede lid gestelde voorwaarden, is voldaan aan de in de aanhef van
      het derde lid gestelde voorwaarde met betrekking tot het bezitspercentage alsmede dat is voldaan aan de in dat lid,
      onder 1°, gestelde voorwaarde.
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel4a
  - number: 4b.1
    text: |-
      Ingeval de in [artikel 4][ref1], 2°, dan wel in het tweede lid, bedoelde moedermaatschappij op het tijdstip waarop
      de opbrengst ter beschikking is gesteld nog niet voldoet aan de bedoelde bezitsperiode van één jaar blijft in
      afwijking in zoverre van dat artikel inhouding van belasting eveneens achterwege, mits de dochtermaatschappij ten
      belope van het bedrag van de belasting waarvan inhouding achterwege blijft, zekerheid stelt.


      [ref1]: https://wetten.overheid.nl/BWBR0002515#Artikel4a
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0002515
        artikel: 4a
        hoofdstuk: II
  - number: 4b.2
    text: |-
      Gelijktijdig met het doen van de opgaaf als bedoeld in [artikel 4][ref1], wordt de zekerheid gesteld bij de
      ontvanger. Deze beslist of de vorm van zekerheid die de dochtermaatschappij aanbiedt, wordt aanvaard.


      [ref1]: https://wetten.overheid.nl/BWBR0002515#Artikel4a
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0002515
        artikel: 4a
        hoofdstuk: II
  - number: 4b.3
    text: |-
      Indien binnen één jaar na het tijdstip waarop de moedermaatschappij is gaan voldoen aan de voorwaarde dat zij voor
      ten minste 25 percent van het nominaal gestorte kapitaal aandeelhouder is van de dochtermaatschappij, dan wel ten
      minste 25 percent van de stemrechten in de dochtermaatschappij bezit, zich een omstandigheid voordoet waardoor haar
      bezit daalt beneden de 25 percent, moet de belasting waarvan inhouding op grond van het eerste lid achterwege is
      gebleven, alsnog worden betaald.
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel4b
  - number: 4b.4
    text: |-
      De zekerheid wordt opgeheven indien de moedermaatschappij één jaar na het in het derde lid bedoelde tijdstip nog
      steeds voor ten minste 25 percent aandeelhouder is van de dochtermaatschappij, dan wel nog steeds ten minste 25
      percent van de stemrechten in die maatschappij bezit.
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel4b
  - number: 4b.5
    text: De aan het stellen en het opheffen van de zekerheid verbonden kosten komen ten laste van de dochtermaatschappij.
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel4b
  - number: 4b.6
    text: |-
      De voorgaande leden zijn van overeenkomstige toepassing ingeval de in [artikel 4][ref1], bedoelde
      moedermaatschappij op het tijdstip waarop de opbrengst ter beschikking is gesteld nog niet voldoet aan de bedoelde
      bezitsperiode van één jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002515#Artikel4a
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0002515
        artikel: 4a
        hoofdstuk: II
  - number: 4c.1
    text: |-
      Inhouding van de belasting mag achterwege blijven ten aanzien van de opbrengst van aandelen ter gelegenheid van
      een inkoop van aandelen indien het totale bedrag van de inkoop in het kalenderjaar niet meer bedraagt dan tien keer
      het bedrag van het volgens het tweede lid bepaalde gemiddeld uitgekeerde dividend in contanten in vijf voorafgaande
      kalenderjaren, verminderd met de bedragen aan inkoop van aandelen volgens dit artikel in de voorafgaande vier
      kalenderjaren, mits voorts aan de volgende vereisten is voldaan:
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel4c
  - number: 4c.1.a
    text: |-
      de ingekochte aandelen behoren tot een soort welke wordt genoteerd aan de officiële markt van de Euronext
      effectenbeurs te Amsterdam of aan een daarmee bij ministeriële regeling gelijk te stellen buitenlandse beurs
      en de inhoudingsplichtige is niet een lichaam waarvan de feitelijke werkzaamheid hoofdzakelijk bestaat uit het,
      onmiddellijk of middellijk, beleggen van vermogen of een daarmee overeenkomende werkzaamheid;
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel4c
  - number: 4c.1.b
    text: |-
      in het kalenderjaar wordt aan dividend in contanten ten minste uitgekeerd een bedrag gelijk aan het volgens het
      tweede lid bepaalde gemiddeld uitgekeerde dividend in contanten in vijf voorafgaande kalenderjaren, en
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel4c
  - number: 4c.1.c
    text: |-
      in het kalenderjaar tot het tijdstip van de inkoop en in de vier daaraan voorafgaande kalenderjaren is het
      nominaal gestorte kapitaal in de inhoudingsplichtige niet vergroot, anders dan in situaties van fusies, situaties
      waarin ter zake van de vergroting van het nominaal gestorte kapitaal [artikel 3, eerste lid, onderdeel c][ref1],
      van toepassing is situaties waarin sprake is van een omzetting in nominaal aandelenkapitaal van hetgeen op
      aandelen is gestort boven het nominale aandelenkapitaal, of situaties waarin de vergroting van het nominaal
      gestorte kapitaal een gevolg is van een niet-openbare emissie van aandelen in verband met de voldoening aan een
      aandelenoptieverplichting jegens een werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0002515#Artikel3
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel4c
    references:
      - id: ref1
        bwb_id: BWBR0002515
        artikel: '3'
        hoofdstuk: II
  - number: 4c.2
    text: |-
      Het bedrag van het in het eerste lid bedoelde gemiddeld uitgekeerde dividend in contanten in vijf voorafgaande
      kalenderjaren, wordt berekend door na correctie van de bedragen van de zeven voorafgaande kalenderjaren met een
      inflatiebijstelling, het jaar met het hoogste en het jaar met het laagste gecorrigeerde bedrag buiten aanmerking
      te laten.
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel4c
  - number: 4c.3
    text: |-
      Indien de inhoudingsplichtige verschillende soorten nominaal gestort kapitaal heeft, worden de bepalingen van dit
      artikel per soort ingekochte aandelen toegepast.
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel4c
  - number: 4c.4
    text: 'Bij ministeriële regeling worden regels gesteld:'
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel4c
  - number: 4c.4.a
    text: |-
      voor de toepassing van dit artikel met betrekking tot situaties waarin de inhoudingsplichtige in omvang is
      toegenomen of afgenomen ten gevolge van een fusie of splitsing;
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel4c
  - number: 4c.4.b
    text: met betrekking tot de in het tweede lid bedoelde inflatiebijstelling.
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel4c
  - number: 4c.5
    text: |-
      De inhoudingsplichtige die zekerheid wil hebben op de vraag in hoeverre de inhouding van de belasting op de voet
      van dit artikel achterwege mag blijven, kan daartoe een verzoek indienen bij de inspecteur, die daarop bij voor
      bezwaar vatbare beschikking beslist. Het verzoek wordt gedaan ten minste zes weken voor de voorgenomen inkoop.
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel4c
  - number: '5'
    text: De belasting bedraagt 25% van de opbrengst.
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel5
  - number: '6.1'
    text: |-
      Neemt de vennootschap die de opbrengst verschuldigd is, de belasting voor haar rekening, dan wordt voor het
      berekenen van de belasting de opbrengst vermenigvuldigd met 100/75.
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel6
  - number: '6.2'
    text: |-
      Indien bij het einde van het kalenderjaar blijkt dat bij een inkoop van aandelen in het jaar niet is voldaan aan
      de voorwaarden van [artikel 4c, eerste lid, onderdelen b of c][ref1], wordt de belasting berekend gelijk als in
      situaties waarin de vennootschap de belasting voor haar rekening neemt.


      [ref1]: https://wetten.overheid.nl/BWBR0002515#Artikel4c
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002515
        artikel: 4c
        hoofdstuk: II
  - number: '7.1'
    text: De belasting wordt geheven door inhouding op de opbrengst.
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel7
  - number: '7.2'
    text: Inhoudingsplichtige is de vennootschap die de opbrengst verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel7
  - number: '7.3'
    text: |-
      De inhoudingsplichtige is verplicht de belasting in te houden op het tijdstip waarop de opbrengst ter beschikking
      is gesteld.
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel7
  - number: '7.4'
    text: De inhoudingsplichtige is verplicht de ingehouden belasting op aangifte af te dragen.
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel7
  - number: '7.5'
    text: |-
      Overtreft de belasting de opbrengst in geld, dan wordt het ontbrekende geacht te zijn ingehouden op het in het
      derde lid omschreven tijdstip, met dien verstande dat de inhoudingsplichtige bevoegd is dat ontbrekende te verhalen
      op degene die tot de opbrengst gerechtigd is. De inhoudingsplichtige kan de afgifte van de niet in geld genoten
      opbrengst opschorten tot voldoening van deze vordering plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel7
  - number: '9.1'
    text: |-
      De inhoudingsplichtige, degene bij wie de opbrengst is betaalbaar gesteld, het administratiekantoor dat de
      opbrengst doorbetaalt aan certificaathouders, of degene tot wiens beroep het kopen of innen van dividendbewijzen
      gewoonlijk behoort, is, zodra de opbrengst is uitbetaald, tegoedgeschreven, verrekend of uitgereikt, gehouden
      ten behoeve van de rechthebbende een gedagtekende nota uit te reiken volgens bij ministeriële regeling te stellen
      regels.
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel9
  - number: '9.2'
    text: |-
      Voor de toepassing van [artikel 24 van de Algemene wet inzake rijksbelastingen][ref1] (*Stb.* 1959, 301) wordt de
      belasting geacht te zijn ingehouden op de dag waarop de in het eerste lid bedoelde nota is gedagtekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel24
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '24'
  - number: '10.1'
    text: |-
      Aan een in Nederland gevestigde rechtspersoon die niet aan de vennootschapsbelasting onderworpen is, wordt op
      zijn verzoek bij een door de inspecteur te nemen voor bezwaar vatbare beschikking teruggaaf verleend van in een
      kalenderjaar te zijnen laste ingehouden dividendbelasting, indien deze meer bedraagt dan € 23. De eerste volzin
      is niet van toepassing op dividendbelasting naar opbrengsten met betrekking waartoe de rechtspersoon niet de
      uiteindelijk gerechtigde is. Het verzoek geschiedt bij een aangifte die wordt gedaan binnen een bij ministeriële
      regeling te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel10
  - number: '10.2'
    text: |-
      Aan een vennootschap die voor de heffing van de vennootschapsbelasting wordt aangemerkt als beleggingsinstelling
      wordt op haar verzoek bij een door de inspecteur te nemen voor bezwaar vatbare beschikking teruggaaf verleend
      van in een jaar te haren laste ingehouden dividendbelasting. De eerste volzin is niet van toepassing op
      dividendbelasting naar opbrengsten met betrekking waartoe de vennootschap niet de uiteindelijk gerechtigde is.
      Het verzoek geschiedt bij een aangifte die wordt gedaan uiterlijk zes maanden na afloop van het jaar waarop de
      teruggaaf betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel10
  - number: '11.1'
    text: |-
      Op de ingevolge [artikel 7, vierde lid][ref1], op aangifte af te dragen belasting kan een in het tweede lid
      nader aangeduide vermindering worden toegepast wegens winstuitkeringen op aandelen en winstbewijzen die door de
      inhoudingsplichtige zijn ontvangen van een lichaam dat is gevestigd in de Nederlandse Antillen of Aruba dan wel in
      een staat in relatie waarmee een met Nederland gesloten verdrag ter voorkoming van dubbele belasting van toepassing
      is, indien aan de volgende voorwaarden is voldaan:


      [ref1]: https://wetten.overheid.nl/BWBR0002515#Artikel7
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002515
        artikel: '7'
        hoofdstuk: IV
  - number: 11.1.1°
    text: |-
      de inhoudingsplichtige was op het tijdstip waarop het lichaam de winstuitkering ter beschikking stelde - al
      dan niet te zamen met in Nederland gevestigde, met de inhoudingsplichtige verbonden lichamen als bedoeld in
      [artikel 10][ref1] - voor ten minste 25 percent van het nominaal gestorte kapitaal aandeelhouder van dat lichaam
      dan wel bezat, zo het verdrag daarin voorziet, ten minste 25 percent van de stemrechten in dat lichaam;


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 10a
  - number: 11.1.2°
    text: |-
      op de winstuitkeringen is in de Nederlandse Antillen, Aruba of de staat waar het lichaam is gevestigd een
      bronbelasting van ten minste 5 percent ingehouden;
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel11
  - number: 11.1.3°
    text: |-
      bij het bepalen van de winst van de inhoudingsplichtige blijven de winstuitkeringen op de voet van
      [artikel 13 van de Wet op de vennootschapsbelasting 1969][ref1] buiten aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel13
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '13'
  - number: '11.2'
    text: |-
      De in het eerste lid bedoelde vermindering bedraagt 3 percent van de door de inhoudingsplichtige ter
      beschikking gestelde opbrengst waarop hij dividendbelasting heeft ingehouden, doch niet meer dan 3 percent
      van de winstuitkeringen - vóór aftrek van de ingehouden bronbelasting - bedoeld in het eerste lid die hij
      in het kalenderjaar tot het tijdstip van inhouding alsmede in de twee daaraan voorafgaande kalenderjaren
      heeft ontvangen voor zover die winstuitkeringen nog niet in aanmerking zijn genomen bij de vaststelling van
      een eerdere vermindering. De winstuitkeringen worden in aanmerking genomen in de volgorde waarin zij door de
      inhoudingsplichtige zijn ontvangen.
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel11
  - number: '11.3'
    text: |-
      Tot de in het tweede lid genoemde opbrengst waarop de inhoudingsplichtige dividendbelasting heeft ingehouden,
      wordt niet gerekend de opbrengst waarop hij weliswaar dividendbelasting heeft ingehouden doch welke belasting voor
      volledige teruggaaf in aanmerking komt, behalve indien de opbrengst ter beschikking wordt gesteld aan:
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel11
  - number: 11.3.1°
    text: |-
      een rechtspersoon als bedoeld in [artikel 10, eerste lid][ref1], of een daarmee vergelijkbaar in het buitenland
      gevestigd lichaam, die respectievelijk dat voor minder dan 5 percent van het nominaal gestorte kapitaal
      aandeelhouder is van de inhoudingsplichtige; of


      [ref1]: https://wetten.overheid.nl/BWBR0002515#Artikel10
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002515
        artikel: '10'
        hoofdstuk: IV
  - number: 11.3.2°
    text: |-
      een vennootschap als bedoeld in [artikel 10, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002515#Artikel10
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002515
        artikel: '10'
        hoofdstuk: IV
  - number: '11.4'
    text: |-
      Indien de inhoudingsplichtige als dochtermaatschappij deel uit maakt van een fiscale eenheid in de zin van
      [artikel 15, eerste lid, van de Wet op de vennootschapsbelasting 1969][ref1] worden de door die maatschappij
      ontvangen winstuitkeringen op aandelen en winstbewijzen die voldoen aan de voorwaarden van het eerste lid voor
      de toepassing van de vermindering ingevolge dit artikel toegerekend aan de moedermaatschappij van die fiscale
      eenheid. Ingeval door de dochtermaatschappij voor het tot stand komen van de in de vorige volzin bedoelde fiscale
      eenheid winstuitkeringen zijn ontvangen die voldoen aan de voorwaarden van het eerste lid, kan Onze Minister op
      gezamenlijk verzoek van de moeder- en de dochtermaatschappij, onder door hem te stellen voorwaarden, toestaan dat
      die winstuitkeringen worden toegerekend aan de moedermaatschappij.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '15'
  - number: '11.5'
    text: |-
      Voor de toepassing van dit artikel wordt met een winstuitkering op aandelen en winstbewijzen ter zake waarvan een
      vermindering kan worden toegepast gelijkgesteld de uit een staat waarmee Nederland een verdrag ter voorkoming van
      dubbele belasting heeft gesloten afkomstige winst, die in overeenstemming met het ter zake in het desbetreffende
      verdrag bepaalde in Nederland van belastingheffing is vrijgesteld en in de andere staat, naast de belasting die
      over die winst is geheven, is onderworpen aan een aanvullende belasting van ten minste 5 percent.
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel11
  - number: '11.6'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld voor de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel11
  - number: '12.1'
    text: |-
      Indien de inhoudingsplichtige winstuitkeringen heeft ontvangen die zouden kunnen leiden tot een vermindering op de
      voet van [artikel 11][ref1], mag hij in afwijking van [artikel 4, eerste lid][ref2], tot een bedrag ter grootte van
      die vermindering afzien van het achterwege laten van inhouding van de belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0002515#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002515#Artikel4
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002515
        artikel: '11'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002515
        artikel: '4'
        hoofdstuk: II
  - number: '12.2'
    text: |-
      De inhoudingsplichtige die op de voet van het eerste lid afziet van het achterwege laten van inhouding van
      belasting, is verplicht aangifte te doen van de ingehouden belasting.
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel12
  - number: '12.3'
    text: |-
      Opbrengsten met betrekking tot welke op de voet van het eerste lid belasting is ingehouden, worden voor de
      gerechtigde tot die opbrengsten gelijkgesteld met winstuitkeringen die voldoen aan de voorwaarden voor een
      vermindering op de voet van [artikel 11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002515#Artikel11
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002515
        artikel: '11'
        hoofdstuk: IV
  - number: '13'
    text: |-
      De inspecteur stelt, op verzoek van de inhoudingsplichtige, bij voor bezwaar vatbare beschikking vast hetgeen is
      gestort op de aandelen van een besloten vennootschap met beperkte aansprakelijkheid of een naamloze vennootschap,
      niet zijnde een beleggingsmaatschappij met veranderlijk kapitaal, alsmede het gemiddeld op de desbetreffende
      aandelen gestorte kapitaal. Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het
      verzoek.
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel13
  - number: '15'
    text: |-
      Bij het bepalen van hetgeen gemiddeld is gestort op bewijzen van deelgerechtigdheid in een fonds voor gemene
      rekening waarop met ingang van 1 januari 1970 de [Wet op de vennootschapsbelasting 1969][ref1] toepassing vindt,
      wordt het alsdan aanwezige vermogen aangemerkt als op dat tijdstip te zijn gestort. Tot dit vermogen worden niet
      gerekend na 1 januari 1968 behaalde en niet uitgekeerde voordelen, welke, zo zij vóór het eerstbedoelde tijdstip
      zouden zijn uitgekeerd aan niet tot het vermogen van een onderneming gerechtigde binnenlandse belastingplichtigen,
      als inkomsten uit vermogen zouden zijn aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002672
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002672
  - number: '16'
    text: |-
      [Artikel 3a, eerste lid][ref1], vindt geen toepassing met betrekking tot stortingen op aandelen die vóór 1 januari
      1946 hebben plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002515#Artikel3a
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002515
        artikel: 3a
        hoofdstuk: II
  - number: '17.1'
    text: Deze wet treedt in werking op 1 januari 1966.
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel17
  - number: '17.2'
    text: |-
      Deze wet kan worden aangehaald als: Wet op de dividendbelasting, met vermelding van het jaar, waarin zij in het
      *Staatsblad* wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0002515/2004-01-01#Artikel17
