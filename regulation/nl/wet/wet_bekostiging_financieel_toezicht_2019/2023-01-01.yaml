  - number: 8a
    text: |-
      1 De toezichthouder kan een reserve aanhouden die gevormd wordt uit de opbrengsten ontvangen uit dwangsommen of
      opgelegde bestuurlijke boetes tot een bij algemene maatregel van bestuur te bepalen maximum.

      2 Bij de vaststelling van de jaarrekening, bepaalt de toezichthouder het in dat jaar aan de reserve toe te rekenen
      bedrag met een maximum van € 4.500.000.

      3 De reserve heeft tot doel het dekken van incidentele kosten of andere kosten die tot onevenredig hoge tarieven
      voor bepaalde personen zouden leiden.

      4 De inzet van de reserve behoeft de toestemming van Onze Ministers.
    url: https://wetten.overheid.nl/BWBR0041548/2023-01-01#Artikel8a
  - number: '9'
    text: |-
      1 Het onthouden van de goedkeuring, bedoeld in
      [artikel 34, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref1], vindt niet plaats dan nadat de
      toezichthouder in de gelegenheid is gesteld de jaarrekening, onderscheidenlijk verantwoording, binnen een door Onze
      Ministers gezamenlijk te stellen redelijke termijn aan te passen.

      2 De toezichthouder doet na goedkeuring van de jaarrekening, onderscheidenlijk de verantwoording, onverwijld
      mededeling van die jaarrekening of verantwoording in de Staatscourant en houdt de jaarrekening of verantwoording
      gedurende ten minste vijf jaar na goedkeuring op elektronische wijze ter inzage.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel34
