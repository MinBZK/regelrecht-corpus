        artikel: '29'
  - number: '7'
    text: |-
      1 Bij de toepassing van de [artikelen 34][ref1] en [35 van de Kaderwet zelfstandige bestuursorganen][ref2] wordt
      het afleggen van rekening en verantwoording voor de uitvoering van de taken, bedoeld in [artikel 2][ref3], door de
      Nederlandsche Bank aangeduid als «verantwoording» in plaats van «jaarrekening».

      2 In afwijking van [artikel 35, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref4] gaat de
      jaarrekening van de Autoriteit Financiële Markten vergezeld van een verklaring omtrent de getrouwheid,
      afgegeven door een door de Autoriteit Financiële Markten aangewezen registeraccountant of Accountant-
      administratieconsulent ten aanzien van wie in het accountantsregister een aantekening is geplaatst als bedoeld
      in [artikel 36, tweede lid, onderdeel i, van de Wet op het accountantsberoep][ref5], die niet werkzaam is bij of
      verbonden is aan een accountantsorganisatie.

      3 De jaarrekening, onderscheidenlijk de verantwoording, behoeft de goedkeuring van de Raad van toezicht
      onderscheidenlijk de Raad van commissarissen, voordat deze bij Onze Ministers wordt ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel34
