preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de verdeling over de toezichtcategorieën van de
    vergoeding van de kosten van het toezicht van de Autoriteit Financiële Markten en de Nederlandsche Bank te herzien
    en daarbij de Wet bekostiging financieel toezicht opnieuw vast te stellen om de wettechnische vormgeving aan te
    passen zodat noodzakelijke aanpassingen tijdiger doorgevoerd kunnen worden;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0041548/2023-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *Autoriteit Financiële Markten:* Stichting Autoriteit Financiële Markten;
        - *de Nederlandsche Bank:* De Nederlandsche Bank N.V.;
        - *eenmalige handeling:* het behandelen van een aanvraag of melding, het behandelen van een verzoek tot het
      registreren van een persoon, het geven van een beschikking, of het verrichten van een vergelijkbare handeling met
      een eenmalig karakter ten behoeve van een persoon;
        - *onder toezicht staande persoon:* persoon die onder het toezicht van de toezichthouder valt;
        - *Onze Ministers:* Onze Minister van Financiën en Onze Minister van Sociale Zaken en Werkgelegenheid;
        - *persoon:* natuurlijke persoon, rechtspersoon of vennootschap, waaronder personenvennootschappen, of daarmee
      vergelijkbare lichamen of samenwerkingsverbanden;
        - *toezichthouder:* de Nederlandsche Bank of de Autoriteit Financiële Markten.
    url: https://wetten.overheid.nl/BWBR0041548/2023-01-01#Artikel1
  - number: '2'
    text: |-
      1 Deze wet is van toepassing op de bij of krachtens enige wet aan de Nederlandsche Bank en de Autoriteit
      Financiële Markten opgedragen taken en daaruit voortvloeiende werkzaamheden. Onder deze werkzaamheden valt ook de
      betrokkenheid van de toezichthouder bij de voorbereiding van nationale en internationale wet- en regelgeving.

      2 In afwijking van het eerste lid is deze wet voor de Nederlandsche Bank niet van toepassing op:

      a. de taken, bedoeld in de [artikelen 3][ref1] en
      [4, eerste lid, onderdelen b tot en met d, van de Bankwet 1998][ref2] en
      [artikel 4 van de Wet geldstelsel BES][ref3];

      b. het toezicht op afwikkelondernemingen, bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref4];

      c. de uitvoering en handhaving, bedoeld in [artikel 1:24, derde lid, van de Wet op het financieel toezicht][ref5],
      van regels gesteld bij of krachtens:

      1°. verordening (EU) nr. 260/2012 van het Europees Parlement en de Raad van 14 maart 2012 tot vaststelling van
      technische en bedrijfsmatige vereisten voor overmakingen en automatische afschrijvingen in euro en tot wijziging
      van [Verordening (EG) nr. 924/2009](32009R0924) (PbEU 2012 L 94);

      2°. de titels III, IV en V van verordening (EU) nr. 648/2012 van het Europees Parlement en de Raad van 4 juli 2012
      betreffende otc-derivaten, centrale tegenpartijen en transactieregisters (PbEU 2012, L 201);

      3°. [Verordening (EU) 2021/23](31923R2021) van het Europees Parlement en de Raad van 16 december 2020 betreffende
      een kader voor het herstel en de afwikkeling van centrale tegenpartijen en tot wijziging van de [Verordeningen (EU)
      nr. 1095/2010](32010R1095), [(EU) nr. 648/2012](32012R0648), [(EU) nr. 600/2014](32014R0600), [(EU) nr. 806/2014]
      (32014R0806) en [(EU) 2015/2365](32365R2015), en de [Richtlijnen 2002/47/EG](32002L0047), [2004/25/EG](32004L0025),
      [2007/36/EG](32007L0036), [2014/59](32014L0059)/EU en (EU) [2017/1132](32017L1132) (PbEU 2021, L 22);

      d. de taken op grond van de [Wet beveiliging netwerk- en informatiesystemen][ref6].


