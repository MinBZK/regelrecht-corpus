  - number: '8'
    text: |-
      1 De jaarrekening, onderscheidenlijk de verantwoording, bevatten een opgave van het over het desbetreffende jaar
      gerealiseerde exploitatiesaldo. Het saldo geeft het verschil aan tussen de gerealiseerde baten en lasten.

      2 Tot de in een jaar gerealiseerde baten worden mede gerekend de in dat jaar ontvangen opbrengsten uit verbeurde
      dwangsommen of opgelegde bestuurlijke boetes, met dien verstande dat, indien de beschikking waarbij de last
      onder dwangsom of de bestuurlijke boete is opgelegd nog niet onherroepelijk is, de uit een verbeurde dwangsom of
      opgelegde bestuurlijke boete ontvangen opbrengsten worden gerekend tot de gerealiseerde baten in het jaar waarin
      die beschikking onherroepelijk wordt.

      3 Bij algemene maatregel van bestuur wordt bepaald hoe de ontvangen opbrengsten uit verbeurde dwangsommen of
      opgelegde bestuurlijke boetes worden toegerekend aan de verschillende toezichtcategorieën.

      4 In de opgave, bedoeld in het eerste lid, wordt vastgelegd:

      a. het deel van het exploitatiesaldo dat is voortgekomen uit de uitvoering
      van de taken op grond van de [Wet financiële markten BES][ref1] en de
      [Wet ter voorkoming van witwassen en financieren van terrorisme BES][ref2];

      b. het deel van de opbrengsten ontvangen uit dwangsommen of opgelegde bestuurlijke boetes dat het bedrag van
      € 4.500.000 te boven gaat; en

      c. het deel van de opbrengsten ontvangen uit dwangsommen of opgelegde bestuurlijke boetes tot een bedrag van
      € 4.500.000 dat aan de reserve, bedoeld in [artikel 8a][ref3], wordt toegerekend.

      5 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels over de inrichting van de jaarrekening
      onderscheidenlijk verantwoording worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0030883
      [ref2]: https://wetten.overheid.nl/BWBR0030824
      [ref3]: https://wetten.overheid.nl/BWBR0041548#Artikel8a
    url: https://wetten.overheid.nl/BWBR0041548/2023-01-01#Artikel8
