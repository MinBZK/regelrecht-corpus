        artikel: '34'
  - number: '12'
    text: |-
      1 De toezichthouder organiseert tweemaal per jaar overleg met een daarvoor in aanmerking komende representatieve
      vertegenwoordiging van de onder zijn toezicht staande personen. De toezichthouder kan tevens daarvoor in aanmerking
      komende cliëntenorganisaties toelaten tot het overleg. Ambtenaren kunnen namens Onze Ministers het overleg
      bijwonen.

      2 De toezichthouder maakt het verslag van het overleg binnen een redelijke termijn na het overleg openbaar.
    url: https://wetten.overheid.nl/BWBR0041548/2023-01-01#Artikel12
  - number: 12a
    text: |-
      1 Op verzoek van een toezichthouder kunnen Onze Ministers toestemming geven om een exploitatiesaldo of een deel
      daarvan over meerdere jaren aan de onder toezicht staande personen in rekening te brengen.

      2 Toestemming wordt alleen gegeven in geval van een exploitatiesaldo dat is ontstaan door omstandigheden met een
      incidenteel karakter en waarbij doorberekening van dit exploitatiesaldo in één keer tot aanzienlijke fluctuaties in
      de kosten voor het doorlopend toezicht voor de onder toezicht staande personen zou leiden.

      3 Bij de toestemming bepalen Onze Ministers in overleg met de desbetreffende toezichthouder in welke jaren het
      bedrag van het exploitatiesaldo in rekening wordt gebracht bij de onder toezicht staande personen.
    url: https://wetten.overheid.nl/BWBR0041548/2023-01-01#Artikel12a
  - number: '13'
    text: |-
      1 De kosten van de toezichthouder voor de uitvoering van de taken, bedoeld in [artikel 2][ref1], worden ten laste
      gebracht van de onder toezicht staande personen en de personen voor wie de toezichthouder een eenmalige handeling
      verricht.

      2 De kosten worden bepaald en ten laste gebracht op basis van een systematiek met de volgende uitgangspunten:

      a. de kosten die ten laste worden gebracht, houden niet meer in dan die volgen uit de begroting van de
      toezichthouder, met inbegrip van het exploitatiesaldo van het daaraan voorafgaande jaar en het te spreiden deel van
      het exploitatiesaldo overeenkomstig [artikel 12a][ref2];

      b. zowel directe als indirecte kosten kunnen in rekening worden gebracht;

      c. de kosten van een eenmalige handeling worden ten laste gebracht aan de persoon voor wie die handeling is
      verricht; en

      d. de kosten voor de uitvoering van de taken in de openbare lichamen Bonaire, Sint-Eustatius en Saba worden niet op
      grond van deze wet in rekening gebracht, met uitzondering van de taken op grond van de Pensioenwet BES.


      [ref1]: https://wetten.overheid.nl/BWBR0041548#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0041548#Artikel12a
    url: https://wetten.overheid.nl/BWBR0041548/2023-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0041548
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
