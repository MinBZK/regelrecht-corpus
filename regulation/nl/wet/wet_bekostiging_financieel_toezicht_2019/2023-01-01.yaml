  - number: 16a
    text: |-
      Onze Minister van Financiën zendt in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid binnen
      vijf jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de doeltreffendheid en de
      effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0041548/2023-01-01#Artikel16a
  - number: '17'
    text: |-
      De [Wet bekostiging financieel toezicht][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0031659
    url: https://wetten.overheid.nl/BWBR0041548/2023-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0031659
  - number: '18'
    text: |-
      1 De [Wet bekostiging financieel toezicht][ref1], zoals die wet luidde op de dag voor de datum van inwerkingtreding
      van deze wet, blijft van toepassing op:

      a. de vergoeding van kosten van de toezichthouders voor het behandelen van aanvragen en meldingen die zijn
      ingediend voor het tijdstip van inwerkingtreding van deze wet en de vergoeding van de overige kosten in de jaren
      voorafgaand aan het jaar waarop deze wet in werking treedt alsmede op bestuursrechtelijke procedures die volgen uit
      het in rekening brengen van een vergoeding voor de inwerkingtreding van deze wet; en

      b. het afleggen van verantwoording door de toezichthouders over het jaar voorafgaand aan het jaar waarop deze wet
      in werking treedt.

      2 [Artikel 1:104, eerste lid, onderdeel m, van de Wet op het financieel toezicht][ref2] is van overeenkomstige
      toepassing op heffingen die verschuldigd zijn op grond van de [Wet bekostiging financieel toezicht][ref3].

      3 [Bijlage 2 bij de Algemene wet bestuursrecht][ref4], zoals die wet luidde op de dag voor de datum van
      inwerkingtreding van deze wet, blijft van toepassing op de verantwoording, bedoeld in het eerste lid, onderdeel b.

      4 In afwijking van [artikel 4, tweede lid][ref5], geldt voor de begroting van de Nederlandsche Bank voor het
      jaar 2020 dat het maximum van de begroting niet hoger is dan het kostenkader vermeerdert met de kosten voor de
      uitvoering van:

      a. de afwikkeling van banken en beleggingsondernemingen, bedoeld in
      [hoofdstuk 3A.1 van de Wet op het financieel toezicht][ref6], en Verordening (EU) nr. 806/2014 van het Europees
      parlement en de Raad van 15 juli 2014 tot vaststelling van eenvormige regels en een eenvormige procedure voor de
      afwikkeling van kredietinstellingen en bepaalde beleggingsondernemingen in het kader van een gemeenschappelijk
      afwikkelingsmechanisme en een gemeenschappelijk bankenafwikkelingsfonds en tot wijziging van Verordening (EU) nr.
      1093/2010 van het Europees parlement en de Raad (PbEU 2014, L 225);

      b. de afwikkeling van verzekeraars, bedoeld in [hoofdstuk 3A.2 van de Wet op het financieel toezicht][ref7];

      c. het depositogarantiestelsel, bedoeld in [afdeling 3.5.6 van de Wet op het financieel toezicht][ref8];

      d. het depositogarantiestelsel, bedoeld in [artikel 4:17 van de Wet financiële markten BES][ref9].


