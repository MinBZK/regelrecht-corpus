        artikel: 12a
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '14'
    text: |-
      1 Een persoon is de toezichthouder een vergoeding verschuldigd voor het verrichten van een eenmalige handeling.

      2 Bij regeling van Onze Ministers, ieder voor diens beleidsverantwoordelijkheid, worden de eenmalige handelingen
      waar een vergoeding voor verschuldigd is en de kosten daarvoor of de wijze waarop deze kosten worden berekend
      vastgesteld. Bij die regeling kunnen tevens regels worden gesteld over de wijze en het moment waarop de kosten in
      rekening worden gebracht.
    url: https://wetten.overheid.nl/BWBR0041548/2023-01-01#Artikel14
  - number: '15'
    text: |-
      1 De toezichthouder brengt jaarlijks bij een onder toezicht staande persoon een bedrag voor de kosten van het
      toezicht in rekening.

      2 De totale kosten van het toezicht die in enig jaar in rekening worden gebracht, bedragen de som van:

      a. het totaal van de begrote kosten voor het desbetreffende jaar met uitzondering van de begrote kosten voor:

      1°. eenmalige handelingen;

      2°. de uitvoering van de taken in de openbare lichamen Bonaire, Sint-Eustatius en Saba, met uitzondering van de
      taken op grond van de Pensioenwet BES;

      b. het exploitatiesaldo over het voorafgaande jaar, verminderd met:

      1°. het deel van het exploitatiesaldo, bedoeld in [artikel 8, vierde lid, onderdeel a][ref1];

      2°. het deel dat aan de reserve is toegerekend, bedoeld in [artikel 8, vierde lid, onderdeel c][ref2];

      3°. het deel van het exploitatiesaldo waarvoor overeenkomstig [artikel 12a][ref3] toestemming is gegeven dit over
      meerdere jaren in rekening te brengen, tenzij een overschot wordt gespreid, dan wordt dit bedrag hierbij opgeteld;

      4°. de aan de Staat toekomende opbrengsten, bedoeld in [artikel 11][ref4];

      c. met aftrek van de inzet in het desbetreffende jaar van de reserve, bedoeld in [artikel 8a][ref5];

      d. het bedrag dat overeenkomstig [artikel 12a][ref6] in het desbetreffende jaar in rekening wordt gebracht.

      3 Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de personen die, gelet op de aard en
      omvang van het toezicht, voor de toepassing van deze wet worden aangemerkt als onder toezicht staand alsmede over
      de indeling van deze personen in categorieën.

      4 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de systematiek op basis waarvan
      de totale kosten over de categorieën onder toezicht staande personen worden verdeeld en de berekening van de kosten
      per onder toezicht staande persoon.

      5 Bij algemene maatregel van bestuur worden tevens regels gesteld over:

      a. de hoogte van de kosten voor het doorlopend toezicht indien een onder toezicht staande persoon slechts een
      deel van het kalenderjaar onder het toezicht van een toezichthouder valt, waarbij een minimumbedrag kan worden
      vastgesteld waaronder geen kosten in rekening worden gebracht of geen terugbetaling plaats vindt; en

      b. het in rekening brengen van de kosten indien sprake is van fusie, collectieve waardeoverdracht of indien een
      onder toezicht staande persoon in afwikkeling wordt geplaatst en vermogen overgaat.

      6 De voordracht voor een krachtens het vierde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.


