        artikel: '18'
  - number: '11'
    text: |-
      1 Voor zover de tot de gerealiseerde baten in een jaar te rekenen opbrengsten uit dwangsommen of bestuurlijke
      boetes het bedrag van € 4.500.000 te boven gaan, komen die opbrengsten toe aan de Staat.

      2 De toezichthouder draagt het aan de Staat verschuldigde bedrag af, zodra het besluit tot
      vaststelling van de desbetreffende jaarrekening, onderscheidenlijk verantwoording, overeenkomstig
      [artikel 34, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref1] is goedgekeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel34
    url: https://wetten.overheid.nl/BWBR0041548/2023-01-01#Artikel11
