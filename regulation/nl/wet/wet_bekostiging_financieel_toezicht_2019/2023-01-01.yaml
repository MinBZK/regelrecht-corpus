  - number: '6'
    text: |-
      1 Het onthouden van de goedkeuring, bedoeld in
      [artikel 29, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref1], vindt niet plaats dan nadat de
      toezichthouder in de gelegenheid is gesteld de begroting binnen een door Onze Ministers gezamenlijk te stellen
      redelijke termijn aan te passen.

      2 De toezichthouder doet na goedkeuring van de begroting onverwijld mededeling van de begroting in de Staatscourant
      en houdt de begroting gedurende ten minste twee jaar na goedkeuring op elektronische wijze ter inzage.

      3 Indien de begroting niet is goedgekeurd voor 1 januari van het begrotingsjaar waarop zij betrekking heeft, kan de
      toezichthouder, zolang de begroting niet is goedgekeurd, voor het aangaan van verplichtingen en het verrichten van
      uitgaven beschikken over ten hoogste vier twaalfde gedeelten van de bedragen die bij de overeenkomstige onderdelen
      van de begroting van het voorafgaande jaar waren toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel29
    url: https://wetten.overheid.nl/BWBR0041548/2023-01-01#Artikel6
    references:
