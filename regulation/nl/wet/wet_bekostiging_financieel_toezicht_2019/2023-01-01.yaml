  - number: '3'
    text: |-
      De toezichthouder zendt de begroting, bedoeld in [artikel 26 van de Kaderwet zelfstandige bestuursorganen][ref1],
      jaarlijks voor 1 december aan Onze Ministers.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel26
    url: https://wetten.overheid.nl/BWBR0041548/2023-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '26'
  - number: '4'
    text: |-
      1 Onze Ministers stellen voor de begroting van de toezichthouders een kader op. De totale hoogte van het kader is
      in enig jaar niet hoger dan het maximum in het kader van het daaraan voorafgaande jaar met daarbij opgeteld:

      a. loon- of prijsmutatie;

      b. de naar kosten herleide mutaties in het takenpakket van de toezichthouder.

      2 De begroting van de toezichthouder is in enig jaar niet hoger dan het maximum dat volgt uit het voor het
      desbetreffende begrotingsjaar vastgestelde kader.

      3 Onze Ministers informeren beide kamers der Staten-Generaal tijdig:

      a. voorafgaand aan de vaststelling van een kostenkader;

      b. voorafgaand aan de wijziging van een kostenkader;

      c. bij overschrijding van een kostenkader door een toezichthouder.

      4 Onze Ministers kunnen in bijzondere omstandigheden afwijken van dit artikel en informeren de beide kamers der
      Staten-Generaal hier tijdig over.
    url: https://wetten.overheid.nl/BWBR0041548/2023-01-01#Artikel4
  - number: '5'
    text: |-
      1 Voor de toepassing van [artikel 27, vierde lid, van de Kaderwet zelfstandige bestuursorganen][ref1] wordt met
      betrekking tot de begroting van de Nederlandsche Bank voor «laatst goedgekeurde jaarrekening» gelezen: laatst
      goedgekeurde verantwoording als bedoeld in [artikel 8][ref2] van de Wet bekostiging financieel toezicht 2019.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels over de inrichting van de begroting worden
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0041548#Artikel8
