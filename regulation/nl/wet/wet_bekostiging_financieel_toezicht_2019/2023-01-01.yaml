  - number: '16'
    text: |-
      1 De toezichthouder kan aan de betrokken financiële onderneming een bedrag in rekening brengen
      ter vergoeding van de kosten die hij maakt voor de toepassing van de [artikelen 1:76][ref1] en
      [1:76a van de Wet op het financieel toezicht][ref2].

      2 De hoogte van het bedrag, bedoeld in het eerste lid, wordt per geval vastgesteld door de toezichthouder en is
      gebaseerd op de voor het toezicht op de desbetreffende financiële onderneming werkelijk gemaakte kosten.


