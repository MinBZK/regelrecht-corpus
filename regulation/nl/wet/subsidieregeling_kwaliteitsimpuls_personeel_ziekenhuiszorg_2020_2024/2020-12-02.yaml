  - number: '7'
    text: |-
      1 Het subsidieplafond bedraagt voor het subsidiejaar 2020 voor de ziekenhuizen en de klinieken € 165.311.000.

      2 Het subsidieplafond bedraagt voor het subsidiejaar 2020 voor de universitair medische centra € 40.450.000.
    url: https://wetten.overheid.nl/BWBR0042731/2020-12-02#Artikel7
  - number: '8'
    text: |-
      1 In geval van overschrijding van het subsidieplafond wordt het uit hoofde van het subsidieplafond beschikbare
      bedrag voor de ziekenhuizen en de klinieken verdeeld en krijgt het organisatorisch verband in eerste instantie het
      aangevraagde bedrag toegewezen tot het maximum van de formule

      (A / B) * C = D, waarbij wordt verstaan onder:

      A: de Zvw-omzet van het tweede jaar voorafgaand aan het subsidiejaar van het organisatorisch verband ten behoeve
      waarvan de subsidie wordt verstrekt;

      B: de som van de Zvw-omzet van het tweede jaar voorafgaand aan het subsidiejaar van alle organisatorische verbanden
      ten behoeve waarvan subsidie wordt verstrekt;

      C: het uit hoofde van het subsidieplafond beschikbare bedrag;

      D: het maximum bedrag van de subsidie voor het organisatorische verband.

      2 Indien na toepassing van bovenstaande formule het subsidieplafond niet volledig wordt benut, wordt het resterende
      bedrag verdeeld over de instellingen waarvan het aangevraagde bedrag hoger is dan de uitkomst van de formule,
      bedoeld in het eerste lid.

      3 Bij een verdeling als bedoeld in het tweede lid, geldt de volgende formule (A / E) * F = G, waarbij wordt
      verstaan onder:

      A: de Zvw-omzet van het tweede jaar voorafgaand aan het subsidiejaar van het organisatorisch verband ten behoeve
      waarvan de subsidie wordt verstrekt;

      E: de som van de Zvw-omzet van het tweede jaar voorafgaand aan het subsidiejaar van alle organisatorische verbanden
      die vallen onder de instellingen waarvan het aangevraagde bedrag hoger is dan de uitkomst van de formule onder het
      eerste lid;

      F: het uit hoofde van het subsidieplafond resterende beschikbare bedrag;

      G: het aanvullende beschikbare subsidiebedrag voor het organisatorische verband.

      4 De systematiek beschreven in het tweede en derde lid wordt repeterend toegepast totdat het volledige
      subsidieplafond is bereikt.

      5 De minister kan afwijken van de Zvw-omzet, bedoeld in [artikel 1][ref1], voor zover toepassing hiervan zal leiden
      tot een onbillijkheid van overwegende aard.


      [ref1]: https://wetten.overheid.nl/BWBR0042731#Artikel1
