  - number: '10'
    text: |-
      De minister kan afwijken van de definitie van activiteitenverslag, genoemd in [artikel 1][ref1], en besluiten dat
      ter verantwoording kan worden volstaan met een activiteitenverslag dat met een werknemersvertegenwoordiging is
      afgestemd indien instemming met het activiteitenverslag wegens zwaar moverende redenen niet mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0042731#Artikel1
    url: https://wetten.overheid.nl/BWBR0042731/2020-12-02#Artikel10
