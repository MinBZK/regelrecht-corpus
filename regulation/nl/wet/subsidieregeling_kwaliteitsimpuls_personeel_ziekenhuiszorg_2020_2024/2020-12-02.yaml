  - number: '3'
    text: |-
      1 De minister kan in de periode van 2020 tot en met 2022 aan een instelling een subsidie
      verstrekken ten behoeve van een organisatorisch verband met een toelating als bedoeld in
      [artikel 5 van de Wet toelating zorginstellingen][ref1] voor het verlenen van zorg waarop aanspraak bestaat
      ingevolge een zorgverzekering als bedoeld in [artikel 1, onderdeel d, van de Zorgverzekeringswet][ref2].

      2 In afwijking van het eerste lid wordt geen subsidie verstrekt ten behoeve van een organisatorisch verband dat in
      het kader van de [Zorgverzekeringswet][ref3] uitsluitend geneeskundige geestelijke gezondheidszorg verleent.

      3 Geen subsidie wordt verstrekt voor onderwijs waarvoor onderwijsinstellingen reeds financiering
      ontvangen krachtens de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref4] of op grond van de
      [Wet Educatie en Beroepsonderwijs][ref5].


