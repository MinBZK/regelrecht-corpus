  - number: '2'
    text: |-
      Op deze regeling zijn de definities van het activiteitenverslag, het financieel verslag,
      de verklaring inzake werkelijke kosten en opbrengsten, instelling en minister, bedoeld in
      [artikel 1.1 van de Kaderregeling subsidies OCW, SZW en VWS][ref1], niet van toepassing.
      [Artikel 7.2, eerste lid, onder b][ref2], [artikel 7.5, tweede lid, onder b][ref3] en
      [artikel 10.1 van deze Kaderregeling][ref4] zijn evenmin van toepassing.


