  - number: '9'
    text: |-
      1 Het uit hoofde van het subsidieplafond beschikbare bedrag voor de universitair medische centra wordt op dezelfde
      wijze verdeeld als bedoeld in [artikel 8, eerste tot en met vierde lid][ref1].

      2 In afwijking van [artikel 8, eerste lid][ref2], wordt voor de universitair medische centra verstaan onder:

      A: de personeelskosten van het organisatorisch verband ten behoeve waarvan de subsidie wordt verstrekt, van het
      tweede jaar voorafgaand aan het subsidiejaar;

      B: de som van de personeelskosten van alle organisatorische verbanden ten behoeve waarvan subsidie wordt verstrekt.

      3 In afwijking van [artikel 8, derde lid][ref3], wordt voor de universitair medische centra verstaan onder:

      A: de personeelskosten van het organisatorisch verband ten behoeve waarvan de subsidie wordt verstrekt, van het
      tweede jaar voorafgaand aan het subsidiejaar;

      E: de som van de personeelskosten van alle organisatorische verbanden die vallen onder de instellingen waarvan het
      aangevraagde bedrag hoger is dan de uitkomst van de formule zoals vermeld in [artikel 8, eerste lid][ref4].

      4 De personeelskosten, bedoeld in het tweede lid onder A, en het derde lid, onder A, bestaan uit de som van
      de volgende onderdelen van de bedrijfslasten van het desbetreffende organisatorisch verband in het tweede jaar
      voorafgaand aan het subsidiejaar:

      1° lonen en salarissen;

      2° sociale lasten;

      3° pensioenpremies.


