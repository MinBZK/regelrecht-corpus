preamble:
  text: |-
    Gelet op de artikelen 3 en 5 van de Kaderwet VWS-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0042731/2020-12-02#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *activiteitenverslag:* een verslag waar een werknemersvertegenwoordiging mee heeft ingestemd en waarvan de
      opbouw overeenkomt met de opbouw van het jaarplan, behorend bij het strategisch opleidingsplan en dat: a. een
      overzicht bevat van het gerealiseerde jaarplan waarvoor subsidie is verstrekt; b. de aard, omvang, duur en wijze
      van uitvoering beschrijft van het gerealiseerde jaarplan waarvoor subsidie is verstrekt; c. de met het jaarplan
      gerealiseerde doelstellingen, resultaten of producten beschrijft; d. voor zover van toepassing, beschrijft
      in hoeverre is voldaan aan de aan de subsidie verbonden verplichtingen, en e. voor zover van toepassing, een
      vergelijking bevat van het gerealiseerde jaarplan met het voorgenomen jaarplan en een toelichting op de verschillen
      geeft.
        - *financieel verslag:* een verslag dat a. volgens normen die in het maatschappelijk verkeer als aanvaardbaar
      worden beschouwd, een zodanig inzicht geeft dat een verantwoord oordeel kan worden gevormd omtrent de kosten
      en opbrengsten van het gerealiseerde jaarplan waarvoor de subsidie is verleend; b. aansluit bij de begroting en
      de nodige informatie geeft om de subsidie vast te stellen; c. per post is voorzien van een toelichting, en d.
      vergezeld gaat van een beoordelingsverklaring, opgesteld door een accountant overeenkomstig een door de minister
      vastgesteld model met inachtneming van een door de minister vastgesteld accountantsprotocol, bekend gemaakt op de
      website www.dusi.nl/subidies/verbeteren-kwaliteit.
        - *geneeskundige geestelijke gezondheidszorg:* zorg zoals psychiaters en klinisch-psychologen die plegen te bieden,
      en de eerstelijnspsychologische zorg;
        - *instelling:* privaatrechtelijke rechtspersoon met volledige rechtsbevoegdheid of een rechtspersoon krachtens
      publiekrecht ingesteld, die een organisatorisch verband in stand houdt;
        - *jaarplan:* een overzicht van het geheel van opleidingsactiviteiten voor het subsidiejaar, uit te voeren door
      een instelling, ten behoeve van personen werkzaam voor de instelling dat dient als concrete uitwerking van het
      strategisch opleidingsplan en waarmee de werknemersvertegenwoordiging heeft ingestemd;
        - *jaarrekening:* jaarrekening als bedoeld in [artikel 361 van Boek 2 van het Burgerlijk Wetboek][ref1];
        - *minister:* Minister voor Medische Zorg;
        - *opleidingsactiviteiten:* activiteiten ten behoeve van opleiden, leren en ontwikkelen;
        - *operationele kosten:* kosten bedoeld in [artikel 5, vierde lid, onder b, en c][ref2];
        - *organisatorisch verband:* organisatorisch verband voor medisch specialistische zorg, bedoeld in
      [artikel 1.2, onder 1, van het Uitvoeringsbesluit WTZi][ref3] of de audiologische centra, bedoeld in artikel 1.2,
      onder 2, van dat besluit;
        - *personeelskosten:* kosten, bedoeld in [artikel 5, vierde lid onder a en d][ref4], bestaande uit de som van de
      volgende onderdelen, 1°. lonen en salarissen; 2°. sociale lasten; 3°. Pensioenpremies.
        - *strategisch opleidingsplan:* een met een werknemersvertegenwoordiging afgestemd actueel strategisch
      opleidingsplan waarin in ieder geval de inhoudelijke prioriteiten wat betreft het opleiden van personeel zijn
      opgenomen;
        - *subsidiejaar:* kalenderjaar ten behoeve waarvan de subsidie wordt verstrekt;
        - *verklaring inzake werkelijke kosten en opbrengsten:* de verklaring waarin de subsidieontvanger aantoont: a.
      dat het jaarplan waarvoor de subsidie is verstrekt is voorzien van een korte toelichting, b. dat aan de verleende
      subsidie verbonden verplichtingen is voldaan, c. wat het totale bedrag is van de gerealiseerde kosten van de
      opleidingsactiviteiten waarvoor de subsidie is verleend en die werkelijk verricht zijn.
        - *Zvw-omzet:* som van de volgende onderdelen van de bedrijfsopbrengsten van het organisatorisch
      verband die met het verlenen van zorg in het kader van de [Zorgverzekeringswet][ref5] in het tweede
      jaar voorafgaand aan het subsidiejaar zijn behaald zoals deze zijn verantwoord in de jaarrekening over
      dat jaar: 1°. Beschikbaarheidbijdragen Zorg; 2°. Beschikbaarheidbijdragen Opleidingen; 3°. Opbrengsten
      [Zorgverzekeringswet][ref6].


