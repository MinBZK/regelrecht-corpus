  - number: '5'
    text: |-
      1 De subsidiabele kosten bestaan uit personeelskosten en operationele kosten.

      2 Voor de personeelskosten wordt gerekend met een standaard uurtarief dat € 42,24 bedraagt voor de ziekenhuizen, en
      € 47,66 voor de universitair medische centra. Voor de operationele kosten wordt gerekend met een opslag van 30% op
      dat standaard uurtarief.

      3 In afwijking van het tweede lid kan de aanvrager kiezen voor een aanvraag op basis van de werkelijke kosten.

      4 De kosten gemoeid met de activiteiten, bedoeld in [artikel 4, eerste lid][ref1], komen in aanmerking voor
      subsidie indien het een van de volgende kostencategorieën betreft:

      a. personeelskosten van de opleiders, voor de uren dat de opleiders aan de opleidingsactiviteiten deelnemen;

      b. rechtstreeks met het jaarplan verband houdende operationele kosten van opleiders en deelnemers aan de
      opleidingsactiviteiten, zoals reiskosten, materiaal en benodigdheden die rechtstreeks met het project verband
      houden, de afschrijving van werktuigen en uitrusting voor zover deze uitsluitend voor het opleidingsproject worden
      gebruikt;

      c. kosten van adviesdiensten met betrekking tot het opleidingsproject;

      d. de personeelskosten van de deelnemers aan de opleiding en algemene indirecte kosten voor de uren dat de
      deelnemers de opleiding bijwonen.

      5 Accommodatie- en verblijfskosten komen niet in aanmerking voor subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0042731#Artikel4
    url: https://wetten.overheid.nl/BWBR0042731/2020-12-02#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0042731
        artikel: '4'
  - number: '6'
    text: |-
      1 In afwijking van [artikel 3.3 van de Kaderregeling subsidies OCW, SZW en VWS][ref1] gaat de aanvraag vergezeld
      van:

      a. een strategisch opleidingsplan;

      b. een jaarplan met bijbehorende begroting;

      c. een verklaring van een werknemersvertegenwoordiging waaruit blijkt dat deze met de documenten, genoemd onder b,
      heeft ingestemd;

      d. een jaarrekening van het tweede jaar voorafgaand aan het subsidiejaar.

      2 Voor de aanvraag wordt een door de minister vastgesteld formulier gebruikt.

      3 De aanvraag wordt ondertekend door een persoon die bevoegd is de instelling te vertegenwoordigen.

      4 De subsidieaanvraag voor het subsidiejaar 2021 wordt uiterlijk 17 december 2020 om 23.59 uur ontvangen en de
      subsidieaanvraag voor het subsidiejaar 2022 wordt uiterlijk 16 december 2021 om 23.59 uur ontvangen.

      5 Een aanvraag die na de termijn, bedoeld in het vierde lid, wordt ontvangen, wordt afgewezen.

      6 Op verzoek van de minister legt de instelling een afschrift van de oprichtingsakte van de rechtspersoon dan wel
      van de statuten zoals deze laatstelijk zijn gewijzigd over.

      7 De subsidie wordt voorts in ieder geval geweigerd indien de aanvrager failliet is verklaard of aan hem surséance
      van betaling is verleend of ten aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is
      verklaard, dan wel een verzoek daartoe bij de rechtbank is ingediend.

      8 Alleen wanneer instemming, bedoeld in het eerste lid, onder c, wegens zwaar moverende redenen niet mogelijk
      is, kan de minister besluiten dat kan worden volstaan met een jaarplan dat met een werknemersvertegenwoordiging
      is afgestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0037603#Artikel3.3
