        artikel: '1'
  - number: '11'
    text: |-
      1 De subsidieontvanger meldt schriftelijk aan de minister indien aannemelijk is geworden dat meer dan 15% van het
      verleende subsidiebedrag niet kan worden besteed.

      2 De melding wordt voorzien van een toelichting. Bij de melding worden de relevante stukken overgelegd.
    url: https://wetten.overheid.nl/BWBR0042731/2020-12-02#Artikel11
  - number: '12'
    text: |-
      De minister kan gedurende het subsidiejaar het besluit tot subsidieverlening ambtshalve wijzigen in verband met de
      ontwikkeling in de arbeidsvoorwaarden.
    url: https://wetten.overheid.nl/BWBR0042731/2020-12-02#Artikel12
  - number: '13'
    text: |-
      De minister kan bij de verstrekking van de subsidie verplichtingen opleggen als bedoeld in [artikel 4:38][ref1] en
      [4:39 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel438
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel439
