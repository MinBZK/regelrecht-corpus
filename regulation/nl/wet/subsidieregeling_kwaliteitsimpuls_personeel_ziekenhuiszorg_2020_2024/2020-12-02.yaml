  - number: '4'
    text: |-
      1 De subsidie wordt uitsluitend verstrekt ten behoeve van opleidingsactiviteiten die passen binnen het jaarplan.

      2 In afwijking van het eerste lid wordt geen subsidie verstrekt voor activiteiten ten behoeve van:

      a. opleidingen waarvoor de Nederlandse Zorgautoriteit op grond van
      [artikel 56a van de Wet marktordening gezondheidszorg][ref1] een beschikbaarheidbijdrage kan verstrekken met
      inachtneming van de beleidsregels, bedoeld in [artikel 57, eerste lid, onderdeel e, van die wet][ref2];

      b. opleidingen waarvoor de minister op grond van de Subsidieregeling stageplaatsen zorg II een subsidie kan
      verstrekken;

      c. opleidingen waarvoor de minister op grond van de Subsidieregeling opleiding tot advanced nurse practitioner en
      opleiding tot physician assistant een subsidie kan verstrekken;

      d. opleidingen waarvoor de minister op grond van de subsidieregeling SectorplanPlus een subsidie heeft verstrekt
      ten behoeve van een instelling;

      e. andere opleidingen waarvoor de instelling een subsidie of een andere financiële bijdrage van de overheid
      ontvangt of kan ontvangen.

      3 De opleidingsactiviteiten, bedoeld in het eerste lid, zijn subsidiabel voor zover zij worden verricht in het
      subsidiejaar waarvoor de subsidie wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel56a
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel57
