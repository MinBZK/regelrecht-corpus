  - number: '2'
    text: |-
      Op deze regeling zijn de definities van het activiteitenverslag, het financieel verslag,
      de verklaring inzake werkelijke kosten en opbrengsten, instelling en minister, bedoeld in
      [artikel 1.1 van de Kaderregeling subsidies OCW, SZW en VWS][ref1], niet van toepassing. [Artikel 3.3][ref2],
      [artikel 7.5, tweede lid][ref3] en [artikel 10.1 van deze Kaderregeling][ref4] zijn evenmin van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037603#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0037603#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037603#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0037603#Artikel10
