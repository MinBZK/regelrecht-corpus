  - number: '3.1'
    text: |-
      De Minister kan in de subsidiejaren 2020 tot en met 2024 op aanvraag aan een instelling ten behoeve van een
      organisatorisch verband subsidie verstrekken voor het opleiden en ontwikkelen van zorgpersoneel.
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel3
  - number: '3.2'
    text: |-
      In afwijking van het eerste lid wordt geen subsidie verstrekt ten behoeve van een organisatorisch verband dat in
      het kader van de [Zorgverzekeringswet][ref1] uitsluitend geneeskundige geestelijke gezondheidszorg verleent.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: '3.3'
    text: |-
      Geen subsidie wordt verstrekt voor onderwijs waarvoor onderwijsinstellingen reeds financiering ontvangen
      krachtens de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] of op grond van de
      [Wet Educatie en Beroepsonderwijs][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005682
      - id: ref2
        bwb_id: BWBR0007625
  - number: '4.1'
    text: De subsidie wordt uitsluitend verstrekt ten behoeve van opleidingsactiviteiten die passen binnen het jaarplan.
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel4
  - number: '4.2'
    text: 'In afwijking van het eerste lid wordt geen subsidie verstrekt voor activiteiten ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel4
  - number: 4.2.a
    text: |-
      opleidingen waarvoor de Nederlandse Zorgautoriteit op grond van
      [artikel 56a van de Wet marktordening gezondheidszorg][ref1] een beschikbaarheidbijdrage kan verstrekken met
      inachtneming van de beleidsregels, bedoeld in [artikel 57, eerste lid, onderdeel e, van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel56a
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel57
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: 56a
      - id: ref2
        bwb_id: BWBR0020078
        artikel: '57'
  - number: 4.2.b
    text: |-
      opleidingen waarvoor de minister op grond van de Subsidieregeling stageplaatsen zorg II een subsidie kan
      verstrekken;
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel4
  - number: 4.2.c
    text: |-
      opleidingen waarvoor de minister op grond van de Subsidieregeling opleiding tot advanced nurse practitioner en
      opleiding tot physician assistant een subsidie kan verstrekken;
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel4
  - number: 4.2.d
    text: |-
      opleidingen waarvoor de minister op grond van de subsidieregeling SectorplanPlus een subsidie heeft verstrekt ten
      behoeve van een instelling.
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel4
  - number: '4.3'
    text: |-
      De opleidingsactiviteiten, bedoeld in het eerste lid, zijn subsidiabel voor zover zij worden verricht in het
      subsidiejaar waarvoor de subsidie wordt verleend.
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel4
  - number: '5.1'
    text: De subsidiabele kosten bestaan uit personeelskosten en operationele kosten.
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel5
  - number: '5.2'
    text: |-
      Voor de personeelskosten ten behoeve van het subsidiejaar 2024 wordt gerekend met een standaard uurtarief dat
      € 49,96 bedraagt voor de instellingen niet zijnde een universitair medisch centrum en € 57,30 voor de universitair
      medische centra. Voor de operationele kosten wordt gerekend met een opslag van 30% op dat standaard uurtarief.
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel5
  - number: '5.3'
    text: In afwijking van het tweede lid kan de aanvrager kiezen voor een aanvraag op basis van de werkelijke kosten.
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel5
  - number: '5.4'
    text: |-
      De kosten gemoeid met de activiteiten, bedoeld in [artikel 4, eerste lid][ref1], komen in aanmerking voor subsidie
      indien het een van de volgende kostencategorieën betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0042731#Artikel4
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0042731
        artikel: '4'
  - number: 5.4.a
    text: personeelskosten van de opleiders, voor de uren dat de opleiders aan de opleidingsactiviteiten deelnemen;
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel5
  - number: 5.4.b
    text: |-
      rechtstreeks met het jaarplan verband houdende operationele kosten van opleiders en deelnemers aan de
      opleidingsactiviteiten, zoals reiskosten, materiaal en benodigdheden die rechtstreeks met het project verband
      houden, de afschrijving van werktuigen en uitrusting voor zover deze uitsluitend voor het opleidingsproject worden
      gebruikt;
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel5
  - number: 5.4.c
    text: kosten van adviesdiensten met betrekking tot het opleidingsproject;
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel5
  - number: 5.4.d
    text: |-
      de personeelskosten van de deelnemers aan de opleiding en algemene indirecte kosten voor de uren dat de deelnemers
      de opleiding bijwonen.
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel5
  - number: '5.5'
    text: Accommodatie- en verblijfskosten komen niet in aanmerking voor subsidie.
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel5
  - number: '6.1'
    text: |-
      In afwijking van [artikel 3.3 van de Kaderregeling subsidies OCW, SZW en VWS][ref1] gaat de aanvraag vergezeld van:


      [ref1]: https://wetten.overheid.nl/BWBR0037603#Artikel3
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0037603
        artikel: '3'
  - number: 6.1.a
    text: een strategisch opleidingsplan;
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel6
  - number: 6.1.b
    text: een jaarplan met bijbehorende begroting;
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel6
  - number: 6.1.c
    text: |-
      een verklaring van een werknemersvertegenwoordiging waaruit blijkt dat deze met de documenten, genoemd onder b,
      heeft ingestemd;
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel6
  - number: 6.1.d
    text: een jaarrekening van het tweede jaar voorafgaand aan het subsidiejaar.
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel6
  - number: '6.2'
    text: |-
      Voor de aanvraag, het jaarplan met bijbehorende begroting en de verklaring van een werknemersvertegenwoordiging
      wordt een door de minister vastgesteld formulier gebruikt.
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel6
  - number: '6.3'
    text: De aanvraag wordt ondertekend door een persoon die bevoegd is de instelling te vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel6
  - number: '6.4'
    text: De subsidieaanvraag voor het subsidiejaar 2024 wordt uiterlijk 29 december 2023 om 16:00 uur ontvangen.
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel6
  - number: '6.5'
    text: Een aanvraag die na de termijn, bedoeld in het vierde lid, wordt ontvangen, wordt afgewezen.
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel6
  - number: '6.6'
    text: |-
      Op verzoek van de minister legt de instelling een afschrift van de oprichtingsakte van de rechtspersoon dan wel van
      de statuten zoals deze laatstelijk zijn gewijzigd over.
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel6
  - number: '6.7'
    text: |-
      De subsidie wordt voorts in ieder geval geweigerd indien de aanvrager failliet is verklaard of aan hem surséance
      van betaling is verleend of ten aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is
      verklaard, dan wel een verzoek daartoe bij de rechtbank is ingediend.
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel6
  - number: '6.8'
    text: |-
      Alleen wanneer instemming, bedoeld in het eerste lid, onder c, wegens zwaar moverende redenen niet mogelijk is,
      kan de minister besluiten dat kan worden volstaan met een jaarplan dat met een werknemersvertegenwoordiging is
      afgestemd.
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel6
  - number: '7.1'
    text: |-
      Het subsidieplafond bedraagt voor het subsidiejaar 2020 voor de instellingen niet zijnde universitair medische
      centra € 165.311.000.
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel7
  - number: '7.2'
    text: Het subsidieplafond bedraagt voor het subsidiejaar 2020 voor de universitair medische centra € 40.450.000.
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel7
  - number: '7.3'
    text: |-
      Het subsidieplafond bedraagt voor het subsidiejaar 2022 voor de instellingen niet zijnde universitair medische
      centra € 173.908.599.
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel7
  - number: '7.4'
    text: Het subsidieplafond bedraagt voor het subsidiejaar 2022 voor de universitair medische centra € 42.553.749.
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel7
  - number: '7.5'
    text: |-
      Het subsidieplafond bedraagt voor het subsidiejaar 2023 voor de instellingen niet zijnde universitair medische
      centra € 182.757.069.
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel7
  - number: '7.6'
    text: Het subsidieplafond bedraagt voor het subsidiejaar 2023 voor de universitair medische centra € 44.718.884.
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel7
  - number: '7.7'
    text: |-
      Het subsidieplafond bedraagt voor het subsidiejaar 2024 voor instellingen niet zijnde universitair medische centra
      € 191.530.374.
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel7
  - number: '7.8'
    text: Het subsidieplafond bedraagt voor het subsidiejaar 2024 voor universitair medische centra € 46.865.626.
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel7
  - number: '8.1'
    text: |-
      In geval van overschrijding van het subsidieplafond wordt het uit hoofde van het subsidieplafond beschikbare bedrag
      instellingen niet zijnde universitair medische centra verdeeld en krijgt het organisatorisch verband ten behoeve
      waarvan de subsidie wordt verstrekt in eerste instantie het aangevraagde bedrag verleend tot het maximum van de
      formule (A / B) * C = D, waarbij wordt verstaan onder:
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel8
  - number: '8.1.A:'
    text: |-
      de Zvw-omzet van het tweede jaar voorafgaand aan het subsidiejaar van het organisatorisch verband ten behoeve
      waarvan de subsidie wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel8
  - number: '8.1.B:'
    text: |-
      de som van de Zvw-omzet van het tweede jaar voorafgaand aan het subsidiejaar van alle organisatorische verbanden
      ten behoeve waarvan subsidie wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel8
  - number: '8.1.C:'
    text: het uit hoofde van het subsidieplafond beschikbare bedrag;
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel8
  - number: '8.1.D:'
    text: het maximum bedrag van de subsidie voor het organisatorische verband.
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel8
  - number: '8.2'
    text: |-
      Indien na toepassing van bovenstaande formule het subsidieplafond niet volledig wordt benut, wordt het resterende
      bedrag verdeeld over de instellingen waarvan het aangevraagde bedrag hoger is dan de uitkomst van de formule,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel8
  - number: '8.3'
    text: |-
      Bij een verdeling als bedoeld in het tweede lid, geldt de volgende formule (A / E) * F = G, waarbij wordt verstaan
      onder:
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel8
  - number: '8.3.A:'
    text: |-
      de Zvw-omzet van het tweede jaar voorafgaand aan het subsidiejaar van het organisatorisch verband ten behoeve
      waarvan de subsidie wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel8
  - number: '8.3.E:'
    text: |-
      de som van de Zvw-omzet van het tweede jaar voorafgaand aan het subsidiejaar van alle organisatorische verbanden
      die vallen onder de instellingen waarvan het aangevraagde bedrag hoger is dan de uitkomst van de formule onder het
      eerste lid;
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel8
  - number: '8.3.F:'
    text: het uit hoofde van het subsidieplafond resterende beschikbare bedrag;
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel8
  - number: '8.3.G:'
    text: het aanvullende beschikbare subsidiebedrag voor het organisatorische verband.
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel8
  - number: '8.4'
    text: |-
      De systematiek beschreven in het tweede en derde lid wordt repeterend toegepast totdat het volledige
      subsidieplafond is bereikt.
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel8
  - number: '8.5'
    text: |-
      De minister kan afwijken van de Zvw-omzet, bedoeld in [artikel 1][ref1], voor zover toepassing hiervan zal leiden
      tot een onbillijkheid van overwegende aard.


      [ref1]: https://wetten.overheid.nl/BWBR0042731#Artikel1
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0042731
        artikel: '1'
  - number: '9.1'
    text: |-
      Het uit hoofde van het subsidieplafond beschikbare bedrag voor de universitair medische centra wordt op dezelfde
      wijze verdeeld als bedoeld in [artikel 8, eerste tot en met vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0042731#Artikel8
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0042731
        artikel: '8'
  - number: '9.2'
    text: |-
      In afwijking van [artikel 8, eerste lid][ref1], wordt voor de universitair medische centra verstaan onder:


      [ref1]: https://wetten.overheid.nl/BWBR0042731#Artikel8
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0042731
        artikel: '8'
  - number: '9.2.A:'
    text: |-
      de personeelskosten van het organisatorisch verband ten behoeve waarvan de subsidie wordt verstrekt, van het tweede
      jaar voorafgaand aan het subsidiejaar;
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel9
  - number: '9.2.B:'
    text: |-
      de som van de personeelskosten van het tweede jaar voorafgaand aan het subsidiejaar van alle organisatorische
      verbanden ten behoeve waarvan subsidie wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel9
  - number: '9.3'
    text: |-
      In afwijking van [artikel 8, derde lid][ref1], wordt voor de universitair medische centra verstaan onder:


      [ref1]: https://wetten.overheid.nl/BWBR0042731#Artikel8
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0042731
        artikel: '8'
  - number: '9.3.A:'
    text: |-
      de personeelskosten van het organisatorisch verband ten behoeve waarvan de subsidie wordt verstrekt, van het tweede
      jaar voorafgaand aan het subsidiejaar;
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel9
  - number: '9.3.E:'
    text: |-
      de som van de personeelskosten van het tweede jaar voorafgaand aan het subsidiejaar van alle organisatorische
      verbanden die vallen onder de instellingen waarvan het aangevraagde bedrag hoger is dan de uitkomst van de formule
      zoals vermeld in [artikel 8, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0042731#Artikel8
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0042731
        artikel: '8'
  - number: '9.4'
    text: |-
      De personeelskosten, bedoeld in het tweede lid onder A, en het derde lid, onder A, bestaan uit de som van de
      volgende onderdelen van de bedrijfslasten van het desbetreffende organisatorisch verband in het tweede jaar
      voorafgaand aan het subsidiejaar:
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel9
  - number: 9.4.1
    text: lonen en salarissen;
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel9
  - number: 9.4.2
    text: sociale lasten;
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel9
  - number: 9.4.3
    text: pensioenpremies;
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel9
  - number: 9.4.4
    text: andere personeelskosten.
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel9
  - number: '10'
    text: |-
      De minister kan afwijken van de definitie van activiteitenverslag, genoemd in [artikel 1][ref1], en besluiten dat
      ter verantwoording kan worden volstaan met een activiteitenverslag dat met een werknemersvertegenwoordiging is
      afgestemd indien instemming met het activiteitenverslag wegens zwaar moverende redenen niet mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0042731#Artikel1
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0042731
        artikel: '1'
  - number: '11.1'
    text: |-
      De subsidieontvanger meldt schriftelijk aan de minister indien aannemelijk is geworden dat meer dan 15% van het
      verleende subsidiebedrag niet kan worden besteed.
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel11
  - number: '11.2'
    text: De melding wordt voorzien van een toelichting. Bij de melding worden de relevante stukken overgelegd.
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel11
  - number: '12'
    text: |-
      De minister kan gedurende het subsidiejaar het besluit tot subsidieverlening ambtshalve wijzigen in verband met de
      ontwikkeling in de arbeidsvoorwaarden.
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel12
  - number: '13'
    text: |-
      De minister kan bij de verstrekking van de subsidie verplichtingen opleggen als bedoeld in [artikel 4:38][ref1] en
      [4:39 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 13a
    text: |-
      De minister kan een of meer bepalingen van deze regeling buiten toepassing laten of daarvan afwijken voor
      zover toepassing gelet op het belang dat de desbetreffende bepaling beoogt te beschermen, zal leiden tot een
      onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel13a
  - number: '14'
    text: Deze regeling treedt in werking met ingang van 1 januari 2020 en vervalt met ingang van 1 januari 2026.
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel14
  - number: '15'
    text: 'Deze regeling wordt aangehaald als: Subsidieregeling kwaliteitsimpuls personeel ziekenhuiszorg 2020 – 2024.'
    url: https://wetten.overheid.nl/BWBR0042731/2025-07-09#Artikel15
