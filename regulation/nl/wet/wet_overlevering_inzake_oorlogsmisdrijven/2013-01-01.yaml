  - number: '2'
    text: De overlevering aan een andere staat kan slechts geschieden, indien deze partij is bij het geschonden verdrag.
    url: https://wetten.overheid.nl/BWBR0002134/2013-01-01#Artikel2
  - number: '3'
    text: |-
      1 Personen van wie de overlevering overeenkomstig [artikel 1][ref1] door een andere staat wordt verzocht, kunnen,
      voor zover zij zich niet reeds in verzekerde bewaring bevinden, worden aangehouden.

      2 Het bevel van aanhouding moet hun binnen tweemaal vierentwintig uren worden betekend.

      3 De op en bij hen zijnde voorwerpen kunnen worden in beslag genomen.

      4 Binnen vierentwintig uren na de aanhouding wordt daarvan kennis gegeven aan de officier van justitie bij het
      arrondissementsparket Den Haag.

      5 Het vierde lid blijft buiten toepassing indien de aanhouding in de openbare lichamen Bonaire, Sint Eustatius
      en Saba heeft plaatsgevonden. In dat geval wordt de officier van justitie bij het arrondissementsparket Amsterdam
      binnen vierentwintig uren na de aanhouding daarvan kennis gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002134#Artikel1
    url: https://wetten.overheid.nl/BWBR0002134/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002134
        artikel: '1'
  - number: '4'
    text: |-
      1 Alvorens over een verzoek tot overlevering te beslissen, wordt het advies ingewonnen van de rechtbank Den Haag.

      2 De rechtbank beslist bij zijn advies, welke van de in beslag genomen voorwerpen, in geval van overlevering, aan
      de opgeëiste persoon zullen worden teruggegeven, en welke, als stukken van overtuiging, zullen worden afgegeven.

      3 Overlevering vindt in geen geval plaats, indien de rechtbank adviseert de overlevering niet toe te staan.

      4 Voor de toepassing van de voorgaande leden treedt de rechtbank Amsterdam in de plaats van het Gerecht in eerste
      aanleg van Bonaire, Sint Eustatius en Saba, indien dat gerecht bevoegd is tot kennisneming van het misdrijf, ter
      zake waarvan de overlevering is aangevraagd.
    url: https://wetten.overheid.nl/BWBR0002134/2013-01-01#Artikel4
  - number: '5'
    text: |-
      1 Onze Minister van Veiligheid en Justitie kan toestemming verlenen tot het over Nederlands grondgebied vervoeren
      van een persoon wiens overlevering ter zake van één van de in [artikel 1][ref1] genoemde misdrijven door een andere
      staat aan een derde staat is toegestaan.

      2 Indien het vervoer plaatsvindt ten behoeve van overlevering aan een derde staat, geldt de voorwaarde dat de
      toestemming alleen kan worden gegeven indien die derde staat partij is bij het geschonden verdrag.

      3 Onder Nederlands grondgebied wordt mede verstaan het grondgebied van de openbare lichamen Bonaire, Sint Eustatius
      en Saba.


