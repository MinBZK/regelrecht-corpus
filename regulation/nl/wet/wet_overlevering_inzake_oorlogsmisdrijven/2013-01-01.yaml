preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in verband met de op 12 Augustus 1949 voor ondertekening
    opengestelde Verdragen van Genève onderscheidenlijk voor de verbetering van het lot der gewonden en zieken,
    zich bevindende bij de strijdkrachten te velde, voor de verbetering van het lot der gewonden, zieken en
    schipbreukelingen van de strijdkrachten ter zee, betreffende de behandeling van krijgsgevangenen, en betreffende de
    bescherming van burgers in oorlogstijd, wenselijk is een wettelijke voorziening te treffen met betrekking tot het
    aan andere Mogendheden ter berechting overleveren van personen, die verdacht worden van oorlogsmisdrijven;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002134/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Deze wet is mede van toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba.

      2 Onverminderd het bepaalde in met andere staten gesloten verdragen, kunnen personen aan een andere staat worden
      overgeleverd ter zake van één van de misdrijven omschreven in de [Wet internationale misdrijven][ref1], indien het
      feit een schending oplevert van:

      a. het op 9 december 1948 te Parijs tot stand gekomen Verdrag inzake de voorkoming en de bestraffing van genocide
      (Trb. 1960, 32);

      b. het op 12 augustus 1949 te Genève tot stand gekomen Verdrag van Genève voor de verbetering van het lot der
      gewonden en zieken, zich bevindende bij de strijdkrachten te velde (Trb. 1951, 72);

      c. het op 12 augustus 1949 te Genève tot stand gekomen Verdrag van Genève voor de verbetering van het lot der
      gewonden, zieken en schipbreukelingen van de strijdkrachten ter zee (Trb. 1951, 73);

      d. het op 12 augustus 1949 te Genève tot stand gekomen Verdrag van Genève betreffende de behandeling van
      krijgsgevangenen (Trb. 1951, 74);

      e. het op 12 augustus 1949 te Genève tot stand gekomen Verdrag van Genève betreffende de bescherming van burgers in
      oorlogstijd (Trb. 1951, 75);

      f. het op 8 juni 1977 te Bern tot stand gekomen Aanvullend Protocol bij de Verdragen van Genève van 12 augustus
      1949 betreffende de bescherming van de slachtoffers van internationale gewapende conflicten (Protocol I) (Trb.
      1980, 87);

      g. het op 8 juni 1977 te Bern tot stand gekomen Aanvullend Protocol bij de Verdragen van Genève van 12 augustus
      1949 betreffende de bescherming van de slachtoffers van niet-internationale gewapende conflicten (Protocol II)
      (Trb. 1980, 88);

      h. het op 10 december 1984 te New York tot stand gekomen Verdrag tegen foltering en andere wrede, onmenselijke of
      onterende behandeling of bestraffing (Trb. 1985, 69);

      i. het op 26 maart 1999 te ’s-Gravenhage tot stand gekomen Tweede Protocol bij het Haagse Verdrag van 1954 inzake
      de bescherming van culturele goederen in geval van een gewapend conflict van 26 maart 1999 (Trb. 1999, 107);

      j. het op 10 december 2006 te New York tot stand gekomen Internationaal Verdrag inzake de bescherming van alle
      personen tegen gedwongen verdwijning (Trb. 2008, 173).


      [ref1]: https://wetten.overheid.nl/BWBR0015252
    url: https://wetten.overheid.nl/BWBR0002134/2013-01-01#Artikel1
