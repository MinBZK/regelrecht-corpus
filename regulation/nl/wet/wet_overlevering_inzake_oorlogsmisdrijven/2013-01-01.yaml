  - number: '8'
    text: |-
      Het aan andere Mogendheden ter berechting overleveren van personen, die verdacht worden van oorlogsmisdrijven,
      wordt voor Aruba, Curaçao en Sint Maarten zoveel mogelijk in overeenstemming met deze wet geregeld bij algemene
      maatregel van rijksbestuur.
    url: https://wetten.overheid.nl/BWBR0002134/2013-01-01#Artikel8
  - number: '9'
    text: |-
      1 Deze wet kan worden aangehaald als "Wet overlevering inzake oorlogsmisdrijven".

      2 Zij treedt in werking op een nader door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002134/2013-01-01#Artikel9
