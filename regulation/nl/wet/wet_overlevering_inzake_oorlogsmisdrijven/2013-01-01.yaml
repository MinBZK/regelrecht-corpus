  - number: '7'
    text: |-
      1 De aanvraag tot overlevering betreffende een persoon die zich bevindt in de openbare
      lichamen Bonaire, Sint Eustatius en Saba die voor het tijdstip van transitie, bedoeld in
      [artikel 1, onder a, van de Invoeringswet openbare lichamen Bonaire, Sint Eustatius en Saba][ref1], is ingediend
      en waarover op dat tijdstip nog niet is beslist, wordt behandeld door het vanaf dat tijdstip bevoegde orgaan en
      afgehandeld met inachtneming van de bepalingen van deze wet.

      2 De persoon, bedoeld in het eerste lid, die voor het tijdstip van transitie, bedoeld in
      [artikel 1, onder a, van de Invoeringswet openbare lichamen Bonaire, Sint Eustatius en Saba][ref2], met het oog
      op overlevering gedetineerd is, wordt beschouwd als iemand die krachtens deze wet in bewaring wordt gehouden of in
      verzekering is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028063#Artikel1
