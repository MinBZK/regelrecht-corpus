  - number: '6'
    text: |-
      De [artikelen 4][ref1], [5][ref2], [8 tot en met 10][ref3], [12 tot en met 47][ref4] en
      [51 tot en met 60 van de Uitleveringswet][ref5] zijn van overeenkomstige toepassing, met dien verstande dat
      de voorlopige aanhouding ook kan worden bevolen in gevallen waarin de mogelijkheid daartoe niet bij verdrag is
      voorzien.


