$id: wet_overlevering_inzake_oorlogsmisdrijven
regulatory_layer: WET
publication_date: '2012-07-13'
valid_from: '2003-10-01'
bwb_id: BWBR0002134
url: https://wetten.overheid.nl/BWBR0002134/2003-10-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in verband met de op 12 Augustus 1949 voor ondertekening
    opengestelde Verdragen van Genève onderscheidenlijk voor de verbetering van het lot der gewonden en zieken,
    zich bevindende bij de strijdkrachten te velde, voor de verbetering van het lot der gewonden, zieken en
    schipbreukelingen van de strijdkrachten ter zee, betreffende de behandeling van krijgsgevangenen, en betreffende de
    bescherming van burgers in oorlogstijd, wenselijk is een wettelijke voorziening te treffen met betrekking tot het
    aan andere Mogendheden ter berechting overleveren van personen, die verdacht worden van oorlogsmisdrijven;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002134/2003-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Onverminderd het bepaalde in met andere Mogendheden gesloten uitleveringsverdragen, kunnen personen aan
      een andere Mogendheid ter berechting worden overgeleverd ter zake van één der misdrijven, omschreven in de
      [artikelen 3][ref1], [5 tot en met 8][ref2] en, voor zover met de in die artikelen bedoelde feiten verband houdend,
      [artikel 9 van de Wet internationale misdrijven][ref3], indien het feit een ernstige schending oplevert van één der
      navolgende Verdragen van Genève van 12 augustus 1949:


      [ref1]: https://wetten.overheid.nl/BWBR0002134#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002134#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0015252#Artikel9
    url: https://wetten.overheid.nl/BWBR0002134/2003-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002134
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002134
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0015252
        artikel: '9'
  - number: 1.a
    text: Verdrag voor de verbetering van het lot der gewonden en zieken, zich bevindende bij de strijdkrachten te velde;
    url: https://wetten.overheid.nl/BWBR0002134/2003-10-01#Artikel1
  - number: 1.b
    text: Verdrag voor de verbetering van het lot der gewonden, zieken en schipbreukelingen van de strijdkrachten ter zee;
    url: https://wetten.overheid.nl/BWBR0002134/2003-10-01#Artikel1
  - number: 1.c
    text: Verdrag betreffende de behandeling van krijgsgevangenen;
    url: https://wetten.overheid.nl/BWBR0002134/2003-10-01#Artikel1
  - number: 1.d
    text: Verdrag betreffende de bescherming van burgers in oorlogstijd;
    url: https://wetten.overheid.nl/BWBR0002134/2003-10-01#Artikel1
  - number: '2'
    text: De overlevering kan slechts aan een andere Mogendheid geschieden, indien deze partij is bij het geschonden Verdrag.
    url: https://wetten.overheid.nl/BWBR0002134/2003-10-01#Artikel2
  - number: '3.1'
    text: Voor zover door Ons niet anders wordt bepaald, wordt de overlevering aangevraagd langs diplomatieke weg.
    url: https://wetten.overheid.nl/BWBR0002134/2003-10-01#Artikel3
  - number: '3.2'
    text: |-
      Zij wordt slechts toegestaan, indien de andere Mogendheid een met voldoende bewijzen gestaafde telastlegging welke
      een vervolging rechtvaardigt, inbrengt.
    url: https://wetten.overheid.nl/BWBR0002134/2003-10-01#Artikel3
  - number: '4.1'
    text: |-
      Personen, wier overlevering overeenkomstig [artikel 1][ref1] door een andere Mogendheid wordt aangevraagd, kunnen,
      voor zover zij zich niet reeds in verzekerde bewaring bevinden, worden aangehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0002134#Artikel1
    url: https://wetten.overheid.nl/BWBR0002134/2003-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002134
        artikel: '1'
  - number: '4.2'
    text: Het bevel van aanhouding moet hun binnen tweemaal vier en twintig uren worden betekend.
    url: https://wetten.overheid.nl/BWBR0002134/2003-10-01#Artikel4
  - number: '4.3'
    text: De op en bij hen zijnde goederen kunnen worden in beslag genomen.
    url: https://wetten.overheid.nl/BWBR0002134/2003-10-01#Artikel4
  - number: '4.4'
    text: |-
      Binnen vier en twintig uren na de aanhouding wordt daarvan kennis gegeven aan het openbaar ministerie bij het
      gerecht, dat bevoegd is tot kennisneming van het misdrijf, ter zake waarvan de overlevering is aangevraagd.
    url: https://wetten.overheid.nl/BWBR0002134/2003-10-01#Artikel4
  - number: '5.1'
    text: |-
      Alvorens over een aanvrage tot overlevering te beslissen, wordt het advies ingewonnen van het gerecht, dat bevoegd
      is tot kennisneming van het misdrijf, ter zake waarvan de overlevering is aangevraagd.
    url: https://wetten.overheid.nl/BWBR0002134/2003-10-01#Artikel5
  - number: '5.2'
    text: |-
      Het gerecht beslist bij zijn advies, welke der in beslag genomen goederen, in geval van overlevering, aan de
      opgeëiste persoon zullen worden teruggegeven, en welke, als stukken van overtuiging, zullen worden afgegeven.
    url: https://wetten.overheid.nl/BWBR0002134/2003-10-01#Artikel5
  - number: '5.3'
    text: Overlevering vindt in geen geval plaats, indien het gerecht adviseert de overlevering niet toe te staan.
    url: https://wetten.overheid.nl/BWBR0002134/2003-10-01#Artikel5
  - number: '6'
    text: |-
      De Regering kan vergunnen, dat een vreemdeling, wiens overlevering ter zake van een ernstige schending van één der
      in [artikel 1][ref1] genoemde Verdragen door een andere Mogendheid aan een derde Mogendheid is toegestaan, over het
      Nederlands grondgebied onder medegeleide van Nederlandse ambtenaren wordt vervoerd, mits de Mogendheid aan welke de
      overlevering geschiedt, partij is bij het geschonden Verdrag.


      [ref1]: https://wetten.overheid.nl/BWBR0002134#Artikel1
    url: https://wetten.overheid.nl/BWBR0002134/2003-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002134
        artikel: '1'
  - number: '7'
    text: |-
      De artikelen 9, 10, 12-17, 20-40, 46, 47 en 51-60 van de [Uitleveringswet][ref1] zijn van overeenkomstige
      toepassing, zulks met dien verstande dat de voorlopige aanhouding ook kan worden bevolen in gevallen waarin de
      mogelijkheid daartoe niet bij verdrag is voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0002559
    url: https://wetten.overheid.nl/BWBR0002134/2003-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002559
  - number: '8'
    text: |-
      Het aan andere Mogendheden ter berechting overleveren van personen, die verdacht worden van oorlogsmisdrijven,
      wordt voor de Nederlandse Antillen en Aruba zoveel mogelijk in overeenstemming met deze wet geregeld bij algemene
      maatregel van rijksbestuur.
    url: https://wetten.overheid.nl/BWBR0002134/2003-10-01#Artikel8
  - number: '9.1'
    text: Deze wet kan worden aangehaald als "Wet overlevering inzake oorlogsmisdrijven".
    url: https://wetten.overheid.nl/BWBR0002134/2003-10-01#Artikel9
  - number: '9.2'
    text: Zij treedt in werking op een nader door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002134/2003-10-01#Artikel9
