  - number: '2'
    text: De overlevering kan slechts aan een andere Mogendheid geschieden, indien deze partij is bij het geschonden Verdrag.
    url: https://wetten.overheid.nl/BWBR0002134/2010-10-10#Artikel2
  - number: '3'
    text: |-
      1 Voor zover door Ons niet anders wordt bepaald, wordt de overlevering aangevraagd langs diplomatieke weg.

      2 Zij wordt slechts toegestaan, indien de andere Mogendheid een met voldoende bewijzen gestaafde telastlegging
      welke een vervolging rechtvaardigt, inbrengt.
    url: https://wetten.overheid.nl/BWBR0002134/2010-10-10#Artikel3
  - number: '4'
    text: |-
      1 Personen, wier overlevering overeenkomstig [artikel 1][ref1] door een andere Mogendheid wordt aangevraagd,
      kunnen, voor zover zij zich niet reeds in verzekerde bewaring bevinden, worden aangehouden.

      2 Het bevel van aanhouding moet hun binnen tweemaal vier en twintig uren worden betekend.

      3 De op en bij hen zijnde goederen kunnen worden in beslag genomen.

      4 Binnen vier en twintig uren na de aanhouding wordt daarvan kennis gegeven aan het openbaar ministerie bij het
      gerecht, dat bevoegd is tot kennisneming van het misdrijf, ter zake waarvan de overlevering is aangevraagd.

      5 Het vierde lid blijft buiten toepassing indien de aanhouding in de openbare lichamen Bonaire, Sint Eustatius en
      Saba heeft plaatsgevonden. In dat geval wordt de officier van justitie bij het arrondissementsparket te Amsterdam
      binnen vierentwintig uur na de aanhouding daarvan kennis gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002134#Artikel1
    url: https://wetten.overheid.nl/BWBR0002134/2010-10-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002134
        artikel: '1'
  - number: '5'
    text: |-
      1 Alvorens over een aanvrage tot overlevering te beslissen, wordt het advies ingewonnen van het gerecht, dat
      bevoegd is tot kennisneming van het misdrijf, ter zake waarvan de overlevering is aangevraagd.

      2 Het gerecht beslist bij zijn advies, welke der in beslag genomen goederen, in geval van overlevering, aan de
      opgeëiste persoon zullen worden teruggegeven, en welke, als stukken van overtuiging, zullen worden afgegeven.

      3 Overlevering vindt in geen geval plaats, indien het gerecht adviseert de overlevering niet toe te staan.

      4 Voor de toepassing van de voorgaande leden treedt de rechtbank te Amsterdam in de plaats van het Gerecht in
      eerste aanleg van Bonaire, Sint Eustatius en Saba, indien dat gerecht bevoegd is tot kennisneming van het misdrijf,
      ter zake waarvan de overlevering is aangevraagd.
    url: https://wetten.overheid.nl/BWBR0002134/2010-10-10#Artikel5
  - number: '6'
    text: |-
      1 De Regering kan vergunnen, dat een vreemdeling, wiens overlevering ter zake van een ernstige schending van één
      der in [artikel 1][ref1] genoemde Verdragen door een andere Mogendheid aan een derde Mogendheid is toegestaan,
      over het Nederlands grondgebied onder medegeleide van Nederlandse ambtenaren wordt vervoerd, mits de Mogendheid aan
      welke de overlevering geschiedt, partij is bij het geschonden Verdrag.

      2 Onder Nederlands grondgebied wordt mede verstaan het grondgebied van de openbare lichamen Bonaire, Sint Eustatius
      en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0002134#Artikel1
    url: https://wetten.overheid.nl/BWBR0002134/2010-10-10#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002134
        artikel: '1'
  - number: '7'
    text: |-
      De artikelen 9, 10, 12-17, 20-40, 46, 47 en 51-60 van de [Uitleveringswet][ref1] zijn van overeenkomstige
      toepassing, zulks met dien verstande dat de voorlopige aanhouding ook kan worden bevolen in gevallen waarin de
      mogelijkheid daartoe niet bij verdrag is voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0002559
    url: https://wetten.overheid.nl/BWBR0002134/2010-10-10#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002559
  - number: '8'
    text: |-
      Het aan andere Mogendheden ter berechting overleveren van personen, die verdacht worden van oorlogsmisdrijven,
      wordt voor Aruba, Curaçao en Sint Maarten zoveel mogelijk in overeenstemming met deze wet geregeld bij algemene
      maatregel van rijksbestuur.
    url: https://wetten.overheid.nl/BWBR0002134/2010-10-10#Artikel8
  - number: 8a
    text: |-
      1 De aanvraag tot overlevering betreffende een persoon die zich bevindt in de openbare
      lichamen Bonaire, Sint Eustatius en Saba die voor het tijdstip van transitie, bedoeld in
      [artikel 1, onder a, van de Invoeringswet openbare lichamen Bonaire, Sint Eustatius en Saba][ref1], is ingediend
      en waarover op dat tijdstip nog niet is beslist, wordt behandeld door het vanaf dat tijdstip bevoegde orgaan en
      afgehandeld met inachtneming van de bepalingen van deze wet.

      2 De persoon, bedoeld in het eerste lid, die voor het tijdstip van transitie, bedoeld in
      [artikel 1, onder a, van de Invoeringswet openbare lichamen Bonaire, Sint Eustatius en Saba][ref2], met het oog
      op overlevering gedetineerd is, wordt beschouwd als iemand die krachtens deze wet in bewaring wordt gehouden of in
      verzekering is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028063#Artikel1
    url: https://wetten.overheid.nl/BWBR0002134/2010-10-10#Artikel8a
    references:
