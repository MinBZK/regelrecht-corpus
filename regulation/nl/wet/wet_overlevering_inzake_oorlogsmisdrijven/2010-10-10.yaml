preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in verband met de op 12 Augustus 1949 voor ondertekening
    opengestelde Verdragen van Genève onderscheidenlijk voor de verbetering van het lot der gewonden en zieken,
    zich bevindende bij de strijdkrachten te velde, voor de verbetering van het lot der gewonden, zieken en
    schipbreukelingen van de strijdkrachten ter zee, betreffende de behandeling van krijgsgevangenen, en betreffende de
    bescherming van burgers in oorlogstijd, wenselijk is een wettelijke voorziening te treffen met betrekking tot het
    aan andere Mogendheden ter berechting overleveren van personen, die verdacht worden van oorlogsmisdrijven;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002134/2010-10-10#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Deze wet is mede van toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba.

      2 Onverminderd het bepaalde in met andere Mogendheden gesloten uitleveringsverdragen, kunnen personen aan
      een andere Mogendheid ter berechting worden overgeleverd ter zake van één der misdrijven, omschreven in de
      [artikelen 3][ref1], [5 tot en met 8][ref2] en, voor zover met de in die artikelen bedoelde feiten verband houdend,
      [artikel 9 van de Wet internationale misdrijven][ref3], indien het feit een ernstige schending oplevert van:

      a. het Verdrag van Genève van 12 augustus 1949 voor de verbetering van het lot der gewonden en zieken, zich
      bevindende bij de strijdkrachten te velde;

      b. het Verdrag van Genève van 12 augustus 1949 voor de verbetering van het lot der gewonden, zieken en
      schipbreukelingen van de strijdkrachten ter zee;

      c. het Verdrag van Genève van 12 augustus 1949 betreffende de behandeling van krijgsgevangenen;

      d. het Verdrag van Genève van 12 augustus 1949 betreffende de bescherming van burgers in oorlogstijd;

      e. het Aanvullend Protocol bij die Verdragen betreffende de bescherming van de slachtoffers van internationale
      gewapende conflicten (Protocol I) van 12 december 1977; of

      f. het Tweede Protocol bij het Haagse Verdrag van 1954 inzake de bescherming van culturele goederen in geval van
      een gewapend conflict van 26 maart 1999.


      [ref1]: https://wetten.overheid.nl/BWBR0002134#Artikel3
