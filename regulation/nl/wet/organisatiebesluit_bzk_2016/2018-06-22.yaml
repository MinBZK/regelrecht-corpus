---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: organisatiebesluit_bzk_2016
regulatory_layer: WET
publication_date: '2018-09-04'
valid_from: '2018-06-22'
bwb_id: BWBR0038547
url: https://wetten.overheid.nl/BWBR0038547/2018-06-22
preamble:
  text: |-
    Gelet op artikel 3, tweede lid, van het Coördinatiebesluit organisatie en bedrijfsvoering rijksdienst 2011;

    besluit

    vast te stellen het navolgende Organisatiebesluit:
  url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel1
  - number: 1.a
    text: '*ministerie:* ministerie van Binnenlandse Zaken en Koninkrijksrelaties;'
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel1
  - number: 1.b
    text: '*Minister:* de Minister van Binnenlandse Zaken en Koninkrijksrelaties;'
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel1
  - number: 1.c
    text: |-
      *capaciteitsplan:* schriftelijk stuk waarin de uitwerking van de flexibele organisatiestructuur van een
      dienstonderdeel wordt vastgelegd evenals de verdeling van de formatie binnen deze structuur;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel1
  - number: 1.d
    text: |-
      *SG-Cluster:* de directies Concernondersteuning, Koninkrijksrelaties, Financieel-economische Zaken, Constitutionele
      Zaken en Wetgeving, de staf van de Chief Information Officer BZK en BZK Flex en het programma directoraat-generaal
      Wederopbouw Bovenwindse eilanden;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel1
  - number: 1.e
    text: |-
      *BZK Kerndepartement:* de directoraten-generaal Bestuur en Wonen en Overheidsorganisatie, met uitzondering van de
      agentschappen Logius en de Rijksdienst voor Identiteitsgegevens en het SG-Cluster.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel1
  - number: '2.1'
    text: 'De hoofdstructuur van het ministerie bestaat uit de volgende dienstonderdelen:'
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel2
  - number: 2.1.a
    text: de Algemene Leiding (ALGL);
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel2
  - number: 2.1.b
    text: het directoraat-generaal Bestuur en Wonen (DGBW);
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel2
  - number: 2.1.c
    text: het agentschap Dienst van de Huurcommissie (DHC);
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel2
  - number: 2.1.d
    text: het directoraat-generaal Overheidsorganisatie (DGOO);
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel2
  - number: 2.1.e
    text: het Bureau Algemene Bestuursdienst (BABD);
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel2
  - number: 2.1.f
    text: het directoraat-generaal Vastgoed en Bedrijfsvoering Rijk (DGVBR);
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel2
  - number: 2.1.g
    text: de Algemene Inlichtingen- en Veiligheidsdienst (AIVD);
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel2
  - number: 2.1.h
    text: het SG-Cluster (SGC);
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel2
  - number: 2.1.i
    text: het Bureau Digitale Overheid (BDO).
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel2
  - number: '2.2'
    text: |-
      De dienstonderdelen bestaan uit organisatieonderdelen waarvan de inrichting nader kan worden beschreven op een
      wijze als bedoeld in [artikel 20, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0038547#Artikel20
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0038547
        artikel: '20'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '2.3'
    text: |-
      De secretaris-generaal geeft rechtstreeks leiding aan de leidinggevende functionarissen van de dienstonderdelen,
      genoemd in het eerste lid, met uitzondering van het agentschap Dienst Huurcommissie dat ressorteert onder het
      bestuur van de Huurcommissie en het Bureau Digitale Overheid dat ressorteert onder de Nationaal Commissaris
      Digitale Overheid.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel2
  - number: '3.1'
    text: Er is een Bestuursraad Binnenlandse Zaken en Koninkrijksrelaties (BR).
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel3
  - number: '3.2'
    text: |-
      De Bestuursraad is samengesteld uit de secretaris-generaal, de directeuren-generaal Bestuur en Wonen,
      Overheidsorganisatie, Bureau Algemene Bestuursdienst, Vastgoed en Bedrijfsvoering Rijk en de Algemene Inlichtingen-
      en Veiligheidsdienst en de directeur Concernondersteuning. De leden kunnen zich incidenteel laten vervangen
      door hun plaatsvervangers of, in uitzonderlijke gevallen, door een andere rechtstreeks onder hen ressorterende
      functionaris. De directeur Financieel-economische Zaken, de directeur Constitutionele Zaken en Wetgeving en de
      Chief Information Officer BZK hebben een permanente uitnodiging tot het als adviseur bijwonen van de Bestuursraad.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel3
  - number: '3.3'
    text: |-
      Het overleg in de Bestuursraad heeft, onverminderd het bepaalde in de departementale mandaat- en volmachtbesluiten
      over de bevoegdheden van de afzonderlijke leden van de Bestuursraad ten aanzien van de onderwerpen die in het
      overleg aan de orde komen, ten doel het bespreken en het bereiken van overeenstemming over de departementale
      beleids- en beheerskaders en het toezien op de uitvoering van deze kaders.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel3
  - number: '3.4'
    text: |-
      De Bestuursraad heeft tevens tot doel het bespreken en het bereiken van overeenstemming over aspecten van het
      departementale personeelsbeleid en personele aangelegenheden alsmede het toezien op de uitvoering hiervan. In het
      overleg komen in ieder geval de volgende aangelegenheden aan de orde:
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel3
  - number: 3.4.a
    text: de ontwikkeling van het departementale HRM-beleid in brede zin;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel3
  - number: 3.4.b
    text: de beleidsontwikkeling van management-development bij het ministerie;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel3
  - number: 3.4.c
    text: de benoeming van kandidaten bij het ministerie in vacatures die behoren tot de MD-doelgroep;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel3
  - number: 3.4.d
    text: |-
      de werkzaamheden van de Bestuursraad met betrekking tot de personeelsschouw, zoals aangegeven in het departementale
      beleid ter zake.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel3
  - number: '3.5'
    text: |-
      Al hetgeen in de vergaderingen aan de orde komt is vertrouwelijk, voor zover niet anders is besloten of indien bij
      wettelijk voorschrift anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel3
  - number: '3.6'
    text: De adviseur Politiek-bestuurlijke advisering voert het secretariaat van de Bestuursraad.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel3
  - number: '3.7'
    text: De directeur Concernondersteuning voert het secretariaat van de bespreking van het departementale personeelsbeleid.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel3
  - number: '4.1'
    text: De Algemene Leiding bestaat uit de secretaris-generaal.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel4
  - number: '4.2'
    text: |-
      De secretaris-generaal is belast met de ambtelijke leiding van het ministerie. Tot deze taak behoort in ieder
      geval:
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel4
  - number: 4.2.a
    text: het informeren en adviseren van de Minister over aangelegenheden, de Minister of het ministerie betreffende;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel4
  - number: 4.2.b
    text: |-
      het zorgdragen voor de coördinatie en integratie van beleidsvoorbereiding, beleidsontwikkeling en beleidsuitvoering
      binnen het ministerie;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel4
  - number: 4.2.c
    text: het uitoefenen van de algemene controlfunctie bij het ministerie;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel4
  - number: 4.2.d
    text: het rechtstreeks leiding geven aan de directeuren-generaal en de directeuren van het SG-Cluster;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel4
  - number: 4.2.e
    text: het voorzitterschap van de Bestuursraad;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel4
  - number: 4.2.f
    text: |-
      het zorgdragen voor het nemen van besluiten over en het geven van algemene aanwijzingen ten aanzien van het
      algemene beleid en beheer inzake de bedrijfsvoering en de formatie van het ministerie;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel4
  - number: 4.2.g
    text: het aansturen van de Rijksdienst Caribisch Nederland (RCN);
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel4
  - number: 4.2.h
    text: |-
      het beheersmatig aansturen van de kabinetten van de gouverneur en de Rijksvertegenwoordiger voor de openbare
      lichamen Bonaire, Sint Eustatius en Saba;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel4
  - number: 4.2.i
    text: |-
      het ter beschikking stellen van mensen en middelen aan het College Financieel Toezicht Curaçao en Sint Maarten, het
      College Financieel Toezicht Bonaire, Sint Eustatius en Saba, en het College Aruba Financieel Toezicht;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel4
  - number: 4.2.j
    text: |-
      het voeren van overleg met de Groepsondernemingsraad en de Ondernemingsraad BZK Kerndepartement, als bestuurder
      in de zin van de [Wet op de Ondernemingsraden][ref1], en de centrales van verenigingen van ambtenaren, bedoeld in
      [artikel 113 van het Algemeen Rijksambtenarenreglement][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002747
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel113
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002747
      - id: ref2
        bwb_id: BWBR0001950
        artikel: '113'
  - number: 4.2.k
    text: |-
      het optreden als gemachtigd ambtenaar in de zin van de
      [Uitvoeringsregeling openbaarheid van bestuur Binnenlandse Zaken][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008536
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008536
  - number: 4.2.l
    text: |-
      het plegen van inhoudelijke afstemming met het gemeenschappelijke secretariaat van de Raad voor het openbaar
      bestuur en de Raad voor de financiële verhoudingen (sRob/Rfv);
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel4
  - number: 4.2.m
    text: het toezicht op het beheer van de Kiesraad (KR);
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel4
  - number: 4.2.n
    text: het eigenaarschap van alle tot het ministerie behorende agentschappen;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel4
  - number: 4.2.o
    text: |-
      het geven van uitvoering aan de [Regeling audit committees][ref1] van het Rijk;


      [ref1]: https://wetten.overheid.nl/BWBR0031524
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0031524
  - number: 4.2.p
    text: het verlenen of weigeren van goedkeuring van besluiten tot uitzonderingen op de aanbestedingsregelgeving.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel4
  - number: '4.3'
    text: |-
      De secretaris-generaal is niet belast met de inhoudelijke leiding van het in
      [artikel 2, eerste lid, onder i][ref1], genoemde organisatieonderdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0038547#Artikel2
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0038547
        artikel: '2'
        hoofdstuk: '2'
  - number: '5.1'
    text: Het directoraat-generaal Bestuur en Wonen staat onder leiding van een directeur-generaal.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel5
  - number: '5.2'
    text: |-
      Het directoraat-generaal Bestuur en Wonen draagt zorg voor sterk, vernieuwend en adaptief openbaar bestuur, een
      functionerend en zich ontwikkelend democratisch stelsel, een evenwichtige woningmarkt en een goed bouwklimaat door
      het uitvoeren van de volgende taken:
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel5
  - number: 5.2.a
    text: |-
      het bevorderen van een doelmatig, doeltreffend en democratisch openbaar bestuur, waaronder begrepen de relaties, de
      Europese Unie en andere internationale instellingen;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel5
  - number: 5.2.b
    text: |-
      het zorgdragen voor een goede en adequate organisatie met betrekking tot het Nederlandse openbaar bestuur, onder
      andere met betrekking tot de financiën van gemeenten en provincies (het Gemeentefonds en het Provinciefonds);
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel5
  - number: 5.2.c
    text: |-
      het in overleg met de overige ministeries zorgdragen voor goede interbestuurlijke relaties, beredeneerd vanuit de
      eigenstandige positie van provincies en gemeenten. Het draagt bij aan de oplossing van spanningen, dilemma’s en
      actuele vraagstukken op het snijvlak van politiek, bestuur en samenleving;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel5
  - number: 5.2.d
    text: |-
      een functionerende woningmarkt met aandacht voor keuzevrijheid en betaalbaarheid, ook voor lagere inkomensgroepen,
      bijzondere (urgente) aandachtsgroepen en gebieden;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel5
  - number: 5.2.e
    text: |-
      het bevorderen dat woningcorporaties het publiek belang behartigen en het waarborgen van een goed werkend
      corporatiestelsel;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel5
  - number: 5.2.f
    text: |-
      het bevorderen van het tot stand komen van voldoende woningen en de bouwtechnische onderscheidenlijk
      gebruikskwaliteit daarvan en het ontwikkelen van beleid op het gebied van energiebesparing in de gebouwde omgeving;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel5
  - number: 5.2.g
    text: |-
      het zorgdragen voor de stelsels van de basisregistratie personen, de Persoonsinformatievoorziening in de Caribische
      delen van het Koninkrijk (PIVA), het burgerservicenummer en reisdocumenten met de bijbehorende registraties,
      alsmede de verwerking van persoonsgegevens met het oog op die stelsels;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel5
  - number: 5.2.h
    text: het ter beschikking stellen van mensen en middelen aan de Hoge Raad van Adel;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel5
  - number: 5.2.i
    text: |-
      het nemen van besluiten en treffen van handelingen ter uitvoering van de [Wet raadgevend referendum][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0036443
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0036443
  - number: '5.3'
    text: 'Het directoraat-generaal bestaat uit de volgende organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel5
  - number: 5.3.a
    text: het bureau directeur-generaal (bdgBW);
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel5
  - number: 5.3.b
    text: de directie Bestuur en Financiën (dBF);
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel5
  - number: 5.3.c
    text: de directie Democratie en Burgerschap (dDB);
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel5
  - number: 5.3.d
    text: de directie Woningmarkt (dWM);
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel5
  - number: 5.3.e
    text: de programmadirectie Stad (pdS);
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel5
  - number: 5.3.f
    text: de programmadirectie Bouwen en Energie (pdBE);
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel5
  - number: 5.3.g
    text: het agentschap Rijksdienst voor Identiteitsgegevens (RViG);
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel5
  - number: 5.3.h
    text: het secretariaat van de adviescommissie geschilbeslechting.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel5
  - number: '6.1'
    text: |-
      De Dienst van de Huurcommissie staat onder leiding van het bestuur van de Huurcommissie bedoeld in de
      [Uitvoeringswet huurprijzen woonruimte][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014315
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0014315
  - number: '6.2'
    text: |-
      De Dienst van de Huurcommissie heeft de taken bedoeld in de [artikelen 4][ref1], [4a][ref2] en
      [5 van de Uitvoeringswet huurprijzen woonruimte][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel4a
      [ref3]: https://wetten.overheid.nl/BWBR0014315#Artikel5
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0014315
        artikel: 4a
      - id: ref3
        bwb_id: BWBR0014315
        artikel: '5'
  - number: '7.1'
    text: Het directoraat-generaal Overheidsorganisatie staat onder leiding van een directeur-generaal.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel7
  - number: '7.2'
    text: 'Het directoraat-generaal draagt zorg voor:'
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel7
  - number: 7.2.a
    text: |-
      de ontwikkeling van het werkgeverschap in de publieke sector (met een accent op de kabinetssectoren), modernisering
      van het werkgeverschap voor de sector Rijk, en de doorontwikkeling van de personele functie (HRM) van en in de
      rijksdienst;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel7
  - number: 7.2.b
    text: de interbestuurlijke en interdepartementale ontwikkeling van de i-Overheid;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel7
  - number: 7.2.c
    text: |-
      de ontwikkeling en sturing op rijksbreed bedrijfsvoeringbeleid en op de beoordeling of de beleidsambities worden
      gerealiseerd;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel7
  - number: 7.2.d
    text: de kaders voor de informatisering bij het Rijk en het toezicht daarop;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel7
  - number: 7.2.e
    text: de doorontwikkeling van een rijksdienst en van een efficiënte en effectieve overheidsorganisatie.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel7
  - number: '7.3'
    text: 'Het directoraat-generaal bestaat uit de volgende organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel7
  - number: 7.3.a
    text: |-
      het bureau directeur-generaal van het directoraat-generaal Overheidsorganisatie, inclusief bureau
      RijksBeveiligingsAmbtenaar (bDGOO);
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel7
  - number: 7.3.b
    text: de directie Ambtenaar & Organisatie (dA&O);
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel7
  - number: 7.3.c
    text: de directie Informatiesamenleving & Overheid (dI&O);
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel7
  - number: 7.3.d
    text: de directie Inkoop- Facilitair- en Huisvestingsbeleid Rijk;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel7
  - number: 7.3.e
    text: de directie CIO-Rijk;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel7
  - number: 7.3.f
    text: het agentschap Logius.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel7
  - number: '8.1'
    text: Het directoraat-generaal Vastgoed en Bedrijfsvoering Rijk staat onder leiding van een directeur-generaal.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel8
  - number: '8.2'
    text: 'Het directoraat-generaal Vastgoed en Bedrijfsvoering Rijk draagt zorg voor:'
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel8
  - number: 8.2.a
    text: het verwerven, ontwikkelen en aan onderdelen van de Rijksoverheid ter beschikking stellen van vastgoed;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel8
  - number: 8.2.b
    text: het efficiënt beheren, onderhouden en gebruiken van een uitgebalanceerde rijksvastgoedportefeuille;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel8
  - number: 8.2.c
    text: de transformatie en het afstoten van overtollig rijksvastgoed;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel8
  - number: 8.2.d
    text: het genereren van inkomsten met rijksvastgoed, indien (wettelijk) mogelijk;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel8
  - number: 8.2.e
    text: het op kwalitatief goede en efficiënte wijze uitvoeren van bedrijfsvoeringstaken voor de Rijksoverheid;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel8
  - number: 8.2.f
    text: |-
      het bevorderen, realiseren en (doen) in stand houden van onderlinge samenhang, integratie en synergie in de
      dienstverlening vanuit het directoraat-generaal;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel8
  - number: 8.2.g
    text: het toezicht op het Bureau Architectenregister;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel8
  - number: 8.2.h
    text: het optreden als gemandateerd eigenaar voor de agentschappen, genoemd in het derde lid, onder b tot en met e.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel8
  - number: '8.3'
    text: 'Het directoraat-generaal Vastgoed en Bedrijfsvoering Rijk bestaat uit de volgende organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel8
  - number: 8.3.a
    text: het agentschap het Rijksvastgoedbedrijf (RVB);
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel8
  - number: 8.3.b
    text: het agentschap SSC-ICT;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel8
  - number: 8.3.c
    text: het agentschap P-Direkt;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel8
  - number: 8.3.d
    text: het agentschap Uitvoeringsorganisatie Bedrijfsvoering Rijk (UBR);
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel8
  - number: 8.3.e
    text: het agentschap FMHaaglanden (FMH);
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel8
  - number: 8.3.f
    text: de directie Doc-Direkt.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel8
  - number: '8.4'
    text: 'Het Rijksvastgoedbedrijf bestaat uit de volgende organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel8
  - number: 8.4.a
    text: de directie Portefeuillestrategie & Portefeuillemanagement (P&P);
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel8
  - number: 8.4.b
    text: de directie Transacties & Projecten (T&P);
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel8
  - number: 8.4.c
    text: de directie Vastgoedbeheer (VB);
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel8
  - number: 8.4.d
    text: de directie Financiën (Fin);
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel8
  - number: 8.4.e
    text: de directie Bestuur & Bedrijfsvoering (B&B);
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel8
  - number: 8.4.f
    text: het bureau directeur-generaal (bdg);
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel8
  - number: 8.4.g
    text: het Atelier Rijksbouwmeester (ARbm).
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel8
  - number: '8.5'
    text: |-
      Het Rijksvastgoedbedrijf staat onder leiding van een directeur-generaal die tevens directeur-generaal is van het
      directoraat-generaal Vastgoed en Bedrijfsvoering Rijk.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel8
  - number: '8.6'
    text: |-
      Voor aangelegenheden die behoren tot het werkterrein van het Rijksvastgoed treedt de directeur-generaal op en doet
      stukken af en ondertekent deze als directeur-generaal Rijksvastgoedbedrijf en voor de overige aangelegenheden als
      directeur-generaal Vastgoed en Bedrijfsvoering Rijk.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel8
  - number: '9.1'
    text: |-
      De Algemene Inlichtingen- en Veiligheidsdienst staat onder leiding van een directeur-generaal en een
      plaatsvervangend directeur-generaal.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel9
  - number: '9.2'
    text: |-
      De Algemene Inlichtingen- en Veiligheidsdienst heeft de taken, bedoeld in
      [artikel 6 van de Wet op de inlichtingen- en veiligheidsdiensten 2002][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel6
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '6'
  - number: '9.3'
    text: 'De Algemene Inlichtingen- en Veiligheidsdienst bestaat uit de volgende organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel9
  - number: 9.3.a
    text: de Directie Inlichtingen;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel9
  - number: 9.3.b
    text: de Directie Operatiën;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel9
  - number: 9.3.c
    text: de Directie Veiligheidsonderzoeken & Bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel9
  - number: 9.3.d
    text: de Centrale Staf.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel9
  - number: '9.4'
    text: De Centrale Staf staat onder leiding van de plaatsvervangend directeur-generaal.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel9
  - number: '10.1'
    text: Het Bureau Algemene Bestuursdienst staat onder leiding van een directeur-generaal.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel10
  - number: '10.2'
    text: 'Het Bureau heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel10
  - number: 10.2.a
    text: |-
      het bijdragen aan de versterking van het management door beleid te ontwikkelen en uit te voeren op het gebied van
      management development;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel10
  - number: 10.2.b
    text: het ontwikkelen van instrumenten nodig voor de realisatie van het beleid;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel10
  - number: 10.2.c
    text: het ontwikkelen van producten en diensten ter bevordering van de ontwikkeling van managers;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel10
  - number: 10.2.d
    text: het adviseren en begeleiden van individuele managers op gebied van opleiding en in hun (loopbaan)ontwikkeling;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel10
  - number: 10.2.e
    text: het bijdragen aan de beschikbaarheid van managers en aan talentontwikkeling;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel10
  - number: 10.2.f
    text: het waar nodig realiseren van strategisch advies en/of de bezetting met tijdelijke capaciteit;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel10
  - number: 10.2.g
    text: |-
      het zorgen voor loopbaanbegeleiding en fungeren als gedelegeerd werkgever voor het topmanagement van de
      Rijksdienst;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel10
  - number: 10.2.h
    text: het uitvoeren van HRM-dienstverlening voor de Minister.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel10
  - number: '10.3'
    text: 'Het Bureau bestaat uit de volgende organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel10
  - number: 10.3.a
    text: de directie Management Development Rijk (MDR);
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel10
  - number: 10.3.b
    text: de directie Beleid en Bestuursondersteuning (B&B);
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel10
  - number: 10.3.c
    text: ABD Topconsult.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel10
  - number: '11.1'
    text: |-
      Het SG-Cluster staat onder inhoudelijke leiding van de Secretaris-generaal en onder beheersmatige leiding van de
      directeur Concernondersteuning.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel11
  - number: '11.2'
    text: 'Het SG-Cluster bestaat uit de volgende organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel11
  - number: 11.2.a
    text: De directie Concernondersteuning;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel11
  - number: 11.2.b
    text: De directie Koninkrijksrelaties (KR);
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel11
  - number: 11.2.c
    text: De directie Financieel-Economische Zaken (FEZ);
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel11
  - number: 11.2.d
    text: De directie Constitutionele Zaken en Wetgeving (CZW);
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel11
  - number: 11.2.e
    text: De Chief Information Officer Staf BZK (CIO);
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel11
  - number: 11.2.f
    text: De directie BZK-flex (BZK-Flex);
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel11
  - number: 11.2.g
    text: |-
      Het secretariaat van de Raad voor het openbaar bestuur (Rob) en de Raad voor de financiële verhoudingen (Rfv) Rob/
      Rfv;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel11
  - number: 11.2.h
    text: Het programma directoraat-generaal Wederopbouw Bovenwindse eilanden (pDG WBE).
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel11
  - number: '11.3'
    text: |-
      De directeur Koninkrijksrelaties ondersteunt de secretaris-generaal bij het aansturen van de Rijksdienst Caribisch
      Nederland.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel11
  - number: '12.1'
    text: De directie Concernondersteuning staat onder leiding van een directeur.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel12
  - number: '12.2'
    text: 'De directie heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel12
  - number: 12.2.a
    text: de concernsturing en de strategische advisering van de Bestuursraad;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel12
  - number: 12.2.b
    text: de dienstverlening en vakinhoudelijke advisering ten behoeve van het beleid van de bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel12
  - number: 12.2.c
    text: de ondersteuning en het beheer van de bedrijfsprocessen;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel12
  - number: 12.2.d
    text: de regie op inzet van kennis, internationale zaken en Europa.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel12
  - number: '12.3'
    text: 'De directie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel12
  - number: 12.3.a
    text: Staf en ondersteuning;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel12
  - number: 12.3.b
    text: Politiek-bestuurlijke advisering;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel12
  - number: 12.3.c
    text: Communicatie (C);
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel12
  - number: 12.3.d
    text: Personeel en Organisatie (PO);
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel12
  - number: 12.3.e
    text: Kennis, Internationaal, Europa, Macro-Economie (KIEM).
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel12
  - number: '13.1'
    text: De directie Financieel-economische Zaken staat onder leiding van een directeur.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel13
  - number: '13.2'
    text: 'De directie heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel13
  - number: 13.2.a
    text: |-
      de dienstverlening en vakinhoudelijke advisering ten behoeve van het beleid van de financieel-economische
      processen, het (doen) vertalen van centrale kaders en richtlijnen in specifieke voorschriften en procedures;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel13
  - number: 13.2.b
    text: |-
      het beoordelen van beleidsvoorstellen op samenhang tussen inhoudelijke doelstellingen en middeleninzet, inclusief
      de advisering aan de Minister, secretaris-generaal en de bestuursraad;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel13
  - number: 13.2.c
    text: |-
      het BZK-breed toetsen van de producten in het kader van de begroting, beleid en beheer en het adviseren van de
      politieke en ambtelijke top hierover;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel13
  - number: 13.2.d
    text: |-
      het voeren van overleg namens het departement met het ministerie van Financiën over alle begrotings- en
      verantwoordingsaangelegenheden;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel13
  - number: 13.2.e
    text: het zorgdragen voor een adequaat financieel-economisch beheer voor het ministerie;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel13
  - number: 13.2.f
    text: |-
      het borgen van de kwaliteit van de bedrijfsvoering en de daaraan verbonden (financieel administratieve) processen
      binnen het ministerie;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel13
  - number: 13.2.g
    text: het adviseren van de secretaris-generaal en de Minister ten aanzien van bijzondere vraagstukken op concernniveau.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel13
  - number: '13.3'
    text: |-
      De directeur Financieel-economische Zaken bekleedt de functie van coördinerend directeur Inkoop (CDI) en heeft
      vanuit die hoedanigheid de volgende taken:
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel13
  - number: 13.3.a
    text: het stellen van kaders voor het inkoopbeleid van het ministerie;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel13
  - number: 13.3.b
    text: de coördinatie van de inkoopfunctie en het contractbeheer van het ministerie;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel13
  - number: 13.3.c
    text: de centrale ondersteuning en advisering bij inkoopvraagstukken.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel13
  - number: '14.1'
    text: De directie Constitutionele Zaken en Wetgeving staat onder leiding van een directeur.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel14
  - number: '14.2'
    text: 'De directie heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel14
  - number: 14.2.a
    text: |-
      het beheer en onderhoud van de [Grondwet][ref1] en het [Statuut][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0001840
      [ref2]: https://wetten.overheid.nl/BWBR0002154
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001840
      - id: ref2
        bwb_id: BWBR0002154
  - number: 14.2.b
    text: |-
      de toetsing van (concept)regelgeving, beleid en maatregelen aan de [Grondwet][ref1], het [Statuut][ref2] en
      relevante internationale verdragen, inclusief het EU-recht;


      [ref1]: https://wetten.overheid.nl/BWBR0001840
      [ref2]: https://wetten.overheid.nl/BWBR0002154
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001840
      - id: ref2
        bwb_id: BWBR0002154
  - number: 14.2.c
    text: het opstellen van regelgeving waar de Minister eerstverantwoordelijk voor is;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel14
  - number: 14.2.d
    text: |-
      het bijdragen aan de totstandkoming van nationale en internationale wetgeving waarbij de Minister mede is
      betrokken;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel14
  - number: 14.2.e
    text: |-
      het adviseren over de noodzaak, wenselijkheid en mogelijkheid om door middel van wetgeving bij te dragen aan het
      bereiken van de beleidsdoelstellingen van de Minister;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel14
  - number: 14.2.f
    text: |-
      het adviseren over de noodzaak, wenselijkheid en mogelijkheid om de democratische constitutionele orde door middel
      van wetgeving aan te passen aan veranderende maatschappelijke behoeften;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel14
  - number: 14.2.g
    text: |-
      de bezwaar- en beroepsprocedures tegen de Minister of het ministerie en de advisering over juridische
      aangelegenheden in het algemeen.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel14
  - number: '15.1'
    text: De directie BZK FLEX staat onder leiding van een directeur.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel15
  - number: '15.2'
    text: |-
      De directie heeft de volgende taak: het zorgen voor een wendbare organisatie, een organisatie die op inhoud en op
      capaciteit flexibel kan inspelen op actuele opgaven.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel15
  - number: '16.1'
    text: De CIO Staf BZK staat onder leiding van de Chief Information Officer (CIO).
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel16
  - number: '16.2'
    text: |-
      De CIO Staf BZK draagt zorg voor de advisering, kaderstelling, toezicht en handhaving op het terrein van de
      informatievoorziening en ICT binnen bedrijfsvoering en beleid in algemene zin, alsmede voor het bevorderen van
      informatiebewustzijn en het gebruik van ICT-middelen middels:
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel16
  - number: 16.2.a
    text: |-
      het opstellen en coördineren van de departementale strategie en visie op de informatievoorziening en ICT voor
      bedrijfsvoering en beleid;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel16
  - number: 16.2.b
    text: |-
      de advisering, kaderstelling, het toezicht en de handhaving met betrekking tot kwaliteit van informatie, waaronder
      informatieveiligheid;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel16
  - number: 16.2.c
    text: |-
      de advisering, kaderstelling, het toezicht en de handhaving met betrekking tot het vastleggen, hergebruiken en
      bewaren van informatie;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel16
  - number: 16.2.d
    text: |-
      de advisering, kaderstelling, het toezicht en de handhaving met betrekking tot ICT-werkomgeving binnen het
      ministerie;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel16
  - number: 16.2.e
    text: de advisering, kaderstelling, toezicht en handhaving met betrekking tot ICT-systemen en applicaties;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel16
  - number: 16.2.f
    text: |-
      het adviseren en geven van oordelen over risicobeheersing op het gebied van ICT en bij projecten of programma’s met
      een belangrijke ICT-component;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel16
  - number: 16.2.g
    text: de advisering over de voorzieningen in beheer;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel16
  - number: 16.2.h
    text: het opdrachtgeverschap SSC-ICT voor wat betreft de ICT-werkomgeving voor het ministerie;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel16
  - number: 16.2.i
    text: het opdrachtgeverschap Digidoc;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel16
  - number: 16.2.j
    text: het bevorderen van open data binnen het ministerie.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel16
  - number: '17.1'
    text: De directie Koninkrijksrelaties staat onder leiding van een directeur.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel17
  - number: '17.2'
    text: 'De directie heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel17
  - number: 17.2.a
    text: |-
      het zorg dragen voor een toekomstbeeld, scenario’s en handvatten om het Koninkrijk nader vorm en inhoud te geven,
      door beleidsvorming, beleidsvaststelling en uitvoering;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel17
  - number: 17.2.b
    text: |-
      het onderhouden van goede relaties met en het coördineren van de samenwerking met de openbare lichamen van
      Caribisch Nederland, en met Curaçao, Aruba en Sint Maarten;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel17
  - number: 17.2.c
    text: |-
      het met andere partners binnen en buiten het departement zorg dragen voor het opstellen en verwezenlijken van het
      beleid van het ministerie voor de openbare lichamen van Caribisch Nederland;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel17
  - number: 17.2.d
    text: |-
      het met andere partners binnen en buiten het departement zorg dragen voor de coördinatie van het algemene beleid
      van de Rijksoverheid op dit terrein, met de speerpunten die samen met de openbare lichamen van Caribisch Nederland
      en de departementen worden bepaald;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel17
  - number: 17.2.e
    text: |-
      het namens de secretaris-generaal aansturen van de Rijksdienst Caribisch Nederland (RCN). De verdere organisatie
      van RCN wordt geregeld in het [Organisatie- en mandaatbesluit BZK-BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031745
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0031745
  - number: 17.2.f
    text: |-
      Het ondersteunen van de Vertegenwoordiger bij het uitvoeren van zijn taken en opdracht zoals vastgelegd in het
      Koninklijk besluit van 4 maart 2013;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel17
  - number: 17.2.g
    text: 'Het uitvoeren van de taken van de Vertegenwoordiging van Nederland bij Curacao, Aruba en Sint Maarten te weten:'
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel17
  - number: 17.2.g.1°
    text: |-
      het adviseren van en rapporteren aan de Minister en desgewenst aan de overige ministers over het beleid voor
      Curaçao, Aruba, en Sint Maarten;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel17
  - number: 17.2.g.2°
    text: het begeleiden van officiële bezoeken van Nederlandse ministers, staatssecretarissen en delegaties;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel17
  - number: 17.2.g.3°
    text: het uitvoeren van Kieswettaken voor de Tweede Kamerverkiezingen, de Europese verkiezingen en referenda;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel17
  - number: 17.2.g.4°
    text: het verwijzen van Nederlanders die niet weten bij welke lokale instanties ze moeten zijn;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel17
  - number: 17.2.g.5°
    text: |-
      het bieden van hulp aan Nederlanders die in de problemen zijn geraakt; Het verlenen van gedetineerdenzorg aan
      Nederlanders die in Aruba, Curaçao en Sint Maarten zijn aangehouden;
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel17
  - number: 17.2.g.6°
    text: het geven van informatie over Nederlandse rijbewijzen en paspoorten.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel17
  - number: '18.1'
    text: Het programma directoraat-generaal staat onder leiding van een directeur-generaal.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel18
  - number: '18.2'
    text: |-
      Het programma directoraat-generaal heeft tot taak bij te dragen aan de wederopbouw van de Nederlandse Bovenwindse
      eilanden Sint Maarten, Saba en Sint Eustatius.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel18
  - number: '18.3'
    text: Het programma directoraat-generaal bestaat uit een directie.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel18
  - number: '19.1'
    text: Het Bureau Digitale Overheid staat onder leiding van de Nationaal Commissaris Digitale Overheid.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel19
  - number: '19.2'
    text: Het Bureau Digitale Overheid ondersteunt de Nationaal Commissaris Digitale Overheid bij zijn taak.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel19
  - number: '19.3'
    text: Het Bureau Digitale Overheid is in beheersmatige zin ondergebracht bij de secretaris-generaal.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel19
  - number: '20.1'
    text: |-
      De Minister stelt de inrichting van de organisatie vast conform het bepaalde in
      [artikel 3, tweede lid, van het Coördinatiebesluit organisatie en bedrijfsvoering rijksdienst 2011][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029514#Artikel3
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0029514
        artikel: '3'
  - number: '20.2'
    text: |-
      De secretaris-generaal is bevoegd tot het nader vaststellen van de inrichting van de onder de directoraten-
      generaal, het Bureau Algemene Bestuursdienst en het SG-cluster ressorterende organisatieonderdelen, na advisering
      door de directeur Concernondersteuning.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel20
  - number: '20.3'
    text: |-
      De secretaris-generaal is bevoegd tot het nader vaststellen van de inrichting van de Algemene Inlichtingen- en
      Veiligheidsdienst op voordracht van de directeur-generaal van de Algemene Inlichtingen- en Veiligheidsdienst en na
      advisering van de directeur Concernondersteuning.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel20
  - number: '20.4'
    text: |-
      De secretaris-generaal en de directeuren-generaal van het bureau Algemene Bestuursdienst, van het directoraat-
      generaal Vastgoed en Bedrijfsvoering Rijk en van de Algemene Inlichtingen- en Veiligheidsdienst stellen met
      inachtneming van dit besluit ten behoeve van hun dienst- of organisatieonderdelen periodiek een capaciteitsplan
      vast.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel20
  - number: '21.1'
    text: |-
      Tot de taak van de directoraten-generaal, het bureau Algemene Bestuursdienst en het SG-Cluster behoort voorts de
      uitvoering van andere taken dan hiervoor genoemd, in opdracht van de Minister of de secretaris-generaal, voor zover
      hogere wet- en regelgeving zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel21
  - number: '21.2'
    text: |-
      Tot de taak van de in dit besluit genoemde organisatieonderdelen, ressorterend onder de dienstonderdelen genoemd
      in het eerste lid, behoort voorts de uitvoering van andere taken dan vermeld, in opdracht van de Minister, de
      secretaris-generaal of het diensthoofd, voor zover hogere wet- en regelgeving zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel21
  - number: '22.1'
    text: De directeur Concernondersteuning is belast met het beheer van dit besluit.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel22
  - number: '22.2'
    text: |-
      De secretaris-generaal, de directeuren-generaal, en de directeuren van het SG-Cluster, ieder voor zover
      het hen aangaat, zijn verantwoordelijk voor een juiste, volledige en tijdige aanlevering aan de directeur
      Concernondersteuningvan de gegevens die een goed beheer van dit besluit mogelijk maken.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel22
  - number: '22.3'
    text: |-
      Het beheer en de aanlevering van gegevens geschieden met inachtneming van de desbetreffende (richtlijnen inzake)
      administratieve organisatiebeschrijvingen.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel22
  - number: '23'
    text: |-
      Wijziging van dit besluit is voorbehouden aan de Minister en geschiedt op voordracht van de directeur
      Concernondersteuning.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel23
  - number: '24'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin het wordt
      geplaatst en werkt terug tot en met 1 april 2016.
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel24
  - number: '25'
    text: 'Dit besluit wordt aangehaald als: Organisatiebesluit BZK 2016.'
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel25
  - number: '26'
    text: |-
      Het [Organisatiebesluit BZK 2015 wordt ingetrokken][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0036945
    url: https://wetten.overheid.nl/BWBR0038547/2018-06-22#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0036945
