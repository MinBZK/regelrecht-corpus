    text: in de groep 1, exploitatiewijze A1, Standaard S2 en
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.17
  - number: 3.17.8.b)
    text: |-
      in de groep 3, exploitatiewijze A1, Standaard S1, voor de ononderbroken duur van ten hoogste drie maanden per
      kalenderjaar met een lichtmatroos worden verminderd, als deze lichtmatroos gedurende deze tijd een schippersschool
      bezoekt. Opeenvolgende periodes met een gereduceerde bemanning moeten door een periode van minimaal één
      maand worden onderbroken. Het bezoek aan de schippersschool moet worden aangetoond met een verklaring van de
      schippersschool, die zich aan boord moet bevinden en waarin de tijden van het schoolbezoek zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.17
  - number: 3.17.9
    text: |-
      Bij dagtochtschepen met passagiers waarvan het aantal voor vertrek vaststaat en tijdens de vaart niet wijzigt
      (chartervaart), kan de overeenkomstig de groepen 2 tot en met 6 voorgeschreven minimumbemanning worden gereduceerd
      tot de eerst lagere groep, op voorwaarde dat het overeenkomstig de groepen 1 tot en met 6 toegelaten aantal
      passagiers tijdens de vaart lager is dan dit toegestane aantal. De eisen van hoofdstuk 5, alsmede de eisen die
      gelden voor de bemanning en het boordpersoneel uit hoofde van de veiligheidsrol gelden onverminderd.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.17
  - number: 3.17.10
    text: |-
      De machinisten die zijn voorgeschreven overeenkomstig de in het eerste tot derde lid genoemde tabellen mogen door
      bijkomende volmatrozen worden vervangen. Deze volmatrozen mogen door bijkomende matrozen worden vervangen, wanneer
      het aantal volmatrozen dat als minimumbemanning overeenkomstig de in het eerste tot derde lid genoemde tabellen is
      voorgeschreven, overeenstemt met het aantal te vervangen machinisten.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.17
  - number: 3.18.1
    text: |-
      Wanneer de uitrusting van een motorschip, een duwboot, een hecht samenstel, een andere hechte samenstelling of
      een passagiersschip niet voldoet aan de standaard S1, zoals bepaald in [artikel 3.14][ref1] van het onderhavige
      reglement, dient de minimumbemanning, zoals bedoeld in de [artikelen 3.15][ref2], [3.16][ref3] of  [3.17][ref4], te
      worden verhoogd


