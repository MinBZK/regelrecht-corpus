    text: |-
      moet in de exploitatiewijzen A1 en A2 de matroos, zoals voorgeschreven in het eerste lid, onderdeel a, door een
      volmatroos, en
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.18
  - number: 3.18.2.b)
    text: |-
      moeten de twee matrozen in de exploitatiewijze B, zoals voorgeschreven in het eerste lid, onderdeel b door twee
      volmatrozen worden vervangen.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.18
  - number: 3.18.3
    text: |-
      De verhoging van de vereiste bemanning wordt door de Commissie van Deskundigen onder nummer 47 van het
      binnenschipcertificaat ingeschreven.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.18
  - number: 3.19.1
    text: |-
      De Commissie van Deskundigen bepaalt voor de vaartuigen waarop de [artikelen 3.15 tot en met 3.17][ref1] niet van
      toepassing zijn(zoals sleepboten, sleepschepen en drijvende werktuigen) naar gelang hun afmetingen, bouwwijze,
      inrichting en benutting, welke bemanning zich tijdens de vaart aan boord moet bevinden.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel3
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.19
    references:
