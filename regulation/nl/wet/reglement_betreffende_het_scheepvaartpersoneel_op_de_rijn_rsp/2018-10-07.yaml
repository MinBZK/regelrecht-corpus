      de bevoegde autoriteit erkende verklaring betreffende een met goed gevolg afgesloten beroepsopleiding met
      praktijkgedeelten op het gebied van de binnenvaart,
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.01
  - number: 7.01.5.b)
    text: |-
      de vaartijd, met een maximum van twee jaar, die op zee als lid van een dekbemanning is doorgebracht, waarbij 250
