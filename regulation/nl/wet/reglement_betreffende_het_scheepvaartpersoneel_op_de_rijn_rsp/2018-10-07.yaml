  - number: 7.04.1
    text: 'Degene die het overheidspatent wil verkrijgen, moet:'
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.04
  - number: 7.04.1.a)
    text: ten minste 21 jaar oud zijn;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.04
  - number: 7.04.1.b)
    text: deel uit maken van een politie- of douanedienst, een andere autoriteit dan wel van een erkende brandweerdienst;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.04
  - number: 7.04.1.c)
    text: |-
      lichamelijk en geestelijk geschikt zijn om een schip te voeren. De lichamelijke en geestelijke geschiktheid wordt
      aangetoond door het overleggen van een medische verklaring overeenkomstig de [bijlagen B1][ref1] en [B2][ref2], die
      is afgegeven door een arts die door de bevoegde autoriteit erkend is;;


      [ref1]: https://wetten.overheid.nl/BWBR0030215
      [ref2]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.04
    references:
      - id: ref1
        bwb_id: BWBR0030215
      - id: ref2
        bwb_id: BWBR0030215
  - number: 7.04.1.d)
    text: |-
      bekwaam zijn, dat wil zeggen, beschikken over de noodzakelijke beroepsmatige vaardigheden en kennis, ook in
      nautisch opzicht, alsmede over voldoende kennis van de reglementen en de vaarweg. Aan de voorwaarden wordt geacht
      te zijn voldaan wanneer de kandidaat het daartoe ingestelde examen met goed gevolg heeft afgelegd.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.04
  - number: 7.04.1.e)
    text: |-
      ten minste drie jaar praktische ervaring in de binnenvaart hebben opgedaan, waarvan ten minste drie maanden
      gedurende het laatste jaar.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.04
  - number: 7.04.2
    text: |-
      De autoriteit waaronder de kandidaat ressorteert, moet een verklaring hebben afgegeven waarin wordt bevestigd dat
      de kandidaat voldoet aan de in het eerste lid, onderdelen b) en e) en inde [artikelen 7.05][ref1] en [7.06][ref2]
      genoemde vereisten..


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0030215#Artikel7
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.04
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0030215
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: '7.05'
    text: |-
      Ongeacht het soort patent is specifieke kennis van riviergedeelten bovendien verplicht tussen de sluizen te
      Iffezheim (km 335,92) en het Spijksche Veer (km 857,40).
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.05
  - number: 7.06.1
    text: |-
      Degene die een Rijnpatent of een bewijs voor een riviergedeelte wil verkrijgen, moet het aangevraagde gedeelte, dat
      zich tussen de sluizen te Iffezheim en het Spijksche Veer bevindt, in de laatste tien jaren ten minste zestien maal
      hebben bevaren, waarvan binnen de laatste drie jaren ten minste drie maal in elke richting.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.06
  - number: 7.06.1.a)
    text: |-
      Degene die een grote patent, een kleine patent of een bewijs voor een riviergedeeltewil verkrijgen, moet zijn
      reizen als matroos, volmatroos of stuurman aan boord van een motorschip hebben gemaakt, voor het voeren waarvan het
      aangevraagde patent of een door de CCR als gelijkwaardig erkend vaarbevoegdheidsbewijs is voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.06
  - number: 7.06.1.b)
    text: |-
      Degene die een sportpatent wil verkrijgen, moet zijn reizen aan boord van een schip met een lengte van 15 m of
      meer hebben gemaakt; de reizen komen slechts in aanmerking, als de persoon ten minste 15 jaar oud is. Het aantal
      voorgeschreven reizen kan verminderd worden tot vier reizen in elke richting binnen het laatste jaar voorafgaand
      aan de aanvraag, als de reizen in het kader van een vakopleiding zijn afgelegd.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.06
  - number: 7.06.1.c)
    text: |-
      Degene die een overheidspatent wil verkrijgen, moet zijn reizen aan boord van een schip met een lengte van 15 m of
      meer hebben gemaakt; de reizen komen slechts in aanmerking, als de persoon ten minste 15 jaar oud is.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.06
  - number: 7.06.2
    text: |-
      De kandidaat moet bovendien met goed gevolg een examen hebben afgelegd, dat een beschrijving van de vaarweg in de
      op- en de afvaart, een beschrijving van de afmetingen van de vaarweg en vragen moet omvatten, waarmee kan worden
      vastgesteld dat hij in staat is de specifieke voorschriften van het Politiereglement voor het riviergedeelte dat
      ligt tussen de sluizen van Iffezheim en het Spijksche Veer kan toepassen ([bijlage D7][ref1]).


      [ref1]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.06
    references:
      - id: ref1
        bwb_id: BWBR0030215
  - number: 7.07.1
    text: |-
      De kandidaat voor een patent voor een riviergedeelte dat het in [artikel 7.05][ref1] gedefinieerde riviergedeelte
      geheel of gedeeltelijk omvat, en de houder van een als gelijkwaardig erkend vaarbevoegdheidsbewijs, die het in
      artikel 7.05 gedefinieerde riviergedeelte geheel of gedeeltelijk willen bevaren, moeten de vereiste kennis van het
      riviergedeelte kunnen aantonen.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel7
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.07
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.07.2
    text: |-
      Als bewijs van de kennis van riviergedeelten wordt op de patentkaart het riviergedeelte aangegeven waarvoor deze
      patentkaart geldig is. Voor vaarbevoegdheidsbewijzen die erkend zijn als gelijkwaardig aan het grote patent, wordt
      de kennis van het riviergedeelte door middel van een bewijs voor riviergedeelten overeenkomstig [bijlage D3][ref1]
      aangetoond.


      [ref1]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.07
    references:
      - id: ref1
        bwb_id: BWBR0030215
  - number: 7.08.1
    text: |-
      De bevoegde autoriteit benoemt één of meer examencommissies voor het afnemen van de examens. Iedere examencommissie
      bestaat uit een voorzitter die vertegenwoordiger is van de overheid van één van de Rijnoeverstaten of België, en
      ten minste twee examinatoren die voldoende ter zake kundig zijn.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.08
  - number: 7.08.2
    text: |-
      De examencommissie voor het Rijnpatent moet zo zijn samengesteld, dat ten minste één examinator houder is van
      het patent van het type dat wordt aangevraagd dan wel van het grote patent en deze, of een ander lid van de
      examencommissie, houder is van het patent voor het aangevraagde riviergedeelte.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.08
  - number: 7.09.1
    text: |-
      Degene die een Rijnpatent wil verkrijgen of uitbreiden, moet aan de bevoegde autoriteit een aanvraag voor toelating
      tot het examen en afgifte van het patent richten, onder opgave van het volgende:
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.09
  - number: 7.09.1.a)
    text: voor- en achternaam, geboortedatum, geboorteplaats en adres;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.09
  - number: 7.09.1.b)
    text: soort patent dat men wil verkrijgen;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.09
  - number: 7.09.1.c)
    text: gedeelte van de Rijn waarvoor het patent wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.09
  - number: 7.09.2
    text: 'Bij de aanvraag van een Rijnpatent moeten de volgende stukken worden overgelegd:'
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.09
  - number: 7.09.2.a)
    text: een recente pasfoto;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.09
  - number: 7.09.2.b)
    text: een kopie van de identiteitskaart of het paspoort;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.09
  - number: 7.09.2.c)
    text: |-
      een medische verklaring overeenkomstig [bijlage B2][ref1], die niet ouder dan drie maanden mag zijn. In geval
      van twijfel aan de lichamelijke en geestelijke geschiktheid kan de bevoegde autoriteit verlangen dat aanvullende
      verklaringen van een specialist worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.09
    references:
      - id: ref1
        bwb_id: BWBR0030215
  - number: 7.09.2.d)
    text: een bewijs van de vaartijd en van de afgelegde reizen;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.09
  - number: 7.09.2.e)
    text: bij aanvraag van een groot of een klein patent een kopie van het marifoonbedieningscertificaat;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.09
  - number: 7.09.2.f)
    text: een uittreksel uit het strafregister.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.09
  - number: 7.09.3
    text: |-
      In plaats van een medische verklaring zoals bedoeld in [bijlage B2][ref1], kan de lichamelijke en geestelijke
      geschiktheid eveneens worden aangetoond door één van de volgende, door de CCR erkende documenten:


      [ref1]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.09
    references:
      - id: ref1
        bwb_id: BWBR0030215
  - number: 7.09.3.a)
    text: |-
      een geldig vaarbevoegdheidsbewijs, waarvoor dezelfde minimumeisen gelden als vastgesteld in de [bijlagen B1][ref1]
      en [B2][ref2] en dat conform [artikel 3.04, onderdeel a)][ref3] is vernieuwd, of


      [ref1]: https://wetten.overheid.nl/BWBR0030215
      [ref2]: https://wetten.overheid.nl/BWBR0030215
      [ref3]: https://wetten.overheid.nl/BWBR0030215#Artikel3
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.09
    references:
      - id: ref1
        bwb_id: BWBR0030215
      - id: ref2
        bwb_id: BWBR0030215
      - id: ref3
        bwb_id: BWBR0030215
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 7.09.3.b)
    text: |-
      een medische verklaring, die niet ouder dan drie maanden is en op zijn minst moet voldoen aan de eisen zoals
      vastgesteld in de [bijlagen B1][ref1] en [B2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030215
      [ref2]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.09
    references:
      - id: ref1
        bwb_id: BWBR0030215
      - id: ref2
        bwb_id: BWBR0030215
  - number: 7.09.4
    text: |-
      In plaats van het uittreksel uit het strafregister kan de geschiktheid voor het voeren van het commando over een
      bemanning worden aangetoond met een gelijkwaardig document overeenkomstig het geldende recht van de woonplaats. Dit
      document moet nog geldig zijn en mag niet ouder zijn dan 6 maanden.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.09
  - number: 7.09.5
    text: 'Bij de aanvraag voor de uitbreiding van een Rijnpatent moeten de volgende stukken worden overgelegd:'
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.09
  - number: 7.09.5.a)
    text: een recente pasfoto;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.09
  - number: 7.09.5.b)
    text: een kopie van de identiteitskaart of het paspoort;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.09
  - number: 7.09.5.c)
    text: een kopie van het geldige Rijnpatent;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.09
  - number: 7.09.5.d)
    text: het bewijs van de afgelegde reizen.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.09
  - number: 7.09.6
    text: |-
      Bij de aanvraag voor een ander type Rijnpatent door een houder van een Rijnpatent moeten de volgende stukken worden
      gevoegd:
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.09
  - number: 7.09.6.a)
    text: een recente pasfoto;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.09
  - number: 7.09.6.b)
    text: een kopie van de identiteitskaart of het paspoort;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.09
  - number: 7.09.6.c)
    text: een kopie van het geldige Rijnpatent.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.09
  - number: 7.10.1
    text: |-
      Degene die een bewijs voor kennis van een riviergedeelte wil verkrijgen of uitbreiden, moet een aanvraag tot de
      bevoegde autoriteit richten voor toelating tot het examen en afgifte van een bewijs voor een riviergedeelte, onder
      vermelding van de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.10
  - number: 7.10.1.a)
    text: voor- en achternaam, geboortedatum, geboorteplaats en adres;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.10
  - number: 7.10.1.b)
    text: gedeelte van de Rijn waarvoor het bewijs van kennis voor een riviergedeelte wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.10
  - number: 7.10.2
    text: |-
      Bij de aanvraag voor het verkrijgen of uitbreiden van een bewijs van kennis voor een riviergedeelte moeten de
      volgende stukken worden gevoegd:
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.10
  - number: 7.10.2.a)
    text: een recente pasfoto;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.10
  - number: 7.10.2.b)
    text: een kopie van de identiteitskaart of het paspoort;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.10
  - number: 7.10.2.c)
    text: |-
      een kopie van het door de CCR, overeenkomstig [artikel 6.02, eerste lid][ref1], als gelijkwaardig erkend geldig
      vaarbevoegdheidsbewijs


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel6
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.10
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '6'
        hoofdstuk: '6'
  - number: 7.10.2.d)
    text: het bewijs van de afgelegde reizen.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.10
  - number: 7.11.1
    text: |-
      Een kandidaat voor een Rijnpatent wordt toegelaten tot het examen wanneer alle vereisten zoals bedoeld
      in de [artikelen 7.01][ref1], [7.02, met uitzondering van het derde lid, onderdeel c)][ref2], of
      [7.03, met uitzondering van het tweede lid, onderdeel c)][ref3] worden nagekomen en het aanvraagdossier volledig
      is overeenkomstig het bepaalde in [artikel 7.09, eerste tot en met vierde lid][ref4]. Indien uit de medische
      verklaring slechts een beperkte geschiktheid blijkt, wordt de kandidaat toch tot het examen toegelaten. De bevoegde
      autoriteit kan in dit geval aan het patent voorwaarden verbinden, die bij afgifte in het patent worden aangetekend.
      Een afwijzing van de aanvraag moet met redenen worden omkleed. De bevoegde autoriteit kan voor een kandidaat, wiens
      uittreksel uit het strafregister of een ander gelijkwaardig document niet aan de eisen voldoet, beslissen dat hij
      vóór afloop van een bepaalde termijn niet tot een examen kan worden toegelaten (uitsluitingstermijn).


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0030215#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0030215#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0030215#Artikel7
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.11
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0030215
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0030215
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0030215
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.11.2
    text: |-
      Degene die een Rijnpatent met een ander riviergedeelte wil uitbreiden, wordt tot het examen toegelaten, als het
      aanvraagdossier volledig is overeenkomstig het bepaalde in [artikel 7.09, eerste en vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel7
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.11
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.11.3
    text: |-
      De houder van een Rijnpatent die een ander type Rijnpatent wil verkrijgen, wordt tot het examen toegelaten, als het
      aanvraagdossier volledig is overeenkomstig het bepaalde in [artikel 7.09, eerste en zesde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel7
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.11
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.11.4
    text: |-
      Degene die een bewijs voor kennis van een riviergedeelte wil verkrijgen of uitbreiden, wordt tot het examen
      toegelaten, als het aanvraagdossier volledig is, overeenkomstig het bepaalde in [artikel 7.10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel7
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.11
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.12.1
    text: 'De kandidaat moet tijdens het examen voor de examencommissie aantonen dat hij:'
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.12
  - number: 7.12.1.a)
    text: |-
      beschikt over voldoende kennis van de voorschriften met betrekking tot het voeren van schepen en de voor
      het veilig voeren van schepen vereiste nautische en technische kennis, beroepsvaardigheden en kennis van de
      grondbeginselen van de ongevallenpreventie; deze kennis wordt door een examen overeenkomstig het examenprogramma
      van [bijlage D7][ref1] getoetst;


      [ref1]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.12
    references:
      - id: ref1
        bwb_id: BWBR0030215
  - number: 7.12.1.b)
    text: |-
      beschikt over de vereiste kennis van het riviergedeelte, indien krachtens [artikel 7.05][ref1] voor het
      desbetreffende riviergedeelte een dergelijk examen vereist is.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel7
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.12
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.12.2
    text: |-
      Voor het verkrijgen van het grote patent of het kleine patent is een theoretisch examen, en voor het verkrijgen van
      het sportpatent of het overheidspatent een theoretisch en een praktisch examen vereist.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.12
  - number: 7.12.3
    text: |-
      Indien het examen niet wordt gehaald, wordende redenenaan de kandidaat meegedeeld. De examencommissie kan aan het
      opnieuw deelnemen aan een examen vereisten of voorwaarden verbinden dan wel bepaalde vrijstellingen verlenen.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.12
  - number: 7.13.1
    text: |-
      Degene die het eindexamen van een beroepsopleiding met goed gevolg heeft afgelegd, kan worden vrijgesteld van dat
      gedeelte van het examen dat betrekking heeft op kennis en vaardigheden die reeds onderwerp waren van een door de
      CCR als gelijkwaardig erkend examen.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.13
  - number: 7.13.2
    text: |-
      De houder van een bewijs van vaarbekwaamheid zoals bedoeld in [artikel 6.02, vierde lid][ref1], kan worden
      vrijgesteld bij het verwerven van het sportpatent van dat gedeelte van het examen dat betrekking heeft op nautische
      kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel6
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.13
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '6'
        hoofdstuk: '6'
  - number: 7.13.3
    text: |-
      De houder van een vaarbewijs van één der Rijnoeverstaten of België dan wel een ander geldig en door de Centrale
      Commissie voor de Rijnvaart als gelijkwaardig erkend bewijs van vaarbekwaamheid moet voor het verkrijgen van een
      Rijnpatent voldoen aan de toelatingseisen als bedoeld in [artikel 7.11][ref1], doch tijdens het examen slechts
      de kennis van de op de Rijn van toepassing zijnde reglementen en bepalingen en de kennis van het betreffende
      riviergedeelte conform [artikel 7.05][ref2] aantonen.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0030215#Artikel7
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.13
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030215
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.13.4
    text: |-
      De houder van een overheidspatent verkrijgt op aanvraag een sportpatent voor hetzelfde riviergedeelte zonder
      daarvoor examen te doen.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.13
  - number: 7.13.5
    text: |-
      Voor het verkrijgen van een ander patent als bedoeld in [artikel 6.04][ref1] of van een uitbreiding tot een ander
      riviergedeelte kan de houder van een Rijnpatent van dat deel van het examen worden vrijgesteld dat betrekking heeft
      op de kennis of de vaardigheden, die reeds voor het verkrijgen van zijn huidige patent moesten worden aangetoond.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel6
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.13
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '6'
        hoofdstuk: '6'
  - number: 7.14.1
    text: |-
      De bevoegde autoriteit geeft aan degene die het examen met goed gevolg heeft afgelegd het betreffende Rijnpatent
      af volgens het model van de [bijlage D1][ref1]. De patentkaart heeft één der navolgende opdrukken: ‘Groot Patent’,
      ‘Klein Patent’, ‘Sportpatent’ of ‘Overheidspatent’.


      [ref1]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.14
    references:
      - id: ref1
        bwb_id: BWBR0030215
  - number: 7.14.2
    text: |-
      De voorwaarden bedoeld in [artikel 7.11, eerste lid, derde volzin][ref1], moeten op de patentkaart zijn
      aangetekend.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel7
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.14
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.14.3
    text: |-
      Voor de tijd gelegen tussen het slagen voor het examen en de afgifte van het patent volgens het model van de
      [bijlage D1][ref1], verstrekt de autoriteit die het patent afgeeft een voorlopig Rijnpatent volgens het model van
      de [bijlage D2][ref2]; ook kan de bevoegde autoriteit een voorlopig Rijnpatent verstrekken voor de tijd tussen de
      vervaldatum voor de vernieuwing van het patent en de afgifte van het nieuwe Rijnpatent.


      [ref1]: https://wetten.overheid.nl/BWBR0030215
      [ref2]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.14
    references:
      - id: ref1
        bwb_id: BWBR0030215
      - id: ref2
        bwb_id: BWBR0030215
  - number: 7.14.4
    text: |-
      In geval van een uitbreiding kan een bevoegde autoriteit het in het derde lid bedoelde voorlopige Rijnpatent
      ook afgeven ter overbrugging van de tijd gelegen tussen het slagen voor het examen en de afgifte van het nieuwe
      Rijnpatent. In verband met de afgifte van een nieuw Rijnpatent volgens het model van de [bijlage D1][ref1] wordt de
      autoriteit die het patent heeft afgegeven, hiervan in kennis gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.14
    references:
      - id: ref1
        bwb_id: BWBR0030215
  - number: 7.14.5
    text: |-
      De autoriteit die het patent heeft afgegeven, geeft op verzoek een vervangend patent af indien het Rijnpatent
      onbruikbaar is geworden of verloren is gegaan. Dit patent wordt als zodanig gewaarmerkt. De houder moet bij de
      bevoegde autoriteit melding maken van het verlies. Een onbruikbaar geworden of een teruggevonden patent moet bij de
      autoriteit die het heeft afgegeven worden ingeleverd of worden overgelegd om ongeldig te worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.14
  - number: '7.15'
    text: |-
      De bevoegde autoriteit geeft aan degene die het examen voor de kennis van riviergedeelten zoals voorzien in
      [artikel 7.06, tweede lid][ref1], met goed gevolg heeft afgelegd een bewijs voor kennis van riviergedeelten af
      volgens het model van de [bijlage D3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.15
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0030215
  - number: '7.16'
    text: |-
      Het examen, de afgifte, de uitbreiding, de verlenging en het verstrekken van het Rijnpatent of een bewijs voor
      kennis van riviergedeelten, evenals de afgifte van een duplicaat en het omruilen worden gedaan tegen een redelijke
      vergoeding van de kosten door de aanvrager. De hoogte van de kosten wordt door de bevoegde autoriteit vastgesteld.
      Deze kan vanaf het tijdstip van de aanvaarding van de aanvraag gehele of gedeeltelijke betaling eisen.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.16
  - number: 7.17.1
    text: |-
      De houder van het grote patent, het kleine patent, het sportpatent of een door de CCR als gelijkwaardig erkend
      vaarbevoegdheidsbewijs moet zijn lichamelijke en geestelijke geschiktheid opnieuw aantonen door het overleggen van
      een medische verklaring, overeenkomstig [artikel 3.04, onderdeel a)][ref1] van dit reglement.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel3
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.17
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 7.17.2
    text: |-
      Hij moet zijn bewijs van lichamelijke en geestelijke geschiktheid voorleggen aan de autoriteit die het patent
      heeft afgegeven. Hij kan het bewijs ook aan een andere bevoegde autoriteit voorleggen. Deze autoriteit geeft de
      overgelegde stukken door aande autoriteit die het patent heeft afgegeven en kan in de plaats van deze autoriteit
      een tijdelijke Rijnpatent afgeven.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.17
  - number: 7.17.3
    text: |-
      Voor de houders van een als gelijkwaardig erkende verklaring, moet de medische verklaring worden overgelegd aan
      een autoriteit die voor de afgifte van een Rijnpatent gerechtigd is of aan de autoriteit die de als gelijkwaardig
      erkende verklaring heeft afgegeven.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.17
  - number: 7.18.1
    text: |-
      De autoriteit die het patent heeft afgegeven, verstrekt de houder van een patent op vertoon van een medische
      verklaring, op basis van deze verklaring:
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.18
  - number: 7.18.1.a)
    text: een nieuwe patentkaart bij het bereiken van de leeftijd van 50 en 65 jaar;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.18
  - number: 7.18.1.b)
    text: |-
      een nieuwe patentkaart of een bewijs van lichamelijke en geestelijke geschiktheid als bedoeld in
      [bijlage B3][ref1], bij het bereiken van de leeftijd van 55 en 60 jaar;


      [ref1]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.18
    references:
      - id: ref1
        bwb_id: BWBR0030215
  - number: 7.18.1.c)
    text: |-
      een bewijs van lichamelijke en geestelijke geschiktheid als bedoeld in [bijlage B3][ref1], voor de controles die na
      het bereiken van de leeftijd van 65 jaar plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.18
    references:
      - id: ref1
        bwb_id: BWBR0030215
  - number: 7.18.2
    text: |-
      Het bewijs overeenkomstig [bijlage B3][ref1], zoals bedoeld in het eerste lid, onderdelen b) en c), kan worden
      vervangen door een aantekening door de bevoegde autoriteit die het patent heeft afgegeven, op de overeenkomstig
      [bijlage B2][ref2] afgegeven medische verklaring . De aantekening op de medische verklaring moet in dit geval ook
      de geldigheidsdatum vermelden, die de geldigheidsdatum van de patentkaart in dat geval vervangt.


      [ref1]: https://wetten.overheid.nl/BWBR0030215
      [ref2]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.18
    references:
      - id: ref1
        bwb_id: BWBR0030215
      - id: ref2
        bwb_id: BWBR0030215
  - number: 7.18.3
    text: |-
      Blijkt uit de medische verklaring slechts een beperkte lichamelijke en geestelijke geschiktheid, dantekent de
      bevoegde autoriteit de aanvullende voorwaarden voor de geldigheid van het patent aan op de vernieuwde patentkaart,
      op het bewijs van lichamelijke en geestelijke geschiktheid of op de medische verklaring die is afgegeven
      overeenkomstig [bijlage B2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.18
    references:
      - id: ref1
        bwb_id: BWBR0030215
  - number: 7.18.4
    text: |-
      Wordt geen nieuwe patentkaart afgegeven, dan is het Rijnpatent slechts geldig, als de houder van het patent in het
      bezit is van een bewijs van lichamelijke en geestelijke geschiktheid bedoeld in [bijlage B3][ref1] of van een door
      de bevoegde autoriteit gewaarmerkte medische verklaring overeenkomstig [bijlage B2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030215
      [ref2]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.18
    references:
      - id: ref1
        bwb_id: BWBR0030215
      - id: ref2
        bwb_id: BWBR0030215
  - number: 7.19.1
    text: |-
      De bevoegde autoriteit, zoals deze in [artikel 7.17, derde lid][ref1], wordt gedefinieerd, geeft op vertoon
      van de medische verklaring en op basis daarvan, de houder van een door de CCR als gelijkwaardig erkend
      vaarbevoegdheidsbewijs vanaf de leeftijd van 50 jaar een verklaring van lichamelijke en geestelijke geschiktheid
      conform het model van [bijlage B3][ref2]. Gelden volgens de nationale regelgeving voor de vernieuwing van de
      verklaring van lichamelijke en geestelijke geschiktheid dezelfde eisen als volgens dit reglement en de met de
      aanvraag belaste autoriteit tevens de autoriteit is die het als gelijkwaardig erkende vaarbevoegdheidsbewijs
      afgeeft, dan kan deze ook in plaats van een verklaring voor de lichamelijke en geestelijke geschiktheid volgens
      het model van [bijlage B3][ref3], bij elke vernieuwing van de lichamelijke en geestelijke geschiktheid een nieuw
      vaarbevoegdheidsbewijs afgeven waarop de geldigheidsdatum vermeld staat.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0030215
      [ref3]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.19
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0030215
      - id: ref3
        bwb_id: BWBR0030215
  - number: 7.19.2
    text: |-
      Blijkt uit de medische verklaring slechts een beperkte lichamelijke en geestelijke geschiktheid, dan vult
      de bevoegde autoriteit op het bewijs van lichamelijke en geestelijke geschiktheid of op het vernieuwde
      vaarbevoegdheidsbewijs de aanvullende voorwaarden voor de geldigheid van het als gelijkwaardig erkende
      vaarbevoegdheidsbewijs op de Rijn in.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.19
  - number: 7.19.3
    text: |-
      Als er geen nieuw vaarbevoegdheidsbewijs wordt afgegeven, dan is het als gelijkwaardig erkende
      vaarbevoegdheidsbewijs alleengeldig, als dit vergezeld gaat van een verklaring van lichamelijke en geestelijke
      geschiktheid overeenkomstig het model van [bijlage B3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.19
    references:
      - id: ref1
        bwb_id: BWBR0030215
  - number: 7.20.1
    text: De geldigheid van een Rijnpatent wordt opgeschort
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.20
  - number: 7.20.1.a)
    text: |-
      door een beslissing van de bevoegde autoriteit die daarbij de duur van de opschorting vaststelt. De bevoegde
      autoriteit kan een dergelijke beslissing tot opschorting nemen wanneer niet aan alle voorwaarden voor intrekking is
      voldaan, maar er twijfel bestaat over de geschiktheid van de patenthouder. Indien deze twijfel vóór het einde van
      de opschortingstermijn wordt weggenomen, dient de beslissing te worden ingetrokken;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.20
  - number: 7.20.1.b)
    text: |-
      van ambtswege, zelfs zonder een dergelijke beslissing, tot aan de vernieuwing van het bewijs van lichamelijke
      en geestelijke geschiktheid, indien de lichamelijke en geestelijke geschiktheid niet binnen drie maanden na de
      verlengingstermijn, zoals vastgesteld in [artikel 3.04, onderdeel a)][ref1], opnieuw is aangetoond.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel3
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.20
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 7.20.2
    text: Heeft de bevoegde autoriteit twijfels aan de lichamelijke en geestelijke geschiktheid van een Rijnpatenthouder,
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.20
  - number: 7.20.2.a)
    text: |-
      informeert ze de autoriteit die het patent heeft afgegeven. Deze kan verlangen dat een medische verklaring
      overeenkomstig [bijlage B2][ref1], of een door de CCR als gelijkwaardig erkende medische verklaring betreffende
      de huidige staat van de lichamelijke en geestelijke geschiktheid wordt overgelegd. De houder van het patent hoeft
      alleen dan op te komen voor de kosten hiervan, als het vermoeden gegrond blijkt te zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.20
    references:
      - id: ref1
        bwb_id: BWBR0030215
  - number: 7.20.2.b)
    text: |-
      kan ze de geldigheid van het patent opschorten, voor een periode die de datum van het besluit vande autoriteit
      die het Rijnpatent heeft afgegeven op basis van de nieuwe medische verklaring niet mag overschrijden. In dit geval
      inormeert zij de CCR en de autoriteit die het patent heeft afgegeven over haar beslissing.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.20
  - number: 7.20.3
    text: |-
      In het geval zoals bedoeld in het eerste lid, onderdeel a), moet het Rijnpatent bij de bevoegde autoriteit in
      bewaring worden gegeven.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.20
  - number: '7.21'
    text: |-
      Het door de CCR als gelijkwaardig erkend vaarbevoegdheidsbewijs verliest van amtbstwege, zijn geldigheid op de
      Rijn, zelfs zonder een beslissing,
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.21
  - number: 7.21.a)
    text: |-
      wanneer het bewijs van lichamelijke en geestelijke geschiktheid conform [bijlage B3][ref1] niet wordt getoond, of
      niet binnen drie maanden na de in [artikel 3.04, onderdeel a)][ref2], bedoelde verlengingstermijn wordt vernieuwd,
      of


      [ref1]: https://wetten.overheid.nl/BWBR0030215
      [ref2]: https://wetten.overheid.nl/BWBR0030215#Artikel3
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.21
    references:
      - id: ref1
        bwb_id: BWBR0030215
      - id: ref2
        bwb_id: BWBR0030215
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 7.21.b)
    text: |-
      wanneer in de gevallen waarin de CCR overeenkomstig [artikel 7.19, eerste lid][ref1], de afgifte van een nieuw
      vaarbevoegdheidsbewijs als geldig bewijs voor de vernieuwing van de lichamelijke en geestelijke geschiktheid
      erkent, de geldigheidsdatum van het als gelijkwaardig erkende vaarbevoegdheidsbewijs sedert ten minste drie maanden
      verstreken is.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel7
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.21
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.22.1
    text: |-
      De autoriteit die het patent heeft afgegeven, moet het patent intrekken, indien blijkt dat de houder van een
      Rijnpatent in de zin van de [artikelen 7.01][ref1], [7.02][ref2] en [7.03][ref3] niet bekwaam is tot het voeren van
      een schip.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0030215#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0030215#Artikel7
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.22
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0030215
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0030215
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.22.2
    text: |-
      De autoriteit die het patent heeft afgegeven kan het patent intrekken, indien de houder van een Rijnpatent
      herhaaldelijk een voorwaarde of een beperking als bedoeld in [artikel 7.14, tweede lid][ref1], niet nakomt.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel7
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.22
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.22.3
    text: |-
      Bij intrekking verliest het Rijnpatent haar geldigheid. Het ongeldige patent dient onverwijld bij de autoriteit die
      het patent heeft afgegeven te worden ingeleverd dan wel te worden overgelegd, om ongeldig gemaakt te worden.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.22
  - number: 7.22.4
    text: 'De autoriteit die het patent heeft afgegeven, kan bij de intrekking bepalen dat:'
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.22
  - number: 7.22.4.a)
    text: vóór het einde van een bepaalde termijn geen nieuw patent mag worden afgegeven, of
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.22
  - number: 7.22.4.b)
    text: |-
      de kandidaat voor een nieuw patent, om tot een nieuw examen te worden toegelaten, aan bepaalde voorwaarden moet
      voldoen.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.22
  - number: 7.22.5
    text: |-
      Na ontvangst van de aanvraag voor het verkrijgen van een nieuw patent kan de bevoegde autoriteit de aanvrager
      geheel of gedeeltelijk van het examen vrijstellen.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.22
  - number: 7.22.6
    text: |-
      De autoriteit die het patent intrekt, deelt dit aan de Centrale Commissie voor de Rijnvaart mee. Indien een
      bevoegde autoriteit feiten vaststelt die de intrekking van een patent zouden kunnen rechtvaardigen, stelt zij de
      autoriteit die het patent heeft afgegeven hiervan in kennis.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.22
  - number: 7.23.1
    text: |-
      Indien er twijfel is over de lichamelijke en geestelijke geschiktheid van de schipper die houder is van een als
      gelijkwaardig erkend vaarbevoegdheidsbewijs, kan de bevoegde autoriteit of de bevoegde rechtbank een tijdelijk
      vaarverbod voor de Rijn opleggen, tot een nieuwe medische verklaring overeenkomstig [bijlage B2][ref1] of een door
      de CCR als gelijkwaardig erkend bewijs wordt overgelegd; de bevoegde autoriteit informeert de CCR en de autoriteit
      van afgifte over haar besluit. Wordt de twijfel op vertoon van de medische verklaring weggenomen, dan moet het
      opgelegde vaarverbod worden opgeheven. De houder van het patent hoeft alleen dan op te komen voor de kosten
      hiervan, alshet vermoeden gegrond blijkt te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.23
    references:
      - id: ref1
        bwb_id: BWBR0030215
  - number: 7.23.2
    text: |-
      De bevoegde autoriteit of de bevoegde rechtbank kan aan een schipper die houder van een als gelijkwaardig erkend
      vaarbevoegdheidsbewijs is, een tijdelijk of definitief vaarverbod op de Rijn opleggen:
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.23
  - number: 7.23.2.a)
    text: bij bewezen lichamelijke of geestelijke ongeschiktheid, of
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.23
  - number: 7.23.2.b)
    text: |-
      bij veelvuldig overtreden van belangrijke veiligheids- of gedragsvoorschriften, in het bijzonder bij
      het herhaald voeren van een schip terwijl hij een alcoholconcentratie in het bloed heeft die het in het
      [Rijnvaartpolitiereglement][ref1] vastgelegde promillage overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0006923
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.23
    references:
      - id: ref1
        bwb_id: BWBR0006923
  - number: 7.23.3
    text: |-
      Met uitzondering van noodgevallen, wordt het besluit genomen na de houder van het desbetreffende
      vaarbevoegdheidsbewijs in het kader van een procedure op tegenspraak te hebben gehoord; de autoriteit die het
      vaarbevoegdheidsbewijs heeft afgegeven en de CCR worden van het verhoor en de door de bevoegde autoriteit genomen
      beslissing in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.23
  - number: 7.24.1
    text: |-
      Indien er dringende redenen zijn om het Rijnpatent in te trekken ([artikel 7.22][ref1]) of de geldigheid daarvan op
      te schorten ([artikel 7.20, eerste lid, onderdeel a)][ref2], of er een ernstig vermoeden van fraude bestaat, kan de
      bevoegde autoriteit gelasten dat het patenttijdelijk wordt ingevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0030215#Artikel7
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.24
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0030215
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: 7.24.2
    text: |-
      Een Rijnpatent dat tijdelijk isingevorderd, moet onverwijld bij de autoriteit die het heeft afgegeven of bij de
      bevoegde rechtbank overeenkomstig de wettelijke nationale voorschriftenvan de Rijnoeverstaten en van Belgiëonder
      opgave van de redenen van de invordering , worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.24
  - number: 7.24.3
    text: |-
      De autoriteit die het patent heeft afgegeven moet onverwijld, nadat zij van het besluit van de tijdelijke
      invordering kennis heeft genomen, een beslissing nemen over de opschorting van de geldigheid of de intrekking van
      het patent. Indien een rechtbank bevoegd is, beschikt de rechter overeenkomstig de nationale voorschriften van de
      Rijnoeverstaten of België. Totdat een besluit als bedoeld in eerste of tweede zin is genomen, geldt het besluit van
      de tijdelijke invordering als een besluit in de zin van [artikel 7.20, eerste lid, onderdeel a)][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel7
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.24
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: 7.24.4
    text: |-
      De tijdelijke invordering van het Rijnpatent moet worden beëindigd en het patent moet aan de houder worden
      teruggegeven, wanneer de oorzaak daarvan is komen te vervallen of wanneer er niet totopschorting of intrekking van
      het patent wordt besloten.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.24
  - number: 7.25.1
    text: |-
      Bestaat een ernstig vermoeden dat een vaarbevoegdheidsbewijs door de autoriteit die het heeft afgegeven wordt
      ingetrokken of opgeschort, of bestaat er een ernstige verdenking van fraude, dan kan de bevoegde autoriteit de
      tijdelijke invordering van het patent gelasten.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.25
  - number: 7.25.2
    text: |-
      Een tijdelijk ingevorderd vaarbevoegdheidsbewijs moet onverwijld aan de autoriteit die dit heeft afgegeven, worden
      overgelegd.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.25
  - number: 7.25.3
    text: |-
      De autoriteit die het vaarbevoegdheidsbewijs heeft afgegeven, voert de noodzakelijke controles uit en informeert
      de bevoegde autoriteit die het vaarbevoegdheidsbewijs heeft ingevorderd en de CCR onverwijld over de geldigheid van
      het document.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.25
  - number: '8.01'
    text: 'Degene die een radarpatent wil verkrijgen, moet:'
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel8.01
  - number: 8.01.a)
    text: ten minste 18 jaar oud,
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel8.01
  - number: 8.01.b)
    text: houder van een schipperspatent en
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel8.01
  - number: 8.01.c)
    text: houder van een marifoonbedieningscertificaat zijn.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel8.01
  - number: 8.02.1
    text: |-
      De kandidaat voor een radarpatent moet een aanvraag voor toelating tot het examen en tot afgifte van een patent
      richten aan de bevoegde autoriteit, onder opgave van de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel8.02
  - number: 8.02.1.a)
    text: voor- en achternaam;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel8.02
  - number: 8.02.1.b)
    text: geboortedatum en -plaats;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel8.02
  - number: 8.02.1.c)
    text: adres.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel8.02
  - number: 8.02.2
    text: 'Bij de aanvraag moeten worden overgelegd:'
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel8.02
  - number: 8.02.2.a)
    text: een recente pasfoto;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel8.02
  - number: 8.02.2.b)
    text: een kopie van de identiteitskaart of het paspoort;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel8.02
  - number: 8.02.2.c)
    text: een kopie van het schipperspatent;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel8.02
  - number: 8.02.2.d)
    text: een kopie van het marifoonbedieningscertificaat.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel8.02
  - number: 8.03.1
    text: |-
      De bevoegde autoriteit benoemt één of meer examencommissies voor het afnemen van de examens. Iedere examencommissie
      bestaat uit een voorzitter die vertegenwoordiger is van de bevoegde autoriteit, en ten minste twee examinatoren die
      voldoende ter zake kundig zijn.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel8.03
  - number: 8.03.2
    text: |-
      De examinator die toeziet op het verloop van het praktijkgedeelte van het examen moet houder van het radarpatent
      zijn.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel8.03
  - number: 8.04.1
    text: |-
      De kandidaat moet tijdens het examen overeenkomstig het examenprogramma zoals vermeld in [bijlage D8][ref1]
      (theoretisch en praktijkgedeelte), ten overstaan van een examencommissie zoals bedoeld in [artikel 8.03][ref2]
      aantonen dat hij beschikt over voldoende kennis om een schip te voeren met behulp van radar.


      [ref1]: https://wetten.overheid.nl/BWBR0030215
      [ref2]: https://wetten.overheid.nl/BWBR0030215#Artikel8
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel8.04
    references:
      - id: ref1
        bwb_id: BWBR0030215
      - id: ref2
        bwb_id: BWBR0030215
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.04.2
    text: Het praktijkexamen kan ook op een door de bevoegde autoriteit hiervoor toegelaten radarsimulator worden afgenomen.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel8.04
  - number: 8.04.3
    text: |-
      Aan het in het eerste lid gestelde vereiste wordt voldaan wanneer de kandidaat een ander bewijs bezit dan
      voorgeschreven volgens dit reglement, voor zover dit bewijs door de bevoegde autoriteit van één der Rijnoeverstaten
      of België als gelijkwaardig is erkend.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel8.04
  - number: 8.04.4
    text: |-
      De kandidaat die voor het theoretische of praktische onderdeel van het examen is gezakt, kan voor dit onderdeel
      binnen een door de bevoegde autoriteit vastgestelde termijn, die niet korter dan twee maanden mag zijn, bij
      dezelfde examencommissie een herexamen doen. Indien de kandidaat niet binnen een jaar voor het herexamen is
      geslaagd, moet hij opnieuw alle onderdelen van het examen afleggen.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel8.04
  - number: 8.04.5
    text: |-
      De examencommissie deelt aan iedere kandidaat persoonlijk de uitslag van het examen mee. Op verzoek van de
      kandidaat moet de examencommissie mondeling inlichtingen verstrekken over de door hem gemaakte fouten en kan zij
      hem tevens toestaan zijn examendocumenten in te zien.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel8.04
  - number: 8.05.1
    text: |-
      Indien de kandidaat voor het examen is geslaagd, verstrekt de bevoegde autoriteit hem het radarpatent dat overeen
      moeten stemmen met het model van [bijlage D4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel8.05
    references:
      - id: ref1
        bwb_id: BWBR0030215
  - number: 8.05.2
    text: |-
      De verkrijging van het radarpatent kan bovendien worden bevestigd door inschrijving van het woord ‘radar’ op de
      schipperspatentkaart.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel8.05
  - number: 8.05.3
    text: |-
      Op de radarpatenten, bedoeld in [artikel 6.03, tweede lid][ref1], wordt aangetekend: ‘Alleen geldig voor het voeren
      van een veerpont tussen ........ en ..........’.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel6
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel8.05
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '6'
        hoofdstuk: '6'
  - number: 8.05.4
    text: |-
      Is een radarpatent onbruikbaar geworden of verloren gegaan, verstrekt de autoriteit die het heeft afgegeven op
      aanvraag een duplicaat, dat als zodanig is gewaarmerkt. De houder moet het verlies bij de bevoegde autoriteit
      melden. Een onbruikbaar geworden of een teruggevonden patent moet bij de autoriteit die het heeft afgegeven, worden
      ingeleverd of worden overgelegd om ongeldig te worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel8.05
  - number: '8.06'
    text: |-
      Het radarpatent kan door de bevoegde autoriteit die het radarpatent heeft afgegeven, worden ingetrokken, wanneer de
      houder bij het voeren van een schip met behulp van radar een voor de scheepvaart gevaar veroorzakende onbekwaamheid
      aan de dag heeft gelegd. Het radarpatent kan tijdelijk dan wel permanent worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel8.06
  - number: 8.07.1
    text: |-
      De bevoegde autoriteit of de bevoegde rechter kan de schipper die houder van een als gelijkwaardig erkend
      radargetuigschrift is, een tijdelijk of definitief verbod voor het voeren van een schip met radar op de Rijn
      opleggen, wanneer de houder bij het voeren van een schip een voor de scheepvaart gevaarzettende onbekwaamheid heeft
      begaan.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel8.07
  - number: 8.07.2
    text: |-
      Met uitzondering van noodgevallen, wordt het besluit genomen na de houder van het desbetreffende radargetuigschrift
      in het kader van een procedure op tegenspraak te hebben gehoord; de autoriteit die het radargetuigschrift heeft
      afgegeven en de CCR worden van het horen en de door de bevoegde autoriteit genomen beslissing in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel8.07
  - number: '8.08'
    text: |-
      Het examen, de afgifte, de verstrekking van een duplicaat en het omruilen van het radarpatent geschieden tegen een
      redelijke vergoeding van de kosten door de aanvrager. De hoogte van de kosten wordt door de bevoegde autoriteit
      vastgesteld. Deze kan verlangen dat de kosten in hun geheel of ten dele bij de aanvaarding van de aanvraag worden
      voldaan.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel8.08
  - number: '9.01'
    text: |-
      Vaartijdenboeken en dienstboekjes, afgegeven overeenkomstig de voorschriften die van toepassing zijn tot aan de
      inwerkingtreding van dit reglement dan wel waarvan de geldigheid krachtens de genoemde voorschriften verlengd werd,
      blijven geldig met inachtneming van die voorschriften tot de eerste vernieuwing.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel9.01
  - number: 9.02.1
    text: |-
      Patenten voor het varen op de Rijn, afgegeven overeenkomstig de voorschriften die van toepassing zijn tot aan de
      inwerkingtreding van dit reglement dan wel waarvan de geldigheid krachtens de genoemde voorschriften verlengd werd,
      blijven geldig met inachtneming van die voorschriften tot de eerste vernieuwing van het bewijs van lichamelijke en
      geestelijke geschiktheid.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel9.02
  - number: 9.02.2
    text: |-
      De bepalingen van [artikel 7.17][ref1] betreffende de controle van de lichamelijke en geestelijke geschiktheid
      zijn van toepassing op de houders van het in het eerste lid bedoelde Rijnschipperspatent, kleine patent
      en sportpatent, waarbij het anomaalquotiënt bij het kleuronderscheidingsvermogen 0,7 tot 3,0 mag bedragen.
      De houders van een patent die bij de inwerkingtreding van dit reglement reeds de leeftijd, bedoeld in
      [artikel 3.04, onderdeel a)][ref2], hebben bereikt, moeten hun bewijs van lichamelijke en geestelijke geschiktheid
      bij de eerstvolgende voorgeschreven onderzoeksdatum vernieuwen. Bij de eerste verlenging van het bewijs van
      lichamelijke en geestelijke geschiktheid wordt een patent volgens het model van de [bijlage D1][ref3] afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0030215#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel9.02
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0030215
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0030215
  - number: 9.02.3
    text: |-
      De bepalingen van de [artikelen 7.20][ref1] en [7.22][ref2] zijn van toepassing op de patenten als bedoeld in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0030215#Artikel7
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel9.02
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0030215
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: 9.02.4
    text: |-
      Radarpatenten en radardiploma’s afgegeven overeenkomstig de voorschriften die van toepassing zijn tot aan de
      inwerkingtreding van dit reglement, blijven geldig met inachtneming van die voorschriften. Zij kunnen worden
      vervangen door radarpatenten conform dit reglement.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel9.02
  - number: 9.03.1
    text: |-
      Geldige patenten zoals bedoeld in [artikel 9.02, eerste lid][ref1], stemmen overeen met de patenten zoals bedoeld
      in [artikel 6.04, eerste lid][ref2], zoals in onderstaande tabel is aangegeven:







                      De volgende geldige patenten als bedoeld in [artikel 9.01, eerste lid][ref3]


                      stemmen overeen met


                      de patenten als bedoeld in [artikel 6.04, eerste lid][ref4], van dit reglement






                      Rijnschipperspatent


                      →


                      Groot patent




                      Klein patent


                      →


                      Klein patent




                      Politiebotenpatent


                      →


                      Overheidspatent




                      Douanebotenpatent


                      →


                      Overheidspatent




                      Brandweerbotenpatent


                      →


                      Overheidspatent




                      Sportpatent


                      →


                      Sportpatent


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0030215#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0030215#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0030215#Artikel6
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel9.03
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0030215
        artikel: '6'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0030215
        artikel: '9'
        hoofdstuk: '9'
      - id: ref4
        bwb_id: BWBR0030215
        artikel: '6'
        hoofdstuk: '6'
  - number: 9.03.2
    text: |-
      Een geldig patent kan volgens de tabel in het eerste lid worden omgewisseld voor het gelijkwaardige patent voor
      hetzelfde riviergedeelte.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel9.03
  - number: '9.04'
    text: |-
      De vaartijd en de reizen die vóór de inwerkingtreding van dit reglement zijn gemaakt, worden overeenkomstig de
      vroeger hiervoor geldende voorschriften in beschouwing genomen.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel9.04
  - number: '9.05'
    text: |-
      De bevoegde autoriteiten verstrekken een verklaring overeenkomstig [artikel 4a.02][ref1] aan bemanningsleden
      van schepen die vóór 1 juli 2016 zijn begonnen met het gebruik van LNG als brandstof, wanneer de betrokken
      bemanningsleden op grond van een aanbeveling van de CCR krachtens [artikel 2.19 van het ROSR][ref2] zijn opgeleid
      en een vaartijd van ten minste 90 dagen op dergelijke schepen kunnen aantonen.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0025973#Artikel2
