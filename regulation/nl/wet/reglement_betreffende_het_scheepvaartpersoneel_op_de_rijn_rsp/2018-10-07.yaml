        bwb_id: BWBR0030215
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.19.2
    text: |-
      Ten aanzien van bunkerschepen, die slechts op korte riviergedeelten ingezet mogen worden, kan de Commissie van
      Deskundigen een minimumbemanning voorschrijven die afwijkt van [artikel 3.15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel3
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.19.3
    text: De Commissie van Deskundigen schrijft deze aantekeningen in onder nummer 48 van het binnenschipcertificaat.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.19
  - number: 3.20.1
    text: Voor de bepaling van de minimumbemanning van zeeschepen is deel II van dit reglement van toepassing.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.20
  - number: 3.20.2
    text: |-
      In afwijking van het eerste lid kunnen zeeschepen blijven varen onder de bemanningsregeling die voorzien is in
      de bepalingen vanResolutie A. 481 (XII) van de IMO en van het Internationaal Verdrag van 1978 over de normen voor
      zeevarenden betreffende opleiding, diplomering en wachtdienst, onder de voorwaarde dat het aantal bemanningsleden
      ten minste overeenkomt met de minimumbemanning zoals voorgeschreven in deel II voor exploitatiewijze B, waarbij
      met name rekening dient te worden gehouden met [artikel 3.14][ref1] en [3.18][ref2] van dit reglement In dit
      geval moeten de dienovereenkomstige documenten waaruit de bekwaamheid van de bemanningsleden en hun aantal
      blijkt, aan boord aanwezig zijn. Bovendien moet zich een persoon aan boord bevinden die houder is van het grote
      patent overeenkomstig dit reglement, dat geldig is voor het te bevaren riviergedeelte. Na een vaartijd van ten
      hoogste 14 uur per periode van 24 uur moet deze patenthouder door een andere patenthouder worden vervangen. In het
      vaartijdenboek moeten de volgende aantekeningen worden gemaakt:


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0030215#Artikel3
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.20
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0030215
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.20.2.a)
    text: de naam van de patenthouders die zich aan boord bevinden, alsmede het begin en einde van hun diensttijd;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.20
  - number: 3.20.2.b)
    text: |-
      begin, onderbreking, voortzetting en einde van de vaart met vermelding van de volgende gegevens: datum, tijdstip en
      plaats met aanduiding van de kilometerraai.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.20
  - number: '3.21'
    text: |-
      De bepalingen van hoofdstuk 3 zijn niet van toepassing op kanaalspitsen. Desalniettemin moet de bemanning ten
      minste bestaan uit: - een schipper die houder is van een patent als bedoeld in dit reglement;
        - een persoon die ten minste 16 jaar oud is en die in staat is te helpen bij het manoeuvreren met het schip.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.21
  - number: '3.22'
    text: |-
      De bepalingen van hoofdstuk 3 zijn niet van toepassing op pleziervaartuigen. Desalniettemin moet de bemanning ten
      minste bestaan uit: - een schipper die houder is van een patent als bedoeld in dit reglement;
        - een persoon die in staat is te helpen bij het manoeuvreren met het schip.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.22
  - number: '3.23'
    text: |-
      Voor de vaart beneden het Spijksche Veer (km 857,40) kan, voor zover de Duits-Nederlandse grens tijdens de
      vaart noch in de ene, noch in de andere richting wordt overschreden, worden volstaan met de toepassing van de
      voorschriften van de Nederlandse ‘[Binnenvaartwet][ref1]’ (Staatsblad 2007, Nummer 498).


      [ref1]: https://wetten.overheid.nl/BWBR0023009
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0023009
  - number: '4.01'
    text: |-
      Aan boord van schepen die gevaarlijke stoffen vervoeren, moet een persoon houder zijn van een verklaring van
      deskundigen volgens het model van randnummer 8.6.2. van het ADN, overeenkomstig de randnummers 7.1.3.15 en 7.2.3.15
      van het ADN.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel4.01
  - number: 4a.01.1
    text: |-
      De schipper en de bij de bunkerprocedure betrokken bemanningsleden van schepen die vloeibaar aardgas (LNG) als
      brandstof gebruiken, moeten over een deskundigheid aangaande het gebruik van vloeibaar aardgas als brandstof
      beschikken.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel4a.01
  - number: 4a.01.2
    text: |-
      Een bemanningslid mag pas werkzaamheden aan boord uitoefenen na instructies van de schipper te hebben gekregen
      over het gebruik van vloeibaar aardgas (LNG) als brandstof op het desbetreffende schip en met name over de
      bunkerprocedure.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel4a.01
  - number: 4a.02
    text: |-
      De betrokken bemanningsleden tonen hun kennis aan door middel van een verklaring overeenkomstig het
      model van [bijlage E1][ref1]. De verklaring wordt afgegeven wanneer de kandidaat voldoet aan de eisen van
      [artikelen 4a.03][ref2] en [4a.04][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0030215
      [ref2]: https://wetten.overheid.nl/BWBR0030215#Artikel4a
      [ref3]: https://wetten.overheid.nl/BWBR0030215#Artikel4a
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel4a.02
    references:
      - id: ref1
        bwb_id: BWBR0030215
      - id: ref2
        bwb_id: BWBR0030215
        artikel: 4a
        hoofdstuk: 4a
      - id: ref3
        bwb_id: BWBR0030215
        artikel: 4a
        hoofdstuk: 4a
  - number: 4a.03
    text: |-
      De cursus inzake de kennis bestaat uit een theoretisch gedeelte en een praktisch gedeelte en wordt door een examen
      afgesloten. Het theoretische gedeelte van de cursus omvat de in [bijlage E2][ref1], deel A, genoemde onderwerpen.
      Het praktische gedeelte van de cursus betreft de toepassing van de verworven theoretische kennis in de praktijk aan
      boord van een schip dat vloeibaar aardgas (LNG) als brandstof gebruikt en/of in een daartoe geschikte installatie
      aan de wal. Het omvat de in [bijlage E2][ref2], deel B, genoemde onderwerpen. Het examen bestaat uit een
      theoretisch en uit een praktisch deel. Het omvat alle in [bijlage E2][ref3], deel A en deel B genoemde onderwerpen.
      Het examen is met goed gevolg afgelegd wanneer de kandidaat in beide geëxamineerde delen heeft aangetoond over
      voldoende kennis en vaardigheden te beschikken. Het praktisch deel van het examen wordt aan boord van een schip en/
      of aan de wal afgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0030215
      [ref2]: https://wetten.overheid.nl/BWBR0030215
      [ref3]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel4a.03
    references:
      - id: ref1
        bwb_id: BWBR0030215
      - id: ref2
        bwb_id: BWBR0030215
      - id: ref3
        bwb_id: BWBR0030215
  - number: 4a.04.1
    text: De verklaring heeft een geldigheidsduur van vijf jaar.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel4a.04
  - number: 4a.04.2
    text: |-
      De geldige verklaring overeenkomstig het model van [bijlage E1][ref1] wordt op verzoek van de houder door de
      bevoegde autoriteit met vijf jaar verlengd met ingang van de datum van aanvraag wanneer de houder:


      [ref1]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel4a.04
    references:
      - id: ref1
        bwb_id: BWBR0030215
  - number: 4a.04.2.a)
    text: |-
      de onderstaande vaartijd kan aantonen op een schip dat vloeibaar aardgas (LNG) als brandstof gebruikt: - ten minste
      180 dagen voor de voorafgaande periode van vijf jaar, of
        - ten minste 90 dagen voor de voorafgaande periode van een jaar; of, wanneer dit niet het geval is,
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel4a.04
  - number: 4a.04.2.b)
    text: |-
      aan een opfriscursus met examen heeft deelgenomen. De bepalingen van [artikel 4a.03][ref1] zijn van overeenkomstige
      toepassing op de inhoud van de opfriscursus en van het examen, waarbij de cursus- en examenomvang wordt
      teruggebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel4a
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel4a.04
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: 4a
        hoofdstuk: 4a
  - number: 4a.05
    text: |-
      De bevoegdheid om erkende cursussen en opfriscursussen te verzorgen, examens af te nemen en verklaringen
      overeenkomstig het model van [bijlage E1][ref1] af te geven ligt bij erkende opleidingsinstituten. De cursussen,
      opfriscursussen en opleidingsinstituten worden erkend door de bevoegde autoriteiten op basis van de uniforme
      criteria die door de CCR zijn vastgelegd. De bevoegde autoriteit kan zich het recht voorbehouden om zelf de
      verklaringen af te geven of te verlengen. Elke bevoegde autoriteit is bevoegd voor de verlenging van verklaringen
      op grond van vaartijd. De bevoegde autoriteiten stellen de CCR in kennis van elke beslissing over de erkenning
      van een opleidingsinstituut of over de intrekking of de opschorting van een dergelijke erkenning. De lijst van de
      erkende opleidingsinstituten en cursussen wordt via elektronische weg gepubliceerd door de CCR.


      [ref1]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel4a.05
    references:
      - id: ref1
        bwb_id: BWBR0030215
  - number: 5.01.1
    text: |-
      Aan boord van elk passagiersschip moet veiligheidspersoneel in voldoende aantal aanwezig zijn zolang er passagiers
      aan boord zijn.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel5.01
  - number: 5.01.2
    text: De leden van het veiligheidspersoneel kunnen deel uitmaken van de bemanning of het boordpersoneel.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel5.01
  - number: '5.02'
    text: |-
      De deskundige voor de passagiervaart moet ten minste 18 jaar zijn en de vereiste bekwaamheid bezitten. Deze wordt
      geacht aanwezig te zijn, indien de betreffende persoon:
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel5.02
  - number: 5.02.a)
    text: |-
      aan een door de bevoegde autoriteit erkende basisopleiding heeft deelgenomen, die ten minste aan de in
      [artikel 5.03][ref1] gestelde eisen voldoet, en het examen met goed gevolg heeft afgelegd, en


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel5
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel5.02
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 5.02.b)
    text: |-
      regelmatig overeenkomstig [artikel 5.04, tweede lid][ref1], wordt bijgeschoold.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel5
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel5.02
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '5.03'
    text: |-
      Personen die de taak als deskundige in de zin van [artikel 5.02][ref1] moeten waarnemen, moeten voor het verkrijgen
      van de vakkennis aan een basisopleiding deelnemen. De basisopleiding moet in het kader van een door de bevoegde
      autoriteit georganiseerde of door haar erkende opleiding worden gevolgd en moet ten minste bestaan uit:


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel5
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel5.03
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 5.03.a)
    text: |-
      theoretische scholing over: - voorgeschreven inrichting en uitrusting van passagiersschepen;
        - veiligheidsvoorschriften en inleiding over de vereiste hulpmaatregelen;
        - taken van de bemanning en van het boordpersoneel overeenkomstig het veiligheidsdossier;
        - grondbeginselen betreffende de stabiliteit van passagiersschepen bij averij;
        - voorkoming van brand, brandbestrijding, gebruik van brandblusinrichtingen (werking van automatische
      sprinklerinstallaties, brandmeldsystemen en vast geïnstalleerde brandblusinstallaties);
        - keuringsbewijs van de veiligheidsinrichtingen en -uitrustingen;
        - principes van conflictbeheersing;
        - grondbeginselen ter voorkoming van paniekreacties;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel5.03
  - number: 5.03.b)
    text: |-
      praktische scholing over: - kennis betreffende de bediening en het gebruik van de veiligheidsuitrusting van
      passagiersschepen (bijvoorbeeld het gebruik van reddingsvesten, het gebruik van drijflichamen, de omgang met de
      bijboot en met de overige reddingsmiddelen, de bediening van draagbare brandblusapparaten);
        - kennis betreffende de praktische omzetting van veiligheidsvoorschriften en het treffen van de noodzakelijke
      reddingsmaatregelen (bijvoorbeeld de evacuatie van passagiers uit een ruimte vol rook naar een veilige omgeving, de
      bestrijding van een beginnende brand, het gebruik van de waterdichte en brandwerende deuren);
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel5.03
  - number: 5.03.c)
    text: een afsluitend examen.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel5.03
  - number: 5.04.1
    text: |-
      De deskundige voor de passagiersvaart moet voor het einde van een termijn van 5 jaar na een succesvolle deelname
      aan de basisopleiding, aan een door de bevoegde autoriteit erkende opfriscursus deelnemen.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel5.04
  - number: 5.04.2
    text: |-
      De opfriscursus moet met name betrekking hebben op typische gevaarsituaties (zoals bijvoorbeeld het voorkomen
      van paniek, brandbestrijding) en – voor zover mogelijk – informeren over nieuwe ontwikkelingen op het gebied van
      passagiersveiligheid. Tijdens de herhalingscursus moet door middel van oefeningen en tests worden vastgesteld dat
      de deelnemer actief aan de cursus heeft deelgenomen.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel5.04
  - number: 5.04.3
    text: |-
      De deskundige voor de passagiersvaart moet telkens voor het einde van een termijn van 5 jaar na deelname aan de
      vorige herhalingscursus opnieuw aan een herhalingscursus deelnemen.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel5.04
  - number: '5.05'
    text: |-
      De eerste hulpverlener moet ten minste 17 jaar zijn en de vereiste bekwaamheid bezitten. Deze wordt geacht aanwezig
      te zijn, indien de desbetreffende persoon
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel5.05
  - number: 5.05.a)
    text: aan een cursus voor eerste hulpverlener heeft deelgenomen, en
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel5.05
  - number: 5.05.b)
    text: |-
      regelmatig overeenkomstig [artikel 5.07][ref1] wordt bijgeschoold.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel5
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel5.05
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '5.06'
    text: |-
      De persluchtmaskerdrager moet ten minste 18 jaar zijn en de vereiste bekwaamheid bezitten, om de
      ademhalingsapparatuur zoals bedoeld in [artikel 19.12, tiende lid, onderdeel a, van ES-TRIN][ref1], voor de redding
      van personen te kunnen gebruiken. Deze wordt geacht aanwezig te zijn, indien de betreffende persoon de lichamelijke
      en geestelijke geschiktheid en de bekwaamheid overeenkomstig de nationale voorschriften van de Rijnoeverstaten of
      België aantoont en regelmatig overeenkomstig [artikel 5.07][ref2] is bijgeschoold.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0030215#Artikel5
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel5.06
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0030215
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '5.07'
    text: |-
      De opleiding en bijscholing voor eerste hulpverleners en persluchtmaskerdragers moeten gevolgd worden
      overeenkomstig de voorschriften van één van de Rijnoeverstaten of België.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel5.07
  - number: 5.08.1
    text: |-
      De bekwaamheid van deskundige voor de passagiersvaart wordt bevestigd door een verklaring van deskundige voor
      de passagiersvaart volgens het model van [bijlage C1][ref1], die wordt afgegeven door de bevoegde autoriteit
      of het opleidingsinstituut. Na deelname aan een herhalingscursus verlengt de bevoegde autoriteit of het
      opleidingsinstituut de verklaring van de deelnemer als deskundige voor de passagiersvaart met 5 jaar, of wordt hem
      een nieuwe verklaring verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel5.08
    references:
      - id: ref1
        bwb_id: BWBR0030215
  - number: 5.08.2
    text: |-
      Op vertoon van het cursusbewijs geeft de bevoegde autoriteit een verklaring af betreffende de bevoegdheidals
      eerste hulpverlener volgens het model van [bijlage C2][ref1] of verlengt deze. Als verklaringen gelden ook de
      documenten van de nationale of regionale organisaties van het Rode Kruis of vergelijkbare nationale of regionale
      reddingsorganisaties die door de Centrale Commissie voor de Rijnvaart gepubliceerd worden.


      [ref1]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel5.08
    references:
      - id: ref1
        bwb_id: BWBR0030215
  - number: 5.08.3
    text: |-
      Op vertoon van het cursusbewijs geeft de bevoegde autoriteit een verklaring af betreffende de bevoegdheid als
      persluchtmaskerdrager volgens het model van [bijlage C3][ref1] of verlengt deze. Deze cursusbewijzen gelden als
      verklaring, als deze zijn afgegeven door een volgens het nationale recht van de Rijnoeverstaten of België erkend
      opleidingsinstituut en door de Centrale Commissie voor de Rijnvaart gepubliceerd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel5.08
    references:
      - id: ref1
        bwb_id: BWBR0030215
  - number: 5.08.4
    text: |-
      De verklaring van deskundige voor de passagiersvaart overeenkomstig [bijlage C1][ref1], de verklaring van
      eerste hulpverlener overeenkomstig [bijlage C2][ref2] en de verklaring van persluchtmaskerdrager overeenkomstige
      [bijlage C3][ref3] kunnen in één enkel document overeenkomstig [bijlage C4][ref4] worden samengevat.


      [ref1]: https://wetten.overheid.nl/BWBR0030215
      [ref2]: https://wetten.overheid.nl/BWBR0030215
      [ref3]: https://wetten.overheid.nl/BWBR0030215
      [ref4]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel5.08
    references:
      - id: ref1
        bwb_id: BWBR0030215
      - id: ref2
        bwb_id: BWBR0030215
      - id: ref3
        bwb_id: BWBR0030215
      - id: ref4
        bwb_id: BWBR0030215
  - number: 5.09.1
    text: |-
      Deskundigen voor de passagiersvaart, eerste hulpverleners en persluchtmaskerdragers moeten ten minste in de
      navolgende aantallen aanwezig zijn:
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel5.09
  - number: 5.09.1.a)
    text: 'gedurende de vaart aan boord:'
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel5.09
  - number: 5.09.1.a).aa)
    text: |-
      schepen voor dagtochten








                              groep


                              Aantal personenaan boord


                              Deskundige voor de passagiersvaart


                              Eerste hulpverleners






                              1


                              tot 250


                              1


                              1




                              2


                              meer dan 250


                              1


                              2
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel5.09
  - number: 5.09.1.a).bb)
    text: |-
      hotelschepen









                              groep


                              Aantal bezette bedden


