    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel5.09
  - number: 5.09.1.b)
    text: |-
      permanent beschikbaar tijdens het stilliggen: het in bovenstaande tabel voorgeschreven veiligheidspersoneel in
      onderdeel a)voor groep 1 .
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel5.09
  - number: 5.09.2
    text: |-
      Op schepen voor dagtochten met een toegelaten aantal personen van niet meer dan 75 en op stilliggende
      passagiersschepen mogen de functies van deskundigen voor de passagiersvaart en eerste hulpverlener door één en
      dezelfde persoon worden waargenomen. In alle andere gevallen mag de taak van deskundige voor de passagiersvaart,
      eerste hulpverlener en persluchtmaskerdrager niet door één en dezelfde persoon worden waargenomen.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel5.09
  - number: 5.10.1
    text: |-
      Onverminderd de voorschriften van het [Rijnvaartpolitiereglement][ref1] moet de schipper:


      [ref1]: https://wetten.overheid.nl/BWBR0006923
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel5.10
    references:
      - id: ref1
        bwb_id: BWBR0006923
  - number: 5.10.1.a)
    text: |-
      de deskundige voor de passagiersvaart met het veiligheidsdossier en het veiligheidsplan, zoals bedoeld in
      [artikel 19.13 van ES-TRIN][ref1] vertrouwd maken,


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel19
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel5.10
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '19'
  - number: 5.10.1.b)
    text: het veiligheidspersoneel instruëren en bekend maken met het passagiersschip,
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel5.10
  - number: 5.10.1.c)
    text: |-
      de vereiste bevoegdheid van het veiligheidspersoneel aan boord, zoals bedoeld in de
      [artikelen 5.02 tot en met 5.07][ref1], op ieder momentaan de hand van de verklaringen zoals bedoeld in
      [artikel 5.08][ref2] kunnen aantonen,


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0030215#Artikel5
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel5.10
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0030215
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 5.10.1.d)
    text: ervoor zorgen dat gecontroleerd kan worden dat er regelmatig veiligheidsrondes plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel5.10
  - number: 5.10.2
    text: |-
      De deskundige voor de passagiersvaart moet zorgdragen voor de surveillance van de veiligheidsinrichtingen en
      -uitrustingen overeenkomstig het veiligheiddossier en voor de veiligheid van de passagiersschepen in geval van
      gevaar en in noodsituaties aan boord. Hij moet het veiligheiddossier en het veiligheidsplan in detail kennen en
      overeenkomstig de door de schipper verstrekte instructies:
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel5.10
  - number: 5.10.2.a)
    text: |-
      de leden van de bemanning en het boordpersoneel die op grond van het veiligheidsdossier in noodsituaties bepaalde
      taken te vervullen hebben, deze taken toekennen;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel5.10
  - number: 5.10.2.b)
    text: de leden van de bemanning en het boordpersoneel regelmatig over de hun toebedeelde taken informeren;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel5.10
  - number: 5.10.2.c)
    text: |-
      de passagiers aan boord van hotelschepen bij het begin van de reis over de gedragsregels en de inhoud van het
      veiligheidsplan informeren.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel5.10
  - number: '5.11'
    text: |-
      Zolang zich passagiers aan boord bevinden, moet er ’s nachts ieder uur een controleronde gemaakt worden. Er moet op
      een adequate wijze kunnen worden gecontroleerd of deze rondes plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel5.11
  - number: '6.01'
    text: |-
      Dit deel regelt de verplichting tot het hebben van een patent voor de scheepvaart op de Rijn voor de verschillende
      scheepstypes en -afmetingen en voor de te bevaren riviergedeelten, alsmede de voorwaarden voor het verkrijgen van
      een patent.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel6.01
  - number: 6.02.1
    text: |-
      Degene die op de Rijn een schip wil voeren, moet houder zijn van een overeenkomstig het onderhavige reglement
      afgegeven Rijnpatent of een door de CCR als gelijkwaardig erkend vaarbevoegdheidsbewijs voor het type en de
      afmetingen van het betreffende schip, alsmede voor het te bevaren riviergedeelte; de lijst van de als gelijkwaardig
      erkende vaarbevoegdheidsbewijzen alsmede de eventuele aanvullende voorwaarden voor deze erkenning zijn in
      [bijlage D5][ref1] opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel6.02
    references:
      - id: ref1
        bwb_id: BWBR0030215
  - number: 6.02.2
    text: |-
      Het Rijnpatent wordt verleend voor de gehele Rijn of voor een bepaald gedeelte daarvan; wordt het voor een
      bepaald riviergedeelte afgegeven, dan geldt het ook voor de vaart benedenstrooms van het Spijksche Veer (km
      857,40) en op het gedeelte tussen Bazel (Mittlere Rheinbrücke km 166,64) en de sluizen van Iffezheim (km 335,92).
      De als gelijkwaardig erkende vaarbevoegdheidsbewijzen gelden slechts op de in [artikel 7.05][ref1] beschreven
      riviergedeelten, als de bezitter een bewijs voor riviergedeelten conform het model van [bijlage D3][ref2] bezit.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel6.02
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0030215
  - number: 6.02.3
    text: |-
      Voor de vaart benedenstrooms van het Spijksche Veer (km 857,40) en op het riviergedeelte tussen Bazel (Mittlere
      Rheinbrücke – km 166,64) en de sluizen van Iffezheim (km 335,92), kan worden volstaan met:
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel6.02
  - number: 6.02.3.a)
    text: |-
      in plaats van het in [artikel 7.01][ref1] bedoelde patent , een vaarbewijs als bedoeld in bijlage I van [Richtlijn
      91/672/EEG](31991L0672), of een vaarbewijs afgegeven krachtens [Richtlijn 96/50/EG](31996L0050);


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel7
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel6.02
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 6.02.3.b)
    text: |-
      in plaats van het patent, zoals bedoeld in de [artikelen 7.02 tot en met 7.04][ref1], een ander door de bevoegde
      autoriteit als gelijkwaardig erkend bewijs van vaarbekwaamheid.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel7
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel6.02
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 6.02.4
    text: |-
      Voor schepen met een lengte van minder dan 15 m, met uitzondering van passagiersschepen, duw- en sleepboten, kan
      worden volstaan met een bewijs van vaarbekwaamheid voor de binnenwateren dat in overeenstemming is met de nationale
      voorschriften van de Rijnoeverstaten en België.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel6.02
  - number: 6.02.5
    text: |-
      De verplichting tot het hebben van een patent wordt uitsluitend geregeld door de nationale voorschriften van de
      Rijnoeverstaten
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel6.02
  - number: 6.02.5.a)
    text: voor veerponten;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel6.02
  - number: 6.02.5.b)
    text: voor schepen die slechts door spierkracht worden voortbewogen;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel6.02
  - number: 6.02.5.c)
    text: |-
      voor schepen met een lengte van minder dan 15 m die slechts door middel van zeilen worden voortbewogen of voorzien
      zijn van een aandrijvingsmotor met een vermogen van niet meer dan 3,68 kW.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel6.02
  - number: 6.03.1
    text: |-
      Degene die op de Rijn op radar wil varen moet, naast het voor het te bevaren riviergedeelte benodigde
      schipperspatent, houder zijn van een radarpatent dat in overeenstemming met dit reglement is afgegeven of van
      een ander door de CCR als gelijkwaardig erkendbewijs van bekwaamheid voor de radarvaart. De lijst van de als
      gelijkwaardig erkende ’bewijzen van bekwaamheid voor de radarvaart, alsmede de eventuele aanvullende voorwaarden
      voor deze erkenning zijn in [bijlage D6][ref1] opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel6.03
    references:
      - id: ref1
        bwb_id: BWBR0030215
  - number: 6.03.2
    text: |-
      De bevoegde autoriteit kan binnen het gebied waar hij bevoegd is, in afwijking van [artikel 8.05][ref1], voor het
      voeren van een veerpont een een radarpatent afgeven, waarinrekening wordt gehouden met de bijzonderheden van het
      traject waarvoor het radarpatent moet gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel8
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel6.03
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '8'
        hoofdstuk: '8'
  - number: '6.04'
    text: In de zin van dit reglement onderscheidt men
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel6.04
  - number: 6.04.1
    text: 'vier soorten Rijnpatenten:'
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel6.04
  - number: 6.04.1.a)
    text: het grote patent voor het voeren van alle schepen;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel6.04
  - number: 6.04.1.b)
    text: |-
      het kleine patent voor het voeren van een schip met een lengte van minder dan 35 m, mits het geen sleep- of duwboot
      is, of dat het niet voor het voortbewegen van een gekoppeld samenstel dient of voor het voeren van een schip dat is
      bestemd voor het vervoer van niet meer dan 12 passagiers;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel6.04
  - number: 6.04.1.c)
    text: het sportpatent voor het voeren van een pleziervaartuig met een lengte van minder dan 25 m;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel6.04
  - number: 6.04.1.d)
    text: het overheidspatent voor het voeren van overheidsschepen en van brandweerboten.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel6.04
  - number: 6.04.2
    text: Een radarpatent voor de radarvaart.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel6.04
  - number: 7.01.1
    text: Degene die het grote patent wil verkrijgen, moet ten minste 21 jaar oud zijn.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.01
  - number: 7.01.2
    text: De kandidaat moet houder zijn van een marifoonbedieningscertificaat.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.01
  - number: 7.01.3
    text: 'De kandidaat moet de nodige bekwaamheid bezitten; bekwaam is degene die:'
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.01
  - number: 7.01.3.a)
    text: |-
      lichamelijk en geestelijk geschikt is om een schip te voeren. De lichamelijke en geestelijke geschiktheid wordt
      aangetoond door het overleggen van een medische verklaring overeenkomstig de [bijlagen B1][ref1] en [B2][ref2], die
      is afgegeven door een arts die door de bevoegde autoriteit erkend is;


      [ref1]: https://wetten.overheid.nl/BWBR0030215
      [ref2]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.01
    references:
      - id: ref1
        bwb_id: BWBR0030215
      - id: ref2
        bwb_id: BWBR0030215
  - number: 7.01.3.b)
    text: |-
      geen strafbare feiten in de scheepvaart heeft begaan, zodat op grond van zijn vroeger gedrag verwacht mag worden
      dat hij een schip veilig zal voeren en geschikt is het commando over een bemanning te voeren;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.01
  - number: 7.01.3.c)
    text: |-
      capabel is, dat wil zeggen, beschikt over de noodzakelijke beroepsmatige vaardigheden en kennis, ook in nautisch
      opzicht, alsmede over voldoende kennis van de reglementen en de vaarweg. Aan de voorwaarden wordt geacht te zijn
      voldaan wanneer de kandidaat het daartoe ingestelde examen met goed gevolg heeft afgelegd.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.01
  - number: 7.01.4
    text: |-
      De kandidaat moet een vaartijd aantonen van ten minste vier jaar als lid van een dekbemanning, waarvan ten
      minste twee jaar in de binnenvaart als matroos dan wel ten minste één jaar als volmatroos. De vaartijd moet op
      motorschepen zijn volbracht waarvoor het grote patent of het kleine patent vereist is.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.01
  - number: 7.01.5
    text: |-
      De vaartijd wordt berekend overeenkomstig het bepaalde in [artikel 3.08][ref1]. Tot de vaartijd wordt eveneens
      gerekend:


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel3
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel7.01
    references:
