    text: in de exploitatiewijze A1 en A2 telkens met één matroos, en
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.18
  - number: 3.18.1.b)
    text: |-
      in de exploitatiewijze B met twee matrozen. Wordt alleen niet voldaan aan de gestelde eisen in de onderdelen i) en
      l), respectievelijk de onderdelen i) of l) van de standaard S1, zoals bedoeld in [artikel 3.14, lid 1.1][ref1], dan
      wordt de bemanning bij exploitatiewijze B met één matroos in plaats van twee verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel3
