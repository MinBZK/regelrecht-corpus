  - number: 3.18.2
    text: |-
      Voldoet de uitrusting van een schip slechts gedeeltelijk aan de Standaard S1 zoals deze is bepaald in artikel 3.14
      van dit Reglement, en niet aan één of meer van de in [artikel 3.14, lid 1.1, onderdelen a tot en met c][ref1], van
      dit Reglement gestelde eisen wordt voldaan, dan


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel3
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.18
    references:
