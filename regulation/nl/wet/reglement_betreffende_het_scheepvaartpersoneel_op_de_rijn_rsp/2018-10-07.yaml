  - number: '1.01'
    text: |-
      In dit reglement wordt verstaan onder:

      1. *schip:* een binnenschip, een veerpont, een zeeschip of een drijvend werktuig; 2. *binnenschip:* een schip
      dat uitsluitend of overwegend voor de vaart opbinnenwateren bestemd is; 3. *zeeschip:* een schip dat voor de zee-
      of kustvaart is toegelaten en overwegend daartoe bestemd is; 4. *motorschip:* een schip dat voor het vervoer van
      goederen bestemd is en door middel van zijn eigen mechanische middelen tot voortbeweging zelfstandig kan varen;
      5. *veerpont:* een schip dat een veerdienst onderhoudt waarbij de vaarweg wordt overgestoken en door de bevoegde
      autoriteit als veerpont wordt aangemerkt; 6. *overheidsvaartuig:* een schip waarvan de lengte niet meer dan 25
      m bedraagt en ter uitvoering van overheidstaken wordt ingezet; 7. *brandweerboot:* een schip waarvan de lengte
      15 m of meer bedraagt en ter uitvoering van hulpverlening wordt ingezet; 8. *sleepboot:* een schip dat speciaal
      gebouwd is om te slepen; 9. *duwboot:* een schip dat speciaal gebouwd is voor het voortbewegen van een duwstel; 10.
      *sleepschip:* een schip dat bestemd is voor het vervoer van goederen en is gebouwd om te worden gesleept, met of
      zonder eigen mechanische middelen tot voortbeweging waardoor slechts verplaatsingen over kleine afstanden mogelijk
      zijn; 11. *duwbak:* een schip dat gebouwd of specifiek uitgerust is om te worden geduwd; 12. *passagiersschip:* een
      schip voor dagtochten of een hotelschip dat is gebouwd en ingericht voor het vervoer van meer dan 12 passagiers;
      13. *schip voor dagtochten:* een passagiersschip zonder hutten voor overnachting van passagiers en met een
      overeenkomstige aantekening in het certificaat van onderzoek; 14. *hotelschip:* een passagiersschip met hutten voor
      overnachting van passagiers en met een overeenkomstige aantekening in het certificaat van onderzoek; 15. *drijvend
      werktuig:* een drijvend bouwsel waarop zich werkinstallaties bevinden zoals kranen, baggermolens, hei-installaties,
      elevatoren; 16. *pleziervaartuig:* een schip dat bestemd is voor sportieve of recreatieve doeleinden en geen
      passagiersschip is.

      17. *samenstel:* een hecht samenstel of een sleep; 18. *formatie:* vorm van de samenstelling van een samenstel;
      19. *hecht samenstel:* een duwstel of een gekoppeld samenstel; 20. *duwstel:* een hecht samenstel van vaartuigen,
      waarvan er ten minste één geplaatst is vóór het schip of de twee schepen met motoraandrijving die dienen voor het
      voortbewegen van het samenstel en worden aangeduid als ‘duwboot’ of ‘duwboten’. Hieronder wordt ook een duwstel
      verstaan dat is samengesteld uit een duwend en een geduwd vaartuig waarvan de koppelingen een beheerst knikken
      mogelijk maken; 21. *gekoppeld samenstel:* een hecht samenstel van langszijde aan elkaar vastgemaakte schepen, die
      geen van beide vóór het motorschip geplaatst zijn dat voor het voortbewegen van het samenstel dient; 22. *sleep:*
      een samenstel van één of meer vaartuigen, drijvende inrichtingen of drijvend materieel, dat wordt gesleept door één
      of meer tot het samenstel behorende vaartuigen met motoraandrijving; 23. *lengte of L:* de grootste lengte van de
      scheepsromp in m, gemetenzonder roer en boegspriet; 24. *breedte of B:* de grootste breedte van de scheepsromp in
      m, gemeten op de buitenkant van de huidbeplating (zonder schoepraderen, schuurlijsten en dergelijke).

      25. *bemanning:* de dekbemanning en de machinisten; 26. *minimumbemanning:* de voorgeschreven minimumbemanning
      overeenkomstig in de [artikelen 3.14 tot 3.21][ref1] van dit reglement; 27. *dekbemanning:* de bemanning met
      uitzondering van machinisten; 28. *boordpersoneel:* alle werkzame personen aan boord van een passagiersschip
      die niet tot de bemanning behoren; 29. *veiligheidspersoneel:* de deskundige voor de passagiersscheepvaart,
      de eerste-hulpverlener en de persoon die is opgeleid voor het dragen van ademhalingsapparatuur, alsmede de
      deskundige voor het transport van gevaarlijke stoffen; 30. *passagier:* iedere persoon aan boord die niet tot de
      bemanning of tot het boordpersoneel behoort; 31. *vaartijd:* de tijd aan boord van een schip dat een reis maakt;
      32. *radarvaart:* de vaart bij slecht zicht, waarbij de radar voor het voeren van het schip wordt gebruikt; 33.
      *marifoonbedieningscertificaat:* een op basis van bijlage 5 van de Regionale Regeling betreffende de Marifoondienst
      in de Binnenvaart afgegeven certificaat marifoonbediening; 34. *schipperspatent:* een Rijnpatent of een ander
      bevoegdheidsbewijsvoor het voeren van een binnenvaartschip; 35. *Rijnpatent:* een bevoegdheidsbewijs voor het
      voeren van een schip op de Rijn overeenkomstig [artikel 6.04, eerste lid][ref2] van dit reglement;

      36. *ADN-Reglement:* het bij het Europees Verdrag over het internationale Vervoer van gevaarlijke
      Stoffen over Binnenwateren (ADN) gevoegde Reglement. 37. *binnenschipcertificaat:* een certificaat van
      onderzoek of een communautair certificaat; 38. *Commissie van Deskundigen:* de nationale autoriteit die
      bevoegd is voor de afgifte van het certificaat van onderzoek en waarvan de samenstelling is vastgesteld
      in [artikel 2.01 van het Reglement Onderzoek Schepen op de Rijn][ref3]; 39. *Vloeibaar aardgas (LNG)’:*
      aardgas dat vloeibaar is gemaakt door afkoeling tot een temperatuur van -161 °C; 40. *ES-TRIN:* de
      [Europese standaard voor technische voorschriften voor binnenschepen][ref4], editie 2017/1. Bij de toepassing van
      ES-TRIN moet onder lidstaat een Rijnoeverstaat of België worden verstaan.


