  - number: '1.02'
    text: |-
      De Centrale Commissie voor de Rijnvaart kan voorschriften van tijdelijke aard aannemen, wanneer het voor een
      aanpassing aan de technische ontwikkeling van de binnenscheepvaart noodzakelijk wordt geacht om in dringende
      gevallen afwijkingen van dit reglement toe te laten dan wel proefnemingen mogelijk te maken, waardoor de veiligheid
      en de vlotte afwikkeling van het scheepvaartverkeer niet worden aangetast. Deze voorschriften van tijdelijke
      aard worden door de bevoegde autoriteit gepubliceerd en hebben een geldigheidsduur van ten hoogste drie jaren.
      Zij worden in alle Rijnoeverstaten en België op hetzelfde tijdstip in werking gesteld en worden onder dezelfde
      voorwaarden buiten werking gesteld.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel1.02
  - number: '1.03'
    text: |-
      In het belang van een eenvoudige en uniforme toepassing van het onderhavige reglement kan de Centrale Commissie
      voor de Rijnvaart dienstinstructies vaststellen. De bevoegde autoriteiten dienen zich aan deze dienstinstructies
      te houden.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel1.03
  - number: 2.01.1
    text: Dit deel is van toepassing op
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel2.01
  - number: 2.01.1.a)
    text: schepen met een lengte van 20 m of meer;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel2.01
  - number: 2.01.1.b)
    text: schepen waarvan het product van L . B . T gelijk is aan een inhoud van 100 m3 of meer.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel2.01
  - number: 2.01.2
    text: Bovendien is dit deel van toepassing op alle
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel2.01
  - number: 2.01.2.a)
    text: |-
      sleep- en duwboten die ervoor zijn ingericht, schepen als bedoeld in het eerste lid of drijvende inrichtingen te
      slepen, te duwen of langszijde vastgemaakt mee te voeren;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel2.01
  - number: 2.01.2.b)
    text: schepen die een toelatingscertificaat als bedoeld in het ADN- bezitten;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel2.01
  - number: 2.01.2.c)
    text: passagiersschepen;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel2.01
  - number: 2.01.2.d)
    text: drijvende werktuigen.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel2.01
  - number: 2.01.3
    text: Dit deel is niet van toepassing op veerponten.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel2.01
  - number: 2.02.1
    text: |-
      De bemanning en het veiligheidspersoneel die zich overeenkomstig het [Rijnvaartpolitiereglement][ref1] aan boord
      moeten bevinden van schepen die de Rijn bevaren, dienen in overeenstemming te zijn met de voorschriften van dit
      reglement. De voor de desbetreffende exploitatiewijze en vaartijd voorgeschreven bemanning en veiligheidspersoneel
      moeten zich tijdens de vaart voortdurend aan boord bevinden. Het is niet toegestaan zonder de voorgeschreven
      bemanning of zonder het veiligheidspersoneel te vertrekken. Schepen waarvan door onvoorziene omstandigheden
      (bijvoorbeeld ziekte, ongeval, bevel van een bevoegde autoriteit) tijdens de vaart ten hoogste één lid van de
      voorgeschreven bemanning uitvalt, mogen niettemin hun reis voortzetten tot de eerstvolgende geschikte aanlegplaats
      in de richting waarin gevaren wordt – passagiersschepen tot het eindpunt van de reis van die dag – indien zich
      aan boord naast een persoon die houder is van een patent voor het desbetreffende riviergedeelte, nog een lid van
      de voorgeschreven bemanning bevindt. De persoon die belast is met het toezicht op en de verzorging van zich aan
      boord bevindende kinderen onder de zes jaar, mag geen lid van de minimumbemanning zijn, tenzij er maatregelen zijn
      getroffen om de veiligheid van de kinderen ook zonder voortdurend toezicht te waarborgen.


      [ref1]: https://wetten.overheid.nl/BWBR0006923
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel2.02
    references:
      - id: ref1
        bwb_id: BWBR0006923
  - number: 2.02.2
    text: |-
      Elke Rijnoeverstaat of België kan bepalen dat de nationale voorschriften betreffende de arbeidsbescherming van
      toepassing zijn op de Rijnschepen die in die staat zijn ingeschreven. Niet in een register ingeschreven schepen
      vallen onder de wettelijke voorschriften van die Rijnoeverstaat of België waarin het bedrijf zijn hoofdzetel
      of de eigenaar zijn wettelijke domicilie heeft. In afwijking hiervan kunnen de bevoegde autoriteiten van de
      Rijnoeverstaten of België bilateraal overeenkomen dat bepaalde schepen die in de ene staat zijn ingeschreven, onder
      de voorschriften van de andere staat vallen. Zwangere vrouwen en kraamvrouwen mogen gedurende ten minste 14 weken,
      waarvan ten minste zes weken voor en zeven weken na de bevalling geen deel uitmaken van de bemanning.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel2.02
  - number: 2.02.3
    text: |-
      Voor de toepassing van de [artikelen 3.10][ref1], [3.11][ref2] en [3.13][ref3] dient tevens rekening te worden
      gehouden met vaar- en rusttijden diebuiten het toepassingsgebied van dit reglement vervuld zijn.


