  - number: 3.15.2
    text: |-
      De voorgeschreven matrozen overeenkomstig de in het eerste lid genoemde tabel mogen door lichtmatrozen worden
      vervangen die de minimumleeftijd van 17 jaar hebben bereikt, zich ten minste in het derde leerjaar bevinden en een
      jaar vaartijd in de binnenvaart kunnen aantonen.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.15
  - number: 3.15.3
    text: De voorgeschreven minimumbemanning overeenkomstig de onder 1 genoemde tabel, kan
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.15
  - number: 3.15.3.a)
    text: in groep 1, exploitatiewijze B, Standaard S2,
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.15
  - number: 3.15.3.b)
    text: in groep 2, exploitatiewijze A1, Standaard S2, en
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.15
