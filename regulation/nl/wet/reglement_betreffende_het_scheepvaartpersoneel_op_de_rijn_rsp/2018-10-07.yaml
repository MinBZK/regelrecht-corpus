  - number: 3.16.2
    text: |-
      De voorgeschreven matrozen overeenkomstig de in het eerste lid genoemde tabel mogen door lichtmatrozen worden
      vervangen die de minimumleeftijd van 17 jaar hebben bereikt, zich ten minste in het derde leerjaar bevinden en een
      jaar vaartijd in de binnenvaart kunnen aantonen.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.16
  - number: 3.16.3
    text: De voorgeschreven minimumbemanning overeenkomstig de in het eerste lid genoemde tabel, kan
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.16
  - number: 3.16.3.a)
    text: in de groep 1, exploitatiewijze B, Standaard S2,
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.16
  - number: 3.16.3.b)
    text: in de groep 2, exploitatiewijze A1, Standaard S2,
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.16
  - number: 3.16.3.c)
    text: in de groep 3, exploitatiewijze A1, Standaard S1 en exploitatiewijze A2, Standaard S2,
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.16
  - number: 3.16.3.d)
    text: in de groep 4, exploitatiewijze A1, Standaard S2 en exploitatiewijze A2, Standaard S2, en
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.16
  - number: 3.16.3.e)
    text: |-
      in de groep 5, exploitatiewijze A1, Standaard S1, exploitatiewijze A2, Standaard S2, en exploitatiewijze B,
      Standaard S2 voor de ononderbroken duur van ten hoogste drie maanden per kalenderjaar met een lichtmatroos worden
      verminderd, als deze lichtmatroos gedurende deze tijd een schippersschool bezoekt. Opeenvolgende periodes met
      een gereduceerde bemanning moeten door een periode van minimaal één maand worden onderbroken. Het bezoek aan de
      schippersschool moet worden aangetoond met een verklaring van de schippersschool, die zich aan boord moet bevinden
      en waarin de tijden van het schoolbezoek zijn aangegeven. De eerste zin, onderdeel a en het tweede alternatief van
      onderdeel c, d en het tweede alternatief van onderdeel e zijn slechts van toepassing wanneer gedurende de tijd dat
      de ene lichtmatroos een schippersschool bezoekt, de tweede lichtmatroos aan boord is. Deze bepalingen gelden niet
      voor de lichtmatroos zoals bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.16
  - number: 3.16.4
    text: |-
      De voorgeschreven machinisten overeenkomstig de in het eerste lid genoemde tabel mogen door bijkomende volmatrozen
      worden vervangen. Zij mogen ook door bijkomende matrozen worden vervangen, wanneer in de tabel in het eerste lid al
      een volmatroos is voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.16
