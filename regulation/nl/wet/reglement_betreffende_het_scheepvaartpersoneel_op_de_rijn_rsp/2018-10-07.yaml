      [ref2]: https://wetten.overheid.nl/BWBR0030215#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0030215#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0030215#Artikel3
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.18
