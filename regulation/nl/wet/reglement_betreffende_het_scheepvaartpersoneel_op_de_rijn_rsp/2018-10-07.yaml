  - number: '3.01'
    text: |-
      Tot de leden van de bemanning behoren de dekbemanning en het machinekamerpersoneel. Leden van de dekbemanning
      zijn de deksman, de lichtmatroos (scheepsjongen), de matroos, de volmatroos, de stuurman en de schipper. Het
      machinekamerpersoneel bestaat uit de machinist.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.01
  - number: '3.02'
    text: 'De leden van de bemanning moeten aan de volgende voorwaarden voldoen:'
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.02
  - number: 3.02.1
    text: 'voor de deksman: een minimumleeftijd van16 jaar;'
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.02
  - number: 3.02.2
    text: |-
      voor de lichtmatroos (scheepsjongen): een minimumleeftijd van 15 jaar en het bezit van een schriftelijk bewijs van
      inschrijving bij een opleiding die bestaat uit het bezoekenvan een vakschool voor schippers of het volgenvan een
      door de bevoegde autoriteit erkende, schriftelijke cursus die voor een gelijkwaardig diploma opleidt;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.02
  - number: 3.02.3
    text: 'voor de matroos:'
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.02
  - number: 3.02.3.a)
    text: |-
      een minimumleeftijd van 17 jaar en - een met goed gevolg afgeronde opleiding als genoemd in het tweede lid, of
        - een met goed gevolg afgelegd eindexamen aan een vakschool voor schippers, of
        - een met goed gevolg afgelegd, door een bevoegde autoriteit erkend examen voor matroos, of
        - een beroepsbekwaamheid matroos als bedoeld in de administratieve overeenstemming over de samenwerking voor de
      wederzijdse erkenning van door middel van schoolopleidingen verkregen beroepsbekwaamheid matroos; of
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.02
  - number: 3.02.3.b)
    text: |-
      een minimumleeftijd van 19 jaar en een vaartijd als lid van een dekbemanning van ten minste drie jaar hebben,
      waarvan ten minste één jaar in de binnenvaart en twee jaar hetzij in de binnenvaart, hetzij in de zee- of kustvaart
      dan wel de visserij vervuld moeten zijn;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.02
  - number: 3.02.4
    text: 'voor de volmatroos:'
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.02
  - number: 3.02.4.a)
    text: |-
      een vaartijd van ten minste één jaar als matroos in de binnenvaart en - een met goed gevolg afgeronde opleiding,
      zoals genoemd in het tweede lid, of
        - een met goed gevolg afgelegd eindexamen aan een vakschool voor schippers, of
        - een met goed gevolg afgelegd, door een bevoegde autoriteit erkend examen voor matroos, of
        - een beroepsbekwaamheid matroos zoals bedoeld in de administratieve overeenstemming over de samenwerking voor de
      wederzijdse erkenning van door middel van schoolopleidingen verkregen beroepsbekwaamheden matroos; of
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.02
  - number: 3.02.4.b)
    text: |-
      een met goed gevolg afgesloten driejarige opleiding als bedoeld in het tweede lid of een met goed gevolg afgelegd
      eindexamen na een opleiding van ten minste 3 jaar aan een vakschool voor schippers, indien deze opleiding ten
      minste één jaar vaartijd in de binnenvaart omvat; of
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.02
  - number: 3.02.4.c)
    text: |-
      een vaartijd in de binnenvaart van ten minste één jaar als matroos, zoals bedoeld in het derde lid, onderdeel b, en
      een met goed gevolg afgelegd praktijkexamen als bedoeld in [bijlage D7][ref1], onderdeel 3.1, van dit reglement; of


      [ref1]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.02
    references:
      - id: ref1
        bwb_id: BWBR0030215
  - number: 3.02.4.d)
    text: een vaartijd in de binnenvaart van ten minste twee jaar als matroos, zoals bedoeld in het derde lid, onderdeel b;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.02
  - number: 3.02.5
    text: 'voor de stuurman:'
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.02
  - number: 3.02.5.a)
    text: |-
      een vaartijd in de binnenvaart van ten minste één jaar als volmatroos of van ten minste drie jaar als matroos,
      zoals bedoeld in het derde lid, onder b; of
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.02
  - number: 3.02.5.b)
    text: |-
      het bezit van een vaarbewijs, afgegeven overeenkomstig [Richtlijn 96/50/EG](31996L0050), of van een vaarbewijs zo
      als bedoeld in bijlage I van [Richtlijn 91/672/EEG](31991L0672); of
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.02
  - number: 3.02.5.c)
    text: |-
      een vaartijd in de binnenvaart van ten minste vier jaar en het bezit van een aan het grote patent gelijkwaardig
      vaarbevoegdheidsbewijs;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.02
  - number: 3.02.6
    text: |-
      voor de schipper: hetzij een overeenkomstig dit reglement afgegeven Rijnpatent, hetzij een door de CCR
      als gelijkwaardig erkend vaarbevoegdheidsbewijs voor het desbetreffende scheepstype en de desbetreffende
      scheepsgrootte, alsmede het bewijs voor het te bevaren riviergedeelte overeenkomstig [artikel 6.02][ref1] van dit
      reglement;


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel6
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.02
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '6'
        hoofdstuk: '6'
  - number: 3.02.7
    text: 'voor de machinist:'
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.02
  - number: 3.02.7.a)
    text: |-
      een minimumleeftijd van 18 jaar en een met goed gevolg afgelegd eindexamen van een vakopleiding op het gebied van
      motoren of werktuigbouwkunde; of
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.02
  - number: 3.02.7.b)
    text: |-
      een minimumleeftijd van 19 jaar en een vaartijd van ten minste 2 jaar als volmatroos op een gemotoriseerd
      binnenschip.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.02
  - number: 3.03.1
    text: |-
      Alle leden van de bemanning moeten voldoen aan de voorwaarden voor de lichamelijke en geestelijke geschiktheid
      zoals bedoeld in [bijlage B1][ref1]. De lichamelijke en geestelijke geschiktheid moet voor de eerste afgifte van
      het dienstboekje of een Rijnpatent worden aangetoond door


      [ref1]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.03
    references:
      - id: ref1
        bwb_id: BWBR0030215
  - number: 3.03.1.a)
    text: |-
      een medische verklaring, overeenkomstig [bijlage B2][ref1], die niet ouder dan drie maanden mag zijn. Zijn er dan
      nog twijfels over de lichamelijke en geestelijke geschiktheid, dankan de bevoegde autoriteit het recht, aanvullende
      medische verklaringen of verklaringen van medische specialisten eisen; of


      [ref1]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.03
    references:
      - id: ref1
        bwb_id: BWBR0030215
  - number: 3.03.1.b)
    text: |-
      een door de CCR als gelijkwaardig erkende medische verklaring, die niet ouder dan drie maanden mag zijn en op zijn
      minst overeenkomstig de vereisten van [bijlage B1][ref1] is afgegeven; of


      [ref1]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.03
    references:
      - id: ref1
        bwb_id: BWBR0030215
  - number: 3.03.1.c)
    text: |-
      een als gelijkwaardig erkend, geldig vaarbevoegdheidsbewijs, waarvoor op zijn minst dezelfde vereisten gelden, als
      die in [bijlage B1][ref1] zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.03
    references:
      - id: ref1
        bwb_id: BWBR0030215
  - number: 3.03.2
    text: |-
      Voor de functie van machinist hoeft niet aan de vereisten voor ogen en oren, zoals bedoeld in
      [bijlage B1 van het Patentreglement Rijn][ref1], te worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0026045
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.03
    references:
      - id: ref1
        bwb_id: BWBR0026045
  - number: '3.04'
    text: |-
      Het bewijs van lichamelijke en geestelijke geschiktheid moet vernieuwd worden door het overleggen van een medische
      verklaring overeenkomstig [bijlage B2][ref1] of een door de CCR als gelijkwaardig erkende medische verklaring, die
      niet ouder dan drie maanden mag zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.04
    references:
      - id: ref1
        bwb_id: BWBR0030215
  - number: 3.04.a)
    text: |-
      voor de houder van een schipperspatent, iedere vijf jaar vanaf het bereiken van de leeftijd van 50 jaar tot de
      leeftijd van 65 jaar, daarna ieder jaar vanaf het bereiken van de leeftijd van 65 jaar;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.04
  - number: 3.04.b)
    text: |-
      voor de leden van de bemanning, met uitzondering van de houder van een schipperspatent, vanaf het bereiken van de
      leeftijd van 65 jaar en daarna ieder jaar.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.04
  - number: 3.05.1
    text: De bekwaamheid voor een functie aan boord moet te allen tijde aangetoond kunnen worden
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.05
  - number: 3.05.1.a)
    text: |-
      door de schipper aan de hand van een Rijnpatent of een door de CCR als gelijkwaardig erkend vaarbevoegdheidsbewijs
      voor het desbetreffende scheepstype en de desbetreffende scheepsafmetingen, alsmede het bewijs voor het te bevaren
      riviergedeelte overeenkomstig [artikel 6.02][ref1] van dit reglement,


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel6
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.05
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '6'
        hoofdstuk: '6'
  - number: 3.05.1.b)
    text: |-
      door de overige leden van de bemanning aan de hand van een op hun naam afgegeven geldig dienstboekje,
      overeenkomstig het model van [bijlage A2][ref1], of een ander door de CCR als gelijkwaardig erkend, geldig
      dienstboekje; de lijst van de als gelijkwaardig erkende dienstboekjes is in [bijlage A6][ref2] van dit reglement
      opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0030215
      [ref2]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.05
    references:
      - id: ref1
        bwb_id: BWBR0030215
      - id: ref2
        bwb_id: BWBR0030215
  - number: 3.05.2
    text: |-
      De leden van de bemanning kunnen, met uitzondering van de machinist, hun bekwaamheid ook aantonen door een groot
      patent of een daarmee overeenstemmend en door de CCR als gelijkwaardig erkend vaarbevoegdheidsbewijs overeenkomstig
      [deel III][ref1] van dit reglement.


      [ref1]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.05
    references:
      - id: ref1
        bwb_id: BWBR0030215
  - number: 3.06.1
    text: |-
      De persoon op wiens naam het dienstboekje is afgegeven, wordt als houder van het dienstboekje aangemerkt. Een
      bemanningslid mag slechts in het bezit van één dienstboekje zijn. Het dienstboekje moet door de bevoegde autoriteit
      worden afgegeven en moet op zijn minst in één van de officiële talen van de CCR zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.06
  - number: 3.06.2
    text: |-
      Het dienstboekje bevat enerzijds algemene gegevens, zoals de medische verklaringen en de bekwaamheid van de houder,
      zoals bedoeld in [artikel 3.02][ref1], en anderzijds specifieke gegevens betreffende de afgelegde reizen.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel3
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.06
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.06.3
    text: |-
      De bevoegde autoriteit is verantwoordelijk voor het invullen van de algemene gegevens en de afstempeling ter
      controle. Zij heeft het recht het overleggen van vaartijdenboeken dan wel uittreksels daarvan of andere relevante
      bewijsstukken te verlangen. Zij mag alleen ingeschreven reizen van een stempel voorzien die niet langer dan 15
      maanden geleden zijn afgelegd. Voor de aantekening van specifieke gegevens met betrekking tot de afgelegde reizen
      is de schipper verantwoordelijk.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.06
  - number: 3.06.4
    text: De houder moet het dienstboekje
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.06
  - number: 3.06.4.a)
    text: bij de eerste indiensttreding aan boord aan de schipper overhandigen, en
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.06
  - number: 3.06.4.b)
    text: |-
      ten minste één keer per jaar, te rekenen vanaf de datum van afgifte overleggen en overeenkomstig het bepaalde in
      het derde lid door een bevoegde autoriteit laten afstempelen.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.06
  - number: 3.06.5
    text: |-
      Een stuurman die geen groot patent, als bedoeld in deel III van dit reglement, verkrijgen wil, is van de
      verplichting tot het overleggen, als bedoeld in het vierde lid, onderdeel b, vrijgesteld. Indien de stuurman later
      alsnog een patent wil verkrijgen, wordt slechts met die riviergedeelten rekening gehouden die in het dienstboekje
      zijn ingevuld en overeenkomstig het derde lid zijn afgestempeld.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.06
  - number: 3.06.6
    text: De schipper moet
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.06
  - number: 3.06.6.a)
    text: |-
      overeenkomstig de aanwijzingen en instructies voor het bijhouden van een dienstboekje regelmatig alle gegevens in
      het dienstboekje invullen, , behalve indien de houder van een dienstboekje stuurman is en op pagina 10 van zijn
      dienstboekje de navolgende, zoals voorgeschreven ondertekende, aantekening is aangebracht: ‘is niet voornemens een
      schipperspatent te verkrijgen’;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.06
  - number: 3.06.6.b)
    text: |-
      het dienstboekje tot aan het einde van het dienstverband, arbeidscontract dan wel andere regeling op een veilige
      plaats in het stuurhuis bewaren;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.06
  - number: 3.06.6.c)
    text: het dienstboekje te allen tijdemeteen aan de houder teruggeven, als deze daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.06
  - number: 3.07.1
    text: |-
      De geldigheid van een dienstboekje wordt ook zonder ambtelijke beschikking tot aan de verlenging van het bewijs van
      lichamelijke en geestelijke geschiktheid ambtshalve opgeschort, , als de lichamelijke en geestelijke geschiktheid
      niet binnen drie maanden na de verlengingstermijn zoals vastgesteld in [artikel 3.04, onderdeel b][ref1], opnieuw
      is aangetoond.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel3
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.07
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.07.2
    text: |-
      Heeft de bevoegde autoriteit twijfel aan de lichamelijke en geestelijke geschiktheid van de houder van een
      dienstboekje zoals bedoeld in [artikel 3.05, eerste lid, onderdeel b][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel3
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.07
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.07.2.a)
    text: |-
      informeert ze de autoriteit die het dienstboekje heeft afgegeven. Deze kan verlangen dat een medische verklaring
      die is afgegeven overeenkomstig [bijlage B2][ref1] of een door de CCR als gelijkwaardig erkend medische verklaring
      betreffende de huidige staat van de lichamelijke en geestelijke geschiktheid wordt overgelegd. De kosten hiervoor
      worden alleen dan door de houder van het dienstboekje gedragen, indien de twijfels gegrond blijken te zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.07
    references:
      - id: ref1
        bwb_id: BWBR0030215
  - number: 3.07.2.b)
    text: |-
      kan ze de geldigheid van het dienstboekje voor een bepaalde tijd opschorten, maar niet langer dan de datum die
      door de autoriteit die het dienstboekje heeft afgegeven, voor het overleggen van een nieuwe medische verklaringis
      vastgesteld . De CCR en de autoriteit die het dienstboekje heeft afgeven, dienen in dit geval van haar beslissing
      op de hoogte te worden gesteld.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.07
  - number: 3.07.3
    text: |-
      Als gebleken is dat de houder ongeschikt is, als bedoeld in het eerste en tweede lid, vermeldt de afgevende
      autoriteit op pagina 2 en 7 van het dienstboekje de goed leesbare aantekening ‘ONGESCHIKT’ en waarmerkt hij die.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.07
  - number: '3.08'
    text: |-
      Als één jaar vaartijd gelden 180 effectieve vaardagen in de binnenvaart. Binnen een periode van 365 opeenvolgende
      dagen kunnen maximaal 180 dagen als daadwerkelijke vaartijd worden meegerekend. 250 vaardagen in de zee- en
      kustvaart alsmede de visserij gelden als één jaar vaartijd.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.08
  - number: 3.09.1
    text: |-
      De vereiste vaartijd en de reizen op bepaalde riviergedeelten van de Rijn moeten worden aangetoond aan de hand
      van een naar behoren ingevuld en gewaarmerkt dienstboekje, overeenkomstig het model van [bijlage A2][ref1] van dit
      reglement, of aan de hand van een door de CCR voor de Rijn als gelijkwaardig erkend dienstboekje. De lijst van de
      als gelijkwaardig erkende dienstboekjes staat in [bijlage A5][ref2] van dit reglement vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0030215
      [ref2]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.09
    references:
      - id: ref1
        bwb_id: BWBR0030215
      - id: ref2
        bwb_id: BWBR0030215
  - number: 3.09.2
    text: |-
      Als volgens de nationale voorschriften van de Rijnoeverstaten of van België voor de vaarwegen buiten de Rijn geen
      dienstboekje aanwezig hoeft te zijn, kan de vaartijd ook door een geldig, officieel document worden aangetoond dat
      ten minste de volgende gegevens dient te bevatten:
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.09
  - number: 3.09.2.a)
    text: type, afmetingen, aantal passagiers en naam van de schepen waarop de aanvrager heeft gevaren;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.09
  - number: 3.09.2.b)
    text: naam van de schippers;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.09
  - number: 3.09.2.c)
    text: tijdstip van het begin en het einde van de reizen;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.09
  - number: 3.09.2.d)
    text: de uitgeoefende functies;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.09
  - number: 3.09.2.e)
    text: de bevaren riviergedeelten (precieze aanduiding met plaatsen van vertrek en aankomst).
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.09
  - number: 3.09.3
    text: |-
      De vaartijd kan eveneens aan de hand van een bewijs van vaarbekwaamheid zoals bedoeld in
      [artikel 7.13, derde lid][ref1], worden aangetoond en wel voor de duur van de vaartijd die voor het verkrijgen van
      dit bewijs vereist was.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel3
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.09
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.09.4
    text: |-
      De vaartijd op zee moet door middel van een monsterboekje worden aangetoond. De vaartijd in de kustvaart en de
      visserij moet worden aangetoond door een geldig ambtelijk document.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.09
  - number: 3.09.5
    text: |-
      De tijd die is doorgebracht voor het bezoeken van een vakschool voor schippers moet door het getuigschrift van de
      school worden aangetoond.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.09
  - number: 3.09.6
    text: |-
      Indien nodig, moeten de officiële documenten, zoals bedoeld in het tweede tot en met het vijfde lid, samen met een
      beëdigde vertaling in de Duitse, Franse of Nederlandse taal worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.09
  - number: 3.10.1
    text: |-
      Men onderscheidt de volgende exploitatiewijzen: A1 vaart van ten hoogste 14 uur, A2 vaart van ten hoogste 18 uur, B
      vaart van ten hoogste 24 uur, telkens binnen een periode van 24 uur.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.10
  - number: 3.10.2
    text: |-
      Bij exploitatiewijze A1 mag de vaart eenmaal per week tot maximaal 16 uur worden verlengd, indien de vaartijd
      kan worden aangetoond met de registraties van een goed functionerende tachograaf van een type dat overeenkomstig
      [bijlage A3][ref1] van dit reglement door de bevoegde autoriteit van een Rijnoeverstaat of van België is
      goedgekeurd en wanneer er behalve de schipper nog een bemanningslid met de kwalificatie van stuurman aan boord is.


      [ref1]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0030215
  - number: 3.10.3
    text: |-
      Een schip dat in exploitatiewijze A1, respectievelijk A2 wordt geëxploiteerd, moet de vaart gedurende acht,
      respectievelijk zes aaneengesloten uren onderbreken, te weten:
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.10
  - number: 3.10.3.a)
    text: in de exploitatiewijze A1 tussen 22.00 en 06.00 uur, en
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.10
  - number: 3.10.3.b)
    text: in de exploitatiewijze A2 tussen 23.00 en 05.00 uur.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.10
  - number: 3.11.1
    text: |-
      Bij exploitatiewijze A1 heeft elk bemanningslid recht op een ononderbroken rusttijd van acht uur buiten de vaartijd
      per periode van 24 uur, gerekend vanaf het einde van elke rusttijd van acht uur.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.11
  - number: 3.11.2
    text: |-
      Bij exploitatiewijze A2 heeft elk bemanningslid recht op een rusttijd van acht uur, waarvan zes uur ononderbroken
      buiten de vaartijd per periode van 24 uur, gerekend vanaf het einde van elke rusttijd van zes uur. Voor
      bemanningsleden onder de 18 jaar moet een ononderbroken rusttijd van acht uur in acht worden genomen waarvan zes
      uur buiten de vaartijd.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.11
  - number: 3.11.3
    text: |-
      Bij exploitatiewijze B heeft elk bemanningslid recht op een rusttijd van 24 uur per periode van 48 uur, waarvan ten
      minste twee maal zes uur ononderbroken moeten zijn.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.11
  - number: 3.11.4
    text: |-
      Gedurende zijn verplichte rusttijd mag een bemanningslid niet voor enigerlei taak wordeningezet, ook niet om
      toezicht te houden of stand-by te zijn. De in de politievoorschriften bedoelde wacht- en toezichtstaken voor
      stilliggende vaartuigen worden niet als taak in de zin van dit lid beschouwd.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.11
  - number: 3.11.5
    text: |-
      Bepalingen in de arbeidsvoorschriften of collectieve arbeidsovereenkomsten die langere rusttijden voorschrijven,
      blijven onverlet.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.11
  - number: 3.12.1
    text: |-
      In afwijking van [artikel 3.10, eerste en derde lid][ref1], is een wisseling of herhaling van de exploitatiewijze
      slechts mogelijk met inachtneming van de bepalingen van het tweede tot met zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel3
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.12.2
    text: 'Van exploitatiewijze A1 mag slechts dan naar exploitatiewijze A2 worden gewisseld, indien:'
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.12
  - number: 3.12.2.a)
    text: de bemanning in zijn geheel is afgelost, of
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.12
  - number: 3.12.2.b)
    text: |-
      de voor exploitatiewijze A2 bestemde bemanningsleden direct vóór de wisseling een rusttijd van acht uur, waarvan
      zes uur buiten de vaartijd, in acht genomen en aangetoond hebben en de voor exploitatiewijze A2 voorgeschreven
      versterking zich aan boord bevindt.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.12
  - number: 3.12.3
    text: 'Van exploitatiewijze A2 mag slechts dan naar exploitatiewijze A1 worden gewisseld, indien:'
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.12
  - number: 3.12.3.a)
    text: de bemanning in zijn geheel is afgelost, of
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.12
  - number: 3.12.3.b)
    text: |-
      de voor exploitatiewijze A1 bestemde bemanningsleden direct vóór de wisseling een ononderbroken rust van acht uur
      buiten de vaartijd in acht genomen en aangetoond hebben.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.12
  - number: 3.12.4
    text: 'Van exploitatiewijze B mag slechts dan naar exploitatiewijze A1 of A2 worden gewisseld, indien:'
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.12
  - number: 3.12.4.a)
    text: de bemanning in zijn geheel is afgelost, of
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.12
  - number: 3.12.4.b)
    text: |-
      de voor exploitatiewijze A1, respectievelijk A2 bestemde bemanningsleden direct vóór de wisseling een ononderbroken
      rusttijd van acht, respectievelijk zes uur in acht genomen en aangetoond hebben.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.12
  - number: 3.12.5
    text: 'Van exploitatiewijze A1 of A2 mag slechts dan naar exploitatiewijze B worden gewisseld, indien:'
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.12
  - number: 3.12.5.a)
    text: de bemanning in zijn geheel is afgelost, of
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.12
  - number: 3.12.5.b)
    text: |-
      de voor exploitatiewijze B bestemde bemanningsleden direct vóór de wisseling een ononderbroken rusttijd van acht,
      respectievelijk zes uur buiten de vaartijd in acht genomen en aangetoond hebben en de voor exploitatiewijze B
      voorgeschreven versterking zich aan boord bevindt.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.12
  - number: 3.12.6
    text: |-
      Een schip kan onmiddellijk in aansluiting op een reis in exploitatiewijze A1 of A2 voor een volgende reis in
      exploitatiewijze A1 of A2 worden ingezet, indien een voltallige uitwisseling van de bemanning heeft plaatsgevonden
      en de nieuwe bemanningsleden onmiddellijk voorafgaand aan de verdere exploitatiewijze A1 en A2 een ononderbroken
      rusttijd van acht, respectievelijk zes uur buiten de vaartijd in acht genomen en aangetoond hebben.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.12
  - number: 3.12.7
    text: |-
      Het bewijs van een rusttijd van acht, respectievelijk zes uur wordt aangetoond met een verklaring als bedoeld in
      [bijlage A4][ref1] van dit reglement of door een kopie van de pagina van het vaartijdenboek van het schip waarop de
      laatste reis van het bemanningslid heeft plaatsgevonden en de vaar-, respectievelijk rusttijden, vermeld staan.


      [ref1]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0030215
  - number: 3.13.1
    text: |-
      Aan boord van elk schip, met uitzondering van sleep- en duwboten die slechts in havens verkeren, onbemande
      duwbakken, overheidsschepen en pleziervaartuigen, moet zich in de stuurhut een vaartijdenboek bevinden
      overeenkomstig het model van [bijlage A1][ref1]. Dit boek dient te worden bijgehouden overeenkomstig de daarin
      vervatte aanwijzingen. De schipper is verantwoordelijk voor de aanwezigheid van het vaartijdenboek en de
      aantekeningen die daarin moeten worden gemaakt. Het eerste vaartijdenboek, waarop het nummer 1, de naam van het
      schip en het uniek Europees scheepsidentificatienummer (ENI) of het officiële scheepsnummer dienen te staan,
      moet worden afgegeven door een bevoegde autoriteit van een Rijnoeverstaat of België op vertoon van een geldig
      binnenschipcertificaat. Aan boord van schepen die over een krachtens [Bijlage O van het ROSR][ref2] op de
      Rijn erkend communautair certificaat beschikken, kan zich in plaats van het door een bevoegde autoriteit van
      een Rijnoeverstaat of België afgegeven vaartijdenboek, een door een bevoegde autoriteit van een derde staat
      afgegeven en door de CCR erkend vaartijdenboek bevinden. Erkende vaartijdenboeken moeten in ten minste één van
      de officiële talen van de CCR worden bijgehouden. De bevoegde autoriteiten voor de afgifte van op de Rijn geldige
      vaartijdenboeken staan vermeld in bijlage A1a.


      [ref1]: https://wetten.overheid.nl/BWBR0030215
      [ref2]: https://wetten.overheid.nl/BWBR0025973
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0030215
      - id: ref2
        bwb_id: BWBR0025973
  - number: 3.13.2
    text: |-
      Alle daarop volgende vaartijdenboeken mogen worden afgegeven door elke bevoegde autoriteit van een Rijnoeverstaat
      of België, die het van een volgnummer voorziet; zij kunnen evenwel slechts worden afgegeven tegen overlegging van
      het voorgaande vaartijdenboek. Het voorgaande vaartijdenboek moet worden voorzien van de onuitwisbare aantekening
      ‘ ongeldig’ en dient aan de schipper te worden teruggegeven. De afgifte van een nieuw vaartijdenboek kan geschieden
      op vertoon van het in het vierde lid bedoelde document. De eigenaar van het schip moet ervoor zorgen, dat het
      voorafgaande vaartijdenboek binnen 30 dagen na de afgiftedatum van het nieuwe vaartijdenboek wordt voorgelegd aan
      dezelfde bevoegde autoriteit die voor het nieuwe vaartijdenboek de in het vierde lid bedoelde verklaring heeft
      opgesteld, zodat deze autoriteit het bovengenoemde vooafgaande vaartijdenboek kan voorzien van de vermelding
      ‘ongeldig’. De eigenaar van het schip moet er bovendien voor zorgen, dat het vaartijdenboek daarna weer aan boord
      wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.13
  - number: 3.13.3
    text: Het ongeldig gemaakte vaartijdenboek moet gedurende zes maanden na de laatste aantekening aan boord worden bewaard.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.13
  - number: 3.13.4
    text: |-
      Bij de afgifte van het eerste vaartijdenboek overeenkomstig het eerste lid bevestigt de autoriteit die het eerste
      vaartijdenboek afgeeft, deze afgifte door middel van een verklaring waarop de naam van het schip, het uniek
      Europees identificatienummer (ENI) van het schip, of het officiële scheepsnummer, het nummer van het vaartijdenboek
      en de datum van afgifte zijn vermeld. Deze verklaring dient aan boord te worden bewaard en op verzoek te worden
      getoond. De afgifte van latere vaartijdenboeken overeenkomstig het tweede lid moet door de bevoegde autoriteit op
      de verklaring worden aangetekend.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.13
  - number: 3.13.5
    text: |-
      De naleving van de rusttijden kan bovendien door een tachograaf worden aangetoond, die voldoet aan de technische
      vereisten van [bijlage A3][ref1] van dit reglement. De registraties van de tachografen moeten gedurende zes maanden
      na de laatste registratie aan boord worden bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0030215
  - number: 3.13.6
    text: |-
      Bij aflossing of versterking van de bemanning zoals bedoeld in [artikel 3.12][ref1] moet voor ieder nieuw
      bemanningslid een verklaring overeenkomstig [bijlage A4][ref2] of een kopie van de pagina met de aantekeningen
      van de vaar-, respectievelijk rusttijden uit het vaartijdenboek van het schip waarop de laatste reis van het
      bemanningslid heeft plaatsgevonden, voorhanden zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030215
  - number: 3.13.7.a)
    text: |-
      Punt 2 van de instructies betreffende het bijhouden van het vaartijdenboek, volgens welke één enkel schema
      per reis voor de aantekeningen van de rusttijden voldoende is, geldt uitsluitend voor de bemanningsleden in de
      exploitatiewijze B. In de exploitatiewijzen A1 en A2 moeten voor elk bemanningslid het begin en het einde van de
      rusttijden van elke dag gedurende de reis worden genoteerd.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.13
  - number: 3.13.7.b)
    text: |-
      De na de wisseling van de exploitatiewijze vereiste aantekeningen moeten op een nieuwe bladzijde van het
      vaartijdenboek worden genoteerd.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.13
  - number: 3.13.7.c)
    text: |-
      Worden per dag twee of meer reizen met ongewijzigde bemanning afgelegd, kan worden volstaan met het invullen van
      het tijdstip van het begin van de eerste dagvaart en van het einde van de laatste dagvaart.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.13
  - number: 3.14.1
    text: |-
      Onverminderd de bepalingen van het [ES-TRIN][ref1] moeten motorschepen, duwboten, duwstellen en passagiersschepen,
      om met een minimumbemanning overeenkomstig deze paragraaf te worden geëxploiteerd, aan een van de volgende
      uitrustingsstandaarden voldoen:


      [ref1]: https://wetten.overheid.nl/BWBR0041395
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0041395
  - number: 3.14.1.1.1
    text: Standaard S1
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.14
  - number: 3.14.1.1.1.a)
    text: |-
      De voortstuwingsinstallaties moeten zo zijn ingericht dat de verandering van de vaarsnelheid en de omkering van de
      richting van de stuwkracht van de schroef vanaf de stuurstelling kunnen geschieden. De hulpmotoren die nodig zijn
      bij het varen met het schip moeten vanaf de stuurstelling kunnen worden aan- en afgezet, tenzij dit automatisch
      geschiedt, dan wel deze motoren gedurende elke reis ononderbroken in bedrijf zijn.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.14
  - number: 3.14.1.1.1.b)
    text: |-
      Het kritieke peil van de temperatuur van het koelwater van de hoofdmotoren, van de druk van de smeerolie van
      de hoofdmotoren en de transmissie, van de oliedruk en de luchtdruk van de omkeerinrichting van de hoofdmotoren,
      de keerkoppeling of de schroeven en van het bilgewater in de hoofdmachinekamer moet worden aangegeven door
      installaties die in het stuurhuis akoestische en optische alarmsignalen in werking stellen. De akoestische
      alarmsignalen mogen in één akoestisch apparaat verenigd zijn. Zij mogen worden uitgeschakeld zodra de storing
      is vastgesteld. De optische alarmsignalen mogen pas worden uitgeschakeld, nadat de desbetreffende storingen zijn
      verholpen;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.14
  - number: 3.14.1.1.1.c)
    text: De brandstoftoevoer en de koeling van de hoofdmotoren dienen automatisch te geschieden;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.14
  - number: 3.14.1.1.1.d)
    text: |-
      De bediening van de stuurinrichting moet zelfs bij de grootste toegelaten inzinking door één persoon zonder
      bijzondere krachtsinspanning kunnen worden verricht;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.14
  - number: 3.14.1.1.1.e)
    text: |-
      De bij het [Rijnvaartpolitiereglement][ref1] voorgeschreven optische tekens en geluidsseinen van varende schepen
      dienen vanaf de stuurstelling te kunnen worden gegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0006923
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0006923
  - number: 3.14.1.1.1.f)
    text: |-
      Indien geen rechtstreeks contact mogelijk is tussen de stuurstelling en het voorschip, het achterschip, de
      verblijven en de machinekamer, dient een spreekverbinding te zijn aangebracht. Voor contact met de machinekamer
      mogen in plaats van een spreekverbinding optische en akoestische signalen worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.14
  - number: 3.14.1.1.1.g)
    text: (Vervallen);
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.14
  - number: 3.14.1.1.1.h)
    text: (Vervallen);
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.14
  - number: 3.14.1.1.1.i)
    text: |-
      De kracht die nodig is om zwengels en soortgelijke draaibare voorzieningen van hefwerktuigen te bedienen, mag niet
      meer dan 160 N bedragen;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.14
  - number: 3.14.1.1.1.j)
    text: De in het binnenschipcertificaat vermelde sleeplieren dienen door een motor te worden aangedreven;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.14
  - number: 3.14.1.1.1.k)
    text: De lenspompen en de dekwaspompen dienen door een motor te worden aangedreven;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.14
  - number: 3.14.1.1.1.l)
    text: De voornaamste bedieningsinrichtingen en controle-instrumenten dienen ergonomisch te zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.14
  - number: 3.14.1.1.1.m)
    text: |-
      De krachtens [artikel 6.01, eerste lid, van ES-TRIN][ref1] vereiste inrichtingen dienen vanaf de stuurstelling te
      kunnen worden bediend.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel6
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '6'
  - number: 3.14.1.1.2
    text: Standaard S2
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.14
  - number: 3.14.1.1.2.a)
    text: |-
      voor alleen varende motorschepen: Standaard S1 en bovendien een uitrusting met een vanuit de stuurhut bedienbare
      boegschroefinstallatie;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.14
  - number: 3.14.1.1.2.b)
    text: |-
      voor motorschepen, die gekoppelde vaartuigen voortbewegen: Standaard S1 en bovendien een uitrusting met een vanuit
      de stuurhut bedienbare boegschroefinstallatie;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.14
  - number: 3.14.1.1.2.c)
    text: |-
      voor motorschepen die een duwstel, bestaande uit het motorschip en een vaartuig ervoor, voortbewegen: Standaard S1
      en bovendien een uitrusting met hydraulisch of elektrisch aangedreven koppellieren. Deze uitrusting is echter niet
      vereist, wanneer het vaartuig aan de kop van het duwstel met een boegschroefinstallatie is uitgerust die vanuit de
      stuurhut van het duwende motorschip te bedienen is;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.14
  - number: 3.14.1.1.2.d)
    text: |-
      voor duwboten die een duwstel voortbewegen: Standaard S1 en bovendien een uitrusting met hydraulisch of elektrisch
      aangedreven koppellieren. Deze uitrusting is echter niet vereist, wanneer het vaartuig aan de kop van het duwstel
      met een boegschroefinstallatie is uitgerust die vanuit de stuurhut van het duwende duwboot te bedienen is;
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.14
  - number: 3.14.1.1.2.e)
    text: |-
      voor passagiersschepen: Standaard S1 en bovendien een uitrusting met een vanuit de stuurhut bedienbare
      boegschroefinstallatie. Deze uitrusting is echter niet vereist, indien de voortstuwingsinstallatie en de
      stuurinrichting van het passagiersschip gelijkwaardige manoeuvreereigenschappen waarborgen.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.14
  - number: 3.14.2
    text: |-
      Het voldoen of niet voldoen aan de voorschriften van 1.1 of 1.2 wordt door de Commissie van Deskundigen in het
      binnenschipcertificaat onder nummer 47 gewaarmerkt.
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.14
