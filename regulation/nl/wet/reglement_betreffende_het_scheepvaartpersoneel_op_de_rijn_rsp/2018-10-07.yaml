    text: De minimumbemanning overeenkomstig de in het eerste lid genoemde tabel (schepen voor dagtochten), kan
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.17
  - number: 3.17.6.a)
    text: in de groep 2, exploitatiewijze A1, Standaard S2,
    url: https://wetten.overheid.nl/BWBR0030215/2018-10-07#Artikel3.17
  - number: 3.17.6.b)
