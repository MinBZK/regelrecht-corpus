    text: |-
      Indien de kandidaat na het slagen voor het examen voor een fysiek document kiest, verstrekt de bevoegde autoriteit
      voor de periode tussen het succesvol afleggen van het examen en de afgifte van de patentkaart een voorlopig
      Rijnpatent. Hiertoe print de autoriteit een uittreksel uit de elektronische gegevensbank, dat als voorlopig
      Rijnpatent geldt. De bevoegde autoriteit kan ook een voorlopig Rijnpatent verstrekken voor de tijd tussen de
      vervaldatum voor de verlenging van het patent en de afgifte van het nieuwe Rijnpatent.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel12.08
  - number: 13.01.1
    text: |-
      Voor het besturen van een schip moet de verantwoordelijke schipper beschikken over een specifieke vergunning als
      hij
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel13.01
  - number: 13.01.1.a)
    text: met behulp van een radar moet varen,
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel13.01
  - number: 13.01.1.b)
    text: waterwegen bevaart die als binnenwatertrajecten met specifieke risico’s geclassificeerd zijn,
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel13.01
  - number: 13.01.1.c)
    text: wateren bevaart die zijn geclassificeerd als binnenwateren van maritieme aard,
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel13.01
  - number: 13.01.1.d)
    text: vaartuigen voert die vloeibaar aardgas (LNG) als brandstof gebruiken, of
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel13.01
  - number: 13.01.1.e)
    text: met grote konvooien vaart.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel13.01
  - number: 13.01.2
    text: |-
      Specifieke vergunningen met uitzondering van het eerste lid, onderdeel d worden op het kwalificatiecertificaat
      schipper vermeld.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel13.01
  - number: 13.01.3
    text: |-
      De voor specifieke vergunningen vereiste examens kunnen in het kader van een administratief examen of in het kader
      van een goedgekeurd opleidingsprogramma worden afgelegd.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel13.01
  - number: 13.01.4
    text: 'Bij de aanvraag van een specifieke vergunning worden de volgende stukken overhandigd:'
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel13.01
  - number: 13.01.4.a)
    text: |-
      een kopie van het kwalificatiecertificaat schipper of een document waarmee wordt aangetoond dat aan de minimumeisen
      voor het kwalificatiecertificaat schipper voldaan wordt;
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel13.01
  - number: 13.01.4.b)
    text: een kopie van de desbetreffende pagina´s van het dienstboekjes, indien nodig.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel13.01
  - number: 13.01.5
    text: |-
      De geldigheid van een specifieke vergunning is afhankelijk van het desbetreffende kwalificatiecertificaat schipper.
      De geldigheid van de specifieke vergunning eindigt wanneer de geldigheid van het kwalificatiecertificaat eindigt.
      De specifieke vergunning wordt op het kwalificatiecertificaat schipper overeenkomstig het model van de ES-QIN
      vermeld.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel13.01
  - number: 13.02.1
    text: |-
      Voor het varen met behulp van een radar als radarvaart zoals bedoeld in het [Rijnvaartpolitiereglement][ref1], is
      een specifieke vergunning vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0006923
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel13.02
    references:
      - id: ref1
        bwb_id: BWBR0006923
  - number: 13.02.2
    text: |-
      Een kandidaat beschikt over de in de ES-QIN (Deel 1, hoofdstuk 4) genoemde competenties. Dit wordt aangetoond door
      een met goed gevolg afgelegd theoretisch examen met betrekking tot de vereiste kennis overeenkomstig de ES-QIN
      (Deel I, hoofdstuk 4) en een praktijkexamen overeenkomstig de ES-QIN (Deel II, hoofdstuk 1).
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel13.02
  - number: 13.02.3
    text: |-
      Het praktijkexamen kan worden afgelegd aan boord van een vaartuig zoals genoemd in de ES-QIN of op een door de
      bevoegde autoriteit overeenkomstig de ES-QIN (Deel III, Hoofdstuk 2) hiervoor toegelaten simulator. De simulator
      moet voldoen aan de technische en functionele eisen van de ES-QIN (Deel III, hoofdstuk 1).
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel13.02
  - number: 13.02.4
    text: |-
      De bevoegde autoriteit geeft de specifieke vergunning voor het varen met behulp van een radar af na te hebben
      vastgesteld dat de aanvrager aan de in het tweede en derde lid gestelde eisen voldoet en na de echtheid en
      de geldigheid van de door de aanvrager overeenkomstig [artikel 13.01][ref1] verstrekte documenten te hebben
      gecontroleerd.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel13
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel13.02
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '13'
        hoofdstuk: '13'
        paragraaf: '3'
  - number: 13.02.5
    text: |-
      Houders van nationale kwalificatiecertificaten als bedoeld in [artikel 11.01, derde lid][ref1], kunnen eveneens de
      specifieke vergunning voor het varen met behulp van radar verkrijgen overeenkomstig de bepalingen van het tweede en
      derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel11
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel13.02
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '3'
  - number: 13.03.1
    text: |-
      Voor het besturen van een vaartuig op een waterweg die geclassificeerd is als binnenwatertraject met een specifiek
      risico als bedoeld in het tweede lid, is een specifieke vergunning vereist.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel13.03
  - number: 13.03.2
    text: |-
      Wanneer dit nodig is om de veiligheid van de scheepvaart te waarborgen, kunnen de Oeverstaten trajecten die door
      hun eigen grondgebied lopen, classificeren als binnenwateren met specifieke risico’s wanneer deze risico’s het
      gevolg zijn van een of meer van de volgende omstandigheden:
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel13.03
  - number: 13.03.2.a)
    text: vaak veranderende stroompatronen en -snelheid
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel13.03
  - number: 13.03.2.b)
    text: |-
      de hydromorfologische kenmerken van de binnenwaterweg en het ontbreken van passende vaarweginformatiediensten over
      de binnenwaterweg of van geschikte kaarten;
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel13.03
  - number: 13.03.2.c)
    text: |-
      de aanwezigheid van een specifieke lokale verkeersregeling die wordt gerechtvaardigd door specifieke
      hydromorfologische kenmerken van de binnenwaterweg, of
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel13.03
  - number: 13.03.2.d)
    text: |-
      een hoge ongevallenfrequentie op een specifiek traject van de binnenwateren, die wordt toegeschreven aan het
      ontbreken van een competentie die niet door de in ES-QIN, Deel I, Hoofdstuk 2 wordt gedekt.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel13.03
  - number: 13.03.3
    text: |-
      De binnenwatertrajecten met specifieke risico’s van de Rijn staan in [bijlage 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel13.03
    references:
      - id: ref1
        bwb_id: BWBR0030215
  - number: 13.03.4
    text: 'De aanvrager verstrekt de bevoegde autoriteit toereikende bewijsstukken voor:'
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel13.03
  - number: 13.03.4.a)
    text: zijn identiteit;
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel13.03
  - number: 13.03.4.b)
    text: |-
      het voldoen aan de overeenkomstig het eerste lid bepaalde competentievereisten voor specifieke risico’s voor het
      specifieke binnenwatertraject waarvoor de vergunning vereist is;
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel13.03
  - number: 13.03.4.c)
    text: |-
      het beschikken over een kwalificatiecertificaat schipper of het voldoen aan de minimumeisen voor
      kwalificatiecertificaten schipper.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel13.03
  - number: 13.03.5
    text: |-
      Voor het verkrijgen van de specifieke vergunning voor de Rijn moet de houder van een kwalificatiecertificaat
      schipper het in [bijlage 5][ref1] genoemde examen met succes afgelegd hebben. Om tot het examen voor een door de
      aanvrager bepaald traject toegelaten te worden, moet de bevoegde autoriteit het bewijs overgelegd worden van het
      bevaren van de desbetreffende riviergedeelten zoals bepaald in bijlage 5.


      [ref1]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel13.03
    references:
      - id: ref1
        bwb_id: BWBR0030215
  - number: 13.03.6
    text: |-
      De bevoegde autoriteit beoordeelt de competentie van de aanvragers voor specifieke risico’s en geeft de
      specifieke vergunning af na de echtheid en de geldigheid van de door de aanvrager verstrekte documenten te hebben
      gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel13.03
  - number: 13.03.7
    text: |-
      Houders van nationale kwalificatiecertificaten als bedoeld in [artikel 11.01, derde lid][ref1], kunnen eveneens
      de specifieke vergunning voor het bevaren van binnenwateren met specifieke risico’s verkrijgen overeenkomstig
      [bijlage 5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel13.03
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0030215
  - number: 13.04.1
    text: Voor het besturen van een vaartuig op binnenwateren van maritieme aard is een specifieke vergunning vereist.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel13.04
  - number: 13.04.2
    text: |-
      Een kandidaat moet met goed gevolg een theoretisch examen overeenkomstig de ES-QIN (Deel I, hoofdstuk 3) afgelegd
      hebben.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel13.04
  - number: 13.04.3
    text: |-
      De bevoegde autoriteit geeft de specifieke vergunning voor het varen op binnenwateren van maritieme aard af
      na te hebben vastgesteld dat de aanvrager aan de in het tweede lid gestelde eisen voldoet en na de echtheid en
      de geldigheid van de door de aanvrager, overeenkomstig [artikel 13.01][ref1], verstrekte documenten te hebben
      gecontroleerd.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel13
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel13.04
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '13'
        hoofdstuk: '13'
        paragraaf: '3'
  - number: '13.05'
    text: |-
      Voor het besturen van een vaartuig dat vloeibaar aardgas als brandstof gebruikt, is een specifieke vergunning
      vereist. Deze wordt aangetoond door een kwalificatiecertificaat voor LNG-deskundige, dat wordt verkregen zoals
      bepaald in [artikel 15.02 tot en met 15.04][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel15
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel13.05
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '4'
  - number: 13.06.1
    text: |-
      Voor het besturen van een groot konvooi is een specifieke vergunning vereist. Een kandidaat moet een vaartijd van
      ten minste 720 dagen kunnen aantonen, waarvan ten minste 540 dagen als schipper. Hij moet ten minste 180 dagen de
      koers en snelheid van een groot konvooi zelfstandig bepaald hebben.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel13.06
  - number: 13.06.2
    text: |-
      De bevoegde autoriteit geeft de specifieke vergunning voor het varen met grote konvooien af na te hebben
      vastgesteld dat de aanvrager aan de in het eerste lid gestelde eisen voldoet en na de echtheid en de geldigheid van
      de door de aanvrager, overeenkomstig [artikel 13.01][ref1], verstrekte documenten te hebben gecontroleerd.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel13
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel13.06
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '13'
        hoofdstuk: '13'
        paragraaf: '3'
  - number: '14.01'
    text: |-
      Onverminderd de bepalingen van [Richtlijn 2008/68/EG](32008L0068) is aan boord van schepen die gevaarlijke stoffen
      vervoeren een persoon aanwezig zoals bedoeld in de randnummers 7.1.3.15 en 7.2.3.15 van het ADN die houder is van
      een verklaring van deskundigen volgens het model van randnummer 8.6.2. van het ADN.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel14.01
  - number: '15.01'
    text: |-
      De schipper en de personen die houder zijn van een kwalificatiecertificaat en die betrokken zijn bij de
      bunkerprocedure van schepen die op vloeibaar aardgas (LNG) varen, zijn gekwalificeerd als deskundige op het gebied
      van vloeibaar aardgas (LNG).
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel15.01
  - number: 15.02.1
    text: |-
      Deskundigen op het gebied van vloeibaar aardgas (LNG-deskundigen) tonen hun deskundigheid aan met een
      kwalificatiecertificaat deskundige op het gebied van vloeibaar aardgas (LNG) overeenkomstig het model in de ES-QIN
      (Deel V, hoofdstuk 1).
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel15.02
  - number: 15.02.2
    text: |-
      Het kwalificatiecertificaat deskundige op het gebied van vloeibaar aardgas (LNG) wordt afgegeven aan degene die
      voldoet aan de eisen van de [artikelen 15.03][ref1] en [15.04][ref2], en tenminste 18 jaar oud is.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0030215#Artikel15
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel15.02
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0030215
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '4'
  - number: 15.03.1
    text: |-
      De cursus om de vereiste kennis op te doen bestaat uit een theoretisch gedeelte en een praktisch gedeelte en wordt
      door een examen afgesloten.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel15.03
  - number: 15.03.2
    text: |-
      Het theoretisch gedeelte van de cursus omvat de in de ES-QIN (Deel I, hoofdstuk 6) genoemde competenties,
      aangegeven met ‘kennis van’.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel15.03
  - number: 15.03.3
    text: |-
      Het praktische gedeelte van de cursus betreft de toepassing van de verworven theoretische kennis in de praktijk
      aan boord van een schip dat vloeibaar aardgas (LNG) als brandstof gebruikt en/of in een daarvoor geschikte
      walinstallatie. Het omvat de in de ES-QIN (Deel V, Hoofdstuk 6) genoemde competenties, aangegeven met ‘vaardigheid
      om’.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel15.03
  - number: 15.03.4
    text: |-
      Het examen bestaat uit een theoretisch en uit een praktisch deel. Het theoretisch deel van het examen is met
      goed gevolg afgelegd wanneer de kandidaat heeft aangetoond in voldoende mate over de competenties te beschikken
      die in de ES-QIN (Deel I, hoofdstuk 6) zijn aangegeven met ‘kennis van’. Het praktisch deel van het examen
      is met goed gevolg afgelegd wanneer de kandidaat is geslaagd voor het praktijkexamen ter verkrijging van het
      kwalificatiecertificaat van deskundige op het gebied van vloeibaar aardgas (LNG), als vastgelegd in de ES-QIN (Deel
      II, hoofdstuk 3).
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel15.03
  - number: 15.03.5
    text: |-
      Het praktische deel van het examen wordt afgenomen aan boord van een schip en/of in een daarvoor geschikte
      walinstallatie, die voldoet aan de ‘Technische eisen inzake vaartuigen en faciliteiten aan de wal die voor
      praktijkexamens worden gebruikt’, als opgenomen in de ES-QIN (Deel II, hoofdstuk 3).
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel15.03
  - number: 15.04.1
    text: |-
      De cursussen worden goedgekeurd door de bevoegde autoriteiten op basis van de uniforme criteria overeenkomstig
      [artikel 15.05][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel15
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel15.04
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '4'
  - number: 15.04.2
    text: |-
      De bevoegde autoriteiten stellen de CCR in kennis van elk besluit over de goedkeuring van een cursus of over de
      intrekking of schorsing van een dergelijke goedkeuring.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel15.04
  - number: 15.05.1
    text: |-
      De bevoegde autoriteit kan een cursus goedkeuren wanneer zij tot de overtuiging is gekomen dat het
      opleidingsinstituut cursussen aanbiedt en examens afneemt die garant staan voor de benodigde kennis van
      bemanningsleden van vaartuigen die vloeibaar aardgas (LNG) als brandstof gebruiken. De cursussen en examens moeten
      voldoen aan [artikel 15.03][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel15
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel15.05
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '4'
  - number: 15.05.2
    text: 'De aanvraag om goedkeuring moet schriftelijk worden ingediend en de onderstaande documenten bevatten:'
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel15.05
  - number: 15.05.2.a)
    text: |-
      een gedetailleerd programma van de cursussen, met vermelding van de te onderwijzen onderwerpen, het lesrooster en
      de voorgenomen onderwijsmethoden,
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel15.05
  - number: 15.05.2.b)
    text: een lijst van de onderwijskrachten, hun kwalificaties en werkterreinen,
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel15.05
  - number: 15.05.2.c)
    text: |-
      informatie over de ruimte waar de cursussen plaatsvinden, over het onderwijsmateriaal alsook de faciliteiten voor
      de praktijkoefeningen en voor het praktijkexamen,
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel15.05
  - number: 15.05.2.d)
    text: de voorwaarden voor deelname aan de cursussen, bijvoorbeeld het aantal deelnemers,
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel15.05
  - number: 15.05.2.e)
    text: |-
      een beschrijving van het examenprogramma (theoretische en praktijkexamens) en het vereiste examenniveau om voor
      het examen te slagen, zowel voor het initiële examen als voor het examen dat vereist is voor de verlenging van
      de kwalificatie,
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel15.05
  - number: 15.05.2.f)
    text: |-
      een verklaring waarin het opleidingsinstituut zich ertoe verplicht de bevoegde autoriteit onverwijld en op eigen
      initiatief op de hoogte te stellen van elke wijziging in de gegevens, die genoemd zijn in onderdelen a) tot e).
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel15.05
  - number: 15.05.3
    text: |-
      De bevoegde autoriteit houdt toezicht op de cursussen en examens. De bevoegde autoriteit kan een verleende
      goedkeuring intrekken wanneer:
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel15.05
  - number: 15.05.3.a)
    text: |-
      blijkt dat niet aan de voorwaarden voor een goedkeuring voldaan was of niet meer aan deze voorwaarden wordt
      voldaan, of
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel15.05
  - number: 15.05.3.b)
    text: het opleidingsinstituut niet heeft voldaan aan zijn verplichting tot medewerking of andere verplichtingen.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel15.05
  - number: 15.06.1
    text: Het kwalificatiecertificaat heeft een geldigheidsduur van vijf jaar.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel15.06
  - number: 15.06.2
    text: |-
      Het geldige kwalificatiecertificaat overeenkomstig het model van de ES-QIN (Deel V, hoofdstuk 1) wordt op verzoek
      van de houder door de bevoegde autoriteit met vijf jaar verlengd met ingang van de datum van aanvraag wanneer de
      houder
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel15.06
  - number: 15.06.2.a)
    text: |-
      de onderstaande vaartijd kan aantonen op een vaartuig dat vaart op vloeibaar aardgas (LNG): - ten minste 180 dagen
      in de afgelopen vijf jaar, of
        - ten minste 90 dagen in het afgelopen jaar; of, wanneer dit niet het geval is,
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel15.06
  - number: 15.06.2.b)
    text: |-
      hij in het kader van een goedgekeurd opleidingsprogramma het examen zoals bedoeld in [artikel 15.03][ref1] nogmaals
      met succes heeft afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel15
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel15.06
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '4'
  - number: 16.01.1
    text: |-
      Aan boord van elk passagiersschip is veiligheidspersoneel in voldoende aantal aanwezig zolang er passagiers aan
      boord zijn.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.01
  - number: 16.01.2
    text: De leden van het veiligheidspersoneel kunnen deel uitmaken van de bemanning of het boordpersoneel.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.01
  - number: 16.02.1
    text: |-
      Om voor de eerste maal het kwalificatiecertificaat deskundige voor de passagiersvaart te verkrijgen, is de
      kandidaat ten minste 18 jaar en beschikt over de in de ES-QIN (Deel I, hoofdstuk 5) genoemde competenties.
      Deze competenties worden geacht aanwezig te zijn indien de betreffende persoon geslaagd is voor een examen
      overeenkomstig [artikel 16.03][ref1], dat werd georganiseerd:


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel16
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.02
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: '4'
  - number: 16.02.1.a)
    text: |-
      als onderdeel van een goedgekeurde opleiding overeenkomstig [artikel 16.04][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel16
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.02
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: '4'
  - number: 16.02.1.b)
    text: onder verantwoordelijkheid van een bevoegde autoriteit.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.02
  - number: 16.02.2
    text: Het kwalificatiecertificaat deskundige voor de passagiersvaart is vijf jaar geldig.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.02
  - number: 16.02.3
    text: |-
      Iedere aanvrager van een verlenging van een kwalificatiecertificaat deskundige voor de passagiersvaart, legt het
      examen, genoemd in het eerste lid, opnieuw met succes af.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.02
  - number: '16.03'
    text: |-
      Het examen bestaat uit een theoretisch en praktijkgedeelte. Aan het theoretisch gedeelte van het examen wordt
      voldaan wanneer de kandidaat aantoont dat hij beschikt over de in de ES-QIN (Deel I, hoofdstuk 5) genoemde kennis.
      Aan het praktijkgedeelte wordt voldaan wanneer de kandidaat met goed gevolg een praktijkexamen heeft afgelegd
      overeenkomstig de ES-QIN (Deel II, hoofdstuk 2). Het praktijkgedeelte van het examen wordt afgelegd aan boord van
      een vaartuig of met behulp van een walinstallatie die voldoet aan de technische eisen zoals vastgelegd in de ES-QIN
      (Deel II, hoofdstuk 2).
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.03
  - number: '16.04'
    text: |-
      De opleiding als bedoeld in [artikel 16.02, eerste lid, tweede zin, onderdeel a][ref1], wordt door de bevoegde
      autoriteit overeenkomstig de in [artikel 16.05][ref2] vastgelegde voorwaarden toegelaten en bestaat uit:


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0030215#Artikel16
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.04
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0030215
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: '4'
  - number: 16.04.a)
    text: een theoretische scholing om de in de ES-QIN (Deel I, hoofdstuk 5) genoemde kennis te verwerven;
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.04
  - number: 16.04.b)
    text: een praktische scholing om de in de ES-QIN (Deel II, hoofdstuk 2) genoemde vaardigheden op te doen.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.04
  - number: 16.05.1
    text: |-
      De goedkeuring van de opleidingen wordt gedaan door de bevoegde autoriteiten op basis van [artikel 16.06][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel16
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.05
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: '4'
  - number: 16.05.2
    text: |-
      De bevoegde autoriteiten stellen de CCR op de hoogte van elke besluit over de goedkeuring van een cursus of de
      intrekking of opschorting van een goedkeuring.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.05
  - number: 16.06.1
    text: |-
      De bevoegde autoriteit kan op basis van de voorwaarden van [artikel 16.03][ref1], een cursus goedkeuren wanneer zij
      tot de overtuiging is gekomen dat het opleidingsinstituut cursussen aanbiedt of examens afneemt die garant staan
      voor de benodigde kennis van deskundigen voor passagiersvaart.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel16
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.06
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: '4'
  - number: 16.06.2
    text: 'De aanvraag ter goedkeuring wordt schriftelijk ingediend en bevat de onderstaande documenten:'
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.06
  - number: 16.06.2.a)
    text: |-
      een gedetailleerd programma van de cursussen, met vermelding van de te onderwijzen onderwerpen, het lesrooster en
      de voorgenomen onderwijsmethoden, zowel voor de initiële opleiding als de opfriscursus,
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.06
  - number: 16.06.2.b)
    text: een lijst van de onderwijskrachten, hun kwalificaties en werkterreinen,
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.06
  - number: 16.06.2.c)
    text: |-
      informatie over de ruimte waar de cursussen plaatsvinden, over het onderwijsmateriaal alsook de faciliteiten voor
      de praktijkoefeningen,
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.06
  - number: 16.06.2.d)
    text: de voorwaarden voor deelname aan de cursussen, bijvoorbeeld het aantal deelnemers,
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.06
  - number: 16.06.2.e)
    text: |-
      een beschrijving van het examenprogramma (theoretische en praktijkexamens) en de vereiste resultaten om voor
      het examen te slagen, zowel voor het initiële examen als voor het examen in het kader van de verlenging van het
      kwalificatiecertificaat,
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.06
  - number: 16.06.2.f)
    text: |-
      een verklaring waarin het opleidingsinstituut zich ertoe verplicht de bevoegde autoriteit onverwijld en op eigen
      initiatief op de hoogte te stellen van elke wijziging in de gegevens, die genoemd zijn in onderdelen a) tot e).
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.06
  - number: 16.06.3
    text: |-
      De bevoegde autoriteit houdt toezicht op de cursussen en examens. De bevoegde autoriteit kan een verleende
      goedkeuring overeenkomstig de nationale voorschriften van een Rijnoeverstaat en België intrekken wanneer
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.06
  - number: 16.06.3.a)
    text: |-
      blijkt dat niet aan de voorwaarden voor een goedkeuring voldaan was of niet meer aan deze voorwaarden wordt
      voldaan, of
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.06
  - number: 16.06.3.b)
    text: het opleidingsinstituut niet heeft voldaan aan zijn verplichting tot medewerking of andere verplichtingen.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.06
  - number: '16.07'
    text: |-
      De eerstehulpverlener moet ten minste 17 jaar zijn en de vereiste kwalificatie bezitten. Deze wordt geacht aanwezig
      te zijn, indien de desbetreffende persoon
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.07
  - number: 16.07.a)
    text: aan een cursus voor eerstehulpverlener heeft deelgenomen, en
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.07
  - number: 16.07.b)
    text: |-
      regelmatig overeenkomstig [artikel 16.09][ref1] aan de opfriscursussen heeft deelgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel16
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.07
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: '4'
  - number: '16.08'
    text: |-
      De persluchtmaskerdrager moet ten minste 18 jaar zijn en geschikt zijn om de ademhalingsapparatuur zoals bedoeld in
      [artikel 19.12, tiende lid, onderdeel a, van de ES-TRIN][ref1], voor de redding van personen te kunnen gebruiken.
      Deze wordt geacht aanwezig te zijn, indien de betreffende persoon de lichamelijke en geestelijke geschiktheid en
      de kwalificatie overeenkomstig de nationale voorschriften van de Rijnoeverstaten of België aantoont en regelmatig
      overeenkomstig [artikel 16.09][ref2] aan de opfriscursussen heeft deelgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0030215#Artikel16
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.08
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0030215
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: '4'
  - number: '16.09'
    text: |-
      De opleiding en opfriscursussen voor eerstehulpverleners en persluchtmaskerdragers worden gevolgd overeenkomstig de
      voorschriften van één van de Rijnoeverstaten of België.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.09
  - number: 16.10.1
    text: |-
      De bevoegde autoriteit geeft na het succesvol afleggen van het examen, als bedoeld in [artikel 16.03][ref1], het
      kwalificatiecertificaat af van deskundige voor de passagiersvaart overeenkomstig de ES-QIN (Deel V, hoofdstuk 1).


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel16
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.10
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: '4'
  - number: 16.10.2
    text: |-
      Op vertoon van het bewijs van de opleiding zoals bedoeld in [artikel 16.07][ref1] en [16.09][ref2] geeft de
      bevoegde autoriteit een verklaring af betreffende de bevoegdheid als eerstehulpverlener volgens het model van
      [bijlage 6][ref3] of verlengt deze. Als verklaringen gelden ook de documenten van de nationale of regionale
      organisaties van het Rode Kruis of vergelijkbare nationale of regionale reddingsorganisaties die door de CCR bekend
      worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0030215#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.10
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0030215
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0030215
  - number: 16.10.3
    text: |-
      Op vertoon van het bewijs van de opleiding zoals bedoeld in [artikel 16.08][ref1] en [16.09][ref2] geeft de
      bevoegde autoriteit een verklaring af betreffende de bevoegdheid als persluchtmaskerdrager volgens het model van
      [bijlage 7][ref3] of verlengt deze.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0030215#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.10
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0030215
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0030215
  - number: 16.11.1
    text: |-
      Deskundigen voor de passagiersvaart, eerstehulpverleners en persluchtmaskerdragers moeten ten minste in de
      navolgende aantallen aanwezig zijn:
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.11
  - number: 16.11.1.a)
    text: |-
      gedurende de vaart aan boord:








                          aa) schepen voor dagtochten




                          Groep


                          Aantal personen aan boord


                          Deskundige voor de passagiersvaart


                          Eerstehulpverleners






                          1


                          tot en met 250


                          1


                          1




                          2


                          meer dan 250


                          1


                          2














                          bb) hotelschepen




                          Groep


                          Aantal bezette bedden


                          Deskundigen voor de passagiersvaart


                          Eerstehulp-verleners


                          Persluchtmaskerdragers






                          1


                          tot en met 100


                          1


                          1


                          2




                          2


                          meer dan 100


                          1


                          2


                          2
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.11
  - number: 16.11.1.b)
    text: |-
      permanent beschikbaar tijdens het stilliggen: het in bovenstaande tabel voorgeschreven veiligheidspersoneel in
      onderdeel a voor groep 1.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.11
  - number: 16.11.2
    text: |-
      Op schepen voor dagtochten met een toegelaten aantal personen van niet meer dan 75 en op stilliggende
      passagiersschepen mogen de functies van deskundigen voor de passagiersvaart en eerstehulpverlener door één en
      dezelfde persoon worden waargenomen. In alle andere gevallen mag de taak van deskundige voor de passagiersvaart,
      eerstehulpverlener en persluchtmaskerdrager niet door één en dezelfde persoon worden waargenomen.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.11
  - number: 16.12.1
    text: |-
      Onverminderd de voorschriften van het [Rijnvaartpolitiereglement][ref1] draagt de schipper er zorg voor:


      [ref1]: https://wetten.overheid.nl/BWBR0006923
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.12
    references:
      - id: ref1
        bwb_id: BWBR0006923
  - number: 16.12.1.a)
    text: |-
      de deskundige voor de passagiersvaart met het veiligheidsdossier en het veiligheidsplan, zoals bedoeld in
      [artikel 19.13 van de ES-TRIN][ref1] vertrouwd te maken,


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel19
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.12
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '19'
  - number: 16.12.1.b)
    text: het veiligheidspersoneel te instrueren en bekend maken met het passagiersschip,
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.12
  - number: 16.12.1.c)
    text: |-
      de vereiste kwalificatie van het veiligheidspersoneel aan boord, zoals bedoeld in de
      [artikelen 16.02 tot en met 16.09][ref1], op ieder momentaan de hand van de verklaringen zoals bedoeld in
      [artikel 16.10][ref2] te kunnen aantonen,


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0030215#Artikel16
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.12
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0030215
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: '4'
  - number: 16.12.1.d)
    text: ervoor te zorgen dat gecontroleerd kan worden dat er regelmatig veiligheidsrondes plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.12
  - number: 16.12.2
    text: |-
      De deskundige voor de passagiersvaart draagt zorg voor het toezicht van de veiligheidsinrichtingen en -uitrustingen
      overeenkomstig het veiligheidsdossier en voor de veiligheid van de passagiers in geval van gevaar en in
      noodsituaties aan boord. Hij kent het veiligheidsdossier en het veiligheidsplan in detail en overeenkomstig de door
      de schipper verstrekte instructies moet hij:
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.12
  - number: 16.12.2.a)
    text: |-
      de leden van de bemanning en het boordpersoneel die op grond van het veiligheidsdossier in noodsituaties bepaalde
      taken te vervullen hebben, deze taken toekennen;
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.12
  - number: 16.12.2.b)
    text: de leden van de bemanning en het boordpersoneel regelmatig over de hun toebedeelde taken informeren;
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.12
  - number: 16.12.2.c)
    text: |-
      de passagiers aan boord van hotelschepen bij het begin van de reis over de inhoud van het veiligheidsplan
      informeren en wat zij moeten doen;
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.12
  - number: 16.12.2.d)
    text: passagiers bijstaan ten aanzien van hun rechten als passagiers.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.12
  - number: '16.13'
    text: |-
      Zolang zich passagiers aan boord bevinden, moet er ’s nachts ieder uur een controleronde gemaakt worden. Er moet op
      een adequate wijze kunnen worden gecontroleerd of deze rondes plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel16.13
  - number: 17.01.1
    text: |-
      De bemanning en het veiligheidspersoneel die zich overeenkomstig het [Rijnvaartpolitiereglement][ref1] aan boord
      bevinden van schepen die de Rijn bevaren, voldoen aan de voorschriften van dit reglement. De voor de desbetreffende
      exploitatiewijze en vaartijd voorgeschreven bemanning en veiligheidspersoneel bevinden zich tijdens de vaart
      voortdurend aan boord. Het is niet toegestaan zonder de voorgeschreven bemanning of zonder het veiligheidspersoneel
      te vertrekken. Schepen waarvan door onvoorziene omstandigheden (bijvoorbeeld ziekte, ongeval, bevel van een
      bevoegde autoriteit) tijdens de vaart ten hoogste één lid van de voorgeschreven bemanning uitvalt, mogen
      niettemin hun reis voortzetten tot de eerstvolgende geschikte aanlegplaats in de richting waarin gevaren wordt –
      passagiersschepen tot het eindpunt van de reis van die dag – indien zich aan boord naast een persoon die houder is
      van een kwalificatiecertificaat schipper voor het desbetreffende riviergedeelte, nog een lid van de voorgeschreven
      bemanning bevindt. De persoon die belast is met het toezicht op en de verzorging van zich aan boord bevindende
      kinderen onder de zes jaar, mag geen lid van de minimumbemanning zijn, tenzij er maatregelen zijn getroffen om de
      veiligheid van de kinderen ook zonder voortdurend toezicht te waarborgen.


      [ref1]: https://wetten.overheid.nl/BWBR0006923
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel17.01
    references:
      - id: ref1
        bwb_id: BWBR0006923
  - number: 17.01.2
    text: |-
      Elke Rijnoeverstaat of België kan bepalen dat de nationale voorschriften betreffende de arbeidsbescherming van
      toepassing zijn op de Rijnschepen die in die staat zijn ingeschreven. Niet in een register ingeschreven schepen
      vallen onder de wettelijke voorschriften van die Rijnoeverstaat of België waarin het bedrijf zijn hoofdzetel
      of de eigenaar zijn wettelijke domicilie heeft. In afwijking hiervan kunnen de bevoegde autoriteiten van de
      Rijnoeverstaten of België bilateraal overeenkomen dat bepaalde schepen die in de ene staat zijn ingeschreven, onder
      de voorschriften van de andere staat vallen. Zwangere vrouwen en kraamvrouwen mogen gedurende ten minste 14 weken,
      waarvan ten minste zes weken voor en zeven weken na de bevalling geen deel uitmaken van de bemanning.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel17.01
  - number: 17.01.3
    text: |-
      Voor de toepassing van de [artikelen 18.01][ref1], [18.02][ref2] en [18.03][ref3] wordt tevens rekening gehouden
      met vaar- en rusttijden die buiten het toepassingsgebied van dit reglement vervuld zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0030215#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0030215#Artikel18
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel17.01
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '18'
        hoofdstuk: '18'
      - id: ref2
        bwb_id: BWBR0030215
        artikel: '18'
        hoofdstuk: '18'
      - id: ref3
        bwb_id: BWBR0030215
        artikel: '18'
        hoofdstuk: '18'
  - number: 17.01.4
    text: |-
      De houder van een Rijnpatent mag alleen de functie van schipper uitoefenen indien hij daartoe de nodige
      geschiktheid bezit.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel17.01
  - number: 17.01.5
    text: |-
      De in het vierde lid genoemde geschiktheid kan door de bevoegde autoriteiten krachtens nationaal recht worden
      onderzocht. Indien de bevoegde autoriteit tot de conclusie komt dat de houder van het Rijnpatent ongeschikt is
      kan hem de uitoefening van de functie van schipper worden verboden. Een intrekking of schorsing als bedoeld in
      [artikel 8.01][ref1] of [8.02][ref2] uitsluitend om deze reden is niet toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0030215#Artikel8
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel17.01
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0030215
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '1'
  - number: 17.02.1
    text: |-
      Wanneer in de bepalingen van dit gedeelte is vastgelegd dat bepaalde bemanningsvoorschriften van toepassing zijn,
      kan de bevoegde autoriteit rekening houdend met de voorschriften in het [Rijnvaartpolitiereglement][ref1] toestaan
      dat andere bemanningsvoorschriften worden toegepast, op voorwaarde dat deze op grond van aanbevelingen van de CCR
      als gelijkwaardig zijn erkend.


      [ref1]: https://wetten.overheid.nl/BWBR0006923
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel17.02
    references:
      - id: ref1
        bwb_id: BWBR0006923
  - number: 17.02.2
    text: |-
      Bij wijze van proef en voor een beperkte tijdsduur kan een bevoegde autoriteit op grond van een aanbeveling van de
      CCR voor een vaartuig met nieuwe technische voorzieningen andere regelingen voor de minimumbemanning vastleggen, op
      voorwaarde dat deze regelingen in het kader van de nieuwe technische voorzieningen voldoende veiligheid waarborgen.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel17.02
  - number: 17.02.3
    text: |-
      De gelijkwaardigheden en afwijkingen zoals bedoeld in het eerste en tweede lid moeten in het binnenschipcertificaat
      worden ingeschreven.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel17.02
  - number: 17.02.4
    text: |-
      De bevoegde autoriteiten informeren de CCR binnen één maand over de toekenning van een gelijkwaardigheid of
      afwijking. De CCR publiceert een lijst met de toegekende gelijkwaardigheden en afwijkingen.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel17.02
  - number: 18.01.1
    text: 'Men onderscheidt de volgende exploitatiewijzen:'
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel18.01
  - number: 18.01.1.A1
    text: vaart van ten hoogste 14 uur,
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel18.01
  - number: 18.01.1.A2
    text: vaart van ten hoogste 18 uur,
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel18.01
  - number: 18.01.1.B
    text: vaart van ten hoogste 24 uur,
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel18.01
  - number: 18.01.2
    text: |-
      Bij exploitatiewijze A1 mag de vaart eenmaal per kalenderweek tot maximaal 16 uur worden verlengd, indien de
      vaartijd kan worden aangetoond met de registraties van een tachograaf die voldoet aan de eisen van [Bijlage 5,
      Onderdeel V van de ES-TRIN](onbekend) betreffende minimumeisen en voorschriften omtrent de inbouw en de controle
      van het functioneren van tachografen in de binnenvaart, en wanneer afgezien van de schipper nog een ander
      bemanningslid van de minimumbemanning een kwalificatiecertificaat stuurman heeft.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel18.01
  - number: 18.01.3
    text: |-
      Een schip dat in exploitatiewijze A1, respectievelijk A2 wordt geëxploiteerd, moet de vaart gedurende acht,
      respectievelijk zes aaneengesloten uren onderbreken, te weten:
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel18.01
  - number: 18.01.3.a)
    text: in de exploitatiewijze A1 tussen 22.00 en 06.00 uur, en
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel18.01
  - number: 18.01.3.b)
    text: in de exploitatiewijze A2 tussen 23.00 en 05.00 uur.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel18.01
  - number: 18.02.1
    text: |-
      Bij exploitatiewijze A1 heeft elk bemanningslid recht op een ononderbroken rusttijd van acht uur buiten de vaartijd
      per periode van 24 uur, gerekend vanaf het einde van elke rusttijd van acht uur.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel18.02
  - number: 18.02.2
    text: |-
      Bij exploitatiewijze A2 heeft elk bemanningslid recht op een rusttijd van acht uur, waarvan zes uur ononderbroken
      buiten de vaartijd per periode van 24 uur, gerekend vanaf het einde van elke rusttijd van zes uur. Voor
      bemanningsleden onder de 18 jaar wordt een ononderbroken rusttijd van acht uur in acht genomen waarvan zes uur
      buiten de vaartijd.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel18.02
  - number: 18.02.3
    text: |-
      Bij exploitatiewijze B heeft elk bemanningslid recht op een rusttijd van 24 uur per periode van 48 uur, waarvan ten
      minste twee maal zes uur ononderbroken zijn.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel18.02
  - number: 18.02.4
    text: |-
      In afwijking van het eerste en tweede lid kan de rusttijd tevens tijdens de vaart plaatsvinden, indien: - ook
      tijdens deze rusttijd te allen tijde het voor de veiligheid van het schip vereiste aantal bemanningsleden –
      waaronder tenminste één schipper – wordt ingezet, en
        - de mogelijkheid bestaat de rusttijd door te brengen in een slechts aan één bemanningslid toegewezen ruimte die
      geschikt is om uit te rusten en afgeschermd is tegen geluid of trillingen boven de toegelaten grenswaarde. In deze
      ruimte wordt de geluidsdruk van 60 dB(A) niet overschreden, hetgeen moet blijken uit het binnenschipcertificaat,
      waarbij de geluidsdruk gemeten dient te worden overeenkomstig de geldende voorschriften van de [ES-TRIN][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0041395
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel18.02
    references:
      - id: ref1
        bwb_id: BWBR0041395
  - number: 18.02.5
    text: |-
      Gedurende zijn verplichte rusttijd mag een bemanningslid niet voor enigerlei taak worden ingezet, ook niet om
      toezicht te houden of stand-by te zijn. De in de politievoorschriften bedoelde wacht- en toezichtstaken voor
      stilliggende vaartuigen worden niet als taak in de zin van dit lid beschouwd.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel18.02
  - number: 18.02.6
    text: |-
      Bepalingen in de arbeidsvoorschriften met inbegrip van bepalingen voortvloeiend uit het recht van de Europese Unie
      of collectieve arbeidsovereenkomsten die langere rusttijden voorschrijven, blijven onverlet.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel18.02
  - number: 18.03.1
    text: |-
      In afwijking van [artikel 18.02, eerste en derde lid][ref1], is een wisseling of herhaling van de exploitatiewijze
      slechts mogelijk met inachtneming van de bepalingen van het tweede tot met zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel18
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel18.03
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.03.2
    text: 'Van exploitatiewijze A1 mag slechts dan naar exploitatiewijze A2 worden gewisseld, indien:'
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel18.03
  - number: 18.03.2.a)
    text: de bemanning in zijn geheel is afgelost, of
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel18.03
  - number: 18.03.2.b)
    text: |-
      de voor exploitatiewijze A2 bestemde bemanningsleden direct vóór de wisseling een rusttijd van acht uur, waarvan
      zes uur buiten de vaartijd, in acht genomen en aangetoond hebben en de voor exploitatiewijze A2 voorgeschreven
      versterking zich aan boord bevindt.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel18.03
  - number: 18.03.3
    text: 'Van exploitatiewijze A2 mag slechts dan naar exploitatiewijze A1 worden gewisseld, indien:'
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel18.03
  - number: 18.03.3.a)
    text: de bemanning in zijn geheel is afgelost, of
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel18.03
  - number: 18.03.3.b)
    text: |-
      de voor exploitatiewijze A1 bestemde bemanningsleden direct vóór de wisseling een ononderbroken rust van acht uur
      buiten de vaartijd in acht genomen en aangetoond hebben.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel18.03
  - number: 18.03.4
    text: 'Van exploitatiewijze B mag slechts dan naar exploitatiewijze A1 of A2 worden gewisseld, indien:'
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel18.03
  - number: 18.03.4.a)
    text: de bemanning in zijn geheel is afgelost, of
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel18.03
  - number: 18.03.4.b)
    text: |-
      de voor exploitatiewijze A1, respectievelijk A2 bestemde bemanningsleden direct vóór de wisseling een ononderbroken
      rusttijd van acht, respectievelijk zes uur in acht genomen en aangetoond hebben.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel18.03
  - number: 18.03.5
    text: 'Van exploitatiewijze A1 of A2 mag slechts dan naar exploitatiewijze B worden gewisseld, indien:'
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel18.03
  - number: 18.03.5.a)
    text: de bemanning in zijn geheel is afgelost, of
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel18.03
  - number: 18.03.5.b)
    text: |-
      de voor exploitatiewijze B bestemde bemanningsleden direct vóór de wisseling een ononderbroken
      rusttijd van acht, respectievelijk zes uur buiten de vaartijd of overeenkomstig de voorschriften van
      [artikel 18.02, vierde lid][ref1], in acht genomen en aangetoond hebben, en de voor exploitatiewijze B
      voorgeschreven versterking zich aan boord bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel18
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel18.03
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.03.6
    text: |-
      Een vaartuig kan onmiddellijk in aansluiting op een reis in exploitatiewijze A1 of A2 voor een volgende reis in
      exploitatiewijze A1 of A2 worden ingezet, indien een voltallige uitwisseling van de bemanning heeft plaatsgevonden
      en de nieuwe bemanningsleden onmiddellijk voorafgaand aan de verdere exploitatiewijze A1 en A2 een ononderbroken
      rusttijd van acht, respectievelijk zes uur buiten de vaartijd in acht genomen en aangetoond hebben.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel18.03
  - number: 18.03.7
    text: |-
      Het bewijs van een rusttijd van acht, respectievelijk zes uur wordt aangetoond met een verklaring als bedoeld
      in [bijlage 8][ref1] of door een kopie van de pagina van het vaartijdenboek van het vaartuig waarop de laatste
      reis van het bemanningslid heeft plaatsgevonden en de vaar-, respectievelijk rusttijden, vermeld staan. Indien de
      rusttijd tijdens de vaart plaatsvond, is tevens een kopie van het binnenschipcertificaat van het betreffende schip
      vereist waaruit blijkt dat de maximale geluidsdruk in die ruimte van dit schip voldoet aan de voorschriften van
      [artikel 18.02, vierde li][ref2]d.


      [ref1]: https://wetten.overheid.nl/BWBR0030215
      [ref2]: https://wetten.overheid.nl/BWBR0030215#Artikel18
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel18.03
    references:
      - id: ref1
        bwb_id: BWBR0030215
      - id: ref2
        bwb_id: BWBR0030215
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.04.1
    text: |-
      Aan boord van elk vaartuig, met uitzondering van sleep- en duwboten die slechts in havens verkeren, onbemande
      duwbakken, overheidsschepen en pleziervaartuigen, moet zich in de stuurhut een actief vaartijdenboek volgens
      het model in de ES-QIN (Deel V, hoofdstuk 5) bevinden. Dit wordt bijgehouden overeenkomstig de daarin vervatte
      aanwijzingen. De schipper is verantwoordelijk voor de aanwezigheid van het vaartijdenboek en de aantekeningen die
      daarin worden gemaakt. Het eerste vaartijdenboek wordt afgegeven door een bevoegde autoriteit op vertoon van een
      binnenschipcertificaat.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel18.04
  - number: 18.04.2
    text: |-
      Alle daaropvolgende vaartijdenboeken mogen worden afgegeven door elke bevoegde autoriteit, die het vaartijdenboek
      van een volgnummer voorziet; zij kunnen evenwel slechts worden afgegeven tegen overlegging van het voorgaande
      vaartijdenboek. Het voorgaande vaartijdenboek wordt voorzien van de onuitwisbare aantekening ‘ongeldig’ en dient
      aan de schipper te worden teruggegeven. De afgifte van een nieuw vaartijdenboek kan geschieden op vertoon van het
      in het vierde lid bedoelde document. De eigenaar van het schip zorgt ervoor dat het voorafgaande vaartijdenboek
      binnen 30 dagen na de afgiftedatum van het nieuwe vaartijdenboek wordt voorgelegd aan dezelfde bevoegde autoriteit
      die voor het nieuwe vaartijdenboek de in het vierde lid bedoelde verklaring heeft opgesteld, zodat deze autoriteit
      het bovengenoemde voorafgaande vaartijdenboek kan voorzien van de vermelding ‘ongeldig’. De eigenaar van het schip
      zorgt er bovendien voor dat het vaartijdenboek daarna weer aan boord wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel18.04
  - number: 18.04.3
    text: Het ongeldig gemaakte vaartijdenboek wordt gedurende zes maanden na de laatste aantekening aan boord bewaard.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel18.04
  - number: 18.04.4
    text: |-
      Bij de afgifte van het eerste vaartijdenboek overeenkomstig het eerste lid bevestigt de autoriteit die het
      eerste vaartijdenboek afgeeft, deze afgifte door middel van een verklaring waarop de naam van het schip, het
      uniek Europees identificatienummer (ENI) van het schip, het nummer van het vaartijdenboek en de datum van
      afgifte zijn vermeld. Deze verklaring wordt aan boord bewaard en wordt op verzoek getoond. De afgifte van
      latere vaartijdenboeken overeenkomstig het tweede lid moet door de bevoegde autoriteit op de verklaring worden
      aangetekend.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel18.04
  - number: 18.04.5
    text: |-
      De naleving van de rusttijden kan bovendien door middel van een tachograaf worden aangetoond, die voldoet aan de
      technische vereisten van [artikel 18.01, tweede lid][ref1]. De registraties van de tachografen wordt gedurende zes
      maanden na de laatste registratie aan boord bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel18
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel18.04
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.04.6
    text: |-
      Bij aflossing of versterking van de bemanning als bedoeld in [artikel 18.03][ref1] is voor ieder nieuw
      bemanningslid een verklaring overeenkomstig [bijlage 8][ref2] of een kopie van de pagina met de aantekeningen
      van de vaar-, respectievelijk rusttijden uit het vaartijdenboek van het vaartuig waarop de laatste reis van het
      bemanningslid heeft plaatsgevonden, voorhanden.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel18.04
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '18'
        hoofdstuk: '18'
      - id: ref2
        bwb_id: BWBR0030215
  - number: 18.04.7.a)
    text: |-
      De regeling voor het bijhouden van het vaartijdenboek op grond waarvan één enkel schema per reis voor de
      aantekeningen van de rusttijden voldoende is, geldt uitsluitend voor de bemanningsleden in de exploitatiewijze B.
      In de exploitatiewijzen A1 en A2 moeten voor elk bemanningslid het begin en het einde van de rusttijden van elke
      dag gedurende de reis worden genoteerd.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel18.04
  - number: 18.04.7.b)
    text: |-
      De na de wisseling van de exploitatiewijze vereiste aantekeningen moeten op een nieuwe bladzijde van het
      vaartijdenboek worden genoteerd.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel18.04
  - number: 18.04.7.c)
    text: |-
      Worden per dag twee of meer reizen met ongewijzigde bemanning afgelegd, kan worden volstaan met het invullen van
      het tijdstip van het begin van de eerste dagvaart en van het einde van de laatste dagvaart.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel18.04
  - number: 19.01.1
    text: |-
      Onverminderd de bepalingen van de [ES-TRIN][ref1] voldoen motorschepen, duwboten, duwstellen en passagiersschepen,
      om met een minimumbemanning overeenkomstig deze [paragraaf][ref2] te worden geëxploiteerd, aan een van de volgende
      uitrustingsstandaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0041395
      [ref2]: https://wetten.overheid.nl/BWBR0030215#Hoofdstuk19
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel19.01
    references:
      - id: ref1
        bwb_id: BWBR0041395
      - id: ref2
        bwb_id: BWBR0030215
        hoofdstuk: '19'
  - number: 19.01.1.1.1
    text: Standaard S1
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel19.01
  - number: 19.01.1.1.1.a)
    text: |-
      De voortstuwingsinstallaties is zo ingericht dat de verandering van de vaarsnelheid en de omkering van de richting
      van de stuwkracht van de schroef vanaf de stuurstelling kunnen geschieden. De hulpmotoren die nodig zijn bij het
      varen met het schip moeten vanaf de stuurstelling kunnen worden aan- en afgezet, tenzij dit automatisch geschiedt,
      dan wel deze motoren gedurende elke reis ononderbroken in bedrijf zijn.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel19.01
  - number: 19.01.1.1.1.b)
    text: |-
      Het kritieke peil van de temperatuur van het koelwater van de hoofdmotoren, van de druk van de smeerolie van
      de hoofdmotoren en de transmissie, van de oliedruk en de luchtdruk van de omkeerinrichting van de hoofdmotoren,
      de keerkoppeling of de schroeven en van het bilgewater in de hoofdmachinekamer moet worden aangegeven door
      installaties die in het stuurhuis akoestische en optische alarmsignalen in werking stellen. De akoestische
      alarmsignalen mogen in één akoestisch apparaat verenigd zijn. Zij mogen worden uitgeschakeld zodra de storing
      is vastgesteld. De optische alarmsignalen mogen pas worden uitgeschakeld, nadat de desbetreffende storingen zijn
      verholpen.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel19.01
  - number: 19.01.1.1.1.c)
    text: De brandstoftoevoer en de koeling van de hoofdmotoren dienen automatisch te geschieden.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel19.01
  - number: 19.01.1.1.1.d)
    text: |-
      De bediening van de stuurinrichting moet zelfs bij de grootste toegelaten inzinking door één persoon zonder
      bijzondere krachtsinspanning kunnen worden verricht.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel19.01
  - number: 19.01.1.1.1.e)
    text: |-
      De bij het [Rijnvaartpolitiereglement][ref1] voorgeschreven optische tekens en geluidsseinen van varende schepen
      dienen vanaf de stuurstelling te kunnen worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006923
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel19.01
    references:
      - id: ref1
        bwb_id: BWBR0006923
  - number: 19.01.1.1.1.f)
    text: |-
      Indien geen rechtstreeks contact mogelijk is tussen de stuurstelling en het voorschip, het achterschip, de
      verblijven en de machinekamer, dient een spreekverbinding te zijn aangebracht. Voor contact met de machinekamer
      mogen in plaats van een spreekverbinding optische en akoestische signalen worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel19.01
  - number: 19.01.1.1.1.g)
    text: |-
      De kracht die nodig is om zwengels en soortgelijke draaibare voorzieningen van hefwerktuigen te bedienen, mag niet
      meer dan 160 N bedragen.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel19.01
  - number: 19.01.1.1.1.h)
    text: De in het binnenschipcertificaat vermelde sleeplieren dienen door een motor te worden aangedreven.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel19.01
  - number: 19.01.1.1.1.i)
    text: De lenspompen en de dekwaspompen dienen door een motor te worden aangedreven.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel19.01
  - number: 19.01.1.1.1.j)
    text: De voornaamste bedieningsinrichtingen en controle-instrumenten dienen ergonomisch te zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel19.01
  - number: 19.01.1.1.1.k)
    text: |-
      De krachtens [artikel 6.01, eerste lid, van de ES-TRIN][ref1] vereiste inrichtingen dienen vanaf de stuurstelling
      te kunnen worden bediend.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel6
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel19.01
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '6'
  - number: 19.01.1.1.2
    text: Standaard S2
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel19.01
  - number: 19.01.1.1.2.a)
    text: |-
      voor alleen varende motorschepen: Standaard S1 en bovendien een uitrusting met een vanuit de stuurstelling
      bedienbare boegschroefinstallatie;
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel19.01
  - number: 19.01.1.1.2.b)
    text: |-
      voor motorschepen, die gekoppelde vaartuigen voortbewegen: Standaard S1 en bovendien een uitrusting met een vanuit
      de stuurstelling bedienbare boegschroefinstallatie;
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel19.01
  - number: 19.01.1.1.2.c)
    text: |-
      voor motorschepen die een duwstel, bestaande uit het motorschip en een vaartuig ervoor, voortbewegen: Standaard S1
      en bovendien een uitrusting met hydraulisch of elektrisch aangedreven koppellieren. Deze uitrusting is echter niet
      vereist, wanneer het vaartuig aan de kop van het duwstel met een boegschroefinstallatie is uitgerust die vanuit de
      stuurstelling van het duwende motorschip te bedienen is;
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel19.01
  - number: 19.01.1.1.2.d)
    text: |-
      voor duwboten die een duwstel voortbewegen: Standaard S1 en bovendien een uitrusting met hydraulisch of elektrisch
      aangedreven koppellieren. Deze uitrusting is echter niet vereist, wanneer het vaartuig aan de kop van het duwstel
      met een boegschroefinstallatie is uitgerust die vanuit de stuurstelling van de duwende duwboot te bedienen is;
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel19.01
  - number: 19.01.1.1.2.e)
    text: |-
      voor passagiersschepen: Standaard S1 en bovendien een uitrusting met een vanuit de stuurstelling bedienbare
      boegschroefinstallatie. Deze uitrusting is echter niet vereist, indien de voortstuwingsinstallatie en de
      stuurinrichting van het passagiersschip gelijkwaardige manoeuvreereigenschappen waarborgen.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel19.01
  - number: 19.01.2
    text: |-
      Het voldoen of niet voldoen aan de voorschriften van 1.1 of 1.2 wordt door de Commissie van Deskundigen in het
      binnenschipcertificaat onder nummer 47 ingeschreven.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel19.01
