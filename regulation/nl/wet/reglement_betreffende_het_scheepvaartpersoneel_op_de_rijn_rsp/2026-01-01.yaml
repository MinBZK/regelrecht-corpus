  - number: 19.04.4
    text: |-
      Voor passagiersschepen zoals bedoeld in het eerste en het derde lid die zonder passagiers aan boord varen, wordt de
      minimumbemanning bepaald overeenkomstig [artikel 19.02][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel19
