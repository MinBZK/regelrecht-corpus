    text: |-
      in de exploitatiewijze B met twee matrozen. Wordt alleen niet voldaan aan de gestelde eisen in de onderdelen g en
      j, respectievelijk de onderdelen g of j van de standaard S1, zoals bedoeld in [artikel 19.01, lid 1.1][ref1], dan
      wordt de bemanning bij exploitatiewijze B met één matroos in plaats van twee verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel19
