  - number: 19.04.9
    text: |-
      Bij dagtochtschepen met passagiers waarvan het aantal voor vertrek vaststaat en tijdens de vaart niet wijzigt
      (chartervaart), kan de overeenkomstig de groepen 2 tot en met 6 voorgeschreven minimumbemanning worden gereduceerd
      tot de eerst lagere groep, op voorwaarde dat het overeenkomstig de groepen 1 tot en met 6 toegelaten aantal
      passagiers tijdens de vaart lager is dan dit toegestane aantal. De eisen van [hoofdstuk 16][ref1], alsmede de eisen
      die gelden voor de bemanning en het boordpersoneel uit hoofde van de veiligheidsrol gelden onverminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Hoofdstuk16
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel19.04
    references:
