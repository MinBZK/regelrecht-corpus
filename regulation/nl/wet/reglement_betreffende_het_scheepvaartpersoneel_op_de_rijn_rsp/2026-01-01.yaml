  - number: 19.05.2
    text: |-
      Voldoet de uitrusting van een vaartuig slechts gedeeltelijk aan de standaard S1 zoals deze is bepaald in
      [artikel 19.01][ref1] van dit reglement, en niet aan één of meer van de in artikel 19.01, lid 1.1, onderdelen a tot
      en met c, van dit reglement gestelde eisen wordt voldaan, dan


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel19
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel19.05
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '19'
        hoofdstuk: '19'
  - number: 19.05.2.a)
    text: |-
      moet in de exploitatiewijzen A1 en A2 de matroos, zoals voorgeschreven in het eerste lid, onderdeel a, door een
      volmatroos, en;
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel19.05
  - number: 19.05.2.b)
    text: |-
      moeten de twee matrozen in de exploitatiewijze B, zoals voorgeschreven in het eerste lid, onderdeel b door twee
      volmatrozen worden vervangen.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel19.05
  - number: 19.05.3
    text: |-
      De verhoging van de vereiste bemanning wordt door de Commissie van Deskundigen onder nummer 47 van het
      binnenschipcertificaat ingeschreven.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel19.05
  - number: 19.06.1
    text: |-
      De Commissie van Deskundigen bepaalt voor de vaartuigen waarop de [artikelen 19.02 tot en met 19.04][ref1] niet
      van toepassing zijn (zoals sleepboten, sleepschepen en drijvende werktuigen) naar gelang hun afmetingen, bouwwijze,
      inrichting en benutting, welke bemanning zich tijdens de vaart aan boord moet bevinden.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel19
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel19.06
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '19'
        hoofdstuk: '19'
  - number: 19.06.2
    text: |-
      Ten aanzien van bunkerschepen, die slechts op korte riviergedeelten ingezet mogen worden, kan de Commissie van
      Deskundigen een minimumbemanning voorschrijven die afwijkt van [artikel 19.02][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel19
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel19.06
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '19'
        hoofdstuk: '19'
  - number: 19.06.3
    text: De Commissie van Deskundigen schrijft deze aantekeningen in onder nummer 48 van het binnenschipcertificaat.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel19.06
  - number: '19.07'
    text: |-
      1. Voor de bepaling van de minimumbemanning van zeeschepen is [deel II][ref1] van dit reglement van toepassing.
      2. In afwijking van het eerste lid kunnen zeeschepen blijven varen onder de bemanningsregeling die voorzien is
      in de bepalingen van Resolutie A. 481 (XII) van de IMO en van de STCW-Overeenkomst, onder voorwaarde dat het
      aantal bemanningsleden ten minste overeenkomt met de minimumbemanning zoals voorgeschreven in [deel II][ref2]
      voor exploitatiewijze B, waarbij met name rekening dient te worden gehouden met [artikel 19.02][ref3] en
      [19.06][ref4] van dit reglement. In dit geval moeten de dienovereenkomstige documenten waaruit de bekwaamheid van
      de bemanningsleden en hun aantal blijkt, aan boord aanwezig zijn. Bovendien bevindt zich een persoon aan boord
      die houder is van het kwalificatiecertificaat schipper dat geldig is voor het te bevaren riviergedeelte. Na een
      vaartijd van ten hoogste 14 uur per periode van 24 uur wordt deze houder van het kwalificatiecertificaat schipper
      door een andere houder van het kwalificatiecertificaat schipper vervangen. In het logboek worden de volgende
      aantekeningen gemaakt: a) de naam van de houders van het kwalificatiecertificaat schipper die zich aan boord
      bevinden, alsmede het begin en einde van hun diensttijd; b) begin, onderbreking, voortzetting en einde van de vaart
      met vermelding van de volgende gegevens: datum, tijdstip en plaats met aanduiding van de kilometerraai.


      [ref1]: https://wetten.overheid.nl/BWBR0030215
      [ref2]: https://wetten.overheid.nl/BWBR0030215
      [ref3]: https://wetten.overheid.nl/BWBR0030215#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0030215#Artikel19
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel19.07
    references:
      - id: ref1
        bwb_id: BWBR0030215
      - id: ref2
        bwb_id: BWBR0030215
      - id: ref3
        bwb_id: BWBR0030215
        artikel: '19'
        hoofdstuk: '19'
      - id: ref4
        bwb_id: BWBR0030215
        artikel: '19'
        hoofdstuk: '19'
  - number: '19.08'
    text: |-
      De bepalingen van dit [hoofdstuk][ref1] zijn niet van toepassing op kanaalspitsen. Desalniettemin bestaat de
      bemanning ten minste uit: - een schipper die houder is van een patent als bedoeld in dit reglement;
        - een persoon die ten minste 16 jaar oud is en die in staat is te helpen bij het manoeuvreren met het schip.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Hoofdstuk19
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel19.08
    references:
      - id: ref1
        bwb_id: BWBR0030215
        hoofdstuk: '19'
  - number: '19.09'
    text: |-
      De bepalingen van dit [hoofdstuk][ref1] zijn niet van toepassing op pleziervaartuigen. Desalniettemin moet de
      bemanning ten minste bestaan uit: - een schipper die houder is van een patent als bedoeld in dit reglement;
        - een persoon die in staat is te helpen bij het manoeuvreren met het schip.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Hoofdstuk19
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel19.09
    references:
      - id: ref1
        bwb_id: BWBR0030215
        hoofdstuk: '19'
  - number: '19.10'
    text: |-
      Voor de vaart beneden het Spijksche Veer (km 857,40) kan, voor zover de Duits-Nederlandse grens tijdens de
      vaart noch in de ene, noch in de andere richting wordt overschreden, worden volstaan met de toepassing van de
      voorschriften van de Nederlandse ‘[Binnenvaartwet][ref1]’ (Staatsblad 2007, Nummer 498).


      [ref1]: https://wetten.overheid.nl/BWBR0023009
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel19.10
    references:
      - id: ref1
        bwb_id: BWBR0023009
  - number: 20.01.1
    text: |-
      Dienstboekjes die werden afgegeven overeenkomstig de voorschriften die van toepassing waren tot aan de
      inwerkingtreding van dit reglement dan wel waarvan de geldigheid verlengd werd, blijven geldig met inachtneming van
      die voorschriften tot aan het einde van de geldigheidsduur, uiterlijk echter tot en met 17 januari 2032. De eerste
      zin geldt ook voor door de CCR als gelijkwaardig erkende dienstboekjes.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel20.01
  - number: 20.01.2
    text: |-
      De houder van een dienstboekje als bedoeld in het eerste lid kan voor 18 januari 2032 een nieuw dienstboekje met
      de bestaande kwalificaties aanvragen dat zal worden afgegeven op grond van het onderhavige reglement. Voor de
      afgifte van dit dienstboekje gelden de bepalingen van [artikel 5.01][ref1] van dit reglement. Indien de aanvrager
      ouder is dan 60 jaar, moet hij bovendien zijn medische geschiktheid aantonen zoals bedoeld in [artikel 4.02][ref2].
      Zijn medische verklaring mag niet ouder zijn dan drie maanden. Indien de houder een nieuwe beroepskwalificatie
      wil toevoegen of de vervanging van een document wordt aangevraagd overeenkomstig [artikel 3.03][ref3] van dit
      reglement, geeft de bevoegde autoriteit een nieuw dienstboekje af overeenkomstig de ES-QIN (Deel V, hoofdstuk 2).


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0030215#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0030215#Artikel3
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel20.01
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0030215
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0030215
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 20.01.3
    text: |-
      De houder van een dienstboekje als bedoeld in het eerste lid, kan vóór 18 januari 2032 een nieuw dienstboekje met
      een kwalificatiecertificaat waarvoor de eisen hoger zijn, aanvragen, indien aan de volgende voorwaarden is voldaan:
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel20.01
  - number: 20.01.3.a
    text: |-
      voor een kwalificatiecertificaat voor een matroos: 540 dagen vaartijd inclusief ten minste 180 dagen in de
      binnenvaart;
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel20.01
  - number: 20.01.3.b
    text: |-
      voor een kwalificatiecertificaat voor een volmatroos: 900 dagen vaartijd inclusief ten minste 540 dagen in de
      binnenvaart;
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel20.01
  - number: 20.01.3.c
    text: |-
      voor een kwalificatiecertificaat voor een stuurman: 1.080 dagen vaartijd inclusief ten minste 720 dagen in de
      binnenvaart.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel20.01
  - number: 20.01.4
    text: |-
      Het dienstboekje kan bij elke bevoegde autoriteit van een lidstaat van de CCR worden aangevraagd, zoals voorzien
      in het tweede en derde lid. De bevoegde autoriteit geeft het dienstboekje af op grond van het onderhavige reglement
      wanneer de aanvrager zijn oude dienstboekje zoals bedoeld in het eerste lid en een kopie van zijn identiteitsbewijs
      heeft overgelegd. Indien de aanvrager ouder is dan 60 jaar, moet hij bovendien zijn medische geschiktheid aantonen
      zoals bedoeld in [artikel 4.02][ref1]. Zijn medische verklaring mag niet ouder zijn dan drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel4
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel20.01
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 20.02.1
    text: |-
      Vaartijdenboeken die werden afgegeven overeenkomstig de voorschriften die van toepassing waren tot aan de
      inwerkingtreding van dit reglement dan wel waarvan de geldigheid verlengd werd, blijven geldig met inachtneming van
      die voorschriften tot aan het einde van de geldigheidsduur, uiterlijk echter tot en met 17 januari 2032. De eerste
      zin geldt ook voor door de CCR als gelijkwaardig erkende vaartijdenboeken.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel20.02
  - number: 20.02.2
    text: |-
      Een vaartijdenboek als bedoeld in het eerste lid kan voor 18 januari 2032 voor een vaartijdenboek overeenkomstig
      dit reglement worden ingewisseld.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel20.02
  - number: 20.03.1
    text: |-
      Een groot of klein Rijnpatent dat is afgegeven overeenkomstig de voorschriften die van toepassing waren tot aan de
      inwerkingtreding van dit reglement dan wel waarvan de geldigheid verlengd werd, blijft geldig met inachtneming van
      die voorschriften tot het einde van de geldigheidsduur, uiterlijk echter tot en met 17 januari 2032.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel20.03
  - number: 20.03.2
    text: |-
      De in het eerste lid genoemde Rijnpatenten kunnen voor het einde van de in dit lid genoemde geldigheidsduur op
      grond van dit reglement worden ingewisseld. Om een klein Rijnpatent in te kunnen ruilen moet de houder aantonen dat
      hij na verkrijging van dit kleine Rijnpatent op zijn minst een jaar gevaren heeft. Het dienstboekje kan bij elke
      bevoegde autoriteit van een lidstaat van de CCR worden ingewisseld. De bevoegde autoriteit geeft een Rijnpatent
      af op grond van het onderhavige reglement, wanneer de aanvrager zijn oude Rijnpatent zoals bedoeld in het eerste
      lid en een kopie van zijn identiteitsbewijs heeft voorgelegd. Indien de aanvrager ouder is dan 60 jaar, moet hij
      bovendien zijn medische geschiktheid aantonen zoals bedoeld in [artikel 4.02][ref1]. Zijn medisch verklaring mag
      niet ouder zijn dan drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel4
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel20.03
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 20.03.3
    text: |-
      De op de Rijn door de CCR als gelijkwaardig erkende vaarbewijzen voor schipper blijven geldig tot aan het einde van
      de geldigheidsduur, uiterlijk echter tot en met 17 januari 2032. Deze vaarbewijzen kunnen volgens de in het tweede
      lid genoemde procedure bij een bevoegde autoriteit tegen een Rijnpatent worden ingewisseld.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel20.03
  - number: '20.04'
    text: |-
      De overheids- en sportpatenten die geldig zijn op grond van de voorschriften die van toepassing waren tot aan de
      inwerkingtreding van dit reglement blijven zonder wijziging geldig.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel20.04
  - number: '20.05'
    text: |-
      De houder van een groot of klein Rijnpatent, een overheids- of sportpatent dat werd afgegeven overeenkomstig de
      voorschriften die van toepassing waren tot aan de inwerkingtreding van dit reglement dan wel waarvan de geldigheid
      verlengd werd en die voor de in [bijlage 5][ref1] van dit reglement genoemde riviergedeelten met succes het
      examen afgelegd heeft dat in dit reglement voorgeschreven is, mag met inachtneming van die voorschriften de
      riviergedeelten waarvoor het genoemde examen voor het bewijs van kennis van riviergedeelten werd afgelegd, blijven
      bevaren.


      [ref1]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel20.05
    references:
      - id: ref1
        bwb_id: BWBR0030215
  - number: 20.06.1
    text: |-
      Indien de houder van een op de Rijn als gelijkwaardig erkend vaarbewijs voor schipper een bewijs van kennis
      van riviergedeelten heeft voor de in [bijlage 5][ref1] van dit reglement genoemde riviergedeelten, mag hij de
      desbetreffende riviergedeelten blijven bevaren tot en met 17 januari 2032.


      [ref1]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel20.06
    references:
      - id: ref1
        bwb_id: BWBR0030215
  - number: 20.06.2
    text: |-
      Het bewijs van kennis van riviergedeelten zoals bedoeld in het eerste lid toont aan dat de houder beschikt over
      de specifieke vergunning voor het bevaren van de dienovereenkomstige binnenwateren met specifieke risico’s zoals
      bepaald in [artikel 13.03][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel13
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel20.06
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '13'
        hoofdstuk: '13'
        paragraaf: '3'
  - number: 20.07.1
    text: |-
      Met een groot of klein Rijnpatent zoals bedoeld in [artikel 20.03, eerste lid][ref1], mag tot aan het einde van de
      geldigheidsduur, uiterlijk echter tot en met 17 januari 2032, gevaren worden op binnenwateren van maritieme aard
      zoals bedoeld in [artikel 13.04][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0030215#Artikel13
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel20.07
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '20'
        hoofdstuk: '20'
      - id: ref2
        bwb_id: BWBR0030215
        artikel: '13'
        hoofdstuk: '13'
        paragraaf: '3'
  - number: 20.07.2
    text: |-
      Als het groot of klein Rijnpatent zoals bedoeld in [artikel 20.03][ref1] wordt ingewisseld, wordt het nieuwe
      Rijnpatent meteen afgegeven met de specifieke vergunning voor het bevaren van binnenwateren van maritieme aard
      zoals bedoeld in [artikel 13.04][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0030215#Artikel13
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel20.07
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '20'
        hoofdstuk: '20'
      - id: ref2
        bwb_id: BWBR0030215
        artikel: '13'
        hoofdstuk: '13'
        paragraaf: '3'
  - number: '20.08'
    text: |-
      Bemanningsleden van zeeschepen die op de Rijn varen, kunnen hun kwalificatie bewijzen door middel van een in
      overeenstemming met de STCW-Overeenkomst afgegeven of erkend kwalificatiecertificaat. Dit geldt voor schippers
      slechts tot 17 januari 2038 en op voorwaarde dat de binnenvaartactiviteit wordt uitgevoerd bij het begin of aan het
      eind van een reis in het kader van zeevervoer.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel20.08
  - number: 20.09.1
    text: |-
      Radarpatenten die zijn afgegeven overeenkomstig de voorschriften die van toepassing waren tot aan de
      inwerkingtreding van dit reglement of waarvan de geldigheid verlengd werd, blijven met inachtneming van die
      voorschriften geldig voor het varen met behulp van radar op de Rijn tot aan het einde van de geldigheidsduur.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel20.09
  - number: 20.09.2
    text: |-
      Met het omruilen van een groot of klein Rijnpatent zoals bedoeld in [artikel 20.03][ref1] wordt het nieuwe
      Rijnpatent meteen afgegeven met de specifieke vergunning om met behulp van radar te mogen varen zoals bedoeld in
      [artikel 13.02][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0030215#Artikel13
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel20.09
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '20'
        hoofdstuk: '20'
      - id: ref2
        bwb_id: BWBR0030215
        artikel: '13'
        hoofdstuk: '13'
        paragraaf: '3'
  - number: 20.09.3
    text: |-
      De houder van een op de Rijn als gelijkwaardig erkend radarpatent mag blijven varen met behulp van radar tot en met
      17 januari 2032.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel20.09
  - number: 20.10.1
    text: |-
      De verklaringen deskundige voor de passagiersvaart en de verklaringen van deskundigheid aangaande het gebruik
      van vloeibaar aardgas (LNG) als brandstof die door de bevoegde instanties overeenkomstig de voorschriften die van
      toepassing waren tot aan de inwerkingtreding van dit reglement werden afgegeven of waarvan de geldigheid verlengd
      werd, blijven geldig met inachtneming van die voorschriften tot aan het einde van hun huidige geldigheidsduur.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel20.10
  - number: 20.10.2
    text: |-
      Houders van de in het eerste lid genoemde verklaringen kunnen voor het einde van de geldigheidsduur van de
      verklaring bij de bevoegde autoriteiten een aanvraag indienen voor de afgifte van een nieuw kwalificatiecertificaat
      overeenkomstig [artikel 15.06][ref1] of [artikel 16.10][ref2]. De bevoegde autoriteit geeft het aangevraagde
      kwalificatiecertificaat af wanneer de aanvrager zijn oude verklaring zoals bedoeld in het eerste lid en een kopie
      van zijn identiteitsbewijs, alsmede de in artikel 15.06 of de in artikel 16.10 vereiste bewijzen heeft voorgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0030215#Artikel16
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel20.10
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0030215
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: '4'
  - number: '20.11'
    text: |-
      Er kan rekening worden gehouden met de volbrachte vaartijd die op grond van het onderhavige reglement vereist
      is, wanneer deze vaartijd werd volbracht overeenkomstig de voorschriften die van toepassing waren tot aan de
      inwerkingtreding van dit reglement werd volbracht.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel20.11
