  - number: 19.04.10
    text: |-
      De machinisten die zijn voorgeschreven overeenkomstig de in het eerste tot derde lid genoemde tabellen mogen door
      bijkomende volmatrozen worden vervangen. Deze volmatrozen mogen door bijkomende matrozen worden vervangen, wanneer
      het aantal volmatrozen dat als minimumbemanning overeenkomstig de in het eerste tot derde lid genoemde tabellen is
      voorgeschreven, overeenstemt met het aantal te vervangen machinisten.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel19.04
  - number: 19.05.1
    text: |-
      Wanneer de uitrusting van een motorschip, een duwboot, een hecht samenstel, een andere hechte samenstelling of
      een passagiersschip niet voldoet aan de standaard S1, zoals bepaald in [artikel 19.01][ref1] van het onderhavige
      reglement, dient de minimumbemanning, zoals bedoeld in de [artikelen 19.02][ref2], [19.03][ref3] of [19.04][ref4],
      te worden verhoogd


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0030215#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0030215#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0030215#Artikel19
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel19.05
