  - number: 1.03.1
    text: |-
      De Centrale Commissie voor de Rijnvaart kan voorschriften van tijdelijke aard vaststellen met een geldigheidsduur
      van ten hoogste drie jaren, wanneer het noodzakelijk wordt geacht om
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel1.03
  - number: 1.03.1.a)
    text: in dringende gevallen afwijkingen van dit reglement toe te laten dan wel
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel1.03
  - number: 1.03.1.b)
    text: |-
      proefnemingen mogelijk te maken, waarbij de veiligheid en de vlotte afwikkeling van het scheepvaartverkeer niet
      worden aangetast.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel1.03
  - number: 1.03.2
    text: |-
      Afwijkende voorschriften moeten verenigbaar zijn met de bepalingen van [Richtlijn (EU) 2017/2397](32017L2397) en de
      op grond van deze richtlijn uitgevaardigde rechtshandelingen van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel1.03
  - number: '1.04'
    text: |-
      In het belang van een eenvoudige en uniforme toepassing van het onderhavige reglement kan de CCR dienstinstructies
      voor de bevoegde autoriteiten vaststellen. De bevoegde autoriteiten dienen zich aan deze dienstinstructies te
      houden. Daarnaast publiceert de CCR met het oog op de toepassing van het RSP diverse lijsten en tabellen in een
      digitaal format.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel1.04
  - number: 1.05.1
    text: |-
      Op alle activiteiten die verband houden met opleiding, competentiebeoordeling en de afgifte, verlenging, schorsing,
      intrekking en actualisering van kwalificatiecertificaten, dienstboekjes en vaartijdenboeken, en die door of onder
      het gezag van de bevoegde autoriteit van de Rijnoeverstaten of België worden uitgevoerd, moet voortdurend toezicht
      worden gehouden door middel van een stelsel van kwaliteitsnormen, om de verwezenlijking van de doelstellingen van
      dit reglement te waarborgen.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel1.05
  - number: 1.05.2
    text: |-
      De bevoegde autoriteit zorgt ervoor dat de opleidingsdoelstellingen en de daarmee verband houdende te bereiken
      competentienormen duidelijk zijn omschreven met vermelding van de niveaus van kennis en vaardigheden die
      overeenkomstig dit reglement moeten worden beoordeeld en geëxamineerd.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel1.05
  - number: 1.05.3
    text: |-
      De bevoegde autoriteit zorgt ervoor dat de kwaliteitsnormen, met inachtneming van de beleidslijnen, systemen,
      controles en interne kwaliteitsbeoordelingen die zijn ingesteld ter verwezenlijking van de omschreven
      doelstellingen van toepassing zijn op:
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel1.05
  - number: 1.05.3.a)
    text: de afgifte, verlenging, schorsing en intrekking van kwalificatiecertificaten, dienstboekjes en vaartijdenboeken;
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel1.05
  - number: 1.05.3.b)
    text: alle opleidingscursussen en -programma’s;
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel1.05
  - number: 1.05.3.c)
    text: de door of onder het gezag van de Rijnoeverstaten of België afgenomen examens en de beoordelingen; en
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel1.05
  - number: 1.05.3.d)
    text: de van opleiders en examinatoren verlangde kwalificaties en ervaring.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel1.05
  - number: 1.06.1
    text: |-
      De bevoegde autoriteit laat de werkzaamheden met betrekking tot de verwerving en beoordeling van competenties,
      alsmede het beheer van de kwalificatiecertificaten, dienstboekjes en vaartijdenboeken, uiterlijk op 17 januari 2037
      en vervolgens ten minste om de tien jaar door onafhankelijke instanties evalueren.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel1.06
  - number: 1.06.2
    text: |-
      De bevoegde autoriteit zorgt ervoor dat de resultaten van de evaluaties van deze onafhankelijke instanties
      vergezeld gaan van bewijsstukken en aan de desbetreffende bevoegde autoriteiten worden voorgelegd. Indien
      nodig neemt de bevoegde autoriteit passende maatregelen om de bij de onafhankelijke evaluatie geconstateerde
      tekortkomingen te verhelpen.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel1.06
  - number: 2.01.1
    text: |-
      Elk door een bevoegde autoriteit afgegeven kwalificatiecertificaat, dienstboekje en vaartijdenboek wordt samen
      met de daarin vermelde gegevens opgenomen in het door die autoriteit overeenkomstig artikel 25 van [Richtlijn (EU)
      2017/2397](32017L2397) bij te houden nationale register.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel2.01
  - number: 2.01.2
    text: |-
      De nationale registers van de bevoegde autoriteiten worden gekoppeld aan de gegevensbank die overeenkomstig artikel
      25 van [Richtlijn (EU) 2017/2397](32017L2397) door de Commissie van de Europese Unie wordt beheerd, overeenkomstig
      de bepalingen van de Gedelegeerde [Verordening (EU) 2020/473](32373R2020).
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel2.01
  - number: 3.01.1
    text: |-
      Leden van de dekbemanning zijn de deksman, de lichtmatroos, de matroos, de volmatroos, de stuurman en de schipper.
      Het machinekamerpersoneel bestaat uit de machinist.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel3.01
  - number: 3.01.2
    text: |-
      Andere functies zijn de deskundige voor de passagiersvaart, de deskundige op gebied van vloeibaar aardgas (LNG),
      de eerstehulpverlener, de persluchtmaskerdrager en het veiligheidspersoneel aan boord van schepen die gevaarlijke
      goederen vervoeren.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel3.01
  - number: 3.02.1
    text: |-
      Op de Rijn zijn de kwalificatiecertificaten van de Unie, evenals de dienstboekjes en vaartijdenboeken geldig die
      krachtens [Richtlijn (EU) 2017/2397](32017L2397) zijn afgegeven, alsmede de kwalificatiecertificaten, dienstboekjes
      en vaartijdenboeken die zijn afgegeven krachtens dit reglement, waarin eisen zijn vastgelegd die identiek zijn
      aan die van de bovengenoemde richtlijn. De kwalificatie voor een functie aan boord moet te allen tijde aangetoond
      kunnen worden
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel3.02
  - number: 3.02.1.a)
    text: |-
      door de schipper aan de hand van een kwalificatiecertificaat schipper voor het desbetreffende type vaartuig en de
      desbetreffende scheepsafmetingen of een kwalificatiecertificaat schipper van de Unie, alsmede de eventueel vereiste
      specifieke vergunningen;
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel3.02
  - number: 3.02.1.b)
    text: |-
      door de overige leden van de bemanning aan de hand van een op hun naam afgegeven dienstboekje dat een
      kwalificatiebewijs of een kwalificatiecertificaat van de Unie bevat;
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel3.02
  - number: 3.02.1.c)
    text: |-
      door de deskundige voor de passagiersvaart en de LNG-deskundige aan de hand van een kwalificatiecertificaat
      of een kwalificatiecertificaat van de Unie, alsmede door de eerstehulpverlener, persluchtmaskerdrager en het
      veiligheidspersoneel aan boord van schepen die gevaarlijke goederen vervoeren, door een certificaat voor de
      specifieke activiteit.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel3.02
  - number: 3.02.2
    text: |-
      De houder van een kwalificatiecertificaat schipper mag ook als deksman, matroos, volmatroos of stuurman worden
      ingezet. De houder van een kwalificatiecertificaat stuurman mag ook als deksman, matroos of volmatroos worden
      ingezet. De houder van een kwalificatiecertificaat volmatroos mag ook als deksman of matroos worden ingezet. De
      houder van een kwalificatiecertificaat matroos mag ook als deksman worden ingezet.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel3.02
  - number: 3.02.3
    text: |-
      Op de Rijn zijn eveneens de kwalificatiecertificaten en verklaringen geldig die zijn afgegeven of die geldig zijn
      op grond van dit reglement en die niet onder het materiële toepassingsgebied van de [Richtlijn (EU) 2017/2397]
      (32017L2397) vallen.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel3.02
  - number: '3.03'
    text: |-
      Indien een kwalificatiecertificaat, dienstboekje of vaartijdenboek onbruikbaar is geworden, verloren is gegaan
      of om andere reden niet meer voorhanden is, wordt dit door de autoriteit van afgifte in het nationale register
      geregistreerd. De autoriteit van afgifte verstrekt op verzoek een nieuw kwalificatiecertificaat, dienstboekje
      of vaartijdenboek. De houder moet bij de autoriteit van afgifte het verlies aannemelijk maken. Een onbruikbaar
      geworden of een teruggevonden kwalificatiecertificaat, dienstboekje of vaartijdenboek, moet bij de autoriteit van
      afgifte worden ingeleverd of worden overgelegd om ongeldig te worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel3.03
  - number: '3.04'
    text: |-
      Het examen of de afgifte van een kwalificatiecertificaat, dienstboekje of vaartijdenboek, evenals de afgifte van
      een duplicaat en het omruilen worden gedaan tegen een redelijke vergoeding van de kosten door de aanvrager. De
      hoogte van de kosten wordt door de lidstaten van de CCR overeenkomstig nationale regelingen vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel3.04
  - number: 4.01.1
    text: |-
      De houders van een kwalificatiecertificaat moeten medisch geschikt zijn. Dit is het geval als zij voldoen aan de
      voorwaarden voor de medische geschiktheid volgens de ES-QIN (Deel IV).
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel4.01
  - number: 4.01.2
    text: |-
      De medische geschiktheid van de aanvrager moet voor de eerste afgifte van het kwalificatiecertificaat worden
      aangetoond door middel van een medische verklaring overeenkomstig [bijlage 1][ref1], die afgegeven werd door een
      erkende arts en niet ouder dan drie maanden mag zijn. Indien er dan nog twijfels over de medische geschiktheid
      bestaan, kan de bevoegde autoriteit van de aanvrager aanvullende medische verklaringen of verklaringen van medische
      specialisten eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0030215
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel4.01
    references:
      - id: ref1
        bwb_id: BWBR0030215
  - number: 4.01.3
    text: |-
      Blijkt uit de medische verklaring een definitieve of tijdelijke beperkte medische geschiktheid, dan worden de
      maatregelen ter vermindering van het risico en de beperkingen overeenkomstig de voorwaarden zoals bepaald in de ES-
      QIN (Deel IV) op het kwalificatiecertificaat vermeld.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel4.01
  - number: 4.02.1
    text: |-
      Alle houders van een kwalificatiecertificaat moeten hun medische geschiktheid aantonen overeenkomstig de bepalingen
      van [artikel 4.01, eerste en tweede lid:][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel4
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel4.02
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.02.1.a)
    text: om de vijf jaar vanaf het bereiken van de leeftijd van 60 jaar;
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel4.02
  - number: 4.02.1.b)
    text: om de twee jaar vanaf het bereiken van de leeftijd van 70 jaar.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel4.02
  - number: 4.02.2
    text: |-
      Om een definitieve of tijdelijke beperkte medische geschiktheid die overeenkomstig [artikel 4.01, derde lid][ref1],
      vermeld staat op het kwalificatiecertificaat te laten doorhalen, moet de houder van het kwalificatiecertificaat een
      medische verklaring overleggen overeenkomstig de voorwaarden van [artikel 4.01, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0030215#Artikel4
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel4.02
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0030215
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.02.3
    text: |-
      De houder van het kwalificatiecertificaat overlegt een medische verklaring aan de autoriteit van afgifte van het
      kwalificatiecertificaat. Hij kan de medische verklaring aan een andere bevoegde autoriteit overleggen wanneer
      hij een overeenkomstig dit reglement afgegeven kwalificatiecertificaat verlengt. De bevoegde autoriteit zendt de
      documenten door aan de autoriteit van afgifte. In geval van verlenging van een patent kan de bevoegde autoriteit
      een voorlopig Rijn- of sportpatent afgeven voor de periode tot de autoriteit van afgifte een besluit genomen heeft,
      op voorwaarde dat de vereiste medische geschiktheid is aangetoond.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel4.02
  - number: '4.03'
    text: |-
      In afwijking van [artikel 4.01, eerste lid, tweede zin][ref1], zijn voor de houder van een kwalificatiecertificaat
      machinist voor het gezichtsvermogen de volgende voorwaarden voor de medische geschiktheid van toepassing: De in
      de STCW Code tabel A-I/9: ‘Minimum in service eyesight standards for seafarers’ vermelde voorwaarden voor ‘All
      engineer officers’, behalve voor wat betreft het kleuren zien. Voor machinisten is een stoornis van het kleurenzien
      toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel4
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel4.03
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 5.01.1
    text: |-
      Het krachtens dit reglement afgegeven dienstboekje voor de leden van de bemanning, met uitzondering van de schipper
      bevat algemene gegevens, zoals het bewijs van medische geschiktheid en de kwalificatiecertificaten van de houder
      als bedoeld in [artikel 3.02][ref1], en specifieke gegevens over de afgelegde reizen en met name gedetailleerde
      gegevens met betrekking tot de door de houder gemaakte vaartijd.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel3
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel5.01
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 5.01.2
    text: |-
      Het krachtens dit reglement afgegeven dienstboekje voor de leden van de bemanning die geen schipper zijn, wordt
      volgens het model in de ES-QIN (Deel V, hoofdstuk 2) afgegeven. Het dienstboekje voor de schipper wordt volgens het
      model in de ES-QIN (Deel V, hoofdstuk 4) afgegeven.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel5.01
  - number: 5.01.3
    text: |-
      De bevoegde autoriteit is verantwoordelijk voor het invullen van de algemene gegevens en de afstempeling ter
      controle. De bevoegde autoriteit kan verlangen dat vaartijdenboeken dan wel uittreksels daarvan of andere relevante
      bewijsstukken getoond worden. De bevoegde autoriteit voorziet alleen ingeschreven reizen van een stempel die niet
      langer dan 15 maanden geleden zijn afgelegd.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel5.01
  - number: 5.01.4
    text: |-
      Een bemanningslid dat houder is van een kwalificatiecertificaat is slechts in het bezit van één actief
      dienstboekje.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel5.01
  - number: 5.01.5
    text: De houder overhandigt het dienstboekje aan de schipper bij de eerste indiensttreding aan boord.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel5.01
  - number: 5.01.6
    text: |-
      De schipper is verantwoordelijk voor de regelmatige aantekening van specifieke gegevens met betrekking tot de
      afgelegde reizen in het dienstboekje. De schipper
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel5.01
  - number: 5.01.6.a)
    text: |-
      bewaart het dienstboekje op een veilige plaats in het stuurhuis tot aan het einde van het dienstverband,
      arbeidscontract dan wel andere regeling;
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel5.01
  - number: 5.01.6.b)
    text: geeft het dienstboekje te allen tijde meteen aan de houder terug, als deze daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel5.01
  - number: 5.02.1
    text: |-
      De vereiste vaartijd en de reizen op bepaalde riviergedeelten worden aangetoond aan de hand van een naar behoren
      ingevuld en afgestempeld dienstboekje. Vaartijd kan worden opgebouwd
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel5.02
  - number: 5.02.1.a)
    text: op de Rijn en
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel5.02
  - number: 5.02.1.b)
    text: op binnenwateren waarop vaartijd kan worden opgebouwd voor de kwalificatiecertificaten van de Unie.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel5.02
  - number: 5.02.2
    text: |-
      Als volgens de nationale voorschriften van de Rijnoeverstaten of van België voor de binnenwateren die niet in
      verbinding staan met het vaarwegennet van een andere staat, met inbegrip van wateren die geclassificeerd zijn als
      binnenwateren van maritieme aard, of als overeenkomstig [Richtlijn (EU) 2017/2397](32017L2397) geen dienstboekje
      aanwezig hoeft te zijn, kan de vaartijd ook door een officieel document worden aangetoond dat ten minste de
      volgende gegevens dient te bevatten:
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel5.02
  - number: 5.02.2.a)
    text: type, afmetingen, aantal passagiers en naam van de vaartuigen waarop de aanvrager heeft gevaren;
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel5.02
  - number: 5.02.2.b)
    text: naam van de schipper;
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel5.02
  - number: 5.02.2.c)
    text: tijdstip van het begin en het einde van de reizen;
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel5.02
  - number: 5.02.2.d)
    text: de uitgeoefende functies;
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel5.02
  - number: 5.02.2.e)
    text: de bevaren riviergedeelten (precieze aanduiding met plaatsen van vertrek en aankomst).
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel5.02
  - number: 5.02.3
    text: |-
      De vaartijd kan eveneens aan de hand van een kwalificatiecertificaat schipper zoals bedoeld in de
      [artikelen 12.01][ref1] of [12.03][ref2] worden aangetoond voor de duur van de vaartijd die voor het verkrijgen van
      dit certificaat vereist was.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0030215#Artikel12
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel5.02
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0030215
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '3'
  - number: 5.02.4
    text: |-
      De vaartijd op zee wordt door middel van een monsterboekje aangetoond. De vaartijd in de kustvaart en visserij
      wordt aangetoond door een officieel document.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel5.02
  - number: 5.02.5
    text: |-
      De tijd die is doorgebracht voor het bezoeken van een schippersschool wordt door middel van het getuigschrift van
      de school aangetoond.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel5.02
  - number: 5.02.6
    text: |-
      Indien nodig worden de officiële documenten, zoals bedoeld in het tweede lid, samen met een beëdigde vertaling in
      de Duitse, Franse of Nederlandse taal overgelegd.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel5.02
  - number: 6.01.1
    text: 'De bevoegde autoriteit mag een opleidingsprogramma alleen goedkeuren indien:'
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel6.01
  - number: 6.01.1.a)
    text: |-
      de opleidingsdoelstellingen, leerinhoud, methoden, hulpmiddelen voor kennisoverdracht, procedures, met inbegrip
      van, in voorkomend geval, het gebruik van simulatoren, en het cursusmateriaal naar behoren zijn gedocumenteerd en
      aanvragers in staat stellen om de competentienormen te bereiken;
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel6.01
  - number: 6.01.1.b)
    text: |-
      de programma’s voor de beoordeling van de betrokken competenties worden uitgevoerd door gekwalificeerde personen
      met diepgaande kennis van het opleidingsprogramma;
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel6.01
  - number: 6.01.1.c)
    text: het examen wordt afgenomen door gekwalificeerde examinatoren die vrij zijn van belangenconflicten.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel6.01
  - number: 6.01.2
    text: |-
      Voor de afgifte van kwalificatiecertificaten erkennen de Rijnoeverstaten en België alle diploma’s die na
      succesvolle afronding van de overeenkomstig het eerste lid door andere landen op grond van dit reglement of
      [Richtlijn (EU) 2017/2397](32017L2397) goedgekeurde opleidingsprogramma’s werden afgegeven.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel6.01
  - number: 6.01.3
    text: |-
      De bevoegde autoriteiten stellen de CCR op de hoogte van elk besluit over de goedkeuring van een
      opleidingsprogramma of over de intrekking of opschorting van de goedkeuring. De lijst van goedgekeurde
      opleidingsprogramma’s wordt door de CCR op de website geplaatst.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel6.01
  - number: 6.01.4
    text: |-
      De goedkeuring wordt verleend voor onbepaalde tijd. Na tien jaar moet de organisator van het opleidingsprogramma
      aan de bevoegde autoriteit schriftelijke stukken overleggen waaruit blijkt dat het opleidingsprogramma nog steeds
      voldoet aan de in het eerste lid genoemde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel6.01
  - number: 6.01.5
    text: |-
      Indien een opleidingsprogramma niet meer aan de voorwaarden van het eerste lid voldoet, wordt de goedkeuring
      onverwijld door de bevoegde autoriteit ingetrokken of opgeschort. Diploma’s die zijn uitgereikt na de intrekking
      of opschorting worden niet meer door de bevoegde autoriteit voor de afgifte van een kwalificatiecertificaat in
      aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel6.01
  - number: 7.01.1
    text: |-
      Een kandidaat voor een administratief examen wordt toegelaten tot het examen wanneer het aanvraagdossier volledig
      is, overeenkomstig de van toepassing zijnde vereisten.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel7.01
  - number: 7.01.2
    text: |-
      Indien uit de medische verklaring slechts een beperkte medische geschiktheid blijkt, kan de kandidaat toch tot het
      examen worden toegelaten. Een afwijzing van de aanvraag is met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel7.01
  - number: 7.02.1
    text: |-
      De kandidaat moet tijdens het examen voor de examencommissie aantonen dat hij beschikt over voldoende kennis en
      vaardigheden; deze competenties worden aangetoond door een examen dat bestaat uit een theoretisch en een praktisch
      deel.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel7.02
  - number: 7.02.2
    text: |-
      Indien het examen niet wordt gehaald, worden de redenen aan de kandidaat meegedeeld. De examencommissie kan aan het
      opnieuw deelnemen aan een examen vereisten of voorwaarden verbinden dan wel bepaalde vrijstellingen verlenen.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel7.02
  - number: 7.03.1
    text: |-
      De bevoegde autoriteit benoemt één of meer examencommissies voor het afnemen van het administratief examen. Iedere
      examencommissie bestaat uit een voorzitter die vertegenwoordiger is van de bevoegde autoriteit, en ten minste twee
      examinatoren die voldoende ter zake kundig zijn.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel7.03
  - number: 7.03.2
    text: |-
      De examencommissies voor mondelinge of praktijkexamens ten behoeve van kwalificatiecertificaten als bedoeld
      in dit reglement zijn zodanig samengesteld dat ten minste één examinator houder is van de dienovereenkomstige
      kwalificatie.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel7.03
  - number: 7.03.3
    text: |-
      Gedurende schriftelijke of aan een computer afgelegde examens kunnen de examinatoren vervangen worden door één of
      meerdere bevoegde supervisoren.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel7.03
  - number: 8.01.1
    text: |-
      De bevoegde autoriteit kan de geldigheid van een kwalificatiecertificaat omwille van de veiligheid of de openbare
      orde voor een bepaalde termijn opschorten.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel8.01
  - number: 8.01.2
    text: |-
      Indien er feiten zijn die twijfel over de medische geschiktheid van de houder van het kwalificatiecertificaat
      rechtvaardigen, kan de bevoegde autoriteit, de werkgever of de schipper om de geschiktheid van een bemanningslid
      vast te kunnen stellen een recente verklaring voor de desbetreffende medische geschiktheid verlangen, alsook het
      overleggen van aanvullende medische verklaringen van specialisten. De houder hoeft alleen zelf op te komen voor
      de kosten als de objectieve aanknopingspunten worden bevestigd. Indien deze verklaringen niet binnen de door
      de bevoegde autoriteit gestelde termijn worden overgelegd, wordt de geldigheid van het kwalificatiecertificaat
      opgeschort.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel8.01
  - number: 8.01.3
    text: In het kader van de opschorting kunnen aanvullende bepalingen (bijvoorbeeld voorwaarden) worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel8.01
  - number: 8.01.4
    text: |-
      De bevoegde autoriteit zorgt ervoor dat de opschorting van de geldigheid onverwijld geregistreerd wordt in de
      gegevensbank die genoemd is in [artikel 2.01][ref1]. De bevoegde autoriteit informeert de autoriteit die het
      kwalificatiecertificaat heeft afgegeven alsook de CCR over de opschorting, de duur van de opschorting en de redenen
      daarvoor. Indien de twijfel aan de geschiktheid vóór het einde van de opschortingstermijn wordt weggenomen, dient
      het besluit te worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel2
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel8.01
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '2'
        hoofdstuk: '2'
  - number: 8.01.5
    text: |-
      In het geval van opschorting moet het patent dat als fysiek document is afgegeven, bij de bevoegde autoriteit die
      daarom verzoekt in bewaring worden gegeven.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel8.01
  - number: 8.02.1
    text: |-
      De autoriteit die het kwalificatiecertificaat schipper heeft afgegeven, moet het kwalificatiecertificaat intrekken,
      indien blijkt dat de houder van een kwalificatiecertificaat schipper niet bekwaam is tot het voeren van een
      vaartuig als bedoeld in de [artikelen 12.01, tweede lid][ref1], of [12.02, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0030215#Artikel12
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel8.02
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0030215
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '3'
  - number: 8.02.2
    text: |-
      De autoriteit die het kwalificatiecertificaat heeft afgegeven trekt het kwalificatiecertificaat in, indien
      de houder van een certificaat niet bekwaam is tot het uitvoeren van zijn kwalificatie zoals bedoeld in de
      [artikelen 14.01][ref1], [15.02][ref2] of [16.10][ref3]. Niet bekwaam zoals bedoeld in de eerste zin is ook degene
      die niet langer medisch geschikt is als bedoeld in [artikel 4.01][ref4] of [artikel 4.03][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0030215#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0030215#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0030215#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0030215#Artikel4
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel8.02
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '14'
        hoofdstuk: '14'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0030215
        artikel: '15'
        hoofdstuk: '15'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0030215
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0030215
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0030215
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 8.02.3
    text: |-
      Als gebleken is dat de houder van een krachtens dit reglement afgegeven dienstboekje ongeschikt is als bedoeld in
      [artikel 4.01, eerste lid][ref1], of [artikel 4.03][ref2], noteert de autoriteit van afgifte op pagina 1 van het
      dienstboekje de aantekening ‘ONGESCHIKT’, en waarmerkt hij die.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0030215#Artikel4
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel8.02
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0030215
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 8.02.4
    text: |-
      De autoriteit die het kwalificatiecertificaat heeft afgegeven, kan het kwalificatiecertificaat intrekken,
      indien de houder van het certificaat herhaaldelijk een medische voorwaarde of een beperking als bedoeld in
      [artikel 4.01, derde lid][ref1], niet nakomt.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel4
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel8.02
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 8.02.5
    text: |-
      Bij intrekking verliest het kwalificatiecertificaat zijn geldigheid. Het ongeldige kwalificatiecertificaat dient
      onverwijld bij de autoriteit die het kwalificatiecertificaat heeft afgegeven te worden ingeleverd of, ingeval van
      een kwalificatiecertificaat in elektronische vorm, als ingetrokken te worden geregistreerd.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel8.02
  - number: 8.02.6
    text: 'De autoriteit die het kwalificatiecertificaat heeft afgegeven, kan bij de intrekking bepalen dat:'
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel8.02
  - number: 8.02.6.a)
    text: vóór het einde van een bepaalde termijn geen nieuw kwalificatiecertificaat mag worden afgegeven, of
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel8.02
  - number: 8.02.6.b)
    text: de kandidaat om tot een nieuw examen te worden toegelaten, aan bepaalde voorwaarden moet voldoen.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel8.02
  - number: 8.02.7
    text: |-
      De autoriteit die het kwalificatiecertificaat intrekt, zorgt ervoor dat de intrekking onverwijld geregistreerd
      wordt in de gegevensbank die genoemd is in [artikel 2.01][ref1]en deelt dit aan de CCR mee. Indien een bevoegde
      autoriteit feiten vaststelt die de intrekking van een kwalificatiecertificaat zouden kunnen rechtvaardigen, stelt
      zij de autoriteit die het kwalificatiecertificaat heeft afgegeven hiervan in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel2
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel8.02
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '2'
        hoofdstuk: '2'
  - number: 8.03.1
    text: |-
      Indien er dringende redenen zijn om het kwalificatiecertificaat in te trekken ([artikel 8.02][ref1]) of de
      geldigheid daarvan op te schorten ([artikel 8.01][ref2]) of er een op feiten gebaseerd vermoeden van fraude
      bij de verkrijging van het kwalificatiecertificaat bestaat, kan de bevoegde autoriteit gelasten dat het
      kwalificatiecertificaat tijdelijk wordt ingevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0030215#Artikel8
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel8.03
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0030215
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '1'
  - number: 8.03.2
    text: |-
      Een kwalificatiecertificaat dat tijdelijk is ingevorderd, wordt onverwijld overhandigd aan de autoriteit van
      afgifte of de bevoegde rechtbank, overeenkomstig de wettelijke nationale voorschriften van de Rijnoeverstaten en
      van België onder opgave van de redenen van de invordering.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel8.03
  - number: 8.03.3
    text: |-
      De autoriteit van afgifte, neemt onverwijld, nadat zij van het besluit van de tijdelijke invordering kennis heeft
      genomen, een besluit over de opschorting van de geldigheid of de intrekking van het kwalificatiecertificaat. Indien
      een rechtbank bevoegd is, beschikt de rechter overeenkomstig de nationale voorschriften van de Rijnoeverstaten
      en België. Totdat een besluit als bedoeld in de eerste of tweede zin is genomen, geldt het besluit van tijdelijke
      invordering als een besluit in de zin van [artikel 8.01, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel8
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel8.03
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '1'
  - number: 8.03.4
    text: |-
      De tijdelijke invordering van het kwalificatiecertificaat wordt beëindigd en het kwalificatiecertificaat wordt
      teruggegeven, wanneer de oorzaak daarvan is komen te vervallen of wanneer er niet tot opschorting of intrekking van
      het kwalificatiecertificaat wordt besloten.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel8.03
  - number: 9.01.1
    text: |-
      De functies op instroomniveau zijn deksman en lichtmatroos. De functies op operationeel niveau zijn matroos,
      volmatroos en stuurman.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel9.01
  - number: 9.01.2
    text: |-
      Ook de machinist valt onder het toepassingsgebied van deze [paragraaf][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel9.01
    references:
      - id: ref1
        bwb_id: BWBR0030215
        paragraaf: '2'
  - number: '10.01'
    text: |-
      Ter verkrijging van een kwalificatiecertificaat moeten de leden van de dekbemanning op instroom- en operationeel
      niveau voldoen aan de volgende minimumeisen inzake leeftijd, naleving van de administratieve voorschriften,
      competentie en vaartijd:
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel10.01
  - number: 10.01.1
    text: 'voor de deksman:'
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel10.01
  - number: 10.01.1.a)
    text: een minimumleeftijd van16 jaar en
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel10.01
  - number: 10.01.1.b)
    text: een afgeronde basisopleiding veiligheid overeenkomstig de nationale voorschriften;
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel10.01
  - number: 10.01.2
    text: 'voor de lichtmatroos:'
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel10.01
  - number: 10.01.2.a)
    text: een minimumleeftijd van 15 jaar en
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel10.01
  - number: 10.01.2.b)
    text: |-
      een leerovereenkomst die voorziet in een goedgekeurd opleidingsprogramma overeenkomstig [hoofdstuk 6][ref1] voor
      het operationele niveau;


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel10.01
    references:
      - id: ref1
        bwb_id: BWBR0030215
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 10.01.3
    text: 'voor de matroos:'
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel10.01
  - number: 10.01.3.a)
    text: hetzij
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel10.01
  - number: 10.01.3.a).aa)
    text: een minimumleeftijd van 17 jaar en
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel10.01
  - number: 10.01.3.a).bb)
    text: |-
      een met goed gevolg afgerond, goedgekeurd opleidingsprogramma overeenkomstig [hoofdstuk 6][ref1] van minstens twee
      jaar voor het operationele niveau, dat een vaartijd van ten minste 90 dagen omvat;


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel10.01
    references:
      - id: ref1
        bwb_id: BWBR0030215
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 10.01.b)
    text: of
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel10.01
  - number: 10.01.b).aa)
    text: een minimumleeftijd van 18 jaar en
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel10.01
  - number: 10.01.b).bb)
    text: een met goed gevolg afgelegd administratief examen voor het operationele niveau; en
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel10.01
  - number: 10.01.b).cc)
    text: |-
      een vaartijd als lid van de dekbemanning van ten minste 360 dagen; daarvan kunnen maximaal 180 dagen vaartijd
      vervangen worden door 250 dagen beroepservaring als lid van de dekbemanning aan boord van een zeeschip;
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel10.01
  - number: 10.01.c)
    text: of
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel10.01
  - number: 10.01.c).aa)
    text: |-
      een met goed gevolg afgerond goedgekeurd opleidingsprogramma overeenkomstig [hoofdstuk 6][ref1] van ten minste
      negen maanden voor het operationele niveau, dat een vaartijd van ten minste 90 dagen omvat, alsook


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel10.01
    references:
      - id: ref1
        bwb_id: BWBR0030215
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 10.01.c).bb)
    text: ten minste vijf jaar werkervaring, voorafgaand aan de inschrijving voor dit opleidingsprogramma, of
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel10.01
  - number: 10.01.c).cc)
    text: |-
      ten minste 500 dagen werkervaring, voorafgaand aan de inschrijving voor dit opleidingsprogramma als lid van de
      dekbemanning aan boord van een zeeschip, of
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel10.01
  - number: 10.01.c).dd)
    text: |-
      voorafgaand aan de inschrijving voor dit programma een willekeurig beroepsopleidingsprogramma van ten minste drie
      jaar met goed gevolg afgerond hebben;
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel10.01
  - number: 10.01.4
    text: 'voor de volmatroos:'
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel10.01
  - number: 10.01.4.a)
    text: hetzij een vaartijd in de binnenvaart van ten minste 180 dagen als matroos;
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel10.01
  - number: 10.01.4.b)
    text: |-
      of een met goed gevolg afgesloten, goedgekeurd opleidingsprogramma overeenkomstig [hoofdstuk 6][ref1] van ten
      minste drie jaar voor het operationele niveau, dat een vaartijd van ten minste 270 dagen omvat;


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel10.01
    references:
      - id: ref1
        bwb_id: BWBR0030215
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 10.01.5
    text: 'voor de stuurman:'
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel10.01
  - number: 10.01.5.a)
    text: |-
      hetzij een vaartijd in de binnenvaart van ten minste 180 dagen als volmatroos en houder zijn van een geldig
      marifoonbedieningscertificaat;
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel10.01
  - number: 10.01.5.b)
    text: of
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel10.01
  - number: 10.01.5.b).aa)
    text: |-
      een met goed gevolg afgesloten, goedgekeurd opleidingsprogramma als bedoeld in [hoofdstuk 6][ref1] van ten minste
      drie jaar voor het operationele niveau, dat een vaartijd van ten minste 360 dagen omvat, en


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel10.01
    references:
      - id: ref1
        bwb_id: BWBR0030215
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 10.01.5.b).bb)
    text: houder zijn van een geldig marifoonbedieningscertificaat;
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel10.01
  - number: 10.01.c)
    text: of
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel10.01
  - number: 10.01.c).aa)
    text: werkervaring van ten minste 500 dagen als kapitein van een zeeschip;
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel10.01
  - number: 10.01.c).bb)
    text: een met goed gevolg afgelegd administratief examen voor het operationele niveau en
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel10.01
  - number: 10.01.c).cc)
    text: houder zijn van een geldig marifoonbedieningscertificaat.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel10.01
  - number: 10.01_bis
    text: |-
      Ter verkrijging van een kwalificatiecertificaat moet de machinist voldoen aan de volgende minimumeisen inzake
      leeftijd, naleving van de administratieve voorschriften, competentie en vaartijd:
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel10.01
  - number: 10.01_bis.a)
    text: |-
      een minimumleeftijd van 18 jaar en een met goed gevolg afgelegd eindexamen van een vakopleiding op het gebied van
      motoren, werktuigbouwkunde of wanneer motorkennis daarvan deel uitmaakt, mechatronica; of
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel10.01
  - number: 10.01_bis.b)
    text: een minimumleeftijd van 19 jaar en een vaartijd van ten minste 360 dagen als volmatroos op een gemotoriseerd schip.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel10.01
  - number: 10.03.1
    text: |-
      De geldigheid van kwalificatiecertificaten voor het instroom- en operationeel niveau eindigt uiterlijk op de dag
      van het volgende, in [artikel 4.02, eerste lid][ref1], voorgeschreven medische onderzoek. Na dit tijdstip verliezen
      de kwalificatiecertificaten van ambtswege hun geldigheid, zelfs zonder een besluit van de bevoegde autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel4
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel10.03
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 10.03.2
    text: |-
      De kwalificatiecertificaten voor het instroom- en operationeel niveau worden volgens het toepasselijke model
      overeenkomstig de ES-QIN (Deel V, hoofdstuk 2) afgegeven.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel10.03
  - number: 11.01.1
    text: |-
      Degene die op de Rijn een vaartuig wil voeren, moet houder zijn van een Uniekwalificatiecertificaat schipper dat
      overeenkomstig [Richtlijn (EU) 2017/2397](32017L2397) is afgegeven of van een kwalificatiecertificaat schipper dat
      overeenkomstig dit reglement is afgegeven.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel11.01
  - number: 11.01.2
    text: |-
      Voor het voeren van een vaartuig benedenstrooms van het Spijksche Veer (km 857,40) en op het riviergedeelte
      tussen Bazel (Mittlere Rheinbrücke – km 166,53) en de sluizen van Iffezheim (km 335,92), volstaat in plaats van
      de patenten, als bedoeld in de [artikelen 12.02][ref1] en [12.03][ref2], een ander door de bevoegde autoriteit als
      gelijkwaardig erkend patent.


      [ref1]: https://wetten.overheid.nl/BWBR0030215#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0030215#Artikel12
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel11.01
    references:
      - id: ref1
        bwb_id: BWBR0030215
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0030215
        artikel: '12'
        hoofdstuk: '12'
        paragraaf: '3'
  - number: 11.01.3
    text: |-
      Voor vaartuigen met een lengte van minder dan 20 m, met uitzondering van passagiersschepen, duw- en sleepboten,
      volstaat een kwalificatiecertificaat schipper voor binnenwateren dat in overeenstemming is met de nationale
      voorschriften van de Rijnoeverstaten en België.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel11.01
  - number: 11.01.4
    text: |-
      De verplichting tot het hebben van een patent wordt uitsluitend geregeld door de nationale voorschriften van de
      Rijnoeverstaten en België:
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel11.01
  - number: 11.01.4.a)
    text: voor veerponten;
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel11.01
  - number: 11.01.4.b)
    text: voor vaartuigen die slechts door spierkracht worden voortbewogen;
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel11.01
  - number: 11.01.4.c)
    text: |-
      voor vaartuigen met een lengte van minder dan 20 m die slechts door middel van zeilen worden voortbewogen of
      voorzien zijn van een voortstuwingsmotor met een vermogen van niet meer dan 11,03 kW;
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel11.01
  - number: 11.01.4.d)
    text: voor vaartuigen van de strijdkrachten.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel11.01
  - number: '11.02'
    text: 'Overeenkomstig dit reglement wordt een onderscheid gemaakt tussen:'
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel11.02
  - number: 11.02.a)
    text: het Rijnpatent voor het voeren van alle vaartuigen;
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel11.02
  - number: 11.02.b)
    text: het sportpatent voor het voeren van een pleziervaartuig met een lengte van minder dan 25 m;
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel11.02
  - number: 11.02.c)
    text: het overheidspatent voor het voeren van overheidsvaartuigen en van brandweerboten.
