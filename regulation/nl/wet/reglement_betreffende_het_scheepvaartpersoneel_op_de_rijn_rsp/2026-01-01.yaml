      opleidingsprogramma met goed gevolg heeft afgerond, de bevoegde autoriteit overeenkomstig de bepalingen van
      [artikel 12.04, tweede tot en met vierde lid][ref2] een Rijnpatent af te geven. Naast de in dit artikel genoemde
      documenten, voegt de kandidaat het diploma bij waaruit blijkt dat hij het opleidingsprogramma met goed gevolg heeft
      afgerond.


