articles:
  - number: '1.01'
    text: Dit reglement is van toepassing op
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel1.01
  - number: 1.01.a)
    text: schepen met een lengte van 20 m of meer;
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel1.01
  - number: 1.01.b)
    text: schepen waarvan het product van L. B. T gelijk is aan een inhoud van 100 m3 of meer;
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel1.01
  - number: 1.01.c)
    text: |-
      sleep- en duwboten die ervoor zijn ingericht, vaartuigen als bedoeld in de onderdelen a, b of f te slepen, te duwen
      of langszij vastgemaakt mee te voeren;
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel1.01
  - number: 1.01.d)
    text: schepen die een toelatingscertificaat als bedoeld in het ADN-Reglement bezitten;
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel1.01
  - number: 1.01.e)
    text: passagiersschepen;
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel1.01
  - number: 1.01.f)
    text: drijvende werktuigen
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel1.01
  - number: '1.02'
    text: |-
      In dit reglement wordt verstaan onder:

      1. *‘vaartuig’:* een binnenschip, een zeeschip of een drijvend werktuig; 2. *‘binnenschip’:* een schip dat
      uitsluitend of overwegend voor de vaart op binnenwateren bestemd is; 3. *‘zeeschip’:* een schip dat voor de zee-
      of kustvaart is toegelaten en overwegend daartoe bestemd is; 4. *‘motorschip’:* een schip dat voor het vervoer
      van goederen bestemd is en door middel van zijn eigen mechanische middelen tot voortbeweging zelfstandig kan
      varen; 5. *‘veerpont’:* een schip dat een veerdienst onderhoudt waarbij de vaarweg wordt overgestoken en door
      de bevoegde autoriteit als veerpont wordt aangemerkt; 6. *‘overheidsvaartuig’:* een schip dat ter uitvoering
      van overheidstaken wordt ingezet; 7. *‘brandweerboot’:* een schip dat ter uitvoering van hulpverlening wordt
      ingezet; 8. *‘sleepboot’:* een schip dat speciaal gebouwd is om te slepen; 9. *‘duwboot’:* een schip dat speciaal
      gebouwd is voor het voortbewegen van een duwstel; 10. *‘sleepschip’:* een schip dat bestemd is voor het vervoer
      van goederen en is gebouwd om te worden gesleept, met of zonder eigen mechanische middelen tot voortbeweging
      waardoor slechts verplaatsingen over kleine afstanden mogelijk zijn; 11. *‘duwbak’:* een schip dat is bestemd
      voor het vervoer van goederen en gebouwd of in het bijzonder geschikt is om te worden geduwd, met of zonder eigen
      mechanische middelen tot voortbeweging, waardoor slechts verplaatsingen over kleine afstanden mogelijk zijn,
      wanneer het geen deel uitmaakt van een duwstel; 12. *‘passagiersschip’:* een schip dat is gebouwd en ingericht
      voor het vervoer van meer dan 12 passagiers; 13. *‘schip voor dagtochten’:* een passagiersschip zonder hutten voor
      overnachting van passagiers; 14. *‘hotelschip’:* een passagiersschip met hutten voor overnachting van passagiers;
      15. *‘drijvend werktuig’:* een drijvend bouwsel waarop zich werkinstallaties bevinden zoals kranen, baggermolens,
      hei-installaties, elevatoren; 16. *‘pleziervaartuig’:* een vaartuig dat bestemd is en aantoonbaar gebruikt wordt
      voor sportieve of recreatieve doeleinden en waarvan de personen aan boord voor sportieve of recreatieve doeleinden
      varen;

      17. *‘samenstel’:* een hecht samenstel of een sleep; 18. *‘hecht samenstel’* : een duwstel of een gekoppeld
      samenstel; 19. *‘duwstel’:* een hecht samenstel van vaartuigen, waarvan er ten minste één geplaatst is vóór
      het schip of de twee schepen met motoraandrijving die dienen voor het voortbewegen van het samenstel en worden
      aangeduid als ‘duwboot’ of ‘duwboten’. Hieronder wordt ook een duwstel verstaan dat is samengesteld uit een duwend
      en een geduwd vaartuig waarvan de koppelingen een beheerst knikken mogelijk maken; 20. *‘gekoppeld samenstel’:*
      een hecht samenstel van langszij aan elkaar vastgemaakte schepen die geen van beide vóór het motorschip geplaatst
      zijn dat voor het voortbewegen van het samenstel dient; 21. *‘sleep’:* een samenstel van één of meer vaartuigen,
      drijvende inrichtingen of drijvend materieel dat wordt gesleept door één of meer tot het samenstel behorende
      vaartuigen met motoraandrijving; 22. *‘groot konvooi’:* een duwstel waarbij het product van de totale lengte en
      totale breedte van de geduwde vaartuigen 7.000 m2 of meer bedraagt;

      23. *‘lengte of L’:* de grootste lengte van de scheepsromp in meters, gemeten zonder roer en boegspriet; 24.
      *‘breedte of B’:* de grootste breedte van de scheepsromp in meters, gemeten op de buitenkant van de huidbeplating
      (zonder schoepraderen, schuurlijsten en dergelijke); 25. *‘diepgang of T’:* de verticale afstand in meters van het
      laagste punt van de scheepsromp zonder rekening te houden met de kiel of andere vaste onderdelen tot het vlak van
      de grootste inzinking van de scheepsromp;

      26. *‘schipper’:* een dekbemanningslid dat gekwalificeerd is om een vaartuig op de binnenwateren te besturen
      en om aan boord de algemene verantwoordelijkheid te dragen, ook voor de bemanning, de passagiers en de lading;
      27. *‘bemanning’:* de dekbemanning en het machinekamerpersoneel; 28. *‘dekbemanning’:* de bemanning zonder
      het machinekamerpersoneel; 29. *‘dekbemanningsleden’:* personen die betrokken zijn bij de algemene bediening
      van een vaartuig dat de binnenwateren bevaart en die verschillende taken uitvoeren, zoals taken in verband
      met het besturen van een vaartuig, de beheersing van het vaartuig, ladingsbehandeling, stouwen, het vervoer
      van passagiers, scheepswerktuigbouwkundige aspecten, onderhoud en reparatie, communicatie, gezondheid,
      veiligheid en milieubescherming, niet zijnde personen die uitsluitend worden ingezet voor de bediening van
      de motoren, kranen, of elektrische en elektronische uitrusting; 30. *‘minimumbemanning’:* de voorgeschreven
      minimumbemanning overeenkomstig [hoofdstuk 19][ref1] van dit reglement; 31. *‘boordpersoneel’:* alle aan boord
      van een passagiersschip werkende personen die niet tot de bemanning behoren; 32. *‘veiligheidspersoneel’:* het
      veiligheidspersoneel zoals voorgeschreven door het ADN-Reglement, de deskundige op het gebied van vloeibaar
      aardgas (LNG), de deskundige voor de passagiersscheepvaart, de eerstehulpverlener alsmede de persluchtmaskerdrager;
      33. *‘deskundige op het gebied van vloeibaar aardgas’:* een persoon die gekwalificeerd is om actief te zijn bij
      de bunkeringsprocedure van schepen die op vloeibaar aardgas varen of om als schipper een dergelijk vaartuig te
      besturen; 34. *‘deskundige voor de passagiersvaart’:* een persoon die dienst doet aan boord van het schip en
      bevoegd is om aan boord van passagiersschepen maatregelen te nemen in noodsituaties; 35. *‘passagier’:* iedere
      persoon aan boord die niet tot de bemanning of tot het boordpersoneel behoort; 36. *‘vaartijd’:* de tijd;
      uitgedrukt in dagen, die dekbemanningsleden aan boord hebben doorgebracht tijdens een reis met een vaartuig
      op binnenwateren, met inbegrip van laad- en losactiviteiten die actieve scheepvaartoperaties vereisen; 37.
      *‘radarvaart’:* de vaart bij slecht zicht op radar; 38. *‘specifiek risico’:* een veiligheidsrisico als gevolg
      van bijzondere navigatie-omstandigheden waarvoor schippers competenties moeten hebben die verder gaan dan wat
      in het kader van de algemene normen voor managementcompetenties wordt verwacht; 39. *‘kwalificatiecertificaat’:*
      een krachtens dit reglement afgegeven certificaat; 40. *‘kwalificatiecertificaat van de Unie’*: een
      certificaat dat afgegeven is door een daarvoor aangewezen autoriteit van een lidstaat van de Europese Unie
      of door een derde land waarvan de certificaten door de Europese Commissie als geldig erkend zijn en waarmee
      wordt aangetoond dat een persoon aan de voorschriften van [Richtlijn (EU) 2017/2397](32017L2397) voldoet;
      41. *‘marifoonbedieningscertificaat’:* een nationaal certificaat dat is afgegeven in overeenstemming met het
      radioreglement dat is gehecht aan het Internationaal Verdrag betreffende de telecommunicatie, waarbij machtiging
      wordt verleend voor de exploitatie van een radiocommunicatiestation op een vaartuig voor de binnenwaterwegen;
      42. *‘Rijnpatent’:* een kwalificatiecertificaat overeenkomstig [artikel 12.01][ref2] van dit reglement voor het
      voeren van een vaartuig; 43. *‘dienstboekje’:* een persoonlijk register waarin de gegevens met betrekking tot
      het arbeidsverleden van een bemanningslid staan genoteerd, met name de vaartijden en de gemaakte reizen; 44.
      *‘vaartijdenboek’:* een officiële registratie van de reizen die een vaartuig en zijn bemanning hebben gemaakt;
      45. *‘actief dienstboekje’ of ‘actief vaartijdenboek’:* een dienstboekje of vaartijdenboek waarin gegevens kunnen
      worden geregistreerd; 46. *‘competentie’:* het bewezen vermogen om gebruik te maken van de door de vastgestelde
      normen voorgeschreven kennis en vaardigheden om de taken die nodig zijn voor het besturen van binnenvaartuigen goed
      uit te voeren; 47. *‘managementniveau’:* de mate van verantwoordelijkheid die samenhangt met het werk als schipper
      en waarborgt dat alle andere dekbemanningsleden alle taken bij de bediening van een vaartuig goed uitvoeren;
      48. *‘operationeel niveau’:* de mate van verantwoordelijkheid die samenhangt met het werk als matroos, als
      volmatroos of als stuurman en het onder controle houden van de uitvoering van alle taken binnen het kader van diens
      verantwoordelijkheid, overeenkomstig passende procedures en onder leiding van een persoon die op managementniveau
      werkzaam is;

      49. *‘binnenwater’:* een waterweg niet zijnde de zee die bevaarbaar is voor de in [artikel 1.01][ref3] bedoelde
      vaartuigen; 50. *‘ADN-Reglement’:* het bij het Europees Verdrag over het internationale Vervoer van gevaarlijke
      Stoffen over Binnenwateren (ADN) gevoegde Reglement in de versie die van kracht is; 51. *‘binnenschipcertificaat’:*
      het certificaat van onderzoek voor Rijnschepen of het Uniecertificaat voor binnenschepen overeenkomstig
      [artikel 1.04 van het Reglement Onderzoek Schepen op de Rijn][ref4] (ROSR); 52. *‘Commissie van Deskundigen’:* de
      nationale autoriteit die bevoegd is voor de afgifte van het certificaat van onderzoek en waarvan de samenstelling
      is vastgesteld in [artikel 2.01 van het ROSR][ref5]; 53. *‘bevoegde autoriteit’:* de nationale autoriteit van een
      Rijnoeverstaat of van België die is aangewezen om taken in overeenstemming met dit reglement uit te voeren; 54.
      *‘autoriteit van afgifte’:* de bevoegde autoriteit van een staat die het betreffende certificaat heeft afgegeven;
      55. *‘vloeibaar aardgas (LNG)’:* aardgas dat vloeibaar is gemaakt door afkoeling tot een temperatuur van -161
      °C; 56. *‘ES-TRIN’:* ES-TRIN als bedoeld in [artikel 1.1 van de Binnenvaartregeling][ref6]. Bij de toepassing
      van de ES-TRIN moet onder lidstaat een Rijnoeverstaat of België worden verstaan; 57. *‘ES-QIN’:* de Europese
      Standaard voor kwalificaties in de binnenvaart, editie 2024/1; 58. *‘STCW-Overeenkomst’:* de overeenkomst van de
      Internationale Maritieme Organisatie (IMO) betreffende de normen voor zeevarenden inzake opleiding, diplomering
      en wachtdienst (1978), in de versie die van kracht is, met inbegrip van de overgangsbepalingen van artikel VII en
      regeling 1/15 van de Overeenkomst, alsook de in het desbetreffende geval toepasselijke bepalingen van de STCW-Code,
      die van kracht is.


