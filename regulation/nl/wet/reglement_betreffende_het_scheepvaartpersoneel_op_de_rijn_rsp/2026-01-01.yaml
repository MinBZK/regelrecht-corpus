    text: |-
      Degene die met goed gevolg een eindexamen van een beroepsopleiding heeft afgelegd, kan voor de verkrijging van het
      Rijnpatent worden vrijgesteld van het theoretisch gedeelte van het examen dat betrekking heeft op kennis die reeds
      onderwerp was van een examen in het kader van de beroepsopleiding. De CCR publiceert een lijst van deze eindexamens
      van beroepsopleidingen en gedeelten van het examen ter verkrijging van het Rijnpatent die recht geven op een
      vrijstelling. De lijst van als gelijkwaardig erkende examens wordt door de CCR op de website geplaatst.
    url: https://wetten.overheid.nl/BWBR0030215/2026-01-01#Artikel12.05
