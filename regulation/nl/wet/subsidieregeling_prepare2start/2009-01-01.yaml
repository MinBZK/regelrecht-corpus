preamble:
  text: |-
    Gelet op artikel 3 van de Kaderwet EZ-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0024955/2009-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *aanvragen van één of meer octrooien, merk- of modelregistraties:* het met behulp van een octrooi-, merk- of
      modelgemachtigde indienen van één of meer octrooiaanvragen dan wel aanvragen voor merk- of modelregistraties ten
      behoeve van de bescherming van de industriële eigendom in één of meer landen voor zover dit voortvloeit uit het
      internationaliseringsplan;
        - *de minimis verordeningen:* Verordening (EG) nr. 1998/2006 van de Commissie van de Europese Gemeenschappen van
      15 december 2006 betreffende de toepassing van de artikelen 87 en 88 van het Verdrag op de-minimissteun (PbEU L
      379), Verordening (EG) nr. 875/2007 van de Commissie van de Europese Gemeenschappen van 24 juli 2007 betreffende
      de toepassing van de artikelen 87 en 88 van het Verdrag op de-minimissteun in de visserijsector (PbEU L 193) en
      Verordening (EG) nr. 1535/2007 van de Commissie van de Europese Gemeenschappen van 20 december 2007 betreffende de
      toepassing van de artikelen 87 en 88 van het Verdrag op de-minimissteun in de landbouwproductiesector (PbEU L 337);
        - *doelland:* land waarop het internationaliseringsplan gericht is;
        - *groep:* een economische eenheid, waarin organisatorisch zijn verbonden: a. een natuurlijke persoon of
      privaatrechtelijke rechtspersoon, die direct of indirect: 1°. meer dan de helft van het geplaatste kapitaal
      verschaft aan, 2°. volledig aansprakelijk vennoot is van, of 3°. overwegende zeggenschap heeft over een of meer
      rechtspersonen of vennootschappen, en b. laatstbedoelde rechtspersonen of vennootschappen;
        - *internationaliseringsplan:* een plan van aanpak ten behoeve van een onderneming dat is opgesteld in samenwerking
      met een uitvoerder, dat is gericht op de oriëntatie van het voor eigen rekening en risico bewerken van een
      buitenlandse markt vanuit Nederland met het oog op de verkoop van goederen of verlening van diensten op die markt,
      dat een inventarisatie bevat van de sterke en zwakke kanten, kansen en bedreigingen van de onderneming op gebied
      van internationaal ondernemen en aangeeft welke activiteiten zullen worden uitgevoerd om de doelstellingen in
      het plan op die buitenlandse markt te realiseren, bestaande uit: 1°. marktverkenning, 2°. partnerselectie, 3°.
      productpresentatie, 4°. het ontwikkelen en produceren van presentatiemateriaal, 5°. het vergroten van kennis en
      kunde op het gebied van internationaal ondernemen, 6°. het inwinnen van juridisch advies of 7°. het aanvragen van
      één of meer octrooien, merk- of modelregistraties;
        - *inwinnen van juridisch advies:* het inwinnen door de ondernemer van juridisch advies op het gebied van
      internationaal ondernemen;
        - *marktverkenning:* een schriftelijk verslag over de mogelijkheden van ondernemen op een markt in het buitenland,
      opgesteld door een organisatie die deskundig en ervaren is op het gebied van marktonderzoek;
        - *minister:* de Minister van Economische Zaken;
        - *ondernemer:* een natuurlijke persoon, een rechtspersoon of een vennootschap, die een onderneming in stand houdt,
      niet zijnde een rechtspersoon die krachtens publiekrecht is ingesteld;
        - *ondernemersorganisatie:* een stichting of een vereniging met volledige rechtsbevoegdheid die blijkens haar
      statuten tot doel heeft de belangen te behartigen van ondernemingen of organisaties van ondernemingen, die beschikt
      over deskundigheid op het gebied van internationaal ondernemen en die zich als ondernemersorganisatie in de zin van
      deze regeling bij de minister heeft aangemeld;
        - *partnerselectie:* het ten behoeve van de ondernemer selecteren van en het leggen van contacten door een
      organisatie die deskundig en ervaren is op het gebied van marktonderzoek;
        - *presentatiemateriaal:* schriftelijke, digitale of audiovisuele product- of bedrijfsinformatie of vormen
      van verkoopondersteuning zoals reclame, advertenties, elektronische bedrijfsvoering en de vervaardiging van
      demonstratiemodellen;
        - *productpresentatie:* de presentatie van een onderneming of product op buitenlandse of internationale beurzen,
      congressen, symposia, exposities en dergelijke evenementen;
        - *uitvoerder:* een ondernemersorganisatie, een kamer van koophandel en fabrieken of Syntens;
        - *vergroten van kennis en kunde op gebied van internationaal ondernemen:* het door een ondernemer of vaste
      werknemers van een ondernemer volgen van opleidingen, cursussen, workshops, seminars of trainingen, die relevant
      zijn voor het internationaal ondernemen en waarvan de kwaliteit gewaarborgd is, dan wel het met instemming van de
      desbetreffende onderwijsinstelling contracteren door een ondernemer van één of meer studenten, die een opleiding
      op het gebied van internationaal ondernemen volgen bij een instelling voor middelbaar beroepsonderwijs, hoger
      beroepsonderwijs of universitair onderwijs, voor een studieopdracht die gericht is op één of meer aspecten van de
      uitvoering van het internationaliseringsplan dan wel de tijdelijke inhuur door een ondernemer van één of meer op
      het terrein van internationaal ondernemen ervaren adviseurs of begeleiders ten behoeve van de ondersteuning van de
      uitvoering van het internationaliseringsplan.
    url: https://wetten.overheid.nl/BWBR0024955/2009-01-01#Artikel1
  - number: '2'
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een ondernemer die voor eigen rekening en risico één of meer
      activiteiten beschreven in het internationaliseringsplan uitvoert met uitzondering van een ondernemer:

      a. die zich uitsluitend bezighoudt met het beheer van een groep;

      b. die voor de activiteiten, genoemd in het internationaliseringsplan, reeds subsidie heeft ontvangen van een
      bestuursorgaan of de Commissie van de Europese Gemeenschappen;

      c. die op het tijdstip van indiening van de aanvraag meer dan 100 werknemers in dienst heeft;

      d. die in de twaalf maanden voorafgaand aan de datum van indiening van de aanvraag meer dan 25 procent van zijn
      omzet uit exportactiviteiten behaalde, tenzij de ondernemer in die periode een omzet van ten hoogste € 100.000
      heeft behaald;

      e. die gedurende de twaalf maanden voorafgaand aan de aanvraag om subsidie meer dan 3 procent van zijn totale
      fiscale omzet in het betreffende doelland heeft gerealiseerd, tenzij:

      1°. die omzet met niet meer dan drie afnemers is gerealiseerd, of

      2°. de ondernemer aannemelijk maakt dat activiteiten ter zake van marktverkenning, partnerselectie of juridisch
      advies in redelijkheid noodzakelijk zijn voor zijn toegang tot een binnen dat doelland gelegen regio waarin hij nog
      niet actief is;

      f. aan wie reeds subsidie is verleend op grond van deze regeling of de
      [Subsidieregeling programma starters op buitenlandse markten 2004][ref1] voor activiteiten in hetzelfde doelland;

      g. aan wie op grond van deze regeling of de [Subsidieregeling programma starters op buitenlandse markten 2004][ref2]
      reeds driemaal subsidie is verleend;

      h. aan wie op grond van de in onderdeel f genoemde regelingen een subsidie is verleend die nog niet is vastgesteld.

      2 In afwijking van het eerste lid, aanhef, en onderdeel f, verstrekt de minister ten hoogste eenmaal een nieuwe
      subsidie voor activiteiten in hetzelfde doelland, indien de ondernemer aannemelijk maakt dat activiteiten ter zake
      van marktverkenning, partnerselectie of juridisch advies in redelijkheid noodzakelijk zijn voor zijn toegang tot
      een binnen dat doelland gelegen regio, waarin hij nog niet actief is.

      3 In de gevallen, bedoeld in het eerste lid, onderdeel e, onder tweede, en het tweede lid, verstrekt de minister
      uitsluitend subsidie voor de uitvoering van de activiteiten marktverkenning, partnerselectie of juridisch advies.


      [ref1]: https://wetten.overheid.nl/BWBR0017396
      [ref2]: https://wetten.overheid.nl/BWBR0017396
    url: https://wetten.overheid.nl/BWBR0024955/2009-01-01#Artikel2
