  - number: '3'
    text: |-
      1 De subsidie bedraagt 50 procent van de subsidiabele kosten maar niet meer dan € 11.500.

      2 Het bedrag van de subsidie wordt verlaagd voor zover dit nodig is op basis van de de minimis verordeningen.
    url: https://wetten.overheid.nl/BWBR0024955/2009-01-01#Artikel3
  - number: '4'
    text: |-
      1 Voor subsidie komen uitsluitend in aanmerking de kosten, genoemd in het tweede tot en met achtste lid.

      2 Als kosten van een marktverkenning komen in aanmerking: de kosten die aan de subsidieontvanger in rekening worden
      gebracht door een organisatie die deskundig en ervaren is op het gebied van marktonderzoek.

      3 Als kosten van partnerselectie komen in aanmerking: de kosten die aan de subsidieontvanger in rekening worden
      gebracht door een organisatie die deskundig is op gebied van marktonderzoek, reis- en verblijfkosten van de
      subsidieontvanger daaronder niet begrepen.

      4 Als kosten van productpresentatie komen in aanmerking: de door derden aan de subsidieontvanger in rekening
      gebrachte kosten van de huur van de benodigde ruimte, de kosten van de huur, transport, opbouw en inrichting van
      de stand, de huur van audiovisuele middelen en kosten van buitenlandse promotie, waaronder begrepen kosten van een
      bureau of organisatie in verband met vooronderzoek en andere promotieactiviteiten.

      5 Als kosten van presentatiemateriaal komen in aanmerking: de kosten van schriftelijke, digitale of audiovisuele
      product- of bedrijfsinformatie en de kosten van verkoopondersteunende activiteiten die door derden aan de
      subsidieontvanger in rekening worden gebracht.

      6 Als kosten van het vergroten van kennis en kunde op het gebied van internationaal ondernemen komen in aanmerking:

      a. de door derden aan de subsidieontvanger in rekening gebrachte kosten van opleidingen, cursussen, workshops,
      seminars en trainingen die relevant zijn voor het internationaal ondernemen en, indien van toepassing, van het in
      het kader daarvan behalen van een diploma;

      b. de aan de subsidieontvanger in rekening gebrachte reis- en verblijfkosten, gemaakt door studenten in het kader
      van hun studieopdracht, alsmede de contractueel vastgelegde studieopdrachtvergoedingen;

      c. de door derden aan de subsidieontvanger in rekening gebrachte kosten voor de tijdelijke inhuur, niet zijnde
      in tijdelijke loondienst, van één of meer op het terrein van internationaal ondernemen ervaren adviseurs
      of begeleiders voor zover die kosten direct verband houden met de ondersteuning van de uitvoering van het
      internationaliseringsplan.

      7 Als kosten van het inwinnen van juridisch advies komen in aanmerking: de kosten die in rekening worden gebracht
      door een in internationaal ondernemen gespecialiseerde juridische adviseur.

      8 Als kosten van het aanvragen van één of meer octrooien, merk- of modelregistraties komen in aanmerking: de
      door derden aan de subsidieontvanger in rekening gebrachte kosten verbonden aan de indiening van die aanvragen,
      waaronder begrepen de diensten van een octrooi-, merk- of modelgemachtigde, indieningstaksen, alsmede de door
      derden aan de subsidieontvanger in rekening gebrachte kosten voor vertaling.

      9 Vóór indiening van de aanvraag door de ondernemer gemaakte kosten komen niet voor subsidie in aanmerking,
      tenzij de minister daarvoor, voorafgaand aan het maken van die kosten of het daartoe aangaan van verplichtingen,
      toestemming heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0024955/2009-01-01#Artikel4
  - number: '5'
    text: |-
      1 De minister verdeelt het subsidieplafond op volgorde van binnenkomst van de aanvragen, met dien verstande
      dat, indien een aanvrager niet heeft voldaan aan enig wettelijk voorschrift voor het in behandeling nemen van de
      aanvraag en met toepassing van [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad
      de aanvraag aan te vullen, de dag waarop de aanvraag voldoet aan de wettelijke voorschriften met betrekking tot de
      verdeling als datum van ontvangst geldt.

      2 Indien de minister op de dag dat het subsidieplafond wordt bereikt meer dan één aanvraag ontvangt, stelt hij de
      onderlinge rangschikking van die aanvragen vast door middel van loting.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0024955/2009-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:5
  - number: '6'
    text: |-
      Bij ministeriële regeling wordt jaarlijks een subsidieplafond vastgesteld voor het in dat jaar verstrekken van
      subsidies op grond van deze regeling.
    url: https://wetten.overheid.nl/BWBR0024955/2009-01-01#Artikel6
  - number: '7'
    text: |-
      1 Een aanvraag om subsidie wordt ingediend met gebruikmaking van het formulier dat is opgenomen in
      [bijlage 1][ref1].

      2 De aanvraag gaat, overeenkomstig in het formulier is vermeld, vergezeld van de in het formulier aangegeven
      bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0024955
    url: https://wetten.overheid.nl/BWBR0024955/2009-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0024955
  - number: '8'
    text: |-
      De minister beslist afwijzend op een aanvraag indien:

      a. de aanvraag niet voldoet aan deze regeling;

      b. door toekenning het totaal van de ten laste van hetzelfde subsidieplafond verstrekte subsidies, per aanvraag
      vermeerderd met € 2.700, meer zou komen te bedragen dan het betrokken subsidieplafond;

      c. het internationaliseringsplan niet gerelateerd is aan de verkoop van goederen of verlening van diensten op een
      of meerdere buitenlandse markten, dan wel het plan uitsluitend gericht is op een importverkenning voor de verkoop
      van goederen of verlening van diensten in Nederland of op een verkenning met het oog op volledige verplaatsing van
      de onderneming naar het buitenland;

      d. door een of meer bestuursorganen in het kalenderjaar van de aanvraag en twee aan dit kalenderjaar voorafgaande
      kalenderjaren aan de aanvrager reeds tot een gelijk of hoger bedrag subsidie is verstrekt zonder goedkeuring van de
      Commissie van de Europese Gemeenschappen dan voor de sector waartoe de betrokken aanvrager behoort, is vastgesteld
      in de de minimis verordeningen dan wel indien subsidieverstrekking niet is toegestaan onder toepassing van de
      betrokken de minimis verordening;

      e. de uitvoerder die meewerkte bij de opstelling van het internationaliseringsplan tevens betrokken is bij de
      uitvoering van de in dat plan genoemde activiteiten;

      f. onvoldoende vertrouwen bestaat dat de betrokkenen de activiteiten kunnen financieren;

      g. het onaannemelijk wordt geacht dat de activiteiten binnen 18 maanden na de subsidieverlening kunnen worden
      voltooid;

      h. aannemelijk is dat de activiteiten ook zonder subsidie zonder belangrijke vertraging zouden worden uitgevoerd;

      i. onvoldoende vertrouwen bestaat in de technische haalbaarheid van de activiteiten;

      j. onvoldoende vertrouwen bestaat in de economische haalbaarheid van de activiteiten;

      k. de activiteiten geen bijdrage aan de doelstellingen van de subsidie leveren;

      l. onvoldoende vertrouwen bestaat dat de betrokkenen de capaciteiten hebben om de activiteiten naar behoren uit
      te voeren.
    url: https://wetten.overheid.nl/BWBR0024955/2009-01-01#Artikel8
  - number: '9'
    text: |-
      1 De minister geeft een beschikking binnen dertien weken na ontvangst van de aanvraag.

      2 Indien een beschikking niet binnen de in het eerste lid aangegeven termijn kan worden gegeven, kan deze termijn
      eenmaal met dertien weken worden verlengd.
    url: https://wetten.overheid.nl/BWBR0024955/2009-01-01#Artikel9
  - number: '10'
    text: |-
      De subsidie-ontvanger doet onverwijld mededeling aan de minister van de indiening bij de rechtbank van een
      verzoek tot het op hem toepassing verklaren van de schuldsaneringsregeling natuurlijke personen, tot verlening van
      surseance van betaling aan hem of tot faillietverklaring van hem.
    url: https://wetten.overheid.nl/BWBR0024955/2009-01-01#Artikel10
  - number: '11'
    text: |-
      1 De subsidie-ontvanger voert de activiteiten uit overeenkomstig het internationaliseringsplan en voltooit deze
      binnen 18 maanden na de subsidieverlening.

      2 De minister kan voor het vertragen, essentieel wijzigen of het stopzetten van activiteiten op voorafgaand verzoek
      van de subsidie-ontvanger ontheffing verlenen van de verplichting, bedoeld in het eerste lid. Aan de ontheffing
      kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0024955/2009-01-01#Artikel11
  - number: '12'
    text: |-
      1 De subsidie-ontvanger voert een zodanige administratie dat daaruit te allen tijde op eenvoudige en duidelijke
      wijze is af te leiden:

      a. de aard, inhoud en voortgang van de verrichte werkzaamheden;

      b. de specifiek ten behoeve van de activiteiten gemaakte en betaalde kosten.

      2 De administratie wordt tot vijf jaar na de datum van de beschikking tot subsidievaststelling bewaard.
    url: https://wetten.overheid.nl/BWBR0024955/2009-01-01#Artikel12
  - number: '13'
    text: De minister kan bij de beschikking tot subsidieverlening nadere verplichtingen opleggen.
    url: https://wetten.overheid.nl/BWBR0024955/2009-01-01#Artikel13
  - number: '14'
    text: |-
      1 De subsidie-ontvanger dient zijn aanvraag om subsidievaststelling in binnen dertien weken na het tijdstip waarop
      de activiteiten moeten zijn voltooid.

      2 De aanvraag wordt ingediend met gebruikmaking van het formulier dat is opgenomen in [bijlage 2][ref1].

      3 De aanvraag gaat, overeenkomstig in het formulier is vermeld, vergezeld van de in het formulier aangegeven
      bescheiden, waaronder in elk geval een eindverslag omtrent de uitvoering en de resultaten van de activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0024955
    url: https://wetten.overheid.nl/BWBR0024955/2009-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0024955
  - number: '15'
    text: |-
      1 De minister geeft de beschikking tot subsidievaststelling binnen dertien weken na ontvangst van de aanvraag
      daartoe, dan wel nadat de voor het indienen ervan geldende termijn is verstreken.

      2 Indien een beschikking tot subsidievaststelling niet binnen de in het eerste lid genoemde termijn kan worden
      gegeven, kan deze termijn eenmaal met dertien weken worden verlengd.
    url: https://wetten.overheid.nl/BWBR0024955/2009-01-01#Artikel15
  - number: '16'
    text: |-
      De minister verstrekt subsidie aan een uitvoerder die een ondernemer ondersteunt bij het opstellen en uitvoeren van
      een internationaliseringsplan.
    url: https://wetten.overheid.nl/BWBR0024955/2009-01-01#Artikel16
  - number: '17'
    text: De subsidie bedraagt € 2.700.
    url: https://wetten.overheid.nl/BWBR0024955/2009-01-01#Artikel17
  - number: '18'
    text: |-
      De minister verstrekt de uitvoerder geen subsidie indien de corresponderende aanvraag tot subsidieverlening van de
      ondernemer wordt afgewezen.
    url: https://wetten.overheid.nl/BWBR0024955/2009-01-01#Artikel18
  - number: '19'
    text: De minister verleent de subsidie ambtshalve, gelijktijdig met de verlening van subsidie aan de ondernemer.
    url: https://wetten.overheid.nl/BWBR0024955/2009-01-01#Artikel19
  - number: '20'
    text: |-
      1 De subsidie-ontvanger informeert de minister over de door de ondernemer geboekte voortgang bij de uitvoering van
      het internationaliseringsplan.

      2 De minister kan bij de beschikking tot subsidieverlening nadere verplichtingen opleggen.
    url: https://wetten.overheid.nl/BWBR0024955/2009-01-01#Artikel20
  - number: '21'
    text: |-
      1 De minister verstrekt ambtshalve een voorschot binnen twee weken na de datum van de beschikking tot
      subsidieverlening.

      2 Het voorschot bedraagt € 1.800.
    url: https://wetten.overheid.nl/BWBR0024955/2009-01-01#Artikel21
  - number: '22'
    text: |-
      1 De minister stelt de subsidie ambtshalve vast, gelijktijdig met de vaststelling van de subsidie voor de
      ondernemer.

      2 De minister stelt de subsidie voor de uitvoerder vast op € 1.800 indien de uitvoerder de minister
      onvoldoende heeft geïnformeerd over de door de ondernemer geboekte voortgang bij de uitvoering van het
      internationaliseringsplan.
    url: https://wetten.overheid.nl/BWBR0024955/2009-01-01#Artikel22
  - number: '23'
    text: |-
      1 De [Subsidieregeling programma starters op buitenlandse markten 2004][ref1] wordt ingetrokken, met dien verstande
      dat zij van toepassing blijft op aanvragen om subsidie die zijn ingediend voor de datum van inwerkingtreding van
      deze regeling, en op subsidies die voor die datum zijn verstrekt.

      2 In afwijking van het eerste lid wordt het formulier, bedoeld in
      [artikel 14, tweede lid][ref2], gebruikt voor alle aanvragen om subsidievaststelling krachtens de
      [Subsidieregeling programma starters op buitenlandse markten 2004][ref3] gedaan na inwerkingtreding van deze
      regeling.


