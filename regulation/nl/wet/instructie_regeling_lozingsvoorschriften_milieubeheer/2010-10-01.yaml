        artikel: '2.1'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2.1'
  - number: '3'
    text: |-
      1 Voor zover het betreft inrichtingen waarvoor artikel IV, eerste lid, van de wet van 2 november 1994, Stb.
      798, houdende wijziging van de [Wet milieubeheer][ref1] en de [Wet verontreiniging oppervlaktewateren][ref2]
      (afvalwater) van toepassing is, verbindt het bevoegd gezag de voorschriften die ingevolge deze regeling aan een
      vergunning dienen te worden verbonden, vóór 1 maart 2003 aan de vergunning.

      2 Voor zover het betreft inrichtingen van waaruit bedrijfsafvalwater in het openbaar riool wordt gebracht, die zijn
      gelegen in gemeenten waarin onmiddellijk voorafgaand aan het tijdstip van inwerkingtreding van deze regeling geen
      gemeentelijke verordening van toepassing was, die regels stelt voor het brengen van afvalwater in de gemeentelijke
      riolering, verbindt het bevoegd gezag de voorschriften die ingevolge deze regeling aan een vergunning dienen te
      worden verbonden, uiterlijk een jaar na het tijdstip van inwerkingtreding van deze regeling aan de vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0002682
