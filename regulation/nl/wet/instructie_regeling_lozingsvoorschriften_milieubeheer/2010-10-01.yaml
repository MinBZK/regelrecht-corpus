  text: |-
    Gelet op de artikelen 8.45 jo 21.6, zesde lid, van de Wet milieubeheer;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0007944/2010-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:




              *bedrijfsriolering:*


              voorziening voor de afvoer van bedrijfsafvalwater vanuit een inrichting naar een openbaar riool;




              *openbaar riool:*


              gemeentelijke voorziening voor de inzameling en het transport van afvalwater;




              *zuiveringtechnisch werk:*


              zuiveringtechnisch werk als bedoeld in [artikel 1.1 van de Waterwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0007944/2010-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '1.1'
  - number: 1a
    text: |-
      Deze regeling berust mede op [artikel 5.14 van het Besluit omgevingsrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel5.14
    url: https://wetten.overheid.nl/BWBR0007944/2010-10-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '5.14'
  - number: '2'
    text: |-
      1 Het bevoegd gezag verbindt aan een omgevingsvergunning voor een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder e, van de Wet algemene bepalingen omgevingsrecht][ref1] met betrekking tot een
      inrichting van waaruit bedrijfsafvalwater wordt gebracht in een openbaar riool van waaruit afvalwater in een
      zuiveringtechnisch werk wordt gebracht, naast andere voorschriften die met het oog daarop nodig zijn, in ieder
      geval voorschriften inhoudende dat bedrijfsafvalwater slechts in een openbaar riool wordt gebracht, indien door de
      samenstelling, eigenschappen of hoeveelheid ervan:

      a. de doelmatige werking niet wordt belemmerd van een openbaar riool, een zuiveringtechnisch werk, of de bij een
      zodanig openbaar riool of zuiveringtechnisch werk behorende apparatuur,

      b. de verwerking niet wordt belemmerd van slib, verwijderd uit een openbaar riool of een zuiveringtechnisch werk,
      en

      c. de nadelige gevolgen voor de kwaliteit van een oppervlaktewaterlichaam zoveel mogelijk worden beperkt.

      2 Het bevoegd gezag verbindt aan een omgevingsvergunning voor een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder e, van de Wet algemene bepalingen omgevingsrecht][ref2] met betrekking tot
      een inrichting van waaruit bedrijfsafvalwater wordt gebracht in een openbaar riool van waaruit afvalwater
      in oppervlaktewater wordt gebracht, naast voorschriften die met het oog daarop nodig zijn, in ieder geval
      voorschriften inhoudende dat bedrijfsafvalwater slechts in een openbaar riool wordt gebracht, indien door de
      samenstelling, eigenschappen of hoeveelheid ervan:

      a. de doelmatige werking niet wordt belemmerd van een openbaar riool of de bij een zodanig openbaar riool behorende
      apparatuur,

      b. de verwerking niet wordt belemmerd van slib, verwijderd uit een openbaar riool, en

      c. de nadelige gevolgen voor de kwaliteit van een oppervlaktewaterlichaam zoveel mogelijk worden beperkt.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0007944/2010-10-01#Artikel2
    references:
      - id: ref1
