valid_to: '2008-12-23'
bwb_id: BWBR0008721
url: https://wetten.overheid.nl/BWBR0008721/2001-11-02
preamble:
  text: |-
    Overwegende dat het luchtvaartterrein Hoogeveen bij besluit van 3 mei 1996 (stcrt. 8 mei 1996) is aangewezen;

    Overwegende dat bij besluit van 3 mei 1996 (stcrt. 8 mei 1996) een geluidszone als bedoeld in de artikelen 25a, 25b
    en 25c van de Luchtvaartwet is vastgesteld voor het luchtvaartterrein Hoogeveen;

    Gelet op artikel 28 van de Luchtvaartwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0008721/2001-11-02#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Na overleg met de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer alsmede de besturen van de
      provincie Drenthe en de gemeenten Beilen, Hoogeveen, Ruinen en Westerbork;
    url: https://wetten.overheid.nl/BWBR0008721/2001-11-02#Artikel1
  - number: '1'
    text: |-
      Er is een Commissie als bedoeld in [artikel 28 eerste lid van de Luchtvaartwet][ref1] ingesteld bij het
      luchtvaartterrein Hoogeveen.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel28
    url: https://wetten.overheid.nl/BWBR0008721/2001-11-02#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '28'
  - number: '2'
    text: |-
      1 In de Commissie hebben zitting:

      a. één vertegenwoordiger van de provincie Drenthe;

      b. twee vertegenwoordigers van elke gemeente Beilen,

      Hoogeveen, Ruinen en Westerbork, waarvan tenminste één als vertegenwoordiger van in voornoemde gemeenten
      woonachtige omwonende van het luchtvaartterrein Hoogeveen kan worden beschouwd;

      c. ten hoogste twee vertegenwoordigers van de exploitant van het luchtvaartterrein Hoogeveen;

      d. ten hoogste twee vertegenwoordigers van de gebruikers van luchtvaartuigen, welke geregeld op het
      luchtvaartterrein Hoogeveen landen en daarvan opstijgen;

      e. ten hoogste twee door de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer aan te wijzen
      vertegenwoordigers;

      f. één vertegenwoordiger van rechtspersoonlijkheid bezittende milieuorganisaties;

      g. één vertegenwoordiger van het Ministerie van Verkeer en Waterstaat.

      2 De entiteiten als bedoeld in het eerste lid onder a tot en met g, kiezen elk hun vertegenwoordiger(s) en
      plaatsvervanger(s) en stellen de Minister van Verkeer en Waterstaat hiervan schriftelijk op de hoogte.

      3 De Commissie wijst uit haar midden een voorzitter aan.
    url: https://wetten.overheid.nl/BWBR0008721/2001-11-02#Artikel2
  - number: '3'
    text: |-
      De Commissie heeft tot taak:

      a. overleg te voeren en voorlichting te geven omtrent de milieuhygiëne rond het luchtvaartterrein Hoogeveen;

      b. door de Minister van Verkeer en Waterstaat te worden gehoord inzake de vaststelling van het
      handhavingsvoorschrift als bedoeld in [artikel 30a van de Luchtvaartwet][ref1];

      c. door de Minister van Verkeer en Waterstaat te worden gehoord inzake de vaststelling van het gebruiksplan als
      bedoeld in [artikel 30b van de Luchtvaartwet][ref2];

      d. door de Minister van Verkeer en Waterstaat te worden gehoord over alle maatregelen en voorschrfiten met gevolg
      voor de geluidsbelasting rond het luchtvaartterrein Hoogeveen alsmede over de wijze van handhaving van deze
      maatregelen en voorschriften;

      e. de Minister van Verkeer en Waterstaat ongevraagd voorstellen terzake te doen.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel30a
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel30b
    url: https://wetten.overheid.nl/BWBR0008721/2001-11-02#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 30a
      - id: ref2
        bwb_id: BWBR0002267
        artikel: 30b
  - number: '4'
    text: |-
      1 De Commissie stelt een huishoudelijk reglement vast met betrekking tot de uitvoering van haar taken.

      2 De Commissie stuurt jaarlijks vóór 15 februari aan de Minister van Verkeer en Waterstaat een door de Commissie
      vastgesteld verslag over de inhoud van haar werkzaamheden en de wijze waarop zij deze taken in het afgelopen
      kalenderjaar heeft uitgevoerd.

      3 De Commissie stelt jaarlijks een begroting vast voor het komende kalenderjaar en zendt deze uiterlijk vóór 1
      december van het jaar voorafgaande aan het jaar waarvoor de begroting is bedoeld ter goedkeuring aan de Minister
      van Verkeer en Waterstaat.

      4 De commissie zendt jaarlijks vóór 15 februari van ieder jaar aan de Minister van Verkeer en Waterstaat een
      verantwoording over de door de commissie bestede gelden van het voorafgaande kalenderjaar. Indien de bestedingen
      van de commissie een nader te bepalen bedrag te boven gaan dient de verantwoording te zijn voorzien van een
      accountantsverklaring.
    url: https://wetten.overheid.nl/BWBR0008721/2001-11-02#Artikel4
  - number: '5'
    text: 'De naam van deze Commissie luidt: ’Commissie milieuhygiëne luchtvaartterrein Hoogeveen’.'
    url: https://wetten.overheid.nl/BWBR0008721/2001-11-02#Artikel5
  - number: '6'
    text: |-
      Dit besluit zal worden geplaatst in de Staatscourant. Voorts zal dit besluit worden gezonden aan de Algemene
      Rekenkamer, Gedeputeerde Staten van de provincie Drenthe, de Colleges van Burgemeester en Wethouders van de
      gemeenten Beilen, Hoogeveen, Ruinen en Westerbork en de Minister van Volkshuisvesting, Ruimtelijke Ordening en
      Milieubeheer.
    url: https://wetten.overheid.nl/BWBR0008721/2001-11-02#Artikel6
