preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is, gelet op het karakter van de kinderbijslag, het
    kindgebonden budget, de nabestaandenuitkeringen en de vervolguitkering van de WGA-uitkering, te regelen dat deze
    worden aangepast aan het kostenniveau van een land waar een kind of de uitkeringsgerechtigde woont;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0031555/2013-01-01#ArtikelAanhef
articles:
  - number: V
    text: |-
      1 De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.

      2 Bij het vaststellen van het in het eerste lid genoemde tijdstip van inwerkingtreding wordt in acht genomen dat,
      indien het Staatsblad waarin deze wet wordt geplaatst, wordt uitgegeven na 31 december 2011, [artikel I][ref1]
      of [artikel IA][ref2] voor personen die voor de datum van uitgifte van genoemd Staatsblad recht op kinderbijslag
      hebben, in werking treedt met ingang van de eerste dag van het kalenderkwartaal die gelegen is minstens zes
      kalendermaanden na de datum van uitgifte van het Staatsblad waarin deze wet wordt geplaatst.

      3 Bij het vaststellen van het in het eerste lid genoemde tijdstip van inwerkingtreding wordt in acht
      genomen dat, indien het Staatsblad waarin deze wet wordt geplaatst, wordt uitgegeven na 31 december 2011 de
      [artikelen II][ref3] en [IV][ref4] voor personen die voor de datum van uitgifte van genoemd Staatsblad recht
      op een uitkering op grond van de [Algemene nabestaandenwet][ref5] respectievelijk een uitkering op grond van
      [artikel 62 van de Wet werk en inkomen naar arbeidsvermogen][ref6] hebben, in werking treden met ingang van de
      eerste dag van de kalendermaand die gelegen is minstens zes kalendermaanden na de datum van uitgifte van het
      Staatsblad waarin deze wet wordt geplaatst.


