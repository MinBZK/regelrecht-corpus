  text: |-
    Handelende in overeenstemming met de Pensioen- en Uitkeringsraad;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0006957/2011-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. de Minister: de Minister van Volksgezondheid, Welzijn en Sport;

      b. de Sociale verzekeringsbank: de Sociale verzekeringsbank, genoemd in
      [hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];

      c. een hulpverlener: een psychotherapeut, een psychiater of een klinisch psycholoog;

      d. een behandeling: een psychotherapeutische behandeling door een hulpverlener.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0006957/2011-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '6'
  - number: '2'
    text: |-
      De Sociale verzekeringsbank verstrekt een vergoeding in de kosten van een behandeling, indien:

      a. de aanvrager is verzekerd als bedoeld in [artikel 2, eerste lid, van de Zorgverzekeringswet][ref1];

      b. de behandeling niet volledig wordt vergoed door de zorgverzekeraar;

      c. de kosten van de behandeling op basis van een Diagnose Behandeling Combinatie bij de zorgverzekeraar in rekening
      zijn gebracht;

      d. de aanvrager woonachtig is in Nederland;

      e. de oorlogservaringen tijdens de Tweede Wereldoorlog van (een van) de ouders dan wel andere opvoeders van een
      zodanige invloed op de opvoeding van de aanvrager zijn geweest, dat de klachten van de aanvrager met een grote mate
      van waarschijnlijkheid met die oorlogservaringen van (een van) de ouders dan wel andere opvoeders in verband staan;

      f. de behandeling geïndiceerd is vanwege de onder e genoemde klachten, en

      g. de behandeling plaatsvindt door een hulpverlener die is ingeschreven in het krachtens
      [artikel 3 van de Wet op de beroepen in de individuele gezondheidszorg][ref2] ingestelde register van
      psychotherapeuten, artsen of gezondheidszorgpsychologen en het vereiste specialisme bezit om een behandeling te
      verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel3
    url: https://wetten.overheid.nl/BWBR0006957/2011-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '3'
  - number: 2a
    text: |-
      Aan deze regeling kan geen aanspraak worden ontleend door degene aan wie op grond van de
      [Wet buitengewoon pensioen 1940–1945][ref1], de [Wet uitkeringen vervolgingsslachtoffers 1940–1945][ref2] of
      de [Wet uitkeringen burger-oorlogsslachtoffers 1940–1945][ref3] reeds een vergoeding dan wel tegemoetkoming in de
      kosten van een behandeling is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002032
      [ref2]: https://wetten.overheid.nl/BWBR0002844
      [ref3]: https://wetten.overheid.nl/BWBR0003664
    url: https://wetten.overheid.nl/BWBR0006957/2011-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0002032
      - id: ref2
        bwb_id: BWBR0002844
      - id: ref3
        bwb_id: BWBR0003664
  - number: '3'
    text: |-
      Voor de beoordeling of voldaan is aan de in [artikel 2, onder c en d][ref1], genoemde voorwaarden alsmede omtrent
      de vaststelling van de geïndiceerde duur van de behandeling vraagt de Sociale verzekeringsbank een schriftelijk
      advies aan de psychiater of psychotherapeut/niet-psychiater, werkzaam bij de Centrale Vereniging Joodse Geestelijke
      Gezondheidszorg dan wel het Centrum '45, die tevens verbonden is aan het samenwerkingsverband Aanspreekpunt Na-
      oorlogse Generatie.


      [ref1]: https://wetten.overheid.nl/BWBR0006957#Artikel2
    url: https://wetten.overheid.nl/BWBR0006957/2011-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006957
        artikel: '2'
  - number: '4'
    text: |-
      De vergoeding, bedoeld in [artikel 2][ref1], wordt verleend voor de duur van de Diagnose Behandeling Combinatie die
      op de behandeling betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0006957#Artikel2
    url: https://wetten.overheid.nl/BWBR0006957/2011-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006957
        artikel: '2'
  - number: '5'
    text: |-
      1 De vergoeding, bedoeld in [artikel 2][ref1], bedraagt ten hoogste het op grond van
      [artikel 37 van de Wet marktordening gezondheidszorg][ref2] vastgestelde tarief, verminderd met de vergoeding van
      de zorgverzekeraar.

      2 De vergoeding wordt betaalbaar gesteld op grond van een door de aanvrager bij de Sociale verzekeringsbank in te
      dienen declaratie.


      [ref1]: https://wetten.overheid.nl/BWBR0006957#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel37
    url: https://wetten.overheid.nl/BWBR0006957/2011-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006957
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020078
        artikel: '37'
  - number: '6'
    text: De Sociale verzekeringsbank zendt de Minister een afschrift van de door hem genomen beschikking.
    url: https://wetten.overheid.nl/BWBR0006957/2011-01-01#Artikel6
  - number: '8'
    text: |-
      Deze regeling treedt in werking met ingang van 17 oktober 1994 en vervalt op een door de Minister te bepalen
      tijdstip.
    url: https://wetten.overheid.nl/BWBR0006957/2011-01-01#Artikel8
  - number: '9'
    text: |-
      Deze regeling kan worden aangehaald als: Tijdelijke vergoedingsregeling psychotherapie na-oorlogse generatie.

      Deze regeling zal met de toelichting in de Staatscourant worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0006957/2011-01-01#Artikel9
