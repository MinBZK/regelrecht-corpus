  text: |-
    Gelet op artikel 45, aanhef en tweede lid onder d, van het Luchtverkeersreglement;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0006881/1994-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De strand- en duingebieden van de eilanden Ameland, Texel en Schouwen-Duiveland, alsmede de strand- en duingebieden
      van Callantsoog tot Noordwijk aan Zee, met uitzondering van die gebieden die vallen binnen de plaatselijke
      luchtverkeersleidingsgebieden ‘De Kooy/Den Helder’ en ‘Valkenburg’ zijn aangewezen als strand- en duingebieden als
      bedoeld in [artikel 45, tweede lid onder d, van het LVR][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel45
    url: https://wetten.overheid.nl/BWBR0006881/1994-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '45'
  - number: '2'
    text: |-
      Vluchten met zweefvliegtuigen beneden de minimum VFR-vlieghoogte, boven de in [artikel 1][ref1] aangewezen strand-
      en duingebieden mogen slechts worden uitgevoerd indien:

        - de vluchten plaatsvinden gedurende het tijdvak van 15 oktober tot en met 14 mei van het jaar daaropvolgend;
        - de afstand tot personen en zaken minimaal 30 m bedraagt;
        - de afstand tot het strand en de duinen minimaal 5 m bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0006881#Artikel1
    url: https://wetten.overheid.nl/BWBR0006881/1994-09-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006881
        artikel: '1'
  - number: '3'
    text: |-
      Het besluit van de Directeur-Generaal van de Rijksluchtvaartdienst van 28 oktober 1982/nr. LVB/L 25483/
      Rijksluchtvaartdienst wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006881/1994-09-01#Artikel3
  - number: '4'
    text: |-
      Deze regeling treedt in werking met ingang van 1 september 1994.

      Deze regeling zal in de Staatscourant worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0006881/1994-09-01#Artikel4
