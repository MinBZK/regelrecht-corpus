  - number: '10'
    text: Gedeputeerde Staten zijn bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van deze wet.
    url: https://wetten.overheid.nl/BWBR0001892/2009-07-01#Artikel10
  - number: '11'
    text: |-
      [Artikel 8][ref1] is niet van toepassing:

      a. voor zooveel Gedeputeerde Staten tijdens de behandeling van een verzoek om vergunning toestaan, dat voorloopig
      met aanleg van een spoorweg wordt aangevangen of een spoorweg in stand wordt gehouden. Op hetgeen wordt toegestaan
      is [artikel 7][ref2] van toepassing;

      b. ten aanzien van spoorwegen, welke bij het in werking treden dezer wet in aanleg zijn of in stand worden gehouden
      met goedvinden van hen, die tot dat tijdstip bevoegd waren daaromtrent te beschikken. De te dier zake bestaande
      regelingen blijven van kracht, totdat zij worden vervangen door vergunningen, als bedoeld in [artikel 2][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001892#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0001892#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0001892#Artikel2
    url: https://wetten.overheid.nl/BWBR0001892/2009-07-01#Artikel11
