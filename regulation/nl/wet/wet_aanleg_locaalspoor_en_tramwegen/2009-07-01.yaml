preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het wenschelijk is voorschriften te geven omtrent aanleg en
    instandhouding van spoorwegen, waarop uitsluitend met beperkte snelheid wordt vervoerd, op wegen niet onder beheer
    van het Rijk;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001892/2009-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

      a. *spoorwegen* alle spoorwegen, ten aanzien waarvan eene door Ons of met Onze machtiging verleende concessie
      tot aanleg van en uitoefening van den dienst op den spoorweg van kracht is, en waarop ingevolge die concessie
      uitsluitend met beperkte snelheid wordt vervoerd;

      b. *wegen* alle openbare wegen met al hetgeen daartoe behoort, met uitzondering van de wegen onder beheer van het
      Rijk;

      c. *concessionaris* hij, die voorzien is van eene concessie, als bedoeld bij letter *a*.
    url: https://wetten.overheid.nl/BWBR0001892/2009-07-01#Artikel1
  - number: '2'
    text: |-
      1 Gedeputeerde Staten beschikken op verzoeken om vergunning tot aanleg en instandhouding of tot instandhouding van
      een spoorweg op wegen in hunne provincie.

      2 Op de voorbereiding van de beschikking is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.

      3 De kosten, voor de provincie uit toepassing van dit artikel voortvloeiende, worden haar door den concessionaris
      vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0001892/2009-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '5'
    text: |-
      1 De vergunning mag niet in strijd zijn met de concessie, bedoeld bij [artikel 1, letter ][ref1].

      2 Voor zooveel zoodanige strijd door wijziging van de concessie mocht ontstaan, dragen Gedeputeerde Staten zorg
      voor wijziging van de vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0001892#Artikel1
    url: https://wetten.overheid.nl/BWBR0001892/2009-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001892
        artikel: '1'
  - number: '6'
    text: |-
      Vordert de uitvoering van de vergunning eenige bemoeiing van gedeputeerde staten, van colleges van burgemeesters
      en wethouders onderscheidenlijk gemeenteraden of van besturen van waterschappen, dan wordt door deze besturen het
      daartoe noodige verricht.
    url: https://wetten.overheid.nl/BWBR0001892/2009-07-01#Artikel6
  - number: '7'
    text: |-
      1 Een ieder is verplicht te gedoogen, dat spoorwegen op wegen met inachtneming van een vergunning als bedoeld in
      [artikel 2][ref1], worden aangelegd en in stand gehouden.

      2 De schade, welke daaruit voor de beheerders der wegen of voor andere daarop recht hebbenden mocht voortvloeien,
      wordt hun door den concessionaris vergoed.

      3 De vordering daartoe moet worden ingesteld voor den rechter van het kanton, of, ter keuze van den eischer, van
      een der kantons, waarin de weg is gelegen.

      4 Van de uitspraak van den kantonrechter is hooger beroep toegelaten.

      5 De bepalingen, voor burgerlijke twistgedingen geldende, zijn op de twistgedingen, bij dit artikel bedoeld, van
      toepassing, voor zooveel daarvan bij het derde en vierde lid niet is afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0001892#Artikel2
    url: https://wetten.overheid.nl/BWBR0001892/2009-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001892
        artikel: '2'
  - number: '8'
    text: |-
      1 Met hechtenis van ten hoogste *twaalf dagen* of geldboete van de eerste categorie wordt gestraft hij, die een
      spoorweg op een weg aanlegt of in stand houdt zonder vergunning of anders dan met inachtneming van een vergunning
      als bedoeld in [artikel 2][ref1].

      2 Met hechtenis van ten hoogste *twaalf dagen* of geldboete van de eerste categorie wordt gestraft hij, die in
      strijd handelt met de verplichting in het [eerste lid van artikel 7][ref2] omschreven.

      3

      4 De bij dit artikel strafbaar gestelde feiten worden beschouwd als overtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0001892#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001892#Artikel7
    url: https://wetten.overheid.nl/BWBR0001892/2009-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001892
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001892
        artikel: '7'
  - number: '9'
    text: |-
      Met de opsporing van de bij deze wet strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref1], belast de hoofdingenieurs, ingenieurs, adjunct-
      ingenieurs, hoofdopzichters en opzichters van de provinciale waterstaat. Deze ambtenaren zijn tevens belast
      met de opsporing van de feiten, strafbaar gesteld in de [artikelen 179][ref2] tot en met [182][ref3] en
      [184 van het Wetboek van Strafrecht][ref4], voor zover deze feiten betrekking hebben op een bevel, vordering of
      handeling, gedaan of ondernomen door henzelf.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel182
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0001892/2009-07-01#Artikel9
    references:
