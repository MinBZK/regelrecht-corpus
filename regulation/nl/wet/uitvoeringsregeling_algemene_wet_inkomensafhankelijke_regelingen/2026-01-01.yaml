      1 Indien een voorschot op de tegemoetkoming is verleend en zich in het berekeningsjaar een wijziging van de
      omstandigheden voordoet waarmee bij het verlenen van het voorschot geen rekening is gehouden en die leidt tot
      beëindiging dan wel verlaging van de tegemoetkoming doet de belanghebbende, zijn partner of een medebewoner daarvan
      binnen vier weken schriftelijk dan wel elektronisch mededeling aan de Dienst Toeslagen.

      2 De wijzigingen, bedoeld in het eerste lid, zijn:

      a. het ontstaan van partnerschap op grond van
      [artikel 5a, eerste lid, aanhef en onderdeel b, van de Algemene wet inzake rijksbelastingen][ref1] of
      [artikel 3, tweede lid, aanhef en onderdelen b, c en d, van de wet][ref2];

      b. het eindigen van partnerschap op grond van
      [artikel 5a, vierde lid, aanhef en onderdeel a, van de Algemene wet inzake rijksbelastingen][ref3];

      c. een verhoging van een geschat toetsingsinkomen die leidt tot een verlaging van de tegemoetkoming over het
      berekeningsjaar met meer dan € 500;

      d. een verhoging van een geschat vermogen waardoor over het berekeningsjaar geen aanspraak op een tegemoetkoming
      bestaat;

      e. het eindigen van een vermissing als bedoeld in [artikel 3c, eerste lid, onderdeel a, van de wet][ref4];

      f. het eindigen van de tenuitvoerlegging van een bevel tot gevangenneming of gevangenhouding als bedoeld in
      [artikel 3c, eerste lid, onderdeel b, van de wet][ref5];

      g. het eindigen van de uitvoering van een vrijheidsbenemende straf of maatregel als bedoeld in
      [artikel 3c, eerste lid, onderdeel b, van de wet][ref6], die buiten Nederland heeft plaatsgevonden;

      h. het vervroegd eindigen van de uitvoering van een vrijheidsbenemende straf of maatregel als bedoeld in
      [artikel 3c, eerste lid, onderdeel b, van de wet][ref7].

      3 Indien er een voorschot huurtoeslag is verleend, wordt als een omstandigheid als bedoeld in het eerste lid tevens
      aangemerkt:

      a. een wijziging in de huurprijs;

      b. het aangaan van of het beëindigen van een huurcontract, waaronder begrepen een schriftelijke overeenkomst als
      bedoeld in [artikel 2, eerste lid, onderdeel e, onder 2°, van de wet][ref8];

      c. een verandering van verhuurder.

      4 Indien er een voorschot zorgtoeslag is verleend, wordt als een omstandigheid als bedoeld in het eerste lid
      tevens aangemerkt de beëindiging van de zorgverzekering of een opschorting van die verzekering als bedoeld in
      [artikel 24 van de Zorgverzekeringswet][ref9].

      5 Indien er een voorschot kinderopvangtoeslag is verleend, wordt als een omstandigheid als bedoeld in het eerste
      lid tevens aangemerkt:

      a. een wijziging in het aantal uren kinderopvang van een kind van de belanghebbende of van zijn partner;

      b. een wijziging in het soort genoten kinderopvang door een kind van de belanghebbende of van zijn partner;

      c. een wijziging van het geregistreerde kindercentrum of geregistreerde gastouderbureau;

      d. een wijziging in de uurprijs.

      6 In afwijking in zoverre van het eerste lid kan van een wijziging als bedoeld in het tweede lid, onderdeel c,
      alsmede van wijzigingen die leiden tot een beëindiging van het voorschot op de tegemoetkoming ook telefonisch dan
      wel anderszins mondeling mededeling worden gedaan aan de Dienst Toeslagen.


