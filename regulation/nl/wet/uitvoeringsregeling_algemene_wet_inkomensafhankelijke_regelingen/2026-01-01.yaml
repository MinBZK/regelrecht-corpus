    text: |-
      1 Op verzoek van de belanghebbende blijft [artikel 7, derde en vierde lid, van de wet][ref1],
      [artikel 3, eerste lid, van de Wet op de zorgtoeslag][ref2] of
      [artikel 1, vierde lid van de Wet op het kindgebonden budget][ref3] buiten toepassing indien wel
      aanspraak op huurtoeslag, zorgtoeslag, onderscheidenlijk kindgebonden budget, zou bestaan indien ten
      aanzien van de belanghebbende, zijn partner of een medebewoner de rendementsgrondslag, bedoeld in
      [artikel 5.3 van de Wet inkomstenbelasting 2001][ref4], zou worden verminderd met:

      a. bezittingen die zijn opgekomen:

      1°. van de zijde van een pleegkind;

      2°. van de zijde van een kind en waarover zowel de belanghebbende, diens partner, een eventuele medebewoner, alsook
      het kind niet kan beschikken;

      b. een bedrag ter grootte van de navolgende eenmalige uitkeringen die in het berekeningsjaar of in
      enig eerder jaar zijn ontvangen, waaronder mede begrepen de daarmee samenhangende rente, bedoeld in
      [artikel 4:98 van de Algemene wet bestuursrecht][ref5]:

      1°. immateriële schadevergoedingen die zijn toegekend voor 1 januari 2024;

      2°. schadevergoedingen die door de overheid, het Nederlandse Rode Kruis, of fabrikanten van farmaceutische
      producten zijn betaald aan hemofiliepatiënten die met het aids-virus zijn besmet;

      3°. vergoedingen ingevolge de [Regeling tegemoetkoming asbestslachtoffers][ref6] zoals deze luidde op 31 maart 2014
      of de [Regeling tegemoetkoming asbestslachtoffers 2014][ref7];

      4°. uitkeringen van de Stichting Maror-gelden Overheid, opgericht op 1 december 2000, gevestigd te Amsterdam;

      5°. uitkeringen van de Stichting Het Gebaar, opgericht op 19 november 2001, gevestigd te ’s-Gravenhage;

      6°. uitkeringen van de Stichting Rechtsherstel Sinti en Roma, opgericht op 3 november 2000, gevestigd te Tilburg;

      7°. uitkeringen van de Stichting Joods Humanitair Fonds, opgericht op 31 januari 2002, gevestigd te ’s-Gravenhage;

      8°. uitkeringen van de Stichting Individuele Maror Gelden, opgericht op 1 december 2000, gevestigd te Amsterdam;

      9°. uitkeringen van de Stichting Individuele Verzekeringsaanspraken Sjoa, opgericht op 22 november 1999, gevestigd
      te ’s-Gravenhage;

      10°. uitkeringen van de Stichting Individuele Bankaanspraken Sjoa, opgericht op 11 maart 2002, gevestigd te ’s-
      Gravenhage;

      11°. uitkeringen van de Stichting Individuele Effectenaanspraken Sjoa, opgericht op 22 november 1999, gevestigd te
      ’s-Gravenhage;

      12°. uitkeringen uit het DES-Fonds die zijn verstrekt aan slachtoffers van het gebruik van DES-preparaten;

      13°. tegemoetkomingen op grond van de Regeling tegemoetkoming financiële gevolgen in verband met functionele
      invaliditeit nieuwjaarsbrand Volendam (Stcrt. 2003, 42) en bijdragen op grond van de Regeling tegemoetkoming in
      kosten nieuwjaarsbrand Volendam II (Stcrt. 2004, 188), uitgekeerd aan de getroffenen zelf;

      14°. vergoedingen op grond van de compensatieregeling van de Rooms-Katholieke Kerk Nederland voor slachtoffers van
      seksueel misbruik;

      15°. bijzondere uitkeringen van het Ministerie van Defensie op grond van
      [artikel 21a van het Besluit aanvullende arbeidsongeschiktheids- en invaliditeitsvoorzieningen][ref8] of op grond
      van [artikel 21a van het Besluit bijzondere militaire pensioenen][ref9];

      16°. uitkeringen op grond van de Tijdelijke regeling uitkeringen seksueel misbruik minderjarigen in instellingen en
      pleeggezinnen of op grond van de civiele regeling die de Staat voor deze groep van slachtoffers heeft opgesteld;

      17°. uitkeringen van een voorschot op een persoonsgebonden budget als bedoeld in
      [paragraaf 2.6 van de Regeling subsidies AWBZ][ref10], die betrekking hebben op een in het kalenderjaar 2012 of
      in het kalenderjaar 2013 gelegen subsidieperiode voor zover deze zijn gedaan vóór 1 januari van het betreffende
      kalenderjaar;

      18°. uitkeringen op grond van de [Uitkeringsregeling Backpay][ref11].

      2 Op verzoek van de belanghebbende blijft [artikel 3, eerste lid, van de Wet op de zorgtoeslag][ref12] of
      [artikel 1, vierde lid, van de Wet op het kindgebonden budget][ref13] buiten toepassing indien wel aanspraak op
      zorgtoeslag, onderscheidenlijk kindgebonden budget, zou bestaan indien ten aanzien van de belanghebbende of zijn
      partner de rendementsgrondslag, bedoeld in [artikel 5.3 van de Wet inkomstenbelasting 2001][ref14], zou worden
      verminderd met een bedrag ter grootte van een in het berekeningsjaar of in enig eerder jaar ontvangen eenmalige
      uitkering:

      a. die een schadevergoeding vormt voor een letselschade; en

      b. waarvan de hoogte is vastgelegd in een overeenkomst of rechterlijke uitspraak die is gedateerd voor 11 oktober
      2010, dan wel, indien de uitkering op andere grond tot stand is gekomen, de hoogte is vastgesteld voor 11 oktober
      2010.

      3 Het eerste lid, onderdeel b, onder 3° tot en met 11°, is eveneens van toepassing ingeval de genoemde uitkeringen
      of tegemoetkomingen zijn verstrekt aan nabestaanden van de gerechtigden.

      4 Een verzoek als bedoeld in het eerste en tweede lid wordt geacht mede te zijn gedaan voor de op het
      berekeningsjaar waarop het verzoek betrekking heeft volgende berekeningsjaren waarop het verzoek om toepassing van
      een vermogenstoetsuitzondering betrekking kan hebben.


