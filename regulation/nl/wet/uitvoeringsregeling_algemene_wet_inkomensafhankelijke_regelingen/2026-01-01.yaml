  - number: 9quater
    text: |-
      1 [Artikel 7, derde en vierde lid, van de wet][ref1], [artikel 3, eerste lid, van de Wet op de zorgtoeslag][ref2]
      of [artikel 1, vierde lid, van de Wet op het kindgebonden budget][ref3] blijft buiten toepassing indien
      wel aanspraak op huurtoeslag, zorgtoeslag, onderscheidenlijk kindgebonden budget, zou bestaan indien
      ten aanzien van de belanghebbende, zijn partner of een medebewoner de rendementsgrondslag, bedoeld in
      [artikel 5.3 van de Wet inkomstenbelasting 2001][ref4], zou worden verminderd met de waarde van een bezitting als
      bedoeld in artikel 5.3 van de Wet inkomstenbelasting 2001 die is verkregen als gevolg van en met inbegrip van de
      daarmee samenhangende rente, bedoeld in [artikel 4:98 van de Algemene wet bestuursrecht][ref5]:

      a. het verlagen of op nihil vaststellen van een terug te vorderen bedrag kinderopvangtoeslag in bijzondere
      omstandigheden vanwege de onevenredigheid van de nadelige gevolgen van een voor 23 oktober 2019 genomen beschikking
      tot vaststelling of tot terugvordering kinderopvangtoeslag in verhouding tot de met die beschikking te dienen
      doelen;

      b. een herziening van een op 23 oktober 2019 onherroepelijk vaststaande beschikking tot terugvordering
      kinderopvangtoeslag, in bijzondere omstandigheden vanwege de onevenredigheid van de nadelige gevolgen van deze
      beschikking in verhouding tot de met de beschikking te dienen doelen, indien die beschikking tot terugvordering
      betrekking heeft op een berekeningsjaar waarover ten minste € 1.500 aan kinderopvangtoeslag is teruggevorderd;

      c. een herziening van een op 23 oktober 2019 onherroepelijk vaststaande beschikking tot toekenning
      kinderopvangtoeslag waarbij het recht op kinderopvangtoeslag wordt vastgesteld naar rato van het bedrag van
      de kosten van kinderopvang waarvan aannemelijk is dat het tijdig is betaald, indien de naar rato vaststelling
      betrekking heeft op een berekeningsjaar waarover het recht op kinderopvangtoeslag met ten minste € 1.500 is
      verlaagd;

      d. een toegekende hardheidstegemoetkoming als bedoeld in artikel 49, eerste lid, van de wet, zoals dat luidde op
      25 januari 2021;

      e. een toegekende bijzondere tegemoetkoming als bedoeld in [artikel 2.9 van de Wet hersteloperatie toeslagen][ref6];

      f. een toegekende compensatie of aanvullende compensatie als bedoeld in de
      [artikelen 2.1, eerste of derde lid][ref7], of [2.14h, eerste lid, van de Wet hersteloperatie toeslagen][ref8];

      g. een toegekende O/GS-tegemoetkoming als bedoeld in
      [artikel 2.6, eerste lid, van de Wet hersteloperatie toeslagen][ref9];

      h. een toegekende aanvullende tegemoetkoming voor de werkelijke schade als bedoeld in
      [artikel 2.6, derde lid, van de Wet hersteloperatie toeslagen][ref10];

      i. een toegekende eenmalige tegemoetkoming als bedoeld in [artikel 49g, eerste lid, van de wet][ref11], zoals dat
      luidde op 25 januari 2021;

      j. een toegekende noodvoorziening als bedoeld in de [artikelen 2.8, eerste lid][ref12], [2.14i][ref13] of
      [2.18, eerste lid, van de Wet hersteloperatie toeslagen][ref14];

      k. een toegekend forfaitair bedrag als bedoeld in
      [artikel 2.7, eerste lid, van de Wet hersteloperatie toeslagen][ref15], voor zover dat bedrag niet is toegekend aan
      de partner of voormalige partner van de belanghebbende;

      l. een compensatie naar aanleiding van hardheid als bedoeld in
      [artikel 2.5 van de Wet hersteloperatie toeslagen][ref16];

      m. een toegekend bedrag als bedoeld in [artikel 2.7, tweede lid, van de Wet hersteloperatie toeslagen][ref17];

      n. een tegemoetkoming als bedoeld in [artikel 2.12 van de Wet hersteloperatie toeslagen][ref18];

      o. een tegemoetkoming op grond van [afdeling 2.5 van de Wet hersteloperatie toeslagen][ref19];

      p. een toegekende tegemoetkoming als bedoeld in de [artikelen 2.14c, eerste lid][ref20], [2.14d][ref21], en
      [2.14e, eerste lid, van de Wet hersteloperatie toeslagen][ref22];

      q. een toegekend bedrag op grond van een voorziening als bedoeld in de [artikelen 2.9a, eerste lid][ref23], of
      [2.9b, eerste lid, van de Wet hersteloperatie toeslagen][ref24];

      r. een toegekende aanvullende compensatie of toegekende aanvullende O/GS-tegemoetkoming als bedoeld in de
      [artikelen 2.9a, tweede lid][ref25], of [2.9b, tweede lid, van de Wet hersteloperatie toeslagen][ref26].

      2 Op verzoek van de belanghebbende is het eerste lid van overeenkomstige toepassing ten aanzien van een bezitting
      als bedoeld in [artikel 5.3 van de Wet inkomstenbelasting 2001][ref27]:

      a. die is verkregen als gevolg van de feitelijke toebedeling aan de belanghebbende van
      een aan de voormalige partner van de belanghebbende toegekend bedrag als bedoeld in
      [artikel 2.7, eerste of tweede lid, van de Wet hersteloperatie toeslagen][ref28] of compensatie als
      bedoeld in [artikel 2.14h, eerste lid, van die wet][ref29] en de daarmee samenhangende rente, bedoeld in
      [artikel 4:98 van de Algemene wet bestuursrecht][ref30]; of

      b. die is opgekomen van de zijde van een kind als gevolg van een tegemoetkoming als bedoeld in
      [artikel 2.12 van de Wet hersteloperatie toeslagen][ref31] en de daarmee samenhangende rente, bedoeld in
      [artikel 4:98 van de Algemene wet bestuursrecht][ref32].

      3 De vermogenstoetsuitzonderingen, bedoeld in het eerste en tweede lid, gelden uitsluitend over de eerste tien
      berekeningsjaren volgend op het kalenderjaar waarin de bezitting verkregen werd. Een verzoek als bedoeld in het
      tweede lid wordt geacht mede te zijn gedaan voor de op het berekeningsjaar waarop het verzoek betrekking heeft
      volgende berekeningsjaren waarover de vermogenstoetsuitzonderingen kunnen gelden.

      4 Voor de toepassing van dit artikel wordt onder een bezitting mede verstaan de afname van een schuld als bedoeld
      in [artikel 5.3 van de Wet inkomstenbelasting 2001][ref33].


