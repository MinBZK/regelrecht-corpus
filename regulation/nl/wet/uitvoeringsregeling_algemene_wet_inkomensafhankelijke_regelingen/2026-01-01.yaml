      Deze regeling geeft uitvoering aan de [artikelen 6, tweede en derde lid][ref1],
      [17, tweede lid][ref2], [21a][ref3], [25, tweede lid][ref4], [26, derde lid][ref5],
      [31][ref6], [47][ref7] en [47a van de Algemene wet inkomensafhankelijke regelingen][ref8] en
      [artikel 2a van het Uitvoeringsbesluit Algemene wet inkomensafhankelijke regelingen][ref9].


