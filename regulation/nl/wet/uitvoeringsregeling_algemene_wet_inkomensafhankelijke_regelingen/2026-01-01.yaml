      1 Op verzoek van de belanghebbende blijft [artikel 7, derde en vierde lid, van de wet][ref1],
      [artikel 3, eerste lid, van de Wet op de zorgtoeslag][ref2] of
      [artikel 1, vierde lid, van de Wet op het kindgebonden budget][ref3] buiten toepassing indien wel
      aanspraak op huurtoeslag, zorgtoeslag, onderscheidenlijk kindgebonden budget, zou bestaan indien ten
      aanzien van de belanghebbende, zijn partner of een medebewoner de rendementsgrondslag, bedoeld in
      [artikel 5.3 van de Wet inkomstenbelasting 2001][ref4], zou worden verminderd met een bedrag ter grootte
      van de volgende aangewezen toekenningen, waaronder mede begrepen de daarmee samenhangende rente, bedoeld in
      [artikel 4:98 van de Algemene wet bestuursrecht][ref5]:

      a. een financiële ondersteuning aan zorgmedewerkers in verband met langdurige post-COVID klachten die is toegekend
      op grond van de [Regeling zorgmedewerkers met langdurige post-COVID klachten][ref6];

      b. een tegemoetkoming die is toegekend op grond van de
      [Regeling tegemoetkoming stoffengerelateerde beroepsziekten][ref7] of de
      [Regeling tegemoetkoming niet-loondienstgerelateerde slachtoffers van mesothelioom en asbestose][ref8];

      c. een schadevergoeding die na vaststelling van de schade door de Stichting Vergoeding schade slachtoffers
      schietincident Alphen aan den Rijn is toegekend aan de overlevenden en nabestaanden van het schietincident in
      Alphen aan den Rijn op 9 april 2011;

      d. een eenmalige uitkering van immateriële schadevergoeding die is toegekend vanaf 1 januari 2024;

      e. een eenmalig bedrag dat is toegekend op grond van het
      [Tijdelijk besluit eenmalig bedrag ouderen van Surinaamse herkomst][ref9];

      f. een compensatie of aanvullende compensatie die is toegekend op grond van de
      [Wet compensatie wegens selectie aan de poort][ref10].

      2 Het verzoek kan uitsluitend betrekking hebben op de aanspraak op huurtoeslag, zorgtoeslag of kindgebonden budget
      over de eerste tien berekeningsjaren volgend op het kalenderjaar waarin de bezitting werd verkregen.

      3 Het verzoek wordt geacht mede te zijn gedaan voor de op het berekeningsjaar waarop het verzoek betrekking heeft
      volgende berekeningsjaren, voor zover het verzoek ingevolge het tweede lid op deze berekeningsjaren betrekking
      kan hebben.


