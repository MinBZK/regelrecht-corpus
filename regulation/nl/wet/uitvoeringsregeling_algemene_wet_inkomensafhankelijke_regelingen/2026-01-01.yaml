  - number: 9c
    text: |-
      De Dienst Toeslagen kan ondersteuning verlenen bij het verwezenlijken van rechten of het nakomen
      van verplichtingen die voortvloeien uit de [wet][ref1], de daarop berustende bepalingen of een
      inkomensafhankelijke regeling. Deze ondersteuning vindt plaats in het algemeen belang als bedoeld in
      [artikel 25h, vijfde lid, van de Mededingingswet][ref2]. Onder ondersteuning wordt in ieder geval verstaan:

      a. het ter beschikking stellen van middelen voor het verwezenlijken van rechten en nakomen van verplichtingen,
      bedoeld in de eerste zin, en

      b. het ondersteunen, onder meer met de middelen, bedoeld in onderdeel a, van partijen die hulp bieden bij het
      verwezenlijken van rechten en nakomen van verplichtingen, bedoeld in de eerste zin, voor zover die partijen geen
      vergoeding vragen voor het bieden van die hulp.


      [ref1]: https://wetten.overheid.nl/BWBR0018472
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel25h
    url: https://wetten.overheid.nl/BWBR0019237/2026-01-01#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0018472
      - id: ref2
        bwb_id: BWBR0008691
        artikel: 25h
  - number: 9d
    text: |-
      [Artikel 9a, onderdeel c][ref1], zoals dat luidde op 31 december 2025 blijft van toepassing met betrekking tot
      beschikkingen die zien op de berekeningsjaren voorafgaand aan het berekeningsjaar 2026.


      [ref1]: https://wetten.overheid.nl/BWBR0019237#Artikel9a
    url: https://wetten.overheid.nl/BWBR0019237/2026-01-01#Artikel9d
