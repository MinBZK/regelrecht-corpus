    text: |-
      1 Op verzoek van de belanghebbende blijft [artikel 7, derde en vierde lid, van de wet][ref1],
      [artikel 3, eerste lid, van de Wet op de zorgtoeslag][ref2] of
      [artikel 1, vierde lid, van de Wet op het kindgebonden budget][ref3] buiten toepassing indien wel
      aanspraak op huurtoeslag, zorgtoeslag, onderscheidenlijk kindgebonden budget, zou bestaan indien ten
      aanzien van de belanghebbende, zijn partner of een medebewoner de rendementsgrondslag, bedoeld in
      [artikel 5.3 van de Wet inkomstenbelasting 2001][ref4], zou worden verminderd met een bedrag ter grootte
      van de volgende aangewezen toekenningen, waaronder mede begrepen de daarmee samenhangende rente, bedoeld in
      [artikel 4:98 van de Algemene wet bestuursrecht][ref5]:

      a. een eenmalige aanvullende financiële bijdrage die is toegekend door de Stichting Zorg na Werk in Coronazorg;

      b. een eenmalige uitkering die is toegekend op grond van de
      [Tijdelijke Regeling eenmalige uitkering Dutchbat-III-veteranen][ref6];

      c. een schadevergoeding die is toegekend door de Commissie Uitvoering civielrechtelijke regeling Srebrenica,
      bedoeld in het [Instellingsbesluit Commissie Uitvoering civielrechtelijke regeling Srebrenica][ref7];

      d. een eenmalige tegemoetkoming die is toegekend op grond van de
      [Beleidsregel tegemoetkoming Wet wijziging geregistreerd geslacht 1985-2014][ref8].

      2 Het verzoek kan uitsluitend betrekking hebben op de aanspraak op huurtoeslag, zorgtoeslag of kindgebonden budget
      over de eerste drie berekeningsjaren volgend op het kalenderjaar waarin de bezitting werd verkregen.

      3 Het verzoek wordt geacht mede te zijn gedaan voor de op het berekeningsjaar waarop het verzoek betrekking heeft
      volgende berekeningsjaren, voor zover het verzoek ingevolge het tweede lid op deze berekeningsjaren betrekking
      kan hebben.


