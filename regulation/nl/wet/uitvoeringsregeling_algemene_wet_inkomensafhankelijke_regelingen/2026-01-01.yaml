  - number: '2'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *huurtoeslag:* een tegemoetkoming op grond van de [Wet op de huurtoeslag][ref1];

      b. *kinderopvangtoeslag:* een tegemoetkoming op grond van de [Wet kinderopvang][ref2];

      c. *kindgebonden budget:* een tegemoetkoming op grond van de [Wet op het kindgebonden budget][ref3];

      d. *wet:* [Algemene wet inkomensafhankelijke regelingen][ref4];

      e. *zorgtoeslag:* een tegemoetkoming op grond van de [Wet op de zorgtoeslag][ref5].


