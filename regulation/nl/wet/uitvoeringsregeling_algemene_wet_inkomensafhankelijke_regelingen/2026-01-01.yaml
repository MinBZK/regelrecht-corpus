      1 Iemand die niet in Nederland woont, wordt geacht op zijn woonadres te zijn ingeschreven in een naar aard en
      strekking met de basisregistratie personen overeenkomende registratie buiten Nederland, indien:

      a. hij vanwege zijn functie of vanwege de functie van een van de tot zijn huishouden behorende personen niet kan
      of niet hoeft te worden ingeschreven in een naar aard en strekking met de basisregistratie personen overeenkomende
      registratie buiten Nederland;

      b. blijkt dat hij niet woont op het adres waarop hij is ingeschreven in de bevolkingsregistratie in zijn woonland;

      c. zijn woonland geen of geen naar aard en strekking met de basisregistratie personen overeenkomende registratie
      voert.

      2 Iemand die in de basisregistratie personen niet op zijn woonadres is ingeschreven, wordt geacht daarin wel op dat
      adres te zijn ingeschreven, indien:

      a. hij een vreemdeling is als bedoeld in [artikel 9, tweede lid, van de wet][ref1];

      b. hij of een tot zijn huishouden behorende persoon op grond van
      [artikel 21, eerste lid, van het Besluit basisregistratie personen][ref2] in verband met zijn bijzondere
      verblijfsrechtelijke status niet in aanmerking komt voor inschrijving, met dien verstande dat voor degenen die zijn
      opgenomen in de door het Ministerie van Buitenlandse Zaken gevoerde Protocollaire Basisadministratie, het in deze
      administratie opgenomen woonadres geldt;

      c. blijkt dat sprake is van een onjuiste inschrijving in de basisregistratie personen voor de periode tot aan de
      datum van adreswijziging, bedoeld in [artikel 2.20, derde lid, van de Wet basisregistratie personen][ref3];

      d. hij zich binnen 5 dagen na de aanvang van zijn verblijf op zijn woonadres heeft laten inschrijven in de
      basisregistratie personen.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0034306#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0033715#Artikel2.20
