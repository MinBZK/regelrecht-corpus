  - number: 9a
    text: |-
      Indien de Dienst Toeslagen overeenkomstig artikel 6 van Verordening (EG) nr. 987/2009 van het Europees Parlement
      en de Raad van 16 september 2009 tot vaststelling van de wijze van toepassing van Verordening (EG) nr. 883/2004
      betreffende de coördinatie van de socialezekerheidsstelsels (PbEU 2009, L 284) retroactief als bevoegd orgaan is
      aangemerkt:

      a. wordt de belanghebbende geacht tijdig een aanvraag te hebben gedaan als bedoeld in
      [artikel 15 van de wet][ref1];

      b. worden de in [artikel 19 van de wet][ref2] genoemde beslissingstermijnen voor toekenning van de tegemoetkoming
      verlengd met de tijd gedurende welke een orgaan in een andere lidstaat aangewezen is geweest als voorlopig bevoegd
      orgaan;

      c. wordt de in [artikel 21, tweede lid][ref3], van de wet genoemde termijn en de in
      [artikel 5a, eerste lid, onderdeel a][ref4], genoemde termijn verlengd met de tijd gedurende welk een orgaan in een
      andere lidstaat aangewezen is geweest als voorlopig bevoegd orgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0018472#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0018472#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0019237#Artikel5a
    url: https://wetten.overheid.nl/BWBR0019237/2026-01-01#Artikel9a
