  - number: 5a
    text: |-
      1 De Dienst Toeslagen herziet in het voordeel van de belanghebbende een toegekende of herziene tegemoetkoming die
      onherroepelijk is geworden zodra de Dienst Toeslagen is gebleken dat die tegemoetkoming op een te laag bedrag is
      vastgesteld, tenzij:

      a. vijf jaren zijn verstreken na de laatste dag van het berekeningsjaar waarop de tegemoetkoming betrekking heeft
      en de belanghebbende niet binnen een jaar na de dagtekening van de beschikking tot toekenning om herziening heeft
      verzocht;

      b. de onjuistheid van de tegemoetkoming voortvloeit uit jurisprudentie die eerst is gewezen nadat die
      tegemoetkoming onherroepelijk vast is komen te staan, tenzij de Minister van Financiën, zonodig in overeenstemming
      met de Ministers die het aangaat, anders heeft bepaald;

      c. de onjuistheid van de tegemoetkoming voortvloeit uit beleidsregels van de Minister van Financiën of van de
      Ministers die het aangaat, die eerst zijn uitgevaardigd nadat die tegemoetkoming onherroepelijk vast is komen te
      staan, tenzij de Minister van Financiën, zonodig in overeenstemming met de Ministers die het aangaat, anders heeft
      bepaald;

      d. de onjuistheid van de tegemoetkoming voortvloeit uit de omstandigheid dat eerst nadat die tegemoetkoming
      onherroepelijk vast is komen te staan een beroep wordt gedaan op een faciliteit, waarop een beroep moet worden
      gedaan op een eerder wettelijk voorgeschreven moment; of

      e. sprake is van enig feit waardoor de tegemoetkoming op een te laag bedrag is vastgesteld en een andere
      tegemoetkoming, al dan niet van dezelfde belanghebbende, ter zake van datzelfde feit op een te hoog bedrag is
      vastgesteld en ter zake daarvan niet is of kan worden teruggevorderd, met dien verstande dat in dat geval wel in
      het voordeel van belanghebbende wordt herzien voor zover het te laag vastgestelde bedrag van de tegemoetkoming het
      te hoog vastgestelde bedrag van de andere tegemoetkoming dat niet is of kan worden teruggevorderd te boven gaat.

      2 De Dienst Toeslagen herziet onder bijzondere omstandigheden, onder overeenkomstige toepassing van het eerste
      lid, onderdelen a tot en met c, in het voordeel van de belanghebbende een beschikking tot terugvordering die
      onherroepelijk is geworden voor zover de nadelige gevolgen van die beschikking onevenredig zijn in verhouding tot
      de met die beschikking te dienen doelen.
    url: https://wetten.overheid.nl/BWBR0019237/2026-01-01#Artikel5a
  - number: '6'
    text: |-
      1 Als gevallen als bedoeld in [artikel 25, derde lid, van de wet][ref1] worden aangewezen uitbetalingen door de
      Dienst Toeslagen:

      a. van kinderopvangtoeslag op de bankrekening van een onderneming als bedoeld in de
      [Handelsregisterwet 2007][ref2], die een of meerdere kindercentra of een of meerdere gastouderbureaus exploiteert,
      als bedoeld in [artikel 1.1, eerste lid, van de Wet kinderopvang en kwaliteitseisen peuterspeelzalen][ref3];

      b. van huurtoeslag op de bankrekening van een toegelaten instelling, als bedoeld in
      [artikel 19 van de Woningwet][ref4];

      c. van zorgtoeslag op de bankrekening van een zorgverzekeraar, als bedoeld in
      [artikel 1, onderdeel b, van de Zorgverzekeringswet][ref5];

      voor zover de onderneming, instelling of zorgverzekeraar voor dit doel een convenant heeft afgesloten met de Dienst
      Toeslagen.

      2 Als gevallen als bedoeld in [artikel 25, derde lid, van de wet][ref6] worden voorts aangewezen uitbetalingen door
      de Dienst Toeslagen op de bankrekening:

      a. van een lid van de Nederlandse Vereniging voor Volkskrediet voor zover de uitbetaling plaatsvindt in het
      kader van de uitvoering van een schuldregelingsovereenkomst in de zin van de Gedragscode Schuldregeling of een
      overeenkomst tot budgetbeheer in de zin van de Gedragscode Budgetbeheer;

      b. van een gemeente op grond van een schuldregelingsovereenkomst in de zin van de Gedragscode Schuldregeling of
      een overeenkomst tot budgetbeheer in de zin van de Gedragscode Budgetbeheer van de Nederlandse Vereniging voor
      Volkskrediet of overeenkomsten met dezelfde strekking;

      c. van een derde die:

      1°. een subsidiebeschikking heeft ontvangen van een gemeente dan wel een overeenkomst heeft met een Wlz-uitvoerder
      voor het leveren van zorg in natura ingevolge de [Wet langdurige zorg][ref7]; en

      2°. voldoet aan de norm NEN-ISO 9001;

      voor zover de uitbetaling plaatsvindt in het kader van de uitvoering van een schuldregelingsovereenkomst in de zin
      van de Gedragscode Schuldregeling of een overeenkomst tot budgetbeheer in de zin van de Gedragscode Budgetbeheer of
      overeenkomsten met dezelfde strekking;

      d. van een curator in een faillissement;

      e. van een bewindvoerder in een schuldsaneringsregeling natuurlijke personen;

      f. van een derde, die meerderjarig en handelingsbekwaam is, indien een belanghebbende niet beschikt over een
      bankrekening die op zijn naam staat, naar het oordeel van de Dienst Toeslagen niet in staat is een bankrekening op
      zijn naam te openen door zijn lichamelijke of geestelijke toestand, en de belanghebbende hierom verzoekt.

      3 Bij gevallen als bedoeld [artikel 7a, vierde lid, van de Invorderingswet 1990][ref8] is
      [artikel 25, eerste lid, tweede volzin, van de wet][ref9] niet van toepassing.

      4 Indien op grond van [artikel 25, derde lid, van de wet][ref10] de uitbetaling van een voorschot of een
      tegemoetkoming plaatsvindt op een andere bankrekening dan die van de belanghebbende of diens partner, vindt het
      gegevensverkeer met betrekking tot de uitbetaling tussen de Dienst Toeslagen en die rekeninghouder plaats met
      gebruikmaking van het burgerservicenummer van de belanghebbende.

      5 Bij toepassing van het tweede lid, onderdelen a tot en met c, wijst het aldaar bedoelde lid, de aldaar
      bedoelde gemeente of de aldaar bedoelde derde aan op welke bankrekening wordt uitbetaald, ten behoeve van welke
      belanghebbende en voor welke uitbetaling. Voorts wordt melding gemaakt van de beëindiging van de in het tweede lid,
      onderdelen a tot en met c, bedoelde overeenkomst.


