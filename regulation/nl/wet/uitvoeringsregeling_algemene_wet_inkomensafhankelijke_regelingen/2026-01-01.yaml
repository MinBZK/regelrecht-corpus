  - number: '7'
    text: |-
      1 De Dienst Toeslagen stelt de belanghebbende in de gelegenheid een terugvordering te betalen in maandelijkse
      termijnen van € 20 mits hij voldoet aan door de Dienst Toeslagen nader te stellen voorwaarden.

      2 Op schriftelijk verzoek van de belanghebbende stelt de Dienst Toeslagen de belanghebbende in de gelegenheid een
      bestuurlijke boete te betalen in maandelijkse termijnen van € 20 mits hij voldoet aan door de Dienst Toeslagen
      nader te stellen voorwaarden.

      3 Een betaling van de terugvordering of bestuurlijke boete in maandelijkse termijnen eindigt uiterlijk op de
      dag waarop sedert de vervaldag van de voor de terugvordering of bestuurlijke boete geldende betalingstermijn 24
      maanden zijn verstreken. Indien de omvang van de terugvordering of bestuurlijke boete betaling in 24 maandelijkse
      termijnen van € 20 niet toelaat, kan de Dienst Toeslagen, in afwijking van het eerste en tweede lid, een betaling
      in maandelijkse termijnen van meer dan € 20 verlangen.

      4 Indien de belanghebbende bij de betaling van de terugvordering of bestuurlijke boete in maandelijkse termijnen,
      bedoeld in het eerste lid, onderscheidenlijk tweede lid, niet voldoet aan de nader gestelde voorwaarden, bedoeld
      in het eerste lid, onderscheidenlijk tweede lid, stelt de Dienst Toeslagen de belanghebbende op diens verzoek in
      de gelegenheid de terugvordering of bestuurlijke boete alsnog te betalen in maandelijkse termijnen. In dat geval
      eindigt deze betaling in maandelijkse termijnen uiterlijk na 24 maanden gerekend vanaf de dag van de dagtekening
      van de beschikking waarin de Dienst Toeslagen de betaling in termijnen toestaat. De kosten van invordering die
      reeds zijn ontstaan voordat het verzoek om de betaling in maandelijkse termijnen wordt gehonoreerd worden onderdeel
      van de betreffende betalingsregeling.

      5 Op schriftelijk verzoek van de belanghebbende die aangeeft niet in staat te zijn een of meer
      terugvorderingen of bestuurlijke boetes overeenkomstig de voorgaande leden te betalen kan de Dienst
      Toeslagen, in afwijking in zoverre van de voorgaande leden, een betaling in termijnen toestaan gebaseerd
      op de betalingscapaciteit. De berekening van de betalingscapaciteit vindt plaats op de voet van
      [artikel 13 van de Uitvoeringsregeling Invorderingswet 1990][ref1], met dien verstande dat de Dienst Toeslagen
      het netto-besteedbare inkomen van de belanghebbende vermeerdert met het netto-besteedbare inkomen van de persoon
      die ten tijde van de indiening van het verzoek als partner in de zin van [artikel 3 van de wet][ref2] kan worden
      beschouwd.

      6 Een betalingsregeling als bedoeld in het vijfde lid wordt niet toegestaan indien de
      belanghebbende of de in dat lid bedoelde partner over voldoende vermogen in de zin van
      [artikel 12 van de Uitvoeringregeling Invorderingswet 1990][ref3] beschikken voor de voldoening van de
      terugvorderingen en de bestuurlijke boetes waarop het verzoek, bedoeld in het vijfde lid, betrekking heeft, met
      dien verstande dat bevoorrechte schulden op het vermogen in mindering worden gebracht.

      7 Indien de Dienst Toeslagen een betalingsregeling als bedoeld in het vijfde lid toestaat die zowel betrekking
      heeft op een of meer terugvorderingen als op een of meer bestuurlijke boetes, strekken de betalingen van
      de belanghebbende eerst ter voldoening van de terugvorderingen alvorens deze strekken ter voldoening van de
      bestuurlijke boetes.

      8 Een betalingsregeling als bedoeld in het vierde of vijfde lid wordt niet toegestaan indien het belang van de
      invordering zich verzet tegen het verlenen van de betalingsregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0004766#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0018472#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0004766#Artikel12
