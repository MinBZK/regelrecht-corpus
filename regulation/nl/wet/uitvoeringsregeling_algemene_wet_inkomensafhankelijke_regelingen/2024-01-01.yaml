      aanzien van de belanghebbende, zijn partner of een medebewoner de rendementsgrondslag, bedoeld in
      [artikel 5.3 van de Wet inkomstenbelasting 2001][ref4], zou worden verminderd met de waarde van een bezitting als
      bedoeld in artikel 5.3 van de Wet inkomstenbelasting 2001 die is verkregen als gevolg van een toegekende eenmalige
      aanvullende financiële bijdrage van de Stichting Zorg na Werk in Coronazorg.


