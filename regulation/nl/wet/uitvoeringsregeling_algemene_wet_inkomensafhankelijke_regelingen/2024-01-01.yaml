  - number: 9.1.b.17°
    text: |-
      uitkeringen van een voorschot op een persoonsgebonden budget als bedoeld in
      [paragraaf 2.6 van de Regeling subsidies AWBZ][ref1], die betrekking hebben op een in het kalenderjaar 2012 of
      in het kalenderjaar 2013 gelegen subsidieperiode voor zover deze zijn gedaan vóór 1 januari van het betreffende
      kalenderjaar;


      [ref1]: https://wetten.overheid.nl/BWBR0019161#Paragraaf2.6
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel9
    references:
      - id: ref1
