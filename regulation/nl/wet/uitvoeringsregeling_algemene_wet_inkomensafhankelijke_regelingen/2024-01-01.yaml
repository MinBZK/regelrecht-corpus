    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0047535
  - number: '9.2'
    text: |-
      Het eerste lid, onderdeel b, onder 3° tot en met 11°, is eveneens van toepassing ingeval de genoemde uitkeringen of
      tegemoetkomingen zijn verstrekt aan nabestaanden van de gerechtigden.
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel9
  - number: '9.3'
    text: |-
      Een verzoek om toepassing van een vermogenstoetsuitzondering als bedoeld in het eerste lid, onderdeel b, onder 1˚,
      kan uitsluitend betrekking hebben op de aanspraak op huurtoeslag, zorgtoeslag of kindgebonden budget over de eerste
      tien berekeningsjaren volgend op het kalenderjaar waarin de immateriële schadevergoeding verkregen werd indien die
      immateriële schadevergoeding is toegekend vanaf 1 januari 2024.
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel9
  - number: '9.4'
    text: |-
      Een verzoek om toepassing van een vermogenstoetsuitzondering als bedoeld in het eerste lid, onderdeel b, onder 19°,
      heeft uitsluitend betrekking op de eerste tien berekeningsjaren volgend op het kalenderjaar waarin de bezitting
      verkregen werd.
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel9
  - number: '9.5'
    text: |-
      Een verzoek als bedoeld in het eerste lid wordt geacht mede te zijn gedaan voor de op het berekeningsjaar
      waarop het verzoek betrekking heeft volgende berekeningsjaren waarop het verzoek om toepassing van een
      vermogenstoetsuitzondering betrekking kan hebben.
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel9
  - number: '9.6'
    text: |-
      Een verzoek als bedoeld in het eerste lid kan, met overeenkomstige toepassing van het
      tweede tot en met vijfde lid, eveneens worden gedaan met betrekking tot het buiten
      toepassing laten van [artikel 2a, eerste lid, van de Wet op de zorgtoeslag][ref1] of
      [artikel 1, vierde lid, van de Wet op het kindgebonden budget][ref2] indien de belanghebbende wel aanspraak
      op zorgtoeslag, onderscheidenlijk kindgebonden budget, zou hebben indien de rendementsgrondslag, bedoeld in
      [artikel 5.3 van de Wet inkomstenbelasting 2001][ref3], zou worden verminderd met de bezittingen, bedoeld in het
      eerste lid, onderdeel a, of de eenmalige uitkeringen, bedoeld in het eerste lid, onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0018451#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0022751#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0018451
        artikel: 2a
      - id: ref2
        bwb_id: BWBR0022751
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '5'
  - number: 9bis.1
    text: |-
      Op verzoek van de belanghebbende blijft artikel 7, derde en vierde lid, van
      de wet, [artikel 2a, eerste lid, van de Wet op de zorgtoeslag][ref1] of
      [artikel 1, vierde lid, van de Wet op het kindgebonden budget][ref2] buiten toepassing indien wel
      aanspraak op huurtoeslag, zorgtoeslag, onderscheidenlijk kindgebonden budget, zou bestaan indien ten
      aanzien van de belanghebbende, zijn partner of een medebewoner de rendementsgrondslag, bedoeld in
      [artikel 5.3 van de Wet inkomstenbelasting 2001][ref3], zou worden verminderd met de waarde van een bezitting als
      bedoeld in artikel 5.3 van de Wet inkomstenbelasting 2001 die is verkregen als gevolg van een eenmalige financiële
      ondersteuning van € 15.000 aan zorgmedewerkers in verband met langdurige post-COVID klachten op grond van de
      Regeling zorgmedewerkers met langdurige post-COVID klachten.


      [ref1]: https://wetten.overheid.nl/BWBR0018451#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0022751#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel9bis
    references:
      - id: ref1
        bwb_id: BWBR0018451
        artikel: 2a
      - id: ref2
        bwb_id: BWBR0022751
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '5'
  - number: 9bis.2
    text: |-
      Het verzoek kan uitsluitend betrekking hebben op de aanspraak op huurtoeslag, zorgtoeslag of kindgebonden budget
      over de eerste tien berekeningsjaren volgend op het kalenderjaar waarin de bezitting, bedoeld in het eerste lid,
      verkregen werd.
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel9bis
  - number: 9bis.3
    text: |-
      Het verzoek wordt geacht mede te zijn gedaan voor de op het berekeningsjaar waarop het verzoek betrekking heeft
      volgende berekeningsjaren waarop het verzoek ingevolge het tweede lid betrekking kan hebben.
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel9bis
  - number: 9ter.1
    text: |-
      Op verzoek van de belanghebbende blijft [artikel 7, derde en vierde lid, van de wet][ref1],
      [artikel 2a, eerste lid, van de Wet op de zorgtoeslag][ref2] of
      [artikel 1, vierde lid, van de Wet op het kindgebonden budget][ref3] buiten toepassing indien wel aanspraak
      op huurtoeslag, zorgtoeslag, onderscheidenlijk kindgebonden budget zou bestaan indien ten aanzien van de
      belanghebbende, zijn partner of een medebewoner bij de berekening van de rendementsgrondslag, bedoeld in
      [artikel 5.3 van de Wet inkomstenbelasting 2001][ref4], geen rekening zou worden gehouden met een uitbetaling van
      kindgebonden budget met betrekking tot de berekeningsjaren 2013 tot en met 2017 door de Dienst Toeslagen in het
      kader van de herstelactie kindgebonden budget.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0018451#Artikel2a
      [ref3]: https://wetten.overheid.nl/BWBR0022751#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel9ter
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0018451
        artikel: 2a
      - id: ref3
        bwb_id: BWBR0022751
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '5'
  - number: 9ter.2
    text: |-
      Een verzoek als bedoeld in het eerste lid met betrekking tot een uitbetaling als bedoeld in het eerste lid kan
      uitsluitend betrekking hebben op de aanspraak op huurtoeslag, zorgtoeslag, onderscheidenlijk kindgebonden budget,
      over het berekeningsjaar volgend op het kalenderjaar waarin die uitbetaling is ontvangen.
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel9ter
  - number: 9quater.1
    text: |-
      [Artikel 7, derde en vierde lid, van de wet][ref1], [artikel 2a, eerste lid, van de Wet op de zorgtoeslag][ref2]
      of [artikel 1, vierde lid, van de Wet op het kindgebonden budget][ref3] blijft buiten toepassing indien
      wel aanspraak op huurtoeslag, zorgtoeslag, onderscheidenlijk kindgebonden budget, zou bestaan indien
      ten aanzien van de belanghebbende, zijn partner of een medebewoner de rendementsgrondslag, bedoeld in
      [artikel 5.3 van de Wet inkomstenbelasting 2001][ref4], zou worden verminderd met de waarde van een bezitting als
      bedoeld in artikel 5.3 van de Wet inkomstenbelasting 2001 die is verkregen als gevolg van:


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0018451#Artikel2a
      [ref3]: https://wetten.overheid.nl/BWBR0022751#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel9quater
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0018451
        artikel: 2a
      - id: ref3
        bwb_id: BWBR0022751
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '5'
  - number: 9quater.1.a
    text: |-
      het verlagen of op nihil vaststellen van een terug te vorderen bedrag kinderopvangtoeslag in bijzondere
      omstandigheden vanwege de onevenredigheid van de nadelige gevolgen van een voor 23 oktober 2019 genomen beschikking
