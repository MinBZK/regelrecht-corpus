preamble:
  text: |-
    Handelende wat artikel 6, tweede en derde lid, betreft, in overeenstemming met de Minister van Sociale Zaken en
    Werkgelegenheid en wat artikel 47 betreft, in overeenstemming met de Minister van Volkshuisvesting, Ruimtelijke
    Ordening en Milieubeheer;

    Gelet op de artikelen 6, tweede en derde lid, 8, zevende lid,17, tweede lid, 25, tweede lid,31, tweede lid, en 47
    van de Algemene wet inkomensafhankelijke regelingen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze regeling geeft uitvoering aan de [artikelen 6, tweede en derde lid][ref1],
      [17, tweede lid][ref2], [21a][ref3], [25, tweede lid][ref4], [26, derde lid][ref5],
      [31][ref6], [47][ref7] en [47a van de Algemene wet inkomensafhankelijke regelingen][ref8] en
      [artikel 2a van het Uitvoeringsbesluit Algemene wet inkomensafhankelijke regelingen][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0018472#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0018472#Artikel21a
