  - number: 9quater.3
    text: |-
      De vermogenstoetsuitzonderingen, bedoeld in het eerste en tweede lid, gelden uitsluitend over de eerste tien
      berekeningsjaren volgend op het kalenderjaar waarin de bezitting verkregen werd. Een verzoek als bedoeld in het
      tweede lid wordt geacht mede te zijn gedaan voor de op het berekeningsjaar waarop het verzoek betrekking heeft
      volgende berekeningsjaren waarover de vermogenstoetsuitzonderingen kunnen gelden.
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel9quater
  - number: 9quater.4
    text: |-
      Voor de toepassing van dit artikel wordt onder een bezitting mede verstaan de afname van een schuld als bedoeld in
      [artikel 5.3 van de Wet inkomstenbelasting 2001][ref1].


