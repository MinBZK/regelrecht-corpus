    text: |-
      Het verzoek wordt geacht mede te zijn gedaan voor op het berekeningsjaar waarop het verzoek betrekking heeft
      volgende berekeningsjaren waarop het verzoek ingevolge het tweede lid betrekking kan hebben.
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel9novies
  - number: 9a
    text: |-
      Indien de Dienst Toeslagen overeenkomstig artikel 6 van Verordening (EG) nr. 987/2009 van het Europees Parlement
      en de Raad van 16 september 2009 tot vaststelling van de wijze van toepassing van Verordening (EG) nr. 883/2004
      betreffende de coördinatie van de socialezekerheidsstelsels (PbEU 2009, L 284) retroactief als bevoegd orgaan is
      aangemerkt:
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel9a
  - number: 9a.a
    text: |-
      wordt de belanghebbende geacht tijdig een aanvraag te hebben gedaan als bedoeld in [artikel 15 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel15
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '15'
  - number: 9a.b
    text: |-
      worden de in [artikel 19 van de wet][ref1] genoemde beslissingstermijnen voor toekenning van de tegemoetkoming
      verlengd met de tijd gedurende welke een orgaan in een andere lidstaat aangewezen is geweest als voorlopig bevoegd
      orgaan;


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel19
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '19'
  - number: 9a.c
    text: |-
      worden de in de [artikelen 21, tweede lid][ref1], en [27, tweede lid, van de wet][ref2] genoemde termijnen en de in
      [artikel 5a, eerste lid, onderdeel a][ref3], genoemde termijn verlengd met de tijd gedurende welk een orgaan in een
      andere lidstaat aangewezen is geweest als voorlopig bevoegd orgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0018472#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0019237#Artikel5a
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0018472
        artikel: '27'
      - id: ref3
        bwb_id: BWBR0019237
        artikel: 5a
  - number: 9c
    text: |-
      De Dienst Toeslagen kan ondersteuning verlenen bij het verwezenlijken van rechten of het nakomen
      van verplichtingen die voortvloeien uit de [wet][ref1], de daarop berustende bepalingen of een
      inkomensafhankelijke regeling. Deze ondersteuning vindt plaats in het algemeen belang als bedoeld in
      [artikel 25h, vijfde lid, van de Mededingingswet][ref2]. Onder ondersteuning wordt in ieder geval verstaan:


      [ref1]: https://wetten.overheid.nl/BWBR0018472
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel25h
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0018472
      - id: ref2
        bwb_id: BWBR0008691
        artikel: 25h
  - number: 9c.a
    text: |-
      het ter beschikking stellen van middelen voor het verwezenlijken van rechten en nakomen van verplichtingen, bedoeld
      in de eerste zin, en
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel9c
  - number: 9c.b
    text: |-
      het ondersteunen, onder meer met de middelen, bedoeld in onderdeel a, van partijen die hulp bieden bij het
      verwezenlijken van rechten en nakomen van verplichtingen, bedoeld in de eerste zin, voor zover die partijen geen
      vergoeding vragen voor het bieden van die hulp.
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel9c
  - number: '10'
    text: Deze regeling treedt in werking met ingang van 1 januari 2006.
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel10
  - number: '11'
    text: 'Deze regeling wordt aangehaald als: Uitvoeringsregeling Algemene wet inkomensafhankelijke regelingen.'
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel11
