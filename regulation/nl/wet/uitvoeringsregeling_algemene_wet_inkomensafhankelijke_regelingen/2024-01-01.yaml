  - number: '2'
    text: |-
      Deze regeling verstaat onder wet: [Algemene wet inkomensafhankelijke regelingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018472
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0018472
  - number: '3.1'
    text: |-
      Iemand die niet in Nederland woont, wordt geacht op zijn woonadres te zijn ingeschreven in een naar aard en
      strekking met de basisregistratie personen overeenkomende registratie buiten Nederland, indien:
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel3
  - number: 3.1.a
    text: |-
      hij vanwege zijn functie of vanwege de functie van een van de tot zijn huishouden behorende personen niet kan of
      niet hoeft te worden ingeschreven in een naar aard en strekking met de basisregistratie personen overeenkomende
      registratie buiten Nederland;
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel3
  - number: 3.1.b
    text: blijkt dat hij niet woont op het adres waarop hij is ingeschreven in de bevolkingsregistratie in zijn woonland;
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel3
  - number: 3.1.c
    text: |-
      zijn woonland geen of geen naar aard en strekking met de basisregistratie personen overeenkomende registratie
      voert.
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel3
  - number: '3.2'
    text: |-
      Iemand die in de basisregistratie personen niet op zijn woonadres is ingeschreven, wordt geacht daarin wel op dat
      adres te zijn ingeschreven, indien:
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel3
  - number: 3.2.a
    text: |-
      hij een vreemdeling is als bedoeld in [artikel 9, tweede lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel9
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '9'
  - number: 3.2.b
    text: |-
      hij of een tot zijn huishouden behorende persoon op grond van
      [artikel 21, eerste lid, van het Besluit basisregistratie personen][ref1] in verband met zijn bijzondere
      verblijfsrechtelijke status niet in aanmerking komt voor inschrijving, met dien verstande dat voor degenen die zijn
      opgenomen in de door het Ministerie van Buitenlandse Zaken gevoerde Protocollaire Basisadministratie, het in deze
      administratie opgenomen woonadres geldt;


      [ref1]: https://wetten.overheid.nl/BWBR0034306#Artikel21
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0034306
        artikel: '21'
  - number: 3.2.c
    text: |-
      blijkt dat sprake is van een onjuiste inschrijving in de basisregistratie personen voor de periode tot aan de datum
      van adreswijziging, bedoeld in [artikel 2.20, derde lid, van de Wet basisregistratie personen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
  - number: 3.2.d
    text: |-
      hij zich binnen 5 dagen na de aanvang van zijn verblijf op zijn woonadres heeft laten inschrijven in de
      basisregistratie personen.
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel3
  - number: '5.1'
    text: |-
      Indien een voorschot op de tegemoetkoming is verleend en zich in het berekeningsjaar een wijziging van de
      omstandigheden voordoet waarmee bij het verlenen van het voorschot geen rekening is gehouden en die leidt tot
      beëindiging dan wel verlaging van de tegemoetkoming doet de belanghebbende, zijn partner of een medebewoner daarvan
      binnen vier weken schriftelijk dan wel elektronisch mededeling aan de Dienst Toeslagen.
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel5
  - number: '5.2'
    text: 'De wijzigingen, bedoeld in het eerste lid, zijn:'
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel5
  - number: 5.2.a
    text: |-
      het ontstaan van partnerschap op grond van
      [artikel 5a, eerste lid, aanhef en onderdeel b, van de Algemene wet inzake rijksbelastingen][ref1] of
      [artikel 3, tweede lid, aanhef en onderdelen b, c en d, van de wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0018472#Artikel3
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 5a
      - id: ref2
        bwb_id: BWBR0018472
        artikel: '3'
  - number: 5.2.b
    text: |-
      het eindigen van partnerschap op grond van
      [artikel 5a, vierde lid, aanhef en onderdeel a, van de Algemene wet inzake rijksbelastingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel5a
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 5a
  - number: 5.2.c
    text: |-
      een verhoging van een geschat toetsingsinkomen die leidt tot een verlaging van de tegemoetkoming over het
      berekeningsjaar met meer dan € 500;
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel5
  - number: 5.2.d
    text: |-
      een verhoging van een geschat vermogen waardoor over het berekeningsjaar geen aanspraak op een tegemoetkoming
      bestaat.
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel5
  - number: '5.3'
    text: |-
      Indien er een voorschot huurtoeslag is verleend, wordt als een omstandigheid als bedoeld in het eerste lid tevens
      aangemerkt:
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel5
  - number: 5.3.a
    text: een wijziging in de huurprijs;
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel5
  - number: 5.3.b
    text: |-
      het aangaan van of het beëindigen van een huurcontract, waaronder begrepen een schriftelijke overeenkomst als
      bedoeld in [artikel 2, eerste lid, onderdeel e, onder 2°, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel2
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '2'
  - number: 5.3.c
    text: een verandering van verhuurder.
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel5
  - number: '5.4'
    text: |-
      Indien er een voorschot zorgtoeslag is verleend, wordt als een omstandigheid als bedoeld in het eerste lid
      tevens aangemerkt de beëindiging van de zorgverzekering of een opschorting van die verzekering als bedoeld in
      [artikel 24 van de Zorgverzekeringswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel24
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '24'
  - number: '5.5'
    text: |-
      Indien er een voorschot kinderopvangtoeslag is verleend, wordt als een omstandigheid als bedoeld in het eerste lid
      tevens aangemerkt:
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel5
  - number: 5.5.a
    text: een wijziging in het aantal uren kinderopvang van een kind van de belanghebbende of van zijn partner;
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel5
  - number: 5.5.b
    text: een wijziging in het soort genoten kinderopvang door een kind van de belanghebbende of van zijn partner;
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel5
  - number: 5.5.c
    text: een wijziging van het geregistreerde kindercentrum of geregistreerde gastouderbureau;
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel5
  - number: 5.5.d
    text: een wijziging in de uurprijs.
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel5
  - number: '5.6'
    text: |-
      In afwijking in zoverre van het eerste lid kan van een wijziging als bedoeld in het tweede lid, onderdeel c,
      alsmede van wijzigingen die leiden tot een beëindiging van het voorschot op de tegemoetkoming ook telefonisch dan
      wel anderszins mondeling mededeling worden gedaan aan de Dienst Toeslagen.
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel5
  - number: 5a.1
    text: |-
      De Dienst Toeslagen herziet in het voordeel van de belanghebbende een toegekende of herziene tegemoetkoming die
      onherroepelijk is geworden zodra de Dienst Toeslagen is gebleken dat die tegemoetkoming op een te laag bedrag is
      vastgesteld, tenzij:
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel5a
  - number: 5a.1.a
    text: |-
      vijf jaren zijn verstreken na de laatste dag van het berekeningsjaar waarop de tegemoetkoming betrekking heeft
      en de belanghebbende niet binnen een jaar na de dagtekening van de beschikking tot toekenning om herziening heeft
      verzocht;
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel5a
  - number: 5a.1.b
    text: |-
      de onjuistheid van de tegemoetkoming voortvloeit uit jurisprudentie die eerst is gewezen nadat die tegemoetkoming
      onherroepelijk vast is komen te staan, tenzij de Minister van Financiën, zonodig in overeenstemming met de
      Ministers die het aangaat, anders heeft bepaald;
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel5a
  - number: 5a.1.c
    text: |-
      de onjuistheid van de tegemoetkoming voortvloeit uit beleidsregels van de Minister van Financiën of van de
      Ministers die het aangaat, die eerst zijn uitgevaardigd nadat die tegemoetkoming onherroepelijk vast is komen te
      staan, tenzij de Minister van Financiën, zonodig in overeenstemming met de Ministers die het aangaat, anders heeft
      bepaald;
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel5a
  - number: 5a.1.d
    text: |-
      de onjuistheid van de tegemoetkoming voortvloeit uit de omstandigheid dat eerst nadat die tegemoetkoming
      onherroepelijk vast is komen te staan een beroep wordt gedaan op een faciliteit, waarop een beroep moet worden
      gedaan op een eerder wettelijk voorgeschreven moment; of
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel5a
  - number: 5a.1.e
    text: |-
      sprake is van enig feit waardoor de tegemoetkoming op een te laag bedrag is vastgesteld en een andere
      tegemoetkoming, al dan niet van dezelfde belanghebbende, ter zake van datzelfde feit op een te hoog bedrag is
      vastgesteld en ter zake daarvan niet is of kan worden teruggevorderd, met dien verstande dat in dat geval wel in
      het voordeel van belanghebbende wordt herzien voor zover het te laag vastgestelde bedrag van de tegemoetkoming het
      te hoog vastgestelde bedrag van de andere tegemoetkoming dat niet is of kan worden teruggevorderd te boven gaat.
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel5a
  - number: 5a.2
    text: |-
      De Dienst Toeslagen herziet onder bijzondere omstandigheden, onder overeenkomstige toepassing van het eerste
      lid, onderdelen a tot en met c, in het voordeel van de belanghebbende een beschikking tot terugvordering die
      onherroepelijk is geworden voor zover de nadelige gevolgen van die beschikking onevenredig zijn in verhouding tot
      de met die beschikking te dienen doelen.
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel5a
  - number: '6.1'
    text: |-
      Als gevallen als bedoeld in [artikel 25, derde lid, van de wet][ref1] worden aangewezen uitbetalingen door de
      Dienst Toeslagen:


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel25
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '25'
  - number: 6.1.a
    text: |-
      van kinderopvangtoeslag op de bankrekening van een onderneming als bedoeld in de [Handelsregisterwet 2007][ref1],
      die een of meerdere kindercentra of een of meerdere gastouderbureaus exploiteert, als bedoeld in
      [artikel 1.1, eerste lid, van de Wet kinderopvang en kwaliteitseisen peuterspeelzalen][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0021777
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0021777
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '1'
  - number: 6.1.b
    text: |-
      van huurtoeslag op de bankrekening van een toegelaten instelling, als bedoeld in
      [artikel 19 van de Woningwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel19
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '19'
  - number: 6.1.c
    text: |-
      van zorgtoeslag op de bankrekening van een zorgverzekeraar, als bedoeld in
      [artikel 1, onderdeel b, van de Zorgverzekeringswet][ref1]; voor zover de onderneming, instelling of
      zorgverzekeraar voor dit doel een convenant heeft afgesloten met de Dienst Toeslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel1
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '1'
  - number: '6.2'
    text: |-
      Als gevallen als bedoeld in [artikel 25, derde lid, van de wet][ref1] worden voorts aangewezen uitbetalingen door
      de Dienst Toeslagen op de bankrekening:


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel25
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '25'
  - number: 6.2.a
    text: |-
      van een lid van de Nederlandse Vereniging voor Volkskrediet voor zover de uitbetaling plaatsvindt in het kader van
      de uitvoering van een schuldregelingsovereenkomst in de zin van de Gedragscode Schuldregeling of een overeenkomst
      tot budgetbeheer in de zin van de Gedragscode Budgetbeheer;
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel6
  - number: 6.2.b
    text: |-
      van een gemeente op grond van een schuldregelingsovereenkomst in de zin van de Gedragscode Schuldregeling of
      een overeenkomst tot budgetbeheer in de zin van de Gedragscode Budgetbeheer van de Nederlandse Vereniging voor
      Volkskrediet of overeenkomsten met dezelfde strekking;
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel6
  - number: 6.2.c
    text: 'van een derde die:'
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel6
  - number: 6.2.c.1°
    text: |-
      een subsidiebeschikking heeft ontvangen van een gemeente dan wel een overeenkomst heeft met een Wlz-uitvoerder voor
      het leveren van zorg in natura ingevolge de [Wet langdurige zorg][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0035917
  - number: 6.2.c.2°
    text: voldoet aan de norm NEN-ISO 9001;
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel6
  - number: 6.2.d
    text: van een curator in een faillissement;
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel6
  - number: 6.2.e
    text: van een bewindvoerder in een schuldsaneringsregeling natuurlijke personen;
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel6
  - number: 6.2.f
    text: |-
      van een derde, die meerderjarig en handelingsbekwaam is, indien een belanghebbende niet beschikt over een
      bankrekening die op zijn naam staat, naar het oordeel van de Dienst Toeslagen niet in staat is een bankrekening op
      zijn naam te openen door zijn lichamelijke of geestelijke toestand, en de belanghebbende hierom verzoekt.
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel6
  - number: '6.3'
    text: |-
      Bij gevallen als bedoeld [artikel 7a, vierde lid, van de Invorderingswet 1990][ref1] is
      [artikel 25, eerste lid, tweede volzin, van de wet][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0018472#Artikel25
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: 7a
      - id: ref2
        bwb_id: BWBR0018472
        artikel: '25'
  - number: '6.4'
    text: |-
      Indien op grond van [artikel 25, derde lid, van de wet][ref1] de uitbetaling van een voorschot of een
      tegemoetkoming plaatsvindt op een andere bankrekening dan die van de belanghebbende of diens partner, vindt het
      gegevensverkeer met betrekking tot de uitbetaling tussen de Dienst Toeslagen en die rekeninghouder plaats met
      gebruikmaking van het burgerservicenummer van de belanghebbende.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel25
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '25'
  - number: '6.5'
    text: |-
      Bij toepassing van het tweede lid, onderdelen a tot en met c, wijst het aldaar bedoelde lid, de aldaar
      bedoelde gemeente of de aldaar bedoelde derde aan op welke bankrekening wordt uitbetaald, ten behoeve van welke
      belanghebbende en voor welke uitbetaling. Voorts wordt melding gemaakt van de beëindiging van de in het tweede lid,
      onderdelen a tot en met c, bedoelde overeenkomst.
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel6
  - number: '7.1'
    text: |-
      De Dienst Toeslagen stelt de belanghebbende in de gelegenheid een terugvordering te betalen in maandelijkse
      termijnen van € 20 mits hij voldoet aan door de Dienst Toeslagen nader te stellen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel7
  - number: '7.2'
    text: |-
      Op schriftelijk verzoek van de belanghebbende stelt de Dienst Toeslagen de belanghebbende in de gelegenheid een
      bestuurlijke boete te betalen in maandelijkse termijnen van € 20 mits hij voldoet aan door de Dienst Toeslagen
      nader te stellen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel7
  - number: '7.3'
    text: |-
      Een betaling van de terugvordering of bestuurlijke boete in maandelijkse termijnen eindigt uiterlijk op de dag
      waarop sedert de vervaldag van de voor de terugvordering of bestuurlijke boete geldende betalingstermijn 24
      maanden zijn verstreken. Indien de omvang van de terugvordering of bestuurlijke boete betaling in 24 maandelijkse
      termijnen van € 20 niet toelaat, kan de Dienst Toeslagen, in afwijking van het eerste en tweede lid, een betaling
      in maandelijkse termijnen van meer dan € 20 verlangen.
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel7
  - number: '7.4'
    text: |-
      Op schriftelijk verzoek van de belanghebbende die aangeeft niet in staat te zijn een of meer
      terugvorderingen of bestuurlijke boetes overeenkomstig de voorgaande leden te betalen kan de Dienst
      Toeslagen, in afwijking in zoverre van de voorgaande leden, een betaling in termijnen toestaan gebaseerd
      op de betalingscapaciteit. De berekening van de betalingscapaciteit vindt plaats op de voet van
      [artikel 13 van de Uitvoeringsregeling Invorderingswet 1990][ref1], met dien verstande dat de Dienst Toeslagen
      het netto-besteedbare inkomen van de belanghebbende vermeerdert met het netto-besteedbare inkomen van de persoon
      die ten tijde van de indiening van het verzoek als partner in de zin van [artikel 3 van de wet][ref2] kan worden
      beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0004766#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0018472#Artikel3
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004766
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0018472
        artikel: '3'
  - number: '7.5'
    text: |-
      Een betalingsregeling als bedoeld in het vierde lid wordt niet toegestaan indien de
      belanghebbende of de in dat lid bedoelde partner over voldoende vermogen in de zin van
      [artikel 12 van de Uitvoeringregeling Invorderingswet 1990][ref1] beschikken voor de voldoening van de
      terugvorderingen en de bestuurlijke boetes waarop het verzoek, bedoeld in het vierde lid, betrekking heeft, met
      dien verstande dat bevoorrechte schulden op het vermogen in mindering worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0004766#Artikel12
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004766
        artikel: '12'
  - number: '7.6'
    text: |-
      Indien de Dienst Toeslagen een betalingsregeling als bedoeld in het vierde lid toestaat die zowel betrekking
      heeft op een of meer terugvorderingen als op een of meer bestuurlijke boetes, strekken de betalingen van
      de belanghebbende eerst ter voldoening van de terugvorderingen alvorens deze strekken ter voldoening van de
      bestuurlijke boetes.
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel7
  - number: '8.1'
    text: |-
      Indien de belanghebbende tijdig een gemotiveerd bezwaar of verzoek om herziening als bedoeld in
      [artikel 21a van de wet][ref1] heeft ingediend tegen de terugvordering dan wel beroep of hoger beroep heeft
      ingediend tegen de uitspraak op een bezwaar of verzoek om herziening als bedoeld in artikel 21a van de wet, kan
      de Dienst Toeslagen uitstel van betaling van de terugvordering verlenen tot het moment waarop op het bezwaar of
      verzoek om herziening als bedoeld in artikel 21a van de wet, het beroep of hoger beroep is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel21a
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: 21a
  - number: '8.2'
    text: |-
      Het eerste lid vindt overeenkomstige toepassing indien bezwaar, beroep, hoger beroep of beroep in cassatie,
      dan wel een verzoek om ambtshalve vermindering is ingediend ter zake van een inkomensgegeven als bedoeld in
      [artikel 21, onderdeel e, van de Algemene wet inzake rijksbelastingen][ref1], dat bepalend is voor de draagkracht
      waarmee bij de terugvordering rekening is gehouden. Onder een verzoek om ambtshalve vermindering wordt mede verstaan
      een verzoek om herziening als bedoeld in [artikel 9.5, eerste lid, van de Wet inkomstenbelasting 2001][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel9
    url: https://wetten.overheid.nl/BWBR0019237/2024-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '9'
  - number: '9.1'
    text: |-
