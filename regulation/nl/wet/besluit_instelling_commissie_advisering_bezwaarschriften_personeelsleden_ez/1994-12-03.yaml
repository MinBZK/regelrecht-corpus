preamble:
  text: >-
    Gelet op de Algemene wet bestuursrecht;


    Gehoord de bijzondere commissies als bedoeld in artikel 113 van het Algemeen Rijksambtenarenreglement bij het
    Ministerie van Economische Zaken en bij het Centraal Bureau voor de Statistiek;


    Besluit:
  url: https://wetten.overheid.nl/BWBR0007042/1994-12-03#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:



            a
            de minister:

              de Minister van Economische Zaken;



            b
            het ministerie:

              het Ministerie van Economische Zaken en de daaronder ressorterende diensten;



            c
            medewerker:

              personeelslid van het ministerie, aangesteld krachtens het [Algemeen Rijksambtenarenreglement][ref1], of in
      dienst genomen krachtens het Arbeidsovereenkomstenbesluit;



            d
            besluit:

              hetgeen daaronder wordt verstaan in de [Algemene wet bestuursrecht][ref2];



            e
            bezwaarde:

              medewerker die een bezwaarschrift heeft ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0001950
      [ref2]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0007042/1994-12-03#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001950
      - id: ref2
        bwb_id: BWBR0005537
  - number: '2'
    text: Er is een commissie advisering bezwaarschriften personeelsleden EZ.
    url: https://wetten.overheid.nl/BWBR0007042/1994-12-03#Artikel2
  - number: '3'
    text: >-
      1 De commissie bestaat uit vijf door de minister benoemde leden.


      2 Leden van de commissie zijn:


      a. een door de minister aangewezen voorzitter, niet werkzaam bij het ministerie,


      b. een door de minister aangewezen medewerker, niet werkzaam bij het Centraal Bureau voor de Statistiek,


      c. een door de minister aangewezen medewerker, werkzaam bij het Centraal Bureau voor de Statistiek,


      d. een lid, aangewezen door de Bijzondere Commissie van Georganiseerd Overleg bij het Ministerie van Economische
      Zaken en


      e. een lid, aangewezen door de Bijzondere Commissie van Georganiseerd Overleg bij het Centraal Bureau voor de
      Statistiek.


      3 Voor ieder lid van de commissie benoemt de minister ten minste één plaatsvervanger. Het bepaalde in het tweede
      lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0007042/1994-12-03#Artikel3
  - number: '4'
    text: |-
      1 De in [artikel 3][ref1] bedoelde benoemingen van de voorzitter en de plaatsvervangend voorzitter gelden,
      behoudens tussentijds ontslag, voor een periode van ten hoogste vijf jaar. De overige benoemingen gelden, behoudens
      tussentijds ontslag, voor een periode van ten hoogste drie jaar.

      2 De leden en de plaatsvervangende leden van de commissie kunnen worden herbenoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0007042#Artikel3
    url: https://wetten.overheid.nl/BWBR0007042/1994-12-03#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007042
        artikel: '3'
        paragraaf: '2'
  - number: '5'
    text: >-
      1 De commissie wordt bijgestaan door een door de minister, op voordracht van de directeur Personeel, Organisatie
      en Informatie, aan te wijzen eerste secretaris. De commissie wordt voorts bijgestaan door een door de minister, op
      voordracht van de directeur-generaal van de Statistiek, aan te wijzen tweede secretaris.


      2 Voor beide secretarissen wijst de minister een plaatsvervanger aan. Het bepaalde in het eerste lid is van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0007042/1994-12-03#Artikel5
  - number: '6'
    text: >-
      1 De commissie heeft tot taak de minister te adviseren over de te nemen beslissingen op haar door de minister
      voorgelegde bezwaren van medewerkers tegen besluiten die jegens hen als zodanig zijn genomen door, namens of op
      voordracht van de minister, waarbij hun rechtspositioneel belang rechtstreeks is betrokken.


      2 Het eerste lid is niet van toepassing als ingevolge enig wettelijk voorschrift een andere commissie over het
      betrokken bezwaar adviseert.


      3 Desgevraagd adviseert de commissie de minister ook over andere onderwerpen op personeelsgebied dan bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0007042/1994-12-03#Artikel6
  - number: '7'
    text: >-
      1 De leden van de commissie verschonen zich van de behandeling van zaken waarbij zij in enig opzicht betrekken
      zijn geweest.


      2 De leden van de commissie kunnen worden gewraakt om aan de behandeling van in het eerste lid bedoelde zaken deel
      te nemen.


      3 De leden van de commissie, met uitzondering van de gewraakte leden, beslissen of de wraking wordt toegestaan. Bij
      staken van stemmen is de wraking toegestaan.
    url: https://wetten.overheid.nl/BWBR0007042/1994-12-03#Artikel7
  - number: '8'
    text: |-
      1 Aan de behandeling van een zaak nemen de voorzitter of zijn plaatsvervanger en ten minste nog twee door de
      voorzitter aan te wijzen leden van de commissie deel.

      2 De voorzitter draagt zorg voor een zodanige aanwijzing dat aan de behandeling van een zaak in ieder geval
      deelnemen:

      a. een lid als bedoeld in [artikel 3, tweede lid, onderdeel b, of onderdeel c][ref1], of een plaatsvervanger en

      b. een lid als bedoeld in [artikel 3, tweede lid, onderdeel d, of onderdeel e][ref2], of een plaatsvervanger.

      3 Bij ontstentenis van een aangewezen lid of plaatsvervanger kan de voorzitter een ander lid of plaatsvervanger in
      diens plaats aanwijzen.

      4 Tevens bepaalt de voorzitter wie bij de behandeling als secretaris zal fungeren.


      [ref1]: https://wetten.overheid.nl/BWBR0007042#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007042#Artikel3
    url: https://wetten.overheid.nl/BWBR0007042/1994-12-03#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007042
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007042
        artikel: '3'
        paragraaf: '2'
  - number: '9'
    text: >-
      De commissie kan daarvoor in aanmerking komende derden oproepen voor het verkrijgen van inlichtingen die zij
      behoeft. Iedere als zodanig opgeroepen medewerker is verplicht aan een oproep van de commissie gevolg te geven en
      desgevraagd alle inlichtingen naar waarheid en zonder voorbehoud te verstrekken.
    url: https://wetten.overheid.nl/BWBR0007042/1994-12-03#Artikel9
  - number: '10'
    text: >-
      1 De commissie kan zich door deskundigen van advies en verslag laten dienen.


      2 De commissie kan overlegging vorderen van ter zake dienende bescheiden.


      3 De commissie is bevoegd een onderzoek ter plaatse in te stellen of te doen instellen.
    url: https://wetten.overheid.nl/BWBR0007042/1994-12-03#Artikel10
  - number: '11'
    text: >-
      1 De bij de behandeling van een zaak betrokken leden van de commissie stellen het advies van de commissie vast bij
      meerderheid van stemmen.


      Geen der betrokken leden onthoudt zich van stemming.


      2 De bij de behandeling van een zaak fungerend voorzitter en fungerende secretaris van de commissie ondertekenen
      het advies.


      3 De eerste secretaris of zijn plaatsvervanger zendt het advies en het verslag van de hoorzitting aan de minister.


      4 De eerste secretaris of zijn plaatsvervanger zendt de bezwaarde en degene die het bestreden besluit heeft genomen
      afschriften van het door de commissie aan de minister uitgebrachte advies en het verslag van de hoorzitting.
    url: https://wetten.overheid.nl/BWBR0007042/1994-12-03#Artikel11
  - number: '12'
    text: |-
      Het is de leden en de secretarissen van de commissie en hun plaatsvervangers verboden:

      a. hetgeen zij als zodanig te weten zijn gekomen verder bekend te maken dan voor de uitoefening van hun functie
      gevorderd wordt;

      b. de gevoelens te openbaren, die tijdens de beraadslaging over het bezwaar zijn geuit;

      c. over een aan hen voorgelegde zaak of over een zaak die, naar zij weten of kunnen vermoeden, aan hen zal worden
      voorgelegd zich uit te laten in enig onderhoud of gesprek met:

      - de bezwaarde, zijn raadsman of gemachtigde,
      - in gevallen waarin het een bezwaar betreft als bedoeld in
      [artikel 8, eerste lid, van het Beoordelingsvoorschrift Burgerlijk Rijkspersoneel 1985][ref1], de betrokken
      beoordelaar of beoordelaars, de desbetreffende beoordelingsautoriteit of de door deze aangewezen vertegenwoordiger,
      dan wel,
      - in andere gevallen, degene die het betrokken besluit heeft genomen of de door deze aangewezen vertegenwoordiger;

      d. enige schriftelijke informatie in ontvangst te nemen van de onder c bedoelde personen of dezen in de gelegenheid
      te stellen anderszins hierover mededelingen aan hen te doen, met uitzondering van informatie of mededelingen aan de
      secretaris in het kader van de normale secretariaatswerkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0003782#Artikel8
    url: https://wetten.overheid.nl/BWBR0007042/1994-12-03#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003782
        artikel: '8'
  - number: '13'
    text: >-
      De benoeming van de op het tijdstip van inwerkingtreding van dit besluit zittende leden en plaatsvervangende leden
      van de commissie blijft, behoudens tussentijds ontslag, van kracht voor de periode waarvoor zij zijn benoemd.
    url: https://wetten.overheid.nl/BWBR0007042/1994-12-03#Artikel13
  - number: '14'
    text: De Regeling behandeling bezwaren ambtenaren EZ 1992 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007042/1994-12-03#Artikel14
  - number: '15'
    text: >-
      Dit besluit treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0007042/1994-12-03#Artikel15
  - number: '16'
    text: >-
      Dit besluit wordt aangehaald als: Besluit instelling commissie advisering bezwaarschriften personeelsleden EZ. Dit
      besluit zal met de toelichting in de Staatscourant worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0007042/1994-12-03#Artikel16
