preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het met het oog op de wijziging van de materiële belastingbepalingen
    in de Gemeentewet wenselijk is de bepalingen van die wet te wijzigen, een aantal wetten met de Gemeentewet in
    overeenstemming te brengen, en het tijdstip waarop deze wijzigingen in werking treden, vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006638/1995-05-17#ArtikelAanhef
articles:
  - number: XV.1
    text: |-
      De besluiten inzake gemeentelijke belastingverordeningen als bedoeld in artikel 216, die algemeen verbindende
      voorschriften bevatten waarvan de inhoud in strijd is met deze wet, moeten uiterlijk twee jaren na de datum van
      inwerkingtreding van deze wet daarmee in overeenstemming zijn gebracht of ingetrokken. De besluiten, of onderdelen
      daarvan, die op het in de eerste volzin genoemde tijdstip niet met deze wet in overeenstemming zijn gebracht of
      zijn ingetrokken, zijn van rechtswege vervallen.
    url: https://wetten.overheid.nl/BWBR0006638/1995-05-17#ArtikelXV
  - number: XV.2
    text: |-
      In afwijking van het eerste lid vervallen de besluiten inzake gemeentelijke verordeningen betreffende onroerende-
      zaakbelastingen, ingeval die belastingen naar de grondslag oppervlakte worden geheven, van rechtswege bij het
      verstrijken van een termijn van vijf jaar na de datum van inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0006638/1995-05-17#ArtikelXV
  - number: XV.3
    text: |-
      In afwijking van het eerste lid vervallen de besluiten inzake gemeentelijke belastingverordeningen als bedoeld in
      de [artikelen 221][ref1] en [222 van de Gemeentewet][ref2], zoals deze luidden voor inwerkingtreding van deze wet,
      bij het verstrijken van de termijn die daarvoor in de desbetreffende belastingverordening is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel221
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel222
    url: https://wetten.overheid.nl/BWBR0006638/1995-05-17#ArtikelXV
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '221'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '222'
  - number: XV.4
    text: |-
      In afwijking van het eerste lid vervallen de besluiten inzake gemeentelijke belastingverordeningen als bedoeld in
      de [artikelen 273](onbekend) en [274 van de gemeentewet][ref1] bij het verstrijken van de termijn die daarvoor in
      de desbetreffende belastingverordening is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel274
    url: https://wetten.overheid.nl/BWBR0006638/1995-05-17#ArtikelXV
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '274'
  - number: XV.5
    text: |-
      In afwijking van het eerste lid vervallen de besluiten inzake gemeentelijke belastingverordeningen als bedoeld
      in [artikel 280 van de gemeentewet][ref1], zoals dit luidde voor de inwerkingtreding van de wet van 24 december
      1970 tot wijziging van de bepalingen inzake gemeentelijke en provinciale belastingen, waarvan de heffing tot een
      bepaalde termijn is beperkt en waarvoor de mogelijkheid tot afkoop is gegeven, bij het verstrijken van de termijn
      die daarvoor in de desbetreffende belastingverordening is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel280
    url: https://wetten.overheid.nl/BWBR0006638/1995-05-17#ArtikelXV
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '280'
  - number: XVI.2
    text: |-
      Met betrekking tot de besluiten, bedoeld in [artikel XV, vijfde lid][ref1], blijven de bepalingen uit de
      [gemeentewet][ref2] zoals deze luidden voor de inwerkingtreding van de wet van 24 december 1970 houdende wijziging
      van de bepalingen inzake gemeentelijke en provinciale belastingen van kracht gedurende de in dat artikellid
      bedoelde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0006638#ArtikelXV
      [ref2]: https://wetten.overheid.nl/BWBR0005416
    url: https://wetten.overheid.nl/BWBR0006638/1995-05-17#ArtikelXVI
    references:
      - id: ref1
        bwb_id: BWBR0006638
        artikel: XV
      - id: ref2
        bwb_id: BWBR0005416
  - number: XVI.3
    text: |-
      De vervallen besluiten, of onderdelen daarvan, als bedoeld in [artikel XV][ref1] blijven van toepassing op de
      heffing ter zake van belastbare feiten die zich hebben voorgedaan vóór het tijdstip waarop de voorschriften zijn
      vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0006638#ArtikelXV
    url: https://wetten.overheid.nl/BWBR0006638/1995-05-17#ArtikelXVI
    references:
      - id: ref1
        bwb_id: BWBR0006638
        artikel: XV
  - number: XVII.1
    text: |-
      Als besluit inzake de baatbelasting als bedoeld in artikel 222, tweede lid, kan worden aangemerkt een besluit
      dat in verband met het treffen van dezelfde voorziening is genomen op grond van [artikel 273](onbekend),
      vierde lid, en [artikel 274, vierde lid, van de gemeentewet][ref1], dan wel [artikel 221][ref2], vierde lid, en
      [artikel 222, vierde lid, van de Gemeentewet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel274
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel221
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel222
    url: https://wetten.overheid.nl/BWBR0006638/1995-05-17#ArtikelXVII
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '274'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '221'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '222'
  - number: XVII.2
    text: |-
      Besluiten die zijn genomen op grond van [artikel 221][ref1], vierde lid, en
      [artikel 222, vierde lid, van de Gemeentewet][ref2], zoals deze luidden voor inwerkingtreding van deze wet, en
      die niet overeenkomstig [artikel 139 van de Gemeentewet][ref3] zijn bekendgemaakt, dienen na inwerkingtreding
      van de [onderdelen C en D van artikel III][ref4] van deze wet alsnog te worden bekendgemaakt overeenkomstig
      [artikel 139 van de Gemeentewet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel221
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel222
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel139
      [ref4]: https://wetten.overheid.nl/BWBR0006638#ArtikelIII
      [ref5]: https://wetten.overheid.nl/BWBR0005416#Artikel139
    url: https://wetten.overheid.nl/BWBR0006638/1995-05-17#ArtikelXVII
    references:
