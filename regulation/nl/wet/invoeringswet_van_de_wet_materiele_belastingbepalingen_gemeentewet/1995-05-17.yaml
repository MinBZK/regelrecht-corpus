        artikel: V
  - number: XIX.3
    text: |-
      Het eerste en het tweede lid vinden van rechtswege toepassing, ook in het geval waarin een verordening op een
      waterschapsomslag niet of niet geheel in overeenstemming is met de bepalingen van de [Waterschapswet][ref1], zoals
      die gelden met inachtneming van het bepaalde in die leden.


      [ref1]: https://wetten.overheid.nl/BWBR0005108
    url: https://wetten.overheid.nl/BWBR0006638/1995-05-17#ArtikelXIX
    references:
      - id: ref1
        bwb_id: BWBR0005108
  - number: XX
    text: |-
      Voor de plaatsing van deze wet in het *Staatsblad* worden de in deze wet voorkomende verwijzingen naar de
      [Gemeentewet][ref1] in andere wetten door Onze Minister van Binnenlandse Zaken in overeenstemming gebracht met de
      ingevolge artikel XXI vastgestelde nieuwe nummering van de artikelen van de paragrafen 1 tot en met 3 van hoofdstuk
      XV van de [Gemeentewet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005416
      [ref2]: https://wetten.overheid.nl/BWBR0005416
    url: https://wetten.overheid.nl/BWBR0006638/1995-05-17#ArtikelXX
    references:
      - id: ref1
        bwb_id: BWBR0005416
      - id: ref2
        bwb_id: BWBR0005416
  - number: XXI
    text: |-
      Voorafgaand aan de inwerkingtreding van deze wet wordt de tekst van de [Gemeentewet][ref1] in het *Staatsblad*
      geplaatst. Voor die plaatsing in het *Staatsblad* stelt Onze Minister van Binnenlandse Zaken de nummering van de
      artikelen van de paragrafen 1 tot en met 3 van hoofdstuk XV van de [Gemeentewet][ref2] opnieuw vast en brengt hij
      de in die wet voorkomende aanhalingen van die artikelen met de nieuwe nummering in overeenstemming.


      [ref1]: https://wetten.overheid.nl/BWBR0005416
      [ref2]: https://wetten.overheid.nl/BWBR0005416
    url: https://wetten.overheid.nl/BWBR0006638/1995-05-17#ArtikelXXI
    references:
      - id: ref1
        bwb_id: BWBR0005416
      - id: ref2
        bwb_id: BWBR0005416
  - number: XXII
    text: |-
      Indien het bij koninklijke boodschap van 8 juni 1990 ingediende voorstel van wet tot wijziging van de
      [Gemeentewet][ref1] met betrekking tot de materiële belastingbepalingen (kamerstukken II, 1989/90, 21 591) tot wet
      wordt verheven, treedt die wet in werking op hetzelfde tijdstip als waarop deze wet in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0005416
    url: https://wetten.overheid.nl/BWBR0006638/1995-05-17#ArtikelXXII
    references:
      - id: ref1
        bwb_id: BWBR0005416
  - number: XXIII.1
    text: |-
      Deze wet treedt in werking op 1 januari van het jaar volgend op de datum van uitgifte van het *Staatsblad* waarin
      zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0006638/1995-05-17#ArtikelXXIII
  - number: XXIII.2
    text: |-
      In afwijking van het eerste lid treden de [onderdelen C en D van artikel III][ref1] in werking op de eerste dag na
      de datum van uitgifte van het *Staatsblad* waarin zij wordt geplaatst, doch niet eerder dan het tijdstip waarop de
      [Gemeentewet][ref2] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0006638#ArtikelIII
      [ref2]: https://wetten.overheid.nl/BWBR0005416
    url: https://wetten.overheid.nl/BWBR0006638/1995-05-17#ArtikelXXIII
    references:
      - id: ref1
        bwb_id: BWBR0006638
        artikel: III
      - id: ref2
        bwb_id: BWBR0005416
  - number: XXIII.3
    text: |-
      In afwijking van het eerste lid treden de [onderdelen G, I en J van artikel III][ref1] in werking op de eerste dag
      na de datum van uitgifte van het *Staatsblad* waarin zij wordt geplaatst, doch niet eerder dan het tijdstip waarop
      de Wet aanpassing administratieve verplichtingen in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0006638#ArtikelIII
    url: https://wetten.overheid.nl/BWBR0006638/1995-05-17#ArtikelXXIII
    references:
      - id: ref1
        bwb_id: BWBR0006638
        artikel: III
  - number: XXIII.4
    text: |-
      Indien deze wet op hetzelfde tijdstip in werking treedt als de [Gemeentewet][ref1], treden
      [artikel III, onderdelen C en D][ref2], [artikel XV, derde lid][ref3], [artikel XVII, tweede lid][ref4], en
      [artikel XVIII][ref5], van deze wet niet in werking. Indien deze wet niet op hetzelfde tijdstip in werking treedt
      als de [Gemeentewet][ref6], treedt [artikel III, onderdeel M][ref7], en [artikel XVI, eerste lid][ref8], van deze
      wet niet in werking.


      [ref1]: https://wetten.overheid.nl/BWBR0005416
      [ref2]: https://wetten.overheid.nl/BWBR0006638#ArtikelIII
      [ref3]: https://wetten.overheid.nl/BWBR0006638#ArtikelXV
