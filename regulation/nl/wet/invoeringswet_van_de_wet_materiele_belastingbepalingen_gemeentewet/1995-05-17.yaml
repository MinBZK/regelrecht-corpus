        artikel: '120'
  - number: XIX.2
    text: |-
      Het eerste lid vindt toepassing met betrekking tot de heffing van omslagen ter zake van gebouwde en ongebouwde
      onroerende zaken die liggen in dat deel van het waterschapsgebied dat is gelegen in een in dat lid bedoelde
      gemeente, en uitsluitend voor zover het betreft de toepassing van een bepaling in de verordening op de
      onroerende-zaakbelastingen van die gemeente, die nog niet in overeenstemming is gebracht met de voorschriften
      van de [Gemeentewet][ref1], zoals deze luidt na de inwerkingtreding van deze wet. Indien een dergelijke
      bepaling binnen het genoemde tijdvak van twee jaren wel in overeenstemming is gebracht, blijven de alsdan met
      die in overeenstemming gebrachte bepaling strijdige bepalingen van de [artikelen 117][ref2], [118][ref3] en
      [120 van de Waterschapswet][ref4], zoals die luidden vóór de inwerkingtreding van deze wet, buiten toepassing
      en gelden de met die nieuwe bepaling overeenkomstige bepalingen van de artikelen 117, 118 en 120 van die wet,
      zoals die luiden na wijziging ingevolge [artikel V][ref5] van deze wet, met ingang van het tijdstip waarop de in
      overeenstemming gebrachte bepaling in de desbetreffende verordening op de onroerende-zaakbelastingen in werking
      is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0005416
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel117
      [ref3]: https://wetten.overheid.nl/BWBR0005108#Artikel118
      [ref4]: https://wetten.overheid.nl/BWBR0005108#Artikel120
      [ref5]: https://wetten.overheid.nl/BWBR0006638#ArtikelV
    url: https://wetten.overheid.nl/BWBR0006638/1995-05-17#ArtikelXIX
    references:
      - id: ref1
