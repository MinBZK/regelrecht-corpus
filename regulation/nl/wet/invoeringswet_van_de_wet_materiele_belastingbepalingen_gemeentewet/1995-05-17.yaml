  - number: XVIII.1
    text: |-
      Met betrekking tot de besluiten, bedoeld in [artikel XV, eerste, tweede en derde lid][ref1], blijft Hoofdstuk XV
      van de [Gemeentewet][ref2], zoals dit luidde voor de inwerkingtreding van deze wet, alsmede de op dat hoofdstuk
      berustende uitvoeringsvoorschriften van kracht gedurende de in die artikelleden bedoelde termijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0006638#ArtikelXV
      [ref2]: https://wetten.overheid.nl/BWBR0005416
    url: https://wetten.overheid.nl/BWBR0006638/1995-05-17#ArtikelXVIII
    references:
      - id: ref1
        bwb_id: BWBR0006638
        artikel: XV
      - id: ref2
        bwb_id: BWBR0005416
  - number: XVIII.2
    text: |-
      Met betrekking tot de besluiten, bedoeld in [artikel XV, vierde lid][ref1], blijven titel VI van de tweede
      afdeling, eerste en tweede hoofdstuk, van de [gemeentewet][ref2], alsmede de op die hoofdstukken berustende
      uitvoeringsvoorschriften van kracht gedurende de in dat artikellid bedoelde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0006638#ArtikelXV
      [ref2]: https://wetten.overheid.nl/BWBR0005416
    url: https://wetten.overheid.nl/BWBR0006638/1995-05-17#ArtikelXVIII
    references:
      - id: ref1
        bwb_id: BWBR0006638
        artikel: XV
      - id: ref2
        bwb_id: BWBR0005416
  - number: XIX.1
    text: |-
      Indien en zolang op 1 januari van enig kalenderjaar dat valt in het in [artikel XV, eerste lid][ref1],
      bedoelde tijdvak van twee jaren in een geheel of gedeeltelijk in het gebied van het waterschap gelegen gemeente
      een verordening op de onroerende-zaakbelastingen van toepassing is, waarvan een of meer bepalingen niet in
      overeenstemming zijn met de voorschriften van de [Gemeentewet][ref2], zoals deze luidt na de inwerkingtreding van
      deze wet, blijft [artikel V, onderdelen A, B en C][ref3], buiten toepassing en blijven de [artikelen 117][ref4],
      [118][ref5] en [120 van de Waterschapswet][ref6], zoals die luidden vóór de inwerkingtreding van deze wet, gelden
      met inachtneming van het bepaalde in de volgende leden.


      [ref1]: https://wetten.overheid.nl/BWBR0006638#ArtikelXV
      [ref2]: https://wetten.overheid.nl/BWBR0005416
      [ref3]: https://wetten.overheid.nl/BWBR0006638#ArtikelV
      [ref4]: https://wetten.overheid.nl/BWBR0005108#Artikel117
      [ref5]: https://wetten.overheid.nl/BWBR0005108#Artikel118
      [ref6]: https://wetten.overheid.nl/BWBR0005108#Artikel120
    url: https://wetten.overheid.nl/BWBR0006638/1995-05-17#ArtikelXIX
    references:
      - id: ref1
        bwb_id: BWBR0006638
        artikel: XV
