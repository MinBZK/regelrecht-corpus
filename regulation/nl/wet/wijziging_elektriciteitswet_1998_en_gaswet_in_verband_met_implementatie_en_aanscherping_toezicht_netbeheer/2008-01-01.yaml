  - number: VI.5
    text: |-
      Op een aanvraag om een besluit als bedoeld in
      [artikel 26, eerste lid, aanhef en onderdeel a, van de Elektriciteitswet 1998][ref1], die is ingediend voor het
      tijdstip waarop [artikel I, onderdeel CC][ref2], van deze wet in werking treedt, maar waarop op dat tijdstip nog
      niet is beslist, wordt beslist met toepassing van het recht zoals dat na het tijdstip van inwerkingtreding van
      [artikel I, onderdeel CC][ref3], van deze wet geldt. De eerste volzin is van overeenkomstige toepassing indien
      tegen een besluit als bedoeld in die volzin voor de inwerkingtreding van deze wet bezwaar is of kon worden gemaakt,
      maar daarop op het tijdstip van inwerkingtreding van deze wet nog niet is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0016958#ArtikelI
      [ref3]: https://wetten.overheid.nl/BWBR0016958#ArtikelI
    url: https://wetten.overheid.nl/BWBR0016958/2008-01-01#ArtikelVI
