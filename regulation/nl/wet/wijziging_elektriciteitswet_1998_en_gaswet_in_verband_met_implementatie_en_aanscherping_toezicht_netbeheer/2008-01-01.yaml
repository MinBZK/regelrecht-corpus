  - number: VI.3
    text: |-
      Met betrekking tot onderbrekingen in het transport van elektriciteit, bedoeld in
      [artikel 24b van de Elektriciteitswet 1998][ref1], opgetreden voor de inwerkingtreding van dit artikel, is
      [artikel 24b][ref2] niet van toepassing, maar de voorwaarden met betrekking tot de compensatie bij ernstige
      storingen, bedoeld in [artikel 31 van de wet][ref3], zoals [dat artikel][ref4] tot dat tijdstip luidde.


