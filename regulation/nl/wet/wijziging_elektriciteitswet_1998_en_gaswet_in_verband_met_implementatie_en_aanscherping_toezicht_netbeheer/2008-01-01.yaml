  - number: VI.8
    text: |-
      Indien op het tijdstip waarop [artikel I, onderdeel Q][ref1], in werking treedt, een aanvraag om een ontheffing
      als bedoeld in [artikel 15 van de Elektriciteitswet 1998][ref2] is ingediend, maar op dat tijdstip nog niet is
      beslist op die aanvraag, blijft het recht van toepassing zoals dat gold voor dat tijdstip. De vorige volzin is van
      overeenkomstige toepassing als op het moment waarop [artikel 15][ref3] in werking treedt, bezwaar is gemaakt tegen
      een besluit op grond van [artikel 15 van de Elektriciteitswet 1998][ref4], maar op dat tijdstip nog niet is beslist
      op dat bezwaar.


