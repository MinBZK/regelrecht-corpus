  - number: VII
    text: |-
      1 Ingeval op basis van [artikel 2, eerste lid, van de Gaswet][ref1] een netbeheerder is aangewezen
      voor de inwerkingtreding van deze wet, moet binnen zes maanden na de datum van inwerkingtreding van
      [artikel 3b van de Gaswet][ref2] worden voldaan aan [artikel 3b van de Gaswet][ref3].

      2 Het document, bedoeld in [artikel 8, tweede lid, van de Gaswet][ref4] wordt voor de eerste maal ingediend in het
      jaar na het jaar waarin deze wet in werking treedt.

      3 In afwijking van [artikel 13, tweede en vierde lid, van de Gaswet][ref5] worden in het jaar waarin
      [artikel II, onderdeel R][ref6], in werking treedt de in [artikel 13, tweede lid][ref7], bedoelde tarieven voor 1
      november ingediend en beslist de directeur binnen vier weken na ontvangst omtrent de goedkeuring van de tarieven.

      4 In afwijking van [artikel 18b, eerste lid, van de Gaswet][ref8] is een gasbedrijf verplicht in
      het jaar waarin dit wetsvoorstel tot wet wordt verheven en in werking treedt, voor 1 november de in
      [artikel 18b, eerste lid][ref9], bedoelde indicatie bekend te maken.

      5 Een geschil, aanhangig gemaakt bij de directeur-generaal op basis van de [artikelen 19][ref10] of
      [20 van de Gaswet][ref11] zoals deze luidden voor het tijdstip van inwerkingtreding van deze wet, wordt behandeld
      overeenkomstig de procedure zoals deze gold voor de inwerkingtreding van deze wet.

      6 Met betrekking tot beschikkingen, genomen krachtens [artikel 60a van de Gaswet][ref12], zoals dit luidde voor
      de inwerkingtreding van deze wet, zijn de [artikelen 60a][ref13], [60ac][ref14], [60af][ref15], [60ai][ref16] en
      [60aj van de Gaswet][ref17] van toepassing.

      7 Een besluit als bedoeld in [artikel 80, derde lid, van de Gaswet][ref18] dat is genomen voor de
      inwerkingtreding van [artikel II, onderdeel EEE][ref19], van deze wet, wordt na de inwerkingtreding
      van [artikel II, onderdeel EEE][ref20], van deze wet geacht een besluit te zijn op grond van
      [artikel 81a van de Gaswet][ref21]. Dit besluit kan worden gewijzigd om dit besluit aan te passen aan
      [artikel 81a van de Gaswet][ref22].

      8 Een besluit als bedoeld in [artikel 80, vierde lid, van de Gaswet][ref23] dat is genomen voor de
      inwerkingtreding van [artikel II, onderdeel EEE][ref24], van deze wet, wordt na de inwerkingtreding van
      [artikel II, onderdeel EEE][ref25], van deze wet geacht een besluit op grond van [artikel 81][ref26] te zijn. Dit
      besluit kan worden gewijzigd om dit besluit aan te passen aan [artikel 81 van de Gaswet][ref27].

      9 Tot op het moment van inwerkingtreding van [artikel II, onderdeel R][ref28], [artikel 12][ref29], geldt
      [artikel 13, eerste, tweede en derde lid][ref30], zoals dit luidde op de dag voor inwerkingtreding van deze wet.

      10 Het in [artikel II, onderdeel JJJa][ref31], opgenomen [artikel 85b][ref32] geldt niet voorzover het
      gastransportnet of rechten op het gastransportnet of rechten gevestigd op basis van toekomstige inkomsten uit het
      net beschikbaar worden gesteld als zekerheid op grond van verplichtingen die voortvloeien uit of verband houden met
      overeenkomsten, gesloten voor het tijdstip waarop [artikel II, onderdeel JJJa][ref33], in werking treedt.


