    text: |-
      1 De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld. In dat besluit wordt zo nodig
      toepassing gegeven aan [artikel 16 van de Tijdelijke referendumwet][ref1].

      2 [Artikel VI, zevende lid][ref2], werkt terug tot het tijdstip waarop de [Verordening nr. 1228/2003](32003R1228)
      van het Europees Parlement en de Raad van de Europese Unie van 26 juni 2003 (PbEG L 176) in werking is getreden.

      3 Onder toepassing van [artikel 16 van de Tijdelijke referendumwet][ref3] treedt
      [artikel I, onderdelen Za, en FF][ref4] met ingang van 1 juli 2004 in werking.

      4 Onder toepassing van [artikel 16 van de Tijdelijke referendumwet][ref5] treedt [artikel II, onderdeel O][ref6],
      in werking met ingang van 1 juli 2004


