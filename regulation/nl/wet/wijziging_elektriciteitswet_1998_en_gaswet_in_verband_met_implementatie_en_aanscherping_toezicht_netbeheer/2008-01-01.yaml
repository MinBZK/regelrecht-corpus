$id: wijziging_elektriciteitswet_1998_en_gaswet_in_verband_met_implementatie_en_aanscherping_toezicht_netbeheer
regulatory_layer: WET
publication_date: '2006-12-07'
valid_from: '2008-01-01'
bwb_id: BWBR0016958
url: https://wetten.overheid.nl/BWBR0016958/2008-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de Elektriciteitswet 1998 en de Gaswet aanpassing behoeven ter
    uitvoering van de richtlijn van 26 juni 2003, nr. 2003/54/EG, betreffende gemeenschappelijke regels voor de interne
    markt voor elektriciteit en houdende intrekking van Richtlijn 96/92/EG (PbEG L 176), van de Verordening van 26
    juni 2003, nr. 1228/2003, betreffende de voorwaarden voor toegang tot het net voor grensoverschrijdende handel in
    elektriciteit (PbEG L 176) en van de richtlijn van 26 juni 2003, nr. 2003/55/EG, betreffende gemeenschappelijke
    regels voor de interne markt voor aardgas en houdende intrekking van Richtlijn 98/30/EG (PbEG L 176) en dat de
    Elektriciteitswet 1998 en de Gaswet eveneens aanpassing behoeven om de betrouwbaarheid van het transport van
    elektriciteit en gas te waarborgen, de handhaving van beide wetten te versterken en voorzieningen te kunnen treffen
    ingeval van tekortkomingen in het netbeheer;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0016958/2008-01-01#ArtikelAanhef
articles:
  - number: VI
    text: |-
      1 Met betrekking tot beschikkingen, genomen krachtens het bij deze wet vervallen
      [artikel 5a van de Elektriciteitswet 1998][ref1], zijn de [artikelen 77g][ref2], [77h][ref3], [77k][ref4],
      [77n][ref5] en [77o van de Elektriciteitswet 1998][ref6] van toepassing.

      2 Ingeval op basis van [artikel 10, derde lid, van de Elektriciteitswet 1998][ref7] een netbeheerder is aangewezen
      voor de inwerkingtreding van deze wet, moet binnen zes maanden na de datum van inwerkingtreding van deze wet zijn
      voldaan aan [artikel 10a van de Elektriciteitswet 1998][ref8].

      3 Met betrekking tot onderbrekingen in het transport van elektriciteit, bedoeld in
      [artikel 24b van de Elektriciteitswet 1998][ref9], opgetreden voor de inwerkingtreding van dit artikel, is
      [artikel 24b][ref10] niet van toepassing, maar de voorwaarden met betrekking tot de compensatie bij ernstige
      storingen, bedoeld in [artikel 31 van de wet][ref11], zoals [dat artikel][ref12] tot dat tijdstip luidde.

      4 Een besluit op grond van [artikel 26, eerste lid, aanhef en onderdeel a, van de Elektriciteitswet 1998][ref13],
      dat voor het tijdstip van inwerkingtreding van [artikel I, onderdeel CC][ref14], van deze wet onherroepelijk is
      geworden, wordt geacht een besluit op grond van [artikel 86c van de Elektriciteitswet 1998][ref15] te zijn.

      5 Op een aanvraag om een besluit als bedoeld in
      [artikel 26, eerste lid, aanhef en onderdeel a, van de Elektriciteitswet 1998][ref16], die is ingediend voor het
      tijdstip waarop [artikel I, onderdeel CC][ref17], van deze wet in werking treedt, maar waarop op dat tijdstip nog
      niet is beslist, wordt beslist met toepassing van het recht zoals dat na het tijdstip van inwerkingtreding van
      [artikel I, onderdeel CC][ref18], van deze wet geldt. De eerste volzin is van overeenkomstige toepassing indien
      tegen een besluit als bedoeld in die volzin voor de inwerkingtreding van deze wet bezwaar is of kon worden gemaakt,
      maar daarop op het tijdstip van inwerkingtreding van deze wet nog niet is beslist.

      6 Indien de directeur van de dienst tussen het tijdstip waarop de [Verordening nr. 1228/2003](32003R1228) van
      het Europees Parlement en de Raad van de Europese Unie van 26 juni 2003 (PbEG L 176) in werking is getreden en
      het tijdstip waarop [artikel I, onderdeel CC][ref19], van deze wet in werking treedt, beslist op een aanvraag om
      een besluit als bedoeld in [artikel 26, eerste lid, onderdeel a, van de Elektriciteitswet 1998][ref20], houdt hij
      rekening met het bepaalde in de Verordening en neemt hij in ieder geval geen beslissing die afbreuk kan doen aan de
      werking van die Verordening. De eerste volzin is van overeenkomstige toepassing als de directeur van de dienst in
      de periode, genoemd in die volzin, beslist op een bezwaar tegen een besluit als bedoeld in die volzin.

      7 Een geschil, aanhangig gemaakt bij de directeur-generaal van de Nederlandse mededingingsautoriteit op basis
      van [artikel 51][ref21] of [52 van de Elektriciteitswet 1998][ref22] zoals deze luidden voor het tijdstip van
      inwerkingtreding van deze wet, wordt behandeld overeenkomstig de procedure, zoals gold voor de inwerkingtreding van
      deze wet.

      8 Indien op het tijdstip waarop [artikel I, onderdeel Q][ref23], in werking treedt, een aanvraag om een ontheffing
      als bedoeld in [artikel 15 van de Elektriciteitswet 1998][ref24] is ingediend, maar op dat tijdstip nog niet is
      beslist op die aanvraag, blijft het recht van toepassing zoals dat gold voor dat tijdstip. De vorige volzin is
      van overeenkomstige toepassing als op het moment waarop [artikel 15][ref25] in werking treedt, bezwaar is gemaakt
      tegen een besluit op grond van [artikel 15 van de Elektriciteitswet 1998][ref26], maar op dat tijdstip nog niet is
      beslist op dat bezwaar.

      9 Een besluit als bedoeld in [artikel 41, derde lid, van de Elektriciteitswet 1998][ref27] dat is
      genomen voor de inwerkingtreding van [artikel I, onderdeel OO][ref28], van deze wet, wordt na de
      inwerkingtreding van [artikel I, onderdeel OO][ref29], van deze wet geacht een besluit te zijn op grond van
      [artikel 41a van de Elektriciteitswet 1998][ref30]. Dit besluit kan worden gewijzigd om dit besluit aan te passen
      aan [artikel 41a van de Elektriciteitswet 1998][ref31].

      10 Een besluit als bedoeld in [artikel 41, vierde lid, van de Elektriciteitswet 1998][ref32] dat
      is genomen voor de inwerkingtreding van [artikel I, onderdeel OO][ref33], van deze wet, wordt na de
      inwerkingtreding van [artikel I, onderdeel OO][ref34], van deze wet geacht een besluit op grond van
      [artikel 41 van de Elektriciteitswet 1998][ref35] te zijn. Dit besluit kan worden gewijzigd om dit besluit aan te
      passen aan [artikel 41 van de Elektriciteitswet 1998][ref36].

      11 Op het moment dat in [artikel I, onderdeel II, onder 13][ref37], opgenomen
      [artikel 31, tiende en elfde lid][ref38], in werking treden, vervallen [artikel 36, tweede lid][ref39], en
      [artikel 38, vierde lid][ref40].

      12 Het in [artikel I, onderdeel EEEa][ref41], opgenomen [artikel 93b][ref42] geldt niet voorzover het net of
      rechten op het net of rechten gevestigd op basis van toekomstige inkomsten uit het net beschikbaar worden gesteld
      als zekerheid op grond van verplichtingen die voortvloeien uit of verband houden met overeenkomsten, gesloten voor
      het tijdstip waarop [artikel I, onderdeel EEEa][ref43], in werking treedt.


