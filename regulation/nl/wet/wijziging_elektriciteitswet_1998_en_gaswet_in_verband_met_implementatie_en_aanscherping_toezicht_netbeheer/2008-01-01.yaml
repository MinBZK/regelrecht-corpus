    text: |-
      Het in [artikel II, onderdeel JJJa][ref1], opgenomen [artikel 85b][ref2] geldt niet voorzover het gastransportnet
      of rechten op het gastransportnet of rechten gevestigd op basis van toekomstige inkomsten uit het net beschikbaar
      worden gesteld als zekerheid op grond van verplichtingen die voortvloeien uit of verband houden met overeenkomsten,
      gesloten voor het tijdstip waarop [artikel II, onderdeel JJJa][ref3], in werking treedt.


