  - number: VI.6
    text: |-
      Indien de directeur van de dienst tussen het tijdstip waarop de [Verordening nr. 1228/2003](32003R1228) van het
      Europees Parlement en de Raad van de Europese Unie van 26 juni 2003 (PbEG L 176) in werking is getreden en het
      tijdstip waarop [artikel I, onderdeel CC][ref1], van deze wet in werking treedt, beslist op een aanvraag om een
      besluit als bedoeld in [artikel 26, eerste lid, onderdeel a, van de Elektriciteitswet 1998][ref2], houdt hij
      rekening met het bepaalde in de Verordening en neemt hij in ieder geval geen beslissing die afbreuk kan doen aan de
      werking van die Verordening. De eerste volzin is van overeenkomstige toepassing als de directeur van de dienst in
      de periode, genoemd in die volzin, beslist op een bezwaar tegen een besluit als bedoeld in die volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0016958#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel26
    url: https://wetten.overheid.nl/BWBR0016958/2008-01-01#ArtikelVI
    references:
      - id: ref1
