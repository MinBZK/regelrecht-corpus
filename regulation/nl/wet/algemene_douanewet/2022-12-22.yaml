  - number: 1:3.5
    text: |-
      Onze Minister van Financiën sluit met Onze Ministers wie het mede aangaat convenanten aangaande de kwantitatieve
      en kwalitatieve inzet van de functionarissen die ressorteren onder de rijksbelastingdienst met betrekking tot de
      douanecontrole van het bepaalde bij of krachtens een bindende EU-rechtshandeling of ander wettelijk voorschrift dat
      is opgenomen in de bijlage bij deze wet. Onze Minister van Financiën plaatst deze convenanten in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel13
  - number: 1:3.6
    text: |-
      Hetgeen in deze wet en de daarop berustende bepalingen is bepaald ten aanzien van de rechten bij invoer, is van
      overeenkomstige toepassing op de rechten bij uitvoer, tenzij anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel13
  - number: 1:3.7
    text: |-
      Indien in het Douanewetboek van de Unie, de Gedelegeerde Verordening Douanewetboek van de Unie of de
      Uitvoeringsverordening Douanewetboek van de Unie bevoegdheden zijn opgedragen aan de lidstaten worden die
      bevoegdheden uitgeoefend door de inspecteur onderscheidenlijk de ontvanger. Hiervan kan worden afgeweken bij of
      krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel13
  - number: 1:3.8
    text: |-
      Onze Minister van Financiën is de verwerkingsverantwoordelijke, bedoeld in artikel 4, zevende lid, van Verordening
      (EU) 2016/679 van het Europees Parlement en de Raad van 27 april 2016 betreffende de bescherming van natuurlijke
      personen in verband met de verwerking van persoonsgegevens en betreffende het vrije verkeer van gegevens en tot
      intrekking van [Richtlijn 95/46/EG](31995L0046) (algemene verordening gegevensbescherming) (PbEU 2016, L 119).
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel13
  - number: 1:4.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen, ter uitwerking van interregionaal recht, het Koninkrijk
      verbindende verdragen en in al hun onderdelen verbindende besluiten van bij zodanige verdragen opgerichte
      volkenrechtelijke organisaties, regels van uitvoerende aard worden gesteld, die op goederen bij het binnenbrengen
      in, onderscheidenlijk verlaten van de gebieden, bedoeld in [artikel 1:2][ref1], van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1.1'
  - number: 1:4.2
    text: |-
      Bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur kunnen, met betrekking tot de
      uitvoering van bindende EU-rechtshandelingen, regels van uitvoerende aard worden gesteld, die op goederen bij het
      binnenbrengen in, onderscheidenlijk verlaten van de gebieden, bedoeld in [artikel 1:2][ref1], van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1.1'
  - number: 1:4.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ter uitwerking van regelingen van
      internationaal recht tot het verlenen van wederzijdse administratieve bijstand.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel14
  - number: 1:4.4
    text: |-
      Onze Minister wie het aangaat, kan bevoegdheden, welke hem ingevolge het gestelde bij de in het eerste lid bedoelde
      algemene maatregel van bestuur toekomen, in een bij of krachtens die maatregel te bepalen omvang, aan het bestuur
      van een zelfstandig bestuursorgaan overdragen en ten aanzien van de uitvoering ervan regels stellen.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel14
  - number: 1:5
    text: |-
      Bij de toepassing van de bepalingen bij of krachtens deze wet ingevolge [artikel 1:1][ref1], tweede tot en met
      vijfde lid, zijn de bepalingen van titel I, hoofdstuk 1, de artikelen 12, 14, 15, 22 tot en met 30, 43 tot en
      met 48, 51, 52 en 55, en de bepalingen van titel II, hoofdstukken 1 en 2, afdeling 1, van het Douanewetboek van
      de Unie, de bepalingen van titel I, hoofdstuk 1, de artikelen 8 tot en met 18, en de bepalingen van titel II,
      hoofdstuk 1, afdeling 1, van de Gedelegeerde Verordening Douanewetboek van de Unie en de bepalingen van titel
      I, hoofdstuk 1, de artikelen 8, 9, 12 en 15, en de bepalingen van titel II, hoofdstuk 2, afdeling 1, van de
      Uitvoeringsverordening Douanewetboek van de Unie van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1.1'
  - number: 1:6
    text: |-
      Voor de toepassing van de bepalingen gesteld bij of krachtens deze wet blijft de
      [titel 5.2 van de Algemene wet bestuursrecht][ref1] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 1:7
    text: Waar een persoon woont dan wel is gevestigd, wordt naar de omstandigheden beoordeeld.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel17
  - number: 1:8
    text: |-
      De [artikelen 2:1][ref1] en [2:2 van de Algemene wet bestuursrecht][ref2] zijn alleen van toepassing in geval van
      het instellen van bezwaar en de daarbij behorende procedure.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '2'
  - number: 1:10.1
    text: |-
      Een douanevertegenwoordiger die een persoon vertegenwoordigt bij het doen van een douaneaangifte, een aangifte tot
      tijdelijke opslag, een summiere aangifte bij binnenbrengen, een summiere aangifte bij uitgaan, een aangifte tot
      wederuitvoer of een kennisgeving van wederuitvoer moet voldoen aan de criteria van artikel 39, onderdelen a tot en
      met d, van het Douanewetboek van de Unie.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel110
  - number: 1:10.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitwerking van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel110
  - number: 1:11
    text: |-
      De douanevertegenwoordiger, bedoeld in [artikel 1:10][ref1], is gehouden aan zijn opdrachtgever een factuur te
      verstrekken waarin ten behoeve van deze laatste aan het Rijk betaalde rechten bij invoer, andere belastingen,
      heffingen, retributies, dan wel rente, interest, kosten en bestuurlijke boeten voorzover aan zijn opdrachtgever te
      wijten, afzonderlijk zijn omschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: 1.2.1
        afdeling: '1.2'
  - number: 1:12.1
    text: |-
      Douanevertegenwoordigers als bedoeld in [artikel 1:10][ref1] hebben een voorrecht op alle vermogensbestanddelen
      van de opdrachtgever voor de door hen ten behoeve van hun opdrachtgever betaalde rechten bij invoer, andere
      belastingen, heffingen, retributies dan wel rente, interest, kosten en bestuurlijke boeten voor zover aan zijn
      opdrachtgever te wijten gedurende een jaar na de aan het Rijk gedane betaling.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: 1.2.1
        afdeling: '1.2'
  - number: 1:12.2
    text: |-
      Het in het eerste lid toegekende voorrecht heeft gelijke rangorde als het in
      [artikel 21 van de Invorderingswet 1990][ref1] toegekende voorrecht van ’s Rijks schatkist, met dien verstande dat
      dit laatste voorrecht voorgaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel21
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '21'
  - number: 1:14
    text: |-
      De bevoegdheden van een persoon, anders dan een natuurlijk persoon, kunnen worden uitgeoefend en zijn
      verplichtingen kunnen worden nagekomen door iedere bestuurder.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel114
  - number: 1:15.1
    text: |-
      De bevoegdheden en de verplichtingen van een minderjarige, een onder curatele gestelde, iemand die in staat van
      faillissement is verklaard of ten aanzien van wie de schuldsaneringsregeling natuurlijke personen van toepassing
      is, of iemand wiens vermogen onder bewind is gesteld, kunnen worden uitgeoefend en nagekomen door een wettelijke
      vertegenwoordiger, curator of bewindvoerder. Op vordering van de inspecteur zijn laatstgenoemden tot nakoming van
      de verplichtingen gehouden.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel115
  - number: 1:15.2
    text: |-
      Om geldige redenen kan de inspecteur de vertegenwoordiging, bedoeld in het eerste lid, uitsluiten in de nakoming
      van een verplichting van hem die zelf tot die nakoming in staat is.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel115
  - number: 1:16.1
    text: |-
      Na iemands overlijden kunnen zijn rechtverkrijgenden onder algemene titel in het uitoefenen van de bevoegdheden
      en in het nakomen van de verplichtingen, welke de overledene zou hebben gehad, ware hij in leven gebleven, worden
      vertegenwoordigd door een hunner, de executeur, de door de rechter benoemde vereffenaar van de nalatenschap of de
      bewindvoerder over de nalatenschap. Op vordering van de inspecteur is ieder der in dit lid genoemde personen tot
      nakoming van die verplichtingen gehouden.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel116
  - number: 1:16.2
    text: |-
      Stukken betreffende de aangelegenheden van de overledene kunnen worden gericht aan een van de in het eerste lid
      genoemde personen.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel116
  - number: 1:17
    text: Deze paragraaf is niet van toepassing op strafvordering.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel117
  - number: 1:18.1
    text: |-
      Een beschikking als bedoeld in artikel 5, aanhef en onderdeel 39, van het Douanewetboek van de Unie wordt
      gelijkgesteld met een beschikking als bedoeld in [artikel 1:3, tweede lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
  - number: 1:18.2
    text: |-
      De toestemming gegeven door de ambtenaar, bedoeld in [artikel 1:28, zesde lid][ref1], wordt aangemerkt als een
      beschikking genomen door de inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: 1.2.4
        afdeling: '1.2'
  - number: 1:18.3
    text: |-
      Het doen van aangifte is geen aanvraag in de zin van
      [artikel 1:3, derde lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
  - number: 1:18.4
    text: |-
      [Artikel 3:40 van de Algemene wet bestuursrecht][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 1:18.5
    text: |-
      In afwijking van [artikel 3:41, eerste lid, van de Algemene wet bestuursrecht][ref1] kan de bekendmaking dan wel
      kennisgeving van beschikkingen op mondelinge verzoeken mondeling aan de verzoeker geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 1:18.6
    text: |-
      [Artikel 3:45 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op beschikkingen als bedoeld in
      artikel 22, zevende lid, van het Douanewetboek van de Unie.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 1:18.7
    text: |-
      [Afdeling 3.7 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op schriftelijk genomen beschikkingen
      waarbij verzoeken niet worden ingewilligd of die ongunstige gevolgen hebben voor de personen tot wie zij zijn
      gericht.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.7
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.7'
  - number: 1:18.8
    text: |-
      [Artikel 4:2 van de Algemene wet bestuursrecht][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 1:18.9
    text: |-
      [Artikel 4:5, eerste lid, van de Algemene wet][ref1] bestuursrecht is niet van toepassing indien op grond van
      artikel 6, tweede lid, van het Douanewetboek van de Unie gemeenschappelijke gegevensvereisten zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 1:18.10
    text: |-
      [Afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
  - number: 1:18.11
    text: |-
      [Afdeling 4.1.3, paragraaf 4.1.3.1, van de Algemene wet bestuursrecht][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.1
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.1
  - number: 1:19.1
    text: |-
      Bij algemene maatregel van bestuur worden de gevallen vastgesteld waarin de belanghebbende ter zake van het
      verrichten van werkzaamheden kosten aan het Rijk is verschuldigd.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel119
  - number: 1:19.2
    text: |-
      Bij regeling van Onze Minister van Financiën wordt het tarief van kosten die verschuldigd zijn krachtens het eerste
      lid, vastgesteld.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel119
  - number: 1:19.3
    text: Het tarief wordt zodanig vastgesteld dat de verschuldigde kosten de werkelijke kosten zoveel mogelijk benaderen.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel119
  - number: 1:19.4
    text: De inspecteur stelt het bedrag van de door belanghebbende verschuldigde kosten vast.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel119
  - number: 1:20
    text: |-
      Deze paragraaf is van toepassing op douanetoezicht of douanecontrole op de voet van het bij of krachtens deze wet
      bepaalde.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel120
  - number: 1:21
    text: |-
      De inspecteur maakt van zijn bevoegdheden slechts gebruik voorzover dat redelijkerwijs voor de vervulling van zijn
      taak nodig is.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel121
  - number: 1:22.1
    text: |-
      Bij de uitoefening van zijn taak namens de inspecteur draagt de ambtenaar een legitimatiebewijs bij zich, afgegeven
      door Onze Minister wie het aangaat of een door hem aangewezen ambtenaar.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel122
  - number: 1:22.2
    text: |-
      Onverminderd [artikel 1, eerste en tweede lid, van de Algemene wet op het binnentreden][ref1] toont hij zijn
      legitimatiebewijs desgevraagd onverwijld.


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel1
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0006763
        artikel: '1'
  - number: 1:22.3
    text: |-
      Het model van het legitimatiebewijs is het krachtens
      [artikel 5:12, derde lid, van de Algemene wet bestuursrecht][ref1] vastgestelde model.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 1:23.1
    text: De inspecteur is bevoegd, met medeneming van de benodigde apparatuur of dieren elke plaats te betreden.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel123
  - number: 1:23.2
    text: Hij is bevoegd zich te doen vergezellen door personen die daartoe door hem zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel123
  - number: 1:23.3
    text: |-
      Het betreden van een woning zonder toestemming van de bewoner mag slechts door ambtenaren die deze bevoegdheid door
      de inspecteur toegekend hebben gekregen.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel123
  - number: 1:23.4
    text: |-
      De inspecteur is bevoegd tot het geven van een machtiging als bedoeld in
      [artikel 2 van de Algemene wet op het binnentreden][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel2
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0006763
        artikel: '2'
  - number: 1:23.5
    text: |-
      Ten aanzien van woningen op of in vervoermiddelen zijn de [artikelen 5, eerste lid][ref1], en
      [7 van de Algemene wet op het binnentreden][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006763#Artikel7
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0006763
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0006763
        artikel: '7'
  - number: 1:24.1
    text: |-
      De inspecteur is bevoegd over te gaan tot een onderzoek van goederen en het eventueel nemen van monsters voor
      analyse of grondige controle ingeval geen aanvaarding van een douaneaangifte heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel124
  - number: 1:24.2
    text: |-
      Voor de toepassing van het eerste lid is artikel 189 van het Douanewetboek van de Unie en Deel I, Titel V,
      hoofdstuk 3, van de Uitvoeringsverordening Douanewetboek van de Unie van overeenkomstige toepassing, tenzij het
      doel of de aard van het onderzoek zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel124
  - number: 1:24.3
    text: |-
      Ten behoeve van het onderzoek is, op vordering van de inspecteur, de persoon die goederen vervoert die zich niet in
      of op een vervoermiddel bevinden, gehouden terstond stil te staan.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel124
  - number: 1:24.4
    text: |-
      Bij regeling van Onze Minister van Justitie en Veiligheid wordt bepaald op welke wijze de vordering tot stilhouden
      wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel124
  - number: 1:24.5
    text: De belanghebbende bij de goederen wordt voor de werking van dit artikel aangemerkt als aangever.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel124
  - number: 1:25.1
    text: |-
      Het onderzoek van een groep of partij goederen of de controle achteraf van de aangiften kan geschieden door middel
      van een gedeeltelijk onderzoek.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel125
  - number: 1:25.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels gegeven worden omtrent de wijze van het uitvoeren van
      een gedeeltelijk onderzoek.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel125
  - number: 1:25.3
    text: |-
      Bij of krachtens de algemene maatregel van bestuur, bedoeld in het tweede lid, kunnen de maatstaven worden
      vastgesteld aan de hand waarvan de resultaten van het onderzoek van goederen dan wel de controle achteraf van
      aangiften, deel uitmakend van het deelonderzoek, als beslissend wordt aangemerkt voor de gehele groep of partij
      goederen waartoe de onderzochte goederen onderscheidenlijk de gehele groep van aangiften waartoe de gecontroleerde
      aangiften behoren.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel125
  - number: 1:25.4
    text: |-
      Voor de toepassing van dit artikel is, voor zover het een gedeeltelijk onderzoek van goederen betreft, artikel 190,
      eerste lid, tweede alinea, van het Douanewetboek van de Unie van overeenkomstige toepassing, met dien verstande dat
      de belanghebbende bij de goederen wordt aangemerkt als aangever.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel125
  - number: 1:26.1
    text: 'De inspecteur is bevoegd aan controle te onderwerpen:'
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel126
  - number: 1:26.1.a
    text: |-
      gebouwen, niet zijnde woningen, en terreinen: - ten aanzien waarvan ingevolge het bepaalde bij of krachtens de in
      [artikel 1:1, eerste lid][ref1], bedoelde regelingen een beschikking is genomen;
        - die erkend zijn als grensinspectiepost als bedoeld in artikel 2, tweede lid, onderdeel g, van [Richtlijn 97/78/
      EG](31997L0078) van de Raad van 18 december 1997 tot vaststelling van de beginselen voor de organisatie van de
      veterinaire controles voor producten die uit derde landen in de Gemeenschap worden binnengebracht (PbEG 1998,
      L 24);
        - die een goedgekeurde plaats van inspectie zijn als bedoeld in artikel 1, tweede lid, onderdeel b, van [Richtlijn
      2004/103/EG](32004L0103) van de Commissie van 7 oktober 2004 betreffende de controles van de identiteit en de
      fytosanitaire controles van in deel B van bijlage V bij [Richtlijn 2000/29/EG](32000L0029) van de Raad opgenomen
      planten, plantaardige producten en andere materialen, die kunnen worden uitgevoerd op een andere plaats dan de
      plaats van binnenkomst in de Gemeenschap of op een dichtbijgelegen plaats en tot vaststelling van de eisen met
      betrekking tot deze controles (PbEU 2004, L 313);


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1.1'
  - number: 1:26.1.b
    text: |-
      gebouwen, niet zijnde woningen, en terreinen alwaar zich goederen bevinden: - ten aanzien waarvan ingevolge het
      bepaalde bij of krachtens de in [artikel 1:1, eerste lid][ref1], bedoelde regelingen een beschikking is genomen;
        - waarvoor een invoer- of uitvoervergunning is afgegeven, dan wel waarvoor een dergelijke vergunning is
      aangevraagd;


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1.1'
  - number: 1:26.1.c
    text: |-
      spoorwegemplacementen, plaatsen voor distributie en overslag voor goederen die over de weg worden vervoerd, havens,
      haventerreinen, luchthavens en luchtvaartterreinen;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel126
  - number: 1:26.1.d
    text: vervoermiddelen en de op of in die vervoermiddelen aanwezige woningen.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel126
  - number: 1:26.2
    text: Onder controle in de zin van het eerste lid wordt mede verstaan doorzoeking.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel126
  - number: 1:26a.1
    text: |-
      Gebruikers van gebouwen, niet zijnde woningen, en terreinen, spoorwegemplacementen, plaatsen voor distributie en
      overslag voor goederen die over de weg worden vervoerd, havens, haventerreinen, luchthavens en luchtvaartterreinen,
      als bedoeld in [artikel 1:26][ref1] stellen op aanwijzing van de inspecteur kosteloos kantoorruimtes en andere
      ruimtes ter beschikking ter uitvoering van ambtelijke werkzaamheden als bedoeld in deze wet, op deze wet berustende
      bepalingen en de bepalingen, bedoeld in [artikel 1:1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel126a
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: 1.2.4
        afdeling: '1.2'
      - id: ref2
        bwb_id: BWBR0023746
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1.1'
  - number: 1:26a.2
    text: De ruimte voldoet aan de eisen gesteld bij de aanwijzing.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel126a
  - number: 1:27.1
    text: |-
      De inspecteur is bevoegd met het oog op de uitoefening van de bevoegdheden, bedoeld in de [artikelen 1:23][ref1],
      [1:24][ref2] dan wel [1:26, aanhef en onder d][ref3], van de bestuurder dan wel de gezagvoerder van het
      vervoermiddel te vorderen dat deze zijn vervoermiddel vaart laat minderen, bijdraait, landt, stilhoudt, naar een
      door hem aangewezen plaats overbrengt, aanlegt en de motor buiten werking stelt. De in dit lid bedoelde personen
      zijn gehouden aan de vordering te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0023746#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: 1.2.4
        afdeling: '1.2'
      - id: ref2
        bwb_id: BWBR0023746
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: 1.2.4
        afdeling: '1.2'
      - id: ref3
        bwb_id: BWBR0023746
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: 1.2.4
        afdeling: '1.2'
  - number: 1:27.2
    text: |-
      Bij regeling van Onze Minister van Justitie en Veiligheid wordt bepaald op welke wijze de vordering tot stilhouden
      wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel127
  - number: 1:28.1
    text: |-
      De inspecteur is bevoegd personen die aanwezig zijn in of op de in [artikel 1:26][ref1] bedoelde locaties of
      vervoermiddelen of deze juist gaan betreden of hebben verlaten aan lijfsvisitatie te onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: 1.2.4
        afdeling: '1.2'
  - number: 1:28.2
    text: |-
      De in het eerste lid bedoelde personen zijn op vordering van de inspecteur gehouden stil te staan en deze te volgen
      naar een door hem aangewezen plaats.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel128
  - number: 1:28.3
    text: |-
      Op vordering van de inspecteur zijn reizigers, die zich bevinden in een vervoermiddel dat juist het douanegebied
      van de Unie is binnengekomen of dat bestemd is om aanstonds te vertrekken om dat douanegebied te verlaten, gehouden
      hun plaats- of vervoerbewijs te vertonen. Deze verplichting geldt eveneens voor reizigers die een dergelijk
      vervoermiddel juist hebben verlaten dan wel die op het punt staan daarin aan boord te gaan.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel128
  - number: 1:28.4
    text: |-
      Lijfsvisitatie geschiedt op een besloten plaats door personen die, indien zij geen arts of verpleegkundige zijn,
      van hetzelfde geslacht zijn als de persoon die aan lijfsvisitatie wordt onderworpen.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel128
  - number: 1:28.5
    text: 'Onder lijfsvisitatie wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel128
  - number: 1:28.5.a
    text: |-
      het onderzoek aan de kleding; het onderzoek aan de kleding omvat het betasten van de kleding, het nauwkeurig
      onderzoek van de hoofdbedekking en het schoeisel;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel128
  - number: 1:28.5.b
    text: het verwijderen van de bovenkleding, teneinde deze aan een nauwkeurig onderzoek te onderwerpen;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel128
  - number: 1:28.5.c
    text: |-
      het uitwendig en inwendig schouwen van de openingen en holten van het bovenlichaam, zonodig met de daartoe
      benodigde ontkleding;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel128
  - number: 1:28.5.d
    text: het geheel ontkleden en het uitwendig schouwen van het lichaam;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel128
  - number: 1:28.5.e
    text: |-
      het onderzoek van het onderlichaam; onder onderzoek van het onderlichaam wordt verstaan het uitwendig schouwen van
      de openingen en holten van het onderlichaam; het uitwendig schouwen van de openingen en holten van het onderlichaam
      wordt verricht door een arts of, in diens opdracht, door een verpleegkundige.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel128
  - number: 1:28.6
    text: |-
      Tot gehele ontkleding dan wel het onderzoek van het onderlichaam van degene die aan lijfsvisitatie wordt
      onderworpen, wordt pas overgegaan na toestemming van een ambtenaar die daartoe bij regeling van Onze Minister van
      Financiën, in overeenstemming met Onze Minister wie het mede aangaat, is aangewezen.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel128
  - number: 1:28.7
    text: |-
      Onder lijfsvisitatie wordt mede verstaan het onderzoek met behulp van apparatuur waarmee door kleding van de
      betrokken persoon kan worden gekeken.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel128
  - number: 1:28.8
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden vastgesteld met betrekking tot het geheel
      ontkleden of het onderzoek van het onderlichaam en met betrekking tot de apparatuur waarmee door kleding van
      personen kan worden gekeken en het gebruik daarvan. Hierbij kan worden bepaald dat het vierde lid niet van
      toepassing is bij het gebruik van deze apparatuur.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel128
  - number: 1:29
    text: |-
      Onze Minister van Financiën is bevoegd, na overleg met Onze Minister wie het mede aangaat, te bepalen, dat in het
      belang van controle en onderzoek op openbare land- en waterwegen versperringen worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel129
  - number: 1:30.1
    text: |-
      De inspecteur en de ambtenaren die namens hem een taak uitoefenen zijn bevoegd bij een controle geweld te gebruiken
      wanneer het daarmee beoogde doel dit, mede gelet op de aan het gebruik van geweld verbonden gevaren, rechtvaardigt
      en dat doel niet op een andere wijze kan worden bereikt.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel130
  - number: 1:30.2
    text: Aan het gebruik van geweld gaat zo mogelijk een waarschuwing vooraf.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel130
  - number: 1:30.3
    text: |-
      De ambtenaren die namens de inspecteur een taak uitoefenen zijn bevoegd tot het onderzoek aan de kleding van
      personen indien uit feiten of omstandigheden blijkt dat een onmiddellijk gevaar dreigt voor leven of veiligheid van
      de ambtenaren zelf of van derden en dit onderzoek noodzakelijk is ter afwending van dit gevaar.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel130
  - number: 1:30.4
    text: |-
      De inspecteur en de ambtenaren die namens hem een taak uitoefenen zijn bevoegd bij toepassing van het eerste lid
      de hulp in te roepen van de politie en de Koninklijke marechaussee of andere delen van de krijgsmacht. Deze zijn
      verplicht aan de vordering onmiddellijk te voldoen.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel130
  - number: 1:30.5
    text: |-
      De uitoefening van de bevoegdheden, bedoeld in het eerste en derde lid, dient in verhouding tot het beoogde doel
      redelijk en gematigd te zijn.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel130
  - number: 1:30.6
    text: Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel130
  - number: 1:31.1
    text: |-
      Het nemen van de nodige maatregelen, bedoeld in de artikelen 147, vierde lid, 198, eerste lid, en 215, derde lid,
      van het Douanewetboek van de Unie, wordt aangemerkt als het opleggen van een last onder bestuursdwang.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel131
  - number: 1:31.2
    text: |-
      Onverminderd het eerste lid is de inspecteur bevoegd tot oplegging van een last onder bestuursdwang ter handhaving
      van de bij of krachtens de in [artikel 1:1][ref1] bedoelde regelingen of bij of krachtens deze wet gestelde
      verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1.1'
  - number: 1:32.1
    text: |-
      Onverminderd [artikel 1:5][ref1] van deze wet en de EU-regelgeving ter zake, zijn
      [artikel 15i van Boek 3 van het Burgerlijk Wetboek][ref2] en de [artikelen 10][ref3] en
      [24 van Boek 2 van het Burgerlijk Wetboek][ref4] van overeenkomstige toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel15i
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel24
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1.1'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: 15i
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '10'
      - id: ref4
        bwb_id: BWBR0003045
        artikel: '24'
  - number: 1:32.1.a
    text: 'op de rechten en verplichtingen voortvloeiend uit het bepaalde bij of krachtens:'
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel132
  - number: 1:32.1.a.1°
    text: |-
      de in [artikel 1:1][ref1] bedoelde regelingen;


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1.1'
  - number: 1:32.1.a.2°
    text: deze wet;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel132
  - number: 1:32.1.b
    text: 'op overige van belang zijnde gegevens voor de toepassing van het bepaalde bij of krachtens:'
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel132
  - number: 1:32.1.b.1°
    text: |-
      de in [artikel 1:1][ref1] bedoelde regelingen;


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1.1'
  - number: 1:32.1.b.2°
    text: deze wet.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel132
  - number: 1:32.2
    text: |-
      Toegelaten moet worden, dat kopieën, leesbare afdrukken of uittreksels worden gemaakt van de voor raadpleging
      beschikbaar gestelde gegevensdragers of de inhoud daarvan.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel132
  - number: 1:32.3
    text: |-
      De inspecteur stelt de belanghebbende, op wie de verplichting tot het voeren van een administratie als bedoeld
      in het eerste lid rust, wiens gegevensdragers hij bij een derde voor raadpleging vordert hiervan gelijktijdig in
      kennis.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel132
  - number: 1:33.1
    text: |-
      Onze Ministers, openbare lichamen en rechtspersonen die bij of krachtens een bijzondere wet rechtspersoonlijkheid
      hebben verkregen, de onder hen ressorterende instellingen en diensten, alsmede personen die hoofdzakelijk
      uitvoering geven aan het beleid van het Rijk, verschaffen kosteloos, mondeling, schriftelijk of op andere wijze
      – zulks ter keuze van de inspecteur –, de gegevens en inlichtingen, die hun door de inspecteur worden gevraagd
      voor de uitvoering van het bepaalde bij of krachtens de in [artikel 1:1][ref1] bedoelde regelingen dan wel voor de
      uitvoering van het bepaalde bij of krachtens deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1.1'
  - number: 1:33.2
    text: Onze Minister van Financiën kan, op verzoek, ontheffing verlenen van de in het eerste lid omschreven verplichting.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel133
  - number: 1:33.3
    text: |-
      De inspecteur verstrekt kosteloos mondeling, schriftelijk of op andere wijze – zulks ter keuze van de inspecteur
      – de gegevens en inlichtingen aan Onze Ministers, openbare lichamen en rechtspersonen die bij of krachtens een
      bijzondere wet rechtspersoonlijkheid hebben verkregen, de onder hen ressorterende instellingen en diensten, alsmede
      personen die hoofdzakelijk uitvoering geven aan het beleid van het Rijk voorzover deze noodzakelijk zijn voor
      de uitvoering van het bepaalde bij of krachtens de in [artikel 1:1][ref1] bedoelde regelingen dan wel voor de
      uitvoering van het bepaalde bij of krachtens deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1.1'
  - number: 1:33.4
    text: |-
      De inspecteur verstrekt kosteloos mondeling, schriftelijk of op andere wijze – zulks ter keuze van de inspecteur
      – de gegevens en inlichtingen aan de douaneautoriteiten van de lidstaten of de Europese Commissie, bedoeld in de
      artikelen 12 en 47, tweede lid, van het Douanewetboek van de Unie.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel133
  - number: 1:33.5
    text: |-
      In afwijking in zoverre van [artikel 1:2][ref1] verstrekt de inspecteur kosteloos mondeling, schriftelijk of
      op andere wijze – zulks ter keuze van de inspecteur – de gegevens en inlichtingen aan de ambtenaar onder wiens
      leiding de belastingdienst op de BES-eilanden valt, voor zover deze noodzakelijk zijn voor de uitvoering van het
      bepaalde bij de wetgeving die geldt op de BES-eilanden en die betrekking heeft op verboden of beperkingen die op
      goederen bij het binnenbrengen in, onderscheidenlijk verlaten van de BES-eilanden, of die bij het kiezen van een
      douanebestemming op de BES-eilanden van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1.1'
  - number: 1:34
    text: |-
      Een ieder die de leeftijd van veertien jaar heeft bereikt, is, indien dit voor de toepassing van de bij of
      krachtens de in [artikel 1:1][ref1] bedoelde regelingen of de bij of krachtens deze wet vastgestelde bepalingen
      te zijnen aanzien van belang kan zijn, verplicht op vordering van de inspecteur terstond een document waarmee de
      identiteit van hem kan worden vastgesteld als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref2] ter
      inzage aan te bieden.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1.1'
      - id: ref2
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 1:35
    text: |-
      Bij verificatie van een aangifte worden de resultaten van het onderzoek van de goederen geacht overeen te komen met
      de aangifte indien de bevonden verschillen blijven binnen de spelingen die daartoe bij regeling van Onze Minister
      van Financiën zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel135
  - number: 1:36.1
    text: |-
      Aan enige instelling van vervoer toevertrouwde brieven worden zonder goedvinden van de afzender of van de
      geadresseerde slechts geopend indien de rechter-commissaris in de rechtbank van het arrondissement waarbinnen de
      brief is aangetroffen, daartoe, op verzoek van de inspecteur, bevel heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel136
  - number: 1:36.2
    text: Het bevel wordt slechts gegeven indien het vermoeden bestaat dat zich in de brief goederen bevinden.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel136
  - number: 1:37.1
    text: |-
      Vervoermiddelen, kennelijk ingericht of toegerust om goederen aan het ambtelijk toezicht te onttrekken of om
      tot het nakomen van de op grond van [artikel 1:27, eerste lid][ref1], genomen dwangmaatregelen te verijdelen,
      zomede alle andere voorwerpen, kennelijk bestemd om goederen aan het ambtelijk toezicht te onttrekken of om een
      vervoermiddel tot een van de hiervoor omschreven doeleinden in te richten of toe te rusten, worden in beslag
      genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: 1.2.4
        afdeling: '1.2'
  - number: 1:37.2
    text: |-
      Tot inbeslagneming krachtens het eerste lid zijn, behalve de inspecteur, bevoegd de bij of ingevolge
      [artikel 141 van het Wetboek van Strafvordering][ref1] aangewezen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 1:37.3
    text: |-
      Van de inbeslagneming en van de gronden daartoe doet de inspecteur zo spoedig mogelijk schriftelijk mededeling aan
      degene op wie de inbeslagneming heeft plaatsgehad. In geval van inbeslagneming op onbekende personen geschiedt die
      mededeling in het openbaar volgens bij regeling van Onze Minister van Financiën te stellen regels.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel137
  - number: 1:37.4
    text: |-
      Krachtens het eerste lid in beslag genomen vervoermiddelen en voorwerpen vervallen zonder rechtsvervolging
      aan de staat, tenzij bij een rechterlijke beslissing als bedoeld in het zesde lid de inbeslagneming niet wordt
      gehandhaafd.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel137
  - number: 1:37.5
    text: |-
      De belanghebbende bij het in beslag genomen vervoermiddel of voorwerp kan binnen een maand na de mededeling omtrent
      de inbeslagneming bij de rechtbank van het arrondissement binnen hetwelk de inbeslagneming heeft plaatsgehad,
      daartegen hetzij in persoon, hetzij door een gemachtigde een met redenen omkleed klaagschrift indienen.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel137
  - number: 1:37.6
    text: |-
      De rechtbank behandelt het klaagschrift op de voet van het bepaalde in
      [artikel 552b van het Wetboek van Strafvordering][ref1], met dien verstande, dat ook de inspecteur in de
      gelegenheid wordt gesteld tijdens de behandeling te worden gehoord en hem, zo hij voor de behandeling is
      verschenen, tijdig tevoren door de griffier schriftelijk mededeling van de dag der uitspraak wordt gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel552b
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 552b
  - number: 1:37.7
    text: |-
      [Artikel 552d van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel552d
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 552d
  - number: 1:37.8
    text: |-
      Onze Minister van Financiën is bevoegd in bijzondere gevallen de aan de staat vervallen vervoermiddelen en
      voorwerpen onder door hem te stellen voorwaarden aan de eigenaar terug te geven.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel137
  - number: 2:1
    text: |-
      Ten einde de goede werking van de douanewetgeving te waarborgen, kunnen bij regeling van Onze Minister van
      Financiën bepalingen worden vastgesteld met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel21
  - number: 2:1.a
    text: |-
      de formaliteiten voorafgaand aan en aangaande het binnenbrengen in en het verlaten van het douanegebied van schepen
      en luchtvaartuigen en de aan boord van deze schepen en luchtvaartuigen aanwezige goederen;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel21
  - number: 2:1.b
    text: douanekantoren;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel21
  - number: 2:1.c
    text: toeristisch en reizigersverkeer, postverkeer en verkeer van te verwaarlozen economisch belang;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel21
  - number: 2:1.d
    text: goederen en vervoermiddelen als bedoeld in artikel 137 van het Douanewetboek van de Unie;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel21
  - number: 2:1.e
    text: de summiere aangifte, dan wel vervangende kennisgeving, de kennisgeving van aankomst en het aanbrengen;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel21
  - number: 2:1.f
    text: tijdelijke opslag;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel21
  - number: 2:1.g
    text: de douaneaangifte, mede ten dienste van de statistiek van de in-, uit- en wederuitvoer;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel21
  - number: 2:1.h
    text: goederencontrole en verificatie;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel21
  - number: 2:1.i
    text: identificatiemaatregelen, middelen daaronder begrepen;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel21
  - number: 2:1.j
    text: zekerheid;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel21
  - number: 2:1.k
    text: |-
      de voorwaarden die gelden bij de overdracht van rechten en plichten als bedoeld in artikel 218 van het
      Douanewetboek van de Unie;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel21
  - number: 2:1.l
    text: vereenvoudigde procedures inzake Uniedouanevervoer;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel21
  - number: 2:1.m
    text: de summiere aangifte bij uitgaan dan wel kennisgeving wederuitvoer;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel21
  - number: 2:1.n
    text: de berekeningswijze van de kredietrente, de vertragingsrente en de rente op achterstallen.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel21
  - number: 2:2
    text: |-
      Goederen aangevoerd uit zee of door de lucht worden, behoudens tegenbewijs, geacht uit zee onderscheidenlijk door
      de lucht het douanegebied van de Unie te zijn binnengekomen.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel22
  - number: 2:3
    text: |-
      De inspecteur kan een beschikking tot het doen vernietigen van de goederen ingevolge artikel 197 van het
      Douanewetboek van de Unie alleen geven wanneer sprake is van goederen waarvoor verboden of beperkingen gelden
      die daardoor niet vrijgegeven kunnen worden voor een regeling als bedoeld in artikel 194, eerste lid, van het
      Douanewetboek van de Unie of kunnen worden wederuitgevoerd.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel23
  - number: 3:1.1
    text: |-
      Onverminderd de EU-regelgeving ter zake kunnen bij of krachtens algemene maatregel van bestuur verboden of
      beperkingen ten aanzien van goederen worden vastgesteld, die bij het binnenbrengen in, onderscheidenlijk verlaten
      van de gebieden, bedoeld in [artikel 1:2][ref1], van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1.1'
  - number: 3:1.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat een beschikking die
      betrekking heeft op de toepassing van de verboden of beperkingen, bedoeld in het eerste
      lid, kan worden geweigerd of ingetrokken in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], en dat
      daaraan voorafgaand het Bureau bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van die wet][ref2], om een advies als bedoeld in [artikel 9 van die wet][ref3] kan worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0013798
        artikel: '9'
  - number: 3:2.1
    text: |-
      Voor de uitvoering van de Verordening liquide middelen, de daarop berustende rechtshandelingen, en de
      [artikelen 3:4][ref1] en [3:5][ref2] en de daarop berustende bepalingen, wordt bij de toepassing van deze wet en de
      daarop berustende bepalingen mede verstaan onder:


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0023746#Artikel3
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
      - id: ref2
        bwb_id: BWBR0023746
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: 3:2.1.a
    text: 'goederen: liquide middelen als bedoeld in artikel 2, eerste lid, onderdeel a, van de Verordening liquide middelen;'
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel32
  - number: 3:2.1.b
    text: |-
      douaneaangifte of aangifte: aangifte als bedoeld in artikel 3, eerste lid, van de Verordening liquide middelen of
      kennisgeving als bedoeld in artikel 4, eerste lid, van die Verordening.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel32
  - number: 3:2.2
    text: |-
      De identiteit van de aangever of kennisgever wordt vastgesteld met behulp van een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 3:2.3
    text: |-
      Bij regeling van Onze Minister van Financiën worden regels gesteld omtrent de bij de uitvoering van de Verordening
      liquide middelen:
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel32
  - number: 3:2.3.a
    text: |-
      in aanmerking te nemen wisselkoers ter bepaling van de tegenwaarde in euro’s van contant geld als bedoeld in
      artikel 2, eerste lid, onderdeel a, onder i, van die verordening, waarvan het bedrag is uitgedrukt in een andere
      valuta;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel32
  - number: 3:2.3.b
    text: |-
      in aanmerking te nemen waarde van de goederen, bedoeld in artikel 2, eerste lid, onderdeel a, onder ii tot en met
      iv, van die verordening, en bedoeld in [artikel 3:4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel3
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: 3:2.4
    text: |-
      Bij regeling van Onze Minister van Financiën kunnen regels worden gesteld op welke wijze de aangifte, bedoeld in
      het eerste lid, onderdeel b, langs elektronische weg kan worden gedaan.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel32
  - number: 3:2a
    text: |-
      De vervoerder, bedoeld in artikel 6, eerste lid, van de Verordening liquide middelen of de afzender of de
      ontvanger van de liquide middelen, bedoeld in artikel 6, tweede lid, van die verordening verstrekt op verzoek
      van de inspecteur de gegevens, bedoeld in artikel 3, tweede lid, onderscheidenlijk artikel 4, tweede lid, van die
      verordening.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel32a
  - number: 3:2b
    text: |-
      In afwijking van [artikel 1:3, eerste lid, onderdeel d][ref1], is de bevoegde autoriteit, bedoeld in artikel 13,
      eerste lid, van de Verordening liquide middelen, Onze Minister van Financiën.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel32b
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1.1'
  - number: 3:3.1
    text: |-
      Een beslissing tot inbewaringneming van liquide middelen op de voet van artikel 7 van de Verordening liquide
      middelen wordt door de inspecteur schriftelijk genomen. De schriftelijke beslissing wordt aangemerkt als een
      beschikking. De bekendmaking daarvan geschiedt hetzij aan de natuurlijke persoon die niet aan de aangifteplicht uit
      hoofde van artikel 3 of artikel 4 van die verordening heeft voldaan, hetzij, indien deze persoon onbekend is, in
      het openbaar volgens bij regeling van Onze Minister van Financiën te stellen regels.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel33
  - number: 3:3.2
    text: |-
      De beschikking vermeldt welke gegevens in strijd met de aangifteplicht niet, onvolledig of onjuist zijn verstrekt
      en verwijst naar de algemene maatregel van bestuur, bedoeld in het zevende lid.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel33
  - number: 3:3.3
    text: |-
      De inspecteur is bevoegd de inbewaringneming van de liquide middelen te doen voortduren zolang de nodige gegevens,
      bedoeld in artikel 3, tweede lid, of van artikel 4, tweede lid, van de Verordening liquide middelen ontbreken.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel33
  - number: 3:3.4
    text: |-
      De inbewaringneming van de liquide middelen wordt beëindigd door strafrechtelijke inbeslagneming of door een
      schriftelijke beslissing van de inspecteur. Een schriftelijke beslissing van de inspecteur als bedoeld in de eerste
      volzin wordt aangemerkt als een beschikking. Het eerste lid, derde volzin, is met betrekking tot deze beschikking
      van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel33
  - number: 3:3.5
    text: |-
      De beschikking, bedoeld in het vierde lid, vermeldt het tijdstip van beëindiging van de inbewaringneming van
      de liquide middelen en vermeldt voorts dat deze nog tot en met het kalenderjaar dat volgt op het jaar waarin de
      in het vierde lid bedoelde beschikking is bekendgemaakt, ter uitkering door de inspecteur aan een rechthebbende
      beschikbaar blijven voorzover de liquide middelen niet strekken tot voldoening van kosten als bedoeld in het
      zevende lid.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel33
  - number: 3:3.6
    text: |-
      Indien liquide middelen die beschikbaar blijven in de zin van het vijfde lid niet voor afloop van het
      kalenderjaar dat volgt op het jaar waarin de in het vierde lid bedoelde beschikking is bekendgemaakt, aan
      een rechthebbende zijn uitgekeerd, wordt hetzij het bedrag daarvan, hetzij – voorzover de liquide middelen
      geen Nederlandse wettige betaalmiddelen zijn – de verkoopopbrengst daarvan opgenomen in de consignatiekas.
      [Artikel 9, tweede tot en met zesde lid, van de Wet op de consignatie van gelden][ref1] blijft buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003338#Artikel9
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0003338
        artikel: '9'
  - number: 3:3.7
    text: |-
      Bij algemene maatregel van bestuur kunnen gevallen worden vastgesteld waarin de kosten verbonden aan een
      inbewaringneming van liquide middelen op de voet van artikel 7 van de Verordening liquide middelen geheel of
      gedeeltelijk dienen te worden vergoed door de natuurlijke persoon die niet aan de aangifteplicht uit hoofde van
      artikel 3 of artikel 4 van die verordening heeft voldaan. Heffing en invordering van te vergoeden kosten geschieden
      overeenkomstig de wettelijke regels voor de heffing, onderscheidenlijk invordering, van kosten van ambtelijke
      werkzaamheden als bedoeld in [artikel 1:19][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: 1.2.3
        afdeling: '1.2'
  - number: 3:4.1
    text: |-
      De afzender, de vervoerder of de ontvanger van liquide middelen ter waarde van € 10.000 of meer als bedoeld in
      artikel 2, eerste lid, onderdeel a, van de Verordening liquide middelen of waardevolle goederen ter waarde van
      € 10.000 of meer, verstrekt de inspecteur op diens verzoek binnen een termijn van dertig dagen een kennisgeving die
      de gegevens, bedoeld in artikel 4, tweede lid, van die verordening, bevat.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel34
  - number: 3:4.2
    text: De kennisgeving wordt gedaan op de wijze, bedoeld in artikel 4, derde lid, van de Verordening liquide middelen.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel34
  - number: 3:4.3
    text: |-
      De inspecteur kan de liquide middelen of de waardevolle goederen in bewaring nemen tot de kennisgeving is
      verstrekt. [Artikel 3:3][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel3
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: 3:4.4
    text: |-
      De kennisgeving wordt geacht niet te zijn verstrekt indien die kennisgeving niet vóór het verstrijken van de
      termijn, genoemd in het eerste lid, wordt gedaan of indien de verstrekte informatie onjuist of onvolledig is of de
      liquide middelen of waardevolle goederen niet voor controle ter beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel34
  - number: 3:4.5
    text: |-
      De artikelen 6 en 9 van de Verordening liquide middelen en de [artikelen 3:2][ref1] en [3:2a][ref2] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0023746#Artikel3
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
      - id: ref2
        bwb_id: BWBR0023746
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: 3:4.6
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden goederen aangewezen die worden aangemerkt als waardevolle
      goederen als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel34
  - number: 3:5.1
    text: |-
      De afzender, de vervoerder of de ontvanger van documenten waaruit buitenlands of binnenlands bezit van vermogen of
      vermogensbestanddelen blijkt, die kunnen duiden op witwassen of terrorismefinanciering verstrekt de inspecteur op
      diens verzoek binnen een termijn van dertig dagen een kennisgeving die het volgende omvat:
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel35
  - number: 3:5.1.a
    text: de inhoud van de betreffende documenten middels een afschrift daarvan;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel35
  - number: 3:5.1.b
    text: |-
      de gegevens van de kennisgever: diens volledige naam, adres, geboorteplaats, geboortedatum, nationaliteit en
      identificatiedocumentnummer;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel35
  - number: 3:5.1.c
    text: |-
      de gegevens van de eigenaar, afzender en ontvanger of beoogd ontvanger van de documenten en, indien van toepassing,
      de vermogensbestanddelen die deze documenten vertegenwoordigen: - indien deze een natuurlijke persoon is: diens
      volledige naam, adres, geboorteplaats, geboortedatum, nationaliteit en identificatiedocumentnummer;
        - indien deze een rechtspersoon is: de volledige naam, adres, registratienummer en, indien van toepassing, btw-
      identificatienummer;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel35
  - number: 3:5.1.d
    text: de aard en het bedrag of de waarde van vermogensbestanddelen waar de documenten betrekking op hebben.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel35
  - number: 3:5.2
    text: |-
      Bij regeling van Onze Minister van Financiën worden regels gesteld op welke wijze de kennisgeving, bedoeld in
      het eerste lid, wordt gedaan. Aan de kennisgever wordt op verzoek een gewaarmerkt exemplaar van de kennisgeving
      afgegeven.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel35
  - number: 3:5.3
    text: |-
      De inspecteur kan de documenten in bewaring nemen tot de kennisgeving is verstrekt. [Artikel 3:3][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel3
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: 3:5.4
    text: |-
      De kennisgeving wordt geacht niet te zijn verstrekt indien die kennisgeving niet vóór het verstrijken van de
      termijn, genoemd in het eerste lid, wordt gedaan of indien de verstrekte informatie onjuist of onvolledig is of de
      documenten niet voor controle ter beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel35
  - number: 3:5.5
    text: |-
      Artikel 9 van de Verordening liquide middelen en de [artikelen 3:2][ref1] en [3:2a][ref2] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0023746#Artikel3
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
      - id: ref2
        bwb_id: BWBR0023746
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: 5:1.1
    text: |-
      Goederen aanwezig in of op schepen, op weg naar zee of bestemd om aanstonds naar zee te vertrekken, zomede
      goederen die op het punt staan om in die schepen te worden opgenomen, worden aangemerkt als goederen die over zee
      het douanegebied van de Unie zullen uitgaan, tenzij blijkt dat de goederen bestemd zijn voor een plaats in het
      douanegebied van de Unie en het vervoer zal geschieden zonder dat het schip het douanegebied van de Unie uitgaat.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel51
  - number: 5:1.2
    text: |-
      Goederen aanwezig in luchtvaartuigen, bestemd om aanstonds op te stijgen, zomede goederen die op het punt staan om
      in die luchtvaartuigen te worden opgenomen, worden aangemerkt als goederen die door de lucht het douanegebied van
      de Unie zullen uitgaan, tenzij blijkt dat de goederen bestemd zijn voor een plaats in het douanegebied van de Unie
      en het vervoer zal geschieden zonder dat het luchtvaartuig het douanegebied van de Unie uitgaat.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel51
  - number: 6:1.1
    text: |-
      Bij regeling van Onze Minister van Financiën kunnen bepalingen worden vastgesteld ter uitwerking van Verordening
      (EG) nr. 1186/2009 van de Raad van 16 november 2009 betreffende de instelling van een communautaire regeling inzake
      douanevrijstellingen (PbEU 2009, L 324).
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel61
  - number: 6:1.2
    text: 'De bepalingen, bedoeld in het eerste lid, hebben betrekking op:'
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel61
  - number: 6:1.2.a
    text: nadere voorwaarden waaronder vrijstelling wordt verleend;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel61
  - number: 6:1.2.b
    text: het beperken van de omvang van de vrijstelling;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel61
  - number: 6:1.2.c
    text: |-
      de aanwijzing van personen en openbare diensten die toestemming krijgen om goederen vrij van rechten in te voeren
      dan wel in ontvangst te nemen;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel61
  - number: 6:1.2.d
    text: |-
      het verlenen van vrijstellingen als bedoeld in artikel 128, eerste lid, van de verordening, genoemd in het eerste
      lid;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel61
  - number: 6:1.2.e
    text: |-
      het verlenen van vrijstellingen aan strijdkrachten die ter uitvoering van internationale overeenkomsten op
      Nederlands grondgebied zijn gestationeerd en die niet onder Nederlands gezag staan.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel61
  - number: 6:2
    text: |-
      Bij regeling van Onze Minister van Financiën kunnen bepalingen worden vastgesteld ter zake van vrijstelling van
      rechten bij invoer of van rechten bij uitvoer bij het in het vrije verkeer brengen respectievelijk de uitvoer van
      goederen bestemd voor de bevoorrading van schepen, luchtvaartuigen en internationale treinen.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel62
  - number: 6:3
    text: |-
      Bij regeling van Onze Minister van Financiën kunnen bepalingen worden vastgesteld ter uitwerking van
      vrijstellingsbepalingen ingesteld bij andere bindende EU-rechtshandelingen dan Verordening (EG) nr. 1186/2009 van
      de Raad van 16 november 2009 betreffende de instelling van een communautaire regeling inzake douanevrijstellingen
      (PbEU 2009, L 324).
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel63
  - number: 7:1
    text: |-
      Met het oog op de in de douanewetgeving voorziene zekerheidstelling voor het bedrag van de douaneschuld kunnen bij
      regeling van Onze Minister van Financiën bepalingen worden vastgesteld ter zake van:
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel71
  - number: 7:1.a
    text: zekerheidstelling door storting van contant geld dan wel hetgeen daarmede gelijk is gesteld;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel71
  - number: 7:1.b
    text: andere wijzen van zekerheidstelling dan door storting van contant geld of door borgstelling.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel71
  - number: 7:2.1
    text: |-
      Met het oog op de in de douanewetgeving voorziene zekerheidstelling voor het bedrag van de douaneschuld kunnen bij
      regeling van Onze Minister van Financiën bepalingen worden vastgesteld ter zake van de voorwaarden waaraan moet
      worden voldaan teneinde als borg te worden erkend.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel72
  - number: 7:2.2
    text: |-
      Bij de regeling, bedoeld in het eerste lid, kunnen specifieke verplichtingen worden vastgesteld welke een erkende
      borg moet naleven.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel72
  - number: 7:3
    text: |-
      Onder de naam «rechten bij invoer» en «rechten bij uitvoer» worden belastingen geheven ter zake van de invoer
      respectievelijk de uitvoer van goederen overeenkomstig hetgeen dienaangaande is bepaald bij of krachtens het
      Koninkrijk verbindende verdragen en in al hun onderdelen verbindende besluiten van bij zodanige verdragen
      opgerichte volkenrechtelijke organisaties.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel73
  - number: 7:4a.1
    text: |-
      [Artikel 4:86 van de Algemene wet bestuursrecht][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel74a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 7:4a.2
    text: |-
      [Artikel 4:88, derde lid, van de Algemene wet bestuursrecht][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel74a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 7:4a.3
    text: |-
      Uitstel van betaling als bedoeld in de artikelen 110 en 111 van het Douanewetboek van de Unie is geen uitstel van
      betaling als bedoeld in [artikel 4:94 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel74a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 7:4a.4
    text: |-
      Het uitstel van betaling, bedoeld in [artikel 4:94 van de Algemene wet bestuursrecht][ref1], is een «andere
      betalingsfaciliteit» als bedoeld in artikel 112 van het Douanewetboek van de Unie.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel74a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 7:4a.5
    text: |-
      [Artikel 4:96 van de Algemene wet bestuursrecht][ref1] is slechts van toepassing indien het uitstel van betaling
      betreft ingevolge artikel 112 van het Douanewetboek van de Unie.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel74a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 7:4a.6
    text: |-
      [Afdeling 4.4.2 van de Algemene wet bestuursrecht][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.4.2
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel74a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.4.2
  - number: 7:5.1
    text: |-
      Bij regeling van Onze Minister van Financiën kunnen bepalingen worden vastgesteld met betrekking tot de boeking van
      de bedragen aan rechten.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel75
  - number: 7:5.2
    text: 'De bepalingen, bedoeld in het eerste lid, kunnen betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel75
  - number: 7:5.2.a
    text: bedragen aan rechten waar beneden niet wordt geboekt;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel75
  - number: 7:5.2.b
    text: |-
      de boeking van bedragen met betrekking tot goederen die ten gunste van een zelfde persoon in een vast te stellen
      periode werden vrijgegeven waarbij deze boeking aan het einde van deze periode in één keer geschiedt.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel75
  - number: 7:6.1
    text: |-
      De mededeling van het bedrag aan rechten aan de schuldenaar geschiedt door het toezenden van een op een
      aanslagbiljet vermelde uitnodiging tot betaling. Het aanslagbiljet wordt voorzien van een dagtekening die geldt
      als dagtekening van de vaststelling van de uitnodiging tot betaling. De inspecteur stelt het aanslagbiljet ter
      invordering van het daaruit blijkende bedrag aan rechten aan de ontvanger ter hand.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel76
  - number: 7:6.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing met betrekking tot de door de inspecteur te nemen beschikking
      strekkende tot vaststelling van:
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel76
  - number: 7:6.2.a
    text: het bedrag van de terugbetaling dan wel kwijtschelding;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel76
  - number: 7:6.2.b
    text: |-
      het bedrag van de verschuldigde rente op achterstallen als bedoeld in artikel 114, tweede lid, van het
      Douanewetboek van de Unie;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel76
  - number: 7:6.2.c
    text: het bedrag van de verschuldigde kosten;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel76
  - number: 7:6.2.d
    text: het bedrag van de verschuldigde bestuurlijke boete.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel76
  - number: 7:6.3
    text: |-
      Op een aanslagbiljet mogen verschillende mededelingen van bedragen aan rechten en bedragen als bedoeld in het
      tweede lid worden vermeld.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel76
  - number: 7:6.4
    text: Het model van het aanslagbiljet wordt bij regeling van Onze Minister van Financiën vastgesteld.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel76
  - number: 7:6.5
    text: |-
      Indien artikel 102, tweede lid, van het Douanewetboek van de Unie wordt toegepast, wordt de douaneaangifte
      aangemerkt als een op een aanslagbiljet vermelde uitnodiging tot betaling. De datum van vrijgave van de goederen
      geldt als dagtekening van het aanslagbiljet en van de vaststelling van de uitnodiging tot betaling.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel76
  - number: 7:6.6
    text: |-
      Indien een vergunninghouder volgens de procedure, bedoeld in artikel 237 van de Uitvoeringsverordening
      Douanewetboek van de Unie, gegevens indient over het vastgestelde bedrag aan rechten bij in- en uitvoer, geldt de
      datum van indiening als dagtekening van het aanslagbiljet en van de vaststelling van de uitnodiging tot betaling.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel76
  - number: 7:7
    text: |-
      Wanneer de douaneschuld is ontstaan ingevolge een handeling die, indien deze in Nederland zou zijn verricht,
      strafrechtelijk vervolgbaar was, kan de toezending van het aanslagbiljet geschieden binnen vijf jaren nadat de
      douaneschuld is ontstaan.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel77
  - number: 7:8
    text: |-
      Indien een douaneschuld ontstaat op grond van de artikelen 79 of 82 van het Douanewetboek van de Unie, en één of
      meer voor de berekening van het bedrag aan rechten noodzakelijke gegevens met betrekking tot de goederen niet zijn
      komen vast te staan, worden die goederen, met inachtneming van de gegevens die wel zijn komen vast te staan, geacht
      die hoedanigheid te bezitten, volgens welke: - het hoogste tarief van rechten bij invoer en
        - de meest bezwarende handelspolitieke maatregelen van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel78
  - number: 7:9
    text: 'Bij regeling van Onze Minister van Financiën worden regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel79
  - number: 7:9.a
    text: |-
      de afronding van bedragen en hoeveelheden die dienen als grondslag voor de berekening van het bedrag aan rechten,
      andere belastingen, heffingen en retributies;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel79
  - number: 7:9.b
    text: |-
      de berekening van het bedrag aan rechten indien de hoeveelheid van de goederen kleiner is dan de hoeveelheid waarin
      het gemeenschappelijk douanetarief is uitgedrukt;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel79
  - number: 7:9.c
    text: |-
      de afronding van het bedrag aan rechten, andere belastingen, heffingen, retributies, renten, interesten en kosten
      van ambtelijke werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel79
  - number: 7:10
    text: |-
      Indien een bedrag aan rechten bij invoer of rechten bij uitvoer geheel of gedeeltelijk wordt terugbetaald of
      kwijtgescholden en ter zake van dat bedrag rente op achterstallen in rekening was gebracht, wordt het deel van
      de rente op achterstallen dat betrekking heeft op het terug te betalen of kwijt te schelden bedrag eveneens
      terugbetaald, onderscheidenlijk kwijtgescholden.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel710
  - number: 8:1.1
    text: |-
      De [artikelen 6:2, aanhef en onder b][ref1], en [8:1 van de Algemene wet bestuursrecht][ref2] zijn niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 8:1.2
    text: |-
      [Artikel 8:13 van de Algemene wet bestuursrecht][ref1] is niet van toepassing, tenzij beroep is ingesteld tegen een
      beschikking die is genomen op grond van een regeling, genoemd in de bijlage bij de artikelen 1:1 en 1:3, onder B,
      van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 8:1.3
    text: |-
      [Afdeling 8.2.4A van de Algemene wet bestuursrecht][ref1] is alleen van toepassing indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling8.2.4a
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 8.2.4a
  - number: 8:1.3.a
    text: artikel 44, eerste lid, tweede alinea, van het Douanewetboek van de Unie toepassing vindt;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel81
  - number: 8:1.3.b
    text: |-
      de inspecteur niet tijdig heeft beslist op bezwaar en hij de indiener van dat bezwaar geen inkennisstelling als
      bedoeld in artikel 22, derde lid, tweede alinea, van het Douanewetboek van de Unie heeft doen toekomen.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel81
  - number: 8:2.1
    text: |-
      [Hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref1], met uitzondering van de
      [artikelen 25, derde lid][ref2], [26a][ref3], [27a][ref4] en [27e][ref5], is van overeenkomstige toepassing op
      beschikkingen als bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukV
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel26a
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel27a
      [ref5]: https://wetten.overheid.nl/BWBR0002320#Artikel27e
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '25'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: 26a
      - id: ref4
        bwb_id: BWBR0002320
        artikel: 27a
      - id: ref5
        bwb_id: BWBR0002320
        artikel: 27e
  - number: 8:2.2
    text: |-
      Voor de overeenkomstige toepassing van [hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref1] is een
      beschikking voor bezwaar vatbaar indien het een beschikking betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: V
  - number: 8:2.2.a
    text: als bedoeld in artikel 5, aanhef en onderdeel 39, van het Douanewetboek van de Unie;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel82
  - number: 8:2.2.b
    text: die is genomen op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel82
  - number: 8:2.3
    text: |-
      Voor de overeenkomstige toepassing van [hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref1] wordt een
      uitnodiging tot betaling aangemerkt als een belastingaanslag of een aanslag.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: V
  - number: 8:2.4
    text: |-
      Indien het beroep is gericht tegen het niet tijdig doen van een uitspraak door de inspecteur, kan de rechtbank
      Noord-Holland bepalen dat de artikelen 15, 46 en 47 van het Douanewetboek van de Unie en [paragraaf 1.2.4][ref1]
      gedurende een daarbij te bepalen termijn van toepassing blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0023746
        hoofdstuk: '1'
        paragraaf: 1.2.4
        afdeling: '1.2'
  - number: 8:2.5
    text: |-
      Indien een uitspraak van de rechtbank of van de voorzieningenrechter van de rechtbank betrekking heeft op een
      beschikking die is gegeven door Onze minister wie het aangaat dan wel de ontvanger, treedt voor de toepassing van
      dit hoofdstuk Onze minister wie het aangaat dan wel de ontvanger in de plaats van de inspecteur.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel82
  - number: 8:2.6
    text: |-
      Indien het bezwaar is gericht tegen een uitnodiging tot betaling of een beschikking als bedoeld in het tweede lid,
      met betrekking tot welke:
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel82
  - number: 8:2.6.a
    text: de vereiste aangifte niet is gedaan; of
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel82
  - number: 8:2.6.b
    text: |-
      niet of niet volledig is voldaan aan een verzoek op de voet van artikel 15 van het Douanewetboek van de Unie om
      gegevensdragers, of de inhoud daarvan, voor raadpleging beschikbaar te stellen; of
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel82
  - number: 8:2.6.c
    text: |-
      niet of niet volledig is voldaan aan de verplichtingen ingevolge [artikel 1:32][ref1], wordt bij de uitspraak
      op het bezwaarschrift de belastingaanslag of de beschikking gehandhaafd, tenzij aannemelijk is dat het niet of
      niet volledig voldoen aan genoemd verzoek of aan genoemde verplichtingen het gevolg is van overmacht en tenzij
      is gebleken dat en in hoeverre de belastingaanslag of de beschikking onjuist is. De eerste volzin vindt geen
      toepassing voor zover het bezwaar is gericht tegen een vergrijpboete.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: 1.2.4
        afdeling: '1.2'
  - number: 8:2.7
    text: |-
      Indien het beroep is gericht tegen een uitnodiging tot betaling of een beschikking als bedoeld in het tweede lid,
      met betrekking tot welke:
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel82
  - number: 8:2.7.a
    text: de vereiste aangifte niet is gedaan; of
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel82
  - number: 8:2.7.b
    text: |-
      niet of niet volledig is voldaan aan een verzoek op de voet van artikel 15 van het Douanewetboek van de Unie om
      gegevensdragers, of de inhoud daarvan, voor raadpleging beschikbaar te stellen; of
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel82
  - number: 8:2.7.c
    text: |-
      niet of niet volledig is voldaan aan de verplichtingen ingevolge [artikel 1:32][ref1], verklaart de rechtbank het
      beroep ongegrond, tenzij is gebleken dat en in hoeverre de uitspraak op het bezwaar onjuist is. De eerste volzin
      vindt geen toepassing voor zover het bezwaar is gericht tegen een vergrijpboete.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: 1.2.4
        afdeling: '1.2'
  - number: 9:1.1
    text: |-
      Indien voor goederen in tijdelijke opslag waarvoor een aangifte tot tijdelijke opslag is gedaan de formaliteiten
      welke nodig zijn om deze goederen onder een douaneregeling te plaatsen of weder uit te voeren niet worden vervuld
      binnen de ingevolge artikel 149 van het Douanewetboek van de Unie geldende termijn, vormt dit een verzuim ter
      zake waarvan de inspecteur degene die de formaliteiten binnen deze termijn dient te vervullen en degene door wiens
      toedoen de formaliteiten niet binnen deze termijn worden vervuld ieder een bestuurlijke boete van ten hoogste € 335
      kan opleggen.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel91
  - number: 9:1.2
    text: |-
      Indien het niet vervullen van de in het eerste lid bedoelde formaliteiten binnen de ingevolge artikel 149 van het
      Douanewetboek van de Unie geldende termijn, een douaneschuld doet ontstaan en het daaruit voortvloeiende bedrag aan
      rechten bij invoer hoger is dan € 335, terwijl het niet vervullen van die formaliteiten binnen die termijn is te
      wijten aan opzet of grove schuld van één of meer van degenen, bedoeld in het eerste lid, vormt dit een vergrijp ter
      zake waarvan de inspecteur hem, onderscheidenlijk ieder van hen, een bestuurlijke boete van ten hoogste 100 percent
      van het bedrag aan rechten kan opleggen.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel91
  - number: 9:2.1
    text: |-
      Indien voor goederen welke zijn geplaatst onder de bijzondere regelingen douanevervoer, opslag, tijdelijke
      invoer, bijzondere bestemming, of actieve veredeling of passieve veredeling, de formaliteiten ter beëindiging
      van die regeling in strijd met de douanewetgeving niet of niet tijdig worden vervuld, vormt dit een verzuim
      ter zake waarvan de inspecteur degene die die formaliteiten dient te vervullen en degene door wiens toedoen die
      formaliteiten niet of niet tijdig worden vervuld ieder een bestuurlijke boete van ten hoogste € 335 kan opleggen.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel92
  - number: 9:2.2
    text: |-
      Indien goederen die onder de regeling douanevervoer zijn geplaatst in strijd met artikel 298, tweede lid, van de
      Uitvoeringsverordening Douanewetboek van de Unie niet langs een verplicht te volgen route worden vervoerd dan wel
      in strijd met de artikelen 276, tweede lid, 284, eerste lid, of 297, eerste lid, van de Uitvoeringsverordening
      Douanewetboek van de Unie niet binnen de voorgeschreven termijn bij het kantoor van bestemming worden aangebracht,
      vormt dit een verzuim ter zake waarvan de inspecteur degene die de goederen in strijd met genoemd artikel 298,
      tweede lid, vervoert, onderscheidenlijk de goederen in strijd met de genoemde artikelen 276, tweede lid, 284,
      eerste lid, of 297, eerste lid, niet tijdig aanbrengt, en degene door wiens toedoen het desbetreffende verzuim
      plaatsvindt, ieder een bestuurlijke boete van ten hoogste € 335 kan opleggen.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel92
  - number: 9:2.3
    text: |-
      Indien het in strijd met de douanewetgeving niet of niet tijdig vervullen van de in het eerste lid bedoelde
      formaliteiten of het in strijd met de douanewetgeving niet vervullen van de in het tweede lid bedoelde
      verplichtingen een douaneschuld doet ontstaan en het daaruit voortvloeiende bedrag aan rechten bij invoer hoger
      is dan € 335, terwijl het in strijd met de douanewetgeving niet of niet tijdig vervullen van die formaliteiten,
      onderscheidenlijk niet vervullen van die verplichtingen, is te wijten aan opzet of grove schuld van één of meer
      van degenen, bedoeld in het eerste dan wel tweede lid, vormt dit een vergrijp ter zake waarvan de inspecteur hem,
      onderscheidenlijk ieder van hen, een bestuurlijke boete van ten hoogste 100 percent van het bedrag aan rechten
      kan opleggen.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel92
  - number: 9:3.1
    text: |-
      Indien in een douane-entrepot een vermis wordt bevonden, vormt dit een verzuim ter zake waarvan de inspecteur de
      houder van de vergunning, onderscheidenlijk de houder van de regeling, een bestuurlijke boete van ten hoogste € 335
      kan opleggen.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel93
  - number: 9:3.2
    text: |-
      Indien het in het eerste lid bedoelde vermis een douaneschuld doet ontstaan en het daaruit voortvloeiende bedrag
      aan rechten bij invoer hoger is dan € 335, terwijl dat vermis is te wijten aan opzet of grove schuld van de
      houder van de vergunning, onderscheidenlijk de houder van de regeling, vormt dit een vergrijp ter zake waarvan de
      inspecteur hem een bestuurlijke boete van ten hoogste 100 percent van het bedrag aan rechten kan opleggen.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel93
  - number: 9:4.1
    text: |-
      Het niet voldoen aan een verplichting voortvloeiend uit een vergunning welke is verleend ingevolge de
      douanewetgeving, vormt een verzuim ter zake waarvan de inspecteur degene die deze voorwaarde dient na te leven en
      degene door wiens toedoen die voorwaarde niet of niet tijdig wordt nageleefd een bestuurlijke boete van ten hoogste
      € 335 kan opleggen.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel94
  - number: 9:4.2
    text: |-
      Indien het in strijd met de douanewetgeving niet of niet tijdig vervullen van de in het eerste lid bedoelde
      voorwaarde een douaneschuld doet ontstaan en het daaruit voortvloeiende bedrag aan rechten bij invoer hoger is dan
      € 335, terwijl het in strijd met de douanewetgeving niet of niet tijdig vervullen van deze voorwaarde is te wijten
      aan opzet of grove schuld van één of meer van degenen, bedoeld in het eerste lid, vormt dit een vergrijp ter zake
      waarvan de inspecteur hem, onderscheidenlijk ieder van hen, een bestuurlijke boete van ten hoogste 100 percent van
      het bedrag aan rechten kan opleggen.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel94
  - number: 9:5
    text: |-
      Het overtreden van een krachtens deze wet vastgestelde algemene maatregel van bestuur of ministeriële regeling kan
      bij die algemene maatregel van bestuur of ministeriële regeling worden aangemerkt als een verzuim ter zake waarvan
      de inspecteur degene aan wie het verzuim te wijten is een bestuurlijke boete kan opleggen van ten hoogste het in
      die algemene maatregel van bestuur of ministeriële regeling te vermelden bedrag. Dat bedrag beloopt ten hoogste
      € 335 indien het verzuim betrekking heeft op een algemene maatregel van bestuur, en beloopt ten hoogste € 167
      indien het verzuim betrekking heeft op een ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel95
  - number: 9:6
    text: |-
      In afwijking van [artikel 5:45, eerste en tweede lid, van de Algemene wet bestuursrecht][ref1] vervalt de
      bevoegdheid tot het opleggen van een bestuurlijke boete als bedoeld in deze afdeling door verloop van drie jaren na
      het tijdstip waarop het verzuim of vergrijp waarop de bestuurlijke boete betrekking heeft, heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 9:6a
    text: |-
      De in de [artikelen 9:1][ref1], [9:2][ref2], [9:3][ref3], [9:4][ref4] en [9:5][ref5], genoemde bedragen worden
      elke vijf jaar, met ingang van 1 januari 2015, bij ministeriële regeling gewijzigd. De [artikelen 10.1][ref6] en
      [10.2 van de Wet inkomstenbelasting 2001][ref7] zijn van overeenkomstige toepassing, met dien verstande dat als
      tabelcorrectiefactor wordt genomen het product van de factoren van de laatste vijf kalenderjaren.


