  - number: 9:8
    text: |-
      Indien de grondslag voor een bestuurlijke boete wordt gevormd door het bedrag aan rechten bij invoer, wordt
      de opgelegde bestuurlijke boete naar evenredigheid verlaagd bij vermindering, teruggaaf, terugbetaling of
      kwijtschelding van de rechten bij invoer, voorzover deze vermindering, teruggaaf, terugbetaling of kwijtschelding,
      het bedrag aan rechten bij invoer betreft waarover de bestuurlijke boete is berekend.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel98
  - number: 9:16
    text: |-
      Van de opgelegde bestuurlijke boete kan door of vanwege Onze Minister van Financiën gehele of gedeeltelijke
      kwijtschelding worden verleend.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel916
  - number: 10:1.1
    text: 'Degene die:'
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel101
  - number: 10:1.1.a
    text: |-
      in strijd met de artikelen 127, eerste tot en met zesde lid, en 130 van het Douanewetboek van de Unie in samenhang
      met in voorkomend geval de artikelen 105, 106 of 110 van de Gedelegeerde Verordening Douanewetboek van de Unie
      geen, niet tijdig of onvolledig een summiere aangifte indient;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel101
  - number: 10:1.1.b
    text: niet of niet tijdig een aankomstmelding doet als bedoeld in artikel 133 van het Douanewetboek van de Unie;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel101
  - number: 10:1.1.c
    text: |-
      goederen het douanegebied van de Unie binnenbrengt in strijd met de artikelen 135, eerste en zesde lid, of 137 van
      het Douanewetboek van de Unie;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel101
  - number: 10:1.1.d
    text: |-
      binnengebrachte goederen in strijd met artikel 139, eerste of tweede lid, van het Douanewetboek van de Unie niet of
      niet tijdig bij de inspecteur aanbrengt;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel101
  - number: 10:1.1.e
    text: |-
      bij de tijdelijke opslag in strijd met artikel 145, eerste, derde, vierde of vijfde lid, van het Douanewetboek van
      de Unie of artikel 193 van de Uitvoeringsverordening Douanewetboek van de Unie handelt;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel101
  - number: 10:1.1.f
    text: |-
      zonder toestemming van de inspecteur goederen wegvoert in strijd met artikel 139, zevende lid, van het
      Douanewetboek van de Unie of lost in strijd met artikel 140, eerste lid, van het Douanewetboek van de Unie;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel101
  - number: 10:1.2
    text: |-
      Degene die een der in het eerste lid omschreven feiten begaat met het oogmerk de rechten bij invoer die ter
      zake van de goederen zijn verschuldigd, te ontduiken of de ontduiking daarvan te bevorderen, wordt gestraft met
      gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie of, indien dit bedrag hoger is, ten
      hoogste eenmaal het bedrag van die rechten.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel101
  - number: 10:1.3
    text: |-
      Degene die uit zee of door de lucht goederen aanvoert ten aanzien waarvan het in [artikel 2:2][ref1] genoemde
      tegenbewijs niet wordt geleverd, wordt geacht die goederen uit zee, onderscheidenlijk door de lucht, binnen het
      douanegebied van de Unie te hebben gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel2
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.1'
  - number: 10:1.4
    text: |-
      Degene die uit hoofde van artikel 3 of artikel 4 van de Verordening liquide middelen of [artikel 3:2a][ref1]
      verplicht is tot het doen van aangifte en deze aangifte niet, onvolledig of onjuist doet of, in het geval van
      artikel 3:2a, de gevraagde gegevens niet verstrekt, wordt gestraft met geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel3
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: 10:1.5
    text: |-
      Degene die uit hoofde van de artikelen 3:4 of 3:5 verplicht is tot het verstrekken van de kennisgeving en deze
      kennisgeving niet, onvolledig of onjuist doet, wordt gestraft met een geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel101
  - number: 10:1.6
    text: |-
      Degene die een der in het vierde lid omschreven feiten opzettelijk begaat, wordt gestraft met gevangenisstraf van
      ten hoogste vier jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel101
  - number: 10:1.7
    text: |-
      Met betrekking tot de in het vierde, vijfde en zesde lid strafbaar gestelde feiten is
      [artikel 10:15, tweede lid, onderdeel d][ref1], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel10
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '10'
        hoofdstuk: '10'
        afdeling: '10.2'
  - number: 10:2
    text: 'Degene die voor goederen die het douanegebied van de Unie verlaten:'
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel102
  - number: 10:2.a
    text: niet of niet tijdig een aangifte vóór vertrek indient als bedoeld in artikel 263 van het Douanewetboek van de Unie;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel102
  - number: 10:2.b
    text: |-
      in strijd met artikel 267, eerste lid, van het Douanewetboek van de Unie deze goederen niet langs een
      voorgeschreven route vervoert;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel102
  - number: 10:2.c
    text: in strijd met artikel 274 van het Douanewetboek van de Unie geen kennisgeving van wederuitvoer indient; of
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel102
  - number: 10:2.d
    text: in strijd met artikel 267, tweede lid, van het Douanewetboek van de Unie deze goederen niet aanbrengt;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel102
  - number: 10:3.1
    text: |-
      Degene die goederen waarvoor een in de douanewetgeving voorziene aangifte niet is gedaan, lost, laadt, vervoert,
      in enig gebouw, erf of besloten terrein inslaat, voorhanden heeft of daaruit uitslaat, koopt, verkoopt, te koop
      aanbiedt of aflevert, wordt gestraft met geldboete van de derde categorie of, indien dit bedrag hoger is, ten
      hoogste eenmaal het bedrag van de rechten bij invoer die ter zake van de goederen zijn verschuldigd.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel103
  - number: 10:3.2
    text: |-
      Degene die een der in het eerste lid omschreven feiten begaat terwijl hij weet of vermoedt dat de rechten
      bij invoer ter zake van de in dat lid bedoelde goederen niet zijn voldaan, noch de heffing van die rechten
      overeenkomstig de douanewetgeving is verzekerd, wordt gestraft met gevangenisstraf van ten hoogste een jaar of
      geldboete van de vierde categorie of, indien dit bedrag hoger is, ten hoogste eenmaal het bedrag van die rechten.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel103
  - number: 10:4.1
    text: |-
      Degene die in strijd met de douanewetgeving goederen waarvoor vrijstelling van rechten bij invoer wordt genoten,
      gebruikt of doet gebruiken op een wijze of voor doeleinden waarvoor de vrijstelling niet geldt, of aan goederen die
      in het vrije verkeer zijn gebracht met toepassing van een verlaagd recht bij invoer of van een nulrecht uit hoofde
      van hun bijzondere bestemming, een bestemming heeft gegeven die afwijkt van die met het oog waarop het verlaagde
      recht bij invoer of het nulrecht is toegepast, wordt gestraft met geldboete van de derde categorie of, indien dit
      bedrag hoger is, ten hoogste eenmaal het bedrag van de ter zake van die goederen te weinig geheven rechten bij
      invoer.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel104
  - number: 10:4.2
    text: |-
      Degene die een der in het eerste lid omschreven feiten opzettelijk begaat, wordt gestraft met gevangenisstraf van
      ten hoogste een jaar of geldboete van de vierde categorie of, indien dit bedrag hoger is, ten hoogste eenmaal het
      bedrag van de te weinig geheven rechten bij invoer.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel104
  - number: 10:5.1
    text: 'Degene die:'
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel105
  - number: 10:5.1.a
    text: een ingevolge de douanewetgeving vereiste aangifte onjuist of onvolledig doet;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel105
  - number: 10:5.1.b
    text: 'ingevolge de douanewetgeving verplicht is tot:'
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel105
  - number: 10:5.1.b.1°
    text: het verstrekken van inlichtingen, gegevens of aanwijzingen, en deze niet, onjuist of onvolledig verstrekt;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel105
  - number: 10:5.1.b.2°
    text: |-
      het vertonen, overgeven of voor raadpleging beschikbaar stellen van bepaalde gegevensdragers, of de inhoud daarvan,
      en een zodanige verplichting niet nakomt;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel105
  - number: 10:5.1.b.3°
    text: |-
      het vertonen, overgeven of voor raadpleging beschikbaar stellen van bepaalde gegevensdragers, of de inhoud daarvan,
      en valse of vervalste gegevensdragers vertoont, overgeeft of voor raadpleging beschikbaar stelt, dan wel de inhoud
      daarvan in valse of vervalste vorm voor dit doel beschikbaar stelt;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel105
  - number: 10:5.1.b.4°
    text: |-
      het voeren van een administratie overeenkomstig de daaraan bij of krachtens de douanewetgeving gestelde eisen, en
      een zodanige administratie niet voert;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel105
  - number: 10:5.1.b.5°
    text: |-
      het bewaren van boeken, bescheiden of andere gegevensdragers, en deze niet bewaart; wordt gestraft met hechtenis
      van ten hoogste zes maanden of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel105
  - number: 10:5.2
    text: |-
      Degene die opzettelijk een der feiten begaat, omschreven in het eerste lid, onderdeel b, onder 1°, 2°, 4° of 5°,
      wordt, indien het feit ertoe strekt dat te weinig rechten bij invoer worden geheven, gestraft met gevangenisstraf
      van ten hoogste vier jaren of geldboete van de vierde categorie of, indien dit bedrag hoger is, ten hoogste eenmaal
      het bedrag van de te weinig geheven rechten.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel105
  - number: 10:5.3
    text: |-
      Degene die opzettelijk een der feiten begaat, omschreven in het eerste lid, onderdeel a of b, onder 3°, wordt,
      indien het feit ertoe strekt dat te weinig rechten bij invoer worden geheven, gestraft met gevangenisstraf van
      ten hoogste zes jaren of geldboete van de vijfde categorie of, indien dit bedrag hoger is, ten hoogste eenmaal het
      bedrag van de te weinig geheven rechten.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel105
  - number: 10:5.4
    text: |-
      Indien het feit, ter zake waarvan de verdachte kan worden vervolgd, zowel valt onder een van de bepalingen van
      het tweede of het derde lid, als onder die van [artikel 225, tweede lid, van het Wetboek van Strafrecht][ref1], is
      strafvervolging op grond van genoemd [artikel 225, tweede lid][ref2], uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel225
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel225
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '225'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '225'
  - number: 10:5.5
    text: Dit artikel is niet van toepassing ten aanzien van de invordering van de rechten bij invoer.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel105
  - number: 10:6
    text: |-
      Degene die niet voldoet aan een hem bij of krachtens, [artikel 1:11][ref1], [1:23][ref2], [1:24, derde lid][ref3],
      [1:27, eerste lid][ref4],[1:28, tweede of derde lid][ref5], of [1:32, tweede lid][ref6], van deze wet, dan wel
      de artikelen 15, eerste lid, of 189, tweede lid, van het Douanewetboek van de Unie opgelegde verplichting, wordt
      gestraft met geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0023746#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0023746#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0023746#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0023746#Artikel1
      [ref6]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: 1.2.1
        afdeling: '1.2'
      - id: ref2
        bwb_id: BWBR0023746
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: 1.2.4
        afdeling: '1.2'
      - id: ref3
        bwb_id: BWBR0023746
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: 1.2.4
        afdeling: '1.2'
      - id: ref4
        bwb_id: BWBR0023746
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: 1.2.4
        afdeling: '1.2'
      - id: ref5
        bwb_id: BWBR0023746
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: 1.2.4
        afdeling: '1.2'
      - id: ref6
        bwb_id: BWBR0023746
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: 1.2.4
        afdeling: '1.2'
  - number: 10:7
    text: |-
      Degene die niet voldoet aan de hem bij [artikel 1:34][ref1] opgelegde verplichting, wordt gestraft met geldboete
      van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: 1.2.4
        afdeling: '1.2'
  - number: 10:8.1
    text: |-
      Degene die een tot stand gebrachte identificatiemaatregel met betrekking tot een vervoermiddel, bergingsmiddel,
      verpakkingsmiddel, goederen, werktuig, leiding, gebouw of terrein, of deel daarvan, in strijd met de
      douanewetgeving schendt, wordt gestraft met geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel108
  - number: 10:8.2
    text: |-
      Degene die een van de in het eerste lid omschreven feiten opzettelijk begaat, wordt gestraft met gevangenisstraf
      van ten hoogste twee jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel108
  - number: 10:8.3
    text: |-
      Degene die, nadat hij door de inspecteur in kennis is gesteld van diens voornemen om een identificatiemaatregel
      als bedoeld in het eerste lid tot stand te brengen, er geen zorg voor draagt dat de inspecteur deze maatregel op
      een deugdelijke wijze tot stand kan brengen, alsmede degene die, behoudens indien zich al dan niet in het kader van
      een douaneregeling gevallen voordoen als bedoeld in artikel 192, tweede lid, van het Douanewetboek van de Unie, er
      geen zorg voor draagt dat de door de inspecteur tot stand gebrachte identificatiemaatregel in stand blijft, wordt
      gestraft met geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel108
  - number: 10:8.4
    text: |-
      Degene die anders dan als inspecteur bevoegd is om een identificatiemaatregel tot stand te brengen en er geen zorg
      voor draagt dat de maatregel op een deugdelijke wijze tot stand wordt gebracht, wordt gestraft met geldboete van de
      derde categorie.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel108
  - number: 10:8.5
    text: |-
      Ten aanzien van de in het derde en in het vierde lid omschreven feiten kan voor de betrokkene niet het bestaan van
      overmacht worden aangenomen, indien hij niet onverwijld nadat hem bekend is geworden dat een identificatiemaatregel
      niet op deugdelijke wijze is tot stand gebracht of een identificatiemaatregel niet in stand is gebleven, daarvan
      aan de inspecteur mededeling doet.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel108
  - number: 10:9.1
    text: |-
      Degene die van goederen waaraan herkenningsmiddelen of denatureringsmiddelen zijn toegevoegd, die
      herkenningsmiddelen of denatureringsmiddelen daarvan geheel of ten dele afscheidt, de werking ervan geheel of ten
      dele opheft of verandert, wordt gestraft met geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel109
  - number: 10:9.2
    text: |-
      Degene die een der in het eerste lid omschreven feiten opzettelijk begaat, wordt gestraft met gevangenisstraf van
      ten hoogste twee jaren of geldboete van de vierde categorie of, indien dit bedrag hoger is, ten hoogste eenmaal het
      bedrag van de te weinig geheven rechten bij invoer.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel109
  - number: 10:10
    text: |-
      Overtreding van krachtens deze wet bij algemene maatregel van bestuur vastgestelde bepalingen wordt, voorzover die
      overtreding is aangemerkt als strafbaar feit, gestraft met geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel1010
  - number: 10:11
    text: |-
      Overtreding van krachtens deze wet bij regeling van Onze Minister wie het aangaat vastgestelde bepalingen,
      voorzover die overtreding is aangemerkt als strafbaar feit, gestraft met geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel1011
  - number: 10:13
    text: |-
      De bij deze wet strafbaar gestelde feiten waarop gevangenisstraf is gesteld, zijn misdrijven. De overige bij deze
      wet strafbaar gestelde feiten, alsmede de in de op deze wet berustende bepalingen strafbaar gestelde feiten, zijn
      overtredingen.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel1013
  - number: 10:14
    text: |-
      Ter zake van de bij deze wet of de daarop berustende bepalingen strafbaar gestelde feiten vindt
      [artikel 36e van het Wetboek van Strafrecht][ref1] geen toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel36e
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel1014
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 36e
  - number: 10:15.1
    text: |-
      Ten aanzien van bij deze wet of de daarop berustende bepalingen strafbaar gestelde feiten met betrekking
      tot welke het proces-verbaal niet overeenkomstig [artikel 11:3, tweede lid][ref1], in handen van de
      officier van justitie is gesteld, kan in afwijking van de [artikelen 257a][ref2], [257b][ref3] en
      [257ba van het Wetboek van Strafvordering][ref4], uitsluitend de inspecteur een strafbeschikking uitvaardigen. Bij
      regeling van Onze minister van Financiën kunnen functionarissen worden aangewezen die deze bevoegdheid namens de
      inspecteur kunnen uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel257a
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel257b
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel257ba
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel1015
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '11'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 257a
      - id: ref3
        bwb_id: BWBR0001903
        artikel: 257b
      - id: ref4
        bwb_id: BWBR0001903
        artikel: 257ba
  - number: 10:15.2
    text: |-
      In deze strafbeschikking kan een geldboete worden opgelegd. Voorts kan deze strafbeschikking aanwijzingen bevatten
      waaraan de verdachte moet voldoen. De aanwijzingen kunnen inhouden:
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel1015
  - number: 10:15.2.a
    text: |-
      afstand van voorwerpen die in beslag zijn genomen en vatbaar zijn voor verbeurdverklaring of onttrekking aan het
      verkeer;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel1015
  - number: 10:15.2.b
    text: |-
      uitlevering, of voldoening aan de staat van de geschatte waarde, van voorwerpen die vatbaar zijn voor
      verbeurdverklaring;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel1015
  - number: 10:15.2.c
    text: |-
      voldoening aan de Staat van een geldbedrag gelijk aan of lager dan het geschatte voordeel – met inbegrip van
      besparing van kosten – door de verdachte verkregen door middel van of uit het strafbare feit;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel1015
  - number: 10:15.2.d
    text: het alsnog voldoen aan een uit de douanewetgeving voortvloeiende verplichting.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel1015
  - number: 10:15.3
    text: |-
      Een strafbeschikking waarin een geldboete wordt opgelegd van meer dan € 2000, wordt, in afwijking van
      [artikel 257c, tweede lid, van het Wetboek van Strafvordering][ref1], slechts uitgevaardigd indien de verdachte
      daaraan voorafgaand is gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel257c
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel1015
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 257c
  - number: 10:15.4
    text: |-
      Een geldboete wordt, in zoverre in afwijking van [artikel 6:1:17 van het Wetboek van Strafvordering][ref1],
      ingevorderd op de wijze, voorzien in de [Invorderingswet 1990][ref2]. Daartoe wordt een afschrift van de
      strafbeschikking aan de ontvanger ter hand gesteld. De inspecteur of de aangewezen functionaris bepaalt voorts de
      termijn binnen welke aan de gegeven aanwijzingen moet zijn voldaan en zo nodig tevens de plaats waar zulks moet
      geschieden. De gestelde termijn kan voor de afloop daarvan eenmaal worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0004770
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel1015
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0004770
  - number: 10:15.5
    text: |-
      In afwijking van [artikel 257h, tweede lid, van het Wetboek van Strafvordering][ref1] verstrekt de inspecteur
      desgevraagd een afschrift van een strafbeschikking aan ieder ander dan de verdachte of zijn raadsman, tenzij
      verstrekking naar het oordeel van het bestuur ter bescherming van de belangen van degene ten aanzien van wie
      de strafbeschikking is uitgevaardigd of van de derden die in de strafbeschikking worden genoemd, geheel of
      gedeeltelijk dient te worden geweigerd. In het laatste geval kan de inspecteur een geanonimiseerd afschrift van de
      strafbeschikking verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel257h
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel1015
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 257h
  - number: 10:15.6
    text: |-
      Indien binnen veertien dagen geen afschrift dan wel een geanonimiseerd afschrift wordt verstrekt, kan de verzoeker
      een klaagschrift indienen bij de inspecteur. Deze stelt het klaagschrift, de strafbeschikking en het proces-
      verbaal in handen van de officier van justitie, welke het klaagschrift en de processtukken onverwijld ter kennis
      brengt van de rechtbank, tenzij hij alsnog aan het verzoek tegemoetkomt. De procesdeelnemers zijn, in afwijking van
      [artikel 23, vierde lid, van het Wetboek van Strafvordering][ref1] niet bevoegd van de inhoud van de processtukken
      kennis te nemen dan voor zover de rechtbank zulks toestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel23
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel1015
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '23'
  - number: 10:15.7
    text: |-
      [Artikel 552ab van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel552ab
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel1015
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 552ab
  - number: 10:16.1
    text: |-
      Medeplichtigheid aan de in de [artikelen 10:1, eerste lid][ref1], [10:2][ref2], [10:3, eerste lid][ref3],
      en [10:5, eerste lid, onderdeel a][ref4], vermelde overtredingen is strafbaar. Te dien aanzien vinden de
      [artikelen 48][ref5] en [49 van het Wetboek van Strafrecht][ref6] overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0023746#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0023746#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0023746#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel48
      [ref6]: https://wetten.overheid.nl/BWBR0001854#Artikel49
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel1016
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '10'
        hoofdstuk: '10'
        afdeling: '10.1'
      - id: ref2
        bwb_id: BWBR0023746
        artikel: '10'
        hoofdstuk: '10'
        afdeling: '10.1'
      - id: ref3
        bwb_id: BWBR0023746
        artikel: '10'
        hoofdstuk: '10'
        afdeling: '10.1'
      - id: ref4
        bwb_id: BWBR0023746
        artikel: '10'
        hoofdstuk: '10'
        afdeling: '10.1'
      - id: ref5
        bwb_id: BWBR0001854
        artikel: '48'
      - id: ref6
        bwb_id: BWBR0001854
        artikel: '49'
  - number: 10:16.2
    text: |-
      Poging tot de in [artikel 10:3, eerste lid][ref1], vermelde overtreding is strafbaar. Te dien aanzien vindt
      [artikel 45 van het Wetboek van Strafrecht][ref2] overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel45
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel1016
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '10'
        hoofdstuk: '10'
        afdeling: '10.1'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '45'
  - number: 10:17
    text: |-
      De Nederlandse strafwet is ook van toepassing op ieder die zich buiten het gebied waarop deze wet ingevolge
      [artikel 1:2][ref1] van toepassing is, schuldig maakt aan:


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel1017
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1.1'
  - number: 10:17.a
    text: enig in deze wet omschreven misdrijf;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel1017
  - number: 10:17.b
    text: |-
      de in [artikel 10:5, eerste lid, onderdeel b, onder 3°][ref1], omschreven overtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel10
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel1017
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '10'
        hoofdstuk: '10'
        afdeling: '10.1'
  - number: 10:18
    text: |-
      Bij veroordeling wegens een der in de [artikelen 10:1][ref1], [10:2][ref2], [10:3][ref3],
      [10:4][ref4] en [10:5][ref5], eerste lid, onderdeel a, omschreven strafbare feiten kunnen de in
      [artikel 33a, eerste lid, onderdelen b tot en met e, van het Wetboek van Strafrecht][ref6] genoemde voorwerpen ook
      worden verbeurdverklaard, indien zij niet aan de in [dat artikel][ref7] bedoelde persoon toebehoren.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0023746#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0023746#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0023746#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0023746#Artikel10
      [ref6]: https://wetten.overheid.nl/BWBR0001854#Artikel33a
      [ref7]: https://wetten.overheid.nl/BWBR0001854#Artikel33a
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel1018
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '10'
        hoofdstuk: '10'
        afdeling: '10.1'
      - id: ref2
        bwb_id: BWBR0023746
        artikel: '10'
        hoofdstuk: '10'
        afdeling: '10.1'
      - id: ref3
        bwb_id: BWBR0023746
