$id: algemene_douanewet
regulatory_layer: WET
publication_date: '2025-05-27'
valid_from: '2022-12-22'
bwb_id: BWBR0023746
url: https://wetten.overheid.nl/BWBR0023746/2022-12-22
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het ter verbetering van de doelmatigheid, ter verhoging van de
    inzichtelijkheid en ter vereenvoudiging van de wetgeving inzake het douanetoezicht op dan wel de douanecontrole
    van goederen en goederenverkeer in ruime zin, wenselijk is, regels, welke ten aanzien van douanetoezicht en
    douanecontrole gemeen zijn, in een algemene wet samen te vatten, mede in verband met de op douanetoezicht en
    douanecontrole betrekking hebbende internationale afspraken of besluiten van volkenrechtelijke organisaties;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#ArtikelAanhef
articles:
  - number: 1:1.1
    text: 'De bepalingen bij of krachtens deze wet vormen de nationale bepalingen ter uitvoering van:'
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel11
  - number: 1:1.1.a
    text: het Douanewetboek van de Unie, de krachtens dat wetboek vastgestelde EU-rechtshandelingen, en
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel11
  - number: 1:1.1.b
    text: Uniewetgeving op andere gebieden als bedoeld in het Douanewetboek van de Unie.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel11
  - number: 1:1.2
    text: |-
      De bepalingen bij of krachtens deze wet strekken mede ten behoeve van de nakoming van verplichtingen die
      voortvloeien uit:
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel11
  - number: 1:1.2.a
    text: interregionaal recht,
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel11
  - number: 1:1.2.b
    text: het Koninkrijk verbindende verdragen en
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel11
  - number: 1:1.2.c
    text: |-
      in al hun onderdelen verbindende besluiten van bij zodanige verdragen opgerichte volkenrechtelijke organisaties,
      voorzover deze verplichtingen betrekking hebben op het douanetoezicht op, dan wel op de douanecontrole van,
      goederen en het goederenverkeer en voorts onderwerpen betreffen die vallen onder de reikwijdte van een of meer
      regelingen als bedoeld in de bijlage bij deze wet.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel11
  - number: 1:1.3
    text: |-
      De bepalingen bij of krachtens deze wet strekken mede ten behoeve van de nakoming van verplichtingen die
      voortvloeien uit regelingen van internationaal recht tot het verlenen van wederzijdse administratieve bijstand
      inzake goederen en goederenverkeer.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel11
  - number: 1:1.4
    text: |-
      De bepalingen bij of krachtens deze wet strekken mede tot uitvoering van bindende EU-rechtshandelingen, voorzover
      deze betrekking hebben op goederen en goederenverkeer en voorts onderwerpen betreffen die vallen onder de
      reikwijdte van een of meer regelingen als bedoeld in de bijlage bij deze wet.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel11
  - number: 1:1.5
    text: |-
      De bepalingen bij of krachtens deze wet strekken mede ter handhaving van verboden of beperkingen die op goederen
      bij het binnenbrengen in, onderscheidenlijk verlaten van, het douanegebied van de Unie dan wel de gebieden,
      bedoeld in [artikel 1:2][ref1], of bij het plaatsen onder een douaneregeling of wederuitvoer van die goederen van
      toepassing zijn of zouden zijn bij of krachtens een bindende EU-rechtshandeling of een ander wettelijk voorschrift
      dat is opgenomen in de bijlage bij deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '1.1'
  - number: 1:1.6
    text: Bij algemene maatregel van bestuur kunnen wijzigingen worden aangebracht in de bijlage bij deze wet.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel11
  - number: 1:2
    text: |-
      Deze wet is van toepassing op het grondgebied van Nederland met inbegrip van zijn luchtruim, zijn maritieme
      binnenwateren en territoriale zee, en elk gebied buiten deze territoriale zee waarin Nederland, in overeenstemming
      met het internationale recht, jurisdictie of soevereine rechten uitoefent met betrekking tot de zeebodem, de
      ondergrond daarvan, het bovenliggende water en luchtruim.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel12
  - number: 1:3.1
    text: |-
      In aanvulling op de begripsbepalingen van het Douanewetboek van de Unie, de krachtens dat wetboek vastgestelde
      Gedelegeerde Verordening Douanewetboek van de Unie, Uitvoeringsverordening Douanewetboek van de Unie en andere
      bindende EU-rechtshandelingen wordt verstaan onder:
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel13
  - number: 1:3.1.a
    text: |-
      *Douanewetboek van de Unie:* Verordening (EU) nr. 952/2013 van het Europees Parlement en van de Raad van 9 oktober
      2013 tot vaststelling van het douanewetboek van de Unie (PbEU 2013, L 269);
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel13
  - number: 1:3.1.b
    text: |-
      *Gedelegeerde Verordening Douanewetboek van de Unie:* Gedelegeerde Verordening (EU) 2015/2446 van de Commissie
      van 28 juli 2015 tot aanvulling van Verordening (EU) nr. 952/2013 van het Europees Parlement en de Raad met nadere
      regels betreffende een aantal bepalingen van het douanewetboek van de Unie (PbEU 2015, L 343);
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel13
  - number: 1:3.1.ba
    text: |-
      *Uitvoeringsverordening Douanewetboek van de Unie:* Uitvoeringsverordening (EU) 2015/2447 van de Commissie van
      24 november 2015 houdende nadere uitvoeringsvoorschriften voor enkele bepalingen van Verordening (EU) nr. 952/2013
      van het Europees Parlement en de Raad tot vaststelling van het douanewetboek van de Unie (PbEU 2015, L 343);
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel13
  - number: 1:3.1.bb
    text: |-
      *Verordening liquide middelen:* Verordening (EU) 2018/1672 van het Europees Parlement en de Raad van 23 oktober
      2018 betreffende de controle van liquide middelen die de Unie binnenkomen of verlaten en tot intrekking van
      [Verordening (EG) nr. 1889/2005](32005R1889) (PbEU 2018, L 284);
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel13
  - number: 1:3.1.c
    text: |-
      inspecteur of ontvanger: functionaris die met de toepassing van deze wet is belast en als zodanig bij regeling
      van Onze Minister van Financiën, in voorkomend geval, in overeenstemming met Onze Minister wie het mede aangaat,
      is aangewezen;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel13
  - number: 1:3.1.d
    text: 'douaneautoriteiten, bevoegde autoriteiten of douane of douanediensten: de inspecteur of ontvanger;'
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel13
  - number: 1:3.1.e
    text: 'goederen: alle zaken die kunnen worden ingedeeld in het douanetarief;'
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel13
  - number: 1:3.1.f
    text: 'rechten bij invoer: zowel rechten bij invoer als invoerrechten;'
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel13
  - number: 1:3.1.g
    text: |-
      verzoeker: aanvrager, bedoeld in de [Algemene wet bestuursrecht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 1:3.1.h
    text: 'Koninkrijk: Koninkrijk der Nederlanden;'
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel13
  - number: 1:3.1.i
    text: 'Rijk: het land Nederland, zijnde Nederland en de BES-eilanden;'
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel13
  - number: 1:3.1.j
    text: 'Nederland: het in Europa gelegen deel van het Koninkrijk;'
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel13
  - number: 1:3.1.k
    text: |-
      BES-eilanden: de openbare lichamen Bonaire, Sint Eustatius en Saba, met daaronder begrepen, met inachtneming van de
      Rijkswet van 7 juli 2010 tot vaststelling van een zeegrens tussen Curaçao en Bonaire en tussen Sint Maarten en Saba
      (Stb. 2010, 342), het buiten de territoriale zee van de BES-eilanden gelegen deel van de zeebodem en de ondergrond
      daarvan, voor zover het Koninkrijk daar op grond van het internationale recht ten behoeve van de exploratie en
      de exploitatie van natuurlijke rijkdommen soevereine rechten mag uitoefenen, alsmede de in, op, of boven dat
      gebied aanwezige installaties en andere inrichtingen ten behoeve van de exploratie en exploitatie van natuurlijke
      rijkdommen in dat gebied.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel13
  - number: 1:3.2
    text: |-
      Bij de regeling, bedoeld in het eerste lid, onder c, kan de aanwijzing tot inspecteur dan wel ontvanger worden
      beperkt tot een bepaalde locatie dan wel taak en kunnen bevoegdheden worden uitgezonderd.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel13
  - number: 1:3.3
    text: |-
      Wanneer de regeling, bedoeld in het eerste lid, onderdeel c, een aanwijzing betreft van een functionaris die niet
      ressorteert onder de rijksbelastingdienst, is in elk geval uitgezonderd:
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel13
  - number: 1:3.3.a
    text: |-
      indien het een aanwijzing betreft ter zake van taken in het kader van de [Erfgoedwet][ref1] of de
      [Wet vervoer over zee][ref2], de bevoegdheden, bedoeld in de [artikelen 1:30][ref3], [1:36][ref4] en [1:37][ref5];


