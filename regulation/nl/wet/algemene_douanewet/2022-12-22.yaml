        hoofdstuk: '10'
        afdeling: '10.1'
      - id: ref4
        bwb_id: BWBR0023746
        artikel: '10'
        hoofdstuk: '10'
        afdeling: '10.1'
      - id: ref5
        bwb_id: BWBR0023746
        artikel: '10'
        hoofdstuk: '10'
        afdeling: '10.1'
      - id: ref6
        bwb_id: BWBR0001854
        artikel: 33a
      - id: ref7
        bwb_id: BWBR0001854
        artikel: 33a
  - number: 11:1.1
    text: |-
      De rechtbanken vonnissen in eerste aanleg over bij deze wet of de daarop berustende bepalingen strafbaar gestelde
      feiten.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel111
  - number: 11:1.2
    text: 'De vonnissen zijn aan hoger beroep onderworpen, voorzover zij zijn gewezen:'
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel111
  - number: 11:1.2.a
    text: ter zake van misdrijven;
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel111
  - number: 11:1.2.b
    text: |-
      ter zake van overtredingen ten aanzien van degene die op het tijdstip waarop de vervolging tegen hem is
      aangevangen, de leeftijd van achttien jaar nog niet had bereikt.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel111
  - number: 11:1.3
    text: |-
      Tegen andere vonnissen kan de verdachte hoger beroep instellen, indien hechtenis als hoofdstraf is opgelegd, een
      geldboete van € 113 of meer is opgelegd dan wel een verbeurdverklaring is uitgesproken; het openbaar ministerie kan
      hoger beroep instellen, indien het gelijke straffen heeft gevorderd.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel111
  - number: 11:2
    text: |-
      Ten aanzien van bij deze wet of de daarop berustende bepalingen strafbaar gestelde feiten worden personen, niet
      zijnde natuurlijke personen, voor de toepassing van [artikel 2 van het Wetboek van Strafvordering][ref1] geacht te
      wonen, waar zij gevestigd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel2
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '2'
  - number: 11:3.1
    text: |-
      Met het opsporen van bij deze wet of de daarop berustende bepalingen strafbaar gestelde feiten zijn, behalve
      de in [artikel 141 van het Wetboek van Strafvordering][ref1] bedoelde personen, belast de ambtenaren van de
      rijksbelastingdienst, bevoegd inzake douane, dan wel de ambtenaren die bij regeling van Onze Minister van Financiën
      in overeenstemming met Onze Minister wie het mede aangaat zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 11:3.2
    text: |-
      In afwijking van [artikel 156 van het Wetboek van Strafvordering][ref1] worden alle processen-verbaal betreffende
      bij deze wet of de daarop berustende bepalingen strafbaar gestelde feiten ingezonden bij de inspecteur. De
      inspecteur doet de processen-verbaal betreffende strafbare feiten,


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel156
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '156'
  - number: 11:3.2.a
    text: |-
      als bedoeld in de artikelen 22 en 25 van de Verordening (EU) 2017/1939 van de Raad van 12 oktober 2017 betreffende
      nauwere samenwerking bij de instelling van het Europees Openbaar Ministerie («EOM») (PbEU 2017, L 283), of
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel113
  - number: 11:3.2.b
    text: |-
      ter zake waarvan inverzekeringstelling of voorlopige hechtenis is toegepast dan wel een woning tegen de wil van de
      bewoner is binnengetreden, met de inbeslaggenomen voorwerpen,
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel113
  - number: 11:3.3
    text: |-
      De officier van justitie is bevoegd, de zaak ter afdoening weer in handen van de inspecteur te stellen, welke
      daarmede alsdan kan handelen overeenkomstig [artikel 10:15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel10
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '10'
        hoofdstuk: '10'
        afdeling: '10.2'
  - number: 11:3.4
    text: |-
      Het bepaalde in [artikel 148, tweede lid, van het Wetboek van Strafvordering][ref1] vindt geen toepassing in zaken,
      waarin de inspecteur het proces-verbaal niet aan de officier van justitie heeft doen toekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel148
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '148'
  - number: 11:4
    text: |-
      De ambtenaren belast met het opsporen van bij deze wet of de daarop berustende bepalingen strafbaar gestelde
      feiten, zijn te allen tijde bevoegd tot inbeslagneming van de ingevolge het [Wetboek van Strafvordering][ref1] voor
      inbeslagneming vatbare voorwerpen. Zij kunnen daartoe hun uitlevering vorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: 11:5.1
    text: |-
      In zaken waarin de inspecteur het proces-verbaal niet ingevolge het bepaalde in [artikel 11:3, tweede lid][ref1],
      aan de officier van justitie heeft doen toekomen, geldt ten aanzien van de inspecteur hetgeen in
      [artikel 116 van het Wetboek van Strafvordering][ref2] ten aanzien van het openbaar ministerie is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel116
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '11'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '116'
  - number: 11:5.2
    text: |-
      In de zaken, bedoeld in het eerste lid, wordt bij de toepassing van de [artikelen 552a][ref1] en
      [552ab van het Wetboek van Strafvordering][ref2], alvorens het gerecht ingevolge [artikel 552a, vijfde lid][ref3],
      onderscheidenlijk [artikel 552ab, vierde lid][ref4], van dat artikel een beschikking neemt, ook
      de inspecteur in de gelegenheid gesteld te worden gehoord en is, in afwijking van het bepaalde in
      [artikel 552d van dat wetboek][ref5], niet het openbaar ministerie doch de inspecteur bevoegd tot het instellen van
      beroep in cassatie. De griffier van het gerecht hetwelk in die zaken ingevolge [artikel 552a, vijfde lid][ref6],
      of [artikel 552ab, vierde lid, van dat wetboek][ref7] een beschikking neemt, deelt deze onverwijld mee aan de
      inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel552a
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel552ab
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel552a
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel552ab
      [ref5]: https://wetten.overheid.nl/BWBR0001903#Artikel552d
      [ref6]: https://wetten.overheid.nl/BWBR0001903#Artikel552a
      [ref7]: https://wetten.overheid.nl/BWBR0001903#Artikel552ab
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 552a
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 552ab
      - id: ref3
        bwb_id: BWBR0001903
        artikel: 552a
      - id: ref4
        bwb_id: BWBR0001903
        artikel: 552ab
      - id: ref5
        bwb_id: BWBR0001903
        artikel: 552d
      - id: ref6
        bwb_id: BWBR0001903
        artikel: 552a
      - id: ref7
        bwb_id: BWBR0001903
        artikel: 552ab
  - number: 11:6
    text: |-
      Bij het opsporen van een bij deze wet of de daarop berustende bepalingen strafbaar gesteld feit hebben de in
      [artikel 11:3, eerste lid][ref1], bedoelde ambtenaren toegang tot elke plaats, voorzover dat redelijkerwijs voor
      de vervulling van hun taak nodig is. Zij zijn bevoegd zich door bepaalde door hen aangewezen personen te doen
      vergezellen.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel11
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '11'
        hoofdstuk: '11'
  - number: 11:7
    text: |-
      Ten dienste van de vervolging en berechting van bij deze wet of de daarop berustende bepalingen strafbaar gestelde
      feiten kan Onze Minister van Financiën, in overeenstemming met Onze Minister van Justitie en Veiligheid, ambtenaren
      van de rijksbelastingdienst, bevoegd inzake douane, aanwijzen, die het contact onderhouden met het openbaar
      ministerie.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel117
  - number: 11:8
    text: |-
      De griffiers verstrekken aan de inspecteur desgevraagd kosteloos afschrift of uittreksel van arresten of vonnissen,
      met toepassing van deze wet gewezen.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel118
  - number: 11:9
    text: |-
      Met betrekking tot gerechtelijke mededelingen inzake bij deze wet of de daarop berustende bepalingen strafbaar
      gestelde feiten hebben de ambtenaren van de rijksbelastingdienst, bevoegd inzake douane, de bevoegdheden bij het
      [Wetboek van Strafvordering][ref1] aan ambtenaren van politie, aangesteld voor de uitvoering van de politietaak,
      toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: 11:10
    text: |-
      Ten aanzien van de tenuitvoerlegging van rechterlijke beslissingen inzake bij deze wet of de daarop berustende
      bepalingen strafbaar gestelde feiten hebben de ambtenaren van de rijksbelastingdienst, bevoegd inzake douane, de
      bevoegdheid van deurwaarders.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel1110
  - number: 11:11.1
    text: 'De ambtenaren van de rijksbelastingdienst, bevoegd inzake douane, zijn tevens belast met de opsporing van:'
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel1111
  - number: 11:11.1.a
    text: |-
      de misdrijven omschreven in de [artikelen 179 tot en met 182 van het Wetboek van Strafrecht][ref1], welke jegens
      hen zijn begaan;


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel179
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel1111
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '179'
  - number: 11:11.1.b
    text: |-
      het misdrijf omschreven in [artikel 184 van het Wetboek van Strafrecht][ref1], indien het bevel of de vordering is
      gedaan krachtens of de handeling is ondernomen ter uitvoering van de douanewetgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel1111
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '184'
  - number: 11:11.2
    text: |-
      De [artikelen 152][ref1], [153][ref2], [156][ref3] en [159 van het Wetboek van Strafvordering][ref4] zijn te dezen
      op de ambtenaren van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel152
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel153
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel156
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel159
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel1111
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '152'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '153'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '156'
      - id: ref4
        bwb_id: BWBR0001903
        artikel: '159'
  - number: 11:12.1
    text: |-
      Met betrekking tot bij deze wet strafbaar gestelde feiten en met uitbreiding van
      [artikel 53 van het Wetboek van Strafvordering][ref1] is de inspecteur bevoegd een van misdrijf verdachte persoon
      die is aangehouden in of op een locatie of vervoermiddel, een en ander als bedoeld in de [artikelen 1:26][ref2] en
      [1:27][ref3], of bij het juist hebben verlaten van een locatie of vervoermiddel als in die artikelen bedoeld, na
      aanhouding naar een plaats voor verhoor te geleiden dan wel diens aanhouding of voorgeleiding te bevelen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0023746#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel1112
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '53'
      - id: ref2
        bwb_id: BWBR0023746
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: 1.2.4
        afdeling: '1.2'
      - id: ref3
        bwb_id: BWBR0023746
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: 1.2.4
        afdeling: '1.2'
  - number: 11:12.2
    text: |-
      Indien de inspecteur die de verdachte heeft aangehouden of voor wie de verdachte wordt geleid de
      inverzekeringstelling of de bewaring van de verdachte nodig oordeelt, doet hij de verdachte voorgeleiden voor de
      officier van justitie of voor een hulpofficier van justitie.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel1112
  - number: 11:12.3
    text: |-
      Indien de verdachte niet voor de officier of voor een hulpofficier van justitie wordt voorgeleid, wordt de
      verdachte, na te zijn verhoord, dadelijk in vrijheid gesteld.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel1112
  - number: 11:12.4
    text: |-
      De verdachte van een misdrijf waarvoor voorlopige hechtenis is toegelaten kan ten hoogste negen uur worden
      opgehouden voor onderzoek; de verdachte van een misdrijf waarvoor voorlopige hechtenis niet is toegelaten ten
      hoogste zes uur. De tijd tussen middernacht en negen uur ’s ochtends wordt voor de berekening van deze termijnen
      niet meegerekend. De ophouding vindt plaats in het belang van het onderzoek.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel1112
  - number: 11:13.1
    text: |-
      Goederen die in beslag zijn genomen ter zake van het begaan van strafbare feiten als bedoeld in deze wet of
      de daarop berustende bepalingen kunnen, voorzover de eisen van het onderzoek of het algemeen belang bij hun
      vernietiging of onbruikbaarmaking zich niet daartegen verzetten, zo nodig na monsterneming, overeenkomstig bij
      regeling van Onze Minister van Financiën te stellen regels, tegen zekerheidstelling worden vrijgegeven.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel1113
  - number: 11:13.2
    text: |-
      Het bepaalde in het eerste lid vindt geen toepassing ten aanzien van goederen, in beslag genomen in zaken waarin
      de inspecteur het proces-verbaal ingevolge het bepaalde in [artikel 10:3, tweede lid][ref1], aan de officier van
      justitie heeft doen toekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel10
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel1113
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '10'
        hoofdstuk: '10'
        afdeling: '10.1'
  - number: 11:13.3
    text: |-
      De overeenkomstig het eerste lid gestelde zekerheid treedt voor de toepassing van bepalingen betreffende
      verbeurdverklaring en inbeslagneming, alsmede voor de uitoefening van het recht van verhaal, in de plaats van de in
      beslag genomen goederen.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel1113
  - number: 11:14.1
    text: |-
      Van goederen die ter zake van het begaan van strafbare feiten als bedoeld in deze wet of de daarop berustende
      bepalingen, in beslag zijn genomen van onbekende personen, wordt volgens bij regeling van Onze Minister van
      Financiën te stellen regels in het openbaar mededeling gedaan.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel1114
  - number: 11:14.2
    text: |-
      Indien niet binnen een jaar na dagtekening van de in het eerste lid bedoelde mededeling op voldoende wijze blijkt
      wie de ten aanzien van de in beslag genomen goederen bevonden overtreding van de douanewetgeving heeft begaan en
      evenmin de belanghebbende bij de goederen aannemelijk maakt dat zij ten onrechte in beslag zijn genomen, vervallen
      de goederen aan de Staat.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel1114
  - number: 12:1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter verzekering van een juiste toepassing van het
      Douanewetboek van de Unie, de Gedelegeerde Verordening Douanewetboek van de Unie of de Uitvoeringsverordening
      Douanewetboek van de Unie nadere regels worden gesteld ter aanvulling van de in deze wet geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel121
  - number: 12:2
    text: |-
      Bij het uitoefenen van het recht op beroep moet in bezwaar-, verzoek-, beroep-, verweer- en verzetschriften hij die
      niet in Nederland een vaste woonplaats of plaats van vestiging heeft, domicilie kiezen in Nederland.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel122
  - number: 12:3
    text: |-
      Het ingevolge het Douanewetboek van de Unie, de Gedelegeerde Verordening Douanewetboek van de Unie of de
      Uitvoeringsverordening Douanewetboek van de Unie of de wet bekendmaken, toezenden daaronder begrepen, van een stuk
      aan een persoon, die niet binnen Nederland een vaste woonplaats of plaats van vestiging heeft, kan ook geschieden
      aan de binnen Nederland gelegen vaste inrichting voor de uitoefening van zijn bedrijf of beroep, dan wel aan de
      woning of het kantoor van de binnen Nederland wonende of gevestigde vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel123
  - number: 12:4
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel124
  - number: 12:5
    text: |-
      Voor de bekendmaking van deze wet stelt Onze Minister van Financiën de nummering van de artikelen, paragrafen,
      hoofdstukken en afdelingen van deze wet opnieuw vast en brengt hij de in deze wet voorkomende aanhalingen van
      artikelen, paragrafen, hoofdstukken en afdelingen daarmee in overeenstemming.
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel125
  - number: 12:6
    text: 'Deze wet wordt aangehaald als: Algemene douanewet.'
    url: https://wetten.overheid.nl/BWBR0023746/2022-12-22#Artikel126
