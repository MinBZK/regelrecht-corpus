  - number: 1:3.4
    text: |-
      Het derde lid, aanhef en onderdeel c, is niet van toepassing indien het betreft een controle ter zake van
      de [Kernenergiewet][ref1], de [Prijzennoodwet][ref2], de [Uitvoeringswet verdrag chemische wapens][ref3],
      de [Waarborgwet 2019][ref4], de [Destructiewet][ref5], de [Wet dieren][ref6], de [Erfgoedwet][ref7],
      de [Waterwet][ref8], de [Wet vervoer over zee][ref9], de [Wet zeevarenden][ref10], de
      [Wet voorkoming verontreiniging door schepen][ref11], de [Warenwet][ref12], de [Wet geluidhinder][ref13] en de
      [Wet milieubeheer][ref14].


