    text: |-
      1 De inspecteur is bevoegd over te gaan tot een onderzoek van goederen en het eventueel nemen van monsters voor
      analyse of grondige controle ingeval geen aanvaarding van een douaneaangifte heeft plaatsgevonden.

      2 Voor de toepassing van het eerste lid is artikel 69 van het Communautair douanewetboek en Deel I, Titel VIII, van
      de toepassingsverordening Communautair douanewetboek van overeenkomstige toepassing, tenzij het doel of de aard van
      het onderzoek zich daartegen verzet.

      3 Ten behoeve van het onderzoek is, op vordering van de inspecteur, de persoon die goederen vervoert die zich niet
      in of op een vervoermiddel bevinden, gehouden terstond stil te staan.

      4 Bij regeling van Onze Minister van Veiligheid en Justitie wordt bepaald op welke wijze de vordering tot
      stilhouden wordt gedaan.

      5 De belanghebbende bij de goederen wordt voor de werking van dit artikel aangemerkt als aangever.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel124
  - number: 1:25
    text: |-
      1 Het onderzoek van een groep of partij goederen of de controle achteraf van de aangiften kan geschieden door
      middel van een gedeeltelijk onderzoek.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels gegeven worden omtrent de wijze van het uitvoeren
      van een gedeeltelijk onderzoek.

      3 Bij of krachtens de algemene maatregel van bestuur, bedoeld in het tweede lid, kunnen de maatstaven worden
      vastgesteld aan de hand waarvan de resultaten van het onderzoek van goederen dan wel de controle achteraf van
      aangiften, deel uitmakend van het deelonderzoek, als beslissend wordt aangemerkt voor de gehele groep of partij
      goederen waartoe de onderzochte goederen onderscheidenlijk de gehele groep van aangiften waartoe de gecontroleerde
      aangiften behoren.

      4 Voor de toepassing van dit artikel is, voor zover het een gedeeltelijk onderzoek van goederen betreft, artikel
      70, eerste lid, tweede alinea, van het Communautair douanewetboek van overeenkomstige toepassing, met dien
      verstande dat de belanghebbende bij de goederen wordt aangemerkt als aangever.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel125
  - number: 1:26
    text: |-
      1 De inspecteur is bevoegd aan controle te onderwerpen:

      a. gebouwen, niet zijnde woningen, en terreinen:

        - ten aanzien waarvan ingevolge het bepaalde bij of krachtens de in [artikel 1:1, eerste lid][ref1], bedoelde
      regelingen een beschikking is genomen;
        - die erkend zijn als grensinspectiepost als bedoeld in artikel 2, tweede lid, onderdeel g, van [richtlijn 97/78/
      EG](31997L0078) van de Raad van 18 december 1997 tot vaststelling van de beginselen voor de organisatie van de
      veterinaire controles voor producten die uit derde landen in de Gemeenschap worden binnengebracht (PbEG L 24,
      1998);
        - die een goedgekeurde plaats van inspectie zijn als bedoeld in artikel 1, tweede lid, onderdeel b, van [richtlijn
      2004/103/EG](32004L0103) van de Commissie van 7 oktober 2004 betreffende de controles van de identiteit en de
      fytosanitaire controles van in deel B van bijlage V bij [Richtlijn 2000/29/EG](32000L0029) van de Raad opgenomen
      planten, plantaardige producten en andere materialen, die kunnen worden uitgevoerd op een andere plaats dan de
      plaats van binnenkomst in de Gemeenschap of op een dichtbijgelegen plaats en tot vaststelling van de eisen met
      betrekking tot deze controles (PbEU L 313);

      b. gebouwen, niet zijnde woningen, en terreinen alwaar zich goederen bevinden:

        - ten aanzien waarvan ingevolge het bepaalde bij of krachtens de in [artikel 1:1, eerste lid][ref2], bedoelde
      regelingen een beschikking is genomen;
        - waarvoor een invoer- of uitvoervergunning is afgegeven, dan wel waarvoor een dergelijke vergunning is
      aangevraagd;

      c. spoorwegemplacementen, plaatsen voor distributie en overslag voor goederen die over de weg worden vervoerd,
      havens, haventerreinen, luchthavens en luchtvaartterreinen;

      d. vervoermiddelen en de op of in die vervoermiddelen aanwezige woningen.

      2 Onder controle in de zin van het eerste lid wordt mede verstaan doorzoeking.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel11
