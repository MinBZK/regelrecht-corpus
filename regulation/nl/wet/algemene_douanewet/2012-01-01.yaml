  - number: 1:2
    text: |-
      Deze wet is van toepassing op het grondgebied van Nederland met inbegrip van zijn luchtruim, zijn maritieme
      binnenwateren en territoriale zee, en elk gebied buiten deze territoriale zee waarin Nederland, in overeenstemming
      met het internationale recht, jurisdictie of soevereine rechten uitoefent met betrekking tot de zeebodem, de
      ondergrond daarvan, het bovenliggende water en luchtruim.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel12
  - number: 1:3
    text: |-
      1 In aanvulling op de begripsbepalingen van het Communautair douanewetboek, de toepassingsverordening Communautair
      douanewetboek en andere communautaire bepalingen wordt verstaan onder:

      a. Communautair douanewetboek: [verordening (EEG) nr. 2913/92](31992R2913) van de Raad van de Europese
      Gemeenschappen van 12 oktober 1992 tot vaststelling van het communautair douanewetboek (PbEG L 302);

      b. toepassingsverordening Communautair douanewetboek: [verordening (EEG) nr. 2454/93](31993R2454) van de Commissie
      van de Europese Gemeenschappen van 2 juli 1993 houdende vaststelling van enkele bepalingen ter uitvoering van
      [verordening (EEG) nr. 2913/92](31992R2913) van de Raad van de Europese Gemeenschappen van 12 oktober 1992 tot
      vaststelling van het communautair douanewetboek (PbEG L 253);

      c. inspecteur of ontvanger: functionaris die met de toepassing van deze wet is belast en als zodanig bij regeling
      van Onze Minister van Financiën, in voorkomend geval, in overeenstemming met Onze Minister wie het mede aangaat,
      is aangewezen;

      d. douaneautoriteiten, bevoegde autoriteiten of douanediensten van de lidstaten: de inspecteur of ontvanger;

      e. goederen: alle zaken die kunnen worden ingedeeld in het douanetarief;

      f. rechten bij invoer: zowel rechten bij invoer als invoerrechten;

      g. verzoeker: aanvrager, bedoeld in de [Algemene wet bestuursrecht][ref1].

      2 Bij de regeling, bedoeld in het eerste lid, onder c, kan de aanwijzing tot inspecteur dan wel ontvanger worden
      beperkt tot een bepaalde locatie dan wel taak en kunnen bevoegdheden worden uitgezonderd.

      3 Wanneer de regeling, bedoeld in het eerste lid, onderdeel c, een aanwijzing betreft van een functionaris die niet
      ressorteert onder de rijksbelastingdienst, is in elk geval uitgezonderd:

      a. indien het een aanwijzing betreft ter zake van taken in het kader van de [Wet tot behoud van cultuurbezit][ref2]
      of de [Wet vervoer over zee][ref3], de bevoegdheden, bedoeld in de [artikelen 1:30][ref4], [1:36][ref5] en
      [1:37][ref6];

      b. indien het een aanwijzing betreft ter zake van andere taken dan bedoeld in onderdeel a, de bevoegdheden, bedoeld
      in de [artikelen 1:26][ref7], [1:28][ref8], [1:30][ref9], [1:36][ref10] en [1:37][ref11];

      c. de bevoegdheid, bedoeld in [artikel 1:23][ref12], indien de plaats een woning betreft.

      4 Het derde lid, onderdeel c, is niet van toepassing indien het betreft een controle ter zake van de
      [Kernenergiewet][ref13], de [Prijzennoodwet][ref14], de [Uitvoeringswet verdrag chemische wapens][ref15],
      de [Waarborgwet 1986][ref16], de [Destructiewet][ref17], de [Diergeneesmiddelenwet][ref18],
      de [Gezondheids- en welzijnswet voor dieren][ref19], de [Kaderwet diervoeders][ref20], de
      [Wet tot behoud van cultuurbezit][ref21], de [Waterwet][ref22], de [Wet vervoer over zee][ref23], de
      [Zeevaartbemanningswet][ref24], de [Wet voorkoming verontreiniging door schepen][ref25], de [Warenwet][ref26], de
      [Wet geluidhinder][ref27] en de [Wet milieubeheer][ref28].

      5 Onze Minister van Financiën sluit met Onze Ministers wie het mede aangaat convenanten aangaande de kwantitatieve
      en kwalitatieve inzet van de functionarissen die ressorteren onder de rijksbelastingdienst met betrekking tot de
      douanecontrole van het bepaalde bij of krachtens een communautair of ander wettelijk voorschrift dat is opgenomen
      in de bijlage bij deze wet.

      6 Hetgeen in deze wet en de daarop rustende bepalingen is bepaald ten aanzien van de rechten bij invoer, is van
      overeenkomstige toepassing op de rechten bij uitvoer, tenzij anders is bepaald.

      7 Indien in het Communautair douanewetboek dan wel de toepassingsverordening Communautair douanewetboek
      bevoegdheden zijn opgedragen aan de lidstaten worden die bevoegdheden uitgeoefend door de inspecteur
      onderscheidenlijk de ontvanger. Hiervan kan worden afgeweken bij of krachtens deze wet.


