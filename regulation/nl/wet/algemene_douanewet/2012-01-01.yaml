        bwb_id: BWBR0011353
        artikel: '10.2'
  - number: 9:8
    text: |-
      Indien de grondslag voor een bestuurlijke boete wordt gevormd door het bedrag aan rechten bij invoer, wordt
      de opgelegde bestuurlijke boete naar evenredigheid verlaagd bij vermindering, teruggaaf, terugbetaling of
      kwijtschelding van de rechten bij invoer, voorzover deze vermindering, teruggaaf, terugbetaling of kwijtschelding,
      het bedrag aan rechten bij invoer betreft waarover de bestuurlijke boete is berekend.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel98
  - number: 9:16
    text: |-
      Van de opgelegde bestuurlijke boete kan door of vanwege Onze Minister van Financiën gehele of gedeeltelijke
      kwijtschelding worden verleend.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel916
  - number: 10:1
    text: |-
      1 Degene die goederen het douanegebied van de Gemeenschap binnenbrengt in strijd met de artikelen 38 en 39 van
      het Communautair douanewetboek of goederen in andere delen van het douanegebied van de Gemeenschap binnenbrengt
      in strijd met artikel 177 van het Communautair douanewetboek, dan wel binnengebrachte goederen in strijd met de
      artikelen 40 en 41 van het Communautair douanewetboek niet bij de inspecteur aanbrengt of van de overeenkomstig
      artikel 40 van het Communautair douanewetboek aangebrachte goederen in strijd met de artikelen 36bis en 36ter
      van het Communautair douanewetboek of artikel 186 van de toepassingsverordening Communautair douanewetboek geen
      summiere aangifte doet, of zonder toestemming van de inspecteur goederen wegvoert in strijd met het bepaalde in
      artikel 47 van het Communautair douanewetboek, wordt gestraft met geldboete van de derde categorie, of, indien
      dit bedrag hoger is, ten hoogste eenmaal het bedrag van de rechten bij invoer die ter zake van de goederen zijn
      verschuldigd.

      2 Degene die een der in het eerste lid omschreven feiten begaat met het oogmerk de rechten bij invoer die ter
      zake van de goederen zijn verschuldigd, te ontduiken of de ontduiking daarvan te bevorderen, wordt gestraft met
      gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie of, indien dit bedrag hoger is, ten
      hoogste eenmaal het bedrag van die rechten.

      3 Degene die uit zee of door de lucht goederen aanvoert ten aanzien waarvan het in [artikel 2:2][ref1] genoemde
      tegenbewijs niet wordt geleverd, wordt geacht die goederen uit zee, onderscheidenlijk door de lucht, binnen het
      douanegebied van de Gemeenschap te hebben gebracht.

      4 Degene die uit hoofde van artikel 3 van verordening (EG) nr. 1889/2005 van het Europees Parlement en de Raad van
      de Europese Unie van 26 oktober 2005 betreffende de controle van liquide middelen die de Gemeenschap binnenkomen
      of verlaten (verordening) verplicht is tot het doen van aangifte en deze aangifte niet, onvolledig of onjuist doet,
      wordt gestraft met geldboete van de derde categorie.

      5 Degene die een der in het vierde lid omschreven feiten opzettelijk begaat, wordt gestraft met gevangenisstraf van
      ten hoogste vier jaren of geldboete van de vierde categorie.

      6 Met betrekking tot de in het vierde en vijfde lid strafbaar gestelde feiten is
      [artikel 10:15, derde lid, onder e][ref2], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0023746#Artikel1015
