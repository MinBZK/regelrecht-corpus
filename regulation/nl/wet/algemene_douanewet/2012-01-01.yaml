  - number: 8:4
    text: |-
      1 Tegen een beschikking die is genomen op grond van een regeling genoemd in de bijlage bij de [artikelen 1:1][ref1]
      en [1:3, onder B][ref2], staat in afwijking van hetgeen omtrent bezwaar en beroep in deze wet is bepaald, beroep
      open op de rechterlijke instantie, genoemd in die regeling. Indien geen rechterlijke instantie is genoemd, is
      [artikel 8:1 van de Algemene wet bestuursrecht][ref3] van toepassing.

      2 Bij het beroep, bedoeld in het eerste lid, is [artikel 8:13 van de Algemene wet bestuursrecht][ref4] van
      toepassing.


