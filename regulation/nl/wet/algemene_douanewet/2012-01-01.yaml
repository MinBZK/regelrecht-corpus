  - number: 8:2
    text: |-
      1 [Hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref1], met uitzondering van de
      [artikelen 25, derde lid][ref2], [26a][ref3], [27][ref4], [27a][ref5], [27b][ref6] en [27e][ref7], is van
      overeenkomstige toepassing op beschikkingen als bedoeld in het tweede lid.

      2 Voor de overeenkomstige toepassing van [hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref8] is een
      beschikking voor bezwaar vatbaar indien het een beschikking betreft:

      a. als bedoeld in artikel 4, aanhef en onder 5, van het Communautair douanewetboek of;

      b. die is genomen op grond van deze wet.

      3 Voor de overeenkomstige toepassing van [hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref9] wordt een
      uitnodiging tot betaling aangemerkt als een belastingaanslag of een aanslag.

      4 In afwijking van [artikel 8:7, tweede lid, van de Algemene wet bestuursrecht][ref10] is slechts de rechtbank te
      Haarlem bevoegd.

      5 Indien het beroep is gericht tegen het niet tijdig doen van een uitspraak door de inspecteur, kan de rechtbank
      Haarlem bepalen dat de artikelen 13 en 14 van het Communautair douanewetboek en [paragraaf 1.2.4][ref11] gedurende
      een daarbij te bepalen termijn van toepassing blijven.

      6 Indien een uitspraak van de rechtbank of van de voorzieningenrechter van de rechtbank betrekking heeft op een
      beschikking die is gegeven door Onze minister wie het aangaat dan wel de ontvanger, treedt voor de toepassing van
      dit hoofdstuk Onze minister wie het aangaat dan wel de ontvanger in de plaats van de inspecteur.

      7 Indien het bezwaar is gericht tegen een uitnodiging tot betaling of een beschikking als bedoeld in het tweede
      lid, met betrekking tot welke:

      a. de vereiste aangifte niet is gedaan; of

      b. niet of niet volledig is voldaan aan een verzoek op de voet van artikel 14 van het Communautair douanewetboek om
      gegevensdragers, of de inhoud daarvan, voor raadpleging beschikbaar te stellen; of

      c. niet of niet volledig is voldaan aan de verplichtingen ingevolge [artikel 1:32][ref12], wordt bij de uitspraak
      op het bezwaarschrift de belastingaanslag of de beschikking gehandhaafd, tenzij aannemelijk is dat het niet of
      niet volledig voldoen aan genoemd verzoek of aan genoemde verplichtingen het gevolg is van overmacht en tenzij
      is gebleken dat en in hoeverre de belastingaanslag of de beschikking onjuist is. De eerste volzin vindt geen
      toepassing voor zover het bezwaar is gericht tegen een vergrijpboete.

      8 Indien het beroep is gericht tegen een uitnodiging tot betaling of een beschikking als bedoeld in het tweede lid,
      met betrekking tot welke:

      a. de vereiste aangifte niet is gedaan; of

      b. niet of niet volledig is voldaan aan een verzoek op de voet van artikel 14 van het Communautair douanewetboek om
      gegevensdragers, of de inhoud daarvan, voor raadpleging beschikbaar te stellen; of

      c. niet of niet volledig is voldaan aan de verplichtingen ingevolge [artikel 1:32][ref13], verklaart de rechtbank
      het beroep ongegrond, tenzij is gebleken dat en in hoeverre de uitspraak op het bezwaar onjuist is. De eerste
      volzin vindt geen toepassing voor zover het bezwaar is gericht tegen een vergrijpboete.

      9 Voor de overeenkomstige toepassing van de [artikelen 27l, tweede lid][ref14], en
      [29a, tweede lid, van de Algemene wet inzake rijksbelastingen][ref15] bedraagt het griffierecht hetgeen is vermeld
      in de onderdelen b en c van die leden.


