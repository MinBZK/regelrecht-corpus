  - number: 11:6
    text: |-
      Bij het opsporen van een bij deze wet of de daarop berustende bepalingen strafbaar gesteld feit hebben de in
      [artikel 11:3, eerste lid][ref1], bedoelde ambtenaren toegang tot elke plaats, voorzover dat redelijkerwijs voor
      de vervulling van hun taak nodig is. Zij zijn bevoegd zich door bepaalde door hen aangewezen personen te doen
      vergezellen.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel113
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: 11:3
        hoofdstuk: '11'
  - number: 11:7
    text: |-
      Ten dienste van de vervolging en berechting van bij deze wet of de daarop berustende bepalingen strafbaar gestelde
      feiten kan Onze Minister van Financiën, in overeenstemming met Onze Minister van Veiligheid en Justitie, ambtenaren
      van de rijksbelastingdienst, bevoegd inzake douane, aanwijzen, die het contact onderhouden met het openbaar
      ministerie.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel117
  - number: 11:8
    text: |-
      De griffiers verstrekken aan de inspecteur desgevraagd kosteloos afschrift of uittreksel van arresten of vonnissen,
      met toepassing van deze wet gewezen.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel118
  - number: 11:9
    text: |-
      Met betrekking tot gerechtelijke mededelingen inzake bij deze wet of de daarop berustende bepalingen strafbaar
      gestelde feiten hebben de ambtenaren van de rijksbelastingdienst, bevoegd inzake douane, de bevoegdheden bij het
      [Wetboek van Strafvordering][ref1] aan ambtenaren, aangesteld voor de uitvoering van de politietaak, toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: 11:10
    text: |-
      Ten aanzien van de tenuitvoerlegging van rechterlijke beslissingen inzake bij deze wet of de daarop berustende
      bepalingen strafbaar gestelde feiten hebben de ambtenaren van de rijksbelastingdienst, bevoegd inzake douane, de
      bevoegdheid van deurwaarders.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel1110
  - number: 11:11
    text: |-
      1 De ambtenaren van de rijksbelastingdienst, bevoegd inzake douane, zijn tevens belast met de opsporing van:

      a. de misdrijven omschreven in de [artikelen 179 tot en met 182 van het Wetboek van Strafrecht][ref1], welke jegens
      hen zijn begaan;

      b. het misdrijf omschreven in [artikel 184 van het Wetboek van Strafrecht][ref2], indien het bevel of de vordering
      is gedaan krachtens of de handeling is ondernomen ter uitvoering van de douanewetgeving.

      2 De [artikelen 152][ref3], [153][ref4], [157][ref5] en [159 van het Wetboek van Strafvordering][ref6] zijn te
      dezen op de ambtenaren van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel184
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel152
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel153
      [ref5]: https://wetten.overheid.nl/BWBR0001903#Artikel157
      [ref6]: https://wetten.overheid.nl/BWBR0001903#Artikel159
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel1111
