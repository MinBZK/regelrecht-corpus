  - number: 1:28
    text: |-
      1 De inspecteur is bevoegd personen die aanwezig zijn in of op de in [artikel 1:26][ref1] bedoelde locaties of
      vervoermiddelen of deze juist gaan betreden of hebben verlaten aan lijfsvisitatie te onderwerpen.

      2 De in het eerste lid bedoelde personen zijn op vordering van de inspecteur gehouden stil te staan en deze te
      volgen naar een door hem aangewezen plaats.

      3 Op vordering van de inspecteur zijn reizigers, die zich bevinden in een vervoermiddel dat juist het douanegebied
      van de Gemeenschap is binnengekomen of dat bestemd is om aanstonds te vertrekken om dat douanegebied te verlaten,
      gehouden hun plaats- of vervoerbewijs te vertonen. Deze verplichting geldt eveneens voor reizigers die een
      dergelijk vervoermiddel juist hebben verlaten dan wel die op het punt staan daarin aan boord te gaan.

      4 Lijfsvisitatie geschiedt op een besloten plaats door personen die, indien zij geen arts of verpleegkundige zijn,
      van hetzelfde geslacht zijn als de persoon die aan lijfsvisitatie wordt onderworpen.

      5 Onder lijfsvisitatie wordt verstaan:

      a. het onderzoek aan de kleding; het onderzoek aan de kleding omvat het betasten van de kleding, het nauwkeurig
      onderzoek van de hoofdbedekking en het schoeisel;

      b. het verwijderen van de bovenkleding, teneinde deze aan een nauwkeurig onderzoek te onderwerpen;

      c. het uitwendig en inwendig schouwen van de holten van het bovenlichaam, zonodig met de daartoe benodigde
      ontkleding;

      d. het geheel ontkleden en het uitwendig schouwen van het lichaam;

      e. het onderzoek van het onderlichaam; onder onderzoek van het onderlichaam wordt verstaan het uitwendig schouwen
      van de openingen en holten van het onderlichaam; het uitwendig schouwen van de openingen en holten van het
      onderlichaam wordt verricht door een arts of, in diens opdracht, door een verpleegkundige.

      6 Tot gehele ontkleding dan wel het onderzoek van het onderlichaam van degene die aan lijfsvisitatie wordt
      onderworpen, wordt pas overgegaan na toestemming van een ambtenaar die daartoe bij regeling van Onze Minister van
      Financiën, in overeenstemming met Onze Minister wie het mede aangaat, is aangewezen.

      7 Onder lijfsvisitatie wordt mede verstaan het onderzoek met behulp van apparatuur waarmee door kleding van de
      betrokken persoon kan worden gekeken.

      8 Bij of krachtens algemene maatregel van bestuur kunnen regels worden vastgesteld met betrekking tot het onderzoek
      van het onderlichaam en met betrekking tot de apparatuur waarmee door kleding van personen kan worden gekeken en
      het gebruik daarvan. Hierbij kan worden bepaald dat het vierde lid niet van toepassing is bij het gebruik van deze
      apparatuur.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel126
