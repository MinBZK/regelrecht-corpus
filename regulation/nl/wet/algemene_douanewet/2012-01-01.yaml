  - number: 1:9
    text: |-
      1 De inspecteur kan een persoon als douane-expediteur toelaten.

      2 De inspecteur kan een toelating als douane-expediteur weigeren aan een persoon die in de laatstverlopen vijf
      jaren wegens een strafbaar feit onherroepelijk is veroordeeld, wanneer dat strafbaar feit naar Nederlands recht
      wordt aangemerkt als een misdrijf.

      3 Douane-expediteurs die niet in Nederland wonen of zijn gevestigd, zijn gehouden in Nederland woonplaats te kiezen
      of een vaste inrichting op te richten alvorens zij werkzaamheden als toegelaten douane-expediteur gaan verrichten.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel19
  - number: 1:10
    text: |-
      Van de mogelijkheid om bij het doen van een douaneaangifte als indirecte vertegenwoordiger op te treden als bedoeld
      in artikel 5, tweede lid, van het Communautair douanewetboek kan slechts gebruik worden gemaakt door een douane-
      expediteur als bedoeld in [artikel 1:9][ref1]. Hij dient daartoe schriftelijk door zijn opdrachtgever te zijn
      gemachtigd.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel19
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: 1:9
        hoofdstuk: '1'
        paragraaf: 1.2.1
        afdeling: '1.2'
  - number: 1:11
    text: |-
      De douane-expediteur is gehouden aan zijn opdrachtgever een factuur te verstrekken waarin ten behoeve van deze
      laatste aan het Rijk betaalde rechten bij invoer, andere belastingen, heffingen, retributies, dan wel rente,
      interest, kosten en bestuurlijke boeten voorzover aan zijn opdrachtgever te wijten, afzonderlijk zijn omschreven.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel111
  - number: 1:12
    text: |-
      1 Douane-expediteurs hebben een voorrecht op alle vermogensbestanddelen van de opdrachtgever voor de door hen
      ten behoeve van hun opdrachtgever betaalde rechten bij invoer, andere belastingen, heffingen, retributies dan wel
      rente, interest, kosten en bestuurlijke boeten voor zover aan zijn opdrachtgever te wijten gedurende een jaar na de
      aan het Rijk gedane betaling.

      2 Het in het eerste lid toegekende voorrecht heeft gelijke rangorde als het in
      [artikel 21 van de Invorderingswet 1990][ref1] toegekende voorrecht van ’s Rijks schatkist, met dien verstande dat
      dit laatste voorrecht voorgaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel21
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '21'
  - number: 1:13
    text: |-
      1 De inspecteur kan op grond van laakbare handelingen van de douane-expediteur, gepleegd in de uitoefening van
      zijn bedrijf als douane-expediteur, diens toelating als douane-expediteur intrekken, indien tevoren aan de douane-
      expediteur wegens vroeger gepleegde laakbare handelingen in de laatstverlopen drie jaren een waarschuwing, houdende
      de feiten waarop zij is gegrond, is uitgereikt.

      2 In afwijking van het eerste lid kan de inspecteur de toelating als douane-expediteur onmiddellijk intrekken
      indien de douane-expediteur onherroepelijk is veroordeeld wegens een strafbaar feit, wanneer dat strafbaar feit
      naar Nederlands recht wordt aangemerkt als een misdrijf.

      3 Aan de douane-expediteur wiens toelating is ingetrokken, wordt, behoudens in bijzondere gevallen, een nieuwe
      toelating niet verleend voordat vijf jaren sedert de intrekking zijn verlopen.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel113
  - number: 1:14
    text: |-
      De bevoegdheden van een persoon, anders dan een natuurlijk persoon, kunnen worden uitgeoefend en zijn
      verplichtingen kunnen worden nagekomen door iedere bestuurder.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel114
  - number: 1:15
    text: |-
      1 De bevoegdheden en de verplichtingen van een minderjarige, een onder curatele gestelde, iemand die in staat van
      faillissement is verklaard of ten aanzien van wie de schuldsaneringsregeling natuurlijke personen van toepassing
      is, of iemand wiens vermogen onder bewind is gesteld, kunnen worden uitgeoefend en nagekomen door een wettelijke
      vertegenwoordiger, curator of bewindvoerder. Op vordering van de inspecteur zijn laatstgenoemden tot nakoming van
      de verplichtingen gehouden.

      2 Om geldige redenen kan de inspecteur de vertegenwoordiging, bedoeld in het eerste lid, uitsluiten in de nakoming
      van een verplichting van hem die zelf tot die nakoming in staat is.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel115
  - number: 1:16
    text: |-
      1 Na iemands overlijden kunnen zijn rechtverkrijgenden onder algemene titel in het uitoefenen van de bevoegdheden
      en in het nakomen van de verplichtingen, welke de overledene zou hebben gehad, ware hij in leven gebleven, worden
      vertegenwoordigd door een hunner, de executeur, de door de rechter benoemde vereffenaar van de nalatenschap of de
      bewindvoerder over de nalatenschap. Op vordering van de inspecteur is ieder der in dit lid genoemde personen tot
      nakoming van die verplichtingen gehouden.

      2 Stukken betreffende de aangelegenheden van de overledene kunnen worden gericht aan een van de in het eerste lid
      genoemde personen.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel116
