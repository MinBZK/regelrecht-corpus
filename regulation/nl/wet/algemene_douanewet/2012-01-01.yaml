    text: |-
      Degene die goederen in strijd met de douanewetgeving niet aanbrengt bij een douanekantoor van uitgang, of goederen
      buiten het douanegebied van de Gemeenschap voert in strijd met artikel 183 van het Communautair douanewetboek, of
      van de buiten het douanegebied te brengen goederen in strijd met de artikelen 182bis, 182quater en 182quinquies
      van het Communautair douanewetboek geen summiere aangifte doet, wordt gestraft met een geldboete van de derde
      categorie.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel102
  - number: 10:3
    text: |-
      1 Degene die goederen waarvoor een in de douanewetgeving voorziene aangifte niet is gedaan, lost, laadt, vervoert,
      in enig gebouw, erf of besloten terrein inslaat, voorhanden heeft of daaruit uitslaat, koopt, verkoopt, te koop
      aanbiedt of aflevert, wordt gestraft met geldboete van de derde categorie of, indien dit bedrag hoger is, ten
      hoogste eenmaal het bedrag van de rechten bij invoer die ter zake van de goederen zijn verschuldigd.

      2 Degene die een der in het eerste lid omschreven feiten begaat terwijl hij weet of vermoedt dat de rechten
      bij invoer ter zake van de in dat lid bedoelde goederen niet zijn voldaan, noch de heffing van die rechten
      overeenkomstig de douanewetgeving is verzekerd, wordt gestraft met gevangenisstraf van ten hoogste een jaar of
      geldboete van de vierde categorie of, indien dit bedrag hoger is, ten hoogste eenmaal het bedrag van die rechten.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel103
  - number: 10:4
    text: |-
      1 Degene die in strijd met de douanewetgeving goederen waarvoor vrijstelling van rechten bij invoer wordt genoten,
      gebruikt of doet gebruiken op een wijze of voor doeleinden waarvoor de vrijstelling niet geldt, of aan goederen die
      in het vrije verkeer zijn gebracht met toepassing van een verlaagd recht bij invoer of van een nulrecht uit hoofde
      van hun bijzondere bestemming, een bestemming heeft gegeven die afwijkt van die met het oog waarop het verlaagde
      recht bij invoer of het nulrecht is toegepast, wordt gestraft met geldboete van de derde categorie of, indien dit
      bedrag hoger is, ten hoogste eenmaal het bedrag van de ter zake van die goederen te weinig geheven rechten bij
      invoer.

      2 Degene die een der in het eerste lid omschreven feiten opzettelijk begaat, wordt gestraft met gevangenisstraf van
      ten hoogste een jaar of geldboete van de vierde categorie of, indien dit bedrag hoger is, ten hoogste eenmaal het
      bedrag van de te weinig geheven rechten bij invoer.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel104
  - number: 10:5
    text: |-
      1 Degene die:

      a. een ingevolge de douanewetgeving vereiste aangifte onjuist of onvolledig doet;

      b. ingevolge de douanewetgeving verplicht is tot:

      1°. het verstrekken van inlichtingen, gegevens of aanwijzingen, en deze niet, onjuist of onvolledig verstrekt;

      2°. het vertonen, overgeven of voor raadpleging beschikbaar stellen van bepaalde gegevensdragers, of de inhoud
      daarvan, en een zodanige verplichting niet nakomt;

      3°. het vertonen, overgeven of voor raadpleging beschikbaar stellen van bepaalde gegevensdragers, of de inhoud
      daarvan, en valse of vervalste gegevensdragers vertoont, overgeeft of voor raadpleging beschikbaar stelt, dan wel
      de inhoud daarvan in valse of vervalste vorm voor dit doel beschikbaar stelt;

      4°. het voeren van een administratie overeenkomstig de daaraan bij of krachtens de douanewetgeving gestelde eisen,
      en een zodanige administratie niet voert;

      5°. het bewaren van boeken, bescheiden of andere gegevensdragers, en deze niet bewaart; wordt gestraft met
      hechtenis van ten hoogste zes maanden of geldboete van de derde categorie.

      2 Degene die opzettelijk een der feiten begaat, omschreven in het eerste lid, onderdeel b, onder 1°, 2°, 4° of 5°,
      wordt, indien het feit ertoe strekt dat te weinig rechten bij invoer worden geheven, gestraft met gevangenisstraf
      van ten hoogste vier jaren of geldboete van de vierde categorie of, indien dit bedrag hoger is, ten hoogste eenmaal
      het bedrag van de te weinig geheven rechten.

      3 Degene die opzettelijk een der feiten begaat, omschreven in het eerste lid, onderdeel a of b, onder 3°, wordt,
      indien het feit ertoe strekt dat te weinig rechten bij invoer worden geheven, gestraft met gevangenisstraf van
      ten hoogste zes jaren of geldboete van de vijfde categorie of, indien dit bedrag hoger is, ten hoogste eenmaal het
      bedrag van de te weinig geheven rechten.

      4 Indien het feit, ter zake waarvan de verdachte kan worden vervolgd, zowel valt onder een van de bepalingen van
      het tweede of het derde lid, als onder die van [artikel 225, tweede lid, van het Wetboek van Strafrecht][ref1], is
      strafvervolging op grond van genoemd [artikel 225, tweede lid][ref2], uitgesloten.

      5 Dit artikel is niet van toepassing ten aanzien van de invordering van de rechten bij invoer.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel225
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel225
