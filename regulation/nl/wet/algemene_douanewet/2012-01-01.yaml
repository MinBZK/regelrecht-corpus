  - number: 11:1
    text: |-
      1 De rechtbanken vonnissen in eerste aanleg over bij deze wet of de daarop berustende bepalingen strafbaar gestelde
      feiten.

      2 De vonnissen zijn aan hoger beroep onderworpen, voorzover zij zijn gewezen:

      a. ter zake van misdrijven;

      b. ter zake van overtredingen ten aanzien van degene die op het tijdstip waarop de vervolging tegen hem is
      aangevangen, de leeftijd van achttien jaar nog niet had bereikt.

      3 Tegen andere vonnissen kan de verdachte hoger beroep instellen, indien hechtenis als hoofdstraf is opgelegd, een
      geldboete van € 113 of meer is opgelegd dan wel een verbeurdverklaring is uitgesproken; het openbaar ministerie kan
      hoger beroep instellen, indien het gelijke straffen heeft gevorderd.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel111
  - number: 11:2
    text: |-
      Ten aanzien van bij deze wet of de daarop berustende bepalingen strafbaar gestelde feiten worden personen, niet
      zijnde natuurlijke personen, voor de toepassing van [artikel 2 van het Wetboek van Strafvordering][ref1] geacht te
      wonen, waar zij gevestigd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel2
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '2'
  - number: 11:3
    text: |-
      1 Met het opsporen van bij deze wet of de daarop berustende bepalingen strafbaar gestelde feiten zijn, behalve
      de in [artikel 141 van het Wetboek van Strafvordering][ref1] bedoelde personen, belast de ambtenaren van de
      rijksbelastingdienst, bevoegd inzake douane, dan wel de ambtenaren die bij regeling van Onze Minister van Financiën
      in overeenstemming met Onze Minister wie het mede aangaat zijn aangewezen.

      2 In afwijking van de [artikelen 155][ref2], [156][ref3] en [157 van het Wetboek van Strafvordering][ref4] worden
      alle processen-verbaal betreffende bij deze wet of de daarop berustende bepalingen strafbaar gestelde feiten
      ingezonden bij de inspecteur. De inspecteur doet de processen-verbaal betreffende strafbare feiten, ter zake
      waarvan inverzekeringstelling of voorlopige hechtenis is toegepast dan wel een woning tegen de wil van de bewoner
      is binnengetreden, met de in beslag genomen voorwerpen onverwijld toekomen aan de bevoegde officier van justitie.
      De overige processen-verbaal doet de inspecteur, met de in beslag genomen voorwerpen, toekomen aan de officier van
      justitie, indien hij een vervolging of verdere vervolging door deze wenselijk acht.

      3 De officier van justitie is bevoegd, de zaak ter afdoening weer in handen van de inspecteur te stellen, welke
      daarmede alsdan kan handelen overeenkomstig [artikel 10:15][ref5].

      4 Het bepaalde in [artikel 148, tweede lid, van het Wetboek van Strafvordering][ref6] vindt geen toepassing in
      zaken, waarin de inspecteur het proces-verbaal niet aan de officier van justitie heeft doen toekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel155
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel156
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel157
      [ref5]: https://wetten.overheid.nl/BWBR0023746#Artikel1015
      [ref6]: https://wetten.overheid.nl/BWBR0001903#Artikel148
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel113
