  - number: 1:34
    text: |-
      Een ieder die de leeftijd van veertien jaar heeft bereikt, is, indien dit voor de toepassing van de bij of
      krachtens de in [artikel 1:1][ref1] bedoelde regelingen of de bij of krachtens deze wet vastgestelde bepalingen te
      zijnen aanzien van belang kan zijn, verplicht op vordering van de inspecteur terstond een identificatiebewijs als
      bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref2] ter inzage aan te bieden.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0006297#Artikel1
