  - number: 2:1
    text: |-
      Ten einde de goede werking van de douanewetgeving te waarborgen, kunnen bij regeling van Onze Minister van
      Financiën bepalingen worden vastgesteld met betrekking tot:

      a. de formaliteiten voorafgaand aan en aangaande het binnenbrengen in en het verlaten van het douanegebied van
      schepen en luchtvaartuigen en de aan boord van deze schepen en luchtvaartuigen aanwezige goederen;

      b. douanekantoren;

      c. toeristisch en reizigersverkeer, postverkeer en verkeer van te verwaarlozen economisch belang;

      d. goederen en vervoermiddelen als bedoeld in artikel 39 van het Communautair douanewetboek;

      e. de summiere aangifte, dan wel vervangende kennisgeving;

      f. tijdelijke opslag;

      g. de douaneaangifte, mede ten dienste van de statistiek van de in-, uit- en wederuitvoer;

      h. onderzoek van goederen en monsterneming;

      i. identificatiemaatregelen, middelen daaronder begrepen;

      j. zekerheid;

      k. de voorwaarden die gelden bij de overdracht van rechten en verplichtingen van het subject van een economische
      douaneregeling dan wel de entreposeur;

      l. vereenvoudigde procedures inzake communautair douanevervoer;

      m. het in kennis stellen van de inspecteur voorafgaand aan de wederuitvoer dan wel de vernietiging van goederen.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel21
  - number: 2:2
    text: |-
      Goederen aangevoerd uit zee of door de lucht worden, behoudens tegenbewijs, geacht uit zee onderscheidenlijk door
      de lucht het douanegebied van de Gemeenschap te zijn binnengekomen.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel22
  - number: 2:3
    text: |-
      1 De inspecteur kan een beschikking tot het doen vernietigen van de goederen ingevolge artikel 56 van het
      Communautair douanewetboek alleen geven wanneer:

      a. artikel 53, eerste lid, of artikel 57 van het Communautair douanewetboek niet van toepassing is, en

      b. de goederen geen toegelaten douanebestemming kunnen krijgen in verband met de toepassing van verboden of
      beperkingen als bedoeld in artikel 58, tweede lid, van het Communautair douanewetboek.

      2 Voordat de inspecteur de beschikking, bedoeld in het eerste lid, geeft stelt hij de houder van de goederen in de
      gelegenheid zijn zienswijze naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel23
  - number: 3:1
    text: |-
      Onverminderd de communautaire bepalingen ter zake kunnen bij of krachtens algemene maatregel van bestuur verboden
      of beperkingen ten aanzien van goederen worden vastgesteld, die bij het binnenbrengen in, onderscheidenlijk
      verlaten van de gebieden, bedoeld in [artikel 1:2][ref1], van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel12
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: 1:2
        hoofdstuk: '1'
        afdeling: '1.1'
  - number: 3:2
    text: |-
      1 De aangifte, bedoeld in artikel 3, eerste lid, van verordening (EG) nr. 1889/2005 van het Europees Parlement en
      de Raad van de Europese Unie van 26 oktober 2005 betreffende de controle van liquide middelen die de Gemeenschap
      binnenkomen of verlaten (PbEU L 309) (verordening), wordt schriftelijk gedaan.

      2 De identiteit van de aangever wordt vastgesteld met behulp van een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1].

      3 Bij regeling van Onze Minister van Financiën:

      a. wordt een aangifteformulier vastgesteld;

      b. worden regels gesteld omtrent de bij de uitvoering van de verordening:

      1°. in aanmerking te nemen wisselkoers ter bepaling van de tegenwaarde in euro’s van liquide middelen als bedoeld
      in artikel 2, onderdeel 2, van de verordening, waarvan het bedrag is uitgedrukt in een andere valuta;

      2°. in aanmerking te nemen waarde van verhandelbare instrumenten aan toonder als bedoeld in artikel 2, onderdeel 2,
      onder a, van de verordening.

      4 Bij regeling van Onze Minister van Financiën kunnen, in afwijking van het eerste lid, regels worden gesteld op
      grond waarvan de in artikel 3, eerste lid, van de verordening bedoelde aangifte langs elektronische weg kan worden
      gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 3:3
    text: |-
      1 Een beslissing tot inbewaringneming van liquide middelen op de voet van artikel 4, tweede lid, van verordening
      (EG) nr. 1889/2005 van het Europees Parlement en de Raad van de Europese Unie van 26 oktober 2005 betreffende de
      controle van liquide middelen die de Gemeenschap binnenkomen of verlaten (verordening) wordt door de inspecteur
      schriftelijk genomen. De schriftelijke beslissing wordt aangemerkt als een beschikking. De bekendmaking daarvan
      geschiedt hetzij aan de natuurlijke persoon die niet aan de aangifteplicht uit hoofde van artikel 3 van de
      verordening heeft voldaan, hetzij, indien deze persoon onbekend is, in het openbaar volgens bij regeling van Onze
      Minister van Financiën te stellen regels.

      2 De beschikking vermeldt welke gegevens in strijd met de aangifteplicht niet, onvolledig of onjuist zijn verstrekt
      en verwijst naar de algemene maatregel van bestuur, bedoeld in het zevende lid.

      3 De inspecteur is bevoegd de inbewaringneming van de liquide middelen te doen voortduren zolang de nodige
      gegevens, bedoeld in artikel 3, tweede lid, van de verordening, ontbreken.

      4 De inbewaringneming van de liquide middelen wordt beëindigd door strafrechtelijke inbeslagneming of door een
      schriftelijke beslissing van de inspecteur. Een schriftelijke beslissing van de inspecteur als bedoeld in de eerste
      volzin wordt aangemerkt als een beschikking. Het eerste lid, derde volzin, is met betrekking tot deze beschikking
      van overeenkomstige toepassing.

      5 De beschikking, bedoeld in het vierde lid, vermeldt het tijdstip van beëindiging van de inbewaringneming van
      de liquide middelen en vermeldt voorts dat deze nog tot en met het kalenderjaar dat volgt op het jaar waarin de
      in het vierde lid bedoelde beschikking is bekendgemaakt, ter uitkering door de inspecteur aan een rechthebbende
      beschikbaar blijven voorzover de liquide middelen niet strekken tot voldoening van kosten als bedoeld in het
      zevende lid.

      6 Indien liquide middelen die beschikbaar blijven in de zin van het vijfde lid niet voor afloop van het
      kalenderjaar dat volgt op het jaar waarin de in het vierde lid bedoelde beschikking is bekendgemaakt, aan
      een rechthebbende zijn uitgekeerd, wordt hetzij het bedrag daarvan, hetzij – voorzover de liquide middelen
      geen Nederlandse wettige betaalmiddelen zijn – de verkoopopbrengst daarvan opgenomen in de consignatiekas.
      [Artikel 9, tweede tot en met zesde lid, van de Wet op de consignatie van gelden][ref1] blijft buiten toepassing.

      7 Bij algemene maatregel van bestuur kunnen gevallen worden vastgesteld waarin de kosten verbonden aan een
      inbewaringneming van liquide middelen op de voet van artikel 4, tweede lid, van de verordening, geheel of
      gedeeltelijk dienen te worden vergoed door de natuurlijke persoon die niet aan de aangifteplicht uit hoofde
      van artikel 3 van de verordening heeft voldaan. Heffing en invordering van te vergoeden kosten geschieden
      overeenkomstig de wettelijke regels voor de heffing, onderscheidenlijk invordering, van kosten van ambtelijke
      werkzaamheden als bedoeld in [artikel 1:19][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003338#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0023746#Artikel119
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel33
