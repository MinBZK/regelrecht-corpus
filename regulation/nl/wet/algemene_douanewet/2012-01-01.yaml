  - number: 11:13
    text: |-
      1 Goederen die in beslag zijn genomen ter zake van het begaan van strafbare feiten als bedoeld in deze wet of
      de daarop berustende bepalingen kunnen, voorzover de eisen van het onderzoek of het algemeen belang bij hun
      vernietiging of onbruikbaarmaking zich niet daartegen verzetten, zo nodig na monsterneming, overeenkomstig bij
      regeling van Onze Minister van Financiën te stellen regels, tegen zekerheidstelling worden vrijgegeven.

      2 Het bepaalde in het eerste lid vindt geen toepassing ten aanzien van goederen, in beslag genomen in zaken waarin
      de inspecteur het proces-verbaal ingevolge het bepaalde in [artikel 10:3, tweede lid][ref1], aan de officier van
      justitie heeft doen toekomen.

      3 De overeenkomstig het eerste lid gestelde zekerheid treedt voor de toepassing van bepalingen betreffende
      verbeurdverklaring en inbeslagneming, alsmede voor de uitoefening van het recht van verhaal, in de plaats van de in
      beslag genomen goederen.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel103
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel1113
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: 10:3
        hoofdstuk: '10'
        afdeling: '10.1'
  - number: 11:14
    text: |-
      1 Van goederen die ter zake van het begaan van strafbare feiten als bedoeld in deze wet of de daarop berustende
      bepalingen, in beslag zijn genomen van onbekende personen, wordt volgens bij regeling van Onze Minister van
      Financiën te stellen regels in het openbaar mededeling gedaan.

      2 Indien niet binnen een jaar na dagtekening van de in het eerste lid bedoelde mededeling op voldoende wijze blijkt
      wie de ten aanzien van de in beslag genomen goederen bevonden overtreding van de douanewetgeving heeft begaan en
      evenmin de belanghebbende bij de goederen aannemelijk maakt dat zij ten onrechte in beslag zijn genomen, vervallen
      de goederen aan de Staat.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel1114
  - number: 12:1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter verzekering van een juiste toepassing van de
      toepassingsverordening Communautair douanewetboek nadere regels worden gesteld ter aanvulling van de in deze wet
      geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel121
  - number: 12:2
    text: |-
      Bij het uitoefenen van het recht op beroep moet in bezwaar-, verzoek-, beroep-, verweer- en verzetschriften hij die
      niet in Nederland een vaste woonplaats of plaats van vestiging heeft, domicilie kiezen in Nederland.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel122
  - number: 12:3
    text: |-
      Het ingevolge het Communautair douanewetboek, de toepassingsverordening Communautair douanewetboek of de wet
      bekendmaken, toezenden daaronder begrepen, van een stuk aan een persoon, die niet binnen Nederland een vaste
      woonplaats of plaats van vestiging heeft, kan ook geschieden aan de binnen Nederland gelegen vaste inrichting voor
      de uitoefening van zijn bedrijf of beroep, dan wel aan de woning of het kantoor van de binnen Nederland wonende of
      gevestigde vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel123
  - number: 12:4
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel124
  - number: 12:5
    text: |-
      Voor de bekendmaking van deze wet stelt Onze Minister van Financiën de nummering van de artikelen, paragrafen,
      hoofdstukken en afdelingen van deze wet opnieuw vast en brengt hij de in deze wet voorkomende aanhalingen van
      artikelen, paragrafen, hoofdstukken en afdelingen daarmee in overeenstemming.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel125
  - number: 12:6
    text: 'Deze wet wordt aangehaald als: Algemene douanewet.'
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel126
