preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het ter verbetering van de doelmatigheid, ter verhoging van de
    inzichtelijkheid en ter vereenvoudiging van de wetgeving inzake het douanetoezicht op dan wel de douanecontrole
    van goederen en goederenverkeer in ruime zin, wenselijk is, regels, welke ten aanzien van douanetoezicht en
    douanecontrole gemeen zijn, in een algemene wet samen te vatten, mede in verband met de op douanetoezicht en
    douanecontrole betrekking hebbende internationale afspraken of besluiten van volkenrechtelijke organisaties;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#ArtikelAanhef
articles:
  - number: 1:1
    text: |-
      1 De bepalingen bij of krachtens deze wet vormen de nationale bepalingen ter uitvoering van:

      a. het Communautair douanewetboek, de ter uitvoering daarvan vastgestelde communautaire bepalingen, en

      b. andersluidende bepalingen, die uit autonome communautaire maatregelen als bedoeld in het Communautair
      douanewetboek, voortvloeien.

      2 De bepalingen bij of krachtens deze wet strekken mede ten behoeve van de nakoming van verplichtingen die
      voortvloeien uit:

      a. interregionaal recht,

      b. het Koninkrijk verbindende verdragen en

      c. in al hun onderdelen verbindende besluiten van bij zodanige verdragen opgerichte volkenrechtelijke organisaties,
      voorzover deze verplichtingen betrekking hebben op het douanetoezicht op, dan wel op de douanecontrole van,
      goederen en het goederenverkeer en voorts onderwerpen betreffen die vallen onder de reikwijdte van een of meer
      regelingen als bedoeld in de bijlage bij deze wet.

      3 De bepalingen bij of krachtens deze wet strekken mede ten behoeve van de nakoming van verplichtingen die
      voortvloeien uit regelingen van internationaal recht tot het verlenen van wederzijdse administratieve bijstand
      inzake goederen en goederenverkeer.

      4 De bepalingen bij of krachtens deze wet strekken mede tot uitvoering van gemeenschappelijke optredens,
      gemeenschappelijke standpunten, kaderbesluiten, besluiten en overeenkomsten die zijn aangenomen dan wel vastgesteld
      door de Raad van de Europese Unie, voorzover deze betrekking hebben op goederen en goederenverkeer en voorts
      onderwerpen betreffen die vallen onder de reikwijdte van een of meer regelingen als bedoeld in de bijlage bij deze
      wet.

      5 De bepalingen bij of krachtens deze wet strekken mede ter handhaving van verboden of beperkingen die op goederen
      bij het binnenbrengen in, onderscheidenlijk verlaten van, het douanegebied van de Gemeenschap dan wel de gebieden,
      bedoeld in [artikel 1:2][ref1], of bij het kiezen van een douanebestemming van toepassing zijn of zouden zijn bij
      of krachtens een communautair of ander wettelijk voorschrift dat is opgenomen in de bijlage bij deze wet.

      6 Bij algemene maatregel van bestuur kunnen wijzigingen worden aangebracht in de bijlage bij deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel12
