  - number: 1:32
    text: |-
      1 Onverminderd [artikel 1:5][ref1] van deze wet en de communautaire bepalingen ter zake,
      zijn [artikel 15i van Boek 3 van het Burgerlijk Wetboek][ref2] en de [artikelen 10][ref3] en
      [24 van Boek 2 van het Burgerlijk Wetboek][ref4] van overeenkomstige toepassing:

      a. op de rechten en verplichtingen voortvloeiend uit het bepaalde bij of krachtens:

      1°. de in [artikel 1:1][ref5] bedoelde regelingen;

      2°. deze wet;

      b. op overige van belang zijnde gegevens voor de toepassing van het bepaalde bij of krachtens:

      1°. de in [artikel 1:1][ref6] bedoelde regelingen;

      2°. deze wet.

      2 Toegelaten moet worden, dat kopieën, leesbare afdrukken of uittreksels worden gemaakt van de voor raadpleging
      beschikbaar gestelde gegevensdragers of de inhoud daarvan.

      3 De inspecteur stelt de belanghebbende, op wie de verplichting tot het voeren van een administratie als bedoeld
      in het eerste lid rust, wiens gegevensdragers hij bij een derde voor raadpleging vordert hiervan gelijktijdig in
      kennis.


