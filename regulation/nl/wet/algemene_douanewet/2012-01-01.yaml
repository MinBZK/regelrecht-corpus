  - number: 7:5
    text: |-
      1 Bij regeling van Onze Minister van Financiën kunnen bepalingen worden vastgesteld met betrekking tot de boeking
      van de bedragen aan rechten.

      2 De bepalingen, bedoeld in het eerste lid, kunnen betrekking hebben op:

      a. bedragen aan rechten waar beneden niet wordt geboekt;

      b. de boeking van bedragen met betrekking tot goederen die ten gunste van een zelfde persoon in een vast te stellen
      periode werden vrijgegeven waarbij deze boeking aan het einde van deze periode in één keer geschiedt;

      c. de verlenging van de termijn voor de boeking.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel75
  - number: 7:6
    text: |-
      1 De mededeling van het bedrag aan rechten aan de schuldenaar geschiedt door het toezenden van een op een
      aanslagbiljet vermelde uitnodiging tot betaling. Het aanslagbiljet wordt voorzien van een dagtekening die geldt
      als dagtekening van de vaststelling van de uitnodiging tot betaling. De inspecteur stelt het aanslagbiljet ter
      invordering van het daaruit blijkende bedrag aan rechten aan de ontvanger ter hand.

      2 Het eerste lid is van overeenkomstige toepassing met betrekking tot de door de inspecteur te nemen beschikking
      strekkende tot vaststelling van:

      a. het bedrag van de terugbetaling dan wel kwijtschelding;

      b. het bedrag van de verschuldigde compensatierente dan wel compenserende rente;

      c. het bedrag van de verschuldigde kosten;

      d. het bedrag van de verschuldigde bestuurlijke boete.

      3 Op een aanslagbiljet mogen verschillende mededelingen van bedragen aan rechten en bedragen als bedoeld in het
      tweede lid worden vermeld.

      4 Het model van het aanslagbiljet wordt bij regeling van Onze Minister van Financiën vastgesteld.

      5 Indien de inspecteur artikel 221, tweede lid, van het Communautair douanewetboek toepast, wordt de douaneaangifte
      aangemerkt als een op een aanslagbiljet vermelde uitnodiging tot betaling. De datum van vrijgave van de goederen
      geldt als dagtekening van het aanslagbiljet en van de vaststelling van de uitnodiging tot betaling.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel76
  - number: 7:7
    text: |-
      1 Wanneer de douaneschuld is ontstaan ingevolge een handeling die, indien deze in Nederland zou zijn verricht,
      strafrechtelijk vervolgbaar was, kan de toezending van het aanslagbiljet geschieden binnen vijf jaren nadat de
      douaneschuld is ontstaan.

      2 Het eerste lid is niet van toepassing ten aanzien van personen wier handelen of nalaten niet was gericht op
      ontduiking van de rechten bij invoer.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel77
  - number: 7:8
    text: |-
      Indien een douaneschuld ontstaat anders dan op grond van de artikelen 201 of 209 van het Communautair
      douanewetboek, en één of meer voor de berekening van het bedrag aan rechten noodzakelijke gegevens met betrekking
      tot de goederen niet zijn komen vast te staan, worden die goederen, met inachtneming van de gegevens die wel zijn
      komen vast te staan, geacht die hoedanigheid te bezitten, volgens welke:

        - het hoogste tarief van rechten bij invoer en
        - de meest bezwarende handelspolitieke maatregelen van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel78
  - number: 7:9
    text: |-
      Bij regeling van Onze Minister van Financiën worden regels gesteld met betrekking tot:

      a. de afronding van bedragen en hoeveelheden die dienen als grondslag voor de berekening van het bedrag aan
      rechten, andere belastingen, heffingen en retributies;

      b. de berekening van het bedrag aan rechten indien de hoeveelheid van de goederen kleiner is dan de hoeveelheid
      waarin het douanetarief is uitgedrukt;

      c. de afronding van het bedrag aan rechten, andere belastingen, heffingen, retributies, renten, interesten en
      kosten van ambtelijke werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel79
  - number: 8:1
    text: |-
      1 De [artikelen 6:2, aanhef en onder b][ref1], [8:1, eerste lid][ref2], en
      [8:13 van de Algemene wet bestuursrecht][ref3] zijn niet van toepassing.

      2 [Afdeling 8.2.4A van de Algemene wet bestuursrecht][ref4] is alleen van toepassing indien:

      a. artikel 243, eerste lid, tweede alinea, van het Communautair douanewetboek toepassing vindt;

      b. de inspecteur niet tijdig heeft beslist op bezwaar en hij de indiener van dat bezwaar geen inkennisstelling als
      bedoeld in artikel 6, tweede lid, van het Communautair douanewetboek heeft doen toekomen.


