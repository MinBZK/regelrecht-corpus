  - number: 11:4
    text: |-
      De ambtenaren belast met het opsporen van bij deze wet of de daarop berustende bepalingen strafbaar gestelde
      feiten, zijn te allen tijde bevoegd tot inbeslagneming van de ingevolge het [Wetboek van Strafvordering][ref1] voor
      inbeslagneming vatbare voorwerpen. Zij kunnen daartoe hun uitlevering vorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: 11:5
    text: |-
      1 In zaken waarin de inspecteur het proces-verbaal niet ingevolge het bepaalde in [artikel 11:3, tweede lid][ref1],
      aan de officier van justitie heeft doen toekomen, geldt ten aanzien van de inspecteur hetgeen in
      [artikel 116 van het Wetboek van Strafvordering][ref2] ten aanzien van het openbaar ministerie is bepaald.

      2 In de zaken, bedoeld in het eerste lid, wordt bij de toepassing van de [artikelen 552a][ref3] en
      [552ab van het Wetboek van Strafvordering][ref4], alvorens het gerecht ingevolge [artikel 552a, vijfde lid][ref5],
      onderscheidenlijk [artikel 552ab, vierde lid][ref6], van dat artikel een beschikking neemt, ook
      de inspecteur in de gelegenheid gesteld te worden gehoord en is, in afwijking van het bepaalde in
      [artikel 552d van dat wetboek][ref7], niet het openbaar ministerie doch de inspecteur bevoegd tot het instellen van
      beroep in cassatie. De griffier van het gerecht hetwelk in die zaken ingevolge [artikel 552a, vijfde lid][ref8],
      of [artikel 552ab, vierde lid, van dat wetboek][ref9] een beschikking neemt, deelt deze onverwijld mee aan de
      inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel113
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel116
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel552a
