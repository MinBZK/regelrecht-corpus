    text: |-
      1 Degene die een tot stand gebrachte identificatiemaatregel met betrekking tot een vervoermiddel, bergingsmiddel,
      verpakkingsmiddel, goederen, werktuig, leiding, gebouw of terrein, of deel daarvan, in strijd met de
      douanewetgeving schendt, wordt gestraft met geldboete van de derde categorie.

      2 Degene die een van de in het eerste lid omschreven feiten opzettelijk begaat, wordt gestraft met gevangenisstraf
      van ten hoogste twee jaren of geldboete van de vierde categorie.

      3 Degene die, nadat hij door de inspecteur in kennis is gesteld van diens voornemen om een identificatiemaatregel
      als bedoeld in het eerste lid tot stand te brengen, er geen zorg voor draagt dat de inspecteur deze maatregel op
      een deugdelijke wijze tot stand kan brengen, alsmede degene die, behoudens indien zich al dan niet in het kader van
      een douaneregeling gevallen voordoen als bedoeld in artikel 72, tweede lid, van het Communautair douanewetboek, er
      geen zorg voor draagt dat de door de inspecteur tot stand gebrachte identificatiemaatregel in stand blijft, wordt
      gestraft met geldboete van de derde categorie.

      4 Degene die anders dan als inspecteur bevoegd is om een identificatiemaatregel tot stand te brengen en er geen
      zorg voor draagt dat de maatregel op een deugdelijke wijze tot stand wordt gebracht, wordt gestraft met geldboete
      van de derde categorie.

      5 Ten aanzien van de in het derde en in het vierde lid omschreven feiten kan voor de betrokkene niet het
      bestaan van overmacht worden aangenomen, indien hij niet onverwijld nadat hem bekend is geworden dat een
      identificatiemaatregel niet op deugdelijke wijze is tot stand gebracht of een identificatiemaatregel niet in stand
      is gebleven, daarvan aan de inspecteur mededeling doet.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel108
  - number: 10:9
    text: |-
      1 Degene die van goederen waaraan herkenningsmiddelen of denatureringsmiddelen zijn toegevoegd, die
      herkenningsmiddelen of denatureringsmiddelen daarvan geheel of ten dele afscheidt, de werking ervan geheel of ten
      dele opheft of verandert, wordt gestraft met geldboete van de derde categorie.

      2 Degene die een der in het eerste lid omschreven feiten opzettelijk begaat, wordt gestraft met gevangenisstraf van
      ten hoogste twee jaren of geldboete van de vierde categorie of, indien dit bedrag hoger is, ten hoogste eenmaal het
      bedrag van de te weinig geheven rechten bij invoer.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel109
  - number: 10:10
    text: |-
      Overtreding van krachtens deze wet bij algemene maatregel van bestuur vastgestelde bepalingen wordt, voorzover die
      overtreding is aangemerkt als strafbaar feit, gestraft met geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel1010
  - number: 10:11
    text: |-
      Overtreding van krachtens deze wet bij regeling van Onze Minister wie het aangaat vastgestelde bepalingen,
      voorzover die overtreding is aangemerkt als strafbaar feit, gestraft met geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel1011
  - number: 10:13
    text: |-
      De bij deze wet strafbaar gestelde feiten waarop gevangenisstraf is gesteld, zijn misdrijven. De overige bij deze
      wet strafbaar gestelde feiten, alsmede de in de op deze wet berustende bepalingen strafbaar gestelde feiten, zijn
      overtredingen.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel1013
  - number: 10:14
    text: |-
      Ter zake van de bij deze wet of de daarop berustende bepalingen strafbaar gestelde feiten vindt
      [artikel 36e van het Wetboek van Strafrecht][ref1] geen toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel36e
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel1014
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 36e
  - number: 10:15
    text: |-
      1 Ten aanzien van bij deze wet of de daarop berustende bepalingen strafbaar gestelde feiten met betrekking
      tot welke het proces-verbaal niet overeenkomstig [artikel 11:3, tweede lid][ref1], in handen van de
      officier van justitie is gesteld, kan in afwijking van de [artikelen 257a][ref2], [257b][ref3] en
      [257ba van het Wetboek van Strafvordering][ref4], uitsluitend de inspecteur een strafbeschikking uitvaardigen. Bij
      regeling van Onze minister van Financiën kunnen functionarissen worden aangewezen die deze bevoegdheid namens de
      inspecteur kunnen uitoefenen.

      2 In deze strafbeschikking kan een geldboete worden opgelegd. Voorts kan deze strafbeschikking aanwijzingen
      bevatten waaraan de verdachte moet voldoen. De aanwijzingen kunnen inhouden:

      a. afstand van voorwerpen die in beslag zijn genomen en vatbaar zijn voor verbeurdverklaring of onttrekking aan
      het verkeer;

      b. uitlevering, of voldoening aan de staat van de geschatte waarde, van voorwerpen die vatbaar zijn voor
      verbeurdverklaring;

      c. voldoening aan de Staat van een geldbedrag gelijk aan of lager dan het geschatte voordeel – met inbegrip van
      besparing van kosten – door de verdachte verkregen door middel van of uit het strafbare feit;

      d. het alsnog voldoen aan een uit de douanewetgeving voortvloeiende verplichting.

      3 Een strafbeschikking waarin een geldboete wordt opgelegd van meer dan € 2000, wordt, in afwijking van
      [artikel 257c, tweede lid, van het Wetboek van Strafvordering][ref5], slechts uitgevaardigd indien de verdachte
      daaraan voorafgaand is gehoord.

      4 Een geldboete wordt, in zoverre in afwijking van [artikel 257g van het Wetboek van Strafvordering][ref6],
      ingevorderd op de wijze, voorzien in de [Invorderingswet 1990][ref7]. Daartoe wordt een afschrift van de
      strafbeschikking aan de ontvanger ter hand gesteld. De inspecteur of de aangewezen functionaris bepaalt voorts de
      termijn binnen welke aan de gegeven aanwijzingen moet zijn voldaan en zo nodig tevens de plaats waar zulks moet
      geschieden. De gestelde termijn kan voor de afloop daarvan eenmaal worden verlengd.

      5 In afwijking van [artikel 257h, tweede lid, van het Wetboek van Strafvordering][ref8] verstrekt de inspecteur
      desgevraagd een afschrift van een strafbeschikking aan ieder ander dan de verdachte of zijn raadsman, tenzij
      verstrekking naar het oordeel van het bestuur ter bescherming van de belangen van degene ten aanzien van wie
      de strafbeschikking is uitgevaardigd of van de derden die in de strafbeschikking worden genoemd, geheel of
      gedeeltelijk dient te worden geweigerd. In het laatste geval kan de inspecteur een geanonimiseerd afschrift van de
      strafbeschikking verstrekken.

      6 Indien binnen veertien dagen geen afschrift dan wel een geanonimiseerd afschrift wordt verstrekt, kan de
      verzoeker een klaagschrift indienen bij de inspecteur. Deze stelt het klaagschrift, de strafbeschikking en het
      proces-verbaal in handen van de officier van justitie, welke het klaagschrift en de processtukken onverwijld
      ter kennis brengt van de rechtbank, tenzij hij alsnog aan het verzoek tegemoetkomt. De procesdeelnemers zijn, in
      afwijking van [artikel 23, vierde lid, van het Wetboek van Strafvordering][ref9] niet bevoegd van de inhoud van de
      processtukken kennis te nemen dan voor zover de rechtbank zulks toestaat.

      7 [Artikel 552ab van het Wetboek van Strafvordering][ref10] is van overeenkomstige toepassing.


