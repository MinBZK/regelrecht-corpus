      taak nodig is.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel121
  - number: 1:22
    text: |-
      1 Bij de uitoefening van zijn taak namens de inspecteur draagt de ambtenaar een legitimatiebewijs bij zich,
      afgegeven door Onze Minister wie het aangaat of een door hem aangewezen ambtenaar.

      2 Onverminderd [artikel 1, eerste en tweede lid, van de Algemene wet op het binnentreden][ref1] toont hij zijn
      legitimatiebewijs desgevraagd onverwijld.

      3 Het model van het legitimatiebewijs is het krachtens
      [artikel 5:12, derde lid, van de Algemene wet bestuursrecht][ref2] vastgestelde model.


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel1
