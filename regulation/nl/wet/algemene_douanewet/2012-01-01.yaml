    text: Deze paragraaf is niet van toepassing op strafvordering.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel117
  - number: 1:18
    text: |-
      1 Een beschikking als bedoeld in artikel 4, aanhef en onder 5, van het Communautair douanewetboek wordt
      gelijkgesteld met een beschikking als bedoeld in [artikel 1:3, tweede lid, van de Algemene wet bestuursrecht][ref1].

      2 De toestemming gegeven door de ambtenaar, bedoeld in [artikel 1:28, zesde lid][ref2], wordt aangemerkt als een
      beschikking genomen door de inspecteur.

      3 Het doen van aangifte is geen aanvraag in de zin van
      [artikel 1:3, derde lid, van de Algemene wet bestuursrecht][ref3].

      4 [Artikel 3:40 van de Algemene wet bestuursrecht][ref4] is niet van toepassing.

      5 In afwijking van [artikel 3:41, eerste lid, van de Algemene wet bestuursrecht][ref5] kan de bekendmaking dan wel
      kennisgeving van beschikkingen op mondelinge verzoeken mondeling aan de verzoeker geschieden.

      6 [Artikel 3:45 van de Algemene wet bestuursrecht][ref6] is alleen van toepassing op schriftelijk genomen
      beschikkingen, niet zijnde een bindende inlichting.

      7 [Afdeling 3.7 van de Algemene wet bestuursrecht][ref7] is niet van toepassing op schriftelijk genomen
      beschikkingen waarbij verzoeken niet worden ingewilligd of die ongunstige gevolgen hebben voor de personen tot wie
      zij zijn gericht.

      8 [Artikel 4:2 van de Algemene wet bestuursrecht][ref8] is niet van toepassing.

      9 Onverminderd artikel 2 van de toepassingsverordening Communautair douanewetboek is
      [artikel 4:5, eerste lid, van de Algemene wet bestuursrecht][ref9] niet van toepassing indien een verzoek om
      een bindende tariefinlichting of een bindende oorsprongsinlichting dan wel een verzoek om terugbetaling of
      kwijtschelding van de rechten bij invoer is ingediend.

      10 [Artikel 4:5, eerste lid, van de Algemene wet bestuursrecht][ref10] is slechts van toepassing indien de
      inspecteur in redelijkheid niet kan voldoen aan de hem ingevolge artikel 2 van de toepassingsverordening
      Communautair douanewetboek opgelegde verplichting.

      11 [Afdeling 4.1.2 van de Algemene wet bestuursrecht][ref11] is niet van toepassing op beschikkingen die niet-
      schriftelijk worden genomen of die het gevolg zijn van het doen van een aangifte.

      12 [Artikel 4:14 van de Algemene wet bestuursrecht][ref12] is niet van toepassing.

      13 [Artikel 4:15 van de Algemene wet bestuursrecht][ref13] is niet van toepassing indien een verzoek om een
      bindende tariefinlichting of een bindende oorsprongsinlichting is ingediend.


