  - number: 1:35
    text: |-
      Bij verificatie van een aangifte worden de resultaten van het onderzoek van de goederen geacht overeen te komen met
      de aangifte indien de bevonden verschillen blijven binnen de spelingen die daartoe bij regeling van Onze Minister
      van Financiën zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel135
  - number: 1:36
    text: |-
      1 Aan enige instelling van vervoer toevertrouwde brieven worden zonder goedvinden van de afzender of van de
      geadresseerde slechts geopend indien de rechter-commissaris in de rechtbank van het arrondissement waarbinnen de
      brief is aangetroffen, daartoe, op verzoek van de inspecteur, bevel heeft gegeven.

      2 Het bevel wordt slechts gegeven indien het vermoeden bestaat dat zich in de brief goederen bevinden.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel136
  - number: 1:37
    text: |-
      1 Vervoermiddelen, kennelijk ingericht of toegerust om goederen aan het ambtelijk toezicht te onttrekken of om
      tot het nakomen van de op grond van [artikel 1:27, eerste lid][ref1], genomen dwangmaatregelen te verijdelen,
      zomede alle andere voorwerpen, kennelijk bestemd om goederen aan het ambtelijk toezicht te onttrekken of om een
      vervoermiddel tot een van de hiervoor omschreven doeleinden in te richten of toe te rusten, worden in beslag
      genomen.

      2 Tot inbeslagneming krachtens het eerste lid zijn, behalve de inspecteur, bevoegd de bij of ingevolge
      [artikel 141 van het Wetboek van Strafvordering][ref2] aangewezen personen.

      3 Van de inbeslagneming en van de gronden daartoe doet de inspecteur zo spoedig mogelijk schriftelijk mededeling
      aan degene op wie de inbeslagneming heeft plaatsgehad. In geval van inbeslagneming op onbekende personen geschiedt
      die mededeling in het openbaar volgens bij regeling van Onze Minister van Financiën te stellen regels.

      4 Krachtens het eerste lid in beslag genomen vervoermiddelen en voorwerpen vervallen zonder rechtsvervolging
      aan de staat, tenzij bij een rechterlijke beslissing als bedoeld in het zesde lid de inbeslagneming niet wordt
      gehandhaafd.

      5 De belanghebbende bij het in beslag genomen vervoermiddel of voorwerp kan binnen een maand na de mededeling
      omtrent de inbeslagneming bij de rechtbank van het arrondissement binnen hetwelk de inbeslagneming heeft
      plaatsgehad, daartegen hetzij in persoon, hetzij door een gemachtigde een met redenen omkleed klaagschrift
      indienen.

      6 De rechtbank behandelt het klaagschrift op de voet van het bepaalde in
      [artikel 552b van het Wetboek van Strafvordering][ref3], met dien verstande, dat ook de inspecteur in de
      gelegenheid wordt gesteld tijdens de behandeling te worden gehoord en hem, zo hij voor de behandeling is
      verschenen, tijdig tevoren door de griffier schriftelijk mededeling van de dag der uitspraak wordt gedaan.

      7 [Artikel 552d van het Wetboek van Strafvordering][ref4] is van overeenkomstige toepassing.

      8 Onze Minister van Financiën is bevoegd in bijzondere gevallen de aan de staat vervallen vervoermiddelen en
      voorwerpen onder door hem te stellen voorwaarden aan de eigenaar terug te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel552b
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel552d
