  - number: 11:12
    text: |-
      1 Met betrekking tot bij deze wet strafbaar gestelde feiten en met uitbreiding van
      [artikel 53 van het Wetboek van Strafvordering][ref1] is de inspecteur bevoegd een van misdrijf verdachte persoon
      die is aangehouden in of op een locatie of vervoermiddel, een en ander als bedoeld in de [artikelen 1:26][ref2] en
      [1:27][ref3], of bij het juist hebben verlaten van een locatie of vervoermiddel als in die artikelen bedoeld, na
      aanhouding naar een plaats voor verhoor te geleiden dan wel diens aanhouding of voorgeleiding te bevelen.

      2 Indien de inspecteur die de verdachte heeft aangehouden of voor wie de verdachte wordt geleid de
      inverzekeringstelling of de bewaring van de verdachte nodig oordeelt, doet hij de verdachte voorgeleiden voor de
      officier van justitie of voor een hulpofficier van justitie.

      3 Indien de verdachte niet voor de officier of voor een hulpofficier van justitie wordt voorgeleid, wordt de
      verdachte, na te zijn verhoord, dadelijk in vrijheid gesteld.

      4 De verdachte mag niet langer dan zes uren voor verhoor worden opgehouden, met dien verstande dat de tijd tussen
      middernacht en negen uur ’s ochtends niet wordt meegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0023746#Artikel126
      [ref3]: https://wetten.overheid.nl/BWBR0023746#Artikel127
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel1112
