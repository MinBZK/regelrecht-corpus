  - number: 8:3
    text: |-
      Tegen een beschikking ter zake van landbouwrestituties staat, in afwijking van hetgeen omtrent bezwaar en
      beroep in deze wet is bepaald, beroep open op het College van Beroep voor het bedrijfsleven op de voet van de
      [Wet bestuursrechtspraak bedrijfsorganisatie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002144
