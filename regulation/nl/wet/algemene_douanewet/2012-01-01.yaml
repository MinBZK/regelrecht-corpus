  - number: 1:33
    text: |-
      1 Onze Ministers, openbare lichamen en rechtspersonen die bij of krachtens een bijzondere wet rechtspersoonlijkheid
      hebben verkregen, de onder hen ressorterende instellingen en diensten, alsmede personen die hoofdzakelijk
      uitvoering geven aan het beleid van het Rijk, verschaffen kosteloos, mondeling, schriftelijk of op andere wijze
      – zulks ter keuze van de inspecteur –, de gegevens en inlichtingen, die hun door de inspecteur worden gevraagd
      voor de uitvoering van het bepaalde bij of krachtens de in [artikel 1:1][ref1] bedoelde regelingen dan wel voor de
      uitvoering van het bepaalde bij of krachtens deze wet.

      2 Onze Minister van Financiën kan, op verzoek, ontheffing verlenen van de in het eerste lid omschreven
      verplichting.

      3 De inspecteur verstrekt kosteloos mondeling, schriftelijk of op andere wijze – zulks ter keuze van de inspecteur
      – de gegevens en inlichtingen aan Onze Ministers, openbare lichamen en rechtspersonen die bij of krachtens een
      bijzondere wet rechtspersoonlijkheid hebben verkregen, de onder hen ressorterende instellingen en diensten, alsmede
      personen die hoofdzakelijk uitvoering geven aan het beleid van het Rijk voorzover deze noodzakelijk zijn voor
      de uitvoering van het bepaalde bij of krachtens de in [artikel 1:1][ref2] bedoelde regelingen dan wel voor de
      uitvoering van het bepaalde bij of krachtens deze wet.

      4 De inspecteur verstrekt kosteloos mondeling, schriftelijk of op andere wijze – zulks ter keuze van de inspecteur
      – de gegevens en inlichtingen aan de douaneautoriteiten van de lidstaten of de Commissie van de Europese
      Gemeenschappen, bedoeld in artikel 13, vierde lid, van het Communautair douanewetboek.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0023746#Artikel11
