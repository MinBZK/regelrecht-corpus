  - number: 1:29
    text: |-
      Onze Minister van Financiën is bevoegd, na overleg met Onze Minister wie het mede aangaat, te bepalen, dat in het
      belang van controle en onderzoek op openbare land- en waterwegen versperringen worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel129
  - number: 1:30
    text: |-
      1 De inspecteur is bevoegd bij een controle geweld te gebruiken wanneer het daarmee beoogde doel dit, mede gelet
      op de aan het gebruik van geweld verbonden gevaren, rechtvaardigt en dat doel niet op een andere wijze kan worden
      bereikt.

      2 Aan het gebruik van geweld gaat zo mogelijk een waarschuwing vooraf.

      3 De ambtenaren die namens de inspecteur een taak uitoefenen zijn bevoegd tot het onderzoek aan de kleding van
      personen indien uit feiten of omstandigheden blijkt dat een onmiddellijk gevaar dreigt voor leven of veiligheid van
      de ambtenaren zelf of van derden en dit onderzoek noodzakelijk is ter afwending van dit gevaar.

      4 De inspecteur is bevoegd bij toepassing van het eerste lid de hulp in te roepen van de politie en de Koninklijke
      marechaussee of andere delen van de krijgsmacht. Deze zijn verplicht aan de vordering onmiddellijk te voldoen.

      5 De uitoefening van de bevoegdheden, bedoeld in het eerste en derde lid, dient in verhouding tot het beoogde doel
      redelijk en gematigd te zijn.

      6 Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel130
  - number: 1:31
    text: |-
      1 Het nemen van de nodige maatregelen, bedoeld in de artikelen 53, eerste lid, 57, 75, 78, derde lid, en 89, tweede
      lid, van het Communautair douanewetboek, wordt aangemerkt als het opleggen van een last onder bestuursdwang.

      2 Onverminderd het eerste lid is de inspecteur bevoegd tot oplegging van een last onder bestuursdwang ter
      handhaving van de bij of krachtens de in [artikel 1:1][ref1] bedoelde regelingen of bij of krachtens deze wet
      gestelde verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel11
