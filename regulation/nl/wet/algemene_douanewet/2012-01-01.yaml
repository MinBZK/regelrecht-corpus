      [artikel 1:2][ref1] van toepassing is, schuldig maakt aan:

      a. enig in deze wet omschreven misdrijf;

      b. de in [artikel 10:5, eerste lid, onderdeel b, onder 3°][ref2], omschreven overtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0023746#Artikel105
