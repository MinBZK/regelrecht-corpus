      1 Bij algemene maatregel van bestuur worden de gevallen vastgesteld waarin de belanghebbende ter zake van het
      verrichten van werkzaamheden kosten aan het Rijk is verschuldigd.

      2 Bij regeling van Onze Minister van Financiën wordt het tarief van kosten die verschuldigd zijn krachtens het
      eerste lid, vastgesteld.

      3 Het tarief wordt zodanig vastgesteld dat de verschuldigde kosten de werkelijke kosten zoveel mogelijk benaderen.

      4 De inspecteur stelt het bedrag van de door belanghebbende verschuldigde kosten vast.
