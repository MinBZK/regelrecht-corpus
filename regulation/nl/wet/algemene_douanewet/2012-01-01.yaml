  - number: 1:4
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen, ter uitwerking van interregionaal recht, het Koninkrijk
      verbindende verdragen en in al hun onderdelen verbindende besluiten van bij zodanige verdragen opgerichte
      volkenrechtelijke organisaties, regels van uitvoerende aard worden gesteld, die op goederen bij het binnenbrengen
      in, onderscheidenlijk verlaten van de gebieden, bedoeld in [artikel 1:2][ref1], van toepassing zijn.

      2 Bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur kunnen, met betrekking tot
      de uitvoering van gemeenschappelijke optredens, gemeenschappelijke standpunten, kaderbesluiten, besluiten en
      overeenkomsten die zijn aangenomen dan wel vastgesteld door de Raad van de Europese Unie, regels van uitvoerende
      aard worden gesteld, die op goederen bij het binnenbrengen in, onderscheidenlijk verlaten van de gebieden, bedoeld
      in [artikel 1:2][ref2], van toepassing zijn.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ter uitwerking van regelingen van
      internationaal recht tot het verlenen van wederzijdse administratieve bijstand.

      4 Onze Minister wie het aangaat, kan bevoegdheden, welke hem ingevolge het gestelde bij de in het eerste lid
      bedoelde algemene maatregel van bestuur toekomen, in een bij of krachtens die maatregel te bepalen omvang, aan
      het bestuur van een bedrijfslichaam dan wel zelfstandig bestuursorgaan overdragen en ten aanzien van de uitvoering
      ervan regels stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0023746#Artikel12
