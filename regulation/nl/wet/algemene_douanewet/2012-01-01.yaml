      [artikel 1:1, tweede tot en met vijfde lid][ref1], zijn de bepalingen van Titel I, Titel II, hoofdstukken 1 en 2,
      afdeling 1, Titel VIII en Titel IX, hoofdstuk 2, van het Communautair douanewetboek en Deel I, Titels I tot en met
      IV, hoofdstuk 1, van de toepassingsverordening Communautair douanewetboek van overeenkomstige toepassing.


