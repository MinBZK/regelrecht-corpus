    text: |-
      1 De inspecteur is bevoegd, met medeneming van de benodigde apparatuur of dieren elke plaats te betreden.

      2 Hij is bevoegd zich te doen vergezellen door personen die daartoe door hem zijn aangewezen.

      3 Het betreden van een woning zonder toestemming van de bewoner mag slechts door ambtenaren die deze bevoegdheid
      door de inspecteur toegekend hebben gekregen.

      4 De inspecteur is bevoegd tot het geven van een machtiging als bedoeld in
      [artikel 2 van de Algemene wet op het binnentreden][ref1].

      5 Ten aanzien van woningen op of in vervoermiddelen zijn de [artikelen 5, eerste lid][ref2], en
      [7 van de Algemene wet op het binnentreden][ref3] niet van toepassing.


