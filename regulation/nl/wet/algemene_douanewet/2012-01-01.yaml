        artikel: 5:45
  - number: 9:6a
    text: |-
      De in de [artikelen 9:1, eerste lid][ref1], [9:2, eerste en tweede lid][ref2], [9:3, eerste lid][ref3],
      [9:4, eerste lid][ref4], en [9:5][ref5], genoemde bedragen worden elke vijf jaar, met ingang van 1 januari 2015,
      bij ministeriële regeling gewijzigd. De [artikelen 10.1][ref6] en [10.2 van de Wet inkomstenbelasting 2001][ref7]
      zijn van overeenkomstige toepassing, met dien verstande dat als tabelcorrectiefactor wordt genomen het product van
      de factoren van de laatste vijf kalenderjaren.


