  - number: 4:1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen bepalingen worden vastgesteld met betrekking tot:

      a. de instelling en de werking van vrije zones;

      b. de oprichting en de werking van vrije entrepots.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel41
  - number: 5:1
    text: |-
      1 Goederen aanwezig in of op schepen, op weg naar zee of bestemd om aanstonds naar zee te vertrekken, zomede
      goederen die op het punt staan om in die schepen te worden opgenomen, worden aangemerkt als goederen die over zee
      het douanegebied van de Gemeenschap zullen uitgaan, tenzij blijkt dat de goederen bestemd zijn voor een plaats
      in het douanegebied van de Gemeenschap en het vervoer zal geschieden zonder dat het schip het douanegebied van de
      Gemeenschap uitgaat.

      2 Goederen aanwezig in luchtvaartuigen, bestemd om aanstonds op te stijgen, zomede goederen die op het punt staan
      om in die luchtvaartuigen te worden opgenomen, worden aangemerkt als goederen die door de lucht het douanegebied
      van de Gemeenschap zullen uitgaan, tenzij blijkt dat de goederen bestemd zijn voor een plaats in het douanegebied
      van de Gemeenschap en het vervoer zal geschieden zonder dat het luchtvaartuig het douanegebied van de Gemeenschap
      uitgaat.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel51
  - number: 6:1
    text: |-
      1 Bij regeling van Onze Minister van Financiën kunnen bepalingen worden vastgesteld ter uitwerking van Verordening
      (EG) nr. 1186/2009 van de Raad van de Europese Unie van 16 november 2009 betreffende de instelling van een
      communautaire regeling inzake douanevrijstellingen (PbEU L 324).

      2 De bepalingen, bedoeld in het eerste lid, hebben betrekking op:

      a. nadere voorwaarden waaronder vrijstelling wordt verleend;

      b. het beperken van de omvang van de vrijstelling;

      c. de aanwijzing van personen en openbare diensten die toestemming krijgen om goederen vrij van rechten in te
      voeren dan wel in ontvangst te nemen;

      d. het verlenen van vrijstellingen als bedoeld in artikel 133, eerste lid, van de in het eerste lid genoemde
      verordening;

      e. het verlenen van vrijstellingen aan strijdkrachten die ter uitvoering van internationale overeenkomsten op
      Nederlands grondgebied zijn gestationeerd en die niet onder Nederlands gezag staan.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel61
  - number: 6:2
    text: |-
      Bij regeling van Onze Minister van Financiën kunnen bepalingen worden vastgesteld ter zake van vrijstelling van
      rechten bij invoer of van rechten bij uitvoer bij het in het vrije verkeer brengen respectievelijk de uitvoer van
      goederen bestemd voor de bevoorrading van schepen, luchtvaartuigen en internationale treinen.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel62
  - number: 6:3
    text: |-
      Bij regeling van Onze Minister van Financiën kunnen bepalingen worden vastgesteld ter uitwerking van
      vrijstellingsbepalingen ingesteld bij andere communautaire besluiten dan Verordening (EG) nr. 1186/2009 van de
      Raad van de Europese Unie van 16 november 2009 betreffende de instelling van een communautaire regeling inzake
      douanevrijstellingen (PbEU L 324).
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel63
  - number: 7:1
    text: |-
      Met het oog op de in de douanewetgeving voorziene zekerheidstelling voor het bedrag van de douaneschuld kunnen bij
      regeling van Onze Minister van Financiën bepalingen worden vastgesteld ter zake van:

      a. zekerheidstelling door storting van contant geld dan wel hetgeen daarmede gelijk is gesteld;

      b. andere wijzen van zekerheidstelling dan door storting van contant geld of door borgstelling.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel71
  - number: 7:2
    text: |-
      1 Met het oog op de in de douanewetgeving voorziene zekerheidstelling voor het bedrag van de douaneschuld kunnen
      bij regeling van Onze Minister van Financiën bepalingen worden vastgesteld ter zake van de voorwaarden waaraan moet
      worden voldaan teneinde als borg te worden erkend.

      2 Bij de regeling, bedoeld in het eerste lid, kunnen specifieke verplichtingen worden vastgesteld welke een erkende
      borg moet naleven.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel72
  - number: 7:3
    text: |-
      Onder de naam «rechten bij invoer» en «rechten bij uitvoer» worden belastingen geheven ter zake van de invoer
      respectievelijk de uitvoer van goederen overeenkomstig hetgeen dienaangaande is bepaald bij of krachtens het
      Koninkrijk verbindende verdragen en in al hun onderdelen verbindende besluiten van bij zodanige verdragen
      opgerichte volkenrechtelijke organisaties.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel73
  - number: 7:4
    text: |-
      Wanneer een douaneaangifte voor het plaatsen van goederen onder de douaneregeling

        - in het vrije verkeer brengen of
        - tijdelijke invoer is opgesteld op basis van gegevens die ertoe leiden dat de wettelijk verschuldigde rechten
      geheel of gedeeltelijk niet worden geheven zijn de personen die deze voor de opstelling van de aangifte benodigde
      gegevens onmiddellijk of middellijk hebben verstrekt, terwijl zij wisten of redelijkerwijze hadden moeten weten dat
      die gegevens verkeerd waren eveneens schuldenaar.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel74
  - number: 7:4a
    text: |-
      1 [Artikel 4:86 van de Algemene wet bestuursrecht][ref1] is niet van toepassing.

      2 [Artikel 4:88, derde lid, van de Algemene wet bestuursrecht][ref2] is niet van toepassing.

      3 Uitstel van betaling als bedoeld in de artikelen 224 tot en met 228 van het Communautair douanewetboek is geen
      uitstel van betaling als bedoeld in [artikel 4:94 van de Algemene wet bestuursrecht][ref3].

      4 Het uitstel van betaling, bedoeld in [artikel 4:94 van de Algemene wet bestuursrecht][ref4], is een «andere
      betalingsfaciliteit» als bedoeld in artikel 229 van het Communautair douanewetboek.

      5 [Artikel 4:96 van de Algemene wet bestuursrecht][ref5] is slechts van toepassing indien het uitstel van betaling
      betreft ingevolge artikel 229 van het Communautair douanewetboek.

      6 [Afdeling 4.4.2 van de Algemene wet bestuursrecht][ref6] is niet van toepassing.


