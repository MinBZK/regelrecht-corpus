  - number: 9:1
    text: |-
      1 Indien voor goederen in tijdelijke opslag waarvoor een summiere aangifte is gedaan de formaliteiten welke nodig
      zijn om deze goederen een douanebestemming te geven niet worden vervuld binnen de ingevolge artikel 49 van het
      Communautair douanewetboek geldende termijn, vormt dit een verzuim ter zake waarvan de inspecteur degene die de
      formaliteiten binnen deze termijn dient te vervullen en degene door wiens toedoen de formaliteiten niet binnen deze
      termijn worden vervuld ieder een bestuurlijke boete van ten hoogste € 300 kan opleggen.

      2 Indien het niet vervullen van de in het eerste lid bedoelde formaliteiten binnen de ingevolge artikel 49 van het
      Communautair douanewetboek geldende termijn, een douaneschuld doet ontstaan en het daaruit voortvloeiende bedrag
      aan rechten bij invoer hoger is dan € 300, terwijl het niet vervullen van die formaliteiten binnen die termijn is
      te wijten aan opzet of grove schuld van één of meer van degenen, bedoeld in het eerste lid, vormt dit een vergrijp
      ter zake waarvan de inspecteur hem, onderscheidenlijk ieder van hen, een bestuurlijke boete van ten hoogste 100
      percent van het bedrag aan rechten kan opleggen.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel91
  - number: 9:2
    text: |-
      1 Indien voor goederen welke zijn geplaatst onder de douaneregeling douanevervoer, actieve veredeling (systeem
      inzake schorsing), behandeling onder douanetoezicht of tijdelijke invoer, de formaliteiten ter beëindiging van
      die regeling in strijd met de douanewetgeving niet of niet tijdig worden vervuld, vormt dit een verzuim ter
      zake waarvan de inspecteur degene die die formaliteiten dient te vervullen en degene door wiens toedoen die
      formaliteiten niet of niet tijdig worden vervuld ieder een bestuurlijke boete van ten hoogste € 300 kan opleggen.

      2 Indien goederen welke zijn geplaatst onder de douaneregeling douanevervoer in strijd met artikel 355, tweede
      lid, van de toepassingsverordening Communautair douanewetboek niet langs een verplicht te volgen route worden
      vervoerd, dan wel in strijd met artikel 356 van de toepassingsverordening Communautair douanewetboek niet binnen
      de voorgeschreven termijn bij het douanekantoor van bestemming worden aangebracht, vormt dit een verzuim ter
      zake waarvan de inspecteur degene die de goederen in strijd met artikel 355, tweede lid, voornoemd vervoert,
      onderscheidenlijk in strijd met artikel 356 voornoemd niet tijdig aanbrengt, en degene door wiens toedoen het
      desbetreffende verzuim plaatsvindt, ieder een bestuurlijke boete van ten hoogste € 300 kan opleggen.

      3 Indien het in strijd met de douanewetgeving niet of niet tijdig vervullen van de in het eerste lid bedoelde
      formaliteiten of het in strijd met de douanewetgeving niet vervullen van de in het tweede lid bedoelde
      verplichtingen een douaneschuld doet ontstaan en het daaruit voortvloeiende bedrag aan rechten bij invoer hoger
      is dan € 300, terwijl het in strijd met de douanewetgeving niet of niet tijdig vervullen van die formaliteiten,
      onderscheidenlijk niet vervullen van die verplichtingen, is te wijten aan opzet of grove schuld van één of meer
      van degenen, bedoeld in het eerste dan wel tweede lid, vormt dit een vergrijp ter zake waarvan de inspecteur hem,
      onderscheidenlijk ieder van hen, een bestuurlijke boete van ten hoogste 100 percent van het bedrag aan rechten
      kan opleggen.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel92
  - number: 9:3
    text: |-
      1 Indien in een douane-entrepot, in een vrij entrepot of in een vrije zone welke is aangewezen ingevolge artikel
      168bis van het Communautair douanewetboek een vermis wordt bevonden, vormt dit een verzuim ter zake waarvan
      de inspecteur de entreposeur, de entrepositaris, onderscheidenlijk de belanghebbende, bedoeld in artikel 799,
      onderdeel c, van de toepassingsverordening Communautair douanewetboek, een bestuurlijke boete van ten hoogste € 300
      kan opleggen.

      2 Indien het in het eerste lid bedoelde vermis een douaneschuld doet ontstaan en het daaruit voortvloeiende
      bedrag aan rechten bij invoer hoger is dan € 300, terwijl dat vermis is te wijten aan opzet of grove schuld van de
      entreposeur, de entrepositaris, onderscheidenlijk de belanghebbende, bedoeld in artikel 799, onderdeel c, van de
      toepassingsverordening Communautair douanewetboek, vormt dit een vergrijp ter zake waarvan de inspecteur hem een
      bestuurlijke boete van ten hoogste 100 percent van het bedrag aan rechten kan opleggen.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel93
  - number: 9:4
    text: |-
      1 Het niet voldoen aan een verplichting voortvloeiend uit een vergunning welke is verleend ingevolge de
      douanewetgeving, vormt een verzuim ter zake waarvan de inspecteur degene die deze voorwaarde dient na te leven en
      degene door wiens toedoen die voorwaarde niet of niet tijdig wordt nageleefd een bestuurlijke boete van ten hoogste
      € 300 kan opleggen.

      2 Indien het in strijd met de douanewetgeving niet of niet tijdig vervullen van de in het eerste lid bedoelde
      voorwaarde een douaneschuld doet ontstaan en het daaruit voortvloeiende bedrag aan rechten bij invoer hoger is dan
      € 300, terwijl het in strijd met de douanewetgeving niet of niet tijdig vervullen van deze voorwaarde is te wijten
      aan opzet of grove schuld van één of meer van degenen, bedoeld in het eerste lid, vormt dit een vergrijp ter zake
      waarvan de inspecteur hem, onderscheidenlijk ieder van hen, een bestuurlijke boete van ten hoogste 100 percent van
      het bedrag aan rechten kan opleggen.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel94
  - number: 9:5
    text: |-
      Het overtreden van een krachtens deze wet vastgestelde algemene maatregel van bestuur of ministeriële regeling kan
      bij die algemene maatregel van bestuur of ministeriële regeling worden aangemerkt als een verzuim ter zake waarvan
      de inspecteur degene aan wie het verzuim te wijten is een bestuurlijke boete kan opleggen van ten hoogste het in
      die algemene maatregel van bestuur of ministeriële regeling te vermelden bedrag. Dat bedrag beloopt ten hoogste
      € 300 indien het verzuim betrekking heeft op een algemene maatregel van bestuur, en beloopt ten hoogste € 150
      indien het verzuim betrekking heeft op een ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel95
  - number: 9:6
    text: |-
      In afwijking van [artikel 5:45, eerste en tweede lid, van de Algemene wet bestuursrecht][ref1] vervalt de
      bevoegdheid tot het opleggen van een bestuurlijke boete als bedoeld in deze afdeling door verloop van drie jaren na
      het tijdstip waarop het verzuim of vergrijp waarop de bestuurlijke boete betrekking heeft, heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel545
    url: https://wetten.overheid.nl/BWBR0023746/2012-01-01#Artikel96
