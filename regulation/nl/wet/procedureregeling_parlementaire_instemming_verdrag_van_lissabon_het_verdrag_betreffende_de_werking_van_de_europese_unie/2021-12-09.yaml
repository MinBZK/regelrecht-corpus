preamble:
  text: >-
    In de Goedkeuringswet van het Verdrag van Lissabon (Stb. 2008, 301) is de bepaling opgenomen dat ontwerp-besluiten
    voortvloeiend uit de artikelen 77, derde lid, 87, derde lid, en 89 van het Verdrag betreffende de werking van de
    Europese Unie terstond aan de Staten-Generaal worden voorgelegd, voordat daarover besluitvorming plaatsvindt door
    de Raad. Dit betreft ook artikel 81, lid 3 van genoemd Verdrag, voorzover het niet gaat om de tweede alinea van
    dat lid.


    Instemming van beide Kamers der Staten-Generaal is vereist voordat de vertegenwoordiger van het Koninkrijk zijn
    medewerking kan verlenen aan de totstandkoming van een besluit (van de Raad). Stilzwijgende instemming is verleend
    indien niet binnen vijftien dagen na overlegging van het ontwerp-besluit door of namens een van de Kamers de wens
    te kennen wordt gegeven dat het ontwerp-besluit de uitdrukkelijke instemming behoeft.


    Hierop is de volgende procedure gebaseerd:
