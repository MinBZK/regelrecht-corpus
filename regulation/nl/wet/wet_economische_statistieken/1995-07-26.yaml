$id: wet_economische_statistieken
regulatory_layer: WET
publication_date: '2003-12-18'
valid_from: '1995-07-26'
bwb_id: BWBR0001982
url: https://wetten.overheid.nl/BWBR0001982/1995-07-26
preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het wenschelijk is, maatregelen te nemen tot het verkrijgen van juiste
    economische statistieken;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001982/1995-07-26#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Het Centraal Bureau voor de Statistiek is bevoegd, met machtiging en onder toezicht van Onzen met de uitvoering
      dezer wet belasten Minister, de Centrale Commissie voor de Statistiek gehoord, rechtstreeks of door tusschenkomst
      van ambtenaren en deskundigen, de opgaven en inlichtingen in te winnen, die het noodig acht tot het verkrijgen van
      juiste economische statistieken, ook over reeds verloopen jaren.
    url: https://wetten.overheid.nl/BWBR0001982/1995-07-26#Artikel1
  - number: '1.2'
    text: |-
      Voorzoover de in het vorige lid bedoelde opgaven en inlichtingen liggen op het terrein van het Nederlandsche
      bankwezen, geschiedt het inwinnen na overleg met en door tusschenkomst van de Nederlandsche Bank en zulks in
      dien zin, dat de Bank de op afzonderlijke personen, ondernemingen of instellingen betrekking hebbende gegevens
      verzamelt, deze totaliseert en de aldus verkregen totaalcijfers aan het Centraal Bureau voor de Statistiek doet
      toekomen.
    url: https://wetten.overheid.nl/BWBR0001982/1995-07-26#Artikel1
  - number: '1.3'
    text: |-
      Alle ingezetenen en andere binnen het Rijk in Europa verblijf houdende personen, met uitzondering van de hoofden
      der Departementen van algemeen bestuur, zijn verplicht de gevraagde opgaven en inlichtingen te verstrekken.
    url: https://wetten.overheid.nl/BWBR0001982/1995-07-26#Artikel1
  - number: '2.1'
    text: |-
      Tot het verkrijgen van de in het vorige artikel bedoelde opgaven en inlichtingen wendt het Centraal Bureau voor de
      Statistiek zich schriftelijk tot de betrokken personen.
    url: https://wetten.overheid.nl/BWBR0001982/1995-07-26#Artikel2
  - number: '2.2'
    text: |-
      In het geval, bedoeld in het tweede lid van het vorige artikel, geeft het Centraal Bureau voor de Statistiek van de
      gestelde vragen kennis aan de Nederlandsche Bank.
    url: https://wetten.overheid.nl/BWBR0001982/1995-07-26#Artikel2
  - number: '2.3'
    text: |-
      De betrokken personen zijn verplicht de gestelde vragen duidelijk en zonder voorbehoud naar waarheid te
      beantwoorden binnen een door Onzen met de uitvoering dezer wet belasten Minister bij het verleenen van de in
      [artikel 1][ref1] bedoelde machtiging vast te stellen termijn na de bekendmaking van de beschikking, bedoeld in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001982#Artikel1
    url: https://wetten.overheid.nl/BWBR0001982/1995-07-26#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001982
        artikel: '1'
  - number: '2.4'
    text: Artikel 19 der wet van den 5den Augustus 1850 (*Staatsblad* no. 45) is te dezen toepasselijk.
    url: https://wetten.overheid.nl/BWBR0001982/1995-07-26#Artikel2
  - number: '3.1'
    text: |-
      In bijzondere gevallen kan Onze met de uitvoering dezer wet belaste Minister de door het Centraal Bureau voor
      de Statistiek aangewezen ambtenaren en deskundigen machtigen, inzage te vorderen van boeken, bescheiden en
      geschriften.
    url: https://wetten.overheid.nl/BWBR0001982/1995-07-26#Artikel3
  - number: '3.2'
    text: |-
      Voorzoover inzage noodig is van boeken, bescheiden en geschriften van hier te lande gevestigde of hun bedrijf
      uitoefenende banken of bankiers, geschiedt zulks door tusschenkomst van de Nederlandsche Bank en wel in dier voege,
      dat de Bank de personen aanwijst, die met machtiging van Onzen met de uitvoering dezer wet belasten Minister, de
      inzage kunnen vorderen.
    url: https://wetten.overheid.nl/BWBR0001982/1995-07-26#Artikel3
  - number: '4'
    text: |-
      Het is aan een ieder, die ingevolge deze wet met eenige werkzaamheid belast is, verboden, van de ontvangen opgaven
      en inlichtingen, in [artikel 1][ref1] bedoeld, alsmede van de gegevens, bij de inzage van boeken, bescheiden en
      geschriften, als in [artikel 3][ref2] bedoeld, verkregen, verder gebruik te maken dan voor de uitoefening van zijn
      taak gevorderd wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0001982#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001982#Artikel3
    url: https://wetten.overheid.nl/BWBR0001982/1995-07-26#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001982
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001982
        artikel: '3'
  - number: '5'
    text: |-
      Gegevens, ingevolge deze wet verzameld, worden niet in zoodanigen vorm openbaar gemaakt, dat daaruit opgaven en
      inlichtingen over een afzonderlijken persoon, onderneming of instelling kunnen blijken, tenzij die persoon, het
      hoofd van de onderneming of het bestuur der instelling hiertegen geen bezwaar heeft.
    url: https://wetten.overheid.nl/BWBR0001982/1995-07-26#Artikel5
  - number: '6'
    text: |-
      Onze met de uitvoering dezer wet belaste Minister is bevoegd ter zake van de uitoefening van de bevoegdheden, in de
      [artikelen 1][ref1] en [3][ref2] bedoeld, nadere voorschriften vast te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0001982#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001982#Artikel3
    url: https://wetten.overheid.nl/BWBR0001982/1995-07-26#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001982
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001982
        artikel: '3'
  - number: '7.1'
    text: |-
      De personen die, hoewel daartoe in staat, weigeren of nalatig zijn de opgaven of inlichtingen, bedoeld
      in [artikel 1][ref1], te verstrekken of weigeren inzage van boeken, bescheiden of geschriften, bedoeld in
      [artikel 3][ref2], te verleenen, worden gestraft met hechtenis van ten hoogste drie maanden of geldboete van de
      tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001982#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001982#Artikel3
    url: https://wetten.overheid.nl/BWBR0001982/1995-07-26#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001982
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001982
        artikel: '3'
  - number: '7.2'
    text: |-
      Hij die opzettelijk eene onjuiste opgave of inlichting, als bedoeld in [artikel 1][ref1], verstrekt of opzettelijk
      tot de verstrekking medewerkt, wordt gestraft met gevangenisstraf van ten hoogste één jaar of geldboete van de
      derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001982#Artikel1
    url: https://wetten.overheid.nl/BWBR0001982/1995-07-26#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001982
        artikel: '1'
  - number: '7.3'
    text: |-
      Hij die opzettelijk de bij [artikel 4][ref1] opgelegde geheimhouding schendt, wordt gestraft met gevangenisstraf
      van ten hoogste zes maanden of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001982#Artikel4
    url: https://wetten.overheid.nl/BWBR0001982/1995-07-26#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001982
        artikel: '4'
  - number: '7.4'
    text: |-
      Hij aan wiens schuld schending van die geheimhouding te wijten is, wordt gestraft met hechtenis van ten hoogste
      drie maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001982/1995-07-26#Artikel7
  - number: '7.5'
    text: |-
      Hij die opzettelijk gegevens, ingevolge deze wet verkregen, in strijd met het bepaalde in [artikel 5][ref1]
      openbaar maakt, wordt gestraft met gevangenisstraf van ten hoogste zes maanden of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001982#Artikel5
    url: https://wetten.overheid.nl/BWBR0001982/1995-07-26#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001982
        artikel: '5'
  - number: '7.6'
    text: |-
      Hij aan wiens schuld te wijten is, dat gegevens, ingevolge deze wet verkregen, in strijd met het bepaalde in
      [artikel 5][ref1] worden openbaar gemaakt, wordt gestraft met hechtenis van ten hoogste drie maanden of geldboete
      van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001982#Artikel5
    url: https://wetten.overheid.nl/BWBR0001982/1995-07-26#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001982
        artikel: '5'
  - number: '7.7'
    text: |-
      De feiten, in het eerste lid van dit artikel strafbaar gesteld, worden beschouwd als overtredingen, de in het
      tweede, derde, vierde, vijfde en zesde lid strafbaar gestelde als misdrijven.
    url: https://wetten.overheid.nl/BWBR0001982/1995-07-26#Artikel7
  - number: '8'
    text: Bij het inwerkingtreden van deze wet is afgeschaft de wet van den 1sten December 1917, *Staatsblad* no. 665.
    url: https://wetten.overheid.nl/BWBR0001982/1995-07-26#Artikel8
