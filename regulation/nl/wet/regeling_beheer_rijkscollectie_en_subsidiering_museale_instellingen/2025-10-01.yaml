  - number: '3.9'
    text: |-
      De aanvraag tot vaststelling van de subsidie geschiedt in de verantwoording van de subsidie
      die de instelling met een wettelijke taak voor het betreffende jaar ontvangt op grond van
      [artikel 4a van de Wet op het specifiek cultuurbeleid][ref1], met overeenkomstige toepassing van:

      a. voor wat betreft de jaarrekening: de [artikelen 2.26][ref2], [2.27, eerste en tweede lid][ref3], en
      [2.28 van de Regeling op het specifiek cultuurbeleid][ref4]; en

      b. voor wat betreft het bestuursverslag: de [artikelen 2.15, tweede, derde en vijfde lid, tweede volzin][ref5], en
      [2.28 van de Regeling op het specifiek cultuurbeleid][ref6].


