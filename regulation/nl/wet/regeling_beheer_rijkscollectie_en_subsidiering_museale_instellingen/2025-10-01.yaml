  - number: '3.19'
    text: |-
      1 Een instelling met een wettelijke taak verleent haar medewerking aan een eenmaal per vier jaar te houden
      visitatie, die ten doel heeft de wijze waarop die instelling haar taken en publieksactiviteiten verricht te
      beoordelen.

      2 De minister kan nadere eisen stellen aan de visitatie, bedoeld in het eerste lid.
