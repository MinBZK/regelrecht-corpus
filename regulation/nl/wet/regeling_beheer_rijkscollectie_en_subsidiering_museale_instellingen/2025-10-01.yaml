  - number: '3.18'
    text: |-
      Indien de subsidie na uitvoering van de activiteiten zoals opgenomen in de begroting voor het desbetreffende jaar
      niet volledig is aangewend, dan kan de instelling de resterende middelen besteden ten behoeve van de taak waarmee
      zij op grond van [artikel 2.8 van de Erfgoedwet][ref1] is belast.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel2.8
