        artikel: '7'
  - number: 3.3.1
    text: 'De minister kan de subsidie verhogen:'
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.3
  - number: 3.3.1.a
    text: |-
      rekening houdend met de ontwikkeling van de kosten in de arbeidsvoorwaarden of van de kosten in de ontwikkeling van
      het prijspeil voorafgaand aan of tijdens het jaar waarop de subsidieverlening betrekking heeft; of
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.3
  - number: 3.3.1.b
    text: |-
      voor zover sprake is van aanvullende activiteiten die wijziging van de subsidie naar het oordeel van de minister
      rechtvaardigen.
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.3
  - number: 3.3.2
    text: |-
      Indien de subsidie wordt gewijzigd, rekening houdend met de ontwikkeling van de kosten in de arbeidsvoorwaarden of
      de kosten van het prijspeil, bepaalt de minister welk percentage van de subsidie wordt aangemerkt als loongevoelig
      onderscheidenlijk prijsgevoelig.
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.3
  - number: 3.4.1
    text: |-
      [Artikel 2.11, eerste tot en met vierde lid, van de Regeling op het specifiek cultuurbeleid][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel2
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0027597
        artikel: '2'
  - number: 3.4.2
    text: |-
      Indien de subsidie op grond van [artikel 3.3, eerste lid][ref1], wordt gewijzigd, wordt de bevoorschotting
      overeenkomstig aangepast.


      [ref1]: https://wetten.overheid.nl/BWBR0037533#Artikel3
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0037533
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.5.1
    text: |-
      Een instelling met een wettelijke taak dient jaarlijks uiterlijk op 1 november de volgende documenten in bij de
      minister:
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.5
  - number: 3.5.1.a
    text: een begroting; en
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.5
  - number: 3.5.1.b
    text: |-
      voor zover van toepassing, een onderhouds- en investeringsplan als bedoeld in [artikel 3.7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037533#Artikel3
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0037533
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.5.2
    text: |-
      De begroting behelst een overzicht van de voor het kalenderjaar geraamde baten en lasten van de aanvrager, voor
      zover deze betrekking hebben op de wettelijke taak waarmee de instelling is belast, en sluit aan op het door de
      minister verleende subsidiebedrag.
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.5
  - number: 3.5.3
    text: De begroting bevat een postgewijze toelichting.
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.5
  - number: 3.5.4
    text: |-
      De [artikelen 2.5, vierde lid][ref1], [2.6][ref2] en [2.7 van de Regeling op het specifiek cultuurbeleid][ref3]
      zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0027597#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0027597#Artikel2
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0027597
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0027597
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0027597
        artikel: '2'
  - number: 3.5.5
    text: |-
      Indiening van een onderhouds- en investeringsplan als bedoeld in [artikel 3.7][ref1] kan achterwege blijven, indien
      de instelling met een wettelijke taak er redelijkerwijs van uit kan gaan dat de minister al over de meest recente
      versie van het plan beschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0037533#Artikel3
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0037533
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.5.6
    text: |-
      Indien uitvoering van wettelijke taak aan de hand van de ingediende documenten, bedoeld in het eerste lid, naar
      het oordeel van de minister bezwaarlijk is, kan hij de subsidieontvanger aanwijzingen geven tot wijziging van die
      documenten.
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.5
  - number: '3.6'
    text: |-
      De indiening van de documenten, bedoeld in [artikel 3.5, eerste lid][ref1], geschiedt op een door de minister te
      bepalen elektronische wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0037533#Artikel3
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0037533
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.7.1
    text: |-
      De volgende instellingen met een wettelijke taak beschikken voor gebouwen waarin cultuurgoederen worden beheerd
      waar de taak op ziet, over een actueel meerjarig onderhouds- en investeringsplan:
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.7
  - number: 3.7.1.a
    text: instellingen die eigenaar zijn van die gebouwen; en
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.7
  - number: 3.7.1.b
    text: |-
      instellingen die met het Rijksvastgoedbedrijf een huurovereenkomst hebben gesloten over die gebouwen en waarbij
      overeengekomen is dat de instelling verantwoordelijk is voor de instandhouding van de gebouwen.
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.7
  - number: 3.7.2
    text: |-
      Een instelling als bedoeld in het eerste lid dient telkens na vier jaar een actueel onafhankelijk bouwkundig
      inspectierapport van de gebouwen in. De eerste indiening vindt plaats voor 1 januari 2020.
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.7
  - number: '3.8'
    text: |-
      De [artikelen 2.12 tot en met 2.14][ref1] en
      [2.17 tot en met 2.21 van de Regeling op het specifiek cultuurbeleid][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0027597#Artikel2
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0027597
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0027597
        artikel: '2'
  - number: '3.9'
    text: |-
      De aanvraag tot vaststelling van de subsidie geschiedt in de verantwoording van de subsidie
      die de instelling met een wettelijke taak voor het betreffende jaar ontvangt op grond van
      [artikel 4a van de Wet op het specifiek cultuurbeleid][ref1], met overeenkomstige toepassing van:


      [ref1]: https://wetten.overheid.nl/BWBR0005904#Artikel4a
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0005904
        artikel: 4a
  - number: 3.9.a
    text: |-
      voor wat betreft de jaarrekening: de [artikelen 2.26][ref1], [2.27, eerste en tweede lid][ref2], en
      [2.28 van de Regeling op het specifiek cultuurbeleid][ref3]; en


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0027597#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0027597#Artikel2
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0027597
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0027597
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0027597
        artikel: '2'
  - number: 3.9.b
    text: |-
      voor wat betreft het bestuursverslag: de [artikelen 2.15, tweede, derde en vijfde lid, tweede volzin][ref1], en
      [2.28 van de Regeling op het specifiek cultuurbeleid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0027597#Artikel2
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0027597
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0027597
        artikel: '2'
  - number: '3.10'
    text: |-
      [Artikel 2.29, eerste lid, van de Regeling op het specifiek cultuurbeleid][ref1] is van overeenkomstige toepassing
      op de vaststelling van de subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel2
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0027597
        artikel: '2'
  - number: '3.11'
    text: |-
      Indien na uitvoering van de taak, bedoeld in [artikel 2.8 van de Erfgoedwet][ref1], de subsidie niet volledig
      is aangewend en langetermijninvesteringsreserves zijn aangehouden voor het beheer van de cultuurgoederen of de
      instandhouding van gebouwen, zoals opgenomen in de begroting voor het desbetreffende jaar, dan kan de instelling de
      resterende middelen besteden aan publieksactiviteiten of andere activiteiten in het kader van de cultuurgoederen.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel2
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '2'
  - number: '3.12'
    text: |-
      [Artikel 6.1 van de Regeling op het specifiek cultuurbeleid][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel6
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0027597
        artikel: '6'
  - number: 3.13.1
    text: |-
      Deze paragraaf is uitsluitend van toepassing op subsidies, niet zijnde subsidies als bedoeld in
      [hoofdstuk 3 van de Regeling op het specifiek cultuurbeleid][ref1], die de minister voor de jaren 2025 tot en met
      2028 op grond van [artikel 4a van de Wet op het specifiek cultuurbeleid][ref2] verstrekt aan instellingen met een
      wettelijke taak.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0005904#Artikel4a
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0027597
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0005904
        artikel: 4a
  - number: 3.13.2
    text: |-
      [Artikel 2.2 van de Regeling op het specifiek cultuurbeleid][ref1] is niet van toepassing op de verstrekking van
      subsidies als bedoeld in het eerste lid aan instellingen met een wettelijke taak.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel2
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0027597
        artikel: '2'
  - number: 3.14.1
    text: |-
      De minister verleent voor 1 oktober 2024 ambtshalve subsidie voor publieksactiviteiten en andere activiteiten
      – niet behorende tot beheer van de collectie in de zin van de [Erfgoedwet][ref1] – aan instellingen met een
      wettelijke taak, die als kernactiviteit het beheer van een collectie van cultureel erfgoed hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0037521
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0037521
  - number: 3.14.2
    text: 'De minister verleent voor 1 oktober 2024 tevens ambtshalve:'
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.14
  - number: 3.14.2.a
    text: |-
      subsidie aan ten hoogste één instelling met een wettelijke taak, die als kernactiviteit heeft het beheren van
      een collectie van cultureel erfgoed op het gebied van kunsthistorische documentatie, voor het uitvoeren van een
      activiteitenprogramma als ondersteunende instelling;
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.14
  - number: 3.14.2.b
    text: 'een aanvullend bedrag aan ten hoogste één instelling met een wettelijke taak, voor:'
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.14
  - number: 3.14.2.b.1°
    text: het bevorderen van de bescherming en kennis van immaterieel erfgoed; en
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.14
  - number: 3.14.2.b.2°
    text: het onderhouden van de Canon van Nederland;
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.14
  - number: 3.14.2.c
    text: |-
      een aanvullend bedrag aan ten hoogste één instelling met een wettelijke taak, voor publieksactiviteiten in relatie
      tot de Leidse Siebold-collectie; en
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.14
  - number: 3.14.2.d
    text: |-
      een aanvullend bedrag aan ten hoogste één instelling met een wettelijke taak, voor activiteiten ter bevordering van
      een netwerk van museumconservatoren van Nederlandse en Vlaamse kunst.
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.14
  - number: 3.15.1
    text: De subsidieontvanger dient uiterlijk op 1 november 2024 een activiteitenplan en een begroting in.
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.15
  - number: 3.15.2
    text: De begroting sluit aan op het door de minister verleende subsidiebedrag.
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.15
  - number: 3.15.3
    text: 'In het activiteitenplan verklaart de subsidieontvanger dat hij:'
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.15
  - number: 3.15.3.a
    text: 'de navolgende codes onderschrijft:'
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.15
  - number: 3.15.3.a.1°
    text: Fair Practice Code;
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.15
  - number: 3.15.3.a.2°
    text: Governance Code Cultuur;
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.15
  - number: 3.15.3.a.3°
    text: Code Diversiteit en Inclusie; en
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.15
  - number: 3.15.3.b
    text: |-
      zich met ingang van 1 januari 2025 zal aansluiten bij de bestaande collectieve afspraken over honorering binnen
      zijn sector; en
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.15
  - number: 3.15.3.c
    text: aansluit bij de sociale dialoog tussen werkgevers of opdrachtgevers en werknemers of opdrachtnemers.
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.15
  - number: 3.15.4
    text: |-
      De [artikelen 2.4][ref1] en [2.5 van de Regeling op het specifiek cultuurbeleid][ref2] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0027597#Artikel2
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.15
    references:
      - id: ref1
        bwb_id: BWBR0027597
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0027597
        artikel: '2'
  - number: 3.15.5
    text: |-
      Indien uitvoering van de gesubsidieerde activiteiten aan de hand van de ingediende documenten, bedoeld in het
      eerste lid, naar het oordeel van de minister bezwaarlijk is, kan hij de subsidieontvanger aanwijzingen geven tot
      wijziging van die documenten.
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.15
  - number: '3.16'
    text: |-
