preamble:
  text: |-
    Gelet op de artikelen 2.7, 2.10, tweede lid, en 7.7 van de Erfgoedwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder: - *beheerder:* minister wie het aangaat, college van staat of instelling die
      museale cultuurgoederen van de Staat beheert;
        - *instelling met een wettelijke taak:* instelling die op grond van [artikel 2.8 van de Erfgoedwet][ref1] belast is
      met het beheer van museale cultuurgoederen van de Staat of andere cultuurgoederen;
        - *minister:* Minister van Onderwijs, Cultuur en Wetenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel2
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '2'
  - number: '1.2'
    text: |-
      Deze regeling berust mede op [artikel 4a van de Wet op het specifiek cultuurbeleid][ref1] en de [artikelen 3][ref2]
      en [4 van het Besluit op het specifiek cultuurbeleid.][ref3]


      [ref1]: https://wetten.overheid.nl/BWBR0005904#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0027600#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0027600#Artikel4
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0005904
        artikel: 4a
      - id: ref2
        bwb_id: BWBR0027600
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0027600
        artikel: '4'
  - number: '2.1'
    text: |-
      Een beheerder zorgt dat museale cultuurgoederen van de Staat zich bevinden in voor de desbetreffende
      cultuurgoederen passende bewaaromstandigheden.
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel2.1
  - number: 2.2.1
    text: |-
      Een beheerder registreert museale cultuurgoederen van de Staat op zodanige wijze dat uit de registratie
      van de beheerder de actuele juridische status, standplaats en staat van de cultuurgoederen blijkt en dat de
      cultuurgoederen kunnen worden geïdentificeerd.
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel2.2
  - number: 2.2.2
    text: |-
      Een beheerder registreert museale cultuurgoederen van de Staat op zodanige wijze dat de registraties aangesloten
      zijn op het geautomatiseerde systeem van de minister voor registraties van museale cultuurgoederen van de Staat.
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel2.2
  - number: 2.2.3
    text: 'Voor zover een beheerder nog niet alle registraties heeft geautomatiseerd, zorgt de beheerder dat:'
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel2.2
  - number: 2.2.3.a
    text: mutaties in de registratie overeenkomstig het tweede lid plaatsvinden; en
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel2.2
  - number: 2.2.3.b
    text: op planmatige wijze volledige automatisering en aansluiting op het systeem van de minister wordt gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel2.2
  - number: 2.2.4
    text: |-
      Een beheerder bewaart de administratie van de museale cultuurgoederen van de Staat op zodanige wijze dat de
      administratie duurzaam toegankelijk is.
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel2.2
  - number: 2.3.1
    text: |-
      Een beheerder houdt de schade aan een museaal cultuurgoed van de Staat in zijn administratie bij en meldt schade
      onverwijld aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel2.3
  - number: 2.3.2
    text: |-
      De minister wie het aangaat of een college van staat doet een museaal cultuurgoed van de Staat alleen restaureren
      na overleg met de minister.
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel2.3
  - number: 2.3.3
    text: De minister kan een beheerder aanwijzingen geven over de restauratie van een museaal cultuurgoed van de Staat.
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel2.3
  - number: 2.4.1
    text: |-
      De minister stelt desgevraagd of uit eigen beweging vast of een roerende zaak waarvan de Staat eigenaar is of
      waarvan het beheer door een derde aan de Staat is toevertrouwd een museaal cultuurgoed van de Staat is.
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel2.4
  - number: 2.4.2
    text: |-
      De minister adviseert desgevraagd of uit eigen beweging over het beheer van museale cultuurgoederen van de Staat,
      zowel in algemene zin als ten aanzien van een specifiek museaal cultuurgoed.
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel2.4
  - number: 2.5.1
    text: |-
      De minister wie het aangaat of een college van staat beheert de museale cultuurgoederen van de Staat op zodanige
      wijze dat het risico van schade aan derden of van aansprakelijkstelling van de Staat door derden zo klein mogelijk
      wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel2.5
  - number: 2.5.2
    text: |-
      De minister wie het aangaat of een college van staat inventariseert het risico dat met de museale cultuurgoederen
      van de Staat aanzienlijke schade aan derden kan worden toegebracht of dat het beheer van die cultuurgoederen
      aanleiding kan zijn tot aansprakelijkstelling van de Staat door derden met aanzienlijke financiële gevolgen.
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel2.5
  - number: 2.5.3
    text: |-
      Aan de hand van de schatting van de kans dat de risico’s, bedoeld in het eerste en tweede lid, zich zullen
      voordoen, besluit de minister wie het aangaat of het college van staat over maatregelen ter voorkoming of beperking
      van deze risico’s, dan wel tot herstel van de schade of de opvang van de gevolgen van aansprakelijkstelling.
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel2.5
  - number: 2.5.4
    text: |-
      De minister wie het aangaat of een college van staat zorgt voor het administreren van gegevens over gevallen van
      schade of aansprakelijkstelling die verband houden met het beheer van museale cultuurgoederen van de Staat.
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel2.5
  - number: 2.5.5
    text: De gegevens, bedoeld in het vierde lid, worden desgevraagd aan de minister overgelegd.
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel2.5
  - number: 2.6.1
    text: |-
      De minister wie het aangaat of een college van staat verzekert de risico’s van schade voor of aansprakelijkheid van
      de Staat, bedoeld in [artikel 2.5, eerste en tweede lid][ref1], om redenen van doelmatigheid in het algemeen niet.


      [ref1]: https://wetten.overheid.nl/BWBR0037533#Artikel2
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0037533
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.6.2
    text: |-
      Een besluit tot verzekeren van risico als bedoeld in het eerste lid, wordt genomen in overeenstemming met de
      Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel2.6
  - number: 2.6.3
    text: |-
      Na overleg tussen de minister wie het aangaat of een college van staat en de Minister van Financiën kan worden
      besloten dat de afwikkeling van een schade of een aansprakelijkheid namens de Staat gebeurt door de Minister van
      Financiën.
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel2.6
  - number: '2.7'
    text: |-
      Een instelling met een wettelijke taak baseert het planmatig beleid voor het beheer van de cultuurgoederen of
      verzamelingen op een actuele analyse van de stand van het beheer en beschrijft in het beleid ten minste:
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel2.7
  - number: 2.7.a
    text: de te bereiken doelen op in ieder geval de gebieden behoud van de cultuurgoederen en veiligheidszorg; en
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel2.7
  - number: 2.7.b
    text: de wijze waarop het beleid wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel2.7
  - number: '3.1'
    text: |-
      Deze paragraaf is uitsluitend van toepassing op subsidies die de minister verstrekt op grond van
      [artikel 7.2 van de Erfgoedwet][ref1].


