  - number: '3.18'
    text: |-
      Indien de subsidie na uitvoering van de activiteiten zoals opgenomen in de begroting voor het desbetreffende jaar
      niet volledig is aangewend, dan kan de instelling de resterende middelen besteden ten behoeve van de taak waarmee
      zij op grond van [artikel 2.8 van de Erfgoedwet][ref1] is belast.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel2
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.18
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '2'
  - number: 3.19.1
    text: |-
      Een instelling met een wettelijke taak verleent haar medewerking aan een eenmaal per vier jaar te houden visitatie,
      die ten doel heeft de wijze waarop die instelling haar taken en publieksactiviteiten verricht te beoordelen.
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.19
  - number: 3.19.2
    text: De minister kan nadere eisen stellen aan de visitatie, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.19
  - number: 4.1.1
    text: |-
      De Minister verstrekt de subsidie, bedoeld in [artikel 3.2, eerste lid][ref1], voor het eerst voor het kalenderjaar
      2026 aan de Stichting Panorama Mesdag.


      [ref1]: https://wetten.overheid.nl/BWBR0037533#Artikel3
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel4.1
    references:
