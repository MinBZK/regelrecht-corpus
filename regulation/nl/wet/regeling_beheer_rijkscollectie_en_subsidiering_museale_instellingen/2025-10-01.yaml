  - number: '3.14'
    text: |-
      1 De minister verleent voor 1 oktober 2024 ambtshalve subsidie voor publieksactiviteiten en andere activiteiten
      – niet behorende tot beheer van de collectie in de zin van de [Erfgoedwet][ref1] – aan instellingen met een
      wettelijke taak, die als kernactiviteit het beheer van een collectie van cultureel erfgoed hebben.

      2 De minister verleent voor 1 oktober 2024 tevens ambtshalve:

      a. subsidie aan ten hoogste één instelling met een wettelijke taak, die als kernactiviteit heeft het beheren van
      een collectie van cultureel erfgoed op het gebied van kunsthistorische documentatie, voor het uitvoeren van een
      activiteitenprogramma als ondersteunende instelling;

      b. een aanvullend bedrag aan ten hoogste één instelling met een wettelijke taak, voor:

      1°. het bevorderen van de bescherming en kennis van immaterieel erfgoed; en

      2°. het onderhouden van de Canon van Nederland;

      c. een aanvullend bedrag aan ten hoogste één instelling met een wettelijke taak, voor publieksactiviteiten in
      relatie tot de Leidse Siebold-collectie; en

      d. een aanvullend bedrag aan ten hoogste één instelling met een wettelijke taak, voor activiteiten ter bevordering
      van een netwerk van museumconservatoren van Nederlandse en Vlaamse kunst.


