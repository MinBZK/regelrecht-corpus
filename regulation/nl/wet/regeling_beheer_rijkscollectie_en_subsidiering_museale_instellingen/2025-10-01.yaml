  - number: '3.3'
    text: |-
      1 De minister kan de subsidie verhogen:

      a. rekening houdend met de ontwikkeling van de kosten in de arbeidsvoorwaarden of van de kosten in de ontwikkeling
      van het prijspeil voorafgaand aan of tijdens het jaar waarop de subsidieverlening betrekking heeft; of

      b. voor zover sprake is van aanvullende activiteiten die wijziging van de subsidie naar het oordeel van de minister
      rechtvaardigen.

      2 Indien de subsidie wordt gewijzigd, rekening houdend met de ontwikkeling van de kosten in de arbeidsvoorwaarden
      of de kosten van het prijspeil, bepaalt de minister welk percentage van de subsidie wordt aangemerkt als
      loongevoelig onderscheidenlijk prijsgevoelig.
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel3.3
  - number: '3.4'
    text: |-
      1 [Artikel 2.11, eerste tot en met vierde lid, van de Regeling op het specifiek cultuurbeleid][ref1] is van
      overeenkomstige toepassing.

      2 Indien de subsidie op grond van [artikel 3.3, eerste lid][ref2], wordt gewijzigd, wordt de bevoorschotting
      overeenkomstig aangepast.


