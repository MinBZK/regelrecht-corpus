articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *beheerder:* minister wie het aangaat, college van staat of instelling die museale cultuurgoederen van de Staat
      beheert;
        - *instelling met een wettelijke taak:* instelling die op grond van [artikel 2.8 van de Erfgoedwet][ref1] belast is
      met het beheer van museale cultuurgoederen van de Staat of andere cultuurgoederen;
        - *minister:* Minister van Onderwijs, Cultuur en Wetenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel2.8
    url: https://wetten.overheid.nl/BWBR0037533/2025-10-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '2.8'
  - number: '1.2'
    text: |-
      Deze regeling berust mede op [artikel 4a van de Wet op het specifiek cultuurbeleid][ref1] en de [artikelen 3][ref2]
      en [4 van het Besluit op het specifiek cultuurbeleid.][ref3]


      [ref1]: https://wetten.overheid.nl/BWBR0005904#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0027600#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0027600#Artikel4
