  - number: '3.5'
    text: |-
      1 Een instelling met een wettelijke taak dient jaarlijks uiterlijk op 1 november de volgende documenten in bij
      de minister:

      a. een begroting; en

      b. voor zover van toepassing, een onderhouds- en investeringsplan als bedoeld in [artikel 3.7][ref1].

      2 De begroting behelst een overzicht van de voor het kalenderjaar geraamde baten en lasten van de aanvrager, voor
      zover deze betrekking hebben op de wettelijke taak waarmee de instelling is belast, en sluit aan op het door de
      minister verleende subsidiebedrag.

      3 De begroting bevat een postgewijze toelichting.

      4 De [artikelen 2.5, vierde lid][ref2], [2.6][ref3] en [2.7 van de Regeling op het specifiek cultuurbeleid][ref4]
      zijn van overeenkomstige toepassing.

      5 Indiening van een onderhouds- en investeringsplan als bedoeld in [artikel 3.7][ref5] kan achterwege blijven,
      indien de instelling met een wettelijke taak er redelijkerwijs van uit kan gaan dat de minister al over de meest
      recente versie van het plan beschikt.

      6 Indien uitvoering van wettelijke taak aan de hand van de ingediende documenten, bedoeld in het eerste lid, naar
      het oordeel van de minister bezwaarlijk is, kan hij de subsidieontvanger aanwijzingen geven tot wijziging van die
      documenten.


