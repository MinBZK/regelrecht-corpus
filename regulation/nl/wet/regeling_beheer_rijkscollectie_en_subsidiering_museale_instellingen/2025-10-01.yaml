  - number: '3.15'
    text: |-
      1 De subsidieontvanger dient uiterlijk op 1 november 2024 een activiteitenplan en een begroting in.

      2 De begroting sluit aan op het door de minister verleende subsidiebedrag.

      3 In het activiteitenplan verklaart de subsidieontvanger dat hij:

      a. de navolgende codes onderschrijft:

      1°. Fair Practice Code;

      2°. Governance Code Cultuur;

      3°. Code Diversiteit en Inclusie; en

      b. zich met ingang van 1 januari 2025 zal aansluiten bij de bestaande collectieve afspraken over honorering binnen
      zijn sector; en

      c. aansluit bij de sociale dialoog tussen werkgevers of opdrachtgevers en werknemers of opdrachtnemers.

      4 De [artikelen 2.4][ref1] en [2.5 van de Regeling op het specifiek cultuurbeleid][ref2] zijn van overeenkomstige
      toepassing.

      5 Indien uitvoering van de gesubsidieerde activiteiten aan de hand van de ingediende documenten, bedoeld in het
      eerste lid, naar het oordeel van de minister bezwaarlijk is, kan hij de subsidieontvanger aanwijzingen geven tot
      wijziging van die documenten.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel2.4
