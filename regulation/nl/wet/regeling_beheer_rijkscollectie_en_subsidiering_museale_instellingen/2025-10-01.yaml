  - number: '4.1'
    text: |-
      1 De Minister verstrekt de subsidie, bedoeld in [artikel 3.2, eerste lid][ref1], voor het eerst voor het
      kalenderjaar 2026 aan de Stichting Panorama Mesdag.

      2 In afwijking van [artikel 3.2, eerste lid][ref2], verstrekt de Minister de subsidie aan de Stichting Panorama
      Mesdag ten behoeve van het kalenderjaar 2026 vóór 1 november 2025.

      3 In afwijking van [artikel 3.5, eerste lid][ref3], dient Stichting Panorama Mesdag voor het kalenderjaar 2026
      uiterlijk op 1 december 2025 de volgende documenten in bij de Minister:

      a. een begroting; en

      b. een onderhouds- en investeringsplan als bedoeld in [artikel 3.7][ref4].


