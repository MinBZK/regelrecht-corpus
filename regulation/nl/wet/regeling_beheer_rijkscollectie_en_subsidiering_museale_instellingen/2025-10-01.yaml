        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 4.1.3
    text: |-
      In afwijking van [artikel 3.5, eerste lid][ref1], dient Stichting Panorama Mesdag voor het kalenderjaar 2026
      uiterlijk op 1 december 2025 de volgende documenten in bij de Minister:


