articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *beheerder:* minister wie het aangaat, college van staat of instelling die museale cultuurgoederen van de Staat
      beheert;
        - *instelling met een wettelijke taak:* instelling die op grond van [artikel 2.8 van de Erfgoedwet][ref1] belast is
      met het beheer van museale cultuurgoederen van de Staat of andere cultuurgoederen;
        - *minister:* Minister van Onderwijs, Cultuur en Wetenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel2.8
    url: https://wetten.overheid.nl/BWBR0037533/2017-09-13#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '2.8'
  - number: '2.1'
    text: |-
      Een beheerder zorgt dat museale cultuurgoederen van de Staat zich bevinden in voor de desbetreffende
      cultuurgoederen passende bewaaromstandigheden.
    url: https://wetten.overheid.nl/BWBR0037533/2017-09-13#Artikel2.1
  - number: '2.2'
    text: |-
      1 Een beheerder registreert museale cultuurgoederen van de Staat op zodanige wijze dat uit de registratie
      van de beheerder de actuele juridische status, standplaats en staat van de cultuurgoederen blijkt en dat de
      cultuurgoederen kunnen worden geïdentificeerd.

      2 Een beheerder registreert museale cultuurgoederen van de Staat op zodanige wijze dat de registraties aangesloten
      zijn op het geautomatiseerde systeem van de minister voor registraties van museale cultuurgoederen van de Staat.

      3 Voor zover een beheerder nog niet alle registraties heeft geautomatiseerd, zorgt de beheerder dat:

      a. mutaties in de registratie overeenkomstig het tweede lid plaatsvinden; en

      b. op planmatige wijze volledige automatisering en aansluiting op het systeem van de minister wordt gerealiseerd.

      4 Een beheerder bewaart de administratie van de museale cultuurgoederen van de Staat op zodanige wijze dat de
      administratie duurzaam toegankelijk is.
    url: https://wetten.overheid.nl/BWBR0037533/2017-09-13#Artikel2.2
  - number: '2.3'
    text: |-
      1 Een beheerder houdt de schade aan een museaal cultuurgoed van de Staat in zijn administratie bij en meldt schade
      onverwijld aan de inspecteur.

      2 De minister wie het aangaat of een college van staat doet een museaal cultuurgoed van de Staat alleen restaureren
      na overleg met de minister.

      3 De minister kan een beheerder aanwijzingen geven over de restauratie van een museaal cultuurgoed van de Staat.
    url: https://wetten.overheid.nl/BWBR0037533/2017-09-13#Artikel2.3
  - number: '2.4'
    text: |-
      1 De minister stelt desgevraagd of uit eigen beweging vast of een roerende zaak waarvan de Staat eigenaar is of
      waarvan het beheer door een derde aan de Staat is toevertrouwd een museaal cultuurgoed van de Staat is.

      2 De minister adviseert desgevraagd of uit eigen beweging over het beheer van museale cultuurgoederen van de Staat,
      zowel in algemene zin als ten aanzien van een specifiek museaal cultuurgoed.
    url: https://wetten.overheid.nl/BWBR0037533/2017-09-13#Artikel2.4
  - number: '2.5'
    text: |-
      1 De minister wie het aangaat of een college van staat beheert de museale cultuurgoederen van de Staat op zodanige
      wijze dat het risico van schade aan derden of van aansprakelijkstelling van de Staat door derden zo klein mogelijk
      wordt gehouden.

      2 De minister wie het aangaat of een college van staat inventariseert het risico dat met de museale cultuurgoederen
      van de Staat aanzienlijke schade aan derden kan worden toegebracht of dat het beheer van die cultuurgoederen
      aanleiding kan zijn tot aansprakelijkstelling van de Staat door derden met aanzienlijke financiële gevolgen.

      3 Aan de hand van de schatting van de kans dat de risico’s, bedoeld in het eerste en tweede lid, zich zullen
      voordoen, besluit de minister wie het aangaat of het college van staat over maatregelen ter voorkoming of beperking
      van deze risico’s, dan wel tot herstel van de schade of de opvang van de gevolgen van aansprakelijkstelling.

      4 De minister wie het aangaat of een college van staat zorgt voor het administreren van gegevens over gevallen van
      schade of aansprakelijkstelling die verband houden met het beheer van museale cultuurgoederen van de Staat.

      5 De gegevens, bedoeld in het vierde lid, worden desgevraagd aan de minister overgelegd.
    url: https://wetten.overheid.nl/BWBR0037533/2017-09-13#Artikel2.5
  - number: '2.6'
    text: |-
      1 De minister wie het aangaat of een college van staat verzekert de risico’s van schade voor of aansprakelijkheid
      van de Staat, bedoeld in [artikel 2.5, eerste en tweede lid][ref1], om redenen van doelmatigheid in het algemeen
      niet.

      2 Een besluit tot verzekeren van risico als bedoeld in het eerste lid, wordt genomen in overeenstemming met de
      Minister van Financiën.

      3 Na overleg tussen de minister wie het aangaat of een college van staat en de Minister van Financiën kan worden
      besloten dat de afwikkeling van een schade of een aansprakelijkheid namens de Staat gebeurt door de Minister van
      Financiën.


      [ref1]: https://wetten.overheid.nl/BWBR0037533#Artikel2.5
    url: https://wetten.overheid.nl/BWBR0037533/2017-09-13#Artikel2.6
