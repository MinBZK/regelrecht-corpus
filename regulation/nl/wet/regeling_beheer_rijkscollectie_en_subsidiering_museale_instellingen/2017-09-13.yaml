  - number: 3.4a
    text: |-
      1 Aan de bedragen van de subsidies die worden verleend op grond van dit hoofdstuk kan, al dan niet in afwijking
      van de desbetreffende subsidieplafonds, een bedrag worden toegevoegd, rekening houdend met de ontwikkeling van het
      prijspeil en met de ontwikkeling van de kosten in de arbeidsvoorwaarden voorafgaand aan en tijdens het jaar waarop
      de subsidieverlening betrekking heeft.

      2 Bij toepassing van het eerste lid bepaalt de minister welk deel van de subsidie hij in aanmerking neemt voor
      bijstelling in verband met de ontwikkeling van de kosten in de arbeidsvoorwaarden en welk deel van de subsidie hij
      in aanmerking neemt voor bijstelling in verband met de ontwikkeling van het prijspeil.
    url: https://wetten.overheid.nl/BWBR0037533/2017-09-13#Artikel3.4a
