  - number: '3.8'
    text: |-
      Een instelling met een wettelijke taak baseert het planmatig beleid voor het beheer van de cultuurgoederen of
      verzamelingen op een actuele analyse van de stand van het beheer en beschrijft in het beleid tenminste:

      a. de te bereiken doelen op in ieder geval de gebieden behoud van de cultuurgoederen en veiligheidszorg; en

      b. de wijze waarop het beleid wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0037533/2017-09-13#Artikel3.8
  - number: '3.9'
    text: |-
      1 De volgende instellingen met een wettelijke taak beschikken voor gebouwen waarin cultuurgoederen worden beheerd
      waar de taak op ziet, over een actueel meerjarig onderhouds- en investeringsplan:

      a. instellingen die eigenaar zijn van die gebouwen; en

      b. instellingen die met het Rijksvastgoedbedrijf een huurovereenkomst hebben gesloten over die gebouwen en waarbij
      overeengekomen is dat de instelling verantwoordelijk is voor de instandhouding van de gebouwen.

      2 Een instelling als bedoeld in het eerste lid dient telkens na vier jaar een actueel onafhankelijk bouwkundig
      inspectierapport van de gebouwen in. De eerste indiening vindt plaats voor 1 januari 2020.
    url: https://wetten.overheid.nl/BWBR0037533/2017-09-13#Artikel3.9
  - number: '3.10'
    text: |-
      1 Indien aan de instelling met een wettelijke taak voor dezelfde periode tevens een vierjaarlijkse
      instellingssubsidie als bedoeld in de [Regeling op het specifiek cultuurbeleid][ref1] is verleend,
      verantwoordt de instelling de subsidie in de aanvraag tot vaststelling van de vierjaarlijkse
      instellingssubsidie onderscheidenlijk in de periodieke verantwoording van die subsidie, bedoeld in
      [artikel 2.15 van de Regeling op het specifiek cultuurbeleid][ref2].

      2 Indien aan de instelling met een wettelijke taak geen vierjaarlijkse instellingssubsidie in dezelfde periode is
      verleend, dient de instelling tussen acht en dertien weken na afloop van enig kalenderjaar over dat kalenderjaar
      een aanvraag tot vaststelling van de subsidie in.

      3 Aanvragen die worden ingediend voorafgaand aan de termijn, bedoeld in het tweede lid, worden geacht ontvangen te
      zijn op de eerste dag van die termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0027597
      [ref2]: https://wetten.overheid.nl/BWBR0027597#Artikel2.15
    url: https://wetten.overheid.nl/BWBR0037533/2017-09-13#Artikel3.10
