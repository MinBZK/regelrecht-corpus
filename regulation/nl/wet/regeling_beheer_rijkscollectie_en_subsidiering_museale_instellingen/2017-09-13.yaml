  - number: '3.1'
    text: |-
      Een instelling met een wettelijke taak dient jaarlijks uiterlijk op 30 juni een aanvraag voor subsidie voor de
      uitvoering in het daarop volgende jaar in.
    url: https://wetten.overheid.nl/BWBR0037533/2017-09-13#Artikel3.1
  - number: '3.2'
    text: |-
      1 Een aanvraag voor subsidie gaat vergezeld van een begroting en voor zover van toepassing een onderhouds- en
      investeringsplan als bedoeld in [artikel 3.9][ref1].

      2 De begroting behelst een overzicht van de voor het kalenderjaar geraamde baten en lasten van de aanvrager, voor
      zover deze betrekking hebben op de wettelijke taak waarmee de instelling is belast.

      3 De begroting bevat een postgewijze toelichting.

      4 De [artikelen 2.6][ref2] en [2.7 van de Regeling op het specifiek cultuurbeleid][ref3] zijn van overeenkomstige
      toepassing.

      5 Een onderhouds- en investeringsplan gaat niet bij de aanvraag indien de instelling met een wettelijke taak er
      redelijkerwijs vanuit kan gaan dat de minister al over de meest recente versie van het plan beschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0037533#Artikel3.9
      [ref2]: https://wetten.overheid.nl/BWBR0027597#Artikel2.6
      [ref3]: https://wetten.overheid.nl/BWBR0027597#Artikel2.7
