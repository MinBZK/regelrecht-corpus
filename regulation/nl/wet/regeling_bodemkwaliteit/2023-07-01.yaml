  - number: 4.2.3
    text: |-
      1 In afwijking van [artikel 4.2.2, eerste lid][ref1], kan de gemeenteraad of Onze Minister van
      Verkeer en Waterstaat of het algemeen bestuur van het waterschapop grond van respectievelijk de
      [artikelen 44, eerste lid][ref2] en [45, eerste lid, van het besluit][ref3], een bodembeheergebied indelen in
      bodemkwaliteitszones en daarvoor per stof een kengetal vaststellen om te bepalen of de kwaliteit van de grond of
      baggerspecie de lokale maximale waarden, bedoeld in de [artikelen 44, eerste lid][ref4], en [45, eerste lid][ref5],
      overschrijdt.

      2 Het kengetal, bedoeld in het vorige lid, is voor alle onderzochte stoffen gelijk aan of hoger dan het rekenkundig
      gemiddelde gehalte van de stof in de bodemkwaliteitszone.

      3 De kwaliteit van grond of baggerspecie overschrijdt de lokale maximale waarden, bedoeld in
      [artikel 4.2.1, eerste lid, onder d][ref6], indien voor een of meer van de gemeten stoffen het kengetal in de
      bodemkwaliteitszone waarvan de grond of baggerspecie afkomstig is, hoger is dan de lokale maximale waarden.

      4 De kwaliteit van grond of baggerspecie overschrijdt de lokale maximale waarden, bedoeld in
      [artikel 4.2.1, tweede lid onder d][ref7], indien voor een of meer van de gemeten stoffen het kengetal in de
      bodemkwaliteitszone waarvan de grond of baggerspecie afkomstig is, hoger is dan de lokale maximale waarden.


