  - number: 4.2.2
    text: |-
      1 De kwaliteit van grond of baggerspecie overschrijdt de waarden, bedoeld in
      [artikel 4.2.1, eerste lid, onder b, tweede lid, onder b, c en d en derde lid, onder b][ref1], indien voor een of
      meer van de gemeten stoffen het rekenkundig gemiddelde gehalte hoger is dan deze waarden.

      2 De kwaliteit van baggerspecie overschrijdt de maximale waarden voor het verspreiden van baggerspecie in een zout
      oppervlaktewaterlichaam, indien voor een of meer van de gemeten stoffen het rekenkundig gemiddelde gehalte hoger is
      dan deze waarden.

      3 De kwaliteit van baggerspecie overschrijdt de waarden, bedoel in [artikel 4.2.1, derde lid, onder a][ref2],
      indien :

      a. het rekenkundige gemiddelde van de gehalten in de baggerspecie voor een of meer stoffen, waarvoor maximale
      waarden gelden voor het verspreiden van baggerspecie op het aangrenzende perceel, hoger is dan deze waarden;

      b. het rekenkundig gemiddelde voor organische stoffen die deel uitmaken van het stoffenpakket dat wordt ingevoerd
      voor de berekening van de msPAF de msPAF 20% of hoger is, of indien het rekenkundig gemiddelde voor metalen de
      msPAF 50% of hoger is;

      c. voor stoffen, niet zijnde stoffen bedoeld onder a of b, de kwaliteit van de baggerspecie de achtergrondwaarden
      overschrijdt, met inachtneming van de toetsingsregel, bedoeld in het vierde en vijfde lid.

      4 De kwaliteit van grond of baggerspecie overschrijdt niet de achtergrondwaarden, bedoeld in [bijlage B][ref3],
      indien ten opzichte van de achtergrondwaarden:

      a. bij meting van ten minste 2 stoffen waarvoor een waarde is opgenomen in de tabellen 1 en 2 van
      [bijlage B][ref4], het rekenkundig gemiddelde gehalte van maximaal 1 stof verhoogd is;

      b. bij meting van ten minste 7 stoffen waarvoor een waarde is opgenomen in de tabellen 1 en 2 van
      [bijlage B][ref5], de rekenkundig gemiddelde gehalten van maximaal 2 stoffen verhoogd zijn;

      c. bij meting van ten minste 16 stoffen waarvoor een waarde is opgenomen in de tabellen 1 en 2 van
      [bijlage B][ref6], de rekenkundig gemiddelde gehalten van maximaal 3 stoffen verhoogd zijn;

      d. bij meting van ten minste 27 stoffen waarvoor een waarde is opgenomen in de tabellen 1 en 2 van
      [bijlage B][ref7], de rekenkundig gemiddelde gehalten van maximaal 4 stoffen verhoogd zijn;

      e. bij meting van ten minste 37 stoffen waarvoor een waarde is opgenomen in de tabellen 1 en 2

      van [bijlage B][ref8], de rekenkundig gemiddelde gehalten van maximaal 5 stoffen verhoogd zijn.

      5 Een verhoging als bedoeld in het vierde lid bedraagt per stof ten hoogste twee maal de daarvoor geldende
      achtergrondwaarde en overschrijdt niet de daarvoor geldende maximale waarden voor de bodemkwaliteitsklasse wonen.

      6 De grond of baggerspecie overschrijdt de maximale waarden voor de emissie, bedoeld in tabel 1 en 2 van
      [bijlage B][ref9], indien voor één of meer stoffen de gemeten emissie van een representatief deelmonster hoger is
      dan de desbetreffende maximale waarden.

      7 Bij het vaststellen van een overschrijding van de waarden, bedoeld in dit artikel, worden de regels in
      [bijlage G][ref10], onder IV toegepast.

      8 In afwijking van het vijfde lid vindt voor de stof nikkel (Ni) geen toetsing plaats aan de maximale waarden voor
      de bodemkwaliteitsklasse wonen.


