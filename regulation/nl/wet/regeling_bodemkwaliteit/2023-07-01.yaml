  - number: 3.8.3
    text: |-
      1 De toezichthouder kan een producent binnen een bepaalde termijn opnieuw een toelatingsonderzoek of een specifiek
      onderdeel daarvan laten uitvoeren, indien blijkt dat niet is

      voldaan aan [artikel 3.5.1][ref1] of [artikel 3.5.2, derde lid, onder a][ref2].

      2 Op last van de toezichthouder worden bij een toelatingsonderzoek als bedoeld in het eerste lid nieuwe
      partijkeuringen uitgevoerd.

      3 Indien alleen een specifiek onderdeel van het toelatingsonderzoek opnieuw wordt uitgevoerd, kan de toezichthouder
      kiezen om hierbij geen certificeringsinstelling in te schakelen.

      4 Het eerste lid geldt niet, indien de producent afziet van het gebruik van de desbetreffende fabrikant-
      eigenverklaring en dit binnen vijf dagen aan Onze Minister meldt.


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel3.5.1
      [ref2]: https://wetten.overheid.nl/BWBR0023085#Artikel3.5.2
