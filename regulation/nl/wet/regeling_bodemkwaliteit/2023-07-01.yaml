  - number: 3.6.2
    text: |-
      1 Bij het toelatingsonderzoek, bedoeld in [artikel 3.6.1][ref1], wordt de k-waarde voor elke parameter in
      [bijlage A][ref2] over vijf of tien partijen berekend, zoals aangegeven in [bijlage H][ref3].

      2 Bij de productiecontrole op de gecertificeerde bouwstof wordt ten minste een keuringsfrequentie van een parameter
      gehanteerd, die behoort bij de hiervoor berekende k-waarde, zoals aangegeven in [bijlage H][ref4].

      3 Na iedere verificatiekeuring wordt de keuringsfrequentie opnieuw berekend op basis van het voortschrijdende
      gemiddelde. Hierbij geldt dat voor de berekening:

      a. de oudste keuringsgegevens vervallen, en

      b. de nieuwste keuringsgegevens worden toegevoegd.

      4 Voor de berekening van de k-waarde worden de regels in [bijlage G][ref5], onder IV, toegepast.

      5 In afwijking van het eerste en tweede lid, mag voor een parameter de berekening van de k-waarde achterwege
      blijven en worden uitgaan van een gegeven keuringsfrequentie, indien alle vijf of tien meetwaarden van de
      desbetreffende parameter:

      a. conform de regels in [bijlage G][ref6], onder IV, onder de bepalingsgrens liggen, waarbij de keuringsfrequentie
      gelijk mag worden gesteld aan eenmaal per vijf jaar, of

      b. onder γ maal de betreffende maximale samenstellings- of emissiewaarde liggen, waarbij de keuringsfrequentie mag
      worden gebruikt zoals gegeven in [bijlage H][ref7].

      6 In afwijking van het derde lid mag bij structurele verbetering van de samenstellings- of emissiewaarde van een
      parameter als bedoeld in [bijlage A][ref8], daaronder mede begrepen het gebruik van een betere analysemethode,
      tijdelijk worden afgeweken van de spreiding in meetwaarden van de desbetreffende parameter. Hierbij geldt dat:

      a. het nieuwe voortschrijdend gemiddelde wordt getoetst met behoud van de oude spreiding in meetwaarden;

      b. de nieuwe spreiding in meetwaarden wordt bepaald wanneer vijf nieuwe keuringen zijn uitgevoerd, en

      c. toestemming nodig is van de certificeringsinstelling.

      7 Indien de keuringsfrequentie van een parameter uitkomt in het partijkeuringsregime, bedoeld in
      [bijlage H][ref9], worden individuele partijen bij overschrijding van de maximale waarden, bedoeld in
      [artikel 3.3.3, eerste lid][ref10], afgekeurd.

      8 Een parameter gaat van het partijkeuringsregime over naar het steekproefregime, indien:

      a. de berekende k-waarde hoog genoeg is, en

      b. deze k-waarde is bepaald aan de hand van tien keuringen, waarvan ten minste vijf zijn uitgevoerd onder het
      partijkeuringsregime.

      9 In afwijking van het eerste en tweede lid mag voor een parameter een keuringsfrequentie worden bepaald op basis
      van de verdelingsvrije toets, zoals beschreven in [bijlage H][ref11].

      10 Voor asbest wordt geen k-waarde bepaald of verdelingsvrije toets uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel3.6.1
      [ref2]: https://wetten.overheid.nl/BWBR0023085
