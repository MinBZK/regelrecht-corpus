  - number: 3.9.3
    text: |-
      1 Het ontwerppeil van het grondwater wordt vastgesteld op het niveau van het maaiveld.

      2 Indien de IBC-bouwstof wordt toegepast in een gebied, dat wordt gekenmerkt door grondwatertrap VII of hoger, kan
      in afwijking van het eerste lid het ontwerppeil van het grondwater worden vastgesteld door:

      a. de grondwaterstand te bepalen ten opzichte van Normaal Amsterdams Peil in de dichtstbijzijnde peilbuis van een
      landelijk meetnet die in 99% van de waarnemingen wordt onderschreden;

      b. een representatief aantal peilbuizen te plaatsen op de toepassingslocatie en gedurende ten minste drie maanden
      de grondwaterstand te meten ten opzichte van NAP op of rond de 14e en 28e dag van de maand, en

      c. de grondwaterstand, bedoeld onder a, te vermeerderen met het verschil tussen de gemiddelde grondwaterstand op de
      toepassingslocatie en die , bedoeld onder a, tenzij het verschil negatief is.

      3 Indien de grondwaterstand op de toepassingslocatie voor de duur van het werk wordt gekenmerkt door een
      aantoonbaar beheerst regime van een oppervlaktewaterlichaam, wordt het daarbij horende grondwaterpeil,
      vermeerderd met een zekerheidsmarge van 0,20 meter, aangehouden als het ontwerppeil van het grondwater. Het op de
      toepassingslocatie te verwachten grondwaterpeil wordt onderbouwd door middel van een grondwatermodellering.

      4 Bij de vaststelling, bedoeld in het eerste, tweede of derde lid, wordt rekening gehouden met mogelijk optredende
      wateroverlast die is gebaseerd op de kans dat deze zich eenmaal in de maximaal honderd jaar voordoet, gelet op de
      verwachte klimaatontwikkeling tot vijftig jaar na afronding van het werk.

      5 De onderzijde van de IBC-bouwstof wordt op een zodanige wijze aangelegd, dat deze na de eindzetting, bedoeld in
      [artikel 3.9.1, tweede lid][ref1], ten minste 0,50 meter boven het ontwerppeil van het grondwater ligt en er geen
      contact is met het grondwater als gevolg van capillaire opstijging uit het grondwater.


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel3.9.1
