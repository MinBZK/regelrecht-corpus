  - number: 5.1.9
    text: |-
      1 Tot en met 31 december 2006 geldt een vrijstelling van de verboden van [artikel 15 van het besluit][ref1] voor de
      werkzaamheden, bedoeld in [artikel 2.1, eerste lid, onder a en g][ref2].

      2 Tot en met 30 juni 2007 geldt een vrijstelling van de verboden van [artikel 15 van het besluit][ref3] voor de
      werkzaamheden, bedoeld in [artikel 2.1., eerste lid, onder d, e, h, k en l][ref4].

      3 Tot en met 30 juni 2007 geldt een vrijstelling van de verboden van [artikel 15 van het besluit][ref5]
      voor de werkzaamheid, bedoeld in [artikel 2.1, eerste lid, onder i][ref6], indien de persoon of instelling,
      die deze werkzaamheid verricht, beschikt over een geldige aanwijzing als monsternemer op grond van het
      [Bouwstoffenbesluit bodem- en oppervlaktewaterenbescherming][ref7], die vóór 1 oktober 2006 is verleend.

      4 Tot en met 30 juni 2009 geldt een vrijstelling van de verboden van [artikel 15, van het besluit][ref8]
      voor de werkzaamheid, bedoeld in [artikel 2.1, eerste lid, onder b][ref9], indien de instelling, die deze
      werkzaamheid verricht, beschikt over een geldige aanwijzing als certificeringsinstelling voor het afgeven van
      kwaliteitsverklaringen op grond van het [Bouwstoffenbesluit bodem- en oppervlaktewaterenbescherming][ref10].

      5 Tot en met 31 december 2007 geldt een vrijstelling van de verboden van [artikel 15 van het besluit][ref11]
      voor de werkzaamheid, bedoeld in [artikel 2.1, eerste lid, onder c][ref12], indien de persoon of instelling,
      die deze werkzaamheid verricht, beschikt over een geldige aanwijzing als laboratorium op grond van het
      [Bouwstoffenbesluit bodem- en oppervlaktewaterenbescherming][ref13], die vóór 1 oktober 2006 is verleend.

      6 [Artikel 12 van het Besluit][ref14] is niet van toepassing op de aanwijzingen, bedoeld in het derde, vierde en
      vijfde lid en de erkenning, bedoeld in het elfde lid.

      7 Tot en met 31 december 2007 geldt een vrijstelling van de verboden van [artikel 15 van het besluit][ref15] voor
      de werkzaamheden, bedoeld in [artikel 2.1, eerste lid, onder m en n][ref16].

      8 Tot en met 31 december 2007 geldt een vrijstelling van de verboden van [artikel 15 van het besluit][ref17]
      voor de werkzaamheid, bedoeld in [artikel 2.1, eerste lid, onder d][ref18], voor zover dat bestaat uit
      laboratoriumanalyses voor grondwateronderzoek.

      9 Tot en met 30 juni 2008 geldt een vrijstelling van de verboden van [artikel 15 van het besluit][ref19] voor
      de werkzaamheid, bedoeld in [artikel 2.1, eerste lid, onder h][ref20], voor zover dat bestaat uit milieukundige
      begeleiding van nazorg.

      10 Tot en met 31 december 2008 geldt een vrijstelling van de verboden van [artikel 15 van het besluit][ref21] voor
      de werkzaamheid, bedoeld in [artikel 2.1, eerste lid, onder e][ref22], voor zover dat bestaat uit het ontwateren
      van baggerspecie.

      11 Tot en met 30 september 2009 geldt een vrijstelling van de verboden van [artikel 15, van het besluit][ref23]
      voor de werkzaamheid, bedoeld in [artikel 2.1, eerste lid, onder j][ref24], indien de persoon of instelling, die
      deze werkzaamheid verricht, beschikt over een geldige erkenning voor een kwaliteitsverklaring op grond van het
      [Bouwstoffenbesluit bodem- en oppervlaktewaterenbescherming][ref25].

      12 Tot en met 31 december 2010 geldt een vrijstelling van de verboden van [artikel 15 van het besluit][ref26] voor
      de werkzaamheden, bedoeld in [artikel 2.1, eerste lid, onder l][ref27], voor zover dat bestaat uit mechanisch boren
      als bedoeld in BRL 2100.

      13 Tot zes maanden na afloop van de in het eerste en tweede lid en zevende tot en met tiende lid, genoemde data
      geldt een vrijstelling van de verboden van [artikel 15 van het besluit][ref28] voor de in die leden genoemde
      werkzaamheden, die zijn aangevangen op een tijdstip dat is gelegen vóór de in die leden genoemde data.

      14 Tot 1 januari 2015 geldt een vrijstelling van de verboden van [artikel 15 van het besluit][ref29] voor de
      werkzaamheden, bedoeld in [artikel 2.1, eerste lid, onder o tot en met q][ref30].

      15 Tot en met 30 juni 2011 geldt een vrijstelling van de verboden van [artikel 15 van het besluit][ref31] voor de
      werkzaamheid, bedoeld in [artikel 2.1, eerste lid, onder e][ref32], voor zover dat bestaat uit het droog zeven van
      asbesthoudende grond.

      16 Tot 1 oktober 2014 geldt een vrijstelling van de verboden van [artikel 15 van het besluit][ref33] voor de
      werkzaamheden, bedoeld in [artikel 2.1, eerste lid, onderdelen u en v][ref34].

      17 Tot 1 juli 2015 geldt voor de werkzaamheid, bedoeld in [artikel 2.1, eerste lid, onderdeel f][ref35], voor zover
      deze werkzaamheid de certificering van personen en instellingen betreft voor de werkzaamheid, bedoeld in artikel
      2.1, eerste lid, onderdeel s, een vrijstelling van het vereiste krachtens [artikel 2.2, eerste lid][ref36], dat
      een erkenning voor die werkzaamheid is gebaseerd op een accreditatie voor BRL SIKB 2100, versie 3.1, vastgesteld op
      12 december 2013, zoals vermeld bij [categorie 19 in bijlage C][ref37].

      18 Tot 1 januari 2016 geldt voor de werkzaamheid, bedoeld in [artikel 2.1, eerste lid, onderdeel f][ref38],
      voor zover deze werkzaamheid de certificering van personen en instellingen betreft voor de werkzaamheid,
      bedoeld in artikel 2.1, eerste lid, onderdelen e en r, een vrijstelling van het vereiste krachtens
      [artikel 2.2, eerste lid][ref39], dat een erkenning voor die werkzaamheid is gebaseerd op een accreditatie voor BRL
      SIKB 7500, versie 3.1, vastgesteld op 17 juni 2010, zoals vermeld bij de categorieën 5 en 18 in bijlage C.


