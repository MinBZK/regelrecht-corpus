  - number: 3.9.1
    text: |-
      1 Van het werk waarin een IBC-bouwstof wordt toegepast, wordt een ontwerp gemaakt dat bestaat uit:

      a. een beschrijving van de wijze waarop wordt voldaan aan de [artikelen 3.9.2 tot en met 3.9.4][ref1];

      b. een situatietekening, langs- en dwarsdoorsneden;

      c. een beschrijving van de wijze waarop wordt voldaan aan de aandachtspunten, onderdelen en criteria zoals
      aangegeven in het toepasselijke normdocument, bedoeld in [bijlage D][ref2], en

      d. een berekening van de zetting die optreedt bij het gereedkomen van het werk en na vijftig jaar.

      2 Het werk wordt ontworpen op de eindzetting die wordt berekend voor een periode van vijftig jaar, vermeerderd met
      een onzekerheidsmarge van 30% van de berekende zetting.

      3 De restzetting die optreedt na het gereedkomen van een werk dat met een IBC-bouwstof is gerealiseerd, is na
      vijftig jaar maximaal 0,5 meter.

      4 Een IBC-bouwstof wordt toegepast in aaneengesloten hoeveelheden van ten minste 10.000 m3.

      5 Het ontwerp, bedoeld in het eerste lid, wordt door de Advieskamer bodembescherming gekeurd volgens het
      toepasselijke normdocument in [bijlage D][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel3.9.2
      [ref2]: https://wetten.overheid.nl/BWBR0023085
      [ref3]: https://wetten.overheid.nl/BWBR0023085
