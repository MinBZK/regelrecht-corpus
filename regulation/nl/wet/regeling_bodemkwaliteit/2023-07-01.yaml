  - number: 5.1.10
    text: |-
      1 In afwijking van [artikel 3.3.3, eerste lid][ref1], geldt voor het hergebruik van bouwstoffen die voor de
      inwerkingtreding van het [besluit][ref2] reeds waren toegepast voor maximaal twee parameters een verhoogde maximale
      samenstellings- of emissiewaarde, mits de bouwstoffen zonder bewerking worden hergebruikt.

      2 Een verhoging als bedoeld in het eerste lid bedraagt ten hoogste tweemaal de gestelde maximale waarde, zoals
      opgenomen in [bijlage A][ref3].

      3 Het eerste en tweede lid zijn niet van toepassing op de maximale samenstellingswaarde voor PAK’s (som) in
      asfaltproducten en voor asbest.


