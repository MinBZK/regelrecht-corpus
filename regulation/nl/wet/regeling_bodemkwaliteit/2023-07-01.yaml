  - number: 4.14.1
    text: |-
      Bij toepassing van tarragrond gelden de achtergrondwaarden alsmede de maximale waarden voor de kwaliteitsklasse
      wonen en industrie niet voor de stoffen cresolen (som), fenol, tolueen en minerale olie, indien de aanwezigheid van
      die stoffen in de tarragrond een gevolg is van natuurlijke processen.
    url: https://wetten.overheid.nl/BWBR0023085/2023-07-01#Artikel4.14.1
  - number: 4.14.2
    text: |-
      1 Bij toepassing van tarragrond van aardappelen gelden de achtergrondwaarden en de maximale waarden
      voor de kwaliteitsklassen wonen en industrie niet voor de stof monochlooranilinen (som), opgenomen in
      [tabel 1 van bijlage B][ref1].

      2 Tarragrond van aardappelen die zijn behandeld met chloorprofam wordt uitsluitend toegepast op
      de bodem, uitgezonderd de bodem of oever van een oppervlaktewaterlichaam, boven het maaiveld,
      voor zover niet gelegen in een Natura 2000-gebied of in de ecologische hoofdstructuur, bedoeld in
      [artikel 2.10.1 van het Besluit algemene regels ruimtelijke ordening][ref2].

      3 De toegepaste tarragrond is schoon en onverdacht en bevat geen toevoegingen, met uitzondering van chloorprofam
      overeenkomstig de ingevolge de [Wet gewasbeschermingsmiddelen en biociden][ref3] toegestane dosering.


      [ref1]: https://wetten.overheid.nl/BWBR0023085
