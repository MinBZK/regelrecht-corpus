  - number: 4.3.1
    text: |-
      1 Na splitsing van een partij kan voor de deelpartijen gebruik worden gemaakt van de milieuhygiënische verklaring
      voor de oorspronkelijke partij, mits het volgende wordt vastgelegd in de administratie:

      a. de relatie tussen de deelpartij en de oorspronkelijke partij,

      b. de persoon of instelling welke de splitsing heeft uitgevoerd, en

      c. de datum waarop de splitsing is uitgevoerd.

      2 Na splitsing van een partij die niet voldoet aan de achtergrondwaarden, opgenomen in de
      [tabellen 1 en 2 in bijlage B][ref1], kan voor de deelpartijen gebruik worden gemaakt van de milieuhygiënische
      verklaring voor de oorspronkelijke partij, mits het volgende wordt aangegeven op het meldingsformulier:

      a. de relatie tussen de deelpartij en de oorspronkelijke partij,

      b. de persoon of instelling welke de splitsing heeft uitgevoerd, en

      c. de datum waarop de splitsing is uitgevoerd.

      3 Degene die de splitsing laat uitvoeren, is verantwoordelijk voor het gestelde in het eerste en het tweede lid.

      4 Het splitsen van een partij die blijkens de bijbehorende milieuhygiënische verklaring is ontstaan door
      samenvoeging van partijen overeenkomstig [artikel 4.3.2][ref2], of het splitsen van een partij die is ontstaan na
      splitsing van een zodanige samengevoegde partij, is uitsluitend toegestaan indien dit plaatsvindt op de wijze die
      is aangegeven in BRL 9335.


      [ref1]: https://wetten.overheid.nl/BWBR0023085
      [ref2]: https://wetten.overheid.nl/BWBR0023085#Artikel4.3.2
