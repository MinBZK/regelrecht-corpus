        artikel: '32'
  - number: 3.8.2
    text: |-
      1 Een onderzoek in het kader van de handhaving van de eisen in
      [artikel 28, eerste lid, onder b, van het besluit][ref1], wordt verricht overeenkomstig [artikel 3.4.1][ref2].

      2 Bij een onderzoek als bedoeld in het eerste lid, wordt beoordeeld:

      a. de partij als geheel, zoals aangegeven op de milieuhygiënische verklaring of de afleverbon;

      b. de partij zoals ter plaatse aanwezig bij de producent;

      c. de partij zoals toegepast in het werk, of

      d. een onderdeel van de partij, waarbij dit onderdeel ten minste 10.000 ton bedraagt.

      3 Er is sprake van een overtreding van [artikel 28, eerste lid, onder b, van het besluit][ref3], indien het in het
      eerste lid bedoelde onderzoek uitwijst dat de maximale waarden, bedoeld in [artikel 3.3.3, eerste lid][ref4], met
      ten minste een factor 1,4 worden overschreden, ongeacht de variatie in het onderzoeksresultaat ten gevolge van de
      mate van heterogeniteit van de partij.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0023085#Artikel3.4.1
