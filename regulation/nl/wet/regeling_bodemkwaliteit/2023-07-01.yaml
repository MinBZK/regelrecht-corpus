  - number: '2.2'
    text: |-
      1 De erkenning voor de werkzaamheden, bedoeld in
      [artikel 2.1, eerste lid, onderdelen a, e, h, j, k, m, p, r, s, u en v][ref1], wordt gebaseerd op een certificaat.
      De erkenning voor de werkzaamheden, bedoeld in artikel 2.1, eerste lid, onderdeel b, c, d, f, g, n, o en q, wordt
      gebaseerd op een accreditatie. De erkenning voor de werkzaamheid, bedoeld in artikel 2.1, eerste lid, onderdeel i,
      l en t, kan zowel op een certificaat als een accreditatie worden gebaseerd.

      2 Een erkenning voor de werkzaamheid bedoeld in [artikel 2.1, eerste lid, onderdeel c][ref2], wordt alleen verleend
      indien de desbetreffende instelling is geaccrediteerd voor alle verrichtingen van een van de pakketten bedoeld in
      de onderdelen genoemd bij [categorie 3 in bijlage C][ref3]. Indien de aanvraag betrekking heeft op het onderdeel
      samenstelling grond of het onderdeel samenstelling bouwstoffen dan kan de erkenning alleen worden verleend indien
      de instelling is geaccrediteerd voor pakket SG1, onderscheidenlijk pakket SB1. In afwijking van de eerste volzin
      is het, met uitzondering van de verrichtingen die betrekking hebben op uitloogonderzoek, toegestaan één verrichting
      van een pakket uit te besteden aan een instelling die voor die verrichting beschikt over een erkenning.

      3 Een erkenning voor de werkzaamheid, bedoeld in [artikel 2.1, eerste lid, onder d][ref4], wordt alleen verleend
      indien de desbetreffende instelling is geaccrediteerd voor alle verrichtingen van het onderdeel SIKB-protocol 3010
      of SIKB-protocol 3110, zoals vermeld bij [categorie 4 in bijlage C][ref5]. In afwijking van de vorige volzin is
      het toegestaan één verrichting van een SIKB-protocol uit te besteden aan een instelling die voor die verrichting
      beschikt over een erkenning.

      4 Voor zover een erkenning voor de werkzaamheid, bedoeld in [artikel 2.1, eerste lid, onder l][ref6], wordt
      gebaseerd op een accreditatie, wordt deze erkenning alleen verleend indien de desbetreffende instelling is
      geaccrediteerd voor alle verrichtingen van het onderdeel SIKB-protocol 2001 of SIKB-protocol 2002, zoals vermeld
      bij [categorie 12 in bijlage C][ref7]. In afwijking van de vorige volzin is het toegestaan ten hoogste drie
      verrichtingen (NEN normen) van een SIKB-protocol uit te besteden aan een instelling die voor die verrichting
      beschikt over een erkenning.

      5 In afwijking van het eerste lid wordt een erkenning voor de werkzaamheid, bedoeld in
      [artikel 2.1, eerste lid, onderdeel f][ref8], voor zover deze werkzaamheid de certificering van personen en
      instellingen betreft voor de werkzaamheid, bedoeld in artikel 2.1, eerste lid, onderdeel t, niet gebaseerd op een
      accreditatie.


