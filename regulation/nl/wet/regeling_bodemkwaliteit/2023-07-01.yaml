  - number: 4.4.1
    text: |-
      1 De kwaliteit van de grond of baggerspecie die op of in de bodem wordt toegepast, wordt uitgedrukt in de
      ‘kwaliteitsklasse wonen’, indien deze:

      a. de achtergrondwaarden overschrijdt, en

      b. de maximale waarden voor de kwaliteitsklasse wonen niet overschrijdt.

      2 De kwaliteit van de grond of baggerspecie die op of in de bodem wordt toegepast, wordt uitgedrukt in de
      ‘kwaliteitsklasse industrie’, indien deze:

      a. de maximale waarden voor de kwaliteitsklasse wonen overschrijdt, en

      b. de maximale waarden voor de kwaliteitsklasse industrie niet overschrijdt.

      3 De kwaliteit van grond of baggerspecie die op of in de bodem of oever van een oppervlaktewaterlichaam wordt
      toegepast, wordt uitgedrukt in de ‘kwaliteitsklasse A’, indien deze:

      a. de achtergrondwaarden overschrijdt en

      b. de maximale waarden voor de kwaliteitsklasse A niet overschrijdt.

      4 De kwaliteit van grond of baggerspecie die op of in de bodem of oever van een oppervlaktewaterlichaam wordt
      toegepast, wordt uitgedrukt in de ‘kwaliteitsklasse B’, indien deze:

      a. de maximale waarden voor de kwaliteitsklasse A overschrijdt en

      b. de maximale waarden voor de kwaliteitsklasse B niet overschrijdt.

      5 De indeling in de kwaliteitsklassen, bedoeld in het eerste tot en met het vierde lid, is gebaseerd op de
      milieuhygiënische verklaring van de grond of baggerspecie.

      6 Grond of baggerspecie die de interventiewaarden overschrijdt, wordt niet in een kwaliteitsklasse ingedeeld.
    url: https://wetten.overheid.nl/BWBR0023085/2023-07-01#Artikel4.4.1
  - number: 4.5.1
    text: |-
      1 De milieuhygiënische verklaring van de toe te passen grond of baggerspecie of van de bodem op de
      toepassingslocatie, geeft aan:

      a. voor welke stoffen de kans op overschrijding van de achtergrondwaarden hoger is dan 5%,

      b. welke stoffen van natuurlijke oorsprong of vanwege het gebruik de achtergrondwaarden overschrijden, en kunnen
      voorkomen in het gebied waar de grond of baggerspecie van afkomstig is;

      c. de emissie van de stoffen waarvan de kans op overschrijding van de maximale emissiewaarden hoger is
      dan 5% voor toepassingen als bedoeld in [artikel 63 van het besluit][ref1], tenzij wordt voldaan aan
      [artikel 4.12.1, tweede of derde lid][ref2].

      2 Het eerste lid, onder a, is niet van toepassing op baggerspecie van oppervlaktewaterlichamen die in beheer zijn
      bij het Rijk, indien de baggerspecie daarin wordt toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel63
