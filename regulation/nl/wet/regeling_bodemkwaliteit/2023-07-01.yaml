  - number: '2.1'
    text: |-
      1 Als werkzaamheden als bedoeld in het [besluit][ref1] worden aangewezen de werkzaamheden die behoren tot de
      volgende categorieën:

      a. aanleg van bodembeschermende voorzieningen;

      b. afgeven van kwaliteitsverklaringen op grond van een nationale BRL;

      c. analyse van bouwstoffen, grond of baggerspecie ter voldoening aan een verplichting die geldt bij of krachtens
      het [besluit][ref2];

      d. analyse voor milieuhygiënisch bodemonderzoek bij een verkennend onderzoek, een orienterend onderzoek, een
      nader onderzoek of een saneringsonderzoek als bedoeld in [artikel 1 van de Wet bodembescherming][ref3] of een
      vergelijkbaar onderzoek van de bodem, dan wel bij een onderzoek in het kader van een ingreep in de bodem of oever
      van een oppervlaktewaterlichaam;

      e. bewerking van verontreinigde grond of baggerspecie, zijnde de procesmatige ex situ reiniging en bewerking
      daarvan, met uitzondering van het ontwateren van baggerspecie waarvoor op grond van de [Wet milieubeheer][ref4]
      geen vergunning is vereist;

      f. certificering van personen voor werkzaamheden die in de uitoefening van een bedrijf worden uitgevoerd;

      g. periodieke inspectie van bodembeschermende voorzieningen;

      h. milieukundige begeleiding die bestaat uit verificatie en processturing bij een sanering van bodem
      of uit processturing bij een ingreep in de bodem of oever van een oppervlaktewaterlichaam als bedoeld
      in [artikel 1.1. van de Waterwet][ref5], waarbij meer dan 1000 m3 van die bodem of oever van een
      oppervlaktewaterlichaam de interventiewaarden, bedoeld in tabel 2 van [bijlage B][ref6], overschrijdt;

      i. monsterneming bij partijkeuringen ter voldoening aan een verplichting die geldt bij of krachtens het
      [besluit][ref7];

      j. produceren van bouwstoffen, grond of baggerspecie die is bestemd voor toepassing in Nederland en waarvoor
      een kwaliteitsverklaring is afgegeven die erkend is volgens de eisen van de desbetreffende bij categorie 10 in
      [bijlage C][ref8] aangewezen nationale BRL en de eisen in het document HCB/2009-200 van de Harmonisatie Commissie
      Bouw, dat is opgenomen in [bijlage D][ref9];

      k. uitvoering van een sanering van de bodem, dan wel een ingreep in de bodem of oever van een
      oppervlaktewaterlichaam waarbij meer dan 1000 m3 van die bodem of oever van dat oppervlaktewaterlichaam de
      interventiewaarden, bedoeld in tabel 2 van [bijlage B][ref10], overschrijdt;

      l. veldwerk, dat bestaat uit het plaatsen van boringen en peilbuizen ten behoeve van het nemen van grond-
      en grondwatermonsters, het nemen van grond- en grondwatermonsters, locatie-inspectie of maaiveldinspectie en
      monsterneming van asbest in de bodem of het uitvoeren van vergelijkbare onderzoeken in de bodem of oever van een
      oppervlaktewaterlichaam;

      m. verwijderen, onklaar maken, repareren en installeren van ondergrondse opslagtanks, leidingen en appendages;

      n. beoordeling en keuring van ondergrondse opslagtanks, leidingen en appendages en daarbij behorende voorzieningen;

      o. het inspecteren van de aanleg van een werk met isolerende voorzieningen als bedoeld in
      [artikel 3.9.6, eerste lid][ref11];

      p. aanbrengen van isolerende voorzieningen als bedoeld in [artikel 3.9.6, eerste lid][ref12];

      q. controle van de staat van een werk, als bedoeld in [artikel 3.9.8, eerste lid, onder c][ref13];

      r. samenvoegen van verschillende partijen grond of baggerspecie in de zin van [artikel 4.3.2][ref14];

      s. mechanisch boren als beschreven in BRL SIKB 2100 en Protocol 2101;

      t. keuren van mestbassins en afdekkingen;

      u. ontwerpen, installeren, beheren en onderhouden van het ondergrondse deel van bodemenergiesystemen;

      v. ontwerpen, installeren en beheren van het bovengrondse deel van bodemenergiesystemen.

      2 De handelingen, bedoeld in het eerste lid, onder a, d, g, h, k, l, m, n en t, zijn alleen aangemerkt als
      werkzaamheid voor zover ze worden uitgevoerd:

      a. ter verkrijging van een beschikking die op grond van een bij of krachtens een in
      [artikel 21, tweede lid, van het besluit][ref15] genoemd wettelijk voorschrift wordt gegeven;

      b. ter voldoening aan een bij of krachtens [artikel 22, tweede lid, van het besluit][ref16] geldende verplichting,
      [artikel 13 van de Wet bodembescherming][ref17] of [artikel 6.8 van de Waterwet][ref18];

      c. ter voorbereiding van het opstellen van een beheerplan als bedoeld in [artikel 4.6 van de Waterwet][ref19]
      of een projectplan als bedoeld in [artikel 5.4 van die wet][ref20], of ter uitvoering van bedoeld beheerplan of
      projectplan, of

      d. ter voldoening aan een wettelijk voorschrift voorzover bij of krachtens dat voorschrift is bepaald dat de
      werkzaamheid wordt uitgevoerd door een persoon of instelling die op grond van het [besluit][ref21] daartoe is
      erkend.

      3 De handeling, bedoeld in het eerste lid, onder k, wordt niet aangemerkt als werkzaamheid,
      indien [artikel 27][ref22] of [30 van de Wet bodembescherming][ref23] of [artikel 5.15][ref24] of
      [6.9 van de Waterwet][ref25] daarop van toepassing is en onverwijld maatregelen moeten worden genomen om de
      verontreiniging of de aantasting van de bodem en de directe gevolgen daarvan te beperken en zoveel mogelijk
      ongedaan te maken.

      4 De werkzaamheden, bedoeld in het eerste lid, zijn beschreven in de normdocumenten, aangewezen in
      [artikel 2.7][ref26].


