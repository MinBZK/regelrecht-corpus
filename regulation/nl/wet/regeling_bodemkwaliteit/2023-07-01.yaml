  - number: 3.9.6
    text: |-
      1 De aanleg van een werk met isolerende voorzieningen wordt geïnspecteerd door een daartoe erkend bedrijf.

      2 De isolerende voorzieningen, bedoeld in [artikel 3.9.2, eerste, vijfde en zesde lid][ref1], voor zover het een
      vloeistofdichte verharding betreft of isolerende voorzieningen, worden conform het ontwerp aangebracht door een
      daartoe erkend bedrijf.

      3 Bij de uitvoering van het werk zijn afwijkingen ten opzichte van het ontwerp als bedoeld in [artikel 3.9.1][ref2]
      uitsluitend toegestaan, indien deze:

      a. minimaal een gelijkwaardige milieubescherming bieden als het ontwerp;

      b. voor het toepassen worden gemeld aan Onze Minister met opgave van afwijkingen en het rapport van de Advieskamer
      bodembescherming, genoemd in onderdeel c, en

      c. door de Advieskamer bodembescherming zijn gekeurd volgens het toepasselijke normdocument in [bijlage D][ref3].

      4 Degene die de IBC-bouwstof heeft toegepast, meldt het gereedkomen van het werk, alsmede afwijkingen van het
      ontwerp als bedoeld in [artikel 3.9.1][ref4] ingeval die bij een latere controle blijken, binnen veertien dagen aan
      Onze Minister.

      5 Degene die de IBC-bouwstof heeft toegepast bewaart en registreert voor de levensduur van het werk ten minste:

      a. een overzicht van het ontwerp;

      b. de afwijkingen ten opzichte van het ontwerp;

      c. een tekening van de uiteindelijke situatie, en

      d. andere gegevens waaruit kan worden afgeleid of is voldaan aan de gestelde eisen.


