  - number: 3.5.5
    text: |-
      1 De fabrikant-eigenverklaring bevat de volgende gegevens:

      a. de verklaring van de producent dat de bouwstof voldoet aan de gestelde criteria in [artikel 3.5.1][ref1];

      b. de naam en het adres van de producenten de specifieke productielocatie;

      c. een nauwkeurige specificatie of beschrijving van de bouwstof;

      d. eventuele bijzondere voorwaarden voor het gebruik van de bouwstof;

      e. een uniek nummer.

      2 Voor het opstellen van een fabrikant-eigenverklaring wordt gebruikt gemaakt van het format dat verkrijgbaar is
      bij Bodem+.


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel3.5.1
    url: https://wetten.overheid.nl/BWBR0023085/2023-07-01#Artikel3.5.5
