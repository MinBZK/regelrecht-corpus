    text: |-
      1 Degene die de bouwstof toepast meet vanaf het moment dat de eerste laag IBC-bouwstof wordt aangebracht tot de
      voltooiing van het werk, de zetting daarvan.

      2 Bij het gereedkomen van het werk wordt de gemeten zetting vergeleken met de berekende zetting, bedoeld in
      [artikel 3.9.1, eerste lid, onder d][ref1] en, voor zover deze verschillen, wordt de berekende eindzetting, bedoeld
      in [artikel 3.9.1, tweede lid][ref2], bijgesteld.

      3 Indien uit de bijgestelde berekende eindzetting blijkt dat niet wordt voldaan aan
      [artikel 3.9.3, vijfde lid][ref3], meldt de toepasser dit binnen veertien dagen aan Onze Minister.


