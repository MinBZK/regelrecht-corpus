        paragraaf: '3.5'
  - number: 3.5.3
    text: |-
      1 Bij het toelatingsonderzoek, bedoeld in [artikel 3.5.2][ref1], wordt de k-waarde voor iedere parameter in
      [bijlage A][ref2] berekend, zoals aangegeven in [bijlage H][ref3].

      2 Het k-waardecriterium is dat de k-waarden van alle parameters in een bouwstof groter zijn dan 2,07.

      3 Voor de berekening van de k-waarde worden de regels in [bijlage G][ref4], onder IV, toegepast.

      4 Een parameter voldoet in elk geval aan het k-waardecriterium, indien alle meetwaarden van de desbetreffende
      parameter:

      a. conform de regels in [bijlage G][ref5], onder IV, onder de bepalingsgrens liggen;

      b. onder γ maal de desbetreffende maximale samenstellings- of emissiewaarde liggen, zoals in [bijlage H][ref6]
      aangegeven voor tien keuringen.

      5 Voor asbest wordt geen k-waarde bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel3.5.2
      [ref2]: https://wetten.overheid.nl/BWBR0023085
