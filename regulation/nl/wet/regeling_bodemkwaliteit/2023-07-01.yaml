  - number: 3.9.4
    text: |-
      1 Voor het monitoren van de stand en de kwaliteit van het grondwater worden peilbuizen aangebracht. Het aantal
      peilbuizen tot 50.000 m3 IBC-bouwstof bedraagt ten minste één bovenstrooms en twee benedenstrooms van het werk. Per
      50.000 m3 IBC-bouwstof extra wordt hieraan ten minste één peilbuis bovenstrooms en twee benedenstrooms toegevoegd.

      2 Voor het monitoren van de zetting tijdens de aanleg van het werk worden voorzieningen aangebracht.

      3 Een beheers- en controleplan wordt opgesteld overeenkomstig het toepasselijke normdocument, bedoeld in
      [bijlage D][ref1].

      4 Het beheers- en controleplan wordt door de Advieskamer bodembescherming gekeurd volgens het toepasselijke
      normdocument in [bijlage D][ref2].


