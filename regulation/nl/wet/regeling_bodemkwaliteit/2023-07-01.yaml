  - number: 4.3.5
    text: |-
      1 Een kaart van de actuele kwaliteit van de bodem als bedoeld in [artikel 47, onder a][ref1], of
      [48, onder a][ref2], of [57, tweede lid, van het besluit][ref3] wordt opgesteld met inachtneming van de
      richtlijnen, genoemd in [bijlage D, onderdeel II][ref4], en de eisen, gesteld in [bijlage M][ref5].

      2 Een kaart als bedoeld in het eerste lid heeft een geldigheidsduur van maximaal vijf jaar. De geldigheidsduur kan
      worden verlengd.

      3 Het bevoegd gezag zendt de geografische bronbestanden van een kaart als bedoeld in het eerste lid, uiterlijk twee
      maanden na vaststelling aan Bodem+.

      4 Op grond van een bodemkwaliteitskaart kan een milieuhygiënische verklaring worden afgegeven van:

      a. de kwaliteit van de bodem;

      b. de grond of baggerspecie.

      5 Indien het bevoegd gezag een bodemkwaliteitskaart vaststelt met een geldigheidsduur korter dan vijf jaar kan
      een milieuhygiënische verklaring als bedoeld in het vierde lid alleen worden afgegeven met als einddatum de
      vastgestelde geldigheidsduur van de kaart.

      6 Het bepaalde in het vierde lid, aanhef en onder a, geldt alleen, indien:

      a. uit een vooronderzoek overeenkomstig NEN 5725, voor zover het de bodem, uitgezonderd de bodem of oever van een
      oppervlaktewaterlichaam, betreft, of NEN 5717, voor zover het de bodem of oever van een oppervlaktewaterlichaam
      betreft, is gebleken dat de bodem waarop de milieuhygiënische verklaring betrekking heeft, is gelegen binnen de
      bodemkwaliteitszone die op de bodemkwaliteitskaart is aangegeven, en

      b. uit een vooronderzoek overeenkomstig NEN 5725, onderscheidenlijk NEN 5717, is gebleken dat de bodem waarop
      de milieuhygiënische verklaring betrekking heeft niet afwijkt van de kwaliteit die op de bodemkwaliteitskaart is
      aangegeven.

      7 Het bepaalde in het vierde lid, aanhef en onder b, geldt alleen, indien:

      a. de toepassingslocatie en de plaats van herkomst van de grond of baggerspecie gelegen zijn binnen het gebied
      waarop de bodemkwaliteitskaart betrekking heeft, of

      b. de grond of baggerspecie afkomstig is van een bodembeheergebied, dat op grond van
      [artikel 47 van het besluit][ref6] als basis kan dienen voor milieuhygiënische verklaringen, en daarbinnen wordt
      toegepast, en

      c. voor alle gemeten stoffen de P95 van de bodemkwaliteitszone van de plaats van herkomst van de grond
      of baggerspecie op de toepassingslocatie niet leidt tot een overschrijding van de waarden, bedoeld in
      [artikel 44, tweede lid, onder c, van het besluit][ref7], hetgeen wordt berekend met behulp van de risicomodule,
      bedoeld in [artikel 4.8.1][ref8],

      d. uit een vooronderzoek overeenkomstig NEN 5725, onderscheidenlijk NEN 5717, is gebleken dat de partij grond of
      baggerspecie, waarop de milieuhygiënische verklaring betrekking heeft, afkomstig is uit het toepassingsgebied dat
      op de bodemkwaliteitskaart is aangegeven, en

      e. uit een vooronderzoek overeenkomstig NEN 5725, onderscheidenlijk NEN 5717, is gebleken dat de partij grond
      of baggerspecie waarop de milieuhygiënische verklaring betrekking heeft, niet afwijkt van de kwaliteit die op de
      bodemkwaliteitskaart is aangegeven.


