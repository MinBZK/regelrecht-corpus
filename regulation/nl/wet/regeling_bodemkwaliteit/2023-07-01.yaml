  - number: 5.1.10a
    text: |-
      Tot 1 juli 2016 kan een milieuhygiënische verklaring als bedoeld in [artikel 4.3.5., vierde lid][ref1],
      zoals dat luidt met ingang van 1 januari 2016, worden afgegeven op grond van een kaart die is vastgesteld
      voor 1 januari 2016, waarbij toepassing is gegeven aan onderdeel 5. Vaststellen bodemkwaliteitszones,
      [onder 3, van bijlage M][ref2], zoals dat luidde vóór 1 januari 2016.


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel4.3.5
