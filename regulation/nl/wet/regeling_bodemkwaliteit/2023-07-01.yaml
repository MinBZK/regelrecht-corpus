  - number: 4.10.1
    text: |-
      1 De maximale waarden voor de kwaliteitsklassen wonen en industrie voor de bodem, zijn opgenomen in
      [tabel 1 van bijlage B][ref1].

      2 De maximale waarden voor de kwaliteitsklassen A en B voor de bodem of oever van een oppervlaktewaterlichaam, zijn
      opgenomen in [tabel 2 van bijlage B][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023085
      [ref2]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-07-01#Artikel4.10.1
    references:
      - id: ref1
        bwb_id: BWBR0023085
      - id: ref2
        bwb_id: BWBR0023085
  - number: 4.10.2
    text: |-
      1 Voor het vaststellen van de kwaliteitsklasse van de bodem wordt een correctie op de gemeten gehalten voor lutum
      en organisch stof uitgevoerd volgens de rekenregels in [onderdeel III van bijlage G][ref1].

      2 De bodem wordt uitgedrukt in de kwaliteitsklasse wonen, indien de rekenkundige gemiddelden van de gehalten
      van de gemeten stoffen in de bodem of in de bodemkwaliteitszone de achtergrondwaarden overschrijden, maar niet
      de maximale waarden voor de kwaliteitsklasse wonen. Om te bepalen of er sprake is van een overschrijding van de
      achtergrondwaarden is [artikel 4.2.2, vierde, vijfde en achtste lid][ref2], van overeenkomstige toepassing.

      3 De kwaliteit van de bodem overschrijdt niet de maximale waarden voor de kwaliteitsklasse wonen, indien ten
      opzichte van de maximale waarden voor de kwaliteitsklasse wonen:

      a. bij meting van ten minste 7 stoffen waarvoor een waarde is opgenomen in de tabellen 1 en 2 van
      [bijlage B][ref3], maximaal 2 stoffen verhoogd zijn;

      b. bij meting van ten minste 16 stoffen waarvoor een waarde is opgenomen in de tabellen 1 en 2 van
      [bijlage B][ref4], maximaal 3 stoffen verhoogd zijn;

      c. bij meting van ten minste 27 stoffen waarvoor een waarde is opgenomen in de tabellen 1 en 2 van
      [bijlage B][ref5], maximaal 4 stoffen verhoogd zijn;

      d. bij meting van ten minste 37 stoffen maximaal waarvoor een waarde is opgenomen in de tabellen 1 en 2 van
      [bijlage B][ref6], 5 stoffen verhoogd zijn.

      4 Een verhoging als bedoeld in het derde lid bedraagt per stof ten hoogste de maximale waarde voor de
      kwaliteitsklasse wonen voor die stof, vermeerderd met de daarvoor geldende achtergrondwaarde en de gehalten van
      alle verhoogde stoffen de maximale waarden voor de kwaliteitsklasse industrie niet overschrijden.

      5 De bodem wordt uitgedrukt in de kwaliteitsklasse industrie, indien de rekenkundige gemiddelden van de gehalten
      van de gemeten stoffen in de bodem of in de bodemkwaliteitszone de maximale waarden voor de bodemfunctieklasse
      wonen overschrijden, maar niet de maximale waarden voor de bodemfunctieklasse industrie.


      [ref1]: https://wetten.overheid.nl/BWBR0023085
      [ref2]: https://wetten.overheid.nl/BWBR0023085#Artikel4.2.2
      [ref3]: https://wetten.overheid.nl/BWBR0023085
      [ref4]: https://wetten.overheid.nl/BWBR0023085
