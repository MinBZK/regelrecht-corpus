  - number: 4.3.2
    text: |-
      1 Het samenvoegen van verschillende partijen grond of baggerspecie tot een partij die groter is dan 25m3, is
      uitsluitend toegestaan indien deze:

      a. in dezelfde bodemkwaliteitsklasse zijn ingedeeld, en

      b. zijn gekeurd en samengevoegd overeenkomstig BRL 9335 of BRL 7500, door een persoon of instelling die daartoe
      beschikt over een erkenning.

      2 Bij het samenvoegen van partijen grond of baggerspecie vervallen de milieuhygiënische verklaringen voor de
      oorspronkelijke partijen en verstrekt de persoon of instelling die de partijen heeft samengevoegd daarvoor een
      milieuhygiënische verklaring.

      3 Voor het samenvoegen van partijen grond of baggerspecie die kleiner zijn dan 100 ton, is het toegestaan
      om in afwijking van het eerste lid, onder a, partijen grond of baggerspecie van verschillende of onbekende
      bodemkwaliteitsklassen samen te voegen overeenkomstig BRL 9335 of BRL 7500.

      4 Het eerste lid, onderdeel b, is niet van toepassing op het samenvoegen van partijen grond of baggerspecie als
      bedoeld in [artikel 39 van het besluit][ref1] die voorzien zijn van een erkende kwaliteitsverklaring als bedoeld in
      [artikel 4.3.6][ref2], overeenkomstig BRL 9313 of BRL 9321.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0023085#Artikel4.3.6
