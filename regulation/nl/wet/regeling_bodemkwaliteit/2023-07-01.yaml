  - number: '2.7'
    text: |-
      Voor een werkzaamheid is als normdocument aangewezen het document dat bij de categorie waartoe de werkzaamheid
      behoort in [bijlage C][ref1] is vermeld of een of meer onderdelen van zodanig document waarin de werkzaamheid wordt
      beschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-07-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 3.1.1
    text: |-
      1 Ingeval het onduidelijk is of een materiaal als bouwstof moet worden aangemerkt, worden de totaalgehalten aan
      silicium, calcium of aluminium daarin bepaald. Hiertoe worden aselect over de hele partij ten minste twaalf grepen
      genomen, die ieder worden verdeeld over drie mengmonsters.

      2 De mengmonsters worden voorbehandeld door ze te drogen bij 40 °C volgens NVN 7312.

      3 Elk mengmonster wordt verkleind met een kruisslagmolen of een vergelijkbare molen met een zeef van 500 µm.
      Vervolgens wordt het mengmonster verdeeld door middel van roterend verdelen, overeenkomstig NVN 7312 hoofdstuk
      7.7.2. Per mengmonster wordt één deelmonster van minimaal 250 gram verder vermalen tot 250 µm met gebruik van
      hoofdstuk 7.6.3 ‘Verkleinen tot deeltjes kleiner dan 125 µm’ van NVN 7312. De verkleinde deelmonsters worden
      geanalyseerd volgens [artikel 3.1.2][ref1].

      4 Indien het materiaal bestaat uit elementen of proefstukken, worden daarvan stukken van ten minste 80 gram
      afgehaald. Het vierde lid, de tweede volzin uitgezonderd, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel3.1.2
    url: https://wetten.overheid.nl/BWBR0023085/2023-07-01#Artikel3.1.1
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: 3.1.2
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.1.2
    text: |-
      1 De ontsluiting van de deelmonsters en de analyse van silicium, calcium of aluminium daarin worden uitgevoerd
      overeenkomstig ASTM-norm D 3682-13.

      2 Voor de berekening van de massa’s silicium, calcium en aluminium in de deelmonsters en van het gemiddelde
      percentage van deze stoffen in de bouwstof, wordt de werkwijze gehanteerd, zoals beschreven in [bijlage E][ref1].

      3 De uitkomsten van de monsterneming, de analyse en de berekening worden vastgelegd in een rapportage.


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-07-01#Artikel3.1.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 3.2.1
    text: |-
      1 De bepaling of een bouwstof vormgegeven is, vindt plaats door het volume van de kleinste eenheid van de
      desbetreffende bouwstof te bepalen, indien de bouwstof bestaat uit elementen van ongeveer gelijke grootte.

      2 Het volume van een bouwstof wordt bepaald door de afmetingen ervan te bepalen en door van het totale volume het
      volume van de holten en gaten in het oppervlak af te trekken.

      3 Indien het volume van een bouwstof tussen 50 cm3 en 100 cm3 is, wordt het volume nader bepaald door
      onderdompeling van het element in water op de wijze, bepaald in hoofdstuk 8 van NEN-EN 13383-2 en door berekening
      met de in [bijlage F][ref1] aangegeven formule.


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-07-01#Artikel3.2.1
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 3.2.2
    text: |-
      1 De bepaling of een bouwstof vormgegeven is, vindt plaats door de korrelverdeling te bepalen met behulp van een
      zeefproef indien het een granulaire bouwstof betreft met een opbouw in korrelverdeling. Hierbij worden aselect over
      de hele partij zes monsters genomen uit een statische partij of drie monsters uit een stroom.

      2 Voor elk monster wordt één greep genomen volgens hoofdstuk 4.5 van NEN-EN 13383-2.

      3 De monsters zijn minimaal zo groot dat de getalswaarde van de massa in kg ten minste tweemaal de getalswaarde
      bedraagt van de d95 in mm. Hierbij is de d95 gelijk aan de maat van de zeef, waardoor ten minste 95% van de massa
      van een monster valt.

      4 De korrelverdeling van de monsters wordt bepaald volgens hoofdstuk 5 van NEN-EN 13383-2.

      5 Indien de korrelverdeling voldoet aan het gestelde in [bijlage F][ref1], wordt de bouwstof aangemerkt als
      bouwstof met een volume per kleinste eenheid van 50 cm3.


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-07-01#Artikel3.2.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 3.2.3
    text: |-
      Een bouwstof, met uitzondering van de bouwstoffen genoemd in [bijlage F][ref1], paragraaf 3, geldt als duurzaam
      vormvast indien deze in een diffusieproef volgens NEN 7375 gedurende 64 dagen minder massaverlies vertoont dan:

      a. 1500 g/m2 voor lichtgebonden steenmengsels voor wegfunderingen, beproefd direct na een verhardingstijd van 28
      dagen,

      b. 500 g/m2 voor lichtgebonden steenmengsels, beproefd direct na een verhardingstijd van 91 dagen (verharding bij
      20 °C en bij een relatieve vochtigheid van tenminste 90%),

      c. 200 g/m2 voor cementgebonden minerale reststoffen, die worden toegepast als gebonden fundering in de GWW conform
      BRL 9322, of

      d. 30 g/m2 voor alle andere materialen.


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-07-01#Artikel3.2.3
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 3.3.1
    text: |-
      1 De emissie van parameters uit niet-vormgegeven bouwstoffen, uit vormgegeven bouwstoffen waarvan de uitloging
      oplosbepaald is volgens de voorschriften van NEN 7375 en uit vormgegeven bouwstoffen met een open, afwaterende
      structuur, bedoeld in [bijlage F][ref1], paragraaf 4, wordt bepaald door middel van de kolomproef volgens NEN 7373
      of NEN 7383 of de beschikbaarheidsproef volgens NEN 7371.

      2 De emissie van parameters uit vormgegeven bouwstoffen, waarvan de uitloging diffusiebepaald is, wordt bepaald
      door middel van de diffusieproef volgens NEN 7375 of de proeven uit het eerste lid. De emissie wordt in de
      diffusieproef berekend over 64 dagen volgens NEN 7375 onderdeel 9.4.

      3 De samenstellingswaarden van bouwstoffen worden bepaald met de technieken beschreven in AP 04.

      4 Indien de bepaling van de samenstelling of emissie volgens AP04 is gekoppeld aan een specifieke wijze van
      toepassing, wordt:

      a. deze toepassingsvoorwaarde gerapporteerd door de persoon of instelling die de bouwstof heeft onderzocht en
      weergegeven op de milieuhygiënische verklaring, en

      b. de bouwstof op deze wijze toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-07-01#Artikel3.3.1
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 3.3.2
    text: |-
      1 Indien bij de kolomproef door slechte doorlatendheid van het onderzochte materiaal onvoldoende vloeistof door de
      kolom stroomt, wordt de emissie berekend aan de hand van de formule in [bijlage K][ref1].

      2 Indien de emissie, bedoeld in het eerste lid, kleiner is dan L/S=2, gelden voor het desbetreffende materiaal geen
      maximale emissiewaarden.

      3 Indien bij een diffusieproef volgens NEN 7375 voor een bepaalde parameter geen diffusiegecontroleerd traject kan
      worden vastgesteld, wordt de bovengrens van de uitloging volgens de methode beschreven in onderdeel 9.6 van NEN
      7375 berekend voor T=36500 dagen. Deze berekende bovengrens gedeeld door 24 geldt als de emissie uit de bouwstof.


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-07-01#Artikel3.3.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 3.3.3
    text: |-
      1 De maximale waarden voor de emissie uit vormgegeven, niet-vormgegeven en IBC-bouwstoffen en voor de samenstelling
      van bouwstoffen zijn opgenomen in [bijlage A][ref1].

      2 Vormgegeven bouwstoffen waarvan de emissie van parameters uit de bouwstof is bepaald door middel van een van
      de proeven, bedoeld in [artikel 3.3.1, eerste lid][ref2], voldoen aan de maximale emissiewaarden anorganische
      parameters voor niet-vormgegeven bouwstoffen die zijn opgenomen in tabel 1 van [bijlage A][ref3].

      3 Een bouwstof voldoet aan de maximale waarden, bedoeld in het eerste en tweede lid, indien de gemiddelde
      emissie- en samenstellingswaarden voor iedere parameter kleiner of gelijk zijn aan deze maximale waarden. Het
      gemiddelde wordt berekend door per parameter het gemiddelde te bepalen van de geanalyseerde mengmonsters, bedoeld
      in [3.4.1, tweede lid][ref4].

      4 Bij het bepalen of voldaan wordt aan de waarden, bedoeld in het tweede en derde lid, worden de regels in
      [bijlage G][ref5], onder IV, toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0023085
      [ref2]: https://wetten.overheid.nl/BWBR0023085#Artikel3.3.1
      [ref3]: https://wetten.overheid.nl/BWBR0023085
      [ref4]: https://wetten.overheid.nl/BWBR0023085#Artikel3.4.1
      [ref5]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-07-01#Artikel3.3.3
    references:
      - id: ref1
        bwb_id: BWBR0023085
      - id: ref2
        bwb_id: BWBR0023085
        artikel: 3.3.1
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref3
        bwb_id: BWBR0023085
      - id: ref4
        bwb_id: BWBR0023085
        artikel: 3.4.1
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref5
        bwb_id: BWBR0023085
  - number: 3.4.1
    text: |-
      1 Bij een partijkeuring worden aselect over de hele partij tenminste twaalf grepen genomen.

      2 Deze grepen worden evenredig verdeeld over ten minste twee mengmonsters, die zijn bestemd om te worden
      voorbehandeld en geanalyseerd overeenkomstig [paragraaf 3.3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0023085/2023-07-01#Artikel3.4.1
    references:
      - id: ref1
        bwb_id: BWBR0023085
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.4.2
    text: |-
      1 De uitkomst van de partijkeuring wordt vastgelegd in een rapportage, die de volgende gegevens bevat:

      a. de naam en het adres van de persoon of instelling die de monsters heeft genomen en van de instelling die
      de monsters heeft geanalyseerd, en de naam van de feitelijke natuurlijke persoon die de monsterneming heeft
      uitgevoerd;

      b. de data waarop monsterneming, monstervoorbehandeling en analyse zijn uitgevoerd;

      c. een verwijzing naar de gebruikte normdocumenten en methoden, en een onderbouwing van afwijkingen hiervan, indien
      deze het analyseresultaat beïnvloeden;

      d. het monsternemingsformulier en monsternemingsplan of een kopie daarvan;

      e. een beschrijving van de partij, waaronder de ligging, kenmerken en partijgrootte;

      f. een beschrijving van het monster, waaronder de aanwezigheid van eventuele metalen delen, de massa en de
      samenstelling of vermoedelijke samenstelling;

      g. het analyserapport van het laboratorium, inclusief de gemiddelde samenstellings- en emissiewaarden, een
      onderbouwing van de gekozen parameters, en de verhouding tussen de meetwaarden en daaruit voortvloeiende
      conclusies, en

      h. een uniek nummer.

      2 Indien de partij voldoet aan de maximale waarden, bedoeld in [artikel 3.3.3, eerste lid][ref1], wordt een
      milieuhygiënische verklaring afgegeven, die de volgende gegevens bevat:

      a. de naam en het adres van degene die de milieuhygiënische verklaring afgeeft;

      b. de naam van de desbetreffende bouwstof;

      c. de toepasbaarheid van de bouwstof en eventuele voorwaarden die hierbij gelden, en

      d. voor welk toepassingsgebied de partij voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel3.3.3
    url: https://wetten.overheid.nl/BWBR0023085/2023-07-01#Artikel3.4.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: 3.3.3
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.5.1
    text: |-
      1 Een producent kan voor een bouwstof, niet zijnde een IBC-bouwstof, een fabrikant-eigenverklaring afgeven, indien:

      a. alle parameters voldoen aan de maximale waarden, bedoeld in [artikel 3.3.3, eerste lid][ref1];

      b. asbest voldoet aan een maximale samenstellingswaarde van 10 mg/kg droge stof voor producten bedoeld in
      [tabel 2 van bijlage A, onder punt 6][ref2];

      c. de k-waarden voor alle parameters voldoen aan het k-waardecriterium in [artikel 3.5.3][ref3], en

      d. de producent beschikt over een werkend systeem van interne kwaliteitsbewaking als bedoeld in
      [artikel 3.5.4][ref4].

      2 Een producent geeft geen fabrikant-eigenverklaring af, indien sprake is van enkelvoudige partijen zonder
      onderlinge samenhang in kwaliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel3.3.3
      [ref2]: https://wetten.overheid.nl/BWBR0023085
      [ref3]: https://wetten.overheid.nl/BWBR0023085#Artikel3.5.3
      [ref4]: https://wetten.overheid.nl/BWBR0023085#Artikel3.5.4
    url: https://wetten.overheid.nl/BWBR0023085/2023-07-01#Artikel3.5.1
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: 3.3.3
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0023085
      - id: ref3
        bwb_id: BWBR0023085
        artikel: 3.5.3
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref4
        bwb_id: BWBR0023085
        artikel: 3.5.4
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.5.2
    text: |-
      1 De producent toont met een toelatingsonderzoek aan dat de bouwstof voldoet aan [artikel 3.5.1][ref1].

      2 Het toelatingsonderzoek wordt uitgevoerd onder toezicht van een instelling die is erkend voor het afgeven van
      kwaliteitsverklaringen op basis van de desbetreffende nationale BRL, of op basis van een nationale BRL voor een
      vergelijkbare bouwstof.

      3 Bij het toelatingsonderzoek worden ten minste tien partijen onderzocht door middel van een partijkeuring als
      bedoeld in [paragraaf 3.4][ref2]. Hierbij geldt dat:

      a. de partijen qua grootte, productieproces, grondstoffen, productieperiode en afzet waarin het toelatingsonderzoek
      wordt uitgevoerd, representatief zijn voor de productie en evenredig over de productieperiode zijn verdeeld, en

      b. het bepaalde onder a. blijkt uit een rapportage.

      4 Het is toegestaan om gebruik te maken van partijkeuringen uit een eerder toelatingsonderzoek en van eerdere
      verificatiekeuringen in het kader van een erkende kwaliteitsverklaring.

      5 De keuringen, bedoeld in het vorige lid, kunnen zijn uitgevoerd in gemeenschappelijke toelatingsonderzoeken en
      verificatie, mits de producent:

      a. ten minste één partijkeuring uitvoert die betrekking heeft op de eigen bouwstof, en

      b. onderbouwt dat de productiewijze en de grondstoffen voldoende aansluiten op die van de gemeenschappelijke
      cluster.

      6 De monsterneming voor de partijkeuring, bedoeld in het derde lid, kan door de producent worden uitgevoerd volgens
      de daarvoor geldende voorschriften in [bijlage C][ref3]. Bij het toelatingsonderzoek wordt dit gecontroleerd.

      7 Indien uit het toelatingsonderzoek blijkt dat aan [artikel 3.5.1][ref4] is voldaan, geeft de
      certificeringsinstelling een eenmalige verklaring af dat de producent onder de gegeven omstandigheden een
      fabrikant-eigenverklaring kan afgeven.

      8 De producent meldt het gebruik van de fabrikant-eigenverklaring uiterlijk binnen een maand aan Onze Minister en
      stuurt daarbij de verklaring van de certificeringsinstelling mee.

      9 Onze Minister draagt zorg voor de bekendmaking van de producenten die een fabrikant-eigenverklaring mogen afgeven
      voor de daarbij genoemde bouwstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel3.5.1
      [ref2]: https://wetten.overheid.nl/BWBR0023085#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0023085
      [ref4]: https://wetten.overheid.nl/BWBR0023085#Artikel3.5.1
    url: https://wetten.overheid.nl/BWBR0023085/2023-07-01#Artikel3.5.2
