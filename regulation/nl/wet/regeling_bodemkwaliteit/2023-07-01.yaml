  - number: 4.7.1
    text: |-
      De bodemfuncties worden als volgt ingedeeld:

      a. wonen met tuin;

      b. plaatsen waar kinderen spelen;

      i. met een gemiddelde ecologische waarde;

      ii. met weinig ecologische waarde.

      c. moestuinen en volkstuinen:

      i. grote moestuinen: grote stads- en dorpstuinen en boerderijtuinen met een grote hoeveelheid gewasteelt;

      ii. kleinere moestuinen: grote stads- en dorpstuinen met een redelijke hoeveelheid gewasteelt.

      d. landbouw;

      e. natuur;

      f. groen met natuurwaarden;

      g. ander groen, bebouwing, infrastructuur en industrie:

      i. nagenoeg geheel verhard;

      ii. niet nagenoeg geheel verhard.
    url: https://wetten.overheid.nl/BWBR0023085/2023-07-01#Artikel4.7.1
  - number: 4.8.1
    text: |-
      1 Het bevoegd gezag bepaalt de gevolgen, bedoeld in de [artikelen 47, onder d][ref1], en
      [48, onder c, van het besluit][ref2], met de risicomodule ‘gevolgen lokale maximale waarden’ van de Risicotoolbox
      Bodembeheer, aangeboden als webapplicatie op www.risicotoolboxbodem.nl, indien:

      a. de lokale maximale waarden hoger zijn dan:

      1°. de maximale waarden voor de bodemfunctieklasse van het bodembeheergebied;

      2°. de maximale waarden van de kwaliteitsklasse van de bodem van het bodembeheergebied, of

      3°. de achtergrondwaarden, indien de kwaliteit van de bodem in het bodembeheergebied de achtergrondwaarden niet
      overschrijdt of

      4°. de maximale waarden van de kwaliteitsklasse van de bodem of oever van een oppervlaktewaterlichaam in het
      bodembeheergebied of

      5°. de achtergrondwaarden, indien de kwaliteit van de bodem of oever van een oppervlaktewaterlichaam in het
      bodembeheergebied de achtergrondwaarden niet overschrijdt

      2 De gevolgen, bedoeld in het eerste lid, worden afgeleid van ten minste de volgende gegevens:

      a. de lokale maximale waarden, bedoeld in [artikel 44, eerste lid, van het besluit][ref3];

      b. de fractie organisch stof en lutum van de bodem in het bodembeheergebied;

      c. de zuurgraad van de bodem in het bodembeheergebied.

      3 De risicomodule maakt uitsluitend gebruik van de formularia van de volgende risicomodellen:

      a. CSOIL 2000_RTB_1.0,

      b. AgroRisk_RTB_1.0,

      c. EcoRisk_RTB_1.0,

      d. Sanscrit 1.01, en

      e. Risicotoolbox waterbodems 2.0.

      4 De risicomodule bepaalt bij een kwaliteit van de bodem op het niveau van de lokale maximale waarden de
      gevolgen van het toepassen van grond of baggerspecie op of in de bodem voor de bodemfuncties, bedoeld in
      [artikel 4.7.1][ref4], en in een oppervlaktewaterlichaam voor het actuele gebruik van een oppervlaktewaterlichaam.

      5 De risicomodule deelt de gevolgen als volgt in:

      a. de bodem in het bodembeheergebied is blijvend geschikt voor alle actuele of toekomstige bodemfuncties of het
      actuele of toekomstige gebruik van een oppervlaktewaterlichaam in het betreffende gebied,

      b. bij de actuele of toekomstige bodemfuncties of het actuele of voorgenomen gebruik van een
      oppervlaktewaterlichaam in het bodembeheergebied, kan sprake zijn van overschrijding van de waarden, bedoeld in
      [artikel 44, tweede lid, sub c, van het besluit][ref5], of

      c. er is noch sprake van uitkomst a, noch van uitkomst b.

      6 De risicomodule genereert een rapportage van de gegevens, bedoeld in het tweede lid, en de gevolgen, bedoeld in
      het vijfde lid.


