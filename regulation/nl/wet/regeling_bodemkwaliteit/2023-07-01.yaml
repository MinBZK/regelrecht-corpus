  - number: 5.1.10b
    text: |-
      1 Tot 1 januari 2020 is het toegestaan om ten behoeve van het afgeven van een milieuhygiënische verklaring voor
      de kwaliteit van de bodem of van de toe te passen grond of baggerspecie gebruik te maken van de resultaten van
      een vooronderzoek dat, in afwijking van [artikel 4.3.3][ref1], [4.3.4][ref2], onderscheidenlijk [4.3.5][ref3], is
      verricht overeenkomstig NEN 5725:2009, onderscheidenlijk 5717:2009, en heeft plaatsgevonden voor 1 januari 2019.

      2 Van de normdocumenten, genoemd in het eerste lid, worden de volgende uitgaven bedoeld:

        - NEN 5725:2009: Bodem – Landbodem – Strategie voor het uitvoeren van vooronderzoek bij verkennend en nader
      onderzoek;
        - NEN 5717:2009: Bodem – Waterbodem – Strategie voor het uitvoeren van vooronderzoek bij verkennend en nader
      onderzoek.


