  - number: 4.1.1
    text: |-
      1 Het percentage organisch stof in grond of baggerspecie wordt bepaald volgens NEN 5754.

      2 De hoeveelheid minerale delen met een maximale korrelgrootte van 2 millimeter en de van nature in de bodem
      en bodem of oever van een oppervlaktelichaam voorkomende schelpen en grind met een korrelgrootte van 2 tot 63
      millimeter in grond of baggerspecie worden bepaald volgens NEN 5753 en NEN 5104.

      3 De gehalten voor het toetsen aan de maximale waarden worden gebaseerd op het totaal, zijnde de gemeten gehalten,
      inclusief schelpen en grind. Indien de van nature in de bodem en bodem of oever van een oppervlaktewaterlichaam
      voorkomende massa schelpen en grind met een korrelgrootte van 2 tot 63 millimeter niet wordt betrokken bij het
      meten van het totaal gehalte, wordt het totaal gehalte bepaald op basis van de massafracties van het deel waarop
      het gemeten gehalte betrekking heeft plus het deel schelpen en grind.
    url: https://wetten.overheid.nl/BWBR0023085/2023-07-01#Artikel4.1.1
  - number: 4.2.1
    text: |-
      1 De gemeten gehalten worden voor lutum en organisch stof gecorrigeerd volgens de rekenregels in [bijlage G][ref1],
      onder III, om te bepalen of de kwaliteit van de grond of baggerspecie, die op of in de bodem wordt toegepast, een
      van de volgende waarden overschrijdt:

      a. de achtergrondwaarden, bedoeld in de tabellen 1 en 2 in [bijlage B][ref2];

      b. de maximale waarden voor de kwaliteitsklasse wonen of industrie, bedoeld in tabel 1 van [bijlage B][ref3];

      c. de emissietoetswaarden, bedoeld in de tabellen 1 en 2 in [bijlage B][ref4];

      d. de lokale maximale waarden, bedoeld in [artikel 44, eerste lid, van het besluit][ref5].

      2 De gemeten gehalten worden voor lutum en organisch stof gecorrigeerd, volgens de rekenregels in
      [bijlage G][ref6], onder III, om te bepalen of de kwaliteit van de grond of baggerspecie, die wordt toegepast in
      een oppervlaktewaterlichaam, een van de volgende waarden overschrijdt:

      a. de achtergrondwaarden, bedoeld in de tabellen 1 en 2 in [bijlage B][ref7];

      b. de maximale waarden voor kwaliteitsklasse A, bedoeld in tabel 2 van [bijlage B][ref8];

      c. de maximale waarden voor kwaliteitsklasse B, zijnde de interventiewaarden voor de bodem of oever van
      oppervlaktewaterlichamen, bedoeld in tabel 2 van [bijlage B][ref9],

      d. de lokale maximale waarden, bedoeld in [artikel 45, eerste lid, van het besluit][ref10];

      e. de emissietoetswaarden, bedoeld in de tabellen 1 en 2 in [bijlage B][ref11].

      3 In afwijking van het tweede lid, worden de gemeten gehalten voor lutum en organisch stof gecorrigeerd volgens
      de rekenregels in onderdeel III van [bijlage G][ref12], om te bepalen of de kwaliteit van de baggerspecie, die
      wordt toepast als bedoeld in [artikel 35 onder f, g en i van het besluit][ref13], een van de volgende waarden
      overschrijdt:

      a. de maximale waarden voor het verspreiden van baggerspecie over het aangrenzende perceel, bedoeld in tabel 1
      van [bijlage B][ref14];

      b. de maximale waarden voor het verspreiden van baggerspecie in een zoet oppervlaktewaterlichaam,
      bedoeld in tabel 2 van [bijlage B][ref15]. Voor stoffen waarvoor geen maximale waarde is opgenomen geldt
      [artikel 4.2.2, vierde en vijfde lid][ref16].


