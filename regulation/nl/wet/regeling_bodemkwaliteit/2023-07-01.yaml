        paragraaf: '3.5'
  - number: 3.6.1
    text: |-
      1 Het toelatingsonderzoek ter verkrijging van een erkende kwaliteitsverklaring wordt uitgevoerd door en onder
      toezicht van een instelling die is erkend voor het afgeven van kwaliteitsverklaringen en bestaat uit een
      productcontrole en een beoordeling van het kwaliteitssysteem.

      2 Bij de productcontrole controleert de instelling, bedoeld in het eerste lid, of de bouwstof voldoet aan de
      maximale waarden, bedoeld in [artikel 3.3.3, eerste lid][ref1], door vijf of tien partijen te onderwerpen aan een
      partijkeuring, als bedoeld in [paragraaf 3.4][ref2]. Hierbij geldt dat:

      a. de onderzochte partijen qua grootte, productieproces, grondstoffen, productieperiode en afzet waarin het
      toelatingsonderzoek wordt uitgevoerd, representatief zijn voor de productie en evenredig over de periode zijn
      verdeeld, en

      b. het onder a. bepaalde blijkt uit een rapportage.

      3 De monsterneming bij de partijkeuring, bedoeld in het vorige lid, mag worden uitgevoerd door de producent,
      volgens de daarvoor geldende voorschriften in [bijlage C][ref3]. Bij het toelatingsonderzoek wordt dit
      gecontroleerd.

      4 Bij de beoordeling van de kwaliteitsbewaking beoordeelt de instelling, bedoeld in het eerste lid, de
      doeltreffendheid en correcte toepassing van het kwaliteitssysteem op de productielocatie.

      5 Op basis van de uitkomsten van het toelatingsonderzoek kan de instelling, bedoeld in het eerste lid, een
      kwaliteitsverklaring afgeven voor de productie van de desbetreffende bouwstof.


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel3.3.3
      [ref2]: https://wetten.overheid.nl/BWBR0023085#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0023085
