  - number: 5.1.11
    text: |-
      1 Deze regeling treedt in werking met ingang van de volgende tijdstippen:

      a. de [hoofdstukken 1][ref1] en [2][ref2]: 1 januari 2008;

      b. de [hoofdstukken 3][ref3] en [5][ref4]: 1 juli 2008 met dien verstande dat de,[artikelen 5.1.2][ref5],
      [5.1.5, onderdelen A2, A3, en F tot en met K][ref6], [5.1.9][ref7] en [5.1.11][ref8] op 1 januari 2008 in werking
      treden

      c. [hoofdstuk 4][ref9] voor toepassingen van grond of baggerspecie in oppervlaktewater als bedoeld in
      [artikel 35 sub a, c tot en met e, g en h van het Besluit bodemkwaliteit][ref10]:1 januari 2008 en voor overige
      toepassingen van grond of baggerspecie: 1 juli 2008;

      2 In afwijking van het eerste lid onderdeel a, treedt [artikel 2.1, eerste lid][ref11], in werking met ingang van:

      a. 31 december 2010 voor de werkzaamheden, bedoeld in [artikel 2.1, onder o tot en met r][ref12];

      b. 1 juli 2008 voor de werkzaamheid, bedoeld in [artikel 2.1, sub b][ref13], voor zover die bestaat uit
      milieukundige begeleiding van nazorg bij een sanering van de bodem onder oppervlaktewater.

      c. 31 december 2008 voor de werkzaamheid, bedoeld in [artikel 2.1, sub e][ref14], voor zover die bestaat uit
      het ontwateren van baggerspecie en de werkzaamheid, bedoeld in [artikel 2.1, sub j][ref15], indien de persoon of
      instelling, die deze werkzaamheid verricht, beschikt over een geldige erkenning voor een kwaliteitsverklaring op
      grond van het [Bouwstoffenbesluit bodem- en oppervlaktewaterenbescherming][ref16], die vóór de inwerkingtreding van
      deze regeling is verleend.


