  - number: 3.6.4
    text: |-
      Een erkende kwaliteitsverklaring bevat de volgende gegevens:

      a. de naam en het adres van de persoon of instelling die is erkend voor het produceren op basis van een nationale
      BRL;

      b. de certificatie-eisen waaraan de producten zijn getoetst;

      c. de specificatie van het product;

      d. de datum vanaf welke het certificaat geldig is;

      e. eventuele bijzondere voorwaarden voor het gebruik van het product;

      f. een uniek nummer waarmee naar de verklaring kan worden verwezen.
    url: https://wetten.overheid.nl/BWBR0023085/2023-07-01#Artikel3.6.4
  - number: 3.7.1
    text: Een producent geeft niet meer dan één type milieuhygiënische verklaring af per product.
    url: https://wetten.overheid.nl/BWBR0023085/2023-07-01#Artikel3.7.1
  - number: 3.7.2
    text: |-
      1 De afleveringsbon bevat de volgende gegevens:

      a. het nummer en type van de milieuhygiënische verklaring;

      b. de datum van afgifte van de partij;

      c. de producent, de leverancier of de productielocatie van de partij;

      d. de naam van de bouwstof waarop de afleveringsbon betrekking heeft;

      e. de aard van de bouwstof;

      f. de grootte van de partij in tonnen;

      2 Bij een partij is geen afleveringsbon vereist, indien:

      a. een daarbij behorende partijkeuring aanwezig is;

      b. de partij wordt hergebruikt als bedoeld in [artikel 29, eerste lid, onder c van het besluit][ref1].

      c. de partij wordt toegepast door de natuurlijke personen, bedoeld in
      [artikel 29, eerste lid, onder e van het besluit][ref2]

      3 De eigenaar van de partij maakt in zijn administratie inzichtelijk waar de partij vandaan komt, of deze is
      gesplitst en wat de bestemming is.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Artikel29
    url: https://wetten.overheid.nl/BWBR0023085/2023-07-01#Artikel3.7.2
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0022929
        artikel: '29'
  - number: 3.7.3
    text: |-
      1 Indien een partij wordt gesplitst in deelpartijen, voldoen de deelpartijen aan de maximale samenstellings- en
      emissiewaarden van [bijlage A][ref1].

      2 Voor de deelpartijen kan gebruik worden gemaakt van de milieuhygiënische verklaring voor de oorspronkelijke
      partij, mits de relatie tussen deelpartij en oorspronkelijke partij of productieproces, alsmede wie de splitsing
      heeft uitgevoerd en wanneer, wordt aangegeven op een afleveringsbon.

      3 Degene die de splitsing laat uitvoeren, is verantwoordelijk voor het gestelde in het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-07-01#Artikel3.7.3
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 3.7.4
    text: |-
      1 Indien partijen worden samengevoegd, kan gebruik worden gemaakt van de milieuhygiënische verklaringen voor de
      oorspronkelijke partijen, mits de relatie tussen samengevoegde partij en de oorspronkelijke partijen, alsmede wie
      de samenvoeging heeft uitgevoerd en wanneer, wordt aangegeven op een afleveringsbon.

      2 Het eerste lid geldt niet voor het samenvoegen van verschillende soorten bouwstoffen.

      3 Het is niet toegestaan om bouwstoffen samen te voegen met materialen die geen bouwstoffen zijn, anders dan bij de
      productie van een bouwstof.
    url: https://wetten.overheid.nl/BWBR0023085/2023-07-01#Artikel3.7.4
  - number: 3.8.1
    text: |-
      De melding, bedoeld in [artikel 32, eerste en tweede lid, van het besluit][ref1]wordt gedaan door middel van het
      daartoe bestemde formulier dat verkrijgbaar is bij Bodem+.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel32
    url: https://wetten.overheid.nl/BWBR0023085/2023-07-01#Artikel3.8.1
    references:
