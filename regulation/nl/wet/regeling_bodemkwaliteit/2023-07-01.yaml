  - number: 3.9.8
    text: |-
      1 Vanaf het moment dat de eerste laag IBC-bouwstof wordt aangebracht, wordt:

      a. de afstand tussen de onderkant van de IBC-bouwstof en de HG3 jaarlijks gecontroleerd door middel van veldwerk
      ter vaststelling van de HG3 en de hoogteligging van de onderkant van de IBC-bouwstof;

      b. de kwaliteit van het grondwater, eenmaal in de twee jaar bepaald door middel van veldwerk waarbij het grondwater
      wordt bemonsterd en geanalyseerd, en

      c. de staat waarin het werk verkeert jaarlijks gecontroleerd door een daartoe erkend bedrijf.

      2 De resultaten van de controle, bedoeld in het vorige lid, worden elke twee jaar gemeld aan Onze Minister. Indien
      sprake is van een afwijking wordt dit direct aan Onze Minister gemeld.

      3 Indien na drie jaar is gebleken dat de afstand, bedoeld in het eerste lid, onderdeel a, nooit kleiner is
      geweest dan één meter, kan met instemming van het bevoegd gezag de frequentie van de vaststelling, bedoeld in dat
      onderdeel, worden verlaagd. Deze verplichting houdt in dat ten minste een keer in de vijf jaar de grondwaterstand
      wordt vastgesteld in de periode dat deze maximaal is.

      4 Indien na zes jaar is gebleken dat de kwaliteit van het grondwater niet is gewijzigd, kan met instemming van het
      bevoegd gezag de frequentie van de verplichting bedoeld in het eerste lid, onder b, worden verlaagd.
    url: https://wetten.overheid.nl/BWBR0023085/2023-07-01#Artikel3.9.8
  - number: 3.9.9
    text: |-
      Indien controlewerkzaamheden aantonen dat een toepassing van een IBC-bouwstof niet voldoet aan de daaraan gestelde
      eisen of negatieve effecten heeft, worden terstond maatregelen getroffen. Hiervoor wordt een plan van aanpak
      opgesteld, dat wordt aangeboden aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0023085/2023-07-01#Artikel3.9.9
  - number: 3.9.10
    text: |-
      1 Indien een isolerende voorziening wordt verwijderd, wordt de IBC-bouwstof dat niet meer is afgedicht binnen zes
      weken volledig verwijderd. Hierbij geldt [artikel 3.9.2, tiende lid, onder b][ref1].

      2 Indien een werk of deel van een werk waarin een IBC-bouwstof is toegepast is verwijderd, wordt de bodemkwaliteit
      onderzocht volgens het daarvoor geldende protocol , bedoeld in [bijlage D][ref2].

      3 Uiterlijk binnen twee maanden na het verwijderen van de IBC-bouwstof, wordt Onze Minister in kennis gesteld van
      de resultaten van het onderzoek, bedoeld in het tweede lid.

      4 Indien bij het onderzoek, bedoeld in het tweede lid, een bodemverontreiniging aantoont als gevolg van het
      toepassen van de IBC-bouwstof, wordt de oorspronkelijke bodemkwaliteit hersteld, zoals die is vastgesteld op grond
      van [artikel 3.9.5][ref3].

      5 Het onderzoek, bedoeld in het tweede lid, bestaat uit veldwerk en analyse voor milieuhygiënisch bodemonderzoek
      van de daaruit verkregen monsters van de bodem.


