    text: |-
      1 Voor enkelvoudige partijen zonder onderlinge samenhang die niet voldoen aan
      [artikel 3.6.1., tweede lid, onder a][ref1], kan een kwaliteitsverklaring worden afgegeven, mits elke partij
      wordt gekeurd volgens het partijkeuringsregime, bedoeld in [bijlage H][ref2] en voldoet aan de overige eisen van
