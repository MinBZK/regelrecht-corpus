  - number: 4.12.1
    text: |-
      1 Bij toepassingen als bedoeld in [artikel 63 van het besluit][ref1], overschrijdt de emissie van de grond of
      baggerspecie niet:

      a. de maximale emissiewaarden, bedoeld in tabel 1 van [bijlage B][ref2], indien het toepassingen op of in de bodem
      betreft;

      b. de maximale emissiewaarden, bedoeld in tabel 2 van [bijlage B][ref3], indien het toepassingen op of in de bodem
      of oever van een oppervlaktewaterlichaam betreft.

      2 Aan het eerste lid, aanhef en onderdeel a, wordt voldaan, indien de rekenkundig gemiddelde gehalten van de
      gemeten stoffen in de grond of baggerspecie de emissietoetswaarden, bedoeld in tabel 1 van [bijlage B][ref4], niet
      overschrijden.

      3 Aan het eerste lid, aanhef en onderdeel b, wordt voldaan, indien:

      a. de rekenkundig gemiddelde gehalten van de gemeten stoffen in de grond of baggerspecie de emissietoetswaarden,
      bedoeld in tabel 2 van [bijlage B][ref5], niet overschrijden, of

      b. de toepassing zich onder het waterniveau bevindt en is gelegen binnen het beheergebied van de
      waterkwaliteitsbeheerder waarvan de baggerspecie afkomstig is.

      4 [Artikel 4.2.1, eerste en tweede lid][ref6], en [artikel 4.2.2, zevende lid][ref7], zijn van overeenkomstige
      toepassing.


