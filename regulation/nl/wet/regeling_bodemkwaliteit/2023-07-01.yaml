  - number: 3.5.4
    text: |-
      1 De interne kwaliteitsbewaking bij de productie van de bouwstof bevat:

      a. een kwaliteitssysteem dat waarborgt dat bouwstoffen worden geproduceerd die voldoen aan de eisen van
      [artikel 3.5.1][ref1];

      b. een kwaliteitshandboek waarin het kwaliteitssysteem inzichtelijk is gedocumenteerd, met heldere voorschriften en
      procedures voor alle productiestappen en controles;

      c. een register waarin de resultaten van het kwaliteitssysteem worden bijgehouden, waaronder een beschrijving van
      het product, de productiedatum, de gebruikte testmethode, de productiekenmerken, de gebruikte acceptatiecriteria
      voor grondstoffen en een overzicht van geleverde partijen met vermelding van de afnemer.

      2 Het kwaliteitssysteem, bedoeld in het eerste lid, onder a, bevat:

      a. de gegevens van de functionaris die is belast met het beheer van het kwaliteitssysteem;

      b. een functionerend IKB-schema dat betrekking heeft op de grondstoffen, het productieproces, de eindproducten,
      de status van meet- en bepalingsmethoden, het interne transport, de opslag en de identificatie van half-
      en eindproducten. Uit dit IKB-schema blijkt dat bij voortduring bouwstoffen worden vervaardigd die aan
      [artikel 3.5.1][ref2] voldoen, en

      c. een beschrijving hoe elk van de onderdelen onder b wordt gecontroleerd, welke controlemethode en
      controlefrequentie worden gehanteerd en de wijze waarop de controleresultaten worden geregistreerd en bewaard.

      3 Indien bouwstoffen of partijen niet voldoen aan de kwaliteit die is vastgesteld in het toelatingsonderzoek worden
      correctieve maatregelen genomen. Deze maatregelen worden bijgehouden in het register.

      4 De producent bewaart de informatie over het kwaliteitssysteem en het register ten minste vijf jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel3.5.1
      [ref2]: https://wetten.overheid.nl/BWBR0023085#Artikel3.5.1
    url: https://wetten.overheid.nl/BWBR0023085/2023-07-01#Artikel3.5.4
