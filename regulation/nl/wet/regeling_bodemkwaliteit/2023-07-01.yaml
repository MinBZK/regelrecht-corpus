  - number: 4.3.4
    text: |-
      1 Bodemonderzoeken zijn toegestaan als milieuhygiënische verklaring voor de kwaliteit van de bodem, uitgezonderd de
      bodem of oever van een oppervlaktewaterlichaam, als wordt voldaan aan de volgende voorwaarden:

      a. het onderzoek is verricht overeenkomstig de onderzoeksstrategieën, bedoeld in NEN 5740, voor:

      1° een onverdachte locatie;

      2° een grootschalig onverdachte locatie;

      3° een onbekende bodembelasting;

      4° de toetsing of er sprake is van een schone bodem;

      5° de toetsing of er sprake is van een schone bodem op grootschalige locaties;

      6° de partijkeuring van niet-schone grond uit een diffuus belast gebied met een heterogene verdeling van de
      verontreinigende stof; en

      b. het onderzoek is gebaseerd op een vooronderzoek dat overeenkomstig NEN 5725 is verricht en dat
      heeft plaatsgevonden in aanvulling op het onderzoek van het standaard stoffenpakket, bedoeld in
      [artikel 4.5.1, eerste lid][ref1], met inbegrip van onderzoek naar de eventuele aanwezigheid van andere
      verontreinigingen, die op grond van de historie van de te onderzoeken locatie kunnen worden verwacht en die
      relevant kunnen zijn voor het toepassen van een partij grond of baggerspecie.

      2 Bodemonderzoeken zijn toegestaan als milieuhygiënische verklaring voor de kwaliteit van de toe te passen grond,
      mits deze voldoen aan de onderzoeksstrategieën, bedoeld in NEN 5740, en zijn gebaseerd op een vooronderzoek
      overeenkomstig NEN 5725 waarbij het standaard stoffenpakket is aangevuld met andere verontreinigende stoffen die op
      grond van historie van de te onderzoeken locatie kunnen worden verwacht, voor:

      a. het onderzoek is verricht overeenkomstig de onderzoeksstrategieën, bedoeld in NEN 5740, voor:

      1° de toetsing of er sprake is van een schone bodem;

      2° de toetsing of er sprake is van een schone bodem op grootschalige locaties;

      3° de partijkeuring van niet-schone grond uit een diffuus belast gebied met een heterogene verdeling van de
      verontreinigende stof; en

      b. het onderzoek is gebaseerd op een vooronderzoek dat overeenkomstig NEN 5725 is verricht waarbij het standaard
      stoffenpakket is aangevuld met andere verontreinigende stoffen die op grond van historie van de te onderzoeken
      locatie kunnen worden verwacht.

      3 Bodemonderzoeken zijn toegestaan als milieuhygiënische verklaring voor de kwaliteit van de bodem of oever van een
      oppervlaktewaterlichaam of baggerspecie, mits deze voldoen aan de onderzoeksstrategieën, bedoeld in NEN 5720, en
      zijn gebaseerd op een vooronderzoek overeenkomstig NEN 5717 waarbij het standaard stoffenpakket is aangevuld met
      andere verontreinigende stoffen die op grond van historie van de te onderzoeken locatie kunnen worden verwacht.

      4 In afwijking van het derde lid kan voor het verspreiden van baggerspecie als bedoeld in
      [artikel 35, onder f of i, van het besluit][ref2], voor het bodemonderzoek worden volstaan met een vooronderzoek
      overeenkomstig NEN 5717, indien daaruit is gebleken dat de baggerspecie niet afkomstig is van oppervlaktewateren in
      de gebieden:

      a. die zijn bebouwd, daaronder begrepen kassen- en industriegebieden;

      b. waar regelmatig beroeps- of pleziermotorvaart plaatsvindt;

      c. waar geloosd wordt na de laatste keer dat er is gebaggerd;

      d. grenzend aan wegen met een verkeersintensiteit van meer dan 500 voertuigen per dag, tenzij het betreft
      bermsloten op een afstand van ten minste 15 meter waarin de wegriolering niet loost;

      e. met een oeverbeschoeiing die bestaat uit met gecreosoteerde olie behandeld hout;

      f. waarvan redelijkerwijs vermoed kan worden dat deze niet voldoen aan de maximale waarden voor het verspreiden van
      baggerspecie als bedoeld in [artikel 35, onder f en i, van het besluit][ref3], of

      g. die niet zijn aangegeven in een beheerplan als bedoeld in [artikel 4.6 van de Waterwet][ref4].

      5 Bij bodemonderzoeken als bedoeld in het eerste en derde lid kan onderzoek naar de kwaliteit van het grondwater
      en de kwaliteit van de grond van de ontvangende bodem, die zich bevindt op 0,5 meter en dieper onder het maaiveld,
      achterwege blijven.


