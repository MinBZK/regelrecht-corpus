  - number: 3.9.5
    text: |-
      1 Alvorens de IBC-bouwstof wordt toegepast, wordt een nulonderzoek uitgevoerd op de bodem, inclusief het
      grondwater, volgens het daarvoor geldende protocol, bedoeld in [bijlage D][ref1].

      2 Het nulonderzoek bestaat uit veldwerk en analyse voor milieuhygiënisch bodemonderzoek van de daaruit verkregen
      monsters.

      3 Indien getoetst wordt aan de [Circulaire bodemsanering per 1 juli 2013][ref2], worden de regels in
      [bijlage G][ref3], onder III en IV, toegepast.


