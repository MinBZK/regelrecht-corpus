  - number: 4.11.1
    text: |-
      1 De tabellen 1 en 2 van [bijlage B][ref1] bevatten de maximale waarden voor:

      a. het verspreiden van baggerspecie over het aangrenzende perceel,

      b. het verspreiden van baggerspecie in een zoet oppervlaktewaterlichaam;

      c. het verspreiden van baggerspecie in een zout oppervlaktewaterlichaam, en

      d. het tijdelijk opslaan van baggerspecie op percelen gelegen naast de watergang waaruit de baggerspecie afkomstig
      is.

      2 Bij de toetsing aan de maximale waarden, bedoeld in het eerste lid, onder c, mogen de gehalten van de gemeten
      stoffen voor ten hoogste twee niet-prioritaire stoffen hoger zijn dan de maximale waarden, waarbij de verhoging per
      stof ten hoogste 50% ten opzichte van de maximale waarde voor verspreiding van baggerspecie in zout water bedraagt.

      3 De stoffen behorend tot de groep van de PCB’s zijn uitgezonderd van het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0023085
