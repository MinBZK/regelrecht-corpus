  - number: 3.9.2
    text: |-
      1 De bovenzijde en zijkanten van een IBC-bouwstof worden binnen drie maanden nadat een laag van de IBC-bouwstof is
      aangebracht, voorzien van een isolerende voorziening die bestaat uit:

      a. een bentonietmat;

      b. een laag zandbentonietpolymeergel, of

      c. een kunststof HDPE-folie met een laagdikte tussen 1,9 en 2,1 mm en voldoet aan de eisen die daaraan zijn gesteld
      in de in de [bijlagen C][ref1] en [D][ref2] genoemde normdocumenten.

      2 De isolerende voorziening heeft een maximaal toegestane lekkage van 6 mm per jaar bij de 0,2 meter waterdruk
      gedurende 200 dagen per jaar en heeft een levensduur van minimaal 100 jaar.

      3 De isolerende voorziening, bedoeld in het eerste lid onder a of b, wordt beschermd tegen aantasting door de IBC-
      bouwstof door een diffusieremmende laag van bitumenemulsie in een hoeveelheid van 4 kg/m2 of door kunststoffolie
      met een laagdikte van ten minste 0,5 mm en een tolerantie op die dikte van 5% volgens de voorschriften in de
      daarvoor geldende normdocumenten en werkvoorschrift, bedoeld in [bijlage D][ref3].

      4 Indien de isolerende voorziening, bedoeld in het eerste lid onder a of b, l wordt toegepast in een
      wegenbouwkundige constructie, wordt deze beschermd tegen aantasting door strooizouten door kunststoffolie met een
      laagdikte van ten minste 0,5 millimeter, volgens de voorschriften in de daarvoor geldende normdocumenten, bedoeld
      in [bijlage D][ref4].

      5 Indien een IBC-bouwstof als wegfunderingsmateriaal wordt toegepast, functioneert in afwijking van het
      eerste lid de vloeistofdichte wegverharding, aangelegd volgens de voorschriften in de daarvoor geldende
      normdocumenten, bedoeld in [categorie 1 van bijlage C][ref5], als isolerende voorziening. Overeenkomstig de schone-
      schouderconstructie, bedoeld in CROW-publicatie 125, wordt hierbij een bouwstof, niet-zijnde een IBC-bouwstof,
      aangebracht onder de randen van de wegverharding over een breedte gelijk aan de dikte van de IBC-bouwstof in de
      fundering en met een minimumbreedte van 0,30 meter.

      6 Indien een IBC-bouwstof als constructieve ophoging in een wegenbouwkundig werk wordt toegepast, functioneert
      in afwijking van het eerste lid de vloeistofdichte wegverharding die is aangelegd volgens de voorschriften in de
      toepasselijke normdocumenten, bedoeld in categorie 1 van [bijlage C][ref6], als isolerende voorziening op de kruin.
      Op de taluds wordt een isolerende voorziening overeenkomstig het eerste lid aangebracht met een verankeringslengte
      op de kruin van minimaal vijf meter. De afstand tussen de bovenzijde van de wegverharding en de bovenzijde van de
      IBC-bouwstof bedraagt maximaal twee meter.

      7 Indien een IBC-bouwstof als funderingsmateriaal onder bebouwing wordt toegepast, functioneert, in afwijking van
      het eerste lid, de vloeistofdichte bebouwing inclusief de randbalken van de bebouwing als isolerende voorziening.

      8 De constructie waarin een IBC-bouwstof wordt toegepast, wordt zodanig ontworpen dat het regenwater zonder
      stagnatie wordt afgevoerd door:

      a. in geval van een constructie met een afdeklaag, een doorlatende laag op de afdichting die bestaat uit een laag
      zand met een dikte van minimaal 0,25 meter en een permeabiliteitcoëfficiënt van minimaal 1,4 x 10-4 m/s of een
      hieraan gelijkwaardige drainagevoorziening;

      b. een afschot dat na de eindzetting, bedoeld in [artikel 3.9.1, tweede lid][ref7], ten minste 2% in dwarsprofiel
      bedraagt, en

      c. een randvoorziening die voorkomt dat afstromend water leidt tot waterverzadiging langs de rand en het talud of
      onvoldoende drooglegging onder de IBC-bouwstof.

      9 De materialen, bedoeld in het eerste tot en met het zevende lid, worden zodanig gekozen en toegepast dat deze
      gedurende de levensduur van het werk volledig hun functie kunnen vervullen.

      10 Een tijdelijke isolerende voorziening wordt aangebracht, indien:

      a. de in het eerste lid genoemde termijn niet wordt gehaald;

      b. gedurende ten minste zeven dagen in het werk geen IBC-bouwstoffen worden aangebracht of verwijderd.

      11 Voor de tijdelijke isolerende voorziening geldt bij toepassing en beheer de maximaal toegestane lekkage bedoeld
      in het tweede lid.


