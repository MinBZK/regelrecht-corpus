  - number: 4.3.3
    text: |-
      1 Partijkeuringen zijn niet toegestaan als milieuhygiënische verklaring als uit het vooronderzoek is gebleken
      dat de partij is ontstaan door het samenvoegen van verschillende partijen grond of baggerspecie overeenkomstig
      [artikel 4.3.2][ref1].

      2 Partijkeuringen zijn toegestaan als milieuhygiënische verklaring voor de kwaliteit van de toe te passen grond of
      baggerspecie, mits deze zijn gebaseerd op:

      a. een vooronderzoek dat overeenkomstig NEN 5725, onderscheidenlijk NEN 5717 in aanvulling op het onderzoek van het
      standaard stoffenpakket, bedoeld in [artikel 4.5.1, eerste lid][ref2], is verricht, met inbegrip van onderzoek naar
      de eventuele aanwezigheid van andere verontreinigingen, die op grond van de ontstaansgeschiedenis van de partij
      kunnen worden verwacht en die een partij grond of baggerspecie ongeschikt kunnen maken voor toepassing;

      b. een onderzoek dat in aanvulling op het onderzoek van het standaard stoffenpakket, bedoeld in
      [artikel 4.5.1, eerste lid][ref3], is verricht naar de eventuele aanwezigheid van andere verontreinigingen, die een
      partij grond of baggerspecie ongeschikt kunnen maken voor toepassing, indien de partij is gereinigd overeenkomstig
      BRL 7500 door een bedrijf dat daartoe over een erkenning op grond van het besluit beschikt;

      c. een onderzoek dat in aanvulling op het onderzoek van het standaard stoffenpakket, bedoeld in
      [artikel 4.5.1, eerste lid][ref4], is verricht naar de eventuele aanwezigheid van andere verontreinigingen, die
      een partij grond of baggerspecie ongeschikt kunnen maken voor toepassing, indien de partij als nevenproduct is
      vrijgekomen bij het bewerken van een product waarbij aanhangende grond vrijkomt.

      3 Voor een partijkeuring geldt dat:

      a. de grootte van de partij maximaal 10.000 ton bedraagt;

      b. monsters worden genomen die uit ten minste 100 aselect of systematisch als punten van een regelmatig raster over
      de hele partij genomen grepen bestaan;

      c. de grepen evenredig worden verdeeld over ten minste twee te analyseren mengmonsters; en

      d. bij een asbestanalyse wordt het gemiddelde berekend volgens NEN 5707.

      4 Bij toepassingen als bedoeld in [artikel 63 van het Besluit][ref5]:

      a. wordt de emissie bepaald door middel van de kolomproef volgens NEN 7373 of NEN 7383 aan de hand van ten minste
      één mengmonster, zoals bedoeld in het derde lid, onder c;

      b. wordt, indien bij de kolomproef door slechte doorlatendheid van het onderzochte materiaal onvoldoende vloeistof
      door de kolom stroomt, de emissie berekend aan de hand van de formule in [Bijlage K][ref6]; en

      c. gelden, indien de emissie, bedoeld onder b, kleiner is dan L/S=2, voor het desbetreffende materiaal geen
      maximale emissiewaarden.

      5 De uitkomst van de partijkeuring wordt vastgelegd in een milieuhygiënische verklaring, die ten minste de volgende
      gegevens bevat:

      a. de naam en het adres van de monsternemer en van het laboratorium;

      b. de data waarop monsterneming, monstervoorbehandeling en analyse zijn uitgevoerd;

      c. een verwijzing naar de gebruikte normdocumenten en methoden, en een onderbouwing van eventuele afwijkingen
      hiervan, indien deze het analyseresultaat kunnen beïnvloeden;

      d. het volledig ingevulde monsternemingsformulier en monsternemingsplan of een kopie daarvan;

      e. een beschrijving van de partij, waaronder ligging, kenmerken en partijgrootte;

      f. het analyserapport van het laboratorium, inclusief de rekenkundige gemiddelden van de gemeten gehalten en
      indien van toepassing de gemeten emissies, een onderbouwing van de gekozen parameters, en de verhouding tussen de
      meetwaarden en daaruit voortvloeiende conclusies;

      g. een beschrijving van het onderzoek naar de ontstaansgeschiedenis van de partij grond of baggerspecie;

      h. een beschrijving van het onderzoek naar de aanwezigheid van:

      1° relevante verontreinigende stoffen die in [bijlage B][ref7] bij deze regeling zijn vermeld en waarvoor een
      normwaarde is opgenomen, en de waarde daarvan, uitgedrukt in mg/kg droge stof,

      2° relevante andere verontreinigende stoffen dan in [bijlage B][ref8] bij deze regeling zijn vermeld of
      verontreinigende stoffen waarvoor in die bijlage geen normwaarde is opgenomen, en de waarden daarvan, uitgedrukt in
      mg/kg droge stof, en

      3° relevant bodemvreemd materiaal anders dan steenachtig materiaal en hout, zoals plastic en piepschuim.

      i. een uniek nummer.

      6 In afwijking van het derde lid, onder a, geldt voor de bepaling van het gehalte aan asbest in de bodem en
      partijen grond overeenkomstig NEN 5707, een maximale partijgrootte van 2.000 ton.

      7 In afwijking van het derde lid, onder b, kunnen monsters die zich bevinden onder een verhardingslaag of een diepe
      bodemlaag overeenkomstig VKB-protocol 1001 worden genomen.

      8 In afwijking van het derde lid, onder b, worden monsters die worden genomen ten behoeve van onderzoek naar
      vluchtige verbindingen genomen overeenkomstig de werkwijze die daarvoor is beschreven is in VKB-protocol 1001.

      9 In afwijking van het derde lid, onder b, kunnen monsters ten behoeve van onderzoek naar asbest ook worden
      genomen volgens methode III zoals beschreven in bijlage 7 bij protocol 1001, zoals vermeld bij categorie 9 in
      [bijlage C][ref9].

      10 In afwijking van het derde lid, onder c, worden monsters die worden geanalyseerd ten behoeve van onderzoek naar
      vluchtige verbindingen geanalyseerd volgens de werkwijze die daarvoor is beschreven is in AP04-SG.


