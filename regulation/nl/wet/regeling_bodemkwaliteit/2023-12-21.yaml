        bwb_id: BWBR0023085
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.8'
  - number: 4.14.1
    text: |-
      Bij toepassing van tarragrond gelden de achtergrondwaarden alsmede de maximale waarden voor de kwaliteitsklasse
      wonen en industrie niet voor de stoffen cresolen (som), fenol, tolueen en minerale olie, indien de aanwezigheid van
      die stoffen in de tarragrond een gevolg is van natuurlijke processen.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.14.1
  - number: 4.14.2.1
    text: |-
      Bij toepassing van tarragrond van aardappelen gelden de achtergrondwaarden en de maximale waarden
      voor de kwaliteitsklassen wonen en industrie niet voor de stof monochlooranilinen (som), opgenomen in
      [tabel 1 van bijlage B][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.14.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 4.14.2.2
    text: |-
      Tarragrond van aardappelen die zijn behandeld met chloorprofam wordt uitsluitend toegepast op de
      bodem, uitgezonderd de bodem of oever van een oppervlaktewaterlichaam, boven het maaiveld, voor
      zover niet gelegen in een Natura 2000-gebied of in de ecologische hoofdstructuur, bedoeld in
      [artikel 2.10.1 van het Besluit algemene regels ruimtelijke ordening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030378#Artikel2
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.14.2
    references:
      - id: ref1
        bwb_id: BWBR0030378
        artikel: '2'
  - number: 4.14.2.3
    text: |-
      De toegepaste tarragrond is schoon en onverdacht en bevat geen toevoegingen, met uitzondering van chloorprofam
      overeenkomstig de ingevolge de [Wet gewasbeschermingsmiddelen en biociden][ref1] toegestane dosering.


