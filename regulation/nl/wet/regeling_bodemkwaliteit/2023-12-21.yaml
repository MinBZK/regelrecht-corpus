  - number: 1.1.2
    text: 'Voor de toepassing van het besluit wordt onder grond of baggerspecie mede verstaan grond of baggerspecie waarin:'
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel1.1
  - number: 1.1.2.a
    text: |-
      ten hoogste 20 gewichtsprocenten bodemvreemd materiaal voorkomt dat voorafgaand aan het ontgraven of bewerken
      in de grond of baggerspecie aanwezig was en waarvan niet is te voorkomen dat de grond of baggerspecie daarmee is
      vermengd, voor zover het steenachtig materiaal of hout betreft; en
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel1.1
  - number: 1.1.2.b
    text: |-
      alleen sporadisch ander bodemvreemd materiaal dan steenachtig materiaal of hout als bedoeld onder a voorkomt, dat
      voorafgaand aan het ontgraven of bewerken in de grond of baggerspecie aanwezig was, voor zover redelijkerwijs niet
      kan worden gevergd dat het uit de grond of baggerspecie wordt verwijderd voordat het wordt toegepast.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel1.1
  - number: '1.2'
    text: |-
