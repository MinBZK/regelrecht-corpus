articles:
  - number: 1.1.1
    text: |-
      In deze regeling wordt verstaan onder: Aantoonbaarheidsgrens: laagste gehalte van een parameter waarbij de
      aanwezigheid daarvan aantoonbaar is volgens AP 04, bedoeld in [bijlage C][ref1] voor bouwstoffen en volgens
      [bijlage L][ref2] voor bodem, grond en baggerspecie; ASTM-norm: normdocument uitgegeven door de American Society
      for Testing and Materials, waarvan de uitgave is opgenomen in [bijlage D][ref3], onderscheidenlijk [E][ref4];
      Bepalingsgrens: laagste kwantificeerbare gehalte van een parameter, dat voor bouwstoffen overeenkomt met driemaal
      de aantoonbaarheidsgrens en voor bodem, grond en baggerspecie is opgenomen in [bijlage L][ref5] ; Besluit:
      [Besluit bodemkwaliteit][ref6]; Bodem+: onderdeel van Rijkswaterstaat; Bodemkwaliteitszone: aaneengesloten deel
      of meerdere niet aaneengesloten delen van een beheersgebied met een gelijke ontstaans- en gebruiksgeschiedenis,
      als gevolg waarvan sprake is van een vergelijkbare actuele kwaliteit van de bodem; BRL: beoordelingsrichtlijn,
      zijnde een door het college van deskundigen bindend verklaard document dat wordt gehanteerd als grondslag voor de
      afgifte en instandhouding van certificaten; CAS-nr: uniek identificatienummer dat is toegekend aan alle chemische
      stoffen die zijn geregistreerd door de Chemical Abstracts Service, die onderdeel is van de American Chemical
      Society. College van deskundigen: door de Raad voor Accreditatie geaccepteerd college dat een of meer BRL’en onder
      beheer heeft en waarin de bij certificatie belanghebbende partijen zijn vertegenwoordigd; CROW: kenniscentrum
      voor infrastructuur, verkeer, vervoer en openbare ruimte te Ede; CROW publicatie: publicatie van het CROW, waarvan
      de uitgave is opgenomen in [bijlage D][ref7]; Deelpartij: partij die is afgezonderd van een gekeurde partij;
      Gestandaardiseerde gehalten: volgens [onderdeel III in bijlage G][ref8] naar standaardbodem gecorrigeerde gehalten
      in de bodem of oever van een oppervlaktewaterlichaam, grond of baggerspecie; HG3: het rekenkundig gemiddelde van
      de drie hoogste grondwaterstanden per hydrologisch jaar; Hydrologisch jaar: hydrologisch jaar als gedefinieerd
      in [artikel 1, eerste lid, van het Stortbesluit bodembescherming][ref9]; K-waarde: waarde die een maat vormt
      voor de keuringsfrequentie bij erkende kwaliteitsverklaringen en een criterium geeft voor het afgeven van een
      fabrikant-eigenverklaring; Kengetal: statistische maat voor de verdeling van de gemeten gehalten binnen een
      bodemkwaliteitszone; Lutum: gewichtspercentage minerale bestanddelen met een diameter kleiner dan 2 µm, betrokken
      op het totale drooggewicht van grond of baggerspecie; MsPAF: Meer stoffen-Potentieel Aangetaste Fractie van lagere
      organismen, zijnde een aanduiding voor ecologische risico’s als gevolg van bodemverontreiniging; Nationale BRL:
      door de Harmonisatie Commissie Bouw aanvaarde BRL voor het afgeven van kwaliteitsverklaringen; NEN: Nederlandse
      Norm, uitgegeven door het Nederlands Normalisatie-instituut, waarvan de uitgave is opgenomen in [bijlage D][ref10];
      NEN-EN: Europese Norm, uitgegeven door het Nederlands Normalisatie-instituut, waarvan de uitgave is opgenomen in
      [bijlage D][ref11]; NEN-ISO: Internationale Norm, uitgegeven door het Nederlands Normalisatie-instituut, waarvan
      de uitgave is opgenomen in [bijlage D][ref12]; NPR: Nederlandse Praktijkrichtlijn van het Nederlands Normalisatie-
      instituut, waarvan de uitgave is opgenomen in [bijlage D][ref13]; NVN: Nederlandse Voornorm, vooruitlopend
      op een NEN-norm, waarvan de uitgave is opgenomen in [bijlage D][ref14]; P95: 95-percentielwaarde, zijnde een
      kengetal van de kwaliteit van de bodem binnen een bodemkwaliteitszone, welke per stof wordt uitgedrukt in een
      gehalte (mg/kg droge stof), betreffende de waarde waarvoor geldt dat ten minste 95% van de meetwaarden voor de
      stof binnen de bodemkwaliteitszone een waarde heeft die kleiner dan of gelijk is aan deze waarde, berekend met
      de ‘Empirical distribution function with interpolation (MS Excel) method’]; Sanering van de bodem: beperken en
      zoveel mogelijk ongedaan maken van verontreiniging en de directe gevolgen daarvan of van dreigende verontreiniging
      van de bodem, alsmede de nazorg daarvan; Standaardbodem: bodem met 25% lutum en 10% organische stof; tarragrond:
      aanhangende grond die vrijkomt bij het behandelen van het gewas na de oogst; zoet oppervlaktewaterlichaam:
      oppervlaktewaterlichaam, niet zijnde een zout oppervlaktewaterlichaam; zout oppervlaktewaterlichaam: Zeeuwse Delta,
      Waddenzee of Noordzee, inclusief de havens die hiermee in open verbinding staan en die geen open verbinding hebben
      met hun achterland.


