        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
        afdeling: '1'
  - number: 4.13.1.2
    text: |-
      Er is sprake van een overtreding van [artikel 37, eerste lid van het besluit][ref1], indien het in het eerste lid
      bedoelde onderzoek uitwijst dat de maximale waarden, bedoeld in [artikel 4.2.2][ref2], met ten minste een factor
      1,4 worden overschreden, ongeacht de variatie in het onderzoeksresultaat ten gevolge van de mate van heterogeniteit
      van de partij.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0023085#Artikel4
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.13.1
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '37'
      - id: ref2
        bwb_id: BWBR0023085
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
        afdeling: '1'
  - number: 4.13.2
    text: |-
      Bij het uitoefenen van toezicht op de naleving van de vereisten voor het afgeven van een fabrikant-eigen
      verklaringen voor grond of baggerspecie is [artikel 3.8.3][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel3
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.13.2
    references:
