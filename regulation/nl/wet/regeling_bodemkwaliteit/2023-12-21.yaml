      - id: ref2
        bwb_id: BWBR0023085
        artikel: '2'
        hoofdstuk: '2'
  - number: 5.1.9.3
    text: |-
      Tot en met 30 juni 2007 geldt een vrijstelling van de verboden van [artikel 15 van het besluit][ref1] voor
      de werkzaamheid, bedoeld in [artikel 2.1, eerste lid, onder i][ref2], indien de persoon of instelling,
      die deze werkzaamheid verricht, beschikt over een geldige aanwijzing als monsternemer op grond van het
      [Bouwstoffenbesluit bodem- en oppervlaktewaterenbescherming][ref3], die vóór 1 oktober 2006 is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0023085#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007667
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel5.1.9
