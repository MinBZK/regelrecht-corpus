      [ref4]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '27'
      - id: ref2
        bwb_id: BWBR0003994
        artikel: '30'
