        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
        afdeling: '1'
  - number: 4.4.1.1
    text: |-
      De kwaliteit van de grond of baggerspecie die op of in de bodem wordt toegepast, wordt uitgedrukt in de
      ‘kwaliteitsklasse wonen’, indien deze:
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.4.1
  - number: 4.4.1.1.a
    text: de achtergrondwaarden overschrijdt, en
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.4.1
  - number: 4.4.1.1.b
    text: de maximale waarden voor de kwaliteitsklasse wonen niet overschrijdt.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.4.1
  - number: 4.4.1.2
    text: |-
      De kwaliteit van de grond of baggerspecie die op of in de bodem wordt toegepast, wordt uitgedrukt in de
      ‘kwaliteitsklasse industrie’, indien deze:
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.4.1
  - number: 4.4.1.2.a
    text: de maximale waarden voor de kwaliteitsklasse wonen overschrijdt, en
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.4.1
  - number: 4.4.1.2.b
    text: de maximale waarden voor de kwaliteitsklasse industrie niet overschrijdt.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.4.1
  - number: 4.4.1.3
    text: |-
      De kwaliteit van grond of baggerspecie die op of in de bodem of oever van een oppervlaktewaterlichaam wordt
      toegepast, wordt uitgedrukt in de ‘kwaliteitsklasse A’, indien deze:
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.4.1
  - number: 4.4.1.3.a
    text: de achtergrondwaarden overschrijdt en
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.4.1
  - number: 4.4.1.3.b
    text: de maximale waarden voor de kwaliteitsklasse A niet overschrijdt.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.4.1
  - number: 4.4.1.4
    text: |-
      De kwaliteit van grond of baggerspecie die op of in de bodem of oever van een oppervlaktewaterlichaam wordt
      toegepast, wordt uitgedrukt in de ‘kwaliteitsklasse B’, indien deze:
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.4.1
  - number: 4.4.1.4.a
    text: de maximale waarden voor de kwaliteitsklasse A overschrijdt en
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.4.1
  - number: 4.4.1.4.b
    text: de maximale waarden voor de kwaliteitsklasse B niet overschrijdt.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.4.1
  - number: 4.4.1.5
    text: |-
      De indeling in de kwaliteitsklassen, bedoeld in het eerste tot en met het vierde lid, is gebaseerd op de
      milieuhygiënische verklaring van de grond of baggerspecie.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.4.1
  - number: 4.4.1.6
    text: Grond of baggerspecie die de interventiewaarden overschrijdt, wordt niet in een kwaliteitsklasse ingedeeld.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.4.1
  - number: 4.5.1.1
    text: |-
      De milieuhygiënische verklaring van de toe te passen grond of baggerspecie of van de bodem op de
      toepassingslocatie, geeft aan:
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.5.1
  - number: 4.5.1.1.a
    text: voor welke stoffen de kans op overschrijding van de achtergrondwaarden hoger is dan 5%,
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.5.1
  - number: 4.5.1.1.b
    text: |-
      welke stoffen van natuurlijke oorsprong of vanwege het gebruik de achtergrondwaarden overschrijden, en kunnen
      voorkomen in het gebied waar de grond of baggerspecie van afkomstig is;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.5.1
  - number: 4.5.1.1.c
    text: |-
      de emissie van de stoffen waarvan de kans op overschrijding van de maximale emissiewaarden hoger is
      dan 5% voor toepassingen als bedoeld in [artikel 63 van het besluit][ref1], tenzij wordt voldaan aan
      [artikel 4.12.1, tweede of derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel63
      [ref2]: https://wetten.overheid.nl/BWBR0023085#Artikel4
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.5.1
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '63'
      - id: ref2
        bwb_id: BWBR0023085
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.12'
        afdeling: '4'
  - number: 4.5.1.2
    text: |-
      Het eerste lid, onder a, is niet van toepassing op baggerspecie van oppervlaktewaterlichamen die in beheer zijn bij
      het Rijk, indien de baggerspecie daarin wordt toegepast.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.5.1
  - number: 4.6.1
    text: |-
      Het model-meldingsformulier, bedoeld in [artikel 42, zesde lid, van het besluit][ref1], is verkrijgbaar bij Bodem+.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel42
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.6.1
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '42'
  - number: 4.7.1
    text: 'De bodemfuncties worden als volgt ingedeeld:'
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.7.1
  - number: 4.7.1.a
    text: wonen met tuin;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.7.1
  - number: 4.7.1.b
    text: plaatsen waar kinderen spelen;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.7.1
  - number: 4.7.1.b.i
    text: met een gemiddelde ecologische waarde;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.7.1
  - number: 4.7.1.b.ii
    text: met weinig ecologische waarde.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.7.1
  - number: 4.7.1.c
    text: 'moestuinen en volkstuinen:'
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.7.1
  - number: 4.7.1.c.i
    text: 'grote moestuinen: grote stads- en dorpstuinen en boerderijtuinen met een grote hoeveelheid gewasteelt;'
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.7.1
  - number: 4.7.1.c.ii
    text: 'kleinere moestuinen: grote stads- en dorpstuinen met een redelijke hoeveelheid gewasteelt.'
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.7.1
  - number: 4.7.1.d
    text: landbouw;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.7.1
  - number: 4.7.1.e
    text: natuur;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.7.1
  - number: 4.7.1.f
    text: groen met natuurwaarden;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.7.1
  - number: 4.7.1.g
    text: 'ander groen, bebouwing, infrastructuur en industrie:'
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.7.1
  - number: 4.7.1.g.i
    text: nagenoeg geheel verhard;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.7.1
  - number: 4.7.1.g.ii
    text: niet nagenoeg geheel verhard.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.7.1
  - number: 4.8.1.1
    text: |-
      Het bevoegd gezag bepaalt de gevolgen, bedoeld in de [artikelen 47, onder d][ref1], en
      [48, onder c, van het besluit][ref2], met de risicomodule ‘gevolgen lokale maximale waarden’ van de Risicotoolbox
      Bodembeheer, aangeboden als webapplicatie op www.risicotoolboxbodem.nl, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Artikel48
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.8.1
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '47'
      - id: ref2
        bwb_id: BWBR0022929
        artikel: '48'
  - number: 4.8.1.1.a
    text: 'de lokale maximale waarden hoger zijn dan:'
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.8.1
  - number: 4.8.1.1.a.1°
    text: de maximale waarden voor de bodemfunctieklasse van het bodembeheergebied;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.8.1
  - number: 4.8.1.1.a.2°
    text: de maximale waarden van de kwaliteitsklasse van de bodem van het bodembeheergebied, of
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.8.1
  - number: 4.8.1.1.a.3°
    text: |-
      de achtergrondwaarden, indien de kwaliteit van de bodem in het bodembeheergebied de achtergrondwaarden niet
      overschrijdt of
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.8.1
  - number: 4.8.1.1.a.4°
    text: |-
      de maximale waarden van de kwaliteitsklasse van de bodem of oever van een oppervlaktewaterlichaam in het
      bodembeheergebied of
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.8.1
  - number: 4.8.1.1.a.5°
    text: |-
      de achtergrondwaarden, indien de kwaliteit van de bodem of oever van een oppervlaktewaterlichaam in het
      bodembeheergebied de achtergrondwaarden niet overschrijdt
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.8.1
  - number: 4.8.1.2
    text: 'De gevolgen, bedoeld in het eerste lid, worden afgeleid van ten minste de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.8.1
  - number: 4.8.1.2.a
    text: |-
      de lokale maximale waarden, bedoeld in [artikel 44, eerste lid, van het besluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel44
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.8.1
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '44'
  - number: 4.8.1.2.b
    text: de fractie organisch stof en lutum van de bodem in het bodembeheergebied;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.8.1
  - number: 4.8.1.2.c
    text: de zuurgraad van de bodem in het bodembeheergebied.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.8.1
  - number: 4.8.1.3
    text: 'De risicomodule maakt uitsluitend gebruik van de formularia van de volgende risicomodellen:'
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.8.1
  - number: 4.8.1.3.a
    text: CSOIL 2000_RTB_1.0,
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.8.1
  - number: 4.8.1.3.b
    text: AgroRisk_RTB_1.0,
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.8.1
  - number: 4.8.1.3.c
    text: EcoRisk_RTB_1.0,
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.8.1
  - number: 4.8.1.3.d
    text: Sanscrit 1.01, en
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.8.1
  - number: 4.8.1.3.e
    text: Risicotoolbox waterbodems 2.0.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.8.1
  - number: 4.8.1.4
    text: |-
      De risicomodule bepaalt bij een kwaliteit van de bodem op het niveau van de lokale maximale waarden de gevolgen van
      het toepassen van grond of baggerspecie op of in de bodem voor de bodemfuncties, bedoeld in [artikel 4.7.1][ref1],
      en in een oppervlaktewaterlichaam voor het actuele gebruik van een oppervlaktewaterlichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel4
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.8.1
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.7'
        afdeling: '2'
  - number: 4.8.1.5
    text: 'De risicomodule deelt de gevolgen als volgt in:'
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.8.1
  - number: 4.8.1.5.a
    text: |-
      de bodem in het bodembeheergebied is blijvend geschikt voor alle actuele of toekomstige bodemfuncties of het
      actuele of toekomstige gebruik van een oppervlaktewaterlichaam in het betreffende gebied,
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.8.1
  - number: 4.8.1.5.b
    text: |-
      bij de actuele of toekomstige bodemfuncties of het actuele of voorgenomen gebruik van een
      oppervlaktewaterlichaam in het bodembeheergebied, kan sprake zijn van overschrijding van de waarden, bedoeld in
      [artikel 44, tweede lid, sub c, van het besluit][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel44
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.8.1
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '44'
  - number: 4.8.1.5.c
    text: er is noch sprake van uitkomst a, noch van uitkomst b.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.8.1
  - number: 4.8.1.6
    text: |-
      De risicomodule genereert een rapportage van de gegevens, bedoeld in het tweede lid, en de gevolgen, bedoeld in het
      vijfde lid.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.8.1
  - number: 4.8.2
    text: |-
      Een kaart van de actuele kwaliteit van de bodem als bedoeld in [artikel 47, onder a, van het besluit][ref1] wordt
      opgesteld met inachtneming van de richtlijnen, bedoeld in [bijlage D, onderdeel II][ref2], en de eisen, gesteld
      in [bijlage M][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0023085
      [ref3]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.8.2
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '47'
      - id: ref2
        bwb_id: BWBR0023085
      - id: ref3
        bwb_id: BWBR0023085
  - number: 4.8.3
    text: |-
      Het bevoegd gezag stelt voor toepassingen als bedoeld in [artikel 35, onder g, van het besluit][ref1],
      voorzover het toepassingen betreft in de Waddenzee, de Zeeuwse Delta of de Noordzee voor tributyltin geen lokale
      maximale waarde vast boven de maximale waarde voor tributyltin voor verspreiden van baggerspecie in een zout
      oppervlaktewaterlichaam, zoals opgenomen in tabel 2 van [bijlage B][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.8.3
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '35'
      - id: ref2
        bwb_id: BWBR0023085
  - number: 4.9.1
    text: |-
      De maximale waarden voor de bodemfunctieklassen wonen en industrie zijn opgenomen in [tabel 1 van bijlage B][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.9.1
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 4.9.2.1
    text: |-
      Bodembeheergebieden met de bodemfuncties, genoemd in [artikel 4.7.1, onder a, b, en f,][ref1] worden ingedeeld in
      de bodemfunctieklasse wonen.


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel4
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.9.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.7'
        afdeling: '2'
  - number: 4.9.2.2
    text: |-
      Bodembeheergebieden met de bodemfuncties, genoemd in [artikel 4.7.1., onder g][ref1], worden ingedeeld in de
      bodemfunctieklasse industrie.


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel4
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.9.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.7'
        afdeling: '2'
  - number: 4.9.2.3
    text: |-
      De eisen, bedoeld in [artikel 55, derde lid, van het besluit][ref1], zijn opgenomen in [bijlage J][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.9.2
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '55'
      - id: ref2
        bwb_id: BWBR0023085
  - number: 4.10.1.1
    text: |-
      De maximale waarden voor de kwaliteitsklassen wonen en industrie voor de bodem, zijn opgenomen in
      [tabel 1 van bijlage B][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.10.1
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 4.10.1.2
    text: |-
      De maximale waarden voor de kwaliteitsklassen A en B voor de bodem of oever van een oppervlaktewaterlichaam, zijn
      opgenomen in [tabel 2 van bijlage B][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.10.1
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 4.10.2.1
    text: |-
      Voor het vaststellen van de kwaliteitsklasse van de bodem wordt een correctie op de gemeten gehalten voor lutum en
      organisch stof uitgevoerd volgens de rekenregels in [onderdeel III van bijlage G][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.10.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 4.10.2.2
    text: |-
      De bodem wordt uitgedrukt in de kwaliteitsklasse wonen, indien de rekenkundige gemiddelden van de gehalten van
      de gemeten stoffen in de bodem of in de bodemkwaliteitszone de achtergrondwaarden overschrijden, maar niet de
      maximale waarden voor de kwaliteitsklasse wonen. Om te bepalen of er sprake is van een overschrijding van de
      achtergrondwaarden is [artikel 4.2.2, vierde, vijfde en achtste lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel4
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.10.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
        afdeling: '1'
  - number: 4.10.2.3
    text: |-
      De kwaliteit van de bodem overschrijdt niet de maximale waarden voor de kwaliteitsklasse wonen, indien ten opzichte
      van de maximale waarden voor de kwaliteitsklasse wonen:
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.10.2
  - number: 4.10.2.3.a
    text: |-
      bij meting van ten minste 7 stoffen waarvoor een waarde is opgenomen in de tabellen 1 en 2 van [bijlage B][ref1],
      maximaal 2 stoffen verhoogd zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.10.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 4.10.2.3.b
    text: |-
      bij meting van ten minste 16 stoffen waarvoor een waarde is opgenomen in de tabellen 1 en 2 van [bijlage B][ref1],
      maximaal 3 stoffen verhoogd zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.10.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 4.10.2.3.c
    text: |-
      bij meting van ten minste 27 stoffen waarvoor een waarde is opgenomen in de tabellen 1 en 2 van [bijlage B][ref1],
      maximaal 4 stoffen verhoogd zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.10.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 4.10.2.3.d
    text: |-
      bij meting van ten minste 37 stoffen maximaal waarvoor een waarde is opgenomen in de tabellen 1 en 2 van
      [bijlage B][ref1], 5 stoffen verhoogd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.10.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 4.10.2.4
    text: |-
      Een verhoging als bedoeld in het derde lid bedraagt per stof ten hoogste de maximale waarde voor de
      kwaliteitsklasse wonen voor die stof, vermeerderd met de daarvoor geldende achtergrondwaarde en de gehalten van
      alle verhoogde stoffen de maximale waarden voor de kwaliteitsklasse industrie niet overschrijden.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.10.2
  - number: 4.10.2.5
    text: |-
      De bodem wordt uitgedrukt in de kwaliteitsklasse industrie, indien de rekenkundige gemiddelden van de gehalten van
      de gemeten stoffen in de bodem of in de bodemkwaliteitszone de maximale waarden voor de bodemfunctieklasse wonen
      overschrijden, maar niet de maximale waarden voor de bodemfunctieklasse industrie.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.10.2
  - number: 4.10.2a
    text: |-
      Een kaart van de actuele kwaliteit van de bodem als bedoeld in [artikel 57, tweede lid, van het besluit][ref1],
      wordt opgesteld met inachtneming van de richtlijnen, bedoeld in [bijlage D, onder II][ref2], en voldoet aan de
      eisen, gesteld in [bijlage M][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0023085
      [ref3]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.10.2a
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '57'
      - id: ref2
        bwb_id: BWBR0023085
      - id: ref3
        bwb_id: BWBR0023085
  - number: 4.10.3.1
    text: |-
      Voor het vaststellen van de kwaliteitsklasse van de bodem of oever van een oppervlaktewaterlichaam
      wordt een correctie op de gemeten gehalten lutum en organisch stof uitgevoerd volgens de rekenregels in
      [onderdeel III van bijlage G][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.10.3
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 4.10.3.2
    text: |-
      De bodem of oever van een oppervlaktewaterlichaam wordt uitgedrukt in kwaliteitsklasse A, indien de rekenkundige
      gemiddelden van de gehalten van de gemeten stoffen in de bodem of in de bodemkwaliteitszone de achtergrondwaarden
      overschrijden, maar niet de maximale waarden voor kwaliteitsklasse A. Om te bepalen of er sprake is van
      een overschrijding van de achtergrondwaarden is [artikel 4.2.2, vierde, vijfde en achtste lid][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel4
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.10.3
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
        afdeling: '1'
  - number: 4.10.3.3
    text: |-
      De bodem of oever van een oppervlaktewaterlichaam wordt uitgedrukt in kwaliteitsklasse B, indien de rekenkundige
      gemiddelden van de gehalten van de gemeten stoffen in de bodem of in de bodemkwaliteitszone de maximale waarden
      voor kwaliteitsklasse A overschrijden, maar niet de maximale waarden voor kwaliteitsklasse B.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.10.3
  - number: 4.11.1.1
    text: |-
      De tabellen 1 en 2 van [bijlage B][ref1] bevatten de maximale waarden voor:


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.11.1
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 4.11.1.1.a
    text: het verspreiden van baggerspecie over het aangrenzende perceel,
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.11.1
  - number: 4.11.1.1.b
    text: het verspreiden van baggerspecie in een zoet oppervlaktewaterlichaam;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.11.1
  - number: 4.11.1.1.c
    text: het verspreiden van baggerspecie in een zout oppervlaktewaterlichaam, en
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.11.1
  - number: 4.11.1.1.d
    text: het tijdelijk opslaan van baggerspecie op percelen gelegen naast de watergang waaruit de baggerspecie afkomstig is.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.11.1
  - number: 4.11.1.2
    text: |-
      Bij de toetsing aan de maximale waarden, bedoeld in het eerste lid, onder c, mogen de gehalten van de gemeten
      stoffen voor ten hoogste twee niet-prioritaire stoffen hoger zijn dan de maximale waarden, waarbij de verhoging per
      stof ten hoogste 50% ten opzichte van de maximale waarde voor verspreiding van baggerspecie in zout water bedraagt.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.11.1
  - number: 4.11.1.3
    text: De stoffen behorend tot de groep van de PCB’s zijn uitgezonderd van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.11.1
  - number: 4.12.1.1
    text: |-
      Bij toepassingen als bedoeld in [artikel 63 van het besluit][ref1], overschrijdt de emissie van de grond of
      baggerspecie niet:


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel63
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.12.1
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '63'
  - number: 4.12.1.1.a
    text: |-
      de maximale emissiewaarden, bedoeld in tabel 1 van [bijlage B][ref1], indien het toepassingen op of in de bodem
      betreft;


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.12.1
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 4.12.1.1.b
    text: |-
      de maximale emissiewaarden, bedoeld in tabel 2 van [bijlage B][ref1], indien het toepassingen op of in de bodem of
      oever van een oppervlaktewaterlichaam betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.12.1
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 4.12.1.2
    text: |-
      Aan het eerste lid, aanhef en onderdeel a, wordt voldaan, indien de rekenkundig gemiddelde gehalten van de
      gemeten stoffen in de grond of baggerspecie de emissietoetswaarden, bedoeld in tabel 1 van [bijlage B][ref1], niet
      overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.12.1
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 4.12.1.3
    text: 'Aan het eerste lid, aanhef en onderdeel b, wordt voldaan, indien:'
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.12.1
  - number: 4.12.1.3.a
    text: |-
      de rekenkundig gemiddelde gehalten van de gemeten stoffen in de grond of baggerspecie de emissietoetswaarden,
      bedoeld in tabel 2 van [bijlage B][ref1], niet overschrijden, of


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.12.1
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 4.12.1.3.b
    text: |-
      de toepassing zich onder het waterniveau bevindt en is gelegen binnen het beheergebied van de
      waterkwaliteitsbeheerder waarvan de baggerspecie afkomstig is.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.12.1
  - number: 4.12.1.4
    text: |-
      [Artikel 4.2.1, eerste en tweede lid][ref1], en [artikel 4.2.2, zevende lid][ref2], zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0023085#Artikel4
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.12.1
    references:
