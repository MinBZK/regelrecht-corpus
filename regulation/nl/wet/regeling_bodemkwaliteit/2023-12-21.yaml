        hoofdstuk: '2'
  - number: 5.1.9.2
    text: |-
      Tot en met 30 juni 2007 geldt een vrijstelling van de verboden van [artikel 15 van het besluit][ref1] voor de
      werkzaamheden, bedoeld in [artikel 2.1., eerste lid, onder d, e, h, k en l][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0023085#Artikel2
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel5.1.9
