        afdeling: '1'
  - number: 4.13.1.1
    text: |-
      Een onderzoek in het kader van de handhaving van [artikel 37, eerste lid van het besluit][ref1] wordt verricht
      overeenkomstig [artikel 4.3.3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0023085#Artikel4
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.13.1
    references:
