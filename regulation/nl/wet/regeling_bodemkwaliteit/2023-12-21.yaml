  - number: 5.1.9.1
    text: |-
      Tot en met 31 december 2006 geldt een vrijstelling van de verboden van [artikel 15 van het besluit][ref1] voor de
      werkzaamheden, bedoeld in [artikel 2.1, eerste lid, onder a en g][ref2].


