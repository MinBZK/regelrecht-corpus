      voor de werkzaamheid, bedoeld in [artikel 2.1, eerste lid, onder b][ref2], indien de instelling, die deze
      werkzaamheid verricht, beschikt over een geldige aanwijzing als certificeringsinstelling voor het afgeven van
      kwaliteitsverklaringen op grond van het [Bouwstoffenbesluit bodem- en oppervlaktewaterenbescherming][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0023085#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007667
