        bwb_id: BWBR0025458
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0025458
        artikel: '6'
  - number: 2.1.4
    text: |-
      De werkzaamheden, bedoeld in het eerste lid, zijn beschreven in de normdocumenten, aangewezen in
      [artikel 2.7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel2
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.2.1
    text: |-
      De erkenning voor de werkzaamheden, bedoeld in
      [artikel 2.1, eerste lid, onderdelen a, e, h, j, k, m, p, r, s, u en v][ref1], wordt gebaseerd op een certificaat.
      De erkenning voor de werkzaamheden, bedoeld in artikel 2.1, eerste lid, onderdeel b, c, d, f, g, n, o en q, wordt
      gebaseerd op een accreditatie. De erkenning voor de werkzaamheid, bedoeld in artikel 2.1, eerste lid, onderdeel i,
      l en t, kan zowel op een certificaat als een accreditatie worden gebaseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel2
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.2.2
    text: |-
      Een erkenning voor de werkzaamheid bedoeld in [artikel 2.1, eerste lid, onderdeel c][ref1], wordt alleen verleend
      indien de desbetreffende instelling is geaccrediteerd voor alle verrichtingen van een van de pakketten bedoeld in
      de onderdelen genoemd bij [categorie 3 in bijlage C][ref2]. Indien de aanvraag betrekking heeft op het onderdeel
      samenstelling grond of het onderdeel samenstelling bouwstoffen dan kan de erkenning alleen worden verleend indien
      de instelling is geaccrediteerd voor pakket SG1, onderscheidenlijk pakket SB1. In afwijking van de eerste volzin
      is het, met uitzondering van de verrichtingen die betrekking hebben op uitloogonderzoek, toegestaan één verrichting
      van een pakket uit te besteden aan een instelling die voor die verrichting beschikt over een erkenning.


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0023085
  - number: 2.2.3
    text: |-
      Een erkenning voor de werkzaamheid, bedoeld in [artikel 2.1, eerste lid, onder d][ref1], wordt alleen verleend
      indien de desbetreffende instelling is geaccrediteerd voor alle verrichtingen van het onderdeel SIKB-protocol 3010
      of SIKB-protocol 3110, zoals vermeld bij [categorie 4 in bijlage C][ref2]. In afwijking van de vorige volzin is
      het toegestaan één verrichting van een SIKB-protocol uit te besteden aan een instelling die voor die verrichting
      beschikt over een erkenning.


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0023085
  - number: 2.2.4
    text: |-
      Voor zover een erkenning voor de werkzaamheid, bedoeld in [artikel 2.1, eerste lid, onder l][ref1], wordt
      gebaseerd op een accreditatie, wordt deze erkenning alleen verleend indien de desbetreffende instelling is
      geaccrediteerd voor alle verrichtingen van het onderdeel SIKB-protocol 2001 of SIKB-protocol 2002, zoals vermeld
      bij [categorie 12 in bijlage C][ref2]. In afwijking van de vorige volzin is het toegestaan ten hoogste drie
      verrichtingen (NEN normen) van een SIKB-protocol uit te besteden aan een instelling die voor die verrichting
      beschikt over een erkenning.


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0023085
  - number: 2.2.5
    text: |-
      In afwijking van het eerste lid wordt een erkenning voor de werkzaamheid, bedoeld in
      [artikel 2.1, eerste lid, onderdeel f][ref1], voor zover deze werkzaamheid de certificering van personen en
      instellingen betreft voor de werkzaamheid, bedoeld in artikel 2.1, eerste lid, onderdeel t, niet gebaseerd op een
      accreditatie.


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel2
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '2'
        hoofdstuk: '2'
  - number: '2.3'
    text: |-
      Als handelingen als bedoeld in [artikel 9, tweede lid, van het besluit][ref1] worden aangewezen de werkzaamheden,
      bedoeld in [artikel 2.1, eerste lid, onder h, i en l][ref2], voorzover deze handelingen in het tweede lid van
      laatstgenoemd [artikel][ref3] zijn aangemerkt als werkzaamheid.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0023085#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0023085#Artikel2
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0023085
        artikel: '2'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0023085
        artikel: '2'
        hoofdstuk: '2'
  - number: '2.4'
    text: |-
      Als website, bedoeld in [artikel 9 van het besluit][ref1] wordt aangewezen: http://www.bodemplus.nl.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel9
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '9'
  - number: 2.5.1
    text: |-
      Als handeling als bedoeld in [artikel 17, eerste lid, van het besluit][ref1] worden aangewezen de werkzaamheden,
      bedoeld in [artikel 2.1, eerste lid][ref2], onder c, d, i, l en, voor zover het de verificatie betreft, h.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0023085#Artikel2
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0023085
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.5.2
    text: |-
      Als handeling als bedoeld in [artikel 17, tweede lid, van het besluit][ref1] worden aangewezen de werkzaamheden,
      bedoeld in [artikel 2.1, eerste lid][ref2], onder b, g, f, n en t.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0023085#Artikel2
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0023085
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.5.3
    text: |-
      Ten aanzien van het eerste en tweede lid is [artikel 2.1, tweede lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel2
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '2'
        hoofdstuk: '2'
  - number: '2.6'
    text: |-
      Het formulier, bedoeld in de [artikelen 10][ref1], [12, tweede lid][ref2], [19][ref3] en [20 van het besluit][ref4]
      is verkrijgbaar bij Bodem+.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0022929#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0022929#Artikel20
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0022929
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0022929
        artikel: '19'
      - id: ref4
        bwb_id: BWBR0022929
        artikel: '20'
  - number: '2.7'
    text: |-
      Voor een werkzaamheid is als normdocument aangewezen het document dat bij de categorie waartoe de werkzaamheid
      behoort in [bijlage C][ref1] is vermeld of een of meer onderdelen van zodanig document waarin de werkzaamheid wordt
      beschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 3.1.1.1
    text: |-
      Ingeval het onduidelijk is of een materiaal als bouwstof moet worden aangemerkt, worden de totaalgehalten aan
      silicium, calcium of aluminium daarin bepaald. Hiertoe worden aselect over de hele partij ten minste twaalf grepen
      genomen, die ieder worden verdeeld over drie mengmonsters.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.1.1
  - number: 3.1.1.2
    text: De mengmonsters worden voorbehandeld door ze te drogen bij 40 °C volgens NVN 7312.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.1.1
  - number: 3.1.1.3
    text: |-
      Elk mengmonster wordt verkleind met een kruisslagmolen of een vergelijkbare molen met een zeef van 500 µm.
      Vervolgens wordt het mengmonster verdeeld door middel van roterend verdelen, overeenkomstig NVN 7312 hoofdstuk
      7.7.2. Per mengmonster wordt één deelmonster van minimaal 250 gram verder vermalen tot 250 µm met gebruik van
      hoofdstuk 7.6.3 ‘Verkleinen tot deeltjes kleiner dan 125 µm’ van NVN 7312. De verkleinde deelmonsters worden
      geanalyseerd volgens [artikel 3.1.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel3
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.1.1
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.1.1.4
    text: |-
      Indien het materiaal bestaat uit elementen of proefstukken, worden daarvan stukken van ten minste 80 gram
      afgehaald. Het vierde lid, de tweede volzin uitgezonderd, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.1.1
  - number: 3.1.2.1
    text: |-
      De ontsluiting van de deelmonsters en de analyse van silicium, calcium of aluminium daarin worden uitgevoerd
      overeenkomstig ASTM-norm D 3682-13.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.1.2
  - number: 3.1.2.2
    text: |-
      Voor de berekening van de massa’s silicium, calcium en aluminium in de deelmonsters en van het gemiddelde
      percentage van deze stoffen in de bouwstof, wordt de werkwijze gehanteerd, zoals beschreven in [bijlage E][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.1.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 3.1.2.3
    text: De uitkomsten van de monsterneming, de analyse en de berekening worden vastgelegd in een rapportage.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.1.2
  - number: 3.2.1.1
    text: |-
      De bepaling of een bouwstof vormgegeven is, vindt plaats door het volume van de kleinste eenheid van de
      desbetreffende bouwstof te bepalen, indien de bouwstof bestaat uit elementen van ongeveer gelijke grootte.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.2.1
  - number: 3.2.1.2
    text: |-
      Het volume van een bouwstof wordt bepaald door de afmetingen ervan te bepalen en door van het totale volume het
      volume van de holten en gaten in het oppervlak af te trekken.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.2.1
  - number: 3.2.1.3
    text: |-
      Indien het volume van een bouwstof tussen 50 cm3 en 100 cm3 is, wordt het volume nader bepaald door onderdompeling
      van het element in water op de wijze, bepaald in hoofdstuk 8 van NEN-EN 13383-2 en door berekening met de in
      [bijlage F][ref1] aangegeven formule.


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.2.1
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 3.2.2.1
    text: |-
      De bepaling of een bouwstof vormgegeven is, vindt plaats door de korrelverdeling te bepalen met behulp van een
      zeefproef indien het een granulaire bouwstof betreft met een opbouw in korrelverdeling. Hierbij worden aselect over
      de hele partij zes monsters genomen uit een statische partij of drie monsters uit een stroom.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.2.2
  - number: 3.2.2.2
    text: Voor elk monster wordt één greep genomen volgens hoofdstuk 4.5 van NEN-EN 13383-2.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.2.2
  - number: 3.2.2.3
    text: |-
      De monsters zijn minimaal zo groot dat de getalswaarde van de massa in kg ten minste tweemaal de getalswaarde
      bedraagt van de d95 in mm. Hierbij is de d95 gelijk aan de maat van de zeef, waardoor ten minste 95% van de massa
      van een monster valt.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.2.2
  - number: 3.2.2.4
    text: De korrelverdeling van de monsters wordt bepaald volgens hoofdstuk 5 van NEN-EN 13383-2.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.2.2
  - number: 3.2.2.5
    text: |-
      Indien de korrelverdeling voldoet aan het gestelde in [bijlage F][ref1], wordt de bouwstof aangemerkt als bouwstof
      met een volume per kleinste eenheid van 50 cm3.


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.2.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 3.2.3
    text: |-
      Een bouwstof, met uitzondering van de bouwstoffen genoemd in [bijlage F][ref1], paragraaf 3, geldt als duurzaam
      vormvast indien deze in een diffusieproef volgens NEN 7375 gedurende 64 dagen minder massaverlies vertoont dan:


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.2.3
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 3.2.3.a
    text: |-
      1500 g/m2 voor lichtgebonden steenmengsels voor wegfunderingen, beproefd direct na een verhardingstijd van 28
      dagen,
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.2.3
  - number: 3.2.3.b
    text: |-
      500 g/m2 voor lichtgebonden steenmengsels, beproefd direct na een verhardingstijd van 91 dagen (verharding bij
      20 °C en bij een relatieve vochtigheid van tenminste 90%),
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.2.3
  - number: 3.2.3.c
    text: |-
      200 g/m2 voor cementgebonden minerale reststoffen, die worden toegepast als gebonden fundering in de GWW conform
      BRL 9322, of
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.2.3
  - number: 3.2.3.d
    text: 30 g/m2 voor alle andere materialen.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.2.3
  - number: 3.3.1.1
    text: |-
      De emissie van parameters uit niet-vormgegeven bouwstoffen, uit vormgegeven bouwstoffen waarvan de uitloging
      oplosbepaald is volgens de voorschriften van NEN 7375 en uit vormgegeven bouwstoffen met een open, afwaterende
      structuur, bedoeld in [bijlage F][ref1], paragraaf 4, wordt bepaald door middel van de kolomproef volgens NEN 7373
      of NEN 7383 of de beschikbaarheidsproef volgens NEN 7371.


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.3.1
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 3.3.1.2
    text: |-
      De emissie van parameters uit vormgegeven bouwstoffen, waarvan de uitloging diffusiebepaald is, wordt bepaald door
      middel van de diffusieproef volgens NEN 7375 of de proeven uit het eerste lid. De emissie wordt in de diffusieproef
      berekend over 64 dagen volgens NEN 7375 onderdeel 9.4.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.3.1
  - number: 3.3.1.3
    text: De samenstellingswaarden van bouwstoffen worden bepaald met de technieken beschreven in AP 04.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.3.1
  - number: 3.3.1.4
    text: |-
      Indien de bepaling van de samenstelling of emissie volgens AP04 is gekoppeld aan een specifieke wijze van
      toepassing, wordt:
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.3.1
  - number: 3.3.1.4.a
    text: |-
      deze toepassingsvoorwaarde gerapporteerd door de persoon of instelling die de bouwstof heeft onderzocht en
      weergegeven op de milieuhygiënische verklaring, en
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.3.1
  - number: 3.3.1.4.b
    text: de bouwstof op deze wijze toegepast.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.3.1
  - number: 3.3.2.1
    text: |-
      Indien bij de kolomproef door slechte doorlatendheid van het onderzochte materiaal onvoldoende vloeistof door de
      kolom stroomt, wordt de emissie berekend aan de hand van de formule in [bijlage K][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.3.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 3.3.2.2
    text: |-
      Indien de emissie, bedoeld in het eerste lid, kleiner is dan L/S=2, gelden voor het desbetreffende materiaal geen
      maximale emissiewaarden.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.3.2
  - number: 3.3.2.3
    text: |-
      Indien bij een diffusieproef volgens NEN 7375 voor een bepaalde parameter geen diffusiegecontroleerd traject kan
      worden vastgesteld, wordt de bovengrens van de uitloging volgens de methode beschreven in onderdeel 9.6 van NEN
      7375 berekend voor T=36500 dagen. Deze berekende bovengrens gedeeld door 24 geldt als de emissie uit de bouwstof.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.3.2
  - number: 3.3.3.1
    text: |-
      De maximale waarden voor de emissie uit vormgegeven, niet-vormgegeven en IBC-bouwstoffen en voor de samenstelling
      van bouwstoffen zijn opgenomen in [bijlage A][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.3.3
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 3.3.3.2
    text: |-
      Vormgegeven bouwstoffen waarvan de emissie van parameters uit de bouwstof is bepaald door middel van een van
      de proeven, bedoeld in [artikel 3.3.1, eerste lid][ref1], voldoen aan de maximale emissiewaarden anorganische
      parameters voor niet-vormgegeven bouwstoffen die zijn opgenomen in tabel 1 van [bijlage A][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.3.3
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0023085
  - number: 3.3.3.3
    text: |-
      Een bouwstof voldoet aan de maximale waarden, bedoeld in het eerste en tweede lid, indien de gemiddelde emissie-
      en samenstellingswaarden voor iedere parameter kleiner of gelijk zijn aan deze maximale waarden. Het gemiddelde
      wordt berekend door per parameter het gemiddelde te bepalen van de geanalyseerde mengmonsters, bedoeld in
      [3.4.1, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel3
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.3.3
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 3.3.3.4
    text: |-
      Bij het bepalen of voldaan wordt aan de waarden, bedoeld in het tweede en derde lid, worden de regels in
      [bijlage G][ref1], onder IV, toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.3.3
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 3.4.1.1
    text: Bij een partijkeuring worden aselect over de hele partij tenminste twaalf grepen genomen.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.4.1
  - number: 3.4.1.2
    text: |-
      Deze grepen worden evenredig verdeeld over ten minste twee mengmonsters, die zijn bestemd om te worden
      voorbehandeld en geanalyseerd overeenkomstig [paragraaf 3.3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.4.1
    references:
      - id: ref1
        bwb_id: BWBR0023085
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.4.2.1
    text: 'De uitkomst van de partijkeuring wordt vastgelegd in een rapportage, die de volgende gegevens bevat:'
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.4.2
  - number: 3.4.2.1.a
    text: |-
      de naam en het adres van de persoon of instelling die de monsters heeft genomen en van de instelling die
      de monsters heeft geanalyseerd, en de naam van de feitelijke natuurlijke persoon die de monsterneming heeft
      uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.4.2
  - number: 3.4.2.1.b
    text: de data waarop monsterneming, monstervoorbehandeling en analyse zijn uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.4.2
  - number: 3.4.2.1.c
    text: |-
      een verwijzing naar de gebruikte normdocumenten en methoden, en een onderbouwing van afwijkingen hiervan, indien
      deze het analyseresultaat beïnvloeden;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.4.2
  - number: 3.4.2.1.d
    text: het monsternemingsformulier en monsternemingsplan of een kopie daarvan;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.4.2
  - number: 3.4.2.1.e
    text: een beschrijving van de partij, waaronder de ligging, kenmerken en partijgrootte;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.4.2
  - number: 3.4.2.1.f
    text: |-
      een beschrijving van het monster, waaronder de aanwezigheid van eventuele metalen delen, de massa en de
      samenstelling of vermoedelijke samenstelling;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.4.2
  - number: 3.4.2.1.g
    text: |-
      het analyserapport van het laboratorium, inclusief de gemiddelde samenstellings- en emissiewaarden, een
      onderbouwing van de gekozen parameters, en de verhouding tussen de meetwaarden en daaruit voortvloeiende
      conclusies, en
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.4.2
  - number: 3.4.2.1.h
    text: een uniek nummer.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.4.2
  - number: 3.4.2.2
    text: |-
      Indien de partij voldoet aan de maximale waarden, bedoeld in [artikel 3.3.3, eerste lid][ref1], wordt een
      milieuhygiënische verklaring afgegeven, die de volgende gegevens bevat:


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel3
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.4.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.4.2.2.a
    text: de naam en het adres van degene die de milieuhygiënische verklaring afgeeft;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.4.2
  - number: 3.4.2.2.b
    text: de naam van de desbetreffende bouwstof;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.4.2
  - number: 3.4.2.2.c
    text: de toepasbaarheid van de bouwstof en eventuele voorwaarden die hierbij gelden, en
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.4.2
  - number: 3.4.2.2.d
    text: voor welk toepassingsgebied de partij voldoet.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.4.2
  - number: 3.5.1.1
    text: 'Een producent kan voor een bouwstof, niet zijnde een IBC-bouwstof, een fabrikant-eigenverklaring afgeven, indien:'
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.5.1
  - number: 3.5.1.1.a
    text: |-
      alle parameters voldoen aan de maximale waarden, bedoeld in [artikel 3.3.3, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel3
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.5.1
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.5.1.1.b
    text: |-
      asbest voldoet aan een maximale samenstellingswaarde van 10 mg/kg droge stof voor producten bedoeld in
      [tabel 2 van bijlage A, onder punt 6][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.5.1
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 3.5.1.1.c
    text: |-
      de k-waarden voor alle parameters voldoen aan het k-waardecriterium in [artikel 3.5.3][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel3
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.5.1
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.5.1.1.d
    text: |-
      de producent beschikt over een werkend systeem van interne kwaliteitsbewaking als bedoeld in [artikel 3.5.4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel3
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.5.1
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.5.1.2
    text: |-
      Een producent geeft geen fabrikant-eigenverklaring af, indien sprake is van enkelvoudige partijen zonder onderlinge
      samenhang in kwaliteit.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.5.1
  - number: 3.5.2.1
    text: |-
      De producent toont met een toelatingsonderzoek aan dat de bouwstof voldoet aan [artikel 3.5.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel3
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.5.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.5.2.2
    text: |-
      Het toelatingsonderzoek wordt uitgevoerd onder toezicht van een instelling die is erkend voor het afgeven van
      kwaliteitsverklaringen op basis van de desbetreffende nationale BRL, of op basis van een nationale BRL voor een
      vergelijkbare bouwstof.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.5.2
  - number: 3.5.2.3
    text: |-
      Bij het toelatingsonderzoek worden ten minste tien partijen onderzocht door middel van een partijkeuring als
      bedoeld in [paragraaf 3.4][ref1]. Hierbij geldt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.5.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 3.5.2.3.a
    text: |-
      de partijen qua grootte, productieproces, grondstoffen, productieperiode en afzet waarin het toelatingsonderzoek
      wordt uitgevoerd, representatief zijn voor de productie en evenredig over de productieperiode zijn verdeeld, en
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.5.2
  - number: 3.5.2.3.b
    text: het bepaalde onder a. blijkt uit een rapportage.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.5.2
  - number: 3.5.2.4
    text: |-
      Het is toegestaan om gebruik te maken van partijkeuringen uit een eerder toelatingsonderzoek en van eerdere
      verificatiekeuringen in het kader van een erkende kwaliteitsverklaring.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.5.2
  - number: 3.5.2.5
    text: |-
      De keuringen, bedoeld in het vorige lid, kunnen zijn uitgevoerd in gemeenschappelijke toelatingsonderzoeken en
      verificatie, mits de producent:
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.5.2
  - number: 3.5.2.5.a
    text: ten minste één partijkeuring uitvoert die betrekking heeft op de eigen bouwstof, en
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.5.2
  - number: 3.5.2.5.b
    text: onderbouwt dat de productiewijze en de grondstoffen voldoende aansluiten op die van de gemeenschappelijke cluster.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.5.2
  - number: 3.5.2.6
    text: |-
      De monsterneming voor de partijkeuring, bedoeld in het derde lid, kan door de producent worden uitgevoerd volgens
      de daarvoor geldende voorschriften in [bijlage C][ref1]. Bij het toelatingsonderzoek wordt dit gecontroleerd.


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.5.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 3.5.2.7
    text: |-
      Indien uit het toelatingsonderzoek blijkt dat aan [artikel 3.5.1][ref1] is voldaan, geeft de
      certificeringsinstelling een eenmalige verklaring af dat de producent onder de gegeven omstandigheden een
      fabrikant-eigenverklaring kan afgeven.


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel3
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.5.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.5.2.8
    text: |-
      De producent meldt het gebruik van de fabrikant-eigenverklaring uiterlijk binnen een maand aan Onze Minister en
      stuurt daarbij de verklaring van de certificeringsinstelling mee.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.5.2
  - number: 3.5.2.9
    text: |-
      Onze Minister draagt zorg voor de bekendmaking van de producenten die een fabrikant-eigenverklaring mogen afgeven
      voor de daarbij genoemde bouwstoffen.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.5.2
  - number: 3.5.3.1
    text: |-
      Bij het toelatingsonderzoek, bedoeld in [artikel 3.5.2][ref1], wordt de k-waarde voor iedere parameter in
      [bijlage A][ref2] berekend, zoals aangegeven in [bijlage H][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0023085
      [ref3]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.5.3
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref2
        bwb_id: BWBR0023085
      - id: ref3
        bwb_id: BWBR0023085
  - number: 3.5.3.2
    text: Het k-waardecriterium is dat de k-waarden van alle parameters in een bouwstof groter zijn dan 2,07.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.5.3
  - number: 3.5.3.3
    text: |-
      Voor de berekening van de k-waarde worden de regels in [bijlage G][ref1], onder IV, toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.5.3
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 3.5.3.4
    text: |-
      Een parameter voldoet in elk geval aan het k-waardecriterium, indien alle meetwaarden van de desbetreffende
      parameter:
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.5.3
  - number: 3.5.3.4.a
    text: |-
      conform de regels in [bijlage G][ref1], onder IV, onder de bepalingsgrens liggen;


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.5.3
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 3.5.3.4.b
    text: |-
      onder γ maal de desbetreffende maximale samenstellings- of emissiewaarde liggen, zoals in [bijlage H][ref1]
      aangegeven voor tien keuringen.


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.5.3
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 3.5.3.5
    text: Voor asbest wordt geen k-waarde bepaald.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.5.3
  - number: 3.5.4.1
    text: 'De interne kwaliteitsbewaking bij de productie van de bouwstof bevat:'
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.5.4
  - number: 3.5.4.1.a
    text: |-
      een kwaliteitssysteem dat waarborgt dat bouwstoffen worden geproduceerd die voldoen aan de eisen van
      [artikel 3.5.1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel3
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.5.4
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.5.4.1.b
    text: |-
      een kwaliteitshandboek waarin het kwaliteitssysteem inzichtelijk is gedocumenteerd, met heldere voorschriften en
      procedures voor alle productiestappen en controles;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.5.4
  - number: 3.5.4.1.c
    text: |-
      een register waarin de resultaten van het kwaliteitssysteem worden bijgehouden, waaronder een beschrijving van het
      product, de productiedatum, de gebruikte testmethode, de productiekenmerken, de gebruikte acceptatiecriteria voor
      grondstoffen en een overzicht van geleverde partijen met vermelding van de afnemer.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.5.4
  - number: 3.5.4.2
    text: 'Het kwaliteitssysteem, bedoeld in het eerste lid, onder a, bevat:'
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.5.4
  - number: 3.5.4.2.a
    text: de gegevens van de functionaris die is belast met het beheer van het kwaliteitssysteem;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.5.4
  - number: 3.5.4.2.b
    text: |-
      een functionerend IKB-schema dat betrekking heeft op de grondstoffen, het productieproces, de eindproducten,
      de status van meet- en bepalingsmethoden, het interne transport, de opslag en de identificatie van half-
      en eindproducten. Uit dit IKB-schema blijkt dat bij voortduring bouwstoffen worden vervaardigd die aan
      [artikel 3.5.1][ref1] voldoen, en


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel3
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.5.4
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.5.4.2.c
    text: |-
      een beschrijving hoe elk van de onderdelen onder b wordt gecontroleerd, welke controlemethode en controlefrequentie
      worden gehanteerd en de wijze waarop de controleresultaten worden geregistreerd en bewaard.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.5.4
  - number: 3.5.4.3
    text: |-
      Indien bouwstoffen of partijen niet voldoen aan de kwaliteit die is vastgesteld in het toelatingsonderzoek worden
      correctieve maatregelen genomen. Deze maatregelen worden bijgehouden in het register.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.5.4
  - number: 3.5.4.4
    text: De producent bewaart de informatie over het kwaliteitssysteem en het register ten minste vijf jaar.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.5.4
  - number: 3.5.5.1
    text: 'De fabrikant-eigenverklaring bevat de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.5.5
  - number: 3.5.5.1.a
    text: |-
      de verklaring van de producent dat de bouwstof voldoet aan de gestelde criteria in [artikel 3.5.1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel3
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.5.5
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.5.5.1.b
    text: de naam en het adres van de producenten de specifieke productielocatie;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.5.5
  - number: 3.5.5.1.c
    text: een nauwkeurige specificatie of beschrijving van de bouwstof;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.5.5
  - number: 3.5.5.1.d
    text: eventuele bijzondere voorwaarden voor het gebruik van de bouwstof;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.5.5
  - number: 3.5.5.1.e
    text: een uniek nummer.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.5.5
  - number: 3.5.5.2
    text: |-
      Voor het opstellen van een fabrikant-eigenverklaring wordt gebruikt gemaakt van het format dat verkrijgbaar is
      bij Bodem+.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.5.5
  - number: 3.6.1.1
    text: |-
      Het toelatingsonderzoek ter verkrijging van een erkende kwaliteitsverklaring wordt uitgevoerd door en onder
      toezicht van een instelling die is erkend voor het afgeven van kwaliteitsverklaringen en bestaat uit een
      productcontrole en een beoordeling van het kwaliteitssysteem.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.6.1
  - number: 3.6.1.2
    text: |-
      Bij de productcontrole controleert de instelling, bedoeld in het eerste lid, of de bouwstof voldoet aan de
      maximale waarden, bedoeld in [artikel 3.3.3, eerste lid][ref1], door vijf of tien partijen te onderwerpen aan een
      partijkeuring, als bedoeld in [paragraaf 3.4][ref2]. Hierbij geldt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0023085#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.6.1
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0023085
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 3.6.1.2.a
    text: |-
      de onderzochte partijen qua grootte, productieproces, grondstoffen, productieperiode en afzet waarin het
      toelatingsonderzoek wordt uitgevoerd, representatief zijn voor de productie en evenredig over de periode zijn
      verdeeld, en
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.6.1
  - number: 3.6.1.2.b
    text: het onder a. bepaalde blijkt uit een rapportage.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.6.1
  - number: 3.6.1.3
    text: |-
      De monsterneming bij de partijkeuring, bedoeld in het vorige lid, mag worden uitgevoerd door de producent, volgens
      de daarvoor geldende voorschriften in [bijlage C][ref1]. Bij het toelatingsonderzoek wordt dit gecontroleerd.


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.6.1
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 3.6.1.4
    text: |-
      Bij de beoordeling van de kwaliteitsbewaking beoordeelt de instelling, bedoeld in het eerste lid, de
      doeltreffendheid en correcte toepassing van het kwaliteitssysteem op de productielocatie.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.6.1
  - number: 3.6.1.5
    text: |-
      Op basis van de uitkomsten van het toelatingsonderzoek kan de instelling, bedoeld in het eerste lid, een
      kwaliteitsverklaring afgeven voor de productie van de desbetreffende bouwstof.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.6.1
  - number: 3.6.2.1
    text: |-
      Bij het toelatingsonderzoek, bedoeld in [artikel 3.6.1][ref1], wordt de k-waarde voor elke parameter in
      [bijlage A][ref2] over vijf of tien partijen berekend, zoals aangegeven in [bijlage H][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0023085
      [ref3]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.6.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
      - id: ref2
        bwb_id: BWBR0023085
      - id: ref3
        bwb_id: BWBR0023085
  - number: 3.6.2.2
    text: |-
      Bij de productiecontrole op de gecertificeerde bouwstof wordt ten minste een keuringsfrequentie van een parameter
      gehanteerd, die behoort bij de hiervoor berekende k-waarde, zoals aangegeven in [bijlage H][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.6.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 3.6.2.3
    text: |-
      Na iedere verificatiekeuring wordt de keuringsfrequentie opnieuw berekend op basis van het voortschrijdende
      gemiddelde. Hierbij geldt dat voor de berekening:
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.6.2
  - number: 3.6.2.3.a
    text: de oudste keuringsgegevens vervallen, en
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.6.2
  - number: 3.6.2.3.b
    text: de nieuwste keuringsgegevens worden toegevoegd.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.6.2
  - number: 3.6.2.4
    text: |-
      Voor de berekening van de k-waarde worden de regels in [bijlage G][ref1], onder IV, toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.6.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 3.6.2.5
    text: |-
      In afwijking van het eerste en tweede lid, mag voor een parameter de berekening van de k-waarde achterwege blijven
      en worden uitgaan van een gegeven keuringsfrequentie, indien alle vijf of tien meetwaarden van de desbetreffende
      parameter:
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.6.2
  - number: 3.6.2.5.a
    text: |-
      conform de regels in [bijlage G][ref1], onder IV, onder de bepalingsgrens liggen, waarbij de keuringsfrequentie
      gelijk mag worden gesteld aan eenmaal per vijf jaar, of


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.6.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 3.6.2.5.b
    text: |-
      onder γ maal de betreffende maximale samenstellings- of emissiewaarde liggen, waarbij de keuringsfrequentie mag
      worden gebruikt zoals gegeven in [bijlage H][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.6.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 3.6.2.6
    text: |-
      In afwijking van het derde lid mag bij structurele verbetering van de samenstellings- of emissiewaarde van een
      parameter als bedoeld in [bijlage A][ref1], daaronder mede begrepen het gebruik van een betere analysemethode,
      tijdelijk worden afgeweken van de spreiding in meetwaarden van de desbetreffende parameter. Hierbij geldt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.6.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 3.6.2.6.a
    text: het nieuwe voortschrijdend gemiddelde wordt getoetst met behoud van de oude spreiding in meetwaarden;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.6.2
  - number: 3.6.2.6.b
    text: de nieuwe spreiding in meetwaarden wordt bepaald wanneer vijf nieuwe keuringen zijn uitgevoerd, en
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.6.2
  - number: 3.6.2.6.c
    text: toestemming nodig is van de certificeringsinstelling.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.6.2
  - number: 3.6.2.7
    text: |-
      Indien de keuringsfrequentie van een parameter uitkomt in het partijkeuringsregime, bedoeld in
      [bijlage H][ref1], worden individuele partijen bij overschrijding van de maximale waarden, bedoeld in
      [artikel 3.3.3, eerste lid][ref2], afgekeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0023085
      [ref2]: https://wetten.overheid.nl/BWBR0023085#Artikel3
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.6.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
      - id: ref2
        bwb_id: BWBR0023085
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.6.2.8
    text: 'Een parameter gaat van het partijkeuringsregime over naar het steekproefregime, indien:'
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.6.2
  - number: 3.6.2.8.a
    text: de berekende k-waarde hoog genoeg is, en
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.6.2
  - number: 3.6.2.8.b
    text: |-
      deze k-waarde is bepaald aan de hand van tien keuringen, waarvan ten minste vijf zijn uitgevoerd onder het
      partijkeuringsregime.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.6.2
  - number: 3.6.2.9
    text: |-
      In afwijking van het eerste en tweede lid mag voor een parameter een keuringsfrequentie worden bepaald op basis van
      de verdelingsvrije toets, zoals beschreven in [bijlage H][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.6.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 3.6.2.10
    text: Voor asbest wordt geen k-waarde bepaald of verdelingsvrije toets uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.6.2
  - number: 3.6.3.1
    text: |-
      Voor enkelvoudige partijen zonder onderlinge samenhang die niet voldoen aan
      [artikel 3.6.1., tweede lid, onder a][ref1], kan een kwaliteitsverklaring worden afgegeven, mits elke partij
      wordt gekeurd volgens het partijkeuringsregime, bedoeld in [bijlage H][ref2] en voldoet aan de overige eisen van
      [artikel 3.6.1][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0023085
      [ref3]: https://wetten.overheid.nl/BWBR0023085#Artikel3
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.6.3
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
      - id: ref2
        bwb_id: BWBR0023085
      - id: ref3
        bwb_id: BWBR0023085
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 3.6.3.2
    text: |-
      In gevallen als bedoeld in het eerste lid wordt de bepaling van de keuringsfrequentie, bedoeld in
      [artikel 3.6.2][ref1], niet uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel3
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.6.3
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 3.6.4
    text: 'Een erkende kwaliteitsverklaring bevat de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.6.4
  - number: 3.6.4.a
    text: de naam en het adres van de persoon of instelling die is erkend voor het produceren op basis van een nationale BRL;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.6.4
  - number: 3.6.4.b
    text: de certificatie-eisen waaraan de producten zijn getoetst;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.6.4
  - number: 3.6.4.c
    text: de specificatie van het product;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.6.4
  - number: 3.6.4.d
    text: de datum vanaf welke het certificaat geldig is;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.6.4
  - number: 3.6.4.e
    text: eventuele bijzondere voorwaarden voor het gebruik van het product;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.6.4
  - number: 3.6.4.f
    text: een uniek nummer waarmee naar de verklaring kan worden verwezen.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.6.4
  - number: 3.7.1
    text: Een producent geeft niet meer dan één type milieuhygiënische verklaring af per product.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.7.1
  - number: 3.7.2.1
    text: 'De afleveringsbon bevat de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.7.2
  - number: 3.7.2.1.a
    text: het nummer en type van de milieuhygiënische verklaring;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.7.2
  - number: 3.7.2.1.b
    text: de datum van afgifte van de partij;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.7.2
  - number: 3.7.2.1.c
    text: de producent, de leverancier of de productielocatie van de partij;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.7.2
  - number: 3.7.2.1.d
    text: de naam van de bouwstof waarop de afleveringsbon betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.7.2
  - number: 3.7.2.1.e
    text: de aard van de bouwstof;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.7.2
  - number: 3.7.2.1.f
    text: de grootte van de partij in tonnen;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.7.2
  - number: 3.7.2.2
    text: 'Bij een partij is geen afleveringsbon vereist, indien:'
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.7.2
  - number: 3.7.2.2.a
    text: een daarbij behorende partijkeuring aanwezig is;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.7.2
  - number: 3.7.2.2.b
    text: |-
      de partij wordt hergebruikt als bedoeld in [artikel 29, eerste lid, onder c van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel29
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.7.2
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '29'
  - number: 3.7.2.2.c
    text: |-
      de partij wordt toegepast door de natuurlijke personen, bedoeld in
      [artikel 29, eerste lid, onder e van het besluit][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel29
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.7.2
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '29'
  - number: 3.7.2.3
    text: |-
      De eigenaar van de partij maakt in zijn administratie inzichtelijk waar de partij vandaan komt, of deze is
      gesplitst en wat de bestemming is.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.7.2
  - number: 3.7.3.1
    text: |-
      Indien een partij wordt gesplitst in deelpartijen, voldoen de deelpartijen aan de maximale samenstellings- en
      emissiewaarden van [bijlage A][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.7.3
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 3.7.3.2
    text: |-
      Voor de deelpartijen kan gebruik worden gemaakt van de milieuhygiënische verklaring voor de oorspronkelijke partij,
      mits de relatie tussen deelpartij en oorspronkelijke partij of productieproces, alsmede wie de splitsing heeft
      uitgevoerd en wanneer, wordt aangegeven op een afleveringsbon.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.7.3
  - number: 3.7.3.3
    text: Degene die de splitsing laat uitvoeren, is verantwoordelijk voor het gestelde in het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.7.3
  - number: 3.7.4.1
    text: |-
      Indien partijen worden samengevoegd, kan gebruik worden gemaakt van de milieuhygiënische verklaringen voor de
      oorspronkelijke partijen, mits de relatie tussen samengevoegde partij en de oorspronkelijke partijen, alsmede wie
      de samenvoeging heeft uitgevoerd en wanneer, wordt aangegeven op een afleveringsbon.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.7.4
  - number: 3.7.4.2
    text: Het eerste lid geldt niet voor het samenvoegen van verschillende soorten bouwstoffen.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.7.4
  - number: 3.7.4.3
    text: |-
      Het is niet toegestaan om bouwstoffen samen te voegen met materialen die geen bouwstoffen zijn, anders dan bij de
      productie van een bouwstof.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.7.4
  - number: 3.8.1
    text: |-
      De melding, bedoeld in [artikel 32, eerste en tweede lid, van het besluit][ref1]wordt gedaan door middel van het
      daartoe bestemde formulier dat verkrijgbaar is bij Bodem+.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel32
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.8.1
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '32'
  - number: 3.8.2.1
    text: |-
      Een onderzoek in het kader van de handhaving van de eisen in
      [artikel 28, eerste lid, onder b, van het besluit][ref1], wordt verricht overeenkomstig [artikel 3.4.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0023085#Artikel3
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.8.2
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0023085
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 3.8.2.2
    text: 'Bij een onderzoek als bedoeld in het eerste lid, wordt beoordeeld:'
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.8.2
  - number: 3.8.2.2.a
    text: de partij als geheel, zoals aangegeven op de milieuhygiënische verklaring of de afleverbon;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.8.2
  - number: 3.8.2.2.b
    text: de partij zoals ter plaatse aanwezig bij de producent;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.8.2
  - number: 3.8.2.2.c
    text: de partij zoals toegepast in het werk, of
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.8.2
  - number: 3.8.2.2.d
    text: een onderdeel van de partij, waarbij dit onderdeel ten minste 10.000 ton bedraagt.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.8.2
  - number: 3.8.2.3
    text: |-
      Er is sprake van een overtreding van [artikel 28, eerste lid, onder b, van het besluit][ref1], indien het in het
      eerste lid bedoelde onderzoek uitwijst dat de maximale waarden, bedoeld in [artikel 3.3.3, eerste lid][ref2], met
      ten minste een factor 1,4 worden overschreden, ongeacht de variatie in het onderzoeksresultaat ten gevolge van de
      mate van heterogeniteit van de partij.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0023085#Artikel3
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.8.2
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0023085
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.8.3.1
    text: |-
      De toezichthouder kan een producent binnen een bepaalde termijn opnieuw een toelatingsonderzoek of een
      specifiek onderdeel daarvan laten uitvoeren, indien blijkt dat niet is voldaan aan [artikel 3.5.1][ref1] of
      [artikel 3.5.2, derde lid, onder a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0023085#Artikel3
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.8.3
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref2
        bwb_id: BWBR0023085
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.8.3.2
    text: |-
      Op last van de toezichthouder worden bij een toelatingsonderzoek als bedoeld in het eerste lid nieuwe
      partijkeuringen uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.8.3
  - number: 3.8.3.3
    text: |-
      Indien alleen een specifiek onderdeel van het toelatingsonderzoek opnieuw wordt uitgevoerd, kan de toezichthouder
      kiezen om hierbij geen certificeringsinstelling in te schakelen.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.8.3
  - number: 3.8.3.4
    text: |-
      Het eerste lid geldt niet, indien de producent afziet van het gebruik van de desbetreffende fabrikant-
      eigenverklaring en dit binnen vijf dagen aan Onze Minister meldt.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.8.3
  - number: 3.9.1.1
    text: 'Van het werk waarin een IBC-bouwstof wordt toegepast, wordt een ontwerp gemaakt dat bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.1
  - number: 3.9.1.1.a
    text: |-
      een beschrijving van de wijze waarop wordt voldaan aan de [artikelen 3.9.2 tot en met 3.9.4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel3
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.1
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.9'
  - number: 3.9.1.1.b
    text: een situatietekening, langs- en dwarsdoorsneden;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.1
  - number: 3.9.1.1.c
    text: |-
      een beschrijving van de wijze waarop wordt voldaan aan de aandachtspunten, onderdelen en criteria zoals aangegeven
      in het toepasselijke normdocument, bedoeld in [bijlage D][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.1
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 3.9.1.1.d
    text: een berekening van de zetting die optreedt bij het gereedkomen van het werk en na vijftig jaar.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.1
  - number: 3.9.1.2
    text: |-
      Het werk wordt ontworpen op de eindzetting die wordt berekend voor een periode van vijftig jaar, vermeerderd met
      een onzekerheidsmarge van 30% van de berekende zetting.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.1
  - number: 3.9.1.3
    text: |-
      De restzetting die optreedt na het gereedkomen van een werk dat met een IBC-bouwstof is gerealiseerd, is na vijftig
      jaar maximaal 0,5 meter.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.1
  - number: 3.9.1.4
    text: Een IBC-bouwstof wordt toegepast in aaneengesloten hoeveelheden van ten minste 10.000 m3.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.1
  - number: 3.9.1.5
    text: |-
      Het ontwerp, bedoeld in het eerste lid, wordt door de Advieskamer bodembescherming gekeurd volgens het
      toepasselijke normdocument in [bijlage D][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.1
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 3.9.2.1
    text: |-
      De bovenzijde en zijkanten van een IBC-bouwstof worden binnen drie maanden nadat een laag van de IBC-bouwstof is
      aangebracht, voorzien van een isolerende voorziening die bestaat uit:
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.2
  - number: 3.9.2.1.a
    text: een bentonietmat;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.2
  - number: 3.9.2.1.b
    text: een laag zandbentonietpolymeergel, of
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.2
  - number: 3.9.2.1.c
    text: |-
      een kunststof HDPE-folie met een laagdikte tussen 1,9 en 2,1 mm en voldoet aan de eisen die daaraan zijn gesteld in
      de in de [bijlagen C][ref1] en [D][ref2] genoemde normdocumenten.


      [ref1]: https://wetten.overheid.nl/BWBR0023085
      [ref2]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
      - id: ref2
        bwb_id: BWBR0023085
  - number: 3.9.2.2
    text: |-
      De isolerende voorziening heeft een maximaal toegestane lekkage van 6 mm per jaar bij de 0,2 meter waterdruk
      gedurende 200 dagen per jaar en heeft een levensduur van minimaal 100 jaar.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.2
  - number: 3.9.2.3
    text: |-
      De isolerende voorziening, bedoeld in het eerste lid onder a of b, wordt beschermd tegen aantasting door de IBC-
      bouwstof door een diffusieremmende laag van bitumenemulsie in een hoeveelheid van 4 kg/m2 of door kunststoffolie
      met een laagdikte van ten minste 0,5 mm en een tolerantie op die dikte van 5% volgens de voorschriften in de
      daarvoor geldende normdocumenten en werkvoorschrift, bedoeld in [bijlage D][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 3.9.2.4
    text: |-
      Indien de isolerende voorziening, bedoeld in het eerste lid onder a of b, l wordt toegepast in een wegenbouwkundige
      constructie, wordt deze beschermd tegen aantasting door strooizouten door kunststoffolie met een laagdikte
      van ten minste 0,5 millimeter, volgens de voorschriften in de daarvoor geldende normdocumenten, bedoeld in
      [bijlage D][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 3.9.2.5
    text: |-
      Indien een IBC-bouwstof als wegfunderingsmateriaal wordt toegepast, functioneert in afwijking van het eerste lid de
      vloeistofdichte wegverharding, aangelegd volgens de voorschriften in de daarvoor geldende normdocumenten, bedoeld
      in [categorie 1 van bijlage C][ref1], als isolerende voorziening. Overeenkomstig de schone-schouderconstructie,
      bedoeld in CROW-publicatie 125, wordt hierbij een bouwstof, niet-zijnde een IBC-bouwstof, aangebracht onder de
      randen van de wegverharding over een breedte gelijk aan de dikte van de IBC-bouwstof in de fundering en met een
      minimumbreedte van 0,30 meter.


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 3.9.2.6
    text: |-
      Indien een IBC-bouwstof als constructieve ophoging in een wegenbouwkundig werk wordt toegepast, functioneert in
      afwijking van het eerste lid de vloeistofdichte wegverharding die is aangelegd volgens de voorschriften in de
      toepasselijke normdocumenten, bedoeld in categorie 1 van [bijlage C][ref1], als isolerende voorziening op de kruin.
      Op de taluds wordt een isolerende voorziening overeenkomstig het eerste lid aangebracht met een verankeringslengte
      op de kruin van minimaal vijf meter. De afstand tussen de bovenzijde van de wegverharding en de bovenzijde van de
      IBC-bouwstof bedraagt maximaal twee meter.


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 3.9.2.7
    text: |-
      Indien een IBC-bouwstof als funderingsmateriaal onder bebouwing wordt toegepast, functioneert, in afwijking van het
      eerste lid, de vloeistofdichte bebouwing inclusief de randbalken van de bebouwing als isolerende voorziening.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.2
  - number: 3.9.2.8
    text: |-
      De constructie waarin een IBC-bouwstof wordt toegepast, wordt zodanig ontworpen dat het regenwater zonder stagnatie
      wordt afgevoerd door:
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.2
  - number: 3.9.2.8.a
    text: |-
      in geval van een constructie met een afdeklaag, een doorlatende laag op de afdichting die bestaat uit een laag zand
      met een dikte van minimaal 0,25 meter en een permeabiliteitcoëfficiënt van minimaal 1,4 x 10-4 m/s of een hieraan
      gelijkwaardige drainagevoorziening;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.2
  - number: 3.9.2.8.b
    text: |-
      een afschot dat na de eindzetting, bedoeld in [artikel 3.9.1, tweede lid][ref1], ten minste 2% in dwarsprofiel
      bedraagt, en


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel3
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.9'
  - number: 3.9.2.8.c
    text: |-
      een randvoorziening die voorkomt dat afstromend water leidt tot waterverzadiging langs de rand en het talud of
      onvoldoende drooglegging onder de IBC-bouwstof.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.2
  - number: 3.9.2.9
    text: |-
      De materialen, bedoeld in het eerste tot en met het zevende lid, worden zodanig gekozen en toegepast dat deze
      gedurende de levensduur van het werk volledig hun functie kunnen vervullen.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.2
  - number: 3.9.2.10
    text: 'Een tijdelijke isolerende voorziening wordt aangebracht, indien:'
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.2
  - number: 3.9.2.10.a
    text: de in het eerste lid genoemde termijn niet wordt gehaald;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.2
  - number: 3.9.2.10.b
    text: gedurende ten minste zeven dagen in het werk geen IBC-bouwstoffen worden aangebracht of verwijderd.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.2
  - number: 3.9.2.11
    text: |-
      Voor de tijdelijke isolerende voorziening geldt bij toepassing en beheer de maximaal toegestane lekkage bedoeld in
      het tweede lid.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.2
  - number: 3.9.3.1
    text: Het ontwerppeil van het grondwater wordt vastgesteld op het niveau van het maaiveld.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.3
  - number: 3.9.3.2
    text: |-
      Indien de IBC-bouwstof wordt toegepast in een gebied, dat wordt gekenmerkt door grondwatertrap VII of hoger, kan in
      afwijking van het eerste lid het ontwerppeil van het grondwater worden vastgesteld door:
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.3
  - number: 3.9.3.2.a
    text: |-
      de grondwaterstand te bepalen ten opzichte van Normaal Amsterdams Peil in de dichtstbijzijnde peilbuis van een
      landelijk meetnet die in 99% van de waarnemingen wordt onderschreden;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.3
  - number: 3.9.3.2.b
    text: |-
      een representatief aantal peilbuizen te plaatsen op de toepassingslocatie en gedurende ten minste drie maanden de
      grondwaterstand te meten ten opzichte van NAP op of rond de 14e en 28e dag van de maand, en
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.3
  - number: 3.9.3.2.c
    text: |-
      de grondwaterstand, bedoeld onder a, te vermeerderen met het verschil tussen de gemiddelde grondwaterstand op de
      toepassingslocatie en die , bedoeld onder a, tenzij het verschil negatief is.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.3
  - number: 3.9.3.3
    text: |-
      Indien de grondwaterstand op de toepassingslocatie voor de duur van het werk wordt gekenmerkt door een aantoonbaar
      beheerst regime van een oppervlaktewaterlichaam, wordt het daarbij horende grondwaterpeil, vermeerderd met een
      zekerheidsmarge van 0,20 meter, aangehouden als het ontwerppeil van het grondwater. Het op de toepassingslocatie te
      verwachten grondwaterpeil wordt onderbouwd door middel van een grondwatermodellering.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.3
  - number: 3.9.3.4
    text: |-
      Bij de vaststelling, bedoeld in het eerste, tweede of derde lid, wordt rekening gehouden met mogelijk optredende
      wateroverlast die is gebaseerd op de kans dat deze zich eenmaal in de maximaal honderd jaar voordoet, gelet op de
      verwachte klimaatontwikkeling tot vijftig jaar na afronding van het werk.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.3
  - number: 3.9.3.5
    text: |-
      De onderzijde van de IBC-bouwstof wordt op een zodanige wijze aangelegd, dat deze na de eindzetting, bedoeld in
      [artikel 3.9.1, tweede lid][ref1], ten minste 0,50 meter boven het ontwerppeil van het grondwater ligt en er geen
      contact is met het grondwater als gevolg van capillaire opstijging uit het grondwater.


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel3
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.3
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.9'
  - number: 3.9.4.1
    text: |-
      Voor het monitoren van de stand en de kwaliteit van het grondwater worden peilbuizen aangebracht. Het aantal
      peilbuizen tot 50.000 m3 IBC-bouwstof bedraagt ten minste één bovenstrooms en twee benedenstrooms van het werk. Per
      50.000 m3 IBC-bouwstof extra wordt hieraan ten minste één peilbuis bovenstrooms en twee benedenstrooms toegevoegd.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.4
  - number: 3.9.4.2
    text: Voor het monitoren van de zetting tijdens de aanleg van het werk worden voorzieningen aangebracht.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.4
  - number: 3.9.4.3
    text: |-
      Een beheers- en controleplan wordt opgesteld overeenkomstig het toepasselijke normdocument, bedoeld in
      [bijlage D][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.4
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 3.9.4.4
    text: |-
      Het beheers- en controleplan wordt door de Advieskamer bodembescherming gekeurd volgens het toepasselijke
      normdocument in [bijlage D][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.4
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 3.9.5.1
    text: |-
      Alvorens de IBC-bouwstof wordt toegepast, wordt een nulonderzoek uitgevoerd op de bodem, inclusief het grondwater,
      volgens het daarvoor geldende protocol, bedoeld in [bijlage D][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.5
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 3.9.5.2
    text: |-
      Het nulonderzoek bestaat uit veldwerk en analyse voor milieuhygiënisch bodemonderzoek van de daaruit verkregen
      monsters.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.5
  - number: 3.9.5.3
    text: |-
      Indien getoetst wordt aan de [Circulaire bodemsanering per 1 juli 2013][ref1], worden de regels in
      [bijlage G][ref2], onder III en IV, toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0033592
      [ref2]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.5
    references:
      - id: ref1
        bwb_id: BWBR0033592
      - id: ref2
        bwb_id: BWBR0023085
  - number: 3.9.6.1
    text: De aanleg van een werk met isolerende voorzieningen wordt geïnspecteerd door een daartoe erkend bedrijf.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.6
  - number: 3.9.6.2
    text: |-
      De isolerende voorzieningen, bedoeld in [artikel 3.9.2, eerste, vijfde en zesde lid][ref1], voor zover het een
      vloeistofdichte verharding betreft of isolerende voorzieningen, worden conform het ontwerp aangebracht door een
      daartoe erkend bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel3
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.6
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.9'
  - number: 3.9.6.3
    text: |-
      Bij de uitvoering van het werk zijn afwijkingen ten opzichte van het ontwerp als bedoeld in [artikel 3.9.1][ref1]
      uitsluitend toegestaan, indien deze:


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel3
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.6
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.9'
  - number: 3.9.6.3.a
    text: minimaal een gelijkwaardige milieubescherming bieden als het ontwerp;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.6
  - number: 3.9.6.3.b
    text: |-
      voor het toepassen worden gemeld aan Onze Minister met opgave van afwijkingen en het rapport van de Advieskamer
      bodembescherming, genoemd in onderdeel c, en
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.6
  - number: 3.9.6.3.c
    text: |-
      door de Advieskamer bodembescherming zijn gekeurd volgens het toepasselijke normdocument in [bijlage D][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.6
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 3.9.6.4
    text: |-
      Degene die de IBC-bouwstof heeft toegepast, meldt het gereedkomen van het werk, alsmede afwijkingen van het ontwerp
      als bedoeld in [artikel 3.9.1][ref1] ingeval die bij een latere controle blijken, binnen veertien dagen aan Onze
      Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel3
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.6
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.9'
  - number: 3.9.6.5
    text: 'Degene die de IBC-bouwstof heeft toegepast bewaart en registreert voor de levensduur van het werk ten minste:'
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.6
  - number: 3.9.6.5.a
    text: een overzicht van het ontwerp;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.6
  - number: 3.9.6.5.b
    text: de afwijkingen ten opzichte van het ontwerp;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.6
  - number: 3.9.6.5.c
    text: een tekening van de uiteindelijke situatie, en
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.6
  - number: 3.9.6.5.d
    text: andere gegevens waaruit kan worden afgeleid of is voldaan aan de gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.6
  - number: 3.9.7.1
    text: |-
      Degene die de bouwstof toepast meet vanaf het moment dat de eerste laag IBC-bouwstof wordt aangebracht tot de
      voltooiing van het werk, de zetting daarvan.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.7
  - number: 3.9.7.2
    text: |-
      Bij het gereedkomen van het werk wordt de gemeten zetting vergeleken met de berekende zetting, bedoeld in
      [artikel 3.9.1, eerste lid, onder d][ref1] en, voor zover deze verschillen, wordt de berekende eindzetting, bedoeld
      in [artikel 3.9.1, tweede lid][ref2], bijgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0023085#Artikel3
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.7
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.9'
      - id: ref2
        bwb_id: BWBR0023085
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.9'
  - number: 3.9.7.3
    text: |-
      Indien uit de bijgestelde berekende eindzetting blijkt dat niet wordt voldaan aan
      [artikel 3.9.3, vijfde lid][ref1], meldt de toepasser dit binnen veertien dagen aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel3
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.7
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.9'
  - number: 3.9.8.1
    text: 'Vanaf het moment dat de eerste laag IBC-bouwstof wordt aangebracht, wordt:'
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.8
  - number: 3.9.8.1.a
    text: |-
      de afstand tussen de onderkant van de IBC-bouwstof en de HG3 jaarlijks gecontroleerd door middel van veldwerk ter
      vaststelling van de HG3 en de hoogteligging van de onderkant van de IBC-bouwstof;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.8
  - number: 3.9.8.1.b
    text: |-
      de kwaliteit van het grondwater, eenmaal in de twee jaar bepaald door middel van veldwerk waarbij het grondwater
      wordt bemonsterd en geanalyseerd, en
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.8
  - number: 3.9.8.1.c
    text: de staat waarin het werk verkeert jaarlijks gecontroleerd door een daartoe erkend bedrijf.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.8
  - number: 3.9.8.2
    text: |-
      De resultaten van de controle, bedoeld in het vorige lid, worden elke twee jaar gemeld aan Onze Minister. Indien
      sprake is van een afwijking wordt dit direct aan Onze Minister gemeld.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.8
  - number: 3.9.8.3
    text: |-
      Indien na drie jaar is gebleken dat de afstand, bedoeld in het eerste lid, onderdeel a, nooit kleiner is geweest
      dan één meter, kan met instemming van het bevoegd gezag de frequentie van de vaststelling, bedoeld in dat
      onderdeel, worden verlaagd. Deze verplichting houdt in dat ten minste een keer in de vijf jaar de grondwaterstand
      wordt vastgesteld in de periode dat deze maximaal is.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.8
  - number: 3.9.8.4
    text: |-
      Indien na zes jaar is gebleken dat de kwaliteit van het grondwater niet is gewijzigd, kan met instemming van het
      bevoegd gezag de frequentie van de verplichting bedoeld in het eerste lid, onder b, worden verlaagd.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.8
  - number: 3.9.9
    text: |-
      Indien controlewerkzaamheden aantonen dat een toepassing van een IBC-bouwstof niet voldoet aan de daaraan gestelde
      eisen of negatieve effecten heeft, worden terstond maatregelen getroffen. Hiervoor wordt een plan van aanpak
      opgesteld, dat wordt aangeboden aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.9
  - number: 3.9.10.1
    text: |-
      Indien een isolerende voorziening wordt verwijderd, wordt de IBC-bouwstof dat niet meer is afgedicht binnen zes
      weken volledig verwijderd. Hierbij geldt [artikel 3.9.2, tiende lid, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel3
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.10
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.9'
  - number: 3.9.10.2
    text: |-
      Indien een werk of deel van een werk waarin een IBC-bouwstof is toegepast is verwijderd, wordt de bodemkwaliteit
      onderzocht volgens het daarvoor geldende protocol , bedoeld in [bijlage D][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.10
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 3.9.10.3
    text: |-
      Uiterlijk binnen twee maanden na het verwijderen van de IBC-bouwstof, wordt Onze Minister in kennis gesteld van de
      resultaten van het onderzoek, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.10
  - number: 3.9.10.4
    text: |-
      Indien bij het onderzoek, bedoeld in het tweede lid, een bodemverontreiniging aantoont als gevolg van het toepassen
      van de IBC-bouwstof, wordt de oorspronkelijke bodemkwaliteit hersteld, zoals die is vastgesteld op grond van
      [artikel 3.9.5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel3
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.10
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.9'
  - number: 3.9.10.5
    text: |-
      Het onderzoek, bedoeld in het tweede lid, bestaat uit veldwerk en analyse voor milieuhygiënisch bodemonderzoek van
      de daaruit verkregen monsters van de bodem.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.10
  - number: 3.9.11
    text: |-
      De [artikelen 3.9.1. tot en met 3.9.9.][ref1] zijn niet van toepassing op het toepassen van IBC-bouwstoffen binnen
      een stortplaats waarop het [Stortbesluit bodembescherming][ref2] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005858
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.9.11
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.9'
      - id: ref2
        bwb_id: BWBR0005858
  - number: 3.10.1.1
    text: |-
      Het formulier, bedoeld in [artikel 31, derde lid, van het besluit][ref1], is verkrijgbaar bij Bodem+.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel31
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.10.1
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '31'
  - number: 3.10.1.2
    text: |-
      Bij de aanvraag wordt een beschrijving gevoegd van de techniek en aangetoond dat wordt voldaan aan
      gelijkwaardigheid met de voorgeschreven technieken, waarbij [artikel 3.9.2, tweede en negende lid][ref1], onverkort
      van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel3
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.10.1
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.9'
  - number: 3.10.2
    text: |-
      De verklaring behorende bij de ontheffing, bedoeld in [artikel 31, eerste lid van het besluit][ref1], waaruit
      blijkt dat ten minste dezelfde mate van bescherming van de bodem wordt geboden als is beoogd met de betrokken eis,
      stellen Onze Ministers vrij beschikbaar via de website van Bodem+.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel31
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.10.2
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '31'
  - number: 3.10.3
    text: |-
      De ontheffing kan worden verleend onder de voorwaarde dat deze alleen geldt onder bepaalde omstandigheden of voor
      bepaalde bouwstoffen.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.10.3
  - number: 3.11.1.1
    text: |-
      Als de herkomstgebieden, bedoeld in [artikel 33c, eerste lid, aanhef en onder a, van het Besluit][ref1], worden
      aangewezen de gebieden, bedoeld in [bijlage P][ref2], onder a en b.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel33c
      [ref2]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.11.1
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: 33c
      - id: ref2
        bwb_id: BWBR0023085
  - number: 3.11.1.2
    text: |-
      Als de toepassingsgebieden, bedoeld in [artikel 33c, eerste lid, aanhef en onder b, van het Besluit][ref1], worden
      aangewezen de op de kaarten 1 tot en met 7 in [bijlage Q][ref2] als mijnsteengebieden aangeduide gebieden.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel33c
      [ref2]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.11.1
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: 33c
      - id: ref2
        bwb_id: BWBR0023085
  - number: 3.11.2
    text: |-
      De kwaliteit van mijnsteen die afkomstig is uit een herkomstgebied als bedoeld in
      [artikel 3.11.1, eerste lid][ref1], en wordt toegepast in een toepassingsgebied als bedoeld in het tweede lid van
      dat artikel wordt vastgesteld door middel van een milieuhygiënische verklaring als bedoeld in [artikel 4.3.3][ref2]
      of [4.3.4, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0023085#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0023085#Artikel4
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel3.11.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.11'
      - id: ref2
        bwb_id: BWBR0023085
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0023085
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
        afdeling: '1'
  - number: 4.1.1.1
    text: Het percentage organisch stof in grond of baggerspecie wordt bepaald volgens NEN 5754.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.1.1
  - number: 4.1.1.2
    text: |-
      De hoeveelheid minerale delen met een maximale korrelgrootte van 2 millimeter en de van nature in de bodem en bodem
      of oever van een oppervlaktelichaam voorkomende schelpen en grind met een korrelgrootte van 2 tot 63 millimeter in
      grond of baggerspecie worden bepaald volgens NEN 5753 en NEN 5104.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.1.1
  - number: 4.1.1.3
    text: |-
      De gehalten voor het toetsen aan de maximale waarden worden gebaseerd op het totaal, zijnde de gemeten gehalten,
      inclusief schelpen en grind. Indien de van nature in de bodem en bodem of oever van een oppervlaktewaterlichaam
      voorkomende massa schelpen en grind met een korrelgrootte van 2 tot 63 millimeter niet wordt betrokken bij het
      meten van het totaal gehalte, wordt het totaal gehalte bepaald op basis van de massafracties van het deel waarop
      het gemeten gehalte betrekking heeft plus het deel schelpen en grind.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.1.1
  - number: 4.2.1.1
    text: |-
      De gemeten gehalten worden voor lutum en organisch stof gecorrigeerd volgens de rekenregels in [bijlage G][ref1],
      onder III, om te bepalen of de kwaliteit van de grond of baggerspecie, die op of in de bodem wordt toegepast, een
      van de volgende waarden overschrijdt:


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.2.1
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 4.2.1.1.a
    text: |-
      de achtergrondwaarden, bedoeld in de tabellen 1 en 2 in [bijlage B][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.2.1
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 4.2.1.1.b
    text: |-
      de maximale waarden voor de kwaliteitsklasse wonen of industrie, bedoeld in tabel 1 van [bijlage B][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.2.1
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 4.2.1.1.c
    text: |-
      de emissietoetswaarden, bedoeld in de tabellen 1 en 2 in [bijlage B][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.2.1
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 4.2.1.1.d
    text: |-
      de lokale maximale waarden, bedoeld in [artikel 44, eerste lid, van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel44
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.2.1
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '44'
  - number: 4.2.1.2
    text: |-
      De gemeten gehalten worden voor lutum en organisch stof gecorrigeerd, volgens de rekenregels in [bijlage G][ref1],
      onder III, om te bepalen of de kwaliteit van de grond of baggerspecie, die wordt toegepast in een
      oppervlaktewaterlichaam, een van de volgende waarden overschrijdt:


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.2.1
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 4.2.1.2.a
    text: |-
      de achtergrondwaarden, bedoeld in de tabellen 1 en 2 in [bijlage B][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.2.1
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 4.2.1.2.b
    text: |-
      de maximale waarden voor kwaliteitsklasse A, bedoeld in tabel 2 van [bijlage B][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.2.1
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 4.2.1.2.c
    text: |-
      de maximale waarden voor kwaliteitsklasse B, zijnde de interventiewaarden voor de bodem of oever van
      oppervlaktewaterlichamen, bedoeld in tabel 2 van [bijlage B][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.2.1
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 4.2.1.2.d
    text: |-
      de lokale maximale waarden, bedoeld in [artikel 45, eerste lid, van het besluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel45
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.2.1
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '45'
  - number: 4.2.1.2.e
    text: |-
      de emissietoetswaarden, bedoeld in de tabellen 1 en 2 in [bijlage B][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.2.1
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 4.2.1.3
    text: |-
      In afwijking van het tweede lid, worden de gemeten gehalten voor lutum en organisch stof gecorrigeerd volgens
      de rekenregels in onderdeel III van [bijlage G][ref1], om te bepalen of de kwaliteit van de baggerspecie, die
      wordt toepast als bedoeld in [artikel 35 onder f, g en i van het besluit][ref2], een van de volgende waarden
      overschrijdt:


      [ref1]: https://wetten.overheid.nl/BWBR0023085
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Artikel35
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.2.1
    references:
      - id: ref1
        bwb_id: BWBR0023085
      - id: ref2
        bwb_id: BWBR0022929
        artikel: '35'
  - number: 4.2.1.3.a
    text: |-
      de maximale waarden voor het verspreiden van baggerspecie over het aangrenzende perceel, bedoeld in tabel 1 van
      [bijlage B][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.2.1
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 4.2.1.3.b
    text: |-
      de maximale waarden voor het verspreiden van baggerspecie in een zoet oppervlaktewaterlichaam, bedoeld
      in tabel 2 van [bijlage B][ref1]. Voor stoffen waarvoor geen maximale waarde is opgenomen geldt
      [artikel 4.2.2, vierde en vijfde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023085
      [ref2]: https://wetten.overheid.nl/BWBR0023085#Artikel4
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.2.1
    references:
      - id: ref1
        bwb_id: BWBR0023085
      - id: ref2
        bwb_id: BWBR0023085
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
        afdeling: '1'
  - number: 4.2.2.1
    text: |-
      De kwaliteit van grond of baggerspecie overschrijdt de waarden, bedoeld in
      [artikel 4.2.1, eerste lid, onder b, tweede lid, onder b, c en d en derde lid, onder b][ref1], indien voor een of
      meer van de gemeten stoffen het rekenkundig gemiddelde gehalte hoger is dan deze waarden.


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel4
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.2.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
        afdeling: '1'
  - number: 4.2.2.2
    text: |-
      De kwaliteit van baggerspecie overschrijdt de maximale waarden voor het verspreiden van baggerspecie in een zout
      oppervlaktewaterlichaam, indien voor een of meer van de gemeten stoffen het rekenkundig gemiddelde gehalte hoger is
      dan deze waarden.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.2.2
  - number: 4.2.2.3
    text: |-
      De kwaliteit van baggerspecie overschrijdt de waarden, bedoel in [artikel 4.2.1, derde lid, onder a][ref1],
      indien :


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel4
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.2.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
        afdeling: '1'
  - number: 4.2.2.3.a
    text: |-
      het rekenkundige gemiddelde van de gehalten in de baggerspecie voor een of meer stoffen, waarvoor maximale waarden
      gelden voor het verspreiden van baggerspecie op het aangrenzende perceel, hoger is dan deze waarden;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.2.2
  - number: 4.2.2.3.b
    text: |-
      het rekenkundig gemiddelde voor organische stoffen die deel uitmaken van het stoffenpakket dat wordt ingevoerd voor
      de berekening van de msPAF de msPAF 20% of hoger is, of indien het rekenkundig gemiddelde voor metalen de msPAF 50%
      of hoger is;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.2.2
  - number: 4.2.2.3.c
    text: |-
      voor stoffen, niet zijnde stoffen bedoeld onder a of b, de kwaliteit van de baggerspecie de achtergrondwaarden
      overschrijdt, met inachtneming van de toetsingsregel, bedoeld in het vierde en vijfde lid.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.2.2
  - number: 4.2.2.4
    text: |-
      De kwaliteit van grond of baggerspecie overschrijdt niet de achtergrondwaarden, bedoeld in [bijlage B][ref1],
      indien ten opzichte van de achtergrondwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.2.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 4.2.2.4.a
    text: |-
      bij meting van ten minste 2 stoffen waarvoor een waarde is opgenomen in de tabellen 1 en 2 van [bijlage B][ref1],
      het rekenkundig gemiddelde gehalte van maximaal 1 stof verhoogd is;


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.2.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 4.2.2.4.b
    text: |-
      bij meting van ten minste 7 stoffen waarvoor een waarde is opgenomen in de tabellen 1 en 2 van [bijlage B][ref1],
      de rekenkundig gemiddelde gehalten van maximaal 2 stoffen verhoogd zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.2.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 4.2.2.4.c
    text: |-
      bij meting van ten minste 16 stoffen waarvoor een waarde is opgenomen in de tabellen 1 en 2 van [bijlage B][ref1],
      de rekenkundig gemiddelde gehalten van maximaal 3 stoffen verhoogd zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.2.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 4.2.2.4.d
    text: |-
      bij meting van ten minste 27 stoffen waarvoor een waarde is opgenomen in de tabellen 1 en 2 van [bijlage B][ref1],
      de rekenkundig gemiddelde gehalten van maximaal 4 stoffen verhoogd zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.2.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 4.2.2.4.e
    text: bij meting van ten minste 37 stoffen waarvoor een waarde is opgenomen in de tabellen 1 en 2
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.2.2
  - number: 4.2.2.5
    text: |-
      Een verhoging als bedoeld in het vierde lid bedraagt per stof ten hoogste twee maal de daarvoor geldende
      achtergrondwaarde en overschrijdt niet de daarvoor geldende maximale waarden voor de bodemkwaliteitsklasse wonen.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.2.2
  - number: 4.2.2.6
    text: |-
      De grond of baggerspecie overschrijdt de maximale waarden voor de emissie, bedoeld in tabel 1 en 2 van
      [bijlage B][ref1], indien voor één of meer stoffen de gemeten emissie van een representatief deelmonster hoger is
      dan de desbetreffende maximale waarden.


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.2.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 4.2.2.7
    text: |-
      Bij het vaststellen van een overschrijding van de waarden, bedoeld in dit artikel, worden de regels in
      [bijlage G][ref1], onder IV toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.2.2
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 4.2.2.8
    text: |-
      In afwijking van het vijfde lid vindt voor de stof nikkel (Ni) geen toetsing plaats aan de maximale waarden voor de
      bodemkwaliteitsklasse wonen.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.2.2
  - number: 4.2.3.1
    text: |-
      In afwijking van [artikel 4.2.2, eerste lid][ref1], kan de gemeenteraad of Onze Minister van Verkeer en Waterstaat
      of het algemeen bestuur van het waterschapop grond van respectievelijk de [artikelen 44, eerste lid][ref2] en
      [45, eerste lid, van het besluit][ref3], een bodembeheergebied indelen in bodemkwaliteitszones en daarvoor per stof
      een kengetal vaststellen om te bepalen of de kwaliteit van de grond of baggerspecie de lokale maximale waarden,
      bedoeld in de [artikelen 44, eerste lid][ref4], en [45, eerste lid][ref5], overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0022929#Artikel45
      [ref4]: https://wetten.overheid.nl/BWBR0022929#Artikel44
      [ref5]: https://wetten.overheid.nl/BWBR0022929#Artikel45
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.2.3
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0022929
        artikel: '44'
      - id: ref3
        bwb_id: BWBR0022929
        artikel: '45'
      - id: ref4
        bwb_id: BWBR0022929
        artikel: '44'
      - id: ref5
        bwb_id: BWBR0022929
        artikel: '45'
  - number: 4.2.3.2
    text: |-
      Het kengetal, bedoeld in het vorige lid, is voor alle onderzochte stoffen gelijk aan of hoger dan het rekenkundig
      gemiddelde gehalte van de stof in de bodemkwaliteitszone.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.2.3
  - number: 4.2.3.3
    text: |-
      De kwaliteit van grond of baggerspecie overschrijdt de lokale maximale waarden, bedoeld in
      [artikel 4.2.1, eerste lid, onder d][ref1], indien voor een of meer van de gemeten stoffen het kengetal in de
      bodemkwaliteitszone waarvan de grond of baggerspecie afkomstig is, hoger is dan de lokale maximale waarden.


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel4
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.2.3
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
        afdeling: '1'
  - number: 4.2.3.4
    text: |-
      De kwaliteit van grond of baggerspecie overschrijdt de lokale maximale waarden, bedoeld in
      [artikel 4.2.1, tweede lid onder d][ref1], indien voor een of meer van de gemeten stoffen het kengetal in de
      bodemkwaliteitszone waarvan de grond of baggerspecie afkomstig is, hoger is dan de lokale maximale waarden.


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel4
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.2.3
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
        afdeling: '1'
  - number: 4.3.1.1
    text: |-
      Na splitsing van een partij kan voor de deelpartijen gebruik worden gemaakt van de milieuhygiënische verklaring
      voor de oorspronkelijke partij, mits het volgende wordt vastgelegd in de administratie:
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.1
  - number: 4.3.1.1.a
    text: de relatie tussen de deelpartij en de oorspronkelijke partij,
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.1
  - number: 4.3.1.1.b
    text: de persoon of instelling welke de splitsing heeft uitgevoerd, en
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.1
  - number: 4.3.1.1.c
    text: de datum waarop de splitsing is uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.1
  - number: 4.3.1.2
    text: |-
      Na splitsing van een partij die niet voldoet aan de achtergrondwaarden, opgenomen in de
      [tabellen 1 en 2 in bijlage B][ref1], kan voor de deelpartijen gebruik worden gemaakt van de milieuhygiënische
      verklaring voor de oorspronkelijke partij, mits het volgende wordt aangegeven op het meldingsformulier:


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.1
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 4.3.1.2.a
    text: de relatie tussen de deelpartij en de oorspronkelijke partij,
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.1
  - number: 4.3.1.2.b
    text: de persoon of instelling welke de splitsing heeft uitgevoerd, en
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.1
  - number: 4.3.1.2.c
    text: de datum waarop de splitsing is uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.1
  - number: 4.3.1.3
    text: Degene die de splitsing laat uitvoeren, is verantwoordelijk voor het gestelde in het eerste en het tweede lid.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.1
  - number: 4.3.1.4
    text: |-
      Het splitsen van een partij die blijkens de bijbehorende milieuhygiënische verklaring is ontstaan door samenvoeging
      van partijen overeenkomstig [artikel 4.3.2][ref1], of het splitsen van een partij die is ontstaan na splitsing van
      een zodanige samengevoegde partij, is uitsluitend toegestaan indien dit plaatsvindt op de wijze die is aangegeven
      in BRL 9335.


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel4
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.1
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
        afdeling: '1'
  - number: 4.3.2.1
    text: |-
      Het samenvoegen van verschillende partijen grond of baggerspecie tot een partij die groter is dan 25m3, is
      uitsluitend toegestaan indien deze:
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.2
  - number: 4.3.2.1.a
    text: in dezelfde bodemkwaliteitsklasse zijn ingedeeld, en
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.2
  - number: 4.3.2.1.b
    text: |-
      zijn gekeurd en samengevoegd overeenkomstig BRL 9335 of BRL 7500, door een persoon of instelling die daartoe
      beschikt over een erkenning.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.2
  - number: 4.3.2.2
    text: |-
      Bij het samenvoegen van partijen grond of baggerspecie vervallen de milieuhygiënische verklaringen voor de
      oorspronkelijke partijen en verstrekt de persoon of instelling die de partijen heeft samengevoegd daarvoor een
      milieuhygiënische verklaring.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.2
  - number: 4.3.2.3
    text: |-
      Voor het samenvoegen van partijen grond of baggerspecie die kleiner zijn dan 100 ton, is het toegestaan
      om in afwijking van het eerste lid, onder a, partijen grond of baggerspecie van verschillende of onbekende
      bodemkwaliteitsklassen samen te voegen overeenkomstig BRL 9335 of BRL 7500.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.2
  - number: 4.3.2.4
    text: |-
      Het eerste lid, onderdeel b, is niet van toepassing op het samenvoegen van partijen grond of baggerspecie als
      bedoeld in [artikel 39 van het besluit][ref1] die voorzien zijn van een erkende kwaliteitsverklaring als bedoeld in
      [artikel 4.3.6][ref2], overeenkomstig BRL 9313 of BRL 9321.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0023085#Artikel4
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.2
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '39'
      - id: ref2
        bwb_id: BWBR0023085
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
        afdeling: '1'
  - number: 4.3.3.1
    text: |-
      Partijkeuringen zijn niet toegestaan als milieuhygiënische verklaring als uit het vooronderzoek is gebleken
      dat de partij is ontstaan door het samenvoegen van verschillende partijen grond of baggerspecie overeenkomstig
      [artikel 4.3.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel4
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.3
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
        afdeling: '1'
  - number: 4.3.3.2
    text: |-
      Partijkeuringen zijn toegestaan als milieuhygiënische verklaring voor de kwaliteit van de toe te passen grond of
      baggerspecie, mits deze zijn gebaseerd op:
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.3
  - number: 4.3.3.2.a
    text: |-
      een vooronderzoek dat overeenkomstig NEN 5725, onderscheidenlijk NEN 5717 in aanvulling op het onderzoek van het
      standaard stoffenpakket, bedoeld in [artikel 4.5.1, eerste lid][ref1], is verricht, met inbegrip van onderzoek naar
      de eventuele aanwezigheid van andere verontreinigingen, die op grond van de ontstaansgeschiedenis van de partij
      kunnen worden verwacht en die een partij grond of baggerspecie ongeschikt kunnen maken voor toepassing;


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel4
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.3
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.5'
        afdeling: '1'
  - number: 4.3.3.2.b
    text: |-
      een onderzoek dat in aanvulling op het onderzoek van het standaard stoffenpakket, bedoeld in
      [artikel 4.5.1, eerste lid][ref1], is verricht naar de eventuele aanwezigheid van andere verontreinigingen, die een
      partij grond of baggerspecie ongeschikt kunnen maken voor toepassing, indien de partij is gereinigd overeenkomstig
      BRL 7500 door een bedrijf dat daartoe over een erkenning op grond van het besluit beschikt;


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel4
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.3
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.5'
        afdeling: '1'
  - number: 4.3.3.2.c
    text: |-
      een onderzoek dat in aanvulling op het onderzoek van het standaard stoffenpakket, bedoeld in
      [artikel 4.5.1, eerste lid][ref1], is verricht naar de eventuele aanwezigheid van andere verontreinigingen, die
      een partij grond of baggerspecie ongeschikt kunnen maken voor toepassing, indien de partij als nevenproduct is
      vrijgekomen bij het bewerken van een product waarbij aanhangende grond vrijkomt.


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel4
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.3
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.5'
        afdeling: '1'
  - number: 4.3.3.3
    text: 'Voor een partijkeuring geldt dat:'
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.3
  - number: 4.3.3.3.a
    text: de grootte van de partij maximaal 10.000 ton bedraagt;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.3
  - number: 4.3.3.3.b
    text: |-
      monsters worden genomen die uit ten minste 100 aselect of systematisch als punten van een regelmatig raster over de
      hele partij genomen grepen bestaan;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.3
  - number: 4.3.3.3.c
    text: de grepen evenredig worden verdeeld over ten minste twee te analyseren mengmonsters; en
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.3
  - number: 4.3.3.3.d
    text: bij een asbestanalyse wordt het gemiddelde berekend volgens NEN 5707.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.3
  - number: 4.3.3.4
    text: |-
      Bij toepassingen als bedoeld in [artikel 63 van het Besluit][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel63
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.3
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '63'
  - number: 4.3.3.4.a
    text: |-
      wordt de emissie bepaald door middel van de kolomproef volgens NEN 7373 of NEN 7383 aan de hand van ten minste één
      mengmonster, zoals bedoeld in het derde lid, onder c;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.3
  - number: 4.3.3.4.b
    text: |-
      wordt, indien bij de kolomproef door slechte doorlatendheid van het onderzochte materiaal onvoldoende vloeistof
      door de kolom stroomt, de emissie berekend aan de hand van de formule in [Bijlage K][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.3
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 4.3.3.4.c
    text: |-
      gelden, indien de emissie, bedoeld onder b, kleiner is dan L/S=2, voor het desbetreffende materiaal geen maximale
      emissiewaarden.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.3
  - number: 4.3.3.5
    text: |-
      De uitkomst van de partijkeuring wordt vastgelegd in een milieuhygiënische verklaring, die ten minste de volgende
      gegevens bevat:
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.3
  - number: 4.3.3.5.a
    text: de naam en het adres van de monsternemer en van het laboratorium;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.3
  - number: 4.3.3.5.b
    text: de data waarop monsterneming, monstervoorbehandeling en analyse zijn uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.3
  - number: 4.3.3.5.c
    text: |-
      een verwijzing naar de gebruikte normdocumenten en methoden, en een onderbouwing van eventuele afwijkingen hiervan,
      indien deze het analyseresultaat kunnen beïnvloeden;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.3
  - number: 4.3.3.5.d
    text: het volledig ingevulde monsternemingsformulier en monsternemingsplan of een kopie daarvan;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.3
  - number: 4.3.3.5.e
    text: een beschrijving van de partij, waaronder ligging, kenmerken en partijgrootte;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.3
  - number: 4.3.3.5.f
    text: |-
      het analyserapport van het laboratorium, inclusief de rekenkundige gemiddelden van de gemeten gehalten en indien
      van toepassing de gemeten emissies, een onderbouwing van de gekozen parameters, en de verhouding tussen de
      meetwaarden en daaruit voortvloeiende conclusies;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.3
  - number: 4.3.3.5.g
    text: een beschrijving van het onderzoek naar de ontstaansgeschiedenis van de partij grond of baggerspecie;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.3
  - number: 4.3.3.5.h
    text: 'een beschrijving van het onderzoek naar de aanwezigheid van:'
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.3
  - number: 4.3.3.5.h.1
    text: |-
      relevante verontreinigende stoffen die in [bijlage B][ref1] bij deze regeling zijn vermeld en waarvoor een
      normwaarde is opgenomen, en de waarde daarvan, uitgedrukt in mg/kg droge stof,


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.3
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 4.3.3.5.h.2
    text: |-
      relevante andere verontreinigende stoffen dan in [bijlage B][ref1] bij deze regeling zijn vermeld of
      verontreinigende stoffen waarvoor in die bijlage geen normwaarde is opgenomen, en de waarden daarvan, uitgedrukt in
      mg/kg droge stof, en


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.3
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 4.3.3.5.h.3
    text: relevant bodemvreemd materiaal anders dan steenachtig materiaal en hout, zoals plastic en piepschuim.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.3
  - number: 4.3.3.5.i
    text: een uniek nummer.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.3
  - number: 4.3.3.6
    text: |-
      In afwijking van het derde lid, onder a, geldt voor de bepaling van het gehalte aan asbest in de bodem en partijen
      grond overeenkomstig NEN 5707, een maximale partijgrootte van 2.000 ton.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.3
  - number: 4.3.3.7
    text: |-
      In afwijking van het derde lid, onder b, kunnen monsters die zich bevinden onder een verhardingslaag of een diepe
      bodemlaag overeenkomstig VKB-protocol 1001 worden genomen.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.3
  - number: 4.3.3.8
    text: |-
      In afwijking van het derde lid, onder b, worden monsters die worden genomen ten behoeve van onderzoek naar
      vluchtige verbindingen genomen overeenkomstig de werkwijze die daarvoor is beschreven is in VKB-protocol 1001.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.3
  - number: 4.3.3.9
    text: |-
      In afwijking van het derde lid, onder b, kunnen monsters ten behoeve van onderzoek naar asbest ook worden
      genomen volgens methode III zoals beschreven in bijlage 7 bij protocol 1001, zoals vermeld bij categorie 9 in
      [bijlage C][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.3
    references:
      - id: ref1
        bwb_id: BWBR0023085
  - number: 4.3.3.10
    text: |-
      In afwijking van het derde lid, onder c, worden monsters die worden geanalyseerd ten behoeve van onderzoek naar
      vluchtige verbindingen geanalyseerd volgens de werkwijze die daarvoor is beschreven is in AP04-SG.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.3
  - number: 4.3.4.1
    text: |-
      Bodemonderzoeken zijn toegestaan als milieuhygiënische verklaring voor de kwaliteit van de bodem, uitgezonderd de
      bodem of oever van een oppervlaktewaterlichaam, als wordt voldaan aan de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.4
  - number: 4.3.4.1.a
    text: 'het onderzoek is verricht overeenkomstig de onderzoeksstrategieën, bedoeld in NEN 5740, voor:'
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.4
  - number: 4.3.4.1.a.1
    text: een onverdachte locatie;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.4
  - number: 4.3.4.1.a.2
    text: een grootschalig onverdachte locatie;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.4
  - number: 4.3.4.1.a.3
    text: een onbekende bodembelasting;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.4
  - number: 4.3.4.1.a.4
    text: de toetsing of er sprake is van een schone bodem;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.4
  - number: 4.3.4.1.a.5
    text: de toetsing of er sprake is van een schone bodem op grootschalige locaties;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.4
  - number: 4.3.4.1.a.6
    text: |-
      de partijkeuring van niet-schone grond uit een diffuus belast gebied met een heterogene verdeling van de
      verontreinigende stof; en
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.4
  - number: 4.3.4.1.b
    text: |-
      het onderzoek is gebaseerd op een vooronderzoek dat overeenkomstig NEN 5725 is verricht en dat heeft plaatsgevonden
      in aanvulling op het onderzoek van het standaard stoffenpakket, bedoeld in [artikel 4.5.1, eerste lid][ref1], met
      inbegrip van onderzoek naar de eventuele aanwezigheid van andere verontreinigingen, die op grond van de historie
      van de te onderzoeken locatie kunnen worden verwacht en die relevant kunnen zijn voor het toepassen van een partij
      grond of baggerspecie.


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Artikel4
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.4
    references:
      - id: ref1
        bwb_id: BWBR0023085
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.5'
        afdeling: '1'
  - number: 4.3.4.2
    text: |-
      Bodemonderzoeken zijn toegestaan als milieuhygiënische verklaring voor de kwaliteit van de toe te passen grond,
      mits deze voldoen aan de onderzoeksstrategieën, bedoeld in NEN 5740, en zijn gebaseerd op een vooronderzoek
      overeenkomstig NEN 5725 waarbij het standaard stoffenpakket is aangevuld met andere verontreinigende stoffen die op
      grond van historie van de te onderzoeken locatie kunnen worden verwacht, voor:
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.4
  - number: 4.3.4.2.a
    text: 'het onderzoek is verricht overeenkomstig de onderzoeksstrategieën, bedoeld in NEN 5740, voor:'
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.4
  - number: 4.3.4.2.a.1
    text: de toetsing of er sprake is van een schone bodem;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.4
  - number: 4.3.4.2.a.2
    text: de toetsing of er sprake is van een schone bodem op grootschalige locaties;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.4
  - number: 4.3.4.2.a.3
    text: |-
      de partijkeuring van niet-schone grond uit een diffuus belast gebied met een heterogene verdeling van de
      verontreinigende stof; en
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.4
  - number: 4.3.4.2.b
    text: |-
      het onderzoek is gebaseerd op een vooronderzoek dat overeenkomstig NEN 5725 is verricht waarbij het standaard
      stoffenpakket is aangevuld met andere verontreinigende stoffen die op grond van historie van de te onderzoeken
      locatie kunnen worden verwacht.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.4
  - number: 4.3.4.3
    text: |-
      Bodemonderzoeken zijn toegestaan als milieuhygiënische verklaring voor de kwaliteit van de bodem of oever van een
      oppervlaktewaterlichaam of baggerspecie, mits deze voldoen aan de onderzoeksstrategieën, bedoeld in NEN 5720, en
      zijn gebaseerd op een vooronderzoek overeenkomstig NEN 5717 waarbij het standaard stoffenpakket is aangevuld met
      andere verontreinigende stoffen die op grond van historie van de te onderzoeken locatie kunnen worden verwacht.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.4
  - number: 4.3.4.4
    text: |-
      In afwijking van het derde lid kan voor het verspreiden van baggerspecie als bedoeld in
      [artikel 35, onder f of i, van het besluit][ref1], voor het bodemonderzoek worden volstaan met een vooronderzoek
      overeenkomstig NEN 5717, indien daaruit is gebleken dat de baggerspecie niet afkomstig is van oppervlaktewateren in
      de gebieden:


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel35
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.4
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '35'
  - number: 4.3.4.4.a
    text: die zijn bebouwd, daaronder begrepen kassen- en industriegebieden;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.4
  - number: 4.3.4.4.b
    text: waar regelmatig beroeps- of pleziermotorvaart plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.4
  - number: 4.3.4.4.c
    text: waar geloosd wordt na de laatste keer dat er is gebaggerd;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.4
  - number: 4.3.4.4.d
    text: |-
      grenzend aan wegen met een verkeersintensiteit van meer dan 500 voertuigen per dag, tenzij het betreft bermsloten
      op een afstand van ten minste 15 meter waarin de wegriolering niet loost;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.4
  - number: 4.3.4.4.e
    text: met een oeverbeschoeiing die bestaat uit met gecreosoteerde olie behandeld hout;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.4
  - number: 4.3.4.4.f
    text: |-
      waarvan redelijkerwijs vermoed kan worden dat deze niet voldoen aan de maximale waarden voor het verspreiden van
      baggerspecie als bedoeld in [artikel 35, onder f en i, van het besluit][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel35
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.4
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '35'
  - number: 4.3.4.4.g
    text: |-
      die niet zijn aangegeven in een beheerplan als bedoeld in [artikel 4.6 van de Waterwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel4
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.4
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '4'
  - number: 4.3.4.5
    text: |-
      Bij bodemonderzoeken als bedoeld in het eerste en derde lid kan onderzoek naar de kwaliteit van het grondwater en
      de kwaliteit van de grond van de ontvangende bodem, die zich bevindt op 0,5 meter en dieper onder het maaiveld,
      achterwege blijven.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.4
  - number: 4.3.5.1
    text: |-
      Een kaart van de actuele kwaliteit van de bodem als bedoeld in [artikel 47, onder a][ref1], of [48, onder a][ref2],
      of [57, tweede lid, van het besluit][ref3] wordt opgesteld met inachtneming van de richtlijnen, genoemd in
      [bijlage D, onderdeel II][ref4], en de eisen, gesteld in [bijlage M][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0022929#Artikel57
      [ref4]: https://wetten.overheid.nl/BWBR0023085
      [ref5]: https://wetten.overheid.nl/BWBR0023085
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.5
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '47'
      - id: ref2
        bwb_id: BWBR0022929
        artikel: '48'
      - id: ref3
        bwb_id: BWBR0022929
        artikel: '57'
      - id: ref4
        bwb_id: BWBR0023085
      - id: ref5
        bwb_id: BWBR0023085
  - number: 4.3.5.2
    text: |-
      Een kaart als bedoeld in het eerste lid heeft een geldigheidsduur van maximaal vijf jaar. De geldigheidsduur kan
      worden verlengd.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.5
  - number: 4.3.5.3
    text: |-
      Het bevoegd gezag zendt de geografische bronbestanden van een kaart als bedoeld in het eerste lid, uiterlijk twee
      maanden na vaststelling aan Bodem+.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.5
  - number: 4.3.5.4
    text: 'Op grond van een bodemkwaliteitskaart kan een milieuhygiënische verklaring worden afgegeven van:'
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.5
  - number: 4.3.5.4.a
    text: de kwaliteit van de bodem;
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.5
  - number: 4.3.5.4.b
    text: de grond of baggerspecie.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.5
  - number: 4.3.5.5
    text: |-
      Indien het bevoegd gezag een bodemkwaliteitskaart vaststelt met een geldigheidsduur korter dan vijf jaar kan
      een milieuhygiënische verklaring als bedoeld in het vierde lid alleen worden afgegeven met als einddatum de
      vastgestelde geldigheidsduur van de kaart.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.5
  - number: 4.3.5.6
    text: 'Het bepaalde in het vierde lid, aanhef en onder a, geldt alleen, indien:'
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.5
  - number: 4.3.5.6.a
    text: |-
      uit een vooronderzoek overeenkomstig NEN 5725, voor zover het de bodem, uitgezonderd de bodem of oever van een
      oppervlaktewaterlichaam, betreft, of NEN 5717, voor zover het de bodem of oever van een oppervlaktewaterlichaam
      betreft, is gebleken dat de bodem waarop de milieuhygiënische verklaring betrekking heeft, is gelegen binnen de
      bodemkwaliteitszone die op de bodemkwaliteitskaart is aangegeven, en
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.5
  - number: 4.3.5.6.b
    text: |-
      uit een vooronderzoek overeenkomstig NEN 5725, onderscheidenlijk NEN 5717, is gebleken dat de bodem waarop de
      milieuhygiënische verklaring betrekking heeft niet afwijkt van de kwaliteit die op de bodemkwaliteitskaart is
      aangegeven.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.5
  - number: 4.3.5.7
    text: 'Het bepaalde in het vierde lid, aanhef en onder b, geldt alleen, indien:'
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.5
  - number: 4.3.5.7.a
    text: |-
      de toepassingslocatie en de plaats van herkomst van de grond of baggerspecie gelegen zijn binnen het gebied waarop
      de bodemkwaliteitskaart betrekking heeft, of
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.5
  - number: 4.3.5.7.b
    text: |-
      de grond of baggerspecie afkomstig is van een bodembeheergebied, dat op grond van
      [artikel 47 van het besluit][ref1] als basis kan dienen voor milieuhygiënische verklaringen, en daarbinnen wordt
      toegepast, en


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel47
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.5
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '47'
  - number: 4.3.5.7.c
    text: |-
      voor alle gemeten stoffen de P95 van de bodemkwaliteitszone van de plaats van herkomst van de grond
      of baggerspecie op de toepassingslocatie niet leidt tot een overschrijding van de waarden, bedoeld in
      [artikel 44, tweede lid, onder c, van het besluit][ref1], hetgeen wordt berekend met behulp van de risicomodule,
      bedoeld in [artikel 4.8.1][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0023085#Artikel4
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.5
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '44'
      - id: ref2
        bwb_id: BWBR0023085
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.8'
        afdeling: '2'
  - number: 4.3.5.7.d
    text: |-
      uit een vooronderzoek overeenkomstig NEN 5725, onderscheidenlijk NEN 5717, is gebleken dat de partij grond of
      baggerspecie, waarop de milieuhygiënische verklaring betrekking heeft, afkomstig is uit het toepassingsgebied dat
      op de bodemkwaliteitskaart is aangegeven, en
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.5
  - number: 4.3.5.7.e
    text: |-
      uit een vooronderzoek overeenkomstig NEN 5725, onderscheidenlijk NEN 5717, is gebleken dat de partij grond of
      baggerspecie waarop de milieuhygiënische verklaring betrekking heeft, niet afwijkt van de kwaliteit die op de
      bodemkwaliteitskaart is aangegeven.
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.5
  - number: 4.3.6
    text: |-
      Voor het verkrijgen van een erkende kwaliteitsverklaring voor grond of baggerspecie is [paragraaf 3.6][ref1]
      van overeenkomstige toepassing, met dien verstande dat voor bouwstof, grond of baggerspecie moet worden gelezen.
      Hierbij wordt volgens [paragraaf 4.2][ref2] vastgesteld of, in afwijking van [artikel 3.6.1, tweede lid][ref3],
      sprake is van overschrijding van de in de tabellen 1 en 2 van [bijlage B][ref4] opgenomen waarden en de
      partijkeuring is uitgevoerd volgens [artikel 4.3.3, eerste tot en met vierde en zesde lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0023085#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0023085#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0023085
      [ref5]: https://wetten.overheid.nl/BWBR0023085#Artikel4
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.6
    references:
      - id: ref1
        bwb_id: BWBR0023085
        hoofdstuk: '3'
        paragraaf: '3.6'
      - id: ref2
        bwb_id: BWBR0023085
        hoofdstuk: '4'
        paragraaf: '4.2'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0023085
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
      - id: ref4
        bwb_id: BWBR0023085
      - id: ref5
        bwb_id: BWBR0023085
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
        afdeling: '1'
  - number: 4.3.7
    text: |-
      Voor het afgeven van een fabrikant-eigenverklaring voor grond of baggerspecie door een producent
      is [paragraaf 3.5][ref1] van overeenkomstige toepassing, met dien verstande dat voor bouwstof
      grond of baggerspecie moet worden gelezen. Hierbij wordt volgens [paragraaf 4.2][ref2] vastgesteld
      of, in afwijking van [artikel 3.5.1, eerste lid][ref3], sprake is van overschrijding van een
      achtergrondwaarde als bedoeld in [tabel 1 of 2 van bijlage B][ref4] en de partijkeuring uitgevoerd volgens
      [artikel 4.3.3, eerste tot en met vierde en zesde lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0023085#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0023085#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0023085#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0023085
      [ref5]: https://wetten.overheid.nl/BWBR0023085#Artikel4
    url: https://wetten.overheid.nl/BWBR0023085/2023-12-21#Artikel4.3.7
