      3 Indien de deelnemer een opleiding volgt in een beroepsopleidende leerweg waarvoor het bevoegd gezag een in
      instellingstijd verzorgd onderwijsprogramma heeft vastgesteld dat, met inbegrip van de beroepspraktijkvorming,
