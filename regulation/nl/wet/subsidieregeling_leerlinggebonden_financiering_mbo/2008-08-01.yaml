        artikel: '8'
  - number: '2'
    text: |-
      Het doel van deze regeling is het invoeren van een leerlinggebonden budget voor deelnemers aan een beroepsopleiding
      die de leeftijd van 30 jaar nog niet hebben bereikt, voor zover de commissie voor de indicatiestelling heeft
      besloten dat deze deelnemers in aanmerking komen voor een leerlinggebonden budget.
    url: https://wetten.overheid.nl/BWBR0019181/2008-08-01#Artikel2
  - number: '3'
    text: |-
      Subsidie wordt verleend aan instellingen ten behoeve van een samenwerkingsverband van die instelling en een
      regionaal expertisecentrum of een school voor vso.
    url: https://wetten.overheid.nl/BWBR0019181/2008-08-01#Artikel3
  - number: '4'
    text: |-
      1 Het bevoegd gezag van een instelling dient ten behoeve van het in [artikel 3][ref1] bedoelde
      samenwerkingsverband, een subsidieaanvraag bij de minister in voor een bij die instelling ingeschreven deelnemer
      die op grond van een besluit van de commissie voor de indicatiestelling of een besluit van de minister in
      aanmerking komt voor een leerlinggebonden budget

      2 De aanvraag voor de subsidie geschiedt met gebruikmaking van het aanvraagformulier leerlinggebonden budget zoals
      is vastgesteld in [bijlage A][ref2] bij deze regeling.

      3

      4 Een aanvraag wordt geweigerd indien de deelnemer de leeftijd van 30 jaar heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0019181#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0019181
    url: https://wetten.overheid.nl/BWBR0019181/2008-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0019181
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019181
  - number: '5'
    text: |-
      1 Binnen drie maanden na indiening van de aanvraag stelt het bevoegd gezag van de instelling een handelingsplan op
      in overeenstemming met de deelnemer of de ouder. Beide partijen ondertekenen het handelingsplan.

      2 Het handelingsplan bevat tenminste informatie over de volgende onderwerpen:

      a. de maatregelen die de instelling treft met het oog op het halen van de in de onderwijsovereenkomst gestelde
      doelen in relatie tot de gestelde indicatie,

      b. de inzet van de ambulante begeleiding en

      c. een begroting van kosten gerelateerd aan de onder a en b genoemde activiteiten.

      3 In overeenstemming met de deelnemer of de ouder evalueert het bevoegd gezag van de instelling jaarlijks het
      handelingsplan en past dit zonodig aan.
    url: https://wetten.overheid.nl/BWBR0019181/2008-08-01#Artikel5
  - number: '6'
    text: |-
      1 De instelling sluit met de school voor vso of het regionaal expertisecentrum een samenwerkingsovereenkomst inzake
      de ambulante begeleiding die de school voor vso of het regionaal expertisecentrum biedt aan de deelnemer voor wie
      subsidie wordt aangevraagd.

      2 In de samenwerkingsovereenkomst wordt door de partijen vastgelegd dat de in [artikel 7][ref1] bedoelde
      verplichting een gezamenlijke verantwoordelijkheid is en dat de school voor vso of het regionaal expertisecentrum
      de taken en verplichtingen voortvloeiend uit [artikel 12][ref2] op zich neemt.

      3 De samenwerkingsovereenkomst wordt in verband met de controle van de instellingsaccountant bewaard in de
      administratie van de instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0019181#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0019181#Artikel12
    url: https://wetten.overheid.nl/BWBR0019181/2008-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0019181
        artikel: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0019181
        artikel: '12'
        paragraaf: '5'
  - number: '7'
    text: |-
      De instelling werkt mee aan door of namens de minister ingestelde onderzoeken die erop gericht zijn de minister
      inlichtingen te verschaffen ten behoeve van de ontwikkeling, monitoring en evaluatie van het beleid in verband met
      deze regeling.
    url: https://wetten.overheid.nl/BWBR0019181/2008-08-01#Artikel7
  - number: '8'
    text: |-
      1 Subsidie wordt verleend met ingang van de eerste dag van de maand volgend op de maand waarin de subsidieaanvraag
      is ingediend. Indien de subsidieaanvraag is ingediend voordat het onderwijs feitelijk is begonnen, wordt subsidie
      verleend met ingang van de eerste dag van de maand waarin het onderwijs feitelijk is begonnen.

      2 Subsidie wordt behoudens het derde lid verleend voor de duur van de door de commissie voor de indicatiestelling
      expertisecentra verleende indicatiestelling.

      3 De subsidie eindigt van rechtswege:

      a. indien de deelnemer tijdens een subsidiejaar de leeftijd van 30 jaar bereikt: aan het einde van het
      subsidiejaar;

      b. indien de deelnemer van leerweg of opleidingsniveau verandert: aan het einde van het subsidiejaar;

      c. indien de deelnemer de instelling verlaat of niet langer een opleiding volgt als bedoeld in tabel A: met ingang
      van de maand na het uitschrijven van de deelnemer.
    url: https://wetten.overheid.nl/BWBR0019181/2008-08-01#Artikel8
  - number: '9'
    text: |-
      1 Het subsidiebedrag wordt vastgesteld aan de hand van de bedragen op jaarbasis zoals verwerkt in onderstaande
      tabellen A en B, waarbij tabel A het bedrag bevat dat besteed wordt door de instelling en tabel B het bedrag
      bevat dat besteed wordt door het regionaal expertisecentrum of de school voor vso die de ambulante begeleiding
      van de deelnemer verzorgt en die terzake daarvan de in [artikel 6][ref1] bedoelde samenwerkingsovereenkomst met de
      instelling heeft gesloten.


