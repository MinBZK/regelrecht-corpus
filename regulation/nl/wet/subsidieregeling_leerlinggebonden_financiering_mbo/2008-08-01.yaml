preamble:
  text: |-
    Mede namens de Minister van Landbouw, Natuur en Voedselkwaliteit;

    Gelet op artikel 4, eerste lid, van de Wet overige OCenW-subsidies en artikel 2.2.3 van de Wet educatie en
    beroepsonderwijs;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0019181/2008-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. wet: de [Wet educatie en beroepsonderwijs][ref1];

      b. minister: de Minister van Onderwijs, Cultuur en Wetenschap en, voor zover het betreft het onderwijs aan een
      agrarisch opleidingscentrum als bedoeld in [artikel 1.1.1, onder b, van de wet][ref2], de Minister van Landbouw,
      Natuur en Voedselkwaliteit;

      c. beroepsopleiding: een beroepsopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onder a tot en met e, van de wet][ref3];

      d. deelnemer: de aan een instelling ingeschreven deelnemer die een beroepsopleiding volgt waarvoor het
      bevoegde gezag een in instellingstijd verzorgd onderwijsprogramma heeft vastgesteld, dat, met inbegrip van de
      beroepspraktijkvorming, een omvang van tenminste 300 uren per volledig studiejaar omvat.

      e. instelling: een instelling als bedoeld in [artikel 1.1.1, onder b][ref4], en een hogeschool als bedoeld in
      [artikel 12.3.9 van de wet][ref5];

      f. commissie voor de indicatiestelling: een commissie, als bedoeld in
      [artikel 28c van de Wet op de expertisecentra][ref6];

      g. landelijke commissie toezicht indicatiestelling: de commissie, bedoeld in
      [artikel 28e van de Wet op de expertisecentra][ref7];

      h. ministeriële commissie voor de indicatiestelling: de in [artikel 28d van de Wet op de expertisecentra][ref8]
      bedoelde commissie;

      i. regionaal expertisecentrum: het centrum, bedoeld in [artikel 28b van de Wet op de expertisecentra][ref9];

      j. school voor vso: een school voor voortgezet speciaal onderwijs of voor speciaal en voortgezet speciaal onderwijs
      als bedoeld in [artikel 8 van de Wet op de expertisecentra][ref10];

      k. subsidiejaar: de tijdsperiode tussen 1 augustus van enig jaar en 1 augustus van het daaropvolgende jaar.


