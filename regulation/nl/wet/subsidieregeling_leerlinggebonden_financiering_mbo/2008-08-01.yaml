  - number: '10'
    text: |-
      1 De subsidie wordt in jaarlijkse termijnen uitgekeerd, telkens in augustus van ieder jaar.

      2 Indien de aanvraag niet tijdig voor 1 augustus van een jaar is gedaan, wordt de eerste termijn uitgekeerd binnen
      4 weken nadat de beslissing tot subsidieverlening is genomen.
    url: https://wetten.overheid.nl/BWBR0019181/2008-08-01#Artikel10
  - number: '11'
    text: |-
      1 De subsidie wordt uitsluitend aangewend voor het doel waarvoor zij is verstrekt.

      2 Indien het geval, bedoeld in [artikel 8, derde lid onder a, b of c][ref1] zich voordoet meldt het bevoegd gezag
      dit voor het einde van het studiejaar onderscheidenlijk binnen 4 weken na het uitschrijven van de deelnemer. De
      minister kan nadere aanwijzingen geven over de wijze waarop deze melding dient te geschieden.

      3 De verklaring van de accountant bij de jaarrekening omvat tevens een oordeel over de rechtmatige verkrijging en
      besteding van deze subsidie.

      4 De subsidie wordt verantwoord in de jaarrekening die betrekking heeft op het jaar waarin de subsidie is besteed.
      In de jaarrekening van het jaar waarin de subsidie nog niet volledig is besteed, wordt aangegeven wat de stand is
      van de uitgaven in relatie tot de subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0019181#Artikel8
    url: https://wetten.overheid.nl/BWBR0019181/2008-08-01#Artikel11
