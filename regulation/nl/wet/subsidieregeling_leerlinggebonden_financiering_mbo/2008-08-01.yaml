  - number: '12'
    text: |-
      De [artikelen 8a][ref1], [28b][ref2], [28c met uitzondering van het derde lid][ref3], [28d][ref4] en
      [28e van de Wet op de expertisecentra][ref5] zijn van overeenkomstige toepassing met dien verstande dat:

      a. onder ‘leerling’ wordt verstaan ‘deelnemer’;

      b. onder ‘een school als bedoeld in de [Wet op het primair onderwijs][ref6] of
      de[ Wet op het voortgezet onderwijs][ref7]’ wordt verstaan ‘een instelling als bedoeld in artikel 1, onder e, van
      de subsidieregeling leerlinggebonden financiering BVE’;

      c. wanneer in één van de in de aanhef genoemde artikelen wordt verwezen naar taken, bevoegdheden of verplichtingen
      in een ander, in de aanhef genoemd artikel, daaronder mede wordt verstaan de taken, bevoegdheden of verplichtingen
      die zijn toegekend op grond van deze regeling, en

      d. het bepaalde in de [artikelen 13 tot en met 15][ref8] in acht wordt genomen.


