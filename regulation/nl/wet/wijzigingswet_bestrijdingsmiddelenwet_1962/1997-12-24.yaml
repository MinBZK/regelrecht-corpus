      - id: ref2
        bwb_id: BWBR0002380
        artikel: 3a
  - number: III
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0009193/1997-12-24#ArtikelIII
