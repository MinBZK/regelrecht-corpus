preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is enkele bepalingen van de Bestrijdingsmiddelenwet
    1962, voor zover die van toepassing zijn op niet-landbouwbestrijdingsmiddelen, opnieuw te doen vaststellen teneinde
    te kunnen voldoen aan richtlijn nr. 83/189/EEG van de Raad van de Europese Gemeenschappen van 28 maart 1983
    betreffende een informatieprocedure op het gebied van normen en technische voorschriften (PbEG L 109);

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009193/1997-12-24#ArtikelAanhef
articles:
  - number: II
    text: |-
      Voor zover het niet-landbouwbestrijdingsmiddelen betreft, zijn de [artikelen 3][ref1], eerste lid, onderdeel a,
      onder 8, en [3a, eerste lid, van de Bestrijdingsmiddelenwet 1962][ref2] niet van toepassing op volledige aanvragen
      die zijn ingediend voor de inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002380#Artikel3a
    url: https://wetten.overheid.nl/BWBR0009193/1997-12-24#ArtikelII
    references:
      - id: ref1
