preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is ter uitvoering van richtlijn nr. 91/414/
    EEG van de Raad van de Europese Gemeenschappen van 15 juli 1991 betreffende het op de markt brengen van
    gewasbeschermingsmiddelen (PbEG L 230) de Bestrijdingsmiddelenwet 1962 te wijzigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007116/1995-03-01#ArtikelAanhef
articles:
  - number: II
    text: |-
      1 Bestrijdingsmiddelen die ten tijde van de inwerkingtreding van [artikel I, onderdeel D][ref1], van deze wet zijn
      toegelaten, worden, onverminderd het bepaalde in de [artikelen 5 en 7 van de Bestrijdingsmiddelenwet 1962][ref2],
      geacht te zijn toegelaten.

      2 Bestrijdingsmiddelen waarvoor voorafgaande aan de inwerkingtreding van [artikel I, onderdeel D][ref3], van
      deze wet een aanvraag tot toelating op de dan krachtens [artikel 4 van de Bestrijdingsmiddelenwet 1962][ref4]
      voorgeschreven wijze is ingediend, onderscheidenlijk de procedure tot verlenging van de toelating een aanvang heeft
      genomen, worden gedurende twee jaar na inwerkingtreding van genoemd artikelonderdeel beoordeeld aan de hand van de
      tekst van de [Bestrijdingsmiddelenwet 1962][ref5] zoals deze luidde voor die inwerkingtreding, met uitzondering van
      het bepaalde in artikel 3, eerste lid, van die wet, voor zover het gewasbeschermingsmiddelen betreft.


