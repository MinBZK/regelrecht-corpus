  - number: IV
    text: |-
      Na inwerkingtreding van deze wet:

      a. berust het Besluit van 6 maart 1989, houdende uitvoering van [artikel 1, zesde lid, onderdeel ][ref1] op artikel
      1, vierde lid, van die wet;

      b. berust het [Besluit milieutoelatingseisen bestrijdingsmiddelen][ref2] op [artikel 3][ref3];

      c. berust de Regeling samenstelling, indeling, verpakking en etikettering bestrijdingsmiddelen op
      [artikel 3, tweede lid, onderdeel ][ref4] en op [artikel 2, tweede lid, van het Bestrijdingsmiddelenbesluit][ref5].


