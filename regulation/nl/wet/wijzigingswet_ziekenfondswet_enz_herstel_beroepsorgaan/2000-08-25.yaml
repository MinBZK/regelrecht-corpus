preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de door de Wet van 27 maart 1999 tot wijziging van de
    Ziekenfondswet, de Wet tarieven gezondheidszorg en de Wet ziekenhuisvoorzieningen in verband met wijzigingen in de
    taak, samenstelling en de werkwijze van de in die wetten geregelde bestuursorganen, alsmede wijziging van andere
    wetten in verband daarmee (uitvoeringsorganen volksgezondheid) (Stb. 1999, 185) niet beoogde wijzigingen in de
    aanduiding van het orgaan waarbij het personeel van het College voor zorgverzekeringen beroep kan instellen en van
    het orgaan waarbij door een belanghebbende beroep kan worden ingesteld tegen een besluit van het College in het
    kader van de kring der verzekerden Algemene Wet Bijzondere Ziektekosten, ongedaan te maken alsmede een door die wet
    onduidelijke tekst van artikel 51 van de Wet financiering volksverzekeringen te corrigeren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0011463/2000-08-25#ArtikelAanhef
articles:
  - number: IV
    text: |-
      Een beroep tegen een besluit als bedoeld in [artikel 77, tweede volzin, van de Ziekenfondswet][ref1]
      respectievelijk [artikel 62, tweede volzin, van de Algemene Wet Bijzondere Ziektekosten][ref2], zoals die
      artikelen luiden met ingang van de datum van inwerkingtreding van deze wet, dat voor die datum bij de Afdeling
      bestuursrechtspraak van de Raad van State is ingesteld op grond van [artikel 77 van de Ziekenfondswet][ref3]
      respectievelijk [artikel 62 van de Algemene Wet Bijzondere Ziektekosten][ref4], zoals die artikelen tot dat
      tijdstip luidden, en waarop nog niet onherroepelijk is beslist, wordt ter behandeling overgedragen aan de bevoegde
      rechtbank.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel77
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel62
      [ref3]: https://wetten.overheid.nl/BWBR0002460#Artikel77
      [ref4]: https://wetten.overheid.nl/BWBR0002614#Artikel62
