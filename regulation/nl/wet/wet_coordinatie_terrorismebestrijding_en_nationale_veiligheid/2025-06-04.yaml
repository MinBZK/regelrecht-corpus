  - number: '4'
    text: |-
      Onze Minister benoemt een functionaris voor gegevensbescherming die in het bijzonder is belast met de taken,
      bedoeld in artikel 37 van de Algemene verordening gegevensbescherming, ten aanzien van de verwerking van
      persoonsgegevens op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0049262/2025-06-04#Artikel4
  - number: '5'
    text: |-
      1 Onze Minister draagt zorg voor het periodiek doen verrichten van gegevensbeschermingsaudits ten aanzien van het
      gebruik van de in [artikel 3, eerste lid, onderdeel a][ref1], bedoelde bronnen, voor zover dit online bronnen
      zijn.

      2 Indien uit de controleresultaten blijkt dat niet wordt voldaan aan het bij of krachtens deze wet bepaalde,
      laat Onze Minister binnen een jaar een hercontrole uitvoeren op die onderdelen die niet voldeden aan de gestelde
      voorwaarden.

      3 Bij algemene maatregel van bestuur worden nadere regels gesteld betreffende de inhoud en wijze van uitvoering van
      de controles bedoeld in het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0049262#Artikel3
    url: https://wetten.overheid.nl/BWBR0049262/2025-06-04#Artikel5
    references:
