  - number: '6'
    text: |-
      Voor zover dit noodzakelijk is met het oog op de in [artikel 2][ref1] bedoelde taak, kunnen de
      verwerkingsverantwoordelijken voor de gegevens die worden verwerkt in verband met de onderstaande taken en
      bevoegdheden, deze gegevens, waaronder persoonsgegevens, verstrekken aan Onze Minister:

      a. de taken en bevoegdheden van Onze Minister van Buitenlandse Zaken:

        - op grond van artikel 2, punten 2 tot en met 5 van de Visumcode en
      [artikel 2, tweede lid, van de Rijksvisumwet][ref2], indien er sprake is van een mogelijk risico voor de openbare
      orde en binnenlandse veiligheid als bedoeld in de Visumcode;
        - ten aanzien van het verrichten van consulaire bijstand;
        - op grond van de bij of krachtens de [Sanctiewet 1977][ref3] gestelde regels;

      b. de taken en bevoegdheden van de burgemeester op het terrein van de handhaving van de openbare orde op grond van
      de [Gemeentewet][ref4];

      c. de taken en bevoegdheden die de raad voor de kinderbescherming uitoefent namens Onze Minister op grond van
      [artikel 238 van Boek 1 van het Burgerlijk Wetboek][ref5];

      d. de taken en bevoegdheden bij of krachtens de wet toegekend aan reclasseringsinstellingen;

      e. de taken en bevoegdheden van Onze Minister op grond van:

        - [artikel 37ab van de Luchtvaartwet][ref6];
        - [artikel 23][ref7] en [23b van de Paspoortwet][ref8];
        - [artikel 14 van de Rijkswet op het Nederlanderschap][ref9];
        - de [Tijdelijke wet bestuurlijke maatregelen terrorismebestrijding][ref10];
        - de [Wet beveiliging netwerk- en informatiesystemen][ref11];

      f. andere taken en bevoegdheden indien de betreffende wetgeving in de verstrekking voorziet met inachtneming van
      die wetgeving.


