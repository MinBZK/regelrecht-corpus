preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een wettelijke grondslag te bieden voor de coördinatie
    ten aanzien van terrorismebestrijding en de bescherming van de nationale veiligheid ten behoeve van het verhogen
    van de weerbaarheid tegen dreigingen en risico’s en daarbij de nodige waarborgen op te nemen voor de bescherming
    van de persoonlijke levenssfeer;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0049262/2025-06-04#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *Onze Minister:* Onze Minister van Justitie en Veiligheid;
        - *Visumcode:* [verordening 810/2009/EG](32009R0810) van het Europees Parlement en de Raad van 13 juli 2009 tot
      vaststelling van een gemeenschappelijke visumcode (PbEU 2009, L 243).
    url: https://wetten.overheid.nl/BWBR0049262/2025-06-04#Artikel1
  - number: '2'
    text: |-
      1 Onverminderd de taken en bevoegdheden van betrokken overheidsorganisaties op grond van de op hen toepasselijke
      wetgeving, coördineert Onze Minister de samenhang en effectiviteit van het beleid en de door overheidsorganisaties
      te nemen maatregelen in het kader van terrorismebestrijding en de bescherming van de nationale veiligheid,
      met het oog op het verhogen van de weerbaarheid tegen dreigingen en risico’s, het beschermen van de nationale
      veiligheidsbelangen en het voorkomen van maatschappelijke ontwrichting.

      2 De in het eerste lid bedoelde taak ziet op:

      a. het bevorderen van de samenwerking tussen betrokken overheidsorganisaties en maatschappelijke organisaties;

      b. het bevorderen van de informatiedeling tussen betrokken overheidsorganisaties voor zover dit noodzakelijk is met
      het oog op het treffen van maatregelen naar aanleiding van een concrete gebeurtenis;

      c. het bevorderen van de samenhang en effectiviteit van het in het eerste lid bedoelde beleid en het evalueren
      van dit beleid, met name naar aanleiding van de concrete toepassing van het beleid en genomen maatregelen in de
      praktijk en, indien de evaluatie daartoe aanleiding geeft, het op basis daarvan in samenwerking met betrokken
      overheidsorganisaties ontwikkelen van voorstellen voor verbetering.

      3 In verband met de taak, bedoeld in het eerste lid, kan Onze Minister trends en fenomenen signaleren, analyseren
      en duiden. In dat kader wordt geen onderzoek gedaan gericht op personen, of organisaties.
    url: https://wetten.overheid.nl/BWBR0049262/2025-06-04#Artikel2
  - number: '3'
    text: |-
      1 Onze Minister kan, voor zover dit noodzakelijk is voor de uitvoering van de in [artikel 2][ref1] bedoelde taak,
      gegevens, waaronder persoonsgegevens, verwerken:

      a. afkomstig uit publiek toegankelijke bronnen;

      b. ontvangen op grond van [artikel 6][ref2].

      2 Bij het gebruik van de in het eerste lid, onderdeel a, bedoelde bronnen wordt, indien dit onlinebronnen zijn,
      geen gebruik gemaakt van technische hulpmiddelen die op basis van profilering persoonsgegevens verzamelen,
      analyseren en combineren.

      3 Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot te nemen technische, personele en
      organisatorische maatregelen, waaronder regels over functiescheiding, autorisatie voor het gebruik van bepaalde
      systemen, opslag en beveiliging.

      4 Persoonsgegevens afkomstig uit publiek toegankelijke onlinebronnen, met uitzondering van bronnen
      die onder het toepassingsbereik van artikel 85 van de Algemene verordening gegevensbescherming en
      [artikel 43 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref3] vallen, worden binnen een jaar
      na opslaan vernietigd, met dien verstande dat uitsluitend met het oog op de afhandeling van een inzageverzoek
      of een procedure in rechte deze gegevens langer bewaard kunnen worden, voor zover dat voor deze doeleinden
      noodzakelijk is.

      5 In afwijking van het vierde lid kan de bewaartermijn van persoonsgegevens na advies van de in [artikel 4][ref4]
      bedoelde functionaris voor gegevensbescherming telkens met zes maanden worden verlengd, indien deze
      verlenging noodzakelijk is voor het signaleren, analyseren en duiden van een trend of fenomeen als bedoeld in
      [artikel 2, derde lid][ref5] en deze verlenging geringe gevolgen heeft voor de bescherming van de persoonlijke
      levenssfeer van betrokkene.

      6 Persoonsgegevens die voorkomen in gegevens verwerkt op grond van het eerste lid, onderdeel b, worden vernietigd
      zodra zij niet langer noodzakelijk zijn voor de uitvoering van de in [artikel 2][ref6] bedoelde taak, doch
      uiterlijk een jaar na de laatste verwerking.

      7 Onze Minister is de verwerkingsverantwoordelijke voor de verwerking van persoonsgegevens op grond van deze wet.


