  - number: '7'
    text: |-
      1 Onze Minister kan ten behoeve van de in [artikel 2][ref1] bedoelde taak, gegevens, waaronder persoonsgegevens,
      verstrekken aan:

      a. de in [artikel 6, aanhef en onderdelen a tot en met e][ref2], bedoelde verwerkingsverantwoordelijken;

      b. de politie in verband met haar taken op grond van [artikel 3 van de Politiewet 2012][ref3];

      c. de Koninklijke Marechaussee in verband met haar taken op grond van [artikel 4 van de Politiewet 2012][ref4];

      d. het openbaar ministerie in verband met zijn taken op grond van
      [artikel 124 van de Wet op de rechterlijke organisatie][ref5];

      e. de diensten, genoemd in [artikel 1, onderdeel a, van de Wet op de inlichtingen- en veiligheidsdiensten 2017][ref6],
      in verband met de uitvoering van de taken op grond van die wet;

      f. Onze Minister die het aangaat, voor zover de verstrekking noodzakelijk is in verband met de bij of krachtens de
      wet aan hem opgedragen taken.

      2 Onze Minister verstrekt persoonsgegevens gepseudonimiseerd, tenzij dit vanwege de doeleinden van de verwerking
      niet mogelijk is. Persoonsgegevens worden voor openbaarmaking geanonimiseerd, tenzij dit vanwege de doeleinden van
      de verwerking niet mogelijk is.

      3 Onverminderd [artikel 2, derde lid][ref7], ziet een verstrekking als bedoeld in het eerste lid niet op een
      duiding van de uitingen van een persoon waardoor die persoon in verband wordt gebracht met een trend of fenomeen.


