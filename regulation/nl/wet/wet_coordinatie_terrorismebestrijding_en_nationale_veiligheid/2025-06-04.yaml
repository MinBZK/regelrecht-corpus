  - number: '8'
    text: |-
      1 Gelet op artikel 9, tweede lid, onderdeel g, van de Algemene verordening gegevensbescherming, is het verbod om
      gegevens waaruit ras of etnische afkomst, politieke, religieuze of levensbeschouwelijke overtuigingen blijken en
      verwerking van gegevens over gezondheid niet van toepassing, indien de verwerking geschiedt door Onze Minister,
      voor zover de verwerking van deze gegevens noodzakelijk is voor de uitoefening van zijn taak op grond van deze wet.

      2 Gelet op artikel 10 van de Algemene verordening gegevensbescherming kan Onze Minister persoonsgegevens van
      strafrechtelijke aard verwerken, indien de verwerking noodzakelijk is voor de uitoefening van zijn taak op grond
      van deze wet.
    url: https://wetten.overheid.nl/BWBR0049262/2025-06-04#Artikel8
  - number: '9'
    text: |-
      1 Onze Minister kan de verplichtingen en rechten als bedoeld in artikel 23, eerste lid, van de Algemene verordening
      gegevensbescherming, beperken indien dit noodzakelijk en evenredig is ter waarborging van de in artikel 23, eerste
      lid, onderdelen a, c, d of i van die verordening genoemde belangen.

      2 Indien Onze Minister gebruikt maakt van de in het eerste lid bedoelde bevoegdheid, deelt hij dit voorzien van een
      dragende onderbouwing schriftelijk mee aan de betrokkene wiens rechten worden beperkt.

      3 In afwijking van het tweede lid, wordt geen mededeling gedaan aan de betrokkene indien dit afbreuk doet aan het
      doel van de beperking.
    url: https://wetten.overheid.nl/BWBR0049262/2025-06-04#Artikel9
  - number: '10'
    text: |-
      Het ontwerp van een krachtens de [artikelen 3, derde lid][ref1], of [5, derde lid][ref2], vast te stellen algemene
      maatregel van bestuur wordt aan de beide Kamers der Staten-Generaal overgelegd. De voordracht voor de vast te
      stellen algemene maatregel van bestuur kan worden gedaan nadat vier weken na de overlegging zijn verstreken, tenzij
      binnen die termijn door of namens een der Kamers of door ten minste een vijfde van het grondwettelijk aantal leden
      van een der Kamers de wens te kennen wordt gegeven dat het onderwerp van de algemene maatregel van bestuur bij wet
      wordt geregeld. In dat geval wordt een daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0049262#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0049262#Artikel5
