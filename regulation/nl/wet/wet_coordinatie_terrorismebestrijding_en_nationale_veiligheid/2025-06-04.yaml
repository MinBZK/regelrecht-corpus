        artikel: '3'
  - number: 5a
    text: |-
      Onze Minister laat de wijze waarop uitvoering wordt gegeven aan zijn in [artikel 2][ref1] bedoelde taak toetsen.
      Een rapportage van de resultaten van deze toetsing wordt aan de Staten-Generaal gezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0049262#Artikel2
    url: https://wetten.overheid.nl/BWBR0049262/2025-06-04#Artikel5a
