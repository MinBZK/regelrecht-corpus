preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat ingevolge artikel 47 van het Statuut voor het Koninkrijk der Nederlanden
    (Stb. 1985, 453) de ministers, de staatssecretarissen en de leden van de Staten-Generaal alvorens hun betrekking
    te aanvaarden, een eed of belofte van trouw aan de Koning en het Statuut afleggen en dat voorts ingevolge de
    artikelen 49 en 60 van de Grondwet (Stb. 1987, 458), de wet dient te bepalen de wijze waarop de ministers, de
    staatssecretarissen en de leden der Staten-Generaal bij de aanvaarding van hun ambt een eed dan wel verklaring en
    belofte afleggen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005430/1992-03-25#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Bij de aanvaarding van hun ambt leggen de ministers en de staatssecretarissen ten overstaan van de Koning de
      volgende eden of verklaringen en beloften af:

      "Ik zweer (verklaar) dat ik, om tot minister (staatssecretaris) te worden benoemd, rechtstreeks noch middellijk,
      onder welke naam of welk voorwendsel ook, enige gift of gunst heb gegeven of beloofd.

      Ik zweer (verklaar en beloof) dat ik, om iets in dit ambt te doen of te laten, rechtstreeks noch middellijk enig
      geschenk of enige belofte heb aangenomen of zal aannemen.

      Ik zweer (beloof) trouw aan de Koning, aan het Statuut voor het Koninkrijk en aan de [Grondwet][ref1].

      Ik zweer (beloof) dat ik de plichten die mijn ambt mij oplegt getrouw zal vervullen.

      Zo waarlijk helpe mij God almachtig!"

      (Dat verklaar en beloof ik!").


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0005430/1992-03-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '2'
    text: |-
      Bij de aanvaarding van hun ambt leggen de leden der Staten-Generaal in de vergadering van de kamer waarin zij zijn
      verkozen, de volgende eden of verklaringen en beloften af:

      "Ik zweer (verklaar) dat ik, om tot lid van de Staten-Generaal te worden benoemd, rechtstreeks noch middellijk,
      onder welke naam of welk voorwendsel ook, enige gift of gunst heb gegeven of beloofd.

      Ik zweer (verklaar en beloof), dat ik, om iets in dit ambt te doen of te laten, rechtstreeks noch middellijk enig
      geschenk of enige belofte heb aangenomen of zal aannemen.

      Ik zweer (beloof) trouw aan de Koning, aan het Statuut voor het Koninkrijk en aan de [Grondwet][ref1].

      Ik zweer (beloof) dat ik de plichten die mijn ambt mij oplegt getrouw zal vervullen.

      Zo waarlijk helpe mij God almachtig!"

      (Dat verklaar en beloof ik!").


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0005430/1992-03-25#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '3'
    text: |-
      Deze wet treedt in werking met ingang van de eerste dag na de datum van uitgifte van het *Staatsblad* waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0005430/1992-03-25#Artikel3
  - number: '4'
    text: Deze wet kan worden aangehaald als Wet beëdiging ministers en leden Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0005430/1992-03-25#Artikel4
