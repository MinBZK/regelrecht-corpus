  - number: '2'
    text: |-
      In geval van uitoefening van een bevoegdheid met projectsaldering bevat het betrokken besluit ten minste:

      a. een beschrijving van de met de betreffende uitoefening beoogde ontwikkeling of activiteit,

      b. een omschrijving van het plangebied en het salderingsgebied,

      c. een topografische kaart waarop de onder b genoemde gebieden zijn weergegeven,

      d. een beschrijving van de toename of vermindering van de concentratie van een stof in het salderingsgebied,
      alsmede een beschrijving van de autonome situatie die daarbij als uitgangspunt is genomen,

      e. een beschrijving van de maatregelen als bedoeld in [artikel 5.16, eerste lid, aanhef en onder b, sub 2][ref1]
      en hun effect op de concentratie van de betreffende stof, daaronder mede begrepen eventuele maatregelen in het
      plangebied, en

      f. het tijdstip waarop, of de termijn waarbinnen, de onder e bedoelde maatregelen worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5.16
    url: https://wetten.overheid.nl/BWBR0022813/2007-11-15#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5.16'
  - number: '3'
    text: |-
      In geval van uitoefening van een bevoegdheid met projectsaldering bevat de motivering van het betrokken besluit in
      elk geval overwegingen met betrekking tot:

      a. in aanmerking genomen mogelijkheden tot het voorkomen of beperken van de toename van de concentratie van een
      stof in het plangebied,

      b. de geografische of functionele samenhang tussen het plangebied en het salderingsgebied,

      c. kwalitatief omschreven gevolgen van zowel de toename als de vermindering van de concentratie van een stof,

      d. de manier waarop bij de vaststelling van de maatregelen rekening is gehouden met het aantal mensen dat wordt
      blootgesteld aan een toename of vermindering van de concentratie van een stof,

      e. het tijdstip waarop, of de termijn waarbinnen, de maatregelen, bedoeld in [artikel 2, onderdeel e][ref1], worden
      uitgevoerd, en

      f. de waarborgen die getroffen worden, opdat de maatregelen, bedoeld in [artikel 2, onderdeel e][ref2],
      daadwerkelijk worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0022813#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022813#Artikel2
