articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. wet: [Wet milieubeheer][ref1];

      b. uitoefening van een bevoegdheid met projectsaldering: uitoefening van een of meer bevoegdheden of toepassing van
      een of meer wettelijk voorschriften als bedoeld in [artikel 5.16, tweede lid, van de wet][ref2], met toepassing van
      het [eerste lid, aanhef en onder b, sub 2, van dat artikel][ref3];

      c. plangebied: gebied waar de uitoefening van een bevoegdheid met toepassing van projectsaldering betrekking op
      heeft;

      d. salderingsgebied: gebied of gebieden waarbinnen zich effecten voor de luchtkwaliteit voordoen als gevolg van de
      uitoefening van een bevoegdheid met toepassing van projectsaldering.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel5.16
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel5.16
