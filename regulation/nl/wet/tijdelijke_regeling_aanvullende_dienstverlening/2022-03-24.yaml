  - number: '2'
    text: |-
      Aanvullende crisisdienstverlening en scholing via praktijkleren in het mbo kunnen in 2021 en 2022 worden aangeboden
      aan:

      a. werknemers die werkloos dreigen te raken maar niet in aanmerking komen voor dienstverlening op grond van
      [artikel 30a, eerste lid, onderdeel b, van de Wet SUWI][ref1];

      b. personen die in de periode vanaf 12 maart 2020 in aanmerking komen voor ondersteuning bij arbeidsinschakeling op
      grond van [artikel 30a van de Wet SUWI][ref2] en [artikel 73 van de Werkloosheidswet][ref3];

      c. personen die in de periode vanaf 12 maart 2020 in aanmerking komen voor ondersteuning bij arbeidsinschakeling op
      grond van [artikel 7, eerste lid, onderdeel a, van de Participatiewet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
