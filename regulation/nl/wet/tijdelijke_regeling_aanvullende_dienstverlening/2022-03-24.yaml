    text: |-
      1 De operationeel coördinator van een regionaal mobiliteitsteam rapporteert eenmaal per twee maanden over de
      uitvoering van deze regeling aan de Minister.

      2 Tussentijdse wijzigingen in de afspraken, bedoeld in [artikel 5][ref1], en de samenstelling van de partijen,
      bedoeld in [artikel 6, eerste lid][ref2], worden door de operationeel coördinator doorgegeven aan de Minister en
      de kassier.

      3 De Minister zendt binnen drie jaar na de inwerkingtreding van deze regeling een verslag aan de Staten-Generaal
      over de doeltreffendheid en de effecten van deze regeling in de praktijk.


