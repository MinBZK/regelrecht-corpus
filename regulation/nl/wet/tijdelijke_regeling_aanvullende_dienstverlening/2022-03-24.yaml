    text: |-
      Persoonsgegevens die door de partijen en colleges van burgemeester en wethouders worden verwerkt in het kader van
      de samenwerking worden ten hoogste drie maanden na de datum van afronding van de dienstverlening werkfitbehoud,
      aanvullende crisisdienstverlening en scholing via praktijkleren in het mbo bewaard, of ten hoogste drie maanden
      na de datum van verwerking, bedoeld in [artikel 13, vijfde lid][ref1], tenzij krachtens een ander wettelijk
      voorschrift een andere bewaartermijn geldt.


