  - number: '26'
    text: |-
      1 Het UWV brengt aan de Minister inhoudelijk en financieel verslag uit over de uitvoering van de taken, bedoeld in
      [artikel 15][ref1], overeenkomstig [artikel 49, eerste en derde tot en met vijfde lid, van de Wet SUWI][ref2] en
      de krachtens die bepaling geldende regels.

      2 In de jaarrekening, bedoeld in [artikel 49 van de Wet SUWI][ref3], worden de baten en lasten opgenomen, alsmede
      de ontvangen voorschotten, bedoeld in [artikel 25, vierde lid][ref4], met betrekking tot de taken, bedoeld in
      [artikel 15][ref5].

      3 Na goedkeuring van het besluit tot vaststelling van de jaarrekening, bedoeld in
      [artikel 34, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref6], rekent de Minister de baten en
      lasten, alsmede de ontvangen voorschotten op grond van [artikel 25, vierde lid][ref7], met betrekking tot het
      desbetreffende kalenderjaar af, met als valutadatum 1 juni van het hierop volgende kalenderjaar.


