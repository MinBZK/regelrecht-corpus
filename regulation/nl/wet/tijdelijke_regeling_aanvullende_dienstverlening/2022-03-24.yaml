  - number: '9'
    text: |-
      De partij of een college van burgemeester en wethouders zendt geschriften tot behandeling waarvan kennelijk een
      andere partij of college van burgemeester en wethouders bevoegd is, onverwijld door aan die partij of college van
      burgemeester en wethouders onder gelijktijdige mededeling daarvan aan de afzender.
    url: https://wetten.overheid.nl/BWBR0044968/2022-03-24#Artikel9
  - number: '10'
    text: |-
      De persoon aan wie op basis van deze regeling aanvullende crisisdienstverlening, dienstverlening werkfitbehoud of
      scholing via praktijkleren in het mbo wordt aangeboden spant zich in om hiervan gebruik te maken.
    url: https://wetten.overheid.nl/BWBR0044968/2022-03-24#Artikel10
  - number: '11'
    text: |-
      Bij de gegevensverwerking in verband met de samenwerking in een regionaal mobiliteitsteam zijn de samenwerkende
      partijen of colleges van burgemeester en wethouders gezamenlijke verwerkingsverantwoordelijken als bedoeld in
      artikel 26 van de Algemene verordening gegevensbescherming.
    url: https://wetten.overheid.nl/BWBR0044968/2022-03-24#Artikel11
  - number: '12'
    text: |-
      1 Ten behoeve van het doel, bedoeld in [artikel 4, eerste lid][ref1], kunnen partijen als bedoeld in
      [artikel 6, eerste lid, onderdelen c en d][ref2], gegevens verwerken die noodzakelijk zijn voor de uitvoering van
      de taken in het kader de samenwerking grond van deze regeling.

      2 De partijen, bedoeld in [artikel 6, eerste lid, onderdelen c en d][ref3], zijn bevoegd om ten
      behoeve van het doel, bedoeld in [artikel 4, eerste lid][ref4], aan andere partijen als bedoeld in
      [artikel 6, eerste lid, onderdelen a tot en met d][ref5], of colleges van burgemeester en wethouders, gegevens
      te verstrekken die noodzakelijk zijn voor de uitvoering van de taken in het kader de samenwerking grond van deze
      regeling.

      3 De gegevens, bedoeld in het eerste en tweede lid, zijn:

      a. gegevens over de persoon: namen, geboortedatum, adresgegevens, contactgegevens;

      b. opleidingsgegevens;

      c. gegevens over het arbeidsverleden;

      d. gegevens over de huidige arbeidssituatie;

      e. arbeidsmarktbemiddelingsgegevens; en

      f. gegevens omtrent de inzet van de crisisdienstverlening werkfitbehoud, aanvullende crisisdienstverlening of
      scholing via praktijkleren in het mbo.

      4 Indien aanvullende crisisdienstverlening uit [bijlage 1][ref6], scholing via praktijkleren in het mbo uit
      [bijlage 2][ref7] of crisisdienstverlening werkfitbehoud uit [bijlage 3][ref8] door een partij als bedoeld in
      [artikel 6, eerste lid, onderdelen c en d][ref9], wordt ingekocht bij een derde, verstrekt die partij de gegevens,
      bedoeld in het derde lid, aan deze derde, mits de betrokkene toestemming heeft gegeven voor het verstrekken van
      deze gegevens.

      5 Het is partijen als bedoeld in [artikel 6, eerste lid, onderdelen c en d][ref10], verboden hetgeen hem uit of in
      verband met enige werkzaamheid bij de uitvoering van deze regeling over de persoon of zaken van een ander blijkt of
      wordt meegedeeld, verder bekend te maken dan voor de uitvoering van deze regeling noodzakelijk is dan wel op grond
      van deze regeling is voorgeschreven of toegestaan.


