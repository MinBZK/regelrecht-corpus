      1 De Minister vergoedt de kosten van dienstverlening werkfitbehoud, bedoeld in [bijlage 3][ref1], aan de
      partijen en colleges van burgemeester en wethouders overeenkomstig deze regeling. De procedure ter vergoeding
      van de kosten van de colleges van burgemeester en wethouders verloopt uitsluitend via de partij, bedoeld in
      [artikel 6, eerste lid, onderdeel a][ref2], die daartoe door de colleges gemachtigd is. Behandeling van volledige
      aanvragen geschiedt op volgorde van binnenkomst en overeenkomstig deze regeling indien:

      a. voor personen als bedoeld in [artikel 3][ref3] het budget, bedoeld in
      [artikel 25, derde lid, onderdeel e][ref4], toereikend is;

      b. een verklaring van de partij is overlegd dat marktconforme tarieven worden gehanteerd; en

      c. een verklaring van de partij, bedoeld in [artikel 6, eerste lid, onderdeel a][ref5], is overlegd dat die partij
      gemachtigd is om te handelen overeenkomstig deze regeling.

      2 De partijen overleggen eenmaal per maand een uitgavenoverzicht van de gemaakte kosten over de voorafgaande maand
      aan de kassier, waarin in ieder geval wordt vermeld:

      a. het type dienstverlening werkfitbehoud;

      b. dat is voldaan aan de vereisten, bedoeld in het eerste lid; en

      c. een verklaring van een partij dat de kosten overeenkomstig deze regeling zijn besteed.

      3 De partijen overleggen eenmaal per maand een overzicht van de hoogte van de te verwachten kosten aan de kassier.

      4 Voor het overzicht, bedoeld in het tweede en derde lid, wordt gebruik gemaakt van een door de Minister
      beschikbaar gesteld formulier.

      5 De Minister besluit indien is voldaan aan het eerste, tweede en vierde lid, op basis van het uitgavenoverzicht
      tot de vergoeding van de kosten van elke partij.

      6 De vergoeding wordt maandelijks uitbetaald.


