      1 De Minister vergoedt partijen als bedoeld in [artikel 6, eerste, lid, onderdelen c en d][ref1], per kalenderjaar
      overeenkomstig deze regeling de kosten van die partijen voor de samenwerking in een regionaal mobiliteitsteam.

      2 Onder kosten als bedoeld in het eerste lid wordt in ieder geval verstaan:

      a. de lasten ten behoeve van het verrichten van arbeid;

      b. de lasten ten behoeve van de bedrijfsvoering.

      3 De Minister ontvangt tussen 12 april 2021 en 10 mei 2021 voor het kalenderjaar 2021 en tussen
      30 november 2021 en 31 december 2021 voor het kalenderjaar 2022 van partijen als bedoeld in
      [artikel 6, eerste, lid, onderdelen c en d][ref2], een gezamenlijke begroting ten aanzien van de kosten van
      partijen als bedoeld in artikel 6, eerste lid, onderdelen c en d, waaruit de kosten per partij blijken en het
      rekeningnummer per partij waarop de kassier de vergoeding kan voldoen. De begroting van het kalenderjaar 2021
      overschrijdt niet het bedrag genoemd in [artikel 22, tweede lid, onderdeel b][ref3].

      4 Indien de begroting aan het derde lid voldoet, besluit de Minister tot verlening van de vergoeding van de kosten
      van elke partij overeenkomstig de begroting en informeert hierover de kassier.

      5 De Minister verstrekt bij het besluit, bedoeld in het vierde lid, een voorschot ter hoogte van 80% van het bedrag
      van de verlening aan elke partij. De vergoeding wordt in maandelijkse termijnen uitbetaald.

      6 De Minister schort de betaling van een voorschot op als een melding van een partij daartoe aanleiding geeft.

      7 De Minister ontvangt van partijen als bedoeld in [artikel 6, eerste lid, onderdelen c en d][ref4], uiterlijk op
      31 januari 2022 een gezamenlijke opgave van de gemaakte kosten over het kalenderjaar 2021 en uiterlijk 31 januari
      2023 een gezamenlijke opgave van de gemaakte kosten over het kalenderjaar 2022. De opgave van de gemaakte kosten
      van het kalenderjaar 2021 overschrijdt niet het bedrag genoemd in [artikel 22, tweede lid, onderdeel b][ref5].
      Indien de opgave van de gemaakte kosten voldoet aan de vorige zinnen besluit de Minister tot vaststelling van de
      vergoeding van de kosten van elke partij overeenkomstig de opgave van de gemaakte kosten en informeert hierover
      de kassier.

      8 Als de opgave van de gemaakte kosten niet in kosten afwijkt van de begroting wordt de hoogte van de vergoeding
      vastgesteld overeenkomstig de verlening.


