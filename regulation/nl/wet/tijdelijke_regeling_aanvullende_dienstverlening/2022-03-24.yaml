  - number: '7'
    text: |-
      1 UWV wijst in overleg met de andere partijen in elke arbeidsmarktregio het aanspreekpunt tijdelijke impuls
      banenafspraak aan om personen als bedoeld in [artikel 3][ref1] te ondersteunen.

      2 Als blijkt dat personen als bedoeld in [artikel 3][ref2] aanvullende crisisdienstverlening, scholing via
      praktijkleren in het mbo of dienstverlening werkfitbehoud nodig hebben wordt het aanspreekpunt tijdelijke impuls
      banenafspraak geraadpleegd.


      [ref1]: https://wetten.overheid.nl/BWBR0044968#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0044968#Artikel3
