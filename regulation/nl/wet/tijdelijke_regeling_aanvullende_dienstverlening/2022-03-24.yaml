  - number: '24'
    text: |-
      De Minister kan de vergoeding, bedoeld in de [artikelen 17 tot en met 21][ref1], geheel of gedeeltelijk
      terugvorderen van de partij of het college van burgemeester en wethouders indien ten onrechte of voor een te hoog
      bedrag is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0044968#Artikel17
