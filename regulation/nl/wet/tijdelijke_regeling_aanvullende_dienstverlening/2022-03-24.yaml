articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *aanvullende crisisdienstverlening:* dienstverlening, niet zijnde reguliere dienstverlening, die aanvullend
      door een partij of een college van burgemeester en wethouders kan worden aangeboden zoals opgenomen in
      [bijlage 1][ref1];
        - *dienstverlening werkfitbehoud:* dienstverlening die door een partij of een college van burgemeester en
      wethouders kan worden aangeboden voor het behoud van werkfitheid zoals opgenomen in [bijlage 3][ref2] voor het
      deel waarvoor de reguliere dienstverlening onvoldoende beschikbaar is;
        - *onderwijsinstellingen in het mbo en hoger onderwijs:* instelling als
      bedoeld in [artikel 1.1.1, onderdeel b][ref3], of instelling als bedoeld in
      [artikel 1.4.1, eerste lid, van de Wet educatie en beroepsonderwijs][ref4] of instelling voor hoger onderwijs als
      bedoeld in [artikel 1.1, onderdeel g, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref5];
        - *onderwijsovereenkomst:* schriftelijke overeenkomst als bedoeld in
      [artikel 8.1.3. van de Wet educatie en beroepsonderwijs][ref6];
        - *partij(en):* partij(en) als bedoeld in [artikel 6, eerste lid, onderdelen a tot en met d][ref7];
        - *plaatsingsovereenkomst:* schriftelijke overeenkomst gesloten tussen de partij of een college
      van burgemeester en wethouders, de kandidaat, de werkgever en een erkend leerbedrijf, bedoeld in
      [artikel 7.2.10. van de Wet educatie en beroepsonderwijs][ref8], voor de duur van de scholing via praktijkleren in
      het mbo, die de rechten en verplichtingen regelt;
        - *praktijkovereenkomst:* schriftelijke overeenkomst als bedoeld in
      [artikel 7.2.8. van de Wet educatie en beroepsonderwijs][ref9];
        - *praktijkplaats:* praktijkplaats als bedoeld in [artikel 7.2.9. van de Wet educatie en beroepsonderwijs][ref10];
        - *SBB:* Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven als rechtspersoon, bedoeld in
      [artikel 1.5.1, eerste lid, van de Wet educatie en beroepsonderwijs][ref11];
        - *scholing via praktijkleren in het mbo:* een beroepsopleiding in de derde leerweg als bedoeld in
      [artikel 1.4.1, lid 1.a, van de Wet educatie en beroepsonderwijs][ref12], waarbij sprake is van
      beroepspraktijkvorming waarvoor een erkend leerbedrijf een praktijkplaats realiseert, gericht op het behalen van
      een diploma, bedoeld in [artikel 7.4.6. van de Wet educatie en beroepsonderwijs][ref13], een certificaat, bedoeld
      in [artikel 7.2.3. van de Wet educatie en beroepsonderwijs][ref14], of een instellingsverklaring, bedoeld in
      [artikel 7.4.6.a van de Wet educatie en beroepsonderwijs][ref15];
        - *reguliere dienstverlening:* dienstverlening die door een partij of een college van burgemeester en wethouders
      kan worden aangeboden op grond van een regeling, niet zijnde deze regeling, of gemeentelijke verordening ongeacht
      of reguliere middelen beschikbaar zijn;
        - *werkgeversorganisatie:* een vereniging met volledige rechtsbevoegdheid van werkgevers, die krachtens haar
      statuten de belangenbehartiging van werkgevers beoogt;
        - *werknemer:* werknemer in de zin van de werknemersverzekeringen of een werknemer, artiest, beroepssporter,
      lid van een buitenlands gezelschap of een aangewezen andere natuurlijke persoon als bedoeld in
      [artikel 1 van de Wet op de loonbelasting 1964][ref16];
        - *werknemersorganisatie:* een vereniging met volledige rechtsbevoegdheid van werknemers, die krachtens haar
      statuten de belangenbehartiging van werknemers beoogt.


