  - number: '3'
    text: |-
      Aan personen als bedoeld in [artikel 38b, eerste en tweede lid][ref1], en
      [artikel 38f, vijfde lid, van de Wet financiering sociale verzekeringen][ref2], die in de periode vanaf
      12 maart 2020 werkloos zijn geworden of dreigen te worden, kunnen dienstverlening werkfitbehoud, aanvullende
      crisisdienstverlening en scholing via praktijkleren in het mbo in 2021 en 2022 worden aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel38b
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel38f
