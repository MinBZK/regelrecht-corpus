  - number: '8'
    text: |-
      Een partij of een college van burgemeester en wethouders adviseert het regionaal mobiliteitsteam of personen als
      bedoeld in [artikel 2][ref1] in aanmerking komen voor aanvullende crisisdienstverlening en adviseren waaruit deze
      dienstverlening bestaat. Een positief advies wordt alleen gegeven als dit noodzakelijk is voor het verkleinen van
      de afstand tot de arbeidsmarkt en voor het verkrijgen van arbeid. De adviserende partijen zijn, voor zover partijen
      hierover geen andere afspraken maken:

      a. de partijen, genoemd in [artikel 6, eerste lid, onderdelen c en d][ref2], voor
      personen als bedoeld in [artikel 2, onderdeel a][ref3], en personen als bedoeld in
      [artikel 30a, eerste lid, onderdeel b, van de Wet SUWI][ref4];

      b. de partij, genoemd in [artikel 6, eerste lid, onderdeel b][ref5], voor personen
      als bedoeld in [artikel 2, onderdeel b][ref6], behoudens personen als bedoeld in
      [artikel 30a, eerste lid, onderdeel b, van de Wet SUWI][ref7];

      c. een college van burgemeester en wethouders voor personen als bedoeld in [artikel 2, onderdeel c][ref8].


