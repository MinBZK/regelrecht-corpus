  - number: '22'
    text: |-
      1 De budgetten, genoemd in het tweede lid, worden voor het kalenderjaar verdeeld door de Minister.

      2 De verdeling van het budget voor de kosten:

      a. van UWV en colleges van burgemeester en wethouders, bedoeld in [artikel 17][ref1], per regionaal mobiliteitsteam
      is opgenomen in [bijlage 4][ref2], waarbij het plafond in 2021 € 17.000.000 bedraagt en in 2022 € 22.666.667
      bedraagt;

      b. van werknemers- en werkgeversorganisaties, bedoeld in [artikel 18][ref3], waarbij het plafond in 2021
      € 9.200.000 bedraagt en in 2022 € 13.200.000 bedraagt;

      c. voor aanvullende crisisdienstverlening, bedoeld in [artikel 19][ref4], per regionaal mobiliteitsteam is
      opgenomen in [bijlage 5][ref5], waarbij het plafond in 2021 € 28.953.150 bedraagt en in 2022 € 38.604.200 bedraagt;

      d. voor scholing via praktijkleren in het mbo, bedoeld in [artikel 20][ref6], per regionaal mobiliteitsteam is
      opgenomen in [bijlage 6][ref7], waarbij het plafond in 2021 € 5.500.000 bedraagt en in 2022 € 22.500.000 bedraagt;

      e. voor dienstverlening werkfitbehoud, bedoeld in [artikel 21][ref8], per regionaal mobiliteitsteam is opgenomen in
      [bijlage 7][ref9], waarbij het plafond in 2021 € 15.150.000 bedraagt en in 2022 € 9.750.000 bedraagt.

      3 De bedragen per kalenderjaar in [bijlage 4][ref10], [5][ref11], [6][ref12], en [7][ref13] kunnen tussentijds een
      keer per kalenderjaar, op 1 juli of 1 oktober, bij ministeriële regeling worden gewijzigd, hierbij kan ook naar
      rato van het aantal regionaal mobiliteitsteams worden gerekend. De ministeriële regeling wordt ten minste drie
      maanden voorafgaand aan de wijziging gepubliceerd in de Staatscourant.

      4 In afwijking van het derde lid kunnen de bedragen in [bijlage 6][ref14] voor het kalenderjaar 2021 tussentijds
      een keer, op een andere datum dan op 1 juli of 1 oktober van dat kalenderjaar, bij ministeriële regeling worden
      gewijzigd. De tweede volzin van het derde lid is niet van toepassing.


