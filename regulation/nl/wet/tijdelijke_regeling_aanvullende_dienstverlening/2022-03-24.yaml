  - number: '4'
    text: |-
      1 Partijen en colleges van burgemeester en wethouders werken samen in een regionaal mobiliteitsteam en
      worden gefinancierd om personen als bedoeld in [artikel 2][ref1], indien nodig na advisering overeenkomstig
      [artikel 8][ref2], en personen als bedoeld in [artikel 3][ref3], te ondersteunen bij het verkleinen van de afstand
      tot de arbeidsmarkt en voor het samenbrengen van vraag en aanbod op de arbeidsmarkt.

      2 Partijen geven de samenwerking met SBB en onderwijsinstellingen in het mbo en hoger onderwijs vorm ten behoeve
      van het doel, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0044968#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0044968#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0044968#Artikel3
