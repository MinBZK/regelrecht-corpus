  text: |-
    Gelet op artikel 2.3, vijfde lid, van het Besluit SUWI, artikel 9 juncto 3, eerste lid, Kaderwet SZW-subsidies,
    artikel 121a Wet financiering sociale verzekeringen en artikelen 32d, tweede lid, 45, derde lid, en 49, vijfde lid,
    van de Wet structuur uitvoeringsorganisatie werk en inkomen;

