  - number: '5'
    text: |-
      1 De partijen, SBB en onderwijsinstellingen in het mbo en hoger onderwijs maken per arbeidsmarktregio schriftelijk
      afspraken over de samenwerking met betrekking tot de inzet en uitvoering van aanvullende dienstverlening, scholing
      via praktijkleren in het mbo en dienstverlening werkfitbehoud binnen het regionale mobiliteitsteam en melden dit
      aan de Minister. De afspraken zien in ieder geval op:

      a. de wijze van organisatie van een regionaal overleg;

      b. het aanwijzen van een kwartiermaker bij het opzetten van een regionaal mobiliteitsteam;

      c. het aanwijzen van een operationeel coördinator;

      d. welke werknemers- en werkgeversorganisaties deelnemen aan het regionaal mobiliteitsteam;

      e. het waarborgen van toetreding van werknemers- en werkgeversorganisatie;

      f. de samenwerking rondom aanvullende dienstverlening, scholing via praktijkleren in het mbo en dienstverlening
      werkfitbehoud;

      g. de wijze waarop samengewerkt wordt met SBB en onderwijsinstellingen in het mbo en hoger onderwijs;

      h. het aanwijzen van een contactpunt voor betrokkenen voor de uitoefening van de rechten op grond van hoofdstuk III
      van de Algemene verordening gegevensbescherming; en

      i. het aanwijzen van een coördinerend functionaris voor gegevensbescherming.

      2 In aanvulling op het eerste lid, maken de partijen afspraken over:

      a. de wijze van de uitvoering en toepassing conform de voor het plaatsen van opdrachten voor sociale en andere
      specifieke diensten geldende [artikelen 2.38][ref1] en [2.39 van de Aanbestedingswet 2012][ref2];

      b. een andere wijze van contracteren, waarbij op basis van een vooraf bekendgemaakte toelatingsprocedure
      overeenkomsten worden gesloten en waarbij slechts geschiktheidseisen of minimumeisen worden gesteld en de betrokken
      persoon zelf kiest uit de toegelaten aanbieders; en

      c. de wijze van de uitvoering en toepassing van marktconforme tarieven bij het uitvoeren van deze regeling door
      eigen personeel van de partijen of, voor zover het de colleges van burgemeester en wethouders betreft, door het
      overheidspersoneel.

      3 Het college van burgemeester en wethouders, bedoeld in [artikel 6, eerste lid, onderdeel a][ref3], maakt
      afspraken met de colleges van burgemeester en wethouders binnen de arbeidsmarktregio over het proces en de inzet
      van aanvullende dienstverlening, scholing via praktijkleren in het mbo en dienstverlening werkfitbehoud in een
      regionaal mobiliteitsteam.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2.38
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel2.39
