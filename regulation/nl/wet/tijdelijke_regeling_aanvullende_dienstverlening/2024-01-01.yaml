  - number: '27'
    text: |-
      1 Het UWV brengt jaarlijks over het voorgaande jaar, uiterlijk op 15 maart, aan de Minister financieel
      verslag uit over beheer van de budgetten, bedoeld in [artikel 25, derde lid][ref1], overeenkomstig
      [artikel 49, van de Wet SUWI][ref2] en de krachtens die bepaling geldende regels.

      2 In het verslag, bedoeld in [artikel 5.10a, zevende lid, van de Regeling SUWI][ref3], worden de uitbetalingen van
      de vergoedingen, bedoeld in de [artikelen 17 tot en met 21][ref4], opgenomen, alsmede de ontvangen voorschotten,
      bedoeld in [artikel 25, derde lid][ref5].

      3 De uitbetalingen alsmede de ontvangen voorschotten worden gespecificeerd naar de budgetten zoals genoemd in
      [artikel 25, derde lid][ref6].

      4 Na beoordeling van het verslag rekent de Minister de uitbetalingen alsmede de ontvangen voorschotten
      met betrekking tot het desbetreffende kalenderjaar af, met als valutadatum 1 april van het hierop volgende
      kalenderjaar.


