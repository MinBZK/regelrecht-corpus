  - number: '6'
    text: |-
      1 Per arbeidsmarktregio als bedoeld in [artikel 2.4, eerste lid, van het Besluit SUWI][ref1], werken in een
      regionaal mobiliteitsteam de volgende partijen samen:

      a. college van burgemeester en wethouders van de centrumgemeente, bedoeld in
      [artikel 2.4, tweede lid, van het Besluit SUWI][ref2], tenzij de colleges van burgemeester en wethouders van de
      gemeenten binnen de arbeidsmarktregio een andere gemeente aanwijzen als partij;

      b. UWV;

      c. werknemersorganisaties; en

      d. werkgeversorganisaties.

      2 De partij, bedoeld in [artikel 6, eerste, lid, onderdeel a][ref3], meldt aan de kassier, bedoeld in
      [artikel 15][ref4], welke partijen per arbeidsmarktregio samenwerken in een regionaal mobiliteitsteam.


