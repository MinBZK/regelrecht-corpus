  - number: '22'
    text: |-
      1 De budgetten, genoemd in het tweede lid, worden voor het kalenderjaar verdeeld door de Minister.

      2 De verdeling van het budget voor de kosten:

      a. van UWV en colleges van burgemeester en wethouders, bedoeld in [artikel 17][ref1], per regionaal mobiliteitsteam
      is opgenomen in [bijlage 4][ref2], waarbij het plafond in 2023 € 23.516.926, en in 2024 € 19.757.000 bedraagt;

      b. van werknemers- en werkgeversorganisaties, bedoeld in [artikel 18][ref3], waarbij het plafond in 2023 en in 2024
      € 13.700.000 bedraagt;

      c. voor aanvullende dienstverlening, bedoeld in [artikel 19][ref4], voor scholing via praktijkleren in het
      mbo, bedoeld in [artikel 20][ref5], en voor dienstverlening werkfitbehoud, bedoeld in [artikel 21][ref6], per
      regionaal mobiliteitsteam is opgenomen in [bijlage 5][ref7], waarbij het plafond in 2023 € 25.555.000, en in 2024
      € 21.000.000 bedraagt.

      3 De bedragen per kalenderjaar in [bijlage 4][ref8] en [5][ref9] kunnen tussentijds bij ministeriële regeling
      worden gewijzigd. De ministeriële regeling wordt ten minste twee maanden voorafgaand aan de wijziging gepubliceerd
      in de Staatscourant. Van deze termijn kan worden afgeweken voor zover de bedragen niet naar beneden worden
      bijgesteld.


