      1 De Minister verleent aan de Raad van Bestuur van het UWV mandaat, volmacht en machtiging om, in het kader van
      de uitvoering van de [artikelen 19 tot en met 21][ref1], te beslissen op bezwaarschriften, het instellen en het
      in rechte optreden in beroep of hoger beroep, dan wel het afzien van hoger beroep, met uitzondering van besluiten
      waarbij het UWV het bezwaarschrift of beroepsschrift heeft ingediend.

      2 De Raad van Bestuur van het UWV kan ondermandaat verlenen of zijn andere vertegenwoordigingsbevoegdheden
      doorverlenen aan een of meer onder hem ressorterende functionarissen, met dien verstande dat de persoon die
      betrokken is bij het besluitvormingsproces van bezwaarschriften en het in rechte optreden in beroep of hoger
      beroep, niet ook betrokken is geweest bij het besluitvormingsproces in eerste aanleg.


