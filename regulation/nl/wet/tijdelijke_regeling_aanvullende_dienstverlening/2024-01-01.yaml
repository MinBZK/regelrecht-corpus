  - number: '28'
    text: |-
      1 Partijen rapporteren eenmaal per twee maanden aan de Minister over het deel van de uitvoering van deze regeling
      waar zij ingevolge [artikel 8][ref1] verantwoordelijk voor zijn, ten behoeve van de landelijke monitor regionale
      mobiliteitsteams.

      2 Tussentijdse wijzigingen in de afspraken, bedoeld in [artikel 5][ref2], en de samenstelling van de partijen,
      bedoeld in [artikel 6, eerste lid][ref3], worden door de operationeel coördinator doorgegeven aan de Minister en
      de kassier.

      3 De Minister zendt binnen drie jaar na de inwerkingtreding van deze regeling een verslag aan de Staten-Generaal
      over de doeltreffendheid en de effecten van deze regeling in de praktijk.


