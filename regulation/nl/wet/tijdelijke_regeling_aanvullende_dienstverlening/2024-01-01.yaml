      1 De Minister vergoedt de kosten van scholing via praktijkleren in het mbo, bedoeld in [bijlage 2][ref1], aan
      de partijen en colleges van burgemeester en wethouders overeenkomstig deze regeling. De procedure ter vergoeding
      van de kosten van de colleges van burgemeester en wethouders verloopt uitsluitend via de partij, bedoeld in
      [artikel 6, eerste lid, onderdeel a][ref2], die daartoe door de colleges gemachtigd is. Behandeling van volledige
      aanvragen geschiedt op volgorde van binnenkomst en overeenkomstig deze regeling indien:

      a. voor personen als bedoeld in de [artikelen 2][ref3] of [3][ref4] het budget, bedoeld in
      [artikel 22, tweede lid, onderdeel c][ref5], toereikend is;

      b. er sprake is van een praktijkovereenkomst en een onderwijsovereenkomst, met een gelijke startdatum van de
      overeenkomsten;

      c.

      d. een verklaring van de partij is overlegd dat marktconforme tarieven zijn gehanteerd; en

      e. een verklaring van de partij, bedoeld in [artikel 6, eerste lid, onderdeel a][ref6], is overlegd dat die partij
      gemachtigd is om te handelen overeenkomstig deze regeling.

      2 Onder kosten als bedoeld in het eerste lid wordt verstaan de kosten van de mbo instelling die betrekking hebben
      op een maximum van 40 scholingsweken die gedurende een periode van maximaal 52 weken hebben plaatsgevonden vanaf de
      startdatum van de praktijkovereenkomst.

      3 De partijen overleggen eenmaal per maand een uitgavenoverzicht van de gemaakte kosten over de voorafgaande maand
      aan de kassier, waarin in ieder geval wordt vermeld:

      a.

      b. dat is voldaan aan de vereisten, bedoeld in het eerste lid; en

      c. een verklaring van een partij dat de kosten overeenkomstig deze regeling zijn besteed.

      4 De partijen overleggen eenmaal per maand een overzicht van de hoogte van de te verwachten kosten aan de kassier.

      5 Voor het overzicht, bedoeld in het derde en vierde lid, wordt een door de Minister beschikbaar gesteld formulier
      gebruikt.

      6 De Minister besluit indien is voldaan aan het eerste tot en met derde lid, en het vijfde lid, op basis van het
      uitgavenoverzicht tot de vergoeding van de kosten van elke partij.

      7 De vergoeding wordt maandelijks uitbetaald en komt ten laste van het budget, bedoeld in
      [artikel 22, tweede lid, onderdeel c][ref7], van het kalenderjaar waarin de partij de kosten heeft voldaan, met
      uitzondering van kosten die worden voldaan na de looptijd van de regeling, deze komen ten laste van het budget van
      het jaar dat de dienstverlening waar de vergoeding betrekking op heeft van start is gegaan.


