        artikel: '17'
  - number: '25'
    text: |-
      1 Het Rijk voorziet in de middelen tot dekking van de uitgaven verbonden aan deze regeling. De uitgaven betreffen
      de budgetten, bedoeld in [artikel 22, tweede lid][ref1], en de uitvoeringskosten van de taken, bedoeld in
      [artikel 15][ref2].

      2 Het UWV administreert en beheert afzonderlijk de middelen, bedoeld in het eerste lid.

      3 De Minister stort op de rekening-courant, bedoeld in [artikel 5.16, onderdeel b, van de Regeling Wfsv][ref3]
      voorschotten op de rijksbijdrage van de volgende budgetten ten aanzien van:

      a. de kosten van UWV en colleges van burgemeester en wethouders, bedoeld in [artikel 17][ref4], met als valutadatum
      de 22ste dag van de maand;

      b. de kosten van werknemers- en werkgeversorganisaties, bedoeld in [artikel 18][ref5], met als valutadatum de 22ste
      dag van de maand;

      c. de kosten voor aanvullende dienstverlening uit [bijlage 1][ref6], bedoeld in [artikel 19][ref7], met als
      valutadatum de 22ste dag van de maand;

      d. de kosten van scholing via praktijkleren in het mbo uit [bijlage 2][ref8], bedoeld in [artikel 20][ref9], met
      als valutadatum de 22ste dag van de maand; en

      e. de kosten voor dienstverlening werkfitbehoud uit [bijlage 3][ref10], bedoeld in [artikel 21][ref11], met als
      valutadatum de 22ste dag van de maand.

      4 De Minister stort op de rekening-courant, bedoeld in [artikel 5.16, onderdeel b, van de Regeling Wfsv][ref12]
      voorschotten op de rijksbijdrage voor de uitvoeringskosten van de taken, bedoeld in [artikel 15][ref13], en
      uitvoeringskosten van het aanspreekpunt tijdelijke impuls banenafspraak, bedoeld in [artikel 7][ref14], met als
      valutadatum de 15e dag van de maand.


