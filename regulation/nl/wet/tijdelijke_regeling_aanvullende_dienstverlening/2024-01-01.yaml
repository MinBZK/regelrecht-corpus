      en een aantal andere wetten in verband met diverse maatregelen gericht op het versterken van de positie van
      mbo-studenten ([Wet versterken positie mbo-studenten][ref2]; Stb. 2020, 234) in werking treedt, wordt in
      [artikel 20, derde lid, onderdeel a][ref3], ‘instellingsverklaring’ vervangen door ‘mbo-verklaring’.


