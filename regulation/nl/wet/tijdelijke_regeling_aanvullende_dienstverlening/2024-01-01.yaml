    text: |-
      1 Ten behoeve van het doel, bedoeld in [artikel 4, eerste lid][ref1], kunnen partijen als bedoeld in
      [artikel 6, eerste, lid, onderdelen a en b][ref2], en colleges van burgemeester en wethouders, gegevens verwerken
      die noodzakelijk zijn voor de uitvoering van de taken in het kader de samenwerking die bij of krachtens enige wet
      aan die partij of dat college van burgemeester en wethouders is opgedragen.

      2 De partijen, bedoeld in [artikel 6, eerste, lid, onderdelen a en b][ref3], en het college van burgemeester en
      wethouders, zijn bevoegd om ten behoeve van het doel, bedoeld in [artikel 4, eerste lid][ref4], aan partijen als
      bedoeld in [artikel 6, eerste, lid, onderdelen c en d][ref5], gegevens te verstrekken die noodzakelijk zijn voor de
      uitvoering van de taken in het kader de samenwerking die bij of krachtens enige wet aan die partij of dat college
      van burgemeester en wethouders is opgedragen, mits de betrokkene schriftelijk heeft verklaard tegen de verstrekking
      van deze gegevens geen bezwaar te hebben.

      3 De gegevens, bedoeld in het eerste en tweede lid, zijn:

      a. gegevens over de persoon: namen, geboortedatum, adresgegevens, contactgegevens;

      b. opleidingsgegevens;

      c. gegevens over het arbeidsverleden;

      d. gegevens over de huidige arbeidssituatie;

      e. arbeidsmarktbemiddelingsgegevens;

      f. gegevens omtrent de inzet van de dienstverlening werkfitbehoud, aanvullende dienstverlening of scholing via
      praktijkleren in het mbo; en

      g. of er sprake is van een persoon als bedoeld in [artikel 3][ref6].

      4 Indien aanvullende dienstverlening uit [bijlage 1][ref7], scholing via praktijkleren in mbo als uit
      [bijlage 2][ref8] of dienstverlening werkfitbehoud uit [bijlage 3][ref9] door een partij als bedoeld in
      [artikel 6, eerste, lid, onderdelen a en b][ref10], of een college van burgemeester en wethouders, wordt ingekocht
      bij een derde, verstrekt die partij of dat college van burgemeester en wethouders de gegevens, bedoeld in het derde
      lid, aan deze derde, mits betrokkene schriftelijk heeft verklaard tegen de verstrekking van deze gegevens geen
      bezwaar te hebben.

      5 Partijen, bedoeld in [artikel 6, onderdelen a en b][ref11], en colleges van burgemeesters en wethouders zijn
      bevoegd om gedurende de dienstverlening werkfitbehoud, aanvullende dienstverlening of scholing via praktijkleren
      in het mbo of binnen uiterlijk drie maanden na het afronden daarvan gegevens die ten behoeve van deze regeling zijn
      verwerkt, te verwerken ten behoeve van reguliere dienstverlening.


