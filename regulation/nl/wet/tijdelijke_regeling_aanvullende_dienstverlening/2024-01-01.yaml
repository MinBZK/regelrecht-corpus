      1 Het UWV is belast met de taken van de kassier.

      2 De kassier administreert en beheert feitelijk de budgetten, bedoeld in [artikel 25, derde lid][ref1], en zorgt
      voor de uitbetaling van de vergoedingen, bedoeld in de [artikelen 17 tot en met 21][ref2], aan de partijen.

      3 De Minister verleent aan de directeur van de divisie Werkbedrijf van het UWV mandaat om in het kader van de
      uitvoering van de [artikelen 19 tot en met 21][ref3], beschikkingen te nemen ter vaststelling van de hoogte van
      de vergoeding.

      4 De directeur van de divisie Werkbedrijf van het UWV kan ondermandaat verlenen aan een of meer rechtstreeks onder
      hem ressorterende functionarissen.


