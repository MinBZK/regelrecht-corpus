    text: |-
      1 Partijen en colleges van burgemeester en wethouders ondersteunen in de regionale mobiliteitsteams de volgende
      groepen bij het verkleinen van de afstand tot de arbeidsmarkt:

      a. werknemers die werkloos dreigen te raken maar niet in aanmerking komen voor dienstverlening op grond van
      [artikel 30a, eerste lid, onderdeel b, van de Wet SUWI][ref1];

      b. personen die in aanmerking komen voor ondersteuning bij arbeidsinschakeling op grond van
      [artikel 30a van de Wet SUWI][ref2] en [artikel 73 van de Werkloosheidswet][ref3];

      c. personen die in aanmerking komen voor ondersteuning bij arbeidsinschakeling op grond
      van [artikel 7, eerste lid, onderdeel a, van de Participatiewet][ref4], in samenhang met de
      [artikelen 7, derde lid][ref5], en [10f, van de Participatiewet][ref6].

      2 Aan werknemers en personen als bedoeld in het eerste lid kan in 2023 en 2024 aanvullende dienstverlening en
      scholing via praktijkleren uitsluitend worden aangeboden als uit de advisering, bedoeld in [artikel 8][ref7],
      blijkt dat dit noodzakelijk is voor het verkleinen van de afstand tot de arbeidsmarkt en het verkrijgen van arbeid
      en de inzet van reguliere dienstverlening onvoldoende wordt geacht.


