  - number: '32'
    text: |-
      1 Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst.

      2 Deze regeling vervalt op 1 januari 2025 met dien verstande dat deze regeling zoals die luidde op 31 december
      2024 en daaraan voorafgaand van toepassing blijft op de financiële afwikkeling van de regeling over de voorgaande
      kalenderjaren, op ingestelde bezwaar- en beroepsprocedures op grond van deze regeling en op lopende besluitvorming
      van de aanvullende dienstverlening, dienstverlening werkfitbehoud en scholing via praktijkleren in het mbo.
    url: https://wetten.overheid.nl/BWBR0044968/2024-01-01#Artikel32
