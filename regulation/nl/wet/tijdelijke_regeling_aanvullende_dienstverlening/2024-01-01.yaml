  - number: '23'
    text: |-
      1 De partijen en colleges van burgemeester en wethouders voeren een zodanig inzichtelijke en controleerbare
      administratie dat alle voor de vergoeding, bedoeld in [artikelen 17 tot en met 21][ref1], van belang zijnde
      gegevens kunnen worden nagegaan en verlenen desgevraagd tot vijf jaar na de datum van de door de partij ontvangen
      vergoeding inzage in deze administratie.

      2 De administratie geeft inzicht in de gemaakte kosten, de wijze waarop de kosten zijn verwerkt in het
      uitgavenoverzicht en de ontvangen vergoeding.

      3 De partijen en colleges van burgemeester en wethouders werken tot vijf jaar na de datum van de door de partij
      ontvangen vergoeding als bedoeld in [artikelen 17 tot en met 21][ref2], onder meer door het verschaffen van de
      daartoe benodigde inlichtingen, gegevens en bescheiden, mee aan door of namens de Minister ingesteld onderzoek
      dat erop is gericht de Minister inlichtingen te verschaffen die van belang zijn voor het beoordelen van de
      rechtmatigheid van de vergoeding, of de ontwikkeling van het beleid van de Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0044968#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0044968#Artikel17
