  - number: '3'
    text: |-
      Aan personen als bedoeld in [artikel 38b, eerste en tweede lid][ref1], en
      [artikel 38f, vijfde lid, van de Wet financiering sociale verzekeringen][ref2], die werkloos zijn geworden of
      dreigen te worden, kunnen dienstverlening werkfitbehoud, aanvullende dienstverlening en scholing via praktijkleren
      in het mbo in 2023 en 2024 worden aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel38b
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel38f
