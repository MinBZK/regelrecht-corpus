  - number: '15'
    text: |-
      De instelling die een proeftuin verzorgt, neemt, tenzij in deze regeling anders wordt bepaald, ten aanzien van die
      proeftuin in ieder geval in acht hetgeen bij of krachtens de [wet][ref1] is bepaald ten aanzien van:

      a. de kwaliteitszorg, bedoeld in [artikel 1.3.6 van de wet][ref2];

      b. de voorschriften inzake personeel, bedoeld in [hoofdstuk 4 van de wet][ref3];

      c. het onderwijs en de examens;

      d. de vooropleidingseisen, bedoeld in [artikel 8.2.1 van de wet][ref4], en

      e. de opneming in het Centraal register.


