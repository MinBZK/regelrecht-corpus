        artikel: '17'
        paragraaf: '4'
  - number: '10'
    text: |-
      1 Het procesmanagement keurt uiterlijk op 1 oktober 2004, op basis van door de minister bij afzonderlijke
      beschikking vast te stellen voorwaarden, aanvragen voor proeftuinen goed op basis van deze regeling. De
      voorwaarden, bedoeld in de vorige volzin, hebben in ieder geval betrekking op:

      a. voldoende spreiding van de proeftuinen over de sectoren van de opleidingen,

      b. voldoende spreiding van de proeftuinen over de niveaus van de opleidingen,

      c. voldoende landelijke spreiding van de proeftuinen,

      d. voldoende spreiding van de proeftuinen over inhoudelijke ontwikkelingsaspecten voor de opleidingen.

      2 Aanvragen voor proeftuinen worden door het procesmanagement alleen goedgekeurd, voorzover de proeftuinen
      een onderbouwde bijdrage leveren aan de doelen als bedoeld in [artikel 2, tweede lid][ref1], van deze regeling
      en leiden tot optimalisering van de kwalificatiestructuur en het herontwerp moet leiden, dan wel tot brede
      assistentopleidingen.

      3 Het uitvoeren van een onderdeel van een proeftuin door een andere instelling dan die de proeftuin heeft
      toegewezen gekregen, geschiedt slechts op basis van een samenwerkingsovereenkomst tussen deze instellingen. In deze
      samenwerkingsovereenkomst wordt in ieder geval geregeld dat:

      a. de deelnemers uitsluitend worden ingeschreven bij de instelling die de proeftuin heeft toegewezen gekregen,

      b. de instelling die de proeftuin heeft toegewezen gekregen, is verantwoordelijk voor het resultaat van de
      proeftuin.


      [ref1]: https://wetten.overheid.nl/BWBR0017157#Artikel2
    url: https://wetten.overheid.nl/BWBR0017157/2004-09-16#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0017157
        artikel: '2'
        paragraaf: '1'
  - number: '11'
    text: |-
      1 De hoogte van de subsidie voor een proeftuin aan een instelling wordt berekend op grond van de
      [artikelen 2.2.3][ref1], [2.2.4][ref2], en [2.4.1, eerste lid, van het Uitvoeringsbesluit WEB][ref3].
      Voor zover het betreft een proeftuin inzake een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid onderdelen a en b, van de wet][ref4] wordt de hoogte van de subsidie tevens berekend op
      grond van [artikel 2.2.5][ref5] juncto [artikel 6.1.1, tweede lid, van het Uitvoeringsbesluit WEB][ref6].

      2 De prijsfactor, bedoeld in [artikel 2.2.3, derde lid, van het Uitvoeringsbesluit WEB][ref7] voor een opleiding in
      een proeftuin wordt bij nadere regeling vastgesteld.

      3 Indien de instelling, bedoeld in [artikel 9, eerste lid][ref8], een proeftuin verzorgt in samenwerking met een of
      meer andere instellingen, kunnen deze instellingen afspraken maken over de verdeling van de bekostiging waarop op
      grond van het eerste lid aanspraak wordt gevestigd.

      4 [Artikel 2.2.4 van de wet][ref9] is van toepassing.


