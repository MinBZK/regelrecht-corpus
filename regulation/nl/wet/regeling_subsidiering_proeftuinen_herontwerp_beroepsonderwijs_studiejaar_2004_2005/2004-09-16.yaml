  - number: '5'
    text: |-
      Bij proeftuinen waarbij sprake is van het inschrijven van deelnemers voor onderwijs waarvoor de minister nog geen
      kwalificatieprofielen heeft vastgesteld, vindt inschrijving slechts plaats voorzover aan de volgende voorwaarden
      is voldaan:

      a. de deelnemer ondervindt geen nadelige gevolgen van het experimentele karakter van de proeftuin,

      b. in de onderwijsovereenkomst met de deelnemer is mede opgenomen dat, indien voor een proeftuin uiterlijk op het
      tijdstip, bedoeld in [artikel 17, eerste lid][ref1], geen kwalificatieprofielen zijn vastgesteld, de deelnemer kan
      instromen in een verwante opleiding waarvoor eindtermen zijn vastgesteld, van een gelijke duur, een gelijk niveau,
      een gelijke leerweg en een gelijkwaardige beroepspraktijkvorming als de opleiding in het kader van de proeftuin,

      c. indien bij een proeftuin een examen is gepland waarbij in aanvulling op de examinering van deelkwalificaties
      ook een integrale dan wel deelkwalificatie-overstijgende proeve van bekwaamheid wordt afgenomen bij deelnemers,
      dan geldt als voorwaarde, dat een integrale proeve van bekwaamheid slechts deel kan uitmaken van een proeftuin in
      zoverre deze aansluit bij [artikel 7.4.3, eerste lid van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017157#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7.4.3
    url: https://wetten.overheid.nl/BWBR0017157/2004-09-16#Artikel5
