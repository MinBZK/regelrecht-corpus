  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. minister:

      de Minister van Onderwijs, Cultuur en Wetenschap en, voor zover het betreft het beroepsonderwijs op het gebied van
      de landbouw en natuurlijke omgeving, de Minister van Landbouw, Natuur en Voedselkwaliteit;

      b. wet:

      de [Wet educatie en beroepsonderwijs][ref1];

      c. instelling:

      een instelling als bedoeld in [artikel 1.1.1, onderdeel b, van de wet][ref2], een instituut als bedoeld in
      [artikel 12.3.8 van de wet][ref3], en de hogeschool Haarlem, bedoeld in [artikel 12.3.9 van de wet][ref4];

      d. procesmanagement:

      het gemeenschappelijk procesmanagement, bedoeld in [artikel 18][ref5], dat belast is met de taken, genoemd in de
      [artikelen 10][ref6] en [14][ref7] van deze regeling;

      e. proeftuin:

      een beroepsopleiding in ontwikkeling op het niveau van beroepsopleidingen bedoeld in
      [artikel 7.2.2., eerste lid, van de wet][ref8];

      f. kenniscentrum:

      het kenniscentrum beroepsonderwijs bedrijfsleven als bedoeld in [artikel 1.5.1 van de wet][ref9], dat
      verantwoordelijk is voor de ontwikkeling van de kwalificatieprofielen voor de opleiding van de betreffende
      proeftuin;

      g. kwalificatieprofiel: het kwalificatieprofiel houdende een omschrijving van het geheel van eindtermen op het
      niveau van [artikel 7.2.2, eerste lid, van de wet][ref10] waarover degene die de opleiding voltooit, dient te
      beschikken om in beroeps-, leer- en maatschappelijke situaties op adequate wijze te kunnen handelen.


