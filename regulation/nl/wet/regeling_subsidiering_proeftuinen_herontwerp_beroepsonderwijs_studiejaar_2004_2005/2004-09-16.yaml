  - number: '12'
    text: |-
      1 [Artikel 4.2.5 van het Uitvoeringsbesluit WEB][ref1] is van overeenkomstige toepassing op het kenniscentrum.

      2 Indien het kenniscentrum, bedoeld in het eerste lid, eindtermen ten behoeve van een kwalificatieprofiel
