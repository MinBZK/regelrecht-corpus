  - number: '6'
    text: |-
      In het geval een deelnemer wordt ingeschreven voor een opleiding in het kader van een proeftuin waarvoor nog
      geen kwalificatieprofielen zijn vastgesteld, stelt de instelling, bedoeld in [artikel 9][ref1], de onderwijs-
      en examenregeling voor de aanvang van het onderwijs in de proeftuin voorlopig vast en stelt deze definitief vast
      uiterlijk op 1 april 2005.


      [ref1]: https://wetten.overheid.nl/BWBR0017157#Artikel9
    url: https://wetten.overheid.nl/BWBR0017157/2004-09-16#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0017157
        artikel: '9'
        paragraaf: '3'
  - number: '7'
    text: |-
      Indien het belang van de deelnemer dit noodzakelijk maakt, kan de minister, na advies van het procesmanagement,
      besluiten dat een proeftuin aan een instelling wordt beëindigd. Deelnemers die zijn ingeschreven in deze proeftuin,
      worden door de instelling ingeschreven in een beroepsopleiding als bedoeld in [artikel 7.2.2 van de wet][ref1],
      onder de voorwaarde, bedoeld in [artikel 5, onderdeel b][ref2], van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0017157#Artikel5
    url: https://wetten.overheid.nl/BWBR0017157/2004-09-16#Artikel7
