        artikel: '9'
        paragraaf: '3'
  - number: '17'
    text: |-
      1 Een kenniscentrum doet uiterlijk op 1 februari 2005 een voorstel aan de minister tot vaststelling van de
      kwalificatieprofielen, op basis waarvan proeftuinen functioneren.

      2 Indien een voorstel tot vaststelling van de kwalificatieprofielen op grond van lid 1 tijdig is ingediend stelt de
      minister uiterlijk op 1 maart 2005 de kwalificatieprofielen van de opleidingen en de daarbijbehorende codes in het
      kader van de proeftuinen vast.
    url: https://wetten.overheid.nl/BWBR0017157/2004-09-16#Artikel17
  - number: '18'
    text: |-
      1 Er is een procesmanagement kwalificatiestructuur en een procesmanagement beroepsonderwijs, dat belast is met de
      taken, bedoeld in [artikel 10][ref1] en [14][ref2].

      2 Aan het procesmanagement wordt, overeenkomstig [afdeling 10.1.1 van de Algemene wet bestuursrecht][ref3], mandaat
      verleend tot het nemen van besluiten, bedoeld in [artikel 10, eerste lid][ref4]. Het procesmanagement leeft de
      voorschriften bij of krachtens deze regeling na.

      3 Het procesmanagement dient voor 1 januari 2005 een tussenrapportage en voor 1 september 2005 een eindrapportage
      in bij de minister inzake de voortgang van de proeftuinen.

      4 De rapportages, bedoeld in het tweede lid, behelzen tenminste een overzicht van:

      a. het aantal proeftuinen dat is toegewezen;

      b. de aard van de proeftuinen;

      c. de op te leveren producten van de proeftuinen;

      d. het aantal deelnemers dat op 1 oktober 2004 deelneemt aan de onderscheiden proeftuinen;

      e. een risicoanalyse inzake de vraag of de eindtermen voor de proeftuinen tijdig kunnen worden vastgesteld.

      5 De minister kan bij beschikking nadere voorwaarden stellen inzake de in het tweede lid vermelde rapportages.


      [ref1]: https://wetten.overheid.nl/BWBR0017157#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0017157#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.1.1
      [ref4]: https://wetten.overheid.nl/BWBR0017157#Artikel10
    url: https://wetten.overheid.nl/BWBR0017157/2004-09-16#Artikel18
    references:
