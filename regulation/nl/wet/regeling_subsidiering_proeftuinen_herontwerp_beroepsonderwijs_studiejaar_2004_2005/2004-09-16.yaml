  - number: '2'
    text: |-
      1 Het doel van deze regeling is het bevorderen dat twee soorten proeftuinen in het middelbaar beroepsonderwijs
      worden ontwikkeld en uitgetest.

      2 De soorten proeftuinen, bedoeld in het eerste lid, zijn:

      a. de beroepsopleidingen, die tot doel hebben het ontwikkelen en uittesten van de uitvoerbaarheid van de nieuwe
      kwalificatieprofielen van het beroepsonderwijs en de daarop gebaseerde opleidingen in het kader van het herontwerp
      van het middelbaar beroepsonderwijs,

      b. de brede assistentopleidingen, die tot doel hebben het ontwikkelen en uittesten van de nieuwe brede
      assistentopleidingen.
    url: https://wetten.overheid.nl/BWBR0017157/2004-09-16#Artikel2
  - number: '3'
    text: |-
      Het bevoegd gezag geeft de deelnemer alvorens deze wordt ingeschreven in een opleiding in het kader van een
      proeftuin, voldoende informatie over de inhoud van de opleiding en de consequenties van het volgen van een
      opleiding in het kader van een proeftuin voor die deelnemer.
    url: https://wetten.overheid.nl/BWBR0017157/2004-09-16#Artikel3
  - number: '4'
    text: |-
      De instelling die een proeftuin verzorgt, neemt, tenzij in deze regeling anders wordt bepaald, ten aanzien van die
      proeftuin in ieder geval in acht hetgeen bij of krachtens de wet is bepaald ten aanzien van:

      a. de rechtsbescherming van de deelnemers, bedoeld in [hoofdstuk 7, titel 5 van de wet][ref1];

      b. de onderwijsovereenkomst, bedoeld in [artikel 8.1.3 van de wet][ref2],

      c. de beroepspraktijkovereenkomst, bedoeld in [artikel 7.2.8., tweede lid van de wet][ref3], en

      d. de onderwijsbijdrage als bedoeld in [artikel 8.1.4 van de wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8.1.3
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.8
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel8.1.4
    url: https://wetten.overheid.nl/BWBR0017157/2004-09-16#Artikel4
