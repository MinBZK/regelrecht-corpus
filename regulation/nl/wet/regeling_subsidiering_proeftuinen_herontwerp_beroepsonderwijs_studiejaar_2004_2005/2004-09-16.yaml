  - number: '16'
    text: |-
      De aanvraag voor een proeftuin op grond van [artikel 9, eerste lid][ref1], van deze regeling, geldt mede als
      aanmelding voor registratie in het Centraal register. Indien de aanvraag wordt goedgekeurd registreert de minister
      op het tijdstip van het vaststellen van het kwalificatieprofiel daartoe de opleiding in het Centraal register en
      geldt daarmee als registratie voor het register van het jaar 2004 - 2005.


      [ref1]: https://wetten.overheid.nl/BWBR0017157#Artikel9
    url: https://wetten.overheid.nl/BWBR0017157/2004-09-16#Artikel16
