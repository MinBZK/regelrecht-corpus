        artikel: 7.2.2
      - id: ref2
        bwb_id: BWBR0017157
        artikel: '5'
        paragraaf: '2'
  - number: '8'
    text: |-
      Subsidie wordt verleend aan instellingen die op grond van de [wet][ref1] worden bekostigd.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0017157/2004-09-16#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: '9'
    text: |-
      1 Instellingen dienen ten behoeve van een opleiding die uiterlijk op 1 oktober 2004 start, uiterlijk 24 september
      2004 een aanvraag in voor een proeftuin bij het procesmanagement.

      2 Een aanvraag voor een proeftuin bevat tenminste informatie over:

      a. de naam van de opleiding,

      b. het niveau van de opleiding,

      c. leerweg,

      d. het kwalificatieprofiel,

      e. het aantal studiebelastingsuren van het hele opleidingsprogramma en van het programma van het eerste jaar,

      f. een beschrijving van de op te leveren producten,

      g. de vervangende opleiding, bedoeld in [artikel 5, onderdeel b][ref1],

      h. een schriftelijke verklaring van het kenniscentrum, waaruit blijkt dat een voorstel tot het vaststellen van het
      kwalificatieprofiel, bedoeld in [artikel 17, eerste lid][ref2], in ontwikkeling is, en

      i. de beoogde producten en de resultaten van de proeftuin en de wijze waarop de instelling deze beschikbaar stelt
      voor derden, waaronder onder andere het betreffende kenniscentrum.


      [ref1]: https://wetten.overheid.nl/BWBR0017157#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0017157#Artikel17
    url: https://wetten.overheid.nl/BWBR0017157/2004-09-16#Artikel9
    references:
