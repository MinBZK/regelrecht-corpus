---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.2/schema.json
$id: rijkswet_nationaliteit_zeeschepen
regulatory_layer: WET
publication_date: '2026-02-19'
valid_from: '2025-07-01'
bwb_id: BWBR0048148
url: https://wetten.overheid.nl/BWBR0048148/2025-07-01
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is met inachtneming van de artikelen 91, 92, eerste lid,
    en 94 van het op 10 december 1982 te Montego-Bay tot stand gekomen Verdrag van de Verenigde Naties inzake het recht
    van de zee (Trb. 1983, 83) nieuwe regels te stellen omtrent verlening van de nationaliteit van het Koninkrijk aan
    een zeeschip en het recht de nationaliteitsvlag te voeren;

    Zo is het, dat Wij, de afdeling Advisering van de Raad van State van het Koninkrijk gehoord, en met gemeen overleg
    der Staten-Generaal, de bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde, hebben goedgevonden
    en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze rijkswet wordt verstaan onder: - *eigenaar:* eigenaar van een zeeschip in niet-bedrijfsmatig gebruik;
        - *IMO-nummer:* uniek scheepsidentificatienummer, bedoeld in voorschrift XI-1/3 van het SOLAS-verdrag;
        - *Koninkrijk:* Koninkrijk der Nederlanden;
        - *land:* Nederland, Aruba, Curaçao, onderscheidenlijk Sint Maarten;
        - *Onze Minister wie het aangaat:* Onze Minister van Infrastructuur en Waterstaat, onderscheidenlijk de minister
      van Aruba, Curaçao, onderscheidenlijk Sint Maarten, belast met de registratie van en het verlenen van de
      nationaliteit van het Koninkrijk aan zeeschepen;
        - *reder:* eigenaar van een zeeschip in bedrijfsmatig gebruik;
        - *rompbevrachting:* overeenkomst waarbij de ene partij, de rompvervrachter, zich verbindt een zeeschip zonder
      bemanning ter beschikking te stellen van haar wederpartij, de rompbevrachter, zonder daarover nog enige zeggenschap
      te houden, en de exploitatie van het zeeschip in handen ligt van de rompbevrachter en voor diens rekening
      geschiedt;
        - *SOLAS-verdrag:* het op 1 november 1974 te Londen tot stand gekomen Verdrag voor de beveiliging van mensenlevens
      op zee (Trb. 1976, 157) en de bij dat verdrag behorende bindende protocollen, aanhangsels en bijlagen;
        - *te boek staan:* ingeschreven zijn van een zeeschip, met inbegrip van daarop rustende zakelijke rechten, in een
      openbaar register voor registergoederen, dan wel in een daarmee vergelijkbaar register;
        - *vlagregister:* publiekrechtelijk register van zeeschepen;
        - *zeeschip:* elke zaak, geen luchtvaartuig zijnde, die blijkens zijn constructie bestemd is om in zee te drijven
      en in zee drijft of heeft gedreven;
        - *zeeschip in bedrijfsmatig gebruik:* zeeschip dat uitsluitend gebruikt wordt voor de uitoefening van een beroep
      of bedrijf.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel1
  - number: '2'
    text: 'Deze rijkswet is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel2
  - number: 2.a
    text: oorlogsschepen, marinehulpschepen en andere schepen die in gebruik zijn voor de uitvoering van de militaire taak;
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel2
  - number: 2.b
    text: |-
      zeeschepen die uitsluitend voor de uitoefening van de openbare macht of voor de niet-commerciële overheidsdienst
      zijn bestemd;
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel2
  - number: 2.c
    text: |-
      zeevissersschepen die krachtens internationale of regionale verdragen of besluiten van volkenrechtelijke
      organisaties zijn ingeschreven in een nationaliteitsregister voor zeevissersschepen, en
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel2
  - number: 2.d
    text: reddingsvaartuigen.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel2
  - number: '3.1'
    text: |-
      In elk van de landen kan door Onze Minister wie het aangaat een vlagregister worden gehouden en beheerd. Het
      vlagregister is openbaar.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel3
  - number: '3.2'
    text: Door inschrijving in het vlagregister van een land verkrijgt het zeeschip de nationaliteit van het Koninkrijk.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel3
  - number: '3.3'
    text: Een zeeschip staat niet in meer dan een vlagregister ingeschreven.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel3
  - number: '3.4'
    text: |-
      Door doorhaling van de inschrijving in het vlagregister van een land verliest het zeeschip de nationaliteit van
      het Koninkrijk.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel3
  - number: '4.1'
    text: 'Het vlagregister bevat ten minste de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel4
  - number: 4.1.a
    text: |-
      de naam en het adres van de reder, en in geval van vertegenwoordiging de vertegenwoordiger, bedoeld in
      [artikel 8][ref1], de rompbevrachter of de eigenaar;


      [ref1]: https://wetten.overheid.nl/BWBR0048148#Artikel8
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0048148
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 4.1.b
    text: de naam, de thuishaven in het land en, indien van toepassing, het IMO-nummer van het zeeschip;
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel4
  - number: 4.1.c
    text: de bruto- en nettotonnage van het zeeschip, vermeld in de meetbrief betreffende het zeeschip;
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel4
  - number: 4.1.d
    text: 'de beschrijving van het zeeschip, waaronder in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel4
  - number: 4.1.d.1°
    text: het type en de inrichting van het zeeschip,
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel4
  - number: 4.1.d.2°
    text: het materiaal waarvan de romp is gemaakt,
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel4
  - number: 4.1.d.3°
    text: de overige speciale kenmerken van het zeeschip,
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel4
  - number: 4.1.d.4°
    text: het brandmerk,
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel4
  - number: 4.1.d.5°
    text: de naam en de vestigingsplaats van de werf waar het zeeschip is gebouwd,
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel4
  - number: 4.1.d.6°
    text: het bouwjaar en, indien bekend, het bouwnummer,
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel4
  - number: 4.1.d.7°
    text: het aantal motoren waaruit de voortstuwingsinstallatie bestaat, en
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel4
  - number: 4.1.d.8°
    text: het type, het vermogen, de fabrikant en het fabrieksnummer van elke motor;
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel4
  - number: 4.1.e
    text: 'alsmede, in geval van rompbevrachting:'
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel4
  - number: 4.1.e.1°
    text: de dagtekening en de duur van de rompbevrachtingsovereenkomst,
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel4
  - number: 4.1.e.2°
    text: de naam van de reder alsmede de naam waaronder het zeeschip buiten het land te boek staat,
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel4
  - number: 4.1.e.3°
    text: |-
      de naam en het adres van de beheerder van het register, waar het zeeschip buiten het land te boek staat, met
      vermelding van de datum en het nummer van de teboekstelling.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel4
  - number: '4.2'
    text: |-
      Onze Minister wie het aangaat houdt ten aanzien van elk zeeschip dat in het vlagregister ingeschreven staat of
      heeft gestaan, de aan de inschrijving of de uitschrijving, alsmede de daaraan en aan andere in het vlagregister
      aangebrachte wijzigingen ten grondslag liggende gegevens, bescheiden, verklaringen, afschriften, uittreksels en
      andere bij het vlagregister berustende informatie, in blijvende bewaring.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel4
  - number: '4.3'
    text: |-
      Onze Minister wie het aangaat kan nadere regels stellen omtrent de inrichting van het vlagregister en de
      beveiliging van de in het vlagregister opgenomen persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel4
  - number: '5.1'
    text: 'Gedurende de tijd dat het zeeschip de nationaliteit van het Koninkrijk heeft:'
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel5
  - number: 5.1.a
    text: |-
      doet de reder, de rompbevrachter of de eigenaar op dit zeeschip de vlag van het Koninkrijk voeren en ziet hij erop
      toe dat daarop geen vlag van een andere staat wordt gevoerd;
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel5
  - number: 5.1.b
    text: |-
      is de reder of de rompbevrachter verantwoordelijk voor het handelen en nalaten ten aanzien van het zeeschip,
      opvarenden en lading, ook voor zover die verantwoordelijkheid in zijn opdracht door derden wordt uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel5
  - number: 5.1.c
    text: is de eigenaar verantwoordelijk voor het handelen en nalaten van het zeeschip en opvarenden;
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel5
  - number: 5.1.d
    text: |-
      draagt de reder, de rompbevrachter of eigenaar er zorg voor dat de naam en het internationaal vastgestelde kenmerk
      van het zeeschip en de thuishaven, gelegen in het land waar inschrijving in het vlagregister plaatsvindt, in
      duidelijk leesbare letters op het zeeschip vermeld staan.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel5
  - number: '5.2'
    text: |-
      Elk van de landen kan bij of krachtens algemene maatregel van bestuur, onderscheidenlijk landsbesluit houdende
      algemene maatregelen, nadere regels stellen met betrekking tot het eerste lid, onder d.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel5
  - number: '6.1'
    text: |-
      Op aanvraag door of namens de reder kan inschrijving van een zeeschip in eigendom en in bedrijfsmatig gebruik in
      het vlagregister slechts plaatsvinden, indien de reder aantoont dat hij, onderscheidenlijk zijn zeeschip, voldoet
      aan de eisen, bedoeld in [artikel 7][ref1] of [8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0048148#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0048148#Artikel8
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0048148
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0048148
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '6.2'
    text: |-
      Op aanvraag door of namens de rompbevrachter kan inschrijving van een zeeschip in rompbevrachting en in
      bedrijfsmatig gebruik in het vlagregister slechts plaatsvinden, indien de rompbevrachter aantoont dat hij,
      onderscheidenlijk zijn zeeschip, voldoet aan de eisen, bedoeld in [artikel 9, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0048148#Artikel9
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0048148
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '6.3'
    text: |-
      Op aanvraag door of namens de eigenaar kan inschrijving van een zeeschip in niet-bedrijfsmatig gebruik in het
      vlagregister plaatsvinden, indien de eigenaar schriftelijk aantoont dat hij, onderscheidenlijk zijn zeeschip
      voldoet aan de vereisten, bedoeld in [artikel 10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0048148#Artikel10
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0048148
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '6.4'
    text: |-
      Onze Minister wie het aangaat kan regels stellen over de bij de in het eerste, tweede of derde lid, bedoelde
      aanvraag te overleggen gegevens en documenten, met inbegrip van notariële verklaringen en door een beëdigd vertaler
      opgestelde vertalingen in de Nederlandse of Engelse taal.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel6
  - number: '6.5'
    text: |-
      De kosten die samenhangen met het in behandeling nemen van de aanvraag, van de registratie en van de overige
      documenten die bij of krachtens deze rijkswet worden afgegeven, alsmede van duplicaten en gewaarmerkte afschriften
      van deze documenten, komen ten laste van de aanvrager.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel6
  - number: '6.6'
    text: |-
      De bedragen ter vergoeding van de kosten worden in Nederland bij ministeriële regeling en in Aruba, Curaçao,
      onderscheidenlijk Sint Maarten bij landsbesluit houdende algemene maatregelen, vastgesteld.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel6
  - number: '7'
    text: |-
      Onverminderd [artikel 8][ref1] zijn de eisen, bedoeld in [artikel 6, eerste lid][ref2], de volgende:


      [ref1]: https://wetten.overheid.nl/BWBR0048148#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0048148#Artikel6
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0048148
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0048148
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 7.a
    text: |-
      Het zeeschip is in bedrijfsmatig gebruik en staat te boek in het land waar inschrijving in het vlagregister wordt
      aangevraagd.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel7
  - number: 7.b
    text: Het zeeschip staat niet tegelijkertijd te boek in meer dan een land of staat.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel7
  - number: 7.c
    text: |-
      De reder heeft in het land waar het zeeschip is te boek gesteld een vestiging overeenkomstig de toepasselijke
      landswetgeving en voorziet bij voortduring in een of meer natuurlijke personen die verantwoordelijk zijn voor het
      zeeschip, de kapitein en de overige leden van de bemanning en opvarenden, alsmede voor de daarmee verband houdende
      aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel7
  - number: 7.d
    text: |-
      De natuurlijke persoon of personen, bedoeld in onderdeel c, of, bij verhindering, een plaatsvervanger of
      plaatsvervangers:
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel7
  - number: 7.d.1°
    text: houden kantoor in een vestiging van de reder in het betrokken land,
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel7
  - number: 7.d.2°
    text: zijn alleen of tezamen beslissingsbevoegd,
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel7
  - number: 7.d.3°
    text: zijn vertegenwoordigingsbevoegd,
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel7
  - number: 7.d.4°
    text: zijn bij voortduring bereikbaar, en
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel7
  - number: 7.d.5°
    text: beschikken over bevoegdheden om onverwijld te kunnen handelen in situaties waarin dat geboden is.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel7
  - number: 7.e
    text: |-
      Indien het zeeschip eigendom is van een natuurlijke persoon die tevens kapitein is van dat schip, is er in
      afwijking van onderdelen c en d in het land aan de wal een vertegenwoordiger van die persoon, die bij voortduring
      bereikbaar is en beschikt over bevoegdheden om onverwijld te kunnen handelen in situaties waarin dat geboden is.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel7
  - number: 7.f
    text: |-
      In de vestiging, bedoeld in onderdeel c, doet de reder een zodanige administratie voeren, dat ten aanzien van het
      zeeschip te allen tijde, in voorkomende gevallen met de benodigde spoed, inzicht kan worden gegeven in:
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel7
  - number: 7.f.1°
    text: |-
      de wijze waarop uitvoering wordt gegeven aan de verantwoordelijkheid voor het zeeschip, opvarenden en lading, met
      inbegrip van de daarbij betrokken personen en de hun opgedragen taken, alsmede;
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel7
  - number: 7.f.2°
    text: |-
      de positie van het zeeschip, de namen, de functies, de vaarbevoegdheden van de bemanning, de individuele zee-
      arbeidsovereenkomsten met de zeevarenden en de toepasselijke collectieve arbeidsovereenkomst of -regeling door of
      namens een daartoe bevoegd bestuursorgaan, de namen van de passagiers en van de overige opvarenden, alsmede de aard
      en samenstelling van de lading.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel7
  - number: 7.g
    text: |-
      Het zeeschip en de bedrijfsvoering over dat schip voldoen aan de wettelijke voorschriften met betrekking tot de
      veiligheid en navigatie van zeeschepen, bemanning en andere opvarenden en de voorkoming van verontreiniging door
      zeeschepen, zoals deze gelden in het land waar inschrijving in het vlagregister wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel7
  - number: '8.1'
    text: |-
      In afwijking van [artikel 7][ref1] kan de reder zich in het betreffende land laten vertegenwoordigen door een
      rechtspersoon die aldaar is gevestigd overeenkomstig het toepasselijke recht.


      [ref1]: https://wetten.overheid.nl/BWBR0048148#Artikel7
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0048148
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '8.2'
    text: |-
      Indien toepassing wordt gegeven aan het eerste lid, is [artikel 7, onderdelen c, d en f][ref1], van
      overeenkomstige toepassing op deze rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0048148#Artikel7
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0048148
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '8.3'
    text: |-
      Indien toepassing wordt gegeven aan het eerste lid behoeft de reder niet te voldoen aan
      [artikel 7, onderdelen c, d en f][ref1]. Indien de reder geen vestiging heeft, kiest hij ten aanzien van alle
      aangelegenheden met betrekking tot het zeeschip woonplaats ten kantore van een vestiging van de rechtspersoon die
      de reder vertegenwoordigt.


      [ref1]: https://wetten.overheid.nl/BWBR0048148#Artikel7
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0048148
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '9.1'
    text: |-
      De eisen, bedoeld in [artikel 6, tweede lid][ref1], zijn de volgende:


      [ref1]: https://wetten.overheid.nl/BWBR0048148#Artikel6
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0048148
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 9.1.a
    text: |-
      Het zeeschip is in bedrijfsmatig gebruik en in rompbevrachting afgestaan aan een of meer natuurlijke
      personen, dan wel aan een of meer rechtspersonen. [Artikel 7, onderdelen c, d, f en g][ref1], van deze
      rijkswet, alsmede de bepalingen ten aanzien van de teboekstelling van een afgebouwd zeeschip, bedoeld
      in [afdeling 2 van titel 3 van boek 8 van het Burgerlijk Wetboek van Nederland][ref2], Aruba, Curaçao,
      onderscheidenlijk Sint Maarten, zijn van overeenkomstige toepassing op de rompbevrachter.


      [ref1]: https://wetten.overheid.nl/BWBR0048148#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Afdeling2
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0048148
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005034
        afdeling: '2'
  - number: 9.1.b
    text: |-
      De rompvervrachter en, indien deze een andere is dan de reder, de reder stemmen er schriftelijk mee in dat het
      zeeschip de nationaliteit van het Koninkrijk verkrijgt en zij tonen aan dat er daarvoor in verband met het aangaan
      van een rompbevrachtingsovereenkomst ingevolge de wetgeving van de staat waar het zeeschip buiten het land te boek
      staat, geen beletselen zijn.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel9
  - number: 9.1.c
    text: |-
      De rompbevrachter toont aan, indien het zeeschip in een andere staat te boek staat, dat hij niet gerechtigd is op
      het zeeschip de nationaliteitsvlag te voeren van die staat, zolang het zeeschip de nationaliteit van het Koninkrijk
      heeft.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel9
  - number: 9.1.d
    text: De rompbevrachter toont de tijdsduur aan van de rompbevrachtingsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel9
  - number: '9.2'
    text: |-
      Onze Minister wie het aangaat kan aan de inschrijving voorwaarden verbinden teneinde de voldoening van vorderingen
      uit de arbeidsovereenkomsten van de kapitein en de andere leden van de bemanning steeds gedurende ten minste één
      jaar te verzekeren.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel9
  - number: '9.3'
    text: |-
      Onze Minister wie het aangaat kan regels stellen met betrekking tot het in kennis stellen van de betrokken
      organisaties van reders en zeevarenden in geval van inschrijving van een zeeschip in het vlagregister door een
      rompbevrachter.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel9
  - number: '10'
    text: |-
      De eisen, bedoeld in [artikel 6, derde lid][ref1], zijn de volgende:


      [ref1]: https://wetten.overheid.nl/BWBR0048148#Artikel6
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0048148
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 10.a
    text: |-
      Het zeeschip is in niet-bedrijfsmatig gebruik en staat te boek in het land waar inschrijving in het vlagregister
      wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel10
  - number: 10.b
    text: Het zeeschip staat niet tegelijkertijd te boek in meer dan een land of staat.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel10
  - number: 10.c
    text: |-
      Het zeeschip voldoet aan de toepasselijke wettelijke voorschriften met betrekking tot de veiligheid en navigatie
      van zeeschepen en de voorkoming van verontreiniging door zeeschepen, zoals deze voor dat zeeschip gelden in het
      land dat aan het schip de nationaliteit van het Koninkrijk verleent.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel10
  - number: 10.d
    text: |-
      Een of meer natuurlijke personen in het land dat aan het zeeschip de nationaliteit van het Koninkrijk verleent,
      beschikken over voldoende volmacht van de eigenaar om onverwijld te kunnen handelen in situaties waarin dat geboden
      is.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel10
  - number: '11.1'
    text: |-
      De reder, rompbevrachter of eigenaar op wiens naam een zeeschip in het vlagregister staat ingeschreven,
      stelt Onze Minister wie het aangaat onverwijld schriftelijk in kennis van de wijzigingen in feiten
      en omstandigheden ten aanzien van enig gegeven dat is opgenomen in de aanvraag, bedoeld in de
      [artikelen 6, eerste, tweede of derde lid][ref1], of in de daarbij overgelegde bescheiden, alsmede van
      de wijzigingen in feiten en omstandigheden die verband houden met de voorwaarden voor inschrijving in het
      vlagregister, bedoeld in de [artikelen 7 tot en met 10][ref2], waaronder – in geval van rompbevrachting –
      wijzigingen in gegevens betreffende de tijdsduur van de rompbevrachtingsovereenkomst of van het aangaan van enige
      nadere overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0048148#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0048148#Artikel7
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0048148
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0048148
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '11.2'
    text: |-
      Bij ministeriële regeling, onderscheidenlijk ministeriële regeling met algemene werking, van Onze Minister wie het
      aangaat kan de vorm van de in het eerste lid bedoelde kennisgeving worden vastgesteld. Daarbij kan worden bepaald
      dat deze kennisgeving in elektronische vorm kan worden gedaan.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel11
  - number: '12.1'
    text: 'Onze Minister wie het aangaat weigert inschrijving van een zeeschip in het vlagregister, indien:'
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel12
  - number: 12.1.a
    text: |-
      niet is voldaan aan de [artikelen 6 tot en met 10][ref1], voor zover van toepassing;


      [ref1]: https://wetten.overheid.nl/BWBR0048148#Artikel6
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0048148
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 12.1.b
    text: het zeeschip na die inschrijving gerechtigd zou blijven de nationaliteitsvlag van een andere staat te voeren;
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel12
  - number: 12.1.c
    text: |-
      de verkrijging van de nationaliteit van het Koninkrijk niet verenigbaar is met volkenrechtelijke verplichtingen van
      het Koninkrijk, of
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel12
  - number: 12.1.d
    text: |-
      er ernstige redenen zijn te veronderstellen dat het zeeschip zal worden gebruikt voor het plegen van ernstige
      schendingen van internationaal humanitair recht.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel12
  - number: '12.2'
    text: 'Onze Minister wie het aangaat kan inschrijving van een zeeschip in het vlagregister weigeren, indien:'
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel12
  - number: 12.2.a
    text: |-
      er ernstige redenen zijn te veronderstellen dat het zeeschip zal worden gebruikt voor het plegen van handelingen
      als bedoeld in [artikel 13, vierde lid, onderdelen d of f][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0048148#Artikel13
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0048148
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 12.2.b
    text: |-
      de inschrijving van het betreffende zeeschip in een van de landen eerder is doorgehaald op grond van
      [artikel 13][ref1] en aannemelijk is dat het zeeschip voor dezelfde gedraging zal worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0048148#Artikel13
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0048148
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '12.3'
    text: |-
      Een weigering als bedoeld in het eerste lid, onderdeel c, vindt plaats na overleg met Onze Minister van
      Buitenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel12
  - number: '12.4'
    text: |-
      Bij wet onderscheidenlijk landsverordening kunnen aanvullende bepalingen worden vastgesteld op grond waarvan
      inschrijving van een zeeschip in een vlagregister kan worden geweigerd.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel12
  - number: '12.5'
    text: |-
      Voor Aruba, Curaçao onderscheidenlijk Sint Maarten gelden bepalingen van bindende EU-rechtshandelingen, op
      de voet van artikel 215, eerste en tweede lid, van het Verdrag betreffende de werking van de Europese Unie
      vastgesteld in het kader van het Gemeenschappelijk Buitenlands en Veiligheidsbeleid van de Europese Unie, met
      uitzondering van bepalingen die uitsluitend verplichtingen tussen de lidstaten van de Europese Unie onderling of
      verplichtingen jegens organen van de Unie bevatten, als volkenrechtelijke verplichtingen in de zin van het eerste
      lid, onderdeel c.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel12
  - number: '13.1'
    text: |-
      Onze Minister wie het aangaat haalt na overleg met Onze Minister van Buitenlandse Zaken de inschrijving van een
      zeeschip in het vlagregister door indien:
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel13
  - number: 13.1.a
    text: |-
      met het zeeschip enig vanwege de regering van het Koninkrijk gegeven en bekendgemaakt voorschrift tot het niet
      deelnemen aan een gewapend conflict opzettelijk wordt overtreden;
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel13
  - number: 13.1.b
    text: het zeeschip zodanig wordt gebruikt dat het Koninkrijk in een gewapend conflict wordt of kan worden betrokken;
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel13
  - number: 13.1.c
    text: |-
      de nationaliteit van het zeeschip niet langer verenigbaar is met volkenrechtelijke verplichtingen van het
      Koninkrijk en de onverenigbaarheid niet kan worden opgeheven door het stellen van voorwaarden.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel13
  - number: '13.2'
    text: 'Onze Minister wie het aangaat haalt de inschrijving van een zeeschip in het vlagregister door indien:'
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel13
  - number: 13.2.a
    text: het zeeschip is gezonken, vergaan, ontmanteld of vernietigd;
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel13
  - number: 13.2.b
    text: het zeeschip zodanig is aangepast dat het niet langer als zeeschip kan worden aangemerkt;
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel13
  - number: 13.2.c
    text: degene op wiens naam het zeeschip ingeschreven staat dat verzoekt;
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel13
  - number: 13.2.d
    text: |-
      een of meer van de bij de beoordeling van de aanvraag om inschrijving verstrekte gegevens of overgelegde bescheiden
      zodanig onvolledig of onjuist blijken te zijn, dat, indien dit ten tijde van de beoordeling van de aanvraag bekend
      was geweest, een andere beslissing genomen zou zijn;
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel13
  - number: 13.2.e
    text: |-
      bij voortduring niet meer voldaan wordt aan de bij of krachtens de [artikelen 6 tot en met 10][ref1], met
      uitzondering van de [artikelen 7, onderdelen f en g][ref2], en [10, onderdeel c][ref3], gestelde voorwaarden
      voor inschrijving;


      [ref1]: https://wetten.overheid.nl/BWBR0048148#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0048148#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0048148#Artikel10
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0048148
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0048148
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0048148
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 13.2.f
    text: het zeeschip in een privaatrechtelijk register waarin het te boek staat, wordt doorgehaald;
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel13
  - number: 13.2.g
    text: de rompbevrachtingsovereenkomst is geëindigd;
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel13
  - number: 13.2.h
    text: |-
      de rompbevrachter een overeenkomst is aangegaan, dan wel anderszins een handeling verricht, die tot gevolg heeft
      dat zijn zeggenschap of verantwoordelijkheid gedurende de looptijd van de rompbevrachtingsovereenkomst wezenlijk
      wordt aangetast.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel13
  - number: '13.3'
    text: |-
      Onze Minister wie het aangaat haalt de inschrijving van een zeeschip in het vlagregister door, indien er ernstige
      redenen zijn te veronderstellen dat het zeeschip bestemd is of gebruikt wordt voor het plegen van ernstige
      schendingen van het internationaal humanitair recht.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel13
  - number: '13.4'
    text: 'Onze Minister wie het aangaat kan de inschrijving van een zeeschip in het vlagregister doorhalen, indien:'
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel13
  - number: 13.4.a
    text: |-
      het zeeschip is gebruikt voor een handeling, die bij onherroepelijk geworden vonnis, afkomstig van een rechter
      van het land waar het zeeschip in het vlagregister staat ingeschreven, heeft geleid tot veroordeling wegens een
      misdrijf en oplegging van een boete van de vierde categorie of hoger, of een gevangenisstraf van tenminste twee
      jaren;.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel13
  - number: 13.4.b
    text: |-
      ten aanzien van het zeeschip voor vergelijkbare feiten herhaaldelijk strafrechtelijke of bestuursrechtelijke
      sancties, opgelegd door het land waar het zeeschip in het vlagregister staat ingeschreven, onherroepelijk zijn
      geworden:
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel13
  - number: 13.4.b.1°
    text: |-
      waaruit blijkt dat voortdurend niet voldaan wordt aan de wettelijke voorschriften met betrekking tot de veiligheid
      en navigatie van zeeschepen, bemanning en andere zeevarenden en de voorkoming van verontreiniging door zeeschepen,
      zoals deze gelden in het land waar het zeeschip in het vlagregister staat ingeschreven; of
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel13
  - number: 13.4.b.2°
    text: |-
      indien ten aanzien van de in de vestiging door de reder gevoerde administratie blijkt dat voortdurend niet wordt
      voldaan aan de in [artikel 7, onderdeel f][ref1], gestelde voorwaarden voor inschrijving;


      [ref1]: https://wetten.overheid.nl/BWBR0048148#Artikel7
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0048148
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 13.4.c
    text: |-
      niet voldaan is aan [artikel 11][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0048148#Artikel11
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0048148
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 13.4.d
    text: 'er ernstige redenen zijn te veronderstellen dat het zeeschip bestemd is of gebruikt wordt voor:'
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel13
  - number: 13.4.d.1°
    text: piraterij;
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel13
  - number: 13.4.d.2°
    text: slavenhandel of mensenroof;
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel13
  - number: 13.4.d.3°
    text: uitzendingen waarvoor geen machtiging is verleend;
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel13
  - number: 13.4.d.4°
    text: handel in verdovende middelen en psychotrope stoffen;
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel13
  - number: 13.4.d.5°
    text: mensensmokkel of illegaal vervoer van illegale vreemdelingen;
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel13
  - number: 13.4.d.6°
    text: wederrechtelijk vervoer van wapens, waaronder chemische, biologische of nucleaire wapens;
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel13
  - number: 13.4.d.7°
    text: |-
      misdrijven als omschreven in de verdragen betreffende de strafbaarstelling van terroristische handelingen waarbij
      het Koninkrijk partij is;
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel13
  - number: 13.4.e
    text: het zeeschip een vlag voert van een andere staat;
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel13
  - number: 13.4.f
    text: |-
      handelingen worden verricht met of vanaf het zeeschip waarvan de betrokkenen weten of behoren te weten dat die
      ernstige schade tot gevolg kunnen hebben voor andere schepen, zich daarop bevindende opvarenden of daarop aanwezige
      lading en die ernstige schade zich als gevolg van die handelingen daadwerkelijk heeft voorgedaan.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel13
  - number: '13.5'
    text: |-
      Voor Aruba, Curaçao onderscheidenlijk Sint Maarten gelden bepalingen van bindende EU-rechtshandelingen, op
      de voet van artikel 215, eerste en tweede lid, van het Verdrag betreffende de werking van de Europese Unie
      vastgesteld in het kader van het Gemeenschappelijk Buitenlands en Veiligheidsbeleid van de Europese Unie, met
      uitzondering van bepalingen die uitsluitend verplichtingen tussen de lidstaten van de Europese Unie onderling of
      verplichtingen jegens organen van de Unie bevatten, als volkenrechtelijke verplichtingen in de zin van het eerste
      lid, onderdeel c.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel13
  - number: '14'
    text: |-
      In afwijking van [artikel 13, derde en vierde lid][ref1], vindt doorhaling in het vlagregister niet
      plaats indien naar het oordeel van Onze Minister wie het aangaat, na overleg met de betrokken Minister van
      Justitie, sprake is van belemmering van opsporingsonderzoek naar of vervolging van een of meer van de in
      [artikel 13, derde of vierde lid, onderdeel d][ref2], genoemde strafbare feiten.


      [ref1]: https://wetten.overheid.nl/BWBR0048148#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0048148#Artikel13
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0048148
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0048148
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '15.1'
    text: |-
      Onze Minister wie het aangaat zendt bericht van iedere weigering of doorhaling in het vlagregister aan de bewaarder
      van het privaatrechtelijke register waar zeeschepen te boek staan.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel15
  - number: '15.2'
    text: |-
      Onze Ministers wie het aangaat verstrekken elkaar op verzoek informatie over inschrijvingen, alsmede weigeringen en
      doorhalingen in de registers.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel15
  - number: '16.1'
    text: |-
      Desgevraagd verleent Onze Minister wie het aangaat kosteloos inzage in het vlagregister en geeft tegen kostprijs
      eensluidend gewaarmerkte afschriften of uittreksels daarvan af.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel16
  - number: '16.2'
    text: |-
      Onze Minister wie het aangaat kan desgevraagd een verklaring afgeven, inhoudende dat een zeeschip ten aanzien
      waarvan bij het desbetreffende verzoek door de betrokkene ten minste zodanige gegevens bekend gesteld zijn dat de
      identiteit van het zeeschip voldoende vaststaat, niet ingeschreven staat, dan wel dat het zeeschip uitgeschreven
      is, en dat de wetgeving van het betreffende land zich er niet tegen verzet dat het zeeschip in een ander land of
      een andere staat in rompbevrachting genomen wordt, terwijl het schip in het betreffende land te boek blijft staan.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel16
  - number: '16.3'
    text: 'Onze Minister wie het aangaat kan nadere regels stellen over:'
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel16
  - number: 16.3.a
    text: de vereisten voor de aanvraag van een verklaring als bedoeld in het tweede lid;
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel16
  - number: 16.3.b
    text: |-
      de vorm van de in het eerste en het tweede lid voorziene verklaringen, waarmerking en de in schriftelijke vorm te
      geven afschriften en uittreksels;
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel16
  - number: 16.3.c
    text: |-
      de wijze waarop in elektronische vorm te verstrekken verklaringen, afschriften en uittreksels als voorzien in
      het eerste en het tweede lid eensluidend worden gewaarmerkt, waartoe zij ten minste worden voorzien van een
      elektronische handtekening namens Onze Minister wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel16
  - number: '16.4'
    text: 'Onze Minister wie het aangaat stelt regels over:'
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel16
  - number: 16.4.a
    text: |-
      de bescherming van de arbeidsrechtelijke positie van zeevarenden en het in kennis stellen daarvan indien een
      verklaring als bedoeld in het tweede lid wordt afgegeven; en
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel16
  - number: 16.4.b
    text: |-
      het in kennis stellen van de betrokken organisaties van reders en zeevarenden indien een verklaring als bedoeld in
      het tweede lid wordt afgegeven.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel16
  - number: '17.1'
    text: |-
      Ten behoeve van een zeeschip dat de nationaliteit van het Koninkrijk heeft verkregen, geeft Onze Minister wie het
      aangaat onverwijld aan de aanvrager een zeebrief af als bewijs van de nationaliteit van het Koninkrijk en van het
      recht de nationaliteitsvlag van het Koninkrijk te voeren.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel17
  - number: '17.2'
    text: De zeebrief vervalt bij de doorhaling van de inschrijving van het zeeschip in het vlagregister.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel17
  - number: '18.1'
    text: 'Een zeebrief voor een zeeschip in bedrijfsmatig gebruik vermeldt:'
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel18
  - number: 18.1.a
    text: de naam van het zeeschip en die van het kantoor waar het te boek staat;
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel18
  - number: 18.1.b
    text: de naam van de reder of rompbevrachter waaraan het zeeschip toebehoort;
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel18
  - number: 18.1.c
    text: de bruto- en nettotonnage van het zeeschip volgens de meetbrief;
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel18
  - number: 18.1.d
    text: 'een beschrijving van het zeeschip, waaronder in elk geval:'
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel18
  - number: 18.1.d.1°
    text: het type en de inrichting van het zeeschip,
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel18
  - number: 18.1.d.2°
    text: het materiaal waarvan de romp is gemaakt,
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel18
  - number: 18.1.d.3°
    text: de overige speciale kenmerken van het zeeschip,
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel18
  - number: 18.1.d.4°
    text: het IMO-nummer of, indien het zeeschip geen IMO-nummer heeft, een uniek scheepsidentificatienummer,
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel18
  - number: 18.1.d.5°
    text: de naam en de vestigingsplaats van de werf waar het zeeschip is gebouwd,
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel18
  - number: 18.1.d.6°
    text: het bouwjaar en, voor zover bekend, het bouwnummer,
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel18
  - number: 18.1.d.7°
    text: het aantal motoren waaruit de voortstuwingsinstallatie bestaat,
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel18
  - number: 18.1.d.8°
    text: het type, het vermogen, de fabrikant en het fabrieksnummer van elke motor, en
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel18
  - number: 18.1.d.9°
    text: de tijdsduur waarvoor de zeebrief is afgegeven.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel18
  - number: '18.2'
    text: 'Een zeebrief voor een zeeschip in niet-bedrijfsmatig gebruik vermeldt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel18
  - number: 18.2.a
    text: de naam van het zeeschip en die van het kantoor waar het te boek staat;
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel18
  - number: 18.2.b
    text: de naam van de eigenaar;
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel18
  - number: 18.2.c
    text: bruto- en nettotonnage van het zeeschip volgens de meetbrief;
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel18
  - number: 18.2.d
    text: de in het eerste lid, onderdeel d, subonderdelen 2°, 4°, 7° en 8° bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel18
  - number: '19'
    text: |-
      De vervallen zeebrief wordt door de reder, rompbevrachter of eigenaar met de eerste gelegenheid ingezonden aan Onze
      Minister wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel19
  - number: '20'
    text: |-
      Bij het aandoen van een haven, ongeacht waar ter wereld, toont de kapitein van een in het vlagregister ingeschreven
      zeeschip op verzoek van de bevoegde autoriteit een geldige zeebrief.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel20
  - number: '21.1'
    text: |-
      In afwijking van de [artikelen 3][ref1], [5][ref2] en [17][ref3] geeft Onze Minister wie het aangaat aan de
      aanvrager voor een niet in het vlagregister ingeschreven staand zeeschip:


      [ref1]: https://wetten.overheid.nl/BWBR0048148#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0048148#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0048148#Artikel17
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0048148
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0048148
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0048148
        artikel: '17'
        hoofdstuk: '3'
  - number: 21.1.a
    text: |-
      een voorlopige zeebrief af, indien de reder, rompbevrachter of eigenaar voornemens is het zeeschip in
      het vlagregister van dat land te laten inschrijven en, voor zover van overeenkomstige toepassing, voldaan
      wordt aan de [artikelen 7, onderdelen c, d, e, f en g][ref1], onderscheidenlijk [8][ref2], [9][ref3] en
      [10, onderdelen c en d][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0048148#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0048148#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0048148#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0048148#Artikel10
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0048148
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0048148
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0048148
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0048148
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 21.1.b
    text: |-
      een buitengewone zeebrief af, indien het een zeeschip betreft dat in het desbetreffende land voor rekening van
      een niet aldaar woonachtige natuurlijke persoon of van een rechtspersoon wiens hoofdvestiging buiten dat land is
      gelegen, is gebouwd, verbouwd of uitgerust, of
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel21
  - number: 21.1.c
    text: een bijzondere zeebrief af, mits voldaan wordt aan de voorwaarden, bedoeld in het zesde lid.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel21
  - number: '21.2'
    text: |-
      Door afgifte van een zeebrief als bedoeld in het eerste lid, onderdelen a, b of c, verkrijgt het zeeschip voor de
      in die zeebrief genoemde periode de nationaliteit van het Koninkrijk.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel21
  - number: '21.3'
    text: |-
      De voorlopige zeebrief, bedoeld in het eerste lid, onderdeel a, wordt afgegeven voor een periode van ten hoogste
      zes maanden. De geldigheidsduur van deze zeebrief wordt niet verlengd.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel21
  - number: '21.4'
    text: |-
      De buitengewone zeebrief, bedoeld in het eerste lid, onderdeel b, geldt voor reizen naar één haven van bestemming
      en wordt slechts afgegeven ten behoeve van de proefvaart, alsmede voor de tijd die nodig is om het zeeschip
      rechtstreeks naar de door de aanvrager op te geven haven van zijn bestemming te voeren.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel21
  - number: '21.5'
    text: |-
      De bijzondere zeebrief, bedoeld in het eerste lid, onderdeel c, wordt afgegeven voor een periode van ten hoogste
      vijf jaren.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel21
  - number: '21.6'
    text: 'De voorwaarden, bedoeld in het eerste lid, onderdeel c, zijn:'
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel21
  - number: 21.6.a
    text: |-
      het zeeschip is een passagiersschip met een lengte van minder dan 24 meter, of een vrachtschip kleiner dan 500
      brutoton, als bedoeld in voorschrift I/2 van het SOLAS-verdrag;
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel21
  - number: 21.6.b
    text: de thuishaven van het zeeschip is gelegen in het betreffende land;
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel21
  - number: 21.6.c
    text: 'het zeeschip wordt:'
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel21
  - number: 21.6.c.1°
    text: |-
      voor zover de thuishaven is gelegen in Sint Maarten of de Nederlandse openbare lichamen Sint Eustatius en Saba
      uitsluitend gebruikt voor bestemmingen, gelegen binnen het deel van het Caribisch gebied dat begrensd wordt door
      Anguilla en Montserrat;
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel21
  - number: 21.6.c.2°
    text: |-
      voor zover de thuishaven is gelegen in Curaçao, Aruba of het Nederlandse openbaar lichaam Bonaire uitsluitend
      gebruikt voor bestemmingen, gelegen binnen het deel van het Caribisch gebied dat begrensd wordt door Aruba,
      Venezuela en Bonaire;
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel21
  - number: 21.6.d
    text: |-
      het zeeschip wordt uitsluitend gebruikt voor kustvaart, die plaatsvindt binnen 30 zeemijl vanaf een haven in het
      gebied, bedoeld in onderdeel c, onder 1° of 2°;
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel21
  - number: 21.6.e
    text: |-
      [artikel 7, onderdelen c, d, e, f en g][ref1], onderscheidenlijk [8][ref2] en [10, onderdelen c en d][ref3], zijn
      van overeenkomstige toepassing;


      [ref1]: https://wetten.overheid.nl/BWBR0048148#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0048148#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0048148#Artikel10
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0048148
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0048148
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0048148
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 21.6.f
    text: op de bijzondere zeebrief worden de havens van bestemming vermeld.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel21
  - number: '21.7'
    text: Onze Minister wie het aangaat kan nadere regels stellen ter uitvoering van het derde en zesde lid.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel21
  - number: '21.8'
    text: |-
      De [artikelen 5, eerste lid, onderdelen a tot en met d][ref1], [17][ref2] en [19][ref3] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0048148#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0048148#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0048148#Artikel19
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0048148
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0048148
        artikel: '17'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0048148
        artikel: '19'
        hoofdstuk: '3'
  - number: '21.9'
    text: |-
      De [artikelen 12][ref1] en [13][ref2] zijn van toepassing met dien verstande dat door Onze Minister wie het
      aangaat in de daar bedoelde gevallen de voorlopige, buitengewone of bijzondere zeebrief wordt, onderscheidenlijk
      kan worden geweigerd, onderscheidenlijk ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0048148#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0048148#Artikel13
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0048148
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0048148
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '21.10'
    text: |-
      Een zeeschip verliest de nationaliteit van het Koninkrijk door intrekking of verstrijking van de geldigheidsduur
      van een voorlopige, buitengewone of bijzondere zeebrief, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel21
  - number: '22'
    text: 'Met het toezicht op de naleving van het bepaalde bij of krachtens deze rijkswet zijn belast:'
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel22
  - number: 22.a
    text: 'in Nederland: de door Onze Minister wie het aangaat aangewezen ambtenaren;'
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel22
  - number: 22.b
    text: 'in Aruba, Curaçao, onderscheidenlijk Sint Maarten: de bij landsbesluit aangewezen ambtenaren.'
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel22
  - number: '23'
    text: |-
      Een ambtenaar als bedoeld in [artikel 22][ref1] is bevoegd afgifte te vorderen van bij of krachtens deze rijkswet
      vereiste documenten die zijn vervallen of ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0048148#Artikel22
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0048148
        artikel: '22'
        hoofdstuk: '4'
  - number: '24'
    text: |-
      In Aruba, Curaçao of Sint Maarten, alsmede in de openbare lichamen Bonaire, Sint Eustatius en Saba verschaft de
      reder, rompbevrachter, diens vertegenwoordiger, of eigenaar ten aanzien van een zeeschip dat in het vlagregister
      is opgenomen desgevraagd onverwijld aan de ambtenaren, bedoeld in [artikel 22][ref1], alle gegevens die zij
      redelijkerwijs behoeven voor de uitoefening van de taken die hen zijn opgedragen bij of krachtens deze rijkswet.


      [ref1]: https://wetten.overheid.nl/BWBR0048148#Artikel22
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0048148
        artikel: '22'
        hoofdstuk: '4'
  - number: '25'
    text: |-
      In Aruba, Curaçao of Sint Maarten, alsmede in de openbare lichamen Bonaire, Sint Eustatius en Saba, is eenieder
      die betrokken is bij de uitvoering van deze rijkswet en daarbij de beschikking krijgt over gegevens waarvan hij het
      vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, en voor wie niet reeds uit hoofde van ambt, beroep
      of wettelijk voorschrift ter zake van die gegevens een geheimhoudingsplicht geldt, verplicht tot geheimhouding
      daarvan, behoudens voor zover enig wettelijk voorschrift hem tot bekendmaking verplicht of uit zijn taak bij de
      uitvoering van dit besluit de noodzaak tot bekendmaking voortvloeit.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel25
  - number: '26.1'
    text: |-
      Bij wet, onderscheidenlijk landsverordening wordt overtreding van de [artikelen 19][ref1], [20][ref2], [23][ref3],
      [24][ref4] en [25][ref5] strafbaar gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0048148#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0048148#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0048148#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0048148#Artikel24
      [ref5]: https://wetten.overheid.nl/BWBR0048148#Artikel25
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0048148
        artikel: '19'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0048148
        artikel: '20'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0048148
        artikel: '23'
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0048148
        artikel: '24'
        hoofdstuk: '4'
      - id: ref5
        bwb_id: BWBR0048148
        artikel: '25'
        hoofdstuk: '4'
  - number: '26.2'
    text: |-
      Bij wet, onderscheidenlijk landsverordening wordt geregeld de mogelijkheid voorziening te vragen tegen de op grond
      van deze rijkswet genomen besluiten. In de wet, onderscheidenlijk landsverordening kunnen regels worden gesteld
      omtrent een verzoek om voorlopige voorziening en de opschorting van de werking van een besluit op grond van de
      [artikelen 12][ref1] en [13][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0048148#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0048148#Artikel13
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0048148
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0048148
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '26.3'
    text: |-
      Ten behoeve van een behoorlijk en zorgvuldig beheer van het vlagregister en adequaat toezicht op in het
      vlagregister ingeschreven zeeschepen worden persoonsgegevens verwerkt met inachtneming van de toepasselijke
      landswetgeving. Onze Ministers wie het aangaat zijn verantwoordelijk voor deze verwerking.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel26
  - number: '27'
    text: De landen nemen bij hun wetgeving en bestuur de bepalingen van deze rijkswet in acht.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel27
  - number: '28.1'
    text: |-
      Een zeeschip dat op het tijdstip van inwerkingtreding van deze rijkswet voorzien is van een geldige zeebrief als
      bedoeld in [artikel 4][ref1] of [4a van de Zeebrievenwet][ref2] wordt ambtshalve ingeschreven in het vlagregister,
      bedoeld in [artikel 3, eerste lid][ref3], van Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0001933#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0001933#Artikel4a
      [ref3]: https://wetten.overheid.nl/BWBR0048148#Artikel3
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0001933
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0001933
        artikel: 4a
      - id: ref3
        bwb_id: BWBR0048148
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '28.2'
    text: |-
      Een zeeschip dat op het tijdstip van inwerkingtreding van deze rijkswet voorzien is van een geldige zeebrief als
      bedoeld in [artikel 15, eerste lid, van het Zeebrievenbesluit van Curaçao en Sint Maarten][ref1] wordt ambtshalve
      ingeschreven in het vlagregister, bedoeld in [artikel 3, eerste lid][ref2], van:


      [ref1]: https://wetten.overheid.nl/BWBR0005943#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0048148#Artikel3
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel28
    references:
