        bwb_id: BWBR0005943
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0048148
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 28.2.a
    text: Curaçao, indien het zeeschip in dat land te boek staat;
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel28
  - number: 28.2.b
    text: Sint Maarten, indien het zeeschip in dat land te boek staat.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel28
  - number: '28.3'
    text: |-
      Een zeeschip dat op het tijdstip van inwerkingtreding van deze rijkswet voorzien is van een geldige zeebrief als
      bedoeld in artikel 6, eerste lid, van het Curaçaosch Zeebrievenbesluit 1933 wordt ambtshalve ingeschreven in het
      vlagregister, bedoeld in [artikel 3, eerste lid][ref1], van Aruba.


      [ref1]: https://wetten.overheid.nl/BWBR0048148#Artikel3
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel28
    references:
