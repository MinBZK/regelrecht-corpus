        bwb_id: BWBR0048148
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '29'
    text: |-
      Een op grond van [artikel 4][ref1] of [4a van de Zeebrievenwet][ref2], artikel 6,
      eerste lid, van het Curaçaosch Zeebrievenbesluit 1933, onderscheidenlijk
      [artikel 15, eerste lid, van het Zeebrievenbesluit van Curaçao en Sint Maarten][ref3] afgegeven zeebrief, die
      gold onmiddellijk voor het tijdstip van inwerkingtreding van deze rijkswet, geldt als een zeebrief afgegeven op
      grond van deze rijkswet.


      [ref1]: https://wetten.overheid.nl/BWBR0001933#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0001933#Artikel4a
      [ref3]: https://wetten.overheid.nl/BWBR0005943#Artikel15
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0001933
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0001933
        artikel: 4a
      - id: ref3
        bwb_id: BWBR0005943
        artikel: '15'
  - number: '30'
    text: |-
      Een aanvraag als bedoeld in [artikelen 311a, eerste lid, van het Wetboek van Koophandel][ref1],
      [artikel 4 van de Wet nationaliteit zeeschepen in rompbevrachting][ref2], artikel 9
      van het Curaçaosch Zeebrievenbesluit 1933, onderscheidenlijk de [artikelen 2][ref3] of
      [8 van het Zeebrievenbesluit van Curaçao en Sint Maarten][ref4], waarover op het tijdstip van inwerkingtreding
      van deze rijkswet nog geen besluit is genomen, wordt vanaf dat tijdstip aangemerkt als een aanvraag als bedoeld in
      [artikel 6][ref5] van deze rijkswet.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel311a
      [ref2]: https://wetten.overheid.nl/BWBR0005681#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005943#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0005943#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0048148#Artikel6
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel30
