        paragraaf: '2'
  - number: '31.1'
    text: |-
      Een wijziging van de in deze rijkswet genoemde bepalingen van het SOLAS-verdrag gaat, tenzij bij besluit van Onze
      Minister van Infrastructuur en Waterstaat anders is bepaald, voor de toepassing van de regels bij of krachtens deze
      rijkswet gelden met ingang van de dag waarop de betrokken wijziging van het SOLAS-verdrag internationaal in werking
      treedt.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel31
  - number: '31.2'
    text: |-
      Voor zover een wijziging als bedoeld in het eerste lid slechts geldt ten aanzien van schepen gebouwd op of na een
      bepaalde datum, blijft, tenzij bij besluit van Onze Minister van Infrastructuur en Waterstaat anders is bepaald, op
      schepen gebouwd voor die datum het SOLAS-verdrag zoals dat voor die wijziging luidde, van toepassing.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel31
  - number: '31.3'
    text: |-
      Een besluit van Onze Minister van Infrastructuur en Waterstaat als bedoeld in het eerste of tweede lid wordt
      genomen in overeenstemming met de ministers, verantwoordelijk voor de registratie en nationaliteitsverlening aan
      zeeschepen in Aruba, Curaçao en Sint Maarten, en wordt bekendgemaakt in de Staatscourant, de Landscourant van
      Aruba, de Landscourant van Curaçao en de Landscourant van Sint Maarten.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel31
  - number: '34'
    text: |-
      Het [Zeebrievenbesluit van Curaçao en Sint Maarten][ref1] alsmede het Curaçaosch Zeebrievenbesluit 1933 worden
      ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0005943
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005943
  - number: '35'
    text: |-
      Deze rijkswet treedt in werking op een bij koninklijk rijksbesluit te bepalen tijdstip dat voor de verschillende
      artikelen of onderdelen daarvan, alsmede voor de verschillende landen van het Koninkrijk verschillend kan worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel35
  - number: '36'
    text: 'Deze rijkswet wordt aangehaald als: Rijkswet nationaliteit zeeschepen.'
    url: https://wetten.overheid.nl/BWBR0048148/2025-07-01#Artikel36
