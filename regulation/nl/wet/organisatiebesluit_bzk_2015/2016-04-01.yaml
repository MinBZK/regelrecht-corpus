  - number: '13'
    text: |-
      1 De Dienst Concernstaf en Bedrijfsvoering staat onder leiding van een hoofddirecteur.

      2 De Dienst heeft de volgende taken:

      a. de concernsturing en de strategische advisering van de Bestuursraad;

      b. de dienstverlening en vakinhoudelijke advisering ten behoeve van het beleid van de bedrijfsvoering;

      c. de ondersteuning en het beheer van de bedrijfsprocessen.

      3 De Dienst bestaat uit de volgende organisatieonderdelen:

      a. het bureau Dienst Concernstaf en Bedrijfsvoering (bDCB);

      b. het bureau Regie Bedrijfsvoering BZK (bRB);

      c. de directie Bestuursondersteuning (BO);

      d. de directie Financieel-economische Zaken (FEZ);

      e. de directie Constitutionele Zaken en Wetgeving (CZW);

      f. de directie Communicatie (C);

      g. de directie Personeel en Organisatie (PO);

      h. het gemeenschappelijk secretariaat van de Raad voor het openbaar bestuur (sRob) en de Raad voor de financiële
      verhoudingen (sRfv).

      4 De directeur Financieel-economische Zaken bekleedt de functie van coördinerend directeur Inkoop (CDI). Deze is
      verantwoordelijk voor:

      a. het stellen van kaders voor het inkoopbeleid van het Ministerie;

      b. de coördinatie van de inkoopfunctie en het contractbeheer van het Ministerie;

      c. de centrale ondersteuning en advisering bij inkoopvraagstukken.

      5 De directeur Bestuursondersteuning bekleedt de functie van departementale Chief Information Officer (CIO). Deze
      is verantwoordelijk voor:

      a. het opstellen en coördineren van de departementale strategie en visie op de informatievoorziening voor
      bedrijfsvoering en beleid;

      b. het adviseren over risicobeheersing op het gebied van ICT en bij projecten of programma’s met een belangrijke
      ICT-component;

      c. het toezicht houden op en handhaven van de kaderstelling op de informatievoorziening en ICT binnen
      bedrijfsvoering en beleid;

      d. het volgen en vertalen van ICT-ontwikkelingen voor het Ministerie.
    url: https://wetten.overheid.nl/BWBR0036945/2016-04-01#Artikel13
  - number: '14'
    text: |-
      1 Het Bureau Digitale Overheid staat onder leiding van de Nationaal Commissaris Digitale Overheid.

      2 Het Bureau Digitale Overheid ondersteunt de Nationaal Commissaris Digitale Overheid bij zijn taak.

      3 Het Bureau Digitale Overheid is in beheersmatige zin ondergebracht bij de secretaris-generaal.
    url: https://wetten.overheid.nl/BWBR0036945/2016-04-01#Artikel14
  - number: '15'
    text: |-
      1 De Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt
      de inrichting van de organisatie vast conform het bepaalde in
      [artikel 3, tweede lid, van het Coördinatiebesluit organisatie en bedrijfsvoering rijksdienst 2011][ref1].

      2 De secretaris-generaal is bevoegd tot het nader vaststellen van de inrichting van de onder de directoraten-
      generaal, het Bureau Algemene Bestuursdienst en de Dienst Concernstaf en Bedrijfsvoering ressorterende
      organisatieonderdelen, na advisering door de directeur Personeel en Organisatie. De secretaris-generaal is bevoegd
      tot het nader vaststellen van de inrichting van de Algemene Inlichtingen- en Veiligheidsdienst op voordracht van de
      directeur-generaal van de Algemene Inlichtingen- en Veiligheidsdienst en na advisering door de directeur Personeel
      en Organisatie.

      3 De directeuren-generaal stellen met inachtneming van dit besluit ten behoeve van hun dienst- of
      organisatieonderdelen periodiek een capaciteitsplan vast.


      [ref1]: https://wetten.overheid.nl/BWBR0029514#Artikel3
    url: https://wetten.overheid.nl/BWBR0036945/2016-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0029514
        artikel: '3'
  - number: '16'
    text: |-
      1 Tot de taak van de directoraten-generaal, het bureau Algemene Bestuursdienst en de dienst Concernstaf
      en Bedrijfsvoering, behoort voorts de uitvoering van andere taken dan hiervoor genoemd, in opdracht van de
      bewindspersonen of de secretaris-generaal, voor zover hogere wet- en regelgeving zich daartegen niet verzet.

      2 Tot de taak van de in dit besluit genoemde organisatieonderdelen, ressorterend onder de dienstonderdelen genoemd
      in het eerste lid, behoort voorts de uitvoering van andere taken dan vermeld, in opdracht van de bewindspersonen,
      de secretaris-generaal of het diensthoofd, voor zover hogere wet- en regelgeving zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0036945/2016-04-01#Artikel16
  - number: '17'
    text: |-
      1 De directeur Personeel en Organisatie is belast met het beheer van dit besluit.

      2 De secretaris-generaal, de directeuren-generaal, en de hoofddirecteur van de Dienst Concernstaf en
      Bedrijfsvoering, ieder voor zover het hen aangaat, zijn verantwoordelijk voor een juiste, volledige en tijdige
      aanlevering aan de directeur Personeel en Organisatie van de gegevens die een goed beheer van dit besluit mogelijk
      maken.

      3 Het beheer en de aanlevering van gegevens geschieden met inachtneming van de desbetreffende (richtlijnen inzake)
      administratieve organisatiebeschrijvingen.
    url: https://wetten.overheid.nl/BWBR0036945/2016-04-01#Artikel17
  - number: '18'
    text: |-
      Wijziging van dit besluit is voorbehouden aan de Minister van Binnenlandse Zaken en Koninkrijksrelaties in
      overeenstemming met de Minister voor Wonen en Rijksdienst, en geschiedt op voordracht van de directeur Personeel
      en Organisatie.
    url: https://wetten.overheid.nl/BWBR0036945/2016-04-01#Artikel18
  - number: '19'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin het wordt
      geplaatst en werkt terug tot en met 1 juli 2015.
    url: https://wetten.overheid.nl/BWBR0036945/2016-04-01#Artikel19
  - number: '20'
    text: 'Dit besluit wordt aangehaald als: Organisatiebesluit BZK 2015.'
    url: https://wetten.overheid.nl/BWBR0036945/2016-04-01#Artikel20
  - number: '21'
    text: |-
      Het [Organisatiebesluit BZK 2012][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0031833
