  - number: '4'
    text: |-
      1 Er is een Audit Committee (AC).

      2 Het Audit Committee bestaat uit de secretaris-generaal, de directeur-generaal Organisatie en Bedrijfsvoering Rijk
      en daarnaast uit ten minste twee externe leden.

      3 De betrokken directeur Auditdienst Rijk en de betrokken directeur Financieel-economische Zaken ondersteunen het
      Audit Committee als deskundigen bij zijn advisering van het departementale management.

      4 Het Audit Committee staat onder voorzitterschap van één van de externe leden.

      5 Een vertegenwoordiger van de Algemene Rekenkamer is agendalid.

      6 Het Audit Committee vergadert ten minste vier maal per jaar.

      7 De overige functionarissen van het Ministerie kunnen verzocht worden onderdelen van de vergadering bij te wonen
      door de voorzitter van het Audit Committee dan wel door de secretaris-generaal.

      8 Al hetgeen in de vergaderingen aan de orde komt is vertrouwelijk, voor zover niet anders is besloten of indien
      bij wettelijk voorschrift anders is bepaald.

      9 De directeur Financieel-economische Zaken voert het secretariaat van het Audit Committee.

      10 Het Audit Committee regelt de eigen werkwijze en legt dit vast in het huishoudelijk reglement.
    url: https://wetten.overheid.nl/BWBR0036945/2016-04-01#Artikel4
  - number: '5'
    text: |-
      1 De Algemene Leiding berust bij de secretaris-generaal.

      2 De secretaris-generaal is belast met de ambtelijke leiding van het Ministerie. Tot deze taak behoort in ieder
      geval:

      a. het informeren en adviseren van de bewindspersonen over aangelegenheden, de bewindspersonen of het Ministerie
      betreffende;

      b. het zorgdragen voor de coördinatie en integratie van beleidsvoorbereiding, beleidsontwikkeling en
      beleidsuitvoering binnen het Ministerie;

      c. het uitoefenen van de algemene controlfunctie bij het Ministerie;

      d. het rechtstreeks leiding geven aan de directeuren-generaal en de hoofddirecteur van de Dienst Concernstaf en
      Bedrijfsvoering;

      e. het voorzitterschap van de Bestuursraad;

      f. het zorgdragen voor het nemen van besluiten over en het geven van algemene aanwijzingen ten aanzien van het
      algemene beleid en beheer inzake de bedrijfsvoering en de formatie van het Ministerie;

      g. het voeren van overleg met de Groepsondernemingsraad (als bestuurder in de zin van de WOR) en de centrales van
      verenigingen van ambtenaren, bedoeld in [artikel 113 van het Algemeen Rijksambtenarenreglement][ref1];

      h. het optreden als gemachtigd ambtenaar in de zin van de Uitvoeringsregeling openbaarheid van bestuur Binnenlandse
      Zaken;

      i. het plegen van inhoudelijke afstemming met het gemeenschappelijke secretariaat van de Raad voor het openbaar
      bestuur en de Raad voor de financiële verhoudingen (sRob/Rfv);

      j. het toezicht op het beheer van de Kiesraad (KR) en toezicht op het Bureau Architectenregister;

      k. het beheersmatig aansturen van de kabinetten van de Gouverneurs en de Rijksvertegenwoordiger voor de openbare
      lichamen Bonaire, Sint Eustatius en Saba;

      l. het beheersmatig en inhoudelijk aansturen van de Rijksdienst Caribisch Nederland;

      m. het nemen van besluiten met betrekking tot de toepassing van uitzonderingen op de aanbestedingsregelgeving.

      3 De secretaris-generaal is niet belast met de inhoudelijke leiding van het in
      [artikel 2, eerste lid, onder j][ref2], genoemde organisatieonderdeel.

      4 De in het tweede lid, onder i, genoemde organisatieonderdelen vallen onder beheersmatige leiding van de
      hoofddirecteur van de Dienst Concernstaf en Bedrijfsvoering.


