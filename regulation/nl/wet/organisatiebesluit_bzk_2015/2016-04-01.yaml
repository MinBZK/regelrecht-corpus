  - number: '3'
    text: |-
      1 Er is een Bestuursraad Binnenlandse Zaken en Koninkrijksrelaties (BR).

      2 De Bestuursraad is samengesteld uit de secretaris-generaal, de directeuren-generaal Organisatie
      en Bedrijfsvoering Rijk, Bestuur en Koninkrijksrelaties, Algemene Bestuursdienst, Wonen en Bouwen,
      Rijksvastgoedbedrijf, Algemene Inlichtingen- en Veiligheidsdienst en de hoofddirecteur Dienst Concernstaf en
      Bedrijfsvoering. De leden kunnen zich incidenteel laten vervangen door hun plaatsvervangers of, in uitzonderlijke
      gevallen, door een andere rechtstreeks onder hen ressorterende functionaris. De directeur Financieel-economische
      Zaken heeft een permanente uitnodiging tot het als adviseur bijwonen van de Bestuursraad.

      3 Het overleg in de Bestuursraad heeft, onverminderd het bepaalde in de departementale mandaat- en
      volmachtbesluiten over de bevoegdheden van de afzonderlijke leden van de Bestuursraad ten aanzien van de
      onderwerpen die in het overleg aan de orde komen, ten doel het bespreken en het bereiken van overeenstemming over
      de departementale beleids- en beheerskaders en het toezien op de uitvoering van deze kaders.

      4 Daarnaast heeft de Bestuursraad tot doel het bespreken en het bereiken van overeenstemming over aspecten van het
      departementale personeelsbeleid en personele aangelegenheden alsmede het toezien op de uitvoering hiervan. In het
      overleg komen in ieder geval de volgende aangelegenheden aan de orde:

      a. de ontwikkeling van het departementale HRM-beleid in brede zin;

      b. de beleidsontwikkeling van management-development bij het Ministerie;

      c. de benoeming van kandidaten bij het Ministerie in vacatures opengesteld door de Algemene Bestuursdienst;

      d. de werkzaamheden van de Bestuursraad met betrekking tot de personeelsschouw, zoals aangegeven in het
      departementale beleid ter zake.

      5 Al hetgeen in de vergaderingen aan de orde komt is vertrouwelijk, voor zover niet anders is besloten of indien
      bij wettelijk voorschrift anders is bepaald.

      6 De directeur Bestuursondersteuning voert het secretariaat van de Bestuursraad.

      7 De directeur Personeel en Organisatie voert het secretariaat van de bespreking van het departementale
      personeelsbeleid.
