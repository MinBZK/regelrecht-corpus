      1 Het directoraat-generaal Bestuur en Koninkrijksrelaties staat onder leiding van een directeur-generaal.

      2 Het directoraat-generaal draagt zorg voor het bestuurlijk en ambtelijk functioneren van de publieke sector
      in Nederland en voor de handhaving en uitvoering van het Statuut voor het Koninkrijk der Nederlanden, door het
      uitvoeren van de volgende taken:

      a. het bevorderen van een doelmatig, doeltreffend en democratisch openbaar bestuur, waaronder begrepen de relaties
      met de overige onderdelen van het Koninkrijk, de Europese Unie en andere internationale instellingen;

      b. het zorgdragen voor een goede en adequate organisatie met betrekking tot het Nederlandse openbaar bestuur,
      onder andere met betrekking tot de financiën van gemeenten en provincies (het Gemeentefonds, BES-fonds en het
      Provinciefonds);

      c. het in overleg met de overige ministeries zorgdragen voor goede interbestuurlijke relaties, beredeneerd vanuit
      de eigenstandige positie van provincies en gemeenten;

      d. het zorgdragen voor de kwaliteit, integriteit, diversiteit en veiligheid van het overheidpersoneel;

      e. het ontwikkelen van een adequate dienstverlening en vermindering van regeldruk;

      f. het zorgdragen voor een goede identiteitsinfrastructuur, onder meer door het beheer van de stelsels van de
      basisregistratie personen (BRP), de persoonsinformatievoorziening in de Caribische delen van het Koninkrijk (PIVA),
      het burgerservicenummer (BSN) en de reisdocumenten met de bijbehorende reisdocumentenregistraties;

      g. het zorgdragen voor goede relaties met en coördinatie van de samenwerking met Caribisch Nederland, Curaçao,
      Aruba en Sint Maarten;

      h. het verlenen van brede (bedrijfsvoerings)dienstverlening en/of -capaciteit aan (het primaire proces) van de
      departementale units alsmede politie en brandweer in Caribisch Nederland;

      i. het ter beschikking stellen van mensen en middelen aan de Hoge Raad van Adel en het College Financieel Toezicht
      Curaçao en Sint Maarten onderscheidenlijk het College Financieel Toezicht Bonaire, Sint Eustatius en Saba;

      j. het nemen van besluiten en treffen van handelingen ter uitvoering van de Wet raadgevend referendum.

      3 Het directoraat-generaal bestaat uit de volgende organisatieonderdelen:

      a. het bureau Directeur-generaal Bestuur en Koninkrijksrelaties (bDGBK);

      b. het bureau Verkenningen en Onderzoek (BVO);

      c. de directie Bestuur, Democratie en Financiën (BDF);

      d. de directie Arbeidszaken Publieke Sector (APS);

      e. de directie Burgerschap en Informatiebeleid (BI);

      f. de directie Koninkrijksrelaties (KR);

      g. de Rijksdienst Caribisch Nederland (RCN);

      h. de baten-lastendienst Rijksdienst voor Identiteitsgegevens (RvIG);

      i. het secretariaat van het College Financieel Toezicht Curaçao en Sint Maarten onderscheidenlijk het College
      Financieel Toezicht Bonaire, Sint Eustatius en Saba.

      4 De directie Koninkrijksrelaties wordt beleidsinhoudelijk en beheersmatig aangestuurd door de secretaris-generaal.
    url: https://wetten.overheid.nl/BWBR0036945/2016-04-01#Artikel7
  - number: '8'
    text: |-
      1 Het directoraat-generaal Wonen en Bouwen staat onder leiding van een directeur-generaal.

      2 Het directoraat-generaal draagt zorg voor:

      a. een functionerende woningmarkt met aandacht voor keuzevrijheid en betaalbaarheid;

      b. betaalbare woningen voor lagere inkomensgroepen, de aansluiting op de woningmarkt van bijzondere
      aandachtsgroepen;

      c. het bevorderen dat woningcorporaties het publiek belang behartigen en het waarborgen van een goed werkend
      corporatiestelsel;

      d. het garanderen van een minimum bouwtechnische kwaliteit en gebruikskwaliteit van bouwwerken;

      e. het bevorderen van het tot stand komen van voldoende woningen en de kwaliteit daarvan en het ontwikkelen van
      beleid op het gebied van energiebesparing in de gebouwde omgeving;

      f. invulling geven aan de rijksverantwoordelijkheid voor de leefbaarheid in Nederland door lokale partijen te
      stimuleren en ondersteunen bij het integraal versterken van de leefbaarheid in buurten, wijken en regio’s;

      g. het door middel van kennis onderbouwen en verantwoorden van beleid op het gebied van Wonen en Bouwen.

      3 Het directoraat-generaal bestaat uit de volgende organisatieonderdelen:

      a. het bureau Directeur-generaal Wonen en Bouwen (bDGWB);

      b. de directie Bouwen (Bw);

      c. de directie Woningmarkt (Wm);

      d. de directie Kennis en Verkenningen (K&V);

      e. de directie Woon- en Leefomgeving (W&L).
    url: https://wetten.overheid.nl/BWBR0036945/2016-04-01#Artikel8
  - number: '9'
    text: |-
      1 Het Rijksvastgoedbedrijf staat onder leiding van een directeur-generaal.

      2 Het Rijksvastgoedbedrijf draagt zorg voor:

      a. het verwerven en ter beschikking stellen van vastgoed aan onderdelen van de Rijksoverheid;

      b. het efficiënt beheren, onderhouden en gebruiken van een uitgebalanceerde Rijksvastgoedportefeuille;

      c. de transformatie en het afstoten van overtollig Rijksvastgoed;

      d. het genereren van inkomsten met Rijksvastgoed, indien (wettelijk) mogelijk.

      3 Het Rijksvastgoedbedrijf bestaat uit de volgende organisatieonderdelen:

      a. het bureau directeur-generaal Rijksvastgoedbedrijf (bDGRVB);

      b. de directie Portefeuillestrategie & Portefeuillemanagement (P&P);

      c. de directie Transacties & Ontwikkeling (T&O);

      d. de directie Vastgoedbeheer (VB);

      e. de directie Financiën (FIN);

      f. de directie Bestuur en Bedrijfsvoering (B&B);

      g. het Atelier Rijksbouwmeester (ARbm).
    url: https://wetten.overheid.nl/BWBR0036945/2016-04-01#Artikel9
  - number: 9a
    text: |-
      1 De directeur-generaal Rijksvastgoedbedrijf geeft leiding aan de uitvoeringsorganisaties.

      2 De uitvoeringsorganisaties dragen zorg voor het uitvoeren van rijksbrede voorzieningen op het terrein van de
      bedrijfsvoering

      3 De uitvoeringsorganisaties bedoeld in het eerste lid betreffen de volgende organisatieonderdelen:

      a. de baten-lastendienst Shared Service Centrum ICT Haaglanden (SSC-ICT Haaglanden);

      b. de baten-lastendienst P-Direkt (P-Direkt);

      c. de baten-lastendienst Uitvoeringsorganisatie Bedrijfsvoering Rijk (UBR);

      d. de directie Doc-Direkt (D-Direkt);

      e. de baten-lastendienst FM-Haaglanden (FMH).
    url: https://wetten.overheid.nl/BWBR0036945/2016-04-01#Artikel9a
  - number: '10'
    text: |-
      1 De Dienst van de Huurcommissie staat onder leiding van het bestuur van de Huurcommissie bedoeld in de
      Uitvoeringswet huurprijzen woonruimte.

      2 De Dienst van de Huurcommissie heeft de taken bedoeld in de [artikelen 4][ref1], [4a][ref2] en
      [5 van de Uitvoeringswet huurprijzen woonruimte][ref3].

      3 De Dienst van de Huurcommissie is als baten-lastendienst in beheersmatige zin ondergebracht bij het directoraat-
      generaal Wonen en Bouwen.


