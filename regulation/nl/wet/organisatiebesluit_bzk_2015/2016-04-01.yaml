preamble:
  text: |-
    Gelet op artikel 3, tweede lid, van het Coördinatiebesluit organisatie en bedrijfsvoering rijksdienst 2011;

    besluit

    vast te stellen het navolgende Organisatiebesluit:
  url: https://wetten.overheid.nl/BWBR0036945/2016-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. *Ministerie:* Ministerie van Binnenlandse Zaken en Koninkrijksrelaties;

      b. *bewindspersonen:* Minister van Binnenlandse Zaken en Koninkrijksrelaties en Minister voor Wonen en Rijksdienst;

      c. *capaciteitsplan:* schriftelijk stuk waarin de uitwerking van de flexibele organisatiestructuur van een
      dienstonderdeel periodiek wordt vastgelegd evenals de verdeling van de formatie binnen deze structuur.
    url: https://wetten.overheid.nl/BWBR0036945/2016-04-01#Artikel1
  - number: '2'
    text: |-
      1 De hoofdstructuur van het Ministerie bestaat uit de volgende dienstonderdelen:

      a. de Algemene Leiding (ALGL);

      b. het directoraat-generaal Organisatie en Bedrijfsvoering Rijk (DGOBR);

      c. het directoraat-generaal Bestuur en Koninkrijksrelaties (DGBK);

      d. het directoraat-generaal Wonen en Bouwen (DGWB);

      e. het Rijksvastgoedbedrijf (RVB);

      f. de baten-lastendienst Dienst van de Huurcommissie (DHC);

      g. de Algemene Inlichtingen- en Veiligheidsdienst (AIVD);

      h. het Bureau Algemene Bestuursdienst (BABD);

      i. de Dienst Concernstaf en Bedrijfsvoering (DCB);

      j. het Bureau Digitale Overheid.

      2 De dienstonderdelen bestaan uit organisatieonderdelen waarvan de inrichting nader kan worden beschreven op een
      wijze als bedoeld in [artikel 15, tweede lid][ref1].

      3 De in het eerste lid, onder a, c, g, i en j, genoemde dienstonderdelen ressorteren onder de Minister van
      Binnenlandse Zaken en Koninkrijksrelaties.

      4 De in het eerste lid, onder b, d, e, f en h, genoemde dienstonderdelen ressorteren wat betreft beleid en
      uitvoering onder de Minister voor Wonen en Rijksdienst.

      5 De secretaris-generaal geeft rechtstreeks leiding aan de leidinggevende functionarissen van de dienstonderdelen,
      genoemd in het eerste lid, met uitzondering van de baten-lastendienst Dienst van de Huurcommissie die ressorteert
      onder het bestuur van de Huurcommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0036945#Artikel15
