      1 De Algemene Inlichtingen- en Veiligheidsdienst staat onder leiding van een directeur-generaal en een
      plaatsvervangend directeur-generaal.

      2 De Algemene Inlichtingen- en Veiligheidsdienst heeft de taken, bedoeld in
      [artikel 6 van de Wet op de inlichtingen- en veiligheidsdiensten 2002][ref1].

      3 De Algemene Inlichtingen- en Veiligheidsdienst bestaat uit de volgende organisatieonderdelen:

      a. de Directie Inlichtingen;

      b. de Directie Operatiën;

      c. de Directie Veiligheidsonderzoeken & Bedrijfsvoering;

      d. de Centrale Staf.

      4 De Centrale Staf staat onder leiding van de plaatsvervangend directeur-generaal.


