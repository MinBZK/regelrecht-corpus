articles:
  - number: '1'
    text: |-
      1 De Minister van Onderwijs, Cultuur en Wetenschap en de Minister voor Basis- en Voortgezet Onderwijs en Media
      kunnen bepalingen in de door hen vastgestelde subsidieregelingen buiten toepassing laten of daarvan afwijken,
      indien de onverkorte toepassing van deze bepalingen, gelet op de gevolgen van de uitbraak van COVID-19 of de
      maatregelen ter bestrijding ervan voor subsidieaanvragers of subsidieontvangers zou leiden tot een onbillijkheid
      van overwegende aard.

      2 Voor subsidieregelingen die volledig of mede zijn gebaseerd op de [artikelen 7.1][ref1], [7.3][ref2] of
      [7.7 van de Erfgoedwet][ref3], is het eerste lid alleen van toepassing voor zover het gaat om indieningsvereisten,
      verbonden aan de subsidieaanvraag of de aanvraag om subsidievaststelling, waaraan niet geheel of niet tijdig kan
      worden voldaan als gevolg van de uitbraak van COVID-19 of de maatregelen ter bestrijding ervan.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel7.1
      [ref2]: https://wetten.overheid.nl/BWBR0037521#Artikel7.3
      [ref3]: https://wetten.overheid.nl/BWBR0037521#Artikel7.7
