    text: |-
      Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst en werkt terug ten aanzien van:

      a. [artikel 3, onderdeel A, onder 1][ref1], tot en met 1 januari 2020;

      b. [artikel 3, onderdeel A, onder 2][ref2], en [artikel 5][ref3], tot en met 23 maart 2020; en

      c. [artikel 6][ref4], [artikel 10, onderdeel A][ref5], en [artikel 11, onderdeel A][ref6], tot en met 1 april 2020.


