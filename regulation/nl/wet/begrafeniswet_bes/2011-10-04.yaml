        bwb_id: BWBR0012410
        artikel: 19c
  - number: '5'
    text: |-
      De bewoner van een woning waarin zich een lijk bevindt, is verplicht aan de met de gerechtelijke schouwing of
      het afhalen van het lijk ter begraving of verbranding of het vervoer naar het lijkenhuis belaste personen bij de
      uitvoering van hun taak de benodigde medewerking te verlenen.
    url: https://wetten.overheid.nl/BWBR0028363/2011-10-04#Artikel5
  - number: '6'
    text: |-
      Begraving geschiedt niet eerder dan 36 uren na het overlijden en uiterlijk op de zesde werkdag na die van
      overlijden.

      Ontheffing van deze bepaling kan worden verleend door de gezaghebber de door het bestuurscollege aan te wijzen
      geneeskundige gehoord.

      In dit geval wordt door de gezaghebber onmiddellijk aan den betrokken ambtenaar van den Burgerlijken Stand van zijn
      beschikking kennis gegeven.
    url: https://wetten.overheid.nl/BWBR0028363/2011-10-04#Artikel6
  - number: '7'
    text: |-
      1 Een lijk mag niet worden begraven dan tussen des morgens 6 uur en des namiddags 6 uur, tenzij de ambtenaar van
      de Burgerlijke Stand op grond van dringende of buitengewone omstandigheden in individuele gevallen verlof verleent
      om op een ander uur te begraven. Het verlof wordt steeds verleend wanneer godsdienstige redenen zulks noodzakelijk
      maken en, zo nodig, in de gevallen bedoeld in de [artikelen 2][ref1], [6][ref2] en [8][ref3].

      2 Ingeval in een openbaar lichaam een algemene behoefte bestaat om na zonsondergang lijken te begraven, kan in
      afwijking van het bepaalde in het eerste lid, bij eilandsbesluit houdende algemene maatregelen de mogelijkheid
      daartoe worden geopend. Bij een zodanig besluit worden tevens nadere regelen vastgesteld welke in het belang van de
      openbare orde en volksgezondheid in acht moeten worden genomen bij het begraven na zonsondergang».


      [ref1]: https://wetten.overheid.nl/BWBR0028363#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0028363#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0028363#Artikel8
    url: https://wetten.overheid.nl/BWBR0028363/2011-10-04#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028363
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0028363
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0028363
        artikel: '8'
  - number: '8'
    text: |-
      Opgevischte lijken worden vanwege Gezondheidsdienst van het openbaar lichaam begraven, nadat de doodschouw of, in
      het geval van [artikel 3][ref1], de gerechtelijke schouwing zal hebben plaats gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0028363#Artikel3
    url: https://wetten.overheid.nl/BWBR0028363/2011-10-04#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028363
        artikel: '3'
  - number: '9'
    text: |-
      Tenzij op rechtelijk bevel mogen lijken niet opgegraven en vervoerd worden dan met toestemming, van de gezaghebber,
      de door het bestuurscollege aangewezen geneeskundige gehoord.

      Het vervoer van een opgegraven lijk kan aan nader te stellen voorwaarden verbonden worden, maar het geschiedt niet,
      tenzij de opgegraven lijkkist met zijn inhoud is geplaatst in eene goed gesloten, volkomen dichte houten of metalen
      kist.
    url: https://wetten.overheid.nl/BWBR0028363/2011-10-04#Artikel9
  - number: '10'
    text: |-
      Indien een lijkkist niet op een draagbaar wordt gedragen, moet worden gebruik gemaakt van een uitsluitend voor het
      vervoer van lijken bestemd voertuig.

      In de buitendistricten kan, indien de afstand van sterfhuis tot begraafplaats te groot is, ter beoordeeling van den
      betrokken districtmeester, door hem vergunning worden verleend om het lijk per kar te vervoeren. Deze bepaling is
      echter niet toepasselijk voor het vervoer van lijken van aan besmettelijke ziekten overledenen.

      Het verbod van het eerste lid is niet van kracht voor het vervoer van het lijk van een kind beneden den leeftijd
      van één jaar, dat gemakkelijk door één persoon kan worden gedragen.

      Echter geldt de vrijstelling van het vorig lid niet, indien de ambtnaar van den Burgerlijken Stand het dragen van
      een kinderlijk verboden heeft, ingevolge [art. 11 der Wet verklaringen van overlijden BES][ref1].

      Bij het ter aarde bestellen van lijken worden de desbetreffende bepalingen dezer wet stipt opgevolgd en verder de
      wenken in acht genomen, door de ambtenaren van de gezondheidsdienst van het openbaar lichaam of van de politie, in
      het belang van gezondheid of van orde gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0028199#Artikel11
    url: https://wetten.overheid.nl/BWBR0028363/2011-10-04#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0028199
        artikel: '11'
  - number: '11'
    text: |-
      De naaste bloedverwanten van de overleden persoon of het doodgeboren kind zijn aansprakelijk voor de begrafenis,
      terwijl de erfgenamen aansprakelijk zijn voor de begrafeniskosten.

      De lijken van onvermogenden echter worden, voor zooveel kerk- of armbestuur of andere instellingen daarvoor niet
      zorgen, op kosten van het openbaar lichaam begraven ter plaatse daarvoor door het openbaar gezag aangewezen.

      Van het onvermogen moet blijken op de wijze door het bestuurscollege te bepalen.
    url: https://wetten.overheid.nl/BWBR0028363/2011-10-04#Artikel11
  - number: '12'
    text: |-
      De begrafenis van lijken, welker begraving zich niemand aantrekt, geschiedt door de gezondheidsdienst van
      het openbaar lichaam, komende de kosten daarvan ten last van het openbaar lichaam, voor zoover zij niet op de
      nalatenschap of op de erfgenamen verhaalbaar zijn.»
    url: https://wetten.overheid.nl/BWBR0028363/2011-10-04#Artikel12
  - number: '13'
    text: |-
      Het begraven van lijken van personen overleden in inrichtingen, die hetzij geheel of gedeeltelijk onder beheer
      van het openbaar gezag staan, geschiedt door de zorg van het bestuur dier inrichtingen, met inachtneming van de
      voorschriften daaromtrent bij eilandsbesluit, houdende algemene maatregelen, te geven.

      De kosten dier begrafenissen kunnen, wanneer het sterfgeval plaats had in een inrichting tot ziekenverpleging,
      worden verhaald op dengene, die voor de verpleegkosten van den lijder aansprakelijk is.

      Slechts wanneer ter goede rekening eene daartoe voldoende som is gestort, kan de begrafenis anders geschieden dan
      op de wijze voor onvermogenden gebruikelijk. In elk geval blijft de beslissing omtrent de wijze van begraving,
      wanneer die vanwege de inrichting geschiedt, aan het bestuur der inrichting.

      Tenzij wegens overlijden aan eene besmettelijke ziekte of andere redenen hiertegen met het oog op de openbare
      gezondheid bezwaar bestaat, worden zoodanige lijken aan aanverwanten ter begraving afgegeven, wanneer aanvraag
      daartoe binnen drie uren na het overlijden bij het bestuur der inrichting is ingekomen en naar het oordeel van dat
      bestuur een behoorlijke begrafenis door den aanvrager voldoende gewaarborgd is.

      Geschiedt de aanvraag later, dan kan de afgifte nog geschieden, wanneer daartegen bij het bestuur der inrichting
      geen bezwaar bestaat.
    url: https://wetten.overheid.nl/BWBR0028363/2011-10-04#Artikel13
  - number: '14'
    text: |-
      In ieder openbaar lichaam zullen een of meer algemeene begraafplaatsen worden aangelegd, zoodra zich de behoefte
      daaraan doet gevoelen.
    url: https://wetten.overheid.nl/BWBR0028363/2011-10-04#Artikel14
  - number: '15'
    text: |-
      Bijzondere begraafplaatsen kunnen worden aangelegd met verlof van het bestuurscollege.

      Verlof tot het aanleggen van een bijzondere begraafplaats ten behoeve van de leden eener kerkelijke gemeente wordt
      aan het bestuur dier gemeente niet geweigerd, dan wanneer de aangewezen plaats niet aan de wettelijke voorschriften
      voldoet.
    url: https://wetten.overheid.nl/BWBR0028363/2011-10-04#Artikel15
  - number: '16'
    text: |-
      Elke begraafplaats wordt door een muur, heining, rasterwerk of heg ter hoogte van ten minste twee Meter afgesloten.

      Daarvan kan door het bestuurscollege ontheffing worden verleend, indien op andere wijze in de afsluiting behoorlijk
      is voorzien.
    url: https://wetten.overheid.nl/BWBR0028363/2011-10-04#Artikel16
  - number: '17'
    text: |-
      Zonder vergunning van het bestuurscollege, de door het bestuurscollege aangewezen geneeskundige gehoord, mogen
      geene begraafplaatsen worden aangelegd op een afstand van minder dan 50 Meter van gebouwen tot bewoning dienende of
      bestemd en zonder die vergunning mogen, binnen gelijken afstand van eene begraafplaats, geene gebouwen ter bewoning
      worden opgericht of putten worden gegraven.

      Van dit verbod zijn uitgezonderd: doodgravers-woningen en pastorieën of kostershuizen, ten dienste der
      begraafplaats te stichten.

      Het uitbreiden eener bestaande begraafplaats wordt, voor deze wet, met het aanleggen eener nieuwe begraafplaats
      gelijk gesteld.

      Het verbod in het eerste lid vermeld omtrent het oprichten van gebouwen ter bewoning is niet toepasselijk op het
      oprichten van gebouwen ter bewoning binnen de op 1 September 1918 bestaande bebouwde lijnen.
    url: https://wetten.overheid.nl/BWBR0028363/2011-10-04#Artikel17
  - number: '18'
    text: |-
      Bij de schriftelijke aanvrage om de vergunning, in het [vorig artikel][ref1] bedoeld, wordt eene op schaal
      vervaardigde, nauwkeurige teekening overgelegd van het terrein, tevens aangevende de plaatsen, waar zich woningen
      of putten bevinden, als in het vorig artikel bedoeld.

      Ook wordt de diepte van aarde op het terrein aanwezig aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0028363#Artikel17
    url: https://wetten.overheid.nl/BWBR0028363/2011-10-04#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028363
        artikel: '17'
  - number: '19'
    text: |-
      Eene nieuwe begraafplaats wordt aangelegd naar een in kaart gebracht, vast plan van verdeeling in vakken en rijen,
      waarbij de noodige ruimte voor paden is uitgespaard, terwijl elke ruimte voor graf of grafkelder op de kaart is
      aangegeven.

      Een exemplaar van deze kaart wordt, vóór de ingebruikneming der begraafplaats aan het bestuurscollege gezonden.

      Het bijzetten van lijken moet naar het vastgestelde en in kaart gebrachte plan geschieden.

      Op bestaande begraafplaatsen wordt eene verdeeling, als in het eerste lid bedoeld, zooveel mogelijk gevolgd, maar
      in ieder geval bij het aanleggen van nieuwe vakken, voor begraven bestemd, en bij het ledigen van alle oude graven
      in bestaande vakken.
    url: https://wetten.overheid.nl/BWBR0028363/2011-10-04#Artikel19
  - number: '20'
    text: |-
      Voor elke begraafplaats wordt, hetzij door de zorg van de eigenaars eener particuliere begraafplaats, hetzij
      door of van wege de ambtenaren in [art. 36][ref1] genoemd, nauwkeurig en regelmatig een register bijgehouden,
      bevattende, in afzonderlijke kolommen, een doorloopend nummer, dag en jaar der begraving, naam, voornamen, leeftijd
      en geslacht van de begraven personen, benevens eene duidelijke aanwijzing van het graf of van den grafkelder,
      eventueel der plaats in den grafkelder, waar de bijzetting plaats vond.

      Het hiervoor bedoelde register is openbaar en wordt in het geval [artikel 33][ref2] toepassing vindt overgebracht
      naar de archieven van het openbaar lichaam waarin de begraafplaats was gelegen.

      Graven een grafkelders moeten van duidelijke zichtbare merkpaaltjes of van andere merkteekenen voorzien zijn,
      aangevende het vastgestelde nummer der graven.


      [ref1]: https://wetten.overheid.nl/BWBR0028363#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0028363#Artikel33
    url: https://wetten.overheid.nl/BWBR0028363/2011-10-04#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028363
        artikel: '36'
      - id: ref2
        bwb_id: BWBR0028363
        artikel: '33'
  - number: '21'
    text: |-
      Eene begraafplaats, daaronder begrepen: omheining, gebouwen, graven, grafkelders, monumenten, kruisen, boomen of
      andere gewassen en verder alles wat tot het kerkhof behoort, moet zorgvuldig in goeden staat worden onderhouden.

      Zoonoodig kan het Bestuurscollege op kosten van de eigenaars van particuliere begraafplaatsen, of op kosten van
      de eigenaars van graven en grafkelders, op alle begraafplaatsen de noodige herstellingen en verbeteringen doen
      aanbrengen, indien voornoemde eigenaars in gebreke bleven.
    url: https://wetten.overheid.nl/BWBR0028363/2011-10-04#Artikel21
  - number: '22'
    text: |-
      Op elke nieuwe begraafplaats wordt vóór het in gebruik stellen en op elke bestaande begraafplaats uiterlijk binnen
      één jaar na het in werking treden dezer wet, een lokaal ingericht voor tijdelijke bewaring van lijken.

      Bij verzuim wordt vanwege het bestuurscollege, op kosten van de eigenaars der begraafplaats, ten spoedigste een
      lijkenhuis, als in het vorig lid bedoeld, ingericht.
    url: https://wetten.overheid.nl/BWBR0028363/2011-10-04#Artikel22
  - number: '23'
    text: |-
      De onderlinge afstand der graven zoo aan het hoofd- en het voeteneinde als van de zijden bedraagt minstens 0,3 M.

      De graven zullen ten minste 1 M diep zijn.

      De bovenste of de eenige kist in een graf wordt met eene laag aangestampte aarde van minstens 0,65 M. bedekt.

      Deze bepalingen zijn niet toepasselijk op gemetselde grafkelders.
    url: https://wetten.overheid.nl/BWBR0028363/2011-10-04#Artikel23
  - number: '24'
    text: |-
      Op de begraafplaatsen mogen grafkelders worden gesticht, mits deze voldoen aan de navolgende voorwaarden:

      a. de wanden en het dak worden van stevig steen-materiaal vervaardigd;

      b. de bodem zij bedekt, tot eene hoogte van minstens 30 c.M., met aangestampte aarde en worde licht hellend
      gemaakt;

      c. de wanden van een grafkelder moeten minstens 25 c.M. beneden de bodem-oppervlakte van het kerkhof reiken;

      d. is het onder c. bepaalde niet mogelijk, dan worden de wanden aan de buiten-beneden zijde bedekt met eenen zoom
      van aangestampte aarde van minstens 30 c.M. hoogte en breedte.
    url: https://wetten.overheid.nl/BWBR0028363/2011-10-04#Artikel24
  - number: '25'
    text: |-
      Aan nieuw te bouwen grafkelders kunnen lucht-openingen worden voorgeschreven, wier aantal, plaats, vorm en
      inrichting door het bestuurscollege worden bepaald.
    url: https://wetten.overheid.nl/BWBR0028363/2011-10-04#Artikel25
  - number: '26'
    text: |-
      In een grafkelder moet, voor elke daarin opgenomen lijkkist van een volwassen overledene, eene ruimte van minstens
      2 M3 beschikbaar zijn.

      Eene zelfde ruimte, als in het eerste lid genoemd, kan voor meer dan één kinderlijk worden gebruikt, indien de
      gezamenlijke maat de lijkkisten, die van de lijkkist van een volwassen overledene niet overtreft.
    url: https://wetten.overheid.nl/BWBR0028363/2011-10-04#Artikel26
  - number: '27'
    text: |-
      In een grafkelder mogen twee of meer lijkkisten in één horizontaal vlak worden geplaatst, mits gescheiden door
      lucht- en vochtdichte tusschenmuren, van steen-materiaal, die de geheelde grafruimte verdeelen.
    url: https://wetten.overheid.nl/BWBR0028363/2011-10-04#Artikel27
  - number: '28'
    text: |-
      In een grafkelder mogen twee of meer lijkkisten boven elkander worden gezet, indien de plaats, waar eene lijkkist
      staat, geheel omgeven en aangevuld wordt door vast aangedreven aarde, die de kist minstens 30 c.M. bedekt.

      De scheidende laag aarde in het vorig lid bedoeld, kan vervangen worden door eene lucht- en waterdichte afscheiding
      van steen-materiaal, aansluitende, in grafkelders als in [art. 27][ref1] bedoeld, aan den staanden scheidingsmuur.

      Indien in een grafkelder niet meer dan ééne lijkkist wordt begraven, worde de plaats, waar de lijkkist staat, op de
      wijze, als in het eerste lid bepaald, aangevuld met vast aangedreven aarde, ter dikte van ongeveer 20 c.M.


      [ref1]: https://wetten.overheid.nl/BWBR0028363#Artikel27
    url: https://wetten.overheid.nl/BWBR0028363/2011-10-04#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0028363
        artikel: '27'
  - number: '29'
    text: |-
      Op grafkelders, waarin niet meer wordt begraven, zijn de [artt. 24–28][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028363#Artikel24
    url: https://wetten.overheid.nl/BWBR0028363/2011-10-04#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0028363
        artikel: '24'
  - number: '30'
    text: |-
      Voor het bijzetten van lijken in bestaande grafkelders kan door het bestuurscollege vrijstelling worden verleend
      van het voorschrift van [art. 27][ref1], mits tusschen twee naast elkander geplaatste lijkkisten eene laag vast
      aangedreven aarde van minstens 30 c.M. wordt aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0028363#Artikel27
    url: https://wetten.overheid.nl/BWBR0028363/2011-10-04#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0028363
        artikel: '27'
  - number: '31'
    text: |-
      Een graf mag niet geroerd worden dan na drie jaren na de begraving.

      De overblijfselen van lijken en kisten worden in een afzonderlijk gedeelte van de begraafplaats begraven of, met
      toepassing van [artikel 16 van de Crematiewet BES][ref1], in een crematorium verbrand.

      Voor zover begraving plaatsvindt, mogen zij niet in een geruimd graf of grafkelder worden achtergelaten.

      Het verbod van alinea 1 is niet van toepassing op graven, waaruit eene lijkkist wordt weggenomen na verkregen
      toestemming, als bedoeld in het [eerste lid van artikel 9][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028203#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0028363#Artikel9
    url: https://wetten.overheid.nl/BWBR0028363/2011-10-04#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0028203
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0028363
        artikel: '9'
  - number: '32'
    text: |-
      onder het roeren van graven wordt in deze wet verstaan:

      a. bij graven of grafkelders met één lijkkist: het openen en verandering brengen in den toestand van den inhoud
      dier graven of grafkelders;

      b. bij graven of grafkelders met meer lijkkisten, het verandering brengen: in de beschuttende aardlaag, als bedoeld
      in de [artikelen 23][ref1], [28][ref2] en [30][ref3] en in lijkkisten met haar inhoud.


      [ref1]: https://wetten.overheid.nl/BWBR0028363#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0028363#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0028363#Artikel30
    url: https://wetten.overheid.nl/BWBR0028363/2011-10-04#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0028363
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0028363
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0028363
        artikel: '30'
  - number: '33'
    text: |-
      Een algemeene begraafplaats, waarvan geen gebruik meer wordt gemaakt, wordt bij besluit door het bestuurscollege
      gesloten verklaard.

      Wordt het besluit genomen, dat van een bijzondere begraafplaats geen gebruik meer zal worden gemaakt, dan heeft het
      bestuur dier begraafplaats daarvan onverwijld schriftelijk kennis aan het bestuurscollege.
    url: https://wetten.overheid.nl/BWBR0028363/2011-10-04#Artikel33
  - number: '34'
    text: |-
      Een gesloten begraafplaats blijft gedurende ten minste tien jaren onaangeroerd liggen. Na dien tijd is het verbod
      in [art. 17][ref1] opgeheven en mag de grond ter bezaaiing en beplanting worden vergraven, mits niet dieper dan
      0,5 M.

      Uitgraving ter meerdere diepte is binnen dertig jaren na de sluiting niet dan met vergunning van het
      bestuurscollege geoorloofd.

      Overblijfselen van lijken, die bij de ontgraving voor den dag mochten komen, worden door hem, die de ontgraving
      verrichtte of deed verrichten, op een begraafplaats begraven.

      Daartoe wordt den eigenaar eener zoodanige begraafplaats kosteloos de gelegenheid verstrekt op een door het
      bestuurscollege aan te wijzen plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0028363#Artikel17
    url: https://wetten.overheid.nl/BWBR0028363/2011-10-04#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0028363
        artikel: '17'
  - number: '35'
    text: De begraafplaatsen staan onder toezicht van het bestuurscollege.
    url: https://wetten.overheid.nl/BWBR0028363/2011-10-04#Artikel35
  - number: '36'
    text: De zorg en het beheer over de algemeene begraafplaatsen is opgedragen aan de ambtenaren van den Burgerlijken Stand.
    url: https://wetten.overheid.nl/BWBR0028363/2011-10-04#Artikel36
  - number: '37'
    text: |-
      1 Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de ambtenaren van politie,
      alsmede andere daartoe bij landsbesluit aangewezen personen. Een zodanige aanwijzing wordt bekendgemaakt in de
      Staatscourant.

      2 De in het eerste lid bedoelde personen zijn, uitsluitend voor zover dat voor de vervulling van hun taak
      redelijkerwijze noodzakelijk is, bevoegd:

      a. alle inlichtingen te vragen;

      b. inzage te verlangen van alle boeken, bescheiden en andere informatiedragers en daarvan afschrift te nemen of
      deze daartoe tijdelijk mee te nemen;

      c. goederen aan opneming en onderzoek te onderwerpen en deze daartoe tijdelijk mee te nemen;

      d. alle plaatsen, met uitzondering van woningen zonder de uitdrukkelijke toestemming van de bewoner, te betreden,
      vergezeld van door hen aangewezen personen;

      e. ter verrichting van de gerechtelijke schouwing of het afhalen van een lijk ter begraving of verbranding of het
      vervoer naar het lijkenhuis, woningen zonder de uitdrukkelijke toestemming van de bewoner binnen te treden.

      3 Zo nodig, wordt de toegang tot een plaats als bedoeld in het tweede lid, onderdeel d, verschaft met behulp van de
      sterke arm.

      4 Op het binnentreden in woningen als bedoeld in het tweede lid, onderdeel e, is titel X van het Derde boek van
      het Wetboek van Strafvordering BES van overeenkomstige toepassing, met uitzondering van de artikelen 155, vierde
      lid, 156, tweede lid, 157, tweede en derde lid, 158, eerste lid, laatste zinsnede, en 160, eerste lid, en met dien
      verstande dat de machtiging wordt verleend door de Gezaghebber.

      5 Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de wijze van taakuitoefening
      van de in het eerste lid bedoelde personen.

      6 Een ieder is verplicht aan de in het eerste lid bedoelde personen alle medewerking te verlenen die op grond van
      het tweede lid wordt gevorderd.
    url: https://wetten.overheid.nl/BWBR0028363/2011-10-04#Artikel37
  - number: '38'
    text: |-
      Voor een vergunning tot het beaarden, bijzetten of opdelven van een lijk op een algemene begraafplaats zijn ten
      behoeven van de kas van het openbaar lichaam de bedragen verschuldigd als vastgesteld bij eilandsbesluit houdende
      algemene maatregelen.

      De vergunning wordt, vrij van zegel, afgegeven door den ambtenaar van den Burgerlijken Stand van het district,
      waarin de begraafplaats is gelegen.

      Het recht moet vóór de begrafenis of het opdelven worden betaald.

      Geen recht wordt geheven voor de begraving of opdelving van lijken van krijgslieden in werkelijken dienst.
    url: https://wetten.overheid.nl/BWBR0028363/2011-10-04#Artikel38
  - number: '39'
    text: |-
      Op een algemene begraafplaats kunnen graf- en kelderplaatsen in eigendom worden verkregen tegen betaling ten
      behoeve van de kas van het openbaar lichaam van de bij eilandsbesluit, houden algemene maatregelen, vastgestelde
      bedragen.

      De eigendom van de graf- en kelderplaatsen, die ieder een volgnummer krijgen, wordt in afwijking van art. 665 van
      het Burgerlijk Wetboek BES, verkregen door een verklaring af te geven, vrij van zegel, door den ambtenaar van den
      Burgerlijken Stand van het district, waarin de begraafplaats is gelegen.

      De verklaring moet inhouden de voornamen, den naam, het beroep en de woonplaats van den kooper, de oppervlakte en
      het volgnummer van de graf- of kelderplaats en de betaling van de koopsom.

      Indien een vereeniging of vennootschap kooper is, dan worden de benaming en de plaats van vestiging daarvan in de
      verklaring vermeld, in plaats van voornamen, naam, beroep en woonplaats.
    url: https://wetten.overheid.nl/BWBR0028363/2011-10-04#Artikel39
  - number: '40'
    text: |-
      Het vervoer van een lijk uit een openbaar lichaam naar elders of van elders naar een openbaar lichaam, is slechts
      toegestaan indien voldaan wordt aan bij algemene maatregel van bestuur te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0028363/2011-10-04#Artikel40
  - number: '41'
    text: |-
      Onverminderd de straffen bij de gewone strafwetten gesteld tegen andere feiten, die gelijktijdig of in samenhang
      met de in deze wet genoemde mochten worden gepleegd, worden overtredingen van deze wet gestraft als volgt:

      1°. met geldboete van ten hoogste de eerste categorie:

      hij, die een lijk begraaft of doet begraven zonder een verlof als bedoeld in het [eerste lid van artikel 7][ref1]
      of in strijd met de voorschriften krachtens het tweede lid van dat artikel vastgesteld;

      hij die handelt in strijd met het bepaalde in [artikel 9][ref2];

      hij , die zonder de ontheffing, bedoeld bij [art. 6, tweede lid][ref3], een lijk begraaft of doet begraven meer dan
      vijf dagen na het overlijden;

      hij, die in strijd met het [derde lid van art. 19][ref4] bij het bijzetten van lijken het in dat lid bedoeld plan
      niet volgt;

      hij, die verzuimt aanteekening te houden, zooals voorgeschreven bij [art. 20][ref5] dezer wet;

      hij, die tusschen zonsondergang en zonsopgang op een begraafplaats wordt aangetroffen, anders dan om daar een
      begrafenis bij te wonen of iets te verrichten, wat hem door het bevoegd gezag is opgedragen.

      2°. met hechtenis van ten hoogste eene maand of geldboete van ten hoogste de eerste categorie:

      hij, die een lijk begraaft of doet begraven anders dan op de wijze en op de plaats als vermeld in [art. 1][ref6],
      behoudens het bepaalde in [art. 2][ref7];

      hij, die een lijk vervoert of doet vervoeren in een niet uitsluitend tot vervoer van lijken bestemd voertuig;

      hij, die in strijd met [art. 4][ref8] een lijk begraaft of doet begraven zonder het daarin vermeld verlof;

      hij, die zonder de ontheffing, bedoeld in [art. 6, tweede lid][ref9], een lijk begraaft of doet begraven binnen 36
      uren na het overlijden;

      Hij, die in strijd met [art. 17][ref10] een gebouw opricht of een put graaft;

      hij, die een lijk begraaft in strijd met [art. 23][ref11], of in een grafkelder plaatst in strijd met de
      [artt. 24][ref12], [26][ref13], [27][ref14] en [28, 1ste en 2de lid][ref15], behoudens de vrijstelling bedoeld
      in [art. 30][ref16];

      hij, die een graf roert of doet roeren, in strijd met [art. 31][ref17];

      hij, die een lijk begraaft of doet begraven op een begraafplaats, waaromtrent eene verklaring of eene kennisgeving
      is uitgegeven, als bedoeld in de eerste en tweede alinea van [art. 33][ref18];

      hij, die op een begraafplaats als in [art. 34][ref19] bedoeld, ontgravingen doet of doet uitvoeren in strijd met de
      voorschriften van dat artikel.

      Bij het veroordeelend vonnis kan het opruimen van de gebouwen en het dempen der putten, in strijd met het verbod
      gemaakt, op kosten der overtreders, worden gelast.

      3°. met hechtenis van ten hoogste een jaar of geldboete van ten hoogste de eerste categorie:

      hij, die een lijk vervoert of begraaft in het geval van [art. 3][ref20] in strijd met dat artikel;

      hij, die het lijk van iemand, die aan een gewelddadigen dood is gestorven verbergt of poogt te verbergen;

      hij, die een lijk uit een begraafplaats of een lijkenhuis wegneemt of poogt weg te nemen;

      hij, die de afgifte, bedoeld in [art. 5][ref21], van een lijk weigert;

      hij, die geen geneeskundige zijnde of buiten toezicht van een geneeskundige een lijkopening of ontleding van een
      lijk verricht;

      hij die een lijk vervoert of doet vervoeren in strijd met de krachtens [artikel 40][ref22] gegeven voorschriften.


