articles:
  - number: '1'
    text: 'In deze wet verstaan onder openbaar lichaam: het openbaar lichaam Bonaire, Sint Eustatius of Saba.'
    url: https://wetten.overheid.nl/BWBR0028363/2011-10-04#Artikel1
  - number: 1a
    text: |-
      Het lijk van een persoon of doodgeboren kind wordt in eene gesloten kist begraven, hetzij in een geheel of
      gedeeltelijk aarden graf, hetzij in een grafkelder, op eene begraafplaats als zoodanig vanwege het bestuurscollege
      aangelegd of toegelaten.

      «Met afwijking in zooverre van het daaromtrent bij deze wet bepaalde, is het op het eiland Saba geoorloofd ook op
      andere dan de in dit artikel bedoelde plaatsen lijken ter aarde te bestellen en blijkt ten aanzien van zoodanige
      graven en grafkelders [artikel 17][ref1] buiten toepassing.

      Ook is het geoorloofd volgens nader bij wet vast te stellen regelen lijken te verbranden.


      [ref1]: https://wetten.overheid.nl/BWBR0028363#Artikel17
    url: https://wetten.overheid.nl/BWBR0028363/2011-10-04#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0028363
        artikel: '17'
  - number: '2'
    text: |-
      Lijken, die in een zoodanigen staat verkeeren, dat zij niet naar eene begraafplaats kunnen worden overgebracht,
      worden ter plaatse, waar zij gevonden zijn of in de onmiddellijke nabijheid, zonder kist, mits ter diepte van
      1 Meter, begraven en overdekt, zoo mogelijk met ongebluschte kalk ter hoogte van 2 d.M. en in ieder geval met
      aangestampte aarde. Is op de plaats, waar een lijk gevonden wordt, een lijkkist aanwezig, dan kan het lijk daarin
      begraven worden.

      De begraving geschiedt ter plaatse door de ambtenaren van de gezondheidsdienst van het openbaar lichaam of van
      de politie aangewezen, zoo mogelijk in domeingrond en anders in particulieren grond. In het laatste geval zijn de
      eigenaars of gebruikers van den grond verplicht de begraving te gedoogen. De plaats van begraven op particulieren
      grond zal in overleg met de eigenaars of gebruikers van den grond worden gekozen.

      De schade, die aan den eigendom mocht worden veroorzaakt, wordt door den Kantonrechter begroot en door het openbaar
      lichaam vergoed, naar de onderscheiding gemaakt in de [artt. 11][ref1], [12][ref2] en [13][ref3]. Als schade komt
      niet in aanmerking de aanwezigheid van het graf zelf.


      [ref1]: https://wetten.overheid.nl/BWBR0028363#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0028363#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0028363#Artikel13
    url: https://wetten.overheid.nl/BWBR0028363/2011-10-04#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028363
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0028363
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0028363
        artikel: '13'
  - number: '3'
    text: |-
      Zijn er omstandigheden, die een gewelddadigen dood doen vermoeden, dan geschiedt de begraving niet dan met
      toestemming, van de officier van justitie, zoo mogelijk na voorafgegane gerechtelijk schouwing.

      In het daarvan of te maken proces-verbaal worden, zooveel mogelijk, vermeld de voornamen, de naam, de ouderdom,
      de geboorteplaats, het beroep en de woonplaats van den overledene, of andere gegevens, die tot herkenning kunnen
      dienen.
    url: https://wetten.overheid.nl/BWBR0028363/2011-10-04#Artikel3
  - number: '4'
    text: |-
      Geene begraving geschiedt zonder schriftelijk verlof van den ambtenaar van den Burgerlijken Stand, vrij van zegel
      en kosteloos af te geven, waarin de begraafplaats, of de in [art. 2][ref1] bedoelde plaats, waar het lijk ter aarde
      zal worden besteld, wordt vermeld.

      Bij het vragen van verlof tot begraven moet worden overgelegd eene der schriftelijke verklaringen als bedoeld in de
      [Wet verklaringen van overlijden BES][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028363#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0028199
    url: https://wetten.overheid.nl/BWBR0028363/2011-10-04#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028363
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0028199
  - number: 4a
    text: |-
      In gevallen als bedoeld in [artikel 1, derde lid, van de Wet verklaringen van overlijden BES][ref1]
      wordt geen verlof tot begraving afgegeven zolang niet is overgelegd een verklaring waaruit
      blijkt van geen bezwaar van de officier van justitie tegen begraving. Indien de officier van
      justitie meent niet tot de afgifte van een verklaring van geen bezwaar tegen begraving te kunnen
      overgaan, stelt deze de op grond van [artikel 4 van de Wet verklaringen van overlijden BES][ref2]
      aangewezen geneeskundige en de regionale toetsingscommissie, bedoeld in
      [artikel 19c van de Wet toetsing levensbeëindiging op verzoek en hulp bij zelfdoding][ref3], hiervan onverwijld op
      de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0028199#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028199#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0012410#Artikel19c
    url: https://wetten.overheid.nl/BWBR0028363/2011-10-04#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0028199
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0028199
        artikel: '4'
