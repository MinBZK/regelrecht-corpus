articles:
  - number: '1'
    text: 'Er is een tijdelijk Overlegplatform Bouwregelgeving, dat ten doel heeft:'
    url: https://wetten.overheid.nl/BWBR0010281/2002-04-27#Artikel1
  - number: 1.a
    text: |-
      het uitwisselen van informatie over nationale en internationale ontwikkelingen op het terrein van
      bouwvoorschriften;
    url: https://wetten.overheid.nl/BWBR0010281/2002-04-27#Artikel1
  - number: 1.b
    text: |-
      het doen van aanbevelingen met betrekking tot de nadere invulling van het [Bouwbesluit][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0005321
    url: https://wetten.overheid.nl/BWBR0010281/2002-04-27#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005321
  - number: 1.c
    text: |-
      het doen van aanbevelingen met betrekking tot de resultaten van onderzoeken die zijn uitgevoerd in het kader van de
      evaluatie van het bij of krachtens de [Woningwet][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0010281/2002-04-27#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005181
  - number: '2.1'
    text: Het overlegplatform wordt ingesteld voor vier jaar, behoudens eerdere intrekking van dit besluit.
    url: https://wetten.overheid.nl/BWBR0010281/2002-04-27#Artikel2
  - number: '2.2'
    text: |-
      Op het tijdstip waarop de doelstellingen, bedoeld in [artikel 1, onderdelen b en c][ref1], kunnen worden geacht
      te zijn afgerond, stelt het overlegplatform ter afronding van zijn werkzaamheden een verslag op omtrent zijn
      functioneren. Het verslag wordt toegezonden aan de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening
      en Milieubeheer.


      [ref1]: https://wetten.overheid.nl/BWBR0010281#Artikel1
    url: https://wetten.overheid.nl/BWBR0010281/2002-04-27#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0010281
        artikel: '1'
  - number: '3.1'
    text: |-
      Het overlegplatform bestaat uit een voorzitter en vertegenwoordigers op bestuurlijk niveau van organisaties en
      instanties die bij de bouw zijn betrokken.
    url: https://wetten.overheid.nl/BWBR0010281/2002-04-27#Artikel3
  - number: '3.2'
    text: Voorzitter van het overlegplatform is de heer mr. H.M.C.M. van Oorschot (burgemeester van de gemeente Delft).
    url: https://wetten.overheid.nl/BWBR0010281/2002-04-27#Artikel3
  - number: '3.3'
    text: |-
      Elke organisatie of instantie, die, al dan niet als agendalid, in het overlegplatform is vertegenwoordigd, wijst
      op uitnodiging van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer tenminste één
      afgevaardigde aan, alsmede een plaatsvervanger voor die afgevaardigde.
    url: https://wetten.overheid.nl/BWBR0010281/2002-04-27#Artikel3
  - number: '3.4'
    text: |-
      In het secretariaat van het overlegplatform wordt voorzien door de Directie Beleidsontwikkeling van het
      Directoraat-Generaal Wonen van het Ministerie van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer.
    url: https://wetten.overheid.nl/BWBR0010281/2002-04-27#Artikel3
