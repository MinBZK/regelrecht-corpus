  - number: '4.3'
    text: |-
      Tot het overlegplatform kunnen vertegenwoordigers van andere dan de in het eerste en tweede lid genoemde
      organisaties en instanties worden toegelaten. Een daartoe strekkend verzoek wordt gericht aan de Staatssecretaris
      van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer. Alvorens te beslissen, hoort voornoemde
      Staatssecretaris de voorzitter van het overlegplatform.
    url: https://wetten.overheid.nl/BWBR0010281/2002-04-27#Artikel4
  - number: '5.1'
    text: |-
      Het overlegplatform heeft een commissie die de juridisch/technische zaken, verband houdend met de in
      [artikel 1, onderdelen b en c][ref1], genoemde doelstellingen, ten behoeve van het overlegplatform voorbereidt.


      [ref1]: https://wetten.overheid.nl/BWBR0010281#Artikel1
    url: https://wetten.overheid.nl/BWBR0010281/2002-04-27#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010281
        artikel: '1'
  - number: '5.2'
    text: |-
      De commissie bestaat uit deelnemers van het overlegplatform. Zij kunnen zich doen vervangen door een vooraf bij de
      voorzitter van de commissie gemeld persoon die afkomstig is uit de organisatie of instantie, die de deelnemer van
      het overlegplatform vertegenwoordigt.
    url: https://wetten.overheid.nl/BWBR0010281/2002-04-27#Artikel5
  - number: '5.3'
    text: |-
      De voorzitter van de commissie kan vertegenwoordigers van bij de bouw betrokken organisaties of instanties, die
      niet zijn vertegenwoordigd in het overlegplatform, als deskundigen toelaten tot de bijeenkomsten van de commissie.
    url: https://wetten.overheid.nl/BWBR0010281/2002-04-27#Artikel5
  - number: '5.4'
    text: |-
      Voorzitter van de commissie is de Directeur Beleidsontwikkeling van het Directoraat-Generaal Wonen van het
      Ministerie van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer.
    url: https://wetten.overheid.nl/BWBR0010281/2002-04-27#Artikel5
  - number: '5.5'
    text: |-
      In het secretariaat van de commissie wordt voorzien door de in [artikel 3, vierde lid][ref1], genoemde Directie
      Beleidsontwikkeling.


      [ref1]: https://wetten.overheid.nl/BWBR0010281#Artikel3
    url: https://wetten.overheid.nl/BWBR0010281/2002-04-27#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010281
        artikel: '3'
  - number: '6'
    text: |-
      Een ieder die betrokken is bij de werkzaamheden van het overlegplatform en de commissies en daarbij de beschikking
      krijgt over gegevens waarvan hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, en voor wie
      niet reeds uit hoofde van ambt, beroep of wettelijk voorschrift ter zake van die gegevens een geheimhoudingsplicht
      geldt, is verplicht tot geheimhouding van die gegevens, behoudens voor zover enig wettelijk voorschrift hem tot
      mededeling verplicht of uit zijn taak bij deze werkzaamheden de noodzaak tot mededeling voortvloeit.
    url: https://wetten.overheid.nl/BWBR0010281/2002-04-27#Artikel6
  - number: '7.1'
    text: |-
      De Beschikking van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 10 mei 1994,
      nr. MJZ 10594015, houdende instelling van het Overlegplatform Bouwregelgeving (Stcrt. 1994, 92), wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0010281/2002-04-27#Artikel7
  - number: '7.2'
    text: |-
      De intrekking, bedoeld in het eerste lid, heeft tot gevolg dat de Bestuurlijke Commissie Bouwregelgeving wordt
      opgeheven.
    url: https://wetten.overheid.nl/BWBR0010281/2002-04-27#Artikel7
  - number: '8'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin het wordt
      geplaatst, en werkt terug tot en met 1 januari 1999.
    url: https://wetten.overheid.nl/BWBR0010281/2002-04-27#Artikel8
