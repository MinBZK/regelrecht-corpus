        artikel: '629'
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0001888
        artikel: '64'
  - number: 22a.3.d
    text: |-
      uitkeringen op grond van de [Wet arbeid en zorg][ref1] en aanvullingen daarop door degene tot wie de
      belastingplichtige in dienstbetrekking staat.


      [ref1]: https://wetten.overheid.nl/BWBR0013008
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0013008
  - number: 22aa.1
    text: |-
      Voor de werknemer die een uitkering geniet op grond van de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref1] of recht heeft op arbeidsondersteuning op grond
      van die wet, is de jonggehandicaptenkorting van toepassing. De korting kan tevens worden toegepast ten aanzien
      van de werknemer die ingevolge de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten recht heeft op een
      arbeidsongeschiktheidsuitkering, doch welke uitkering ingevolge artikel [1a:4][ref2], [2:40][ref3], [2:46][ref4],
      [3:8][ref5], [3:8b][ref6], [3:50][ref7] of [3:51 van die wet][ref8] niet wordt betaald.


