        bwb_id: BWBR0002471
        artikel: 38j
        hoofdstuk: VIII
  - number: 38p.1
    text: |-
      Een aanspraak ingevolge een oudedagsverplichting als bedoeld in [artikel 38n, tweede lid, onderdeel b][ref1],
      zoals dat artikel luidde op 31 december 2019, wordt jaarlijks verhoogd met een bij ministeriële regeling
      bepaalde marktrente, en kan geruisloos worden aangewend ter verkrijging van een lijfrente als bedoeld in
      [artikel 3.125 van de Wet inkomstenbelasting 2001][ref2] of een lijfrenterekening of lijfrentebeleggingsrecht
      als bedoeld in [artikel 3.126a van die wet][ref3] dan wel overeenkomstig de in het tweede en derde lid opgenomen
      voorwaarden in termijnen worden uitgekeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel38n
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel38p
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 38n
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 38p.2
    text: |-
      Voor zover een aanspraak ingevolge een oudedagsverplichting als bedoeld in het eerste lid niet is aangewend ter
      verkrijging van een lijfrente als bedoeld in [artikel 3.125 van de Wet inkomstenbelasting 2001][ref1] of een
      lijfrenterekening of lijfrentebeleggingsrecht als bedoeld in [artikel 3.126a van die wet][ref2], wordt de waarde
      van deze aanspraak in een periode van twintig jaar in termijnen met een gelijke tussenperiode van ten hoogste
      een jaar uitgekeerd als loon uit vroegere dienstbetrekking, waarbij het in een jaar uit te keren bedrag gelijk is
      aan de stand van de oudedagsverplichting aan het begin van dat jaar gedeeld door het aantal op dat tijdstip nog
      resterende uitkeringsjaren. Voorts geldt daarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel38p
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 38p.2.a
    text: 'bij in leven zijn van de werknemer of gewezen werknemer:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel38p
  - number: 38p.2.a.1°
    text: |-
      dat de termijnen aan hem worden uitgekeerd en de eerste termijn niet eerder wordt uitgekeerd dan
      nadat hij de leeftijd bereikt die vijf jaar lager is dan de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], maar uiterlijk twee maanden na de datum waarop hij de
      laatstgenoemde leeftijd bereikt;


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel38p
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 38p.2.a.2°
    text: |-
      dat, ingeval de eerste termijn eerder aan hem wordt uitgekeerd dan nadat hij de pensioengerechtigde leeftijd,
      bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], heeft bereikt, de periode van twintig
      jaar, bedoeld in de eerste volzin, wordt vermeerderd met het aantal jaren tussen het tijdstip van het uitkeren van
      de eerste termijn en de laatstgenoemde leeftijd;


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel38p
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 38p.2.a.3°
    text: |-
      dat, ingeval de omzetting, bedoeld in [artikel 38n, tweede lid][ref1], zoals dat artikel luidde op 31 december
      2019, meer dan twee maanden later plaatsvindt dan nadat hij de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref2], heeft bereikt, de eerste termijn aan hem wordt
      uitgekeerd direct na het moment van omzetting en de periode van twintig jaar, bedoeld in de eerste volzin, wordt
      verminderd met het aantal jaren tussen het tijdstip van het uitkeren van de eerste termijn en de laatstgenoemde
      leeftijd;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel38n
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel38p
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 38n
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 38p.2.b
    text: |-
      bij overlijden van de werknemer of gewezen werknemer terwijl ingevolge onderdeel a nog geen termijnen zijn
      ingegaan:
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel38p
  - number: 38p.2.b.1°
    text: dat de termijnen binnen twaalf maanden na het overlijden ingaan;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel38p
  - number: 38p.2.b.2°
    text: dat de termijnen worden uitgekeerd aan zijn erfgenamen, voor zover dit natuurlijke personen zijn.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel38p
  - number: 38p.3
    text: |-
      Indien ingevolge het tweede lid, onderdelen a of b, termijnen zijn ingegaan en de genieter van de termijnen
      overlijdt, gaat het recht op de nog niet uitgekeerde termijnen over op zijn erfgenamen, voor zover dit natuurlijke
      personen zijn.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel38p
  - number: 38p.4
    text: |-
      De [artikelen 19a][ref1] en [19b][ref2], zoals die artikelen luidden op 31 december 2016, de [artikelen 3.83][ref3]
      en [7.2 van de Wet inkomstenbelasting 2001][ref4], zoals die artikelen luidden op 31 december 2016,
      de [artikelen 2.8, tweede lid][ref5], [2.9][ref6] en [3.136 van de Wet inkomstenbelasting 2001][ref7],
      [artikel 30i van de Algemene wet inzake rijksbelastingen][ref8], de [artikelen 25, vijfde lid][ref9], en
      [26, derde lid, van de Invorderingswet 1990][ref10] en [artikel 32, derde lid, van de Successiewet 1956][ref11]
      zijn van overeenkomstige toepassing op aanspraken ingevolge een oudedagsverplichting als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel19b
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0011353#Artikel2
      [ref6]: https://wetten.overheid.nl/BWBR0011353#Artikel2
      [ref7]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref8]: https://wetten.overheid.nl/BWBR0002320#Artikel30i
      [ref9]: https://wetten.overheid.nl/BWBR0004770#Artikel25
      [ref10]: https://wetten.overheid.nl/BWBR0004770#Artikel26
      [ref11]: https://wetten.overheid.nl/BWBR0002226#Artikel32
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel38p
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19a
        hoofdstuk: IIB
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 19b
        hoofdstuk: IIB
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '7'
      - id: ref5
        bwb_id: BWBR0011353
        artikel: '2'
      - id: ref6
        bwb_id: BWBR0011353
        artikel: '2'
      - id: ref7
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref8
        bwb_id: BWBR0002320
        artikel: 30i
      - id: ref9
        bwb_id: BWBR0004770
        artikel: '25'
      - id: ref10
        bwb_id: BWBR0004770
        artikel: '26'
      - id: ref11
        bwb_id: BWBR0002226
        artikel: '32'
  - number: 38p.5
    text: |-
      In afwijking van het eerste en tweede lid kan onder door Onze Minister te stellen voorwaarden een aanspraak
      ingevolge een oudedagsverplichting als bedoeld in het eerste lid ook na de ingangsdatum van de termijnen,
      bedoeld in het tweede lid, geruisloos worden aangewend ter verkrijging van een lijfrente als bedoeld in
      [artikel 3.125 van de Wet inkomstenbelasting 2001][ref1] of een lijfrenterekening of lijfrentebeleggingsrecht als
      bedoeld in [artikel 3.126a van die we][ref2]t.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel38p
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '39'
    text: |-
      [Artikel 13a, tweede lid][ref1], is niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel13a
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 13a
        hoofdstuk: II
  - number: 39.a
    text: loon waarop de belasting met toepassing van die bepaling voor 1 januari 1994 zou zijn ingehouden;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel39
  - number: 39.b
    text: |-
      loon waarvan is overeengekomen dat een niet meer dan bijkomstig gedeelte op een ongebruikelijk tijdstip zal worden
      genoten en waarop de belasting met toepassing van die bepaling voor 1 januari 2006 zou zijn ingehouden.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel39
  - number: 39f.1
    text: |-
      Met betrekking tot op 31 december 2013 bestaande aanspraken op periodieke uitkeringen ter vervanging van gederfd
      of te derven loon als bedoeld in de [artikelen 11, eerste lid, onderdeel g][ref1], en [37][ref2], zoals die op
      31 december 2013 luidden, en daarmee gelijkgestelde bedragen als bedoeld in [artikel 11a, eerste lid][ref3], zoals
      dat op 31 december 2013 luidde, blijven de [ artikelen 10, vijfde lid, onderdelen b en c][ref4], 11, eerste lid,
      onderdeel g, en vierde lid, 11a, [19a][ref5], [19b, achtste lid][ref6],[ 32bb, zesde en achtste lid][ref7], en 37,
      zoals die op 31 december 2013 luidden, alsmede de daarop gebaseerde bepalingen, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel11a
      [ref4]: https://wetten.overheid.nl/BWBR0002471#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
      [ref6]: https://wetten.overheid.nl/BWBR0002471#Artikel19b
      [ref7]: https://wetten.overheid.nl/BWBR0002471#Artikel32bb
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel39f
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '11'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '37'
        hoofdstuk: VIII
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 11a
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0002471
        artikel: '10'
        hoofdstuk: II
      - id: ref5
        bwb_id: BWBR0002471
        artikel: 19a
        hoofdstuk: IIB
      - id: ref6
        bwb_id: BWBR0002471
        artikel: 19b
        hoofdstuk: IIB
      - id: ref7
        bwb_id: BWBR0002471
        artikel: 32bb
        hoofdstuk: V
        afdeling: '2'
  - number: 39f.2
    text: |-
      In afwijking in zoverre van het eerste lid mag de waarde van de aanspraak, het tegoed van de stamrechtspaarrekening
      of de waarde van het stamrechtbeleggingsrecht geheel of gedeeltelijk op een eerder tijdstip worden uitgekeerd
      dan in de [artikelen 11][ref1] en [11a][ref2], zoals die op 31 december 2013 luidden, en de daarop gebaseerde
      bepalingen, is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel11a
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel39f
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '11'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 11a
        hoofdstuk: II
  - number: 39f.3
    text: |-
      In afwijking in zoverre van het eerste lid kunnen aanspraken als bedoeld in
      dat lid mede worden uitgevoerd door een beleggingsonderneming als bedoeld in
      [artikel 3.126a, tweede lid, onderdelen b en d, van de Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel39f
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 39g
    text: |-
      [Artikel 10, vijfde lid][ref1], zoals dat luidde op 31 december 2014, blijft van toepassing op uitkeringen en
      verstrekkingen uit een voordien niet tot het loon gerekende aanspraak ingevolge een pensioenregeling als bedoeld in
      [artikel 32bc][ref2], zoals dat luidde op 31 december 2014.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel32bc
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel39g
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '10'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 32bc
        hoofdstuk: V
        afdeling: '2'
  - number: 39i
    text: |-
      Voor de toepassing van [artikel 20, derde lid][ref1], worden onder werknemers die in een andere lidstaat van de
      Europese Unie wonen mede verstaan werknemers die in het Verenigd Koninkrijk van Groot-Brittannië en Noord-Ierland
      wonen en die in het kalenderjaar de in de artikelen 24 en 25 van het Akkoord inzake de terugtrekking van het
      Verenigd Koninkrijk van Groot-Brittannië en Noord-Ierland uit de Europese Unie en de Europese Gemeenschap voor
      Atoomenergie (PbEU 2020, L 29) genoemde rechten genieten.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel20
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel39i
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '20'
        hoofdstuk: III
  - number: 39k
    text: |-
      Artikel 12a, derde, vierde en tiende lid, zoals dat luidde op 31 december 2022 en de daarop gebaseerde bepalingen
      blijven van toepassing op het loon van werknemers:
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel39k
  - number: 39k.a
    text: die arbeid verrichten ten behoeve van een lichaam waarin zij of hun partner een aanmerkelijk belang hebben; en
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel39k
  - number: 39k.b
    text: |-
      van wie het vóór 1 januari 2023 genoten loon geheel of gedeeltelijk is bepaald op basis van
      [artikel 12a, derde, vierde en tiende lid][ref1], zoals dat luidde op 31 december 2022.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel12a
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel39k
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 12a
        hoofdstuk: II
  - number: '40.1'
    text: |-
      De bepalingen van deze wet treden in werking op een door Ons te bepalen tijdstip, dat voor de onderscheidene
      bepalingen verschillend kan zijn. Ingeval dit tijdstip niet voor alle bepalingen hetzelfde is, worden door Ons voor
      zoveel nodig, op de grondslag van de ingevolge [artikel 39][ref1] zoals dat luidt bij de inwerkingtreding van deze
      wet vervallen of ingetrokken bepalingen, regelen gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel39
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '39'
        hoofdstuk: VIII
  - number: '40.2'
    text: 'Deze wet kan worden aangehaald als: Wet op de loonbelasting 1964.'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel40
