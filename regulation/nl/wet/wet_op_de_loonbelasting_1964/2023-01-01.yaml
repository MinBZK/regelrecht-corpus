        artikel: 18g
        hoofdstuk: IIB
  - number: 38f.2
    text: |-
      In afwijking in zoverre van het eerste lid blijven de [artikelen 18][ref1], [18e][ref2] en [18g][ref3], zoals deze
      luidden op 31 december 2004, van toepassing voor een werknemer die voor 1 januari 2005 de leeftijd van 55 jaar
      heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel18e
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel18g
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel38f
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '18'
        hoofdstuk: IIB
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 18e
        hoofdstuk: IIB
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 18g
        hoofdstuk: IIB
  - number: 38f.3
    text: |-
      In afwijking in zoverre van [artikel 18a][ref1] kan een ouderdomspensioen meer bedragen dan de aldaar opgenomen
      maxima voor zover zulks het gevolg is van de omzetting van een op 31 december 2005 bestaande aanspraak ingevolge
      een overbruggingspensioen als bedoeld in [artikel 18e][ref2], zoals dit artikel op 31 december 2004 luidde, in een
      aanspraak ingevolge een pensioenregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel18e
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel38f
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18a
        hoofdstuk: IIB
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 18e
        hoofdstuk: IIB
  - number: 38f.4
    text: |-
      Voor zover een aanspraak ingevolge een regeling voor overbruggingspensioen als bedoeld in [artikel 18e][ref1],
      zoals dat artikel op 31 december 2004 luidde, niet ingevolge het derde lid is omgezet in een andere aanspraak,
      blijft artikel 18e, zoals dat artikel op 31 december 2004 luidde, van toepassing op de eerstgenoemde aanspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18e
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel38f
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18e
        hoofdstuk: IIB
  - number: 38g
    text: |-
      Voor de toepassing van [artikel 18e, eerste lid, onderdeel b, en vierde lid][ref1], wordt het
      deelnemingsjarenpensioen opgevat met inbegrip van:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18e
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel38g
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18e
        hoofdstuk: IIB
  - number: 38g.a
    text: |-
      een overbruggingspensioen als bedoeld in [artikel 18e][ref1], zoals dit artikel op 31 december 2004 luidde;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18e
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel38g
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18e
        hoofdstuk: IIB
  - number: 38g.b
    text: |-
      uitkeringen ingevolge een regeling voor vervroegde uittreding als bedoeld in [artikel 18i][ref1], zoals dit artikel
      op 31 december 2004 luidde;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18i
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel38g
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18i
        hoofdstuk: IIB
  - number: 38g.c
    text: |-
      een prepensioen als bedoeld in [artikel 38a][ref1], zoals dit artikel op 31 december 2004 luidde.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel38a
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel38g
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 38a
        hoofdstuk: VIII
  - number: 38h.1
    text: |-
      Een op 31 december 2004 bestaande aanspraak die uitsluitend of nagenoeg uitsluitend als gevolg van de met
      ingang van 1 januari 2005 in werking getreden wijzigingen van deze wet niet langer als een aanspraak ingevolge
      een pensioenregeling is aan te merken, wordt in afwijking in zoverre van het bij deze wet bepaalde tot en met
      31 december 2006 toch als een aanspraak ingevolge een pensioenregeling aangemerkt, onder gehoudenheid van de
      inhoudingsplichtige tot afdracht van de in het tweede lid aangeduide heffing.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel38h
  - number: 38h.2
    text: |-
      Ter zake van de in het eerste lid bedoelde aanspraak is de inhoudingsplichtige verschuldigd een heffing naar een
      tarief van 52% en over een grondslag als geduid in het derde lid.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel38h
  - number: 38h.3
    text: |-
      De grondslag waarover de heffing is verschuldigd, is het positieve verschil tussen de toename van de waarde
      in het economische verkeer van de aanspraak en de toename van de waarde in het economische verkeer van de
      aanspraak ingeval op 1 januari 2006 de pensioenregeling reeds zodanig zou zijn aangepast dat deze blijft binnen
      de begrenzingen zoals die gelden met ingang van 1 januari 2005. De in de eerste volzin bedoelde grondslag wordt
      aangemerkt als loon dat als een eindheffingsbestanddeel wordt belast.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel38h
  - number: 38h.4
    text: |-
      Uitkeringen en verstrekkingen uit een aanspraak als bedoeld in het eerste lid behoren tot het loon, onverminderd de
      omstandigheid dat de inhoudingsplichtige ingevolge het eerste lid de aldaar bedoelde heffing is verschuldigd.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel38h
  - number: 38h.5
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld voor de toepassing van dit artikel waaronder regels
      om te komen tot een praktische benadering van de grondslag.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel38h
  - number: 38i.1
    text: |-
      Bij de beoordeling of binnen de in [artikel 18a][ref1] gestelde begrenzingen wordt gebleven, blijven bij een
      collectieve regeling buiten beschouwing:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel38i
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18a
        hoofdstuk: IIB
  - number: 38i.1.a
    text: |-
      op 31 december 2005 bestaande aanspraken, voorzover deze zijn opgebouwd ten behoeve van pensioen in de periode
      voorafgaand aan de datum waarop de werknemer of gewezen werknemer de leeftijd van 65 jaar bereikt;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel38i
  - number: 38i.1.b
    text: |-
      op 31 december 2005 bestaande aanspraken, voorzover deze zijn opgebouwd door middel van een individuele aanvulling
      op de collectieve regeling.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel38i
  - number: 38i.2
    text: |-
      Voor de toepassing van dit artikel wordt onder een collectieve regeling verstaan een regeling of een gedeelte van
      een regeling waaraan de werknemer verplicht deelnam, voorzover de regeling of het gedeelte van de regeling voor de
      werknemer geen keuzemogelijkheid bood met betrekking tot de hoogte van het op te bouwen pensioen.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel38i
  - number: 38i.3
    text: |-
      Voor de toepassing van dit artikel wordt onder een individuele aanvulling verstaan een pensioen dat in aanvulling
      op een collectieve regeling is opgebouwd.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel38i
  - number: 38n
    text: |-
      Op aanspraken ingevolge een pensioenregeling waarvan een lichaam als bedoeld in
      [artikel 19a, eerste lid, onderdelen d of e][ref1], zoals dat artikel luidde op 31 december 2016, als verzekeraar
      optreedt, blijven de [artikelen 18h][ref2], [19a][ref3], [19b][ref4], [19c][ref5], [19d][ref6] en [38j][ref7],
      alsmede de daarop gebaseerde bepalingen, zoals die artikelen en bepalingen luidden op 31 december 2016, van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel18h
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
