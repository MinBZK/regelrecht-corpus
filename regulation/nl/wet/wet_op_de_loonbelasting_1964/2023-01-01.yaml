      - id: ref6
        bwb_id: BWBR0002471
        artikel: 38d
        hoofdstuk: VIII
      - id: ref7
        bwb_id: BWBR0002471
        artikel: 38e
        hoofdstuk: VIII
      - id: ref8
        bwb_id: BWBR0002471
        artikel: 38f
        hoofdstuk: VIII
  - number: 32ba.7
    text: |-
      Een regeling voor vervroegde uittreding in de zin van het zesde lid wordt voor de toepassing van het
      eerste lid niet als zodanig aangemerkt, voor zover die regeling voorziet in een of meer uitkeringen
      in de periode van 36 maanden vóór het bereiken van de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], die in totaal niet hoger zijn dan een bedrag van
      € 2.037 vermenigvuldigd met het op hele maanden naar boven afgeronde aantal maanden tussen de eerste uitkering in
      die periode en het bereiken van die pensioengerechtigde leeftijd. Voor de toepassing van de eerste zin worden alle
      regelingen voor vervroegde uittreding in de zin van het zesde lid samengevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32ba
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 32ba.8
    text: |-
      Bij het begin van het kalenderjaar wordt het in het zevende lid genoemde bedrag bij ministeriële regeling vervangen
      door een ander bedrag. Dit bedrag wordt gesteld op het bedrag dat na aftrek van de in te houden loonbelasting
      en premie voor de volksverzekeringen, rekening houdend met de algemene heffingskorting voor een persoon die
      de pensioengerechtigde leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1],
      nog niet heeft bereikt, gelijk is aan het netto-ouderdomspensioen per maand, bedoeld in
      [artikel 9, vijfde lid, onderdeel a, van die wet][ref2], waarbij de nodig geachte afronding wordt aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel9
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32ba
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '9'
  - number: 32ba.9
    text: |-
      Op verzoek van de inhoudingsplichtige beslist de inspecteur bij voor bezwaar vatbare beschikking of een regeling
      een regeling voor vervroegde uittreding is. Het verzoek wordt gedaan voordat de regeling dan wel een wijziging van
      de regeling wordt ingevoerd.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32ba
  - number: 32ba.10
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld voor de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32ba
  - number: 32bb.1
    text: |-
      In afwijking in zoverre van het overigens bij of krachtens deze wet bepaalde, wordt een door een
      inhoudingsplichtige aan een werknemer toegekende vertrekvergoeding als bedoeld in het vierde lid voor zover die
      vergoeding meer bedraagt dan het toetsloon, bedoeld in het derde lid, van de werknemer, aangemerkt als loon dat als
      een eindheffingsbestanddeel wordt belast naar een tarief van 75%.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32bb
  - number: 32bb.2
    text: Dit artikel is niet van toepassing ingeval het toetsloon van de werknemer niet meer bedraagt dan € 612.000.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32bb
  - number: 32bb.3
    text: 'Voor de toepassing van dit artikel wordt onder het toetsloon van een werknemer verstaan:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32bb
  - number: 32bb.3.a
    text: |-
      ingeval de dienstbetrekking is aangevangen vóór of met het begin van het tweede kalenderjaar voorafgaande aan
      het kalenderjaar waarin de dienstbetrekking is beëindigd: het loon dat de werknemer in dat tweede voorafgaande
      kalenderjaar heeft genoten van de inhoudingsplichtige;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32bb
  - number: 32bb.3.b
    text: |-
      ingeval de dienstbetrekking is aangevangen in het tweede kalenderjaar voorafgaande aan het kalenderjaar waarin de
      dienstbetrekking is beëindigd: het tot een jaarloon herleide bedrag van het loon dat de werknemer in dat tweede
      voorafgaande kalenderjaar heeft genoten van de inhoudingsplichtige;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32bb
  - number: 32bb.3.c
    text: |-
      ingeval de dienstbetrekking is aangevangen in het kalenderjaar voorafgaande aan het kalenderjaar waarin de
      dienstbetrekking is beëindigd: het tot een jaarloon herleide bedrag van het loon dat de werknemer in dat
      voorafgaande kalenderjaar heeft genoten van de inhoudingsplichtige;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32bb
  - number: 32bb.3.d
    text: |-
      ingeval de dienstbetrekking is aangevangen in het kalenderjaar waarin de dienstbetrekking is beëindigd: het loon
      dat de werknemer in dat kalenderjaar van de inhoudingsplichtige zou hebben genoten indien de dienstbetrekking aan
      het begin van dat kalenderjaar was aangevangen en niet in dat kalenderjaar was beëindigd.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32bb
  - number: 32bb.4
    text: |-
      Voor de toepassing van dit artikel wordt onder een door een inhoudingsplichtige aan een werknemer toegekende
      vertrekvergoeding verstaan de som van het positieve verschil tussen A en het vergelijkingsloon en het positieve
      verschil tussen B en het vergelijkingsloon, waarbij wordt verstaan onder: A: het van de inhoudingsplichtige
      genoten loon in het kalenderjaar waarin de dienstbetrekking is beëindigd alsmede het na dat kalenderjaar van de
      inhoudingsplichtige genoten loon; B: het van de inhoudingsplichtige genoten loon in het kalenderjaar voorafgaande
      aan het kalenderjaar waarin de dienstbetrekking is beëindigd; Vergelijkingsloon: a. ingeval de dienstbetrekking
      is aangevangen vóór of met het begin van het tweede kalenderjaar voorafgaande aan het kalenderjaar waarin de
      dienstbetrekking is beëindigd: het toetsloon van de werknemer, met dien verstande dat het toetsloon voor de
      berekening van het verschil met A naar evenredigheid wordt verminderd gerelateerd aan het aantal dagen dat
      de dienstbetrekking niet meer heeft bestaan in het kalenderjaar waarin de dienstbetrekking is beëindigd; b.
      ingeval de dienstbetrekking is aangevangen in het tweede kalenderjaar voorafgaande aan het kalenderjaar waarin
      de dienstbetrekking is beëindigd: het toetsloon van de werknemer, met dien verstande dat het toetsloon voor de
      berekening van het verschil met A naar evenredigheid wordt verminderd gerelateerd aan het aantal dagen dat de
      dienstbetrekking niet meer heeft bestaan in het kalenderjaar waarin de dienstbetrekking is beëindigd; c. ingeval de
      dienstbetrekking is aangevangen in het kalenderjaar voorafgaande aan het kalenderjaar waarin de dienstbetrekking is
      beëindigd: het toetsloon van de werknemer, met dien verstande dat het toetsloon voor de berekening van het verschil
      met A naar evenredigheid wordt verminderd gerelateerd aan het aantal dagen dat de dienstbetrekking niet meer heeft
      bestaan in het kalenderjaar waarin de dienstbetrekking is beëindigd; d. ingeval de dienstbetrekking is aangevangen
      in het kalenderjaar waarin de dienstbetrekking is beëindigd: het toetsloon van de werknemer, met dien verstande
      dat het toetsloon voor de berekening van het verschil met A naar evenredigheid wordt verminderd gerelateerd aan
      het aantal dagen dat de dienstbetrekking niet heeft bestaan in het kalenderjaar waarin de dienstbetrekking is
      beëindigd.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32bb
  - number: 32bb.5
    text: |-
      Ingeval de inhoudingsplichtige in het kalenderjaar waarin de dienstbetrekking is beëindigd onderscheidenlijk in
      het daaraan voorafgaande kalenderjaar met de werknemer een aandelenoptierecht is overeengekomen en de werknemer ter
      zake van dat recht niet uiterlijk bij de beëindiging van de dienstbetrekking ingevolge de [artikelen 10a][ref1] en
      [13a][ref2], met uitzondering van artikel 10a, dertiende lid, loon heeft genoten, wordt bij de vaststelling van A,
      bedoeld in het vierde lid, onderscheidenlijk B, bedoeld in het vierde lid, mede in aanmerking genomen:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel13a
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32bb
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 10a
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 13a
        hoofdstuk: II
  - number: 32bb.5.a
    text: |-
      ingeval het recht nog niet is uitgeoefend: hetgeen tot het loon zou hebben behoord indien hij dat recht op
      het tijdstip van beëindiging van de dienstbetrekking zou hebben uitgeoefend en de daarbij verkregen aandelen
      onmiddellijk verhandelbaar zouden zijn; of
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32bb
  - number: 32bb.5.b
    text: |-
      ingeval het recht wel is uitgeoefend: hetgeen tot het loon zou hebben behoord indien de bij uitoefening van het
      recht verkregen aandelen op het tijdstip van beëindiging van de dienstbetrekking verhandelbaar zouden worden.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32bb
  - number: 32bb.6
    text: |-
      Het eerste lid is niet van toepassing voor zover de inhoudingsplichtige aannemelijk maakt dat de som van de
      verschillen, bedoeld in het vierde lid, verband houdt met loon dat de werknemer ingevolge de [artikelen 10a][ref1]
      en [13a][ref2] heeft genoten ter zake van een aandelenoptierecht, dat onvoorwaardelijk is toegekend of geworden in
      een eerder jaar dan het kalenderjaar voorafgaande aan het kalenderjaar waarin de dienstbetrekking met die werknemer
      is beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel13a
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32bb
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 10a
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 13a
        hoofdstuk: II
  - number: 32bb.7
    text: |-
      Voor de toepassing van het eerste lid wordt een vertrekvergoeding beschouwd te zijn toegekend op het tijdstip
      waarop de dienstbetrekking is beëindigd, of, voor zover de vertrekvergoeding pas daarna als loon wordt genoten, op
      dat latere tijdstip. Ingeval een vertrekvergoeding ingevolge de eerste volzin wordt beschouwd te zijn toegekend op
      meer dan een tijdstip, wordt de berekening ingevolge het vierde lid op elk tijdstip toegepast onder verrekening van
      hetgeen eerder is berekend.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32bb
  - number: 32bb.8
    text: |-
      Bij het begin van het kalenderjaar wordt het in het tweede lid genoemde bedrag bij ministeriële regeling
      vervangen door een ander bedrag. Dit bedrag wordt berekend door het te vervangen bedrag te vermenigvuldigen met de
      tabelcorrectiefactor, bedoeld in [artikel 10.2 van de Wet inkomstenbelasting 2001][ref1], en vervolgens de nodig
      geachte afronding aan te brengen. Indien in het voorafgaande kalenderjaar een dergelijke afronding is toegepast,
      kan bij vervanging worden uitgegaan van het niet-afgeronde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel10
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32bb
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '10'
  - number: 32bb.9
    text: |-
      Het eerste lid is niet van toepassing op een bedrag dat ingevolge [artikel 32ba, eerste lid][ref1], wordt
      aangemerkt als loon dat als een eindheffingsbestanddeel wordt belast.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel32ba
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32bb
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 32ba
        hoofdstuk: V
        afdeling: '2'
  - number: 32c.1
    text: |-
      Ingeval een sociale uitkering wordt verrekend met een terug te betalen sociale uitkering, wordt de terugbetaling
      in afwijking van [artikel 10][ref1] tot het verrekende bedrag niet in aanmerking genomen als negatief loon en gaat
      de uitkering die met de terug te betalen uitkering wordt verrekend tot het bedrag van die verrekening niet tot het
      loon behoren. Mocht na verrekening nog een aan de werknemer toekomend bedrag resteren, dan wordt dit loon op de
      voet van [artikel 26][ref2] belast.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel26
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '10'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '26'
        hoofdstuk: III
  - number: 32c.2
    text: |-
      Voor de toepassing van dit artikel wordt onder een sociale uitkering verstaan een uitkering die op grond van een
      wettelijke bepaling inzake de sociale zekerheid door een gemeente, het Uitvoeringsinstituut werknemersverzekeringen
      of de Sociale Verzekeringsbank wordt betaald.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32c
  - number: 32d.1
    text: |-
      De in Nederland wonende of gevestigde inhoudingsplichtige wordt geacht met het door hem verschuldigde loon van een
      in Nederland wonende werknemer tevens te verstrekken het loon dat de werknemer zonder toepassing van dit artikel
      zou hebben genoten als werknemer van een andere inhoudingsplichtige, indien:
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32d
  - number: 32d.1.a
    text: |-
      de werknemer uit hoofde van zijn dienstbetrekking tevens werkzaam is als werknemer van die andere
      inhoudingsplichtige onder de verplichting het hem toekomende loon af te staan aan de inhoudingsplichtige, en
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32d
  - number: 32d.1.b
    text: |-
      die andere inhoudingsplichtige het bedoelde loon rechtstreeks afdraagt aan de inhoudingsplichtige en aan de
      werknemer geen verstrekkingen verstrekt die niet vooraf aan de inhoudingsplichtige zijn medegedeeld. Aan de
      voorwaarde in de eerste volzin, onderdeel a, dat de werknemer uit hoofde van zijn dienstbetrekking tevens
      werkzaam is als werknemer van een andere inhoudingsplichtige is ook voldaan indien de inhoudingsplichtige waaraan
      het loon wordt afgestaan een lichaam is waarin de werknemer een aanmerkelijk belang heeft in de zin van de
      [Wet inkomstenbelasting 2001][ref1], de werknemer via dit lichaam een belang heeft in de andere inhoudingsplichtige
      en dit belang tezamen met zijn werkzaamheden voor die andere inhoudingsplichtige materieel grotendeels overeenkomt
      met het aandeel en de werkzaamheden van een vennoot in een vennootschap onder firma.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32d
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: 32d.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van een niet in Nederland wonende werknemer ingeval
      het aan de inhoudingsplichtige afgestane loon voor de toepassing van regelingen ter voorkoming van dubbele
      belasting niet anders zou worden behandeld dan het door deze inhoudingsplichtige aan de werknemer uit te betalen
      loon.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32d
  - number: 32d.3
    text: |-
      Het eerste en tweede lid zijn slechts van toepassing als de inspecteur onder wie de inhoudingsplichtige
      ressorteert die zonder toepassing van deze leden belasting had moeten inhouden, op gezamenlijk verzoek van deze
      inhoudingsplichtige, de inhoudingsplichtige aan wie het loon wordt afgestaan en de werknemer bij voor bezwaar
      vatbare beschikking, die te allen tijde bij nadere, voor bezwaar vatbare, beschikking kan worden herroepen, heeft
      vastgesteld dat aan de gestelde voorwaarden is voldaan.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32d
  - number: 32d.4
    text: 'Het derde lid is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32d
  - number: 32d.4.a
    text: |-
      de werknemer een aanmerkelijk belang heeft in de zin van de [Wet inkomstenbelasting 2001][ref1] in zowel
      de inhoudingsplichtige die zonder toepassing van dit artikel belasting had moeten inhouden als in de
      inhoudingsplichtige aan wie het loon wordt afgestaan, en


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32d
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: 32d.4.b
    text: |-
      de inhoudingsplichtige aan wie het loon wordt afgestaan aangifte doet in overeenstemming met het eerste of tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32d
  - number: '33.1'
    text: |-
      Ter vergemakkelijking van de heffing van belasting kunnen bij of krachtens algemene maatregel van bestuur regels
      worden gesteld betreffende:
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel33
  - number: 33.1.a
    text: |-
      een rechtstreeks uit het familierecht voortvloeiende uitkering of verstrekking in de zin van
      [artikel 3.101, eerste lid, onderdeel b, van de Wet inkomstenbelasting 2001][ref1], ingeval hiermede rekening wordt
      gehouden bij het vaststellen van de hoogte van een periodieke uitkering ingevolge de [Participatiewet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0015703
  - number: 33.1.b
    text: 'de voorwaarden waaronder een vermindering met het loon van hulpen plaatsvindt van het loon verstrekt aan:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel33
  - number: 33.1.b.1°
    text: |-
      de uitvoerder van aangenomen werk, bedoeld in [artikel 3, eerste lid, onderdeel a][ref1], indien de in dat
      onderdeel bedoelde overeenkomst niet rechtstreeks is aangegaan met een natuurlijke persoon ten behoeve van diens
      persoonlijke aangelegenheden;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel3
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '3'
        hoofdstuk: I
  - number: 33.1.b.2°
    text: |-
      de thuiswerker, bedoeld in [artikel 4, onderdeel a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel4
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '4'
        hoofdstuk: I
  - number: 33.1.c
    text: het vaststellen van tabelloon in de gevallen, bedoeld in het tweede lid, onderdeel c;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel33
  - number: 33.1.d
    text: |-
      het door de inhoudingsplichtige aan het einde van het kalenderjaar herrekenen van de belasting geheven over
      uitkeringen en verstrekkingen ingevolge de [Participatiewet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0015703
  - number: 33.1.e
    text: de inhoudingsplicht ter zake van loon dat een werknemer geniet van een derde.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel33
  - number: '33.2'
    text: 'Bij ministeriële regeling kunnen aanvullende regels worden gesteld betreffende:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel33
  - number: 33.2.a
    text: |-
      de heffing van de belasting ingeval loon van meer dan één inhoudingsplichtige of mede loon van een derde, dan wel
      over enig tijdvak meer dan één beloning wordt genoten;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel33
  - number: 33.2.b
    text: inhouding van geschatte bedragen, gevolgd door periodieke afrekening;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel33
  - number: 33.2.c
    text: 'het vaststellen van loonbelastingtabellen voor:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel33
  - number: 33.2.c.1°
    text: |-
      degenen die uitkeringen of verstrekkingen ontvangen ingevolge de [Participatiewet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0015703
  - number: 33.2.c.2°
    text: |-
      uitvoerders van aangenomen werk, hun hulpen, degenen van wie de arbeidsverhouding op grond van
      [artikel 4, onderdeel a, b of e][ref1], als dienstbetrekking wordt beschouwd en bij ministeriële regeling
      aangewezen sekswerkers van wie de arbeidsverhouding bij of krachtens algemene maatregel van bestuur als
      dienstbetrekking wordt beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel4
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '4'
        hoofdstuk: I
  - number: '34.1'
    text: |-
      Ter vergemakkelijking van de heffing van de inkomstenbelasting kunnen bij algemene maatregel van bestuur regels
      worden gesteld ingevolge welke de loonbelasting mede wordt geheven van natuurlijke personen die:
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel34
  - number: 34.1.a
    text: termijnen van lijfrente of andere periodieke uitkeringen of verstrekkingen genieten;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel34
  - number: 34.1.b
    text: uitkeringen genieten ter vervanging van gederfde of te derven periodieke uitkeringen of verstrekkingen;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel34
  - number: 34.1.c
    text: |-
      een afkoopsom genieten ter zake van een afkoop als bedoeld in
      [artikel 3.133, tweede lid, onderdeel d, van de Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '34.2'
    text: |-
      Met betrekking tot bedragen ter zake van een afkoop als bedoeld in
      [artikel 3.133, tweede lid, onderdeel d, van de Wet inkomstenbelasting 2001][ref1] bedraagt in
      afwijking van [hoofdstuk III][ref2] de belasting 52% van deze bedragen. Indien de belasting ingevolge
      [artikel 27b, eerste lid][ref3], in één bedrag met de premie voor de volksverzekeringen wordt geheven, wordt in
      afwijking in zoverre van de eerste volzin het bedrag van de verschuldigde belasting tezamen met het bedrag van de
      verschuldigde premie voor de volksverzekeringen gesteld op 52% van de bedoelde bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002471#HoofdstukIII
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel27b
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002471
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 27b
        hoofdstuk: IV
  - number: '35.1'
    text: Ten aanzien van een artiest of beroepssporter wordt de belasting geheven naar de gage.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35
  - number: '35.2'
    text: |-
      Gage is al hetgeen de artiest of beroepssporter als zodanig geniet. Tot de gage behoren kostenvergoedingen alsmede
      aanspraken om na verloop van tijd of onder een voorwaarde een of meer uitkeringen of verstrekkingen te ontvangen.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35
  - number: '35.3'
    text: 'Tot de gage behoren niet:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35
  - number: 35.3.a
    text: |-
      vergoedingen en verstrekkingen ter zake van consumpties tijdens de werktijd die geen deel uitmaken van een maaltijd
      volgens bij ministeriële regeling te stellen regels, of ter zake van maaltijden waarbij het zakelijk karakter van
      meer dan bijkomstig belang is;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35
  - number: 35.3.b
    text: |-
      vergoedingen die strekken tot bestrijding van reis- en verblijfkosten – andere dan kosten van eigen vervoer –
      ter behoorlijke vervulling van het optreden dan wel de sportbeoefening, mits de artiest of beroepssporter de
      bewijsstukken overhandigt aan de inhoudingsplichtige en deze de bewijsstukken administreert en voor controle
      beschikbaar houdt;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35
  - number: 35.3.c
    text: |-
      verstrekkingen die strekken tot voorkoming van reis- en verblijfkosten ter behoorlijke vervulling van het optreden
      dan wel de sportbeoefening;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35
  - number: 35.3.d
    text: |-
      aanspraken ingevolge de [Ziektewet][ref1], de [Wet arbeid en zorg][ref2], de
      [Wet werk en inkomen naar arbeidsvermogen][ref3], de [Wet op de arbeidsongeschiktheidsverzekering][ref4] en de
      [Werkloosheidswet][ref5];


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0013008
      [ref3]: https://wetten.overheid.nl/BWBR0019057
      [ref4]: https://wetten.overheid.nl/BWBR0002524
      [ref5]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0013008
      - id: ref3
        bwb_id: BWBR0019057
      - id: ref4
        bwb_id: BWBR0002524
      - id: ref5
        bwb_id: BWBR0004045
  - number: 35.3.e
    text: aanspraken, die naar aard en strekking overeenkomen met aanspraken als bedoeld in onderdeel d;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35
  - number: 35.3.f
    text: aanspraken op uitkeringen wegens overlijden of invaliditeit ten gevolge van een ongeval en
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35
  - number: 35.3.g
    text: |-
      bedragen die worden ingehouden als bijdrage voor aanspraken die naar aard en strekking overeenkomen met aanspraken
      bedoeld in onderdeel e, alsmede bijdrage voor aanspraken, bedoeld in onderdeel f.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35
  - number: '35.4'
    text: |-
      Tot de gage behoort mede niet het aan de artiest of beroepssporter toe te rekenen deel van hetgeen blijkens
      een beschikking van de inspecteur als een niet tot de gage behorende vergoeding kan worden aangemerkt
      (kostenvergoedingsbeschikking). De kostenvergoedingsbeschikking wordt op verzoek door de inspecteur verstrekt
      en is vatbaar voor bezwaar. Het verzoek wordt voor het optreden of de sportbeoefening gedaan door de artiest, de
      beroepssporter of de inhoudingsplichtige, dan wel uiterlijk een maand na het optreden of de sportbeoefening door
      de inhoudingsplichtige. Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de
      kostenvergoedingsbeschikking.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35
  - number: '35.5'
    text: |-
      Niet in geld genoten gage wordt in aanmerking genomen naar de waarde die daaraan in het economische verkeer kan
      worden toegekend.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35
  - number: '35.6'
    text: 'Gage wordt beschouwd te zijn genoten op het tijdstip:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35
  - number: 35.6.a
    text: |-
      waarop zij betaald of verrekend wordt, ter beschikking van de artiest of beroepssporter wordt gesteld of
      rentedragend wordt;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35
  - number: 35.6.b
    text: waarop zij vorderbaar en tevens inbaar wordt, of
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35
  - number: 35.6.c
    text: |-
      indien dat later is dan de tijdstippen, bedoeld in de onderdelen a en b en de inhoudingsplichtige een
      kostenvergoedingsbeschikking heeft aangevraagd: uiterlijk een maand na het optreden of de sportbeoefening.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35
  - number: 35a.1
    text: |-
      De verschuldigde belasting bedraagt een percentage, gelijk aan het gecombineerde heffingspercentage, bedoeld in
      [artikel 21, onderdeel b][ref1], van de gage. In afwijking van de vorige volzin bedraagt de belasting ten aanzien
      van de niet in Nederland wonende artiest of beroepssporter 20 percent van de gage.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel21
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '21'
        hoofdstuk: III
  - number: 35a.2
    text: |-
      Ten aanzien van niet in Nederland wonende beroepssporters kan bij algemene maatregel van bestuur, zo nodig
      onder voorwaarden, ten behoeve van uniforme heffing bij grensoverschrijdende evenementen het in het eerste lid
      genoemde percentage van 20 tijdelijk worden verlaagd, doch niet verder dan tot 15 percent. Een krachtens de eerste
      volzin vastgestelde algemene maatregel van bestuur wordt aan de beide kamers der Staten-Generaal overlegd. Hij
      treedt in werking op een tijdstip dat nadat vier weken na de overlegging zijn verstreken bij koninklijk besluit
      wordt vastgelegd, tenzij binnen die termijn door of namens een der kamers of door ten minste een vijfde van het
      grondwettelijk aantal leden van een der kamers de wens te kennen wordt gegeven dat het onderwerp van de algemene
      maatregel van bestuur bij wet wordt geregeld. In dat geval wordt een daartoe strekkend voorstel van wet zo spoedig
      mogelijk ingediend. Indien het voorstel van wet wordt ingetrokken of indien een van de beide Kamers van de Staten-
      Generaal besluit het voorstel niet aan te nemen, wordt de algemene maatregel van bestuur ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35a
  - number: 35a.3
    text: |-
      In afwijking van het eerste lid bedraagt de verschuldigde belasting 52 percent van de gage ingeval
      de artiest of beroepssporter zijn naam, adres of woonplaats niet aan de inhoudingsplichtige heeft
      verstrekt, dan wel zijn identiteit niet is vastgesteld en opgenomen in de loonadministratie overeenkomstig
      [artikel 35e, onderdeel e][ref1], alsmede ingeval de artiest of beroepssporter ter zake onjuiste gegevens heeft
      verstrekt en de inhoudingsplichtige dit weet of redelijkerwijs moet weten.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel35e
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 35e
        hoofdstuk: VII
  - number: 35b.1
    text: De belasting wordt geheven door inhouding op de gage.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35b
  - number: 35b.2
    text: De inhoudingsplichtige is verplicht de belasting in te houden op het tijdstip waarop de gage wordt genoten.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35b
  - number: 35b.3
    text: De inhoudingsplichtige is verplicht de ingehouden belasting op aangifte af te dragen.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35b
  - number: 35d.1
    text: |-
      De artiest of beroepssporter is gehouden volgens bij ministeriële regeling te stellen regels aan de
      inhoudingsplichtige:
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35d
  - number: 35d.1.a
    text: opgave te doen van gegevens waarvan de kennisneming voor de heffing van de belasting van belang kan zijn;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35d
  - number: 35d.1.b
    text: |-
      inzage te verlenen van een op hem betrekking hebbend document als bedoeld in
      [artikel 1, eerste lid, onder 1º tot en met 3º, van de Wet op de identificatieplicht][ref1] om een afschrift
      daarvan in de loonadministratie van de inhoudingsplichtige te laten opnemen;


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35d
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 35d.1.c
    text: '- indien hij in Nederland woont – opgave te doen van zijn burgerservicenummer.'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35d
  - number: 35d.2
    text: |-
      Opgave van naam, adres, woonplaats en – ingeval hij niet in Nederland woont – woonland en geboortedatum van de
      artiest of beroepssporter alsmede van de overige in dit artikel bedoelde gegevens geschiedt door middel van de door
      de inspecteur verstrekte gageverklaring.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35d
  - number: 35e
    text: 'De inhoudingsplichtige is gehouden volgens bij ministeriële regeling te stellen regels:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35e
  - number: 35e.a
    text: |-
      van de artiest of beroepssporter opgave te verlangen van gegevens waarvan de kennisneming voor de heffing van de
      belasting van belang kan zijn;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35e
  - number: 35e.b
    text: van de in Nederland wonende artiest opgave te verlangen van zijn burgerservicenummer;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35e
  - number: 35e.c
    text: |-
      een loonadministratie te voeren en daarbij de gegevens te administreren met betrekking tot de gage en met
      betrekking tot vergoedingen en verstrekkingen die niet tot de gage behoren;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35e
  - number: 35e.d
    text: |-
      aan de in Nederland wonende artiest, alsmede, op diens verzoek, aan de niet in Nederland wonende artiest of
      beroepssporter, opgave te doen van de in een kalenderjaar genoten gage, van de ingehouden belasting en van andere
      gegevens die van belang kunnen zijn voor de heffing van de inkomstenbelasting;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35e
  - number: 35e.e
    text: |-
      de identiteit van de artiest of beroepssporter vast te stellen aan de hand van een document als bedoeld in
      [artikel 1, eerste lid, onder 1º tot en met 3º, van de Wet op de identificatieplicht][ref1], alsmede de aard, het
      nummer en een afschrift daarvan in de loonadministratie op te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35e
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 35f
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor bepaalde groepen artiesten of beroepssporters nadere
      regelen worden gesteld inzake de heffing van de belasting, alsmede andere in het kader der wet passende nadere
      regelen worden gegeven ter aanvulling van in de wet geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35f
  - number: 35g.1
    text: Ten aanzien van een buitenlands gezelschap wordt de belasting geheven naar de gage.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35g
  - number: 35g.2
    text: |-
      Gage is al hetgeen ter zake van het optreden of de sportbeoefening in Nederland wordt ontvangen door het
      buitenlandse gezelschap, dan wel door het lichaam waarmee de leden van het gezelschap een rechtsverhouding hebben
      op grond waarvan het optreden of de sportbeoefening plaatsvindt. Tot de gage behoren kostenvergoedingen alsmede
      aanspraken om na verloop van tijd of onder een voorwaarde een of meer uitkeringen of verstrekkingen te ontvangen.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35g
  - number: 35g.3
    text: 'Tot de gage behoren niet:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35g
  - number: 35g.3.a
    text: |-
      vergoedingen en verstrekkingen ter zake van consumpties tijdens de werktijd die geen deel uitmaken van een maaltijd
      volgens bij ministeriële regeling te stellen regels, of ter zake van maaltijden waarbij het zakelijk karakter van
      meer dan bijkomstig belang is;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35g
  - number: 35g.3.b
    text: |-
      vergoedingen die strekken tot bestrijding van reis- en verblijfkosten – andere dan kosten van eigen vervoer –
      ter behoorlijke vervulling van het optreden of de sportbeoefening, mits het gezelschap de bewijsstukken aan de
      inhoudingsplichtige doet toekomen en deze de bewijsstukken administreert en voor controle beschikbaar houdt;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35g
  - number: 35g.3.c
    text: |-
      verstrekkingen die strekken tot voorkoming van reis- en verblijfkosten ter behoorlijke vervulling van het optreden
      dan wel de sportbeoefening;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35g
  - number: 35g.3.d
    text: |-
      aanspraken ingevolge de [Ziektewet][ref1], de [Wet arbeid en zorg][ref2], de
      [Wet werk en inkomen naar arbeidsvermogen][ref3], de [Wet op de arbeidsongeschiktheidsverzekering][ref4] en de
      [Werkloosheidswet][ref5];


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0013008
      [ref3]: https://wetten.overheid.nl/BWBR0019057
      [ref4]: https://wetten.overheid.nl/BWBR0002524
      [ref5]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35g
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0013008
      - id: ref3
        bwb_id: BWBR0019057
      - id: ref4
        bwb_id: BWBR0002524
      - id: ref5
        bwb_id: BWBR0004045
  - number: 35g.3.e
    text: aanspraken, die naar aard en strekking overeenkomen met aanspraken als bedoeld in onderdeel d;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35g
  - number: 35g.3.f
    text: aanspraken op uitkeringen wegens overlijden of invaliditeit ten gevolge van een ongeval;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35g
  - number: 35g.3.g
    text: |-
      bedragen die worden ingehouden als bijdrage voor aanspraken die naar aard en strekking overeenkomen met aanspraken
      bedoeld in onderdeel e, alsmede bijdrage voor aanspraken, bedoeld in onderdeel f;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35g
  - number: 35g.3.h
    text: uitzendrechten voor zover die betrekking hebben op het land van vestiging van het buitenlands gezelschap.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35g
  - number: 35g.4
    text: |-
      Tot de gage behoort mede niet hetgeen blijkens een beschikking van de inspecteur als een niet tot de gage
      behorende vergoeding kan worden aangemerkt (kostenvergoedingsbeschikking). De kostenvergoedingsbeschikking wordt
      op verzoek door de inspecteur verstrekt en is vatbaar voor bezwaar. Het verzoek wordt voor het optreden of de
      sportbeoefening gedaan door het gezelschap of de inhoudingsplichtige, dan wel uiterlijk een maand na het optreden
      of de sportbeoefening door de inhoudingsplichtige. Bij algemene maatregel van bestuur worden nadere regels gesteld
      met betrekking tot de kostenvergoedingsbeschikking.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35g
  - number: 35g.5
    text: |-
      Niet in geld ontvangen gage wordt in aanmerking genomen naar de waarde die daaraan in het economische verkeer kan
      worden toegekend.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35g
  - number: 35g.6
    text: 'Gage wordt beschouwd te zijn ontvangen op het tijdstip:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35g
  - number: 35g.6.a
    text: waarop zij betaald of verrekend wordt, ter beschikking van het gezelschap wordt gesteld of rentedragend wordt;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35g
  - number: 35g.6.b
    text: waarop zij vorderbaar en tevens inbaar wordt, of
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35g
  - number: 35g.6.c
    text: |-
      indien dat later is dan de tijdstippen, bedoeld in de onderdelen a en b en de inhoudingsplichtige een
      kostenvergoedingsbeschikking heeft aangevraagd: uiterlijk een maand na het optreden of de sportbeoefening.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35g
  - number: 35h.1
    text: De verschuldigde belasting bedraagt 20 percent van de gage.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35h
  - number: 35h.2
    text: |-
      Ten aanzien van buitenlandse gezelschappen kan bij algemene maatregel van bestuur, zo nodig onder voorwaarden,
      ten behoeve van uniforme heffing bij grensoverschrijdende evenementen het in het eerste lid genoemde percentage
      van 20 tijdelijk worden verlaagd, doch niet verder dan tot 15 percent. Een krachtens de eerste volzin vastgestelde
      algemene maatregel van bestuur wordt aan de beide kamers der Staten-Generaal overlegd. Hij treedt in werking op
      een tijdstip dat nadat vier weken na de overlegging zijn verstreken bij koninklijk besluit wordt vastgelegd, tenzij
      binnen die termijn door of namens een der kamers of door ten minste een vijfde van het grondwettelijk aantal leden
      van een der kamers de wens te kennen wordt gegeven dat het onderwerp van de algemene maatregel van bestuur bij wet
      wordt geregeld. In dat geval wordt een daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend. Indien het
      voorstel van wet wordt ingetrokken of indien een van de beide Kamers van de Staten-Generaal besluit het voorstel
      niet aan te nemen, wordt de algemene maatregel van bestuur ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35h
  - number: 35h.3
    text: 'In afwijking van het eerste lid bedraagt de verschuldigde belasting 52 percent van de gage:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35h
  - number: 35h.3.a
    text: |-
      indien aan de inhoudingsplichtige de naam, het adres, de woonplaats, het woonland en de geboortedatum van de leider
      of vertegenwoordiger, alsmede de namen van de leden van het gezelschap niet zijn verstrekt;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35h
  - number: 35h.3.b
    text: |-
      indien ten aanzien van het merendeel van de leden geen afschrift van een document als bedoeld in
      [artikel 1, eerste lid, onder 1º tot en met 3º, van de Wet op de identificatieplicht][ref1] aan de
      inhoudingsplichtige is verstrekt of de identiteit niet is vastgesteld en opgenomen in de loonadministratie van de
      inhoudingsplichtige overeenkomstig [artikel 35m, onderdeel c][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel35m
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35h
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 35m
        hoofdstuk: VIIA
  - number: 35h.3.c
    text: |-
      indien het gezelschap terzake onjuiste gegevens heeft verstrekt en de inhoudingsplichtige dit weet of
      redelijkerwijs moet weten.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35h
  - number: 35i.1
    text: De belasting wordt geheven door inhouding op de gage.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35i
  - number: 35i.2
    text: De inhoudingsplichtige is verplicht de belasting in te houden op het tijdstip waarop de gage wordt ontvangen.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35i
  - number: 35i.3
    text: De inhoudingsplichtige is verplicht de ingehouden belasting op aangifte af te dragen.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35i
  - number: 35k
    text: |-
      De leden van het buitenlandse gezelschap zijn gehouden volgens bij ministeriële regeling te stellen regels aan
      het gezelschap:
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35k
  - number: 35k.a
    text: opgave te doen van gegevens waarvan de kennisneming voor de heffing van de belasting van belang kan zijn;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35k
  - number: 35k.b
    text: |-
      inzage te verlenen van een op hen betrekking hebbend document als bedoeld in
      [artikel 1, eerste lid, onder 1º tot en met 3º, van de Wet op de identificatieplicht][ref1], en een afschrift
      daarvan te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35k
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 35l.1
    text: 'Het buitenlandse gezelschap is gehouden volgens bij ministeriële regeling te stellen regels:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35l
  - number: 35l.1.a
    text: |-
      van de leden van het gezelschap opgave te verlangen van gegevens waarvan de kennisneming voor de heffing van de
      belasting van belang kan zijn;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35l
  - number: 35l.1.b
    text: |-
      de identiteit van de leden vast te stellen aan de hand van een document als bedoeld in
      [artikel 1, eerste lid, onder 1º tot en met 3º, van de Wet op de identificatieplicht][ref1] en een afschrift
      daarvan te verlangen;


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35l
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 35l.1.c
    text: |-
      aan de inhoudingsplichtige opgave te doen van gegevens waarvan de kennisneming voor de heffing van de belasting van
      belang kan zijn;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35l
  - number: 35l.1.d
    text: |-
      aan de inhoudingsplichtige ten aanzien van het merendeel van de leden inzage te verlenen van een document als
      bedoeld in [artikel 1, eerste lid, onder 1º tot en met 3º, van de Wet op de identificatieplicht][ref1] om een
      afschrift daarvan in de loonadministratie van de inhoudingsplichtige te laten opnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35l
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 35l.2
    text: |-
      Opgave van naam, adres, woonplaats, woonland en geboortedatum van de leider of vertegenwoordiger alsmede het aantal
      leden van het gezelschap, en opgave van de overige in [dit artikel][ref1] bedoelde gegevens geschiedt door middel
      van de door de inspecteur verstrekte gageverklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel35l
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35l
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 35l
        hoofdstuk: VIIA
  - number: 35m
    text: 'De inhoudingsplichtige is gehouden volgens bij ministeriële regeling te stellen regels:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35m
  - number: 35m.a
    text: |-
      van het buitenlandse gezelschap opgave te verlangen van gegevens waarvan de kennisneming voor de heffing van de
      belasting van belang kan zijn;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35m
  - number: 35m.b
    text: |-
      een loonadministratie te voeren en daarbij de gegevens te administreren met betrekking tot de gage en met
      betrekking tot vergoedingen en verstrekkingen die niet tot de gage behoren;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35m
  - number: 35m.c
    text: |-
      de identiteit van een zo groot mogelijk deel, doch ten minste het merendeel van de
      leden van het gezelschap vast te stellen aan de hand van een document als bedoeld in
      [artikel 1, eerste lid, onder 1º tot en met 3º, van de Wet op de identificatieplicht][ref1], alsmede de aard, het
      nummer en een afschrift daarvan in de loonadministratie op te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35m
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 35n
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor buitenlandse gezelschappen nadere regelen worden
      gesteld inzake de heffing van de belasting, alsmede andere in het kader der wet passende nadere regelen worden
      gegeven ter aanvulling van in de wet geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35n
  - number: 35o
    text: |-
      [Artikel 13bis, tweede lid][ref1], vervalt met ingang van 1 januari 2026.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel13bis
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel35o
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 13bis
        hoofdstuk: II
  - number: 36a
    text: |-
      Met betrekking tot op 31 december 2000 bestaande rechten op vakantieverlof en compensatieverlof is
      [artikel 10, derde lid][ref1] en [artikel 11, eerste lid, onderdeel r, onder 1°][ref2], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel11
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '10'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '11'
        hoofdstuk: II
  - number: 36b
    text: |-
      Met betrekking tot bestaande pensioenaanspraken voor welke op of na 1 januari 1995 een ander
      lichaam als verzekeraar optreedt dan bedoeld in [artikel 18, eerste lid, onderdeel c][ref1], en
      [artikel 18i, onderdeel c][ref2], zoals dat luidde op 31 december 2004, is de in die onderdelen gestelde voorwaarde
      inzake de verzekeraar niet van toepassing en blijft [artikel 19b, eerste lid, onderdeel c, en achtste lid][ref3],
      zoals dat artikel luidde op 31 december 2016, van toepassing. Onder bestaande pensioenaanspraken worden verstaan
      de op 31 december 1994 bestaande aanspraken welke naar of krachtens de tekst van [artikel 11][ref4] zoals dat toen
      luidde, zijn aan te merken als aanspraken die berusten op een pensioenregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel18i
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel19b
      [ref4]: https://wetten.overheid.nl/BWBR0002471#Artikel11
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '18'
        hoofdstuk: IIB
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 18i
        hoofdstuk: IIB
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 19b
        hoofdstuk: IIB
      - id: ref4
        bwb_id: BWBR0002471
        artikel: '11'
        hoofdstuk: II
  - number: 36c.1
    text: |-
      In afwijking van [artikel 13bis, eerste lid, eerste volzin, aanhef en onderdeel a][ref1], wordt voor een auto met
      een datum van eerste toelating van uiterlijk 31 december 2016 als voordeel als bedoeld in artikel 13bis, eerste
      lid, eerste volzin, onderdeel a, op kalenderjaarbasis ten minste 25% van de waarde van de auto in aanmerking
      genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel13bis
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel36c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 13bis
        hoofdstuk: II
  - number: 36c.2
    text: |-
      In afwijking van [artikel 13bis, achttiende lid][ref1], wordt het voordeel, bedoeld in artikel 13bis, eerste lid,
      eerste volzin, voor een auto met een datum van eerste toelating van uiterlijk 31 december 2016 voor een periode
      van 60 maanden te rekenen vanaf de eerste dag van de maand volgend op die waarin de auto voor het eerst te naam is
      gesteld in het kentekenregister, op kalenderjaarbasis verlaagd overeenkomstig de bepalingen die golden op de datum
      van de eerste tenaamstelling in het kentekenregister.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel13bis
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel36c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 13bis
        hoofdstuk: II
  - number: 36c.3
    text: |-
      Met betrekking tot auto’s waarvan het kenteken vóór 1 januari 2014 op naam is gesteld, wordt, waar in het tweede
      lid wordt gesproken over de eerste tenaamstelling van de auto in het kentekenregister, uitgegaan van de eerste
      tenaamstelling van het kenteken van de auto in het kentekenregister.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel36c
  - number: 36c.4
    text: |-
      Voor auto’s waarvoor het kenteken is opgegeven vóór 1 juli 2006 en die niet meer dan vijftien
      jaar geleden voor het eerst in gebruik zijn genomen, wordt de waarde van de auto, in afwijking van
      [artikel 13bis, vijfde lid, onderdeel b][ref1], gesteld op de catalogusprijs met inbegrip van de omzetbelasting en
      de belasting van personenauto’s en motorrijwielen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel13bis
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel36c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 13bis
        hoofdstuk: II
  - number: 36c.5
    text: |-
      [Artikel 9, elfde en twaalfde lid, van de Wet op de belasting van personenauto’s en motorrijwielen 1992][ref1] is
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel9
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel36c
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '9'
  - number: 38b
    text: |-
      Een wijziging van de begrenzingen, bedoeld in [artikel 18, derde lid][ref1], is niet van toepassing op aanspraken
      die vóór de datum van inwerkingtreding van die wijziging zijn ontstaan, voor zover die wijziging niet ten gunste
      van de werknemer of gewezen werknemer is.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel38b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '18'
        hoofdstuk: IIB
  - number: 38c.1
    text: |-
      Voor een op 31 december 2004 bestaande regeling voor vervroegde uittreding als bedoeld in [artikel 18i][ref1],
      zoals dit artikel op 31 december 2004 luidde, blijven tot en met 31 december 2005 de [artikelen 11][ref2],
      [18g][ref3], [18i][ref4], [19][ref5], [19a][ref6], [19b][ref7], [19c][ref8] en [19d][ref9], zoals die luidden op 31
      december 2004, van toepassing en is artikel 32aa niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18i
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel18g
      [ref4]: https://wetten.overheid.nl/BWBR0002471#Artikel18i
      [ref5]: https://wetten.overheid.nl/BWBR0002471#Artikel19
      [ref6]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
      [ref7]: https://wetten.overheid.nl/BWBR0002471#Artikel19b
      [ref8]: https://wetten.overheid.nl/BWBR0002471#Artikel19c
      [ref9]: https://wetten.overheid.nl/BWBR0002471#Artikel19d
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel38c
    references:
      - id: ref1
        bwb_id: BWBR0002471
