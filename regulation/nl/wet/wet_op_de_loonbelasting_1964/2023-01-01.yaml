  - number: '22.1'
    text: Voor de werknemer is de algemene heffingskorting van toepassing.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel22
  - number: '22.2'
    text: |-
      De algemene heffingskorting bedraagt € 3.070, verminderd, doch niet verder dan tot nihil, met 6,095% van het
      gedeelte van het belastbare loon dat meer bedraagt dan € 22.660.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel22
  - number: 22a.1
    text: Voor de werknemer die loon uit tegenwoordige arbeid geniet, is de arbeidskorting van toepassing.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel22a
  - number: 22a.2
    text: 'De arbeidskorting wordt berekend over het loon uit tegenwoordige arbeid en bedraagt:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel22a
  - number: 22a.2.a
    text: '8,231% van dat loon met een maximum van € 884, vermeerderd met:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel22a
  - number: 22a.2.b
    text: |-
      29,861% van dat loon voorzover dit bij een tijdvakloon op jaarbasis meer bedraagt dan € 10.740, waarbij de som van
      de bedragen berekend op de voet van de onderdelen a en b niet meer bedraagt dan € 4.605, alsmede vermeerderd met:
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel22a
  - number: 22a.2.c
    text: |-
      3,085% van het arbeidsinkomen voor zover dat meer bedraagt dan € 23.201, waarbij de som van de bedragen berekend op
      de voet van de onderdelen a, b en c niet meer bedraagt dan € 5.052, en verminderd, doch niet verder dan tot nihil,
      met:
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel22a
  - number: 22a.2.d
    text: 6,51% van dat loon voorzover dit bij een tijdvakloon op jaarbasis meer bedraagt dan € 37.691.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel22a
  - number: 22a.3
    text: 'Met loon uit tegenwoordige arbeid wordt gelijkgesteld:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel22a
  - number: 22a.3.a
    text: |-
      loon genoten wegens tijdelijke inactiviteit als bedoeld in
      [artikel 628 van Boek 7 van het Burgerlijk Wetboek][ref1], alsmede hetgeen door de werknemer met een
      publiekrechtelijke dienstbetrekking wordt genoten op grond van naar aard en strekking overeenkomstige regelingen,
      voor een tijdvak van maximaal 104 weken;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel628
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '628'
  - number: 22a.3.b
    text: |-
      loon genoten als garantieloon als bedoeld in
      [artikel 628a, eerste, derde en achtste lid, van Boek 7 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel628a
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 628a
  - number: 22a.3.c
    text: |-
      loon genoten wegens tijdelijke arbeidsongeschiktheid als bedoeld in
      [artikel 629 van Boek 7 van het Burgerlijk Wetboek][ref1], alsmede hetgeen door de werknemer met een
      publiekrechtelijke dienstbetrekking wordt genoten op grond van naar aard en strekking overeenkomstige regelingen
      en uitkeringen ingevolge de [Ziektewet][ref2], voor zover die betrekking hebben op de periode waarin de
      dienstbetrekking in de zin van die wet nog niet is beëindigd of voor zover die voortvloeien uit een vrijwillige
      verzekering als bedoeld in [artikel 64 van die wet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel64
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel22a
    references:
