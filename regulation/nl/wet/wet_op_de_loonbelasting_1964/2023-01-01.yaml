  - number: '23.1'
    text: |-
      De heffingskorting voor de loonbelasting wordt slechts toegepast ingeval de werknemer daartoe een schriftelijk,
      gedagtekend en ondertekend verzoek aan de inhoudingsplichtige heeft gedaan. Het verzoek geldt tot het tijdstip
      waarop de werknemer het verzoek schriftelijk, gedagtekend en ondertekend intrekt.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel23
  - number: '23.2'
    text: |-
      Indien de werknemer over loontijdvakken die geheel of gedeeltelijk samenvallen loon geniet uit meer dan een
      dienstbetrekking of vroegere dienstbetrekking dan wel van meer dan een inhoudingsplichtige en dit loon voor de
      berekening van de belasting niet wordt samengevoegd, kan de werknemer de heffingskorting voor de loonbelasting
      slechts in een dienstbetrekking dan wel tegenover een inhoudingsplichtige geldend maken.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel23
  - number: '23.3'
    text: 'In afwijking van het eerste lid wordt de belasting ingehouden:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel23
  - number: 23.3.a
    text: 'met toepassing van de heffingskorting voor de loonbelasting:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel23
  - number: 23.3.a.1°
    text: |-
      indien [artikel 27, zesde lid][ref1], toepassing vindt, met betrekking tot het loon van het in dat lid bedoelde
      kind;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel27
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '27'
        hoofdstuk: IV
  - number: 23.3.a.2°
    text: |-
      met betrekking tot het loon in de vorm van uitkeringen ingevolge de [Algemene Ouderdomswet][ref1]
      dan wel loon uit vroegere dienstbetrekking waarin zijn begrepen de uitkeringen ingevolge de Algemene
      Ouderdomswet dat een in Nederland wonende werknemer die de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref2], heeft bereikt geniet, tenzij de werknemer een
      schriftelijk, gedagtekend en ondertekend verzoek aan de inhoudingsplichtige heeft gedaan om de heffingskorting voor
      de loonbelasting niet toe te passen;


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 23.3.b
    text: |-
      zonder toepassing van de heffingskorting voor de loonbelasting met betrekking tot tegemoetkomingen als bedoeld in
      [artikel 10 van de Wet tegemoetkoming chronisch zieken en gehandicapten][ref1], zoals dat luidde op 31 december
      2013, [artikel 63a van de Wet werk en inkomen naar arbeidsvermogen](onbekend), [artikel 65l van de Wet op
      de arbeidsongeschiktheidsverzekering](onbekend), [artikel 67i van de Wet arbeidsongeschiktheidsverzekering
      zelfstandigen](onbekend) en [artikel 3:75 van de Wet werk en arbeidsondersteuning jonggehandicapten](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0025003#Artikel10
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0025003
        artikel: '10'
  - number: '23.4'
    text: |-
      In afwijking in zoverre van het eerste en tweede lid wordt door de werknemer, die een uitkering of
      inkomensvoorziening geniet op grond van de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref1], het
      deel van de heffingskorting dat betrekking heeft op de jonggehandicaptenkorting geldend gemaakt tegenover de
      inhoudingsplichtige die de uitkering of inkomensvoorziening op grond van de Wet arbeidsongeschiktheidsvoorziening
      jonggehandicapten uitbetaalt.


      [ref1]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0008657
  - number: '23.5'
    text: |-
      De inhoudingsplichtige bewaart het in het eerste en derde lid bedoelde verzoek ten minste vijf jaren na het einde
      van het kalenderjaar waarin de dienstbetrekking is geëindigd.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel23
  - number: '24'
    text: |-
      Voor de toepassing van [de artikelen 21][ref1] tot en met [22d][ref2] ter bepaling van de hoogte van de
      heffingskorting is beslissend de toestand op het tijdstip waarop de belasting moet worden ingehouden, met dien
      verstande dat voor de ouderenkorting en de alleenstaande ouderenkorting beslissend is de toestand aan het einde van
      de kalendermaand waarin de belasting moet worden ingehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel22d
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '21'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 22d
        hoofdstuk: III
  - number: '25.1'
    text: |-
      Loontijdvak is het tijdvak waarover het loon wordt genoten. Het bedrag van de belasting over een ander loontijdvak
      dan een jaar wordt door herleiding bepaald. Bij de herleiding wordt een jaar op 260 dagen, een maand op 65/3 dag,
      een week op 5 dagen en een tijdvak dat korter is dan een dag op een dag gesteld.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel25
  - number: '25.2'
    text: |-
      Bij ministeriële regeling kunnen loonbelastingtabellen worden vastgesteld voor loontijdvakken waarvoor Onze
      Minister dit nodig acht. In deze tabellen wordt de heffingskorting voor de loonbelasting op zodanige wijze
      verwerkt dat naast het bedrag aan loon het belastingbedrag of belastingpercentage is vermeld. In deze tabellen
      kan de verwerking van de heffingskorting geheel of ten dele achterwege worden gelaten en kan bij de verwerking
      van de heffingskorting rekening worden gehouden met algemeen voorkomende beloningen die worden belast volgens een
      tabel voor bijzondere beloningen als bedoeld in [artikel 26][ref1]. Bij het opstellen van deze tabellen kunnen
      loonklassen en afrondingen worden aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel26
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '26'
        hoofdstuk: III
  - number: '25.3'
    text: |-
      De loonbelastingtabellen worden vastgesteld op basis van de daarvoor benodigde gegevens zoals die vermoedelijk
      zullen luiden op het tijdstip van inwerkingtreding van de tabellen. Voorzover de toegepaste gegevens zodanig
      afwijken van de gegevens zoals die luiden op het tijdstip van inwerkingtreding dat bij toepassing van
      laatstbedoelde gegevens andere tabellen zouden zijn vastgesteld, worden bij ministeriële regeling nieuwe tabellen
      vastgesteld, ingaande ten hoogste zes maanden na het in de eerste volzin bedoelde tijdstip van inwerkingtreding,
      waarin de in de verstreken loontijdvakken ontstane afwijking zoveel mogelijk in de nog niet verstreken
      loontijdvakken van het kalenderjaar wordt ongedaan gemaakt.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel25
  - number: '25.4'
    text: |-
      In afwijking van het eerste lid wordt een tijdvak waarvan het tijdvak waarover het loon wordt genoten, deel
      uitmaakt, als loontijdvak aangemerkt ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel25
  - number: 25.4.a
    text: de werknemer die doorgaans op minder dan vijf dagen per week werkzaam is; en
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel25
  - number: 25.4.b
    text: |-
      de loon uit tegenwoordige dienstbetrekking genietende werknemer die met betrekking tot een kalenderkwartaal als
      student of scholier wordt aangemerkt en die schriftelijk, gedagtekend en ondertekend te kennen heeft gegeven dat te
      zijnen aanzien het kwartaal als loontijdvak wordt aangemerkt.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel25
  - number: '26.1'
    text: |-
      Tantièmes, gratificaties en andere beloningen die in de regel slechts eenmaal of eenmaal per jaar worden toegekend,
      worden belast volgens loonbelastingtabellen voor bijzondere beloningen die bij ministeriële regeling worden
      vastgesteld met overeenkomstige toepassing van [artikel 25, tweede en derde lid][ref1], met dien verstande dat in
      deze tabellen jaarlonen en belastingpercentages worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel25
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '25'
        hoofdstuk: III
  - number: '26.2'
    text: |-
      Overwerkloon mag worden belast naar het percentage dat wordt aangewezen door de loonbelastingtabel voor bijzondere
      beloningen.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel26
  - number: '26.3'
    text: 'Als jaarloon geldt voor de toepassing van dit artikel:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel26
  - number: 26.3.a
    text: |-
      ingeval de werknemer over het gehele voorafgaande kalenderjaar van de inhoudingsplichtige loon heeft genoten: het
      in dat jaar genoten loon;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel26
  - number: 26.3.b
    text: |-
      ingeval de werknemer over een gedeelte van het voorafgaande kalenderjaar van de inhoudingsplichtige loon heeft
      genoten: het tot een jaarloon herleide bedrag van het in dat jaar genoten loon;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel26
  - number: 26.3.c
    text: |-
      in andere gevallen: het in het kalenderjaar te genieten loon, indien over het gehele jaar van de
      inhoudingsplichtige loon zou worden genoten.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel26
  - number: '26.4'
    text: |-
      Als overwerkloon gelden voor de toepassing van dit artikel de beloningen ter zake van arbeid welke wordt verricht
      gedurende de tijd die uitgaat boven de voor de werknemer geldende normale arbeidsduur.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel26
  - number: '26.5'
    text: |-
      Voor het geval de werknemer binnen een samenhangende groep inhoudingsplichtigen in de zin van [artikel 27e][ref1]
      van inhoudingsplichtige is gewisseld, kunnen voor de toepassing van het derde lid bij ministeriële regeling
      aanvullende bepalingen worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel27e
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 27e
        hoofdstuk: IV
  - number: 26b
    text: |-
      In afwijking van de [artikelen 20][ref1], [20a][ref2], [20b][ref3] en [26][ref4] bedraagt de belasting 52% van het
      loon ingeval:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel20a
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel20b
      [ref4]: https://wetten.overheid.nl/BWBR0002471#Artikel26
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel26b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '20'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 20a
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 20b
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0002471
        artikel: '26'
        hoofdstuk: III
  - number: 26b.a
    text: de werknemer zijn naam, adres, woonplaats of burgerservicenummer niet aan de inhoudingsplichtige heeft verstrekt;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel26b
  - number: 26b.b
    text: |-
      bij een werknemer die loon uit tegenwoordige dienstbetrekking geniet, de inhoudingsplichtige
      zijn identiteit niet heeft vastgesteld en opgenomen in de loonadministratie overeenkomstig
      [artikel 28, eerste lid, onderdeel f][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel28
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel26b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '28'
        hoofdstuk: IV
  - number: 26b.c
    text: |-
      bij een werknemer die loon uit tegenwoordige dienstbetrekking geniet, vreemdeling is in de zin van de
      [Vreemdelingenwet 2000][ref1] en niet behoort tot de categorie werknemers die op grond van overeenkomsten van
      internationaal recht is uitgezonderd van de verplichting tot het hebben van een geldige verblijfsvergunning als
      bedoeld in die wet en een geldige tewerkstellingsvergunning als bedoeld in de [Wet arbeid vreemdelingen][ref2], de
      inhoudingsplichtige zijn verblijfsrechtelijke positie ter zake van het verrichten van arbeid niet heeft vastgesteld
      en opgenomen in de loonadministratie overeenkomstig [artikel 28, eerste lid, onderdeel f][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0011823
      [ref2]: https://wetten.overheid.nl/BWBR0007149
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel28
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel26b
    references:
      - id: ref1
        bwb_id: BWBR0011823
      - id: ref2
        bwb_id: BWBR0007149
      - id: ref3
        bwb_id: BWBR0002471
        artikel: '28'
        hoofdstuk: IV
  - number: 26b.d
    text: |-
      de werknemer ter zake van de in de onderdelen a tot en met c bedoelde inlichtingen onjuiste gegevens heeft
      verstrekt en de inhoudingsplichtige dit weet of redelijkerwijs moet weten.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel26b
  - number: '27.1'
    text: De belasting wordt geheven door inhouding op het loon.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel27
  - number: '27.2'
    text: De inhoudingsplichtige is verplicht de belasting in te houden op het tijdstip waarop het loon wordt genoten.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel27
  - number: '27.3'
    text: De inhouding vindt plaats volgens de op het tijdstip van inhouding voor de werknemer geldende loonbelastingtabel.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel27
  - number: '27.4'
    text: |-
      Overtreft de belasting het van de inhoudingsplichtige genoten loon in geld, dan wordt het ontbrekende geacht te
      zijn ingehouden op het in het tweede lid omschreven tijdstip, met dien verstande dat de inhoudingsplichtige bevoegd
      is dat ontbrekende te verhalen op de werknemer. Ingeval [artikel 27b, eerste lid][ref1], toepassing vindt, is de
      vorige volzin van overeenkomstige toepassing met betrekking tot het gezamenlijke bedrag van de belasting en de
      premie voor de volksverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel27b
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 27b
        hoofdstuk: IV
  - number: '27.5'
    text: De inhoudingsplichtige is verplicht de in een tijdvak ingehouden belasting op aangifte af te dragen.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel27
  - number: '27.6'
    text: |-
      Onder bij ministeriële regeling te stellen voorwaarden kunnen ten aanzien van een in de onderneming van zijn
      ouder werkzaam kind dat behoort tot de huishouding van die ouder en niet is verzekerd ingevolge enige andere
      sociale verzekering dan een volksverzekering in de zin van de [Wet financiering sociale verzekeringen][ref1] of
      de zorgverzekering in de zin van de [Zorgverzekeringswet][ref2], een van het tweede lid afwijkend tijdstip van
      inhouding en een van het derde lid afwijkende loonbelastingtabel worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0017745
      [ref2]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0017745
      - id: ref2
        bwb_id: BWBR0018450
  - number: 27bis
    text: |-
      In afwijking van [artikel 27][ref1] kan de overeenkomstig een door de inhoudingsplichtige bestendig gevolgde
      gedragslijn in de maand januari van het kalenderjaar gedane inhouding op loon dat de werknemer met betrekking
      tot een of meer loontijdvakken binnen het voorgaande kalenderjaar toekomt, worden begrepen in de laatste aangifte
      met betrekking tot het voorgaande kalenderjaar. Het loon waarop deze inhouding betrekking heeft, wordt voor de
      berekening van de inhouding gerekend tot het loon van het desbetreffende loontijdvak.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel27
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel27bis
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '27'
        hoofdstuk: IV
  - number: 27a.1
    text: |-
      In afwijking in zoverre van het overigens bij of krachtens deze wet bepaalde wordt de belasting over de in
      [artikel 31][ref1] bedoelde eindheffingsbestanddelen geheven van de inhoudingsplichtige.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '31'
        hoofdstuk: V
        afdeling: '1'
  - number: 27a.2
    text: |-
      De heffing over eindheffingsbestanddelen, met uitzondering van de aan naheffing onderworpen
      eindheffingsbestanddelen als bedoeld in [artikel 31, eerste lid, onderdeel a][ref1], geschiedt als ware de door de
      inhoudingsplichtige in een tijdvak verschuldigde belasting door hem op aangifte af te dragen belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '31'
        hoofdstuk: V
        afdeling: '1'
  - number: 27b.1
    text: |-
      Indien de werknemer ook premieplichtig is voor de volksverzekeringen geschiedt de heffing van de belasting en de
      premie voor de volksverzekeringen in één bedrag dan wel in één percentage, met overeenkomstige toepassing van de
      regels die gelden voor de heffing en de invordering van de loonbelasting.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel27b
  - number: 27b.2
    text: |-
      Voor gevallen waarin het eerste lid toepassing vindt, worden, met overeenkomstige toepassing van
      [artikel 25][ref1], bij ministeriële regeling tabellen vastgesteld waarin telkens de belasting en de premie voor de
      volksverzekeringen in één bedrag dan wel in één percentage worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel25
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel27b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '25'
        hoofdstuk: III
  - number: 27b.3
    text: |-
      Bij ministeriele regeling worden voor daarbij aan te wijzen gevallen berekeningsvoorschriften vastgesteld aan de
      hand waarvan uit de in het tweede lid bedoelde tabellen het bedrag van de belasting wordt afgeleid.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel27b
  - number: 27c.1
    text: |-
      Indien ten aanzien van de werknemer ook premieplicht voor de werknemersverzekeringen bestaat, geschiedt de heffing
      van de premies voor de werknemersverzekeringen gelijktijdig met die van de belasting en geschiedt de afdracht van
      die premies en de belasting op één aangifte, een en ander met overeenkomstige toepassing van de regels die gelden
      voor de heffing en de invordering van de loonbelasting.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel27c
  - number: 27c.2
    text: |-
      Toerekening van een betaling op de aangifte bedoeld in het eerste lid geschiedt naar evenredigheid aan de belasting
      en aan de premies voor de werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel27c
  - number: 27d.1
    text: |-
      Indien de werknemer ook verzekeringsplichtig is in de zin van de [Zorgverzekeringswet][ref1], geschiedt de heffing
      van de ingevolge de Zorgverzekeringswet over het loon verschuldigde inkomensafhankelijke bijdrage gelijktijdig met
      die van de belasting en geschiedt de afdracht van die bijdrage en de belasting op één aangifte, een en ander met
      overeenkomstige toepassing van de regels die gelden voor de heffing en de invordering van de loonbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel27d
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: 27d.2
    text: |-
      Toerekening van een betaling op de aangifte, bedoeld in het eerste lid, geschiedt naar evenredigheid aan de
      belasting en aan de ingevolge de [Zorgverzekeringswet][ref1] verschuldigde inkomensafhankelijke bijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel27d
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: 27d.3
    text: |-
      De vorige leden zijn van overeenkomstige toepassing op de bijdragevervangende belasting, bedoeld in
      [artikel 57 van de Zorgverzekeringswet][ref1], die is verschuldigd over het loon van de al dan niet als
      verzekeringsplichtige in de zin van de [Zorgverzekeringswet][ref2] aan te merken werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel27d
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '57'
      - id: ref2
        bwb_id: BWBR0018450
  - number: 27da
    text: |-
      Voorzover de belasting en de premie voor de volksverzekeringen, de premies voor de werknemersverzekeringen
      of de ingevolge de [Zorgverzekeringswet][ref1] verschuldigde inkomensafhankelijke bijdrage
      gelijktijdig worden geheven en [artikel 28b][ref2] van deze wet of [artikel 67b][ref3],
      [67c][ref4] of [67f van de Algemene wet inzake rijksbelastingen][ref5] toepassing vindt, wordt
      [dat artikel][ref6] slechts eenmaal toegepast, met dien verstande dat alsdan voor de toepassing van
      [artikel 67f, tweede lid, van de Algemene wet inzake rijksbelastingen][ref7] wordt uitgegaan van het gezamenlijk
      gelijktijdig geheven bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel28b
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel67b
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel67c
      [ref5]: https://wetten.overheid.nl/BWBR0002320#Artikel67f
      [ref6]: https://wetten.overheid.nl/BWBR0002320#Artikel67f
      [ref7]: https://wetten.overheid.nl/BWBR0002320#Artikel67f
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel27da
    references:
      - id: ref1
        bwb_id: BWBR0018450
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 28b
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0002320
        artikel: 67b
      - id: ref4
        bwb_id: BWBR0002320
        artikel: 67c
      - id: ref5
        bwb_id: BWBR0002320
        artikel: 67f
      - id: ref6
        bwb_id: BWBR0002320
        artikel: 67f
      - id: ref7
        bwb_id: BWBR0002320
        artikel: 67f
  - number: 27e.1
    text: |-
      Met het oog op het beperken van administratieve lasten van een aantal inhoudingsplichtigen die tegelijkertijd
      aangiften doen, kan de inspecteur op hun verzoek, onder door hem te stellen voorwaarden, deze inhoudingsplichtigen
      aanwijzen als samenhangende groep inhoudingsplichtigen.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel27e
  - number: 27e.2
    text: |-
      De aanwijzing kan en de daarbij gestelde voorwaarden kunnen, al dan niet op verzoek van een of meer
      inhoudingsplichtigen, worden gewijzigd of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel27e
  - number: 27e.3
    text: Aanwijzing, wijziging en intrekking vinden plaats bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel27e
  - number: '28.1'
    text: |-
      De inhoudingsplichtige is gehouden volgens bij ministeriële regeling te stellen regels, waaronder regels inzake de
      wijze waarop:
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel28
  - number: 28.1.a
    text: |-
      van de werknemer opgave te verlangen van gegevens waarvan de kennisneming voor de heffing van de belasting van
      belang kan zijn;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel28
  - number: 28.1.b
    text: de in onderdeel *a* bedoelde gegevens door te geven aan een andere inhoudingsplichtige;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel28
  - number: 28.1.c
    text: |-
      een loonadministratie te voeren en daarbij de gegevens te administreren met betrekking tot de bij ministeriële
      regeling aan te wijzen uitkeringen en verstrekkingen welke ingevolge [artikel 11][ref1] niet tot het loon behoren;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '11'
        hoofdstuk: II
  - number: 28.1.d
    text: |-
      aan de inspecteur opgave te verstrekken van de bij ministeriële regeling, in overeenstemming met Onze Minister
      van Sociale Zaken en Werkgelegenheid, en na overleg met het Centraal Bureau voor de Statistiek, te bepalen
      gegevens, bedoeld in [artikel 7, eerste lid, van de Algemene wet inzake rijksbelastingen][ref1], waaronder
      gegevens ten behoeve van de doelen van de polisadministratie, bedoeld in
      [artikel 33, tweede lid, onderdelen a, d en e, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2]
      ;


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel33
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '33'
  - number: 28.1.e
    text: |-
      aan de werknemer opgave te verstrekken van het in het voorafgaande kalenderjaar genoten loon, de op dat loon
      ingehouden belasting en premie voor de volksverzekeringen, de op dat loon ingehouden inkomensafhankelijke
      bijdrage [Zorgverzekeringswet][ref1], de over dat loon door de inhoudingsplichtige verschuldigde premies
      werknemersverzekeringen en inkomensafhankelijke bijdrage Zorgverzekeringswet en de bij de toepassing van
      de loonbelastingtabellen, bedoeld in [artikel 25, tweede lid][ref2], met de loonbelasting en premie voor de
      volksverzekeringen verrekende arbeidskorting;


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel25
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0018450
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '25'
        hoofdstuk: III
  - number: 28.1.f
    text: |-
      van de werknemer die loon uit tegenwoordige dienstbetrekking geniet vast
      te stellen de identiteit aan de hand van een document als bedoeld in
      [artikel 1, eerste lid, onder 1° tot en met 3°, van de Wet op de identificatieplicht][ref1] en – zo de werknemer
      een vreemdeling is in de zin van de [Vreemdelingenwet 2000][ref2] en niet behoort tot de categorie werknemers die
      op grond van overeenkomsten van internationaal recht is uitgezonderd van de verplichting tot het hebben van een
      geldige verblijfsvergunning als bedoeld in die wet en een geldige tewerkstellingsvergunning als bedoeld in de Wet
      arbeid vreemdelingen – tevens de verblijfsrechtelijke status ter zake van het verrichten van arbeid aan de hand van
      een geldige verblijfsvergunning of aan de hand van een geldige tewerkstellingsvergunning, alsmede van een en ander
      de aard, het nummer en een afschrift daarvan in de loonadministratie op te nemen;


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0011823
  - number: 28.1.g
    text: |-
      ingeval de inspecteur hem bij voor bezwaar vatbare beschikking daartoe heeft verplicht, voor de datum van aanvang
      van de werkzaamheden van een werknemer aan de inspecteur opgave te verstrekken van gegevens waarvan kennisneming
      voor de heffing van de belasting van belang kan zijn (eerstedagsmelding), met dien verstande dat indien de
      dienstbetrekking is overeengekomen op de datum waarop de werkzaamheden aanvangen, de eerstedagsmelding wordt gedaan
      voor de aanvang van de werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel28
  - number: 28.1.h
    text: mededeling aan de inspecteur te doen omtrent het einde van zijn inhoudingsplicht.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel28
  - number: '28.2'
    text: |-
      Het eerste lid is niet van toepassing ten aanzien van de werknemer die niet in Nederland woont en die werkzaamheden
      verricht of heeft verricht in een in [artikel 2, derde lid][ref1], genoemde dienstbetrekking, indien het
      heffingrecht over het loon uit die dienstbetrekking op grond van een belastingverdrag niet aan Nederland is
      toegewezen en de werknemer niet premieplichtig is voor de volksverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel2
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '2'
        hoofdstuk: I
  - number: 28bis.1
    text: |-
      De inspecteur kan de verplichting tot het doen van eerstedagsmeldingen slechts opleggen indien ten aanzien van de
      inhoudingsplichtige in de periode van zes maanden welke voorafgaat aan de dagtekening van de beschikking, bedoeld
      in [artikel 28, eerste lid, onderdeel g][ref1], een van de volgende gebeurtenissen zich heeft voorgedaan:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel28
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel28bis
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '28'
        hoofdstuk: IV
  - number: 28bis.1.a
    text: |-
      een naheffingsaanslag in verband met de toepassing van [artikel 30a][ref1] is opgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel30a
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel28bis
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 30a
        hoofdstuk: IV
  - number: 28bis.1.b
    text: |-
      een vergrijpboete als bedoeld in [artikel 67f van de Algemene wet inzake rijksbelastingen][ref1] is opgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67f
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel28bis
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 67f
  - number: 28bis.1.c
    text: |-
      een boete ter zake van een of meer beboetbare feiten als genoemd in
      [artikel 18 van de Wet arbeid vreemdelingen][ref1] is opgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel18
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel28bis
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '18'
  - number: 28bis.1.d
    text: |-
      [artikel 76 van de Algemene wet inzake rijksbelastingen][ref1] toepassing heeft gevonden, of


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel76
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel28bis
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '76'
  - number: 28bis.1.e
    text: |-
      strafvervolging is ingesteld en het onderzoek ter terechtzitting een aanvang heeft genomen ter zake
      van een of meer strafbare feiten als bedoeld in [artikel 19c van de Wet arbeid vreemdelingen][ref1],
      in [artikel 47 van de Handelsregisterwet 2007][ref2] of in de [artikelen 68][ref3] en
      [69 van de Algemene wet inzake rijksbelastingen][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel19c
      [ref2]: https://wetten.overheid.nl/BWBR0021777#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel68
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel69
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel28bis
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: 19c
      - id: ref2
        bwb_id: BWBR0021777
        artikel: '47'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '68'
      - id: ref4
        bwb_id: BWBR0002320
        artikel: '69'
  - number: 28bis.2
    text: |-
      De verplichting tot het doen van eerstedagsmeldingen vervalt drie jaren na de dagtekening van de beschikking
      waarbij die verplichting is opgelegd of zoveel eerder als deze beschikking bij voor bezwaar vatbare beschikking
      is ingetrokken omdat de grond, bedoeld in het eerste lid, voor het opleggen van die verplichting is komen te
      vervallen. In afwijking in zoverre van de eerste volzin vervalt de verplichting vijf jaren na de dagtekening van
      de beschikking ingeval aan de inhoudingsplichtige eerder een verplichting tot het doen van eerstedagsmeldingen
      is opgelegd.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel28bis
  - number: 28bis.3
    text: |-
      In de beschikking waarbij de verplichting tot het doen van eerstedagsmeldingen wordt opgelegd, wordt vermeld welke
      van de in het eerste lid genoemde gebeurtenissen grond is voor het opleggen van de verplichting. Tevens wordt in de
      beschikking vermeld met ingang van welke datum de verplichting vervalt.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel28bis
  - number: 28a.1
    text: |-
      Bij ministeriële regeling wordt bepaald van welke gegevens opgave wordt verlangd in geval van een onjuiste
      of onvolledige aangifte en kunnen regels worden gesteld over de wijze waarop, de vorm waarin en de termijnen
      waarbinnen die gegevens worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel28a
  - number: 28a.2
    text: |-
      De inhoudingsplichtige of gewezen inhoudingsplichtige is gehouden, al dan niet op verzoek van de inspecteur, door
      middel van een correctiebericht de juiste en volledige gegevens, bedoeld in het eerste lid, te verstrekken indien:
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel28a
  - number: 28a.2.a
    text: |-
      hij in het kalenderjaar met betrekking tot een aangifte over een tijdvak in het kalenderjaar constateert dat die
      aangifte onjuist of onvolledig is;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel28a
  - number: 28a.2.b
    text: |-
      de inspecteur in het kalenderjaar met betrekking tot een aangifte over een tijdvak in het kalenderjaar constateert
      dat die aangifte onjuist of onvolledig is;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel28a
  - number: 28a.2.c
    text: |-
      hij binnen vijf jaren na het einde van een verstreken kalenderjaar met betrekking tot een aangifte over een tijdvak
      in dat kalenderjaar constateert dat die aangifte onjuist of onvolledig is en:
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel28a
  - number: 28a.2.c.1°
    text: die aangifte niet is hersteld;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel28a
  - number: 28a.2.c.2°
    text: de aangiftetermijn van de laatste aangifte over dat kalenderjaar is verstreken;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel28a
  - number: 28a.2.d
    text: |-
      de inspecteur binnen vijf jaren na het einde van een verstreken kalenderjaar met betrekking tot een aangifte over
      een tijdvak in dat kalenderjaar constateert dat die aangifte onjuist of onvolledig is en:
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel28a
  - number: 28a.2.d.1°
    text: die aangifte niet is hersteld;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel28a
  - number: 28a.2.d.2°
    text: de aangiftetermijn van de laatste aangifte over dat kalenderjaar is verstreken.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel28a
  - number: 28a.3
    text: |-
      Een correctiebericht als bedoeld in het tweede lid is geen bezwaarschrift in de zin van de
      [Algemene wet inzake rijksbelastingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: 28a.4
    text: |-
      Indien bij de aangifte een correctiebericht is ingediend en het saldo van de te betalen belasting van
      de aangifte en het correctiebericht positief is, is de inhoudingsplichtige, in zoverre in afwijking
      van [artikel 19, eerste lid, van de Algemene wet inzake rijksbelastingen][ref1], gehouden dit
      saldo aan de ontvanger te betalen. Voorzover het bedrag van het correctiebericht in mindering wordt
      gebracht op de bij de aangifte te betalen belasting, wordt belastingrente vergoed overeenkomstig
      [hoofdstuk VA van de Algemene wet inzake rijksbelastingen][ref2]. De inspecteur stelt het bedrag van de
      belastingrente vast bij voor bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002320#HoofdstukVA
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0002320
        hoofdstuk: VA
  - number: 28a.5
    text: Bij toepassing van het vorige lid wordt een betaling zoveel mogelijk toegerekend aan het correctiebericht.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel28a
  - number: 28a.6
    text: |-
      Voor toepassing van de [artikelen 20][ref1], [67c][ref2] en [67f van de Algemene wet inzake rijksbelastingen][ref3],
      wordt met geheel of gedeeltelijk niet betaald zijn van belasting die op aangifte behoort te worden afgedragen
      gelijkgesteld het geval waarin naar aanleiding van een ingediend correctiebericht te veel is gesaldeerd of
      teruggegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel67c
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel67f
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 67c
      - id: ref3
        bwb_id: BWBR0002320
        artikel: 67f
  - number: 28a.7
    text: |-
      In aanvulling op [artikel 20, derde lid, van de Algemene wet inzake rijksbelastingen][ref1] vervalt, indien te veel
      is gesaldeerd, de bevoegdheid tot naheffing door verloop van vijf jaren na het einde van het kalenderjaar waarin de
      saldering heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel20
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '20'
  - number: 28b.1
    text: |-
      Indien de inhoudingsplichtige de correcties, bedoeld in [artikel 28a, tweede lid][ref1], niet, onjuist, onvolledig
      dan wel niet binnen de gestelde termijn heeft ingediend, vormt dit een verzuim terzake waarvan de inspecteur hem
      een bestuurlijke boete van ten hoogste € 1.377 kan opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel28a
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 28a
        hoofdstuk: IV
  - number: 28b.2
    text: |-
      De bevoegdheid tot het opleggen van een bestuurlijke boete wegens het feit, bedoeld in
      [artikel 28a, tweede lid, aanhef en onderdelen a en c][ref1], vervalt door verloop van vijf jaar na het einde van
      het kalenderjaar van de aangifte waarop het correctiebericht betrekking had moeten hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel28a
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 28a
        hoofdstuk: IV
  - number: 28b.3
    text: |-
      De bevoegdheid tot het opleggen van een bestuurlijke boete wegens het feit, bedoeld in
      [artikel 28a, tweede lid, aanhef en onderdelen b en d][ref1], vervalt door verloop van een jaar na het einde van de
      termijn waarbinnen het correctiebericht had moeten worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel28a
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 28a
        hoofdstuk: IV
  - number: 28b.4
    text: |-
      Aan de inhoudingsplichtige die een onjuiste of onvolledige aangifte heeft gedaan en die alsnog de
      juiste of volledige gegevens door middel van een correctiebericht als bedoeld in [artikel 28a][ref1]
      verstrekt voordat hij weet of redelijkerwijs moet vermoeden dat de inspecteur met de onjuistheid
      of onvolledigheid bekend is of bekend zal worden, wordt een bestuurlijke boete als bedoeld in
      [artikel 67b, tweede lid, van de Algemene wet inzake rijksbelastingen][ref2] ter zake van het feit van de onjuiste
      of onvolledige aangifte niet opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel28a
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel67b
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 28a
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 67b
  - number: 28b.5
    text: |-
      [Artikel 67cb van de Algemene wet inzake rijksbelastingen][ref1] is van overeenkomstige toepassing op het in het
      eerste lid genoemde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67cb
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 67cb
  - number: 28c.1
    text: |-
      Indien de inhoudingsplichtige de opgave, bedoeld in [artikel 28, eerste lid, onderdeel g][ref1], niet, onjuist,
      onvolledig dan wel niet binnen de gestelde termijn heeft verstrekt, vormt dit een verzuim terzake waarvan de
      inspecteur hem een bestuurlijke boete van ten hoogste € 1.377 kan opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel28
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel28c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '28'
        hoofdstuk: IV
  - number: 28c.2
    text: |-
      De bevoegdheid tot het opleggen van een bestuurlijke boete wegens het feit, bedoeld in het eerste
      lid, vervalt door verloop van één jaar na het einde van het kalenderjaar waarin de opgave, bedoeld in
      [artikel 28, eerste lid, onderdeel g][ref1], had moeten worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel28
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel28c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '28'
        hoofdstuk: IV
  - number: 28c.3
    text: |-
      [Artikel 67cb van de Algemene wet inzake rijksbelastingen][ref1] is van overeenkomstige toepassing op het in het
      eerste lid genoemde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67cb
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel28c
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 67cb
  - number: '29.1'
    text: |-
      De werknemer is volgens bij ministeriële regeling te stellen regels gehouden aan de inhoudingsplichtige
      opgave te verstrekken van gegevens waarvan de kennisneming voor de heffing van de belasting van belang
      kan zijn. Ingeval de werknemer loon uit tegenwoordige dienstbetrekking geniet, is hij voorts gehouden aan
      de inhoudingsplichtige ter inzage te verstrekken, een op hem betrekking hebbend document als bedoeld in
      [artikel 1, eerste lid, onder 1° tot en met 3°, van de Wet op de identificatieplicht][ref1] alsmede – zo hij
      ook een vreemdeling is in de zin van de [Vreemdelingenwet 2000][ref2] en niet behoort tot de categorie werknemers
      die op grond van overeenkomsten van internationaal recht is uitgezonderd van de verplichting tot het hebben van
      een geldige verblijfsvergunning als bedoeld in die wet – een geldige verblijfsvergunning ter vaststelling van de
      verblijfsrechtelijke status ter zake van het verrichten van arbeid en is hij gehouden een afschrift van een en
      ander in de loonadministratie van de inhoudingsplichtige te laten opnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0011823
  - number: '29.2'
    text: |-
      De werknemer is echter niet gehouden opgave te verstrekken van gegevens met betrekking tot de heffingskorting.
      Indien de werknemer deze gegevens niet verstrekt, wordt met de heffingskorting geen rekening gehouden.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel29
  - number: '29.3'
    text: |-
      Tot de in het eerste lid en de in [artikel 28, eerste lid, onderdelen a en e][ref1], bedoelde gegevens wordt mede
      gerekend het burgerservicenummer van de werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel28
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '28'
        hoofdstuk: IV
  - number: '29.4'
    text: |-
      De vorige leden zijn niet van toepassing ten aanzien van de werknemer die niet in Nederland woont en die
      werkzaamheden verricht of heeft verricht in een in [artikel 2, derde lid][ref1], genoemde dienstbetrekking, indien
      het heffingrecht over het loon uit die dienstbetrekking op grond van een belastingverdrag niet aan Nederland is
      toegewezen en de werknemer niet premieplichtig is voor de volksverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel2
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '2'
        hoofdstuk: I
  - number: '30.1'
    text: |-
      Ieder is gehouden aan de inspecteur ter vaststelling van zijn identiteit indien zulks voor de
      heffing van de loonbelasting van belang kan zijn, desgevraagd terstond een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1] ter inzage te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '30.2'
    text: |-
      Voor een weigering om te voldoen aan de in het eerste lid omschreven verplichting kan niemand zich met vrucht
      beroepen op de omstandigheden dat hij uit enigerlei hoofde tot geheimhouding verplicht is, zelfs niet indien deze
      hem bij een wettelijke bepaling is opgelegd.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel30
  - number: 30a
    text: |-
      Indien op enig tijdstip wordt geconstateerd dat een werknemer tot een inhoudingsplichtige in dienstbetrekking
      staat, maar de werknemer niet in de loonadministratie van de inhoudingsplichtige is opgenomen of met betrekking
      tot de werknemer niet is voldaan aan de verplichting een eerstedagsmelding te doen, wordt de werknemer voor de
      toepassing van deze wet en de daarop berustende bepalingen geacht van de inhoudingsplichtige gedurende ten minste
      zes maanden voorafgaande aan het tijdstip van de constatering loon uit dienstbetrekking te hebben genoten tot per
      loontijdvak ten minste het bedrag van het loon dat de werknemer geniet in het loontijdvak van het tijdstip van de
      constatering, behoudens voorzover blijkt dat de werknemer niet gedurende die periode tot de inhoudingsplichtige in
      dienstbetrekking heeft gestaan of dat een lager loon is genoten.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel30a
  - number: '31.1'
    text: 'Eindheffingsbestanddelen zijn:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31
  - number: 31.1.a
    text: |-
      bestanddelen van het loon waarover de verschuldigde belasting niet is betaald, in verband waarmee aan de
      inhoudingsplichtige een naheffingsaanslag wordt opgelegd, behoudens:
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31
  - number: 31.1.a.1°
    text: |-
      voor zover de inhoudingsplichtige verzoekt, onder verstrekking van de daartoe noodzakelijke gegevens, dat loon niet
      als eindheffingsbestanddeel aan te merken;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31
  - number: 31.1.a.2°
    text: |-
      voor zover de inspecteur bij voor bezwaar vatbare beschikking besluit, mede gelet op het aantal werknemers waarop
      de naheffingsaanslag betrekking heeft, dat loon niet als eindheffingsbestanddeel aan te merken omdat het wel
      toepassen daarvan zou kunnen leiden tot een zodanig grote afwijking van het belastbare inkomen in de zin van de
      inkomstenbelasting van een of meer werknemers dat voor hen aanzienlijke voordelen zouden kunnen ontstaan in het
      kader van de heffing van die belasting, van andere belastingen of in het kader van andere wettelijke regelingen;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31
  - number: 31.1.b
    text: |-
      bij voor bezwaar vatbare beschikking door de inspecteur aangewezen bestanddelen van het loon met betrekking
      waartoe in verband met tijdelijke knelpunten van ernstige aard in redelijkheid niet kan worden gevergd dat
      de[ hoofdstukken I tot en met IV][ref1] ten volle worden toegepast;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#HoofdstukI
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002471
        hoofdstuk: I
  - number: 31.1.c
    text: |-
      bij ministeriële regeling aan te wijzen uitkeringen van publiekrechtelijke aard die buiten aanmerking worden
      gelaten in het kader van de heffing van andere belastingen of in het kader van andere wettelijke regelingen;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31
  - number: 31.1.d
    text: |-
      loon ter zake van een voor privé-doeleinden ter beschikking gestelde bestelauto als bedoeld in
      [artikel 3 van de Wet op de belasting van personenauto’s en motorrijwielen 1992][ref1], indien in verband met
      de aard van het werk die bestelauto doorlopend afwisselend gebruikt wordt door twee of meer werknemers en in
      verband daarmee bezwaarlijk is vast te stellen of en aan wie die bestelauto voor privé-doeleinden ter beschikking
      is gesteld, met dien verstande dat in afwijking in zoverre van het overigens bij of krachtens deze wet bepaalde,
      de verschuldigde belasting over dit loon op jaarbasis per bestelauto € 300 bedraagt en bij ministeriële regeling
      nadere regels kunnen worden gesteld met betrekking tot dit loon;


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel3
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '3'
  - number: 31.1.f
    text: |-
      voor zover sprake is van tegenwoordige arbeid: door de inhoudingsplichtige aangewezen vergoedingen en
      verstrekkingen, daaronder begrepen gedeelten van vergoedingen en verstrekkingen, voor zover de omvang van de
      aangewezen vergoedingen en verstrekkingen niet in belangrijke mate groter is dan de omvang van de vergoedingen en
      verstrekkingen die in voor het overige overeenkomstige omstandigheden in de regel worden aangewezen;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31
  - number: 31.1.g
    text: 'voorzover sprake is van vroegere arbeid:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31
  - number: 31.1.g.1°
    text: |-
      vergoedingen ter zake van de aanschaf bij de inhoudingsplichtige dan wel bij een met de inhoudingsplichtige
      verbonden vennootschap van branche-eigen producten van het bedrijf van de inhoudingsplichtige dan wel van het
      bedrijf van een met de inhoudingsplichtige verbonden vennootschap;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31
  - number: 31.1.g.2°
    text: |-
      door de inhoudingsplichtige aangewezen vergoedingen en verstrekkingen, daaronder begrepen gedeelten van
      vergoedingen en verstrekkingen, ter zake of in de vorm van het volgen van een opleiding of studie voor zover
      wordt voldaan aan het gestelde in [artikel 31a, tweede lid, onderdeel d][ref1], en voor zover de omvang van de
      aangewezen vergoedingen en verstrekkingen niet in belangrijke mate groter is dan de omvang van de vergoedingen en
      verstrekkingen die in voor het overige overeenkomstige omstandigheden in de regel worden aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31a
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 31a
        hoofdstuk: V
        afdeling: '1'
  - number: 31.1.g.3°
    text: overige verstrekkingen;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31
  - number: 31.1.h
    text: |-
      toeslagen als bedoeld in [artikel 10, derde lid, van de Wet uitkeringen vervolgingsslachtoffers 1940–1945][ref1]
      en in [artikel 21b van de Wet uitkeringen vervolgingsslachtoffers 1940–1945][ref2]
      zoals dat luidde tot 1 januari 1992, alsmede toeslagen als bedoeld in
      [artikel 19 van de Wet uitkeringen burgeroorlogsslachtoffers 1940–1945][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002844#Artikel21b
      [ref3]: https://wetten.overheid.nl/BWBR0003664#Artikel19
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002844
        artikel: 21b
      - id: ref3
        bwb_id: BWBR0003664
        artikel: '19'
  - number: '31.2'
    text: 'Met betrekking tot eindheffingsbestanddelen wordt het bedrag van de verschuldigde belasting bepaald:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31
  - number: 31.2.a
    text: 'aan de hand van het tabeltarief met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31
  - number: 31.2.a.1°
    text: aan naheffing onderworpen eindheffingsbestanddelen als bedoeld in het eerste lid, onderdeel a;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31
  - number: 31.2.a.2°
    text: eindheffingsbestanddelen bij tijdelijke knelpunten van ernstige aard als bedoeld in het eerste lid, onderdeel b;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31
  - number: 31.2.a.3°
    text: aangewezen uitkeringen van publiekrechtelijke aard als bedoeld in het eerste lid, onderdeel c;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31
  - number: 31.2.c
    text: |-
      aan de hand van [artikel 31a][ref1], met betrekking tot vergoedingen en verstrekkingen als bedoeld in het eerste
      lid, onderdeel f en onderdeel g;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31a
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 31a
        hoofdstuk: V
        afdeling: '1'
  - number: 31.2.d
    text: |-
      naar een enkelvoudig tarief, met betrekking tot toeslagen als bedoeld in het eerste lid, onderdeel h, aan
      de hand van de voor het tijdvak waarin het loon is genoten geldende in [artikel 20a, eerste lid][ref1], of
      [artikel 20b, eerste lid][ref2], opgenomen tabel, waarbij buiten beschouwing wordt gelaten dat de belasting wordt
      geheven van de inhoudingsplichtige.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel20a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel20b
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 20a
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 20b
        hoofdstuk: III
  - number: '31.3'
    text: |-
      Ingeval het tabeltarief van toepassing is wordt het bedrag van de verschuldigde belasting bepaald aan de
      hand van de voor het tijdvak waarin het loon is genoten geldende in [artikel 20a, eerste lid][ref1], of
      [artikel 20b][ref2], eerste lid, opgenomen tabel, waarbij wordt aangenomen dat de inhoudingsplichtige de
      belasting en de bij reguliere betaling van het loon verschuldigde inkomensafhankelijke bijdrage, bedoeld in
      [artikel 43 van de Zorgverzekeringswet][ref3] aanstonds voor zijn rekening heeft genomen. Voor zover bij naheffing
      als bedoeld in het tweede lid, onderdeel a, aannemelijk is dat de inhoudingsplichtige de belasting en bijdrage
      pas later voor zijn rekening heeft genomen, wordt in zoverre van de eerste volzin afgeweken en wordt het voor de
      werknemer ontstane voordeel in de eindheffing betrokken naar de situatie ten tijde van het voor rekening van de
      inhoudingsplichtige nemen, doch uiterlijk ten tijde van de naheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel20a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel20b
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel43
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 20a
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 20b
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '43'
  - number: '31.4'
    text: |-
      Tot de vergoedingen en verstrekkingen, bedoeld in het eerste lid, onderdeel f en onderdeel g, behoren niet
      vergoedingen en verstrekkingen ter zake of in de vorm van:
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31
  - number: 31.4.a
    text: |-
      een ook voor privé-doeleinden ter beschikking gestelde auto als bedoeld in [artikel 13bis][ref1], behoudens voor
      zover het voordeel daarvan toerekenbaar is aan buitengewone beveiligingsmaatregelen;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel13bis
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 13bis
        hoofdstuk: II
  - number: 31.4.b
    text: 'een woning, behoudens voor zover:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31
  - number: 31.4.b.1°
    text: het voordeel daarvan toerekenbaar is aan buitengewone beveiligingsmaatregelen, of
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31
  - number: 31.4.b.2°
    text: het huisvesting buiten de woonplaats ter zake van de dienstbetrekking betreft;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31
  - number: 31.4.c
    text: |-
      geldboeten opgelegd door een strafrechter en geldsommen betaald aan een staat of een onderdeel daarvan
      ter voorkoming van strafvervolging, in het kader van een strafbeschikking of daarmee vergelijkbare
      buitenlandse wijze van bestraffing, dan wel ter voldoening aan een voorwaarde verbonden aan een besluit tot
      gratieverlening, bestuurlijke boeten en daarmee vergelijkbare buitenlandse boeten, geldboeten opgelegd op
      basis van bij wet geregeld tuchtrecht, alsmede kosten als bedoeld in [artikel 234, vijfde lid][ref1], en
      [artikel 235, derde lid, van de Gemeentewet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel234
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel235
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '234'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '235'
  - number: 31.4.d
    text: |-
      misdrijven ter zake waarvan de werknemer door een Nederlandse strafrechter bij onherroepelijke uitspraak is
      veroordeeld, daaronder begrepen misdrijven die zijn betrokken bij de bepaling van de hoogte van de opgelegde straf
      en ter zake waarvan het Openbaar Ministerie heeft verklaard te zullen afzien van vervolging;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31
  - number: 31.4.e
    text: misdrijven ter zake waarvan jegens de werknemer een onherroepelijk geworden strafbeschikking is uitgevaardigd;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31
  - number: 31.4.f
    text: |-
      wapens en munitie, tenzij ter zake een erkenning, consent, vergunning, verlof of ontheffing is verleend krachtens
      de [Wet wapens en munitie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008804
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0008804
  - number: 31.4.g
    text: |-
      dieren die krachtens een onherroepelijke bestuursrechtelijke of strafrechtelijke maatregel in verband met agressie
      niet mogen worden gehouden;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31
  - number: 31.4.h
    text: |-
      het rentevoordeel van een door de inhoudingsplichtige dan wel door een met de inhoudingsplichtige
      verbonden vennootschap aan de werknemer verstrekte geldlening, daaronder begrepen een
      gedeelte van een geldlening, waarvan de rente als aftrekbare kosten in de zin van de
      [artikelen 3.120 tot en met 3.123 van de Wet inkomstenbelasting 2001][ref1] in aanmerking genomen kan worden;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 31.4.i
    text: de aan een geldlening als bedoeld in onderdeel h verbonden kosten;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31
  - number: 31.4.j
    text: |-
      dwangsommen als bedoeld in [afdeling 5.3.2 van de Algemene wet bestuursrecht][ref1] en daarmee vergelijkbare
      buitenlandse dwangsommen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling5.3.2
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 5.3.2
  - number: '31.5'
    text: |-
      Voor de bepaling van de verschuldigde belasting op de voet van het tweede lid, onderdeel c, wordt buiten
      beschouwing gelaten dat de belasting wordt geheven van de inhoudingsplichtige.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31
  - number: '31.6'
    text: |-
      Voorzover in hetzelfde loontijdvak of dezelfde loontijdvakken door meer dan één werknemer eindheffingsbestanddelen
      worden genoten kan, mits dat leidt tot een beduidende vereenvoudiging van de vaststelling van de verschuldigde
      belasting, de verschuldigde belasting globaal worden vastgesteld, zodanig dat deze redelijkerwijs overeenkomt met
      de verschuldigde belasting die op de voet van de vorige leden zou zijn bepaald.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31
  - number: '31.7'
    text: |-
      De in het eerste lid bedoelde ministeriële regelingen worden, voorzover het de premie voor de volksverzekeringen
      betreft, getroffen in overleg met Onze Minister van Sociale Zaken en Werkgelegenheid.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31
  - number: 31a.1
    text: |-
      Het bedrag van de verschuldigde belasting met betrekking tot vergoedingen en verstrekkingen als bedoeld in
      [artikel 31, eerste lid, onderdeel f en onderdeel g][ref1], wordt per inhoudingsplichtige bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '31'
        hoofdstuk: V
        afdeling: '1'
  - number: 31a.2
    text: |-
      De verschuldigde belasting met betrekking tot vergoedingen en verstrekkingen als bedoeld in
      [artikel 31, eerste lid, onderdeel f en onderdeel g][ref1], wordt bepaald naar een tarief van 80%, met dien
      verstande dat deze vergoedingen en verstrekkingen worden verminderd, maar niet verder dan tot nihil, met het bedrag
      aan vrije ruimte als bedoeld in het derde lid, alsmede met vergoedingen en verstrekkingen als bedoeld in artikel
      31, eerste lid, onderdeel f en onderdeel g, ter zake of in de vorm van:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '31'
        hoofdstuk: V
        afdeling: '1'
  - number: 31a.2.a
    text: 'vervoer in het kader van de dienstbetrekking, waaronder woon-werkverkeer:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31a
  - number: 31a.2.a.1°
    text: |-
      indien het vervoer plaatsvindt per taxi, luchtvaartuig, schip of vervoer vanwege de inhoudingsplichtige: tot de
      werkelijke kosten, met dien verstande dat de vermindering niet geldt voor vergoedingen ter zake van vervoer vanwege
      de inhoudingsplichtige;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31a
  - number: 31a.2.a.2°
    text: |-
      indien het vervoer plaatsvindt per openbaar vervoer, anders dan in de vorm van vervoer vanwege de
      inhoudingsplichtige, en de vergoedingen hoger zijn dan € 0,21 per kilometer en zijn vastgesteld op basis van de
      werkelijke kosten: tot de werkelijke kosten;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31a
  - number: 31a.2.a.3°
    text: 'in de overige situaties: tot € 0,21 per afgelegde kilometer;'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31a
  - number: 31a.2.b
    text: |-
      tijdelijk verblijf in het kader van de dienstbetrekking, niet zijnde een tijdelijk verblijf als bedoeld in
      onderdeel e, alsmede maaltijden met een meer dan bijkomstig zakelijk karakter;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31a
  - number: 31a.2.c
    text: |-
      onderhoud en verbetering van kennis en vaardigheden ter vervulling van de dienstbetrekking, daaronder mede begrepen
      de inschrijving in een beroepsregister, alsmede outplacement;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31a
  - number: 31a.2.d
    text: |-
      het volgen van een opleiding of studie met het oog op het verwerven van inkomen uit werk en woning, daaronder mede
      begrepen het volgen van een procedure erkenning verworven competenties waarvoor een verklaring is afgegeven door
      een bij ministeriële regeling aangewezen instantie, met uitzondering van:
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31a
  - number: 31a.2.d.1°
    text: vergoedingen en verstrekkingen die verband houden met een werk- of studeerruimte, daaronder begrepen de inrichting;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31a
  - number: 31a.2.d.2°
    text: |-
      vergoedingen van binnenlandse reizen voor zover de vergoeding meer bedraagt dan het bedrag dat wordt bepaald met
      overeenkomstige toepassing van onderdeel a;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31a
  - number: 31a.2.e
    text: |-
      extra kosten van tijdelijk verblijf buiten het land van herkomst in het kader van de dienstbetrekking
      (extraterritoriale kosten);
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31a
  - number: 31a.2.f
    text: |-
      verhuizing in het kader van de dienstbetrekking, ter omvang van de kosten van het overbrengen van de inboedel
      vermeerderd met € 7750, waarbij bij ministeriële regeling regels kunnen worden gesteld voor de beoordeling of in
      ieder geval in het kader van de dienstbetrekking wordt verhuisd;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31a
  - number: 31a.2.g
    text: |-
      gereedschappen, computers, mobiele communicatiemiddelen en dergelijke apparatuur, die naar het redelijke oordeel
      van de inhoudingsplichtige noodzakelijk zijn voor de behoorlijke vervulling van de dienstbetrekking, met inbegrip
      van het bijbehorende datatransport en de voor het gebruik in het kader van dienstbetrekking benodigde programmatuur
      en dergelijke, indien:
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31a
  - number: 31a.2.g.1°
    text: |-
      de werknemer verplicht is tot teruggaaf van deze voorziening of tot vergoeding van de restwaarde, voor zover
      de voorziening voor rekening van de inhoudingsplichtige is gekomen, op het moment dat deze voorziening naar het
      redelijke oordeel van de inhoudingsplichtige niet langer noodzakelijk is voor de behoorlijke vervulling van de
      dienstbetrekking; en
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31a
  - number: 31a.2.g.2°
    text: de werknemer geen werkzaamheden verricht in de functie van bestuurder of commissaris van de inhoudingsplichtige;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31a
  - number: 31a.2.h
    text: |-
      bij ministeriële regeling aan te wijzen voorzieningen die geheel of gedeeltelijk op een bij die ministeriële
      regeling aan te wijzen werkplek worden gebruikt of verbruikt;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31a
  - number: 31a.2.i
    text: |-
      branche-eigen producten van het bedrijf van de inhoudingsplichtige of van het bedrijf van een met de
      inhoudingsplichtige verbonden vennootschap, tot een bedrag van ten hoogste 20% van de waarde in het economische
      verkeer van deze producten, maar niet meer dan € 500 per werknemer per kalenderjaar;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31a
  - number: 31a.2.j
    text: |-
      een in het kader van de dienstbetrekking aangevraagde verklaring omtrent het gedrag als bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1] of daarmee vergelijkbare buitenlandse
      verklaring;


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '28'
  - number: 31a.2.k
    text: |-
      thuiswerken in het kader van de dienstbetrekking tot € 2,15 per thuiswerkdag, daaronder begrepen een gedeelte
      van een thuiswerkdag, met dien verstande dat ingeval voor thuiswerken een vaste vergoeding wordt gegeven aan een
      werknemer die op ten minste 128 dagen per kalenderjaar thuiswerkt, deze vergoeding mag worden berekend alsof de
      werknemer op ten hoogste 214 dagen per kalenderjaar thuiswerkt.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31a
  - number: 31a.3
    text: 'De vrije ruimte bedraagt:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31a
  - number: 31a.3.a
    text: |-
      3% van het loon waarover met toepassing van de [artikelen 20a][ref1], [20b][ref2], [26][ref3] en [26b][ref4]
      belasting wordt geheven met een maximum van € 6800, vermeerderd met:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel20a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel20b
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0002471#Artikel26b
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 20a
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 20b
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0002471
        artikel: '26'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0002471
        artikel: 26b
        hoofdstuk: III
  - number: 31a.3.b
    text: |-
      1,18% van het loon waarover met toepassing van de [artikelen 20a][ref1], [20b][ref2], [26][ref3] en [26b][ref4]
      belasting wordt geheven voor zover dat loon meer bedraagt dan € 400.000.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel20a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel20b
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0002471#Artikel26b
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 20a
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 20b
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0002471
        artikel: '26'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0002471
        artikel: 26b
        hoofdstuk: III
  - number: 31a.4
    text: |-
      In afwijking in zoverre van het tweede lid worden vergoedingen en verstrekkingen als bedoeld in
      [artikel 31, eerste lid, onderdeel f en onderdeel g][ref1], bij de bepaling van de daarover verschuldigde
      belasting niet verminderd met vaste vergoedingen ter zake van de in het tweede lid bedoelde kosten ingeval aan deze
      vergoedingen geen onderzoek naar de werkelijk gemaakte kosten ten grondslag ligt.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '31'
        hoofdstuk: V
        afdeling: '1'
  - number: 31a.5
    text: |-
      Voor de toepassing van het tweede lid wordt onder vervoer vanwege de inhoudingsplichtige verstaan: vervoer als
      bedoeld in [artikel 13a, zesde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel13a
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 13a
        hoofdstuk: II
  - number: 31a.6
    text: |-
      Voor de toepassing van dit artikel worden vergoedingen ter zake van vervoer als bedoeld in het tweede lid,
      onderdeel a, onder 3°, geacht niet hoger te zijn dan € 0,21 per afgelegde kilometer voor zover deze vergoedingen
      in totaal niet meer hebben bedragen dan het aantal in het kalenderjaar in dit kader afgelegde kilometers
      vermenigvuldigd met € 0,21.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31a
  - number: 31a.7
    text: |-
      Voor de berekening van de in het tweede lid, onderdelen a en k, bedoelde vaste vergoeding ter zake van vervoer,
      onderscheidenlijk thuiswerken, worden de in die onderdelen genoemde aantallen dagen:
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31a
  - number: 31a.7.a
    text: |-
      vermenigvuldigd met vier vijfde, drie vijfde, twee vijfde of een vijfde ingeval de werknemer in de regel vier
      dagen, drie dagen, twee dagen, onderscheidenlijk een dag, per week naar een vaste plaats van werkzaamheden reist,
      onderscheidenlijk thuiswerkt;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31a
  - number: 31a.7.b
    text: |-
      naar tijdsgelang herrekend bij het aanvangen of beëindigen van de betreffende vergoeding, dan wel bij een wijziging
      in de grondslag voor de berekening van de vergoeding, in de loop van het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31a
  - number: 31a.8
    text: |-
      Voor bij of krachtens algemene maatregel van bestuur aan te wijzen groepen werknemers die door een
      inhoudingsplichtige van buiten Nederland in dienstbetrekking worden genomen, geldt, onder daarbij te stellen
      voorwaarden, dat vergoedingen van kosten en verstrekkingen van verblijf buiten het land van herkomst gedurende ten
      hoogste vijf jaar ten minste worden beschouwd als vergoeding voor extraterritoriale kosten tot ten hoogste 30% van
      het daarbij aan te wijzen gedeelte van het loon, alsmede tot het bedrag van de daarbij aan te wijzen schoolgelden.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31a
  - number: 31a.9
    text: |-
      Voor bij of krachtens algemene maatregel van bestuur aan te wijzen groepen werknemers die door een
      inhoudingsplichtige buiten Nederland worden uitgezonden, geldt, onder daarbij te stellen voorwaarden, dat
      vergoedingen van kosten en verstrekkingen van verblijf buiten het land van herkomst ten minste worden beschouwd als
      vergoeding voor extraterritoriale kosten tot ten hoogste 30% van het daarbij aan te wijzen gedeelte van het loon,
      alsmede tot het bedrag van de daarbij aan te wijzen schoolgelden.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31a
  - number: 31a.10
    text: |-
      Het tweede lid, onderdeel g, is niet van toepassing voor zover de vergoeding of verstrekking, al dan niet in het
      kader van een wijziging van de samenstelling van de tussen de werknemer en de inhoudingsplichtige overeengekomen
      beloning, in de plaats is gekomen van een ander loonbestanddeel.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31a
  - number: 31a.11
    text: |-
      Het tweede lid, onderdeel g, onder 2°, is niet van toepassing voor zover de inhoudingsplichtige aannemelijk maakt
      dat de voorziening een voor de behoorlijke vervulling van de dienstbetrekking van de desbetreffende werknemer
      gebruikelijke voorziening is.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31a
  - number: 31a.12
    text: |-
      Indien op een dag zowel naar een vaste plaats van werkzaamheden wordt gereisd als wordt thuisgewerkt kan voor
      die dag slechts een van de vergoedingen of verstrekkingen ter zake of in de vorm van vervoer in het kader
      van de dienstbetrekking naar een vaste plaats van werkzaamheden als bedoeld in het tweede lid, onderdeel a,
      onderscheidenlijk thuiswerken in het kader van de dienstbetrekking als bedoeld in het tweede lid, onderdeel
      k, worden gegeven. Indien op een dag naar een vaste plaats van werkzaamheden wordt gereisd met een door de
      inhoudingsplichtige ter beschikking gestelde auto als bedoeld in [artikel 13bis][ref1], kan voor die dag niet een
      vergoeding of verstrekking ter zake of in de vorm van thuiswerken in het kader van de dienstbetrekking als bedoeld
      in het tweede lid, onderdeel k, worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel13bis
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 13bis
        hoofdstuk: II
  - number: 31a.13
    text: |-
      Bij het begin van het kalenderjaar wordt het in het tweede lid, onderdeel k, genoemde bedrag bij ministeriële
      regeling vervangen door een ander bedrag. Dit bedrag wordt berekend door het te vervangen bedrag te
      vermenigvuldigen met de tabelcorrectiefactor, bedoeld in [artikel 10.2 van de Wet inkomstenbelasting 2001][ref1],
      en vervolgens de nodig geachte afronding aan te brengen. Indien in het voorafgaande kalenderjaar een dergelijke
      afronding is toegepast, kan bij vervanging worden uitgegaan van het niet-afgeronde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel10
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '10'
  - number: 31a.14
    text: |-
      Bij de toepassing van het tweede lid wordt, in afwijking van [artikel 13, zesde lid][ref1], de ingevolge
      artikel 13, eerste tot en met vijfde lid, in aanmerking te nemen waarde van verstrekkingen als bedoeld in
      [artikel 31, eerste lid, onderdeel f en onderdeel g][ref2], verminderd met het bedrag dat de inhoudingsplichtige
      ter zake van die verstrekkingen in totaal aan zijn werknemers in rekening heeft gebracht, met dien verstande dat de
      aldus verminderde waarde ten minste op nihil wordt gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '13'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '31'
        hoofdstuk: V
        afdeling: '1'
  - number: 31a.15
    text: 'Bij de bepaling van het in het derde lid bedoelde loon wordt buiten beschouwing gelaten:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31a
  - number: 31a.15.a
    text: |-
      loon uit vroegere dienstbetrekking indien de inhoudingsplichtige in meer dan bijkomstige mate loon uit vroegere
      dienstbetrekking verstrekt;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31a
  - number: 31a.15.b
    text: |-
      loon ter zake waarvan de inhoudingsplichtige uitsluitend ingevolge [artikel 6, eerste lid, onderdeel c][ref1],
      inhoudingsplichtige is.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel6
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '6'
        hoofdstuk: I
  - number: 31a.16
    text: |-
      De verschuldigde belasting, bedoeld in het tweede lid, wordt, in afwijking van [artikel 27a, tweede lid][ref1],
      uiterlijk aangegeven en afgedragen tegelijk met de aangifte, onderscheidenlijk afdracht, over het tweede tijdvak
      van het volgende kalenderjaar. Ingeval de inhoudingsplicht is geëindigd in de loop van het kalenderjaar wordt
      voor het tweede tijdvak van het volgende kalenderjaar, bedoeld in de eerste volzin, gelezen: het tijdvak waarin de
      inhoudingsplicht is geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel27a
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 27a
        hoofdstuk: IV
  - number: 31a.17
    text: |-
      Indien extraterritoriale kosten als bedoeld in het tweede lid, onderdeel e, worden vergoed aan een werknemer die
      voldoet aan de voorwaarden van het achtste lid, onderscheidenlijk negende lid, dient de inhoudingsplichtige ter
      zake van het eerste loontijdvak van ieder kalenderjaar waarin die werknemer aan die voorwaarden voldoet en die
      kosten door hem aan die werknemer worden vergoed een keuze te maken voor het al dan niet toepassen van het achtste
      lid, onderscheidenlijk negende lid. De keuze, bedoeld in de eerste zin, geldt voor het gehele kalenderjaar zolang
      de werknemer, bedoeld in de eerste zin, aan de voorwaarden, bedoeld in die zin, blijft voldoen.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31a
  - number: 31a.18
    text: |-
      Indien binnen de eerste vier maanden van aanvang van de tewerkstelling als werknemer met extraterritoriale kosten
      een verzoek tot toepassing of voortgezette toepassing van de bewijsregel, bedoeld in de algemene maatregel van
      bestuur gebaseerd op het achtste lid, wordt gedaan, dient de keuze, bedoeld in het zeventiende lid, in afwijking
      in zoverre van dat lid, eerste zin, voor het eerst te worden gemaakt ter zake van het eerstvolgende loontijdvak na
      afloop van die eerste vier maanden en geldt in dat geval vanaf dat loontijdvak voor de resterende periode van het
      kalenderjaar waarin de termijn van die eerste vier maanden afloopt zolang de werknemer, bedoeld in het zeventiende
      lid, eerste zin, aan de voorwaarden, bedoeld in die zin, blijft voldoen.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel31a
  - number: '32.1'
    text: |-
      In afwijking van [artikel 31a, eerste lid][ref1], kan de belasting die door alle gezamenlijk in concernverband
      opererende inhoudingsplichtigen is verschuldigd met betrekking tot vergoedingen en verstrekkingen als bedoeld
      in [artikel 31, eerste lid, onderdeel f en onderdeel g][ref2], worden bepaald alsof deze inhoudingsplichtigen
      gezamenlijk één inhoudingsplichtige zijn. Deze belasting wordt aangegeven en afgedragen door de tot het
      concernverband behorende inhoudingsplichtige met het grootste bedrag aan loon waarover in het kalenderjaar met
      toepassing van de [artikelen 20a][ref3], [20b][ref4], [26][ref5] en [26b][ref6] belasting is geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel20a
      [ref4]: https://wetten.overheid.nl/BWBR0002471#Artikel20b
      [ref5]: https://wetten.overheid.nl/BWBR0002471#Artikel26
      [ref6]: https://wetten.overheid.nl/BWBR0002471#Artikel26b
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 31a
        hoofdstuk: V
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '31'
        hoofdstuk: V
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 20a
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0002471
        artikel: 20b
        hoofdstuk: III
      - id: ref5
        bwb_id: BWBR0002471
        artikel: '26'
        hoofdstuk: III
      - id: ref6
        bwb_id: BWBR0002471
        artikel: 26b
        hoofdstuk: III
  - number: '32.2'
    text: |-
      Een inhoudingsplichtige opereert gezamenlijk met een andere inhoudingsplichtige in concernverband, indien gedurende
      het gehele kalenderjaar:
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32
  - number: 32.2.a
    text: de inhoudingsplichtige voor ten minste 95% belang heeft in die andere inhoudingsplichtige;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32
  - number: 32.2.b
    text: die andere inhoudingsplichtige voor ten minste 95% belang heeft in de inhoudingsplichtige, of
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32
  - number: 32.2.c
    text: |-
      een derde voor ten minste 95% belang heeft in de inhoudingsplichtige, terwijl deze derde tevens voor ten minste 95%
      belang heeft in die andere inhoudingsplichtige.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32
  - number: '32.3'
    text: |-
      Bij ministeriële regeling worden regels gesteld over de door iedere inhoudingsplichtige die ingevolge het eerste
      lid samen met andere inhoudingsplichtigen als één inhoudingsplichtige wordt beschouwd te administreren gegevens ten
      aanzien van:
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32
  - number: 32.3.a
    text: de berekening van de verschuldigde belasting, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32
  - number: 32.3.b
    text: de inhoudingsplichtige die de belasting, bedoeld in onderdeel a, aangeeft en afdraagt.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32
  - number: 32a.1
    text: |-
      Voor de toepassing van [artikel 31, derde lid][ref1], worden bij ministeriële regeling regels gesteld voor het
      bepalen van het op de eindheffingsbestanddelen toe te passen tarief. Daarbij kunnen de gevolgen van het passeren
      van tariefschijfgrenzen en maximum premielonen buiten beschouwing blijven en kunnen voorts de noodzakelijke
      afrondingen en vereenvoudigingen worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '31'
        hoofdstuk: V
        afdeling: '1'
  - number: 32a.2
    text: |-
      Voor gevallen waarin tevens [artikel 27b, eerste lid][ref1], van toepassing is worden in de in het eerste lid
      bedoelde ministeriële regeling, met overeenkomstige toepassing van [artikel 31, derde lid][ref2], tevens regels
      gesteld volgens welke telkens de belasting en de premie voor de volksverzekeringen in één bedrag dan wel in één
      percentage kunnen worden afgeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel27b
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 27b
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '31'
        hoofdstuk: V
        afdeling: '1'
  - number: 32ab.1
    text: |-
      Als eindheffingsbestanddelen als bedoeld in [artikel 31][ref1] worden mede aangemerkt bij ministeriële regeling aan
      te wijzen verstrekkingen aan anderen dan eigen werknemers, waarvoor geen inhoudingsplicht bestaat bij of krachtens
      een ander artikel van deze wet, ingeval de verstrekker schriftelijke mededeling doet aan de ontvanger van het
      toepassing vinden van deze eindheffing en aannemelijk kan maken wie de ontvanger is van de verstrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32ab
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '31'
        hoofdstuk: V
        afdeling: '1'
  - number: 32ab.2
    text: |-
      Degene die een mededeling heeft gedaan dat hij eindheffing toepast, wordt, zo hij dat nog niet is, aangemerkt als
      inhoudingsplichtige.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32ab
  - number: 32ab.3
    text: |-
      Met betrekking tot een eindheffingsbestanddeel als bedoeld in het eerste lid wordt het bedrag van de verschuldigde
      belasting, bedoeld in [artikel 31, tweede lid][ref1], bepaald naar een tarief van:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32ab
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '31'
        hoofdstuk: V
        afdeling: '1'
  - number: 32ab.3.1°
    text: |-
      45 percent, met betrekking tot een verstrekking waarvan de waarde in het economische verkeer niet meer bedraagt
      dan € 136;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32ab
  - number: 32ab.3.2°
    text: |-
      75 percent, met betrekking tot een verstrekking waarvan de waarde in het economische verkeer meer bedraagt dan
      € 136.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32ab
  - number: 32b
    text: |-
      Ter bevordering van een goede uitvoering van deze afdeling kunnen bij ministeriële regeling nadere regels worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32b
  - number: 32ba.1
    text: |-
      In afwijking in zoverre van het overigens bij of krachtens deze wet bepaalde, wordt een door een
      inhoudingsplichtige gedane en op hem drukkende uitkering ingevolge een regeling voor vervroegde uittreding
      alsmede een door een inhoudingsplichtige voldane en op hem drukkende bijdrage of premie aan een fonds dat of een
      verzekeraar die een zodanige regeling uitvoert, aangemerkt als loon dat als een eindheffingsbestanddeel wordt
      belast naar een tarief van 52%.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32ba
  - number: 32ba.2
    text: |-
      Een uitkering of een bijdrage of een premie wordt beschouwd te zijn gedaan of voldaan op het tijdstip waarop zij
      betaald of verrekend is, ter beschikking is gesteld of rentedragend is geworden.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32ba
  - number: 32ba.3
    text: |-
      Een uitkering, een bijdrage of een premie wordt beschouwd niet te drukken op een inhoudingsplichtige voor zover de
      inhoudingsplichtige ter zake bedragen van werknemers heeft ingehouden of van andere inhoudingsplichtigen bijdragen
      of premies voldaan heeft gekregen.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32ba
  - number: 32ba.4
    text: |-
      Ingeval op enig tijdstip een aanspraak ingevolge een regeling voor vervroegde uittreding niet langer als zodanig
      is aan te merken dan wel wordt afgekocht of vervreemd, wordt op het onmiddellijk daaraan voorafgaande tijdstip de
      aanspraak aangemerkt als loon uit vroegere dienstbetrekking van de werknemer of gewezen werknemer. De waarde van
      de aanspraak wordt gesteld op de waarde in het economische verkeer op het in de eerste volzin genoemde tijdstip,
      met dien verstande dat de waarde ten minste wordt gesteld op het bedrag dat ter zake van de vervreemding of afkoop
      wordt genoten.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32ba
  - number: 32ba.5
    text: |-
      Ingeval op grond van het vierde lid een aanspraak wordt aangemerkt als loon uit vroegere dienstbetrekking van een
      werknemer of gewezen werknemer, wordt de inhoudingsplichtige die de in dat lid bedoelde regeling voor vervroegde
      uittreding uitvoert voor de toepassing van het eerste lid geacht een uitkering ingevolge een regeling voor
      vervroegde uittreding te hebben gedaan ter grootte van de aldaar bedoelde waarde van die aanspraak, op het tijdstip
      waarop de daar bedoelde aanspraak is aangemerkt als loon uit vroegere dienstbetrekking.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32ba
  - number: 32ba.6
    text: |-
      Onder een regeling voor vervroegde uittreding wordt verstaan een regeling die of een gedeelte van een
      regeling dat uitsluitend of nagenoeg uitsluitend ten doel heeft voorafgaand aan het ingaan van uitkeringen
      ingevolge een pensioenregeling of de [Algemene Ouderdomswet][ref1] te voorzien in een of meer uitkeringen
      of verstrekkingen ter overbrugging van de periode tot het ingaan van het pensioen of de uitkering ingevolge
      de [Algemene Ouderdomswet][ref2] dan wel tot het aanvullen van uitkeringen ingevolge een pensioenregeling.
      In afwijking in zoverre van de eerste volzin wordt een regeling niet als regeling voor vervroegde uittreding
      aangemerkt, voor zover die regeling een pensioenovereenkomst inhoudt als bedoeld in de [Pensioenwet][ref3],
      een beroepspensioenregeling inhoudt als bedoeld in de [Wet verplichte beroepspensioenregeling][ref4] of
      een pensioenregeling is als bedoeld in [hoofdstuk IIB][ref5] of in de [artikelen 38d][ref6], [38e][ref7]
      of [38f][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0002221
      [ref3]: https://wetten.overheid.nl/BWBR0020809
      [ref4]: https://wetten.overheid.nl/BWBR0018831
      [ref5]: https://wetten.overheid.nl/BWBR0002471#HoofdstukIIB
      [ref6]: https://wetten.overheid.nl/BWBR0002471#Artikel38d
      [ref7]: https://wetten.overheid.nl/BWBR0002471#Artikel38e
      [ref8]: https://wetten.overheid.nl/BWBR0002471#Artikel38f
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel32ba
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0002221
      - id: ref3
        bwb_id: BWBR0020809
      - id: ref4
        bwb_id: BWBR0018831
      - id: ref5
