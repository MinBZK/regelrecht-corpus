  - number: 22b.2
    text: |-
      De ouderenkorting bedraagt € 1.835, verminderd, doch niet verder dan tot nihil, met 15% van het tijdvakloon op
      jaarbasis voor zover dat meer bedraagt dan € 40.888.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel22b
  - number: 22c.1
    text: |-
      Voor de werknemer die een uitkering als bedoeld in
      [artikel 9, eerste lid, onderdeel a, van de Algemene Ouderdomswet][ref1] geniet, of deze zou genieten indien hij
      zou voldoen aan de voorwaarde van [artikel 7, eerste lid, onderdeel b, van de Algemene Ouderdomswet][ref2], is de
      alleenstaande ouderenkorting van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel7
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel22c
