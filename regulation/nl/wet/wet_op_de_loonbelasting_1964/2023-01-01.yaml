        artikel: 18a
        hoofdstuk: IIB
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 18a
        hoofdstuk: IIB
  - number: 38f.1
    text: |-
      Voor een op 31 december 2004 bestaande regeling voor overbruggingspensioen als bedoeld in [artikel 18e][ref1],
      zoals dit artikel op 31 december 2004 luidde, blijven tot en met 31 december 2005 de [artikelen 18][ref2],
      [18e][ref3] en [18g][ref4], zoals deze luidden op 31 december 2004, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18e
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel18e
      [ref4]: https://wetten.overheid.nl/BWBR0002471#Artikel18g
