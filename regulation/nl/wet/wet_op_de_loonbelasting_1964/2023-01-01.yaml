  - number: 22b.1
    text: |-
      Voor de werknemer die de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], heeft bereikt, is de ouderenkorting van toepassing.


