$id: wet_op_de_loonbelasting_1964
regulatory_layer: WET
publication_date: '2025-12-23'
valid_from: '2023-01-01'
bwb_id: BWBR0002471
url: https://wetten.overheid.nl/BWBR0002471/2023-01-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is het Besluit op de Loonbelasting 1940 door een meer
    overzichtelijke en op verschillende punten herziene wettelijke regeling te vervangen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Onder de naam 'loonbelasting' wordt van werknemers of hun inhoudingsplichtige, van artiesten, van beroepssporters,
      van buitenlandse gezelschappen en van bij of krachtens deze wet aan te wijzen andere personen een directe belasting
      geheven.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel1
  - number: '2.1'
    text: |-
      Werknemer is de natuurlijke persoon die tot een inhoudingsplichtige in privaatrechtelijke of in publiekrechtelijke
      dienstbetrekking staat of van een inhoudingsplichtige loon geniet uit een vroegere privaatrechtelijke of
      publiekrechtelijke dienstbetrekking van hemzelf of van een ander, dan wel uit een bestaande privaatrechtelijke of
      publiekrechtelijke dienstbetrekking van een ander.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel2
  - number: '2.2'
    text: |-
      Degene die van een Nederlandse publiekrechtelijke rechtspersoon loon geniet uit een dienstbetrekking tot
      een niet-inhoudingsplichtige dan wel loon in de vorm van premies voor werkaanvaarding ten behoeve van
      uitkeringsgerechtigden, wordt geacht tot die rechtspersoon in dienstbetrekking te staan.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel2
  - number: '2.3'
    text: |-
      Tenzij werkzaamheden zijn of worden verricht in een functie van bestuurder of commissaris van een in Nederland
      gevestigd lichaam, dan wel in dienstbetrekking bij de Staat der Nederlanden of in het kader van een uitzending op
      grond van een verdrag waarbij de Staat der Nederlanden partij is, is het eerste lid niet van toepassing op personen
      die niet in Nederland wonen, met betrekking tot een geheel buiten Nederland vervulde dienstbetrekking. Voor
      werkzaamheden die zijn of worden verricht aan boord van schepen of luchtvaartuigen in het internationale verkeer
      van een onderneming waarvan de leiding in Nederland is gevestigd, is de eerste volzin slechts van toepassing indien
      wordt voldaan aan de in het vierde lid gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel2
  - number: '2.4'
    text: |-
      Het eerste lid is eveneens niet van toepassing op personen die niet in Nederland wonen, met betrekking tot een
      nagenoeg geheel buiten Nederland vervulde dienstbetrekking, anders dan de dienstbetrekkingen die in het derde lid,
      eerste volzin, zijn genoemd, indien:
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel2
  - number: 2.4.a
    text: |-
      het loon is onderworpen aan een belasting naar het inkomen die door of vanwege Aruba, Curaçao, Sint Maarten, de BES
      eilanden of een andere mogendheid wordt geheven, en
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel2
  - number: 2.4.b
    text: |-
      het loon niet op grond van een verdrag ter voorkoming van dubbele belasting of op grond van enige andere regel
      van interregionaal of internationaal recht in feite slechts in Nederland aan een belasting naar het inkomen is
      onderworpen.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel2
  - number: '2.5'
    text: |-
      Het eerste lid is eveneens niet van toepassing op personen die niet in Nederland wonen, met betrekking
      tot een gedeeltelijk, maar niet nagenoeg geheel buiten Nederland vervulde dienstbetrekking, anders dan de
      dienstbetrekkingen die in het derde lid, eerste volzin, zijn genoemd, voorzover het loon uit die dienstbetrekking
      met inachtneming van verdragen waarbij de Staat der Nederlanden partij is, feitelijk is onderworpen aan een
      belasting naar het inkomen die door of vanwege Aruba, Curaçao, Sint Maarten, de BES eilanden of een andere
      mogendheid wordt geheven.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel2
  - number: '2.6'
    text: |-
      Het eerste lid is eveneens niet van toepassing op personen die als vrijwilliger uitsluitend vergoedingen of
      verstrekkingen ontvangen met een gezamenlijke waarde van ten hoogste € 190 per maand en € 1.900 per kalenderjaar.
      Hierbij wordt onder vrijwilliger verstaan degene die niet bij wijze van beroep arbeid verricht voor een algemeen
      nut beogende instelling, een sportorganisatie of een niet als zodanig aan te merken lichaam dat niet is onderworpen
      aan de vennootschapsbelasting of daarvan is vrijgesteld.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel2
  - number: '2.7'
    text: |-
      Bij het begin van het kalenderjaar worden de in het zesde lid genoemde bedragen bij ministeriële regeling vervangen
      door andere bedragen. Het bedrag per kalenderjaar wordt berekend door het te vervangen bedrag te vermenigvuldigen
      met de tabelcorrectiefactor, bedoeld in [artikel 10.2 van de Wet inkomstenbelasting 2001][ref1], en vervolgens
      de nodig geachte afronding aan te brengen. Indien in het voorafgaande kalenderjaar een dergelijke afronding is
      toegepast, kan bij vervanging worden uitgegaan van het niet-afgeronde bedrag. Het bedrag per maand wordt berekend
      door het volgens de tweede zin berekende bedrag per kalenderjaar te vermenigvuldigen met 1/10.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel10
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '10'
  - number: '2.8'
    text: Krachtens wettelijk vruchtgenot aan een kind ontleend loon wordt geacht door het kind te zijn genoten.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel2
  - number: '2.9'
    text: |-
      Loon in de vorm van periodieke uitkeringen welke van publiekrechtelijke aard zijn, kan in het kalenderjaar
      waarin de verstrekking van die uitkeringen aanvangt dan wel eindigt volgens bij ministeriële regeling te
      stellen regels worden geacht niet te zijn genoten door de werknemer doch door zijn partner in de zin van
      [artikel 1.2 van de Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel1
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '1'
  - number: '3.1'
    text: 'Als dienstbetrekking wordt beschouwd de arbeidsverhouding van:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel3
  - number: 3.1.a
    text: |-
      degene, die, anders dan in de uitoefening van een bedrijf of in de zelfstandige uitoefening van een
      beroep, en anders dan als thuiswerker, ingevolge een overeenkomst tot aanneming van werk als bedoeld in
      [artikel 750 van Boek 7 van het Burgerlijk Wetboek][ref1], persoonlijk een werk tot stand brengt;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel750
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '750'
  - number: 3.1.b
    text: degene, die de in onderdeel a bedoelde persoon bij het tot stand brengen van dat werk bijstaat;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel3
  - number: 3.1.c
    text: |-
      degene, die krachtens overeenkomst met een ander tegen beloning geregeld zijn bemiddeling verleent tot het tot
      stand komen van overeenkomsten tussen daartoe door hem te bezoeken personen en die ander, mits hij de bedoelde
      bemiddeling uitsluitend voor die ander verleent, het verlenen van die bemiddeling niet een voor hem bijkomstige
      werkzaamheid is en hij zich daarbij doorgaans niet door meer dan twee andere personen laat bijstaan;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel3
  - number: 3.1.d
    text: |-
      degene, die krachtens overeenkomst met een ander tegen beloning geregeld zijn bemiddeling verleent tot het tot
      stand komen van overeenkomsten tussen daartoe door hem te bezoeken personen en een opdrachtgever van die ander,
      mits hij de bedoelde bemiddeling uitsluitend voor die ander verleent, het verlenen van die bemiddeling niet een
      voor hem bijkomstige werkzaamheid is en hij zich daarbij doorgaans niet door meer dan twee andere personen laat
      bijstaan;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel3
  - number: 3.1.e
    text: |-
      degene, die werkzaam is om vakbekwaamheid te verwerven, onder wie mede wordt begrepen degene, die als leerling van
      een instelling van onderwijs praktisch werkzaam is, alsmede degene, die aan een bedrijfsschool opleiding ontvangt,
      een en ander indien een beloning wordt genoten, die niet uitsluitend bestaat in het ontvangen van onderricht;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel3
  - number: 3.1.f
    text: |-
      het kind van 15 jaar of ouder dat werkzaam is in de onderneming van zijn ouder, tenzij die onderneming
      deel uitmaakt van een samenwerkingsverband met het kind en het kind daaruit als ondernemer als bedoeld in
      [artikel 3.4 van de Wet inkomstenbelasting 2001][ref1] winst uit onderneming geniet;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 3.1.g
    text: |-
      degene, die in de zin van [artikel 4 van de Ziektewet][ref1] (Stb. 1987, 88) als bestuurder werkzaam is ten behoeve
      van een coöperatie;


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel4
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '4'
  - number: 3.1.h
    text: |-
      de bestuurder van een vennootschap als bedoeld in
      [artikel 132, derde lid, van Boek 2 van het Burgerlijk Wetboek][ref1], mits hij geen niet uitvoerende bestuurder
      als bedoeld in [artikel 129a, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2] is.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel132
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel129a
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '132'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: 129a
  - number: '3.2'
    text: |-
      Het eerste lid, onderdelen a en b, vindt geen toepassing indien de in onderdeel a bedoelde overeenkomst
      rechtstreeks is aangegaan met een natuurlijk persoon ten behoeve van diens persoonlijke aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel3
  - number: '4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regelen worden gesteld, ingevolge welke eveneens als
      dienstbetrekking wordt beschouwd de arbeidsverhouding van:
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel4
  - number: 4.a
    text: degene, die als thuiswerker arbeid verricht;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel4
  - number: 4.b
    text: degene, die de onder *a* bedoelde persoon als hulp bij het verrichten van de arbeid bijstaat;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel4
  - number: 4.c
    text: |-
      degene, die een tak van sport op topniveau beoefent en ter zake daarvan een inkomensvoorziening of een
      kostenvergoeding geniet;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel4
  - number: 4.d
    text: |-
      degene, die arbeid verricht ten behoeve van een lichaam waarin hij of zijn partner als bedoeld
      in [artikel 12a, vijfde lid, onderdeel a][ref1], een aanmerkelijk belang heeft in de zin van de
      [Wet inkomstenbelasting 2001][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 12a
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0011353
  - number: 4.e
    text: |-
      degene, die tegen beloning persoonlijk arbeid verricht en wiens arbeidsverhouding niet reeds ingevolge de
      voorgaande bepalingen als dienstbetrekking wordt beschouwd, doch hiermede maatschappelijk gelijk kan worden
      gesteld;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel4
  - number: 4.f
    text: |-
      degene die uit een arbeidsverhouding die niet op grond van een andere bepaling als dienstbetrekking wordt beschouwd
      een beloning geniet, mits diegene vooraf aan de inspecteur meldt, door middel van een gezamenlijke verklaring van
      hemzelf en de beoogde inhoudingsplichtige, dat zijn arbeidsverhouding als dienstbetrekking moet worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel4
  - number: '5.1'
    text: |-
      Als dienstbetrekking wordt niet beschouwd de arbeidsverhouding van degene die uitsluitend of nagenoeg uitsluitend
      diensten verricht ten behoeve van het huishouden van de natuurlijke persoon tot wie hij in dienstbetrekking staat,
      indien hij de diensten doorgaans op minder dan vier dagen per week verricht.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel5
  - number: '5.2'
    text: |-
      Onder het verrichten van diensten ten behoeve van een huishouden wordt voor de toepassing van dit artikel mede
      verstaan het verlenen van zorg aan de leden van dat huishouden.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel5
  - number: 5a.1
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt verstaan onder artiest: degene die
      ingevolge een overeenkomst van korte duur als musicus of anderszins als artiest optreedt, tenzij:
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel5a
  - number: 5a.1.a
    text: |-
      hij inwoner is van Aruba, Curaçao, Sint Maarten, de BES eilanden of een land waarmee de Staat der Nederlanden een
      verdrag ter voorkoming van dubbele belasting heeft gesloten; of
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel5a
  - number: 5a.1.b
    text: |-
      hij het optreden rechtstreeks is overeengekomen met een natuurlijke persoon ten behoeve van diens persoonlijke
      aangelegenheden; of
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel5a
  - number: 5a.1.c
    text: hij voldoet aan bij algemene maatregel van bestuur te stellen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel5a
  - number: 5a.2
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt verstaan onder beroepssporter: degene die
      ingevolge een overeenkomst van korte duur als beroep een tak van sport beoefent, tenzij:
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel5a
  - number: 5a.2.a
    text: hij in Nederland woont, of
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel5a
  - number: 5a.2.b
    text: |-
      hij inwoner is van Aruba, Curaçao, Sint Maarten, de BES eilanden of een land waarmee de Staat der Nederlanden een
      verdrag ter voorkoming van dubbele belasting heeft gesloten; of
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel5a
  - number: 5a.2.c
    text: |-
      hij de sportbeoefening rechtstreeks is overeengekomen met een natuurlijke persoon ten behoeve van diens
      persoonlijke aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel5a
  - number: 5a.3
    text: |-
      Ingeval een artiest of beroepssporter optreedt of als beroep een tak van sport beoefent in het kader van een
      dienstbetrekking tot een in Nederland gevestigde inhoudingsplichtige, is hij voor de toepassing van deze wet en de
      daarop berustende bepalingen werknemer.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel5a
  - number: 5a.4
    text: |-
      Ingeval een niet in Nederland wonende artiest of beroepssporter optreedt of als beroep een tak van sport beoefent
      in het kader van een dienstbetrekking tot een inhoudingsplichtige die niet in Nederland is gevestigd, vindt de
      heffing van loonbelasting plaats ingevolge de regelingen zoals die gelden voor artiesten en beroepssporters.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel5a
  - number: 5b.1
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt verstaan onder buitenlands gezelschap: een
      groep van hoofdzakelijk niet in Nederland wonende natuurlijke personen of gevestigde lichamen waarbij de leden van
      de groep individueel of gezamenlijk ingevolge een overeenkomst van korte duur als artiest in Nederland optreden of
      als beroep een tak van sport in Nederland beoefenen, tenzij:
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel5b
  - number: 5b.1.1°
    text: |-
      het optreden of de sportbeoefening rechtstreeks is overeengekomen met een natuurlijk persoon ten behoeve van diens
      persoonlijke aangelegenheden, of
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel5b
  - number: 5b.1.2°
    text: |-
      volgens bij ministeriële regeling te stellen regels aannemelijk wordt gemaakt dat het gezelschap hoofdzakelijk
      bestaat uit leden die inwoner zijn dan wel gevestigd zijn in een land waarmee de Staat der Nederlanden een verdrag
      ter voorkoming van dubbele belasting heeft gesloten of inwoner zijn van dan wel gevestigd zijn in Nederland of op
      Aruba, Curaçao, Sint Maarten of de BES eilanden.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel5b
  - number: 5b.2
    text: |-
      De rechten die een buitenlands gezelschap heeft en de verplichtingen die daarop rusten, komen toe aan elk lid van
      het gezelschap en rusten op elk lid van het gezelschap. Een lid kan zich doen vertegenwoordigen door een lid dat
      als leider van het gezelschap fungeert.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel5b
  - number: 5b.3
    text: |-
      Ingeval een lid van een buitenlands gezelschap optreedt of als beroep een tak van sport beoefent in het kader
      van een dienstbetrekking tot een inhoudingsplichtige die niet in Nederland is gevestigd, vindt de heffing van
      loonbelasting plaats ingevolge de regelingen zoals die gelden voor het buitenlandse gezelschap.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel5b
  - number: '6.1'
    text: 'Inhoudingsplichtige is:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel6
  - number: 6.1.a
    text: degene, tot wie een of meer personen in dienstbetrekking staan;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel6
  - number: 6.1.b
    text: degene, die aan een of meer personen loon uit een vroegere dienstbetrekking tot hemzelf of tot een ander verstrekt;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel6
  - number: 6.1.c
    text: |-
      degene, die ingevolge een aanspraak die niet tot het loon behoort, aan een of meer personen uitkeringen of
      verstrekkingen uit een dienstbetrekking tot een ander doet.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel6
  - number: '6.2'
    text: 'Wie niet in Nederland woont of gevestigd is, wordt slechts als inhoudingsplichtige beschouwd voor zover hij:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel6
  - number: 6.2.a
    text: |-
      in Nederland een vaste inrichting voor de uitoefening van zijn bedrijf, beroep of andere bezigheid of een in
      Nederland wonende of gevestigde vaste vertegenwoordiger heeft, dan wel
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel6
  - number: 6.2.b
    text: |-
      een of meer personen in dienst heeft van wie het loon is onderworpen aan de inkomstenbelasting, met betrekking tot
      deze personen de loonadministratie in Nederland houdt en zich voor deze personen als inhoudingsplichtige bij de
      inspecteur heeft gemeld.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel6
  - number: '6.3'
    text: |-
      Voor de toepassing van het tweede lid, onderdeel *a*, wordt onder vaste inrichting of vaste vertegenwoordiger
      verstaan:
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel6
  - number: 6.3.a
    text: |-
      een vaste inrichting of vaste vertegenwoordiger als bedoeld in
      [artikel 3, vierde tot en met twaalfde lid, van de Wet op de vennootschapsbelasting 1969][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel3
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '3'
  - number: 6.3.b
    text: |-
      het verrichten van werkzaamheden in het kader van een onderneming gedurende een aaneengesloten periode van ten
      minste 30 dagen, indien die werkzaamheden plaatsvinden in, op of boven het Noordzeewinningsgebied, waarbij het
      Noordzeewinningsgebied bestaat uit de territoriale zee van Nederland alsmede het buiten de territoriale zee onder
      de Noordzee gelegen deel van de zeebodem en de ondergrond daarvan, voor zover het Koninkrijk der Nederlanden daar
      op grond van het internationale recht rechten mag uitoefenen;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel6
  - number: 6.3.c
    text: |-
      het verrichten van werkzaamheden die gericht zijn op het verlenen van tussenkomst ten behoeve van degenen die tegen
      beloning persoonlijke arbeid in Nederland verrichten en een derde ten behoeve van wie die arbeid wordt verricht.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel6
  - number: '6.4'
    text: |-
      Diplomatieke, consulaire en andere vertegenwoordigers van andere Mogendheden en de hun toegevoegde ambtenaren,
      alsmede bij ministeriële regeling aan te wijzen internationale organisaties en vertegenwoordigers en
      functionarissen daarvan, worden niet als inhoudingsplichtigen beschouwd.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel6
  - number: '6.5'
    text: |-
      Ingeval [artikel 19b][ref1] toepassing vindt, is in afwijking van het eerste lid voor de aanspraak die ingevolge
      dat artikel als loon wordt aangemerkt, inhoudingsplichtige degene die als verzekeraar van die aanspraak optreedt.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19b
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19b
        hoofdstuk: IIB
  - number: '6.6'
    text: |-
      Een in Nederland gevestigd onderdeel van een concern waartoe ook een onderdeel behoort dat op grond van het tweede
      of derde lid als inhoudingsplichtige wordt aangemerkt, kan op gezamenlijk verzoek van deze concernonderdelen, in
      afwijking in zoverre van het eerste, tweede en derde lid, door de inspecteur, die daarbij voorwaarden kan stellen,
      worden aangewezen als inhoudingsplichtige voor een of meer personen die bij het niet in Nederland gevestigde
      concernonderdeel in dienst zijn. De aanwijzing en de daarbij gestelde voorwaarden kunnen, al dan niet op verzoek,
      worden gewijzigd of ingetrokken. Aanwijzing, wijziging of intrekking vinden plaats bij voor bezwaar vatbare
      beschikking.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel6
  - number: '7'
    text: 'Als degene tot wie de dienstbetrekking bestaat, wordt beschouwd:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel7
  - number: 7.a
    text: |-
      bij toepassing van [artikel 3, eerste lid, onderdelen a en b][ref1]: de aanbesteder;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel3
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '3'
        hoofdstuk: I
  - number: 7.b
    text: |-
      bij toepassing van [artikel 3, eerste lid, onderdelen c en d][ref1]: degene met wie de overeenkomst tot bemiddeling
      is gesloten;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel3
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '3'
        hoofdstuk: I
  - number: 7.c
    text: |-
      bij toepassing van [artikel 3, eerste lid, onderdeel e][ref1]: degene bij wie de werkzaamheden worden verricht of
      de opleiding wordt genoten;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel3
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '3'
        hoofdstuk: I
  - number: 7.d
    text: |-
      bij toepassing van [artikel 3, eerste lid, onderdeel f][ref1]: de ouder;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel3
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '3'
        hoofdstuk: I
  - number: 7.e
    text: |-
      bij toepassing van [artikel 3, eerste lid, onderdeel g][ref1]: de coöperatie;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel3
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '3'
        hoofdstuk: I
  - number: 7.f
    text: |-
      bij toepassing van [artikel 3, eerste lid, onderdeel h][ref1]: de vennootschap;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel3
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '3'
        hoofdstuk: I
  - number: 7.g
    text: |-
      bij toepassing van [artikel 4, onderdeel a][ref1]: de opdrachtgever;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel4
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '4'
        hoofdstuk: I
  - number: 7.h
    text: |-
      bij toepassing van [artikel 4, onderdeel b][ref1]: de thuiswerker;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel4
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '4'
        hoofdstuk: I
  - number: 7.i
    text: |-
      bij toepassing van [artikel 4, onderdeel c][ref1]: degene met wie de inkomensvoorziening of kostenvergoeding is
      overeengekomen;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel4
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '4'
        hoofdstuk: I
  - number: 7.j
    text: |-
      bij toepassing van [artikel 4, onderdeel d][ref1]: het lichaam;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel4
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '4'
        hoofdstuk: I
  - number: 7.k
    text: |-
      bij toepassing van [artikel 4, onderdelen e en f][ref1]: degene die bij de algemene maatregel van bestuur, bedoeld
      in artikel 4, als inhoudingsplichtige is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel4
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '4'
        hoofdstuk: I
  - number: '8'
    text: |-
      Bij ministeriële regeling kan, in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid, een ander
      dan de persoon bedoeld in [artikel 6][ref1] of [artikel 7][ref2] worden aangewezen als inhoudingsplichtige met
      betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel7
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '6'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '7'
        hoofdstuk: I
  - number: 8.a
    text: |-
      degene, die krachtens overeenkomst met een ander tegen beloning geregeld zijn bemiddeling verleent tot het tot
      stand komen van overeenkomsten tussen daartoe door hem te bezoeken personen en een opdrachtgever van die ander;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel8
  - number: 8.b
    text: degene, die een thuiswerker als hulp bij het verrichten van de arbeid bijstaat;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel8
  - number: 8.c
    text: degene, die als beroep een tak van sport beoefent.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel8
  - number: 8a.1
    text: 'Ten aanzien van een artiest, beroepssporter of buitenlands gezelschap is inhoudingsplichtige:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel8a
  - number: 8a.1.a
    text: |-
      voorzover de gage wordt ontvangen van degene met wie het optreden of de sportbeoefening is overeengekomen: degene
      met wie het optreden of de sportbeoefening is overeengekomen;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel8a
  - number: 8a.1.b
    text: 'voorzover de gage wordt ontvangen van een derde: deze derde.'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel8a
  - number: 8a.2
    text: |-
      Wie niet in Nederland woont of gevestigd is, wordt slechts als inhoudingsplichtige beschouwd voorzover hij in
      Nederland een vaste inrichting voor de uitoefening van zijn bedrijf, beroep of andere bezigheid heeft, dan wel een
      in Nederland wonende of gevestigde vaste vertegenwoordiger. Hierbij wordt mede als vaste inrichting aangemerkt het
      in Nederland verrichten of doen verrichten van werkzaamheden die gericht zijn op het in Nederland laten optreden
      van artiesten, beroepssporters of buitenlandse gezelschappen.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel8a
  - number: 8a.3
    text: |-
      Bij ministeriële regeling kan, in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid, de
      inhoudingsplicht worden verlegd naar een andere persoon dan voortvloeit uit de toepassing van het eerste of tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel8a
  - number: '9.1'
    text: De belasting wordt geheven over het belastbare loon.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel9
  - number: '9.2'
    text: Belastbaar loon is het gezamenlijke bedrag aan loon.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel9
  - number: '10.1'
    text: |-
      Loon is al hetgeen uit een dienstbetrekking of een vroegere dienstbetrekking wordt genoten, daaronder mede begrepen
      hetgeen wordt vergoed of verstrekt in het kader van de dienstbetrekking.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel10
  - number: '10.2'
    text: |-
      Tot het loon behoren aanspraken om na verloop van tijd of onder een voorwaarde een of meer uitkeringen of
      verstrekkingen te ontvangen.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel10
  - number: '10.3'
    text: Onder aanspraken worden mede verstaan rechten op geheel of gedeeltelijk betaald verlof.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel10
  - number: '10.4'
    text: |-
      Tot het loon behoren uitkeringen en verstrekkingen ingevolge een tot het loon behorende aanspraak voor zover de
      aanspraak in afwijking van hetgeen bij of krachtens deze wet is bepaald, bij de bepaling van de verschuldigde
      belasting niet als loon in aanmerking is genomen.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel10
  - number: '10.5'
    text: |-
      Onverminderd de omstandigheid dat de inhoudingsplichtige ingevolge [artikel 32ba][ref1] of [artikel 32bb][ref2]
      de aldaar bedoelde belasting is verschuldigd en de bedragen die worden ingehouden als bijdrage ingevolge een in
      [artikel 32ba][ref3] bedoelde regeling tot het loon behoren, behoren tot het loon:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel32ba
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel32bb
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel32ba
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 32ba
        hoofdstuk: V
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 32bb
        hoofdstuk: V
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 32ba
        hoofdstuk: V
        afdeling: '2'
  - number: 10.5.a
    text: |-
      uitkeringen en verstrekkingen uit een voordien niet tot het loon gerekende aanspraak ingevolge een regeling voor
      vervroegde uittreding in de zin van [artikel 32ba][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel32ba
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 32ba
        hoofdstuk: V
        afdeling: '2'
  - number: 10.5.b
    text: |-
      vertrekvergoedingen als bedoeld in [artikel 32bb][ref1], met uitzondering van vertrekvergoedingen als bedoeld in
      [artikel 32bb, vijfde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel32bb
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel32bb
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 32bb
        hoofdstuk: V
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 32bb
        hoofdstuk: V
        afdeling: '2'
  - number: 10.5.c
    text: |-
      hetgeen ingevolge [artikel 10a][ref1] tot het loon behoort ter zake van een aandelenoptierecht als bedoeld in
      [artikel 32bb, vijfde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel32bb
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 10a
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 32bb
        hoofdstuk: V
        afdeling: '2'
  - number: 10a.1
    text: |-
      Ingeval in het kader van een dienstbetrekking of vroegere dienstbetrekking met een werknemer een aandelenoptierecht
      is overeengekomen, behoort niet de waarde van dat recht tot het loon doch:
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel10a
  - number: 10a.1.a
    text: 'de waarde in het economische verkeer van de bij uitoefening van dat recht verkregen aandelen ten tijde van:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel10a
  - number: 10a.1.a.1°
    text: de uitoefening van dat recht ingeval de verkregen aandelen onmiddellijk verhandelbaar zijn; of
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel10a
  - number: 10a.1.a.2°
    text: het verhandelbaar worden van de verkregen aandelen ingeval deze niet onmiddellijk verhandelbaar zijn; of
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel10a
  - number: 10a.1.b
    text: hetgeen door de werknemer wordt genoten ter zake van de vervreemding van dat recht.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel10a
  - number: 10a.2
    text: |-
      Het loon dat ingevolge dit artikel, met uitzondering van het dertiende lid in aanmerking wordt genomen, wordt
      verminderd met het bedrag dat de werknemer ter zake van het aandelenoptierecht in rekening is gebracht, maar niet
      verder dan tot nihil.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel10a
  - number: 10a.3
    text: |-
      Indien zulks plaatsvindt in het kader van een aandelenfusie, een splitsing van een rechtspersoon, een fusie
      van een rechtspersoon of een overname van 50% of meer van de aandelen in de inhoudingsplichtige of een met de
      inhoudingsplichtige verbonden vennootschap wordt als uitoefening of vervreemding van een aandelenoptierecht niet
      beschouwd:
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel10a
  - number: 10a.3.a
    text: het wijzigen van de voorwaarden van het optierecht terzake van het aandeel waarop het optierecht ziet, of
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel10a
  - number: 10a.3.b
    text: |-
      het vervangen van het optierecht door een ander aandelenoptierecht waarbij dat andere optierecht ziet op een
      ander aandeel, tenzij aannemelijk is dat het wijzigen of het vervangen van het aandelenoptierecht, in meer dan
      betekenende mate plaatsvindt om belastingheffing ter zake van het recht uit te stellen of te ontgaan.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel10a
  - number: 10a.4
    text: |-
      Onder vervreemding wordt mede begrepen het formeel of feitelijk tot voorwerp van zekerheid worden, het
      brengen in het vermogen van een onderneming, alsmede het ontvangen van een schadeloosstelling als bedoeld in
      [artikel 334p, eerste lid][ref1], of [artikel 320, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2]. De
      overgang onder algemene titel van een aandelenoptierecht wordt niet als een vervreemding aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel334p
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel320
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 334p
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '320'
  - number: 10a.5
    text: |-
      Ingeval bij vervreemding van een aandelenoptierecht de tegenprestatie ontbreekt of is bedongen bij een niet onder
      normale omstandigheden gesloten overeenkomst, wordt als genoten bedrag aangemerkt de waarde in het economische
      verkeer welke ten tijde van de vervreemding aan het recht kan worden toegekend.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel10a
  - number: 10a.6
    text: |-
      Voor de toepassing van dit artikel wordt onder een aandelenoptierecht verstaan een recht om een of meer aandelen
      of daarmee gelijk te stellen rechten te verwerven in de inhoudingsplichtige vennootschap of in een met de
      inhoudingsplichtige verbonden vennootschap, of een daarmee gelijk te stellen recht.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel10a
  - number: 10a.7
    text: 'Voor de toepassing van deze wet wordt onder een met de inhoudingsplichtige verbonden vennootschap verstaan:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel10a
  - number: 10a.7.a
    text: een vennootschap waarin de inhoudingsplichtige voor ten minste een derde gedeelte belang heeft;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel10a
  - number: 10a.7.b
    text: een vennootschap die voor ten minste een derde gedeelte belang heeft in de inhoudingsplichtige;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel10a
  - number: 10a.7.c
    text: |-
      een vennootschap waarin een derde voor ten minste een derde gedeelte belang heeft, terwijl deze derde tevens voor
      ten minste een derde gedeelte belang heeft in de inhoudingsplichtige.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel10a
  - number: 10a.8
    text: |-
      Voor de toepassing van dit artikel wordt, indien een inhoudingsplichtige vennootschap of een met de
      inhoudingsplichtige vennootschap verbonden vennootschap is betrokken bij een splitsing of een fusie op de voet
      van [artikel 334a][ref1] onderscheidenlijk [artikel 309 van Boek 2 van het Burgerlijk Wetboek][ref2], onder die
      vennootschap mede verstaan de verkrijgende vennootschap in de zin van die artikelen alsmede de vennootschap die
      vóór de splitsing onderscheidenlijk fusie werd aangemerkt als een met de inhoudingsplichtige vennootschap verbonden
      vennootschap.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel334a
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel309
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 334a
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '309'
  - number: 10a.9
    text: |-
      Indien de bij uitoefening van een aandelenoptierecht als bedoeld in het eerste lid verkregen aandelen op grond van
      een ter zake van dat aandelenoptierecht op de werknemer van toepassing zijnde contractuele bepaling gedurende een
      bepaalde periode niet verhandelbaar zijn als bedoeld in het eerste lid, onderdeel a, onder 2°, worden die aandelen
      voor de toepassing van het eerste lid, onderdeel a, en [artikel 13a, vierde lid, onderdeel a][ref1], uiterlijk na
      een periode van vijf jaar na beursgang van de vennootschap waarin de aandelen worden gehouden dan wel indien deze
      vennootschap bij uitoefening van het aandelenoptierecht reeds beursgenoteerd is uiterlijk na een periode van vijf
      jaar na uitoefening van het aandelenoptierecht geacht verhandelbaar te zijn, met dien verstande dat de aandelen ook
      na die periode van vijf jaar niet geacht worden verhandelbaar te zijn zolang de aandelen ingevolge een wettelijke
      bepaling niet verhandelbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel13a
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 13a
        hoofdstuk: II
  - number: 10a.10
    text: |-
      Indien de bij uitoefening van een aandelenoptierecht als bedoeld in het eerste lid verkregen aandelen waarop het
      eerste lid, onderdeel a, nog geen toepassing heeft gevonden worden vervangen door andere aandelen als bedoeld in
      het derde lid, vindt de toepassing van het eerste lid, onderdeel a, [artikel 13a, vierde lid, onderdeel a][ref1],
      en [artikel 32bb, vijfde lid, onderdeel b][ref2], plaats met betrekking tot die andere aandelen, met dien verstande
      dat ingeval die andere aandelen onmiddellijk verhandelbaar zijn de waarde in het economische verkeer van die
      andere aandelen ten tijde van het vervangen van de verkregen aandelen door die andere aandelen in aanmerking wordt
      genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel13a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel32bb
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 13a
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 32bb
        hoofdstuk: V
        afdeling: '2'
  - number: 10a.11
    text: |-
      Indien verkregen aandelen als bedoeld in het eerste lid, onderdeel a, onder 2°, niet onmiddellijk verhandelbaar
      zijn als gevolg van een op de werknemer van toepassing zijnde contractuele of wettelijke bepaling en de werknemer
      in strijd met die bepaling de verkregen aandelen vervreemdt voordat het aandelenoptierecht ingevolge het eerste
      lid, met inachtneming van de termijn, bedoeld in het negende lid, in de heffing is betrokken, behoort in zoverre
      in afwijking van het eerste lid tot het loon hetgeen met overeenkomstige toepassing van het vijfde lid door de
      werknemer wordt genoten ter zake van de vervreemding van de verkregen aandelen. Het loon dat ingevolge de eerste
      zin in aanmerking wordt genomen, wordt verminderd met het bedrag dat de werknemer ter zake van de schending van de
      bepaling, bedoeld in de eerste zin, in rekening is gebracht, maar niet verder dan tot nihil.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel10a
  - number: 10a.12
    text: |-
      Indien de bij uitoefening van een aandelenoptierecht als bedoeld in het eerste lid verkregen aandelen niet
      onmiddellijk verhandelbaar zijn als bedoeld in het eerste lid, onderdeel a, onder 2°, wordt naar keuze van
      de werknemer in afwijking van het eerste lid, onderdeel a, onder 2°, tot het loon gerekend de waarde in het
      economische verkeer van de bij uitoefening van dat recht verkregen aandelen ten tijde van de uitoefening van
      dat recht. De eerste zin is slechts van toepassing indien de werknemer de keuze, bedoeld in de eerste zin,
      uiterlijk op het moment van uitoefening van het recht, bedoeld in de eerste zin, schriftelijk kenbaar maakt
      aan de inhoudingsplichtige. De inhoudingsplichtige bewaart de vastlegging van de keuze van de werknemer bij de
      loonadministratie.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel10a
  - number: 10a.13
    text: |-
      Tot het loon ter zake van een aandelenoptierecht als bedoeld in het eerste lid, onderdeel a, worden mede gerekend
      de voordelen die de werknemer geniet uit de bij uitoefening van dat aandelenoptierecht verkregen aandelen waarop
      het eerste lid, onderdeel a, en het twaalfde lid nog geen toepassing hebben gevonden, verminderd met de op die
      voordelen betrekking hebbende kosten, maar niet verder dan tot nihil.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel10a
  - number: 10a.14
    text: |-
      Indien de bij uitoefening van een aandelenoptierecht als bedoeld in het eerste lid verkregen aandelen niet
      onmiddellijk verhandelbaar zijn als bedoeld in het eerste lid, onderdeel a, onder 2°, en het verhandelbaar worden
      van die aandelen deels of geheel afhankelijk is van onzekere factoren die grotendeels buiten de invloedsfeer van
      de werknemer liggen, kunnen bij ministeriële regeling regels worden gesteld met betrekking tot situaties waarin
      bepaalde aandelen voor de toepassing van het eerste lid, onderdeel a, onder 2°, worden geacht niet, deels of geheel
      verhandelbaar te worden.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel10a
  - number: '11.1'
    text: 'Tot het loon behoren niet:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel11
  - number: 11.1.c
    text: |-
      aanspraken ingevolge een pensioenregeling, een en ander volgens de in of krachtens [hoofdstuk IIB][ref1] gestelde
      normeringen en beperkingen;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#HoofdstukIIB
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002471
        hoofdstuk: IIB
  - number: 11.1.d
    text: |-
      aanspraken ingevolge een regeling voor vervroegde uittreding als bedoeld in [artikel 32ba][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel32ba
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 32ba
        hoofdstuk: V
        afdeling: '2'
  - number: 11.1.e
    text: |-
      aanspraken ingevolge de [Ziektewet][ref1], de [Wet arbeid en zorg][ref2], de
      [Wet werk en inkomen naar arbeidsvermogen][ref3], de [Wet op de arbeidsongeschiktheidsverzekering][ref4] en de
      [Werkloosheidswet][ref5];


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0013008
      [ref3]: https://wetten.overheid.nl/BWBR0019057
      [ref4]: https://wetten.overheid.nl/BWBR0002524
      [ref5]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0013008
      - id: ref3
        bwb_id: BWBR0019057
      - id: ref4
        bwb_id: BWBR0002524
      - id: ref5
        bwb_id: BWBR0004045
  - number: 11.1.f
    text: aanspraken, die naar aard en strekking overeenkomen met aanspraken als bedoeld in onderdeel e;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel11
  - number: 11.1.h
    text: aanspraken op uitkeringen wegens overlijden of invaliditeit ten gevolge van een ongeval;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel11
  - number: 11.1.j
    text: 'bedragen die worden ingehouden:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel11
  - number: 11.1.j.1°
    text: als bijdrage ingevolge een pensioenregeling;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel11
  - number: 11.1.j.2°
    text: als bijdrage voor aanspraken die ingevolge de onderdelen f en h niet tot het loon behoren;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel11
  - number: 11.1.j.3°
    text: in plaats van bijdragen als bedoeld onder 2°;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel11
  - number: 11.1.k
    text: |-
      uitkeringen en verstrekkingen tot vergoeding van door de werknemer in verband met zijn dienstbetrekking geleden
      schade aan of verlies van persoonlijke zaken;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel11
  - number: 11.1.l
    text: |-
      bij ministeriële regeling aan te wijzen voorzieningen voor militaire oorlogs- of dienstslachtoffers die verband
      houden met invaliditeit;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel11
  - number: 11.1.m
    text: |-
      eenmalige uitkeringen en verstrekkingen ter zake van overlijden van de werknemer, zijn partner in het kalenderjaar
      of in het voorafgaande kalenderjaar – in de zin van [artikel 1.2 van de Wet inkomstenbelasting 2001][ref1], of zijn
      kinderen en pleegkinderen, voorzover deze uitkeringen en verstrekkingen niet overtreffen driemaal het loon over een
      maand bepaald met inachtneming van bij ministeriële regeling te stellen regels, alsmede aanspraken op de hiervoor
      bedoelde uitkeringen en verstrekkingen;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel1
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '1'
  - number: 11.1.n
    text: |-
      uitkeringen en verstrekkingen, andere dan die ter zake van ziekte, invaliditeit, bevalling, adoptie en overlijden,
      die de werknemer ontvangt uit een fonds tot welks middelen de inhoudingsplichtige gedurende de laatstverlopen
      vijf kalenderjaren evenveel of minder heeft bijgedragen dan de bij het fonds betrokken werknemers, tenzij die
      uitkeringen en verstrekkingen geschieden ingevolge een aanspraak die niet tot het loon behoort;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel11
  - number: 11.1.o
    text: |-
      een uitkering of verstrekking die eenmaal wordt toegekend na het bereiken van een diensttijd van ten minste 25 jaar
      en een uitkering of verstrekking die eenmaal wordt toegekend na het bereiken van een diensttijd van ten minste 40
      jaar, voor zover de waarde daarvan het loon over een maand niet overtreft, mits is voldaan aan bij ministeriële
      regeling te stellen voorwaarden;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel11
  - number: 11.1.r
    text: 'aanspraken:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel11
  - number: 11.1.r.1°
    text: |-
      op vakantieverlof en compensatieverlof, voorzover deze aanspraken aan het einde van het kalenderjaar in totaal niet
      meer bedragen dan de arbeidsduur per week gerekend over een periode van honderd weken;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel11
  - number: 11.1.r.2°
    text: op bij ministeriële regeling aan te wijzen geclausuleerd verlof;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel11
  - number: 11.1.r.3°
    text: op verlof tijdens rust- en feestdagen.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel11
  - number: 11.1.s
    text: |-
      hetgeen wordt genoten ter zake van het verrichten van arbeid in de onderneming van de partner van de werknemer,
      indien bij het bepalen van de winst uit die onderneming de kosten en lasten die verband houden met de vergoeding
      voor die arbeid op grond van [artikel 3.16, vierde lid, van de Wet inkomstenbelasting 2001][ref1] niet in aftrek
      komen;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 11.1.t
    text: |-
      aanspraken op een transitievergoeding als bedoeld in [artikel 673 van Boek 7 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel673
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '673'
  - number: '11.2'
    text: |-
      Bij of krachtens ministeriële regeling kan, in overeenstemming met Onze Minister van Sociale Zaken en
      Werkgelegenheid, worden bepaald dat eveneens niet tot het loon behoren andere aanspraken dan bedoeld in het eerste
      lid, indien zulks tot vergemakkelijking van de heffing van de belasting kan leiden.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel11
  - number: '11.3'
    text: |-
      Voorzover de aanspraken op vakantieverlof en compensatieverlof aan het einde van het kalenderjaar in totaal de
      in het eerste lid, onderdeel r, onder 1°, opgenomen begrenzingen overschrijden, wordt het meerdere geacht te
      zijn genoten bij het einde van het kalenderjaar of het einde van de dienstbetrekking zo deze in de loop van het
      kalenderjaar eindigt.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel11
  - number: 11b
    text: 'Tot het loon behoren voorts mede niet:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel11b
  - number: 11b.a
    text: |-
      een premie als bedoeld in [artikel 31, tweede lid, onderdeel j, van de Participatiewet][ref1],
      mits in het jaar waarin de premie is verstrekt geen vergoeding is verstrekt als bedoeld in
      [artikel 31, tweede lid, onderdeel k, van de Participatiewet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel31
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '31'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '31'
  - number: 11b.b
    text: |-
      een bij ministeriële regeling, zonodig onder het stellen van voorwaarden, aan te wijzen premie die naar aard en
      strekking overeenkomt met een premie als bedoeld in onderdeel a.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel11b
  - number: 11c
    text: |-
      Bij de bepaling van de omvang van het loon wordt geen rekening gehouden met de omstandigheid dat met toepassing
      van [artikel 34, tweede lid][ref1], of [artikel 41 van de Wet financiering sociale verzekeringen][ref2]
      bedragen op de werknemer worden verhaald of met de omstandigheid dat met toepassing van
      [artikel 59, achtste lid, van die wet][ref3] de op de voet van [hoofdstuk 3 van die wet][ref4] verschuldigde
      premies worden nageheven van de werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel59
      [ref4]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel11c
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '41'
      - id: ref3
        bwb_id: BWBR0017745
        artikel: '59'
      - id: ref4
        bwb_id: BWBR0017745
        hoofdstuk: '3'
  - number: 11d
    text: |-
      Bij de bepaling van de omvang van het loon wordt geen rekening gehouden met de ter zake van het loon verschuldigde
      inkomensafhankelijke bijdrage, bedoeld in de [Zorgverzekeringswet][ref1], en de niet in Nederland verschuldigde
      bijdragen die naar aard en strekking overeenkomen met ter zake van het loon verschuldigde inkomensafhankelijke
      bijdrage als bedoeld in de Zorgverzekeringswet.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel11d
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: 11e
    text: 'Bij de bepaling van de omvang van het loon wordt geen rekening gehouden met op de werknemer drukkende:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel11e
  - number: 11e.a
    text: |-
      geldboeten opgelegd door een strafrechter, geldsommen betaald aan een staat of een onderdeel daarvan ter
      voorkoming van strafvervolging, in het kader van een strafbeschikking of daarmee vergelijkbare buitenlandse
      wijze van bestraffing, dan wel ter voldoening aan een voorwaarde verbonden aan een besluit tot gratieverlening,
      bestuurlijke boeten en daarmee vergelijkbare buitenlandse boeten, geldboeten opgelegd op basis van bij wet
      geregeld tuchtrecht, geldboeten opgelegd door een instelling van de Europese Unie, alsmede kosten als bedoeld in de
      [artikelen 234, vijfde lid][ref1], en [235, derde lid, van de Gemeentewet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel234
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel235
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel11e
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '234'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '235'
  - number: 11e.b
    text: |-
      dwangsommen als bedoeld in [afdeling 5.3.2 van de Algemene wet bestuursrecht][ref1] en daarmee vergelijkbare
      buitenlandse dwangsommen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling5.3.2
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel11e
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 5.3.2
  - number: '12'
    text: |-
      Bij ministeriële regeling kunnen, in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid,
      regels worden gesteld met betrekking tot het bedrag aan fooien en dergelijke prestaties van derden, dat in bepaalde
      gevallen of groepen van gevallen geacht wordt te zijn genoten. Daarbij kan worden bepaald, dat een bedrag aan
      fooien en dergelijke prestaties van derden niet tot het loon behoort.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel12
  - number: 12a.1
    text: |-
      Ten aanzien van de werknemer die arbeid verricht ten behoeve van een lichaam waarin hij of zijn partner een
      aanmerkelijk belang heeft, wordt het in het kalenderjaar van dat lichaam genoten loon ten minste gesteld op het
      hoogste van de volgende bedragen:
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel12a
  - number: 12a.1.a
    text: het loon uit de meest vergelijkbare dienstbetrekking;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel12a
  - number: 12a.1.b
    text: |-
      het hoogste loon van de werknemers die in dienst zijn van het lichaam, bedoeld in de aanhef, of met het lichaam
      verbonden lichamen;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel12a
  - number: 12a.1.c
    text: € 51.000.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel12a
  - number: 12a.2
    text: |-
      Indien de inhoudingsplichtige aannemelijk maakt dat het hoogste bedrag, bedoeld in het eerste lid, hoger is dan
      het loon uit de meest vergelijkbare dienstbetrekking, wordt het loon in afwijking van het eerste lid gesteld op het
      loon uit de meest vergelijkbare dienstbetrekking.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel12a
  - number: 12a.3
    text: |-
      Indien [artikel 32d][ref1] van toepassing is op het door een of meer lichamen verschuldigde loon, worden het eerste
      en tweede lid toegepast alsof de ten behoeve van deze andere lichamen verrichte arbeid is verricht ten behoeve van
      de inhoudingsplichtige die ingevolge artikel 32d geacht wordt het loon te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel32d
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 32d
        hoofdstuk: VB
  - number: 12a.4
    text: |-
      Het eerste en tweede lid zijn niet van toepassing indien het bij toepassing van het eerste tot en met derde
      lid vast te stellen loon voor de arbeid in het lichaam, bedoeld in het eerste lid, en met het lichaam verbonden
      lichamen in het kalenderjaar niet hoger is dan € 5.000.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel12a
  - number: 12a.5
    text: 'Voor de toepassing van dit artikel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel12a
  - number: 12a.5.a
    text: |-
      partner: een in [artikel 3.91, tweede lid, onderdeel b, onder 1°, van de Wet inkomstenbelasting 2001][ref1]
      aangeduide persoon;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 12a.5.b
    text: |-
      een aanmerkelijk belang: een aanmerkelijk belang in de zin van de [Wet inkomstenbelasting 2001][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: 12a.5.c
    text: 'meest vergelijkbare dienstbetrekking: de dienstbetrekking die van alle dienstbetrekkingen:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel12a
  - number: 12a.5.c.1°
    text: waarbij een aanmerkelijk belang geen rol speelt;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel12a
  - number: 12a.5.c.2°
    text: die bekend zijn bij de inhoudingsplichtige en de inspecteur;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel12a
  - number: 12a.5.c.3°
    text: waarvan het loon bekend is of in redelijkheid geschat kan worden; en
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel12a
  - number: 12a.5.c.4°
    text: waarvan het loon niet op een ander bedrag is vastgesteld dan in het economische verkeer gebruikelijk is;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel12a
  - number: 12a.5.d
    text: |-
      met het lichaam verbonden lichamen: met het lichaam verbonden vennootschappen als bedoeld in
      [artikel 10a, zevende lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 10a
        hoofdstuk: II
  - number: 12a.6
    text: |-
      De inspecteur die aannemelijk maakt dat het loon uit de meest vergelijkbare dienstbetrekking hoger is dan het
      bedrag waarop het loon door de inhoudingsplichtige gesteld is, overlegt aan de inhoudingsplichtige ten minste de
      criteria op basis waarvan de inspecteur heeft vastgesteld dat de door de inspecteur aangedragen dienstbetrekking de
      meest vergelijkbare dienstbetrekking is.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel12a
  - number: 12a.7
    text: |-
      Het in het eerste lid vermelde bedrag wordt bij het begin van het kalenderjaar bij ministeriële regeling
      vervangen door een ander. Dit bedrag wordt berekend door het te vervangen bedrag te vermenigvuldigen met de
      tabelcorrectiefactor van [artikel 10.2 van de Wet inkomstenbelasting 2001][ref1] en vervolgens de nodig geachte
      afronding aan te brengen. Indien in het voorafgaande jaar een dergelijke afronding is toegepast, kan bij vervanging
      worden uitgegaan van het niet-afgeronde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel10
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '10'
  - number: '13.1'
    text: |-
      Niet in geld genoten loon wordt in aanmerking genomen naar de waarde die daaraan in het economische verkeer
      kan worden toegekend, met dien verstande dat ingeval door een derde, niet zijnde een met de inhoudingsplichtige
      verbonden vennootschap, ter zake van het niet in geld genoten loon een bedrag aan de inhoudingsplichtige in
      rekening wordt gebracht, het door de derde in rekening gebrachte bedrag in aanmerking wordt genomen.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13
  - number: '13.2'
    text: |-
      Met betrekking tot niet in geld genoten loon in de vorm van verstrekkingen van branche-eigen producten van
      het bedrijf van de inhoudingsplichtige dan wel van het bedrijf van een met de inhoudingsplichtige verbonden
      vennootschap, wordt, in zoverre in afwijking van het eerste lid, steeds de waarde die daaraan in het economische
      verkeer kan worden toegekend in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13
  - number: '13.3'
    text: |-
      Bij ministeriële regeling kunnen, in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid, nadere
      regels worden gesteld op grond waarvan de waarde van het volgende niet in geld genoten loon op een lager bedrag kan
      worden gesteld dan het ingevolge de vorige leden in aanmerking te nemen bedrag:
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13
  - number: 13.3.a
    text: |-
      voorzieningen die geheel of gedeeltelijk gebruikt of verbruikt worden op een bij die ministeriële regeling aan te
      wijzen werkplek;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13
  - number: 13.3.b
    text: |-
      het genot van een in het kader van de dienstbetrekking ter beschikking gesteld recht op vrij reizen per
      Nederlands openbaar vervoer dat niet is beperkt tot reizen over een vast traject ten behoeve van woon-werkverkeer
      (openbaarvervoerkaart) of recht op vermindering tot maximaal 50% van de prijs van vervoerbewijzen voor het reizen
      per Nederlands openbaar vervoer hoofdzakelijk buiten de ochtendspits (voordeelurenkaart);
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13
  - number: 13.3.c
    text: het genot van een in het kader van de dienstbetrekking ter beschikking gestelde woning.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13
  - number: '13.4'
    text: |-
      De waarde van het rentevoordeel van een door de inhoudingsplichtige dan wel door een met de inhoudingsplichtige
      verbonden vennootschap aan de werknemer verstrekte geldlening ter zake van de aanschaf van een fiets, elektrische
      fiets of elektrische scooter wordt gesteld op nihil.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13
  - number: '13.5'
    text: |-
      Bij ministeriële regeling kunnen, in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid, nadere
      regels worden gesteld met betrekking tot de waardering van aanspraken.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13
  - number: '13.6'
    text: |-
      De ingevolge de vorige leden in aanmerking te nemen waarde wordt verminderd met het bedrag dat de werknemer ter
      zake in rekening wordt gebracht, met dien verstande dat de aldus verminderde waarde ten minste op nihil wordt
      gesteld.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13
  - number: 13bis.1
    text: |-
      Indien ook voor privédoeleinden een auto ter beschikking is gesteld, wordt het voordeel op kalenderjaarbasis
      gesteld op ten minste:
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13bis
  - number: 13bis.1.a
    text: 22% van de waarde van de auto indien de auto niet meer dan 15 jaar geleden voor het eerst in gebruik is genomen;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13bis
  - number: 13bis.1.b
    text: 35% van de waarde van de auto indien de auto meer dan 15 jaar geleden voor het eerst in gebruik is genomen.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13bis
  - number: 13bis.2
    text: |-
      Het voordeel, bedoeld in het eerste lid, eerste volzin, wordt op kalenderjaarbasis verlaagd met 6% van de
      waarde van de auto indien uit het kentekenregister blijkt dat de CO-uitstoot 0 gram per kilometer is, met dien
      verstande dat het bedrag van de verlaging ten hoogste € 1.800 bedraagt tenzij de auto wordt aangedreven door een
      motor die kan worden gevoed met waterstof of de auto is voorzien van geïntegreerde zonnepanelen waarbij de voor
      de aandrijving benodigde energie wordt opgeslagen in een accupakket dat geen lood bevat en de zonnepanelen een
      vermogen hebben van ten minste 1 kilowattpiek.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13bis
  - number: 13bis.3
    text: |-
      Voor de toepassing van dit artikel en de daarop berustende bepalingen wordt woon-werkverkeer geacht niet
      voor privédoeleinden plaats te vinden. Indien uit een rittenregistratie of anderszins blijkt dat de auto op
      kalenderjaarbasis voor niet meer dan 500 kilometer voor privédoeleinden wordt gebruikt, wordt het voordeel gesteld
      op nihil. Bij ministeriële regeling kunnen regels worden gesteld waaraan een rittenregistratie moet voldoen. Tevens
      kunnen regels worden gesteld over het anderszins laten blijken dat de auto op kalenderjaarbasis voor niet meer dan
      500 kilometer voor privédoeleinden wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13bis
  - number: 13bis.4
    text: |-
      Het voordeel wordt in aanmerking genomen voorzover het uitgaat boven de vergoeding die de werknemer voor het
      gebruik voor privé-doeleinden is verschuldigd.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13bis
  - number: 13bis.5
    text: 'Voor de toepassing van dit artikel en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13bis
  - number: 13bis.5.a
    text: |-
      *auto:* personenauto of bestelauto als bedoeld in
      [artikel 3 van de Wet op de belasting van personenauto’s en motorrijwielen 1992][ref1], met uitzondering van een
      bestelauto die door aard of inrichting uitsluitend of nagenoeg uitsluitend geschikt blijkt te zijn voor vervoer van
      goederen en met uitzondering van een bestelauto die buiten de werktijd niet gebruikt kan worden of een bestelauto
      waarvoor een verbod op privégebruik geldt, waarbij van een dergelijk verbod op privégebruik sprake is indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel3
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13bis
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '3'
  - number: 13bis.5.a.1°
    text: het verbod schriftelijk is vastgelegd;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13bis
  - number: 13bis.5.a.2°
    text: de inhoudingsplichtige de vastlegging van het verbod bij de loonadministratie bewaart;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13bis
  - number: 13bis.5.a.3°
    text: de inhoudingsplichtige voldoende toezicht houdt op de naleving van het verbod, en
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13bis
  - number: 13bis.5.a.4°
    text: de inhoudingsplichtige een passende sanctie oplegt indien het verbod wordt overtreden;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13bis
  - number: 13bis.5.b
    text: |-
      *waarde van de auto:* catalogusprijs in de zin van
      [artikel 9 van de Wet op de belasting van personenauto’s en motorrijwielen 1992][ref1] vermeerderd met de
      belasting van personenauto’s en motorrijwielen ingevolge de artikelen 9 tot en met 9c van die wet, met dien
      verstande dat de waarde van een auto die meer dan vijftien jaar geleden voor het eerst in gebruik is genomen, wordt
      gesteld op de waarde in het economische verkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel9
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13bis
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '9'
  - number: 13bis.6
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de loontijdvakken waarin het in het
      eerste lid bedoelde voordeel in aanmerking wordt genomen.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13bis
  - number: 13bis.7
    text: |-
      Indien de werknemer een verklaring van de inspecteur overlegt waarin is vastgelegd dat de werknemer aan de
      inspecteur heeft medegedeeld dat de hem ter beschikking gestelde auto op kalenderjaarbasis voor niet meer dan
      500 kilometer voor privé-doeleinden wordt gebruikt (verklaring geen privé-gebruik), laat de inhoudingsplichtige
      inhouding van belasting over het in het eerste lid bedoelde voordeel achterwege. De eerste volzin is niet van
      toepassing ingeval de inhoudingsplichtige weet dat de in de eerste volzin bedoelde mededeling niet juist is.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13bis
  - number: 13bis.8
    text: |-
      De werknemer kan een verzoek om een verklaring geen privé-gebruik bij de inspecteur indienen. De inspecteur beslist
      op het verzoek bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13bis
  - number: 13bis.9
    text: |-
      De inspecteur kan de verklaring geen privé-gebruik, al dan niet op verzoek van de werknemer, bij voor bezwaar
      vatbare beschikking intrekken, waarbij de intrekking voor zover nodig terugwerkende kracht kan hebben. Bij algemene
      maatregel van bestuur wordt bepaald in welke gevallen de werknemer om intrekking moet verzoeken.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13bis
  - number: 13bis.10
    text: |-
      In geval van een verklaring geen privé-gebruik kan de inspecteur de werknemer op enig moment verzoeken te doen
      blijken dat de auto op kalenderjaarbasis voor niet meer dan 500 kilometer voor privé-doeleinden wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13bis
  - number: 13bis.11
    text: |-
      Indien de verklaring geen privé-gebruik wordt ingetrokken of indien de werknemer niet
      doet blijken dat de auto op kalenderjaarbasis voor niet meer dan 500 kilometer voor privé-
      doeleinden is gebruikt, wordt de verschuldigde belasting, voorzover nodig in afwijking van
      [artikel 20, tweede lid, van de Algemene wet inzake rijksbelastingen][ref1], nageheven van de werknemer. In
      afwijking van de eerste volzin wordt nageheven van de inhoudingsplichtige ingeval de inhoudingsplichtige wist dat
      de mededeling, bedoeld in het zevende lid, eerste volzin, niet juist was.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel20
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13bis
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '20'
  - number: 13bis.12
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de verklaring geen privé-gebruik.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13bis
  - number: 13bis.13
    text: |-
      Indien een bestelauto als bedoeld in
      [artikel 3, derde lid, van de Wet op de belasting van personenauto’s en motorrijwielen 1992][ref1] door de
      werknemer uitsluitend zakelijk wordt gebruikt, kan de werknemer door tussenkomst van de inhoudingsplichtige
      met betrekking tot deze auto aan de inspecteur een verklaring uitsluitend zakelijk gebruik afgeven (verklaring
      uitsluitend zakelijk gebruik bestelauto). De ontvangst van die verklaring wordt door de inspecteur bevestigd.
      Indien een verklaring als bedoeld in de eerste volzin is afgegeven, laat de inhoudingsplichtige inhouding van
      belasting over het in het eerste lid bedoelde voordeel achterwege. De vorige volzin is niet van toepassing ingeval
      de inhoudingsplichtige weet dat de in die volzin genoemde verklaring niet juist is.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel3
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13bis
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '3'
  - number: 13bis.14
    text: |-
      De werknemer kan de verklaring uitsluitend zakelijk gebruik bestelauto intrekken. De mededeling van de intrekking
      wordt door de inspecteur bevestigd.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13bis
  - number: 13bis.15
    text: |-
      In geval van een verklaring uitsluitend zakelijk gebruik bestelauto kan de inspecteur bij het
      vermoeden van een rit voor privédoeleinden, de inhoudingsplichtige en de werknemer verzoeken te
      doen blijken dat de betreffende rit zakelijk was. Slagen inhoudingsplichtige en de werknemer niet
      in dit bewijs, dan wordt de bestelauto geacht op kalenderjaarbasis voor meer dan 500 kilometer voor
      privédoeleinden te worden gebruikt en wordt de verschuldigde belasting, voor zover nodig in afwijking van
      [artikel 20, tweede lid, van de Algemene wet inzake rijksbelastingen][ref1], nageheven van de werknemer. In
      afwijking van de tweede volzin wordt nageheven van de inhoudingsplichtige ingeval hij wist dat de verklaring niet
      juist was of ingeval hij niet aanstonds heeft medegedeeld dat de werknemer ten onrechte de verklaring nog niet
      heeft ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel20
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13bis
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '20'
  - number: 13bis.16
    text: |-
      Indien de werknemer de verklaring uitsluitend zakelijk gebruik bestelauto heeft ingetrokken voordat hij de
      bestelauto ook voor privédoeleinden heeft gebruikt, wordt de bestelauto tot het moment van de intrekking geacht wel
      voor privédoeleinden ter beschikking te zijn gesteld, maar niet voor privédoeleinden te zijn gebruikt.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13bis
  - number: 13bis.17
    text: 'Bij algemene maatregel van bestuur wordt bepaald:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13bis
  - number: 13bis.17.a
    text: op welke wijze de verklaring uitsluitend zakelijk gebruik bestelauto wordt afgegeven en ingetrokken;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13bis
  - number: 13bis.17.b
    text: in welke gevallen de werknemer de verklaring in ieder geval moet intrekken;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13bis
  - number: 13bis.17.c
    text: |-
      in welke gevallen de inhoudingsplichtige de inspecteur schriftelijk moet mededelen dat de werknemer de verklaring
      ten onrechte niet heeft ingetrokken en welke gegevens de inhoudingsplichtige bij deze mededeling moet verstrekken;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13bis
  - number: 13bis.17.d
    text: |-
      op welke wijze de inspecteur naar aanleiding van een mededeling als bedoeld in onderdeel c bekendmaakt dat de
      verklaring uitsluitend zakelijk gebruik bestelauto geacht wordt te zijn ingetrokken;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13bis
  - number: 13bis.17.e
    text: vanaf welk moment de verklaring bij toepassing van onderdeel d geacht wordt te zijn ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13bis
  - number: 13bis.18
    text: |-
      Na de eerste wijziging van de CO-uitstootgrens of het percentage in het tweede lid na de datum van eerste toelating
      van de auto, is voor een periode van 60 maanden te rekenen vanaf de eerste dag van de maand volgend op de datum van
      eerste toelating, de verlaging, bedoeld in het tweede lid, van toepassing overeenkomstig de bepalingen die gelden
      direct voorafgaand aan die wijziging.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13bis
  - number: 13bis.19
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot een auto waarvan de datum van
      de eerste tenaamstelling in het kentekenregister niet overeenkomt met de datum van eerste toelating op de weg van
      die auto.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13bis
  - number: 13ter.1
    text: |-
      Indien ook voor privédoeleinden een fiets ter beschikking is gesteld, wordt het voordeel op kalenderjaarbasis
      gesteld op 7% van de waarde van de fiets. De fiets wordt in ieder geval geacht ook voor privédoeleinden ter
      beschikking te zijn gesteld indien de fiets ook voor woon-werkverkeer ter beschikking is gesteld.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13ter
  - number: 13ter.2
    text: |-
      Het voordeel wordt in aanmerking genomen voor zover het uitgaat boven de vergoeding die de werknemer voor het
      gebruik voor privédoeleinden is verschuldigd.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13ter
  - number: 13ter.3
    text: |-
      Voor de toepassing van dit artikel wordt onder een fiets mede verstaan een bromfiets als bedoeld in
      [artikel 1, eerste lid, onderdeel e, van de Wegenverkeerswet 1994][ref1], indien deze mede door menselijke
      spierkracht wordt aangedreven en is uitgerust met een elektromotor.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13ter
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '1'
  - number: 13ter.4
    text: |-
      Voor de toepassing van dit artikel wordt onder de waarde van de fiets verstaan de in Nederland door de fabrikant
      of importeur publiekelijk kenbaar gemaakte consumentenadviesprijs van de fiets. Indien voor de fiets geen
      consumentenadviesprijs beschikbaar is, wordt aangesloten bij de consumentenadviesprijs van de meest vergelijkbare
      fiets.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13ter
  - number: 13a.1
    text: 'Loon wordt beschouwd te zijn genoten op het tijdstip waarop het:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13a
  - number: 13a.1.a
    text: betaald of verrekend wordt, ter beschikking van de werknemer wordt gesteld of rentedragend wordt, dan wel
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13a
  - number: 13a.1.b
    text: vorderbaar en tevens inbaar wordt.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13a
  - number: 13a.2
    text: |-
      Indien is overeengekomen dat het loon geheel of gedeeltelijk op een ongebruikelijk tijdstip zal worden genoten,
      wordt daarmee voor de toepassing van het eerste lid geen rekening gehouden.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13a
  - number: 13a.3
    text: |-
      Voor zover ingevolge [artikel 12a][ref1] het loon hoger is dan het werkelijk genoten loon, wordt het meerdere
      geacht te zijn genoten bij het einde van het kalenderjaar of het einde van de dienstbetrekking zo deze in de loop
      van het kalenderjaar eindigt.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel12a
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 12a
        hoofdstuk: II
  - number: 13a.4
    text: 'In afwijking van het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13a
  - number: 13a.4.a
    text: |-
      wordt het bedrag dat als gevolg van de toepassing van
      [artikel 10a, eerste lid, onderdeel a, onder 1°, of twaalfde lid][ref1] tot het loon behoort geacht te zijn
      genoten ten tijde van de uitoefening van het aandelenoptierecht, bedoeld in artikel 10a, eerste lid, onderdeel a,
      onder 1°;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 10a
        hoofdstuk: II
  - number: 13a.4.b
    text: |-
      wordt het bedrag dat als gevolg van de toepassing van [artikel 10a, eerste lid, onderdeel a, onder 2°][ref1], tot
      het loon behoort geacht te zijn genoten ten tijde van het verhandelbaar worden van de aandelen, bedoeld in artikel
      10a, eerste lid, onderdeel a, onder 2°;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 10a
        hoofdstuk: II
  - number: 13a.4.c
    text: |-
      wordt het bedrag dat als gevolg van de toepassing van [artikel 10a, elfde lid][ref1], tot het loon behoort geacht
      te zijn genoten ten tijde van de vervreemding van de aandelen, bedoeld in artikel 10a, elfde lid;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 10a
        hoofdstuk: II
  - number: 13a.4.d
    text: |-
      wordt loon dat ingevolge [artikel 27bis][ref1] is begrepen in de laatste aangifte van het kalenderjaar, geacht te
      zijn genoten bij het einde van het kalenderjaar of het einde van de dienstbetrekking zo deze in de loop van het
      kalenderjaar eindigt;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel27bis
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 27bis
        hoofdstuk: IV
  - number: 13a.4.e
    text: |-
      worden vergoedingen ter zake van vervoer in het kader van de dienstbetrekking, waaronder woon-werkverkeer, op
      andere wijze dan per taxi, luchtvaartuig, schip of vervoer vanwege de inhoudingsplichtige, voor zover deze € 0,21
      per kilometer te boven gaan en voor zover deze niet hoger zijn dan de werkelijke kosten, geacht te zijn genoten
      bij het einde van het kalenderjaar of bij het einde van de dienstbetrekking zo deze in de loop van het kalenderjaar
      eindigt, indien in het kalenderjaar ook vergoedingen ter zake van de hiervoor bedoelde wijze van vervoer zijn of
      naar verwachting zullen worden berekend naar een bedrag van minder dan € 0,21 per kilometer.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13a
  - number: 13a.5
    text: |-
      Het vierde lid, onderdeel e, is niet van toepassing op vergoedingen ter zake van vervoer in het kader van de
      dienstbetrekking, waaronder woon-werkverkeer, per openbaar vervoer indien deze vergoedingen zijn vastgesteld op
      basis van de werkelijke kosten.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13a
  - number: 13a.6
    text: 'Voor de toepassing van het vierde lid, onderdeel e, wordt onder vervoer vanwege de inhoudingsplichtige verstaan:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13a
  - number: 13a.6.1°
    text: vanwege de inhoudingsplichtige georganiseerd vervoer;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13a
  - number: 13a.6.2°
    text: |-
      het reizen per openbaar vervoer op basis van door de inhoudingsplichtige aangeschafte en door hem aan de werknemer
      verstrekte plaatsbewijzen.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13a
  - number: 13a.7
    text: |-
      In afwijking van het eerste lid wordt loon dat door de inhoudingsplichtige overeenkomstig een door hem bestendig
      gevolgde gedragslijn aan een eerder in het kalenderjaar gelegen tijdvak wordt toegerekend dan het tijdvak waarin
      het ingevolge het eerste lid wordt genoten, geacht in dat eerdere tijdvak te zijn genoten.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel13a
  - number: '18.1'
    text: 'Onder pensioenregeling wordt verstaan een regeling:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18
  - number: 18.1.a
    text: |-
      die uitsluitend of, met het oog op uitzonderlijke gevallen van restbegunstiging, nagenoeg uitsluitend ten doel
      heeft het treffen van:
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18
  - number: 18.1.a.1°
    text: een levenslange inkomensvoorziening bij ouderdom voor werknemers en gewezen werknemers (ouderdomspensioen);
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18
  - number: 18.1.a.2°
    text: |-
      een inkomensvoorziening na hun overlijden ten behoeve van hun echtgenoten en gewezen echtgenoten, dan wel van
      degenen met wie zij duurzaam een gezamenlijke huishouding voeren of hebben gevoerd en met wie geen bloed- of
      aanverwantschap in de eerste graad bestaat (partnerpensioen);
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18
  - number: 18.1.a.3°
    text: |-
      een inkomensvoorziening na hun overlijden ten behoeve van hun kinderen en pleegkinderen die de leeftijd van 30 jaar
      nog niet hebben bereikt (wezenpensioen);
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18
  - number: 18.1.a.4°
    text: |-
      een inkomensvoorziening bij arbeidsongeschiktheid zodra die langer dan een jaar duurt en welke niet uitgaat boven
      hetgeen naar maatschappelijke opvattingen redelijk moet worden geacht (arbeidsongeschiktheidspensioen), en
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18
  - number: 18.1.b
    text: |-
      waarin is bepaald dat de aanspraken ingevolge de regeling niet kunnen worden afgekocht, vervreemd of prijsgegeven,
      dan wel formeel of feitelijk voorwerp van zekerheid kunnen worden, anders dan in de gevallen voorzien bij of
      krachtens de [Pensioenwet][ref1] of de [Wet verplichte beroepspensioenregeling][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020809
      [ref2]: https://wetten.overheid.nl/BWBR0018831
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020809
      - id: ref2
        bwb_id: BWBR0018831
  - number: 18.1.c
    text: |-
      waarvan als verzekeraar optreedt een lichaam als bedoeld in [artikel 19a, eerste lid][ref1]; een en ander voor
      zover die regeling blijft binnen de in of krachtens dit hoofdstuk vastgestelde begrenzingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19a
        hoofdstuk: IIB
  - number: '18.2'
    text: 'Onder pensioenregeling wordt mede verstaan een regeling die:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18
  - number: 18.2.a
    text: het ouderdomspensioen na het bereiken van 415/ deelnemingsjaren aanvult (deelnemingsjarenpensioen);
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18
  - number: 18.2.b
    text: |-
      het partnerpensioen dan wel het wezenpensioen aanvult in verband met het ontbreken van uitkeringen
      ingevolge de [Algemene nabestaandenwet][ref1] en het verschil in verschuldigde premie voor de
      volksverzekeringen over het pensioen voor en na de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref2] (nabestaandenoverbruggingspensioen).


      [ref1]: https://wetten.overheid.nl/BWBR0007795
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0007795
      - id: ref2
        bwb_id: BWBR0002221
        artikel: 7a
  - number: '18.3'
    text: |-
      Ingeval een regeling voldoet aan de in het eerste lid opgenomen voorwaarden doch niet blijft binnen de in
      of krachtens dit hoofdstuk opgenomen begrenzingen, is de regeling een pensioenregeling voorzover blijkt dat
      zij blijft binnen de in of krachtens dit hoofdstuk opgenomen begrenzingen. De inhoudingsplichtige verzoekt
      de inspecteur uiterlijk op het eerste moment van overschrijding van de bedoelde begrenzingen vast te stellen
      welk deel van de desbetreffende aanspraak blijft binnen die begrenzingen. Bij toepassing van de eerste volzin
      geeft de inhoudingsplichtige bij elke te zijner tijd op basis van de regeling te verstrekken pensioenuitkering
      overeenkomstig bij ministeriële regeling te stellen regels aan welk deel daarvan tot het loon van de werknemer
      behoort. De inspecteur beslist op het verzoek bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18
  - number: '18.4'
    text: |-
      Voor de toepassing van het derde lid blijft een nettopensioenregeling als bedoeld in
      [afdeling 5.3B van de Wet inkomstenbelasting 2001][ref1] buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Afdeling5.3B
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0011353
        afdeling: 5.3B
  - number: 18a.1
    text: |-
      Een op een eindloonstelsel gebaseerd ouderdomspensioen bedraagt per dienstjaar niet meer dan 1,657 percent van het
      pensioengevend loon.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18a
  - number: 18a.2
    text: |-
      Een op een middelloonstelsel gebaseerd ouderdomspensioen bedraagt per dienstjaar niet meer dan 1,875 percent van
      het pensioengevend loon.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18a
  - number: 18a.3
    text: |-
      Een op een beschikbare-premiestelsel gebaseerd ouderdomspensioen wordt tijdsevenredig opgebouwd en is gericht op
      een pensioen dat na 40 jaren opbouw niet meer bedraagt dan 75 percent van het gemiddelde pensioengevend loon tot
      dat tijdstip. De beschikbare premie wordt ten hoogste bepaald met inachtneming van de volgende uitgangspunten:
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18a
  - number: 18a.3.a
    text: |-
      de beschikbare premie wordt actuarieel vastgesteld per leeftijdsklasse van ten hoogste vijf jaren en wordt
      afgestemd op de gemiddelde leeftijd in de klasse;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18a
  - number: 18a.3.b
    text: |-
      als loopbaanontwikkeling wordt gerekend met een loonstijging van drie percent per jaar gedurende de jaren voor
      het bereiken van de 35-jarige leeftijd, van twee percent per jaar gedurende de tien daaropvolgende jaren, van een
      percent per jaar gedurende de tien daaropvolgende jaren en van nihil gedurende de overige jaren;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18a
  - number: 18a.3.c
    text: |-
      bij de berekening wordt een rekenrente in aanmerking genomen van ten minste vier percent en wordt de te verwachten
      inflatie op nihil gesteld.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18a
  - number: 18a.4
    text: |-
      Een ouderdomspensioen gaat niet later in dan op het tijdstip waarop de werknemer of de gewezen
      werknemer de leeftijd bereikt die vijf jaar hoger is dan de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 18a.5
    text: |-
      Ingeval het ouderdomspensioen later ingaat dan op de in de pensioenregeling vastgestelde ingangsdatum mag het
      pensioen na die ingangsdatum worden verhoogd overeenkomstig het tot die datum gevolgde stelsel, met inbegrip van
      herrekening met inachtneming van algemeen aanvaarde actuariële grondslagen.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18a
  - number: 18a.6
    text: |-
      Indien het ouderdomspensioen eerder ingaat dan op de eerste dag van de maand waarin de 68-jarige leeftijd
      (pensioenrichtleeftijd) wordt bereikt, wordt het herrekend ten opzichte van die datum of van de in de
      pensioenregeling vastgestelde latere ingangsdatum met inachtneming van algemeen aanvaarde actuariële grondslagen.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18a
  - number: 18a.7.a
    text: |-
      De in deze wet met betrekking tot het desbetreffende pensioen opgenomen maxima worden voor het ouderdomspensioen
      opgevat met inbegrip van een bedrag dat ten minste wordt gesteld op per dienstjaar of ontbrekend dienstjaar een
      evenredig gedeelte van de voor dat jaar geldende uitkeringen voor gehuwde personen zonder toeslag als omschreven
      in [artikel 9, eerste lid, onderdeel b, en vijfde lid, van de Algemene Ouderdomswet][ref1], vermeerderd met
      de vakantietoeslag. Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat een lager bedrag
      in aanmerking kan worden genomen dan het in de eerste volzin bedoelde bedrag indien een lager percentage per
      dienstjaar wordt toegepast dan de in het eerste tot en met derde lid bedoelde percentages.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
  - number: 18a.7.b
    text: Voor het partnerpensioen kan het in onderdeel a bedoelde bedrag voor 70% in aanmerking worden genomen.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18a
  - number: 18a.7.c
    text: |-
      Voor het wezenpensioen kan het in onderdeel a bedoelde bedrag voor 14% en voor volle wezen voor 28% in aanmerking
      worden genomen.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18a
  - number: 18a.8
    text: |-
      De in het zesde lid genoemde pensioenrichtleeftijd wordt bij algemene maatregel van bestuur bij het begin van
      het kalenderjaar gewijzigd. De wijziging wordt berekend op basis van de volgende formule: V = 2/3 * (L – 20,64)
      – (P – 67) waarbij: V staat voor het aantal jaren waarmee de pensioenrichtleeftijd wordt verhoogd; L staat voor
      de geraamde macro gemiddelde resterende levensverwachting voor de Nederlandse bevolking in jaren op 65-jarige
      leeftijd in het kalenderjaar dat is gelegen tien jaar na het kalenderjaar van wijziging; P staat voor de geldende
      pensioenrichtleeftijd in het kalenderjaar voorafgaande aan het kalenderjaar van wijziging. Indien V negatief is of
      vóór afronding minder dan 1 bedraagt, wordt deze gesteld op 0. Indien V vóór afronding 1 of meer bedraagt, wordt
      deze gesteld op 1. Een wijziging ingevolge de eerste volzin van de pensioenrichtleeftijd wordt bekendgemaakt ten
      minste een jaar voordat deze toepassing vindt.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18a
  - number: 18a.9
    text: |-
      De ramingen van de macro gemiddelde resterende levensverwachting, bedoeld in het achtste lid, worden uitgevoerd en
      bekendgemaakt door het Centraal Bureau voor de Statistiek.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18a
  - number: 18b.1
    text: |-
      Een op een eindloonstelsel gebaseerd partnerpensioen bedraagt per dienstjaar of ontbrekend dienstjaar niet meer dan
      1,160 percent van het pensioengevend loon of bereikbare pensioengevend loon.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18b
  - number: 18b.2
    text: |-
      Een op een middelloonstelsel gebaseerd partnerpensioen bedraagt per dienstjaar of ontbrekend dienstjaar niet meer
      dan 1,313 percent van het pensioengevend loon of bereikbaar pensioengevend loon.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18b
  - number: 18b.3
    text: |-
      Voor een op een beschikbare-premiestelsel gebaseerd partnerpensioen is [artikel 18a, derde lid][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18a
        hoofdstuk: IIB
  - number: 18b.4
    text: 'Ingeval in de pensioenregeling is rekening gehouden met:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18b
  - number: 18b.4.1°
    text: een bepaalde partner, wordt gerekend met de feitelijke gegevens van die partner;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18b
  - number: 18b.4.2°
    text: |-
      een onbepaalde partner, wordt gerekend met een leeftijdsverschil tussen de werknemer en de partner van ten hoogste
      drie jaren.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18b
  - number: 18b.5
    text: |-
      Voor de toepassing van dit artikel en van [artikel 18c][ref1] worden voor het geval de werknemer niet in leven is
      op het tijdstip waarop het ouderdomspensioen zou ingaan, ontbrekende dienstjaren en bereikbaar pensioengevend loon
      in aanmerking genomen. Onder ontbrekende dienstjaren worden verstaan de jaren van het tijdstip van overlijden van
      de werknemer tot de in de pensioenregeling vastgestelde ingangsdatum. Onder bereikbaar pensioengevend loon wordt
      verstaan het pensioengevend loon dat de gewezen werknemer binnen de vastgestelde loopbaanontwikkeling in zijn
      functie zou hebben kunnen bereiken.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18c
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18c
        hoofdstuk: IIB
  - number: 18b.6
    text: |-
      Een partnerpensioen gaat niet eerder in dan op de eerste dag van de maand waarin de werknemer of gewezen
      werknemer is overleden en gaat niet later in dan op de eerste dag van de maand volgend op de maand waarin de
      werknemer of gewezen werknemer is overleden dan wel, ingeval de partner recht heeft op een uitkering ingevolge de
      [Algemene nabestaandenwet][ref1], niet later dan op de eerste dag van de maand volgend op de maand waarin dat recht
      eindigt.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: 18c.1
    text: |-
      Een op een eindloonstelsel gebaseerd wezenpensioen bedraagt per dienstjaar of ontbrekend dienstjaar niet meer dan
      0,232 percent van het pensioengevend loon of bereikbaar pensioengevend loon.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18c
  - number: 18c.2
    text: |-
      Een op een middelloonstelsel gebaseerd wezenpensioen bedraagt per dienstjaar of ontbrekend dienstjaar niet meer dan
      0,263 percent van het pensioengevend loon of bereikbaar pensioengevend loon.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18c
  - number: 18c.3
    text: |-
      Voor een op een beschikbare-premiestelsel gebaseerd wezenpensioen is [artikel 18a, derde lid][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18a
        hoofdstuk: IIB
  - number: 18c.4
    text: |-
      Een wezenpensioen gaat niet eerder in dan op de eerste dag van de maand waarin de werknemer of gewezen
      werknemer is overleden en gaat niet later in dan op de eerste dag van de maand volgend op de maand waarin de
      werknemer of gewezen werknemer is overleden dan wel, ingeval de wees recht heeft op een uitkering ingevolge de
      [Algemene nabestaandenwet][ref1], niet later dan op de eerste dag van de maand volgend op de maand waarin dat recht
      eindigt.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18c
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: 18c.5
    text: Voor volle wezen worden de in de vorige leden genoemde percentages verdubbeld.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18c
  - number: 18d.1
    text: |-
      In afwijking in zoverre van de [artikelen 18a][ref1], [18b][ref2] en [18c][ref3] kunnen een ouderdomspensioen,
      een partnerpensioen en een wezenpensioen meer bedragen dan de aldaar opgenomen maxima voor zover zulks het gevolg
      is van:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel18b
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel18c
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18d
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18a
        hoofdstuk: IIB
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 18b
        hoofdstuk: IIB
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 18c
        hoofdstuk: IIB
  - number: 18d.1.a
    text: aanpassing van het pensioen aan loon- of prijsontwikkeling;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18d
  - number: 18d.1.b
    text: |-
      variatie in de hoogte van de uitkeringen waarbij de laagste uitkering niet minder bedraagt dan 75 percent van de
      hoogste uitkering en de mate van variatie ten laatste op de ingangsdatum van het pensioen wordt vastgesteld;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18d
  - number: 18d.1.c
    text: waardeoverdracht van pensioenaanspraken;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18d
  - number: 18d.1.d
    text: |-
      gehele of gedeeltelijke onderlinge ruil van partnerpensioen, wezenpensioen en ouderdomspensioen, mits de ruil
      uiterlijk op de ingangsdatum van het pensioen plaatsvindt op basis van algemeen aanvaarde actuariële grondslagen;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18d
  - number: 18d.1.e
    text: |-
      aanpassing van de in de pensioenregeling vastgestelde ingangsdatum van het ouderdomspensioen aan de
      pensioenrichtleeftijd.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18d
  - number: 18d.2
    text: |-
      Een door ruil als bedoeld in het eerste lid, onderdeel d, ontstaan verlies aan pensioen kan niet worden
      gecompenseerd.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18d
  - number: 18d.3
    text: |-
      Voor de toepassing van het eerste lid, onderdeel b, blijft in de jaren tussen de
      ingangsdatum van het pensioen en het bereiken van de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], van de uitkering buiten aanmerking een bedrag dat
      gelijk is aan tweemaal de voor die jaren geldende uitkeringen voor gehuwde personen zonder toeslag als omschreven
      in [artikel 9, eerste lid, onderdeel b, en vijfde lid, van de Algemene Ouderdomswet][ref2], vermeerderd met de
      vakantietoeslag. De eerste volzin is onverminderd van toepassing bij dienstbetrekkingen in deeltijd. Ingeval
      de pensioengerechtigde leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref3], na
      de ingangsdatum van het pensioen wordt verlaagd, wordt voor de toepassing van de eerste zin uitgegaan van de
      pensioengerechtigde leeftijd, bedoeld in artikel 7a, eerste lid, van de Algemene Ouderdomswet, die van toepassing
      was voor deze verlaging.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18d
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 18d.4
    text: |-
      Voor de toepassing van het eerste lid, onderdeel b, blijven aanpassingen van de uitkeringen van een op
      een beschikbare-premiestelsel gebaseerd pensioen buiten aanmerking voor zover deze het gevolg zijn van de
      omstandigheid dat de opgetreden ontwikkeling van de levensverwachting, de behaalde sterfteresultaten of de behaalde
      beleggingsresultaten tot hogere of lagere uitkeringen leiden dan op het tijdstip van ingang van het pensioen het
      uitgangspunt was.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18d
  - number: 18d.5
    text: |-
      In afwijking in zoverre van het eerste lid, onderdeel b, wordt bij een aanpassing van de pensioengerechtigde
      leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], na de ingangsdatum van het
      pensioen, de mate van variatie ten laatste vastgesteld bij het bereiken van de hoogste pensioengerechtigde
      leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref2], die op enig moment na de
      ingangsdatum van het pensioen geldt of heeft gegolden voor de werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18d
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
      - id: ref2
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 18d.6
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18d
  - number: 18e.1
    text: 'Een deelnemingsjarenpensioen is een levenslang pensioen dat:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18e
  - number: 18e.1.a
    text: ingaat op hetzelfde tijdstip als het ouderdomspensioen;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18e
  - number: 18e.1.b
    text: |-
      met inbegrip van het ouderdomspensioen niet meer bedraagt dan 75% van het gemiddelde pensioengevend loon tot dat
      tijdstip ingeval het ouderdomspensioen ingaat op de eerste dag van de maand waarin de 645/-jarige leeftijd wordt
      bereikt;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18e
  - number: 18e.1.c
    text: niet eerder wordt opgebouwd dan vanaf het tijdstip waarop de werknemer 415/ deelnemingsjaren heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18e
  - number: 18e.2
    text: |-
      Ingeval het deelnemingsjarenpensioen later ingaat dan bij het bereiken van de 645/-jarige leeftijd mag het
      deelnemingsjarenpensioen na het bereiken van die leeftijd met inachtneming van algemeen aanvaarde actuariële
      grondslagen worden verhoogd.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18e
  - number: 18e.3
    text: |-
      Indien het deelnemingsjarenpensioen eerder ingaat dan op de eerste dag van de maand waarin de 645/-jarige leeftijd
      wordt bereikt, wordt het herrekend ten opzichte van die datum met inachtneming van algemeen aanvaarde actuariële
      grondslagen.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18e
  - number: 18e.4
    text: |-
      [Artikel 18d][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18d
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18e
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18d
        hoofdstuk: IIB
  - number: 18e.5
    text: |-
      Het in het eerste lid opgenomen maximum wordt voor de periode vanaf het bereiken van de 665/-jarige leeftijd
      opgevat met inbegrip van een bedrag dat ten minste wordt gesteld op de uitkeringen voor gehuwde personen zonder
      toeslag als omschreven in [artikel 9, eerste lid, onderdeel b, en vijfde lid, van de Algemene Ouderdomswet][ref1],
      vermeerderd met de vakantietoeslag.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18e
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
  - number: 18f
    text: 'Een nabestaandenoverbruggingspensioen is een pensioen dat:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18f
  - number: 18f.a
    text: |-
      ingaat in de periode die aanvangt op de eerste dag van de maand waarin de werknemer of gewezen werknemer
      is overleden en die eindigt op de eerste dag van de maand volgend op de maand waarin de werknemer of
      gewezen werknemer is overleden dan wel, ingeval de nabestaande recht heeft op een uitkering ingevolge de
      [Algemene nabestaandenwet][ref1], die eindigt op de eerste dag van de maand volgend op de maand waarin dat recht
      eindigt;


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18f
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: 18f.b
    text: |-
      uiterlijk eindigt bij het bereiken van de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18f
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 18f.c
    text: |-
      toekomt aan degene voor wie een regeling voor partnerpensioen of wezenpensioen is getroffen of had kunnen worden
      getroffen;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18f
  - number: 18f.d
    text: 'niet meer bedraagt dan:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18f
  - number: 18f.d.1°
    text: |-
      voor de partner of gewezen partner: het gezamenlijke bedrag van 8/7 maal de nominale uitkering ingevolge
      [artikel 17, eerste lid, van de Algemene nabestaandenwet][ref1], vermeerderd met de vakantie-uitkering,
      en het verschil in verschuldigde premie voor de volksverzekering over het partnerpensioen voor en na de
      pensioengerechtigde leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18f
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 18f.d.2°
    text: |-
      voor volle wezen: 8/7 maal de nominale uitkering voor een kind van 16 jaar of ouder ingevolge
      [artikel 29, tweede lid, onderdeel c, van de Algemene nabestaandenwet][ref1], vermeerderd met de vakantie-
      uitkering;


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel29
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18f
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '29'
  - number: 18f.d.3°
    text: 'voor halfwezen: 50 percent van het voor volle wezen geldende maximum, bedoeld in onderdeel 2°.'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18f
  - number: 18g.1
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de perioden die in aanmerking
      komen als dienstjaren dan wel deelnemingsjaren, bedoeld in de [artikelen 18a][ref1], [18b][ref2], [18c][ref3] en
      [18e][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel18b
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel18c
      [ref4]: https://wetten.overheid.nl/BWBR0002471#Artikel18e
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18g
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18a
        hoofdstuk: IIB
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 18b
        hoofdstuk: IIB
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 18c
        hoofdstuk: IIB
      - id: ref4
        bwb_id: BWBR0002471
        artikel: 18e
        hoofdstuk: IIB
  - number: 18g.2
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het pensioengevend loon, bedoeld
      in de [artikelen 18a][ref1], [18b][ref2], [18c][ref3], [18d][ref4] en [18e][ref5], ter zake van:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel18b
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel18c
      [ref4]: https://wetten.overheid.nl/BWBR0002471#Artikel18d
      [ref5]: https://wetten.overheid.nl/BWBR0002471#Artikel18e
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18g
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18a
        hoofdstuk: IIB
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 18b
        hoofdstuk: IIB
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 18c
        hoofdstuk: IIB
      - id: ref4
        bwb_id: BWBR0002471
        artikel: 18d
        hoofdstuk: IIB
      - id: ref5
        bwb_id: BWBR0002471
        artikel: 18e
        hoofdstuk: IIB
  - number: 18g.2.a
    text: de loonbestanddelen die daarin worden opgenomen;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18g
  - number: 18g.2.b
    text: |-
      de loonbestanddelen waarover de opbouw van het pensioen volgens een ander stelsel dan het eindloonstelsel dient
      plaats te vinden;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18g
  - number: 18g.2.c
    text: de bepaling van het gemiddelde pensioengevend loon;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18g
  - number: 18g.2.d
    text: |-
      de situatie waarin de werknemer aan het eind van zijn loopbaan terugtreedt naar een lager gekwalificeerde functie
      met een lager loon dan in zijn daaraan voorafgaande functie;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18g
  - number: 18g.2.e
    text: de situatie waarin het loon wordt verlaagd in verband met ziekte of arbeidsongeschiktheid van de werknemer.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18g
  - number: 18ga.1
    text: |-
      Als pensioengevend loon als bedoeld in de [artikelen 18a][ref1], [18b][ref2], [18c][ref3], [18d][ref4] en
      [18e][ref5] wordt ten hoogste een bedrag van € 128.810 in aanmerking genomen. Bij dienstbetrekkingen in deeltijd
      wordt dit bedrag verminderd overeenkomstig de deeltijdfactor.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel18b
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel18c
      [ref4]: https://wetten.overheid.nl/BWBR0002471#Artikel18d
      [ref5]: https://wetten.overheid.nl/BWBR0002471#Artikel18e
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18ga
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18a
        hoofdstuk: IIB
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 18b
        hoofdstuk: IIB
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 18c
        hoofdstuk: IIB
      - id: ref4
        bwb_id: BWBR0002471
        artikel: 18d
        hoofdstuk: IIB
      - id: ref5
        bwb_id: BWBR0002471
        artikel: 18e
        hoofdstuk: IIB
  - number: 18ga.2
    text: |-
      Het in het eerste lid vermelde bedrag wordt bij het begin van het kalenderjaar bij ministeriële regeling
      vervangen door een ander bedrag. Dit bedrag wordt berekend door het te vervangen bedrag te vermenigvuldigen met de
      contractloonontwikkelingsfactor, bedoeld in [artikel 10.2b, tweede lid, van de Wet inkomstenbelasting 2001][ref1],
      en vervolgens de nodig geachte afronding aan te brengen. Indien in het voorafgaande jaar een dergelijke afronding
      is toegepast, kan bij vervanging worden uitgegaan van het niet-afgeronde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel10
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel18ga
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '10'
  - number: '19'
    text: |-
      Met betrekking tot diensttijd waarin het loon nihil is of anderszins aanzienlijk lager is dan hetgeen gebruikelijk
      is, kunnen geen onderscheidenlijk in zoverre geen aanspraken op een pensioenregeling ontstaan als bedoeld in
      [artikel 11, eerste lid, onderdeel c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '11'
        hoofdstuk: II
  - number: 19a.1
    text: |-
      Als verzekeraar van een pensioen als bedoeld in [artikel 18][ref1] kan optreden:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '18'
        hoofdstuk: IIB
  - number: 19a.1.a
    text: |-
      een lichaam dat ingevolge [artikel 5, eerste lid, onderdeel b, van de Wet op de vennootschapsbelasting 1969][ref1]
      is vrijgesteld van die belasting of dat een algemeen pensioenfonds als bedoeld in
      [artikel 1 van de Pensioenwet][ref2] is;


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel1
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '1'
  - number: 19a.1.b
    text: |-
      een verzekeraar als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1], mits deze
      de pensioenverplichting voor de heffing van de vennootschapsbelasting rekent tot het binnenlandse
      ondernemingsvermogen;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 19a.1.c
    text: |-
      een niet in Nederland gevestigd pensioenfonds of lichaam dat het levensverzekeringsbedrijf uitoefent, mits het
      pensioen de voortzetting is van een pensioen dat reeds was verzekerd bij die verzekeraar in een periode waarin de
      werknemer of gewezen werknemer niet in Nederland woonde of niet in Nederland een dienstbetrekking vervulde;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel19a
  - number: 19a.1.d
    text: |-
      een pensioenfonds of lichaam dat bevoegd het verzekeringsbedrijf uitoefent, anders dan bedoeld in de onderdelen
      a, b en c, dat door Onze Minister, onder door hem te stellen voorwaarden, is aangewezen en dat zich tegenover Onze
      Minister heeft verplicht:
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel19a
  - number: 19a.1.d.1°
    text: |-
      te voldoen aan voorwaarden met betrekking tot het verschaffen van inlichtingen over de uitvoering van de regeling,
      en
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel19a
  - number: 19a.1.d.2°
    text: |-
      zekerheid te stellen voor de invordering van de belasting die is verschuldigd door
      toepassing van [artikel 19b][ref1], ofwel [artikel 3.83, eerste of tweede lid][ref2],
      [artikel 3.136, derde, vierde of vijfde lid][ref3], of
      [artikel 7.2, achtste lid, van de Wet inkomstenbelasting 2001][ref4], dan wel de werknemer of gewezen werknemer
      zich heeft verplicht deze zekerheid te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19b
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel7
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19b
        hoofdstuk: IIB
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '7'
  - number: 19a.2
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de in het eerste lid, onderdeel d,
      bedoelde aanwijzing.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel19a
  - number: 19a.3
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen, alsmede voor de
      [Wet inkomstenbelasting 2001][ref1] en de daarop berustende bepalingen, wordt gelijkgesteld met:


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: 19a.3.a
    text: |-
      een verzekeraar als bedoeld in het eerste lid, onderdelen a of b: een premiepensioeninstelling als bedoeld in
      [artikel 1 van de Pensioenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '1'
  - number: 19a.3.b
    text: |-
      een verzekeraar als bedoeld in het eerste lid, onderdeel d: een met een premiepensioeninstelling als bedoeld in
      [artikel 1 van de Pensioenwet][ref1] vergelijkbare instelling die onder overeenkomstige toepassing van het eerste
      lid, onderdeel d, door Onze Minister is aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '1'
  - number: 19a.3.c
    text: |-
      het verzekeren van een aanspraak ingevolge een pensioenregeling: het uitvoeren van een pensioenregeling door een
      premiepensioeninstelling.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel19a
  - number: 19b.1
    text: 'Ingeval op enig tijdstip:'
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel19b
  - number: 19b.1.a
    text: een aanspraak ingevolge een pensioenregeling niet langer als zodanig is aan te merken;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel19b
  - number: 19b.1.b
    text: |-
      een aanspraak ingevolge een pensioenregeling wordt afgekocht of vervreemd dan wel formeel of
      feitelijk voorwerp van zekerheid, anders dan ten behoeve van uitstel van betaling op grond van
      [artikel 25, vijfde lid, van de Invorderingswet 1990][ref1], wordt;


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel19b
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
  - number: 19b.1.c
    text: |-
      de zekerheidstelling wordt beëindigd door de werknemer of de gewezen werknemer die zich op grond van
      [artikel 19a, eerste lid, onderdeel d][ref1], heeft verplicht deze zekerheid te stellen;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel19b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19a
        hoofdstuk: IIB
  - number: 19b.2
    text: |-
      Ingeval een verplichting ingevolge een pensioenregeling geheel of gedeeltelijk overgaat op een andere verzekeraar
      wordt de aanspraak ingevolge die regeling geacht te worden afgekocht. De eerste volzin is niet van toepassing
      ingeval de verplichting ingevolge een pensioenregeling geheel of gedeeltelijk overgaat naar een verzekeraar als
      bedoeld in [artikel 19a, eerste lid, onderdelen a, b of d][ref1], mits deze overgang niet in strijd komt met de
      bepalingen bij of krachtens de [artikelen 70 tot en met 91 van de Pensioenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel70
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel19b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19a
        hoofdstuk: IIB
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '70'
  - number: 19b.3
    text: |-
      Het eerste lid is niet van toepassing ingeval de werknemer of gewezen werknemer in het kader van scheiding van
      tafel en bed, echtscheiding of beëindiging van samenleving een aanspraak ingevolge een pensioenregeling geheel of
      gedeeltelijk vervreemdt aan zijn echtgenoot of gewezen echtgenoot onderscheidenlijk zijn partner of gewezen partner
      dan wel omzet in een zodanige aanspraak met als gerechtigde die echtgenoot of gewezen echtgenoot onderscheidenlijk
      zijn partner of gewezen partner, waarbij die verkregen of omgezette aanspraak voor de toepassing van deze wet wordt
      geacht de voortzetting te zijn van de aanspraak op een pensioenregeling van de werknemer of gewezen werknemer.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel19b
  - number: 19b.4
    text: |-
      Het eerste lid is niet van toepassing voor zover een in onderdeel b van dat lid bedoelde uitkering of afkoopsom
      wordt uitgekeerd met toepassing van [artikel 66][ref1], [67][ref2] of [68 van de Pensioenwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel67
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel68
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel19b
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '66'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '67'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '68'
  - number: 19b.5
    text: |-
      Het eerste lid is niet van toepassing bij een vervreemding als bedoeld in
      [artikel 57, vijfde lid, van de Pensioenwet][ref1] alsmede bij een vermindering als bedoeld in
      [artikel 134, eerste lid, van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel134
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel19b
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '57'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '134'
  - number: 19b.6
    text: |-
      Onze Minister kan, zo nodig onder door hem te stellen voorwaarden, bepalen dat het tweede lid, eerste
      volzin, niet van toepassing is indien de verplichting ingevolge een pensioenregeling overgaat op een niet in
      Nederland gevestigd pensioenfonds of lichaam dat het verzekeringsbedrijf uitoefent , anders dan bedoeld in
      [artikel 19a, eerste lid, onderdeel d][ref1], zulks ter verwerving van aanspraken ingevolge een pensioenregeling
      in het kader van de aanvaarding van een dienstbetrekking buiten Nederland. De eerste volzin is van overeenkomstige
      toepassing met betrekking tot de overgang van de verplichting ingevolge een pensioenregeling naar een pensioenfonds
      van een internationale organisatie in het kader van de aanvaarding van een dienstbetrekking bij die organisatie
      in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel19b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19a
        hoofdstuk: IIB
  - number: 19b.7
    text: |-
      Voor de toepassing van het eerste lid, onderdeel a, wordt een aanspraak op een pensioenregeling mede niet langer
      als zodanig aangemerkt ingeval op enig tijdstip niet langer wordt voldaan aan de voorwaarden gesteld ingevolge het
      zesde lid of [artikel 19d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19d
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel19b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19d
        hoofdstuk: IIB
  - number: 19c.1
    text: |-
      Op verzoek van de inhoudingsplichtige beslist de inspecteur bij voor bezwaar vatbare beschikking of een regeling
      een pensioenregeling is in de zin van de [artikelen 18 tot en met 18ga][ref1]. Het verzoek wordt gedaan voordat de
      regeling dan wel een wijziging van de regeling wordt ingevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel19c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '18'
        hoofdstuk: IIB
  - number: 19c.2
    text: |-
      Indien een zodanig verzoek is gedaan en vervolgens onherroepelijk komt vast te staan dat de regeling niet een
      zodanige pensioenregeling is en de regeling – onverwijld en ingaand op het tijdstip van ingang van de regeling –
      wordt aangepast in dier voege dat de regeling wel een zodanige pensioenregeling is, wordt de regeling geacht met
      terugwerkende kracht tot uiterlijk dat tijdstip een zodanige pensioenregeling te zijn.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel19c
  - number: 19d
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid, afwijkingen toestaan
      van het overigens in of krachtens dit hoofdstuk bepaalde door regelingen of groepen van regelingen aan te wijzen
      als pensioenregeling indien het een regeling betreft:
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel19d
  - number: 19d.a
    text: |-
      die op bepaalde onderdelen niet meer dan in geringe mate afwijkt van het overigens in of krachtens dit hoofdstuk
      bepaalde, mits het belang van de afwijkingen niet uitgaat boven het belang van de marges op andere onderdelen;
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel19d
  - number: 19d.b
    text: |-
      voor gemoedsbezwaarden met een ontheffing als bedoeld in
      [artikel 64 van de Wet financiering sociale verzekeringen][ref1], die dient ter vervanging van een
      pensioenregeling;


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel64
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel19d
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '64'
  - number: 19d.c
    text: |-
      voor een tijdelijk in Nederland wonende of werkzame werknemer en die regeling voldoet aan
      [artikel 1.7, tweede lid, onderdeel c, van de Wet inkomstenbelasting 2001][ref1], mits de opbouw van het pensioen
      ingevolge die regeling tijdelijk in Nederland wordt voortgezet en het pensioen reeds was verzekerd bij een
      pensioenfonds of lichaam als bedoeld in [artikel 19a, eerste lid, onderdelen c of d][ref2], in een periode waarin
      de werknemer niet in Nederland woonde of niet in Nederland een dienstbetrekking vervulde.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel19d
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 19a
        hoofdstuk: IIB
  - number: 19f
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld ter bevordering van een goede uitvoering van dit hoofdstuk
      alsmede met betrekking tot samenloop van verschillende pensioenstelsels.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel19f
  - number: '20.1'
    text: |-
      De over een loontijdvak van een jaar verschuldigde belasting is het bedrag van de over het kalenderjaar berekende
      belasting op het belastbare loon verminderd met het bedrag van de heffingskorting voor de loonbelasting.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel20
  - number: '20.2'
    text: |-
      Het bedrag van de heffingskorting voor de loonbelasting bedraagt maximaal het bedrag van de verschuldigde belasting
      over het loontijdvak van een jaar.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel20
  - number: '20.3'
    text: |-
      Voor werknemers die in een andere lidstaat van de Europese Unie, in een andere staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte, in Zwitserland of op de BES eilanden wonen, wordt voor de
      toepassing van het eerste en tweede lid alleen het deel van de heffingskorting voor de loonbelasting dat betrekking
      heeft op de arbeidskorting in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel20
  - number: '20.4'
    text: |-
      Voor werknemers die niet in Nederland wonen en geen werknemer als bedoeld in het derde lid zijn, is, in afwijking
      van het eerste lid, de over een loontijdvak van een jaar verschuldigde belasting het bedrag van de over het
      kalenderjaar berekende belasting op het belastbare loon.
    url: https://wetten.overheid.nl/BWBR0002471/2023-01-01#Artikel20
  - number: 20a.1
    text: |-
      De belasting over een loontijdvak van een jaar wordt bepaald aan de hand van de navolgende tabel (tarieftabel).








                    Bij een belastbaar loon van meer dan


                    maar niet meer dan


                    bedraagt de belasting het in kolom III vermelde bedrag, vermeerderd met het bedrag dat wordt berekend
      door het in kolom IV vermelde percentage te nemen van het gedeelte van het belastbare loon dat het in kolom I
      vermelde bedrag te boven gaat




                    I


                    II


                    III


                    IV






                    –


