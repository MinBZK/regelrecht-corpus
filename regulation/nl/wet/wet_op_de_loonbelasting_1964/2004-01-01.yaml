$id: wet_op_de_loonbelasting_1964
regulatory_layer: WET
publication_date: '2025-12-23'
valid_from: '2004-01-01'
bwb_id: BWBR0002471
url: https://wetten.overheid.nl/BWBR0002471/2004-01-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is het Besluit op de Loonbelasting 1940 door een meer
    overzichtelijke en op verschillende punten herziene wettelijke regeling te vervangen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Onder de naam 'loonbelasting' wordt van werknemers of hun inhoudingsplichtige, van artiesten, van beroepssporters,
      van buitenlandse gezelschappen en van bij of krachtens deze wet aan te wijzen andere natuurlijke personen een
      directe belasting geheven.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel1
  - number: '2.1'
    text: |-
      Werknemer is de natuurlijke persoon die tot een inhoudingsplichtige in privaatrechtelijke of in publiekrechtelijke
      dienstbetrekking staat of van een inhoudingsplichtige loon geniet uit een vroegere privaatrechtelijke of
      publiekrechtelijke dienstbetrekking van hemzelf of van een ander, dan wel uit een bestaande privaatrechtelijke of
      publiekrechtelijke dienstbetrekking van een ander.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel2
  - number: '2.2'
    text: |-
      Degene die van een Nederlandse publiekrechtelijke rechtspersoon loon geniet uit een dienstbetrekking tot
      een niet-inhoudingsplichtige dan wel loon in de vorm van premies voor werkaanvaarding ten behoeve van
      uitkeringsgerechtigden, wordt geacht tot die rechtspersoon in dienstbetrekking te staan.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel2
  - number: '2.3'
    text: |-
      Tenzij werkzaamheden zijn of worden verricht in een functie van bestuurder of commissaris van een in Nederland
      gevestigd lichaam, aan boord van schepen of luchtvaartuigen in het internationale verkeer van een onderneming
      waarvan de leiding in Nederland is gevestigd, dan wel in dienstbetrekking bij de Staat der Nederlanden of in
      het kader van een uitzending op grond van een verdrag waarbij de Staat der Nederlanden partij is, is het eerste
      lid niet van toepassing op personen die niet in Nederland wonen, met betrekking tot een geheel buiten Nederland
      vervulde dienstbetrekking.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel2
  - number: '2.4'
    text: |-
      Het eerste lid is eveneens niet van toepassing op personen die niet in Nederland wonen, met betrekking tot
      een gedeeltelijk buiten Nederland vervulde dienstbetrekking, anders dan de dienstbetrekkingen die in het derde
      lid zijn genoemd, voorzover het loon uit die dienstbetrekking met inachtneming van verdragen waarbij de Staat
      der Nederlanden partij is, feitelijk is onderworpen aan een belasting naar het inkomen die door of vanwege de
      Nederlandse Antillen, Aruba of een andere mogendheid wordt geheven.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel2
  - number: '2.5'
    text: Krachtens wettelijk vruchtgenot aan een kind ontleend loon wordt geacht door het kind te zijn genoten.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel2
  - number: '2.6'
    text: |-
      Loon in de vorm van periodieke uitkeringen welke van publiekrechtelijke aard zijn, kan in het kalenderjaar
      waarin de verstrekking van die uitkeringen aanvangt dan wel eindigt volgens bij ministeriële regeling te
      stellen regels worden geacht niet te zijn genoten door de werknemer doch door zijn partner in de zin van
      [artikel 1.2 van de Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel1
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '1'
  - number: '3.1'
    text: 'Als dienstbetrekking wordt beschouwd de arbeidsverhouding van:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel3
  - number: 3.1.a
    text: |-
      degene, die, anders dan in de uitoefening van een bedrijf of in de zelfstandige uitoefening van een
      beroep, en anders dan als thuiswerker, ingevolge een overeenkomst tot aanneming van werk als bedoeld in
      [artikel 750 van Boek 7 van het Burgerlijk Wetboek][ref1], persoonlijk een werk tot stand brengt;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel750
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '750'
  - number: 3.1.b
    text: degene, die de in onderdeel a bedoelde persoon bij het tot stand brengen van dat werk bijstaat;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel3
  - number: 3.1.c
    text: |-
      degene, die krachtens overeenkomst met een ander tegen beloning geregeld zijn bemiddeling verleent tot het tot
      stand komen van overeenkomsten tussen daartoe door hem te bezoeken personen en die ander, mits hij de bedoelde
      bemiddeling uitsluitend voor die ander verleent, het verlenen van die bemiddeling niet een voor hem bijkomstige
      werkzaamheid is en hij zich daarbij doorgaans niet door meer dan twee andere personen laat bijstaan;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel3
  - number: 3.1.d
    text: |-
      degene, die krachtens overeenkomst met een ander tegen beloning geregeld zijn bemiddeling verleent tot het tot
      stand komen van overeenkomsten tussen daartoe door hem te bezoeken personen en een opdrachtgever van die ander,
      mits hij de bedoelde bemiddeling uitsluitend voor die ander verleent, het verlenen van die bemiddeling niet een
      voor hem bijkomstige werkzaamheid is en hij zich daarbij doorgaans niet door meer dan twee andere personen laat
      bijstaan;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel3
  - number: 3.1.e
    text: |-
      degene, die werkzaam is om vakbekwaamheid te verwerven, onder wie mede wordt begrepen degene, die als leerling van
      een instelling van onderwijs praktisch werkzaam is, alsmede degene, die aan een bedrijfsschool opleiding ontvangt,
      een en ander indien een beloning wordt genoten, die niet uitsluitend bestaat in het ontvangen van onderricht;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel3
  - number: 3.1.f
    text: |-
      het kind van 15 jaar of ouder dat werkzaam is in de onderneming van zijn ouder, tenzij die onderneming
      deel uitmaakt van een samenwerkingsverband met het kind en het kind daaruit als ondernemer als bedoeld in
      [artikel 3.4 van de Wet inkomstenbelasting 2001][ref1] winst uit onderneming geniet;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 3.1.g
    text: |-
      de commissaris van een lichaam in de zin van de [Algemene wet inzake rijksbelastingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: 3.1.h
    text: |-
      degene, die in de zin van [artikel 4 van de Ziektewet][ref1] (Stb. 1987, 88) als bestuurder werkzaam is ten behoeve
      van een coöperatie.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel4
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '4'
  - number: '3.2'
    text: |-
      Het eerste lid, onderdelen a en b, vindt geen toepassing indien de in onderdeel a bedoelde overeenkomst
      rechtstreeks is aangegaan met een natuurlijk persoon ten behoeve van diens persoonlijke aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel3
  - number: '4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regelen worden gesteld, ingevolge welke eveneens als
      dienstbetrekking wordt beschouwd de arbeidsverhouding van:
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel4
  - number: 4.a
    text: degene, die als thuiswerker arbeid verricht;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel4
  - number: 4.b
    text: degene, die de onder *a* bedoelde persoon als hulp bij het verrichten van de arbeid bijstaat;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel4
  - number: 4.c
    text: |-
      degene, die een tak van sport op topniveau beoefent en ter zake daarvan een inkomensvoorziening of een
      kostenvergoeding geniet;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel4
  - number: 4.d
    text: |-
      degene, die arbeid verricht ten behoeve van een vennootschap waarin hij een aanmerkelijk belang heeft in de zin van
      de [Wet inkomstenbelasting 2001][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: 4.e
    text: |-
      degene, die tegen beloning persoonlijk arbeid verricht en wiens arbeidsverhouding niet reeds ingevolge de
      voorgaande bepalingen als dienstbetrekking wordt beschouwd, doch hiermede maatschappelijk gelijk kan worden
      gesteld;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel4
  - number: 4.f
    text: |-
      degene die uit een arbeidsverhouding die niet op grond van een andere bepaling als dienstbetrekking wordt beschouwd
      een beloning geniet, mits diegene vooraf aan de inspecteur meldt, door middel van een gezamenlijke verklaring van
      hemzelf en de beoogde inhoudingsplichtige, dat zijn arbeidsverhouding als dienstbetrekking moet worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel4
  - number: '5'
    text: |-
      Als dienstbetrekking wordt niet beschouwd de arbeidsverhouding van degene, die ten behoeve van de natuurlijke
      persoon, tot wie hij in dienstbetrekking staat, uitsluitend of nagenoeg uitsluitend huiselijke of persoonlijke
      diensten in diens huishouden verricht en die diensten doorgaans op minder dan drie dagen per week verricht.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel5
  - number: 5a.1
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt verstaan onder artiest dan wel
      beroepssporter: degene die ingevolge een overeenkomst van korte duur, dan wel kortstondig krachtens een
      andere grond, als musicus of anderszins als artiest optreedt dan wel als beroep een tak van sport beoefent
      (beroepssporter).
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel5a
  - number: 5a.2
    text: |-
      Degene die ingevolge een overeenkomst van korte duur, dan wel kortstondig krachtens een andere grond, als musicus
      of anderszins als artiest optreedt dan wel als beroep een tak van sport beoefent, is geen artiest onderscheidenlijk
      beroepssporter ingeval:
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel5a
  - number: 5a.2.a
    text: 'hij in Nederland woont, en:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel5a
  - number: 5a.2.a.1°
    text: |-
      bij een beschikking als bedoeld in [artikel 3.156 van de Wet inkomstenbelasting 2001](onbekend) is verklaard dat de
      voordelen die hij geniet uit zijn optreden of sportbeoefening, worden aangemerkt als winst uit een onderneming, of
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel5a
  - number: 5a.2.a.2°
    text: |-
      bij een beschikking als bedoeld in [artikel 3.157 van de Wet inkomstenbelasting 2001](onbekend) is verklaard
      dat de werkzaamheden die hij verricht in het kader van zijn optreden of sportbeoefening, worden aangemerkt als
      werkzaamheden uitsluitend verricht voor rekening en risico van de onderneming van een in Nederland gevestigde
      vennootschap waarin hij een aanmerkelijk belang heeft;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel5a
  - number: 5a.2.b
    text: |-
      hij het optreden rechtstreeks is overeengekomen met een natuurlijke persoon ten behoeve van diens persoonlijke
      aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel5a
  - number: 5a.3
    text: |-
      Ingeval een artiest of beroepssporter optreedt of als beroep een tak van sport beoefent in het kader van een
      dienstbetrekking tot een in Nederland gevestigde inhoudingsplichtige, is hij voor de toepassing van deze wet en de
      daarop berustende bepalingen werknemer.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel5a
  - number: 5a.4
    text: |-
      Ingeval een niet in Nederland wonende artiest of beroepssporter optreedt of als beroep een tak van sport beoefent
      in het kader van een dienstbetrekking tot een inhoudingsplichtige die niet in Nederland is gevestigd, vindt de
      heffing van loonbelasting plaats ingevolge de regelingen zoals die gelden voor artiesten en beroepssporters.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel5a
  - number: 5b.1
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt verstaan onder buitenlands gezelschap:
      een groep van hoofdzakelijk niet in Nederland wonende natuurlijke personen of gevestigde rechtspersonen waarbij
      de leden van de groep individueel of gezamenlijk ingevolge een overeenkomst van korte duur, dan wel kortstondig
      krachtens een andere grond, als artiest in Nederland optreden of als beroep een tak van sport in Nederland
      beoefenen.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel5b
  - number: 5b.2
    text: |-
      De rechten die een buitenlands gezelschap heeft en de verplichtingen die daarop rusten, komen toe aan elk lid van
      het gezelschap en rusten op elk lid van het gezelschap. Een lid kan zich doen vertegenwoordigen door een lid dat
      als leider van het gezelschap fungeert.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel5b
  - number: 5b.3
    text: |-
      Ingeval een lid van een buitenlands gezelschap optreedt of als beroep een tak van sport beoefent in het kader
      van een dienstbetrekking tot een inhoudingsplichtige die niet in Nederland is gevestigd, vindt de heffing van
      loonbelasting plaats ingevolge de regelingen zoals die gelden voor het buitenlandse gezelschap.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel5b
  - number: '6.1'
    text: 'Inhoudingsplichtige is:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel6
  - number: 6.1.a
    text: degene, tot wie een of meer personen in dienstbetrekking staan;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel6
  - number: 6.1.b
    text: degene, die aan een of meer personen loon uit een vroegere dienstbetrekking tot hemzelf of tot een ander verstrekt;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel6
  - number: 6.1.c
    text: |-
      degene, die ingevolge een aanspraak die niet tot het loon behoort, aan een of meer personen uitkeringen of
      verstrekkingen uit een dienstbetrekking tot een ander doet.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel6
  - number: '6.2'
    text: 'Wie niet in Nederland woont of gevestigd is, wordt slechts als inhoudingsplichtige beschouwd voor zover hij:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel6
  - number: 6.2.a
    text: |-
      in Nederland een vaste inrichting voor de uitoefening van zijn bedrijf, beroep of andere bezigheid of een in
      Nederland wonende of gevestigde vaste vertegenwoordiger heeft, dan wel
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel6
  - number: 6.2.b
    text: |-
      in Nederland een of meer personen in dienst heeft, in Nederland de loonadministratie houdt en zich als zodanig bij
      de inspecteur heeft gemeld.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel6
  - number: '6.3'
    text: 'Voor de toepassing van het tweede lid, onderdeel *a*, wordt als een vaste inrichting in ieder geval aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel6
  - number: 6.3.a
    text: |-
      het verrichten van werkzaamheden in het kader van een onderneming gedurende een aaneengesloten periode van ten
      minste 30 dagen, indien die werkzaamheden plaatsvinden in, op of boven het Noordzeewinningsgebied, waarbij onder
      Noordzeewinningsgebied wordt verstaan de territoriale zee van Nederland alsmede het buiten de territoriale zee
      onder de Noordzee gelegen deel van de zeebodem en de ondergrond daarvan, voor zover het Koninkrijk der Nederlanden
      daar op grond van het internationale recht ten behoeve van de exploratie en de exploitatie van natuurlijke
      rijkdommen soevereine rechten mag uitoefenen;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel6
  - number: 6.3.b
    text: |-
      het verrichten van werkzaamheden die gericht zijn op het verlenen van tussenkomst ten behoeve van degenen die tegen
      beloning persoonlijke arbeid in Nederland verrichten en een derde ten behoeve van wie die arbeid wordt verricht.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel6
  - number: '6.4'
    text: |-
      Diplomatieke, consulaire en andere vertegenwoordigers van andere Mogendheden en de hun toegevoegde ambtenaren,
      alsmede bij ministeriële regeling aan te wijzen internationale organisaties en vertegenwoordigers en
      functionarissen daarvan, worden niet als inhoudingsplichtigen beschouwd.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel6
  - number: '6.5'
    text: |-
      Ingeval [artikel 19b][ref1] toepassing vindt, is in afwijking van het eerste lid voor de aanspraak die ingevolge
      dat artikel als loon wordt aangemerkt, inhoudingsplichtige degene die als verzekeraar van die aanspraak optreedt.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19b
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19b
        hoofdstuk: IIB
  - number: '7'
    text: 'Als degene, tot wie de dienstbetrekking bestaat, wordt beschouwd:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel7
  - number: 7.1°
    text: |-
      in de gevallen, bedoeld in [artikel 3, eerste lid, onder][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel3
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '3'
        hoofdstuk: I
  - number: 7.1°.a
    text: en b. de aanbesteder;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel7
  - number: 7.1°.c
    text: en d. degene, met wie de overeenkomst tot bemiddeling is gesloten;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel7
  - number: 7.1°.e
    text: degene, bij wie de werkzaamheden worden verricht of de opleiding wordt genoten;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel7
  - number: 7.1°.f
    text: de ouder;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel7
  - number: 7.1°.g
    text: het lichaam;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel7
  - number: 7.1°.h
    text: de coöperatie;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel7
  - number: 7.2°
    text: |-
      in de gevallen, bedoeld in [artikel 4, onder][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel4
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '4'
        hoofdstuk: I
  - number: 7.2°.a
    text: de opdrachtgever;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel7
  - number: 7.2°.b
    text: de thuiswerker;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel7
  - number: 7.2°.c
    text: degene, met wie de inkomensvoorziening of kostenvergoeding is overeengekomen;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel7
  - number: 7.2°.d
    text: de vennootschap;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel7
  - number: 7.2°.e
    text: |-
      en f. degene, die bij de in [artikel 4][ref1] bedoelde algemene maatregel van bestuur als inhoudingsplichtige is
      aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel4
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '4'
        hoofdstuk: I
  - number: '8.1'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat werknemers, wier lonen worden uitbetaald door een door Onze
      Minister van Sociale Zaken en Werkgelegenheid ten behoeve van de uitvoering van sociale-verzekeringswetten erkend
      administratiekantoor, voor de toepassing van deze wet geacht worden in dienstbetrekking te staan tot dat kantoor.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel8
  - number: '8.2'
    text: |-
      Bij ministeriële regeling kan, in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid, een ander
      dan de persoon bedoeld in [artikel 6][ref1] of [artikel 7][ref2] worden aangewezen als inhoudingsplichtige met
      betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel7
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '6'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '7'
        hoofdstuk: I
  - number: 8.2.a
    text: |-
      degene, die krachtens overeenkomst met een ander tegen beloning geregeld zijn bemiddeling verleent tot het tot
      stand komen van overeenkomsten tussen daartoe door hem te bezoeken personen en een opdrachtgever van die ander;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel8
  - number: 8.2.b
    text: degene, die een thuiswerker als hulp bij het verrichten van de arbeid bijstaat;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel8
  - number: 8.2.c
    text: degene, die als beroep een tak van sport beoefent.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel8
  - number: 8a.1
    text: |-
      Ten aanzien van een artiest, beroepssporter of buitenlands gezelschap is inhoudingsplichtige, indien het optreden
      of de sportbeoefening is gebaseerd op een overeenkomst van korte duur:
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel8a
  - number: 8a.1.a
    text: |-
      voorzover de gage wordt ontvangen van degene met wie het optreden of de sportbeoefening is overeengekomen: degene
      met wie het optreden of de sportbeoefening is overeengekomen;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel8a
  - number: 8a.1.b
    text: 'voorzover de gage wordt ontvangen van een derde: deze derde.'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel8a
  - number: 8a.2
    text: |-
      Indien het optreden of de sportbeoefening is gebaseerd op een andere grond, geschiedt de heffing op de voet van
      [artikel 35b, tweede lid][ref1], of [artikel 35i, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel35b
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel35i
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 35b
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 35i
        hoofdstuk: VIIA
  - number: 8a.3
    text: |-
      Wie niet in Nederland woont of gevestigd is, wordt slechts als inhoudingsplichtige beschouwd voorzover hij in
      Nederland een vaste inrichting voor de uitoefening van zijn bedrijf, beroep of andere bezigheid heeft, dan wel een
      in Nederland wonende of gevestigde vaste vertegenwoordiger. Hierbij wordt mede als vaste inrichting aangemerkt het
      in Nederland verrichten of doen verrichten van werkzaamheden die gericht zijn op het in Nederland laten optreden
      van artiesten, beroepssporters of buitenlandse gezelschappen.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel8a
  - number: 8a.4
    text: |-
      Bij ministeriële regeling kan, in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid, de
      inhoudingsplicht worden verlegd naar een andere persoon dan voortvloeit uit de toepassing van het eerste of tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel8a
  - number: '9.1'
    text: De belasting wordt geheven over het belastbare loon.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel9
  - number: '9.2'
    text: Belastbaar loon is het loon verminderd met de zeedagenaftrek.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel9
  - number: '10.1'
    text: Loon is al hetgeen uit een dienstbetrekking of een vroegere dienstbetrekking wordt genoten.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel10
  - number: '10.2'
    text: |-
      Tot het loon behoren aanspraken om na verloop van tijd of onder een voorwaarde een of meer uitkeringen of
      verstrekkingen te ontvangen.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel10
  - number: '10.3'
    text: Onder aanspraken worden mede verstaan rechten op geheel of gedeeltelijk betaald verlof.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel10
  - number: 10a.1
    text: |-
      Naar keuze van de werknemer met wie in het kader van de dienstbetrekking of vroegere dienstbetrekking een
      aandelenoptierecht is overeengekomen, wordt de verwachtingswaarde van een aandelenoptierecht niet als loon in
      aanmerking genomen. Indien [de eerste volzin][ref1] toepassing heeft gevonden, wordt voorts niet als loon in
      aanmerking genomen de aangroei van de intrinsieke waarde die heeft plaatsgevonden tussen het toekenningstijdstip en
      het genietingstijdstip van het aandelenoptierecht, met dien verstande dat bij deze berekening de intrinsieke waarde
      op het toekenningstijdstip tenminste wordt gesteld op nihil. De verwachtingswaarde van het aandelenoptierecht
      is het verschil tussen de waarde van het aandelenoptierecht en de intrinsieke waarde. De intrinsieke waarde
      van een aandelenoptierecht is het verschil tussen de waarde van het aandeel waarop het aandelenoptierecht
      betrekking heeft en de prijs waartegen het aandelenoptierecht kan worden uitgeoefend. Indien naar de keuze van
      de werknemer de verwachtingswaarde niet als loon in aanmerking wordt genomen, wordt de intrinsieke waarde van het
      aandelenoptierecht ten minste gesteld op nihil.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 10a
        hoofdstuk: II
  - number: 10a.2
    text: |-
      Het eerste lid vindt slechts toepassing indien de inspecteur schriftelijk door de werknemer en de
      inhoudingsplichtige gezamenlijk uiterlijk op het eerst mogelijke tijdstip waarop het aandelenoptierecht als loon
      kan worden genoten van de keuze van de werknemer op de hoogte is gesteld. Voor de toepassing van dit lid kunnen bij
      ministeriële regeling nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel10a
  - number: 10a.3
    text: |-
      Ingeval in het kader van de dienstbetrekking of vroegere dienstbetrekking met de werknemer een aandelenoptierecht
      is overeengekomen, behoort mede tot het loon hetgeen door hem wordt genoten ter zake van de uitoefening of
      vervreemding van dat recht boven hetgeen in verband met dat recht reeds als loon in aanmerking is genomen, ingeval:
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel10a
  - number: 10a.3.a
    text: de uitoefening of vervreemding geschiedt binnen drie jaren na het overeenkomen van dat recht;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel10a
  - number: 10a.3.b
    text: het eerste lid toepassing heeft gevonden.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel10a
  - number: 10a.4
    text: |-
      Onder vervreemding wordt mede begrepen het formeel of feitelijk tot voorwerp van zekerheid worden, het
      brengen in het vermogen van een onderneming, alsmede het ontvangen van een schadeloosstelling als bedoeld in
      [artikel 334p, eerste lid][ref1], of [artikel 320, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2]. De
      overgang onder algemene titel van een aandelenoptierecht wordt niet als een vervreemding aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel334p
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel320
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 334p
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '320'
  - number: 10a.5
    text: |-
      Ingeval bij vervreemding van een aandelenoptierecht de tegenprestatie ontbreekt of is bedongen bij een niet onder
      normale omstandigheden gesloten overeenkomst, wordt als genoten bedrag aangemerkt de waarde in het economische
      verkeer welke ten tijde van de vervreemding aan het recht kan worden toegekend.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel10a
  - number: 10a.6
    text: |-
      Voor de toepassing van [dit artikel][ref1] wordt onder een aandelenoptierecht verstaan een recht om een of meer
      aandelen of daarmee gelijk te stellen rechten te verwerven in de inhoudingsplichtige vennootschap of in een met de
      inhoudingsplichtige verbonden vennootschap, of een daarmee gelijk te stellen recht.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 10a
        hoofdstuk: II
  - number: 10a.7
    text: 'Voor de toepassing van deze wet wordt onder een met de inhoudingsplichtige verbonden vennootschap verstaan:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel10a
  - number: 10a.7.a
    text: een vennootschap waarin de inhoudingsplichtige voor ten minste een derde gedeelte belang heeft;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel10a
  - number: 10a.7.b
    text: een vennootschap die voor ten minste een derde gedeelte belang heeft in de inhoudingsplichtige;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel10a
  - number: 10a.7.c
    text: |-
      een vennootschap waarin een derde voor ten minste een derde gedeelte belang heeft, terwijl deze derde tevens voor
      ten minste een derde gedeelte belang heeft in de inhoudingsplichtige.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel10a
  - number: 10a.8
    text: |-
      Voor de toepassing van [dit artikel][ref1] wordt, indien een inhoudingsplichtige vennootschap of een met de
      inhoudingsplichtige vennootschap verbonden vennootschap is betrokken bij een splitsing of een fusie op de voet
      van [artikel 334a][ref2] onderscheidenlijk [artikel 309 van Boek 2 van het Burgerlijk Wetboek][ref3], onder die
      vennootschap mede verstaan de verkrijgende vennootschap in de zin van die artikelen alsmede de vennootschap die
      vóór de splitsing onderscheidenlijk fusie werd aangemerkt als een met de inhoudingsplichtige vennootschap verbonden
      vennootschap.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel334a
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel309
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 10a
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003045
        artikel: 334a
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '309'
  - number: '11.1'
    text: 'Tot het loon behoren niet:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11
  - number: 11.1.a
    text: |-
      vergoedingen die naar algemene maatschappelijke opvattingen niet als beloningsvoordeel worden ervaren, een en ander
      volgens de in of krachtens [hoofdstuk IIA][ref1] gestelde normeringen en beperkingen (vrije vergoedingen);


      [ref1]: https://wetten.overheid.nl/BWBR0002471#HoofdstukIIA
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002471
        hoofdstuk: IIA
  - number: 11.1.b
    text: |-
      verstrekkingen die naar algemene maatschappelijke opvattingen niet als beloningsvoordeel worden ervaren, een en
      ander volgens de in of krachtens de [artikelen 17][ref1] en [17a][ref2] gestelde normeringen en beperkingen (vrije
      verstrekkingen);


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel17a
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '17'
        hoofdstuk: IIA
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 17a
        hoofdstuk: IIA
  - number: 11.1.c
    text: |-
      aanspraken ingevolge een pensioenregeling, een en ander volgens de in of krachtens [hoofdstuk IIB][ref1] gestelde
      normeringen en beperkingen;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#HoofdstukIIB
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002471
        hoofdstuk: IIB
  - number: 11.1.d
    text: |-
      aanspraken ingevolge een regeling voor vervroegde uittreding, een en ander volgens de in of krachtens de
      [artikelen 18i][ref1] en [19f][ref2] gestelde normeringen en beperkingen;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18i
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel19f
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18i
        hoofdstuk: IIB
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 19f
        hoofdstuk: IIB
  - number: 11.1.e
    text: |-
      aanspraken ingevolge de [Ziektewet][ref1], de [Wet arbeid en zorg][ref2], de
      [Wet op de arbeidsongeschiktheidsverzekering][ref3] en de [Werkloosheidswet][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0013008
      [ref3]: https://wetten.overheid.nl/BWBR0002524
      [ref4]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0013008
      - id: ref3
        bwb_id: BWBR0002524
      - id: ref4
        bwb_id: BWBR0004045
  - number: 11.1.f
    text: aanspraken, die naar aard en strekking overeenkomen met aanspraken als bedoeld in onderdeel e;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11
  - number: 11.1.g
    text: 'aanspraken op periodieke uitkeringen ter vervanging van gederfd of te derven loon, mits:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11
  - number: 11.1.g.1°
    text: |-
      deze aanspraken voorzien in aan de werknemer of gewezen werknemer toekomende periodieke uitkeringen die niet
      later ingaan dan in het jaar waarin hij de leeftijd van 65 jaar bereikt of in periodieke uitkeringen die bij
      zijn overlijden ingaan en toekomen aan zijn echtgenoot of gewezen echtgenoot dan wel degene met wie hij duurzaam
      een gezamenlijke huishouding voert of heeft gevoerd en met wie geen bloed- of aanverwantschap in de rechte lijn
      bestaat, of aan zijn kinderen of pleegkinderen die de leeftijd van 30 jaar nog niet hebben bereikt;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11
  - number: 11.1.g.2°
    text: |-
      voor deze aanspraken als verzekeraar optreedt een lichaam als bedoeld in
      [artikel 19a, eerste lid, onderdelen a, b of d][ref1], of de natuurlijke persoon, bedoeld in
      [artikel 19a, eerste lid, onderdeel e][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19a
        hoofdstuk: IIB
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 19a
        hoofdstuk: IIB
  - number: 11.1.g.3°
    text: |-
      deze aanspraken niet zijn opgekomen ingevolge [artikel 19b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19b
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19b
        hoofdstuk: IIB
  - number: 11.1.h
    text: aanspraken op uitkeringen wegens overlijden of invaliditeit ten gevolge van een ongeval;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11
  - number: 11.1.i
    text: |-
      aanspraken op de in onderdeel m bedoelde uitkeringen en verstrekkingen alsmede vergoedingen en verstrekkingen
      ter zake van op de werknemer drukkende uitgaven voor het volgen van een opleiding of studie met het oog op het
      verwerven van inkomen uit werk en woning
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11
  - number: 11.1.j
    text: 'bedragen die worden ingehouden:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11
  - number: 11.1.j.1°
    text: als bijdrage ingevolge een pensioenregeling of een regeling voor vervroegde uittreding;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11
  - number: 11.1.j.2°
    text: |-
      als premie ingevolge de [Werkloosheidswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: 11.1.j.3°
    text: als bijdrage voor aanspraken die ingevolge de onderdelen f en h niet tot het loon behoren;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11
  - number: 11.1.j.4°
    text: in de plaats van premies en bijdragen als bedoeld onder 2° en 3°;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11
  - number: 11.1.j.5°
    text: als bijdragen ingevolge een regeling voor verlofsparen;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11
  - number: 11.1.k
    text: |-
      uitkeringen en verstrekkingen tot vergoeding van door de werknemer in verband met zijn dienstbetrekking geleden
      schade aan of verlies van persoonlijke zaken;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11
  - number: 11.1.l
    text: |-
      uitkeringen en verstrekkingen tot dekking van op de werknemer drukkende kosten ter zake van ziekte, invaliditeit
      en bevalling, behoudens vergoedingen ter zake van premies en bijdragen voor ziektekostenregelingen, uitkeringen
      en verstrekkingen die naar aard en omvang overeenkomen met uitkeringen en verstrekkingen ingevolge de
      [Ziekenfondswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002460
  - number: 11.1.m
    text: |-
      eenmalige uitkeringen en verstrekkingen ter zake van overlijden van de werknemer, zijn partner in het kalenderjaar
      of in het voorafgaande kalenderjaar – in de zin van [artikel 1.2 van de Wet inkomstenbelasting 2001][ref1], of zijn
      kinderen en pleegkinderen, voorzover deze uitkeringen en verstrekkingen niet overtreffen driemaal het loon over een
      maand bepaald met inachtneming van bij ministeriële regeling te stellen regels;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel1
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '1'
  - number: 11.1.n
    text: |-
      uitkeringen en verstrekkingen, andere dan die ter zake van ziekte, invaliditeit, bevalling, adoptie en overlijden,
      die de werknemer ontvangt uit een fonds tot welks middelen de inhoudingsplichtige gedurende de laatstverlopen
      vijf kalenderjaren evenveel of minder heeft bijgedragen dan de bij het fonds betrokken werknemers, tenzij die
      uitkeringen en verstrekkingen geschieden ingevolge een aanspraak die niet tot het loon behoort;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11
  - number: 11.1.o
    text: |-
      een uitkering of verstrekking die eenmaal wordt toegekend na het bereiken van een diensttijd van ten minste 25 jaar
      en een uitkering of verstrekking die eenmaal wordt toegekend na het bereiken van een diensttijd van ten minste 40
      jaar, voor zover de waarde daarvan het loon over een maand niet overtreft, mits is voldaan aan bij ministeriële
      regeling te stellen voorwaarden;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11
  - number: 11.1.p
    text: |-
      verstrekking en terbeschikkingstelling van computers en bijbehorende apparatuur, alsmede vergoedingen van de
      kosten daarvan, voorzover de waarde in het economische verkeer van de computers en de apparatuur tezamen in het
      kalenderjaar en de twee voorafgaande kalenderjaren niet meer bedraagt dan € 1 415 en niet aannemelijk is dat zij
      niet mede dienen ter vervulling van de dienstbetrekking;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11
  - number: 11.1.q
    text: |-
      verstrekking en terbeschikkingstelling van inrichting van de werkruimte in de woning, de aanhorigheden daaronder
      begrepen, van de werknemer, alsmede vergoedingen van de kosten daarvan, voorzover de waarde in het economische
      verkeer van die inrichting in het kalenderjaar en de vier voorafgaande kalenderjaren niet meer bedraagt dan € 1815
      en niet aannemelijk is dat zij niet mede dient ter vervulling van de dienstbetrekking, mits:
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11
  - number: 11.1.q.1°
    text: |-
      de werknemer krachtens een schriftelijk vastgelegde regeling van de inhoudingsplichtige dan wel van de
      inhoudingsplichtige en een of meer andere inhoudingsplichtigen ten minste eenmaal per week, gedurende de
      gebruikelijke werktijd en zonder dat tevens wordt gereisd naar een buiten de woning gelegen arbeidsplaats, in die
      werkruimte ter vervulling van de dienstbetrekking pleegt te werken met behulp van telematica; en
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11
  - number: 11.1.q.2°
    text: |-
      de inrichting voldoet aan bij ministeriële regeling te stellen voorwaarden; een en ander met inachtneming van bij
      ministeriële regeling te stellen nadere regels;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11
  - number: 11.1.r
    text: 'aanspraken:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11
  - number: 11.1.r.1°
    text: |-
      op vakantieverlof en compensatieverlof, voorzover deze aanspraken aan het einde van het kalenderjaar in totaal niet
      meer bedragen dan de arbeidsduur per week gerekend over een periode van vijftig weken;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11
  - number: 11.1.r.2°
    text: op bij ministeriële regeling aan te wijzen geclausuleerd verlof;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11
  - number: 11.1.r.3°
    text: op verlof tijdens rust- en feestdagen;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11
  - number: 11.1.r.4°
    text: ingevolge een regeling voor verlofsparen;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11
  - number: 11.1.s
    text: |-
      hetgeen wordt genoten ter zake van het verrichten van arbeid in de onderneming van de partner van de werknemer,
      indien bij het bepalen van de winst uit die onderneming de kosten en lasten die verband houden met de vergoeding
      voor die arbeid op grond van [artikel 3.16, vierde lid, van de Wet inkomstenbelasting 2001][ref1] niet in aftrek
      komen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '11.2'
    text: |-
      Bij of krachtens ministeriële regeling kan worden bepaald dat eveneens niet tot het loon behoren andere aanspraken
      dan bedoeld in het eerste lid, indien zulks tot vergemakkelijking van de heffing van de belasting kan leiden.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11
  - number: '11.3'
    text: 'Onder regeling voor verlofsparen wordt verstaan een regeling die:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11
  - number: 11.3.a
    text: |-
      ten doel heeft het treffen van een voorziening in geld of tijd uitsluitend voor een periode van extra verlof
      dat niet kan worden opgenomen binnen een jaar voorafgaand aan de ingang van een ouderdomspensioen of van een
      voorziening voor vervroegde uittreding;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11
  - number: 11.3.b
    text: |-
      inhoudt dat verlofsparen kan plaatsvinden door middel van sparen in geld of tijd, voorzover in het kalenderjaar
      niet meer aanspraken ontstaan dan overeenkomt met 10 percent van het loon van het jaar en voorzover de totale
      aanspraken aan het einde van het kalenderjaar door de in het kalenderjaar gespaarde aanspraken een periode van
      extra verlof van een jaar niet te boven gaan;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11
  - number: 11.3.c
    text: open staat voor ten minste driekwart van de werknemers van de inhoudingsplichtige.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11
  - number: '11.4'
    text: 'Indien op enig tijdstip:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11
  - number: 11.4.a
    text: een regeling voor verlofsparen niet langer als zodanig is aan te merken, of
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11
  - number: 11.4.b
    text: |-
      een aanspraak ingevolge een regeling voor verlofsparen wordt afgekocht of vervreemd, wordt op het onmiddellijk
      daaraan voorafgaande tijdstip de aanspraak ingevolge de regeling voor verlofsparen aangemerkt als loon uit
      een vroegere dienstbetrekking van de werknemer of gewezen werknemer dan wel, indien deze is overleden, van de
      gerechtigde tot de aanspraak.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11
  - number: '11.5'
    text: |-
      Het vierde lid is niet van toepassing voorzover een aanspraak ingevolge een regeling voor verlofsparen wordt
      omgezet in een aanspraak ingevolge een pensioenregeling of een regeling voor vervroegde uittreding die na de
      omzetting nog blijft binnen de in of krachtens [hoofdstuk IIB][ref1] gestelde begrenzingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#HoofdstukIIB
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002471
        hoofdstuk: IIB
  - number: '11.6'
    text: |-
      Voorzover de aanspraken op vakantieverlof en compensatieverlof en de aanspraken ingevolge een regeling voor
      verlofsparen aan het einde van het kalenderjaar in totaal de in het eerste lid, onderdeel r, onder 1°, en de in
      het derde lid, onderdeel b, opgenomen begrenzingen overschrijden, wordt het meerdere geacht te zijn genoten bij het
      einde van het kalenderjaar of het einde van de dienstbetrekking zo deze in de loop van het kalenderjaar eindigt.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11
  - number: 11a
    text: Tot het loon behoort mede niet het genot van een ter beschikking gestelde auto.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11a
  - number: 11b
    text: 'Tot het loon behoren voorts mede niet:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11b
  - number: 11b.a
    text: |-
      een premie als bedoeld in [artikel 31, tweede lid, onderdeel j, van de Wet werk en bijstand][ref1],
      mits in het jaar waarin de premie is verstrekt geen vergoeding is verstrekt als bedoeld in
      [artikel 31, tweede lid, onderdeel k, van de Wet werk en bijstand][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel31
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '31'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '31'
  - number: 11b.b
    text: |-
      een vergoeding als bedoeld in [artikel 31, tweede lid, onderdeel k, van de Wet werk en bijstand][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel31
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '31'
  - number: '12'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot het bedrag aan fooien en dergelijke
      prestaties van derden, dat in bepaalde gevallen of groepen van gevallen geacht wordt te zijn genoten. Daarbij kan
      worden bepaald, dat een bedrag aan fooien en dergelijke prestaties van derden niet tot het loon behoort.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel12
  - number: 12a
    text: |-
      Ten aanzien van de werknemer die arbeid verricht ten behoeve van een lichaam waarin hij een aanmerkelijk
      belang heeft dan wel waaraan hij vermogensbestanddelen ter beschikking stelt, beide in de zin van
      [de Wet inkomstenbelasting 2001][ref1],, wordt het in een kalenderjaar genoten loon ten minste gesteld op het
      in [artikel 72, tweede lid, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2] bedoelde bedrag
      aan premie-inkomen dat ten hoogste in aanmerking wordt genomen dan wel, indien aannemelijk is dat ter zake van
      soortgelijke dienstbetrekkingen waarbij een aanmerkelijk belang of terbeschikkingstelling van vermogensbestanddelen
      geen rol speelt, in het economische verkeer een lager loon gebruikelijk is, gesteld op dat lagere loon.
      Indien aannemelijk is dat ter zake van soortgelijke dienstbetrekkingen waarbij een aanmerkelijk belang of
      terbeschikkingstelling van vermogensbestanddelen geen rol speelt, in het economische verkeer een hoger loon
      gebruikelijk is, wordt het loon gesteld op een zodanig bedrag dat het niet meer in belangrijke mate afwijkt van
      hetgeen gebruikelijk is, met dien verstande dat – indien bij het lichaam of daarmee verbonden lichamen ook andere
      werknemers in dienst zijn – het niet lager wordt gesteld dan het hoogste loon van de overige werknemers. Ingeval
      aannemelijk is dat het loon, gelet op wat gebruikelijk is in het economische verkeer waarbij een aanmerkelijk
      belang of terbeschikkingstelling van vermogensbestanddelen geen rol speelt, op een lager bedrag behoort te worden
      gesteld dan het hoogste loon van de overige werknemers wordt het, in afwijking in zoverre van de vorige volzin,
      op een zodanig bedrag gesteld dat het niet meer in belangrijke mate afwijkt van hetgeen gebruikelijk is. Het loon
      wordt nimmer op een lager bedrag gesteld dan het bedrag ingevolge [de eerste volzin][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011353
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel72
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel12a
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0011353
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '72'
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 12a
        hoofdstuk: II
  - number: '13.1'
    text: |-
      Niet in geld genoten loon wordt in aanmerking genomen naar de waarde die daaraan in het economische verkeer kan
      worden toegekend, met dien verstande dat voorzover de verwerving van het loon het gebruik of verbruik daarvan
      meebrengt, de waarde wordt gesteld op ten hoogste het bedrag van de besparing.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel13
  - number: '13.2'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de waardering van aanspraken en
      van ander niet in geld genoten loon.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel13
  - number: '13.3'
    text: |-
      De ingevolge de vorige leden in aanmerking te nemen waarde wordt verminderd met het bedrag dat de werknemer ter
      zake in rekening wordt gebracht, met dien verstande dat de aldus verminderde waarde ten minste op nihil wordt
      gesteld.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel13
  - number: 13a.1
    text: 'Loon wordt beschouwd te zijn genoten op het tijdstip waarop het:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel13a
  - number: 13a.1.a
    text: betaald of verrekend wordt, ter beschikking van de werknemer wordt gesteld of rentedragend wordt, dan wel
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel13a
  - number: 13a.1.b
    text: vorderbaar en tevens inbaar wordt.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel13a
  - number: 13a.2
    text: |-
      Indien is overeengekomen dat het loon geheel of voor een meer dan bijkomstig gedeelte op een ongebruikelijk
      tijdstip zal worden genoten, wordt daarmee voor de toepassing van het eerste lid geen rekening gehouden. Voor de
      beoordeling of het loon voor een meer dan bijkomstig gedeelte op een ongebruikelijk tijdstip zal worden genoten,
      wordt mede in aanmerking genomen hetgeen reeds op grond van een regeling voor verlofsparen in de toekomst zal
      worden genoten.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel13a
  - number: 13a.3
    text: |-
      Voor zover ingevolge [artikel 12][ref1] het loon hoger is dan het werkelijk genoten loon, wordt het meerdere geacht
      te zijn genoten bij het einde van het kalenderjaar of het einde van de dienstbetrekking zo deze in de loop van het
      kalenderjaar eindigt.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel12a
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 12a
        hoofdstuk: II
  - number: '14.1'
    text: |-
      De zeedagenaftrek geldt ten aanzien van de werknemer die als kapitein, scheepsofficier of scheepsgezel van een
      zeeschip in de zin van de [Zeebrievenwet ][ref1]in verband met zijn werkzaamheden doorgaans ten minste 180 dagen
      per jaar aan boord van een dergelijk zeeschip of in een buitenlandse haven of havenplaats verblijft (zeedagen). De
      dagen van vertrek en van aankomst worden daarbij meegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0001933
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001933
  - number: '14.2'
    text: De zeedagenaftrek bedraagt € 4 per zeedag.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel14
  - number: '14.3'
    text: 'Als zeedagen worden niet in aanmerking genomen:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel14
  - number: 14.3.a
    text: |-
      dagen ten gevolge van reizen met een duur van 14 dagen of minder, tenzij gedurende de reis een buitenlandse haven
      is aangedaan die voor de vervoerde zaken of personen het karakter van haven van bestemming of van vertrek heeft;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel14
  - number: 14.3.b
    text: dagen waarbij het vertrek uit en de aankomst in een Nederlandse haven op dezelfde dag liggen;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel14
  - number: 14.3.c
    text: dagen waarop het zeeschip de hele dag in een Nederlandse haven ligt.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel14
  - number: '15'
    text: 'Vrije vergoedingen zijn:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel15
  - number: 15.a
    text: |-
      vergoedingen voorzover zij geacht kunnen worden te strekken tot bestrijding van kosten, lasten en afschrijvingen
      ter behoorlijke vervulling van de dienstbetrekking;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel15
  - number: 15.b
    text: |-
      andere vergoedingen voorzover zij naar algemene maatschappelijke opvattingen niet als beloningsvoordeel worden
      ervaren.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel15
  - number: 15a.1
    text: 'Tot de vrije vergoedingen behoren vergoedingen, in redelijkheid, ter zake van:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel15a
  - number: 15a.1.a
    text: consumpties tijdens de werktijd die geen deel uitmaken van een maaltijd;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel15a
  - number: 15a.1.b
    text: werkkleding, met inachtneming van bij ministeriële regeling te stellen regels;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel15a
  - number: 15a.1.c
    text: vakliteratuur;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel15a
  - number: 15a.1.d
    text: |-
      representatie ter behoorlijke vervulling van de dienstbetrekking, daaronder begrepen recepties, feestelijke
      bijeenkomsten, giften, relatiegeschenken en vermaak, met inbegrip van de desbetreffende reizen en het
      desbetreffende verblijf;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel15a
  - number: 15a.1.e
    text: |-
      cursussen, congressen, seminars, symposia, excursies, studiereizen en dergelijke ter behoorlijke vervulling van de
      dienstbetrekking, met inbegrip van de desbetreffende reizen en het desbetreffende verblijf;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel15a
  - number: 15a.1.f
    text: |-
      muziekinstrumenten, geluidsapparatuur, gereedschap, tekstverwerkers, schrijf- en rekenmachines, computers en
      andere dergelijke apparatuur, alsmede beeldapparatuur, ter behoorlijke vervulling van de dienstbetrekking, met dien
      verstande dat bij zaken met een kostprijs van € 450 of meer met een meerjarig belang de afschrijving in aanmerking
      wordt genomen;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel15a
  - number: 15a.1.g
    text: |-
      verhuizing, ter omvang van de kosten van het overbrengen van de inboedel vermeerderd met 12% van het, met
      inachtneming van bij ministeriële regeling te stellen regels bepaalde, jaarloon of het tot jaarloon herleide bedrag
      van het in het kalenderjaar genoten loon uit de dienstbetrekking waarvoor de werknemer verhuist, maar met niet meer
      dan € 5445;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel15a
  - number: 15a.1.h
    text: |-
      op de werknemer drukkende uitgaven voor het volgen van een opleiding of studie met het oog op het verwerven van
      inkomen uit werk en woning, met uitzondering van vergoedingen:
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel15a
  - number: 15a.1.h.1°
    text: die verband houden met een werk- of studeerruimte, daaronder begrepen de inrichting;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel15a
  - number: 15a.1.h.2°
    text: |-
      van binnenlandse reizen voorzover de vergoeding meer bedraagt dan het bedrag per kilometer, bedoeld in
      [artikel 15b, eerste lid, onderdeel a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel15b
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 15b
        hoofdstuk: IIA
  - number: 15a.1.i
    text: |-
      een recht op reizen per openbaar vervoer dat niet is beperkt tot reizen over een vast traject ten behoeve van woon-
      werkverkeer, voorzover is voldaan aan bij ministeriële regeling te stellen regels die mede betrekking kunnen hebben
      op de mate waarin de vergoeding tot de vrije vergoedingen behoort;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel15a
  - number: 15a.1.j
    text: |-
      extra kosten van tijdelijk verblijf buiten het land van herkomst (extraterritoriale kosten), met dien verstande
      dat voor bij algemene maatregel van bestuur aan te wijzen groepen werknemers die door een inhoudingsplichtige
      van buiten Nederland in dienstbetrekking worden genomen of buiten Nederland worden uitgezonden, onder daarbij te
      stellen voorwaarden, geldt dat vergoedingen van kosten van verblijf buiten het land van herkomst – voor van buiten
      Nederland in dienstbetrekking genomen werknemers gedurende ten hoogste tien jaar – ten minste worden beschouwd
      als vergoeding voor extraterritoriale kosten tot ten hoogste 30 percent van het loon en de vergoeding voor
      extraterritoriale kosten, alsmede tot het bedrag van de daarbij aan te wijzen schoolgelden.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel15a
  - number: 15a.2
    text: |-
      Voor de toepassing van het eerste lid, onderdeel g, kunnen bij ministeriële regeling regels worden gesteld voor de
      beoordeling of in ieder geval in het kader van de dienstbetrekking wordt verhuisd.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel15a
  - number: 15b.1
    text: 'Tot de vrije vergoedingen behoren niet vergoedingen ter zake van:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel15b
  - number: 15b.1.a
    text: |-
      vervoer, waar onder woon-werkverkeer, indien dat vervoer niet plaatsvindt per taxi, luchtvaartuig, schip of ter
      beschikking gesteld vervoermiddel, voorzover de vergoeding meer bedraagt dan € 0,18 per kilometer;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel15b
  - number: 15b.1.b
    text: |-
      kinderopvang voorzover niet is voldaan aan [artikel 16c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel16c
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 16c
        hoofdstuk: IIA
  - number: 15b.1.c
    text: 'maaltijden waarbij het zakelijke karakter:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel15b
  - number: 15b.1.c.1°
    text: van bijkomstig belang is, of
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel15b
  - number: 15b.1.c.2°
    text: |-
      van meer dan bijkomstig belang is voorzover zij wat betreft aantal en regelmaat uitgaan boven bij ministeriële
      regeling te stellen normen;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel15b
  - number: 15b.1.d
    text: bedrijfsfitness voorzover niet is voldaan aan bij ministeriële regeling te stellen regels;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel15b
  - number: 15b.1.e
    text: |-
      werkruimte, de inrichting daaronder begrepen, in de woning, de aanhorigheden daaronder begrepen, van de werknemer
      voorzover niet is voldaan aan bij ministeriële regeling te stellen regels die mede betrekking hebben op de mate
      waarin de vergoeding niet tot de vrije vergoedingen wordt gerekend;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel15b
  - number: 15b.1.f
    text: |-
      telefoonabonnementen behoudens voorzover het betreft het tweede en volgende telefoonabonnement van de werknemer
      waarvan het zakelijke karakter van meer dan bijkomstig belang is;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel15b
  - number: 15b.1.g
    text: |-
      persoonlijke verzorging, behoudens voorzover de werknemer optreedt als artiest of presentator of als beroep een tak
      van sport beoefent;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel15b
  - number: 15b.1.h
    text: personeelsverenigingen en dergelijke;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel15b
  - number: 15b.1.i
    text: |-
      huisvesting buiten de woonplaats ter zake van de dienstbetrekking voorzover de vergoeding betrekking heeft op een
      periode van meer dan twee jaar;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel15b
  - number: 15b.1.j
    text: |-
      premies ingevolge de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1] of een buitenlandse regeling die
      naar aard en strekking daarmee overeenkomt;


      [ref1]: https://wetten.overheid.nl/BWBR0008656
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0008656
  - number: 15b.1.k
    text: verschuldigde loonbelasting en bij wijze van inhouding verschuldigde premie voor de volksverzekeringen;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel15b
  - number: 15b.1.l
    text: |-
      premies voor buitenlandse verzekeringen die naar aard en strekking overeenkomen met de volksverzekeringen, tenzij
      de werknemer premieplichtig is voor de volksverzekeringen;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel15b
  - number: 15b.1.m
    text: |-
      geldboeten opgelegd door een Nederlandse strafrechter en geldsommen betaald aan de Staat ter voorkoming van
      strafvervolging in Nederland of ter voldoening aan een voorwaarde verbonden aan een besluit tot gratieverlening,
      bestuurlijke boeten, geldboeten opgelegd op basis van bij wet geregeld tuchtrecht, alsmede kosten als bedoeld in
      [artikel 234, zesde lid][ref1], en [artikel 235, derde lid, van de Gemeentewet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel234
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel235
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '234'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '235'
  - number: 15b.1.n
    text: |-
      misdrijven ter zake waarvan de werknemer door een Nederlandse strafrechter bij onherroepelijke uitspraak is
      veroordeeld, daaronder begrepen de misdrijven die zijn betrokken bij de bepaling van de hoogte van de opgelegde
      straf en ter zake waarvan het Openbaar Ministerie heeft verklaard te zullen afzien van vervolging;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel15b
  - number: 15b.1.o
    text: |-
      misdrijven ter zake waarvan de werknemer ter voorkoming van strafvervolging in Nederland aan de gestelde
      voorwaarden heeft voldaan;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel15b
  - number: 15b.1.p
    text: |-
      wapens en munitie, tenzij terzake een erkenning, consent, vergunning, verlof of ontheffing is verleend krachtens de
      [Wet wapens en munitie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008804
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0008804
  - number: 15b.1.q
    text: |-
      dieren en categorieën van dieren als bedoeld in de krachtens de [artikelen 73][ref1] en
      [107 van de Gezondheids- en welzijnswet voor dieren][ref2] vastgestelde Regeling agressieve dieren, tenzij terzake
      een dierenpaspoort als bedoeld in artikel 3, tweede lid, onderdeel a, van die regeling is afgegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel107
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '73'
      - id: ref2
        bwb_id: BWBR0005662
        artikel: '107'
  - number: 15b.1.r
    text: parkeergelegenheid in of bij de woning van de werknemer.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel15b
  - number: 15b.2
    text: |-
      Onder bestuurlijke boete als bedoeld in het eerste lid, onderdeel m, wordt verstaan: een door een Nederlands
      bestuursorgaan bij beschikking opgelegde onvoorwaardelijke verplichting tot betaling van een geldsom, die is
      gericht op bestraffing van degene die een gedraging in strijd met het bepaalde bij of krachtens enig wettelijk
      voorschrift pleegt of medepleegt.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel15b
  - number: 15b.3
    text: |-
      Vrije vergoedingen die verband houden met een misdrijf, verstrekt in het loontijdvak waarin de veroordeling,
      bedoeld in het eerste lid, onderdeel o, onherroepelijk is geworden dan wel waarin aan de gestelde voorwaarden,
      bedoeld in het eerste lid, onderdeel p, is voldaan, in de daaraan voorafgaande loontijdvakken van het jaar of in
      een of meer van de vijf daaraan voorafgaande jaren, worden op het tijdstip van het onherroepelijk worden van de
      veroordeling, respectievelijk het voldoen aan de gestelde voorwaarden, alsnog als loon in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel15b
  - number: 15c
    text: |-
      Bij ministeriële regeling kan, in aanvulling op [de artikelen 15][ref1], [15a][ref2] en [15b][ref3] en zonodig
      onder het aanbrengen van normeringen en beperkingen en het stellen van voorwaarden, worden bepaald dat vergoedingen
      die naar algemene maatschappelijke opvattingen wel of niet als loon worden ervaren, niet respectievelijk wel tot de
      vrije vergoedingen worden gerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel15a
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel15b
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '15'
        hoofdstuk: IIA
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 15a
        hoofdstuk: IIA
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 15b
        hoofdstuk: IIA
  - number: 15d
    text: |-
      Vaste vergoedingen zijn geen vrije vergoedingen voorzover niet is voldaan aan bij ministeriële regeling te stellen
      regels.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel15d
  - number: 16a.1
    text: |-
      Als vrije vergoeding ter zake van vervoer per openbaar vervoer, geldt ten hoogste de prijs van de vervoerbewijzen
      voor de per openbaar vervoer afgelegde reisafstand, indien:
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel16a
  - number: 16a.1.a
    text: |-
      de werknemer de vervoerbewijzen ter vergoeding overhandigt of zo spoedig mogelijk zal overhandigen aan de
      inhoudingsplichtige, en
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel16a
  - number: 16a.1.b
    text: deze de vervoerbewijzen per werknemer administreert en voor controle beschikbaar houdt.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel16a
  - number: 16a.2
    text: Bij ministeriële regeling worden regels gesteld voor de uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel16a
  - number: 16a.3
    text: |-
      Het eerste lid is slechts van toepassing indien de vergoeding niet als vrije vergoeding in de zin van
      [artikel 15b, eerste lid, onderdeel a][ref1], in aanmerking wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel15b
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 15b
        hoofdstuk: IIA
  - number: 16c.1
    text: 'Vergoedingen ter zake van op de werknemer drukkende kosten van kinderopvang gelden als vrije vergoeding:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel16c
  - number: 16c.1.a
    text: voorzover zij hoger zijn dan de bij ministeriële regeling vast te stellen bedragen en
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel16c
  - number: 16c.1.b
    text: mits wordt voldaan aan bij ministeriële regeling te stellen administratieve voorwaarden.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel16c
  - number: 16c.2
    text: |-
      Indien de kinderopvang bij de werknemer thuis plaatsvindt worden de in het eerste lid bedoelde kosten geacht niet
      meer te bedragen dan € 9626 per kind per kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel16c
  - number: 16c.3
    text: |-
      Bij het begin van het kalenderjaar wordt het in het tweede lid vermelde bedrag van rechtswege vervangen door het
      bedrag dat krachtens [artikel 10.1 van de Wet inkomstenbelasting 2001][ref1] wordt vastgesteld ter vervanging van
      het in [artikel 3.143, eerste lid, van die wet][ref2] vermelde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel16c
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 16c.4
    text: |-
      In dit artikel wordt verstaan onder kinderopvang: opvang van kinderen en pleegkinderen die jonger zijn dan
      13 jaar die voldoet aan de regels die krachtens [artikel 20 van de Welzijnswet 1994][ref1] bij gemeentelijke
      verordening zijn gesteld met betrekking tot de kwaliteit van de opvang, of die voldoet aan bij ministeriële
      regeling aan te wijzen buitenlandse regelingen die naar aard en strekking overeenkomen met de krachtens
      [artikel 20 van de Welzijnswet 1994][ref2] bij gemeentelijke verordening gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0006705#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0006705#Artikel20
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel16c
    references:
      - id: ref1
        bwb_id: BWBR0006705
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0006705
        artikel: '20'
  - number: '17.1'
    text: 'Vrije verstrekkingen zijn:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel17
  - number: 17.1.a
    text: |-
      verstrekkingen voorzover zij geacht kunnen worden te strekken tot voorkoming van kosten, lasten en afschrijvingen
      ter behoorlijke vervulling van de dienstbetrekking;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel17
  - number: 17.1.b
    text: |-
      andere verstrekkingen voorzover zij naar algemene maatschappelijke opvattingen niet als beloningsvoordeel worden
      ervaren.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel17
  - number: '17.2'
    text: |-
      De [artikelen 15a tot en met 16c][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel16
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '16'
        hoofdstuk: IIA
  - number: '17.3'
    text: Bijdragen van de werknemer aan vrije verstrekkingen komen niet in mindering op het loon.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel17
  - number: 17a.1
    text: 'Tot de vrije verstrekkingen behoren verstrekkingen, in redelijkheid, ter zake van:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel17a
  - number: 17a.1.a
    text: woon-werkverkeer in de vorm van vervoer vanwege de inhoudingsplichtige;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel17a
  - number: 17a.1.b
    text: |-
      parkeergelegenheid bij de plaats van werkzaamheden, indien er geen sprake is van parkeergelegenheid als bedoeld in
      [artikel 15b, eerste lid, onderdeel r][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel15b
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 15b
        hoofdstuk: IIA
  - number: 17a.1.c
    text: |-
      algemeen erkende feestdagen en het Sint-Nicolaasfeest, een jubileum van de inhoudingsplichtige, een dienstjubileum
      en de verjaardag en andere persoonlijke feestdagen van de werknemer, alsmede het einde van de dienstbetrekking,
      mits de verstrekkingen een in hoofdzaak ideële waarde hebben.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel17a
  - number: 17a.2
    text: 'Onder vervoer vanwege de inhoudingsplichtige wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel17a
  - number: 17a.2.1°
    text: vanwege de inhoudingsplichtige georganiseerd vervoer;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel17a
  - number: 17a.2.2°
    text: |-
      het reizen per openbaar vervoer op basis van door de inhoudingsplichtige aangeschafte en door hem aan de werknemer
      verstrekte plaatsbewijzen.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel17a
  - number: '18.1'
    text: 'Onder pensioenregeling wordt verstaan een regeling:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18
  - number: 18.1.a
    text: |-
      die uitsluitend of, met het oog op uitzonderlijke gevallen van restbegunstiging, nagenoeg uitsluitend ten doel
      heeft het treffen van:
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18
  - number: 18.1.a.1°
    text: een levenslange inkomensvoorziening bij ouderdom voor werknemers en gewezen werknemers (ouderdomspensioen);
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18
  - number: 18.1.a.2°
    text: |-
      een inkomensvoorziening na hun overlijden ten behoeve van hun echtgenoten en gewezen echtgenoten, dan wel van
      degenen met wie zij duurzaam een gezamenlijke huishouding voeren of hebben gevoerd en met wie geen bloed- of
      aanverwantschap in de eerste graad bestaat (nabestaandenpensioen);
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18
  - number: 18.1.a.3°
    text: |-
      een inkomensvoorziening na hun overlijden ten behoeve van hun kinderen en pleegkinderen die de leeftijd van 30 jaar
      nog niet hebben bereikt (wezenpensioen);
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18
  - number: 18.1.a.4°
    text: |-
      een inkomensvoorziening bij arbeidsongeschiktheid zodra die langer dan een jaar duurt en welke niet uitgaat boven
      hetgeen naar maatschappelijke opvattingen redelijk moet worden geacht (arbeidsongeschiktheidspensioen), en
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18
  - number: 18.1.b
    text: |-
      waarin is bepaald dat de aanspraken ingevolge de regeling niet kunnen worden afgekocht, vervreemd of prijsgegeven,
      dan wel formeel of feitelijk voorwerp van zekerheid kunnen worden, anders dan in de gevallen voorzien bij of
      krachtens de [Pensioen- en spaarfondsenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002089
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002089
  - number: 18.1.c
    text: |-
      waarvan als verzekeraar optreedt een lichaam of de natuurlijke persoon bedoeld in [artikel 19a, eerste lid][ref1];
      een en ander voor zover die regeling blijft binnen de in of krachtens dit hoofdstuk vastgestelde begrenzingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19a
        hoofdstuk: IIB
  - number: '18.2'
    text: 'Onder pensioenregeling wordt mede verstaan een regeling die:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18
  - number: 18.2.a
    text: |-
      het ouderdomspensioen aanvult in verband met het ontbreken van uitkeringen ingevolge de
      [Algemene Ouderdomswet][ref1] voor de 65-jarige leeftijd en het verschil in verschuldigde premie voor de
      volksverzekeringen over het ouderdomspensioen voor en na de 65-jarige leeftijd (overbruggingspensioen);


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 18.2.b
    text: |-
      het nabestaandenpensioen dan wel het wezenpensioen aanvult in verband met het ontbreken van uitkeringen ingevolge
      de [Algemene nabestaandenwet][ref1] en het verschil in verschuldigde premie voor de volksverzekeringen over het
      pensioen voor en na de 65-jarige leeftijd (nabestaandenoverbruggingspensioen).


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: '18.3'
    text: |-
      Ingeval een regeling voldoet aan de in het eerste lid opgenomen voorwaarden doch niet blijft binnen de in of
      krachtens dit hoofdstuk opgenomen begrenzingen, is de regeling een pensioenregeling voorzover blijkt dat zij
      blijft binnen de in of krachtens dit hoofdstuk opgenomen begrenzingen. De inhoudingsplichtige verzoekt de
      inspecteur uiterlijk op het eerste moment van overschrijding van de bedoelde begrenzingen vast te stellen welk
      deel van de desbetreffende aanspraak blijft binnen die begrenzingen. Bij toepassing van [de eerste volzin][ref1]
      geeft de inhoudingsplichtige bij elke te zijner tijd op basis van de regeling te verstrekken pensioenuitkering
      overeenkomstig bij ministeriële regeling te stellen regels aan welk deel daarvan tot het loon van de werknemer
      behoort. De inspecteur beslist op het verzoek bij voor bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '18'
        hoofdstuk: IIB
  - number: 18a.1
    text: |-
      Een op een eindloonstelsel gebaseerd ouderdomspensioen bedraagt per dienstjaar niet meer dan 2 percent van het
      pensioengevend loon.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18a
  - number: 18a.2
    text: |-
      Een op een middelloonstelsel gebaseerd ouderdomspensioen bedraagt per dienstjaar niet meer dan 2,25 percent van het
      pensioengevend loon.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18a
  - number: 18a.3
    text: |-
      Een op een beschikbare-premiestelsel gebaseerd ouderdomspensioen wordt tijdsevenredig opgebouwd en is gericht op
      een pensioen dat na 35 jaren opbouw niet meer bedraagt dan 70 percent van het loon op dat tijdstip. De beschikbare
      premie wordt ten hoogste bepaald met inachtneming van de volgende uitgangspunten:
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18a
  - number: 18a.3.a
    text: |-
      de beschikbare premie wordt actuarieel vastgesteld per leeftijdsklasse van ten hoogste vijf jaren en wordt
      afgestemd op de gemiddelde leeftijd in de klasse;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18a
  - number: 18a.3.b
    text: |-
      als loopbaanontwikkeling wordt gerekend met een loonstijging van drie percent per jaar gedurende de jaren voor
      het bereiken van de 35-jarige leeftijd, van twee percent per jaar gedurende de tien daaropvolgende jaren, van een
      percent per jaar gedurende de tien daaropvolgende jaren en van nihil gedurende de overige jaren;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18a
  - number: 18a.3.c
    text: |-
      bij de berekening wordt een rekenrente in aanmerking genomen van ten minste vier percent en wordt de te verwachten
      inflatie op nihil gesteld.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18a
  - number: 18a.4
    text: 'Een ouderdomspensioen gaat niet later in dan bij het vroegste van de volgende tijdstippen:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18a
  - number: 18a.4.1°
    text: |-
      ingeval de dienstbetrekking eindigt voor de in de pensioenregeling vastgestelde ingangsdatum: de vastgestelde
      ingangsdatum, dan wel op het vroegste van de tijdstippen, bedoeld [onder 3°][ref1], [4°][ref2] en [5°][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18a
        hoofdstuk: IIB
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 18a
        hoofdstuk: IIB
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 18a
        hoofdstuk: IIB
  - number: 18a.4.2°
    text: |-
      ingeval de dienstbetrekking eindigt op of na de in de pensioenregeling vastgestelde ingangsdatum: het tijdstip
      waarop de dienstbetrekking eindigt;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18a
  - number: 18a.4.3°
    text: |-
      ingeval het ouderdomspensioen 100 percent van het pensioengevend loon komt te bedragen voordat de werknemer of
      gewezen werknemer de 65-jarige leeftijd heeft bereikt: het tijdstip waarop hij de 65-jarige leeftijd bereikt;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18a
  - number: 18a.4.4°
    text: |-
      ingeval het ouderdomspensioen 100 percent van het pensioengevend loon komt te bedragen op of na het tijdstip
      waarop de werknemer of gewezen werknemer de 65-jarige leeftijd heeft bereikt: het tijdstip waarop dat maximum wordt
      bereikt;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18a
  - number: 18a.4.5°
    text: het tijdstip waarop de werknemer de 70-jarige leeftijd bereikt.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18a
  - number: 18a.5
    text: |-
      Ingeval het ouderdomspensioen later ingaat dan op de in de pensioenregeling vastgestelde ingangsdatum mag het
      pensioen na die ingangsdatum worden verhoogd overeenkomstig het tot die datum gevolgde stelsel, met inbegrip van
      herrekening met inachtneming van algemeen aanvaarde actuariële grondslagen, doch niet verder dan tot 100 percent
      van het pensioengevend loon.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18a
  - number: 18a.6
    text: |-
      Indien het ouderdomspensioen eerder ingaat dan bij het bereiken van de 60-jarige leeftijd wordt het herrekend ten
      opzichte van die leeftijd of van de in de pensioenregeling vastgestelde latere ingangsdatum met inachtneming van
      algemeen aanvaarde actuariële grondslagen. Hierbij kan, zonodig in afwijking van de feitelijke situatie, worden
      uitgegaan van een pensioen dat uiterlijk ingaat bij het bereiken van de 60-jarige leeftijd en dat per dienstjaar
      niet meer bedraagt dan 2 percent van het pensioengevend loon.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18a
  - number: 18a.7
    text: Een ouderdomspensioen gaat niet uit boven 100 percent van het pensioengevend loon op het tijdstip van ingang.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18a
  - number: 18a.8.a
    text: |-
      De in dit hoofdstuk met betrekking tot het desbetreffende pensioen opgenomen maxima worden voor het
      ouderdomspensioen opgevat met inbegrip van een bedrag dat ten minste wordt gesteld op per dienstjaar of ontbrekend
      dienstjaar een evenredig gedeelte van de voor dat jaar geldende uitkeringen voor gehuwde personen zonder toeslag
      als omschreven in [artikel 9, eerste lid, onderdeel b, en vijfde lid, van de Algemene Ouderdomswet][ref1],
      vermeerderd met de vakantietoeslag.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
  - number: 18a.8.b
    text: |-
      Voor het nabestaandenpensioen kan het in [onderdeel a][ref1] bedoelde bedrag voor 70% in aanmerking worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18a
        hoofdstuk: IIB
  - number: 18a.8.c
    text: |-
      Voor het wezenpensioen kan het in [onderdeel a][ref1] bedoelde bedrag voor 14% en voor volle wezen voor 28% in
      aanmerking worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18a
        hoofdstuk: IIB
  - number: 18a.9
    text: |-
      Met betrekking tot een op een beschikbare-premiestelsel gebaseerd ouderdomspensioen als bedoeld in het derde lid
      vindt, in afwijking van het vierde lid, onder 3° en 4°, de beoordeling of binnen de in het zevende lid genoemde
      begrenzingen wordt gebleven plaats op het tijdstip waarop voor het eerst aanspraak op ouderdomspensioen ontstaat
      en op het tijdstip onmiddellijk voorafgaand aan het tijdstip van ingang van het pensioen. Indien op het tijdstip
      onmiddellijk voorafgaand aan het tijdstip van ingang van het pensioen de begrenzing wordt overschreden, zal het
      meerdere worden uitgekeerd in een uitkering ineens. De uitkering ineens dan wel, indien uitkering niet plaatsvindt,
      het bedrag dat zou moeten worden uitgekeerd, wordt aangemerkt als loon uit tegenwoordige dienstbetrekking van de
      werknemer en wordt geacht te zijn genoten op het tijdstip onmiddellijk voorafgaand aan het tijdstip van ingang
      van het pensioen. Ten aanzien van de werknemer die niet premieplichtig is voor de [Algemene Ouderdomswet][ref1]
      wordt, in afwijking van [de artikelen 20a][ref2] en [26][ref3], de verschuldigde belasting over de uitkering
      onderscheidenlijk het bedrag dat zou moeten worden uitgekeerd, gesteld op de som van de belasting en de
      premie ingevolge de [Algemene Ouderdomswet][ref4] die daarover verschuldigd zou zijn door een persoon die wel
      premieplichtig is ingevolge die wet en overigens in dezelfde omstandigheden verkeert als de werknemer. Ten aanzien
      van de werknemer die wel premieplichtig is voor de [Algemene Ouderdomswet][ref5] is met betrekking tot de in
      [de vorige volzin][ref6] genoemde uitkeringen of bedragen [artikel 26][ref7] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel20a
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0002221
      [ref5]: https://wetten.overheid.nl/BWBR0002221
      [ref6]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
      [ref7]: https://wetten.overheid.nl/BWBR0002471#Artikel26
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 20a
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0002471
        artikel: '26'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0002221
      - id: ref5
        bwb_id: BWBR0002221
      - id: ref6
        bwb_id: BWBR0002471
        artikel: 18a
        hoofdstuk: IIB
      - id: ref7
        bwb_id: BWBR0002471
        artikel: '26'
        hoofdstuk: III
  - number: 18a.10
    text: |-
      Ingeval de werknemer voor het tijdstip van ingang van het ouderdomspensioen ophoudt binnenlands belastingplichtige
      te zijn, wordt in het negende lid voor het tijdstip onmiddellijk voorafgaand aan het tijdstip van ingang van
      het pensioen steeds gelezen: het tijdstip onmiddellijk voorafgaand aan het tijdstip waarop de werknemer ophoudt
      binnenlands belastingplichtige te zijn.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18a
  - number: 18b.1
    text: |-
      Een op een eindloonstelsel gebaseerd nabestaandenpensioen bedraagt per dienstjaar of ontbrekend dienstjaar niet
      meer dan 1,4 percent van het pensioengevend loon of bereikbare pensioengevend loon.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18b
  - number: 18b.2
    text: |-
      Een op een middelloonstelsel gebaseerd nabestaandenpensioen bedraagt per dienstjaar niet meer dan 1,58 percent van
      het pensioengevend loon of bereikbaar pensioengevend loon.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18b
  - number: 18b.3
    text: |-
      Voor een op een beschikbare-premiestelsel gebaseerd nabestaandenpensioen is [artikel 18a, derde lid][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18a
        hoofdstuk: IIB
  - number: 18b.4
    text: 'Ingeval in de pensioenregeling is rekening gehouden met:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18b
  - number: 18b.4.1°
    text: een bepaalde nabestaande, wordt gerekend met de feitelijke gegevens van die nabestaande;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18b
  - number: 18b.4.2°
    text: |-
      een onbepaalde nabestaande, wordt gerekend met een leeftijdsverschil tussen de werknemer en de nabestaande van ten
      hoogste drie jaren.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18b
  - number: 18b.5
    text: |-
      Voor de toepassing van dit artikel en van artikel 18c worden voor het geval de werknemer niet in leven is op het
      tijdstip waarop het ouderdomspensioen zou ingaan, ontbrekende dienstjaren en bereikbaar pensioengevend loon in
      aanmerking genomen. Onder ontbrekende dienstjaren worden verstaan de jaren van het tijdstip van overlijden van
      de werknemer tot de in de pensioenregeling vastgestelde ingangsdatum. Onder bereikbaar pensioengevend loon wordt
      verstaan het pensioengevend loon dat de gewezen werknemer binnen de vastgestelde loopbaanontwikkeling in zijn
      functie zou hebben kunnen bereiken.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18b
  - number: 18b.6
    text: |-
      Een nabestaandenpensioen gaat in onmiddellijk na het overlijden van de werknemer of gewezen werknemer dan wel
      onmiddellijk na beëindiging van een uitkering ingevolge de [Algemene nabestaandenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: 18b.7
    text: |-
      Een nabestaandenpensioen gaat niet uit boven 70 percent van het pensioengevend loon of het bereikbaar
      pensioengevend loon op het tijdstip van ingang.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18b
  - number: 18b.8
    text: |-
      Voor de toepassing van het zevende lid is [artikel 18a, negende lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18a
        hoofdstuk: IIB
  - number: 18c.1
    text: |-
      Een op een eindloonstelsel gebaseerd wezenpensioen bedraagt per dienstjaar of ontbrekend dienstjaar niet meer dan
      0,28 percent van het pensioengevend loon of bereikbaar pensioengevend loon.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18c
  - number: 18c.2
    text: |-
      Een op een middelloonstelsel gebaseerd wezenpensioen bedraagt per dienstjaar niet meer dan 0,32 percent van het
      pensioengevend loon of bereikbaar pensioengevend loon.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18c
  - number: 18c.3
    text: |-
      Voor een op een beschikbare-premiestelsel gebaseerd wezenpensioen is [artikel 18a, derde lid][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18a
        hoofdstuk: IIB
  - number: 18c.4
    text: |-
      Een wezenpensioen gaat in onmiddellijk na het overlijden van de werknemer of gewezen werknemer dan wel direct na
      beëindiging van een uitkering ingevolge de [Algemene nabestaandenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18c
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: 18c.5
    text: |-
      Een wezenpensioen gaat op het tijdstip van ingang niet uit boven 14 percent van het pensioengevend loon of
      bereikbaar pensioengevend loon.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18c
  - number: 18c.6
    text: Voor volle wezen worden de in de vorige leden genoemde percentages verdubbeld.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18c
  - number: 18c.7
    text: |-
      Voor de toepassing van het vijfde en het zesde lid is [artikel 18a, negende lid][ref1], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18a
        hoofdstuk: IIB
  - number: 18d.1
    text: |-
      In afwijking in zoverre van [de artikelen 18a][ref1], [18b][ref2] en [18c][ref3] kunnen een ouderdomspensioen, een
      nabestaandenpensioen en een wezenpensioen meer bedragen dan de aldaar opgenomen maxima voor zover zulks het gevolg
      is van:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel18b
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel18c
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18d
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18a
        hoofdstuk: IIB
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 18b
        hoofdstuk: IIB
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 18c
        hoofdstuk: IIB
  - number: 18d.1.a
    text: aanpassing van het pensioen aan loon- of prijsontwikkeling;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18d
  - number: 18d.1.b
    text: |-
      variatie in de hoogte van de uitkeringen waarbij de laagste uitkering niet minder bedraagt dan 75 percent van de
      hoogste uitkering en de mate van variatie ten laatste op de ingangsdatum van het pensioen wordt vastgesteld;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18d
  - number: 18d.1.c
    text: waardeoverdracht van pensioenaanspraken;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18d
  - number: 18d.1.d
    text: |-
      gehele of gedeeltelijke onderlinge ruil van nabestaandenpensioen, wezenpensioen en ouderdomspensioen, mits de ruil
      uiterlijk op de ingangsdatum van het pensioen plaatsvindt op basis van algemeen aanvaarde actuariële grondslagen.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18d
  - number: 18d.2
    text: |-
      Door ruil als bedoeld in het eerste lid, onderdeel d, ontstane verlies aan pensioen kan niet worden gecompenseerd
      en het nabestaandenpensioen en het wezenpensioen kunnen na een zodanige ruil niet meer bedragen dan 70 percent
      onderscheidenlijk 14 percent of 28 percent van het pensioengevend loon. Zodanige ruil van nabestaandenpensioen en
      wezenpensioen kan niet plaatsvinden tot een hoger beloop dan 50 percent onderscheidenlijk 10 percent en 20 percent
      van het pensioengevend loon.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18d
  - number: 18e.1
    text: 'Een overbruggingspensioen is een pensioen dat:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18e
  - number: 18e.1.a
    text: |-
      ingaat op hetzelfde tijdstip als het ouderdomspensioen en uiterlijk eindigt bij het bereiken van de 65-jarige
      leeftijd, met dien verstande dat ingeval het overbruggingspensioen eerder ingaat dan bij het bereiken van de 60-
      jarige leeftijd, dit wordt herrekend ten opzichte van die leeftijd of van de in de pensioenregeling vastgestelde
      latere ingangsdatum met inachtneming van algemeen aanvaarde actuariële grondslagen, waarbij, zonodig in afwijking
      van de feitelijke situatie, kan worden uitgegaan van een pensioen dat op de voet van [onderdeel b][ref1] ten
      hoogste toelaatbaar is;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18e
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18e
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18e
        hoofdstuk: IIB
  - number: 18e.1.b
    text: |-
      per dienstjaar niet meer bedraagt dan 10 percent van het gezamenlijke bedrag van de uitkering ingevolge
      [artikel 9, eerste lid, onderdeel b, van de Algemene Ouderdomswet][ref1] en het verschil in verschuldigde
      premie voor de volksverzekeringen over het ouderdomspensioen voor en na de 65-jarige leeftijd, en in totaal
      niet meer bedraagt dan 100 percent van dat gezamenlijke bedrag, met dien verstande dat de opbouw van het
      overbruggingspensioen tijdsevenredig, direct voorafgaande aan de ingangsdatum van het ouderdomspensioen moet
      plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18e
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
  - number: 18e.2
    text: |-
      Ingeval het tijdstip van ingang van het ouderdomspensioen wordt uitgesteld kan het overbruggingspensioen worden
      omgezet in een hoger overbruggingspensioen tot ten hoogste hetgeen op de voet van het eerste lid, onderdeel b
      toelaatbaar is, en voor het overige in ouderdomspensioen of nabestaandenpensioen, met dien verstande dat na de
      omzetting het ouderdomspensioen en het nabestaandenpensioen niet meer kunnen bedragen dan onderscheidenlijk 100
      percent en 70 percent van het pensioengevend loon.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18e
  - number: 18e.3
    text: |-
      Voor de toepassing van het tweede lid is [artikel 18a, negende lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18e
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18a
        hoofdstuk: IIB
  - number: 18f
    text: 'Een nabestaandenoverbruggingspensioen is een pensioen dat:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18f
  - number: 18f.a
    text: |-
      ingaat onmiddellijk na het overlijden van de werknemer of gewezen werknemer dan wel onmiddellijk na beëindiging van
      het recht op een uitkering ingevolge de [Algemene nabestaandenwet][ref1] en uiterlijk eindigt bij het bereiken van
      de 65-jarige leeftijd;


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18f
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: 18f.b
    text: |-
      toekomt aan degene voor wie een regeling voor nabestaandenpensioen of wezenpensioen is getroffen of had kunnen
      worden getroffen;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18f
  - number: 18f.c
    text: |-
      niet meer bedraagt dan het gezamenlijke bedrag van 8/7 maal de nominale uitkering ingevolge de
      [Algemene nabestaandenwet][ref1], vermeerderd met de vakantie-uitkering, en het verschil in verschuldigde premie
      voor de volksverzekeringen over het nabestaandenpensioen voor en na de 65-jarige leeftijd.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18f
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: 18g.1
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de perioden die in aanmerking
      komen als dienstjaren dan wel diensttijd, bedoeld in [de artikelen 18a][ref1], [18b][ref2], [18c][ref3],
      [18e][ref4], [18i][ref5] en [38a][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel18b
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel18c
      [ref4]: https://wetten.overheid.nl/BWBR0002471#Artikel18e
      [ref5]: https://wetten.overheid.nl/BWBR0002471#Artikel18i
      [ref6]: https://wetten.overheid.nl/BWBR0002471#Artikel38a
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18g
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18a
        hoofdstuk: IIB
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 18b
        hoofdstuk: IIB
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 18c
        hoofdstuk: IIB
      - id: ref4
        bwb_id: BWBR0002471
        artikel: 18e
        hoofdstuk: IIB
      - id: ref5
        bwb_id: BWBR0002471
        artikel: 18i
        hoofdstuk: IIB
      - id: ref6
        bwb_id: BWBR0002471
        artikel: 38a
        hoofdstuk: VIII
  - number: 18g.2
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het pensioengevend loon, bedoeld
      in [de artikelen 18a][ref1], [18b][ref2], [18c][ref3], [18d][ref4], [18e][ref5] en [38a][ref6], ter zake van:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel18b
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel18c
      [ref4]: https://wetten.overheid.nl/BWBR0002471#Artikel18d
      [ref5]: https://wetten.overheid.nl/BWBR0002471#Artikel18e
      [ref6]: https://wetten.overheid.nl/BWBR0002471#Artikel38a
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18g
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18a
        hoofdstuk: IIB
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 18b
        hoofdstuk: IIB
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 18c
        hoofdstuk: IIB
      - id: ref4
        bwb_id: BWBR0002471
        artikel: 18d
        hoofdstuk: IIB
      - id: ref5
        bwb_id: BWBR0002471
        artikel: 18e
        hoofdstuk: IIB
      - id: ref6
        bwb_id: BWBR0002471
        artikel: 38a
        hoofdstuk: VIII
  - number: 18g.2.a
    text: de loonbestanddelen die daarin worden opgenomen;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18g
  - number: 18g.2.b
    text: |-
      de loonbestanddelen waarover de opbouw van het pensioen volgens een ander stelsel dan het eindloonstelsel dient
      plaats te vinden;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18g
  - number: 18g.2.c
    text: |-
      de situatie waarin de werknemer aan het eind van zijn loopbaan in deeltijd gaat werken dan wel terugtreedt naar een
      lager gekwalificeerde functie met een lager loon dan in zijn daaraan voorafgaande functie.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18g
  - number: 18h.1
    text: |-
      In afwijking in zoverre van het overigens in of krachtens dit hoofdstuk bepaalde is een regeling waarvan geheel
      of gedeeltelijk een lichaam als bedoeld in [artikel 19a, eerste lid, onderdeel d][ref1], als verzekeraar optreedt,
      een pensioenregeling indien zij voldoet aan [de artikelen 18][ref2] tot en met [18g][ref3] en voorts een pensioen
      inhoudt dat niet uitgaat boven hetgeen in collectieve regelingen gangbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel18g
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18h
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19a
        hoofdstuk: IIB
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '18'
        hoofdstuk: IIB
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 18g
        hoofdstuk: IIB
  - number: 18h.2
    text: |-
      Bij algemene maatregel van bestuur kan worden vastgesteld wat in collectieve regelingen als bedoeld in het
      eerste lid gangbaar is. In afwijking daarvan kan worden vastgesteld dat de opbouwmogelijkheid, aangegeven in
      [artikel 18a, eerste lid][ref1], onverkort van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18h
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18a
        hoofdstuk: IIB
  - number: 18i
    text: 'Onder regeling voor vervroegde uittreding wordt verstaan een regeling die:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18i
  - number: 18i.a
    text: |-
      voorziet in periodieke uitkeringen aan werknemers of gewezen werknemers die uiterlijk eindigen bij het bereiken van
      de leeftijd van 65 jaar of bij eerder overlijden;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18i
  - number: 18i.b
    text: |-
      een voorziening voor vervroegde uittreding inhoudt die niet uitgaat boven hetgeen naar maatschappelijke
      opvattingen, waaronder die ter zake van diensttijd en genoten beloning, redelijk moet worden geacht; en
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18i
  - number: 18i.c
    text: |-
      waarvan als verzekeraar optreedt een lichaam of natuurlijke persoon bedoeld in [artikel 19a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel18i
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19a
        hoofdstuk: IIB
  - number: '19'
    text: |-
      Met betrekking tot diensttijd waarin het loon nihil is of anderszins aanzienlijk lager is
      dan hetgeen gebruikelijk is, kunnen geen onderscheidenlijk in zoverre geen aanspraken op
      een pensioenregeling of op een regeling voor vervroegde uittreding ontstaan als bedoeld in
      [artikel 11, eerste lid, onderdeel c, onderscheidenlijk onderdeel d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '11'
        hoofdstuk: II
  - number: 19a.1
    text: |-
      Als verzekeraar van een pensioen of een voorziening voor vervroegde uittreding als bedoeld in
      [de artikelen 18][ref1] en [18i][ref2] kan optreden:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel18i
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '18'
        hoofdstuk: IIB
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 18i
        hoofdstuk: IIB
  - number: 19a.1.a
    text: |-
      een lichaam dat ingevolge [artikel 5, onderdeel ][ref1] is vrijgesteld van die belasting;


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel5
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '5'
  - number: 19a.1.b
    text: |-
      een verzekeraar die bevoegd is het directe verzekeringsbedrijf, bedoeld in de
      [Wet toezicht verzekeringsbedrijf 1993][ref1], uit te oefenen, mits deze de pensioenverplichting of de verplichting
      ingevolge de regeling voor vervroegde uittreding voor de heffing van de vennootschapsbelasting rekent tot het
      binnenlandse ondernemingsvermogen;


      [ref1]: https://wetten.overheid.nl/BWBR0006509
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0006509
  - number: 19a.1.c
    text: |-
      een niet in Nederland gevestigd pensioenfonds of lichaam dat het levensverzekeringsbedrijf uitoefent, mits het
      pensioen of de voorziening voor vervroegde uittreding de voortzetting is van een pensioen dat of een voorziening
      die reeds was verzekerd bij die verzekeraar in een periode waarin de werknemer of gewezen werknemer niet in
      Nederland woonde of niet in Nederland een dienstbetrekking vervulde;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel19a
  - number: 19a.1.d
    text: |-
      een ander lichaam dan bedoeld in [de onderdelen ][ref1], [][ref2] en [][ref3], dat in Nederland is gevestigd,
      de pensioenverplichting of de verplichting ingevolge de regeling voor vervroegde uittreding voor de heffing van
      de vennootschapsbelasting rekent tot het binnenlandse ondernemingsvermogen en voldoet aan de in het tweede lid
      gestelde voorwaarden;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19a
        hoofdstuk: IIB
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 19a
        hoofdstuk: IIB
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 19a
        hoofdstuk: IIB
  - number: 19a.1.e
    text: |-
      de natuurlijke persoon tot wie de werknemer in dienstbetrekking staat of heeft gestaan en die voldoet aan de in het
      tweede lid gestelde voorwaarden;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel19a
  - number: 19a.1.f
    text: |-
      een pensioenfonds of lichaam dat bevoegd het verzekeringsbedrijf uitoefent, anders dan bedoeld in
      [de onderdelen a][ref1], [b][ref2] en [c][ref3], dat door Onze Minister, onder door hem te stellen voorwaarden,
      is aangewezen en dat zich tegenover Onze Minister heeft verplicht:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19a
        hoofdstuk: IIB
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 19a
        hoofdstuk: IIB
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 19a
        hoofdstuk: IIB
  - number: 19a.1.f.1°
    text: |-
      te voldoen aan voorwaarden met betrekking tot het verschaffen van inlichtingen over de uitvoering van de regeling,
      en
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel19a
  - number: 19a.1.f.2°
    text: |-
      zekerheid te stellen voor de invordering van de belasting die is verschuldigd door
      toepassing van [artikel 19b](onbekend), ofwel [artikel 3.83, eerste of tweede lid][ref1], of
      [artikel 7.2, achtste lid, van de Wet inkomstenbelasting 2001][ref2], dan wel de werknemer of gewezen werknemer
      zich heeft verplicht deze zekerheid te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel7
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '7'
  - number: 19a.2
    text: |-
      Het lichaam of de natuurlijke persoon, bedoeld in het eerste lid, onderdelen *d* en *e*, kan
      slechts als verzekeraar van een pensioen optreden ter uitvoering van toezeggingen als bedoeld in
      [artikel 2, derde lid, van de Pensioen- en spaarfondsenwet][ref1] (*Stb.* 1981, 18) of van toezeggingen waarvoor
      ontheffing is verleend van artikel 2, eerste lid, van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel2
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: '2'
  - number: 19a.3
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de in het eerste lid, onderdeel f,
      bedoelde aanwijzing.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel19a
  - number: 19b.1
    text: 'Ingeval op enig tijdstip:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel19b
  - number: 19b.1.a
    text: |-
      een aanspraak ingevolge een pensioenregeling of een regeling voor vervroegde uittreding niet langer als zodanig is
      aan te merken;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel19b
  - number: 19b.1.b
    text: |-
      een aanspraak ingevolge een pensioenregeling of een regeling voor vervroegde uittreding wordt afgekocht of
      vervreemd dan wel formeel of feitelijk voorwerp van zekerheid, anders dan ten behoeve van uitstel van betaling op
      grond van [artikel 25, vijfde lid, van de Invorderingswet 1990][ref1], wordt;


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel19b
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
  - number: 19b.1.c
    text: |-
      een aanspraak ingevolge een pensioenregeling waarvan als verzekeraar optreedt een lichaam als bedoeld in
      [artikel 19a, eerste lid, onderdeel ][ref1], dan wel een lichaam als bedoeld in [artikel 36b][ref2], wordt
      prijsgegeven, behoudens voor zover de aanspraak niet voor verwezenlijking vatbaar is;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel36b
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel19b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19a
        hoofdstuk: IIB
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 36b
        hoofdstuk: VIII
  - number: 19b.1.d
    text: |-
      de zekerheidstelling wordt beëindigd door de werknemer of de gewezen werknemer die zich op grond van
      [artikel 19a, eerste lid, onderdeel f][ref1], heeft verplicht deze zekerheid te stellen;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel19b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19a
        hoofdstuk: IIB
  - number: 19b.2
    text: |-
      Ingeval een verplichting ingevolge een pensioenregeling of een regeling voor vervroegde uittreding geheel of
      gedeeltelijk overgaat op een andere verzekeraar wordt de aanspraak ingevolge die regeling geacht te worden
      afgekocht. De eerste volzin is niet van toepassing ingeval de verplichting ingevolge een pensioenregeling
      of een regeling voor vervroegde uittreding geheel of gedeeltelijk overgaat naar een verzekeraar bedoeld
      in [artikel 19a, eerste lid, onderdelen a, b, d, e of f][ref1], mits deze overgang niet in strijd komt met
      de bepalingen bij of krachtens de [artikelen 2][ref2], vierde lid, [32][ref3], [32a][ref4], [32b][ref5]
      of [32ba van de Pensioen- en spaarfondsenwet][ref6]. Met betrekking tot een verplichting die is verzekerd bij
      een lichaam of natuurlijk persoon als bedoeld in [artikel 19a, eerste lid, onderdelen d of e][ref7], wordt onder
      een overgang als bedoeld in [de eerste volzin][ref8] mede verstaan herverzekering bij een andere verzekeraar dan
      bedoeld in [artikel 19a, eerste lid, onderdelen a, b, d of f][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002089#Artikel32
      [ref4]: https://wetten.overheid.nl/BWBR0002089#Artikel32a
      [ref5]: https://wetten.overheid.nl/BWBR0002089#Artikel32b
      [ref6]: https://wetten.overheid.nl/BWBR0002089#Artikel32ba
      [ref7]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
      [ref8]: https://wetten.overheid.nl/BWBR0002471#Artikel19b
      [ref9]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel19b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19a
        hoofdstuk: IIB
      - id: ref2
        bwb_id: BWBR0002089
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0002089
        artikel: '32'
      - id: ref4
        bwb_id: BWBR0002089
        artikel: 32a
      - id: ref5
        bwb_id: BWBR0002089
        artikel: 32b
      - id: ref6
        bwb_id: BWBR0002089
        artikel: 32ba
      - id: ref7
        bwb_id: BWBR0002471
        artikel: 19a
        hoofdstuk: IIB
      - id: ref8
        bwb_id: BWBR0002471
        artikel: 19b
        hoofdstuk: IIB
      - id: ref9
        bwb_id: BWBR0002471
        artikel: 19a
        hoofdstuk: IIB
  - number: 19b.3
    text: |-
      Het eerste lid is niet van toepassing ingeval de werknemer of gewezen werknemer in het kader van scheiding van
      tafel en bed, echtscheiding of beëindiging van samenleving een aanspraak ingevolge een pensioenregeling of een
      regeling voor vervroegde uittreding geheel of gedeeltelijk vervreemdt aan zijn echtgenoot of gewezen echtgenoot
      onderscheidenlijk zijn partner of gewezen partner dan wel omzet in een zodanige aanspraak met als gerechtigde
      die echtgenoot of gewezen echtgenoot onderscheidenlijk zijn partner of gewezen partner, waarbij die verkregen of
      omgezette aanspraak voor de toepassing van deze wet wordt geacht de voortzetting te zijn van onderscheidenlijk de
      aanspraak op een pensioenregeling of de aanspraak op een regeling voor vervroegde uittreding van de werknemer of
      gewezen werknemer.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel19b
  - number: 19b.4
    text: |-
      Onze Minister kan, zo nodig onder door hem te stellen voorwaarden, bepalen dat het tweede lid, eerste volzin,
      niet van toepassing is indien de verplichting ingevolge een pensioenregeling of een regeling voor vervroegde
      uittreding overgaat op een niet in Nederland gevestigd pensioenfonds of lichaam dat het verzekeringsbedrijf
      uitoefent , anders dan bedoeld in [artikel 19a, eerste lid, onderdeel f][ref1], zulks ter verwerving van aanspraken
      ingevolge een pensioenregeling of een regeling voor vervroegde uittreding in het kader van de aanvaarding van een
      dienstbetrekking buiten Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel19b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19a
        hoofdstuk: IIB
  - number: 19b.5
    text: |-
      Voor de toepassing van het eerste lid, onderdeel a, wordt een aanspraak op een pensioenregeling of een regeling
      voor vervroegde uittreding mede niet langer als zodanig aangemerkt ingeval op enig tijdstip niet langer wordt
      voldaan aan de voorwaarden gesteld ingevolge het vierde lid of [artikel 19d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19d
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel19b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19d
        hoofdstuk: IIB
  - number: 19b.6
    text: |-
      De vorige leden zijn van overeenkomstige toepassing met betrekking tot aanspraken op periodieke uitkeringen,
      bedoeld in [artikel 11, eerste lid, onderdeel g][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel19b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '11'
        hoofdstuk: II
  - number: 19c.1
    text: |-
      Op verzoek van de inhoudingsplichtige beslist de inspecteur bij voor bezwaar vatbare beschikking of een regeling
      een pensioenregeling is in de zin van [de artikelen 18][ref1] tot en met 18h. Het verzoek wordt gedaan voordat de
      regeling dan wel een wijziging van de regeling wordt ingevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel19c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '18'
        hoofdstuk: IIB
  - number: 19c.2
    text: |-
      Indien een zodanig verzoek is gedaan en vervolgens onherroepelijk komt vast te staan dat de regeling niet een
      zodanige pensioenregeling is en de regeling – onverwijld en ingaand op het tijdstip van ingang van de regeling –
      wordt aangepast in dier voege dat de regeling wel een zodanige pensioenregeling is, wordt de regeling geacht met
      terugwerkende kracht tot uiterlijk dat tijdstip een zodanige pensioenregeling te zijn. De vorige volzin is niet van
      toepassing op pensioenregelingen als bedoeld in [artikel 18h][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18h
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel19c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18h
        hoofdstuk: IIB
  - number: 19c.3
    text: |-
      Het eerste en het tweede lid zijn van overeenkomstige toepassing op regelingen voor vervroegde uittreding als
      bedoeld in [artikel 18i][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18i
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel19c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18i
        hoofdstuk: IIB
  - number: 19d
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid, afwijkingen toestaan
      van het overigens in of krachtens dit hoofdstuk bepaalde door regelingen of groepen van regelingen, niet zijnde
      een regeling als bedoeld in [artikel 18h, eerste lid][ref1], aan te wijzen als pensioenregeling onderscheidenlijk
      regeling voor vervroegde uittreding indien het een regeling betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18h
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel19d
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18h
        hoofdstuk: IIB
  - number: 19d.a
    text: |-
      die op bepaalde onderdelen niet meer dan in geringe mate afwijkt van het overigens in of krachtens dit hoofdstuk
      bepaalde, mits het belang van de afwijkingen niet uitgaat boven het belang van de marges op andere onderdelen;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel19d
  - number: 19d.b
    text: |-
      voor gemoedsbezwaarden met een ontheffing als bedoeld in
      [artikel 19, tweede lid, van de Wet financiering volksverzekeringen][ref1], die dient ter vervanging van een
      pensioenregeling onderscheidenlijk een regeling voor vervroegde uittreding;


      [ref1]: https://wetten.overheid.nl/BWBR0004538#Artikel19
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel19d
    references:
      - id: ref1
        bwb_id: BWBR0004538
        artikel: '19'
  - number: 19d.c
    text: |-
      voor een tijdelijk in Nederland wonende of werkzame werknemer en die regeling voldoet aan
      [artikel 1.7, tweede lid, onderdeel c, van de Wet inkomstenbelasting 2001][ref1], mits de opbouw van het pensioen
      of de voorziening voor vervroegde uittreding ingevolge die regeling tijdelijk in Nederland wordt voortgezet en
      het pensioen of de voorziening voor vervroegde uittreding reeds was verzekerd bij een pensioenfonds of lichaam als
      bedoeld in [artikel 19a, eerste lid, onderdelen c of f][ref2], in een periode waarin de werknemer niet in Nederland
      woonde of niet in Nederland een dienstbetrekking vervulde.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel19d
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 19a
        hoofdstuk: IIB
  - number: 19e
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld ter zake van de instelling van een Adviescommissie
      fiscale behandeling pensioenen. De commissie adviseert over elementen van pensioenregelingen die weliswaar afwijken
      van het overigens in of krachtens dit hoofdstuk bepaalde maar niettemin van belang zijn voor een verdergaande
      flexibilisering van pensioenen, waarbij acht wordt geslagen op het beginsel van budgettaire neutraliteit.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel19e
  - number: 19f
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld ter bevordering van een goede uitvoering van dit hoofdstuk
      alsmede met betrekking tot samenloop van verschillende pensioenstelsels.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel19f
  - number: '20.1'
    text: |-
      De over een loontijdvak van een jaar verschuldigde belasting is het bedrag van de over het kalenderjaar berekende
      belasting op het belastbare loon verminderd met het bedrag van de heffingskorting voor de loonbelasting.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel20
  - number: '20.2'
    text: |-
      Het bedrag van de heffingskorting voor de loonbelasting bedraagt maximaal het bedrag van de verschuldigde belasting
      over het loontijdvak van een jaar.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel20
  - number: 20a.1
    text: |-
      De belasting over een loontijdvak van een jaar wordt bepaald aan de hand van de navolgende tabel (tarieftabel).








                    Bij een belastbaar inkomen uit werk en woning van




                    meer dan


                    maar niet meer dan


                    bedraagt de belasting het in kolom III vermelde bedrag, vermeerderd met het bedrag dat wordt berekend
      door het in kolom IV vermelde percentage te nemen van het gedeelte van het belastbare inkomen uit werk en woning
      dat het in kolom I vermelde bedrag te boven gaat




                    I


                    II


                    III


                    IV






                    –


                    € 16 265


                    –


                    1,00%




                    € 16 265


                    € 29 543


                    € 162


                    7,95%




                    € 29 543


                    € 50 652


                    € 1 217


                    42%




                    € 50 652


                    –


                    € 10 082


                    52%
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel20a
  - number: 20a.2
    text: |-
      De in het eerste lid vermelde bedragen worden bij het begin van het kalenderjaar van rechtswege vervangen door de
      bedragen die krachtens [artikel 10.1 van de Wet inkomstenbelasting 2001][ref1] worden vastgesteld ter vervanging
      van de in [artikel 2.10 van die wet][ref2] vermelde bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '2'
  - number: '21'
    text: |-
      In [dit hoofdstuk][ref1] en de daarop berustende bepalingen wordt verstaan onder:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002471
        hoofdstuk: III
  - number: 21.a
    text: |-
      belastingtarief eerste schijf: het in de eerste regel van de vierde kolom van de tabel in [artikel 20a][ref1]
      opgenomen percentage;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel20a
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 20a
        hoofdstuk: III
  - number: 21.b
    text: |-
      gecombineerd heffingspercentage: de som van het belastingtarief eerste schijf, het volgens
      [artikel 10a, tweede lid, van de Wet financiering volksverzekeringen][ref1] vastgestelde premiepercentage voor
      de algemene ouderdomsverzekering en de volgens [artikel 11 van de Wet financiering volksverzekeringen][ref2]
      vastgestelde premiepercentages voor de nabestaandenverzekering en de algemene verzekering bijzondere ziektekosten.


      [ref1]: https://wetten.overheid.nl/BWBR0004538#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0004538#Artikel11
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004538
        artikel: 10a
      - id: ref2
        bwb_id: BWBR0004538
        artikel: '11'
  - number: 21a
    text: |-
      De heffingskorting voor de loonbelasting is het deel van de standaardloonheffingskorting dat tot de
      standaardloonheffingskorting in dezelfde verhouding staat als het belastingtarief eerste schijf staat tot het
      gecombineerde heffingspercentage.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel21a
  - number: 21b
    text: |-
      Bij de toepassing van artikel 21a op het deel van de standaardloonheffingskorting dat op de ouderenkorting of de
      aanvullende ouderenkorting betrekking heeft, wordt het gecombineerde heffingspercentage verminderd met het volgens
      [artikel 10a, tweede lid, van de Wet financiering volksverzekeringen][ref1] voor de algemene ouderdomsverzekering
      vastgestelde premiepercentage.


      [ref1]: https://wetten.overheid.nl/BWBR0004538#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel21b
    references:
      - id: ref1
        bwb_id: BWBR0004538
        artikel: 10a
  - number: 21c
    text: 'De standaardloonheffingskorting is het gezamenlijke bedrag van:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel21c
  - number: 21c.a
    text: |-
      de algemene heffingskorting ([artikel 22][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel22
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel21c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '22'
        hoofdstuk: III
  - number: 21c.b
    text: |-
      de arbeidskorting ([artikel 22a][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel22a
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel21c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 22a
        hoofdstuk: III
  - number: 21c.c
    text: |-
      de jonggehandicaptenkorting ([artikel 22aa][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel22aa
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel21c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 22aa
        hoofdstuk: III
  - number: 21c.d
    text: |-
      de ouderenkorting ([artikel 22b][ref1]) en


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel22b
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel21c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 22b
        hoofdstuk: III
  - number: 21c.e
    text: |-
      de aanvullende ouderenkorting ([artikel 22c][ref1]).


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel22c
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel21c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 22c
        hoofdstuk: III
  - number: '22.1'
    text: Voor de werknemer is de algemene heffingskorting van toepassing.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel22
  - number: '22.2'
    text: De algemene heffingskorting bedraagt € 1825.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel22
  - number: 22a.1
    text: Voor de werknemer die loon uit tegenwoordige arbeid geniet, is de arbeidskorting van toepassing.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel22a
  - number: 22a.2
    text: 'De arbeidskorting wordt berekend over het loon uit tegenwoordige arbeid en bedraagt de som van:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel22a
  - number: 22a.2.a
    text: 1,753% van dat loon met een maximum van € 142; en
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel22a
  - number: 22a.2.b
    text: |-
      11,213% van dat loon voorzover dit bij een tijdvakloon op jaarbasis meer is dan € 8101. De arbeidskorting bedraagt
      maximaal € 1213.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel22a
  - number: 22a.3
    text: 'In afwijking van het tweede lid, wordt:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel22a
  - number: 22a.3.a
    text: |-
      ingeval de werknemer bij het begin van het kalenderjaar de leeftijd van 57 jaar heeft bereikt maar nog niet de
      leeftijd van 60, het percentage, bedoeld in het tweede lid, onderdeel b, vervangen door 13,737% en het bedrag,
      bedoeld in het tweede lid, tweede volzin, vervangen door € 1454;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel22a
  - number: 22a.3.b
    text: |-
      ingeval de werknemer bij het begin van het kalenderjaar de leeftijd van 60 jaar heeft bereikt maar nog niet de
      leeftijd van 62, het percentage, bedoeld in het tweede lid, onderdeel b, vervangen door 16,250% en het bedrag,
      bedoeld in het tweede lid, tweede volzin, vervangen door € 1694;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel22a
  - number: 22a.3.c
    text: |-
      ingeval de werknemer bij het begin van het kalenderjaar de leeftijd van 62 jaar heeft bereikt, het percentage,
      bedoeld in het tweede lid, onderdeel b, vervangen door 18,773% en het bedrag, bedoeld in het tweede lid, tweede
      volzin, vervangen door € 1935.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel22a
  - number: 22a.4
    text: 'Met loon uit tegenwoordige arbeid worden gelijkgesteld:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel22a
  - number: 22a.4.a
    text: loon genoten wegens tijdelijke arbeidsongeschiktheid;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel22a
  - number: 22a.4.b
    text: |-
      uitkeringen op grond van de [Wet arbeid en zorg][ref1] en aanvullingen daarop door degene tot wie de
      belastingplichtige in dienstbetrekking staat.


      [ref1]: https://wetten.overheid.nl/BWBR0013008
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0013008
  - number: 22a.5
    text: 'Loon genoten wegens tijdelijke arbeidsongeschiktheid zijn niet uitkeringen op grond van:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel22a
  - number: 22a.5.a
    text: |-
      de [Wet op de arbeidsongeschiktheidsverzekering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: 22a.5.b
    text: |-
      de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008656
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0008656
  - number: 22a.5.c
    text: |-
      de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0008657
  - number: 22a.5.d
    text: |-
      buitenlandse arbeidsongeschiktheidsverzekeringen die naar aard en strekking overeenkomen met de regelingen die zijn
      vermeld in de onderdelen a, b en c.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel22a
  - number: 22aa.1
    text: |-
      Voor de werknemer die een uitkering geniet op grond van de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref1], is de jonggehandicaptenkorting van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel22aa
    references:
      - id: ref1
        bwb_id: BWBR0008657
  - number: 22aa.2
    text: De jonggehandicaptenkorting bedraagt € 531.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel22aa
  - number: 22b.1
    text: |-
      Voor de werknemer die de leeftijd van 65 jaar heeft bereikt en een tijdvakloon heeft dat op jaarbasis niet meer
      bedraagt dan € 30 303 is de ouderenkorting van toepassing.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel22b
  - number: 22b.2
    text: De ouderenkorting bedraagt € 418.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel22b
  - number: 22c.1
    text: |-
      Voor de werknemer op wie de ouderenkorting van toepassing is en die een uitkering als bedoeld in
      [artikel 9, eerste lid, onderdeel a of onderdeel c, van de Algemene Ouderdomswet][ref1] geniet, is de aanvullende
      ouderenkorting van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel22c
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
  - number: 22c.2
    text: De aanvullende ouderenkorting bedraagt € 248.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel22c
  - number: 22d
    text: |-
      De in [de artikelen 22][ref1], [22a][ref2], [22aa][ref3], [22b][ref4] en [22c][ref5] vermelde bedragen
      en de in [artikel 22a][ref6] vermelde percentages worden bij het begin van het kalenderjaar van
      rechtswege vervangen door de bedragen die, en het percentage dat, krachtens de [artikelen 10.1][ref7] en
      [10.7 van de Wet inkomstenbelasting 2001][ref8] worden vastgesteld ter vervanging van de in [artikelen 8.10][ref9],
      [8.11][ref10],[ 8.16a][ref11], [8.17][ref12] en [8.18 van die wet][ref13] vermelde bedragen en de in
      [artikel 8.11 van die wet][ref14] vermelde percentages.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel22
