  - number: 38b
    text: |-
      Voor op 1 juni 1999 bestaande pensioenregelingen die niet voldoen aan hoofdstuk IIB of [artikel 38a][ref1], blijven
      tot 1 juni 2004 [de artikelen 11][ref2], [11b][ref3], [11c][ref4] en [11d][ref5] zoals die luidden op 31 mei 1999
      van toepassing en zijn tot die datum hoofdstuk IIB en [artikel 38a][ref6] niet van toepassing, met dien verstande
      dat ingeval een pensioenregeling in die periode op meer dan ondergeschikte punten wordt gewijzigd, deze daarbij
      geheel in overeenstemming dient te worden gebracht met hoofdstuk IIB en [artikel 38a][ref7].


