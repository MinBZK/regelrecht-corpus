  - number: '23.1'
    text: |-
      Indien de werknemer over loontijdvakken die geheel of gedeeltelijk samenvallen loon geniet uit meer dan een
      dienstbetrekking of vroegere dienstbetrekking dan wel van meer dan een inhoudingsplichtige en dit loon voor de
      berekening van de belasting niet wordt samengevoegd, kan de werknemer de heffingskorting voor de loonbelasting
      slechts in een dienstbetrekking dan wel tegenover een inhoudingsplichtige geldend maken.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel23
  - number: '23.2'
    text: |-
      In afwijking van het eerste lid wordt het deel van de heffingskorting dat betrekking heeft op de
      jonggehandicaptenkorting geldend gemaakt tegenover de inhoudingsplichtige die de uitkering op grond van de Wet
      arbeidsongeschiktheidsvoorziening jonggehandicapten uitbetaalt.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel23
  - number: '24'
    text: |-
      Voor de toepassing van [de artikelen 21][ref1] tot en met [22d][ref2] ter bepaling van de hoogte van de
      heffingskorting is beslissend de toestand op het tijdstip waarop de belasting moet worden ingehouden, met dien
      verstande dat voor de ouderenkorting en de aanvullende ouderenkorting beslissend is de toestand aan het einde van
      de kalendermaand waarin de belasting moet worden ingehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel22d
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '21'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 22d
        hoofdstuk: III
  - number: '25.1'
    text: |-
      Loontijdvak is het tijdvak waarover het loon wordt genoten. Het bedrag van de belasting over een ander loontijdvak
      dan een jaar wordt door herleiding bepaald. Bij de herleiding wordt een jaar op 260 dagen, een maand op 65/3 dag,
      een week op 5 dagen en een tijdvak dat korter is dan een dag op een dag gesteld.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel25
  - number: '25.2'
    text: |-
      Bij ministeriële regeling kunnen loonbelastingtabellen worden vastgesteld voor loontijdvakken waarvoor Onze
      Minister dit nodig acht. In deze tabellen wordt de heffingskorting voor de loonbelasting op zodanige wijze
      verwerkt dat naast het bedrag aan loon het belastingbedrag of belastingpercentage is vermeld. In deze tabellen
      kan de verwerking van de heffingskorting geheel of ten dele achterwege worden gelaten en kan bij de verwerking
      van de heffingskorting rekening worden gehouden met algemeen voorkomende beloningen die worden belast volgens een
      tabel voor bijzondere beloningen als bedoeld in [artikel 26][ref1]. Bij het opstellen van deze tabellen kunnen
      loonklassen en afrondingen worden aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel26
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '26'
        hoofdstuk: III
  - number: '25.3'
    text: |-
      De loonbelastingtabellen worden vastgesteld op basis van de daarvoor benodigde gegevens zoals die vermoedelijk
      zullen luiden op het tijdstip van inwerkingtreding van de tabellen. Voorzover de toegepaste gegevens zodanig
      afwijken van de gegevens zoals die luiden op het tijdstip van inwerkingtreding dat bij toepassing van
      laatstbedoelde gegevens andere tabellen zouden zijn vastgesteld, worden bij ministeriële regeling nieuwe tabellen
      vastgesteld, ingaande ten hoogste zes maanden na het in de eerste volzin bedoelde tijdstip van inwerkingtreding,
      waarin de in de verstreken loontijdvakken ontstane afwijking zoveel mogelijk in de nog niet verstreken
      loontijdvakken van het kalenderjaar wordt ongedaan gemaakt.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel25
  - number: '25.4'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld volgens welke in afwijking van het eerste lid als
      loontijdvak wordt aangemerkt een tijdvak waarvan het tijdvak waarover het loon wordt genoten, deel uitmaakt.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel25
  - number: '26.1'
    text: |-
      Tantièmes, gratificaties en andere beloningen die in de regel slechts eenmaal of eenmaal per jaar worden
      toegekend, worden belast volgens loonbelastingtabellen voor bijzondere beloningen die bij ministeriële regeling
      worden vastgesteld met overeenkomstige toepassing van [artikel 25, tweede en derde lid][ref1], met dien verstande
      dat in deze tabellen jaarlonen en belastingpercentages worden opgenomen en geen rekening wordt gehouden met de
      arbeidskorting.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel25
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '25'
        hoofdstuk: III
  - number: '26.2'
    text: |-
      Indien dit niet tot een hoger belastingbedrag leidt, mogen de in het eerste lid bedoelde beloningen worden
      beschouwd als een toevoeging aan het loon over het loontijdvak waarin zij worden uitbetaald.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel26
  - number: '26.3'
    text: |-
      Overwerkloon mag worden belast naar het percentage dat wordt aangewezen door de loonbelastingtabel voor bijzondere
      beloningen.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel26
  - number: '26.4'
    text: |-
      Als jaarloon geldt voor de toepassing van [dit artikel][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel26
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '26'
        hoofdstuk: III
  - number: 26.4.a
    text: |-
      ingeval de werknemer over het gehele voorafgaande kalenderjaar van de inhoudingsplichtige loon heeft genoten: het
      in dat jaar genoten loon;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel26
  - number: 26.4.b
    text: |-
      ingeval de werknemer over een gedeelte van het voorafgaande kalenderjaar van de inhoudingsplichtige loon heeft
      genoten: het tot een jaarloon herleide bedrag van het in dat jaar genoten loon;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel26
  - number: 26.4.c
    text: |-
      in andere gevallen: het in het kalenderjaar te genieten loon, indien over het gehele jaar van de
      inhoudingsplichtige loon zou worden genoten.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel26
  - number: '26.5'
    text: |-
      Als overwerkloon gelden voor de toepassing van [dit artikel][ref1] de beloningen ter zake van arbeid welke wordt
      verricht gedurende de tijd die uitgaat boven de voor de werknemer geldende normale arbeidsduur.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel26
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '26'
        hoofdstuk: III
  - number: 26b
    text: |-
      In afwijking van [de artikelen 20][ref1], [20][ref2] en [26][ref3] bedraagt de belasting 52% van het loon ingeval
      de werknemer zijn naam, adres of woonplaats niet aan de inhoudingsplichtige heeft verstrekt dan wel, ingeval de
      werknemer loon uit tegenwoordige dienstbetrekking geniet, zijn identiteit niet is vastgesteld en opgenomen in de
      loonadministratie overeenkomstig [artikel 28, onderdeel ][ref4], alsmede ingeval de werknemer ter zake onjuiste
      gegevens heeft verstrekt en de inhoudingsplichtige dit weet of redelijkerwijs moet weten. Indien de belasting
      ingevolge [artikel 27, tweede lid][ref5], in één bedrag met de premie voor de volksverzekeringen wordt geheven,
      wordt in afwijking in zoverre van [de eerste volzin][ref6] het bedrag van de verschuldigde belasting te zamen met
      het bedrag van de verschuldigde premie voor de volksverzekeringen gesteld op 52% van het loon.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel20a
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0002471#Artikel28
      [ref5]: https://wetten.overheid.nl/BWBR0002471#Artikel27
      [ref6]: https://wetten.overheid.nl/BWBR0002471#Artikel26b
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel26b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '20'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 20a
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0002471
        artikel: '26'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0002471
        artikel: '28'
        hoofdstuk: IV
      - id: ref5
        bwb_id: BWBR0002471
        artikel: '27'
        hoofdstuk: IV
      - id: ref6
        bwb_id: BWBR0002471
        artikel: 26b
        hoofdstuk: III
  - number: '27.1'
    text: De belasting wordt geheven door inhouding op het loon.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel27
  - number: '27.2'
    text: |-
      Indien de werknemer ook premieplichtig is voor de volksverzekeringen geschiedt de inhouding van de belasting
      en de premie voor de volksverzekeringen in één bedrag dan wel in een percentage, met overeenkomstige toepassing
      van de regels die gelden voor de heffing en de invordering van de loonbelasting. Voor gevallen waarin
      [de vorige volzin][ref1] toepassing vindt, worden, met overeenkomstige toepassing van [artikel 25][ref2], bij
      ministeriële regeling tabellen vastgesteld waarin telkens de belasting en de premie voor de volksverzekeringen in
      één bedrag dan wel in één percentage worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel25
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '27'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '25'
        hoofdstuk: III
  - number: '27.3'
    text: De inhoudingsplichtige is verplicht de belasting in te houden op het tijdstip waarop het loon wordt genoten.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel27
  - number: '27.4'
    text: De inhouding vindt plaats volgens de op het tijdstip van inhouding voor de werknemer geldende loonbelastingtabel.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel27
  - number: '27.5'
    text: |-
      Bij ministeriële regeling worden voor daarbij aan te wijzen gevallen berekeningsvoorschriften vastgesteld aan de
      hand waarvan uit de in het tweede lid, tweede volzin, bedoelde tabellen het bedrag van de belasting wordt afgeleid.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel27
  - number: '27.6'
    text: |-
      Overtreft de belasting het van de inhoudingsplichtige genoten loon in geld, dan wordt het ontbrekende geacht
      te zijn ingehouden op het in het derde lid omschreven tijdstip, met dien verstande dat de inhoudingsplichtige
      bevoegd is dat ontbrekende te verhalen op de werknemer. Ingeval het tweede lid toepassing vindt, is
      [de vorige volzin][ref1] van overeenkomstige toepassing met betrekking tot het gezamenlijke bedrag van de belasting
      en de premie voor de volksverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel27
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '27'
        hoofdstuk: IV
  - number: '27.7'
    text: De inhoudingsplichtige is verplicht de in een tijdvak ingehouden belasting op aangifte af te dragen.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel27
  - number: '27.8'
    text: |-
      Indien het tweede lid en [artikel 67b][ref1], [67c][ref2] of [67f van de Algemene wet inzake rijksbelastingen][ref3]
      beide toepassing vinden, wordt respectievelijk artikel 67b, artikel 67c of artikel 67f van die wet eenmaal
      toegepast, met dien verstande dat in het tweede lid van artikel 67f van die wet voor «het bedrag van de belasting»
      wordt gelezen: het gezamenlijke bedrag van de belasting en de premie voor de volksverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67b
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel67c
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel67f
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 67b
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 67c
      - id: ref3
        bwb_id: BWBR0002320
        artikel: 67f
  - number: '28'
    text: 'De inhoudingsplichtige is gehouden volgens bij ministeriële regeling te stellen regels:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel28
  - number: 28.a
    text: |-
      van de werknemer opgave te verlangen van gegevens waarvan de kennisneming voor de heffing van de belasting van
      belang kan zijn;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel28
  - number: 28.b
    text: de in onderdeel *a* bedoelde gegevens door te geven aan een andere inhoudingsplichtige;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel28
  - number: 28.c
    text: |-
      een loonadministratie te voeren en daarbij de gegevens te administreren met betrekking tot de bij ministeriële
      regeling aan te wijzen uitkeringen, verstrekkingen en vergoedingen welke ingevolge [artikel 11][ref1] niet tot het
      loon behoren;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '11'
        hoofdstuk: II
  - number: 28.d
    text: |-
      aan de inspecteur opgave te verstrekken van het in een kalenderjaar door de werknemer genoten loon, van de
      ingehouden belasting en van andere gegevens welke van belang kunnen zijn voor de heffing van de inkomstenbelasting;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel28
  - number: 28.e
    text: |-
      aan de werknemer opgave te verstrekken van het in een kalenderjaar genoten loon, van de ingehouden belasting en van
      andere gegevens welke van belang kunnen zijn voor de heffing van de inkomstenbelasting;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel28
  - number: 28.f
    text: |-
      de identiteit van de loon uit tegenwoordige dienstbetrekking genietende werknemer vast te stellen aan de hand van
      een document als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref1] (*Stb.* 1993, 660), alsmede de
      aard, het nummer en een afschrift daarvan in de loonadministratie op te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '29.1'
    text: |-
      De werknemer is gehouden volgens bij ministeriële regeling te stellen regels aan de inhoudingsplichtige opgave te
      verstrekken van gegevens waarvan de kennisneming voor de heffing van de belasting van belang kan zijn en, ingeval
      de werknemer loon uit tegenwoordige dienstbetrekking geniet, een op hem betrekking hebbend document als bedoeld
      in [artikel 1 van de Wet op de identificatieplicht][ref1] ter inzage te verstrekken en een afschrift daarvan in de
      loonadministratie van de inhoudingsplichtige te laten opnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '29.2'
    text: |-
      De werknemer is echter niet gehouden opgave te verstrekken van gegevens met betrekking tot de heffingskorting.
      Indien de werknemer deze gegevens niet verstrekt, wordt met de heffingskorting geen rekening gehouden.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel29
  - number: '29.3'
    text: |-
      Tot de in het eerste lid en de in [artikel 28, onderdelen ][ref1], bedoelde gegevens wordt mede gerekend het
      sociaal-fiscaalnummer van de werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel28
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '28'
        hoofdstuk: IV
  - number: '29.4'
    text: |-
      Opgave van naam, adres en woonplaats van de werknemer alsmede van de overige in het eerste lid en in artikel
      28, onderdeel *a*, bedoelde gegevens geschiedt door middel van de door de inspecteur uitgereikte of toegezonden
      loonbelastingverklaring.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel29
  - number: '29.5'
    text: |-
      Met betrekking tot de verplichtingen, bedoeld in [de artikelen 28][ref1] en [29][ref2], blijven de
      [artikelen 47b, tweede lid][ref3], en [52a van de Algemene wet inzake rijksbelastingen][ref4] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel47b
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel52a
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '28'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '29'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0002320
        artikel: 47b
      - id: ref4
        bwb_id: BWBR0002320
        artikel: 52a
  - number: '30.1'
    text: |-
      Ieder is gehouden aan de inspecteur ter vaststelling van zijn identiteit indien zulks voor de
      heffing van de loonbelasting van belang kan zijn, desgevraagd terstond een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1] of een geldig rijbewijs dat is afgegeven op basis van de
      Wegenverkeerswet dan wel een geldig rijbewijs als bedoeld in [artikel 107 van de Wegenverkeerswet 1994][ref2] ter
      inzage te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel107
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '107'
  - number: '30.2'
    text: |-
      Voor een weigering om te voldoen aan de in het eerste lid omschreven verplichting kan niemand zich met vrucht
      beroepen op de omstandigheden dat hij uit enigerlei hoofde tot geheimhouding verplicht is, zelfs niet indien deze
      hem bij een wettelijke bepaling is opgelegd.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel30
  - number: '31.1'
    text: |-
      In afwijking in zoverre van het overigens bij of krachtens deze wet bepaalde, wordt de belasting over de
      in het tweede lid genoemde en bedoelde bestanddelen van het loon (eindheffingsbestanddelen) geheven van de
      inhoudingsplichtige naar het in het derde lid aangegeven tarief.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel31
  - number: '31.2'
    text: 'Eindheffingsbestanddelen zijn:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel31
  - number: 31.2.a
    text: |-
      bestanddelen van het loon waarover de verschuldigde belasting niet is betaald, in verband waarmee aan de
      inhoudingsplichtige een naheffingsaanslag wordt opgelegd, behoudens:
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel31
  - number: 31.2.a.1°
    text: |-
      voor zover de inhoudingsplichtige verzoekt, onder verstrekking van de daartoe noodzakelijke gegevens, met
      betrekking tot dat loon het eerste lid niet toe te passen;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel31
  - number: 31.2.a.2°
    text: |-
      voor zover de inspecteur bij voor bezwaar vatbare beschikking besluit, mede gelet op het aantal werknemers waarop
      de naheffingsaanslag betrekking heeft, met betrekking tot dat loon het eerste lid niet toe te passen omdat het wel
      toepassen daarvan zou kunnen leiden tot een zodanig grote afwijking van het belastbare inkomen in de zin van de
      inkomstenbelasting van een of meer werknemers dat voor hen aanzienlijke voordelen zouden kunnen ontstaan in het
      kader van de heffing van die belasting, van andere belastingen of in het kader van andere wettelijke regelingen;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel31
  - number: 31.2.b
    text: |-
      bij voor bezwaar vatbare beschikking door de inspecteur aangewezen bestanddelen van het loon met betrekking
      waartoe in verband met tijdelijke knelpunten van ernstige aard in redelijkheid niet kan worden gevergd dat
      de[ hoofdstukken I tot en met IV][ref1] ten volle worden toegepast;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#HoofdstukI
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002471
        hoofdstuk: I
  - number: 31.2.c
    text: |-
      bij ministeriële regeling aan te wijzen uitkeringen van publiekrechtelijke aard die buiten aanmerking worden
      gelaten in het kader van de heffing van andere belastingen of in het kader van andere wettelijke regelingen;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel31
  - number: 31.2.d
    text: |-
      bij ministeriële regeling aan te wijzen loon dat bezwaarlijk kan worden geïndividualiseerd, behoudens ingeval de
      inhoudingsplichtige verzoekt met betrekking tot dat loon het eerste lid niet toe te passen;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel31
  - number: 31.2.e
    text: bij ministeriële regeling aan te wijzen loon met een bestemmingskarakter;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel31
  - number: 31.2.f
    text: |-
      loon dat in geblokkeerde vorm wordt gespaard ingevolge een spaarloonregeling tot ten hoogste € 613 per
      kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel31
  - number: 31.2.g
    text: |-
      eenmaal per jaar een geschenk in natura ter gelegenheid van een algemeen erkende feestdag of het Sint-
      Nicolaasfeest, voor zover de waarde in het economische verkeer daarvan niet meer bedraagt dan € 35.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel31
  - number: '31.3'
    text: 'Het bedrag van de verschuldigde belasting wordt bepaald:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel31
  - number: 31.3.a
    text: 'aan de hand van het tabeltarief met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel31
  - number: 31.3.a.1°
    text: aan naheffing onderworpen eindheffingsbestanddelen als bedoeld in het tweede lid, onderdeel *a*;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel31
  - number: 31.3.a.2°
    text: eindheffingsbestanddelen bij tijdelijke knelpunten van ernstige aard als bedoeld in het tweede lid, onderdeel *b*;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel31
  - number: 31.3.a.3°
    text: aangewezen uitkeringen van publiekrechtelijke aard als bedoeld in het tweede lid, onderdeel *c*;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel31
  - number: 31.3.a.4°
    text: |-
      aangewezen eindheffingsbestanddelen als bedoeld in het tweede lid, onderdeel *d*, voor zover, te bepalen bij
      ministeriële regeling, de verwerving van het loon niet het gebruik of verbruik daarvan meebrengt;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel31
  - number: 31.3.b
    text: 'aan de hand van het enkelvoudige tarief met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel31
  - number: 31.3.b.1°
    text: |-
      aangewezen niet in geld genoten eindheffingsbestanddelen als bedoeld in het tweede lid, onderdeel *d*, andere dan
      bedoeld in onderdeel *a*, onder 4°;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel31
  - number: 31.3.b.2°
    text: aangewezen eindheffingsbestanddelen met een bestemmingskarakter als bedoeld in het tweede lid, onderdeel *e*;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel31
  - number: 31.3.c
    text: |-
      naar een tarief van 15 percent met betrekking tot spaarloon als bedoeld in het tweede lid, onderdeel f alsmede met
      betrekking tot geschenken in natura, als bedoeld in het tweede lid, onderdeel g.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel31
  - number: '31.4'
    text: |-
      Ingeval het tabeltarief van toepassing is wordt het bedrag van de verschuldigde belasting bepaald aan de hand
      van de voor het tijdvak waarin het loon is genoten geldende in [artikel 20a, eerste lid][ref1], opgenomen tabel,
      waarbij wordt aangenomen dat de inhoudingsplichtige de belasting en de bij reguliere betaling van het loon
      verschuldigde premie ingevolge de [Ziekenfondswet][ref2] alsmede de daarover verschuldigde premie ingevolge de
      [Werkloosheidswet][ref3] aanstonds voor zijn rekening heeft genomen. Voor zover bij naheffing als bedoeld in het
      derde lid, onderdeel *a*, aannemelijk is dat de inhoudingsplichtige de belasting en premie pas later voor zijn
      rekening heeft genomen, wordt in zoverre van de eerste volzin afgeweken en wordt het voor de werknemer ontstane
      voordeel in de eindheffing betrokken naar de situatie ten tijde van het voor rekening van de inhoudingsplichtige
      nemen, doch uiterlijk ten tijde van de naheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel20a
      [ref2]: https://wetten.overheid.nl/BWBR0002460
      [ref3]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 20a
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002460
      - id: ref3
        bwb_id: BWBR0004045
  - number: '31.5'
    text: |-
      Ingeval het enkelvoudige tarief van toepassing is wordt het bedrag van de verschuldigde belasting bepaald aan de
      hand van de voor het tijdvak waarin het loon is genoten geldende in [artikel 20][ref1], opgenomen tabel, waarbij
      buiten beschouwing wordt gelaten dat de belasting wordt geheven van de inhoudingsplichtige.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel20a
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 20a
        hoofdstuk: III
  - number: '31.6'
    text: |-
      Voor de bepaling van de verschuldigde belasting op de voet van het enkelvoudige tarief wordt, voor
      zover [artikel 13, tweede lid][ref1], geen toepassing heeft gevonden, in afwijking in zoverre van
      [artikel 13, eerste lid][ref2], niet in geld genoten loon in aanmerking genomen naar de waarde welke daaraan in het
      economische verkeer kan worden toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel13
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '13'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '13'
        hoofdstuk: II
  - number: '31.7'
    text: |-
      Voor de bepaling van de verschuldigde belasting op de voet van het derde lid, onderdeel *c*, wordt buiten
      beschouwing gelaten dat de belasting wordt geheven van de inhoudingsplichtige.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel31
  - number: '31.8'
    text: |-
      Ingeval loon als bedoeld in het tweede lid, onderdeel f, wordt genoten in de vorm van aandelenoptierechten als
      bedoeld in [artikel 10a, zesde lid][ref1], of in de vorm van aandelen in het kapitaal van de inhoudingsplichtige
      of in dat van een met hem verbonden vennootschap, wordt het bedrag genoemd in bedoeld onderdeel f verhoogd. De
      verhoging bedraagt het in het tweede lid, onderdeel f, genoemde bedrag voor de toepassing van de eerste volzin,
      verminderd met het niet in de vorm van aandelenoptierechten of in de vorm van aandelen in het kapitaal van de
      inhoudingsplichtige of in dat van een met hem verbonden vennootschap, gespaarde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 10a
        hoofdstuk: II
  - number: '31.9'
    text: |-
      De heffing over eindheffingsbestanddelen, met uitzondering van de aan naheffing onderworpen
      eindheffingsbestanddelen als bedoeld in het tweede lid, onderdeel *a*, geschiedt als ware de door de
      inhoudingsplichtige in een tijdvak verschuldigde belasting door hem op aangifte af te dragen belasting.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel31
  - number: '32.1'
    text: |-
      Onder spaarloonregeling wordt verstaan een schriftelijke regeling – niet zijnde een pensioenregeling – die voorziet
      in sparen van loon (spaarloon) dat gedurende ten minste vier jaar niet ter beschikking van de werknemer komt,
      tenzij het spaarloon wordt opgenomen ter zake van de verwerving van diens eigen woning als hoofdverblijf, de aankoop
      van effecten, de voldoening van premies voor lijfrenten als bedoeld in de [artikelen 3.124, onderdeel b][ref1]
      en [3.125, eerste lid, onderdelen a, c en d, van de Wet inkomstenbelasting 2001][ref2] en de voldoening van
      premies ingevolge bij ministeriële regeling aan te wijzen overeenkomsten van levensverzekering waarbij een
      kapitaalsuitkering is verzekerd, de door de werknemer vrijwillig betaalde premies ingevolge een pensioenregeling,
      de start van een voor eigen rekening gedreven onderneming, de opname van verlof, de financiering van
      scholingsuitgaven als bedoeld in [artikel 6.27 van de Wet inkomstenbelasting 2001][ref3] of bij beëindiging
      van diens dienstbetrekking. Ingeval het spaarloon door de werknemer is opgenomen bij beëindiging van diens
      dienstbetrekking, wordt voor elke maand gedurende welke het spaarloon voortijdig is opgenomen belasting geheven van
      de werknemer ter zake van een evenredig deel van het spaarloon.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '6'
  - number: '32.2'
    text: |-
      Om als spaarloonregeling te worden aangemerkt, dient de deelname daaraan open te staan voor ten minste driekwart
      van de werknemers van de inhoudingsplichtige.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel32
  - number: '32.3'
    text: 'Bij of krachtens ministeriële regeling kunnen:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel32
  - number: 32.3.a
    text: |-
      regelingen als spaarloonregeling worden aangewezen indien zij niet geheel voldoen aan de in of krachtens dit
      artikel gestelde vereisten;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel32
  - number: 32.3.b
    text: |-
      regelingen als spaarloonregeling worden uitgesloten indien zij niet dienstbaar zijn aan de bevordering van duurzaam
      bezit van werknemers in voldoend brede kring of bij herhaling niet worden nageleefd, alsmede ingeval ter zake van
      de uitvoering geen administratie wordt gevoerd waaruit duidelijk blijkt dat aan de gestelde vereisten is voldaan;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel32
  - number: 32.3.c
    text: |-
      regelen worden gesteld ter verzekering van het heffen van belasting over uitbetalingen welke in afwijking van de
      spaarloonregeling aan de werknemer worden gedaan.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel32
  - number: '32.4'
    text: Bij ministeriële regeling kunnen nadere regelen worden gesteld met betrekking tot het bepaalde in dit artikel.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel32
  - number: 32a.1
    text: |-
      Voor de toepassing van [artikel 31, vierde en vijfde lid][ref1], worden bij ministeriële regeling regels gesteld
      voor het bepalen van het op de eindheffingsbestanddelen toe te passen tarief. Daarbij kunnen de gevolgen van
      het passeren van tariefschijfgrenzen en maximum premielonen buiten beschouwing blijven en kunnen voorts de
      noodzakelijke afrondingen en vereenvoudigingen worden toegepast. Indien ingevolge de [Werkloosheidswet][ref2]
      premie is verschuldigd waarvan het percentage per bedrijfstak verschilt, wordt het percentage in aanmerking genomen
      dat wordt vastgesteld krachtens [artikel 9, vierde lid, van de Algemene Ouderdomswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel9
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '31'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004045
      - id: ref3
        bwb_id: BWBR0002221
        artikel: '9'
  - number: 32a.2
    text: |-
      Voor gevallen waarin tevens [artikel 27, tweede lid][ref1], van toepassing is worden in de in het eerste lid
      bedoelde ministeriële regeling, met overeenkomstige toepassing van [artikel 31, vierde en vijfde lid][ref2], tevens
      regels gesteld volgens welke telkens de belasting en de premie voor de volksverzekeringen in één bedrag dan wel in
      één percentage kunnen worden afgeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '27'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '31'
        hoofdstuk: V
  - number: 32b
    text: |-
      Ter bevordering van een goede uitvoering van dit hoofdstuk kunnen bij ministeriële regeling nadere, zonodig
      afwijkende regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel32b
  - number: '33.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor bepaalde groepen van werknemers nadere, zo nodig
      afwijkende, regelen worden gesteld inzake de heffing van de belasting, alsmede andere in het kader der wet passende
      nadere regelen worden gegeven ter aanvulling van in de wet geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel33
  - number: '33.2'
    text: 'Bij ministeriële regeling kunnen aanvullende regels worden gesteld betreffende:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel33
  - number: 33.2.a
    text: |-
      de heffing van de belasting ingeval loon van meer dan één inhoudingsplichtige of mede loon van een derde, dan wel
      over enig tijdvak meer dan één beloning wordt genoten;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel33
  - number: 33.2.b
    text: inhouding van geschatte bedragen, gevolgd door periodieke afrekening.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel33
  - number: '34'
    text: |-
      Ter vergemakkelijking van de heffing van de inkomstenbelasting kunnen bij algemene maatregel van bestuur regels
      worden gesteld ingevolge welke de loonbelasting mede wordt geheven van natuurlijke personen die:
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel34
  - number: 34.a
    text: termijnen van lijfrente of andere periodieke uitkeringen of verstrekkingen genieten;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel34
  - number: 34.b
    text: uitkeringen genieten ter vervanging van gederfde of te derven periodieke uitkeringen of verstrekkingen.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel34
  - number: '35.1'
    text: Ten aanzien van een artiest of beroepssporter wordt de belasting geheven naar de gage.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35
  - number: '35.2'
    text: |-
      Gage is al hetgeen de artiest of beroepssporter als zodanig geniet. Tot de gage behoren kostenvergoedingen alsmede
      aanspraken om na verloop van tijd of onder een voorwaarde een of meer uitkeringen of verstrekkingen te ontvangen.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35
  - number: '35.3'
    text: 'Tot de gage behoren niet:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35
  - number: 35.3.a
    text: |-
      vergoedingen en verstrekkingen ter zake van consumpties en maaltijden die ingevolge
      [artikel 11, eerste lid, onderdeel a of onderdeel b][ref1], niet tot het loon zouden hebben behoord;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '11'
        hoofdstuk: II
  - number: 35.3.b
    text: |-
      vergoedingen die strekken tot bestrijding van reis- en verblijfkosten – andere dan kosten van eigen vervoer –
      ter behoorlijke vervulling van het optreden dan wel de sportbeoefening, mits de artiest of beroepssporter de
      bewijsstukken overhandigt aan de inhoudingsplichtige en deze de bewijsstukken administreert en voor controle
      beschikbaar houdt;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35
  - number: 35.3.c
    text: |-
      verstrekkingen die strekken tot voorkoming van reis- en verblijfkosten ter behoorlijke vervulling van het optreden
      dan wel de sportbeoefening;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35
  - number: 35.3.d
    text: |-
      aanspraken ingevolge de [Ziektewet][ref1], de [Wet arbeid en zorg][ref2], de
      [Wet op de arbeidsongeschiktheidsverzekering][ref3] en de[Werkloosheidswet][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0013008
      [ref3]: https://wetten.overheid.nl/BWBR0002524
      [ref4]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0013008
      - id: ref3
        bwb_id: BWBR0002524
      - id: ref4
        bwb_id: BWBR0004045
  - number: 35.3.e
    text: |-
      aanspraken, die naar aard en strekking overeenkomen met aanspraken als bedoeld in [onderdeel d][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel35
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '35'
        hoofdstuk: VII
  - number: 35.3.f
    text: aanspraken op uitkeringen wegens overlijden of invaliditeit ten gevolge van een ongeval en
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35
  - number: 35.3.g
    text: |-
      bedragen die worden ingehouden als premie ingevolge de [Werkloosheidswet][ref1] en als bijdrage voor aanspraken
      die naar aard en strekking overeenkomen met aanspraken bedoeld in [onderdeel e][ref2], alsmede bijdrage voor
      aanspraken, bedoeld in [onderdeel f][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel35
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '35'
        hoofdstuk: VII
      - id: ref3
        bwb_id: BWBR0002471
        artikel: '35'
        hoofdstuk: VII
  - number: '35.4'
    text: |-
      Tot de gage behoort mede niet het aan de artiest of beroepssporter toe te rekenen deel van hetgeen blijkens
      een beschikking van de inspecteur als een niet tot de gage behorende vergoeding kan worden aangemerkt
      (kostenvergoedingsbeschikking). De kostenvergoedingsbeschikking wordt op verzoek door de inspecteur verstrekt
      en is vatbaar voor bezwaar. Het verzoek wordt voor het optreden of de sportbeoefening gedaan door de artiest, de
      beroepssporter of de inhoudingsplichtige, dan wel uiterlijk een maand na het optreden of de sportbeoefening door
      de inhoudingsplichtige. Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de
      kostenvergoedingsbeschikking.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35
  - number: '35.5'
    text: |-
      Niet in geld genoten gage wordt in aanmerking genomen naar de waarde die daaraan in het economische verkeer kan
      worden toegekend.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35
  - number: '35.6'
    text: 'Gage wordt beschouwd te zijn genoten op het tijdstip:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35
  - number: 35.6.a
    text: |-
      waarop zij betaald of verrekend wordt, ter beschikking van de artiest of beroepssporter wordt gesteld of
      rentedragend wordt;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35
  - number: 35.6.b
    text: waarop zij vorderbaar en tevens inbaar wordt, of
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35
  - number: 35.6.c
    text: |-
      indien dat later is dan de tijdstippen, bedoeld in de [onderdelen a][ref1] en [b][ref2] en de inhoudingsplichtige
      een kostenvergoedingsbeschikking heeft aangevraagd: uiterlijk een maand na het optreden of de sportbeoefening.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel35
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '35'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '35'
        hoofdstuk: VII
  - number: 35a.1
    text: |-
      De verschuldigde belasting bedraagt een percentage, gelijk aan het gecombineerde heffingspercentage, bedoeld in
      [artikel 21, onderdeel b][ref1], van de gage. In afwijking van de vorige volzin bedraagt de belasting ten aanzien
      van de niet in Nederland wonende artiest of beroepssporter 20 percent van de gage.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel21
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '21'
        hoofdstuk: III
  - number: 35a.2
    text: |-
      Ten aanzien van niet in Nederland wonende beroepssporters kan bij algemene maatregel van bestuur, zo nodig
      onder voorwaarden, ten behoeve van uniforme heffing bij grensoverschrijdende evenementen het in het eerste lid
      genoemde percentage van 20 tijdelijk worden verlaagd, doch niet verder dan tot 15 percent. Een krachtens de eerste
      volzin vastgestelde algemene maatregel van bestuur wordt aan de beide kamers der Staten-Generaal overlegd. Hij
      treedt in werking op een tijdstip dat nadat vier weken na de overlegging zijn verstreken bij koninklijk besluit
      wordt vastgelegd, tenzij binnen die termijn door of namens een der kamers of door ten minste een vijfde van het
      grondwettelijk aantal leden van een der kamers de wens te kennen wordt gegeven dat het onderwerp van de algemene
      maatregel van bestuur bij wet wordt geregeld. In dat geval wordt een daartoe strekkend voorstel van wet zo spoedig
      mogelijk ingediend. Indien het voorstel van wet wordt ingetrokken of indien een van de beide Kamers van de Staten-
      Generaal besluit het voorstel niet aan te nemen, wordt de algemene maatregel van bestuur ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35a
  - number: 35a.3
    text: |-
      In afwijking van het eerste lid bedraagt de verschuldigde belasting 52 percent van de gage ingeval
      de artiest of beroepssporter zijn naam, adres of woonplaats niet aan de inhoudingsplichtige heeft
      verstrekt, dan wel zijn identiteit niet is vastgesteld en opgenomen in de loonadministratie overeenkomstig
      [artikel 35e, eerste lid, onderdeel f][ref1], alsmede ingeval de artiest of beroepssporter ter zake onjuiste
      gegevens heeft verstrekt en de inhoudingsplichtige dit weet of redelijkerwijs moet weten.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel35e
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 35e
        hoofdstuk: VII
  - number: 35b.1
    text: De belasting wordt geheven door inhouding op de gage.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35b
  - number: 35b.2
    text: |-
      Voorzover het optreden of de sportbeoefening is gebaseerd op een andere grond dan een overeenkomst van korte
      duur als bedoeld in [artikel 5a][ref1], wordt de belasting geheven bij wijze van inhouding door de artiest of de
      beroepssporter als ware hij de inhoudingsplichtige voor de door hem genoten gage. In dat geval wordt de artiest of
      beroepssporter beschouwd als inhoudingsplichtige.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel5a
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 5a
        hoofdstuk: I
  - number: 35b.3
    text: De inhoudingsplichtige is verplicht de belasting in te houden op het tijdstip waarop de gage wordt genoten.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35b
  - number: 35b.4
    text: De inhoudingsplichtige is verplicht de ingehouden belasting op aangifte af te dragen.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35b
  - number: 35b.5
    text: |-
      De inhoudingsplichtige die zekerheid wenst omtrent de vraag of op grond van een verdrag ter voorkoming van dubbele
      belasting of op grond van enige andere regel van interregionaal of internationaal recht geen loonbelasting behoort
      te worden ingehouden, kan een verzoek indienen bij de inspecteur. De inspecteur beslist op het verzoek bij voor
      bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35b
  - number: 35c
    text: |-
      Ten aanzien van een niet in Nederland wonende artiest of beroepssporter vindt geen heffing plaats indien het
      optreden of de sportbeoefening:
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35c
  - number: 35c.a
    text: |-
      is gebaseerd op een andere grond dan een overeenkomst van korte duur als bedoeld in [artikel 5a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel5a
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 5a
        hoofdstuk: I
  - number: 35c.b
    text: plaatsvindt op basis van wederkerigheid;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35c
  - number: 35c.c
    text: |-
      ter zake van het optreden of de sportbeoefening op basis van die wederkerigheid in het woonland van de artiest of
      beroepssporter overeenkomstige belastingheffing van de in Nederland wonende artiest of beroepssporter dan wel het
      in Nederland gevestigde gezelschap van artiesten of beroepssporters, evenmin plaatsvindt, en
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35c
  - number: 35c.d
    text: |-
      in relatie met het woonland van de artiest of beroepssporter geen regeling ter voorkoming van dubbele belasting van
      toepassing is dat voor de in Nederland wonende artiest of beroepssporter voorziet in vrijstelling van Nederlandse
      belasting voor voordelen uit persoonlijke werkzaamheden als zodanig in dat andere land.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35c
  - number: 35d.1
    text: |-
      De artiest of beroepssporter is gehouden volgens bij ministeriële regeling te stellen regels aan de
      inhoudingsplichtige:
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35d
  - number: 35d.1.a
    text: opgave te doen van gegevens waarvan de kennisneming voor de heffing van de belasting van belang kan zijn;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35d
  - number: 35d.1.b
    text: |-
      inzage te verlenen van een op hem betrekking hebbend document als bedoeld in artikel 1 van de Wet op de
      identificatieplicht om een afschrift daarvan in de loonadministratie van de inhoudingsplichtige te laten opnemen;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35d
  - number: 35d.1.c
    text: '- indien hij in Nederland woont – opgave te doen van zijn sociaal-fiscaalnummer.'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35d
  - number: 35d.2
    text: |-
      Opgave van naam, adres, woonplaats en – ingeval hij niet in Nederland woont – woonland en geboortedatum van de
      artiest of beroepssporter alsmede van de overige in [dit artikel][ref1] bedoelde gegevens geschiedt door middel van
      de door de inspecteur verstrekte gageverklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel35d
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35d
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 35d
        hoofdstuk: VII
  - number: 35d.3
    text: |-
      Met betrekking tot de in [dit artikel][ref1] bedoelde verplichtingen is
      [artikel 47b, tweede lid, van de Algemene wet inzake rijksbelastingen][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel35d
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel47b
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35d
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 35d
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 47b
  - number: 35e.1
    text: 'De inhoudingsplichtige is gehouden volgens bij ministeriële regeling te stellen regels:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35e
  - number: 35e.1.a
    text: |-
      van de artiest of beroepssporter opgave te verlangen van gegevens waarvan de kennisneming voor de heffing van de
      belasting van belang kan zijn;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35e
  - number: 35e.1.b
    text: van de in Nederland wonende artiest of beroepssporter opgave te verlangen van zijn sociaal-fiscaalnummer;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35e
  - number: 35e.1.c
    text: |-
      een loonadministratie te voeren en daarbij de gegevens te administreren met betrekking tot de gage en met
      betrekking tot vergoedingen en verstrekkingen die niet tot de gage behoren;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35e
  - number: 35e.1.d
    text: |-
      aan de inspecteur opgave te doen van de in een kalenderjaar door de artiest of beroepssporter genoten gage, van de
      ingehouden belasting en van andere gegevens die van belang kunnen zijn voor de heffing van de inkomstenbelasting;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35e
  - number: 35e.1.e
    text: |-
      aan de in Nederland wonende artiest of beroepssporter, alsmede, op diens verzoek, aan de niet in Nederland wonende
      artiest of beroepssporter, opgave te doen van de in een kalenderjaar genoten gage, van de ingehouden belasting en
      van andere gegevens die van belang kunnen zijn voor de heffing van de inkomstenbelasting;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35e
  - number: 35e.1.f
    text: |-
      de identiteit van de artiest of beroepssporter vast te stellen aan de hand van een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1], alsmede de aard, het nummer en een afschrift daarvan in de
      loonadministratie op te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35e
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 35e.2
    text: |-
      Met betrekking tot de in [dit artikel][ref1] bedoelde verplichtingen is
      [artikel 52a van de Algemene wet inzake rijksbelastingen][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel35e
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel52a
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35e
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 35e
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 52a
  - number: 35f
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor bepaalde groepen artiesten of beroepssporters nadere,
      zo nodig afwijkende, regelen worden gesteld inzake de heffing van de belasting, alsmede andere in het kader der wet
      passende nadere regelen worden gegeven ter aanvulling van in de wet geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35f
  - number: 35g.1
    text: Ten aanzien van een buitenlands gezelschap wordt de belasting geheven naar de gage.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35g
  - number: 35g.2
    text: |-
      Gage is al hetgeen het buitenlandse gezelschap ontvangt ter zake van het optreden of de sportbeoefening in
      Nederland. Tot de gage behoren kostenvergoedingen alsmede aanspraken om na verloop van tijd of onder een voorwaarde
      een of meer uitkeringen of verstrekkingen te ontvangen.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35g
  - number: 35g.3
    text: 'Tot de gage behoren niet:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35g
  - number: 35g.3.a
    text: |-
      vergoedingen en verstrekkingen ter zake van consumpties en maaltijden die ingevolge
      [artikel 11, eerste lid, onderdeel a of onderdeel b][ref1], niet tot het loon zouden hebben behoord;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35g
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '11'
        hoofdstuk: II
  - number: 35g.3.b
    text: |-
      vergoedingen die strekken tot bestrijding van reis- en verblijfkosten – andere dan kosten van eigen vervoer –
      ter behoorlijke vervulling van het optreden of de sportbeoefening, mits het gezelschap de bewijsstukken aan de
      inhoudingsplichtige doet toekomen en deze de bewijsstukken administreert en voor controle beschikbaar houdt;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35g
  - number: 35g.3.c
    text: |-
      verstrekkingen die strekken tot voorkoming van reis- en verblijfkosten ter behoorlijke vervulling van het optreden
      dan wel de sportbeoefening;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35g
  - number: 35g.3.d
    text: |-
      aanspraken ingevolge de [Ziektewet][ref1], de [Wet arbeid en zorg](onbekend), de
      [Wet op de arbeidsongeschiktheidsverzekering][ref2] en de [Werkloosheidswet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35g
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0002524
      - id: ref3
        bwb_id: BWBR0004045
  - number: 35g.3.e
    text: |-
      aanspraken, die naar aard en strekking overeenkomen met aanspraken als bedoeld in [onderdeel d][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel35g
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35g
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 35g
        hoofdstuk: VIIA
  - number: 35g.3.f
    text: aanspraken op uitkeringen wegens overlijden of invaliditeit ten gevolge van een ongeval en
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35g
  - number: 35g.3.g
    text: |-
      bedragen die worden ingehouden als premie ingevolge de [Werkloosheidswet][ref1] en als bijdrage voor aanspraken
      die naar aard en strekking overeenkomen met aanspraken bedoeld in [onderdeel e][ref2], alsmede bijdrage voor
      aanspraken, bedoeld in [onderdeel f][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel35g
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel35g
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35g
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 35g
        hoofdstuk: VIIA
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 35g
        hoofdstuk: VIIA
  - number: 35g.4
    text: |-
      Tot de gage behoort mede niet hetgeen blijkens een beschikking van de inspecteur als een niet tot de gage
      behorende vergoeding kan worden aangemerkt (kostenvergoedingsbeschikking). De kostenvergoedingsbeschikking wordt
      op verzoek door de inspecteur verstrekt en is vatbaar voor bezwaar. Het verzoek wordt voor het optreden of de
      sportbeoefening gedaan door het gezelschap of de inhoudingsplichtige, dan wel uiterlijk een maand na het optreden
      of de sportbeoefening door de inhoudingsplichtige. Bij algemene maatregel van bestuur worden nadere regels gesteld
      met betrekking tot de kostenvergoedingsbeschikking.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35g
  - number: 35g.5
    text: |-
      Niet in geld ontvangen gage wordt in aanmerking genomen naar de waarde die daaraan in het economische verkeer kan
      worden toegekend.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35g
  - number: 35g.6
    text: 'Gage wordt beschouwd te zijn ontvangen op het tijdstip:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35g
  - number: 35g.6.a
    text: waarop zij betaald of verrekend wordt, ter beschikking van het gezelschap wordt gesteld of rentedragend wordt;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35g
  - number: 35g.6.b
    text: waarop zij vorderbaar en tevens inbaar wordt, of
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35g
  - number: 35g.6.c
    text: |-
      indien dat later is dan de tijdstippen, bedoeld in [de onderdelen a][ref1] en [b][ref2] en de inhoudingsplichtige
      een kostenvergoedingsbeschikking heeft aangevraagd: uiterlijk een maand na het optreden of de sportbeoefening.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel35g
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel35g
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35g
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 35g
        hoofdstuk: VIIA
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 35g
        hoofdstuk: VIIA
  - number: 35h.1
    text: De verschuldigde belasting bedraagt 20 percent van de gage.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35h
  - number: 35h.2
    text: |-
      Ten aanzien van buitenlandse gezelschappen kan bij algemene maatregel van bestuur, zo nodig onder voorwaarden,
      ten behoeve van uniforme heffing bij grensoverschrijdende evenementen het in het eerste lid genoemde percentage
      van 20 tijdelijk worden verlaagd, doch niet verder dan tot 15 percent. Een krachtens de eerste volzin vastgestelde
      algemene maatregel van bestuur wordt aan de beide kamers der Staten-Generaal overlegd. Hij treedt in werking op
      een tijdstip dat nadat vier weken na de overlegging zijn verstreken bij koninklijk besluit wordt vastgelegd, tenzij
      binnen die termijn door of namens een der kamers of door ten minste een vijfde van het grondwettelijk aantal leden
      van een der kamers de wens te kennen wordt gegeven dat het onderwerp van de algemene maatregel van bestuur bij wet
      wordt geregeld. In dat geval wordt een daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend. Indien het
      voorstel van wet wordt ingetrokken of indien een van de beide Kamers van de Staten-Generaal besluit het voorstel
      niet aan te nemen, wordt de algemene maatregel van bestuur ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35h
  - number: 35h.3
    text: 'In afwijking van het eerste lid bedraagt de verschuldigde belasting 52 percent van de gage:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35h
  - number: 35h.3.a
    text: |-
      indien aan de inhoudingsplichtige de naam, het adres, de woonplaats, het woonland en de geboortedatum van de leider
      of vertegenwoordiger, alsmede de namen van de leden van het gezelschap niet zijn verstrekt;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35h
  - number: 35h.3.b
    text: |-
      indien ten aanzien van het merendeel van de leden geen afschrift van een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1] aan de inhoudingsplichtige is verstrekt of de
      identiteit niet is vastgesteld en opgenomen in de loonadministratie van de inhoudingsplichtige overeenkomstig
      [artikel 35m, onderdeel d][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel35m
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35h
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 35m
        hoofdstuk: VIIA
  - number: 35h.3.c
    text: |-
      indien het gezelschap terzake onjuiste gegevens heeft verstrekt en de inhoudingsplichtige dit weet of
      redelijkerwijs moet weten.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35h
  - number: 35i.1
    text: De belasting wordt geheven door inhouding op de gage.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35i
  - number: 35i.2
    text: |-
      Voorzover het optreden of de sportbeoefening is gebaseerd op een andere grond dan een overeenkomst van korte
      duur als bedoeld in [artikel 5b][ref1], wordt de belasting geheven bij wijze van inhouding door het buitenlandse
      gezelschap als ware het de inhoudingsplichtige voor de door hem ontvangen gage. In dat geval wordt het gezelschap
      beschouwd als inhoudingsplichtige.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel5b
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35i
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 5b
        hoofdstuk: I
  - number: 35i.3
    text: De inhoudingsplichtige is verplicht de belasting in te houden op het tijdstip waarop de gage wordt ontvangen.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35i
  - number: 35i.4
    text: De inhoudingsplichtige is verplicht de ingehouden belasting op aangifte af te dragen.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35i
  - number: 35i.5
    text: |-
      De inhoudingsplichtige die zekerheid wenst omtrent de vraag of op grond van een verdrag ter voorkoming van dubbele
      belasting of op grond van enige andere regel van interregionaal of internationaal recht geen loonbelasting behoort
      te worden ingehouden, kan een verzoek indienen bij de inspecteur. De inspecteur beslist op het verzoek bij voor
      bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35i
  - number: 35j
    text: 'Ten aanzien van een buitenlands gezelschap vindt geen heffing plaats indien het optreden of de sportbeoefening:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35j
  - number: 35j.a
    text: |-
      is gebaseerd op een andere grond dan een overeenkomst van korte duur als bedoeld in [artikel 5b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel5b
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35j
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 5b
        hoofdstuk: I
  - number: 35j.b
    text: plaatsvindt op basis van wederkerigheid;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35j
  - number: 35j.c
    text: |-
      ter zake van het optreden of de sportbeoefening op basis van die wederkerigheid in het land van vestiging van het
      buitenlandse gezelschap overeenkomstige belastingheffing van de in Nederland wonende artiesten of beroepssporters
      dan wel het in Nederland gevestigde gezelschap van artiesten of beroepssporters, evenmin plaatsvindt, en
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35j
  - number: 35j.d
    text: |-
      in relatie met het land van vestiging van het buitenlands gezelschap geen regeling ter voorkoming van dubbele
      belasting van toepassing is dat voor de in Nederland wonende artiest of beroepssporter voorziet in vrijstelling van
      Nederlandse belasting voor voordelen uit persoonlijke werkzaamheden als zodanig in dat andere land.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35j
  - number: 35k
    text: |-
      De leden van het buitenlandse gezelschap zijn gehouden volgens bij ministeriële regeling te stellen regels aan
      het gezelschap:
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35k
  - number: 35k.a
    text: opgave te doen van gegevens waarvan de kennisneming voor de heffing van de belasting van belang kan zijn;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35k
  - number: 35k.b
    text: |-
      inzage te verlenen van een op hen betrekking hebbend document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1], en een afschrift daarvan te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35k
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 35l.1
    text: 'Het buitenlandse gezelschap is gehouden volgens bij ministeriële regeling te stellen regels:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35l
  - number: 35l.1.a
    text: |-
      van de leden van het gezelschap opgave te verlangen van gegevens waarvan de kennisneming voor de heffing van de
      belasting van belang kan zijn;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35l
  - number: 35l.1.b
    text: |-
      de identiteit van de leden vast te stellen aan de hand van een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1] en een afschrift daarvan te verlangen;


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35l
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 35l.1.c
    text: |-
      aan de inhoudingsplichtige opgave te doen van gegevens waarvan de kennisneming voor de heffing van de belasting van
      belang kan zijn;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35l
  - number: 35l.1.d
    text: |-
      aan de inhoudingsplichtige ten aanzien van het merendeel van de leden inzage te verlenen van een document als
      bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref1] om een afschrift daarvan in de loonadministratie
      van de inhoudingsplichtige te laten opnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35l
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 35l.2
    text: |-
      Opgave van naam, adres, woonplaats, woonland en geboortedatum van de leider of vertegenwoordiger alsmede het aantal
      leden van het gezelschap, en opgave van de overige in [dit artikel][ref1] bedoelde gegevens geschiedt door middel
      van de door de inspecteur verstrekte gageverklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel35l
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35l
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 35l
        hoofdstuk: VIIA
  - number: 35m
    text: 'De inhoudingsplichtige is gehouden volgens bij ministeriële regeling te stellen regels:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35m
  - number: 35m.a
    text: |-
      van het buitenlandse gezelschap opgave te verlangen van gegevens waarvan de kennisneming voor de heffing van de
      belasting van belang kan zijn;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35m
  - number: 35m.b
    text: |-
      een loonadministratie te voeren en daarbij de gegevens te administreren met betrekking tot de gage en met
      betrekking tot vergoedingen en verstrekkingen die niet tot de gage behoren;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35m
  - number: 35m.c
    text: |-
      aan de inspecteur opgave te doen van de in een kalenderjaar door het gezelschap ontvangen gage, van de ingehouden
      belasting en van andere gegevens die van belang kunnen zijn voor de heffing van de inkomstenbelasting;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35m
  - number: 35m.d
    text: |-
      de identiteit van een zo groot mogelijk deel, doch ten minste het merendeel van de leden van het gezelschap vast te
      stellen aan de hand van een document als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref1], alsmede
      de aard, het nummer en een afschrift daarvan in de loonadministratie op te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35m
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 35n
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor buitenlandse gezelschappen nadere, zo nodig afwijkende,
      regelen worden gesteld inzake de heffing van de belasting, alsmede andere in het kader der wet passende nadere
      regelen worden gegeven ter aanvulling van in de wet geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel35n
  - number: 36a.1
    text: |-
      Met betrekking tot op 31 december 2000 bestaande rechten op vakantieverlof en compensatieverlof is
      [artikel 10, derde lid][ref1] en [artikel 11, eerste lid, onderdeel r, onder 1°][ref2], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel11
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '10'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '11'
        hoofdstuk: II
  - number: 36a.2
    text: |-
      Met betrekking tot op 27 december 2000 reeds overeengekomen regelingen voor verlofsparen zijn tot 1 januari 2007 de
      regels die daarvoor golden op 27 december 2000 van kracht.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel36a
  - number: 36b
    text: |-
      Met betrekking tot bestaande pensioenaanspraken voor welke op of na 1 januari 1995 een ander lichaam als
      verzekeraar optreedt dan bedoeld in [artikel 18, onderdeel c][ref1], en [artikel 18i, onderdeel c][ref2], is de in
      die onderdelen gestelde voorwaarde inzake de verzekeraar niet van toepassing. Onder bestaande pensioenaanspraken
      worden verstaan de op 31 december 1994 bestaande aanspraken welke naar of krachtens de tekst van [artikel 11][ref3]
      zoals dat toen luidde, zijn aan te merken als aanspraken die berusten op een pensioenregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel18i
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel11
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '18'
        hoofdstuk: IIB
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 18i
        hoofdstuk: IIB
      - id: ref3
        bwb_id: BWBR0002471
        artikel: '11'
        hoofdstuk: II
  - number: '37'
    text: |-
      Met betrekking tot bestaande aanspraken op periodieke uitkeringen ter vervanging van gederfd of te derven loon
      zijn de in [artikel 11, eerste lid, onderdeel g, onder 1° en 2°][ref1], gestelde voorwaarden niet van toepassing.
      Onder bestaande aanspraken op periodieke uitkeringen ter vervanging van gederfd of te derven loon worden verstaan
      de op 31 december 1994 bestaande aanspraken welke naar of krachtens de tekst van [artikel 11][ref2] zoals dat toen
      luidde, zijn aan te merken als aanspraken op periodieke uitkeringen ter vervanging van gederfd of te derven loon.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel11
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '11'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '11'
        hoofdstuk: II
  - number: '38'
    text: |-
      Op uitkeringen en verstrekkingen ingevolge een op 31 december 1994 bestaande aanspraak die voor 1 januari 1995 tot
      het loon heeft behoord, blijft [artikel 11, eerste lid, onderdeel ][ref1], zoals dat luidde op 31 december 1994,
      van kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '11'
        hoofdstuk: II
  - number: 38a.1
    text: |-
      In afwijking in zoverre van [artikel 18][ref1] kan een pensioenregeling mede omvatten een prepensioenregeling,
      mits deze dient of mede dient ter vervanging van een regeling voor vervroegde uittreding en aan de regeling
      tot vervanging voor 1 januari 2009 een begin van uitvoering is gegeven. Ingeval de inhoudingsplichtige nog geen
      regeling voor vervroegde uittreding heeft ingevoerd, is [de vorige volzin][ref2] van overeenkomstige toepassing
      indien aan de vereisten voor de invoering van een regeling voor vervroegde uittreding zou zijn voldaan indien een
      dergelijke regeling zou worden ingevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel38a
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '18'
        hoofdstuk: IIB
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 38a
        hoofdstuk: VIII
  - number: 38a.2
    text: 'Een prepensioen is een pensioen dat:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel38a
  - number: 38a.2.a
    text: niet eerder ingaat dan bij het bereiken van de 60-jarige leeftijd;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel38a
  - number: 38a.2.b
    text: 'niet later ingaat dan bij:'
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel38a
  - number: 38a.2.b.1°
    text: het bereiken van de in de pensioenregeling vastgestelde ingangsdatum van het ouderdomspensioen;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel38a
  - number: 38a.2.b.2°
    text: het eerder beëindigen van de dienstbetrekking op of na de in de prepensioenregeling vastgestelde ingangsdatum;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel38a
  - number: 38a.2.c
    text: uiterlijk eindigt bij het bereiken van de 65-jarige leeftijd;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel38a
  - number: 38a.2.d
    text: |-
      met inbegrip van een voor het bereiken van de 65-jarige leeftijd ingegaan ouderdomspensioen, een
      overbruggingspensioen en uitkeringen ingevolge een regeling voor vervroegde uittreding, op de in de
      prepensioenregeling vastgestelde ingangsdatum van het prepensioen per dienstjaar niet meer bedraagt dan, indien het
      gebaseerd is op:
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel38a
  - number: 38a.2.d.1°
    text: |-
      een eindloonstelsel: 8,5 percent van het pensioengevend loon en in totaal niet meer dan 85 percent van het
      pensioengevend loon;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel38a
  - number: 38a.2.d.2°
    text: |-
      een middelloonstelsel: 9,15 percent van het pensioengevend loon en in totaal niet meer dan 85 percent van het
      laatste pensioengevend loon;
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel38a
  - number: 38a.2.d.3°
    text: |-
      een beschikbare-premiestelsel: een pensioen dat is vastgesteld met overeenkomstige toepassing van
      [artikel 18a, derde lid][ref1], en in totaal niet meer bedraagt dan 85 percent van het laatste pensioengevend loon;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18a
        hoofdstuk: IIB
  - number: 38a.3
    text: |-
      Ingeval het prepensioen later ingaat dan op de in de prepensioenregeling vastgestelde ingangsdatum mag het
      prepensioen na die ingangsdatum worden verhoogd overeenkomstig het tot die datum geldende stelsel, met inbegrip van
      herrekening met inachtneming van algemeen aanvaarde actuariële grondslagen, doch niet verder dan tot 100 percent
      van het pensioengevende loon. Artikel 18e, tweede lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel38a
  - number: 38a.4
    text: |-
      Indien het prepensioen eerder ingaat dan bij het bereiken van de 60-jarige leeftijd wordt het herrekend ten
      opzichte van die leeftijd of van de in de prepensioenregeling vastgestelde latere ingangsdatum met inachtneming van
      algemeen aanvaarde actuariële grondslagen, met dien verstande dat het met inbegrip van een overbruggingspensioen
      en uitkeringen ingevolge een regeling voor vervroegde uittreding niet meer kan bedragen dan 100 percent van
      het pensioengevend loon. Hierbij kan, zonodig in afwijking van de feitelijke situatie, worden uitgegaan van
      een prepensioen dat uiterlijk ingaat bij het bereiken van de 60-jarige leeftijd en dat per dienstjaar niet meer
      bedraagt dan 8,5 percent van het pensioengevend loon.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel38a
  - number: 38a.5
    text: |-
      In afwijking in zoverre van het tweede lid, onderdeel d, onder 1°, kan het percentage van 8,5 tijdsevenredig
      worden verhoogd ingeval de opbouw van het prepensioen tot de in de prepensioenregeling vastgestelde ingangsdatum
      plaatsvindt in een periode die minder beloopt dan tien jaren en de gezamenlijke periode waarin de werknemer
      belanghebbende was bij de voorafgaande regeling voor vervroegde uittreding en de vermoedelijke periode van opbouw
      van het prepensioen, ten minste tien jaren beloopt.
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel38a
  - number: 38a.6
    text: |-
      [Dit artikel][ref1] is van toepassing gedurende een periode die ten hoogste gelijk is aan de periode die nodig is
      om voor de bij de aanvang van de prepensioenregeling aanwezige werknemers een volledig prepensioen op te bouwen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel38a
    url: https://wetten.overheid.nl/BWBR0002471/2004-01-01#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 38a
        hoofdstuk: VIII
  - number: 38a.7
    text: |-
      [De artikelen 18a, negende lid][ref1], [18d][ref2], [18h][ref3], [19c][ref4], [19d][ref5] en [19e][ref6] zijn van
      overeenkomstige toepassing, met dien verstande dat door de overeenkomstige toepassing van [artikel 18d][ref7] een
      prepensioen niet meer kan bedragen dan 100 percent van het pensioengevend loon.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
