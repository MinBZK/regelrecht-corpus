  - number: '30'
    text: |-
      1 Ieder is gehouden aan de inspecteur ter vaststelling van zijn identiteit indien zulks voor de
      heffing van de loonbelasting van belang kan zijn, desgevraagd terstond een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1] ter inzage te verstrekken.

      2 Voor een weigering om te voldoen aan de in het eerste lid omschreven verplichting kan niemand zich met vrucht
      beroepen op de omstandigheden dat hij uit enigerlei hoofde tot geheimhouding verplicht is, zelfs niet indien deze
      hem bij een wettelijke bepaling is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002471/2026-01-01#Artikel30
