  - number: 18g
    text: |-
      1 Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de perioden die in aanmerking
      komen als dienstjaren als bedoeld in [artikel 18a][ref1].

      2 Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het pensioengevend loon,
      bedoeld in de [artikelen 18a][ref2], [18b][ref3] en [18c][ref4], ter zake van:

      a. de loonbestanddelen die daarin worden opgenomen;

      b. de situatie waarin de werknemer aan het eind van zijn loopbaan terugtreedt naar een lager gekwalificeerde
      functie met een lager loon dan in zijn daaraan voorafgaande functie;

      c. de situatie waarin het loon wordt verlaagd in verband met ziekte of arbeidsongeschiktheid van de werknemer;

      d. de situatie waarin de werknemer in een dienstbetrekking in deeltijd werkt, anders dan bedoeld in onderdeel e;

      e. de situatie waarin de werknemer aan het eind van zijn loopbaan zijn arbeidsduur vermindert.


