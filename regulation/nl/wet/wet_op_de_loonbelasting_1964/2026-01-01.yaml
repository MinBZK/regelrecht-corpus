  - number: 32bb
    text: |-
      1 In afwijking in zoverre van het overigens bij of krachtens deze wet bepaalde, wordt een door een
      inhoudingsplichtige aan een werknemer toegekende vertrekvergoeding als bedoeld in het vierde lid voor zover die
      vergoeding meer bedraagt dan het toetsloon, bedoeld in het derde lid, van de werknemer, aangemerkt als loon dat als
      een eindheffingsbestanddeel wordt belast naar een tarief van 75%.

      2 Dit artikel is niet van toepassing ingeval het toetsloon van de werknemer niet meer bedraagt dan € 700.000.

      3 Voor de toepassing van dit artikel wordt onder het toetsloon van een werknemer verstaan:

      a. ingeval de dienstbetrekking is aangevangen vóór of met het begin van het tweede kalenderjaar voorafgaande aan
      het kalenderjaar waarin de dienstbetrekking is beëindigd: het loon dat de werknemer in dat tweede voorafgaande
      kalenderjaar heeft genoten van de inhoudingsplichtige;

      b. ingeval de dienstbetrekking is aangevangen in het tweede kalenderjaar voorafgaande aan het kalenderjaar waarin
      de dienstbetrekking is beëindigd: het tot een jaarloon herleide bedrag van het loon dat de werknemer in dat tweede
      voorafgaande kalenderjaar heeft genoten van de inhoudingsplichtige;

      c. ingeval de dienstbetrekking is aangevangen in het kalenderjaar voorafgaande aan het kalenderjaar waarin
      de dienstbetrekking is beëindigd: het tot een jaarloon herleide bedrag van het loon dat de werknemer in dat
      voorafgaande kalenderjaar heeft genoten van de inhoudingsplichtige;

      d. ingeval de dienstbetrekking is aangevangen in het kalenderjaar waarin de dienstbetrekking is beëindigd: het loon
      dat de werknemer in dat kalenderjaar van de inhoudingsplichtige zou hebben genoten indien de dienstbetrekking aan
      het begin van dat kalenderjaar was aangevangen en niet in dat kalenderjaar was beëindigd.

      4 Voor de toepassing van dit artikel wordt onder een door een inhoudingsplichtige aan een werknemer toegekende
      vertrekvergoeding verstaan de som van het positieve verschil tussen A en het vergelijkingsloon en het positieve
      verschil tussen B en het vergelijkingsloon, waarbij wordt verstaan onder:

      A: het van de inhoudingsplichtige genoten loon in het kalenderjaar waarin de dienstbetrekking is beëindigd alsmede
      het na dat kalenderjaar van de inhoudingsplichtige genoten loon;

      B: het van de inhoudingsplichtige genoten loon in het kalenderjaar voorafgaande aan het kalenderjaar waarin de
      dienstbetrekking is beëindigd;

      Vergelijkingsloon:

      a. ingeval de dienstbetrekking is aangevangen vóór of met het begin van het tweede kalenderjaar voorafgaande aan
      het kalenderjaar waarin de dienstbetrekking is beëindigd: het toetsloon van de werknemer, met dien verstande dat
      het toetsloon voor de berekening van het verschil met A naar evenredigheid wordt verminderd gerelateerd aan het
      aantal dagen dat de dienstbetrekking niet meer heeft bestaan in het kalenderjaar waarin de dienstbetrekking is
      beëindigd;

      b. ingeval de dienstbetrekking is aangevangen in het tweede kalenderjaar voorafgaande aan het kalenderjaar waarin
      de dienstbetrekking is beëindigd: het toetsloon van de werknemer, met dien verstande dat het toetsloon voor de
      berekening van het verschil met A naar evenredigheid wordt verminderd gerelateerd aan het aantal dagen dat de
      dienstbetrekking niet meer heeft bestaan in het kalenderjaar waarin de dienstbetrekking is beëindigd;

      c. ingeval de dienstbetrekking is aangevangen in het kalenderjaar voorafgaande aan het kalenderjaar waarin de
      dienstbetrekking is beëindigd: het toetsloon van de werknemer, met dien verstande dat het toetsloon voor de
      berekening van het verschil met A naar evenredigheid wordt verminderd gerelateerd aan het aantal dagen dat de
      dienstbetrekking niet meer heeft bestaan in het kalenderjaar waarin de dienstbetrekking is beëindigd;

      d. ingeval de dienstbetrekking is aangevangen in het kalenderjaar waarin de dienstbetrekking is beëindigd: het
      toetsloon van de werknemer, met dien verstande dat het toetsloon voor de berekening van het verschil met A naar
      evenredigheid wordt verminderd gerelateerd aan het aantal dagen dat de dienstbetrekking niet heeft bestaan in het
      kalenderjaar waarin de dienstbetrekking is beëindigd.

      5 Ingeval de inhoudingsplichtige in het kalenderjaar waarin de dienstbetrekking is beëindigd onderscheidenlijk in
      het daaraan voorafgaande kalenderjaar met de werknemer een aandelenoptierecht is overeengekomen en de werknemer ter
      zake van dat recht niet uiterlijk bij de beëindiging van de dienstbetrekking ingevolge de [artikelen 10a][ref1] en
      [13a][ref2], met uitzondering van artikel 10a, dertiende lid, loon heeft genoten, wordt bij de vaststelling van A,
      bedoeld in het vierde lid, onderscheidenlijk B, bedoeld in het vierde lid, mede in aanmerking genomen:

      a. ingeval het recht nog niet is uitgeoefend: hetgeen tot het loon zou hebben behoord indien hij dat recht op
      het tijdstip van beëindiging van de dienstbetrekking zou hebben uitgeoefend en de daarbij verkregen aandelen
      onmiddellijk verhandelbaar zouden zijn; of

      b. ingeval het recht wel is uitgeoefend: hetgeen tot het loon zou hebben behoord indien de bij uitoefening van het
      recht verkregen aandelen op het tijdstip van beëindiging van de dienstbetrekking verhandelbaar zouden worden.

      6 Het eerste lid is niet van toepassing voor zover de inhoudingsplichtige aannemelijk maakt dat de som van de
      verschillen, bedoeld in het vierde lid, verband houdt met loon dat de werknemer ingevolge de [artikelen 10a][ref3]
      en [13a][ref4] heeft genoten ter zake van een aandelenoptierecht, dat onvoorwaardelijk is toegekend of geworden in
      een eerder jaar dan het kalenderjaar voorafgaande aan het kalenderjaar waarin de dienstbetrekking met die werknemer
      is beëindigd.

      7 Voor de toepassing van het eerste lid wordt een vertrekvergoeding beschouwd te zijn toegekend op het tijdstip
      waarop de dienstbetrekking is beëindigd, of, voor zover de vertrekvergoeding pas daarna als loon wordt genoten, op
      dat latere tijdstip. Ingeval een vertrekvergoeding ingevolge de eerste volzin wordt beschouwd te zijn toegekend op
      meer dan een tijdstip, wordt de berekening ingevolge het vierde lid op elk tijdstip toegepast onder verrekening van
      hetgeen eerder is berekend.

      8 Bij het begin van het kalenderjaar wordt het in het tweede lid genoemde bedrag bij ministeriële regeling
      vervangen door een ander bedrag. Dit bedrag wordt berekend door het te vervangen bedrag te vermenigvuldigen met de
      tabelcorrectiefactor, bedoeld in [artikel 10.2 van de Wet inkomstenbelasting 2001][ref5], en vervolgens de nodig
      geachte afronding aan te brengen. Indien in het voorafgaande kalenderjaar een dergelijke afronding is toegepast,
      kan bij vervanging worden uitgegaan van het niet-afgeronde bedrag.

      9 Het eerste lid is niet van toepassing op een bedrag dat ingevolge [artikel 32ba, eerste lid][ref6], wordt
      aangemerkt als loon dat als een eindheffingsbestanddeel wordt belast.


