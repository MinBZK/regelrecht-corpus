preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is het Besluit op de Loonbelasting 1940 door een meer
    overzichtelijke en op verschillende punten herziene wettelijke regeling te vervangen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002471/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Onder de naam 'loonbelasting' wordt van werknemers of hun inhoudingsplichtige, van artiesten, van beroepssporters,
      van buitenlandse gezelschappen en van bij of krachtens deze wet aan te wijzen andere personen een directe belasting
      geheven.
    url: https://wetten.overheid.nl/BWBR0002471/2026-01-01#Artikel1
  - number: '2'
    text: |-
      1 Werknemer is de natuurlijke persoon die tot een inhoudingsplichtige in privaatrechtelijke of in
      publiekrechtelijke dienstbetrekking staat of van een inhoudingsplichtige loon geniet uit een vroegere
      privaatrechtelijke of publiekrechtelijke dienstbetrekking van hemzelf of van een ander, dan wel uit een bestaande
      privaatrechtelijke of publiekrechtelijke dienstbetrekking van een ander.

      2 Degene die van een Nederlandse publiekrechtelijke rechtspersoon loon geniet uit een dienstbetrekking
      tot een niet-inhoudingsplichtige dan wel loon in de vorm van premies voor werkaanvaarding ten behoeve van
      uitkeringsgerechtigden, wordt geacht tot die rechtspersoon in dienstbetrekking te staan.

      3 Tenzij werkzaamheden zijn of worden verricht in een functie van bestuurder of commissaris van een in Nederland
      gevestigd lichaam, dan wel in dienstbetrekking bij een Nederlandse publiekrechtelijke rechtspersoon of in het kader
      van een uitzending op grond van een verdrag waarbij de Staat der Nederlanden partij is, is het eerste lid niet
      van toepassing op personen die niet in Nederland wonen, met betrekking tot een geheel buiten Nederland vervulde
      dienstbetrekking. Voor werkzaamheden die zijn of worden verricht aan boord van schepen of luchtvaartuigen in
      het internationale verkeer van een onderneming waarvan de leiding in Nederland is gevestigd, is de eerste volzin
      slechts van toepassing indien wordt voldaan aan de in het vierde lid gestelde voorwaarden.

      4 Het eerste lid is eveneens niet van toepassing op personen die niet in Nederland wonen, met betrekking tot een
      nagenoeg geheel buiten Nederland vervulde dienstbetrekking, anders dan de dienstbetrekkingen die in het derde lid,
      eerste volzin, zijn genoemd, indien:

      a. het loon is onderworpen aan een belasting naar het inkomen die door of vanwege Aruba, Curaçao, Sint Maarten, de
      BES eilanden of een andere mogendheid wordt geheven, en

      b. het loon niet op grond van een verdrag ter voorkoming van dubbele belasting of op grond van enige andere regel
      van interregionaal of internationaal recht in feite slechts in Nederland aan een belasting naar het inkomen is
      onderworpen.

      5 Het eerste lid is eveneens niet van toepassing op personen die niet in Nederland wonen, met betrekking
      tot een gedeeltelijk, maar niet nagenoeg geheel buiten Nederland vervulde dienstbetrekking, anders dan de
      dienstbetrekkingen die in het derde lid, eerste volzin, zijn genoemd, voorzover het loon uit die dienstbetrekking
      met inachtneming van verdragen waarbij de Staat der Nederlanden partij is, feitelijk is onderworpen aan een
      belasting naar het inkomen die door of vanwege Aruba, Curaçao, Sint Maarten, de BES eilanden of een andere
      mogendheid wordt geheven.

      6 Het eerste lid is eveneens niet van toepassing op personen die als vrijwilliger uitsluitend vergoedingen of
      verstrekkingen ontvangen met een gezamenlijke waarde van ten hoogste € 220 per maand en € 2.200 per kalenderjaar.
      Hierbij wordt onder vrijwilliger verstaan degene die niet bij wijze van beroep arbeid verricht voor een algemeen
      nut beogende instelling, een sportorganisatie of een niet als zodanig aan te merken lichaam dat niet is onderworpen
      aan de vennootschapsbelasting of daarvan is vrijgesteld.

      7 Bij het begin van het kalenderjaar worden de in het zesde lid genoemde bedragen bij ministeriële regeling
      vervangen door andere bedragen. Het bedrag per kalenderjaar wordt berekend door het te vervangen bedrag te
      vermenigvuldigen met de tabelcorrectiefactor, bedoeld in [artikel 10.2 van de Wet inkomstenbelasting 2001][ref1],
      en vervolgens de nodig geachte afronding aan te brengen. Indien in het voorafgaande kalenderjaar een dergelijke
      afronding is toegepast, kan bij vervanging worden uitgegaan van het niet-afgeronde bedrag. Het bedrag per maand
      wordt berekend door het volgens de tweede zin berekende bedrag per kalenderjaar te vermenigvuldigen met 1/10.

      8 Krachtens wettelijk vruchtgenot aan een kind ontleend loon wordt geacht door het kind te zijn genoten.

      9 Loon in de vorm van periodieke uitkeringen welke van publiekrechtelijke aard zijn, kan in het kalenderjaar
      waarin de verstrekking van die uitkeringen aanvangt dan wel eindigt volgens bij ministeriële regeling te
      stellen regels worden geacht niet te zijn genoten door de werknemer doch door zijn partner in de zin van
      [artikel 1.2 van de Wet inkomstenbelasting 2001][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel10.2
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel1.2
