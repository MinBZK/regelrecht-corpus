  - number: 38p
    text: |-
      1 Een aanspraak ingevolge een oudedagsverplichting als bedoeld in [artikel 38n, tweede lid, onderdeel b][ref1],
      zoals dat artikel luidde op 31 december 2019, wordt jaarlijks verhoogd met een bij ministeriële regeling
      bepaalde marktrente, en kan geruisloos worden aangewend ter verkrijging van een lijfrente als bedoeld in
      [artikel 3.125 van de Wet inkomstenbelasting 2001][ref2] of een lijfrenterekening of lijfrentebeleggingsrecht
      als bedoeld in [artikel 3.126a van die wet][ref3] dan wel overeenkomstig de in het tweede en derde lid opgenomen
      voorwaarden in termijnen worden uitgekeerd.

      2 Voor zover een aanspraak ingevolge een oudedagsverplichting als bedoeld in het eerste lid niet is aangewend
      ter verkrijging van een lijfrente als bedoeld in [artikel 3.125 van de Wet inkomstenbelasting 2001][ref4] of een
      lijfrenterekening of lijfrentebeleggingsrecht als bedoeld in [artikel 3.126a van die wet][ref5], wordt de waarde
      van deze aanspraak in een periode van twintig jaar in termijnen met een gelijke tussenperiode van ten hoogste
      een jaar uitgekeerd als loon uit vroegere dienstbetrekking, waarbij het in een jaar uit te keren bedrag gelijk is
      aan de stand van de oudedagsverplichting aan het begin van dat jaar gedeeld door het aantal op dat tijdstip nog
      resterende uitkeringsjaren. Voorts geldt daarbij:

      a. bij in leven zijn van de werknemer of gewezen werknemer:

      1°. dat de termijnen aan hem worden uitgekeerd en de eerste termijn niet eerder wordt uitgekeerd dan
      nadat hij de leeftijd bereikt die vijf jaar lager is dan de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref6], maar uiterlijk twee maanden na de datum waarop hij de
      laatstgenoemde leeftijd bereikt;

      2°. dat, ingeval de eerste termijn eerder aan hem wordt uitgekeerd dan nadat hij de pensioengerechtigde leeftijd,
      bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref7], heeft bereikt, de periode van twintig
      jaar, bedoeld in de eerste volzin, wordt vermeerderd met het aantal jaren tussen het tijdstip van het uitkeren van
      de eerste termijn en de laatstgenoemde leeftijd;

      3°. dat, ingeval de omzetting, bedoeld in [artikel 38n, tweede lid][ref8], zoals dat artikel luidde op
      31 december 2019, meer dan twee maanden later plaatsvindt dan nadat hij de pensioengerechtigde leeftijd, bedoeld
      in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref9], heeft bereikt, de eerste termijn aan hem wordt
      uitgekeerd direct na het moment van omzetting en de periode van twintig jaar, bedoeld in de eerste volzin, wordt
      verminderd met het aantal jaren tussen het tijdstip van het uitkeren van de eerste termijn en de laatstgenoemde
      leeftijd;

      b. bij overlijden van de werknemer of gewezen werknemer terwijl ingevolge onderdeel a nog geen termijnen zijn
      ingegaan:

      1°. dat de termijnen binnen twaalf maanden na het overlijden ingaan;

      2°. dat de termijnen worden uitgekeerd aan een of meer van zijn erfgenamen of legatarissen voor zover dit
      natuurlijke personen zijn.

      3 Indien ingevolge het tweede lid, onderdelen a of b, termijnen zijn ingegaan en de genieter van de termijnen
      overlijdt, gaat het recht op de nog niet uitgekeerde termijnen over op een of meer van zijn erfgenamen of
      legatarissen voor zover dit natuurlijke personen zijn.

      4 De [artikelen 19a][ref10] en [19b][ref11], zoals die artikelen luidden op 31 december 2016,
      de [artikelen 3.83][ref12] en [7.2 van de Wet inkomstenbelasting 2001][ref13], zoals die
      artikelen luidden op 31 december 2016, de [artikelen 2.8, tweede lid][ref14], [2.9][ref15] en
      [3.136 van de Wet inkomstenbelasting 2001][ref16], [artikel 30i van de Algemene wet inzake rijksbelastingen][ref17],
      de [artikelen 25, vijfde lid][ref18], en [26, derde lid, van de Invorderingswet 1990][ref19] en
      [artikel 32, derde lid, van de Successiewet 1956][ref20] zijn van overeenkomstige toepassing op aanspraken
      ingevolge een oudedagsverplichting als bedoeld in het eerste lid.

      5 In afwijking van het eerste en tweede lid kan onder door Onze Minister te stellen voorwaarden een aanspraak
      ingevolge een oudedagsverplichting als bedoeld in het eerste lid ook na de ingangsdatum van de termijnen,
      bedoeld in het tweede lid, geruisloos worden aangewend ter verkrijging van een lijfrente als bedoeld in
      [artikel 3.125 van de Wet inkomstenbelasting 2001][ref21] of een lijfrenterekening of lijfrentebeleggingsrecht als
      bedoeld in [artikel 3.126a van die we][ref22]t.

      6 Indien [artikel 19b, eerste lid][ref23], zoals dat luidde op 31 december 2016, van overeenkomstige toepassing is
      of is geweest op een aanspraak ingevolge een oudedagsverplichting als bedoeld in het eerste lid en de aanspraak in
      afwijking van dat artikel bij de bepaling van de verschuldigde belasting niet als loon in aanmerking is genomen,
      blijft dat artikel van overeenkomstige toepassing op die aanspraak.


