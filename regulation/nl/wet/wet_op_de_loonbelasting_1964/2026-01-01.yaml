  - number: 27e
    text: |-
      1 Met het oog op het beperken van administratieve lasten van een aantal inhoudingsplichtigen die tegelijkertijd
      aangiften doen, kan de inspecteur op hun verzoek, onder door hem te stellen voorwaarden, deze inhoudingsplichtigen
      aanwijzen als samenhangende groep inhoudingsplichtigen.

      2 De aanwijzing kan en de daarbij gestelde voorwaarden kunnen, al dan niet op verzoek van een of meer
      inhoudingsplichtigen, worden gewijzigd of ingetrokken.

      3 Aanwijzing, wijziging en intrekking vinden plaats bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002471/2026-01-01#Artikel27e
  - number: '28'
    text: |-
      1 De inhoudingsplichtige is gehouden volgens bij ministeriële regeling te stellen regels, waaronder regels inzake
      de wijze waarop:

      a. van de werknemer opgave te verlangen van gegevens waarvan de kennisneming voor de heffing van de belasting van
      belang kan zijn;

      b. de in onderdeel *a* bedoelde gegevens door te geven aan een andere inhoudingsplichtige;

      c. een loonadministratie te voeren en daarbij de gegevens te administreren met betrekking tot de bij ministeriële
      regeling aan te wijzen uitkeringen en verstrekkingen welke ingevolge [artikel 11][ref1] niet tot het loon behoren;

      d. aan de inspecteur opgave te verstrekken van de bij ministeriële regeling, in overeenstemming met Onze Minister
      van Sociale Zaken en Werkgelegenheid, en na overleg met het Centraal Bureau voor de Statistiek, te bepalen
      gegevens, bedoeld in [artikel 7, eerste lid, van de Algemene wet inzake rijksbelastingen][ref2], waaronder
      gegevens ten behoeve van de doelen van de polisadministratie, bedoeld in
      [artikel 33, tweede lid, onderdelen a, d en e, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3]
      ;

      e. aan de werknemer opgave te verstrekken van het in het voorafgaande kalenderjaar genoten loon, de op dat
      loon ingehouden belasting en premie voor de volksverzekeringen, de op dat loon ingehouden inkomensafhankelijke
      bijdrage [Zorgverzekeringswet][ref4], de over dat loon door de inhoudingsplichtige verschuldigde premies
      werknemersverzekeringen en inkomensafhankelijke bijdrage Zorgverzekeringswet en de bij de toepassing van
      de loonbelastingtabellen, bedoeld in [artikel 25, tweede lid][ref5], met de loonbelasting en premie voor de
      volksverzekeringen verrekende arbeidskorting;

      f. van de werknemer die loon uit tegenwoordige dienstbetrekking geniet
      vast te stellen de identiteit aan de hand van een document als bedoeld in
      [artikel 1, eerste lid, onder 1° tot en met 3°, van de Wet op de identificatieplicht][ref6] en – zo de werknemer
      een vreemdeling is in de zin van de [Vreemdelingenwet 2000][ref7] en niet behoort tot de categorie werknemers die
      op grond van overeenkomsten van internationaal recht is uitgezonderd van de verplichting tot het hebben van een
      geldige verblijfsvergunning als bedoeld in die wet en een geldige tewerkstellingsvergunning als bedoeld in de Wet
      arbeid vreemdelingen – tevens de verblijfsrechtelijke status ter zake van het verrichten van arbeid aan de hand van
      een geldige verblijfsvergunning of aan de hand van een geldige tewerkstellingsvergunning, alsmede van een en ander
      de aard, het nummer en een afschrift daarvan in de loonadministratie op te nemen;

      g. ingeval de inspecteur hem bij voor bezwaar vatbare beschikking daartoe heeft verplicht, voor de datum van
      aanvang van de werkzaamheden van een werknemer aan de inspecteur opgave te verstrekken van gegevens waarvan
      kennisneming voor de heffing van de belasting van belang kan zijn (eerstedagsmelding), met dien verstande dat
      indien de dienstbetrekking is overeengekomen op de datum waarop de werkzaamheden aanvangen, de eerstedagsmelding
      wordt gedaan voor de aanvang van de werkzaamheden;

      h. mededeling aan de inspecteur te doen omtrent het einde van zijn inhoudingsplicht.

      2 Het eerste lid is niet van toepassing ten aanzien van de werknemer die niet in Nederland woont en die
      werkzaamheden verricht of heeft verricht in een in [artikel 2, derde lid][ref8], genoemde dienstbetrekking, indien
      het heffingrecht over het loon uit die dienstbetrekking op grond van een belastingverdrag niet aan Nederland is
      toegewezen en de werknemer niet premieplichtig is voor de volksverzekeringen.


