        artikel: '25'
        hoofdstuk: III
  - number: 27c
    text: |-
      1 Indien ten aanzien van de werknemer ook premieplicht voor de werknemersverzekeringen bestaat, geschiedt de
      heffing van de premies voor de werknemersverzekeringen gelijktijdig met die van de belasting en geschiedt de
      afdracht van die premies en de belasting op één aangifte, een en ander met overeenkomstige toepassing van de regels
      die gelden voor de heffing en de invordering van de loonbelasting.

      2 Toerekening van een betaling op de aangifte bedoeld in het eerste lid geschiedt naar evenredigheid aan de
      belasting en aan de premies voor de werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0002471/2026-01-01#Artikel27c
  - number: 27d
    text: |-
      1 Indien de werknemer ook verzekeringsplichtig is in de zin van de [Zorgverzekeringswet][ref1], geschiedt
      de heffing van de ingevolge de Zorgverzekeringswet over het loon verschuldigde inkomensafhankelijke bijdrage
      gelijktijdig met die van de belasting en geschiedt de afdracht van die bijdrage en de belasting op één aangifte,
      een en ander met overeenkomstige toepassing van de regels die gelden voor de heffing en de invordering van de
      loonbelasting.

      2 Toerekening van een betaling op de aangifte, bedoeld in het eerste lid, geschiedt naar evenredigheid aan de
      belasting en aan de ingevolge de [Zorgverzekeringswet][ref2] verschuldigde inkomensafhankelijke bijdrage.

      3 De vorige leden zijn van overeenkomstige toepassing op de bijdragevervangende belasting, bedoeld in
      [artikel 57 van de Zorgverzekeringswet][ref3], die is verschuldigd over het loon van de al dan niet als
      verzekeringsplichtige in de zin van de [Zorgverzekeringswet][ref4] aan te merken werknemer.


