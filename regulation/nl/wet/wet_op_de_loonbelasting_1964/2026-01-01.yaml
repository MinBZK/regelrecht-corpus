  - number: '29'
    text: |-
      1 De werknemer is volgens bij ministeriële regeling te stellen regels gehouden aan de inhoudingsplichtige
      opgave te verstrekken van gegevens waarvan de kennisneming voor de heffing van de belasting van belang
      kan zijn. Ingeval de werknemer loon uit tegenwoordige dienstbetrekking geniet, is hij voorts gehouden aan
      de inhoudingsplichtige ter inzage te verstrekken, een op hem betrekking hebbend document als bedoeld in
      [artikel 1, eerste lid, onder 1° tot en met 3°, van de Wet op de identificatieplicht][ref1] alsmede – zo hij
      ook een vreemdeling is in de zin van de [Vreemdelingenwet 2000][ref2] en niet behoort tot de categorie werknemers
      die op grond van overeenkomsten van internationaal recht is uitgezonderd van de verplichting tot het hebben van
      een geldige verblijfsvergunning als bedoeld in die wet – een geldige verblijfsvergunning ter vaststelling van de
      verblijfsrechtelijke status ter zake van het verrichten van arbeid en is hij gehouden een afschrift van een en
      ander in de loonadministratie van de inhoudingsplichtige te laten opnemen.

      2 De werknemer is echter niet gehouden opgave te verstrekken van gegevens met betrekking tot de heffingskorting.
      Indien de werknemer deze gegevens niet verstrekt, wordt met de heffingskorting geen rekening gehouden.

      3 Tot de in het eerste lid en de in [artikel 28, eerste lid, onderdelen a en e][ref3], bedoelde gegevens wordt
      mede gerekend het burgerservicenummer van de werknemer.

      4 De vorige leden zijn niet van toepassing ten aanzien van de werknemer die niet in Nederland woont en die
      werkzaamheden verricht of heeft verricht in een in [artikel 2, derde lid][ref4], genoemde dienstbetrekking, indien
      het heffingrecht over het loon uit die dienstbetrekking op grond van een belastingverdrag niet aan Nederland is
      toegewezen en de werknemer niet premieplichtig is voor de volksverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0011823
