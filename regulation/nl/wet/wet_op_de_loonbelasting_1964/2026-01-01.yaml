  - number: 18b
    text: |-
      1 Een partnerpensioen bij overlijden voor pensioendatum bedraagt niet meer dan 50% van het laatstgenoten
      pensioengevend loon.

      2 Een partnerpensioen bij overlijden voor pensioendatum wordt verzekerd op risicobasis.

      3 Een partnerpensioen bij overlijden voor pensioendatum gaat niet eerder in dan op de eerste dag van de
      kalendermaand waarin de werknemer of gewezen werknemer is overleden en gaat niet later in dan op de eerste dag van
      de maand volgend op de kalendermaand waarin de werknemer of gewezen werknemer is overleden.
    url: https://wetten.overheid.nl/BWBR0002471/2026-01-01#Artikel18b
  - number: 18c
    text: |-
      1 Een wezenpensioen bedraagt voor halve wezen niet meer dan 20% van het laatstgenoten pensioengevend loon.

      2 Een wezenpensioen bedraagt voor volle wezen niet meer dan 40% van het laatstgenoten pensioengevend loon.

      3 Een wezenpensioen wordt verzekerd op risicobasis.

      4 Een wezenpensioen gaat niet eerder in dan op de eerste dag van de kalendermaand waarin de werknemer of gewezen
      werknemer is overleden en gaat niet later in dan op de eerste dag van de maand volgend op de kalendermaand waarin
      de werknemer of gewezen werknemer is overleden.

      5 Een wezenpensioen eindigt niet later dan op de laatste dag van de kalendermaand waarin de wees de leeftijd van
      25 jaar heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0002471/2026-01-01#Artikel18c
  - number: 18d
    text: |-
      1 De hoogte van de uitkeringen van ouderdomspensioen, partnerpensioen bij overlijden op of na pensioendatum,
      partnerpensioen bij overlijden voor pensioendatum en wezenpensioen kan variëren, mits de laagste uitkering niet
      minder bedraagt dan 75 procent van de hoogste uitkering en de mate van variatie ten laatste op de ingangsdatum
      van het pensioen wordt vastgesteld. Door toepassing van de eerste zin kunnen in afwijking in zoverre van de
      [artikelen 18b][ref1] en [18c][ref2] een partnerpensioen bij overlijden voor pensioendatum en een wezenpensioen
      meer bedragen dan de aldaar opgenomen maxima.

      2 Voor de toepassing van het eerste lid blijft in de jaren tussen de ingangsdatum van het pensioen en het bereiken
      van de pensioengerechtigde leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref3], van
      de uitkering buiten aanmerking een bedrag van € 2.357 vermenigvuldigd met het op hele maanden naar boven afgeronde
      aantal maanden tussen de eerste uitkering in die periode en het bereiken van de pensioengerechtigde leeftijd.
      Het in de eerste zin genoemde bedrag wordt in die jaren evenredig per kalenderjaar toegepast en de eerste zin is
      onverminderd van toepassing bij dienstbetrekkingen in deeltijd. Ingeval de pensioengerechtigde leeftijd, bedoeld
      in artikel 7a, eerste lid, van de Algemene Ouderdomswet, na de ingangsdatum van het pensioen wordt verlaagd, wordt
      voor de toepassing van de eerste zin uitgegaan van de pensioengerechtigde leeftijd, bedoeld in artikel 7a, eerste
      lid, van de Algemene Ouderdomswet, die van toepassing was voor deze verlaging.

      3 Voor de toepassing van het eerste lid blijven aanpassingen van de uitkeringen buiten aanmerking voor
      zover deze het gevolg zijn van de omstandigheid dat de opgetreden ontwikkeling van de levensverwachting,
      de behaalde sterfteresultaten of de behaalde beleggingsrendementen tot hogere of lagere uitkeringen leiden
      dan op het tijdstip van ingang van het pensioen het uitgangspunt was. Voor de toepassing van het eerste
      lid blijven aanpassingen van de uitkeringen eveneens buiten aanmerking voor zover deze het gevolg zijn van
      een periodieke vaste daling of vaste stijging van de uitkering of toepassing van een projectierendement
      hoger of lager dan de risicovrije rente, bedoeld in [artikel 63a, derde lid, van de Pensioenwet][ref4] of
      [artikel 75a, derde lid, van de Wet verplichte beroepspensioenregeling][ref5].

      4 In afwijking in zoverre van het eerste lid wordt bij een aanpassing van de pensioengerechtigde leeftijd, bedoeld
      in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref6], na de ingangsdatum van het pensioen, de mate
      van variatie ten laatste vastgesteld bij het bereiken van de hoogste pensioengerechtigde leeftijd, bedoeld in
      artikel 7a, eerste lid, van de Algemene Ouderdomswet, die op enig moment na de ingangsdatum van het pensioen geldt
      of heeft gegolden voor de werknemer.

      5 In afwijking in zoverre van de [artikelen 18b][ref7] en [18c][ref8] kunnen een partnerpensioen bij overlijden
      voor pensioendatum en een wezenpensioen meer bedragen dan de aldaar opgenomen maxima voor zover zulks het gevolg
      is van een ruil van pensioensoorten, mits de ruil uiterlijk voor de ingangsdatum van het partnerpensioen bij
      overlijden voor pensioendatum, onderscheidenlijk het wezenpensioen, plaatsvindt op basis van algemeen aanvaarde
      actuariële grondslagen.

      6 In afwijking in zoverre van de [artikelen 18b][ref9] en [18c][ref10] kunnen een partnerpensioen bij overlijden
      voor pensioendatum en een wezenpensioen meer bedragen dan de aldaar opgenomen maxima voor zover zulks het gevolg is
      van aanpassing van het pensioen aan de loon- of prijsontwikkeling na ingang van het pensioen.

      7 Bij het begin van het kalenderjaar wordt het in het tweede lid genoemde bedrag bij ministeriële
      regeling vervangen door een ander bedrag. Dit bedrag wordt gesteld op het bedrag dat na aftrek
      van de in te houden loonbelasting en premie voor de volksverzekeringen, rekening houdend met
      de algemene heffingskorting voor een persoon die de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref11], nog niet heeft bereikt, gelijk is aan het netto-
      ouderdomspensioen per maand, bedoeld in [artikel 9, vijfde lid, onderdeel a, van die wet][ref12], waarbij de
      nodig geachte afronding wordt aangebracht.

      8 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de toepassing van dit artikel.


