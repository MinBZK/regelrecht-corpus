  - number: 18ga
    text: |-
      1 Als pensioengevend loon als bedoeld in de [artikelen 18a][ref1], [18b][ref2] en [18c][ref3] wordt ten hoogste
      een bedrag van € 137.800 in aanmerking genomen. Bij dienstbetrekkingen in deeltijd wordt dit bedrag verminderd
      overeenkomstig de deeltijdfactor.

      2 Het in het eerste lid vermelde bedrag wordt bij het begin van het kalenderjaar bij ministeriële regeling
      vervangen door een ander bedrag. Dit bedrag wordt berekend door het te vervangen bedrag te vermenigvuldigen met de
      contractloonontwikkelingsfactor, bedoeld in [artikel 10.2b, tweede lid, van de Wet inkomstenbelasting 2001][ref4],
      en vervolgens de nodig geachte afronding aan te brengen. Indien in het voorafgaande jaar een dergelijke afronding
      is toegepast, kan bij vervanging worden uitgegaan van het niet-afgeronde bedrag.


