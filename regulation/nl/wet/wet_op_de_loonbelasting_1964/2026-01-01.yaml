  - number: 38n
    text: |-
      1 Op aanspraken ingevolge een pensioenregeling waarvan een lichaam als bedoeld in
      [artikel 19a, eerste lid, onderdelen d of e][ref1], zoals dat artikel luidde op 31 december 2016, als verzekeraar
      optreedt, blijven de [artikelen 18h][ref2], [19a][ref3], [19b][ref4], [19c][ref5], [19d][ref6] en [38j][ref7],
      alsmede de daarop gebaseerde bepalingen, zoals die artikelen en bepalingen luidden op 31 december 2016, van
      toepassing.

      2 Indien [artikel 19b, eerste lid][ref8], zoals dat luidde op 31 december 2016 van toepassing is of is geweest op
      een aanspraak als bedoeld in het eerste lid en de aanspraak in afwijking van dat artikel bij de bepaling van de
      verschuldigde belasting niet als loon in aanmerking is genomen, blijft dat artikel van overeenkomstige toepassing
      op die aanspraak.


