  - number: 32d
    text: |-
      1 De in Nederland wonende of gevestigde inhoudingsplichtige wordt geacht met het door hem verschuldigde loon
      van een in Nederland wonende werknemer tevens te verstrekken het loon dat de werknemer zonder toepassing van dit
      artikel zou hebben genoten als werknemer van een andere inhoudingsplichtige, indien:

      a. de werknemer uit hoofde van zijn dienstbetrekking tevens werkzaam is als werknemer van die andere
      inhoudingsplichtige onder de verplichting het hem toekomende loon af te staan aan de inhoudingsplichtige, en

      b. die andere inhoudingsplichtige het bedoelde loon rechtstreeks afdraagt aan de inhoudingsplichtige en aan
      de werknemer geen verstrekkingen verstrekt die niet vooraf aan de inhoudingsplichtige zijn medegedeeld. Aan
      de voorwaarde in de eerste volzin, onderdeel a, dat de werknemer uit hoofde van zijn dienstbetrekking tevens
      werkzaam is als werknemer van een andere inhoudingsplichtige is ook voldaan indien de inhoudingsplichtige waaraan
      het loon wordt afgestaan een lichaam is waarin de werknemer een aanmerkelijk belang heeft in de zin van de
      [Wet inkomstenbelasting 2001][ref1], de werknemer via dit lichaam een belang heeft in de andere inhoudingsplichtige
      en dit belang tezamen met zijn werkzaamheden voor die andere inhoudingsplichtige materieel grotendeels overeenkomt
      met het aandeel en de werkzaamheden van een vennoot in een vennootschap onder firma.

      2 Het eerste lid is van overeenkomstige toepassing ten aanzien van een niet in Nederland wonende werknemer
      ingeval het aan de inhoudingsplichtige afgestane loon voor de toepassing van regelingen ter voorkoming van dubbele
      belasting niet anders zou worden behandeld dan het door deze inhoudingsplichtige aan de werknemer uit te betalen
      loon.

      3 Het eerste en tweede lid zijn slechts van toepassing als de inspecteur onder wie de inhoudingsplichtige
      ressorteert die zonder toepassing van deze leden belasting had moeten inhouden, op gezamenlijk verzoek van deze
      inhoudingsplichtige, de inhoudingsplichtige aan wie het loon wordt afgestaan en de werknemer bij voor bezwaar
      vatbare beschikking, die te allen tijde bij nadere, voor bezwaar vatbare, beschikking kan worden herroepen, heeft
      vastgesteld dat aan de gestelde voorwaarden is voldaan.

      4 Het derde lid is niet van toepassing indien:

      a. de werknemer een aanmerkelijk belang heeft in de zin van de [Wet inkomstenbelasting 2001][ref2] in
      zowel de inhoudingsplichtige die zonder toepassing van dit artikel belasting had moeten inhouden als in de
      inhoudingsplichtige aan wie het loon wordt afgestaan, en

      b. de inhoudingsplichtige aan wie het loon wordt afgestaan aangifte doet in overeenstemming met het eerste of
      tweede lid.


