  - number: 28c
    text: |-
      1 Indien de inhoudingsplichtige de opgave, bedoeld in [artikel 28, eerste lid, onderdeel g][ref1], niet, onjuist,
      onvolledig dan wel niet binnen de gestelde termijn heeft verstrekt, vormt dit een verzuim terzake waarvan de
      inspecteur hem een bestuurlijke boete van ten hoogste € 1.675 kan opleggen.

      2 De bevoegdheid tot het opleggen van een bestuurlijke boete wegens het feit, bedoeld in het eerste
      lid, vervalt door verloop van één jaar na het einde van het kalenderjaar waarin de opgave, bedoeld in
      [artikel 28, eerste lid, onderdeel g][ref2], had moeten worden verstrekt.

      3 [Artikel 67cb van de Algemene wet inzake rijksbelastingen][ref3] is van overeenkomstige toepassing op het in het
      eerste lid genoemde bedrag.


