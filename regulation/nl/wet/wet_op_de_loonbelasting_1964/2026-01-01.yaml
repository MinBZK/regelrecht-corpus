  - number: '7'
    text: |-
      Als degene tot wie de dienstbetrekking bestaat, wordt beschouwd:

      a. bij toepassing van [artikel 3, eerste lid, onderdelen a en b][ref1]: de aanbesteder;

      b. bij toepassing van [artikel 3, eerste lid, onderdelen c en d][ref2]: degene met wie de overeenkomst tot
      bemiddeling is gesloten;

      c. bij toepassing van [artikel 3, eerste lid, onderdeel e][ref3]: degene bij wie de werkzaamheden worden verricht
      of de opleiding wordt genoten;

      d. bij toepassing van [artikel 3, eerste lid, onderdeel f][ref4]: de ouder;

      e. bij toepassing van [artikel 3, eerste lid, onderdeel g][ref5]: de coöperatie;

      f. bij toepassing van [artikel 3, eerste lid, onderdeel h][ref6]: de vennootschap;

      g. bij toepassing van [artikel 4, onderdeel a][ref7]: de opdrachtgever;

      h. bij toepassing van [artikel 4, onderdeel b][ref8]: de thuiswerker;

      i. bij toepassing van [artikel 4, onderdeel c][ref9]: degene met wie de inkomensvoorziening of kostenvergoeding
      is overeengekomen;

      j. bij toepassing van [artikel 4, onderdeel d][ref10]: het lichaam;

      k. bij toepassing van [artikel 4, onderdelen e en f][ref11]: degene die bij de algemene maatregel van bestuur,
      bedoeld in artikel 4, als inhoudingsplichtige is aangewezen.


