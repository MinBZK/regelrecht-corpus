  - number: 35a
    text: |-
      1 De verschuldigde belasting bedraagt een percentage, gelijk aan het gecombineerde heffingspercentage, bedoeld in
      [artikel 21, onderdeel b][ref1], van de gage. In afwijking van de vorige volzin bedraagt de belasting ten aanzien
      van de niet in Nederland wonende artiest of beroepssporter 20 percent van de gage.

      2 Ten aanzien van niet in Nederland wonende beroepssporters kan bij algemene maatregel van bestuur, zo nodig
      onder voorwaarden, ten behoeve van uniforme heffing bij grensoverschrijdende evenementen het in het eerste lid
      genoemde percentage van 20 tijdelijk worden verlaagd, doch niet verder dan tot 15 percent. Een krachtens de eerste
      volzin vastgestelde algemene maatregel van bestuur wordt aan de beide kamers der Staten-Generaal overlegd. Hij
      treedt in werking op een tijdstip dat nadat vier weken na de overlegging zijn verstreken bij koninklijk besluit
      wordt vastgelegd, tenzij binnen die termijn door of namens een der kamers of door ten minste een vijfde van het
      grondwettelijk aantal leden van een der kamers de wens te kennen wordt gegeven dat het onderwerp van de algemene
      maatregel van bestuur bij wet wordt geregeld. In dat geval wordt een daartoe strekkend voorstel van wet zo spoedig
      mogelijk ingediend. Indien het voorstel van wet wordt ingetrokken of indien een van de beide Kamers van de Staten-
      Generaal besluit het voorstel niet aan te nemen, wordt de algemene maatregel van bestuur ingetrokken.

      3 In afwijking van het eerste lid bedraagt de verschuldigde belasting 52 percent van de gage ingeval
      de artiest of beroepssporter zijn naam, adres of woonplaats niet aan de inhoudingsplichtige heeft
      verstrekt, dan wel zijn identiteit niet is vastgesteld en opgenomen in de loonadministratie overeenkomstig
      [artikel 35e, onderdeel e][ref2], alsmede ingeval de artiest of beroepssporter ter zake onjuiste gegevens heeft
      verstrekt en de inhoudingsplichtige dit weet of redelijkerwijs moet weten.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel35e
