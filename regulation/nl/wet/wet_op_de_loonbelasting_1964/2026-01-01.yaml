  - number: '12'
    text: |-
      Bij ministeriële regeling kunnen, in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid,
      regels worden gesteld met betrekking tot het bedrag aan fooien en dergelijke prestaties van derden, dat in bepaalde
      gevallen of groepen van gevallen geacht wordt te zijn genoten. Daarbij kan worden bepaald, dat een bedrag aan
      fooien en dergelijke prestaties van derden niet tot het loon behoort.
    url: https://wetten.overheid.nl/BWBR0002471/2026-01-01#Artikel12
  - number: 12a
    text: |-
      1 Ten aanzien van de werknemer die arbeid verricht ten behoeve van een lichaam waarin hij of zijn partner een
      aanmerkelijk belang heeft, wordt het in het kalenderjaar van dat lichaam genoten loon ten minste gesteld op het
      hoogste van de volgende bedragen:

      a. het loon uit de meest vergelijkbare dienstbetrekking;

      b. het hoogste loon van de werknemers die in dienst zijn van het lichaam, bedoeld in de aanhef, of met het lichaam
      verbonden lichamen;

      c. € 58.000.

      2 Indien de inhoudingsplichtige aannemelijk maakt dat het hoogste bedrag, bedoeld in het eerste lid, hoger is dan
      het loon uit de meest vergelijkbare dienstbetrekking, wordt het loon in afwijking van het eerste lid gesteld op het
      loon uit de meest vergelijkbare dienstbetrekking.

      3 Indien [artikel 32d][ref1] van toepassing is op het door een of meer lichamen verschuldigde loon, worden het
      eerste en tweede lid toegepast alsof de ten behoeve van deze andere lichamen verrichte arbeid is verricht ten
      behoeve van de inhoudingsplichtige die ingevolge artikel 32d geacht wordt het loon te verstrekken.

      4 Het eerste en tweede lid zijn niet van toepassing indien het bij toepassing van het eerste tot en met derde
      lid vast te stellen loon voor de arbeid in het lichaam, bedoeld in het eerste lid, en met het lichaam verbonden
      lichamen in het kalenderjaar niet hoger is dan € 5.000.

      5 Voor de toepassing van dit artikel wordt verstaan onder:

      a. partner: een in [artikel 3.91, tweede lid, onderdeel b, onder 1°, van de Wet inkomstenbelasting 2001][ref2]
      aangeduide persoon;

      b. een aanmerkelijk belang: een aanmerkelijk belang in de zin van de [Wet inkomstenbelasting 2001][ref3];

      c. meest vergelijkbare dienstbetrekking: de dienstbetrekking die van alle dienstbetrekkingen:

      1°. waarbij een aanmerkelijk belang geen rol speelt;

      2°. die bekend zijn bij de inhoudingsplichtige en de inspecteur;

      3°. waarvan het loon bekend is of in redelijkheid geschat kan worden; en

      4°. waarvan het loon niet op een ander bedrag is vastgesteld dan in het economische verkeer gebruikelijk is;

      het meest vergelijkbaar is met de dienstbetrekking van de werknemer, bedoeld in het eerste lid, aanhef;

      d. met het lichaam verbonden lichamen: met het lichaam verbonden vennootschappen als bedoeld in
      [artikel 10a, zevende lid][ref4].

      6 De inspecteur die aannemelijk maakt dat het loon uit de meest vergelijkbare dienstbetrekking hoger is dan het
      bedrag waarop het loon door de inhoudingsplichtige gesteld is, overlegt aan de inhoudingsplichtige ten minste de
      criteria op basis waarvan de inspecteur heeft vastgesteld dat de door de inspecteur aangedragen dienstbetrekking de
      meest vergelijkbare dienstbetrekking is.

      7 Het in het eerste lid vermelde bedrag wordt bij het begin van het kalenderjaar bij ministeriële regeling
      vervangen door een ander. Dit bedrag wordt berekend door het te vervangen bedrag te vermenigvuldigen met de
      tabelcorrectiefactor van [artikel 10.2 van de Wet inkomstenbelasting 2001][ref5] en vervolgens de nodig geachte
      afronding aan te brengen. Indien in het voorafgaande jaar een dergelijke afronding is toegepast, kan bij vervanging
      worden uitgegaan van het niet-afgeronde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel32d
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3.91
      [ref3]: https://wetten.overheid.nl/BWBR0011353
      [ref4]: https://wetten.overheid.nl/BWBR0002471#Artikel10a
      [ref5]: https://wetten.overheid.nl/BWBR0011353#Artikel10.2
