    text: |-
      1 Indien een pensioenregeling op grond van [artikel 150f van de Pensioenwet][ref1] of
      [artikel 145e van de Wet verplichte beroepspensioenregeling][ref2] voorziet in een compensatie wordt het
      percentage, bedoeld in [artikel 18a, eerste lid][ref3], met 3 procentpunt verhoogd. De premie voor het
      ouderdomspensioen en partnerpensioen bij overlijden op of na pensioendatum bedraagt zonder de premie ten behoeve
      van de compensatie ten hoogste het percentage, bedoeld in artikel 18a, eerste lid, van de pensioengrondslag
      of het percentage bedoeld in artikel 18a, derde lid, laatste zin, indien is gekozen voor een verlaagde
      franchise. De eerste en tweede zin zijn van overeenkomstige toepassing op de pensioenregeling van een directeur-
      grootaandeelhouder als bedoeld in [artikel 1 van de Pensioenwet][ref4].

      2 Voor het deel van de premie voor ouderdomspensioen en partnerpensioen bij overlijden op of na pensioendatum ten
      behoeve van compensatie, bedoeld in het eerste lid, dient de pensioengrondslag te worden gehanteerd, bedoeld in
      [artikel 18a, tweede lid][ref5], waarbij artikel 18a, derde lid, laatste zin, niet van toepassing is.


