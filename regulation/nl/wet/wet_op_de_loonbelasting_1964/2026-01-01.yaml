  - number: '4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regelen worden gesteld, ingevolge welke eveneens als
      dienstbetrekking wordt beschouwd de arbeidsverhouding van:

      a. degene, die als thuiswerker arbeid verricht;

      b. degene, die de onder *a* bedoelde persoon als hulp bij het verrichten van de arbeid bijstaat;

      c. degene, die een tak van sport op topniveau beoefent en ter zake daarvan een inkomensvoorziening of een
      kostenvergoeding geniet;

      d. degene, die arbeid verricht ten behoeve van een lichaam waarin hij of zijn partner als bedoeld
      in [artikel 12a, vijfde lid, onderdeel a][ref1], een aanmerkelijk belang heeft in de zin van de
      [Wet inkomstenbelasting 2001][ref2];

      e. degene, die tegen beloning persoonlijk arbeid verricht en wiens arbeidsverhouding niet reeds ingevolge de
      voorgaande bepalingen als dienstbetrekking wordt beschouwd, doch hiermede maatschappelijk gelijk kan worden
      gesteld;

      f. degene die uit een arbeidsverhouding die niet op grond van een andere bepaling als dienstbetrekking wordt
      beschouwd een beloning geniet, mits diegene vooraf aan de inspecteur meldt, door middel van een gezamenlijke
      verklaring van hemzelf en de beoogde inhoudingsplichtige, dat zijn arbeidsverhouding als dienstbetrekking moet
      worden beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0002471/2026-01-01#Artikel4
