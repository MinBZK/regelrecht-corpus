  - number: '3'
    text: |-
      1 Als dienstbetrekking wordt beschouwd de arbeidsverhouding van:

      a. degene, die, anders dan in de uitoefening van een bedrijf of in de zelfstandige uitoefening van een
      beroep, en anders dan als thuiswerker, ingevolge een overeenkomst tot aanneming van werk als bedoeld in
      [artikel 750 van Boek 7 van het Burgerlijk Wetboek][ref1], persoonlijk een werk tot stand brengt;

      b. degene, die de in onderdeel a bedoelde persoon bij het tot stand brengen van dat werk bijstaat;

      c. degene, die krachtens overeenkomst met een ander tegen beloning geregeld zijn bemiddeling verleent tot het tot
      stand komen van overeenkomsten tussen daartoe door hem te bezoeken personen en die ander, mits hij de bedoelde
      bemiddeling uitsluitend voor die ander verleent, het verlenen van die bemiddeling niet een voor hem bijkomstige
      werkzaamheid is en hij zich daarbij doorgaans niet door meer dan twee andere personen laat bijstaan;

      d. degene, die krachtens overeenkomst met een ander tegen beloning geregeld zijn bemiddeling verleent tot het tot
      stand komen van overeenkomsten tussen daartoe door hem te bezoeken personen en een opdrachtgever van die ander,
      mits hij de bedoelde bemiddeling uitsluitend voor die ander verleent, het verlenen van die bemiddeling niet een
      voor hem bijkomstige werkzaamheid is en hij zich daarbij doorgaans niet door meer dan twee andere personen laat
      bijstaan;

      e. degene, die werkzaam is om vakbekwaamheid te verwerven, onder wie mede wordt begrepen degene, die als leerling
      van een instelling van onderwijs praktisch werkzaam is, alsmede degene, die aan een bedrijfsschool opleiding
      ontvangt, een en ander indien een beloning wordt genoten, die niet uitsluitend bestaat in het ontvangen van
      onderricht;

      f. het kind van 15 jaar of ouder dat werkzaam is in de onderneming van zijn ouder, tenzij die onderneming
      deel uitmaakt van een samenwerkingsverband met het kind en het kind daaruit als ondernemer als bedoeld in
      [artikel 3.4 van de Wet inkomstenbelasting 2001][ref2] winst uit onderneming geniet;

      g. degene, die in de zin van [artikel 4 van de Ziektewet][ref3] (Stb. 1987, 88) als bestuurder werkzaam is ten
      behoeve van een coöperatie;

      h. de bestuurder van een vennootschap als bedoeld in
      [artikel 132, derde lid, van Boek 2 van het Burgerlijk Wetboek][ref4], mits hij geen niet uitvoerende bestuurder
      als bedoeld in [artikel 129a, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref5] is.

      2 Het eerste lid, onderdelen a en b, vindt geen toepassing indien de in onderdeel a bedoelde overeenkomst
      rechtstreeks is aangegaan met een natuurlijk persoon ten behoeve van diens persoonlijke aangelegenheden.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel750
