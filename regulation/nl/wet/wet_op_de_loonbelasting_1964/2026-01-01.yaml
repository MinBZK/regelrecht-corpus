  - number: 11c
    text: |-
      Bij de bepaling van de omvang van het loon wordt geen rekening gehouden met de omstandigheid dat met toepassing
      van [artikel 34, tweede lid][ref1], of [artikel 41 van de Wet financiering sociale verzekeringen][ref2]
      bedragen op de werknemer worden verhaald of met de omstandigheid dat met toepassing van
      [artikel 59, achtste lid, van die wet][ref3] de op de voet van [hoofdstuk 3 van die wet][ref4] verschuldigde
      premies worden nageheven van de werknemer.


