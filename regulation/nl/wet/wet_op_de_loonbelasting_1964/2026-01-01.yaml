  - number: 13ter
    text: |-
      1 Indien ook voor privédoeleinden een fiets ter beschikking is gesteld, wordt het voordeel op kalenderjaarbasis
      gesteld op 7% van de waarde van de fiets. De fiets wordt in ieder geval geacht ook voor privédoeleinden ter
      beschikking te zijn gesteld indien de fiets ook voor woon-werkverkeer ter beschikking is gesteld.

      2 Het voordeel wordt in aanmerking genomen voor zover het uitgaat boven de vergoeding die de werknemer voor het
      gebruik voor privédoeleinden is verschuldigd.

      3 Voor de toepassing van dit artikel wordt onder een fiets mede verstaan een bromfiets als bedoeld in
      [artikel 1, eerste lid, onderdeel e, van de Wegenverkeerswet 1994][ref1], indien deze mede door menselijke
      spierkracht wordt aangedreven en is uitgerust met een elektromotor.

      4 Voor de toepassing van dit artikel wordt onder de waarde van de fiets verstaan de in Nederland door de fabrikant
      of importeur publiekelijk kenbaar gemaakte consumentenadviesprijs van de fiets. Indien voor de fiets geen
      consumentenadviesprijs beschikbaar is, wordt aangesloten bij de consumentenadviesprijs van de meest vergelijkbare
      fiets.

      5 Indien de fiets niet meer dan bijkomstig bij het woon- of verblijfadres van de werknemer wordt gestald, wordt het
      voordeel in afwijking van het eerste lid gesteld op nihil. Van stallen wordt geacht geen sprake te zijn indien de
      werknemer in de periode waarin de fiets zich bij het woon- of verblijfadres bevindt niet de beschikkingsmacht over
      de fiets heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
