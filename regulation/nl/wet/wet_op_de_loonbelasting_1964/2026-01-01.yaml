  - number: '27'
    text: |-
      1 De belasting wordt geheven door inhouding op het loon.

      2 De inhoudingsplichtige is verplicht de belasting in te houden op het tijdstip waarop het loon wordt genoten.

      3 De inhouding vindt plaats volgens de op het tijdstip van inhouding voor de werknemer geldende loonbelastingtabel.

      4 Overtreft de belasting het van de inhoudingsplichtige genoten loon in geld, dan wordt het ontbrekende geacht te
      zijn ingehouden op het in het tweede lid omschreven tijdstip, met dien verstande dat de inhoudingsplichtige bevoegd
      is dat ontbrekende te verhalen op de werknemer.

      Ingeval [artikel 27b, eerste lid][ref1], toepassing vindt, is de vorige volzin van overeenkomstige toepassing met
      betrekking tot het gezamenlijke bedrag van de belasting en de premie voor de volksverzekeringen.

      5 De inhoudingsplichtige is verplicht de in een tijdvak ingehouden belasting op aangifte af te dragen.

      6 Onder bij ministeriële regeling te stellen voorwaarden kunnen ten aanzien van een in de onderneming van zijn
      ouder werkzaam kind dat behoort tot de huishouding van die ouder en niet is verzekerd ingevolge enige andere
      sociale verzekering dan een volksverzekering in de zin van de [Wet financiering sociale verzekeringen][ref2] of
      de zorgverzekering in de zin van de [Zorgverzekeringswet][ref3], een van het tweede lid afwijkend tijdstip van
      inhouding en een van het derde lid afwijkende loonbelastingtabel worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel27b
      [ref2]: https://wetten.overheid.nl/BWBR0017745
      [ref3]: https://wetten.overheid.nl/BWBR0018450
