  - number: 28b
    text: |-
      1 Indien de inhoudingsplichtige de correcties, bedoeld in [artikel 28a, tweede lid][ref1], niet, onjuist,
      onvolledig dan wel niet binnen de gestelde termijn heeft ingediend, vormt dit een verzuim terzake waarvan de
      inspecteur hem een bestuurlijke boete van ten hoogste € 1.675 kan opleggen.

      2 De bevoegdheid tot het opleggen van een bestuurlijke boete wegens het feit, bedoeld in
      [artikel 28a, tweede lid, aanhef en onderdelen a en c][ref2], vervalt door verloop van vijf jaar na het einde van
      het kalenderjaar van de aangifte waarop het correctiebericht betrekking had moeten hebben.

      3 De bevoegdheid tot het opleggen van een bestuurlijke boete wegens het feit, bedoeld in
      [artikel 28a, tweede lid, aanhef en onderdelen b en d][ref3], vervalt door verloop van een jaar na het einde van de
      termijn waarbinnen het correctiebericht had moeten worden gedaan.

      4 Aan de inhoudingsplichtige die een onjuiste of onvolledige aangifte heeft gedaan en die alsnog de
      juiste of volledige gegevens door middel van een correctiebericht als bedoeld in [artikel 28a][ref4]
      verstrekt voordat hij weet of redelijkerwijs moet vermoeden dat de inspecteur met de onjuistheid
      of onvolledigheid bekend is of bekend zal worden, wordt een bestuurlijke boete als bedoeld in
      [artikel 67b, tweede lid, van de Algemene wet inzake rijksbelastingen][ref5] ter zake van het feit van de onjuiste
      of onvolledige aangifte niet opgelegd.

      5 [Artikel 67cb van de Algemene wet inzake rijksbelastingen][ref6] is van overeenkomstige toepassing op het in het
      eerste lid genoemde bedrag.


