  - number: 35i
    text: |-
      1 De belasting wordt geheven door inhouding op de gage.

      2 De inhoudingsplichtige is verplicht de belasting in te houden op het tijdstip waarop de gage wordt ontvangen.

      3 De inhoudingsplichtige is verplicht de ingehouden belasting op aangifte af te dragen.
    url: https://wetten.overheid.nl/BWBR0002471/2026-01-01#Artikel35i
  - number: 35k
    text: |-
      De leden van het buitenlandse gezelschap zijn gehouden volgens bij ministeriële regeling te stellen regels aan
      het gezelschap:

      a. opgave te doen van gegevens waarvan de kennisneming voor de heffing van de belasting van belang kan zijn;

      b. inzage te verlenen van een op hen betrekking hebbend document als bedoeld in
      [artikel 1, eerste lid, onder 1º tot en met 3º, van de Wet op de identificatieplicht][ref1], en een afschrift
      daarvan te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002471/2026-01-01#Artikel35k
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 35l
    text: |-
      1 Het buitenlandse gezelschap is gehouden volgens bij ministeriële regeling te stellen regels:

      a. van de leden van het gezelschap opgave te verlangen van gegevens waarvan de kennisneming voor de heffing van de
      belasting van belang kan zijn;

      b. de identiteit van de leden vast te stellen aan de hand van een document als bedoeld in
      [artikel 1, eerste lid, onder 1º tot en met 3º, van de Wet op de identificatieplicht][ref1] en een afschrift
      daarvan te verlangen;

      c. aan de inhoudingsplichtige opgave te doen van gegevens waarvan de kennisneming voor de heffing van de belasting
      van belang kan zijn;

      d. aan de inhoudingsplichtige ten aanzien van het merendeel van de leden inzage te verlenen van een document als
      bedoeld in [artikel 1, eerste lid, onder 1º tot en met 3º, van de Wet op de identificatieplicht][ref2] om een
      afschrift daarvan in de loonadministratie van de inhoudingsplichtige te laten opnemen.

      2 Opgave van naam, adres, woonplaats, woonland en geboortedatum van de leider of vertegenwoordiger alsmede het
      aantal leden van het gezelschap, en opgave van de overige in [dit artikel][ref3] bedoelde gegevens geschiedt door
      middel van de door de inspecteur verstrekte gageverklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel35l
