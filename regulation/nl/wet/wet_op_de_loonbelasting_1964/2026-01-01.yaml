  - number: 18a
    text: |-
      1 De premie per dienstjaar voor een ouderdomspensioen en een partnerpensioen bij overlijden op of na pensioendatum
      bedraagt ten hoogste 30% van de pensioengrondslag. Bij of krachtens algemene maatregel van bestuur kunnen regels
      worden gesteld met betrekking tot de kosten die zijn begrepen in de premie, bedoeld in de eerste zin.

      2 De pensioengrondslag bestaat uit het pensioengevend loon verminderd met de franchise.

      3 De franchise, bedoeld in het tweede lid, bedraagt € 19.172. Dit bedrag wordt bij het begin van het
      kalenderjaar bij ministeriële regeling vervangen door een ander bedrag. Dit bedrag wordt berekend
      door de voor dat jaar geldende uitkeringen voor gehuwde personen zonder toeslag als omschreven in
      [artikel 9, eerste lid, onderdeel b, en vijfde lid, van de Algemene Ouderdomswet][ref1], vermeerderd met de
      vakantietoeslag, te vermenigvuldigen met de factor 100/75. Bij of krachtens algemene maatregel van bestuur kan
      worden bepaald dat een lager bedrag in aanmerking kan worden genomen dan het bedrag, genoemd in de eerste zin,
      indien een lager percentage per dienstjaar wordt toegepast dan het percentage, genoemd in het eerste lid.

      4 Een ouderdomspensioen:

      a. gaat niet eerder in dan op de eerste dag van de kalendermaand waarin de werknemer of gewezen werknemer de
      leeftijd bereikt die tien jaar lager is dan de voor het betreffende kalenderjaar geldende pensioengerechtigde
      leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref2], tenzij in de pensioenregeling
      een eerdere ingangsdatum als uiterlijke ingangsdatum is opgenomen; en

      b. gaat niet later in dan op het tijdstip waarop de werknemer of gewezen werknemer de
      leeftijd bereikt die vijf jaar hoger is dan de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref3].

      5 Een partnerpensioen bij overlijden op of na pensioendatum gaat niet eerder in dan op de eerste dag van de
      kalendermaand waarin de werknemer of gewezen werknemer is overleden en gaat niet later in dan op de eerste dag van
      de maand volgend op de kalendermaand waarin de werknemer of gewezen werknemer is overleden.

      6 Het percentage, genoemd in het eerste lid, wordt bij of krachtens algemene maatregel van bestuur elke vijf
      jaar, bij het begin van het kalenderjaar, voor het eerst per 1 januari 2037, gewijzigd. Een wijziging ingevolge de
      eerste zin wordt bekendgemaakt ten minste drie kalenderjaren voordat deze toepassing vindt. Het percentage, genoemd
      in het eerste lid, wordt bepaald aan de hand van de volgende tabel waarbij het rendement voor de toepassing van
      deze tabel wordt bepaald per 1 oktober (peildatum) van het derde kalenderjaar voorafgaande aan het kalenderjaar
      van wijziging op basis van het 27e percentiel van de per scenario bepaalde gemiddelde jaarlijkse netto reële
      rendementsverwachting over de eerste zestig jaar in de meest recente door De Nederlandsche Bank gepubliceerde
      scenarioset, gebaseerd op [artikel 144, eerste lid, onderdeel d, van de Pensioenwet][ref4], uitgaande van een
      portefeuille voor de helft bestaande uit risicovrije AAA-staatsobligaties met een looptijd van 30 jaar en voor de
      helft bestaande uit beursgenoteerde aandelen.









