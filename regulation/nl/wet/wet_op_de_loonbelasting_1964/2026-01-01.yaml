      1 Voor de werknemer is de algemene heffingskorting van toepassing.

      2 De algemene heffingskorting bedraagt € 3.115, verminderd, doch niet verder dan tot nihil, met 6,398% van het
      gedeelte van het belastbare loon dat meer bedraagt dan € 29.736.
    url: https://wetten.overheid.nl/BWBR0002471/2026-01-01#Artikel22
  - number: 22a
    text: |-
      1 Voor de werknemer die loon uit tegenwoordige arbeid geniet, is de arbeidskorting van toepassing.

      2 De arbeidskorting wordt berekend over het loon uit tegenwoordige arbeid en bedraagt:

      a. 8,324% van dat loon met een maximum van € 996, vermeerderd met:

      b. 31,009% van dat loon voorzover dit bij een tijdvakloon op jaarbasis meer bedraagt dan € 11.965, waarbij de som
      van de bedragen berekend op de voet van de onderdelen a en b niet meer bedraagt dan € 5.300, alsmede vermeerderd
      met:

      c. 1,950% van het arbeidsinkomen voor zover dat meer bedraagt dan € 25.845, waarbij de som van de bedragen berekend
      op de voet van de onderdelen a, b en c niet meer bedraagt dan € 5.685, en verminderd, doch niet verder dan tot
      nihil, met:

      d. 6,51% van dat loon voorzover dit bij een tijdvakloon op jaarbasis meer bedraagt dan € 45.592.

      3 Met loon uit tegenwoordige arbeid wordt gelijkgesteld:

      a. loon genoten wegens tijdelijke inactiviteit als bedoeld in
      [artikel 628 van Boek 7 van het Burgerlijk Wetboek][ref1], alsmede hetgeen door de werknemer met een
      publiekrechtelijke dienstbetrekking wordt genoten op grond van naar aard en strekking overeenkomstige regelingen,
      voor een tijdvak van maximaal 104 weken;

      b. loon genoten als garantieloon als bedoeld in
      [artikel 628a, eerste, derde en achtste lid, van Boek 7 van het Burgerlijk Wetboek][ref2];

      c. loon genoten wegens tijdelijke arbeidsongeschiktheid als bedoeld in
      [artikel 629 van Boek 7 van het Burgerlijk Wetboek][ref3], alsmede hetgeen door de werknemer met een
      publiekrechtelijke dienstbetrekking wordt genoten op grond van naar aard en strekking overeenkomstige regelingen
      en uitkeringen ingevolge de [Ziektewet][ref4], voor zover die betrekking hebben op de periode waarin de
      dienstbetrekking in de zin van die wet nog niet is beëindigd of voor zover die voortvloeien uit een vrijwillige
      verzekering als bedoeld in [artikel 64 van die wet][ref5];

      d. uitkeringen op grond van de [Wet arbeid en zorg][ref6] en aanvullingen daarop door degene tot wie de
      belastingplichtige in dienstbetrekking staat.


