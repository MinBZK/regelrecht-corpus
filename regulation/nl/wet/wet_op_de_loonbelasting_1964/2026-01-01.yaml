  - number: 28a
    text: |-
      1 Bij ministeriële regeling wordt bepaald van welke gegevens opgave wordt verlangd in geval van een onjuiste
      of onvolledige aangifte en kunnen regels worden gesteld over de wijze waarop, de vorm waarin en de termijnen
      waarbinnen die gegevens worden verstrekt.

      2 De inhoudingsplichtige of gewezen inhoudingsplichtige is gehouden, al dan niet op verzoek van de inspecteur, door
      middel van een correctiebericht de juiste en volledige gegevens, bedoeld in het eerste lid, te verstrekken indien:

      a. hij in het kalenderjaar met betrekking tot een aangifte over een tijdvak in het kalenderjaar constateert dat die
      aangifte onjuist of onvolledig is;

      b. de inspecteur in het kalenderjaar met betrekking tot een aangifte over een tijdvak in het kalenderjaar
      constateert dat die aangifte onjuist of onvolledig is;

      c. hij binnen vijf jaren na het einde van een verstreken kalenderjaar met betrekking tot een aangifte over een
      tijdvak in dat kalenderjaar constateert dat die aangifte onjuist of onvolledig is en:

      1°. die aangifte niet is hersteld;

      2°. de aangiftetermijn van de laatste aangifte over dat kalenderjaar is verstreken;

      d. de inspecteur binnen vijf jaren na het einde van een verstreken kalenderjaar met betrekking tot een aangifte
      over een tijdvak in dat kalenderjaar constateert dat die aangifte onjuist of onvolledig is en:

      1°. die aangifte niet is hersteld;

      2°. de aangiftetermijn van de laatste aangifte over dat kalenderjaar is verstreken.

      3 Een correctiebericht als bedoeld in het tweede lid is geen bezwaarschrift in de zin van de
      [Algemene wet inzake rijksbelastingen][ref1].

      4 Indien bij de aangifte een correctiebericht is ingediend en het saldo van de te betalen belasting
      van de aangifte en het correctiebericht positief is, is de inhoudingsplichtige, in zoverre in
      afwijking van [artikel 19, eerste lid, van de Algemene wet inzake rijksbelastingen][ref2], gehouden
      dit saldo aan de ontvanger te betalen. Voorzover het bedrag van het correctiebericht in mindering
      wordt gebracht op de bij de aangifte te betalen belasting, wordt belastingrente vergoed overeenkomstig
      [hoofdstuk VA van de Algemene wet inzake rijksbelastingen][ref3]. De inspecteur stelt het bedrag van de
      belastingrente vast bij voor bezwaar vatbare beschikking.

      5 Bij toepassing van het vorige lid wordt een betaling zoveel mogelijk toegerekend aan het correctiebericht.

      6 Voor toepassing van de [artikelen 20][ref4], [67c][ref5] en
      [67f van de Algemene wet inzake rijksbelastingen][ref6], wordt met geheel of gedeeltelijk niet betaald zijn van
      belasting die op aangifte behoort te worden afgedragen gelijkgesteld het geval waarin naar aanleiding van een
      ingediend correctiebericht te veel is gesaldeerd of teruggegeven.

      7 In aanvulling op [artikel 20, derde lid, van de Algemene wet inzake rijksbelastingen][ref7] vervalt, indien te
      veel is gesaldeerd, de bevoegdheid tot naheffing door verloop van vijf jaren na het einde van het kalenderjaar
      waarin de saldering heeft plaatsgevonden.


