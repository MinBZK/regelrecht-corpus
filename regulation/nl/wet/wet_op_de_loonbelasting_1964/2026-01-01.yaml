  - number: 13a
    text: |-
      1 Loon wordt beschouwd te zijn genoten op het tijdstip waarop het:

      a. betaald of verrekend wordt, ter beschikking van de werknemer wordt gesteld of rentedragend wordt, dan wel

      b. vorderbaar en tevens inbaar wordt.

      2 Indien is overeengekomen dat het loon geheel of gedeeltelijk op een ongebruikelijk tijdstip zal worden genoten,
      wordt daarmee voor de toepassing van het eerste lid geen rekening gehouden.

      3 Voor zover ingevolge [artikel 12a][ref1] het loon hoger is dan het werkelijk genoten loon, wordt het meerdere
      geacht te zijn genoten bij het einde van het kalenderjaar of het einde van de dienstbetrekking zo deze in de loop
      van het kalenderjaar eindigt.

      4 In afwijking van het eerste lid:

      a. wordt het bedrag dat als gevolg van de toepassing van
      [artikel 10a, eerste lid, onderdeel a, onder 1°, of twaalfde lid][ref2] tot het loon behoort geacht te zijn
      genoten ten tijde van de uitoefening van het aandelenoptierecht, bedoeld in artikel 10a, eerste lid, onderdeel a,
      onder 1°;

      b. wordt het bedrag dat als gevolg van de toepassing van [artikel 10a, eerste lid, onderdeel a, onder 2°][ref3],
      tot het loon behoort geacht te zijn genoten ten tijde van het verhandelbaar worden van de aandelen, bedoeld in
      artikel 10a, eerste lid, onderdeel a, onder 2°;

      c. wordt het bedrag dat als gevolg van de toepassing van [artikel 10a, elfde lid][ref4], tot het loon behoort
      geacht te zijn genoten ten tijde van de vervreemding van de aandelen, bedoeld in artikel 10a, elfde lid;

      d. wordt loon dat ingevolge [artikel 27bis][ref5] is begrepen in de laatste aangifte van het kalenderjaar, geacht
      te zijn genoten bij het einde van het kalenderjaar of het einde van de dienstbetrekking zo deze in de loop van het
      kalenderjaar eindigt;

      e. worden vergoedingen ter zake van vervoer in het kader van de dienstbetrekking, waaronder woon-werkverkeer, op
      andere wijze dan per taxi, luchtvaartuig, schip of vervoer vanwege de inhoudingsplichtige, voor zover deze € 0,23
      per kilometer te boven gaan en voor zover deze niet hoger zijn dan de werkelijke kosten, geacht te zijn genoten
      bij het einde van het kalenderjaar of bij het einde van de dienstbetrekking zo deze in de loop van het kalenderjaar
      eindigt, indien in het kalenderjaar ook vergoedingen ter zake van de hiervoor bedoelde wijze van vervoer zijn of
      naar verwachting zullen worden berekend naar een bedrag van minder dan € 0,23 per kilometer.

      5 Het vierde lid, onderdeel e, is niet van toepassing op vergoedingen ter zake van vervoer in het kader van de
      dienstbetrekking, waaronder woon-werkverkeer, per openbaar vervoer indien deze vergoedingen zijn vastgesteld op
      basis van de werkelijke kosten.

      6 Voor de toepassing van het vierde lid, onderdeel e, wordt onder vervoer vanwege de inhoudingsplichtige verstaan:

      1°. vanwege de inhoudingsplichtige georganiseerd vervoer;

      2°. het reizen per openbaar vervoer op basis van door de inhoudingsplichtige aangeschafte en door hem aan de
      werknemer verstrekte plaatsbewijzen.

      7 In afwijking van het eerste lid wordt loon dat door de inhoudingsplichtige overeenkomstig een door hem bestendig
      gevolgde gedragslijn aan een eerder in het kalenderjaar gelegen tijdvak wordt toegerekend dan het tijdvak waarin
      het ingevolge het eerste lid wordt genoten, geacht in dat eerdere tijdvak te zijn genoten.


