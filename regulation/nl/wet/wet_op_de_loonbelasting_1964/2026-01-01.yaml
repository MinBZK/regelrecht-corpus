  - number: 31a
    text: |-
      1 Het bedrag van de verschuldigde belasting met betrekking tot vergoedingen en verstrekkingen als bedoeld in
      [artikel 31, eerste lid, onderdeel f en onderdeel g][ref1], wordt per inhoudingsplichtige bepaald.

      2 De verschuldigde belasting met betrekking tot vergoedingen en verstrekkingen als bedoeld in
      [artikel 31, eerste lid, onderdeel f en onderdeel g][ref2], wordt bepaald naar een tarief van 80%, met dien
      verstande dat deze vergoedingen en verstrekkingen worden verminderd, maar niet verder dan tot nihil, met het bedrag
      aan vrije ruimte als bedoeld in het derde lid, alsmede met vergoedingen en verstrekkingen als bedoeld in artikel
      31, eerste lid, onderdeel f en onderdeel g, ter zake of in de vorm van:

      a. vervoer in het kader van de dienstbetrekking, waaronder woon-werkverkeer:

      1°. indien het vervoer plaatsvindt per taxi, luchtvaartuig, schip of vervoer vanwege de inhoudingsplichtige of met
      een verstrekt recht op vermindering van de prijs van openbaarvervoerbewijzen: tot de werkelijke kosten, met dien
      verstande dat de vermindering niet geldt voor vergoedingen ter zake van vervoer vanwege de inhoudingsplichtige
      en met dien verstande dat de vermindering ten minste geldt tot de kosten van een verstrekt recht op vrij reizen
      per openbaar vervoer of een verstrekt recht op vermindering van de prijs van openbaarvervoerbewijzen, indien het
      vervoer plaatsvindt met gebruikmaking van het betreffende recht;

      2°. indien het vervoer plaatsvindt per openbaar vervoer, anders dan in de vorm van vervoer vanwege de
      inhoudingsplichtige, en de vergoedingen hoger zijn dan € 0,23 per kilometer en zijn vastgesteld op basis van de
      werkelijke kosten: tot de werkelijke kosten met dien verstande dat de vermindering ten minste geldt tot de kosten
      van een vergoed recht op vrij reizen per openbaar vervoer of een vergoed recht op vermindering van de prijs van
      openbaarvervoerbewijzen, indien het vervoer plaatsvindt met gebruikmaking van het betreffende recht;

      3°. in de overige situaties: tot € 0,23 per afgelegde kilometer;

      met dien verstande dat ingeval voor het vervoer, niet zijnde vervoer per taxi, luchtvaartuig, schip of vervoer
      vanwege de inhoudingsplichtige, een vaste vergoeding wordt gegeven aan een werknemer die op ten minste 128 dagen
      per kalenderjaar naar een vaste plaats van werkzaamheden reist, deze vergoeding mag worden berekend alsof de
      werknemer op ten hoogste 214 dagen per kalenderjaar naar die vaste plaats van werkzaamheden reist;

      b. tijdelijk verblijf in het kader van de dienstbetrekking, niet zijnde een tijdelijk verblijf als bedoeld in
      onderdeel e, alsmede maaltijden met een meer dan bijkomstig zakelijk karakter;

      c. onderhoud en verbetering van kennis en vaardigheden ter vervulling van de dienstbetrekking, daaronder mede
      begrepen de inschrijving in een beroepsregister, alsmede outplacement;

      d. het volgen van een opleiding of studie met het oog op het verwerven van inkomen uit werk en woning, daaronder
      mede begrepen het volgen van een procedure erkenning verworven competenties waarvoor een verklaring is afgegeven
      door een bij ministeriële regeling aangewezen instantie, met uitzondering van:

      1°. vergoedingen en verstrekkingen die verband houden met een werk- of studeerruimte, daaronder begrepen de
      inrichting;

      2°. vergoedingen van binnenlandse reizen voor zover de vergoeding meer bedraagt dan het bedrag dat wordt bepaald
      met overeenkomstige toepassing van onderdeel a;

      e. extra kosten van tijdelijk verblijf buiten het land van herkomst in het kader van de dienstbetrekking
      (extraterritoriale kosten), met dien verstande dat voor zover de vergoeding of verstrekking ziet op de periode
      waarin de werknemer in Nederland arbeid verricht dan wel in Nederland verblijft en in een ander land arbeid
      verricht de volgende kosten worden uitgezonderd:

      1°. uitgaven van levensonderhoud;

      2°. uitgaven voor gesprekskosten voor privédoeleinden;

      f. verhuizing in het kader van de dienstbetrekking, ter omvang van de kosten van het overbrengen van de inboedel
      vermeerderd met € 7750, waarbij bij ministeriële regeling regels kunnen worden gesteld voor de beoordeling of in
      ieder geval in het kader van de dienstbetrekking wordt verhuisd;

      g. gereedschappen, computers, mobiele communicatiemiddelen en dergelijke apparatuur, die naar het redelijke oordeel
      van de inhoudingsplichtige noodzakelijk zijn voor de behoorlijke vervulling van de dienstbetrekking, met inbegrip
      van het bijbehorende datatransport en de voor het gebruik in het kader van dienstbetrekking benodigde programmatuur
      en dergelijke, indien:

      1°. de werknemer verplicht is tot teruggaaf van deze voorziening of tot vergoeding van de restwaarde, voor zover
      de voorziening voor rekening van de inhoudingsplichtige is gekomen, op het moment dat deze voorziening naar het
      redelijke oordeel van de inhoudingsplichtige niet langer noodzakelijk is voor de behoorlijke vervulling van de
      dienstbetrekking; en

      2°. de werknemer geen werkzaamheden verricht in de functie van bestuurder of commissaris van de
      inhoudingsplichtige;

      h. bij ministeriële regeling aan te wijzen voorzieningen die geheel of gedeeltelijk op een bij die ministeriële
      regeling aan te wijzen werkplek worden gebruikt of verbruikt;

      i. branche-eigen producten van het bedrijf van de inhoudingsplichtige of van het bedrijf van een met de
      inhoudingsplichtige verbonden vennootschap, tot een bedrag van ten hoogste 20% van de waarde in het economische
      verkeer van deze producten, maar niet meer dan € 500 per werknemer per kalenderjaar;

      j. een in het kader van de dienstbetrekking aangevraagde verklaring omtrent het gedrag als bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref3] of daarmee vergelijkbare buitenlandse
      verklaring;

      k. thuiswerken in het kader van de dienstbetrekking tot € 2,45 per thuiswerkdag, daaronder begrepen een gedeelte
      van een thuiswerkdag, met dien verstande dat ingeval voor thuiswerken een vaste vergoeding wordt gegeven aan een
      werknemer die op ten minste 128 dagen per kalenderjaar thuiswerkt, deze vergoeding mag worden berekend alsof de
      werknemer op ten hoogste 214 dagen per kalenderjaar thuiswerkt.

      3 De vrije ruimte bedraagt:

      a. 2% van het loon waarover met toepassing van de [artikelen 20a][ref4], [20b][ref5], [26][ref6] en [26b][ref7]
      belasting wordt geheven voor zover dat loon niet meer bedraagt dan € 400.000, vermeerderd met:

      b. 1,18% van het loon waarover met toepassing van de [artikelen 20a][ref8], [20b][ref9], [26][ref10] en
      [26b][ref11] belasting wordt geheven voor zover dat loon meer bedraagt dan € 400.000.

      4 In afwijking in zoverre van het tweede lid worden vergoedingen en verstrekkingen als bedoeld in
      [artikel 31, eerste lid, onderdeel f en onderdeel g][ref12], bij de bepaling van de daarover verschuldigde
      belasting niet verminderd met vaste vergoedingen ter zake van de in het tweede lid bedoelde kosten ingeval aan deze
      vergoedingen geen onderzoek naar de werkelijk gemaakte kosten ten grondslag ligt.

      5 Voor de toepassing van het tweede lid wordt onder vervoer vanwege de inhoudingsplichtige verstaan: vervoer als
      bedoeld in [artikel 13a, zesde lid][ref13].

      6 Voor de toepassing van dit artikel worden vergoedingen ter zake van vervoer als bedoeld in het tweede lid,
      onderdeel a, onder 3°, geacht niet hoger te zijn dan € 0,23 per afgelegde kilometer voor zover deze vergoedingen
      in totaal niet meer hebben bedragen dan het aantal in het kalenderjaar in dit kader afgelegde kilometers
      vermenigvuldigd met € 0,23.

      7 Voor de berekening van de in het tweede lid, onderdelen a en k, bedoelde vaste vergoeding ter zake van vervoer,
      onderscheidenlijk thuiswerken, worden de in die onderdelen genoemde aantallen dagen:

      a. vermenigvuldigd met vier vijfde, drie vijfde, twee vijfde of een vijfde ingeval de werknemer in de regel vier
      dagen, drie dagen, twee dagen, onderscheidenlijk een dag, per week naar een vaste plaats van werkzaamheden reist,
      onderscheidenlijk thuiswerkt;

      b. naar tijdsgelang herrekend bij het aanvangen of beëindigen van de betreffende vergoeding, dan wel bij een
      wijziging in de grondslag voor de berekening van de vergoeding, in de loop van het kalenderjaar.

      8 Voor bij of krachtens algemene maatregel van bestuur aan te wijzen groepen werknemers die door een
      inhoudingsplichtige van buiten Nederland in dienstbetrekking worden genomen, geldt, onder daarbij te stellen
      voorwaarden, dat vergoedingen van kosten en verstrekkingen van verblijf buiten het land van herkomst gedurende
      ten hoogste vijf jaar ten minste worden beschouwd als vergoeding voor extraterritoriale kosten tot ten hoogste
      30% van het daarbij aan te wijzen gedeelte van het loon, alsmede tot het bedrag van de daarbij aan te wijzen
      schoolgelden. Bij de toepassing van de eerste zin wordt per werknemer, naast de vergoeding of verstrekking
      van bij algemene maatregel van bestuur aan te wijzen schoolgelden, ten hoogste een bedrag aan vergoedingen
      en verstrekkingen in aanmerking genomen van 30% van het bedrag van de maximale bezoldiging, bedoeld in
      [artikel 2.3 van de Wet normering topinkomens][ref14]. Voor een werknemer waarvoor de eerste zin niet het gehele
      kalenderjaar wordt toegepast, wordt het ten hoogste in aanmerking te nemen bedrag, bedoeld in de tweede zin, naar
      tijdsgelang herrekend. Bij ministeriële regeling kunnen regels worden gesteld voor de toepassing van de tweede
      zin, ingeval de eerste zin voor dezelfde werknemer ook wordt toegepast door een of meer met de inhoudingsplichtige
      verbonden vennootschappen of door een of meer natuurlijke personen die voor ten minste een derde gedeelte belang
      hebben in de inhoudingsplichtige.

      9 Voor bij of krachtens algemene maatregel van bestuur aan te wijzen groepen werknemers die door een
      inhoudingsplichtige buiten Nederland worden uitgezonden, geldt, onder daarbij te stellen voorwaarden, dat
      vergoedingen van kosten en verstrekkingen van verblijf buiten het land van herkomst ten minste worden beschouwd als
      vergoeding voor extraterritoriale kosten tot ten hoogste 30% van het daarbij aan te wijzen gedeelte van het loon,
      alsmede tot het bedrag van de daarbij aan te wijzen schoolgelden.

      10 Het tweede lid, onderdeel g, is niet van toepassing voor zover de vergoeding of verstrekking, al dan niet in het
      kader van een wijziging van de samenstelling van de tussen de werknemer en de inhoudingsplichtige overeengekomen
      beloning, in de plaats is gekomen van een ander loonbestanddeel.

      11 Het tweede lid, onderdeel g, onder 2°, is niet van toepassing voor zover de inhoudingsplichtige aannemelijk
      maakt dat de voorziening een voor de behoorlijke vervulling van de dienstbetrekking van de desbetreffende werknemer
      gebruikelijke voorziening is.

      12 Indien op een dag zowel naar een vaste plaats van werkzaamheden wordt gereisd als wordt thuisgewerkt kan
      voor die dag slechts een van de vergoedingen of verstrekkingen ter zake of in de vorm van vervoer in het kader
      van de dienstbetrekking naar een vaste plaats van werkzaamheden als bedoeld in het tweede lid, onderdeel a,
      onderscheidenlijk thuiswerken in het kader van de dienstbetrekking als bedoeld in het tweede lid, onderdeel
      k, worden gegeven. Indien op een dag naar een vaste plaats van werkzaamheden wordt gereisd met een door de
      inhoudingsplichtige ter beschikking gestelde auto als bedoeld in [artikel 13bis][ref15], kan voor die dag niet een
      vergoeding of verstrekking ter zake of in de vorm van thuiswerken in het kader van de dienstbetrekking als bedoeld
      in het tweede lid, onderdeel k, worden gegeven.

      13 Bij het begin van het kalenderjaar wordt het in het tweede lid, onderdeel k, genoemde bedrag bij
      ministeriële regeling vervangen door een ander bedrag. Dit bedrag wordt berekend door het te vervangen bedrag te
      vermenigvuldigen met de tabelcorrectiefactor, bedoeld in [artikel 10.2 van de Wet inkomstenbelasting 2001][ref16],
      en vervolgens de nodig geachte afronding aan te brengen. Indien in het voorafgaande kalenderjaar een dergelijke
      afronding is toegepast, kan bij vervanging worden uitgegaan van het niet-afgeronde bedrag.

      14 Bij de toepassing van het tweede lid wordt, in afwijking van [artikel 13, zesde lid][ref17], de ingevolge
      artikel 13, eerste tot en met vijfde lid, in aanmerking te nemen waarde van verstrekkingen als bedoeld in
      [artikel 31, eerste lid, onderdeel f en onderdeel g][ref18], verminderd met het bedrag dat de inhoudingsplichtige
      ter zake van die verstrekkingen in totaal aan zijn werknemers in rekening heeft gebracht, met dien verstande dat de
      aldus verminderde waarde ten minste op nihil wordt gesteld.

      15 Bij de bepaling van het in het derde lid bedoelde loon wordt buiten beschouwing gelaten:

      a. loon uit vroegere dienstbetrekking indien de inhoudingsplichtige in meer dan bijkomstige mate loon uit vroegere
      dienstbetrekking verstrekt;

      b. loon ter zake waarvan de inhoudingsplichtige uitsluitend ingevolge [artikel 6, eerste lid, onderdeel c][ref19],
      inhoudingsplichtige is.

      16 De verschuldigde belasting, bedoeld in het tweede lid, wordt, in afwijking van [artikel 27a, tweede lid][ref20],
      uiterlijk aangegeven en afgedragen tegelijk met de aangifte, onderscheidenlijk afdracht, over het tweede tijdvak
      van het volgende kalenderjaar. Ingeval de inhoudingsplicht is geëindigd in de loop van het kalenderjaar wordt
      voor het tweede tijdvak van het volgende kalenderjaar, bedoeld in de eerste volzin, gelezen: het tijdvak waarin de
      inhoudingsplicht is geëindigd.

      17 Indien extraterritoriale kosten als bedoeld in het tweede lid, onderdeel e, worden vergoed aan een werknemer
      die voldoet aan de voorwaarden van het achtste lid, eerste zin, onderscheidenlijk negende lid, dient de
      inhoudingsplichtige ter zake van het eerste loontijdvak van ieder kalenderjaar waarin die werknemer aan die
      voorwaarden voldoet en die kosten door hem aan die werknemer worden vergoed een keuze te maken voor het al dan niet
      toepassen van het achtste lid, onderscheidenlijk negende lid. De keuze, bedoeld in de eerste zin, geldt voor het
      gehele kalenderjaar zolang de werknemer, bedoeld in de eerste zin, aan de voorwaarden, bedoeld in die zin, blijft
      voldoen.

      18 Indien binnen de eerste vier maanden van aanvang van de tewerkstelling als werknemer met extraterritoriale
      kosten een verzoek tot toepassing of voortgezette toepassing van de bewijsregel, bedoeld in de algemene maatregel
      van bestuur gebaseerd op het achtste lid, wordt gedaan, dient de keuze, bedoeld in het zeventiende lid, in
      afwijking in zoverre van dat lid, eerste zin, voor het eerst te worden gemaakt ter zake van het eerstvolgende
      loontijdvak na afloop van die eerste vier maanden en geldt in dat geval vanaf dat loontijdvak voor de resterende
      periode van het kalenderjaar waarin de termijn van die eerste vier maanden afloopt zolang de werknemer, bedoeld in
      het zeventiende lid, eerste zin, aan de voorwaarden, bedoeld in die zin, blijft voldoen.


