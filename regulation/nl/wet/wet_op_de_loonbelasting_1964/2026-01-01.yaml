  - number: '33'
    text: |-
      1 Ter vergemakkelijking van de heffing van belasting kunnen bij of krachtens algemene maatregel van bestuur regels
      worden gesteld betreffende:

      a. een rechtstreeks uit het familierecht voortvloeiende uitkering of verstrekking in de zin van
      [artikel 3.101, eerste lid, onderdeel b, van de Wet inkomstenbelasting 2001][ref1], ingeval hiermede rekening wordt
      gehouden bij het vaststellen van de hoogte van een periodieke uitkering ingevolge de [Participatiewet][ref2];

      b. de voorwaarden waaronder een vermindering met het loon van hulpen plaatsvindt van het loon verstrekt aan:

      1°. de uitvoerder van aangenomen werk, bedoeld in [artikel 3, eerste lid, onderdeel a][ref3], indien de in dat
      onderdeel bedoelde overeenkomst niet rechtstreeks is aangegaan met een natuurlijke persoon ten behoeve van diens
      persoonlijke aangelegenheden;

      2°. de thuiswerker, bedoeld in [artikel 4, onderdeel a][ref4];

      c. het vaststellen van tabelloon in de gevallen, bedoeld in het tweede lid, onderdeel c;

      d. het door de inhoudingsplichtige aan het einde van het kalenderjaar herrekenen van de belasting geheven over
      uitkeringen en verstrekkingen ingevolge de [Participatiewet][ref5];

      e. de inhoudingsplicht ter zake van loon dat een werknemer geniet van een derde.

      2 Bij ministeriële regeling kunnen aanvullende regels worden gesteld betreffende:

      a. de heffing van de belasting ingeval loon van meer dan één inhoudingsplichtige of mede loon van een derde, dan
      wel over enig tijdvak meer dan één beloning wordt genoten;

      b. inhouding van geschatte bedragen, gevolgd door periodieke afrekening;

      c. het vaststellen van loonbelastingtabellen voor:

      1°. degenen die uitkeringen of verstrekkingen ontvangen ingevolge de [Participatiewet][ref6];

      2°. uitvoerders van aangenomen werk, hun hulpen, degenen van wie de arbeidsverhouding op grond van
      [artikel 4, onderdeel a, b of e][ref7], als dienstbetrekking wordt beschouwd en bij ministeriële regeling
      aangewezen sekswerkers van wie de arbeidsverhouding bij of krachtens algemene maatregel van bestuur als
      dienstbetrekking wordt beschouwd.

      Voor de gevallen waarin [artikel 27b, eerste lid][ref8], toepassing vindt, worden deze tabellen zodanig vastgesteld
      dat telkens de belasting en de premie voor de volksverzekeringen in één percentage worden opgenomen.


