  - number: 21c
    text: |-
      De standaardloonheffingskorting is het gezamenlijke bedrag van:

      a. de algemene heffingskorting ([artikel 22][ref1]);

      b. de arbeidskorting ([artikel 22a][ref2]);

      c. de jonggehandicaptenkorting ([artikel 22aa][ref3]);

      d. de ouderenkorting ([artikel 22b][ref4]), en

      e. de alleenstaande ouderenkorting ([artikel 22c][ref5]).


