  - number: 38c
    text: |-
      1 In afwijking in zoverre van [artikel 18a, eerste lid][ref1], bedraagt de premie per dienstjaar ten hoogste
      de premie ter zake waarvan een recht van voortgezette inleg bestaat gedurende perioden na ontslag waarin
      loongerelateerde uitkeringen worden ontvangen, indien:

      a. deze perioden zijn aangevangen vóór de dag van inwerkingtreding van de [Wet toekomst pensioenen][ref2],
      dan wel vóór 1 januari 2029, voor zover met toepassing van [artikel 38q][ref3] zoals dat luidde op de dag
      van inwerkingtreding van de Wet toekomst pensioenen opbouw van pensioen heeft plaatsgevonden volgens de in
      de [artikelen 18 tot en met 18ga][ref4] alsmede de daarop gebaseerde bepalingen zoals deze luidden op de
      dag voorafgaand aan het tijdstip van inwerkingtreding van de Wet toekomst pensioenen opgenomen normeringen
      en begrenzingen en voor de werknemer niet reeds een pensioenregeling van toepassing is als bedoeld in
      [hoofdstuk IIB][ref5] zoals dat geldt vanaf de dag van inwerkingtreding van de Wet toekomst pensioenen;

      b. het recht op voortgezette premie-inleg verband houdt met arbeidsongeschiktheid van de werknemer;

      c. als verzekeraar van het pensioen optreedt een lichaam als bedoeld in
      [artikel 19a, eerste lid, onderdeel b][ref6], een pensioenfonds als bedoeld in
      [artikel 220h van de Pensioenwet][ref7] of een beroepspensioenfonds als bedoeld in
      [artikel 214f van de Wet verplichte beroepspensioenregeling][ref8].

      2 Indien gedurende perioden na ontslag bedoeld in het eerste lid, opbouw van een partnerpensioen
      bij overlijden voor pensioendatum of een wezenpensioen plaatsvindt met toepassing van
      [artikel 220h, tweede lid][ref9], of [artikel 220ha, eerste lid, van de Pensioenwet][ref10]
      of [artikel 214f, tweede lid, van de Wet verplichte beroepspensioenregeling][ref11] zijn de
      [artikelen 18b, tweede lid][ref12], en [18c, derde lid][ref13], niet van toepassing.

      3 Onder een partner wordt voor de toepassing van dit artikel verstaan echtgenoten en gewezen echtgenoten, dan
      wel degenen met wie duurzaam een gezamenlijke huishouding wordt gevoerd of is gevoerd en met wie geen bloed- of
      aanverwantschap in de eerste graad bestaat.


