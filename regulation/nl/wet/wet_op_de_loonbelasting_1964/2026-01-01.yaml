  - number: '20'
    text: |-
      1 De over een loontijdvak van een jaar verschuldigde belasting is het bedrag van de over het kalenderjaar berekende
      belasting op het belastbare loon verminderd met het bedrag van de heffingskorting voor de loonbelasting.

      2 Het bedrag van de heffingskorting voor de loonbelasting bedraagt maximaal het bedrag van de verschuldigde
      belasting over het loontijdvak van een jaar.

      3 Voor werknemers die in een andere lidstaat van de Europese Unie, in een andere staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte, in Zwitserland of op de BES eilanden wonen, wordt voor de
      toepassing van het eerste en tweede lid alleen het deel van de heffingskorting voor de loonbelasting dat betrekking
      heeft op de arbeidskorting in aanmerking genomen.

      4 Voor werknemers die niet in Nederland wonen en geen werknemer als bedoeld in het derde lid zijn, is, in afwijking
      van het eerste lid, de over een loontijdvak van een jaar verschuldigde belasting het bedrag van de over het
      kalenderjaar berekende belasting op het belastbare loon.

      5 Een werknemer die op grond van [artikel 2.2, tweede of derde lid, van de Wet inkomstenbelasting 2001][ref1]
      geacht wordt in Nederland te wonen, wordt ook voor de toepassing van het derde en vierde lid geacht in Nederland
      te wonen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2.2
