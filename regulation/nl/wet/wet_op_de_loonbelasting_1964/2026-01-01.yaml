  - number: '35'
    text: |-
      1 Ten aanzien van een artiest of beroepssporter wordt de belasting geheven naar de gage.

      2 Gage is al hetgeen de artiest of beroepssporter als zodanig geniet. Tot de gage behoren kostenvergoedingen
      alsmede aanspraken om na verloop van tijd of onder een voorwaarde een of meer uitkeringen of verstrekkingen te
      ontvangen.

      3 Tot de gage behoren niet:

      a. vergoedingen en verstrekkingen ter zake van consumpties tijdens de werktijd die geen deel uitmaken van een
      maaltijd volgens bij ministeriële regeling te stellen regels, of ter zake van maaltijden waarbij het zakelijk
      karakter van meer dan bijkomstig belang is;

      b. vergoedingen die strekken tot bestrijding van reis- en verblijfkosten – andere dan kosten van eigen vervoer
      – ter behoorlijke vervulling van het optreden dan wel de sportbeoefening, mits de artiest of beroepssporter de
      bewijsstukken overhandigt aan de inhoudingsplichtige en deze de bewijsstukken administreert en voor controle
      beschikbaar houdt;

      c. verstrekkingen die strekken tot voorkoming van reis- en verblijfkosten ter behoorlijke vervulling van het
      optreden dan wel de sportbeoefening;

      d. aanspraken ingevolge de [Ziektewet][ref1], de [Wet arbeid en zorg][ref2], de
      [Wet werk en inkomen naar arbeidsvermogen][ref3], de [Wet op de arbeidsongeschiktheidsverzekering][ref4] en de
      [Werkloosheidswet][ref5];

      e. aanspraken, die naar aard en strekking overeenkomen met aanspraken als bedoeld in onderdeel d;

      f. aanspraken op uitkeringen wegens overlijden of invaliditeit ten gevolge van een ongeval en

      g. bedragen die worden ingehouden als bijdrage voor aanspraken die naar aard en strekking overeenkomen met
      aanspraken bedoeld in onderdeel e, alsmede bijdrage voor aanspraken, bedoeld in onderdeel f.

      4 Tot de gage behoort mede niet het aan de artiest of beroepssporter toe te rekenen deel van hetgeen blijkens
      een beschikking van de inspecteur als een niet tot de gage behorende vergoeding kan worden aangemerkt
      (kostenvergoedingsbeschikking). De kostenvergoedingsbeschikking wordt op verzoek door de inspecteur verstrekt
      en is vatbaar voor bezwaar. Het verzoek wordt voor het optreden of de sportbeoefening gedaan door de artiest, de
      beroepssporter of de inhoudingsplichtige, dan wel uiterlijk een maand na het optreden of de sportbeoefening door
      de inhoudingsplichtige. Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de
      kostenvergoedingsbeschikking.

      5 Niet in geld genoten gage wordt in aanmerking genomen naar de waarde die daaraan in het economische verkeer kan
      worden toegekend.

      6 Gage wordt beschouwd te zijn genoten op het tijdstip:

      a. waarop zij betaald of verrekend wordt, ter beschikking van de artiest of beroepssporter wordt gesteld of
      rentedragend wordt;

      b. waarop zij vorderbaar en tevens inbaar wordt, of

      c. indien dat later is dan de tijdstippen, bedoeld in de onderdelen a en b en de inhoudingsplichtige een
      kostenvergoedingsbeschikking heeft aangevraagd: uiterlijk een maand na het optreden of de sportbeoefening.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0013008
