  - number: 30a
    text: |-
      Indien op enig tijdstip wordt geconstateerd dat een werknemer tot een inhoudingsplichtige in dienstbetrekking
      staat, maar de werknemer niet in de loonadministratie van de inhoudingsplichtige is opgenomen of met betrekking
      tot de werknemer niet is voldaan aan de verplichting een eerstedagsmelding te doen, wordt de werknemer voor de
      toepassing van deze wet en de daarop berustende bepalingen geacht van de inhoudingsplichtige gedurende ten minste
      zes maanden voorafgaande aan het tijdstip van de constatering loon uit dienstbetrekking te hebben genoten tot per
      loontijdvak ten minste het bedrag van het loon dat de werknemer geniet in het loontijdvak van het tijdstip van de
      constatering, behoudens voorzover blijkt dat de werknemer niet gedurende die periode tot de inhoudingsplichtige in
      dienstbetrekking heeft gestaan of dat een lager loon is genoten.
    url: https://wetten.overheid.nl/BWBR0002471/2026-01-01#Artikel30a
  - number: '31'
    text: |-
      1 Eindheffingsbestanddelen zijn:

      a. bestanddelen van het loon waarover de verschuldigde belasting niet is betaald, in verband waarmee aan de
      inhoudingsplichtige een naheffingsaanslag wordt opgelegd, behoudens:

      1°. voor zover de inhoudingsplichtige verzoekt, onder verstrekking van de daartoe noodzakelijke gegevens, dat loon
      niet als eindheffingsbestanddeel aan te merken;

      2°. voor zover de inspecteur bij voor bezwaar vatbare beschikking besluit, mede gelet op het aantal werknemers
      waarop de naheffingsaanslag betrekking heeft, dat loon niet als eindheffingsbestanddeel aan te merken omdat het
      wel toepassen daarvan zou kunnen leiden tot een zodanig grote afwijking van het belastbare inkomen in de zin van
      de inkomstenbelasting van een of meer werknemers dat voor hen aanzienlijke voordelen zouden kunnen ontstaan in het
      kader van de heffing van die belasting, van andere belastingen of in het kader van andere wettelijke regelingen;

      b. bij voor bezwaar vatbare beschikking door de inspecteur aangewezen bestanddelen van het loon met betrekking
      waartoe in verband met tijdelijke knelpunten van ernstige aard in redelijkheid niet kan worden gevergd dat
      de[ hoofdstukken I tot en met IV][ref1] ten volle worden toegepast;

      c. bij ministeriële regeling aan te wijzen uitkeringen van publiekrechtelijke aard die buiten aanmerking worden
      gelaten in het kader van de heffing van andere belastingen of in het kader van andere wettelijke regelingen;

      d. loon ter zake van een voor privé-doeleinden ter beschikking gestelde bestelauto als bedoeld in
      [artikel 3 van de Wet op de belasting van personenauto’s en motorrijwielen 1992][ref2], indien in verband met
      de aard van het werk die bestelauto doorlopend afwisselend gebruikt wordt door twee of meer werknemers en in
      verband daarmee bezwaarlijk is vast te stellen of en aan wie die bestelauto voor privé-doeleinden ter beschikking
      is gesteld, met dien verstande dat in afwijking in zoverre van het overigens bij of krachtens deze wet bepaalde,
      de verschuldigde belasting over dit loon op jaarbasis per bestelauto € 438 bedraagt en bij ministeriële regeling
      nadere regels kunnen worden gesteld met betrekking tot dit loon;

      e.

      f. voor zover sprake is van tegenwoordige arbeid: door de inhoudingsplichtige aangewezen vergoedingen en
      verstrekkingen, daaronder begrepen gedeelten van vergoedingen en verstrekkingen, voor zover de omvang van de
      aangewezen vergoedingen en verstrekkingen niet in belangrijke mate groter is dan de omvang van de vergoedingen en
      verstrekkingen die in voor het overige overeenkomstige omstandigheden in de regel worden aangewezen;

      g. voorzover sprake is van vroegere arbeid:

      1°. vergoedingen ter zake van de aanschaf bij de inhoudingsplichtige dan wel bij een met de inhoudingsplichtige
      verbonden vennootschap van branche-eigen producten van het bedrijf van de inhoudingsplichtige dan wel van het
      bedrijf van een met de inhoudingsplichtige verbonden vennootschap;

      2°. door de inhoudingsplichtige aangewezen vergoedingen en verstrekkingen, daaronder begrepen gedeelten van
      vergoedingen en verstrekkingen, ter zake of in de vorm van het volgen van een opleiding of studie voor zover
      wordt voldaan aan het gestelde in [artikel 31a, tweede lid, onderdeel d][ref3], en voor zover de omvang van de
      aangewezen vergoedingen en verstrekkingen niet in belangrijke mate groter is dan de omvang van de vergoedingen en
      verstrekkingen die in voor het overige overeenkomstige omstandigheden in de regel worden aangewezen;

      3°. overige verstrekkingen;

      met dien verstande dat vergoedingen en verstrekkingen als bedoeld onder 1° en 3° uitsluitend
      eindheffingsbestanddelen zijn voor zover deze vergoedingen en verstrekkingen ook door de inhoudingsplichtige
      of door een met de inhoudingsplichtige verbonden vennootschap worden verstrekt aan een of meer werknemers met
      inkomsten uit tegenwoordige arbeid die voor het overige in dezelfde omstandigheden verkeren;

      h. toeslagen als bedoeld in [artikel 10, derde lid, van de Wet uitkeringen vervolgingsslachtoffers 1940–1945][ref4]
      en in [artikel 21b van de Wet uitkeringen vervolgingsslachtoffers 1940–1945][ref5]
      zoals dat luidde tot 1 januari 1992, alsmede toeslagen als bedoeld in
      [artikel 19 van de Wet uitkeringen burgeroorlogsslachtoffers 1940–1945][ref6].

      2 Met betrekking tot eindheffingsbestanddelen wordt het bedrag van de verschuldigde belasting bepaald:

      a. aan de hand van het tabeltarief met betrekking tot:

      1°. aan naheffing onderworpen eindheffingsbestanddelen als bedoeld in het eerste lid, onderdeel a;

      2°. eindheffingsbestanddelen bij tijdelijke knelpunten van ernstige aard als bedoeld in het eerste lid, onderdeel
      b;

      3°. aangewezen uitkeringen van publiekrechtelijke aard als bedoeld in het eerste lid, onderdeel c;

      b.

      c. aan de hand van [artikel 31a][ref7], met betrekking tot vergoedingen en verstrekkingen als bedoeld in het eerste
      lid, onderdeel f en onderdeel g;

      d. naar een enkelvoudig tarief, met betrekking tot toeslagen als bedoeld in het eerste lid, onderdeel h, aan
      de hand van de voor het tijdvak waarin het loon is genoten geldende in [artikel 20a, eerste lid][ref8], of
      [artikel 20b, eerste lid][ref9], opgenomen tabel, waarbij buiten beschouwing wordt gelaten dat de belasting wordt
      geheven van de inhoudingsplichtige.

      3 Ingeval het tabeltarief van toepassing is wordt het bedrag van de verschuldigde belasting bepaald aan de
      hand van de voor het tijdvak waarin het loon is genoten geldende in [artikel 20a, eerste lid][ref10], of
      [artikel 20b][ref11], eerste lid, opgenomen tabel, waarbij wordt aangenomen dat de inhoudingsplichtige de
      belasting en de bij reguliere betaling van het loon verschuldigde inkomensafhankelijke bijdrage, bedoeld in
      [artikel 43 van de Zorgverzekeringswet][ref12] aanstonds voor zijn rekening heeft genomen. Voor zover bij naheffing
      als bedoeld in het tweede lid, onderdeel a, aannemelijk is dat de inhoudingsplichtige de belasting en bijdrage
      pas later voor zijn rekening heeft genomen, wordt in zoverre van de eerste volzin afgeweken en wordt het voor de
      werknemer ontstane voordeel in de eindheffing betrokken naar de situatie ten tijde van het voor rekening van de
      inhoudingsplichtige nemen, doch uiterlijk ten tijde van de naheffing.

      4 Bij het begin van het kalenderjaar wordt het in het eerste lid, onderdeel d, genoemde bedrag bij ministeriële
      regeling vervangen door een ander bedrag. Dit bedrag wordt berekend door het te vervangen bedrag te
      vermenigvuldigen met de tabelcorrectiefactor, bedoeld in [artikel 10.2 van de Wet inkomstenbelasting 2001][ref13],
      en vervolgens de nodig geachte afronding aan te brengen. Indien in het voorafgaande kalenderjaar een dergelijke
      afronding is toegepast, kan bij vervanging worden uitgegaan van het niet-afgeronde bedrag.

      5 Tot de vergoedingen en verstrekkingen, bedoeld in het eerste lid, onderdeel f en onderdeel g, behoren niet
      vergoedingen en verstrekkingen ter zake of in de vorm van:

      a. een ook voor privé-doeleinden ter beschikking gestelde auto als bedoeld in [artikel 13bis][ref14], behoudens
      voor zover het voordeel daarvan toerekenbaar is aan buitengewone beveiligingsmaatregelen;

      b. een woning, behoudens voor zover:

      1°. het voordeel daarvan toerekenbaar is aan buitengewone beveiligingsmaatregelen, of

      2°. het huisvesting buiten de woonplaats ter zake van de dienstbetrekking betreft;

      c. geldboeten opgelegd door een strafrechter en geldsommen betaald aan een staat of een onderdeel daarvan
      ter voorkoming van strafvervolging, in het kader van een strafbeschikking of daarmee vergelijkbare
      buitenlandse wijze van bestraffing, dan wel ter voldoening aan een voorwaarde verbonden aan een besluit tot
      gratieverlening, bestuurlijke boeten en daarmee vergelijkbare buitenlandse boeten, geldboeten opgelegd op
      basis van bij wet geregeld tuchtrecht, alsmede kosten als bedoeld in [artikel 234, vijfde lid][ref15], en
      [artikel 235, derde lid, van de Gemeentewet][ref16];

      d. misdrijven ter zake waarvan de werknemer door een Nederlandse strafrechter bij onherroepelijke uitspraak is
      veroordeeld, daaronder begrepen misdrijven die zijn betrokken bij de bepaling van de hoogte van de opgelegde straf
      en ter zake waarvan het Openbaar Ministerie heeft verklaard te zullen afzien van vervolging;

      e. misdrijven ter zake waarvan jegens de werknemer een onherroepelijk geworden strafbeschikking is uitgevaardigd;

      f. wapens en munitie, tenzij ter zake een erkenning, consent, vergunning, verlof of ontheffing is verleend
      krachtens de [Wet wapens en munitie][ref17];

      g. dieren die krachtens een onherroepelijke bestuursrechtelijke of strafrechtelijke maatregel in verband met
      agressie niet mogen worden gehouden;

      h. het rentevoordeel van een door de inhoudingsplichtige dan wel door een met de
      inhoudingsplichtige verbonden vennootschap aan de werknemer verstrekte geldlening, daaronder
      begrepen een gedeelte van een geldlening, waarvan de rente als aftrekbare kosten in de zin van de
      [artikelen 3.120 tot en met 3.123 van de Wet inkomstenbelasting 2001][ref18] in aanmerking genomen kan worden;

      i. de aan een geldlening als bedoeld in onderdeel h verbonden kosten;

      j. dwangsommen als bedoeld in [afdeling 5.3.2 van de Algemene wet bestuursrecht][ref19] en daarmee vergelijkbare
      buitenlandse dwangsommen.

      6 Voor de bepaling van de verschuldigde belasting op de voet van het tweede lid, onderdeel c, wordt buiten
      beschouwing gelaten dat de belasting wordt geheven van de inhoudingsplichtige.

      7 Voorzover in hetzelfde loontijdvak of dezelfde loontijdvakken door meer dan één werknemer
      eindheffingsbestanddelen worden genoten kan, mits dat leidt tot een beduidende vereenvoudiging van de vaststelling
      van de verschuldigde belasting, de verschuldigde belasting globaal worden vastgesteld, zodanig dat deze
      redelijkerwijs overeenkomt met de verschuldigde belasting die op de voet van de vorige leden zou zijn bepaald.

      8 De in het eerste lid bedoelde ministeriële regelingen worden, voorzover het de premie voor de volksverzekeringen
      betreft, getroffen in overleg met Onze Minister van Sociale Zaken en Werkgelegenheid.


