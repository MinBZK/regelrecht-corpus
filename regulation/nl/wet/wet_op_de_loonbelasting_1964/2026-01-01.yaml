    text: |-
      1 De premie, genoemd in [artikel 18a, eerste en tiende lid][ref1], dan wel
      [artikel 38r, eerste en vierde lid][ref2], is niet van toepassing op dienstjaren die uiterlijk op de dag
      voorafgaand aan het tijdstip van inwerkingtreding van de [Wet toekomst pensioenen][ref3] eindigen.

      2 Het eerste lid is van overeenkomstige toepassing op dienstjaren die na de dag voorafgaand aan het
      tijdstip van inwerkingtreding van de Wet toekomst pensioenen eindigen en waarvoor met toepassing van
      [artikel 38q][ref4] opbouw van pensioen heeft plaatsgevonden volgens de normeringen en begrenzingen uit de
      [artikelen 18 tot en met 18ga][ref5] en [19f][ref6] alsmede de daarop gebaseerde bepalingen zoals deze luidden op
      de dag voorafgaand aan het tijdstip van inwerkingtreding van de [Wet toekomst pensioenen][ref7].


