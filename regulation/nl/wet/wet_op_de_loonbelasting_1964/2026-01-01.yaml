  - number: '5'
    text: |-
      1 Als dienstbetrekking wordt niet beschouwd de arbeidsverhouding van degene die uitsluitend of nagenoeg uitsluitend
      diensten verricht ten behoeve van het huishouden van de natuurlijke persoon tot wie hij in dienstbetrekking staat,
      indien hij de diensten doorgaans op minder dan vier dagen per week verricht.

      2 Onder het verrichten van diensten ten behoeve van een huishouden wordt voor de toepassing van dit artikel mede
      verstaan het verlenen van zorg aan de leden van dat huishouden.
    url: https://wetten.overheid.nl/BWBR0002471/2026-01-01#Artikel5
  - number: 5a
    text: |-
      1 Voor de toepassing van deze wet en de daarop berustende bepalingen wordt verstaan onder artiest: degene die
      ingevolge een overeenkomst van korte duur als musicus of anderszins als artiest optreedt, tenzij:

      a. hij inwoner is van Aruba, Curaçao, Sint Maarten, de BES eilanden of een land waarmee de Staat der Nederlanden
      een verdrag ter voorkoming van dubbele belasting heeft gesloten; of

      b. hij het optreden rechtstreeks is overeengekomen met een natuurlijke persoon ten behoeve van diens persoonlijke
      aangelegenheden; of

      c. hij voldoet aan bij algemene maatregel van bestuur te stellen voorwaarden.

      2 Voor de toepassing van deze wet en de daarop berustende bepalingen wordt verstaan onder beroepssporter: degene
      die ingevolge een overeenkomst van korte duur als beroep een tak van sport beoefent, tenzij:

      a. hij in Nederland woont, of

      b. hij inwoner is van Aruba, Curaçao, Sint Maarten, de BES eilanden of een land waarmee de Staat der Nederlanden
      een verdrag ter voorkoming van dubbele belasting heeft gesloten; of

      c. hij de sportbeoefening rechtstreeks is overeengekomen met een natuurlijke persoon ten behoeve van diens
      persoonlijke aangelegenheden.

      3 Ingeval een artiest of beroepssporter optreedt of als beroep een tak van sport beoefent in het kader van een
      dienstbetrekking tot een in Nederland gevestigde inhoudingsplichtige, is hij voor de toepassing van deze wet en de
      daarop berustende bepalingen werknemer.

      4 Ingeval een niet in Nederland wonende artiest of beroepssporter optreedt of als beroep een tak van sport beoefent
      in het kader van een dienstbetrekking tot een inhoudingsplichtige die niet in Nederland is gevestigd, vindt de
      heffing van loonbelasting plaats ingevolge de regelingen zoals die gelden voor artiesten en beroepssporters.
    url: https://wetten.overheid.nl/BWBR0002471/2026-01-01#Artikel5a
  - number: 5b
    text: |-
      1 Voor de toepassing van deze wet en de daarop berustende bepalingen wordt verstaan onder buitenlands gezelschap:
      een groep van hoofdzakelijk niet in Nederland wonende natuurlijke personen of gevestigde lichamen waarbij de leden
      van de groep individueel of gezamenlijk ingevolge een overeenkomst van korte duur als artiest in Nederland optreden
      of als beroep een tak van sport in Nederland beoefenen, tenzij:

      1°. het optreden of de sportbeoefening rechtstreeks is overeengekomen met een natuurlijk persoon ten behoeve van
      diens persoonlijke aangelegenheden, of

      2°. volgens bij ministeriële regeling te stellen regels aannemelijk wordt gemaakt dat het gezelschap hoofdzakelijk
      bestaat uit leden die inwoner zijn dan wel gevestigd zijn in een land waarmee de Staat der Nederlanden een verdrag
      ter voorkoming van dubbele belasting heeft gesloten of inwoner zijn van dan wel gevestigd zijn in Nederland of op
      Aruba, Curaçao, Sint Maarten of de BES eilanden.

      2 De rechten die een buitenlands gezelschap heeft en de verplichtingen die daarop rusten, komen toe aan elk lid van
      het gezelschap en rusten op elk lid van het gezelschap. Een lid kan zich doen vertegenwoordigen door een lid dat
      als leider van het gezelschap fungeert.

      3 Ingeval een lid van een buitenlands gezelschap optreedt of als beroep een tak van sport beoefent in het kader
      van een dienstbetrekking tot een inhoudingsplichtige die niet in Nederland is gevestigd, vindt de heffing van
      loonbelasting plaats ingevolge de regelingen zoals die gelden voor het buitenlandse gezelschap.
    url: https://wetten.overheid.nl/BWBR0002471/2026-01-01#Artikel5b
  - number: '6'
    text: |-
      1 Inhoudingsplichtige is:

      a. degene, tot wie een of meer personen in dienstbetrekking staan;

      b. degene, die aan een of meer personen loon uit een vroegere dienstbetrekking tot hemzelf of tot een ander
      verstrekt;

      c. degene, die ingevolge een aanspraak die niet tot het loon behoort, aan een of meer personen uitkeringen of
      verstrekkingen uit een dienstbetrekking tot een ander doet.

      2 Wie niet in Nederland woont of gevestigd is, wordt slechts als inhoudingsplichtige beschouwd voor zover hij:

      a. in Nederland een vaste inrichting voor de uitoefening van zijn bedrijf, beroep of andere bezigheid of een in
      Nederland wonende of gevestigde vaste vertegenwoordiger heeft, dan wel

      b. een of meer personen in dienst heeft van wie het loon is onderworpen aan de inkomstenbelasting, met betrekking
      tot deze personen de loonadministratie in Nederland houdt en zich voor deze personen als inhoudingsplichtige bij de
      inspecteur heeft gemeld.

      3 Voor de toepassing van het tweede lid, onderdeel *a*, wordt onder vaste inrichting of vaste vertegenwoordiger
      verstaan:

      a. een vaste inrichting of vaste vertegenwoordiger als bedoeld in
      [artikel 3, vierde tot en met twaalfde lid, van de Wet op de vennootschapsbelasting 1969][ref1];

      b. het verrichten van werkzaamheden in het kader van een onderneming gedurende een aaneengesloten periode van ten
      minste 30 dagen, indien die werkzaamheden plaatsvinden in, op of boven het Noordzeewinningsgebied, waarbij het
      Noordzeewinningsgebied bestaat uit de territoriale zee van Nederland alsmede het buiten de territoriale zee onder
      de Noordzee gelegen deel van de zeebodem en de ondergrond daarvan, voor zover het Koninkrijk der Nederlanden daar
      op grond van het internationale recht rechten mag uitoefenen;

      c. het verrichten van werkzaamheden die gericht zijn op het verlenen van tussenkomst ten behoeve van degenen
      die tegen beloning persoonlijke arbeid in Nederland verrichten en een derde ten behoeve van wie die arbeid wordt
      verricht.

      4 Diplomatieke, consulaire en andere vertegenwoordigers van andere Mogendheden en de hun toegevoegde
      ambtenaren, alsmede bij ministeriële regeling aan te wijzen internationale organisaties en vertegenwoordigers en
      functionarissen daarvan, worden niet als inhoudingsplichtigen beschouwd.

      5 Ingeval [artikel 19b][ref2] toepassing vindt, is in afwijking van het eerste lid voor de aanspraak die ingevolge
      dat artikel als loon wordt aangemerkt, inhoudingsplichtige degene die als verzekeraar van die aanspraak optreedt.

      6 Een in Nederland gevestigd onderdeel van een concern waartoe ook een onderdeel behoort dat op grond
      van het tweede of derde lid als inhoudingsplichtige wordt aangemerkt, kan op gezamenlijk verzoek van deze
      concernonderdelen, in afwijking in zoverre van het eerste, tweede en derde lid, door de inspecteur, die daarbij
      voorwaarden kan stellen, worden aangewezen als inhoudingsplichtige voor een of meer personen die bij het niet in
      Nederland gevestigde concernonderdeel in dienst zijn. De aanwijzing en de daarbij gestelde voorwaarden kunnen, al
      dan niet op verzoek, worden gewijzigd of ingetrokken. Aanwijzing, wijziging of intrekking vinden plaats bij voor
      bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel19b
