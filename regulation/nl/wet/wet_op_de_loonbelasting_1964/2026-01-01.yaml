  - number: '8'
    text: |-
      Bij ministeriële regeling kan, in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid, een ander
      dan de persoon bedoeld in [artikel 6][ref1] of [artikel 7][ref2] worden aangewezen als inhoudingsplichtige met
      betrekking tot:

      a. degene, die krachtens overeenkomst met een ander tegen beloning geregeld zijn bemiddeling verleent tot het tot
      stand komen van overeenkomsten tussen daartoe door hem te bezoeken personen en een opdrachtgever van die ander;

      b. degene, die een thuiswerker als hulp bij het verrichten van de arbeid bijstaat;

      c. degene, die als beroep een tak van sport beoefent.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel7
