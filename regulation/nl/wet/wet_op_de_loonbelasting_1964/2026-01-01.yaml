  - number: 26b
    text: |-
      In afwijking van de [artikelen 20][ref1], [20a][ref2], [20b][ref3] en [26][ref4] bedraagt de belasting 52% van het
      loon ingeval:

      a. de werknemer zijn naam, adres, woonplaats of burgerservicenummer niet aan de inhoudingsplichtige heeft
      verstrekt;

      b. bij een werknemer die loon uit tegenwoordige dienstbetrekking geniet, de inhoudingsplichtige
      zijn identiteit niet heeft vastgesteld en opgenomen in de loonadministratie overeenkomstig
      [artikel 28, eerste lid, onderdeel f][ref5];

      c. bij een werknemer die loon uit tegenwoordige dienstbetrekking geniet, vreemdeling is in de zin van de
      [Vreemdelingenwet 2000][ref6] en niet behoort tot de categorie werknemers die op grond van overeenkomsten van
      internationaal recht is uitgezonderd van de verplichting tot het hebben van een geldige verblijfsvergunning als
      bedoeld in die wet en een geldige tewerkstellingsvergunning als bedoeld in de [Wet arbeid vreemdelingen][ref7], de
      inhoudingsplichtige zijn verblijfsrechtelijke positie ter zake van het verrichten van arbeid niet heeft vastgesteld
      en opgenomen in de loonadministratie overeenkomstig [artikel 28, eerste lid, onderdeel f][ref8];

      d. de werknemer ter zake van de in de onderdelen a tot en met c bedoelde inlichtingen onjuiste gegevens heeft
      verstrekt en de inhoudingsplichtige dit weet of redelijkerwijs moet weten.

      De eerste volzin, aanhef en onderdeel c, is niet van toepassing bij werknemers die werkzaamheden verrichten
      in dienstbetrekking bij een Nederlandse publiekrechtelijke rechtspersoon, niet in Nederland wonen en hun
      dienstbetrekking geheel buiten Nederland vervullen.

      Indien de belasting ingevolge [artikel 27b, eerste lid][ref9], in één bedrag met de premie voor de
      volksverzekeringen wordt geheven, wordt in afwijking in zoverre van de eerste volzin het bedrag van de
      verschuldigde belasting te zamen met het bedrag van de verschuldigde premie voor de volksverzekeringen gesteld op
      52% van het loon.


