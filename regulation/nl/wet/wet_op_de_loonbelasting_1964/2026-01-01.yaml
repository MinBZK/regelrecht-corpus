  - number: 19d
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister voor Armoedebeleid, Participatie en Pensioenen, afwijkingen
      toestaan van het overigens in of krachtens dit hoofdstuk bepaalde door regelingen of groepen van regelingen aan te
      wijzen als pensioenregeling indien het een regeling betreft:

      a. die op bepaalde onderdelen niet meer dan in geringe mate afwijkt van het overigens in of krachtens dit hoofdstuk
      bepaalde, mits het belang van de afwijkingen niet uitgaat boven het belang van de marges op andere onderdelen;

      b. voor gemoedsbezwaarden met een ontheffing als bedoeld in
      [artikel 64 van de Wet financiering sociale verzekeringen][ref1], die dient ter vervanging van een
      pensioenregeling;

      c. voor een tijdelijk in Nederland wonende of werkzame werknemer en die regeling voldoet aan
      [artikel 1.7, tweede lid, onderdeel c, van de Wet inkomstenbelasting 2001][ref2], mits de opbouw van het pensioen
      ingevolge die regeling tijdelijk in Nederland wordt voortgezet en het pensioen reeds was verzekerd bij een
      pensioenfonds of lichaam als bedoeld in [artikel 19a, eerste lid, onderdelen c of d][ref3], in een periode waarin
      de werknemer niet in Nederland woonde of niet in Nederland een dienstbetrekking vervulde;

      d. waarvoor door De Nederlandsche Bank of de Autoriteit Financiële Markten maatregelen zijn opgelegd, of waarvoor
      een rechterlijke uitspraak heeft plaatsgevonden, op grond waarvan de regeling in overeenstemming moet worden
      gebracht met de [Pensioenwet][ref4], de [Wet verplichte beroepspensioenregeling][ref5] of op die wetten gebaseerde
      bepalingen.

      Zo nodig kunnen aanvullende voorwaarden worden gesteld.


