  - number: '32'
    text: |-
      1 In afwijking van [artikel 31a, eerste lid][ref1], kan de belasting die door alle gezamenlijk in concernverband
      opererende inhoudingsplichtigen is verschuldigd met betrekking tot vergoedingen en verstrekkingen als bedoeld
      in [artikel 31, eerste lid, onderdeel f en onderdeel g][ref2], worden bepaald alsof deze inhoudingsplichtigen
      gezamenlijk één inhoudingsplichtige zijn. Deze belasting wordt aangegeven en afgedragen door de tot het
      concernverband behorende inhoudingsplichtige met het grootste bedrag aan loon waarover in het kalenderjaar met
      toepassing van de [artikelen 20a][ref3], [20b][ref4], [26][ref5] en [26b][ref6] belasting is geheven.

      2 Een inhoudingsplichtige opereert gezamenlijk met een andere inhoudingsplichtige in concernverband, indien
      gedurende het gehele kalenderjaar:

      a. de inhoudingsplichtige voor ten minste 95% belang heeft in die andere inhoudingsplichtige;

      b. die andere inhoudingsplichtige voor ten minste 95% belang heeft in de inhoudingsplichtige, of

      c. een derde voor ten minste 95% belang heeft in de inhoudingsplichtige, terwijl deze derde tevens voor ten minste
      95% belang heeft in die andere inhoudingsplichtige.

      Een inhoudingsplichtige wordt voor de toepassing van het eerste lid eveneens geacht gezamenlijk met een andere
      inhoudingsplichtige in concernverband te opereren, indien deze inhoudingsplichtigen stichtingen zijn die gedurende
      het gehele kalenderjaar in financieel, organisatorisch en economisch opzicht zodanig met elkaar zijn verweven dat
      zij een eenheid vormen. Bij ministeriële regeling worden nadere regels gesteld voor de toepassing van de tweede
      volzin.

      3 Bij ministeriële regeling worden regels gesteld over de door iedere inhoudingsplichtige die ingevolge het eerste
      lid samen met andere inhoudingsplichtigen als één inhoudingsplichtige wordt beschouwd te administreren gegevens ten
      aanzien van:

      a. de berekening van de verschuldigde belasting, bedoeld in het eerste lid;

      b. de inhoudingsplichtige die de belasting, bedoeld in onderdeel a, aangeeft en afdraagt.


