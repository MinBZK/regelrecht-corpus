  - number: 19a
    text: |-
      1 Als verzekeraar van een pensioen als bedoeld in [artikel 18][ref1] kan optreden:

      a. een lichaam dat ingevolge [artikel 5, eerste lid, onderdeel b, van de Wet op de vennootschapsbelasting 1969][ref2]
      is vrijgesteld van die belasting of dat een algemeen pensioenfonds als bedoeld in
      [artikel 1 van de Pensioenwet][ref3] is;

      b. een verzekeraar als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref4], mits
      deze de pensioenverplichting voor de heffing van de vennootschapsbelasting rekent tot het binnenlandse
      ondernemingsvermogen;

      c. een niet in Nederland gevestigd pensioenfonds of lichaam dat het levensverzekeringsbedrijf uitoefent, mits het
      pensioen de voortzetting is van een pensioen dat reeds was verzekerd bij die verzekeraar in een periode waarin de
      werknemer of gewezen werknemer niet in Nederland woonde of niet in Nederland een dienstbetrekking vervulde;

      d. een pensioenfonds of lichaam dat bevoegd het verzekeringsbedrijf uitoefent, anders dan bedoeld in de onderdelen
      a, b en c, dat door Onze Minister, onder door hem te stellen voorwaarden, is aangewezen en dat zich tegenover Onze
      Minister heeft verplicht:

      1°. te voldoen aan voorwaarden met betrekking tot het verschaffen van inlichtingen over de uitvoering van de
      regeling, en

      2°. zekerheid te stellen voor de invordering van de belasting die is verschuldigd door
      toepassing van [artikel 19b][ref5], ofwel [artikel 3.83, eerste of tweede lid][ref6],
      [artikel 3.136, derde, vierde of vijfde lid][ref7], of
      [artikel 7.2, achtste lid, van de Wet inkomstenbelasting 2001][ref8], dan wel de werknemer of gewezen werknemer
      zich heeft verplicht deze zekerheid te stellen.

      2 Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de in het eerste lid, onderdeel d,
      bedoelde aanwijzing.

      3 Voor de toepassing van deze wet en de daarop berustende bepalingen, alsmede voor de
      [Wet inkomstenbelasting 2001][ref9] en de daarop berustende bepalingen, wordt gelijkgesteld met:

      a. een verzekeraar als bedoeld in het eerste lid, onderdelen a of b: een premiepensioeninstelling als bedoeld in
      [artikel 1 van de Pensioenwet][ref10];

      b. een verzekeraar als bedoeld in het eerste lid, onderdeel d: een met een premiepensioeninstelling als bedoeld in
      [artikel 1 van de Pensioenwet][ref11] vergelijkbare instelling die onder overeenkomstige toepassing van het eerste
      lid, onderdeel d, door Onze Minister is aangewezen;

      c. het verzekeren van een aanspraak ingevolge een pensioenregeling: het uitvoeren van een pensioenregeling door
      een premiepensioeninstelling.


