    text: |-
      1 Onder pensioenregeling wordt verstaan een regeling:

      a. die uitsluitend of, met het oog op uitzonderlijke gevallen van restbegunstiging, nagenoeg uitsluitend ten doel
      heeft het treffen van:

      1°. een levenslange inkomensvoorziening bij ouderdom voor werknemers en gewezen werknemers (ouderdomspensioen);

      2°. een inkomensvoorziening na hun overlijden op of na de ingangsdatum van het ouderdomspensioen ten
      behoeve van hun partner of gewezen partner in de zin van [artikel 1 van de Pensioenwet][ref1] of
      [artikel 1 van de Wet verplichte beroepspensioenregeling][ref2] (partnerpensioen bij overlijden op of na
      pensioendatum);

      3°. een inkomensvoorziening na hun overlijden voor de ingangsdatum van het ouderdomspensioen ten behoeve
      van hun partner of gewezen partner in de zin van [artikel 1, eerste lid, van de Pensioenwet][ref3] of
      [artikel 1 van de Wet verplichte beroepspensioenregeling][ref4] (partnerpensioen bij overlijden voor
      pensioendatum);

      4°. een inkomensvoorziening na hun overlijden ten behoeve van hun kinderen en pleegkinderen (wezenpensioen);

      5°. een inkomensvoorziening die het partnerpensioen bij overlijden voor pensioendatum, het partnerpensioen bij
      overlijden op of na pensioendatum dan wel het wezenpensioen aanvult in verband met het ontbreken van uitkeringen
      ingevolge de [Algemene nabestaandenwet][ref5] (nabestaandenoverbruggingspensioen);

      6°. een inkomensvoorziening bij arbeidsongeschiktheid zodra die langer dan een jaar duurt en welke niet uitgaat
      boven hetgeen naar maatschappelijke opvattingen redelijk moet worden geacht (arbeidsongeschiktheidspensioen), en

      b. waarin is bepaald dat de aanspraken ingevolge de regeling niet kunnen worden afgekocht, vervreemd of
      prijsgegeven, dan wel formeel of feitelijk voorwerp van zekerheid kunnen worden, anders dan in de gevallen voorzien
      bij of krachtens de [Pensioenwet][ref6] of de [Wet verplichte beroepspensioenregeling][ref7];

      c. waarvan als verzekeraar optreedt een lichaam als bedoeld in [artikel 19a, eerste lid][ref8]; een en ander voor
      zover die regeling blijft binnen de in of krachtens dit hoofdstuk vastgestelde begrenzingen.

      2 Het eerste lid, onderdeel a, onder 2° en 3°, is van overeenkomstige toepassing op een regeling van een directeur-
      grootaandeelhouder als bedoeld in [artikel 1 van de Pensioenwet][ref9].

      3 Ingeval een regeling voldoet aan de in het eerste lid opgenomen voorwaarden doch niet blijft binnen de in
      of krachtens dit hoofdstuk opgenomen begrenzingen, is de regeling een pensioenregeling voorzover blijkt dat
      zij blijft binnen de in of krachtens dit hoofdstuk opgenomen begrenzingen. De inhoudingsplichtige verzoekt
      de inspecteur uiterlijk op het eerste moment van overschrijding van de bedoelde begrenzingen vast te stellen
      welk deel van de desbetreffende aanspraak blijft binnen die begrenzingen. Bij toepassing van de eerste volzin
      geeft de inhoudingsplichtige bij elke te zijner tijd op basis van de regeling te verstrekken pensioenuitkering
      overeenkomstig bij ministeriële regeling te stellen regels aan welk deel daarvan tot het loon van de werknemer
      behoort. De inspecteur beslist op het verzoek bij voor bezwaar vatbare beschikking.

      4 Voor de toepassing van het derde lid blijft een nettopensioenregeling als bedoeld in
      [afdeling 5.3B van de Wet inkomstenbelasting 2001][ref10] buiten beschouwing.


