  - number: 27a
    text: |-
      1 In afwijking in zoverre van het overigens bij of krachtens deze wet bepaalde wordt de belasting over de in
      [artikel 31][ref1] bedoelde eindheffingsbestanddelen geheven van de inhoudingsplichtige.

      2 De heffing over eindheffingsbestanddelen, met uitzondering van de aan naheffing onderworpen
      eindheffingsbestanddelen als bedoeld in [artikel 31, eerste lid, onderdeel a][ref2], geschiedt als ware de door de
      inhoudingsplichtige in een tijdvak verschuldigde belasting door hem op aangifte af te dragen belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel31
