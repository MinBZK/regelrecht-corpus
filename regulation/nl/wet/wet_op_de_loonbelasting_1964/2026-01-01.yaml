  - number: 39f
    text: |-
      1 Met betrekking tot op 31 december 2013 bestaande aanspraken op periodieke uitkeringen ter vervanging van gederfd
      of te derven loon als bedoeld in de [artikelen 11, eerste lid, onderdeel g][ref1], en [37][ref2], zoals die op
      31 december 2013 luidden, en daarmee gelijkgestelde bedragen als bedoeld in [artikel 11a, eerste lid][ref3], zoals
      dat op 31 december 2013 luidde, blijven de [ artikelen 10, vijfde lid, onderdelen b en c][ref4], 11, eerste lid,
      onderdeel g, en vierde lid, 11a, [19a][ref5], [19b, achtste lid][ref6],[ 32bb, zesde en achtste lid][ref7], en 37,
      zoals die op 31 december 2013 luidden, alsmede de daarop gebaseerde bepalingen, van toepassing.

      2 In afwijking in zoverre van het eerste lid mag de waarde van de aanspraak, het tegoed van de
      stamrechtspaarrekening of de waarde van het stamrechtbeleggingsrecht geheel of gedeeltelijk op een eerder tijdstip
      worden uitgekeerd dan in de [artikelen 11][ref8] en [11a][ref9], zoals die op 31 december 2013 luidden, en de
      daarop gebaseerde bepalingen, is bepaald.

      3 In afwijking in zoverre van het eerste lid kunnen aanspraken als bedoeld in
      dat lid mede worden uitgevoerd door een beleggingsonderneming als bedoeld in
      [artikel 3.126a, tweede lid, onderdelen b en d, van de Wet inkomstenbelasting 2001][ref10].

      4 Een aanspraak op periodieke uitkeringen als bedoeld in het eerste lid die op de uiterste
      ingangsdatum, bedoeld in [artikel 11, eerste lid, onderdeel g, onder 1°][ref11], of
      [artikel 11a, derde lid, onderdeel a, onder 1°, of onderdeel b, onder 1°][ref12], zoals deze artikelen
      luidden op 31 december 2013, nog niet tot uitkering is gekomen, omdat de omvang van de uitkeringen nog moet worden
      vastgesteld, wordt geacht te zijn afgekocht op de datum, bedoeld in de tweede zin, onderscheidenlijk derde zin,
      indien op die datum nog geen vaststelling van de omvang van de uitkeringen heeft plaatsgevonden. Bij in leven zijn
      van de werknemer of gewezen werknemer is de datum waarop de aanspraak op periodieke uitkeringen ingevolge de eerste
      zin wordt geacht te zijn afgekocht 31 december van het kalenderjaar volgend op het kalenderjaar waarin de uiterste
      ingangsdatum, bedoeld in artikel 11, eerste lid, onderdeel g, onder 1°, of artikel 11a, derde lid, onderdeel a,
      onder 1°, zoals deze artikelen luidden op 31 december 2013, is gelegen. Bij overlijden van de werknemer of gewezen
      werknemer is de datum waarop de aanspraak op periodieke uitkeringen ingevolge de eerste zin wordt geacht te zijn
      afgekocht 31 december van het tweede kalenderjaar volgend op het kalenderjaar waarin de uiterste ingangsdatum,
      bedoeld in artikel 11, eerste lid, onderdeel g, onder 1°, of artikel 11a, derde lid, onderdeel b, onder 1°, zoals
      deze artikelen luidden op 31 december 2013, is gelegen. De data, bedoeld in de tweede en derde zin, kunnen door de
      inspecteur worden uitgesteld wanneer door bijzondere omstandigheden de omvang van de uitkeringen niet voor die data
      is vastgesteld.

      5 Indien [artikel 19b, eerste lid][ref13], zoals dat luidde op 31 december 2013, van overeenkomstige
      toepassing is of is geweest op een aanspraak als bedoeld in het eerste lid, waarvan een lichaam als bedoeld in
      [artikel 19a, eerste lid, onderdeel d of e][ref14], zoals dat luidde op 31 december 2013 als verzekeraar optreedt
      en de aanspraak in afwijking van artikel 19b, zoals dat luidde op 31 december 2013, bij de bepaling van de
      verschuldigde belasting niet als loon in aanmerking is genomen, blijft dat artikel van overeenkomstige toepassing
      op die aanspraak.


