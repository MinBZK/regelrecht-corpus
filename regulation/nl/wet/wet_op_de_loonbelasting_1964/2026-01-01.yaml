  - number: 32ab
    text: |-
      1 Als eindheffingsbestanddelen als bedoeld in [artikel 31][ref1] worden mede aangemerkt bij ministeriële regeling
      aan te wijzen verstrekkingen aan anderen dan eigen werknemers, waarvoor geen inhoudingsplicht bestaat bij of
      krachtens een ander artikel van deze wet, ingeval de verstrekker schriftelijke mededeling doet aan de ontvanger van
      het toepassing vinden van deze eindheffing en aannemelijk kan maken wie de ontvanger is van de verstrekking.

      2 Degene die een mededeling heeft gedaan dat hij eindheffing toepast, wordt, zo hij dat nog niet is, aangemerkt
      als inhoudingsplichtige.

      3 Met betrekking tot een eindheffingsbestanddeel als bedoeld in het eerste lid wordt het bedrag van de
      verschuldigde belasting, bedoeld in [artikel 31, tweede lid][ref2], bepaald naar een tarief van:

      1°. 45 percent, met betrekking tot een verstrekking waarvan de waarde in het economische verkeer niet meer bedraagt
      dan € 136;

      2°. 75 percent, met betrekking tot een verstrekking waarvan de waarde in het economische verkeer meer bedraagt
      dan € 136.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel31
