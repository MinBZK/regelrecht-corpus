  - number: '25'
    text: |-
      1 Loontijdvak is het tijdvak waarover het loon wordt genoten. Het bedrag van de belasting over een ander
      loontijdvak dan een jaar wordt door herleiding bepaald. Bij de herleiding wordt een jaar op 260 dagen, een maand op
      65/3 dag, een week op 5 dagen en een tijdvak dat korter is dan een dag op een dag gesteld.

      2 Bij ministeriële regeling kunnen loonbelastingtabellen worden vastgesteld voor loontijdvakken waarvoor Onze
      Minister dit nodig acht. In deze tabellen wordt de heffingskorting voor de loonbelasting op zodanige wijze
      verwerkt dat naast het bedrag aan loon het belastingbedrag of belastingpercentage is vermeld. In deze tabellen
      kan de verwerking van de heffingskorting geheel of ten dele achterwege worden gelaten en kan bij de verwerking
      van de heffingskorting rekening worden gehouden met algemeen voorkomende beloningen die worden belast volgens een
      tabel voor bijzondere beloningen als bedoeld in [artikel 26][ref1]. Bij het opstellen van deze tabellen kunnen
      loonklassen en afrondingen worden aangebracht.

      3 De loonbelastingtabellen worden vastgesteld op basis van de daarvoor benodigde gegevens zoals die vermoedelijk
      zullen luiden op het tijdstip van inwerkingtreding van de tabellen. Voorzover de toegepaste gegevens zodanig
      afwijken van de gegevens zoals die luiden op het tijdstip van inwerkingtreding dat bij toepassing van
      laatstbedoelde gegevens andere tabellen zouden zijn vastgesteld, worden bij ministeriële regeling nieuwe tabellen
      vastgesteld, ingaande ten hoogste zes maanden na het in de eerste volzin bedoelde tijdstip van inwerkingtreding,
      waarin de in de verstreken loontijdvakken ontstane afwijking zoveel mogelijk in de nog niet verstreken
      loontijdvakken van het kalenderjaar wordt ongedaan gemaakt.

      4 In afwijking van het eerste lid wordt een tijdvak waarvan het tijdvak waarover het loon wordt genoten, deel
      uitmaakt, als loontijdvak aangemerkt ten aanzien van:

      a. de werknemer die doorgaans op minder dan vijf dagen per week werkzaam is; en

      b. de loon uit tegenwoordige dienstbetrekking genietende werknemer die met betrekking tot een kalenderkwartaal als
      student of scholier wordt aangemerkt en die schriftelijk, gedagtekend en ondertekend te kennen heeft gegeven dat te
      zijnen aanzien het kwartaal als loontijdvak wordt aangemerkt.

      Bij ministeriële regeling worden nadere regels gesteld voor de toepassing van de eerste zin.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel26
    url: https://wetten.overheid.nl/BWBR0002471/2026-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '26'
        hoofdstuk: III
  - number: '26'
    text: |-
      1 Tantièmes, gratificaties en andere beloningen die in de regel slechts eenmaal of eenmaal per jaar worden
      toegekend, worden belast volgens loonbelastingtabellen voor bijzondere beloningen die bij ministeriële regeling
      worden vastgesteld met overeenkomstige toepassing van [artikel 25, tweede en derde lid][ref1], met dien verstande
      dat in deze tabellen jaarlonen en belastingpercentages worden opgenomen.

      2 Overwerkloon mag worden belast naar het percentage dat wordt aangewezen door de loonbelastingtabel voor
      bijzondere beloningen.

      3 Als jaarloon geldt voor de toepassing van dit artikel:

      a. ingeval de werknemer over het gehele voorafgaande kalenderjaar van de inhoudingsplichtige loon heeft genoten:
      het in dat jaar genoten loon;

      b. ingeval de werknemer over een gedeelte van het voorafgaande kalenderjaar van de inhoudingsplichtige loon heeft
      genoten: het tot een jaarloon herleide bedrag van het in dat jaar genoten loon;

      c. in andere gevallen: het in het kalenderjaar te genieten loon, indien over het gehele jaar van de
      inhoudingsplichtige loon zou worden genoten.

      4 Als overwerkloon gelden voor de toepassing van dit artikel de beloningen ter zake van arbeid welke wordt verricht
      gedurende de tijd die uitgaat boven de voor de werknemer geldende normale arbeidsduur.

      5 Voor het geval de werknemer binnen een samenhangende groep inhoudingsplichtigen in de zin van [artikel 27e][ref2]
      van inhoudingsplichtige is gewisseld, kunnen voor de toepassing van het derde lid bij ministeriële regeling
      aanvullende bepalingen worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel27e
