    text: |-
      [Artikel 13a, tweede lid][ref1], is niet van toepassing op:

      a. loon waarop de belasting met toepassing van die bepaling voor 1 januari 1994 zou zijn ingehouden;

      b. loon waarvan is overeengekomen dat een niet meer dan bijkomstig gedeelte op een ongebruikelijk tijdstip zal
      worden genoten en waarop de belasting met toepassing van die bepaling voor 1 januari 2006 zou zijn ingehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel13a
