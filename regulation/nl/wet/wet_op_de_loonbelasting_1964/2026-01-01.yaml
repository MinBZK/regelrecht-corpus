  - number: 38r
    text: |-
      1 Indien wordt voldaan aan de voorwaarden, genoemd in
      [artikel 220e, eerste lid, onderdelen a en b, van de Pensioenwet][ref1], of
      [artikel 214d, eerste lid, onderdelen a en b, van de Wet verplichte beroepspensioenregeling][ref2], wordt in
      afwijking in zoverre van [artikel 18a, eerste lid][ref3], de maximale premie per dienstjaar bepaald aan de hand
      van de volgende tabel.








                    Indien de belastingplichtige bij het einde van het kalenderjaar


                    bedraagt de premie ten hoogste het volgende percentage van de pensioengrondslag






