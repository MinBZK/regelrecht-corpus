  - number: '21'
    text: |-
      In [dit hoofdstuk][ref1] en de daarop berustende bepalingen wordt verstaan onder:

      a. belastingtarief eerste schijf: het in de eerste regel van de vierde kolom van de tabel in [artikel 20a][ref2]
      opgenomen percentage;

      b. gecombineerd heffingspercentage: de som van het belastingtarief eerste schijf en de volgens
      [artikel 11 van de Wet financiering sociale verzekeringen][ref3] vastgestelde premiepercentages voor de algemene
      ouderdomsverzekering, de nabestaandenverzekering en de verzekering langdurige zorg.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel20a
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel11
