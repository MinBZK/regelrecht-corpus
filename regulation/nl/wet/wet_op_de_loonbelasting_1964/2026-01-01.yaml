  - number: 11b
    text: |-
      Tot het loon behoren voorts mede niet:

      a. een premie als bedoeld in [artikel 31, tweede lid, onderdeel j, van de Participatiewet][ref1],
      mits in het jaar waarin de premie is verstrekt geen vergoeding is verstrekt als bedoeld in
      [artikel 31, tweede lid, onderdeel k, van de Participatiewet][ref2];

      b. een bij ministeriële regeling, zonodig onder het stellen van voorwaarden, aan te wijzen premie die naar aard en
      strekking overeenkomt met een premie als bedoeld in onderdeel a.


