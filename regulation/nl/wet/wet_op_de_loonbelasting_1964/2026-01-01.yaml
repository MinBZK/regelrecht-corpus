  - number: 35b
    text: |-
      1 De belasting wordt geheven door inhouding op de gage.

      2 De inhoudingsplichtige is verplicht de belasting in te houden op het tijdstip waarop de gage wordt genoten.

      3 De inhoudingsplichtige is verplicht de ingehouden belasting op aangifte af te dragen.
    url: https://wetten.overheid.nl/BWBR0002471/2026-01-01#Artikel35b
  - number: 35d
    text: |-
      1 De artiest of beroepssporter is gehouden volgens bij ministeriële regeling te stellen regels aan de
      inhoudingsplichtige:

      a. opgave te doen van gegevens waarvan de kennisneming voor de heffing van de belasting van belang kan zijn;

      b. inzage te verlenen van een op hem betrekking hebbend document als bedoeld in
      [artikel 1, eerste lid, onder 1º tot en met 3º, van de Wet op de identificatieplicht][ref1] om een afschrift
      daarvan in de loonadministratie van de inhoudingsplichtige te laten opnemen;

      c. - indien hij in Nederland woont – opgave te doen van zijn burgerservicenummer.

      2 Opgave van naam, adres, woonplaats en – ingeval hij niet in Nederland woont – woonland en geboortedatum van de
      artiest of beroepssporter alsmede van de overige in dit artikel bedoelde gegevens geschiedt door middel van de door
      de inspecteur verstrekte gageverklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002471/2026-01-01#Artikel35d
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 35e
    text: |-
      De inhoudingsplichtige is gehouden volgens bij ministeriële regeling te stellen regels:

      a. van de artiest of beroepssporter opgave te verlangen van gegevens waarvan de kennisneming voor de heffing van de
      belasting van belang kan zijn;

      b. van de in Nederland wonende artiest opgave te verlangen van zijn burgerservicenummer;

      c. een loonadministratie te voeren en daarbij de gegevens te administreren met betrekking tot de gage en met
      betrekking tot vergoedingen en verstrekkingen die niet tot de gage behoren;

      d. aan de in Nederland wonende artiest, alsmede, op diens verzoek, aan de niet in Nederland wonende artiest of
      beroepssporter, opgave te doen van de in een kalenderjaar genoten gage, van de ingehouden belasting en van andere
      gegevens die van belang kunnen zijn voor de heffing van de inkomstenbelasting;

      e. de identiteit van de artiest of beroepssporter vast te stellen aan de hand van een document als bedoeld in
      [artikel 1, eerste lid, onder 1º tot en met 3º, van de Wet op de identificatieplicht][ref1], alsmede de aard, het
      nummer en een afschrift daarvan in de loonadministratie op te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002471/2026-01-01#Artikel35e
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 35f
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor bepaalde groepen artiesten of beroepssporters nadere
      regelen worden gesteld inzake de heffing van de belasting, alsmede andere in het kader der wet passende nadere
      regelen worden gegeven ter aanvulling van in de wet geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0002471/2026-01-01#Artikel35f
  - number: 35g
    text: |-
      1 Ten aanzien van een buitenlands gezelschap wordt de belasting geheven naar de gage.

      2 Gage is al hetgeen ter zake van het optreden of de sportbeoefening in Nederland wordt ontvangen door het
      buitenlandse gezelschap, dan wel door het lichaam waarmee de leden van het gezelschap een rechtsverhouding hebben
      op grond waarvan het optreden of de sportbeoefening plaatsvindt. Tot de gage behoren kostenvergoedingen alsmede
      aanspraken om na verloop van tijd of onder een voorwaarde een of meer uitkeringen of verstrekkingen te ontvangen.

      3 Tot de gage behoren niet:

      a. vergoedingen en verstrekkingen ter zake van consumpties tijdens de werktijd die geen deel uitmaken van een
      maaltijd volgens bij ministeriële regeling te stellen regels, of ter zake van maaltijden waarbij het zakelijk
      karakter van meer dan bijkomstig belang is;

      b. vergoedingen die strekken tot bestrijding van reis- en verblijfkosten – andere dan kosten van eigen vervoer
      – ter behoorlijke vervulling van het optreden of de sportbeoefening, mits het gezelschap de bewijsstukken aan de
      inhoudingsplichtige doet toekomen en deze de bewijsstukken administreert en voor controle beschikbaar houdt;

      c. verstrekkingen die strekken tot voorkoming van reis- en verblijfkosten ter behoorlijke vervulling van het
      optreden dan wel de sportbeoefening;

      d. aanspraken ingevolge de [Ziektewet][ref1], de [Wet arbeid en zorg][ref2], de
      [Wet werk en inkomen naar arbeidsvermogen][ref3], de [Wet op de arbeidsongeschiktheidsverzekering][ref4] en de
      [Werkloosheidswet][ref5];

      e. aanspraken, die naar aard en strekking overeenkomen met aanspraken als bedoeld in onderdeel d;

      f. aanspraken op uitkeringen wegens overlijden of invaliditeit ten gevolge van een ongeval;

      g. bedragen die worden ingehouden als bijdrage voor aanspraken die naar aard en strekking overeenkomen met
      aanspraken bedoeld in onderdeel e, alsmede bijdrage voor aanspraken, bedoeld in onderdeel f;

      h. uitzendrechten voor zover die betrekking hebben op het land van vestiging van het buitenlands gezelschap.

      4 Tot de gage behoort mede niet hetgeen blijkens een beschikking van de inspecteur als een niet tot de gage
      behorende vergoeding kan worden aangemerkt (kostenvergoedingsbeschikking). De kostenvergoedingsbeschikking wordt
      op verzoek door de inspecteur verstrekt en is vatbaar voor bezwaar. Het verzoek wordt voor het optreden of de
      sportbeoefening gedaan door het gezelschap of de inhoudingsplichtige, dan wel uiterlijk een maand na het optreden
      of de sportbeoefening door de inhoudingsplichtige. Bij algemene maatregel van bestuur worden nadere regels gesteld
      met betrekking tot de kostenvergoedingsbeschikking.

      5 Niet in geld ontvangen gage wordt in aanmerking genomen naar de waarde die daaraan in het economische verkeer kan
      worden toegekend.

      6 Gage wordt beschouwd te zijn ontvangen op het tijdstip:

      a. waarop zij betaald of verrekend wordt, ter beschikking van het gezelschap wordt gesteld of rentedragend wordt;

      b. waarop zij vorderbaar en tevens inbaar wordt, of

      c. indien dat later is dan de tijdstippen, bedoeld in de onderdelen a en b en de inhoudingsplichtige een
      kostenvergoedingsbeschikking heeft aangevraagd: uiterlijk een maand na het optreden of de sportbeoefening.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0013008
      [ref3]: https://wetten.overheid.nl/BWBR0019057
      [ref4]: https://wetten.overheid.nl/BWBR0002524
      [ref5]: https://wetten.overheid.nl/BWBR0004045
