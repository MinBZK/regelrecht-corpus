  - number: '11'
    text: |-
      1 Tot het loon behoren niet:

      a.

      b.

      c. aanspraken ingevolge een pensioenregeling, een en ander volgens de in of krachtens [hoofdstuk IIB][ref1]
      gestelde normeringen en beperkingen;

      d. aanspraken ingevolge een regeling voor vervroegde uittreding als bedoeld in [artikel 32ba][ref2];

      e. aanspraken ingevolge de [Ziektewet][ref3], de [Wet arbeid en zorg][ref4], de
      [Wet werk en inkomen naar arbeidsvermogen][ref5], de [Wet op de arbeidsongeschiktheidsverzekering][ref6] en de
      [Werkloosheidswet][ref7];

      f. aanspraken, die naar aard en strekking overeenkomen met aanspraken als bedoeld in onderdeel e;

      g.

      h. aanspraken op uitkeringen wegens overlijden of invaliditeit ten gevolge van een ongeval;

      i.

      j. bedragen die worden ingehouden:

      1°. als bijdrage ingevolge een pensioenregeling;

      2°. als bijdrage voor aanspraken die ingevolge de onderdelen f en h niet tot het loon behoren;

      3°. in plaats van bijdragen als bedoeld onder 2°;

      k. uitkeringen en verstrekkingen tot vergoeding van door de werknemer in verband met zijn dienstbetrekking geleden
      schade aan of verlies van persoonlijke zaken;

      l. bij ministeriële regeling aan te wijzen voorzieningen voor militaire oorlogs- of dienstslachtoffers die verband
      houden met invaliditeit;

      m. eenmalige uitkeringen en verstrekkingen ter zake van overlijden van de werknemer,
      zijn partner in het kalenderjaar of in het voorafgaande kalenderjaar – in de zin van
      [artikel 1.2 van de Wet inkomstenbelasting 2001][ref8], of zijn kinderen en pleegkinderen, voorzover deze
      uitkeringen en verstrekkingen niet overtreffen driemaal het loon over een maand bepaald met inachtneming van bij
      ministeriële regeling te stellen regels, alsmede aanspraken op de hiervoor bedoelde uitkeringen en verstrekkingen;

      n. uitkeringen en verstrekkingen, andere dan die ter zake van ziekte, invaliditeit, bevalling, adoptie en
      overlijden, die de werknemer ontvangt uit een fonds tot welks middelen de inhoudingsplichtige gedurende de
      laatstverlopen vijf kalenderjaren evenveel of minder heeft bijgedragen dan de bij het fonds betrokken werknemers,
      tenzij die uitkeringen en verstrekkingen geschieden ingevolge een aanspraak die niet tot het loon behoort;

      o. een uitkering of verstrekking die eenmaal wordt toegekend na het bereiken van een diensttijd van ten minste 25
      jaar en een uitkering of verstrekking die eenmaal wordt toegekend na het bereiken van een diensttijd van ten minste
      40 jaar, voor zover de waarde daarvan het loon over een maand niet overtreft, mits is voldaan aan bij ministeriële
      regeling te stellen voorwaarden;

      p.

      q.

      r. aanspraken:

      1°. op vakantieverlof en compensatieverlof, voorzover deze aanspraken aan het einde van het kalenderjaar in totaal
      niet meer bedragen dan de arbeidsduur per week gerekend over een periode van honderd weken;

      2°. op bij ministeriële regeling aan te wijzen geclausuleerd verlof;

      3°. op verlof tijdens rust- en feestdagen.

      s. hetgeen wordt genoten ter zake van het verrichten van arbeid in de onderneming van de partner van de werknemer,
      indien bij het bepalen van de winst uit die onderneming de kosten en lasten die verband houden met de vergoeding
      voor die arbeid op grond van [artikel 3.16, vierde lid, van de Wet inkomstenbelasting 2001][ref9] niet in aftrek
      komen;

      t. aanspraken op een transitievergoeding als bedoeld in [artikel 673 van Boek 7 van het Burgerlijk Wetboek][ref10].

      2 Bij of krachtens ministeriële regeling kan, in overeenstemming met Onze Minister van Sociale Zaken en
      Werkgelegenheid, worden bepaald dat eveneens niet tot het loon behoren andere aanspraken dan bedoeld in het eerste
      lid, indien zulks tot vergemakkelijking van de heffing van de belasting kan leiden.

      3 Voorzover de aanspraken op vakantieverlof en compensatieverlof aan het einde van het kalenderjaar in totaal
      de in het eerste lid, onderdeel r, onder 1°, opgenomen begrenzingen overschrijden, wordt het meerdere geacht te
      zijn genoten bij het einde van het kalenderjaar of het einde van de dienstbetrekking zo deze in de loop van het
      kalenderjaar eindigt.


