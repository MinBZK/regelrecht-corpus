  - number: 32ba
    text: |-
      1 In afwijking in zoverre van het overigens bij of krachtens deze wet bepaalde, wordt een door een
      inhoudingsplichtige gedane en op hem drukkende uitkering ingevolge een regeling voor vervroegde uittreding
      alsmede een door een inhoudingsplichtige voldane en op hem drukkende bijdrage of premie aan een fonds dat of een
      verzekeraar die een zodanige regeling uitvoert, aangemerkt als loon dat als een eindheffingsbestanddeel wordt
      belast naar een tarief van 57,7%.

      2 Een uitkering of een bijdrage of een premie wordt beschouwd te zijn gedaan of voldaan op het tijdstip waarop zij
      betaald of verrekend is, ter beschikking is gesteld of rentedragend is geworden.

      3 Een uitkering, een bijdrage of een premie wordt beschouwd niet te drukken op een inhoudingsplichtige voor
      zover de inhoudingsplichtige ter zake bedragen van werknemers heeft ingehouden of van andere inhoudingsplichtigen
      bijdragen of premies voldaan heeft gekregen.

      4 Ingeval op enig tijdstip een aanspraak ingevolge een regeling voor vervroegde uittreding niet langer als zodanig
      is aan te merken dan wel wordt afgekocht of vervreemd, wordt op het onmiddellijk daaraan voorafgaande tijdstip de
      aanspraak aangemerkt als loon uit vroegere dienstbetrekking van de werknemer of gewezen werknemer. De waarde van
      de aanspraak wordt gesteld op de waarde in het economische verkeer op het in de eerste volzin genoemde tijdstip,
      met dien verstande dat de waarde ten minste wordt gesteld op het bedrag dat ter zake van de vervreemding of afkoop
      wordt genoten.

      5 Ingeval op grond van het vierde lid een aanspraak wordt aangemerkt als loon uit vroegere dienstbetrekking van een
      werknemer of gewezen werknemer, wordt de inhoudingsplichtige die de in dat lid bedoelde regeling voor vervroegde
      uittreding uitvoert voor de toepassing van het eerste lid geacht een uitkering ingevolge een regeling voor
      vervroegde uittreding te hebben gedaan ter grootte van de aldaar bedoelde waarde van die aanspraak, op het tijdstip
      waarop de daar bedoelde aanspraak is aangemerkt als loon uit vroegere dienstbetrekking.

      6 Onder een regeling voor vervroegde uittreding wordt verstaan een regeling die of een gedeelte van een
      regeling dat uitsluitend of nagenoeg uitsluitend ten doel heeft voorafgaand aan het ingaan van uitkeringen
      ingevolge een pensioenregeling of de [Algemene Ouderdomswet][ref1] te voorzien in een of meer uitkeringen
      of verstrekkingen ter overbrugging van de periode tot het ingaan van het pensioen of de uitkering ingevolge
      de [Algemene Ouderdomswet][ref2] dan wel tot het aanvullen van uitkeringen ingevolge een pensioenregeling.
      In afwijking in zoverre van de eerste volzin wordt een regeling niet als regeling voor vervroegde uittreding
      aangemerkt, voor zover die regeling een pensioenovereenkomst inhoudt als bedoeld in de [Pensioenwet][ref3],
      een beroepspensioenregeling inhoudt als bedoeld in de [Wet verplichte beroepspensioenregeling][ref4] of een
      pensioenregeling is als bedoeld in [hoofdstuk IIB][ref5] of [hoofdstuk VIII][ref6].

      7 Een regeling voor vervroegde uittreding in de zin van het zesde lid wordt voor de toepassing van het
      eerste lid niet als zodanig aangemerkt, voor zover die regeling voorziet in een of meer uitkeringen
      in de periode van 36 maanden vóór het bereiken van de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref7], die in totaal niet hoger zijn dan een bedrag van
      € 2.657 vermenigvuldigd met het op hele maanden naar boven afgeronde aantal maanden tussen de eerste uitkering in
      die periode en het bereiken van die pensioengerechtigde leeftijd. Voor de toepassing van de eerste zin worden alle
      regelingen voor vervroegde uittreding in de zin van het zesde lid samengevoegd.

      8 Bij het begin van het kalenderjaar wordt het in het zevende lid genoemde bedrag bij ministeriële
      regeling vervangen door een ander bedrag. Dit bedrag wordt gesteld op de som van het bedrag dat
      na aftrek van de in te houden loonbelasting en premie voor de volksverzekeringen, rekening houdend
      met de algemene heffingskorting voor een persoon die de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref8], nog niet heeft bereikt, gelijk is aan het netto-
      ouderdomspensioen per maand, bedoeld in [artikel 9, vijfde lid, onderdeel a, van die wet][ref9], waarbij de nodig
      geachte afronding wordt aangebracht en € 300. Indien de vervanging tot een ander bedrag leidt, geldt dat bedrag bij
      toepassing van het zevende lid niet met betrekking tot maanden uit op dat moment reeds verstreken kalenderjaren.

      9 Bij het begin van het kalenderjaar wordt het in het achtste lid, tweede zin, laatstgenoemde
      bedrag bij ministeriële regeling vervangen door een ander bedrag. Dit bedrag wordt berekend door
      het te vervangen bedrag te vermenigvuldigen met de contractloonontwikkelingsfactor, bedoeld in
      [artikel 10.2b, tweede lid, van de Wet inkomstenbelasting 2001][ref10], en vervolgens de nodig geachte afronding
      aan te brengen. Indien in het voorafgaande jaar een dergelijke afronding is toegepast, kan bij vervanging worden
      uitgegaan van het niet-afgeronde bedrag.

      10 Op verzoek van de inhoudingsplichtige beslist de inspecteur bij voor bezwaar vatbare beschikking of een regeling
      een regeling voor vervroegde uittreding is. Het verzoek wordt gedaan voordat de regeling dan wel een wijziging van
      de regeling wordt ingevoerd.

      11 Bij ministeriële regeling kunnen nadere regels worden gesteld voor de toepassing van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0002221
