  - number: 10a
    text: |-
      1 Ingeval in het kader van een dienstbetrekking of vroegere dienstbetrekking met een werknemer een
      aandelenoptierecht is overeengekomen, behoort niet de waarde van dat recht tot het loon doch:

      a. de waarde in het economische verkeer van de bij uitoefening van dat recht verkregen aandelen ten tijde van:

      1°. de uitoefening van dat recht ingeval de verkregen aandelen onmiddellijk verhandelbaar zijn; of

      2°. het verhandelbaar worden van de verkregen aandelen ingeval deze niet onmiddellijk verhandelbaar zijn; of

      b. hetgeen door de werknemer wordt genoten ter zake van de vervreemding van dat recht.

      2 Het loon dat ingevolge dit artikel, met uitzondering van het dertiende lid in aanmerking wordt genomen, wordt
      verminderd met het bedrag dat de werknemer ter zake van het aandelenoptierecht in rekening is gebracht, maar niet
      verder dan tot nihil.

      3 Indien zulks plaatsvindt in het kader van een aandelenfusie, een splitsing van een rechtspersoon, een fusie
      van een rechtspersoon of een overname van 50% of meer van de aandelen in de inhoudingsplichtige of een met de
      inhoudingsplichtige verbonden vennootschap wordt als uitoefening of vervreemding van een aandelenoptierecht niet
      beschouwd:

      a. het wijzigen van de voorwaarden van het optierecht terzake van het aandeel waarop het optierecht ziet, of

      b. het vervangen van het optierecht door een ander aandelenoptierecht waarbij dat andere optierecht ziet op een
      ander aandeel, tenzij aannemelijk is dat het wijzigen of het vervangen van het aandelenoptierecht, in meer dan
      betekenende mate plaatsvindt om belastingheffing ter zake van het recht uit te stellen of te ontgaan.

      4 Onder vervreemding wordt mede begrepen het formeel of feitelijk tot voorwerp van zekerheid worden, het
      brengen in het vermogen van een onderneming, alsmede het ontvangen van een schadeloosstelling als bedoeld in
      [artikel 334p, eerste lid][ref1], of [artikel 320, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2]. De
      overgang onder algemene titel van een aandelenoptierecht wordt niet als een vervreemding aangemerkt.

      5 Ingeval bij vervreemding van een aandelenoptierecht de tegenprestatie ontbreekt of is bedongen bij een niet onder
      normale omstandigheden gesloten overeenkomst, wordt als genoten bedrag aangemerkt de waarde in het economische
      verkeer welke ten tijde van de vervreemding aan het recht kan worden toegekend.

      6 Voor de toepassing van dit artikel wordt onder een aandelenoptierecht verstaan een recht om een of meer
      aandelen of daarmee gelijk te stellen rechten te verwerven in de inhoudingsplichtige vennootschap of in een met de
      inhoudingsplichtige verbonden vennootschap, of een daarmee gelijk te stellen recht.

      7 Voor de toepassing van deze wet wordt onder een met de inhoudingsplichtige verbonden vennootschap verstaan:

      a. een vennootschap waarin de inhoudingsplichtige voor ten minste een derde gedeelte belang heeft;

      b. een vennootschap die voor ten minste een derde gedeelte belang heeft in de inhoudingsplichtige;

      c. een vennootschap waarin een derde voor ten minste een derde gedeelte belang heeft, terwijl deze derde tevens
      voor ten minste een derde gedeelte belang heeft in de inhoudingsplichtige.

      8 Voor de toepassing van dit artikel wordt, indien een inhoudingsplichtige vennootschap of een met de
      inhoudingsplichtige vennootschap verbonden vennootschap is betrokken bij een splitsing of een fusie op de voet
      van [artikel 334a][ref3] onderscheidenlijk [artikel 309 van Boek 2 van het Burgerlijk Wetboek][ref4], onder die
      vennootschap mede verstaan de verkrijgende vennootschap in de zin van die artikelen alsmede de vennootschap die
      vóór de splitsing onderscheidenlijk fusie werd aangemerkt als een met de inhoudingsplichtige vennootschap verbonden
      vennootschap.

      9 Indien de bij uitoefening van een aandelenoptierecht als bedoeld in het eerste lid verkregen aandelen op grond
      van een ter zake van dat aandelenoptierecht op de werknemer van toepassing zijnde contractuele bepaling gedurende
      een bepaalde periode niet verhandelbaar zijn als bedoeld in het eerste lid, onderdeel a, onder 2°, worden die
      aandelen voor de toepassing van het eerste lid, onderdeel a, en [artikel 13a, vierde lid, onderdeel b][ref5],
      uiterlijk na een periode van vijf jaar na beursgang van de vennootschap waarin de aandelen worden gehouden dan
      wel indien deze vennootschap bij uitoefening van het aandelenoptierecht reeds beursgenoteerd is uiterlijk na een
      periode van vijf jaar na uitoefening van het aandelenoptierecht geacht verhandelbaar te zijn, met dien verstande
      dat de aandelen ook na die periode van vijf jaar niet geacht worden verhandelbaar te zijn zolang de aandelen
      ingevolge een wettelijke bepaling niet verhandelbaar zijn.

      10 Indien de bij uitoefening van een aandelenoptierecht als bedoeld in het eerste lid verkregen aandelen waarop het
      eerste lid, onderdeel a, nog geen toepassing heeft gevonden worden vervangen door andere aandelen als bedoeld in
      het derde lid, vindt de toepassing van het eerste lid, onderdeel a, [artikel 13a, vierde lid, onderdeel a][ref6],
      en [artikel 32bb, vijfde lid, onderdeel b][ref7], plaats met betrekking tot die andere aandelen, met dien verstande
      dat ingeval die andere aandelen onmiddellijk verhandelbaar zijn de waarde in het economische verkeer van die
      andere aandelen ten tijde van het vervangen van de verkregen aandelen door die andere aandelen in aanmerking wordt
      genomen.

      11 Indien verkregen aandelen als bedoeld in het eerste lid, onderdeel a, onder 2°, niet onmiddellijk verhandelbaar
      zijn als gevolg van een op de werknemer van toepassing zijnde contractuele of wettelijke bepaling en de werknemer
      in strijd met die bepaling de verkregen aandelen vervreemdt voordat het aandelenoptierecht ingevolge het eerste
      lid, met inachtneming van de termijn, bedoeld in het negende lid, in de heffing is betrokken, behoort in zoverre
      in afwijking van het eerste lid tot het loon hetgeen met overeenkomstige toepassing van het vijfde lid door de
      werknemer wordt genoten ter zake van de vervreemding van de verkregen aandelen. Het loon dat ingevolge de eerste
      zin in aanmerking wordt genomen, wordt verminderd met het bedrag dat de werknemer ter zake van de schending van de
      bepaling, bedoeld in de eerste zin, in rekening is gebracht, maar niet verder dan tot nihil.

      12 Indien de bij uitoefening van een aandelenoptierecht als bedoeld in het eerste lid verkregen aandelen niet
      onmiddellijk verhandelbaar zijn als bedoeld in het eerste lid, onderdeel a, onder 2°, wordt naar keuze van
      de werknemer in afwijking van het eerste lid, onderdeel a, onder 2°, tot het loon gerekend de waarde in het
      economische verkeer van de bij uitoefening van dat recht verkregen aandelen ten tijde van de uitoefening van
      dat recht. De eerste zin is slechts van toepassing indien de werknemer de keuze, bedoeld in de eerste zin,
      uiterlijk op het moment van uitoefening van het recht, bedoeld in de eerste zin, schriftelijk kenbaar maakt
      aan de inhoudingsplichtige. De inhoudingsplichtige bewaart de vastlegging van de keuze van de werknemer bij de
      loonadministratie.

      13 Tot het loon ter zake van een aandelenoptierecht als bedoeld in het eerste lid, onderdeel a, worden mede
      gerekend de voordelen die de werknemer geniet uit de bij uitoefening van dat aandelenoptierecht verkregen aandelen
      waarop het eerste lid, onderdeel a, en het twaalfde lid nog geen toepassing hebben gevonden, verminderd met de op
      die voordelen betrekking hebbende kosten, maar niet verder dan tot nihil.

      14 Indien de bij uitoefening van een aandelenoptierecht als bedoeld in het eerste lid verkregen aandelen niet
      onmiddellijk verhandelbaar zijn als bedoeld in het eerste lid, onderdeel a, onder 2°, en het verhandelbaar worden
      van die aandelen deels of geheel afhankelijk is van onzekere factoren die grotendeels buiten de invloedsfeer van
      de werknemer liggen, kunnen bij ministeriële regeling regels worden gesteld met betrekking tot situaties waarin
      bepaalde aandelen voor de toepassing van het eerste lid, onderdeel a, onder 2°, worden geacht niet, deels of geheel
      verhandelbaar te worden.


