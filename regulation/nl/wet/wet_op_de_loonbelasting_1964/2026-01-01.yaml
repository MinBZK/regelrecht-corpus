  - number: 19b
    text: |-
      1 Ingeval op enig tijdstip:

      a. een aanspraak ingevolge een pensioenregeling niet langer als zodanig is aan te merken;

      b. een aanspraak ingevolge een pensioenregeling wordt afgekocht of vervreemd dan wel formeel of
      feitelijk voorwerp van zekerheid, anders dan ten behoeve van uitstel van betaling op grond van
      [artikel 25, vijfde lid, van de Invorderingswet 1990][ref1], wordt;

      c. de zekerheidstelling wordt beëindigd door de werknemer of de gewezen werknemer die zich op grond van
      [artikel 19a, eerste lid, onderdeel d][ref2], heeft verplicht deze zekerheid te stellen;

      wordt op het onmiddellijk daaraan voorafgaande tijdstip de aanspraak aangemerkt als loon uit een vroegere
      dienstbetrekking van de werknemer of gewezen werknemer dan wel, indien deze is overleden, van de gerechtigde tot
      de aanspraak.

      2 Ingeval een verplichting ingevolge een pensioenregeling geheel of gedeeltelijk overgaat op een andere verzekeraar
      wordt de aanspraak ingevolge die regeling geacht te worden afgekocht. De eerste volzin is niet van toepassing
      ingeval de verplichting ingevolge een pensioenregeling geheel of gedeeltelijk overgaat naar een verzekeraar als
      bedoeld in [artikel 19a, eerste lid, onderdelen a, b of d][ref3], mits deze overgang niet in strijd komt met de
      bepalingen bij of krachtens de [artikelen 70 tot en met 91 van de Pensioenwet][ref4].

      3 Het eerste lid is niet van toepassing ingeval de werknemer of gewezen werknemer in het kader van scheiding
      van tafel en bed, echtscheiding of beëindiging van de gezamenlijke huishouding een aanspraak ingevolge een
      pensioenregeling geheel of gedeeltelijk vervreemdt aan zijn echtgenoot of gewezen echtgenoot onderscheidenlijk zijn
      partner of gewezen partner dan wel omzet in een zodanige aanspraak met als gerechtigde die echtgenoot of gewezen
      echtgenoot onderscheidenlijk zijn partner of gewezen partner, waarbij die verkregen of omgezette aanspraak voor
      de toepassing van deze wet wordt geacht de voortzetting te zijn van de aanspraak op een pensioenregeling van de
      werknemer of gewezen werknemer.

      4 Het eerste lid is niet van toepassing voor zover een in onderdeel b van dat lid bedoelde uitkering of afkoopsom
      wordt uitgekeerd met toepassing van [artikel 66][ref5], [67][ref6] of [68 van de Pensioenwet][ref7].

      5 Het eerste lid is niet van toepassing bij een vervreemding als bedoeld in
      [artikel 57, vijfde lid, van de Pensioenwet][ref8] alsmede bij een vermindering als bedoeld in
      [artikel 134, eerste lid, van die wet][ref9].

      6 Ingeval het ouderdomspensioen of het partnerpensioen bij overlijden op of na pensioendatum van
      de werknemer of de gewezen werknemer later ingaat dan op de uiterste ingangsdatum, bedoeld in
      [artikel 18a, vierde lid, onderdeel b][ref10], dan wel vijfde lid, omdat de omvang van de uitkeringen nog moet
      worden vastgesteld, wordt in afwijking in zoverre van het eerste lid de aanspraak op het ouderdomspensioen of het
      partnerpensioen bij overlijden op of na pensioendatum geacht te zijn afgekocht op de datum, bedoeld in de tweede
      zin, onderscheidenlijk derde zin, indien op die datum nog geen vaststelling van de omvang van de uitkeringen heeft
      plaatsgevonden. De datum waarop de aanspraak op het ouderdomspensioen ingevolge een pensioenregeling ingevolge de
      eerste zin niet langer als zodanig wordt aangemerkt is 31 december van het kalenderjaar volgend op het kalenderjaar
      waarin de uiterste ingangsdatum, bedoeld in artikel 18a, vierde lid, onderdeel b, is gelegen. De datum waarop de
      aanspraak op het partnerpensioen bij overlijden op of na pensioendatum ingevolge een pensioenregeling ingevolge
      de eerste zin niet langer als zodanig wordt aangemerkt is 31 december van het tweede kalenderjaar volgend op het
      kalenderjaar waarin de uiterste ingangsdatum, bedoeld in artikel 18a, vijfde lid, is gelegen. De data, bedoeld
      in de tweede en derde zin, kunnen door de inspecteur worden uitgesteld wanneer door bijzondere omstandigheden de
      omvang van de uitkeringen niet voor die data is vastgesteld.

      7 Onze Minister kan, zo nodig onder door hem te stellen voorwaarden, bepalen dat het tweede lid, eerste
      volzin, niet van toepassing is indien de verplichting ingevolge een pensioenregeling overgaat op een niet in
      Nederland gevestigd pensioenfonds of lichaam dat het verzekeringsbedrijf uitoefent , anders dan bedoeld in
      [artikel 19a, eerste lid, onderdeel d][ref11], zulks ter verwerving van aanspraken ingevolge een pensioenregeling
      in het kader van de aanvaarding van een dienstbetrekking buiten Nederland. De eerste volzin is van overeenkomstige
      toepassing met betrekking tot de overgang van de verplichting ingevolge een pensioenregeling naar een pensioenfonds
      van een internationale organisatie in het kader van de aanvaarding van een dienstbetrekking bij die organisatie
      in Nederland.

      8 Voor de toepassing van het eerste lid, onderdeel a, wordt een aanspraak op een pensioenregeling mede niet langer
      als zodanig aangemerkt ingeval op enig tijdstip niet langer wordt voldaan aan de voorwaarden gesteld ingevolge het
      zevende lid of [artikel 19d][ref12].


