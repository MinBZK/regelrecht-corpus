  - number: 38d
    text: |-
      1 Artikel 38a zoals dit artikel luidde op 31 december 2004 blijft van toepassing voor een op 31 december 2004
      bestaande prepensioenregeling als bedoeld in [artikel 38a][ref1], zoals dit artikel toen luidde, indien ingevolge
      die prepensioenregeling na 31 december 2005 nog uitsluitend uitkeringen kunnen worden gedaan:

      a. ingevolge aanspraken die voor 1 januari 2006 zijn opgebouwd, of

      b. aan werknemers die voor 1 januari 2005 de leeftijd van 55 jaar hebben bereikt mits:

      1°. de uitkeringen die ingevolge die prepensioenregeling worden gedaan met inachtneming van algemeen aanvaarde
      actuariële grondslagen worden herrekend ingeval de uitkeringen later ingaan dan op de in de regeling vastgestelde
      ingangsdatum, en

      2°. de prepensioenregeling, met inachtneming van de in of krachtens [artikel 38a][ref2], zoals dit artikel op 31
      december 2004 luidde, gestelde normeringen en beperkingen, de mogelijkheid van deeltijdpensioen biedt.

      2 In afwijking in zoverre van [artikel 18a][ref3] kan de premie meer bedragen dan het aldaar opgenomen maximum
      voor zover zulks het gevolg is van de omzetting van een op 31 december 2005 bestaande aanspraak ingevolge een
      prepensioenregeling als bedoeld in [artikel 38a][ref4], zoals dit artikel op 31 december 2004 luidde, in een
      aanspraak ingevolge een pensioenregeling.

      3 [Artikel 18d, derde lid][ref5], is van overeenkomstige toepassing op een prepensioenregeling als bedoeld
      in het eerste lid waarvan de uitkeringen zijn ingegaan voor het tijdstip waarop die aanspraak is omgezet
      in een aanspraak ingevolge een premieovereenkomst als bedoeld in [artikel 10 van de Pensioenwet][ref6] of
      [artikel 28 van de Wet verplichte beroepspensioenregeling][ref7].


