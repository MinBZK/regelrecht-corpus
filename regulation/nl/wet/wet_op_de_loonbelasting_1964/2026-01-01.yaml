  - number: '23'
    text: |-
      1 De heffingskorting voor de loonbelasting wordt slechts toegepast ingeval de werknemer daartoe een schriftelijk,
      gedagtekend en ondertekend verzoek aan de inhoudingsplichtige heeft gedaan. Het verzoek geldt tot het tijdstip
      waarop de werknemer het verzoek schriftelijk, gedagtekend en ondertekend intrekt.

      2 Indien de werknemer over loontijdvakken die geheel of gedeeltelijk samenvallen loon geniet uit meer dan een
      dienstbetrekking of vroegere dienstbetrekking dan wel van meer dan een inhoudingsplichtige en dit loon voor de
      berekening van de belasting niet wordt samengevoegd, kan de werknemer de heffingskorting voor de loonbelasting
      slechts in een dienstbetrekking dan wel tegenover een inhoudingsplichtige geldend maken.

      3 In afwijking van het eerste lid wordt de belasting ingehouden:

      a. met toepassing van de heffingskorting voor de loonbelasting:

      1°. indien [artikel 27, zesde lid][ref1], toepassing vindt, met betrekking tot het loon van het in dat lid bedoelde
      kind;

      2°. met betrekking tot het loon in de vorm van uitkeringen ingevolge de [Algemene Ouderdomswet][ref2]
      dan wel loon uit vroegere dienstbetrekking waarin zijn begrepen de uitkeringen ingevolge de Algemene
      Ouderdomswet dat een in Nederland wonende werknemer die de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref3], heeft bereikt geniet, tenzij de werknemer een
      schriftelijk, gedagtekend en ondertekend verzoek aan de inhoudingsplichtige heeft gedaan om de heffingskorting voor
      de loonbelasting niet toe te passen;

      b. zonder toepassing van de heffingskorting voor de loonbelasting met betrekking tot tegemoetkomingen als
      bedoeld in [artikel 10 van de Wet tegemoetkoming chronisch zieken en gehandicapten][ref4], zoals dat luidde op
      31 december 2013, [artikel 63a van de Wet werk en inkomen naar arbeidsvermogen](onbekend), [artikel 65l van de
      Wet op de arbeidsongeschiktheidsverzekering](onbekend), [artikel 67i van de Wet arbeidsongeschiktheidsverzekering
      zelfstandigen](onbekend) en [artikel 3:75 van de Wet werk en arbeidsondersteuning jonggehandicapten](onbekend).

      4 In afwijking in zoverre van het eerste en tweede lid wordt door de werknemer, die een uitkering of
      inkomensvoorziening geniet op grond van de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref5], het
      deel van de heffingskorting dat betrekking heeft op de jonggehandicaptenkorting geldend gemaakt tegenover de
      inhoudingsplichtige die de uitkering of inkomensvoorziening op grond van de Wet arbeidsongeschiktheidsvoorziening
      jonggehandicapten uitbetaalt.

      5 De inhoudingsplichtige bewaart het in het eerste en derde lid bedoelde verzoek ten minste vijf jaren na het einde
      van het kalenderjaar waarin de dienstbetrekking is geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel27
