  - number: 38q
    text: |-
      1 Voor een pensioenregeling als bedoeld in [artikel 18][ref1] zoals dat luidde op de dag voorafgaand aan
      het tijdstip van inwerkingtreding van de [Wet toekomst pensioenen][ref2] die na de dag voorafgaand aan het
      tijdstip van inwerkingtreding van de Wet toekomst pensioenen niet voldoet aan [hoofdstuk IIB][ref3], blijven de
      [artikelen 18 tot en met 18ga][ref4] en [19f][ref5] alsmede de daarop gebaseerde bepalingen, zoals die luidden op
      de dag voorafgaand aan het tijdstip van inwerkingtreding van de Wet toekomst pensioenen, van toepassing.

      2 Bij de toepassing van het eerste lid wordt voor:

      a. het aantal deelnemingsjaren, bedoeld in de [artikelen 18, tweede lid, onderdeel a][ref6], en
      [18e, eerste lid, onderdeel c][ref7] zoals deze artikelen luidden op de dag voorafgaand aan het tijdstip van
      inwerkingtreding van de [Wet toekomst pensioenen][ref8] gelezen: 42 deelnemingsjaren;

      b. de leeftijd, bedoeld in [artikel 18e, eerste lid, onderdeel b, tweede lid en derde lid][ref9] zoals dit luidde
      op de dag voorafgaand aan het tijdstip van inwerkingtreding van de [Wet toekomst pensioenen][ref10]: 65-jarige
      leeftijd;

      c. de leeftijd, bedoeld in [artikel 18e, vijfde lid][ref11], zoals dit luidde op de dag voorafgaand aan het
      tijdstip van inwerkingtreding van de [Wet toekomst pensioenen][ref12] gelezen: 67-jarige leeftijd.

      3 Bij de toepassing van het eerste lid wordt voor personen die de 18-jarige leeftijd, maar nog niet de 21-jarige
      leeftijd hebben bereikt voor afwijking als bedoeld in [artikel 18d, eerste lid][ref13], zoals dat luidde op de
      dag voorafgaand aan het tijdstip van inwerkingtreding van de [Wet toekomst pensioenen][ref14], mede in aanmerking
      genomen een situatie waarin een ouderdomspensioen, een partnerpensioen en een wezenpensioen meer bedragen dan de in
      de [artikelen 18a][ref15], [18b][ref16] en [18c][ref17], zoals die op die dag luidden, opgenomen maxima voor zover
      zulks het gevolg is van een regeling waarin de opbouw niet of niet volledig is gekoppeld aan een franchise.

      4 Het derde lid is uitsluitend van toepassing voor op 25 april 2025 bestaande regelingen waarin de opbouw niet of
      niet volledig is gekoppeld aan een franchise.


