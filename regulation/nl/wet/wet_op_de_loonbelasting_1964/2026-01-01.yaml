  - number: 8a
    text: |-
      1 Ten aanzien van een artiest, beroepssporter of buitenlands gezelschap is inhoudingsplichtige:

      a. voorzover de gage wordt ontvangen van degene met wie het optreden of de sportbeoefening is overeengekomen:
      degene met wie het optreden of de sportbeoefening is overeengekomen;

      b. voorzover de gage wordt ontvangen van een derde: deze derde.

      2 Wie niet in Nederland woont of gevestigd is, wordt slechts als inhoudingsplichtige beschouwd voorzover hij in
      Nederland een vaste inrichting voor de uitoefening van zijn bedrijf, beroep of andere bezigheid heeft, dan wel een
      in Nederland wonende of gevestigde vaste vertegenwoordiger. Hierbij wordt mede als vaste inrichting aangemerkt het
      in Nederland verrichten of doen verrichten van werkzaamheden die gericht zijn op het in Nederland laten optreden
      van artiesten, beroepssporters of buitenlandse gezelschappen.

      3 Bij ministeriële regeling kan, in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid, de
      inhoudingsplicht worden verlegd naar een andere persoon dan voortvloeit uit de toepassing van het eerste of tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0002471/2026-01-01#Artikel8a
  - number: '9'
    text: |-
      1 De belasting wordt geheven over het belastbare loon.

      2 Belastbaar loon is het gezamenlijke bedrag aan loon.
    url: https://wetten.overheid.nl/BWBR0002471/2026-01-01#Artikel9
  - number: '10'
    text: |-
      1 Loon is al hetgeen uit een dienstbetrekking of een vroegere dienstbetrekking wordt genoten, daaronder mede
      begrepen hetgeen wordt vergoed of verstrekt in het kader van de dienstbetrekking.

      2 Tot het loon behoren aanspraken om na verloop van tijd of onder een voorwaarde een of meer uitkeringen of
      verstrekkingen te ontvangen.

      3 Onder aanspraken worden mede verstaan rechten op geheel of gedeeltelijk betaald verlof.

      4 Tot het loon behoren uitkeringen en verstrekkingen ingevolge een tot het loon behorende aanspraak voor zover
      de aanspraak in afwijking van hetgeen bij of krachtens deze wet is bepaald, bij de bepaling van de verschuldigde
      belasting niet als loon in aanmerking is genomen.

      5 Onverminderd de omstandigheid dat de inhoudingsplichtige ingevolge [artikel 32ba][ref1] of [artikel 32bb][ref2]
      de aldaar bedoelde belasting is verschuldigd en de bedragen die worden ingehouden als bijdrage ingevolge een in
      [artikel 32ba][ref3] bedoelde regeling tot het loon behoren, behoren tot het loon:

      a. uitkeringen en verstrekkingen uit een voordien niet tot het loon gerekende aanspraak ingevolge een regeling voor
      vervroegde uittreding in de zin van [artikel 32ba][ref4];

      b. vertrekvergoedingen als bedoeld in [artikel 32bb][ref5], met uitzondering van vertrekvergoedingen als bedoeld in
      [artikel 32bb, vijfde lid][ref6];

      c. hetgeen ingevolge [artikel 10a][ref7] tot het loon behoort ter zake van een aandelenoptierecht als bedoeld in
      [artikel 32bb, vijfde lid][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel32ba
