  - number: '34'
    text: |-
      1 Ter vergemakkelijking van de heffing van de inkomstenbelasting kunnen bij algemene maatregel van bestuur regels
      worden gesteld ingevolge welke de loonbelasting mede wordt geheven van natuurlijke personen die:

      a. termijnen van lijfrente of andere periodieke uitkeringen of verstrekkingen genieten;

      b. uitkeringen genieten ter vervanging van gederfde of te derven periodieke uitkeringen of verstrekkingen;

      c. een afkoopsom genieten ter zake van een afkoop als bedoeld in
      [artikel 3.133, tweede lid, onderdeel d, van de Wet inkomstenbelasting 2001][ref1].

      2 Met betrekking tot bedragen ter zake van een afkoop als bedoeld in
      [artikel 3.133, tweede lid, onderdeel d, van de Wet inkomstenbelasting 2001][ref2] bedraagt in
      afwijking van [hoofdstuk III][ref3] de belasting 52% van deze bedragen. Indien de belasting ingevolge
      [artikel 27b, eerste lid][ref4], in één bedrag met de premie voor de volksverzekeringen wordt geheven, wordt in
      afwijking in zoverre van de eerste volzin het bedrag van de verschuldigde belasting tezamen met het bedrag van de
      verschuldigde premie voor de volksverzekeringen gesteld op 52% van de bedoelde bedragen.


