  - number: 18f
    text: |-
      Een nabestaandenoverbruggingspensioen is een pensioen dat:

      a. ingaat in de periode die aanvangt op de eerste dag van de maand waarin de werknemer of gewezen werknemer
      is overleden en die eindigt op de eerste dag van de maand volgend op de maand waarin de werknemer of
      gewezen werknemer is overleden dan wel, ingeval de nabestaande recht heeft op een uitkering ingevolge de
      [Algemene nabestaandenwet][ref1], die eindigt op de eerste dag van de maand volgend op de maand waarin dat recht
      eindigt;

      b. uiterlijk eindigt bij het bereiken van de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref2];

      c. toekomt aan degene voor wie een regeling voor partnerpensioen bij overlijden voor pensioendatum, partnerpensioen
      bij overlijden op of na pensioendatum of wezenpensioen is getroffen of had kunnen worden getroffen;

      d. onder overeenkomstige toepassing van [artikel 18d, derde lid][ref3], niet meer bedraagt dan:

      1°. voor de partner of gewezen partner: 8/7 maal de nominale uitkering ingevolge
      [artikel 17, eerste lid, van de Algemene nabestaandenwet][ref4], vermeerderd met de vakantie-uitkering;

      2°. voor volle wezen: 8/7 maal de nominale uitkering voor een kind van 16 jaar of ouder ingevolge
      [artikel 29, tweede lid, onderdeel c, van de Algemene nabestaandenwet][ref5], vermeerderd met de vakantie-
      uitkering;

      3°. voor halfwezen: 50 percent van het voor volle wezen geldende maximum, bedoeld in onderdeel 2°.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
