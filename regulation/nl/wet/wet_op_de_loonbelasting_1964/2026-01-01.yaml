      2 De in het eerste lid opgenomen premiepercentages worden, indien toepassing van
      [artikel 18a, zesde of zevende lid][ref5], leidt tot een wijziging van het percentage, bedoeld in artikel 18a,
      eerste lid, bij of krachtens algemene maatregel van bestuur gewijzigd. Een wijziging ingevolge de eerste
      zin wordt bekendgemaakt ten minste drie kalenderjaren voordat deze toepassing vindt en wordt bepaald door de
      premiepercentages, genoemd in het eerste lid, te herijken op basis van het rendement dat wordt gehanteerd voor de
      toepassing van artikel 18a, zesde lid.

      3 Een verhoging of een verlaging van de percentages, genoemd in het eerste lid, als gevolg van toepassing van het
      tweede lid, werkt niet terug voor dienstjaren voor het tijdstip van die verhoging of verlaging.

      4 Indien in enig jaar minder premie in aanmerking is genomen dan mogelijk was op grond van het eerste lid, kan het
      niet in aanmerking genomen bedrag alsnog in aanmerking worden genomen, voor zover dit niet in een eerder jaar op
      grond van dit lid in aanmerking is genomen.

      5 [Artikel 18a, derde lid, vijfde zin][ref6], is van overeenkomstige toepassing voor de situatie waarin een lager
      percentage per dienstjaar wordt toegepast dan de percentages, genoemd in de tabel in het eerste lid.


