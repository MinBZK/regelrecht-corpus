      7 Het percentage, genoemd in het eerste lid, wordt bij of krachtens algemene maatregel van bestuur eveneens
      gewijzigd indien het bij overeenkomstige toepassing van het zesde lid resulterende percentage, jaarlijks te bepalen
      per 1 oktober (peildatum), meer dan 5%-punt hoger of lager uitkomt dan het percentage, genoemd in het eerste
      lid, of het meest recente op grond van het zesde lid bekendgemaakte percentage. Een wijziging ingevolge de eerste
      zin wordt bekendgemaakt ten minste drie kalenderjaren voordat deze toepassing vindt. Na een wijziging van het
      percentage ingevolge de eerste zin begint een nieuwe vijfjaarstermijn als bedoeld in het zesde lid.

      8 Een verhoging of een verlaging van het percentage, genoemd in het eerste lid, als gevolg van toepassing van het
      zesde of zevende lid, werkt niet terug voor dienstjaren voor het tijdstip van die verhoging of verlaging.

      9 Een verhoging of een verlaging van de pensioengrondslag, bedoeld in het tweede lid, werkt niet terug voor
      dienstjaren die voor het tijdstip van die verhoging of verlaging zijn geëindigd.

      10 Indien in enig jaar minder premie in aanmerking is genomen dan mogelijk was op grond van het eerste lid, kan het
      niet in aanmerking genomen bedrag alsnog in aanmerking worden genomen, voor zover dit niet in een eerder jaar op
      grond van dit lid in aanmerking is genomen.

      11 Het tijdstip, genoemd in het zesde lid, kan bij algemene maatregel van bestuur worden vervangen door een ander
      tijdstip. De voordracht voor een krachtens de eerste zin vast te stellen algemene maatregel van bestuur wordt niet
      eerder gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.


