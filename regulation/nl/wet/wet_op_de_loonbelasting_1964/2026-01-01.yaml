  - number: '13'
    text: |-
      1 Niet in geld genoten loon wordt in aanmerking genomen naar de waarde die daaraan in het economische verkeer
      kan worden toegekend, met dien verstande dat ingeval door een derde, niet zijnde een met de inhoudingsplichtige
      verbonden vennootschap, ter zake van het niet in geld genoten loon een bedrag aan de inhoudingsplichtige in
      rekening wordt gebracht, het door de derde in rekening gebrachte bedrag in aanmerking wordt genomen.

      2 Met betrekking tot niet in geld genoten loon in de vorm van verstrekkingen van branche-eigen producten van
      het bedrijf van de inhoudingsplichtige dan wel van het bedrijf van een met de inhoudingsplichtige verbonden
      vennootschap, wordt, in zoverre in afwijking van het eerste lid, steeds de waarde die daaraan in het economische
      verkeer kan worden toegekend in aanmerking genomen.

      3 Bij ministeriële regeling kunnen, in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid,
      nadere regels worden gesteld op grond waarvan de waarde van het volgende niet in geld genoten loon op een lager
      bedrag kan worden gesteld dan het ingevolge de vorige leden in aanmerking te nemen bedrag:

      a. voorzieningen die geheel of gedeeltelijk gebruikt of verbruikt worden op een bij die ministeriële regeling aan
      te wijzen werkplek;

      b. het genot van een in het kader van de dienstbetrekking ter beschikking gestelde woning.

      4 De waarde van het rentevoordeel van een door de inhoudingsplichtige dan wel door een met de inhoudingsplichtige
      verbonden vennootschap aan de werknemer verstrekte geldlening ter zake van de aanschaf van een fiets, elektrische
      fiets of elektrische scooter wordt gesteld op nihil.

      5 Bij ministeriële regeling kunnen, in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid,
      nadere regels worden gesteld met betrekking tot de waardering van aanspraken.

      6 De ingevolge de vorige leden in aanmerking te nemen waarde wordt verminderd met het bedrag dat de werknemer
      ter zake in rekening wordt gebracht, met dien verstande dat de aldus verminderde waarde ten minste op nihil wordt
      gesteld.
    url: https://wetten.overheid.nl/BWBR0002471/2026-01-01#Artikel13
  - number: 13bis
    text: |-
      1 Indien ook voor privédoeleinden een auto ter beschikking is gesteld, wordt het voordeel op kalenderjaarbasis
      gesteld op ten minste:

      a. 22% van de waarde van de auto indien de auto niet meer dan 16 jaar geleden voor het eerst in gebruik is genomen;

      b. 35% van de waarde van de auto indien de auto meer dan 16 jaar geleden voor het eerst in gebruik is genomen.

      De auto wordt in ieder geval geacht ook voor privédoeleinden ter beschikking te zijn gesteld tenzij blijkt dat de
      auto op kalenderjaarbasis voor niet meer dan 500 kilometer voor privédoeleinden wordt gebruikt.

      2 Het voordeel, bedoeld in het eerste lid, eerste zin, wordt op kalenderjaarbasis verlaagd met 4% van de waarde van
      de auto indien uit het kentekenregister blijkt dat de CO-uitstoot 0 gram per kilometer is, met dien verstande dat
      het bedrag van de verlaging ten hoogste € 1.200 bedraagt tenzij de auto wordt aangedreven door een motor die kan
      worden gevoed met waterstof of de auto is voorzien van geïntegreerde zonnepanelen waarbij de voor de aandrijving
      benodigde energie wordt opgeslagen in een accupakket dat geen lood bevat en het vermogen van de zonnepanelen
      in wattpiek gedeeld door het verbruik in wattuur per kilometer ten minste 7 is. Het verbruik in wattuur wordt
      gemeten overeenkomstig bijlage XXI bij [Verordening (EU) 2017/1151](32017R1151)van de Commissie van 1 juni 2017
      tot aanvulling van [Verordening (EG) nr. 715/2007](32007R0715) van het Europees Parlement en de Raad betreffende
      de typegoedkeuring van motorvoertuigen met betrekking tot emissies van lichte personen- en bedrijfsvoertuigen
      (Euro 5 en Euro 6) en de toegang tot reparatie- en onderhoudsinformatie, tot wijziging van [Richtlijn 2007/46/EG]
      (32007L0046) van het Europees Parlement en de Raad, [Verordening (EG) nr. 692/2008](32008R0692) van de Commissie en
      [Verordening (EU) nr. 1230/2012](32012R1230) van de Commissie en tot intrekking van [Verordening (EG) nr. 692/2008]
      (32008R0692) van de Commissie (PbEU 2017, L 175).

      3 Voor de toepassing van dit artikel en de daarop berustende bepalingen wordt woon-werkverkeer geacht niet
      voor privédoeleinden plaats te vinden. Indien uit een rittenregistratie of anderszins blijkt dat de auto op
      kalenderjaarbasis voor niet meer dan 500 kilometer voor privédoeleinden wordt gebruikt, wordt het voordeel gesteld
      op nihil. Bij ministeriële regeling kunnen regels worden gesteld waaraan een rittenregistratie moet voldoen. Tevens
      kunnen regels worden gesteld over het anderszins laten blijken dat de auto op kalenderjaarbasis voor niet meer dan
      500 kilometer voor privédoeleinden wordt gebruikt.

      4 Het voordeel wordt in aanmerking genomen voorzover het uitgaat boven de vergoeding die de werknemer voor het
      gebruik voor privé-doeleinden is verschuldigd.

      5 Voor de toepassing van dit artikel en de daarop berustende bepalingen wordt verstaan onder:

      a. *auto:* personenauto of bestelauto als bedoeld in
      [artikel 3 van de Wet op de belasting van personenauto’s en motorrijwielen 1992][ref1], met uitzondering van een
      bestelauto die door aard of inrichting uitsluitend of nagenoeg uitsluitend geschikt blijkt te zijn voor vervoer van
      goederen en met uitzondering van een bestelauto die buiten de werktijd niet gebruikt kan worden of een bestelauto
      waarvoor een verbod op privégebruik geldt, waarbij van een dergelijk verbod op privégebruik sprake is indien:

      1°. het verbod schriftelijk is vastgelegd;

      2°. de inhoudingsplichtige de vastlegging van het verbod bij de loonadministratie bewaart;

      3°. de inhoudingsplichtige voldoende toezicht houdt op de naleving van het verbod, en

      4°. de inhoudingsplichtige een passende sanctie oplegt indien het verbod wordt overtreden;

      b. *waarde van de auto:* catalogusprijs in de zin van
      [artikel 9 van de Wet op de belasting van personenauto’s en motorrijwielen 1992][ref2] vermeerderd met de
      belasting van personenauto’s en motorrijwielen ingevolge de artikelen 9 tot en met 9c van die wet, met dien
      verstande dat de waarde van een auto die meer dan vijftien jaar geleden voor het eerst in gebruik is genomen, wordt
      gesteld op de waarde in het economische verkeer.

      6 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de loontijdvakken waarin het in het
      eerste lid bedoelde voordeel in aanmerking wordt genomen.

      7 Indien de werknemer een verklaring van de inspecteur overlegt waarin is vastgelegd dat de werknemer aan de
      inspecteur heeft medegedeeld dat de hem ter beschikking gestelde auto op kalenderjaarbasis voor niet meer dan
      500 kilometer voor privé-doeleinden wordt gebruikt (verklaring geen privé-gebruik), laat de inhoudingsplichtige
      inhouding van belasting over het in het eerste lid bedoelde voordeel achterwege. De eerste volzin is niet van
      toepassing ingeval de inhoudingsplichtige weet dat de in de eerste volzin bedoelde mededeling niet juist is.

      8 De werknemer kan een verzoek om een verklaring geen privé-gebruik bij de inspecteur indienen. De inspecteur
      beslist op het verzoek bij voor bezwaar vatbare beschikking.

      9 De inspecteur kan de verklaring geen privé-gebruik, al dan niet op verzoek van de werknemer, bij voor bezwaar
      vatbare beschikking intrekken, waarbij de intrekking voor zover nodig terugwerkende kracht kan hebben. Bij algemene
      maatregel van bestuur wordt bepaald in welke gevallen de werknemer om intrekking moet verzoeken.

      10 In geval van een verklaring geen privé-gebruik kan de inspecteur de werknemer op enig moment verzoeken te doen
      blijken dat de auto op kalenderjaarbasis voor niet meer dan 500 kilometer voor privé-doeleinden wordt gebruikt.

      11 Indien de verklaring geen privé-gebruik wordt ingetrokken of indien de werknemer niet
      doet blijken dat de auto op kalenderjaarbasis voor niet meer dan 500 kilometer voor privé-
      doeleinden is gebruikt, wordt de verschuldigde belasting, voorzover nodig in afwijking van
      [artikel 20, tweede lid, van de Algemene wet inzake rijksbelastingen][ref3], nageheven van de werknemer. In
      afwijking van de eerste volzin wordt nageheven van de inhoudingsplichtige ingeval de inhoudingsplichtige wist dat
      de mededeling, bedoeld in het zevende lid, eerste volzin, niet juist was.

      12 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de verklaring geen privé-
      gebruik.

      13 Indien een bestelauto als bedoeld in
      [artikel 3, derde lid, van de Wet op de belasting van personenauto’s en motorrijwielen 1992][ref4] door de
      werknemer uitsluitend zakelijk wordt gebruikt, kan de werknemer door tussenkomst van de inhoudingsplichtige
      met betrekking tot deze auto aan de inspecteur een verklaring uitsluitend zakelijk gebruik afgeven (verklaring
      uitsluitend zakelijk gebruik bestelauto). De ontvangst van die verklaring wordt door de inspecteur bevestigd.
      Indien een verklaring als bedoeld in de eerste volzin is afgegeven, laat de inhoudingsplichtige inhouding van
      belasting over het in het eerste lid bedoelde voordeel achterwege. De vorige volzin is niet van toepassing ingeval
      de inhoudingsplichtige weet dat de in die volzin genoemde verklaring niet juist is.

      14 De werknemer kan de verklaring uitsluitend zakelijk gebruik bestelauto intrekken. De mededeling van de
      intrekking wordt door de inspecteur bevestigd.

      15 In geval van een verklaring uitsluitend zakelijk gebruik bestelauto kan de inspecteur bij het
      vermoeden van een rit voor privédoeleinden, de inhoudingsplichtige en de werknemer verzoeken te
      doen blijken dat de betreffende rit zakelijk was. Slagen inhoudingsplichtige en de werknemer niet
      in dit bewijs, dan wordt de bestelauto geacht op kalenderjaarbasis voor meer dan 500 kilometer voor
      privédoeleinden te worden gebruikt en wordt de verschuldigde belasting, voor zover nodig in afwijking van
      [artikel 20, tweede lid, van de Algemene wet inzake rijksbelastingen][ref5], nageheven van de werknemer. In
      afwijking van de tweede volzin wordt nageheven van de inhoudingsplichtige ingeval hij wist dat de verklaring niet
      juist was of ingeval hij niet aanstonds heeft medegedeeld dat de werknemer ten onrechte de verklaring nog niet
      heeft ingetrokken.

      16 Indien de werknemer de verklaring uitsluitend zakelijk gebruik bestelauto heeft ingetrokken voordat hij de
      bestelauto ook voor privédoeleinden heeft gebruikt, wordt de bestelauto tot het moment van de intrekking geacht wel
      voor privédoeleinden ter beschikking te zijn gesteld, maar niet voor privédoeleinden te zijn gebruikt.

      17 Bij algemene maatregel van bestuur wordt bepaald:

      a. op welke wijze de verklaring uitsluitend zakelijk gebruik bestelauto wordt afgegeven en ingetrokken;

      b. in welke gevallen de werknemer de verklaring in ieder geval moet intrekken;

      c. in welke gevallen de inhoudingsplichtige de inspecteur schriftelijk moet mededelen dat de werknemer de
      verklaring ten onrechte niet heeft ingetrokken en welke gegevens de inhoudingsplichtige bij deze mededeling moet
      verstrekken;

      d. op welke wijze de inspecteur naar aanleiding van een mededeling als bedoeld in onderdeel c bekendmaakt dat de
      verklaring uitsluitend zakelijk gebruik bestelauto geacht wordt te zijn ingetrokken;

      e. vanaf welk moment de verklaring bij toepassing van onderdeel d geacht wordt te zijn ingetrokken.

      18 Na de eerste wijziging van de CO-uitstootgrens of het percentage in het tweede lid na de datum van eerste
      toelating van de auto, is voor een periode van 60 maanden te rekenen vanaf de eerste dag van de maand volgend op
      de datum van eerste toelating, de verlaging, bedoeld in het tweede lid, van toepassing overeenkomstig de bepalingen
      die gelden direct voorafgaand aan die wijziging.

      19 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot een auto waarvan de datum van
      de eerste tenaamstelling in het kentekenregister niet overeenkomt met de datum van eerste toelating op de weg van
      die auto.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005806#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0005806#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0002320#Artikel20
