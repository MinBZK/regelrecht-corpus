  - number: 35m
    text: |-
      De inhoudingsplichtige is gehouden volgens bij ministeriële regeling te stellen regels:

      a. van het buitenlandse gezelschap opgave te verlangen van gegevens waarvan de kennisneming voor de heffing van de
      belasting van belang kan zijn;

      b. een loonadministratie te voeren en daarbij de gegevens te administreren met betrekking tot de gage en met
      betrekking tot vergoedingen en verstrekkingen die niet tot de gage behoren;

      c. de identiteit van een zo groot mogelijk deel, doch ten minste het merendeel van de
      leden van het gezelschap vast te stellen aan de hand van een document als bedoeld in
      [artikel 1, eerste lid, onder 1º tot en met 3º, van de Wet op de identificatieplicht][ref1], alsmede de aard, het
      nummer en een afschrift daarvan in de loonadministratie op te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002471/2026-01-01#Artikel35m
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 35n
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor buitenlandse gezelschappen nadere regelen worden
      gesteld inzake de heffing van de belasting, alsmede andere in het kader der wet passende nadere regelen worden
      gegeven ter aanvulling van in de wet geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0002471/2026-01-01#Artikel35n
