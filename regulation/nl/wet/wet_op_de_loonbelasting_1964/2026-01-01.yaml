  - number: 38b
    text: |-
      1 Een wijziging van de begrenzingen, bedoeld in [artikel 18, derde lid][ref1], is niet van toepassing op aanspraken
      die vóór de datum van inwerkingtreding van die wijziging zijn ontstaan, voor zover die wijziging niet ten gunste
      van de werknemer of gewezen werknemer is.

      2 Het eerste lid is niet van toepassing op aanspraken die na de dag voorafgaand aan het
      tijdstip van inwerkingtreding van de [Wet toekomst pensioenen][ref2] zijn omgezet in aanspraken
      ingevolge een premieovereenkomst als bedoeld in [artikel 10 van de Pensioenwet][ref3] of
      [artikel 28 van de Wet verplichte beroepspensioenregeling][ref4]. De eerste zin is van overeenkomstige toepassing
      op de pensioenregeling van een directeur-grootaandeelhouder als bedoeld in [artikel 1 van de Pensioenwet][ref5]
      waarvan als verzekeraar optreedt een lichaam als bedoeld in [artikel 19a, eerste lid, onderdelen a of b][ref6].

      3 In afwijking in zoverre van het eerste lid is een wijziging van de begrenzingen, bedoeld in
      [artikel 18, derde lid][ref7], ten gunste van de werknemer of gewezen werknemer niet van toepassing op
      aanspraken waarvan een lichaam als bedoeld in [artikel 19a, eerste lid, onderdelen d of e][ref8], zoals
      dat artikel luidde op 31 december 2016 als verzekeraar optreedt. De eerste zin is niet van toepassing op
      [artikel 18a, vierde lid][ref9], en [artikel 19b, zesde lid][ref10].

      4 Het tweede lid is niet van toepassing op:

      a. een aanspraak ingevolge een wezenpensioenregeling als bedoeld in [artikel 18c][ref11] zoals dat luidde op
      30 juni 2023 die is ontstaan of waarvan de uitkeringen zijn ingegaan voor het tijdstip waarop die aanspraak is
      omgezet in een aanspraak ingevolge een premieovereenkomst als bedoeld in [artikel 10 van de Pensioenwet][ref12] of
      [artikel 28 van de Wet verplichte beroepspensioenregeling][ref13];

      b. een aanspraak ingevolge een nabestaandenoverbruggingspensioenregeling als bedoeld in [artikel 18f][ref14]
      zoals dat luidde op 30 juni 2023 waarvan de uitkeringen zijn ingegaan voor het tijdstip waarop die aanspraak is
      omgezet in een aanspraak ingevolge een premieovereenkomst als bedoeld in [artikel 10 van de Pensioenwet][ref15] of
      [artikel 28 van de Wet verplichte beroepspensioenregeling][ref16];

      c. een aanspraak ingevolge een overbruggingspensioenregeling als bedoeld in [artikel 38f][ref17] zoals dat
      luidde op 30 juni 2023 waarvan de uitkeringen zijn ingegaan voor het tijdstip waarop die aanspraak is omgezet
      in een aanspraak ingevolge een premieovereenkomst als bedoeld in [artikel 10 van de Pensioenwet][ref18] of
      [artikel 28 van de Wet verplichte beroepspensioenregeling][ref19].


