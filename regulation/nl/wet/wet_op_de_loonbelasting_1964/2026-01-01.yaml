  - number: 21a
    text: |-
      De heffingskorting voor de loonbelasting is het deel van de standaardloonheffingskorting dat tot de
      standaardloonheffingskorting in dezelfde verhouding staat als het belastingtarief eerste schijf staat tot het
      gecombineerde heffingspercentage.
    url: https://wetten.overheid.nl/BWBR0002471/2026-01-01#Artikel21a
  - number: 21b
    text: |-
      Bij de toepassing van [artikel 21a][ref1] op het deel van de standaardloonheffingskorting dat op de ouderenkorting
      of de alleenstaande ouderenkorting betrekking heeft, wordt het gecombineerde heffingspercentage verminderd
      met het volgens [artikel 11, eerste lid, van de Wet financiering sociale verzekeringen][ref2] voor de algemene
      ouderdomsverzekering vastgestelde premiepercentage.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel21a
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel11
    url: https://wetten.overheid.nl/BWBR0002471/2026-01-01#Artikel21b
