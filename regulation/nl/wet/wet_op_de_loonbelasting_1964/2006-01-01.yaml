  - number: 38c.2.a
    text: die voor 1 januari 2006 reeds een of meer uitkeringen ingevolge deze regeling genoten, of
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel38c
  - number: 38c.2.b
    text: |-
      die voor 1 januari 2005 de leeftijd van 55 jaar hebben bereikt en ten aanzien van wie de uitkeringen die ingevolge
      deze regeling worden gedaan met inachtneming van algemeen aanvaarde actuariële grondslagen worden herrekend ingeval
      de uitkeringen later ingaan dan op de in de regeling vastgestelde ingangsdatum.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel38c
  - number: 38c.3
    text: |-
      Een aanspraak ingevolge een regeling voor vervroegde uittreding als bedoeld in het tweede lid kan met
      inachtneming van algemeen aanvaarde actuariële grondslagen worden omgezet in een aanspraak ingevolge een
      ouderdomspensioenregeling, voorzover het ouderdomspensioen na de omzetting niet meer bedraagt dan 100% van het
      laatstverdiende loon.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel38c
  - number: 38d.1
    text: |-
      Voor een op 31 december 2004 bestaande prepensioenregeling als bedoeld in [artikel 38a][ref1], zoals dit artikel
      op 31 december 2004 luidde, blijft tot en met 31 december 2005 [artikel 38a][ref2], zoals dit artikel luidde op 31
      december 2004, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel38a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel38a
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel38d
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 38a
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 38a
        hoofdstuk: VIII
  - number: 38d.2
    text: |-
      In afwijking in zoverre van het eerste lid blijft [artikel 38a][ref1], zoals dit artikel luidde op 31 december
      2004, van toepassing voor een op 31 december 2004 bestaande prepensioenregeling als bedoeld in [artikel 38a][ref2],
      zoals dit artikel toen luidde, indien ingevolge die prepensioenregeling na 31 december 2005 nog uitsluitend
      uitkeringen kunnen worden gedaan:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel38a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel38a
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel38d
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 38a
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 38a
        hoofdstuk: VIII
  - number: 38d.2.a
    text: ingevolge aanspraken die voor 1 januari 2006 zijn opgebouwd, of
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel38d
  - number: 38d.2.b
    text: 'aan werknemers die voor 1 januari 2005 de leeftijd van 55 jaar hebben bereikt mits:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel38d
  - number: 38d.2.b.1°
    text: |-
      de uitkeringen die ingevolge die prepensioenregeling worden gedaan met inachtneming van algemeen aanvaarde
      actuariële grondslagen worden herrekend ingeval de uitkeringen later ingaan dan op de in de regeling vastgestelde
      ingangsdatum, en
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel38d
  - number: 38d.2.b.2°
    text: |-
      de prepensioenregeling, met inachtneming van de in of krachtens [artikel 38a][ref1], zoals dit artikel op 31
      december 2004 luidde, gestelde normeringen en beperkingen, de mogelijkheid van deeltijdpensioen biedt.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel38a
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel38d
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 38a
        hoofdstuk: VIII
  - number: 38d.3
    text: |-
      In afwijking in zoverre van [artikel 18a][ref1] kan een ouderdomspensioen meer bedragen dan de aldaar opgenomen
      maxima voor zover zulks het gevolg is van de omzetting van een op 31 december 2005 bestaande aanspraak ingevolge
      een prepensioenregeling als bedoeld in [artikel 38a][ref2], zoals dit artikel op 31 december 2004 luidde, in een
      aanspraak ingevolge een pensioenregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel38a
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel38d
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18a
        hoofdstuk: IIB
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 38a
        hoofdstuk: VIII
  - number: 38e.1
    text: |-
      Voor een op 31 december 2004 bestaande regeling voor ouderdomspensioen, als bedoeld in [artikel 18a][ref1] zoals
      dit artikel op 31 december 2004 luidde, blijft tot en met 31 december 2005 [artikel 18a][ref2], zoals dit artikel
      luidde op 31 december 2004, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel38e
    references:
