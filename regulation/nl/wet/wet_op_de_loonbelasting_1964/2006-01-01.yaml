        hoofdstuk: VIII
  - number: 38h.1
    text: |-
      Een op 31 december 2004 bestaande aanspraak die uitsluitend of nagenoeg uitsluitend als gevolg van de met
      ingang van 1 januari 2005 in werking getreden wijzigingen van deze wet niet langer als een aanspraak ingevolge
      een pensioenregeling is aan te merken, wordt in afwijking in zoverre van het bij deze wet bepaalde tot en met
      31 december 2006 toch als een aanspraak ingevolge een pensioenregeling aangemerkt, onder gehoudenheid van de
      inhoudingsplichtige tot afdracht van de in het tweede lid aangeduide heffing.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel38h
  - number: 38h.2
    text: |-
      Ter zake van de in het eerste lid bedoelde aanspraak is de inhoudingsplichtige verschuldigd een heffing naar een
      tarief van 52% en over een grondslag als geduid in het derde lid.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel38h
  - number: 38h.3
    text: |-
      De grondslag waarover de heffing is verschuldigd, is het positieve verschil tussen de toename van de waarde
      in het economische verkeer van de aanspraak en de toename van de waarde in het economische verkeer van de
      aanspraak ingeval op 1 januari 2006 de pensioenregeling reeds zodanig zou zijn aangepast dat deze blijft binnen
      de begrenzingen zoals die gelden met ingang van 1 januari 2005. De in de eerste volzin bedoelde grondslag wordt
      aangemerkt als loon dat als een eindheffingsbestanddeel wordt belast.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel38h
  - number: 38h.4
    text: |-
      Uitkeringen en verstrekkingen uit een aanspraak als bedoeld in het eerste lid behoren tot het loon, onverminderd de
      omstandigheid dat de inhoudingsplichtige ingevolge het eerste lid de aldaar bedoelde heffing is verschuldigd.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel38h
  - number: 38h.5
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld voor de toepassing van dit artikel waaronder regels
      om te komen tot een praktische benadering van de grondslag.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel38h
  - number: 38i
    text: |-
      Bij algemene maatregel van bestuur kunnen met het oog op een goede invoering of een
      doelmatige toepassing van de wijzigingen die zijn aangebracht in deze wet bij de
      [Wet aanpassing fiscale behandeling VUT/prepensioen en introductie levensloopregeling][ref1], regels worden
      gesteld waarbij zo nodig kan worden afgeweken van het bepaalde bij of krachtens [hoofdstuk IIB][ref2] of
      [hoofdstuk VIII van deze wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0018053
      [ref2]: https://wetten.overheid.nl/BWBR0002471#HoofdstukIIB
      [ref3]: https://wetten.overheid.nl/BWBR0002471#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel38i
    references:
      - id: ref1
        bwb_id: BWBR0018053
      - id: ref2
        bwb_id: BWBR0002471
        hoofdstuk: IIB
      - id: ref3
        bwb_id: BWBR0002471
        hoofdstuk: VIII
  - number: '39'
    text: |-
      [Artikel 13][ref1], is niet van toepassing op loon waarop de belasting met toepassing van die bepaling voor 1
      januari 1994 zou zijn ingehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel13a
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel39
    references:
