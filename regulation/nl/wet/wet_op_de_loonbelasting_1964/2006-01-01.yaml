---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_op_de_loonbelasting_1964
regulatory_layer: WET
publication_date: '2025-12-23'
valid_from: '2006-01-01'
bwb_id: BWBR0002471
url: https://wetten.overheid.nl/BWBR0002471/2006-01-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is het Besluit op de Loonbelasting 1940 door een meer
    overzichtelijke en op verschillende punten herziene wettelijke regeling te vervangen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Onder de naam 'loonbelasting' wordt van werknemers of hun inhoudingsplichtige, van artiesten, van beroepssporters,
      van buitenlandse gezelschappen en van bij of krachtens deze wet aan te wijzen andere personen een directe belasting
      geheven.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel1
  - number: '2.1'
    text: |-
      Werknemer is de natuurlijke persoon die tot een inhoudingsplichtige in privaatrechtelijke of in publiekrechtelijke
      dienstbetrekking staat of van een inhoudingsplichtige loon geniet uit een vroegere privaatrechtelijke of
      publiekrechtelijke dienstbetrekking van hemzelf of van een ander, dan wel uit een bestaande privaatrechtelijke of
      publiekrechtelijke dienstbetrekking van een ander.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel2
  - number: '2.2'
    text: |-
      Degene die van een Nederlandse publiekrechtelijke rechtspersoon loon geniet uit een dienstbetrekking tot
      een niet-inhoudingsplichtige dan wel loon in de vorm van premies voor werkaanvaarding ten behoeve van
      uitkeringsgerechtigden, wordt geacht tot die rechtspersoon in dienstbetrekking te staan.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel2
  - number: '2.3'
    text: |-
      Tenzij werkzaamheden zijn of worden verricht in een functie van bestuurder of commissaris van een in Nederland
      gevestigd lichaam, dan wel in dienstbetrekking bij de Staat der Nederlanden of in het kader van een uitzending op
      grond van een verdrag waarbij de Staat der Nederlanden partij is, is het eerste lid niet van toepassing op personen
      die niet in Nederland wonen, met betrekking tot een geheel buiten Nederland vervulde dienstbetrekking. Voor
      werkzaamheden die zijn of worden verricht aan boord van schepen of luchtvaartuigen in het internationale verkeer
      van een onderneming waarvan de leiding in Nederland is gevestigd, is de eerste volzin slechts van toepassing indien
      wordt voldaan aan de in het vierde lid gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel2
  - number: '2.4'
    text: |-
      Het eerste lid is eveneens niet van toepassing op personen die niet in Nederland wonen, met betrekking tot een
      nagenoeg geheel buiten Nederland vervulde dienstbetrekking, anders dan de dienstbetrekkingen die in het derde lid,
      eerste volzin, zijn genoemd, indien:
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel2
  - number: 2.4.a
    text: |-
      het loon is onderworpen aan een belasting naar het inkomen die door of vanwege de Nederlandse Antillen, Aruba of
      een andere mogendheid wordt geheven, en
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel2
  - number: 2.4.b
    text: |-
      het loon niet op grond van een verdrag ter voorkoming van dubbele belasting of op grond van enige andere regel
      van interregionaal of internationaal recht in feite slechts in Nederland aan een belasting naar het inkomen is
      onderworpen.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel2
  - number: '2.5'
    text: |-
      Het eerste lid is eveneens niet van toepassing op personen die niet in Nederland wonen, met betrekking
      tot een gedeeltelijk, maar niet nagenoeg geheel buiten Nederland vervulde dienstbetrekking, anders dan de
      dienstbetrekkingen die in het derde lid, eerste volzin, zijn genoemd, voorzover het loon uit die dienstbetrekking
      met inachtneming van verdragen waarbij de Staat der Nederlanden partij is, feitelijk is onderworpen aan een
      belasting naar het inkomen die door of vanwege de Nederlandse Antillen, Aruba of een andere mogendheid wordt
      geheven.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel2
  - number: '2.6'
    text: |-
      Het eerste lid is eveneens niet van toepassing op personen die als vrijwilliger uitsluitend vergoedingen of
      verstrekkingen ontvangen met een gezamenlijke waarde van ten hoogste € 150 per maand en € 1 500 per kalenderjaar.
      Hierbij wordt onder vrijwilliger verstaan degene die niet bij wijze van beroep arbeid verricht voor een
      privaatrechtelijk of publiekrechtelijk lichaam dat niet is onderworpen aan de vennootschapsbelasting dan wel voor
      een sportorganisatie. Het desbetreffende lichaam is gehouden volgens ministeriële regeling te stellen regels opgave
      te doen van gegevens waarvan de kennisneming voor de uitvoering van de [Wet werk en bijstand][ref1] van belang is.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015703
  - number: '2.7'
    text: Krachtens wettelijk vruchtgenot aan een kind ontleend loon wordt geacht door het kind te zijn genoten.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel2
  - number: '2.8'
    text: |-
      Loon in de vorm van periodieke uitkeringen welke van publiekrechtelijke aard zijn, kan in het kalenderjaar
      waarin de verstrekking van die uitkeringen aanvangt dan wel eindigt volgens bij ministeriële regeling te
      stellen regels worden geacht niet te zijn genoten door de werknemer doch door zijn partner in de zin van
      [artikel 1.2 van de Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel1
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '1'
  - number: '3.1'
    text: 'Als dienstbetrekking wordt beschouwd de arbeidsverhouding van:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel3
  - number: 3.1.a
    text: |-
      degene, die, anders dan in de uitoefening van een bedrijf of in de zelfstandige uitoefening van een
      beroep, en anders dan als thuiswerker, ingevolge een overeenkomst tot aanneming van werk als bedoeld in
      [artikel 750 van Boek 7 van het Burgerlijk Wetboek][ref1], persoonlijk een werk tot stand brengt;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel750
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '750'
  - number: 3.1.b
    text: degene, die de in onderdeel a bedoelde persoon bij het tot stand brengen van dat werk bijstaat;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel3
  - number: 3.1.c
    text: |-
      degene, die krachtens overeenkomst met een ander tegen beloning geregeld zijn bemiddeling verleent tot het tot
      stand komen van overeenkomsten tussen daartoe door hem te bezoeken personen en die ander, mits hij de bedoelde
      bemiddeling uitsluitend voor die ander verleent, het verlenen van die bemiddeling niet een voor hem bijkomstige
      werkzaamheid is en hij zich daarbij doorgaans niet door meer dan twee andere personen laat bijstaan;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel3
  - number: 3.1.d
    text: |-
      degene, die krachtens overeenkomst met een ander tegen beloning geregeld zijn bemiddeling verleent tot het tot
      stand komen van overeenkomsten tussen daartoe door hem te bezoeken personen en een opdrachtgever van die ander,
      mits hij de bedoelde bemiddeling uitsluitend voor die ander verleent, het verlenen van die bemiddeling niet een
      voor hem bijkomstige werkzaamheid is en hij zich daarbij doorgaans niet door meer dan twee andere personen laat
      bijstaan;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel3
  - number: 3.1.e
    text: |-
      degene, die werkzaam is om vakbekwaamheid te verwerven, onder wie mede wordt begrepen degene, die als leerling van
      een instelling van onderwijs praktisch werkzaam is, alsmede degene, die aan een bedrijfsschool opleiding ontvangt,
      een en ander indien een beloning wordt genoten, die niet uitsluitend bestaat in het ontvangen van onderricht;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel3
  - number: 3.1.f
    text: |-
      het kind van 15 jaar of ouder dat werkzaam is in de onderneming van zijn ouder, tenzij die onderneming
      deel uitmaakt van een samenwerkingsverband met het kind en het kind daaruit als ondernemer als bedoeld in
      [artikel 3.4 van de Wet inkomstenbelasting 2001][ref1] winst uit onderneming geniet;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 3.1.g
    text: |-
      de commissaris van een lichaam in de zin van de [Algemene wet inzake rijksbelastingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: 3.1.h
    text: |-
      degene, die in de zin van [artikel 4 van de Ziektewet][ref1] (Stb. 1987, 88) als bestuurder werkzaam is ten behoeve
      van een coöperatie.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel4
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '4'
  - number: '3.2'
    text: |-
      Het eerste lid, onderdelen a en b, vindt geen toepassing indien de in onderdeel a bedoelde overeenkomst
      rechtstreeks is aangegaan met een natuurlijk persoon ten behoeve van diens persoonlijke aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel3
  - number: '4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regelen worden gesteld, ingevolge welke eveneens als
      dienstbetrekking wordt beschouwd de arbeidsverhouding van:
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel4
  - number: 4.a
    text: degene, die als thuiswerker arbeid verricht;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel4
  - number: 4.b
    text: degene, die de onder *a* bedoelde persoon als hulp bij het verrichten van de arbeid bijstaat;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel4
  - number: 4.c
    text: |-
      degene, die een tak van sport op topniveau beoefent en ter zake daarvan een inkomensvoorziening of een
      kostenvergoeding geniet;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel4
  - number: 4.d
    text: |-
      degene, die arbeid verricht ten behoeve van een vennootschap waarin hij een aanmerkelijk belang heeft in de zin van
      de [Wet inkomstenbelasting 2001][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: 4.e
    text: |-
      degene, die tegen beloning persoonlijk arbeid verricht en wiens arbeidsverhouding niet reeds ingevolge de
      voorgaande bepalingen als dienstbetrekking wordt beschouwd, doch hiermede maatschappelijk gelijk kan worden
      gesteld;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel4
  - number: 4.f
    text: |-
      degene die uit een arbeidsverhouding die niet op grond van een andere bepaling als dienstbetrekking wordt beschouwd
      een beloning geniet, mits diegene vooraf aan de inspecteur meldt, door middel van een gezamenlijke verklaring van
      hemzelf en de beoogde inhoudingsplichtige, dat zijn arbeidsverhouding als dienstbetrekking moet worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel4
  - number: '5'
    text: |-
      Als dienstbetrekking wordt niet beschouwd de arbeidsverhouding van degene, die ten behoeve van de natuurlijke
      persoon, tot wie hij in dienstbetrekking staat, uitsluitend of nagenoeg uitsluitend huiselijke of persoonlijke
      diensten in diens huishouden verricht en die diensten doorgaans op minder dan drie dagen per week verricht.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel5
  - number: 5a.1
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt verstaan onder artiest dan wel
      beroepssporter: degene die ingevolge een overeenkomst van korte duur, dan wel kortstondig krachtens een
      andere grond, als musicus of anderszins als artiest optreedt dan wel als beroep een tak van sport beoefent
      (beroepssporter).
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel5a
  - number: 5a.2
    text: |-
      Degene die ingevolge een overeenkomst van korte duur, dan wel kortstondig krachtens een andere grond, als musicus
      of anderszins als artiest optreedt dan wel als beroep een tak van sport beoefent, is geen artiest onderscheidenlijk
      beroepssporter ingeval:
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel5a
  - number: 5a.2.a
    text: 'hij in Nederland woont, en:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel5a
  - number: 5a.2.a.1°
    text: |-
      bij een beschikking als bedoeld in [artikel 3.156 van de Wet inkomstenbelasting 2001](onbekend) is verklaard dat de
      voordelen die hij geniet uit zijn optreden of sportbeoefening, worden aangemerkt als winst uit een onderneming, of
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel5a
  - number: 5a.2.a.2°
    text: |-
      bij een beschikking als bedoeld in [artikel 3.157 van de Wet inkomstenbelasting 2001](onbekend) is verklaard
      dat de werkzaamheden die hij verricht in het kader van zijn optreden of sportbeoefening, worden aangemerkt als
      werkzaamheden uitsluitend verricht voor rekening en risico van de onderneming van een in Nederland gevestigde
      vennootschap waarin hij een aanmerkelijk belang heeft;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel5a
  - number: 5a.2.b
    text: |-
      hij het optreden rechtstreeks is overeengekomen met een natuurlijke persoon ten behoeve van diens persoonlijke
      aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel5a
  - number: 5a.3
    text: |-
      Ingeval een artiest of beroepssporter optreedt of als beroep een tak van sport beoefent in het kader van een
      dienstbetrekking tot een in Nederland gevestigde inhoudingsplichtige, is hij voor de toepassing van deze wet en de
      daarop berustende bepalingen werknemer.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel5a
  - number: 5a.4
    text: |-
      Ingeval een niet in Nederland wonende artiest of beroepssporter optreedt of als beroep een tak van sport beoefent
      in het kader van een dienstbetrekking tot een inhoudingsplichtige die niet in Nederland is gevestigd, vindt de
      heffing van loonbelasting plaats ingevolge de regelingen zoals die gelden voor artiesten en beroepssporters.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel5a
  - number: 5b.1
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt verstaan onder buitenlands gezelschap:
      een groep van hoofdzakelijk niet in Nederland wonende natuurlijke personen of gevestigde rechtspersonen waarbij
      de leden van de groep individueel of gezamenlijk ingevolge een overeenkomst van korte duur, dan wel kortstondig
      krachtens een andere grond, als artiest in Nederland optreden of als beroep een tak van sport in Nederland
      beoefenen.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel5b
  - number: 5b.2
    text: |-
      De rechten die een buitenlands gezelschap heeft en de verplichtingen die daarop rusten, komen toe aan elk lid van
      het gezelschap en rusten op elk lid van het gezelschap. Een lid kan zich doen vertegenwoordigen door een lid dat
      als leider van het gezelschap fungeert.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel5b
  - number: 5b.3
    text: |-
      Ingeval een lid van een buitenlands gezelschap optreedt of als beroep een tak van sport beoefent in het kader
      van een dienstbetrekking tot een inhoudingsplichtige die niet in Nederland is gevestigd, vindt de heffing van
      loonbelasting plaats ingevolge de regelingen zoals die gelden voor het buitenlandse gezelschap.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel5b
  - number: '6.1'
    text: 'Inhoudingsplichtige is:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel6
  - number: 6.1.a
    text: degene, tot wie een of meer personen in dienstbetrekking staan;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel6
  - number: 6.1.b
    text: degene, die aan een of meer personen loon uit een vroegere dienstbetrekking tot hemzelf of tot een ander verstrekt;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel6
  - number: 6.1.c
    text: |-
      degene, die ingevolge een aanspraak die niet tot het loon behoort, aan een of meer personen uitkeringen of
      verstrekkingen uit een dienstbetrekking tot een ander doet.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel6
  - number: '6.2'
    text: 'Wie niet in Nederland woont of gevestigd is, wordt slechts als inhoudingsplichtige beschouwd voor zover hij:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel6
  - number: 6.2.a
    text: |-
      in Nederland een vaste inrichting voor de uitoefening van zijn bedrijf, beroep of andere bezigheid of een in
      Nederland wonende of gevestigde vaste vertegenwoordiger heeft, dan wel
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel6
  - number: 6.2.b
    text: |-
      een of meer personen in dienst heeft van wie het loon is onderworpen aan de inkomstenbelasting, met betrekking tot
      deze personen de loonadministratie in Nederland houdt en zich voor deze personen als inhoudingsplichtige bij de
      inspecteur heeft gemeld.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel6
  - number: '6.3'
    text: 'Voor de toepassing van het tweede lid, onderdeel *a*, wordt als een vaste inrichting in ieder geval aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel6
  - number: 6.3.a
    text: |-
      het verrichten van werkzaamheden in het kader van een onderneming gedurende een aaneengesloten periode van ten
      minste 30 dagen, indien die werkzaamheden plaatsvinden in, op of boven het Noordzeewinningsgebied, waarbij onder
      Noordzeewinningsgebied wordt verstaan de territoriale zee van Nederland alsmede het buiten de territoriale zee
      onder de Noordzee gelegen deel van de zeebodem en de ondergrond daarvan, voor zover het Koninkrijk der Nederlanden
      daar op grond van het internationale recht ten behoeve van de exploratie en de exploitatie van natuurlijke
      rijkdommen soevereine rechten mag uitoefenen;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel6
  - number: 6.3.b
    text: |-
      het verrichten van werkzaamheden die gericht zijn op het verlenen van tussenkomst ten behoeve van degenen die tegen
      beloning persoonlijke arbeid in Nederland verrichten en een derde ten behoeve van wie die arbeid wordt verricht.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel6
  - number: '6.4'
    text: |-
      Diplomatieke, consulaire en andere vertegenwoordigers van andere Mogendheden en de hun toegevoegde ambtenaren,
      alsmede bij ministeriële regeling aan te wijzen internationale organisaties en vertegenwoordigers en
      functionarissen daarvan, worden niet als inhoudingsplichtigen beschouwd.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel6
  - number: '6.5'
    text: |-
      Ingeval [artikel 19b][ref1] toepassing vindt, is in afwijking van het eerste lid voor de aanspraak die ingevolge
      dat artikel als loon wordt aangemerkt, inhoudingsplichtige degene die als verzekeraar van die aanspraak optreedt.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19b
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19b
        hoofdstuk: IIB
  - number: 6a
    text: |-
      Als inhoudingsplichtige van een persoon wordt niet beschouwd degene die beschikt over een afschrift van een aan
      hem getoonde beschikking als bedoeld in [artikel 3.156][ref1] of [3.157 van de Wet inkomstenbelasting 2001][ref2]
      waaruit blijkt dat de voordelen die die persoon geniet, worden aangemerkt als winst uit een onderneming of de
      werkzaamheden die die persoon verricht, worden aangemerkt als werkzaamheden verricht voor rekening en risico van
      een vennootschap waarin die persoon een aanmerkelijk belang heeft, mits:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 6a.a
    text: |-
      de werkzaamheden die in de beschikking zijn aangeduid overeenkomen met de werkzaamheden die die persoon voor hem
      verricht;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel6a
  - number: 6a.b
    text: 'de werkzaamheden die die persoon voor hem verricht:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel6a
  - number: 6a.b.1°
    text: vallen in het tijdvak waarvoor de beschikking geldt, of
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel6a
  - number: 6a.b.2°
    text: |-
      vallen in het kalenderjaar aansluitend op het tijdvak waarvoor de beschikking geldt en worden verricht op basis van
      een overeenkomst die is aangegaan:
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel6a
  - number: 6a.b.2°.a
    text: vóór 1 november van het kalenderjaar waarin het tijdvak is gelegen waarvoor de beschikking geldt, en
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel6a
  - number: 6a.b.2°.b
    text: |-
      ingeval voor het aansluitende kalenderjaar reeds een beschikking is aangevraagd, voor de dagtekening van de voor
      dat kalenderjaar geldende beschikking, en
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel6a
  - number: 6a.c
    text: |-
      hij de identiteit van die persoon heeft vastgesteld aan de hand van een document als bedoeld in
      [artikel 1, eerste lid, onder 1° tot en met 3°, van de Wet op de identificatieplicht][ref1], alsmede de aard en
      het nummer daarvan in zijn administratie heeft opgenomen en een afschrift daarvan er bij bewaart.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '7'
    text: 'Als degene, tot wie de dienstbetrekking bestaat, wordt beschouwd:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel7
  - number: 7.1°
    text: |-
      in de gevallen, bedoeld in [artikel 3, eerste lid, onder][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel3
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '3'
        hoofdstuk: I
  - number: 7.1°.a
    text: en b. de aanbesteder;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel7
  - number: 7.1°.c
    text: en d. degene, met wie de overeenkomst tot bemiddeling is gesloten;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel7
  - number: 7.1°.e
    text: degene, bij wie de werkzaamheden worden verricht of de opleiding wordt genoten;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel7
  - number: 7.1°.f
    text: de ouder;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel7
  - number: 7.1°.g
    text: het lichaam;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel7
  - number: 7.1°.h
    text: de coöperatie;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel7
  - number: 7.2°
    text: |-
      in de gevallen, bedoeld in [artikel 4, onder][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel4
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '4'
        hoofdstuk: I
  - number: 7.2°.a
    text: de opdrachtgever;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel7
  - number: 7.2°.b
    text: de thuiswerker;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel7
  - number: 7.2°.c
    text: degene, met wie de inkomensvoorziening of kostenvergoeding is overeengekomen;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel7
  - number: 7.2°.d
    text: de vennootschap;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel7
  - number: 7.2°.e
    text: |-
      en f. degene, die bij de in [artikel 4][ref1] bedoelde algemene maatregel van bestuur als inhoudingsplichtige is
      aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel4
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '4'
        hoofdstuk: I
  - number: '8'
    text: |-
      Bij ministeriële regeling kan, in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid, een ander
      dan de persoon bedoeld in [artikel 6][ref1] of [artikel 7][ref2] worden aangewezen als inhoudingsplichtige met
      betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel7
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '6'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '7'
        hoofdstuk: I
  - number: 8.a
    text: |-
      degene, die krachtens overeenkomst met een ander tegen beloning geregeld zijn bemiddeling verleent tot het tot
      stand komen van overeenkomsten tussen daartoe door hem te bezoeken personen en een opdrachtgever van die ander;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel8
  - number: 8.b
    text: degene, die een thuiswerker als hulp bij het verrichten van de arbeid bijstaat;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel8
  - number: 8.c
    text: degene, die als beroep een tak van sport beoefent.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel8
  - number: 8a.1
    text: |-
      Ten aanzien van een artiest, beroepssporter of buitenlands gezelschap is inhoudingsplichtige, indien het optreden
      of de sportbeoefening is gebaseerd op een overeenkomst van korte duur:
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel8a
  - number: 8a.1.a
    text: |-
      voorzover de gage wordt ontvangen van degene met wie het optreden of de sportbeoefening is overeengekomen: degene
      met wie het optreden of de sportbeoefening is overeengekomen;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel8a
  - number: 8a.1.b
    text: 'voorzover de gage wordt ontvangen van een derde: deze derde.'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel8a
  - number: 8a.2
    text: |-
      Indien het optreden of de sportbeoefening is gebaseerd op een andere grond, geschiedt de heffing op de voet van
      [artikel 35b, tweede lid][ref1], of [artikel 35i, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel35b
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel35i
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 35b
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 35i
        hoofdstuk: VIIA
  - number: 8a.3
    text: |-
      Wie niet in Nederland woont of gevestigd is, wordt slechts als inhoudingsplichtige beschouwd voorzover hij in
      Nederland een vaste inrichting voor de uitoefening van zijn bedrijf, beroep of andere bezigheid heeft, dan wel een
      in Nederland wonende of gevestigde vaste vertegenwoordiger. Hierbij wordt mede als vaste inrichting aangemerkt het
      in Nederland verrichten of doen verrichten van werkzaamheden die gericht zijn op het in Nederland laten optreden
      van artiesten, beroepssporters of buitenlandse gezelschappen.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel8a
  - number: 8a.4
    text: |-
      Bij ministeriële regeling kan, in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid, de
      inhoudingsplicht worden verlegd naar een andere persoon dan voortvloeit uit de toepassing van het eerste of tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel8a
  - number: '9.1'
    text: De belasting wordt geheven over het belastbare loon.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel9
  - number: '9.2'
    text: Belastbaar loon is het loon verminderd met de zeedagenaftrek.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel9
  - number: '10.1'
    text: Loon is al hetgeen uit een dienstbetrekking of een vroegere dienstbetrekking wordt genoten.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel10
  - number: '10.2'
    text: |-
      Tot het loon behoren aanspraken om na verloop van tijd of onder een voorwaarde een of meer uitkeringen of
      verstrekkingen te ontvangen.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel10
  - number: '10.3'
    text: Onder aanspraken worden mede verstaan rechten op geheel of gedeeltelijk betaald verlof.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel10
  - number: '10.4'
    text: |-
      Tot het loon behoren uitkeringen en verstrekkingen ingevolge een tot het loon behorende aanspraak voor zover de
      aanspraak in afwijking van hetgeen bij of krachtens deze wet is bepaald, bij de bepaling van de verschuldigde
      belasting niet als loon in aanmerking is genomen.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel10
  - number: '10.5'
    text: |-
      Tot het loon behoren uitkeringen en verstrekkingen uit een voordien niet tot het loon gerekende aanspraak
      ingevolge een regeling voor vervroegde uittreding in de zin van [artikel 32aa][ref1], onverminderd de omstandigheid
      dat de bedragen die worden ingehouden als bijdrage ingevolge een zodanige regeling tot het loon behoren en de
      inhoudingsplichtige ingevolge [artikel 32aa][ref2] de aldaar bedoelde belasting is verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel32aa
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel32aa
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 32aa
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 32aa
        hoofdstuk: V
  - number: 10a.1
    text: |-
      Ingeval in het kader van een dienstbetrekking of vroegere dienstbetrekking met een werknemer een aandelenoptierecht
      is overeengekomen, behoort niet de waarde van dat recht tot het loon doch hetgeen door de werknemer ter zake van de
      uitoefening of vervreemding van dat recht wordt genoten.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel10a
  - number: 10a.2
    text: |-
      Het loon dat ingevolge het eerste lid in aanmerking wordt genomen, wordt verminderd met het bedrag dat de werknemer
      ter zake van het aandelenoptierecht in rekening is gebracht, maar niet verder dan tot nihil.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel10a
  - number: 10a.3
    text: |-
      Indien zulks plaatsvindt in het kader van een aandelenfusie, een splitsing van een rechtspersoon, een fusie
      van een rechtspersoon of een overname van 50% of meer van de aandelen in de inhoudingsplichtige of een met de
      inhoudingsplichtige verbonden vennootschap wordt als uitoefening of vervreemding van een aandelenoptierecht niet
      beschouwd:
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel10a
  - number: 10a.3.a
    text: het wijzigen van de voorwaarden van het optierecht terzake van het aandeel waarop het optierecht ziet, of
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel10a
  - number: 10a.3.b
    text: |-
      het vervangen van het optierecht door een ander aandelenoptierecht waarbij dat andere optierecht ziet op een
      ander aandeel, tenzij aannemelijk is dat het wijzigen of het vervangen van het aandelenoptierecht, in meer dan
      betekenende mate plaatsvindt om belastingheffing ter zake van het recht uit te stellen of te ontgaan.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel10a
  - number: 10a.4
    text: |-
      Onder vervreemding wordt mede begrepen het formeel of feitelijk tot voorwerp van zekerheid worden, het
      brengen in het vermogen van een onderneming, alsmede het ontvangen van een schadeloosstelling als bedoeld in
      [artikel 334p, eerste lid][ref1], of [artikel 320, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2]. De
      overgang onder algemene titel van een aandelenoptierecht wordt niet als een vervreemding aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel334p
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel320
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 334p
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '320'
  - number: 10a.5
    text: |-
      Ingeval bij vervreemding van een aandelenoptierecht de tegenprestatie ontbreekt of is bedongen bij een niet onder
      normale omstandigheden gesloten overeenkomst, wordt als genoten bedrag aangemerkt de waarde in het economische
      verkeer welke ten tijde van de vervreemding aan het recht kan worden toegekend.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel10a
  - number: 10a.6
    text: |-
      Voor de toepassing van [dit artikel][ref1] wordt onder een aandelenoptierecht verstaan een recht om een of meer
      aandelen of daarmee gelijk te stellen rechten te verwerven in de inhoudingsplichtige vennootschap of in een met de
      inhoudingsplichtige verbonden vennootschap, of een daarmee gelijk te stellen recht.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 10a
        hoofdstuk: II
  - number: 10a.7
    text: 'Voor de toepassing van deze wet wordt onder een met de inhoudingsplichtige verbonden vennootschap verstaan:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel10a
  - number: 10a.7.a
    text: een vennootschap waarin de inhoudingsplichtige voor ten minste een derde gedeelte belang heeft;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel10a
  - number: 10a.7.b
    text: een vennootschap die voor ten minste een derde gedeelte belang heeft in de inhoudingsplichtige;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel10a
  - number: 10a.7.c
    text: |-
      een vennootschap waarin een derde voor ten minste een derde gedeelte belang heeft, terwijl deze derde tevens voor
      ten minste een derde gedeelte belang heeft in de inhoudingsplichtige.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel10a
  - number: 10a.8
    text: |-
      Voor de toepassing van [dit artikel][ref1] wordt, indien een inhoudingsplichtige vennootschap of een met de
      inhoudingsplichtige vennootschap verbonden vennootschap is betrokken bij een splitsing of een fusie op de voet
      van [artikel 334a][ref2] onderscheidenlijk [artikel 309 van Boek 2 van het Burgerlijk Wetboek][ref3], onder die
      vennootschap mede verstaan de verkrijgende vennootschap in de zin van die artikelen alsmede de vennootschap die
      vóór de splitsing onderscheidenlijk fusie werd aangemerkt als een met de inhoudingsplichtige vennootschap verbonden
      vennootschap.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel334a
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel309
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 10a
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003045
        artikel: 334a
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '309'
  - number: '11.1'
    text: 'Tot het loon behoren niet:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel11
  - number: 11.1.a
    text: |-
      vergoedingen die naar algemene maatschappelijke opvattingen niet als beloningsvoordeel worden ervaren, een en ander
      volgens de in of krachtens [hoofdstuk IIA][ref1] gestelde normeringen en beperkingen (vrije vergoedingen);


      [ref1]: https://wetten.overheid.nl/BWBR0002471#HoofdstukIIA
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002471
        hoofdstuk: IIA
  - number: 11.1.b
    text: |-
      verstrekkingen die naar algemene maatschappelijke opvattingen niet als beloningsvoordeel worden ervaren, een en
      ander volgens de in of krachtens de [artikelen 17][ref1] en [17a][ref2] gestelde normeringen en beperkingen (vrije
      verstrekkingen);


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel17a
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '17'
        hoofdstuk: IIA
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 17a
        hoofdstuk: IIA
  - number: 11.1.c
    text: |-
      aanspraken ingevolge een pensioenregeling, een en ander volgens de in of krachtens [hoofdstuk IIB][ref1] gestelde
      normeringen en beperkingen;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#HoofdstukIIB
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002471
        hoofdstuk: IIB
  - number: 11.1.d
    text: |-
      aanspraken ingevolge een regeling voor vervroegde uittreding als bedoeld in [artikel 32aa][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel32aa
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 32aa
        hoofdstuk: V
  - number: 11.1.e
    text: |-
      aanspraken ingevolge de [Ziektewet][ref1], de [Wet arbeid en zorg][ref2], de
      [Wet werk en inkomen naar arbeidsvermogen][ref3], de [Wet op de arbeidsongeschiktheidsverzekering][ref4] en de
      [Werkloosheidswet][ref5];


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0013008
      [ref3]: https://wetten.overheid.nl/BWBR0019057
      [ref4]: https://wetten.overheid.nl/BWBR0002524
      [ref5]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0013008
      - id: ref3
        bwb_id: BWBR0019057
      - id: ref4
        bwb_id: BWBR0002524
      - id: ref5
        bwb_id: BWBR0004045
  - number: 11.1.f
    text: aanspraken, die naar aard en strekking overeenkomen met aanspraken als bedoeld in onderdeel e;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel11
  - number: 11.1.g
    text: 'aanspraken op periodieke uitkeringen ter vervanging van gederfd of te derven loon, mits:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel11
  - number: 11.1.g.1°
    text: |-
      deze aanspraken voorzien in aan de werknemer of gewezen werknemer toekomende periodieke uitkeringen die niet
      later ingaan dan in het jaar waarin hij de leeftijd van 65 jaar bereikt of in periodieke uitkeringen die bij
      zijn overlijden ingaan en toekomen aan zijn echtgenoot of gewezen echtgenoot dan wel degene met wie hij duurzaam
      een gezamenlijke huishouding voert of heeft gevoerd en met wie geen bloed- of aanverwantschap in de rechte lijn
      bestaat, of aan zijn kinderen of pleegkinderen die de leeftijd van 30 jaar nog niet hebben bereikt;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel11
  - number: 11.1.g.2°
    text: |-
      voor deze aanspraken als verzekeraar optreedt een lichaam als bedoeld in
      [artikel 19a, eerste lid, onderdelen a, b of d][ref1], of de natuurlijke persoon, bedoeld in
      [artikel 19a, eerste lid, onderdeel e][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19a
        hoofdstuk: IIB
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 19a
        hoofdstuk: IIB
  - number: 11.1.g.3°
    text: |-
      deze aanspraken niet zijn opgekomen ingevolge [artikel 19b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19b
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19b
        hoofdstuk: IIB
  - number: 11.1.h
    text: aanspraken op uitkeringen wegens overlijden of invaliditeit ten gevolge van een ongeval;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel11
  - number: 11.1.i
    text: |-
      aanspraken op de in onderdeel m bedoelde uitkeringen en verstrekkingen alsmede vergoedingen en verstrekkingen
      ter zake van op de werknemer drukkende uitgaven voor het volgen van een opleiding of studie met het oog op het
      verwerven van inkomen uit werk en woning
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel11
  - number: 11.1.j
    text: 'bedragen die worden ingehouden:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel11
  - number: 11.1.j.1°
    text: |-
      als bijdrage ingevolge een pensioenregeling of een regeling voor vervroegde uittreding, met dien verstande dat bij
      een regeling voor vervroegde uittreding de helft van deze bijdragen in aanmerking wordt genomen;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel11
  - number: 11.1.j.2°
    text: |-
      als premie bedoeld in [hoofdstuk 3 van de Wet financiering sociale verzekeringen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0017745
        hoofdstuk: '3'
  - number: 11.1.j.3°
    text: als bijdrage voor aanspraken die ingevolge de onderdelen f en h niet tot het loon behoren;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel11
  - number: 11.1.j.4°
    text: in de plaats van premies en bijdragen als bedoeld onder 2° en 3°;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel11
  - number: 11.1.j.5°
    text: |-
      als bijdragen ingevolge een levensloopregeling, volgens de bij of krachtens [hoofdstuk IIC][ref1] gestelde
      normeringen en beperkingen;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#HoofdstukIIC
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002471
        hoofdstuk: IIC
  - number: 11.1.k
    text: |-
      uitkeringen en verstrekkingen tot vergoeding van door de werknemer in verband met zijn dienstbetrekking geleden
      schade aan of verlies van persoonlijke zaken;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel11
  - number: 11.1.l
    text: |-
      uitkeringen en verstrekkingen tot dekking van op de werknemer drukkende kosten ter zake van ziekte,
      invaliditeit en bevalling, behoudens vergoedingen ter zake van premies en bijdragen voor ziektekostenregelingen,
      uitkeringen en verstrekkingen die naar aard en omvang overeenkomen met prestaties als bedoeld bij of krachtens
      [artikel 11 van de Zorgverzekeringswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '11'
  - number: 11.1.m
    text: |-
      eenmalige uitkeringen en verstrekkingen ter zake van overlijden van de werknemer, zijn partner in het kalenderjaar
      of in het voorafgaande kalenderjaar – in de zin van [artikel 1.2 van de Wet inkomstenbelasting 2001][ref1], of zijn
      kinderen en pleegkinderen, voorzover deze uitkeringen en verstrekkingen niet overtreffen driemaal het loon over een
      maand bepaald met inachtneming van bij ministeriële regeling te stellen regels;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel1
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '1'
  - number: 11.1.n
    text: |-
      uitkeringen en verstrekkingen, andere dan die ter zake van ziekte, invaliditeit, bevalling, adoptie en overlijden,
      die de werknemer ontvangt uit een fonds tot welks middelen de inhoudingsplichtige gedurende de laatstverlopen
      vijf kalenderjaren evenveel of minder heeft bijgedragen dan de bij het fonds betrokken werknemers, tenzij die
      uitkeringen en verstrekkingen geschieden ingevolge een aanspraak die niet tot het loon behoort;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel11
  - number: 11.1.o
    text: |-
      een uitkering of verstrekking die eenmaal wordt toegekend na het bereiken van een diensttijd van ten minste 25 jaar
      en een uitkering of verstrekking die eenmaal wordt toegekend na het bereiken van een diensttijd van ten minste 40
      jaar, voor zover de waarde daarvan het loon over een maand niet overtreft, mits is voldaan aan bij ministeriële
      regeling te stellen voorwaarden;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel11
  - number: 11.1.q
    text: |-
      verstrekking en terbeschikkingstelling van inrichting van de werkruimte in de woning, een duurzaam aan een plaats
      gebonden schip of woonwagen in de zin van [artikel 1 van de Woningwet][ref1], de aanhorigheden daaronder begrepen,
      van de werknemer, alsmede vergoedingen van de kosten daarvan, voorzover de waarde in het economische verkeer van
      die inrichting in het kalenderjaar en de vier voorafgaande kalenderjaren niet meer bedraagt dan € 1815 en niet
      aannemelijk is dat zij niet mede dient ter vervulling van de dienstbetrekking, mits:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '1'
  - number: 11.1.q.1°
    text: |-
      de werknemer krachtens een schriftelijk vastgelegde regeling van de inhoudingsplichtige dan wel van de
      inhoudingsplichtige en een of meer andere inhoudingsplichtigen ten minste eenmaal per week, gedurende de
      gebruikelijke werktijd en zonder dat tevens wordt gereisd naar een buiten de woning gelegen arbeidsplaats, in die
      werkruimte ter vervulling van de dienstbetrekking pleegt te werken met behulp van telematica; en
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel11
  - number: 11.1.q.2°
    text: |-
      de inrichting voldoet aan bij ministeriële regeling te stellen voorwaarden; een en ander met inachtneming van bij
      ministeriële regeling te stellen nadere regels;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel11
  - number: 11.1.r
    text: 'aanspraken:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel11
  - number: 11.1.r.1°
    text: |-
      op vakantieverlof en compensatieverlof, voorzover deze aanspraken aan het einde van het kalenderjaar in totaal niet
      meer bedragen dan de arbeidsduur per week gerekend over een periode van vijftig weken;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel11
  - number: 11.1.r.2°
    text: op bij ministeriële regeling aan te wijzen geclausuleerd verlof;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel11
  - number: 11.1.r.3°
    text: op verlof tijdens rust- en feestdagen;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel11
  - number: 11.1.r.4°
    text: ingevolge een levensloopregeling;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel11
  - number: 11.1.s
    text: |-
      hetgeen wordt genoten ter zake van het verrichten van arbeid in de onderneming van de partner van de werknemer,
      indien bij het bepalen van de winst uit die onderneming de kosten en lasten die verband houden met de vergoeding
      voor die arbeid op grond van [artikel 3.16, vierde lid, van de Wet inkomstenbelasting 2001][ref1] niet in aftrek
      komen;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 11.1.t
    text: |-
      verstrekking van een recht op vervoer voorzover dat betrekking heeft op een periode van ten hoogste zes maanden,
      waarbij de financiering van dit vervoer vanwege dreigende verkeershinder door wegwerkzaamheden grotendeels door de
      overheid plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel11
  - number: '11.2'
    text: |-
      Bij of krachtens ministeriële regeling kan, in overeenstemming met Onze Minister van Sociale Zaken en
      Werkgelegenheid, worden bepaald dat eveneens niet tot het loon behoren andere aanspraken dan bedoeld in het eerste
      lid, indien zulks tot vergemakkelijking van de heffing van de belasting kan leiden.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel11
  - number: '11.3'
    text: |-
      Voorzover de aanspraken op vakantieverlof en compensatieverlof en de aanspraken ingevolge een levensloopregeling
      aan het einde van het kalenderjaar in totaal de in het eerste lid, onderdeel r, onder 1°, en de in
      [artikel 19g, eerste lid, onderdeel b][ref1], opgenomen begrenzingen overschrijden, wordt het meerdere geacht te
      zijn genoten bij het einde van het kalenderjaar of het einde van de dienstbetrekking zo deze in de loop van het
      kalenderjaar eindigt.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19g
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19g
        hoofdstuk: IIC
  - number: 11b
    text: 'Tot het loon behoren voorts mede niet:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel11b
  - number: 11b.a
    text: |-
      een premie als bedoeld in [artikel 31, tweede lid, onderdeel j, van de Wet werk en bijstand][ref1],
      mits in het jaar waarin de premie is verstrekt geen vergoeding is verstrekt als bedoeld in
      [artikel 31, tweede lid, onderdeel k, van de Wet werk en bijstand][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel31
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '31'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '31'
  - number: 11b.b
    text: |-
      een vergoeding als bedoeld in [artikel 31, tweede lid, onderdeel k, van de Wet werk en bijstand][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel31
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '31'
  - number: '12'
    text: |-
      Bij ministeriële regeling kunnen, in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid,
      regels worden gesteld met betrekking tot het bedrag aan fooien en dergelijke prestaties van derden, dat in bepaalde
      gevallen of groepen van gevallen geacht wordt te zijn genoten. Daarbij kan worden bepaald, dat een bedrag aan
      fooien en dergelijke prestaties van derden niet tot het loon behoort.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel12
  - number: 12a.1
    text: |-
      Ten aanzien van de werknemer die arbeid verricht ten behoeve van een lichaam waarin hij een aanmerkelijk
      belang heeft dan wel waaraan hij vermogensbestanddelen ter beschikking stelt, beide in de zin van de
      [Wet inkomstenbelasting 2001][ref1], wordt het in een kalenderjaar genoten loon ten minste gesteld op € 39 000
      dan wel, indien aannemelijk is dat ter zake van soortgelijke dienstbetrekkingen waarbij een aanmerkelijk belang
      of terbeschikkingstelling van vermogensbestanddelen geen rol speelt, in het economische verkeer een lager loon
      gebruikelijk is, gesteld op dat lagere loon. Indien aannemelijk is dat ter zake van soortgelijke dienstbetrekkingen
      waarbij een aanmerkelijk belang of terbeschikkingstelling van vermogensbestanddelen geen rol speelt, in het
      economische verkeer een hoger loon gebruikelijk is, wordt het loon gesteld op een zodanig bedrag dat het niet meer
      in belangrijke mate afwijkt van hetgeen gebruikelijk is, met dien verstande dat – indien bij het lichaam of daarmee
      verbonden lichamen ook andere werknemers in dienst zijn – het niet lager wordt gesteld dan het hoogste loon van de
      overige werknemers. Ingeval aannemelijk is dat het loon, gelet op wat gebruikelijk is in het economische verkeer
      waarbij een aanmerkelijk belang of terbeschikkingstelling van vermogensbestanddelen geen rol speelt, op een lager
      bedrag behoort te worden gesteld dan het hoogste loon van de overige werknemers wordt het, in afwijking in zoverre
      van de vorige volzin, op een zodanig bedrag gesteld dat het niet meer in belangrijke mate afwijkt van hetgeen
      gebruikelijk is. Het loon wordt nimmer op een lager bedrag gesteld dan het bedrag ingevolge de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: 12a.2
    text: |-
      Het in het eerste lid vermelde bedrag wordt bij het begin van het kalenderjaar bij ministeriële regeling
      vervangen door een ander. Dit bedrag wordt berekend door het te vervangen bedrag te vermenigvuldigen met de
      tabelcorrectiefactor van [artikel 10.2 van de Wet inkomstenbelasting 2001][ref1] en vervolgens de nodig geachte
      afronding aan te brengen. Indien in het voorafgaande jaar een dergelijke afronding is toegepast, kan bij vervanging
      worden uitgegaan van het niet-afgeronde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel10
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '10'
  - number: '13.1'
    text: |-
      Niet in geld genoten loon wordt in aanmerking genomen naar de waarde die daaraan in het economische verkeer kan
      worden toegekend, met dien verstande dat voorzover de verwerving van het loon het gebruik of verbruik daarvan
      meebrengt, de waarde wordt gesteld op ten hoogste het bedrag van de besparing.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel13
  - number: '13.2'
    text: |-
      Bij ministeriële regeling kunnen, in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid, nadere
      regels worden gesteld met betrekking tot de waardering van aanspraken en van ander niet in geld genoten loon.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel13
  - number: '13.3'
    text: |-
      De ingevolge de vorige leden in aanmerking te nemen waarde wordt verminderd met het bedrag dat de werknemer ter
      zake in rekening wordt gebracht, met dien verstande dat de aldus verminderde waarde ten minste op nihil wordt
      gesteld.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel13
  - number: 13bis.1
    text: |-
      Indien ook voor privé-doeleinden een auto ter beschikking is gesteld, wordt het voordeel op kalenderjaarbasis
      gesteld op ten minste 22% van de waarde van de auto. De auto wordt in ieder geval geacht ook voor privé-doeleinden
      ter beschikking te zijn gesteld tenzij blijkt dat de auto op kalenderjaarbasis voor niet meer dan 500 kilometer
      voor privé-doeleinden wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel13bis
  - number: 13bis.2
    text: |-
      Indien uit een rittenregistratie of anderszins blijkt dat de auto op kalenderjaarbasis voor niet meer dan 500
      kilometer voor privé-doeleinden wordt gebruikt, wordt het voordeel gesteld op nihil.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel13bis
  - number: 13bis.3
    text: |-
      Voor de toepassing van dit artikel en de daarop berustende bepalingen wordt onder auto verstaan een personenauto of
      bestelauto als bedoeld in [artikel 3 van de Wet op de belasting van personenauto's en motorrijwielen 1992][ref1],
      met uitzondering van de bestelauto die door aard of inrichting uitsluitend of nagenoeg uitsluitend geschikt blijkt
      te zijn voor vervoer van goederen en met uitzondering van de bestelauto die buiten de werktijd niet gebruikt kan
      worden of de bestelauto waarvoor een verbod op privé-gebruik geldt. Van een dergelijk verbod op privé-gebruik is
      sprake indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel3
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel13bis
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '3'
  - number: 13bis.3.a
    text: het verbod schriftelijk is vastgelegd;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel13bis
  - number: 13bis.3.b
    text: de inhoudingsplichtige de vastlegging van het verbod bij de loonadministratie bewaart;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel13bis
  - number: 13bis.3.c
    text: de inhoudingsplichtige voldoende toezicht houdt op de naleving van het verbod, en
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel13bis
  - number: 13bis.3.d
    text: de inhoudingsplichtige een passende sanctie oplegt indien het verbod wordt overtreden.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel13bis
  - number: 13bis.4
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld waaraan een rittenregistratie moet voldoen. Tevens kunnen
      regels worden gesteld over het anderszins laten blijken dat de auto op kalenderjaarbasis voor niet meer dan 500
      kilometer voor privé-doeleinden wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel13bis
  - number: 13bis.5
    text: |-
      Voor de toepassing van dit artikel wordt de waarde van de auto gesteld op de catalogusprijs met inbegrip van de
      omzetbelasting en de belasting van personenauto's en motorrijwielen. In afwijking in zoverre van de eerste volzin
      wordt de waarde van een auto die meer dan vijftien jaar geleden voor het eerst in gebruik is genomen, gesteld op de
      waarde in het economische verkeer.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel13bis
  - number: 13bis.6
    text: |-
      Het voordeel wordt in aanmerking genomen voorzover het uitgaat boven de vergoeding die de werknemer voor het
      gebruik voor privé-doeleinden is verschuldigd.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel13bis
  - number: 13bis.7
    text: Voor de toepassing van dit artikel wordt woon-werkverkeer geacht niet voor privé-doeleinden plaats te vinden.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel13bis
  - number: 13bis.8
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de loontijdvakken waarin het in het
      eerste lid bedoelde voordeel in aanmerking wordt genomen.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel13bis
  - number: 13bis.9
    text: |-
      Indien de werknemer een verklaring van de inspecteur overlegt waarin is vastgelegd dat de werknemer aan de
      inspecteur heeft medegedeeld dat de hem ter beschikking gestelde auto op kalenderjaarbasis voor niet meer dan
      500 kilometer voor privé-doeleinden wordt gebruikt (verklaring geen privé-gebruik), laat de inhoudingsplichtige
      inhouding van belasting over het in het eerste lid bedoelde voordeel achterwege. De eerste volzin is niet van
      toepassing ingeval de inhoudingsplichtige weet dat de in de eerste volzin bedoelde mededeling niet juist is.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel13bis
  - number: 13bis.10
    text: |-
      De werknemer kan een verzoek om een verklaring geen privé-gebruik bij de inspecteur indienen. De inspecteur beslist
      op het verzoek bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel13bis
  - number: 13bis.11
    text: |-
      De inspecteur kan de verklaring geen privé-gebruik, al dan niet op verzoek van de werknemer, bij voor bezwaar
      vatbare beschikking intrekken, waarbij de intrekking voor zover nodig terugwerkende kracht kan hebben. De werknemer
      is gehouden een verzoek tot intrekking te doen zodra de auto op kalenderjaarbasis voor meer dan 500 kilometer voor
      privé-doeleinden wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel13bis
  - number: 13bis.12
    text: |-
      In geval van een verklaring geen privé-gebruik kan de inspecteur de werknemer op enig moment verzoeken te doen
      blijken dat de auto op kalenderjaarbasis voor niet meer dan 500 kilometer voor privé-doeleinden wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel13bis
  - number: 13bis.13
    text: |-
      Indien de verklaring geen privé-gebruik wordt ingetrokken of indien de werknemer niet
      doet blijken dat de auto op kalenderjaarbasis voor niet meer dan 500 kilometer voor privé-
      doeleinden is gebruikt, wordt de verschuldigde belasting, voorzover nodig in afwijking van
      [artikel 20, tweede lid, van de Algemene wet inzake rijksbelastingen][ref1], nageheven van de werknemer. In
      afwijking van de eerste volzin wordt nageheven van de inhoudingsplichtige ingeval de inhoudingsplichtige wist dat
      de mededeling, bedoeld in het negende lid, eerste volzin, niet juist was.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel20
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel13bis
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '20'
  - number: 13bis.14
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de verklaring geen privé-gebruik.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel13bis
  - number: 13a.1
    text: 'Loon wordt beschouwd te zijn genoten op het tijdstip waarop het:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel13a
  - number: 13a.1.a
    text: betaald of verrekend wordt, ter beschikking van de werknemer wordt gesteld of rentedragend wordt, dan wel
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel13a
  - number: 13a.1.b
    text: vorderbaar en tevens inbaar wordt.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel13a
  - number: 13a.2
    text: |-
      Indien is overeengekomen dat het loon geheel of gedeeltelijk op een ongebruikelijk tijdstip zal worden genoten,
      wordt daarmee voor de toepassing van het eerste lid geen rekening gehouden.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel13a
  - number: 13a.3
    text: |-
      Voor zover ingevolge [artikel 12][ref1] het loon hoger is dan het werkelijk genoten loon, wordt het meerdere geacht
      te zijn genoten bij het einde van het kalenderjaar of het einde van de dienstbetrekking zo deze in de loop van het
      kalenderjaar eindigt.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel12a
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 12a
        hoofdstuk: II
  - number: '14.1'
    text: |-
      De zeedagenaftrek geldt ten aanzien van de werknemer die als kapitein, scheepsofficier of scheepsgezel van een
      zeeschip in de zin van de [Zeebrievenwet ][ref1]in verband met zijn werkzaamheden doorgaans ten minste 180 dagen
      per jaar aan boord van een dergelijk zeeschip of in een buitenlandse haven of havenplaats verblijft (zeedagen). De
      dagen van vertrek en van aankomst worden daarbij meegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0001933
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001933
  - number: '14.2'
    text: De zeedagenaftrek bedraagt € 4 per zeedag.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel14
  - number: '14.3'
    text: 'Als zeedagen worden niet in aanmerking genomen:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel14
  - number: 14.3.a
    text: |-
      dagen ten gevolge van reizen met een duur van 14 dagen of minder, tenzij gedurende de reis een buitenlandse haven
      is aangedaan die voor de vervoerde zaken of personen het karakter van haven van bestemming of van vertrek heeft;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel14
  - number: 14.3.b
    text: dagen waarbij het vertrek uit en de aankomst in een Nederlandse haven op dezelfde dag liggen;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel14
  - number: 14.3.c
    text: dagen waarop het zeeschip de hele dag in een Nederlandse haven ligt.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel14
  - number: '15'
    text: 'Vrije vergoedingen zijn:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel15
  - number: 15.a
    text: |-
      vergoedingen voorzover zij geacht kunnen worden te strekken tot bestrijding van kosten, lasten en afschrijvingen
      ter behoorlijke vervulling van de dienstbetrekking;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel15
  - number: 15.b
    text: |-
      andere vergoedingen voorzover zij naar algemene maatschappelijke opvattingen niet als beloningsvoordeel worden
      ervaren.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel15
  - number: 15a.1
    text: 'Tot de vrije vergoedingen behoren vergoedingen, in redelijkheid, ter zake van:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel15a
  - number: 15a.1.a
    text: consumpties tijdens de werktijd die geen deel uitmaken van een maaltijd;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel15a
  - number: 15a.1.b
    text: werkkleding, met inachtneming van bij ministeriële regeling te stellen regels;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel15a
  - number: 15a.1.c
    text: vakliteratuur;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel15a
  - number: 15a.1.d
    text: |-
      representatie ter behoorlijke vervulling van de dienstbetrekking, daaronder begrepen recepties, feestelijke
      bijeenkomsten, giften, relatiegeschenken en vermaak, met inbegrip van de desbetreffende reizen en het
      desbetreffende verblijf;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel15a
  - number: 15a.1.e
    text: |-
      cursussen, congressen, seminars, symposia, excursies, studiereizen en dergelijke ter behoorlijke vervulling van de
      dienstbetrekking, met inbegrip van de desbetreffende reizen en het desbetreffende verblijf;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel15a
  - number: 15a.1.f
    text: |-
      muziekinstrumenten, geluidsapparatuur, gereedschap, tekstverwerkers, schrijf- en rekenmachines, alsmede
      beeldapparatuur, ter behoorlijke vervulling van de dienstbetrekking, met dien verstande dat bij zaken met een
      kostprijs van € 450 of meer met een meerjarig belang de afschrijving in aanmerking wordt genomen;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel15a
  - number: 15a.1.g
    text: |-
      verhuizing, ter omvang van de kosten van het overbrengen van de inboedel vermeerderd met 12% van het, met
      inachtneming van bij ministeriële regeling te stellen regels bepaalde, jaarloon of het tot jaarloon herleide bedrag
      van het in het kalenderjaar genoten loon uit de dienstbetrekking waarvoor de werknemer verhuist, maar met niet meer
      dan € 5445;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel15a
  - number: 15a.1.h
    text: |-
      op de werknemer drukkende uitgaven voor het volgen van een opleiding of studie met het oog op het verwerven van
      inkomen uit werk en woning, met uitzondering van vergoedingen:
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel15a
  - number: 15a.1.h.1°
    text: die verband houden met een werk- of studeerruimte, daaronder begrepen de inrichting;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel15a
  - number: 15a.1.h.2°
    text: |-
      van binnenlandse reizen voorzover de vergoeding meer bedraagt dan het bedrag per kilometer, bedoeld in
      [artikel 15b, eerste lid, onderdeel a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel15b
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 15b
        hoofdstuk: IIA
  - number: 15a.1.i
    text: |-
      een recht op reizen per openbaar vervoer dat niet is beperkt tot reizen over een vast traject ten behoeve van woon-
      werkverkeer, voorzover is voldaan aan bij ministeriële regeling te stellen regels die mede betrekking kunnen hebben
      op de mate waarin de vergoeding tot de vrije vergoedingen behoort;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel15a
  - number: 15a.1.j
    text: |-
      extra kosten van tijdelijk verblijf buiten het land van herkomst (extraterritoriale kosten), met dien verstande
      dat voor bij algemene maatregel van bestuur aan te wijzen groepen werknemers die door een inhoudingsplichtige
      van buiten Nederland in dienstbetrekking worden genomen of buiten Nederland worden uitgezonden, onder daarbij te
      stellen voorwaarden, geldt dat vergoedingen van kosten van verblijf buiten het land van herkomst – voor van buiten
      Nederland in dienstbetrekking genomen werknemers gedurende ten hoogste tien jaar – ten minste worden beschouwd
      als vergoeding voor extraterritoriale kosten tot ten hoogste 30 percent van het loon en de vergoeding voor
      extraterritoriale kosten, alsmede tot het bedrag van de daarbij aan te wijzen schoolgelden.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel15a
  - number: 15a.2
    text: |-
      Voor de toepassing van het eerste lid, onderdeel g, kunnen bij ministeriële regeling regels worden gesteld voor de
      beoordeling of in ieder geval in het kader van de dienstbetrekking wordt verhuisd.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel15a
  - number: 15b.1
    text: 'Tot de vrije vergoedingen behoren niet vergoedingen ter zake van:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel15b
  - number: 15b.1.a
    text: |-
      vervoer, waar onder woon-werkverkeer, indien dat vervoer niet plaatsvindt per taxi, luchtvaartuig, schip of ter
      beschikking gesteld vervoermiddel, voorzover de vergoeding meer bedraagt dan € 0,19 per kilometer;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel15b
  - number: 15b.1.b
    text: |-
      kinderopvang voorzover niet is voldaan aan [artikel 16c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel16c
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 16c
        hoofdstuk: IIA
  - number: 15b.1.c
    text: 'maaltijden waarbij het zakelijke karakter:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel15b
  - number: 15b.1.c.1°
    text: van bijkomstig belang is, of
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel15b
  - number: 15b.1.c.2°
    text: |-
      van meer dan bijkomstig belang is voorzover zij wat betreft aantal en regelmaat uitgaan boven bij ministeriële
      regeling te stellen normen;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel15b
  - number: 15b.1.d
    text: bedrijfsfitness voorzover niet is voldaan aan bij ministeriële regeling te stellen regels;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel15b
  - number: 15b.1.e
    text: |-
      werkruimte, de inrichting daaronder begrepen, in de woning, een duurzaam aan een plaats gebonden schip of woonwagen
      in de zin van [artikel 1 van de Woningwet][ref1], de aanhorigheden daaronder begrepen, van de werknemer voorzover
      niet is voldaan aan bij ministeriële regeling te stellen regels die mede betrekking hebben op de mate waarin de
      vergoeding niet tot de vrije vergoedingen wordt gerekend;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '1'
  - number: 15b.1.f
    text: |-
      telefoonabonnementen behoudens voorzover het betreft het tweede en volgende telefoonabonnement van de werknemer
      waarvan het zakelijke karakter van meer dan bijkomstig belang is;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel15b
  - number: 15b.1.g
    text: |-
      persoonlijke verzorging, behoudens voorzover de werknemer optreedt als artiest of presentator of als beroep een tak
      van sport beoefent;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel15b
  - number: 15b.1.h
    text: personeelsverenigingen en dergelijke;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel15b
  - number: 15b.1.i
    text: |-
      huisvesting buiten de woonplaats ter zake van de dienstbetrekking voorzover de vergoeding betrekking heeft op een
      periode van meer dan twee jaar;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel15b
  - number: 15b.1.k
    text: verschuldigde loonbelasting en bij wijze van inhouding verschuldigde premie voor de volksverzekeringen;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel15b
  - number: 15b.1.l
    text: |-
      premies voor buitenlandse verzekeringen die naar aard en strekking overeenkomen met de volksverzekeringen, tenzij
      de werknemer premieplichtig is voor de volksverzekeringen;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel15b
  - number: 15b.1.m
    text: |-
      geldboeten opgelegd door een Nederlandse strafrechter en geldsommen betaald aan de Staat ter voorkoming van
      strafvervolging in Nederland of ter voldoening aan een voorwaarde verbonden aan een besluit tot gratieverlening,
      bestuurlijke boeten, geldboeten opgelegd op basis van bij wet geregeld tuchtrecht, alsmede kosten als bedoeld in
      [artikel 234, zesde lid][ref1], en [artikel 235, derde lid, van de Gemeentewet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel234
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel235
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '234'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '235'
  - number: 15b.1.n
    text: |-
      misdrijven ter zake waarvan de werknemer door een Nederlandse strafrechter bij onherroepelijke uitspraak is
      veroordeeld, daaronder begrepen de misdrijven die zijn betrokken bij de bepaling van de hoogte van de opgelegde
      straf en ter zake waarvan het Openbaar Ministerie heeft verklaard te zullen afzien van vervolging;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel15b
  - number: 15b.1.o
    text: |-
      misdrijven ter zake waarvan de werknemer ter voorkoming van strafvervolging in Nederland aan de gestelde
      voorwaarden heeft voldaan;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel15b
  - number: 15b.1.p
    text: |-
      wapens en munitie, tenzij terzake een erkenning, consent, vergunning, verlof of ontheffing is verleend krachtens de
      [Wet wapens en munitie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008804
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0008804
  - number: 15b.1.q
    text: |-
      dieren en categorieën van dieren als bedoeld in de krachtens de [artikelen 73][ref1] en
      [107 van de Gezondheids- en welzijnswet voor dieren][ref2] vastgestelde Regeling agressieve dieren, tenzij terzake
      een dierenpaspoort als bedoeld in artikel 3, tweede lid, onderdeel a, van die regeling is afgegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel107
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '73'
      - id: ref2
        bwb_id: BWBR0005662
        artikel: '107'
  - number: 15b.1.r
    text: parkeergelegenheid in of bij de woning van de werknemer;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel15b
  - number: 15b.1.s
    text: computers en dergelijke apparatuur en bijbehorende apparatuur, die
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel15b
  - number: 15b.1.s.1°
    text: niet geheel en niet nagenoeg geheel zakelijk gebruikt worden, of
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel15b
  - number: 15b.1.s.2°
    text: |-
      geheel of nagenoeg geheel zakelijk gebruikt worden en een meerjarig belang en een kostprijs hebben van € 450 of
      meer, voorzover de vergoeding meer bedraagt dan de afschrijving.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel15b
  - number: 15b.2
    text: |-
      Onder bestuurlijke boete als bedoeld in het eerste lid, onderdeel m, wordt verstaan: een door een Nederlands
      bestuursorgaan bij beschikking opgelegde onvoorwaardelijke verplichting tot betaling van een geldsom, die is
      gericht op bestraffing van degene die een gedraging in strijd met het bepaalde bij of krachtens enig wettelijk
      voorschrift pleegt of medepleegt.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel15b
  - number: 15b.3
    text: |-
      Vrije vergoedingen die verband houden met een misdrijf, verstrekt in het loontijdvak waarin de veroordeling,
      bedoeld in het eerste lid, onderdeel o, onherroepelijk is geworden dan wel waarin aan de gestelde voorwaarden,
      bedoeld in het eerste lid, onderdeel p, is voldaan, in de daaraan voorafgaande loontijdvakken van het jaar of in
      een of meer van de vijf daaraan voorafgaande jaren, worden op het tijdstip van het onherroepelijk worden van de
      veroordeling, respectievelijk het voldoen aan de gestelde voorwaarden, alsnog als loon in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel15b
  - number: 15c
    text: |-
      Bij ministeriële regeling, in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid, kan, in
      aanvulling op [de artikelen 15][ref1], [15a][ref2] en [15b][ref3] en zonodig onder het aanbrengen van normeringen
      en beperkingen en het stellen van voorwaarden, worden bepaald dat vergoedingen die naar algemene maatschappelijke
      opvattingen wel of niet als loon worden ervaren, niet respectievelijk wel tot de vrije vergoedingen worden
      gerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel15a
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel15b
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '15'
        hoofdstuk: IIA
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 15a
        hoofdstuk: IIA
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 15b
        hoofdstuk: IIA
  - number: 15d
    text: |-
      Vaste vergoedingen zijn geen vrije vergoedingen voorzover niet is voldaan aan bij ministeriële regeling te stellen
      regels.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel15d
  - number: 16a.1
    text: |-
      Als vrije vergoeding ter zake van vervoer per openbaar vervoer, geldt ten hoogste de prijs van de vervoerbewijzen
      voor de per openbaar vervoer afgelegde reisafstand, indien:
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel16a
  - number: 16a.1.a
    text: |-
      de werknemer de vervoerbewijzen ter vergoeding overhandigt of zo spoedig mogelijk zal overhandigen aan de
      inhoudingsplichtige, en
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel16a
  - number: 16a.1.b
    text: deze de vervoerbewijzen per werknemer administreert en voor controle beschikbaar houdt.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel16a
  - number: 16a.2
    text: Bij ministeriële regeling worden regels gesteld voor de uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel16a
  - number: 16a.3
    text: |-
      Het eerste lid is slechts van toepassing indien de vergoeding niet als vrije vergoeding in de zin van
      [artikel 15b, eerste lid, onderdeel a][ref1], in aanmerking wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel15b
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 15b
        hoofdstuk: IIA
  - number: 16c.1
    text: |-
      Vergoedingen ter zake van kosten van kinderopvang gelden als vrije vergoeding voorzover die vergoedingen niet meer
      bedragen dan een zesde deel van de aan de werknemer of zijn partner in rekening gebrachte kosten. Ten aanzien van
      de werknemer met een partner die een verstrekking van kinderopvang geniet, gelden vergoedingen ter zake van kosten
      van kinderopvang als vrije vergoeding voorzover die vergoedingen niet meer bedragen dan een zesde deel van de voor
      de waardering van de verstrekking in aanmerking genomen waarde van de kinderopvang.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel16c
  - number: 16c.2
    text: |-
      Ten aanzien van de werknemer die geen partner heeft, of een partner heeft die van een inhoudingsplichtige geen
      vergoeding ter zake van kosten van kinderopvang ontvangt en geen verstrekking van kinderopvang geniet, wordt het in
      het in het eerste lid, eerste volzin, bedoelde deel van de aan de werknemer of zijn partner in rekening gebrachte
      kosten, verhoogd tot een derde deel.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel16c
  - number: 16c.3
    text: |-
      Ten aanzien van de werknemer met een partner die een vergoeding ter zake van kosten van kinderopvang van een
      inhoudingsplichtige ontvangt welke minder bedraagt dan een zesde deel van de aan de werknemer of zijn partner in
      rekening gebrachte kosten, wordt het in het eerste lid, eerste volzin, bedoelde deel verhoogd tot een derde deel
      en verminderd met de vergoeding van de partner. Ten aanzien van de werknemer met een partner die een verstrekking
      van kinderopvang geniet van minder dan een zesde deel van de voor de waardering van de verstrekking in aanmerking
      genomen waarde van de kinderopvang, wordt het in het eerste lid, tweede volzin, bedoelde deel verhoogd tot een
      derde deel en de uitkomst vervolgens verminderd met de verstrekking van de partner.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel16c
  - number: 16c.4
    text: |-
      Voor de toepassing van dit artikel wordt onder kinderopvang verstaan: kinderopvang waarvoor aanspraak
      op een kinderopvangtoeslag onderscheidenlijk aanspraak op een tegemoetkoming kan ontstaan op de voet van
      [artikel 5 van de Wet kinderopvang][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel5
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel16c
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '5'
  - number: 16c.5
    text: |-
      Voor de toepassing van dit artikel wordt onder partner verstaan hetgeen daaronder in artikel 3 van de Algemene wet
      inkomensafhankelijke regelingen wordt verstaan.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel16c
  - number: 16c.6
    text: |-
      Voor de toepassing van dit artikel wordt met een vergoeding ter zake van kosten van kinderopvang van een
      inhoudingsplichtige gelijkgesteld:
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel16c
  - number: 16c.6.a
    text: |-
      een tegemoetkoming van een gemeente op grond van [artikel 24 van de Wet kinderopvang][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel24
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel16c
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '24'
  - number: 16c.6.b
    text: |-
      een tegemoetkoming van het Uitvoeringsinstituut werknemersverzekeringen op grond van
      [artikel 30 van de Wet kinderopvang][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel30
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel16c
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '30'
  - number: 16c.6.c
    text: |-
      een bijdrage in de kosten van kinderopvang van de eigenrisicodrager, bedoeld in
      [artikel 82 van de Wet werk en inkomen naar arbeidsvermogen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel82
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel16c
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '82'
  - number: 16c.7
    text: Bij ministeriële regeling worden nadere regels gesteld voor de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel16c
  - number: '17.1'
    text: 'Vrije verstrekkingen zijn:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel17
  - number: 17.1.a
    text: |-
      verstrekkingen voorzover zij geacht kunnen worden te strekken tot voorkoming van kosten, lasten en afschrijvingen
      ter behoorlijke vervulling van de dienstbetrekking;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel17
  - number: 17.1.b
    text: |-
      andere verstrekkingen voorzover zij naar algemene maatschappelijke opvattingen niet als beloningsvoordeel worden
      ervaren.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel17
  - number: '17.2'
    text: |-
      De [artikelen 15a tot en met 16c][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel16
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '16'
        hoofdstuk: IIA
  - number: '17.3'
    text: Bijdragen van de werknemer aan vrije verstrekkingen komen niet in mindering op het loon.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel17
  - number: 17a.1
    text: 'Tot de vrije verstrekkingen behoren verstrekkingen, in redelijkheid, ter zake van:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel17a
  - number: 17a.1.a
    text: woon-werkverkeer in de vorm van vervoer vanwege de inhoudingsplichtige;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel17a
  - number: 17a.1.b
    text: |-
      parkeergelegenheid bij de plaats van werkzaamheden, indien er geen sprake is van parkeergelegenheid als bedoeld in
      [artikel 15b, eerste lid, onderdeel r][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel15b
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 15b
        hoofdstuk: IIA
  - number: 17a.1.c
    text: |-
      algemeen erkende feestdagen en het Sint-Nicolaasfeest, een jubileum van de inhoudingsplichtige, een dienstjubileum
      en de verjaardag en andere persoonlijke feestdagen van de werknemer, alsmede het einde van de dienstbetrekking,
      mits de verstrekkingen een in hoofdzaak ideële waarde hebben.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel17a
  - number: 17a.2
    text: 'Onder vervoer vanwege de inhoudingsplichtige wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel17a
  - number: 17a.2.1°
    text: vanwege de inhoudingsplichtige georganiseerd vervoer;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel17a
  - number: 17a.2.2°
    text: |-
      het reizen per openbaar vervoer op basis van door de inhoudingsplichtige aangeschafte en door hem aan de werknemer
      verstrekte plaatsbewijzen.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel17a
  - number: '18.1'
    text: 'Onder pensioenregeling wordt verstaan een regeling:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18
  - number: 18.1.a
    text: |-
      die uitsluitend of, met het oog op uitzonderlijke gevallen van restbegunstiging, nagenoeg uitsluitend ten doel
      heeft het treffen van:
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18
  - number: 18.1.a.1°
    text: een levenslange inkomensvoorziening bij ouderdom voor werknemers en gewezen werknemers (ouderdomspensioen);
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18
  - number: 18.1.a.2°
    text: |-
      een inkomensvoorziening na hun overlijden ten behoeve van hun echtgenoten en gewezen echtgenoten, dan wel van
      degenen met wie zij duurzaam een gezamenlijke huishouding voeren of hebben gevoerd en met wie geen bloed- of
      aanverwantschap in de eerste graad bestaat (nabestaandenpensioen);
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18
  - number: 18.1.a.3°
    text: |-
      een inkomensvoorziening na hun overlijden ten behoeve van hun kinderen en pleegkinderen die de leeftijd van 30 jaar
      nog niet hebben bereikt (wezenpensioen);
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18
  - number: 18.1.a.4°
    text: |-
      een inkomensvoorziening bij arbeidsongeschiktheid zodra die langer dan een jaar duurt en welke niet uitgaat boven
      hetgeen naar maatschappelijke opvattingen redelijk moet worden geacht (arbeidsongeschiktheidspensioen), en
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18
  - number: 18.1.b
    text: |-
      waarin is bepaald dat de aanspraken ingevolge de regeling niet kunnen worden afgekocht, vervreemd of prijsgegeven,
      dan wel formeel of feitelijk voorwerp van zekerheid kunnen worden, anders dan in de gevallen voorzien bij of
      krachtens de [Pensioen- en spaarfondsenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002089
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002089
  - number: 18.1.c
    text: |-
      waarvan als verzekeraar optreedt een lichaam of de natuurlijke persoon bedoeld in [artikel 19a, eerste lid][ref1];
      een en ander voor zover die regeling blijft binnen de in of krachtens dit hoofdstuk vastgestelde begrenzingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19a
        hoofdstuk: IIB
  - number: '18.2'
    text: 'Onder pensioenregeling wordt mede verstaan een regeling die:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18
  - number: 18.2.a
    text: het ouderdomspensioen na het bereiken van veertig deelnemingsjaren aanvult (40-deelnemingsjarenpensioen);
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18
  - number: 18.2.b
    text: |-
      het nabestaandenpensioen dan wel het wezenpensioen aanvult in verband met het ontbreken van uitkeringen ingevolge
      de [Algemene nabestaandenwet][ref1] en het verschil in verschuldigde premie voor de volksverzekeringen over het
      pensioen voor en na de 65-jarige leeftijd (nabestaandenoverbruggingspensioen).


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: '18.3'
    text: |-
      Ingeval een regeling voldoet aan de in het eerste lid opgenomen voorwaarden doch niet blijft binnen de in
      of krachtens dit hoofdstuk opgenomen begrenzingen, is de regeling een pensioenregeling voorzover blijkt dat
      zij blijft binnen de in of krachtens dit hoofdstuk opgenomen begrenzingen. De inhoudingsplichtige verzoekt
      de inspecteur uiterlijk op het eerste moment van overschrijding van de bedoelde begrenzingen vast te stellen
      welk deel van de desbetreffende aanspraak blijft binnen die begrenzingen. Bij toepassing van de eerste volzin
      geeft de inhoudingsplichtige bij elke te zijner tijd op basis van de regeling te verstrekken pensioenuitkering
      overeenkomstig bij ministeriële regeling te stellen regels aan welk deel daarvan tot het loon van de werknemer
      behoort. De inspecteur beslist op het verzoek bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18
  - number: 18a.1
    text: |-
      Een op een eindloonstelsel gebaseerd ouderdomspensioen bedraagt per dienstjaar niet meer dan 2 percent van het
      pensioengevend loon.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18a
  - number: 18a.2
    text: |-
      Een op een middelloonstelsel gebaseerd ouderdomspensioen bedraagt per dienstjaar niet meer dan 2,25 percent van het
      pensioengevend loon.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18a
  - number: 18a.3
    text: |-
      Een op een beschikbare-premiestelsel gebaseerd ouderdomspensioen wordt tijdsevenredig opgebouwd en is gericht op
      een pensioen dat na 35 jaren opbouw niet meer bedraagt dan 70 percent van het loon op dat tijdstip. De beschikbare
      premie wordt ten hoogste bepaald met inachtneming van de volgende uitgangspunten:
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18a
  - number: 18a.3.a
    text: |-
      de beschikbare premie wordt actuarieel vastgesteld per leeftijdsklasse van ten hoogste vijf jaren en wordt
      afgestemd op de gemiddelde leeftijd in de klasse;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18a
  - number: 18a.3.b
    text: |-
      als loopbaanontwikkeling wordt gerekend met een loonstijging van drie percent per jaar gedurende de jaren voor
      het bereiken van de 35-jarige leeftijd, van twee percent per jaar gedurende de tien daaropvolgende jaren, van een
      percent per jaar gedurende de tien daaropvolgende jaren en van nihil gedurende de overige jaren;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18a
  - number: 18a.3.c
    text: |-
      bij de berekening wordt een rekenrente in aanmerking genomen van ten minste vier percent en wordt de te verwachten
      inflatie op nihil gesteld.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18a
  - number: 18a.4
    text: 'Een ouderdomspensioen gaat niet later in dan bij het vroegste van de volgende tijdstippen:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18a
  - number: 18a.4.1°
    text: |-
      ingeval de dienstbetrekking eindigt voor de in de pensioenregeling vastgestelde ingangsdatum: de vastgestelde
      ingangsdatum, dan wel op het vroegste van de tijdstippen, bedoeld onder 3°, 4° en 5°;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18a
  - number: 18a.4.2°
    text: |-
      ingeval de dienstbetrekking eindigt op of na de in de pensioenregeling vastgestelde ingangsdatum: het tijdstip
      waarop de dienstbetrekking eindigt;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18a
  - number: 18a.4.3°
    text: |-
      ingeval het ouderdomspensioen 100 percent van het pensioengevend loon komt te bedragen voordat de werknemer of
      gewezen werknemer de 65-jarige leeftijd heeft bereikt: het tijdstip waarop hij de 65-jarige leeftijd bereikt;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18a
  - number: 18a.4.4°
    text: |-
      ingeval het ouderdomspensioen 100 percent van het pensioengevend loon komt te bedragen op of na het tijdstip
      waarop de werknemer of gewezen werknemer de 65-jarige leeftijd heeft bereikt: het tijdstip waarop dat maximum wordt
      bereikt;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18a
  - number: 18a.4.5°
    text: het tijdstip waarop de werknemer de 70-jarige leeftijd bereikt.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18a
  - number: 18a.5
    text: |-
      Ingeval het ouderdomspensioen later ingaat dan op de in de pensioenregeling vastgestelde ingangsdatum mag het
      pensioen na die ingangsdatum worden verhoogd overeenkomstig het tot die datum gevolgde stelsel, met inbegrip van
      herrekening met inachtneming van algemeen aanvaarde actuariële grondslagen, doch niet verder dan tot 100 percent
      van het pensioengevend loon.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18a
  - number: 18a.6
    text: |-
      Indien het ouderdomspensioen eerder ingaat dan bij het bereiken van de 65-jarige leeftijd wordt het herrekend ten
      opzichte van die leeftijd of van de in de pensioenregeling vastgestelde latere ingangsdatum met inachtneming van
      algemeen aanvaarde actuariële grondslagen.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18a
  - number: 18a.7
    text: Een ouderdomspensioen gaat niet uit boven 100 percent van het pensioengevend loon op het tijdstip van ingang.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18a
  - number: 18a.8.a
    text: |-
      De in deze wet met betrekking tot het desbetreffende pensioen opgenomen maxima worden voor het ouderdomspensioen
      opgevat met inbegrip van een bedrag dat ten minste wordt gesteld op per dienstjaar of ontbrekend dienstjaar een
      evenredig gedeelte van de voor dat jaar geldende uitkeringen voor gehuwde personen zonder toeslag als omschreven
      in [artikel 9, eerste lid, onderdeel b, en vijfde lid, van de Algemene Ouderdomswet][ref1], vermeerderd met de
      vakantietoeslag. Bij algemene maatregel van bestuur kan worden bepaald dat een lager bedrag in aanmerking kan
      worden genomen dan het in de eerste volzin bedoelde bedrag indien een lager percentage per dienstjaar wordt
      toegepast dan de in het eerste tot en met derde lid bedoelde percentages.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
  - number: 18a.8.b
    text: Voor het nabestaandenpensioen kan het in onderdeel a bedoelde bedrag voor 70% in aanmerking worden genomen.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18a
  - number: 18a.8.c
    text: |-
      Voor het wezenpensioen kan het in onderdeel a bedoelde bedrag voor 14% en voor volle wezen voor 28% in aanmerking
      worden genomen.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18a
  - number: 18a.9
    text: |-
      Met betrekking tot een op een beschikbare-premiestelsel gebaseerd ouderdomspensioen als bedoeld in het derde lid
      vindt, in afwijking van het vierde lid, onder 3° en 4°, de beoordeling of binnen de in het zevende lid genoemde
      begrenzingen wordt gebleven plaats op het tijdstip waarop voor het eerst aanspraak op ouderdomspensioen ontstaat
      en op het tijdstip onmiddellijk voorafgaand aan het tijdstip van ingang van het pensioen. Indien op het tijdstip
      onmiddellijk voorafgaand aan het tijdstip van ingang van het pensioen de begrenzing wordt overschreden, zal het
      meerdere worden uitgekeerd in een uitkering ineens. De uitkering ineens dan wel, indien uitkering niet plaatsvindt,
      het bedrag dat zou moeten worden uitgekeerd, wordt aangemerkt als loon uit tegenwoordige dienstbetrekking van de
      werknemer en wordt geacht te zijn genoten op het tijdstip onmiddellijk voorafgaand aan het tijdstip van ingang
      van het pensioen. Ten aanzien van de werknemer die niet premieplichtig is voor de [Algemene Ouderdomswet][ref1]
      wordt, in afwijking van de [artikelen 20a][ref2] en [26][ref3], de verschuldigde belasting over de uitkering
      onderscheidenlijk het bedrag dat zou moeten worden uitgekeerd, gesteld op de som van de belasting en de
      premie ingevolge de [Algemene Ouderdomswet][ref4] die daarover verschuldigd zou zijn door een persoon die wel
      premieplichtig is ingevolge die wet en overigens in dezelfde omstandigheden verkeert als de werknemer. Ten aanzien
      van de werknemer die wel premieplichtig is voor de [Algemene Ouderdomswet][ref5] is met betrekking tot de in de
      vorige volzin genoemde uitkeringen of bedragen [artikel 26][ref6] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel20a
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0002221
      [ref5]: https://wetten.overheid.nl/BWBR0002221
      [ref6]: https://wetten.overheid.nl/BWBR0002471#Artikel26
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 20a
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0002471
        artikel: '26'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0002221
      - id: ref5
        bwb_id: BWBR0002221
      - id: ref6
        bwb_id: BWBR0002471
        artikel: '26'
        hoofdstuk: III
  - number: 18a.10
    text: |-
      Ingeval de werknemer voor het tijdstip van ingang van het ouderdomspensioen ophoudt binnenlands belastingplichtige
      te zijn, wordt in het negende lid voor het tijdstip onmiddellijk voorafgaand aan het tijdstip van ingang van
      het pensioen steeds gelezen: het tijdstip onmiddellijk voorafgaand aan het tijdstip waarop de werknemer ophoudt
      binnenlands belastingplichtige te zijn.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18a
  - number: 18b.1
    text: |-
      Een op een eindloonstelsel gebaseerd nabestaandenpensioen bedraagt per dienstjaar of ontbrekend dienstjaar niet
      meer dan 1,4 percent van het pensioengevend loon of bereikbare pensioengevend loon.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18b
  - number: 18b.2
    text: |-
      Een op een middelloonstelsel gebaseerd nabestaandenpensioen bedraagt per dienstjaar of ontbrekend dienstjaar niet
      meer dan 1,58 percent van het pensioengevend loon of bereikbaar pensioengevend loon.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18b
  - number: 18b.3
    text: |-
      Voor een op een beschikbare-premiestelsel gebaseerd nabestaandenpensioen is [artikel 18a, derde lid][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18a
        hoofdstuk: IIB
  - number: 18b.4
    text: 'Ingeval in de pensioenregeling is rekening gehouden met:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18b
  - number: 18b.4.1°
    text: een bepaalde nabestaande, wordt gerekend met de feitelijke gegevens van die nabestaande;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18b
  - number: 18b.4.2°
    text: |-
      een onbepaalde nabestaande, wordt gerekend met een leeftijdsverschil tussen de werknemer en de nabestaande van ten
      hoogste drie jaren.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18b
  - number: 18b.5
    text: |-
      Voor de toepassing van dit artikel en van artikel 18c worden voor het geval de werknemer niet in leven is op het
      tijdstip waarop het ouderdomspensioen zou ingaan, ontbrekende dienstjaren en bereikbaar pensioengevend loon in
      aanmerking genomen. Onder ontbrekende dienstjaren worden verstaan de jaren van het tijdstip van overlijden van
      de werknemer tot de in de pensioenregeling vastgestelde ingangsdatum. Onder bereikbaar pensioengevend loon wordt
      verstaan het pensioengevend loon dat de gewezen werknemer binnen de vastgestelde loopbaanontwikkeling in zijn
      functie zou hebben kunnen bereiken.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18b
  - number: 18b.6
    text: |-
      Een nabestaandenpensioen gaat in onmiddellijk na het overlijden van de werknemer of gewezen werknemer dan wel
      onmiddellijk na beëindiging van een uitkering ingevolge de [Algemene nabestaandenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: 18b.7
    text: |-
      Een nabestaandenpensioen gaat niet uit boven 70 percent van het pensioengevend loon of het bereikbaar
      pensioengevend loon op het tijdstip van ingang.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18b
  - number: 18b.8
    text: |-
      Voor de toepassing van het zevende lid is [artikel 18a, negende lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18a
        hoofdstuk: IIB
  - number: 18c.1
    text: |-
      Een op een eindloonstelsel gebaseerd wezenpensioen bedraagt per dienstjaar of ontbrekend dienstjaar niet meer dan
      0,28 percent van het pensioengevend loon of bereikbaar pensioengevend loon.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18c
  - number: 18c.2
    text: |-
      Een op een middelloonstelsel gebaseerd wezenpensioen bedraagt per dienstjaar of ontbrekend dienstjaar niet meer dan
      0,32 percent van het pensioengevend loon of bereikbaar pensioengevend loon.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18c
  - number: 18c.3
    text: |-
      Voor een op een beschikbare-premiestelsel gebaseerd wezenpensioen is [artikel 18a, derde lid][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18a
        hoofdstuk: IIB
  - number: 18c.4
    text: |-
      Een wezenpensioen gaat in onmiddellijk na het overlijden van de werknemer of gewezen werknemer dan wel direct na
      beëindiging van een uitkering ingevolge de [Algemene nabestaandenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18c
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: 18c.5
    text: |-
      Een wezenpensioen gaat op het tijdstip van ingang niet uit boven 14 percent van het pensioengevend loon of
      bereikbaar pensioengevend loon.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18c
  - number: 18c.6
    text: Voor volle wezen worden de in de vorige leden genoemde percentages verdubbeld.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18c
  - number: 18c.7
    text: |-
      Voor de toepassing van het vijfde en het zesde lid is [artikel 18a, negende lid][ref1], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18a
        hoofdstuk: IIB
  - number: 18d.1
    text: |-
      In afwijking in zoverre van de [artikelen 18a][ref1], [18b][ref2] en [18c][ref3] kunnen een ouderdomspensioen, een
      nabestaandenpensioen en een wezenpensioen meer bedragen dan de aldaar opgenomen maxima voor zover zulks het gevolg
      is van:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel18b
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel18c
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18d
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18a
        hoofdstuk: IIB
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 18b
        hoofdstuk: IIB
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 18c
        hoofdstuk: IIB
  - number: 18d.1.a
    text: aanpassing van het pensioen aan loon- of prijsontwikkeling;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18d
  - number: 18d.1.b
    text: |-
      variatie in de hoogte van de uitkeringen waarbij de laagste uitkering niet minder bedraagt dan 75 percent van de
      hoogste uitkering en de mate van variatie ten laatste op de ingangsdatum van het pensioen wordt vastgesteld;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18d
  - number: 18d.1.c
    text: waardeoverdracht van pensioenaanspraken;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18d
  - number: 18d.1.d
    text: |-
      gehele of gedeeltelijke onderlinge ruil van nabestaandenpensioen, wezenpensioen en ouderdomspensioen, mits de ruil
      uiterlijk op de ingangsdatum van het pensioen plaatsvindt op basis van algemeen aanvaarde actuariële grondslagen.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18d
  - number: 18d.2
    text: |-
      Door ruil als bedoeld in het eerste lid, onderdeel d, ontstane verlies aan pensioen kan niet worden gecompenseerd
      en het nabestaandenpensioen en het wezenpensioen kunnen na een zodanige ruil niet meer bedragen dan 70 percent
      onderscheidenlijk 14 percent of 28 percent van het pensioengevend loon.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18d
  - number: 18d.3
    text: |-
      Voor de toepassing van het eerste lid, onderdeel b, blijft in de jaren tussen de ingangsdatum van het pensioen
      en het bereiken van de 65-jarige leeftijd, van de uitkering buiten aanmerking een bedrag dat gelijk is
      aan tweemaal de voor die jaren geldende uitkeringen voor gehuwde personen zonder toeslag als omschreven in
      [artikel 9, eerste lid, onderdeel b, en vijfde lid, van de Algemene Ouderdomswet][ref1], vermeerderd met de
      vakantietoeslag. De eerste volzin is onverminderd van toepassing bij dienstbetrekkingen in deeltijd.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18d
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
  - number: 18e.1
    text: 'Een 40-deelnemingsjarenpensioen is een levenslang pensioen dat:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18e
  - number: 18e.1.a
    text: ingaat op hetzelfde tijdstip als het ouderdomspensioen;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18e
  - number: 18e.1.b
    text: |-
      met inbegrip van het ouderdomspensioen niet meer bedraagt dan 70% van het pensioengevend loon ingeval het
      ouderdomspensioen ingaat bij het bereiken van de 63-jarige leeftijd;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18e
  - number: 18e.1.c
    text: niet eerder wordt opgebouwd dan vanaf het tijdstip waarop de werknemer 40 deelnemingsjaren heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18e
  - number: 18e.2
    text: |-
      Ingeval het 40-deelnemingsjarenpensioen later ingaat dan bij het bereiken van de 63-jarige leeftijd mag het 40-
      deelnemingsjarenpensioen na het bereiken van die leeftijd met inachtneming van algemeen aanvaarde actuariële
      grondslagen worden verhoogd.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18e
  - number: 18e.3
    text: |-
      Ingeval het 40-deelnemingsjarenpensioen eerder ingaat dan bij het bereiken van de 63-jarige leeftijd wordt het 40-
      deelnemingsjarenpensioen met inachtneming van algemeen aanvaarde actuariële grondslagen herrekend ten opzichte van
      die leeftijd.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18e
  - number: 18e.4
    text: |-
      De [artikelen 18a, negende lid][ref1], en [18d][ref2] zijn van overeenkomstige toepassing, met dien
      verstande dat door de overeenkomstige toepassing van [artikel 18d, eerste lid, onderdeel d][ref3], een 40-
      deelnemingsjarenpensioen met inbegrip van het ouderdomspensioen niet meer bedraagt dan 100% van het laatste
      pensioengevend loon.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel18d
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel18d
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18e
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18a
        hoofdstuk: IIB
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 18d
        hoofdstuk: IIB
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 18d
        hoofdstuk: IIB
  - number: 18e.5
    text: |-
      Het in het eerste lid opgenomen maximum wordt voor de periode vanaf het bereiken van de 65-jarige leeftijd opgevat
      met inbegrip van een bedrag dat ten minste wordt gesteld op de uitkeringen voor gehuwde personen zonder toeslag als
      omschreven in [artikel 9, eerste lid, onderdeel b, en vijfde lid, van de Algemene Ouderdomswet][ref1], vermeerderd
      met de vakantietoeslag.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18e
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
  - number: 18f
    text: 'Een nabestaandenoverbruggingspensioen is een pensioen dat:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18f
  - number: 18f.a
    text: |-
      ingaat onmiddellijk na het overlijden van de werknemer of gewezen werknemer dan wel onmiddellijk na beëindiging van
      het recht op een uitkering ingevolge de [Algemene nabestaandenwet][ref1] en uiterlijk eindigt bij het bereiken van
      de 65-jarige leeftijd;


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18f
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: 18f.b
    text: |-
      toekomt aan degene voor wie een regeling voor nabestaandenpensioen of wezenpensioen is getroffen of had kunnen
      worden getroffen;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18f
  - number: 18f.c
    text: |-
      niet meer bedraagt dan het gezamenlijke bedrag van 8/7 maal de nominale uitkering ingevolge de
      [Algemene nabestaandenwet][ref1], vermeerderd met de vakantie-uitkering, en het verschil in verschuldigde premie
      voor de volksverzekeringen over het nabestaandenpensioen voor en na de 65-jarige leeftijd.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18f
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: 18g.1
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de perioden die in aanmerking
      komen als dienstjaren dan wel deelnemingsjaren, bedoeld in de [artikelen 18a][ref1], [18b][ref2], [18c][ref3] en
      [18e][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel18b
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel18c
      [ref4]: https://wetten.overheid.nl/BWBR0002471#Artikel18e
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18g
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18a
        hoofdstuk: IIB
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 18b
        hoofdstuk: IIB
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 18c
        hoofdstuk: IIB
      - id: ref4
        bwb_id: BWBR0002471
        artikel: 18e
        hoofdstuk: IIB
  - number: 18g.2
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het pensioengevend loon, bedoeld
      in de [artikelen 18a][ref1], [18b][ref2], [18c][ref3], [18d][ref4] en [18e][ref5], ter zake van:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel18b
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel18c
      [ref4]: https://wetten.overheid.nl/BWBR0002471#Artikel18d
      [ref5]: https://wetten.overheid.nl/BWBR0002471#Artikel18e
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18g
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18a
        hoofdstuk: IIB
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 18b
        hoofdstuk: IIB
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 18c
        hoofdstuk: IIB
      - id: ref4
        bwb_id: BWBR0002471
        artikel: 18d
        hoofdstuk: IIB
      - id: ref5
        bwb_id: BWBR0002471
        artikel: 18e
        hoofdstuk: IIB
  - number: 18g.2.a
    text: de loonbestanddelen die daarin worden opgenomen;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18g
  - number: 18g.2.b
    text: |-
      de loonbestanddelen waarover de opbouw van het pensioen volgens een ander stelsel dan het eindloonstelsel dient
      plaats te vinden;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18g
  - number: 18g.2.c
    text: |-
      de situatie waarin de werknemer aan het eind van zijn loopbaan in deeltijd gaat werken dan wel terugtreedt naar een
      lager gekwalificeerde functie met een lager loon dan in zijn daaraan voorafgaande functie;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18g
  - number: 18g.2.d
    text: de situatie waarin het loon wordt verlaagd in verband met ziekte of arbeidsongeschiktheid van de werknemer.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18g
  - number: 18h.1
    text: |-
      In afwijking in zoverre van het overigens in of krachtens dit hoofdstuk bepaalde is een regeling waarvan geheel
      of gedeeltelijk een lichaam als bedoeld in [artikel 19a, eerste lid, onderdeel d][ref1], als verzekeraar optreedt,
      een pensioenregeling indien zij voldoet aan [de artikelen 18][ref2] tot en met [18g][ref3] en voorts een pensioen
      inhoudt dat niet uitgaat boven hetgeen in collectieve regelingen gangbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel18g
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18h
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19a
        hoofdstuk: IIB
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '18'
        hoofdstuk: IIB
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 18g
        hoofdstuk: IIB
  - number: 18h.2
    text: |-
      Bij algemene maatregel van bestuur kan worden vastgesteld wat in collectieve regelingen als bedoeld in het
      eerste lid gangbaar is. In afwijking daarvan kan worden vastgesteld dat de opbouwmogelijkheid, aangegeven in
      [artikel 18a, eerste lid][ref1], onverkort van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel18h
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18a
        hoofdstuk: IIB
  - number: '19'
    text: |-
      Met betrekking tot diensttijd waarin het loon nihil is of anderszins aanzienlijk lager is dan hetgeen gebruikelijk
      is, kunnen geen onderscheidenlijk in zoverre geen aanspraken op een pensioenregeling ontstaan als bedoeld in
      [artikel 11, eerste lid, onderdeel c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '11'
        hoofdstuk: II
  - number: 19a.1
    text: |-
      Als verzekeraar van een pensioen als bedoeld in [artikel 18][ref1] kan optreden:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '18'
        hoofdstuk: IIB
  - number: 19a.1.a
    text: |-
      een lichaam dat ingevolge [artikel 5, onderdeel ][ref1] is vrijgesteld van die belasting;


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel5
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '5'
  - number: 19a.1.b
    text: |-
      een verzekeraar die bevoegd is het directe verzekeringsbedrijf, bedoeld in de
      [Wet toezicht verzekeringsbedrijf 1993][ref1], uit te oefenen, mits deze de pensioenverplichting voor de heffing
      van de vennootschapsbelasting rekent tot het binnenlandse ondernemingsvermogen;


      [ref1]: https://wetten.overheid.nl/BWBR0006509
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0006509
  - number: 19a.1.c
    text: |-
      een niet in Nederland gevestigd pensioenfonds of lichaam dat het levensverzekeringsbedrijf uitoefent, mits het
      pensioen de voortzetting is van een pensioen dat reeds was verzekerd bij die verzekeraar in een periode waarin de
      werknemer of gewezen werknemer niet in Nederland woonde of niet in Nederland een dienstbetrekking vervulde;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19a
  - number: 19a.1.d
    text: |-
      een ander lichaam dan bedoeld in de onderdelen *a* , *b* en *c* , dat in Nederland is gevestigd, de
      pensioenverplichting voor de heffing van de vennootschapsbelasting rekent tot het binnenlandse ondernemingsvermogen
      en voldoet aan de in het tweede lid gestelde voorwaarden;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19a
  - number: 19a.1.e
    text: |-
      de natuurlijke persoon tot wie de werknemer in dienstbetrekking staat of heeft gestaan en die voldoet aan de in het
      tweede lid gestelde voorwaarden;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19a
  - number: 19a.1.f
    text: |-
      een pensioenfonds of lichaam dat bevoegd het verzekeringsbedrijf uitoefent, anders dan bedoeld in de onderdelen
      a, b en c, dat door Onze Minister, onder door hem te stellen voorwaarden, is aangewezen en dat zich tegenover Onze
      Minister heeft verplicht:
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19a
  - number: 19a.1.f.1°
    text: |-
      te voldoen aan voorwaarden met betrekking tot het verschaffen van inlichtingen over de uitvoering van de regeling,
      en
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19a
  - number: 19a.1.f.2°
    text: |-
      zekerheid te stellen voor de invordering van de belasting die is verschuldigd door
      toepassing van [artikel 19b][ref1], ofwel [artikel 3.83, eerste of tweede lid][ref2], of
      [artikel 7.2, achtste lid, van de Wet inkomstenbelasting 2001][ref3], dan wel de werknemer of gewezen werknemer
      zich heeft verplicht deze zekerheid te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19b
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel7
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19b
        hoofdstuk: IIB
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '7'
  - number: 19a.2
    text: |-
      Het lichaam of de natuurlijke persoon, bedoeld in het eerste lid, onderdelen *d* en *e*, kan
      slechts als verzekeraar van een pensioen optreden ter uitvoering van toezeggingen als bedoeld in
      [artikel 2, derde lid, van de Pensioen- en spaarfondsenwet][ref1] (*Stb.* 1981, 18) of van toezeggingen waarvoor
      ontheffing is verleend van artikel 2, eerste lid, van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel2
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: '2'
  - number: 19a.3
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de in het eerste lid, onderdeel f,
      bedoelde aanwijzing.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19a
  - number: 19b.1
    text: 'Ingeval op enig tijdstip:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19b
  - number: 19b.1.a
    text: een aanspraak ingevolge een pensioenregeling niet langer als zodanig is aan te merken;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19b
  - number: 19b.1.b
    text: |-
      een aanspraak ingevolge een pensioenregeling wordt afgekocht of vervreemd dan wel formeel of
      feitelijk voorwerp van zekerheid, anders dan ten behoeve van uitstel van betaling op grond van
      [artikel 25, vijfde lid, van de Invorderingswet 1990][ref1], wordt;


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19b
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
  - number: 19b.1.c
    text: |-
      een aanspraak ingevolge een pensioenregeling waarvan als verzekeraar optreedt een lichaam als bedoeld in
      [artikel 19a, eerste lid, onderdeel d][ref1], dan wel een lichaam als bedoeld in [artikel 36b][ref2], wordt
      prijsgegeven, behoudens voor zover de aanspraak niet voor verwezenlijking vatbaar is;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel36b
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19a
        hoofdstuk: IIB
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 36b
        hoofdstuk: VIII
  - number: 19b.1.d
    text: |-
      de zekerheidstelling wordt beëindigd door de werknemer of de gewezen werknemer die zich op grond van
      [artikel 19a, eerste lid, onderdeel f][ref1], heeft verplicht deze zekerheid te stellen;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19a
        hoofdstuk: IIB
  - number: 19b.2
    text: |-
      Ingeval een verplichting ingevolge een pensioenregeling geheel of gedeeltelijk overgaat op een andere verzekeraar
      wordt de aanspraak ingevolge die regeling geacht te worden afgekocht. De eerste volzin is niet van toepassing
      ingeval de verplichting ingevolge een pensioenregeling geheel of gedeeltelijk overgaat naar een verzekeraar
      bedoeld in [artikel 19a, eerste lid, onderdelen a, b, d, e of f][ref1], mits deze overgang niet in strijd komt
      met de bepalingen bij of krachtens de [artikelen 2][ref2], vierde lid, [32][ref3], [32a][ref4], [32b][ref5]
      of [32ba van de Pensioen- en spaarfondsenwet][ref6]. Met betrekking tot een verplichting die is verzekerd bij een
      lichaam of natuurlijk persoon als bedoeld in [artikel 19a, eerste lid, onderdelen d of e][ref7], wordt onder een
      overgang als bedoeld in de eerste volzin mede verstaan herverzekering bij een andere verzekeraar dan bedoeld in
      [artikel 19a, eerste lid, onderdelen a, b, d of f][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002089#Artikel32
      [ref4]: https://wetten.overheid.nl/BWBR0002089#Artikel32a
      [ref5]: https://wetten.overheid.nl/BWBR0002089#Artikel32b
      [ref6]: https://wetten.overheid.nl/BWBR0002089#Artikel32ba
      [ref7]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
      [ref8]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19a
        hoofdstuk: IIB
      - id: ref2
        bwb_id: BWBR0002089
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0002089
        artikel: '32'
      - id: ref4
        bwb_id: BWBR0002089
        artikel: 32a
      - id: ref5
        bwb_id: BWBR0002089
        artikel: 32b
      - id: ref6
        bwb_id: BWBR0002089
        artikel: 32ba
      - id: ref7
        bwb_id: BWBR0002471
        artikel: 19a
        hoofdstuk: IIB
      - id: ref8
        bwb_id: BWBR0002471
        artikel: 19a
        hoofdstuk: IIB
  - number: 19b.3
    text: |-
      Het eerste lid is niet van toepassing ingeval de werknemer of gewezen werknemer in het kader van scheiding van
      tafel en bed, echtscheiding of beëindiging van samenleving een aanspraak ingevolge een pensioenregeling geheel of
      gedeeltelijk vervreemdt aan zijn echtgenoot of gewezen echtgenoot onderscheidenlijk zijn partner of gewezen partner
      dan wel omzet in een zodanige aanspraak met als gerechtigde die echtgenoot of gewezen echtgenoot onderscheidenlijk
      zijn partner of gewezen partner, waarbij die verkregen of omgezette aanspraak voor de toepassing van deze wet wordt
      geacht de voortzetting te zijn van de aanspraak op een pensioenregeling van de werknemer of gewezen werknemer.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19b
  - number: 19b.4
    text: |-
      Het eerste lid is niet van toepassing voor zover een in onderdeel b van dat lid bedoelde
      uitkering of afkoopsom wordt uitgekeerd met toepassing van [artikel 8, achtste lid][ref1], of
      [artikel 32, vijfde lid, van de Pensioen- en spaarfondsenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel32
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '8'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002089
        artikel: '32'
  - number: 19b.5
    text: |-
      Het eerste lid is niet van toepassing voor zover een in onderdeel b van dat lid
      bedoelde uitkering of afkoopsom wordt uitgekeerd als gevolg van een bij of krachtens
      [artikel 32, vierde lid, van de Pensioen- en spaarfondsenwet][ref1] toegestane afkoop van aanspraken, opgebouwd ten
      behoeve van pensioen in de periode voorafgaand aan de datum waarop de deelnemer of gewezen deelnemer de leeftijd
      van 65 jaar bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel32
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19b
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: '32'
  - number: 19b.6
    text: |-
      Onze Minister kan, zo nodig onder door hem te stellen voorwaarden, bepalen dat het tweede lid, eerste
      volzin, niet van toepassing is indien de verplichting ingevolge een pensioenregeling overgaat op een niet in
      Nederland gevestigd pensioenfonds of lichaam dat het verzekeringsbedrijf uitoefent , anders dan bedoeld in
      [artikel 19a, eerste lid, onderdeel f][ref1], zulks ter verwerving van aanspraken ingevolge een pensioenregeling
      in het kader van de aanvaarding van een dienstbetrekking buiten Nederland. De eerste volzin is van overeenkomstige
      toepassing met betrekking tot de overgang van de verplichting ingevolge een pensioenregeling naar een pensioenfonds
      van een internationale organisatie in het kader van de aanvaarding van een dienstbetrekking bij die organisatie
      in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19a
        hoofdstuk: IIB
  - number: 19b.7
    text: |-
      Voor de toepassing van het eerste lid, onderdeel a, wordt een aanspraak op een pensioenregeling mede niet langer
      als zodanig aangemerkt ingeval op enig tijdstip niet langer wordt voldaan aan de voorwaarden gesteld ingevolge het
      zesde lid of [artikel 19d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19d
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19d
        hoofdstuk: IIB
  - number: 19b.8
    text: |-
      De vorige leden zijn van overeenkomstige toepassing met betrekking tot aanspraken op periodieke uitkeringen,
      bedoeld in [artikel 11, eerste lid, onderdeel g][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '11'
        hoofdstuk: II
  - number: 19c.1
    text: |-
      Op verzoek van de inhoudingsplichtige beslist de inspecteur bij voor bezwaar vatbare beschikking of een regeling
      een pensioenregeling is in de zin van de [artikelen 18 tot en met 18h][ref1]. Het verzoek wordt gedaan voordat de
      regeling dan wel een wijziging van de regeling wordt ingevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '18'
        hoofdstuk: IIB
  - number: 19c.2
    text: |-
      Indien een zodanig verzoek is gedaan en vervolgens onherroepelijk komt vast te staan dat de regeling niet een
      zodanige pensioenregeling is en de regeling – onverwijld en ingaand op het tijdstip van ingang van de regeling –
      wordt aangepast in dier voege dat de regeling wel een zodanige pensioenregeling is, wordt de regeling geacht met
      terugwerkende kracht tot uiterlijk dat tijdstip een zodanige pensioenregeling te zijn. De vorige volzin is niet van
      toepassing op pensioenregelingen als bedoeld in [artikel 18h][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18h
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18h
        hoofdstuk: IIB
  - number: 19d
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid, afwijkingen toestaan
      van het overigens in of krachtens dit hoofdstuk bepaalde door regelingen of groepen van regelingen, niet zijnde een
      regeling als bedoeld in [artikel 18h, eerste lid][ref1], aan te wijzen als pensioenregeling indien het een regeling
      betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18h
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19d
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18h
        hoofdstuk: IIB
  - number: 19d.a
    text: |-
      die op bepaalde onderdelen niet meer dan in geringe mate afwijkt van het overigens in of krachtens dit hoofdstuk
      bepaalde, mits het belang van de afwijkingen niet uitgaat boven het belang van de marges op andere onderdelen;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19d
  - number: 19d.b
    text: |-
      voor gemoedsbezwaarden met een ontheffing als bedoeld in
      [artikel 64 van de Wet financiering sociale verzekeringen][ref1], die dient ter vervanging van een
      pensioenregeling;


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel64
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19d
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '64'
  - number: 19d.c
    text: |-
      voor een tijdelijk in Nederland wonende of werkzame werknemer en die regeling voldoet aan
      [artikel 1.7, tweede lid, onderdeel c, van de Wet inkomstenbelasting 2001][ref1], mits de opbouw van het pensioen
      ingevolge die regeling tijdelijk in Nederland wordt voortgezet en het pensioen reeds was verzekerd bij een
      pensioenfonds of lichaam als bedoeld in [artikel 19a, eerste lid, onderdelen c of f][ref2], in een periode waarin
      de werknemer niet in Nederland woonde of niet in Nederland een dienstbetrekking vervulde.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19d
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 19a
        hoofdstuk: IIB
  - number: 19e
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld ter zake van de instelling van een Adviescommissie fiscale
      behandeling pensioenen. De commissie adviseert over de fiscale aspecten van pensioenen, waarbij acht wordt geslagen
      op de voorwaarde dat de adviezen nagenoeg budgettair neutraal uitgevoerd kunnen worden.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19e
  - number: 19f
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld ter bevordering van een goede uitvoering van dit hoofdstuk
      alsmede met betrekking tot samenloop van verschillende pensioenstelsels.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19f
  - number: 19g.1
    text: 'Onder levensloopregeling wordt verstaan een regeling die:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19g
  - number: 19g.1.a
    text: ten doel heeft het treffen van een voorziening in geld uitsluitend voor een periode van extra verlof;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19g
  - number: 19g.1.b
    text: |-
      inhoudt dat een voorziening in geld kan worden opgebouwd, met dien verstande dat in het kalenderjaar niet meer
      aanspraken ontstaan dan overeenkomt met 12 percent van het loon van het jaar en voorzover de totale aanspraken aan
      het einde van het kalenderjaar door de in het kalenderjaar opgebouwde aanspraken een periode van extra verlof van
      2,1 jaar niet te boven gaan.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19g
  - number: 19g.2
    text: |-
      Over de ingevolge een levensloopregeling opgebouwde voorziening mag worden beschikt ten behoeve van loon tijdens
      een verlofperiode dat, tezamen met het daarnaast van de inhoudingsplichtige genoten loon, niet uitgaat boven het
      laatstgenoten loon.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19g
  - number: 19g.3
    text: |-
      Het ingevolge een levensloopregeling ingehouden loon wordt overgemaakt naar een geblokkeerde rekening bij
      een kredietinstelling, als premie gestort bij een verzekeraar voor een verzekering in het kader van een
      levensloopregeling, dan wel overgemaakt naar de beheerder van een beleggingsinstelling ter verkrijging van een of
      meer geblokkeerde rechten van deelneming in die instelling.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19g
  - number: 19g.4
    text: |-
      Als kredietinstelling, onderscheidenlijk verzekeraar of beheerder van een beleggingsinstelling als bedoeld in het
      derde lid kunnen optreden:
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19g
  - number: 19g.4.a
    text: |-
      ondernemingen of instellingen aan wie het ingevolge de [Wet toezicht kredietwezen 1992][ref1] is toegestaan hun
      bedrijf te maken van het ter beschikking krijgen van, al dan niet op termijn, opvorderbare gelden en van het voor
      eigen rekening verrichten van kredietuitzettingen of beleggingen, mits deze kredietinstelling de verplichting
      ingevolge de levensloopregeling voor de heffing van de vennootschapsbelasting rekent tot het binnenlandse
      ondernemingsvermogen;


      [ref1]: https://wetten.overheid.nl/BWBR0005792
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19g
    references:
      - id: ref1
        bwb_id: BWBR0005792
  - number: 19g.4.b
    text: |-
      verzekeraars aan wie het ingevolge de [Wet toezicht verzekeringsbedrijf 1993][ref1] is toegestaan het directe
      verzekeringsbedrijf uit te oefenen, mits deze verzekeraar de verplichting ingevolge de levensloopregeling rekent
      tot het binnenlandse ondernemingsvermogen;


      [ref1]: https://wetten.overheid.nl/BWBR0006509
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19g
    references:
      - id: ref1
        bwb_id: BWBR0006509
  - number: 19g.4.c
    text: |-
      beheerders van beleggingsinstellingen aan wie een vergunning is verleend ingevolge de
      [Wet toezicht beleggingsinstellingen][ref1] en die zijn gevestigd in Nederland;


      [ref1]: https://wetten.overheid.nl/BWBR0004809
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19g
    references:
      - id: ref1
        bwb_id: BWBR0004809
  - number: 19g.4.d
    text: een ander lichaam dan bedoeld in de onderdelen a, b en c dat voldoet aan door onze Minister te stellen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19g
  - number: 19g.5
    text: |-
      Een werknemer kan in een kalenderjaar niet zowel een voorziening ingevolge een levensloopregeling opbouwen als
      sparen ingevolge een spaarloonregeling als bedoeld in [artikel 32][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel32
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19g
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '32'
        hoofdstuk: V
  - number: 19g.6
    text: 'Indien op enig tijdstip:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19g
  - number: 19g.6.a
    text: een levensloopregeling niet langer als zodanig is aan te merken, of
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19g
  - number: 19g.6.b
    text: een aanspraak ingevolge een levensloopregeling wordt afgekocht of vervreemd, of
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19g
  - number: 19g.6.c
    text: |-
      de inhoudingsplichtige aan de werknemer een bijdrage ten behoeve van de levensloopregeling verstrekt, terwijl
      hij niet in dezelfde mate aan zijn overige werknemers die voor het overige in dezelfde omstandigheden verkeren
      een bijdrage verstrekt, of de bijdrage onder voorwaarden verstrekt met betrekking tot het moment van beschikken
      over de opgebouwde voorziening, wordt op het onmiddellijk daaraan voorafgaande tijdstip de aanspraak ingevolge de
      levensloopregeling aangemerkt als loon uit een vroegere dienstbetrekking van de werknemer of gewezen werknemer dan
      wel, indien deze is overleden, van de gerechtigde tot de aanspraak.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19g
  - number: 19g.7
    text: |-
      Het zesde lid is niet van toepassing voorzover een aanspraak ingevolge een levensloopregeling wordt omgezet
      in een aanspraak ingevolge een pensioenregeling die na de omzetting nog blijft binnen de in of krachtens
      [hoofdstuk IIB][ref1] gestelde begrenzingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#HoofdstukIIB
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19g
    references:
      - id: ref1
        bwb_id: BWBR0002471
        hoofdstuk: IIB
  - number: 19g.8
    text: |-
      De ingevolge de levensloopregeling opgebouwde voorziening wordt op de dag voorafgaand aan de dag waarop de
      werknemer de 65-jarige leeftijd heeft bereikt, maar uiterlijk op de dag voorafgaand aan het ingaan van het
      ouderdomspensioen aangemerkt als loon uit een vroegere dienstbetrekking van de werknemer.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19g
  - number: 19g.9
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld voor de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel19g
  - number: '20.1'
    text: |-
      De over een loontijdvak van een jaar verschuldigde belasting is het bedrag van de over het kalenderjaar berekende
      belasting op het belastbare loon verminderd met het bedrag van de heffingskorting voor de loonbelasting.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel20
  - number: '20.2'
    text: |-
      Het bedrag van de heffingskorting voor de loonbelasting bedraagt maximaal het bedrag van de verschuldigde belasting
      over het loontijdvak van een jaar.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel20
  - number: 20a.1
    text: |-
      De belasting over een loontijdvak van een jaar wordt bepaald aan de hand van de navolgende tabel (tarieftabel).








                    Bij een belastbaar loon van meer dan


                    maar niet meer dan


                    bedraagt de belasting het in kolom III vermelde bedrag, vermeerderd met het bedrag dat wordt berekend
      door het in kolom IV vermelde percentage te nemen van het gedeelte van het belastbare loon dat het in kolom I
      vermelde bedrag te boven gaat






                    I


                    II


                    III


                    IV




                    –


                    € 17 046


                    –


                    2,45%




                    € 17 046


                    € 30 631


                    € 417


                    9,75%




                    € 30 631


                    € 52 228


                    € 1 741


                    42%




                    € 52 228


                    –


                    € 10 811


                    52%
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel20a
  - number: 20a.2
    text: |-
      De in het eerste lid vermelde bedragen worden bij het begin van het kalenderjaar van rechtswege vervangen door de
      bedragen die krachtens [artikel 10.1 van de Wet inkomstenbelasting 2001][ref1] worden vastgesteld ter vervanging
      van de in [artikel 2.10 van die wet][ref2] vermelde bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '2'
  - number: '21'
    text: |-
      In [dit hoofdstuk][ref1] en de daarop berustende bepalingen wordt verstaan onder:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002471
        hoofdstuk: III
  - number: 21.a
    text: |-
      belastingtarief eerste schijf: het in de eerste regel van de vierde kolom van de tabel in [artikel 20a][ref1]
      opgenomen percentage;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel20a
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 20a
        hoofdstuk: III
  - number: 21.b
    text: |-
      gecombineerd heffingspercentage: de som van het belastingtarief eerste schijf en de volgens
      [artikel 11 van de Wet financiering sociale verzekeringen][ref1] vastgestelde premiepercentages voor de algemene
      ouderdomsverzekering, de nabestaandenverzekering en de algemene verzekering bijzondere ziektekosten.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel11
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '11'
  - number: 21a
    text: |-
      De heffingskorting voor de loonbelasting is het deel van de standaardloonheffingskorting dat tot de
      standaardloonheffingskorting in dezelfde verhouding staat als het belastingtarief eerste schijf staat tot het
      gecombineerde heffingspercentage.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel21a
  - number: 21b
    text: |-
      Bij de toepassing van [artikel 21a][ref1] op het deel van de standaardloonheffingskorting dat op de ouderenkorting
      of de alleenstaande ouderenkorting betrekking heeft, wordt het gecombineerde heffingspercentage verminderd
      met het volgens [artikel 11, eerste lid, van de Wet financiering sociale verzekeringen][ref2] voor de algemene
      ouderdomsverzekering vastgestelde premiepercentage.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel21a
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel11
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel21b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 21a
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '11'
  - number: 21c
    text: 'De standaardloonheffingskorting is het gezamenlijke bedrag van:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel21c
  - number: 21c.a
    text: |-
      de algemene heffingskorting ([artikel 22][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel22
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel21c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '22'
        hoofdstuk: III
  - number: 21c.b
    text: |-
      de arbeidskorting ([artikel 22a][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel22a
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel21c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 22a
        hoofdstuk: III
  - number: 21c.c
    text: |-
      de jonggehandicaptenkorting ([artikel 22aa][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel22aa
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel21c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 22aa
        hoofdstuk: III
  - number: 21c.d
    text: |-
      de ouderenkorting ([artikel 22b][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel22b
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel21c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 22b
        hoofdstuk: III
  - number: 21c.e
    text: |-
      de alleenstaande ouderenkorting ([artikel 22c][ref1]) en


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel22c
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel21c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 22c
        hoofdstuk: III
  - number: 21c.f
    text: |-
      de levensloopverlofkorting ([artikel 22ca][ref1]).


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel22ca
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel21c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 22ca
        hoofdstuk: III
  - number: '22.1'
    text: Voor de werknemer is de algemene heffingskorting van toepassing.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel22
  - number: '22.2'
    text: De algemene heffingskorting bedraagt € 1990.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel22
  - number: 22a.1
    text: Voor de werknemer die loon uit tegenwoordige arbeid geniet, is de arbeidskorting van toepassing.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel22a
  - number: 22a.2
    text: 'De arbeidskorting wordt berekend over het loon uit tegenwoordige arbeid en bedraagt de som van:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel22a
  - number: 22a.2.a
    text: 1,795% van dat loon met een maximum van € 146; en
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel22a
  - number: 22a.2.b
    text: |-
      12,421% van dat loon voorzover dit bij een tijdvakloon op jaarbasis meer is dan € 8132. De arbeidskorting bedraagt
      maximaal € 1357.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel22a
  - number: 22a.3
    text: 'In afwijking van het tweede lid, wordt:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel22a
  - number: 22a.3.a
    text: |-
      ingeval de werknemer bij het begin van het kalenderjaar de leeftijd van 57 jaar heeft bereikt maar nog niet de
      leeftijd van 60, het percentage, bedoeld in het tweede lid, onderdeel b, vervangen door 14,954% en het bedrag,
      bedoeld in het tweede lid, tweede volzin, vervangen door € 1604;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel22a
  - number: 22a.3.b
    text: |-
      ingeval de werknemer bij het begin van het kalenderjaar de leeftijd van 60 jaar heeft bereikt maar nog niet de
      leeftijd van 62, het percentage, bedoeld in het tweede lid, onderdeel b, vervangen door 17,467% en het bedrag,
      bedoeld in het tweede lid, tweede volzin, vervangen door € 1849;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel22a
  - number: 22a.3.c
    text: |-
      ingeval de werknemer bij het begin van het kalenderjaar de leeftijd van 62 jaar heeft bereikt, het percentage,
      bedoeld in het tweede lid, onderdeel b, vervangen door 19,990% en het bedrag, bedoeld in het tweede lid, tweede
      volzin, vervangen door € 2095.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel22a
  - number: 22a.4
    text: 'Met loon uit tegenwoordige arbeid worden gelijkgesteld:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel22a
  - number: 22a.4.a
    text: loon genoten wegens tijdelijke arbeidsongeschiktheid;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel22a
  - number: 22a.4.b
    text: |-
      uitkeringen op grond van de [Wet arbeid en zorg][ref1] en aanvullingen daarop door degene tot wie de
      belastingplichtige in dienstbetrekking staat.


      [ref1]: https://wetten.overheid.nl/BWBR0013008
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0013008
  - number: 22a.5
    text: 'Loon genoten wegens tijdelijke arbeidsongeschiktheid zijn niet uitkeringen op grond van:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel22a
  - number: 22a.5.a
    text: |-
      de [Wet werk en inkomen naar arbeidsvermogen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0019057
  - number: 22a.5.b
    text: |-
      de [Wet op de arbeidsongeschiktheidsverzekering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: 22a.5.c
    text: |-
      de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008656
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0008656
  - number: 22a.5.d
    text: |-
      de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0008657
  - number: 22a.5.e
    text: |-
      buitenlandse arbeidsongeschiktheidsverzekeringen die naar aard en strekking overeenkomen met de regelingen die zijn
      vermeld in de onderdelen a, b, c en d.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel22a
  - number: 22aa.1
    text: |-
      Voor de werknemer die een uitkering geniet op grond van de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref1], is de jonggehandicaptenkorting van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel22aa
    references:
      - id: ref1
        bwb_id: BWBR0008657
  - number: 22aa.2
    text: De jonggehandicaptenkorting bedraagt € 645.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel22aa
  - number: 22b.1
    text: |-
      Voor de werknemer die de leeftijd van 65 jaar heeft bereikt en een tijdvakloon heeft dat op jaarbasis niet meer
      bedraagt dan € 31 256 is de ouderenkorting van toepassing.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel22b
  - number: 22b.2
    text: De ouderenkorting bedraagt € 374.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel22b
  - number: 22c.1
    text: |-
      Voor de werknemer die een uitkering als bedoeld in
      [artikel 9, eerste lid, onderdeel a of onderdeel c, van de Algemene Ouderdomswet][ref1] geniet, is de alleenstaande
      ouderenkorting van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel22c
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
  - number: 22c.2
    text: De alleenstaande ouderenkorting bedraagt € 562.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel22c
  - number: 22ca.1
    text: |-
      Voor de werknemer die beschikt over een ingevolge een levensloopregeling als bedoeld in [artikel 19g][ref1]
      opgebouwde voorziening is de levensloopverlofkorting van toepassing. Voor de werknemer die met toepassing van
      [artikel 19g, zesde lid][ref2], beschikt over de opgebouwde voorziening is de levensloopverlofkorting niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19g
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel19g
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel22ca
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19g
        hoofdstuk: IIC
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 19g
        hoofdstuk: IIC
  - number: 22ca.2
    text: |-
      De levensloopverlofkorting is gelijk aan het bedrag waarover met toepassing van [artikel 19g][ref1] wordt
      beschikt, maar ten hoogste € 185 per kalenderjaar waarin een voorziening in het kader van een levensloopregeling is
      opgebouwd, verminderd met de bedragen aan levensloopverlofkorting die de werknemer in voorafgaande loontijdvakken
      reeds heeft genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19g
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel22ca
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19g
        hoofdstuk: IIC
  - number: 22ca.3
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld voor de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel22ca
  - number: 22d
    text: |-
      De in de [artikelen 22][ref1], [22a][ref2], [22aa][ref3], [22b][ref4], [22c][ref5] en [22ca][ref6] vermelde
      bedragen en de in [artikel 22a][ref7] vermelde percentages worden bij het begin van het kalenderjaar van
      rechtswege vervangen door de bedragen die, en het percentage dat, krachtens de [artikelen 10.1][ref8]
      en [10.7 van de Wet inkomstenbelasting 2001][ref9] worden vastgesteld ter vervanging van de in de
      [artikelen 8.10][ref10], [8.11][ref11], [8.16a][ref12], [8.17][ref13], [8.18][ref14] en [8.18a van die wet][ref15]
      vermelde bedragen en de in [artikel 8.11 van die wet][ref16] vermelde percentages.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel22a
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel22aa
