  - number: '23.1'
    text: |-
      Indien de werknemer over loontijdvakken die geheel of gedeeltelijk samenvallen loon geniet uit meer dan een
      dienstbetrekking of vroegere dienstbetrekking dan wel van meer dan een inhoudingsplichtige en dit loon voor de
      berekening van de belasting niet wordt samengevoegd, kan de werknemer de heffingskorting voor de loonbelasting
      slechts in een dienstbetrekking dan wel tegenover een inhoudingsplichtige geldend maken.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel23
  - number: '23.2'
    text: |-
      In afwijking van het eerste lid wordt het deel van de heffingskorting dat betrekking heeft op de
      jonggehandicaptenkorting geldend gemaakt tegenover de inhoudingsplichtige die de uitkering op grond van de Wet
      arbeidsongeschiktheidsvoorziening jonggehandicapten uitbetaalt.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel23
  - number: '24'
    text: |-
      Voor de toepassing van [de artikelen 21][ref1] tot en met [22d][ref2] ter bepaling van de hoogte van de
      heffingskorting is beslissend de toestand op het tijdstip waarop de belasting moet worden ingehouden, met dien
      verstande dat voor de ouderenkorting en de alleenstaande ouderenkorting beslissend is de toestand aan het einde van
      de kalendermaand waarin de belasting moet worden ingehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel22d
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '21'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 22d
        hoofdstuk: III
  - number: '25.1'
    text: |-
      Loontijdvak is het tijdvak waarover het loon wordt genoten. Het bedrag van de belasting over een ander loontijdvak
      dan een jaar wordt door herleiding bepaald. Bij de herleiding wordt een jaar op 260 dagen, een maand op 65/3 dag,
      een week op 5 dagen en een tijdvak dat korter is dan een dag op een dag gesteld.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel25
  - number: '25.2'
    text: |-
      Bij ministeriële regeling kunnen loonbelastingtabellen worden vastgesteld voor loontijdvakken waarvoor Onze
      Minister dit nodig acht. In deze tabellen wordt de heffingskorting voor de loonbelasting op zodanige wijze
      verwerkt dat naast het bedrag aan loon het belastingbedrag of belastingpercentage is vermeld. In deze tabellen
      kan de verwerking van de heffingskorting geheel of ten dele achterwege worden gelaten en kan bij de verwerking
      van de heffingskorting rekening worden gehouden met algemeen voorkomende beloningen die worden belast volgens een
      tabel voor bijzondere beloningen als bedoeld in [artikel 26][ref1]. Bij het opstellen van deze tabellen kunnen
      loonklassen en afrondingen worden aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel26
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '26'
        hoofdstuk: III
  - number: '25.3'
    text: |-
      De loonbelastingtabellen worden vastgesteld op basis van de daarvoor benodigde gegevens zoals die vermoedelijk
      zullen luiden op het tijdstip van inwerkingtreding van de tabellen. Voorzover de toegepaste gegevens zodanig
      afwijken van de gegevens zoals die luiden op het tijdstip van inwerkingtreding dat bij toepassing van
      laatstbedoelde gegevens andere tabellen zouden zijn vastgesteld, worden bij ministeriële regeling nieuwe tabellen
      vastgesteld, ingaande ten hoogste zes maanden na het in de eerste volzin bedoelde tijdstip van inwerkingtreding,
      waarin de in de verstreken loontijdvakken ontstane afwijking zoveel mogelijk in de nog niet verstreken
      loontijdvakken van het kalenderjaar wordt ongedaan gemaakt.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel25
  - number: '25.4'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld volgens welke in afwijking van het eerste lid als
      loontijdvak wordt aangemerkt een tijdvak waarvan het tijdvak waarover het loon wordt genoten, deel uitmaakt.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel25
  - number: '26.1'
    text: |-
      Tantièmes, gratificaties en andere beloningen die in de regel slechts eenmaal of eenmaal per jaar worden
      toegekend, worden belast volgens loonbelastingtabellen voor bijzondere beloningen die bij ministeriële regeling
      worden vastgesteld met overeenkomstige toepassing van [artikel 25, tweede en derde lid][ref1], met dien verstande
      dat in deze tabellen jaarlonen en belastingpercentages worden opgenomen en geen rekening wordt gehouden met de
      arbeidskorting.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel25
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '25'
        hoofdstuk: III
  - number: '26.2'
    text: |-
      Indien dit niet tot een hoger belastingbedrag leidt, mogen de in het eerste lid bedoelde beloningen worden
      beschouwd als een toevoeging aan het loon over het loontijdvak waarin zij worden uitbetaald.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel26
  - number: '26.3'
    text: |-
      Overwerkloon mag worden belast naar het percentage dat wordt aangewezen door de loonbelastingtabel voor bijzondere
      beloningen.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel26
  - number: '26.4'
    text: 'Als jaarloon geldt voor de toepassing van dit artikel:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel26
  - number: 26.4.a
    text: |-
      ingeval de werknemer over het gehele voorafgaande kalenderjaar van de inhoudingsplichtige loon heeft genoten: het
      in dat jaar genoten loon;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel26
  - number: 26.4.b
    text: |-
      ingeval de werknemer over een gedeelte van het voorafgaande kalenderjaar van de inhoudingsplichtige loon heeft
      genoten: het tot een jaarloon herleide bedrag van het in dat jaar genoten loon;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel26
  - number: 26.4.c
    text: |-
      in andere gevallen: het in het kalenderjaar te genieten loon, indien over het gehele jaar van de
      inhoudingsplichtige loon zou worden genoten.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel26
  - number: '26.5'
    text: |-
      Als overwerkloon gelden voor de toepassing van dit artikel de beloningen ter zake van arbeid welke wordt verricht
      gedurende de tijd die uitgaat boven de voor de werknemer geldende normale arbeidsduur.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel26
  - number: '26.6'
    text: |-
      Voor het geval de werknemer binnen een samenhangende groep inhoudingsplichtigen in de zin van [artikel 27e][ref1]
      van inhoudingsplichtige is gewisseld, kunnen voor de toepassing van het vierde lid bij ministeriële regeling
      aanvullende bepalingen worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel27e
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 27e
        hoofdstuk: IV
  - number: 26b
    text: |-
      In afwijking van [de artikelen 20][ref1], [20][ref2] en [26][ref3] bedraagt de belasting 52% van het loon ingeval
      de werknemer zijn naam, adres of woonplaats niet aan de inhoudingsplichtige heeft verstrekt dan wel, ingeval de
      werknemer loon uit tegenwoordige dienstbetrekking geniet, zijn identiteit niet is vastgesteld en opgenomen in de
      loonadministratie overeenkomstig [artikel 28, onderdeel e][ref4], alsmede ingeval de werknemer ter zake onjuiste
      gegevens heeft verstrekt en de inhoudingsplichtige dit weet of redelijkerwijs moet weten. Indien de belasting
      ingevolge [artikel 27b, eerste lid][ref5], in één bedrag met de premie voor de volksverzekeringen wordt geheven,
      wordt in afwijking in zoverre van de eerste volzin het bedrag van de verschuldigde belasting te zamen met het
      bedrag van de verschuldigde premie voor de volksverzekeringen gesteld op 52% van het loon.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel20a
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0002471#Artikel28
      [ref5]: https://wetten.overheid.nl/BWBR0002471#Artikel27b
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel26b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '20'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 20a
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0002471
        artikel: '26'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0002471
        artikel: '28'
        hoofdstuk: IV
      - id: ref5
        bwb_id: BWBR0002471
        artikel: 27b
        hoofdstuk: IV
  - number: '27.1'
    text: De belasting wordt geheven door inhouding op het loon.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel27
  - number: '27.2'
    text: De inhoudingsplichtige is verplicht de belasting in te houden op het tijdstip waarop het loon wordt genoten.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel27
  - number: '27.3'
    text: De inhouding vindt plaats volgens de op het tijdstip van inhouding voor de werknemer geldende loonbelastingtabel.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel27
  - number: '27.4'
    text: |-
      Overtreft de belasting het van de inhoudingsplichtige genoten loon in geld, dan wordt het ontbrekende geacht te
      zijn ingehouden op het in het tweede lid omschreven tijdstip, met dien verstande dat de inhoudingsplichtige bevoegd
      is dat ontbrekende te verhalen op de werknemer. Ingeval het [artikel 27b, eerste lid][ref1] toepassing vindt, is
      de vorige volzin van overeenkomstige toepassing met betrekking tot het gezamenlijke bedrag van de belasting en de
      premie voor de volksverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel27b
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 27b
        hoofdstuk: IV
  - number: '27.5'
    text: De inhoudingsplichtige is verplicht de in een tijdvak ingehouden belasting op aangifte af te dragen.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel27
  - number: 27a.1
    text: |-
      In afwijking in zoverre van het overigens bij of krachtens deze wet bepaalde wordt de belasting over de in
      [artikel 31][ref1] bedoelde eindheffingsbestanddelen geheven van de inhoudingsplichtige.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '31'
        hoofdstuk: V
  - number: 27a.2
    text: |-
      De heffing over eindheffingsbestanddelen, met uitzondering van de aan naheffing onderworpen
      eindheffingsbestanddelen als bedoeld in [artikel 31, eerste lid, onderdeel a][ref1], geschiedt als ware de door de
      inhoudingsplichtige in een tijdvak verschuldigde belasting door hem op aangifte af te dragen belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '31'
        hoofdstuk: V
  - number: 27b.1
    text: |-
      Indien de werknemer ook premieplichtig is voor de volksverzekeringen geschiedt de heffing van de belasting en de
      premie voor de volksverzekeringen in één bedrag dan wel in één percentage, met overeenkomstige toepassing van de
      regels die gelden voor de heffing en de invordering van de loonbelasting.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel27b
  - number: 27b.2
    text: |-
      Voor gevallen waarin het eerste lid toepassing vindt, worden, met overeenkomstige toepassing van
      [artikel 25][ref1], bij ministeriële regeling tabellen vastgesteld waarin telkens de belasting en de premie voor de
      volksverzekeringen in één bedrag dan wel in één percentage worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel25
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel27b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '25'
        hoofdstuk: III
  - number: 27b.3
    text: |-
      Bij ministeriele regeling worden voor daarbij aan te wijzen gevallen berekeningsvoorschriften vastgesteld aan de
      hand waarvan uit de in het tweede lid bedoelde tabellen het bedrag van de belasting wordt afgeleid.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel27b
  - number: 27c.1
    text: |-
      Indien ten aanzien van de werknemer ook premieplicht voor de werknemersverzekeringen bestaat, geschiedt de heffing
      van de premies voor de werknemersverzekeringen gelijktijdig met die van de belasting en geschiedt de afdracht van
      die premies en de belasting op één aangifte, een en ander met overeenkomstige toepassing van de regels die gelden
      voor de heffing en de invordering van de loonbelasting.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel27c
  - number: 27c.2
    text: |-
      Toerekening van een betaling op de aangifte bedoeld in het eerste lid geschiedt naar evenredigheid aan de belasting
      en aan de premies voor de werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel27c
  - number: 27d.1
    text: |-
      Indien de werknemer ook verzekeringsplichtig is in de zin van de [Zorgverzekeringswet][ref1], geschiedt de
      heffing van de ingevolge de [Zorgverzekeringswet][ref2] over het loon verschuldigde inkomensafhankelijke bijdrage
      gelijktijdig met die van de belasting en geschiedt de afdracht van die bijdrage en de belasting op één aangifte,
      een en ander met overeenkomstige toepassing van de regels die gelden voor de heffing en de invordering van de
      loonbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel27d
    references:
      - id: ref1
        bwb_id: BWBR0018450
      - id: ref2
        bwb_id: BWBR0018450
  - number: 27d.2
    text: |-
      Toerekening van een betaling op de aangifte, bedoeld in het eerste lid, geschiedt naar evenredigheid aan de
      belasting en aan de ingevolge de [Zorgverzekeringswet][ref1] verschuldigde inkomensafhankelijke bijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel27d
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: 27da
    text: |-
      Voorzover de belasting, de premie voor de volksverzekeringen of de premies voor de werknemersverzekeringen
      gelijktijdig worden geheven en [artikel 28b][ref1] of [artikel 67b][ref2], [67c][ref3] of
      [67f van de Algemene wet inzake rijksbelastingen][ref4] toepassing vindt, wordt dat artikel eenmaal toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel28b
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel67b
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel67c
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel67f
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel27da
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 28b
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 67b
      - id: ref3
        bwb_id: BWBR0002320
        artikel: 67c
      - id: ref4
        bwb_id: BWBR0002320
        artikel: 67f
  - number: 27e.1
    text: |-
      Met het oog op het beperken van administratieve lasten van een aantal inhoudingsplichtigen die tegelijkertijd
      aangiften doen, kan de inspecteur op hun verzoek, onder door hem te stellen voorwaarden, deze inhoudingsplichtigen
      aanwijzen als samenhangende groep inhoudingsplichtigen.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel27e
  - number: 27e.2
    text: |-
      De aanwijzing kan en de daarbij gestelde voorwaarden kunnen, al dan niet op verzoek van een of meer
      inhoudingsplichtigen, worden gewijzigd of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel27e
  - number: 27e.3
    text: Aanwijzing, wijziging en intrekking vinden plaats bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel27e
  - number: '28'
    text: 'De inhoudingsplichtige is gehouden volgens bij ministeriële regeling te stellen regels:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel28
  - number: 28.a
    text: |-
      van de werknemer opgave te verlangen van gegevens waarvan de kennisneming voor de heffing van de belasting van
      belang kan zijn;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel28
  - number: 28.b
    text: de in onderdeel *a* bedoelde gegevens door te geven aan een andere inhoudingsplichtige;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel28
  - number: 28.c
    text: |-
      een loonadministratie te voeren en daarbij de gegevens te administreren met betrekking tot de bij ministeriële
      regeling aan te wijzen uitkeringen, verstrekkingen en vergoedingen welke ingevolge [artikel 11][ref1] niet tot het
      loon behoren;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '11'
        hoofdstuk: II
  - number: 28.d
    text: |-
      aan de inspecteur opgave te verstrekken van het in een kalenderjaar door de werknemer genoten loon, van de
      ingehouden belasting en van andere gegevens welke van belang kunnen zijn voor de heffing van de inkomstenbelasting;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel28
  - number: 28.e
    text: |-
      aan de werknemer opgave te verstrekken van het in een kalenderjaar genoten loon, van de ingehouden belasting en van
      andere gegevens welke van belang kunnen zijn voor de heffing van de inkomstenbelasting;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel28
  - number: 28.f
    text: |-
      de identiteit van de loon uit tegenwoordige dienstbetrekking genietende
      werknemer vast te stellen aan de hand van een document als bedoeld in
      [artikel 1, eerste lid, onder 1º tot en met 3º, van de Wet op de identificatieplicht][ref1], alsmede de aard, het
      nummer en een afschrift daarvan in de loonadministratie op te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 28a.1
    text: |-
      Indien de inhoudingsplichtige met betrekking tot een aangifte binnen vijf jaren na het einde van het kalenderjaar
      waarin het tijdvak is aangevangen waarover die aangifte is gedaan constateert dat hij een onjuiste of onvolledige
      aangifte heeft gedaan, is hij verplicht gelijktijdig met de eerstvolgende aangifte, of de daarop volgende aangifte
      door middel van een correctiebericht alsnog de juiste en volledige gegevens te verstrekken.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel28a
  - number: 28a.2
    text: |-
      Indien de inspecteur met betrekking tot een aangifte binnen vijf jaren na het einde van het kalenderjaar waarin het
      tijdvak is aangevangen waarover die aangifte is gedaan constateert dat die aangifte onjuist of onvolledig is, kan
      hij de inhoudingsplichtige verplichten gelijktijdig met een aangifte door middel van een correctiebericht alsnog de
      juiste en volledige gegevens te verstrekken.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel28a
  - number: 28a.3
    text: |-
      De inhoudingsplichtige is gehouden de gegevens bedoeld in het eerste en tweede lid op dezelfde wijze en in dezelfde
      vorm te verstrekken als van de aangifte.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel28a
  - number: 28a.4
    text: |-
      Bij ministeriële regeling kunnen van de vorige leden afwijkende regels worden gesteld met betrekking tot de
      verplichting voor de inhoudingsplichtige tot het indienen van een correctiebericht, daaronder begrepen regels over
      de wijze waarop en de termijn waarbinnen een correctiebericht moet worden ingediend.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel28a
  - number: 28a.5
    text: |-
      Een correctiebericht is geen bezwaarschrift in de zin van de [Algemene wet inzake rijksbelastingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: 28a.6
    text: |-
      Indien bij de aangifte een correctiebericht is ingediend en het saldo van de te betalen belasting
      van de aangifte en het correctiebericht positief is, is de inhoudingsplichtige, in zoverre in
      afwijking van [artikel 19, eerste lid, van de Algemene wet inzake rijksbelastingen][ref1], gehouden
      dit saldo aan de ontvanger te betalen. Voorzover het bedrag van het correctiebericht in mindering
      wordt gebracht op de bij de aangifte te betalen belasting, wordt heffingsrente vergoed overeenkomstig
      [hoofdstuk VA van de Algemene wet inzake rijksbelastingen][ref2], met dien verstande dat het tijdvak waarover de
      heffingsrente wordt berekend, eindigt op de dag van ontvangst van het correctiebericht. De inspecteur stelt het
      bedrag van de heffingsrente vast bij voor bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002320#HoofdstukVA
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0002320
        hoofdstuk: VA
  - number: 28a.7
    text: Bij toepassing van het vorige lid wordt een betaling zoveel mogelijk toegerekend aan het correctiebericht.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel28a
  - number: 28a.8
    text: |-
      Voor toepassing van de [artikelen 20][ref1] en [67f van de Algemene wet inzake rijksbelastingen][ref2], wordt met
      geheel of gedeeltelijk niet betaald zijn van belasting die op aangifte behoort te worden afgedragen gelijkgesteld
      het geval waarin naar aanleiding van een ingediend correctiebericht te veel is gesaldeerd of teruggegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel67f
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 67f
  - number: 28a.9
    text: |-
      In aanvulling op [artikel 20, derde lid, van de Algemene wet inzake rijksbelastingen][ref1] vervalt, indien te veel
      is gesaldeerd, de bevoegdheid tot naheffing door verloop van vijf jaren na het einde van het kalenderjaar waarin de
      saldering heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel20
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '20'
  - number: 28b.1
    text: |-
      Indien de inhoudingsplichtige het correctiebericht bedoeld in [artikel 28a, eerste en tweede lid][ref1], niet,
      onjuist, onvolledig dan wel niet binnen de gestelde termijn heeft ingediend, vormt dit een verzuim terzake waarvan
      de inspecteur hem een boete van ten hoogste € 1134 kan opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel28a
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 28a
        hoofdstuk: IV
  - number: 28b.2
    text: |-
      De bevoegdheid tot het opleggen van een boete wegens het feit bedoeld in [artikel 28a, eerste lid][ref1], vervalt
      door verloop van vijf jaar na het einde van het kalenderjaar van de aangifte waarop het correctiebericht betrekking
      had moeten hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel28a
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 28a
        hoofdstuk: IV
  - number: 28b.3
    text: |-
      De bevoegdheid tot het opleggen van een boete wegens het feit bedoeld in [artikel 28a, tweede lid][ref1], vervalt
      door verloop van een jaar na het einde van de termijn waarbinnen het correctiebericht had moeten worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel28a
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 28a
        hoofdstuk: IV
  - number: 28b.4
    text: |-
      Aan de inhoudingsplichtige die een onjuiste of onvolledige aangifte heeft gedaan en die alsnog de juiste of
      volledige gegevens door middel van een correctiebericht als bedoeld in [artikel 28a][ref1] verstrekt voordat hij
      weet of redelijkerwijs moet vermoeden dat de inspecteur met de onjuistheid of onvolledigheid bekend is of bekend zal
      worden, wordt een boete als bedoeld in [artikel 67b, tweede lid, van de Algemene wet inzake rijksbelastingen][ref2]
      ter zake van het feit van de onjuiste of onvolledige aangifte niet opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel28a
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel67b
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 28a
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 67b
  - number: 28c.1
    text: |-
      Indien de inhoudingsplichtige de opgave, bedoeld in [artikel 28, onderdeel f][ref1], niet, onjuist, onvolledig dan
      wel niet binnen de gestelde termijn heeft verstrekt, vormt dit een verzuim terzake waarvan de inspecteur hem een
      boete van ten hoogste € 1134 kan opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel28
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel28c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '28'
        hoofdstuk: IV
  - number: 28c.2
    text: |-
      De bevoegdheid tot het opleggen van een boete wegens het feit, bedoeld in het eerste lid, vervalt door verloop van
      één jaar na het einde van het kalenderjaar waarin de opgave, bedoeld in [artikel 28, onderdeel f][ref1], had moeten
      worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel28
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel28c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '28'
        hoofdstuk: IV
  - number: '29.1'
    text: |-
      De werknemer is gehouden volgens bij ministeriële regeling te stellen regels aan de inhoudingsplichtige opgave te
      verstrekken van gegevens waarvan de kennisneming voor de heffing van de belasting van belang kan zijn en, ingeval
      de werknemer loon uit tegenwoordige dienstbetrekking geniet, een op hem betrekking hebbend document als bedoeld
      in [artikel 1, eerste lid, onder 1º tot en met 3º, van de Wet op de identificatieplicht][ref1] ter inzage te
      verstrekken en een afschrift daarvan in de loonadministratie van de inhoudingsplichtige te laten opnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '29.2'
    text: |-
      De werknemer is echter niet gehouden opgave te verstrekken van gegevens met betrekking tot de heffingskorting.
      Indien de werknemer deze gegevens niet verstrekt, wordt met de heffingskorting geen rekening gehouden.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel29
  - number: '29.3'
    text: |-
      Tot de in het eerste lid en de in [artikel 28, onderdelen a en d][ref1], bedoelde gegevens wordt mede gerekend het
      sociaal-fiscaalnummer van de werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel28
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '28'
        hoofdstuk: IV
  - number: '29.4'
    text: |-
      Opgave van naam, adres en woonplaats van de werknemer alsmede van de overige in het eerste lid en in artikel
      28, onderdeel *a*, bedoelde gegevens geschiedt door middel van de door de inspecteur uitgereikte of toegezonden
      loonbelastingverklaring.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel29
  - number: '29.5'
    text: |-
      Met betrekking tot de verplichtingen, bedoeld in [de artikelen 28][ref1] en [29][ref2], blijven de
      [artikelen 47b, tweede lid][ref3], en [52a van de Algemene wet inzake rijksbelastingen][ref4] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel47b
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel52a
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '28'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '29'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0002320
        artikel: 47b
      - id: ref4
        bwb_id: BWBR0002320
        artikel: 52a
  - number: '30.1'
    text: |-
      Ieder is gehouden aan de inspecteur ter vaststelling van zijn identiteit indien zulks voor de
      heffing van de loonbelasting van belang kan zijn, desgevraagd terstond een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1] ter inzage te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '30.2'
    text: |-
      Voor een weigering om te voldoen aan de in het eerste lid omschreven verplichting kan niemand zich met vrucht
      beroepen op de omstandigheden dat hij uit enigerlei hoofde tot geheimhouding verplicht is, zelfs niet indien deze
      hem bij een wettelijke bepaling is opgelegd.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel30
  - number: '31.1'
    text: 'Eindheffingsbestanddelen zijn:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel31
  - number: 31.1.a
    text: |-
      bestanddelen van het loon waarover de verschuldigde belasting niet is betaald, in verband waarmee aan de
      inhoudingsplichtige een naheffingsaanslag wordt opgelegd, behoudens:
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel31
  - number: 31.1.a.1°
    text: |-
      voor zover de inhoudingsplichtige verzoekt, onder verstrekking van de daartoe noodzakelijke gegevens, dat loon niet
      als eindheffingsbestanddeel aan te merken;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel31
  - number: 31.1.a.2°
    text: |-
      voor zover de inspecteur bij voor bezwaar vatbare beschikking besluit, mede gelet op het aantal werknemers waarop
      de naheffingsaanslag betrekking heeft, dat loon niet als eindheffingsbestanddeel aan te merken omdat het wel
      toepassen daarvan zou kunnen leiden tot een zodanig grote afwijking van het belastbare inkomen in de zin van de
      inkomstenbelasting van een of meer werknemers dat voor hen aanzienlijke voordelen zouden kunnen ontstaan in het
      kader van de heffing van die belasting, van andere belastingen of in het kader van andere wettelijke regelingen;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel31
  - number: 31.1.b
    text: |-
      bij voor bezwaar vatbare beschikking door de inspecteur aangewezen bestanddelen van het loon met betrekking
      waartoe in verband met tijdelijke knelpunten van ernstige aard in redelijkheid niet kan worden gevergd dat
      de[ hoofdstukken I tot en met IV][ref1] ten volle worden toegepast;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#HoofdstukI
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002471
        hoofdstuk: I
  - number: 31.1.c
    text: |-
      bij ministeriële regeling aan te wijzen uitkeringen van publiekrechtelijke aard die buiten aanmerking worden
      gelaten in het kader van de heffing van andere belastingen of in het kader van andere wettelijke regelingen;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel31
  - number: 31.1.d
    text: |-
      bij ministeriële regeling aan te wijzen loon dat bezwaarlijk kan worden geïndividualiseerd, behoudens ingeval de
      inhoudingsplichtige verzoekt dat loon niet als eindheffingsbestanddeel aan te merken;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel31
  - number: 31.1.e
    text: 'loon met een bestemmingskarakter, zijnde:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel31
  - number: 31.1.e.1°
    text: |-
      loon ter zake van een voor privé-doeleinden ter beschikking gestelde bestelauto als bedoeld in
      [artikel 3 van de Wet op de belasting van personenauto’s en motorrijwielen 1992][ref1], indien in verband met de
      aard van het werk die bestelauto doorlopend afwisselend gebruikt wordt door twee of meer werknemers en in verband
      daarmee bezwaarlijk is vast te stellen of en aan wie die bestelauto voor privé-doeleinden ter beschikking is
      gesteld. In afwijking in zoverre van het overigens bij of krachtens deze wet bepaalde, bedraagt de verschuldigde
      belasting over dit loon op jaarbasis per bestelauto € 300. Bij ministeriële regeling kunnen nadere regels worden
      gesteld met betrekking tot dit loon;


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel3
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '3'
  - number: 31.1.e.2°
    text: overig bij ministeriële regeling aan te wijzen loon;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel31
  - number: 31.1.f
    text: |-
      loon dat in een kalenderjaar in geblokkeerde vorm wordt gespaard ingevolge een spaarloonregeling, ingeval de
      werknemer reeds sedert de eerste dag van het kalenderjaar in dienstbetrekking staat tot de inhoudingsplichtige
      en deze ten aanzien van hem reeds sedert die dag bij de inhouding van loonbelasting de algemene heffingskorting
      toepast, tot ten hoogste € 613 per kalenderjaar;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel31
  - number: 31.1.g
    text: |-
      eenmaal per jaar een geschenk in natura ter gelegenheid van een algemeen erkende feestdag of het Sint-
      Nicolaasfeest, voor zover de waarde in het economische verkeer daarvan niet meer bedraagt dan € 35;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel31
  - number: 31.1.h
    text: |-
      niet tot de hiervoren opgenomen bestanddelen van het loon behorende vergoedingen of verstrekkingen voorzover
      deze niet meer belopen dan een bij ministeriële regeling te bepalen bedrag per maand, behoudens ingeval de
      inhoudingsplichtige verzoekt dat loon niet als eindheffingsbestanddeel aan te merken.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel31
  - number: '31.2'
    text: 'Met betrekking tot eindheffingsbestanddelen wordt het bedrag van de verschuldigde belasting bepaald:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel31
  - number: 31.2.a
    text: 'aan de hand van het tabeltarief met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel31
  - number: 31.2.a.1°
    text: aan naheffing onderworpen eindheffingsbestanddelen als bedoeld in het eerste lid, onderdeel a;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel31
  - number: 31.2.a.2°
    text: eindheffingsbestanddelen bij tijdelijke knelpunten van ernstige aard als bedoeld in het eerste lid, onderdeel b;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel31
  - number: 31.2.a.3°
    text: aangewezen uitkeringen van publiekrechtelijke aard als bedoeld in het eerste lid, onderdeel c;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel31
  - number: 31.2.a.4°
    text: |-
      aangewezen eindheffingsbestanddelen als bedoeld in het eerste lid, onderdeel d, voor zover, te bepalen bij
      ministeriële regeling, de verwerving van het loon niet het gebruik of verbruik daarvan meebrengt;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel31
  - number: 31.2.a.5°
    text: eindheffingsbestanddelen als bedoeld in het eerste lid, onderdeel h;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel31
  - number: 31.2.b
    text: 'aan de hand van het enkelvoudige tarief met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel31
  - number: 31.2.b.1°
    text: |-
      aangewezen niet in geld genoten eindheffingsbestanddelen als bedoeld in het eerste lid, onderdeel d, andere dan
      bedoeld in onderdeel a, onder 4°;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel31
  - number: 31.2.b.2°
    text: |-
      aangewezen eindheffingsbestanddelen met een bestemmingskarakter als bedoeld in het eerste lid, onderdeel e, onder
      2°;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel31
  - number: 31.2.c
    text: 'naar een tarief van:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel31
  - number: 31.2.c.1°
    text: 25 percent, met betrekking tot spaarloon als bedoeld in eerste lid, onderdeel f;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel31
  - number: 31.2.c.2°
    text: 15 percent, met betrekking tot geschenken in natura als bedoeld in het eerste lid, onderdeel g.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel31
  - number: '31.3'
    text: |-
      Ingeval het tabeltarief van toepassing is wordt het bedrag van de verschuldigde belasting bepaald aan de hand
      van de voor het tijdvak waarin het loon is genoten geldende in [artikel 20a, eerste lid][ref1], opgenomen tabel,
      waarbij wordt aangenomen dat de inhoudingsplichtige de belasting en de bij reguliere betaling van het loon
      verschuldigde inkomensafhankelijke bijdrage, bedoeld in [artikel 41 van de Zorgverzekeringswet][ref2] alsmede de
      daarover verschuldigde premie ingevolge [hoofdstuk 3 van de Wet financiering sociale verzekeringen][ref3] aanstonds
      voor zijn rekening heeft genomen. Voor zover bij naheffing als bedoeld in het tweede lid, onderdeel a, aannemelijk
      is dat de inhoudingsplichtige de belasting en premie pas later voor zijn rekening heeft genomen, wordt in zoverre
      van de eerste volzin afgeweken en wordt het voor de werknemer ontstane voordeel in de eindheffing betrokken naar
      de situatie ten tijde van het voor rekening van de inhoudingsplichtige nemen, doch uiterlijk ten tijde van de
      naheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel20a
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 20a
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '41'
      - id: ref3
        bwb_id: BWBR0017745
        hoofdstuk: '3'
  - number: '31.4'
    text: |-
      Ingeval het enkelvoudige tarief van toepassing is wordt het bedrag van de verschuldigde belasting bepaald aan de
      hand van de voor het tijdvak waarin het loon is genoten geldende in [artikel 20a, eerste lid][ref1], opgenomen
      tabel, waarbij buiten beschouwing wordt gelaten dat de belasting wordt geheven van de inhoudingsplichtige.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel20a
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 20a
        hoofdstuk: III
  - number: '31.5'
    text: |-
      In afwijking in zoverre van [artikel 13, eerste lid][ref1], en onverminderd de toepassing van
      [artikel 13, tweede lid][ref2], wordt voor de toepassing van het eerste lid, onderdeel h, en het tweede lid,
      onderdeel a, onder 5°, de waarde van niet in geld genoten loon gesteld op de waarde die daaraan in het economische
      verkeer kan worden toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel13
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '13'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '13'
        hoofdstuk: II
  - number: '31.6'
    text: |-
      Voor de bepaling van de verschuldigde belasting op de voet van het enkelvoudige tarief wordt, voor
      zover [artikel 13, tweede lid][ref1], geen toepassing heeft gevonden, in afwijking in zoverre van
      [artikel 13, eerste lid][ref2], niet in geld genoten loon in aanmerking genomen naar de waarde welke daaraan in het
      economische verkeer kan worden toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel13
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '13'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '13'
        hoofdstuk: II
  - number: '31.7'
    text: |-
      Voor de bepaling van de verschuldigde belasting op de voet van het tweede lid, onderdeel c, wordt buiten
      beschouwing gelaten dat de belasting wordt geheven van de inhoudingsplichtige.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel31
  - number: '31.8'
    text: |-
      Ingeval loon als bedoeld in het eerste lid, onderdeel f, wordt genoten in de vorm van aandelenoptierechten als
      bedoeld in [artikel 10a, zesde lid][ref1], of in de vorm van aandelen in het kapitaal van de inhoudingsplichtige
      of in dat van een met hem verbonden vennootschap, wordt het bedrag genoemd in bedoeld onderdeel f verhoogd. De
      verhoging bedraagt het in het eerste lid, onderdeel f, genoemde bedrag voor de toepassing van de eerste volzin,
      verminderd met het niet in de vorm van aandelenoptierechten of in de vorm van aandelen in het kapitaal van de
      inhoudingsplichtige of in dat van een met hem verbonden vennootschap, gespaarde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 10a
        hoofdstuk: II
  - number: '31.9'
    text: |-
      Voorzover in hetzelfde loontijdvak of dezelfde loontijdvakken door meer dan één werknemer eindheffingsbestanddelen
      worden genoten kan, mits dat leidt tot een beduidende vereenvoudiging van de vaststelling van de verschuldigde
      belasting, de verschuldigde belasting globaal worden vastgesteld, zodanig dat deze redelijkerwijs overeenkomt met
      de verschuldigde belasting die op de voet van de vorige leden zou zijn bepaald.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel31
  - number: '31.10'
    text: |-
      Ingeval de werknemer in het kalenderjaar binnen een samenhangende groep inhoudingsplichtigen in de zin van
      [artikel 27e][ref1] van inhoudingsplichtige is gewisseld, wordt er voor de toepassing van het eerste lid, onderdeel
      f, geacht geen wisseling van inhoudingsplichtige te hebben plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel27e
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 27e
        hoofdstuk: IV
  - number: '31.11'
    text: |-
      De in het eerste en tweede lid bedoelde ministeriële regelingen worden, voorzover het de premie voor de
      volksverzekeringen betreft, getroffen in overleg met Onze Minister van Sociale Zaken en Werkgelegenheid.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel31
  - number: '32.1'
    text: |-
      Onder spaarloonregeling wordt verstaan een schriftelijke regeling – niet zijnde een pensioenregeling – die voorziet
      in sparen van loon (spaarloon) dat gedurende ten minste vier jaar niet ter beschikking van de werknemer komt,
      tenzij het spaarloon wordt opgenomen ter zake van de verwerving van diens eigen woning als hoofdverblijf, de aankoop
      van effecten, de voldoening van premies voor lijfrenten als bedoeld in de [artikelen 3.124, onderdeel b][ref1]
      en [3.125, eerste lid, onderdelen a en c van de Wet inkomstenbelasting 2001][ref2] en de voldoening van
      premies ingevolge bij ministeriële regeling aan te wijzen overeenkomsten van levensverzekering waarbij een
      kapitaalsuitkering is verzekerd, de door de werknemer vrijwillig betaalde premies ingevolge een pensioenregeling,
      de start van een voor eigen rekening gedreven onderneming, de opname van verlof, de financiering van
      scholingsuitgaven als bedoeld in [artikel 6.27 van de Wet inkomstenbelasting 2001][ref3], de financiering van
      kinderopvang als bedoeld in [artikel 16c, vijfde lid][ref4], of bij beëindiging van diens dienstbetrekking. Ingeval
      het spaarloon door de werknemer is opgenomen bij beëindiging van diens dienstbetrekking, wordt voor elke maand
      gedurende welke het spaarloon voortijdig is opgenomen belasting geheven van de werknemer ter zake van een evenredig
      deel van het spaarloon.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0002471#Artikel16c
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0002471
        artikel: 16c
        hoofdstuk: IIA
  - number: '32.2'
    text: |-
      Om als spaarloonregeling te worden aangemerkt, dient de deelname daaraan open te staan voor ten minste driekwart
      van de werknemers van de inhoudingsplichtige.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel32
  - number: '32.3'
    text: 'Bij of krachtens ministeriële regeling kunnen:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel32
  - number: 32.3.a
    text: |-
      regelingen als spaarloonregeling worden aangewezen indien zij niet geheel voldoen aan de in of krachtens dit
      artikel gestelde vereisten;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel32
  - number: 32.3.b
    text: |-
      regelingen als spaarloonregeling worden uitgesloten indien zij niet dienstbaar zijn aan de bevordering van duurzaam
      bezit van werknemers in voldoend brede kring of bij herhaling niet worden nageleefd, alsmede ingeval ter zake van
      de uitvoering geen administratie wordt gevoerd waaruit duidelijk blijkt dat aan de gestelde vereisten is voldaan;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel32
  - number: 32.3.c
    text: |-
      regelen worden gesteld ter verzekering van het heffen van belasting over uitbetalingen welke in afwijking van de
      spaarloonregeling aan de werknemer worden gedaan.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel32
  - number: '32.4'
    text: Bij ministeriële regeling kunnen nadere regelen worden gesteld met betrekking tot het bepaalde in dit artikel.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel32
  - number: 32a.1
    text: |-
      Voor de toepassing van [artikel 31, derde en vierde lid][ref1], worden bij ministeriële regeling regels
      gesteld voor het bepalen van het op de eindheffingsbestanddelen toe te passen tarief. Daarbij kunnen
      de gevolgen van het passeren van tariefschijfgrenzen en maximum premielonen buiten beschouwing blijven
      en kunnen voorts de noodzakelijke afrondingen en vereenvoudigingen worden toegepast. Indien ingevolge
      [hoofdstuk 3 van de Wet financiering sociale verzekeringen][ref2] premie is verschuldigd waarvan het percentage
      per bedrijfstak verschilt, wordt het percentage in aanmerking genomen dat wordt vastgesteld krachtens
      [artikel 9, vierde lid, van de Algemene Ouderdomswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel9
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '31'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0017745
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0002221
        artikel: '9'
  - number: 32a.2
    text: |-
      Voor gevallen waarin tevens [artikel 27b, eerste lid][ref1], van toepassing is worden in de in het eerste lid
      bedoelde ministeriële regeling, met overeenkomstige toepassing van [artikel 31, derde en vierde lid][ref2], tevens
      regels gesteld volgens welke telkens de belasting en de premie voor de volksverzekeringen in één bedrag dan wel in
      één percentage kunnen worden afgeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel27b
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 27b
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '31'
        hoofdstuk: V
  - number: 32aa.1
    text: |-
      In afwijking in zoverre van het overigens bij of krachtens deze wet bepaalde, wordt een door een
      inhoudingsplichtige gedane en op hem drukkende uitkering ingevolge een regeling voor vervroegde uittreding
      alsmede een door een inhoudingsplichtige voldane en op hem drukkende bijdrage of premie aan een fonds dat of een
      verzekeraar die een zodanige regeling uitvoert, aangemerkt als loon dat als een eindheffingsbestanddeel wordt
      belast naar een tarief van 26%.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel32aa
  - number: 32aa.2
    text: |-
      Een uitkering of een bijdrage of een premie wordt beschouwd te zijn gedaan of voldaan op het tijdstip waarop zij
      betaald of verrekend is, ter beschikking is gesteld of rentedragend is geworden.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel32aa
  - number: 32aa.3
    text: |-
      Een uitkering, een bijdrage of een premie wordt beschouwd niet te drukken op een inhoudingsplichtige voor zover de
      inhoudingsplichtige ter zake bedragen van werknemers heeft ingehouden of van andere inhoudingsplichtigen bijdragen
      of premies voldaan heeft gekregen.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel32aa
  - number: 32aa.4
    text: |-
      Ingeval op enig tijdstip een aanspraak ingevolge een regeling voor vervroegde uittreding niet langer als zodanig
      is aan te merken dan wel wordt afgekocht of vervreemd, wordt op het onmiddellijk daaraan voorafgaande tijdstip de
      aanspraak aangemerkt als loon uit vroegere dienstbetrekking van de werknemer of gewezen werknemer. De waarde van
      de aanspraak wordt gesteld op de waarde in het economische verkeer op het in de eerste volzin genoemde tijdstip,
      met dien verstande dat de waarde ten minste wordt gesteld op het bedrag dat ter zake van de vervreemding of afkoop
      wordt genoten.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel32aa
  - number: 32aa.5
    text: |-
      Ingeval op grond van het vierde lid een aanspraak wordt aangemerkt als loon uit vroegere dienstbetrekking van een
      werknemer of gewezen werknemer, wordt de inhoudingsplichtige die de in dat lid bedoelde regeling voor vervroegde
      uittreding uitvoert voor de toepassing van het eerste lid geacht een uitkering ingevolge een regeling voor
      vervroegde uittreding te hebben gedaan ter grootte van de aldaar bedoelde waarde van die aanspraak, op het tijdstip
      waarop de daar bedoelde aanspraak is aangemerkt als loon uit vroegere dienstbetrekking.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel32aa
  - number: 32aa.6
    text: |-
      Onder een regeling voor vervroegde uittreding wordt verstaan een regeling die of een gedeelte van een
      regeling dat uitsluitend of nagenoeg uitsluitend ten doel heeft voorafgaand aan het ingaan van uitkeringen
      ingevolge een pensioenregeling of de [Algemene Ouderdomswet][ref1] te voorzien in een of meer uitkeringen
      of verstrekkingen ter overbrugging van de periode tot het ingaan van het pensioen of de uitkering ingevolge
      de [Algemene Ouderdomswet][ref2] dan wel tot het aanvullen van uitkeringen ingevolge een pensioenregeling.
      In afwijking in zoverre van de eerste volzin wordt een regeling niet als regeling voor vervroegde uittreding
      aangemerkt, voor zover die regeling een toezegging inhoudt in de zin van het bepaalde bij of krachtens de
      [Pensioen- en spaarfondsenwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0002221
      [ref3]: https://wetten.overheid.nl/BWBR0002089
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel32aa
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0002221
      - id: ref3
        bwb_id: BWBR0002089
  - number: 32aa.7
    text: |-
      Op verzoek van de inhoudingsplichtige beslist de inspecteur bij voor bezwaar vatbare beschikking of een regeling
      een regeling voor vervroegde uittreding is. Het verzoek wordt gedaan voordat de regeling dan wel een wijziging van
      de regeling wordt ingevoerd.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel32aa
  - number: 32aa.8
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld voor de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel32aa
  - number: 32ab.1
    text: |-
      Als eindheffingsbestanddelen als bedoeld in [artikel 31][ref1] worden mede aangemerkt bij ministeriële regeling aan
      te wijzen verstrekkingen aan anderen dan eigen werknemers, waarvoor geen inhoudingsplicht bestaat bij of krachtens
      een ander artikel van deze wet, ingeval de verstrekker schriftelijke mededeling doet aan de ontvanger van het
      toepassing vinden van deze eindheffing en aannemelijk kan maken wie de ontvanger is van de verstrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel32ab
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '31'
        hoofdstuk: V
  - number: 32ab.2
    text: |-
      Degene die een mededeling heeft gedaan dat hij eindheffing toepast, wordt, zo hij dat nog niet is, aangemerkt als
      inhoudingsplichtige.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel32ab
  - number: 32ab.3
    text: |-
      Met betrekking tot een eindheffingsbestanddeel als bedoeld in het eerste lid wordt het bedrag van de verschuldigde
      belasting, bedoeld in [artikel 31, tweede lid][ref1], bepaald naar een tarief van:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel32ab
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '31'
        hoofdstuk: V
  - number: 32ab.3.1°
    text: |-
      45 percent, met betrekking tot een verstrekking waarvan de waarde in het economische verkeer niet meer bedraagt
      dan € 136;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel32ab
  - number: 32ab.3.2°
    text: |-
      75 percent, met betrekking tot een verstrekking waarvan de waarde in het economische verkeer meer bedraagt dan
      € 136.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel32ab
  - number: 32b
    text: |-
      Ter bevordering van een goede uitvoering van dit hoofdstuk kunnen bij ministeriële regeling nadere, zonodig
      afwijkende regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel32b
  - number: '33.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor bepaalde groepen van werknemers nadere, zo nodig
      afwijkende, regelen worden gesteld inzake de heffing van de belasting, alsmede andere in het kader der wet passende
      nadere regelen worden gegeven ter aanvulling van in de wet geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel33
  - number: '33.2'
    text: 'Bij ministeriële regeling kunnen aanvullende regels worden gesteld betreffende:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel33
  - number: 33.2.a
    text: |-
      de heffing van de belasting ingeval loon van meer dan één inhoudingsplichtige of mede loon van een derde, dan wel
      over enig tijdvak meer dan één beloning wordt genoten;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel33
  - number: 33.2.b
    text: inhouding van geschatte bedragen, gevolgd door periodieke afrekening.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel33
  - number: '34'
    text: |-
      Ter vergemakkelijking van de heffing van de inkomstenbelasting kunnen bij algemene maatregel van bestuur regels
      worden gesteld ingevolge welke de loonbelasting mede wordt geheven van natuurlijke personen die:
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel34
  - number: 34.a
    text: termijnen van lijfrente of andere periodieke uitkeringen of verstrekkingen genieten;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel34
  - number: 34.b
    text: uitkeringen genieten ter vervanging van gederfde of te derven periodieke uitkeringen of verstrekkingen.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel34
  - number: '35.1'
    text: Ten aanzien van een artiest of beroepssporter wordt de belasting geheven naar de gage.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35
  - number: '35.2'
    text: |-
      Gage is al hetgeen de artiest of beroepssporter als zodanig geniet. Tot de gage behoren kostenvergoedingen alsmede
      aanspraken om na verloop van tijd of onder een voorwaarde een of meer uitkeringen of verstrekkingen te ontvangen.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35
  - number: '35.3'
    text: 'Tot de gage behoren niet:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35
  - number: 35.3.a
    text: |-
      vergoedingen en verstrekkingen ter zake van consumpties en maaltijden die ingevolge
      [artikel 11, eerste lid, onderdeel a of onderdeel b][ref1], niet tot het loon zouden hebben behoord;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '11'
        hoofdstuk: II
  - number: 35.3.b
    text: |-
      vergoedingen die strekken tot bestrijding van reis- en verblijfkosten – andere dan kosten van eigen vervoer –
      ter behoorlijke vervulling van het optreden dan wel de sportbeoefening, mits de artiest of beroepssporter de
      bewijsstukken overhandigt aan de inhoudingsplichtige en deze de bewijsstukken administreert en voor controle
      beschikbaar houdt;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35
  - number: 35.3.c
    text: |-
      verstrekkingen die strekken tot voorkoming van reis- en verblijfkosten ter behoorlijke vervulling van het optreden
      dan wel de sportbeoefening;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35
  - number: 35.3.d
    text: |-
      aanspraken ingevolge de [Ziektewet][ref1], de [Wet arbeid en zorg][ref2], de
      [Wet werk en inkomen naar arbeidsvermogen][ref3], de [Wet op de arbeidsongeschiktheidsverzekering][ref4] en de
      [Werkloosheidswet][ref5];


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0013008
      [ref3]: https://wetten.overheid.nl/BWBR0019057
      [ref4]: https://wetten.overheid.nl/BWBR0002524
      [ref5]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0013008
      - id: ref3
        bwb_id: BWBR0019057
      - id: ref4
        bwb_id: BWBR0002524
      - id: ref5
        bwb_id: BWBR0004045
  - number: 35.3.e
    text: aanspraken, die naar aard en strekking overeenkomen met aanspraken als bedoeld in onderdeel d;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35
  - number: 35.3.f
    text: aanspraken op uitkeringen wegens overlijden of invaliditeit ten gevolge van een ongeval en
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35
  - number: 35.3.g
    text: |-
      bedragen die worden ingehouden als premie ingevolge [hoofdstuk 3 van de Wet financiering sociale verzekeringen][ref1]
      en als bijdrage voor aanspraken die naar aard en strekking overeenkomen met aanspraken bedoeld in onderdeel e,
      alsmede bijdrage voor aanspraken, bedoeld in onderdeel f.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0017745
        hoofdstuk: '3'
  - number: '35.4'
    text: |-
      Tot de gage behoort mede niet het aan de artiest of beroepssporter toe te rekenen deel van hetgeen blijkens
      een beschikking van de inspecteur als een niet tot de gage behorende vergoeding kan worden aangemerkt
      (kostenvergoedingsbeschikking). De kostenvergoedingsbeschikking wordt op verzoek door de inspecteur verstrekt
      en is vatbaar voor bezwaar. Het verzoek wordt voor het optreden of de sportbeoefening gedaan door de artiest, de
      beroepssporter of de inhoudingsplichtige, dan wel uiterlijk een maand na het optreden of de sportbeoefening door
      de inhoudingsplichtige. Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de
      kostenvergoedingsbeschikking.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35
  - number: '35.5'
    text: |-
      Niet in geld genoten gage wordt in aanmerking genomen naar de waarde die daaraan in het economische verkeer kan
      worden toegekend.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35
  - number: '35.6'
    text: 'Gage wordt beschouwd te zijn genoten op het tijdstip:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35
  - number: 35.6.a
    text: |-
      waarop zij betaald of verrekend wordt, ter beschikking van de artiest of beroepssporter wordt gesteld of
      rentedragend wordt;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35
  - number: 35.6.b
    text: waarop zij vorderbaar en tevens inbaar wordt, of
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35
  - number: 35.6.c
    text: |-
      indien dat later is dan de tijdstippen, bedoeld in de onderdelen a en b en de inhoudingsplichtige een
      kostenvergoedingsbeschikking heeft aangevraagd: uiterlijk een maand na het optreden of de sportbeoefening.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35
  - number: 35a.1
    text: |-
      De verschuldigde belasting bedraagt een percentage, gelijk aan het gecombineerde heffingspercentage, bedoeld in
      [artikel 21, onderdeel b][ref1], van de gage. In afwijking van de vorige volzin bedraagt de belasting ten aanzien
      van de niet in Nederland wonende artiest of beroepssporter 20 percent van de gage.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel21
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '21'
        hoofdstuk: III
  - number: 35a.2
    text: |-
      Ten aanzien van niet in Nederland wonende beroepssporters kan bij algemene maatregel van bestuur, zo nodig
      onder voorwaarden, ten behoeve van uniforme heffing bij grensoverschrijdende evenementen het in het eerste lid
      genoemde percentage van 20 tijdelijk worden verlaagd, doch niet verder dan tot 15 percent. Een krachtens de eerste
      volzin vastgestelde algemene maatregel van bestuur wordt aan de beide kamers der Staten-Generaal overlegd. Hij
      treedt in werking op een tijdstip dat nadat vier weken na de overlegging zijn verstreken bij koninklijk besluit
      wordt vastgelegd, tenzij binnen die termijn door of namens een der kamers of door ten minste een vijfde van het
      grondwettelijk aantal leden van een der kamers de wens te kennen wordt gegeven dat het onderwerp van de algemene
      maatregel van bestuur bij wet wordt geregeld. In dat geval wordt een daartoe strekkend voorstel van wet zo spoedig
      mogelijk ingediend. Indien het voorstel van wet wordt ingetrokken of indien een van de beide Kamers van de Staten-
      Generaal besluit het voorstel niet aan te nemen, wordt de algemene maatregel van bestuur ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35a
  - number: 35a.3
    text: |-
      In afwijking van het eerste lid bedraagt de verschuldigde belasting 52 percent van de gage ingeval
      de artiest of beroepssporter zijn naam, adres of woonplaats niet aan de inhoudingsplichtige heeft
      verstrekt, dan wel zijn identiteit niet is vastgesteld en opgenomen in de loonadministratie overeenkomstig
      [artikel 35e, eerste lid, onderdeel f][ref1], alsmede ingeval de artiest of beroepssporter ter zake onjuiste
      gegevens heeft verstrekt en de inhoudingsplichtige dit weet of redelijkerwijs moet weten.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel35e
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 35e
        hoofdstuk: VII
  - number: 35b.1
    text: De belasting wordt geheven door inhouding op de gage.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35b
  - number: 35b.2
    text: |-
      Voorzover het optreden of de sportbeoefening is gebaseerd op een andere grond dan een overeenkomst van korte
      duur als bedoeld in [artikel 5a][ref1], wordt de belasting geheven bij wijze van inhouding door de artiest of de
      beroepssporter als ware hij de inhoudingsplichtige voor de door hem genoten gage. In dat geval wordt de artiest of
      beroepssporter beschouwd als inhoudingsplichtige.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel5a
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 5a
        hoofdstuk: I
  - number: 35b.3
    text: De inhoudingsplichtige is verplicht de belasting in te houden op het tijdstip waarop de gage wordt genoten.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35b
  - number: 35b.4
    text: De inhoudingsplichtige is verplicht de ingehouden belasting op aangifte af te dragen.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35b
  - number: 35b.5
    text: |-
      De inhoudingsplichtige die zekerheid wenst omtrent de vraag of op grond van een verdrag ter voorkoming van dubbele
      belasting of op grond van enige andere regel van interregionaal of internationaal recht geen loonbelasting behoort
      te worden ingehouden, kan een verzoek indienen bij de inspecteur. De inspecteur beslist op het verzoek bij voor
      bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35b
  - number: 35c
    text: |-
      Ten aanzien van een niet in Nederland wonende artiest of beroepssporter vindt geen heffing plaats indien het
      optreden of de sportbeoefening:
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35c
  - number: 35c.a
    text: |-
      is gebaseerd op een andere grond dan een overeenkomst van korte duur als bedoeld in [artikel 5a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel5a
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 5a
        hoofdstuk: I
  - number: 35c.b
    text: plaatsvindt op basis van wederkerigheid;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35c
  - number: 35c.c
    text: |-
      ter zake van het optreden of de sportbeoefening op basis van die wederkerigheid in het woonland van de artiest of
      beroepssporter overeenkomstige belastingheffing van de in Nederland wonende artiest of beroepssporter dan wel het
      in Nederland gevestigde gezelschap van artiesten of beroepssporters, evenmin plaatsvindt, en
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35c
  - number: 35c.d
    text: |-
      in relatie met het woonland van de artiest of beroepssporter geen regeling ter voorkoming van dubbele belasting van
      toepassing is dat voor de in Nederland wonende artiest of beroepssporter voorziet in vrijstelling van Nederlandse
      belasting voor voordelen uit persoonlijke werkzaamheden als zodanig in dat andere land.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35c
  - number: 35d.1
    text: |-
      De artiest of beroepssporter is gehouden volgens bij ministeriële regeling te stellen regels aan de
      inhoudingsplichtige:
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35d
  - number: 35d.1.a
    text: opgave te doen van gegevens waarvan de kennisneming voor de heffing van de belasting van belang kan zijn;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35d
  - number: 35d.1.b
    text: |-
      inzage te verlenen van een op hem betrekking hebbend document als bedoeld in
      [artikel 1, eerste lid, onder 1º tot en met 3º, van de Wet op de identificatieplicht][ref1] om een afschrift
      daarvan in de loonadministratie van de inhoudingsplichtige te laten opnemen;


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35d
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 35d.1.c
    text: '- indien hij in Nederland woont – opgave te doen van zijn sociaal-fiscaalnummer.'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35d
  - number: 35d.2
    text: |-
      Opgave van naam, adres, woonplaats en – ingeval hij niet in Nederland woont – woonland en geboortedatum van de
      artiest of beroepssporter alsmede van de overige in [dit artikel][ref1] bedoelde gegevens geschiedt door middel van
      de door de inspecteur verstrekte gageverklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel35d
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35d
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 35d
        hoofdstuk: VII
  - number: 35d.3
    text: |-
      Met betrekking tot de in [dit artikel][ref1] bedoelde verplichtingen is
      [artikel 47b, tweede lid, van de Algemene wet inzake rijksbelastingen][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel35d
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel47b
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35d
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 35d
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 47b
  - number: 35e.1
    text: 'De inhoudingsplichtige is gehouden volgens bij ministeriële regeling te stellen regels:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35e
  - number: 35e.1.a
    text: |-
      van de artiest of beroepssporter opgave te verlangen van gegevens waarvan de kennisneming voor de heffing van de
      belasting van belang kan zijn;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35e
  - number: 35e.1.b
    text: van de in Nederland wonende artiest of beroepssporter opgave te verlangen van zijn sociaal-fiscaalnummer;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35e
  - number: 35e.1.c
    text: |-
      een loonadministratie te voeren en daarbij de gegevens te administreren met betrekking tot de gage en met
      betrekking tot vergoedingen en verstrekkingen die niet tot de gage behoren;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35e
  - number: 35e.1.d
    text: |-
      aan de in Nederland wonende artiest of beroepssporter, alsmede, op diens verzoek, aan de niet in Nederland wonende
      artiest of beroepssporter, opgave te doen van de in een kalenderjaar genoten gage, van de ingehouden belasting en
      van andere gegevens die van belang kunnen zijn voor de heffing van de inkomstenbelasting;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35e
  - number: 35e.1.e
    text: |-
      de identiteit van de artiest of beroepssporter vast te stellen aan de hand van een document als bedoeld in
      [artikel 1, eerste lid, onder 1º tot en met 3º, van de Wet op de identificatieplicht][ref1], alsmede de aard, het
      nummer en een afschrift daarvan in de loonadministratie op te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35e
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 35e.2
    text: |-
      Met betrekking tot de in [dit artikel][ref1] bedoelde verplichtingen is
      [artikel 52a van de Algemene wet inzake rijksbelastingen][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel35e
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel52a
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35e
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 35e
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 52a
  - number: 35f
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor bepaalde groepen artiesten of beroepssporters nadere,
      zo nodig afwijkende, regelen worden gesteld inzake de heffing van de belasting, alsmede andere in het kader der wet
      passende nadere regelen worden gegeven ter aanvulling van in de wet geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35f
  - number: 35g.1
    text: Ten aanzien van een buitenlands gezelschap wordt de belasting geheven naar de gage.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35g
  - number: 35g.2
    text: |-
      Gage is al hetgeen het buitenlandse gezelschap ontvangt ter zake van het optreden of de sportbeoefening in
      Nederland. Tot de gage behoren kostenvergoedingen alsmede aanspraken om na verloop van tijd of onder een voorwaarde
      een of meer uitkeringen of verstrekkingen te ontvangen.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35g
  - number: 35g.3
    text: 'Tot de gage behoren niet:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35g
  - number: 35g.3.a
    text: |-
      vergoedingen en verstrekkingen ter zake van consumpties en maaltijden die ingevolge
      [artikel 11, eerste lid, onderdeel a of onderdeel b][ref1], niet tot het loon zouden hebben behoord;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35g
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '11'
        hoofdstuk: II
  - number: 35g.3.b
    text: |-
      vergoedingen die strekken tot bestrijding van reis- en verblijfkosten – andere dan kosten van eigen vervoer –
      ter behoorlijke vervulling van het optreden of de sportbeoefening, mits het gezelschap de bewijsstukken aan de
      inhoudingsplichtige doet toekomen en deze de bewijsstukken administreert en voor controle beschikbaar houdt;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35g
  - number: 35g.3.c
    text: |-
      verstrekkingen die strekken tot voorkoming van reis- en verblijfkosten ter behoorlijke vervulling van het optreden
      dan wel de sportbeoefening;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35g
  - number: 35g.3.d
    text: |-
      aanspraken ingevolge de [Ziektewet][ref1], de [Wet arbeid en zorg][ref2], de
      [Wet werk en inkomen naar arbeidsvermogen][ref3], de [Wet op de arbeidsongeschiktheidsverzekering][ref4] en de
      [Werkloosheidswet][ref5];


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0013008
      [ref3]: https://wetten.overheid.nl/BWBR0019057
      [ref4]: https://wetten.overheid.nl/BWBR0002524
      [ref5]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35g
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0013008
      - id: ref3
        bwb_id: BWBR0019057
      - id: ref4
        bwb_id: BWBR0002524
      - id: ref5
        bwb_id: BWBR0004045
  - number: 35g.3.e
    text: aanspraken, die naar aard en strekking overeenkomen met aanspraken als bedoeld in onderdeel d;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35g
  - number: 35g.3.f
    text: aanspraken op uitkeringen wegens overlijden of invaliditeit ten gevolge van een ongeval en
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35g
  - number: 35g.3.g
    text: |-
      bedragen die worden ingehouden als premie ingevolge [hoofdstuk 3 van de Wet financiering sociale verzekeringen][ref1]
      en als bijdrage voor aanspraken die naar aard en strekking overeenkomen met aanspraken bedoeld in onderdeel e,
      alsmede bijdrage voor aanspraken, bedoeld in onderdeel f.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35g
    references:
      - id: ref1
        bwb_id: BWBR0017745
        hoofdstuk: '3'
  - number: 35g.4
    text: |-
      Tot de gage behoort mede niet hetgeen blijkens een beschikking van de inspecteur als een niet tot de gage
      behorende vergoeding kan worden aangemerkt (kostenvergoedingsbeschikking). De kostenvergoedingsbeschikking wordt
      op verzoek door de inspecteur verstrekt en is vatbaar voor bezwaar. Het verzoek wordt voor het optreden of de
      sportbeoefening gedaan door het gezelschap of de inhoudingsplichtige, dan wel uiterlijk een maand na het optreden
      of de sportbeoefening door de inhoudingsplichtige. Bij algemene maatregel van bestuur worden nadere regels gesteld
      met betrekking tot de kostenvergoedingsbeschikking.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35g
  - number: 35g.5
    text: |-
      Niet in geld ontvangen gage wordt in aanmerking genomen naar de waarde die daaraan in het economische verkeer kan
      worden toegekend.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35g
  - number: 35g.6
    text: 'Gage wordt beschouwd te zijn ontvangen op het tijdstip:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35g
  - number: 35g.6.a
    text: waarop zij betaald of verrekend wordt, ter beschikking van het gezelschap wordt gesteld of rentedragend wordt;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35g
  - number: 35g.6.b
    text: waarop zij vorderbaar en tevens inbaar wordt, of
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35g
  - number: 35g.6.c
    text: |-
      indien dat later is dan de tijdstippen, bedoeld in de onderdelen a en b en de inhoudingsplichtige een
      kostenvergoedingsbeschikking heeft aangevraagd: uiterlijk een maand na het optreden of de sportbeoefening.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35g
  - number: 35h.1
    text: De verschuldigde belasting bedraagt 20 percent van de gage.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35h
  - number: 35h.2
    text: |-
      Ten aanzien van buitenlandse gezelschappen kan bij algemene maatregel van bestuur, zo nodig onder voorwaarden,
      ten behoeve van uniforme heffing bij grensoverschrijdende evenementen het in het eerste lid genoemde percentage
      van 20 tijdelijk worden verlaagd, doch niet verder dan tot 15 percent. Een krachtens de eerste volzin vastgestelde
      algemene maatregel van bestuur wordt aan de beide kamers der Staten-Generaal overlegd. Hij treedt in werking op
      een tijdstip dat nadat vier weken na de overlegging zijn verstreken bij koninklijk besluit wordt vastgelegd, tenzij
      binnen die termijn door of namens een der kamers of door ten minste een vijfde van het grondwettelijk aantal leden
      van een der kamers de wens te kennen wordt gegeven dat het onderwerp van de algemene maatregel van bestuur bij wet
      wordt geregeld. In dat geval wordt een daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend. Indien het
      voorstel van wet wordt ingetrokken of indien een van de beide Kamers van de Staten-Generaal besluit het voorstel
      niet aan te nemen, wordt de algemene maatregel van bestuur ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35h
  - number: 35h.3
    text: 'In afwijking van het eerste lid bedraagt de verschuldigde belasting 52 percent van de gage:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35h
  - number: 35h.3.a
    text: |-
      indien aan de inhoudingsplichtige de naam, het adres, de woonplaats, het woonland en de geboortedatum van de leider
      of vertegenwoordiger, alsmede de namen van de leden van het gezelschap niet zijn verstrekt;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35h
  - number: 35h.3.b
    text: |-
      indien ten aanzien van het merendeel van de leden geen afschrift van een document als bedoeld in
      [artikel 1, eerste lid, onder 1º tot en met 3º, van de Wet op de identificatieplicht][ref1] aan de
      inhoudingsplichtige is verstrekt of de identiteit niet is vastgesteld en opgenomen in de loonadministratie van de
      inhoudingsplichtige overeenkomstig [artikel 35m, onderdeel d][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel35m
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35h
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 35m
        hoofdstuk: VIIA
  - number: 35h.3.c
    text: |-
      indien het gezelschap terzake onjuiste gegevens heeft verstrekt en de inhoudingsplichtige dit weet of
      redelijkerwijs moet weten.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35h
  - number: 35i.1
    text: De belasting wordt geheven door inhouding op de gage.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35i
  - number: 35i.2
    text: |-
      Voorzover het optreden of de sportbeoefening is gebaseerd op een andere grond dan een overeenkomst van korte
      duur als bedoeld in [artikel 5b][ref1], wordt de belasting geheven bij wijze van inhouding door het buitenlandse
      gezelschap als ware het de inhoudingsplichtige voor de door hem ontvangen gage. In dat geval wordt het gezelschap
      beschouwd als inhoudingsplichtige.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel5b
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35i
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 5b
        hoofdstuk: I
  - number: 35i.3
    text: De inhoudingsplichtige is verplicht de belasting in te houden op het tijdstip waarop de gage wordt ontvangen.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35i
  - number: 35i.4
    text: De inhoudingsplichtige is verplicht de ingehouden belasting op aangifte af te dragen.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35i
  - number: 35i.5
    text: |-
      De inhoudingsplichtige die zekerheid wenst omtrent de vraag of op grond van een verdrag ter voorkoming van dubbele
      belasting of op grond van enige andere regel van interregionaal of internationaal recht geen loonbelasting behoort
      te worden ingehouden, kan een verzoek indienen bij de inspecteur. De inspecteur beslist op het verzoek bij voor
      bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35i
  - number: 35j
    text: 'Ten aanzien van een buitenlands gezelschap vindt geen heffing plaats indien het optreden of de sportbeoefening:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35j
  - number: 35j.a
    text: |-
      is gebaseerd op een andere grond dan een overeenkomst van korte duur als bedoeld in [artikel 5b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel5b
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35j
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 5b
        hoofdstuk: I
  - number: 35j.b
    text: plaatsvindt op basis van wederkerigheid;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35j
  - number: 35j.c
    text: |-
      ter zake van het optreden of de sportbeoefening op basis van die wederkerigheid in het land van vestiging van het
      buitenlandse gezelschap overeenkomstige belastingheffing van de in Nederland wonende artiesten of beroepssporters
      dan wel het in Nederland gevestigde gezelschap van artiesten of beroepssporters, evenmin plaatsvindt, en
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35j
  - number: 35j.d
    text: |-
      in relatie met het land van vestiging van het buitenlands gezelschap geen regeling ter voorkoming van dubbele
      belasting van toepassing is dat voor de in Nederland wonende artiest of beroepssporter voorziet in vrijstelling van
      Nederlandse belasting voor voordelen uit persoonlijke werkzaamheden als zodanig in dat andere land.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35j
  - number: 35k
    text: |-
      De leden van het buitenlandse gezelschap zijn gehouden volgens bij ministeriële regeling te stellen regels aan
      het gezelschap:
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35k
  - number: 35k.a
    text: opgave te doen van gegevens waarvan de kennisneming voor de heffing van de belasting van belang kan zijn;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35k
  - number: 35k.b
    text: |-
      inzage te verlenen van een op hen betrekking hebbend document als bedoeld in
      [artikel 1, eerste lid, onder 1º tot en met 3º, van de Wet op de identificatieplicht][ref1], en een afschrift
      daarvan te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35k
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 35l.1
    text: 'Het buitenlandse gezelschap is gehouden volgens bij ministeriële regeling te stellen regels:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35l
  - number: 35l.1.a
    text: |-
      van de leden van het gezelschap opgave te verlangen van gegevens waarvan de kennisneming voor de heffing van de
      belasting van belang kan zijn;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35l
  - number: 35l.1.b
    text: |-
      de identiteit van de leden vast te stellen aan de hand van een document als bedoeld in
      [artikel 1, eerste lid, onder 1º tot en met 3º, van de Wet op de identificatieplicht][ref1] en een afschrift
      daarvan te verlangen;


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35l
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 35l.1.c
    text: |-
      aan de inhoudingsplichtige opgave te doen van gegevens waarvan de kennisneming voor de heffing van de belasting van
      belang kan zijn;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35l
  - number: 35l.1.d
    text: |-
      aan de inhoudingsplichtige ten aanzien van het merendeel van de leden inzage te verlenen van een document als
      bedoeld in [artikel 1, eerste lid, onder 1º tot en met 3º, van de Wet op de identificatieplicht][ref1] om een
      afschrift daarvan in de loonadministratie van de inhoudingsplichtige te laten opnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35l
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 35l.2
    text: |-
      Opgave van naam, adres, woonplaats, woonland en geboortedatum van de leider of vertegenwoordiger alsmede het aantal
      leden van het gezelschap, en opgave van de overige in [dit artikel][ref1] bedoelde gegevens geschiedt door middel
      van de door de inspecteur verstrekte gageverklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel35l
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35l
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 35l
        hoofdstuk: VIIA
  - number: 35m
    text: 'De inhoudingsplichtige is gehouden volgens bij ministeriële regeling te stellen regels:'
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35m
  - number: 35m.a
    text: |-
      van het buitenlandse gezelschap opgave te verlangen van gegevens waarvan de kennisneming voor de heffing van de
      belasting van belang kan zijn;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35m
  - number: 35m.b
    text: |-
      een loonadministratie te voeren en daarbij de gegevens te administreren met betrekking tot de gage en met
      betrekking tot vergoedingen en verstrekkingen die niet tot de gage behoren;
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35m
  - number: 35m.c
    text: |-
      de identiteit van een zo groot mogelijk deel, doch ten minste het merendeel van de
      leden van het gezelschap vast te stellen aan de hand van een document als bedoeld in
      [artikel 1, eerste lid, onder 1º tot en met 3º, van de Wet op de identificatieplicht][ref1], alsmede de aard, het
      nummer en een afschrift daarvan in de loonadministratie op te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35m
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 35n
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor buitenlandse gezelschappen nadere, zo nodig afwijkende,
      regelen worden gesteld inzake de heffing van de belasting, alsmede andere in het kader der wet passende nadere
      regelen worden gegeven ter aanvulling van in de wet geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel35n
  - number: '36'
    text: |-
      [Artikel 10a][ref1] zoals dat luidde op 31 december 2004 blijft van toepassing op vóór 1 januari 2005
      overeengekomen aandelenoptierechten ter zake waarvan vóór die datum reeds een bedrag als loon is genoten, waarbij
      tevens [artikel 10a, derde lid][ref2], zoals dat luidt op 1 januari 2005, geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 10a
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 10a
        hoofdstuk: II
  - number: 36a.1
    text: |-
      Met betrekking tot op 31 december 2000 bestaande rechten op vakantieverlof en compensatieverlof is
      [artikel 10, derde lid][ref1] en [artikel 11, eerste lid, onderdeel r, onder 1°][ref2], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel11
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '10'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '11'
        hoofdstuk: II
  - number: 36a.2
    text: |-
      De aanspraken die voor 1 januari 2006 zijn opgebouwd ingevolge een regeling voor verlofsparen worden aangemerkt als
      aanspraken opgebouwd ingevolge een levensloopregeling.
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel36a
  - number: 36b
    text: |-
      Met betrekking tot bestaande pensioenaanspraken voor welke op of na 1 januari 1995 een ander lichaam als
      verzekeraar optreedt dan bedoeld in [artikel 18, onderdeel c][ref1], en [artikel 18i, onderdeel c][ref2], zoals dat
      luidde op 31 december 2004, is de in die onderdelen gestelde voorwaarde inzake de verzekeraar niet van toepassing.
      Onder bestaande pensioenaanspraken worden verstaan de op 31 december 1994 bestaande aanspraken welke naar of
      krachtens de tekst van [artikel 11][ref3] zoals dat toen luidde, zijn aan te merken als aanspraken die berusten op
      een pensioenregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel18i
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel11
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '18'
        hoofdstuk: IIB
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 18i
        hoofdstuk: IIB
      - id: ref3
        bwb_id: BWBR0002471
        artikel: '11'
        hoofdstuk: II
  - number: '37'
    text: |-
      Met betrekking tot bestaande aanspraken op periodieke uitkeringen ter vervanging van gederfd of te derven loon
      zijn de in [artikel 11, eerste lid, onderdeel g, onder 1° en 2°][ref1], gestelde voorwaarden niet van toepassing.
      Onder bestaande aanspraken op periodieke uitkeringen ter vervanging van gederfd of te derven loon worden verstaan
      de op 31 december 1994 bestaande aanspraken welke naar of krachtens de tekst van [artikel 11][ref2] zoals dat toen
      luidde, zijn aan te merken als aanspraken op periodieke uitkeringen ter vervanging van gederfd of te derven loon.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel11
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '11'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '11'
        hoofdstuk: II
  - number: '38'
    text: |-
      Op uitkeringen en verstrekkingen ingevolge een op 31 december 1994 bestaande aanspraak die voor 1 januari 1995 tot
      het loon heeft behoord, blijft [artikel 11, eerste lid, onderdeel ][ref1], zoals dat luidde op 31 december 1994,
      van kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '11'
        hoofdstuk: II
  - number: 38b
    text: |-
      Voor bestaande aanspraken ingevolge een pensioenregeling als bedoeld in deze wet blijven de op het moment
      van ontstaan van deze aanspraken in deze wet opgenomen bepalingen die verband houden met deze aanspraken, van
      toepassing. In afwijking in zoverre van de eerste volzin is met betrekking tot de in de eerste volzin bedoelde
      aanspraken [artikel 10, vierde lid][ref1], eveneens van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel10
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel38b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '10'
        hoofdstuk: II
  - number: 38c.1
    text: |-
      Voor een op 31 december 2004 bestaande regeling voor vervroegde uittreding als bedoeld in [artikel 18i][ref1],
      zoals dit artikel op 31 december 2004 luidde, blijven tot en met 31 december 2005 de [artikelen 11][ref2],
      [18g][ref3], [18i][ref4], [19][ref5], [19a][ref6], [19b][ref7], [19c][ref8] en [19d][ref9], zoals die luidden op 31
      december 2004, van toepassing en is [artikel 32aa][ref10] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18i
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel18g
      [ref4]: https://wetten.overheid.nl/BWBR0002471#Artikel18i
