    text: |-
      Voor de toepassing van [artikel 18e, eerste lid, onderdeel b, en vierde lid][ref1], wordt het 40-
      deelnemingsjarenpensioen opgevat met inbegrip van:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18e
