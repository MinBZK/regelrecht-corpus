        artikel: 18a
        hoofdstuk: IIB
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 18a
        hoofdstuk: IIB
  - number: 38e.2
    text: |-
      In afwijking in zoverre van het eerste lid blijft [artikel 18a][ref1], zoals dit artikel luidde op 31 december
      2004, van toepassing voor een werknemer die voor 1 januari 2005 de leeftijd van 55 jaar heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel38e
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18a
        hoofdstuk: IIB
  - number: 38e.3
    text: |-
      In afwijking in zoverre van [artikel 18a][ref1] kan een ouderdomspensioen meer bedragen dan de aldaar opgenomen
      maxima voor zover zulks het gevolg is van de omzetting in ouderdomspensioen van een op 31 december 2005 bestaande
      aanspraak ingevolge een pensioenregeling als bedoeld in [artikel 18a][ref2], zoals dit artikel op 31 december 2004
      luidde, voor zover deze aanspraak is opgebouwd ten behoeve van pensioen in de periode voorafgaand aan de datum
      waarop de deelnemer of gewezen deelnemer de leeftijd van 65 jaar bereikt (vroegpensioen).


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
    url: https://wetten.overheid.nl/BWBR0002471/2006-01-01#Artikel38e
