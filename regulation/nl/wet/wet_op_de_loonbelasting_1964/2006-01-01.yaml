  - number: 38f.1
    text: |-
      Voor een op 31 december 2004 bestaande regeling voor overbruggingspensioen als bedoeld in [artikel 18e][ref1],
      zoals dit artikel op 31 december 2004 luidde, blijven tot en met 31 december 2005 de [artikelen 18][ref2],
