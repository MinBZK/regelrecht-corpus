        artikel: 19d
        hoofdstuk: IIB
      - id: ref10
        bwb_id: BWBR0002471
        artikel: 32aa
        hoofdstuk: V
  - number: 38c.2
    text: |-
      In afwijking in zoverre van het eerste lid blijven de [artikelen 11][ref1], [18g][ref2], [18i][ref3], [19][ref4],
      [19a][ref5], [19b][ref6], [19c][ref7] en [19d][ref8], zoals die luidden op 31 december 2004, van toepassing en is
      [artikel 32aa][ref9] niet van toepassing voor een op 31 december 2004 bestaande regeling voor vervroegde uittreding
      als bedoeld in [artikel 18i][ref10], zoals dit artikel op 31 december 2004 luidde, indien ingevolge die regeling na
      31 december 2005 nog uitsluitend uitkeringen kunnen worden gedaan aan werknemers:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel18g
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel18i
      [ref4]: https://wetten.overheid.nl/BWBR0002471#Artikel19
      [ref5]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
      [ref6]: https://wetten.overheid.nl/BWBR0002471#Artikel19b
      [ref7]: https://wetten.overheid.nl/BWBR0002471#Artikel19c
      [ref8]: https://wetten.overheid.nl/BWBR0002471#Artikel19d
      [ref9]: https://wetten.overheid.nl/BWBR0002471#Artikel32aa
      [ref10]: https://wetten.overheid.nl/BWBR0002471#Artikel18i
