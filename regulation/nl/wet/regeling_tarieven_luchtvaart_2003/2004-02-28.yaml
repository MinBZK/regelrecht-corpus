articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *vast tarief:* hoogte van de vergoeding die niet afhankelijk is van de tijdsbesteding;

      b. *uurtarief:* hoogte van de vergoeding die per uur is besteed aan het behandelen van de aanvraag dan wel aan het
      uitvoeren van andere handelingen, bedoeld in deze regeling.
    url: https://wetten.overheid.nl/BWBR0014508/2004-02-28#Artikel1
  - number: '2'
    text: |-
      1 Buitenlandse reis- en verblijfkosten die verband houden met de in deze regeling genoemde handelingen of
      werkzaamheden van degene die de aanvraag behandelt, worden de aanvrager in rekening gebracht en zijn separaat
      verschuldigd naast de in deze regeling genoemde tarieven. Het [Reisbesluit buitenland][ref1] is bepalend voor de
      hoogte van deze kosten. Binnenlandse reis- en verblijfkosten worden niet separaat in rekening gebracht.

      2 Indien de vliegtijd van een buitenlandse reis mede gebruikt wordt om een controle op de vluchtuitvoering
      uit te voeren in relatie tot de uitvoering van het toezichtsprogramma met betrekking tot een vergunning tot
      vluchtuitvoering (Air Operator Certificate), komt de werktijd besteed aan de vliegreis voor de helft ten laste van
      degene(n) voor wie de reis in beginsel gemaakt wordt, en voor de andere helft ten laste van het bedrijf dat in het
      bezit is van een vergunning tot vluchtuitvoering en de vlucht uitvoert. In alle overige gevallen komt de werktijd
      besteed aan de vliegreis volledig ten laste van de aanvrager.

      3 Reistijden die verband houden met de in deze regeling genoemde handelingen of werkzaamheden - voor zover deze
      op uurbasis worden verricht - worden in rekening gebracht volgens de daarbij behorende tarieven. De in rekening te
      brengen reistijd voor reizen binnen Nederland bedraagt ten hoogste de duur van de werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0006842
    url: https://wetten.overheid.nl/BWBR0014508/2004-02-28#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006842
  - number: '3'
    text: |-
      1 In geval van een vast tarief dient de aanvrager of verzoeker het bedrag binnen 30 kalenderdagen na verzending van
      het betalingsverzoek te voldoen. Een beslissing op een aanvraag waaraan een vast tarief is verbonden wordt genomen,
      nadat gebleken is dat de verschuldigde vergoeding betaald is.

      2 In geval van een uurtarief worden de werkzaamheden periodiek gefactureerd op basis van het werkelijk aantal
      bestede uren. De te betalen vergoeding wordt achteraf vastgesteld door het aantal bestede uren te vermenigvuldigen
      met het genoemde uurtarief. De aanvrager dient elke ontvangen factuur binnen 30 kalenderdagen na verzending van het
      betalingsverzoek te voldoen.

      3 Betaling van de in rekening gebracht vergoedingen geschiedt op de volgende wijze:

      a) voor examens en brevetten: op bankrekeningnummer 19.23.23.741, t.n.v. IVW, Divisie Luchtvaart, Bewijzen van
      Bevoegdheid;

      b) voor luchtvaartbewijzen en Aircraft Maintenance Licences en voor wijzigingen als bedoeld in
      [artikel 4, tweede lid][ref1]: op bankrekeningnummer 19.23.23.768, t.n.v. IVW, Divisie Luchtvaart,
      Luchtvaartbewijzen;

      c) voor alle overige in deze regeling genoemde besluiten: op bankrekeningnummer 19.23.23.733, t.n.v. IVW, Divisie
      Luchtvaart.


      [ref1]: https://wetten.overheid.nl/BWBR0014508#Artikel4
