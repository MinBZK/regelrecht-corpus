      1 Voor de behandeling van een aanvraag voor een erkenning ingevolge
      [artikel 23 van het Besluit luchtwaardigheid][ref1], met uitzondering van aanvragen ingevolge
      [hoofdstuk 7 (erkend zweefvliegtechnicus) van de Regeling erkenningen luchtwaardigheid][ref2], is een uurtarief van
      € 103 verschuldigd voor:

      a. de afgifte van een erkenning;

      b. de wijziging van een erkenning;

      c. de verlenging van een erkenning;

      d. het (periodiek) onderzoeken van het erkende bedrijf met inbegrip van alle activiteiten die samenhangen met de
      verlenging, de wijziging en de instandhouding van de erkenning.

      2 Voor de behandeling van een aanvraag voor de afgifte, verlenging of de wijziging van een erkenning ingevolge
      artikel 2 van de Regeling erkenningen vervoer gevaarlijke stoffen door de lucht is een vast tarief van € 279
      verschuldigd.

      3 Voor de behandeling van een aanvraag voor de afgifte, de verlenging of de wijziging van een erkenning ingevolge
      [hoofdstuk 7 (erkend zweefvliegtechnicus) van de Regeling erkenningen luchtwaardigheid][ref3] is een vast tarief
      van € 103 verschuldigd.

      4 Voor behandeling van een verzoek om certificering van een luchtvaartterrein ingevolge de
      [Regeling certificering luchtvaartterreinen][ref4] is een uurtarief van € 103 verschuldigd voor:

      a. de afgifte van een certificaat;

      b. de wijziging van een certificaat;

      c. de verlenging van een certificaat;

      d. het (periodiek) onderzoeken van de houder van een certificaat met inbegrip van alle activiteiten die samenhangen
      met de verlenging, de wijziging en de instandhouding van een certificaat.


