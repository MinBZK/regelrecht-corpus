      1 Voor de werkzaamheden die verband houden met het certificeren van een luchtvaartuig, onderdelen of
      uitrustingsstukken als bedoeld in [Hoofdstuk III van het Besluit luchtwaardigheid][ref1] is een uurtarief van €
      124 verschuldigd.

      2 Voor de werkzaamheden die verband houden met het wijzigen van een luchtvaartuig, onderdelen of
      uitrustingsstukken als bedoeld in [artikel 14 van de Regeling onderhoud luchtvaartuigen][ref2], alsmede in
      [artikel 7 van de Regeling amateurbouwluchtvaartuigen][ref3] is een vast tarief verschuldigd van € 124.


