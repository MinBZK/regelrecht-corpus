  - number: '20'
    text: |-
      Bij exploitatie van een luchtvaartuig van historische waarde voor niet commerciële doeleinden worden de volgende
      kortingen verleend:

      a. afgifte en verlenging Bewijs van Luchtwaardigheid: 100%;

      b. afgifte Bewijs van Inschrijving: 100%;

      c. luchtwaardigheidsonderzoek/certificaties: 75%;

      d. ontheffingen, Bewijs van Luchtwaardigheid: 100%;

      e. toezicht op erkende bedrijven, eerste erkenning en verlenging: 75%.
    url: https://wetten.overheid.nl/BWBR0014508/2004-02-28#Artikel20
  - number: '21'
    text: |-
      Op de werkzaamheden of de diensten die in het kalenderjaar 2002 zijn verricht is de Regeling tarieven luchtvaart
      2002 van toepassing.
    url: https://wetten.overheid.nl/BWBR0014508/2004-02-28#Artikel21
  - number: '22'
    text: De Regeling tarieven luchtvaart 2002 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0014508/2004-02-28#Artikel22
  - number: '23'
    text: Deze regeling treedt in werking met ingang van 1 januari 2003.
    url: https://wetten.overheid.nl/BWBR0014508/2004-02-28#Artikel23
  - number: '24'
    text: 'Deze regeling wordt aangehaald als: Regeling tarieven luchtvaart 2003.'
