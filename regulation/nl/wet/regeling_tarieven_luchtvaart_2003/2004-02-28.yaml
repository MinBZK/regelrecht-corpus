      1 Voor de behandeling van een aanvraag voor de afgifte van een vergunning tot vluchtuitvoering als bedoeld in
      [artikel 104, tweede lid, van de Regeling Toezicht Luchtvaart][ref1] is voor de controle op de organisatie van de
      operatie en het onderhoud, een uurtarief van € 103 verschuldigd.

      2 Voor de behandeling van een aanvraag voor de afgifte van een vergunning tot vluchtuitvoering (AOC) is een
      uurtarief van € 155 verschuldigd voor:

      a. de goedkeuring van het opleidings- en trainingsprogramma;

      b. de controle op de uitvoering van het opleidings- en trainingsprogramma;

      c. de controle op de uitvoering van de vluchten.

      3 Voor het (periodiek) onderzoeken van de houder van een vergunning tot vluchtuitvoering (AOC) met inbegrip van
      alle activiteiten die samenhangen met de verlenging, de wijziging en de instandhouding van een vergunning tot
      vluchtuitvoering worden de tarieven gehanteerd zoals genoemd in het eerste en het tweede lid


