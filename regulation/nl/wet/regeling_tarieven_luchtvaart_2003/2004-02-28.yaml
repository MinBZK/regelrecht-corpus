      1 Voor de theorie-examens en herexamens van de volgende bewijzen van bevoegdheden en de volgende
      bevoegdverklaringen is een vast tarief van € 93 per vak verschuldigd:

      a. vliegbewijs B3;

      b. vliegbewijs B1;

      c. blindvliegen.

      2 Voor de theorie-examens en herexamens van het vliegbewijs A is een vast tarief van € 62 per vak verschuldigd.

      3 Voor theorie-examens voor de volgende bewijzen van bevoegdheid en de volgende bevoegdverklaring als bedoeld in
      het Examenreglement voor luchtvarenden 2001 is een vast tarief van € 93 per vak verschuldigd:

      a. ATPL;

      b. CPL;

      c. IR.

      4 Voor theorie-examens voor de volgende bewijzen van bevoegdheid als bedoeld in het Examenreglement voor
      luchtvarenden 2001 is een vast tarief van € 62 per vak verschuldigd:

      a. PPL;

      b. RPL(A);

      c. RPL (H);

      d. RPL(FB).

      5 Voor de theorie-examens en herexamens voor de volgende bewijzen van bevoegdheid als bedoeld in de
      [Regeling opleiding en examen bevoegdverklaringen AML en JAR-66 AML][ref1] is een vast tarief van € 52 per module
      verschuldigd:

      a. AML (Aircraft Maintenance Licence);

      b. JAR-66 AML.


