      1 Voor het praktijkexamen van de volgende bewijzen van bevoegdheid en bevoegdverklaringen is een vast tarief van €
      322 verschuldigd:

      a. beperkt vliegbewijs A;

      b. vliegbewijs A;

      c. vliegbewijs B3;

      d. vliegbewijs B3 + bevoegdverklaring blindvliegen;

      e. bevoegdverklaring voor klasse/type vliegtuig;

      f. bewijs van bevoegdheid boordwerktuigkundige;

      g. bevoegdverklaring blindvliegen;

      h. bevoegdverklaring vliegonderricht;

      i. bevoegdverklaring spuitvliegen;

      j. bewijs van gelijkstelling vliegbewijs.

      2 Voor praktijkexamens en proeven van bekwaamheid als bedoeld in het Examenreglement voor luchtvarenden 2001 is
      voor kandidaten die zich een examinator laten toedelen door de Minister van Verkeer en Waterstaat een vast tarief
      van € 322 verschuldigd.

      3 Voor de praktijkexamens geluidsseinen en radiotelefonie is een vast tarief van € 52 per vak verschuldigd.

      4 Voor RT-examens als bedoeld in de Regeling bewijzen van bevoegdheid en bevoegdverklaringen voor luchtvarenden
      2001 is een vast tarief van € 52 per examen verschuldigd.
    url: https://wetten.overheid.nl/BWBR0014508/2004-02-28#Artikel9
  - number: '10'
    text: |-
      1 Voor de behandeling van een aanvraag voor de afgifte van de volgende bewijzen van bevoegdheid als bedoeld in de
      Regeling bewijzen van bevoegdheid en bevoegdverklaringen voor luchtvarenden 2001 is een vast tarief verschuldigd
      van € 247:

      a. ATPL;

      b. CPL;

      c. CFEL.

      2 Voor de behandeling van een aanvraag voor de afgifte van het bewijs van bevoegdheid PPL als bedoeld in de
      Regeling bewijzen van bevoegdheid en bevoegdverklaringen voor luchtvarenden 2001 is een vast tarief van € 176
      verschuldigd.

      3 Voor de behandeling van een aanvraag voor de afgifte van het bewijs van bevoegdheid RPL als bedoeld in de
      Regeling bewijzen van bevoegdheid en bevoegdverklaringen voor luchtvarenden 2001 is een vast tarief van € 141
      verschuldigd.

      4 Voor de vernieuwing van het document waarop bewijzen van bevoegdheid en bevoegdverklaringen voor luchtvarenden
      worden weergegeven als bedoeld in het [Besluit bewijzen van bevoegdheid voor de luchtvaart][ref1] is, als dit niet
      in het kader van de afgifte of verlenging van een bevoegdverklaring geschiedt, een vast tarief verschuldigd van
      € 63.

      5 Voor de werkzaamheden die verband houden met een verzoek tot afgifte van een bewijs van gelijkstelling als
      bedoeld in de [Regeling gelijkstelling buitenlandse bewijzen van bevoegdheid][ref2] is een vast tarief van € 354
      verschuldigd.

      6 Voor de behandeling van een aanvraag voor de afgifte van een

      a. AML (Aircraft Maintenance Licence), of

      b. JAR-66-AML,

      met daarop weergegeven een of meer bijzondere bevoegdverklaringen is een vast tarief van € 103 verschuldigd.

      7 Voor de toevoeging van een of meer bijzondere bevoegdverklaringen aan een AML of een JAR-66-AML is een vast
      tarief van € 103 verschuldigd.

      8 Voor de behandeling van een aanvraag voor de verlenging of de wederafgifte van een AML met daarop weergegeven een
      of meer bijzondere bevoegdverklaringen is een vast tarief van € 103 verschuldigd.

      9 Voor het vernieuwen van de in het zesde lid genoemde documenten om andere redenen dan in het zevende en het
      achtste lid genoemd, is een vast tarief van € 28 verschuldigd.


