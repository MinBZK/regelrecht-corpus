      Voor de behandeling van een aanvraag voor een vergunning tot luchtvervoer ingevolge
      [artikel 16 van de Luchtvaartwet][ref1] is een uurtarief van € 103 verschuldigd voor:

      a. de afgifte van een vergunning,

      b. de wijziging van een vergunning,

      c. de verlenging van een vergunning, of

      d. het (periodiek) onderzoeken van de houder van een vergunning tot luchtvervoer met inbegrip van alle activiteiten
      die samenhangen met de verlenging, de wijziging en de instandhouding van een vergunning tot luchtvervoer.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel16
