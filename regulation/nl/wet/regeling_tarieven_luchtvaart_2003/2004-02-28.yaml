  text: |-
    Gelet op artikel 8.12, vijfde lid, van de Wet luchtvaart, op artikel 159, eerste lid, en artikel 160, tweede lid
    van de Regeling Toezicht Luchtvaart en op de artikelen 8, derde lid, 13, tweede lid, 20, tweede lid, 30, derde
    lid, van het Besluit bewijzen van bevoegdheid voor de luchtvaart en artikel 46, tweede lid, van het Besluit
    luchtwaardigheid;

