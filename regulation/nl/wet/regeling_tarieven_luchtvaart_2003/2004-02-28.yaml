  - number: '18'
    text: |-
      Voor de behandeling van een aanvraag om een terrein structureel in te richten als een
      niet aangewezen luchtvaartterrein en langer te gebruiken dan één jaar als bedoeld in het
      [Besluit inrichting en gebruik niet aangewezen luchtvaartterreinen][ref1] is een uurtarief van € 103 verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0004417
    url: https://wetten.overheid.nl/BWBR0014508/2004-02-28#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004417
  - number: '19'
    text: |-
      1 Voor het behandelen van een aanvraag om ontheffing te verlenen van het verbod als bedoeld in:

      a. [artikel 3.8, eerste lid van de Wet luchtvaart][ref1] om de luchtvaart uit te oefenen met een luchtvaartuig, dat
      niet luchtwaardig is of niet is voorzien van een geldig bewijs van luchtwaardigheid bedraagt het vaste tarief € 46;

      b. [artikel 14, eerste lid van de Luchtvaartwet][ref2] om met een luchtvaartuig van of op een niet als
      luchtvaartterrein aangewezen terrein op te stijgen of te landen of dit terrein tijdelijk in te richten voor het
      opstijgen of landen van luchtvaartuigen, bedraagt het vaste tarief € 279;

      c. [artikel 16d, van de Luchtvaartwet][ref3] om luchtvervoer te mogen uitvoeren zonder vergunning, bedraagt het
      vaste tarief € 279;

      d. [artikel 31, eerste lid van de Luchtvaartwet][ref4] om bouwwerken of roerende zaken op een luchtvaartterrein op
      te richten of te hebben, of om graafwerkzaamheden te verrichten, bedraagt het vaste tarief € 279;

      e. [artikel 33, eerste lid van de Luchtvaartwet][ref5] om een luchtvaartterrein te gebruiken in strijd met de
      bepalingen en voorwaarden zoals deze bij de aanwijzing zijn gesteld, bedraagt het vaste tarief € 279;

      2 Voor het behandelen van een verzoek om toestemming te verlenen voor het houden van een luchtvaartvertoning,
      ingevolge [artikel 17 van de Luchtvaartwet][ref6], bedraagt het vaste tarief € 259.

      3 Voor de behandeling van een aanvraag om een ontheffing van de bij of krachtens
      [titel 6.5 van de Wet luchtvaart][ref7] gegeven regels of een wijziging van zulk een ontheffing als bedoeld in
      [artikel 6.58, eerste respectievelijk zesde lid, van de Wet luchtvaart][ref8] is een vast tarief verschuldigd van
      € 279.

      4 Voor het behandelen van een verzoek om objecten op te richten of te plaatsen waarvoor geen bouwvergunning of
      aanlegvergunning is vereist als bedoeld in [artikel 8.12 van de Wet luchtvaart][ref9], is een vast tarief van €
      279 verschuldigd.


