    text: |-
      1 Overtreding van de algemene maatregel van bestuur, bedoeld in [artikel 9][ref1], voor zover uitdrukkelijk als
      strafbaar feit in de zin van deze wet aangeduid, wordt gestraft met hechtenis van ten hoogste twee maanden of
      geldboete van de tweede categorie.

      2 Dit feit is een overtreding.


