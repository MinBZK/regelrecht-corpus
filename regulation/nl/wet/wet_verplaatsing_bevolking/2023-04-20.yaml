  - number: 2a
    text: |-
      Onze Ministers kunnen verplaatsing van de bevolking gelasten in het belang van haar veiligheid, van de
      instandhouding van het maatschappelijk leven of van de uitoefening van de taak van de krijgsmacht.
    url: https://wetten.overheid.nl/BWBR0002097/2023-04-20#Artikel2a
  - number: 2b
    text: |-
      Onze Commissaris in de provincie of de burgemeester kunnen krachtens een algemene of bijzondere machtiging van Onze
      Ministers in het belang van de veiligheid van de bevolking of van de instandhouding van het maatschappelijk leven
      verplaatsing van bevolking gelasten.
    url: https://wetten.overheid.nl/BWBR0002097/2023-04-20#Artikel2b
  - number: 2c
    text: |-
      Deze wet is tevens van toepassing op volksverplaatsingen op grote schaal, welke niet het gevolg zijn van een last
      tot verplaatsing.
    url: https://wetten.overheid.nl/BWBR0002097/2023-04-20#Artikel2c
  - number: 2d
    text: |-
      Indien [artikel 2a][ref1] of [2b][ref2] wordt toegepast in geval van rampen, alsmede van dreigend gevaar voor het
      ontstaan daarvan, treedt Onze Minister van Binnenlandse Zaken in de bevoegdheden, welke deze wet aan Onze Ministers
      toekent.


      [ref1]: https://wetten.overheid.nl/BWBR0002097#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0002097#Artikel2b
    url: https://wetten.overheid.nl/BWBR0002097/2023-04-20#Artikel2d
    references:
      - id: ref1
        bwb_id: BWBR0002097
        artikel: 2a
      - id: ref2
        bwb_id: BWBR0002097
        artikel: 2b
  - number: 2e
    text: |-
      Bij algemene maatregel van bestuur kunnen voorlopige voorzieningen worden getroffen, welke naar Ons oordeel in
      verband met de verplaatsing van bevolking noodzakelijk zijn. In bedoelde voorzieningen kan van de bevoegdheden die
      in andere wettelijke bepalingen aan andere overheidsorganen zijn toegekend, worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0002097/2023-04-20#Artikel2e
  - number: '3'
    text: |-
      1 Onze Ministers, en indien deze de verplaatsing van bevolking gelasten, Onze Commissaris in de provincie en de
      burgemeester kunnen bepalen, welk gebied voor ontruiming in aanmerking komt, wie verplicht is dit te verlaten en
      wie verplicht is tot achterblijven.

      2 Onze Ministers of de door hen aangewezen autoriteiten bepalen, welk gebied voor opneming van de te verplaatsen
      bevolking in aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0002097/2023-04-20#Artikel3
  - number: '4'
    text: |-
      1 De burgemeester is, voorzover uit deze wet niet het tegendeel blijkt, in zijn gemeente belast met de uitvoering
      van een krachtens [artikel 2a][ref1] of [artikel 2b][ref2] gelaste verplaatsing van bevolking.

      2 Indien het de ontruiming en de afvoer betreft kunnen Onze Ministers en indien het de huisvesting en verzorging
      betreft kan Onze Minister van Binnenlandse Zaken aanwijzingen geven of doen geven aan de burgemeester met
      betrekking tot diens in het vorige lid omschreven taak of daarover bij ministeriële regeling regels stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002097#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0002097#Artikel2b
    url: https://wetten.overheid.nl/BWBR0002097/2023-04-20#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002097
        artikel: 2a
      - id: ref2
        bwb_id: BWBR0002097
        artikel: 2b
  - number: '5'
    text: |-
      1 De burgemeester kan in zijn gemeente met betrekking tot de verplaatsing van bevolking bij verordening
      gedragsregels en andere voorschriften vaststellen. Hij kan in bijzondere gevallen bevelen geven.

      2 De verordeningen worden bekendgemaakt door plaatsing in het gemeenteblad en worden voor zoveel nodig ook op een
      andere door de burgemeester te bepalen wijze algemeen bekendgemaakt. Zij worden terstond aan Onze Commissaris in de
      provincie medegedeeld.

      3 De verordeningen kunnen, voor zover zij met de wetten of het algemeen belang strijden, door Ons worden geschorst
      binnen een maand, nadat zij ter kennis van Onze Commissaris in de provincie zijn gebracht. Indien het algemeen
      belang zulks dringend eist kan Onze Commissaris in de provincie overgaan tot voorlopige buitenwerkingstelling voor
      ten hoogste veertien dagen; alsdan doet hij hiervan onmiddellijk mededeling aan Onze Minister van Binnenlandse
      Zaken.

      4 De verordeningen kunnen in de gevallen, bedoeld in het derde lid, door Ons worden vernietigd.

      5 De [artikelen 274][ref1] tot en met [280 van de Gemeentewet][ref2] (*Stb*. 1992, 96) zijn van toepassing.

      6 Bevelen worden, indien mogelijk, schriftelijk gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel274
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel280
    url: https://wetten.overheid.nl/BWBR0002097/2023-04-20#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '274'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '280'
  - number: '6'
    text: |-
      1 De burgemeester van een geheel of ten dele te ontruimen gemeente kan voor elk transport van af te voeren
      bevolking een of meer transportleiders aanwijzen. Gelijke bevoegdheid komt toe aan de door Onze Ministers
      aangewezen autoriteiten, indien bij de afvoer de grenzen van de gemeente van ontruiming worden overschreden.

      2 De transportleiders staan onder de bevelen van de burgemeester, indien bij de afvoer de grenzen van de gemeente
      van ontruiming niet worden overschreden. In het andere geval staan zij, indien daartoe aanleiding bestaat, onder de
      bevelen van de door Onze Ministers aangewezen autoriteiten.

      3 De transportleiders zijn belast met het handhaven van de orde in het transport en kunnen met het oog daarop
      bevelen geven.
    url: https://wetten.overheid.nl/BWBR0002097/2023-04-20#Artikel6
  - number: '7'
    text: |-
      1 De burgemeester kan ten behoeve van verplaatste en te verplaatsen personen hetzij het beschikbaar stellen in
      gebruik van woonruimte, gebouwen en andere onderkomens, zo nodig met inventaris, hetzij onderbrenging, al of niet
      met onderhoud, vorderen. De vordering kan in werking treden zodra de beslissing daartoe is bekendgemaakt op de
      daarbij bepaalde wijze.

      2 Onderbrenging in de zin van deze wet omvat het beschikbaar stellen in gebruik van vertrekken met nachtligging,
      meubilair, alsmede verwarming en verlichting of plaats in een verwarmd en verlicht vertrek, ter keuze van de
      bewoner. Onderhoud in de zin van deze wet omvat het verschaffen van spijs en drank.

      3 Van iedere vordering wordt zo spoedig mogelijk een schriftelijk bewijs, waarin de aard, de omvang en de tijdsduur
      van de vordering omschreven zijn, uitgereikt aan de belanghebbende, zijnde degene, die krachtens recht van
      eigendom, bezit, gebruik of uit anderen hoofde de woonruimte of de goederen die in de vordering begrepen zijn, in
      gebruik heeft.

      4 Indien de tijdsduur van een vordering meer bedraagt dan drie dagen kan de rechthebbende daartegen beroep
      instellen bij de commissie, bedoeld in [artikel 16][ref1].

      5 Onze Minister van Binnenlandse Zaken stelt nadere regelen vast omtrent de toepassing van de eerste twee leden.


      [ref1]: https://wetten.overheid.nl/BWBR0002097#Artikel16
    url: https://wetten.overheid.nl/BWBR0002097/2023-04-20#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002097
        artikel: '16'
  - number: '8'
    text: |-
      1 Onze Minister van Binnenlandse Zaken of een door deze aangewezen autoriteit kan in het belang van de
      volksgezondheid, dan wel met het oog op de gezondheid, de leeftijd of het gedrag van de verplaatste persoon, aan
      deze, en zo nodig ook aan degenen die met hem samenwonen, een bijzondere verblijfplaats aanwijzen en het verblijf
      aldaar aan voorschriften onderwerpen.

      2 Tegen deze aanwijzing en voorschriften kan beroep worden ingesteld bij de commissie, bedoeld in
      [artikel 17][ref1].

      3 Onze Minister van Binnenlandse Zaken is belast met de huisvesting en de verzorging van de personen, aan wie
      krachtens het eerste lid een bijzondere verblijfplaats is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0002097#Artikel17
    url: https://wetten.overheid.nl/BWBR0002097/2023-04-20#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002097
        artikel: '17'
  - number: '9'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regelen worden gegeven omtrent:

      a. de registratie van verplaatste personen;

      b. de terugkeer van verplaatste personen.
    url: https://wetten.overheid.nl/BWBR0002097/2023-04-20#Artikel9
  - number: '10'
    text: |-
      1 Uit de openbare kas worden geen kosten vergoed, voortvloeiende uit de verplaatsing van bevolking, voor zover in
      de volgende leden niet anders is bepaald.

      2 De kosten van vervoer kunnen geheel of gedeeltelijk voor rekening van het Rijk komen.

      3 De gemeente, waar het gebruik, de onderbrenging of het onderhoud krachtens een vordering, als bedoeld in
      [artikel 7][ref1], plaats vindt, verstrekt een door de burgemeester vastgestelde vergoeding aan degene, van wie
      gevorderd is. Deze vergoeding komt ten laste van degene te wiens behoeve de vordering heeft plaats gehad. Tegen
      de vastgestelde vergoeding kan degene van wie gevorderd is, alsmede degene te wiens behoeve gevorderd is beroep
      instellen bij de commissie, bedoeld in [artikel 16][ref2].

      4 In geval van onmacht tot het geheel of gedeeltelijk dragen van de kosten van de huisvesting en de verzorging,
      waaronder mede worden verstaan de kosten van de in het vorige lid bedoelde vergoeding, komen deze kosten ten laste
      van de gemeente, waar de huisvesting en de verzorging geschieden, dan wel bij toepassing van [artikel 8][ref3], ten
      laste van het Rijk.

      5 De kosten, door de gemeente of het Rijk gemaakt bij de toepassing van het vorige lid, kunnen worden verhaald op
      degene te wiens behoeve zij gemaakt zijn, en, voor zover dit niet mogelijk blijkt, op hen die ingevolge de wet tot
      onderhoud van dezelve verplicht zijn, de echtgenoot onderscheidenlijk geregistreerde partner daaronder begrepen.

      6 Onze Minister van Binnenlandse Zaken stelt, in overeenstemming met Onze Minister van Financiën regelen vast
      omtrent de toepassing van de leden 2-5.


      [ref1]: https://wetten.overheid.nl/BWBR0002097#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002097#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0002097#Artikel8
