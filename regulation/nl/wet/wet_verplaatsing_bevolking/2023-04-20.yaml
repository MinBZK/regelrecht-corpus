  - number: '23'
    text: |-
      Met het opsporen van de feiten, bij of krachtens deze wet strafbaar gesteld, zijn, behalve de ambtenaren,
      aangewezen bij [artikel 141 van het Wetboek van Strafvordering][ref1], belast de overige militairen van het wapen
      der Koninklijke Marechaussee, en de door de burgemeester aangewezen personen in dienst der gemeente, alsook voor
      wat betreft het niet nakomen van een bevel, als bedoeld in [artikel 6, vierde lid][ref2], de transportleiders.


