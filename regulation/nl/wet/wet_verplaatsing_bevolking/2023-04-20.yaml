        bwb_id: BWBR0005416
        artikel: '193'
  - number: '16'
    text: |-
      1 Gedeputeerde Staten stellen een commissie in, welke in hoogste ressort beslist op beroep tegen vorderingen, als
      bedoeld in [artikel 7][ref1] en tegen vastgestelde vergoedingen, als bedoeld in [artikel 10, derde lid][ref2].

      2 De leden van de commissie worden benoemd, geschorst en ontslagen door Gedeputeerde Staten.

      3 Zo nodig stellen Gedeputeerde Staten meer dan één commissie in. In dat geval bepalen zij het rechtsgebied van
      elke commissie.

      4 Gedeputeerde Staten stellen nadere regelen vast omtrent de samenstelling en de werkwijze van de vorenbedoelde
      commissies.

      5 De kosten van de commissies komen ten laste van het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0002097#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002097#Artikel10
    url: https://wetten.overheid.nl/BWBR0002097/2023-04-20#Artikel16
