  - number: '11'
    text: |-
      De kosten voor de gemeente, voortvloeiende uit de verplaatsing van bevolking zijn verplichte uitgaven in de zin
      van [artikel 193, onder ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel193
    url: https://wetten.overheid.nl/BWBR0002097/2023-04-20#Artikel11
    references:
