preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is voor het geval van oorlog, oorlogsgevaar, daaraan
    verwante of daarmede verband houdende buitengewone omstandigheden, bepalingen vast te stellen betreffende de
    verplaatsing van bevolking in het belang van haar veiligheid, van de instandhouding van het maatschappelijk leven
    of van de uitoefening van de taak van de krijgsmacht;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002097/2023-04-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze wet begrijpt onder:

      verplaatsing van bevolking: de gehele of gedeeltelijke ontruiming van een gebied en de daaruit voortvloeiende
      afvoer, huisvesting en verzorging van bevolking en de daarmede samenhangende registratie, alsmede de
      voorbereidingen hiertoe;

      Onze Ministers: Onze Ministers van Binnenlandse Zaken en van Defensie gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0002097/2023-04-20#Artikel1
  - number: '2'
    text: |-
      1 Onverminderd de [artikelen 7, eerste lid, en 8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref1]
      kunnen, ingeval buitengewone omstandigheden dit noodzakelijk maken, bij koninklijk besluit, op voordracht van
      Onze Minister-President, de [artikelen 2a][ref2], [2b][ref3], [2c][ref4], [2e][ref5], [3][ref6], [4][ref7],
      [5, eerste lid][ref8], [6][ref9], [7, eerste lid][ref10], en [8, eerste lid][ref11], gezamenlijk of afzonderlijk
      in werking worden gesteld.

      2 Wanneer het in het eerste lid bedoelde besluit is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepalingen.

      3 Wordt het voorstel van wet door de Staten-Generaal verworpen, dan worden bij koninklijk besluit, op voordracht
      van Onze Minister-President, de bepalingen die ingevolge het eerste lid in werking zijn gesteld, onverwijld buiten
      werking gesteld.

      4 Bij koninklijk besluit, op voordracht van Onze Minister-President, worden bepalingen die ingevolge het eerste lid
      in werking zijn gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.

      5 Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.

      6 Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het *Staatsblad*.


