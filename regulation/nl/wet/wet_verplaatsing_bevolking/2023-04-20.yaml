        artikel: '8'
  - number: '18'
    text: |-
      1 De burgemeester en de door deze aangewezen personen, de leden der commissies van beroep, bedoeld in de
      [artikelen 16][ref1] en [17][ref2], de autoriteiten, bedoeld in de [artikelen 6][ref3] en [8][ref4], benevens de
      transportleiders, bedoeld in [artikel 6][ref5], hebben toegang tot elke plaats, voor zover dat redelijkerwijs voor
      de vervulling van hun taak nodig is. Zo nodig verschaffen zij zich toegang met behulp van de sterke arm.

      2 Een machtiging tot binnentreden als bedoeld in [artikel 2 van de Algemene wet op het binnentreden][ref6] (*Stb.*
      1994, 572) kan worden gegeven door de commissaris van de Koning.

      3 De personen, bedoeld in het eerste lid, kunnen zich bij het betreden door andere personen doen vergezellen.


