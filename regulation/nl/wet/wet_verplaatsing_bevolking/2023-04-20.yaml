        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002097
        artikel: '10'
  - number: '17'
    text: |-
      1 Wij stellen een commissie in, welke in hoogste ressort beslist op beroep tegen aanwijzingen en voorschriften, als
      bedoeld in [artikel 8][ref1].

      2 De leden van de commissie worden benoemd, geschorst en ontslagen door Ons.

      3 Zo nodig stellen Wij meer dan één commissie in. In dat geval bepalen Wij het rechtsgebied van elke commissie.

      4 Onze Minister van Binnenlandse Zaken stelt nadere regelen vast omtrent de samenstelling en de werkwijze van de
      vorenbedoelde commissies.


      [ref1]: https://wetten.overheid.nl/BWBR0002097#Artikel8
    url: https://wetten.overheid.nl/BWBR0002097/2023-04-20#Artikel17
