preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het wenselijk is dat Verordening (EU) 2017/352 wordt uitgevoerd en
    geïmplementeerd;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0044856/2021-02-26#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet wordt verstaan onder:

        - *aanbieder van havendiensten:* aanbieder van havendiensten als bedoeld in artikel 2, dertiende lid, van de EU-
      zeehavenverordening;
        - *Autoriteit Consument en Markt:* Autoriteit Consument en Markt, genoemd in
      [artikel 2, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref1];
        - *bevoegde instantie:* bevoegde instantie als bedoeld in artikel 2, derde lid, van de EU-zeehavenverordening;
        - *EU-zeehavenverordening:* Verordening (EU) 2017/352 van het Europees Parlement en de Raad van 15 februari
      2017 tot vaststelling van een kader voor het verrichten van havendiensten en gemeenschappelijke regels inzake de
      financiële transparantie van havens (PbEU 2017, L 57);
        - *havenbeheerder:* havenbeheerder als bedoeld in artikel 2, vijfde lid, van de EU-zeehavenverordening;
        - *Onze Minister:* Onze Minister van Infrastructuur en Waterstaat;
        - *zeehaven:* zeehaven als bedoeld in artikel 2, zestiende lid, van de EU-zeehavenverordening.

      2 Een wijziging van de EU-zeehavenverordening gaat voor de toepassing van deze wet gelden met ingang van de dag
      waarop aan de betrokken wijziging uitvoering moet zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel2
    url: https://wetten.overheid.nl/BWBR0044856/2021-02-26#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0033043
        artikel: '2'
  - number: '2'
    text: |-
      1 Deze wet is alleen van toepassing op zeehavens die deel uitmaken van het trans-Europees vervoersnetwerk, bedoeld
      in artikel 1, vierde lid, van de EU-zeehavenverordening.

      2 Deze wet is van toepassing binnen havengebieden en op de waterweg naar de haven, bedoeld in artikel 1, tweede
      lid, aanhef, van de EU-zeehavenverordening.
    url: https://wetten.overheid.nl/BWBR0044856/2021-02-26#Artikel2
  - number: '3'
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld inzake:

      a. de bekendmaking van minimumeisen en het in kennis stellen van wijzigingen in de criteria en de procedure,
      bedoeld in artikel 4, zesde lid, van de EU-zeehavenverordening;

      b. de beperking van het aantal aanbieders van een havendienst door een havenbeheerder of bevoegde instantie met
      betrekking tot de informatie, selectieprocedure of wijze van bekendmaking als bedoeld in artikel 6, vierde lid, van
      de EU-zeehavenverordening.
    url: https://wetten.overheid.nl/BWBR0044856/2021-02-26#Artikel3
  - number: '4'
    text: |-
      De havenbeheerder of in voorkomend geval de bevoegde instantie legt overeenkomstig artikel 13 van de EU-
      zeehavenverordening een heffing op voor het gebruik van haveninfrastructuur.
    url: https://wetten.overheid.nl/BWBR0044856/2021-02-26#Artikel4
  - number: '5'
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot de raadpleging van
      havengebruikers en andere belanghebbenden als bedoeld in artikel 15 van de EU-zeehavenverordening door de
      havenbeheerder of in voorkomend geval de bevoegde instantie.
    url: https://wetten.overheid.nl/BWBR0044856/2021-02-26#Artikel5
  - number: '6'
    text: |-
      1 Een havengebruiker of andere belanghebbende kan bij de Autoriteit Consument en Markt een klacht als bedoeld in
      artikel 16 van de EU-zeehavenverordening indienen tegen een havenbeheerder, bevoegde instantie of aanbieder van
      havendiensten over de wijze waarop deze zijn taken en bevoegdheden op grond van de EU-zeehavenverordening of deze
      wet uitvoert, dan wel aan zijn verplichtingen op grond van de EU-zeehavenverordening of deze wet voldoet.

      2 In afwijking van het eerste lid is geen klacht mogelijk over besluiten op grond van
      [artikel 27f van de Loodsenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004365#Artikel27f
    url: https://wetten.overheid.nl/BWBR0044856/2021-02-26#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004365
        artikel: 27f
  - number: '7'
    text: |-
      1 De Autoriteit Consument en Markt is belast met de behandeling van een klacht als bedoeld in [artikel 6][ref1],
      behalve als de klacht betrekking heeft op artikel 9 of artikel 14 van de EU-zeehavenverordening. In dat geval
      draagt zij de klacht ter behandeling over aan Onze Minister of Onze Minister van Sociale Zaken en Werkgelegenheid,
      volgens een door genoemde ministers bij ministeriele regeling te bepalen taakverdeling.

      2 De instantie die de klacht behandelt beslist binnen vier maanden na ontvangst van de klacht. Deze termijn kan
      eenmaal worden verlengd met twee maanden.

      3 De havenbeheerder, bevoegde instantie of aanbieder van havendiensten verleent binnen de door de instantie die de
      klacht behandelt gestelde termijn alle medewerking die deze redelijkerwijs kan verlangen voor het behandelen van
      een klacht.

      4 [Artikel 4:15 van de Algemene wet bestuursrecht][ref2] is van overeenkomstige toepassing op de termijn waarbinnen
      op een klacht wordt beslist, met dien verstande dat de termijn ook wordt opgeschort indien de instantie die de
      klacht behandelt een aanbieder van havendiensten, bevoegde instantie of havenbeheerder, om gegevens verzoekt met
      het oog op het behandelen van een klacht.

      5 De beslissing van de instantie die de klacht behandelt is bindend.

      6 Bij regeling van Onze Minister en Onze Minister van Sociale Zaken en Werkgelegenheid kunnen, zo nodig
      onderscheiden naar de taakverdeling tussen genoemde ministers, regels worden gesteld over de procedure die gevolgd
      wordt bij het indienen en behandelen van klachten op grond van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0044856#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel415
    url: https://wetten.overheid.nl/BWBR0044856/2021-02-26#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0044856
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:15
  - number: '8'
    text: |-
      De Autoriteit Consument en Markt is belast met het toezicht op de naleving van de EU-zeehavenverordening, met
      uitzondering van de artikelen 9 en 14 van de EU-zeehavenverordening, en hetgeen bij of krachtens deze wet is
      bepaald.
    url: https://wetten.overheid.nl/BWBR0044856/2021-02-26#Artikel8
  - number: '9'
    text: |-
      1 De Autoriteit Consument en Markt kan in geval van overtreding van artikelen van de EU-zeehavenverordening, met
      uitzondering van de artikelen 9 en 14 van de EU-zeehavenverordening, of van hetgeen bij of krachtens deze wet is
      bepaald, de overtreder:

      a. een last onder dwangsom opleggen; of

      b. een bestuurlijke boete opleggen van ten hoogste € 900.000 of, indien dat meer is, 10% van de omzet van de
      overtreder.

      2 Onze Minister, respectievelijke Onze Minister van Sociale Zaken en Werkgelegenheid, kan in geval van overtreding
      van [artikel 7, derde lid][ref1], of van de op grond van artikel 7, zesde lid, gestelde regels een last onder
      dwangsom opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0044856#Artikel7
    url: https://wetten.overheid.nl/BWBR0044856/2021-02-26#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0044856
        artikel: '7'
  - number: '10'
    text: |-
      In afwijking van [artikel 6a van de Instellingswet Autoriteit Consument en Markt][ref1] worden de kosten van de
      Autoriteit Consument en Markt die samenhangen met de uitvoering van de taken op grond van de EU-zeehavenverordening
      of deze wet, niet ten laste gebracht van marktorganisaties.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel6a
    url: https://wetten.overheid.nl/BWBR0044856/2021-02-26#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0033043
        artikel: 6a
  - number: '13'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0044856/2021-02-26#Artikel13
  - number: '14'
    text: 'Deze wet wordt aangehaald als: Uitvoeringswet EU-zeehavenverordening.'
    url: https://wetten.overheid.nl/BWBR0044856/2021-02-26#Artikel14
