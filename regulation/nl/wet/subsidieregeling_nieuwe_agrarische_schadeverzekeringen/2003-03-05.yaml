  - number: '8'
    text: |-
      1 Gelijktijdig met de vaststelling van een subsidieplafond stelt de minister, bij in de Staatscourant bekend te
      maken besluit, de wijze van verdeling van het beschikbare bedrag vast op basis van:

      a. de volgorde van de datum van ontvangst van de aanvragen door LASER, of

      b. een beoordeling van de mate waarin de desbetreffende subsidieaanvraag bijdraagt aan het bereiken van de
      doelstellingen van de regeling.

      2 Ingeval de verdeling geschiedt overeenkomstig het eerste lid, onderdeel a, en door toewijzing van de aanvragen
      tot subsidieverlening met dezelfde datum van ontvangst het subsidieplafond zou worden overschreden, geschiedt de
      rangschikking door middel van een loting verricht door een notaris van de op dezelfde dag ontvangen aanvragen. De
      loting geschiedt door een door de minister of LASER aan te wijzen notaris.

      3 Ingeval de verdeling geschiedt overeenkomstig het eerste lid, onderdeel b, stelt de minister tevens de criteria
      vast aan de hand waarvan de beoordeling van de aanvraag tot subsidieverlening zal plaatsvinden, alsmede de rangorde
      van die criteria en de onderlinge wegingsfactoren. Tot de criteria kunnen in ieder geval behoren:

      a. de doelmatigheid van de subsidie-inzet bij het bevorderen van het tot stand brengen van
      verzekeringsmogelijkheden voor nog niet eerder verzekerbare of niet onder standaardpolissen verzekerbare risico's
      in de agrarische sector;

      b. de omvang van het te verzekeren risico;

      c. de financiële levensvatbaarheid van de verzekeraar;

      d. het geraamde aantal ondernemers dat een verzekeringsovereenkomst als bedoeld in artikel 4, eerste of derde lid,
      zal afsluiten;

      e. het marktperspectief voor schadeverzekering van de categorieën van risico's, genoemd in artikel 4, tweede of
      vierde lid;

      f. de berekening en samenstelling van de risicofactor.

      4 Ingeval de verdeling geschiedt overeenkomstig het eerste lid, onderdeel b, zal, indien noodzakelijk, de nadere
      rangorde van de aanvragen worden vastgesteld overeenkomstig het eerste lid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0009534/2003-03-05#Artikel8
  - number: '9'
    text: |-
      1 De minister kan een adviescommissie instellen die tot taak heeft de haar daartoe voorgelegde aanvragen
      overeenkomstig het vierde lid te beoordelen en hierover advies uit te brengen aan de minister.

      2 De adviescommissie bestaat uit een voorzitter, tevens lid, en ten minste twee doch ten hoogste tien leden. De
      minister benoemt op basis van hun specifieke kennis en deskundigheid de voorzitter en de leden voor een termijn van
      drie jaar, behoudens tussentijds ontslag door de minister. Ze zijn te allen tijde opnieuw benoembaar.

      3 De adviescommissie stelt met inachtneming van door de minister te stellen regels haar werkwijze vast. Het
      secretariaat wordt gevoerd door LASER.

      4 De adviescommissie beoordeelt of de verzekeringsovereenkomsten, ter zake waarvan subsidieverlening wordt
      aangevraagd, voldoen aan de in [artikel 4][ref1] genoemde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009534#Artikel4
    url: https://wetten.overheid.nl/BWBR0009534/2003-03-05#Artikel9
