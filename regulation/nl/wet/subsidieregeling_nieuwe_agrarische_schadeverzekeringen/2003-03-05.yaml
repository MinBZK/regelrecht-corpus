  - number: '2'
    text: |-
      1 De minister kan met inachtneming van de volgende bepalingen aan verzekeraars subsidies verlenen ter bevordering
      van het tot stand brengen van verzekeringsmogelijkheden voor nog niet eerder verzekerbare of niet onder
      standaardpolissen verzekerbare risico’s in de agrarische sector.

      2 De minister kan voorts, in overeenstemming met de minister van Financiën, aan verzekeraars subsidies in de vorm
      van garanties verlenen in verband met door een verzekeraar af te sluiten verzekeringen in de agrarische sector.

      3 Bij een besluit als bedoeld in [artikel 6, eerste lid][ref1], bepaalt de minister dat garanties als bedoeld in
      tweede lid slechts inroepbaar worden, nadat de financiële verplichtingen van de verzekeraar een, bij dat besluit te
      bepalen, omvang hebben bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0009534#Artikel6
    url: https://wetten.overheid.nl/BWBR0009534/2003-03-05#Artikel2
