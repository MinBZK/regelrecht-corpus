preamble:
  text: |-
    Gelet op de artikel 2 en 7 van de Kaderwet LNV-subsidies;

    Gelet op de goedkeuring van de Commissie van de Europese Gemeenschappen van 21 januari 1998, nr. SG(98)D/030431;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009534/2003-03-05#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
            de minister:

              de Minister van Landbouw, Natuurbeheer en Visserij;



            b
            verzekeraar:

              verzekeraar met zetel binnen Nederland die beschikt over een vergunning als bedoeld in
      [artikel 24 van de Wet toezicht verzekeringsbedrijf 1993][ref1] voor de branches 8 of 9 als bedoeld in artikel 15
      van die wet, ofwel
      verzekeraar met zetel in een andere lidstaat van de Europese Gemeenschap die op de voet van
      [artikel 37 van de Wet toezicht verzekeringsbedrijf 1993][ref2] bevoegd is in Nederland een bijkantoor te hebben
      voor de branches 8 of 9 als bedoeld in artikel 15 van die wet, ofwel
      een onderlinge waarborgmaatschappij die in het bezit is van een verklaring, verleend door de Verzekeringskamer,
      ingevolge [artikel 2][ref3] of 3 van het [Besluit vrijgestelde onderlinge waarborgmaatschappijen 1994][ref4], en
      werkzaam is in de branche 8 of 9 als bedoeld in [artikel 15 van de Wet toezicht verzekeringsbedrijf 1993][ref5],
      ofwel
      een onderneming of instelling op onderlinge grondslag met zetel buiten Nederland waarop
      [artikel 13 van het Besluit vrijgestelde onderlinge waarborgmaatschappijen 1994][ref6] van toepassing is, werkzaam
      in de branche 8 of 9 als bedoeld in [artikel 15 van de Wet toezicht verzekeringsbedrijf 1993][ref7];



            c
            LASER:

              Dienst Landelijke service bij regelingen van het Ministerie van Landbouw, Natuurbeheer en Visserij;



            d
            risicofactor:

              de statistische berekende kans dat de garantie door de verzekeraar wordt ingeroepen gebaseerd op ervaringen
      met het inroepen van garanties van onder soortgelijke omstandigheden toegekende garanties;



            e
             minimumverzekeringspremie:

              minimumbedrag dat verzekeringnemers ter zake van een verzekeringsperiode van één jaar aan de verzekeraar in
      totaal aan premies verschuldigd zijn.


