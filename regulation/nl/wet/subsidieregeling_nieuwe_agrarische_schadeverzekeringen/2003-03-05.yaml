  - number: '16'
    text: |-
      1 De minister kan de subsidie-ontvanger van een subsidie als bedoeld in [artikel 2, eerste lid][ref1], op diens
      verzoek ten hoogste eenmaal per vier maanden voorschotten verlenen. De subsidie-ontvanger verstrekt bij dit verzoek
      een overzicht van de liquiditeitsbehoefte.

      2 Het totaal van de verleende voorschotten kan nooit meer bedragen dan 80 % van het maximumsubsidiebedrag, bedoeld
      in [artikel 5, vierde lid][ref2].

      3 De minister verstrekt de subsidieontvanger van een subsidie als bedoeld in [artikel 2, tweede lid][ref3], een
      voorschot van 100% van het subsidiebedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0009534#Artikel2
