  - number: '15'
    text: |-
      1 De minister stelt na ontvangst van de in [artikel 14, tweede lid][ref1], bedoelde bescheiden, de subsidie vast.

      2 De minister stelt, in overeenstemming met de Minister van Financiën, na ontvangst van de in
      [artikel 14, derde lid][ref2], bedoelde bescheiden, de subsidie vast.


