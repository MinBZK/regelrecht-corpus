  - number: '13'
    text: |-
      Als toezichthouders worden door de minister ambtenaren van het Ministerie van Landbouw, Natuurbeheer en Visserij
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0009534/2003-03-05#Artikel13
  - number: '14'
    text: |-
      1 De aanvraag voor de vaststelling van de subsidie, bedoeld in [artikel 2, eerste lid][ref1], wordt binnen zes
      maanden na afloop van het jaar, bedoeld in [artikel 5][ref2], ingediend bij LASER, op een daartoe vastgesteld
      formulier.

      2 De aanvraag gaat vergezeld van een opgaaf van de door de verzekeringsnemers verschuldigde premies voor de
      verzekeringsovereenkomsten waarop de subsidie betrekking heeft in het jaar bedoeld in [artikel 5][ref3]. Deze
      opgaaf gaat vergezeld van een verklaring overeenkomstig het in bijlage I bij deze regeling vastgestelde model
      van een accountant of een accountant-administratieconsulent als bedoeld in artikel 2:393, eerste lid, van het
      Burgerlijk Wetboek, waaruit blijkt dat is voldaan aan de in deze regeling gestelde voorwaarden en verplichtingen.
      De accountant of accountant-administratieconsulent controleert met inachtneming van het in bijlage II bij deze
      regeling opgenomen controleprotocol.

      3 De aanvraag voor de vaststelling van de subsidie, bedoeld in [artikel 2, tweede lid][ref4], wordt, binnen zes
      maanden na afloop van het laatste jaar waarop de garantieovereenkomst van toepassing is, ingediend bij LASER op een
      daartoe vastgesteld formulier.

      4 De aanvraag gaat vergezeld van:

      a. een opgaaf van de door de verzekeraar ontvangen premies voor de verzekeringsovereenkomsten waarop de
      garantieovereenkomst van toepassing is;

      b. een opgaaf van het aantal afgesloten verzekeringsovereenkomsten gedurende de periode waarop de
      garantieovereenkomst van toepassing is;

      c. een verklaring overeenkomstig het in de bijlage bij deze regeling vastgesteld model van een accountant of
      een accountant-administratieconsulent als bedoeld in artikel 2:393, eerste lid, van het Burgerlijk Wetboek,
      waaruit blijkt dat is voldaan aan de in deze regeling gestelde voorwaarden en verplichtingen. De accountant of
      accountant-administratieconsulent controleert met inachtneming van het in bijlage III bij deze regeling opgenomen
      controleprotocol;

      d. een totaaloverzicht van de op grond van de afgesloten verzekeringsovereenkomsten uitgekeerde schadevergoedingen
      over de periode waarop de garantieovereenkomst van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0009534#Artikel2
