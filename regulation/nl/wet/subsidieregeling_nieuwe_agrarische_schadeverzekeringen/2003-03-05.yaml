  - number: '10'
    text: |-
      De minister geeft een beschikking tot subsidieverlening binnen twee maanden na afloop van de aanvraagperiode waarin
      de aanvraag is ingediend. Indien deze termijn niet kan worden gehaald, stelt de minister de aanvrager daarvan in
      kennis en noemt hij daarbij een redelijke termijn waarop de beschikking tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0009534/2003-03-05#Artikel10
  - number: '11'
    text: |-
      De subsidieverlening kan worden geweigerd indien een gegronde reden bestaat om aan te nemen dat de aanvrager
      niet op een behoorlijke wijze rekening en verantwoording zal afleggen omtrent de afgesloten of af te sluiten
      verzekeringsovereenkomsten en de terzake verschuldigde premies, voor zover deze voor de vaststelling van de
      subsidie van belang zijn.
    url: https://wetten.overheid.nl/BWBR0009534/2003-03-05#Artikel11
  - number: '12'
    text: |-
      1 De subsidie-ontvanger is verplicht het bedrag van de subsidie, bedoeld in [artikel 2, eerste lid, onder][ref1]
      de ondernemers, die premie verschuldigd zijn ter zake van een verzekeringsovereenkomst als bedoeld in
      [artikel 4, eerste lid][ref2], waarvoor de subsidie is verleend, te verdelen naar rato van de door elke ondernemer
      verschuldigde premie over de periode waarop de beschikking tot subsidieverlening betrekking heeft.

      2 De minister kan de subsidie-ontvanger ook andere verplichtingen opleggen die strekken tot verwezenlijking van het
      doel van de subsidie.

      3 Bij een besluit als bedoeld in [artikel 6, eerste lid][ref3], kan de minister bepalen dat gedurende de looptijd
      van de garantie op bij dat besluit nader te bepalen tijdstip of tijdstippen, het besluit tot subsidieverlening als
      bedoeld in [artikel 2, tweede lid][ref4], en de toepassing daarvan wordt geëvalueerd.

      4 Bij de evaluatie, bedoeld in het vorige lid, wordt met name aandacht geschonken aan:

      a. de solvabiliteit van de verzekeraar;

      b. de polisvoorwaarden en de tariefstelling;

      c. de omvang van het te verzekeren risico;

      d. het marktperspectief voor schadeverzekering;

      e. het aantal afgesloten verzekeringsovereenkomsten;

      f. de uitgekeerde schadevergoedingen over de periode waarop de garantieovereenkomst van toepassing is;

      g. het aantal keren dat de garantie is ingeroepen.

      5 Het besluit tot verlening van de subsidie kan worden gewijzigd of ingetrokken indien de resultaten van de
      evaluatie van dien aard zijn dat de solvabiliteit van de verzekeraar, het marktperspectief voor schadeverzekering
      of het risico voor de verzekeraar of de Staat zodanig zijn, dat in redelijkheid niet langer sprake is van een
      levensvatbare verzekering.


