  - number: '3'
    text: |-
      1 De minister stelt jaarlijks een subsidieplafond vast voor de verlening van subsidies ingevolge deze regeling.

      2 De minister kan besluiten dat, indien het subsidieplafond is of zal worden overschreden, geen aanvragen tot
      subsidieverlening meer kunnen worden ingediend.

      3 Besluiten als bedoeld in het eerste en tweede lid worden in de Staatscourant bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0009534/2003-03-05#Artikel3
  - number: '4'
    text: |-
      1 Subsidies als bedoeld in artikel 2, eerste lid, kunnen slechts worden verleend aan verzekeraars ter zake van
      de introductie van overeenkomsten van schadeverzekering waarbij één of meer risico's, behorend tot de categorie,
      genoemd in het tweede lid, worden gedekt.

      2 De in het eerste lid bedoelde categorie van risico's is:

      in Nederland optredende productieverliezen ten gevolge van ongunstige weersomstandigheden die ten minste 30%
      moeten bedragen ten opzichte van de gemiddelde opbrengst in de betrokken productierichting op het bedrijf van
      de verzekerde in de drie jaren voorafgaande in het jaar waarin deze productieverliezen zich voordoen, met dien
      verstande

        - dat in voorkomend geval een voorafgaand jaar waarin reeds een zodanig productieverlies is geleden bij de
      berekening van de gemiddelde opbrengst in de betrokken productierichting buiten beschouwing wordt gelaten en
        - dat indien ten gevolge van ongunstige weersomstandigheden productieverliezen zich over meerdere jaren zullen
      doen gevoelen, deze verliezen in het eerste jaar ten minste 10% moeten bedragen en het percentage van het
      productieverlies in het eerste jaar, vermenigvuldigd met het aantal jaren waarin productieverlies zal worden
      geleden, tenminste uitkomt op 30%;

      voor zover deze risico's op 1 januari 2003 in Nederland niet verzekerbaar of niet onder standaardpolissen
      verzekerbaar waren.

      3 Subsidies als bedoeld in artikel 2, tweede lid, kunnen slechts worden verleend aan verzekeraars ter zake van
      de introductie van overeenkomsten van schadeverzekering waarbij één of meer risico's, behorend tot de categorie,
      bedoeld in het vierde lid, worden gedekt.

      4 De in het derde lid bedoelde categorie van risico's is:

      in Nederland optredende productieverliezen ten gevolge van ongunstige weersomstandigheden die tenminste 25%
      moeten bedragen ten opzichte van de gemiddelde opbrengst in de betrokken productierichting op het bedrijf van
      de verzekerde in de drie jaren voorafgaande in het jaar waarin deze productieverliezen zich voordoen, met dien
      verstande

        - dat in voorkomend geval een voorafgaand jaar waarin reeds een zodanig productieverlies is geleden bij de
      berekening van de gemiddelde opbrengst in de betrokken productierichting buiten beschouwing wordt gelaten en
        - dat indien ten gevolge van ongunstige weersomstandigheden productieverliezen zich over meerdere jaren zullen
      doen gevoelen, deze verliezen in het eerste jaar ten minste 10% moeten bedragen en het percentage van het
      productieverlies in het eerste jaar, vermenigvuldigd met het aantal jaren waarin productieverlies zal worden
      geleden, tenminste uitkomt op 25%;

      voor zover deze risico's op 1 januari 2003 in Nederland niet verzekerbaar of niet onder standaardpolissen
      verzekerbaar waren.

      5 Geen subsidie wordt verleend voor de introductie van overeenkomsten van schadeverzekering als bedoeld in het
      eerste en derde lid, voor zover deze overeenkomsten betrekking hebben op dezelfde risico's als overeenkomsten
      van schadeverzekering ter zake waarvan reeds een subsidie uit hoofde van deze regeling is verleend of reeds voor
      hetzelfde of een vergelijkbaar risico vanwege de staat, een ander overheidsorgaan of de Europese Gemeenschap een
      subsidie is verleend.
    url: https://wetten.overheid.nl/BWBR0009534/2003-03-05#Artikel4
  - number: '5'
    text: |-
      1 De subsidie, bedoeld in artikel 2, eerste lid, bedraagt maximaal 80% van het bedrag dat de verzekeringsnemers
      ter zake van een verzekeringsperiode van één jaar aan de subsidieontvanger in totaal aan premies verschuldigd zijn,
      voor zover:

      a. het betreft aangegane verzekeringsovereenkomsten als bedoeld in artikel 4, eerste en tweede lid.

      b. de verzekeringsovereenkomsten zijn aangegaan in en voor de periode van 12 maanden gerekend vanaf de datum van de
      eerste aanbieding van de verzekering door de subsidieontvanger, en

      c. deze premies betrekking hebben op risico's ter zake waarvan de subsidie is verleend.

      2 De subsidie als bedoeld in artikel 2, tweede lid, bedraagt na omrekening van de garantie tot een subsidie-
      equivalent, maximaal 50% van het bedrag dat verzekeringsnemers ter zake van een verzekeringsperiode van één jaar
      aan de subsidieontvanger in totaal aan premies verschuldigd zijn, voor zover:

      a. het betreft aangegane verzekeringsovereenkomsten als bedoeld in artikel 4, derde en vierde lid,

      b. de verzekeringsovereenkomsten zijn aangegaan in de looptijd van de garantie en voor een periode van ten minste
      12 maanden, en

      c. deze premies betrekking hebben op risico's ter zake waarvan de subsidie is verleend.

      3 Het subsidie-equivalent, bedoeld in het tweede lid, wordt berekend volgens de formule: gegarandeerd bedrag
      vermenigvuldigd met de risicofactor, min de betaalde minimumverzekeringspremie.

      4 De subsidie bedraagt maximaal € 680.670,32 voor subsidies als bedoeld in artikel 2, eerste lid.
    url: https://wetten.overheid.nl/BWBR0009534/2003-03-05#Artikel5
  - number: '6'
    text: |-
      1 De minister kan per kalenderjaar één of meer perioden vaststellen waarin aanvragen tot subsidieverlening kunnen
      worden ingediend.

      2 De minister maakt de in het eerste lid bedoelde perioden bekend in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009534/2003-03-05#Artikel6
  - number: 6a
    text: |-
      Bij een besluit als bedoeld in artikel 6, eerste lid, kan de minister bepalen dat subsidie slechts wordt verleend
      ten behoeve van:

      a. bij dat besluit bepaalde risico's, behorend tot één der categorieën, genoemd in artikel 4, tweede of vierde lid;

      b. bij dat besluit bepaalde maximale risicofactor als bedoeld in artikel 1, onderdeel d;

      c. bij dat besluit bepaalde minimale verzekerde waarde;

      d. bij dat besluit bepaalde minimumverzekeringspremie als bedoeld in artikel 1, onderdeel e.
    url: https://wetten.overheid.nl/BWBR0009534/2003-03-05#Artikel6a
  - number: '7'
    text: |-
      1 De aanvraag voor de verlening van een subsidie als bedoeld in [artikel 2, eerste lid][ref1], wordt ingediend bij
      LASER, op een daartoe vastgesteld formulier.

      2 De aanvraag gaat vergezeld van:

      a. stukken waaruit genoegzaam blijkt dat de aanvrager een verzekeraar is als bedoeld in
      [artikel 1, onderdeel b][ref2];

      b. de polisvoorwaarden en de tariefstelling;

      c. een raming van het aantal ondernemers dat een verzekeringsovereenkomst, als bedoeld in
      [artikel 4, eerste lid][ref3], waarvoor de subsidie wordt aangevraagd, zal aangaan, alsmede van het totaalbedrag
      op jaarbasis aan door de ondernemers terzake verschuldigde premies, gebaseerd op de polisvoorwaarden en de
      tariefstelling.

      3 Indien de verzekeraar nog niet werkzaam was in de branches 8 of 9 als bedoeld in
      [artikel 15 van de Wet toezicht verzekeringsbedrijf 1993][ref4] voordat deze overeenkomsten tot schadeverzekering
      ter zake waarvan subsidie is aangevraagd ging aanbieden, gaat de aanvraag tot subsidieverlening bovendien vergezeld
      van een verklaring van de verzekeraar dat de in het tweede lid, onderdeel c, bedoelde raming verenigbaar is met
      hetgeen omtrent het te verwachten aantal verzekerden en de premie-inkomsten is gesteld

        - in zijn programma van werkzaamheden, bedoeld in
      [artikel 25, eerste lid, van de Wet toezicht verzekeringsbedrijf 1993][ref5], dan wel
        - in de daarmee overeenkomende gegevens, die ingevolge artikel 37, eerste lid, van die wet aan de Verzekeringskamer
      dienen te worden overgelegd, dan wel
        - in de door de verzekeraar bij de aanvraag van een verklaring, als bedoeld in [artikel 2][ref6] of 3 van het
      [Besluit vrijgestelde onderlinge waarborgmaatschappijen 1994][ref7] gevoegde gegevens, dan wel
        - in hetgeen aan de Verzekeringskamer daaromtrent is bericht in het kader van artikel 13, onder a, van dat Besluit.

      4 De aanvraag voor de verlening van een subsidie als bedoeld in [artikel 2, tweede lid][ref8], wordt ingediend bij
      LASER, op een daartoe vastgesteld formulier.

      5 De aanvraag, bedoeld in het vorige lid, gaat vergezeld van:

      a. stukken waaruit genoegzaam blijkt dat de aanvrager een verzekeraar is als bedoeld in
      [artikel 1, onderdeel b][ref9];

      b. de polisvoorwaarden en de tariefstelling;

      c. een deugdelijk onderbouwde raming van het aantal ondernemer dat een verzekeringsovereenkomst waarvoor subsidie
      wordt aangevraagd, zal aangaan, alsmede van het totaalbedrag op jaarbasis aan door de ondernemers ter zake
      verschuldigde premies, gebaseerd op de polisvoorwaarden en de tariefstelling;

      d. een deugdelijk onderbouwd voorstel voor de berekening van de risicofactor. De garantieovereenkomst, bedoeld
      in het vierde lid zal namens de Staat gesloten worden door de minister, die hiervoor instemming behoeft van de
      Minister van Financiën.

      6 Alvorens een besluit tot subsidieverlening als bedoeld in [artikel 2, tweede lid][ref10], wordt genomen, sluit de
      verzekeraar met de Staat een garantieovereenkomst af.

      7 De garantieovereenkomst, bedoeld in het zesde lid, dient de volgende elementen te bevatten:

      a. een procedure voor het inroepen van de garantie;

      b. een procedure voor het wijzigen van polissen of dekkingstoezeggingen;

      c. een procedure volgens welke schadegevallen zullen worden afgewikkeld;

      d. een procedure voor het nemen incassomaatregelen en het treffen van maatregelen ter beperking van de schade;

      e. de bepaling dat de verzekeraar voor de garantstelling de Staat een bedrag verschuldigd is dat wordt afgeleid van
      de totale verzekerde waarde;

      f. de bepaling dat de verzekeraar van de verzekeringnemers een vergoeding van administratiekosten zal verlangen en
      de vaststelling van de hoogte daarvan;

      g. een bepaling inzake de administratie van de uit de garantstelling voortvloeiende verplichtingen;

      h. een bepaling inzake de afrekening en controle;

      i. een bepaling inzake de duur van de overeenkomst.


