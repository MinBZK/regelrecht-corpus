  - number: 16a
    text: |-
      1 De subsidie wordt verleend onder voorbehoud van goedkeuring van de Commissie van de Europese Gemeenschappen.

      2 De beslissing tot verlening van de subsidie kan worden gewijzigd of ingetrokken indien dit noodzakelijk is in
      verband met het verkrijgen van de goedkeuring van de Commissie van de Europese Gemeenschappen voor deze regeling of
      wegens het uitblijven daarvan.
    url: https://wetten.overheid.nl/BWBR0009534/2003-03-05#Artikel16a
  - number: '17'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na dagtekening van de Staatscourant waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0009534/2003-03-05#Artikel17
  - number: '18'
    text: 'Deze regeling wordt aangehaald als: Subsidieregeling nieuwe agrarische schadeverzekeringen.'
    url: https://wetten.overheid.nl/BWBR0009534/2003-03-05#Artikel18
  - number: BII:4
    text: |-
      Vaststellen dat:

        - het premie-inkomen opgenomen in de opgaaf van de premies betrekking heeft op verzekeringsovereenkomsten voor de
      categorieën van risico’s zoals omschreven in [artikel 4, lid][ref1] twee, letters a, b en c;
        - de verzekerde schade en de optredende productieverliezen in Nederland optreden;
        - de subsidieontvanger niet vóór 1 januari 1997 de bedoelde verzekeringsovereenkomsten reeds aanbood of dat deze
      categorieën van risico onder gebruikelijke voorwaarden niet verzekerbaar waren.


      [ref1]: https://wetten.overheid.nl/BWBR0009534#Artikel4
    url: https://wetten.overheid.nl/BWBR0009534/2003-03-05#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009534
        artikel: '4'
  - number: BII:5
    text: |-
      Vaststellen dat het premie-inkomen betrekking heeft op een verzekeringsperiode van één jaar, verschuldigd in het
      jaar, gerekend vanaf de datum van de eerste aanbieding van de verzekering.
    url: https://wetten.overheid.nl/BWBR0009534/2003-03-05#Artikel5
  - number: BII:12, eerste lid
    text: |-
      Vaststellen dat de subsidieontvanger het bedrag van de subsidie naar rato heeft doorbetaald aan of verrekend met de
      ondernemers die de premie verschuldigd zijn.
    url: https://wetten.overheid.nl/BWBR0009534/2003-03-05#Artikel12_eerste_lid
  - number: BII:12, tweede lid
    text: |-
      Vaststellen dat de subsidieontvanger heeft voldaan aan eventuele andere verplichtingen die de minister heeft
      opgelegd.
    url: https://wetten.overheid.nl/BWBR0009534/2003-03-05#Artikel12_tweede_lid
  - number: BII:16, eerste lid
    text: |-
      Vaststellen dat de in ter verkrijging van voorschotten ingediende overzichten van de liquiditeitsbehoefte opgenomen
      informatie toereikend is.

      Onder normale aandacht wordt verstaan: controle met een diepgang die gebruikelijk is voor het afgeven van een
      accountantsverklaring bij een verantwoording.

      Onder speciale aandacht wordt verstaan: controle waarbij nadrukkelijk wordt bezien of de desbetreffende
      voorschriften zijn nageleefd. In dit geval moet dus verder worden gegaan dan normaal bij een controle van een
      verantwoording.

      Aan de niet genoemde artikelen behoeft bij de controle geen aandacht te worden besteed, met dien verstande dat,
      teneinde de controle op de hierboven genoemde artikelen goed te kunnen verrichten, kennisneming van deze overige
      artikelen noodzakelijk is.

      Voorzover de subsidiebepalingen niet zijn nageleefd maakt de accountant hiervan melding in zijn verklaring.

      De minister behoudt zich het recht voor om de Accountantsdienst van het Ministerie van Landbouw, Natuurbeheer en
      Visserij een review te laten uitvoeren op de door de accountant van de aanvrager, aan wie de subsidie ingevolge de
      Subsidieregeling nieuwe agrarische schadeverzekeringen is verleend, verrichte werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0009534/2003-03-05#Artikel16_eerste_lid
  - number: BIII:4
    text: |-
      Vaststellen dat:

        - het premie-inkomen opgenomen in de opgaaf van de premies betrekking heeft op verzekeringsovereenkomsten voor de
      categorie van risico's zoals omschreven in artikel 4, vierde lid.
        - de verzekerde schade en de optredende productieverliezen in Nederland optreden;
        - de subsidieontvanger niet vóór 1 januari 2003 de bedoelde verzekeringsovereenkomsten reeds aanbood of dat deze
      categorieën van risico's onder gebruikelijke voorwaarden niet verzekerbaar waren.
        - De subsidieontvanger niet reeds voor hetzelfde of een vergelijkbaar risico vanwege de staat, een andere
      overheidsorgaan of de Europese Gemeenschap een subsidie is verleend.
    url: https://wetten.overheid.nl/BWBR0009534/2003-03-05#Artikel4
  - number: BIII:5
    text: |-
      Vaststellen dat het premie-inkomen betrekking heeft op een verzekeringsperiode van één jaar, verschuldigd in het
      jaar, gerekend vanaf de datum van de eerste aanbieding van de verzekering.
    url: https://wetten.overheid.nl/BWBR0009534/2003-03-05#Artikel5
  - number: BIII:6a
    text: |-
      Vaststellen dat de subsidieontvanger de subsidie alleen heeft gebruikt voor de overeenkomsten van schadeverzekering
      die passen binnen de nadere voorwaarden, die door de minister op grond van artikel 6a bij besluit als bedoeld in
      artikel 6, eerste lid, heeft bepaald.
    url: https://wetten.overheid.nl/BWBR0009534/2003-03-05#Artikel6a
  - number: BIII:12,
    text: |-
      Vaststellen dat de subsidieontvanger heeft voldaan aan eventuele andere verplichtingen die de minister heeft
      opgelegd.

      Onder normale aandacht wordt verstaan:

        - Controle met een diepgang die gebruikelijk is voor het afgeven van een accountantsverklaring bij een
      verantwoording.

      Onder speciale aandacht wordt verstaan:

        - Controle waarbij nadrukkelijk wordt bezien of de desbetreffende voorschriften zijn nageleefd. In dit geval moet
      dus verder worden gegaan dan normaal bij een controle van een verantwoording.
        - Aan de niet genoemde artikelen behoeft bij de controle geen aandacht te worden besteed, met dien verstande dat,
      teneinde de controle op de hierboven genoemde artikelen goed te kunnen verrichten, kennisneming van deze overige
      noodzakelijk is. Voor zover de subsidiebepalingen niet zijn nageleefd, maakt de accountant hiervan melding in
      zijn verklaring. De minister behoudt zich het recht voor om de Accountantsdienst van het Ministerie van Landbouw,
      Natuurbeheer en Visserij een review te laten uitvoeren op de door de accountant van de aanvrager, aan wie de
      subsidie ingevolge de Subsidieregeling nieuwe agrarische schadeverzekeringen is verleend, verrichte werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0009534/2003-03-05#Artikel12
