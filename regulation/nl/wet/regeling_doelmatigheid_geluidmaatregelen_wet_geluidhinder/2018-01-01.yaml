preamble:
  text: |-
    Gelet op de artikelen 87b, vierde en vijfde lid, en 106, vierde lid, van de Wet geluidhinder en de artikelen 3.9 en
    4.22 van het Besluit geluidhinder;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0026996/2018-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *bronmaatregel:* geluidbeperkende maatregel als bedoeld in tabel 1 en
      tabel 3, onder 1, van [Bijlage 1][ref1];
        - *cluster:* geluidsgevoelig object of verzameling bijeengelegen geluidsgevoelige objecten, gelegen binnen de zone
      van een weg of spoorweg, die een relevante verlaging van de geluidsbelasting vanwege een weg of spoorweg zou kunnen
      ondervinden van een aaneengesloten geluidbeperkende maatregel;
        - *geluidbeperkende maatregel:* maatregel of combinatie van maatregelen als bedoeld in de tabellen 1, 2 en 3 van
      [Bijlage 1][ref2], indien en voor zover toegepast onder de in die tabellen genoemde voorwaarden;
        - *geluidsgevoelig object:* woning, ander geluidsgevoelig gebouw, woonwagenstandplaats en ligplaats voor een
      woonschip;
        - *geluidreductie:* geluidreductie bepaald overeenkomstig [artikel 7][ref3];
        - *ligplaats voor een woonschip:* ligplaats in het water, bestemd om door een woonschip te worden ingenomen;
        - *maatregelpunt:* rekeneenheid waarin de kosten voor het treffen van een geluidbeperkende maatregel zijn
      uitgedrukt;
        - *overdrachtsmaatregel:* geluidbeperkende maatregel als bedoeld in tabel 2 van [Bijlage 1][ref4];
        - *reductiepunt:* rekeneenheid waarin het budget van een cluster voor het treffen van geluidbeperkende maatregelen
      is uitgedrukt;
        - *Saneringsobject:* een geluidsgevoelig object waarvoor niet eerder een hogere waarde op grond van de
      [Wet geluidhinder][ref5], de [Interimwet stad-en-milieubenadering][ref6] of de [Spoedwet wegverbreding][ref7]
      is vastgesteld, dat is gelegen binnen de zone van een te wijzigen of verbreden hoofdweg of landelijke spoorweg
      op grond van de [Tracéwet][ref8] en waar de geluidsbelasting: a. vanwege de hoofdweg of vanwege binnen het
      tracé van de hoofdweg of de landelijke spoorweg gelegen wegen op 1 maart 1986, van de gevel van de woning of
      ander geluidsgevoelig gebouw op dat tijdstip, onderscheidenlijk na ingebruikneming van de hoofdweg of binnen het
      tracé van de hoofdweg of de landelijke spoorweg gelegen wegen, hoger was dan 60 dB(A); b. vanwege de landelijke
      spoorweg of vanwege binnen het tracé van de landelijke spoorweg of de hoofdweg gelegen spoorwegen op 1 juli 1987,
      van de gevel van de woning of aan de rand van het geluidsgevoelige terrein op dat tijdstip, onderscheidenlijk na
      ingebruikneming van de landelijke spoorweg of binnen het tracé van de landelijke spoorweg of de hoofdweg gelegen
      spoorwegen, hoger was dan 65 dB(A), of c. vanwege de landelijke spoorweg of vanwege binnen het tracé van de
      landelijke spoorweg of de hoofdweg gelegen spoorwegen op 1 juli 1987, van de gevel van het andere geluidsgevoelige
      gebouw, onderscheidenlijk na ingebruikneming van de landelijke spoorweg of binnen het tracé van de landelijke
      spoorweg of de hoofdweg gelegen spoorwegen, hoger was dan 60 dB(A);
        - *situatie zonder maatregelen:* situatie waarin geen geluidbeperkende maatregelen aanwezig zijn en: a. een
      weg een wegdek heeft met de akoestische kwaliteit van dicht asfaltbeton, dan wel het wegdek heeft dat feitelijk
      aanwezig is, indien dit tot een hogere geluidsbelasting leidt dan dicht asfaltbeton; b. een spoorweg een
      bovenbouwconstructie heeft van langgelast spoor op houten dwarsliggers, dan wel de bovenbouwconstructie heeft
      die feitelijk aanwezig is indien deze tot een hogere geluidsbelasting leidt dan langgelast spoor op houten
      dwarsliggers;
        - *woonwagenstandplaats:* standplaats als bedoeld in [artikel 1, onderdeel j, van de Wet op de huurtoeslag][ref9].


