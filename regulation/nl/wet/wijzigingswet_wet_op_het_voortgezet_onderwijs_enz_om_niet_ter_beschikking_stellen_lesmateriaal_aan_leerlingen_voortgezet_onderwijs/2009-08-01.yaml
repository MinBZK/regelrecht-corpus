preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is dat lesmateriaal dat is voorgeschreven voor het volgen
    van voortgezet onderwijs in een specifiek leerjaar, elk jaar door de scholen in het voortgezet onderwijs om niet
    aan de leerlingen ter beschikking wordt gesteld;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0023971/2009-08-01#ArtikelAanhef
articles:
  - number: VI.1
    text: |-
      Aan bij ministeriële regeling aan te wijzen categorieën van leerlingen in het voortgezet onderwijs als
      bedoeld in de [Wet op het voortgezet onderwijs][ref1] of aan hun wettelijk vertegenwoordiger verstrekt de
      Staatssecretaris van Onderwijs, Cultuur en Wetenschap die het aangaat, volgens bij die regeling te geven
      regels, een bij die regeling te bepalen tegemoetkoming ten behoeve van aanschaf of huur van lesmateriaal
      als bedoeld in [artikel I, onderdeel A][ref2], bestemd voor gebruik in het schooljaar 2008–2009. De in
      de eerste volzin bedoelde tegemoetkoming kan worden verstrekt door de Informatie Beheer Groep, bedoeld
      in de [Wet verzelfstandiging Informatiseringsbank][ref3], of de Sociale verzekeringsbank, bedoeld in
      [artikel 1, onderdeel f, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0023971#ArtikelI
      [ref3]: https://wetten.overheid.nl/BWBR0006320
      [ref4]: https://wetten.overheid.nl/BWBR0013060#Artikel1
    url: https://wetten.overheid.nl/BWBR0023971/2009-08-01#ArtikelVI
    references:
      - id: ref1
        bwb_id: BWBR0002399
      - id: ref2
