        bwb_id: BWBR0007625
  - number: VI.3
    text: 'Indien twee natuurlijke personen voldoen aan het begrip wettelijk vertegenwoordiger, wordt daaronder verstaan:'
    url: https://wetten.overheid.nl/BWBR0023971/2009-08-01#ArtikelVI
  - number: VI.3.a
    text: |-
      wettelijk vertegenwoordiger die over het derde kwartaal van 2008 ten behoeve van de leerling kinderbijslag als
      bedoeld in de [Algemene Kinderbijslagwet][ref1] heeft ontvangen,


      [ref1]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0023971/2009-08-01#ArtikelVI
    references:
      - id: ref1
        bwb_id: BWBR0002368
  - number: VI.3.b
    text: |-
      indien onderdeel a niet van toepassing is: wettelijk vertegenwoordiger bij wie de leerling op 1 augustus blijkens
      de gemeentelijke basisadministratie persoonsgegevens woont, of
    url: https://wetten.overheid.nl/BWBR0023971/2009-08-01#ArtikelVI
  - number: VI.3.c
    text: |-
      indien de onderdelen a en b niet van toepassing zijn: wettelijk vertegenwoordiger die de wettelijke
      vertegenwoordigers gezamenlijk daartoe hebben aangewezen.
    url: https://wetten.overheid.nl/BWBR0023971/2009-08-01#ArtikelVI
  - number: VI.4
    text: |-
      De tegemoetkoming, bedoeld in het eerste lid, blijft buiten beschouwing bij de verlening van andere op het inkomen
      of vermogen afgestemde publiekrechtelijke uitkeringen en verstrekkingen.
    url: https://wetten.overheid.nl/BWBR0023971/2009-08-01#ArtikelVI
  - number: VI.6
    text: |-
      De tegemoetkoming, bedoeld in het eerste lid, is niet vatbaar voor vervreemding, verpanding, belening en beslag,
      waaronder begrepen beslag ingevolge faillissement of toepassing van de schuldsaneringsregeling natuurlijke
      personen.
    url: https://wetten.overheid.nl/BWBR0023971/2009-08-01#ArtikelVI
  - number: VI.7
    text: Elk beding, strijdig met het voorgaande lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0023971/2009-08-01#ArtikelVI
  - number: VIa.1
    text: |-
      Onze Minister van Onderwijs, Cultuur en Wetenschap zendt in overeenstemming met Onze Minister van Landbouw,
      Natuur en Voedselkwaliteit in 2011, en vervolgens telkens na vier jaar, aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk. Hierin wordt in ieder geval aandacht besteed aan:
    url: https://wetten.overheid.nl/BWBR0023971/2009-08-01#ArtikelVIa
  - number: VIa.1.a
    text: de ontwikkeling van de kosten van het lesmateriaal in relatie tot de hoogte van het bedrag per leerling;
    url: https://wetten.overheid.nl/BWBR0023971/2009-08-01#ArtikelVIa
  - number: VIa.1.b
    text: de ontwikkeling van de bijkomende schoolkosten voor de ouders;
    url: https://wetten.overheid.nl/BWBR0023971/2009-08-01#ArtikelVIa
  - number: VIa.1.c
    text: de beoogde verbetering van de marktwerking op de educatieve boekenmarkt;
    url: https://wetten.overheid.nl/BWBR0023971/2009-08-01#ArtikelVIa
  - number: VIa.1.d
    text: de keuzevrijheid op scholen tot het voorschrijven van lesmateriaal; en
    url: https://wetten.overheid.nl/BWBR0023971/2009-08-01#ArtikelVIa
  - number: VIa.1.e
    text: de gevolgen van Europese aanbestedingen in het kader van deze wet.
    url: https://wetten.overheid.nl/BWBR0023971/2009-08-01#ArtikelVIa
  - number: VIa.2
    text: |-
      In het koninklijk besluit, bedoeld in [artikel VII, eerste lid, onder c][ref1], kan worden bepaald dat in het
      eerste lid «2011» wordt vervangen door: 2012.


