        artikel: '1'
  - number: VI.2
    text: |-
      De leerling op wie de tegemoetkoming betrekking heeft, dient op de teldatum 1 oktober 2008 als werkelijk
      schoolgaand te zijn ingeschreven aan een school voor voortgezet onderwijs die wordt bekostigd op grond
      van de [Wet op het voortgezet onderwijs][ref1] of aan een agrarisch opleidingscentrum als bedoeld in de
      [Wet educatie en beroepsonderwijs][ref2] voor zover het het daarin verzorgde voorbereidend beroepsonderwijs
      betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0023971/2009-08-01#ArtikelVI
    references:
      - id: ref1
        bwb_id: BWBR0002399
