---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_veiligheidsonderzoeken
regulatory_layer: WET
publication_date: '2025-10-30'
valid_from: '2015-09-01'
bwb_id: BWBR0008277
url: https://wetten.overheid.nl/BWBR0008277/2015-09-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe regelen te stellen ter zake van het verrichten
    van veiligheidsonderzoeken;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel1
  - number: 1.1.a
    text: |-
      vertrouwensfunctie: een functie die krachtens [artikel 3, eerste lid][ref1], als zodanig is aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0008277#Artikel3
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008277
        artikel: '3'
  - number: 1.1.b
    text: |-
      verklaring: een verklaring dat uit het oogpunt van de nationale veiligheid geen bezwaar bestaat tegen vervulling
      van een bepaalde vertrouwensfunctie door een bepaalde persoon;
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel1
  - number: 1.1.c
    text: |-
      Onze Minister: Onze Minister die verantwoordelijk is voor het beleidsterrein waartoe een vertrouwensfunctie, gezien
      de aard daarvan, behoort;
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel1
  - number: 1.1.d
    text: |-
      bevoegd gezag van een Hoog College van Staat: de voorzitter van de Tweede Kamer der Staten-Generaal, de voorzitter
      van de Eerste Kamer der Staten-Generaal, de vice-president van de Raad van State, de Algemene Rekenkamer of de
      Nationale ombudsman, voor zover het betreft een functie bij de Tweede Kamer, de Eerste Kamer, de Raad van State, de
      Algemene Rekenkamer, respectievelijk het bureau van de Nationale Ombudsman.
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel1
  - number: '1.2'
    text: 'In deze wet wordt onder werkgever verstaan:'
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel1
  - number: 1.2.a
    text: |-
      degene jegens wie een ander krachtens arbeidsovereenkomst of publiekrechtelijke aanstelling gehouden is tot het
      verrichten van arbeid, behalve indien die ander aan een derde ter beschikking wordt gesteld voor het verrichten van
      arbeid, welke die derde gewoonlijk doet verrichten;
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel1
  - number: 1.2.b
    text: degene aan wie een ander ter beschikking wordt gesteld voor het verrichten van arbeid als bedoeld onder *a*.
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel1
  - number: '1.3'
    text: |-
      In deze wet wordt mede onder werkgever verstaan degene die, zonder werkgever te zijn in de zin van het tweede lid,
      een ander een vertrouwensfunctie laat vervullen en die bij de aanwijzing, bedoeld in [artikel 3, eerste lid][ref1],
      als zodanig wordt aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0008277#Artikel3
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008277
        artikel: '3'
  - number: '2'
    text: |-
      Indien een vertrouwensfunctie wordt uitgeoefend bij het Ministerie van Defensie, dan wel indien het een functie
      betreft die als vertrouwensfunctie moet worden aangemerkt in verband met de daarmee samenhangende noodzaak om
      toegang te hebben tot militaire installaties, treden, voor de toepassing van het bepaalde in de [artikelen 3][ref1]
      tot en met [10][ref2] en [16, tweede lid][ref3], Onze Minister van Defensie en de Militaire Inlichtingen- en
      Veiligheidsdienst in de plaats van respectievelijk Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties en
      de Algemene Inlichtingen- en Veiligheidsdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0008277#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008277#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0008277#Artikel16
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008277
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0008277
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0008277
        artikel: '16'
  - number: '3.1'
    text: |-
      Onze Minister dan wel het bevoegd gezag van een Hoog College van Staat wijst, in overeenstemming met Onze Minister
      van Binnenlandse Zaken en Koninkrijksrelaties, functies die de mogelijkheid bieden de nationale veiligheid te
      schaden aan als vertrouwensfuncties. Onze Minister dan wel het bevoegd gezag van een Hoog College van Staat doet
      van de aanwijzing terstond mededeling aan de werkgever die het aangaat. Indien geen sprake is van een werkgever in
      de zin van [artikel 1, tweede lid][ref1], wordt in de aanwijzing tevens aangegeven wie als werkgever in de zin van
      deze wet wordt aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0008277#Artikel1
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008277
        artikel: '1'
  - number: '3.2'
    text: |-
      De werkgever, of degene ten aanzien van wie het voornemen bestaat hem als zodanig aan te merken overeenkomstig
      het eerste lid, derde volzin, geeft desgevraagd aan Onze Minister dan wel het bevoegd gezag van een Hoog College
      van Staat en aan het hoofd van de Algemene Inlichtingen- en Veiligheidsdienst de inlichtingen over de inrichting
      van zijn dienst, bedrijf of instelling, die nodig zijn voor de beoordeling van de mate waarin een functie de
      mogelijkheid biedt de nationale veiligheid te schaden.
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel3
  - number: '3.3'
    text: |-
      Nadat een functie als vertrouwensfunctie is aangewezen geeft de betrokken werkgever uit eigen beweging aan Onze
      Minister dan wel het bevoegd gezag van een Hoog College van Staat en aan het hoofd van de Algemene Inlichtingen-
      en Veiligheidsdienst de inlichtingen over wijzigingen in de inrichting van zijn dienst, bedrijf of instelling,
      die nodig zijn voor de beoordeling van de mate waarin die functie of andere functies de mogelijkheid bieden de
      nationale veiligheid te schaden.
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel3
  - number: '3.4'
    text: |-
      Onze Minister dan wel het bevoegd gezag van een Hoog College van Staat draagt er zorg voor dat binnen vijf jaren
      na de aanwijzing van een functie als vertrouwensfunctie en vervolgens telkens na vijf jaren wordt nagegaan of de
      aanwijzing gehandhaafd moet blijven.
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel3
  - number: '4.1'
    text: |-
      De werkgever meldt een persoon die hij wil belasten met de vervulling van een vertrouwensfunctie aan bij het hoofd
      van de Algemene Inlichtingen- en Veiligheidsdienst.
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel4
  - number: '4.2'
    text: |-
      De in het eerste lid bedoelde aanmelding geschiedt slechts met schriftelijke instemming van de betrokkene. De
      werkgever licht de betrokkene in over de betekenis en de rechtsgevolgen van deze aanmelding.
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel4
  - number: '4.3'
    text: |-
      De werkgever belast een persoon eerst met de vervulling van een vertrouwensfunctie, nadat Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties ten aanzien van die persoon een verklaring heeft afgegeven.
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel4
  - number: '5.1'
    text: |-
      De werkgever meldt een persoon die belast is met de vervulling van een functie die nadien als vertrouwensfunctie is
      aangewezen, zo spoedig mogelijk, doch uiterlijk binnen vier weken na de dagtekening van het aanwijzingsbesluit aan
      bij het hoofd van de Algemene Inlichtingen- en Veiligheidsdienst.
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel5
  - number: '5.2'
    text: |-
      De in het eerste lid bedoelde aanmelding geschiedt slechts met schriftelijke instemming van de betrokkene. De
      werkgever licht de betrokkene in over de betekenis en de rechtsgevolgen van deze aanmelding.
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel5
  - number: '5.3'
    text: |-
      Indien de in het tweede lid bedoelde instemming is geweigerd of indien ten aanzien van de betrokkene een verklaring
      is geweigerd, ontheft de werkgever de betrokkene zo spoedig mogelijk, doch uiterlijk binnen acht weken, uit de
      functie.
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel5
  - number: '6.1'
    text: |-
      In de gevallen als bedoeld in [artikel 4][ref1] en [5][ref2] beslist Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties zo spoedig mogelijk, doch uiterlijk binnen acht weken, omtrent het afgeven van een verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0008277#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008277#Artikel5
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008277
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0008277
        artikel: '5'
  - number: '6.2'
    text: |-
      De termijn voor het geven van een beschikking wordt opgeschort met ingang van de dag waarop Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties de betrokkene uitnodigt nadere gegevens te verstrekken, tot de dag waarop
      die gegevens zijn ontvangen of de voor verstrekking gestelde termijn ongebruikt is verstreken.
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel6
  - number: '7.1'
    text: |-
      Alvorens een verklaring wordt afgegeven of geweigerd, wordt ten aanzien van de betrokken persoon door de Algemene
      Inlichtingen- en Veiligheidsdienst een veiligheidsonderzoek ingesteld.
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel7
  - number: '7.2'
    text: |-
      Het veiligheidsonderzoek omvat het instellen van een onderzoek naar gegevens die uit het oogpunt van de nationale
      veiligheid van belang zijn voor de vervulling van de desbetreffende vertrouwensfunctie. Hierbij wordt uitsluitend
      gelet op:
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel7
  - number: 7.2.a
    text: |-
      justitiële en strafvorderlijke gegevens als bedoeld in de [Wet justitiële en strafvorderlijke gegevens][ref1] en
      gegevens als bedoeld in de Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag BES alsmede
      van gegevens als bedoeld in de [Wet politiegegevens][ref2] en van gegevens verwerkt in het kader van de uitvoering
      van de politietaak op Bonaire, Sint Eustatius en Saba;


      [ref1]: https://wetten.overheid.nl/BWBR0014194
      [ref2]: https://wetten.overheid.nl/BWBR0022463
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0014194
      - id: ref2
        bwb_id: BWBR0022463
  - number: 7.2.b
    text: gegevens betreffende deelneming of steunverlening aan activiteiten die de nationale veiligheid kunnen schaden;
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel7
  - number: 7.2.c
    text: |-
      gegevens betreffende lidmaatschap van of steunverlening aan organisaties die doeleinden nastreven, dan wel ter
      verwezenlijking van hun doeleinden middelen hanteren, die aanleiding geven tot het ernstige vermoeden dat zij een
      gevaar vormen voor het voortbestaan van de democratische rechtsorde;
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel7
  - number: 7.2.d
    text: |-
      gegevens betreffende overige persoonlijke gedragingen en omstandigheden, naar aanleiding waarvan betwijfeld mag
      worden of de betrokkene de uit de vertrouwensfunctie voortvloeiende plichten onder alle omstandigheden getrouwelijk
      zal volbrengen.
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel7
  - number: '8'
    text: |-
      Een verklaring kan slechts worden geweigerd, indien onvoldoende waarborgen aanwezig zijn dat de betrokkene onder
      alle omstandigheden de uit de vertrouwensfunctie voortvloeiende plichten getrouwelijk zal volbrengen of indien het
      veiligheidsonderzoek onvoldoende gegevens heeft kunnen opleveren om daarover een oordeel te geven.
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel8
  - number: '9.1'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties is bevoegd, na het verstrijken van een termijn van vijf
      jaren of een veelvoud daarvan sinds het afgeven van de verklaring of indien hem blijkt van feiten of omstandigheden
      die een hernieuwd veiligheidsonderzoek rechtvaardigen, een veiligheidsonderzoek te doen instellen naar een persoon
      die een vertrouwensfunctie vervult. Voor het instellen van een hernieuwd veiligheidsonderzoek is de instemming van
      de betrokkene niet vereist.
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel9
  - number: '9.2'
    text: |-
      Onder feiten en omstandigheden als bedoeld in het eerste lid kunnen worden gerekend gegevens die de Algemene
      Inlichtingen- en Veiligheidsdienst heeft verkregen door het verzamelen van justitiële en strafvorderlijke gegevens
      als bedoeld in de [Wet justitiële en strafvorderlijke gegevens][ref1] en van gegevens als bedoeld in de Wet op
      de justitiële documentatie en op de verklaringen omtrent het gedrag BES alsmede van gegevens als bedoeld in de
      [Wet politiegegevens][ref2] en van gegevens verwerkt in het kader van de uitvoering van de politietaak op Bonaire,
      Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0014194
      [ref2]: https://wetten.overheid.nl/BWBR0022463
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0014194
      - id: ref2
        bwb_id: BWBR0022463
  - number: 9a.1
    text: |-
      De kosten die samenhangen met het verrichten van een veiligheidsonderzoek als bedoeld in de [artikelen 7][ref1] en
      [9][ref2] komen ten laste van de werkgever.


      [ref1]: https://wetten.overheid.nl/BWBR0008277#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008277#Artikel9
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0008277
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0008277
        artikel: '9'
  - number: 9a.2
    text: |-
      De bedragen ter vergoeding van de kosten worden bij regeling van Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel9a
  - number: '10.1'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties is bevoegd tot het intrekken van de verklaring,
      indien hem blijkt dat onvoldoende waarborgen aanwezig zijn dat de betrokkene onder alle omstandigheden de uit de
      vertrouwensfunctie voortvloeiende plichten getrouwelijk zal volbrengen of indien een nieuw veiligheidsonderzoek
      onvoldoende gegevens heeft kunnen opleveren om vast te stellen dat voldoende waarborgen aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel10
  - number: '10.2'
    text: |-
      Indien een verklaring is ingetrokken, ontheft de werkgever de betrokken persoon zo spoedig mogelijk, doch uiterlijk
      binnen acht weken na de intrekking van de verklaring, uit de vertrouwensfunctie.
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel10
  - number: '11'
    text: |-
      Deze wet is niet van toepassing op de leden van de rechterlijke macht met rechtspraak belast, de procureur-generaal
      bij de Hoge Raad, de leden van de Raad van State, de leden van de Algemene Rekenkamer, de Nationale ombudsman en
      de substituut-ombudsman, de leden van de Centrale Raad van Beroep en de leden van het College van Beroep voor het
      bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel11
  - number: '12.1'
    text: |-
      [Artikel 4, tweede lid][ref1], is niet van toepassing in gevallen waarin een persoon met
      een vertrouwensfunctie wordt belast in het kader van de vervulling van werkelijke dienst
      in de zin van [paragraaf 5 van hoofdstuk 1 van de Kaderwet dienstplicht][ref2] of van
      [hoofdstuk VII van de Dienstplichtwet BES][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008277#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008589#Paragraaf5
      [ref3]: https://wetten.overheid.nl/BWBR0028468#HoofdstukVII
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008277
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0008589
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0028468
        hoofdstuk: VII
  - number: '12.2'
    text: |-
      In de gevallen, bedoeld in het eerste lid, wordt het veiligheidsonderzoek niet eerder ingesteld
      dan twaalf weken voordat de betrokkene dient op te komen voor het vervullen van werkelijke
      dienst in de zin van [paragraaf 5 van hoofdstuk 1 van de Kaderwet dienstplicht][ref1] of van
      [hoofdstuk VII van de Dienstplichtwet BES][ref2]. Van het instellen van een veiligheidsonderzoek wordt vooraf
      mededeling gedaan aan de betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0008589#Paragraaf5
      [ref2]: https://wetten.overheid.nl/BWBR0028468#HoofdstukVII
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008589
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0028468
        hoofdstuk: VII
  - number: '13.1'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan, naar aanleiding van een verzoek van een andere
      mogendheid of van een volkenrechtelijke organisatie dat wordt gedaan in verband met de door die mogendheid of
      volkenrechtelijke organisatie gehanteerde beveiligingsmaatregelen, over een in dat verzoek aangeduide persoon
      mededelingen doen.
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel13
  - number: '13.2'
    text: |-
      De mededelingen, bedoeld in het eerste lid, worden slechts gedaan over personen die de Nederlandse nationaliteit
      bezitten dan wel, indien zij een andere nationaliteit bezitten, die in Nederland verblijven of daar recentelijk
      verblijf gehouden hebben. De desbetreffende personen worden schriftelijk in kennis gesteld van de zakelijke inhoud
      van deze mededelingen. Deze kennisgeving geldt als een beschikking.
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel13
  - number: '13.3'
    text: |-
      Indien Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties voornemens is mededelingen als bedoeld in het
      eerste lid te doen, wordt ten aanzien van de betrokken persoon door de Algemene Inlichtingen- en Veiligheidsdienst
      een veiligheidsonderzoek ingesteld, mits de betrokkene daarmee schriftelijk heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel13
  - number: '13.4'
    text: |-
      Het veiligheidsonderzoek omvat het instellen van een onderzoek naar gegevens die uit het oogpunt van de nationale
      veiligheid of de veiligheid of andere gewichtige belangen van de verzoekende mogendheid of volkenrechtelijke
      organisatie van belang zijn. Hierbij wordt uitsluitend gelet op:
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel13
  - number: 13.4.a
    text: |-
      justitiële en strafvorderlijke gegevens als bedoeld in de [Wet justitiële en strafvorderlijke gegevens][ref1] en
      gegevens als bedoeld in de Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag BES alsmede
      van gegevens als bedoeld in de [Wet politiegegevens][ref2] en van gegevens verwerkt in het kader van de uitvoering
      van de politietaak op Bonaire, Sint Eustatius en Saba;


      [ref1]: https://wetten.overheid.nl/BWBR0014194
      [ref2]: https://wetten.overheid.nl/BWBR0022463
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0014194
      - id: ref2
        bwb_id: BWBR0022463
  - number: 13.4.b
    text: |-
      gegevens betreffende deelneming of steunverlening aan activiteiten die de nationale veiligheid en van de
      verzoekende mogendheid of volkenrechtelijke organisatie kunnen schaden;
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel13
  - number: 13.4.c
    text: |-
      gegevens betreffende lidmaatschap van of steunverlening aan organisaties die doeleinden nastreven, dan wel ter
      verwezenlijking van hun doeleinden middelen hanteren, die aanleiding geven tot het ernstige vermoeden dat zij een
      gevaar vormen voor het voortbestaan van de democratische rechtsorde;
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel13
  - number: 13.4.d
    text: |-
      gegevens betreffende overige persoonlijke gedragingen en omstandigheden die in verband met het doel van het verzoek
      van belang kunnen zijn.
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel13
  - number: '13.5'
    text: |-
      De mededelingen, bedoeld in het eerste lid, bevatten de conclusies die uit het ingestelde veiligheidsonderzoek
      kunnen worden getrokken, dan wel de vaststelling dat het onderzoek onvoldoende gegevens heeft opgeleverd om op
      basis daarvan conclusies te kunnen trekken of dat de betrokken persoon niet heeft ingestemd met het instellen van
      een veiligheidsonderzoek.
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel13
  - number: '13.6'
    text: |-
      Indien een verzoek als bedoeld in het eerste lid betrekking heeft op een persoon ten aanzien van wie een verklaring
      is afgegeven, wordt op het verzoek beslist door Onze Minister die de verklaring heeft afgegeven. In zulke gevallen
      kan een veiligheidsonderzoek achterwege worden gelaten. De mededelingen, bedoeld in het eerste lid, bevatten in
      zulke gevallen de vaststelling dat ten aanzien van de betrokken persoon een verklaring is afgegeven.
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel13
  - number: '14.1'
    text: |-
      Hij die niet of niet tijdig voldoet aan een in de [artikelen 3, tweede en derde lid][ref1],
      [4, eerste en derde lid][ref2], [5, eerste en derde lid][ref3], en [10, tweede lid][ref4], opgenomen verplichting,
      wordt gestraft met hechtenis van ten hoogste drie maanden of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0008277#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008277#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0008277#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0008277#Artikel10
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008277
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0008277
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0008277
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0008277
        artikel: '10'
  - number: '14.2'
    text: De in het eerste lid strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel14
  - number: '15'
    text: |-
      Functies die vóór de inwerkingtreding van deze wet als vertrouwensfunctie zijn aangewezen, worden gelijkgesteld met
      op grond van [artikel 3][ref1] aangewezen vertrouwensfuncties.


      [ref1]: https://wetten.overheid.nl/BWBR0008277#Artikel3
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008277
        artikel: '3'
  - number: '16.1'
    text: |-
      Een persoon die op het tijdstip van inwerkingtreding van deze wet belast is met een vertrouwensfunctie,
      wordt gelijkgesteld met een persoon ten aanzien van wie op dat tijdstip een verklaring als bedoeld in
      [artikel 4, derde lid][ref1], en 6 is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0008277#Artikel4
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008277
        artikel: '4'
  - number: '16.2'
    text: |-
      In afwijking van [artikel 9][ref1] is Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties gedurende vijf
      jaren na het tijdstip van inwerkingtreding van deze wet ten aanzien van een persoon als bedoeld in het eerste lid
      tevens bevoegd een hernieuwd veiligheidsonderzoek te doen instellen, indien sinds het laatste ten aanzien van die
      persoon ingestelde veiligheidsonderzoek een termijn van vijf jaren is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0008277#Artikel9
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008277
        artikel: '9'
  - number: 16a.1
    text: Deze wet is mede van toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel16a
  - number: 16a.2
    text: |-
      Indien een besluit op grond van deze wet is gericht op een natuurlijke of een rechtspersoon, die woonplaats
      heeft onderscheidenlijk is gevestigd in de openbare lichamen Bonaire, Sint Eustatius of Saba, kan een natuurlijke
      persoon of een rechtspersoon, die door het besluit rechtstreeks in zijn belang is getroffen, beroep instellen bij
      het Gerecht in eerste aanleg van Bonaire, Sint Eustatius en Saba. De Wet administratieve rechtspraak BES is van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel16a
  - number: '22'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel22
  - number: '23'
    text: 'Deze wet kan worden aangehaald als: Wet veiligheidsonderzoeken.'
    url: https://wetten.overheid.nl/BWBR0008277/2015-09-01#Artikel23
