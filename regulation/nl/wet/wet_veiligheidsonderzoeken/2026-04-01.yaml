preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe regelen te stellen ter zake van het verrichten
    van veiligheidsonderzoeken;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008277/2026-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet wordt verstaan onder:

      a. vertrouwensfunctie: een functie die krachtens [artikel 3, eerste lid][ref1], als zodanig is aangewezen;

      b. verklaring: een verklaring dat uit het oogpunt van de nationale veiligheid geen bezwaar bestaat tegen vervulling
      van een bepaalde vertrouwensfunctie door een bepaalde persoon;

      c. Onze Minister: Onze Minister die verantwoordelijk is voor het beleidsterrein waartoe een vertrouwensfunctie,
      gezien de aard daarvan, behoort;

      d. bevoegd gezag van een Hoog College van Staat: de voorzitter van de Tweede Kamer der Staten-Generaal, de
      voorzitter van de Eerste Kamer der Staten-Generaal, de vice-president van de Raad van State, de Algemene Rekenkamer
      of de Nationale ombudsman, voor zover het betreft een functie bij de Tweede Kamer, de Eerste Kamer, de Raad van
      State, de Algemene Rekenkamer, respectievelijk het bureau van de Nationale Ombudsman;

      e. register: het register, bedoeld in [artikel 10a][ref2].

      2 In deze wet wordt onder werkgever verstaan:

      a. degene jegens wie een ander krachtens arbeidsovereenkomst of publiekrechtelijke aanstelling gehouden is tot het
      verrichten van arbeid, behalve indien die ander aan een derde ter beschikking wordt gesteld voor het verrichten van
      arbeid, welke die derde gewoonlijk doet verrichten;

      b. degene aan wie een ander ter beschikking wordt gesteld voor het verrichten van arbeid als bedoeld onder *a*.

      3 In deze wet wordt mede onder werkgever verstaan degene die, zonder werkgever te zijn in de zin van
      het tweede lid, een ander een vertrouwensfunctie laat vervullen en die bij de aanwijzing, bedoeld in
      [artikel 3, eerste lid][ref3], als zodanig wordt aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0008277#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008277#Artikel10a
      [ref3]: https://wetten.overheid.nl/BWBR0008277#Artikel3
