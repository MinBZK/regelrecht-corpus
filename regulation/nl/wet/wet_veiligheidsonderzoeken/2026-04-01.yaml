  - number: '13'
    text: |-
      1 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan, naar aanleiding van een verzoek van een andere
      mogendheid of van een volkenrechtelijke organisatie dat wordt gedaan in verband met de door die mogendheid of
      volkenrechtelijke organisatie gehanteerde beveiligingsmaatregelen, over een in dat verzoek aangeduide persoon
      mededelingen doen.

      2 De mededelingen, bedoeld in het eerste lid, worden slechts gedaan over personen die de Nederlandse nationaliteit
      bezitten dan wel, indien zij een andere nationaliteit bezitten, die in Nederland verblijven of daar recentelijk
      verblijf gehouden hebben. De desbetreffende personen worden schriftelijk in kennis gesteld van de zakelijke inhoud
      van deze mededelingen. Deze kennisgeving geldt als een beschikking.

      3 Indien Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties voornemens is mededelingen als bedoeld in het
      eerste lid te doen, wordt ten aanzien van de betrokken persoon door de Algemene Inlichtingen- en Veiligheidsdienst
      een veiligheidsonderzoek ingesteld, mits de betrokkene daarmee schriftelijk heeft ingestemd.

      4 Het veiligheidsonderzoek omvat het instellen van een onderzoek naar gegevens die uit het oogpunt van de nationale
      veiligheid of de veiligheid of andere gewichtige belangen van de verzoekende mogendheid of volkenrechtelijke
      organisatie van belang zijn. Hierbij wordt uitsluitend gelet op:

      a. justitiële en strafvorderlijke gegevens als bedoeld in de [Wet justitiële en strafvorderlijke gegevens][ref1]
      en gegevens als bedoeld in de Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag BES
      alsmede van gegevens als bedoeld in de [Wet politiegegevens][ref2] en van gegevens verwerkt in het kader van de
      uitvoering van de politietaak op Bonaire, Sint Eustatius en Saba;

      b. gegevens betreffende deelneming of steunverlening aan activiteiten die de nationale veiligheid en van de
      verzoekende mogendheid of volkenrechtelijke organisatie kunnen schaden;

      c. gegevens betreffende lidmaatschap van of steunverlening aan organisaties die doeleinden nastreven, dan wel ter
      verwezenlijking van hun doeleinden middelen hanteren, die aanleiding geven tot het ernstige vermoeden dat zij een
      gevaar vormen voor het voortbestaan van de democratische rechtsorde;

      d. gegevens betreffende overige persoonlijke gedragingen en omstandigheden die in verband met het doel van het
      verzoek van belang kunnen zijn.

      5 De mededelingen, bedoeld in het eerste lid, bevatten de conclusies die uit het ingestelde veiligheidsonderzoek
      kunnen worden getrokken, dan wel de vaststelling dat het onderzoek onvoldoende gegevens heeft opgeleverd om op
      basis daarvan conclusies te kunnen trekken of dat de betrokken persoon niet heeft ingestemd met het instellen van
      een veiligheidsonderzoek.

      6 Indien een verzoek als bedoeld in het eerste lid betrekking heeft op een persoon ten aanzien van wie een
      verklaring is afgegeven, wordt op het verzoek beslist door Onze Minister die de verklaring heeft afgegeven. In
      zulke gevallen kan een veiligheidsonderzoek achterwege worden gelaten. De mededelingen, bedoeld in het eerste lid,
      bevatten in zulke gevallen de vaststelling dat ten aanzien van de betrokken persoon een verklaring is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0014194
