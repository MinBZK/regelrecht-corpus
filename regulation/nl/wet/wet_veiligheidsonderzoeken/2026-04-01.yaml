        artikel: '1'
  - number: 3a
    text: |-
      1 Onverminderd [artikel 3][ref1] wijst Onze Minister, in overeenstemming met Onze Minister van Binnenlandse
      Zaken en Koninkrijksrelaties, locaties aan waarvan de toegang tot die locaties de mogelijkheid biedt de nationale
      veiligheid te schaden. Bij deze aanwijzing wordt tevens ten minste één verantwoordelijke voor het toegangsbeheer
      voor de betreffende locatie aangewezen.

      2 Functies die worden uitgeoefend op locaties die op grond van het eerste lid zijn aangewezen, worden voor de
      toepassing van deze wet aangemerkt als vertrouwensfuncties.

      3 Indien een verklaring is afgegeven voor een functie als bedoeld in het tweede lid, blijft de verklaring geldig
      bij vervulling van opeenvolgende functies op de desbetreffende aangewezen locatie.

      4 De periode tussen opeenvolgende functies als bedoeld in het derde lid is ten hoogste vijf weken. Vijf weken na
      ontheffing uit de vertrouwensfunctie vervalt de verklaring van rechtswege, tenzij de betrokkene is aangemeld in het
      register ingevolge [artikel 10a, derde lid][ref2].

      5 Nadat een locatie op grond van het eerste lid is aangewezen geeft de betrokken werkgever of de aangewezen
      verantwoordelijke voor het toegangsbeheer van de betreffende locatie uit eigen beweging aan Onze Minister en aan
      het hoofd van de Algemene Inlichtingen- en Veiligheidsdienst de inlichtingen over wijzigingen in de inrichting
      of het beheer van de aangewezen locatie, die nodig zijn voor de beoordeling van de mate waarin de toegang tot die
      locatie de mogelijkheid biedt de nationale veiligheid te schaden.

      6 Onze Minister draagt er zorg voor dat binnen vijf jaren na de aanwijzing van een locatie op grond van het eerste
      lid en vervolgens telkens na vijf jaren wordt nagegaan of de aanwijzing gehandhaafd moet blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0008277#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008277#Artikel10a
    url: https://wetten.overheid.nl/BWBR0008277/2026-04-01#Artikel3a
