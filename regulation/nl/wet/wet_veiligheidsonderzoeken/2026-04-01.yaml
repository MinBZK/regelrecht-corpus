        artikel: '5'
  - number: '7'
    text: |-
      1 Alvorens een verklaring wordt afgegeven of geweigerd, wordt ten aanzien van de betrokken persoon door de Algemene
      Inlichtingen- en Veiligheidsdienst een veiligheidsonderzoek ingesteld.

      2 Het veiligheidsonderzoek omvat het instellen van een onderzoek naar gegevens die uit het oogpunt van de nationale
      veiligheid van belang zijn voor de vervulling van de desbetreffende vertrouwensfunctie. Hierbij wordt uitsluitend
      gelet op:

      a. justitiële en strafvorderlijke gegevens als bedoeld in de [Wet justitiële en strafvorderlijke gegevens][ref1]
      en gegevens als bedoeld in de Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag BES
      alsmede van gegevens als bedoeld in de [Wet politiegegevens][ref2] en van gegevens verwerkt in het kader van de
      uitvoering van de politietaak op Bonaire, Sint Eustatius en Saba;

      b. gegevens betreffende deelneming of steunverlening aan activiteiten die de nationale veiligheid kunnen schaden;

      c. gegevens betreffende lidmaatschap van of steunverlening aan organisaties die doeleinden nastreven, dan wel ter
      verwezenlijking van hun doeleinden middelen hanteren, die aanleiding geven tot het ernstige vermoeden dat zij een
      gevaar vormen voor het voortbestaan van de democratische rechtsorde;

      d. gegevens betreffende overige persoonlijke gedragingen en omstandigheden, naar aanleiding waarvan betwijfeld mag
      worden of de betrokkene de uit de vertrouwensfunctie voortvloeiende plichten onder alle omstandigheden getrouwelijk
      zal volbrengen.


      [ref1]: https://wetten.overheid.nl/BWBR0014194
      [ref2]: https://wetten.overheid.nl/BWBR0022463
    url: https://wetten.overheid.nl/BWBR0008277/2026-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0014194
      - id: ref2
        bwb_id: BWBR0022463
  - number: '8'
    text: |-
      Een verklaring kan slechts worden geweigerd, indien onvoldoende waarborgen aanwezig zijn dat de betrokkene onder
      alle omstandigheden de uit de vertrouwensfunctie voortvloeiende plichten getrouwelijk zal volbrengen of indien het
      veiligheidsonderzoek onvoldoende gegevens heeft kunnen opleveren om daarover een oordeel te geven.
    url: https://wetten.overheid.nl/BWBR0008277/2026-04-01#Artikel8
  - number: '9'
    text: |-
      1 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties is bevoegd, na het verstrijken van een termijn
      van vijf jaren of een veelvoud daarvan sinds het afgeven van de verklaring of indien hem blijkt van feiten of
      omstandigheden die een hernieuwd veiligheidsonderzoek rechtvaardigen, een veiligheidsonderzoek te doen instellen
      naar een persoon die een vertrouwensfunctie vervult. Voor het instellen van een hernieuwd veiligheidsonderzoek is
      de instemming van de betrokkene niet vereist.

      2 Onder feiten en omstandigheden als bedoeld in het eerste lid kunnen worden gerekend gegevens die de Algemene
      Inlichtingen- en Veiligheidsdienst heeft verkregen door het verzamelen van justitiële en strafvorderlijke gegevens
      als bedoeld in de [Wet justitiële en strafvorderlijke gegevens][ref1] en van gegevens als bedoeld in de Wet op
      de justitiële documentatie en op de verklaringen omtrent het gedrag BES alsmede van gegevens als bedoeld in de
      [Wet politiegegevens][ref2] en van gegevens verwerkt in het kader van de uitvoering van de politietaak op Bonaire,
      Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0014194
      [ref2]: https://wetten.overheid.nl/BWBR0022463
    url: https://wetten.overheid.nl/BWBR0008277/2026-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0014194
      - id: ref2
        bwb_id: BWBR0022463
  - number: 9a
    text: |-
      1 De kosten die samenhangen met het verrichten van een veiligheidsonderzoek als bedoeld in de [artikelen 7][ref1]
      en [9][ref2] komen ten laste van de werkgever.

      2 De bedragen ter vergoeding van de kosten worden bij regeling van Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008277#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008277#Artikel9
    url: https://wetten.overheid.nl/BWBR0008277/2026-04-01#Artikel9a
    references:
