    text: |-
      1 Deze wet is mede van toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba.

      2 Indien een besluit op grond van deze wet is gericht op een natuurlijke of een rechtspersoon, die woonplaats
      heeft onderscheidenlijk is gevestigd in de openbare lichamen Bonaire, Sint Eustatius of Saba, kan een natuurlijke
      persoon of een rechtspersoon, die door het besluit rechtstreeks in zijn belang is getroffen, beroep instellen bij
      het Gerecht in eerste aanleg van Bonaire, Sint Eustatius en Saba. De Wet administratieve rechtspraak BES is van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0008277/2026-04-01#Artikel16a
