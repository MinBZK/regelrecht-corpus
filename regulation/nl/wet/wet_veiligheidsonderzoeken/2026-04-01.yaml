  - number: '2'
    text: |-
      1 Indien een vertrouwensfunctie wordt uitgeoefend bij het Ministerie van Defensie, dan wel indien het een functie
      betreft die als vertrouwensfunctie moet worden aangemerkt in verband met de daarmee samenhangende noodzaak om
      toegang te hebben tot militaire installaties, treden, voor de toepassing van het bepaalde in de [artikelen 3][ref1]
      tot en met [10][ref2] en [16, tweede lid][ref3], Onze Minister van Defensie en de Militaire Inlichtingen- en
      Veiligheidsdienst in de plaats van respectievelijk Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties en
      de Algemene Inlichtingen- en Veiligheidsdienst.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over het wederzijds erkennen van
      een afgegeven verklaring door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties en Onze Minister van
      Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0008277#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008277#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0008277#Artikel16
