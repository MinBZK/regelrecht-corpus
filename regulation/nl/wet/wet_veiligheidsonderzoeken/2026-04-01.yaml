        artikel: '7'
      - id: ref2
        bwb_id: BWBR0008277
        artikel: '9'
  - number: '10'
    text: |-
      1 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties is bevoegd tot het intrekken van de verklaring,
      indien hem blijkt dat onvoldoende waarborgen aanwezig zijn dat de betrokkene onder alle omstandigheden de uit de
      vertrouwensfunctie voortvloeiende plichten getrouwelijk zal volbrengen of indien een nieuw veiligheidsonderzoek
      onvoldoende gegevens heeft kunnen opleveren om vast te stellen dat voldoende waarborgen aanwezig zijn.

      2 Indien een verklaring is ingetrokken, ontheft de werkgever de betrokken persoon zo spoedig mogelijk, doch
      uiterlijk binnen acht weken na de intrekking van de verklaring, uit de vertrouwensfunctie.
    url: https://wetten.overheid.nl/BWBR0008277/2026-04-01#Artikel10
  - number: 10a
    text: |-
      1 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties en Onze Minister van Defensie gezamenlijk houden een
      register bij van personen die een vertrouwensfunctie vervullen.

      2 In het register worden ten aanzien van personen die een vertrouwensfunctie vervullen uitsluitend de volgende
      gegevens opgenomen:

      a. naam en achternaam;

      b. burgerservicenummer;

      c. geboortedatum;

      d. kenmerk en afgiftedatum van de verklaring;

      e. werkgever;

      f. datum van afmelding;

      g. datum waarop betrokkene is belast met de vertrouwensfunctie;

      h. datum waarop betrokkene is ontheven uit de vertrouwensfunctie;

      i. eigenschappen van de verklaring.

      3

      4 De werkgever gebruikt voor het aanmelden en afmelden van personen in het register, alsmede voor het vaststellen
      of de persoon die hij met een vertrouwensfunctie beoogt te belasten reeds beschikt over een geldige verklaring, het
      burgerservicenummer van de betrokken persoon.
    url: https://wetten.overheid.nl/BWBR0008277/2026-04-01#Artikel10a
  - number: '11'
    text: |-
      Deze wet is niet van toepassing op de leden van de rechterlijke macht met rechtspraak belast, de procureur-generaal
      bij de Hoge Raad, de leden van de Raad van State, de leden van de Algemene Rekenkamer, de Nationale ombudsman en
      de substituut-ombudsman, de leden van de Centrale Raad van Beroep en de leden van het College van Beroep voor het
      bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0008277/2026-04-01#Artikel11
  - number: '12'
    text: |-
      1 [Artikel 4, tweede lid][ref1], is niet van toepassing in gevallen waarin een persoon met
      een vertrouwensfunctie wordt belast in het kader van de vervulling van werkelijke dienst
      in de zin van [paragraaf 5 van hoofdstuk 1 van de Kaderwet dienstplicht][ref2] of van
      [hoofdstuk VII van de Dienstplichtwet BES][ref3].

      2 In de gevallen, bedoeld in het eerste lid, wordt het veiligheidsonderzoek niet eerder ingesteld
      dan twaalf weken voordat de betrokkene dient op te komen voor het vervullen van werkelijke
      dienst in de zin van [paragraaf 5 van hoofdstuk 1 van de Kaderwet dienstplicht][ref4] of van
      [hoofdstuk VII van de Dienstplichtwet BES][ref5]. Van het instellen van een veiligheidsonderzoek wordt vooraf
      mededeling gedaan aan de betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0008277#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008589#Paragraaf5
