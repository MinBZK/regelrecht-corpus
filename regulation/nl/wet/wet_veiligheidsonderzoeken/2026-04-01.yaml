  - number: 3b
    text: |-
      [Artikel 3a][ref1] is van overeenkomstige toepassing op functies in de veilige vracht- en toeleveringsketen,
      bedoeld in [artikel 37p van de Luchtvaartwet][ref2], voor zover in de uitoefening van die functies:

      a. regulier en onbegeleid toegang tot identificeerbare luchtvracht, luchtpost, bedrijfspost, bedrijfsmateriaal,
      vluchtbenodigdheden of luchthavenbenodigdheden wordt verkregen en waarop de noodzakelijke beveiligingsmaatregelen
      zijn toegepast, of

      b. het mogelijk is de veilige status van de onder a genoemde goederen te beïnvloeden.


      [ref1]: https://wetten.overheid.nl/BWBR0008277#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel37p
    url: https://wetten.overheid.nl/BWBR0008277/2026-04-01#Artikel3b
