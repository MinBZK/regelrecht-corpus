        artikel: 37p
  - number: '4'
    text: |-
      1 De werkgever meldt een persoon die hij wil belasten met de vervulling van een vertrouwensfunctie aan bij het
      hoofd van de Algemene Inlichtingen- en Veiligheidsdienst.

      2 De in het eerste lid bedoelde aanmelding geschiedt slechts met schriftelijke instemming van de betrokkene. De
      werkgever licht de betrokkene in over de betekenis en de rechtsgevolgen van deze aanmelding.

      3 Het hoofd van de Algemene Inlichtingen- en Veiligheidsdienst draagt zorg voor een deugdelijke vaststelling van de
      identiteit van de betrokkene.

      4 De werkgever kan bij de aanmelding, bedoeld in het eerste lid, het burgerservicenummer van de betrokkene
      verstrekken.

      5 Nadat Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties een verklaring heeft afgegeven, neemt Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties de betrokkene op in het register.

      6 De werkgever belast een persoon eerst met de vervulling van een vertrouwensfunctie, nadat Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties ten aanzien van die persoon een verklaring heeft afgegeven.
    url: https://wetten.overheid.nl/BWBR0008277/2026-04-01#Artikel4
  - number: '5'
    text: |-
      1 De werkgever meldt een persoon die belast is met de vervulling van een functie die nadien als vertrouwensfunctie
      is aangewezen, zo spoedig mogelijk, doch uiterlijk binnen vier weken na de dagtekening van het aanwijzingsbesluit
      aan bij het hoofd van de Algemene Inlichtingen- en Veiligheidsdienst.

      2 De in het eerste lid bedoelde aanmelding geschiedt slechts met schriftelijke instemming van de betrokkene. De
      werkgever licht de betrokkene in over de betekenis en de rechtsgevolgen van deze aanmelding.

      3 Het hoofd van de Algemene Inlichtingen- en Veiligheidsdienst draagt zorg voor een deugdelijke vaststelling van de
      identiteit van de betrokkene.

      4 De werkgever kan bij de aanmelding, bedoeld in het eerste lid, het burgerservicenummer van de betrokkene
      verstrekken.

      5 Nadat Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties een verklaring heeft afgegeven, neemt Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties de betrokkene op in het register.

      6 Indien de in het tweede lid bedoelde instemming is geweigerd of indien ten aanzien van de betrokkene een
      verklaring is geweigerd, ontheft de werkgever de betrokkene zo spoedig mogelijk, doch uiterlijk binnen acht weken,
      uit de functie.
    url: https://wetten.overheid.nl/BWBR0008277/2026-04-01#Artikel5
  - number: '6'
    text: |-
      1 In de gevallen als bedoeld in [artikel 4][ref1] en [5][ref2] beslist Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties zo spoedig mogelijk, doch uiterlijk binnen acht weken, omtrent het afgeven van een verklaring.

      2 De termijn voor het geven van een beschikking wordt opgeschort met ingang van de dag waarop Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties de betrokkene uitnodigt nadere gegevens te verstrekken, tot de dag waarop
      die gegevens zijn ontvangen of de voor verstrekking gestelde termijn ongebruikt is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0008277#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008277#Artikel5
    url: https://wetten.overheid.nl/BWBR0008277/2026-04-01#Artikel6
