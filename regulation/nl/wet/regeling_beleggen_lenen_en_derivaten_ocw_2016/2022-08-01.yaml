  - number: '7'
    text: |-
      1 Een instelling kan middels leningen additionele financiële middelen aantrekken.

      2 Instellingen geven geen leningen uit aan derden, noch aan personeel, noch aan andere instellingen of
      organisaties, tenzij deze lening van toepassing is voor de uitvoering van de wettelijke taak van de instelling en
      binnen het doel van de organisatie past.

      3 Bij het aangaan van leningen gaat de instelling geen extra risico’s aan die het voortbestaan van de instelling of
      het geven van onderwijs kunnen bedreigen.

      4 Instellingen kunnen lenen bij financiële ondernemingen, overheden, organisaties of fondsen, waarbij de risico’s
      beperkt zijn. De risico’s zijn beperkt indien deze financiële ondernemingen, overheden, organisaties of fondsen
      voldoende vermogend zijn, niet een hoger rentetarief in rekening brengen dan in de markt gangbaar is en hierbij
      geen aanvullende financiële of niet-financiële eisen stellen.

      5 Leningen worden conform het treasurystatuut afgesloten en vooraf ter kennisname aan de interne toezichthouder
      gestuurd.
    url: https://wetten.overheid.nl/BWBR0038059/2022-08-01#Artikel7
  - number: '8'
    text: |-
      1 Een instelling maakt alleen gebruik van financiële derivaten voor het beperken van opwaartse renterisico’s bij
      leningen.

      2 Een instelling hanteert uitsluitend rentecaps of payer swaps.

      3 Derivaten worden conform het treasurystatuut afgesloten en vooraf ter kennisname aan de interne toezichthouder
      voorgelegd.

      4 Een instelling die een financieel derivaat afsluiten, neemt in ieder geval de volgende contractuele voorwaarden
      in acht:

      a. er worden geen clausules opgenomen die op enigerlei wijze de uitvoering van het toezicht op de instelling
      belemmeren;

      b. er worden geen additionele eenzijdige opzeggingsmogelijkheden of andere beperkende voorwaarden vanuit de
      financiële onderneming opgenomen;

      c. er worden geen derivaten met margin calls afgesloten.
    url: https://wetten.overheid.nl/BWBR0038059/2022-08-01#Artikel8
  - number: '9'
    text: |-
      1 Een derivaat wordt pas aangetrokken vanaf het moment dat de lening is afgesloten.

      2 De nominale waarde van het derivaat is niet groter dan de onderliggende lening.

      3 De looptijd van het derivaat is niet langer dan de onderliggende lening, met een maximum van 30 jaar.

      4 Indien de looptijd van het derivaat langer is dan 15 jaar, wordt dit gemotiveerd in het treasurystatuut.

      5 Bij het ontstaan van een niet-effectieve positie neemt de instelling direct contact op met zowel de interne als
      de externe toezichthouder.
    url: https://wetten.overheid.nl/BWBR0038059/2022-08-01#Artikel9
  - number: '10'
    text: |-
      De instelling doet ieder jaar in de jaarverslaglegging ten aanzien van de publieke middelen verslag van haar beleid
      ten aanzien van de beleggingen en leningen, de uitvoering van het beleid in de praktijk, de uitstaande beleggingen
      en leningen, de aangetrokken leningen en afgesloten derivatenovereenkomsten. Hierbij wordt:

      a. een vergelijking gemaakt met de gegevens van het voorgaande jaar;

      b. van elke belegging jaarlijks gemeld op welk moment de belegging vrij valt;

      c. verantwoording afgelegd over het gebruik van derivaten, conform de Regeling jaarverslaggeving onderwijs;

      d. een rapportage over het treasurystatuut opgenomen, waarin tenminste verslag gedaan over:

      1°. het beleid en de uitvoering ten aanzien van beleggen, lenen en derivaten;

      2°. de soorten en omvang van de beleggingen, leningen en derivaten;

      3°. de looptijden van de beleggingen, leningen en derivaten.
    url: https://wetten.overheid.nl/BWBR0038059/2022-08-01#Artikel10
  - number: '11'
    text: |-
      1 De externe toezichthouder kan toetsen de instelling voldoet aan de eisen met betrekking tot de interne
      organisatie van de instelling, zoals bedoeld in [artikel 3][ref1] van deze regeling.

      2 De externe toezichthouder beoordeelt minimaal eenmaal per jaar, mede op basis van in ieder geval de informatie
      van de accountant, of een instelling zich in voldoende mate houdt aan de regelgeving inzake derivatentransacties en
      neemt ter zake gepaste actie bij tekortkomingen of risico’s.


      [ref1]: https://wetten.overheid.nl/BWBR0038059#Artikel3
    url: https://wetten.overheid.nl/BWBR0038059/2022-08-01#Artikel11
