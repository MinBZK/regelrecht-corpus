  - number: '12'
    text: |-
      1 De [Regeling belenen en beleggen door instellingen voor onderwijs en onderzoek 2010][ref1], zoals deze luidde
      op 30 juni 2016, blijft van toepassing op beleggingen, leningen en financiële derivaten die voor 1 juli 2016 zijn
      afgesloten.

      2 Instellingen die op 1 juli 2016 een belegging, lening of financieel derivaat hebben en op die datum nog geen
      treasurystatuut hebben, stellen voor 1 oktober 2016 een treasurystatuut op.


      [ref1]: https://wetten.overheid.nl/BWBR0026436
