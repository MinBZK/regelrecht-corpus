  - number: '2'
    text: |-
      Het financiële beleid en het beheer van de instellingen is dienstbaar aan het realiseren van de publieke
      doelstellingen, en is daartoe op transparante wijze gericht op financiële continuïteit.
    url: https://wetten.overheid.nl/BWBR0038059/2022-08-01#Artikel2
  - number: '3'
    text: |-
      1 De instelling die geld belegt of leent, al dan niet in combinatie met financiële derivaten, heeft in een
      treasurystatuut in ieder geval de volgende zaken geregeld:

      a. de hoofdlijnen van de op het beleggen en lenen betrekking hebbende administratieve organisatie en het interne
      toezicht, waaronder in ieder geval de verdeling van taken en bevoegdheden,

      b. de voor de instelling toegestane beleggings- en leningsvormen,

      c. de bijbehorende informatievoorziening minimaal bestaande uit een kasstroomprognose over 5 jaar en de
      verantwoordingsinformatie, en

      d. de wijze waarop onderscheid wordt gemaakt tussen publieke middelen en overige middelen enerzijds en niet-
      publieke middelen anderzijds.

      Indien een instelling in het hoger onderwijs zich wil laten aanmerken als professionele belegger, dient dit ook in
      het treasurystatuut te zijn vastgelegd.

      2 Daarnaast heeft de instelling die financiële derivaten gebruikt haar interne organisatie op adequate wijze
      ingericht. In elk geval is geregeld:

      a. de wijze waarop en de mate waarin het gebruik van financiële derivaten bijdraagt aan het beperken van
      renterisico’s bij het financiële beleid en beheer,

      b. de interne organisatiestructuur is op orde inzake aanschaf en gebruik van financiële derivaten, waaronder in elk
      geval regels zijn opgesteld inzake bevoegdheden en mandatering, interne controle, interne verantwoording, rol en
      betrokkenheid van de externe accountant, en rol en betrokkenheid van de interne toezichthouder,

      c. voldoende interne professionaliteit inzake financiële derivaten is gewaarborgd, ook bij de interne
      toezichthouder,

      d. de beheersingsstructuur rond de risico’s van financiële derivaten, is onder meer gericht op de marktwaarde,
      de omvang en de samenstelling van de derivatenportefeuille en de monitoring van de marktwaarde en de (eventuele)
      liquiditeitsbuffer in relatie tot het liquiditeitsrisico.

      3 De interne toezichthouder toetst of het tweede lid onderdeel uitmaakt van de eisen die het bestuur aan de interne
      organisatie van de instelling stelt.
    url: https://wetten.overheid.nl/BWBR0038059/2022-08-01#Artikel3
  - number: '4'
    text: |-
      1 Derivaten of beleggingen worden alleen aangetrokken dan wel uitgezet bij financiële ondernemingen als bedoeld in
      de [Wet op het financieel toezicht][ref1], en die:

      a. gevestigd zijn in een lidstaat;

      b. minstens een single A-rating hebben, afgegeven door ten minste twee van de vier ratingsbureaus Moody’s, Standard
      and Poor’s, Fitch en DBRS.

      2 Beleggingen, leningen en derivaten met publieke middelen worden alleen aangetrokken in euro’s.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0038059/2022-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '5'
    text: |-
      1 De instelling die geld belegt, of leent, al dan niet in combinatie met financiële derivaten verzoekt de
      financiële onderneming zich te laten aanmerken als niet-professionele belegger.

      2 Een instelling in het hoger beroepsonderwijs of een instelling voor wetenschappelijk onderwijs en onderzoek
      kan, op basis van zijn kennis met betrekking tot het aangaan van beleggingen, leningen en derivaten, bij de bank
      verzoeken zich te laten aanmerken als professionele belegger, indien de instelling aan de volgende drie voorwaarden
      heeft voldaan. De instelling heeft:

      a. een balanstotaal van ten minste € 20 miljoen op jaarbasis;

      b. een netto-omzet van ten minste € 40 miljoen op jaarbasis; en

      c. een eigen vermogen van ten minste € 2 miljoen.

      3 Indien een instelling in het hoger beroepsonderwijs of een universiteit zich als professionele belegger wil laten
      aanmerken, stemt de instelling deze keuze af met de interne toezichthouder en wordt dit in het treasurystatuut
      opgenomen. Tevens wordt deze keuze aan de externe toezichthouder gemeld.

      4 Een instelling die als niet-professionele belegger is aangemerkt, sluit bij het afsluiten van een financieel
      derivaat met de financiële onderneming een raamovereenkomst als opgenomen in [bijlage I][ref1] af.

      5 Een instelling die als niet-professionele belegger is aangemerkt, is bij het aangaan van derivatenovereenkomsten
      gebonden aan de modelovereenkomst die is opgenomen in [bijlage II][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0038059
      [ref2]: https://wetten.overheid.nl/BWBR0038059
    url: https://wetten.overheid.nl/BWBR0038059/2022-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0038059
      - id: ref2
        bwb_id: BWBR0038059
  - number: '6'
    text: |-
      1 Middelen van instellingen die tijdelijk overtollig zijn kunnen in een belegging worden uitgezet.

      2 De periode van het beleggen door instellingen is eindig en de belegging wordt op een vooraf vastgestelde
      einddatum terugontvangen.

      3 De hoofdsom van de belegging wordt door de financiële onderneming, bedoeld in [artikel 4][ref1] gegarandeerd. In
      geval van koerswijzigingen op de belegging kan hier, met instemming van de interne toezichthouder, van af worden
      geweken.

      4 Instellingen mogen beleggen in staatsobligaties van lidstaten, mits deze lidstaten aan de ratingeisen, genoemd in
      [artikel 4, eerste lid][ref2], voldoen.

      5 Instellingen beleggen niet in:

      a. achtergestelde spaarrekeningen en achtergestelde deposito’s;

      b. aandelen of vergelijkbare producten, tenzij deze van toepassing zijn voor de uitvoering van de wettelijke taak
      van de instelling.

      6 Beleggingen worden conform het treasurystatuut afgesloten en vooraf ter kennisname aan de interne toezichthouder
      gestuurd.


      [ref1]: https://wetten.overheid.nl/BWBR0038059#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0038059#Artikel4
    url: https://wetten.overheid.nl/BWBR0038059/2022-08-01#Artikel6
