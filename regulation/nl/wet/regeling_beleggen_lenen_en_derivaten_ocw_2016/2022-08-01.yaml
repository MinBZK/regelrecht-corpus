articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *achtergestelde spaarrekeningen of deposito’s:* spaarrekeningen of deposito’s die in geval van faillissement de
      terugbetaling pas plaatsvindt nadat de andere schuldeisers hun geld hebben ontvangen;
        - *beleggingen:* uitzettingen van middelen die tijdelijk niet benodigd zijn om aan lopende financiële
      verplichtingen te voldoen, met uitzondering van financiële derivaten;
        - *externe toezichthouder:* de Inspectie van het Onderwijs;
        - *financiële derivaten:* financiële contracten waarvan de waarde is afgeleid van de waarde van de onderliggende
      lening;
        - *financiële onderneming:* een onderneming die in een lidstaat het bedrijf van bank mag uitoefenen,
      beleggingsdiensten mag verlenen, beleggingsinstellingen mag beheren, rechten van deelneming in een
      beleggingsmaatschappij mag aanbieden, of het bedrijf van verzekeraar mag uitoefenen;
        - *instellingen:* door de minister bekostigde onderwijsaanbieder als bedoeld in
      [artikel 1 van de Wet op het primair onderwijs][ref1], [artikel 1 van de Wet op de expertisecentra][ref2],
      [artikel 1.1 van de Wet voortgezet onderwijs 2020][ref3], met uitzondering van de onderwijsaanbieders, bedoeld in de
      [artikelen 2.66][ref4] en [3.27 van die wet][ref5], [artikel 1.1.1 van de Wet educatie en beroepsonderwijs][ref6],
      [artikel 1.8][ref7] en [artikel 2.1 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref8] en niet
      aangewezen op grond van [artikel 45, eerste of derde lid, van de Comptabiliteitswet 2001][ref9];
        - *interne toezichthouder:* toezicht als bedoeld in de [artikelen 17b][ref10]
      en [17c van de Wet op het primair onderwijs][ref11], de [artikelen 3.1][ref12]
      en [3.3 van de Wet voortgezet onderwijs 2020][ref13], de [artikelen 28h][ref14]
      en [28i van de Wet op de expertisecentra][ref15], de [artikelen 3.1.1][ref16] en
      [3.1.2 van de Wet educatie en beroepsonderwijs][ref17] en de [artikelen 9.8][ref18], [9.9][ref19] en
      [10.3d van de Wet hoger onderwijs en wetenschappelijk onderzoek][ref20];
        - *jaarverslaggeving:* het geheel van verslagleggingsdocumenten bestaande uit de jaarrekening, het bestuursverslag
      en de overige gegevens, bedoeld in [artikel 392 van Titel 9, Boek 2, van het Burgerlijk wetboek][ref21], zoals dit
      in de onderwijssector van toepassing is verklaard op grond van de Regeling jaarverslaglegging onderwijs;
        - *kasstroomprognose:* liquiditeitsplanning voor de korte termijn en de financieringsplanning voor de lange
      termijn;
        - *lidstaat:* staat die lid is van de Europese Unie of een andere staat die partij is bij de overeenkomst
      betreffende de Europese Economische Ruimte en die beschikt over minimaal een AA (flat) rating, afgegeven door ten
      minste twee van de volgende ratingsbureaus Moody’s, Standard and Poor’s, Fitch en DBRS;
        - *margin call:* het storten van een zekerheid om een uitstaande positie af te dekken;
        - *minister:* Minister van Onderwijs, Cultuur en Wetenschap;
        - *niet-publieke middelen:* alle financiële middelen waarover de instelling beschikt die niet afkomstig zijn uit ’s
      Rijks kas en niet vallen onder de definitie van publieke middelen;
        - *payer swap:* renteswap waarbij de betaler een vaste rente betaalt en een variabele rente ontvangt;
        - *publieke middelen:* middelen verkregen ten laste van de rijksbegroting of anderszins uit hoofde van bij of
      krachtens de wet ingestelde heffingen verkregen middelen, alsmede de opbrengsten daarvan, waarover een instelling
      de beschikking heeft gekregen om de wettelijke taak te verrichten;
        - *rating:* taxatie van de kredietwaardigheid van een financiële onderneming of een land;
        - *rentecap:* financieel derivaat waarbij een leningnemer tegen betaling van een geldsom gedurende een
      overeengekomen periode de garantie van een maximaal te betalen rentetarief verkrijgt;
        - *renteswap:* financieel derivaat om renterisico’s te beheersen of af te dekken;
        - *solvabiliteitsratio:* het in een lidstaat voorgeschreven minimumniveau aansprakelijk vermogen van een financiële
      onderneming tegenover aangehouden naar risicograad gewogen activa;
        - *waardepapieren:* documenten met een geldwaarde, zoals een bewijs van een aandeel of obligatie of een derivaat.


