preamble:
  text: |-
    Gelet op de artikelen 100, 101, en 102 van de Wegenverkeerswet 1994 alsmede artikel 6.14 van het Voertuigreglement;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0007081/2007-07-04#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:



              a
              de Minister:

                de Minister van Verkeer en Waterstaat;



              b
              de Directeur:

                de Directeur van de Dienst Wegverkeer;



              c

                [richtlijn 92/24/EEG](31992L0024):

                [richtlijn 92/24/EEG](31992L0024) van de Raad van de Europese gemeenschappen van 31 maart 1992
      betreffende snelheidsbegrenzers of soortgelijke begrenzingssystemen voor bepaalde categorieën motorvoertuigen (PbEG
      L 129);



              d
              importeur:

                door de fabrikant contractueel erkende importeur;



              e
              installateur:

                natuurlijke persoon of rechtspersoon die gerechtigd is tot installatie van snelheidsbegrenzers;



              f
              installatie:

                het inbouwen en op de juiste snelheid afstellen en verzegelen van snelheidsbegrenzers;



              g
              mobiele installatie-eenheid:

                installatie-eenheid waarmee niet steeds in dezelfde werkplaats, doch afwisselend in verscheidene
      werkplaatsen gewerkt wordt;



              h
              RDW:

                Dienst Wegverkeer;



              i
              steekproef:

                een steekproefsgewijze controle als bedoeld in [artikel 102 van de Wegenverkeerswet 1994][ref1] van een
      voertuig waarin een snelheidsbegrenzer is ingebouwd;



              j
              werkplaats:

                overdekte en behoorlijk af te sluiten ruimte, waarin de installatie onder alle weersomstandigheden
      normaal kan plaatsvinden;



              k
              controleapparaat:

                controleapparaat als bedoeld in Bijlage I of Bijlage IB van [verordening (EEG) nr. 3821/85](31985R3821)
      van de Raad van 20 december 1985 betreffende het controleapparaat in het wegvervoer (PbEG L 370).




      2 Een wijziging van [richtlijn 92/24/EEG](31992L0024) treedt in werking met ingang van de dag waarop aan
      de betrokken wijzigingsrichtlijn uiterlijk uitvoering moet zijn gegeven. De Minister doet mededeling in de
      Staatscourant van het desbetreffende tijdstip van inwerkingtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel102
    url: https://wetten.overheid.nl/BWBR0007081/2007-07-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '102'
  - number: '2'
    text: |-
      1 De erkenning wordt verleend voor de door de natuurlijke persoon of rechtspersoon gevoerde merken
      snelheidsbegrenzer ten aanzien waarvan deze voldoet aan de in dit hoofdstuk gestelde eisen.

      2 Een erkenning voor één of meer mobiele installatie-eenheden kan worden verleend aan een natuurlijke persoon of
      rechtspersoon voor de door deze gevoerde merken snelheidsbegrenzer ten aanzien waarvan wordt voldaan aan de in
      [artikel 9][ref1] gestelde eisen.

      3 De in het tweede lid bedoelde mobiele installatie-eenheid wordt ten behoeve van de identificatie gekoppeld aan:

      a. de naam van de persoon die de werkzaamheden als mobiele installatie-eenheid verricht, dan wel

      b. het kenteken van het voertuig van waaruit de werkzaamheden als mobiele installatie-eenheid worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0007081#Artikel9
    url: https://wetten.overheid.nl/BWBR0007081/2007-07-04#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007081
        artikel: '9'
        hoofdstuk: '2'
  - number: '3'
    text: |-
      De aanvrager van een erkenning moet beschikken over:

      a. een verzegelinrichting en verzegelmateriaal dat geschikt is voor de gevoerde merken snelheidsbegrenzer,

      b. apparatuur voor het afstellen en het controleren van de afstelling van de gevoerde merken snelheidsbegrenzers in
      een stilstaand voertuig, en

      c. gereedschappen, werkplaatshandboeken en documentatie welke noodzakelijk zijn voor de installatie van de gevoerde
      merken snelheidsbegrenzer.
    url: https://wetten.overheid.nl/BWBR0007081/2007-07-04#Artikel3
  - number: '4'
    text: |-
      De aanvrager van een erkenning moet beschikken over een register waarvan de registerkaarten overeenkomen met het
      model zoals opgenomen in [bijlage 1][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0007081
    url: https://wetten.overheid.nl/BWBR0007081/2007-07-04#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007081
  - number: '5'
    text: |-
      1 De aanvrager van een erkenning dan wel het door hem aangewezen personeel moet met goed gevolg een cursus hebben
      doorlopen met betrekking tot:

      a. het installeren en het functioneren van de in het kader van de erkenning te voeren merken snelheidsbegrenzers;

      b. het functioneren van controleapparaten met betrekking tot aspecten die van belang zijn bij de installatie van
      snelheidsbegrenzers;

      c. het functioneren van voertuigen met betrekking tot aspecten die van belang zijn bij de installatie van
      snelheidsbegrenzers;

      d. de wettelijke voorschriften ten aanzien van snelheidsbegrenzers alsmede ten aanzien van controleapparaten voor
      zover van belang voor de installatie van snelheidsbegrenzers.

      2 De in het eerste lid bedoelde cursus moet zijn georganiseerd door de fabrikant of importeur van de in het kader
      van de erkenning te voeren merken snelheidsbegrenzer dan wel door de fabrikant van het betrokken motorrijtuig.
    url: https://wetten.overheid.nl/BWBR0007081/2007-07-04#Artikel5
  - number: '6'
    text: |-
      1 De in [artikel 5][ref1] bedoelde personen moeten door middel van een bewijs van deelname aantonen dat zij met
      goed gevolg de cursus hebben doorlopen.

      2 Deze personen moeten door de aanvrager van de erkenning bij de RDW worden aangemeld.

      3 Het bewijs van deelname moet in de werkplaats aanwezig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0007081#Artikel5
    url: https://wetten.overheid.nl/BWBR0007081/2007-07-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007081
        artikel: '5'
        hoofdstuk: '2'
  - number: '7'
    text: |-
      Onverminderd het bepaalde in de [artikelen 5][ref1] en [6][ref2] moet de aanvrager van een erkenning dan wel het
      door hem aangewezen personeel beschikken over actuele kennis omtrent de in het kader van de erkenning te voeren
      merken snelheidsbegrenzer.


      [ref1]: https://wetten.overheid.nl/BWBR0007081#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007081#Artikel6
    url: https://wetten.overheid.nl/BWBR0007081/2007-07-04#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007081
        artikel: '5'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007081
        artikel: '6'
        hoofdstuk: '2'
  - number: '8'
    text: |-
      De aanvrager van een erkenning moet beschikken over een voorziening voor het door middel van datacommunicatie
      melden van de installatie aan de RDW. Deze voorziening moet geschikt zijn voor de toegangsstructuur van een door de
      Directeur geaccepteerd netwerk.
    url: https://wetten.overheid.nl/BWBR0007081/2007-07-04#Artikel8
  - number: '9'
    text: |-
      1 De aanvrager van een erkenning voor één of meer mobiele installatie-eenheden moet beschikken over het in
      [artikel 4][ref1] bedoelde register.

      2 De aanvrager draagt er zorg voor dat:

      a. elke mobiele installatie-eenheid is voorzien van de in [artikel 3][ref2] voorgeschreven apparatuur;

      b. bij elke mobiele installatie-eenheid een tot installatie bevoegd persoon als bedoeld in [artikel 5][ref3],
      aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0007081#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007081#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0007081#Artikel5
    url: https://wetten.overheid.nl/BWBR0007081/2007-07-04#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007081
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007081
        artikel: '3'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0007081
        artikel: '5'
        hoofdstuk: '2'
  - number: '10'
    text: |-
      1 De aanvraag voor een erkenning wordt gedaan door een aanvraagformulier waarvan het model in [bijlage 2][ref1] bij
      deze regeling is opgenomen, in te dienen bij de RDW.

      2 De aanvrager van een erkenning overlegt tegelijk met het aanvraagformulier de volgende bescheiden:

      a. voor zover inschrijving in het handelsregister ingevolge de [Handelsregisterwet 1996][ref2] verplicht is,
      een niet eerder dan één jaar vóór het tijdstip van indiening van de aanvraag door de secretaris van de Kamer
      van Koophandel en Fabrieken, waarbij de aanvrager of een onderneming waarop de aanvraag betrekking heeft, is
      ingeschreven, verstrekt uittreksel, afschrift, fotografische reproduktie of schriftelijke mededeling, waaruit
      blijkt dat de aanvrager of de onderneming op het tijdstip van afgifte van dat geschrift was ingeschreven in het
      handelsregister;

      b. voor zover inschrijving in het handelsregister ingevolge [boek 2 van het Burgerlijk Wetboek][ref3] verplicht
      is of inschrijving in het handelsregister ingevolge [artikel 30, derde lid, van Boek 2 van genoemd wetboek][ref4]
      is geschied, een niet eerder dan één jaar vóór het tijdstip van indiening van de aanvraag door de secretaris van
      de Kamer van Koophandel en Fabrieken waarbij de aanvrager is ingeschreven, verstrekte afdruk of schriftelijke
      mededeling, waaruit blijkt dat de aanvrager op het tijdstip van afgifte van die afdruk of mededeling was
      ingeschreven in het handelsregister;

      c. indien de aanvraag namens de aanvrager door een ander wordt ingediend, een gewaarmerkt afschrift van een
      geschrift waaruit blijkt dat die ander tot de vertegenwoordiging bevoegd is.


      [ref1]: https://wetten.overheid.nl/BWBR0007081
      [ref2]: https://wetten.overheid.nl/BWBR0007893
      [ref3]: https://wetten.overheid.nl/BWBR0003045
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel30
    url: https://wetten.overheid.nl/BWBR0007081/2007-07-04#Artikel10
    references:
      - id: ref1
