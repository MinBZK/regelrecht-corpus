      - id: ref2
        bwb_id: BWBR0007893
      - id: ref3
        bwb_id: BWBR0003045
      - id: ref4
        bwb_id: BWBR0003045
        artikel: '30'
  - number: '11'
    text: |-
      1 De met de installatie verband houdende werkzaamheden mogen slechts geschieden in de werkplaats welke in de
      erkenning is vermeld.

      2 Vanaf de buitenkant van elke werkplaats waarvoor de erkenning geldt is op een door de Dienst Wegverkeer
      vastgestelde en in de Staatscourant bekendgemaakte wijze zichtbaar dat de erkenning is verleend.

      3 Het eerste en tweede lid zijn niet van toepassing indien het een erkenning voor een mobiele installatie-eenheid
      betreft.
    url: https://wetten.overheid.nl/BWBR0007081/2007-07-04#Artikel11
  - number: '12'
    text: |-
      1 De erkenninghouder moet voortdurend blijven voldoen aan de in [hoofdstuk 2][ref1] opgenomen erkenningseisen.

      2 De installatie moet plaatsvinden overeenkomstig de in [paragraaf 2][ref2] opgenomen voorschriften voor
      installatie.


      [ref1]: https://wetten.overheid.nl/BWBR0007081#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0007081#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0007081/2007-07-04#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007081
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007081
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '13'
    text: |-
      De installatie mag alleen worden uitgevoerd door de in [artikel 5][ref1] bedoelde personen, waarvan de namen
      ingevolge [artikel 6][ref2] zijn aangemeld bij de RDW.


      [ref1]: https://wetten.overheid.nl/BWBR0007081#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007081#Artikel6
    url: https://wetten.overheid.nl/BWBR0007081/2007-07-04#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007081
        artikel: '5'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007081
        artikel: '6'
        hoofdstuk: '2'
  - number: '14'
    text: |-
      De erkenninghouder draagt er zorg voor dat de bij hem in gebruik zijnde verzegelinrichting alsmede de aan hem
      verstrekte toegangscodes niet toegankelijk zijn voor onbevoegden.
    url: https://wetten.overheid.nl/BWBR0007081/2007-07-04#Artikel14
  - number: '15'
    text: |-
      Bij installatie mag slechts gebruik worden gemaakt van snelheidsbegrenzers die voldoen aan het bepaalde
      in [richtlijn 92/24/EEG](31992L0024) en die voorzien zijn van een goedkeuringsmerk, zoals opgenomen in
      [bijlage 4][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0007081
    url: https://wetten.overheid.nl/BWBR0007081/2007-07-04#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0007081
  - number: '16'
    text: |-
      1 Er mag slechts tot installatie worden overgegaan indien:

      a. de omtrek van de banden van de aangedreven wielen van het betrokken motorrijtuig niet meer dan 2,5% afwijkt van
      de bandenomtrek, vermeld op het in [artikel 37, eerste lid, van de Regeling controleapparaten 2005][ref1], bedoelde
      installatieplaatje;

      b. blijkt dat de verzegeling als bedoeld in hoofdstuk V, paragraaf 4, van bijlage I of als bedoeld in hoofdstuk
      V, paragraaf 3, van bijlage IB van [verordening (EEG) nr. 3821/85](31985R3821) van de Raad van 20 december 1985
      betreffende het controleapparaat in het wegvervoer (PbEG L 370) van het controleapparaat aanwezig en niet verbroken
      is.

      2 Het eerste lid is slechts van toepassing indien het snelheidssignaal ten behoeve van de snelheidsbegrenzer
      afkomstig is van het controleapparaat.


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Artikel37
    url: https://wetten.overheid.nl/BWBR0007081/2007-07-04#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0018540
        artikel: '37'
  - number: '17'
    text: |-
      Onverminderd [artikel 16, eerste lid, onder b][ref1], mag voor de installatie een verzegeling van het
      controleapparaat verbroken worden, mits het verbreken van deze verzegeling noodzakelijk is voor de aansluiting van
      de snelheidsbegrenzer op het controleapparaat.


      [ref1]: https://wetten.overheid.nl/BWBR0007081#Artikel16
    url: https://wetten.overheid.nl/BWBR0007081/2007-07-04#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007081
        artikel: '16'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '18'
    text: |-
      1 De snelheidsbegrenzer moet worden geïnstalleerd met inachtneming van:

      a. de door de fabrikant of importeur van de snelheidsbegrenzer ten aanzien van het desbetreffende merk gegeven
      installatie-instructies,

      b. de door de fabrikant of importeur van het controleapparaat gegeven instructies ten aanzien van de installatie
      van een snelheidsbegrenzer, alsmede

      c. de door de fabrikant of importeur van het betrokken voertuig gegeven instructies ten aanzien van de installatie
      van een snelheidsbegrenzer.

      2 De snelheidsbegrenzer moet worden geïnstalleerd met behulp van de in [artikel 3][ref1] bedoelde gereedschappen
      en apparatuur.


      [ref1]: https://wetten.overheid.nl/BWBR0007081#Artikel3
    url: https://wetten.overheid.nl/BWBR0007081/2007-07-04#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0007081
        artikel: '3'
        hoofdstuk: '2'
  - number: '19'
    text: |-
      De snelheidsbegrenzer moet worden afgesteld op de in [artikel 5.3.15, derde lid, van het Voertuigreglement][ref1],
      bepaalde snelheid.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.3.15
    url: https://wetten.overheid.nl/BWBR0007081/2007-07-04#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: 5.3.15
  - number: '20'
    text: |-
      1 De snelheidsbegrenzer moet in overeenstemming met het ter zake bepaalde in [richtlijn 92/24/EEG](31992L0024)
      worden verzegeld overeenkomstig het door de fabrikant van de desbetreffende snelheidsbegrenzer opgestelde
      verzegelplan.

      2 De verzegeling van de verbinding tussen de snelheidsbegrenzer en de brandstofpomp mag door een erkende
      installateur worden aangebracht ongeacht het merk snelheidsbegrenzer waarvoor deze is erkend, waarbij de melding
      als bedoeld in [artikel 23][ref1] achterwege kan blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0007081#Artikel23
    url: https://wetten.overheid.nl/BWBR0007081/2007-07-04#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0007081
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '21'
    text: |-
      1 Van iedere installatie moeten de volgende gegevens in het register worden vastgelegd:

      a. met betrekking tot de installateur:

      1º. de naam, het adres, de postcode en plaats van de installateur,

      2º. de naam van de persoon die de installatie heeft verricht;

      b. met betrekking tot het voertuig:

      1º. het kenteken, of

      2º. indien het voertuig nog niet is voorzien van een kenteken, het chassisnummer,

      3º. het merk en type, en

      4º. de bandenomtrek van de aangedreven wielen in mm;

      c. met betrekking tot de snelheidsbegrenzer:

      1º. het merk en type,

      2º. het goedkeuringsmerk, en

      3º. de ingestelde maximum snelheid;

      d. met betrekking tot de uitgevoerde werkzaamheden:

      1º. de datum van de installatie,

      2º. de handtekening van de in onderdeel a, onder 2° bedoelde persoon, en

      3º. het tijdstip van melding van de installatie, en

      4º. het resultaat van de installatie.

      2 De registerkaart moet door de erkenninghouder voor een periode van ten minste twee jaar vanaf het moment van
      installatie worden bewaard.
    url: https://wetten.overheid.nl/BWBR0007081/2007-07-04#Artikel21
  - number: '22'
    text: |-
      In de bestuurdersruimte moet op een duidelijk zichtbare plaats een installatieplaatje worden aangebracht waarop de
      ingestelde snelheid op onuitwisbare wijze is vermeld.
    url: https://wetten.overheid.nl/BWBR0007081/2007-07-04#Artikel22
  - number: '23'
    text: |-
      1 Nadat de installatie is voltooid en, indien de verzegeling van het controleapparaat overeenkomstig het
      gestelde in [artikel 17][ref1] is verbroken, nadat deze door een erkende installateur van snelheidsbegrenzers of
      controleapparaten opnieuw is aangebracht, moeten door middel van datacommunicatie de volgende gegevens aan de RDW
      worden gemeld:

      a. indien het voertuig is voorzien van een kenteken:

        - het kenteken en de meldcode gevormd door de laatste vier cijfers van het chassisnummer;

      b. indien het voertuig nog niet is voorzien van een kenteken:

        - het volledige chassisnummer.

      2 In geval van een mobiele installatie-eenheid moet in aanvulling op het eerste lid tevens het adres en de postcode
      van de werkplaats waar de installatie is verricht, worden gemeld.

      3 De door de directeur gegeven aanwijzingen met betrekking tot de melding moeten in acht worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0007081#Artikel17
    url: https://wetten.overheid.nl/BWBR0007081/2007-07-04#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0007081
        artikel: '17'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '24'
    text: |-
      1 Indien het voertuig blijkens mededeling van de RDW ten aanzien van de snelheidsbegrenzer aan een steekproef moet
      worden onderworpen, gelden voor de erkenninghouder de in de volgende leden genoemde verplichtingen.

      2 De erkenninghouder mag in de staat van een voertuig dat aan een steekproef moet worden onderworpen, gedurende
      negentig minuten na de in [artikel 23][ref1] bedoelde melding geen wijziging aanbrengen of laten aanbrengen.

      3 Aan een steekproef moet alle medewerking worden verleend. Onder alle medewerking wordt in ieder geval verstaan:

      a. dat de persoon die ingevolge [artikel 13][ref2] bevoegd is tot installeren, aanwezig is;

      b. dat indien de keuring verricht is door een mobiele installatie-eenheid, deze eenheid bij de steekproef aanwezig
      is;

      c. feitelijke assistentie wordt verleend bij het uitvoeren van de steekproef. Voorts moeten de ter zake door de
      Directeur gegeven aanwijzingen in acht worden genomen.

      4 Indien bij de steekproef wordt vastgesteld dat de snelheidsbegrenzer niet overeenkomstig de voorschriften
      voor installatie is ingebouwd, afgesteld en verzegeld, wordt door de functionaris van de RDW een
      steekproefcontrolerapport opgemaakt welke door deze wordt ondertekend, alsmede door de persoon die de installatie
      heeft verricht.

      5 De eigenaar of houder van een voertuig, waarvoor een steekproef wordt vereist:

      a. moet voorafgaande aan de steekproef deel I A dan wel deel I van het kentekenbewijs, behorende bij het
      desbetreffende voertuig, aan de daartoe aangewezen functionaris van de RDW, overleggen,

      b. mag in de in het tweede lid, bedoelde periode van 90 minuten geen wijzigingen brengen of laten brengen in de
      staat van het voertuig.


      [ref1]: https://wetten.overheid.nl/BWBR0007081#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0007081#Artikel13
    url: https://wetten.overheid.nl/BWBR0007081/2007-07-04#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0007081
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007081
        artikel: '13'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '25'
    text: |-
      De erkenninghouder mag geen handelingen verrichten dan wel laten verrichten die er toe leiden dat de
      snelheidsbegrenzer, nadat het voertuig ingevolge [artikel 23][ref1] bij de RDW is gemeld, niet langer op de
      voorgeschreven wijze is afgesteld of verzegeld.


      [ref1]: https://wetten.overheid.nl/BWBR0007081#Artikel23
    url: https://wetten.overheid.nl/BWBR0007081/2007-07-04#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0007081
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '26'
    text: |-
      De in dit hoofdstuk opgenomen regels ten aanzien van het toezicht op werkplaatsen zijn, voor zover niet anders
      bepaald, tevens van toepassing op het toezicht op mobiele installatie-eenheden.
    url: https://wetten.overheid.nl/BWBR0007081/2007-07-04#Artikel26
  - number: '27'
    text: |-
      Het bepaalde in de [paragrafen 2][ref1] en [3][ref2] laat de bevoegdheid tot intrekking, wijziging en
      schorsing van de erkenning, zoals omschreven in [artikel 103 van de wet][ref3], in andere gevallen dan de in
      [paragrafen 2][ref4] en [3][ref5] beschreven gevallen, onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0007081#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0007081#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel103
      [ref4]: https://wetten.overheid.nl/BWBR0007081#Hoofdstuk5
      [ref5]: https://wetten.overheid.nl/BWBR0007081#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0007081/2007-07-04#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0007081
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007081
        hoofdstuk: '5'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '103'
      - id: ref4
        bwb_id: BWBR0007081
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0007081
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '28'
    text: |-
      Onverminderd het bepaalde in [artikel 24, derde lid][ref1], moet in het kader van het toezicht alle medewerking aan
      de daartoe aangewezen functionarissen van de RDW worden verleend. Hieronder wordt onder andere verstaan:

      a. het verlenen van toegang tot de werkplaats,

      b. het verstrekken van inlichtingen, en

      c. het overleggen van bescheiden.

      De door de Directeur aangegeven aanwijzingen moeten in acht worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0007081#Artikel24
    url: https://wetten.overheid.nl/BWBR0007081/2007-07-04#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0007081
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '29'
    text: |-
      Nadat een erkenning is verleend wordt ten minste één maal per twee jaar door middel van een herschouwing onderzocht
      of de erkenninghouder alsmede de werkplaats nog voldoen aan de in [hoofdstuk 2][ref1] opgenomen erkenningseisen
      en of de in [hoofdstuk 4][ref2] opgenomen erkenningsvoorschriften worden nageleefd. Deze controle kan tevens
      plaatsvinden in het kader van een steekproef van het voertuig.


      [ref1]: https://wetten.overheid.nl/BWBR0007081#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0007081#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0007081/2007-07-04#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0007081
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007081
        hoofdstuk: '4'
  - number: '30'
    text: |-
      1 Indien aan één of meer erkenningseisen of erkenningsvoorschriften niet wordt voldaan, is ingevolge
      [artikel 103, tweede lid, van de wet][ref1] intrekking of wijziging van de erkenning voor de betrokken werkplaats
      mogelijk.

      2 De in het eerste lid bedoelde intrekking of wijziging van de erkenning zal, indien de erkenningseis of het
      erkenningsvoorschrift waaraan niet wordt voldaan slechts betrekking heeft op het installeren van bepaalde merken
      snelheidsbegrenzers, beperkt blijven tot die merken.

      3 De in het eerste lid bedoelde intrekking of wijziging van de erkenning zal, in het geval dat de erkenninghouder
      een erkenning heeft voor meerdere werkplaatsen, indien een van deze werkplaatsen niet voldoet aan de
      erkenningseisen of erkenningsvoorschriften, beperkt blijven tot die desbetreffende werkplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel103
    url: https://wetten.overheid.nl/BWBR0007081/2007-07-04#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '103'
  - number: '31'
    text: |-
      1 Indien er sprake is van een in het [eerste lid van artikel 29][ref1] bedoelde situatie die echter op korte
      termijn hersteld kan worden, kan, in plaats van intrekking of wijziging van de erkenning, overgegaan worden tot
      schorsing van de erkenning voor een termijn van ten hoogste twaalf weken.

      2 Wordt binnen de in het eerste lid genoemde termijn niet aangetoond dat wederom aan de erkenningseisen wordt
      voldaan, dan volgt alsnog intrekking of wijziging van de erkenning.


      [ref1]: https://wetten.overheid.nl/BWBR0007081#Artikel29
    url: https://wetten.overheid.nl/BWBR0007081/2007-07-04#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0007081
        artikel: '29'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '32'
    text: |-
      In geval van niet-naleving door de erkenninghouder van:

      a. de in [artikel 23][ref1] neergelegde verplichtingen ten aanzien van het melden van een voertuig, of

      b. de in [artikel 24, tweede en derde lid][ref2], opgenomen voorschriften, wordt terstond intrekking van de
      erkenning overwogen.


      [ref1]: https://wetten.overheid.nl/BWBR0007081#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0007081#Artikel24
    url: https://wetten.overheid.nl/BWBR0007081/2007-07-04#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0007081
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007081
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '33'
    text: |-
      1 De steekproef wordt uitgevoerd door een door de Directeur aangewezen functionaris van de RDW en vindt plaats in
      de werkplaats waar de installatie is verricht.

      2 Bij de steekproef wordt onderzocht of de snelheidsbegrenzer overeenkomstig de installatievoorschriften is
      geïnstalleerd.
    url: https://wetten.overheid.nl/BWBR0007081/2007-07-04#Artikel33
  - number: '34'
    text: |-
      1 Het resultaat van de steekproef telt mee in een door de Directeur vastgesteld systeem van bonus- en strafpunten,
      dat bekendgemaakt wordt in de Staatscourant. Aan de hand van dit systeem wordt vastgesteld of de kwaliteit van de
      door de erkenninghouder verrichte inbouwen van dien aard is dat verminderd toezicht, verscherpt toezicht dan wel
      intrekking van de erkenning mogelijk dan wel noodzakelijk is.

      2 De kennisgeving van het verscherpen van het toezicht kan plaatsvinden door middel van datacommunicatie. In dat
      geval wordt de kennisgeving na daartoe strekkend verzoek van de belanghebbende in een beschikking vastgelegd.
    url: https://wetten.overheid.nl/BWBR0007081/2007-07-04#Artikel34
  - number: '35'
    text: |-
      Op het tijdstip van inwerkingtreding van deze regeling bestaande erkenningen als installateur van
      snelheidsbegrenzers die zijn verleend op basis van artikel 66, onderdeel ij, van het Wegenverkeersreglement, worden
      aangemerkt als te zijn verleend op grond van [artikel 101 van de Wegenverkeerswet 1994][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel101
    url: https://wetten.overheid.nl/BWBR0007081/2007-07-04#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '101'
  - number: '36'
    text: |-
      Deze regeling treedt in werking met ingang van de dag waarop de [artikelen 100][ref1], [101][ref2] en
      [102 van de Wegenverkeerswet 1994][ref3] alsmede [artikel 6.14 van het Voertuigreglement][ref4] in werking treden.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel100
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel101
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel102
      [ref4]: https://wetten.overheid.nl/BWBR0006746#Artikel6.14
    url: https://wetten.overheid.nl/BWBR0007081/2007-07-04#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '100'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '101'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '102'
      - id: ref4
        bwb_id: BWBR0006746
        artikel: '6.14'
  - number: '37'
    text: 'Deze regeling wordt aangehaald als: Erkenningsregeling snelheidsbegrenzers.'
    url: https://wetten.overheid.nl/BWBR0007081/2007-07-04#Artikel37
