  - number: XII
    text: |-
      1 Het bepaalde bij en krachtens [artikel 407 van het Wetboek van Koophandel][ref1] alsmede
      [artikel 470a van het Wetboek van Strafrecht][ref2] blijven na het tijdstip van inwerkingtreding van de
      [artikelen IX, onderdeel G][ref3], en [XI, onderdeel B][ref4], van toepassing met betrekking tot vissersvaartuigen.

      2 Het bepaalde bij en krachtens
      [artikel 407, eerste en derde tot en met zevende lid, van het Wetboek van Koophandel][ref5] ten aanzien van de
      verblijven van de schepeling aan boord, alsmede kombuizen en andere ruimten voor de voeding, blijft na het tijdstip
      van inwerkingtreding van [artikel IX, onderdeel G][ref6], van toepassing met betrekking tot schepen waarvan de kiel
      is gelegd of de bouw zich in een soortgelijk stadium bevond voor dat tijdstip.


