  - number: XII.2
    text: |-
      Het bepaalde bij en krachtens
      [artikel 407, eerste en derde tot en met zevende lid, van het Wetboek van Koophandel][ref1] ten aanzien van de
      verblijven van de schepeling aan boord, alsmede kombuizen en andere ruimten voor de voeding, blijft na het tijdstip
      van inwerkingtreding van [artikel IX, onderdeel G][ref2], van toepassing met betrekking tot schepen waarvan de kiel
      is gelegd of de bouw zich in een soortgelijk stadium bevond voor dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel407
      [ref2]: https://wetten.overheid.nl/BWBR0030386#ArtikelIX
