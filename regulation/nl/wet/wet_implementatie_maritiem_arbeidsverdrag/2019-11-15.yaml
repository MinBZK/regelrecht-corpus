preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, gelet op het Maritiem Arbeidsverdrag, 2006 en Richtlijn 2009/13/
    EG van de Raad van de Europese Unie van 16 februari 2009 tot tenuitvoerlegging van de overeenkomst tussen de
    Associatie van reders van de Europese Gemeenschap (ECSA) en de Europese Federatie van vervoerswerknemers (EFT)
    inzake het Maritiem Arbeidsverdrag, 2006 en tot wijziging van Richtlijn 1999/63/EG (PbEG L 124), noodzakelijk
    is regels te stellen ter verbetering van de rechtspositie van zeevarenden alsmede dat het wenselijk is de daarop
    betrekking hebbende bepalingen te moderniseren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0030386/2019-11-15#ArtikelAanhef
articles:
  - number: VII
    text: |-
      Na de inwerkingtreding van [artikel I, onderdeel JJ][ref1], van deze wet berust:

      a. het [Besluit zeevaartbemanning handelsvaart en zeilvaart][ref2], voor zover dit berustte op de
      [Zeevaartbemanningswet][ref3], op de [artikelen 16][ref4], [18, derde, vierde, vijfde en zesde lid][ref5],
      [19, eerste lid][ref6], [22, eerste lid][ref7], [25, eerste lid][ref8], [34, eerste lid][ref9], [36][ref10],
      [44, eerste lid][ref11], [64][ref12] en [71, eerste en vierde lid, van de Wet zeevarenden][ref13];

      b. het [Besluit zeevisvaartbemanning][ref14], voor zover dit berustte op de [Zeevaartbemanningswet][ref15],
      op de [artikelen 16][ref16], [17, eerste lid][ref17],[18,derde, vierde, vijfde en zesde lid][ref18],
      [19, eerste lid][ref19], [22, eerste lid][ref20], [25, eerste lid][ref21], [34, eerste lid][ref22], [36][ref23],
      [40 eerste lid][ref24], [44, eerste lid][ref25], [64][ref26] en [71, eerste lid, van de Wet zeevarenden][ref27];

      c. het [Examenbesluit zeevaartdiploma’s 1991][ref28] op de [artikelen 19, eerste lid][ref29], en
      [77 van de Wet zeevarenden][ref30];

      d. het [Examenreglement zeevisvaart][ref31] op de [artikelen 19, eerste lid][ref32], en
      [77 van de Wet zeevarenden][ref33];

      e. het [Diensttijdreglement zeevisvaart][ref34] op de [artikelen 19, eerste lid][ref35], en
      [77 van de Wet zeevarenden][ref36];

      f. het [Besluit zeevaartdiploma’s experimenterend hoger nautisch onderwijs][ref37] op de
      [artikelen 19, eerste lid][ref38], en [77 van de Wet zeevarenden][ref39];

      g. het [Besluit bijzondere verkrijging diploma’s kleine handelsvaart][ref40] op de
      [artikelen 19, eerste lid][ref41], en [77 van de Wet zeevarenden][ref42];

      h. het [Besluit bijzondere verkrijging voorlopig diploma als scheepswerktuigkundige][ref43] op de
      [artikelen 19, eerste lid][ref44], en [77 van de Wet zeevarenden][ref45];

      i. het [Besluit bijzondere verkrijging diploma A als scheepswerktuigkundige][ref46] op de
      [artikelen 19, eerste lid][ref47], en [77 van de Wet zeevarenden][ref48];

      j. de [Regeling normen ter bepaling uitslag zeevisvaartexamens][ref49] op de [artikelen 19, eerste lid][ref50], en
      [77 van de Wet zeevarenden][ref51];

      k. de [Regeling gegevens aanvraag bemanningscertificaat zeevisvaart][ref52] op
      [artikel 17, vierde lid, van de Wet zeevarenden][ref53];

      l. de [Regeling certificering scheepsbeveiligingsfunctionarissen][ref54], voor zover die berustte op de
      [Zeevaartbemanningswet][ref55], op [artikel 21 van de Wet zeevarenden][ref56];

      m. de [Regeling tarieven scheepvaart][ref57], voor zover die berustte op de [Zeevaartbemanningswet][ref58], op
      [artikel 62, aanhef en onderdelen a tot en met d, f, h, i en j, van de Wet zeevarenden][ref59].


