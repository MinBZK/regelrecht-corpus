preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Allen die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat het wenselijk is de uitvoering van enige wetten door het
    Uitvoeringsinstituut werknemersverzekeringen te vereenvoudigen en enkele begrippen in die wetten te harmoniseren;


    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0029334/2012-03-01#ArtikelAanhef
articles:
  - number: XIX
    text: >-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld, en kunnen terugwerken tot en met
      een in dat besluit te bepalen tijdstip, dat voor de verschillende artikelen of onderdelen daarvan verschillend kan
      worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0029334/2012-03-01#ArtikelXIX
  - number: XX
    text: 'Deze wet wordt aangehaald als: Wet harmonisatie en vereenvoudiging socialezekerheidswetgeving.'
    url: https://wetten.overheid.nl/BWBR0029334/2012-03-01#ArtikelXX
