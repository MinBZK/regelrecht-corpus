      - id: ref3
        bwb_id: BWBR0006126
      - id: ref4
        bwb_id: BWBR0006126
      - id: ref5
        bwb_id: BWBR0006126
  - number: '12'
    text: |-
      1 Bij volledige zuigelingenvoeding en opvolgzuigelingenvoeding worden slechts vermeldingen gebezigd die vrouwen
      niet weerhouden van het geven van borstvoeding, met dien verstande dat:

      a. beweringen als "gehumaniseerd" en "gematerniseerd" niet gebezigd worden; en

      b. de bewering "aangepast" slechts wordt gebezigd met inachtneming van [artikel 9, tweede lid][ref1], en van
      [bijlage IV][ref2], [punt 1][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006126#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0006126
      [ref3]: https://wetten.overheid.nl/BWBR0006126
    url: https://wetten.overheid.nl/BWBR0006126/2000-06-30#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006126
        artikel: '9'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0006126
      - id: ref3
        bwb_id: BWBR0006126
  - number: '13'
    text: |-
      1 De rechtstreekse verkoop van volledige zuigelingenvoeding aan de consument wordt op geen enkele wijze
      aangeprezen.

      2 In afwijking van het eerste lid mag volledige zuigelingenvoeding worden aangeprezen in wetenschappelijke
      publikaties, voor zover daarbij:

      a. uitsluitend gegevens van wetenschappelijke en feitelijke aard worden genoemd; en

      b. niet de indruk wordt gewekt dat flesvoeding gelijkwaardig aan of beter zou zijn dan borstvoeding.
    url: https://wetten.overheid.nl/BWBR0006126/2000-06-30#Artikel13
  - number: '14'
    text: |-
      1 Schenken van voorlichtings- of educatiefmateriaal inzake zuigelingenvoeding en van de daarvoor benodigde
      apparatuur door fabrikanten of groothandelaren is slechts toegestaan met schriftelijke toestemming daartoe van de
      Minister van Welzijn, Volksgezondheid en Cultuur.

      2 Materiaal en apparatuur, bedoeld in het eerste lid, zijn niet voorzien van een handelsmerk van zuigelingenvoeding
      en worden slechts met inschakeling van het stelsel van de gezondheidszorg verspreid.
    url: https://wetten.overheid.nl/BWBR0006126/2000-06-30#Artikel14
  - number: '15'
    text: |-
      Schenking of aflevering tegen lage prijzen van zuigelingenvoeding aan instellingen of organisaties, vindt slechts
      plaats ten behoeve van zuigelingen die met zuigelingenvoeding moeten worden gevoed, gedurende de periode dat die
      zuigelingen daaraan behoefte hebben.
    url: https://wetten.overheid.nl/BWBR0006126/2000-06-30#Artikel15
  - number: '16'
    text: |-
      De Stichting Centraal Orgaan voor Kwaliteitsaangelegenheden in de Zuivel te Leusden is mede belast met het toezicht
      op de naleving door de bij haar aangeslotenen van de bij deze regeling gestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0006126/2000-06-30#Artikel16
  - number: 16a
    text: |-
      Als methoden van onderzoek welke bij uitsluiting beslissend zijn voor de vaststelling of met betrekking tot
      zuigelingenvoeding of opvolgzuigelingenvoeding al dan niet is voldaan aan [artikel 6a][ref1], worden aangewezen de
      algemeen aanvaarde gestandaardiseerde methoden.


      [ref1]: https://wetten.overheid.nl/BWBR0006126#Artikel6a
    url: https://wetten.overheid.nl/BWBR0006126/2000-06-30#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0006126
        artikel: 6a
        paragraaf: '3'
  - number: '17'
    text: |-
      De Regeling zuigelingenvoeding ([Warenwet][ref1]) wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0001969
    url: https://wetten.overheid.nl/BWBR0006126/2000-06-30#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001969
  - number: '18'
    text: Deze regeling treedt in werking met ingang van 1 juni 1994.
    url: https://wetten.overheid.nl/BWBR0006126/2000-06-30#Artikel18
  - number: '19'
    text: |-
      Deze regeling wordt aangehaald als: [Warenwetregeling Zuigelingenvoeding][ref1]. Deze regeling zal met de
      toelichting in de Staatscourant worden geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0006126
    url: https://wetten.overheid.nl/BWBR0006126/2000-06-30#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006126
  - number: BI:3.1
    text: |-
      De volgende stoffen worden niet gebruikt:

        - sesamolie,
        - katoenzaadolie.
    url: https://wetten.overheid.nl/BWBR0006126/2000-06-30#Artikel3.1
  - number: BI:3.5
    text: |-
      Het gehalte aan alfa-linoleenzuur bedraagt ten minste 12 mg/100 kJ (50 mg/100 kcal). De verhouding linolzuur/alfa-
      linoleenzuur bedraagt ten minste 5 en ten hoogste 15.
    url: https://wetten.overheid.nl/BWBR0006126/2000-06-30#Artikel3.5
  - number: BI:3.6
    text: Het gehalte aan trans-isomeren van vetzuren bedraagt ten hoogste 4% van het totale vetgehalte.
    url: https://wetten.overheid.nl/BWBR0006126/2000-06-30#Artikel3.6
  - number: BI:3.7
    text: Het gehalte aan erucazuur bedraagt ten hoogste 1% van het totale vetgehalte.
    url: https://wetten.overheid.nl/BWBR0006126/2000-06-30#Artikel3.7
  - number: BI:3.8
    text: |-
      LC-PUFA's, dat wil zeggen meervoudig onverzadigde vetzuren met een lange keten (20 en 22 koostofatomen) mogen
      worden toegevoegd tot een gehalte van ten hoogste:

        - 1% van het totale vetgehalte voor n-3 LC-PUFA's; en
        - 2% van het totale vetgehalte voor n-6 LC-PUFA's (1 % van het totale vetgehalte voor arachidonzuur).

      Het gehalte aan eicosapentaeenzuur (20:5 n-3) is niet hoger dan het gehalte aan docosahexaeenzuur (22:6 n-3).
    url: https://wetten.overheid.nl/BWBR0006126/2000-06-30#Artikel3.8
  - number: BI:4.1
    text: |-
        - lactos
        - maltose,
        - sucrose,
        - maltodextrine,
        - glucosestroop of gedehydrateerde glucosestroop of gedroogde of watervrije glucosestroop,
        - voorgekookt zetmeel, van nature glutenvrij,
        - gegelatineerd zetmeel, van nature glutenvrij.
    url: https://wetten.overheid.nl/BWBR0006126/2000-06-30#Artikel4.1
  - number: BII:3.1
    text: |-
      De volgende stoffen worden niet gebruikt:

        - sesamolie,
        - katoenzaadolie.
    url: https://wetten.overheid.nl/BWBR0006126/2000-06-30#Artikel3.1
  - number: BII:3.5
    text: Het gehalte aan trans-isomeren van vetzuren is ten hoogste 4% van het totale vetgehalte.
    url: https://wetten.overheid.nl/BWBR0006126/2000-06-30#Artikel3.5
  - number: BII:3.6
    text: Het gehalte aan erucazuur is ten hoogste 1% van het totale vetgehalte.
    url: https://wetten.overheid.nl/BWBR0006126/2000-06-30#Artikel3.6
  - number: BII:4.1
    text: Gluten bevattende bestanddelen worden niet gebruikt.
    url: https://wetten.overheid.nl/BWBR0006126/2000-06-30#Artikel4.1
  - number: BII:5.3
    text: |-
      De concentraties zijn ten minste gelijk aan de normaal in koemelk aangetroffen concentraties, eventueel verlaagd
      in de dezelfde verhouding als die tussen de eiwitconcentratie van de opvolgzuigelingenvoeding en die van koemelk.
      Bijlage VII bevat ter indicatie de normale samenstelling van koemelk.
    url: https://wetten.overheid.nl/BWBR0006126/2000-06-30#Artikel5.3
