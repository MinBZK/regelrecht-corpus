    Gelet op Richtlijn 91/321/EEG van de Commissie van 14 mei 1991 inzake volledige zuigelingenvoeding en
    opvolgzuigelingenvoeding (PbEG L 175), alsmede op artikel 13 van de Warenwet (Stb. 1988, 360), op artikel 19,
    eerste lid, van de Landbouwwet, en op artikel 10, eerste en tweede lid, van het Warenwetbesluit Produkten voor
    bijzondere voeding;

    Gezien de adviezen van de Adviescommissie Warenwet van 19 januari 1989 met nummer 14107/(24)15, van 17 oktober 1990
    met nummer 14337/(1)5 en van 10 maart 1993 met nummer 14633/(3)5

