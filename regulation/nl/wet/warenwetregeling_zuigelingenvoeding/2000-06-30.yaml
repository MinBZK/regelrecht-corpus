  - number: '3'
    text: |-
      Grondstoffen welke gebruikt worden bij de bereiding van volledige zuigelingenvoeding en opvolgzuigelingenvoeding,
      voldoen aan de navolgende eisen:

      a. vreemde bestanddelen, antibiotica daaronder begrepen, en andere verontreinigingen zijn niet aanwezig, met dien
      verstande dat:

      1º bij de bepaling van antibiotica geen grotere groeiremming wordt aangetoond dan overeenkomt met:

      A. 0,010 internationale eenheden penicilline per ml in door een melkveehouder aan een zuivelfabriek te leveren
      melk;

      B. 0,003 internationale eenheden penicilline per ml in andere dan de onder A genoemde melk;

      C. 0003 internationale eenheden penicilline per ml, berekend op melkbasis, in uit melk bereide produkten;

      2º het gehalte aan aflatoxine M1 niet hoger is dan 0,05 µg per kg berekend op basis van melk;

      b. de grondstof melk voldoet aan de desbetreffende wettelijke eisen;

      c. het gehalte aan nitriet, berekend als nitriet-ion (NO2-), in wei en weipoeder en uit wei bereide produkten, is
      niet hoger dan 1 mg per kg berekend op de droge stof, met dien verstande, dat uit wei bereide produkten met een
      asgehalte van minder dan 4%, genoemd gehalte lager dan (E/13) x 0,5 mg per kg droge stof is, waarbij E staat voor
      het eiwitgehalte van het betrokken weiprodukt, berekend op de droge stof en met dien verstande dat voor produkten
      met een lager eiwitgehalte dan 135% een maximum gehalte van 0,5 mg per kg droge stof geldt;

      d. in afwijking van onderdeel b is de zuurtegraad van de grondstof melk niet hoger dan:

      1º 17,5°N, zulks uitsluitend voor al dan niet geheel of gedeeltelijk afgeroomde melk en voor room, in geval van
      room berekend op de vetvrije waar;

      2º 18,5 mmol natriumhydroxide per 100 g vetvrije droge stof, zulks uitsluitend voor geheel of gedeeltelijk
      gedehydrateerde melk; en

      e. een hoger gehalte aan lactaten, berekend op de vetvrije droge stof van de room, de al dan niet geheel of
      gedeeltelijk ontroomde melk en de geheel of gedeeltelijk gedehydrateerde vormen daarvan, dan 100 mg per 100 g, is
      niet aanwezig.
    url: https://wetten.overheid.nl/BWBR0006126/2000-06-30#Artikel3
  - number: '4'
    text: |-
      1 Volledige zuigelingenvoeding voldoet voor wat betreft de samenstelling aan [bijlage I][ref1].

      2 Opvolgzuigelingenvoeding voldoet voor wat betreft de samenstelling aan [bijlage II][ref2].

      3 De in het eerste en tweede lid bedoelde waar is, al dan niet na de toevoeging van water, gereed voor consumptie.


      [ref1]: https://wetten.overheid.nl/BWBR0006126
      [ref2]: https://wetten.overheid.nl/BWBR0006126
    url: https://wetten.overheid.nl/BWBR0006126/2000-06-30#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006126
      - id: ref2
        bwb_id: BWBR0006126
  - number: '6'
    text: |-
      1 In volledige zuigelingenvoeding en opvolgzuigelingenvoeding is het nitraatgehalte, berekend als nitraat-ion
      (NO3-), niet hoger dan 50 mg per kg droge stof.

      2 Volledige zuigelingenvoeding en opvolgzuigelingenvoeding in poedervorm voldoen aan de volgende eisen:

      a. het aantal aeroob kweekbare micro-organismen (kiemgetal) bedraagt niet meer dan 10.000 per g;

      b. Enterobacteriaceae zijn in 1 g niet aantoonbaar;

      c. het aantal kweekbare gisten en schimmels bedraagt ieder afzonderlijk niet meer dan 100 per g;

      d. pathogene micro-organismen en hun toxinen zijn afwezig, met dien verstande dat:

      1º het aantal kweekbare Bacillus cereus niet meer dan 100 per g bedraagt;

      2º Staphylococcus aureus geacht wordt afwezig te zijn, indien micro-organisemen van dit type niet aantoonbaar zijn
      in 1 g;

      3º Salmonellae geacht worden afwezig te zijn, indien micro-organismen van dit type niet aantoonbaar zijn in 50 g;

      e. fosfatase-activiteit is niet aantoonbaar.

      3 Vloeibare volledige zuigelingenvoeding en vloeibare opvolgzuigelingenvoeding zijn:

      a. gesteriliseerd en voldoen aan artikel 34, vierde en vijfde lid, van het Melkbesluit ([Warenwet][ref1]) 1974; of

      b. ultra hoog verhit en voldoen aan artikel 34, zevende lid, van het Melkbesluit ([Warenwet][ref2]) 1974.


      [ref1]: https://wetten.overheid.nl/BWBR0001969
      [ref2]: https://wetten.overheid.nl/BWBR0001969
    url: https://wetten.overheid.nl/BWBR0006126/2000-06-30#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001969
      - id: ref2
        bwb_id: BWBR0001969
  - number: 6a
    text: |-
      Volledige zuigelingenvoeding, en opvolgzuigelingenvoeding, die gereed zijn voor onmiddellijke consumptie of zijn
      gereconstitueerd volgens de aanwijzingen van de fabrikant daarvan, bevatten ten hoogste 0,01 mg/kg residuen van
      afzonderlijke bestrijdingsmiddelen.
    url: https://wetten.overheid.nl/BWBR0006126/2000-06-30#Artikel6a
  - number: '7'
    text: |-
      1 De aanduiding volledige zuigelingenvoeding mag uitsluitend en moet worden gebezigd voor de waar, bedoeld in
      [artikel 1, onder b][ref1].

      2 In afwijking van het eerste lid mag uitsluitend en moet de daar bedoelde waar die volledig uit koemelk-eiwit is
      bereid, worden aangeduid met volledige zuigelingenvoeding op basis van melk of met zuigelingenmelk.


      [ref1]: https://wetten.overheid.nl/BWBR0006126#Artikel1
    url: https://wetten.overheid.nl/BWBR0006126/2000-06-30#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006126
        artikel: '1'
        paragraaf: '1'
  - number: '8'
    text: |-
      1 De aanduiding opvolgzuigelingenvoeding mag uitsluitend en moet worden gebezigd voor de waar, bedoeld in
      [artikel 1, onder c][ref1].

      2 In afwijking van het eerste lid mag uitsluitend en moet de daar bedoelde waar die uitsluitend uit koemelk-eiwit
      is bereid, worden aangeduid met opvolgmelk.


      [ref1]: https://wetten.overheid.nl/BWBR0006126#Artikel1
    url: https://wetten.overheid.nl/BWBR0006126/2000-06-30#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006126
        artikel: '1'
        paragraaf: '1'
  - number: '9'
    text: |-
      1 Onverminderd het [Warenwetbesluit Etikettering van levensmiddelen][ref1] worden bij volledige zuigelingenvoeding
      de volgende vermeldingen gebezigd:

      a. een vermelding dat de waar specifiek geschikt is als voeding voor zuigelingen vanaf de geboorte, die geen
      borstvoeding krijgen;

      b. voor zover de waar geen toegevoegd ijzer bevat: een vermelding dat aan de totale ijzerbehoefte van zuigelingen
      die ouder zijn dan vier maanden, slechts kan worden voldaan door daartoe ook nog andere bronnen te gebruiken;

      c. voorafgegaan door het woord belangrijk of een woord van gelijke strekking:

      1º een verklaring dat borstvoeding de voorkeur heeft; en

      2º een aanbeveling dat de waar alleen dient te worden gebruikt op advies van onafhankelijke deskundigen op het
      gebied van geneeskunde, voeding of farmaceutische wetenschap of van personen die beroepsmatig verantwoordelijk zijn
      voor de zorg voor moeder en kind.

      2 Bij volledige zuigelingenvoeding worden slechts in de in [bijlage IV][ref2] bedoelde gevallen en in
      overeenstemming met de daarin vastgestelde voorwaarden, vermeldingen gebezigd inzake de speciale samenstelling van
      de waar.

      3 Bij volledige zuigelingenvoeding worden geen afbeeldingen van zuigelingen, noch andere vermeldingen, gebezigd
      waardoor het gebruik van de waar zou kunnen worden geïdealiseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005310
      [ref2]: https://wetten.overheid.nl/BWBR0006126
    url: https://wetten.overheid.nl/BWBR0006126/2000-06-30#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005310
      - id: ref2
        bwb_id: BWBR0006126
  - number: '10'
    text: |-
      Onverminderd het [Warenwetbesluit Etikettering van levensmiddelen][ref1] worden bij opvolgzuigelingenvoeding
      vermeldingen gebezigd, aangevende dat de waar:

      a. alleen geschikt is om voor specifieke doeleinden te worden gebruikt als voeding voor zuigelingen die ouder zijn
      dan vier maanden;

      b. slechts een onderdeel van een gevarieerde voeding mag zijn; en

      c. gedurende de eerste vier levensmaanden niet mag worden gebruikt als vervanging van moedermelk.


      [ref1]: https://wetten.overheid.nl/BWBR0005310
    url: https://wetten.overheid.nl/BWBR0006126/2000-06-30#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005310
  - number: '11'
    text: |-
      1 Onverminderd het [Warenwetbesluit Etikettering van levensmiddelen][ref1] worden bij volledig zuigelingenvoeding
      en opvolgzuigelingenvoeding vermeldingen gebezigd, aangevende:

      a. de beschikbare energiewaarde van de waar, uitgedrukt in kJ en kcal, per 100 ml van de voor consumptiegerede
      waar;

      b. het gehalte aan eiwitten, vetten en koolhydraten, uitgedrukt in een getal, per 100 ml van de voor consumptie
      gerede waar;

      c. de gemiddelde hoeveelheden van:

      1º elk mineraal dat en elke vitamine die is vermeld in [bijlage I][ref2] onderscheidenlijk [bijlage II][ref3]; en

      2º indien van toepassing, van choline, inositol, carnitine en taurine; steeds uitgedrukt in een getal, per 100 ml
      van de voor consumptie gerede waar; en

      d. een gebruiksaanwijzing voor de juiste bereiding van de waar, vergezeld van een waarschuwing dat een onjuiste
      bereiding een risico voor de gezondheid op kan leveren.

      2 Onverminderd het eerste lid mogen vermeldingen worden gebezigd, aangevende:

      a. bij volledige zuigelingenvoeding en opvolgzuigelingenvoeding: de gemiddelde hoeveelheid van de in
      [bijlage III][ref4] genoemde voedingsstoffen, uitgedrukt in een getal, per 100 ml van de voor consumptie gereden
      waar; en

      b. bij opvolgzuigelingenvoeding: de hoeveelheden van de in [bijlage IX][ref5] genoemde vitamines en mineralen,
      steeds uitgedrukt als een percentage van de desbetreffende, in die bijlage vermelde referentiewaarde, per 100 ml
      van de voor consumptiegerede waar, voor zover dat percentage ten minste 15% bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0005310
      [ref2]: https://wetten.overheid.nl/BWBR0006126
      [ref3]: https://wetten.overheid.nl/BWBR0006126
      [ref4]: https://wetten.overheid.nl/BWBR0006126
      [ref5]: https://wetten.overheid.nl/BWBR0006126
    url: https://wetten.overheid.nl/BWBR0006126/2000-06-30#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005310
      - id: ref2
