        artikel: '1'
  - number: '2'
    text: |-
      Bij de bereiding van volledige zuigelingenvoeding en van opvolgzuigelingenvoeding wordt geen gebruik gemaakt van:

      a. andere eiwitbronnen dan die bedoeld in de [bijlagen I][ref1], [II][ref2], [III][ref3], [V][ref4] en [VI][ref5];

      b. andere bestanddelen van eet- of drinkwaren dan die waarvan op grond van algemeen aanvaarde wetenschappelijke
      gegevens is aangetoond dat zij geschikt zijn als specifieke voeding voor de desbetreffende zuigelingen; en

      c. andere voedingsstoffen dan die bedoeld in [bijlage III][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0006126
      [ref2]: https://wetten.overheid.nl/BWBR0006126
