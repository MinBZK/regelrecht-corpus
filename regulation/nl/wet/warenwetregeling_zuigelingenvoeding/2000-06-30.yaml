articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
            zuigelingen:

              kinderen jonger dan twaalf maanden;



            b
            volledige zuigelingenvoeding:

              voedingsmiddelen die speciaal zijn bedoeld als voeding voor gezonde zuigelingen in de eerste vier tot zes
      levensmaanden, en die volledig aan de voedingseisen van deze categorie personen voldoen;



            c
            opvolgzuigelingenvoeding:

              voedingsmiddelen die speciaal zijn bedoeld als voeding voor gezonde zuigelingen die ouder zijn dan vier
      maanden, en die het belangrijkste vloeibare bestanddeel vormen van de steeds gevarieerder wordende voeding van
      deze personen;



            d
            residu van bestrijdingsmiddelen:

              het residu in volledige zuigelingenvoeding en opvolgzuigelingenvoeding, van een gewasbeschermingsmiddel
      als bedoeld in [artikel 1, eerste lid, onder g, van de Bestrijdingsmiddelenwet 1962][ref1], met inbegrip van de
      metabolieten daarvan en de producten die bij de afbraak of de reactie vrijkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel1
    url: https://wetten.overheid.nl/BWBR0006126/2000-06-30#Artikel1
