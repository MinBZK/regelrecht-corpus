  - number: '4.7'
    text: |-
      1 De [Landinrichtingswet][ref1] blijft van toepassing op landinrichtingsprojecten die al in voorbereiding of
      in uitvoering waren op 1 januari 2007, waarbij in [artikel 187, eerste lid, van de Landinrichtingswet][ref2]
      in plaats van de zinsnede «vast recht, als bedoeld in de [Wet tarieven in burgerlijke zaken][ref3] (Stb.
      1960, 541)» wordt gelezen: «griffierecht, als bedoeld in de [Wet griffierechten burgerlijke zaken][ref4]»
      en waarbij, nadat de lijst der geldelijke regelingen door de rechtbank is gesloten op grond van
      [artikel 217, eerste lid, van de Landinrichtingswet][ref5], het door de eigenaar verschuldigde bedrag, bedoeld
      in [artikel 223, tweede lid, van de Landinrichtingswet][ref6] wordt gecorrigeerd met een door gedeputeerde staten
      vastgestelde correctiefactor, zijnde het quotiënt van de definitieve kosten en de kosten zoals deze oorspronkelijk
      in de lijst der geldelijke regelingen waren opgenomen.

      2 De [Herinrichtingswet Oost-Groningen en de Gronings-Drentse Veenkoloniën][ref7] blijft van toepassing op
      herinrichtingsprojecten op grond van die wet die al in voorbereiding of in uitvoering waren op 1 juli 2014.


