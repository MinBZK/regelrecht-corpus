  - number: '4.2'
    text: |-
      1 Een onherroepelijk voorkeursrecht, gevestigd op grond van [artikel 2][ref1] in samenhang met
      [artikel 3, eerste lid, van de Wet voorkeursrecht gemeenten][ref2] geldt als een voorkeursrecht op grond van
      [artikel 9.1, eerste lid, onder a, van de Omgevingswet][ref3].

      2 Een onherroepelijk voorkeursrecht gevestigd op grond van [artikel 2][ref4] in samenhang met
      [artikel 4, eerste lid, van de Wet voorkeursrecht gemeenten][ref5] geldt als een voorkeursrecht op grond
      van [artikel 9.1, eerste lid, onder b, van de Omgevingswet][ref6] of als een voorkeursrecht op grond van een
      structuurvisie als bedoeld in [artikel 2.1 van de Wet ruimtelijke ordening][ref7] zolang nog geen gemeentelijke
      omgevingsvisie als bedoeld in [artikel 3.1, eerste lid, van de Omgevingswet][ref8] is vastgesteld.

      3 Een onherroepelijk voorkeursrecht gevestigd op grond van [artikel 2][ref9] in samenhang met
      [artikel 5, eerste lid, van de Wet voorkeursrecht gemeenten][ref10] geldt als een voorkeursrecht op grond van
      [artikel 9.1, onder c, van de Omgevingswet][ref11].

      4 Een onherroepelijk voorkeursrecht gevestigd op grond van [artikel 6 van de Wet voorkeursrecht gemeenten][ref12]
      geldt als een voorkeursrecht op basis van [artikel 9.1, tweede lid, van de Omgevingswet][ref13].

      5 Een onherroepelijk voorkeursrecht gevestigd op grond van
      [artikel 9a, eerste lid, eerste zin, van de Wet voorkeursrecht gemeenten][ref14] geldt als een voorkeursrecht op
      grond van [artikel 9.1, eerste lid, van de Omgevingswet][ref15].

      6 Een onherroepelijk voorkeursrecht gevestigd op grond van artikel
      [9a, eerste lid, derde zin, van de Wet voorkeursrecht gemeenten][ref16] geldt als een voorkeursrecht op grond van
      [artikel 9.1, tweede lid, van de Omgevingswet][ref17].

      7 Een onherroepelijk voorkeursrecht gevestigd op grond van
      [artikel 9a, tweede lid, van de Wet voorkeursrecht gemeenten][ref18] geldt als een voorkeursrecht op grond van
      [artikel 9.1, eerste lid, van de Omgevingswet][ref19].


