  - number: '4.8'
    text: |-
      Als voor de inwerkingtreding van deze wet schade is ontstaan als gevolg van een gedoogplicht als bedoeld in:

      a. de [artikelen 22][ref1] en [41 van de Wet inrichting landelijk gebied][ref2], of

      b. [artikel 64b, tweede lid, van de onteigeningswet][ref3],

      blijft het oude recht van toepassing op een vordering tot schadevergoeding die is gedaan binnen vijf jaar na de
      inwerkingtreding van de wet en bij toewijzing van die vordering, tot de schade volledig is vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0020748#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0001842#Artikel64b
