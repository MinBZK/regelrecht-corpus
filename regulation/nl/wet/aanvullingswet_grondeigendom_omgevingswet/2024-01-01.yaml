  - number: '4.1'
    text: |-
      1 Als voor de inwerkingtreding van deze wet op basis van de [Wet voorkeursrecht gemeenten][ref1] een besluit tot
      voorlopige aanwijzing van gronden of een besluit tot aanwijzing van gronden is genomen, blijft het oude recht van
      toepassing tot het besluit onherroepelijk wordt.

      2 Als voor de inwerkingtreding van deze wet een besluit als bedoeld in [artikel 10, zesde lid][ref2], of
      [12, eerste lid, van de Wet voorkeursrecht gemeenten][ref3] is genomen, blijft het oude recht van toepassing tot
      het besluit onherroepelijk wordt.

      3 Als voor de inwerkingtreding van deze wet een rechtsgeding met betrekking tot een op basis van de
      [Wet voorkeursrecht gemeenten][ref4] onherroepelijk gevestigd voorkeursrecht aanhangig is, blijft het oude recht
      van toepassing tot het rechtsgeding onherroepelijk is afgerond.

      4 Als voor de inwerkingtreding van deze wet een vordering tot schadevergoeding op grond van
      [artikel 25 van de Wet voorkeursrecht gemeenten][ref5] bij de gemeente, de provincie of de Staat is ingediend,
      blijft het oude recht van toepassing tot het tijdstip waarop een vonnis over die vordering in kracht van gewijsde
      is gegaan en, bij toewijzing van die vordering, de schade volledig is vergoed.


