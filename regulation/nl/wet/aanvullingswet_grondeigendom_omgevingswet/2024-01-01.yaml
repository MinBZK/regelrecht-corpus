  - number: 4.4a
    text: |-
      Als onteigening plaatsvindt vanwege een besluit dat op grond van
      [artikel 4.6, eerste lid, onder a, b, c, g, h, i, j, k of l, van de Invoeringswet Omgevingswet][ref1] geldt als
      deel van het omgevingsplan, is van onteigening als bedoeld in [artikel 11.6, onder a, van de Omgevingswet][ref2]
      ook sprake als de bestaande vorm van ontwikkeling, gebruik of beheer niet is uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0043660#Artikel4.6
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel11.6
    url: https://wetten.overheid.nl/BWBR0043371/2024-01-01#Artikel4.4a
