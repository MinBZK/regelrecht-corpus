  - number: '5.1'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de
      verschillende hoofdstukken, artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0043371/2024-01-01#Artikel5.1
  - number: '5.2'
