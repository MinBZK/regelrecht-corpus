  - number: '4.6'
    text: |-
      1 Een inrichtingsplan als bedoeld in [artikel 17 van de Wet inrichting landelijk gebied][ref1]
      geldt voor de onderdelen waartegen beroep openstaat als inrichtingsbesluit als bedoeld in
      [artikel 12.7 van de Omgevingswet][ref2] en voor de overige onderdelen als een inrichtingsprogramma als bedoeld in
      [artikel 3.14a van de Omgevingswet][ref3].

      2 Een ruilplan als bedoeld in [artikel 47 van de Wet inrichting landelijk gebied][ref4] geldt als ruilbesluit als
      bedoeld in [artikel 12.22 van de Omgevingswet][ref5].

      3 In afwijking van het eerste lid vervalt een inrichtingsplan voor zover dat voorziet in de toewijzing en regeling
      van het beheer en onderhoud van waterlopen, dijken of kaden met de daartoe behorende kunstwerken, bedoeld in
      [artikel 28, onder b, van de Wet inrichting landelijk gebied][ref6], op het tijdstip waarop deze wet in werking
      treedt.


