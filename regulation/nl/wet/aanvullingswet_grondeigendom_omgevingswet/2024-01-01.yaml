  - number: '4.5'
    text: |-
      1 Als een ontwerp van een besluit:

      a. tot vaststelling van een inrichtingsplan als bedoeld in
      [artikel 17 van de Wet inrichting landelijk gebied][ref1],

      b. tot vaststelling van een ruilplan als bedoeld in [artikel 47 van de Wet inrichting landelijk gebied][ref2],

      c. tot vaststelling van een lijst der geldelijke regelingen als bedoeld in
      [artikel 47 van de Wet inrichting landelijk gebied][ref3],

      d. als bedoeld in [artikel 45 van de Wet inrichting landelijk gebied][ref4],

      voor de inwerkingtreding van de [Omgevingswet][ref5] ter inzage is gelegd, blijft het oude recht van toepassing tot
      het besluit onherroepelijk wordt.

      2 Als voor de inwerkingtreding van de [Omgevingswet][ref6] voor een besluit als bedoeld
      in [artikel 44 van de Wet inrichting landelijk gebied][ref7] toepassing is gegeven aan
      [artikel 4:8 van de Algemene wet bestuursrecht][ref8] of het besluit is bekendgemaakt, blijft het oude recht van
      toepassing tot het besluit onherroepelijk wordt.


