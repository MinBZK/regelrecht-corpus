  - number: '4.9'
    text: |-
      Zolang nog geen gemeentelijke omgevingsvisie als bedoeld in [artikel 3.1, eerste lid, van de Omgevingswet][ref1]
      is vastgesteld, kan het college van burgemeester en wethouders in een overeenkomst als bedoeld
      in [artikel 13.22, eerste lid, van de Omgevingswet][ref2] ook bepalingen opnemen over financiële
      bijdragen voor ontwikkelingen van een gebied op basis van een structuurvisie als bedoeld in
      [artikel 2.1, eerste lid, van de Wet ruimtelijke ordening][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel3.1
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel13.22
