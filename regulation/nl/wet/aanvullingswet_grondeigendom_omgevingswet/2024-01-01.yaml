  - number: '4.4'
    text: |-
      1 Als voor de inwerkingtreding van deze wet een verzoek tot het nemen van een besluit als bedoeld in
      [artikel 62, eerste lid][ref1], [72a, eerste lid][ref2], [72b, eerste lid][ref3], [72c, tweede lid][ref4],
      [78, eerste lid][ref5], en [122, tweede lid, van de onteigeningswet][ref6] is ingediend, blijft het oude recht
      van toepassing.

      2 Als voor de inwerkingtreding van deze wet een rechtsgeding met betrekking tot een voltooide onteigening op grond
      van de [onteigeningswet][ref7] aanhangig is, blijft het oude recht van toepassing tot het tijdstip waarop het
      vonnis kracht van gewijsde heeft gekregen en ten uitvoer is gebracht.

      3 In een geval als bedoeld in [artikel 4.64, eerste lid][ref8], of
      [4.65, eerste lid, van de Invoeringswet Omgevingswet][ref9] blijft, voor zover het gaat om onteigening als bedoeld
      in [artikel 5.14, eerste lid, van de Waterwet][ref10], het oude recht van toepassing tot de activiteit, genoemd in
      de omgevingsvergunning, ten uitvoer is gelegd.


