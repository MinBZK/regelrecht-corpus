    text: |-
      1 Deze verordening treedt in werking met ingang van 1 januari 2006.

      2 De [Verordening op de tarieven periodieke preventieve toetsing 2005][ref1] wordt ingetrokken op het tijdstip
      bedoeld in het eerste lid, maar blijft van toepassing voor de periode waarin deze heeft gegolden.

      3 Deze verordening kan worden aangehaald als: Verordening op de tarieven periodieke preventieve toetsing 2006.


