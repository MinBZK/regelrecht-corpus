articles:
  - number: '1'
    text: |-
      Het tarief voor het beoordelen en goedkeuren van het verbeterplan als bedoeld in
      [artikel 11, vijfde lid van de Verordening op de periodieke preventieve toetsing][ref1] bedraagt € 250,–.


      [ref1]: https://wetten.overheid.nl/BWBR0014165#Artikel11
    url: https://wetten.overheid.nl/BWBR0018433/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014165
        artikel: '11'
  - number: '2'
    text: |-
      Het tarief voor de behandeling van een verzoek tot vrijstelling van de toetsing of de verlenging daarvan als
      bedoeld in [artikel 14, tweede lid van de Verordening op de periodieke preventieve toetsing][ref1] bedraagt € 50,–.


      [ref1]: https://wetten.overheid.nl/BWBR0014165#Artikel14
    url: https://wetten.overheid.nl/BWBR0018433/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0014165
        artikel: '14'
  - number: '3'
    text: |-
      Het tarief voor een accreditatie als bedoeld in
      [artikel 15, derde lid van de Verordening op de periodieke preventieve toetsing][ref1] bedraagt € 750,– per toetser
      per dagdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0014165#Artikel15
    url: https://wetten.overheid.nl/BWBR0018433/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0014165
        artikel: '15'
  - number: '4'
    text: |-
      Het tarief voor de toetsing als bedoeld in
      [artikel 18, eerste lid van de Verordening op de periodieke preventieve toetsing][ref1] bedraagt:

      a. voor een eerste toetsing bij een accountantskantoor: € 640,– per toetser per dagdeel;

      b. voor een hertoetsing bij een accountantskantoor: € 770,– per toetser per dagdeel;

      c. voor een marginale toetsing van een van een koepelorganisatie ontvangen toetsingsverslag: € 750,– per dagdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0014165#Artikel18
    url: https://wetten.overheid.nl/BWBR0018433/2006-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0014165
        artikel: '18'
  - number: '5'
    text: |-
      1 Toetsers die voor een toetsing of accreditatie worden ingeschakeld, ontvangen voor de bij het te toetsen
      accountantskantoor of de te accrediteren koepelorganisatie bestede tijd een vergoeding ten bedrage van € 280,–
      per dagdeel.

      2 Toetsers ontvangen een vergoeding van reis- en verblijfkosten overeenkomstig de regeling van de
      [artikelen 1][ref1], [2][ref2] en [3 van de Verordening op de Kostenvergoedingen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006183#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006183#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0006183#Artikel3
    url: https://wetten.overheid.nl/BWBR0018433/2006-01-01#Artikel5
