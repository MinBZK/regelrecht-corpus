$id: uitvoeringswet_internationale_kinderontvoering
regulatory_layer: WET
publication_date: '2022-09-07'
valid_from: '2017-09-01'
bwb_id: BWBR0004746
url: https://wetten.overheid.nl/BWBR0004746/2017-09-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om wettelijke voorzieningen te treffen ter uitvoering
    van het op 20 mei 1980 tot stand gekomen Europese Verdrag betreffende de erkenning en de tenuitvoerlegging van
    beslissingen inzake het gezag over kinderen en betreffende het herstel van het gezag over kinderen (Trb. 1981,
    10) en het op 25 oktober 1980 te 's-Gravenhage tot stand gekomen Verdrag inzake de burgerrechtelijke aspecten van
    internationale ontvoering van kinderen (Trb. 1987, 139) en tevens, in verband daarmee, algemene bepalingen vast
    te stellen met betrekking tot verzoeken tot teruggeleiding van ontvoerde kinderen over de Nederlandse grens en de
    uitvoering daarvan;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004746/2017-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: In deze wet wordt verstaan onder
    url: https://wetten.overheid.nl/BWBR0004746/2017-09-01#Artikel1
  - number: 1.a
    text: |-
      het Europese verdrag: het op 20 mei 1980 te Luxemburg tot stand gekomen Europese Verdrag betreffende de erkenning
      en de tenuitvoerlegging van beslissingen inzake het gezag over kinderen en betreffende het herstel van het gezag
      over kinderen (*Trb.* 1981, 10);
    url: https://wetten.overheid.nl/BWBR0004746/2017-09-01#Artikel1
  - number: 1.b
    text: |-
      het Haagse verdrag: het op 25 oktober 1980 te 's-Gravenhage tot stand gekomen Verdrag inzake de burgerrechtelijke
      aspecten van internationale ontvoering van kinderen (*Trb.* 1987, 139);
    url: https://wetten.overheid.nl/BWBR0004746/2017-09-01#Artikel1
  - number: 1.c
    text: |-
      internationale ontvoering van kinderen: de ongeoorloofde overbrenging of het ongeoorloofd niet doen terugkeren van
      een kind in strijd met een gezagsrecht, als omschreven in [artikel 3][ref1] in verband met artikel 5 onder *a* van
      het Haagse verdrag.


      [ref1]: https://wetten.overheid.nl/BWBR0004746#Artikel3
    url: https://wetten.overheid.nl/BWBR0004746/2017-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004746
        artikel: '3'
  - number: '2'
    text: |-
      Deze wet regelt de uitvoering van de in [artikel 1][ref1] vermelde verdragen en is tevens van toepassing in de
      gevallen van internationale ontvoering van kinderen die niet door een verdrag worden beheerst.


      [ref1]: https://wetten.overheid.nl/BWBR0004746#Artikel1
    url: https://wetten.overheid.nl/BWBR0004746/2017-09-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004746
        artikel: '1'
  - number: '3.1'
    text: |-
      Deze wet is van toepassing op internationale ontvoering van kinderen die de leeftijd van zestien jaren nog niet
      hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0004746/2017-09-01#Artikel3
  - number: '3.2'
    text: |-
      Bereikt een kind ten aanzien waarvan een verzoek om teruggeleiding in behandeling is de leeftijd van zestien jaren,
      dan wordt de behandeling van dat verzoek ambtshalve gestaakt. Hetzelfde geldt voor maatregelen ter uitvoering van
      een beslissing op een verzoek.
    url: https://wetten.overheid.nl/BWBR0004746/2017-09-01#Artikel3
  - number: '4.1'
    text: |-
      Onze Minister van Justitie wijst bij in de *Nederlandse Staatscourant* openbaar te maken besluit de onder zijn
      Ministerie ressorterende dienst aan, welke wordt belast met de taak van centrale autoriteit, bedoeld in artikel
      2 van het Europese verdrag en in artikel 6 van het Haagse verdrag. Deze centrale autoriteit is als zodanig tevens
      belast met de behandeling van verzoeken in gevallen van internationale ontvoering van kinderen die niet door een
      verdrag worden beheerst.
    url: https://wetten.overheid.nl/BWBR0004746/2017-09-01#Artikel4
  - number: '4.2'
    text: |-
      De aanwijzing van de centrale autoriteit als bedoeld in het eerste lid staat er niet aan in de weg dat een persoon
      zich rechtstreeks tot de rechter of andere autoriteiten wendt teneinde de erkenning van het wettig gezag over
      een ontvoerd kind, het herstel van dat gezag en de teruggeleiding van dat kind te bereiken, of de vaststelling of
      wijziging van een omgangsregeling te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0004746/2017-09-01#Artikel4
  - number: '5.1'
    text: |-
      De centrale autoriteit is bevoegd, zo nodig ook zonder uitdrukkelijke volmacht van degene die zich met een verzoek
      tot haar heeft gewend, namens hem, anders dan in rechte, op te treden.
    url: https://wetten.overheid.nl/BWBR0004746/2017-09-01#Artikel5
  - number: '5.2'
    text: |-
      De centrale autoriteit draagt zelf alle kosten die aan de uitvoering van haar taak zijn verbonden, voor zover deze
      niet door haar teruggevorderd kunnen worden van de verzoeker of verhaald op de persoon die voor de internationale
      ontvoering van het kind verantwoordelijk is of medeverantwoordelijk is.
    url: https://wetten.overheid.nl/BWBR0004746/2017-09-01#Artikel5
  - number: '6.1'
    text: |-
      Indien de centrale autoriteit besluit om een verzoek tot teruggeleiding van een kind niet in behandeling te nemen
      of de behandeling van een zodanig verzoek te staken, deelt zij zulks aanstonds aan de verzoeker mede. De verzoeker
      kan van de centrale autoriteit verlangen, haar beslissing aan hem mede te delen in de vorm van een beschikking met
      vermelding van de gronden die tot de beslissing hebben geleid. De centrale autoriteit deelt haar beschikking bij
      aangetekend schrijven aan de verzoeker mede.
    url: https://wetten.overheid.nl/BWBR0004746/2017-09-01#Artikel6
  - number: '6.2'
    text: |-
      De verzoeker kan binnen een maand na de ontvangst van de beschikking daartegen bij de rechtbank Den Haag opkomen,
      bij een bezwaarschrift dat moet worden ingediend door een advocaat. De rechtbank hoort de verzoeker en de centrale
      autoriteit op het bezwaarschrift. Indien de rechtbank het bezwaar gegrond acht, vernietigt zij de beschikking
      van de centrale autoriteit en geeft zij een met reden omklede beschikking die in haar plaats treedt. Tegen de
      beschikking van de rechtbank staat geen hogere voorziening open behoudens cassatie in het belang der wet.
    url: https://wetten.overheid.nl/BWBR0004746/2017-09-01#Artikel6
  - number: '7'
    text: |-
      De centrale autoriteit kan de uitvoering van bepaalde handelingen, overeenkomstig door haar te geven aanwijzingen
      opdragen aan de raad voor de kinderbescherming. De bepalingen van deze Titel zijn mede van toepassing ten aanzien
      van de raad voor de kinderbescherming.
    url: https://wetten.overheid.nl/BWBR0004746/2017-09-01#Artikel7
  - number: '8'
    text: |-
      De gemeentebesturen en de ambtenaren van de burgerlijke stand verschaffen de centrale autoriteit kosteloos alle
      inlichtingen en verstrekken haar kosteloos en vrij van zegel alle afschriften en uittreksels uit hun registers die
      deze autoriteit van hen vraagt in verband met de uitvoering van haar taak.
    url: https://wetten.overheid.nl/BWBR0004746/2017-09-01#Artikel8
  - number: '9.1'
    text: |-
      Indien de centrale autoriteit voor het vinden van de verblijfplaats van een kind in Nederland medewerking behoeft
      van ambtenaren van politie, aangesteld voor de uitvoering van de politietaak, kan zij zich voor het verkrijgen
      daarvan wenden tot de officier van justitie in het arrondissement waar het kind vermoedelijk verblijft, of
      anders in het arrondissement 's-Gravenhage. De officier van justitie kan de zaak overeenkomstig door hem te geven
      aanwijzingen overdragen aan een officier van justitie in een ander arrondissement, indien de opsporing vermoedelijk
      in dat arrondissement moet geschieden.
    url: https://wetten.overheid.nl/BWBR0004746/2017-09-01#Artikel9
  - number: '9.2'
    text: |-
      De in het eerste lid bedoelde officier van justitie behandelt een verzoek om medewerking van de centrale autoriteit
      met voorrang.
    url: https://wetten.overheid.nl/BWBR0004746/2017-09-01#Artikel9
  - number: '9.3'
    text: |-
      De ambtenaar van politie, aangesteld voor de uitvoering van de politietaak die is aangewezen om zijn medewerking
      te verlenen aan de opsporing van de verblijfplaats van een kind mag daartoe elke plaats betreden, voor zover dat
      redelijkerwijs voor de vervulling van zijn taak nodig is.
    url: https://wetten.overheid.nl/BWBR0004746/2017-09-01#Artikel9
  - number: '10.1'
    text: |-
      De centrale autoriteit stelt de persoon bij wie het ontvoerde kind verblijft bij aangetekende brief in kennis van
      het verzoek tot teruggeleiding en de gronden waarop het berust. Zij geeft in deze mededeling tevens kennis van de
      mogelijkheid dat een verzoek tot afgifte van een rechterlijk bevel tot teruggeleiding kan worden ingediend, indien
      niet binnen een door haar te stellen redelijke termijn vrijwillig aan dat verzoek is voldaan.
    url: https://wetten.overheid.nl/BWBR0004746/2017-09-01#Artikel10
  - number: '10.2'
    text: |-
      De centrale autoriteit kan de in het voorafgaande lid bedoelde mededeling achterwege laten, indien naar haar
      oordeel in verband met de omstandigheden van het geval de uiterste spoed geboden is of de vrijwillige medewerking
      van degene bij wie het kind verblijft niet is te verwachten.
    url: https://wetten.overheid.nl/BWBR0004746/2017-09-01#Artikel10
  - number: '11.1'
    text: |-
      Onverminderd de bevoegdheid van de voorzieningenrechter Den Haag in kort geding, is in eerste aanleg uitsluitend
      de kinderrechter van de rechtbank te ’s-Gravenhage bevoegd tot kennisneming van alle zaken met betrekking
      tot de gedwongen afgifte van een internationaal ontvoerd kind aan degene wie het gezag daarover toekomt en de
      teruggeleiding van een zodanig kind over de Nederlandse grens.
    url: https://wetten.overheid.nl/BWBR0004746/2017-09-01#Artikel11
  - number: '11.2'
    text: |-
      De kinderrechter van de rechtbank binnen wier rechtsgebied het kind zijn werkelijke verblijfplaats heeft is,
      onverminderd de bevoegdheid van de voorzieningenrechter in kort geding, bevoegd tot de kennisneming van alle zaken
      met betrekking tot de regeling en uitvoering van het omgangsrecht in internationale gevallen, daaronder begrepen
      verzoeken als bedoeld in [artikel 14][ref1] van deze wet. Heeft het kind geen werkelijke verblijfplaats of kan zijn
      verblijfplaats niet worden vastgesteld, dan is bevoegd de kinderrechter van de rechtbank Den Haag.


      [ref1]: https://wetten.overheid.nl/BWBR0004746#Artikel14
    url: https://wetten.overheid.nl/BWBR0004746/2017-09-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004746
        artikel: '14'
  - number: '12'
    text: |-
      De in [artikel 11][ref1] bedoelde zaken worden ingeleid door indiening van een verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0004746#Artikel11
    url: https://wetten.overheid.nl/BWBR0004746/2017-09-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004746
        artikel: '11'
  - number: '13.1'
    text: |-
      De gedwongen afgifte van een internationaal ontvoerd kind aan degene aan wie het gezag daarover toekomt en de
      teruggeleiding van een zodanig kind over de Nederlandse grens is slechts mogelijk uit krachte van een daartoe
      strekkend bevel van de rechter.
    url: https://wetten.overheid.nl/BWBR0004746/2017-09-01#Artikel13
  - number: '13.2'
    text: |-
      De rechter behandelt het verzoek bij voorrang. Het verzoek wordt met gesloten deuren behandeld, overeenkomstig
      het bepaalde in [artikel 803 van het Wetboek van Burgerlijke Rechtsvordering][ref1]. De rechter beslist niet
      dan na het kind in de gelegenheid te hebben gesteld hem zijn mening kenbaar te maken, althans na het daartoe
      behoorlijk te hebben opgeroepen, tenzij dit in verband met de lichamelijke of geestelijke toestand van het kind
      onmogelijk is of toepassing moet worden gegeven aan artikel 8 of 9 van het Europese verdrag. Het bepaalde in
      [artikel 802 van het Wetboek van Burgerlijke Rechtsvordering][ref2] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel803
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel802
    url: https://wetten.overheid.nl/BWBR0004746/2017-09-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '803'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '802'
  - number: '13.3'
    text: |-
      In de gevallen waarin geen verdrag toepasselijk is kan de rechter het verzoek afwijzen op de gronden vermeld in de
      artikelen 12, tweede lid, 13 en 20 van het Haagse verdrag.
    url: https://wetten.overheid.nl/BWBR0004746/2017-09-01#Artikel13
  - number: '13.4'
    text: |-
      De rechter kan op verzoek of ambtshalve een gecertificeerde instelling als bedoeld in
      [artikel 1.1 van de Jeugdwet][ref1] belasten met de voorlopige voogdij over het kind, indien
      gevaar bestaat dat het wordt onttrokken aan de tenuitvoerlegging van een bevel als bedoeld in het
      vijfde lid. De beschikking verliest haar kracht van rechtswege indien het verzoek wordt afgewezen.
      [Artikel 306a van Boek 1 van het Burgerlijk Wetboek][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel306a
    url: https://wetten.overheid.nl/BWBR0004746/2017-09-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 306a
  - number: '13.5'
    text: |-
      Indien de rechter het verzoek toewijst, beveelt hij de afgifte van het kind aan degene aan wie het gezag erover
      toekomt, of, indien zulks niet aanstonds mogelijk is, voorlopig aan een gecertificeerde instelling als bedoeld
      in [artikel 1.1 van de Jeugdwet][ref1]. Hij kan tevens desverzocht of ambtshalve elke persoon die voor de
      internationale ontvoering van het kind verantwoordelijk is, of medeverantwoordelijk is, veroordelen tot betaling
      aan de centrale autoriteit, of aan de persoon aan wie het gezag over het kind toekomt, van de door deze in verband
      met de ontvoering en de teruggeleiding van het kind gemaakte kosten. Indien meer personen bij de ontvoering zijn
      betrokken, zijn zij hoofdelijk voor het geheel aansprakelijk. Het hoger beroep schorst de tenuitvoerlegging van de
      beschikking, tenzij de rechter in het belang van het kind op verzoek of ambtshalve anders bepaalt.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0004746/2017-09-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
  - number: '13.6'
    text: |-
      [Artikel 813, tweede lid van het Wetboek van Burgerlijke Rechtsvordering][ref1] is van toepassing op de
      tenuitvoerlegging van een bevel als bedoeld in het vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel813
    url: https://wetten.overheid.nl/BWBR0004746/2017-09-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '813'
  - number: '13.7'
    text: Hoger beroep van een eindbeslissing moet worden ingesteld binnen twee weken na de dagtekening van die beslissing.
    url: https://wetten.overheid.nl/BWBR0004746/2017-09-01#Artikel13
  - number: '13.8'
    text: Tegen de beschikking van het gerechtshof staat geen gewoon rechtsmiddel open.
    url: https://wetten.overheid.nl/BWBR0004746/2017-09-01#Artikel13
  - number: '14.1'
    text: |-
      Ieder die in Nederland het gezag uitoefent over een kind kan de rechter verzoeken, de in het tweede lid bedoelde
      beslissingen te geven terzake van het omgangsrecht met betrekking tot dat kind, indien het zich in verband met de
      uitoefening daarvan buiten Nederland moet begeven. De beslissingen kunnen worden gegeven voor een of meer bepaalde
      bezoeken of voor bepaalde tijdvakken waarin het omgangsrecht met betrekking tot het kind kan worden uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0004746/2017-09-01#Artikel14
  - number: '14.2'
    text: 'De in het eerste lid bedoelde beslissingen zijn:'
    url: https://wetten.overheid.nl/BWBR0004746/2017-09-01#Artikel14
  - number: 14.2.a
    text: |-
      vaststelling dat het wettig gezag aan de verzoeker toekomt in gevallen dat zulks niet reeds vaststaat door een
      rechterlijke beslissing;
    url: https://wetten.overheid.nl/BWBR0004746/2017-09-01#Artikel14
  - number: 14.2.b
    text: |-
      regeling van de plaats en de duur van het verblijf van het kind buiten Nederland en, zonodig, andere omstandigheden
      met betrekking tot het verblijf, zulks met inachtneming van reeds van kracht zijnde beslissingen inzake het
      omgangsrecht;
    url: https://wetten.overheid.nl/BWBR0004746/2017-09-01#Artikel14
  - number: 14.2.c
    text: |-
      het richten van een verzoek aan de bevoegde autoriteiten van de Staat waar het kind tijdens de uitoefening van het
      omgangsrecht verblijft toezicht te houden of te doen houden op de juiste naleving van dat recht, in het bijzonder
      wat de plaats en de duur ervan betreft en voorts, indien nodig, maatregelen te treffen tot teruggeleiding van het
      kind na ommekomst van de termijn van uitoefening van dat recht.
    url: https://wetten.overheid.nl/BWBR0004746/2017-09-01#Artikel14
  - number: '15'
    text: |-
      De rechter die moet beslissen met betrekking tot het gezag over een kind ten aanzien van hetwelk een verzoek tot
      teruggeleiding is gedaan bij de centrale autoriteit, houdt zijn beslissing aan totdat op dat verzoek onherroepelijk
      is beslist. Indien nog geen verzoek tot teruggeleiding is gedaan houdt de rechter zijn beslissing gedurende een
      redelijke termijn aan, indien hij goede gronden heeft om aan te nemen dat het kind internationaal is ontvoerd in de
      zin van [artikel 1 onder c][ref1] en dat een verzoek tot zijn teruggeleiding zal worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0004746#Artikel1
    url: https://wetten.overheid.nl/BWBR0004746/2017-09-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004746
        artikel: '1'
  - number: '16.1'
    text: |-
      Ieder die in verband met de toepassing van een verdrag als bedoeld in [artikel 1][ref1] of in verband met de
      toepassing van deze wet in Nederland in rechte wil optreden en daartoe rechtsbijstand behoeft, kan zonodig daarop
      recht doen gelden op de voet van de Wet van 4 juli 1957, *Stb.* 233, tot regeling van de rechtsbijstand aan on-
      en minvermogenden.


      [ref1]: https://wetten.overheid.nl/BWBR0004746#Artikel1
    url: https://wetten.overheid.nl/BWBR0004746/2017-09-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004746
        artikel: '1'
  - number: '16.2'
    text: |-
      De in het eerste lid bedoelde personen zijn vrijgesteld van het stellen van zekerheid voor de betaling van kosten,
      schaden en interessen waarin zij zouden kunnen worden verwezen.
    url: https://wetten.overheid.nl/BWBR0004746/2017-09-01#Artikel16
  - number: '17'
    text: |-
      Bij en krachtens algemene maatregel van bestuur kunnen nadere bepalingen worden vastgesteld met betrekking tot de
      wijze van uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0004746/2017-09-01#Artikel17
  - number: '18'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0004746/2017-09-01#Artikel18
  - number: '19'
    text: 'Deze wet wordt aangehaald als: Uitvoeringswet internationale kinderontvoering.'
    url: https://wetten.overheid.nl/BWBR0004746/2017-09-01#Artikel19
