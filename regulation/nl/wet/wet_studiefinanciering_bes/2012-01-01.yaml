  - number: '5.1'
    text: |-
      1 Onze Minister kan een beschikking herzien waarbij:

      a. studiefinanciering BES is toegekend,

      b. een opstarttoelage is toegekend,

      c. de vorm van de studiefinanciering BES is vastgelegd,

      d. de termijn wordt vastgesteld of gewijzigd,

      e. de draagkracht van de debiteur wordt vastgesteld, of

      f. de hoogte van de lening wordt vastgesteld of gewijzigd.

      2 Herziening vindt plaats op grond van het feit dat:

      a. een beschikking genomen is waarvan de studerende of de debiteur wist of redelijkerwijs had kunnen weten dat deze
      onjuist was,

      b. te veel of te weinig studiefinanciering BES is toegekend, de vorm van de studiefinanciering BES onjuist is
      vastgelegd anders dan bedoeld in het eerste lid van onderdeel c, de termijn te hoog of te laag is vastgesteld, op
      basis van onjuiste of onjuist verwerkte gegevens anders dan bedoeld onder a,

      c. betrokkene heeft gehandeld in strijd met het bepaalde bij of krachtens deze wet, of

      d. andere, nader gebleken feiten of omstandigheden, die, waren zij eerder bekend geweest, tot een andere
      beschikking zouden hebben geleid.

      3 Een herziening als bedoeld in het tweede lid, onderdelen a en b, voor zover het betreft de vorm van de
      studiefinanciering BES kan, behoudens het geval van bedrog, slechts geschieden binnen 5 jaren na het einde van het
      desbetreffende studiefinancieringstijdvak, het kalenderjaar waarvoor de termijn is vastgesteld of het kalenderjaar
      waarvoor de draagkracht van de debiteur is vastgesteld. Behoudens in geval van bedrog, kan een herziening
      anders dan bedoeld in de eerste volzin, slechts geschieden binnen 18 maanden na het einde van het desbetreffende
      studiefinancieringstijdvak, het kalenderjaar waarvoor de termijn is vastgesteld of het kalenderjaar waarvoor de
      draagkracht van de debiteur is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel5.1
  - number: '5.2'
    text: |-
      1 Indien een herzieningsbeschikking als bedoeld in [artikel 5.1, eerste en tweede lid][ref1], of een beslissing
      op bezwaar daartoe aanleiding geeft, wordt het bedrag van de beurs dat teveel is uitbetaald, door de betrokkene
      terugbetaald of met hem verrekend.

      2 Indien een herzieningsbeschikking als bedoeld in [artikel 5.1, eerste en tweede lid][ref2], of een beslissing
      op bezwaar daartoe aanleiding geeft, wordt voor zover het bedrag waarvoor het recht om een lening af te sluiten
      te hoog is toegekend, het deel dat te hoog is toegekend en uitbetaald door de betrokkene terugbetaald of met hem
      verrekend.

      3 De in het eerste en tweede lid bedoelde terugbetaling, voor zover [artikel 4.13][ref3] niet van toepassing is, en
      verrekening geschieden overeenkomstig bij ministeriële regeling vast te stellen redelijke terugbetalingsregels.


      [ref1]: https://wetten.overheid.nl/BWBR0028393#Artikel5.1
      [ref2]: https://wetten.overheid.nl/BWBR0028393#Artikel5.1
      [ref3]: https://wetten.overheid.nl/BWBR0028393#Artikel4.13
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel5.2
