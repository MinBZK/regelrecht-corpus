        bwb_id: BWBR0028067
        artikel: '43'
  - number: '7.5'
    text: |-
      Hij die niet voldoet aan een van de verplichtingen, bedoeld in [artikel 7.2][ref1], wordt gestraft met hechtenis
      van ten hoogste 6 maanden of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028393#Artikel7.2
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel7.5
