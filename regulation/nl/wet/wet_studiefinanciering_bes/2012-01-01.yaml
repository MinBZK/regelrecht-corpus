  - number: '6.1'
    text: |-
      1 De uitbetaling van de studiefinanciering BES vindt plaats per kalendermaand. Onze Minister kan op aanvraag van de
      studerende die buiten het eigen openbare lichaam gaat studeren, vaststellen dat hem, voorafgaand aan de aanvang van
      de studie, eenmalig het bedrag van ten hoogste de eerste drie maanden studiefinanciering BES als voorschot wordt
      uitbetaald.

      2 De uitbetaling van de opstarttoelage vindt eenmalig plaats, maar kan op aanvraag van de studerende gespreid
      plaatsvinden.

      3 Indien een toegekend bedrag aan studiefinanciering BES of de opstarttoelage 12 maanden na het einde van het
      kalenderjaar waarin de desbetreffende beschikking is gegeven, niet kunnen worden uitbetaald als gevolg van
      nalatigheid van degene aan wie die beschikking is gericht, wordt het toegekende bedrag aan studiefinanciering BES
      verlaagd met het niet uitbetaalde bedrag of vervalt de aanspraak op de opstarttoelage.

      4 Met betrekking tot de uitbetaling van de studiefinanciering BES en van de opstarttoelage kunnen bij algemene
      maatregel van bestuur nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel6.1
  - number: '6.2'
    text: |-
      1 Is een bij of krachtens deze wet verschuldigd bedrag voor het geheel of een deel niet tijdig voldaan, dan maant
      Onze Minister de nalatige bij brief aan om alsnog binnen 2 weken na ontvangst van die brief het daarin vermelde
      bedrag aan hem te doen toekomen. Volgt op deze aanmaning de betaling binnen de gestelde termijn niet, dan vaardigt
      Onze Minister een dwangbevel uit. Het dwangbevel levert een executoriale titel op.

      2 Bij de toepassing van het eerste lid worden naast de achterstallige schuld eveneens het bedrag van de
      gerechtelijke of buitengerechtelijke kosten en de wettelijke rente ingevorderd.

      3 Binnen 4 weken na de betekening staat verzet tegen het dwangbevel, bedoeld in het eerste lid, open door
      dagvaarding van Onze Minister. Het verzet stuit de aanvang of de voortzetting van de tenuitvoerlegging niet,
      behoudens de bevoegdheid van de geëxecuteerde die het verzet heeft gedaan, om hieromtrent een voorziening bij
      voorraad uit te lokken.
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel6.2
  - number: '6.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de samenloop van de verplichting
      tot terugbetaling uit hoofde van deze wet en de [WSF 2000][ref1] met dien verstande dat de verplichting tot
      terugbetaling de laagst vastgestelde draagkracht van de debiteur niet mag overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0011453
  - number: '7.1'
    text: |-
      1 Een ieder is verplicht aan Onze Minister of aan een daartoe door of vanwege Onze Minister aangewezen persoon of
      instantie desgevraagd de ten behoeve van de uitvoering van deze wet benodigde inlichtingen over zichzelf te geven.

      2 De inlichtingen worden verstrekt binnen een door Onze Minister of door een in het eerste lid bedoelde persoon of
      instantie te stellen redelijke termijn.

      3 Inlichtingen over zichzelf, voor zover zij kunnen leiden tot de toekenning van minder studiefinanciering BES of
      tot verhoging van het bedrag van de terugbetalingstermijn worden steeds ongevraagd en schriftelijk verstrekt door
      de studerende onderscheidenlijk door de debiteur, onmiddellijk na het bekend worden van die gegevens.

      4 Onze Minister kan bepalen dat de inlichtingen, bedoeld in het eerste tot en met het derde lid, worden verstrekt
      op een bij ministeriële regeling vast te stellen wijze.
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel7.1
  - number: '7.2'
    text: |-
      1 Het bevoegd gezag van de onderwijsinstelling waaraan de studerende is ingeschreven die aanspraak heeft op
      studiefinanciering BES of op een opstarttoelage, is verplicht op een bij ministeriële regeling aan te geven wijze
      kosteloos inlichtingen te verstrekken, benodigd voor de uitvoering van deze wet.

      2 Onze Minister kan voor instellingen of groepen van instellingen bepalen dat het bevoegd gezag van de
      onderwijsinstelling voor het einde van de maand volgend op de maand waarin een student het afsluitend examen van
      een opleiding in het hoger onderwijs met goed gevolg heeft afgelegd, daarvan mededeling doet aan Onze Minister en
      gelijktijdig de student van die mededeling in kennis stelt.

      3 Het bevoegd gezag van de onderwijsinstelling stuurt gelijktijdig een afschrift aan de betrokkene van de gegevens
      die hij over de betrokkene aan Onze Minister verstrekt en geeft daarbij aan wat de consequenties op grond van
      deze wet zijn voor de betrokkene met betrekking tot de vorm van de studiefinanciering BES of met betrekking tot de
      opstarttoelage. Het bevoegd gezag geeft daarbij tevens aan welke beroepsgang voor betrokkene open staat.
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel7.2
  - number: '7.3'
    text: |-
      Organen met een publiekrechtelijke taak zijn verplicht op een bij algemene maatregel van bestuur aan te geven wijze
      kosteloos inlichtingen te verstrekken, benodigd voor de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel7.3
  - number: '7.4'
    text: |-
      1 Onze Minister kan in verband met een tegemoetkoming in de kosten voor de toegang tot het onderwijs of voor
      levensonderhoud de gegevens die bij hem bekend zijn als gevolg van de uitvoering van zijn wettelijke taken
      verstrekken aan een autoriteit van een staat buiten het Koninkrijk indien deze staat een passend beschermingsniveau
      als bedoeld in [artikel 42 van de Wet bescherming persoonsgegevens BES][ref1] waarborgt.

      2 De in het eerste lid bedoelde verantwoordelijke autoriteit toont voor de verstrekking van gegevens aan dat de
      studerende ten laste van die autoriteit een tegemoetkoming in de kosten voor de toegang tot het onderwijs of voor
      levensonderhoud heeft aangevraagd dan wel reeds ontvangt.

      3 Onze Minister kan, voor de uitvoering van de wet, inlichtingen over een studerende die studiefinanciering BES of
      opstarttoelage aanvraagt dan wel reeds ontvangt, opvragen bij het bevoegd gezag van een staat buiten het Koninkrijk
      waar de studerende een opleiding wil gaan volgen of volgt aan een opleiding zoals vastgesteld bij ministeriële
      regeling.

      4 Voor gegevensuitwisseling als bedoeld in dit artikel met een staat die geen passend
      beschermingsniveau kan waarborgen, kan Onze Minister een vergunning als bedoeld in
      [artikel 43 van de Wet bescherming persoonsgegevens BES][ref2] aanvragen bij Onze Minister van Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0028067#Artikel43
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel7.4
    references:
