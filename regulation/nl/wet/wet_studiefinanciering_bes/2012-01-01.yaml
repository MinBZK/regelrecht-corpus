  - number: '1.2'
    text: |-
      Voor de toepassing van het bepaalde bij of krachtens deze wet is bepalend de toestand op de eerste dag van de
      maand, tenzij anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel1.2
  - number: '1.3'
    text: |-
      Deze wet regelt de studiefinanciering BES en de opstarttoelage en is van toepassing op studerenden die voldoen aan
      de voorwaarden inzake:

      a. nationaliteit of woonplaats als bedoeld in [artikel 1.4][ref1],

      b. leeftijd als bedoeld in [artikel 1.5][ref2], en

      c. beroepsonderwijs of hoger onderwijs als bedoeld in [hoofdstuk 3][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028393#Artikel1.4
      [ref2]: https://wetten.overheid.nl/BWBR0028393#Artikel1.5
      [ref3]: https://wetten.overheid.nl/BWBR0028393#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0028393
        artikel: '1.4'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0028393
        artikel: '1.5'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0028393
        hoofdstuk: '3'
  - number: '1.4'
    text: |-
      Voor studiefinanciering BES en een opstarttoelage kan een studerende in aanmerking komen die op het moment van de
      eerste aanvraag:

      a. de Nederlandse nationaliteit bezit, geboren is in een openbaar lichaam, en woonplaats heeft in een openbaar
      lichaam, met dien verstande dat de studerende, wiens moeder op het tijdstip van zijn geboorte korter dan een jaar
      niet woonachtig was in een openbaar lichaam, geacht wordt in het openbaar lichaam te zijn geboren; of

      b. woonplaats heeft in een openbaar lichaam en voorafgaand aan de eerste aanvraag ten minste tien jaar, al dan niet
      aaneengesloten, in een openbaar lichaam heeft gewoond.
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel1.4
  - number: '1.5'
    text: |-
      1 Voor de opstarttoelage kan in aanmerking komen degene die in aanmerking komt voor studiefinanciering op grond van
      de [WSF 2000][ref1].

      2 Voor studiefinanciering BES en de opstarttoelage kan een studerende in aanmerking komen tot en met de maand
      waarin hij de leeftijd van 30 jaren heeft bereikt.

      3 In afwijking van het tweede lid behoudt een studerende bij het bereiken van de leeftijd van 30 jaren zijn
      aanspraak zolang hij zonder onderbreking studiefinanciering BES geniet.


      [ref1]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel1.5
    references:
      - id: ref1
        bwb_id: BWBR0011453
  - number: '1.6'
    text: |-
      Op verzoek van Onze Minister bepaalt de inspecteur, bedoeld in
      [hoofdstuk II van de Wet inkomstenbelasting BES][ref1], het belastbare inkomen, bedoeld in hoofdstuk 2 van die wet,
      of het zuiver voljaarloon, bedoeld in [hoofdstuk III van de Wet loonbelasting BES][ref2], van de debiteur.


      [ref1]: https://wetten.overheid.nl/BWBR0029281#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0029283#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0029281
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0029283
        hoofdstuk: III
  - number: '1.7'
    text: |-
      Onze Minister gebruikt het persoonsgebonden nummer BES van een studerende of debiteur ter zake van de uitvoering
      van deze wet slechts:

      a. in contacten met die studerende of debiteur, en

      b. in contacten met personen en instanties voor zover deze zelf gemachtigd zijn tot het opnemen van het
      persoonsgebonden nummer BES in een persoonsregistratie.
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel1.7
  - number: '1.8'
    text: |-
      Een minderjarige is bekwaam de rechtshandelingen te verrichten die noodzakelijk zijn om studiefinanciering BES
      en de opstarttoelage te verkrijgen. Hij is voorts bekwaam de rechtshandelingen te verrichten die noodzakelijk
      zijn met betrekking tot de uitoefening, onderscheidenlijk de nakoming van de voor hem uit de toekenning van
      studiefinanciering BES en de opstarttoelage voortvloeiende rechten en verplichtingen.
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel1.8
  - number: '2.1'
    text: |-
      1 Studiefinanciering BES en opstarttoelage bestaan uit een prestatiebeurs, een lening of beide, dan wel uit een
      gift.

      2 De bedragen inzake de studiefinanciering BES zijn afhankelijk van het onderwijstype en de plaats van de
      opleiding.

      3 De bedragen zijn opgenomen in [artikel 2.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028393#Artikel2.2
