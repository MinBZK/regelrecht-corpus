        paragraaf: '2.2'
  - number: '8.2'
    text: |-
      1 Studiefinanciering BES en opstarttoelage zijn niet vatbaar voor vervreemding, verpanding, belening en beslag,
      waaronder begrepen beslag ingevolge faillissement.

      2 Elk beding, strijdig met dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel8.2
  - number: '8.3'
    text: |-
      Onze Minister kan voor bepaalde gevallen de wet buiten toepassing laten of daarvan afwijken voor zover toepassing
      gelet op het belang dat deze wet beoogt te beschermen, zal leiden tot een onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel8.3
  - number: '8.4'
    text: |-
      De [artikelen 64 tot en met 67 van de Wet administratieve rechtspraak BES][ref1] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel64
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel8.4
    references:
