  - number: '2.8'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald in welke bijzondere omstandigheden, onder welke
      voorwaarden en voor welke periode:

      a. in afwijking van [artikel 2.7, eerste lid][ref1], de duur van de prestatiebeurs kan worden verlengd,

      b. in afwijking van [hoofdstuk 3][ref2], de prestatiebeurs kan worden omgezet in een gift,

      c. de diplomatermijn beroepsonderwijs of de diplomatermijn hoger onderwijs kan worden verlengd, of

      d. een nieuwe aanspraak op studiefinanciering BES ontstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0028393#Artikel2.7
      [ref2]: https://wetten.overheid.nl/BWBR0028393#Hoofdstuk3
