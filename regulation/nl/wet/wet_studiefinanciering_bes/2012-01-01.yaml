  - number: '2.7'
    text: |-
      1 Studiefinanciering BES wordt aan studerenden beroepsonderwijs opleiding niveau 3 of 4 en hoger onderwijs
      gedurende maximaal 4 jaren verstrekt in de vorm van een prestatiebeurs.

      2 Als onderdeel van de studiefinanciering BES aan deze studerenden kan tevens gedurende de periode, bedoeld in het
      eerste lid, een lening worden verstrekt. Het bedrag dat per maand kan worden geleend is opgenomen in kolom IV van
      het overzicht in [artikel 2.2, eerste lid][ref1].

      3 Studiefinanciering BES aan deze studerenden wordt gedurende maximaal 36 maanden na de periode, bedoeld in het
      eerste lid, verstrekt in de vorm van een lening. Het bedrag dat per maand kan worden geleend is opgenomen in kolom
      V van het overzicht in [artikel 2.2, eerste lid][ref2].

      4 De opstarttoelage aan studerenden in de zin van de [WSF 2000][ref3] die een opleiding niveau 3 of 4 of hoger
      onderwis in het Europese deel van Nederland volgen, wordt eenmalig verstrekt in de vorm van een prestatiebeurs.

      5 Als onderdeel van de opstarttoelage kan een lening worden verstrekt. Het bedrag dat kan worden geleend is
      opgenomen in kolom IV van het overzicht in [artikel 2.2, tweede lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0028393#Artikel2.2
