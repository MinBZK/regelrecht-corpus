        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0028393
        hoofdstuk: '3'
  - number: '2.9'
    text: |-
      1 Voor studiefinanciering BES kan in aanmerking komen degene die is ingeschreven

      a. als deelnemer aan een instelling die een beroepsopleiding verzorgt, of

      b. als student aan een instelling die een bacheloropleiding of masteropleiding verzorgt.

      2 Voor een opstarttoelage kan in aanmerking komen degene die aannemelijk kan maken dat hij een beroepsopleiding
      niveau 3 of 4 in de zin van de [Wet educatie en beroepsonderwijs][ref1], of hoger onderwijs in de zin van de
      [Wet op het hoger onderwijs en het wetenschappelijk onderzoek][ref2] in het Europese deel van Nederland gaat
      volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0007625
      - id: ref2
        bwb_id: BWBR0005682
  - number: '2.10'
    text: |-
      1 Een studerende heeft geen aanspraak op studiefinanciering BES:

      a. indien hij is ingeschreven aan een opleiding waarvan de duur, daaronder begrepen ten hoogste 12 vakantieweken,
      korter is dan 1 jaar,

      b. indien hij niet is ingeschreven voor een voltijdse opleiding in het beroepsonderwijs of het hoger onderwijs,

      c. indien hij aanspraak heeft op studiefinanciering op grond van de [Wet studiefinanciering 2000][ref1],

      d. indien hij in het betreffende studiefinancieringstijdvak aanspraak maakt op een tegemoetkoming in de kosten van
      levensonderhoud, studie, overtocht en huisvesting die door de daarvoor verantwoordelijke autoriteit van een ander
      land wordt verstrekt.

      2 De aanspraak op de opstarttoelage vervalt indien de studerende niet binnen een termijn van 9 maanden na zijn
      aanvraag is ingeschreven voor het volgen van het onderwijs, bedoeld in [artikel 2.9, tweede lid][ref2].

      3 De aanspraak van een studerende die een opleiding volgt als vastgesteld bij ministeriële regeling, vervalt over
      het tijdvak waarover hij de inlichtingen, bedoeld in [artikel 7.1, eerste lid][ref3], niet verstrekt. Zolang hij
      die inlichtingen over een studiejaar niet verstrekt, heeft hij tevens geen aanspraak op studiefinanciering BES voor
      de daarop volgende studiejaren. Indien hij die inlichtingen alsnog verstrekt, herleeft de aanspraak over de periode
      waarop de inlichtingen betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0011453
      [ref2]: https://wetten.overheid.nl/BWBR0028393#Artikel2.9
      [ref3]: https://wetten.overheid.nl/BWBR0028393#Artikel7.1
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0011453
      - id: ref2
        bwb_id: BWBR0028393
        artikel: '2.9'
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref3
        bwb_id: BWBR0028393
        artikel: '7.1'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '2.11'
    text: |-
      1 Een deelnemer aan een opleiding niveau 3 of 4 heeft geen aanspraak op studiefinanciering BES voor het volgen van
      beroepsonderwijs indien er 10 jaren verstreken zijn nadat voor het eerst studiefinanciering BES is toegekend voor
      het volgen van beroepsonderwijs.

      2 Een deelnemer heeft geen aanspraak op studiefinanciering BES voor het volgen van een opleiding niveau 1 of 2,
      indien hij reeds 4 jaren prestatiebeurs voor het volgen van een opleiding niveau 3 of 4 heeft genoten.

      3 Een studerende heeft geen aanspraak op studiefinanciering BES voor het volgen van beroepsonderwijs indien hij
      reeds 4 jaren studiefinanciering BES heeft genoten voor het volgen van hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel2.11
  - number: '2.12'
    text: |-
      1 De aanspraak op studiefinanciering BES voor beroepsopleidingen niveaus 1 of 2 eindigt met ingang van de maand
      die volgt op de dag waarop de deelnemer het afrondende studiejaar van een opleiding niveau 1 of 2 met goed gevolg
      heeft afgesloten.

      2 Indien de deelnemer dat studiejaar niet met goed gevolg heeft afgesloten en aansluitend opnieuw het afrondende
      studiejaar aanvangt, ontstaat aanspraak op studiefinanciering BES voor het resterende gedeelte van het
      kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel2.12
  - number: '2.13'
    text: |-
      De studerende die zowel voor het volgen van beroepsonderwijs als voor het volgen van hoger onderwijs aanspraak zou
      kunnen maken op studiefinanciering BES heeft slechts aanspraak op studiefinanciering BES voor het volgen van hoger
      onderwijs.
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel2.13
  - number: '2.14'
    text: |-
      Een student heeft geen aanspraak op studiefinanciering BES indien er 10 jaren verstreken zijn nadat voor het eerst
      studiefinanciering BES is toegekend voor het volgen van hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel2.14
  - number: '3.1'
    text: |-
      1 Indien een deelnemer binnen de diplomatermijn beroepsonderwijs het afsluitend examen van een beroepsopleiding
      niveau 3 of 4 met goed gevolg heeft afgelegd, wordt de aan hem toegekende prestatiebeurs omgezet in een gift.

      2 Indien een deelnemer binnen de diplomatermijn beroepsonderwijs het afsluitend examen van een beroepsopleiding met
      goed gevolg heeft afgelegd, wordt de resterende periode van zijn prestatiebeurs verstrekt in de vorm van een gift
      indien hij een andere beroepsopleiding aanvangt.

      3 Omzetting vindt plaats per 1 januari volgend op het kalenderjaar waarin Onze Minister heeft vastgesteld dat een
      deelnemer heeft voldaan aan de voorwaarden, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel3.1
  - number: '3.2'
    text: |-
      1 Indien een student binnen de diplomatermijn hoger onderwijs het afsluitend examen van een hbo-bacheloropleiding,
      of het geheel van een bacheloropleiding en een masteropleiding in geval van een opleiding in het wetenschappelijk
      onderwijs met goed gevolg heeft afgesloten, wordt de aan hem toegekende prestatiebeurs omgezet in een gift.

      2 Indien een student binnen de diplomatermijn hoger onderwijs het afsluitend examen van een opleiding in het hoger
      onderwijs met goed gevolg heeft afgesloten, wordt de resterende periode van zijn prestatiebeurs verstrekt in de
      vorm van een gift indien hij een andere opleiding in de zin van deze wet volgt.

      3 Onze Minister kan voor de toepassing van het eerste en tweede lid examens aanwijzen die worden gelijkgesteld met
      een afsluitend examen.

      4 Met een afsluitend examen wordt eveneens gelijkgesteld het examen van een bacheloropleiding in het
      wetenschappelijk onderwijs en het examen van een programma als bedoeld in [artikel 7.8a van de WHW][ref1], voor
      zover de student daartoe een aanvraag heeft ingediend.

      5 Omzetting vindt plaats per 1 januari volgend op het kalenderjaar waarin Onze Minister heeft vastgesteld dat een
      student heeft voldaan aan de voorwaarden, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7.8a
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 7.8a
  - number: '3.3'
    text: |-
      Bij omzetting van een prestatiebeurs of een deel daarvan in een gift gaat de over het om te zetten bedrag
      opgebouwde rente teniet.
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel3.3
  - number: '3.4'
    text: |-
      1 Indien een studerende met goed gevolg het afsluitend examen heeft behaald van een opleiding waarvan de studielast
      is gebaseerd op een periode van minder dan 4 jaren, wordt het aantal om te zetten maanden van zijn prestatiebeurs
      met dit verschil verminderd.

      2 Indien een student een aanvraag als bedoeld in [artikel 3.2, vierde lid][ref1], heeft ingediend, wordt het aantal
      maanden, bedoeld in het eerste lid, van de aan hem toegekende prestatiebeurs omgezet in een gift.


      [ref1]: https://wetten.overheid.nl/BWBR0028393#Artikel3.2
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0028393
        artikel: '3.2'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '3.5'
    text: |-
      1 Een studerende aan een opleiding buiten een openbaar lichaam zendt uiterlijk 3 maanden na het verstrijken van
      de diplomatermijn beroepsonderwijs of de diplomatermijn hoger onderwijs, een gewaarmerkt bewijs van het met goed
      gevolg afleggen van het afsluitend examen van de opleiding in het beroepsonderwijs of het hoger onderwijs buiten
      een openbaar lichaam aan Onze Minister en dient daarbij een aanvraag in tot omzetting van de prestatiebeurs. Op het
      gewaarmerkt bewijs vermeldt de instelling de datum waarop het examen met goed gevolg is afgesloten.

      2 De omzetting, bedoeld in het eerste lid vindt plaats per 1 januari van het kalenderjaar volgend op de aanvraag.
      Zo spoedig mogelijk na de omzetting stelt Onze Minister de studerende daarvan in kennis.
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel3.5
  - number: '3.6'
    text: |-
      1 Een studerende aan een opleiding waarvoor Onze Minister criteria heeft vastgesteld als bedoeld in
      [artikel 1.1][ref1], verstrekt jaarlijks binnen een door Onze Minister te bepalen termijn aan Onze Minister een
      gewaarmerkt afschrift van het bewijs waaruit blijkt voor welke maanden van het desbetreffende studiejaar hij is
      ingeschreven voor de opleiding waarvoor hij studiefinanciering BES heeft aangevraagd of geniet.

      2 Indien de opleiding geen bewijs van inschrijving verstrekt, maakt de studerende op een ander wijze aannemelijk
      dat hij staat ingeschreven voor de desbetreffende opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0028393#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0028393
        artikel: '1.1'
        hoofdstuk: '1'
  - number: '3.7'
    text: |-
      Indien noodzakelijk kunnen in afwijking van het in dit hoofdstuk bepaalde bij ministeriële regeling regels worden
      vastgesteld ten behoeve van een goede uitvoering van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel3.7
  - number: '4.1'
    text: |-
      1 In dit hoofdstuk wordt verstaan onder:

      **minimumloon**: het bij of krachtens de [Wet minimumlonen BES][ref1] geldende hoogst vastgestelde minimumloon dan
      wel bij gebreke daarvan het door Onze Minister vastgestelde bedrag,

      **peiljaar**: het tweede jaar voorafgaand aan het jaar waarvoor de draagkracht in de zin van hoofdstuk 4 wordt
      vastgesteld,

      **toetsingsinkomen**: de belastbare som, bedoeld in
      [artikel 24, eerste lid, van de Wet inkomstenbelasting BES][ref2].

      2 In dit hoofdstuk wordt onder lening mede verstaan de prestatiebeurs.


      [ref1]: https://wetten.overheid.nl/BWBR0028170
      [ref2]: https://wetten.overheid.nl/BWBR0029281#Artikel24
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0028170
      - id: ref2
        bwb_id: BWBR0029281
        artikel: '24'
  - number: '4.2'
    text: |-
      Ontvangst van een lening of omzetting in een lening, of omzetting als bedoeld in [artikel 4.13][ref1], verplicht
      degene die studiefinanciering BES of een opstarttoelage heeft ontvangen tot terugbetaling van de lening vermeerderd
      met de volgens dit hoofdstuk berekende rente.


      [ref1]: https://wetten.overheid.nl/BWBR0028393#Artikel4.13
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0028393
        artikel: '4.13'
        hoofdstuk: '4'
  - number: '4.3'
    text: |-
      Onze Minister stelt jaarlijks uiterlijk in december een rentepercentage vast dat gelijk is aan het gemiddeld
      effectief rendement over de maand oktober van dat jaar van de openbare lening, uitgegeven door de Staat der
      Nederlanden en toegelaten tot de notering aan de officiële markt ter beurze van Amsterdam, met een gemiddelde
      resterende looptijd van 3 tot 5 jaren.
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel4.3
  - number: '4.4'
    text: |-
      1 Over de aangegane leningen is, voor zover het niet betreft achterstallige schuld als bedoeld in
      [artikel 4.8][ref1], rente verschuldigd overeenkomstig het tweede en derde lid. De renteberekening gaat in op
      de eerste dag van de maand die volgt op de dag waarop het bedrag aan lening bij de verstrekker van die lening is
      afgeschreven.

      2 De rente over de leningen wordt berekend per dag op basis van samengestelde interest en wordt bijgeschreven bij
      de hoofdsom.

      3 In de periode die aan de terugbetalingsperiode voorafgaat, wordt bij de berekening van de rente, bedoeld in het
      eerste en tweede lid, voor elk kalenderjaar het rentepercentage gehanteerd dat op grond van [artikel 4.3][ref2]
      uiterlijk in december van het aan dat jaar voorafgaande jaar is vastgesteld. In de terugbetalingsperiode wordt
      bij de berekening van de rente, bedoeld in het eerste en tweede lid, voor elk kalenderjaar na aanvang van de
      terugbetalingsperiode, het rentepercentage gehanteerd dat op grond van artikel 4.3 uiterlijk in december van het
      aan die periode voorafgaande jaar is vastgesteld.

      4 Voor de berekening van de rente op de voet van het tweede lid wordt een maand gesteld op 30 dagen en een jaar
      gesteld op 360 dagen.

      5 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het tweede tot en met
      het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028393#Artikel4.8
      [ref2]: https://wetten.overheid.nl/BWBR0028393#Artikel4.3
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0028393
        artikel: '4.8'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0028393
        artikel: '4.3'
        hoofdstuk: '4'
  - number: '4.5'
    text: |-
      1 De terugbetalingsperiode vangt wat betreft de studiefinanciering BES aan op 1 januari van het jaar volgend op het
      jaar waarin iemand is opgehouden studiefinanciering BES te genieten.

      2 De terugbetalingsperiode vangt wat betreft de opstarttoelage aan op 1 januari van het jaar volgend op het jaar
      waarin de studerende niet langer een opleiding niveau 3 of 4 of hoger onderwijs volgt in het Europese deel van
      Nederland.

      3 De terugbetalingsperiode bestaat uit een aanloopfase en een aflosfase.
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel4.5
  - number: '4.6'
    text: |-
      1 De aanloopfase beslaat de eerste 2 kalenderjaren na aanvang van de terugbetalingsperiode.

      2 Gedurende de aanloopfase bestaat geen verplichting tot terugbetaling.
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel4.6
  - number: '4.7'
    text: |-
      1 De aflosfase beslaat behoudens toepassing van [artikel 4.9, derde lid][ref1], 15 kalenderjaren volgend op de
      aanloopfase. Deze periode wordt verlengd met het aantal maanden dat gebruik is gemaakt van de aflosvrije periode op
      grond van het tweede lid.

      2 Op aanvraag van de debiteur wordt de terugbetaling voor ten hoogste 5 kalenderjaren opgeschort.

      3 Bij ministeriële regeling kunnen voorschriften worden vastgesteld met betrekking tot de opschorting, bedoeld in
      het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028393#Artikel4.9
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0028393
        artikel: '4.9'
        hoofdstuk: '4'
  - number: '4.8'
    text: |-
      1 Onder achterstallige schuld wordt verstaan het bedrag van de verplichte terugbetaling uit hoofde van dit
      hoofdstuk of uit hoofde van [artikel 5.2][ref1] dat 2 weken na de vervaldatum nog niet is ontvangen.

      2 Over de achterstallige schuld is rente verschuldigd. Als rentepercentage wordt het percentage van de wettelijke
      rente gehanteerd. Deze rente wordt berekend per dag op basis van samengesteld interest, waarbij een maand wordt
      gesteld op 30 dagen en een jaar wordt gesteld op 360 dagen.

      3 Indien de debiteur achterstallig is bij de betaling wordt met deze achterstallige schuld bij de duur van
      de aflosfase, bedoeld in [artikel 4.7][ref2], bij de vaststelling van de maandelijkse termijn, bedoeld in
      [artikel 4.9][ref3], alsmede bij het tenietgaan van de schuld, bedoeld in [artikel 4.12][ref4], geen rekening
      gehouden.

      4 [Artikel 4.4][ref5] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028393#Artikel5.2
      [ref2]: https://wetten.overheid.nl/BWBR0028393#Artikel4.7
      [ref3]: https://wetten.overheid.nl/BWBR0028393#Artikel4.9
      [ref4]: https://wetten.overheid.nl/BWBR0028393#Artikel4.12
      [ref5]: https://wetten.overheid.nl/BWBR0028393#Artikel4.4
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0028393
        artikel: '5.2'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0028393
        artikel: '4.7'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0028393
        artikel: '4.9'
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0028393
        artikel: '4.12'
        hoofdstuk: '4'
      - id: ref5
        bwb_id: BWBR0028393
        artikel: '4.4'
        hoofdstuk: '4'
  - number: '4.9'
    text: |-
      1 Rente en aflossing van de leningen vervallen gedurende de aflosfase in vaste maandelijkse termijnen.

      2 De hoogte van de maandelijkse termijnen wordt op basis van het aantal maanden van de aflosfase onderscheidenlijk
      het nog resterende aantal maanden van de aflosfase tot gelijke bedragen vastgesteld bij de aanvang van ieder jaar
      van de aflosfase.

      3 Onverminderd toepassing van [artikel 4.10][ref1] bedraagt het totaal per jaar te betalen bedrag aan maandelijkse
      termijnen ten minste USD 545. Bij ministeriële regeling kan dit bedrag gelet op de loonontwikkeling worden herzien.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld voor de vaststelling en betaling van de
      terugbetalingstermijnen. Hierbij kan tevens worden bepaald dat betaling geschiedt door middel van een daartoe
      verleende doorlopende machtiging om het verschuldigde bedrag maandelijks te doen afschrijven van een bankrekening.


      [ref1]: https://wetten.overheid.nl/BWBR0028393#Artikel4.10
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0028393
        artikel: '4.10'
        hoofdstuk: '4'
  - number: '4.10'
    text: |-
      1 Indien de debiteur niet in staat is de vastgestelde termijn te voldoen, kan hij gedurende de aflosfase een
      aanvraag indienen om zijn draagkracht vast te stellen voor de resterende aflosfase.

      2 De draagkracht van de debiteur is zijn draagkracht uit inkomen.

      3 Bij ministeriële regeling kunnen voorschriften worden vastgesteld met betrekking tot de aanvraag en de beslissing
      op de aanvraag, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel4.10
  - number: '4.11'
    text: |-
      1 Maatstaf voor de vaststelling van de draagkracht van de debiteur is het totaal van zijn toetsingsinkomen in het
      tweede jaar voorafgaande aan het jaar waarvoor de draagkracht wordt vastgesteld. Het aldus bepaalde inkomen is
      het draagkrachtinkomen.

      2 Op het draagkrachtinkomen wordt in mindering gebracht de draagkrachtvrije voet. Deze voet is gelijk aan 84% van
      het minimumloon.

      3 De draagkracht van de debiteur uit inkomen is 12% van het inkomen boven de draagkrachtvrije voet.

      4 Indien het bedrag van de draagkracht lager is dan het bedrag van de vastgestelde termijn, berekend op grond van
      [artikel 4.9][ref1], betaalt de debiteur, in afwijking van dat artikel, het bedrag van zijn draagkracht.

      5 Voor de toepassing van dit artikel, wordt indien het toetsingsinkomen in het tweede jaar voorafgaande aan het
      jaar waarvoor de draagkracht wordt vastgesteld, nog niet bekend is, door Onze Minister daarvoor in de plaats
      gesteld een bedrag dat het vast te stellen toetsingsinkomen benadert.

      6 Het vierde lid is niet van toepassing indien het voor Onze Minister niet mogelijk is op grond van het vijfde lid
      bij benadering een bedrag vast te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0028393#Artikel4.9
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel4.11
    references:
      - id: ref1
        bwb_id: BWBR0028393
        artikel: '4.9'
        hoofdstuk: '4'
  - number: '4.12'
    text: |-
      1 De schuld die resteert bij het einde van de aflosfase, gaat op dat ogenblik teniet.

      2 De schuld die resteert bij het overlijden van de debiteur, gaat op dat ogenblik teniet.
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel4.12
  - number: '4.13'
    text: |-
      1 Op het ogenblik van beëindiging van het recht op studiefinanciering BES van een studerende wordt zijn schuld,
      ontstaan in het kader van de toepassing van deze wet, van rechtswege omgezet in een lening. Op het ogenblik van
      beëindiging van het recht op studiefinanciering op grond van de [WSF 2000][ref1] wordt de schuld van een studerende
      met betrekking tot de opstarttoelage van rechtswege omgezet in een lening.

      2 Indien na beëindiging van het recht op studiefinanciering BES van een studerende door een beschikking op grond
      van [artikel 5.1][ref2] een vordering ontstaat van Onze Minister, wordt die vordering omgezet in een lening
      op de eerste dag van de maand na de herziening. Bij de berekening van de rente voor die vordering wordt het
      rentepercentage gehanteerd dat geldt met ingang van 1 januari volgend op het kalenderjaar waarin de studerende
      is opgehouden studiefinanciering BES te genieten. Indien de omzetting plaatsvindt in het kalenderjaar waarin de
      studerende ophoudt studerende te zijn, wordt het rentepercentage gehanteerd dat geldt met ingang van 1 januari van
      dat kalenderjaar. [Artikel 4.4, derde lid][ref3], is bij de berekening van rente van overeenkomstige toepassing.

      3 De in het eerste of tweede lid bedoelde lening wordt rentedragend met ingang van het tijdstip van de daar
      bedoelde omzetting.


      [ref1]: https://wetten.overheid.nl/BWBR0011453
      [ref2]: https://wetten.overheid.nl/BWBR0028393#Artikel5.1
      [ref3]: https://wetten.overheid.nl/BWBR0028393#Artikel4.4
