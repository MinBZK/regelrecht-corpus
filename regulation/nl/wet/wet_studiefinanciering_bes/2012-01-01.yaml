  - number: '2.3'
    text: |-
      1 Bij de aanvraag voor studiefinanciering BES en opstarttoelage worden overgelegd:

      a. naam, geboortedatum en adresgegevens;

      b. het persoonsgebonden nummer BES;

      c. een bankrekeningnummer waarop de studiefinanciering BES of de opstarttoelage kan worden overgemaakt, en

      d. een bewijs van inschrijving aan een opleiding in het beroepsonderwijs of het hoger onderwijs, of indien het een
      opleiding buiten een van de openbare lichamen betreft, een document of documenten waarmee aannemelijk wordt gemaakt
      welke opleiding de studerende zal gaan volgen.

      2 De aanvraag voor een opstarttoelage wordt ingediend in de periode gelegen tussen 1 mei en de aanvang van de
      opleiding.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld over de aanvraag.
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel2.3
  - number: '2.4'
    text: |-
      1 Onze Minister kent studiefinanciering BES of de opstarttoelage toe aan degene die daartoe een aanvraag heeft
      ingediend en die voldoet aan de voorschriften gegeven bij of krachtens deze wet.

      2 Onze Minister besluit op een aanvraag om studiefinanciering BES of de opstarttoelage binnen 8 weken na de
      indiening van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel2.4
  - number: '2.5'
    text: |-
      1 Studiefinanciering BES wordt toegekend per studiefinancieringstijdvak.

      2 Studiefinanciering BES kan worden toegekend voor een periode die gelegen is voor de datum van indiening van de
      aanvraag, doch wordt niet toegekend voor een periode die gelegen is voor de datum van aanvang van het studiejaar
      waarin de aanvraag wordt gedaan.

      3 De opstarttoelage wordt slechts toegekend indien zij betrekking heeft op een nog niet aangevangen studiejaar.

      4 Op aanvraag van de studerende onderbreekt of beëindigt Onze Minister de studiefinanciering BES met ingang van de
      kalendermaand die de studerende in zijn aanvraag aangeeft. De onderbreking omvat ten minste 1 maand.
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel2.5
  - number: '2.6'
    text: |-
      1 Studiefinanciering BES wordt aan deelnemers aan opleidingen niveau 1 of 2 gedurende maximaal 4 jaren verstrekt in
      de vorm van een gift.

      2 Als onderdeel van de studiefinanciering BES kan aan deze deelnemers tevens een lening worden
      verstrekt. Het bedrag dat per maand kan worden geleend is opgenomen in kolom IV van het overzicht in
      [artikel 2.2, eerste lid][ref1].

      3 Studiefinanciering BES wordt aan deze deelnemers gedurende maximaal 36 maanden na de periode, bedoeld in het
      eerste lid, verstrekt in de vorm van een lening. Het bedrag dat per maand kan worden geleend is opgenomen in kolom
      V van het overzicht in [artikel 2.2, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028393#Artikel2.2
      [ref2]: https://wetten.overheid.nl/BWBR0028393#Artikel2.2
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel2.6
