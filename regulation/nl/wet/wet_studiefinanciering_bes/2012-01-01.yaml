  - number: '1.1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      **aanvraag:** schriftelijk verzoek tot het nemen van een besluit,

      **afsluitend examen**:

      a. het examen, bedoeld in [artikel 7.4.2 van de Wet educatie en beroepsonderwijs BES][ref1],

      b. het examen, bedoeld in [artikel 7.10a van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2], en

      c. het met onderdeel a of b vergelijkbare examen van een opleiding waarvoor criteria zijn vastgesteld bij
      ministeriële regeling,

      **ander openbaar lichaam**: het openbaar lichaam waar de ouders van de studerende wonen of een van diens ouders
      woont, niet zijnde het openbaar lichaam waar de studerende een opleiding volgt,

      **bacheloropleiding**:

      a. opleiding als bedoeld in
      __REF000___________________________________________________________________________________________________________
      _______________________, die is geaccrediteerd als bedoeld in
      [artikel 1.1, onderdeel s, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref4], of die de toets
      nieuwe opleiding, bedoeld in artikel 1.1, onderdeel t, van die wet, met positief gevolg heeft ondergaan,

      b. opleiding die vergelijkbaar is met een opleiding als bedoeld in onderdeel a waarvoor criteria zijn vastgesteld
      bij ministeriële regeling,

      **beroepsonderwijs**:

      a. beroepsonderwijs in de zin van [artikel 7.2.6, derde lid, van de Wet educatie en beroepsonderwijs BES][ref5], en

      b. onderwijs waarvoor criteria zijn vastgesteld bij ministeriële regeling,

      **beroepsopleiding:**

      a. opleiding als bedoeld in [artikel 7.2.2, eerste lid, van de Wet educatie en beroepsonderwijs BES][ref6], en

      b. opleiding die vergelijkbaar is met een opleiding als bedoeld in onderdeel a, waarvoor criteria zijn vastgesteld
      bij ministeriële regeling,

      **debiteur**: degene die zich krachtens [artikel 4.2][ref7] heeft verplicht tot terugbetaling,

      **deelnemer:** degene die beroepsonderwijs volgt,

      **diplomatermijn beroepsonderwijs**: periode van tien jaren die aanvangt op de eerste dag van de maand waarover
      voor het eerst prestatiebeurs is toegekend voor het volgen van beroepsonderwijs,

      **diplomatermijn hoger onderwijs:** periode van tien jaren die aanvangt op de eerste dag van de maand waarover voor
      het eerst prestatiebeurs is toegekend voor het volgen van hoger onderwijs,

      **eigen openbaar lichaam**: het openbaar lichaam waar de ouders van de studerende wonen of een van diens ouders
      woont, tevens het openbaar lichaam waar de studerende een opleiding volgt,

      **hoger onderwijs**:

      a. wetenschappelijk onderwijs en hoger beroepsonderwijs in de zin van de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref8], en

      b. wetenschappelijk onderwijs en hoger beroepsonderwijs waarvoor criteria zijn vastgesteld bij ministeriële
      regeling,

      **lening**: rentedragende lening die niet kan worden omgezet in een gift,

      **masteropleiding**:

      a. opleiding als bedoeld in
      __REF000___________________________________________________________________________________________________________
      _______________________, die is geaccrediteerd als bedoeld in
      [artikel 1.1, onderdeel s, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref10], of die de toets
      nieuwe opleiding, bedoeld in artikel 1.1, onderdeel t, van die wet, met positief gevolg heeft ondergaan,

      b. opleiding die vergelijkbaar is met een opleiding als bedoeld in onderdeel a waarvoor criteria zijn vastgesteld
      bij ministeriële regeling,

      **Onze Minister**: Onze Minister van Onderwijs, Cultuur en Wetenschap,

      **openbaar lichaam**: openbaar lichaam Bonaire, Sint Eustatius of Saba,

      **opleiding niveau 1 of 2:**assistentopleiding en basisberoepsopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen a en b, van de Wet educatie en beroepsonderwijs BES][ref11],

      **opleiding niveau 3 of 4:**vakopleiding, middenkaderopleiding en specialistenopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen c, d en e, van de Wet educatie en beroepsonderwijs BES][ref12],

      **opstarttoelage**: door Onze Minister toegekend eenmalig bedrag in verband met het volgen van beroepsonderwijs of
      hoger onderwijs in het Europese deel van Nederland,

      **persoonsgebonden nummer BES**: door Onze Minister uitgegeven onderwijsnummer, toegekend aan een studerende of
      debiteur,

      **prestatiebeurs**: rentedragende lening die onder voorwaarden kan worden omgezet in een gift, waarbij tevens de
      rente teniet gaat, niet zijnde de rentedragende lening die niet kan worden omgezet in een gift,

      **student**: degene die hoger onderwijs volgt, niet zijnde een extraneus,

      **studerende**: deelnemer of student,

      **studiefinanciering BES**: door Onze Minister toegekende financiering in verband met het volgen van
      beroepsonderwijs of hoger onderwijs waarop uitsluitend op grond van deze wet aanspraak bestaat, niet zijnde een
      opstarttoelage,

      **studiefinancieringstijdvak**: kalenderjaar of een gedeelte daarvan waarop de toekenning van studiefinanciering
      BES betrekking heeft, met dien verstande dat deze periode ten minste 1 kalendermaand is,

      **studiejaar**:

      1°. in het beroepsonderwijs: tijdvak dat aanvangt op 1 augustus van enig kalenderjaar en eindigt op 31 juli
      daaropvolgend,

      2°. in het hoger onderwijs: tijdvak dat aanvangt op 1 september van enig kalenderjaar en eindigt op 31 augustus
      daaropvolgend,

      3°. voor opleidingen waarvoor criteria zijn vastgesteld bij ministeriële regeling: tijdvak zoals gehanteerd door de
      instellingen die deze opleidingen verzorgen,

      **voltijdse opleiding**:

      1°. opleiding in de zin van de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref13], met uitzondering
      van deeltijds onderwijs,

      2°. opleiding die vergelijkbaar is met een opleiding als bedoeld onder 1° waarvoor criteria zijn vastgesteld bij
      ministeriële regeling,

      **WSF 2000**: [Wet studiefinanciering 2000][ref14].

      2 Onder voltijdse opleiding wordt mede verstaan een duale opleiding in de zin van de
      [Wet op het hoger onderwijs en het wetenschappelijk onderzoek][ref15] of een daarmee vergelijkbare opleiding
      waarvoor criteria zijn vastgesteld bij ministeriële regeling.


