        paragraaf: '7.1'
  - number: '7.6'
    text: |-
      Overtreding van bepalingen van een krachtens deze wet uitgevaardigde algemene maatregel van bestuur, voor zover
      uitdrukkelijk als strafbaar feit in de zin van dit artikel aangeduid, wordt gestraft met hechtenis van ten hoogste
      1 maand of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel7.6
  - number: '7.7'
    text: |-
      De in de [artikelen 7.5][ref1] en [7.6][ref2] strafbaar gestelde feiten zijn overtredingen.


