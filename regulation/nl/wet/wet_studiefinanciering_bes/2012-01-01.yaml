        bwb_id: BWBR0028455
        artikel: '64'
  - number: '9.1'
    text: |-
      Degene die voor de aanvang van het studiejaar 2011–2012 in het Europese deel van Nederland studiefinanciering op
      grond van de [WSF 2000][ref1] geniet, heeft geen aanspraak op een opstarttoelage.


      [ref1]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0011453
  - number: '9.2'
    text: |-
      Studietoelage die is verstrekt onder de werking van de Landsstudietoelagenregeling of van de Wet studiefinanciering
      BES zoals die wet op 10 oktober 2010 is komen te luiden, wordt beheerst door de bepalingen van de
      Landsstudietoelagenregeling zoals die luidde op 9 oktober 2010. Een schuld die voortvloeit uit studietoelage als
      bedoeld in de vorige volzin, is vanaf 10 oktober 2010 een schuld jegens Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel9.2
  - number: '10.1'
    text: 'Deze wet wordt aangehaald als: Wet studiefinanciering BES.'
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel10.1
