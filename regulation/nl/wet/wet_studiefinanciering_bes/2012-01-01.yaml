  - number: '8.1'
    text: |-
      1 Per 1 januari van ieder kalenderjaar vervangt Onze Minister de bedragen, bedoeld in [artikel 2.2][ref1], bij
      ministeriële regeling door andere bedragen. Deze bedragen worden berekend aan de hand van de consumentenprijsindex
      in het tweede daaraan voorafgaande kalenderjaar. De aangepaste bedragen treden in de plaats van de in de eerste
      volzin bedoelde bedragen.

      2 Hetgeen onder consumentenprijsindex als bedoeld in het eerste lid wordt verstaan, wordt nader vastgesteld bij
      ministeriële regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0028393#Artikel2.2
    url: https://wetten.overheid.nl/BWBR0028393/2012-01-01#Artikel8.1
