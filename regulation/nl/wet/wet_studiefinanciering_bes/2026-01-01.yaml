  - number: 8.4a
    text: |-
      [Afdeling 3.3 van de Algemene wet bestuursrecht][ref1] is van toepassing op een beschikking op grond van
      [artikel 2.10a][ref2], met dien verstande dat in [artikel 3:5, eerste lid][ref3], in plaats van «besluiten» wordt
      gelezen «beschikkingen» en in de [artikelen 3:6, tweede lid][ref4], [3:8][ref5] en [3:9][ref6] in plaats van «het
      besluit» wordt gelezen «de beschikking».


