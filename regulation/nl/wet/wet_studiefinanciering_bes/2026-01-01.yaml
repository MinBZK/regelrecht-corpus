  - number: '9.2'
    text: |-
      Studietoelage die is verstrekt onder de werking van de Landsstudietoelagenregeling of van de Wet studiefinanciering
      BES zoals die wet op 10 oktober 2010 is komen te luiden, wordt beheerst door de bepalingen van de
      Landsstudietoelagenregeling zoals die luidde op 9 oktober 2010. Een schuld die voortvloeit uit studietoelage als
      bedoeld in de vorige volzin, is vanaf 10 oktober 2010 een schuld jegens Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028393/2026-01-01#Artikel9.2
  - number: '9.3'
    text: |-
      Tot een bij koninklijk besluit te bepalen tijdstip blijven de begripsomschrijving van «persoonsgebonden nummer BES»
      in [artikel 1.1, eerste lid][ref1], en de [artikelen, 1.7][ref2] en [2.3, eerste lid, onderdeel b][ref3], buiten
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028393#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0028393#Artikel1.7
      [ref3]: https://wetten.overheid.nl/BWBR0028393#Artikel2.3
