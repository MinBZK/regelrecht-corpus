  - number: '1.1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      **aanvraag:** schriftelijk verzoek tot het nemen van een besluit,

      **achterstallige schuld**: achterstallige schuld als bedoeld in [artikel 4.8][ref1],

      **afsluitend examen**:

      a. het examen, bedoeld in [artikel 7.4.2 van de Wet educatie en beroepsonderwijs BES][ref2],

      b. het examen, bedoeld in [artikel 7.10a van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref3], en

      c. het met onderdeel a of b vergelijkbare examen van een vergelijkbare opleiding beroepsonderwijs of hoger
      onderwijs,

      **ander openbaar lichaam:** het openbaar lichaam waar de student een opleiding volgt, niet zijnde het openbaar
      lichaam waar de ouders van de student wonen of een van diens ouders woont,

      **associate degree-opleiding:** opleiding als bedoeld in
      [artikel 7.3a, tweede lid, onderdeel a, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref4],
      waaraan accreditatie als bedoeld in artikel 1.1, onderdeel q, van die wet is verleend,

      **bacheloropleiding**: opleiding als bedoeld in
      __REF000___________________________________________________________________________________________________________
      _______________________ waaraan accreditatie als bedoeld in artikel 1.1, onderdeel q, van die wet is verleend,

      **beroepsonderwijs**:

      a. beroepsonderwijs in de zin van [artikel 7.2.6, derde lid, van de Wet educatie en beroepsonderwijs BES][ref6], en

      b. vergelijkbaar beroepsonderwijs,

      **beroepsopleiding:**

      a. op grond van [artikel 1.4.1 van de Wet educatie en beroepsonderwijs BES][ref7] erkende beroepsopleiding, en

      b. vergelijkbaar beroepsonderwijs,

      **debiteur**: degene die zich krachtens [artikel 4.2][ref8] heeft verplicht tot terugbetaling,

      **diplomatermijn beroepsonderwijs**: periode van tien jaren die aanvangt op de eerste dag van de maand waarover
      voor het eerst prestatiebeurs is toegekend voor het volgen van beroepsonderwijs,

      **diplomatermijn hoger onderwijs:** periode van tien jaren die aanvangt op de eerste dag van de maand waarover voor
      het eerst prestatiebeurs is toegekend voor het volgen van hoger onderwijs,

      **eigen openbaar lichaam**: het openbaar lichaam waar de ouders van de student wonen of een van diens ouders woont,
      tevens het openbaar lichaam waar de student een opleiding volgt,

      **hoger onderwijs**:

      a. wetenschappelijk onderwijs en hoger beroepsonderwijs in de zin van de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref9], en

      b. vergelijkbaar hoger onderwijs,

      **ho-student**: degene die hoger onderwijs volgt, niet zijnde een extraneus,

      **lening**: rentedragende lening die niet kan worden omgezet in een gift,

      **masteropleiding**: opleiding als bedoeld in
      __REF000___________________________________________________________________________________________________________
      ________________________ waaraan accreditatie als bedoeld in artikel 1.1, onderdeel q, van die wet is verleend,

      **mbo-student**: degene die beroepsonderwijs volgt,

      **Onze Minister**: Onze Minister van Onderwijs, Cultuur en Wetenschap,

      **openbaar lichaam**: openbaar lichaam Bonaire, Sint Eustatius of Saba,

      **opleiding niveau 1 of 2:**entreeopleiding en basisberoepsopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen a en b, van de Wet educatie en beroepsonderwijs BES][ref11],

      **opleiding niveau 3 of 4:**vakopleiding, middenkaderopleiding en specialistenopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen c, d en e, van de Wet educatie en beroepsonderwijs BES][ref12],

      **opstarttoelage**: door Onze Minister toegekend eenmalig bedrag in verband met het volgen van beroepsonderwijs of
      hoger onderwijs in het Europese deel van Nederland,

      **ouder**: natuurlijke ouder of adoptiefouder in de zin van de
      [artikelen 197 tot en met 232aa van Boek 1 van het Burgerlijk Wetboek BES][ref13],

      **persoonsgebonden nummer BES**: door Onze Minister uitgegeven onderwijsnummer, toegekend aan een student of
      debiteur,

      **prestatiebeurs**: rentedragende lening die onder voorwaarden kan worden omgezet in een gift, waarbij tevens de
      rente teniet gaat, niet zijnde de rentedragende lening die niet kan worden omgezet in een gift,

      **student**: mbo-student of ho-student,

      **studiefinanciering BES**: door Onze Minister toegekende financiering in verband met het volgen van
      beroepsonderwijs of hoger onderwijs waarop uitsluitend op grond van deze wet aanspraak bestaat, niet zijnde een
      opstarttoelage,

      **studiefinancieringstijdvak**: kalenderjaar of een gedeelte daarvan waarop de toekenning van studiefinanciering
      BES betrekking heeft, met dien verstande dat deze periode ten minste 1 kalendermaand is,

      **studiejaar**:

      a. in het beroepsonderwijs: tijdvak dat aanvangt op 1 augustus van enig kalenderjaar en eindigt op 31 juli
      daaropvolgend,

      b. in het hoger onderwijs: tijdvak dat aanvangt op 1 september van enig kalenderjaar en eindigt op 31 augustus
      daaropvolgend,

      c. voor vergelijkbaar beroepsonderwijs of hoger onderwijs: tijdvak zoals gehanteerd door de instellingen die de
      betreffende opleidingen verzorgen,

      **termijnbetaling**: bedrag als bedoeld in [artikel 4.9][ref14],

      **vergelijkbaar beroepsonderwijs**: vergelijkbaar beroepsonderwijs in de zin van
      [artikel 2.9, eerste lid, onderdeel c][ref15],

      **vergelijkbaar hoger onderwijs**: vergelijkbaar hoger onderwijs in de zin van
      [artikel 2.9, eerste lid, onderdeel c][ref16],

      **voltijdse opleiding**:

      a. opleiding in de zin van de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref17], met uitzondering
      van deeltijds onderwijs,

      b. vergelijkbaar hoger onderwijs,

      **WSF 2000**: [Wet studiefinanciering 2000][ref18].

      2 Onder voltijdse opleiding wordt mede verstaan een duale opleiding in de zin van de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref19] of vergelijkbaar hoger onderwijs.


