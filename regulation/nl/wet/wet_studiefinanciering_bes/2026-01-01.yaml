  - number: '1.6'
    text: |-
      Op verzoek van Onze Minister bepaalt de inspecteur, bedoeld in [artikel 1.3 van de Belastingwet BES][ref1], het
      belastbaar inkomen, bedoeld in [artikel 3 van de Wet inkomstenbelasting BES][ref2], van de debiteur.


