  - number: 7.4a
    text: |-
      1 Onze Minister verwerkt de persoonsgegevens die hij ontvangt of bezit ten behoeve van de toepassing van
      [artikel 2.10a][ref1].

      2 Bij de verwerking van gegevens op grond van het eerste lid kunnen bijzondere persoonsgegevens als bedoeld in
      [artikel 16 van de Wet bescherming persoonsgegevens][ref2] worden verwerkt, voor zover deze gegevens noodzakelijk
      zijn voor de toepassing van [artikel 2.10a][ref3].

      3 Ten behoeve van de toepassing van [artikel 2.10a][ref4] verstrekt Onze Minister uitsluitend het gegeven of een
      persoon studiefinanciering heeft aangevraagd dan wel reeds ontvangt.

      4 [Artikel 1.7][ref5] is voor de gegevensverwerking, bedoeld in dit artikel, van overeenkomstige toepassing voor
      een persoon die studiefinanciering heeft aangevraagd.

      5 Bij ministeriële regeling worden regels gesteld ter waarborging van de persoonlijke levenssfeer. Daarbij worden
      in ieder geval regels gesteld over:

      a. op welke wijze de gegevensverwerking bedoeld in dit artikel, plaatsvindt;

      b. op welke wijze door passende technische en organisatorische maatregelen deze gegevens worden beveiligd tegen
      verlies of onrechtmatige verwerking;

      c. op welke wijze wordt gewaarborgd dat de verwerkte persoonsgegevens slechts worden verwerkt voor het doel
      waarvoor zij zijn verzameld, alsmede hoe daarop wordt toegezien.


      [ref1]: https://wetten.overheid.nl/BWBR0028393#Artikel2.10a
