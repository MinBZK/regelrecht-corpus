  - number: '2.3'
    text: |-
      1 Bij de aanvraag voor studiefinanciering BES en opstarttoelage worden overgelegd:

      a. naam, geboortedatum en adresgegevens;

      b. het persoonsgebonden nummer BES;

      c. een bankrekeningnummer waarop de studiefinanciering BES of de opstarttoelage kan worden overgemaakt; en

      d. een document of documenten waarmee aannemelijk wordt gemaakt welke opleiding de student zal gaan volgen.

      2 De aanvraag voor een opstarttoelage wordt ingediend voorafgaand aan de maand waarin de opleiding begint.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld over de aanvraag.
    url: https://wetten.overheid.nl/BWBR0028393/2026-01-01#Artikel2.3
  - number: '2.4'
    text: |-
      1 Onze Minister kent studiefinanciering BES of de opstarttoelage toe aan degene die daartoe een aanvraag heeft
      ingediend en die voldoet aan de voorschriften gegeven bij of krachtens deze wet.

      2 Onze Minister besluit op een aanvraag om studiefinanciering BES of de opstarttoelage binnen 8 weken na de
      indiening van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0028393/2026-01-01#Artikel2.4
  - number: '2.5'
    text: |-
      1 Studiefinanciering BES wordt toegekend per studiefinancieringstijdvak.

      2 Studiefinanciering BES kan worden toegekend voor een periode voorafgaand aan de datum van indiening van de
      aanvraag, maar wordt niet toegekend voor een periode voorafgaand aan de datum van aanvang van het studiejaar waarin
      de aanvraag wordt gedaan.

      3 De opstarttoelage wordt slechts toegekend indien zij betrekking heeft op een nog niet aangevangen opleiding.

      4 Op aanvraag van de student onderbreekt of beëindigt Onze Minister de studiefinanciering BES met ingang van de
      kalendermaand die de student in zijn aanvraag aangeeft, met dien verstande dat de onderbreking of beëindiging niet
      plaatsvindt voor een periode voorafgaand aan de datum van de indiening van de aanvraag. De onderbreking omvat ten
      minste 1 maand.
    url: https://wetten.overheid.nl/BWBR0028393/2026-01-01#Artikel2.5
  - number: '2.6'
    text: |-
      1 Studiefinanciering BES wordt aan mbo-studenten aan opleidingen niveau 1 of 2 gedurende maximaal 4 jaren verstrekt
      in de vorm van een gift.

      2 Als onderdeel van de studiefinanciering BES kan aan deze mbo-studenten tevens een lening worden
      verstrekt. Het bedrag dat per maand kan worden geleend is opgenomen in kolom IV van het overzicht in
      [artikel 2.2, eerste lid][ref1].

      3 Studiefinanciering BES wordt aan deze mbo-studenten gedurende maximaal 36 maanden na de periode, bedoeld in het
      eerste lid, verstrekt in de vorm van een lening. Het bedrag dat per maand kan worden geleend is opgenomen in kolom
      V van het overzicht in [artikel 2.2, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028393#Artikel2.2
      [ref2]: https://wetten.overheid.nl/BWBR0028393#Artikel2.2
    url: https://wetten.overheid.nl/BWBR0028393/2026-01-01#Artikel2.6
