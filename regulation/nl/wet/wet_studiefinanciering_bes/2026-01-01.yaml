        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0028393
        hoofdstuk: '3'
  - number: '2.9'
    text: |-
      1 Voor studiefinanciering BES kan in aanmerking komen degene die is ingeschreven

      a. als mbo-student aan een instelling die een beroepsopleiding verzorgt,

      b. als ho-student aan een instelling die een associate degree-opleiding, bacheloropleiding of masteropleiding
      verzorgt, of

      c. als mbo- of ho-student voor beroepsonderwijs of hoger onderwijs anders dan het onderwijs in de zin van de
      [Wet educatie en beroepsonderwijs BES][ref1] of de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2]
      waarvoor criteria zijn vastgesteld bij ministeriële regeling.

      2 Voor een opstarttoelage kan in aanmerking komen degene die aannemelijk kan maken dat hij in het Europese deel
      van Nederland een opleiding niveau 3 of 4 als bedoeld in [artikel 1.1, eerste lid, van de WSF 2000][ref3] of hoger
      onderwijs gaat volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0028395
      [ref2]: https://wetten.overheid.nl/BWBR0005682
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0028393/2026-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0028395
      - id: ref2
        bwb_id: BWBR0005682
      - id: ref3
        bwb_id: BWBR0011453
        artikel: '1.1'
  - number: '2.10'
    text: |-
      1 Een student heeft geen aanspraak op studiefinanciering BES:

      a. indien hij is ingeschreven aan een opleiding waarvan de duur, daaronder begrepen ten hoogste 12 vakantieweken,
      korter is dan 1 jaar,

      b. indien hij niet is ingeschreven voor een voltijdse opleiding in het beroepsonderwijs of het hoger onderwijs,

      c. indien hij aanspraak heeft op studiefinanciering op grond van de [Wet studiefinanciering 2000][ref1],

      d. indien hij in het betreffende studiefinancieringstijdvak aanspraak maakt op een tegemoetkoming in de kosten van
      levensonderhoud, studie, overtocht en huisvesting die door de daarvoor verantwoordelijke autoriteit van een ander
      land wordt verstrekt.

      2 De aanspraak op de opstarttoelage vervalt indien de student niet voor het einde van het eerste
      studiejaar van de betreffende opleiding is ingeschreven voor het volgen van het onderwijs, bedoeld in
      [artikel 2.9, tweede lid][ref2].

      3 De aanspraak van een student die vergelijkbaar beroepsonderwijs of hoger onderwijs volgt, vervalt over het
      tijdvak waarover hij de inlichtingen, bedoeld in [artikel 7.1, eerste lid][ref3], niet verstrekt. Zolang hij die
      inlichtingen over een studiejaar niet verstrekt, heeft hij tevens geen aanspraak op studiefinanciering BES voor de
      daarop volgende studiejaren. Indien hij die inlichtingen alsnog verstrekt, herleeft de aanspraak over de periode
      waarop de inlichtingen betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0011453
      [ref2]: https://wetten.overheid.nl/BWBR0028393#Artikel2.9
      [ref3]: https://wetten.overheid.nl/BWBR0028393#Artikel7.1
    url: https://wetten.overheid.nl/BWBR0028393/2026-01-01#Artikel2.10
