  - number: '5.1'
    text: |-
      1 Onze Minister kan een beschikking herzien waarbij:

      a. studiefinanciering BES is toegekend,

      b. een opstarttoelage is toegekend,

      c. de vorm van de studiefinanciering BES is vastgelegd,

      d. de termijnbetaling wordt vastgesteld of gewijzigd,

      e. de draagkracht van de debiteur wordt vastgesteld,

      f. de hoogte van de lening wordt vastgesteld of gewijzigd, of

      g. studiefinanciering BES of opstarttoelage ingevolge [artikel 2.10a][ref1] is geweigerd of stopgezet.

      2 Herziening vindt plaats op grond van het feit dat:

      a. een beschikking genomen is waarvan de student of de debiteur wist of redelijkerwijs had kunnen weten dat deze
      onjuist was,

      b. op basis van onjuiste of onjuist verwerkte gegevens anders dan bedoeld onder a te veel of te weinig
      studiefinanciering BES is toegekend, wel of geen opstarttoelage is toegekend, de vorm van de studiefinanciering BES
      onjuist is vastgelegd, de termijnbetaling te hoog of te laag is vastgesteld, de draagkracht van de debiteur te hoog
      of te laag is vastgesteld,

      c. betrokkene heeft gehandeld in strijd met het bepaalde bij of krachtens deze wet,

      d. achteraf is gebleken van feiten of omstandigheden, die, waren zij eerder bekend geweest, niet tot toepassing van
      [artikel 2.10a][ref2] zouden hebben geleid, of

      e. andere, nader gebleken feiten of omstandigheden, die, waren zij eerder bekend geweest, tot een andere
      beschikking zouden hebben geleid.

      3 Behoudens in het geval van bedrog kan een herziening als bedoeld in het tweede lid, onderdelen a en b, voor zover
      het betreft de vorm van de studiefinanciering BES slechts geschieden binnen 5 jaren na:

      a. het einde van het desbetreffende studiefinancieringstijdvak;

      b. het kalenderjaar waarvoor de termijnbetaling is vastgesteld; of

      c. het kalenderjaar waarvoor de draagkracht van de debiteur is vastgesteld.

      4 Behoudens in geval van bedrog, kan een herziening anders dan bedoeld in het derde lid, slechts geschieden binnen
      18 maanden na:

      a. het einde van het desbetreffende studiefinancieringstijdvak;

      b. het tijdstip van beëindiging van de aanspraak op studiefinanciering op grond van de [WSF 2000][ref3] voor zover
      het de opstarttoelage betreft;

      c. het kalenderjaar waarvoor de termijnbetaling is vastgesteld; of

      d. het kalenderjaar waarvoor de draagkracht van de debiteur is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028393#Artikel2.10a
      [ref2]: https://wetten.overheid.nl/BWBR0028393#Artikel2.10a
      [ref3]: https://wetten.overheid.nl/BWBR0011453
