  - number: 2.10a
    text: |-
      1 Een student heeft geen aanspraak op studiefinanciering BES en opstarttoelage indien hij een uitreiziger is.

      2 Onze Minister kan besluiten dat een student een uitreiziger is indien het betreft een persoon ten aanzien van wie
      uit een melding van de door de daartoe bevoegde opsporingsdiensten of inlichtingen- en veiligheidsdiensten, gericht
      aan Onze Minister, is gebleken dat het gegronde vermoeden bestaat dat de student zich buiten het land Nederland
      bevindt met het doel zich aan te sluiten bij een organisatie die door Onze Minister van Veiligheid en Justitie, in
      overeenstemming met het gevoelen van de Rijksministerraad, is geplaatst op een lijst van organisaties die deelnemen
      aan een nationaal of internationaal gewapend conflict en een bedreiging vormen voor de nationale veiligheid.

      3 In het besluit van Onze Minister dat een student een uitreiziger is, wordt vermeld vanaf welk moment een student
      als uitreiziger is aangemerkt.
    url: https://wetten.overheid.nl/BWBR0028393/2026-01-01#Artikel2.10a
  - number: '2.11'
    text: |-
      1 Een mbo-student aan een opleiding niveau 3 of 4 heeft geen aanspraak op studiefinanciering BES voor het volgen
      van beroepsonderwijs indien er 10 jaren verstreken zijn nadat voor het eerst studiefinanciering BES is toegekend
      voor het volgen van beroepsonderwijs.

      2 Een mbo-student heeft geen aanspraak op studiefinanciering BES voor het volgen van een opleiding niveau 1 of 2,
      indien hij reeds 4 jaren prestatiebeurs voor het volgen van een opleiding niveau 3 of 4 heeft genoten.

      3 Een student heeft geen aanspraak op studiefinanciering BES voor het volgen van beroepsonderwijs indien hij reeds
      4 jaren studiefinanciering BES heeft genoten voor het volgen van hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0028393/2026-01-01#Artikel2.11
  - number: '2.12'
    text: |-
      1 De aanspraak op studiefinanciering BES eindigt met ingang van de maand die volgt op de dag waarop de mbo-student
      het afrondende studiejaar van een opleiding met goed gevolg heeft afgesloten.

      2 Indien de mbo-student aansluitend aan het afrondende studiejaar, opnieuw begint aan dat afrondende studiejaar
      zonder dat dat studiejaar met goed gevolg was afgesloten, ontstaat aanspraak op studiefinanciering BES voor het
      resterende gedeelte van het kalenderjaar.

      3 Indien de mbo-student na zijn uitschrijving in juli per 1 september daaropvolgend hoger onderwijs in de
      zin van deze wet gaat volgen, blijft op zijn aanvraag de aanspraak op studiefinanciering in de maand augustus
      bestaan. Hij wordt in die periode aangemerkt als mbo-student aan de eerste opleiding. In afwijking van
      [artikel 2.5, tweede lid][ref1], kan de aanvraag in het daarop volgende studiejaar worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0028393#Artikel2.5
    url: https://wetten.overheid.nl/BWBR0028393/2026-01-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0028393
        artikel: '2.5'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '2.13'
    text: |-
      De student die zowel voor het volgen van beroepsonderwijs als voor het volgen van hoger onderwijs aanspraak zou
      kunnen maken op studiefinanciering BES heeft slechts aanspraak op studiefinanciering BES voor het volgen van hoger
      onderwijs.
    url: https://wetten.overheid.nl/BWBR0028393/2026-01-01#Artikel2.13
  - number: '2.14'
    text: |-
      Een ho-student heeft geen aanspraak op studiefinanciering BES indien er 10 jaren verstreken zijn nadat voor het
      eerst studiefinanciering BES is toegekend voor het volgen van hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0028393/2026-01-01#Artikel2.14
  - number: '3.1'
    text: |-
      1 Indien een mbo-student binnen de diplomatermijn beroepsonderwijs het afsluitend examen van een opleiding niveau 3
      of 4 met goed gevolg heeft afgelegd, wordt de aan hem toegekende prestatiebeurs omgezet in een gift.

      2 Indien een mbo-student binnen de diplomatermijn beroepsonderwijs het afsluitend examen van een beroepsopleiding
      met goed gevolg heeft afgelegd, wordt de resterende periode van zijn prestatiebeurs verstrekt in de vorm van een
      gift indien hij een andere beroepsopleiding aanvangt.

      3 Omzetting vindt plaats uiterlijk per 1 januari volgend op het kalenderjaar waarin Onze Minister heeft vastgesteld
      dat een mbo-student heeft voldaan aan de voorwaarden, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028393/2026-01-01#Artikel3.1
  - number: '3.2'
    text: |-
      1 Indien een ho-student binnen de diplomatermijn hoger onderwijs met goed gevolg een associate degree-opleiding
      afrondt, wordt de toegekende prestatiebeurs hoger onderwijs voor de duur van de desbetreffende opleiding omgezet in
      een gift.

      2 Indien een ho-student binnen de diplomatermijn hoger onderwijs met goed gevolg een opleiding als bedoeld in het
      eerste lid afrondt, wordt de resterende periode van de prestatiebeurs hoger onderwijs die ingevolge het eerste lid
      had kunnen worden omgezet in een gift verstrekt in de vorm van een gift indien hij een andere opleiding in de zin
      van deze wet volgt.

      3 Indien een ho-student binnen de diplomatermijn hoger onderwijs het afsluitend examen van een hbo-
      bacheloropleiding, of het geheel van een bacheloropleiding en een masteropleiding in geval van een opleiding in het
      wetenschappelijk onderwijs met goed gevolg heeft afgesloten, wordt de aan hem toegekende prestatiebeurs omgezet in
      een gift.

      4 Indien een ho-student binnen de diplomatermijn hoger onderwijs het afsluitend examen van een opleiding als
      bedoeld in het derde lid met goed gevolg heeft afgesloten, wordt de resterende periode van zijn prestatiebeurs
      verstrekt in de vorm van een gift indien hij een andere opleiding in de zin van deze wet volgt.

      5 Bij ministeriële regeling kunnen voor de toepassing van het eerste tot en met vierde lid examens worden
      aangewezen die worden gelijkgesteld met een afsluitend examen.

      6 Met een afsluitend examen wordt eveneens gelijkgesteld het examen van een bacheloropleiding in het
      wetenschappelijk onderwijs, voor zover de ho-student daartoe een aanvraag heeft ingediend.

      7 Omzetting vindt plaats uiterlijk per 1 januari volgend op het kalenderjaar waarin Onze Minister heeft vastgesteld
      dat een ho-student heeft voldaan aan de voorwaarden, bedoeld in het eerste of derde lid.
    url: https://wetten.overheid.nl/BWBR0028393/2026-01-01#Artikel3.2
  - number: '3.3'
    text: |-
      Bij omzetting van een prestatiebeurs of een deel daarvan in een gift gaat de over het om te zetten bedrag
      opgebouwde rente teniet.
    url: https://wetten.overheid.nl/BWBR0028393/2026-01-01#Artikel3.3
  - number: '3.4'
    text: |-
      1 Indien een student met goed gevolg het afsluitend examen heeft behaald van een opleiding waarvan de studielast is
      gebaseerd op een periode van minder dan 4 jaren, wordt het aantal om te zetten maanden van zijn prestatiebeurs met
      dit verschil verminderd.

      2 Indien een ho-student een aanvraag als bedoeld in [artikel 3.2, zesde lid][ref1], heeft ingediend, wordt het
      aantal maanden, bedoeld in het eerste lid, van de aan hem toegekende prestatiebeurs omgezet in een gift.


      [ref1]: https://wetten.overheid.nl/BWBR0028393#Artikel3.2
    url: https://wetten.overheid.nl/BWBR0028393/2026-01-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0028393
        artikel: '3.2'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '3.5'
    text: |-
      1 Een student aan een opleiding buiten Nederland zendt uiterlijk 3 maanden na het verstrijken van de diplomatermijn
      beroepsonderwijs of de diplomatermijn hoger onderwijs, een gewaarmerkt bewijs van het met goed gevolg afleggen van
      het afsluitend examen van diens opleiding buiten Nederland aan Onze Minister en dient daarbij een aanvraag in tot
      omzetting van de prestatiebeurs. Op het gewaarmerkt bewijs vermeldt de instelling de datum waarop het examen met
      goed gevolg is afgesloten.

      2 De omzetting, bedoeld in het eerste lid vindt plaats uiterlijk per 1 januari van het kalenderjaar volgend op de
      aanvraag. Zo spoedig mogelijk na de omzetting stelt Onze Minister de student daarvan in kennis.

      3 Tot een bij koninklijk besluit te bepalen tijdstip wordt in het eerste lid voor «buiten Nederland» gelezen
      «buiten het Europese deel van Nederland».
    url: https://wetten.overheid.nl/BWBR0028393/2026-01-01#Artikel3.5
  - number: '3.6'
    text: |-
      1 Een student aan vergelijkbaar beroepsonderwijs of hoger onderwijs verstrekt jaarlijks binnen een door Onze
      Minister te bepalen termijn aan Onze Minister een gewaarmerkt afschrift van het bewijs waaruit blijkt voor welke
      maanden van het desbetreffende studiejaar hij is ingeschreven voor de opleiding waarvoor hij studiefinanciering BES
      heeft aangevraagd of geniet.

      2 Indien de opleiding geen bewijs van inschrijving verstrekt, maakt de student op een ander wijze aannemelijk dat
      hij staat ingeschreven voor de desbetreffende opleiding.
    url: https://wetten.overheid.nl/BWBR0028393/2026-01-01#Artikel3.6
  - number: '3.7'
    text: |-
      Indien noodzakelijk kunnen in afwijking van het in dit hoofdstuk bepaalde bij ministeriële regeling regels worden
      vastgesteld ten behoeve van een goede uitvoering van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0028393/2026-01-01#Artikel3.7
  - number: '4.1'
    text: |-
      1 In dit hoofdstuk wordt verstaan onder:

      **minimumloon**: het bij of krachtens de [Wet minimumlonen BES][ref1] geldende minimum maandloon, bedoeld
      in [artikel 8, eerste lid, van die wet][ref2], vermenigvuldigd met 12, waarbij voor het aantal gewerkte uren
      wordt gelezen 40 en waarbij voor het minimumuurloon wordt gelezen het hoogste in het peiljaar geldende bruto
      minimumuurloon,

      **peiljaar**: het tweede jaar voorafgaand aan het jaar waarvoor de draagkracht in de zin van hoofdstuk 4 wordt
      vastgesteld,

      **toetsingsinkomen**: het belastbaar inkomen, bedoeld in [artikel 3 van de Wet inkomstenbelasting BES][ref3].

      2 In dit hoofdstuk wordt onder lening mede verstaan de prestatiebeurs.


      [ref1]: https://wetten.overheid.nl/BWBR0028170
      [ref2]: https://wetten.overheid.nl/BWBR0028170#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0029281#Artikel3
    url: https://wetten.overheid.nl/BWBR0028393/2026-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0028170
      - id: ref2
        bwb_id: BWBR0028170
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0029281
        artikel: '3'
  - number: '4.2'
    text: |-
      Ontvangst van een lening of omzetting in een lening, of omzetting als bedoeld in [artikel 4.13][ref1], verplicht
      degene die studiefinanciering BES of een opstarttoelage heeft ontvangen tot terugbetaling van de lening vermeerderd
      met de volgens dit hoofdstuk berekende rente.


      [ref1]: https://wetten.overheid.nl/BWBR0028393#Artikel4.13
    url: https://wetten.overheid.nl/BWBR0028393/2026-01-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0028393
        artikel: '4.13'
        hoofdstuk: '4'
  - number: '4.3'
    text: |-
      Onze Minister stelt jaarlijks uiterlijk in december een rentepercentage vast dat gelijk is aan het gemiddeld
      effectief rendement over de maand september van dat jaar van de openbare lening, uitgegeven door de Staat der
      Nederlanden en toegelaten tot de notering aan de officiële markt ter beurze van Amsterdam, met een gemiddelde
      resterende looptijd van 3 tot 5 jaren. Het rentepercentage wordt vastgesteld op nul indien deze overeenkomstig de
      eerste volzin minder dan nul procent bedraagt.
    url: https://wetten.overheid.nl/BWBR0028393/2026-01-01#Artikel4.3
  - number: '4.4'
    text: |-
      1 Over de aangegane leningen is, voor zover het niet betreft achterstallige schuld als bedoeld in
      [artikel 4.8][ref1], rente verschuldigd overeenkomstig het tweede en derde lid. De renteberekening gaat in op
      de eerste dag van de maand die volgt op de dag waarop het bedrag aan lening bij de verstrekker van die lening is
      afgeschreven.

      2 De rente over de leningen wordt berekend per dag op basis van samengestelde interest en wordt bijgeschreven bij
      de hoofdsom.

      3 Bij de berekening van de rente, bedoeld in het eerste en tweede lid, wordt voor elk kalenderjaar het
      rentepercentage gehanteerd dat in het voorafgaande jaar op grond van [artikel 4.3][ref2] is vastgesteld.

      4 Voor de berekening van de rente op de voet van het tweede lid wordt een maand gesteld op 30 dagen en een jaar
      gesteld op 360 dagen.

      5 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het tweede tot en met
      het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028393#Artikel4.8
      [ref2]: https://wetten.overheid.nl/BWBR0028393#Artikel4.3
    url: https://wetten.overheid.nl/BWBR0028393/2026-01-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0028393
        artikel: '4.8'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0028393
        artikel: '4.3'
        hoofdstuk: '4'
  - number: '4.5'
    text: |-
      1 De terugbetalingsperiode van de studiefinanciering BES vangt aan op 1 januari van het jaar volgend op het jaar
      waarin iemand is opgehouden studiefinanciering BES te genieten.

      2 De terugbetalingsperiode van de opstarttoelage vangt aan op 1 januari van het jaar volgend op het tijdstip van
      beëindiging van de aanspraak op studiefinanciering op grond van de [WSF 2000][ref1].

      3 De terugbetalingsperiode bestaat uit een aanloopfase en een aflosfase.


      [ref1]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0028393/2026-01-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0011453
  - number: '4.6'
    text: |-
      1 De aanloopfase beslaat de eerste 2 kalenderjaren na aanvang van de terugbetalingsperiode.

      2 Gedurende de aanloopfase bestaat geen verplichting tot terugbetaling.
    url: https://wetten.overheid.nl/BWBR0028393/2026-01-01#Artikel4.6
  - number: '4.7'
    text: |-
      1 De aflosfase beslaat behoudens toepassing van [artikel 4.9, derde lid][ref1], 15 kalenderjaren volgend op de
      aanloopfase. Deze periode wordt verlengd met het aantal maanden dat gebruik is gemaakt van de aflosvrije periode op
      grond van het tweede lid.

      2 Op aanvraag van de debiteur wordt de terugbetaling voor ten hoogste 5 kalenderjaren opgeschort.

      3 Bij ministeriële regeling kunnen voorschriften worden vastgesteld met betrekking tot de opschorting, bedoeld in
      het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028393#Artikel4.9
    url: https://wetten.overheid.nl/BWBR0028393/2026-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0028393
        artikel: '4.9'
        hoofdstuk: '4'
  - number: '4.8'
    text: |-
      1 Onder achterstallige schuld wordt verstaan het bedrag van de verplichte terugbetaling uit hoofde van dit
      hoofdstuk dat 2 weken na de vervaldatum nog niet is ontvangen.

      2 Over de achterstallige schuld is rente verschuldigd. Als rentepercentage wordt het percentage van de wettelijke
      rente gehanteerd. Deze rente wordt berekend per dag op basis van samengesteld interest, waarbij een maand wordt
      gesteld op 30 dagen en een jaar wordt gesteld op 360 dagen.

      3 Indien de debiteur achterstallig is bij de betaling wordt met deze achterstallige schuld bij de duur van de
      aflosfase, bedoeld in [artikel 4.7][ref1], bij de vaststelling van de termijnbetaling, alsmede bij het tenietgaan
      van de schuld, bedoeld in [artikel 4.12, eerste lid][ref2], geen rekening gehouden.

      4 [Artikel 4.4][ref3] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028393#Artikel4.7
      [ref2]: https://wetten.overheid.nl/BWBR0028393#Artikel4.12
      [ref3]: https://wetten.overheid.nl/BWBR0028393#Artikel4.4
