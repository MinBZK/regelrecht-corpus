  - number: '9.4'
    text: |-
      Tot een bij [koninklijk besluit][ref1] te bepalen tijdstip wordt de prestatiebeurs hoger onderwijs
      voor een ho-student die met goed gevolg een associate degree-opleiding heeft afgerond, in afwijking van
      [artikel 3.2, eerste lid][ref2], uitsluitend omgezet in een gift voor zover de ho-student een aanvraag heeft
      ingediend tot gelijkstelling, overeenkomstig artikel 3.2, vierde lid, zoals dat luidde voor het tijdstip voor
      inwerkingtreding van de [Wet invoering associate degree-opleiding][ref3].


