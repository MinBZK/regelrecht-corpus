  - number: '1.7'
    text: |-
      Onze Minister gebruikt het persoonsgebonden nummer BES van een student of debiteur ter zake van de uitvoering van
      deze wet slechts:

      a. in contacten met die student of debiteur, en

      b. in contacten met personen en instanties voor zover deze zelf gemachtigd zijn tot het opnemen van het
      persoonsgebonden nummer BES in een persoonsregistratie.
    url: https://wetten.overheid.nl/BWBR0028393/2026-01-01#Artikel1.7
  - number: '1.8'
    text: |-
      Een minderjarige is bekwaam de rechtshandelingen te verrichten die noodzakelijk zijn om studiefinanciering BES
      en de opstarttoelage te verkrijgen. Hij is voorts bekwaam de rechtshandelingen te verrichten die noodzakelijk
      zijn met betrekking tot de uitoefening, onderscheidenlijk de nakoming van de voor hem uit de toekenning van
      studiefinanciering BES en de opstarttoelage voortvloeiende rechten en verplichtingen.
    url: https://wetten.overheid.nl/BWBR0028393/2026-01-01#Artikel1.8
  - number: '2.1'
    text: |-
      1 Studiefinanciering BES en opstarttoelage bestaan uit een prestatiebeurs, een lening of beide, dan wel uit een
      gift.

      2 De bedragen inzake de studiefinanciering BES zijn afhankelijk van het onderwijstype en de plaats van de
      opleiding.

      3 De bedragen zijn opgenomen in [artikel 2.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028393#Artikel2.2
