        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0028393
        artikel: '4.9'
        hoofdstuk: '4'
  - number: '8.2'
    text: |-
      1 Studiefinanciering BES en opstarttoelage zijn niet vatbaar voor vervreemding, verpanding, belening en beslag,
      waaronder begrepen beslag ingevolge faillissement.

      2 Elk beding, strijdig met dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0028393/2026-01-01#Artikel8.2
  - number: '8.3'
    text: |-
      Onze Minister kan voor bepaalde gevallen de wet en de daarop berustende bepalingen buiten toepassing laten of
      daarvan afwijken voor zover toepassing gelet op het belang dat deze wet beoogt te beschermen, zal leiden tot een
      onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0028393/2026-01-01#Artikel8.3
  - number: 8.3a
    text: |-
      1 De bekendmaking van een beschikking geschiedt door toezending of uitreiking aan de belanghebbende.

      2 Indien de bekendmaking van de beschikking niet kan geschieden op de wijze als voorzien in het eerste lid,
      geschiedt zij op een andere geschikte wijze.

      3 De beschikking vermeldt de dagtekening van de beslissing, de gronden waarop deze berust, alsmede waar beroep kan
      worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0028393/2026-01-01#Artikel8.3a
  - number: '8.4'
    text: |-
      1 De [artikelen 64 tot en met 67 van de Wet administratieve rechtspraak BES][ref1] zijn niet van toepassing.

      2 Bij een beroep tegen een beschikking op grond van [artikel 2.10a][ref2] is artikel
      [23, eerste lid, laatste zin, van de Wet administratieve rechtspraak BES][ref3] niet van toepassing.

      3 Bij een bestuurlijke heroverweging van een beschikking op grond van [artikel 2.10a][ref4] is
      [artikel 24, eerste en tweede lid, van de Wet administratieve rechtspraak BES][ref5] van overeenkomstige
      toepassing.

      4 Met betrekking tot een beschikking op grond van [artikel 2.10a][ref6], kan het Gerecht, bedoeld in
      [artikel 1, eerste lid, onderdeel b, van de Wet administratieve rechtspraak BES][ref7], indien het bestuursorgaan
      niet voldoet aan de verplichting, bedoeld in [artikel 23 van de Wet administratieve rechtspraak BES][ref8], daaruit
      de gevolgtrekking maken die hem geraden voorkomt.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0028393#Artikel2.10a
