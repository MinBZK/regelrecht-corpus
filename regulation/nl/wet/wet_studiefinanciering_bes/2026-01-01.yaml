  - number: '1.2'
    text: |-
      Voor de toepassing van het bepaalde bij of krachtens deze wet is bepalend de toestand op de eerste dag van de
      maand, tenzij anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0028393/2026-01-01#Artikel1.2
  - number: '1.3'
    text: |-
      Deze wet regelt de studiefinanciering BES en de opstarttoelage en is van toepassing op studenten die voldoen aan de
      voorwaarden inzake:

      a. nationaliteit of woonplaats als bedoeld in [artikel 1.4][ref1],

      b. leeftijd als bedoeld in [artikel 1.5][ref2], en

      c. onderwijssoort als bedoeld in [paragraaf 2.5][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028393#Artikel1.4
      [ref2]: https://wetten.overheid.nl/BWBR0028393#Artikel1.5
      [ref3]: https://wetten.overheid.nl/BWBR0028393#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0028393/2026-01-01#Artikel1.3
    references:
