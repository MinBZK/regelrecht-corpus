        bwb_id: BWBR0028393
        artikel: '7.5'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref2
        bwb_id: BWBR0028393
        artikel: '7.6'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: '8.1'
    text: |-
      1 Per 1 januari van ieder kalenderjaar vervangt Onze Minister de bedragen, bedoeld in [artikel 2.2][ref1], bij
      ministeriële regeling door andere bedragen. Deze bedragen worden berekend aan de hand van de consumentenprijsindex
      in het tweede daaraan voorafgaande kalenderjaar.

      2 Hetgeen onder consumentenprijsindex als bedoeld in het eerste lid wordt verstaan, wordt nader vastgesteld bij
      ministeriële regeling.

      3 Op een bij of krachtens algemene maatregel van bestuur te bepalen wijze kan bij ministeriële regeling het bedrag,
      genoemd in [artikel 4.9, derde lid][ref2], gelet op de loonontwikkeling worden gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0028393#Artikel2.2
      [ref2]: https://wetten.overheid.nl/BWBR0028393#Artikel4.9
    url: https://wetten.overheid.nl/BWBR0028393/2026-01-01#Artikel8.1
    references:
