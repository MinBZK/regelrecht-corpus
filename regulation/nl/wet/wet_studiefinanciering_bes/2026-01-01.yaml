        paragraaf: '2.5'
  - number: '1.4'
    text: |-
      Voor studiefinanciering BES en een opstarttoelage kan een student in aanmerking komen die in de periode van drie
      maanden voorafgaand aan het studiejaar waarop de aanvraag betrekking heeft woonplaats had in een openbaar lichaam
      en:

      a. de Nederlandse nationaliteit bezit; of

      b. voorafgaand aan dat studiejaar ten minste tien jaar, al dan niet aaneengesloten, in een openbaar lichaam heeft
      gewoond.
    url: https://wetten.overheid.nl/BWBR0028393/2026-01-01#Artikel1.4
  - number: '1.5'
    text: |-
      1 Voor de opstarttoelage kan in aanmerking komen degene die aanspraak heeft op studiefinanciering als bedoeld in
      [artikel 3.1, eerste of tweede lid, van de WSF 2000][ref1], met uitzondering van de mbo-student die op grond van
      [artikel 2.3, eerste lid, van de WSF 2000][ref2] uitsluitend in aanmerking komt voor een reisvoorziening.

      2 Voor studiefinanciering BES en de opstarttoelage kan een student in aanmerking komen tot en met de maand waarin
      hij de leeftijd van 30 jaren heeft bereikt.

      3 In afwijking van het tweede lid behoudt een student bij het bereiken van de leeftijd van 30 jaren zijn aanspraak
      zolang hij zonder onderbreking studiefinanciering BES geniet.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3.1
      [ref2]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0028393/2026-01-01#Artikel1.5
