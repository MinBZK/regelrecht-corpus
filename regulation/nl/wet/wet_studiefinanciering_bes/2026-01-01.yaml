  - number: '4.9'
    text: |-
      1 Rente en aflossing van de leningen vervallen gedurende de aflosfase in vaste maandelijkse termijnen.

      2 De hoogte van de maandelijkse termijnbetalingen wordt op basis van het aantal maanden van de aflosfase
      onderscheidenlijk het nog resterende aantal maanden van de aflosfase tot gelijke bedragen vastgesteld bij de
      aanvang van ieder jaar van de aflosfase.

      3 Onverminderd toepassing van [artikel 4.10][ref1] bedraagt het totaal per jaar te betalen bedrag aan maandelijkse
      termijnbetalingen ten minste USD 545.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld voor de vaststelling en betaling van de
      termijnbetalingen. Hierbij kan tevens worden bepaald dat betaling geschiedt door middel van een daartoe verleende
      doorlopende machtiging om het verschuldigde bedrag maandelijks te doen afschrijven van een bankrekening.


      [ref1]: https://wetten.overheid.nl/BWBR0028393#Artikel4.10
    url: https://wetten.overheid.nl/BWBR0028393/2026-01-01#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0028393
        artikel: '4.10'
        hoofdstuk: '4'
  - number: 4.9a
    text: |-
      1 De debiteur is bevoegd om bovenop de termijnbetalingen kosteloos extra aflossingen te doen.

      2 Bij ministeriële regeling kunnen over de aflossing, genoemd in het eerste lid, regels worden gesteld met
      betrekking tot onder meer:

      a. de wijze waarop extra aflossingen kunnen worden gedaan;

      b. de goede uitvoering van versnelde aflossingen.
    url: https://wetten.overheid.nl/BWBR0028393/2026-01-01#Artikel4.9a
  - number: '4.10'
    text: |-
      1 Indien de debiteur niet in staat is de vastgestelde termijnbetaling te voldoen, kan hij gedurende de aflosfase
      een aanvraag indienen om zijn draagkracht vast te stellen voor de resterende aflosfase.

      2 De draagkracht van de debiteur is zijn draagkracht uit inkomen.

      3 Bij ministeriële regeling kunnen voorschriften worden vastgesteld met betrekking tot de aanvraag en de beslissing
      op de aanvraag, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028393/2026-01-01#Artikel4.10
  - number: '4.11'
    text: |-
      1 Maatstaf voor de vaststelling van de draagkracht van de debiteur is het totaal van zijn toetsingsinkomen in het
      peiljaar. Het aldus bepaalde inkomen is het draagkrachtinkomen.

      2 Op het draagkrachtinkomen wordt in mindering gebracht de draagkrachtvrije voet. Deze voet is gelijk aan 84% van
      het minimumloon.

      3 De draagkracht van de debiteur uit inkomen is 12% van het inkomen boven de draagkrachtvrije voet.

      4 Indien het bedrag van de draagkracht lager is dan het bedrag van de vastgestelde termijnbetaling betaalt de
      debiteur, in afwijking van dat artikel, het bedrag van zijn draagkracht.

      5 Voor de toepassing van dit artikel, wordt indien het toetsingsinkomen in het peiljaar, nog niet bekend is, door
      Onze Minister daarvoor in de plaats gesteld een bedrag dat het vast te stellen toetsingsinkomen benadert.

      6 Het vierde lid is niet van toepassing indien het voor Onze Minister niet mogelijk is op grond van het vijfde lid
      bij benadering een bedrag vast te stellen.
    url: https://wetten.overheid.nl/BWBR0028393/2026-01-01#Artikel4.11
  - number: '4.12'
    text: |-
      1 De schuld die resteert bij het einde van de aflosfase, gaat op dat ogenblik teniet.

      2 De schuld die resteert bij het overlijden van de debiteur, gaat op dat ogenblik teniet.
    url: https://wetten.overheid.nl/BWBR0028393/2026-01-01#Artikel4.12
  - number: '4.13'
    text: |-
      1 Op het ogenblik van beëindiging van het recht op studiefinanciering BES van een student wordt zijn schuld,
      ontstaan in het kader van de toepassing van deze wet, van rechtswege omgezet in een lening. Op het ogenblik van
      beëindiging van het recht op studiefinanciering op grond van de [WSF 2000][ref1] wordt de schuld van een student
      met betrekking tot de opstarttoelage van rechtswege omgezet in een lening.

      2 Indien na beëindiging van het recht op studiefinanciering BES of studiefinanciering op grond van de
      [WSF 2000][ref2] door een beschikking op grond van [artikel 5.1][ref3] een vordering ontstaat van Onze Minister,
      wordt die vordering omgezet in een lening op de eerste dag van de maand na de herziening. Bij de berekening
      van de rente voor die vordering wordt het rentepercentage gehanteerd dat geldt met ingang van 1 januari volgend
      op het kalenderjaar waarin de student is opgehouden studiefinanciering BES of studiefinanciering op grond
      van de WSF 2000 te genieten. Indien de omzetting plaatsvindt in het kalenderjaar waarin de student ophoudt
      student te zijn, wordt het rentepercentage gehanteerd dat geldt met ingang van 1 januari van dat kalenderjaar.
      [Artikel 4.4, derde lid][ref4], is bij de berekening van rente van overeenkomstige toepassing.

      3 De in het eerste of tweede lid bedoelde lening wordt rentedragend met ingang van het tijdstip van de daar
      bedoelde omzetting.


      [ref1]: https://wetten.overheid.nl/BWBR0011453
      [ref2]: https://wetten.overheid.nl/BWBR0011453
      [ref3]: https://wetten.overheid.nl/BWBR0028393#Artikel5.1
      [ref4]: https://wetten.overheid.nl/BWBR0028393#Artikel4.4
