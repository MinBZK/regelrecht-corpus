$id: regeling_vluchtuitvoering
regulatory_layer: WET
publication_date: '2025-02-12'
valid_from: '2025-02-13'
bwb_id: BWBR0024167
url: https://wetten.overheid.nl/BWBR0024167/2025-02-13
preamble:
  text: |-
    Gelet op:

    Bijlage 6 bij het Verdrag inzake de internationale burgerluchtvaart;

    De artikelen 2.10, eerste lid, en 4.8 van de Wet luchtvaart;

    De artikelen 5, 6, tweede lid, en 7, eerste lid, van het Besluit vluchtuitvoering;

    Artikel 159, eerste lid, van de Regeling Toezicht Luchtvaart;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *Deel-ARO:* deel betreffende eisen voor autoriteiten organisaties
      betreffende vluchtuitvoeringen, bijlage II bij [verordening 965/2012](32012R0965);
        - *Deel-ORO:* deel betreffende eisen voor organisaties met betrekking tot vluchtuitvoeringen, bijlage III bij
      [verordening 965/2012](32012R0965);
        - *Deel-SPA:* deel betreffende specifieke goedkeuringen, bijlage V bij [verordening 965/2012](32012R0965);
        - *Deel-SPO:* deel betreffende gespecialiseerde vluchtuitvoeringen, bijlage VIII bij [verordening 965/2012]
      (32012R0965);
        - *taakuitvoering in de Kustwacht:* taakuitvoering in de Kustwacht als bedoeld in
      [artikel 1 van de Regeling organisatie Kustwacht Nederland][ref1] of taakuitvoering in de Kustwacht als bedoeld in
      __REF001___________________________________________________________________________________________________________
      _______________________________;
        - *verdrag:* het op 7 december 1944 te Chicago tot stand gekomen Verdrag inzake de internationale burgerluchtvaart
      (Trb. 1973, 109);
        - *verordening 965/2012:* [Verordening (EU) Nr. 965/2012](32012R0965) van de Commissie van 5 oktober 2012 tot
      vaststelling van technische eisen en administratieve procedures voor vluchtuitvoering, overeenkomstig [Verordening
      (EG) nr. 216/2008](32008R0216) van het Europees Parlement en de Raad (PbEU 2012, L 296).


      [ref1]: https://wetten.overheid.nl/BWBR0042251#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0023731#Artikel2
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0042251
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0023731
        artikel: '2'
  - number: '2'
    text: |-
      Deze paragraaf is van toepassing op luchtwerk tegen vergoeding en op een vlucht niet tegen vergoeding met
      uitzondering van:
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel2
  - number: 2.a
    text: luchtwerk met een RPA tegen vergoeding;
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel2
  - number: 2.b
    text: een vlucht met een RPA niet tegen vergoeding;
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel2
  - number: 2.c
    text: |-
      luchtwerk als bedoeld in [paragraaf 2a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024167#Paragraaf2a
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0024167
        paragraaf: 2a
  - number: '3.1'
    text: |-
      Een vlucht met een vliegtuig of een helikopter wordt uitgevoerd met inachtneming van de volgende onderdelen van
      bijlage 6 bij het verdrag:
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel3
  - number: 3.1.a
    text: 'in geval van een vliegtuig: de voorschriften van deel II en aanbeveling 3.5 van deel II;'
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel3
  - number: 3.1.b
    text: 'in geval van een helikopter: de voorschriften van deel III, sectie III, en aanbeveling 1.1.5 van die sectie.'
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel3
  - number: '3.2'
    text: |-
      Deel II en sectie III van deel III van bijlage 6 bij het verdrag zijn opgenomen in de bijlage bij deze regeling
      en liggen ter inzage bij de Hoofddirectie Bestuurlijke en Juridische Zaken van het Ministerie van Infrastructuur
      en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel3
  - number: '3.3'
    text: |-
      Een vlucht met een vliegtuig of een helikopter wordt slechts uitgevoerd indien voor iedere persoon van zes jaar of
      ouder een zit- of ligplaats aanwezig is.
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel3
  - number: '4.1'
    text: |-
      De gezagvoerder van een vliegtuig of helikopter zorgt ervoor dat tijdens of dadelijk na afloop van de vlucht een
      journaal wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel4
  - number: '4.2'
    text: 'Het journaal vermeldt ten minste:'
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel4
  - number: 4.2.a
    text: de datum, de plaats en het tijdstip van aanvang en einde van de vlucht;
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel4
  - number: 4.2.b
    text: de duur van de vlucht;
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel4
  - number: 4.2.c
    text: de aard van de vlucht;
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel4
  - number: 4.2.d
    text: de naam en taak van elk lid van het boordpersoneel;
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel4
  - number: 4.2.e
    text: |-
      technische storingen, opgelopen schade en verrichte herstellingen die tijdens de vlucht zijn voorgekomen,
      respectievelijk zijn uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel4
  - number: 4.2.f
    text: ongevallen, bijzondere voorvallen en overschrijding van de gestelde gebruiksgrenzen die zich hebben voorgedaan.
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel4
  - number: '5'
    text: |-
      De door de gezagvoerder mee te voeren documenten, bedoeld in [artikel 4.8 van de wet][ref1], zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel4
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '4'
  - number: 5.a
    text: |-
      het bewijs van inschrijving, bedoeld in [artikel 3.5 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
  - number: 5.b
    text: |-
      het bewijs van luchtwaardigheid, bedoeld in [artikel 3.8 van de wet][ref1], behoudens in gevallen als bedoeld in
      [artikel 3.21 van de wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '3'
  - number: 5.c
    text: het vlieghandboek;
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel5
  - number: 5.d
    text: |-
      het bewijs van bevoegdheid of bewijs van gelijkstelling, bedoeld in [artikel 2.1 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
  - number: 5.e
    text: |-
      het journaal, bedoeld in [artikel 4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0024167#Artikel4
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0024167
        artikel: '4'
        paragraaf: '2'
  - number: 5.f
    text: |-
      indien van toepassing: het geluidscertificaat of de geluidsverklaring, bedoeld in [artikel 3.19a van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
  - number: 5.g
    text: |-
      indien het luchtvaartuig is uitgerust met vast ingebouwde radioapparatuur: de vergunning voor gebruik van
      frequentieruimte, bedoeld in [artikel 3.13 van de Telecommunicatiewet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
  - number: 5.h
    text: 'bij een internationale vlucht:'
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel5
  - number: 5.h.1°
    text: |-
      een exemplaar van het laatste voor het betrokken luchtvaartuig opgestelde certificaat, bedoeld in
      [artikel 39 van de Regeling nationale veiligheidsvoorschriften luchtvaartuigen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0043696#Artikel39
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0043696
        artikel: '39'
  - number: 5.h.2°
    text: |-
      indien het luchtvaartuig lading vervoert: een manifest en een gespecificeerde verklaring omtrent de lading als
      bedoeld in artikel 29 van het verdrag;
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel5
  - number: 5.h.3°
    text: |-
      indien het luchtvaartuig gevaarlijke stoffen vervoert: de NOTOC, bedoeld in de Regeling meldings- en
      informatieplicht vervoer gevaarlijke stoffen door de lucht.
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel5
  - number: '6'
    text: |-
      Een vlucht met een vliegtuig waarvan de maximale startmassa meer dan 5700 kg bedraagt, wordt slechts uitgevoerd
      indien het cockpitpersoneel bestaat uit ten minste een eerste en een tweede bestuurder.
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel6
  - number: 6a.1
    text: |-
      Deze paragraaf is van toepassing op de taakuitvoering in de Kustwacht voor zover uitgevoerd binnen het relevante
      geografische werkgebied als bedoeld in artikel 5 Regeling organisatie Kustwacht Nederland, artikel 3 Regeling
      inzake de SAR-dienst 1994 en artikel 3 van de Rijkswet Kustwacht voor Aruba, Curaçao en Sint Maarten alsmede voor
      de openbare lichamen Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel6a
  - number: 6a.2
    text: |-
      Luchtwerk met een vliegtuig of helikopter ten behoeve van de taakuitvoering in de Kustwacht wordt door een
      exploitant uitgevoerd met inachtneming van de volgende overeenkomstig van toepassing zijnde voorwaarden van
      [verordening 965/2012](32012R0965):
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel6a
  - number: 6a.2.a
    text: Bijlage I;
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel6a
  - number: 6a.2.b
    text: |-
      Deel-ARO (bijlage II), subdeel GEN, sectie III, met dien verstande dat onderdeel ARO.GEN.345 niet van toepassing
      is en onder ‘exploitant’ telkens moet worden verstaan: een organisatie die bij de bevoegde autoriteit een eigen
      verklaring over haar activiteiten indient;
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel6a
  - number: 6a.2.c
    text: 'Deel-ORO (bijlage III) met dien verstande dat niet van toepassing zijn:'
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel6a
  - number: 6a.2.c.1°
    text: onderdeel ORO.SPO.100, subonderdeel b;
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel6a
  - number: 6a.2.c.2°
    text: subdeel DEC;
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel6a
  - number: 6a.2.c.3°
    text: subdeel SEC;
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel6a
  - number: 6a.2.c.4°
    text: subdeel CC; en
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel6a
  - number: 6a.2.c.5°
    text: subdeel FTL; en
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel6a
  - number: 6a.2.d
    text: |-
      Bemanningsleden, niet zijnde cockpitbemanning, voldoen ten behoeve van de taakuitvoering in de Kustwacht aan
      subdeel TC van Deel-ORO (bijlage III);
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel6a
  - number: 6a.2.e
    text: Deel-SPO (bijlage VIII), met dien verstande dat onderdeel SPO.GEN.005 niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel6a
  - number: 6a.3
    text: |-
      Indien de exploitant beschikt over een relevante, specifieke goedkeuring ingevolge Deel-SPA (bijlage V) van
      [verordening 965/2012](32012R0965), is het de exploitant toegestaan om, overeenkomstig de voorwaarden en procedures
      van die specifieke goedkeuring, ten behoeve van de taakuitvoering in de Kustwacht,
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel6a
  - number: 6a.3.a
    text: 'vliegtuigen en helikopters te gebruiken voor:'
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel6a
  - number: 6a.3.a.1°
    text: activiteiten op basis van performance-based navigation (PBN);
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel6a
  - number: 6a.3.a.2°
    text: |-
      activiteiten overeenkomstig minimumprestatiespecificaties op het gebied van navigatie (minimum navigation
      performance specifications, MNPS);
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel6a
  - number: 6a.3.a.3°
    text: |-
      activiteiten in een gedeelte van het luchtruim met verminderde verticale separatieminima (reduced vertical
      separation minima, RVSM); en
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel6a
  - number: 6a.3.a.4°
    text: activiteiten bij slecht zicht (LVO’s) of vluchtuitvoeringen met operationele credits;
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel6a
  - number: 6a.3.b
    text: vliegtuigen en helikopters gebruiken voor het vervoer van gevaarlijke goederen (DG);
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel6a
  - number: 6a.3.c
    text: helikoptervluchten uitvoeren met behulp van nachtzichtapparatuur (night vision imaging systems, NVIS); en
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel6a
  - number: 6a.3.d
    text: helikopters gebruiken voor offshore-vluchtuitvoeringen (HOFO).
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel6a
  - number: '7'
    text: |-
      Een vlucht met een vrije ballon tegen vergoeding wordt uitgevoerd met inachtneming van een vaarthandboek, dat de
      aanwijzingen en informatie bevat die de bij de vluchtuitvoering betrokken personen nodig hebben om hun taken te
      kunnen uitvoeren. Het vaarthandboek bevat ten minste:
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel7
  - number: 7.a
    text: |-
      de instructies die de verantwoordelijkheid van de bij de vluchtuitvoering betrokken personen in hoofdlijnen
      aangeven;
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel7
  - number: 7.b
    text: de samenstelling van het boordpersoneel, waarbij tevens de opvolging in de gezagvoering is geregeld;
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel7
  - number: 7.c
    text: de taken van de leden van het boordpersoneel bij een noodtoestand tijdens een vlucht en de te volgen procedure;
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel7
  - number: 7.d
    text: |-
      de weerminima voor elke soort vlucht, waaraan de voorspelde en de feitelijke weersomstandigheden moeten voldoen,
      alvorens een vlucht te mogen aanvangen;
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel7
  - number: 7.e
    text: de wijze waarop de gegevens van de weersomstandigheden, bedoeld onder d, worden vergaard;
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel7
  - number: 7.f
    text: een opsomming van de mee te voeren uitrusting;
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel7
  - number: 7.g
    text: instructies voor het bepalen van de mee te voeren hoeveelheid brandstof;
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel7
  - number: 7.h
    text: de wijze waarop de bekwaamheid van de leden van het boordpersoneel wordt vastgesteld;
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel7
  - number: 7.i
    text: |-
      de beschrijving van een controlesysteem dat voor de start, tijdens de vlucht, bij de landing en in noodgevallen
      wordt gebruikt om te waarborgen dat de aanwijzingen van het vaarthandboek en van de fabrikant van de ballon worden
      opgevolgd.
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel7
  - number: '8.1'
    text: |-
      De gezagvoerder zorgt ervoor dat tijdens of dadelijk na afloop van een vlucht met een vrije ballon tegen vergoeding
      een journaal wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel8
  - number: '8.2'
    text: 'Het journaal vermeldt:'
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel8
  - number: 8.2.a
    text: |-
      de in [artikel 4, tweede lid][ref1], bedoelde gegevens;


      [ref1]: https://wetten.overheid.nl/BWBR0024167#Artikel4
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0024167
        artikel: '4'
        paragraaf: '2'
  - number: 8.2.b
    text: de meteorologische invloeden die de navigatie hebben bemoeilijkt.
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel8
  - number: '8.3'
    text: Het journaal wordt ten minste drie maanden bewaard.
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel8
  - number: '9'
    text: |-
      [Artikel 5][ref1] is van overeenkomstige toepassing op een vlucht met een vrije ballon tegen vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0024167#Artikel5
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0024167
        artikel: '5'
        paragraaf: '2'
  - number: '11'
    text: |-
      Deze regeling gaat voor de vluchtuitvoering met Nederlandse luchtvaartuigen buiten het vluchtinformatiegebied
      Amsterdam ten behoeve van de taakuitvoering in de Kustwacht gelden per 1 juli 2025.
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel11
  - number: '12'
    text: 'De volgende regelingen worden ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel12
  - number: 12.a
    text: |-
      [Regeling boorddocumenten luchtvaart][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018245
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0018245
  - number: 12.b
    text: |-
      [Tarievenregeling][ref1].

      [ref1]: https://wetten.overheid.nl/BWBR0005818
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005818
  - number: '13'
    text: |-
      Deze regeling treedt in werking op het tijdstip waarop het [Besluit vluchtuitvoering][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0020111
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020111
  - number: '14'
    text: 'Deze regeling wordt aangehaald als: Regeling vluchtuitvoering.'
    url: https://wetten.overheid.nl/BWBR0024167/2025-02-13#Artikel14
