  - number: '6'
    text: |-
      Een vlucht met een vliegtuig waarvan de maximale startmassa meer dan 5700 kg bedraagt, wordt slechts uitgevoerd
      indien het cockpitpersoneel bestaat uit ten minste een eerste en een tweede bestuurder.
    url: https://wetten.overheid.nl/BWBR0024167/2015-07-01#Artikel6
  - number: '7'
    text: |-
      Een vlucht met een vrije ballon tegen vergoeding wordt uitgevoerd met inachtneming van een vaarthandboek, dat de
      aanwijzingen en informatie bevat die de bij de vluchtuitvoering betrokken personen nodig hebben om hun taken te
      kunnen uitvoeren. Het vaarthandboek bevat ten minste:

      a. de instructies die de verantwoordelijkheid van de bij de vluchtuitvoering betrokken personen in hoofdlijnen
      aangeven;

      b. de samenstelling van het boordpersoneel, waarbij tevens de opvolging in de gezagvoering is geregeld;

      c. de taken van de leden van het boordpersoneel bij een noodtoestand tijdens een vlucht en de te volgen procedure;

      d. de weerminima voor elke soort vlucht, waaraan de voorspelde en de feitelijke weersomstandigheden moeten voldoen,
      alvorens een vlucht te mogen aanvangen;

      e. de wijze waarop de gegevens van de weersomstandigheden, bedoeld onder d, worden vergaard;

      f. een opsomming van de mee te voeren uitrusting;

      g. instructies voor het bepalen van de mee te voeren hoeveelheid brandstof;

      h. de wijze waarop de bekwaamheid van de leden van het boordpersoneel wordt vastgesteld;

      i. de beschrijving van een controlesysteem dat voor de start, tijdens de vlucht, bij de landing en in noodgevallen
      wordt gebruikt om te waarborgen dat de aanwijzingen van het vaarthandboek en van de fabrikant van de ballon worden
      opgevolgd.
    url: https://wetten.overheid.nl/BWBR0024167/2015-07-01#Artikel7
  - number: '8'
    text: |-
      1 De gezagvoerder zorgt ervoor dat tijdens of dadelijk na afloop van een vlucht met een vrije ballon tegen
      vergoeding een journaal wordt gehouden.

      2 Het journaal vermeldt:

      a. de in [artikel 4, tweede lid][ref1], bedoelde gegevens;

      b. de meteorologische invloeden die de navigatie hebben bemoeilijkt.

      3 Het journaal wordt ten minste drie maanden bewaard.


