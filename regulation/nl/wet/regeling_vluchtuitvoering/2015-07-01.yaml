  text: |-
    Gelet op:

    Bijlage 6 bij het Verdrag inzake de internationale burgerluchtvaart;

    De artikelen 2.10, eerste lid, en 4.8 van de Wet luchtvaart;

    De artikelen 5, 6, tweede lid, en 7, eerste lid, van het Besluit vluchtuitvoering;

    Artikel 159, eerste lid, van de Regeling Toezicht Luchtvaart;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0024167/2015-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder verdrag: het op 7 december 1944 te Chicago tot stand gekomen Verdrag inzake
      de internationale burgerluchtvaart (Trb. 1973, 109).
    url: https://wetten.overheid.nl/BWBR0024167/2015-07-01#Artikel1
  - number: '2'
    text: |-
      Deze paragraaf is van toepassing op luchtwerk anders dan met een RPA tegen vergoeding en op een vlucht anders dan
      met een RPA niet tegen vergoeding.
    url: https://wetten.overheid.nl/BWBR0024167/2015-07-01#Artikel2
  - number: '3'
    text: |-
      1 Een vlucht met een vliegtuig of een helikopter wordt uitgevoerd met inachtneming van de volgende onderdelen van
      bijlage 6 bij het verdrag:

      a. in geval van een vliegtuig: de voorschriften van deel II en aanbeveling 3.5 van deel II;

      b. in geval van een helikopter: de voorschriften van deel III, sectie III, en aanbeveling 1.1.5 van die sectie.

      2 Deel II en sectie III van deel III van bijlage 6 bij het verdrag zijn opgenomen in de bijlage bij deze regeling.

      3 Een vlucht met een vliegtuig of een helikopter wordt slechts uitgevoerd indien voor iedere persoon van zes jaar
      of ouder een zit- of ligplaats aanwezig is.
    url: https://wetten.overheid.nl/BWBR0024167/2015-07-01#Artikel3
  - number: '4'
    text: |-
      1 De gezagvoerder van een vliegtuig of helikopter zorgt ervoor dat tijdens of dadelijk na afloop van de vlucht een
      journaal wordt gehouden.

      2 Het journaal vermeldt ten minste:

      a. de datum, de plaats en het tijdstip van aanvang en einde van de vlucht;

      b. de duur van de vlucht;

      c. de aard van de vlucht;

      d. de naam en taak van elk lid van het boordpersoneel;

      e. technische storingen, opgelopen schade en verrichte herstellingen die tijdens de vlucht zijn voorgekomen,
      respectievelijk zijn uitgevoerd;

      f. ongevallen, bijzondere voorvallen en overschrijding van de gestelde gebruiksgrenzen die zich hebben voorgedaan.
    url: https://wetten.overheid.nl/BWBR0024167/2015-07-01#Artikel4
  - number: '5'
    text: |-
      De door de gezagvoerder mee te voeren documenten, bedoeld in [artikel 4.8 van de wet][ref1], zijn:

      a. het bewijs van inschrijving, bedoeld in [artikel 3.5 van de wet][ref2];

      b. het bewijs van luchtwaardigheid, bedoeld in [artikel 3.8 van de wet][ref3], behoudens in gevallen als bedoeld in
      [artikel 3.21 van de wet][ref4];

      c. het vlieghandboek;

      d. het bewijs van bevoegdheid of bewijs van gelijkstelling, bedoeld in [artikel 2.1 van de wet][ref5];

      e. het journaal, bedoeld in [artikel 4][ref6];

      f. indien van toepassing: het geluidscertificaat of de geluidsverklaring, bedoeld in
      [artikel 3.19a van de wet][ref7];

      g. indien het luchtvaartuig is uitgerust met vast ingebouwde radioapparatuur: de vergunning voor gebruik van
      frequentieruimte, bedoeld in [artikel 3.13 van de Telecommunicatiewet][ref8];

      h. bij een internationale vlucht:

      1°. een exemplaar van het laatste voor het betrokken luchtvaartuig opgestelde certificaat, bedoeld in
      [artikel 9 van de Regeling onderhoud luchtvaartuigen][ref9];

      2°. indien het luchtvaartuig lading vervoert: een manifest en een gespecificeerde verklaring omtrent de lading als
      bedoeld in artikel 29 van het verdrag;

      3°. indien het luchtvaartuig gevaarlijke stoffen vervoert: de NOTOC, bedoeld in de Regeling meldings- en
      informatieplicht vervoer gevaarlijke stoffen door de lucht.


