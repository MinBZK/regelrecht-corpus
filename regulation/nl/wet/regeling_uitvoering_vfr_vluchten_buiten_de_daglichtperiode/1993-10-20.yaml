$id: regeling_uitvoering_vfr_vluchten_buiten_de_daglichtperiode
regulatory_layer: WET
publication_date: '2014-12-11'
valid_from: '1993-10-20'
bwb_id: BWBR0006173
url: https://wetten.overheid.nl/BWBR0006173/1993-10-20
preamble:
  text: |-
    Handelend in overeenstemming met de Minister van Defensie;

    Gelet op artikel 44, tweede lid van het Luchtvaartverkeersreglement;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0006173/1993-10-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Gezagvoerders van burgerluchtvaartuigen wordt toestemming verleend om VFR-vluchten, waarbij stoffen ter bevordering
      of ter bescherming van het milieu dan wel de land-, tuin- of bosbouw, te bestemder' plaatse worden uitgeworpen, uit
      te voeren gedurende de vijftien minuten vóór aanvang en vijftien minuten ná einde van de daglichtperiode.
    url: https://wetten.overheid.nl/BWBR0006173/1993-10-20#Artikel1
  - number: '2'
    text: |-
      Het besluit van de Directeur-Generaal van de Rijksluchtvaartdienst van 28 juli 1981, nr. LVB/L 23882/Stcrt. 1981,
      164 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006173/1993-10-20#Artikel2
  - number: '3'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0006173/1993-10-20#Artikel3
  - number: '4'
    text: |-
      Deze regeling wordt aangehaald als:

      Regeling uitvoering VFR-vluchten buiten de daglichtperiode.
    url: https://wetten.overheid.nl/BWBR0006173/1993-10-20#Artikel4
