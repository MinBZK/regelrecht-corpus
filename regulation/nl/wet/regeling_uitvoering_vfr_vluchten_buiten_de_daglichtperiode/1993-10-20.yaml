---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.2/schema.json
$id: regeling_uitvoering_vfr_vluchten_buiten_de_daglichtperiode
regulatory_layer: WET
publication_date: '2014-12-11'
valid_from: '1993-10-20'
bwb_id: BWBR0006173
url: https://wetten.overheid.nl/BWBR0006173/1993-10-20
preamble:
  text: |-
    Handelend in overeenstemming met de Minister van Defensie;

    Gelet op artikel 44, tweede lid van het Luchtvaartverkeersreglement;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0006173/1993-10-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Gezagvoerders van burgerluchtvaartuigen wordt toestemming verleend om VFR-vluchten, waarbij stoffen ter bevordering
      of ter bescherming van het milieu dan wel de land-, tuin- of bosbouw, te bestemder' plaats te worden uitgeworpen, uit
      te voeren gedurende de vijftien minuten vóór aanvang en vijftien minuten ná einde van de daglichtperiode.
    url: https://wetten.overheid.nl/BWBR0006173/1993-10-20#Artikel1
    machine_readable:
      execution:
        parameters:
          - name: vlucht_begintijd
            type: date
            required: true
            description: Tijdstip waarop de VFR-vlucht begint
          - name: daglichtperiode_start
            type: date
            required: true
            description: Begin van de daglichtperiode
          - name: daglichtperiode_eind
            type: date
            required: true
            description: Einde van de daglichtperiode
        output:
          - name: toestemming_verleend
            type: boolean
            description: Geeft aan of toestemming wordt verleend voor VFR-vluchten buiten de daglichtperiode
        actions:
          - output: toestemming_verleend
            value:
              operation: OR
              conditions:
                - operation: AND
                  conditions:
                    - operation: GREATER_THAN_OR_EQUAL
                      subject: $vlucht_begintijd
                      value:
                        operation: DATE_ADD
                        date: $daglichtperiode_start
                        days: -0.0104167
                    - operation: LESS_THAN
                      subject: $vlucht_begintijd
                      value: $daglichtperiode_start
                - operation: AND
                  conditions:
                    - operation: GREATER_THAN
                      subject: $vlucht_begintijd
                      value: $daglichtperiode_eind
                    - operation: LESS_THAN_OR_EQUAL
                      subject: $vlucht_begintijd
                      value:
                        operation: DATE_ADD
                        date: $daglichtperiode_eind
                        days: 0.0104167
  - number: '2'
    text: |-
      Het besluit van de Directeur-Generaal van de Rijksluchtvaartdienst van 28 juli 1981, nr. LVB/L 23882/Stcrt. 1981,
      164 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006173/1993-10-20#Artikel2
  - number: '3'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0006173/1993-10-20#Artikel3
  - number: '4'
    text: |-
      Deze regeling wordt aangehaald als:

      Regeling uitvoering VFR-vluchten buiten de daglichtperiode.
    url: https://wetten.overheid.nl/BWBR0006173/1993-10-20#Artikel4
