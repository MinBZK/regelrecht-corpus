preamble:
  text: |-
    Gelet op richtlijn 2000/75/EG van de Raad van de Europese Unie van 20 november 2000 tot vaststelling van specifieke
    bepalingen inzake de bestrijding en uitroeiing van bluetongue (PbEG L 327), en artikel 10, eerste lid, van
    richtlijn 90/425 van de Raad van de Europese Unie van 26 juni 1990 inzake veterinaire en zoötechnische controles
    in het intracommunautaire handelsverkeer in bepaalde levende dieren en produkten in het vooruitzicht van de
    totstandbrenging van de interne markt (PbEG L 224);

    Gelet op de artikelen 17, 29, 30, eerste en derde lid, en 31 van de Gezondheids- en welzijnswet voor dieren;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel1
  - number: 1.a
    text: |-
      autosnelweg: weg als bedoeld in
      [artikel 1, aanhef en onderdeel c, van het Reglement verkeersregels en verkeerstekens 1990][ref1], alsmede langs de
      autosnelweg gelegen parkeerplaatsen, tankstations en bushalteplaatsen;


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel1
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '1'
  - number: 1.b
    text: 'bedrijf: bedrijf als bedoeld in artikel 2, onderdeel a, van [richtlijn 2000/75/EG](32000L0075);'
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel1
  - number: 1.c
    text: |-
      beschikking 2005/393/EG: beschikking 2005/393/EG van de Commissie van de Europese Unie van 23 mei 2005 inzake
      beschermings- en toezichtsgebieden in verband met bluetongue en de voorwaarden voor verplaatsingen uit of binnen
      deze gebieden (PbEU L 130);
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel1
  - number: 1.d
    text: |-
      mesterij: bedrijf of onderdeel van een bedrijf waar runderen, jonger dan 12 maanden, worden gehouden die zijn
      bestemd om te worden afgevoerd naar een slachthuis;
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel1
  - number: 1.e
    text: 'Minister: Minister van Landbouw, Natuur en Voedselkwaliteit;'
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel1
  - number: 1.f
    text: |-
      [richtlijn 2000/75/EG](32000L0075): [richtlijn 2000/75/EG](32000L0075) van de Raad van de Europese Unie van
      20 november 2000 tot vaststelling van specifieke bepalingen inzake de bestrijding en uitroeiing van bluetongue
      (PbEU L 327);
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel1
  - number: 1.g
    text: 'vectoren: vectoren als bedoeld in artikel 2, onderdeel e, van [richtlijn 2000/75/EG](32000L0075);'
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel1
  - number: 1.h
    text: 'VWA: Voedsel en Waren Autoriteit:'
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel1
  - number: 1.i
    text: 'derde land: land, niet zijnde Nederland en niet zijnde een lidstaat, IJsland, Liechtenstein of Noorwegen;'
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel1
  - number: 1.j
    text: |-
      wet: [Gezondheids- en welzijnswet voor dieren][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005662
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005662
  - number: '2'
    text: |-
      Deze regeling berust mede op de [artikelen 10][ref1], [19][ref2], [100][ref3] en
      [107 van de Gezondheids- en welzijnswet voor dieren][ref4].


