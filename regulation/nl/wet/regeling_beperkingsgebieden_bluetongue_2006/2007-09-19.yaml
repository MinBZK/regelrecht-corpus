  - number: '9'
    text: |-
      1 Het verbod, bedoeld in [artikel 3, eerste lid][ref1], is niet van toepassing op het vervoer van herkauwers, niet
      zijnde runderen jonger dan 31 dagen, uit Nederland naar een bedrijf gelegen in een in bijlage I bij beschikking
      2005/393/EG, onder ‘Gebied F’ beschreven deel van België, Duitsland, Frankrijk en Luxemburg, niet zijnde een gebied
      waar ingevolge artikel 6, eerste lid, onderdeel c, van richtlijn 2000/75/EG maatregelen zijn getroffen,

      mits:

      i. de te verplaatsen herkauwers serologisch zijn getest overeenkomstig bijlage II, onderdeel A, onder 1, onder b,
      van beschikking 2005/393/EG nadat zij gedurende ten minste 28 dagen zijn behandeld met geregistreerde, toegelaten
      of vrijgestelde middelen ter wering van vectoren, overeenkomstig het voorgeschreven gebruik, of

      ii. de te verplaatsen herkauwers zijn getest overeenkomstig bijlage II, onderdeel A, onder 1, onder c, van
      beschikking 2005/393/EG nadat zij gedurende ten minste 14 dagen zijn behandeld met geregistreerde, toegelaten of
      vrijgestelde middelen ter wering van vectoren, overeenkomstig het voorgeschreven gebruik, en

      iii. de te verplaatsen herkauwers en de vervoermiddelen voorafgaand aan en tijdens het vervoer zijn behandeld met
      geregistreerde, toegelaten of vrijgestelde middelen ter wering van vectoren, overeenkomstig het voorgeschreven
      gebruik;

      iv. de houder er voor zorg draagt dat degene die de monsters neemt ten behoeve van de desbetreffende test, bedoeld
      in onderdeel i of ii, schriftelijk verklaart op welke datum en bij welke herkauwers de monsters zijn genomen;

      v. de houder er voor zorg draagt dat de uitslag van de desbetreffende test, bedoeld in onderdeel i of ii, en de
      verklaring, bedoeld in onderdeel iv, gedurende 6 maanden op het bedrijf waarvan de herkauwers worden afgevoerd,
      wordt bewaard;

      vi. de houder er voor zorg draagt dat een kopie van de uitslag van de test, bedoeld in onderdeel a, en een kopie
      van de verklaring, bedoeld in onderdeel iv, voorafgaand aan het vervoer aan de Algemene Inspectiedienst wordt
      verzonden;

      vii. op het certificaat dat de te verplaatsen herkauwers vergezelt, is vermeld: ‘transport in overeenstemming met
      het bluetongue protocol nr. 7 van 9 augustus 2007’, en

      viii. de herkauwers binnen zeven dagen na de bloedafname ten behoeve van de test, bedoeld in de onderdelen i of ii
      worden vervoerd.

      2 De houder van de herkauwers toont op verzoek van de Minister aan dat de herkauwers en de vervoermiddelen
      overeenkomstig het eerste lid, onderdeel iii, zijn behandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0020190#Artikel3
