  - number: '3'
    text: |-
      1 Het vervoer, met inbegrip van verplaatsing over de openbare weg zonder vervoermiddel, van:

      a. herkauwers;

      b. sperma, eicellen en embryo’s van herkauwers;

      vanuit Nederland is verboden.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing op sperma, eicellen en embryo’s, van herkauwers,
      die

      a. in Nederland zijn gewonnen vóór 1 mei 2006;

      b. buiten Nederland zijn gewonnen vóór 1 mei 2006 en afkomstig zijn uit de in bijlage I bij beschikking 2005/393/
      EG, onder ‘Gebied F’ beschreven delen van België, Frankrijk, Duitsland en Luxemburg;

      c. buiten Nederland zijn gewonnen en niet afkomstig zijn uit de in bijlage I bij beschikking 2005/393/EG, onder
      ‘Gebied F’ beschreven delen van België, Frankrijk, Duitsland en Luxemburg.
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel3
  - number: '4'
    text: |-
      Het verbod, bedoeld in [artikel 3, eerste lid][ref1], is niet van toepassing op het vervoer vanuit Nederland van
      sperma, eicellen en embryo’s van herkauwers, die zijn gewonnen ná 1 mei 2006, naar een bestemming buiten Nederland,
      niet zijnde een locatie gelegen in de in bijlage I bij beschikking 2005/393/EG, onder ‘Gebied F’ beschreven delen
      van België, Frankrijk, Duitsland en Luxemburg, mits:

      a. het sperma is verkregen van donordieren die voldoen aan bijlage II, onderdeel B, van beschikking 2005/393/EG;

      b. de eicellen en embryo’s zijn verkregen van donordieren die voldoen aan bijlage II, onderdeel C, van beschikking
      2005/393/EG;

      c. voor zover het vervoer betreft van vers sperma naar een lidstaat, IJsland, Liechtenstein of Noorwegen, het land
      van bestemming, voorafgaand aan het vervoer, het vervoer heeft goedgekeurd;

      d. voor zover het vervoer betreft naar een derde land, de producten tevens voldoen aan de eisen die het land van
      bestemming stelt, en

      e. voor zover het vervoer naar een lidstaat, IJsland, Liechtenstein of Noorwegen betreft, het certificaat dat de
      producten vergezelt, voldoet aan artikel 5, tweede lid, van beschikking 2005/393/EG;

      f. voor zover het rechtstreeks vervoer naar een derde land betreft, het certificaat dat de producten vergezelt
      voldoet aan de eisen die het derde land stelt;

      g. voor zover het vervoer naar een derde land door een lidstaat betreft, wordt voldaan aan de onderdelen e en f.


      [ref1]: https://wetten.overheid.nl/BWBR0020190#Artikel3
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel4
    references:
