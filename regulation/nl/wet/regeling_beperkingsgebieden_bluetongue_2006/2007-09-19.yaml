        bwb_id: BWBR0005662
        artikel: '100'
      - id: ref4
        bwb_id: BWBR0005662
        artikel: '107'
  - number: '3.1'
    text: 'Het vervoer, met inbegrip van verplaatsing over de openbare weg zonder vervoermiddel, van:'
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel3
  - number: 3.1.a
    text: herkauwers;
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel3
  - number: 3.1.b
    text: sperma, eicellen en embryo’s van herkauwers;
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel3
  - number: '3.2'
    text: Het verbod, bedoeld in het eerste lid, is niet van toepassing op sperma, eicellen en embryo’s, van herkauwers, die
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel3
  - number: 3.2.a
    text: in Nederland zijn gewonnen vóór 1 mei 2006;
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel3
  - number: 3.2.b
    text: |-
      buiten Nederland zijn gewonnen vóór 1 mei 2006 en afkomstig zijn uit de in bijlage I bij beschikking 2005/393/EG,
      onder ‘Gebied F’ beschreven delen van België, Frankrijk, Duitsland en Luxemburg;
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel3
  - number: 3.2.c
    text: |-
      buiten Nederland zijn gewonnen en niet afkomstig zijn uit de in bijlage I bij beschikking 2005/393/EG, onder
      ‘Gebied F’ beschreven delen van België, Frankrijk, Duitsland en Luxemburg.
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel3
  - number: '4'
    text: |-
      Het verbod, bedoeld in [artikel 3, eerste lid][ref1], is niet van toepassing op het vervoer vanuit Nederland van
      sperma, eicellen en embryo’s van herkauwers, die zijn gewonnen ná 1 mei 2006, naar een bestemming buiten Nederland,
      niet zijnde een locatie gelegen in de in bijlage I bij beschikking 2005/393/EG, onder ‘Gebied F’ beschreven delen
      van België, Frankrijk, Duitsland en Luxemburg, mits:


      [ref1]: https://wetten.overheid.nl/BWBR0020190#Artikel3
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020190
        artikel: '3'
  - number: 4.a
    text: het sperma is verkregen van donordieren die voldoen aan bijlage II, onderdeel B, van beschikking 2005/393/EG;
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel4
  - number: 4.b
    text: |-
      de eicellen en embryo’s zijn verkregen van donordieren die voldoen aan bijlage II, onderdeel C, van beschikking
      2005/393/EG;
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel4
  - number: 4.c
    text: |-
      voor zover het vervoer betreft van vers sperma naar een lidstaat, IJsland, Liechtenstein of Noorwegen, het land van
      bestemming, voorafgaand aan het vervoer, het vervoer heeft goedgekeurd;
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel4
  - number: 4.d
    text: |-
      voor zover het vervoer betreft naar een derde land, de producten tevens voldoen aan de eisen die het land van
      bestemming stelt, en
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel4
  - number: 4.e
    text: |-
      voor zover het vervoer naar een lidstaat, IJsland, Liechtenstein of Noorwegen betreft, het certificaat dat de
      producten vergezelt, voldoet aan artikel 5, tweede lid, van beschikking 2005/393/EG;
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel4
  - number: 4.f
    text: |-
      voor zover het rechtstreeks vervoer naar een derde land betreft, het certificaat dat de producten vergezelt voldoet
      aan de eisen die het derde land stelt;
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel4
  - number: 4.g
    text: voor zover het vervoer naar een derde land door een lidstaat betreft, wordt voldaan aan de onderdelen e en f.
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel4
  - number: '5'
    text: |-
      Het verbod, bedoeld in [artikel 3, eerste lid][ref1], is niet van toepassing op het vervoer van herkauwers uit
      Nederland, naar een bedrijf of rechtstreeks naar een slachthuis buiten Nederland, niet zijnde een bedrijf of
      slachthuis gelegen in een in bijlage I bij beschikking 2005/393/EG onder ‘Gebied F’ beschreven deel van België,
      Frankrijk, Duitsland en Luxemburg, mits:


      [ref1]: https://wetten.overheid.nl/BWBR0020190#Artikel3
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020190
        artikel: '3'
  - number: 5.a
    text: 'voor zover het vervoer naar een lidstaat, IJsland, Liechtenstein of Noorwegen betreft:'
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel5
  - number: 5.a.i
    text: voldaan wordt aan bijlage II, onderdeel A, bij beschikking 2005/393/EG;
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel5
  - number: 5.a.ii
    text: |-
      het land van bestemming overeenkomstig artikel 2 bis, eerste lid, onderdeel d, onder i, van beschikking 2005/393/EG
      voorafgaand aan het vervoer het vervoer heeft goedgekeurd;
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel5
  - number: 5.a.iii
    text: |-
      het certificaat dat de dieren vergezelt, voldoet aan artikel 2 bis, eerste lid, onderdeel d, onder iii, van
      beschikking 2005/393/EG.
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel5
  - number: 5.b
    text: 'voor zover het rechtstreeks vervoer naar een derde land betreft:'
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel5
  - number: 5.b.i
    text: het land van bestemming voorafgaand aan het vervoer het vervoer heeft goedgekeurd;
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel5
  - number: 5.b.ii
    text: het certificaat dat de dieren vergezeld voldoet aan de eisen die het derde land stelt.
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel5
  - number: 5.c
    text: |-
      voor zover het vervoer naar een derde land door een lidstaat betreft, wordt voldaan aan onderdeel a, onder i en
      iii.
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel5
  - number: '6'
    text: |-
      Het verbod, bedoeld in [artikel 3, eerste lid][ref1], is niet van toepassing op het rechtstreekse vervoer van
      herkauwers uit Nederland naar een slachthuis gelegen in:


      [ref1]: https://wetten.overheid.nl/BWBR0020190#Artikel3
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020190
        artikel: '3'
  - number: 6.a
    text: België ;
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel6
  - number: 6.b
    text: Luxemburg;
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel6
  - number: 6.c
    text: Duitsland, en
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel6
  - number: 6.d
    text: |-
      Frankrijk, met uitzondering van de Franse departementen Alpes-Maritimes (06), Ariège (09), Aude (11), Aveyron (12),
      Bouches-du-Rhône (13), Gard (30), Haute-Garonne (31), Gers (32), Hérault (34), Landes (40), Pyréneés-Atlantiques
      (64), Hautes-Pyrénées (65), Pyrénées-Orientales (66), Tarn (81), Tarn-et-Garonne (82) en Var (83), mits:
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel6
  - number: 6.d.i
    text: de te verplaatsen herkauwers op de dag van vervoer geen enkel verschijnsel van bluetongue vertonen;
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel6
  - number: 6.d.ii
    text: |-
      de te verplaatsen herkauwers rechtstreeks naar het slachthuis worden vervoerd in voertuigen die verzegeld zijn door
      een ambtenaar van de VWA;
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel6
  - number: 6.d.iii
    text: |-
      voor zover het vervoer naar een slachthuis betreft waar niet ingevolge artikel 6, eerste lid, onderdeel c, van
      richtlijn 2000/75/EG maatregelen zijn getroffen, de te verplaatsen herkauwers en de vervoermiddelen voorafgaand
      aan en tijdens het vervoer zijn behandeld met geregistreerde, toegelaten of vrijgestelde middelen ter wering van
      vectoren, overeenkomstig het voorgeschreven gebruik, en
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel6
  - number: 6.d.iv
    text: |-
      op het certificaat dat de te verplaatsen herkauwers vergezelt, is vermeld: ‘transport in overeenstemming met het
      bluetongue protocol nr. 7 van 9 augustus 2007’.
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel6
  - number: '7.1'
    text: |-
      Het verbod, bedoeld in [artikel 3, eerste lid][ref1], is niet van toepassing op het vervoer van sperma, eicellen en
      embryo’s van herkauwers vanuit Nederland naar een buiten Nederland gelegen locatie, gelegen in een deel van België,
      Frankrijk, Duitsland en Luxemburg, waar ingevolge artikel 6, eerste lid, onderdeel c, van richtlijn 2000/75/EG
      maatregelen zijn getroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0020190#Artikel3
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020190
        artikel: '3'
  - number: '7.2'
    text: |-
      Het verbod, bedoeld in [artikel 3, eerste lid][ref1], is niet van toepassing op het vervoer van sperma, eicellen en
      embryo’s van herkauwers vanuit Nederland naar een locatie gelegen in de in bijlage I bij beschikking 2005/393/EG,
      onder ‘Gebied F’ beschreven delen van België, Frankrijk, Duitsland en Luxemburg, mits:


      [ref1]: https://wetten.overheid.nl/BWBR0020190#Artikel3
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020190
        artikel: '3'
  - number: 7.2.a
    text: het sperma is verkregen van donordieren die voldoen aan bijlage II, onderdeel B, van beschikking 2005/393/EG;
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel7
  - number: 7.2.b
    text: |-
      de eicellen en embryo’s zijn verkregen van donordieren die voldoen aan bijlage II, onderdeel C, van beschikking
      2005/393/EG;
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel7
  - number: 7.2.c
    text: het certificaat dat de producten vergezelt, voldoet aan artikel 5, tweede lid, van beschikking 2005/393/EG.
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel7
  - number: '8'
    text: |-
      Het verbod, bedoeld in [artikel 3, eerste lid][ref1], is niet van toepassing op het rechtstreekse vervoer van
      herkauwers uit Nederland naar een buiten Nederland gelegen bedrijf of slachthuis dat is gelegen in een deel
      van België, Duitsland, Frankrijk of Luxemburg, waar ingevolge artikel 6, eerste lid, onderdeel c, van richtlijn
      2000/75/EG maatregelen zijn getroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0020190#Artikel3
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020190
        artikel: '3'
  - number: '9.1'
    text: |-
      Het verbod, bedoeld in [artikel 3, eerste lid][ref1], is niet van toepassing op het vervoer van herkauwers, niet
      zijnde runderen jonger dan 31 dagen, uit Nederland naar een bedrijf gelegen in een in bijlage I bij beschikking
      2005/393/EG, onder ‘Gebied F’ beschreven deel van België, Duitsland, Frankrijk en Luxemburg, niet zijnde een gebied
      waar ingevolge artikel 6, eerste lid, onderdeel c, van richtlijn 2000/75/EG maatregelen zijn getroffen, mits:


      [ref1]: https://wetten.overheid.nl/BWBR0020190#Artikel3
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020190
        artikel: '3'
  - number: 9.1.i
    text: |-
      de te verplaatsen herkauwers serologisch zijn getest overeenkomstig bijlage II, onderdeel A, onder 1, onder b, van
      beschikking 2005/393/EG nadat zij gedurende ten minste 28 dagen zijn behandeld met geregistreerde, toegelaten of
      vrijgestelde middelen ter wering van vectoren, overeenkomstig het voorgeschreven gebruik, of
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel9
  - number: 9.1.ii
    text: |-
      de te verplaatsen herkauwers zijn getest overeenkomstig bijlage II, onderdeel A, onder 1, onder c, van beschikking
      2005/393/EG nadat zij gedurende ten minste 14 dagen zijn behandeld met geregistreerde, toegelaten of vrijgestelde
      middelen ter wering van vectoren, overeenkomstig het voorgeschreven gebruik, en
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel9
  - number: 9.1.iii
    text: |-
      de te verplaatsen herkauwers en de vervoermiddelen voorafgaand aan en tijdens het vervoer zijn behandeld met
      geregistreerde, toegelaten of vrijgestelde middelen ter wering van vectoren, overeenkomstig het voorgeschreven
      gebruik;
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel9
  - number: 9.1.iv
    text: |-
      de houder er voor zorg draagt dat degene die de monsters neemt ten behoeve van de desbetreffende test, bedoeld in
      onderdeel i of ii, schriftelijk verklaart op welke datum en bij welke herkauwers de monsters zijn genomen;
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel9
  - number: 9.1.v
    text: |-
      de houder er voor zorg draagt dat de uitslag van de desbetreffende test, bedoeld in onderdeel i of ii, en de
      verklaring, bedoeld in onderdeel iv, gedurende 6 maanden op het bedrijf waarvan de herkauwers worden afgevoerd,
      wordt bewaard;
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel9
  - number: 9.1.vi
    text: |-
      de houder er voor zorg draagt dat een kopie van de uitslag van de test, bedoeld in onderdeel a, en een kopie van de
      verklaring, bedoeld in onderdeel iv, voorafgaand aan het vervoer aan de Algemene Inspectiedienst wordt verzonden;
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel9
  - number: 9.1.vii
    text: |-
      op het certificaat dat de te verplaatsen herkauwers vergezelt, is vermeld: ‘transport in overeenstemming met het
      bluetongue protocol nr. 7 van 9 augustus 2007’, en
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel9
  - number: 9.1.viii
    text: |-
      de herkauwers binnen zeven dagen na de bloedafname ten behoeve van de test, bedoeld in de onderdelen i of ii worden
      vervoerd.
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel9
  - number: '9.2'
    text: |-
      De houder van de herkauwers toont op verzoek van de Minister aan dat de herkauwers en de vervoermiddelen
      overeenkomstig het eerste lid, onderdeel iii, zijn behandeld.
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel9
  - number: '10'
    text: |-
      Het verbod, bedoeld in [artikel 3, eerste lid][ref1], is niet van toepassing op het vervoer van runderen die niet
      ouder zijn dan 30 dagen, uit Nederland naar een mesterij gelegen in een in bijlage I bij beschikking 2005/393/
      EG, onder ‘Gebied F’ beschreven deel van België, Duitsland, Frankrijk en Luxemburg, niet zijnde een gebied waar
      ingevolge artikel 6, eerste lid, onderdeel c, van richtlijn 2000/75/EG maatregelen zijn getroffen mits:


      [ref1]: https://wetten.overheid.nl/BWBR0020190#Artikel3
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0020190
        artikel: '3'
  - number: 10.a
    text: deze dieren op de plaats van bestemming worden gehouden in een afgesloten stal;
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel10
  - number: 10.b
    text: de te verplaatsen herkauwers op de dag van vervoer geen enkel verschijnsel van bluetongue vertonen;
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel10
  - number: 10.c
    text: |-
      de te verplaatsen herkauwers en de vervoermiddelen op de plaats van lading en tijdens het vervoer zijn behandeld
      met geregistreerde, toegelaten of vrijgestelde middelen ter wering van vectoren, overeenkomstig het voorgeschreven
      gebruik;
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel10
  - number: 10.d
    text: |-
      het gebouw waar de dieren worden gehouden op de plaats van bestemming voorafgaand aan de aanvoer van deze dieren
      is behandeld met geregistreerde, toegelaten of vrijgestelde middelen ter wering van vectoren, overeenkomstig het
      voorgeschreven gebruik;
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel10
  - number: 10.e
    text: |-
      op het certificaat dat de te verplaatsen herkauwers vergezelt, is vermeld: ‘transport in overeenstemming met het
      bluetongue protocol nr. 7 van 9 augustus 2007’;
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel10
  - number: 10.f
    text: |-
      de houder van de herkauwers op verzoek van de Minister aantoont dat de herkauwers en de vervoermiddelen
      overeenkomstig onderdeel c, zijn behandeld, en
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel10
  - number: 10.g
    text: deze dieren vervolgens rechtstreeks naar een slachthuis worden afgevoerd.
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel10
  - number: '11.1'
    text: |-
      Het verbod, bedoeld in [artikel 3, eerste lid][ref1], is niet van toepassing op het vervoer van herkauwers, die
      afkomstig zijn uit gebieden buiten Nederland, waarvoor geen beperkingen gelden op grond van richtlijn 2000/75/
      EG, door Nederland, over autosnelwegen en spoorlijnen en via luchthavens rechtstreeks naar een bestemming gelegen
      buiten Nederland, zonder dat in Nederland wordt gelost of halt gehouden, op voorwaarde dat:


      [ref1]: https://wetten.overheid.nl/BWBR0020190#Artikel3
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0020190
        artikel: '3'
  - number: 11.1.a
    text: het certificaat dat de dieren vergezelt, voldoet aan artikel 6, tweede lid, van beschikking 2005/393/EG, en
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel11
  - number: 11.1.b
    text: |-
      de dieren en het vervoermiddel op de plaats van lading of in elk geval voor binnenkomst in Nederland een
      behandeling hebben ondergaan met geregistreerde, toegelaten of vrijgestelde middelen ter wering van vectoren,
      overeenkomstig het voorgeschreven gebruik.
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel11
  - number: '11.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op het vervoer van herkauwers uit Nederland naar, of door
      gebieden, buiten Nederland, waarvoor geen beperkingen gelden op grond van richtlijn 2000/75/EG.
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel11
  - number: 11a.1
    text: |-
      Ingeval een herkauwer verschijnselen vertoont van bluetongue of redelijkerwijs kan worden aangenomen
      dat een herkauwer in de gelegenheid is geweest om te worden besmet met of drager is van bluetongue,
      wordt aan de houder van het dier vrijstelling verleend van de verplichting tot kennisgeving, bedoeld in
      [artikel 19, eerste lid, van de wet][ref1], onder de voorwaarde dat wordt voldaan aan het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel19
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '19'
  - number: 11a.2
    text: |-
      De houder, bedoeld in het eerste lid, stelt een dierenarts in kennis van de verschijnselen van bluetongue bij een
      herkauwer.
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel11a
  - number: 11a.3
    text: |-
      De dierenarts, bedoeld in het tweede lid, verricht de kennisgeving, bedoeld in [artikel 100 van de wet][ref1], aan
      de VWA.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel100
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '100'
  - number: '12'
    text: |-
      Deze regeling laat de op grond van de [Regeling handel levende dieren en levende producten][ref1] geldende
      bepalingen onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0007049
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007049
  - number: '13'
    text: 'Deze regeling wordt aangehaald als: Regeling beperkingsgebieden bluetongue 2006.'
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel13
