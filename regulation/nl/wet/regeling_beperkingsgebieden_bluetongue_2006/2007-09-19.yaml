  - number: 11a
    text: |-
      1 Ingeval een herkauwer verschijnselen vertoont van bluetongue of redelijkerwijs kan worden aangenomen
      dat een herkauwer in de gelegenheid is geweest om te worden besmet met of drager is van bluetongue,
      wordt aan de houder van het dier vrijstelling verleend van de verplichting tot kennisgeving, bedoeld in
      [artikel 19, eerste lid, van de wet][ref1], onder de voorwaarde dat wordt voldaan aan het tweede lid.

      2 De houder, bedoeld in het eerste lid, stelt een dierenarts in kennis van de verschijnselen van bluetongue bij
      een herkauwer.

      3 De dierenarts, bedoeld in het tweede lid, verricht de kennisgeving, bedoeld in [artikel 100 van de wet][ref2],
      aan de VWA.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel100
