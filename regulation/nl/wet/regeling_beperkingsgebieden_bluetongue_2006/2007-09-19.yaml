        bwb_id: BWBR0020190
        artikel: '3'
  - number: '5'
    text: |-
      Het verbod, bedoeld in [artikel 3, eerste lid][ref1], is niet van toepassing op het vervoer van herkauwers uit
      Nederland, naar een bedrijf of rechtstreeks naar een slachthuis buiten Nederland, niet zijnde een bedrijf of
      slachthuis gelegen in een in bijlage I bij beschikking 2005/393/EG onder ‘Gebied F’ beschreven deel van België,
      Frankrijk, Duitsland en Luxemburg, mits:

      a. voor zover het vervoer naar een lidstaat, IJsland, Liechtenstein of Noorwegen betreft:

      i. voldaan wordt aan bijlage II, onderdeel A, bij beschikking 2005/393/EG;

      ii. het land van bestemming overeenkomstig artikel 2 bis, eerste lid, onderdeel d, onder i, van beschikking
      2005/393/EG voorafgaand aan het vervoer het vervoer heeft goedgekeurd;

      iii. het certificaat dat de dieren vergezelt, voldoet aan artikel 2 bis, eerste lid, onderdeel d, onder iii, van
      beschikking 2005/393/EG.

      b. voor zover het rechtstreeks vervoer naar een derde land betreft:

      i. het land van bestemming voorafgaand aan het vervoer het vervoer heeft goedgekeurd;

      ii. het certificaat dat de dieren vergezeld voldoet aan de eisen die het derde land stelt.

      c. voor zover het vervoer naar een derde land door een lidstaat betreft, wordt voldaan aan onderdeel a, onder i
      en iii.


      [ref1]: https://wetten.overheid.nl/BWBR0020190#Artikel3
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020190
        artikel: '3'
  - number: '6'
    text: |-
      Het verbod, bedoeld in [artikel 3, eerste lid][ref1], is niet van toepassing op het rechtstreekse vervoer van
      herkauwers uit Nederland naar een slachthuis gelegen in:

      a. België ;

      b. Luxemburg;

      c. Duitsland, en

      d. Frankrijk, met uitzondering van de Franse departementen Alpes-Maritimes (06), Ariège (09), Aude (11), Aveyron
      (12), Bouches-du-Rhône (13), Gard (30), Haute-Garonne (31), Gers (32), Hérault (34), Landes (40), Pyréneés-
      Atlantiques (64), Hautes-Pyrénées (65), Pyrénées-Orientales (66), Tarn (81), Tarn-et-Garonne (82) en Var (83),
      mits:

      i. de te verplaatsen herkauwers op de dag van vervoer geen enkel verschijnsel van bluetongue vertonen;

      ii. de te verplaatsen herkauwers rechtstreeks naar het slachthuis worden vervoerd in voertuigen die verzegeld zijn
      door een ambtenaar van de VWA;

      iii. voor zover het vervoer naar een slachthuis betreft waar niet ingevolge artikel 6, eerste lid, onderdeel c,
      van richtlijn 2000/75/EG maatregelen zijn getroffen, de te verplaatsen herkauwers en de vervoermiddelen voorafgaand
      aan en tijdens het vervoer zijn behandeld met geregistreerde, toegelaten of vrijgestelde middelen ter wering van
      vectoren, overeenkomstig het voorgeschreven gebruik, en

      iv. op het certificaat dat de te verplaatsen herkauwers vergezelt, is vermeld: ‘transport in overeenstemming met
      het bluetongue protocol nr. 7 van 9 augustus 2007’.


      [ref1]: https://wetten.overheid.nl/BWBR0020190#Artikel3
    url: https://wetten.overheid.nl/BWBR0020190/2007-09-19#Artikel6
