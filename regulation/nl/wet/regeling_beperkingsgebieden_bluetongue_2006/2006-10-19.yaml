  - number: '8'
    text: |-
      Het verbod, bedoeld in [artikel 4, eerste lid][ref1], is niet van toepassing op het vervoer van herkauwers, die
      afkomstig zijn uit gebieden buiten Nederland, waarvoor geen beperkingen gelden op grond van [richtlijn 2000/75/
      EG](32000L0075), door een gebied, over autosnelwegen en spoorlijnen en via luchthavens rechtstreeks naar een
      bestemming gelegen buiten Nederland, zonder dat in dat gebied wordt gelost of halt gehouden, op voorwaarde dat:

      a. de dieren en het vervoermiddel op de plaats van lading of in ieder geval vóór binnenkomst in een gebied een
      behandeling hebben ondergaan met middelen als bedoeld in [artikel 13][ref2];

      b. de lidstaat van bestemming voorafgaand aan het vervoer toestemming heeft gegeven voor het vervoer, en

      c. het certificaat dat de dieren vergezelt, voldoet aan artikel 6, tweede lid, van beschikking 2005/393/EG.


      [ref1]: https://wetten.overheid.nl/BWBR0020190#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020190#Artikel13
