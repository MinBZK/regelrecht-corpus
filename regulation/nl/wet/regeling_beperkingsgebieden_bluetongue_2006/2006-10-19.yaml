  - number: 8c
    text: |-
      1 Het verbod, bedoeld in [artikel 4, eerste lid][ref1], is niet van toepassing op het rechtstreekse vervoer van
      herkauwers uit een gebied naar een buiten Nederland gelegen bedrijf of slachthuis dat is gelegen in een deel
      van België, Duitsland, Frankrijk of Luxemburg, waar ingevolge artikel 6, eerste lid, onderdeel c, van [richtlijn
      2000/75/EG](32000L0075) maatregelen zijn getroffen.

      2 In het geval dat het vervoer, bedoeld in het eerste lid, voor wat betreft herkauwers naar een bedrijf via het
      gebied, bedoeld in [bijlage II][ref2], of via een in bijlage I bij beschikking 2005/393/EG, onder ‘Gebied F’
      beschreven deel van België, Duitsland, Frankrijk of Luxemburg plaatsvindt:

      a. moeten de herkauwers en de vervoermiddelen voorafgaand aan het vervoer een behandeling hebben ondergaan met
      middelen als bedoeld in [artikel 13][ref3], en

      b. moet, voor zover het vervoer door het in bijlage I bij beschikking 2005/393/EG, onder ‘Gebied F’ beschreven
      toezichtsgebied van Frankrijk gaat, de bevoegde autoriteit van Frankrijk hiervoor toestemming hebben gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0020190#Artikel4
