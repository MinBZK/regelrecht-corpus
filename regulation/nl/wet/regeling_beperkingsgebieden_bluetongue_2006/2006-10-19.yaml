  - number: '4'
    text: >-
      1 Het vervoer, met inbegrip van verplaatsing over de openbare weg zonder vervoermiddel, van:


      a. herkauwers;


      b. sperma, eicellen en embryo’s van herkauwers;


      vanuit een gebied is verboden.


      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing op sperma, eicellen en embryo’s, van herkauwers,
      die


      a. in Nederland zijn gewonnen vóór 1 mei 2006;


      b. buiten Nederland zijn gewonnen vóór 1 mei 2006 en afkomstig zijn uit de in bijlage I bij beschikking 2005/393/
      EG, onder ‘Gebied F’ beschreven delen van België, Frankrijk, Duitsland en Luxemburg;


      c. buiten Nederland zijn gewonnen en niet afkomstig zijn uit de in bijlage I bij beschikking 2005/393/EG, onder
      ‘Gebied F’ beschreven delen van België, Frankrijk, Duitsland en Luxemburg.


      3 Het verbod, bedoeld in het eerste lid, is niet van toepassing op herkauwers die binnen een bedrijf worden
      verplaatst van een gebied naar een ander gebied.
    url: https://wetten.overheid.nl/BWBR0020190/2006-10-19#Artikel4
  - number: '5'
    text: |-
      1 Het verbod, bedoeld in [artikel 4, eerste lid][ref1], is niet van toepassing op het vervoer van sperma, eicellen
      en embryo’s van herkauwers vanuit het gebied naar:

      a. een gebied, bedoeld in [bijlage I][ref2];

      b. een buiten Nederland gelegen locatie, gelegen in de in bijlage I bij beschikking 2005/393/EG, onder ‘Gebied F’
      beschreven delen van België, Frankrijk, Duitsland en Luxemburg.

      2 Het verbod, bedoeld in [artikel 4, eerste lid][ref3], is niet van toepassing op het vervoer van sperma, eicellen
      en embryo’s van herkauwers vanuit het gebied door een gebied als bedoeld in [bijlage I][ref4], zonder dat in dit
      gebied, wordt gelost of halt gehouden, rechtstreeks naar het gebied, bedoeld in [bijlage II][ref5].


