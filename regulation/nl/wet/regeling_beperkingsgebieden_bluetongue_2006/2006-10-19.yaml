  - number: '9'
    text: |-
      Het verbod, bedoeld in [artikel 4, eerste lid][ref1], is niet van toepassing op het rechtstreekse vervoer van
      herkauwers uit een gebied naar een:

      a. slachthuis gelegen in het gebied, bedoeld in [bijlage II][ref2];

      b. slachthuis buiten Nederland, gelegen in een in bijlage I bij beschikking 2005/393/EG, onder ‘Gebied F’
      beschreven deel van België, Duitsland en Luxemburg, niet zijnde een deel van België, Duitsland of Luxemburg, waar
      ingevolge artikel 6, eerste lid, onderdeel c, van [richtlijn 2000/75/EG](32000L0075) maatregelen zijn getroffen, of

      c. een door de bevoegde autoriteit van Frankrijk aangewezen slachthuis, gelegen in het in bijlage I bij beschikking
      2005/393/EG, onder ‘Gebied F’ beschreven deel van Frankrijk, niet zijnde het deel van Frankrijk, waar ingevolge
      artikel 6, eerste lid, onderdeel c, van [richtlijn 2000/75/EG](32000L0075) maatregelen zijn getroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0020190#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020190
    url: https://wetten.overheid.nl/BWBR0020190/2006-10-19#Artikel9
