  - number: 13b
    text: |-
      1 Het is verboden herkauwers te insemineren met vers sperma, dat afkomstig is van een locatie gelegen in:

      a. een gebied, bedoeld in [bijlage I][ref1], of

      b. een deel van België, Duitsland, Frankrijk of Luxemburg waar ingevolge artikel 6, eerste lid, onderdeel c, van
      [richtlijn 2000/75/EG](32000L0075) beperkende maatregelen zijn getroffen.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing indien:

      a. het verse sperma voldoet aan bijlage II, onderdeel B, van beschikking 2005/393/EG, en

      b. de houder van de herkauwers er zorg voor draagt dat voldaan wordt aan bijlage II, onderdeel B, punt 4, van
      beschikking 2005/393/EG.


      [ref1]: https://wetten.overheid.nl/BWBR0020190
    url: https://wetten.overheid.nl/BWBR0020190/2006-10-19#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0020190
  - number: 13c
    text: |-
      Deze regeling laat de op grond van de [Regeling handel levende dieren en levende producten][ref1] geldende
      bepalingen onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0007049
