        artikel: '13'
  - number: '11'
    text: |-
      1 Het is verboden op een bedrijf herkauwers te ontvangen die afkomstig zijn uit een gebied, bedoeld in
      [bijlage I][ref1].

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing, mits:

      a. voldaan is aan [artikel 10, onderdelen i tot en met v][ref2], en

      b. de eigenaar of exploitant van het bedrijf waar de herkauwers worden aangevoerd er zorg voor draagt dat de
      betreffende herkauwers niet worden afgevoerd van dat bedrijf, tenzij het betreft afvoer naar een slachthuis.


      [ref1]: https://wetten.overheid.nl/BWBR0020190
      [ref2]: https://wetten.overheid.nl/BWBR0020190#Artikel10
