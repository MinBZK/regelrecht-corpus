        artikel: '4'
  - number: '7'
    text: |-
      1 Het verbod, bedoeld in [artikel 4, eerste lid][ref1], is niet van toepassing op het vervoer van herkauwers vanuit
      het gebied:

      a. naar een gebied, bedoeld in [bijlage I][ref2];

      b. naar een buiten Nederland gelegen locatie, gelegen in de in bijlage I bij beschikking 2005/393/EG, onder ‘Gebied
      F’ beschreven delen van België, Frankrijk, Duitsland en Luxemburg, met uitzondering van het in bijlage I bij
      beschikking 2005/393/EG, onder ‘Gebied F’ beschreven toezichtsgebied van Frankrijk.

      2 Het verbod, bedoeld in [artikel 4, eerste lid][ref3], is niet van toepassing op het vervoer van herkauwers
      vanuit het gebied door een gebied als bedoeld in [bijlage I][ref4], zonder dat in dit gebied wordt gelost of halt
      gehouden, rechtstreeks naar het gebied, bedoeld in [bijlage II][ref5], mits de dieren en het vervoermiddel op de
      plaats van lading of in ieder geval vóór binnenkomst in een gebied, bedoeld in [bijlage I][ref6], een behandeling
      hebben ondergaan met middelen als bedoeld in [artikel 13][ref7].

      3 Het verbod, bedoeld in [artikel 4, eerste lid][ref8], is niet van toepassing op het vervoer van herkauwers
      uit het gebied, naar een bestemming buiten Nederland, niet zijnde een bestemming gelegen in de in bijlage I bij
      beschikking 2005/393/EG, onder ‘Gebied F’ beschreven delen van België, Frankrijk, Duitsland en Luxemburg, mits:

      a. voldaan wordt aan bijlage II, onderdeel A, bij beschikking 2005/393/EG;

      b. het land van bestemming voorafgaand aan het vervoer het vervoer heeft goedgekeurd, en

      c. voor zover het vervoer naar een lidstaat, IJsland, Liechtenstein of Noorwegen betreft, het certificaat dat de
      dieren vergezelt, voldoet aan artikel 5, tweede lid, van beschikking 2005/393/EG;

      d. voor zover het rechtstreeks vervoer naar een derde land betreft, het certificaat dat de dieren vergezelt voldoet
      aan de eisen die het derde land stelt;

      e. voor zover het vervoer naar een derde land door een lidstaat betreft, wordt voldaan aan de onderdelen c en d.

      4 Ten aanzien van de in het derde lid bedoelde herkauwers die worden vervoerd naar een slachthuis kan, in afwijking
      van het derde lid, onderdeel a, vervoer plaatsvinden, mits:

      a. de VWA voorafgaand aan het vervoer een risicoanalyse als bedoeld in artikel 4, onderdeel a, van beschikking
      2005/393/EG heeft uitgevoerd waarvan de uitkomst positief is;

      b. de te verplaatsen herkauwers op de dag van vervoer geen enkel verschijnsel van bluetongue vertonen, en

      c. de voertuigen waarin de te verplaatsen herkauwers worden vervoerd, verzegeld zijn door een ambtenaar van de VWA.

      5 De herkauwers, bedoeld in het eerste en derde lid, zijn geen herkauwers waarvan het bedrijf van oorsprong is
      gelegen in een deel van Nederland, België, Frankrijk, Duitsland of Luxemburg waar ingevolge artikel 6, eerste lid,
      onderdeel c, van [richtlijn 2000/75/EG](32000L0075) maatregelen zijn getroffen.


