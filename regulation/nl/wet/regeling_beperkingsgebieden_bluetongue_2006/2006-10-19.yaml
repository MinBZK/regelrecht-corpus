  - number: 8a
    text: |-
      1 Het verbod, bedoeld in [artikel 4, eerste lid][ref1], is niet van toepassing op het vervoer van sperma, eicellen
      en embryo’s van herkauwers vanuit een gebied naar het gebied, bedoeld in [bijlage II][ref2], mits:

      a. het sperma is verkregen van donordieren die voldoen aan bijlage II, onderdeel B, van beschikking 2005/393/EG;

      b. de eicellen en embryo’s zijn verkregen van donordieren die voldoen aan bijlage II, onderdeel C, van beschikking
      2005/393/EG.

      2 Het verbod, bedoeld in [artikel 4, eerste lid][ref3], is niet van toepassing op het vervoer van sperma, eicellen
      en embryo’s van herkauwers vanuit een gebied naar een buiten Nederland gelegen locatie, gelegen in een deel van
      België, Frankrijk, Duitsland en Luxemburg, waar ingevolge artikel 6, eerste lid, onderdeel c, van [richtlijn
      2000/75/EG](32000L0075) maatregelen zijn getroffen.

      3 Het verbod, bedoeld in [artikel 4, eerste lid][ref4], is niet van toepassing op het vervoer van sperma, eicellen
      en embryo’s van herkauwers vanuit een gebied naar een locatie gelegen in de in bijlage I bij beschikking 2005/393/
      EG, onder ‘Gebied F’ beschreven delen van België, Frankrijk, Duitsland en Luxemburg, mits:

      a. het sperma is verkregen van donordieren die voldoen aan bijlage II, onderdeel B, van beschikking 2005/393/EG;

      b. de eicellen en embryo’s zijn verkregen van donordieren die voldoen aan bijlage II, onderdeel C, van beschikking
      2005/393/EG;

      c. het certificaat dat de producten vergezelt, voldoet aan artikel 5, tweede lid, van beschikking 2005/393/EG.


