        artikel: '10'
  - number: '13'
    text: >-
      De houder van herkauwers behandelt deze dieren, de gebouwen waarin deze dieren zijn ondergebracht en de omgeving
      daarvan met geregistreerde, toegelaten of vrijgestelde middelen ter wering van vectoren, overeenkomstig het
      voorgeschreven gebruik.
    url: https://wetten.overheid.nl/BWBR0020190/2006-10-19#Artikel13
  - number: 13a
    text: |-
      1 Het is verboden herkauwers en sperma, eicellen en embryo’s van herkauwers afkomstig van een locatie, gelegen
      in een deel van België, Duitsland, Frankrijk of Luxemburg waar ingevolge artikel 6, eerste lid, onderdeel c,
      van [richtlijn 2000/75/EG](32000L0075) beperkende maatregelen zijn getroffen, binnen Nederland in het gebied te
      brengen.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing op het vervoer van herkauwers naar een bedrijf
      gelegen in het gebied, mits de eigenaar of exploitant van het bedrijf waar de herkauwers worden aangevoerd er zorg
      voor draagt dat de betreffende herkauwers niet worden afgevoerd van dat bedrijf, tenzij het betreft afvoer naar
      een slachthuis.

      3 Het verbod, bedoeld in het eerste lid, is niet van toepassing op het rechtstreekse vervoer van herkauwers door
      het gebied, zonder dat in dit gebied wordt gelost of halt gehouden, naar een locatie gelegen in een gebied, bedoeld
      in [bijlage I][ref1], mits de herkauwers en het vervoermiddel vóór binnenkomst in het gebied een behandeling hebben
      ondergaan met middelen als bedoeld in [artikel 13][ref2].

      4 Het verbod, bedoeld in het eerste lid, is niet van toepassing op het vervoer van sperma, eicellen en embryo’s van
      herkauwers naar het gebied, mits voldaan is, voor zover van toepassing, aan [bijlage II, onderdeel B of C][ref3],
      van beschikking 2005/393/EG.

      5 Het verbod, bedoeld in het eerste lid, is niet van toepassing op het rechtstreekse vervoer van sperma, eicellen
      en embryo’s van herkauwers door het gebied, zonder dat in dit gebied wordt gelost of halt gehouden, rechtstreeks
      naar een locatie gelegen in een gebied, bedoeld in [bijlage I][ref4].

      6 [Artikel 2.32 van de Regeling handel levende dieren en levende producten][ref5] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020190
      [ref2]: https://wetten.overheid.nl/BWBR0020190#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0020190
      [ref4]: https://wetten.overheid.nl/BWBR0020190
      [ref5]: https://wetten.overheid.nl/BWBR0007049#Artikel2.32
    url: https://wetten.overheid.nl/BWBR0020190/2006-10-19#Artikel13a
