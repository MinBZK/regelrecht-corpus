  - number: '10'
    text: |-
      Het verbod, bedoeld in [artikel 4, eerste lid][ref1], is niet van toepassing op het vervoer van herkauwers uit een
      gebied naar een bedrijf:

      a. gelegen in het gebied, bedoeld in [bijlage II][ref2], of

      b. buiten Nederland, gelegen een in bijlage I bij beschikking 2005/393/EG, onder ‘Gebied F’ beschreven deel van
      België, Duitsland, Frankrijk en Luxemburg, niet zijnde een deel van België; Duitsland Frankrijk of Luxemburg, waar
      ingevolge artikel 6, eerste lid, onderdeel c, van [richtlijn 2000/75/EG](32000L0075) maatregelen zijn getroffen;

      mits:

      i. de te verplaatsen herkauwers overeenkomstig artikel 2bis, onderdeel a, onder ii, tweede gedachtestreepje, van
      beschikking 2005/393/EG, zijn getest;

      ii. de houder er voor zorg draagt dat degene die de monsters neemt ten behoeve van de test, bedoeld in onderdeel i,
      schriftelijk verklaart op welke datum en op welk tijdstip bij welke herkauwers de monsters zijn genomen;

      iii. de uitslag van de test, bedoeld in onderdeel i, en de verklaring, bedoeld in onderdeel ii, gedurende 6 maanden
      op het bedrijf waarvan de herkauwers worden afgevoerd wordt bewaard;

      iv. een kopie van de uitslag van de test, bedoeld in onderdeel i, en een kopie van de verklaring, bedoeld in
      onderdeel ii, voorafgaand aan het vervoer aan de Algemene Inspectiedienst wordt verzonden, en

      v. de te verplaatsen herkauwers en de vervoermiddelen voorafgaand aan het vervoer een behandeling hebben ondergaan
      met middelen als bedoeld in [artikel 13][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020190#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020190
      [ref3]: https://wetten.overheid.nl/BWBR0020190#Artikel13
    url: https://wetten.overheid.nl/BWBR0020190/2006-10-19#Artikel10
