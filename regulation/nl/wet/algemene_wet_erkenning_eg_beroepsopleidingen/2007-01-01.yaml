  - number: 10.2.d.4
    text: een gereglementeerde opleiding met goed gevolg heeft afgerond, dan wel
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel10
  - number: 10.2.d.5
    text: |-
      tijdens de tien jaren voorafgaande aan de aanvraag als bedoeld in de aanhef gedurende drie aaneengesloten jaren
      voltijds dan wel een gelijkwaardige periode deeltijds het desbetreffende beroep heeft uitgeoefend, en tevens:
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel10
  - number: 10.2.d.5.1°
    text: |-
      aan betrokkene geen aanvullende vereisten worden gesteld op grond van [artikel 11][ref1] of op grond van
      [artikel 12][ref2], dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0006781#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0006781#Artikel12
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006781
        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006781
        artikel: '12'
        hoofdstuk: II
        paragraaf: '2'
  - number: 10.2.d.5.2°
    text: |-
      binnen vier weken nadat betrokkene ten genoegen van de bevoegde autoriteit heeft aangetoond dat hij aan de hiervoor
      onder 1° bedoelde aanvullende vereisten heeft voldaan.
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel10
  - number: '10.3'
    text: |-
      Aan aanvrager wordt binnen de in [artikel 15][ref1] bedoelde termijn bekendgemaakt of de beschikking van de
      bevoegde autoriteit betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0006781#Artikel15
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006781
        artikel: '15'
        hoofdstuk: II
        paragraaf: '2'
  - number: 10.3.a
    text: een afwijzing van de aanvraag,
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel10
  - number: 10.3.b
    text: een toewijzing van de aanvraag, dan wel
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel10
  - number: 10.3.c
    text: |-
      het stellen van aanvullende vereisten als bedoeld in het tweede lid. Daarbij wordt aangegeven op welke praktische
      dan wel theoretische kennis de aanvullende vereisten betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel10
  - number: '11.1'
    text: |-
      Indien de duur van de door een aanvrager met goed gevolg afgesloten kort-hoger-onderwijsopleiding ten minste een
      jaar korter is dan de in Nederland bij of krachtens wet voor de toelating tot het desbetreffende beroep vereiste
      opleiding, kan de bevoegde autoriteit van aanvrager eisen dat hij aantoont te beschikken over beroepservaring.
      Bij een aanvrager die een deeltijdse opleiding dan wel een opleiding als bedoeld in [artikel 2, onder ][ref1],
      heeft gevolgd, wordt in afwijking van het bepaalde in de eerste volzin niet uitgegaan van de duur van de door hem
      gevolgde opleiding, maar van de voltijdse duur van de opleiding als bedoeld in [artikel 2, onder ][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006781#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006781#Artikel2
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006781
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0006781
        artikel: '2'
        hoofdstuk: I
  - number: '11.2'
    text: |-
      Op grond van het eerste lid kan ten hoogste vier jaren beroepservaring worden verlangd, met dien verstande dat
      geëist mag worden:
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel11
  - number: 11.2.a
    text: |-
      een beroepservaring gedurende een periode die het dubbele bedraagt van de ontbrekende periode, wanneer deze periode
      betrekking heeft op een opleiding op het niveau van het hoger onderwijs dan wel op een met een examen af te sluiten
      stage onder toezicht;
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel11
  - number: 11.2.b
    text: |-
      een beroepservaring gedurende een periode die gelijk is aan de ontbrekende periode, wanneer deze periode betrekking
      heeft op praktijkervaring opgedaan onder begeleiding van een geschoolde beroepsbeoefenaar.
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel11
  - number: '11.3'
    text: |-
      De beroepservaring, bedoeld in [artikel 3, onder ][ref1], geldt als beroepservaring als bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0006781#Artikel3
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006781
        artikel: '3'
        hoofdstuk: I
  - number: '11.4'
    text: 'Dit artikel vindt geen toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel11
  - number: 11.4.a
    text: |-
      ten aanzien van aanvrager met het oog op de toelating tot het desbetreffende beroep toepassing is gegeven aan
      [artikel 12][ref1], dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0006781#Artikel12
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006781
        artikel: '12'
        hoofdstuk: II
        paragraaf: '2'
  - number: 11.4.b
    text: |-
      indien voor de toelating tot het beroep een met goed gevolg afgesloten opleiding opgenomen in [bijlage 2][ref1]
      wordt vereist en aanvrager een hoger-onderwijsopleiding onderscheidenlijk een kort-hoger-onderwijsopleiding met
      goed gevolg heeft afgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0006781
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006781
  - number: '12.1'
    text: |-
      Indien de door aanvrager gevolgde opleiding betrekking heeft op vakgebieden die wezenlijk verschillen van die welke
      worden bestreken door de in Nederland voor de toelating tot het desbetreffende beroep bij of krachtens wet vereiste
      opleiding, kan de bevoegde autoriteit van aanvrager verlangen dat hij een proeve van bekwaamheid aflegt dan wel
      een aanpassingsstage van ten hoogste drie onderscheidenlijk twee jaren volgt, indien voor de toelating tot het
      desbetreffende beroep een diploma onderscheidenlijk een certificaat wordt vereist. Indien de bevoegde autoriteit
      van aanvrager verlangt een aanpassingsstage te doorlopen of een proeve van bekwaamheid af te leggen, gaat de
      bevoegde autoriteit eerst na of de kennis die aanvrager tijdens zijn beroepservaring heeft verworven, van dien aard
      is dat het wezenlijke verschil, bedoeld in de eerste volzin, daardoor geheel of ten dele wordt ondervangen.
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel12
  - number: '12.2'
    text: Aanvrager wordt de keuze gelaten of hij een aanpassingsstage doorloopt dan wel een proeve van bekwaamheid aflegt.
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel12
  - number: '13.1'
    text: |-
      In afwijking van [artikel 12, tweede lid][ref1], wordt het afleggen van een proeve van bekwaamheid als aanvullend
      vereiste gesteld indien:


      [ref1]: https://wetten.overheid.nl/BWBR0006781#Artikel12
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006781
        artikel: '12'
        hoofdstuk: II
        paragraaf: '2'
  - number: 13.1.a
    text: |-
      voor de toelating tot het beroep een diploma wordt vereist en aanvrager in het bezit is van een diploma als bedoeld
      in [artikel 2][ref1] dan wel in [artikel 3][ref2], en tevens


      [ref1]: https://wetten.overheid.nl/BWBR0006781#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006781#Artikel3
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006781
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0006781
        artikel: '3'
        hoofdstuk: I
  - number: 13.1.b
    text: |-
      voor het uitoefenen van het beroep waarvoor een EG-verklaring wordt gevraagd, gedetailleerde kennis van onderdelen
      van het Nederlands recht is vereist en het verstrekken van adviezen of het verlenen van bijstand op het gebied van
      het Nederlands recht een wezenlijk onderdeel van de uitoefening van het beroep vormt, dan wel
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel13
  - number: 13.1.c
    text: |-
      voor de toelating tot het beroep een opleiding op het niveau van het hoger onderwijs met een cursusduur van ten
      minste drie jaren wordt vereist.
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel13
  - number: '13.2'
    text: |-
      In afwijking van [artikel 12, tweede lid][ref1], kan de bevoegde autoriteit zich de keuze tussen een
      aanpassingsstage en een proeve van bekwaamheid voorbehouden indien sprake is van een situatie als bedoeld in
      [artikel 10, tweede lid, onder ][ref2], ten vijfde.


