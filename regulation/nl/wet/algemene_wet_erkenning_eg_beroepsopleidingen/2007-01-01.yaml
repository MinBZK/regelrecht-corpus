bwb_id: BWBR0006781
url: https://wetten.overheid.nl/BWBR0006781/2007-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is bij de wet regels te stellen ter uitvoering van
    richtlijn nr. 92/51/EEG van de Raad van de Europese Gemeenschappen van 18 juni 1992 betreffende een tweede algemeen
    stelsel van erkenning van beroepsopleidingen, ter aanvulling van richtlijn nr. 89/48/EEG (PbEG 1992, L 209);

    dat deze regels ten aanzien van onderdanen van de Lid-Staten van de Europese Gemeenschappen de toelating moeten
    waarborgen tot beroepen waarvoor in Nederland een nationaal kort-hoger-onderwijsdiploma dan wel een nationaal
    diploma ter afsluiting van een beroepsopleiding op niet-hoger-onderwijsniveau wordt vereist, indien deze onderdanen
    in één van de overige Lid-Staten gerechtigd zijn overeenkomstige beroepen uit te oefenen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt, voorzover niet anders bepaald, verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Onderwijs, Cultuur en Wetenschap;'
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel1
  - number: 1.b
    text: |-
      [richtlijn 89/48](31989L0048): [richtlijn nr. 89/48/EEG](31989L0048) van de Raad van de Europese Gemeenschappen
      van 21 december 1988, betreffende een algemeen stelsel van erkenning van hoger-onderwijsdiploma’s waarmee
      beroepsopleidingen van ten minste drie jaar worden afgesloten (PbEG 1989, L 019) naar de tekst zoals deze bij die
      richtlijn is vastgesteld;
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel1
  - number: 1.c
    text: |-
      [richtlijn 92/51](31992L0051): [richtlijn nr. 92/51/EEG](31992L0051) van de Raad van de Europese Gemeenschappen
      van 18 juni 1992, betreffende een tweede algemeen stelsel van erkenning van beroepsopleidingen, ter aanvulling van
      [richtlijn nr. 89/48/EEG](31989L0048) (PbEG 1992, L 209) naar de tekst zoals deze bij die richtlijn is vastgesteld;
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel1
  - number: 1.d
    text: 'gereglementeerd beroep: een geheel van activiteiten, al dan niet in loondienst verricht, waarvoor'
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel1
  - number: 1.d.1°
    text: bij of krachtens wet voor de toelating of voor het voeren van een beroepstitel, dan wel
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel1
  - number: 1.d.2°
    text: |-
      indien het beroepen in de gezondheidszorg betreft, krachtens het nationale stelsel van sociale zekerheid voor
      het voor bezoldiging of vergoeding in aanmerking brengen, als vereiste is gesteld het bezit van een nationaal
      getuigschrift;
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel1
  - number: 1.e
    text: |-
      hoger-onderwijsopleiding: een voltijdse opleiding op het niveau van het hoger onderwijs met een cursusduur van ten
      minste drie jaren dan wel een daarmee naar niveau en studielast overeenkomende deeltijdse opleiding, in voorkomende
      gevallen gevolgd door een aanvullende beroepsopleiding;
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel1
  - number: 1.f
    text: |-
      kort-hoger-onderwijsopleiding: een voltijdse opleiding op het niveau van het hoger onderwijs met een cursusduur
      van ten minste één en minder dan drie jaren dan wel een daarmee naar niveau en studielast overeenkomende deeltijdse
      opleiding, in voorkomende gevallen gevolgd door een aanvullende beroepsopleiding;
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel1
  - number: 1.g
    text: 'gereglementeerde opleiding: een opleiding die:'
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel1
  - number: 1.g.1°
    text: specifiek gericht is op een bepaald beroep, en
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel1
  - number: 1.g.2°
    text: |-
      bestaat uit een studiecyclus, in voorkomend geval aangevuld met een beroepsopleiding, beroepsstage of
      praktijkervaring, waarvan structuur en niveau bij of krachtens wet zijn vastgesteld;
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel1
  - number: 1.h
    text: 'bekwaamheidsattest: een bewijsstuk dat een opleiding met goed gevolg is afgesloten, waarbij:'
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel1
  - number: 1.h.a
    text: |-
      het in de aanhef bedoelde bewijsstuk geen onderdeel uitmaakt van een geheel van bewijsstukken dat
      een diploma dan wel een certificaat als bedoeld in [artikel 2][ref1] of [artikel 3][ref2] dan wel
      [artikel 4][ref3] of [artikel 5][ref4] onderscheidenlijk een diploma als bedoeld in [artikel 2][ref5] of
      [artikel 3 van de Algemene wet erkenning EG-hoger-onderwijsdiploma’s][ref6] vormt, en


      [ref1]: https://wetten.overheid.nl/BWBR0006781#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006781#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0006781#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0006781#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0006317#Artikel2
      [ref6]: https://wetten.overheid.nl/BWBR0006317#Artikel3
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006781
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0006781
        artikel: '3'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0006781
        artikel: '4'
        hoofdstuk: I
      - id: ref4
        bwb_id: BWBR0006781
        artikel: '5'
        hoofdstuk: I
      - id: ref5
        bwb_id: BWBR0006317
        artikel: '2'
      - id: ref6
        bwb_id: BWBR0006317
        artikel: '3'
  - number: 1.h.b
    text: |-
      het bewijsstuk is afgegeven in een Lid-Staat anders dan Nederland door het daartoe bij of krachtens wet in die Lid-
      Staat bevoegde gezag, naar aanleiding van een beoordeling van de persoonlijke kwaliteiten, de bekwaamheden of de
      kennis van de aanvrager, die voor de uitoefening van een beroep van essentieel belang worden geacht, zonder dat het
      bewijs van een voorafgaande opleiding is vereist;
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel1
  - number: 1.i
    text: |-
      Lid-Staat: een lidstaat van de Europese Unie, een andere staat die partij is bij de Overeenkomst betreffende de
      Europese Economische Ruimte of Zwitserland;
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel1
  - number: 1.j
    text: 'beroepservaring: de daadwerkelijke en geoorloofde uitoefening van het desbetreffende beroep in een Lid-Staat;'
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel1
  - number: 1.k
    text: |-
      aanpassingsstage: de uitoefening in Nederland van een beroep onder verantwoordelijkheid van een gekwalificeerde
      beoefenaar van het desbetreffende beroep, met in voorkomende gevallen een aanvullende opleiding, teneinde te kunnen
      beoordelen of aanvrager voldoende bekwaamheid bezit om het desbetreffende beroep uit te oefenen;
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel1
  - number: 1.l
    text: |-
      proeve van bekwaamheid: een toets inzake de beroepskennis van aanvrager met betrekking tot vakgebieden die niet
      worden bestreken door de door aanvrager gevolgde opleiding en die wezenlijk zijn voor de uitoefening van het beroep
      in Nederland, teneinde te kunnen beoordelen of aanvrager voldoende bekwaamheid bezit om het desbetreffende beroep
      uit te oefenen;
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel1
  - number: 1.m
    text: |-
      EG-verklaring: een verklaring als bedoeld in [artikel 10, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006781#Artikel10
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006781
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
  - number: '2'
    text: |-
      Een diploma is een bewijsstuk, dan wel een geheel van bewijsstukken, afgegeven in een Lid-Staat anders dan
      Nederland door het daartoe bij of krachtens wet in die Lid-Staat bevoegde gezag, waaruit blijkt dat de bezitter
      voldoet aan de in die Lid-Staat bij of krachtens wet voor de toelating tot een beroep gestelde opleidingsvereisten
      door middel van:
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel2
  - number: 2.a
    text: |-
      een overwegend in een Lid-Staat genoten en met goed gevolg afgesloten kort-hoger-onderwijsopleiding dan wel een
      opleiding opgenomen in [bijlage 2][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0006781
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006781
  - number: 2.b.1°
    text: |-
      een in een Lid-Staat anders dan Nederland genoten en met goed gevolg afgesloten opleiding anders dan een opleiding
      als bedoeld onder *a*,
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel2
  - number: 2.b.2°
    text: |-
      een in een derde land genoten en met goed gevolg afgesloten opleiding die voldoet aan de wettelijke
      bestuursrechtelijke voorschriften van een Lid-Staat, dan wel
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel2
  - number: 2.b.3°
    text: |-
      een in overeenstemming met de opleidingsvereisten voor de toelating tot het beroep in de in de aanhef bedoelde
      Lid-Staat opgedane beroepservaring van ten minste drie jaren, na een in een derde land met goed gevolg afgesloten
      opleiding,
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel2
  - number: '3'
    text: |-
      Indien in de Lid-Staat waar betrokkene een beroep uitoefent dan wel heeft uitgeoefend, voor de toelating tot
      dat beroep geen diploma als bedoeld in [artikel 2][ref1] is vereist, geldt als diploma in de zin van deze
      wet een bewijsstuk, dan wel een geheel van bewijsstukken, a. afgegeven door het daartoe bij of krachtens
      wet in die Lid-Staat bevoegde gezag, b. met betrekking tot 1°. een in een Lid-Staat anders dan Nederland met
      goed gevolg afgesloten kort-hoger-onderwijsopleiding, dan wel 2°. een in een Lid-Staat anders dan Nederland
      met goed gevolg afgesloten opleiding die door de Lid-Staat, bedoeld in de aanhef, als gelijkwaardig met een
      opleiding als bedoeld onder 1° wordt aangemerkt, mits de andere Lid-Staten en de Commissie van de Europese
      Gemeenschappen van deze gelijkwaardigheid in kennis zijn gesteld, die hem op de betrokken beroepsuitoefening
      heeft voorbereid, en c. waaruit blijkt dat betrokkene in de tien jaren voorafgaand aan een aanvraag als bedoeld in
      [artikel 10, eerste lid][ref2], in de in de aanhef bedoelde Lid-Staat gedurende ten minste twee jaren voltijds of
      gedurende een gelijkwaardige periode deeltijds het desbetreffende beroep heeft uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0006781#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006781#Artikel10
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006781
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0006781
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
  - number: '4.1'
    text: |-
      Een certificaat is een bewijsstuk, dan wel een geheel van bewijsstukken, afgegeven in een Lid-Staat anders dan
      Nederland door het daartoe bij of krachtens wet in die Lid-Staat bevoegde gezag, waaruit blijkt dat de bezitter
      voldoet aan de in die Lid-Staat bij of krachtens wet voor de toelating tot een beroep gestelde opleidingsvereisten
      door middel van een overwegend in een Lid-Staat genoten en in de eerstbedoelde Lid-Staat met goed gevolg afgesloten
      opleiding op niet-hoger-onderwijsniveau al dan niet van technische of beroepsmatige aard, gevolgd door:
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel4
  - number: 4.1.a
    text: |-
      hetzij een beroepsopleiding anders dan een kort-hoger-onderwijsopleiding, die wordt gegeven aan een
      onderwijsinstelling of in een bedrijf, of afwisselend aan een onderwijsinstelling en in een bedrijf, in voorkomend
      geval aangevuld met de stage of praktijkervaring die naast deze beroepsopleiding is vereist,
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel4
  - number: 4.1.b
    text: |-
      hetzij de stage of periode van praktijkervaring die bij de desbetreffende in de aanhef bedoelde opleiding is
      vereist.
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel4
  - number: '4.2'
    text: |-
      Het vermelde in [artikel 2, aanhef en onder ][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006781#Artikel2
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006781
        artikel: '2'
        hoofdstuk: I
  - number: '5'
    text: |-
      Indien in de Lid-Staat waar betrokkene een beroep uitoefent dan wel heeft uitgeoefend, voor de toelating tot dat
      beroep geen certificaat als bedoeld in [artikel 4][ref1] is vereist, geldt als certificaat in de zin van deze wet
      een bewijsstuk, dan wel een geheel van bewijsstukken, a. afgegeven door het daartoe bij of krachtens wet in de in
      de aanhef bedoelde Lid-Staat bevoegde gezag, b. met betrekking tot 1°. een in een Lid-Staat anders dan Nederland
      met goed gevolg afgesloten opleiding op niet-hoger-onderwijsniveau al dan niet van technische of beroepsmatige
      aard, gevolgd door: a. hetzij een beroepsopleiding anders dan een kort-hoger-onderwijsopleiding, die wordt gegeven
      aan een onderwijsinstelling of in een bedrijf, of afwisselend aan een onderwijsinstelling en in een bedrijf, in
      voorkomend geval aangevuld met de stage of praktijkervaring die naast deze beroepsopleiding is vereist, b. hetzij
      de stage of periode van praktijkervaring die in de desbetreffende in de aanhef bedoelde opleiding is vereist,
      dan wel 2°. een in een Lid-Staat anders dan Nederland met goed gevolg afgesloten opleiding die door de Lid-Staat,
      bedoeld in de aanhef, als gelijkwaardig met een opleiding als bedoeld onder 1° wordt aangemerkt, mits de andere
      Lid-Staten en de Commissie van de Europese Gemeenschappen van deze gelijkwaardigheid in kennis zijn gesteld, die
      hem op de betrokken beroepsuitoefening heeft voorbereid, en c. waaruit blijkt dat betrokkene in de tien jaren
      voorafgaand aan een aanvraag als bedoeld in [artikel 10, eerste lid][ref2], in de in de aanhef bedoelde Lid-Staat
      gedurende ten minste twee jaren voltijds of gedurende een gelijkwaardige periode deeltijds het desbetreffende
      beroep heeft uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0006781#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006781#Artikel10
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006781
        artikel: '4'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0006781
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
  - number: '6.1'
    text: |-
      Onverminderd de toepassing van de Algemene wet erkenning EG-hoger-onderwijsdiploma’s is de onderhavige wet van
      toepassing op een gereglementeerd beroep als bedoeld in [artikel 1, onder ][ref1], tenzij bij of krachtens wet ten
      aanzien van een gereglementeerd beroep is geïmplementeerd:


      [ref1]: https://wetten.overheid.nl/BWBR0006781#Artikel1
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006781
        artikel: '1'
        hoofdstuk: I
  - number: 6.1.a
    text: |-
      een richtlijn opgenomen in [bijlage 1][ref1], dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0006781
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006781
  - number: 6.1.b
    text: |-
      een separate Richtlijn inzake de onderlinge erkenning van de diploma's, certificaten en andere titels die de Raad
      van de Europese Gemeenschappen ten aanzien van het betrokken beroep heeft vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel6
  - number: '6.2'
    text: |-
      Indien met toepassing van artikel 15 van de [richtlijn 92/51](31992L0051) wijzigingen worden aangebracht in de
      lijsten van opleidingen, die in de bijlagen C en D van die richtlijn zijn opgenomen, worden deze wijzigingen door
      Onze Minister ambtshalve in [bijlage 2][ref1], voor zover het betreft wijzigingen in bijlage C van die richtlijn,
      en in [bijlage 3][ref2], voor zover het betreft wijzigingen in bijlage D van die richtlijn, aangebracht en bekend
      gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0006781
      [ref2]: https://wetten.overheid.nl/BWBR0006781
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006781
      - id: ref2
        bwb_id: BWBR0006781
  - number: '6.3'
    text: Onze Minister maakt bekend in de Staatscourant
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel6
  - number: 6.3.a
    text: op welke beroepen deze wet in ieder geval van toepassing is;
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel6
  - number: 6.3.b
    text: |-
      indien ingevolge het tweede lid [bijlage 2][ref1] dan wel [bijlage 3][ref2] zijn gewijzigd, welke wijzigingen in
      die bijlagen zijn aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006781
      [ref2]: https://wetten.overheid.nl/BWBR0006781
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006781
      - id: ref2
        bwb_id: BWBR0006781
  - number: '7.1'
    text: |-
      Een onderdaan van een Lid-Staat die ten aanzien van een gereglementeerd beroep in het bezit is van een EG-
      verklaring, voldoet aan de in Nederland bij of krachtens wet voor de toelating tot het desbetreffende beroep
      gestelde opleidingsvereisten.
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel7
  - number: '7.2'
    text: |-
      In afwijking van het eerste lid voldoet de onderdaan van een Lid-Staat die toelating verlangt tot een
      gereglementeerd beroep waarvoor een Nederlands bekwaamheidsattest wordt vereist, aan de opleidingsvereisten indien
      hij:
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel7
  - number: 7.2.a
    text: |-
      in het bezit is van een bekwaamheidsattest dat door een Lid-Staat anders dan Nederland voor de toelating tot het
      desbetreffende beroep is voorgeschreven, dan wel
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel7
  - number: 7.2.b
    text: |-
      in een Lid-Staat anders dan Nederland behaalde kwalificaties overlegt welke in het bijzonder met betrekking tot
      de gezondheid, de veiligheid, de milieubescherming en de consumentenbescherming garanties bieden die gelijkwaardig
      zijn aan de garanties welke bij of krachtens de wet in Nederland vereist zijn.
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel7
  - number: '7.3'
    text: |-
      In afwijking van het eerste lid voldoet de onderdaan die toelating verlangt tot een gereglementeerd beroep
      waarvoor slechts het bezit is vereist van een bewijsstuk dat met goed gevolg een algemene opleiding op het niveau
      van het Nederlandse basisonderwijs dan wel secundair onderwijs is afgerond, aan de opleidingsvereisten indien
      hij in het bezit is van een bewijsstuk van een opleiding van het overeenkomstige niveau dat in een Lid-Staat
      anders dan Nederland is afgegeven door een bevoegde instantie die is aangewezen overeenkomstig de wettelijke en
      bestuursrechtelijke bepalingen van die Lid-Staat.
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel7
  - number: '8.1'
    text: |-
      Onze Minister die het aangaat, is bevoegd tot afgifte van een EG-verklaring aan een onderdaan van een Lid-Staat die
      toelating tot een gereglementeerd beroep in Nederland verlangt.
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel8
  - number: '8.2'
    text: |-
      Bij algemene maatregel van bestuur, op de voordracht van Onze Minister, mede namens Onze Minister die het aangaat,
      kan ten aanzien van een gereglementeerd beroep, in afwijking van het in het eerste lid bepaalde, een andere
      bevoegde autoriteit worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel8
  - number: '9.1'
    text: |-
      Indien de toelating tot een gereglementeerd beroep mede afhankelijk is gesteld van het bezit van een verklaring
      omtrent het gedrag, afgegeven volgens de [Wet justitiële en strafvorderlijke gegevens][ref1] dan wel een document
      betreffende de lichamelijke of geestelijke gezondheid geldt als zodanig een met die verklaring of dat document
      overeenkomend document, afgegeven door het daartoe bevoegde gezag in de Lid-Staat van oorsprong of herkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0014194
  - number: '9.2'
    text: |-
      Indien in de Lid-Staat van oorsprong of herkomst een met de in het eerste lid bedoelde verklaring omtrent het
      gedrag overeenkomend document niet wordt afgegeven, kan betrokkene volstaan met het afleggen van een verklaring
      onder ede dan wel een plechtige verklaring ten overstaan van een daartoe bij of krachtens wet in die Lid-Staat
      bevoegde instantie dan wel ten overstaan van een notaris of een in die Lid-Staat bevoegde beroepsorganisatie, welke
      een attest afgeeft dat deze eed of plechtige verklaring bewijskracht heeft.
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel9
  - number: '9.3'
    text: |-
      Indien in de Lid-Staat van oorsprong of herkomst een met de in het eerste lid bedoelde verklaring betreffende
      de lichamelijke of geestelijke gezondheid overeenkomend document niet wordt verlangd, kan betrokkene volstaan
      met een in die Lid-Staat door een bevoegde instantie afgegeven verklaring, die overeenstemt met de in Nederland
      gebruikelijke verklaring.
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel9
  - number: '9.4'
    text: |-
      Indien een bewijs van financiële draagkracht is vereist voor de toegang tot of de uitoefening van een
      gereglementeerd beroep, zijn attesten die zijn afgegeven door een financiële instelling in de lidstaat van
      oorsprong of herkomst gelijkwaardig aan die welke in Nederland worden afgegeven.
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel9
  - number: '9.5'
    text: |-
      Indien Onze Minister die het aangaat, van een eigen onderdaan die toelating verlangt tot een gereglementeerd
      beroep, eist dat deze verzekerd is tegen de financiële risico's van zijn beroepsaansprakelijkheid, aanvaardt hij
      een attest van een verzekeraar in een andere lidstaat als gelijkwaardig aan een attest dat in Nederland wordt
      afgegeven. Het attest vermeldt dat de verzekeraar de in Nederland van kracht zijnde bepalingen heeft nageleefd voor
      wat betreft de voorwaarden en de reikwijdte van de dekking.
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel9
  - number: '9.6'
    text: |-
      De in het eerste, tweede, derde en vijfde lid bedoelde verklaringen, documenten of attesten mogen bij indiening van
      een aanvraag als bedoeld in [artikel 10, eerste lid][ref1], niet ouder zijn dan drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0006781#Artikel10
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006781
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
  - number: '10.1'
    text: |-
      Een onderdaan van een Lid-Staat die in Nederland op grond van de onderhavige wet wil worden toegelaten tot een
      gereglementeerd beroep, kan, tenzij hij:
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel10
  - number: 10.1.a
    text: |-
      toelating verlangt tot een beroep als bedoeld in [artikel 1, onder ][ref1], en tevens


      [ref1]: https://wetten.overheid.nl/BWBR0006317#Artikel1
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel10
    references:
