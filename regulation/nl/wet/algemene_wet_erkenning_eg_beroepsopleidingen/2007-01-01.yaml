        bwb_id: BWBR0006317
        artikel: '1'
  - number: 10.1.b
    text: |-
      in het bezit is van een diploma als bedoeld in [artikel 2][ref1] dan wel [artikel 3 van de onder ][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0006781#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006317#Artikel10
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel10
