    text: |-
      in het bezit is van een diploma als bedoeld in [artikel 2][ref1] dan wel [artikel 3][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0006781#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006781#Artikel3
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel10
