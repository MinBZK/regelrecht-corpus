      [artikel 3 van de Algemene wet erkenning EG-hoger-onderwijsdiploma's][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0006317#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006317#Artikel3
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel10
