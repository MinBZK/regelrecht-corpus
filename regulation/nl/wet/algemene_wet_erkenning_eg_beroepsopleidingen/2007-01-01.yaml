  - number: '13.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen andere dan de in het eerste lid bedoelde beroepen worden aangewezen
      waarvoor de bevoegde autoriteit een uitzondering kan maken op het keuzerecht van de aanvrager.
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel13
  - number: '14'
    text: |-
      Onze Minister die het aangaat geeft per gereglementeerd beroep regels ten aanzien van de aanvraag tot het
      verkrijgen van een EG-verklaring, de aanpassingsstage en de proeve van bekwaamheid. Deze regels hebben in ieder
      geval betrekking op de documenten die bij de aanvraag moeten worden gevoegd alsmede op de beoordeling van de
      aanpassingsstage en de proeve van bekwaamheid.
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel14
  - number: '15'
    text: De bevoegde autoriteit beslist over de aanvraag binnen vier maanden nadat zij de aanvraag heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel15
  - number: '35'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel35
  - number: '36'
    text: 'Deze wet wordt aangehaald als: Algemene wet erkenning EG-beroepsopleidingen.'
    url: https://wetten.overheid.nl/BWBR0006781/2007-01-01#Artikel36
