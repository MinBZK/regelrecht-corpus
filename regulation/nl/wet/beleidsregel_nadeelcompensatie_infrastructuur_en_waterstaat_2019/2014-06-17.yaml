        artikel: '20'
        hoofdstuk: '3'
  - number: '2.1'
    text: |-
      De minister kent degene die schade lijdt of zal lijden als gevolg van de rechtmatige uitoefening door of namens de
      minister van een aan het publiekrecht ontleende bevoegdheid of taak, op verzoek een vergoeding toe, voor zover de
      schade redelijkerwijze niet of niet geheel te zijnen laste behoort te blijven en voor zover de vergoeding niet of
      niet voldoende anderszins is verzekerd.
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel2
  - number: '2.2'
    text: |-
      Bij het nemen van een besluit omtrent schadevergoeding als bedoeld in het eerste lid wordt het bepaalde in de
      [artikelen 3 tot en met 11][ref1] in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0010692#Artikel3
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0010692
        artikel: '3'
        hoofdstuk: '1'
  - number: '2.3'
    text: |-
      De vergoeding wordt bepaald in geld. Nochtans kan de minister de vergoeding toe kennen in andere vorm dan betaling
      van een geldsom.
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel2
  - number: '3.1'
    text: |-
      Binnen het normaal maatschappelijk risico of het normaal ondernemersrisico vallende schade komt niet voor
      vergoeding in aanmerking.
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel3
  - number: '3.2'
    text: |-
      Schade die minder bedraagt dan € 1.000,– valt in ieder geval binnen het normaal maatschappelijk risico of het
      normaal ondernemersrisico.
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel3
  - number: 3a.1
    text: |-
      Onverminderd [artikel 2, eerste lid][ref1], valt schade ten gevolge van een infrastructurele maatregel in ieder
      geval binnen het normaal ondernemersrisico indien de schade het gevolg is van een tijdelijke omzetdaling dan wel
      een tijdelijke kostenstijging en die omzetdaling dan wel kostenstijging niet uitgaat boven de drempelwaarde van 15%
      van de normomzet op jaarbasis dan wel de normkosten op jaarbasis.


      [ref1]: https://wetten.overheid.nl/BWBR0010692#Artikel2
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0010692
        artikel: '2'
        hoofdstuk: '1'
  - number: 3a.2
    text: |-
      Indien de infrastructurele maatregel naar aard, duur of voorzienbaarheid bijzonder dan wel uitzonderlijk is, kan de
      Minister een lager drempelpercentage dan bedoeld in het eerste lid toepassen.
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel3a
  - number: 3a.3
    text: |-
      Voorts kan de Minister een lager drempelpercentage dan bedoeld in het eerste en tweede lid, toepassen, indien op
      aangeven van verzoeker bijzondere omstandigheden, die verband houden met de ernst van de schade voor de onderneming
      van verzoeker, daartoe aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel3a
  - number: 3a.4
    text: |-
      Indien de omzetdaling dan wel kostenstijging de drempelwaarde, bedoeld in het eerste, tweede of derde lid,
      overstijgt, wordt door de Minister ter bepaling van het normaal ondernemersrisico een kortingspercentage gehanteerd
      ten aanzien van de geleden schade.
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel3a
  - number: '4'
    text: |-
      Schade als gevolg van een schadeoorzaak als bedoeld in [artikel 2, eerste lid][ref1], komt alleen voor vergoeding
      in aanmerking wanneer deze in belangrijke mate afwijkt van de schade die dientengevolge op een ieder drukt, dan wel
      wanneer deze schade op een naar verhouding gering aantal natuurlijke of rechtspersonen die in vergelijkbare positie
      verkeren drukt.


      [ref1]: https://wetten.overheid.nl/BWBR0010692#Artikel2
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0010692
        artikel: '2'
        hoofdstuk: '1'
  - number: '5'
    text: |-
      Schade ten gevolge van een schadeoorzaak als bedoeld in [artikel 2, eerste lid][ref1], die voor de belanghebbende
      redelijkerwijs voorzienbaar was ten tijde van de beslissing te investeren in het geschade belang wordt niet
      vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0010692#Artikel2
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010692
        artikel: '2'
        hoofdstuk: '1'
  - number: '6'
    text: |-
      De in [artikel 5][ref1] bedoelde voorzienbaarheid kan onder meer betrekking hebben op de aard van een schadeoorzaak
      als bedoeld in [artikel 2, eerste lid][ref2], op het tijdstip waarop deze schadeoorzaak zijn werking doet gevoelen,
      op de plaats waarop ze betrekking heeft, op de wijze van voltrekken of uitvoering daarvan, alsmede op de aard en
      omvang van de daardoor veroorzaakte schade.


      [ref1]: https://wetten.overheid.nl/BWBR0010692#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0010692#Artikel2
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0010692
        artikel: '5'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0010692
        artikel: '2'
        hoofdstuk: '1'
  - number: '7'
    text: |-
      Geen vergoeding wordt toegekend indien de verzoeker heeft nagelaten zijn belang te verwezenlijken toen hij daartoe
      redelijkerwijs in de gelegenheid was, terwijl hij redelijkerwijs kon voorzien dat een maatregel genomen zou worden
      die aan dat realiseren in de weg zou komen te staan.
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel7
  - number: '8.1'
    text: |-
      Heeft verzoeker nagelaten redelijke maatregelen ter voorkoming of beperking van schade te nemen, dan blijft de
      schade die door het treffen van zodanige maatregelen voorkomen of beperkt had kunnen worden, ten laste van de
      verzoeker.
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel8
  - number: '8.2'
    text: De redelijke kosten van maatregelen ter voorkoming of beperking van schade behoren tot de te vergoeden schade.
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel8
  - number: '9'
    text: |-
      Heeft een schadeoorzaak als bedoeld in [artikel 2,eerste lid][ref1] voor de benadeelde naast schade tevens voordeel
      opgeleverd, dan moet dit voordeel bij de vaststelling van de te vergoeden schade in aanmerking worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0010692#Artikel2
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0010692
        artikel: '2'
        hoofdstuk: '1'
  - number: '10'
    text: |-
      Indien bij de indiening en de behandeling van het verzoek zowel het inroepen van rechts dan wel andere
      deskundigenbijstand, als de kosten daarvan redelijk zijn te achten, kunnen deze kosten voor vergoeding in
      aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel10
  - number: '11'
    text: |-
      Een vergoeding van wettelijke rente als bedoeld in [artikel 6:119 van het Burgerlijk Wetboek][ref1] kan deel
      uitmaken van de toe te kennen vergoeding. Het tijdstip waarop de wettelijke rente ingaat wordt gesteld op de datum
      van ontvangst van het verzoek door de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel119
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '119'
  - number: '12.1'
    text: |-
      Het verzoek om schadevergoeding wordt zo spoedig als redelijkerwijs mogelijk is schriftelijk bij de minister
      ingediend.
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel12
  - number: '12.2'
    text: |-
      De minister kan een verzoek afwijzen indien vijf jaren zijn verlopen na de aanvang van de dag, volgende op
      die waarop de benadeelde zowel met de schade als met de omstandigheid dat deze schade is veroorzaakt door een
      schadeoorzaak als bedoeld in [artikel 2, eerste lid][ref1] bekend is geworden, en in ieder geval door verloop van
      twintig jaren na de gebeurtenis waardoor de schade is veroorzaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0010692#Artikel2
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0010692
        artikel: '2'
        hoofdstuk: '1'
  - number: '12.3'
    text: |-
      Heeft verzoeker, vóórdat de termijn is verstreken na verloop waarvan de minister het verzoek kan afwijzen, een
      schriftelijke mededeling aan de minister gedaan waarin verzoeker ondubbelzinnig verklaart dat hij zich het recht
      voorbehoudt om een verzoek om schadevergoeding als bedoeld in [artikel 2][ref1] in te dienen, dan begint een nieuwe
      termijn als bedoeld in het tweede lid te lopen na de aanvang van de dag, volgende op die waarop deze schriftelijke
      mededeling is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0010692#Artikel2
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0010692
        artikel: '2'
        hoofdstuk: '1'
  - number: '13.1'
    text: 'Het verzoek wordt ondertekend en bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel13
  - number: 13.1.a
    text: de naam en het adres van de verzoeker;
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel13
  - number: 13.1.b
    text: de dagtekening;
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel13
  - number: 13.1.c
    text: |-
      een aanduiding van het besluit of het handelen dat de gestelde schade naar het oordeel van verzoeker heeft
      veroorzaakt; d. een vermelding van de reden of redenen waarom de minister gehouden zou zijn de schade te vergoeden
      die het gevolg is van het onder c bedoelde handelen;
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel13
  - number: 13.1.e
    text: zo redelijkerwijs mogelijk een opgave van de aard en de omvang van de schade;
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel13
  - number: 13.1.f
    text: zo redelijkerwijs mogelijk een specificatie van het bedrag van de schade;
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel13
  - number: 13.1.g
    text: |-
      een omschrijving van de wijze waarop de schade naar het oordeel van verzoeker dient te worden vergoed en, zo een
      vergoeding in geld wordt gewenst, een opgave van het schadebedrag, dat naar het oordeel van verzoeker vergoed dient
      te worden.
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel13
  - number: '13.2'
    text: |-
      De minister bevestigt de ontvangst van het verzoek zo spoedig mogelijk, doch tenminste binnen twee weken na de
      ontvangst ervan, en stelt de verzoeker in kennis van de te volgen procedure.
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel13
  - number: '13.3'
    text: |-
      Indien naar het oordeel van de minister niet of onvoldoende is voldaan aan het bepaalde in het eerste lid, of
      indien verzoeker overigens verzuimt de gegevens en bescheiden die voor de beslissing op de aanvraag nodig zijn en
      waarover hij redelijkerwijs de beschikking kan krijgen te verschaffen, stelt hij de verzoeker in de gelegenheid het
      verzuim te herstellen binnen een door de minister te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel13
  - number: '14'
    text: Vereenvoudigde behandeling van het verzoek
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel14
  - number: '14.1'
    text: |-
      De minister neemt het verzoek niet in behandeling indien het niet overeenkomstig het bepaalde in [artikel 13][ref1]
      is ingediend en van de geboden gelegenheid om het verzoek aan te vullen niet tijdig, of onvoldoende is gebruik
      gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0010692#Artikel13
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0010692
        artikel: '13'
        hoofdstuk: '2'
  - number: '14.2'
    text: |-
      Een besluit om het verzoek niet in behandeling te nemen wordt aan de verzoeker bij aangetekende brief medegedeeld
      binnen vier weken nadat het verzoek is aangevuld of nadat de daarvoor gestelde termijn ongebruikt is verstreken.
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel14
  - number: '14.3'
    text: |-
      De minister wijst het verzoek zonder nader onderzoek af indien het naar zijn oordeel kennelijk ongegrond is. Een
      verzoek is onder meer kennelijk ongegrond wanneer het naar het oordeel van de minister steunt op de onrechtmatige
      uitoefening door of namens de minister van een aan het publiekrecht ontleende bevoegdheid of taak en wanneer
      toepassing wordt gegeven aan [artikel 12, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010692#Artikel12
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0010692
        artikel: '12'
        hoofdstuk: '2'
  - number: '14.4'
    text: |-
      Een besluit om het verzoek wegens kennelijke ongegrondheid af te wijzen wordt aan de verzoeker bij aangetekende
      brief medegedeeld binnen acht weken na ontvangst van het verzoek, dan wel binnen acht weken nadat de termijn is
      verstreken gedurende welke de verzoeker het verzoek kon aanvullen.
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel14
  - number: '14.5'
    text: |-
      De minister kan de in het vorige lid genoemde termijn eenmaal met ten hoogste acht weken verlengen. De minister
      stelt de verzoeker daarvan schriftelijk in kennis.
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel14
  - number: '15.1'
    text: |-
      Indien geen toepassing wordt gegeven aan het bepaalde in [artikel 14, eerste en derde lid][ref1], stelt de minister
      een commissie in.


      [ref1]: https://wetten.overheid.nl/BWBR0010692#Artikel14
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0010692
        artikel: '14'
        hoofdstuk: '2'
  - number: '15.2'
    text: De commissie heeft tot taak de minister van advies te dienen over de op het verzoek te nemen beslissing.
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel15
  - number: '15.3'
    text: |-
      De commissie bestaat uit drie onafhankelijke deskundigen, die door de minister worden benoemd. In eenvoudige
      gevallen kan de minister volstaan met de benoeming van één onafhankelijke deskundige. Indien de commissie uit drie
      leden bestaat, wijst de minister de voorzitter aan.
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel15
  - number: '15.4'
    text: |-
      De commissie wordt ingesteld uiterlijk vier weken na het verstrijken van de termijn bedoeld in
      [artikel 14, vierde lid][ref1], dan wel indien het vijfde lid van dat artikel toepassing heeft gevonden, uiterlijk
      vier weken na het verstrijken van de in dat artikellid genoemde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0010692#Artikel14
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0010692
        artikel: '14'
        hoofdstuk: '2'
  - number: '15.5'
    text: |-
      De minister stelt de verzoeker in kennis van zijn voornemen om een commissie in te stellen. De kennisgeving
      bevat de namen van de deskundigen, hun beroep en de plaats waar zij hun werkzaamheden plegen te verrichten. De
      belanghebbende kan binnen twee weken na verzending van de kennisgeving bedenkingen uiten tegen de voorgenomen
      samenstelling.
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel15
  - number: '16.1'
    text: |-
      De commissie dient de minister van advies over de op het verzoek te nemen beslissing. Zij stelt daartoe, voorzover
      een zorgvuldige advisering daartoe noopt, een onderzoek in naar:
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel16
  - number: 16.1.a
    text: |-
      de vraag of de door verzoeker in zijn verzoek gestelde schade een gevolg is van de in het verzoek aangeduide
      schadeoorzaak, indien en voorzover deze als een rechtmatige uitoefening door of namens de minister van een aan het
      publiekrecht ontleende bevoegdheid of taak als bedoeld in [artikel 2, eerste lid][ref1] kan worden aangemerkt;


      [ref1]: https://wetten.overheid.nl/BWBR0010692#Artikel2
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0010692
        artikel: '2'
        hoofdstuk: '1'
  - number: 16.1.b
    text: de omvang van de schade als bedoeld onder a;
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel16
  - number: 16.1.c
    text: |-
      de vraag of deze schade redelijkerwijs niet of niet geheel ten laste van de benadeelde behoort te blijven, zulks
      met inachtneming van het in [artikel 3 tot en met 11][ref1] bepaalde;


      [ref1]: https://wetten.overheid.nl/BWBR0010692#Artikel3
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0010692
        artikel: '3'
        hoofdstuk: '1'
  - number: 16.1.d
    text: de vraag of vergoeding van de schade niet, of niet voldoende, anderszins is verzekerd.
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel16
  - number: '16.2'
    text: |-
      De commissie brengt rapport uit over haar bevindingen. Zij adviseert de minister over de hoogte van de uit te
      keren schadevergoeding en doet, indien de minister een daartoe strekkende verzoek heeft gedaan, voorstellen voor
      maatregelen of voorzieningen waardoor de schade, anders dan door een vergoeding in geld, kan worden beperkt of
      ongedaan gemaakt.
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel16
  - number: '17.1'
    text: |-
      De minister stelt de commissie, al dan niet op verzoek, de gegevens ter beschikking die nodig zijn voor een
      goede vervulling van haar taak. [Artikel 10 van de Wet openbaarheid van bestuur][ref1] (Stb. 1991, 703) is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '17.2'
    text: |-
      De verzoeker verschaft de commissie de gegevens en bescheiden die voor de advisering nodig zijn en waarover hij
      redelijkerwijs de beschikking kan krijgen.
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel17
  - number: '17.3'
    text: |-
      De commissie kan inlichtingen en adviezen inwinnen bij derden. Indien met het verstrekken van inlichtingen, of het
      verlenen van adviezen door derden kosten gemoeid zijn, oefent de commissie deze bevoegdheid eerst uit na instemming
      van de minister.
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel17
  - number: '17.4'
    text: De commissie kan een plaatsopneming houden, indien zij dit nodig acht.
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel17
  - number: '18.1'
    text: De commissie stelt de verzoeker in kennis van de te volgen procedure.
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel18
  - number: '18.2'
    text: |-
      De commissie stelt verzoeker en de minister in de gelegenheid tot het geven van een mondelinge toelichting. Beiden
      kunnen zich laten bijstaan of vertegenwoordigen door een gemachtigde.
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel18
  - number: '18.3'
    text: Meegebrachte deskundigen worden in de gelegenheid gesteld een toelichting te geven.
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel18
  - number: '18.4'
    text: Van de toelichtingen wordt een verslag opgemaakt. Het verslag wordt aan verzoeker en de minister toegezonden.
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel18
  - number: '18.5'
    text: |-
      Alvorens de commissie haar definitieve advies opstelt, maakt zij een conceptadvies op. Dit conceptadvies wordt
      uiterlijk zesentwintig weken nadat de commissie is ingesteld, aan verzoeker en aan de minister toegezonden.
      Indien niet binnen deze termijn een conceptadvies opgemaakt kan worden, deelt de commissie verzoeker en de
      minister gemotiveerd mede, waarom deze termijn overschreden wordt. Zij geeft daarbij een termijn aan waarbinnen
      het conceptadvies aan verzoeker en aan de minister zal worden toegezonden. Deze termijn bedraagt ten hoogste
      zesentwintig weken.
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel18
  - number: '18.6'
    text: |-
      Verzoeker en de minister maken eventuele bedenkingen tegen het conceptadvies, uiterlijk acht weken na de datum van
      verzending daarvan, schriftelijk aan de commissie kenbaar.
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel18
  - number: '18.7'
    text: |-
      De commissie stelt haar advies vast binnen acht weken na het verstrijken van de in het zesde lid genoemde termijn.
      Zij kan deze termijn, onder opgaaf van redenen, eenmaal met ten hoogste acht weken verlengen. Zij zendt het advies
      terstond toe aan de verzoeker en aan de minister.
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel18
  - number: '19.1'
    text: |-
      De minister beslist binnen twaalf weken na ontvangst van het advies van de commissie op het verzoek om
      schadevergoeding en maakt dit besluit binnen deze termijn bekend aan verzoeker. De minister zendt een kopie van
      zijn besluit aan de commissie.
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel19
  - number: '19.2'
    text: |-
      De minister kan de beslissing bedoeld in het eerste lid, onder opgaaf van redenen, eenmaal voor ten hoogste twaalf
      weken verdagen.
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel19
  - number: '20.1'
    text: |-
      De minister kent de verzoeker die naar redelijke verwachting in aanmerking komt voor een vergoeding in geld als
      bedoeld in [artikel 2][ref1] en wiens belang naar het oordeel van de minister vordert dat aan hem een voorschot
      op deze vergoeding wordt toegekend, op diens schriftelijk verzoek een voorschot toe. De minister beslist op het
      verzoek, gehoord de commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0010692#Artikel2
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0010692
        artikel: '2'
        hoofdstuk: '1'
  - number: '20.2'
    text: |-
      Indien de minister beslist tot het verlenen van een voorschot wordt daarmee geen aanspraak als bedoeld in
      [artikel 2][ref1] erkend.


      [ref1]: https://wetten.overheid.nl/BWBR0010692#Artikel2
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0010692
        artikel: '2'
        hoofdstuk: '1'
  - number: '20.3'
    text: |-
      Het voorschot kan uitsluitend worden verleend indien de verzoeker schriftelijk de verplichting aanvaardt tot gehele
      en onvoorwaardelijke terugbetaling van hetgeen ten onrechte als voorschot is uitbetaald, zulks te vermeerderen met
      de wettelijke rente over het teveel betaalde te rekenen vanaf de datum van betaling van het voorschot. De minister
      kan daarvoor zekerheidstelling, bij voorbeeld in de vorm van een bankgarantie, verlangen.
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel20
  - number: '21'
    text: 'Deze regeling wordt aangehaald als: Beleidsregel nadeelcompensatie Infrastructuur en Milieu 2014.'
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel21
  - number: '22'
    text: |-
      Deze regeling treedt in werking met ingang van 15 september 1999 en is van toepassing op verzoeken die vanaf deze
      datum zijn ingediend.
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel22
  - number: '23'
    text: |-
      De Regeling nadeelcompensatie Rijkswaterstaat (Stcrt. 1991, 251) wordt ingetrokken met ingang van de in
      [artikel 22][ref1] genoemde datum. Op verzoeken die vóór deze datum zijn ingediend blijft de Regeling
      nadeelcompensatie Rijkswaterstaat van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010692#Artikel22
    url: https://wetten.overheid.nl/BWBR0010692/2014-06-17#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0010692
        artikel: '22'
        hoofdstuk: '3'
