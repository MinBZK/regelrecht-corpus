articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            de minister:

              de Minister van Infrastructuur en Milieu;



            de commissie:

              het adviesorgaan bedoeld in [artikel 15, eerste lid][ref1];



            de normkosten:

              de kosten die naar redelijke verwachting gemaakt zouden zijn, indien de schadeoorzaak, bedoeld in
      [artikel 2, eerste lid][ref2], niet had plaatsgevonden;



            de normomzet:

              de omzet die naar redelijke verwachting behaald zou zijn, indien de schadeoorzaak, bedoeld in
      [artikel 2, eerste lid][ref3], niet had plaatsgevonden;



            verzoek:

              een verzoek om schadevergoeding als bedoeld in [artikel 13][ref4], dan wel [artikel 20][ref5];



            verzoeker:

              de indiener van een verzoek als bedoeld in [artikel 13][ref6] dan wel [artikel 20][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0010692#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0010692#Artikel2
