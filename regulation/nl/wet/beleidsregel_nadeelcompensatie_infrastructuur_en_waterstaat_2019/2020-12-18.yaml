    tot vaststelling van de navolgende beleidsregeling.
  url: https://wetten.overheid.nl/BWBR0010692/2020-12-18#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze beleidsregel wordt verstaan onder: - *infrastructurele maatregel:* maatregel die verband houdt
      met de aanleg, de wijziging, het beheer en het onderhoud van rijkswaterstaatswerken, rijkswateren en de
      hoofdspoorweginfrastructuur;
        - *minister:* Minister van Infrastructuur en Waterstaat;
        - *normale infrastructurele maatregel:* infrastructurele maatregel die als een normale maatschappelijke
      ontwikkeling kan worden gezien;
        - *normbrutowinstmarge:* omzet minus de inkoopwaarde van de afzet op jaarbasis, uitgedrukt in een
      percentage van de omzet, dat naar redelijke verwachting behaald zou zijn, als de schadeoorzaak, bedoeld in
      [artikel 2, eerste lid][ref1], niet had plaatsgevonden;
        - *normkosten:* **kosten op jaarbasis die naar redelijke verwachting gemaakt zouden zijn, als de schadeoorzaak,
      bedoeld in [artikel 2, eerste lid][ref2], niet had plaatsgevonden;
        - *normomzet:* omzet op jaarbasis die naar redelijke verwachting behaald zou zijn, als de schadeoorzaak, bedoeld in
      [artikel 2, eerste lid][ref3], niet had plaatsgevonden;
        - *verzoek:* verzoek om schadevergoeding als bedoeld in [artikel 13][ref4] of [artikel 20][ref5];
        - *verzoeker:* **indiener van een verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0010692#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010692#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0010692#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0010692#Artikel13
      [ref5]: https://wetten.overheid.nl/BWBR0010692#Artikel20
    url: https://wetten.overheid.nl/BWBR0010692/2020-12-18#Artikel1
    references:
