      1 De "Grundschulden", welke op grond van het Duitse "Gesetz zur Sicherung von Forderungen für den Lastenausgleich"
      van 2 september 1948 zijn ontstaan in de gebieden, bedoeld in artikel 6 van het Grensverdrag, worden, voorzover zij
      niet reeds eerder zijn tenietgegaan, opgeheven.

      2 De bedragen, welke uit hoofde van "Grundschulden", ontstaan krachtens de in het vorige lid bedoelde wet,
      in 's Rijks kas zijn gestort, worden teruggegeven aan degenen, die deze betaling hebben verricht of aan hun
      rechtverkrijgenden.
    url: https://wetten.overheid.nl/BWBR0002412/2024-01-01#Artikel18
  - number: '19'
    text: |-
      1 In geval een verzoek tot invordering overeenkomstig de artikelen 18 en 20 van het Grensverdrag is aanvaard,
      wijst Onze Minister van Financiën bij schriftelijke opdracht een ontvanger der directe belastingen aan, die met de
      invordering is belast. Onze genoemde Minister kan zodanige opdracht tot invordering te allen tijde intrekken of de
      uitvoering daarvan doen opschorten.

      2 Behoudens het bepaalde in het volgende lid zijn terzake van een overeenkomstig het eerste lid in te vorderen
      bedrag de wetten van 22 mei 1845 (*Stb.* 22) en van 1 juni 1850 (*Stb.* 26) van toepassing, met dien verstande dat:

      a. de opdracht wordt gelijkgesteld met een kohier;

      b. het in te vorderen bedrag, in zijn geheel, wordt gelijkgesteld met een aanslag in de inkomstenbelasting van een
      niet binnen het Rijk in Europa wonende belastingschuldige;

      c. voor het aanslagbiljet in de plaats treedt een schriftelijk verzoek van de ontvanger tot betaling;

      d. verzet tegen de tenuitvoerlegging van het dwangbevel mede nimmer gericht kan zijn tegen de wettigheid van de
      opdracht van Onze Minister van Financiën;

      e. de ontvanger, aan wie de opdracht tot invordering is verstrekt, voor de toepassing van artikel 20 van de wet van
      22 mei 1845 geacht wordt op te treden namens het bestuur der belastingen.

      3 De artikelen 2, 3, 8, 12 en 17, eerste lid, van de wet van 22 mei 1845 zijn niet van toepassing. De maatregel van
      lijfsdwang is uitgesloten.
    url: https://wetten.overheid.nl/BWBR0002412/2024-01-01#Artikel19
  - number: '20'
    text: |-
      1 Personen en lichamen, die op het tijdstip van de inwerkingtreding van het Grensverdrag woonachtig of gevestigd
      zijn in de in artikel 4 van het Grensverdrag bedoelde gebieden, worden voor de toepassing van de Nederlandse
      belastingwetgeving geacht het Rijk in Europa op dat tijdstip metterwoon te hebben verlaten onderscheidenlijk zich
      buiten het Rijk in Europa te hebben gevestigd.

      2 Ten aanzien van de in het eerste lid bedoelde personen of lichamen blijven buiten toepassing:

      a. artikel 7, tweede lid, van het Besluit op de Inkomstenbelasting 1941 (*Verord.bl.* 105);

      b. artikel 2, derde lid, laatste volzin, van het Besluit op de Vennootschapsbelasting 1942 (*Verord.bl.* 51);

      c. [artikel 3, eerste en tweede lid, van de Successiewet 1956][ref1] (*Stb.* 362).

      3 Met betrekking tot gebouwde en ongebouwde eigendommen, welke gelegen zijn in de in artikel 4 van het Grensverdrag
      bedoelde gebieden, is voor het belastingjaar, waarin de dag der inwerkingtreding van het Grensverdrag valt,
      grondbelasting slechts verschuldigd over zoveel twaalfde gedeelten van het belastingjaar als er gehele maanden
      verstreken zijn vóór de inwerkingtreding van het genoemde Verdrag.

      4 Het bepaalde in het vorige lid is van overeenkomstige toepassing ten aanzien van de personele belasting, voor
      zoveel betreft het gebruik van percelen, welke gelegen zijn in de in artikel 4 van het Grensverdrag bedoelde
      gebieden.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel3
