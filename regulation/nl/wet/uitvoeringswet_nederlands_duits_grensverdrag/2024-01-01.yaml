  - number: '24'
    text: |-
      1 In de ten laste van openbare lichamen komende kosten voor het tot stand brengen van maatregelen, welke ter
      uitvoering van het Grensverdrag worden genomen, zal uit 's Rijks kas een redelijke tegemoetkoming worden verleend,
      voorzover in die kosten niet op andere wijze wordt voorzien.

      2 Deze tegemoetkoming heeft alleen betrekking op hetgeen die kosten meer bedragen, dan hetgeen vóór het in werking
      treden van het Grensverdrag voor de uitoefening der desbetreffende waterstaatstaak werd vereist, en alsdan - uit
      welke hoofde ook - ten laste van die openbare lichamen zou zijn gekomen. Een beslissing omtrent deze tegemoetkoming
      wordt genomen door Onze Minister van Verkeer en Waterstaat na ingewonnen advies van Gedeputeerde Staten.

      3 Indien de uitvoering van werken, door Ons op advies der Permanente Grenswaterencommissie nodig geacht, niet
      binnen bekwame termijn geschiedt door hem, die met de zorg voor het betrokken grenswater belast is, geschiedt deze
      uitvoering door het Rijk. De aanlegkosten komen, voor zover zij niet mochten worden gedekt door een tegemoetkoming,
      als bedoeld in de leden 1 en 2 van dit artikel, ten laste van de beheerder. Het onderhoud dezer werken komt alsdan
      ten laste van de beheerders dier werken dan wel van de openbare lichamen, welke alsnog als beheerders daarvan
      zullen worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0002412/2024-01-01#Artikel24
  - number: '26'
    text: Deze wet treedt in werking op het tijdstip, waarop het Grensverdrag in werking treedt.
    url: https://wetten.overheid.nl/BWBR0002412/2024-01-01#Artikel26
  - number: '27'
    text: Deze wet kan worden aangehaald als "Uitvoeringswet Nederlands-Duits Grensverdrag".
    url: https://wetten.overheid.nl/BWBR0002412/2024-01-01#Artikel27
