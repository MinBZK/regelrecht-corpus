  - number: '21'
    text: |-
      1 Indien het plan bestaat, maatregelen, welke de waterstaatkundige toestand op Duits grondgebied wezenlijk
      kunnen beïnvloeden, uit te voeren of de uitvoering hiervan toe te laten, is de beheerder van het grenswater of,
      voor het geval dit water daarbij niet rechtstreeks is betrokken, de uitvoerder van die maatregelen verplicht
      de door Nederland aangewezen voorzitter van de Permanente Grenswaterencommissie, bedoeld in artikel 64 van het
      Grensverdrag, hiervan tijdig vooraf in kennis te stellen, onder toezending van een afschrift van deze kennisgeving
        - voorzoveel die verplichting rust op een ander dan het Rijk - aan Onze Minister van Verkeer en Waterstaat. Nadere
      regelen hieromtrent kunnen worden gesteld bij algemene maatregel van bestuur.

      2 Tot het uitvoeren van in het eerste lid genoemde maatregelen door anderen dan het Rijk mag niet worden
      overgegaan, dan nadat Onze Minister van Verkeer en Waterstaat heeft verklaard, dat met het oog op de naleving van
      het bepaalde in het Grensverdrag tegen de uitvoering daarvan geen bezwaar bestaat.
    url: https://wetten.overheid.nl/BWBR0002412/2024-01-01#Artikel21
  - number: '22'
    text: |-
      1 Overeenkomsten, welke ingevolge het bepaalde in artikel 59, lid 2, van het Grensverdrag door openbare lichamen
      worden gesloten, behoeven Onze goedkeuring, alvorens zij in werking treden.

      2 De voordracht tot goedkeuring van de in het eerste lid bedoelde overeenkomsten wordt Ons gedaan door Onze
      Minister van Verkeer en Waterstaat in overeenstemming met Onze Minister van Buitenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0002412/2024-01-01#Artikel22
  - number: '23'
    text: |-
      1 Bij onteigening ten behoeve van maatregelen ten aanzien van grenswateren vindt het bepaalde in
      [Titel IIa van de Onteigeningswet][ref1] overeenkomstige toepassing.

      2 De openbare lichamen, welke beheerders zijn van grenswateren, dienen, voorzover zulks voor een bevredigende
      uitvoering van het Grensverdrag noodzakelijk of wenselijk is, ernaar te streven, de eigendom van die
      wateren te verwerven vrij van de daarop eventueel rustende zakelijke of andere rechten. Het bepaalde in het
      [eerste lid van artikel 24][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001842
      [ref2]: https://wetten.overheid.nl/BWBR0002412#Artikel24
