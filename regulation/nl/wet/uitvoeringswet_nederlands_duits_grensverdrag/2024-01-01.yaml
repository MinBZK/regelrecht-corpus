preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het gewenst is, in verband met het op 8 april 1960 te 's-
    Gravenhage tussen het Koninkrijk der Nederlanden en de Bondsrepubliek Duitsland gesloten Verdrag nopens het
    verloop van de gemeenschappelijke landgrens, de grenswateren, het grondbezit in de nabijheid van de grens,
    het grensoverschrijdende verkeer over land en via de binnenwateren en andere met de grens verband houdende
    vraagstukken, met Bijlagen en Slotprotocol (Grensverdrag), enige wettelijke voorzieningen te treffen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002412/2024-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:

      a. "Algemeen Verdrag", het op 8 april 1960 te 's-Gravenhage tussen het Koninkrijk der Nederlanden en de
      Bondsrepubliek Duitsland gesloten Algemeen Verdrag tot regeling van met de grens verband houdende vraagstukken en
      andere tussen beide landen bestaande problemen (*Trb.* 1960, 67);

      b. "Grensverdrag", het krachtens artikel 2 van het Algemeen Verdrag daarvan deel uitmakende Verdrag nopens
      het verloop van de gemeenschappelijke landgrens, de grenswateren, het grondbezit in de nabijheid van de grens,
      het grensoverschrijdende verkeer over land en via de binnenwateren en andere met de grens verband houdende
      vraagstukken, met Bijlagen en Slotprotocol (*Trb.* 1960, 68);

      c. "grenswateren", oppervlaktewateren, met inbegrip van de oevers, die de Nederlands-Duitse grens overschrijden of
      ten dele deze vormen, met uitzondering van de Rijn, de Eems en de Dollard;

      d. "openbare lichamen", de op het gebied van het Koninkrijk der Nederlanden en van de Bondsrepubliek Duitsland voor
      de grenswateren plaatselijk bevoegde provinciën, gemeenten en publiekrechtelijke lichamen.
    url: https://wetten.overheid.nl/BWBR0002412/2024-01-01#Artikel1
  - number: '2'
    text: |-
      De gebieden, welke op 31 december 1937 behoorden tot het grondgebied van het Duitse Rijk en krachtens artikel
      1 van het Grensverdrag behoren tot het grondgebied van het Koninkrijk der Nederlanden, maken met ingang van de
      inwerkingtreding van het Grensverdrag deel uit van de gemeente: *Vaals,* voor zoveel betreft het gebied, gelegen
      langs de in § 5 van Bijlage A van het Grensverdrag beschreven nieuwe grens; *Kerkrade,* voor zoveel betreft
      het gebied, gelegen langs de in § 6 van Bijlage A van het Grensverdrag beschreven nieuwe grens; *Kerkrade,*
      voor zoveel betreft de gebieden, gelegen langs de in § 7 van Bijlage A van het Grensverdrag beschreven nieuwe
      grens; *Kerkrade,* voor zoveel betreft de aan het territoir dier gemeente aansluitende gebieden, gelegen langs
      de in § 8 van Bijlage A van het Grensverdrag beschreven nieuwe grens; *Eijgelshoven,* voor zoveel betreft de aan
      het territoir dier gemeente aansluitende gebieden, gelegen langs de in § 8 van Bijlage A van het Grensverdrag
      beschreven nieuwe grens; *Ubach over Worms,* voor zoveel betreft de aan het territoir dier gemeente aansluitende
      gebieden, gelegen langs de in § 8 van Bijlage A van het Grensverdrag beschreven nieuwe grens; *Ubach over Worms,*
      voor zoveel betreft het gebied, gelegen langs de in § 9 van Bijlage A van het Grensverdrag beschreven nieuwe
      grens; *Schinveld,* voor zoveel betreft het gebied, gelegen langs de in § 11 van Bijlage A van het Grensverdrag
      beschreven nieuwe grens; *Sittard,* voor zoveel betreft de gebieden, gelegen langs de in § 12 van Bijlage A van het
      Grensverdrag beschreven nieuwe grens; *Nieuwstadt,* voor zoveel betreft de gebieden, gelegen langs de in § 13 van
      Bijlage A van het Grensverdrag beschreven nieuwe grens; *Susteren,* voor zoveel betreft het gebied, gelegen langs
      de in § 14 van Bijlage A van het Grensverdrag beschreven nieuwe grens; *Vlodrop,* voor zoveel betreft de gebieden,
      gelegen langs de in § 16 van Bijlage A van het Grensverdrag beschreven nieuwe grens; *Arcen en Velden*, voor
      zoveel betreft de gebieden, gelegen langs de in § 17 van Bijlage A van het Grensverdrag beschreven nieuwe grens;
      *Arcen en Velden*, voor zoveel betreft de gebieden, gelegen langs de in § 18 van Bijlage A van het Grensverdrag
      beschreven nieuwe grens; *Bergen,* voor zoveel betreft het gebied, gelegen langs de in § 19 van Bijlage A van
      het Grensverdrag beschreven nieuwe grens; *Bergen,* voor zoveel betreft het gebied, gelegen langs de in § 20 van
      Bijlage A van het Grensverdrag beschreven nieuwe grens; *Bergen,* voor zoveel betreft het gebied, gelegen langs de
      in § 21, sub *a*, van Bijlage A van het Grensverdrag beschreven nieuwe grens; *Ottersum*, voor zoveel betreft het
      gebied, gelegen langs de in § 21, sub *b*, van Bijlage A van het Grensverdrag beschreven nieuwe grens; *Ottersum*,
      voor zoveel betreft het aan het territoir dier gemeente aansluitende gebied, gelegen langs de in § 22 van Bijlage
      A van het Grensverdrag beschreven nieuwe grens; *Groesbeek,* voor zoveel betreft het aan het territoir dier
      gemeente aansluitende gebied, gelegen langs de in § 22 van Bijlage A van het Grensverdrag beschreven nieuwe grens;
      *Groesbeek,* voor zoveel betreft het gebied, gelegen langs de in § 23 van Bijlage A van het Grensverdrag beschreven
      nieuwe grens tussen de grensstenen 626 IX en 628; *Groesbeek,* voor zoveel betreft het aan het territoir dier
      gemeente grenzende gedeelte van het gebied, gelegen langs de overigens in § 23 van Bijlage A van het Grensverdrag
      beschreven nieuwe grens tot een lijn, welke loopt als volgt: van grenspaal 629 *bis* V in een rechte lijn naar
      een punt, gelegen op de verbindingslijn tussen de palen 629 *bis* VII en 629 *bis* XIII, en wel op een afstand
      van 25 meter van paal 629 *bis* VII; van dit punt in een rechte lijn naar paal 629 *bis* XIII, van deze paal de
      voormalige rijksgrens volgend naar paal 630 X, van deze paal in een rechte lijn naar paal 630 XII, van deze paal
      de voormalige rijksgrens volgend naar paal 630 XIV, van deze paal in een rechte lijn naar paal 630 XVI, van deze
      paal de voormalige rijksgrens volgend naar paal 631, van deze paal in een rechte lijn naar paal 631 IV, van deze
      paal de voormalige rijksgrens volgend naar paal 631 VI, van deze paal naar een punt, gelegen op de verbindingslijn
      tussen de palen 631 VI en 631 XI, en wel op een afstand van 15 meter van paal 631 XI; van dit punt in een rechte
      lijn naar paal 632; *Ubbergen,* voor zoveel betreft het overige gebied, gelegen langs de in § 23 van Bijlage A
      van het Grensverdrag beschreven nieuwe grens; *Millingen aan den Rijn,* voor zoveel betreft het gebied, gelegen
      langs de in § 24 van Bijlage A van het Grensverdrag beschreven nieuwe grens; *Zevenaar,* voor zoveel betreft
      het gebied, gelegen langs de in § 26 van Bijlage A van het Grensverdrag beschreven nieuwe grens; *Bergh,* voor
      zoveel betreft het gebied, gelegen langs de in § 27 van Bijlage A van het Grensverdrag beschreven nieuwe grens;
      *Bergh,* voor zoveel betreft het gebied, gelegen langs de in § 28 van Bijlage A van het Grensverdrag beschreven
      nieuwe grens; *Bergh,* voor zoveel betreft het gebied, gelegen langs de in § 29 van Bijlage A van het Grensverdrag
      beschreven nieuwe grens; *Gendringen,* voor zoveel betreft de gebieden, gelegen langs de in § 31 van Bijlage A
      van het Grensverdrag beschreven nieuwe grens; *Gendringen,* voor zoveel betreft de aan het territoir dier gemeente
      aansluitende gebieden, gelegen langs de in § 32 van Bijlage A van het Grensverdrag beschreven nieuwe grens, tot een
      lijn, vanuit het snijpunt van de grens tussen de gemeenten Gendringen en Dinxperlo met de oude rijksgrens loodrecht
      op de nieuwe rijksgrens getrokken; *Dinxperlo,* voor zoveel betreft het vanaf de laatstelijk hiervoor bedoelde
      lijn aan het territoir der gemeente Dinxperlo aansluitende gebied, gelegen langs de in § 32 van Bijlage A van het
      Grensverdrag beschreven nieuwe grens; *Dinxperlo,* voor zoveel betreft de gebieden, gelegen langs de in § 33 van
      Bijlage A van het Grensverdrag beschreven nieuwe grens; *Eibergen,* voor zoveel betreft de gebieden, gelegen langs
      de in § 34 van Bijlage A van het Grensverdrag beschreven nieuwe grens; *Eibergen,* voor zoveel betreft het gebied,
      gelegen langs de in § 35 van Bijlage A van het Grensverdrag beschreven nieuwe grens; *Losser*, voor zoveel betreft
      de gebieden, gelegen langs de in § 36 van Bijlage A van het Grensverdrag beschreven nieuwe grens; *Losser,* voor
      zoveel betreft het gebied, gelegen langs de in § 37 van Bijlage A van het Grensverdrag beschreven nieuwe grens;
      *Losser,* voor zoveel betreft het gebied, gelegen langs de in § 38 van Bijlage A van het Grensverdrag beschreven
      nieuwe grens; *Losser,* voor zoveel betreft het aan het territoir dier gemeente aansluitende gebied, gelegen langs
      de in § 39 van Bijlage A van het Grensverdrag beschreven nieuwe grens, tot een lijn, vanuit het snijpunt van de
      grens tussen de gemeenten Losser en Denekamp met de oude rijksgrens loodrecht op de nieuwe rijksgrens getrokken;
      *Denekamp*, voor zoveel betreft het vanaf de laatstelijk hiervoor bedoelde lijn aan het territoir der gemeente
      Denekamp aansluitende gebied, gelegen langs de in § 39 van Bijlage A van het Grensverdrag beschreven nieuwe
      grens; *Denekamp*, voor zoveel betreft de gebieden, gelegen langs de in § 40 van Bijlage A van het Grensverdrag
      beschreven nieuwe grens; *Hardenberg,* voor zoveel betreft de gebieden, gelegen langs de in § 41 van Bijlage A van
      het Grensverdrag beschreven nieuwe grens; *Coevorden,* voor zoveel betreft de gebieden, gelegen langs de in § 42
      van Bijlage A van het Grensverdrag beschreven nieuwe grens; *Coevorden,* voor zoveel betreft de aan het territoir
      dier gemeente aansluitende gebieden, gelegen langs de in § 43 van Bijlage A van het Grensverdrag beschreven nieuwe
      grens; *Schoonebeek,* voor zoveel betreft de aan het territoir dier gemeente aansluitende gebieden, gelegen langs
      de in § 43 van Bijlage A van het Grensverdrag beschreven nieuwe grens; *Bellingwolde*, voor zoveel betreft het
      gebied, gelegen langs de in § 45 van Bijlage A van het Grensverdrag beschreven nieuwe grens; *Nieuweschans*, voor
      zoveel betreft het gebied, gelegen langs de in § 46 van Bijlage A van het Grensverdrag beschreven nieuwe grens;
      *Beerta,* voor zoveel betreft de gebieden, gelegen langs de in § 47 van Bijlage A van het Grensverdrag beschreven
      nieuwe grens.
    url: https://wetten.overheid.nl/BWBR0002412/2024-01-01#Artikel2
  - number: '3'
    text: |-
      De gebieden, welke op 31 december 1937 behoorden tot het grondgebied van het Duitse Rijk en krachtens artikel 2 van
      het Grensverdrag met ingang van de in dat artikel bedoelde tijdstippen zullen behoren tot het grondgebied van het
      Koninkrijk der Nederlanden, zullen met ingang van bedoelde tijdstippen deel uitmaken van de gemeente: *Kerkrade,*
      voor zoveel betreft de gebieden, gelegen langs de in § 2 van Bijlage B van het Grensverdrag beschreven toekomstige
      grens; *Vlodrop,* voor zoveel betreft de gebieden, gelegen langs de in § 3 van Bijlage B van het Grensverdrag
      beschreven toekomstige grens; *Vlodrop,* voor zoveel betreft de gebieden, gelegen langs de in § 4 van Bijlage B van
      het Grensverdrag beschreven toekomstige grens; *Denekamp,* voor zoveel betreft de gebieden, gelegen langs de in § 5
      van Bijlage B van het Grensverdrag beschreven toekomstige grens.
    url: https://wetten.overheid.nl/BWBR0002412/2024-01-01#Artikel3
  - number: '4'
    text: |-
      Aan de in artikel 3 van de Grenscorrectiewet genoemde gemeenten wordt ten laste van Hoofdstuk VII A der
      rijksbegroting een vergoeding toegekend wegens de nog niet afgeschreven kapitaalsuitgaven, welke zij ten behoeve
      van en in verband met de krachtens deze wet aan het Rijk toegevoegde gebieden hebben gedaan, alsmede een vergoeding
      van de kosten der werken, welke zij ter uitvoering van het Grensverdrag nog moeten verrichten. De toekenning van
      deze vergoedingen geschiedt door Onze Minister van Binnenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0002412/2024-01-01#Artikel4
  - number: '5'
    text: De Grenscorrectiewet wordt met ingang van het tijdstip van inwerkingtreding van het Grensverdrag ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002412/2024-01-01#Artikel5
  - number: '6'
    text: |-
      De drostambten Elten en Tudderen worden met ingang van het tijdstip van inwerkingtreding van het Grensverdrag
      opgeheven.
    url: https://wetten.overheid.nl/BWBR0002412/2024-01-01#Artikel6
  - number: '7'
    text: |-
      Onze Minister van Binnenlandse Zaken is belast met de uitvoering van het vorige artikel. Hij kan terzake nadere
      regelen stellen.
    url: https://wetten.overheid.nl/BWBR0002412/2024-01-01#Artikel7
  - number: '8'
    text: |-
      1 De voorlopige uitkeringen uit het Gemeentefonds aan de drostambten Elten en Tudderen worden voor het jaar, waarin
      het Grensverdrag in werking treedt, gedaan tot het bedrag, dat wordt verkregen door vermenigvuldiging van het op
      jaarbasis berekende bedrag dezer uitkeringen met een breuk, waarvan de noemer 365 bedraagt en de teller gelijk
      is aan het aantal der dagen, dat verloopt van 1 januari van dat jaar af tot de datum van inwerkingtreding van het
      Grensverdrag.

      2 Voorlopige uitkeringen uit het Gemeentefonds worden, voorzover zij bij het in werking treden van het Grensverdrag
      nog niet door een definitieve verrekening zijn gevolgd, als definitieve uitkeringen aangemerkt.
    url: https://wetten.overheid.nl/BWBR0002412/2024-01-01#Artikel8
  - number: '9'
    text: |-
      1 De voorlopige uitkeringen, bedoeld in artikel 2 van de Regeling Uitkering grondbelasting en personele belasting
      aan de gemeenten, worden aan de drostambten Elten en Tudderen voor de laatste maal gedaan in de maand, voorafgaande
      aan die, waarin het Grensverdrag in werking treedt.

      2 De verschillen, bedoeld in artikel 3 van de in het eerste lid genoemde Regeling, komen met ingang van de datum
      van inwerkingtreding van het Grensverdrag ten laste of ten bate van 's Rijks kas.
    url: https://wetten.overheid.nl/BWBR0002412/2024-01-01#Artikel9
  - number: '10'
    text: |-
      1 De Nederlandse ambtenaren in vaste en in tijdelijke dienst van de drostambten Elten en Tudderen en de met hen
      naar het oordeel van Onze Minister van Binnenlandse Zaken gelijk te stellen personen, die op de dag, voorafgaande
      aan die van inwerkingtreding van het Grensverdrag in de drostambten Elten en Tudderen werkzaam waren, worden geacht
      met ingang van die inwerkingtreding eervol uit hun ambt te zijn ontslagen.

      2 Aan de landdrosten van Elten en van Tudderen en aan de in het eerste lid bedoelde personen wordt, ten
      laste van Hoofdstuk VII A der rijksbegroting, wachtgeld toegekend overeenkomstig de bepalingen van het
      [Rijkswachtgeldbesluit 1959][ref1]. De toekenning van dit wachtgeld en het nemen van beslissingen daaromtrent
      geschieden door Onze Minister van Binnenlandse Zaken.

      3 Voor zover toepassing van het [Rijkswachtgeldbesluit 1959][ref2] leidt tot een ongunstiger wachtgeld dan
      bij toepassing van de wachtgeldregelingen der drostambten, kan door betrokkenen een keuze gemaakt worden voor
      laatstbedoelde.


      [ref1]: https://wetten.overheid.nl/BWBR0002326
      [ref2]: https://wetten.overheid.nl/BWBR0002326
    url: https://wetten.overheid.nl/BWBR0002412/2024-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002326
      - id: ref2
        bwb_id: BWBR0002326
  - number: '11'
    text: |-
      1 De tijd, op het in het vorige artikel bedoelde wachtgeld doorgebracht, wordt - tenzij aan de ontslagene een
      vervroegd ouderdomspensioen, als bedoeld in het eerste lid van artikel 48, onder *b,* der Pensioenwet 1922,
      *Stb.* 240, wordt toegekend uit hoofde van de betrekking, waaraan hij het wachtgeld ontleent - als diensttijd in
      de zin van laatstgenoemde wet aangemerkt, indien de ontslagene in de betrekking, welke hij met wachtgeld heeft
      verlaten, laatstelijk vóór zijn ontslag ambtenaar in de zin dier wet was en voor zover die tijd niet parallel
      loopt met diensttijd als ambtenaar in de zin der Pensioenwet 1922, *Stb.* 240, of als spoorwegambtenaar in de
      zin van de Pensioenwet voor de spoorwegambtenaren 1925, *Stb.* 294, in een betrekking of in betrekkingen, waarin
      die hoedanigheid na dat ontslag werd verkregen, dan wel in een militaire betrekking, waarin hij na zijn ontslag
      is geplaatst.

      2 Als wedde, onderscheidenlijk pensioensgrondslag, dan wel als som der wedden, onderscheidenlijk som der
      pensioensgrondslagen, geldt, uitsluitend voor de berekening van het ambtenaarspensioen volgens de Pensioenwet 1922,
      *Stb.* 240:

      a. gedurende de volgens het vorige lid voor pensioen geldige tijd het bedrag, dat als wedde of als
      pensioensgrondslag, onderscheidenlijk als som der wedden of als som der pensioensgrondslagen zou hebben gegolden,
      indien de ontslagene de op overeenkomstige wijze, als bedoeld in het [Rijkswachtgeldbesluit 1959][ref1], berekende
      wedde gedurende die tijd als ambtenaar in de zin dier wet zou hebben genoten;

      b. gedurende de volgens het vorige lid in verband met parallel lopende diensttijd niet voor pensioen geldige
      tijd, voor zover de wedde of som van wedden in de betrekking of in de betrekkingen, waarin de hoedanigheid van
      ambtenaar in de zin der Pensioenwet 1922, *Stb.* 240, of spoorwegambtenaar in de zin der Pensioenwet voor de
      spoorwegambtenaren 1925, *Stb.* 294, na het ontslag werd verkregen dan wel in de militaire betrekking, lager is
      dan de onder *a* laatstelijk bedoelde wedde, het bedrag, dat als wedde of als pensioensgrondslag, onderscheidenlijk
      als som van wedden of als som van pensioensgrondslagen zou hebben gegolden, wanneer de ontslagene laatstbedoelde
      betrekking of betrekkingen niet zou hebben bekleed. Wanneer hij, die op wachtgeld gesteld is, na zijn ontslag meer
      dan één betrekking gelijktijdig bekleedt, wordt het in de vorige zin bedoelde bedrag geacht over deze betrekkingen
      evenredig te zijn verdeeld in de verhouding van de werkelijke aan die betrekkingen verbonden wedden.

      3 Het rijk is voor de op wachtgeld gestelde jaarlijks vóór 31 december een bijdrage voor eigen pensioen aan het
      Algemeen Burgerlijk Pensioenfonds verschuldigd van 13 percent van het bedrag, dat volgens het vorige lid op 1
      januari als pensioensgrondslag of als som van pensioensgrondslagen voor hem geldt, eventueel verminderd met dat
      van zijn pensioensgrondslag of de som zijner pensioensgrondslagen op diezelfde datum in na het ontslag aangehouden
      betrekkingen of in betrekkingen, waarin de hoedanigheid van ambtenaar in de zin der Pensioenwet 1922, *Stb.* 240,
      na het ontslag werd verkregen.

      4 De volgens het vorige lid verschuldigde bijdrage wordt door inhouding op het wachtgeld op de betrokkene verhaald
      tot twee percent van het, eventueel volgens het vorige lid verminderde, bedrag, dat als pensioensgrondslag of als
      som van pensioensgrondslagen geldt.

      5 Voor de toepassing van de eerste drie leden van dit artikel vinden de artikelen 125, 127, 127*a* en 129*a* der
      Pensioenwet 1922, *Stb.* 240, overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002326
    url: https://wetten.overheid.nl/BWBR0002412/2024-01-01#Artikel11
