  - number: '17'
    text: |-
      1 Indien een pachtovereenkomst, die geldt voor de duur van ten minste twaalf jaren voor een hoeve en van ten
      minste zes jaren voor los land, binnen twee jaren na de inwerkingtreding van deze wet eindigt, kan de kennisgeving,
      bedoeld in [artikel 36, tweede lid, van de Pachtwet][ref1], tot een jaar na dit tijdstip worden gedaan.

      2 Op pachtovereenkomsten, die gelden voor een kortere duur dan genoemd in het vorige lid, is
      [artikel 37 van de Pachtwet][ref2] van overeenkomstige toepassing, met dien verstande, dat de pachter tot een jaar
      vóór het einde van die duur of, wanneer de pachtovereenkomst binnen twee jaren na de inwerkingtreding van deze wet
      eindigt, nog tot een jaar na dit tijdstip aan de pachtkamer kan verzoeken, de pachtovereenkomst te verlengen.

      3 Pachtovereenkomsten, die op het tijdstip van de inwerkingtreding van deze wet niet meer ingevolge § 8 van het
      Landpachtgesetz konden worden verlengd, zijn niet voor verlenging vatbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002269#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0002269#Artikel37
