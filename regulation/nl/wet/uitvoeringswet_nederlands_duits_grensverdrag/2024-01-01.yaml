  - number: '12'
    text: |-
      Aan de Nederlanders, die op de dag, voorafgaande aan die van inwerkingtreding van het Grensverdrag, in dienst van
      de drostambten Elten en Tudderen op arbeidsovereenkomst naar burgerlijk recht werkzaam waren en die in verband met
      de opheffing van de drostambten hun betrekking beëindigen, wordt, ten laste van Hoofdstuk VII A der rijksbegroting,
      een uitkering toegekend overeenkomstig de bepalingen van de Uitkeringsregeling 1952. De toekenning van deze
      uitkering en het nemen van beslissingen daaromtrent geschieden door Onze Minister van Binnenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0002412/2024-01-01#Artikel12
  - number: '13'
    text: Bij algemene maatregel van bestuur worden regels gesteld ter uitvoering van artikel 11 van het Grensverdrag.
    url: https://wetten.overheid.nl/BWBR0002412/2024-01-01#Artikel13
  - number: '14'
    text: |-
      In de gebieden, bedoeld in artikel 6 van het Grensverdrag, waarop de Grenscorrectiewet niet van
      toepassing is geweest, geldt voor de overgang van het Duitse naar het Nederlandse recht het bepaalde in de
      [artikelen 15 tot en met 17][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002412#Artikel15
    url: https://wetten.overheid.nl/BWBR0002412/2024-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002412
        artikel: '15'
        hoofdstuk: II
  - number: '15'
    text: |-
      1 Pachtovereenkomsten, die tot de inwerkingtreding van deze wet hebben gegolden voor onbepaalde tijd, gelden voor
      de duur van zes jaren, met dien verstande, dat de jaren, gedurende welke de pachtovereenkomst vóór genoemd tijdstip
      heeft bestaan, voor de berekening van die duur medetellen tot een maximum van vier jaren.

      2 Pachtovereenkomsten, die tot de inwerkingtreding van deze wet hebben gegolden voor bepaalde tijd, gelden voor de
      duur, waarvoor zij zijn aangegaan.

      3 In afwijking van de vorige leden eindigt een pachtovereenkomst, die vóór de inwerkingtreding van deze wet op
      rechtsgeldige wijze is opgezegd, op de dag, waartegen de opzegging is geschied, tenzij deze op gemeld tijdstip
      reeds ingevolge § 8 van het "Landpachtgesetz" door de rechter was nietig verklaard. Indien de opzegging echter
      op het tijdstip van de inwerkingtreding van deze wet nog door de rechter kon worden nietig verklaard, kan de
      wederpartij tot zes maanden na dit tijdstip bij de in pachtzaken bevoegde rechter alsnog de nietigverklaring van de
      opzegging vorderen. De rechter beslist naar billijkheid. Wijst hij de vordering toe, dan geldt de pachtovereenkomst
      voor de in de vorige leden genoemde duur.
    url: https://wetten.overheid.nl/BWBR0002412/2024-01-01#Artikel15
  - number: '16'
    text: |-
      1 Pachtovereenkomsten, die vóór de inwerkingtreding van deze wet schriftelijk zijn aangegaan en ter kennis gebracht
      van het in § 3 van het "Landpachtgesetz" bedoelde gezag, worden geacht door de grondkamer te zijn goedgekeurd,
      tenzij dit gezag ingevolge § 5 van het "Landpachtgesetz" bezwaren heeft gemaakt, waaraan partijen niet door tijdige
      wijziging van de pachtovereenkomst tegemoet zijn gekomen en die niet door de rechter ongegrond zijn verklaard.

      2 Pachtovereenkomsten, die vóór de inwerkingtreding van deze wet niet ter kennis van het gezag, bedoeld in het
      vorige lid, behoefden te worden gebracht, worden geacht door de grondkamer te zijn goedgekeurd.

      3 Pachtovereenkomsten, die vóór de inwerkingtreding van deze wet zijn aangegaan, doch niet krachtens de
      vorige leden geacht worden door de grondkamer te zijn goedgekeurd, moeten binnen een jaar na dit tijdstip
      aan de grondkamer ter goedkeuring worden ingezonden. Deze verplichting geldt evenwel niet ten aanzien van
      pachtovereenkomsten, als bedoeld in [artikel 58 van de Pachtwet][ref1]. Ieder der partijen is tot inzending
      verplicht; zodra een hunner aan zijn verplichting heeft voldaan, is die van de ander vervallen. Niet-nakoming wordt
      geacht een overtreding te zijn van [artikel 8, eerste lid, van de Pachtwet][ref2]. De verpachter kan in dat geval,
      zolang de pachtovereenkomst niet is goedgekeurd, niet een rechtsvordering tot betaling van de pachtprijs tegen de
      pachter instellen. De [artikelen 9][ref3] en [10 van de Pachtwet][ref4] blijven buiten toepassing.

      4 Indien de grondkamer een pachtovereenkomst wijzigt of nietig verklaart, werkt de hiertoe strekkende beschikking
      niet terug.

      5 Onder pachtovereenkomsten worden in dit artikel mede verstaan overeenkomsten tot wijziging van een
      pachtovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0002269#Artikel58
