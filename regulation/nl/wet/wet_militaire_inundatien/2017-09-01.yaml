  - number: 1a
    text: |-
      De Minister van Defensie, dan wel elke daartoe door hem gemachtigde militaire autoriteit, is bevoegd het
      voorbereiden of het stellen van militaire inundatiën te gelasten.
    url: https://wetten.overheid.nl/BWBR0001863/2017-09-01#Artikel1a
  - number: '2'
    text: |-
      1 Wanneer, tot het voorbereiden of het stellen van militaire inundatiën ten gevolge van den last of krachtens
      de machtiging in [artikel 1][ref1] bedoeld, het gebruik van eigendom wordt gevorderd, al dan niet gepaard gaande
      met wijziging, tijdelijke of voortdurende onbruikbaarmaking of vernietiging van dat eigendom, kan, op last van de
      hoogste militaire overheid ter plaatse aanwezig, onmiddellijk tot dat gebruik worden overgegaan.

      2 Deze zorgt onverwijld voor openbare bekendmaking ter plaatse.


      [ref1]: https://wetten.overheid.nl/BWBR0001863#Artikel1
    url: https://wetten.overheid.nl/BWBR0001863/2017-09-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001863
        artikel: '1'
  - number: '3'
    text: |-
      Te rekenen van het tijdstip der in het vorige artikel bedoelde openbare bekendmaking zijn de beheerders van
      waterstaatswerken, gelegen binnen het te inundeeren gebied of welke in betrekking staan met het voorbereiden of
      het stellen van militaire inundatiën, verplicht de bevelen na te komen, welke hun, in verband met het voorbereiden
      of het stellen van de inundatiën, met betrekking tot hun beheer worden gegeven door de hoogste militaire overheid
      ter plaatse aanwezig, en zijn evengemelde beheerders alsmede de eigenaren en gebruikers van binnen dat gebied
      gelegen eigendommen verplicht aan genoemde militaire overheid, desverlangd, de voor het voorbereiden of stellen der
      inundatiën noodige inlichtingen te verstrekken.
    url: https://wetten.overheid.nl/BWBR0001863/2017-09-01#Artikel3
  - number: '4'
    text: |-
      1 Zoodra het gebruik, bedoeld in [artikel 2][ref1], niet meer noodig is, wordt het gebruikte eigendom door den
      Minister van Defensie weder geheel ter beschikking van de rechthebbenden gesteld. De wederbeschikbaarstelling wordt
      door genoemden Minister ter algemeene kennis gebracht.

      2 De Minister van Defensie is bevoegd, voor rekening van den Staat, het gebruikte eigendom terug te brengen in den
      toestand, waarin het zich vóór de ingebruikneming bevond.


      [ref1]: https://wetten.overheid.nl/BWBR0001863#Artikel2
    url: https://wetten.overheid.nl/BWBR0001863/2017-09-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001863
        artikel: '2'
  - number: '5'
    text: |-
      1 Wanneer door het voorbereiden of het stellen van de militaire inundatiën in de vorige artikelen bedoeld,
      eigendommen worden beschadigd of aan de vrije beschikking van de eigenaren, de beperkt gerechtigden, de pachters
      of de huurders onttrokken, wordt aan hen, op hunne aanvrage, de schade, welke daardoor mocht zijn geleden,
      vergoed, voor zoover die schade als het onmiddellijke en dadelijke gevolg van het voorbereiden of het stellen
      der inundatiën moet worden beschouwd, en voor zoover daarin niet door toepassing van het bepaalde in het
      [tweede lid van artikel 4][ref1], is of wordt voorzien.

      2 De hierbedoelde aanvrage moet aan den Minister van Defensie worden ingediend binnen eene maand na de dagteekening
      van de in het vorige artikel bedoelde kennisgeving.

      3 Door de hoogste militaire overheid ter plaatse aanwezig kan, bijaldien zulks wordt verlangd, op de
      schadevergoeding voorschot worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0001863#Artikel4
    url: https://wetten.overheid.nl/BWBR0001863/2017-09-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001863
        artikel: '4'
  - number: '6'
    text: |-
      Binnen twee maanden nadat de in [artikel 5][ref1] vermelde aanvrage bij het Ministerie van Defensie is ontvangen,
      biedt de Minister van Defensie aan den belanghebbende eene bepaalde som gelds aan ter vergoeding der geleden
      schade. Is binnen den gestelden termijn geen aanbod door den belanghebbende ontvangen, of acht hij de aangeboden
      schadevergoeding niet voldoende, dan kan hij het geschil op de gewone wijze door het instellen van een vordering
      bij de burgerlijke rechter aanbrengen.


      [ref1]: https://wetten.overheid.nl/BWBR0001863#Artikel5
    url: https://wetten.overheid.nl/BWBR0001863/2017-09-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001863
        artikel: '5'
