  - number: '7'
    text: |-
      1 Degene die opzettelijk het bepaalde in de [artikelen 2][ref1], [3][ref2], of [8, eerste lid][ref3], overtreedt
      wordt gestraft hetzij met gevangenisstraf van ten hoogste vier jaren, hetzij met geldboete van de vijfde categorie,
      hetzij met beide straffen.

      2 Degene die de bepalingen, genoemd in het eerste lid, niet opzettelijk overtreedt wordt gestraft hetzij met
      hechtenis van ten hoogste een jaar, hetzij met een geldboete van de vijfde categorie, hetzij met beide straffen.

      3 Overtreding van het bepaalde in het eerste lid is een misdrijf en overtreding van het bepaalde in het tweede lid
      een overtreding.


