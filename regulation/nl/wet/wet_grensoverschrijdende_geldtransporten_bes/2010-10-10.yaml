  - number: '8'
    text: |-
      1 Allen, die betrokken zijn of zijn geweest bij de uitvoering van deze wet zijn verplicht tot geheimhouding van
      al hetgeen in hun hoedanigheid is bekend geworden, behoudens in het geval dat uit de doelstelling van deze wet de
      noodzaak tot bekendmaking voortvloeit.

      2 Onze Minister kan ontheffing verlenen van het in het eerste lid vervatte verbod aan de douaneambtenaren.

      3 Onze Minister van Justitie kan ontheffing verlenen van het in het eerste lid vervatte verbod aan de ambtenaren
      van politie bevoegd inzake paspoortcontrole.
    url: https://wetten.overheid.nl/BWBR0028165/2010-10-10#Artikel8
