  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt, voor zover niet anders is bepaald, verstaan onder:

        - *Onze Minister:* Onze Minister van Financiën;
        - *aanmelding:* een aanmelding als bedoeld in [artikel 2][ref1];
        - *geld:* binnenlandse en buitenlandse bankbiljetten, munten en muntbiljetten, alsmede aan toonder gestelde
      verhandelbare waardepapieren;
        - *aanmelder:* degene die de aanmelding heeft gedaan;
        - *douaneambtenaar:* ambtenaar als bedoeld in [artikel 1.1, onderdeel f, van de Douane- en Accijnswet BES][ref2];
        - *inspecteur van douane:* inspecteur, bedoeld in [artikel 1.1, onderdeel h, van de Douane- en Accijnswet BES][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028165#Artikel2
