  - number: '2'
    text: |-
      1 Personen die Bonaire, Sint Eustatius of Saba binnenkomen of uitgaan zijn verplicht om geld ter waarde USD 10.000
      of meer, dat zij met zich meevoeren, aan te melden bij de douaneambtenaren. Het bepaalde in de eerste volzin is ook
      van toepassing indien het gaat om binnenkomende of uitgaande personen, die aantoonbaar samen reizen en gezamenlijk
      geld ter waarde van USD 10.000 of meer met zich meevoeren.

      2 De aanmelding moet geschieden door het inleveren van een door de aanmelder ondertekende aangifte volgens een
      door Onze Minister vast te stellen model. In het geval, genoemd in het eerste lid, tweede volzin, rusten de
      bij of krachtens deze wet gestelde verplichtingen op alle in het eerste lid, tweede volzin, bedoelde personen
      afzonderlijk.

      3 Indien een geldtransport plaatsvindt per beroepsvervoerder, maar deze niet tot de aanmelding, bedoeld in het
      eerste lid, in staat is gesteld, wordt de aanmelding gedaan bij de Inspecteur van douane door de verzender van het
      geld uiterlijk op het tijdstip van de feitelijke binnenkomst of het uitgaan van het geld.

      4 Aanmelding moet voor binnenkomende personen geschieden uiterlijk op het tijdstip, waar door de douaneambtenaar
      kan worden overgegaan tot controle van door reizigers meegebrachte bagage. Als de bevoegde autoriteit een
      controle-zone instelt, moet aanmelding geschieden voordat de controle-zone wordt betreden. Is ter plekke geen
      douaneambtenaar aanwezig, dan moet na de doorgang onverwijld aanmelding worden gedaan bij de dichtstbijzijnde
      douaneambtenaar.

      5 Aanmelding moet voor uitgaande personen geschieden uiterlijk op het tijdstip, waarop door de ambtenaar van
      politie bevoegd inzake paspoortcontrole wordt overgegaan tot paspoortcontrole of als geen paspoortcontrole
      plaatsvindt uiterlijk op het tijdstip, waarop door de douaneambtenaar tot controle van door reizigers meegebrachte
      bagage overgegaan kan worden. Is ter plekke geen douaneambtenaar aanwezig, dan moet vóór doorgang aanmelding worden
      gedaan bij de dichtstbijzijnde douaneambtenaar.

      6 Mochten er geen douaneambtenaren aanwezig zijn op het eiland dan dient aanmelding te geschieden bij de ambtenaren
      van politie bevoegd inzake paspoortcontrole.

      7 Bij ministeriële regeling kan, al dan niet onder het stellen van beperkingen en voorschriften, worden bepaald dat
      de aanmelding, bedoeld in het eerste lid, niet geldt voor geld dat binnengebracht wordt of uitgaat met het enkele
      oogmerk van rechtstreekse doorvoer.
    url: https://wetten.overheid.nl/BWBR0028165/2010-10-10#Artikel2
  - number: '3'
    text: |-
      Bij de aanmelding, als bedoeld in het [tweede lid van artikel 2][ref1], dienen juiste gegevens te worden verstrekt
      omtrent:

      a. de identiteit en woonadres van de aanmelder en van de eigenaar van het geld;

      b. de omvang, herkomst en bestemming van het geld;

      de reden voor de gekozen wijze van vervoer van het geld.


      [ref1]: https://wetten.overheid.nl/BWBR0028165#Artikel2
