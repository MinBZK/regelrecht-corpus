  - number: '5'
    text: |-
      1 Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de daartoe bij besluit
      van Onze Minister aangewezen ambtenaren. Van een zodanig besluit wordt mededeling gedaan door plaatsing in de
      Staatscourant.

      2 [Titel 5.2 van de Algemene wet bestuursrecht][ref1] is van toepassing. In aanvulling op de in die afdeling
      geregelde bevoegdheden zijn de in het eerste lid bedoelde ambtenaren tevens bevoegd:

      a. aanmerende en aanlandende vaartuigen, alsmede stilstaande luchtvaartuigen en voertuigen en hun lading te
      onderzoeken;

      b. tot onderzoek aan het lichaam en de kleding van personen die zich van en naar vaartuigen, voertuigen en
      luchtvaartuigen begeven;

      c. geld in bewaring te nemen, indien de aanmelder hun niet onverwijld de gegevens, bedoeld in [artikel 3][ref2],
      verstrekt, of indien bij hen gerede twijfel bestaat omtrent de juistheid van de door de aanmelder verstrekte
      gegevens.

      3 Van de inbewaringneming, bedoeld in het tweede lid, maken de ambtenaren, bedoeld in het eerste lid, onverwijld
      proces-verbaal* op. De inbewaringneming kan geschieden voor maximaal zeven dagen. Deze termijn kan door hun
      diensthoofd eenmaal met maximaal zeven dagen worden verlengd. Na afloop van deze termijn wordt het geld onverwijld
      teruggegeven aan de aanmelder, tenzij toepassing wordt gegeven aan [artikel 6, tweede lid][ref3].

      Bij algemene maatregel van bestuur kunnen regels worden gesteld omtrent het procesverbaal*, alsmede de
      bewaarplaats, de overdracht en het beheer van het geld.

      4 De ambtenaren, bedoeld in het eerste lid, zijn bevoegd tot onderzoek aan het lichaam en de kleding van personen
      die zich van en naar vaartuigen, voertuigen en luchtvaartuigen begeven.

      5 Het onderzoek aan het lichaam of de kleding geschiedt door ambtenaren van hetzelfde geslacht als dat van de
      persoon die aan visitatie wordt onderworpen.

      6 Personen die aan een onderzoek aan het lichaam of de kleding zullen worden onderworpen, zijn op eerste vordering
      van de ambtenaren, bedoeld in het eerste lid, gehouden stil te staan en deze te volgen naar een door hen aangewezen
      plaats.

      7 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze van taakuitoefening van de in
      het eerste lid bedoelde ambtenaren.

