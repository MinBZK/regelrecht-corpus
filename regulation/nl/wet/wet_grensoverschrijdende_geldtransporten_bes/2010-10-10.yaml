  - number: '6'
    text: |-
      1 Met de opsporing van de in deze wet strafbaar gestelde feiten zijn, naast de in
      [artikel 184 van het Wetboek van Strafvordering BES][ref1] bedoelde ambtenaren, belast de daartoe bij besluit van
      Onze Minister van Justitie in overeenstemming met Onze Minister aangewezen ambtenaren. Van een zodanig besluit
      wordt mededeling gedaan door plaatsing in de Staatscourant.

      2 De ambtenaren belast met de opsporing van de bij deze wet strafbaar gestelde feiten, zijn te allen
      tijde bevoegd tot inbeslagneming van alle in verband met de bepalingen van deze wet ingevolge het
      [Wetboek van Strafvordering BES][ref2] voor inbeslagneming vatbare voorwerpen. Zij kunnen daartoe hun uitlevering
      vorderen. [Artikel 5, derde lid][ref3], is van overeenkomstige toepassing.

      3 [Vervallen]


