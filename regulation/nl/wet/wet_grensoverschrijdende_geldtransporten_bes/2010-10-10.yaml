  - number: '4'
    text: |-
      1 Het Meldpunt Ongebruikelijke Transacties, bedoeld in
      [artikel 2 van de Wet melding ongebruikelijke transacties BES][ref1], beheert de gegevens die op grond van
      [artikel 3][ref2] worden verkregen.

      2 Aan het Meldpunt Ongebruikelijke Transacties, bedoeld in het eerste lid, worden door de ambtenaren, bedoeld in
      [artikel 5, eerste lid][ref3], onverwijld doorgezonden:

      a. de aanmeldingen, bedoeld in [artikel 2][ref4];

      b. afschriften van processen-verbaal van inbeslagneming van geld.


