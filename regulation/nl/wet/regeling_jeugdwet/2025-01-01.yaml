  - number: '4.2'
    text: |-
      1 De jeugdhulpaanbieder en de gecertificeerde instelling stellen een jaarrekening als bedoeld in
      [artikel 361 van Boek 2 van het Burgerlijk Wetboek][ref1] op waarin de eigen financiële gegevens zijn opgenomen en
      waaraan de gegevens, bedoeld in [artikel 392 van Boek 2 van het Burgerlijk Wetboek][ref2], zijn bijgevoegd.

      2 Op de jaarverslaggeving van de jeugdhulpaanbieder en de gecertificeerde instelling is
      [Titel 9 Boek 2 van het Burgerlijk Wetboek][ref3] van overeenkomstige toepassing met uitzondering van de
      [afdelingen 1][ref4], [11][ref5] en [12][ref6] voor zover in deze paragraaf niet anders is bepaald.

      3 In afwijking van of in aanvulling op [Boek 2, titel 9, van het Burgerlijk Wetboek][ref7]:

      a. wordt de jaarverslaggeving ingericht overeenkomstig de Richtlijnen voor de Jaarverslaggeving zoals vastgesteld
      door de Raad voor de Jaarverslaggeving, in het bijzonder hoofdstuk 655;

      b. wordt de jaarverslaggeving opgesteld en gepubliceerd in de Nederlandse taal en in de in Nederland wettige
      valuta;

      c. is het verslagjaar altijd gelijk aan een kalenderjaar;

      d. is de jeugdhulpaanbieder die op twee opeenvolgende balansdata, zonder onderbreking nadien
      op twee opeenvolgende balansdata, heeft voldaan aan twee of drie van de eisen, genoemd in
      [artikel 395a, eerste lid, onderdelen a tot en met c, van Boek 2 van het Burgerlijk Wetboek][ref8], niet gehouden
      een verklaring als bedoeld in [artikel 393, vijfde lid, van Boek 2 van het Burgerlijk Wetboek][ref9] over te
      leggen;

      e. kan de gecertificeerde instelling die op twee opeenvolgende balansdata, zonder onderbreking
      nadien op twee opeenvolgende balansdata, heeft voldaan aan twee of drie van de eisen, genoemd in
      [artikel 395a, eerste lid, onderdelen a tot en met c, van Boek 2 van het Burgerlijk Wetboek][ref10],
      volstaan met een samenstellingsverklaring van een accountant in plaats van een verklaring als bedoeld in
      [artikel 393, vijfde lid, van Boek 2 van het Burgerlijk Wetboek][ref11];

      f. kan een jeugdhulpaanbieder of de gecertificeerde instelling die op twee opeenvolgende balansdata, zonder
      onderbreking nadien op twee opeenvolgende balansdata, heeft voldaan aan twee of drie van de eisen genoemd
      in [artikel 396, eerste lid, onderdelen a tot en met c, van Boek 2 van het Burgerlijk Wetboek][ref12],
      volstaan met een beoordelingsverklaring van een accountant in plaats van een verklaring als bedoeld in
      [artikel 393, vijfde lid, van Boek 2 van het Burgerlijk Wetboek][ref13];

      g. wordt de informatie, bedoeld bij of krachtens de [artikelen 1.7][ref14] en
      [4.1, eerste en tweede lid, van de Wet normering topinkomens][ref15], opgenomen in de jaarrekening, waarbij gebruik
      wordt gemaakt van een door de Minister van Binnenlandse Zaken en Koninkrijksrelaties vast te stellen model.

      4 In afwijking van het derde lid, onderdeel a, wordt over het verslagjaar 2018 de jaarverslaggeving ingericht
      overeenkomstig de Richtlijnen voor de Jaarverslaggeving zoals vastgesteld door de Raad voor de Jaarverslaggeving,
      in het bijzonder hoofdstuk 640, of met overeenkomstige toepassing van hoofdstuk 655.


