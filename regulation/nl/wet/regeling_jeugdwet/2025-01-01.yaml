  - number: 8ab
    text: |-
      1 Indien van toepassing kan een persoon aan wie een persoonsgebonden budget is verstrekt ten laste van zijn
      persoonsgebonden budget een hulp uit het sociaal netwerk voor jeugdhulp, die zonder dienstbetrekking wordt
      verleend, laten betalen:

      a. een tegemoetkoming van maximaal € 141 per kalendermaand;

      b. een door het college vastgestelde tegemoetkoming per kalendermaand voor schoonmaakmiddelen, levensmiddelen,
      kleding en reiskosten ten behoeve van de hulp.

      Daartoe draagt hij zorg voor een verklaring. De verklaring wordt ingediend bij de Sociale verzekeringsbank. De
      Sociale verzekeringsbank stelt onmiddellijk het college daarvan in kennis.

      2 Een persoon aan wie een persoonsgebonden budget is verstrekt kan niet een overeenkomst als bedoeld in
      [artikel 8b, eerste lid, onderdeel b][ref1], en de hiergenoemde verklaring met betrekking tot dezelfde derde, die
      ten laste van het persoonsgebonden budget betalingen zou ontvangen, indienen.

      3 Een verklaring wordt opgesteld volgens het vigerende, door de Sociale verzekeringsbank vastgestelde model en
      bevat ten minste:

      a. de naam, de geboortedatum en het burgerservicenummer van de hulp uit het sociaal netwerk;

      b. de ingangsdatum vanaf wanneer op verzoek een tegemoetkoming kan worden verstrekt;

      c. de mededelingen dat de hulp uit het sociaal netwerk zonder dienstbetrekking jeugdhulp zal verlenen aan de
      persoon aan wie een persoonsgebonden budget is verstrekt en of een bedrag per kalendermaand en of door het college
      vastgestelde bedragen worden aangevraagd;

      d. de handtekening van de persoon aan wie een persoonsgebonden budget is verstrekt, waarmee die persoon aangeeft
      dat hij inderdaad jeugdhulp uit het sociaal netwerk zal ontvangen, alsmede de handtekening van de hulp uit het
      sociaal netwerk.

      4 De verklaring, bedoeld in het eerste lid, behoeft de goedkeuring van het college.

      5 Het college kan de goedkeuring slechts geven indien de verklaring voldoet aan de eisen, bedoeld in het derde lid.

      6 Een wijziging van een goedgekeurde verklaring wordt onmiddellijk met een formulier aan de Sociale
      verzekeringsbank kenbaar gemaakt door middel van invulling van een daartoe door de Sociale verzekeringsbank
      beschikbaar gesteld modelformulier.


      [ref1]: https://wetten.overheid.nl/BWBR0036007#Artikel8b
    url: https://wetten.overheid.nl/BWBR0036007/2025-01-01#Artikel8ab
    references:
      - id: ref1
        bwb_id: BWBR0036007
        artikel: 8b
        paragraaf: '8'
  - number: 8b
    text: |-
      1 De Sociale verzekeringsbank voert het budgetbeheer, bedoeld in [artikel 8.1.8, eerste lid, van de wet][ref1],
      uit:

      a. overeenkomstig de beschikking tot verlening van het persoonsgebonden budget, bedoeld in
      [artikel 8.1.1, eerste lid, van de wet][ref2]; en

      b. overeenkomstig een door de persoon aan wie het persoonsgebonden budget is verstrekt met een derde gesloten
      overeenkomst of een verklaring als bedoeld in [artikel 8ab][ref3], die respectievelijk overeenkomstig de
      [artikelen 8a][ref4] of 8ab is goedgekeurd.

      2 In het kader van het budgetbeheer draagt de Sociale verzekeringsbank voor zover deze verschuldigd zijn
      loonbelasting, premies voor de sociale verzekeringen en inkomensafhankelijke bijdragen als bedoeld in de
      [Zorgverzekeringswet][ref5] af, tenzij het gaat om tegemoetkomingen als bedoeld in [artikel 8ab][ref6].

      3 De Sociale verzekeringsbank verricht betalingen uit het persoonsgebonden budget voor overeengekomen jeugdhulp
      die voortvloeit uit een arbeidsovereenkomst, een overeenkomst van opdracht of een overeenkomst voor vervoer,
      uitsluitend aan de derde aan de hand van:

      a. een declaratie voor geleverde jeugdhulp;

      b. een overeenkomst als bedoeld in het eerste lid, onderdeel b, bij overeengekomen periodieke maandbetalingen;

      c. een declaratie of overeenkomst, bedoeld in de onderdelen a en b, indien de overeengekomen jeugdhulp, in de
      periode van 1 maart 2020 tot en met 30 juni 2020, of, voor zover het sociaal-recreatief vervoer betreft, in de
      periode van 1 maart 2020 tot en met 31 augustus 2020, als gevolg van de maatregelen in verband met Covid-19, door
      de desbetreffende derde, niet is verleend;

      d. een declaratie of overeenkomst, bedoeld in de onderdelen a en b, indien de overeengekomen jeugdhulp, in de
      periode van 1 oktober 2020 tot en met 31 december 2021, niet is verleend in verband met:

      1°. een besmetting van de budgethouder of desbetreffende derde, werkzaam op basis van een overeenkomst van
      opdracht, met Covid-19;

      2°. een noodzakelijke quarantaine van de budgethouder of desbetreffende derde in verband met Covid-19;

      3°. een besmetting met Covid-19 op de dagbesteding;

      4°. de door een dagbesteding overeenkomstig de bij of krachtens de [Tijdelijke wet maatregelen covid-19][ref7]
      genomen maatregelen;

      5°. het niet kunnen verlenen overeenkomstig de maatregelen in verband
      met Covid-19 vanwege een beperking bij de budgethouder als bedoeld in
      [artikel 6.6, tweede lid, onderdelen d en e, van de Tijdelijke regeling maatregelen covid-19][ref8]; of

      e. een declaratie of overeenkomst, bedoeld in de onderdelen a en b, indien de overeengekomen jeugdhulp, als gevolg
      van het ontvangen van een vaccinatie voor Covid-19 voor ten hoogste twee uur niet is verleend.

      4 Een declaratie als bedoeld in het derde lid, derde lid, onderdelen a, c, d en e, bevat:

      a. de naam van de derde, en

      1°. het nummer waarmee de derde staat ingeschreven bij de Kamer van Koophandel, of,

      2°. indien de derde niet over dat nummer kan beschikken, de geboortedatum of het burgerservicenummer van de derde;

      b. de naam van de persoon aan wie het persoonsgebonden budget is verstrekt en zijn adres of burgerservicenummer of
      klantnummer bij de Sociale verzekeringsbank;

      c. het tarief;

      d. een verantwoording van de overeengekomen resultaten dan wel een overzicht van het aantal te betalen uren en
      dagdelen of, indien de [Wet minimumloon en minimumvakantiebijslag][ref9] niet van toepassing is op de verbintenis
      waarvoor een vergoeding wordt uitbetaald, etmalen; en

      e. een handtekening van de persoon aan wie het persoonsgebonden budget is verstrekt of, voor zover van toepassing,
      diens vertegenwoordiger, indien het een schriftelijke declaratie betreft.

      5 Indien voor de geleverde jeugdhulp een goedgekeurde verklaring bestaat, betaalt de Sociale verzekeringsbank
      de hulp uit het sociaal netwerk op aanvraag van de persoon aan wie het persoonsgebonden budget is verstrekt
      een tegemoetkoming als bedoeld in [artikel 8ab, eerste lid][ref10], uit. De Sociale verzekeringsbank verricht
      betalingen indien het verzoek is opgesteld met gebruikmaking van een model dat door de Sociale verzekeringsbank
      daartoe beschikbaar is gesteld.

      6 De Sociale verzekeringsbank kan een betaling uit het persoonsgebonden budget geheel of gedeeltelijk beëindigen,
      weigeren of opschorten:

      a. bij het intrekken of herzien van een beslissing op een of meer van de gronden, bedoeld in
      [artikel 8.1.4, eerste lid, van de wet][ref11];

      b. indien een declaratie niet voldoet aan de voorwaarden van de beschikking, bedoeld in het eerste lid, onderdeel
      a, of aan de overeenkomst of verklaring, bedoeld in het eerste lid, onderdeel b;

      c. wegens strijd met het recht, waaronder het recht dat van toepassing is op de arbeidsovereenkomst of overeenkomst
      van opdracht, of het belang van de uitvoerbaarheid van het verrichten van de betalingen uit het persoonsgebonden
      budget door de Sociale verzekeringsbank;

      d. indien de derde een declaratie niet binnen zes weken na de maand waarin de prestatie is verleend, heeft
      ingediend bij de persoon aan wie het persoonsgebonden budget is verstrekt;

      e. indien de Sociale verzekeringsbank een declaratie niet heeft ontvangen binnen vier weken nadat de persoon aan
      wie het persoonsgebonden budget is verstrekt, deze heeft ontvangen;

      f. indien de Sociale verzekeringsbank een verzoek als bedoeld in het vierde lid, niet heeft ontvangen binnen tien
      weken na de kalendermaand waarop een verzoek betrekking heeft;

      g. indien het college bij de toepassing van de bij verordening gestelde regels, bedoeld in
      [artikel 2.9, onderdeel d, van de wet][ref12], de Sociale verzekeringsbank daarom verzoekt.

      7 De Sociale verzekeringsbank verricht betalingen uit het persoonsgebonden budget zonder dat dit bij beschikking
      wordt vastgesteld, binnen dertig dagen na ontvangst van de declaratie of van het verzoek, bedoeld in het vijfde
      lid, tenzij de declaratie of verzoek onjuist of onvolledig is ingediend. Indien een declaratie niet overeenkomstig
      het vierde lid of vijfde lid is ingediend, en betalingen niet zijn beëindigd, geweigerd of opgeschort, nodigt
      de Sociale verzekeringsbank de persoon aan wie het persoonsgebonden budget is verleend uit tot herstel van de
      declaratie of het verzoek. Na herstel wordt de betaling binnen dertig dagen verricht. De Sociale verzekeringsbank
      weigert de betaling geheel of gedeeltelijk indien de declaratie of het verzoek niet binnen een door de Sociale
      verzekeringsbank gestelde termijn is hersteld. Indien de Sociale verzekeringsbank naar aanleiding van een
      declaratie werkzaamheden verricht als bedoeld in het tweede lid, wordt de termijn, bedoeld in de eerste zin,
      verlengd met tien dagen.

      8 Sociale verzekeringsbank verricht periodieke maandbetalingen uit het persoonsgebonden budget zonder dat dit
      bij beschikking wordt vastgesteld, uiterlijk binnen dertig dagen na afloop van de maand waarin de zorg geleverd
      is. Indien de Sociale verzekeringsbank naar aanleiding van de periodieke maandbetaling werkzaamheden verricht als
      bedoeld in het tweede lid wordt de termijn, bedoeld in de eerste zin, verlengd met tien dagen.

      9 Indien de persoon aan wie het persoonsgebonden budget is verstrekt in aanvulling op de bij de beschikking,
      bedoeld in [artikel 8.1.1, eerste lid, van de wet][ref13] toegekende jeugdhulp aanvullende jeugdhulp heeft
      gecontracteerd, betaalt de Sociale verzekeringsbank deze indien daartoe voldoende geld is gestort. De Sociale
      verzekeringsbank stort na de betaling van de aanvullende jeugdhulp binnen redelijke termijn de onbestede gelden
      terug aan degene die hiervoor het geld heeft gestort.

      10 De Sociale verzekeringsbank ondersteunt de persoon aan wie het persoonsgebonden budget is verstrekt bij zijn
      werkgeverstaken of opdrachtgeverschap waaronder ten aanzien van arbeidsomstandighedenregelgeving, zaakschade en
      aansprakelijkheid.

      11 De persoon aan wie een persoonsgebonden budget is verstrekt, houdt een administratie bij van het totaal aan
      niet-geleverde jeugdhulp per derde aan wie betalingen zijn verricht op grond van het derde lid, onderdelen c, d en
      e. Deze administratie bevat in ieder geval de volgende onderdelen:

      a. de naam van de derde;

      b. het overeengekomen tarief; en

      c. een overzicht van het aantal te betalen uren en dagdelen of, indien de
      [Wet minimumloon en minimumvakantiebijslag][ref14] niet van toepassing is op de verbintenis waarvoor een vergoeding
      wordt uitbetaald, etmalen.

      12 De persoon bedoeld in het elfde lid, verstrekt op verzoek van het college voor elke derde het op grond van het
      derde lid, onderdelen c, d en e, totaal aantal betaalde uren inclusief het bijbehorende totaalbedrag door middel
      van een daartoe beschikbaar gesteld formulier aan de Sociale verzekeringsbank.


