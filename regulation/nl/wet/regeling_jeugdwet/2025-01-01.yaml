  - number: '2'
    text: |-
      Als categorieën van gekwalificeerde gedragswetenschappers worden aangewezen:

        - beroepsbeoefenaren die zijn ingeschreven in het register Kinder- en Jeugdpsychologen van het Nederlands Instituut
      van Psychologen;
        - beroepsbeoefenaren die als postmaster-orthopedagoog SKJ of als postmaster-psycholoog SKJ zijn ingeschreven in het
      register, bedoeld in [artikel 5.2.1, eerste lid, van het Besluit Jeugdwet][ref1];
        - beroepsbeoefenaren die als gezondheidszorgpsycholoog, psychotherapeut
      of orthopedagoog-generalist zijn ingeschreven in het register, bedoeld in
      [artikel 3 van de Wet op de beroepen in de individuele gezondheidszorg][ref2];
        - beroepsbeoefenaren die als psychiater zijn ingeschreven in een erkend specialistenregister als bedoeld in
      [artikel 14 van de Wet op de beroepen in de individuele gezondheidszorg][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0035779#Artikel5.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel3
