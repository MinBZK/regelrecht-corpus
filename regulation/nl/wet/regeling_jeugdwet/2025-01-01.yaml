      1 Bij de bekostiging van aanbieders of gekwalificeerde gedragswetenschappers, bedoeld in
      [artikel 2.15, eerste lid, onderdeel a, van de wet][ref1] kan het college gebruik maken van een:

      a. inspanningsgerichte uitvoeringsvariant, of

      b. outputgerichte uitvoeringsvariant.

      2 Bij gebruik van de inspanningsgerichte uitvoeringsvariant of de outputgerichte uitvoeringsvariant draagt het
      college ten aanzien van de financieringswijzen en administratieve processen en de wijze van gegevensuitwisseling,
      bedoeld in [artikel 2.15, eerste lid, onderdelen a en b, van de wet][ref2] zorg voor de toepassing van de iJw.

      3 Toepassing van de iJw houdt in ieder geval in dat er overeenkomstig de iJw elektronisch berichtenverkeer
      is tussen gemeenten en de in het eerste lid bedoelde personen en instanties bij het toewijzen, factureren en
      declareren, en leveren van producten, diensten of resultaten.


