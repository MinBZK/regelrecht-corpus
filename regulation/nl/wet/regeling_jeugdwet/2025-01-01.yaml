  - number: 6b.5
    text: |-
      1 Het college voert geen detailcontrole uit dan nadat is voldaan aan de volgende voorwaarden:

      a. het college heeft een specifieke risicoanalyse verricht op de bevindingen uit het uitgevoerde algemene
      controleplan, bedoeld in [artikel 6b.3, tweede lid][ref1];

      b. het college heeft naar aanleiding van de specifieke risicoanalyse een specifiek controleplan en specifiek
      controledoel opgesteld, waarin de objecten van materiële controle en de methoden van detailcontrole zijn opgenomen;

      c. het overeenkomstig onderdeel b vastgestelde specifieke doel van de materiële controle kan zonder detailcontrole
      niet worden bereikt;

      d. uit het specifieke controleplan blijkt dat in het kader van de detailcontrole niet meer persoonsgegevens worden
      verwerkt dan gelet op het met het onderzoeksdoel en de omstandigheden van het te onderzoeken geval noodzakelijk is;

      e. het college heeft de aanbieder voorafgaand aan de uitvoering van de detailcontrole toereikende en – op verzoek
      van de aanbieder schriftelijke – informatie verstrekt waarin wordt gemotiveerd hoe is voldaan aan de in dit lid
      genoemde voorwaarden.

      2 Indien bij de uitvoering van detailcontrole persoonsgegevens van de jeugdige of degene die het gezag over hem
      uitoefent worden verwerkt, geschiedt dit in opdracht van het college:

      a. in geval van aan een jeugdige verleende geestelijke gezondheidszorg: door of onder verantwoordelijkheid van een
      persoon op wie het medisch beroepsgeheim van toepassing is, of

      b. in geval van aan een jeugdige verleende andere jeugdhulp, preventie, een kinderbeschermingsmaatregel of
      jeugdreclassering: door of onder verantwoordelijkheid van een persoon als bedoeld in onderdeel a, een persoon
      die op grond van [artikel 7.3.11 van de wet][ref2] een geheimhoudingsplicht heeft of een persoon die op grond van
      [artikel 88 van de Wet op de beroepen in de individuele gezondheidszorg][ref3] een geheimhoudingsplicht heeft.

      Op voorafgaand verzoek van de aanbieder is de persoon, bedoeld in onderdeel a of b, aanwezig bij dit deel van de
      controle.

      3 In afwijking van het eerste lid kan het college met betrekking tot een aan een individuele jeugdige verleende
      hulp, preventie, kinderbeschermingsmaatregel of jeugdreclassering detailcontrole uitvoeren zonder dat de in dat lid
      genoemde voorwaarden van toepassing zijn, indien deze jeugdige of, indien de jeugdige jonger is dan twaalf jaar dan
      wel niet in staat kan worden geacht tot een redelijke waardering van zijn belangen ter zake, degene die het gezag
      over hem uitoefent of zijn curator of mentor ten behoeve van de materiële controle schriftelijk toestemming aan
      de aanbieder heeft gegeven voor verstrekking van gegevens over de gezondheid van de jeugdige aan het college. Het
      college verwerkt bij de detailcontrole niet meer gegevens dan gelet op het onderzoeksdoel en de omstandigheden van
      het geval noodzakelijk is.

      4 Het college informeert de aanbieder over de zakelijke inhoud van de voorgenomen uitkomsten van de detailcontrole
      en stelt hem in de gelegenheid daarop binnen een redelijke termijn te reageren. Het college betrekt de reactie van
      de aanbieder bij de vaststelling van de definitieve uitkomsten van de detailcontrole en bericht deze uitkomsten aan
      de aanbieder.


      [ref1]: https://wetten.overheid.nl/BWBR0036007#Artikel6b.3
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel7.3.11
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel88
