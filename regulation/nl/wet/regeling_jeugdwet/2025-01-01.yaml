  - number: 8a
    text: |-
      1 De persoon aan wie een persoonsgebonden budget is verstrekt sluit een schriftelijke arbeidsovereenkomst,
      overeenkomst van opdracht of overeenkomst voor vervoer met iedere derde die hij ten laste van zijn persoonsgebonden
      budget jeugdhulp laat verlenen, behalve voor zover reeds vervoer van een derde is betrokken of een hulp uit het
      sociaal netwerk jeugdhulp zal verlenen.

      2 Overeenkomsten als bedoeld in het eerste lid worden opgesteld volgens de meest recente door de Sociale
      verzekeringsbank vigerende vastgestelde toepasselijke modelovereenkomsten, die beschikbaar waren gesteld ten tijde
      van het afsluiten van die overeenkomst, en bevatten bovendien ten minste:

      a. een weergave van de wijze waarop de derde zal voorzien in de behoefte aan jeugdhulp van degene ten behoeve van
      wie het budget is verstrekt;

      b. de verplichting dat een declaratie de vereiste gegevens, bedoeld in [artikel 8b, vierde lid][ref1], bevat of,
      indien van toepassing, dat wordt gebruikgemaakt van periodiek maandbetalingen;

      c. een beding, inhoudende dat de gemeente een vordering heeft op de persoon die ten laste van het persoonsgebonden
      budget jeugdhulp levert, indien het persoonsgebonden budget naar aanleiding van toerekenbaar handelen van die
      persoon is ingetrokken of herzien, ter hoogte van het bedrag dat gelijk is aan het door die persoon vanwege dat
      toerekenbaar handelen ten laste van het persoonsgebonden budget ten onrechte ontvangen bedrag;

      d. indien de uitkering van vakantiebijslag als bedoeld in de [Wet minimumloon en minimumvakantiebijslag][ref2] van
      toepassing is, een beding, inhoudende dat in het te betalen bruto loon het vakantiegeld is verdisconteerd.

      3 De overeenkomst, bedoeld in het eerste lid, behoeft de goedkeuring van het college en de Sociale
      verzekeringsbank.

      4 Het college kan de goedkeuring slechts geven indien de overeenkomst voldoet aan de eisen, bedoeld in het tweede
      lid.

      5 De Sociale verzekeringsbank kan haar goedkeuring slechts onthouden wegens strijd met het recht, of in
      het belang van de uitvoerbaarheid van het persoonsgebonden budget of van het budgetbeheer, bedoeld in
      [artikel 8.1.8, eerste lid, van de wet][ref3].

      6 Een wijziging van een goedgekeurde overeenkomst wordt onmiddellijk aan de Sociale verzekeringsbank kenbaar
      gemaakt door middel van invulling van een daartoe door de Sociale verzekeringsbank beschikbaar gesteld
      modelformulier.

      7 Op verzoek van een college kan de Minister van Volksgezondheid, Welzijn en Sport bepalen dat dat college, voor
      zover het de goedkeuring van de overeenkomst van personen aan wie het college een persoonsgebonden budget verstrekt
      en het kenbaar maken van een wijziging van de overeenkomst betreft, voor de toepassing van het derde, vijfde
      en zesde lid in de plaats treedt van de Sociale verzekeringsbank. Indien de vorige zin is toegepast bericht het
      college de Sociale verzekeringsbank onmiddellijk van wijzigingen als bedoeld in het zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0036007#Artikel8b
      [ref2]: https://wetten.overheid.nl/BWBR0002638
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel8.1.8
