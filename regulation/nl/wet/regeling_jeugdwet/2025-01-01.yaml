  - number: '9.2'
    text: |-
      Deze regeling treedt in werking met ingang van 1 januari 2015. Indien de Staatscourant waarin deze regeling wordt
      geplaatst, wordt uitgegeven na 31 december 2014, treedt zij in werking met ingang van de dag na de datum van
      uitgifte van de Staatscourant waarin zij wordt geplaatst en werkt zij terug tot en met 1 januari 2015.
    url: https://wetten.overheid.nl/BWBR0036007/2025-01-01#Artikel9.2
