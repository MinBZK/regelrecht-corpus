  - number: '5.1'
    text: |-
      1 Het in [artikel 5.3, eerste lid, van de wet][ref1] bedoelde basisbedrag van de vergoeding voor de verzorging en
      opvoeding van een pleegkind is het bedrag, genoemd in onderdeel a van [bijlage 1][ref2] bij deze regeling.

      2 Het basisbedrag kan worden verminderd voor de periode gedurende welke een pleegkind als gevolg van bijzondere
      omstandigheden tijdelijk niet bij de pleegouder verblijft. Alsdan worden de door de pleegouder werkelijk gemaakte
      noodzakelijke kosten vergoed tot ten hoogste het basisbedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel5.3
      [ref2]: https://wetten.overheid.nl/BWBR0036007
    url: https://wetten.overheid.nl/BWBR0036007/2025-01-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '5.3'
      - id: ref2
        bwb_id: BWBR0036007
  - number: '5.2'
    text: |-
      1 Het basisbedrag, bedoeld in [artikel 5.1][ref1], wordt vermeerderd met een toeslag ter hoogte van het bedrag,
      genoemd in onderdeel b van [bijlage 1][ref2] bij deze regeling:

      a. zolang sprake is van een crisisplaatsing waarbij het pleegkind met spoed is geplaatst bij de pleegouder,
      gedurende de eerste vier weken van het verblijf van het pleegkind;

      b. zolang bij een pleegouder drie of meer pleegkinderen verblijven, voor het derde en volgende pleegkind.

      2 Onverminderd het bepaalde in het eerste lid, wordt het basisbedrag, bedoeld in [artikel 5.1][ref3],
      vermeerderd met een door de pleegzorgaanbieder vast te stellen toeslag van ten hoogste het bedrag, genoemd in
      [onderdeel c van bijlage 1][ref4] bij deze regeling, voor de door de pleegouder ten behoeve van een pleegkind met
      een verstandelijke, zintuiglijke of lichamelijke beperking gemaakte kosten, voor zover:

      a. deze kosten naar het oordeel van de pleegzorgaanbieder redelijkerwijs noodzakelijk zijn in verband met de
      beperkingen;

      b. deze kosten niet kunnen worden voldaan uit het basisbedrag, en

      c. daarvoor geen uitkering op grond van een andere regeling kan worden verstrekt.

      3 De toeslag die noodzakelijk is voor het dekken van de kosten, bedoeld in het tweede lid, wordt verstrekt
      gedurende een door de pleegzorgaanbieder te bepalen periode.


      [ref1]: https://wetten.overheid.nl/BWBR0036007#Artikel5.1
      [ref2]: https://wetten.overheid.nl/BWBR0036007
      [ref3]: https://wetten.overheid.nl/BWBR0036007#Artikel5.1
      [ref4]: https://wetten.overheid.nl/BWBR0036007
    url: https://wetten.overheid.nl/BWBR0036007/2025-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0036007
        artikel: '5.1'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0036007
      - id: ref3
        bwb_id: BWBR0036007
        artikel: '5.1'
        paragraaf: '5'
      - id: ref4
        bwb_id: BWBR0036007
  - number: '5.3'
    text: |-
      De pleegzorgaanbieder verstrekt een door de pleegzorgaanbieder vast te stellen vergoeding voor bijzondere kosten
      voor het pleegkind ingeval sprake is van een pleegoudervoogd dan wel een pleegouder die een pleegkind opvangt in
      het kader van een kinderbeschermingsmaatregel, voor zover:

      a. deze kosten naar het oordeel van de pleegzorgaanbieder redelijkerwijs noodzakelijk worden geacht en niet
      kunnen worden voldaan uit het basisbedrag, bedoeld in [artikel 5.1][ref1], dan wel uit de toeslagen, bedoeld in
      [artikel 5.2][ref2];

      b. voor deze kosten geen uitkering op grond van een andere regeling kan worden verstrekt, en

      c. de kosten redelijkerwijs niet zijn te verhalen op onderhoudsplichtige ouders.


      [ref1]: https://wetten.overheid.nl/BWBR0036007#Artikel5.1
      [ref2]: https://wetten.overheid.nl/BWBR0036007#Artikel5.2
    url: https://wetten.overheid.nl/BWBR0036007/2025-01-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0036007
        artikel: '5.1'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0036007
        artikel: '5.2'
        paragraaf: '5'
  - number: '5.4'
    text: |-
      Het basisbedrag, bedoeld in [artikel 5.1][ref1], en de toeslagen, bedoeld in [artikel 5.2][ref2], worden jaarlijks
      met ingang van 1 januari geïndexeerd overeenkomstig de wijze, bedoeld in [onderdeel d van bijlage 1][ref3] bij
      deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0036007#Artikel5.1
      [ref2]: https://wetten.overheid.nl/BWBR0036007#Artikel5.2
      [ref3]: https://wetten.overheid.nl/BWBR0036007
    url: https://wetten.overheid.nl/BWBR0036007/2025-01-01#Artikel5.4
    references:
