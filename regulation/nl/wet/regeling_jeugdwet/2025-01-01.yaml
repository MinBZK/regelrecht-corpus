  - number: 8c
    text: |-
      1 In afwijking van [artikel 8b, eerste lid, aanhef en onderdeel b][ref1], en het vierde en vijfde lid van dat
      artikel, kan de Sociale verzekeringsbank rechtstreeks aan de persoon aan wie het persoonsgebonden budget is
      verstrekt, betalen:

      a. door die persoon gemaakte vervoerskosten; of

      b. een verantwoordingsvrij bedrag voor jeugdhulp.

      2 In afwijking van [artikel 8b, tweede, vierde lid, en zesde lid, onderdelen d en e][ref2], ontvangt de Sociale
      verzekeringsbank een verzoek om een verantwoordingsvrij bedrag voor jeugdhulp voor het eindigen van de beschikking,
      bedoeld in [artikel 8.1.1, eerste lid, van de wet][ref3], van de persoon aan wie het persoonsgebonden budget is
      verstrekt.

      3 De Sociale verzekeringsbank verricht betalingen, indien de declaratie voor vervoerskosten als bedoeld in het
      eerste lid, onderdeel a, of het verzoek, bedoeld in het tweede lid, is opgesteld met gebruikmaking van een model
      dat door de Sociale verzekeringsbank daartoe beschikbaar is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0036007#Artikel8b
      [ref2]: https://wetten.overheid.nl/BWBR0036007#Artikel8b
