articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *aanbieder:* jeugdhulpaanbieder, aanbieder van preventie of gecertificeerde instelling;
        - *algemene risicoanalyse:* een analyse die erop is gericht te bepalen op welke gegevens een materiële controle of
      een fraudeonderzoek zich zal richten;
        - *Covid-19:* de ziekte veroorzaakt door coronavirus-SARS-CoV-2;
        - *detailcontrole:* onderzoek door het college of door een door het college aangewezen persoon naar bij een
      aanbieder berustende persoonsgegevens met betrekking tot jeugdigen die hun woonplaats hebben in de gemeente
      waarvoor het desbetreffende college werkzaam is, ten behoeve van materiële controle of fraude-onderzoek;
        - *formele controle:* een onderzoek waarbij het college of een door het college aangewezen persoon nagaat of: 1.
      het gedeclareerde bedrag: a. een prestatie betreft die is geleverd ten behoeve van een jeugdige die zijn woonplaats
      heeft binnen de gemeente van het college; b. een prestatie betreft voor een in de [wet][ref1] bedoelde dienst;
      c. een prestatie betreft tot levering waarvan degene die de declaratie indient jegens de gemeente bevoegd is;
      en d. overeenkomt met daartoe door of namens het college gemaakte afspraken of subsidievoorwaarden dan wel in
      hoogte aansluit bij hetgeen in de Nederlandse marktomstandigheden in redelijkheid passend is te achten; of 2. het
      gedeclareerde bedrag een verrekening als bedoeld in [artikel 8.2.1, derde lid, van de wet][ref2] betreft;
        - *fraude-onderzoek:* een onderzoek waarbij het college of een door het college aangewezen persoon nagaat of degene
      die bij de gemeente een bedrag als bedoeld in [artikel 6a.1][ref3] in rekening brengt, valsheid in geschrifte,
      bedrog, benadeling van rechthebbenden of verduistering pleegt of tracht te plegen ten nadele van de gemeente, met
      het doel een betaling of ander voordeel te verkrijgen waarop hij geen recht heeft of kan hebben;
        - *gegevens over gezondheid:* gegevens over gezondheid, als bedoeld in artikel 4, onderdeel 15 van de Algemene
      verordening gegevensbescherming;
        - *iJw:* door het Zorginstituut beheerde standaarden als bedoeld in [artikel 2.15, derde lid, van de Jeugdwet][ref4]
      bestaande uit bedrijfsregels, berichtenstandaarden en berichtspecificaties;
        - *inspanningsgerichte uitvoeringsvariant:* uitvoering van jeugdhulp of werkzaamheden van een gekwalificeerde
      gedragswetenschapper waarbij er een afspraak is tussen het college en de aanbieder of de gekwalificeerde
      gedragswetenschapper over de levering van een specifiek product of dienst in een afgesproken eenheid;
        - *materiële controle:* een onderzoek waarbij het college of een door het college aangewezen persoon nagaat of
      de gedeclareerde prestatie is geleverd en, indien het college de materiële controle daar ook toe wenst uit te
      strekken, of die prestatie: a. aansluit bij een door of namens het college afgegeven beschikking, inhoudende dat
      recht bestaat op preventie of jeugdhulp, b. indien het college een aanbieder heeft gemandateerd om namens hem
      preventie of jeugdhulp te verstrekken, binnen dat mandaat valt, c. past binnen een verwijzing door een huisarts,
      medisch specialist of jeugdarts, d. aansluit op een door de gecertificeerde instelling genomen beschikking als
      bedoeld in [artikel 3.5 van de wet][ref5], inhoudende dat jeugdhulp aangewezen is; e. aansluit op een rechterlijke
      uitspraak, inhoudende dat de jeugdige is aangewezen op een kinderbeschermingsmaatregel of op jeugdreclassering; of
      f. aansluit bij een verrekening als bedoeld in [artikel 8.2.1, derde lid, van de wet][ref6];
        - *Ministers:* de Minister van Volksgezondheid, Welzijn en Sport en de Minister van Veiligheid en Justitie;
        - *outputgerichte uitvoeringsvariant:* uitvoering van jeugdhulp of werkzaamheden van een gekwalificeerde
      gedragswetenschapper waarbij er een afspraak is tussen het college en de aanbieder of de gekwalificeerde
      gedragswetenschapper over het te behalen resultaat;
        - *pleegkind:* jeugdige die door de pleegouder wordt opgevoed en verzorgd als behorend tot het gezin van de
      pleegouder en voor wie een pleegcontract als bedoeld in [artikel 5.2, eerste lid, van de wet][ref7] is afgesloten;
        - *specifieke risicoanalyse:* een analyse die erop is gericht te bepalen op welke gegevens en op welke aanbieders
      of categorieën van aanbieders van jeugdhulp of preventie of op welke gecertificeerde instellingen de detailcontrole
      zich zal richten;
        - *wet:* [Jeugdwet][ref8].


