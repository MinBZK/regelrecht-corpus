      In deze paragraaf wordt verstaan onder:

      a. *derde:* derde als bedoeld in [artikel 8.1.1, eerste lid, van de wet][ref1];

      b. *hulp uit het sociale netwerk:* natuurlijk persoon die jeugdhulp verleent die rechtstreeks voortvloeit uit een
      tussen hem en de jeugdige of zijn ouders bestaande sociale relatie, tenzij die jeugdhulp beroeps- of bedrijfsmatig
      wordt verleend.


