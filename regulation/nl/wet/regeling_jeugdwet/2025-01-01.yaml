  - number: 6b.7
    text: |-
      1 Bij fraude-onderzoek zijn de voorwaarden, bedoeld in [artikel 6b.5, eerste lid, onderdelen b en d][ref1], van
      overeenkomstige toepassing, en is de in onderdeel e bedoelde voorwaarde van overeenkomstige toepassing voor zover
      het onderzoeksbelang of het belang van de bescherming van de persoonlijke levenssfeer van de jeugdige of degene die
      het gezag over hem uitoefent zich hier niet tegen verzet.

      2 In afwijking van het eerste lid kan het college met betrekking tot een individuele jeugdige detailcontrole
      uitvoeren zonder dat de in dat lid genoemde voorwaarden van toepassing zijn, indien die jeugdige of, indien de
      jeugdige jonger is dan twaalf jaar dan wel niet in staat kan worden geacht tot een redelijke waardering van zijn
      belangen ter zake, degene die het gezag over hem uitoefent of zijn curator of mentor ten behoeve van het fraude-
      onderzoek schriftelijk toestemming heeft gegeven voor verstrekking van persoonsgegevens, waaronder gegevens met
      betrekking tot zijn gezondheid, aan het college. Het college verwerkt ten behoeve van de detailcontrole niet meer
      gegevens dan gelet op het onderzoeksdoel en de omstandigheden van het geval noodzakelijk is.

      3 Het college verwerkt bij het fraude-onderzoek verkregen persoonsgegevens slechts verder voor zover dat
      noodzakelijk is voor het verrichten van werkzaamheden die uit dat onderzoek voortvloeien


