  - number: '4.3'
    text: |-
      1 De jeugdhulpaanbieder en de gecertificeerde instelling stellen de jaarverslaggeving en een jaardocument op
      dat ten minste een verantwoordingsdocument, het verslag, bedoeld in [artikel 4.3.1 van de wet][ref1] en andere
      informatie die wordt verstrekt op grond van het model, bedoeld in het derde lid, bevat.

      2 De jaarverslaggeving en het jaardocument worden jaarlijks uiterlijk vijf maanden na het verstrijken van het jaar
      waarop zij betrekking hebben ter inzage gelegd en op verzoek van de Ministers aan hen en aan derden verstrekt.
      In afwijking van de vorige zin worden de jaarverslaggeving en het jaardocument over de verslagjaren 2019 of 2020
      uiterlijk vóór 1 oktober 2020, respectievelijk 1 oktober 2021 ter inzage gelegd en op verzoek van de Ministers aan
      hen en aan derden verstrekt.

      3 De jaarverslaggeving en het jaardocument worden opgesteld met gebruikmaking van het model dat is te verkrijgen
      via de website www.jaarverantwoordingzorg.nl.

      4 De Ministers stellen jaarlijks uiterlijk voor 1 oktober na overleg met betrokken partijen het model voor het
      volgende verslagjaar vast en kunnen dit model tussentijds herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4.3.1
    url: https://wetten.overheid.nl/BWBR0036007/2025-01-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: 4.3.1
  - number: '4.4'
    text: |-
      1 Het bestuur van een jeugdhulpaanbieder levert de Jaarverantwoording Jeugd vóór 1 juni van het jaar volgend op het
      verslagjaar, met gebruikmaking van het elektronisch platform DigiMV, aan bij het Centraal Informatiepunt Beroepen
      Gezondheidszorg. De Jaarverantwoording Jeugd bestaat uit:

      a. de jaarverslaggeving, bedoeld in [artikel 4.3][ref1];

      b. het jaardocument, bedoeld in [artikel 4.3][ref2];

      2 De ministers kunnen het bestuur van een jeugdhulpaanbieder of een gecertificeerde instelling in geval van
      overmacht uitstel van indiening verlenen op een gemotiveerd verzoek dat vóór 1 april van het jaar, volgend op het
      verslagjaar, in elektronische vorm via het e-mailadres meldpunt@igj.nl moet zijn ingediend. Een uitstel dat naar
      aanleiding van een verzoek als bedoeld in de vorige zin is verleend, geldt tevens voor de verplichtingen, bedoeld
      in [artikel 4.3, tweede lid][ref3].

      3 In afwijking van het eerste lid wordt de Jaarverantwoording Jeugd over de verslagjaren 2019 of 2020 aangeleverd
      vóór 1 oktober 2020, respectievelijk 1 oktober 2021, en hoeven over dat verslagjaar de gegevens, bedoeld in
      [artikel 4.1, eerste en tweede lid, van de Wet normering topinkomens][ref4], niet te worden aangeleverd met
      gebruikmaking van het elektronisch platform DigiMV. In afwijking van het tweede lid kan een verzoek om uitstel van
      indiening van de Jaarverantwoording Jeugd over de verslagjaren 2019 of 2020 worden ingediend vóór 15 juli 2020,
      respectievelijk 15 juli 2021.


      [ref1]: https://wetten.overheid.nl/BWBR0036007#Artikel4.3
      [ref2]: https://wetten.overheid.nl/BWBR0036007#Artikel4.3
      [ref3]: https://wetten.overheid.nl/BWBR0036007#Artikel4.3
      [ref4]: https://wetten.overheid.nl/BWBR0032249#Artikel4.1
