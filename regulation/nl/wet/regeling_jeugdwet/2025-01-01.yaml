        artikel: '5.1'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0036007
        artikel: '5.2'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0036007
  - number: 5a.1
    text: |-
      1 Ingeval een jeugdige ten minste gedurende een maand voltijds verblijft in een accommodatie en diens ouders niet
      voldoen aan hun onderhoudsplicht verstrekt de jeugdhulpaanbieder:

      a. zakgeld aan een jeugdige die de leeftijd van zes maar nog niet van twaalf jaar heeft bereikt; en

      b. zak- en kleedgeld aan een jeugdige van twaalf jaar of ouder.

      2 Het zakgeld of het zak- en kleedgeld bedraagt het bedrag, genoemd in [bijlage 1a][ref1] bij deze regeling.

      3 De jeugdhulpaanbieder kan het bedrag, bedoeld in het tweede lid, vermeerderen voor zover dat naar het oordeel van
      de jeugdhulpaanbieder redelijkerwijs noodzakelijk is in verband met bijzondere omstandigheden.

      4 De jeugdhulpaanbieder maakt afspraken met de jeugdige over de wijze en de tijdstippen waarop het zakgeld of zak-
      en kleedgeld zal worden verstrekt.

      5 Indien een jeugdige wordt overgeplaatst naar een accommodatie van een andere jeugdhulpaanbieder voor een periode
      van ten minste een maand verstrekt die jeugdhulpaanbieder het zakgeld of zak- en kleedgeld conform de afspraken,
      bedoeld in het vierde lid, tenzij zwaarwegende omstandigheden zich daartegen verzetten.


      [ref1]: https://wetten.overheid.nl/BWBR0036007
    url: https://wetten.overheid.nl/BWBR0036007/2025-01-01#Artikel5a.1
    references:
      - id: ref1
        bwb_id: BWBR0036007
  - number: 5a.2
    text: |-
      Indien een jeugdige bij de opname of gedurende het verblijf in een accommodatie geen of onvoldoende kleding of
      schoeisel tot zijn beschikking heeft, verstrekt de jeugdhulpaanbieder op de kortst mogelijke termijn benodigde
      kleding en schoeisel aan de jeugdige.
    url: https://wetten.overheid.nl/BWBR0036007/2025-01-01#Artikel5a.2
  - number: 5a.3
    text: |-
      Het bedrag, bedoeld in [artikel 5a.1, tweede lid][ref1], wordt periodiek aangepast.


      [ref1]: https://wetten.overheid.nl/BWBR0036007#Artikel5a.1
    url: https://wetten.overheid.nl/BWBR0036007/2025-01-01#Artikel5a.3
    references:
      - id: ref1
        bwb_id: BWBR0036007
        artikel: 5a.1
        paragraaf: 5a
  - number: '6'
    text: |-
      De beveiliging van de gegevensverwerking, bedoeld in de [artikelen 7.2.1][ref1] en [7.2.4 van de wet][ref2],
      voldoet aan NEN-ISO-IEC 27001 en NEN-ISO-IEC 27002 of aan daaraan gelijkwaardige normen.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel7.2.4
    url: https://wetten.overheid.nl/BWBR0036007/2025-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: 7.2.1
      - id: ref2
        bwb_id: BWBR0034925
        artikel: 7.2.4
  - number: 6a.1
    text: |-
      1 Een aanbieder die voor een in de [wet][ref1] bedoelde dienst bij een gemeente een bedrag in rekening brengt,
      vermeldt daarbij de volgende gegevens:

      a. gegevens ter identificatie van de aanbieder, te weten van die aanbieder:

      1°. naam en adres,

      2°. instellingscode,

      3°. praktijkcode, of

      4°. zorgverlenerscode;

      b. het in rekening gebrachte bedrag alsmede de wijze waarop en de termijn waarbinnen de rekening dient te worden
      voldaan;

      c. gegevens ter identificatie van de jeugdige ten behoeve van wie de dienst is of zal worden verleend, te weten van
      die jeugdige:

      1°. burgerservicenummer, of indien de aanbieder niet over dat nummer kan beschikken,

      2°. naam, adres en geboortedatum;

      d. tenzij door of namens het college is aangegeven dat daar geen behoefte aan bestaat: de datum waarop de
      dienstverlening is aangevangen of naar verwachting zal aanvangen;

      e. tenzij door of namens het college is aangegeven dat daar geen behoefte aan bestaat: de datum waarop de
      dienstverlening is beëindigd of naar verwachting zal eindigen;

      f. het voor het gedeclareerde bedrag relevante aantal eenheden of tijdseenheden gedurende welke de diensten zijn of
      zullen worden verricht;

      g. indien verwijzing door een huisarts, medisch specialist of jeugdarts heeft plaatsgevonden, van de desbetreffende
      arts:

      1°. naam en adres, of

      2°. zorgverlenerscode;

      h. indien in een beschikking van het college is neergelegd dat de jeugdige op de verleende dienst is aangewezen of
      indien een opdrachtnummer is toegekend: het nummer van de beschikking of het opdrachtnummer.

      2 Een gekwalificeerde gedragswetenschapper die voor een in de [wet][ref2] bedoelde dienst een bedrag in rekening
      brengt, vermeldt daarbij de gegevens, bedoeld in het eerste lid, onderdelen a, b en c, alsmede om welke dienst het
      is gegaan, de datum waarop hij zijn dienst heeft verleend en de naam en het adres van degene in wiens opdracht hij
      de dienst heeft verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0034925
      [ref2]: https://wetten.overheid.nl/BWBR0034925
    url: https://wetten.overheid.nl/BWBR0036007/2025-01-01#Artikel6a.1
    references:
      - id: ref1
        bwb_id: BWBR0034925
      - id: ref2
        bwb_id: BWBR0034925
  - number: 6a.3
    text: |-
      Een jeugdhulpaanbieder die jeugdhulp heeft verleend of zal verlenen of een aanbieder die preventie heeft verleend
      of zal verlenen, vermeldt bij de declaratie naast de in [artikel 6a.1, eerste lid][ref1], bedoelde gegevens de
      persoonsgegevens die hij ingevolge door of namens het college gemaakte afspraken dan wel gegeven instructies moet
      vermelden, met dien verstande dat niet meer persoonsgegevens worden vermeld dan de persoonsgegevens die voor de
      gemeente noodzakelijk zijn ten behoeve van het verrichten van de formele controle en de betaling van de declaratie.


      [ref1]: https://wetten.overheid.nl/BWBR0036007#Artikel6a.1
    url: https://wetten.overheid.nl/BWBR0036007/2025-01-01#Artikel6a.3
    references:
      - id: ref1
        bwb_id: BWBR0036007
        artikel: 6a.1
        paragraaf: 6a
  - number: 6a.4
    text: |-
      Een gecertificeerde instelling die een kinderbeschermingsmaatregel uitvoert, vermeldt bij de declaratie naast de in
      [artikel 6a.1, eerste lid][ref1], bedoelde gegevens of sprake is van:

      a. eerste jaar ondertoezichtstelling,

      b. vervolgjaren ondertoezichtstelling, of

      c. voogdij.


      [ref1]: https://wetten.overheid.nl/BWBR0036007#Artikel6a.1
    url: https://wetten.overheid.nl/BWBR0036007/2025-01-01#Artikel6a.4
    references:
      - id: ref1
        bwb_id: BWBR0036007
        artikel: 6a.1
        paragraaf: 6a
  - number: 6a.5
    text: |-
      Een gecertificeerde instelling die jeugdreclassering uitvoert vermeldt bij de declaratie naast de in
      [artikel 6a.1, eerste lid][ref1], bedoelde gegevens of sprake is van:

      a. toezicht en begeleiding,

      b. individuele trajectbegeleiding Harde Kern,

      c. individuele trajectbegeleiding Criem,

      d. scholings- en trainingsprogramma,

      e. gedragsbeïnvloedende maatregel,

      f. voorbereiding gedragsbeïnvloedende maatregel, of

      g. samenloop met ondertoezichtstelling of voogdij, als bedoeld in [artikel 6a.4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0036007#Artikel6a.1
      [ref2]: https://wetten.overheid.nl/BWBR0036007#Artikel6a.4
    url: https://wetten.overheid.nl/BWBR0036007/2025-01-01#Artikel6a.5
    references:
      - id: ref1
        bwb_id: BWBR0036007
        artikel: 6a.1
        paragraaf: 6a
      - id: ref2
        bwb_id: BWBR0036007
        artikel: 6a.4
        paragraaf: 6a
  - number: 6a.6
    text: |-
      De [artikelen 6a.1 tot en met 6a.5][ref1] gelden niet voor jeugdhulp, preventie, maatregelen van kinderbescherming
      of jeugdreclassering die is verleend ten behoeve van een jeugdige wiens verblijfplaats geheim dient te blijven
      omdat hij ernstig wordt bedreigd, mits ter zake van de declaratie afspraken tussen de aanbieder en de gemeente
      gelden en de aanbieder deze afspraken in acht neemt.


      [ref1]: https://wetten.overheid.nl/BWBR0036007#Artikel6a.1
    url: https://wetten.overheid.nl/BWBR0036007/2025-01-01#Artikel6a.6
    references:
      - id: ref1
        bwb_id: BWBR0036007
        artikel: 6a.1
        paragraaf: 6a
  - number: 6a.7
    text: |-
      1 Het college of een door het college aangewezen persoon verwerkt persoonsgegevens als bedoeld in de
      [artikelen 6a.1 tot en met 6a.5][ref1] slechts voor zover zij noodzakelijk zijn ten behoeve van:

      a. het verrichten van formele controle,

      b. het betalen van het gedeclareerde bedrag, behalve voor zover de formele controle tot de conclusie leidt dat de
      betaling niet rechtmatig zou zijn, of

      c. het zonodig bij de declarant opvragen van nadere persoonsgegevens als bedoeld in de
      [artikelen 6a.1 tot en met 6a.5][ref2] indien de formele controle uitwees dat betaling van de declaratie niet
      rechtmatig zou zijn omdat noodzakelijke gegevens ontbreken.

      2 Het college of een door het college aangewezen persoon is bevoegd om bij de declaratie vermelde persoonsgegevens
      verder te verwerken voor zover dat noodzakelijk is voor:

      a. het verrichten van materiële controle, of

      b. het verrichten van fraude-onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0036007#Artikel6a.1
      [ref2]: https://wetten.overheid.nl/BWBR0036007#Artikel6a.1
    url: https://wetten.overheid.nl/BWBR0036007/2025-01-01#Artikel6a.7
    references:
      - id: ref1
        bwb_id: BWBR0036007
        artikel: 6a.1
        paragraaf: 6a
      - id: ref2
        bwb_id: BWBR0036007
        artikel: 6a.1
        paragraaf: 6a
  - number: 6b.1
    text: |-
      1 Het college verricht materiële controle op de in de [artikelen 6b.2 tot en met 6b.6][ref1] bepaalde wijze.

      2 Het college verricht fraude-onderzoek op de in de [artikel 6b.7][ref2] bepaalde wijze.

      3 Aanbieders zijn verplicht medewerking te verlenen aan overeenkomstig het eerste of tweede lid uitgevoerde
      controles of onderzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0036007#Artikel6b.2
      [ref2]: https://wetten.overheid.nl/BWBR0036007#Artikel6b.7
    url: https://wetten.overheid.nl/BWBR0036007/2025-01-01#Artikel6b.1
    references:
      - id: ref1
        bwb_id: BWBR0036007
        artikel: 6b.2
        paragraaf: 6b
      - id: ref2
        bwb_id: BWBR0036007
        artikel: 6b.7
        paragraaf: 6b
  - number: 6b.2
    text: |-
      Het college stelt voorafgaand aan de uitvoering van de materiële controle het doel ervan vast door te bepalen
      wanneer voldoende zekerheid is verkregen dat de door de aanbieder in rekening gebrachte prestatie is geleverd en,
      indien het college de materiële controle daar ook toe wenst uit te strekken, of die prestatie:

      a. aansluit bij een door of namens het college afgegeven beschikking, inhoudende dat recht bestaat op preventie
      of jeugdhulp,

      b. indien het college een aanbieder heeft gemandateerd om namens hem preventie of jeugdhulp te verstrekken, binnen
      dat mandaat valt,

      c. past binnen een verwijzing door een huisarts, medisch specialist of jeugdarts,

      d. aansluit op een door de gecertificeerde instelling genomen beschikking als bedoeld in
      [artikel 3.5 van de wet][ref1], inhoudende dat jeugdhulp aangewezen is;

      e. aansluit op een rechterlijke uitspraak, inhoudende dat de jeugdige is aangewezen op een
      kinderbeschermingsmaatregel of op jeugdreclassering; of

      f. aansluit bij een verrekening als bedoeld in [artikel 8.2.1, derde lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel3.5
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel8.2.1
    url: https://wetten.overheid.nl/BWBR0036007/2025-01-01#Artikel6b.2
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '3.5'
