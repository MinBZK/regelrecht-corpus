  - number: '3'
    text: |-
      1 Een onderzoek dat wordt ingesteld op grond van [artikel 2.10 van de wet][ref1] juncto
      [artikel 2.5.1, eerste lid, van de Wet maatschappelijke ondersteuning 2015][ref2] bestaat mede uit een
      ervaringsonderzoek onder ten minste een representatief te achten aantal personen:

      a. voor wie op grond van [artikel 2.3, eerste lid, van de wet][ref3] de inzet van een voorziening is overwogen;

      b. die gebruik maken van een individuele voorziening;

      c. die gebruik maken van overige voorzieningen;

      d. ten aanzien van wie een kinderbeschermingsmaatregel is uitgevoerd;

      e. ten aanzien van wie jeugdreclassering is uitgevoerd.

      2 Voor het onderzoek, bedoeld in het eerste lid, wordt gebruik gemaakt van een vragenlijst die ten minste ingaat op
      hoe personen als bedoeld in het eerste lid:

      a. de toegankelijkheid van voorzieningen ervaren;

      b. de kwaliteit van de jeugdhulp en van de uitvoering van kinderbeschermingsmaatregelen en jeugdreclassering
      ervaren;

      c. de jeugdhulp en de uitvoering van kinderbeschermingsmaatregelen en jeugdreclassering vinden bijdragen aan
      het gezond en veilig opgroeien, het groeien naar zelfstandigheid, de zelfredzaamheid en de maatschappelijke
      participatie.


