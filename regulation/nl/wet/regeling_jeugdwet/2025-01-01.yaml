        artikel: 6c.1
        paragraaf: 6c
  - number: 9.1.b
    text: |-
      [Artikel 4.1, tweede lid][ref1], zoals dat luidde op 31 december 2021, blijft van toepassing op de
      jaarverslaggeving over verslagjaar 2020.


      [ref1]: https://wetten.overheid.nl/BWBR0036007#Artikel4.1
