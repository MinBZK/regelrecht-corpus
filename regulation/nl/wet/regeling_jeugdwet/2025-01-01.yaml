    text: |-
      1 Het college legt de specifieke risicoanalyse en de uitvoering van detailcontrole in zijn administratie vast om
      toetsing door en verantwoording aan toezichthouders mogelijk te maken. Daarbij worden niet meer persoonsgegevens,
      waaronder gegevens over gezondheid, verwerkt dan voor dit doel noodzakelijk is.

      2 Het college bewaart na detailcontrole de daarbij verwerkte persoonsgegevens niet langer dan noodzakelijk is voor
      het doel waarvoor zij zijn verkregen.

      3 Het college verwerkt bij de detailcontrole verkregen persoonsgegevens slechts verder voor zover dat noodzakelijk
      is voor:

      a. het verrichten van werkzaamheden die uit de detailcontrole voortvloeien, of

      b. het verrichten van fraude-onderzoek.
