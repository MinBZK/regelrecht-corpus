        artikel: 4.0.1
  - number: '4.1'
    text: |-
      1 [Artikel 4.3.1, eerste lid, van de wet][ref1] alsmede de [artikelen 4.2][ref2], [4.3][ref3]
      en [4.4][ref4] van deze regeling zijn niet van toepassing op jeugdhulpaanbieders als bedoeld in
      [artikel 1.1, onderdeel 2°, van de wet][ref5].

      2 In afwijking van de [artikelen 4.2 tot en met 4.4][ref6] is op de jaarverslaggeving van een jeugdhulpaanbieder
      als bedoeld in [artikel 1.1, onderdeel 1°, van de Jeugdwet][ref7] of gecertificeerde instelling, die tevens
      een zorgaanbieder is waarop [artikel 40b van de Wet marktordening gezondheidszorg][ref8] van toepassing is, het
      bepaalde in de [Regeling openbare jaarverantwoording WMG][ref9] van overeenkomstige toepassing, met dien verstande
      dat:

      a. vorenbedoelde jeugdhulpaanbieder of gecertificeerde instelling die een winst- en verliesrekening opstelt als
      bedoeld in [Bijlage 1][ref10], Model F, of een staat van baten en lasten als bedoeld in [Bijlage 2][ref11],
      Model B, D of F, of [Bijlage 3, Model B, van die regeling][ref12], in de resultatenrekening afzonderlijk de
      opbrengsten op grond van de [Jeugdwet][ref13] vermeldt;

      b. voor de toepassing van [artikel 15 van de Regeling openbare jaarverantwoording WMG][ref14] in geval van een
      jeugdhulpaanbieder onder het aandeel zorg van de netto-omzet wordt verstaan: het aandeel zorg en jeugdhulp van de
      netto-omzet.

      3 In afwijking van de [artikelen 4.2 tot en met 4.4][ref15] is op de jaarverslaglegging van een jeugdhulpaanbieder
      als bedoeld in [artikel 1.1, onderdeel 1°, van de Jeugdwet][ref16], die niet tevens een zorgaanbieder is
      waarop [artikel 40b van de Wet marktordening gezondheidszorg][ref17] van toepassing is, het bepaalde in de
      [Regeling jaarverslaggeving onderwijs][ref18] van overeenkomstige toepassing, indien:

      a. de jeugdhulpaanbieder tevens een bekostigde onderwijsinstelling is; en

      b. de netto-omzet van de jeugdhulpaanbieder gedurende twee opeenvolgende balansdata, zonder onderbreking nadien
      gedurende twee opeenvolgende balansdata, voor een groter aandeel bestaat uit onderwijs dan uit jeugdhulp.

      4 Het derde lid is van overeenkomstige toepassing op het eerste en tweede boekjaar voor een jeugdhulpaanbieder
      waarvan op de balansdatum van het eerste boekjaar een groter aandeel van de netto-omzet bestaat uit onderwijs dan
      uit jeugdhulp.


