  - number: 8d
    text: |-
      De persoon aan wie het persoonsgebonden budget is verstrekt, doet aan de Sociale verzekeringsbank
      op verzoek of onverwijld uit eigen beweging mededeling van gegevens waarvan hem redelijkerwijs
      duidelijk moet zijn dat zij noodzakelijk zijn voor het uitvoeren van het budgetbeheer, bedoeld in
      [artikel 8.1.8, eerste lid, van de wet][ref1], of het uitvoeren van betalingen ten laste van het persoonsgebonden
      budget.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel8.1.8
    url: https://wetten.overheid.nl/BWBR0036007/2025-01-01#Artikel8d
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: 8.1.8
  - number: 8e
    text: |-
      1 In het belang van een gecoördineerde uitvoering van het persoonsgebonden budget ondersteunt de Sociale
      verzekeringsbank het college bij de uitoefening van diens taken als de verstrekker van dat budget.

      2 De Sociale verzekeringsbank en het college werken samen aan de digitalisering en standaardisering van de
      uitvoering van het persoonsgebonden budget.
    url: https://wetten.overheid.nl/BWBR0036007/2025-01-01#Artikel8e
  - number: '9.1'
    text: |-
      De [Regeling beleidsinformatie jeugdzorg 2011][ref1] blijft nadat zij met ingang van 1 januari 2015 is vervallen,
      van toepassing op informatieverstrekkingen met betrekking tot de periode voorafgaand aan de inwerkingtreding van
      deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0030593
    url: https://wetten.overheid.nl/BWBR0036007/2025-01-01#Artikel9.1
    references:
