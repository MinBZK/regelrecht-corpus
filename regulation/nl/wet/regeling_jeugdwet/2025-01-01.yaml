        bwb_id: BWBR0030593
  - number: 9.1a
    text: |-
      In afwijking van [artikel 6c.1, tweede lid][ref1], hoeven de iJw niet te worden toegepast bij de uitvoering van
      contracten die door de contractspartijen zijn ondertekend voor de datum waarop deze regeling in werking treedt,
      behalve voor zover:

      a. deze contracten volgens de gezamenlijke contractspartijen ruimte laten voor toepassing daarvan, of

      b. deze contracten na de inwerkingtreding van deze regeling worden gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0036007#Artikel6c.1
    url: https://wetten.overheid.nl/BWBR0036007/2025-01-01#Artikel9.1a
    references:
