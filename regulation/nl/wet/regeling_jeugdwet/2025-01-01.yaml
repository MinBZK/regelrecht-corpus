  - number: 6b.4
    text: |-
      Het college maakt informatie openbaar over het ingevolge [artikel 6b.2][ref1] vastgestelde controledoel en het
      ingevolge [artikel 6b.3][ref2] vastgestelde algemene controleplan op een zodanige wijze dat die informatie voor
      jeugdigen of degenen die het gezag over hen uitoefenen alsmede voor aanbieders gemakkelijk verkrijgbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0036007#Artikel6b.2
      [ref2]: https://wetten.overheid.nl/BWBR0036007#Artikel6b.3
