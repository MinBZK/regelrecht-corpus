  - number: 2a.1
    text: |-
      Als categorie van deskundigen als bedoeld in de begripsomschrijving van jeugdhulpverantwoordelijke in
      [artikel 1.1 van de wet][ref1] worden aangewezen:

      a. beroepsbeoefenaren die zijn ingeschreven in het register Kinder- en Jeugdpsychologen van het Nederlands
      Instituut van Psychologen;

      b. geregistreerde jeugdprofessionals die in het bezit zijn van een diploma op ten minste HBO-niveau;

      c. geregistreerde professionals die in het bezit zijn van een diploma op ten minste HBO-niveau.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1.1
