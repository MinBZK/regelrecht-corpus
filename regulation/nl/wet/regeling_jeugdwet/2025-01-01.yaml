  - number: '4.0'
    text: |-
      1 De melding, bedoeld in [artikel 4.0.1 van de wet][ref1], geschiedt door het volledig invullen van het daartoe
      via de website [www.toetredingzorgaanbieders.nl](http://www.toetredingzorgaanbieders.nl) beschikbaar gestelde
      formulier.

      2 De jeugdhulpaanbieder doet de melding niet eerder dan drie maanden voor de aanvang van de jeugdhulp.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4.0.1
