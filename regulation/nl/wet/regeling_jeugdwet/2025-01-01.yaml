        artikel: 8.2.1
  - number: 6b.3
    text: |-
      1 Het college voert een algemene risicoanalyse uit op basis van gegevens waarover deze in verband met de uitvoering
      van de [Jeugdwet][ref1] beschikt.

      2 Het college stelt op basis van de in het eerste lid uitgevoerde algemene risicoanalyse een algemeen controleplan
      vast, waarin de objecten van materiële controle en de in te zetten controle-instrumenten zijn opgenomen.

      3 Het naar aanleiding van de algemene risicoanalyse opgestelde algemene controleplan voorziet niet in de inzet
      van detailcontrole.

      4 Indien uit het uitgevoerde algemene controleplan blijkt dat het controledoel, bedoeld in [artikel 6b.2][ref2],
      is bereikt, kan slechts detailcontrole worden uitgevoerd als er van een ander dan het college afkomstige of uit de
      uitgevoerde controle voortvloeiende aanwijzingen zijn waaruit blijkt dat er sprake is van onvoldoende zekerheid.


      [ref1]: https://wetten.overheid.nl/BWBR0034925
      [ref2]: https://wetten.overheid.nl/BWBR0036007#Artikel6b.2
    url: https://wetten.overheid.nl/BWBR0036007/2025-01-01#Artikel6b.3
