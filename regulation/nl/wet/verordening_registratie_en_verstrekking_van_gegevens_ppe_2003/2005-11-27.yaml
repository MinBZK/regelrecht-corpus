preamble:
  text: |-
    gelet op de artikelen 5 en 6 en 8 van de lnstellingsverordening Productschap Pluimvee en Eieren 1998-I en de
    artikelen 93 en 104 van de Wet op de Bedrijfsorganisatie:

    op 12 juni 2003 vastgesteld de navolgende

    VERORDENING
  url: https://wetten.overheid.nl/BWBR0015220/2005-11-27#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van het bij of krachtens deze verordening bepaalde wordt verstaan onder:










                  a.


                  productschap


                  :


                  het Productschap Pluimvee en Eieren;




                  b.


                  voorzitter


                  :


                  de voorzitter van het productschap;




                  c.


                  bestuur


                  :


                  het bestuur van het productschap;




                  d.


                  onderneming


                  :


                  een onderneming waarin;
                  pluimvee-, edelpelsdieren- of konijnenhouderij wordt uitgeoefend;
      pluimvee, wild en tamme konijnen of daaruit verkregen producten worden be- of verwerkt tot producten welke, al dan
      niet na verdere be- of verwerking, tot menselijk voedsel kunnen dienen;
      eieren of daaruit verkregen producten worden be- en verwerkt tot producten welke, al dan niet na verdere be- en
      verwerking, tot menselijk voedsel kunnen dienen dan wel kunnen dienen als grondstof voor producten welke niet
      bestemd zijn tot menselijk voedsel;
      de handel wordt uitgeoefend in a. pluimvee, eieren, wild of tamme konijnen of in daaruit verkregen producten welke,
      al dan niet na verdere be- of verwerking, tot menselijk voedsel kunnen dienen;
      b. broedeieren en eendagskuikens;
      c. bont;
      d. technische eiproducten.




                  e.


                  ondernemer


                  :


                  een natuurlijke of rechtspersoon, die een onderneming drijft;




                  f.


                  Nederlandse grootte eenheid


                  :


                  een eenheid berekend op basis van het bruto standaard saldi zoals deze bij de laatste Staatscourant
      gepubliceerde Regeling Landbouwtelling ingevolge de [artikelen 24][ref1] en [25 van de Landbouwwet][ref2] wordt
      toegepast;




                  g.


                  groothandel in eieren en eiproducten en eiproducten industrie


                  :


                  onderneming waarin eieren of daaruit verkregen producten worden be- en verwerkt tot producten welke
      al dan niet na verdere be- en verwerking, tot menselijk voedsel kunnen dienen of een onderneming waarin de handel
      wordt uitgeoefend in eieren of in daaruit verkregen producten, die al dan niet na verdere be- en verwerking tot
      menselijk voedsel kunnen dienen;




                  h.


                  eieren


                  :


                  eieren van kippen, onderscheidenlijk eenden, onderscheidenlijk ganzen, onderscheidenlijk parelhoenders,
      onderscheidenlijk kalkoenen;




                  i.


                  eiproducten


                  :


                  de ondernemer, die ongesorteerde eieren ophaalt bij of koopt van een pluimveehouder of van een
      verzamelaar, teneide deze eieren, gesorteerd naar kwaliteit en gewicht, te leveren aan anderen dan consumenten;




                  j.


                  technische eiproducten


                  :


                  eiproducten die ongeschikt zijn voor de menselijke consumptie;




                  k.


                  verzamelaar


                  :


                  de ondernemer, die ongesorteerde eieren ophaalt bij of koopt van een pluimveehouder, teneinde deze
      eieren af te leveren of te verkopen aan de houder van een pakstation of de industrie;




                  l.


                  houder van een pakstation


                  :


                  de ondernemer, die ongesorteerde eieren koopt van een pluimveehouder of van een verzamelaar, teneinde
      deze eieren, gesorteerd naar kwaliteit en gewicht, te leveren aan anderen dan consumenten;




                  m.


                  grossier


                  :


                  de ondernemer, die naar kwaliteit en gewicht gesorteerde eieren koopt, teneinde deze eieren te leveren
      aan anderen dan consument;




                  n.


                  eiproductenfabrikant


                  :


                  de ondernemer, die uit meer dan 200.000 eieren per jaar eiproducten vervaardigt;




                  o.


                  eiproducten handelaar


                  :


                  de ondernemer die eiproducten verhandelt, teneinde deze in al dan niet bewerkte vorm af te leveren aan
      anderen dan consumenten.


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0002252#Artikel25
