  - number: '2'
    text: |-
      1 De ondernemer is verplicht zich bij vestiging van de onderneming binnen 4 weken ter registratie bij het
      productschap aan te melden aan de hand van een door het productschap verstrekt registratieformulier. Het
      registratieformulier wordt op aanvraag door het productschap verstrekt.

      2 Indien het een ondernemer betreft die een onderneming drijft, waarin de pluimvee-, edelpelsdieren - of
      konijnenhouderij wordt uitgeoefend, geldt de registratieplicht, als bedoeld in het vorige lid, indien de
      bedrijfsomvang ten minste gelijk is aan, ofwel is gaan voldoen aan de norm van drie Nederlandse grootte eenheden.
    url: https://wetten.overheid.nl/BWBR0015220/2005-11-27#Artikel2
  - number: '3'
    text: |-
      1 Het model van het in [artikel 2, lid 1][ref1], bedoelde registratieformulier wordt door het bestuur vastgesteld
      ter verkrijging van onder meer de volgende gegevens:

      a. handelsnaam, rechtsvorm, adres van de onderneming en haar eventuele filialen;

      b. datum van vestiging of overname van de onderneming;

      c. gegevens omtrent de aard van de onderneming.

      2 a. Indien het een ondernemer betreft die een onderneming drijft, waarin de groothandel in eieren en eiproducten
      en eiproductenindustrie wordt uitgeoefend, betreffen de te registreren gegevens naast de gegevens als bedoeld in
      het eerste lid, mede de categorie(ën) van handel, waartoe de onderneming behoort.

      b. De categorieën, waarin de onderneming als bedoeld in lid 2, sub a, wordt ingedeeld, zijn:

      1°. verzamelaar;

      2°. houder van een pakstation;

      3°. grossier;

      4°. (technische) eiproductenfabrikant;

      5°. (technische) eiproductenhandelaar;

      3 De ondernemer dient het in [artikel 2, lid 1][ref2], bedoelde registratieformulier volledig en naar waarheid
      ingevuld en ondertekend bij het productschap in te dienen.


      [ref1]: https://wetten.overheid.nl/BWBR0015220#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0015220#Artikel2
    url: https://wetten.overheid.nl/BWBR0015220/2005-11-27#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0015220
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0015220
        artikel: '2'
  - number: '4'
    text: |-
      De ondernemer dient bij de opheffing van zijn onderneming dan wel bij enige wijziging van de in
      [artikel 3, lid 1][ref1], bedoelde gegevens daarvan schriftelijk mededeling te doen aan het productschap binnen 4
      weken nadat het desbetreffende feit of de wijziging zich heeft voorgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0015220#Artikel3
    url: https://wetten.overheid.nl/BWBR0015220/2005-11-27#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0015220
        artikel: '3'
  - number: '5'
    text: |-
      1 Het productschap doet aan de ondernemer onverwijld een bevestiging toekomen van de ontvangst van de registratie.

      2 De mededeling bedoeld in [artikel 4][ref1] wordt onverwijld schriftelijk bevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0015220#Artikel4
    url: https://wetten.overheid.nl/BWBR0015220/2005-11-27#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0015220
        artikel: '4'
  - number: '6'
    text: |-
      De ondernemer is verplicht de door de voorzitter van het productschap krachtens deze verordening gevraagde gegevens
      volledig en naar waarheid, telkens, al dan niet op een daartoe bestemd formulier, voor een door het bestuur van het
      productschap te bepalen tijdstip aan de voorzitter te verstrekken.
    url: https://wetten.overheid.nl/BWBR0015220/2005-11-27#Artikel6
  - number: '7'
    text: |-
      1 De door de voorzitter te vragen gegevens worden door het bestuur aangewezen. Zij kunnen betrekking hebben op:

      a. de naam, voornamen, geboortedatum en adres van de ondernemer dan wel wanneer de onderneming door een
      rechtspersoon wordt gedreven: de naam en adres van de onderneming,

      b. de rechtsvorm van de onderneming;

      c. de dieren die in de desbetreffende onderneming wordt gehouden, alsmede de aantallen van iedere diersoort,
      onderscheiden naar type, leeftijd en andere daarbij te noemen kenmerken;

      d. het aantal personen dat, afgezien van de ondernemer, in de desbetreffende onderneming werkzaam is, onderscheiden
      naar de door hen vervulde functie, loonsom, leeftijd en geslacht, en hun rechtsbetrekking tot de ondernemer;

      e. de door de ondernemer of de sub d bedoelde personen genoten handelskennis en/of vakbekwaamheidsopleiding;

      f. de bedrijfsvoering en alle zaken met betrekking tot de in de onderneming verrichte arbeid en
      arbeidsomstandigheden;

      g. nationale of internationale verhandeling waarbij laatstgenoemde categorie te onderscheiden naar diersoorten
      en landen;

      h. de omzet, welke de onderneming in geld of anderszins uitgedrukt, eventueel gesplitst naar diverse functies, in
      een bepaalde periode heeft behaald;

      i. de door de onderneming gebruikte machines en andere technische hulpmiddelen, hoeveelheid en aard van het
      verpakkingsmateriaal, en oppervlakte van pakplaatsen, voor zover betrekking hebbende op de uitoefening van de
      handel in pluimvee, wild en tamme konijnen dan wel op de uitoefening van de eiergroothandel;

      j. aard en inrichting van de administratie van de onderneming:

      k. overige aangelegenheden van belang voor de vervulling van de taak van het productschap, alsmede wijziging in één
      of meer van deze gegevens.

      2 Het bestuur bepaalt op welke wijze de verstrekking van de gevraagde gegevens moet plaatsvinden.

      3 Indien wordt bepaald dat de verstrekking moet plaatsvinden op een daartoe bestemd formulier, dat door het
      bestuur wordt vastgesteld bij uitvoeringsbesluit, dan is de ondernemer gehouden het formulier te ondertekenen en
      te dateren.

      4 Het in lid 3 bedoelde formulier kan verschillend zijn voor verschillende groepen van ondernemers en naar gelang
      de aard van de gevraagde gegevens en het doel van de verstrekking van gegevens.
    url: https://wetten.overheid.nl/BWBR0015220/2005-11-27#Artikel7
  - number: '8'
    text: |-
      Ten aanzien van de ondernemer die een onderneming drijft, zijnde een pluimvee-, edelpelsdieren - of
      konijnenhouderij, kan het bestuur personen of instanties aanwijzen, aan wie eveneens een mededeling dan wel
      gegevens als bedoeld in [artikel 2, lid 2][ref1], [artikel 4][ref2] onderscheidenlijk [artikel 6][ref3] kan worden
      gedaan, respectievelijk kunnen worden verstrekt. Indien betrokkene aan zodanig aangewezen personen of instanties of
      meer bedoelde mededeling en gegevens naar waarheid heeft gedaan, respectievelijk heeft verstrekt, heeft hij voldaan
      aan de in [artikel 2, lid 2][ref4], [artikel 4][ref5] onderscheidenlijk [artikel 6][ref6], vermelde verplichting.


