                    ) € 372,00




                    Weipoeder in mageremelkpoeder


                    )




                    Minerale oliën


                    )
    url: https://wetten.overheid.nl/BWBR0022027/2007-05-27#Artikel4
  - number: '5'
    text: Het productschap kan verrekeningen van bedragen kleiner dan € 50 achterwege laten.
    url: https://wetten.overheid.nl/BWBR0022027/2007-05-27#Artikel5
  - number: '6'
    text: |-
      De retributies verschuldigd uïterlijk op de eenentwintigste dag volgend op die waarop zij door of vanwege het
      productschap in rekening is gebracht, dan wel, indien de secretaris zulks verlangt, voor een door deze te bepalen
      datum.
    url: https://wetten.overheid.nl/BWBR0022027/2007-05-27#Artikel6
  - number: '7'
    text: |-
      Aan de ondernemer die niet of niet geheel binnen de in [artikel 9][ref1] gestelde termijn heeft betaald, kan
      door het productschap de wettelijke interest over het niet betaalde bedrag in rekening worden gebracht, te
      berekenen vanaf de dag waarop de betaling uiterlijk diende te zijn verricht ingevolge de aanmaning bedoeld in
      [artikel 127, tweede lid, van de Wet op de bedrijfsorganisatie][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022027#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel127
    url: https://wetten.overheid.nl/BWBR0022027/2007-05-27#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0022027
        artikel: '9'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0002058
        artikel: '127'
  - number: '8'
    text: |-
      1 De gegevens verkregen uit hoofde van het bepaalde in deze verordening dienen in handen van de secretaris te
      worden gesteld of door deze aan te wijzen personen van het secretariaat van het (hoofd-)productschap.

      2 Deze gegevens mogen slechts worden gebezigd voor de vervuiling van de taak van het productschap en mogen niet
      onder vermelding of aanduiding van de onderneming, waarop zij betrekking hebben, aan het bestuur, het dagelijks
      bestuur, een commissie van het (hoofd)productschap of aan leden of plaatsvervangende leden daarvan worden
      overgelegd.
    url: https://wetten.overheid.nl/BWBR0022027/2007-05-27#Artikel8
  - number: '9'
    text: |-
      Deze verordening treedt in werking met ingang van 1 januari 2007. Indien het Verordeningenblad Bedrijfsorganisatie
      waarin deze verordening wordt geplaatst, wordt uitgegeven na 1 januari 2007, treedt zij in werking met ingang van
      de tweede dag na de dagtekening van dat Verordeningenblad Bedrijfsorganisatie en werkt terug tot en met 1 januari
      2007.
    url: https://wetten.overheid.nl/BWBR0022027/2007-05-27#Artikel9
  - number: '10'
    text: |-
      1 De [Verordening PDV retributies diervoeders jaar 2006][ref1] wordt ingetrokken.

      2 De in het eerste lid genoemde verordening biijft van kracht voor zover het betreft de op grond van die
      verordening verschuldigde, maar nog niet in rekening gebrachte dan wel betaalde bedragen.


