preamble:
  text: |-
    Gelet op de artikelen 95, 100 en 126, tweede lid, van de Wet op de bedrijfsorganisatie en op artikel 12 van het
    Instellingsbesluit Akkerbouwproductschappen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0022027/2007-05-27#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze verordening verstaat onder:

      productschap: Productschap Diervoeder

      secretaris: secretaris van het productschap;

      ondernemer: degene die een onderneming drijft waarvoor het productschap is ingesteld.
    url: https://wetten.overheid.nl/BWBR0022027/2007-05-27#Artikel1
  - number: '2'
    text: |-
      In het geval in een verordening van het bestuur wordt bepaald dat de ondernemer verplicht is aan het productschap
      een retributie te betalen voor, door of namens het productschap verrichte werkzaamheden is het bepaalde in of
      krachtens deze verordening van toepassing.
    url: https://wetten.overheid.nl/BWBR0022027/2007-05-27#Artikel2
  - number: '3'
    text: |-
      1 De ondernemer die het productschap verzoekt om afgifte van een free sale certificaat voor gemedicineerde voeders
      is hiervoor aan het productschap een retributie verschuldigd.

      2 De retributie bedraagt: € 17,50 per certificaat.
    url: https://wetten.overheid.nl/BWBR0022027/2007-05-27#Artikel3
  - number: '4'
    text: |-
      1 De deelnemende laboratoria zijn ten behoeve van de Kwaliteitsdienst Landbouwkundige Laboratoria aan het
      productschap jaarlijks een retributie verschuldigd,

      2 De retributie bedraagt

      Basistarief € 490,00

      Per analysepakket additioneel:

      Analysepakketten








                    Aflatoxine


                    )




                    Dierlijke mest


                    )




