  - number: '11'
    text: |-
      1 Het uitkeringsbedrag wordt overeenkomstig de vaststelling betaald, onder verrekening van de betaalde
      voorschotten.

      2 Het uitkeringsbedrag wordt binnen 4 weken na de vaststelling betaald.
    url: https://wetten.overheid.nl/BWBR0014812/2005-07-21#Artikel11
  - number: '12'
    text: |-
      De minister kan onverschuldigd betaalde uitkeringsbedragen en voorschotten terugvorderen voor zover na de betaling
      van de uitkering nog geen vijf jaren zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0014812/2005-07-21#Artikel12
  - number: '13'
    text: |-
      1 De ontvanger van een uitkering verleent op verzoek van de minister alle medewerking aan een door de minister
      ingesteld evaluatieonderzoek, bedoeld om te beoordelen in welke mate deze uitkering een toegevoegde waarde heeft
      geleverd aan de door de minister geformuleerde beleidsdoelstellingen.

      2 De opgedane kennis en ervaring met betrekking tot de uitvoering van het uitvoeringsplan, stelt de gemeente dan
      wel het waterschap om niet ter beschikking aan de minister voor gebruik ten algemenen nutte.
    url: https://wetten.overheid.nl/BWBR0014812/2005-07-21#Artikel13
  - number: '14'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst en vervalt met ingang van 1 januari 2007, met dien verstande dat zij van toepassing blijft op
      uitkeringen die voor die datum zijn verleend.
    url: https://wetten.overheid.nl/BWBR0014812/2005-07-21#Artikel14
  - number: '15'
    text: 'Deze regeling wordt aangehaald als: Regeling eenmalige uitkering baggerwerkzaamheden bebouwd gebied.'
    url: https://wetten.overheid.nl/BWBR0014812/2005-07-21#Artikel15
