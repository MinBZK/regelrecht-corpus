        artikel: 4:48
  - number: '8'
    text: |-
      1 Een wijziging van het uitvoeringsplan wordt bij de eerstvolgende voortgangsrapportage gemeld. Bij deze melding
      wordt aangegeven de aard van de wijziging, de reden van de wijziging en de gevolgen voor het uitvoeringsplan,
      inclusief het aantal te baggeren m

      2 De ontvanger van een uitkering handelt in overeenstemming met het uitvoeringsplan of het gemelde gewijzigde
      uitvoeringsplan.

      3 [Artikel 4:38 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel438
    url: https://wetten.overheid.nl/BWBR0014812/2005-07-21#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:38
  - number: '9'
    text: |-
      1 Bij de verlening wordt het bedrag aangegeven dat per kalenderjaar ten hoogste aan voorschotten kan worden
      verleend.

      2 De voorschotten worden halfjaarlijks verleend op basis van in te dienen declaraties, die zijn afgestemd op de
      gerealiseerde voortgang van het werk en die zijn onderbouwd met een voortgangsrapportage.

      3 De declaraties met de voortgangsrapportage worden na de toekenning van de aanvraag steeds voor 1 mei en voor 1
      november van enig jaar ingediend. Zes maanden na de looptijd van het uitvoeringsplan kunnen geen declaraties meer
      worden ingediend.

      4 De voorschotten worden betaald binnen acht weken na ontvangst van de declaratie.

      5 De voortgangsrapportage bevat in ieder geval:

      a. een overzicht van de over het afgelopen half jaar gerealiseerde werkzaamheden, in het bijzonder het aantal
      m3gebaggerde specie, de kwaliteitsklasse van deze specie en de bestemming ervan;

      b. een overzicht van alle voor het uitvoeringsplan gemaakte kosten, met een verbijzondering van de over het
      afgelopen half jaar gemaakte kosten;

      c. een geactualiseerde planning van de in het kader van het uitvoeringsplan nog te verrichten werkzaamheden, in het
      bijzonder in het eerstvolgende half jaar;

      d. een raming van alle voor het uitvoeringsplan nog te maken kosten, met een verbijzondering van de kosten voor het
      eerstvolgende half jaar; en

      e. een overzicht van de wijzigingen ten opzichte van het uitvoeringsplan.
    url: https://wetten.overheid.nl/BWBR0014812/2005-07-21#Artikel9
  - number: '10'
    text: |-
      1 De ontvanger van een uitkering dient binnen zes maanden na de looptijd van het uitvoeringsplan bij de minister
      een aanvraag in tot vaststelling van de uitkering.

      2 De aanvraag tot vaststelling van de uitkering gaat vergezeld van:

      a. een inhoudelijk verslag over de tijdens de looptijd van het uitvoeringsplan uitgevoerde werkzaamheden;

      b. een financieel eindverslag over de tijdens de looptijd van het uitvoeringsplan gemaakte kosten verbonden aan
      de werkzaamheden.

      3 Het financieel eindverslag, bedoeld in het tweede lid, onderdeel b, is voorzien van een accountantsverklaring,
      die is opgesteld overeenkomstig het in de bijlage bij deze regeling opgenomen controleprotocol.

      4 Indien de verleende uitkering minder bedraagt dan 100.000 euro, kan in afwijking van het derde lid worden
      volstaan met een financieel eindverslag.

      5 De [artikelen 4:46][ref1], [4:47][ref2] en [4:49 van de Algemene wet bestuursrecht][ref3] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel446
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel447
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel449
