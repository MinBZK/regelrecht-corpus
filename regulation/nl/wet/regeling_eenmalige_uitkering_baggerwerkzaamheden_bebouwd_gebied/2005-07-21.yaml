preamble:
  text: |-
    Gelet op artikel 17, vijfde lid, van de Financiële-verhoudingswet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0014812/2005-07-21#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *minister:* de Minister van Verkeer en Waterstaat;

      b. *waterschap:* het waterschap dat voor het boven het plangebied dan wel boven een gedeelte daarvan gelegen
      oppervlaktewater belast is met het waterkwaliteitsbeheer, waterkwantiteitsbeheer of het vaarwegbeheer;

      c. *gemeente:* de gemeente binnen wiens grondgebied het plangebied is gelegen;

      d. *plangebied:* de bodems, binnen het grondgebied van een gemeente, van de binnen de bebouwde kom gelegen
      oppervlaktewateren of van oppervlaktewateren waarvoor die gemeente is belast met het vaarwegbeheer;

      e. *baggerplan:* een plan voor het gehele plangebied dan wel voor het gedeelte daarvan dat binnen het gebied
      van het waterschap is gelegen, dat ziet op het uitbaggeren van tot het plangebied behorende bodems voor
      het onderhoud van de waterhuishoudings- en vaarwegfunctie en dat is opgesteld in overeenstemming met de
      [Tijdelijke regeling eenmalige subsidies baggerplannen bebouwd gebied][ref1], zoals dat gold onmiddellijk
      voorafgaand aan de inwerkingtreding van deze regeling;

      f. *uitvoeringsplan:* een plan ter uitvoering van één of meerdere baggerplannen;

      g. *baggerwerkzaamheden:* het uitbaggeren van de waterbodem;

      h. *baggerproject:* project zijnde een onderdeel van een uitvoeringsplan om baggerwerkzaamheden uit te voeren en de
      hieruit ontstane baggerspecie te transporteren en te bestemmen;

      i. *plangebonden depot:* depot dat wordt benut in het kader van het uitvoeringsplan;

      j. *uitvoeringsorganisatie:* door de minister aan te wijzen organisatie belast met de uitvoering van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011515
    url: https://wetten.overheid.nl/BWBR0014812/2005-07-21#Artikel1
