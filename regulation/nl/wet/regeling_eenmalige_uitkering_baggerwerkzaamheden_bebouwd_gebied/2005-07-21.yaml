        artikel: '5'
  - number: '6'
    text: |-
      1 De uitkering wordt niet verleend indien:

      a. uit het uitvoeringsplan niet blijkt dat de uitvoering van het plan zal worden gestart binnen één jaar na de
      datum van de aanvraag;

      b. uit de specificatie van de begrote kosten, bedoeld in [artikel 5, vijfde lid, onderdeel e][ref1], blijkt dat de
      aanleg, het beheer en de ontmanteling van een plangebonden depot in het totaal van de begrote kosten een aandeel
      heeft van meer dan 50%; en

      c. gegronde vrees bestaat dat betrokkenen het uitvoeringsplan niet kunnen financieren.

      2 Indien voor het uitvoeringsplan door het Rijk uit anderen hoofde of door de Europese Unie financiële bijdragen
      worden verleend, wordt de uitkering op grond van deze regeling zodanig verlaagd dat de uitkering niet meer bedraagt
      dan het ingevolge [artikel 4, eerste lid][ref2], bedoelde bedrag.

      3 Voor zover het uitvoeringsplan baggerwerkzaamheden bevat waarvan de uitvoering reeds in het jaar 2002 is gestart,
      wordt de uitkering bovendien slechts verleend, indien:

      a. de aanvraag uiterlijk 1 juli 2003 door de uitvoeringsorganisatie is ontvangen;

      b. de betrokken baggerwerkzaamheden op of na 1 oktober 2002 zijn opgedragen;

      c. de aanvrager kan aantonen dat in de begroting van de gemeente of het waterschap na 12 april 2002 extra gelden
      voor baggerwerkzaamheden zijn vrijgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0014812#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0014812#Artikel4
