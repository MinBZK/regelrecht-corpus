  - number: '7'
    text: |-
      1 Door de minister wordt op de aanvragen in volgorde van ontvangst beslist, met dien verstande dat wanneer de
      aanvrager krachtens [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad de aanvraag
      aan te vullen, de datum waarop de aanvraag is aangevuld geldt als datum van ontvangst.

      2 De minister beslist binnen 13 weken na ontvangst van de aanvraag.

      3 [Artikel 4:48 van de Algemene wet bestuursrecht][ref2] is van overeenkomstige toepassing.

      4 Verlening van de uitkering geschiedt onder het voorbehoud van goedkeuring door de Staten-Generaal van de in de
      begroting van het Infrastructuurfonds opgenomen bedragen voor de uitkering voor het desbetreffende jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel448
    url: https://wetten.overheid.nl/BWBR0014812/2005-07-21#Artikel7
