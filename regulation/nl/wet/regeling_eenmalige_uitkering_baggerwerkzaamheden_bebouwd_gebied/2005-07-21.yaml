  - number: '2'
    text: |-
      De minister kan ter stimulering van de uitvoering van baggerwerkzaamheden in het plangebied aan een gemeente
      dan wel een waterschap een eenmalige specifieke uitkering toekennen als tegemoetkoming in de kosten van een
      uitvoeringsplan.
    url: https://wetten.overheid.nl/BWBR0014812/2005-07-21#Artikel2
  - number: '3'
    text: Het totale bedrag van de op grond van deze regeling te verlenen uitkeringen bedraagt € 120 miljoen.
    url: https://wetten.overheid.nl/BWBR0014812/2005-07-21#Artikel3
  - number: '4'
    text: |-
      1 De uitkering bedraagt 33% van de kosten die rechtstreeks aan het uitvoeringsplan met een looptijd van maximaal 4
      jaar zijn toe te rekenen, doch niet meer dan 10 miljoen euro per aanvrager.

      2 Tot de kosten, bedoeld in het eerste lid, behoren de kosten van:

      a. de baggerwerkzaamheden;

      b. het vervoeren van de baggerspecie en het andere tezamen met baggerspecie uitgebaggerde materiaal;

      c. het bestemmen van de baggerspecie en het andere tezamen met baggerspecie uitgebaggerde materiaal;

      d. de kosten van de aanleg, het beheer en de ontmanteling van een plangebonden depot.

      3 Tot de kosten, bedoeld in het eerste lid, behoren niet:

      a. de kosten van voorbereiding ten behoeve van het uitvoeringsplan;

      b. de kosten die reeds op grond van een andere regeling voor een financiële bijdrage van het Rijk of de Europese
      Unie in aanmerking komen;

      c. de heffing die verschuldigd is op voet van
      [artikel 13, eerste lid, van de Wet belastingen op milieugrondslag][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel13
    url: https://wetten.overheid.nl/BWBR0014812/2005-07-21#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '13'
  - number: '5'
    text: |-
      1 De aanvraag voor een uitkering wordt door een gemeente of een waterschap ingediend bij de uitvoeringsorganisatie
      met behulp van het door de minister vastgestelde aanvraagformulier. Het aanvraagformulier is ondertekend door het
      bestuur van de gemeente of het waterschap.

      2 De aanvraag gaat vergezeld van:

      a. het baggerplan of de baggerplannen waarvan het uitvoeringsplan de uitwerking is;

      b. het uitvoeringsplan.

      3 Een aanvraag kan door een gemeente of waterschap mede namens een andere gemeente of een waterschap worden
      ingediend. In dat geval gaat de aanvraag tevens vergezeld van een verklaring waaruit blijkt dat de aanvrager de
      aanvraag mede namens de andere gemeente of het andere waterschap indient en treedt de aanvrager mede namens de
      andere gemeente of het andere waterschap op bij de verdere uitvoering van deze regeling.

      4 Indien geen subsidie is ontvangen op grond van de
      [Tijdelijke regeling eenmalige subsidies baggerplannen bebouwd gebied][ref1], bevat de aanvraag tevens een
      verklaring, als bedoeld in [artikel 5, vierde lid, onderdeel c, van die regeling][ref2].

      5 Per baggerproject uit het uitvoeringsplan wordt aangegeven:

      a. de projectnaam en de projectlocatie;

      b. de beoogde start- en einddatum;

      c. het beoogde aantal m3 waterbodem in situ dat wordt gebaggerd;

      d. de beoogde bestemming van de baggerspecie;

      e. een specificatie van de begrote kosten; en

      f. de financiële bijdragen voor het project die op grond van een andere regeling zijn aangevraagd of toegekend.

      6 Het uitvoeringsplan bevat één of meer kaarten met een schaal van 1:10.000, waarop zijn aangeven:

      a. de geplande baggerprojecten;

      b. de grens van de bebouwde kom;

      c. de functie van de wateren waar volgens de planning wordt gebaggerd;

      d. de beheerders van de vaarwegen waar wordt gebaggerd.

      7 Aanvragen kunnen worden ingediend tot uiterlijk 1 september 2006.


      [ref1]: https://wetten.overheid.nl/BWBR0011515
      [ref2]: https://wetten.overheid.nl/BWBR0011515#Artikel5
    url: https://wetten.overheid.nl/BWBR0014812/2005-07-21#Artikel5
