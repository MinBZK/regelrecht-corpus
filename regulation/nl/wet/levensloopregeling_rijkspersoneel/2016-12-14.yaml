  - number: 2.1.4
    text: |-
      1 De in [artikel 2.1.1][ref1] bedoelde aanvraag wordt elk kalenderjaar opnieuw ingediend en bevat de volgende
      gegevens:

      a. de levensloopinstelling;

      b. het nummer van de levenslooprekening, het polisnummer van de levensloopverzekering of het rekeningnummer van het
      levenslooprecht van deelneming;

      c. tot welke bedragen uit de in [artikel 2.1.3, onder a, b en c][ref2], genoemde bronnen wordt gespaard;

      d. hoeveel uren van de in [artikel 2.1.3, onder d en e][ref3], genoemde bronnen worden ingezet;

      e. of het levenslooptegoed eenmalig, dan wel maandelijks wordt gespaard;

      f. de begin- en einddatum van de spaarperiode indien is gekozen voor maandelijks sparen;

      g. een opgave van het levenslooptegoed op 1 januari van dat jaar;

      h. een verklaring van de ambtenaar waaruit blijkt:

        - dat hij bekend is met de inhoud van de Levensloopregeling rijkspersoneel;
        - of hij in een of meer inmiddels beëindigde dienstbetrekkingen een levenslooptegoed heeft opgebouwd en wat de
      omvang daarvan is op 1 januari van het kalenderjaar van de ondertekening van de verklaring;
        - of hij een verlofspaarrekening als bedoeld in
      [artikel 1.1, letter j, van de Verlofspaarregeling rijkspersoneel][ref4] heeft en wat het laatst bekende saldo van
      die rekening is;
        - of hij compensatie in vrije dagen heeft gespaard op grond van
      __REF001___________________________________________________________________________________________________________
      _____, kenmerk AD96/U1026, (Stcrt. 233) en wat de omvang daarvan is;
        - dat hij ermee instemt dat zijn gehele of gedeeltelijke levenslooptegoed aan het bevoegd gezag wordt uitgekeerd in
      situaties als bedoeld in [artikel 2.2.2, eerste en derde lid][ref6], of [artikel 5.2.1][ref7].

      2 Indien het een eerste aanvraag bij het bevoegd gezag betreft en in een of meer inmiddels beëindigde
      dienstbetrekkingen een levenslooptegoed is opgebouwd, gaat de aanvraag vergezeld van een verklaring van de
      levensloopinstellingen waar het tegoed is opgebouwd, waarin wordt aangegeven hoeveel jaren de ambtenaar heeft
      gespaard, in welke kalenderjaren en tot welke bedragen in die jaren aan levenslooptegoed is uitgekeerd en wat de
      omvang van het levenslooptegoed op 1 januari van het lopende kalenderjaar is.

      3 De aanvraag wordt twee maanden voor de gewenste ingangsdatum van de spaarperiode ingediend.

      4 De aanvraag geschiedt op een door de minister voor Wonen en Rijksdienst aangegeven wijze.

      5 De ambtenaar kan na het indienen van zijn in [artikel 2.1.1.][ref8] bedoelde aanvraag in de loop van het jaar
      verzoeken om de nog te sparen voorziening over te maken naar een andere levenslooprekening, een ander polisnummer
      van de levensloopverzekering of een ander rekeningnummer van het levenslooprecht van deelneming. Het verzoek wordt
      twee maanden voor de gewenste ingangsdatum ingediend.


