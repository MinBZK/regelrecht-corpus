  - number: 2.2.3
    text: |-
      Indien de ambtenaar bij het bereiken van de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], beschikt over een bedrag aan levenslooptegoed, komt
      dat tegoed tot uitkering, uiterlijk op de dag voorafgaand aan het ingaan van het ouderdomspensioen op grond van
      die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0018979/2016-12-14#Artikel2.2.3
