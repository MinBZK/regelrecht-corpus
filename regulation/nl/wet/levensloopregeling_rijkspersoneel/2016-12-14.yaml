  - number: 2.1.1
    text: |-
      1 Een ambtenaar kan eenmaal per jaar bij het bevoegd gezag een aanvraag indienen om op basis van een of meer
      bronnen als genoemd in [artikel 2.1.3][ref1] voor een voorziening te sparen als een levensloopverlofperiode of de
      financiering van ieder ander doel, mits op 1 januari van dat kalenderjaar het levenslooptegoed minder bedraagt dan
      2,1 maal het loon op jaarbasis dat is genoten in het voorafgaande kalenderjaar.

      2 Voor de toepassing van het eerste lid blijft een loonsverlaging buiten beschouwing, voor zover deze het gevolg
      is van het aanvaarden van een deeltijdfunctie dan wel het terugtreden naar een lager gekwalificeerde functie, in
      de periode die aanvangt 10 jaar direct voorafgaande aan de in de pensioenregeling vastgestelde ingangsdatum van het
      pensioen. De eerste volzin is bij een loonsverlaging die het gevolg is van het aanvaarden van een deeltijdfunctie
      uitsluitend van toepassing, voor zover de omvang van het dienstverband na het aanvaarden van de deeltijdfunctie
      niet lager is dan 50% van de omvang van het dienstverband aan het eind van de periode direct voorafgaande aan de
      aanvang van de in de eerste volzin bedoelde periode.


      [ref1]: https://wetten.overheid.nl/BWBR0018979#Artikel2.1.3
    url: https://wetten.overheid.nl/BWBR0018979/2016-12-14#Artikel2.1.1
    references:
