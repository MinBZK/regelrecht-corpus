  - number: 2.1.5
    text: |-
      1 Het bevoegd gezag kent de in [artikel 2.1.1 ][ref1]bedoelde aanvraag toe, tenzij het levenslooptegoed vermeerderd
      met:

      a. het levenslooptegoed uit een of meer inmiddels beëindigde dienstbetrekkingen;

      b. het saldo van de verlofspaarrekening als bedoeld in
      [artikel 1.1, letter j, van de Verlofspaarregeling rijkspersoneel][ref2];

      c. de waarde van de totale compensatie in vrije dagen die tot 1 januari 2006 is gespaard op grond van
      __REF000___________________________________________________________________________________________________________
      _____, kenmerk AD96/U1026, (Stcrt. 233);

      d. de waarde van het buitengewoon verlof als bedoeld in de [artikelen 3.4.1][ref4] en
      [6.1.1, vijfde lid, van de Verlofspaarregeling rijkspersoneel][ref5], indien het verlof op grond van die regeling
      of de compensatie in vrije dagen op grond van het onder c bedoelde besluit bij of na het bereiken van de 62-
      jarige leeftijd zal worden opgenomen, op 1 januari van het kalenderjaar waarin de voorziening in geld voor
      levensloopverlof zal worden gespaard gelijk is aan of meer bedraagt dan 2,1 maal het loon over het voorafgaande
      kalenderjaar.

      2 Voor de toepassing van het eerste lid blijft een salarisvermindering buiten beschouwing, voor zover deze
      het gevolg is van het aanvaarden van een deeltijdfunctie of een lager gekwalificeerde functie, in de periode
      die aanvangt 10 jaar direct voorafgaande aan de in het Pensioenreglement van de Stichting Pensioenfonds ABP
      vastgestelde ingangsdatum van het pensioen. De vorige volzin is bij een salarisvermindering die het gevolg is van
      het aanvaarden van een deeltijdfunctie uitsluitend van toepassing, voor zover de omvang van het dienstverband na
      het aanvaarden van de deeltijdfunctie niet lager is dan 50% van de omvang van het dienstverband aan het eind van de
      periode direct voorafgaande aan aanvang van de in de eerste volzin van dit lid bedoelde periode.

      3 De waarde van de compensatie in vrije dagen en de waarde van het buitengewoon verlof, bedoeld in het eerste lid,
      worden berekend op basis van het salaris per uur dat voor de ambtenaar geldt op 1 januari van het kalenderjaar
      waarin de voorziening in geld voor levensloopverlof zal worden gespaard.

      4 Het bevoegd gezag maakt het besluit op de aanvraag binnen zes weken na de datum waarop deze is ontvangen bekend
      aan de ambtenaar.


