preamble:
  text: |-
    Gelet op artikel 34g van het Algemeen Rijksambtenarenreglement en artikel 69a van het Ambtenarenreglement Staten-
    Generaal;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0018979/2016-12-14#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      1 In deze regeling wordt verstaan onder:

        - ambtenaar: degene die is aangesteld op grond van het [ARAR][ref1] of [ARSG][ref2] en die op grond van
      [artikel 39d van de Wet op de loonbelasting 1964][ref3] kan deelnemen aan de Levensloopregeling Rijkspersoneel;
        - ARAR: [Algemeen Rijksambtenarenreglement][ref4];
        - arbeidsduurfactor: een breuk, waarvan de teller bestaat uit de voor de ambtenaar vastgestelde arbeidsduur en de
      noemer bestaat uit het getal 36;
        - ARSG: [Ambtenarenreglement Staten-Generaal][ref5];
        - berekeningsgrondslag: het salaris, vermeerderd met de vakantie-uitkering en de eindejaarsuitkering over dat
      salaris;
        - bevoegd gezag: het tot aanstelling bevoegd gezag;
        - levensloopinstelling: een door de ambtenaar gekozen bank, verzekeraar of beheerder van een beleggingsinstelling
      waar het levenslooptegoed wordt opgebouwd;
        - levenslooprecht van deelneming: een of meer voor de ambtenaar geblokkeerde rechten van deelneming in een
      beleggingsinstelling waarmee een levenslooptegoed wordt opgebouwd;
        - levenslooprekening: een geblokkeerde rekening op naam van de ambtenaar bij een levensloopinstelling waarmee een
      levenslooptegoed wordt opgebouwd;
        - levenslooptegoed: de bij een of meer levensloopinstellingen opgebouwde voorziening in geld, vermeerderd met de
      daarop gekweekte inkomsten en de daarmee behaalde rendementen, die is bestemd voor een uitkering gedurende een
      levensloopverlofperiode of voor ieder ander doel;
        - levensloopverlof: verlof zonder behoud van bezoldiging, waarvoor een uitkering uit het levenslooptegoed wordt
      toegekend;
        - levensloopverlofperiode: de periode gedurende welke de ambtenaar levensloopverlof geniet;
        - levensloopverzekering: een verzekering op naam van de ambtenaar bij een levensloopinstelling waarmee een
      levenslooptegoed wordt opgebouwd;
        - loon: het loon als bedoeld in [artikel 10 van de Wet op de loonbelasting 1964][ref6];
        - spaarperiode: de periode gedurende welke de ambtenaar een voorziening in geld spaart ten behoeve van het opnemen
      van levensloopverlof of voor ieder ander doel;
        - vakantie: hetgeen daaronder wordt verstaan in het [ARAR][ref7] of[ ARSG][ref8].

      2 Voor de toepassing van deze regeling wordt onder bezoldiging, salaris, salaris per uur,
      vakantie-uitkering en eindejaarsuitkering verstaan, hetgeen daaronder wordt verstaan in het
      [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref9].


