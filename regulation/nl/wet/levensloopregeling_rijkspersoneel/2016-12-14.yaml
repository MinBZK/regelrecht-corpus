        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.1.2
    text: |-
      1 De per kalenderjaar te sparen voorziening in geld voor levensloopverlof bedraagt ten hoogste 12 procent van het
      loon over dat jaar.

      2 Het in het eerste lid bedoelde maximumpercentage geldt niet voor de ambtenaar die op 31 december 2005 de leeftijd
      van 51 jaar maar niet de leeftijd van 56 jaar heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0018979/2016-12-14#Artikel2.1.2
  - number: 2.1.3
    text: |-
      Ten behoeve van een levenslooptegoed kan de ambtenaar de volgende bronnen inzetten:

      a. salaris;

      b. vakantie-uitkering;

      c. eindejaarsuitkering;

      d. vergoeding voor meer gewerkte uren die op grond van
      [artikel 3, tweede lid, van de IKAP-regeling rijkspersoneel][ref1] is toegekend;

      e. de vergoeding voor vakantie-uren die op grond van [artikel 23b, derde lid, van het ARAR][ref2] is toegekend;

      f. de vergoeding voor vakantie-uren die op grond van [artikel 129a, tweede lid, van het ARAR][ref3] is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0015799#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel23b
      [ref3]: https://wetten.overheid.nl/BWBR0001950#Artikel129a
