        artikel: 7a
  - number: 2.3.1
    text: |-
      De spaarperiode wordt beëindigd uiterlijk met ingang van de tweede maand volgende op die waarin de ambtenaar dit
      aan het bevoegd gezag heeft verzocht.
    url: https://wetten.overheid.nl/BWBR0018979/2016-12-14#Artikel2.3.1
  - number: 3.1.1
    text: |-
      1 Zes maanden voor het begin van de levensloopverlofperiode dient de ambtenaar een aanvraag in bij het bevoegd
      gezag.

      2 In afwijking van het eerste lid kan het bevoegd gezag toestaan dat een kortere aanvraagtermijn in acht wordt
      genomen.

      3 De aanvraag om toekenning van levensloopverlof bevat de volgende gegevens:

      a. de datum waarop de levensloopverlofperiode ingaat;

      b. het aantal uren levensloopverlof dat wordt opgenomen;

      c. de verdeling van de uren levensloopverlof over de weken;

      d. het percentage van de berekeningsgrondslag dat als uitkering moet worden uitbetaald;

      e. een machtiging van de ambtenaar om een eenmalige of maandelijkse uitkering ter grootte van het in de aanvraag
      aangegeven bedrag ten laste van diens levenslooptegoed aan het bevoegd gezag te verstrekken op een door dat gezag
      aangegeven wijze.

      4 De aanvraag wordt gedaan op een door de minister voor Wonen en Rijksdienst aangegeven wijze.
    url: https://wetten.overheid.nl/BWBR0018979/2016-12-14#Artikel3.1.1
  - number: 3.1.2
    text: |-
      1 Het bevoegd gezag kent de in [artikel 3.1.1, eerste lid][ref1], bedoelde aanvraag toe, tenzij:

      a. deze te laat is ingediend;

      b. gewichtige redenen van dienstbelang zich tegen het levensloopverlof verzetten.

      2 Het bevoegd gezag maakt het besluit op de aanvraag binnen zes weken na de datum waarop deze is ontvangen bekend
      aan de ambtenaar en de levensloopinstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0018979#Artikel3.1.1
    url: https://wetten.overheid.nl/BWBR0018979/2016-12-14#Artikel3.1.2
    references:
      - id: ref1
        bwb_id: BWBR0018979
        artikel: 3.1.1
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.1.3
    text: |-
      1 Het levensloopverlof kan voor een deel van de voor de ambtenaar geldende arbeidsduur worden toegekend.

      2 Het levensloopverlof wordt in hele uren toegekend.

      3 Een levensloopverlofperiode bestaat uit minimaal 300 uur levensloopverlof, vermenigvuldigd met de van toepassing
      zijnde arbeidsduurfactor. De uitkomst wordt zo nodig afgerond naar boven op hele uren.

      4 Voor de toepassing van het derde lid geldt voor de personenchauffeur, bedoeld in
      [artikel 1, onderdeel b, van het Besluit personenchauffeurs Rijksdienst][ref1], de arbeidsduurfactor, bedoeld in
      artikel 1, onderdeel c, van dat besluit.

      5 Indien de ambtenaar een aanvraag indient om in afwijking van het bepaalde in het derde
      lid minder uren levensloopverlof te mogen opnemen wordt die aanvraag gehonoreerd, tenzij
      [artikel 3.1.2, eerste lid, onder b][ref2], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0010015#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018979#Artikel3.1.2
    url: https://wetten.overheid.nl/BWBR0018979/2016-12-14#Artikel3.1.3
    references:
      - id: ref1
        bwb_id: BWBR0010015
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0018979
        artikel: 3.1.2
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.1.4
    text: |-
      Indien de ambtenaar na toekenning van het levensloopverlof doch voor de datum waarop de levensloopverlofperiode
      ingaat ziek wordt, kan het bevoegd gezag de toekenning intrekken en het levensloopverlof geen doorgang laten
      vinden.
    url: https://wetten.overheid.nl/BWBR0018979/2016-12-14#Artikel3.1.4
  - number: 3.2.1
    text: |-
      1 Gedurende het levensloopverlof wordt door het bevoegd gezag aan de ambtenaar maandelijks een uitkering als
      bedoeld in [artikel 3.1.1, derde lid, onder d][ref1], verstrekt op basis van de berekeningsgrondslag over de maand
      direct voorafgaande aan de datum van ingang van het levensloopverlof. De uitkering is ten hoogste gelijk aan die
      berekeningsgrondslag.

      2 Indien het levensloopverlof voor een deel van de voor de ambtenaar geldende arbeidsduur wordt toegekend is
      de uitkering samen met het salaris en andere toegekende beloningen, toelagen en uitkeringen niet hoger dan de
      berekeningsgrondslag, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0018979#Artikel3.1.1
    url: https://wetten.overheid.nl/BWBR0018979/2016-12-14#Artikel3.2.1
    references:
      - id: ref1
        bwb_id: BWBR0018979
        artikel: 3.1.1
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.2.2
    text: |-
      1 Over de opgenomen uren levensloopverlof heeft geen opbouw van vakantie, vakantie-uitkering en eindejaarsuitkering
      plaats.

      2 Met uitzondering van de in [artikel 3.2.1, eerste lid][ref1], bedoelde uitkering bestaat over de opgenomen uren
      levensloopverlof geen aanspraak op doorbetaling van bezoldiging, toeslagen, toelagen, tegemoetkomingen, uitkeringen
      en vergoedingen.


      [ref1]: https://wetten.overheid.nl/BWBR0018979#Artikel3.2.1
    url: https://wetten.overheid.nl/BWBR0018979/2016-12-14#Artikel3.2.2
    references:
      - id: ref1
        bwb_id: BWBR0018979
        artikel: 3.2.1
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.3.1
    text: Tijdens het levensloopverlof wordt het werkgeversdeel van de pensioenpremies niet op de ambtenaar verhaald.
    url: https://wetten.overheid.nl/BWBR0018979/2016-12-14#Artikel3.3.1
  - number: 3.4.1
    text: |-
      Het levensloopverlof wordt opgeschort in geval van ziekte gedurende een aaneengesloten periode van vier weken of
      meer.
    url: https://wetten.overheid.nl/BWBR0018979/2016-12-14#Artikel3.4.1
  - number: 3.4.2
    text: Voor de duur van het zwangerschaps- en bevallingsverlof wordt het levensloopverlof opgeschort.
    url: https://wetten.overheid.nl/BWBR0018979/2016-12-14#Artikel3.4.2
  - number: 3.5.1
    text: |-
      Voor zover het levensloopverlof niet wordt opgenomen direct voorafgaande aan het pensioen keert de ambtenaar na
      afloop van het verlof terug in de functie die hij bij aanvang van dat verlof bekleedde.
    url: https://wetten.overheid.nl/BWBR0018979/2016-12-14#Artikel3.5.1
  - number: '4.1'
    text: |-
      1 De ambtenaar die zijn levenslooptegoed wil aanwenden voor het opbouwen van extra pensioen, dient daartoe een
      aanvraag in bij het bevoegd gezag.

      2 In de aanvraag vermeldt de ambtenaar welk deel van het levenslooptegoed hij wil laten omzetten in een aanspraak
      ingevolge artikel 16.6 van het Pensioenreglement van de Stichting Pensioenfonds ABP.

      3 De aanvraag bevat een machtiging van de ambtenaar om een uitkering ter grootte van het in de aanvraag aangegeven
      bedrag ten laste van diens levenslooptegoed aan het bevoegd gezag te verstrekken op een door dat gezag aangegeven
      wijze.

      4 Indien na de in het tweede lid bedoelde omzetting de aanspraak ingevolge artikel 16.6 van
      het Pensioenreglement van de Stichting Pensioenfonds ABP nog blijft binnen de in of krachtens
      [hoofdstuk IIB van de Wet op de loonbelasting 1964][ref1] gestelde grenzen, kent het bevoegd gezag de aanvraag toe
      binnen 30 dagen na de datum waarop deze is ontvangen en maakt het besluit op de aanvraag binnen 14 dagen bekend aan
      de ambtenaar en de levensloopinstelling.

      5 De aanvraag wordt gedaan op een door de minister voor Wonen en Rijksdienst aangegeven wijze.

      6 Na ontvangst van de uitkering, bedoeld in het derde lid, wordt deze door het bevoegd gezag overgemaakt aan de
      Stichting Pensioenfonds ABP.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#HoofdstukIIB
    url: https://wetten.overheid.nl/BWBR0018979/2016-12-14#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0002471
        hoofdstuk: IIB
  - number: 5.1.1
    text: |-
      1 In geval van ontslag blijft het levenslooptegoed bij de levensloopinstellingen staan, tenzij de ambtenaar door
      middel van een aanvraag aan het bevoegd gezag kenbaar maakt wat er met het levenslooptegoed moet gebeuren. In de
      aanvraag vermeldt de ambtenaar:

      a. het bedrag uit het levenslooptegoed waarover hij wenst te beschikken;

      b. het bedrag dat naar de nieuwe levensloopinstellingen moet worden overgemaakt indien hij het levenslooptegoed
      geheel of gedeeltelijk wil inbrengen in de levensloopregeling van de werkgever bij wie hij in dienst zal treden;

      c. indien van toepassing, de gegevens van de nieuwe levensloopinstellingen;

      d. indien van toepassing, de nummers van de nieuwe levenslooprekeningen, de polisnummers van de nieuwe
      levensloopverzekeringen of de rekeningnummers van het levenslooprecht van deelneming.

      2 Indien de ambtenaar geheel of gedeeltelijk over het levenslooptegoed wenst te beschikken, bevat de aanvraag een
      machtiging van de ambtenaar om een uitkering ter grootte van het in de aanvraag aangegeven bedrag ten laste van
      diens levenslooptegoed aan het bevoegd gezag te verstrekken op een door dat gezag aangegeven wijze.

      3 Het bevoegd gezag kent de aanvraag toe binnen 30 dagen na de datum waarop deze is ontvangen en maakt het besluit
      op de aanvraag binnen 14 dagen bekend aan de ambtenaar en de levensloopinstelling.

      4 Na ontvangst van de uitkering, bedoeld in het tweede lid, wordt deze na inhouding van loonheffing en de
      inkomensafhankelijke bijdrage zorgverzekeringswet door het bevoegd gezag uitgekeerd aan de ambtenaar.

      5 De levensloopinstelling maakt het in het eerste lid, onder b, bedoelde bedrag rechtstreeks over naar de nieuwe
      levensloopinstelling.

      6 De aanvraag wordt gedaan op een door de minister voor Wonen en Rijksdienst aangegeven wijze.
    url: https://wetten.overheid.nl/BWBR0018979/2016-12-14#Artikel5.1.1
  - number: 5.2.1
    text: |-
      In geval van overlijden van de ambtenaar wordt het voor uitkering beschikbare levenslooptegoed aan het bevoegd
      gezag uitgekeerd op een door dat gezag aangegeven wijze. Het levenslooptegoed wordt na inhouding van loonheffing
      en de inkomensafhankelijke bijdrage zorgverzekeringswet, na overlegging van een verklaring van erfrecht, door het
      bevoegd gezag uitgekeerd aan de erfgenamen van de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0018979/2016-12-14#Artikel5.2.1
  - number: 7.1.1
    text: |-
      1 Op de tot 1 januari 2006 opgebouwde aanspraken op compensatie in vrije dagen blijft het
      [besluit van de Minister van Binnenlandse Zaken van 25 november 1996][ref1], kenmerk AD96/U1026, (Stcrt. 233),
      zoals dat luidde op 31 december 2005, van toepassing, voor zover die aanspraken niet zijn omgezet in aanspraken
      ingevolge de Levensloopregeling rijkspersoneel.

      2 De waarde van de gespaarde compensatie in vrije dagen kan op verzoek van de ambtenaar worden toegevoegd aan het
      levenslooptegoed, tenzij het dienstbelang zich daartegen verzet.

      3 De waarde van de gespaarde compensatie in vrije dagen, bedoeld in het tweede lid, wordt berekend op basis van het
      salaris per uur dat de ambtenaar geniet op de eerste dag van de maand waarin het in het tweede lid bedoelde verzoek
      is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0008344
    url: https://wetten.overheid.nl/BWBR0018979/2016-12-14#Artikel7.1.1
    references:
      - id: ref1
        bwb_id: BWBR0008344
  - number: 7.2.1
    text: |-
      1 Op de tot 1 januari 2006 opgebouwde aanspraken op spaarverlof en compensatie in vrije dagen blijft de
      [Verlofspaarregeling rijkspersoneel][ref1], zoals die luidde op 31 december 2005, van toepassing, voor zover die
      aanspraken niet zijn omgezet in aanspraken ingevolge de Levensloopregeling rijkspersoneel.

      2 Het saldo van de verlofspaarrekening als bedoeld in
      [artikel 1.1, eerste lid, letter j, van de Verlofspaarregeling rijkspersoneel][ref2] kan op verzoek van de
      ambtenaar worden toegevoegd aan het levenslooptegoed.


      [ref1]: https://wetten.overheid.nl/BWBR0014771
      [ref2]: https://wetten.overheid.nl/BWBR0014771#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0018979/2016-12-14#Artikel7.2.1
    references:
      - id: ref1
        bwb_id: BWBR0014771
      - id: ref2
        bwb_id: BWBR0014771
        artikel: '1.1'
  - number: '8.1'
    text: Deze regeling treedt in werking met ingang van 1 januari 2006.
    url: https://wetten.overheid.nl/BWBR0018979/2016-12-14#Artikel8.1
  - number: '8.2'
    text: 'Deze regeling wordt aangehaald als: Levensloopregeling rijkspersoneel.'
    url: https://wetten.overheid.nl/BWBR0018979/2016-12-14#Artikel8.2
