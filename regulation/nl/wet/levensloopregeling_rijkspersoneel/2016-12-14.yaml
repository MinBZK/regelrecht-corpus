  - number: 2.1.6
    text: |-
      Het levenslooptegoed wordt door het bevoegd gezag gestort op één van de levenslooprekeningen, dan wel overgemaakt
      als premie voor één van de levensloopverzekeringen of gestort op één van de rekeningnummers van het levenslooprecht
      van deelneming, zo mogelijk in de maand waarin de door de ambtenaar aangewezen bronnen aan hem zouden zijn
      uitbetaald.
    url: https://wetten.overheid.nl/BWBR0018979/2016-12-14#Artikel2.1.6
  - number: 2.1.7
    text: |-
      1 Het is de ambtenaar toegestaan om het levenslooptegoed dat is opgebouwd in een of meer inmiddels beëindigde
      dienstbetrekkingen geheel of gedeeltelijk over te boeken naar een op grond van deze regeling geopende
      levenslooprekeningen, afgesloten levensloopverzekeringen of rekeningnummers van levenslooprecht van deelneming.

      2 De ambtenaar kan het levenslooptegoed overboeken naar een of meer op grond van deze regeling geopende
      levenslooprekeningen, afgesloten levensloopverzekeringen of geopende rekeningen van levenslooprechten van
      deelneming bij verschillende levensloopinstellingen.
    url: https://wetten.overheid.nl/BWBR0018979/2016-12-14#Artikel2.1.7
  - number: 2.2.1
    text: |-
      1 Over het levenslooptegoed kan worden beschikt voor een levensloopverlofperiode of voor de financiering van ieder
      ander doel.

      2 Het levenslooptegoed wordt op geen enkele wijze afgekocht, vervreemd, prijsgegeven
      dan wel formeel of feitelijk als voorwerp van zekerheid anders dan ten behoeve van de in
      [artikel 5.11 van de Uitvoeringsregeling loonbelasting 2011][ref1] bedoelde verpanding aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0028236#Artikel5.11
    url: https://wetten.overheid.nl/BWBR0018979/2016-12-14#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0028236
        artikel: '5.11'
  - number: 2.2.2
    text: |-
      1 Indien het levenslooptegoed dat gedurende een kalenderjaar is gespaard meer bedraagt dan het in
      [artikel 2.1.2][ref1]. genoemde percentage, wordt het bovenmatige gedeelte voor het einde van het kalenderjaar aan
      de ambtenaar als loon uitgekeerd.

      2 Voor zover de aanspraak, bedoeld in [artikel 2.1.3, onder c en d][ref2], die door de ambtenaar als bron is
      ingezet, niet is opgebouwd, wordt het teveel gestorte bedrag van het levenslooptegoed afgeboekt en door de
      levensloopinstelling aan het bevoegd gezag uitgekeerd op een door dat gezag aangegeven wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0018979#Artikel2.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0018979#Artikel2.1.3
