$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.2/schema.json
$id: tijdelijke_regeling_ter_wering_van_aviaire_influenza
regulatory_layer: WET
publication_date: '2005-09-27'
valid_from: '2005-08-21'
bwb_id: BWBR0018677
url: https://wetten.overheid.nl/BWBR0018677/2005-08-21
preamble:
  text: |-
    Gelet op artikel 17, eerste lid, van de Gezondheids- en welzijnswet voor dieren;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0018677/2005-08-21#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt onder pluimvee verstaan: gehouden dieren van een soort behorende tot de orde van de
      hoenderachtigen (Galliformes), tot de familie van de eenden, ganzen en zwanen (Anatidae), en voor consumptie
      gehouden duiven (Columbia livia).
    url: https://wetten.overheid.nl/BWBR0018677/2005-08-21#Artikel1
  - number: '2'
    text: |-
      Deze regeling is niet van toepassing op het houden van:

      a. fazanten;

      b. niet-bedrijfsmatig gehouden pluimvee;

      c. pluimvee, gehouden in dierentuinen als bedoeld in het [Dierentuinenbesluit][ref1];

      d. siervogels.


      [ref1]: https://wetten.overheid.nl/BWBR0013625
    url: https://wetten.overheid.nl/BWBR0018677/2005-08-21#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0013625
  - number: '3'
    text: |-
      1 Het is verboden pluimvee te houden.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing indien wordt voldaan aan deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0018677/2005-08-21#Artikel3
  - number: '4'
    text: |-
      De houder van pluimvee neemt met betrekking tot het pluimvee één van de volgende maatregelen:

      a. ophokken;

      b. het pluimvee houden in een ruimte die zodanig is afgeschermd dat wordt voorkomen dat andere vogels of hun
      uitwerpselen in deze ruimte kunnen binnenkomen.
    url: https://wetten.overheid.nl/BWBR0018677/2005-08-21#Artikel4
  - number: '5'
    text: |-
      De houder van pluimvee draagt er zorg voor dat deze dieren de ruimte waarin zij, ter uitvoering van
      [artikel 4][ref1], worden gehouden niet verlaten.


      [ref1]: https://wetten.overheid.nl/BWBR0018677#Artikel4
    url: https://wetten.overheid.nl/BWBR0018677/2005-08-21#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0018677
        artikel: '4'
        paragraaf: '2'
  - number: '6'
    text: |-
      De houder van pluimvee draagt er zorg voor dat deze dieren bij het verplaatsen niet in contact komen met andere
      vogels of hun uitwerpselen.
    url: https://wetten.overheid.nl/BWBR0018677/2005-08-21#Artikel6
  - number: '7'
    text: 'Deze regeling wordt aangehaald als: Tijdelijke regeling ter wering van Aviaire Influenza.'
    url: https://wetten.overheid.nl/BWBR0018677/2005-08-21#Artikel7
  - number: '8'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0018677/2005-08-21#Artikel8
