  - number: '17'
    text: |-
      1 Voor zover blijkt dat een belanghebbende ten gevolge van een onherroepelijk wegaanpassingsbesluit, een
      onherroepelijk besluit ter uitvoering van een wegaanpassingsbesluit als bedoeld in [artikel 7, eerste lid][ref1],
      of een onherroepelijk plan als bedoeld in [artikel 6, vijfde lid][ref2], schade lijdt of zal lijden, die
      redelijkerwijs niet of niet geheel te zijnen laste behoort te blijven, en ten aanzien waarvan de vergoeding niet
      of niet voldoende door aankoop, onteigening of op andere wijze is verzekerd, kent Onze Minister hem op zijn verzoek
      een naar billijkheid te bepalen schadevergoeding toe.

      2 [Afdeling 6.1 van de Wet ruimtelijke ordening][ref3] blijft buiten toepassing voor zover de belanghebbende met
      betrekking tot de schade een beroep doet of kan doen op een schadevergoeding als bedoeld in het eerste lid.

      3 Onze Minister kan nadere regels geven omtrent de indiening en afhandeling van een verzoek om schadevergoeding.


