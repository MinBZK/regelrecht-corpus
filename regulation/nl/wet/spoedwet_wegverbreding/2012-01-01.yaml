  - number: '5'
    text: |-
      1 Voor de toepassing van deze wet zijn ten aanzien van de in de bijlage, onder A, opgenomen wegaanpassingsprojecten
      afdeling [2A van hoofdstuk VI][ref1] en [artikel 111a van de Wet geluidhinder][ref2] van overeenkomstige
      toepassing.

      2 Ten aanzien van de in het eerste lid bedoelde wegaanpassingsprojecten bevat het wegaanpassingsbesluit:

      a. de beslissing tot het vaststellen van een hogere waarde voor de ten hoogste toelaatbare geluidsbelasting in
      zones ingevolge de [artikelen 87e tot en met 87i van de Wet geluidhinder][ref3] met betrekking tot het gebied dat
      is begrepen in een wegaanpassingsbesluit;

      b. de aanduiding van de te treffen maatregelen, gericht op het terugbrengen van de geluidsbelasting van de gevel
      van de woningen of andere geluidsgevoelige gebouwen onderscheidenlijk aan de grens van geluidsgevoelige terreinen
      als bedoeld in de [Wet geluidhinder][ref4].

      3 Onze Minister zendt het ontwerp-wegaanpassingsbesluit, indien het hogere waarden bevat voor de ten hoogste
      toelaatbare geluidsbelasting in zones ingevolge de [artikelen 87e tot en met 87i van de Wet geluidhinder][ref5],
      voordat het ter inzage wordt gelegd aan:

      a. de gebruikers van de woningen of de woonwagenstandplaatsen, het bevoegd gezag van scholen en de directies van
      ziekenhuizen, verpleeghuizen en andere gezondheidszorggebouwen waarvoor een hogere waarde wordt bepaald;

      b. de ter plaatse bevoegde inspecteur, die door Onze Minister is aangewezen;

      c. Onze Minister van Onderwijs, Cultuur en Wetenschappen, indien het betrekking heeft op scholen.


