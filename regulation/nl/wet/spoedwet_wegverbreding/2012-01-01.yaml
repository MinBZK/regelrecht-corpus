  - number: '11'
    text: |-
      1 Voor het gebied dat is begrepen in een vastgesteld wegaanpassingsbesluit geldt dat besluit als
      voorbereidingsbesluit als bedoeld in [artikel 3.7 van de Wet ruimtelijke ordening][ref1].

      2 Ten aanzien van de in de bijlage, onder A, opgenomen wegaanpassingsprojecten geldt voor de bij het
      wegaanpassingsbesluit behorende zone, bedoeld in [artikel 74, eerste lid, van de Wet geluidhinder][ref2], het
      wegaanpassingsbesluit als voorbereidingsbesluit als bedoeld in [artikel 3.7 van de Wet ruimtelijke ordening][ref3],
      met dien verstande dat dit slechts geldt met betrekking tot geprojecteerde woningen en andere geluidsgevoelige
      objecten ten aanzien waarvan de geluidsbelasting vanwege de weg of vanwege binnen de zone van die weg gelegen
      wegen de waarden die ingevolge de [artikelen 87e tot en met 87i van de Wet geluidhinder][ref4] als ten hoogste
      toelaatbare waarden worden aangemerkt, te boven zal gaan.

      3 Voor zover het wegaanpassingsbesluit geldt als voorbereidingsbesluit, is
      [artikel 3.7, vijfde en zesde lid, van de Wet ruimtelijke ordening][ref5] niet van toepassing.

      4 Het wegaanpassingsbesluit geldt niet langer als voorbereidingsbesluit indien voor het in het eerste lid bedoelde
      gebied een bestemmingsplan in overeenstemming met het wegaanpassingsbesluit van kracht is geworden.

      5 Onder een geprojecteerde woning of een ander geprojecteerd geluidsgevoelig object als bedoeld in het
      tweede lid wordt verstaan een nog niet aanwezige woning of ander geluidsgevoelig object waarvoor het
      geldende bestemmingsplan verlening van de omgevingsvergunning voor een bouwactiviteit als bedoeld in
      [artikel 2.1, eerste lid, onder a, van de Wet algemene bepalingen omgevingsrecht][ref6] toelaat, maar deze nog niet
      is afgegeven.

      6 [Artikel 3.3, eerste tot en met derde lid, van de Wet algemene bepalingen omgevingsrecht][ref7] is
      niet van toepassing op aanvragen om een omgevingsvergunning voor een bouwactiviteit als bedoeld in
      [artikel 2.1, eerste lid, onder a, van die wet][ref8] ter uitvoering van het wegaanpassingsbesluit.

      7 Indien ter uitvoering van het wegaanpassingsbesluit handelingen worden verricht waarvoor krachtens
      [artikel 15 van de Wegenverkeerswet 1994][ref9] een verkeersbesluit is vereist, is dat artikel niet van toepassing.

      8 Voor zover het wegaanpassingsbesluit en het bestemmingsplan of de beheersverordening
      niet met elkaar in overeenstemming zijn, geldt het besluit voor de uitvoering daarvan als
      omgevingsvergunning waarbij ten behoeve van een project van nationaal belang, met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref10], van het
      bestemmingsplan of de beheersverordening wordt afgeweken. Bij de toepassing van [artikel 2.10 van die wet][ref11]
      wordt onder bestemmingsplan of beheersverordening mede het wegaanpassingsbesluit begrepen.

      9 Voor zover een bestemmingsplan, een beheersverordening of een ander besluit voor de uitvoering
      van werken of werkzaamheden een omgevingsvergunning voor een aanlegactiviteit als bedoeld in
      [artikel 2.1, eerste lid, onder b, van de Wet algemene bepalingen omgevingsrecht][ref12] vereist, geldt zodanige
      eis niet in het gebied dat is begrepen in een vastgesteld wegaanpassingsbesluit.

      10 De gemeenteraad stelt binnen een jaar nadat het wegaanpassingsbesluit onherroepelijk is geworden een
      bestemmingsplan of een beheersverordening als bedoeld in de [Wet ruimtelijke ordening][ref13] overeenkomstig
      het wegaanpassingsbesluit vast. Voor zover een ontwerp van een bestemmingsplan zijn grondslag vindt in het
      wegaanpassingsbesluit kunnen zienswijzen geen betrekking hebben op dat deel van het ontwerpplan.

      11 Indien een bestemmingsplan in strijd is met een onherroepelijk wegaanpassingsbesluit en het bestemmingsplan nog
      niet is aangepast aan het wegaanpassingsbesluit, is het gemeentebestuur verplicht aan degenen die inzage verlangen
      in zodanig bestemmingsplan, tevens inzage te verlenen in het ten aanzien van het door dat plan bestreken gebied
      vastgestelde wegaanpassingsbesluit.


