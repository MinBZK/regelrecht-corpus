    text: |-
      Het wegaanpassingsbesluit vervalt van rechtswege indien het niet binnen twee jaar na het tijdstip waarop het
      onherroepelijk is geworden in uitvoering is genomen.
    url: https://wetten.overheid.nl/BWBR0015158/2012-01-01#Artikel12
  - number: '13'
    text: |-
      1 Tegen een wegaanpassingsbesluit, een besluit ter uitvoering van een wegaanpassingsbesluit als bedoeld
      in [artikel 7, eerste lid][ref1], alsmede een plan als bedoeld in [artikel 6, vijfde lid][ref2], kan een
      belanghebbende beroep instellen bij de Afdeling bestuursrechtspraak van de Raad van State.

      2 In afwijking van [artikel 6:8 van de Algemene wet bestuursrecht][ref3] vangt de termijn voor het
      indienen van een beroepschrift tegen een wegaanpassingsbesluit en de besluiten ter uitvoering van een
      wegaanpassingsbesluit als bedoeld in [artikel 7, eerste lid][ref4], aan met ingang van de dag na die waarop de in
      [artikel 10, zevende lid][ref5], bedoelde bekendmaking is geschied.


