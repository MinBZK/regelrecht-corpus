  - number: '10'
    text: |-
      1 De betrokken bestuursorganen nemen de besluiten ter uitvoering van het wegaanpassingsbesluit binnen zes weken na
      bekendmaking van het wegaanpassingsbesluit en zenden deze besluiten onmiddellijk toe aan Onze Minister.

      2 De in het eerste lid bedoelde termijn treedt in de plaats van de bij of krachtens enig ander wettelijk
      voorschrift voor die besluiten bepaalde beslistermijnen.

      3 Indien een bestuursorgaan van een provincie, een gemeente of een waterschap of een ander openbaar lichaam, dat
      in eerste aanleg bevoegd is te beslissen op een aanvraag als bedoeld in [artikel 7, tweede lid][ref1], niet of
      niet tijdig een ontwerp-besluit op de aanvraag aan Onze Minister zendt, dan wel niet of niet tijdig op de aanvraag
      beslist, dan wel een beslissing neemt die naar het oordeel van Onze Minister wijziging behoeft, kan Onze Minister
      een beslissing op de aanvraag nemen. In het laatste geval treedt zijn besluit in de plaats van het besluit van het
      in eerste aanleg bevoegde bestuursorgaan. Indien Onze Minister voornemens is zelf een beslissing op de aanvraag te
      nemen, pleegt hij overleg met het bestuursorgaan dat in eerste aanleg bevoegd is op de aanvraag te beslissen.

      4 Het eerste tot en met derde lid is van overeenkomstige toepassing op de ambtshalve te nemen besluiten.

      5 Het derde lid is van overeenkomstige toepassing ten aanzien van andere besluiten dan die ter uitvoering van het
      wegaanpassingsbesluit, welke zijn gericht op de realisering van het desbetreffende wegaanpassingsproject.

      6 Indien bij de toepassing van het derde lid de beslissing op een aanvraag wordt genomen door Onze Minister, stort
      het bestuursorgaan dat in eerste aanleg bevoegd is te beslissen op de aanvraag, de ter zake ontvangen leges in 's
      Rijks kas.

      7 De in [artikel 7, tweede lid][ref2], bedoelde besluiten worden gelijktijdig door Onze Minister bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0015158#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0015158#Artikel7
