  - number: '6'
    text: |-
      1 Voor de toepassing van dit artikel wordt verstaan onder akoestische gegevens: de berekening van de 70 dB(A)
      geluidcontour langs de wegvakken, gebaseerd op de verkeersgegevens over het jaar 2000.

      2 Ten aanzien van de in de bijlage, onder B, opgenomen wegaanpassingsprojecten is de [Wet geluidhinder][ref1] niet
      van toepassing.

      3 Ten aanzien van de in het tweede lid bedoelde wegaanpassingsprojecten bevat het wegaanpassingsbesluit de
      akoestische gegevens, alsmede de maatregel, voor zover deze voortvloeit uit het vierde lid.

      4 Indien uit de akoestische gegevens blijkt dat sprake is van een overschrijding van 70 dB(A) bij geluidsgevoelige
      bestemmingen, wordt in het wegaanpassingsbesluit een geluidreducerende wegdeklaag voorgeschreven, tenzij dit
      redelijkerwijs niet kan worden gevergd.

      5 Uiterlijk twee jaar na het onherroepelijk worden van het wegaanpassingsbesluit stelt Onze Minister ten
      aanzien van de in het tweede lid bedoelde wegaanpassingsprojecten een plan op voor de te treffen maatregelen,
      gericht op het terugbrengen van de geluidsbelasting vanwege de weg, van de gevel van de woningen of andere
      geluidsgevoelige gebouwen of aan de grens van geluidsgevoelige terreinen binnen de zone van de weg overeenkomstig
      [artikel 74, eerste lid, van de Wet geluidhinder][ref2]. [Artikel 4, vierde lid][ref3], met uitzondering van het
      bepaalde onder [b en c][ref4], is van overeenkomstige toepassing op het plan.

      6 Het plan bevat voorts de vaststelling van de geluidsbelasting van de gevel van de woningen, andere
      geluidsgevoelige gebouwen en aan de grens van geluidsgevoelige terreinen binnen de zone van de weg overeenkomstig
      [artikel 74, eerste lid, van de Wet geluidhinder][ref5], zoals deze wordt berekend na het treffen van de
      maatregelen overeenkomstig het plan.

      7 Het plan bepaalt de termijn waarbinnen de in het vijfde lid bedoelde maatregelen in uitvoering worden genomen.

      8 Voor de toepassing van de artikelen [87f, tweede of derde lid][ref6],
      [87g, tweede lid][ref7], [100, tweede of derde lid][ref8], [106g, tweede of derde lid][ref9], en
      [106h, tweede lid, van de Wet geluidhinder][ref10] geldt een krachtens het zesde lid vastgestelde geluidsbelasting
      als een krachtens [die wet][ref11] vastgestelde hogere waarde voor de ten hoogste toelaatbare geluidsbelasting.

      9 [Artikel 111a van de Wet geluidhinder][ref12] is van overeenkomstige toepassing op de vaststelling van de
      geluidsbelasting van het zesde lid.

      10 Voor zover het plan en het bestemmingsplan of de beheersverordening niet met elkaar in
      overeenstemming zijn, geldt het plan voor de uitvoering daarvan als omgevingsvergunning
      waarbij ten behoeve van een project van nationaal belang, met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref13], van het
      bestemmingsplan of de beheersverordening wordt afgeweken. Bij de toepassing van [artikel 2.10 van die wet][ref14]
      wordt onder bestemmingsplan of beheersverordening mede het plan begrepen.

      11 Ten aanzien van het plan is [artikel 11, tiende en elfde lid][ref15], van overeenkomstige toepassing.

      12 Op de voorbereiding van het plan is [afdeling 3.4 van de Algemene wet bestuursrecht][ref16] van toepassing.


