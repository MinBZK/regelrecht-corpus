    text: |-
      1 Onteigening van onroerende zaken en van rechten als bedoeld in
      [artikel 4, eerste lid, van de onteigeningswet][ref1] ten behoeve van de uitvoering van het wegaanpassingsbesluit
      geschiedt ingevolge het besluit, bedoeld in [artikel 72a van de onteigeningswet][ref2], met dien verstande dat over
      het in artikel 72a van de onteigeningswet bedoelde besluit de Raad van State niet wordt gehoord.

      2 De in [artikel 18, eerste lid, van de onteigeningswet][ref3] bedoelde dagvaarding kan geschieden nadat het
      wegaanpassingsbesluit is vastgesteld.

      3 Onverminderd het bepaalde in [artikel 59, eerste lid, van de onteigeningswet][ref4] kan het vonnis
      van onteigening van de rechtbank niet eerder in de openbare registers worden ingeschreven dan nadat het
      wegaanpassingsbesluit onherroepelijk is geworden.

      4 In aanvulling op de [artikelen 54n][ref5] en [59 van de onteigeningswet][ref6] is ten behoeve van de in het
      derde lid bedoelde inschrijving een uitspraak van de Afdeling bestuursrechtspraak van de Raad van State dan
      wel een verklaring van de Secretaris van de Raad van State nodig, waaruit blijkt dat het wegaanpassingsbesluit
      onherroepelijk is geworden.


