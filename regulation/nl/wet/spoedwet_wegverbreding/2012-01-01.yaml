  - number: '9'
    text: |-
      1 Onze Minister stelt het wegaanpassingsbesluit vast binnen tien weken nadat de termijn voor het naar
      voren brengen van zienswijzen is verstreken. Indien krachtens het vierde lid toepassing wordt gegeven aan
      [artikel 19j van de Natuurbeschermingswet 1998][ref1] of toepassing wordt gegeven aan het vijfde lid wordt
      het wegaanpassingsbesluit vastgesteld mede in overeenstemming met Onze Minister van Landbouw, Natuur en
      Voedselkwaliteit. Indien niet binnen drie weken na het daartoe strekkende verzoek van Onze Minister overeenstemming
      is bereikt tussen Onze Minister en Onze Minister van Landbouw, Natuur en Voedselkwaliteit legt Onze Minister dit
      voor aan Onze Minister-President, Minister van Algemene Zaken.

      2 Indien het wegaanpassingsbesluit niet binnen de in het eerste lid bedoelde termijn wordt vastgesteld, deelt Onze
      Minister dit voor het verstrijken daarvan onder vermelding van de reden mee aan de Staten-Generaal.

      3 De betrokken bestuursorganen zenden binnen de in het eerste lid bedoelde termijn ontwerpen van de besluiten ter
      uitvoering van het wegaanpassingsbesluit aan Onze Minister.

      4 De [artikelen 19d][ref2] en [19kc van de Natuurbeschermingswet 1998][ref3] zijn niet van toepassing op
      handelingen waarop het wegaanpassingsbesluit betrekking heeft.

      Indien die handelingen de kwaliteit van de natuurlijke habitats en de habitats van soorten in een Natura 2000-
      gebied als bedoeld in [die wet][ref4] kunnen verslechteren of een significant verstorend effect kunnen hebben op
      de soorten waarvoor het gebied is aangewezen, gelet op de instandhoudingsdoelstelling voor dat gebied, zijn de
      [artikelen 19j, eerste tot en met derde lid en vijfde lid][ref5], en [19kd van die wet][ref6], en het krachtens
      [artikel 19kb, eerste lid, van die wet][ref7] bepaalde, van overeenkomstige toepassing op het vaststellen van een
      wegaanpassingsbesluit.

      5 [Artikel 16, eerste lid, van de Natuurbeschermingswet 1998][ref8] is niet van toepassing op handelingen waarop
      het wegaanpassingsbesluit betrekking heeft. Indien die handelingen plaatsvinden in een beschermd natuurmonument
      als bedoeld in artikel 16, eerste lid, van die wet, of daarbuiten in de gevallen, bedoeld in het vierde lid van
      dat artikel, en de handelingen schadelijk kunnen zijn voor de waarden, bedoeld in het eerste lid van dat artikel,
      betrekt Onze Minister bij de besluitvorming over stelt het wegaanpassingsbesluit het belang van bescherming van de
      waarden van het beschermde natuurmonument.

      6 [Artikel 19j van de Natuurbeschermingswet 1998][ref9] is niet van toepassing op de vaststelling van het
      wegaanpassingsbesluit indien de handelingen waarop het wegaanpassingsbesluit betrekking heeft, zijn opgenomen in
      een beheerplan als bedoeld in [artikel 19a][ref10] of [19b van die wet][ref11], of in het programma op grond van
      [artikel 19kh, vijfde lid][ref12], en die handelingen overeenkomstig dat plan of dat programma worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel19j
