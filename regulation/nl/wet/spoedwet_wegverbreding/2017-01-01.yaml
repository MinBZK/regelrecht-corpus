  - number: '5'
    text: |-
      Ten aanzien van de in de bijlage, onder A, opgenomen wegaanpassingsprojecten is
      [titel 11.3 van de Wet milieubeheer][ref1] van overeenkomstige toepassing en bevat het wegaanpassingsbesluit:

      a. de beslissing tot het vaststellen of het wijzigen van een geluidproductieplafond voor zover dat
      wegaanpassingsproject zou leiden tot overschrijding van het geldende geluidproductieplafond, en

      b. de referentiepunten ingeval van aanleg of ingeval van verplaatsing van referentiepunten.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '6'
    text: |-
      1 Voor de toepassing van dit artikel wordt verstaan onder akoestische gegevens: de berekening van de 70 dB(A)
      geluidcontour langs de wegvakken, gebaseerd op de verkeersgegevens over het jaar 2000.

      2 Ten aanzien van wegaanpassingsbesluiten voor de in de bijlage, onder B, opgenomen wegaanpassingsprojecten is
      [titel 11.3 van de Wet milieubeheer][ref1] niet van toepassing.

      3 Ten aanzien van de in het tweede lid bedoelde wegaanpassingsprojecten bevat het wegaanpassingsbesluit de
      akoestische gegevens, alsmede de maatregel, voor zover deze voortvloeit uit het vierde lid.

      4 Indien uit de akoestische gegevens blijkt dat sprake is van een overschrijding van 70 dB(A) bij geluidsgevoelige
      objecten, wordt in het wegaanpassingsbesluit een geluidreducerende wegdeklaag voorgeschreven, tenzij dit
      redelijkerwijs niet kan worden gevergd.

      5 Uiterlijk twee jaar na het onherroepelijk worden van het wegaanpassingsbesluit stelt Onze Minister ten aanzien
      van de in het tweede lid bedoelde wegaanpassingsprojecten een plan op voor de te treffen maatregelen, gericht op
      het terugbrengen van de geluidsbelasting die de betrokken geluidsgevoelige objecten vanwege de weg ondervinden.
      [Artikel 4, vierde lid][ref2], met uitzondering van het bepaalde onder b en c, is van overeenkomstige toepassing op
      het plan.

      6 Het plan bevat voorts:

      a. de beslissing tot het vaststellen of het wijzigen van een geluidproductieplafond voor zover aanleg of wijziging
      zou leiden tot overschrijding van het geldende geluidproductieplafond, en

      b. de referentiepunten ingeval van aanleg of ingeval van verplaatsing van referentiepunten.

      7 Het plan bepaalt de termijn waarbinnen de in het vijfde lid bedoelde maatregelen in uitvoering worden genomen.

      8 Vanaf het tijdstip waarop het wegaanpassingsbesluit onherroepelijk is geworden tot het tijdstip waarop
      de maatregelen, bedoeld in het vijfde lid, zijn uitgevoerd, geldt voor de betreffende referentiepunten een
      vrijstelling van [artikel 11.20 van de Wet milieubeheer][ref3].

      9 Voor zover het plan en het bestemmingsplan of de beheersverordening niet met elkaar in
      overeenstemming zijn, geldt het plan voor de uitvoering daarvan als omgevingsvergunning
      waarbij ten behoeve van een project van nationaal belang, met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref4],
      van het bestemmingsplan of de beheersverordening wordt afgeweken. Bij de toepassing van
      [artikel 2.10 van die wet][ref5] wordt onder bestemmingsplan of beheersverordening mede het plan begrepen.
      [Artikel 11, achtste en negende lid][ref6], is van overeenkomstige toepassing.

      10 Op de voorbereiding van het plan is [afdeling 3.4 van de Algemene wet bestuursrecht][ref7] van toepassing.


