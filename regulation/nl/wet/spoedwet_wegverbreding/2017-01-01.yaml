  - number: '7'
    text: |-
      1 Op de voorbereiding van het wegaanpassingsbesluit en de besluiten ter uitvoering van het wegaanpassingsbesluit,
      met uitzondering van de plannen, bedoeld in [artikel 6, vijfde lid][ref1], en de besluiten inzake
      onteigening en nadeelcompensatie en besluiten krachtens de [Belemmeringenwet Privaatrecht][ref2], is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref3] van toepassing, met dien verstande dat:

      a. in afwijking van [artikel 3:11, eerste lid, van die wet][ref4] de aanvragen tot het nemen van de bedoelde
      uitvoeringsbesluiten ter inzage worden gelegd;

      b. de ingevolge [artikel 3:12 van die wet][ref5] vereiste kennisgevingen worden samengevoegd in één kennisgeving,
      welke wordt gedaan door Onze Minister;

      c. zienswijzen naar voren kunnen worden gebracht door een ieder.

      2 Onze Minister draagt ervoor zorg dat zo spoedig mogelijk na het opstellen van een ontwerp van een
      wegaanpassingsbesluit bij de bevoegde bestuursorganen de aanvragen worden ingediend tot het nemen van de besluiten
      die nodig zijn met het oog op de uitvoering van het wegaanpassingsbesluit.

      3 Onze Minister zendt gelijktijdig het ontwerp-wegaanpassingsbesluit alsmede een afschrift van de aanvragen aan de
      betrokken bestuursorganen.


