  - number: '9'
    text: |-
      1 Onze Minister stelt het wegaanpassingsbesluit vast binnen tien weken nadat de termijn voor het naar voren brengen
      van zienswijzen is verstreken.

      2 Indien het wegaanpassingsbesluit niet binnen de in het eerste lid bedoelde termijn wordt vastgesteld, deelt Onze
      Minister dit voor het verstrijken daarvan onder vermelding van de reden mee aan de Staten-Generaal.

      3 De betrokken bestuursorganen zenden binnen de in het eerste lid bedoelde termijn ontwerpen van de besluiten ter
      uitvoering van het wegaanpassingsbesluit aan Onze Minister.

      4 [Artikel 2.7, tweede lid, van de Wet natuurbescherming][ref1] is niet van toepassing op handelingen waarop het
      wegaanpassingsbesluit betrekking heeft.

      5 Indien handelingen waarop het wegaanpassingsbesluit betrekking heeft de kwaliteit van de natuurlijke habitats
      en de habitats van soorten in een Natura 2000-gebied als bedoeld in de [Wet natuurbescherming][ref2] kunnen
      verslechteren of een significant verstorend effect kunnen hebben op de soorten waarvoor het gebied is aangewezen,
      gelet op de instandhoudingsdoelstelling voor dat gebied, wordt het wegaanpassingsbesluit uitsluitend vastgesteld
      indien is voldaan aan [artikel 2.8 van die wet][ref3].

      6 Het vierde en vijfde lid zijn niet van toepassing indien ten aanzien van het project
      of de andere handeling waarop het wegaanpassingsbesluit betrekking heeft, is voldaan aan
      [artikel 2.9, eerste, tweede, derde of vijfde lid, van de Wet natuurbescherming][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2.7
      [ref2]: https://wetten.overheid.nl/BWBR0037552
