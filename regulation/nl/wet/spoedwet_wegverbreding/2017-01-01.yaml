  - number: '4'
    text: |-
      1 Het wegaanpassingsbesluit bevat ten minste:

      a. een beschrijving van het betrokken wegaanpassingsproject, waaronder begrepen de te realiseren rijstroken, en van
      de wijze waarop het zal worden uitgevoerd;

      b. een beschrijving van de gevolgen van het wegaanpassingsproject voor de daarbij betrokken belangen en van de
      wijze waarop met die belangen rekening is gehouden;

      c. de aanduiding op een of meer topografische of geografische kaarten van het verloop en de geografische omvang van
      het wegaanpassingsproject;

      d. hetgeen nodig is ter uitvoering van ter zake van belang zijnde richtlijnen van de Europese Unie;

      e. voor zover het betreft de in de bijlage, onder B, opgenomen wegaanpassingsprojecten voor het desbetreffende
      wegvak een verlaging van de maximum-snelheid van de motorvoertuigen gedurende de periode van openstelling van de
      extra rijstrook, waarvan de mate en de duur van de verlaging worden bepaald door de ernst van de belasting met
      betrekking tot geluidhinder en luchtkwaliteit.

      2 Het wegaanpassingsbesluit bevat, voor zover van toepassing, voorts:

      a. een beschrijving van maatregelen van landschappelijke, landbouwkundige en ecologische aard;

      b. een beschrijving van de werken of bouwwerken die, zonder deel uit te maken van het profiel van een weg, met die
      weg zijn verbonden en dienen voor de instandhouding dan wel het veilig en doelmatig gebruik daarvan;

      c. een opgave van de kabels en leidingen die moeten worden verwijderd voor de uitvoering van het besluit, alsmede,
      voor zover het betreft waterstaatswerken als bedoeld in [artikel 1 van de Wet beheer rijkswaterstaatswerken][ref1]
      of [artikel 1.1 van de Waterwet][ref2], voor zover in beheer bij het rijk, de plaats waar zodanige kabels en
      leidingen zullen worden gelegd;

      d. een beschrijving op welke wijze de inpassing van de aan te passen weg in de omgeving zal geschieden, en waar dit
      in redelijkheid niet kan worden verlangd, welke compenserende maatregelen zullen worden getroffen.

      3 Ter voldoening aan het eerste lid, onder c, wordt gebruik gemaakt van een of meer detailkaarten met een schaal
      van ten minste 1:2500 en van een of meer overzichtskaarten met een schaal van ten minste 1:20 000.

      4 Onze Minister kan zich bij de vaststelling van het wegaanpassingsbesluit in ieder geval baseren op gegevens en
      onderzoeken die niet ouder zijn dan twee jaar.

      5 Het luchtkwaliteitsonderzoek ten behoeve van een wegaanpassingsbesluit wordt beperkt tot het gebied dat zich
      uitstrekt van de voorafgaande tot en met de eerstvolgende aansluiting op de aan te passen weg en ter weerszijden
      van dit wegvak tot één kilometer vanuit de meest buiten gelegen rijstroken. Onder aansluiting wordt tevens
      knooppunt verstaan.

      6 Onze Minister kan nadere regels stellen ten aanzien van de methoden en uitgangspunten voor de beoordeling van
      effecten van een wegaanpassingsproject.


      [ref1]: https://wetten.overheid.nl/BWBR0008331#Artikel1
