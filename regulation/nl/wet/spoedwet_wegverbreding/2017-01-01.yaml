  - number: '14'
    text: |-
      1 De Afdeling bestuursrechtspraak van de Raad van State beslist op de beroepen tegen de in [artikel 13][ref1]
      bedoelde besluiten binnen twaalf weken na ontvangst van de desbetreffende verweerschriften.

      2 In bijzondere omstandigheden kan de Afdeling bestuursrechtspraak deze termijn met ten hoogste twaalf weken
      verlengen.


      [ref1]: https://wetten.overheid.nl/BWBR0015158#Artikel13
