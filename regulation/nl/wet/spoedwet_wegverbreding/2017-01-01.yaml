preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is bijzondere wettelijke voorzieningen tot stand te
    brengen ten behoeve van het zo spoedig mogelijk vergroten van de capaciteit van een aantal hoofdwegen door middel
    van een betere benutting en verbreding van die wegen teneinde filevorming tegen te gaan;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Infrastructuur en Milieu;

      b. wegaanpassingsbesluit: het besluit, bedoeld in [artikel 4][ref1];

      c. geluidproductieplafond: geluidproductieplafond als bedoeld in [artikel 11.1 van de Wet milieubeheer][ref2];

      d. referentiepunt: referentiepunt als bedoeld in [artikel 11.19 van de Wet milieubeheer][ref3];

      e. geluidsgevoelig object: geluidsgevoelig object als bedoeld in [artikel 11.1 van de Wet milieubeheer][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0015158#Artikel4
