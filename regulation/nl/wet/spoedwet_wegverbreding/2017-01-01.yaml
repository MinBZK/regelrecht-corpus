  - number: '11'
    text: |-
      1 Voor het gebied dat is begrepen in een vastgesteld wegaanpassingsbesluit geldt dat besluit als
      voorbereidingsbesluit als bedoeld in [artikel 3.7 van de Wet ruimtelijke ordening][ref1].

      2 Voor zover het wegaanpassingsbesluit geldt als voorbereidingsbesluit, is
      [artikel 3.7, vijfde en zesde lid, van de Wet ruimtelijke ordening][ref2] niet van toepassing.

      3 Het wegaanpassingsbesluit geldt niet langer als voorbereidingsbesluit indien voor het in het eerste lid bedoelde
      gebied een bestemmingsplan in overeenstemming met het wegaanpassingsbesluit van kracht is geworden.

      4 [Artikel 3.3, eerste tot en met derde lid, van de Wet algemene bepalingen omgevingsrecht][ref3] is
      niet van toepassing op aanvragen om een omgevingsvergunning voor een bouwactiviteit als bedoeld in
      [artikel 2.1, eerste lid, onder a, van die wet][ref4] ter uitvoering van het wegaanpassingsbesluit.

      5 Indien ter uitvoering van het wegaanpassingsbesluit handelingen worden verricht waarvoor krachtens
      [artikel 15 van de Wegenverkeerswet 1994][ref5] een verkeersbesluit is vereist, is dat artikel niet van toepassing.

      6 Voor zover het wegaanpassingsbesluit en het bestemmingsplan of de beheersverordening
      niet met elkaar in overeenstemming zijn, geldt het besluit voor de uitvoering daarvan als
      omgevingsvergunning waarbij ten behoeve van een project van nationaal belang, met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref6], van het
      bestemmingsplan of de beheersverordening wordt afgeweken. Bij de toepassing van [artikel 2.10 van die wet][ref7]
      wordt onder bestemmingsplan of beheersverordening mede het wegaanpassingsbesluit begrepen.

      7 Voor zover een bestemmingsplan, een beheersverordening of een ander besluit voor de uitvoering
      van werken of werkzaamheden een omgevingsvergunning voor een aanlegactiviteit als bedoeld in
      [artikel 2.1, eerste lid, onder b, van de Wet algemene bepalingen omgevingsrecht][ref8] vereist, geldt zodanige eis
      niet in het gebied dat is begrepen in een vastgesteld wegaanpassingsbesluit.

      8 De gemeenteraad stelt binnen een jaar nadat het wegaanpassingsbesluit onherroepelijk is geworden een
      bestemmingsplan of een beheersverordening als bedoeld in de [Wet ruimtelijke ordening][ref9] overeenkomstig
      het wegaanpassingsbesluit vast. Voor zover een ontwerp van een bestemmingsplan zijn grondslag vindt in het
      wegaanpassingsbesluit kunnen zienswijzen geen betrekking hebben op dat deel van het ontwerpplan.

      9 Indien een bestemmingsplan in strijd is met een onherroepelijk wegaanpassingsbesluit en het bestemmingsplan nog
      niet is aangepast aan het wegaanpassingsbesluit, is het gemeentebestuur verplicht aan degenen die inzage verlangen
      in zodanig bestemmingsplan, tevens inzage te verlenen in het ten aanzien van het door dat plan bestreken gebied
      vastgestelde wegaanpassingsbesluit.


