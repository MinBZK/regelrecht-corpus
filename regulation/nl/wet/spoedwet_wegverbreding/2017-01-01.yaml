  - number: '8'
    text: |-
      1 Onze Minister bevordert een gecoördineerde voorbereiding van de in [artikel 7, eerste lid][ref1], bedoelde
      besluiten.

      2 Onze Minister kan van andere betrokken bestuursorganen de medewerking vorderen die voor het welslagen van de
      coördinatie nodig is. Die bestuursorganen verlenen de van hen gevorderde medewerking.


      [ref1]: https://wetten.overheid.nl/BWBR0015158#Artikel7
