    text: |-
      1 Deze wet is van toepassing op de wegaanpassingsprojecten, opgenomen in de bij deze wet behorende bijlage.

      2 De in het eerste lid genoemde bijlage kan worden gewijzigd bij algemene maatregel van bestuur. Een zodanige
      algemene maatregel van bestuur kan slechts betrekking hebben op de in de bijlage omschreven aard van het project,
      de wijziging van het aantal rijstroken en de kilometrering.

      3 Een krachtens het tweede lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan
      vier weken na de datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel2
  - number: '3'
    text: |-
      1 Ten aanzien van de in de bijlage genoemde wegaanpassingsprojecten is de [Tracéwet][ref1] niet van toepassing.

      2 Indien op grond van [artikel 7.2 van de Wet milieubeheer][ref2] een milieueffectrapport wordt opgesteld ten
      aanzien van een in de bijlage genoemd wegaanpassingsproject:

      a. kan in dat milieueffectrapport, in afwijking van [artikel 7.23, eerste lid, onder b, van die wet][ref3],
      volstaan worden met een beschrijving van de voorgenomen activiteit en van de wijze waarop zij zal worden
      uitgevoerd;

      b. zijn de [artikelen 7.27, eerste tot en met vijfde en zevende lid][ref4], [7.32, vijfde lid][ref5], en
      [7.39 tot en met 7.42 van die wet][ref6] niet van toepassing.


