  - number: '15'
    text: |-
      1 Ten aanzien van de verlegging van kabels en leidingen, verband houdende met de
      uitvoering van een wegaanpassingsbesluit, is geen concessie of een erkenning als bedoeld in
      [artikel 1 van de Belemmeringenwet Privaatrecht][ref1] vereist.

      2 Indien voor de verlegging van kabels en leidingen, verband houdende met de uitvoering van een
      wegaanpassingsbesluit, toepassing van de [Belemmeringenwet Privaatrecht][ref2] noodzakelijk is:

      a. kan Onze Minister in afwijking van [artikel 2, vierde lid, van de Belemmeringenwet Privaatrecht][ref3]:

      1°. een andere plaats of gemeente aanwijzen waar de zitting plaatsvindt;

      2°. bepalen dat de zitting wordt geleid door een door Onze Minister aan te wijzen persoon;

      b. worden in afwijking van de artikelen 2, zevende lid, en [3, derde lid][ref4], juncto
      [2, zevende lid, van de Belemmeringenwet Privaatrecht][ref5] gedeputeerde staten niet gehoord;

      c. geldt in plaats van [artikel 4 van de Belemmeringenwet Privaatrecht][ref6] dat de werking van een besluit als
      bedoeld in [artikel 2, vijfde lid][ref7], of [artikel 3, tweede lid, van de Belemmeringenwet Privaatrecht][ref8]
      opgeschort wordt totdat de termijn voor het indienen van een beroepschrift is verstreken.

      3 De Afdeling bestuursrechtspraak van de Raad van State beslist op beroepen tegen besluiten als bedoeld in
      [artikel 2, vijfde lid][ref9], of [artikel 3, tweede lid, van de Belemmeringenwet Privaatrecht][ref10] binnen
      twaalf weken na ontvangst van de desbetreffende verweerschriften.


