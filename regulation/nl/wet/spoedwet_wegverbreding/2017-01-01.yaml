$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: spoedwet_wegverbreding
regulatory_layer: WET
publication_date: '2016-07-21'
valid_from: '2017-01-01'
bwb_id: BWBR0015158
url: https://wetten.overheid.nl/BWBR0015158/2017-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is bijzondere wettelijke voorzieningen tot stand te
    brengen ten behoeve van het zo spoedig mogelijk vergroten van de capaciteit van een aantal hoofdwegen door middel
    van een betere benutting en verbreding van die wegen teneinde filevorming tegen te gaan;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Infrastructuur en Milieu;'
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel1
  - number: 1.b
    text: |-
      wegaanpassingsbesluit: het besluit, bedoeld in [artikel 4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015158#Artikel4
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0015158
        artikel: '4'
        hoofdstuk: '2'
  - number: 1.c
    text: |-
      geluidproductieplafond: geluidproductieplafond als bedoeld in [artikel 11.1 van de Wet milieubeheer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 1.d
    text: |-
      referentiepunt: referentiepunt als bedoeld in [artikel 11.19 van de Wet milieubeheer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 1.e
    text: |-
      geluidsgevoelig object: geluidsgevoelig object als bedoeld in [artikel 11.1 van de Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: '2.1'
    text: Deze wet is van toepassing op de wegaanpassingsprojecten, opgenomen in de bij deze wet behorende bijlage.
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel2
  - number: '2.2'
    text: |-
      De in het eerste lid genoemde bijlage kan worden gewijzigd bij algemene maatregel van bestuur. Een zodanige
      algemene maatregel van bestuur kan slechts betrekking hebben op de in de bijlage omschreven aard van het project,
      de wijziging van het aantal rijstroken en de kilometrering.
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel2
  - number: '2.3'
    text: |-
      Een krachtens het tweede lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan vier
      weken na de datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel2
  - number: '3.1'
    text: |-
      Ten aanzien van de in de bijlage genoemde wegaanpassingsprojecten is de [Tracéwet][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006147
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006147
  - number: '3.2'
    text: |-
      Indien op grond van [artikel 7.2 van de Wet milieubeheer][ref1] een milieueffectrapport wordt opgesteld ten aanzien
      van een in de bijlage genoemd wegaanpassingsproject:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
  - number: 3.2.a
    text: |-
      kan in dat milieueffectrapport, in afwijking van [artikel 7.23, eerste lid, onder b, van die wet][ref1], volstaan
      worden met een beschrijving van de voorgenomen activiteit en van de wijze waarop zij zal worden uitgevoerd;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
  - number: 3.2.b
    text: |-
      zijn de [artikelen 7.27, eerste tot en met vijfde en zevende lid][ref1], [7.32, vijfde lid][ref2], en
      [7.39 tot en met 7.42 van die wet][ref3] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '7'
  - number: '4.1'
    text: 'Het wegaanpassingsbesluit bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel4
  - number: 4.1.a
    text: |-
      een beschrijving van het betrokken wegaanpassingsproject, waaronder begrepen de te realiseren rijstroken, en van de
      wijze waarop het zal worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel4
  - number: 4.1.b
    text: |-
      een beschrijving van de gevolgen van het wegaanpassingsproject voor de daarbij betrokken belangen en van de wijze
      waarop met die belangen rekening is gehouden;
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel4
  - number: 4.1.c
    text: |-
      de aanduiding op een of meer topografische of geografische kaarten van het verloop en de geografische omvang van
      het wegaanpassingsproject;
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel4
  - number: 4.1.d
    text: hetgeen nodig is ter uitvoering van ter zake van belang zijnde richtlijnen van de Europese Unie;
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel4
  - number: 4.1.e
    text: |-
      voor zover het betreft de in de bijlage, onder B, opgenomen wegaanpassingsprojecten voor het desbetreffende wegvak
      een verlaging van de maximum-snelheid van de motorvoertuigen gedurende de periode van openstelling van de extra
      rijstrook, waarvan de mate en de duur van de verlaging worden bepaald door de ernst van de belasting met betrekking
      tot geluidhinder en luchtkwaliteit.
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel4
  - number: '4.2'
    text: 'Het wegaanpassingsbesluit bevat, voor zover van toepassing, voorts:'
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel4
  - number: 4.2.a
    text: een beschrijving van maatregelen van landschappelijke, landbouwkundige en ecologische aard;
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel4
  - number: 4.2.b
    text: |-
      een beschrijving van de werken of bouwwerken die, zonder deel uit te maken van het profiel van een weg, met die weg
      zijn verbonden en dienen voor de instandhouding dan wel het veilig en doelmatig gebruik daarvan;
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel4
  - number: 4.2.c
    text: |-
      een opgave van de kabels en leidingen die moeten worden verwijderd voor de uitvoering van het besluit, alsmede,
      voor zover het betreft waterstaatswerken als bedoeld in [artikel 1 van de Wet beheer rijkswaterstaatswerken][ref1]
      of [artikel 1.1 van de Waterwet][ref2], voor zover in beheer bij het rijk, de plaats waar zodanige kabels en
      leidingen zullen worden gelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0008331#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel1
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008331
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '1'
  - number: 4.2.d
    text: |-
      een beschrijving op welke wijze de inpassing van de aan te passen weg in de omgeving zal geschieden, en waar dit in
      redelijkheid niet kan worden verlangd, welke compenserende maatregelen zullen worden getroffen.
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel4
  - number: '4.3'
    text: |-
      Ter voldoening aan het eerste lid, onder c, wordt gebruik gemaakt van een of meer detailkaarten met een schaal van
      ten minste 1:2500 en van een of meer overzichtskaarten met een schaal van ten minste 1:20 000.
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel4
  - number: '4.4'
    text: |-
      Onze Minister kan zich bij de vaststelling van het wegaanpassingsbesluit in ieder geval baseren op gegevens en
      onderzoeken die niet ouder zijn dan twee jaar.
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel4
  - number: '4.5'
    text: |-
      Het luchtkwaliteitsonderzoek ten behoeve van een wegaanpassingsbesluit wordt beperkt tot het gebied dat zich
      uitstrekt van de voorafgaande tot en met de eerstvolgende aansluiting op de aan te passen weg en ter weerszijden
      van dit wegvak tot één kilometer vanuit de meest buiten gelegen rijstroken. Onder aansluiting wordt tevens
      knooppunt verstaan.
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel4
  - number: '4.6'
    text: |-
      Onze Minister kan nadere regels stellen ten aanzien van de methoden en uitgangspunten voor de beoordeling van
      effecten van een wegaanpassingsproject.
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel4
  - number: '5'
    text: |-
      Ten aanzien van de in de bijlage, onder A, opgenomen wegaanpassingsprojecten is
      [titel 11.3 van de Wet milieubeheer][ref1] van overeenkomstige toepassing en bevat het wegaanpassingsbesluit:


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 5.a
    text: |-
      de beslissing tot het vaststellen of het wijzigen van een geluidproductieplafond voor zover dat
      wegaanpassingsproject zou leiden tot overschrijding van het geldende geluidproductieplafond, en
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel5
  - number: 5.b
    text: de referentiepunten ingeval van aanleg of ingeval van verplaatsing van referentiepunten.
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel5
  - number: '6.1'
    text: |-
      Voor de toepassing van dit artikel wordt verstaan onder akoestische gegevens: de berekening van de 70 dB(A)
      geluidcontour langs de wegvakken, gebaseerd op de verkeersgegevens over het jaar 2000.
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel6
  - number: '6.2'
    text: |-
      Ten aanzien van wegaanpassingsbesluiten voor de in de bijlage, onder B, opgenomen wegaanpassingsprojecten is
      [titel 11.3 van de Wet milieubeheer][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '6.3'
    text: |-
      Ten aanzien van de in het tweede lid bedoelde wegaanpassingsprojecten bevat het wegaanpassingsbesluit de
      akoestische gegevens, alsmede de maatregel, voor zover deze voortvloeit uit het vierde lid.
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel6
  - number: '6.4'
    text: |-
      Indien uit de akoestische gegevens blijkt dat sprake is van een overschrijding van 70 dB(A) bij geluidsgevoelige
      objecten, wordt in het wegaanpassingsbesluit een geluidreducerende wegdeklaag voorgeschreven, tenzij dit
      redelijkerwijs niet kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel6
  - number: '6.5'
    text: |-
      Uiterlijk twee jaar na het onherroepelijk worden van het wegaanpassingsbesluit stelt Onze Minister ten aanzien
      van de in het tweede lid bedoelde wegaanpassingsprojecten een plan op voor de te treffen maatregelen, gericht op
      het terugbrengen van de geluidsbelasting die de betrokken geluidsgevoelige objecten vanwege de weg ondervinden.
      [Artikel 4, vierde lid][ref1], met uitzondering van het bepaalde onder b en c, is van overeenkomstige toepassing op
      het plan.


      [ref1]: https://wetten.overheid.nl/BWBR0015158#Artikel4
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0015158
        artikel: '4'
        hoofdstuk: '2'
  - number: '6.6'
    text: 'Het plan bevat voorts:'
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel6
  - number: 6.6.a
    text: |-
      de beslissing tot het vaststellen of het wijzigen van een geluidproductieplafond voor zover aanleg of wijziging zou
      leiden tot overschrijding van het geldende geluidproductieplafond, en
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel6
  - number: 6.6.b
    text: de referentiepunten ingeval van aanleg of ingeval van verplaatsing van referentiepunten.
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel6
  - number: '6.7'
    text: Het plan bepaalt de termijn waarbinnen de in het vijfde lid bedoelde maatregelen in uitvoering worden genomen.
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel6
  - number: '6.8'
    text: |-
      Vanaf het tijdstip waarop het wegaanpassingsbesluit onherroepelijk is geworden tot het tijdstip waarop de
      maatregelen, bedoeld in het vijfde lid, zijn uitgevoerd, geldt voor de betreffende referentiepunten een
      vrijstelling van [artikel 11.20 van de Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: '6.9'
    text: |-
      Voor zover het plan en het bestemmingsplan of de beheersverordening niet met elkaar in
      overeenstemming zijn, geldt het plan voor de uitvoering daarvan als omgevingsvergunning
      waarbij ten behoeve van een project van nationaal belang, met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref1],
      van het bestemmingsplan of de beheersverordening wordt afgeweken. Bij de toepassing van
      [artikel 2.10 van die wet][ref2] wordt onder bestemmingsplan of beheersverordening mede het plan begrepen.
      [Artikel 11, achtste en negende lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0015158#Artikel11
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0015158
        artikel: '11'
        hoofdstuk: '2'
  - number: '6.10'
    text: |-
      Op de voorbereiding van het plan is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '7.1'
    text: |-
      Op de voorbereiding van het wegaanpassingsbesluit en de besluiten ter uitvoering van het wegaanpassingsbesluit,
      met uitzondering van de plannen, bedoeld in [artikel 6, vijfde lid][ref1], en de besluiten inzake
      onteigening en nadeelcompensatie en besluiten krachtens de [Belemmeringenwet Privaatrecht][ref2], is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref3] van toepassing, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0015158#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001936
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0015158
        artikel: '6'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0001936
      - id: ref3
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 7.1.a
    text: |-
      in afwijking van [artikel 3:11, eerste lid, van die wet][ref1] de aanvragen tot het nemen van de bedoelde
      uitvoeringsbesluiten ter inzage worden gelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 7.1.b
    text: |-
      de ingevolge [artikel 3:12 van die wet][ref1] vereiste kennisgevingen worden samengevoegd in één kennisgeving,
      welke wordt gedaan door Onze Minister;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 7.1.c
    text: zienswijzen naar voren kunnen worden gebracht door een ieder.
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel7
  - number: '7.2'
    text: |-
      Onze Minister draagt ervoor zorg dat zo spoedig mogelijk na het opstellen van een ontwerp van een
      wegaanpassingsbesluit bij de bevoegde bestuursorganen de aanvragen worden ingediend tot het nemen van de besluiten
      die nodig zijn met het oog op de uitvoering van het wegaanpassingsbesluit.
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel7
  - number: '7.3'
    text: |-
      Onze Minister zendt gelijktijdig het ontwerp-wegaanpassingsbesluit alsmede een afschrift van de aanvragen aan de
      betrokken bestuursorganen.
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel7
  - number: '8.1'
    text: |-
      Onze Minister bevordert een gecoördineerde voorbereiding van de in [artikel 7, eerste lid][ref1], bedoelde
      besluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0015158#Artikel7
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015158
        artikel: '7'
        hoofdstuk: '2'
  - number: '8.2'
    text: |-
      Onze Minister kan van andere betrokken bestuursorganen de medewerking vorderen die voor het welslagen van de
      coördinatie nodig is. Die bestuursorganen verlenen de van hen gevorderde medewerking.
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel8
  - number: '9.1'
    text: |-
      Onze Minister stelt het wegaanpassingsbesluit vast binnen tien weken nadat de termijn voor het naar voren brengen
      van zienswijzen is verstreken.
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel9
  - number: '9.2'
    text: |-
      Indien het wegaanpassingsbesluit niet binnen de in het eerste lid bedoelde termijn wordt vastgesteld, deelt Onze
      Minister dit voor het verstrijken daarvan onder vermelding van de reden mee aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel9
  - number: '9.3'
    text: |-
      De betrokken bestuursorganen zenden binnen de in het eerste lid bedoelde termijn ontwerpen van de besluiten ter
      uitvoering van het wegaanpassingsbesluit aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel9
  - number: '9.4'
    text: |-
      [Artikel 2.7, tweede lid, van de Wet natuurbescherming][ref1] is niet van toepassing op handelingen waarop het
      wegaanpassingsbesluit betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
  - number: '9.5'
    text: |-
      Indien handelingen waarop het wegaanpassingsbesluit betrekking heeft de kwaliteit van de natuurlijke habitats en de
      habitats van soorten in een Natura 2000-gebied als bedoeld in de [Wet natuurbescherming][ref1] kunnen verslechteren
      of een significant verstorend effect kunnen hebben op de soorten waarvoor het gebied is aangewezen, gelet op de
      instandhoudingsdoelstelling voor dat gebied, wordt het wegaanpassingsbesluit uitsluitend vastgesteld indien is
      voldaan aan [artikel 2.8 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037552
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0037552
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '2'
  - number: '9.6'
    text: |-
      Het vierde en vijfde lid zijn niet van toepassing indien ten aanzien van het project of
      de andere handeling waarop het wegaanpassingsbesluit betrekking heeft, is voldaan aan
      [artikel 2.9, eerste, tweede, derde of vijfde lid, van de Wet natuurbescherming][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
  - number: '10.1'
    text: |-
      De betrokken bestuursorganen nemen de besluiten ter uitvoering van het wegaanpassingsbesluit binnen zes weken na
      bekendmaking van het wegaanpassingsbesluit en zenden deze besluiten onmiddellijk toe aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel10
  - number: '10.2'
    text: |-
      De in het eerste lid bedoelde termijn treedt in de plaats van de bij of krachtens enig ander wettelijk voorschrift
      voor die besluiten bepaalde beslistermijnen.
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel10
  - number: '10.3'
    text: |-
      Indien een bestuursorgaan van een provincie, een gemeente of een waterschap of een ander openbaar lichaam, dat in
      eerste aanleg bevoegd is te beslissen op een aanvraag als bedoeld in [artikel 7, tweede lid][ref1], niet of niet
      tijdig een ontwerp-besluit op de aanvraag aan Onze Minister zendt, dan wel niet of niet tijdig op de aanvraag
      beslist, dan wel een beslissing neemt die naar het oordeel van Onze Minister wijziging behoeft, kan Onze Minister
      een beslissing op de aanvraag nemen. In het laatste geval treedt zijn besluit in de plaats van het besluit van het
      in eerste aanleg bevoegde bestuursorgaan. Indien Onze Minister voornemens is zelf een beslissing op de aanvraag te
      nemen, pleegt hij overleg met het bestuursorgaan dat in eerste aanleg bevoegd is op de aanvraag te beslissen.


      [ref1]: https://wetten.overheid.nl/BWBR0015158#Artikel7
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0015158
        artikel: '7'
        hoofdstuk: '2'
  - number: '10.4'
    text: Het eerste tot en met derde lid is van overeenkomstige toepassing op de ambtshalve te nemen besluiten.
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel10
  - number: '10.5'
    text: |-
      Het derde lid is van overeenkomstige toepassing ten aanzien van andere besluiten dan die ter uitvoering van het
      wegaanpassingsbesluit, welke zijn gericht op de realisering van het desbetreffende wegaanpassingsproject.
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel10
  - number: '10.6'
    text: |-
      Indien bij de toepassing van het derde lid de beslissing op een aanvraag wordt genomen door Onze Minister, stort
      het bestuursorgaan dat in eerste aanleg bevoegd is te beslissen op de aanvraag, de ter zake ontvangen leges in 's
      Rijks kas.
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel10
  - number: '10.7'
    text: |-
      De in [artikel 7, tweede lid][ref1], bedoelde besluiten worden gelijktijdig door Onze Minister bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0015158#Artikel7
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0015158
        artikel: '7'
        hoofdstuk: '2'
  - number: '11.1'
    text: |-
      Voor het gebied dat is begrepen in een vastgesteld wegaanpassingsbesluit geldt dat besluit als
      voorbereidingsbesluit als bedoeld in [artikel 3.7 van de Wet ruimtelijke ordening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: '11.2'
    text: |-
      Voor zover het wegaanpassingsbesluit geldt als voorbereidingsbesluit, is
      [artikel 3.7, vijfde en zesde lid, van de Wet ruimtelijke ordening][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: '11.3'
    text: |-
      Het wegaanpassingsbesluit geldt niet langer als voorbereidingsbesluit indien voor het in het eerste lid bedoelde
      gebied een bestemmingsplan in overeenstemming met het wegaanpassingsbesluit van kracht is geworden.
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel11
  - number: '11.4'
    text: |-
      [Artikel 3.3, eerste tot en met derde lid, van de Wet algemene bepalingen omgevingsrecht][ref1] is
      niet van toepassing op aanvragen om een omgevingsvergunning voor een bouwactiviteit als bedoeld in
      [artikel 2.1, eerste lid, onder a, van die wet][ref2] ter uitvoering van het wegaanpassingsbesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '11.5'
    text: |-
      Indien ter uitvoering van het wegaanpassingsbesluit handelingen worden verricht waarvoor krachtens
      [artikel 15 van de Wegenverkeerswet 1994][ref1] een verkeersbesluit is vereist, is dat artikel niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel15
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '15'
  - number: '11.6'
    text: |-
      Voor zover het wegaanpassingsbesluit en het bestemmingsplan of de beheersverordening
      niet met elkaar in overeenstemming zijn, geldt het besluit voor de uitvoering daarvan als
      omgevingsvergunning waarbij ten behoeve van een project van nationaal belang, met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref1], van het
      bestemmingsplan of de beheersverordening wordt afgeweken. Bij de toepassing van [artikel 2.10 van die wet][ref2]
      wordt onder bestemmingsplan of beheersverordening mede het wegaanpassingsbesluit begrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '11.7'
    text: |-
      Voor zover een bestemmingsplan, een beheersverordening of een ander besluit voor de uitvoering
      van werken of werkzaamheden een omgevingsvergunning voor een aanlegactiviteit als bedoeld in
      [artikel 2.1, eerste lid, onder b, van de Wet algemene bepalingen omgevingsrecht][ref1] vereist, geldt zodanige eis
      niet in het gebied dat is begrepen in een vastgesteld wegaanpassingsbesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '11.8'
    text: |-
      De gemeenteraad stelt binnen een jaar nadat het wegaanpassingsbesluit onherroepelijk is geworden een
      bestemmingsplan of een beheersverordening als bedoeld in de [Wet ruimtelijke ordening][ref1] overeenkomstig
      het wegaanpassingsbesluit vast. Voor zover een ontwerp van een bestemmingsplan zijn grondslag vindt in het
      wegaanpassingsbesluit kunnen zienswijzen geen betrekking hebben op dat deel van het ontwerpplan.


      [ref1]: https://wetten.overheid.nl/BWBR0020449
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0020449
  - number: '11.9'
    text: |-
      Indien een bestemmingsplan in strijd is met een onherroepelijk wegaanpassingsbesluit en het bestemmingsplan nog
      niet is aangepast aan het wegaanpassingsbesluit, is het gemeentebestuur verplicht aan degenen die inzage verlangen
      in zodanig bestemmingsplan, tevens inzage te verlenen in het ten aanzien van het door dat plan bestreken gebied
      vastgestelde wegaanpassingsbesluit.
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel11
  - number: '12'
    text: |-
      Het wegaanpassingsbesluit vervalt van rechtswege indien het niet binnen twee jaar na het tijdstip waarop het
      onherroepelijk is geworden in uitvoering is genomen.
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel12
  - number: '13'
    text: |-
      In afwijking van [artikel 6:8 van de Algemene wet bestuursrecht][ref1] vangt de termijn voor het
      indienen van een beroepschrift tegen een wegaanpassingsbesluit en de besluiten ter uitvoering van een
      wegaanpassingsbesluit als bedoeld in [artikel 7, eerste lid][ref2], aan met ingang van de dag na die waarop de in
      [artikel 10, zevende lid][ref3], bedoelde bekendmaking is geschied.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0015158#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0015158#Artikel10
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0015158
        artikel: '7'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0015158
        artikel: '10'
        hoofdstuk: '2'
  - number: '14.1'
    text: |-
      De Afdeling bestuursrechtspraak van de Raad van State beslist op de beroepen tegen de in [artikel 13][ref1]
      bedoelde besluiten binnen twaalf weken na ontvangst van de desbetreffende verweerschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0015158#Artikel13
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0015158
        artikel: '13'
        hoofdstuk: '3'
  - number: '14.2'
    text: |-
      In bijzondere omstandigheden kan de Afdeling bestuursrechtspraak deze termijn met ten hoogste twaalf weken
      verlengen.
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel14
  - number: '15.1'
    text: |-
      Ten aanzien van de verlegging van kabels en leidingen, verband houdende met de uitvoering
      van een wegaanpassingsbesluit, is geen concessie of een erkenning als bedoeld in
      [artikel 1 van de Belemmeringenwet Privaatrecht][ref1] vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0001936#Artikel1
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001936
        artikel: '1'
  - number: '15.2'
    text: |-
      Indien voor de verlegging van kabels en leidingen, verband houdende met de uitvoering van een
      wegaanpassingsbesluit, toepassing van de [Belemmeringenwet Privaatrecht][ref1] noodzakelijk is:


      [ref1]: https://wetten.overheid.nl/BWBR0001936
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001936
  - number: 15.2.a
    text: |-
      kan Onze Minister in afwijking van [artikel 2, vierde lid, van de Belemmeringenwet Privaatrecht][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0001936#Artikel2
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001936
        artikel: '2'
  - number: 15.2.a.1°
    text: een andere plaats of gemeente aanwijzen waar de zitting plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel15
  - number: 15.2.a.2°
    text: bepalen dat de zitting wordt geleid door een door Onze Minister aan te wijzen persoon;
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel15
  - number: 15.2.b
    text: |-
      worden in afwijking van de artikelen 2, zevende lid, en [3, derde lid][ref1], juncto
      [2, zevende lid, van de Belemmeringenwet Privaatrecht][ref2] gedeputeerde staten niet gehoord;


      [ref1]: https://wetten.overheid.nl/BWBR0001936#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0001936#Artikel2
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001936
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0001936
        artikel: '2'
  - number: 15.2.c
    text: |-
      geldt in plaats van [artikel 4 van de Belemmeringenwet Privaatrecht][ref1] dat de werking van een besluit als
      bedoeld in [artikel 2, vijfde lid][ref2], of [artikel 3, tweede lid, van de Belemmeringenwet Privaatrecht][ref3]
      opgeschort wordt totdat de termijn voor het indienen van een beroepschrift is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0001936#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0001936#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0001936#Artikel3
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001936
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0001936
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0001936
        artikel: '3'
  - number: '15.3'
    text: |-
      De Afdeling bestuursrechtspraak van de Raad van State beslist op beroepen tegen besluiten als bedoeld in
      [artikel 2, vijfde lid][ref1], of [artikel 3, tweede lid, van de Belemmeringenwet Privaatrecht][ref2] binnen twaalf
      weken na ontvangst van de desbetreffende verweerschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0001936#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001936#Artikel3
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001936
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001936
        artikel: '3'
  - number: '16.1'
    text: |-
      Onteigening van onroerende zaken en van rechten als bedoeld in [artikel 4, eerste lid, van de onteigeningswet][ref1]
      ten behoeve van de uitvoering van het wegaanpassingsbesluit geschiedt ingevolge het besluit, bedoeld in
      [artikel 72a van de onteigeningswet][ref2], met dien verstande dat over het in artikel 72a van de onteigeningswet
      bedoelde besluit de Raad van State niet wordt gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel72a
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0001842
        artikel: 72a
  - number: '16.2'
    text: |-
      De in [artikel 18, eerste lid, van de onteigeningswet][ref1] bedoelde dagvaarding kan geschieden nadat het
      wegaanpassingsbesluit is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel18
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '18'
  - number: '16.3'
    text: |-
      Onverminderd het bepaalde in [artikel 59, eerste lid, van de onteigeningswet][ref1] kan het vonnis van onteigening
      van de rechtbank niet eerder in de openbare registers worden ingeschreven dan nadat het wegaanpassingsbesluit
      onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel59
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '59'
  - number: '16.4'
    text: |-
      In aanvulling op de [artikelen 54n][ref1] en [59 van de onteigeningswet][ref2] is ten behoeve van de in het
      derde lid bedoelde inschrijving een uitspraak van de Afdeling bestuursrechtspraak van de Raad van State dan
      wel een verklaring van de Secretaris van de Raad van State nodig, waaruit blijkt dat het wegaanpassingsbesluit
      onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel54n
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel59
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: 54n
      - id: ref2
        bwb_id: BWBR0001842
        artikel: '59'
  - number: '17.1'
    text: |-
      Voor zover blijkt dat een belanghebbende ten gevolge van een onherroepelijk wegaanpassingsbesluit, een
      onherroepelijk besluit ter uitvoering van een wegaanpassingsbesluit als bedoeld in [artikel 7, eerste lid][ref1],
      of een onherroepelijk plan als bedoeld in [artikel 6, vijfde lid][ref2], schade lijdt of zal lijden, die
      redelijkerwijs niet of niet geheel te zijnen laste behoort te blijven, en ten aanzien waarvan de vergoeding niet
      of niet voldoende door aankoop, onteigening of op andere wijze is verzekerd, kent Onze Minister hem op zijn verzoek
      een naar billijkheid te bepalen schadevergoeding toe.


      [ref1]: https://wetten.overheid.nl/BWBR0015158#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0015158#Artikel6
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0015158
        artikel: '7'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0015158
        artikel: '6'
        hoofdstuk: '2'
  - number: '17.2'
    text: |-
      [Afdeling 6.1 van de Wet ruimtelijke ordening][ref1] blijft buiten toepassing voor zover de belanghebbende met
      betrekking tot de schade een beroep doet of kan doen op een schadevergoeding als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Afdeling6.1
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0020449
        afdeling: '6.1'
  - number: '17.3'
    text: Onze Minister kan nadere regels geven omtrent de indiening en afhandeling van een verzoek om schadevergoeding.
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel17
  - number: '19'
    text: |-
      Onze Minister zendt binnen drie jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel19
  - number: '21'
    text: |-
      Onder toepassing van [artikel 16 van de Tijdelijke referendumwet][ref1] treedt deze wet in werking met ingang van
      de dag na de datum van uitgifte van het Staatsblad waarin zij wordt geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel16
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0012701
        artikel: '16'
  - number: '22'
    text: 'Deze wet wordt aangehaald als: Spoedwet wegverbreding.'
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel22
