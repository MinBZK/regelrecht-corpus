  - number: '12'
    text: |-
      Het wegaanpassingsbesluit vervalt van rechtswege indien het niet binnen twee jaar na het tijdstip waarop het
      onherroepelijk is geworden in uitvoering is genomen.
    url: https://wetten.overheid.nl/BWBR0015158/2017-01-01#Artikel12
  - number: '13'
    text: |-
      In afwijking van [artikel 6:8 van de Algemene wet bestuursrecht][ref1] vangt de termijn voor het
      indienen van een beroepschrift tegen een wegaanpassingsbesluit en de besluiten ter uitvoering van een
      wegaanpassingsbesluit als bedoeld in [artikel 7, eerste lid][ref2], aan met ingang van de dag na die waarop de in
      [artikel 10, zevende lid][ref3], bedoelde bekendmaking is geschied.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0015158#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0015158#Artikel10
