preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het gelet op richtlijn 2009/20/EG van het Europees Parlement en de Raad
    van de Europese Unie van 23 april 2009 betreffende de verzekering van scheepseigenaren tegen maritieme vorderingen
    (PbEU L 131) noodzakelijk is om de verplichting in te voeren voor scheepseigenaren om een verzekering voor het
    schip te hebben en hiervan een verzekeringsbewijs aan boord van het schip te hebben;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0030651/2025-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *Onze Minister:* Onze Minister van Infrastructuur en Milieu;
        - *bruto-tonnage:* maateenheid waarin de totale inhoud van een schip, vastgesteld overeenkomstig het op 23 juni
      1969 te Londen totstandgekomen Verdrag betreffende de meting van schepen (Trb.  1970, 122) wordt uitgedrukt;
        - *scheepseigenaar:* geregistreerde eigenaar van een zeeschip of enig ander persoon die verantwoordelijk is voor de
      exploitatie van het schip;
        - *richtlijn:* [richtlijn 2009/20/EG](32009L0020) van het Europees Parlement en de Raad van de Europese Unie van
      23 april 2009 betreffende de verzekering van scheepseigenaren tegen maritieme vorderingen (PbEU L 131);
        - *Nederlands zeeschip:* een zeeschip dat op grond van voor Nederland geldende rechtsregels gerechtigd is de vlag
      van het Koninkrijk te voeren;
        - *buitenlands zeeschip:* een zeeschip dat geen Nederlands zeeschip is.
    url: https://wetten.overheid.nl/BWBR0030651/2025-07-01#Artikel1
  - number: '2'
    text: |-
      Deze wet is niet van toepassing op:

      a. zeeschepen met een bruto-tonnage van minder dan 300; en

      b. oorlogsschepen, marinehulpschepen of andere zeeschepen die eigendom zijn of geëxploiteerd worden door een Staat
      en voor niet-commerciële overheidsdoeleinden worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0030651/2025-07-01#Artikel2
  - number: '3'
    text: |-
      1 Een scheepseigenaar van een Nederlands zeeschip heeft ten aanzien van dit zeeschip een verzekering als bedoeld in
      artikel 3, aanhef, onder b, van de richtlijn.

      2 Een scheepseigenaar van een buitenlands zeeschip dat een Nederlandse haven aandoet heeft ten aanzien van dit
      zeeschip een verzekering als bedoeld in het eerste lid.

      3 De verzekering, bedoeld in het eerste en tweede lid, voldoet aan artikel 4, derde lid van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0030651/2025-07-01#Artikel3
  - number: '4'
    text: |-
      1 Een Nederlands zeeschip en een buitenlands zeeschip dat een Nederlandse haven aandoet tonen het bestaan van de in
      [artikel 3][ref1] bedoelde verzekering aan met een of meer door de verzekeringverstrekker afgegeven bewijzen van de
      verzekering, als bedoeld in artikel 3, eerste lid, die aan boord worden meegevoerd.

      2 Het verzekeringsbewijs bevat de informatie, bedoeld in artikel 6, tweede lid, van de richtlijn.

      3 Indien het verzekeringsbewijs is opgesteld in een andere taal dan de Engelse, Franse of Spaanse taal, bevat het
      een vertaling in een van deze talen.


      [ref1]: https://wetten.overheid.nl/BWBR0030651#Artikel3
    url: https://wetten.overheid.nl/BWBR0030651/2025-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0030651
        artikel: '3'
  - number: '5'
    text: |-
      Met het toezicht op de naleving van het bepaalde in [artikel 3, eerste lid][ref1], zijn belast de door Onze
      Minister aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0030651#Artikel3
    url: https://wetten.overheid.nl/BWBR0030651/2025-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0030651
        artikel: '3'
  - number: '8'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0030651/2025-07-01#Artikel8
  - number: '9'
    text: 'Deze wet wordt aangehaald als: Wet verzekering zeeschepen.'
    url: https://wetten.overheid.nl/BWBR0030651/2025-07-01#Artikel9
