preamble:
  text: |-
    Handelende in overeenstemming met de Staatssecretaris van Landbouw, Natuurbeheer en Visserij;

    Gelet op artikel 2, zevende lid, van de Destructiewet,

    Besluit
  url: https://wetten.overheid.nl/BWBR0011443/2002-04-14#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
            mogelijk met dioxine verontreinigd dierlijk afval:

              dierlijk afval mogelijk verontreinigd met dioxine door omstandigheden die hebben geleid tot beschikking
      1999/788/EG van de Commissie van de Europese Gemeenschappen van 3 december 1999 tot vaststelling van beschermende
      maatregelen met betrekking tot dioxineverontreiniging van bepaalde voor menselijke consumptie of vervoedering
      bestemde producten van varkens en van pluimvee (PbEG L 310);



            b

              [verordening 999/2001/EG](32001R0999):

              [verordening nr. 999/2001/EG](32001R0999) van het Europees Parlement en de Raad van 22 mei 2001, houdende
      vaststelling van voorschriften inzake preventie, bestrijding en uitroeiing van bepaalde overdraagbare spongiforme
      encefalopathieën.
    url: https://wetten.overheid.nl/BWBR0011443/2002-04-14#Artikel1
  - number: '2'
    text: |-
      1 Als gespecificeerd hoog-risico-materiaal als bedoeld in [artikel 2, zevende lid, van de Destructiewet][ref1]
      worden aangewezen:

      a. dierlijk afval dat mogelijk is verontreinigd met dioxine;

      b. hoog-risico-materiaal als bedoeld in [artikel 2, eerste lid, onderdelen a, b, c, d, e, f, h][ref2] en i van
      de wet;

      c. gespecificeerd risico-materiaal genoemd in bijlage XI, hoofdstuk A, punt 1, onder a, punt i en ii, van
      [verordening 999/2001/EG](32001R0999);

      d. alle delen van het kadaver van een dier als bedoeld in bijlage III, hoofdstuk A, onderdeel I, punt 6.4 van
      [verordening 999/2001/EG](32001R0999), met inbegrip van de huid;.

      e.

      f.

      g.

      h. dode honden en katten, voor zover niet onschadelijk gemaakt op een wijze als omschreven in artikel 30 van het
      Destructiebesluit;

      i.

      j. j. gestorven kweekvis;

      k. de thymus, milt en tonsillen van uit Frankrijk afkomstige in Nederland geslachte runderen, ongeacht hun
      leeftijd;.

      l.

      m. op één of meer door het gemeentebestuur aangewezen plaatsen bijeengebrachte vogels die vermoedelijk zijn
      gestorven ten gevolge van intoxicatie door Clostridium Botulinum;

      n. op één of meer door het gemeentebestuur aangewezen plaatsen bijeengebrachte vissen die vermoedelijk zijn
      gestorven ten gevolge van de vrieskou;

      o. kadavers van dierentuindieren, met uitzondering van dode dieren of delen van dode dieren die ter plekke aan
      dierentuinendieren ter vervoedering worden aangeboden en van die dode dieren of delen van dode dieren die voor
      educatieve doeleinden worden gebruikt;

      p. kadavers van circusdieren;

      q. kadavers van proefdieren;

      r. vlees, gehakt, vleesbereidingen of vleesproducten afkomstig van runderen die in het Verenigd Koninkrijk zijn
      geslacht en vóór 28 maart 1996 binnen Nederlands grondgebied zijn gebracht;

      s. overige dierlijke producten als bedoeld in artikel 11.2, onderdeel f, l, onderscheidenlijk m, van de Regeling
      keuring en handel dierlijke produkten afkomstig van runderen die in het Verenigd Koninkrijk zijn geslacht en in de
      periode tussen 23 en 28 maart 1996 binnen Nederlands grondgebied zijn gebracht.

      2 Het eerste lid, aanhef en onderdeel c, is niet van toepassing indien het in dat artikellid bedoelde materiaal:

      a. een product is dat is genoemd in artikel 1, eerste lid, onderdelen a tot en met c, van [verordening 999/2001/
      EG](32001R0999), mits met betrekking tot dat product niet in strijd wordt gehandeld met artikel 2 van [verordening
      999/2001/EG](32001R0999);

      b. afkomstig is van runderen, schapen en geiten, die geboren, ononderbroken gehouden en geslacht zijn in landen
      genoemd in de in bijlage XI, hoofdstuk A, punt 10, van [verordening 999/2001/EG](32001R0999) opgenomen landenlijst;

      c. de van runderen afkomstige wervelkolom, inclusief achterwortelganglia, voorzover deze ingevolge de artikelen
      2 en 3 van de Regeling uitvoer vers vlees en vleesbereidingen 1985 niet behoeft te worden verwijderd dan wel
      voorzover deze ingevolge artikel 14 van het Keuringsregulatief 1994 niet ongeschikt is verklaard voor menselijke
      consumptie.


