---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.2/schema.json
$id: organisatiebesluit_centrale_stafdiensten_organisatiebesluit_cs
regulatory_layer: WET
publication_date: '2005-02-22'
valid_from: '2004-09-01'
bwb_id: BWBR0015583
url: https://wetten.overheid.nl/BWBR0015583/2004-09-01
preamble:
  text: |-
    Gelet op artikel 4:2 van het Organisatiebesluit BZK 2003;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

        - ministerie: het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties;
        - minister: de Minister van Binnenlandse Zaken en Koninkrijksrelaties of de Minister voor Bestuurlijke Vernieuwing
      en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel1
  - number: '2'
    text: |-
      Dit besluit heeft betrekking op de Centrale Stafdiensten, genoemd in het [Organisatiebesluit BZK 2003][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015590
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015590
  - number: 3:1
    text: |-
      Het stafbureau Centrale Stafdiensten bestaat uit de volgende onderdelen:

        - de sector Personeelsadvies (P-advies);
        - de sector Financieel-Economische Aangelegenheden (FEA);
        - de sector Documentaire Informatievoorziening (DIV).
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel31
  - number: 3:2
    text: |-
      1 De sector Personeelsadvies staat onder leiding van een hoofd.

      2 De sector heeft tot taak het ondersteunen van de plaatsvervangend secretaris-generaal en de dienstonderdelen van
      de Centrale Stafdiensten, met uitzondering van de directie Constitutionele Zaken en Wetgeving, op het terrein van
      personele aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel32
  - number: 3:3
    text: |-
      1 De sector Financieel-Economische Aangelegenheden staat onder leiding van een hoofd.

      2 De sector heeft tot taak het ondersteunen van de plaatsvervangend secretaris-generaal en de dienstonderdelen van
      de Centrale Stafdiensten, met uitzondering van de directie Constitutionele Zaken en Wetgeving, op het terrein van
      financieel-economische aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel33
  - number: 3:4
    text: |-
      1 De sector Documentaire Informatievoorziening staat onder leiding van een hoofd.

      2 De sector heeft tot taak het ondersteunen van de plaatsvervangend secretaris-generaal en de dienstonderdelen van
      de Centrale Stafdiensten, met uitzondering van de directie Constitutionele Zaken en Wetgeving, op het terrein van
      documentaire informatievoorziening.
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel34
  - number: 4:1
    text: |-
      Het Bureau Secretaris-Generaal bestaat uit de volgende onderdelen:

        - de sector Administratie, Informatievoorziening en Beheersondersteuning (AIB);
        - de beleidssector Bureau Secretaris-Generaal (BSG);
        - de secretariaten van de Algemene Leiding en de kamerbewaarder;
        - de beveiligingsambtenaar (BVA);
        - het programmateam Strategische Kennisontwikkeling (SKO).
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel41
  - number: 4:2
    text: |-
      1 De sector Administratie, Informatievoorziening en Beheersondersteuning staat onder leiding van een hoofd.

      2 De sector heeft de volgende taken:

      a) het zorgdragen voor de administratie van het Bureau Secretaris-Generaal;

      b) de informatievoorziening binnen het Bureau Secretaris-Generaal;

      c) de beheers- en beleidsondersteuning van de Algemene Leiding.
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel42
  - number: 4:3
    text: |-
      De beleidssector Bureau Secretaris-Generaal heeft de volgende taken:

      a) de advisering en ondersteuning van de Algemene Leiding bij alle beleidsmatige onderwerpen;

      b) het voeren van secretariaten van de departementale overleggen;

      c) het zorgdragen voor de planning en de voortgangscontrole van de stukkenstroom;

      d) het zijn van aanspreekpunt voor alle parlementaire aangelegenheden;

      e) het vertegenwoordigen van de Algemene Leiding in overleggen.
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel43
  - number: 4:4
    text: |-
      De secretariaten van de Algemene Leiding en de kamerbewaarder hebben tot taak het ondersteunen van de Algemene
      Leiding bij de dagelijkse werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel44
  - number: 4:5
    text: |-
      1 De Beveiligingsambtenaar heeft de volgende taken:

      a) de beleidsmatige afstemming en coördinatie van de verschillende aspecten van de beveiliging;

      b) het toezicht op de uitvoering van de beveiliging;

      c) het verantwoordelijk zijn voor de beveiliging van staatsgeheimen;

      d) het fungeren als aanspreekpunt voor alle aspecten die samenhangen met vertrouwensfuncties en
      veiligheidsonderzoeken;

      e) het adviseren en ondersteunen bij de integrale beveiliging.

      2 Bovengenoemde taken of delen daarvan worden door de plaatsvervangend Beveiligingsambtenaar uitgeoefend voor zover
      hij hiermee door de Beveiligingsambtenaar is belast.
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel45
  - number: 4:6
    text: |-
      1 Het programmateam Strategische Kennisontwikkeling staat onder leiding van een hoofd.

      2 Het programmateam heeft tot taak de strategische kennisontwikkeling binnen het ministerie.
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel46
  - number: 5:1
    text: |-
      De directie Informatievoorziening bestaat uit de volgende onderdelen:

        - het Stafbureau (STB);
        - de afdeling Beleid, Advies en Control (BAC);
        - de afdeling Service- en Accountmanagement (SAM);
        - de afdeling IT-Ontwikkeling;
        - de afdeling Infrastructurele Diensten (ID);
        - de afdeling Informatievoorziening- en Bemiddeling (IVB).
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel51
  - number: 5:2
    text: |-
      1 Het Stafbureau staat onder leiding van een hoofd en een plaatsvervangend hoofd.

      2 Het Stafbureau heeft de volgende taken:

      a) het zorgdragen voor de secretariële en administratieve ondersteuning van de directie;

      b) het zorgdragen voor de interne bedrijfsvoering van de directie.
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel52
  - number: 5:3
    text: |-
      1 De afdeling Beleid, Advies en Control staat onder leiding van een hoofd en een plaatsvervangend hoofd.

      2 De afdeling heeft tot taak het voorbereiden en onderhouden van departementale (beleids)kaders met betrekking
      tot informatievoorziening.
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel53
  - number: 5:4
    text: |-
      1 De afdeling Service- en Accountmanagement staat onder leiding van een hoofd en een plaatsvervangend hoofd.

      2 De afdeling heeft tot taak het periodiek informeren van de klanten inzake de te leveren producten en diensten met
      betrekking tot informatievoorziening.
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel54
  - number: 5:5
    text: |-
      1 De afdeling IT-Ontwikkeling staat onder leiding van een hoofd en een plaatsvervangend hoofd.

      2 De afdeling heeft tot taak het volgen van de ontwikkelingen in het IT-aanbod en vanuit deze ontwikkelingen
      adviseren inzake de architectuur van de IT‑infrastructuur.
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel55
  - number: 5:6
    text: |-
      1 De afdeling Infrastructurele Diensten staat onder leiding van een hoofd en een plaatsvervangend hoofd.

      2 De afdeling bestaat uit de afdeling Helpdesk IT, de afdeling Technisch Beheer, de afdeling Centrale Postkamer, de
      afdeling Reproductie en Vormgeving en de afdeling Bibliotheek en Archief.

      3 De afdeling Infrastructurele Diensten heeft de volgende taken:

      a) uitvoeren van alle IT-helpdesk activiteiten, beantwoorden en oplossen van vragen inzake het gebruik van
      werkplek-, systeemapparatuur en toepassingsprogramma’s;

      b) het uitvoeren van beheerswerkzaamheden aan de IT-infrastructuur en de departementale netwerkstructuur;

      c) het behandelen van inkomende en uitgaande poststromen;

      d) het zorgdragen voor en adviseren over de reproductie van documenten voor het ministerie;

      e) het zorgdragen voor en adviseren over het ontwerpen en vormgeven van grafische producties voor het ministerie;

      f) het beheren van de leeszaal voor raadpleging en/of uitlening van publicaties en archiefbescheiden.
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel56
  - number: 5:7
    text: |-
      1 De afdeling Informatievoorziening en -Bemiddeling staat onder leiding van een hoofd en een plaatsvervangend
      hoofd.

      2 De afdeling heeft tot taak het selecteren van relevante bronnen uit het markt- en overheidsinformatieaanbod.
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel57
  - number: 6:1
    text: |-
      De directie Financieel-Economische Zaken bestaat uit de volgende onderdelen:

        - het stafbureau (STB);
        - de hoofdafdeling Financieel-Economisch en Begrotingsbeleid (FEB);
        - de hoofdafdeling Financiële Infrastructuur (FIS).
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel61
  - number: 6:2
    text: |-
      1 Het stafbureau staat onder leiding van een hoofd.

      2 Het stafbureau heeft de volgende taken:

      a) het zorgdragen voor de secretariële en administratieve ondersteuning van de directie;

      b) het zorgdragen voor de interne bedrijfsvoering van de directie.
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel62
  - number: 6:3
    text: |-
      1 De hoofdafdeling Financieel-Economisch en Begrotingsbeleid staat onder leiding van een hoofd.

      2 De hoofdafdeling bestaat uit de sectoren Begrotingszaken en drie controlsectoren.

      3 De hoofdafdeling heeft de volgende taken:

      a) de coördinatie van de begrotingscyclus en het opstellen van begrotingsstukken als bedoeld in de
      [Comptabiliteitswet][ref1];

      b) de financieel-economische beleidstoetsing en -advisering als bedoeld in het [Besluit taak FEZ][ref2];

      c) het uitvoering geven aan [artikel 3, zevende lid, van het Beheersbesluit KABGNA/KABGA 1998][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003075
      [ref2]: https://wetten.overheid.nl/BWBR0005333
      [ref3]: https://wetten.overheid.nl/BWBR0009743#Artikel3
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0003075
      - id: ref2
        bwb_id: BWBR0005333
      - id: ref3
        bwb_id: BWBR0009743
        artikel: '3'
  - number: 6:4
    text: |-
      1 De hoofdafdeling Financiële Infrastructuur staat onder leiding van een hoofd.

      2 De hoofdafdeling bestaat uit de afdelingen Coördinatie Financiële Administratie (CFA), Control Financieel
      Management (CFM) en Coördinatie Financiële Informatievoorziening (CFI).

      3 De hoofdafdeling heeft de volgende taken:

      a) de coördinatie van de met de begroting samenhangende administraties en het kasbeheer, bedoeld in de
      [Comptabiliteitswet][ref1];

      b) het stellen van regels, het houden van toezicht en het ontwikkelen van instrumenten ter waarborging van een
      ordelijk en controleerbaar financieel beheer als bedoeld in het [Besluit taak FEZ][ref2];

      c) het coördineren, ontwikkelen en beheren van begrotingsgerelateerde informatievoorziening en -systemen.


      [ref1]: https://wetten.overheid.nl/BWBR0003075
      [ref2]: https://wetten.overheid.nl/BWBR0005333
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0003075
      - id: ref2
        bwb_id: BWBR0005333
  - number: 7:1
    text: |-
      De directie Personeel en Organisatie bestaat uit de volgende onderdelen:

        - het directiesecretariaat;
        - de afdeling Planning, Control en Salarisadministratie (PCS);
        - de afdeling Personeelmanagementondersteuning (PMO);
        - de afdeling Juridische Managementondersteuning en Overlegzaken (JMO);
        - een aantal organisatie-adviesfuncties.
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel71
  - number: 7:2
    text: |-
      1 Het directiesecretariaat staat onder leiding van de directiesecretaris.

      2 Het directiesecretariaat heeft de volgende taken:

      a) het zorgdragen voor de secretariële en administratieve ondersteuning van de directie;

      b) het zorgdragen voor de interne bedrijfsvoering van de directie.
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel72
  - number: 7:3
    text: |-
      1 De afdeling Planning, Control en Salarisadministratie staat onder leiding van een hoofd en een plaatsvervangend
      hoofd.

      2 De afdeling heeft tot taak:

      a) het voeren van de departementale personeels- en salarisadministratie alsook voor de Hoge Colleges van Staat;

      b) het uitvoeren van de departementale controlfunctie op personeel terrein;

      c) het zorgdragen voor de interne kwaliteitscontrole en het faciliteren van de informatievoorziening van de
      directie;

      d) het uitoefenen van toezicht als bedoeld in [artikel 2 van het Beheersbesluit KABGA/KABGNA 1998][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009743#Artikel2
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0009743
        artikel: '2'
  - number: 7:4
    text: |-
      1 De afdeling Personeelmanagementondersteuning staat onder leiding van een hoofd en een plaatsvervangend hoofd.

      2 De afdeling heeft tot taak:

      a) de beleidsontwikkeling met betrekking tot het personeelsmanagement bij het ministerie;

      b) de organisatie van het opleidingsprogramma;

      c) de uitvoering van herplaatsingsadviestaken;

      d) de uitoefening van de centrale management-developmenttaak, waaronder het voeren van het secretariaat van het
      Centraal Loopbaanberaad.
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel74
  - number: 7:5
    text: |-
      1 De afdeling Juridische Managementondersteuning en Overlegzaken staat onder leiding van een hoofd en een
      plaatsvervangend hoofd.

      2 De afdeling heeft tot taak de departementsleiding en het management bij het ministerie te adviseren en te
      ondersteunen inzake aangelegenheden met betrekking tot arbeidsvoorwaarden, rechtspositie en inspraak.
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel75
  - number: 7:6
    text: |-
      1 De organisatieadviseurs staan onder leiding van de directeur Personeel en Organisatie.

      2 De organisatie-adviseurs hebben tot taak het adviseren en het ondersteunen van de departementsleiding en het
      management bij het ministerie inzake aangelegenheden met betrekking tot de organisatorische inrichting van het
      ministerie en functiewaardering.
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel76
  - number: 8:1
    text: |-
      De Auditdienst bestaat uit de volgende onderdelen:

        - het Bedrijfsbureau (BB);
        - de discipline Financial Audit (FA);
        - de discipline IT-audit (IT);
        - de discipline Operational Audit (OA).
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel81
  - number: 8:2
    text: |-
      1 Het Bedrijfsbureau staat onder leiding van een manager directiebureau, tevens directiesecretaris.

      2 Het bedrijfsbureau heeft de volgende taken:

      a) het zorgdragen voor de secretariële en administratieve ondersteuning van de directie;

      b) het zorgdragen voor de interne bedrijfsvoering van de directie;

      c) het beleidsmatig ondersteunen van de leiding van de directie.
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel82
  - number: 8:3
    text: |-
      1 De discipline Financial Audit is de verantwoordelijkheid van een tweetal auditmanagers.

      2 De discipline heeft de volgende taken:

      a) het verstrekken van mededelingen over de getrouwheid van financiële en andere verantwoordingen;

      b) onderzoek doen naar de kwaliteit van het (financiële) beheer, voor zover dit zijn weerslag vindt in deze
      verantwoordingen;

      c) het uitvoeren van reviews op grond van wettelijke bepalingen of andere afspraken;

      d) overige assurance services.
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel83
  - number: 8:4
    text: |-
      1 De discipline IT-audit is de verantwoordelijkheid van een auditmanager.

      2 De discipline heeft de volgende taken:

      a) het rapporteren en adviseren over de IT-informatiestrategie, IT-beheer, IT‑infrastructuren en
      informatiesystemen, zowel in ontwikkeling als in productie;

      b) het optreden als de onafhankelijke deskundige, bedoeld in het Voorschrift Informatiebeveiliging Rijksdienst;

      c) het op verzoek van derden verstrekken van mededelingen met betrekking tot opzet en bestaan van geautomatiseerde
      systemen.
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel84
  - number: 8:5
    text: |-
      1 De discipline Operational Audit is de verantwoordelijkheid van een auditmanager.

      2 De discipline heeft de volgende taken:

      a) het onderzoeken van en adviseren over de kwaliteit van de sturings- en beheersingsprocessen in samenhang met de
      primaire en ondersteunende processen (bedrijfsvoering);

      b) het ad hoc beoordelen en doorlichten;

      c) het uitvoeren van aspect-audits gericht op de naleving van centrale beheerskaders.
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel85
  - number: 9:1
    text: |-
      De directie Voorlichting en Communicatie bestaat uit de volgende onderdelen:

        - het stafbureau;
        - de afdeling Persvoorlichting, Protocol en Speeches (PPS);
        - de afdeling Communicatieadvies en -Uitvoering (CAU);
        - de afdeling Mediacluster (MC).
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel91
  - number: 9:2
    text: |-
      1 Het stafbureau staat onder leiding van een hoofd.

      2 De afdeling heeft tot taak:

      a) het verzorgen van de interne planning en voortgangsbewaking van de directie;

      b) het verzorgen van het financieel en personeel beheer;

      c) het geven van administratieve ondersteuning aan directieleiding en directie;

      d) het adviseren van de directie op beleidsmatig terrein.
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel92
  - number: 9:3
    text: |-
      1 De afdeling Persvoorlichting, Protocol en Speeches staat onder leiding van de plaatsvervangend directeur.

      2 De afdeling heeft tot taak:

      a) begeleiden en adviseren van de bewindslieden bij media optredens;

      b) begeleiding en vormgeving van de externe optredens van de bewindslieden;

      c) vormgeven van de speeches voor de bewindslieden en bij uitzondering voor de secretaris-generaal en directeuren-
      generaal.
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel93
  - number: 9:4
    text: |-
      1 De afdeling Communicatieadvies en -Uitvoering staat onder leiding van het afdelingshoofd.

      2 De afdeling heeft tot taak:

      a) het adviseren van beleidsafdelingen over de communicatieve aspecten in het gehele proces van beleidsontwikkeling
      tot en met beleidsuitvoering;

      b) verzorgen van de productiebegeleiding van voorlichtingsmiddelen;

      c) bewaken van de huisstijl.
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel94
  - number: 9:5
    text: |-
      1 De afdeling Mediacluster staat onder leiding van een hoofd.

      2 De afdeling heeft tot taak:

      a) verzorgen van de publieksvoorlichting over het aanvaarde beleid aan het brede publiek;

      b) redactie en beheer ten behoeve van het personeelsblad, de sites van het ministerie en bewindsliedensites op
      Internet, en intranet;

      c) het begeleiden van de dienstonderdelen van idee tot (sub)site.
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel95
  - number: 10:1
    text: |-
      De directie Facilitaire Zaken bestaat uit de volgende onderdelen:

        - het stafbureau (STB);
        - de afdeling Advies & Coördinatie (A&C);
        - de afdeling Dienstverlening (DV).
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel101
  - number: 10:2
    text: |-
      1 Het stafbureau staat onder leiding van een hoofd.

      2 Het stafbureau heeft de volgende taken:

      a) het zorgdragen voor de secretariële en administratieve ondersteuning van de directie;

      b) het zorgdragen voor de interne bedrijfsvoering van de directie.
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel102
  - number: 10:3
    text: |-
      1 De afdeling Advies & Coördinatie staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a) de advisering en coördinatie op het terrein van inkoop, huisvesting en veiligheid voor het gehele ministerie;

      b) het signaleren van ontwikkelingen in de markt op het facilitaire vlak;

      c) de controlfunctie op het terrein van inkoop, huisvesting en veiligheid.
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel103
  - number: 10:4
    text: |-
      1 De afdeling Dienstverlening staat onder leiding van een hoofd.

      2 De afdeling bestaat uit een bureau Front-/Backoffice, een bureau Veiligheid en een bureau Bedrijfshulpverlening
      (BHV).

      3 De afdeling Dienstverlening heeft de volgende taken:

      a) de registratie, planning, coördinatie, bewaking van de voortgang en (doen) uitvoeren van alle facilitaire
      producten en diensten;

      b) de advisering omtrent de facilitaire producten en diensten en het bijhouden van ontwikkelingen op het gebied van
      de dienstverlening;

      c) de uitvoering van het veiligheidsbeleid en de beveiligingstaken van de ministeries van Binnenlandse Zaken en
      Koninkrijksrelaties en Justitie, voor zover het de bij de kerndepartementen in gebruik zijnde panden betreft.
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel104
  - number: 11:1
    text: |-
      1 De directie bestaat uit de volgende onderdelen:

      a) de sector van de Juridisch adviseur, waaronder het secretariaat van de Kiesraad (JA);

      b) de sector Grondrechten (GR);

      c) de sector Staatsinrichting en Bestuursrecht (SB);

      d) de sector Statuut (ST).
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel111
  - number: 11:2
    text: |-
      1 De sector van de Juridisch adviseur, waaronder het secretariaat van de Kiesraad, staat onder leiding van een
      hoofd en een plaatsvervangend hoofd.

      2 De sector heeft tot taak:

      a) het behandelen van civielrechtelijke kwesties en andere juridische aangelegenheden;

      b) het zich richten op de constitutionele aspecten en de wetgevingsaangelegenheden op het terrein van het kiesrecht
      en de [Wet openbaarheid van bestuur][ref1];

      c) het adviseren over toepassing van de [Wet openbaarheid van bestuur][ref2], in het bijzonder indien afwijzing van
      openbaarheidsverzoeken wordt overwogen;

      d) het adviseren over toepassing van de Europese richtlijnen voor overheidsopdrachten;

      e) het verzorgen van het secretariaat van de Kiesraad als adviesorgaan en als centraal stembureau voor de
      verkiezingen van de Tweede Kamer, de Eerste Kamer en het Europees Parlement;

      f) het coördineren van de notificatie van regelgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
      [ref2]: https://wetten.overheid.nl/BWBR0005252
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0005252
      - id: ref2
        bwb_id: BWBR0005252
  - number: 11:3
    text: |-
      1 De sector Grondrechten staat onder leiding van een hoofd en een plaatsvervangend hoofd.

      2 De sector heeft tot taak zich te richten op de constitutionele aspecten en de wetgevingsaangelegenheden van het
      beleid op het terrein van de klassieke en sociale grondrechten en op dat van het overheidspersoneel.
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel113
  - number: 11:4
    text: |-
      1 De sector Staatsinrichting en Bestuursrecht staat onder leiding van een hoofd en een plaatsvervangend hoofd.

      2 De sector heeft tot taak zich te richten op de constitutionele aspecten en de wetgevingsaangelegenheden van het
      beleid op het terrein van:

      a) regering en parlement, inclusief de overheidsorganisatie en het behandelen van algemene wetgevingsvraagstukken;

      b) internationale betrekkingen, inclusief de voorbereiding en uitvoering van Europese regelgeving voor zover dit
      niet tot de taken van de Juridisch adviseur behoort;

      c) defensie;

      d) belastingen;

      e) begroting;

      f) Hoge Colleges van Staat;

      g) rechtsbescherming, inclusief het klachtrecht;

      h) openbare orde en veiligheid;

      i) noodwetgeving;

      j) het algemeen bestuursrecht.
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel114
  - number: 11:5
    text: |-
      1 De sector Statuut staat onder leiding van een hoofd.

      2 De sector heeft tot taak zich te richten op de constitutionele aspecten en de wetgevingsaangelegenheden van het
      beleid op het terrein van de staatkundige verhoudingen in het Koninkrijk, met inbegrip van het functioneren als
      eerste aanspreekpunt voor juridische zaken van de Kabinetten van de Gouverneur en de Vertegenwoordigingen in de
      Nederlandse Antillen en Aruba.
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel115
  - number: 12:1
    text: |-
      [Artikel 3:12 van het organisatiebesluit BZK 2003][ref1] is van toepassing.


