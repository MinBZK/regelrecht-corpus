  - number: '14'
    text: |-
      Tot de taak van de in dit besluit genoemde dienstonderdelen behoort voorts de uitvoering van andere taken dan
      vermeld, in opdracht van een minister, de secretaris-generaal of de plaatsvervangend secretaris-generaal, voor
      zover hogere wet- en regelgeving zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel14
  - number: 15:1
    text: |-
      1 De plaatsvervangend secretaris-generaal is verantwoordelijk voor het beheer en de terinzagelegging van dit
      besluit.

      2 Het beheer geschiedt met inachtneming van de desbetreffende (richtlijnen inzake) administratieve
      organisatiebeschrijvingen.
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel151
  - number: 15:2
    text: |-
      Wijziging van dit besluit is voorbehouden aan de secretaris-generaal en geschiedt op voordracht van de
      plaatsvervangend secretaris-generaal, na advisering door de directeur Personeel en Organisatie.
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel152
  - number: 16:1
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na plaatsing van dit besluit in de Staatscourant en
      werkt terug tot en met 1 september 2003.
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel161
  - number: 16:2
    text: 'Dit besluit wordt aangehaald als: Organisatiebesluit Centrale Stafdiensten (Organisatiebesluit CS).'
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel162
  - number: 16:3
    text: Het Organisatiebesluit CS van 25 januari 2002 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0015583/2004-09-01#Artikel163
