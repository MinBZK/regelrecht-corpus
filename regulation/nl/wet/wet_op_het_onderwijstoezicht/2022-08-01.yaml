  - number: '2.1'
    text: |-
      Er is een Inspectie van het onderwijs, die onder Onze Minister van Onderwijs, Cultuur en Wetenschap ressorteert.
      Aan het hoofd van de inspectie staat de inspecteur-generaal.
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel2
  - number: '2.2'
    text: |-
      Onze Minister geeft met betrekking tot de uitoefening van de in deze wet aan de inspectie toegekende bevoegdheden
      uitsluitend in schriftelijke vorm zijn aanwijzingen, onder mededeling daarvan aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel2
  - number: '3.1'
    text: 'De inspectie heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel3
  - number: 3.1.a
    text: 'het toezien op:'
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel3
  - number: 3.1.a.1°
    text: de naleving van de bij of krachtens een onderwijswet gegeven voorschriften,
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel3
  - number: 3.1.a.2°
    text: |-
      de naleving van de bij of krachtens de [Wet kinderopvang][ref1] gegeven voorschriften, voor zover het betreft de
      voorschoolse educatie op kindercentra,


      [ref1]: https://wetten.overheid.nl/BWBR0017017
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0017017
  - number: 3.1.b
    text: 'het bevorderen van:'
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel3
  - number: 3.1.b.1°
    text: |-
      de ontwikkeling, in het bijzonder van de kwaliteit, van het onderwijs aan en het
      bestuur van instellingen als bedoeld in de onderwijswetten met uitzondering van de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] voor zover het niet betreft het onderzoek bedoeld
      in [artikel 12a, derde lid][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel12a
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005682
      - id: ref2
        bwb_id: BWBR0013800
        artikel: 12a
        hoofdstuk: '3'
  - number: 3.1.b.2°
    text: de kwaliteit van de uitoefening van de taken van de samenwerkingsverbanden,
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel3
  - number: 3.1.b.3°
    text: de kwaliteit van de uitoefening van de taken van de Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven, en
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel3
  - number: 3.1.b.4°
    text: |-
      de ontwikkeling, in het bijzonder van de kwaliteit, van het stelsel van
      hoger onderwijs, met inbegrip van het stelsel van accreditatie, bedoeld in
      [hoofdstuk 5 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005682
        hoofdstuk: '5'
  - number: 3.1.c
    text: |-
      het toezien op en bevorderen van de financiële rechtmatigheid door in ieder geval het verrichten van onderzoek
      naar de rechtmatige verkrijging van de bekostiging, naar de controlerapporten van de door het bestuur aangewezen
      accountant, naar de rechtmatigheid van de bestedingen en naar de rechtmatigheid van het financieel beheer, alsmede
      het toezien op en bevorderen van de financiële doelmatigheid en de financiële continuïteit van de bekostigde
      instellingen, de samenwerkingsverbanden en de Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven,
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel3
  - number: 3.1.d
    text: |-
      het rapporteren over de ontwikkeling van, in bijzonder van de kwaliteit van, het onderwijs en over de uitoefening
      van de taken door de instellingen, de samenwerkingsverbanden en de Samenwerkingsorganisatie beroepsonderwijs
      bedrijfsleven, in het bijzonder over de kwaliteit daarvan, en
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel3
  - number: 3.1.e
    text: het verrichten van andere bij of krachtens de wet aan de inspectie opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel3
  - number: '3.2'
    text: 'Onze Minister kan de inspectie mandaat verlenen om:'
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel3
