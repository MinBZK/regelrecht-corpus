  - number: 11b.2
    text: 'De inspectie oefent toezicht uit door middel van het opstellen van een risicoanalyse indien:'
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel11b
  - number: 11b.2.a
    text: de gegevens, bedoeld in het eerste lid, niet binnen de genoemde termijn zijn verstrekt,
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel11b
  - number: 11b.2.b
    text: de inspectie onvolkomenheden constateert in de naleving van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel11b
  - number: 11b.3
    text: |-
      Bij het opstellen van de risicoanalyse worden de onderwerpen, genoemd in het eerste lid, onderdelen a tot en met
      d, betrokken.
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel11b
  - number: 11b.4
    text: De risicoanalyse wordt binnen drie maanden nadat de bekostiging is aangevangen door de inspectie opgesteld.
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel11b
  - number: 11b.5
    text: |-
      Binnen een maand nadat de risicoanalyse is opgesteld toont de instelling ten genoegen van de inspectie aan dat de
      onvolkomenheden, bedoeld in het tweede lid, onderdeel b, zijn hersteld.
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel11b
  - number: 11b.6
    text: |-
      Indien de instelling twee maanden na het opstellen van de risicoanalyse nog steeds in gebreke is ten aanzien van
      de naleving van het eerste lid, onderdelen a tot en met d, kunnen de maatregelen worden genomen die door de in het
      eerste lid, aanhef, genoemde onderwijswetten worden mogelijk gemaakt.
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel11b
  - number: 11b.7
    text: |-
      Nadat het bevoegd gezag van een niet uit de openbare kas bekostigde bijzondere school overeenkomstig
      [artikel 5 van de Wet op het primair onderwijs][ref1], [artikel 5 van de Wet primair onderwijs BES][ref2] of
      [artikel 3.27 van de Wet voortgezet onderwijs 2020][ref3] aan Onze Minister kennis heeft gegeven van de oprichting
      van de school, besluit de inspectie zo spoedig mogelijk na de aanvang van het onderwijs of deze onderwijsvoorziening
      een school is als bedoeld in [artikel 1, onderdeel b, subonderdeel 3, van de Leerplichtwet 1969][ref4] of
      [artikel 1, onderdeel b, subonderdeel 3, van de Leerplichtwet BES][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0044212#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0002628#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0030281#Artikel1
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '5'
      - id: ref3
