  - number: 3.2.e
    text: |-
      de bestuurlijke boete op te leggen, bedoeld in
      [artikel 27 van de Leerplichtwet 1969][ref1], [artikel 39 van de Leerplichtwet BES][ref2] of
      [artikel 15.7 tot en met 15.9 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref3]; of


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0030281#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel15
