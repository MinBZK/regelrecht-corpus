        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '21'
        hoofdstuk: '5'
  - number: 15a
    text: Dit hoofdstuk is van toepassing op het toezicht op de uitoefening van de taken van het samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel15a
  - number: 15b
    text: |-
      [Artikel 4][ref1] en [artikel 8, eerste tot en met derde lid][ref2], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel8
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '8'
        hoofdstuk: '2'
  - number: 15c.1
    text: |-
      [Artikel 11][ref1] is van overeenkomstige toepassing, met dien verstande dat de inspectie het onderzoek tevens
      verricht aan de hand van de volgende indicatoren:


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel11
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '11'
        hoofdstuk: '3'
  - number: 15c.1.a
    text: |-
      het al dan niet voldoen aan de wettelijke voorschriften met betrekking tot het
      ondersteuningsplan, bedoeld in [artikel 18a van de Wet op het primair onderwijs][ref1] en
      [artikel 2.47 van de Wet voortgezet onderwijs 2020][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 18a
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 15c.1.b
    text: |-
      het aantal leerplichtige jongeren wonend in het gebied van het samenwerkingsverband dat niet is ingeschreven bij
      een school als bedoeld in de [Leerplichtwet 1969][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0002628
  - number: 15c.1.c
    text: |-
      het aantal leerplichtige leerlingen van scholen in het samenwerkingsverband dat het onderwijs aan de school waaraan
      hij is ingeschreven gedurende een aaneengesloten periode van ten minste vier weken zonder geldige reden niet meer
      volgt, en
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel15c
  - number: 15c.1.d
    text: |-
      de wijze waarop een samenwerkingsverband zorg draagt voor de kwaliteit van het onderwijs aan een orthopedagogisch-
      didactisch centrum als bedoeld in [artikel 18a, lid 10a, van de Wet op het primair onderwijs][ref1] en
      [artikel 2.47, twaalfde lid, van de Wet voortgezet onderwijs 2020][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 18a
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 15c.2
    text: |-
      De [artikelen 12][ref1], [13][ref2], [14][ref3] en [15][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0013800#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0013800#Artikel15
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '12'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '13'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0013800
        artikel: '14'
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0013800
        artikel: '15'
        hoofdstuk: '3'
  - number: 15d
    text: |-
      De [artikelen 20, eerste tot en met vijfde lid][ref1], en [21][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel21
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel15d
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '20'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '21'
        hoofdstuk: '5'
  - number: 15e
    text: |-
      Dit hoofdstuk is van toepassing op het College voor toetsen en examens, genoemd in
      [artikel 2, eerste lid, van de Wet College voor toetsen en examens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel15e
    references:
      - id: ref1
        bwb_id: BWBR0025364
        artikel: '2'
  - number: 15f.1
    text: |-
      De inspectie houdt toezicht op de kwaliteit van het functioneren van het College voor toetsen en
      examens en op de naleving van de bij of krachtens de [Wet College voor toetsen en examens][ref1] en de
      [Wet voortgezet onderwijs 2020][ref2] gegeven voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0025364
      [ref2]: https://wetten.overheid.nl/BWBR0044212
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel15f
    references:
      - id: ref1
        bwb_id: BWBR0025364
      - id: ref2
        bwb_id: BWBR0044212
  - number: 15f.2
    text: |-
      Ter uitvoering van de taak, bedoeld in het eerste lid, kan de inspectie Onze Minister onder meer voorstellen een
      voorziening te treffen als bedoeld in [artikel 23 van de Kaderwet zelfstandige bestuursorganen][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel23
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel15f
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '23'
  - number: 15f.2.a
    text: |-
      is gebleken dat de kwaliteit van het functioneren van het College voor toetsen en examens onvoldoende is geweest,
      of
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel15f
  - number: 15f.2.b
    text: |-
      niet of niet meer wordt voldaan aan hetgeen bij of krachtens de [Wet College voor toetsen en examens][ref1] is
      bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0025364
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel15f
    references:
      - id: ref1
        bwb_id: BWBR0025364
  - number: 15g
    text: |-
      Dit hoofdstuk is van toepassing op het toezicht op de kwaliteitsvoorwaarden voor voorschoolse educatie in
      kindercentra, bedoeld in de bij of krachtens de [Wet kinderopvang][ref1] vastgestelde bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0017017
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel15g
    references:
      - id: ref1
        bwb_id: BWBR0017017
  - number: 15h.1
    text: |-
      De [artikelen 4, tweede lid][ref1], [7][ref2], [8, eerste en derde lid][ref3], en [9][ref4] zijn van
      overeenkomstige toepassing, met dien verstande dat in artikel 4, tweede lid, onder «instellingen» wordt verstaan
      «kindercentra als bedoeld in [artikel 1.1, eerste lid, van de Wet kinderopvang][ref5]» en dat in artikel 9,
      eerste lid, onder «het toezicht op de naleving van bij of krachtens een onderwijswet gegeven voorschriften»
      wordt verstaan: het toezicht op de naleving van de bij of krachtens een onderwijswet of de bij of krachtens de
      [Wet kinderopvang][ref6] gegeven voorschriften omtrent de kwaliteit van voorschoolse educatie.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0013800#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0013800#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref6]: https://wetten.overheid.nl/BWBR0017017
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel15h
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '7'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0013800
        artikel: '8'
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0013800
        artikel: '9'
        hoofdstuk: '2'
      - id: ref5
        bwb_id: BWBR0017017
        artikel: '1'
      - id: ref6
        bwb_id: BWBR0017017
  - number: 15h.2
    text: |-
      De inspectie houdt toezicht op de naleving van de afspraken onderwijsachterstandenbeleid, bedoeld in
      [artikel 160 van de Wet op het primair onderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel160
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel15h
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '160'
  - number: 15i.1
    text: |-
      De inspectie verricht het onderzoek, bedoeld in [artikel 15h, eerste lid][ref1], aan de hand van de
      kwaliteitsvoorwaarden van de voorschoolse educatie in kindercentra, bedoeld in de bij of krachtens de
      [Wet kinderopvang][ref2] vastgestelde bepalingen, te weten:


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel15h
      [ref2]: https://wetten.overheid.nl/BWBR0017017
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel15i
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 15h
        hoofdstuk: 3c
      - id: ref2
        bwb_id: BWBR0017017
  - number: 15i.1.a
    text: de basisvoorwaarden voor voorschoolse educatie,
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel15i
  - number: 15i.1.b
    text: het informeren van ouders en ouderbetrokkenheid,
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel15i
  - number: 15i.1.c
    text: de kwaliteit van de educatie,
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel15i
  - number: 15i.1.d
    text: ontwikkeling, zorg en begeleiding van de kinderen,
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel15i
  - number: 15i.1.e
    text: kwaliteitszorg,
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel15i
  - number: 15i.1.f
    text: de doorgaande lijn tussen voor- en vroegschoolse educatie.
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel15i
  - number: 15i.2
    text: |-
      De inspectie rapporteert over de bevindingen van het toezicht aan de houder van een kindercentrum en aan het
      college van burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel15i
  - number: 15i.3
    text: |-
      Naast het onderzoek, bedoeld in het eerste lid, kan de inspectie uit eigen beweging incidenteel onderzoek
      verrichten naar de kwaliteit van de voorschoolse educatie in kindercentra, bedoeld in de bij of krachtens de
      [Wet kinderopvang][ref1] vastgestelde bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0017017
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel15i
    references:
      - id: ref1
        bwb_id: BWBR0017017
  - number: 15i.4
    text: |-
      [Artikel 13][ref1] is van overeenkomstige toepassing, met dien verstande dat onder «andere betrokkenen»
      in ieder geval wordt verstaan: vertegenwoordigers van houders van kindercentra als bedoeld in
      [artikel 1.1 van de Wet kinderopvang][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel15i
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '13'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '1'
  - number: 15i.5
    text: |-
      De inspectie verricht het onderzoek, bedoeld in [artikel 15h, tweede lid][ref1], op verzoek van het college
      van burgemeester en wethouders van de betrokken gemeente of op verzoek van Onze Minister. Het college van
      burgemeester en wethouders dient een dergelijk verzoek in op eigen initiatief of als een partij als bedoeld in
      [artikel 160, tweede lid, van de Wet op het primair onderwijs][ref2] aan het college hierom verzoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel15h
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel160
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel15i
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 15h
        hoofdstuk: 3c
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '160'
  - number: 15j
    text: |-
      De [artikelen 20, eerste tot en met vijfde lid][ref1], [21][ref2], [22][ref3] en [23][ref4] zijn van
      overeenkomstige toepassing, met dien verstande dat in artikel 20, tweede lid, onder «een bij of krachtens
      een onderwijswet gegeven voorschrift» wordt verstaan «een bij of krachtens een onderwijswet of een bij of
      krachtens de Wet kinderopvang gegeven voorschrift omtrent de kwaliteit van voorschoolse educatie» en dat in het
      derde en vierde lid onder «het bestuur» moet worden verstaan: de houder van een kindercentrum als bedoeld in
      [artikel 1.1 van de Wet kinderopvang][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0013800#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0013800#Artikel23
      [ref5]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel15j
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '20'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '21'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0013800
        artikel: '22'
        hoofdstuk: '6'
      - id: ref4
        bwb_id: BWBR0013800
        artikel: '23'
        hoofdstuk: '6'
      - id: ref5
        bwb_id: BWBR0017017
        artikel: '1'
  - number: 15k.1
    text: |-
      Indien de inspectie oordeelt dat de kwaliteit van de voorschoolse educatie in kindercentra als bedoeld in de bij
      of krachtens de [Wet kinderopvang][ref1] vastgestelde bepalingen, tekortschiet, informeert zij het college van
      burgemeester en wethouders van de desbetreffende gemeente en doet voorstellen over te treffen maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0017017
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel15k
    references:
      - id: ref1
        bwb_id: BWBR0017017
  - number: 15k.2
    text: |-
      De inspectie stelt de houder van het betreffende kindercentrum in kennis van haar voorstellen aan het college van
      burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel15k
  - number: 15l
    text: |-
      Dit hoofdstuk is van toepassing op het toezicht op de uitoefening van de taken van de Samenwerkingsorganisatie
      beroepsonderwijs bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel15l
  - number: 15m
    text: |-
      De [artikelen 4][ref1], [artikel 8, eerste tot en met derde lid,][ref2] en [9][ref3] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0013800#Artikel9
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel15m
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '8'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0013800
        artikel: '9'
        hoofdstuk: '2'
  - number: 15n.1
    text: |-
      Ter uitvoering van de in [artikel 3, eerste lid][ref1], bedoelde taken, onderzoekt de inspectie jaarlijks
      de kwaliteit van de uitoefening van de wettelijke taken door de Samenwerkingsorganisatie beroepsonderwijs
      bedrijfsleven, bedoeld in de [artikelen 1.5.1 van de Wet educatie en beroepsonderwijs][ref2] en
      [2.107 van de Wet voortgezet onderwijs 2020][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel15n
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 15n.2
    text: |-
      Indien de inspectie naar aanleiding van het onderzoek, bedoeld in het eerste lid, oordeelt dat de kwaliteit
      tekortschiet, verricht zij na een door haar aangegeven termijn onderzoek naar de verbeteringen die de
      Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven heeft gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel15n
  - number: 15n.3
    text: |-
      De inspectie stelt het bestuur in kennis van de datum en het doel van het onderzoek, bedoeld in het eerste of
      tweede lid. Kennisgeving geschiedt ten minste vier weken voor aanvang van een onderzoek. Indien de inspectie dit
      nodig oordeelt, verricht zij onderzoek zonder deze kennisgeving.
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel15n
  - number: 15n.4
    text: |-
      Bij de uitvoering van een onderzoek als bedoeld in het eerste of tweede lid, kan de inspectie onafhankelijke
      deskundigen betrekken.
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel15n
  - number: 15n.5
    text: |-
      De [artikelen 12][ref1], [13][ref2], [14][ref3] en [15][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0013800#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0013800#Artikel15
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel15n
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '12'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '13'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0013800
        artikel: '14'
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0013800
        artikel: '15'
        hoofdstuk: '3'
  - number: 15o
    text: |-
      De inspectie houdt toezicht op de naleving van bij of krachtens een onderwijswet gegeven voorschriften die
      zich uitsluitend of mede richten tot natuurlijke personen of rechtspersonen die geen instelling zijn en waarvan
      overtreding kan leiden tot een bestuurlijke boete.
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel15o
  - number: '20.1'
    text: |-
      De inspectie legt haar oordelen en bevindingen naar aanleiding van een onderzoek als bedoeld in [artikel 11][ref1],
      dan wel [artikel 12a][ref2], vast in een inspectierapport. In het inspectierapport wordt onderscheid aangebracht
      tussen oordelen op grond van de in [artikel 3, eerste lid, onderdeel a][ref3], bedoelde taak en bevindingen op
      grond van de in artikel, eerste lid, onderdeel b, bedoelde taak.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel12a
      [ref3]: https://wetten.overheid.nl/BWBR0013800#Artikel3
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '11'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: 12a
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0013800
        artikel: '3'
        hoofdstuk: '2'
  - number: '20.2'
    text: |-
      De inspectie vermeldt ten aanzien van de in [artikel 3, eerste lid, onderdeel a][ref1], bedoelde taak, op welke bij
      of krachtens een onderwijswet gegeven voorschriften haar oordeel betrekking heeft. Indien de inspectie oordeelt dat
      een bij of krachtens een onderwijswet gegeven voorschrift niet is nageleefd, vermeldt zij dit in het rapport.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel3
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '3'
        hoofdstuk: '2'
  - number: '20.3'
    text: |-
      Alvorens een rapport vast te stellen, stelt de inspectie het bestuur in de gelegenheid van het ontwerp-rapport
      kennis te nemen en daarover overleg te voeren.
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel20
  - number: '20.4'
    text: |-
      Indien in het overleg geen overeenstemming is bereikt over door het bestuur gewenste wijzigingen van het ontwerp-
      rapport, wordt de zienswijze van het bestuur in een bijlage bij het inspectierapport opgenomen.
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel20
  - number: '20.5'
    text: De inspectie zendt het inspectierapport na vaststelling daarvan onverwijld aan het bestuur.
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel20
  - number: '20.6'
    text: |-
      Het inspectierapport waarin de inspectie tot het oordeel komt dat de kwaliteit van het onderwijs of de opleiding
      zeer zwak is, als bedoeld in [artikel 10a, eerste of vierde lid, van de Wet op het primair onderwijs][ref1],
      [artikel 19a van de Wet op de expertisecentra][ref2], __REF002_____________________________________________________
      __________________, en de [artikelen 6.1.4b][ref4] en [6.2.2a van de Wet educatie en beroepsonderwijs][ref5] geldt
      na vaststelling als een besluit in de zin van de [Algemene wet bestuursrecht][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel19a
      [ref3]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 10a
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 19a
      - id: ref3
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '6'
      - id: ref5
        bwb_id: BWBR0007625
        artikel: '6'
      - id: ref6
        bwb_id: BWBR0005537
  - number: '21.1'
    text: De inspectie maakt een inspectierapport in de vijfde week na vaststelling daarvan openbaar.
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel21
  - number: '21.2'
    text: |-
      Indien voor de vijfde week na vaststelling van het inspectierapport, bedoeld in [artikel 20, zesde lid][ref1],
      wordt verzocht om een voorlopige voorziening als bedoeld in [artikel 8:81 van de Algemene wet bestuursrecht][ref2],
      wordt de openbaarmaking opgeschort totdat de voorzieningenrechter een uitspraak heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '20'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '21.3'
    text: |-
      Tevens verstrekt de inspectie een inspectierapport op verzoek. De inspectie kan een vergoeding van kosten vragen
      overeenkomstig een door haar vast te stellen tarief voor de afgifte van een inspectierapport.
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel21
  - number: '21.4'
    text: |-
      De inspectie verstrekt een inspectierapport niet eerder dan nadat het op grond van het eerste lid openbaar is
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel21
  - number: '22'
    text: De inspectie draagt zorg voor een verantwoorde taakuitoefening.
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel22
  - number: '23.1'
    text: |-
      Er is een klachtadviescommissie belast met de behandeling van en advisering over klachten
      over gedragingen van de inspectie. Op de behandeling van en advisering over klachten is de in
      [afdeling 9.1.3 van de Algemene wet bestuursrecht][ref1] geregelde procedure van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling9.1.3
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 9.1.3
  - number: '23.2'
    text: |-
      De klachtadviescommissie bestaat uit ten minste drie leden, die worden benoemd en ontslagen door Onze Minister van
      Onderwijs, Cultuur en Wetenschap. De leden maken geen deel uit van en zijn niet werkzaam onder verantwoordelijkheid
      van de inspectie. De leden kiezen uit hun midden een voorzitter. De benoeming geschiedt voor de tijd van ten
      hoogste vier jaar. Herbenoeming kan tweemaal en telkens voor ten hoogste vier jaar plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel23
  - number: '23.3'
    text: |-
      De voorzitter en leden zijn afzonderlijk of gezamenlijk deskundig op het gebied van onderwijs, in het bijzonder op
      het gebied van de vrijheid van richting en inrichting, toezicht en klachtbehandeling.
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel23
  - number: '23.4'
    text: De klachtadviescommissie bepaalt haar eigen werkwijze.
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel23
  - number: '24.1'
    text: |-
      Er is een Raad van advies inzake de inspectie die tot taak heeft de inspectie bij te staan in de waarborging
      van een zorgvuldige en professionele uitoefening van het toezicht. De raad adviseert de inspecteur-generaal
      onderscheidenlijk het hoofd inspectie gevraagd en ongevraagd over de kwaliteit van de uitoefening van het toezicht,
      in het bijzonder over de uitvoering van de [artikelen 13][ref1] en [22][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel22
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '13'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '22'
        hoofdstuk: '6'
  - number: '24.2'
    text: |-
      De raad bestaat uit ten minste drie leden, die worden benoemd en ontslagen door Onze Minister van Onderwijs,
      Cultuur en Wetenschap. De benoeming geschiedt voor de tijd van ten hoogste vier jaar. De leden kiezen uit hun
      midden een voorzitter.
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel24
  - number: '24.3'
    text: |-
      De voorzitter en leden zijn afzonderlijk of gezamenlijk deskundig op het gebied van onderwijs, kwaliteitszorg en
      toezicht.
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel24
  - number: '24.4'
    text: De raad bepaalt zijn eigen werkwijze.
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel24
  - number: '33'
    text: a. b. c. d. c.
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel33
  - number: '34'
    text: |-
      Onze Minister zendt binnen vijf jaar na inwerkingtreding van [paragraaf 4 van hoofdstuk 6a][ref1] van deze wet aan
      de Staten-Generaal een verslag over de realisatie van de volgende doelstellingen van het register vrijstellingen en
      vervangende leerplicht:


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Hoofdstuk6a
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0013800
        hoofdstuk: 6a
        paragraaf: '4'
  - number: 34.a
    text: |-
      verbetering van de handhaving van de [Leerplichtwet 1969][ref1] door de leerplichtambtenaar;


      [ref1]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002628
  - number: 34.b
    text: verbetering van de registratie van het aantal voortijdig schoolverlaters;
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel34
  - number: 34.c
    text: uniformering van de registratie van de vrijstellingen en vervangende leerplicht.
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel34
  - number: '35'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel35
  - number: '36'
    text: 'Deze wet wordt aangehaald als: Wet op het onderwijstoezicht.'
    url: https://wetten.overheid.nl/BWBR0013800/2022-08-01#Artikel36
