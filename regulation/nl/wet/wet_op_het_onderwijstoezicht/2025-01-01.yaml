  - number: 11b
    text: |-
      1 Binnen een maand na aanvang van de bekostiging van een instelling, bedoeld in
      [artikel 75, vierde of vijfde lid, van de Wet op het primair onderwijs][ref1],
      [artikel 75, vierde lid, van de Wet primair onderwijs BES][ref2],
      [artikel 87 van de Wet op de expertisecentra][ref3] en [artikel 4.7 van de Wet voortgezet onderwijs 2020][ref4],
      verstrekt de instelling aan de inspectie gegevens met betrekking tot:

      a. het schoolplan, bedoeld in [artikel 12 van de Wet op het primair onderwijs][ref5],
      [artikel 15 van de Wet primair onderwijs BES][ref6], [artikel 21 van de Wet op de expertisecentra][ref7] en
      [artikel 2.88 van de Wet voortgezet onderwijs 2020][ref8],

      b. de bekwaamheid van degenen die onderwijs geven, bedoeld in [artikel 3 van de Wet op het primair onderwijs][ref9],
      [artikel 3 van de Wet primair onderwijs BES][ref10], [artikel 3 van de Wet op de expertisecentra][ref11] en
      [artikel 7.11 van de Wet voortgezet onderwijs 2020][ref12],

      c. het voldoen aan de voorschriften omtrent onderwijstijd die gelden op grond van de
      [Wet op het primair onderwijs][ref13], de [Wet primair onderwijs BES][ref14], de [Wet op de expertisecentra][ref15]
      en de [Wet voortgezet onderwijs 2020][ref16], en

      d. het voldoen aan de voorschriften omtrent de scheiding van toezicht en bestuur, de inrichting en
      de inhoud van het intern toezicht die gelden op grond van de [Wet op het primair onderwijs][ref17],
      de [Wet primair onderwijs BES][ref18], de [Wet op de expertisecentra][ref19] en de
      [Wet voortgezet onderwijs 2020][ref20].

      2 De inspectie oefent toezicht uit door middel van het opstellen van een risicoanalyse indien:

      a. de gegevens, bedoeld in het eerste lid, niet binnen de genoemde termijn zijn verstrekt,

      b. de inspectie onvolkomenheden constateert in de naleving van het eerste lid.

      3 Bij het opstellen van de risicoanalyse worden de onderwerpen, genoemd in het eerste lid, onderdelen a tot en met
      d, betrokken.

      4 De risicoanalyse wordt binnen drie maanden nadat de bekostiging is aangevangen door de inspectie opgesteld.

      5 Binnen een maand nadat de risicoanalyse is opgesteld toont de instelling ten genoegen van de inspectie aan dat de
      onvolkomenheden, bedoeld in het tweede lid, onderdeel b, zijn hersteld.

      6 Indien de instelling twee maanden na het opstellen van de risicoanalyse nog steeds in gebreke is ten aanzien van
      de naleving van het eerste lid, onderdelen a tot en met d, kunnen de maatregelen worden genomen die door de in het
      eerste lid, aanhef, genoemde onderwijswetten worden mogelijk gemaakt.

      7 Nadat het bevoegd gezag van een niet uit de openbare kas bekostigde bijzondere school overeenkomstig
      [artikel 5 van de Wet op het primair onderwijs][ref21], [artikel 5 van de Wet primair onderwijs BES][ref22] of
      [artikel 3.27 van de Wet voortgezet onderwijs 2020][ref23] aan Onze Minister kennis heeft gegeven van de oprichting
      van de school, besluit de inspectie zo spoedig mogelijk na de aanvang van het onderwijs of deze onderwijsvoorziening
      een school is als bedoeld in [artikel 1, onderdeel b, subonderdeel 3, van de Leerplichtwet 1969][ref24] of
      [artikel 1, onderdeel b, subonderdeel 3, van de Leerplichtwet BES][ref25].


