  - number: '11'
    text: |-
      1 Ter uitvoering van de in [artikel 3, eerste lid, onderdelen a tot en met c][ref1], bedoelde taken onderzoekt de
      inspectie jaarlijks met inachtneming van [artikel 4][ref2] het onderwijs aan elke instelling. Naar aanleiding van
      het onderzoek geeft de inspectie een oordeel over de naleving van wettelijke voorschriften door de instelling en
      maakt zij aan de instelling haar bevindingen bekend over de ontwikkeling, in het bijzonder van de kwaliteit, van
      het onderwijs aan de instelling.

      2 De inspectie verricht het onderzoek aan de hand van de bij of krachtens een onderwijswet gegeven
      voorschriften en, indien het betreft een instelling als bedoeld in de [Wet op het primair onderwijs][ref3],
      de [Wet primair onderwijs BES][ref4], de [Wet op de expertisecentra][ref5] of de
      [Wet voortgezet onderwijs 2020][ref6], aan de hand van de volgende indicatoren:

      a. schoolplan,

      b. leerresultaten en de voortgang in de ontwikkeling van leerlingen,

      c. monitor inzake de veiligheid van leerlingen op school,

      d. informatie uit de jaarstukken, met inbegrip van het financieel jaarverslag,

      e. beschikbare signalen over mogelijke knelpunten, waaronder het gevoerde personeelsbeleid, voor zover daar op
      grond van [artikel 6a, eerste en tweede lid][ref7], aanleiding toe bestaat.

      3 Indien uit het onderzoek, bedoeld in het tweede lid, een redelijk vermoeden voortvloeit dat de instelling
      tekortschiet in de naleving van wettelijke voorschriften, stelt de inspectie nader onderzoek in, waarbij tevens
      de oorzaken van het tekortschieten worden onderzocht. Dit nader onderzoek verricht zij, indien het betreft een
      instelling als bedoeld in de [Wet op het primair onderwijs][ref8], de [Wet primair onderwijs BES][ref9], de Wet op
      de [expertisecentra][ref10] of de [Wet voortgezet onderwijs 2020][ref11], aan de hand van het schoolplan.

      4 Indien de inspectie naar aanleiding van het onderzoek, bedoeld in het derde lid, oordeelt dat de instelling
      tekortschiet in de naleving van wettelijke voorschriften verricht zij na ten hoogste één jaar onderzoek naar de
      verbeteringen die de instelling heeft gerealiseerd.

      5 De inspectie stelt het bestuur in kennis van de datum en het doel van een onderzoek, bedoeld in het derde of
      vierde lid. Kennisgeving geschiedt ten minste vier weken voor aanvang van een onderzoek. Indien de inspectie dit
      nodig oordeelt, verricht zij onderzoek zonder deze kennisgeving.

      6 Bij de uitvoering van een onderzoek, bedoeld in het derde of vierde lid, kan de inspectie onafhankelijke
      deskundigen betrekken.

      7 Het tweede lid, onderdeel e, is van overeenkomstige toepassing op de instellingen, bedoeld in de
      [Wet educatie en beroepsonderwijs][ref12] of de [Wet educatie en beroepsonderwijs BES][ref13].

      8 De inspectie bezoekt ten minste elke vier jaar een representatief aantal van de onder een bestuur ressorterende
      instellingen. Bij dit periodiek instellingsbezoek verricht zij, indien het betreft een instelling als bedoeld in de
      [Wet op het primair onderwijs][ref14], de [Wet primair onderwijs BES][ref15], de [Wet op de expertisecentra][ref16]
      of de [Wet voortgezet onderwijs 2020][ref17], het onderzoek aan de hand van het schoolplan.


