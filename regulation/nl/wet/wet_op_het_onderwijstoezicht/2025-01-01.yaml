  - number: '14'
    text: |-
      1 Indien de inspectie oordeelt dat de kwaliteit van het onderwijs zeer zwak is, als
      bedoeld in [artikel 10a, eerste of vierde lid, van de Wet op het primair onderwijs][ref1],
      [artikel 19a van de Wet op de expertisecentra][ref2],
      [artikel 2.94, eerste of derde lid, van de Wet voortgezet onderwijs 2020][ref3] of
      [artikel 6.1.4b van de Wet educatie en beroepsonderwijs][ref4] dan wel de instelling tekortschiet in de naleving
      van andere wettelijke voorschriften, informeert zij Onze Minister en kan zij voorstellen doen over te treffen
      maatregelen.

      2 De inspectie informeert Onze Minister indien de leerresultaten ernstig en langdurig tekortschieten
      als bedoeld in [artikel 10a, eerste lid, van de Wet op het primair onderwijs][ref5] of
      [artikel 2.94, eerste lid, van de Wet voortgezet onderwijs 2020][ref6], en uit het onderzoek naar de
      kwaliteitsverbeteringen, bedoeld in [artikel 11, vierde lid][ref7], blijkt dat na één jaar sprake is van
      onvoldoende verbeteringen.

      3 De inspectie stelt het bestuur van de betreffende instelling in kennis van haar voorstellen aan Onze Minister.


