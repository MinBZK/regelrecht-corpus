preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels vast te stellen met betrekking tot het toezicht
    op het onderwijs;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013800/2025-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

      a. Onze Minister: Onze Minister van Onderwijs, Cultuur en Wetenschap,

      b. de inspectie: de Inspectie van het onderwijs,

      c. de inspecteur-generaal: de inspecteur-generaal van het onderwijs,

      d. onderwijswet:

      1. - [Leerplichtwet 1969][ref1],
        - [Wet op het primair onderwijs][ref2],
        - [Wet op de expertisecentra][ref3],
        - [Wet voortgezet onderwijs 2020][ref4],
        - [Wet educatie en beroepsonderwijs][ref5],
        - [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref6],
        - [Wet medezeggenschap op scholen][ref7],
        - [Wet NLQF][ref8],
        - [Wet register onderwijsdeelnemers][ref9],
        - [Wet overige OCW-subsidies][ref10],
        - [Wet op de erkende onderwijsinstellingen][ref11], of
        - [Experimentenwet onderwijs][ref12],

      2. - [Leerplichtwet BES][ref13]
        - [Wet primair onderwijs BES][ref14]
        - [Wet educatie en beroepsonderwijs BES][ref15], of
        - [Wet sociale kanstrajecten jongeren BES][ref16]

      e. onderwijs: bij of krachtens een onderwijswet geregeld onderwijs, waaronder mede worden begrepen werkzaamheden als
      bedoeld in de [artikelen 174, eerste lid][ref17], en [176, eerste lid, van de Wet op het primair onderwijs][ref18],
      [154, eerste lid][ref19], en [156, eerste lid, van de Wet op de expertisecentra][ref20], en
      [7.29, eerste lid][ref21], en [7.32, eerste lid, van de Wet voortgezet onderwijs 2020][ref22],

      f. voorschoolse educatie: voorschoolse educatie als bedoeld in de
      [artikel 1.1, eerste lid, van de Wet kinderopvang][ref23],

      g. instelling: school, instelling of exameninstelling in de zin van een onderwijswet, daaronder begrepen een niet
      bekostigde instelling,

      h instelling voor hoger onderwijs: een instelling als bedoeld in
      [artikel 1.2, onderdelen a en b, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref24],

      i. samenwerkingsverband: samenwerkingsverband als bedoeld in [artikel 1 van de Wet op het primair onderwijs][ref25]
      en [artikel 1.1 van de Wet voortgezet onderwijs 2020][ref26],

      ia. Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven: de rechtspersoon, bedoeld in
      [1.5.1 van de Wet educatie en beroepsonderwijs][ref27],

      j.

      k. bestuur: bevoegd gezag in de zin van een onderwijswet, met dien verstande dat waar het de
      [Leerplichtwet 1969][ref28] of de [Leerplichtwet BES][ref29] betreft hieronder wordt verstaan het
      hoofd van de school of instelling, en met dien verstande dat waar het het toezicht op de uitoefening
      van de taken van het samenwerkingsverband betreft hieronder wordt verstaan het bestuur van de
      rechtspersoon, bedoeld in [artikel 18a, vierde lid, van de Wet op het primair onderwijs][ref30] en
      [artikel 2.47, vijfde lid, van de Wet voortgezet onderwijs 2020][ref31],

      l. onderwijsdeelnemer: leerling, deelnemer, vavo-student, mbo-student, ho-student of extraneus als bedoeld in een
      onderwijswet,

      l1. mbo-student: student als bedoeld in[ artikel 1.1.1 van de Wet educatie en beroepsonderwijs][ref32],

      l2. ho-student: degene die hoger onderwijs volgt als bedoeld in
      [artikel 1.1, onderdeel b, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref33],

      l3. vavo-student: vavo-student als bedoeld in [artikel 1.1.1 van de Wet educatie en beroepsonderwijs][ref34],

      m. ouders: met het gezag over het kind belaste ouders, hun geregistreerde partners, voogden en verzorgers,

      n. jaarwerkplan: document waarin de inspectie haar werkzaamheden voor het komende jaar neerlegt,

      o.

      p. rechtspersoon voor hoger onderwijs: rechtspersoon voor hoger onderwijs als bedoeld in
      [artikel 1.1, onderdeel aa, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref35].


