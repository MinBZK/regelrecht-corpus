  - number: 11a
    text: |-
      1 Zo spoedig mogelijk na ontvangst van de beschikking waarin is vermeld dat de bekostiging een
      aanvang zal nemen, bedoeld in [artikel 79, achtste lid, van de Wet op het primair onderwijs][ref1],
      [artikel 72, eerste lid, van de Wet primair onderwijs BES][ref2],
      [artikel 86, zesde lid, van de Wet op de expertisecentra][ref3],
      [artikel 4.5, vierde lid, van de Wet voortgezet onderwijs 2020][ref4], doch uiterlijk vier maanden voorafgaande aan
      de aanvang van de bekostiging, toont het bevoegd gezag bij de inspectie aan dat het ten aanzien van die instelling
      kan voldoen aan de vereisten met betrekking tot:

      a. de bekwaamheid van degenen die onderwijs geven, bedoeld in
      [artikel 3 van de Wet op het primair onderwijs][ref5], [artikel 3 van de Wet primair onderwijs BES][ref6],
      [artikel 3 van de Wet op de expertisecentra][ref7] en [artikel 7.11 van de Wet voortgezet onderwijs 2020][ref8],

      b. de voorschriften omtrent onderwijstijd gesteld op grond van de [Wet op het primair onderwijs][ref9],
      de [Wet primair onderwijs BES][ref10], de [Wet op de expertisecentra][ref11] en de
      [Wet voortgezet onderwijs 2020][ref12],

      c. de voorbereiding op het schoolplan, bedoeld in [artikel 12 van de Wet op het primair onderwijs][ref13],
      [artikel 21 van de Wet op de expertisecentra][ref14] en [artikel 2.88 van de Wet voortgezet onderwijs 2020][ref15],
      en

      d. de scheiding tussen de functies van bestuur en het toezicht daarop, bedoeld in de
      [artikelen 17a][ref16] en [17b van de Wet op het primair onderwijs][ref17], de [artikelen 28g][ref18] en
      [28h van de Wet op de expertisecentra][ref19] en [artikel 3.1 van de Wet voortgezet onderwijs 2020][ref20].

      2 De inspectie kan indien het bepaalde in het eerste lid daartoe aanleiding geeft overleg voeren met het
      bevoegd gezag van de instelling. Naar aanleiding van dit overleg kan de inspectie besluiten dat het bepaalde in
      [artikel 11b, tweede tot en met zesde lid][ref21], van overeenkomstige toepassing is, met dien verstande dat
      in afwijking van het derde lid bij het opstellen van de risicoanalyse het schoolplan niet wordt betrokken, en in
      afwijking van het vierde lid de risicoanalyse wordt opgesteld binnen drie maanden na het overleg, bedoeld in de
      eerste volzin.


