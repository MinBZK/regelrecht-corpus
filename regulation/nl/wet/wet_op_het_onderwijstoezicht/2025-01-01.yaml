  - number: '21'
    text: |-
      1 De inspectie maakt een inspectierapport in de derde week na vaststelling daarvan openbaar.

      2 Een inspectierapport dat ten grondslag ligt aan een spoedaanwijzing als bedoeld in de
      [artikelen 153a van de Wet op het primair onderwijs][ref1], [132a van de Wet op de expertisecentra][ref2],
      [3.38a van de Wet voortgezet onderwijs 2020][ref3], [3.1.6 van de Wet educatie en beroepsonderwijs][ref4],
      [9.9b][ref5], [10.3e1][ref6], [11.7b van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref7], [122a
      van de Wet primair onderwijs BES](onbekend), en [artikel 10.1a Wet educatie en beroepsonderwijs BES](onbekend),
      wordt, in afwijking van het eerste lid, de dag na die van de bekendmaking van de spoedaanwijzing openbaar
      gemaakt. De vorige volzin is niet van toepassing indien openbaarmaking reeds op grond van het eerste lid heeft
      plaatsgevonden.

      3 Indien voor de derde week na vaststelling van het inspectierapport, bedoeld in [artikel 20, zesde lid][ref8], dan
      wel voor de openbaarmaking, bedoeld in het tweede lid, eerste volzin, wordt verzocht om een voorlopige voorziening
      als bedoeld in [artikel 8:81 van de Algemene wet bestuursrecht][ref9], wordt de openbaarmaking opgeschort totdat de
      voorzieningenrechter een uitspraak heeft gedaan.

      4 Tevens verstrekt de inspectie een inspectierapport op verzoek. De inspectie kan een vergoeding van kosten vragen
      overeenkomstig een door haar vast te stellen tarief voor de afgifte van een inspectierapport.

      5 De inspectie verstrekt een inspectierapport niet eerder dan nadat het op grond van het eerste of tweede lid
      openbaar is gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel153a
