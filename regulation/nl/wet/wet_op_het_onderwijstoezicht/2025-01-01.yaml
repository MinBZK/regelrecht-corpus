  - number: 6a
    text: |-
      1 De inspectie fungeert als aanspreekpunt voor ten behoeve van een instelling met taken belaste personen die
      van oordeel zijn dat de instelling tekortschiet in de naleving van wettelijke voorschriften ten gevolge van het
      gevoerde personeelsbeleid.

      2 De inspectie beoordeelt of uit hetgeen haar op grond van het eerste lid ter kennis is gebracht een redelijk
      vermoeden voortvloeit dat de instelling tekortschiet in de naleving van wettelijke voorschriften.

      3 De inspectie is verplicht tot geheimhouding van hetgeen haar op grond van het eerste lid is toevertrouwd.
    url: https://wetten.overheid.nl/BWBR0013800/2025-01-01#Artikel6a
  - number: '7'
    text: |-
      1 De inspectie stelt jaarlijks een jaarwerkplan vast. Het jaarwerkplan behoeft de goedkeuring van Onze Minister.

      2 De goedkeuring, bedoeld in het eerste lid, wordt niet eerder verleend dan vier weken nadat het ontwerp van het
      jaarwerkplan aan de Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0013800/2025-01-01#Artikel7
  - number: '8'
    text: |-
      1 De inspectie rapporteert desgevraagd en uit eigen beweging aan Onze Minister over de ontwikkeling, in het
      bijzonder van de kwaliteit, van het onderwijs en doet op grond daarvan voorstellen die zij in het belang van het
      onderwijs nodig acht.

      2 De inspectie stelt jaarlijks uiterlijk de derde woensdag van mei het verslag over de staat van het onderwijs,
      bedoeld in [artikel 23, achtste lid, van de Grondwet][ref1] vast. Onze Minister zendt het verslag, vergezeld van
      een reactie, namens de regering onverwijld aan de Staten-Generaal.

      3 Onze Minister geeft geen aanwijzingen met betrekking tot de in de rapportages neergelegde oordelen van de
      inspectie over de ontwikkeling, in het bijzonder van de kwaliteit, van het onderwijs.

      4 Indien een rapportage als bedoeld in het eerste lid, of een deel daarvan, specifiek het onderwijs in de Friese
      taal of het onderwijs in de Friese taal en cultuur betreft op het geheel aan scholen in het primair onderwijs,
      voortgezet onderwijs onderscheidenlijk speciaal onderwijs, zendt de inspectie, tegelijkertijd met verzending aan
      Onze Minister, die rapportage onderscheidenlijk dat deel, in afschrift aan gedeputeerde staten van Fryslân.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel23
