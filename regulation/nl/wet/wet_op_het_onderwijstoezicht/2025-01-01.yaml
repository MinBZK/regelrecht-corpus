  - number: 15c
    text: |-
      1 [Artikel 11][ref1] is van overeenkomstige toepassing, met dien verstande dat de inspectie het onderzoek tevens
      verricht aan de hand van de volgende indicatoren:

      a. het al dan niet voldoen aan de wettelijke voorschriften met betrekking tot het
      ondersteuningsplan, bedoeld in [artikel 18a van de Wet op het primair onderwijs][ref2] en
      [artikel 2.47 van de Wet voortgezet onderwijs 2020][ref3],

      b. het aantal leerplichtige jongeren wonend in het gebied van het samenwerkingsverband dat niet is ingeschreven bij
      een school als bedoeld in de [Leerplichtwet 1969][ref4],

      c. het aantal leerplichtige leerlingen van scholen in het samenwerkingsverband dat het onderwijs aan de school
      waaraan hij is ingeschreven gedurende een aaneengesloten periode van ten minste vier weken zonder geldige reden
      niet meer volgt, en

      d. de wijze waarop een samenwerkingsverband zorg draagt voor de kwaliteit van het onderwijs aan een orthopedagogisch-
      didactisch centrum als bedoeld in [artikel 18a, lid 10a, van de Wet op het primair onderwijs][ref5] en
      [artikel 2.47, twaalfde lid, van de Wet voortgezet onderwijs 2020][ref6].

      2 De [artikelen 12][ref7], [13][ref8], [14][ref9] en [15][ref10] zijn van overeenkomstige toepassing.


