  - number: 15o
    text: |-
      De inspectie houdt toezicht op de naleving van bij of krachtens een onderwijswet gegeven voorschriften die
      zich uitsluitend of mede richten tot natuurlijke personen of rechtspersonen die geen instelling zijn en waarvan
      overtreding kan leiden tot een bestuurlijke boete.
    url: https://wetten.overheid.nl/BWBR0013800/2025-01-01#Artikel15o
  - number: '20'
    text: |-
      1 De inspectie legt haar oordelen en bevindingen naar aanleiding van een onderzoek als bedoeld in
      [artikel 11][ref1], dan wel [artikel 12a][ref2], vast in een inspectierapport. In het inspectierapport wordt
      onderscheid aangebracht tussen oordelen op grond van de in [artikel 3, eerste lid, onderdeel a][ref3], bedoelde
      taak en bevindingen op grond van de in artikel 3, eerste lid, onderdeel b, bedoelde taak.

      2 De inspectie vermeldt ten aanzien van de in [artikel 3, eerste lid, onderdeel a][ref4], bedoelde taak, op welke
      bij of krachtens een onderwijswet gegeven voorschriften haar oordeel betrekking heeft. Indien de inspectie oordeelt
      dat een bij of krachtens een onderwijswet gegeven voorschrift niet is nageleefd, vermeldt zij dit in het rapport.

      3 Alvorens een rapport vast te stellen, stelt de inspectie het bestuur in de gelegenheid van het ontwerp-rapport
      kennis te nemen en daarover overleg te voeren.

      4 Indien in het overleg geen overeenstemming is bereikt over door het bestuur gewenste wijzigingen van het ontwerp-
      rapport, wordt de zienswijze van het bestuur in een bijlage bij het inspectierapport opgenomen.

      5 De inspectie zendt het inspectierapport na vaststelling daarvan onverwijld aan het bestuur.

      6 Het inspectierapport waarin de inspectie tot het oordeel komt dat de kwaliteit van het onderwijs of de opleiding
      zeer zwak is, als bedoeld in [artikel 10a, eerste of vierde lid, van de Wet op het primair onderwijs][ref5],
      [artikel 19a van de Wet op de expertisecentra][ref6], __REF002_____________________________________________________
      __________________, en de [artikelen 6.1.4b][ref8] en [6.2.2a van de Wet educatie en beroepsonderwijs][ref9] geldt
      na vaststelling als een besluit in de zin van de [Algemene wet bestuursrecht][ref10].


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel11
