  - number: 15i
    text: |-
      1 De inspectie verricht het onderzoek, bedoeld in [artikel 15h, eerste lid][ref1], aan de hand van de
      kwaliteitsvoorwaarden van de voorschoolse educatie in kindercentra, bedoeld in de bij of krachtens de
      [Wet kinderopvang][ref2] vastgestelde bepalingen, te weten:

      a. de basisvoorwaarden voor voorschoolse educatie,

      b. het informeren van ouders en ouderbetrokkenheid,

      c. de kwaliteit van de educatie,

      d. ontwikkeling, zorg en begeleiding van de kinderen,

      e. kwaliteitszorg,

      f. de doorgaande lijn tussen voor- en vroegschoolse educatie.

      2 De inspectie rapporteert over de bevindingen van het toezicht aan de houder van een kindercentrum en aan het
      college van burgemeester en wethouders.

      3 Naast het onderzoek, bedoeld in het eerste lid, kan de inspectie uit eigen beweging incidenteel onderzoek
      verrichten naar de kwaliteit van de voorschoolse educatie in kindercentra, bedoeld in de bij of krachtens de
      [Wet kinderopvang][ref3] vastgestelde bepalingen.

      4 [Artikel 13][ref4] is van overeenkomstige toepassing, met dien verstande dat onder «andere betrokkenen»
      in ieder geval wordt verstaan: vertegenwoordigers van houders van kindercentra als bedoeld in
      [artikel 1.1 van de Wet kinderopvang][ref5].

      5 De inspectie verricht het onderzoek, bedoeld in [artikel 15h, tweede lid][ref6], op verzoek van het college
      van burgemeester en wethouders van de betrokken gemeente of op verzoek van Onze Minister. Het college van
      burgemeester en wethouders dient een dergelijk verzoek in op eigen initiatief of als een partij als bedoeld in
      [artikel 160, tweede lid, van de Wet op het primair onderwijs][ref7] aan het college hierom verzoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel15h
      [ref2]: https://wetten.overheid.nl/BWBR0017017
      [ref3]: https://wetten.overheid.nl/BWBR0017017
      [ref4]: https://wetten.overheid.nl/BWBR0013800#Artikel13
