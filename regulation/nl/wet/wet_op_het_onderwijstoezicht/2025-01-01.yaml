  - number: '9'
    text: |-
      1 Bij de uitoefening van de taken van de inspectie zijn, voorzover deze niet het toezicht op de naleving van bij of
      krachtens een onderwijswet als bedoeld in [artikel 1, onderdeel d, sub 1][ref1], gegeven voorschriften betreffen,
      de [artikelen 5:12 tot en met 5:17][ref2] en [5:20, eerste en tweede lid, van de Algemene wet bestuursrecht][ref3]
      van overeenkomstige toepassing.

      2 De bevoegdheden, bedoeld in de artikelen genoemd in het eerste lid, worden uitgeoefend door daartoe door Onze
      Minister aangewezen personen.

      3 Onze Minister is bevoegd tot overeenkomstige toepassing van
      [artikel 5:20, derde lid, van de Algemene wet bestuursrecht][ref4] ten aanzien van de in het tweede lid bedoelde
      personen.

      4 Van een besluit tot aanwijzing als bedoeld in het tweede lid wordt mededeling gedaan in de Staatscourant.

      5 De kosten die samenhangen met de uitoefening van het toezicht op de naleving van de [artikelen 1.19][ref5] en
      [1.19a van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref6], komen ten laste van de instelling
      voor hoger onderwijs ten behoeve waarvan de uitoefening van het toezicht plaatsvindt.

      6 De bedragen ter vergoeding van de kosten worden bij ministeriële regeling vastgesteld.


