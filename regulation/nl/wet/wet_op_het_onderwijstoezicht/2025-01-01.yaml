  - number: '22'
    text: De inspectie draagt zorg voor een verantwoorde taakuitoefening.
    url: https://wetten.overheid.nl/BWBR0013800/2025-01-01#Artikel22
  - number: '23'
    text: |-
      1 Er is een klachtadviescommissie belast met de behandeling van en advisering over klachten
      over gedragingen van de inspectie. Op de behandeling van en advisering over klachten is de in
      [afdeling 9.1.3 van de Algemene wet bestuursrecht][ref1] geregelde procedure van toepassing.

      2 De klachtadviescommissie bestaat uit ten minste drie leden, die worden benoemd en ontslagen door Onze
      Minister van Onderwijs, Cultuur en Wetenschap. De leden maken geen deel uit van en zijn niet werkzaam onder
      verantwoordelijkheid van de inspectie. De leden kiezen uit hun midden een voorzitter. De benoeming geschiedt voor
      de tijd van ten hoogste vier jaar. Herbenoeming kan tweemaal en telkens voor ten hoogste vier jaar plaatsvinden.

      3 De voorzitter en leden zijn afzonderlijk of gezamenlijk deskundig op het gebied van onderwijs, in het bijzonder
      op het gebied van de vrijheid van richting en inrichting, toezicht en klachtbehandeling.

      4 De klachtadviescommissie bepaalt haar eigen werkwijze.


