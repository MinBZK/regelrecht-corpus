  - number: '2'
    text: |-
      1 Er is een Inspectie van het onderwijs, die onder Onze Minister van Onderwijs, Cultuur en Wetenschap ressorteert.
      Aan het hoofd van de inspectie staat de inspecteur-generaal.

      2 Onze Minister geeft met betrekking tot de uitoefening van de in deze wet aan de inspectie toegekende bevoegdheden
      uitsluitend in schriftelijke vorm zijn aanwijzingen, onder mededeling daarvan aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0013800/2025-01-01#Artikel2
  - number: '3'
    text: |-
      1 De inspectie heeft de volgende taken:

      a. het toezien op:

      1°. de naleving van de bij of krachtens een onderwijswet gegeven voorschriften,

      2°. de naleving van de bij of krachtens de [Wet kinderopvang][ref1] gegeven voorschriften, voor zover het betreft
      de voorschoolse educatie op kindercentra,

      b. het bevorderen van:

      1°. de ontwikkeling, in het bijzonder van de kwaliteit, van het onderwijs aan en het
      bestuur van instellingen als bedoeld in de onderwijswetten met uitzondering van de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2] voor zover het niet betreft het onderzoek bedoeld
      in [artikel 12a, derde lid][ref3],

      2°. de kwaliteit van de uitoefening van de taken van de samenwerkingsverbanden,

      3°. de kwaliteit van de uitoefening van de taken van de Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven, en

      4°. de ontwikkeling, in het bijzonder van de kwaliteit, van het stelsel van
      hoger onderwijs, met inbegrip van het stelsel van accreditatie, bedoeld in
      [hoofdstuk 5 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref4].

      c. het toezien op en bevorderen van de financiële rechtmatigheid door in ieder geval het verrichten van onderzoek
      naar de rechtmatige verkrijging van de bekostiging, naar de controlerapporten van de door het bestuur aangewezen
      accountant, naar de rechtmatigheid van de bestedingen en naar de rechtmatigheid van het financieel beheer, alsmede
      het toezien op en bevorderen van de financiële doelmatigheid en de financiële continuïteit van de bekostigde
      instellingen, de samenwerkingsverbanden en de Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven,

      d. het rapporteren over de ontwikkeling van, in bijzonder van de kwaliteit van, het onderwijs en over de
      uitoefening van de taken door de instellingen, de samenwerkingsverbanden en de Samenwerkingsorganisatie
      beroepsonderwijs bedrijfsleven, in het bijzonder over de kwaliteit daarvan,

      e. het toezien op de naleving van de [artikelen 4.1][ref5] en [4.2 van de Wet NLQF][ref6], en

      f. het verrichten van andere bij of krachtens de wet aan de inspectie opgedragen taken.

      2 Onze Minister kan de inspectie mandaat verlenen om:

      a. de bekostiging voor ten hoogste vijftien procent in te houden of geheel of gedeeltelijk op te schorten, op grond
      van [artikel 155 van de Wet op het primair onderwijs][ref7], [artikel 123 van de Wet primair onderwijs BES][ref8],
      [artikel 133 van de Wet op de expertisecentra][ref9], [artikel 10.1 van de Wet voortgezet onderwijs 2020][ref10],
      [artikel 11.1 van de Wet educatie en beroepsonderwijs][ref11],
      [artikel 10.2 van de Wet educatie en beroepsonderwijs BES][ref12], __REF006________________________________________
      _____________________________________ of [artikel 38 van de Wet medezeggenschap op scholen][ref14];

      b. een subsidie lager vast te stellen, te wijzigen, of gedeeltelijk in te trekken of terug te vorderen op grond van
      de [afdelingen 4.2.5 tot en met 4.2.7 van de Algemene wet bestuursrecht][ref15];

      c. bij of krachtens de [Wet op het primair onderwijs][ref16], de [Wet primair onderwijs BES][ref17],
      de [Wet op de expertisecentra][ref18], de [Wet voortgezet onderwijs 2020][ref19], de
      [Wet educatie en beroepsonderwijs][ref20], de [Wet educatie en beroepsonderwijs BES][ref21] of de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref22] correcties aan te brengen of bedragen in
      mindering te brengen op de bekostiging;

      d. voor zover het niet de enige opleiding in zijn soort betreft, een waarschuwing als
      bedoeld in de [artikelen 6.1.5][ref23], [6.1.5b][ref24], [6.2.3][ref25], [6.2.3b][ref26] en
      [6.3.2 van de Wet educatie en beroepsonderwijs][ref27] en de [artikelen 6.2.3][ref28], [6.2.4][ref29]
      en [6.3.1 van de Wet educatie en beroepsonderwijs BES][ref30] te geven, of een besluit als
      bedoeld in de [artikelen 6.1.4][ref31], [6.1.5b][ref32], [6.2.2][ref33], [6.2.3b][ref34] en
      [6.3.2 van de Wet educatie en beroepsonderwijs][ref35] en de [artikelen 6.2.1][ref36], [6.2.4][ref37] en
      [6.3.1 van de Wet educatie en beroepsonderwijs BES][ref38] te nemen;

      e. de bestuurlijke boete op te leggen, bedoeld in [artikel 27 van de Leerplichtwet 1969][ref39],
      [artikel 39 van de Leerplichtwet BES][ref40], [artikel 11.2 van de Wet educatie en beroepsonderwijs][ref41],
      [artikel 10.3 van de Wet educatie en beroepsonderwijs BES][ref42] of
      [artikel 15.7 tot en met 15.9 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref43];

      f. de bestuurlijke boete op te leggen, bedoeld in [artikel 4.3 van de Wet NLQF][ref44]; of

      g. te beslissen op een tegen een besluit als bedoeld in de onderdelen a tot en met f ingediend bezwaarschrift.


