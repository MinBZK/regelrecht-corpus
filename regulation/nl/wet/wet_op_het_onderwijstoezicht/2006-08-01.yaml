  - number: 1.e
    text: 'onderwijs: bij of krachtens een onderwijswet geregeld onderwijs,'
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel1
  - number: 1.f
    text: |-
      instelling: school, instelling, exameninstelling of agrarisch innovatie- en praktijkcentrum in de zin van een
      onderwijswet, daaronder begrepen een niet bekostigde instelling en waaronder mede worden begrepen werkzaamheden als
      bedoeld in de artikelen 176e, eerste lid, en 176g, eerste lid, van de Wet op het primair onderwijs, 162h, eerste
      lid, en 162j, eerste lid, van de Wet op de expertisecentra, en 118n, eerste lid, en 118p, eerste lid, van de Wet op
      het voortgezet onderwijs,
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel1
  - number: 1.g
    text: |-
      exameninstelling: instelling als bedoeld in [artikel 1.6.1 van de Wet educatie en beroepsonderwijs][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 1.i
    text: |-
      bestuur: bevoegd gezag in de zin van een onderwijswet, met dien verstande dat waar het de
      [Leerplichtwet 1969][ref1] betreft hieronder wordt verstaan het hoofd van de school of instelling,


      [ref1]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002628
  - number: 1.j
    text: 'onderwijsdeelnemer: leerling, deelnemer, student of extraneus in de zin van een onderwijswet,'
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel1
  - number: 1.k
    text: 'ouders: met het gezag over het kind belaste ouders, hun geregistreerde partners, voogden en verzorgers,'
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel1
  - number: 1.l
    text: |-
      maatregel: maatregel als bedoeld in [artikel 1d van de Leerplichtwet 1969][ref1], [artikel 164a van de Wet op het
      primair onderwijs](onbekend), [artikel 146a van de Wet op de expertisecentra](onbekend), de [artikelen 104a][ref2]
      en [261a van de Wet op het voortgezet onderwijs](onbekend) en de [artikelen 6.1.5a](onbekend) en
      [6.2.3a van de Wet educatie en beroepsonderwijs][ref3],


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1d
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel104a
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: 1d
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 104a
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '6'
  - number: 1.m
    text: 'jaarwerkplan: document waarin de inspectie haar werkzaamheden voor het komende jaar neerlegt.'
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel1
  - number: '2.1'
    text: |-
      Er is een Inspectie van het onderwijs, die onder Onze Minister van Onderwijs, Cultuur en Wetenschap ressorteert.
      Aan het hoofd van de inspectie staat de inspecteur-generaal.
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel2
  - number: '2.2'
    text: |-
      Onze Minister geeft met betrekking tot de uitoefening van de in deze wet aan de inspectie toegekende bevoegdheden
      uitsluitend in schriftelijke vorm zijn aanwijzingen, onder mededeling daarvan aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel2
  - number: '3.1'
    text: Het toezicht is opgedragen aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel3
  - number: '3.2'
    text: 'Het toezicht omvat de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel3
  - number: 3.2.a
    text: |-
      het beoordelen van de kwaliteit van het onderwijs op basis van het verrichten van onderzoek naar de naleving van de
      bij of krachtens een onderwijswet gegeven voorschriften en naar andere aspecten van kwaliteit,
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel3
  - number: 3.2.b
    text: |-
      het bij de uitoefening van de onder a bedoelde taak bevorderen van de kwaliteit van het onderwijs, onder meer door
      het voeren van overleg met het bestuur, het personeel van de instelling, en zo nodig, het college van burgemeester
      en wethouders van de gemeente en gedeputeerde staten van de provincie,
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel3
  - number: 3.2.c
    text: het rapporteren over de ontwikkeling van het onderwijs, in het bijzonder over de kwaliteit daarvan,
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel3
  - number: 3.2.d
    text: het verrichten van andere bij of krachtens de wet aan de inspectie opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel3
  - number: '4.1'
    text: De inspectie oefent het toezicht uit met inachtneming van de vrijheid van onderwijs.
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel4
  - number: '4.2'
    text: |-
      De inspectie oefent het toezicht uit op zodanige wijze dat instellingen niet meer worden belast dan voor een
      zorgvuldige uitoefening van het toezicht noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel4
  - number: '4.3'
    text: |-
      De uitoefening van het toezicht is er mede op gericht betrokkenen te informeren over de ontwikkeling, in het
      bijzonder van de kwaliteit, van het onderwijs.
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel4
  - number: '5'
    text: |-
      Bij de uitoefening van het toezicht op opleidingen, gericht op een beroep waarvoor bij of krachtens de wet
      vereisten zijn gesteld op het gebied van kennis, inzicht, vaardigheden en in voorkomende gevallen beroepshoudingen,
      waarover degene die de opleiding voltooit, met het oog op het beroepsmatig functioneren dient te beschikken, pleegt
      de inspectie overleg met door Onze Minister wie het aangaat, aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel5
  - number: '6.1'
    text: 'Bij de inspectie zijn vertrouwensinspecteurs werkzaam voor:'
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel6
  - number: 6.1.a
    text: |-
      onderwijsdeelnemers die het slachtoffer zijn van seksueel misbruik, seksuele intimidatie, fysiek geweld, psychisch
      geweld, discriminatie of radicalisering, gepleegd door een ten behoeve van de instelling met taken belast persoon
      of een onderwijsdeelnemer van de instelling,
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel6
  - number: 6.1.b
    text: |-
      ten behoeve van een instelling met taken belaste personen die het slachtoffer zijn van seksueel misbruik, seksuele
      intimidatie, fysiek geweld, psychisch geweld, discriminatie of radicalisering, gepleegd door een ten behoeve van de
      instelling met taken belast persoon of een onderwijsdeelnemer van de instelling, en
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel6
  - number: 6.1.c
    text: |-
      onderwijsdeelnemers, ten behoeve van een instelling met taken belaste personen, besturen, ouders, op instellingen
      ingestelde klachtencommissies en op instellingen aangestelde vertrouwenspersonen, die geconfronteerd worden met een
      geval van seksueel misbruik, seksuele intimidatie, fysiek geweld, psychisch geweld, discriminatie of radicalisering
      als bedoeld onder a of b.
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel6
  - number: '6.2'
    text: |-
      Naast zijn taken, voortvloeiend uit [artikel 3][ref1], heeft de vertrouwensinspecteur ten behoeve van de in het
      eerste lid genoemde personen en organen de volgende taken:


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel3
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '3'
        hoofdstuk: '2'
  - number: 6.2.a
    text: het fungeren als aanspreekpunt,
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel6
  - number: 6.2.b
    text: het adviseren over eventueel te nemen stappen,
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel6
  - number: 6.2.c
    text: het bijstaan bij het nemen van stappen gericht op het zoeken naar een oplossing, en
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel6
  - number: 6.2.d
    text: het desgevraagd begeleiden bij het indienen van een klacht of het doen van aangifte.
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel6
  - number: '6.3'
    text: |-
      De vertrouwensinspecteur is, voorzover het betreft misdrijven als bedoeld in
      [titel XIV van het Wetboek van Strafrecht][ref1] jegens een onderwijsdeelnemer of een ten behoeve van een
      instelling met taken belast persoon, vrijgesteld van de verplichting tot het doen van aangifte als bedoeld in de
      [artikelen 160, eerste lid][ref2], en [162, eerste lid, van het Wetboek van Strafvordering][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001854
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel160
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel162
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001854
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '160'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '162'
  - number: '6.4'
    text: |-
      De vertrouwensinspecteur is voorzover het betreft een geval van seksueel misbruik of seksuele intimidatie als
      bedoeld in het eerste lid, onder a of b, verplicht tot geheimhouding van hetgeen hem in de uitoefening van zijn
      functie is toevertrouwd door een onderwijsdeelnemer, de ouders van een onderwijsdeelnemer of een ten behoeve van
      een instelling met taken belast persoon.
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel6
  - number: '6.5'
    text: |-
      De vertrouwensinspecteur is bevoegd zonder toestemming van degene die het betreft bijzondere gegevens als bedoeld
      in [artikel 16 van de Wet bescherming persoonsgegevens][ref1] te verwerken met betrekking tot de personen, bedoeld
      in het eerste lid, indien uit een melding redelijkerwijs een vermoeden van seksueel misbruik, seksuele intimidatie,
      psychisch geweld, fysiek geweld, discriminatie of radicalisering kan worden afgeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel16
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '16'
  - number: '6.6'
    text: |-
      De vertrouwensinspecteur verstrekt de door hem verzamelde gegevens niet aan derden. In het verslag over de staat
      van het onderwijs, bedoeld in [artikel 8, tweede lid][ref1], worden slechts geabstraheerde gegevens opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel8
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '8'
        hoofdstuk: '2'
  - number: '6.7'
    text: |-
      In afwijking van het zesde lid is de vertrouwensinspecteur bevoegd rechtstreeks onder de verantwoordelijkheid van
      Onze Minister van Justitie vallende instanties in kennis te stellen van een geval of vermoeden van een geval van
      psychisch geweld, fysiek geweld, discriminatie of radicalisering:
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel6
  - number: 6.7.a
    text: in het belang van de onderwijsdeelnemers,
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel6
  - number: 6.7.b
    text: in het belang van ten behoeve van een instelling met taken belaste personen, of
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel6
  - number: 6.7.c
    text: indien de ernst van de situatie waarop de melding betrekking heeft daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel6
  - number: '7.1'
    text: De inspectie stelt jaarlijks een jaarwerkplan vast. Het jaarwerkplan behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel7
  - number: '7.2'
    text: Onze Minister zendt het jaarwerkplan van de inspectie aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel7
  - number: '8.1'
    text: |-
      De inspectie rapporteert desgevraagd en uit eigen beweging aan Onze Minister over de ontwikkeling, in het bijzonder
      van de kwaliteit, van het onderwijs en doet op grond daarvan voorstellen die zij in het belang van het onderwijs
      nodig acht.
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel8
  - number: '8.2'
    text: |-
      De inspectie stelt jaarlijks uiterlijk de derde woensdag van mei het verslag over de staat van het onderwijs,
      bedoeld in [artikel 23, achtste lid, van de Grondwet][ref1] vast. Onze Minister zendt het verslag, vergezeld van
      een reactie, namens de regering onverwijld aan de Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel23
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '23'
  - number: '8.3'
    text: |-
      Onze Minister geeft geen aanwijzingen met betrekking tot de in de rapportages neergelegde oordelen van de inspectie
      over de ontwikkeling, in het bijzonder van de kwaliteit, van het onderwijs.
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel8
  - number: '9.1'
    text: |-
      Bij de uitoefening van de taken van de inspectie zijn, voorzover deze niet het toezicht op de naleving van bij
      of krachtens een onderwijswet gegeven voorschriften betreffen, de [artikelen 5:12 tot en met 5:17][ref1] en
      [5:20 van de Algemene wet bestuursrecht][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '9.2'
    text: |-
      De bevoegdheden, bedoeld in de artikelen genoemd in het eerste lid, worden uitgeoefend door daartoe door Onze
      Minister aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel9
  - number: '9.3'
    text: Van een besluit als bedoeld in het tweede lid wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel9
  - number: '10'
    text: 'Dit hoofdstuk is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel10
  - number: 10.a
    text: |-
      de examinering van beroepsopleidingen als bedoeld in de [Wet educatie en beroepsonderwijs][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: 10.b
    text: |-
      de universiteiten, hogescholen en de Open Universiteit, bedoeld in
      [artikel 1.8 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
  - number: 10.c
    text: |-
      de universiteiten en hogescholen die ingevolge [artikel 6.9 van de wet][ref1], bedoeld in onderdeel b, zijn
      aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
  - number: '11.1'
    text: |-
      Ter uitvoering van de in [artikel 3][ref1] bedoelde taken onderzoekt de inspectie jaarlijks het onderwijs aan elke
      instelling, behoudens bijzondere omstandigheden. Naar aanleiding van het onderzoek geeft de inspectie een oordeel
      over de kwaliteit van het onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel3
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '3'
        hoofdstuk: '2'
  - number: '11.2'
    text: |-
      De inspectie verricht het onderzoek aan de hand van de bij of krachtens een onderwijswet gegeven voorschriften en,
      indien het betreft een instelling voor primair of voortgezet onderwijs, de aspecten van kwaliteit, te weten
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel11
  - number: 11.2.a
    text: 'voor wat betreft de opbrengsten van het onderwijs:'
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel11
  - number: 11.2.a.1°
    text: leerresultaten,
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel11
  - number: 11.2.a.2°
    text: voortgang in de ontwikkeling van leerlingen,
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel11
  - number: 11.2.b
    text: 'voor wat betreft de inrichting van het onderwijsleerproces:'
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel11
  - number: 11.2.b.1°
    text: het leerstofaanbod,
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel11
  - number: 11.2.b.2°
    text: de leertijd,
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel11
  - number: 11.2.b.3°
    text: het pedagogisch klimaat,
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel11
  - number: 11.2.b.4°
    text: het schoolklimaat,
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel11
  - number: 11.2.b.5°
    text: het didactisch handelen van de leraren,
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel11
  - number: 11.2.b.6°
    text: de leerlingenzorg,
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel11
  - number: 11.2.b.7°
    text: de inhoud, het niveau en de uitvoering van de toetsen, tests, opdrachten of examens.
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel11
  - number: '11.3'
    text: |-
      Indien de inspectie naar aanleiding van het onderzoek, bedoeld in het vorige lid, oordeelt dat de kwaliteit
      tekortschiet, verricht zij na een door haar aangegeven termijn onderzoek naar de kwaliteitsverbeteringen die de
      instelling heeft gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel11
  - number: '11.4'
    text: |-
      De inspectie stelt het bestuur in kennis van de datum en het doel van een onderzoek, bedoeld in het tweede of derde
      lid. Kennisgeving geschiedt ten minste vier weken voor aanvang van een onderzoek.
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel11
  - number: '11.5'
    text: |-
      Bij de uitvoering van een onderzoek, bedoeld in het tweede of derde lid, kan de inspectie onafhankelijke
      deskundigen betrekken.
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel11
  - number: '12.1'
    text: |-
      De inspectie gaat bij een onderzoek als bedoeld in [artikel 11, tweede of derde lid][ref1], uit van de
      uitkomsten van een evaluatie van de kwaliteit door of vanwege de instelling, waaronder worden verstaan de
      uitkomsten van het beleid met betrekking tot de bewaking en verbetering van de kwaliteit van het onderwijs door
      of vanwege de instelling als bedoeld in [artikel 12, eerste lid, van de Wet op het primair onderwijs][ref2],
      [artikel 21 van de Wet op de expertisecentra][ref3],
      [artikel 24, eerste lid, van de Wet op het voortgezet onderwijs][ref4], en het verslag, bedoeld in
      [artikel 1.3.6, tweede lid, van de Wet educatie en beroepsonderwijs][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel24
      [ref5]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '11'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '21'
      - id: ref4
        bwb_id: BWBR0002399
        artikel: '24'
      - id: ref5
        bwb_id: BWBR0007625
        artikel: '1'
  - number: '12.2'
    text: |-
      De uitkomsten van een evaluatie, bedoeld in het eerste lid, zijn richtinggevend voor het oordeel van de inspectie
      indien:
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel12
  - number: 12.2.a
    text: |-
      alle aspecten van kwaliteit die de inspectie bij haar oordeel betrekt, zoals neergelegd in een toezichtskader als
      bedoeld in [artikel 13][ref1], daarin aan de orde komen,


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel13
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '13'
        hoofdstuk: '3'
  - number: 12.2.b
    text: de wijze van uitvoering en de hoedanigheid van de evaluatie voldoende betrouwbaar zijn, en
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel12
  - number: 12.2.c
    text: de kwaliteitsdoelen die de instelling zichzelf heeft gesteld, van voldoende niveau zijn.
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel12
  - number: '12.3'
    text: Waar niet aan de in het tweede lid genoemde voorwaarden is voldaan, verricht de inspectie aanvullend onderzoek.
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel12
  - number: '13.1'
    text: |-
      De inspectie legt haar werkwijze voor een onderzoek als bedoeld in [artikel 11][ref1], vast in een of meer
      toezichtskaders. De toezichtskaders behoeven de goedkeuring van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel11
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '11'
        hoofdstuk: '3'
  - number: '13.2'
    text: |-
      Alvorens een toezichtskader vast te stellen of te wijzigen voert de inspectie overleg met vertegenwoordigers van
      het onderwijsveld en andere betrokkenen, terwijl bij onderwerpen betrekking hebbend op de vrijheid van inrichting
      in ieder geval overleg wordt gevoerd met de erkende richtingen.
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel13
  - number: '13.3'
    text: Een toezichtskader wordt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel13
  - number: '14.1'
    text: |-
      Indien de inspectie oordeelt dat de kwaliteit van het onderwijs ernstig of langdurig tekortschiet, informeert zij
      Onze Minister en doet voorstellen over te treffen maatregelen.
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel14
  - number: '14.2'
    text: De inspectie stelt het bestuur van de betreffende instelling in kennis van haar voorstellen aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel14
  - number: '15.1'
    text: |-
      Naast het periodieke kwaliteitsonderzoek, bedoeld in [artikel 11][ref1], kan de inspectie uit eigen beweging
      dan wel op aanwijzing van Onze Minister incidenteel onderzoek verrichten naar de kwaliteit van het onderwijs
      onderscheidenlijk, indien het een exameninstelling betreft, van de externe legitimering waaronder mede wordt
      verstaan naar de naleving van de bij of krachtens een onderwijswet gegeven voorschiften.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel11
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '11'
        hoofdstuk: '3'
  - number: '15.2'
    text: |-
      De artikelen 20 en [21][ref1] zijn van overeenkomstige toepassing, tenzij de aard of omvang van het onderzoek zich
      tegen openbare rapportage verzetten.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel21
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '21'
        hoofdstuk: '5'
  - number: 15a
    text: |-
      Dit hoofdstuk is van toepassing op de uitvoering van de externe kwaliteitsbewaking bij de examinering van
      beroepsopleidingen, bedoeld in [hoofdstuk 7, titel 4, paragraaf 1b, van de Wet educatie en beroepsonderwijs][ref1]
      door het Kwaliteitscentrum examinering beroepsopleidingen, bedoeld in
      [artikel 7.4.9a, tweede lid, van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Paragraaf1b
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        paragraaf: 1b
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 15b.1
    text: |-
      De inspectie houdt toezicht op het Kwaliteitscentrum examinering beroepsopleidingen, bedoeld in
      [artikel 7.4.9a, tweede lid, van de Wet educatie en beroepsonderwijs][ref1] door het beoordelen van het
      functioneren van dat Kwaliteitscentrum examinering beroepsopleidingen op basis van het verrichten van onderzoek
      naar de naleving van de bij of krachtens die wet gegeven voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 15b.2
    text: |-
      Ter uitvoering van de taak, bedoeld in het eerste lid, kan de inspectie Onze Minister onder meer voorstellen een
      voorziening te treffen als bedoeld in [artikel 7.4.9c, van de Wet educatie en beroepsonderwijs][ref1] indien:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 15b.2.a
    text: is gebleken dat de kwaliteit van de externe kwaliteitsbewaking onvoldoende is geweest, of
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel15b
  - number: 15b.2.b
    text: |-
      niet of niet meer wordt voldaan aan hetgeen bij of krachtens deze wet en de
      [Wet educatie en beroepsonderwijs][ref1] is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: '16'
    text: |-
      Dit hoofdstuk is van toepassing op het accreditatieorgaan, bedoeld in
      [artikel 5a.2 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], de in
      [artikel 1.8 van die wet][ref2] bedoelde universiteiten, hogescholen en de Open Universiteit en op de
      universiteiten en hogescholen die krachtens [artikel 6.9 van die wet][ref3] zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '6'
  - number: '17.1'
    text: |-
      De inspectie houdt toezicht op het accreditatieorgaan, bedoeld in
      [artikel 5a.2 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], de accreditatie,
      bedoeld in [artikel 1.1, onderdeel s, van die wet][ref2], en de toets nieuwe opleiding, bedoeld in
      [artikel 1.1, onderdeel t , van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '1'
  - number: '17.2'
    text: |-
      De inspectie kan Onze minister voorstellen een voorziening te treffen in het geval het accreditatieorgaan zijn taak
      verwaarloost, indien:
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel17
  - number: 17.2.a
    text: |-
      is gebleken dat de kwaliteit van de accreditatie en de toets nieuwe opleiding door het accreditatieorgaan
      onvoldoende is of is geweest, of
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel17
  - number: 17.2.b
    text: |-
      niet of niet meer wordt voldaan aan hetgeen bij of krachtens deze wet en de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: '18.1'
    text: |-
      De inspectie voert de in [artikel 3][ref1] bedoelde taken uit door onderzoek naar de naleving door
      instellingen van de voorschriften, bedoeld in de [artikelen 6.5, eerste lid onderdeel b][ref2], en
      [6.10, eerste lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '6'
  - number: '18.2'
    text: |-
      De [artikelen 11, derde tot en met vijfde lid][ref1], en [14][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel14
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '11'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '14'
        hoofdstuk: '3'
  - number: '19.1'
    text: |-
      Naast het onderzoek, bedoeld in [artikel 18][ref1], kan de inspectie incidenteel onderzoek verrichten naar:


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel18
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '18'
        hoofdstuk: '4'
  - number: 19.1.a
    text: aspecten van de kwaliteit van het stelsel van hoger onderwijs in zijn geheel, en
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel19
  - number: 19.1.b
    text: |-
      de naleving door instellingen van de voorschriften, bedoeld in de [artikelen 6.5, eerste lid onderdeel b][ref1], en
      [6.10, eerste lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '6'
  - number: '19.2'
    text: |-
      De [artikelen 20][ref1] en [21][ref2] zijn van overeenkomstige toepassing, tenzij de aard of omvang van het
      onderzoek zich tegen openbare rapportage verzetten.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel21
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '20'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '21'
        hoofdstuk: '5'
  - number: '20.1'
    text: |-
      De inspectie legt haar oordeel naar aanleiding van een onderzoek als bedoeld in
      [artikel 11, tweede of derde lid][ref1], vast in een inspectierapport.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel11
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '11'
        hoofdstuk: '3'
  - number: '20.2'
    text: |-
      Indien de inspectie oordeelt dat een bij of krachtens een onderwijswet gegeven voorschrift niet is nageleefd,
      vermeldt zij dit in het rapport.
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel20
  - number: '20.3'
    text: |-
      Alvorens een rapport vast te stellen, stelt de inspectie het bestuur in de gelegenheid van het ontwerp-rapport
      kennis te nemen en daarover overleg te voeren.
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel20
  - number: '20.4'
    text: |-
      Indien in het overleg geen overeenstemming is bereikt over door het bestuur gewenste wijzigingen van het ontwerp-
      rapport, wordt de zienswijze van het bestuur in een bijlage bij het inspectierapport opgenomen.
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel20
  - number: '20.5'
    text: De inspectie zendt het inspectierapport na vaststelling daarvan onverwijld aan het bestuur.
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel20
  - number: '21.1'
    text: De inspectie maakt een inspectierapport in de vijfde week na vaststelling daarvan openbaar.
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel21
  - number: '21.2'
    text: |-
      Tevens verstrekt de inspectie een inspectierapport op verzoek. De inspectie kan een vergoeding van kosten vragen
      overeenkomstig een door haar vast te stellen tarief voor de afgifte van een inspectierapport.
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel21
  - number: '21.3'
    text: |-
      De inspectie verstrekt een inspectierapport niet eerder dan nadat het op grond van het eerste lid openbaar is
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel21
  - number: '22'
    text: De inspectie draagt zorg voor een verantwoorde uitoefening van het toezicht.
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel22
  - number: '23.1'
    text: |-
      Er is een klachtadviescommissie belast met de behandeling van en advisering over klachten
      over gedragingen van de inspectie. Op de behandeling van en advisering over klachten is de in
      [afdeling 9.1.3 van de Algemene wet bestuursrecht][ref1] geregelde procedure van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling9.1.3
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 9.1.3
  - number: '23.2'
    text: |-
      De klachtadviescommissie bestaat uit ten minste drie leden, die worden benoemd en ontslagen door Onze Minister van
      Onderwijs, Cultuur en Wetenschap na overleg met Onze Minister van Landbouw, Natuur en Voedselkwaliteit. De leden
      maken geen deel uit van en zijn niet werkzaam onder verantwoordelijkheid van de inspectie. De leden kiezen uit hun
      midden een voorzitter.
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel23
  - number: '23.3'
    text: |-
      De voorzitter en leden zijn afzonderlijk of gezamenlijk deskundig op het gebied van onderwijs, in het bijzonder op
      het gebied van de vrijheid van richting en inrichting, toezicht en klachtbehandeling.
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel23
  - number: '23.4'
    text: De klachtadviescommissie bepaalt haar eigen werkwijze.
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel23
  - number: '24.1'
    text: |-
      Er is een Raad van advies inzake de inspectie die tot taak heeft de inspectie bij te staan in de waarborging
      van een zorgvuldige en professionele uitoefening van het toezicht. De raad adviseert de inspecteur-generaal
      onderscheidenlijk het hoofd inspectie gevraagd en ongevraagd over de kwaliteit van de uitoefening van het toezicht,
      in het bijzonder over de uitvoering van de [artikelen 13][ref1] en [22][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel22
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '13'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '22'
        hoofdstuk: '6'
  - number: '24.2'
    text: |-
      De raad bestaat uit drie leden, die worden benoemd en ontslagen door Onze Minister van Onderwijs, Cultuur en
      Wetenschap na overleg met Onze Minister van Landbouw, Natuur en Voedselkwaliteit. De benoeming geschiedt voor de
      tijd van ten hoogste vier jaar. De leden kiezen uit hun midden een voorzitter.
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel24
  - number: '24.3'
    text: |-
      De voorzitter en leden zijn afzonderlijk of gezamenlijk deskundig op het gebied van onderwijs, kwaliteitszorg en
      toezicht.
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel24
  - number: '24.4'
    text: De raad bepaalt zijn eigen werkwijze.
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel24
  - number: '33'
    text: a. b. c. d. c.
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel33
  - number: '34'
    text: |-
      Onze Minister zendt binnen vijf jaren na inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel34
  - number: '35'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel35
  - number: '36'
    text: 'Deze wet wordt aangehaald als: Wet op het onderwijstoezicht.'
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel36
