preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels vast te stellen met betrekking tot het toezicht
    op het onderwijs;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel1
  - number: 1.a
    text: |-
      Onze Minister: Onze Minister van Onderwijs, Cultuur en Wetenschap en, voorzover het betreft het onderwijs op het
      gebied van landbouw en natuurlijke omgeving, Onze Minister van Landbouw, Natuur en Voedselkwaliteit,
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel1
  - number: 1.b
    text: 'de inspectie: de Inspectie van het onderwijs,'
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel1
  - number: 1.c
    text: 'de inspecteur-generaal: de inspecteur-generaal van het onderwijs,'
    url: https://wetten.overheid.nl/BWBR0013800/2006-08-01#Artikel1
  - number: 1.d
    text: |-
      onderwijswet: '- [Leerplichtwet 1969][ref1],'
        - [Wet op het primair onderwijs][ref2],
        - [Wet op de expertisecentra][ref3],
        - [Wet op het voortgezet onderwijs][ref4],
        - [Wet educatie en beroepsonderwijs][ref5],
        - [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref6],
        - [Wet op de erkende onderwijsinstellingen][ref7], of
        - [Experimentenwet onderwijs][ref8],


