  - number: '14'
    text: |-
      1 Indien de inspectie oordeelt dat de kwaliteit van het onderwijs ernstig of langdurig tekortschiet, informeert zij
      Onze Minister en doet voorstellen over te treffen maatregelen.

      2 De inspectie stelt het bestuur van de betreffende instelling in kennis van haar voorstellen aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013800/2004-12-22#Artikel14
  - number: '15'
    text: |-
      1 Naast het periodieke kwaliteitsonderzoek, bedoeld in [artikel 11][ref1], kan de inspectie uit eigen beweging
      dan wel op aanwijzing van Onze Minister incidenteel onderzoek verrichten naar de kwaliteit van het onderwijs
      onderscheidenlijk, indien het een exameninstelling betreft, van de externe legitimering waaronder mede wordt
      verstaan naar de naleving van de bij of krachtens een onderwijswet gegeven voorschiften.

      2 De artikelen 20 en [21][ref2] zijn van overeenkomstige toepassing, tenzij de aard of omvang van het onderzoek
      zich tegen openbare rapportage verzetten.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel11
