  - number: '20'
    text: |-
      1 De inspectie legt haar oordeel naar aanleiding van een onderzoek als bedoeld in
      [artikel 11, tweede of derde lid][ref1], vast in een inspectierapport.

      2 Indien de inspectie oordeelt dat een bij of krachtens een onderwijswet gegeven voorschrift niet is nageleefd,
      vermeldt zij dit in het rapport.

      3 Alvorens een rapport vast te stellen, stelt de inspectie het bestuur in de gelegenheid van het ontwerp-rapport
      kennis te nemen en daarover overleg te voeren.

      4 Indien in het overleg geen overeenstemming is bereikt over door het bestuur gewenste wijzigingen van het ontwerp-
      rapport, wordt de zienswijze van het bestuur in een bijlage bij het inspectierapport opgenomen.

      5 De inspectie zendt het inspectierapport na vaststelling daarvan onverwijld aan het bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel11
    url: https://wetten.overheid.nl/BWBR0013800/2004-12-22#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '11'
        hoofdstuk: '3'
  - number: '21'
    text: |-
      1 De inspectie maakt een inspectierapport in de vijfde week na vaststelling daarvan openbaar.

      2 Tevens verstrekt de inspectie een inspectierapport op verzoek. De inspectie kan een vergoeding van kosten vragen
      overeenkomstig een door haar vast te stellen tarief voor de afgifte van een inspectierapport.

      3 De inspectie verstrekt een inspectierapport niet eerder dan nadat het op grond van het eerste lid openbaar is
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0013800/2004-12-22#Artikel21
  - number: '22'
    text: De inspectie draagt zorg voor een verantwoorde uitoefening van het toezicht.
    url: https://wetten.overheid.nl/BWBR0013800/2004-12-22#Artikel22
  - number: '23'
    text: |-
      1 Er is een klachtadviescommissie belast met de behandeling van en advisering over klachten
      over gedragingen van de inspectie. Op de behandeling van en advisering over klachten is de in
      [afdeling 9.3 van de Algemene wet bestuursrecht][ref1] geregelde procedure van toepassing.

      2 De klachtadviescommissie bestaat uit drie leden, die worden benoemd en ontslagen door Onze Minister van
      Onderwijs, Cultuur en Wetenschap na overleg met Onze Minister van Landbouw, Natuur en Voedselkwaliteit. De leden
      maken geen deel uit van en zijn niet werkzaam onder verantwoordelijkheid van de inspectie. De leden kiezen uit hun
      midden een voorzitter.

      3 De voorzitter en leden zijn afzonderlijk of gezamenlijk deskundig op het gebied van onderwijs, in het bijzonder
      op het gebied van de vrijheid van richting en inrichting, toezicht en klachtbehandeling.

      4 De klachtadviescommissie bepaalt haar eigen werkwijze.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling9.3
    url: https://wetten.overheid.nl/BWBR0013800/2004-12-22#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '9.3'
  - number: '24'
    text: |-
      1 Er is een Raad van advies inzake de inspectie die tot taak heeft de inspectie bij te staan in de waarborging
      van een zorgvuldige en professionele uitoefening van het toezicht. De raad adviseert de inspecteur-generaal
      onderscheidenlijk het hoofd inspectie gevraagd en ongevraagd over de kwaliteit van de uitoefening van het toezicht,
      in het bijzonder over de uitvoering van de [artikelen 13][ref1] en [22][ref2].

      2 De raad bestaat uit drie leden, die worden benoemd en ontslagen door Onze Minister van Onderwijs, Cultuur en
      Wetenschap na overleg met Onze Minister van Landbouw, Natuur en Voedselkwaliteit. De benoeming geschiedt voor de
      tijd van ten hoogste vier jaar. De leden kiezen uit hun midden een voorzitter.

      3 De voorzitter en leden zijn afzonderlijk of gezamenlijk deskundig op het gebied van onderwijs, kwaliteitszorg
      en toezicht.

      4 De raad bepaalt zijn eigen werkwijze.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel22
