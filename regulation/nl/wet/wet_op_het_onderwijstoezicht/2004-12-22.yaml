      1 Naast het onderzoek, bedoeld in [artikel 18][ref1], kan de inspectie incidenteel onderzoek verrichten naar:

      a. aspecten van de kwaliteit van het stelsel van hoger onderwijs in zijn geheel, en

      b. de naleving door instellingen van de voorschriften, bedoeld in de [artikelen 6.5, eerste lid onderdeel b][ref2],
      en [6.10, eerste lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref3].

      2 De [artikelen 20][ref4] en [21][ref5] zijn van overeenkomstige toepassing, tenzij de aard of omvang van het
      onderzoek zich tegen openbare rapportage verzetten.


