  - number: '11'
    text: |-
      1 Ter uitvoering van de in [artikel 3][ref1] bedoelde taken onderzoekt de inspectie jaarlijks het onderwijs aan
      elke instelling, behoudens bijzondere omstandigheden. Naar aanleiding van het onderzoek geeft de inspectie een
      oordeel over de kwaliteit van het onderwijs.

      2 De inspectie verricht het onderzoek aan de hand van de bij of krachtens een onderwijswet gegeven voorschriften
      en, indien het betreft een instelling voor primair of voortgezet onderwijs, de aspecten van kwaliteit, te weten

      a. voor wat betreft de opbrengsten van het onderwijs:

      1°. leerresultaten,

      2°. voortgang in de ontwikkeling van leerlingen,

      b. voor wat betreft de inrichting van het onderwijsleerproces:

      1°. het leerstofaanbod,

      2°. de leertijd,

      3°. het pedagogisch klimaat,

      4°. het schoolklimaat,

      5°. het didactisch handelen van de leraren,

      6°. de leerlingenzorg,

      7°. de inhoud, het niveau en de uitvoering van de toetsen, tests, opdrachten of examens.

      Indien uit het onderzoek een redelijk vermoeden voortvloeit dat de kwaliteit tekortschiet, stelt zij nader
      onderzoek in, waarbij tevens de oorzaken van het tekortschieten worden onderzocht.

      3 Indien de inspectie naar aanleiding van het onderzoek, bedoeld in het vorige lid, oordeelt dat de kwaliteit
      tekortschiet, verricht zij na een door haar aangegeven termijn onderzoek naar de kwaliteitsverbeteringen die de
      instelling heeft gerealiseerd.

      4 De inspectie stelt het bestuur in kennis van de datum en het doel van een onderzoek, bedoeld in het tweede of
      derde lid. Kennisgeving geschiedt ten minste vier weken voor aanvang van een onderzoek.

      5 Bij de uitvoering van een onderzoek, bedoeld in het tweede of derde lid, kan de inspectie onafhankelijke
      deskundigen betrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel3
    url: https://wetten.overheid.nl/BWBR0013800/2004-12-22#Artikel11
