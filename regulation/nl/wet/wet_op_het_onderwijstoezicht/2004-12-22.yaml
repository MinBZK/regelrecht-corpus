        artikel: 7.4.9a
  - number: 15b
    text: |-
      1 De inspectie houdt toezicht op het Kwaliteitscentrum examinering beroepsopleidingen, bedoeld in
      [artikel 7.4.9a, tweede lid, van de Wet educatie en beroepsonderwijs][ref1] door het beoordelen van het
      functioneren van dat Kwaliteitscentrum examinering beroepsopleidingen op basis van het verrichten van onderzoek
      naar de naleving van de bij of krachtens die wet gegeven voorschriften.

      2 Ter uitvoering van de taak, bedoeld in het eerste lid, kan de inspectie Onze Minister onder meer voorstellen een
      voorziening te treffen als bedoeld in [artikel 7.4.9c, van de Wet educatie en beroepsonderwijs][ref2] indien:

      a. is gebleken dat de kwaliteit van de externe kwaliteitsbewaking onvoldoende is geweest, of

      b. niet of niet meer wordt voldaan aan hetgeen bij of krachtens deze wet en de
      [Wet educatie en beroepsonderwijs][ref3] is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.4.9a
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7.4.9c
