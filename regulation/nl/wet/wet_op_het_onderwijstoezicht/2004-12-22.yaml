  - number: '2'
    text: |-
      1 Er is een Inspectie van het onderwijs, die onder Onze Minister van Onderwijs, Cultuur en Wetenschap ressorteert.
      Aan het hoofd van de inspectie staat de inspecteur-generaal.

      2 Er is een Inspectie van het landbouwonderwijs, die onder Onze Minister van Landbouw, Natuur en Voedselkwaliteit
      ressorteert. Aan het hoofd van de inspectie staat het hoofd inspectie.

      3 Onze Minister geeft met betrekking tot de uitoefening van de in deze wet aan de inspectie toegekende bevoegdheden
      uitsluitend in schriftelijke vorm zijn aanwijzingen, onder mededeling daarvan aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0013800/2004-12-22#Artikel2
  - number: '3'
    text: |-
      1 Het toezicht is opgedragen aan de inspectie.

      2 Het toezicht omvat de volgende taken:

      a. het beoordelen van de kwaliteit van het onderwijs op basis van het verrichten van onderzoek naar de naleving van
      de bij of krachtens een onderwijswet gegeven voorschriften en naar andere aspecten van kwaliteit,

      b. het bij de uitoefening van de onder a bedoelde taak bevorderen van de kwaliteit van het onderwijs, onder meer
      door het voeren van overleg met het bestuur, het personeel van de instelling, en zo nodig, de besturen van gemeente
      en provincie,

      c. het rapporteren over de ontwikkeling van het onderwijs, in het bijzonder over de kwaliteit daarvan,

      d. het verrichten van andere bij of krachtens de wet aan de inspectie opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0013800/2004-12-22#Artikel3
  - number: '4'
    text: |-
      1 De inspectie oefent het toezicht uit met inachtneming van de vrijheid van onderwijs.

      2 De inspectie oefent het toezicht uit op zodanige wijze dat instellingen niet meer worden belast dan voor een
      zorgvuldige uitoefening van het toezicht noodzakelijk is.

      3 De uitoefening van het toezicht is er mede op gericht betrokkenen te informeren over de ontwikkeling, in het
      bijzonder van de kwaliteit, van het onderwijs.
    url: https://wetten.overheid.nl/BWBR0013800/2004-12-22#Artikel4
  - number: '5'
    text: |-
      Bij de uitoefening van het toezicht op opleidingen, gericht op een beroep waarvoor bij of krachtens de wet
      vereisten zijn gesteld op het gebied van kennis, inzicht, vaardigheden en in voorkomende gevallen beroepshoudingen,
      waarover degene die de opleiding voltooit, met het oog op het beroepsmatig functioneren dient te beschikken, pleegt
      de inspectie overleg met door Onze Minister wie het aangaat, aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0013800/2004-12-22#Artikel5
  - number: '6'
    text: |-
      1 Bij de inspectie zijn vertrouwensinspecteurs werkzaam voor:

      a. onderwijsdeelnemers die het slachtoffer zijn van seksueel misbruik of seksuele intimidatie dan wel van fysiek
      geweld of psychisch geweld, gepleegd door een ten behoeve van de instelling met taken belast persoon of een
      onderwijsdeelnemer van de instelling,

      b. ten behoeve van een instelling met taken belaste personen die het slachtoffer zijn van seksueel misbruik of
      seksuele intimidatie dan wel van fysiek geweld of psychisch geweld, gepleegd door een ten behoeve van de instelling
      met taken belast persoon of een onderwijsdeelnemer van de instelling, en

      c. onderwijsdeelnemers, ten behoeve van een instelling met taken belaste personen, besturen, ouders, op
      instellingen ingestelde klachtencommissies en op instellingen aangestelde vertrouwenspersonen, die geconfronteerd
      worden met een geval van seksueel misbruik of seksuele intimidatie dan wel van fysiek geweld of psychisch geweld
      als bedoeld onder a of b.

      2 Naast zijn taken, voortvloeiend uit [artikel 3][ref1], heeft de vertrouwensinspecteur ten behoeve van de in het
      eerste lid genoemde personen en organen de volgende taken:

      a. het fungeren als aanspreekpunt,

      b. het adviseren over eventueel te nemen stappen,

      c. het bijstaan bij het nemen van stappen gericht op het zoeken naar een oplossing, en

      d. het desgevraagd begeleiden bij het indienen van een klacht of het doen van aangifte.

      3 De vertrouwensinspecteur is, voorzover het betreft misdrijven als bedoeld in
      [titel XIV van het Wetboek van Strafrecht][ref2] jegens een onderwijsdeelnemer of een ten behoeve van een
      instelling met taken belast persoon, vrijgesteld van de verplichting tot het doen van aangifte als bedoeld in de
      [artikelen 160, eerste lid][ref3], en [162, eerste lid, van het Wetboek van Strafvordering][ref4].

      4 De vertrouwensinspecteur is voorzover het betreft een geval van seksueel misbruik of seksuele intimidatie als
      bedoeld in het eerste lid, onder a of b, verplicht tot geheimhouding van hetgeen hem in de uitoefening van zijn
      functie is toevertrouwd door een onderwijsdeelnemer, de ouders van een onderwijsdeelnemer of een ten behoeve van
      een instelling met taken belast persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0001854
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel160
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel162
