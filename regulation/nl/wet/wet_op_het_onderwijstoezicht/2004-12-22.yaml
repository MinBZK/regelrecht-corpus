  - number: '10'
    text: |-
      Dit hoofdstuk is niet van toepassing op:

      a. de examinering van beroepsopleidingen als bedoeld in de [Wet educatie en beroepsonderwijs][ref1],

      b. de universiteiten, hogescholen en de Open Universiteit, bedoeld in
      [artikel 1.8 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2], en

      c. de universiteiten en hogescholen die ingevolge [artikel 6.9 van de wet][ref3], bedoeld in onderdeel b, zijn
      aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
