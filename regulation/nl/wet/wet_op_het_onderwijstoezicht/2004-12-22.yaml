preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels vast te stellen met betrekking tot het toezicht
    op het onderwijs;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013800/2004-12-22#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

      a. Onze Minister: Onze Minister van Onderwijs, Cultuur en Wetenschap en, voorzover het betreft het onderwijs op het
      gebied van landbouw en natuurlijke omgeving, Onze Minister van Landbouw, Natuur en Voedselkwaliteit,

      b. de inspectie: de Inspectie van het onderwijs en, voorzover het betreft het onderwijs op het gebied van landbouw
      en natuurlijke omgeving, de Inspectie van het landbouwonderwijs,

      c. de inspecteur-generaal: de inspecteur-generaal van het onderwijs,

      d. het hoofd inspectie: het hoofd van de Inspectie landbouwonderwijs,

      e. onderwijswet:

        - [Leerplichtwet 1969][ref1],
        - [Wet op het primair onderwijs][ref2],
        - [Wet op de expertisecentra][ref3],
        - [Wet op het voortgezet onderwijs][ref4],
        - [Wet educatie en beroepsonderwijs][ref5],
        - [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref6],
        - [Wet op de erkende onderwijsinstellingen][ref7], of
        - [Experimentenwet onderwijs][ref8],

      f. onderwijs: bij of krachtens een onderwijswet geregeld onderwijs,

      g. instelling: school, instelling, exameninstelling of agrarisch innovatie- en praktijkcentrum in de zin van een
      onderwijswet, daaronder begrepen een niet bekostigde instelling,

      h. exameninstelling: instelling als bedoeld in [artikel 1.6.1 van de Wet educatie en beroepsonderwijs][ref9],

      i.

      j. bestuur: bevoegd gezag in de zin van een onderwijswet, met dien verstande dat waar het de
      [Leerplichtwet 1969][ref10] betreft hieronder wordt verstaan het hoofd van de school of instelling,

      k. onderwijsdeelnemer: leerling, deelnemer, student of extraneus in de zin van een onderwijswet,

      l. ouders: met het gezag over het kind belaste ouders, hun geregistreerde partners, voogden en verzorgers,

      m. maatregel: maatregel als bedoeld in [artikel 1d van de Leerplichtwet 1969][ref11], [artikel 164a van
      de Wet op het primair onderwijs](onbekend), [artikel 146a van de Wet op de expertisecentra](onbekend), de
      [artikelen 104a][ref12] en [261a van de Wet op het voortgezet onderwijs](onbekend) en de [artikelen 6.1.5a]
      (onbekend) en [6.2.3a van de Wet educatie en beroepsonderwijs][ref13],

      n. jaarwerkplan: document waarin de inspectie haar werkzaamheden voor het komende jaar neerlegt.


