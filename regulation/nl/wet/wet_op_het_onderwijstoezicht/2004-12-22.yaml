  - number: '13'
    text: |-
      1 De inspectie legt haar werkwijze voor een onderzoek als bedoeld in [artikel 11][ref1], vast in een of meer
      toezichtskaders. De toezichtskaders behoeven de goedkeuring van Onze Minister.

      2 Alvorens een toezichtskader vast te stellen of te wijzigen voert de inspectie overleg met vertegenwoordigers van
      het onderwijsveld en andere betrokkenen, terwijl bij onderwerpen betrekking hebbend op de vrijheid van inrichting
      in ieder geval overleg wordt gevoerd met de erkende richtingen.

      3 Een toezichtskader wordt bekendgemaakt in het officiële publicatieblad van het Ministerie van Onderwijs, Cultuur
      en Wetenschap. Van deze bekendmaking wordt mededeling gedaan in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel11
