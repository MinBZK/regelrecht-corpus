  - number: 24h
    text: |-
      1 Er is een meldingsregister relatief verzuim dat ten doel heeft burgemeester en
      wethouders, het hoofd, bedoeld in [artikel 21a van de Leerplichtwet 1969][ref1], en het
      bevoegd gezag, bedoeld in [artikel 8.1.8a van de Wet educatie en beroepsonderwijs][ref2],
      [artikel 47b van de Wet op de expertisecentra][ref3] en [artikel 28a van de Wet op het voortgezet onderwijs][ref4],
      te voorzien van de gegevens die noodzakelijk zijn voor de uitvoering van hun taken inzake:

      a. het verzuim, bedoeld in [artikel 21a van de Leerplichtwet 1969][ref5]; en

      b. het zonder geldige reden niet meer volgen van het onderwijs of de educatie, bedoeld in
      [artikel 8.1.8a van de Wet educatie en beroepsonderwijs][ref6], of van het onderwijs, bedoeld in
      [artikel 47b van de Wet op de expertisecentra][ref7] en [artikel 28a van de Wet op het voortgezet onderwijs][ref8].

      2 Met betrekking tot de verwerking van persoonsgegevens, bedoeld in deze paragraaf, is Onze Minister de
      verantwoordelijke, bedoeld in [artikel 1, onderdeel d, van de Wet bescherming persoonsgegevens][ref9].


