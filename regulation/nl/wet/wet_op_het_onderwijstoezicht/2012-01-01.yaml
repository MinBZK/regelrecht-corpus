  - number: '22'
    text: De inspectie draagt zorg voor een verantwoorde uitoefening van het toezicht.
    url: https://wetten.overheid.nl/BWBR0013800/2012-01-01#Artikel22
  - number: '23'
    text: |-
      1 Er is een klachtadviescommissie belast met de behandeling van en advisering over klachten
      over gedragingen van de inspectie. Op de behandeling van en advisering over klachten is de in
      [afdeling 9.1.3 van de Algemene wet bestuursrecht][ref1] geregelde procedure van toepassing.

      2 De klachtadviescommissie bestaat uit ten minste drie leden, die worden benoemd en ontslagen door Onze Minister
      van Onderwijs, Cultuur en Wetenschap na overleg met Onze Minister van Landbouw, Natuur en Voedselkwaliteit. De
      leden maken geen deel uit van en zijn niet werkzaam onder verantwoordelijkheid van de inspectie. De leden kiezen
      uit hun midden een voorzitter.

      3 De voorzitter en leden zijn afzonderlijk of gezamenlijk deskundig op het gebied van onderwijs, in het bijzonder
      op het gebied van de vrijheid van richting en inrichting, toezicht en klachtbehandeling.

      4 De klachtadviescommissie bepaalt haar eigen werkwijze.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling9.1.3
    url: https://wetten.overheid.nl/BWBR0013800/2012-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 9.1.3
  - number: '24'
    text: |-
      1 Er is een Raad van advies inzake de inspectie die tot taak heeft de inspectie bij te staan in de waarborging
      van een zorgvuldige en professionele uitoefening van het toezicht. De raad adviseert de inspecteur-generaal
      onderscheidenlijk het hoofd inspectie gevraagd en ongevraagd over de kwaliteit van de uitoefening van het toezicht,
      in het bijzonder over de uitvoering van de [artikelen 13][ref1] en [22][ref2].

      2 De raad bestaat uit drie leden, die worden benoemd en ontslagen door Onze Minister van Onderwijs, Cultuur en
      Wetenschap na overleg met Onze Minister van Landbouw, Natuur en Voedselkwaliteit. De benoeming geschiedt voor de
      tijd van ten hoogste vier jaar. De leden kiezen uit hun midden een voorzitter.

      3 De voorzitter en leden zijn afzonderlijk of gezamenlijk deskundig op het gebied van onderwijs, kwaliteitszorg
      en toezicht.

      4 De raad bepaalt zijn eigen werkwijze.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel22
