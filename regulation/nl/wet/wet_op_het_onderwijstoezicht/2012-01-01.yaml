  - number: '2'
    text: |-
      1 Er is een Inspectie van het onderwijs, die onder Onze Minister van Onderwijs, Cultuur en Wetenschap ressorteert.
      Aan het hoofd van de inspectie staat de inspecteur-generaal.

      2 Onze Minister geeft met betrekking tot de uitoefening van de in deze wet aan de inspectie toegekende bevoegdheden
      uitsluitend in schriftelijke vorm zijn aanwijzingen, onder mededeling daarvan aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0013800/2012-01-01#Artikel2
  - number: '3'
    text: |-
      1 Het toezicht is opgedragen aan de inspectie.

      2 Het toezicht omvat de volgende taken:

      a. het beoordelen van de kwaliteit van het onderwijs, van de kwaliteit van de uitoefening van de taken van het
      regionaal expertisecentrum en van de kwaliteitsvoorwaarden van de voorschoolse educatie op peuterspeelzalen en
      kindercentra op basis van het verrichten van onderzoek naar de naleving van de bij of krachtens een onderwijswet
      of de [Wet kinderopvang en kwaliteitseisen peuterspeelzalen][ref1] gegeven voorschriften en naar andere aspecten
      van kwaliteit,

      b. het bij de uitoefening van de onder a bedoelde taak bevorderen van de kwaliteit van het onderwijs
      en van de kwaliteit van de uitoefening van de taken van het regionaal expertisecentrum, onder meer
      door het voeren van overleg met het bestuur, het personeel van de instelling dan wel van het regionaal
      expertisecentrum, en zo nodig, het college van burgemeester en wethouders van de gemeente, gedeputeerde
      staten van de provincie, dan wel het bestuurscollege en de Rijksvertegenwoordiger, bedoeld in
      [artikel 1, eerste lid, onder d, van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref2],

      c. het rapporteren over de ontwikkeling van het onderwijs en van de uitoefening van de taken van het regionaal
      expertisecentrum, in het bijzonder over de kwaliteit daarvan,

      d. het beoordelen van de rechtmatigheid en de doeltreffendheid van de uitvoering van de taken, opgedragen
      aan het college van burgemeester en wethouders bij of krachtens [hoofdstuk 1, afdelingen 3][ref3] en
      [6 van de Wet kinderopvang en kwaliteitseisen peuterspeelzalen][ref4], met uitzondering van de bij of krachtens
      [artikel 1.50b][ref5] vastgestelde bepalingen omtrent de kwaliteit van voorschoolse educatie,

      e. het verrichten van andere bij of krachtens de wet aan de inspectie opgedragen taken.


      [ref1]: https://wetten.overheid.nl/BWBR0017017
