preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels vast te stellen met betrekking tot het toezicht
    op het onderwijs;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013800/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

      a. Onze Minister: Onze Minister van Onderwijs, Cultuur en Wetenschap en, voorzover het betreft het onderwijs op het
      gebied van landbouw en natuurlijke omgeving, Onze Minister van Landbouw, Natuur en Voedselkwaliteit,

      b. de inspectie: de Inspectie van het onderwijs,

      c. de inspecteur-generaal: de inspecteur-generaal van het onderwijs,

      d. onderwijswet:

      1. - [Leerplichtwet 1969][ref1],
        - [Wet op het primair onderwijs][ref2],
        - [Wet op de expertisecentra][ref3],
        - [Wet op het voortgezet onderwijs][ref4],
        - [Wet educatie en beroepsonderwijs][ref5],
        - [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref6],
        - [Wet op de erkende onderwijsinstellingen][ref7], of
        - [Experimentenwet onderwijs][ref8],

      2. - [Leerplichtwet BES][ref9]
        - [Wet primair onderwijs BES][ref10]
        - [Wet voortgezet onderwijs BES][ref11]
        - [Wet educatie en beroepsonderwijs BES][ref12], of
        - [Wet sociale kanstrajecten jongeren BES][ref13]

      e. onderwijs: bij of krachtens een onderwijswet geregeld onderwijs,

      f. voorschoolse educatie: voorschoolse educatie als bedoeld in de [artikelen 1.1, eerste lid][ref14], en
      [2.1, van de Wet kinderopvang en kwaliteitseisen peuterspeelzalen][ref15],

      g. instelling: school, instelling of exameninstelling in de zin van een onderwijswet, daaronder begrepen
      een niet bekostigde instelling en waaronder mede worden begrepen werkzaamheden als bedoeld in de
      [artikelen 176e, eerste lid][ref16], en [176g, eerste lid, van de Wet op het primair onderwijs][ref17],
      [162h, eerste lid][ref18], en [162j, eerste lid, van de Wet op de expertisecentra][ref19], en
      [118n, eerste lid][ref20], en [118p, eerste lid, van de Wet op het voortgezet onderwijs][ref21],

      h. exameninstelling: instelling als bedoeld in [artikel 1.6.1 van de Wet educatie en beroepsonderwijs][ref22],

      i. regionaal expertisecentrum: regionaal expertisecentrum als bedoeld in
      [artikel 28b van de Wet op de expertisecentra][ref23], waaronder begrepen de commissie voor de indicatiestelling
      die door het regionaal expertisecentrum in stand wordt gehouden,

      j. bestuur: bevoegd gezag in de zin van een onderwijswet, met dien verstande dat waar het de
      [Leerplichtwet 1969][ref24] of de [Leerplichtwet BES][ref25] betreft hieronder wordt verstaan het hoofd van
      de school of instelling, en met dien verstande dat waar het het toezicht op de uitoefening van de taken van
      het regionaal expertisecentrum betreft hieronder wordt verstaan het bestuur van de rechtspersoon, bedoeld in
      [artikel 28b, vijfde lid, van de Wet op de expertisecentra][ref26],

      k. onderwijsdeelnemer: leerling, deelnemer, student of extraneus in de zin van een onderwijswet,

      l. ouders: met het gezag over het kind belaste ouders, hun geregistreerde partners, voogden en verzorgers,

      m. maatregel: maatregel als bedoeld in [artikel 1d van de Leerplichtwet 1969][ref27],
      [artikel 164a van de Wet op het primair onderwijs][ref28], [artikel 146a van de Wet op de expertisecentra][ref29],
      de [artikelen 104a][ref30] en [261a van de Wet op het voortgezet onderwijs][ref31], de [artikelen 6.1.5a][ref32],
      [6.2.3a][ref33] en [6.3.3 van de Wet educatie en beroepsonderwijs][ref34], en artikel 6.1.7 van de Wet educatie en
      beroepsonderwijs BES,

      n. jaarwerkplan: document waarin de inspectie haar werkzaamheden voor het komende jaar neerlegt.


