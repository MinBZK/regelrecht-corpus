    text: |-
      In dit hoofdstuk wordt verstaan onder:

        - *basisregister onderwijs:* basisregister onderwijs als bedoeld in [artikel 24b][ref1];
        - *meldingsregister relatief verzuim:* meldingsregister relatief verzuim als bedoeld in [artikel 24h][ref2];
        - *persoonsgebonden nummer:* burgerservicenummer als bedoeld in
      [artikel 1, onderdeel b, van de Wet algemene bepalingen burgerservicenummer][ref3] of, bij ontbreken daarvan, door
      Onze Minister uitgegeven onderwijsnummer;
        - *startkwalificatie:* startkwalificatie als bedoeld in [artikel 1, onderdeel f, van de Leerplichtwet 1969][ref4].


