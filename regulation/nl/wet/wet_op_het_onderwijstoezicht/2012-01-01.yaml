  - number: 24i
    text: |-
      1 In het meldingsregister relatief verzuim zijn de volgende gegevens opgenomen:

      a. de gegevens van de leerlingen en deelnemers, bedoeld in
      [artikel 21a, eerste, tweede en zesde lid, van de Leerplichtwet 1969][ref1],
      [artikel 8.1.8a, eerste en vijfde lid, van de Wet educatie en beroepsonderwijs][ref2],
      [artikel 47b, eerste en vijfde lid, van de Wet op de expertisecentra][ref3] en
      [artikel 28a, eerste en vijfde lid, van de Wet op het voortgezet onderwijs][ref4].

      b. de gegevens, bedoeld in [artikel 24f, veertiende lid][ref5].

      2 De gegevens, bedoeld in het eerste lid, worden in het meldingsregister relatief verzuim bewaard gedurende het
      schooljaar waarin de kennisgeving, bedoeld in [artikel 21a, eerste en tweede lid, van de Leerplichtwet 1969][ref6],
      of de opgave, bedoeld in [artikel 8.1.8a, eerste lid, van de Wet educatie en beroepsonderwijs][ref7],
      [artikel 47b, eerste lid, van de Wet op de expertisecentra][ref8] en
      [artikel 28a, eerste lid, van de Wet op het voortgezet onderwijs][ref9], is gedaan en het daaropvolgende
      schooljaar.


