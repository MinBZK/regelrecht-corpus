      1 De [artikelen 4, tweede lid][ref1], [7][ref2], [8, eerste en derde lid][ref3], en [9][ref4] zijn
      van overeenkomstige toepassing, met dien verstande dat in artikel 4, tweede lid, onder »instellingen»
      wordt verstaan «kindercentra en peuterspeelzalen als bedoeld in de [artikelen 1.1, eerste lid][ref5],
      en [2.1, van de Wet kinderopvang en kwaliteitseisen peuterspeelzalen][ref6]» en dat in artikel 9, eerste
      lid, onder «het toezicht op de naleving van bij of krachtens een onderwijswet gegeven voorschriften» wordt
      verstaan: het toezicht op de naleving van de bij of krachtens een onderwijswet of de bij of krachtens de
      [Wet kinderopvang en kwaliteitseisen peuterspeelzalen][ref7] gegeven voorschriften omtrent de kwaliteit van
      voorschoolse educatie.

      2 De inspectie houdt toezicht op de naleving van de afspraken onderwijsachterstandenbeleid, bedoeld in
