  - number: 13a
    text: |-
      Indien het bevoegd gezag, bedoeld in [artikel 1 van de Wet op het primair onderwijs][ref1],
      [artikel 1 van de Wet op de expertisecentra][ref2] en [artikel 1 van de Wet op het voortgezet onderwijs][ref3],
      niet of niet tijdig voldoet aan de verplichting, bedoeld in [artikel 45a van de Wet op het primair onderwijs][ref4],
      [artikel 48a van de Wet op de expertisecentra][ref5] of [artikel 23c van de Wet op het voortgezet onderwijs][ref6],
      zendt de inspectie de samenvatting van het inspectierapport, bedoeld in die artikelen, in de vijfde week na
      vaststelling van het inspectierapport aan de ouders van de leerlingen.


