      verricht aan de hand van aspecten van kwaliteit, te weten:

      a. coördinatie van de ambulante begeleiding,

      b. ondersteuning van de ouders,

      c. organisatie van de commissie voor de indicatiestelling door het regionaal expertisecentrum,

      d. onafhankelijkheid van de commissie voor de indicatiestelling,

      e. duur van de indicatieprocedure en

      f. toepassing van de indicatiecriteria, bedoeld in
      [artikel 28c, achtste lid, van de Wet op de expertisecentra][ref2], door de commissie voor de indicatiestelling.

      2 De [artikelen 12][ref3], [13][ref4], [14][ref5] en [15][ref6] zijn van overeenkomstige toepassing.


