  - number: '10'
    text: |-
      Dit hoofdstuk is niet van toepassing op:

      a. de universiteiten, hogescholen, de Open Universiteit en de levensbeschouwelijke universiteiten, bedoeld in
      [artikel 1.8 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1],

      b. de universiteiten en hogescholen die ingevolge [artikel 6.9 van de wet][ref2], bedoeld in onderdeel b, zijn
      aangewezen, en

      c. de rechtspersonen voor hoger onderwijs, bedoeld in
      [artikel 1.1, onder aa, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref3],

      d. de uitvoering van de taken, opgedragen aan het college van burgemeester en wethouders bij of krachtens
      [hoofdstuk 1, afdelingen 3][ref4] en [6 van de Wet kinderopvang en kwaliteitseisen peuterspeelzalen][ref5].


