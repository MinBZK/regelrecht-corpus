      1 De inspectie houdt toezicht op het accreditatieorgaan, bedoeld in
      [artikel 5a.2 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], de accreditatie,
      bedoeld in [artikel 1.1, onderdeel s, van die wet][ref2], en de toets nieuwe opleiding, bedoeld in
      [artikel 1.1, onderdeel t , van die wet][ref3].

      2 De inspectie kan Onze minister voorstellen een voorziening te treffen in het geval het accreditatieorgaan zijn
      taak verwaarloost, indien:

      a. is gebleken dat de kwaliteit van de accreditatie en de toets nieuwe opleiding door het accreditatieorgaan
      onvoldoende is of is geweest, of

      b. niet of niet meer wordt voldaan aan hetgeen bij of krachtens deze wet en de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref4] is bepaald.


