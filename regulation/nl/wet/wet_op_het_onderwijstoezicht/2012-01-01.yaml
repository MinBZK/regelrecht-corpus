        artikel: '23'
  - number: '9'
    text: |-
      1 Bij de uitoefening van de taken van de inspectie zijn, voorzover deze niet het toezicht op de naleving van bij of
      krachtens een onderwijswet als bedoeld in [artikel 1, onderdeel d, sub 1][ref1], gegeven voorschriften betreffen,
      de [artikelen 5:12 tot en met 5:17][ref2] en [5:20 van de Algemene wet bestuursrecht][ref3] van overeenkomstige
      toepassing.

      2 De bevoegdheden, bedoeld in de artikelen genoemd in het eerste lid, worden uitgeoefend door daartoe door Onze
      Minister aangewezen personen.

      3 Van een besluit als bedoeld in het tweede lid wordt mededeling gedaan in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel1
