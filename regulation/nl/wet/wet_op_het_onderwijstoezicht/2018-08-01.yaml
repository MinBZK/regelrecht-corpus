  - number: 24c.3
    text: |-
      De persoonsgegevens van de leerlingen, deelnemers, studenten en extraneï die niet langer zijn ingeschreven aan
      een school of instelling als bedoeld in het eerste lid, onderdelen a tot en met f1, worden tot vijf jaren na
      beëindiging van de laatste inschrijving bewaard in het basisregister onderwijs in een vorm die het mogelijk
      maakt de betrokkene te identificeren. In afwijking van de eerste volzin geldt voor de geslachtsnaam, voornamen,
      geboortedatum, instelling voor hoger onderwijs waar een opleiding is gevolgd, naam van die opleiding, datum diploma
      en het aantal jaren genoten hoger onderwijs van studenten die niet langer zijn ingeschreven aan een instelling als
      bedoeld in het eerste lid, onderdelen f en f1, een bewaartermijn van vijftig jaren.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24c
  - number: 24d
    text: |-
      Uit het basisregister onderwijs kunnen persoonsgegevens worden verstrekt aan de betrokkene en diens wettelijke
      vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24d
  - number: 24e
    text: |-
      Uit het basisregister onderwijs kunnen persoonsgegevens worden verstrekt aan Onze Minister en de inspectie voor
      zover dat noodzakelijk is voor de uitoefening van hun wettelijke taken.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24e
  - number: 24f.1
    text: 'Uit het basisregister onderwijs kunnen persoonsgegevens worden verstrekt aan:'
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24f
  - number: 24f.1.a
    text: |-
      de school of instelling waar de betrokkene als leerling, deelnemer, student of extraneus is of was ingeschreven,
      voor zover de gegevens betrekking hebben op de periode waarin hij aan de desbetreffende school of instelling is of
      was ingeschreven, en
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24f
  - number: 24f.1.b
    text: |-
      de school of instelling waar de betrokkene als leerling, deelnemer of extraneus is ingeschreven, voor zover de
      gegevens betrekking hebben op de periode waarin hij aan een andere school of instelling was ingeschreven.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24f
  - number: 24f.1a
    text: |-
      Uit het basisregister onderwijs kunnen aan de in [artikel 24b, eerste lid, onderdelen d en e][ref1], genoemde
      instellingen tevens de in die onderdelen bedoelde gegevens worden verstrekt.


