      - id: ref2
        bwb_id: BWBR0002399
        artikel: 103b
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '58'
  - number: 24c.1.d
    text: |-
      de persoonsgebonden nummers van de deelnemers aan een opleiding voortgezet algemeen volwassenenonderwijs
      die zijn ingeschreven of ingeschreven zijn geweest aan een instelling als bedoeld in
      [artikel 1.1.1, onder b1°, van de Wet educatie en beroepsonderwijs][ref1] alsmede deelnemers aan een opleiding
      educatie die zijn ingeschreven of ingeschreven zijn geweest aan een instelling waaraan door het gemeentebestuur
      op grond van [artikel 3 van de Wet participatiebudget][ref2] uitkeringen zijn toegekend, tezamen met de andere
      gegevens, genoemd in [artikel 2.3.6a, tweede en vijfde lid, van de Wet educatie en beroepsonderwijs][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0025039#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24c
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0025039
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '2'
  - number: 24c.1.d1
    text: |-
      de persoonsgebonden nummers van de deelnemers aan een opleiding educatie die zijn ingeschreven of ingeschreven
      zijn geweest aan een andere dan een in [artikel 1.1.1, onderdeel b, van de Wet educatie en beroepsonderwijs][ref1]
      bedoelde instelling of een instelling als bedoeld in die wet voor een opleiding educatie ten aanzien waarvan
      toepassing is gegeven aan [artikel 1.4a.1, eerste lid, van de Wet educatie en beroepsonderwijs][ref2], tezamen
      met de andere gegevens, bedoeld in [artikel 2.3.6a, tweede en vijfde lid][ref3], in samenhang met artikel 1.4a.1,
      achtste lid, onderdeel a, van die wet;


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24c
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
