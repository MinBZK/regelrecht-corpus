  - number: 24f.4
    text: |-
      In afwijking van het derde lid worden van degenen die wel voldoen aan het derde lid, onderdelen a en b, maar die
      niet voldoen aan het derde lid, onderdeel c, de in de aanhef van het derde lid bedoelde gegevens aan burgemeester
      en wethouders verstrekt, indien dit de eerste verstrekking uit het basisregister onderwijs aan burgemeester en
      wethouders betreft waaruit blijkt dat diegenen niet voldoen aan het derde lid, onderdeel c.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24f
  - number: 24f.5
    text: |-
      Uit het basisregister onderwijs worden persoonsgegevens verstrekt aan door Onze Minister aangewezen instellingen
      ten behoeve van onderzoeksactiviteiten naar de kwaliteit en de toegankelijkheid van het beroepsonderwijs, de
      educatie en het hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24f
