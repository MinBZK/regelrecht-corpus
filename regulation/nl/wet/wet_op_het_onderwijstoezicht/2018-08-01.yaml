  - number: 3.2.e
    text: |-
      de bestuurlijke boete op te leggen, bedoeld in [artikel 27 van de Leerplichtwet 1969][ref1] en in
      [artikel 15.7 tot en met 15.9 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2]; of


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel15
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel3
