  - number: 24f.7
    text: |-
      Uit het basisregister onderwijs worden kosteloos persoonsgegevens aan het Centraal bureau voor de statistiek
      verstrekt. Het Centraal bureau voor de statistiek gebruikt deze gegevens in ieder geval om:
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24f
  - number: 24f.7.a
    text: Onze Minister gegevens te verstrekken ten behoeve van de beleidsvoorbereiding; en
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24f
  - number: 24f.7.b
    text: |-
      de gemeenten gegevens te verstrekken ten behoeve van de toekenning van uitkeringen, bedoeld in
      [artikel 2 van de Wet participatiebudget][ref1], aan instellingen, en ten behoeve van de begrotings- en
      beleidsvoorbereiding inzake de gemeentelijke taken op het gebied van het onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0025039#Artikel2
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24f
    references:
      - id: ref1
        bwb_id: BWBR0025039
        artikel: '2'
  - number: 24f.8
    text: |-
      Het Centraal bureau voor de statistiek kan de gegevens die het op grond van het zevende lid
      heeft ontvangen, alsmede de daaraan door het Centraal bureau voor de statistiek gekoppelde
      gegevens van belang voor statistische doeleinden op het gebied van arbeid als bedoeld in
      [artikel 33, tweede lid, onderdeel e, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], openbaar
      maken in de vorm van overzichten die betrekking hebben op afzonderlijke scholen, instellingen of opleidingen, mits
      aan deze overzichten geen herkenbare gegevens over een afzonderlijk persoon of een afzonderlijk huishouden kunnen
      worden ontleend.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel33
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24f
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '33'
  - number: 24f.9
    text: |-
      Uit het basisregister onderwijs worden desgevraagd kosteloos persoonsgegevens verstrekt aan de
      rijksbelastingdienst, voor zover dat noodzakelijk is voor de uitvoering van de wetgeving op het gebied van
      rijksbelastingen zoals bedoeld in [artikel 1, tweede lid, van de Algemene wet inzake rijksbelastingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel1
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24f
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '1'
  - number: 24f.10
    text: |-
      Uit het basisregister onderwijs worden kosteloos aan de Samenwerkingsorganisatie beroepsonderwijs
      bedrijfsleven, bedoeld in [artikel 1.5.1 van de Wet educatie en beroepsonderwijs][ref1] de gegevens, bedoeld in
      [artikel 2.5.5a, tweede lid, onderdelen c, d, i en j, van die wet][ref2], alsmede de leeftijd van de deelnemer bij
      aanvang van de beroepspraktijkvorming verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24f
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
  - number: 24f.11
    text: |-
      Uit het basisregister onderwijs worden desgevraagd kosteloos persoonsgegevens en andere gegevens verstrekt aan Onze
      Minister van Sociale Zaken en Werkgelegenheid voor zover dit noodzakelijk is voor de uitvoering van zijn taken op
      grond van de [Wet inburgering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020611
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24f
    references:
      - id: ref1
        bwb_id: BWBR0020611
  - number: 24f.12
    text: |-
      Uit het basisregister onderwijs worden aan burgemeester en wethouders ter uitvoering van de taak, bedoeld in
      [artikel 5 van de Wet publieke gezondheid][ref1], periodiek desgevraagd de volgende gegevens verstrekt van de
      leerlingen of deelnemers tot 18 jaar, die onderwijs volgen binnen de gemeente:


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel5
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24f
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '5'
  - number: 24f.12.a)
    text: het persoonsgebonden nummer en de naam van de leerling of deelnemer;
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24f
  - number: 24f.12.b)
    text: de geboortedatum van de leerling of deelnemer;
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24f
  - number: 24f.12.c)
    text: |-
      het registratienummer van de instelling waar de leerling of deelnemer is ingeschreven of, indien er sprake is van
      een nevenvestiging of tijdelijke vestiging, het registratienummer daarvan;
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24f
  - number: 24f.12.d)
    text: het soort onderwijs;
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24f
  - number: 24f.12.e)
    text: de datum van inschrijving in het leerjaar of onderwijstype;
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24f
  - number: 24f.12.f)
    text: de groep.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24f
  - number: 24f.13
    text: |-
      Aan de instellingen en organen, genoemd in het eerste tot en met twaalfde lid, wordt geen rechtstreekse toegang tot
      het basisregister verleend.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24f
  - number: 24f.14
    text: |-
      Onze Minister verstrekt uit het basisregister onderwijs geen persoonsgebonden nummer van een leerling, deelnemer,
      student of extraneus ter uitvoering van [artikel 107, tweede lid, van de Vreemdelingenwet 2000][ref1], tenzij deze
      gegevens noodzakelijk zijn voor nakoming van verplichtingen als referent in de zin van [die wet][ref2] dan wel voor
      het toezicht op de naleving van de wettelijke voorschriften met betrekking tot referenten in de zin van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24f
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
      - id: ref2
        bwb_id: BWBR0011823
  - number: 24f.15
    text: |-
      Uit het basisregister worden aan het meldingsregister relatief verzuim toegevoegd de persoonsgebonden nummers van
      de leerlingen en deelnemers, bedoeld in [artikel 24c, eerste lid, onderdelen a tot en met e][ref1], met van elke
      leerling of deelnemer de naam, het geslacht, de geboortedatum, het adres en het gegeven of betrokkene al dan niet
      beschikt over een startkwalificatie.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel24c
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24f
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 24c
        hoofdstuk: 6a
        paragraaf: '2'
  - number: 24f.16
    text: |-
      De toevoeging, bedoeld in het vijftiende lid, gebeurt op het moment van de kennisgeving,
      bedoeld in [artikel 21a, eerste lid, van de Leerplichtwet 1969][ref1], of de opgave,
      bedoeld in [artikel 8.1.8a, eerste lid, van de Wet educatie en beroepsonderwijs][ref2],
      [artikel 47b, eerste lid, van de Wet op de expertisecentra][ref3] en
      [artikel 28a, eerste lid, van de Wet op het voortgezet onderwijs][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel21a
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel47b
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel28a
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24f
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: 21a
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: 47b
      - id: ref4
        bwb_id: BWBR0002399
        artikel: 28a
  - number: 24f.17
    text: |-
      Uit het basisregister onderwijs worden aan het samenwerkingsverband met betrekking tot leerlingen die door het
      samenwerkingsverband toelaatbaar zijn verklaard tot het speciaal dan wel voortgezet speciaal onderwijs verstrekt:
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24f
  - number: 24f.17.a
    text: |-
      de datum van in- of uitschrijving op een school voor speciaal onderwijs, een school voor voortgezet speciaal
      onderwijs of een school voor speciaal en voortgezet speciaal onderwijs behorend tot cluster 3 en 4, bedoeld in de
      [Wet op de expertisecentra][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24f
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: 24f.17.b
    text: het registratienummer van de school of, indien sprake is van een nevenvestiging, het registratienummer daarvan;
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24f
  - number: 24f.17.c
    text: |-
      het registratienummer van het samenwerkingsverband dat de leerling toelaatbaar heeft verklaard tot het
      speciaal dan wel voortgezet speciaal onderwijs en het volgnummer van de toelaatbaarheidsverklaring, bedoeld in
      [artikel 40, tiende en twaalfde lid, van de Wet op de expertisecentra][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel40
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24f
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '40'
  - number: 24f.17.d
    text: |-
      de begin- en einddatum van de periode waarvoor de leerling toelaatbaar is verklaard tot het speciaal dan wel
      voortgezet speciaal onderwijs; en
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24f
  - number: 24f.17.e
    text: |-
      de bekostigingscategorie, bedoeld in de [artikelen 118, tiende lid][ref1], en
      [132, vierde lid, van de Wet op het primair onderwijs][ref2] en de [artikelen 85b, derde lid][ref3], en
      [89a, derde lid, van de Wet op het voortgezet onderwijs][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel118
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel132
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel85b
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel89a
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24f
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '118'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '132'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 85b
      - id: ref4
        bwb_id: BWBR0002399
        artikel: 89a
  - number: 24f.17
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van het derde en vierde lid.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24f
  - number: 24g
    text: |-
      Onze Minister stelt bij ministeriële regeling regels omtrent de autorisatie van degenen die onder zijn gezag vallen
      voor verwerking van persoonsgegevens uit het basisregister onderwijs.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24g
  - number: 24h.1
    text: |-
      Er is een meldingsregister relatief verzuim dat ten doel heeft burgemeester en wethouders,
      het hoofd, bedoeld in [artikel 21a van de Leerplichtwet 1969][ref1], en het bevoegd
      gezag, bedoeld in [artikel 8.1.8a van de Wet educatie en beroepsonderwijs][ref2],
      [artikel 47b van de Wet op de expertisecentra][ref3] en [artikel 28a van de Wet op het voortgezet onderwijs][ref4],
      te voorzien van de gegevens die noodzakelijk zijn voor de uitvoering van hun taken inzake:


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel21a
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel47b
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel28a
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24h
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: 21a
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: 47b
      - id: ref4
        bwb_id: BWBR0002399
        artikel: 28a
  - number: 24h.1.a
    text: |-
      het verzuim, bedoeld in [artikel 21a van de Leerplichtwet 1969][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel21a
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24h
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: 21a
  - number: 24h.1.b
    text: |-
      het zonder geldige reden niet meer volgen van het onderwijs of de educatie, bedoeld in
      [artikel 8.1.8a van de Wet educatie en beroepsonderwijs][ref1], of van het onderwijs, bedoeld in
      [artikel 47b van de Wet op de expertisecentra][ref2] en [artikel 28a van de Wet op het voortgezet onderwijs][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel47b
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel28a
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24h
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 47b
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 28a
  - number: 24h.2
    text: |-
      Met betrekking tot de verwerking van persoonsgegevens, bedoeld in deze paragraaf, is Onze Minister de
      verwerkingsverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24h
  - number: 24i.1
    text: 'In het meldingsregister relatief verzuim zijn de volgende gegevens opgenomen:'
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24i
  - number: 24i.1.a
    text: |-
      de gegevens van de leerlingen en deelnemers, bedoeld in
      [artikel 21a, eerste, tweede en zesde lid, van de Leerplichtwet 1969][ref1],
      [artikel 8.1.8a, eerste en vijfde lid, van de Wet educatie en beroepsonderwijs][ref2],
      [artikel 47b, eerste en vijfde lid, van de Wet op de expertisecentra][ref3] en
      [artikel 28a, eerste en vijfde lid, van de Wet op het voortgezet onderwijs][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel21a
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel47b
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel28a
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24i
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: 21a
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: 47b
      - id: ref4
        bwb_id: BWBR0002399
        artikel: 28a
  - number: 24i.1.b
    text: |-
      de gegevens, bedoeld in [artikel 24f, vijftiende lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel24f
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24i
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 24f
        hoofdstuk: 6a
        paragraaf: '2'
  - number: 24i.2
    text: |-
      De gegevens, bedoeld in het eerste lid, worden in het meldingsregister relatief verzuim bewaard gedurende het
      schooljaar waarin de kennisgeving, bedoeld in [artikel 21a, eerste en tweede lid, van de Leerplichtwet 1969][ref1],
      of de opgave, bedoeld in [artikel 8.1.8a, eerste lid, van de Wet educatie en beroepsonderwijs][ref2],
      [artikel 47b, eerste lid, van de Wet op de expertisecentra][ref3] en
      [artikel 28a, eerste lid, van de Wet op het voortgezet onderwijs][ref4], is gedaan en het daaropvolgende
      schooljaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel21a
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel47b
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel28a
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24i
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: 21a
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: 47b
      - id: ref4
        bwb_id: BWBR0002399
        artikel: 28a
  - number: 24j
    text: |-
      Onze Minister stelt bij ministeriële regeling regels omtrent de autorisatie van degenen die onder zijn gezag vallen
      voor verwerking van gegevens uit het meldingsregister relatief verzuim.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24j
  - number: 24k.2
    text: |-
      Uit het meldingsregister relatief verzuim worden aan Onze Minister gegevens verstrekt ten behoeve van de
      beleidsvorming ten aanzien van de taken, bedoeld in [artikel 24h, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel24h
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24k
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 24h
        hoofdstuk: 6a
        paragraaf: '3'
  - number: 24k.3
    text: |-
      Bij de verstrekking, bedoeld in het tweede lid, kunnen persoonsgegevens worden verwerkt, indien dat noodzakelijk
      is voor de in het tweede lid genoemde doelen, onverminderd de verplichting voor de verwerkingsverantwoordelijke
      om passende technische en organisatorische maatregelen te treffen als bedoeld in artikel 25 van de Algemene
      verordening gegevensbescherming.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24k
  - number: 24k.4
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van het tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24k
  - number: 24k.5
    text: |-
      Uit het meldingsregister relatief verzuim worden kosteloos gegevens verstrekt aan burgemeester en wethouders,
      het hoofd, bedoeld in [artikel 21a van de Leerplichtwet 1969][ref1], en het bevoegd gezag, bedoeld in
      [artikel 8.1.8a van de Wet educatie en beroepsonderwijs][ref2], [artikel 47b van de Wet op de expertisecentra][ref3]
      en [artikel 28a van de Wet op het voortgezet onderwijs][ref4], voor zover dat bij wet is vereist of toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel21a
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel47b
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel28a
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24k
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: 21a
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: 47b
      - id: ref4
        bwb_id: BWBR0002399
        artikel: 28a
  - number: 24k.6
    text: |-
      Onze Minister verstrekt uit het meldingsregister relatief verzuim geen persoonsgebonden nummers ter uitvoering van
      [artikel 107, tweede lid, van de Vreemdelingenwet 2000][ref1], tenzij deze gegevens noodzakelijk zijn voor nakoming
      van verplichtingen als referent in de zin van [die wet][ref2] dan wel voor het toezicht op de naleving van de
      wettelijke voorschriften met betrekking tot referenten in de zin van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24k
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
      - id: ref2
        bwb_id: BWBR0011823
  - number: 24k1
    text: |-
      De [artikelen 24h tot en met 24k][ref1] zien mede op beroepsopleidingen ten aanzien waarvan toepassing is gegeven
      aan [artikel 1.4.1, eerste lid, van de Wet educatie en beroepsonderwijs][ref2], opleidingen educatie ten aanzien
      waarvan toepassing is gegeven aan [artikel 1.4a.1, eerste lid, van die wet][ref3], en scholen die zijn aangewezen
      op grond van [artikel 56 van de Wet op het voortgezet onderwijs][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel24h
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel56
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24k1
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 24h
        hoofdstuk: 6a
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0002399
        artikel: '56'
  - number: 24k2.1
    text: 'Er is een register vrijstellingen en vervangende leerplicht dat ten doel heeft:'
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24k2
  - number: 24k2.1.a
    text: |-
      burgemeester en wethouders te voorzien van de gegevens die noodzakelijk zijn voor de uitvoering van de taken inzake
      de handhaving van de [Leerplichtwet 1969][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24k2
    references:
      - id: ref1
        bwb_id: BWBR0002628
  - number: 24k2.1.b
    text: |-
      Onze Minister gegevens te verstrekken voor de bijstelling van het aantal voortijdig schoolverlaters zoals blijkt
      uit het basisregister onderwijs, ten behoeve van de bekostiging van scholen en instellingen en de begrotings- en
      beleidsvoorbereiding;
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24k2
  - number: 24k2.1.c
    text: |-
      ten behoeve van de beleidsvorming ten aanzien van [artikel 3a][ref1], [3b][ref2], [5 tot en met 10][ref3], en
      [15 van de Leerplichtwet 1969][ref4] landelijk en per woongemeente een overzicht te maken van:


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel3b
      [ref3]: https://wetten.overheid.nl/BWBR0002628#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0002628#Artikel15
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24k2
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: 3a
      - id: ref2
        bwb_id: BWBR0002628
        artikel: 3b
      - id: ref3
        bwb_id: BWBR0002628
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0002628
        artikel: '15'
  - number: 24k2.1.c.1°
    text: het aantal jongeren dat is vrijgesteld en het aantal jongeren met een vervangende leerplicht; en
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24k2
  - number: 24k2.1.c.2°
    text: het aantal jongeren dat eerder is vrijgesteld van de leerplicht of eerder een vervangende leerplicht heeft gehad.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24k2
  - number: 24k2.2
    text: |-
      Met betrekking tot de verwerking van persoonsgegevens, bedoeld in deze paragraaf, is Onze Minister de
      verwerkingsverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24k2
  - number: 24k3.1
    text: 'In het register vrijstellingen en vervangende leerplicht zijn de volgende gegevens opgenomen:'
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24k3
  - number: 24k3.1.a
    text: |-
      de persoonsgebonden nummers van de jongeren voor wie op grond van [artikel 5][ref1] of
      [5a van de Leerplichtwet 1969][ref2] een beroep is gedaan op vrijstelling van inschrijving als leerling van een
      school respectievelijk een instelling, met daaraan toegevoegd de aanduiding «vrijgesteld», de begin- en einddatum
      van de vrijstelling, de woongemeente en of eerder een beroep op vrijstelling is gedaan;


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel5a
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24k3
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: 5a
  - number: 24k3.1.b
    text: |-
      de persoonsgebonden nummers van de jongeren voor wie burgemeester en wethouders op grond van
      [artikel 15 van de Leerplichtwet 1969][ref1] vrijstelling verlenen van de in [artikel 4a van de Leerplichtwet][ref2]
      opgelegde verplichtingen, met daaraan toegevoegd de aanduiding «vrijgesteld», de begin- en einddatum van de
      vrijstelling, de woongemeente en of eerder een beroep op vrijstelling is gedaan;


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel4a
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24k3
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: 4a
  - number: 24k3.1.c
    text: |-
      de persoonsgebonden nummers van de jongeren voor wie burgemeester en wethouders instemmen met het verzoek, bedoeld
      in [artikel 3a, eerste lid][ref1] of [3b, eerste lid][ref2], met daaraan toegevoegd de aanduiding «vervangende
      leerplicht», de begin- en einddatum van de vervangende leerplicht, de woongemeente en of eerder vervanging van de
      leerplicht is toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel3b
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24k3
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: 3a
      - id: ref2
        bwb_id: BWBR0002628
        artikel: 3b
  - number: 24k3.2
    text: |-
      De gegevens, bedoeld in het eerste lid, worden tot één jaar na de datum waarop de vrijstelling of de vervangende
      leerplicht afloopt in het register vrijstellingen en vervangende leerplicht bewaard.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24k3
  - number: 24k4
    text: |-
      [Artikel 24j][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel24j
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24k4
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 24j
        hoofdstuk: 6a
        paragraaf: '3'
  - number: 24k5.1
    text: |-
      Uit het register vrijstellingen en vervangende leerplicht kunnen persoonsgegevens worden verstrekt aan de
      betrokkene en diens wettelijke vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24k5
  - number: 24k5.2
    text: |-
      Uit het register vrijstellingen en vervangende leerplicht worden aan Onze Minister de persoonsgebonden nummers
      verstrekt van jongeren die op grond van [artikel 5][ref1], [5a][ref2] en [15 van de Leerplichtwet 1969][ref3] zijn
      vrijgesteld van de leerplicht.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0002628#Artikel15
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24k5
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: 5a
      - id: ref3
        bwb_id: BWBR0002628
        artikel: '15'
  - number: 24k5.3
    text: |-
      Uit het register vrijstellingen en vervangende leerplicht wordt jaarlijks op 1 oktober aan Onze Minister een
      opsomming verstrekt van het landelijk en per woongemeente aantal:
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24k5
  - number: 24k5.3.a
    text: jongeren die eerder een beroep op vrijstelling hebben gedaan;
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24k5
  - number: 24k5.3.b
    text: overige vrijgestelde jongeren;
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24k5
  - number: 24k5.3.c
    text: jongeren waarbij eerder vervangende leerplicht is toegestaan; en
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24k5
  - number: 24k5.3.d
    text: overige jongeren met een vervangende leerplicht.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24k5
  - number: 24k5.4
    text: 'Onze Minister gebruikt de persoonsgebonden nummers, bedoeld in het tweede lid, ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24k5
  - number: 24k5.4.a
    text: de bijstelling van het aantal voortijdig schoolverlaters zoals blijkt uit het basisregister onderwijs;
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24k5
  - number: 24k5.4.b
    text: de controle of de jongere blijkens het basisregister onderwijs staat ingeschreven bij een school of instelling.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24k5
  - number: 24k5.5
    text: |-
      Indien uit het basisregister onderwijs aan Onze Minister op grond van het vierde lid, onder b, is gebleken dat een
      jongere die op grond van [artikel 5][ref1], [5a][ref2] of [15 van de Leerplichtwet 1969][ref3] is vrijgesteld van
      de leerplicht staat ingeschreven bij een school of instelling, meldt Onze Minister aan het bevoegd gezag van de
      betreffende school of instelling dat de jongere is vrijgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0002628#Artikel15
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24k5
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: 5a
      - id: ref3
        bwb_id: BWBR0002628
        artikel: '15'
  - number: 24k5.6
    text: |-
      Uit het register vrijstellingen en vervangende leerplicht worden kosteloos gegevens verstrekt aan burgemeester
      en wethouders.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24k5
  - number: 24k5.7
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24k5
  - number: 24l
    text: |-
      In dit hoofdstuk wordt verstaan onder: - *diplomaregister:* diplomaregister, bedoeld in [artikel 24m][ref1];
        - *diplomagegevens:* gegevens, bedoeld in [artikel 24o][ref2];
        - *betrokkene:* betrokkene als bedoeld in artikel 4, onderdeel 1, van de Algemene verordening gegevensbescherming;
        - *derde:* derde als bedoeld in artikel 4, onderdeel 10, van de Algemene verordening gegevensbescherming;
        - *waardedocument:* een getuigschrift, diploma, cijferlijst of certificaat als bedoeld in [artikel 24n][ref3];
        - *College voor examens:* College voor examens, genoemd in [artikel 2 van de Wet College voor examens][ref4], of
      één van diens rechtsvoorgangers, genoemd in [artikel 12 van die wet][ref5], op het gebied van staatsexamens;
        - *afsluitend examen:* het examen, bedoeld in
      [artikel 7.10a van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref6] en het examen van een
      opleiding van de Open Universiteit, voor zover dit examen door die [wet][ref7] daarmee gelijk wordt gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel24m
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel24o
      [ref3]: https://wetten.overheid.nl/BWBR0013800#Artikel24n
      [ref4]: https://wetten.overheid.nl/BWBR0025364#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0025364#Artikel12
      [ref6]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref7]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24l
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 24m
        hoofdstuk: 6b
      - id: ref2
        bwb_id: BWBR0013800
        artikel: 24o
        hoofdstuk: 6b
      - id: ref3
        bwb_id: BWBR0013800
        artikel: 24n
        hoofdstuk: 6b
      - id: ref4
        bwb_id: BWBR0025364
        artikel: '2'
      - id: ref5
        bwb_id: BWBR0025364
        artikel: '12'
      - id: ref6
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref7
        bwb_id: BWBR0005682
  - number: 24m.1
    text: |-
      Er is een diplomaregister hoger onderwijs, beroepsonderwijs, voortgezet (algemeen volwassenen)onderwijs,
      inburgering en Nederlands als tweede taal, dat ten doel heeft diplomagegevens te verstrekken aan:
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24m
  - number: 24m.1.a
    text: de betrokkene;
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24m
  - number: 24m.1.b
    text: |-
      de instelling of school, bedoeld in [artikel 24n][ref1], of de school of afdeling voor voortgezet speciaal
      onderwijs, waarbij de betrokkene is ingeschreven of minder dan vijf jaar voor de gegevensverstrekking was
      ingeschreven;


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel24n
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24m
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 24n
        hoofdstuk: 6b
  - number: 24m.1.c
    text: |-
      de instelling of school, bedoeld in [artikel 24n][ref1], of het College voor examens, waarbij de betrokkene minder
      dan vijf jaar voor de gegevensverstrekking een waardedocument heeft behaald;


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel24n
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24m
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 24n
        hoofdstuk: 6b
  - number: 24m.1.d
    text: |-
      een instelling of school als bedoeld in [artikel 24n][ref1], of het College voor examens, voor zover de verwerking
      van die gegevens noodzakelijk is voor de aanmelding, inschrijving of examinering van de betrokkene;


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel24n
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24m
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 24n
        hoofdstuk: 6b
  - number: 24m.1.e
    text: |-
      overheidsinstanties, voor zover de verwerking van die gegevens noodzakelijk is voor de goede vervulling van hun
      publieke taak;
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24m
  - number: 24m.1.f
    text: overige derden.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24m
  - number: 24m.2
    text: |-
      Met betrekking tot de verwerking van persoonsgegevens als bedoeld in dit hoofdstuk is Onze Minister de
      verwerkingsverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24m
  - number: 24n
    text: |-
      Behoudens [artikel 24r][ref1] omvat het diplomaregister gegevens over:


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel24r
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24n
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 24r
        hoofdstuk: 6b
