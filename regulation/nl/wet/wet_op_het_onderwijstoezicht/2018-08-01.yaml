  - number: 24f.6.a
    text: |-
      de Sociale verzekeringsbank, voor zover dat noodzakelijk is voor de uitvoering van de
      [Algemene Kinderbijslagwet][ref1] en de [Algemene nabestaandenwet][ref2];


