  - number: 24q.6
    text: |-
      Uit het diplomaregister worden desgevraagd diplomagegevens verstrekt aan Onze Minister en de inspectie voor
      zover dat noodzakelijk is voor de uitoefening van hun wettelijke taken. Voor zover het betreft het gebruik door
      Onze Minister voor de begrotings- en beleidsvoorbereiding, kunnen persoonsgegevens worden verwerkt, indien dit
      noodzakelijk is voor de voornoemde doelen, onverminderd de verplichting voor de verwerkingsverantwoordelijke
      om passende technische en organisatorische maatregelen te treffen als bedoeld in artikel 25 van de Algemene
      verordening gegevensbescherming. [Artikel 24f, zevende en achtste lid][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel24f
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24q
    references:
