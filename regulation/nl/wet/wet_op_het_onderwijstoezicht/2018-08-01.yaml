      het Uitvoeringsinstituut werknemersverzekeringen, voor zover dat noodzakelijk is voor de uitvoering van de
      taken, bedoeld in [artikel 30, eerste lid][ref1], [30a, eerste en tweede lid][ref2], [30b][ref3], [30d][ref4] en
      [31 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel30b
      [ref4]: https://wetten.overheid.nl/BWBR0013060#Artikel30d
      [ref5]: https://wetten.overheid.nl/BWBR0013060#Artikel31
