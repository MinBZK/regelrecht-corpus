        artikel: '15'
  - number: 3.2.f
    text: te beslissen op een tegen een besluit als bedoeld in de onderdelen a tot en met e ingediend bezwaarschrift.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel3
  - number: '4.1'
    text: De inspectie verricht haar taken met inachtneming van de vrijheid van onderwijs.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel4
  - number: '4.2'
    text: |-
      De inspectie verricht haar taken op zodanige wijze dat instellingen niet meer worden belast dan voor een
      zorgvuldige uitoefening van het toezicht noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel4
  - number: '4.3'
    text: |-
      De intensiteit van de taakuitoefening is afhankelijk van de kwaliteit van het onderwijs, van de wijze waarop
      de professionaliteit van de instelling en het bestuur is gewaarborgd, van de mate van naleving van wettelijke
      voorschriften en, voor zover deze wordt bekostigd uit ’s Rijks kas, van de financiële situatie van de instelling.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel4
  - number: '4.4'
    text: |-
      De taakuitoefening van de inspectie is er mede op gericht betrokkenen te informeren over de ontwikkeling, in het
      bijzonder van de kwaliteit, van het onderwijs.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel4
  - number: '5'
    text: |-
      Bij de uitoefening van het toezicht op opleidingen, gericht op een beroep waarvoor bij of krachtens de wet
      vereisten zijn gesteld op het gebied van kennis, inzicht, vaardigheden en in voorkomende gevallen beroepshoudingen,
      waarover degene die de opleiding voltooit, met het oog op het beroepsmatig functioneren dient te beschikken, pleegt
      de inspectie overleg met door Onze Minister wie het aangaat, aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel5
  - number: '6.1'
    text: 'Bij de inspectie zijn vertrouwensinspecteurs werkzaam voor:'
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel6
  - number: 6.1.a
    text: |-
      onderwijsdeelnemers die het slachtoffer zijn van seksueel misbruik, seksuele intimidatie, fysiek geweld, psychisch
      geweld, discriminatie of radicalisering, gepleegd door een ten behoeve van de instelling met taken belast persoon
      of een onderwijsdeelnemer van de instelling,
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel6
  - number: 6.1.b
    text: |-
      ten behoeve van een instelling met taken belaste personen die het slachtoffer zijn van seksueel misbruik, seksuele
      intimidatie, fysiek geweld, psychisch geweld, discriminatie of radicalisering, gepleegd door een ten behoeve van de
      instelling met taken belast persoon of een onderwijsdeelnemer van de instelling, en
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel6
  - number: 6.1.c
    text: |-
      onderwijsdeelnemers, ten behoeve van een instelling met taken belaste personen, besturen, ouders, op instellingen
      ingestelde klachtencommissies en op instellingen aangestelde vertrouwenspersonen, die geconfronteerd worden met een
      geval van seksueel misbruik, seksuele intimidatie, fysiek geweld, psychisch geweld, discriminatie of radicalisering
      als bedoeld onder a of b.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel6
  - number: '6.2'
    text: |-
      Naast zijn taken, voortvloeiend uit [artikel 3][ref1], heeft de vertrouwensinspecteur ten behoeve van de in het
      eerste lid genoemde personen en organen de volgende taken:


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel3
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '3'
        hoofdstuk: '2'
  - number: 6.2.a
    text: het fungeren als aanspreekpunt,
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel6
  - number: 6.2.b
    text: het adviseren over eventueel te nemen stappen,
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel6
  - number: 6.2.c
    text: het bijstaan bij het nemen van stappen gericht op het zoeken naar een oplossing, en
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel6
  - number: 6.2.d
    text: het desgevraagd begeleiden bij het indienen van een klacht of het doen van aangifte.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel6
  - number: '6.3'
    text: |-
      De vertrouwensinspecteur is, voorzover het betreft misdrijven als bedoeld in
      [titel XIV van het Wetboek van Strafrecht][ref1] of [titel XIV van het Wetboek van Strafrecht BES][ref2]
      jegens een onderwijsdeelnemer of een ten behoeve van een instelling met taken belast persoon, vrijgesteld
      van de verplichting tot het doen van aangifte als bedoeld in de [artikelen 160, eerste lid][ref3], en
      [162, eerste lid, van het Wetboek van Strafvordering][ref4] of de [artikelen 198, eerste lid][ref5], en
      [200, eerste lid, van het Wetboek van Strafvordering BES][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0001854
      [ref2]: https://wetten.overheid.nl/BWBR0028681
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel160
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel162
      [ref5]: https://wetten.overheid.nl/BWBR0028681#Artikel198
      [ref6]: https://wetten.overheid.nl/BWBR0028681#Artikel200
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001854
      - id: ref2
        bwb_id: BWBR0028681
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '160'
      - id: ref4
        bwb_id: BWBR0001903
        artikel: '162'
      - id: ref5
        bwb_id: BWBR0028681
        artikel: '198'
      - id: ref6
        bwb_id: BWBR0028681
        artikel: '200'
  - number: '6.4'
    text: |-
      De vertrouwensinspecteur is voorzover het betreft een geval van seksueel misbruik of seksuele intimidatie als
      bedoeld in het eerste lid, onder a of b, verplicht tot geheimhouding van hetgeen hem in de uitoefening van zijn
      functie is toevertrouwd door een onderwijsdeelnemer, de ouders van een onderwijsdeelnemer of een ten behoeve van
      een instelling met taken belast persoon.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel6
  - number: '6.5'
    text: |-
      De vertrouwensinspecteur is bevoegd bijzondere categorieën van persoonsgegevens en
      persoonsgegevens van strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref1] onderscheidenlijk
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2] te verwerken met betrekking
      tot de personen, bedoeld in het eerste lid, indien uit een melding redelijkerwijs een vermoeden van seksueel
      misbruik, seksuele intimidatie, psychisch geweld, fysiek geweld, discriminatie of radicalisering kan worden
      afgeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: '6.6'
    text: |-
      De vertrouwensinspecteur verstrekt de door hem verzamelde gegevens niet aan derden. In het verslag over de staat
      van het onderwijs, bedoeld in [artikel 8, tweede lid][ref1], worden slechts geabstraheerde gegevens opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel8
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '8'
        hoofdstuk: '2'
  - number: '6.7'
    text: |-
      In afwijking van het zesde lid is de vertrouwensinspecteur bevoegd rechtstreeks onder de verantwoordelijkheid van
      Onze Minister van Veiligheid en Justitie vallende instanties in kennis te stellen van een geval of vermoeden van
      een geval van psychisch geweld, fysiek geweld, discriminatie of radicalisering:
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel6
  - number: 6.7.a
    text: in het belang van de onderwijsdeelnemers,
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel6
  - number: 6.7.b
    text: in het belang van ten behoeve van een instelling met taken belaste personen, of
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel6
  - number: 6.7.c
    text: indien de ernst van de situatie waarop de melding betrekking heeft daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel6
  - number: 6a.1
    text: |-
      De inspectie fungeert als aanspreekpunt voor ten behoeve van een instelling met taken belaste personen die van
      oordeel zijn dat de instelling tekortschiet in de naleving van wettelijke voorschriften ten gevolge van het
      gevoerde personeelsbeleid.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel6a
  - number: 6a.2
    text: |-
      De inspectie beoordeelt of uit hetgeen haar op grond van het eerste lid ter kennis is gebracht een redelijk
      vermoeden voortvloeit dat de instelling tekortschiet in de naleving van wettelijke voorschriften.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel6a
  - number: 6a.3
    text: De inspectie is verplicht tot geheimhouding van hetgeen haar op grond van het eerste lid is toevertrouwd.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel6a
  - number: '7.1'
    text: De inspectie stelt jaarlijks een jaarwerkplan vast. Het jaarwerkplan behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel7
  - number: '7.2'
    text: |-
      De goedkeuring, bedoeld in het eerste lid, wordt niet eerder verleend dan vier weken nadat het ontwerp van het
      jaarwerkplan aan de Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel7
  - number: '8.1'
    text: |-
      De inspectie rapporteert desgevraagd en uit eigen beweging aan Onze Minister over de ontwikkeling, in het bijzonder
      van de kwaliteit, van het onderwijs en doet op grond daarvan voorstellen die zij in het belang van het onderwijs
      nodig acht.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel8
  - number: '8.2'
    text: |-
      De inspectie stelt jaarlijks uiterlijk de derde woensdag van mei het verslag over de staat van het onderwijs,
      bedoeld in [artikel 23, achtste lid, van de Grondwet][ref1] vast. Onze Minister zendt het verslag, vergezeld van
      een reactie, namens de regering onverwijld aan de Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel23
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '23'
  - number: '8.3'
    text: |-
      Onze Minister geeft geen aanwijzingen met betrekking tot de in de rapportages neergelegde oordelen van de inspectie
      over de ontwikkeling, in het bijzonder van de kwaliteit, van het onderwijs.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel8
  - number: '8.4'
    text: |-
      Indien een rapportage als bedoeld in het eerste lid, of een deel daarvan, specifiek het onderwijs in de Friese
      taal of het onderwijs in de Friese taal en cultuur betreft op het geheel aan scholen in het primair onderwijs,
      voortgezet onderwijs onderscheidenlijk speciaal onderwijs, zendt de inspectie, tegelijkertijd met verzending aan
      Onze Minister, die rapportage onderscheidenlijk dat deel, in afschrift aan gedeputeerde staten van Fryslân.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel8
  - number: '9.1'
    text: |-
      Bij de uitoefening van de taken van de inspectie zijn, voorzover deze niet het toezicht op de naleving van bij of
      krachtens een onderwijswet als bedoeld in [artikel 1, onderdeel d, sub 1][ref1], gegeven voorschriften betreffen,
      de [artikelen 5:12 tot en met 5:17][ref2] en [5:20 van de Algemene wet bestuursrecht][ref3] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '9.2'
    text: |-
      De bevoegdheden, bedoeld in de artikelen genoemd in het eerste lid, worden uitgeoefend door daartoe door Onze
      Minister aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel9
  - number: '9.3'
    text: Van een besluit tot aanwijzing als bedoeld in het tweede lid wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel9
  - number: '9.4'
    text: |-
      De kosten die samenhangen met de uitoefening van het toezicht op de naleving van de [artikelen 1.19][ref1] en
      [1.19a van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2], komen ten laste van de instelling
      voor hoger onderwijs ten behoeve waarvan de uitoefening van het toezicht plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '1'
  - number: '9.5'
    text: De bedragen ter vergoeding van de kosten worden bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel9
  - number: '10'
    text: |-
      De [artikelen 11][ref1], [12][ref2] en [15][ref3] zijn niet van toepassing op de instellingen voor hoger onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0013800#Artikel15
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '11'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '12'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0013800
        artikel: '15'
        hoofdstuk: '3'
  - number: '11.1'
    text: |-
      Ter uitvoering van de in [artikel 3, eerste lid, onderdelen a tot en met c][ref1], bedoelde taken onderzoekt de
      inspectie jaarlijks met inachtneming van [artikel 4][ref2] het onderwijs aan elke instelling. Naar aanleiding van
      het onderzoek geeft de inspectie een oordeel over de naleving van wettelijke voorschriften door de instelling en
      maakt zij aan de instelling haar bevindingen bekend over de ontwikkeling, in het bijzonder van de kwaliteit, van
      het onderwijs aan de instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel4
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '4'
        hoofdstuk: '2'
  - number: '11.2'
    text: |-
      De inspectie verricht het onderzoek aan de hand van de bij of krachtens een onderwijswet gegeven
      voorschriften en, indien het betreft een instelling als bedoeld in de [Wet op het primair onderwijs][ref1], de
      [Wet op de expertisecentra][ref2] of de [Wet op het voortgezet onderwijs][ref3], aan de hand van de volgende
      indicatoren:


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003549
      - id: ref3
        bwb_id: BWBR0002399
  - number: 11.2.a
    text: schoolplan,
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel11
  - number: 11.2.b
    text: leerresultaten en de voortgang in de ontwikkeling van leerlingen,
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel11
  - number: 11.2.c
    text: monitor inzake de veiligheid van leerlingen op school,
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel11
  - number: 11.2.d
    text: informatie uit de jaarstukken, met inbegrip van het financieel jaarverslag,
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel11
  - number: 11.2.e
    text: |-
      beschikbare signalen over mogelijke knelpunten, waaronder het gevoerde personeelsbeleid, voor zover daar op grond
      van [artikel 6a, eerste en tweede lid][ref1], aanleiding toe bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel6a
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 6a
        hoofdstuk: '2'
  - number: '11.3'
    text: |-
      Indien uit het onderzoek, bedoeld in het tweede lid, een redelijk vermoeden voortvloeit dat de instelling
      tekortschiet in de naleving van wettelijke voorschriften, stelt de inspectie nader onderzoek in, waarbij tevens
      de oorzaken van het tekortschieten worden onderzocht. Dit nader onderzoek verricht zij, indien het betreft een
      instelling als bedoeld in de [Wet op het primair onderwijs][ref1], de [Wet primair onderwijs BES][ref2], de Wet op
      de [expertisecentra][ref3], de [Wet op het voortgezet onderwijs][ref4] of de [Wet voortgezet onderwijs BES][ref5],
      aan de hand van het schoolplan.


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0030280
      [ref3]: https://wetten.overheid.nl/BWBR0003549
      [ref4]: https://wetten.overheid.nl/BWBR0002399
      [ref5]: https://wetten.overheid.nl/BWBR0030284
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0030280
      - id: ref3
        bwb_id: BWBR0003549
      - id: ref4
        bwb_id: BWBR0002399
      - id: ref5
        bwb_id: BWBR0030284
  - number: '11.4'
    text: |-
      Indien de inspectie naar aanleiding van het onderzoek, bedoeld in het derde lid, oordeelt dat de instelling
      tekortschiet in de naleving van wettelijke voorschriften verricht zij na ten hoogste één jaar onderzoek naar de
      verbeteringen die de instelling heeft gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel11
  - number: '11.5'
    text: |-
      De inspectie stelt het bestuur in kennis van de datum en het doel van een onderzoek, bedoeld in het derde of vierde
      lid. Kennisgeving geschiedt ten minste vier weken voor aanvang van een onderzoek. Indien de inspectie dit nodig
      oordeelt, verricht zij onderzoek zonder deze kennisgeving.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel11
  - number: '11.6'
    text: |-
      Bij de uitvoering van een onderzoek, bedoeld in het derde of vierde lid, kan de inspectie onafhankelijke
      deskundigen betrekken.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel11
  - number: '11.7'
    text: |-
      Het tweede lid, onderdeel e, is van overeenkomstige toepassing op de instellingen, bedoeld in de
      [Wet educatie en beroepsonderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: '11.8'
    text: |-
      De inspectie bezoekt ten minste elke vier jaar een representatief aantal van de onder een bestuur ressorterende
      instellingen. Bij dit periodiek instellingsbezoek verricht zij, indien het betreft een instelling als bedoeld in de
      [Wet op het primair onderwijs][ref1], de [Wet primair onderwijs BES][ref2], de [Wet op de expertisecentra][ref3],
      de [Wet op het voortgezet onderwijs][ref4] of de [Wet voortgezet onderwijs BES][ref5], het onderzoek aan de hand
      van het schoolplan.


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0030280
      [ref3]: https://wetten.overheid.nl/BWBR0003549
      [ref4]: https://wetten.overheid.nl/BWBR0002399
      [ref5]: https://wetten.overheid.nl/BWBR0030284
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0030280
      - id: ref3
        bwb_id: BWBR0003549
      - id: ref4
        bwb_id: BWBR0002399
      - id: ref5
        bwb_id: BWBR0030284
  - number: 11a.1
    text: |-
      Zo spoedig mogelijk na ontvangst van de beschikking waarin is vermeld dat de bekostiging een
      aanvang zal nemen, bedoeld in [artikel 79, achtste lid, van de Wet op het primair onderwijs][ref1],
      [artikel 86, zesde lid, van de Wet op de expertisecentra][ref2],
      [artikel 66, derde lid, van de Wet op het voortgezet onderwijs][ref3], toont het bevoegd gezag bij de inspectie aan
      dat het ten aanzien van die instelling kan voldoen aan de vereisten met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel86
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel66
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '79'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '86'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '66'
  - number: 11a.1.a
    text: |-
      de bekwaamheid van degenen die onderwijs geven, bedoeld in [artikel 3 van de Wet op het primair onderwijs][ref1],
      [artikel 3 van de Wet op de expertisecentra][ref2] en [artikel 33 van de Wet op het voortgezet onderwijs][ref3], en


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel33
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '33'
  - number: 11a.1.b
    text: |-
      de voorschriften omtrent onderwijstijd gesteld op grond van de [Wet op het primair onderwijs][ref1], de
      [Wet op de expertisecentra][ref2] en de [Wet op het voortgezet onderwijs][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003549
      - id: ref3
        bwb_id: BWBR0002399
  - number: 11a.2
    text: |-
      De inspectie kan indien het bepaalde in het eerste lid daartoe aanleiding geeft overleg voeren met het bevoegd
      gezag van de instelling. Naar aanleiding van dit overleg kan de inspectie besluiten dat het bepaalde in
      [artikel 11b, tweede tot en met zesde lid][ref1], van overeenkomstige toepassing is, met dien verstande dat in
      afwijking van het derde lid bij het opstellen van de risicoanalyse het schoolplan niet wordt betrokken, en in
      afwijking van het vierde lid de risicoanalyse wordt opgesteld binnen drie maanden na het overleg, bedoeld in de
      eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel11b
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 11b
        hoofdstuk: '3'
  - number: 11b.1
    text: |-
      Binnen een maand na aanvang van de bekostiging van een instelling, bedoeld in
      [artikel 81 van de Wet op het primair onderwijs][ref1], [artikel 87 van de Wet op de expertisecentra][ref2],
      [artikel 66, vierde lid van de Wet op het voortgezet onderwijs][ref3], verstrekt de instelling aan de inspectie
      gegevens met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel87
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel66
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '81'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '87'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '66'
  - number: 11b.1.a
    text: |-
      het schoolplan, bedoeld in [artikel 12 van de Wet op het primair onderwijs][ref1],
      [artikel 21 van de Wet op de expertisecentra][ref2] en [artikel 24 van de Wet op het voortgezet onderwijs][ref3],


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel24
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '21'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '24'
  - number: 11b.1.b
    text: |-
      de bekwaamheid van degenen die onderwijs geven, bedoeld in [artikel 3 van de Wet op het primair onderwijs][ref1],
      [artikel 3 van de Wet op de expertisecentra][ref2] en [artikel 33 van de Wet op het voortgezet onderwijs][ref3], en


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel33
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '33'
  - number: 11b.1.c
    text: |-
      het voldoen aan de voorschriften omtrent onderwijstijd die gelden op grond van de
      [Wet op het primair onderwijs][ref1], de [Wet op de expertisecentra][ref2] en de
      [Wet op het voortgezet onderwijs][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003549
      - id: ref3
        bwb_id: BWBR0002399
  - number: 11b.2
    text: 'De inspectie oefent toezicht uit door middel van het opstellen van een risicoanalyse indien:'
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel11b
  - number: 11b.2.a
    text: de gegevens, bedoeld in het eerste lid, niet binnen de genoemde termijn zijn verstrekt,
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel11b
  - number: 11b.2.b
    text: de inspectie onvolkomenheden constateert in de naleving van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel11b
  - number: 11b.3
    text: |-
      Bij het opstellen van de risicoanalyse worden de onderwerpen, genoemd in het eerste lid, onderdelen a, b en c,
      betrokken.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel11b
  - number: 11b.4
    text: De risicoanalyse wordt binnen drie maanden nadat de bekostiging is aangevangen door de inspectie opgesteld.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel11b
  - number: 11b.5
    text: |-
      Binnen een maand nadat de risicoanalyse is opgesteld toont de instelling ten genoegen van de inspectie aan dat de
      onvolkomenheden, bedoeld in het tweede lid, onderdeel b, zijn hersteld.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel11b
  - number: 11b.6
    text: |-
      Indien de instelling twee maanden na het opstellen van de risicoanalyse nog steeds in gebreke is ten aanzien van de
      naleving van het eerste lid, onderdelen a, b en c, kunnen de maatregelen worden genomen die door de in het eerste
      lid, aanhef, genoemde onderwijswetten worden mogelijk gemaakt.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel11b
  - number: 11b.7
    text: |-
      Nadat het bevoegd gezag van een niet uit de openbare kas bekostigde bijzondere school overeenkomstig
      [artikel 5 van de Wet op het primair onderwijs][ref1] of [artikel 54 van de Wet op het voortgezet onderwijs][ref2]
      aan Onze Minister kennis heeft gegeven van de oprichting van de school, besluit de inspectie zo spoedig
      mogelijk na de aanvang van het onderwijs of deze onderwijsvoorziening een school is als bedoeld in
      [artikel 1, onderdeel b, subonderdeel 3, van de Leerplichtwet 1969][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel54
      [ref3]: https://wetten.overheid.nl/BWBR0002628#Artikel1
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '54'
      - id: ref3
        bwb_id: BWBR0002628
        artikel: '1'
  - number: '12.1'
    text: |-
      De inspectie gaat bij een onderzoek als bedoeld in de [artikelen 11][ref1] en [12a][ref2] uit van openbare
      verantwoordingsinformatie over de resultaten en de kwaliteit van het onderwijs, de financiële situatie van de
      instelling en de wijze waarop de professionaliteit van de instelling en het bestuur is gewaarborgd.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel12a
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '11'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: 12a
        hoofdstuk: '3'
  - number: '12.2'
    text: |-
      De informatie, bedoeld in het eerste lid, is richtinggevend voor het oordeel van de inspectie, indien deze
      voldoende actueel en betrouwbaar is.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel12
  - number: 12a.1
    text: |-
      Ter uitvoering van de in [artikel 3, eerste lid, onderdelen a en c][ref1], bedoelde taken onderzoekt de inspectie
      met inachtneming van [artikel 4][ref2] de naleving van de wettelijke voorschriften en de financiële rechtmatigheid
      bij instellingen voor hoger onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel3
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '3'
        hoofdstuk: '2'
  - number: 12a.2
    text: |-
      Ter uitvoering van de in
      [artikel 3, eerste lid, onderdeel a, subonderdeel 1°, onderdeel b, subonderdeel 4° en onderdeel c][ref1],
      bedoelde taken onderzoekt de inspectie ontwikkelingen in het stelsel van hoger onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel3
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '3'
        hoofdstuk: '2'
  - number: 12a.3
    text: |-
      Ter uitvoering van de in
      [artikel 3, eerste lid, onderdeel a, subonderdeel 1°, onderdeel b, subonderdeel 4° en onderdeel c][ref1],
      bedoelde taken kan de inspectie naar aanleiding van signalen van buitenaf die mogelijk kunnen leiden tot gevolgen
      op stelselniveau in incidentele gevallen onderzoek verrichten op aanwijzing van de Minister dan wel uit eigen
      beweging onder door Onze Minister te stellen voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel3
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '3'
        hoofdstuk: '2'
  - number: 12a.4
    text: |-
      [Artikel 11, vierde tot en met zesde lid][ref1], is van overeenkomstige toepassing. De
      [artikelen 20, eerste tot en met vijfde lid][ref2], en [21][ref3] zijn van overeenkomstige toepassing, tenzij de
      aard of omvang van het onderzoek zich tegen openbare rapportage verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0013800#Artikel21
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '11'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '20'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0013800
        artikel: '21'
        hoofdstuk: '5'
  - number: '13.1'
    text: |-
      Onze Minister stelt op voordracht van de inspectie kaders vast waarin de werkwijze voor een onderzoek
      als bedoeld in de [artikelen 11][ref1] en [12a][ref2] en voor de toepassing van de artikelen
      [11a][ref3] en [11b][ref4] is vastgelegd. In de kaders wordt onderscheid aangebracht tussen de
      in[ artikel 3, eerste lid, onderdelen a en b][ref5], bedoelde taken.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel12a
      [ref3]: https://wetten.overheid.nl/BWBR0013800#Artikel11a
      [ref4]: https://wetten.overheid.nl/BWBR0013800#Artikel11b
      [ref5]: https://wetten.overheid.nl/BWBR0013800#Artikel3
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '11'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: 12a
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0013800
        artikel: 11a
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0013800
        artikel: 11b
        hoofdstuk: '3'
      - id: ref5
        bwb_id: BWBR0013800
        artikel: '3'
        hoofdstuk: '2'
  - number: '13.2'
    text: |-
      Voorafgaand aan de voordracht, bedoeld in het eerste lid, voert de inspectie overleg met vertegenwoordigers van
      het onderwijsveld en andere betrokkenen, terwijl bij onderwerpen betrekking hebbend op de vrijheid van inrichting
      in ieder geval overleg wordt gevoerd met de erkende richtingen. Ten behoeve van het in de vorige volzin bedoelde
      overleg brengt de inspectie onderscheid aan tussen de in [artikel 3, eerste lid][ref1], bedoelde taken, en vermeldt
      zij, voor zover het de in artikel 3, eerste lid, onderdeel a bedoelde taak betreft, welke bij of krachtens een
      onderwijswet gegeven voorschriften van toepassing zijn. De inspectie maakt van het overleg een verslag, dat door
      Onze Minister aan de Staten-Generaal wordt gezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel3
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '3'
        hoofdstuk: '2'
  - number: '13.3'
    text: Een kader, bedoeld in het eerste lid wordt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel13
  - number: 13a
    text: |-
      Indien de inspectie oordeelt dat de kwaliteit van het onderwijs zeer zwak is, als bedoeld
      in [artikel 10a, eerste of vierde lid, van de Wet op het primair onderwijs][ref1],
      [artikel 19a van de Wet op de expertisecentra][ref2] en
      [artikel 23a1, eerste of vierde lid, van de Wet op het voortgezet onderwijs][ref3], informeert zij het college van
      burgemeester en wethouders van de gemeente waar de betreffende instelling gelegen is.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel19a
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel23a1
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 10a
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 19a
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 23a1
  - number: '14.1'
    text: |-
      Indien de inspectie oordeelt dat de kwaliteit van het onderwijs zeer zwak is, als bedoeld
      in [artikel 10a, eerste of vierde lid, van de Wet op het primair onderwijs][ref1],
      [artikel 19a van de Wet op de expertisecentra][ref2] en
      [artikel 23a1, eerste of vierde lid, van de Wet op het voortgezet onderwijs][ref3] dan wel de instelling
      tekortschiet in de naleving van andere wettelijke voorschriften, informeert zij Onze Minister en kan zij
      voorstellen doen over te treffen maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel19a
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel23a1
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 10a
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 19a
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 23a1
  - number: '14.2'
    text: |-
      De inspectie informeert Onze Minister indien de leerresultaten ernstig en langdurig tekortschieten
      als bedoeld in [artikel 10a, eerste lid, van de Wet op het primair onderwijs][ref1] of
      [artikel 23a1, eerste lid, van de Wet op het voortgezet onderwijs][ref2], en uit het onderzoek naar de
      kwaliteitsverbeteringen, bedoeld in [artikel 11, vierde lid][ref3], blijkt dat na één jaar sprake is van
      onvoldoende verbeteringen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel23a1
      [ref3]: https://wetten.overheid.nl/BWBR0013800#Artikel11
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 10a
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 23a1
      - id: ref3
        bwb_id: BWBR0013800
        artikel: '11'
        hoofdstuk: '3'
  - number: '14.3'
    text: De inspectie stelt het bestuur van de betreffende instelling in kennis van haar voorstellen aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel14
  - number: '15.1'
    text: |-
      Naast het onderzoek, bedoeld in [artikel 11][ref1], kan de inspectie ter uitvoering van haar taken, bedoeld in
      [artikel 3][ref2], uit eigen beweging dan wel op aanwijzing van Onze Minister specifiek onderzoek verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel3
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '11'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '3'
        hoofdstuk: '2'
  - number: '15.2'
    text: |-
      [Artikel 11, vijfde en zesde lid][ref1], is van overeenkomstige toepassing. De artikelen 20 en [21][ref2] zijn van
      overeenkomstige toepassing, tenzij de aard of omvang van het onderzoek zich tegen openbare rapportage verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel21
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '11'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '21'
        hoofdstuk: '5'
  - number: 15a
    text: Dit hoofdstuk is van toepassing op het toezicht op de uitoefening van de taken van het samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel15a
  - number: 15b
    text: |-
      [Artikel 4][ref1] en [artikel 8, eerste tot en met derde lid][ref2], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel8
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '8'
        hoofdstuk: '2'
  - number: 15c.1
    text: |-
      [Artikel 11][ref1] is van overeenkomstige toepassing, met dien verstande dat de inspectie het onderzoek tevens
      verricht aan de hand van de volgende indicatoren:


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel11
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '11'
        hoofdstuk: '3'
  - number: 15c.1.a
    text: |-
      het al dan niet voldoen aan de wettelijke voorschriften met betrekking tot het
      ondersteuningsplan, bedoeld in [artikel 18a van de Wet op het primair onderwijs][ref1] en
      [artikel 17a van de Wet op het voortgezet onderwijs][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel17a
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 18a
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 17a
  - number: 15c.1.b
    text: |-
      het aantal leerplichtige jongeren wonend in het gebied van het samenwerkingsverband dat niet is ingeschreven bij
      een school als bedoeld in de [Leerplichtwet 1969][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0002628
  - number: 15c.1.c
    text: |-
      het aantal leerplichtige leerlingen van scholen in het samenwerkingsverband dat het onderwijs aan de school waaraan
      hij is ingeschreven gedurende een aaneengesloten periode van ten minste vier weken zonder geldige reden niet meer
      volgt, en
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel15c
  - number: 15c.1.d
    text: |-
      de wijze waarop een samenwerkingsverband zorg draagt voor de kwaliteit van het onderwijs aan een orthopedagogisch-
      didactisch centrum als bedoeld in [artikel 18a, lid 10a, van de Wet op het primair onderwijs][ref1] en
      [artikel 17a, lid 10a, van de Wet op het voortgezet onderwijs][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel17a
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 18a
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 17a
  - number: 15c.2
    text: |-
      De [artikelen 12][ref1], [13][ref2], [14][ref3] en [15][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0013800#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0013800#Artikel15
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '12'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '13'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0013800
        artikel: '14'
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0013800
        artikel: '15'
        hoofdstuk: '3'
  - number: 15d
    text: |-
      De [artikelen 20, eerste tot en met vijfde lid][ref1], en [21][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel21
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel15d
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '20'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '21'
        hoofdstuk: '5'
  - number: 15e
    text: |-
      Dit hoofdstuk is van toepassing op het College voor toetsen en examens, genoemd in
      [artikel 2, eerste lid, van de Wet College voor toetsen en examens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel15e
    references:
      - id: ref1
        bwb_id: BWBR0025364
        artikel: '2'
  - number: 15f.1
    text: |-
      De inspectie houdt toezicht op de kwaliteit van het functioneren van het College voor toetsen en
      examens en op de naleving van de bij of krachtens de [Wet College voor toetsen en examens][ref1], de
      [Wet op het voortgezet onderwijs][ref2] en de [Wet voortgezet onderwijs BES][ref3] gegeven voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0025364
      [ref2]: https://wetten.overheid.nl/BWBR0002399
      [ref3]: https://wetten.overheid.nl/BWBR0030284
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel15f
    references:
      - id: ref1
        bwb_id: BWBR0025364
      - id: ref2
        bwb_id: BWBR0002399
      - id: ref3
        bwb_id: BWBR0030284
  - number: 15f.2
    text: |-
      Ter uitvoering van de taak, bedoeld in het eerste lid, kan de inspectie Onze Minister onder meer voorstellen een
      voorziening te treffen als bedoeld in [artikel 23 van de Kaderwet zelfstandige bestuursorganen][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel23
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel15f
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '23'
  - number: 15f.2.a
    text: |-
      is gebleken dat de kwaliteit van het functioneren van het College voor toetsen en examens onvoldoende is geweest,
      of
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel15f
  - number: 15f.2.b
    text: |-
      niet of niet meer wordt voldaan aan hetgeen bij of krachtens de [Wet College voor toetsen en examens][ref1] is
      bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0025364
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel15f
    references:
      - id: ref1
        bwb_id: BWBR0025364
  - number: 15g
    text: |-
      Dit hoofdstuk is van toepassing op het toezicht op de kwaliteitsvoorwaarden voor voorschoolse educatie in
      kindercentra, bedoeld in de bij of krachtens de [Wet kinderopvang][ref1] vastgestelde bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0017017
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel15g
    references:
      - id: ref1
        bwb_id: BWBR0017017
  - number: 15h.1
    text: |-
      De [artikelen 4, tweede lid][ref1], [7][ref2], [8, eerste en derde lid][ref3], en [9][ref4] zijn van
      overeenkomstige toepassing, met dien verstande dat in artikel 4, tweede lid, onder «instellingen» wordt verstaan
      «kindercentra als bedoeld in [artikel 1.1, eerste lid, van de Wet kinderopvang][ref5]» en dat in artikel 9,
      eerste lid, onder «het toezicht op de naleving van bij of krachtens een onderwijswet gegeven voorschriften»
      wordt verstaan: het toezicht op de naleving van de bij of krachtens een onderwijswet of de bij of krachtens de
      [Wet kinderopvang][ref6] gegeven voorschriften omtrent de kwaliteit van voorschoolse educatie.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0013800#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0013800#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref6]: https://wetten.overheid.nl/BWBR0017017
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel15h
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '7'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0013800
        artikel: '8'
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0013800
        artikel: '9'
        hoofdstuk: '2'
      - id: ref5
        bwb_id: BWBR0017017
        artikel: '1'
      - id: ref6
        bwb_id: BWBR0017017
  - number: 15h.2
    text: |-
      De inspectie houdt toezicht op de naleving van de afspraken onderwijsachterstandenbeleid, bedoeld in
      [artikel 167 van de Wet op het primair onderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel167
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel15h
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '167'
  - number: 15i.1
    text: |-
      De inspectie verricht het onderzoek, bedoeld in [artikel 15h, eerste lid][ref1], aan de hand van de
      kwaliteitsvoorwaarden van de voorschoolse educatie in kindercentra, bedoeld in de bij of krachtens de
      [Wet kinderopvang][ref2] vastgestelde bepalingen, te weten:


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel15h
      [ref2]: https://wetten.overheid.nl/BWBR0017017
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel15i
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 15h
        hoofdstuk: 3c
      - id: ref2
        bwb_id: BWBR0017017
  - number: 15i.1.a
    text: de basisvoorwaarden voor voorschoolse educatie,
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel15i
  - number: 15i.1.b
    text: het informeren van ouders en ouderbetrokkenheid,
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel15i
  - number: 15i.1.c
    text: de kwaliteit van de educatie,
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel15i
  - number: 15i.1.d
    text: ontwikkeling, zorg en begeleiding van de kinderen,
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel15i
  - number: 15i.1.e
    text: kwaliteitszorg,
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel15i
  - number: 15i.1.f
    text: de doorgaande lijn tussen voor- en vroegschoolse educatie.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel15i
  - number: 15i.2
    text: |-
      De inspectie rapporteert over de bevindingen van het toezicht aan de houder van een kindercentrum en aan het
      college van burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel15i
  - number: 15i.3
    text: |-
      Naast het onderzoek, bedoeld in het eerste lid, kan de inspectie uit eigen beweging incidenteel onderzoek
      verrichten naar de kwaliteit van de voorschoolse educatie in kindercentra, bedoeld in de bij of krachtens de
      [Wet kinderopvang][ref1] vastgestelde bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0017017
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel15i
    references:
      - id: ref1
        bwb_id: BWBR0017017
  - number: 15i.4
    text: |-
      [Artikel 13][ref1] is van overeenkomstige toepassing, met dien verstande dat onder «andere betrokkenen»
      in ieder geval wordt verstaan: vertegenwoordigers van houders van kindercentra als bedoeld in
      [artikel 1.1 van de Wet kinderopvang][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel15i
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '13'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '1'
  - number: 15i.5
    text: |-
      De inspectie verricht het onderzoek, bedoeld in [artikel 15h, tweede lid][ref1], op verzoek van het college
      van burgemeester en wethouders van de betrokken gemeente of op verzoek van Onze Minister. Het college van
      burgemeester en wethouders dient een dergelijk verzoek in op eigen initiatief of als een partij als bedoeld in
      [artikel 167, tweede lid, van de Wet op het primair onderwijs][ref2] aan het college hierom verzoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel15h
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel167
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel15i
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 15h
        hoofdstuk: 3c
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '167'
  - number: 15j
    text: |-
      De [artikelen 20, eerste tot en met vijfde lid][ref1], [21][ref2], [22][ref3] en [23][ref4] zijn van
      overeenkomstige toepassing, met dien verstande dat in artikel 20, tweede lid, onder «een bij of krachtens
      een onderwijswet gegeven voorschrift» wordt verstaan «een bij of krachtens een onderwijswet of een bij of
      krachtens de Wet kinderopvang gegeven voorschrift omtrent de kwaliteit van voorschoolse educatie» en dat in het
      derde en vierde lid onder «het bestuur» moet worden verstaan: de houder van een kindercentrum als bedoeld in
      [artikel 1.1 van de Wet kinderopvang][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0013800#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0013800#Artikel23
      [ref5]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel15j
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '20'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '21'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0013800
        artikel: '22'
        hoofdstuk: '6'
      - id: ref4
        bwb_id: BWBR0013800
        artikel: '23'
        hoofdstuk: '6'
      - id: ref5
        bwb_id: BWBR0017017
        artikel: '1'
  - number: 15k.1
    text: |-
      Indien de inspectie oordeelt dat de kwaliteit van de voorschoolse educatie in kindercentra als bedoeld in de bij
      of krachtens de [Wet kinderopvang][ref1] vastgestelde bepalingen, tekortschiet, informeert zij het college van
      burgemeester en wethouders van de desbetreffende gemeente en doet voorstellen over te treffen maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0017017
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel15k
    references:
      - id: ref1
        bwb_id: BWBR0017017
  - number: 15k.2
    text: |-
      De inspectie stelt de houder van het betreffende kindercentrum in kennis van haar voorstellen aan het college van
      burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel15k
  - number: 15l
    text: |-
      Dit hoofdstuk is van toepassing op het toezicht op de uitoefening van de taken van de Samenwerkingsorganisatie
      beroepsonderwijs bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel15l
  - number: 15m
    text: |-
      De [artikelen 4][ref1], [artikel 8, eerste tot en met derde lid,][ref2] en [9][ref3] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0013800#Artikel9
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel15m
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '8'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0013800
        artikel: '9'
        hoofdstuk: '2'
  - number: 15n.1
    text: |-
      Ter uitvoering van de in [artikel 3, eerste lid][ref1], bedoelde taken, onderzoekt de inspectie
      jaarlijks de kwaliteit van de uitoefening van de wettelijke taken door de Samenwerkingsorganisatie
      beroepsonderwijs bedrijfsleven, bedoeld in de [artikelen 1.5.1 van de Wet educatie][ref2] en
      [10b4 van de Wet op het voortgezet onderwijs][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10b4
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel15n
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 10b4
  - number: 15n.2
    text: |-
      Indien de inspectie naar aanleiding van het onderzoek, bedoeld in het eerste lid, oordeelt dat de kwaliteit
      tekortschiet, verricht zij na een door haar aangegeven termijn onderzoek naar de verbeteringen die de
      Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven heeft gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel15n
  - number: 15n.3
    text: |-
      De inspectie stelt het bestuur in kennis van de datum en het doel van het onderzoek, bedoeld in het eerste of
      tweede lid. Kennisgeving geschiedt ten minste vier weken voor aanvang van een onderzoek. Indien de inspectie dit
      nodig oordeelt, verricht zij onderzoek zonder deze kennisgeving.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel15n
  - number: 15n.4
    text: |-
      Bij de uitvoering van een onderzoek als bedoeld in het eerste of tweede lid, kan de inspectie onafhankelijke
      deskundigen betrekken.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel15n
  - number: 15n.5
    text: |-
      De [artikelen 12][ref1], [13][ref2], [14][ref3] en [15][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0013800#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0013800#Artikel15
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel15n
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '12'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '13'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0013800
        artikel: '14'
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0013800
        artikel: '15'
        hoofdstuk: '3'
  - number: '20.1'
    text: |-
      De inspectie legt haar oordelen en bevindingen naar aanleiding van een onderzoek als bedoeld in [artikel 11][ref1],
      dan wel [artikel 12a][ref2], vast in een inspectierapport. In het inspectierapport wordt onderscheid aangebracht
      tussen oordelen op grond van de in [artikel 3, eerste lid, onderdeel a][ref3], bedoelde taak en bevindingen op
      grond van de in artikel, eerste lid, onderdeel b, bedoelde taak.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel12a
      [ref3]: https://wetten.overheid.nl/BWBR0013800#Artikel3
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '11'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: 12a
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0013800
        artikel: '3'
        hoofdstuk: '2'
  - number: '20.2'
    text: |-
      De inspectie vermeldt ten aanzien van de in [artikel 3, eerste lid, onderdeel a][ref1], bedoelde taak, op welke bij
      of krachtens een onderwijswet gegeven voorschriften haar oordeel betrekking heeft. Indien de inspectie oordeelt dat
      een bij of krachtens een onderwijswet gegeven voorschrift niet is nageleefd, vermeldt zij dit in het rapport.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel3
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '3'
        hoofdstuk: '2'
  - number: '20.3'
    text: |-
      Alvorens een rapport vast te stellen, stelt de inspectie het bestuur in de gelegenheid van het ontwerp-rapport
      kennis te nemen en daarover overleg te voeren.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel20
  - number: '20.4'
    text: |-
      Indien in het overleg geen overeenstemming is bereikt over door het bestuur gewenste wijzigingen van het ontwerp-
      rapport, wordt de zienswijze van het bestuur in een bijlage bij het inspectierapport opgenomen.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel20
  - number: '20.5'
    text: De inspectie zendt het inspectierapport na vaststelling daarvan onverwijld aan het bestuur.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel20
  - number: '20.6'
    text: |-
      Het inspectierapport waarin de inspectie tot het oordeel komt dat de kwaliteit van het onderwijs zeer
      zwak is, als bedoeld in [artikel 10a, eerste of vierde lid, van de Wet op het primair onderwijs][ref1],
      [artikel 19a van de Wet op de expertisecentra][ref2] en
      [artikel 23a1, eerste of vierde lid, van de Wet op het voortgezet onderwijs][ref3] geldt na vaststelling als een
      besluit in de zin van de Algemene wet bestuursrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel19a
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel23a1
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 10a
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 19a
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 23a1
  - number: '21.1'
    text: De inspectie maakt een inspectierapport in de vijfde week na vaststelling daarvan openbaar.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel21
  - number: '21.2'
    text: |-
      Indien voor de vijfde week na vaststelling van het inspectierapport, bedoeld in [artikel 20, zesde lid][ref1],
      wordt verzocht om een voorlopige voorziening als bedoeld in [artikel 8:81 van de Algemene wet bestuursrecht][ref2],
      wordt de openbaarmaking opgeschort totdat de voorzieningenrechter een uitspraak heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '20'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '21.3'
    text: |-
      Tevens verstrekt de inspectie een inspectierapport op verzoek. De inspectie kan een vergoeding van kosten vragen
      overeenkomstig een door haar vast te stellen tarief voor de afgifte van een inspectierapport.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel21
  - number: '21.4'
    text: |-
      De inspectie verstrekt een inspectierapport niet eerder dan nadat het op grond van het eerste lid openbaar is
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel21
  - number: '22'
    text: De inspectie draagt zorg voor een verantwoorde taakuitoefening.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel22
  - number: '23.1'
    text: |-
      Er is een klachtadviescommissie belast met de behandeling van en advisering over klachten
      over gedragingen van de inspectie. Op de behandeling van en advisering over klachten is de in
      [afdeling 9.1.3 van de Algemene wet bestuursrecht][ref1] geregelde procedure van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling9.1.3
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 9.1.3
  - number: '23.2'
    text: |-
      De klachtadviescommissie bestaat uit ten minste drie leden, die worden benoemd en ontslagen door Onze Minister
      van Onderwijs, Cultuur en Wetenschap na overleg met Onze Minister van Economische Zaken. De leden maken geen deel
      uit van en zijn niet werkzaam onder verantwoordelijkheid van de inspectie. De leden kiezen uit hun midden een
      voorzitter. De benoeming geschiedt voor de tijd van ten hoogste vier jaar. Herbenoeming kan tweemaal en telkens
      voor ten hoogste vier jaar plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel23
  - number: '23.3'
    text: |-
      De voorzitter en leden zijn afzonderlijk of gezamenlijk deskundig op het gebied van onderwijs, in het bijzonder op
      het gebied van de vrijheid van richting en inrichting, toezicht en klachtbehandeling.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel23
  - number: '23.4'
    text: De klachtadviescommissie bepaalt haar eigen werkwijze.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel23
  - number: '24.1'
    text: |-
      Er is een Raad van advies inzake de inspectie die tot taak heeft de inspectie bij te staan in de waarborging
      van een zorgvuldige en professionele uitoefening van het toezicht. De raad adviseert de inspecteur-generaal
      onderscheidenlijk het hoofd inspectie gevraagd en ongevraagd over de kwaliteit van de uitoefening van het toezicht,
      in het bijzonder over de uitvoering van de [artikelen 13][ref1] en [22][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel22
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '13'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '22'
        hoofdstuk: '6'
  - number: '24.2'
    text: |-
      De raad bestaat uit ten minste drie leden, die worden benoemd en ontslagen door Onze Minister van Onderwijs,
      Cultuur en Wetenschap na overleg met Onze Minister van Economische Zaken, Landbouw en Innovatie. De benoeming
      geschiedt voor de tijd van ten hoogste vier jaar. De leden kiezen uit hun midden een voorzitter.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24
  - number: '24.3'
    text: |-
      De voorzitter en leden zijn afzonderlijk of gezamenlijk deskundig op het gebied van onderwijs, kwaliteitszorg en
      toezicht.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24
  - number: '24.4'
    text: De raad bepaalt zijn eigen werkwijze.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24
  - number: 24a
    text: |-
      In dit hoofdstuk wordt verstaan onder: - *basisregister onderwijs:* basisregister onderwijs als bedoeld in
      [artikel 24b][ref1];
        - *meldingsregister relatief verzuim:* meldingsregister relatief verzuim als bedoeld in [artikel 24h][ref2];
        - *startkwalificatie:* startkwalificatie als bedoeld in [artikel 1, onderdeel f, van de Leerplichtwet 1969][ref3];
        - register vrijstellingen en vervangende leerplicht: register vrijstellingen en vervangende leerplicht als bedoeld
      in [artikel 24k2][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel24b
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel24h
      [ref3]: https://wetten.overheid.nl/BWBR0002628#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0013800#Artikel24k2
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 24b
        hoofdstuk: 6a
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: 24h
        hoofdstuk: 6a
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0002628
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0013800
        artikel: 24k2
        hoofdstuk: 6a
        paragraaf: '4'
  - number: 24b.1
    text: 'Er is een basisregister onderwijs, dat ten doel heeft:'
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24b
  - number: 24b.1.a
    text: |-
      Onze Minister gegevens te verstrekken ten behoeve van de bekostiging van scholen en instellingen, de begrotings-
      en beleidsvoorbereiding, de planning en bekostiging van de instellingen voor hoger onderwijs en ten behoeve van de
      uitvoering van zijn overige wettelijke taken;
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24b
  - number: 24b.1.b
    text: de inspectie gegevens te verstrekken ten behoeve van het toezicht op het onderwijs;
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24b
  - number: 24b.1.c
    text: |-
      het Centraal bureau voor de statistiek gegevens te verstrekken teneinde het Centraal bureau voor de statistiek in
      staat te stellen:
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24b
  - number: 24b.1.c.1°
    text: Onze Minister gegevens te verstrekken ten behoeve van de beleidsvoorbereiding;
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24b
  - number: 24b.1.c.2°
    text: |-
      de gemeenten gegevens te verstrekken ten behoeve van de toekenning van uitkeringen, bedoeld in
      [artikel 2 van de Wet participatiebudget][ref1], aan instellingen, en ten behoeve van de begrotings- en
      beleidsvoorbereiding inzake de gemeentelijke taken op het gebied van het onderwijs;


      [ref1]: https://wetten.overheid.nl/BWBR0025039#Artikel2
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24b
    references:
      - id: ref1
        bwb_id: BWBR0025039
        artikel: '2'
  - number: 24b.1.d
    text: |-
      de instellingen, bedoeld in de [artikelen 1.1.1, onderdeel b][ref1], [1.4.1][ref2] en [1.4a.1][ref3], voor zover
      het betreft opleidingen voortgezet algemeen volwassenenonderwijs, van de Wet educatie en beroepsonderwijs gegevens
      te verstrekken die noodzakelijk zijn voor de uitvoering van aanmeldings- en inschrijvingsprocedures;


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24b
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 24b.1.e
    text: |-
      de instellingen, bedoeld in de [bijlage van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1]
      en de rechtspersonen voor hoger onderwijs gegevens te verstrekken die noodzakelijk zijn voor de uitvoering van
      aanmeldings- en inschrijvingsprocedures; en


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24b
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 24b.1.f
    text: |-
      het meldingsregister relatief verzuim te voorzien van de gegevens die noodzakelijk zijn in het kader van het doel
      van dat register.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24b
  - number: 24b.2
    text: Het beheer van het basisregister onderwijs berust bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24b
  - number: 24b.3
    text: |-
      Met betrekking tot de verwerking van persoonsgegevens, bedoeld in deze paragraaf, is Onze Minister de
      verwerkingsverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24b
  - number: 24c.1
    text: 'In het basisregister onderwijs zijn de volgende gegevens opgenomen:'
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24c
  - number: 24c.1.a
    text: |-
      de persoonsgebonden nummers van de leerlingen die zijn ingeschreven of ingeschreven zijn geweest aan een uit
      de openbare kas bekostigde school als bedoeld in de [Wet op het primair onderwijs][ref1], tezamen met de andere
      gegevens, genoemd in [artikel 178a, tweede en zevende lid, van de Wet op het primair onderwijs][ref2], en
      [artikel 164a, leden 2a en 2b, van de Wet op de expertisecentra][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel178a
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel164a
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24c
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003420
        artikel: 178a
      - id: ref3
        bwb_id: BWBR0003549
        artikel: 164a
  - number: 24c.1.b
    text: |-
      de persoonsgebonden nummers van de leerlingen die zijn ingeschreven of ingeschreven zijn geweest aan een uit de
      openbare kas bekostigde school als bedoeld in de [Wet op de expertisecentra][ref1], tezamen met de andere gegevens,
      [artikel 164a, tweede lid, lid 2a, lid 2b, en achtste lid, van de Wet op de expertisecentra][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003549
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel164a
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24c
    references:
      - id: ref1
        bwb_id: BWBR0003549
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 164a
  - number: 24c.1.c
    text: |-
      de persoonsgebonden nummers van de leerlingen die zijn ingeschreven of ingeschreven zijn geweest aan een uit de
      openbare kas bekostigde school als bedoeld in de [Wet op het voortgezet onderwijs][ref1], tezamen met de andere
      gegevens, genoemd in [artikel 103b, tweede en achtste lid, van de Wet op het voortgezet onderwijs][ref2], en
      [artikel 164a, leden 2a en 2b, van de Wet op de expertisecentra][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel103b
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel164a
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24c
    references:
      - id: ref1
        bwb_id: BWBR0002399
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 103b
      - id: ref3
        bwb_id: BWBR0003549
        artikel: 164a
  - number: 24c.1.c1
    text: |-
      de persoonsgebonden nummers van de leerlingen die zijn ingeschreven of ingeschreven zijn geweest aan
      een school die is aangewezen op grond van [artikel 56 van de Wet op het voortgezet onderwijs][ref1],
      tezamen met de andere gegevens, bedoeld in [artikel 103b, tweede en achtste lid][ref2], in samenhang met
      [artikel 58, zevende lid, onderdeel a, van die wet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel103b
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel58
