  - number: 24q.8
    text: |-
      Uit het diplomaregister wordt desgevraagd aan betrokkene een elektronisch document met diplomagegevens verstrekt,
      dat is beveiligd tegen wijzigingen en waarvan kan worden vastgesteld dat het is afgegeven door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24q
  - number: 24q.9
    text: De verstrekking van gegevens uit het diplomaregister geschiedt elektronisch.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24q
  - number: 24q.10
    text: |-
      In afwijking van het negende lid geschiedt de verstrekking van gegevens op grond van het eerste of achtste lid
      schriftelijk indien betrokkene hierom verzoekt.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24q
  - number: 24q.11
    text: |-
      Voor de elektronische verstrekking van gegevens op grond van het eerste tot en met zesde lid is geen vergoeding
      verschuldigd. Onze Minister kan regels stellen over de vergoeding die verschuldigd is voor de elektronische
      verstrekking van gegevens op grond van het zevende en achtste lid en voor de schriftelijke verstrekking van
      gegevens op grond van het tiende lid.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24q
  - number: 24r
    text: |-
      Diplomagegevens worden tot 60 jaar na de maand van afgifte van het laatst behaalde waardedocument of, indien dat
      eerder is, tot het overlijden van betrokkene bewaard in het diplomaregister in een vorm die het mogelijk maakt
      betrokkene te identificeren.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24r
  - number: 24s
    text: |-
      Onze Minister stelt bij ministeriële regeling regels omtrent de autorisatie van degenen die onder zijn gezag vallen
      voor verwerking van persoonsgegevens uit het diplomaregister.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24s
  - number: 24t.1
    text: |-
      Onze Minister houdt gedurende twintig jaren volgend op de verstrekking van gegevens uit het diplomaregister
      met uitzondering van de verstrekking op grond van [artikel 24q, eerste lid of zesde lid, tweede volzin][ref1],
      aantekening van de verstrekking, tenzij de verstrekking van gegevens in de genoemde periode anderszins is te
      herleiden uit het diplomaregister.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel24q
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24t
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 24q
        hoofdstuk: 6b
  - number: 24t.2
    text: |-
      Onze Minister deelt aan de betrokkene mede of hem betreffende gegevens gedurende twintig jaren voorafgaande aan
      het verzoek uit het diplomaregister zijn verstrekt aan een overheidsorgaan, een onderwijsinstelling of een andere
      derde. Onze Minister kan volstaan met een in algemene termen gestelde mededeling omtrent de verstrekkingen.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24t
  - number: 24u
    text: |-
      Een derde kan bij het verwerken van persoonsgegevens gebruik maken van het persoonsgebonden nummer voor zover dit
      noodzakelijk is in verband met de verstrekking van gegevens aan hem uit het diplomaregister.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel24u
  - number: '33'
    text: a. b. c. d. c.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel33
  - number: '34'
    text: |-
      Onze Minister zendt binnen vijf jaar na inwerkingtreding van [paragraaf 4 van hoofdstuk 6a][ref1] van deze wet aan
      de Staten-Generaal een verslag over de realisatie van de volgende doelstellingen van het register vrijstellingen en
      vervangende leerplicht:


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Hoofdstuk6a
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0013800
        hoofdstuk: 6a
        paragraaf: '4'
  - number: 34.a
    text: |-
      verbetering van de handhaving van de [Leerplichtwet 1969][ref1] door de leerplichtambtenaar;


      [ref1]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002628
  - number: 34.b
    text: verbetering van de registratie van het aantal voortijdig schoolverlaters;
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel34
  - number: 34.c
    text: uniformering van de registratie van de vrijstellingen en vervangende leerplicht.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel34
  - number: '35'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel35
  - number: '36'
    text: 'Deze wet wordt aangehaald als: Wet op het onderwijstoezicht.'
    url: https://wetten.overheid.nl/BWBR0013800/2018-08-01#Artikel36
