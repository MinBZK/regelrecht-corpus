      [ref6]: https://wetten.overheid.nl/BWBR0025364#Artikel12
      [ref7]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref8]: https://wetten.overheid.nl/BWBR0005682
      [ref9]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24l
