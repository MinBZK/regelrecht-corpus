        bwb_id: BWBR0020495
        artikel: '23'
  - number: 15f.2.a
    text: is gebleken dat de kwaliteit van het functioneren van het College voor examens onvoldoende is geweest, of
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel15f
  - number: 15f.2.b
    text: |-
      niet of niet meer wordt voldaan aan hetgeen bij of krachtens de [Wet College voor examens][ref1] is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0025364
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel15f
    references:
      - id: ref1
        bwb_id: BWBR0025364
  - number: 15g
    text: |-
      Dit hoofdstuk is van toepassing op het toezicht op de kwaliteitsvoorwaarden voor
      voorschoolse educatie in peuterspeelzalen en kindercentra, bedoeld in de bij of krachtens de
      [Wet kinderopvang en kwaliteitseisen peuterspeelzalen][ref1] vastgestelde bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0017017
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel15g
    references:
      - id: ref1
        bwb_id: BWBR0017017
  - number: 15h.1
    text: |-
      De [artikelen 4, tweede lid][ref1], [7][ref2], [8, eerste en derde lid][ref3], en [9][ref4] zijn van
      overeenkomstige toepassing, met dien verstande dat in artikel 4, tweede lid, onder »instellingen» wordt
      verstaan «kindercentra en peuterspeelzalen als bedoeld in de [artikelen 1.1, eerste lid][ref5], en
      [2.1, van de Wet kinderopvang en kwaliteitseisen peuterspeelzalen][ref6]» en dat in artikel 9, eerste
      lid, onder «het toezicht op de naleving van bij of krachtens een onderwijswet gegeven voorschriften» wordt
      verstaan: het toezicht op de naleving van de bij of krachtens een onderwijswet of de bij of krachtens de
      [Wet kinderopvang en kwaliteitseisen peuterspeelzalen][ref7] gegeven voorschriften omtrent de kwaliteit van
      voorschoolse educatie.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0013800#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0013800#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref6]: https://wetten.overheid.nl/BWBR0017017#Artikel2
      [ref7]: https://wetten.overheid.nl/BWBR0017017
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel15h
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '7'
