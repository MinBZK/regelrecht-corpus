  - number: 15a
    text: Dit hoofdstuk is van toepassing op het toezicht op de uitoefening van de taken van het regionaal expertisecentrum.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel15a
  - number: 15b
    text: |-
