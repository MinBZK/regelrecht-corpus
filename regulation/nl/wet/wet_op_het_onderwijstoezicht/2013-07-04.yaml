  - number: 24p.1
    text: |-
      Indien een of meer van de gegevens in het diplomaregister afwijken van de gegevens in het originele waardedocument,
      kan de betrokkene Onze Minister elektronisch verzoeken eerstgenoemde gegevens te verbeteren. Onze Minister verzoekt
      de organisatie die het document heeft uitgereikt om hem elektronisch de juiste gegevens te verstrekken. Indien de
      organisatie constateert dat een of meer gegevens van de betrokkene in het diplomaregister niet overeenkomen met de
      gegevens waarover zij beschikt, verzoekt zij Onze Minister om deze gegevens te verbeteren.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24p
  - number: 24p.2
    text: |-
      Indien de organisatie die het document heeft uitgereikt, constateert dat de gegevens van de betrokkene in het
      diplomaregister overeenkomen met de gegevens waarover zij beschikt of indien zij niet meer over de diplomagegevens
      van betrokkene beschikt, deelt zij dit elektronisch mee aan Onze Minister en deelt Onze Minister dit elektronisch
      mee aan de betrokkene. Indien de organisatie niet meer over de diplomagegevens van de betrokkene beschikt, kan
      de betrokkene op vertoon van het originele waardedocument aan Onze Minister verzoeken om de gegevens in het
      diplomaregister te verbeteren.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24p
  - number: 24p.3
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op de gegevens, bedoeld in
      [artikel 24o, eerste lid, onder a][ref1], die zijn overgenomen uit de gemeentelijke basisadministratie
      persoonsgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel24o
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24p
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 24o
        hoofdstuk: 6b
  - number: 24q.1
    text: Uit het diplomaregister worden desgevraagd diplomagegevens verstrekt aan betrokkene.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24q
  - number: 24q.2
    text: |-
      Uit het diplomaregister worden desgevraagd diplomagegevens verstrekt aan een instelling of school als bedoeld in
      [artikel 24n][ref1] of aan een school of afdeling voor voortgezet speciaal onderwijs als bedoeld in de Wet op de
      expertisecentra, indien betrokkene is ingeschreven of was ingeschreven bij die instelling, school of afdeling. Op
      grond van de eerste volzin kunnen uitsluitend diplomagegevens worden verstrekt die zijn behaald voor onderwijs van
      die instelling, school of afdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel24n
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24q
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 24n
        hoofdstuk: 6b
  - number: 24q.3
    text: |-
      Uit het diplomaregister worden desgevraagd diplomagegevens verstrekt aan een instelling of school als bedoeld in
      [artikel 24n][ref1] of aan het College voor examens indien betrokkene een waardedocument heeft behaald bij die
      instelling, die school of dat college. Op grond van de eerste volzin kunnen uitsluitend diplomagegevens worden
      verstrekt van waardedocumenten die zijn afgegeven door die instelling, die school of dat college.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel24n
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24q
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 24n
        hoofdstuk: 6b
  - number: 24q.4
    text: |-
      Uit het diplomaregister worden desgevraagd diplomagegevens verstrekt aan een instelling of school als bedoeld in
      [artikel 24n][ref1] of aan het College voor examens ten behoeve van de aanmelding, inschrijving of examinering
      van betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel24n
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24q
    references:
