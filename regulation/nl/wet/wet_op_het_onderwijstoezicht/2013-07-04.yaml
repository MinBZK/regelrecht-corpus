        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '2'
  - number: 24c.1.e
    text: |-
      de persoonsgebonden nummers van de deelnemers aan een beroepsopleiding die zijn ingeschreven
      of ingeschreven zijn geweest aan een uit ’s Rijks kas bekostigde instelling als bedoeld
      in de [Wet educatie en beroepsonderwijs][ref1], tezamen met de andere gegevens, genoemd in
      [artikel 2.5.5a, tweede en zevende lid, van de Wet educatie en beroepsonderwijs][ref2];


