  - number: 24c.3
    text: |-
      De persoonsgegevens van de leerlingen, deelnemers, studenten en extraneï die niet langer zijn ingeschreven aan een
      school of instelling als bedoeld in het eerste lid, onderdelen a tot en met f, worden tot vijf jaren na beëindiging
      van de laatste inschrijving bewaard in het basisregister onderwijs in een vorm die het mogelijk maakt de betrokkene
      te identificeren. [Artikel 10, tweede lid, van de Wet bescherming persoonsgegevens][ref1] is niet van toepassing.
      In afwijking van de eerste volzin geldt voor de geslachtsnaam, voornamen, geboortedatum, instelling voor hoger
      onderwijs waar een opleiding is gevolgd, naam van die opleiding, datum diploma en het aantal jaren genoten hoger
      onderwijs van studenten die niet langer zijn ingeschreven aan een instelling als bedoeld in het eerste lid,
      onderdeel f, een bewaartermijn van vijftig jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel10
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24c
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '10'
  - number: 24d
    text: |-
      Uit het basisregister onderwijs kunnen persoonsgegevens worden verstrekt aan de betrokkene en diens wettelijke
      vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24d
  - number: 24e
    text: |-
      Uit het basisregister onderwijs kunnen persoonsgegevens worden verstrekt aan Onze Minister en de inspectie voor
      zover dat noodzakelijk is voor de uitoefening van hun wettelijke taken.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24e
  - number: 24f.1
    text: 'Uit het basisregister onderwijs kunnen persoonsgegevens worden verstrekt aan:'
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24f
  - number: 24f.1.a
    text: |-
      de school of instelling waar de betrokkene als leerling, deelnemer, student of extraneus is of was ingeschreven,
      voor zover de gegevens betrekking hebben op de periode waarin hij aan de desbetreffende school of instelling is of
      was ingeschreven, en
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24f
  - number: 24f.1.b
    text: |-
      de school of instelling waar de betrokkene als leerling, deelnemer of extraneus is ingeschreven, voor zover de
      gegevens betrekking hebben op de periode waarin hij aan een andere school of instelling was ingeschreven.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24f
  - number: 24f.2
    text: |-
      Uit het basisregister onderwijs worden desgevraagd kosteloos persoonsgegevens verstrekt aan burgemeester
      en wethouders, voorzover dat verplicht is op grond van [artikel 64 van de Wet werk en bijstand][ref1],
      [artikel 45 van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2] en
      [artikel 45 van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0004163#Artikel45
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24f
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '64'
      - id: ref2
        bwb_id: BWBR0004044
        artikel: '45'
      - id: ref3
        bwb_id: BWBR0004163
        artikel: '45'
  - number: 24f.3
    text: |-
      Uit het basisregister onderwijs worden aan burgemeester en wethouders de naam, het adres, het persoonsgebonden
      nummer, de behaalde diploma’s, het laatst genoten onderwijs, de laatst bezochte school of instelling, de data van
      in- en uitschrijving bij die school of instelling en de reden van uitstroom verstrekt van degenen die:
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24f
  - number: 24f.3.a
    text: |-
      woonachtig zijn in de desbetreffende gemeente of in een gemeente die behoort tot de regio waarvan de desbetreffende
      gemeente contactgemeente is als bedoeld in [artikel 8.3.2, derde lid, van de Wet educatie en beroepsonderwijs][ref1],
      [artikel 162b, derde lid, van de Wet op de expertisecentra][ref2] en
      [artikel 118h, derde lid, van de Wet op het voortgezet onderwijs][ref3],


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel162b
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel118h
