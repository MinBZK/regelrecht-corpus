  - number: 15e
    text: |-
      Dit hoofdstuk is van toepassing op het College voor examens, genoemd in
      [artikel 2, eerste lid, van de Wet College voor examens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel15e
