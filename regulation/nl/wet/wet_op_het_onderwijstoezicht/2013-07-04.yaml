  - number: 24f.3.c
    text: |-
      niet in het bezit zijn van een startkwalificatie en niet behoren tot de jongeren, bedoeld in
      [artikel 4a, tweede lid, van de Leerplichtwet 1969][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel4a
