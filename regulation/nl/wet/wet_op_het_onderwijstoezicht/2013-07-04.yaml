        bwb_id: BWBR0017017
  - number: 15h.2
    text: |-
      De inspectie houdt toezicht op de naleving van de afspraken onderwijsachterstandenbeleid, bedoeld in
      [artikel 167 van de Wet op het primair onderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel167
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel15h
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '167'
  - number: 15i.1
    text: |-
      De inspectie verricht het onderzoek, bedoeld in [artikel 15h, eerste lid][ref1], aan de hand van de
      kwaliteitsvoorwaarden van de voorschoolse educatie in peuterspeelzalen en kindercentra, bedoeld in de bij of
      krachtens de [Wet kinderopvang en kwaliteitseisen peuterspeelzalen][ref2] vastgestelde bepalingen, te weten:


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel15h
      [ref2]: https://wetten.overheid.nl/BWBR0017017
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel15i
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 15h
        hoofdstuk: 3c
      - id: ref2
        bwb_id: BWBR0017017
  - number: 15i.1.a
    text: de basisvoorwaarden voor voorschoolse educatie,
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel15i
  - number: 15i.1.b
    text: het informeren van ouders en ouderbetrokkenheid,
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel15i
  - number: 15i.1.c
    text: de kwaliteit van de educatie,
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel15i
  - number: 15i.1.d
    text: ontwikkeling, zorg en begeleiding van de kinderen,
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel15i
  - number: 15i.1.e
    text: kwaliteitszorg,
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel15i
  - number: 15i.1.f
    text: de doorgaande lijn tussen voor- en vroegschoolse educatie.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel15i
  - number: 15i.2
    text: |-
      De inspectie rapporteert over de bevindingen van het toezicht aan de houder van een peuterspeelzaal of een
      kindercentrum en aan het college van burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel15i
  - number: 15i.3
    text: |-
      Naast het onderzoek, bedoeld in het eerste lid, kan de inspectie uit eigen beweging incidenteel onderzoek
      verrichten naar de kwaliteit van de voorschoolse educatie in peuterspeelzalen en kindercentra, bedoeld in de bij of
      krachtens de [Wet kinderopvang en kwaliteitseisen peuterspeelzalen][ref1] vastgestelde bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0017017
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel15i
    references:
      - id: ref1
        bwb_id: BWBR0017017
  - number: 15i.4
    text: |-
      [Artikel 13][ref1] is van overeenkomstige toepassing, met dien verstande dat onder «andere betrokkenen» in ieder
      geval wordt verstaan: vertegenwoordigers van houders van kindercentra en peuterspeelzalen als bedoeld in de
      [artikelen 1.1][ref2] en [2.1 van de Wet kinderopvang en kwaliteitseisen peuterspeelzalen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel2
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel15i
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '13'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0017017
        artikel: '2'
  - number: 15i.5
    text: |-
      De inspectie verricht het onderzoek, bedoeld in [artikel 15h, tweede lid][ref1], op verzoek van het college
      van burgemeester en wethouders van de betrokken gemeente of op verzoek van Onze Minister. Het college van
      burgemeester en wethouders dient een dergelijk verzoek in op eigen initiatief of als een partij als bedoeld in
      [artikel 167, tweede lid, van de Wet op het primair onderwijs][ref2] aan het college hierom verzoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel15h
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel167
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel15i
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 15h
        hoofdstuk: 3c
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '167'
  - number: 15j
    text: |-
      De [artikelen 20][ref1], [21][ref2], [22][ref3] en [23][ref4] zijn van overeenkomstige toepassing,
      met dien verstande dat in artikel 20, tweede lid, onder «een bij of krachtens een onderwijswet
      gegeven voorschrift» wordt verstaan «een bij of krachtens een onderwijswet of een bij of krachtens
      de [Wet kinderopvang en kwaliteitseisen peuterspeelzalen][ref5] gegeven voorschrift omtrent de
      kwaliteit van voorschoolse educatie» en dat in het derde en vierde lid onder «het bestuur» moet worden
      verstaan: de houder van een kindercentrum of peuterspeelzaal als bedoeld in de [artikelen 1.1][ref6] en
      [2.1 van de Wet kinderopvang en kwaliteitseisen peuterspeelzalen][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0013800#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0013800#Artikel23
      [ref5]: https://wetten.overheid.nl/BWBR0017017
      [ref6]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref7]: https://wetten.overheid.nl/BWBR0017017#Artikel2
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel15j
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '20'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '21'
        hoofdstuk: '5'
      - id: ref3
