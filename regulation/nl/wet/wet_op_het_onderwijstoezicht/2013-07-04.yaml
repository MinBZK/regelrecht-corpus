        artikel: '56'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 103b
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '58'
  - number: 24c.1.d
    text: |-
      de persoonsgebonden nummers van de deelnemers aan een opleiding voortgezet algemeen volwassenenonderwijs
      die zijn ingeschreven of ingeschreven zijn geweest aan een instelling als bedoeld in
      [artikel 1.1.1, onder b1°, van de Wet educatie en beroepsonderwijs][ref1] alsmede deelnemers aan een opleiding
      educatie die zijn ingeschreven of ingeschreven zijn geweest aan een instelling waaraan door het gemeentebestuur
      op grond van [artikel 3 van de Wet participatiebudget][ref2] uitkeringen zijn toegekend, tezamen met de andere
      gegevens, genoemd in [artikel 2.3.6a, tweede en vijfde lid, van de Wet educatie en beroepsonderwijs][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0025039#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24c
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
      - id: ref2
