        artikel: '3'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '2'
  - number: 24c.1.d1
    text: |-
      de persoonsgebonden nummers van de deelnemers aan een opleiding educatie die zijn ingeschreven of ingeschreven
      zijn geweest aan een andere dan een in [artikel 1.1.1, onderdeel b, van de Wet educatie en beroepsonderwijs][ref1]
      bedoelde instelling of een instelling als bedoeld in die wet voor een opleiding educatie ten aanzien waarvan
      toepassing is gegeven aan [artikel 1.4a.1, eerste lid, van de Wet educatie en beroepsonderwijs][ref2], tezamen
      met de andere gegevens, bedoeld in [artikel 2.3.6a, tweede en vijfde lid][ref3], in samenhang met artikel 1.4a.1,
