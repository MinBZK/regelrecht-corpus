  - number: '4.1'
    text: De inspectie oefent het toezicht uit met inachtneming van de vrijheid van onderwijs.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel4
  - number: '4.2'
    text: |-
      De inspectie oefent het toezicht uit op zodanige wijze dat instellingen niet meer worden belast dan voor een
      zorgvuldige uitoefening van het toezicht noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel4
  - number: '4.3'
    text: |-
      De intensiteit van het toezicht in het onderwijs, met uitzondering van het hoger onderwijs, is afhankelijk van
      de kwaliteit van het onderwijs, van de wijze waarop de professionaliteit van de instelling en het bestuur is
      gewaarborgd, van de mate van naleving van wettelijke voorschriften en, voor zover deze wordt bekostigd uit ’s Rijks
      kas, van de financiële situatie van de instelling.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel4
  - number: '4.4'
    text: |-
      De uitoefening van het toezicht is er mede op gericht betrokkenen te informeren over de ontwikkeling, in het
      bijzonder van de kwaliteit, van het onderwijs.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel4
  - number: '5'
    text: |-
      Bij de uitoefening van het toezicht op opleidingen, gericht op een beroep waarvoor bij of krachtens de wet
      vereisten zijn gesteld op het gebied van kennis, inzicht, vaardigheden en in voorkomende gevallen beroepshoudingen,
      waarover degene die de opleiding voltooit, met het oog op het beroepsmatig functioneren dient te beschikken, pleegt
      de inspectie overleg met door Onze Minister wie het aangaat, aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel5
  - number: '6.1'
    text: 'Bij de inspectie zijn vertrouwensinspecteurs werkzaam voor:'
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel6
  - number: 6.1.a
    text: |-
      onderwijsdeelnemers die het slachtoffer zijn van seksueel misbruik, seksuele intimidatie, fysiek geweld, psychisch
      geweld, discriminatie of radicalisering, gepleegd door een ten behoeve van de instelling met taken belast persoon
      of een onderwijsdeelnemer van de instelling,
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel6
  - number: 6.1.b
    text: |-
      ten behoeve van een instelling met taken belaste personen die het slachtoffer zijn van seksueel misbruik, seksuele
      intimidatie, fysiek geweld, psychisch geweld, discriminatie of radicalisering, gepleegd door een ten behoeve van de
      instelling met taken belast persoon of een onderwijsdeelnemer van de instelling, en
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel6
  - number: 6.1.c
    text: |-
      onderwijsdeelnemers, ten behoeve van een instelling met taken belaste personen, besturen, ouders, op instellingen
      ingestelde klachtencommissies en op instellingen aangestelde vertrouwenspersonen, die geconfronteerd worden met een
      geval van seksueel misbruik, seksuele intimidatie, fysiek geweld, psychisch geweld, discriminatie of radicalisering
      als bedoeld onder a of b.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel6
  - number: '6.2'
    text: |-
      Naast zijn taken, voortvloeiend uit [artikel 3][ref1], heeft de vertrouwensinspecteur ten behoeve van de in het
      eerste lid genoemde personen en organen de volgende taken:


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel3
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '3'
        hoofdstuk: '2'
  - number: 6.2.a
    text: het fungeren als aanspreekpunt,
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel6
  - number: 6.2.b
    text: het adviseren over eventueel te nemen stappen,
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel6
  - number: 6.2.c
    text: het bijstaan bij het nemen van stappen gericht op het zoeken naar een oplossing, en
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel6
  - number: 6.2.d
    text: het desgevraagd begeleiden bij het indienen van een klacht of het doen van aangifte.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel6
  - number: '6.3'
    text: |-
      De vertrouwensinspecteur is, voorzover het betreft misdrijven als bedoeld in
      [titel XIV van het Wetboek van Strafrecht][ref1] of [titel XIV van het Wetboek van Strafrecht BES][ref2]
      jegens een onderwijsdeelnemer of een ten behoeve van een instelling met taken belast persoon, vrijgesteld
      van de verplichting tot het doen van aangifte als bedoeld in de [artikelen 160, eerste lid][ref3], en
      [162, eerste lid, van het Wetboek van Strafvordering][ref4] of de [artikelen 198, eerste lid][ref5], en
      [200, eerste lid, van het Wetboek van Strafvordering BES][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0001854
      [ref2]: https://wetten.overheid.nl/BWBR0028681
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel160
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel162
      [ref5]: https://wetten.overheid.nl/BWBR0028681#Artikel198
      [ref6]: https://wetten.overheid.nl/BWBR0028681#Artikel200
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001854
      - id: ref2
        bwb_id: BWBR0028681
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '160'
      - id: ref4
        bwb_id: BWBR0001903
        artikel: '162'
      - id: ref5
        bwb_id: BWBR0028681
        artikel: '198'
      - id: ref6
        bwb_id: BWBR0028681
        artikel: '200'
  - number: '6.4'
    text: |-
      De vertrouwensinspecteur is voorzover het betreft een geval van seksueel misbruik of seksuele intimidatie als
      bedoeld in het eerste lid, onder a of b, verplicht tot geheimhouding van hetgeen hem in de uitoefening van zijn
      functie is toevertrouwd door een onderwijsdeelnemer, de ouders van een onderwijsdeelnemer of een ten behoeve van
      een instelling met taken belast persoon.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel6
  - number: '6.5'
    text: |-
      De vertrouwensinspecteur is bevoegd zonder toestemming van degene die het betreft bijzondere gegevens als bedoeld
      in [artikel 16 van de Wet bescherming persoonsgegevens][ref1] te verwerken met betrekking tot de personen, bedoeld
      in het eerste lid, indien uit een melding redelijkerwijs een vermoeden van seksueel misbruik, seksuele intimidatie,
      psychisch geweld, fysiek geweld, discriminatie of radicalisering kan worden afgeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel16
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '16'
  - number: '6.6'
    text: |-
      De vertrouwensinspecteur verstrekt de door hem verzamelde gegevens niet aan derden. In het verslag over de staat
      van het onderwijs, bedoeld in [artikel 8, tweede lid][ref1], worden slechts geabstraheerde gegevens opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel8
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '8'
        hoofdstuk: '2'
  - number: '6.7'
    text: |-
      In afwijking van het zesde lid is de vertrouwensinspecteur bevoegd rechtstreeks onder de verantwoordelijkheid van
      Onze Minister van Veiligheid en Justitie vallende instanties in kennis te stellen van een geval of vermoeden van
      een geval van psychisch geweld, fysiek geweld, discriminatie of radicalisering:
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel6
  - number: 6.7.a
    text: in het belang van de onderwijsdeelnemers,
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel6
  - number: 6.7.b
    text: in het belang van ten behoeve van een instelling met taken belaste personen, of
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel6
  - number: 6.7.c
    text: indien de ernst van de situatie waarop de melding betrekking heeft daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel6
  - number: 6a.1
    text: |-
      De inspectie fungeert als aanspreekpunt voor ten behoeve van een instelling met taken belaste personen die van
      oordeel zijn dat de kwaliteit van het onderwijs tekortschiet ten gevolge van het door het bestuur van de instelling
      gevoerde personeelsbeleid.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel6a
  - number: 6a.2
    text: |-
      De inspectie beoordeelt of uit hetgeen haar op grond van het eerste lid ter kennis is gebracht een redelijk
      vermoeden voortvloeit dat de kwaliteit van het onderwijs tekortschiet.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel6a
  - number: 6a.3
    text: De inspectie is verplicht tot geheimhouding van hetgeen haar op grond van het eerste lid is toevertrouwd.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel6a
  - number: '7.1'
    text: De inspectie stelt jaarlijks een jaarwerkplan vast. Het jaarwerkplan behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel7
  - number: '7.2'
    text: Onze Minister zendt het jaarwerkplan van de inspectie aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel7
  - number: '8.1'
    text: |-
      De inspectie rapporteert desgevraagd en uit eigen beweging aan Onze Minister over de ontwikkeling, in het bijzonder
      van de kwaliteit, van het onderwijs en doet op grond daarvan voorstellen die zij in het belang van het onderwijs
      nodig acht.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel8
  - number: '8.2'
    text: |-
      De inspectie stelt jaarlijks uiterlijk de derde woensdag van mei het verslag over de staat van het onderwijs,
      bedoeld in [artikel 23, achtste lid, van de Grondwet][ref1] vast. Onze Minister zendt het verslag, vergezeld van
      een reactie, namens de regering onverwijld aan de Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel23
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '23'
  - number: '8.3'
    text: |-
      Onze Minister geeft geen aanwijzingen met betrekking tot de in de rapportages neergelegde oordelen van de inspectie
      over de ontwikkeling, in het bijzonder van de kwaliteit, van het onderwijs.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel8
  - number: '9.1'
    text: |-
      Bij de uitoefening van de taken van de inspectie zijn, voorzover deze niet het toezicht op de naleving van bij of
      krachtens een onderwijswet als bedoeld in [artikel 1, onderdeel d, sub 1][ref1], gegeven voorschriften betreffen,
      de [artikelen 5:12 tot en met 5:17][ref2] en [5:20 van de Algemene wet bestuursrecht][ref3] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '9.2'
    text: |-
      De bevoegdheden, bedoeld in de artikelen genoemd in het eerste lid, worden uitgeoefend door daartoe door Onze
      Minister aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel9
  - number: '9.3'
    text: Van een besluit tot aanwijzing als bedoeld in het tweede lid wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel9
  - number: '10.1'
    text: |-
      De [artikelen 11][ref1], [12][ref2], [13][ref3] en [15][ref4] zijn niet van toepassing op
      de instellingen voor hoger onderwijs, bedoeld in de [artikelen 1.9][ref5], [1.12][ref6] en
      [1.12a van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0013800#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0013800#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref6]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref7]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '11'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '12'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0013800
        artikel: '13'
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0013800
        artikel: '15'
        hoofdstuk: '3'
      - id: ref5
        bwb_id: BWBR0005682
        artikel: '1'
      - id: ref6
        bwb_id: BWBR0005682
        artikel: '1'
      - id: ref7
        bwb_id: BWBR0005682
        artikel: '1'
  - number: '10.2'
    text: |-
      Hoofdstuk 3 is niet van toepassing op de uitvoering van de taken, opgedragen aan het
      college van burgemeester en wethouders bij of krachtens [hoofdstuk 1, afdelingen 3][ref1] en
      [6 van de Wet kinderopvang en kwaliteitseisen peuterspeelzalen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Afdeling3
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Afdeling6
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0017017
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0017017
        afdeling: '6'
  - number: '11.1'
    text: |-
      Ter uitvoering van de in [artikel 3, tweede lid, onderdelen a, b en d][ref1], bedoelde taken onderzoekt de
      inspectie jaarlijks met inachtneming van [artikel 4][ref2] het onderwijs aan elke instelling. Naar aanleiding
      van het onderzoek geeft de inspectie een oordeel over de kwaliteit van het onderwijs aan de instelling en over de
      naleving van wettelijke voorschriften door de instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel4
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '4'
        hoofdstuk: '2'
  - number: '11.2'
    text: |-
      De inspectie verricht het onderzoek aan de hand van de bij of krachtens een onderwijswet gegeven
      voorschriften en, indien het betreft een instelling als bedoeld in de [Wet op het primair onderwijs][ref1], de
      [Wet op de expertisecentra][ref2] of de [Wet op het voortgezet onderwijs][ref3], aan de hand van de volgende
      aspecten van kwaliteit, te weten:


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003549
      - id: ref3
        bwb_id: BWBR0002399
  - number: 11.2.a
    text: leerresultaten,
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel11
  - number: 11.2.b
    text: voortgang in de ontwikkeling van leerlingen,
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel11
  - number: 11.2.c
    text: |-
      het gevoerde personeelsbeleid, voor zover daar op grond van [artikel 6a, eerste en tweede lid][ref1], aanleiding
      toe bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel6a
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 6a
        hoofdstuk: '2'
  - number: '11.3'
    text: |-
      Indien uit het onderzoek, bedoeld in het tweede lid, een redelijk vermoeden voortvloeit dat de
      kwaliteit tekortschiet, stelt de inspectie nader onderzoek in, waarbij tevens de oorzaken van het
      tekortschieten worden onderzocht. Dit nader onderzoek verricht zij, indien het betreft een instelling
      als bedoeld in de [Wet op het primair onderwijs][ref1], de [Wet op de expertisecentra][ref2] of de
      [Wet op het voortgezet onderwijs][ref3], mede aan de hand van een of meer van de volgende aspecten van kwaliteit,
      te weten:


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003549
      - id: ref3
        bwb_id: BWBR0002399
  - number: 11.3.a
    text: het leerstofaanbod,
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel11
  - number: 11.3.b
    text: de leertijd,
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel11
  - number: 11.3.c
    text: het pedagogisch klimaat,
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel11
  - number: 11.3.d
    text: het schoolklimaat,
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel11
  - number: 11.3.e
    text: de effectiviteit van het didactisch handelen van het onderwijspersoneel,
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel11
  - number: 11.3.f
    text: de leerlingenzorg,
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel11
  - number: 11.3.g
    text: de inhoud, het niveau en de uitvoering van de toetsen, tests, opdrachten of examens,
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel11
  - number: 11.3.h
    text: 'voor wat betreft de kwaliteit van het onderwijspersoneel:'
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel11
  - number: 11.3.h.1°
    text: de eisen van bevoegdheid en bekwaamheid,
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel11
  - number: 11.3.h.2°
    text: het personeelsbeleid, voor zover het betreft de duurzame borging van de kwaliteit van het onderwijspersoneel.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel11
  - number: '11.4'
    text: |-
      Indien de inspectie naar aanleiding van het onderzoek, bedoeld in het derde lid, oordeelt dat de kwaliteit
      tekortschiet, verricht zij na een door haar aangegeven termijn onderzoek naar de kwaliteitsverbeteringen die de
      instelling heeft gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel11
  - number: '11.5'
    text: |-
      De inspectie stelt het bestuur in kennis van de datum en het doel van een onderzoek, bedoeld in het derde of vierde
      lid. Kennisgeving geschiedt ten minste vier weken voor aanvang van een onderzoek. Indien de inspectie dit nodig
      oordeelt, verricht zij onderzoek zonder deze kennisgeving.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel11
  - number: '11.6'
    text: |-
      Bij de uitvoering van een onderzoek, bedoeld in het derde of vierde lid, kan de inspectie onafhankelijke
      deskundigen betrekken.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel11
  - number: '11.7'
    text: |-
      Het tweede lid, onderdeel c en het derde lid, onderdeel h, zijn van overeenkomstige toepassing op de instellingen,
      bedoeld in de [Wet educatie en beroepsonderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: '12.1'
    text: |-
      De inspectie gaat bij een onderzoek als bedoeld in [artikel 11, eerste lid][ref1], uit van openbare
      verantwoordingsinformatie over de resultaten en de kwaliteit van het onderwijs, de financiële situatie van de
      instelling en de wijze waarop de professionaliteit van de instelling en het bestuur is gewaarborgd.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel11
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '11'
        hoofdstuk: '3'
  - number: '12.2'
    text: |-
      De informatie, bedoeld in het eerste lid, is richtinggevend voor het oordeel van de inspectie, indien deze
      voldoende actueel en betrouwbaar is.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel12
  - number: 12a.1
    text: |-
      Ter uitvoering van de in [artikel 3, tweede lid, onderdelen b en d][ref1], bedoelde taken onderzoekt de inspectie
      met inachtneming van [artikel 4][ref2] de naleving van de wettelijke voorschriften en de financiële rechtmatigheid
      bij instellingen voor hoger onderwijs, als bedoeld in [artikel 10, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0013800#Artikel10
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '4'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0013800
        artikel: '10'
        hoofdstuk: '3'
  - number: 12a.2
    text: |-
      Ter uitvoering van de in [artikel 3, tweede lid, onderdelen b, c en d][ref1], bedoelde taken onderzoekt de
      inspectie ontwikkelingen in het stelsel van hoger onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel3
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '3'
        hoofdstuk: '2'
  - number: 12a.3
    text: |-
      Ter uitvoering van de in [artikel 3, tweede lid, onderdelen b, c en d][ref1], bedoelde taken kan de inspectie in
      incidentele gevallen onderzoek verrichten op aanwijzing van de minister dan wel uit eigen beweging onder door Onze
      Minister te stellen voorwaarden. Dit onderzoek kan mede de kwaliteit van het onderwijs omvatten.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel3
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '3'
        hoofdstuk: '2'
  - number: 12a.4
    text: |-
      [Artikel 11, vierde tot en met zesde lid][ref1], is van overeenkomstige toepassing. De [artikelen 20][ref2] en
      [21][ref3] zijn van overeenkomstige toepassing, tenzij de aard of omvang van het onderzoek zich tegen openbare
      rapportage verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0013800#Artikel21
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '11'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '20'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0013800
        artikel: '21'
        hoofdstuk: '5'
  - number: '13.1'
    text: |-
      De inspectie legt haar werkwijze voor een onderzoek als bedoeld in [artikel 11][ref1], vast in een of meer
      toezichtskaders. De toezichtskaders behoeven de goedkeuring van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel11
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '11'
        hoofdstuk: '3'
  - number: '13.2'
    text: |-
      Alvorens een toezichtskader vast te stellen of te wijzigen voert de inspectie overleg met vertegenwoordigers van
      het onderwijsveld en andere betrokkenen, terwijl bij onderwerpen betrekking hebbend op de vrijheid van inrichting
      in ieder geval overleg wordt gevoerd met de erkende richtingen.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel13
  - number: '13.3'
    text: Een toezichtskader wordt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel13
  - number: 13a
    text: |-
      Indien de inspectie oordeelt dat de kwaliteit van het onderwijs ernstig of langdurig tekortschiet, informeert zij
      het college van burgemeester en wethouders van de gemeente waar de betreffende instelling gelegen is.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel13a
  - number: '14.1'
    text: |-
      Indien de inspectie oordeelt dat de kwaliteit van het onderwijs ernstig of langdurig tekortschiet dan wel de
      naleving van voorschriften als bedoeld in de [artikelen 11][ref1] en [12a][ref2] tekortschiet, informeert zij Onze
      Minister en kan zij voorstellen doen over te treffen maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel12a
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '11'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: 12a
        hoofdstuk: '3'
  - number: '14.2'
    text: De inspectie stelt het bestuur van de betreffende instelling in kennis van haar voorstellen aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel14
  - number: '15.1'
    text: |-
      Naast het onderzoek, bedoeld in [artikel 11][ref1], kan de inspectie ter uitvoering van haar taken, bedoeld in
      [artikel 3][ref2], uit eigen beweging dan wel op aanwijzing van Onze Minister specifiek onderzoek verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel3
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel15
