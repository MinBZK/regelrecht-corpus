  - number: 15f.1
    text: |-
      De inspectie houdt toezicht op de kwaliteit van het functioneren van het College voor examens en op de naleving
      van de bij of krachtens de [Wet College voor examens][ref1], de [Wet op het voortgezet onderwijs][ref2] en de
      [Wet voortgezet onderwijs BES][ref3] gegeven voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0025364
      [ref2]: https://wetten.overheid.nl/BWBR0002399
      [ref3]: https://wetten.overheid.nl/BWBR0030284
