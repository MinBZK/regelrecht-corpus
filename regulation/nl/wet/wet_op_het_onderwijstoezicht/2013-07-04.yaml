        artikel: 24n
        hoofdstuk: 6b
  - number: 24q.5
    text: 'Op grond van het vierde lid kunnen uitsluitend diplomagegevens worden verstrekt van:'
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24q
  - number: 24q.5.a
    text: |-
      de waardedocumenten, bedoeld in [artikel 24n, onder a tot en met d en f tot en met k][ref1], indien het betreft een
      instelling als bedoeld in artikel 24n, onder a, i, j of k,


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel24n
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24q
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 24n
        hoofdstuk: 6b
  - number: 24q.5.b
    text: |-
      de waardedocumenten, bedoeld in [artikel 24n, onder b, c, f, g en h][ref1], indien het betreft een instelling als
      bedoeld in artikel 24n, eerste lid, onder b,


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel24n
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24q
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 24n
        hoofdstuk: 6b
  - number: 24q.5.c
    text: |-
      de waardedocumenten, bedoeld in [artikel 24n, onder c, f, g en h][ref1], indien het betreft een school, instelling
      of afdeling als bedoeld in artikel 24n, eerste lid, onder c, f of g,


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel24n
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24q
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 24n
        hoofdstuk: 6b
  - number: 24q.5.d
    text: |-
      de waardedocumenten, bedoeld in [artikel 24n, onder c, d, f, g en h][ref1], indien het betreft het College voor
      examens.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel24n
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24q
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 24n
        hoofdstuk: 6b
  - number: 24q.6
    text: |-
      Uit het diplomaregister worden desgevraagd diplomagegevens verstrekt aan Onze Minister en de inspectie voor
      zover dat noodzakelijk is voor de uitoefening van hun wettelijke taken. Voor zover het betreft het gebruik
      door Onze Minister voor de begrotings- en beleidsvoorbereiding, worden de diplomagegevens op een zodanige
      wijze verstrekt, dat degenen op wie zij betrekking hebben niet geïdentificeerd of identificeerbaar zijn.
      [Artikel 24f, zevende en achtste lid][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel24f
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24q
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 24f
        hoofdstuk: 6a
        paragraaf: '2'
  - number: 24q.7
    text: 'Uit het diplomaregister worden desgevraagd diplomagegevens verstrekt aan:'
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24q
  - number: 24q.7.a
    text: |-
      Onze Minister van Volksgezondheid, Welzijn en Sport als beheerder van een register als bedoeld in
      [artikel 3 van de Wet op de beroepen in de individuele gezondheidszorg][ref1], ten behoeve van de beoordeling van
      een aanvraag om inschrijving in dat register;


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24q
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '3'
  - number: 24q.7.b
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties als beheerder van het Informatiesysteem Inburgering,
      bedoeld in [artikel 47, eerste lid, van de Wet inburgering][ref1] ten behoeve van de beoordeling van de
      aanwezigheid van een vrijstelling van de inburgeringsplicht;


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel47
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24q
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '47'
  - number: 24q.7.c
    text: |-
      het Uitvoeringsinstituut werknemersverzekeringen, voor zover dat noodzakelijk is voor de uitvoering van de
      taken, bedoeld in [artikel 30, eerste lid][ref1], [30a, eerste en tweede lid][ref2], [30b][ref3], [30d][ref4] en
      [31 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel30b
      [ref4]: https://wetten.overheid.nl/BWBR0013060#Artikel30d
      [ref5]: https://wetten.overheid.nl/BWBR0013060#Artikel31
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24q
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 30a
      - id: ref3
        bwb_id: BWBR0013060
        artikel: 30b
      - id: ref4
        bwb_id: BWBR0013060
        artikel: 30d
      - id: ref5
        bwb_id: BWBR0013060
        artikel: '31'
  - number: 24q.8
    text: |-
      Uit het diplomaregister wordt desgevraagd aan betrokkene een elektronisch document met diplomagegevens verstrekt,
      dat is beveiligd tegen wijzigingen en waarvan kan worden vastgesteld dat het is afgegeven door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24q
  - number: 24q.9
    text: De verstrekking van gegevens uit het diplomaregister geschiedt elektronisch.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24q
  - number: 24q.10
    text: |-
      In afwijking van het negende lid geschiedt de verstrekking van gegevens op grond van het eerste of achtste lid
      schriftelijk indien betrokkene hierom verzoekt.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24q
  - number: 24q.11
    text: |-
      Voor de elektronische verstrekking van gegevens op grond van het eerste tot en met zesde lid is geen vergoeding
      verschuldigd. Onze Minister kan regels stellen over de vergoeding die verschuldigd is voor de elektronische
      verstrekking van gegevens op grond van het zevende en achtste lid en voor de schriftelijke verstrekking van
      gegevens op grond van het tiende lid.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24q
  - number: 24r
    text: |-
      Diplomagegevens worden tot 60 jaar na de maand van afgifte van het laatst behaalde waardedocument of, indien dat
      eerder is, tot het overlijden van betrokkene bewaard in het diplomaregister in een vorm die het mogelijk maakt
      betrokkene te identificeren.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24r
  - number: 24s.1
    text: |-
      Onze Minister stelt bij ministeriële regeling regels omtrent de autorisatie van degenen die onder zijn gezag vallen
      voor verwerking van persoonsgegevens uit het diplomaregister.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24s
  - number: 24s.2
    text: |-
      Onze Minister benoemt een functionaris voor de gegevensbescherming als bedoeld in
      [artikel 62 van de Wet bescherming persoonsgegevens][ref1] die in elk geval is belast met het toezicht op de
      verwerking van persoonsgegevens in het diplomaregister.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel62
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24s
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '62'
  - number: 24t.1
    text: |-
      Onze Minister houdt gedurende twintig jaren volgend op de verstrekking van gegevens uit het diplomaregister
      met uitzondering van de verstrekking op grond van [artikel 24q, eerste lid of zesde lid, tweede volzin][ref1],
      aantekening van de verstrekking, tenzij de verstrekking van gegevens in de genoemde periode anderszins is te
      herleiden uit het diplomaregister.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel24q
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24t
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 24q
        hoofdstuk: 6b
  - number: 24t.2
    text: |-
      Onze Minister deelt aan de betrokkene mede of hem betreffende gegevens gedurende twintig jaren voorafgaande aan
      het verzoek uit het diplomaregister zijn verstrekt aan een overheidsorgaan, een onderwijsinstelling of een andere
      derde. Onze Minister kan volstaan met een in algemene termen gestelde mededeling omtrent de verstrekkingen.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24t
  - number: 24u
    text: |-
      Een derde kan bij het verwerken van persoonsgegevens gebruik maken van het persoonsgebonden nummer voor zover dit
      noodzakelijk is in verband met de verstrekking van gegevens aan hem uit het diplomaregister.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24u
  - number: '33'
    text: a. b. c. d. c.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel33
  - number: '34'
    text: |-
      Onze Minister zendt binnen vijf jaren na inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel34
  - number: '35'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel35
  - number: '36'
    text: 'Deze wet wordt aangehaald als: Wet op het onderwijstoezicht.'
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel36
