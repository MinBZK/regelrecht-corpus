  - number: '2.1'
    text: |-
      Er is een Inspectie van het onderwijs, die onder Onze Minister van Onderwijs, Cultuur en Wetenschap ressorteert.
      Aan het hoofd van de inspectie staat de inspecteur-generaal.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel2
  - number: '2.2'
    text: |-
      Onze Minister geeft met betrekking tot de uitoefening van de in deze wet aan de inspectie toegekende bevoegdheden
      uitsluitend in schriftelijke vorm zijn aanwijzingen, onder mededeling daarvan aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel2
  - number: '3.1'
    text: Het toezicht op het onderwijs is opgedragen aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel3
  - number: '3.2'
    text: 'Het toezicht omvat de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel3
  - number: 3.2.a
    text: |-
      het beoordelen en bevorderen van de kwaliteit van het onderwijs, daaronder begrepen de kwaliteit van
      het onderwijspersoneel, aan instellingen als bedoeld in de onderwijswetten met uitzondering van de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], het beoordelen en bevorderen van de kwaliteit
      van de uitoefening van de taken van de regionale expertisecentra en de kenniscentra beroepsonderwijs bedrijfsleven,
      en het beoordelen van de kwaliteitsvoorwaarden van de voorschoolse educatie op peuterspeelzalen en kindercentra,
      bedoeld in de [Wet kinderopvang en kwaliteitseisen peuterspeelzalen][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0017017
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005682
      - id: ref2
        bwb_id: BWBR0017017
  - number: 3.2.b
    text: het beoordelen en bevorderen van de naleving van de bij of krachtens een onderwijswet gegeven voorschriften,
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel3
  - number: 3.2.c
    text: |-
      het beoordelen en bevorderen van de kwaliteit van het stelsel voor hoger
      onderwijs, met inbegrip van het stelsel van accreditatie, bedoeld in
      [artikel 1.1, onderdelen s en t, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
  - number: 3.2.d
    text: |-
      het beoordelen en bevorderen van de financiële rechtmatigheid door in ieder geval het verrichten van onderzoek
      naar de rechtmatige verkrijging van de bekostiging, naar de controlerapporten van de door het bestuur aangewezen
      accountant, naar de rechtmatigheid van de bestedingen en naar de rechtmatigheid van het financieel beheer van de
      bekostigde instellingen,
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel3
  - number: 3.2.e
    text: |-
      het beoordelen en bevorderen van de rechtmatigheid en de doeltreffendheid van de uitoefening van de taken,
      opgedragen aan het college van burgemeester en wethouders bij of krachtens [hoofdstuk 1, afdelingen 3][ref1] en
      [6 van de Wet kinderopvang en kwaliteitseisen peuterspeelzalen][ref2], met uitzondering van de bij of krachtens
