  - number: 24m.1
    text: |-
      Er is een diplomaregister hoger onderwijs, beroepsonderwijs, voortgezet (algemeen volwassenen)onderwijs,
      inburgering en Nederlands als tweede taal, dat ten doel heeft diplomagegevens te verstrekken aan:
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24m
  - number: 24m.1.a
    text: de betrokkene;
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24m
  - number: 24m.1.b
    text: |-
      de instelling of school, bedoeld in [artikel 24n][ref1], of de school of afdeling voor voortgezet speciaal
      onderwijs, waarbij de betrokkene is ingeschreven of minder dan vijf jaar voor de gegevensverstrekking was
      ingeschreven;


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel24n
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24m
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 24n
        hoofdstuk: 6b
  - number: 24m.1.c
    text: |-
      de instelling of school, bedoeld in [artikel 24n][ref1], of het College voor examens, waarbij de betrokkene minder
      dan vijf jaar voor de gegevensverstrekking een waardedocument heeft behaald;


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel24n
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24m
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 24n
        hoofdstuk: 6b
  - number: 24m.1.d
    text: |-
      een instelling of school als bedoeld in [artikel 24n][ref1], of het College voor examens, voor zover de verwerking
      van die gegevens noodzakelijk is voor de aanmelding, inschrijving of examinering van de betrokkene;


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel24n
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24m
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 24n
        hoofdstuk: 6b
  - number: 24m.1.e
    text: |-
      overheidsinstanties, voor zover de verwerking van die gegevens noodzakelijk is voor de goede vervulling van hun
      publieke taak;
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24m
  - number: 24m.1.f
    text: overige derden.
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24m
  - number: 24m.2
    text: |-
      Met betrekking tot de verwerking van persoonsgegevens als bedoeld in dit hoofdstuk is Onze Minister de
      verantwoordelijke, bedoeld in [artikel 1, onderdeel d, van de Wet bescherming persoonsgegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24m
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '1'
  - number: 24n
    text: |-
      Behoudens [artikel 24r][ref1] omvat het diplomaregister gegevens over:


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel24r
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24n
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 24r
        hoofdstuk: 6b
  - number: 24n.a
    text: |-
      getuigschriften van met goed gevolg afgelegde propedeutische examens van uit ’s Rijks kas bekostigde
      opleidingen hoger beroepsonderwijs en met goed gevolg afgelegde afsluitende examens van uit ’s
      Rijks kas bekostigde opleidingen hoger onderwijs, met uitzondering van de programma’s, bedoeld in
      [artikel 7.8a, eerste lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], die op of na 1
      januari 1996 zijn afgegeven door instellingen als bedoeld in de onderdelen a, b, c en g van de [bijlage van de Wet
      op het hoger onderwijs en wetenschappelijk onderzoek](onbekend);


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24n
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 24n.b
    text: |-
      diploma’s van uit ’s Rijks kas bekostigde beroepsopleidingen die op of na 1 januari 2007 zijn afgegeven door
      instellingen als bedoeld in [artikel 1.1.1, onder b, van de Wet educatie en beroepsonderwijs][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24n
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 24n.c
    text: |-
      diploma’s, cijferlijsten en certificaten van opleidingen als bedoeld in
      [artikel 7.3.1, eerste lid, onder a, van de Wet educatie en beroepsonderwijs][ref1] die op of na 1 januari 2007
      zijn afgegeven door instellingen als bedoeld in [artikel 1.3.1, derde lid, van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24n
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 24n.d
    text: |-
      diploma’s van staatsexamens als bedoeld in [artikel 60, tweede lid, van de Wet op het voortgezet onderwijs][ref1]
      die op of na 1 januari 2011 zijn afgegeven door het College voor examens;


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel60
    url: https://wetten.overheid.nl/BWBR0013800/2013-07-04#Artikel24n
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '60'
  - number: 24n.e
    text: |-
      diploma’s voor het inburgeringsexamen, bedoeld in artikel 13, eerste lid, van de Wet inburgering die op of na 1
