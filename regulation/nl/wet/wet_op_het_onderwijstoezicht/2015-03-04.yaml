      1 Er is een register vrijstellingen en vervangende leerplicht dat ten doel heeft:

      a. burgemeester en wethouders te voorzien van de gegevens die noodzakelijk zijn voor de uitvoering van de taken
      inzake de handhaving van de [Leerplichtwet 1969][ref1];

      b. Onze Minister gegevens te verstrekken voor de bijstelling van het aantal voortijdig schoolverlaters zoals blijkt
      uit het basisregister onderwijs, ten behoeve van de bekostiging van scholen en instellingen en de begrotings- en
      beleidsvoorbereiding;

      c. ten behoeve van de beleidsvorming ten aanzien van [artikel 3a][ref2], [3b][ref3], [5 tot en met 10][ref4], en
      [15 van de Leerplichtwet 1969][ref5] landelijk en per woongemeente een overzicht te maken van:

      1°. het aantal jongeren dat is vrijgesteld en het aantal jongeren met een vervangende leerplicht; en

      2°. het aantal jongeren dat eerder is vrijgesteld van de leerplicht of eerder een vervangende leerplicht heeft
      gehad.

      2 Met betrekking tot de verwerking van persoonsgegevens, bedoeld in deze paragraaf, is Onze Minister de
      verantwoordelijke, bedoeld in [artikel 1, onderdeel d, van de Wet bescherming persoonsgegevens][ref6].


