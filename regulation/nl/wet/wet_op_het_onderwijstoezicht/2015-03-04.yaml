  - number: '11'
    text: |-
      1 Ter uitvoering van de in [artikel 3, tweede lid, onderdelen a, b en d][ref1], bedoelde taken onderzoekt de
      inspectie jaarlijks met inachtneming van [artikel 4][ref2] het onderwijs aan elke instelling. Naar aanleiding
      van het onderzoek geeft de inspectie een oordeel over de kwaliteit van het onderwijs aan de instelling en over de
      naleving van wettelijke voorschriften door de instelling.

      2 De inspectie verricht het onderzoek aan de hand van de bij of krachtens een onderwijswet gegeven
      voorschriften en, indien het betreft een instelling als bedoeld in de [Wet op het primair onderwijs][ref3], de
      [Wet op de expertisecentra][ref4] of de [Wet op het voortgezet onderwijs][ref5], aan de hand van de volgende
      aspecten van kwaliteit, te weten:

      a. leerresultaten,

      b. voortgang in de ontwikkeling van leerlingen,

      c. het gevoerde personeelsbeleid, voor zover daar op grond van [artikel 6a, eerste en tweede lid][ref6], aanleiding
      toe bestaat.

      3 Indien uit het onderzoek, bedoeld in het tweede lid, een redelijk vermoeden voortvloeit dat de
      kwaliteit tekortschiet, stelt de inspectie nader onderzoek in, waarbij tevens de oorzaken van het
      tekortschieten worden onderzocht. Dit nader onderzoek verricht zij, indien het betreft een instelling
      als bedoeld in de [Wet op het primair onderwijs][ref7], de [Wet op de expertisecentra][ref8] of de
      [Wet op het voortgezet onderwijs][ref9], mede aan de hand van een of meer van de volgende aspecten van kwaliteit,
      te weten:

      a. het leerstofaanbod,

      b. de leertijd,

      c. het pedagogisch klimaat,

      d. het schoolklimaat,

      e. de effectiviteit van het didactisch handelen van het onderwijspersoneel,

      f. de leerlingenzorg,

      g. de inhoud, het niveau en de uitvoering van de toetsen, tests, opdrachten of examens,

      h. voor wat betreft de kwaliteit van het onderwijspersoneel:

      1°. de eisen van bevoegdheid en bekwaamheid,

      2°. het personeelsbeleid, voor zover het betreft de duurzame borging van de kwaliteit van het onderwijspersoneel.

      4 Indien de inspectie naar aanleiding van het onderzoek, bedoeld in het derde lid, oordeelt dat de kwaliteit
      tekortschiet, verricht zij na een door haar aangegeven termijn onderzoek naar de kwaliteitsverbeteringen die de
      instelling heeft gerealiseerd.

      5 De inspectie stelt het bestuur in kennis van de datum en het doel van een onderzoek, bedoeld in het derde of
      vierde lid. Kennisgeving geschiedt ten minste vier weken voor aanvang van een onderzoek. Indien de inspectie dit
      nodig oordeelt, verricht zij onderzoek zonder deze kennisgeving.

      6 Bij de uitvoering van een onderzoek, bedoeld in het derde of vierde lid, kan de inspectie onafhankelijke
      deskundigen betrekken.

      7 Het tweede lid, onderdeel c en het derde lid, onderdeel h, zijn van overeenkomstige toepassing op de
      instellingen, bedoeld in de [Wet educatie en beroepsonderwijs][ref10].


