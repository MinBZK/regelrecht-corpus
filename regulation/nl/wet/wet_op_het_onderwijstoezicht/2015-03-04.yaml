  - number: 11a
    text: |-
      1 Zo spoedig mogelijk na ontvangst van de beschikking waarin is vermeld dat de bekostiging een
      aanvang zal nemen, bedoeld in [artikel 79, achtste lid, van de Wet op het primair onderwijs][ref1],
      [artikel 86, zesde lid, van de Wet op de expertisecentra][ref2],
      [artikel 66, derde lid, van de Wet op het voortgezet onderwijs][ref3] of
      [artikel 2.1.3, tweede lid, onderdeel b, van de Wet educatie en beroepsonderwijs][ref4] wat een agrarisch
      opleidingscentrum betreft uitsluitend voor het daaraan verzorgde voortgezet onderwijs, toont het bevoegd gezag bij
      de inspectie aan dat het ten aanzien van die instelling kan voldoen aan de vereisten met betrekking tot:

      a. de bekwaamheid van degenen die onderwijs geven, bedoeld in [artikel 3 van de Wet op het primair onderwijs][ref5],
      [artikel 3 van de Wet op de expertisecentra][ref6] en [artikel 33 van de Wet op het voortgezet onderwijs][ref7], en

      b. de voorschriften omtrent onderwijstijd gesteld op grond van de [Wet op het primair onderwijs][ref8], de
      [Wet op de expertisecentra][ref9] en de [Wet op het voortgezet onderwijs][ref10].

      2 De inspectie kan indien het bepaalde in het eerste lid daartoe aanleiding geeft overleg voeren met het
      bevoegd gezag van de instelling. Naar aanleiding van dit overleg kan de inspectie besluiten dat het bepaalde in
      [artikel 11b, tweede tot en met zesde lid][ref11], van overeenkomstige toepassing is, met dien verstande dat in
      afwijking van het derde lid bij het opstellen van de risicoanalyse het schoolplan niet wordt betrokken, en in
      afwijking van het vierde lid de risicoanalyse wordt opgesteld binnen drie maanden na het overleg, bedoeld in de
      eerste volzin.


