  - number: 24c
    text: |-
      1 In het basisregister onderwijs zijn de volgende gegevens opgenomen:

      a. de persoonsgebonden nummers van de leerlingen die zijn ingeschreven of ingeschreven zijn geweest aan een uit
      de openbare kas bekostigde school als bedoeld in de [Wet op het primair onderwijs][ref1], tezamen met de andere
      gegevens, genoemd in [artikel 178a, tweede en zevende lid, van de Wet op het primair onderwijs][ref2];

      b. de persoonsgebonden nummers van de leerlingen die zijn ingeschreven of ingeschreven zijn geweest aan een uit de
      openbare kas bekostigde school als bedoeld in de [Wet op de expertisecentra][ref3], tezamen met de andere gegevens,
      genoemd in [artikel 164a, tweede en achtste lid, van de Wet op de expertisecentra][ref4];

      c. de persoonsgebonden nummers van de leerlingen die zijn ingeschreven of ingeschreven zijn geweest aan een uit
      de openbare kas bekostigde school als bedoeld in de [Wet op het voortgezet onderwijs][ref5], tezamen met de andere
      gegevens, genoemd in [artikel 103b, tweede en achtste lid, van de Wet op het voortgezet onderwijs][ref6];

      c1. de persoonsgebonden nummers van de leerlingen die zijn ingeschreven of ingeschreven zijn geweest
      aan een school die is aangewezen op grond van [artikel 56 van de Wet op het voortgezet onderwijs][ref7],
      tezamen met de andere gegevens, bedoeld in [artikel 103b, tweede en achtste lid][ref8], in samenhang met
      [artikel 58, zevende lid, onderdeel a, van die wet][ref9];

      d. de persoonsgebonden nummers van de deelnemers aan een opleiding voortgezet algemeen
      volwassenenonderwijs die zijn ingeschreven of ingeschreven zijn geweest aan een instelling als bedoeld in
      [artikel 1.1.1, onder b1°, van de Wet educatie en beroepsonderwijs][ref10] alsmede deelnemers aan een opleiding
      educatie die zijn ingeschreven of ingeschreven zijn geweest aan een instelling waaraan door het gemeentebestuur
      op grond van [artikel 3 van de Wet participatiebudget][ref11] uitkeringen zijn toegekend, tezamen met de andere
      gegevens, genoemd in [artikel 2.3.6a, tweede en vijfde lid, van de Wet educatie en beroepsonderwijs][ref12];

      d1. de persoonsgebonden nummers van de deelnemers aan een opleiding educatie die zijn ingeschreven of ingeschreven
      zijn geweest aan een andere dan een in [artikel 1.1.1, onderdeel b, van de Wet educatie en beroepsonderwijs][ref13]
      bedoelde instelling of een instelling als bedoeld in die wet voor een opleiding educatie ten aanzien waarvan
      toepassing is gegeven aan [artikel 1.4a.1, eerste lid, van de Wet educatie en beroepsonderwijs][ref14], tezamen
      met de andere gegevens, bedoeld in [artikel 2.3.6a, tweede en vijfde lid][ref15], in samenhang met artikel 1.4a.1,
      achtste lid, onderdeel a, van die wet;

      e. de persoonsgebonden nummers van de deelnemers aan een beroepsopleiding die zijn ingeschreven
      of ingeschreven zijn geweest aan een uit ’s Rijks kas bekostigde instelling als bedoeld in
      de [Wet educatie en beroepsonderwijs][ref16], tezamen met de andere gegevens, genoemd in
      [artikel 2.5.5a, tweede en zevende lid, van de Wet educatie en beroepsonderwijs][ref17];

      e1. de persoonsgebonden nummers van de deelnemers aan een beroepsopleiding die zijn ingeschreven of ingeschreven
      zijn geweest aan een andere dan een in [artikel 1.1.1, onderdeel b, van de Wet educatie en beroepsonderwijs][ref18]
      bedoelde instelling of een instelling als bedoeld in die wet voor een beroepsopleiding ten aanzien waarvan
      toepassing is gegeven aan [artikel 1.4.1, eerste lid, van de Wet educatie en beroepsonderwijs][ref19], tezamen
      met de andere gegevens, bedoeld in [artikel 2.5.5a, tweede en zevende lid][ref20], in samenhang met artikel 1.4.1,
      zesde lid, onderdeel a, van die wet;

      f. de persoonsgebonden nummers van de studenten en extraneï die zijn ingeschreven of
      ingeschreven zijn geweest aan een uit ’s Rijks kas bekostigde instelling voor hoger onderwijs
      als bedoeld in de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref21],
      met uitzondering van de Open Universiteit, tezamen met de andere gegevens, genoemd in
      [artikel 7.52, tweede en vijfde lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref22];

      g. de hierna te noemen gegevens zoals die over de personen, bedoeld in de onderdelen a tot en met f, zijn opgenomen
      in de basisregistratie personen:

      1°. geslachtsnaam, voornamen, geboortedatum, geboorteland, geslacht, overlijdensdatum, geboorteland moeder en
      geboorteland vader;

      2°. de gegevens over de nationaliteit;

      3°. de gegevens over het verblijf in Nederland en het vorige verblijf buiten Nederland en over het vertrek uit
      Nederland en het vorige verblijf buiten Nederland;

      h. de gegevens over het verblijfsrecht van de vreemdeling zoals die over de personen, bedoeld in de onderdelen e,
      e1 en f, zijn opgenomen in de basisregistratie personen.

      2 Indien de in het eerste lid, onderdeel g, bedoelde gegevens van een leerling, deelnemer, student of extraneus
      aan een school of instelling als bedoeld in het eerste lid, onderdelen a tot en met f, niet zijn opgenomen in de
      basisregistratie personen worden in het basisregister onderwijs alleen opgenomen de gegevens die het bevoegd gezag
      verstrekt op basis van

      a. [artikel 178a, tweede en zevende lid, van de Wet op het primair onderwijs][ref23],

      b. [artikel 164a, tweede en achtste lid, van de Wet op de expertisecentra][ref24],

      c. [artikel 103b, tweede en achtste lid, van de Wet op het voortgezet onderwijs][ref25],

      c1. [artikel 103b, tweede en achtste lid][ref26], in samenhang met
      [artikel 58, zevende lid, onderdeel a, van de Wet op het voortgezet onderwijs][ref27],

      d. [artikel 2.3.6a, tweede en vijfde lid][ref28], of
      [2.5.5a, tweede of zevende lid, van de Wet educatie en beroepsonderwijs][ref29],

      d1. [artikel 2.3.6a, tweede en vijfde lid][ref30], in samenhang met
      [artikel 1.4a.1, achtste lid, onderdeel a, van de Wet educatie en beroepsonderwijs][ref31]
      en [artikel 2.5.5a, tweede en zevende lid][ref32], in samenhang met
      [artikel 1.4.1, zesde lid, onderdeel a, van die wet][ref33], of

      e. [artikel 7.52, tweede en vijfde lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref34].

      3 De persoonsgegevens van de leerlingen, deelnemers, studenten en extraneï die niet langer zijn ingeschreven
      aan een school of instelling als bedoeld in het eerste lid, onderdelen a tot en met f, worden tot vijf jaren na
      beëindiging van de laatste inschrijving bewaard in het basisregister onderwijs in een vorm die het mogelijk maakt
      de betrokkene te identificeren. [Artikel 10, tweede lid, van de Wet bescherming persoonsgegevens][ref35] is niet
      van toepassing. In afwijking van de eerste volzin geldt voor de geslachtsnaam, voornamen, geboortedatum, instelling
      voor hoger onderwijs waar een opleiding is gevolgd, naam van die opleiding, datum diploma en het aantal jaren
      genoten hoger onderwijs van studenten die niet langer zijn ingeschreven aan een instelling als bedoeld in het
      eerste lid, onderdeel f, een bewaartermijn van vijftig jaren.


