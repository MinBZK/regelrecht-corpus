      1 Er is een diplomaregister hoger onderwijs, beroepsonderwijs, voortgezet (algemeen volwassenen)onderwijs,
      inburgering en Nederlands als tweede taal, dat ten doel heeft diplomagegevens te verstrekken aan:

      a. de betrokkene;

      b. de instelling of school, bedoeld in [artikel 24n][ref1], of de school of afdeling voor voortgezet speciaal
      onderwijs, waarbij de betrokkene is ingeschreven of minder dan vijf jaar voor de gegevensverstrekking was
      ingeschreven;

      c. de instelling of school, bedoeld in [artikel 24n][ref2], of het College voor examens, waarbij de betrokkene
      minder dan vijf jaar voor de gegevensverstrekking een waardedocument heeft behaald;

      d. een instelling of school als bedoeld in [artikel 24n][ref3], of het College voor examens, voor zover de
      verwerking van die gegevens noodzakelijk is voor de aanmelding, inschrijving of examinering van de betrokkene;

      e. overheidsinstanties, voor zover de verwerking van die gegevens noodzakelijk is voor de goede vervulling van hun
      publieke taak;

      f. overige derden.

      2 Met betrekking tot de verwerking van persoonsgegevens als bedoeld in dit hoofdstuk is Onze Minister de
      verantwoordelijke, bedoeld in [artikel 1, onderdeel d, van de Wet bescherming persoonsgegevens][ref4].


