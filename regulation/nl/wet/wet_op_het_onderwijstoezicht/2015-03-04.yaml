      De [artikelen 20][ref1], [21][ref2], [22][ref3] en [23][ref4] zijn van overeenkomstige toepassing,
      met dien verstande dat in artikel 20, tweede lid, onder «een bij of krachtens een onderwijswet
      gegeven voorschrift» wordt verstaan «een bij of krachtens een onderwijswet of een bij of krachtens
