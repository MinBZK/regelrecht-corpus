  - number: 11b
    text: |-
      1 Binnen een maand na aanvang van de bekostiging van een instelling, bedoeld in
      [artikel 81 van de Wet op het primair onderwijs][ref1], [artikel 87 van de Wet op de expertisecentra][ref2],
      [artikel 66, vierde lid van de Wet op het voortgezet onderwijs][ref3], en
      [artikel 2.1.3, tweede lid, onderdeel b, van de Wet educatie en beroepsonderwijs][ref4] wat een agrarisch
      opleidingscentrum betreft uitsluitend voor het daaraan verzorgde voortgezet onderwijs, verstrekt de instelling aan
      de inspectie gegevens met betrekking tot:

      a. het schoolplan, bedoeld in [artikel 12 van de Wet op het primair onderwijs][ref5],
      [artikel 21 van de Wet op de expertisecentra][ref6] en [artikel 24 van de Wet op het voortgezet onderwijs][ref7],

      b. de bekwaamheid van degenen die onderwijs geven, bedoeld in [artikel 3 van de Wet op het primair onderwijs][ref8],
      [artikel 3 van de Wet op de expertisecentra][ref9] en [artikel 33 van de Wet op het voortgezet onderwijs][ref10],
      en

      c. het voldoen aan de voorschriften omtrent onderwijstijd die gelden op grond van de
      [Wet op het primair onderwijs][ref11], de [Wet op de expertisecentra][ref12] en de
      [Wet op het voortgezet onderwijs][ref13].

      2 De inspectie oefent toezicht uit door middel van het opstellen van een risicoanalyse indien:

      a. de gegevens, bedoeld in het eerste lid, niet binnen de genoemde termijn zijn verstrekt,

      b. de inspectie onvolkomenheden constateert in de naleving van het eerste lid.

      3 Bij het opstellen van de risicoanalyse worden de onderwerpen, genoemd in het eerste lid, onderdelen a, b en c,
      betrokken.

      4 De risicoanalyse wordt binnen drie maanden nadat de bekostiging is aangevangen door de inspectie opgesteld.

      5 Binnen een maand nadat de risicoanalyse is opgesteld toont de instelling ten genoegen van de inspectie aan dat de
      onvolkomenheden, bedoeld in het tweede lid, onderdeel b, zijn hersteld.

      6 Indien de instelling twee maanden na het opstellen van de risicoanalyse nog steeds in gebreke is ten aanzien
      van de naleving van het eerste lid, onderdelen a, b en c, kunnen de maatregelen worden genomen die door de in het
      eerste lid, aanhef, genoemde onderwijswetten worden mogelijk gemaakt.

      7 Nadat het bevoegd gezag van een niet uit de openbare kas bekostigde bijzondere school overeenkomstig
      [artikel 5 van de Wet op het primair onderwijs][ref14] of [artikel 54 van de Wet op het voortgezet onderwijs][ref15]
      aan Onze Minister kennis heeft gegeven van de oprichting van de school, brengt de inspectie zo spoedig mogelijk na
      de aanvang van het onderwijs advies uit aan burgemeester en wethouders over de vraag of deze onderwijsvoorziening
      een school is als bedoeld in [artikel 1, onderdeel b, subonderdeel 3, van de Leerplichtwet 1969][ref16].


