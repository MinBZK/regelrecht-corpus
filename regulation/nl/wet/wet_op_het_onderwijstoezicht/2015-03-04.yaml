preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels vast te stellen met betrekking tot het toezicht
    op het onderwijs;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013800/2015-03-04#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

      a. Onze Minister: Onze Minister van Onderwijs, Cultuur en Wetenschap en, voorzover het betreft het onderwijs op het
      gebied van landbouw en natuurlijke omgeving, Onze Minister van Economische Zaken, Landbouw en Innovatie,

      b. de inspectie: de Inspectie van het onderwijs,

      c. de inspecteur-generaal: de inspecteur-generaal van het onderwijs,

      d. onderwijswet:

      1. - [Leerplichtwet 1969][ref1],
        - [Wet op het primair onderwijs][ref2],
        - [Wet op de expertisecentra][ref3],
        - [Wet op het voortgezet onderwijs][ref4],
        - [Wet educatie en beroepsonderwijs][ref5],
        - [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref6],
        - [Wet medezeggenschap op scholen][ref7],
        - [Wet overige OCW-subsidies][ref8],
        - [Wet op de erkende onderwijsinstellingen][ref9], of
        - [Experimentenwet onderwijs][ref10],

      2. - [Leerplichtwet BES][ref11]
        - [Wet primair onderwijs BES][ref12]
        - [Wet voortgezet onderwijs BES][ref13]
        - [Wet educatie en beroepsonderwijs BES][ref14], of
        - [Wet sociale kanstrajecten jongeren BES][ref15]

      e. onderwijs: bij of krachtens een onderwijswet geregeld onderwijs, waaronder mede worden begrepen werkzaamheden
      als bedoeld in de [artikelen 176e, eerste lid, en 176g, eerste lid, van de Wet op het primair onderwijs][ref16],
      [162h, eerste lid][ref17], en [162j, eerste lid, van de Wet op de expertisecentra][ref18], en
      [118n, eerste lid][ref19], en [118p, eerste lid, van de Wet op het voortgezet onderwijs][ref20],

      f. voorschoolse educatie: voorschoolse educatie als bedoeld in de [artikelen 1.1, eerste lid][ref21], en
      [2.1, van de Wet kinderopvang en kwaliteitseisen peuterspeelzalen][ref22],

      g. instelling: school, instelling of exameninstelling in de zin van een onderwijswet, daaronder begrepen een niet
      bekostigde instelling,

      h instelling voor hoger onderwijs: een instelling als bedoeld in
      [artikel 1.2, onderdelen a en b, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref23],

      i. samenwerkingsverband: samenwerkingsverband als bedoeld in [artikel 1 van de Wet op het primair onderwijs][ref24]
      en [artikel 1 van de Wet op het voortgezet onderwijs][ref25],

      j. regionaal expertisecentrum: regionaal expertisecentrum als bedoeld in
      [artikel 28b van de Wet op de expertisecentra][ref26], waaronder begrepen de commissie voor de indicatiestelling
      die door het regionaal expertisecentrum in stand wordt gehouden,

      k. bestuur: bevoegd gezag in de zin van een onderwijswet, met dien verstande dat waar het de
      [Leerplichtwet 1969][ref27] of de [Leerplichtwet BES][ref28] betreft hieronder wordt verstaan het
      hoofd van de school of instelling, en met dien verstande dat waar het het toezicht op de uitoefening
      van de taken van het samenwerkingsverband betreft hieronder wordt verstaan het bestuur van de
      rechtspersoon, bedoeld in [artikel 18a, vierde lid, van de Wet op het primair onderwijs][ref29] en
      [artikel 17a, vierde lid, van de Wet op het voortgezet onderwijs][ref30],

      l. onderwijsdeelnemer: leerling, deelnemer, student of extraneus in de zin van een onderwijswet,

      m. ouders: met het gezag over het kind belaste ouders, hun geregistreerde partners, voogden en verzorgers,

      n. jaarwerkplan: document waarin de inspectie haar werkzaamheden voor het komende jaar neerlegt,

      o. persoonsgebonden nummer: burgerservicenummer, bedoeld in
      [artikel 1, onderdeel b, van de Wet algemene bepalingen burgerservicenummer][ref31] of, bij ontbreken daarvan, door
      Onze Minister uitgegeven onderwijsnummer.


