  - number: 24r
    text: |-
      Diplomagegevens worden tot 60 jaar na de maand van afgifte van het laatst behaalde waardedocument of, indien dat
      eerder is, tot het overlijden van betrokkene bewaard in het diplomaregister in een vorm die het mogelijk maakt
      betrokkene te identificeren.
    url: https://wetten.overheid.nl/BWBR0013800/2015-03-04#Artikel24r
  - number: 24s
    text: |-
      1 Onze Minister stelt bij ministeriële regeling regels omtrent de autorisatie van degenen die onder zijn gezag
      vallen voor verwerking van persoonsgegevens uit het diplomaregister.

      2 Onze Minister benoemt een functionaris voor de gegevensbescherming als bedoeld in
      [artikel 62 van de Wet bescherming persoonsgegevens][ref1] die in elk geval is belast met het toezicht op de
      verwerking van persoonsgegevens in het diplomaregister.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel62
    url: https://wetten.overheid.nl/BWBR0013800/2015-03-04#Artikel24s
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '62'
  - number: 24t
    text: |-
      1 Onze Minister houdt gedurende twintig jaren volgend op de verstrekking van gegevens uit het diplomaregister
      met uitzondering van de verstrekking op grond van [artikel 24q, eerste lid of zesde lid, tweede volzin][ref1],
      aantekening van de verstrekking, tenzij de verstrekking van gegevens in de genoemde periode anderszins is te
      herleiden uit het diplomaregister.

      2 Onze Minister deelt aan de betrokkene mede of hem betreffende gegevens gedurende twintig jaren voorafgaande aan
      het verzoek uit het diplomaregister zijn verstrekt aan een overheidsorgaan, een onderwijsinstelling of een andere
      derde. Onze Minister kan volstaan met een in algemene termen gestelde mededeling omtrent de verstrekkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel24q
    url: https://wetten.overheid.nl/BWBR0013800/2015-03-04#Artikel24t
