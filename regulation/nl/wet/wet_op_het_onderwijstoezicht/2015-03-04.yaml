  - number: 24p
    text: |-
      1 Indien een of meer van de gegevens in het diplomaregister afwijken van de gegevens in het originele
      waardedocument, kan de betrokkene Onze Minister elektronisch verzoeken eerstgenoemde gegevens te verbeteren.
      Onze Minister verzoekt de organisatie die het document heeft uitgereikt om hem elektronisch de juiste gegevens te
      verstrekken. Indien de organisatie constateert dat een of meer gegevens van de betrokkene in het diplomaregister
      niet overeenkomen met de gegevens waarover zij beschikt, verzoekt zij Onze Minister om deze gegevens te verbeteren.

      2 Indien de organisatie die het document heeft uitgereikt, constateert dat de gegevens van de betrokkene in het
      diplomaregister overeenkomen met de gegevens waarover zij beschikt of indien zij niet meer over de diplomagegevens
      van betrokkene beschikt, deelt zij dit elektronisch mee aan Onze Minister en deelt Onze Minister dit elektronisch
      mee aan de betrokkene. Indien de organisatie niet meer over de diplomagegevens van de betrokkene beschikt, kan
      de betrokkene op vertoon van het originele waardedocument aan Onze Minister verzoeken om de gegevens in het
      diplomaregister te verbeteren.

      3 Het eerste en tweede lid zijn niet van toepassing op de gegevens, bedoeld in
      [artikel 24o, eerste lid, onder a][ref1], die zijn overgenomen uit de basisregistratie personen.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel24o
