    text: |-
      Onze Minister zendt binnen vijf jaar na inwerkingtreding van [paragraaf 4 van hoofdstuk 6a][ref1] van deze wet aan
      de Staten-Generaal een verslag over de realisatie van de volgende doelstellingen van het register vrijstellingen en
      vervangende leerplicht:

      a. verbetering van de handhaving van de [Leerplichtwet 1969][ref2] door de leerplichtambtenaar;

      b. verbetering van de registratie van het aantal voortijdig schoolverlaters;

      c. uniformering van de registratie van de vrijstellingen en vervangende leerplicht.


