  - number: 24b
    text: |-
      1 Er is een basisregister onderwijs, dat ten doel heeft:

      a. Onze Minister gegevens te verstrekken ten behoeve van de bekostiging van scholen en instellingen, de begrotings-
      en beleidsvoorbereiding, de planning en bekostiging van de instellingen voor hoger onderwijs en ten behoeve van de
      uitvoering van zijn overige wettelijke taken;

      b. de inspectie gegevens te verstrekken ten behoeve van het toezicht op het onderwijs;

      c. het Centraal bureau voor de statistiek gegevens te verstrekken teneinde het Centraal bureau voor de statistiek
      in staat te stellen:

      1°. Onze Minister gegevens te verstrekken ten behoeve van de beleidsvoorbereiding;

      2°. de gemeenten gegevens te verstrekken ten behoeve van de toekenning van uitkeringen, bedoeld in
      [artikel 2 van de Wet participatiebudget][ref1], aan instellingen, en ten behoeve van de begrotings- en
      beleidsvoorbereiding inzake de gemeentelijke taken op het gebied van het onderwijs;

      d. de instellingen, bedoeld in [artikel 1.1.1, onderdeel b, van de Wet educatie en beroepsonderwijs][ref2]
      gegevens te verstrekken die noodzakelijk zijn om te beoordelen of personen die als deelnemer zijn of wensen
      te worden ingeschreven voor een opleiding voldoen aan de eisen die daarvoor zijn gesteld bij of krachtens
      [artikel 8.2.1][ref3] of [8.2.2 van die wet][ref4];

      e. de instellingen, bedoeld in
      [artikel 1.2, onderdelen a en b, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref5]
      gegevens te verstrekken die nodig zijn om te beoordelen of personen die als student of extraneus zijn of
      wensen te worden ingeschreven voor een opleiding voldoen aan de eisen die daarvoor zijn gesteld bij of
      krachtens [artikel 7.24, eerste en tweede lid][ref6], [7.25, eerste tot en met derde lid][ref7], [7.25a][ref8],
      [7.28, eerste lid][ref9], [7.30, eerste lid][ref10], of [7.30a, eerste lid, van die wet][ref11]; en

      f. het meldingsregister relatief verzuim te voorzien van de gegevens die noodzakelijk zijn in het kader van het
      doel van dat register.

      2 Het beheer van het basisregister onderwijs berust bij Onze Minister.

      3 Met betrekking tot de verwerking van persoonsgegevens, bedoeld in deze paragraaf, is Onze Minister de
      verantwoordelijke, bedoeld in [artikel 1, onderdeel d, van de Wet bescherming persoonsgegevens][ref12].


