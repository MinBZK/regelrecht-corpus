    text: |-
      1 De inspectie legt haar werkwijze voor een onderzoek als bedoeld in de [artikelen 11][ref1] en [12a][ref2] en voor
      de toepassing van [artikelen 11a][ref3] en [11b][ref4], vast in een of meer toezichtskaders. De toezichtskaders
      behoeven de goedkeuring van Onze Minister.

      2 Alvorens een toezichtskader vast te stellen of te wijzigen voert de inspectie overleg met vertegenwoordigers van
      het onderwijsveld en andere betrokkenen, terwijl bij onderwerpen betrekking hebbend op de vrijheid van inrichting
      in ieder geval overleg wordt gevoerd met de erkende richtingen.

      3 Een toezichtskader wordt bekendgemaakt in de Staatscourant.


