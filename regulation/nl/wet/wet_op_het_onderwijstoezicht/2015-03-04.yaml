      1 Onze Minister stelt bij ministeriële regeling regels omtrent de autorisatie van degenen die onder zijn gezag
      vallen voor verwerking van gegevens uit het meldingsregister relatief verzuim.

      2 De functionaris voor de gegevensbescherming, bedoeld in [artikel 24g, tweede lid][ref1], is tevens belast met het
      toezicht op de verwerking van persoonsgegevens in het meldingsregister relatief verzuim.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel24g
    url: https://wetten.overheid.nl/BWBR0013800/2015-03-04#Artikel24j
