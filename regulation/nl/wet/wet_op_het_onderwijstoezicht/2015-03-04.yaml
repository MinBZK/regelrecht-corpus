        paragraaf: '2'
  - number: 24k
    text: |-
      1 Uit het meldingsregister relatief verzuim kunnen persoonsgegevens worden verstrekt aan de betrokkene en diens
      wettelijke vertegenwoordiger.

      2 Uit het meldingsregister relatief verzuim worden aan Onze Minister gegevens verstrekt ten behoeve van de
      beleidsvorming ten aanzien van de taken, bedoeld in [artikel 24h, eerste lid][ref1].

      3 De gegevens, bedoeld in het tweede lid, worden op een zodanige wijze verstrekt, dat degenen van de leerlingen of
      deelnemers, bedoeld in [artikel 24i][ref2], op wie zij betrekking hebben, niet geïdentificeerd of identificeerbaar
      zijn.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van het tweede en derde lid.

      5 Uit het meldingsregister relatief verzuim worden kosteloos gegevens verstrekt aan burgemeester
      en wethouders, het hoofd, bedoeld in [artikel 21a van de Leerplichtwet 1969][ref3], en het
      bevoegd gezag, bedoeld in [artikel 8.1.8a van de Wet educatie en beroepsonderwijs][ref4],
      [artikel 47b van de Wet op de expertisecentra][ref5] en [artikel 28a van de Wet op het voortgezet onderwijs][ref6],
      voor zover dat bij wet is vereist of toegestaan.

      6 Onze Minister verstrekt uit het meldingsregister relatief verzuim geen persoonsgebonden nummers ter uitvoering
      van [artikel 107, tweede lid, van de Vreemdelingenwet 2000][ref7], tenzij deze gegevens noodzakelijk zijn voor
      nakoming van verplichtingen als referent in de zin van [die wet][ref8] dan wel voor het toezicht op de naleving van
      de wettelijke voorschriften met betrekking tot referenten in de zin van die wet.


