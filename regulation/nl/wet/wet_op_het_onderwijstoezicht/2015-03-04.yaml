  - number: 15c
    text: |-
      1 [Artikel 11][ref1] is van overeenkomstige toepassing, met dien verstande dat de inspectie het onderzoek tevens
      verricht aan de hand van aspecten van kwaliteit, te weten:

      a. de wijze waarop invulling is gegeven aan het ondersteuningsplan,
      bedoeld in [artikel 18a van de Wet op het primair onderwijs][ref2] en
      [artikel 17a van de Wet op het voortgezet onderwijs][ref3], en de wijze waarop het wordt uitgevoerd;

      b. het aantal leerplichtige jongeren wonend in het gebied van het samenwerkingsverband dat niet is ingeschreven bij
      een school als bedoeld in de [Leerplichtwet 1969][ref4], en

      c. het aantal leerplichtige leerlingen van scholen in het samenwerkingsverband dat het onderwijs aan de school
      waaraan hij is ingeschreven gedurende een aaneengesloten periode van ten minste vier weken zonder geldige reden
      niet meer volgt.

      2 De [artikelen 12][ref5], [13][ref6], [14][ref7] en [15][ref8] zijn van overeenkomstige toepassing.


