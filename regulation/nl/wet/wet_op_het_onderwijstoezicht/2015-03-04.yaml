  - number: 24o
    text: |-
      1 Het diplomaregister bevat voor alle daarin opgenomen waardedocumenten gegevens over:

      a. het persoonsgebonden nummer, de geslachtsnaam, de voornamen, het geslacht en de geboortedatum van betrokkene
      zoals opgenomen in de basisregistratie personen of, bij het ontbreken daarvan, zoals opgegeven door de organisatie
      die het waardedocument heeft uitgereikt;

      b. het soort waardedocument alsmede de naam van de organisatie die dit heeft uitgereikt.

      2 Het diplomaregister bevat voorts gegevens over:

      a. in geval van een getuigschrift van een opleiding of programma, opgenomen in het Centraal register opleidingen
      hoger onderwijs, bedoeld in [artikel 6.13 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1]:
      de desbetreffende opleiding en het jaar, de maand en de aard van het examen;

      b. in geval van een diploma of cijferlijst van een opleiding, opgenomen in het Centraal register
      beroepsopleidingen, bedoeld in [artikel 6.4.1 van de Wet educatie en beroepsonderwijs][ref2]: de kwalificatie en de
      gegevens, bedoeld in [artikel 2.5.5a, tweede lid, onder h, van die wet][ref3];

      c. in geval van een diploma, cijferlijst of certificaat van een opleiding als bedoeld in
      [artikel 7.3.1, eerste lid, onder a, van de Wet educatie en beroepsonderwijs][ref4], afgegeven
      door een instelling als bedoeld in [artikel 1.3.1 van die wet][ref5]: de gegevens, bedoeld in
      [artikel 2.3.6a, tweede lid, onder f en g, van die wet][ref6];

      d. in geval van een diploma voor een staatsexamen als bedoeld in
      [artikel 60, tweede lid, van de Wet op het voortgezet onderwijs][ref7], afgegeven door het College voor examens:
      het behaalde diploma, het programma en de datum waarop het diploma is behaald;

      e. in geval van een diploma voor het inburgeringsexamen, bedoeld in
      [artikel 13, eerste lid, van de Wet inburgering][ref8]: het behaalde diploma, het niveau, het profiel en de datum
      waarop het diploma is behaald.

      f. in geval van een diploma of cijferlijst van onderwijs als bedoeld in
      [artikel 2 van de Wet op het voortgezet onderwijs][ref9], afgegeven door een school
      als bedoeld in [artikel 64, eerste lid, van die wet][ref10]: de gegevens, bedoeld in
      [artikel 103b, tweede lid, onder c, d, f en g, van die wet][ref11];

      g. in geval van een diploma, cijferlijst of certificaat voor een staatsexamen als bedoeld in
      [artikel 60, eerste lid, van de Wet op het voortgezet onderwijs][ref12], afgegeven door het College voor
      examens: de vakken waarin examen is afgelegd, de cijfers van het college-examen, het vak of de vakken waarop het
      profielwerkstuk betrekking heeft, de beoordeling van het sectorwerkstuk, alsmede het thema van het sectorwerkstuk,
      de cijfers van het centraal examen, de eindcijfers en de uitslag van het staatsexamen;

      h. in geval van een diploma of cijferlijst van onderwijs als bedoeld in
      [artikel 14a, eerste lid, onderdeel b][ref13], en [artikel 14b van de Wet op de expertisecentra][ref14],
      afgegeven door een school voor voortgezet speciaal onderwijs: de gegevens, bedoeld in
      [artikel 164a, tweede lid, onder c, k, l en m, van die wet][ref15].


