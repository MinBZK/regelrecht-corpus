  - number: '4'
    text: |-
      1 De inspectie oefent het toezicht uit met inachtneming van de vrijheid van onderwijs.

      2 De inspectie oefent het toezicht uit op zodanige wijze dat instellingen niet meer worden belast dan voor een
      zorgvuldige uitoefening van het toezicht noodzakelijk is.

      3 De intensiteit van het toezicht in het onderwijs is afhankelijk van de kwaliteit van het onderwijs, van de
      wijze waarop de professionaliteit van de instelling en het bestuur is gewaarborgd, van de mate van naleving van
      wettelijke voorschriften en, voor zover deze wordt bekostigd uit ’s Rijks kas, van de financiële situatie van de
      instelling.

      4 De uitoefening van het toezicht is er mede op gericht betrokkenen te informeren over de ontwikkeling, in het
      bijzonder van de kwaliteit, van het onderwijs.
    url: https://wetten.overheid.nl/BWBR0013800/2015-03-04#Artikel4
  - number: '5'
    text: |-
      Bij de uitoefening van het toezicht op opleidingen, gericht op een beroep waarvoor bij of krachtens de wet
      vereisten zijn gesteld op het gebied van kennis, inzicht, vaardigheden en in voorkomende gevallen beroepshoudingen,
      waarover degene die de opleiding voltooit, met het oog op het beroepsmatig functioneren dient te beschikken, pleegt
      de inspectie overleg met door Onze Minister wie het aangaat, aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0013800/2015-03-04#Artikel5
  - number: '6'
    text: |-
      1 Bij de inspectie zijn vertrouwensinspecteurs werkzaam voor:

      a. onderwijsdeelnemers die het slachtoffer zijn van seksueel misbruik, seksuele intimidatie, fysiek geweld,
      psychisch geweld, discriminatie of radicalisering, gepleegd door een ten behoeve van de instelling met taken belast
      persoon of een onderwijsdeelnemer van de instelling,

      b. ten behoeve van een instelling met taken belaste personen die het slachtoffer zijn van seksueel misbruik,
      seksuele intimidatie, fysiek geweld, psychisch geweld, discriminatie of radicalisering, gepleegd door een ten
      behoeve van de instelling met taken belast persoon of een onderwijsdeelnemer van de instelling, en

      c. onderwijsdeelnemers, ten behoeve van een instelling met taken belaste personen, besturen, ouders, op
      instellingen ingestelde klachtencommissies en op instellingen aangestelde vertrouwenspersonen, die geconfronteerd
      worden met een geval van seksueel misbruik, seksuele intimidatie, fysiek geweld, psychisch geweld, discriminatie of
      radicalisering als bedoeld onder a of b.

      2 Naast zijn taken, voortvloeiend uit [artikel 3][ref1], heeft de vertrouwensinspecteur ten behoeve van de in het
      eerste lid genoemde personen en organen de volgende taken:

      a. het fungeren als aanspreekpunt,

      b. het adviseren over eventueel te nemen stappen,

      c. het bijstaan bij het nemen van stappen gericht op het zoeken naar een oplossing, en

      d. het desgevraagd begeleiden bij het indienen van een klacht of het doen van aangifte.

      3 De vertrouwensinspecteur is, voorzover het betreft misdrijven als bedoeld in
      [titel XIV van het Wetboek van Strafrecht][ref2] of [titel XIV van het Wetboek van Strafrecht BES][ref3]
      jegens een onderwijsdeelnemer of een ten behoeve van een instelling met taken belast persoon, vrijgesteld
      van de verplichting tot het doen van aangifte als bedoeld in de [artikelen 160, eerste lid][ref4], en
      [162, eerste lid, van het Wetboek van Strafvordering][ref5] of de [artikelen 198, eerste lid][ref6], en
      [200, eerste lid, van het Wetboek van Strafvordering BES][ref7].

      4 De vertrouwensinspecteur is voorzover het betreft een geval van seksueel misbruik of seksuele intimidatie als
      bedoeld in het eerste lid, onder a of b, verplicht tot geheimhouding van hetgeen hem in de uitoefening van zijn
      functie is toevertrouwd door een onderwijsdeelnemer, de ouders van een onderwijsdeelnemer of een ten behoeve van
      een instelling met taken belast persoon.

      5 De vertrouwensinspecteur is bevoegd zonder toestemming van degene die het betreft bijzondere gegevens als bedoeld
      in [artikel 16 van de Wet bescherming persoonsgegevens][ref8] te verwerken met betrekking tot de personen, bedoeld
      in het eerste lid, indien uit een melding redelijkerwijs een vermoeden van seksueel misbruik, seksuele intimidatie,
      psychisch geweld, fysiek geweld, discriminatie of radicalisering kan worden afgeleid.

      6 De vertrouwensinspecteur verstrekt de door hem verzamelde gegevens niet aan derden. In het verslag over de staat
      van het onderwijs, bedoeld in [artikel 8, tweede lid][ref9], worden slechts geabstraheerde gegevens opgenomen.

      7 In afwijking van het zesde lid is de vertrouwensinspecteur bevoegd rechtstreeks onder de verantwoordelijkheid van
      Onze Minister van Veiligheid en Justitie vallende instanties in kennis te stellen van een geval of vermoeden van
      een geval van psychisch geweld, fysiek geweld, discriminatie of radicalisering:

      a. in het belang van de onderwijsdeelnemers,

      b. in het belang van ten behoeve van een instelling met taken belaste personen, of

      c. indien de ernst van de situatie waarop de melding betrekking heeft daartoe aanleiding geeft.


