    text: |-
      In dit hoofdstuk wordt verstaan onder:

        - *diplomaregister:* diplomaregister, bedoeld in [artikel 24m][ref1];
        - *diplomagegevens:* gegevens, bedoeld in [artikel 24o][ref2];
        - *betrokkene:* degene op wie een diplomagegeven betrekking heeft;
        - *derde:* derde als bedoeld in [artikel 1, onderdeel g, van de Wet bescherming persoonsgegevens][ref3];
        - *waardedocument:* een getuigschrift, diploma, cijferlijst of certificaat als bedoeld in [artikel 24n][ref4];
        - *College voor examens:* College voor examens, genoemd in [artikel 2 van de Wet College voor examens][ref5], of
      één van diens rechtsvoorgangers, genoemd in [artikel 12 van die wet][ref6], op het gebied van staatsexamens;
        - *afsluitend examen:* 1° het examen, bedoeld in
      [artikel 7.10a van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref7] en het examen van een
      opleiding van de Open Universiteit, voor zover dit examen door [die wet][ref8] daarmee gelijk wordt gesteld, 2° het
      examen, bedoeld in [artikel 7.10b van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref9].


