  - number: '2'
    text: |-
      1 Er is een Inspectie van het onderwijs, die onder Onze Minister van Onderwijs, Cultuur en Wetenschap ressorteert.
      Aan het hoofd van de inspectie staat de inspecteur-generaal.

      2 Onze Minister geeft met betrekking tot de uitoefening van de in deze wet aan de inspectie toegekende bevoegdheden
      uitsluitend in schriftelijke vorm zijn aanwijzingen, onder mededeling daarvan aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0013800/2015-03-04#Artikel2
  - number: '3'
    text: |-
      1 Het toezicht op het onderwijs is opgedragen aan de inspectie.

      2 Het toezicht omvat de volgende taken:

      a. het beoordelen en bevorderen van de kwaliteit van het onderwijs, daaronder begrepen de kwaliteit
      van het onderwijspersoneel, aan instellingen als bedoeld in de onderwijswetten met uitzondering van de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], het beoordelen en bevorderen van de kwaliteit van
      de uitoefening van de taken van de samenwerkingsverbanden en de kenniscentra beroepsonderwijs bedrijfsleven, en het
      beoordelen van de kwaliteitsvoorwaarden van de voorschoolse educatie op peuterspeelzalen en kindercentra, bedoeld
      in de [Wet kinderopvang en kwaliteitseisen peuterspeelzalen][ref2],

      b. het beoordelen en bevorderen van de naleving van de bij of krachtens een onderwijswet gegeven voorschriften,

      c. het beoordelen en bevorderen van de kwaliteit van het stelsel voor
      hoger onderwijs, met inbegrip van het stelsel van accreditatie, bedoeld in
      [artikel 1.1, onderdelen q, r en s, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref3]
      en het onderzoeken van de kwaliteit van het onderwijs aan een instelling voor hoger
      onderwijs anders dan ten behoeve van de accreditatie in het hoger onderwijs, bedoeld in
      [hoofdstuk 5a van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref4],

      d. het beoordelen en bevorderen van de financiële rechtmatigheid door in ieder geval het verrichten van onderzoek
      naar de rechtmatige verkrijging van de bekostiging, naar de controlerapporten van de door het bestuur aangewezen
      accountant, naar de rechtmatigheid van de bestedingen en naar de rechtmatigheid van het financieel beheer van de
      bekostigde instellingen,

      e. het beoordelen en bevorderen van de rechtmatigheid en de doeltreffendheid van de uitoefening van de taken,
      opgedragen aan het college van burgemeester en wethouders bij of krachtens [hoofdstuk 1, afdelingen 3][ref5] en
      [6 van de Wet kinderopvang en kwaliteitseisen peuterspeelzalen][ref6], met uitzondering van de bij of krachtens
      [artikel 1.50b][ref7] vastgestelde bepalingen omtrent de kwaliteit van voorschoolse educatie,

      f. het rapporteren over de ontwikkeling van het onderwijs en over de uitoefening van de taken door de instellingen,
      de samenwerkingsverbanden en de kenniscentra beroepsonderwijs bedrijfsleven, in het bijzonder over de kwaliteit
      daarvan, en

      g. het verrichten van andere bij of krachtens de wet aan de inspectie opgedragen taken.

      3 Onze Minister kan de inspectie mandaat verlenen om:

      a. de bekostiging voor ten hoogste vijftien procent in te houden of geheel of gedeeltelijk
      op te schorten, op grond van [artikel 164 van de Wet op het primair onderwijs][ref8],
      [artikel 146 van de Wet op de expertisecentra][ref9], [artikel 104 van de Wet op het voortgezet onderwijs][ref10],
      [artikel 11.1 van de Wet educatie en beroepsonderwijs][ref11] of
      [artikel 15.1 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref12];

      b. een subsidie lager vast te stellen, te wijzigen, of gedeeltelijk in te trekken of terug te vorderen op grond van
      de [afdelingen 4.2.5 tot en met 4.2.7 van de Algemene wet bestuursrecht][ref13];

      c. bij of krachtens de [Wet op het primair onderwijs][ref14], de [Wet op de expertisecentra][ref15],
      de [Wet op het voortgezet onderwijs][ref16], de [Wet educatie en beroepsonderwijs][ref17] of de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref18] correcties aan te brengen of bedragen in
      mindering te brengen op de bekostiging;

      d. voor zover het niet de enige opleiding in zijn soort betreft, een waarschuwing als
      bedoeld in de [artikelen 6.1.5][ref19], [6.1.5b][ref20], [6.2.3][ref21], [6.2.3b][ref22] en
      [6.3.2 van de Wet educatie en beroepsonderwijs][ref23] te geven, of een besluit als bedoeld in de
      [artikelen 6.1.4][ref24], 6.1.5b, [6.2.2][ref25], 6.2.3b en 6.3.2 van die wet te nemen;

      e. de bestuurlijke boete op te leggen, bedoeld in [artikel 27 van de Leerplichtwet 1969][ref26]; of

      f. te beslissen op een tegen een besluit als bedoeld in de onderdelen a tot en met e ingediend bezwaarschrift.


