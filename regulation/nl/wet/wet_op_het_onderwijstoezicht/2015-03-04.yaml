  - number: 24n
    text: |-
      Behoudens [artikel 24r][ref1] omvat het diplomaregister gegevens over:

      a. getuigschriften van met goed gevolg afgelegde propedeutische examens van uit ’s Rijks kas bekostigde
      opleidingen hoger beroepsonderwijs en met goed gevolg afgelegde afsluitende examens van uit ’s
      Rijks kas bekostigde opleidingen hoger onderwijs, met uitzondering van de programma’s, bedoeld in
      [artikel 7.8a, eerste lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2], die op of na 1
      januari 1996 zijn afgegeven door instellingen als bedoeld in de onderdelen a, b, c en g van de [bijlage van de Wet
      op het hoger onderwijs en wetenschappelijk onderzoek](onbekend);

      b. diploma’s en cijferlijsten van uit ’s Rijks kas bekostigde beroepsopleidingen die op of na 1 januari 2007 zijn
      afgegeven door instellingen als bedoeld in [artikel 1.1.1, onder b, van de Wet educatie en beroepsonderwijs][ref3];

      c. diploma’s, cijferlijsten en certificaten van opleidingen als bedoeld in
      [artikel 7.3.1, eerste lid, onder a, van de Wet educatie en beroepsonderwijs][ref4] die op of na 1 januari 2007
      zijn afgegeven door instellingen als bedoeld in [artikel 1.3.1, derde lid, van die wet][ref5];

      d. diploma’s van staatsexamens als bedoeld in [artikel 60, tweede lid, van de Wet op het voortgezet onderwijs][ref6]
      die op of na 1 januari 2011 zijn afgegeven door het College voor examens;

      e. diploma’s voor het inburgeringsexamen, bedoeld in artikel 13, eerste lid, van de Wet inburgering die op of na 1
      januari 2007 zijn afgegeven;

      f. diploma’s en cijferlijsten van onderwijs als bedoeld in [artikel 2 van de Wet op het voortgezet onderwijs][ref7]
      die op of na 1 januari 2006 zijn afgegeven door scholen als bedoeld in [artikel 64, eerste lid, van die wet][ref8]
      aan leerlingen die aan de desbetreffende school zijn ingeschreven;

      g. diploma’s en cijferlijsten van onderwijs als bedoeld in [artikel 2 van de Wet op het voortgezet onderwijs][ref9]
      die op of na een bij koninklijk besluit te bepalen datum zijn afgegeven door scholen als bedoeld in
      [artikel 64, eerste lid, van die wet][ref10] aan leerlingen die zijn ingeschreven aan een school of afdeling voor
      voortgezet speciaal onderwijs;

      h. diploma’s, cijferlijsten en certificaten van staatsexamens als bedoeld in
      [artikel 60, eerste lid, van de Wet op het voortgezet onderwijs][ref11] die op of na 1 januari 2011 zijn afgegeven
      door het College voor examens;

      i. getuigschriften van met goed gevolg afgelegde afsluitende examens van de uit ’s Rijks kas bekostigde programma’s,
      bedoeld in [artikel 7.8a, eerste lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref12] die
      op of na 1 januari 2007 zijn afgegeven door instellingen als bedoeld in de onderdelen a, b, c en g, van de [bijlage
      van de Wet op het hoger onderwijs en wetenschappelijk onderzoek](onbekend);

      j. getuigschriften van met goed gevolg afgelegde afsluitende examens van uit ’s Rijks kas bekostigde opleidingen
      hoger onderwijs die op of na een bij koninklijk besluit te bepalen tijdstip zijn afgegeven door de instelling,
      bedoeld in onderdeel h van de [bijlage van de Wet op het hoger onderwijs en wetenschappelijk onderzoek](onbekend);

      k. getuigschriften van met goed gevolg afgelegde afsluitende examens van uit ’s Rijks kas bekostigde opleidingen
      hoger onderwijs die op of na een bij koninklijk besluit te bepalen tijdstip zijn afgegeven door instellingen als
      bedoeld in onderdeel i van de [bijlage van de Wet op het hoger onderwijs en wetenschappelijk onderzoek](onbekend);

      l. diploma’s en cijferlijsten van onderwijs als bedoeld in [artikel 14a, eerste lid, onderdeel b][ref13], en
      [artikel 14b van de Wet op de expertisecentra][ref14] die zijn afgegeven door scholen voor voortgezet speciaal
      onderwijs.


