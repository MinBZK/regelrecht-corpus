    text: |-
      1 Uit het register vrijstellingen en vervangende leerplicht kunnen persoonsgegevens worden verstrekt aan de
      betrokkene en diens wettelijke vertegenwoordiger.

      2 Uit het register vrijstellingen en vervangende leerplicht worden aan Onze Minister de persoonsgebonden nummers
      verstrekt van jongeren die op grond van [artikel 5][ref1], [5a][ref2] en [15 van de Leerplichtwet 1969][ref3] zijn
      vrijgesteld van de leerplicht.

      3 Uit het register vrijstellingen en vervangende leerplicht wordt jaarlijks op 1 oktober aan Onze Minister een
      opsomming verstrekt van het landelijk en per woongemeente aantal:

      a. jongeren die eerder een beroep op vrijstelling hebben gedaan;

      b. overige vrijgestelde jongeren;

      c. jongeren waarbij eerder vervangende leerplicht is toegestaan; en

      d. overige jongeren met een vervangende leerplicht.

      4 Onze Minister gebruikt de persoonsgebonden nummers, bedoeld in het tweede lid, ten behoeve van:

      a. de bijstelling van het aantal voortijdig schoolverlaters zoals blijkt uit het basisregister onderwijs;

      b. de controle of de jongere blijkens het basisregister onderwijs staat ingeschreven bij een school of instelling.

      5 Indien uit het basisregister onderwijs aan Onze Minister op grond van het vierde lid, onder b, is gebleken dat
      een jongere die op grond van [artikel 5][ref4], [5a][ref5] of [15 van de Leerplichtwet 1969][ref6] is vrijgesteld
      van de leerplicht staat ingeschreven bij een school of instelling, meldt Onze Minister aan het bevoegd gezag van de
      betreffende school of instelling dat de jongere is vrijgesteld.

      6 Uit het register vrijstellingen en vervangende leerplicht worden kosteloos gegevens verstrekt aan burgemeester
      en wethouders.

      7 Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van het eerste lid.


