  - number: 12a
    text: |-
      1 Ter uitvoering van de in [artikel 3, tweede lid, onderdelen b en d][ref1], bedoelde taken onderzoekt de inspectie
      met inachtneming van [artikel 4][ref2] de naleving van de wettelijke voorschriften en de financiële rechtmatigheid
      bij instellingen voor hoger onderwijs.

      2 Ter uitvoering van de in [artikel 3, tweede lid, onderdelen b, c en d][ref3], bedoelde taken onderzoekt de
      inspectie ontwikkelingen in het stelsel van hoger onderwijs.

      3 Ter uitvoering van de in [artikel 3, tweede lid, onderdelen b, c en d][ref4], bedoelde taken kan de inspectie
      naar aanleiding van signalen van buitenaf die mogelijk kunnen leiden tot gevolgen op stelselniveau in incidentele
      gevallen onderzoek verrichten op aanwijzing van de Minister dan wel uit eigen beweging onder door Onze Minister te
      stellen voorwaarden.

      4 [Artikel 11, vierde tot en met zesde lid][ref5], is van overeenkomstige toepassing. De [artikelen 20][ref6] en
      [21][ref7] zijn van overeenkomstige toepassing, tenzij de aard of omvang van het onderzoek zich tegen openbare
      rapportage verzet.


