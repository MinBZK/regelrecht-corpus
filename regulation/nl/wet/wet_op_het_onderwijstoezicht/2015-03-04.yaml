  - number: 24q
    text: |-
      1 Uit het diplomaregister worden desgevraagd diplomagegevens verstrekt aan betrokkene.

      2 Uit het diplomaregister worden desgevraagd diplomagegevens verstrekt aan een instelling of school als bedoeld in
      [artikel 24n][ref1] of aan een school of afdeling voor voortgezet speciaal onderwijs als bedoeld in de Wet op de
      expertisecentra, indien betrokkene is ingeschreven of was ingeschreven bij die instelling, school of afdeling. Op
      grond van de eerste volzin kunnen uitsluitend diplomagegevens worden verstrekt die zijn behaald voor onderwijs van
      die instelling, school of afdeling.

      3 Uit het diplomaregister worden desgevraagd diplomagegevens verstrekt aan een instelling of school als bedoeld
      in [artikel 24n][ref2] of aan het College voor examens indien betrokkene een waardedocument heeft behaald bij die
      instelling, die school of dat college. Op grond van de eerste volzin kunnen uitsluitend diplomagegevens worden
      verstrekt van waardedocumenten die zijn afgegeven door die instelling, die school of dat college.

      4 Uit het diplomaregister worden desgevraagd diplomagegevens verstrekt aan een instelling of school als bedoeld
      in [artikel 24n][ref3] of aan het College voor examens ten behoeve van de aanmelding, inschrijving of examinering
      van betrokkene.

      5 Op grond van het vierde lid kunnen uitsluitend diplomagegevens worden verstrekt van:

      a. de waardedocumenten, bedoeld in [artikel 24n, onder a tot en met d en f tot en met l][ref4], indien het betreft
      een instelling als bedoeld in artikel 24n, onder a, i, j of k,

      b. de waardedocumenten, bedoeld in [artikel 24n, onder b, c, f, g, h en l][ref5], indien het betreft een instelling
      als bedoeld in artikel 24n, eerste lid, onder b,

      c. de waardedocumenten, bedoeld in [artikel 24n, onder c, f, g, h en l][ref6], indien het betreft een school,
      instelling of afdeling als bedoeld in artikel 24n, eerste lid, onder c, f, g of l,

      d. de waardedocumenten, bedoeld in [artikel 24n, onder c, d, f, g, h en l][ref7], indien het betreft het College
      voor examens.

      6 Uit het diplomaregister worden desgevraagd diplomagegevens verstrekt aan Onze Minister en de inspectie voor
      zover dat noodzakelijk is voor de uitoefening van hun wettelijke taken. Voor zover het betreft het gebruik
      door Onze Minister voor de begrotings- en beleidsvoorbereiding, worden de diplomagegevens op een zodanige
      wijze verstrekt, dat degenen op wie zij betrekking hebben niet geïdentificeerd of identificeerbaar zijn.
      [Artikel 24f, zevende en achtste lid][ref8], zijn van overeenkomstige toepassing.

      7 Uit het diplomaregister worden desgevraagd diplomagegevens verstrekt aan:

      a. Onze Minister van Volksgezondheid, Welzijn en Sport als beheerder van een register als bedoeld in
      [artikel 3 van de Wet op de beroepen in de individuele gezondheidszorg][ref9], ten behoeve van de beoordeling van
      een aanvraag om inschrijving in dat register;

      b. Onze Minister van Sociale Zaken en Werkgelegenheid als beheerder van het Informatiesysteem Inburgering, bedoeld
      in [artikel 47, eerste lid, van de Wet inburgering][ref10] ten behoeve van de beoordeling van de aanwezigheid van
      een vrijstelling van de inburgeringsplicht;

      c. het Uitvoeringsinstituut werknemersverzekeringen, voor zover dat noodzakelijk is voor de uitvoering van de
      taken, bedoeld in [artikel 30, eerste lid][ref11], [30a, eerste en tweede lid][ref12], [30b][ref13], [30d][ref14]
      en [31 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref15].

      8 Uit het diplomaregister wordt desgevraagd aan betrokkene een elektronisch document met diplomagegevens verstrekt,
      dat is beveiligd tegen wijzigingen en waarvan kan worden vastgesteld dat het is afgegeven door Onze Minister.

      9 De verstrekking van gegevens uit het diplomaregister geschiedt elektronisch.

      10 In afwijking van het negende lid geschiedt de verstrekking van gegevens op grond van het eerste of achtste lid
      schriftelijk indien betrokkene hierom verzoekt.

      11 Voor de elektronische verstrekking van gegevens op grond van het eerste tot en met zesde lid is geen vergoeding
      verschuldigd. Onze Minister kan regels stellen over de vergoeding die verschuldigd is voor de elektronische
      verstrekking van gegevens op grond van het zevende en achtste lid en voor de schriftelijke verstrekking van
      gegevens op grond van het tiende lid.


