  - number: 24k3
    text: |-
      1 In het register vrijstellingen en vervangende leerplicht zijn de volgende gegevens opgenomen:

      a. de persoonsgebonden nummers van de jongeren voor wie op grond van [artikel 5][ref1] of
      [5a van de Leerplichtwet 1969][ref2] een beroep is gedaan op vrijstelling van inschrijving als leerling van een
      school respectievelijk een instelling, met daaraan toegevoegd de aanduiding «vrijgesteld», de begin- en einddatum
      van de vrijstelling, de woongemeente en of eerder een beroep op vrijstelling is gedaan;

      b. de persoonsgebonden nummers van de jongeren voor wie burgemeester en wethouders op
      grond van [artikel 15 van de Leerplichtwet 1969][ref3] vrijstelling verlenen van de in
      [artikel 4a van de Leerplichtwet][ref4] opgelegde verplichtingen, met daaraan toegevoegd de aanduiding
      «vrijgesteld», de begin- en einddatum van de vrijstelling, de woongemeente en of eerder een beroep op vrijstelling
      is gedaan;

      c. de persoonsgebonden nummers van de jongeren voor wie burgemeester en wethouders instemmen met het verzoek,
      bedoeld in [artikel 3a, eerste lid][ref5] of [3b, eerste lid][ref6], met daaraan toegevoegd de aanduiding
      «vervangende leerplicht», de begin- en einddatum van de vervangende leerplicht, de woongemeente en of eerder
      vervanging van de leerplicht is toegestaan.

      2 De gegevens, bedoeld in het eerste lid, worden tot één jaar na de datum waarop de vrijstelling of de vervangende
      leerplicht afloopt in het register vrijstellingen en vervangende leerplicht bewaard.


