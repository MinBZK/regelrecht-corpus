  - number: 24a
    text: |-
      In dit hoofdstuk wordt verstaan onder:

        - *basisregister onderwijs:* basisregister onderwijs als bedoeld in [artikel 24b][ref1];
        - *meldingsregister relatief verzuim:* meldingsregister relatief verzuim als bedoeld in [artikel 24h][ref2];
        - *startkwalificatie:* startkwalificatie als bedoeld in [artikel 1, onderdeel f, van de Leerplichtwet 1969][ref3];
        - register vrijstellingen en vervangende leerplicht: register vrijstellingen en vervangende leerplicht als bedoeld
      in [artikel 24k2][ref4].


