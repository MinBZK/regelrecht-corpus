  - number: '20'
    text: |-
      1 De inspectie legt haar oordeel naar aanleiding van een onderzoek als bedoeld in [artikel 11][ref1], dan wel
      [artikel 12a][ref2], vast in een inspectierapport.

      2 Indien de inspectie oordeelt dat een bij of krachtens een onderwijswet gegeven voorschrift niet is nageleefd,
      vermeldt zij dit in het rapport.

      3 Alvorens een rapport vast te stellen, stelt de inspectie het bestuur in de gelegenheid van het ontwerp-rapport
      kennis te nemen en daarover overleg te voeren.

      4 Indien in het overleg geen overeenstemming is bereikt over door het bestuur gewenste wijzigingen van het ontwerp-
      rapport, wordt de zienswijze van het bestuur in een bijlage bij het inspectierapport opgenomen.

      5 De inspectie zendt het inspectierapport na vaststelling daarvan onverwijld aan het bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel12a
