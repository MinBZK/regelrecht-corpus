  - number: 15f
    text: |-
      1 De inspectie houdt toezicht op de kwaliteit van het functioneren van het College voor toetsen en
      examens en op de naleving van de bij of krachtens de [Wet College voor toetsen en examens][ref1], de
      [Wet op het voortgezet onderwijs][ref2] en de [Wet voortgezet onderwijs BES][ref3] gegeven voorschriften.

      2 Ter uitvoering van de taak, bedoeld in het eerste lid, kan de inspectie Onze Minister onder meer voorstellen een
      voorziening te treffen als bedoeld in [artikel 23 van de Kaderwet zelfstandige bestuursorganen][ref4], indien:

      a. is gebleken dat de kwaliteit van het functioneren van het College voor toetsen en examens onvoldoende is
      geweest, of

      b. niet of niet meer wordt voldaan aan hetgeen bij of krachtens de [Wet College voor toetsen en examens][ref5]
      is bepaald.


