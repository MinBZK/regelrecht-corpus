---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: verordening_pdv_retributies_diervoeders_jaar_2006
regulatory_layer: WET
publication_date: '2007-05-25'
valid_from: '2007-01-01'
bwb_id: BWBR0019020
url: https://wetten.overheid.nl/BWBR0019020/2007-01-01
preamble:
  text: |-
    Gelet op de artikelen 95, 100 en 126, tweede lid, van de Wet op de bedrijfsorganisatie en op artikel 12 van het
    Instellingsbesluit Akkerbouwproductschappen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0019020/2007-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze verordening verstaat onder:







                  productschap


                  :


                  Productschap Diervoeder;




                  secretaris


                  :


                  secretaris van het productschap;




                  ondernemer


                  :


                  degene die een onderneming drijft waarvoor het productschap is ingesteld.
    url: https://wetten.overheid.nl/BWBR0019020/2007-01-01#Artikel1
  - number: '2'
    text: |-
      In het geval in een verordening van het bestuur wordt bepaald dat de ondernemer verplicht is aan het productschap
      een retributie te betalen voor, door of namens het productschap verrichte werkzaamheden is het bepaalde in of
      krachtens deze verordening van toepassing.
    url: https://wetten.overheid.nl/BWBR0019020/2007-01-01#Artikel2
  - number: '3.1'
    text: |-
      De ondernemer die het productschap verzoekt om afgifte van een free sale certificaat voor gemedicineerde voeders is
      hiervoor aan het productschap een retributie verschuldigd.
    url: https://wetten.overheid.nl/BWBR0019020/2007-01-01#Artikel3
  - number: '3.2'
    text: 'De retributie bedraagt: € 17,50 per certificaat.'
    url: https://wetten.overheid.nl/BWBR0019020/2007-01-01#Artikel3
  - number: '4.1'
    text: |-
      De deelnemende laboratoria zijn ten behoeve van de Kwaliteitsdienst Landbouwkundige Laboratoria aan het
      productschap jaarlijks een retributie verschuldigd.
    url: https://wetten.overheid.nl/BWBR0019020/2007-01-01#Artikel4
  - number: '4.2'
    text: |-
      De retributie bedraagt






                    Basistarief


                    € 482




                    Per analysepakket additioneel


                    € 780 of € 365
    url: https://wetten.overheid.nl/BWBR0019020/2007-01-01#Artikel4
  - number: '5'
    text: |-
      De certificatie-instelling is verplicht jaarlijks aan het productschap een retributie te betalen van:






                  € 1.000,-


                  basistarief




                  € 750,-


                  per GMP-standaard (incl. QC-standaard)




                  € 200,-


                  per auditor.
    url: https://wetten.overheid.nl/BWBR0019020/2007-01-01#Artikel5
  - number: '7.1'
    text: |-
      De certificatie-instelling is verplicht jaarlijks aan het productschap voor de volgens GMP+:2006 gecertificeerde
      bedrijfslocaties per bedrijfslocatie per certificatie van een GMP-standaard een basisvergoeding te betalen:










                    Aantal locaties







                    1 t/m 5


                    6 t/m 10


                    11 t/m 15


                    16e.v.




                    Standaard B1


                    € 350,00


                    € 262,50


                    €175,00


                    €105,00




                    Standaarden B2 t/m B5, B8, B10


                    €195,00


                    €150,00


                    €105,00


                    € 60,00
    url: https://wetten.overheid.nl/BWBR0019020/2007-01-01#Artikel7
  - number: '7.2'
    text: |-
      De scope van standaard B1 omvat de productie van, handel en op- en overslag in mengvoeders, voormengsels,
      voedermiddelen en toevoegingsmiddelen. In afwijking van het in lid 1 bepaalde, bedraagt de basisvergoeding voor
      standaard B1: € 195,00 voor de eerste 5 locaties, € 150,00 voor de locaties 6 t/m 10, € 105,00 voor de locaties 11
      t/m 15 en € 60,00 voor de locaties 16 en verder - indien de productie slechts één productgroep betreft, ongeacht de
      handels- en/of op- en overslagactiviteiten;
        - indien de gecertificeerde bedrijfslocaties uitsluitend handelen in de genoemde productgroepen in combinatie met
      op- en overslagactiviteiten.
    url: https://wetten.overheid.nl/BWBR0019020/2007-01-01#Artikel7
  - number: '7.3'
    text: |-
      Voor een tweede certificatie op dezelfde bedrijfslocatie is 50%, voor elke volgende certificatie is 10% van het in
      het eerste lid genoemde bedrag verschuldigd.
    url: https://wetten.overheid.nl/BWBR0019020/2007-01-01#Artikel7
  - number: '7.4'
    text: |-
      Voor een aanvullende certificatie voor de standaarden B9.1 (graskippen) of B9.2 (scharreldieren) is de
      certificatie-instelling verplicht aan het productschap een vergoeding van € 25 te betalen.
    url: https://wetten.overheid.nl/BWBR0019020/2007-01-01#Artikel7
  - number: '7.5'
    text: |-
      Voor een certificatie van de standaarden B6 (teelt voedermiddelen), B7.1 (opslag, bewaring en vervoedering
      diervoeders op het pluimveehouderijbedrijf) en B7.2 (opslag, bewaring en vervoedering diervoeders op het
      varkenshouderijbedrijf) is de certificatie- instelling verplicht aan het productschap een vergoeding van € 25 te
      betalen.
    url: https://wetten.overheid.nl/BWBR0019020/2007-01-01#Artikel7
  - number: '7.6'
    text: De peildatum voor berekening van de vergoedingen, bedoeld in het eerste tot en met het vijfde lid, is 31 december.
    url: https://wetten.overheid.nl/BWBR0019020/2007-01-01#Artikel7
  - number: 7a.1
    text: |-
      De certificatie-instellingen die de IFIS-standaard handhaven zijn verplicht jaarlijks aan het productschap een
      retributie te betalen van: € 1.000,- basistarief € 100,- per auditor.
    url: https://wetten.overheid.nl/BWBR0019020/2007-01-01#Artikel7a
  - number: 7a.2
    text: |-
      De certificatie-instellingen die de IFIS-standaard certificeren zijn verplicht jaarlijks aan het productschap
      voor de volgens IFSA-certificatieschema gecertificeerde bedrijfslocaties per bedrijfslocatie per certificatie een
      basisvergoeding van € 195,00 voor de eerste 5 locaties te betalen, € 150,00 voor locatie 6 t/m 10, € 105,00 voor
      locatie 11 t/m 15 en € 60,00 voor locatie 16 en verder.
    url: https://wetten.overheid.nl/BWBR0019020/2007-01-01#Artikel7a
  - number: 7a.3
    text: De peildatum voor berekening van de vergoedingen, bedoeld in het eerste tot en met derde lid, is 31 december.
    url: https://wetten.overheid.nl/BWBR0019020/2007-01-01#Artikel7a
  - number: '8'
    text: |-
      De ondernemer die zich heeft aangemeld voor standaard B04.3 (hygiënecode binnenvaart) is verplicht aan het
      productschap een vergoeding van € 30 te betalen.
    url: https://wetten.overheid.nl/BWBR0019020/2007-01-01#Artikel8
  - number: '9'
    text: Het productschap kan verrekeningen van bedragen kleiner dan € 50 achterwege laten.
    url: https://wetten.overheid.nl/BWBR0019020/2007-01-01#Artikel9
  - number: '10.1'
    text: |-
      Indien de ondernemer de benodigde gegevens voor het vaststellen van de retributie niet, niet tijdig of naar
      het oordeel van de secretaris niet volledig heeft verstrekt, is de secretaris bevoegd namens het bestuur de
      verschuldigde retributie voor de betreffende door het productschap verrichte werkzaamheden ambtshalve bij aanslag
      vast te stellen.
    url: https://wetten.overheid.nl/BWBR0019020/2007-01-01#Artikel10
  - number: '10.2'
    text: |-
      Indien de ondernemer binnen 21 dagen na ontvangst van de retributieaanslag, bedoeld in het eerste lid, alsnog de
      gevraagde gegevens verstrekt, wordt de aanvankelijk vastgestelde retributie ingetrokken en een nieuwe retributie
      vastgesteld op basis van de door hem verstrekte gegevens.
    url: https://wetten.overheid.nl/BWBR0019020/2007-01-01#Artikel10
  - number: '11'
    text: |-
      De retributie is verschuldigd uiterlijk op de eenentwintigste dag volgend op die waarop zij door of vanwege het
      productschap in rekening is gebracht, dan wel, indien de secretaris zulks verlangt, voor een door deze te bepalen
      datum.
    url: https://wetten.overheid.nl/BWBR0019020/2007-01-01#Artikel11
  - number: '12'
    text: |-
      Aan de ondernemer die niet of niet geheel binnen de in [artikel 9][ref1] gestelde termijn heeft betaald, kan
      door het productschap de wettelijke interest over het niet betaalde bedrag in rekening worden gebracht, te
      berekenen vanaf de dag waarop de betaling uiterlijk diende te zijn verricht ingevolge de aanmaning bedoeld in
      [artikel 127, tweede lid, van de Wet op de bedrijfsorganisatie][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019020#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel127
    url: https://wetten.overheid.nl/BWBR0019020/2007-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0019020
        artikel: '9'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0002058
        artikel: '127'
  - number: '13.1'
    text: |-
      De gegevens verkregen uit hoofde van het bepaalde in deze verordening dienen in handen van de secretaris te worden
      gesteld of door deze aan te wijzen personen van het secretariaat van het (hoofd-)productschap.
    url: https://wetten.overheid.nl/BWBR0019020/2007-01-01#Artikel13
  - number: '13.2'
    text: |-
      Deze gegevens mogen slechts worden gebezigd voor de vervulling van de taak van het productschap en mogen niet onder
      vermelding of aanduiding van de onderneming, waarop zij betrekking hebben, aan het bestuur, het dagelijks bestuur,
      een commissie van het (hoofd)productschap of aan leden of plaatsvervangende leden daarvan worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0019020/2007-01-01#Artikel13
  - number: '14'
    text: |-
      Deze verordening treedt in werking met ingang van 1 januari 2006. Indien het Verordeningenblad Bedrijfsorganisatie
      waarin deze verordening wordt geplaatst, wordt uitgegeven na 1 januari 2006, treedt zij in werking met ingang van
      de tweede dag na de dagtekening van dat Verordeningenblad Bedrijfsorganisatie en werkt terug tot en met 1 januari
      2006.
    url: https://wetten.overheid.nl/BWBR0019020/2007-01-01#Artikel14
  - number: '15.1'
    text: |-
      De [Verordening PDV retributies diervoeders jaar 2005][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0017457
    url: https://wetten.overheid.nl/BWBR0019020/2007-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0017457
  - number: '15.2'
    text: |-
      De in het eerste lid genoemde verordening blijft van kracht voor zover het betreft de op grond van die verordening
      verschuldigde, maar nog niet in rekening gebrachte dan wel betaalde bedragen.
    url: https://wetten.overheid.nl/BWBR0019020/2007-01-01#Artikel15
  - number: '16'
    text: 'Deze verordening wordt aangehaald als: Verordening PDV retributies diervoeders jaar 2006.'
    url: https://wetten.overheid.nl/BWBR0019020/2007-01-01#Artikel16
