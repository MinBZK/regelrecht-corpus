  - number: '2.1'
    text: |-
      De minister verstrekt op aanvraag subsidie aan producenten van hernieuwbare elektriciteit geproduceerd door een
      productie-installatie voor de productie van hernieuwbare elektriciteit met behulp van windenergie op land.
    url: https://wetten.overheid.nl/BWBR0025570/2012-10-01#Artikel2
  - number: '2.2'
    text: |-
      Aanvragen om subsidie als bedoeld in het eerste lid, worden ontvangen in de periode van 6 april 2009 tot 30 oktober
      2009, 17:00 uur.
    url: https://wetten.overheid.nl/BWBR0025570/2012-10-01#Artikel2
  - number: '2.3'
    text: |-
      Een aanvraag om subsidie wordt ingediend met gebruikmaking van het origineel van een ondertekend formulier, dat is
      opgenomen in de bij deze regeling behorende [bijlage 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025570
    url: https://wetten.overheid.nl/BWBR0025570/2012-10-01#Artikel2
