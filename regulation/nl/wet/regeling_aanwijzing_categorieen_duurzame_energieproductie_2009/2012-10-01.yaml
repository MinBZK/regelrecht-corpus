    text: |-
      De minister verstrekt op aanvraag subsidie aan producenten van hernieuwbaar gas geproduceerd door een productie-
      installatie voor de productie van hernieuwbaar gas met gebruik van stortgas of biogas uit afvalwater- of
      rioolwaterzuiveringsinstallaties.
