preamble:
  text: |-
    Gelet op de artikelen 6.55, zesde lid, 6.58, zesde lid, 8.12, vijfde lid, en 11.2a, derde lid, van de Wet
    luchtvaart, op artikel 159, eerste lid, en artikel 160, tweede lid van de Regeling Toezicht Luchtvaart, op
    de artikelen 8, derde lid, 13, tweede lid, en 30, derde lid, van het Besluit bewijzen van bevoegdheid voor de
    luchtvaart en artikel 46, tweede en derde lid, van het Besluit luchtwaardigheid;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0017822/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0017822/2005-01-01#Artikel1
  - number: 1.a
    text: '*vast tarief*: hoogte van de vergoeding die niet afhankelijk is van de tijdsbesteding;'
    url: https://wetten.overheid.nl/BWBR0017822/2005-01-01#Artikel1
  - number: 1.b
    text: |-
      *uurtarief*: hoogte van de vergoeding die per uur per persoon is besteed met betrekking tot werkzaamheden als
      bedoeld in deze regeling.
    url: https://wetten.overheid.nl/BWBR0017822/2005-01-01#Artikel1
  - number: '2.1'
    text: |-
      In geval van een vast tarief wordt het bedrag binnen 30 kalenderdagen na verzending van het betalingsverzoek
      voldaan. Het betalingsverzoek wordt gedaan zodra een aanvraag is ontvangen. Een beslissing op een aanvraag waaraan
      een vast tarief is verbonden wordt genomen, nadat gebleken is dat de verschuldigde vergoeding betaald is.
    url: https://wetten.overheid.nl/BWBR0017822/2005-01-01#Artikel2
  - number: '2.2'
    text: |-
      In geval van een uurtarief worden de werkzaamheden periodiek gefactureerd op basis van het werkelijk aantal
      bestede uren. De te betalen vergoeding wordt achteraf vastgesteld door het aantal bestede uren te vermenigvuldigen
      met het uurtarief. De aanvrager voldoet elke ontvangen factuur binnen 30 kalenderdagen na verzending van het
      betalingsverzoek.
    url: https://wetten.overheid.nl/BWBR0017822/2005-01-01#Artikel2
  - number: '2.3'
    text: 'Betaling van de in rekening gebracht vergoedingen geschiedt op de volgende wijze:'
    url: https://wetten.overheid.nl/BWBR0017822/2005-01-01#Artikel2
  - number: 2.3.a
    text: |-
      met betrekking tot *examens en brevetten*: op bankrekeningnummer 19.23.23.741, t.n.v. IVW, o.v.v. luchtvaart,
      bewijzen van bevoegdheid;
    url: https://wetten.overheid.nl/BWBR0017822/2005-01-01#Artikel2
  - number: 2.3.b
    text: |-
      met betrekking tot *luchtvaartbewijzen, Aircraft Maintenance Licences en examens voor onderhoudstechnici*: op
      bankrekeningnummer 19.23.23.768, t.n.v. IVW, o.v.v. luchtvaart, luchtvaartbewijzen;
    url: https://wetten.overheid.nl/BWBR0017822/2005-01-01#Artikel2
  - number: 2.3.c
    text: |-
      met betrekking tot alle overige in deze regeling genoemde besluiten: op bankrekeningnummer 19.23.23.733, t.n.v.
      IVW, o.v.v. luchtvaart.
    url: https://wetten.overheid.nl/BWBR0017822/2005-01-01#Artikel2
  - number: '3.1'
    text: |-
      Buitenlandse reis- en verblijfkosten die verband houden met de in deze regeling genoemde handelingen of
      werkzaamheden, worden in rekening gebracht en zijn separaat verschuldigd naast de in deze regeling genoemde
      tarieven. Voor reizen buiten Nederland, maar binnen Europa geldt een vast tarief van € 600 per persoon. Voor reizen
      buiten Europa geldt een vast tarief van € 1.200 per persoon. Binnenlandse reis- en verblijfkosten worden niet
      separaat in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0017822/2005-01-01#Artikel3
  - number: '3.2'
    text: |-
      Reistijden die verband houden met de in deze regeling genoemde uitgevoerde handelingen of werkzaamheden en die ter
      plaatse worden uitgevoerd, worden – voor zover deze op uurbasis worden verricht – in rekening gebracht volgens de
      daarbij behorende tarieven. De in rekening te brengen reistijd voor reizen binnen Nederland bedraagt ten hoogste de
      duur van de werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0017822/2005-01-01#Artikel3
