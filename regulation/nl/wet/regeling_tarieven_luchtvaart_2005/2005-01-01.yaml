    text: |-
      [artikel 3.8, eerste lid van de Wet luchtvaart][ref1] om de luchtvaart uit te oefenen met een luchtvaartuig, dat
      niet luchtwaardig is of niet is voorzien van een geldig bewijs van luchtwaardigheid is een vast tarief verschuldigd
      van € 100;


