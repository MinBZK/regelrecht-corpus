  - number: '25'
    text: |-
      Bij exploitatie van een luchtvaartuig van historische waarde voor niet commerciële doeleinden, mits voorzien van
      een Nederlandse registratie, worden de volgende kortingen verleend:
    url: https://wetten.overheid.nl/BWBR0017822/2005-01-01#Artikel25
  - number: 25.a
    text: 'afgifte en verlenging Bewijs van Luchtwaardigheid: 100%;'
    url: https://wetten.overheid.nl/BWBR0017822/2005-01-01#Artikel25
  - number: 25.b
    text: 'afgifte Bewijs van Inschrijving: 100%;'
    url: https://wetten.overheid.nl/BWBR0017822/2005-01-01#Artikel25
  - number: 25.c
    text: 'luchtwaardigheidsonderzoek/certificaties: 75%;'
    url: https://wetten.overheid.nl/BWBR0017822/2005-01-01#Artikel25
  - number: 25.d
    text: 'ontheffing Bewijs van Luchtwaardigheid: 100%;'
    url: https://wetten.overheid.nl/BWBR0017822/2005-01-01#Artikel25
  - number: 25.e
    text: 'toezicht op erkende bedrijven, eerste erkenning en verlenging: 75%.'
    url: https://wetten.overheid.nl/BWBR0017822/2005-01-01#Artikel25
  - number: '26'
    text: |-
      De [artikelen 9][ref1], [10][ref2], [12][ref3], [13][ref4], [14][ref5], [15][ref6], [16][ref7], [18][ref8] en
      [24, eerste lid, onderdeel a][ref9], zijn eveneens van toepassing op de in die artikelen genoemde werkzaamheden
      voor zover deze worden uitgevoerd ter uitvoering van de Verordening (EG) nr. 1592/2002 van het Europese Parlement
      en de Raad van 15 juli 2002 tot vaststelling van gemeenschappelijke regels op het gebied van de burgerluchtvaart
      en tot oprichting van een Europees Agentschap voor de veiligheid van de luchtvaart (PbEG L 240) en de op die
      verordening gebaseerde regelgeving.


