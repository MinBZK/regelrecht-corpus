  - number: '27.1'
    text: |-
      Voor werkzaamheden, die vanaf 1 januari 2004 tot het tijdstip van inwerkingtreding van deze regeling op basis van
      uurtarief zijn verricht ten behoeve van instandhouding, worden in afwijking van de Regeling tarieven 2003 vaste
      tarieven overeenkomstig deze regeling in rekening gebracht, met uitzondering van het certificeren van luchthaven
      Schiphol, het certificeren van luchtvaartuigen, het verrichten van werkzaamheden in het kader van een DOA en het
      verrichten van werkzaamheden ten behoeve van buitenlandse onderhoudsorganisaties die hun hoofdvestiging buiten de
      Europese Unie hebben.
    url: https://wetten.overheid.nl/BWBR0017822/2005-01-01#Artikel27
  - number: '27.2'
    text: |-
      In afwijking van het eerste lid worden in plaats van de vaste tarieven, genoemd in het eerste lid, uurtarieven
      overeenkomstig de [Regeling tarieven luchtvaart 2003][ref1] in rekening gebracht, indien op grond van de
      [Regeling tarieven luchtvaart 2003][ref2] een lagere vergoeding verschuldigd is dan op grond van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0014508
      [ref2]: https://wetten.overheid.nl/BWBR0014508
    url: https://wetten.overheid.nl/BWBR0017822/2005-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0014508
      - id: ref2
        bwb_id: BWBR0014508
  - number: '27.3'
    text: |-
      In afwijking van het eerste lid geldt dat voor werkzaamheden die vóór 1 januari 2004 zijn verricht op uurbasis in
      het kader van de behandeling van een aanvraag en voornoemde werkzaamheden zijn voortgezet in 2004, doch afgerond
      vóór inwerkingtreding van deze regeling, is in plaats van een vast tarief een uurtarief verschuldigd overeenkomstig
      de [Regeling tarieven luchtvaart 2003][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014508
    url: https://wetten.overheid.nl/BWBR0017822/2005-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0014508
  - number: '27.4'
    text: |-
      Op buitenlandse reis- en verblijfkosten die verband houden met de in de [Regeling tarieven luchtvaart 2003][ref1]
      vermelde handelingen of werkzaamheden en die vóór inwerkingtreding van deze regeling zijn gemaakt, is de
      [Regeling tarieven luchtvaart 2003][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014508
      [ref2]: https://wetten.overheid.nl/BWBR0014508
    url: https://wetten.overheid.nl/BWBR0017822/2005-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0014508
      - id: ref2
        bwb_id: BWBR0014508
  - number: '28'
    text: |-
      De [Regeling tarieven luchtvaart 2003][ref1] wordt met inachtneming van [artikel 27][ref2] ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0014508
      [ref2]: https://wetten.overheid.nl/BWBR0017822#Artikel27
