        artikel: '27'
        hoofdstuk: '3'
  - number: '29'
    text: |-
      Deze regeling treedt in werking met ingang van 1 januari 2005. Indien de Staatscourant, waarin deze regeling wordt
      geplaatst, wordt uitgegeven na 31 december 2004, treedt zij in werking met ingang van de tweede dag na dagtekening
      van de Staatscourant waarin zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0017822/2005-01-01#Artikel29
  - number: '30'
    text: 'Deze regeling wordt aangehaald als: Regeling tarieven luchtvaart 2005.'
    url: https://wetten.overheid.nl/BWBR0017822/2005-01-01#Artikel30
