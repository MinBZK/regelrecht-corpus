---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_uitvoering_wetten_voor_verzetsdeelnemers_en_oorlogsgetroffenen
regulatory_layer: WET
publication_date: '2015-12-10'
valid_from: '2016-01-01'
bwb_id: BWBR0027660
url: https://wetten.overheid.nl/BWBR0027660/2016-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de continuïteit en de kwaliteit van de dienstverlening
    aan verzetsdeelnemers en oorlogsgetroffenen te waarborgen en daartoe nieuwe regels te treffen voor de uitvoering
    van de wetten voor verzetsdeelnemers en oorlogsgetroffenen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel1
  - number: 1.a
    text: '*Onze Minister:* Onze Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel1
  - number: 1.b
    text: |-
      *Raad:* de Pensioen- en Uitkeringsraad, bedoeld in [artikel 3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0027660#Artikel3
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0027660
        artikel: '3'
  - number: 1.c
    text: |-
      *Sociale verzekeringsbank:* de Sociale verzekeringsbank, genoemd in
      [hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '6'
  - number: 1.d
    text: |-
      *Cliëntenraad:* de Cliëntenraad verzetsdeelnemers en oorlogsgetroffenen, genoemd in [artikel 10][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0027660#Artikel10
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0027660
        artikel: '10'
  - number: 1.e
    text: |-
      *wetten voor verzetsdeelnemers en oorlogsgetroffenen:* de [Wet buitengewoon pensioen 1940–1945][ref1],
      de [Wet buitengewoon pensioen zeelieden-oorlogsslachtoffers][ref2], de
      [Wet buitengewoon pensioen Indisch verzet][ref3], de [Wet uitkeringen vervolgingsslachtoffers 1940–1945][ref4] en
      de [Wet uitkeringen burger-oorlogsslachtoffers 1940–1945][ref5];


      [ref1]: https://wetten.overheid.nl/BWBR0002032
      [ref2]: https://wetten.overheid.nl/BWBR0002035
      [ref3]: https://wetten.overheid.nl/BWBR0003968
      [ref4]: https://wetten.overheid.nl/BWBR0002844
      [ref5]: https://wetten.overheid.nl/BWBR0003664
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002032
      - id: ref2
        bwb_id: BWBR0002035
      - id: ref3
        bwb_id: BWBR0003968
      - id: ref4
        bwb_id: BWBR0002844
      - id: ref5
        bwb_id: BWBR0003664
  - number: 1.f
    text: |-
      *AOR:* de Algemene Oorlogsongevallenregeling Indonesië met inbegrip van het besluit van de Luitenant-Gouverneur-
      Generaal van Nederlands-Indië van 5 november 1946 (Indisch Staatsblad 1946, 118).
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel1
  - number: '2.1'
    text: |-
      De [artikelen 18 tot en met 20][ref1], [22][ref2], [26 tot en met 30][ref3] en
      [33 tot en met 35 van de Kaderwet zelfstandige bestuursorganen][ref4] zijn van toepassing op de uitvoering door de
      Sociale verzekeringsbank van de wetten voor verzetsdeelnemers en oorlogsgetroffenen en de AOR.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0020495#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0020495#Artikel33
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '22'
      - id: ref3
        bwb_id: BWBR0020495
        artikel: '26'
      - id: ref4
        bwb_id: BWBR0020495
        artikel: '33'
  - number: '2.2'
    text: |-
      De bevoegdheden, bedoeld in de [artikelen 20][ref1] en [22, van de Kaderwet zelfstandige bestuursorganen][ref2],
      worden door Onze Minister toegepast in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel22
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '22'
  - number: '2.3'
    text: |-
      In afwijking van [artikel 37, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1],
      wordt het toezicht op de uitvoering door de Sociale verzekeringsbank van de wetten voor verzetsdeelnemers en
      oorlogsgetroffenen en de AOR uitgeoefend door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel37
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '37'
  - number: '2.4'
    text: |-
      [Artikel 84 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] is ten aanzien van de uitvoering van
      deze wet door de Sociale verzekeringsbank niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel84
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '84'
  - number: '3.1'
    text: |-
      Er is een Raad, die is belast met de taken, genoemd in [artikel 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027660#Artikel4
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0027660
        artikel: '4'
  - number: '3.2'
    text: De Raad is gevestigd op een door Onze Minister te bepalen plaats.
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel3
  - number: '3.3'
    text: De Raad bezit rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel3
  - number: '3.4'
    text: |-
      De [Kaderwet zelfstandige bestuursorganen][ref1] is van toepassing op de Raad.


      [ref1]: https://wetten.overheid.nl/BWBR0020495
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020495
  - number: '4'
    text: 'De Raad heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel4
  - number: 4.a
    text: |-
      het geven van beschikkingen op een aanvraag voor een erkenning, buitengewoon pensioen, garantietoeslag, uitkering,
      periodieke uitkering, garantie-uitkering, vergoeding, tegemoetkoming of herziening als bedoeld in de wetten voor
      verzetsdeelnemers en oorlogsgetroffenen, afkomstig van een persoon die nog geen financiële aanspraak ontleent of
      heeft ontleend aan de wet waarop hij zijn aanvraag baseert;
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel4
  - number: 4.b
    text: het ambtshalve herzien van de erkenning als verzetsdeelnemer, vervolgde of burger-oorlogsslachtoffer;
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel4
  - number: 4.c
    text: |-
      het geven van beschikkingen op een aanvraag voor een uitkering of tegemoetkoming op grond van de AOR afkomstig van
      een persoon die nog geen financiële aanspraak ontleent of heeft ontleend aan deze regeling;
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel4
  - number: 4.d
    text: |-
      het vaststellen van beleidsregels voor beschikkingen van de Sociale verzekeringsbank als bedoeld in
      [artikel 6, onderdelen a en b][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0027660#Artikel6
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0027660
        artikel: '6'
  - number: 4.e
    text: |-
      het adviseren van de Sociale verzekeringsbank over beschikkingen waarbij niet op basis van de beleidsregels,
      bedoeld in onderdeel d, kan worden besloten.
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel4
  - number: '5.1'
    text: De Raad bestaat uit minimaal drie en maximaal negen leden, onder wie een voorzitter.
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel5
  - number: '5.2'
    text: |-
      De benoeming van de leden van de Raad geschiedt gehoord hebbende de organisaties en instellingen welke regelmatig
      zijn betrokken bij de uitvoering van de wetten voor verzetsdeelnemers en oorlogsgetroffenen en de AOR.
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel5
  - number: '5.3'
    text: De leden van de Raad worden benoemd voor een periode van vier jaren.
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel5
  - number: '5.4'
    text: |-
      De Raad wordt zodanig samengesteld dat daarin de categorieën belanghebbenden waarop de werkzaamheden van de Raad
      betrekking hebben op een evenwichtige wijze zijn vertegenwoordigd.
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel5
  - number: '5.5'
    text: |-
      Het lidmaatschap van de Raad is onverenigbaar met het hebben van een financiële aanspraak op basis van de wetten
      voor verzetsdeelnemers en oorlogsgetroffenen en de AOR.
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel5
  - number: '5.6'
    text: |-
      De Raad stelt regels betreffende de uitvoering van zijn taken, genoemd in [artikel 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027660#Artikel4
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0027660
        artikel: '4'
  - number: '5.7'
    text: De voorzitter vertegenwoordigt de Raad in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel5
  - number: '6'
    text: 'De Sociale verzekeringsbank heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel6
  - number: 6.a
    text: |-
      het geven van de beschikkingen op basis van de wetten voor verzetsdeelnemers en oorlogsgetroffenen en de AOR die
      niet op grond van [artikel 4][ref1] aan de Raad zijn opgedragen;


      [ref1]: https://wetten.overheid.nl/BWBR0027660#Artikel4
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0027660
        artikel: '4'
  - number: 6.b
    text: |-
      het geven van beschikkingen op aanvragen voor een vergoeding in de kosten van een behandeling, als bedoeld in
      [artikel 2 van de Tijdelijke vergoedingsregeling psychotherapie na-oorlogse generatie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006957#Artikel2
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006957
        artikel: '2'
  - number: 6.c
    text: |-
      de voorbereiding en de uitvoering van de beschikkingen, bedoeld in [artikel 4, onderdelen a tot en met c][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0027660#Artikel4
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0027660
        artikel: '4'
  - number: 6.d
    text: de ondersteuning van de Raad bij zijn werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel6
  - number: '7.1'
    text: |-
      De beschikkingen, bedoeld in [artikel 6, onderdelen a en b][ref1], worden gegeven met in achtneming van de
      beleidsregels, bedoeld in [artikel 4, onderdeel d][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0027660#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0027660#Artikel4
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0027660
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0027660
        artikel: '4'
  - number: '7.2'
    text: |-
      De Sociale verzekeringsbank vraagt de Raad om advies indien deze niet kan voldoen aan de verplichting, genoemd in
      het eerste lid, omdat:
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel7
  - number: 7.2.a
    text: er geen beleidsregel is, of
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel7
  - number: 7.2.b
    text: |-
      toepassing van de beleidsregel voor een of meer belanghebbenden gevolgen zou hebben die wegens bijzondere
      omstandigheden onevenredig zijn in verhouding tot de met de beleidsregel te dienen doelen.
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel7
  - number: '7.3'
    text: |-
      Indien de Sociale verzekeringsbank een beschikking geeft die afwijkt van het advies, genoemd in het tweede lid,
      wordt dit advies met het besluit meegestuurd. Van het besluit wordt mededeling gedaan aan Onze Minister en aan
      de Raad.
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel7
  - number: '8.1'
    text: |-
      De Raad en de Sociale verzekeringsbank overleggen ten minste een maal per kwartaal over de afstemming van de hen op
      grond van deze wet toegekende taken.
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel8
  - number: '8.2'
    text: |-
      De Raad en de Sociale verzekeringsbank stellen gezamenlijk Onze Minister onverwijld op de hoogte van het resultaat
      van dit overleg.
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel8
  - number: '9.1'
    text: |-
      De kosten van de buitengewone pensioenen, garantietoeslagen, uitkeringen, periodieke uitkeringen, garantie-
      uitkeringen, vergoedingen en tegemoetkomingen, die worden verstrekt op grond van de wetten voor verzetsdeelnemers
      en oorlogsgetroffenen alsmede de uitkeringen en tegemoetkomingen op grond van de AOR, komen ten laste van het Rijk.
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel9
  - number: '9.2'
    text: |-
      De kosten, gemoeid met de uitvoering van deze wet, komen ten laste van ’s Rijks kas, overeenkomstig bij
      ministeriële regeling te stellen regels.
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel9
  - number: '10.1'
    text: |-
      Er is een Cliëntenraad, die met de Raad en de Sociale verzekeringsbank overlegt en hun gevraagd en ongevraagd
      schriftelijk adviseert over de uitvoering van de wetten voor verzetsdeelnemers en oorlogsgetroffenen en de AOR,
      voorzover dit relevant is vanuit het oogpunt van cliëntenbelangen, met uitzondering van individuele zaken.
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel10
  - number: '10.2'
    text: |-
      De Cliëntenraad bestaat uit personen of vertegenwoordigers van personen die als cliënt betrokken zijn bij de
      uitvoering van de taken, genoemd in de [artikelen 4][ref1] en [6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0027660#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0027660#Artikel6
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0027660
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0027660
        artikel: '6'
  - number: '10.3'
    text: |-
      De Cliëntenraad bestaat uit minimaal zeven en maximaal vijftien leden, onder wie een voorzitter, die door
      de Sociale verzekeringsbank worden benoemd, geschorst en ontslagen. De benoeming van de leden van de eerste
      Cliëntenraad na inwerkingtreding van deze wet, geschiedt op voordracht van de Raad. De daaropvolgende benoemingen
      geschieden op voordracht van de zittende leden van de Cliëntenraad.
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel10
  - number: '10.4'
    text: De leden van de Cliëntenraad worden benoemd voor een periode van drie jaren.
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel10
  - number: '10.5'
    text: |-
      De Raad en de Sociale verzekeringsbank verstrekken de Cliëntenraad tijdig, spontaan en op verzoek, alle informatie
      die hij redelijkerwijs nodig heeft voor de uitoefening van zijn taak, tenzij enig wettelijk voorschrift deze
      verstrekking in de weg staat.
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel10
  - number: '10.6'
    text: |-
      De Sociale verzekeringsbank voert het secretariaat van de Cliëntenraad en benoemt een van zijn medewerkers tot
      ambtelijk secretaris.
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel10
  - number: '10.7'
    text: 'De Cliëntenraad stelt in ieder geval regels betreffende:'
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel10
  - number: 10.7.a
    text: de frequentie van zijn bijeenkomsten;
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel10
  - number: 10.7.b
    text: de wijze waarop door de leden onderwerpen voor de agenda van zijn bijeenkomsten kunnen worden aangedragen, en
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel10
  - number: 10.7.c
    text: de openbaarheid van zijn bijeenkomsten.
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel10
  - number: '10.8'
    text: |-
      De leden van de Cliëntenraad hebben recht op een reiskostenvergoeding tot een door de Sociale verzekeringsbank te
      bepalen maximum.
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel10
  - number: '11.1'
    text: |-
      Aan de voorzitter en de leden van het bestuur, bedoeld in
      [artikel 5 van de Wet op de Pensioen- en Uitkeringsraad][ref1], wordt met ingang van de datum van inwerkingtreding
      van deze wet ontslag verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0004806#Artikel5
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004806
        artikel: '5'
  - number: '11.2'
    text: |-
      Aan de voorzitters, de leden en de plaatsvervangende leden van de Kamers, bedoeld in
      [artikel 11 van de Wet op de Pensioen- en Uitkeringsraad][ref1], wordt met ingang van de datum van inwerkingtreding
      van deze wet ontslag verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0004806#Artikel11
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004806
        artikel: '11'
  - number: '12.1'
    text: |-
      Op het tijdstip van inwerkingtreding van deze wet zijn de personeelsleden van de Raad, bedoeld in
      [artikel 2, eerste lid, van de Wet op de Pensioen- en Uitkeringsraad][ref1], van wie naam en functie zijn vermeld
      op een door deze Raad in overleg met de Sociale verzekeringsbank vastgestelde lijst, van rechtswege ontslagen en in
      dienst genomen door de Sociale verzekeringsbank krachtens een arbeidsovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0004806#Artikel2
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004806
        artikel: '2'
  - number: '12.2'
    text: |-
      De overgang van de in het eerste lid bedoelde personeelsleden vindt plaats met een rechtspositie die
      als geheel ten minste gelijkwaardig is aan die welke voor elk van hen gold bij de Raad, bedoeld in
      [artikel 2, eerste lid, van de Wet op de Pensioen- en Uitkeringsraad][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004806#Artikel2
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004806
        artikel: '2'
  - number: '13'
    text: |-
      Op het tijdstip van inwerkingtreding van de [wet tot wijziging van de Wet uitvoering wetten voor verzetsdeelnemers
      en oorlogsgetroffenen in verband met het opnemen van een grondslag voor de uitvoering door de Pensioen- en
      Uitkeringsraad en de Sociale verzekeringsbank van de Algemene Oorlogsongevallenregeling Indonesië en het
      besluit van de Luitenant-Gouverneur-Generaal van Nederlands-Indië van 5 november 1946 (Indisch Staatsblad
      1946, 118)](onbekend) worden de archiefbescheiden van de Stichting Administratie Indonesische Pensioenen, voor
      zover betrekking hebbend op de AOR, overgedragen aan de Sociale verzekeringsbank respectievelijk de Pensioen-
      en Uitkeringsraad, voor zover zij niet overeenkomstig de [Archiefwet 1995][ref1] zijn overgebracht naar een
      archiefbewaarplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: '20'
    text: |-
      De [Wet op de Pensioen- en Uitkeringsraad][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0004806
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004806
  - number: '21'
    text: |-
      Onze Minister zendt in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid binnen drie jaar na
      de inwerkingtreding van deze wet, en vervolgens telkens na vijf jaar, aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel21
  - number: '23'
    text: Deze wet treedt in werking met ingang van 1 januari 2011.
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel23
  - number: '24'
    text: 'Deze wet wordt aangehaald als: Wet uitvoering wetten voor verzetsdeelnemers en oorlogsgetroffenen.'
    url: https://wetten.overheid.nl/BWBR0027660/2016-01-01#Artikel24
