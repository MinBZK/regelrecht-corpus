        artikel: '6'
      - id: ref2
        bwb_id: BWBR0027660
        artikel: '4'
  - number: '8'
    text: |-
      1 De Raad en de Sociale verzekeringsbank overleggen ten minste een maal per kwartaal over de afstemming van de hen
      op grond van deze wet toegekende taken.

      2 De Raad en de Sociale verzekeringsbank stellen gezamenlijk Onze Minister onverwijld op de hoogte van het
      resultaat van dit overleg.
    url: https://wetten.overheid.nl/BWBR0027660/2015-01-01#Artikel8
  - number: '9'
    text: |-
      1 De kosten van de buitengewone pensioenen, garantietoeslagen, uitkeringen, periodieke uitkeringen, garantie-
      uitkeringen, vergoedingen en tegemoetkomingen, die worden verstrekt op grond van de wetten voor verzetsdeelnemers
      en oorlogsgetroffenen alsmede de uitkeringen en tegemoetkomingen op grond van de AOR, komen ten laste van het Rijk.

      2 De kosten, gemoeid met de uitvoering van deze wet, komen ten laste van ’s Rijks kas, overeenkomstig bij
      ministeriële regeling te stellen regels.
    url: https://wetten.overheid.nl/BWBR0027660/2015-01-01#Artikel9
  - number: '10'
    text: |-
      1 Er is een Cliëntenraad, die met de Raad en de Sociale verzekeringsbank overlegt en hun gevraagd en ongevraagd
      schriftelijk adviseert over de uitvoering van de wetten voor verzetsdeelnemers en oorlogsgetroffenen en de AOR,
      voorzover dit relevant is vanuit het oogpunt van cliëntenbelangen, met uitzondering van individuele zaken.

      2 De Cliëntenraad bestaat uit personen of vertegenwoordigers van personen die als cliënt betrokken zijn bij de
      uitvoering van de taken, genoemd in de [artikelen 4][ref1] en [6][ref2].

      3 De Cliëntenraad bestaat uit minimaal zeven en maximaal vijftien leden, onder wie een voorzitter, die door
      de Sociale verzekeringsbank worden benoemd, geschorst en ontslagen. De benoeming van de leden van de eerste
      Cliëntenraad na inwerkingtreding van deze wet, geschiedt op voordracht van de Raad. De daaropvolgende benoemingen
      geschieden op voordracht van de zittende leden van de Cliëntenraad.

      4 De leden van de Cliëntenraad worden benoemd voor een periode van drie jaren.

      5 De Raad en de Sociale verzekeringsbank verstrekken de Cliëntenraad tijdig, spontaan en op verzoek, alle
      informatie die hij redelijkerwijs nodig heeft voor de uitoefening van zijn taak, tenzij enig wettelijk voorschrift
      deze verstrekking in de weg staat.

      6 De Sociale verzekeringsbank voert het secretariaat van de Cliëntenraad en benoemt een van zijn medewerkers tot
      ambtelijk secretaris.

      7 De Cliëntenraad stelt in ieder geval regels betreffende:

      a. de frequentie van zijn bijeenkomsten;

      b. de wijze waarop door de leden onderwerpen voor de agenda van zijn bijeenkomsten kunnen worden aangedragen, en

      c. de openbaarheid van zijn bijeenkomsten.

      8 De leden van de Cliëntenraad hebben recht op een reiskostenvergoeding tot een door de Sociale verzekeringsbank te
      bepalen maximum.


      [ref1]: https://wetten.overheid.nl/BWBR0027660#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0027660#Artikel6
    url: https://wetten.overheid.nl/BWBR0027660/2015-01-01#Artikel10
