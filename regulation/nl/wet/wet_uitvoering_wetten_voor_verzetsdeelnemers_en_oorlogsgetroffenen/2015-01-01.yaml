preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de continuïteit en de kwaliteit van de dienstverlening
    aan verzetsdeelnemers en oorlogsgetroffenen te waarborgen en daartoe nieuwe regels te treffen voor de uitvoering
    van de wetten voor verzetsdeelnemers en oorlogsgetroffenen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0027660/2015-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. *Onze Minister:* Onze Minister van Volksgezondheid, Welzijn en Sport;

      b. *Raad:* de Pensioen- en Uitkeringsraad, bedoeld in [artikel 3][ref1];

      c. *Sociale verzekeringsbank:* de Sociale verzekeringsbank, genoemd in
      [hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2];

      d. *Cliëntenraad:* de Cliëntenraad verzetsdeelnemers en oorlogsgetroffenen, genoemd in [artikel 10][ref3];

      e. *wetten voor verzetsdeelnemers en oorlogsgetroffenen:* de [Wet buitengewoon pensioen 1940–1945][ref4],
      de [Wet buitengewoon pensioen zeelieden-oorlogsslachtoffers][ref5], de
      [Wet buitengewoon pensioen Indisch verzet][ref6], de [Wet uitkeringen vervolgingsslachtoffers 1940–1945][ref7] en
      de [Wet uitkeringen burger-oorlogsslachtoffers 1940–1945][ref8];

      f. *AOR:* de Algemene Oorlogsongevallenregeling Indonesië met inbegrip van het besluit van de Luitenant-Gouverneur-
      Generaal van Nederlands-Indië van 5 november 1946 (Indisch Staatsblad 1946, 118).


