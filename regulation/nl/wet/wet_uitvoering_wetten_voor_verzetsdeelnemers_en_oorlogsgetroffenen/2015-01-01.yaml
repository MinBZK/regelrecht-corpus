  - number: '11'
    text: |-
      1 Aan de voorzitter en de leden van het bestuur, bedoeld in
      [artikel 5 van de Wet op de Pensioen- en Uitkeringsraad][ref1], wordt met ingang van de datum van inwerkingtreding
      van deze wet ontslag verleend.

      2 Aan de voorzitters, de leden en de plaatsvervangende leden van de Kamers, bedoeld in
      [artikel 11 van de Wet op de Pensioen- en Uitkeringsraad][ref2], wordt met ingang van de datum van inwerkingtreding
      van deze wet ontslag verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0004806#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004806#Artikel11
