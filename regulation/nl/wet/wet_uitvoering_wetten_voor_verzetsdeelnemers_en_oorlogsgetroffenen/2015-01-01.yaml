        artikel: '2'
      - id: ref2
        bwb_id: BWBR0004806
        artikel: '2'
  - number: '13'
    text: |-
      Op het tijdstip van inwerkingtreding van de [wet tot wijziging van de Wet uitvoering wetten voor verzetsdeelnemers
      en oorlogsgetroffenen in verband met het opnemen van een grondslag voor de uitvoering door de Pensioen- en
      Uitkeringsraad en de Sociale verzekeringsbank van de Algemene Oorlogsongevallenregeling Indonesië en het besluit
      van de Luitenant-Gouverneur-Generaal van Nederlands-Indië van 5 november 1946 (Indisch Staatsblad 1946, 118)]
      (519269) worden de archiefbescheiden van de Stichting Administratie Indonesische Pensioenen, voor zover betrekking
      hebbend op de AOR, overgedragen aan de Sociale verzekeringsbank respectievelijk de Pensioen- en Uitkeringsraad,
      voor zover zij niet overeenkomstig de [Archiefwet 1995][ref1] zijn overgebracht naar een archiefbewaarplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0027660/2015-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: '20'
    text: |-
      De [Wet op de Pensioen- en Uitkeringsraad][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0004806
    url: https://wetten.overheid.nl/BWBR0027660/2015-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004806
  - number: '21'
    text: |-
      Onze Minister zendt in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid binnen drie jaar na
      de inwerkingtreding van deze wet, en vervolgens telkens na vijf jaar, aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0027660/2015-01-01#Artikel21
  - number: '23'
    text: Deze wet treedt in werking met ingang van 1 januari 2011.
    url: https://wetten.overheid.nl/BWBR0027660/2015-01-01#Artikel23
  - number: '24'
    text: 'Deze wet wordt aangehaald als: Wet uitvoering wetten voor verzetsdeelnemers en oorlogsgetroffenen.'
