  - number: '3'
    text: |-
      1 Er is een Raad, die is belast met de taken, genoemd in [artikel 4][ref1].

      2 De Raad is gevestigd op een door Onze Minister te bepalen plaats.

      3 De Raad bezit rechtspersoonlijkheid.

      4 De [Kaderwet zelfstandige bestuursorganen][ref2] is van toepassing op de Raad.


      [ref1]: https://wetten.overheid.nl/BWBR0027660#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020495
    url: https://wetten.overheid.nl/BWBR0027660/2015-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0027660
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020495
  - number: '4'
    text: |-
      De Raad heeft tot taak:

      a. het geven van beschikkingen op een aanvraag voor een erkenning, buitengewoon pensioen, garantietoeslag,
      uitkering, periodieke uitkering, garantie-uitkering, vergoeding, tegemoetkoming of herziening als bedoeld in de
      wetten voor verzetsdeelnemers en oorlogsgetroffenen, afkomstig van een persoon die nog geen financiële aanspraak
      ontleent of heeft ontleend aan de wet waarop hij zijn aanvraag baseert;

      b. het ambtshalve herzien van de erkenning als verzetsdeelnemer, vervolgde of burger-oorlogsslachtoffer;

      c. het geven van beschikkingen op een aanvraag voor een uitkering of tegemoetkoming op grond van de AOR afkomstig
      van een persoon die nog geen financiële aanspraak ontleent of heeft ontleend aan deze regeling;

      d. het vaststellen van beleidsregels voor beschikkingen van de Sociale verzekeringsbank als bedoeld in
      [artikel 6, onderdelen a en b][ref1], en

      e. het adviseren van de Sociale verzekeringsbank over beschikkingen waarbij niet op basis van de beleidsregels,
      bedoeld in onderdeel d, kan worden besloten.


      [ref1]: https://wetten.overheid.nl/BWBR0027660#Artikel6
    url: https://wetten.overheid.nl/BWBR0027660/2015-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0027660
        artikel: '6'
  - number: '5'
    text: |-
      1 De Raad bestaat uit minimaal drie en maximaal negen leden, onder wie een voorzitter.

      2 De benoeming van de leden van de Raad geschiedt gehoord hebbende de organisaties en instellingen welke regelmatig
      zijn betrokken bij de uitvoering van de wetten voor verzetsdeelnemers en oorlogsgetroffenen en de AOR.

      3 De leden van de Raad worden benoemd voor een periode van vier jaren.

      4 De Raad wordt zodanig samengesteld dat daarin de categorieën belanghebbenden waarop de werkzaamheden van de Raad
      betrekking hebben op een evenwichtige wijze zijn vertegenwoordigd.

      5 Het lidmaatschap van de Raad is onverenigbaar met het hebben van een financiële aanspraak op basis van de wetten
      voor verzetsdeelnemers en oorlogsgetroffenen en de AOR.

      6 De Raad stelt regels betreffende de uitvoering van zijn taken, genoemd in [artikel 4][ref1].

      7 De voorzitter vertegenwoordigt de Raad in en buiten rechte.


      [ref1]: https://wetten.overheid.nl/BWBR0027660#Artikel4
    url: https://wetten.overheid.nl/BWBR0027660/2015-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0027660
        artikel: '4'
  - number: '6'
    text: |-
      De Sociale verzekeringsbank heeft tot taak:

      a. het geven van de beschikkingen op basis van de wetten voor verzetsdeelnemers en oorlogsgetroffenen en de AOR die
      niet op grond van [artikel 4][ref1] aan de Raad zijn opgedragen;

      b. het geven van beschikkingen op aanvragen voor een vergoeding in de kosten van een behandeling, als bedoeld in
      [artikel 2 van de Tijdelijke vergoedingsregeling psychotherapie na-oorlogse generatie][ref2];

      c. de voorbereiding en de uitvoering van de beschikkingen, bedoeld in [artikel 4, onderdelen a tot en met c][ref3],
      en

      d. de ondersteuning van de Raad bij zijn werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0027660#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006957#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0027660#Artikel4
    url: https://wetten.overheid.nl/BWBR0027660/2015-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0027660
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0006957
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0027660
        artikel: '4'
  - number: '7'
    text: |-
      1 De beschikkingen, bedoeld in [artikel 6, onderdelen a en b][ref1], worden gegeven met in achtneming van de
      beleidsregels, bedoeld in [artikel 4, onderdeel d][ref2].

      2 De Sociale verzekeringsbank vraagt de Raad om advies indien deze niet kan voldoen aan de verplichting, genoemd in
      het eerste lid, omdat:

      a. er geen beleidsregel is, of

      b. toepassing van de beleidsregel voor een of meer belanghebbenden gevolgen zou hebben die wegens bijzondere
      omstandigheden onevenredig zijn in verhouding tot de met de beleidsregel te dienen doelen.

      3 Indien de Sociale verzekeringsbank een beschikking geeft die afwijkt van het advies, genoemd in het tweede lid,
      wordt dit advies met het besluit meegestuurd. Van het besluit wordt mededeling gedaan aan Onze Minister en aan
      de Raad.


      [ref1]: https://wetten.overheid.nl/BWBR0027660#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0027660#Artikel4
    url: https://wetten.overheid.nl/BWBR0027660/2015-01-01#Artikel7
    references:
      - id: ref1
