        artikel: '11'
  - number: '12'
    text: |-
      1 Op het tijdstip van inwerkingtreding van deze wet zijn de personeelsleden van de Raad, bedoeld in
      [artikel 2, eerste lid, van de Wet op de Pensioen- en Uitkeringsraad][ref1], van wie naam en functie zijn vermeld
      op een door deze Raad in overleg met de Sociale verzekeringsbank vastgestelde lijst, van rechtswege ontslagen en in
      dienst genomen door de Sociale verzekeringsbank krachtens een arbeidsovereenkomst.

      2 De overgang van de in het eerste lid bedoelde personeelsleden vindt plaats met een rechtspositie
      die als geheel ten minste gelijkwaardig is aan die welke voor elk van hen gold bij de Raad, bedoeld in
      [artikel 2, eerste lid, van de Wet op de Pensioen- en Uitkeringsraad][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004806#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004806#Artikel2
    url: https://wetten.overheid.nl/BWBR0027660/2015-01-01#Artikel12
