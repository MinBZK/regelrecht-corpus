      1 De [artikelen 18 tot en met 20][ref1], [22][ref2], [26 tot en met 30][ref3] en
      [33 tot en met 35 van de Kaderwet zelfstandige bestuursorganen][ref4] zijn van toepassing op de uitvoering door de
      Sociale verzekeringsbank van de wetten voor verzetsdeelnemers en oorlogsgetroffenen en de AOR.

      2 De bevoegdheden, bedoeld in de [artikelen 20][ref5] en [22, van de Kaderwet zelfstandige bestuursorganen][ref6],
      worden door Onze Minister toegepast in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid.

      3 In afwijking van [artikel 36, tweede lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref7],
      wordt het toezicht op de uitvoering door de Sociale verzekeringsbank van de wetten voor verzetsdeelnemers en
      oorlogsgetroffenen en de AOR uitgeoefend door Onze Minister.

      4 [Artikel 84 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref8] is ten aanzien van de uitvoering
      van deze wet door de Sociale verzekeringsbank niet van toepassing.


