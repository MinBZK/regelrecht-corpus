$id: warmtewet
regulatory_layer: WET
publication_date: '2026-01-22'
valid_from: '2014-03-15'
bwb_id: BWBR0033729
url: https://wetten.overheid.nl/BWBR0033729/2014-03-15
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is, omwille van de bescherming van de verbruikers,
    met inachtneming van het belang van een betrouwbaar, duurzaam, milieuhygiënisch verantwoord en een doelmatig
    functioneren van de warmtevoorziening een regeling tot stand te brengen met betrekking tot de levering van warmte
    aan verbruikers;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel1
  - number: 1.a
    text: '*Onze Minister:* Onze Minister van Economische Zaken;'
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel1
  - number: 1.b
    text: |-
      *Autoriteit Consument en Markt:* de Autoriteit Consument en Markt, genoemd in
      [artikel 2, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel2
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0033043
        artikel: '2'
  - number: 1.c
    text: |-
      *warmtenet:* het geheel van tot elkaar behorende, met elkaar verbonden leidingen, bijbehorende installaties en
      overige hulpmiddelen dienstbaar aan het transport van warmte, behoudens voor zover deze leidingen, installaties
      en hulpmiddelen zijn gelegen in een gebouw of werk van een verbruiker of van een producent en strekken tot toe- of
      afvoer van warmte ten behoeve van dat gebouw of werk;
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel1
  - number: 1.d
    text: '*warmte:* warm water of tapwater bestemd voor ruimteverwarming, sanitaire doeleinden en huishoudelijk gebruik;'
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel1
  - number: 1.e
    text: '*levering van warmte:* de aflevering van warmte aan verbruikers;'
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel1
  - number: 1.f
    text: |-
      *ontwikkelaar:* een persoon die een bouwproject ontwikkelt in een gebied waar de gebouwverwarming door middel van
      een warmtenet verzorgd wordt of zal worden;
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel1
  - number: 1.g
    text: '*verbruiker:* een persoon die warmte afneemt van een warmtenet en een aansluiting heeft van maximaal 100 kilowatt;'
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel1
  - number: 1.h
    text: '*leverancier:* een persoon die zich bezighoudt met de levering van warmte;'
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel1
  - number: 1.i
    text: '*producent:* een persoon die zich bezighoudt met de productie van warmte;'
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel1
  - number: 1.j
    text: |-
      *vergunninghouder:* de houder van een vergunning als bedoeld in [artikel 9][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel9
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 1.k
    text: |-
      *representatieve organisatie:* een rechtspersoon die de belangen vertegenwoordigt van producenten, leveranciers of
      verbruikers in de warmtesector;
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel1
  - number: 1.l
    text: |-
      *verhuurder:* een toegelaten instelling als bedoeld in [artikel 70, eerste lid, van de Woningwet][ref1], dan wel
      een eigenaar van ten minste 25 voor verhuur bestemde woongelegenheden in Nederland, of degene die door die eigenaar
      gevolmachtigd is namens hem op te treden.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel70
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '70'
  - number: '2.1'
    text: |-
      Een leverancier draagt zorg voor een betrouwbare levering van warmte tegen redelijke voorwaarden en met
      inachtneming van een goede kwaliteit van dienstverlening.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel2
  - number: '2.2'
    text: |-
      Een leverancier verstrekt de verbruikers aangesloten op zijn warmtenet ten minste eenmaal per jaar een volledige en
      voldoende gespecificeerde nota met betrekking tot de door hem geleverde diensten.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel2
  - number: '2.3'
    text: 'Ten aanzien van de levering van warmte brengt de leverancier ten hoogste in rekening:'
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel2
  - number: 2.3.a
    text: |-
      de maximumprijs, bedoeld in [artikel 5, eerste lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel5
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.3.b
    text: |-
      de redelijke kosten voor het ter beschikking stellen van de warmtewisselaar, bedoeld in
      [artikel 8, eerste lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel8
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.3.c
    text: |-
      het tarief voor de meting van het warmteverbruik, bedoeld in [artikel 8, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel8
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '2.4'
    text: Een leverancier onthoudt zich van iedere vorm van ongerechtvaardigd onderscheid jegens zijn verbruikers.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel2
  - number: '2.5'
    text: |-
      Een leverancier stelt verbruikers op toereikende wijze in kennis van elke wijziging van de prijzen voor levering
      van warmte en van elk voornemen tot wijziging van de aan de leveringsovereenkomst verbonden voorwaarden voor
      levering van warmte.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel2
  - number: '2.6'
    text: |-
      De boekhouding van een leverancier bevat betrouwbare en op een inzichtelijke wijze vorm gegeven informatie over de
      integrale kosten en opbrengsten die verband houden met de levering van warmte en het verrichten van de aansluiting.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel2
  - number: '2.7'
    text: |-
      Een leverancier houdt een storingsregistratie bij betreffende de levering van warmte en publiceert deze jaarlijks
      op geschikte wijze.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel2
  - number: '2.8'
    text: |-
      Een producent aangesloten op een warmtenet is verplicht op verzoek van de leverancier te onderhandelen over het
      beschikbaar stellen van warmte tegen redelijke prijzen en voorwaarden.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel2
  - number: '3.1'
    text: 'Een overeenkomst tot levering van warmte wordt op schrift gesteld en bevat in ieder geval de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel3
  - number: 3.1.a
    text: de personalia en het adres van de leverancier;
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel3
  - number: 3.1.b
    text: |-
      een duidelijke en volledige omschrijving van de te leveren goederen en diensten en de overeengekomen
      kwaliteitsniveaus daarvan, welke in ieder geval betrekking hebben op de minimum- en maximumtemperatuur van de te
      leveren warmte, alsmede de prijzen en voorwaarden waaronder deze goederen en diensten worden geleverd;
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel3
  - number: 3.1.c
    text: de voorwaarden voor opschorting of beëindiging van de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel3
  - number: 3.1.d
    text: |-
      een omschrijving van de toepasselijke vergoedingen, waaronder de uitkering van compensatie bij een ernstige
      storing in de levering van warmte, en terugbetalingsregelingen als de geleverde goederen en diensten niet aan de
      overeengekomen kwaliteitsniveaus voldoen.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel3
  - number: '3.2'
    text: |-
      In een overeenkomst wordt in ieder geval bepaald dat, onverminderd de bevoegdheid van de burgerlijke rechter,
      verbruikers geschillen die voortvloeien uit de desbetreffende overeenkomst kunnen voorleggen aan een onafhankelijke
      geschillencommissie. De geschillenprocedure dient snel, transparant, eenvoudig en goedkoop te zijn. De overeenkomst
      vermeldt de wijze waarop geschillenprocedures aanhangig kunnen worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel3
  - number: '3.3'
    text: Op een overeenkomst tot levering van warmte is Nederlands recht van toepassing. Elk andersluidend beding is nietig.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel3
  - number: '3.4'
    text: |-
      Bij ministeriële regeling wordt de hoogte vastgesteld van de compensatie bij een ernstige storing in de levering
      van warmte, bedoeld in het eerste lid, onder d, die voor storingen van verschillende tijdsduur verschillend kan
      worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel3
  - number: '4.1'
    text: |-
      De leverancier stelt al hetgeen redelijkerwijs in zijn vermogen ligt in het werk om afsluiting dan wel onderbreking
      van de levering van warmte te voorkomen, of indien een onderbreking van de levering van warmte optreedt, deze
      zo snel mogelijk te verhelpen. Afsluiting van een verbruiker wordt in het bijzonder voorkomen in de periode van
      1 oktober tot 1 april van enig jaar.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel4
  - number: '4.2'
    text: |-
      De leverancier stelt een verbruiker tenminste drie dagen van tevoren op de hoogte van door hem geplande
      werkzaamheden waarbij de levering van warmte aan de verbruiker moet worden onderbroken.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel4
  - number: '4.3'
    text: |-
      Bij ministeriële regeling worden regels gesteld over afsluiting van de levering van een verbruiker van warmte
      alsmede over preventieve maatregelen om de afsluiting van een verbruiker waar mogelijk te voorkomen.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel4
  - number: '5.1'
    text: |-
      De Autoriteit Consument en Markt stelt de maximumprijs vast die een leverancier ten hoogste zal berekenen voor de
      levering van warmte. Het besluit tot vaststelling van een maximumprijs wordt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel5
  - number: '5.2'
    text: 'De maximumprijs:'
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel5
  - number: 5.2.a
    text: |-
      is gebaseerd op de integrale kosten die een verbruiker zou moeten maken voor het verkrijgen van dezelfde
      hoeveelheid warmte bij het gebruik van gas als energiebron. Deze kosten worden bepaald met de rendementsmethode;
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel5
  - number: 5.2.b
    text: |-
      is opgebouwd uit een gebruiksafhankelijk deel, uitgedrukt in een bedrag in euro per gigajoule, en een
      gebruiksonafhankelijk deel uitgedrukt in een bedrag in euro.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel5
  - number: '5.3'
    text: |-
      De maximumprijs treedt in werking op een door de Autoriteit Consument en Markt te bepalen datum en geldt
      tot 1 januari van het jaar volgend op de datum van inwerkingtreding van het besluit tot vaststelling van
      de maximumprijs. Indien op 1 januari de maximumprijs voor dat jaar nog niet is vastgesteld, geldt de laatst
      vastgestelde maximumprijs tot de datum van inwerkingtreding van het besluit tot vaststelling van de maximumprijs
      voor het volgende jaar.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel5
  - number: '5.4'
    text: |-
      Na de inwerkingtreding van het besluit tot vaststelling van de maximumprijs, bedoeld in het derde lid, worden de
      prijzen voor levering van warmte die hoger zijn dan de maximumprijs van rechtswege gesteld op die maximumprijs.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel5
  - number: '5.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de elementen en
      wijze van berekening van de maximumprijs, bedoeld in het eerste lid. De voordracht voor deze algemene maatregel
      van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is
      overgelegd.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel5
  - number: '6.1'
    text: |-
      Indien door een leverancier bij een individuele afnemer een eenmalige aansluitbijdrage in rekening wordt
      gebracht voor een onvoorziene aansluiting op een bestaand warmtenet, bedraagt deze bijdrage maximaal hetgeen een
      gasverbruiker zou bijdragen in de situatie waarbij sprake is van aansluiting op een gasnet.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel6
  - number: '6.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de aansluitbijdrage en de
      toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel6
  - number: '7.1'
    text: |-
      De Autoriteit Consument en Markt verzamelt, analyseert en bewerkt inlichtingen en gegevens met betrekking tot de
      ontwikkeling van de rendementen in de warmteleveringsmarkt. De Autoriteit Consument en Markt brengt binnen twee
      jaar na de inwerkingtreding van deze wet, en vervolgens telkens na twee jaar aan Onze Minister verslag uit van
      de monitoring.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel7
  - number: '8.1'
    text: |-
      Een leverancier heeft tot taak er zorg voor te dragen dat binnen een redelijke termijn en tegen redelijke tarieven
      en voorwaarden aan verbruikers een warmtewisselaar ter beschikking wordt gesteld door middel van verhuur wanneer:
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel8
  - number: 8.1.a
    text: een bestaande warmtewisselaar dient te worden vervangen;
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel8
  - number: 8.1.b
    text: een nieuwe warmtewisselaar wordt geïnstalleerd in een nieuw gebouw.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel8
  - number: '8.2'
    text: |-
      Een leverancier heeft tot taak er zorg voor te dragen dat binnen een redelijke termijn aan verbruikers een
      individuele meter ter beschikking wordt gesteld door middel van verhuur die het actuele warmteverbruik kan
      weergeven en die informatie kan geven over de tijd waarin sprake was van daadwerkelijk verbruik, wanneer:
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel8
  - number: 8.2.a
    text: |-
      een verbruiker hierom vraagt, tenzij het ter beschikking stellen technisch onmogelijk is of financieel niet
      redelijk is;
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel8
  - number: 8.2.b
    text: |-
      een bestaande meter wordt vervangen, tenzij het ter beschikking stellen technisch onmogelijk is of niet
      kostenefficiënt is in verhouding tot de geraamde potentiële besparingen op lange termijn;
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel8
  - number: 8.2.c
    text: een nieuwe aansluiting wordt gemaakt in een nieuw gebouw;
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel8
  - number: 8.2.d
    text: een gebouw ingrijpend wordt gerenoveerd.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel8
  - number: '8.3'
    text: |-
      Indien een meetinrichting die op afstand uitleesbaar is door een leverancier aan een verbruiker ter beschikking
      wordt gesteld, kan die verbruiker deze meter weigeren. In dat geval wordt door de leverancier een niet op afstand
      uitleesbare meter ter beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel8
  - number: '8.4'
    text: |-
      Een leverancier leest meetgegevens van een verbruiker, die beschikt over een meetinrichting die op afstand
      uitleesbaar is, niet op afstand uit indien de verbruiker hierom verzoekt.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel8
  - number: '8.5'
    text: |-
      Het tarief voor de meting van het warmteverbruik wordt vastgesteld op basis van het gewogen gemiddelde van de
      meettarieven voor G6 aansluitingen van de gasmeter van de netbeheerders van de gastransportnetten niet zijnde de
      netbeheerder van het landelijk gastransportnet, voor het jaar t.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel8
  - number: '8.7'
    text: |-
      Het is anderen dan de desbetreffende leverancier verboden een taak uit te voeren als bedoeld in het eerste en
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel8
  - number: 8a.1
    text: |-
      Indien de leverancier de aan de verbruiker in rekening te brengen kosten voor de levering van warmte niet baseert
      op een individuele warmtemeter als bedoeld in [artikel 8][ref1], baseert hij, onverminderd artikel 8, tweede
      lid, de kosten met inachtneming van [artikel 2, vierde lid][ref2], op individuele warmtekostenverdelers die het
      warmteverbruik van elke radiator meten, tenzij de installatie daarvan niet kostenefficiënt is.


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0033729#Artikel2
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0033729
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 8a.2
    text: |-
      Indien de leverancier de aan de verbruiker in rekening te brengen kosten voor de levering van warmte niet baseert
      op een individuele warmtemeter of individuele warmtekostenverdelers, baseert hij de kosten met inachtneming van
      [artikel 2, vierde lid][ref1], op een voor alle verbruikers inzichtelijke kostenverdeelsystematiek.


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel2
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 8a.3
    text: |-
      De kostenverdeelsystematiek, bedoeld in het tweede lid, gaat uit van een binnen de technische en financiële
      mogelijkheden zo nauwkeurig mogelijke benadering van het werkelijke aandeel van het verbruik van de individuele
      verbruiker.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel8a
  - number: 8a.4
    text: |-
      In afwijking van het derde lid kunnen als onderdeel van de kostenverdeelsystematiek kosten van verbruik in het
      gemeenschappelijk belang en redelijke kosten voor uitvoering van de kostenverdeelsystematiek zelf aan individuele
      verbruikers worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel8a
  - number: 8a.5
    text: |-
      De warmtekostenverdelers en andere technische voorzieningen voor benadering, meting of registratie van het aandeel
      van de individuele verbruiker in het totale verbruik, worden aan de hand van daarvoor gangbare technische normen
      geïnstalleerd en toegepast.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel8a
  - number: 8a.6
    text: |-
      Op daartoe strekkend verzoek van één of meer verbruikers laat de leverancier éénmalig door een onafhankelijke,
      voor zowel verbruiker als leverancier aanvaardbare deskundige onderzoek uitvoeren naar de mate waarin de
      kostenverdeelsystematiek voor die verbruiker of verbruikers, voldoet aan het eerste tot en met vierde lid. De helft
      van de kosten van dit onderzoek komt voor rekening van de leverancier.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel8a
  - number: 8a.7
    text: |-
      Op daartoe strekkend verzoek van één of meer verbruikers laat de leverancier de werking van de
      warmtekostenverdelers controleren door een onafhankelijke, voor zowel verbruiker als leverancier aanvaardbare
      deskundige. De toedeling van de kosten van dit onderzoek tussen verbruikers en leverancier vindt plaats op basis
      van de conclusie van het onderzoek.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel8a
  - number: 8a.8
    text: |-
      Indien de verbruiker of verbruikers en de leverancier niet tot overeenstemming komen over de keuze van een voor
      beiden aanvaardbare deskundige dan kan de Nederlandse Mededingingsautoriteit worden gevraagd om deze aan te wijzen.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel8a
  - number: 8a.9
    text: De leverancier verleent aan het onderzoek de nodige medewerking.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel8a
  - number: 8a.10
    text: |-
      Indien bestaande technische voorzieningen als bedoeld in het vijfde lid worden vervangen, zorgt de leverancier dat
      de nieuwe voorzieningen van een type zijn waarvan een onafhankelijke deskundige aan de hand van daarvoor gangbare
      technische normen de deugdelijkheid heeft vastgesteld.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel8a
  - number: '9.1'
    text: Het is verboden zonder vergunning warmte te leveren aan verbruikers.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel9
  - number: '9.2'
    text: 'Het verbod, bedoeld in het eerste lid, geldt niet ten aanzien van een leverancier die:'
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel9
  - number: 9.2.a
    text: warmte levert aan ten hoogste 10 verbruikers tegelijk,
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel9
  - number: 9.2.b
    text: per jaar niet meer warmte levert dan 10.000 gigajoules, of
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel9
  - number: 9.2.c
    text: de verhuurder of de eigenaar is van het gebouw, ten behoeve waarvan de warmte wordt geleverd.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel9
  - number: '10.1'
    text: 'Onze Minister verleent op aanvraag een vergunning indien de aanvrager genoegzaam aantoont dat hij:'
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel10
  - number: 10.1.a
    text: |-
      beschikt over de benodigde organisatorische, financiële en technische kwaliteiten voor een goede uitvoering van
      zijn taak;
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel10
  - number: 10.1.b
    text: redelijkerwijs in staat kan worden geacht de verplichtingen als opgenomen in dit hoofdstuk na te komen.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel10
  - number: '10.2'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de inhoud van en de procedure
      voor aanvraag van een vergunning en de criteria, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel10
  - number: '10.3'
    text: |-
      Onze Minister kan voorschriften en beperkingen verbinden aan een vergunning. Aan de vergunning wordt in ieder
      geval een voorschrift verbonden omtrent de minimum- en maximumtemperatuur van de te leveren warmte. De minimum- en
      maximumtemperatuur van de te leveren warmte kan voor ieder warmtenet of deel van een warmtenet verschillen.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel10
  - number: '10.4'
    text: Onze Minister kan de aan een vergunning verbonden voorschriften of beperkingen wijzigen.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel10
  - number: '10.5'
    text: |-
      Een vergunning kan slechts worden overgedragen met toestemming van Onze Minister. Het eerste tot en met het vierde
      lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel10
  - number: '11.1'
    text: |-
      Onze Minister kan een vergunning intrekken. Onze Minister gaat slechts tot intrekking van de vergunning over, voor
      zover het belang van een betrouwbare levering van warmte tegen redelijke voorwaarden en een goede kwaliteit van de
      dienstverlening aan verbruikers zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel11
  - number: '11.2'
    text: 'Onze Minister kan een vergunning intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel11
  - number: 11.2.a
    text: de houder van de vergunning dit verzoekt;
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel11
  - number: 11.2.b
    text: de vergunninghouder de aan de vergunning verbonden voorschriften of opgelegde beperkingen niet nakomt;
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel11
  - number: 11.2.c
    text: |-
      de vergunninghouder de opgedragen voorzieningen, bedoeld in [artikel 12b, tweede lid][ref1], niet treft;


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel12b
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: 12b
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 11.2.d
    text: |-
      de vergunninghouder bij de aanvraag onjuiste of onvolledige gegevens heeft verstrekt en de verstrekking van juiste
      en volledige gegevens tot een andere beschikking op de aanvraag zou hebben geleid;
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel11
  - number: 11.2.e
    text: |-
      de vergunninghouder naar het oordeel van Onze Minister om andere redenen niet langer in staat moet worden geacht de
      vergunde activiteit of in de vergunning opgenomen voorschriften na te komen.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel11
  - number: '11.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de criteria voor het
      intrekken van een vergunning en de procedure bij intrekking van een vergunning. De voordracht voor deze algemene
      maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-
      Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel11
  - number: '12.1'
    text: Een vergunninghouder biedt verbruikers een ruime keuze uit betalingswijzen.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel12
  - number: '12.2'
    text: |-
      De vergunninghouder zorgt jegens verbruikers voor een goede bereikbaarheid. De vergunninghouder handelt
      correspondentie van verbruikers binnen tien werkdagen af. Indien een oplossing in deze periode niet mogelijk is,
      ontvangt de verbruiker binnen vijf werkdagen bericht binnen welke termijn een adequate reactie kan worden verwacht.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel12
  - number: '12.3'
    text: |-
      De vergunninghouder gebruikt aan hem verstrekte gegevens over verbruikers uitsluitend voor het uitvoeren van de in
      deze wet aan de vergunninghouder opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel12
  - number: 12a.1
    text: |-
      De vergunninghouder voert een afzonderlijke boekhouding met betrekking tot de levering van warmte en, indien van
      toepassing, voor de levering van koude.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel12a
  - number: 12a.2
    text: |-
      De vergunninghouder publiceert een jaarrekening en een jaarverslag. Het jaarverslag bevat betrouwbare en op een
      inzichtelijke wijze vorm gegeven informatie over de door de vergunninghouder bij verbruikers in rekening gebrachte
      prijs en omtrent de integrale kosten en opbrengsten die verband houden met de levering van warmte. De in het
      jaarverslag opgenomen informatie is voorzien van een accountantsverklaring.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel12a
  - number: 12a.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de toepassing van het eerste
      en tweede lid en [artikel 2, zesde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel2
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 12b.1
    text: |-
      Een leverancier of een producent, die voornemens is de levering of de productie van warmte te beëindigen dan wel
      redelijkerwijs moet voorzien dat hij niet langer aan zijn wettelijke verplichtingen zal kunnen voldoen, meldt dit
      onverwijld aan Onze Minister. Onze Minister treedt in overleg met de leverancier of de producent die de melding
      heeft gedaan alsmede met de overige bij de levering van warmte betrokken personen.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel12b
  - number: 12b.2
    text: |-
      Onze Minister kan, indien hem blijkt dat een leverancier in onvoldoende mate kan of zal kunnen voorzien in de
      levering van warmte, de leverancier opdragen voorzieningen te treffen teneinde zeker te stellen dat de levering van
      warmte, in voldoende mate plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel12b
  - number: 12b.3
    text: |-
      Onze Minister is bevoegd tot toepassing van een last onder bestuursdwang ter handhaving van een opdracht als
      bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel12b
  - number: 12b.4
    text: |-
      Indien de leverancier niet voldoet aan een opdracht als bedoeld in het tweede lid of indien naar het oordeel
      van Onze Minister door de bedrijfsvoering van deze leverancier de continuïteit of de betrouwbaarheid van de
      warmtelevering in gevaar komt en onverwijld ingrijpen noodzakelijk is, kan Onze Minister de leverancier aanzeggen
      dat hij vanaf een bepaald tijdstip voor een bepaalde termijn de opdrachten dient op te volgen die aan hem worden
      verstrekt door een door Onze Minister aangewezen persoon.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel12b
  - number: 12b.5
    text: |-
      Bij de aanzegging, bedoeld in het vierde lid, geeft Onze Minister aan ter bescherming van welk belang de aanzegging
      geschiedt. De aangewezen persoon verstrekt uitsluitend opdrachten ter bescherming van dit belang. Bij de aanzegging
      kunnen voorschriften en beperkingen worden gesteld aan de te geven opdrachten.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel12b
  - number: 12b.6
    text: De leverancier verschaft de door Onze Minister aangewezen persoon desgevraagd alle medewerking.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel12b
  - number: 12b.7
    text: |-
      Voor schade ten gevolge van handelingen die zijn verricht in strijd met een opdracht als bedoeld in het vierde lid,
      zijn bestuurders persoonlijk aansprakelijk tegenover de leverancier.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel12b
  - number: 12c.1
    text: |-
      Onze Minister kan een of meer vergunninghouders aanwijzen als noodleverancier om warmte te leveren aan door hem
      nader aangeduide verbruikers.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel12c
  - number: 12c.2
    text: De noodleverancier krijgt het beheer over het warmtenet en verricht correctieve onderhoudswerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel12c
  - number: 12c.3
    text: |-
      Onze Minister kan voorwaarden en beperkingen verbinden aan de aanwijzing, bedoeld in het eerste lid, en stelt bij
      de aanwijzing een redelijke vergoeding vast voor de uitvoering van de opgedragen taak.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel12c
  - number: 12c.4
    text: |-
      Onze Minister kan een producent opdragen warmte te produceren en deze warmte ter beschikking te stellen aan een
      door hem aangewezen noodleverancier.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel12c
  - number: 12c.5
    text: |-
      Onze Minister kan voorwaarden en beperkingen verbinden aan de opdracht, bedoeld in het vierde lid, en stelt bij de
      opdracht een redelijke vergoeding vast voor de uitvoering van de opgedragen taak.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel12c
  - number: 12c.6
    text: |-
      Een ieder is verplicht medewerking te verlenen aan de noodleverancier, bedoeld in het eerste lid, of de producent,
      bedoeld in het vierde lid, voor zover dit redelijkerwijs van hem kan worden verlangd.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel12c
  - number: 12d.1
    text: |-
      Onze Minister kan een netbeheerder als bedoeld in [artikel 2, eerste lid, van de Gaswet][ref1], opdracht geven
      tot het aanleggen van een gastransportnet in het door hem aangewezen gebied. Verbruikers ontvangen een gehele of
      gedeeltelijke tegemoetkoming in verband met de kosten van de aansluiting op het gastransportnet.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel2
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel12d
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '2'
  - number: 12d.2
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de hoogte van de vergoeding, bedoeld in het eerste lid
      en over de wijze waarop de betrokken verbruikers een gehele of gedeeltelijke tegemoetkoming ontvangen, waarbij de
      hoogte van de tegemoetkoming voor verschillende groepen verbruikers verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel12d
  - number: 12d.3
    text: |-
      De opdracht, bedoeld in het eerste lid, wordt niet gegeven dan nadat Onze Minister onderzocht heeft of anders dan
      door aanleg van een gastransportnet voorzien kan worden in een volwaardig alternatief voor het warmtenet. Indien
      uit dit onderzoek blijkt dat een volwaardig alternatief beschikbaar is dat uit oogpunt van duurzaamheid, kosten of
      een ander publiek belang de voorkeur verdient bevordert Onze Minister de totstandkoming van dat alternatief.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel12d
  - number: '13.1'
    text: |-
      Onze Minister kan van een producent, een leverancier of een verbruiker de gegevens en inlichtingen verlangen
      die hij nodig heeft voor de uitvoering van deze wet en voor het opstellen van het energierapport, bedoeld in
      [artikel 2 van de Elektriciteitswet 1998][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel2
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '2'
  - number: '13.2'
    text: |-
      Degene aan wie een verzoek is gedaan om gegevens en inlichtingen te verstrekken, is verplicht binnen de door Onze
      Minister te stellen redelijke termijn alle medewerking te verlenen die hij redelijkerwijs kan vorderen bij de
      uitoefening van zijn bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel13
  - number: '13.3'
    text: |-
      Onze Minister gebruikt gegevens of inlichtingen welke hij heeft verkregen in verband met enige werkzaamheid ten
      behoeve van de uitvoering van een van zijn taken op grond van deze wet uitsluitend voor de uitoefening van die
      taak.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel13
  - number: '14.1'
    text: |-
      [Artikel 13, eerste en tweede lid][ref1], is van overeenkomstige toepassing op de Autoriteit Consument en Markt
      voor zover zij inlichtingen en gegevens nodig heeft voor de uitvoering van haar taken op grond van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel13
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '13'
        hoofdstuk: '3'
  - number: '14.2'
    text: |-
      De Autoriteit Consument en Markt kan van een gasbedrijf als bedoeld in
      [artikel 1, onderdeel j, van de Gaswet][ref1] verlangen dat deze hem inzage geeft in gegevens en bescheiden,
      onderscheidenlijk hem gegevens en inlichtingen verstrekt, die zij nodig heeft voor de uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel1
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '1'
  - number: '15.1'
    text: |-
      De Autoriteit Consument en Markt is belast met taken ter uitvoering van deze wet en het toezicht op de naleving van
      deze wet.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel15
  - number: '15.2'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van de
      Autoriteit Consument en Markt aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel15
  - number: '15.3'
    text: Van een besluit als bedoeld in het tweede lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel15
  - number: '16'
    text: |-
      De Autoriteit Consument en Markt kan bij een producent, leverancier of verbruiker metingen verrichten of doen
      verrichten. De producent, leverancier of verbruiker gedoogt dat de metingen in zijn leidingen, installaties of
      hulpmiddelen worden verricht.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel16
  - number: '17.1'
    text: De Autoriteit Consument en Markt kan een bindende aanwijzing geven in verband met de naleving van deze wet.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel17
  - number: '17.2'
    text: |-
      Van een beschikking als bedoeld in het eerste lid wordt mededeling gedaan in de Staatscourant. Gegevens die
      ingevolge [artikel 10 van de Wet openbaarheid van bestuur][ref1] niet voor verstrekking in aanmerking komen,
      worden niet ter inzage gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '18.1'
    text: |-
      De Autoriteit Consument en Markt kan in geval van overtreding van het bepaalde bij of krachtens deze wet de
      overtreder een last onder dwangsom opleggen.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel18
  - number: '18.2'
    text: |-
      Aan een last onder dwangsom kunnen voorschriften worden verbonden inzake het verstrekken van gegevens aan de
      Autoriteit Consument en Markt.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel18
  - number: '18.3'
    text: |-
      De bevoegdheid tot het opleggen van een last onder dwangsom vervalt vijf jaren nadat de overtreding heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel18
  - number: '18.4'
    text: |-
      Indien de Autoriteit Consument en Markt vaststelt dat een overtreding, bedoeld in het eerste lid, is begaan, maakt
      zij daarvan een rapport op.
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel18
  - number: '18.5'
    text: |-
      [Afdeling 5.4.2 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling5.4.2
    url: https://wetten.overheid.nl/BWBR0033729/2014-03-15#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 5.4.2
  - number: '18.6'
    text: |-
      De Autoriteit Consument en Markt kan in geval van overtreding van het bepaalde bij of krachtens de
      [artikelen 2][ref1], [5, eerste en vierde lid][ref2], [9, eerste lid][ref3], [13][ref4], [14][ref5], [17][ref6]
      en [40][ref7] alsmede [artikel 5:20 van de Algemene wet bestuursrecht][ref8], de overtreder per overtreding een
      bestuurlijke boete opleggen van ten hoogste € 450.000, of, indien dat meer is, 1% van de omzet van de overtreder in
      het boekjaar voorafgaande aan de beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033729#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0033729#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0033729#Artikel13
      [ref5]: https://wetten.overheid.nl/BWBR0033729#Artikel14
      [ref6]: https://wetten.overheid.nl/BWBR0033729#Artikel17
      [ref7]: https://wetten.overheid.nl/BWBR0033729#Artikel40
