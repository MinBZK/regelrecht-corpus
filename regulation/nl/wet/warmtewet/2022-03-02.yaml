        artikel: 8a
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref3
        bwb_id: BWBR0033729
        artikel: 8b
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '2.1'
    text: |-
      Een leverancier draagt zorg voor een betrouwbare levering van warmte tegen redelijke voorwaarden en met
      inachtneming van een goede kwaliteit van dienstverlening.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel2
  - number: '2.2'
    text: 'Een leverancier verstrekt de verbruikers:'
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel2
  - number: 2.2.a
    text: |-
      ten minste eenmaal per jaar een volledige en voldoende gespecificeerde nota met betrekking tot de door hem
      geleverde diensten, en
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel2
  - number: 2.2.b
    text: een volledige en voldoende gespecificeerde nota na beëindiging van de leveringsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel2
  - number: '2.3'
    text: 'Ten aanzien van de levering van warmte brengt de leverancier ten hoogste in rekening:'
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel2
  - number: 2.3.a
    text: |-
      de maximumprijs voor de levering van warmte, bedoeld in [artikel 5, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel5
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.3.b
    text: |-
      het maximumtarief voor het in gebruik nemen van de afleverset voor warmte, bedoeld in
      [artikel 8, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel8
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.3.c
    text: |-
      de eenmalige aansluitbijdrage, bedoeld in [artikel 6, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel6
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.3.d
    text: |-
      het tarief voor afsluiting, bedoeld in [artikel 4a, eerste lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel4a
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: 4a
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.3.e
    text: |-
      het tarief voor de meting van het warmteverbruik door middel van individuele meters, bedoeld in
      [artikel 8, vijfde lid][ref1], de redelijke kosten voor de meting van het warmteverbruik door middel van
      individuele warmtekostenverdelers als bedoeld in [artikel 8a, eerste lid][ref2], of de redelijke kosten voor het
      berekenen van het warmteverbruik door middel van een kostenverdeelsystematiek, als bedoeld in artikel 8a, tweede
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0033729#Artikel8a
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0033729
        artikel: 8a
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '2.4'
    text: Een leverancier onthoudt zich van iedere vorm van ongerechtvaardigd onderscheid jegens zijn verbruikers.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel2
  - number: '2.5'
    text: |-
      Een leverancier stelt verbruikers op toereikende wijze in kennis van elke wijziging van de prijzen voor levering
      van warmte en van elk voornemen tot wijziging van de aan de leveringsovereenkomst verbonden voorwaarden voor
      levering van warmte.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel2
  - number: '2.6'
    text: |-
      De boekhouding van een leverancier bevat betrouwbare en op een inzichtelijke wijze vorm gegeven informatie over de
      integrale kosten en opbrengsten die verband houden met de levering van warmte en het verrichten van de aansluiting.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel2
  - number: '2.7'
    text: |-
      Een leverancier houdt een storingsregistratie bij betreffende de levering van warmte en publiceert deze jaarlijks
      op geschikte wijze.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel2
  - number: '2.8'
    text: |-
      Een producent aangesloten op een warmtenet is verplicht op verzoek van de leverancier te onderhandelen over het
      beschikbaar stellen van warmte tegen redelijke prijzen en voorwaarden.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel2
  - number: '3.1'
    text: |-
      Een in Nederland gevestigde leverancier verstrekt een verbruiker, in aanvulling op de gegevens bedoeld in
      [artikel 230m, eerste lid, van Boek 6 van het Burgerlijk Wetboek][ref1], voordat de verbruiker gebonden is aan een
      overeenkomst tot levering van warmte op duidelijke en begrijpelijke wijze de volgende informatie:


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel230m
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: 230m
  - number: 3.1.a
    text: |-
      een duidelijke en volledige omschrijving van de te leveren goederen en diensten en de overeengekomen
      kwaliteitsniveaus daarvan, welke in ieder geval betrekking hebben op de minimum- en maximumtemperatuur van de te
      leveren warmte, alsmede de prijzen en voorwaarden waaronder deze goederen en diensten worden geleverd;
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel3
  - number: 3.1.b
    text: |-
      een omschrijving van de terugbetalingsregelingen als de geleverde goederen en diensten niet aan de overeengekomen
      kwaliteitsniveaus voldoen, en
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel3
  - number: 3.1.c
    text: |-
      de eisen waar de binneninstallatie van een verbruiker aan moet voldoen om veilig gebruik te kunnen maken van de
      door de leverancier geleverde warmte.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel3
  - number: '3.2'
    text: |-
      [Artikel 230m, eerste lid, van boek 6 van het Burgerlijk Wetboek][ref1] is van overeenkomstige toepassing op een
      overeenkomst tot levering van warmte tussen een leverancier een verbruiker die handelt in de uitoefening van een
      beroep of bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel230m
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: 230m
  - number: '3.3'
    text: |-
      [Artikel 230v van Boek 6 van het Burgerlijk Wetboek][ref1] is van overeenkomstige toepassing op de
      informatieverplichtingen voor leveranciers bedoeld in het eerste en het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel230v
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: 230v
  - number: 3a.1
    text: |-
      De leverancier keert aan een verbruiker een compensatie uit bij een ernstige storing in de levering van warmte
      waarvan de oorzaak gelegen is in:
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel3a
  - number: 3a.1.a
    text: het warmtenet van de leverancier of de netbeheerder;
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel3a
  - number: 3a.1.b
    text: de afleverset voor warmte, indien deze het eigendom is van de leverancier;
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel3a
  - number: 3a.1.c
    text: de aansluiting, of
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel3a
  - number: 3a.1.d
    text: het inpandig leidingstelsel van de gebouweigenaar.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel3a
  - number: 3a.2
    text: |-
      De leverancier is niet verplicht tot het uitkeren van een compensatie als bedoeld in het eerste lid, indien de
      storing, bedoeld in dat lid:
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel3a
  - number: 3a.2.a
    text: het gevolg is van een extreme situatie die niet aan de leverancier of netbeheerder kan worden toegerekend, of
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel3a
  - number: 3a.2.b
    text: |-
      minder dan 24 uur duurt en in een periode van 12 maanden voorafgaand aan de storing zich geen storingen hebben
      voorgedaan in:
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel3a
  - number: 3a.2.b.i
    text: hetzelfde warmtenet van de leverancier of de netbeheerder,
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel3a
  - number: 3a.2.b.ii
    text: dezelfde afleverset voor warmte, indien deze het eigendom is van de leverancier;
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel3a
  - number: 3a.2.b.iii
    text: dezelfde aansluiting, of
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel3a
  - number: 3a.2.b.iv
    text: hetzelfde inpandig leidingstelsel van de gebouweigenaar.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel3a
  - number: 3a.3
    text: 'Bij ministeriële regeling worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel3a
  - number: 3a.3.a
    text: het bestaan van een ernstige storing als bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel3a
  - number: 3a.3.b
    text: |-
      de hoogte van de compensatie bij een ernstige storing in de levering van warmte als bedoeld in het eerste lid, die
      voor storingen van verschillende tijdsduur verschillend kan worden vastgesteld;
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel3a
  - number: 3a.3.c
    text: |-
      het moment van aanvang en beëindiging van de verplichting tot het betalen van compensatie bij een ernstige storing
      in de levering van warmte als bedoeld in het eerste lid, en
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel3a
  - number: 3a.3.d
    text: |-
      het bestaan van een extreme situatie die niet aan de leverancier of verbruiker kan worden toegerekend als bedoeld
      in het tweede lid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel3a
  - number: 3b.1
    text: |-
      Verbruikers kunnen geschillen die voortvloeien uit een overeenkomst tot levering van warmte, onverminderd de
      bevoegdheid van de burgerlijke rechter, voorleggen aan een onafhankelijke geschillencommissie.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel3b
  - number: 3b.2
    text: |-
      De procedure bij de geschillencommissie, bedoeld in het eerste lid, dient snel, transparant, eenvoudig en goedkoop
      te zijn.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel3b
  - number: 3c.1
    text: Een overeenkomst tot levering van warmte kan door een verbruiker door middel van een opzegging worden ontbonden.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel3c
  - number: 3c.2
    text: 'Aan een opzegging hoeft door de leverancier geen gevolg te worden gegeven in gevallen waarin:'
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel3c
  - number: 3c.2.a
    text: het technisch niet mogelijk is de levering van warmte aan die verbruiker geheel te beëindigen, of
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel3c
  - number: 3c.2.b
    text: beëindiging van de levering leidt tot aanzienlijk blijvend nadeel voor een andere verbruiker.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel3c
  - number: 3c.3
    text: |-
      Een leverancier reageert schriftelijk op een opzegging als bedoeld in het eerste lid, en motiveert daarin in
      voorkomend geval waarom de beëindiging niet kan plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel3c
  - number: 3d.1
    text: |-
      Een gebouweigenaar die eigenaar is van een inpandig leidingstelsel dat wordt gebruikt voor het leveren van warmte
      aan verbruikers is verplicht:
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel3d
  - number: 3d.1.a
    text: |-
      het inpandig leidingstelsel en de individuele aansluiting van de verbruiker op het inpandig leidingstelsel zodanig
      te onderhouden dat betrouwbare levering van warmte gewaarborgd is, tenzij de gebouweigenaar en de leverancier
      hierover andere afspraken maken, en
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel3d
  - number: 3d.1.b
    text: |-
      medewerking te verlenen aan het verzoek van een leverancier om een verbruiker die is aangesloten op zijn inpandig
      leidingstelsel af te sluiten van het inpandig leidingstelsel door:
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel3d
  - number: 3d.1.b.i
    text: zorg te dragen voor de afsluiting van de verbruiker van het inpandig leidingstelsel, of
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel3d
  - number: 3d.1.b.ii
    text: |-
      de leverancier toestemming te geven zorg te dragen voor de afsluiting van de verbruiker van het inpandig
      leidingstelsel.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel3d
  - number: 3d.2
    text: |-
      Wanneer zich een storing als bedoeld in [artikel 3a, eerste lid, onderdeel d][ref1], voordoet in het inpandig
      leidingstelsel van de gebouweigenaar:


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel3a
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel3d
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: 3a
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3d.2.a
    text: |-
      ontvangt de verbruiker een compensatie als bedoeld in [artikel 3a, eerste lid][ref1], van de leverancier, en


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel3a
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel3d
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: 3a
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3d.2.b
    text: |-
      vergoedt de gebouweigenaar de leverancier de kosten van de op grond van onderdeel a aan de verbruiker betaalde
      compensatie, tenzij de gebouweigenaar en de leverancier op grond van het eerste lid, onderdeel a, afspraken hebben
      gemaakt over het onderhoud van het inpandig leidingstelsel en de individuele aansluiting van de verbruiker daarop
      die tot gevolg hebben dat de leverancier verantwoordelijk is voor het onderhoud van het inpandig leidingstelsel en
      de individuele aansluiting van de verbruiker daarop.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel3d
  - number: '4.1'
    text: |-
      De leverancier stelt al hetgeen redelijkerwijs in zijn vermogen ligt in het werk om afsluiting dan wel onderbreking
      van de levering van warmte te voorkomen, of indien een onderbreking van de levering van warmte optreedt, deze
      zo snel mogelijk te verhelpen. Afsluiting van een verbruiker wordt in het bijzonder voorkomen in de periode van
      1 oktober tot 1 april van enig jaar.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel4
  - number: '4.2'
    text: |-
      De leverancier stelt een verbruiker tenminste drie dagen van tevoren op de hoogte van door hem geplande
      werkzaamheden waarbij de levering van warmte aan de verbruiker moet worden onderbroken.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel4
  - number: '4.3'
    text: |-
      Bij ministeriële regeling worden regels gesteld over afsluiting van de levering van een verbruiker van warmte
      alsmede over preventieve maatregelen om de afsluiting van een verbruiker waar mogelijk te voorkomen.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel4
  - number: 4a.1
    text: |-
      Indien een leverancier een aansluiting afsluit van een warmtenet of een inpandig leidingstelsel of gedeeltelijk
      afsluit van een systeem als bedoeld in [artikel 5, vierde lid][ref1], brengt hij daarvoor ten hoogste een door de
      Autoriteit Consument en Markt vast te stellen tarief in rekening.


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel5
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 4a.2
    text: |-
      Het tarief, bedoeld in het eerste lid, kan verschillen voor verschillende situaties, afhankelijk van de voor die
      situaties benodigde inspanning van de leverancier.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel4a
  - number: 4a.3
    text: |-
      Indien de afsluiting van een inpandig leidingstelsel, bedoeld in [artikel 3d, eerste lid, onderdeel b][ref1], wordt
      uitgevoerd door de gebouweigenaar die eigenaar is van het inpandig leidingstelsel waarop de binneninstallatie van
      de verbruiker is aangesloten betaalt de leverancier de gebouweigenaar het tarief, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel3b
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: 3b
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 4a.4
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel4a
  - number: 4a.4.a
    text: |-
      de berekening van de hoogte van het tarief voor afsluiting van een aansluiting van een warmtenet of een inpandig
      leidingstelsel in de verschillende situaties bedoeld in het tweede lid;
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel4a
  - number: 4a.4.b
    text: |-
      de kosten die een leverancier in rekening kan brengen voor het gedeeltelijk afsluiten van een aansluiting op
      systemen als bedoeld in [artikel 5, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel5
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '5.1'
    text: |-
      De Autoriteit Consument en Markt stelt de maximumprijs vast die een leverancier ten hoogste zal berekenen voor
      de levering van warmte. Van het besluit tot vaststelling van een maximumprijs wordt mededeling gedaan in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel5
  - number: '5.2'
    text: 'De maximumprijs kan per aflevertemperatuur verschillen en:'
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel5
  - number: 5.2.a
    text: |-
      is gebaseerd op de integrale kosten die een verbruiker zou moeten maken voor het verkrijgen van dezelfde
      hoeveelheid warmte bij het gebruik van gas als energiebron. Deze kosten worden bepaald met de rendementsmethode;
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel5
  - number: 5.2.b
    text: |-
      is opgebouwd uit een gebruiksafhankelijk deel, uitgedrukt in een bedrag in euro per gigajoule, en een
      gebruiksonafhankelijk deel uitgedrukt in een bedrag in euro.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel5
  - number: '5.3'
    text: |-
      Het gebruiksonafhankelijk deel van de maximumprijs voor aansluitingen van meer dan 100 kilowatt kan verschillen van
      het gebruiksonafhankelijk deel van de maximumprijs voor aansluitingen van maximaal 100 kilowatt.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel5
  - number: '5.4'
    text: |-
      In afwijking van het eerste lid en het tweede lid, onderdeel a, wordt een maximumprijs voor gebruik van een bij
      algemene maatregel van bestuur aangewezen systeem dat mede dient voor levering van warmte vastgesteld met een bij
      die maatregel vast te stellen methode.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel5
  - number: '5.5'
    text: |-
      De maximumprijs, bedoeld in het eerste en vierde lid, treedt in werking op een door de Autoriteit Consument en
      Markt te bepalen datum en geldt tot 1 januari van het jaar volgend op de datum van inwerkingtreding van het besluit
      tot vaststelling van de maximumprijs. Indien op 1 januari de maximumprijs voor dat jaar nog niet is vastgesteld,
      geldt de laatst vastgestelde maximumprijs tot de datum van inwerkingtreding van het besluit tot vaststelling van de
      maximumprijs voor het volgende jaar.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel5
  - number: '5.6'
    text: |-
      Na de inwerkingtreding van het besluit tot vaststelling van de maximumprijs, bedoeld in het eerste en vierde
      lid, worden de prijzen voor levering van warmte die hoger zijn dan de maximumprijs van rechtswege gesteld op die
      maximumprijs.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel5
  - number: '5.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de elementen
      en de wijze van berekening van de maximumprijs, bedoeld in het eerste lid, en de indeling in verschillende
      temperatuurcategorieën, op grond van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel5
  - number: '5.8'
    text: |-
      De voordracht voor de algemene maatregel van bestuur, bedoeld in het zevende lid, wordt niet eerder gedaan dan vier
      weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel5
  - number: 5a.1
    text: |-
      In afwijking van [artikel 2, derde lid, onderdeel a, onder 1°][ref1], kunnen een leverancier en een verbruiker
      overeenkomen dat aan de verbruiker een prijs in rekening wordt gebracht voor de levering van warmte die afwijkt
      van de maximumprijs, bedoeld in [artikel 5, eerste lid][ref2], indien de leverancier de verbruiker aantoonbaar een
      aanbod voor levering van warmte heeft gedaan dat in ieder geval de mogelijkheid bevat om warmte geleverd te krijgen
      tegen ten hoogste de maximumprijs, bedoeld in artikel 5, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033729#Artikel5
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0033729
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 5a.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld waaraan het aanbod, bedoeld in het
      eerste lid, moet voldoen.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel5a
  - number: '6.1'
    text: |-
      Indien door een leverancier bij een verbruiker een eenmalige aansluitbijdrage in rekening wordt gebracht voor een
      aansluiting op een warmtenet, bedraagt deze bijdrage niet meer dan een door Autoriteit Consument en Markt vast te
      stellen bedrag.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel6
  - number: '6.2'
    text: |-
      Het bedrag, bedoeld in het eerste lid, kan voor verschillende categorieën aansluitingen verschillend worden
      vastgesteld afhankelijk van de bestanddelen waarvoor de bijdrage in rekening wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel6
  - number: '6.3'
    text: Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel6
  - number: 6.3.a
    text: de verschillende categorieën, bedoeld in het tweede lid, en
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel6
  - number: 6.3.b
    text: de berekening van de hoogte van het bedrag, bedoeld in het eerste lid, per categorie.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel6
  - number: '7.1'
    text: |-
      De Autoriteit Consument en Markt verzamelt, analyseert en bewerkt inlichtingen en gegevens met betrekking tot de
      ontwikkeling van de rendementen in de warmteleveringsmarkt. De Autoriteit Consument en Markt brengt binnen twee
      jaar na de inwerkingtreding van deze wet, en vervolgens telkens na twee jaar aan Onze Minister verslag uit van
      de monitoring.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel7
  - number: '7.2'
    text: |-
      De Autoriteit Consument en Markt toetst of het rendement van een leverancier op al zijn netten gezamenlijk hoger is
      dan een door de Autoriteit Consument en Markt vast te stellen redelijk rendement.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel7
  - number: '7.3'
    text: |-
      Indien het rendement van een leverancier op al zijn netten gezamenlijk hoger is dan een door de Autoriteit
      Consument en Markt vast te stellen redelijk rendement, kan de Autoriteit Consument en Markt het meer dan redelijk
      behaalde rendement door middel van een correctiefactor laten verdisconteren in de toekomstige tarieven van die
      leverancier.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel7
  - number: '7.4'
    text: |-
      Bij beleidsregel van de Autoriteit Consument en Markt worden nadere regels gesteld ter uitvoering van de leden twee
      en drie, waarbij in ieder geval regels worden gesteld over:
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel7
  - number: 7.4.a
    text: de elementen en wijze van berekenen van het rendement van een leverancier;
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel7
  - number: 7.4.b
    text: de vaststelling van het redelijk rendement;
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel7
  - number: 7.4.c
    text: de wijze waarop en de periode waarin verdisconteerd wordt.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel7
  - number: '8.1'
    text: |-
      Een leverancier heeft, met uitzondering van gevallen waarin dit voor de levering van warmte niet noodzakelijk
      is, tot taak er zorg voor te dragen dat binnen een redelijke termijn en tegen ten hoogste een door de Autoriteit
      Consument en Markt vast te stellen tarief een afleverset voor warmte in gebruik kan worden genomen wanneer:
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8
  - number: 8.1.a
    text: een bestaande afleverset voor warmte dient te worden vervangen;
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8
  - number: 8.1.b
    text: een nieuwe afleverset voor warmte wordt geïnstalleerd in een nieuw gebouw.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8
  - number: '8.2'
    text: |-
      Een leverancier heeft tot taak er zorg voor te dragen dat binnen een redelijke termijn aan een verbruiker een
      individuele meter ter beschikking wordt gesteld door middel van verhuur die het actuele warmteverbruik kan
      weergeven.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8
  - number: '8.3'
    text: Indien een meetinrichting wordt geïnstalleerd, is deze op afstand uitleesbaar.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8
  - number: '8.4'
    text: |-
      Een leverancier leest meetgegevens van een verbruiker, die beschikt over een meetinrichting die op afstand
      uitleesbaar is, niet op afstand uit indien de verbruiker hierom verzoekt.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8
  - number: '8.5'
    text: |-
      Het tarief voor de meting van het warmteverbruik door middel van een individuele meter wordt vastgesteld op basis
      van het gewogen gemiddelde van de meettarieven voor G6 aansluitingen van de gasmeter van de netbeheerders van de
      gastransportnetten niet zijnde de netbeheerder van het landelijk gastransportnet, voor het jaar t.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8
  - number: '8.6'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8
  - number: 8.6.a
    text: |-
      de eisen waaraan een meetinrichting ten minste voldoet, waarbij ten aanzien van meetinrichtingen die op afstand
      uitleesbaar zijn in ieder geval regels worden gesteld ten aanzien van de beveiliging van meetgegevens;
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8
  - number: 8.6.b
    text: |-
      de berekening van de hoogte van het door de Autoriteit Consument en Markt vast te stellen maximumtarief voor het in
      gebruik nemen van een afleverset, en
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8
  - number: 8.6.c
    text: het vaststellen van categorieën en aanvullende functionaliteiten van afleversets.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8
  - number: '8.7'
    text: |-
      Het is anderen dan de desbetreffende leverancier verboden een taak uit te voeren als bedoeld in het eerste en
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8
  - number: '8.8'
    text: |-
      Een afleverset voor warmte ten behoeve van warmtelevering aan één verbruiker wordt door middel van verhuur tegen
      ten hoogste het voor die afleverset vastgestelde tarief, bedoeld in het eerste lid, ter beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8
  - number: '8.9'
    text: |-
      Indien een gebouw waarin zich meerdere woon- of bedrijfsruimtes bevinden verwarmd wordt met behulp van een centrale
      productieinstallatie voor warmte die zich in het betreffende gebouw of in een nabij gelegen gebouw of bouwwerk
      bevindt, meet de leverancier de hoeveelheid warmte die de centrale installatie produceert.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8
  - number: '8.10'
    text: Een leverancier installeert een meter bij een afleverset voor warmte.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8
  - number: '8.11'
    text: |-
      In afwijking van het tweede lid, installeert een leverancier tevens een individuele meter om het warmteverbruik
      te meten in iedere eenheid in een appartementengebouw of iedere eenheid in een multifunctioneel gebouw die warmte
      ontvangt uit een warmtenet waar dat technisch haalbaar en kostenefficiënt is.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8
  - number: '8.12'
    text: |-
      Als de installatie van een individuele meter niet technisch haalbaar of niet kostenefficiënt is, installeert een
      leverancier waar dat kostenefficiënt is individuele warmtekostenverdelers.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8
  - number: '8.13'
    text: |-
      Als de installatie van individuele warmtekostenverdelers niet kostenefficiënt is, hanteert een leverancier een
      andere kostenefficiënte methode voor de meting van het warmteverbruik.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8
  - number: '8.14'
    text: |-
      De installatie van een individuele meter om het warmteverbruik te meten als bedoeld in het elfde tot en met
      dertiende lid is in elk geval technisch haalbaar en kostenefficiënt indien:
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8
  - number: 8.14.a
    text: een bestaande meter wordt vervangen;
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8
  - number: 8.14.b
    text: een nieuwe aansluiting wordt gemaakt in een nieuw gebouw;
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8
  - number: 8.14.c
    text: een gebouw ingrijpend wordt gerenoveerd.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8
  - number: 8a.1
    text: |-
      Indien de leverancier de aan de verbruiker in rekening te brengen kosten voor de levering van warmte niet baseert
      op een individuele warmtemeter als bedoeld in [artikel 8][ref1], baseert hij, onverminderd artikel 8, tweede
      lid, de kosten met inachtneming van [artikel 2, vierde lid][ref2], op individuele warmtekostenverdelers die het
      warmteverbruik van elke radiator meten, tenzij de installatie daarvan niet kostenefficiënt is.


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0033729#Artikel2
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0033729
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 8a.2
    text: |-
      Indien de leverancier de aan de verbruiker in rekening te brengen kosten voor de levering van warmte niet baseert
      op een individuele warmtemeter of individuele warmtekostenverdelers, baseert hij de kosten met inachtneming van
      [artikel 2, vierde lid][ref1], op een voor alle verbruikers inzichtelijke kostenverdeelsystematiek.


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel2
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 8a.3
    text: |-
      De kostenverdeelsystematiek, bedoeld in het tweede lid, gaat uit van een binnen de technische en financiële
      mogelijkheden zo nauwkeurig mogelijke benadering van het werkelijke aandeel van het verbruik van de individuele
      verbruiker.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8a
  - number: 8a.4
    text: |-
      In afwijking van het derde lid kunnen als onderdeel van de kostenverdeelsystematiek aan individuele verbruikers
      worden toegerekend:
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8a
  - number: 8a.4.a
    text: kosten van verbruik in het gemeenschappelijk belang;
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8a
  - number: 8a.4.b
    text: |-
      redelijke kosten voor de uitvoering van de kostenverdeelsystematiek zelf in een appartementengebouw of in een
      multifunctioneel gebouw indien dit door een ander dan de leverancier geschiedt.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8a
  - number: 8a.5
    text: |-
      Indien een onroerende zaak, die is gebouwd voor inwerkingtreding van dit lid, bestaat uit meerdere woon -of
      bedrijfsruimten kan de leverancier het individueel warmtegebruik van de verbruiker, zoals gemeten op grond van
      [artikel 8][ref1] of [artikel 8a, eerste of tweede lid][ref2], corrigeren aan de hand van correctiefactoren die
      door de leverancier zijn vastgesteld met inachtname van de daarvoor gangbare technische normen voor:


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0033729#Artikel8a
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0033729
        artikel: 8a
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 8a.5.a
    text: de ligging van woonruimten, en
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8a
  - number: 8a.5.b
    text: leidingverliezen voor transportleidingen.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8a
  - number: 8a.6
    text: |-
      De warmtekostenverdelers en andere technische voorzieningen voor benadering, meting of registratie van het aandeel
      van de individuele verbruiker in het totale verbruik, worden aan de hand van daarvoor gangbare technische normen
      geïnstalleerd en toegepast.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8a
  - number: 8a.7
    text: |-
      Op daartoe strekkend verzoek van één of meer verbruikers laat de leverancier éénmalig door een onafhankelijke,
      voor zowel verbruiker als leverancier aanvaardbare deskundige onderzoek uitvoeren naar de mate waarin de
      kostenverdeelsystematiek voor die verbruiker of verbruikers, voldoet aan het eerste tot en met vierde lid. De helft
      van de kosten van dit onderzoek komt voor rekening van de leverancier.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8a
  - number: 8a.8
    text: |-
      Op daartoe strekkend verzoek van één of meer verbruikers laat de leverancier de werking van de
      warmtekostenverdelers controleren door een onafhankelijke, voor zowel verbruiker als leverancier aanvaardbare
      deskundige. De toedeling van de kosten van dit onderzoek tussen verbruikers en leverancier vindt plaats op basis
      van de conclusie van het onderzoek.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8a
  - number: 8a.9
    text: |-
      Indien de verbruiker of verbruikers en de leverancier niet tot overeenstemming komen over de keuze van een voor
      beiden aanvaardbare deskundige dan kan de Autoriteit Consument en Markt worden gevraagd om deze aan te wijzen.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8a
  - number: 8a.10
    text: De leverancier verleent aan het onderzoek de nodige medewerking.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8a
  - number: 8a.11
    text: |-
      Indien bestaande technische voorzieningen als bedoeld in het zesde lid worden vervangen, zorgt de leverancier dat
      de nieuwe voorzieningen van een type zijn waarvan een onafhankelijke deskundige aan de hand van daarvoor gangbare
      technische normen de deugdelijkheid heeft vastgesteld.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8a
  - number: 8a.12
    text: |-
      In dit artikel wordt onder een verbruiker mede verstaan een eindgebruiker als bedoeld in artikel 10bis, eerste
      lid, eerste alinea van [richtlijn 2012/27](32012L0027)/EU het Europees Parlement en de Raad van 25 oktober 2012
      betreffende energie-efficiëntie, tot wijziging van [Richtlijnen 2009/125/EG](32009L0125) en [2010/30](32010L0030)/
      EU en houdende intrekking van de Richtlijnen [2004/8/EG](32004L0008) en [2006/32/EG](32006L0032) (PbEU 2012, L315).
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8a
  - number: 8b
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8b
  - number: 8b.a
    text: de inrichting van energiekostenramingen en facturen inzake het verbruik van warmte,
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8b
  - number: 8b.b
    text: de frequentie van facturen inzake het verbruik van warmte,
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8b
  - number: 8b.c
    text: het verstrekken van gegevens over het verbruik van warmte,
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8b
  - number: 8b.d
    text: |-
      degenen die de informatie, bedoeld in de onderdelen a, b en c, verstrekken, welke regels kunnen verschillen per
      categorie van ontvangers van de informatie, bedoeld in de onderdelen a, b en c,
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8b
  - number: 8b.e
    text: |-
      het op verzoek van een afnemer toesturen van facturen, factureringsinformatie en energiekostenramingen, eventueel
      langs elektronische weg,
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8b
  - number: 8b.f
    text: de kosten van toegang tot meetgegevens en van facturatie;
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8b
  - number: 8b.g
    text: degenen die om de informatie, bedoeld in onderdeel e, kunnen verzoeken en
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8b
  - number: 8b.h
    text: |-
      de termijn waarbinnen een nota als bedoeld in [artikel 2, tweede lid][ref1], wordt verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel2
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '9.1'
    text: Het is verboden zonder vergunning warmte te leveren aan verbruikers.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel9
  - number: '9.2'
    text: 'Het verbod, bedoeld in het eerste lid, geldt niet ten aanzien van een leverancier die:'
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel9
  - number: 9.2.a
    text: warmte levert aan ten hoogste 10 verbruikers tegelijk,
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel9
  - number: 9.2.b
    text: per jaar niet meer warmte levert dan 10.000 gigajoules, of
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel9
  - number: 9.2.c
    text: de verhuurder of de eigenaar is van het gebouw, ten behoeve waarvan de warmte wordt geleverd.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel9
  - number: '10.1'
    text: 'Onze Minister verleent op aanvraag een vergunning indien de aanvrager genoegzaam aantoont dat hij:'
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel10
  - number: 10.1.a
    text: |-
      beschikt over de benodigde organisatorische, financiële en technische kwaliteiten voor een goede uitvoering van
      zijn taak;
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel10
  - number: 10.1.b
    text: redelijkerwijs in staat kan worden geacht de verplichtingen als opgenomen in dit hoofdstuk na te komen.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel10
  - number: '10.2'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de inhoud van en de procedure
      voor aanvraag van een vergunning en de criteria, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel10
  - number: '10.3'
    text: |-
      Onze Minister kan voorschriften en beperkingen verbinden aan een vergunning. Aan de vergunning wordt in ieder
      geval een voorschrift verbonden omtrent de minimum- en maximumtemperatuur van de te leveren warmte. De minimum- en
      maximumtemperatuur van de te leveren warmte kan voor ieder warmtenet of deel van een warmtenet verschillen.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel10
  - number: '10.4'
    text: Onze Minister kan de aan een vergunning verbonden voorschriften of beperkingen wijzigen.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel10
  - number: '10.5'
    text: |-
      Een vergunning kan slechts worden overgedragen met toestemming van Onze Minister. Het eerste tot en met het vierde
      lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel10
  - number: '11.1'
    text: |-
      Onze Minister kan een vergunning intrekken. Onze Minister gaat slechts tot intrekking van de vergunning over, voor
      zover het belang van een betrouwbare levering van warmte tegen redelijke voorwaarden en een goede kwaliteit van de
      dienstverlening aan verbruikers zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel11
  - number: '11.2'
    text: 'Onze Minister kan een vergunning intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel11
  - number: 11.2.a
    text: de houder van de vergunning dit verzoekt;
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel11
  - number: 11.2.b
    text: de vergunninghouder de aan de vergunning verbonden voorschriften of opgelegde beperkingen niet nakomt;
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel11
  - number: 11.2.c
    text: |-
      de vergunninghouder de opgedragen voorzieningen, bedoeld in [artikel 12b, tweede lid][ref1], niet treft;


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel12b
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: 12b
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 11.2.d
    text: |-
      de vergunninghouder bij de aanvraag onjuiste of onvolledige gegevens heeft verstrekt en de verstrekking van juiste
      en volledige gegevens tot een andere beschikking op de aanvraag zou hebben geleid;
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel11
  - number: 11.2.e
    text: |-
      de vergunninghouder naar het oordeel van Onze Minister om andere redenen niet langer in staat moet worden geacht de
      vergunde activiteit of in de vergunning opgenomen voorschriften na te komen.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel11
  - number: '11.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de criteria voor het
      intrekken van een vergunning en de procedure bij intrekking van een vergunning. De voordracht voor deze algemene
      maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-
      Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel11
  - number: '12.1'
    text: Een vergunninghouder biedt verbruikers een ruime keuze uit betalingswijzen.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel12
  - number: '12.2'
    text: |-
      De vergunninghouder zorgt jegens verbruikers voor een goede bereikbaarheid. De vergunninghouder handelt
      correspondentie van verbruikers binnen tien werkdagen af. Indien een oplossing in deze periode niet mogelijk is,
      ontvangt de verbruiker binnen vijf werkdagen bericht binnen welke termijn een adequate reactie kan worden verwacht.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel12
  - number: '12.3'
    text: |-
      De vergunninghouder gebruikt aan hem verstrekte gegevens over verbruikers uitsluitend voor het uitvoeren van de in
      deze wet aan de vergunninghouder opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel12
  - number: 12a.1
    text: |-
      De vergunninghouder voert een afzonderlijke boekhouding met betrekking tot de levering van warmte en, indien van
      toepassing, voor de levering van koude.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel12a
  - number: 12a.2
    text: |-
      De vergunninghouder publiceert een jaarrekening en een bestuursverslag overeenkomstig
      [titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: 12a.3
    text: |-
      Het bestuursverslag, bedoeld in het tweede lid, bevat tevens betrouwbare en op een inzichtelijke wijze vorm gegeven
      informatie over:
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel12a
  - number: 12a.3.a
    text: de door de vergunninghouder bij verbruikers in rekening gebrachte prijs;
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel12a
  - number: 12a.3.b
    text: de integrale kosten en opbrengsten die verband houden met de levering van warmte, en
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel12a
  - number: 12a.3.c
    text: de duurzaamheid van de geleverde warmte.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel12a
  - number: 12a.4
    text: |-
      De in het bestuursverslag opgenomen informatie als bedoeld in het derde lid, onderdeel a en b, is voorzien van
      een accountantsverklaring.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel12a
  - number: 12a.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de toepassing van het
      eerste, tweede en derde lid en [artikel 2, zesde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel2
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 12b.1
    text: |-
      Een leverancier of een producent, die voornemens is de levering of de productie van warmte te beëindigen dan wel
      redelijkerwijs moet voorzien dat hij niet langer aan zijn wettelijke verplichtingen zal kunnen voldoen, meldt dit
      onverwijld aan Onze Minister. Onze Minister treedt in overleg met de leverancier of de producent die de melding
      heeft gedaan alsmede met de overige bij de levering van warmte betrokken personen.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel12b
  - number: 12b.2
    text: |-
      Onze Minister kan, indien hem blijkt dat een leverancier in onvoldoende mate kan of zal kunnen voorzien in de
      levering van warmte, de leverancier opdragen voorzieningen te treffen teneinde zeker te stellen dat de levering van
      warmte, in voldoende mate plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel12b
  - number: 12b.3
    text: |-
      Onze Minister is bevoegd tot toepassing van een last onder bestuursdwang ter handhaving van een opdracht als
      bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel12b
  - number: 12b.4
    text: |-
      Indien de leverancier niet voldoet aan een opdracht als bedoeld in het tweede lid of indien naar het oordeel
      van Onze Minister door de bedrijfsvoering van deze leverancier de continuïteit of de betrouwbaarheid van de
      warmtelevering in gevaar komt en onverwijld ingrijpen noodzakelijk is, kan Onze Minister de leverancier aanzeggen
      dat hij vanaf een bepaald tijdstip voor een bepaalde termijn de opdrachten dient op te volgen die aan hem worden
      verstrekt door een door Onze Minister aangewezen persoon.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel12b
  - number: 12b.5
    text: |-
      Bij de aanzegging, bedoeld in het vierde lid, geeft Onze Minister aan ter bescherming van welk belang de aanzegging
      geschiedt. De aangewezen persoon verstrekt uitsluitend opdrachten ter bescherming van dit belang. Bij de aanzegging
      kunnen voorschriften en beperkingen worden gesteld aan de te geven opdrachten.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel12b
  - number: 12b.6
    text: De leverancier verschaft de door Onze Minister aangewezen persoon desgevraagd alle medewerking.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel12b
  - number: 12b.7
    text: |-
      Voor schade ten gevolge van handelingen die zijn verricht in strijd met een opdracht als bedoeld in het vierde lid,
      zijn bestuurders persoonlijk aansprakelijk tegenover de leverancier.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel12b
  - number: 12c.1
    text: |-
      Onze Minister kan een of meer vergunninghouders aanwijzen als noodleverancier om warmte te leveren aan door hem
      nader aangeduide verbruikers.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel12c
  - number: 12c.2
    text: |-
      Indien de leverancier tevens netbeheerder is, krijgt de noodleverancier het beheer over het warmtenet en verricht
      correctieve onderhoudswerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel12c
  - number: 12c.3
    text: |-
      Onze Minister kan voorwaarden en beperkingen verbinden aan de aanwijzing, bedoeld in het eerste lid, en stelt bij
      de aanwijzing een redelijke vergoeding vast voor de uitvoering van de opgedragen taak.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel12c
  - number: 12c.4
    text: |-
      Onze Minister kan een producent opdragen warmte te produceren en deze warmte ter beschikking te stellen aan een
      door hem aangewezen noodleverancier.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel12c
  - number: 12c.5
    text: |-
      Onze Minister kan voorwaarden en beperkingen verbinden aan de opdracht, bedoeld in het vierde lid, en stelt bij de
      opdracht een redelijke vergoeding vast voor de uitvoering van de opgedragen taak.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel12c
  - number: 12c.6
    text: |-
      Een ieder is verplicht medewerking te verlenen aan de noodleverancier, bedoeld in het eerste lid, of de producent,
      bedoeld in het vierde lid, voor zover dit redelijkerwijs van hem kan worden verlangd.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel12c
  - number: 12d.1
    text: |-
      Onze Minister kan een netbeheerder als bedoeld in [artikel 2, eerste lid, van de Gaswet][ref1], opdracht geven
      tot het aanleggen van een gastransportnet in het door hem aangewezen gebied. Verbruikers ontvangen een gehele of
      gedeeltelijke tegemoetkoming in verband met de kosten van de aansluiting op het gastransportnet.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel2
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel12d
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '2'
  - number: 12d.2
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de hoogte van de vergoeding, bedoeld in het eerste lid
      en over de wijze waarop de betrokken verbruikers een gehele of gedeeltelijke tegemoetkoming ontvangen, waarbij de
      hoogte van de tegemoetkoming voor verschillende groepen verbruikers verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel12d
  - number: 12d.3
    text: |-
      De opdracht, bedoeld in het eerste lid, wordt niet gegeven dan nadat Onze Minister onderzocht heeft of anders dan
      door aanleg van een gastransportnet voorzien kan worden in een volwaardig alternatief voor het warmtenet. Indien
      uit dit onderzoek blijkt dat een volwaardig alternatief beschikbaar is dat uit oogpunt van duurzaamheid, kosten of
      een ander publiek belang de voorkeur verdient bevordert Onze Minister de totstandkoming van dat alternatief.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel12d
  - number: '13.1'
    text: |-
      Onze Minister kan van een producent, een leverancier of een verbruiker de gegevens en inlichtingen verlangen
      die hij nodig heeft voor de uitvoering van deze wet en voor het opstellen van het energierapport, bedoeld in
      [artikel 2 van de Elektriciteitswet 1998][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel2
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '2'
  - number: '13.2'
    text: |-
      Degene aan wie een verzoek is gedaan om gegevens en inlichtingen te verstrekken, is verplicht binnen de door Onze
      Minister te stellen redelijke termijn alle medewerking te verlenen die hij redelijkerwijs kan vorderen bij de
      uitoefening van zijn bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel13
  - number: '13.3'
    text: |-
      Onze Minister gebruikt gegevens of inlichtingen welke hij heeft verkregen in verband met enige werkzaamheid ten
      behoeve van de uitvoering van een van zijn taken op grond van deze wet uitsluitend voor de uitoefening van die
      taak.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel13
  - number: '15'
    text: |-
      De Autoriteit Consument en Markt is belast met taken ter uitvoering van deze wet en het toezicht op de naleving van
      deze wet, met uitzondering van [artikel 3d, tweede lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel3d
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: 3d
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '16'
    text: |-
      De Autoriteit Consument en Markt kan bij een producent, leverancier of verbruiker metingen verrichten of doen
      verrichten. De producent, leverancier of verbruiker gedoogt dat de metingen in zijn leidingen, installaties of
      hulpmiddelen worden verricht.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel16
  - number: '17'
    text: De Autoriteit Consument en Markt kan een bindende gedragslijn opleggen in verband met de naleving van deze wet.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel17
  - number: '18.1'
    text: |-
      De Autoriteit Consument en Markt kan in geval van overtreding van het bepaalde bij of krachtens deze wet de
      overtreder een last onder dwangsom opleggen.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel18
  - number: '18.2'
    text: |-
      De Autoriteit Consument en Markt kan in geval van overtreding van het bepaalde bij of krachtens de
      [artikelen 2][ref1], [4a, eerste lid][ref2], [5, eerste en vierde lid][ref3], [5a, eerste lid][ref4],
      [9, eerste lid][ref5], [13][ref6], [17][ref7], [21, eerste tot en met derde lid][ref8] en [40][ref9] de overtreder
      per overtreding een bestuurlijke boete opleggen van ten hoogste € 900.000 of, indien dat meer is, 1% van de omzet
      van de overtreder.


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033729#Artikel4a
      [ref3]: https://wetten.overheid.nl/BWBR0033729#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0033729#Artikel5a
      [ref5]: https://wetten.overheid.nl/BWBR0033729#Artikel9
      [ref6]: https://wetten.overheid.nl/BWBR0033729#Artikel13
      [ref7]: https://wetten.overheid.nl/BWBR0033729#Artikel17
      [ref8]: https://wetten.overheid.nl/BWBR0033729#Artikel21
      [ref9]: https://wetten.overheid.nl/BWBR0033729#Artikel40
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0033729
        artikel: 4a
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref3
        bwb_id: BWBR0033729
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref4
        bwb_id: BWBR0033729
        artikel: 5a
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref5
        bwb_id: BWBR0033729
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref6
        bwb_id: BWBR0033729
        artikel: '13'
        hoofdstuk: '3'
      - id: ref7
        bwb_id: BWBR0033729
        artikel: '17'
        hoofdstuk: '4'
      - id: ref8
        bwb_id: BWBR0033729
        artikel: '21'
        hoofdstuk: '6'
      - id: ref9
        bwb_id: BWBR0033729
        artikel: '40'
        hoofdstuk: '10'
  - number: '18.3'
    text: |-
      De bestuurlijke boete die ingevolge het tweede lid ten hoogste kan worden opgelegd wordt verhoogd met 100%,
      indien binnen een tijdvak van vijf jaar voorafgaand aan de dagtekening van het van de overtreding opgemaakte
      rapport, bedoeld in [artikel 5:48, eerste lid, van de Algemene wet bestuursrecht][ref1], een aan die overtreder
      voor een eerdere overtreding van eenzelfde of een soortgelijk wettelijk voorschrift opgelegde bestuurlijke boete
      onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '20.1'
    text: |-
      Overeenkomstig bij of krachtens algemene maatregel van bestuur te stellen regels is een vergoeding verschuldigd
      voor het verlenen van een vergunning als bedoeld in [artikel 10, eerste lid][ref1], alsmede voor het verkrijgen
      van toestemming als bedoeld in artikel 10, vijfde lid, voor ten hoogste de kosten die gemoeid zijn met het geven
      van die beschikkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel10
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '20.2'
    text: Het verschuldigde bedrag kan worden ingevorderd bij dwangbevel.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel20
  - number: '21.1'
    text: |-
      Een netbeheerder en een leverancier die van diens warmtenet gebruik maakt treden op verzoek van een producent in
      overleg met die producent over toegang tot het warmtenet ten behoeve van transport van warmte.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel21
  - number: '21.2'
    text: 'Na ontvangst van een verzoek geeft de netbeheerder de verzoeker inzicht in:'
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel21
  - number: 21.2.a
    text: de beschikbare transportcapaciteit op het net;
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel21
  - number: 21.2.b
    text: in voorkomend geval de tarieven die worden gehanteerd voor het transport van de warmte;
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel21
  - number: 21.2.c
    text: technische kenmerken van het net, waaronder de druk en het debiet, en
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel21
  - number: 21.2.d
    text: transportprofiel dat inzicht geeft in de benodigde transportcapaciteit op verschillende momenten.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel21
  - number: '21.3'
    text: 'Na ontvangst van een verzoek geeft de leverancier de verzoeker inzicht in:'
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel21
  - number: 21.3.a
    text: het afnameprofiel en de jaarlijkse afname op het betreffende warmtenet, en
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel21
  - number: 21.3.b
    text: de vraag naar warmte en de hoeveelheid daarvan waarvoor productiecapaciteit beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel21
  - number: '21.4'
    text: |-
      Een netbeheerder doet een verzoeker als bedoeld in het eerste lid uit eigener beweging of op diens verzoek een
      deugdelijk gemotiveerde schriftelijke beslissing toekomen over het verlenen van toegang tot het warmtenet.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel21
  - number: '21.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de eisen waaraan een verzoek als bedoeld
      in het eerste lid ten minste moet voldoen, de termijn waarbinnen de informatie, bedoeld in het tweede en derde lid,
      moet zijn verschaft en de termijn waarbinnen het overleg, bedoeld in het eerste lid, wordt gestart.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel21
  - number: '23'
    text: |-
      Een representatieve organisatie wordt geacht belanghebbende te zijn bij besluiten, niet zijnde beschikkingen,
      genomen op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel23
  - number: '24.1'
    text: |-
      In dit artikel wordt onder «inbreuk» verstaan: elk handelen of nalaten van een leverancier dat in strijd is met
      het bepaalde in de [artikelen 2, derde lid][ref1], [4, eerste lid][ref2], of [5, eerste lid][ref3] en dat nadeel
      toebrengt aan de collectieve belangen van verbruikers.


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033729#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0033729#Artikel5
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0033729
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref3
        bwb_id: BWBR0033729
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '24.2'
    text: |-
      Op verzoek van een representatieve organisatie kan het College van Beroep voor het bedrijfsleven bevelen dat een
      inbreuk door de leverancier die de inbreuk maakt wordt gestaakt.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel24
  - number: '24.3'
    text: |-
      Het College kan eveneens worden verzocht degene die de inbreuk maakt te veroordelen tot het openbaar maken of
      openbaar laten maken van de beschikking, zulks op een door het College te bepalen wijze en op kosten van de door
      het College aan te geven partij of partijen.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel24
  - number: '24.4'
    text: |-
      Geschillen terzake de tenuitvoerlegging van de in het eerste en tweede lid bedoelde veroordelingen worden bij
      uitsluiting door het College van Beroep voor het bedrijfsleven beslist.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel24
  - number: '25.1'
    text: |-
      Onze Minister is belast met het uitgeven en innemen via een elektronisch systeem van garanties van oorsprong voor
      warmte uit hernieuwbare energiebronnen.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel25
  - number: '25.2'
    text: |-
      Onze Minister opent op aanvraag van een in Nederland gevestigde producent, leverancier, handelaar of afnemer
      een rekening voor warmte uit hernieuwbare bronnen. Bij deze aanvraag overlegt de producent het resultaat van de
      vaststelling, bedoeld in [artikel 27][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel27
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '27'
        hoofdstuk: '8'
  - number: '25.3'
    text: |-
      Onze Minister boekt op aanvraag garanties van oorsprong voor warmte uit hernieuwbare energiebronnen op een daarbij
      aangegeven rekening voor hernieuwbare bronnen, indien een Nederland gevestigde producent bij deze aanvraag de
      productiemeetgegevens overlegt.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel25
  - number: '26'
    text: |-
      Onze Minister kan de taken, bedoeld in [artikel 25][ref1], mandateren aan een niet-ondergeschikte die onafhankelijk
      is van producenten, leveranciers en handelaren.


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel25
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '25'
        hoofdstuk: '8'
  - number: '27'
    text: |-
      Een meetbedrijf stelt op verzoek van een producent vast of diens productie-installatie geschikt is voor de
      opwekking van warmte uit hernieuwbare energiebronnen alsmede of de inrichting om te meten geschikt is voor de
      meting van de warmte uit hernieuwbare energiebronnen die met de productie-installatie wordt opgewekt en op een
      warmtenet ingevoed.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel27
  - number: '28'
    text: |-
      Een garantie van oorsprong voor warmte uit hernieuwbare energiebronnen toont bij uitsluiting aan dat de daarop
      aangegeven hoeveelheid warmte is opgewekt uit hernieuwbare bronnen.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel28
  - number: '29.1'
    text: |-
      Onze Minister stelt bij ministeriële regeling de tarieven vast voor kosten die gepaard gaan met handelingen met
      betrekking tot garanties van oorsprong voor warmte uit hernieuwbare energiebronnen.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel29
  - number: '29.2'
    text: 'Onze Minister stelt bij ministeriële regeling regels met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel29
  - number: 29.2.a
    text: |-
      de informatie die door producenten, leveranciers, handelaars, afnemers of netbeheerders verstrekt wordt aan Onze
      Minister;
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel29
  - number: 29.2.b
    text: het uitgeven en de geldigheidsduur van garanties van oorsprong voor warmte uit hernieuwbare energiebronnen;
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel29
  - number: 29.2.c
    text: het vermelden van gegevens op garanties van oorsprong voor warmte uit hernieuwbare energiebronnen;
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel29
  - number: 29.2.d
    text: |-
      de voorwaarden waaronder en de wijze waarop producenten, leveranciers, handelaars of afnemers gebruik kunnen
      maken van de door hen verkregen garanties van oorsprong voor warmte uit hernieuwbare energiebronnen of deze kunnen
      verhandelen;
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel29
  - number: 29.2.e
    text: |-
      de vaststelling, bedoeld in [artikel 27][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel27
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '27'
        hoofdstuk: '8'
  - number: '38'
    text: |-
      Voor de toepassing van de [Belemmeringenwet Verordeningen][ref1] en de [Belemmeringenwet Privaatrecht][ref2] worden
      werken, die worden of zijn uitgevoerd ten behoeve van de levering van warmte, aangemerkt als openbare werken van
      algemeen nut.


      [ref1]: https://wetten.overheid.nl/BWBR0001865
      [ref2]: https://wetten.overheid.nl/BWBR0001936
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0001865
      - id: ref2
        bwb_id: BWBR0001936
  - number: '39.1'
    text: |-
      Provinciale staten en de gemeenteraad zijn niet bevoegd de productie en levering van warmte in het belang van de
      energievoorziening aan regels te binden.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel39
  - number: '39.2'
    text: |-
      Het eerste lid laat onverlet de bevoegdheden van provinciale staten en gemeenteraden bij aanleg, herstel,
      uitbreiding of vernieuwing van netten.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel39
  - number: '40'
    text: 'Een leverancier meldt zo spoedig mogelijk na inwerkingtreding van deze wet aan de Autoriteit Consument en Markt:'
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel40
  - number: 40.a
    text: de naam en het adres van de leverancier, en
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel40
  - number: 40.b
    text: |-
      een beschrijving van de door leverancier te exploiteren warmtenetten waarbij in ieder geval het aantal verbruikers
      en het aantal aan verbruikers geleverde gigajoules is opgenomen.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel40
  - number: '41.1'
    text: |-
      Het in [artikel 2 van de Elektriciteitswet 1998][ref1] bedoelde energierapport geeft mede richting aan van
      rijkswege te nemen beslissingen in de periode, bedoeld in dat artikel, voor zover daarbij het belang van het
      betrouwbaar, duurzaam, milieuhygiënisch en doelmatig functioneren van de warmtevoorziening in beschouwing moet of
      kan worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel2
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '2'
  - number: '41.2'
    text: |-
      Het energierapport bevat in ieder geval een overzicht van de prijsontwikkelingen met betrekking tot levering van
      warmte.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel41
  - number: '42.1'
    text: |-
      Leveranciers die op het tijdstip van inwerkingtreding van deze wet reeds warmte leveren en op grond van
      [artikel 9][ref1] vergunningplichtig worden, vragen binnen twee jaar na dat tijdstip een vergunning aan als
      bedoeld in [artikel 10, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0033729#Artikel10
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0033729
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '42.2'
    text: |-
      Onverminderd het eerste lid gelden voor een vergunningplichtige leverancier, tot het tijdstip waarop onherroepelijk
      op de vergunningaanvraag is beslist, de eisen die zijn opgenomen in [paragraaf 2.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0033729
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 42a
    text: |-
      [Artikel 3c][ref1] is niet van toepassing op een overeenkomst die is gesloten is voor inwerkingtreding van dat
      artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel3c
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: 3c
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '43'
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Infrastuctuur en Milieu, aan een producent eisen
      stellen met betrekking tot het nuttig gebruik van restwarmte. Bij of krachtens algemene maatregel van bestuur
      kunnen ter zake nadere regels worden gesteld; deze kunnen tevens betrekking hebben op het instellen van een heffing
      ter zake van lozing van restwarmte dan wel op een verbod daarvan.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel43
  - number: '45.1'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel45
  - number: '45.2'
    text: |-
      Het koninklijk besluit waardoor [artikel 7, tweede tot en met vierde lid][ref1], in werking treedt, treedt niet
      eerder in werking dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel7
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 45a
    text: |-
      Op een bij koninklijk besluit te bepalen tijdstip komt [artikel 8, derde lid][ref1], te luiden: Meetinrichtingen
      zijn op afstand uitleesbaar, tenzij dit niet kostenefficiënt is.


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel8
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '46'
    text: 'Deze wet wordt aangehaald als: Warmtewet.'
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel46
