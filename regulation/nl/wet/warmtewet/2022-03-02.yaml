  - number: '1.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen soorten installaties worden aangewezen die niet worden aangemerkt als een
      «afleverset voor warmte».
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel1
  - number: 1a.1
    text: |-
      Deze wet is van toepassing op levering van warmte aan verbruikers, met uitzondering van levering van warmte door
      een leverancier die:
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel1a
  - number: 1a.1.a
    text: |-
      tevens optreedt als verhuurder voor de verbruiker aan wie hij warmte levert ten behoeve van de door hem aan de
      verbruiker verhuurde woon- of bedrijfsruimte;
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel1a
  - number: 1a.1.b
    text: 'tevens de vereniging van eigenaars of een daarmee vergelijkbare rechtsvorm is waarbij:'
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel1a
  - number: 1a.1.b.i
    text: de verbruiker aan wie warmte geleverd wordt als lid is aangesloten, of
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel1a
  - number: 1a.1.b.ii
    text: een verhuurder als bedoeld in onderdeel a als lid is aangesloten, of
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel1a
  - number: 1a.1.c
    text: |-
      tevens een vereniging van eigenaars is waarbij meerdere verenigingen van eigenaars of daarmee vergelijkbare
      rechtsvormen als bedoeld in onderdeel b zijn aangesloten
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel1a
  - number: 1a.2
    text: |-
      In afwijking van het eerste lid zijn de [artikelen 8, tweede tot en met vierde, zesde, zevende en negende lid][ref1],
      [8a][ref2] en [8b][ref3] van toepassing op leveranciers als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0033729#Artikel8a
      [ref3]: https://wetten.overheid.nl/BWBR0033729#Artikel8b
    url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
