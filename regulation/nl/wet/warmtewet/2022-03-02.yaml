preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is, omwille van de bescherming van de verbruikers,
    met inachtneming van het belang van een betrouwbaar, duurzaam, milieuhygiënisch verantwoord en een doelmatig
    functioneren van de warmtevoorziening een regeling tot stand te brengen met betrekking tot de levering van warmte
    aan verbruikers;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0033729/2022-03-02#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *aansluiting:* een individuele of centrale
      aansluiting;
        - *afleverset voor warmte:* installatie waarmee ten behoeve van warmtelevering aan een verbruiker energieoverdracht
      plaatsvindt tussen een warmtenet en een binneninstallatie of een inpandig leidingstelsel;
        - *Autoriteit Consument en Markt:* de Autoriteit Consument en Markt, genoemd in
      [artikel 2, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref1];
        - *bindende gedragslijn:* een zelfstandige last die niet wegens een overtreding wordt opgelegd;
        - *binneninstallatie:* leidingen, installaties en hulpmiddelen, niet zijnde de afleverset
      voor warmte of de meetinrichting, die zijn gelegen in een onroerende zaak als bedoeld in
      [artikel 16, onderdelen a en c tot en met e, van de Wet waardering onroerende zaken][ref2] van een verbruiker
      en bestemd voor toe- en afvoer van warmte ten behoeve van die onroerende zaak, met uitzondering van leidingen,
      installaties en hulpmiddelen die strekken tot doorlevering van warmte naar een andere onroerende zaak, waarbij
      de binneninstallatie aan de zijde van het warmtenet of het inpandig leidingstelsel is afgegrensd door: i. de
      hoofdafsluiters waar de individuele afleverset gekoppeld is aan het warmtenet of het inpandig leidingstelsel, of
      ii. indien er geen hoofdafsluiters aanwezig zijn, een in de warmteleveringsovereenkomst overeen te komen fysiek
      aanwijsbaar punt;
        - *centrale aansluiting:* leidingen bestemd voor het transport van warmte bestemd voor verbruikers aangesloten
      op het inpandig leidingstelsel, gelegen tussen het warmtenet en het inpandig leidingstelsel, waarbij de centrale
      aansluiting: 'i. aan de zijde van het inpandig leidingstelsel is afgegrensd door: – de hoofdafsluiters waaraan de'
      collectieve afleverset voor warmte of het inpandig leidingstelsel gekoppeld is, of – indien er geen hoofdafsluiters
      aanwezig zijn, een in de warmteleveringsovereenkomst overeen te komen fysiek aanwijsbaar punt, en ii. aan de zijde
      van het warmtenet is afgegrensd door: – de aftakking van het warmtenet, waarna de leidingen en daaraan verbonden
      hulpmiddelen bestemd zijn voor het transport van warmte naar het inpandig leidingstelsel, of – indien er geen
      aftakking aanwezig is, een in de warmteleveringsovereenkomst overeen te komen fysiek aanwijsbaar punt.
        - *collectieve afleverset voor warmte:* een afleverset voor warmte waarmee ten behoeve van warmtelevering aan
      verbruikers energieoverdracht plaatsvindt tussen een warmtenet en een inpandig leidingstelsel;
        - *garantie van oorsprong voor warmte uit hernieuwbare energiebronnen:* gegevens op een rekening die betrekking
      hebben op warmte uit hernieuwbare energiebronnen en waarmee wordt aangetoond dat een producent met zijn installatie
      een hoeveelheid warmte uit hernieuwbare energiebronnen heeft opgewekt;
        - *gebouweigenaar:* de eigenaar van een gebouw of, in het geval van gedeeld eigendom, de eigenaars verenigd in een
      vereniging van eigenaars of een daarmee vergelijkbare rechtsvorm;
        - *hernieuwbare energiebronnen:* hernieuwbare energiebronnen als bedoeld in artikel 2 van de [richtlijn 2009/28/
      EG](32009L0028) van het Europees Parlement en de Raad van 23 april 2009 ter bevordering van het gebruik van energie
      uit hernieuwbare bronnen en houdende wijziging en intrekking van [Richtlijn 2001/77/EG](32001L0077) en [Richtlijn
      2003/30/EG](32003L0030) (Pb EU 2009, L 140);
        - *individuele aansluiting:* één of meer leidingen en daarmee verbonden hulpmiddelen bestemd voor transport
      van warmte tussen een binneninstallatie van een individuele verbruiker en een warmtenet of een inpandig
      leidingstelsel, waarbij de individuele aansluiting: i. aan de zijde van de binneninstallatie is afgegrensd door: –
      de hoofdafsluiters waaraan de individuele afleverset voor warmte of de binneninstallatie gekoppeld is, of – indien
      er geen hoofdafsluiters aanwezig zijn, een of meerdere in de warmteleveringsovereenkomst overeen te komen fysiek
      aanwijsbare punten, en ii. aan de zijde van het warmtenet of het inpandig leidingstelsel is afgegrensd door: – de
      aftakking van het warmtenet of het inpandig leidingstelsel, waarna de leidingen en daaraan verbonden hulpmiddelen
      bestemd zijn voor de warmtelevering aan de individuele verbruiker, of – indien er geen aftakking aanwezig is, een
      in de warmteleveringsovereenkomst overeen te komen fysiek aanwijsbaar punt.
        - *individuele afleverset voor warmte:* afleverset voor warmte waarmee ten behoeve van warmtelevering aan een
      verbruiker energieoverdracht plaatsvindt tussen een warmtenet en een binneninstallatie;
        - *inpandig leidingstelsel:* één of meer van een gebouw deel uitmakende leidingen en daarmee verbonden
      hulpmiddelen ten behoeve van transport van warmte tussen een centrale aansluiting van een gebouw op een
      warmtenet of een productie-installatie en de individuele aansluiting van een onroerende zaak als bedoeld in
      [artikel 16, onderdeel c, van de Wet waardering onroerende zaken][ref3];
        - *meetbedrijf:* een organisatorische eenheid die zich bezig houdt met het collecteren, valideren en vaststellen
      van meetgegevens betreffende warmte;
        - *leverancier:* een persoon die zich bezighoudt met de levering van warmte;
        - *levering van warmte:* de aflevering van warmte aan verbruikers;
        - *netbeheerder:* degene die een warmtenet beheert;
        - *Onze Minister:* Onze Minister van Economische Zaken;
        - *producent:* een persoon die zich bezighoudt met de productie van warmte;
        - *representatieve organisatie:* een rechtspersoon die de belangen vertegenwoordigt van producenten, leveranciers
      of verbruikers in de warmtesector;
        - *verbruiker:* een persoon die warmte afneemt van een warmtenet of een inpandig leidingstelsel en: i. een
      individuele aansluiting heeft van maximaal 100 kilowatt, of ii. een centrale aansluiting heeft, warmte levert aan
      een verbruiker als bedoeld onder i en tevens: 1° optreedt als verhuurder voor een verbruiker als bedoeld onder i,
      of 2° een vereniging van eigenaars of een daarmee vergelijkbare rechtsvorm is waarbij een verbruiker als bedoeld
      onder i is aangesloten;
        - *vergunninghouder:* de houder van een vergunning als bedoeld in [artikel 9][ref4];
        - *verhuurder:* een eigenaar van een voor verhuur bestemde woonruimte of bedrijfsruimte in Nederland, of degene die
      door die eigenaar gevolmachtigd is namens hem op te treden;
        - *warmte:* thermische energie die ten behoeve van ruimteverwarming of verwarming van tapwater wordt geleverd door
      middel van transport van water;
        - *warmtenet:* het geheel van tot elkaar behorende, met elkaar verbonden leidingen, bijbehorende installaties en
      overige hulpmiddelen dienstbaar aan het transport van warmte, behoudens voor zover deze leidingen, installaties
      en hulpmiddelen zijn gelegen in een inpandig leidingstelsel, een binneninstallatie of een gebouw of werk
      van een producent en strekken tot toe- of afvoer van warmte ten behoeve van dat inpandig leidingstelsel, die
      binneninstallatie of dat gebouw of werk van een producent;
        - *warmte uit hernieuwbare energiebronnen:* warmte die is opgewekt in een productie-installatie die uitsluitend
      gebruik maakt van hernieuwbare energiebronnen of is opgewekt met hernieuwbare energiebronnen in een hybride
      productie-installatie die ook gebruik maakt van fossiele energiebronnen;
        - *zelfstandige last:* de enkele last tot het verrichten van bepaalde handelingen, bedoeld in
      [artikel 5:2, tweede lid, van de Algemene wet bestuursrecht][ref5], ter bevordering van de naleving van wettelijke
      voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0007119#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0033729#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
